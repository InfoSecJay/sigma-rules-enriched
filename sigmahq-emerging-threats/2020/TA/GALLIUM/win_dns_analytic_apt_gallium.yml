note: |
  ### Technical Context

  This Sigma rule detects DNS queries to known malicious domains associated with the GALLIUM threat actor group. The likely objective of these requests is to establish command and control (C2) functionality or to exfiltrate data, as GALLIUM is known for targeting telecom sectors for surveillance and data theft. Relevant MITRE ATT&CK tactics and techniques included are: **Credential Access (T1110)** and **Command and Control (T1071)**.

  The primary telemetry sources required are from the Windows DNS Server's analytical event logs, specifically looking for Event ID 257. The security impact is significant if these queries are part of a successful intrusion, indicating active compromise or data exfiltration attempts. This detection does NOT confirm malicious activity on its own; a successful connection could instead indicate legitimate use of those domains.

  ### Investigation Steps

  - **Check DNS query logs:** Review the DNS Server Analytical logs for Event ID 257 to find exact queries made to the specified domains (e.g., `asyspy256.ddns.net`, `hotkillmail9sddcc.ddns.net`). Note the source IP addresses for further investigation.

  - **Identify the querying host:** Validate the source IP addresses of the DNS requests against the asset inventory to see if they correspond to known internal systems or authorized services. Legitimate activity will typically originate from well-known internal services.

  - **Correlate with firewall logs:** Check firewall logs for outbound connections to the IP addresses corresponding to the domains queried. Look for Event IDs related to blocked or allowed outbound traffic on the relevant ports (usually TCP 80/443) to determine if there was an actual connection.

  - **Assess user activity:** Investigate user activity around the time of the queries, such as logged-in users and recent account activities, looking for unusual behaviors or access patterns that correlate with known malicious indicators.

  - **Check for other related alerts:** Review for related or companion detections that may indicate a broader compromise, particularly any alerts related to credential theft or abnormal command-and-control traffic.

  - **Validate for false positives:** Determine if the domains queried have been flagged as benign or associated with known legitimate services in your environment to rule out false positives.

  ### Prioritization

  This alert is high priority due to the potential impact on critical systems—especially in telecom environments—and the likelihood that these domains are used in active attacks by GALLIUM. The behavior is weaponized and indicative of compromise if confirmed through other investigative steps.

  ### Blind Spots and Assumptions

  The detection may be limited by environments where DNS traffic is encrypted (like DNS over HTTPS), which could evade this logging. Comprehensive monitoring requires ensuring that DNS Server Analytical logs are enabled and appropriately configured. Legitimate activities include the use of the flagged domains for software updates or other vendor communications. A related detection rule for general suspicious DNS traffic can enhance coverage against similar threats.

