detection:
  selection1:
    CommandLine|contains:
    - 'dll,MyStart'
    - 'dll MyStart'
  selection2a:
    CommandLine|endswith: ' MyStart'
  selection2b:
    CommandLine|contains: 'rundll32.exe'
  condition: selection1 or ( selection2a and selection2b )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of DLLs associated with the TAIDOOR RAT, specifically through command lines that include 'dll MyStart' or 'rundll32.exe' calls. The likely attacker objective is to establish a foothold within the Windows environment for command-and-control (C2) communications or data exfiltration. This behavior maps to the MITRE ATT&CK technique T1055.001: Process Injection.

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 (process creation) and Sysmon Event ID 1 (process creation events), which provide insights into command-line arguments used during execution. If malicious, this behavior could lead to unauthorized system access and control, allowing an attacker to execute commands, steal data, or further compromise the environment. Importantly, this detection does NOT confirm that TAIDOOR RAT is present solely based on detected command-line patterns; further analysis is required to determine the broader context of the detected behavior.

  ### Investigation Steps

  - **Review command-line arguments for malicious indicators:** Examine Security Event ID 4688 logs for processes initiated by `rundll32.exe` that contain 'dll MyStart'. The presence of these keywords is a strong indicator of potential TAIDOOR RAT activity.

  - **Validate parent process relationships:** Use Sysmon Event ID 1 to identify the parent process of the suspicious `rundll32.exe` invocation. Legitimate process creation generally stems from trusted system processes, while unexpected spawning from uncommon parent processes (e.g., non-system applications) could indicate malicious activity.

  - **Check for persistent behavior:** Look in Windows Services or Task Scheduler for recurring tasks or services associated with the detected process. Malicious configurations often include persistence through scheduling or service creation.

  - **Assess for signs of infection:** Review network logs (e.g., Windows Firewall logs or network monitoring tools) for anomalous outbound connections initiated by the same process, especially toward known malicious IP addresses or C2 endpoints.

  - **Correlate with threat intelligence:** Use threat intelligence platforms to cross-reference the detected command lines with known IOCs associated with the TAIDOOR RAT. This may include checks against indicators of compromise or recent advisories (e.g., CISA reports).

  - **Document legitimate use cases:** Consider application logs to identify if similar DLL loading occurs in known applications (e.g., multimedia applications may load DLLs legitimately). Activity associated with familiar applications may indicate benign usage, while unusual variations suggest investigation.

  ### Prioritization

  This alert is classified as high severity due to the potential implications of TAIDOOR RAT presence in the environment. The affected systems are likely critical, and the specific behaviors detected are commonly weaponized in targeted attacks, making quick and thorough investigation essential.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through sanitized command lines. Attackers might alter process names or utilize other execution methods like reflective DLL injection, which wouldn't be captured here. Reliable detection requires Sysmon and event logging to be adequately configured; absence of these logs could lead to missed detections. Legitimate administrative scripts or applications may trigger similar alerts, necessitating careful review. Complementary rules monitoring for unusual parent-child process relationships may enhance coverage and reduce false positives.

