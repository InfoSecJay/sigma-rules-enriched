detection:
  selection1:
    CommandLine|contains:
    - 'dll,MyStart'
    - 'dll MyStart'
  selection2a:
    CommandLine|endswith: ' MyStart'
  selection2b:
    CommandLine|contains: 'rundll32.exe'
  condition: selection1 or ( selection2a and selection2b )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects specific command-line patterns associated with the TAIDOOR Remote Access Trojan (RAT) utilized by threat actors, primarily originating from China. The key behavior being monitored is the invocation of `rundll32.exe` with arguments that include `dll` and `MyStart`, indicating an attempt to execute potentially malicious DLLs. The likely objective of an attacker leveraging this behavior is to establish persistence or escalate privileges through covert execution techniques.

  This detection aligns with the MITRE ATT&CK techniques for Privilege Escalation (T1055.001). The primary telemetry source is Windows Process Creation logs, specifically those detailing command-line activities for the `rundll32.exe` process. If malicious, this could lead to unauthorized access to sensitive data or full system compromise. Notably, this detection does NOT confirm that the execution was malicious on its own; benign uses of `rundll32.exe` exist.

  ### Investigation Steps

  - **Review process creation logs**: Examine Security Event ID 4688 for instances of `rundll32.exe` being executed. Look for command lines containing `dll MyStart` or `dll,MyStart`. Any occurrences should be flagged for further investigation as they are suspicious.

  - **Identify associated processes**: Use Sysmon Event ID 1 to trace parent-child process relationships for the detected `rundll32.exe` invocation. Legitimate invocations typically originate from trusted system processes (e.g., Explorer.exe), whereas suspicious ones may show processes initiated by unusual parent files.

  - **Check for known indicators of compromise (IOC)**: Cross-reference the command-line arguments against threat intelligence feeds to confirm if any hashes or paths are recognized as malicious. Specifically check for hashes related to known TAIDOOR variants.

  - **Investigate network activity**: Analyze the network traffic logs for outbound connections initiated by the process involved in the detection, specifically focusing on unusual or unauthorized external IP addresses. This is particularly relevant if the system is critical for sensitive operations.

  - **Look for persistence mechanisms**: Investigate registry changes or scheduled tasks created around the same timeframe as the process execution. Malicious use of `rundll32.exe` often involves bypassing security controls by establishing persistence.

  ### Prioritization

  The alert should be considered high severity due to the potential impact on sensitive systems, particularly if they handle critical business functions or sensitive data. The likelihood of malicious use is significant, given the established use of TAIDOOR as a tool by advanced persistent threats. Execution via `rundll32.exe` is commonplace among malware techniques, increasing the priority of this alert.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential use of legitimate command-line flags that mimic malicious behavior, leading to false positives. Additionally, if endpoint logging is not adequately configured to capture all relevant process creation events, detection may be incomplete. Legitimate software installations or system updates may invoke similar command lines, resulting in false alarms. A companion detection, such as monitoring for unusual parent-child process relationships, can enhance overall coverage against evasion techniques.

