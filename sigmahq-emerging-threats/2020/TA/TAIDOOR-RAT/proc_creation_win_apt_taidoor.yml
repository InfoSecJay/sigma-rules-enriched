  ---

  ### Technical Context

  This rule detects the execution of the TAIDOOR RAT, specifically identifying command line patterns associated with loading DLLs via `rundll32.exe`, including the presence of a specific parameter "MyStart." The likely attacker objective is to maintain persistence and execute malicious payloads within the victim environment. This behavior aligns with the MITRE ATT&CK technique T1055.001 (Process Injection: DLL Injection).

  The primary telemetry source is Windows process creation logs, particularly focused on Event ID 4688, which logs the creation of processes. If malicious, the impact could be severe, including unauthorized data access, information exfiltration, and persistent control over the affected systems. It is essential to note that this detection does NOT confirm malicious intent on its own; further investigation is needed to contextualize the behavior.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 logs for instances where `rundll32.exe` is initiated with command line arguments containing "MyStart". Pay special attention to the User field; malicious instances are likely initiated by unusual or unauthorized accounts.

  - **Validate legitimate behavior:** Cross-reference detected command lines with known software installations. Legitimate applications may also use `rundll32.exe` but will typically use standard DLLs or parameters not including "MyStart".

  - **Identify high-confidence indicators:** Look for the presence of `rundll32.exe` executing with command line arguments including known malicious patterns such as "dll,MyStart". Also, check for unusual parent processes, e.g., if `rundll32.exe` is spawned by a non-standard process like a script file.

  - **Review system modifications:** Examine the Registry and file creation events (Security Event ID 4663 or Sysmon Event ID 11) for any suspicious writes to the Registry or unusual file creations associated with `MyStart.dll`, indicating a potential compromise.

  - **Assess asset criticality:** Confirm if the affected system has high privilege roles or accesses sensitive information. Investigating logging levels and permissions on such systems becomes crucial for understanding the overall risk.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential impact on critical systems and the strong likelihood of exploitation by an adversary utilizing RAT techniques. The TAIDOOR RAT known behavior is well-documented, making its detection essential for timely mitigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded if the adversary utilizes alternative, non-standard DLL loading techniques or obscures command line arguments. The environment must have logging of process creations enabled at the correct level (Audit Process Creation) for reliable detection. Legitimate administrative tasks or software configurations may trigger this alert, particularly those involving `rundll32.exe`. A related detection to reinforce coverage would be tracking abnormal network connections after DLL execution, which could highlight data exfiltration attempts.

