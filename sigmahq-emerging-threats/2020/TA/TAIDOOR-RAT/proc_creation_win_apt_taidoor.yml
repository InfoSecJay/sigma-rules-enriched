logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains:
    - 'dll,MyStart'
    - 'dll MyStart'
  selection2a:
    CommandLine|endswith: ' MyStart'
  selection2b:
    CommandLine|contains: 'rundll32.exe'
  condition: selection1 or ( selection2a and selection2b )
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the usage of the TAIDOOR RAT (Remote Access Trojan) based on the specific command line patterns associated with its DLL loading behavior. The TAIDOOR RAT is known for its ability to persist on infected systems, perform remote operations, and evade detection, making it a potent tool for attackers. The likely objective of an attacker deploying TAIDOOR is to gain unauthorized access to sensitive data, maintain long-term persistence, and execute further malicious actions within a target environment.

  Relevant MITRE ATT&CK techniques include **T1055.001: Process Injection** and **T1071.001: Application Layer Protocol - Web Protocols**, which outline how adversaries can use process injection to run malicious code and communicate over standard network protocols. The primary data source for this detection is **process creation events**, which capture details about command-line arguments used to launch processes on Windows systems, enabling the identification of suspicious command line patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for the presence of command lines that contain the specific patterns ('dll,MyStart' or 'rundll32.exe MyStart'), which indicate potential TAIDOOR RAT activity.
  - **Analyze Parent Process Relationships:** Investigate the parent-child process relationships to understand how the suspected DLL was loaded and identify any suspicious parent processes that may have initiated the DLL load.
  - **Check for Unusual Network Activity:** Inspect network connection logs for any outbound connections that coincide with the identified process activity, particularly those using unusual or unexpected web protocols.
  - **Correlate with User Activity:** Determine if there are any user accounts that are associated with the detected process execution. Check their activity for any anomalies or patterns that suggest unauthorized use or compromise.

  ### Prioritization
  The severity of this alert is high due to the potential impact of a RAT like TAIDOOR on an enterprise environment. The likelihood of advanced persistent threats using TAIDOOR to establish footholds in organizations necessitates urgent investigation and response.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection logic is the possibility of evasion through alternate command line formatting or non-standard DLL invocation patterns that are not captured by the provided conditions. The effectiveness of this rule assumes that comprehensive process creation logging is enabled and that all relevant logs are being sent to the monitoring system for analysis. If logs are missing or improperly configured, there may be gaps in detection coverage.

