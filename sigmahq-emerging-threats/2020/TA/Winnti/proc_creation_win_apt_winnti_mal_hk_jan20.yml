detection:
  selection1:
    ParentImage|contains:
    - 'C:\Windows\Temp'
    - '\hpqhvind.exe'
    Image|startswith: 'C:\ProgramData\DRM'
  selection2:
    ParentImage|startswith: 'C:\ProgramData\DRM'
    Image|endswith: '\wmplayer.exe'
  selection3:
    ParentImage|endswith: '\Test.exe'
    Image|endswith: '\wmplayer.exe'
  selection4:
    Image: 'C:\ProgramData\DRM\CLR\CLR.exe'
  selection5:
    ParentImage|startswith: 'C:\ProgramData\DRM\Windows'
    Image|endswith: '\SearchFilterHost.exe'
  condition: 1 of selection*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the execution of processes commonly associated with the Winnti malware, specifically in contexts where legitimate processes such as `wmplayer.exe` are spawned from unusual parent images. The likely attacker objective is to persistently maintain access to compromised systems or execute further malicious actions leveraging trusted applications as a cover. Relevant MITRE ATT&CK tactics include **Persistence (T1574.001)** and **Execution (T1203)**, with a focus on using trusted application paths for exploitation.

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, to capture detailed process creation events. The security impact of this behavior can range from data exfiltration to lateral movement within the network if confirmed malicious. However, this detection does not prove malicious intent on its own without corroborating evidence, such as anomalous network behavior or other indicators of compromise.

  ### Investigation Steps

  - **Review process creation logs for Event ID 4688:** Look for new instances of process creation where the Image is `C:\ProgramData\DRM\CLR\CLR.exe` and ensure the ParentImage aligns with known process paths. Benign instances may involve typical office applications, while suspicious occurrences should correlate with user accounts exhibiting abnormal activity.

  - **Examine ParentImage and Image relationships:** Focus on cases where processes like `wmplayer.exe` are spawned from `C:\ProgramData\DRM` or any path starting with `C:\Windows\Temp`. Legitimate usage might show `wmplayer.exe` used interactively by users, while malicious usage may display unusual timing or lack of user interaction.

  - **Validate the existence of the `C:\ProgramData\DRM` directory:** Confirm that this directory exists on the system for context. The absence of this path on an affected system may indicate a more traditional legitimate behavior. Alternatively, check for signs of compromise if the directory persists with unexpected contents.

  - **Cross-reference other system logs for network activity:** Investigate related outbound network connections made by the flagged processes, examining firewall logs or network flow data. Unusual traffic, especially toward known malicious IPs or outside normal operational hours, could indicate malicious behavior.

  - **Check for execution of Test.exe:** If `wmplayer.exe` is detected running with `Test.exe` as a ParentImage, investigate its execution patterns. Legitimate activities would rarely involve executables named "Test" under normal circumstances, and their presence should raise flags for further analysis.

  ### Prioritization

  This alert is of critical severity due to the potential impact on sensitive systems, particularly in an academic environment facing targeted malware campaigns. The likelihood of malicious abuse is high given that the observed behavior aligns closely with established tactics used by advanced persistent threat (APT) groups like Winnti. This behavior has been specifically weaponized in observed attacks against universities in Hong Kong.

  ### Blind Spots and Assumptions

  Detection may be limited due to possible evasion techniques such as malicious binaries masquerading as legitimate processes. Reliable detection requires comprehensive endpoint logging configurations, including Sysmon and full Windows event logging. Legitimate activities like software updates or automated tasks could also trigger this alert. Companion detections include monitoring for network connections made by the identified processes to validate their intent, especially against known toolsets used by Winnti.

