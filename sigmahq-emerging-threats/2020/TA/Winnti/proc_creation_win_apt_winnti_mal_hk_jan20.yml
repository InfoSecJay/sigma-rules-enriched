detection:
  selection1:
    ParentImage|contains:
    - 'C:\Windows\Temp'
    - '\hpqhvind.exe'
    Image|startswith: 'C:\ProgramData\DRM'
  selection2:
    ParentImage|startswith: 'C:\ProgramData\DRM'
    Image|endswith: '\wmplayer.exe'
  selection3:
    ParentImage|endswith: '\Test.exe'
    Image|endswith: '\wmplayer.exe'
  selection4:
    Image: 'C:\ProgramData\DRM\CLR\CLR.exe'
  selection5:
    ParentImage|startswith: 'C:\ProgramData\DRM\Windows'
    Image|endswith: '\SearchFilterHost.exe'
  condition: 1 of selection*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule focuses on identifying the presence and behavior of Winnti malware, which was notably involved in cyber campaigns targeting Hong Kong universities during late 2019 and early 2020. The Winnti Group typically employs a variety of techniques, including process masquerading and execution through seemingly benign applications, to maintain persistence and evade detection. The objective of such an attack often involves espionage, data theft, or disruption of the educational activities of targeted institutions.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection rule include:
  - **Persistence** (T1547)
  - **Privilege Escalation** (T1068)
  - **Defense Evasion** (T1562)
  - **Exploitation of Public-Facing Application** (T1190)

  The primary data sources for this detection are Windows process creation logs, which capture detailed information about newly launched processes, including their parent processes and execution paths. This data is crucial for analyzing potentially malicious behavior that mimics legitimate applications.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze recent process creation logs from the Windows environment, focusing on instances where processes like `wmplayer.exe` and `SearchFilterHost.exe` originate from suspicious paths like `C:\ProgramData\DRM` or `C:\Windows\Temp`.

  - **Analyze Parent-Child Relationships:** Investigate the parent-child process relationships for identified processes to confirm any associations with known malware indicators or confirm legitimate activity.

  - **Inspect Indicators in Persistence Mechanisms:** Look for persistence mechanisms that may have been established by the Winnti malware, specifically checking registry entries or scheduled tasks that reference the `C:\ProgramData\DRM` directory.

  - **Verify System Integrity:** Perform a system integrity check for any unexpected file modifications or unauthorized installations that may be associated with the behavior detected, particularly focusing on the `C:\ProgramData\DRM` directory and its contents.

  ### Prioritization
  Given the critical level of this alert, the impact of Winnti malware on enterprise environments can be severe, leading to data breaches and significant operational disruption. The likelihood of these attacks being enacted increases due to the group's history of targeting educational institutions for espionage.

  ### Blind Spots and Assumptions
  This detection rule may not capture instances where the malware uses legitimate processes or techniques not covered by the specified patterns, potentially allowing for stealthy activity. The rule assumes that process creation logs are accurately captured and monitored, and that there are no alterations or clean-up activities performed by the malware that would obscure its presence. Additionally, to ensure alert functionality, complete process creation logging must be enabled within the Windows environment.

