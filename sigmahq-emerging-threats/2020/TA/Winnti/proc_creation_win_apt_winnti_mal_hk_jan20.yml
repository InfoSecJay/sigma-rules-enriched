logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    ParentImage|contains:
    - 'C:\Windows\Temp'
    - '\hpqhvind.exe'
    Image|startswith: 'C:\ProgramData\DRM'
  selection2:
    ParentImage|startswith: 'C:\ProgramData\DRM'
    Image|endswith: '\wmplayer.exe'
  selection3:
    ParentImage|endswith: '\Test.exe'
    Image|endswith: '\wmplayer.exe'
  selection4:
    Image: 'C:\ProgramData\DRM\CLR\CLR.exe'
  selection5:
    ParentImage|startswith: 'C:\ProgramData\DRM\Windows'
    Image|endswith: '\SearchFilterHost.exe'
  condition: 1 of selection*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the execution of processes associated with the Winnti malware, particularly those related to a campaign targeting universities in Hong Kong. The likely attacker objective is to establish persistence and escalate privileges through the compromise of legitimate processes. This behavior aligns with the MITRE ATT&CK tactic of Persistence (T1547) and the technique of Process Injection (T1574.001). The primary telemetry source is process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1. A successful detection may indicate an ongoing malicious presence that could facilitate later stages of an attack. Importantly, this detection does NOT confirm actual compromise without further context; benign processes may perform similar actions.

  ### Investigation Steps

  - **Identify high-confidence malicious indicators:** Review Security Event ID 4688 logs for process creation events with the Image path set to `C:\ProgramData\DRM\CLR\CLR.exe`, as this is a known indicator of Winnti activity.

  - **Check parent process relations:** Analyze Event ID 4688 logs for any entries where the ParentImage is `C:\Windows\Temp` or `\hpqhvind.exe` and the Image starts with `C:\ProgramData\DRM`. Correlate these with Sysmon Event ID 1 to validate the presence of potentially malicious behaviors.

  - **Review legitimate behavior:** Validate the execution of processes like `wmplayer.exe`. In benign scenarios, this process is typically invoked by users or legitimate applications, with ParentImages related to known user actions.

  - **Correlate with persistence behaviors:** Investigate the creation of processes like `SearchFilterHost.exe` originating from `C:\ProgramData\DRM\Windows`. This may suggest an attempt to maintain persistence or evade detection.

  - **Assess the impact of affected systems:** Consider the role of the affected system; if it's a critical host in your environment, escalate the investigation, as the potential impact of Winnti infection can lead to data exfiltration and further network compromise.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of the assets potentially affected (e.g., university systems, research data). The likelihood of successful exploitation by the Winnti group is moderate to high, given their history of targeting similar institutions. The behavior exhibited is often weaponized for unauthorized access and lateral movement.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of process camouflage through legitimate applications that may mimic suspicious characteristics. Reliable detection requires comprehensive logging configurations, specifically ensuring that process creation logs are captured at both the system and application levels. Legitimate activity, such as software updates or user-initiated file access, may trigger these alerts. Related detections include monitoring for abnormal network activity from the identified processes, which enhances overall coverage against evasive maneuvers.

