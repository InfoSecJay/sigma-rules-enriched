detection:
  selection1:
    ParentImage|contains:
    - 'C:\Windows\Temp'
    - '\hpqhvind.exe'
    Image|startswith: 'C:\ProgramData\DRM'
  selection2:
    ParentImage|startswith: 'C:\ProgramData\DRM'
    Image|endswith: '\wmplayer.exe'
  selection3:
    ParentImage|endswith: '\Test.exe'
    Image|endswith: '\wmplayer.exe'
  selection4:
    Image: 'C:\ProgramData\DRM\CLR\CLR.exe'
  selection5:
    ParentImage|startswith: 'C:\ProgramData\DRM\Windows'
    Image|endswith: '\SearchFilterHost.exe'
  condition: 1 of selection*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This rule detects specific process characteristics associated with the Winnti malware, particularly observed in a campaign targeting universities in Hong Kong during late 2019 into early 2020. The Winnti Group has a known history of sophisticated attacks aimed at intellectual property theft, targeting academic institutions to gain access to sensitive research data and proprietary information. The detection focuses on the execution patterns and parent-child relationships of processes that exhibit signs of the Winnti malware's behavior, specifically involving unusual file paths and known executable names.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), particularly the technique **Obfuscated Files or Information** (T1027), and **Execution** (TA0002), especially related to **Scripting** (T1064) and **User Execution** (T1203). The primary data sources for effective detection and analysis include process creation events from Windows systems, which can reveal when suspicious processes are spawned and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events to identify instances of suspicious executables in file paths like `C:\ProgramData\DRM\` or `C:\Windows\Temp`, focusing on the listed parent-child relationships indicative of Winnti activity.

  - **Correlate with System Artifacts:** Look for associated artifacts such as scheduling tasks, registry modifications, and network connections initiated by the detected processes to gather more context and assess the potential impact.

  - **Examine Process Execution Timing:** Evaluate the timestamps related to process creation, especially during non-business hours, to identify patterns that may indicate stealthy activity typical of advanced persistent threats like Winnti.

  - **Conduct File Integrity Monitoring:** Check for any unauthorized changes or new files in the `C:\ProgramData\DRM\` directory, as the appearance of unexpected scripts or binaries could provide further evidence of compromise.

  ### Prioritization
  This alert is considered critical due to the high impact of Winnti malware's capabilities, which include data exfiltration and potential disruption of services, along with the likelihood of encountering such threats in the academic sector targeted by this group.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the malware uses different execution pathways or obfuscation techniques not covered by the current rule. The detection logic assumes that the malware will utilize specific file paths and naming conventions but may miss variants using different names or locations. Additionally, logs for process creation must be enabled and properly configured across all endpoints for this alert to function effectively.

