logsource:
  category: process_creation
  product: windows
detection:
  selection_generic:
    CommandLine|contains:
    - 'reg.exe save hklm\sam %temp%\~reg_sam.save'
    - '1q2w3e4r@#$@#$@#$'
    - ' -hp1q2w3e4 '
    - '.dat data03 10000 -p '
  selection_netstat:
    CommandLine|contains|all:
    - 'netstat -aon | find '
    - 'ESTA'
    - ' > %temp%\~'
    # Network share discovery
  selection_network_discovery:
    CommandLine|contains|all:
    - '.255 10 C:\ProgramData\IBM\'
    - '.DAT'
  selection_persistence:
    CommandLine|contains|all:
    - ' /c '
    - ' -p 0x'
    CommandLine|contains:
    - 'C:\ProgramData\'
    - 'C:\RECYCLER\'
  selection_rundll32:
    CommandLine|contains|all:
    - 'rundll32 '
    - 'C:\ProgramData\'
    CommandLine|contains:
    - '.bin,'
    - '.tmp,'
    - '.dat,'
    - '.io,'
    - '.ini,'
    - '.db,'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule is designed to identify suspicious process execution patterns associated with the Lazarus Group, a state-sponsored APT known for its cyber espionage and sabotage activities. The rule focuses on various indicators and command-line arguments frequently associated with Lazarus Group operations, such as attempts to access Windows registry data, conduct network reconnaissance, establish persistence mechanisms, and execute malicious payloads. The attackers' objectives may include data theft, lateral movement within networks, or deploying additional malware.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (TA0002)**: Utilizing various techniques to run malicious code (T1059: Command-Line Interface).
  - **Discovery (TA0007)**: Gathering information about the system and network environment (T1016: System Network Configuration Discovery).
  - **Persistence (TA0003)**: Techniques used to maintain access to the system (T1547: Windows Registry run keys / startup folder).

  Primary data sources providing valuable evidence for these observables include process creation logs from the Windows operating system, which detail command-line parameters, and potentially related network logs indicating unusual outbound connections or recon commands.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the process creation logs for instances of the specified command-line arguments, particularly those containing registry access or unusual commands linked to persistence or network discovery.
  - **Collect Network Logs**: Gather outbound and inbound network logs to identify any suspicious connections or command outputs directed to temporary files, and assess if they correspond to known threat behaviors associated with the Lazarus Group.
  - **Investigate System Modifications**: Examine the Windows registry and filesystem for changes or files created in temporary directories, particularly focusing on directories like `C:\ProgramData\` and `C:\RECYCLER\`, as these are often used for maintaining persistence.
  - **Correlate with Threat Intelligence**: Cross-reference detected command-line patterns with threat intelligence reports on Lazarus Group tactics and techniques to identify any ongoing or emerging threats.

  ### Prioritization
  The alert is considered critical due to the high likelihood of severe impacts on enterprise operations, such as data breaches or ransomware incidents, associated with Lazarus Group activities. Rapid detection and response are essential, given the group's advanced capabilities and established targeting of high-value organizations.

  ### Blind Spots and Assumptions
  This detection logic may not cover all Lazarus Group tactics, especially if they use custom or less-documented techniques. Additionally, the detection relies heavily on command-line patterns, which may lead to false negatives if the attackers employ different execution methods. The effectiveness of this alert also depends on the proper configuration and retention of Windows process creation logs, which must be enabled and kept for sufficient duration to allow effective investigation.

