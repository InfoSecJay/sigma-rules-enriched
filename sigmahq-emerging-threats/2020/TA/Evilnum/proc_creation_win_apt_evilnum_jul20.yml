note: |
  ### Technical Context
  This detection rule identifies the deployment method known as "Golden Chickens," utilized by the Evilnum Advanced Persistent Threat (APT) group. This technique is characterized by the use of malicious OCX (ActiveX Control) files that are registered via regsvr32, which allows the execution of these potentially harmful components on a targeted system. Attackers using this method aim to facilitate unauthorized access, exfiltration of data, or lateral movement within an organization’s network.

  The MITRE ATT&CK framework identifies relevant tactics and techniques related to this behavior. Specifically, the rule encompasses the **Defense Evasion** tactic (TA0005) and the **Exploitation of Remote Services** technique (T1218.011). It is crucial for security teams to monitor for these indicators as they suggest an attempt to manipulate the Windows process creation mechanisms to bypass security controls and run unauthorized code.

  The primary data source for this detection is process creation logs, which will capture details about command lines executed on Windows systems. These logs are essential for revealing suspicious activities associated with regsvr32 command line usage and the presence of OCX files in user directories.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation events to identify instances where regsvr32 has been invoked with the specified command line parameters indicative of malicious activity.
  - **Correlate with File System Changes**: Investigate any simultaneous file modifications in the user's AppData\Roaming folder where these OCX files would typically reside. Look for recent additions or executables that may correspond with user activity.
  - **Check User Behavior**: Assess the behavior of the user account that executed the regsvr32 command to determine if the activity aligns with normal operational patterns or if it deviates significantly.
  - **Monitor Network Activity**: Examine network connections made from the affected host, particularly for unusual outbound connections that could indicate data exfiltration or communication with malicious infrastructure.

  ### Prioritization
  Given the critical nature of the alert and the techniques associated with the Evilnum APT, which are known to lead to data breaches and significant security incidents, this detection should be treated with high urgency. The likelihood of exploitation within targeted sectors further elevates the severity of this alert.

  ### Blind Spots and Assumptions
  This detection rule may miss malicious activities if the attackers use benign command-line arguments or techniques that do not invoke regsvr32 directly. It assumes that process creation logs are being properly collected and analyzed, and that evidence of the targeted OCX files is present within the environment. Additionally, if the logging levels for process creation events are not configured correctly, this rule will not function optimally. To enhance detection coverage, it may be beneficial to integrate heuristics based on user behavior and file access patterns.

