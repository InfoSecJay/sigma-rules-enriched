note: |
  ### Technical Context

  This Sigma rule detects the usage of `regsvr32` to register OCX files from the user's AppData folder, a method known to be employed by the EvilNum APT group for deploying malicious payloads. The attacker’s objective is typically to gain persistence or execute malicious code without raising immediate suspicion. This behavior falls under the MITRE ATT&CK tactic of Execution and specifically the technique T1218.011 (Signed Binary Proxy Execution).

  The primary telemetry source is Windows process creation logs, particularly focusing on Event ID 4688, which records process creation events and includes details such as command lines. If the behavior is malicious, it can lead to data exfiltration or the deployment of additional malicious software. Importantly, this detection does NOT confirm that the process is malicious on its own; it requires further investigation of the context and outputs of the command.

  ### Investigation Steps

  - **Identify the process and command line used:** Check Windows Security Event ID 4688 for any instances of `regsvr32` being executed with arguments containing `/s`, `/i`, and the OCX file path. Look for indicators of malicious activity such as unexpected OCX file names or unusual paths under `AppData\Roaming`.

  - **Review file existence and properties:** Validate whether the OCX files exist in the specified directory. Use File Properties (right-click > Properties) to check the file's digital signature. If the file is unsigned or has a poor reputation, this could indicate a malicious payload.

  - **Analyze parent-child process relationships:** Look for Event ID 4688 logs that indicate what process initiated the `regsvr32` command. A legitimate process usually shares characteristics of normal system administration tasks; any suspicious parent processes should be closely examined for signs of compromise.

  - **Check for additional suspicious activity:** Review Windows logs for other related activities, such as other components of the EvilNum toolset being executed, which may include unusual outbound connections or the modification of executables in the startup directory.

  - **Validate other instances of OCX execution:** Cross-reference with historical logs for repeated occurrences of the same OCX file being registered or executed, especially those that deviate from standard user behavior.

  ### Prioritization

  This alert should be treated with high priority due to the critical nature of the system potentially being impacted and the high likelihood of malicious usage related to the EvilNum APT techniques. The specific behavior detected is commonly exploited for persistence and exploitation, making it a significant threat vector.

  ### Blind Spots and Assumptions

  The detection may miss variations of the command or obfuscated strings that achieve similar functionality. Reliable detection requires proper logging configurations for process creation. Legitimate uses of OCX files, such as software updates or system maintenance, could trigger the alert without malicious intent. A companion detection, such as monitoring for unusual outbound connections post-execution, would enhance contextual awareness and coverage.

