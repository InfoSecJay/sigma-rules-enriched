note: |
  ### Technical Context

  This Sigma rule detects the execution of a command that utilizes `regsvr32` to load OCX files, specifically targeting those located in the user's AppData\Roaming directory. This behavior is indicative of the EvilNum APT group's deployment method known as "Golden Chickens", where attackers aim to deploy malware by leveraging legitimate Windows processes to avoid detection. The relevant MITRE ATT&CK tactic is "Execution" (TA0002), with the technique being "Script Execution" (T1218.011).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, which provide details on command-line arguments used during process creation. If the detected behavior is indeed malicious, it could lead to unauthorized access to sensitive data or systems. It is important to note that this detection does NOT confirm that the OCX file in question is malicious by itself, as it may be a legitimate usage of regsvr32.

  ### Investigation Steps

  - **Review process creation details:** Check Windows Event ID 4688 and Sysmon Event ID 1 for the process creation involving `regsvr32`. Look for command line signatures that include the `/s`, `/i`, and `.ocx` file in paths like `C:\Users\<username>\AppData\Roaming\`. This combination is suspicious and may indicate malicious activity.

  - **Validate the OCX file origin:** Identify the file path of the .ocx file invoked by `regsvr32`. Look for unusual or unexpected file names or origins. Files from temporary locations or unfamiliar paths like the AppData\Roaming folder could indicate malicious intent.

  - **Compare with legitimate activity:** Identify any known benign usage of OCX files within your environment. Legitimate software may use OCX files, and understanding this can help contextualize the alert. Reference software inventory to correlate expected behavior.

  - **Examine user context and privileges:** Determine the user account executing the command. Any execution from high-privilege accounts not associated with known software or current operations should be flagged for further analysis.

  - **Monitor outlier behaviors in file creation:** Investigate for any recent file creations in the AppData\Roaming directory, especially those related to the same time as the command execution. Use File Creation Event logs to detect unrecognized or unauthorized .ocx files created during that timeframe.

  - **Cross-reference with threat intelligence:** Use threat intelligence feeds to see if the detected file, process, or user behavior aligns with known bad indicators associated with EvilNum or other ransomware APTs. Any match should escalate further investigation.

  ### Prioritization

  This alert is critical due to the potential severe impact if the behavior is malicious, as it targets regression of system integrity and may lead to data exfiltration. The likelihood of adversaries utilizing regsvr32 for malicious purposes is high, as it is commonly weaponized in sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential use of alternative file paths or different execution methods that do not utilize `regsvr32`. Ensure that Windows command line logging is properly configured; if not, crucial evidence may be missing. Additionally, legitimate software may invoke OCX files, so context is critical in interpretation. Related detections, such as monitoring for abnormal task execution or file downloads, can provide better coverage against this threat type.

