logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - ':\ProgramData\adobe\Adobe.exe'
    - ':\ProgramData\oracle\local.exe'
    - '\revshell.exe'
    - '\infopagesbackup\ncat.exe'
    - ':\ProgramData\comms\comms.exe'
  selection_msf:
    CommandLine|contains|all:
    - '-ExecutionPolicy Bypass -File'
    - '\msf.ps1'
  selection_ncat:
    CommandLine|contains|all:
    - 'infopagesbackup'
    - '\ncat'
    - '-e cmd.exe'
  selection_powershell:
    CommandLine|contains:
    - 'system.Data.SqlClient.SqlDataAdapter($cmd); [void]$da.fill'
    - '-nop -w hidden -c $k=new-object'
    - '[Net.CredentialCache]::DefaultCredentials;IEX '
    - ' -nop -w hidden -c $m=new-object net.webclient;$m'
    - '-noninteractive -executionpolicy bypass whoami'
    - '-noninteractive -executionpolicy bypass netstat -a'
  selection_other:
    CommandLine|contains: 'L3NlcnZlcj1'      # base64 encoded '/server='
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects specific tools and process executions associated with the Greenbug espionage group's tactics as reported by Symantec. The likely attacker objective revolves around establishing remote command and control (C2) capabilities and gathering information from the target system. This behavior correlates with the MITRE ATT&CK framework under the tactics of Execution (T1059.001), Command and Control (T1105), and Defense Evasion (T1036.005).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which provide insight into process execution and command-line arguments. If identified as malicious, these behaviors can have significant impacts, including data exfiltration and unauthorized access to sensitive information. However, this detection does NOT confirm that an attack has occurred; it merely highlights suspicious activity that requires further investigation.

  ### Investigation Steps

  - **Review process creation logs**: Check for Security Event ID 4688 or Sysmon Event ID 1 regarding the execution of Adobe.exe, local.exe, revshell.exe, ncat.exe, or comms.exe, as these are indicative of potential malicious activity tied to Greenbug.

  - **Analyze command-line arguments**: Investigate processes with command lines containing `-ExecutionPolicy Bypass -File` and `\msf.ps1`, which are particular to Metasploit usage. Further, ensure no benign processes are executing with these flags.

  - **Identify high-confidence malicious indicators**: A command line that includes `-e cmd.exe` in conjunction with `ncat.exe` indicates an intention for reverse shell access, categorizing it as a direct malicious indicator.

  - **Correlate expected legitimate behavior**: Validate if similar process executions originate from known legitimate application paths and scenarios, such as Adobe and Oracle installations, as these are commonly installed applications and could be misused by attackers.

  - **Examine for lateral movement attempts**: If any command lines encode `'/server='`, it may indicate attempts at establishing connections to compromised systems; monitor for unexpected network traffic on these specific command executions.

  - **Cross-reference with threat intelligence**: Check for reported indicators from threat intelligence sources about Greenbug’s activity to deepen context and understand potential concerted attacks against similar assets in your environment.

  ### Prioritization

  This alert is critical due to the high potential impact on data confidentiality and system integrity from a successful compromise. The likelihood of malicious abuse is elevated given the specific nature of the detected behaviors, which are characteristic of known tactics employed by adversaries like Greenbug. Engaging in this behavior is commonly weaponized in espionage campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications being misconfigured or misused, leading to false positives. Logs must be reliably configured, including capturing all necessary process creation events to ensure coverage. Legitimate benign activities could trigger this alert, such as scheduled scripts or local software that utilize PowerShell for administrative tasks. A related detection could include monitoring for unauthorized base64 encoded command strings commonly used in C2 communications for enhanced observation of potential threats.

