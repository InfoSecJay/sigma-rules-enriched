logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - ':\ProgramData\adobe\Adobe.exe'
    - ':\ProgramData\oracle\local.exe'
    - '\revshell.exe'
    - '\infopagesbackup\ncat.exe'
    - ':\ProgramData\comms\comms.exe'
  selection_msf:
    CommandLine|contains|all:
    - '-ExecutionPolicy Bypass -File'
    - '\msf.ps1'
  selection_ncat:
    CommandLine|contains|all:
    - 'infopagesbackup'
    - '\ncat'
    - '-e cmd.exe'
  selection_powershell:
    CommandLine|contains:
    - 'system.Data.SqlClient.SqlDataAdapter($cmd); [void]$da.fill'
    - '-nop -w hidden -c $k=new-object'
    - '[Net.CredentialCache]::DefaultCredentials;IEX '
    - ' -nop -w hidden -c $m=new-object net.webclient;$m'
    - '-noninteractive -executionpolicy bypass whoami'
    - '-noninteractive -executionpolicy bypass netstat -a'
  selection_other:
    CommandLine|contains: 'L3NlcnZlcj1'      # base64 encoded '/server='
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects execution attempts of known tools and scripts used by the Greenbug espionage group, particularly their activities linked to targeted attacks against telecommunications in South Asia during May 2020. The likely objective of the attackers is data exfiltration and reconnaissance within sensitive environments. Relevant MITRE ATT&CK tactics and techniques include Execution (T1203), Command and Control (T1071), and Execution (T1059.001) for PowerShell. The primary telemetry sources include Windows process creation events, specifically looking at Event IDs 4688 and Sysmon Event ID 1. The security impact if malicious could be severe, leading to data loss, espionage, or system compromise. This detection does NOT confirm that malicious activity has occurred without further context, as legitimate applications may also use similar executables or command-line parameters.

  ### Investigation Steps

  - **Identify triggered process:** Check for Security Event ID 4688 logs to identify any instances of `Adobe.exe`, `local.exe`, `revshell.exe`, or `ncat.exe` running on the system. Legitimate instances of Adobe products can occur in `C:\Program Files\Adobe\`, while the presence of ncat or revshell is generally malicious.

  - **Examine command-line arguments:** Review the command-line arguments in Event ID 4688 for signs of suspicious activity. Specifically, look for the presence of `-ExecutionPolicy Bypass -File` with a target file like `msf.ps1`. Typical benign PowerShell usage will not invoke this flag for legitimate tasks.

  - **Investigate network connections:** Analyze any generated network connection logs (Firewall, Sysmon Event ID 3) following the process execution, focusing on outgoing connections from newly executed PowerShell or ncat processes. Connections to unusual IP addresses or domains are significant indicators of malicious behavior.

  - **Correlate with user behavior:** Assess the user's typical activity against the timing of the detected processes. If the user is not known to run administrative tasks or engage with the software across directories like `ProgramData`, this inconsistency may indicate a potential compromise.

  - **Review PowerShell logs:** Investigate the PowerShell operational logs (Event ID 4104) for any suspicious commands that match the detection criteria, especially those with base64 encoded strings like `L3NlcnZlcj1` that suggest command-and-control functionalities.

  ### Prioritization

  This alert is critical due to its association with high-impact espionage activity. The use of targeted tools like ncat for command and control suggests a high likelihood of malicious intent. Given the sophistication shown by Greenbug, this behavior is indicative of a serious security breach, warranting immediate investigation and response.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to use similar executable names or command-line arguments, which could result in false positives. Ensuring that full logging for PowerShell execution and process creation is enabled is essential for reliable detection. Additionally, user activities like system administration or updates could trigger this alert unintentionally. A related detection to strengthen coverage is monitoring PowerShell "Invoke-Expression" commands, which are often used in conjunction with the tools identified here.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
