title: Greenbug Espionage Group Indicators
id: 3711eee4-a808-4849-8a14-faf733da3612
status: test
description: Detects tools and process executions used by Greenbug in their May 2020
  campaign as reported by Symantec
references:
- https://symantec-enterprise-blogs.security.com/blogs/threat-intelligence/greenbug-espionage-telco-south-asia
author: Florian Roth (Nextron Systems)
date: 2020-05-20
modified: 2023-03-09
tags:
- attack.g0049
- attack.execution
- attack.t1059.001
- attack.command-and-control
- attack.t1105
- attack.defense-evasion
- attack.t1036.005
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
    - ':\ProgramData\adobe\Adobe.exe'
    - ':\ProgramData\oracle\local.exe'
    - '\revshell.exe'
    - '\infopagesbackup\ncat.exe'
    - ':\ProgramData\comms\comms.exe'
  selection_msf:
    CommandLine|contains|all:
    - '-ExecutionPolicy Bypass -File'
    - '\msf.ps1'
  selection_ncat:
    CommandLine|contains|all:
    - 'infopagesbackup'
    - '\ncat'
    - '-e cmd.exe'
  selection_powershell:
    CommandLine|contains:
    - 'system.Data.SqlClient.SqlDataAdapter($cmd); [void]$da.fill'
    - '-nop -w hidden -c $k=new-object'
    - '[Net.CredentialCache]::DefaultCredentials;IEX '
    - ' -nop -w hidden -c $m=new-object net.webclient;$m'
    - '-noninteractive -executionpolicy bypass whoami'
    - '-noninteractive -executionpolicy bypass netstat -a'
  selection_other:
    CommandLine|contains: 'L3NlcnZlcj1'      # base64 encoded '/server='
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This rule detects the execution of various tools and processes associated with the Greenbug espionage group's activities, specifically from their May 2020 campaign targeting telecommunications in South Asia. The rule identifies malicious binaries and PowerShell commands that exhibit characteristics typically used for remote access or data exfiltration. The attackers may aim to conduct surveillance, gather intelligence, or compromise sensitive data from targeted organizations.

  Relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - Execution (T1059.001): This technique pertains to the execution of scripts and command-line commands, particularly those used maliciously via PowerShell.
  - Command and Control (T1105): Utilized for transferring tools or data from a remote location.
  - Defense Evasion (T1036.005): Techniques related to masquerading or using legitimate tools inappropriately to avoid detection.

  Primary data sources to monitor for potential evidence of this attack include process creation events from Windows logs, notably looking for execution of the specified tools and unusual command-line arguments indicative of script usage or base64 encoded commands.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check Windows process creation logs for suspicious executions related to Adobe, Oracle, and the specified executable names associated with Greenbug’s tools.
  - **Analyze PowerShell Command Execution:** Look for unusual PowerShell command lines in logs, specifically those that contain phrases like 'ExecutionPolicy Bypass' or any commands referenced in the detection logic.
  - **Investigate Network Traffic:** Correlate process executions with network activity logs to identify potential command and control communications, particularly monitoring for connections to unauthorized IP addresses or domains.
  - **Assess System Changes:** Verify any recent changes or anomalies on endpoints where suspicious processes were executed to understand the impact of the detected activity.

  ### Prioritization
  The alert's severity is classified as critical due to the potential for significant data compromise and the targeted nature of espionage operations, which can lead to substantial operational and reputational damages for the affected organizations.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of comprehensive logging for all endpoint activity, particularly if process creation logs are not enabled on critical systems. The detection logic assumes that these processes are being executed in user contexts that lack the appropriate permissions, and therefore do not account for workflows by trusted administrative accounts. To optimize detection, appropriate logging configurations for both process initiation and PowerShell command executions must be enforced across the enterprise.

