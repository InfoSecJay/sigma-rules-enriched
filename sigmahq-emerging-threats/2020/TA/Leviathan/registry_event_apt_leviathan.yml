  ### Technical Context

  This Sigma rule detects modifications to the registry key `\Software\Microsoft\Windows\CurrentVersion\Run\ntkd`, which is associated with persistence mechanisms often utilized by the Leviathan APT group. The likely objective of the attacker is to establish a backdoor for maintaining access to the compromised environment, enabling further exploitation. This behavior correlates with the MITRE ATT&CK techniques for persistence (T1547.001) and privilege escalation.

  The primary telemetry source for this detection is Windows Registry events, specifically those related to modifications in the registry (often monitored via Sysmon or native Windows auditing). If malicious, the security impact could be severe, indicating a long-term presence within the environment that could facilitate additional actions like data exfiltration or lateral movement. However, this detection alone does not confirm that an attack occurred, as legitimate applications may also modify this registry key.

  ### Investigation Steps

  - **Check registry modification event:** Review Windows Security Event ID 4663 or Sysmon Event ID 13 for alterations made to `\Software\Microsoft\Windows\CurrentVersion\Run\ntkd`. Look for unusual user accounts associated with the modifications; benign modifications will likely come from known administrative accounts or legitimate software.

  - **Identify parent process of registry modification:** Use Sysmon Event ID 1 to identify the parent process that initiated the registry change. Legitimate services or applications typically reference well-known processes, while suspicious activities might involve uncommon binaries or scripts.

  - **Cross-reference user account activity:** Investigate the user account history and privileges using Security Event ID 4672 (Special privileges assigned) to check if the account modifying the registry has legitimate access or has recently gained privilege elevation that’s unusual.

  - **Monitor for additional persistence mechanisms:** Review for other registry modifications under `\Software\Microsoft\Windows\CurrentVersion\Run` and other persistence locations (like Startup folders). Multiple alterations could suggest automated persistence methods employed by an attacker.

  - **Collect and verify indicator artifacts:** If possible, collect temporary files or artifacts created by the applications associated with modifications, such as log files created by the program setting the registry key. Valid files should be associated with legitimate software.

  ### Prioritization

  This alert is considered critical as it targets a registry modification commonly linked to advanced persistent threats (APTs). The affected system's role in the network (e.g., a domain controller or critical server) can escalate the risk if compromised. The associated attacker techniques are often weaponized in targeted campaigns, raising the likelihood of malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of proper audit logging for the registry or if specific configurations aren’t enabled for Sysmon or Windows Security Auditing. Legitimate software updates and changes from administrators might trigger the alert, so proper context is essential in evaluation. Companion detections, such as monitoring for unusual account logon activity (using Event ID 4624) or process creations (using Sysmon Event ID 1), can reinforce analysis and support incident validation.

