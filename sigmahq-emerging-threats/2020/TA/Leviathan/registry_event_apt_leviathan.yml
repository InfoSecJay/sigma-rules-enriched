note: |
  ### Technical Context
  This detection rule identifies activity associated with the Leviathan APT group, specifically targeting a registry key commonly utilized for persistence on compromised systems. The registry key `\Software\Microsoft\Windows\CurrentVersion\Run\ntkd` is indicative of malicious software being configured to execute automatically upon system startup. The Leviathan group has been observed leveraging such techniques in campaigns aimed at Malaysian organizations, suggesting a focus on espionage and data exfiltration.

  In the context of MITRE ATT&CK, this behavior falls under the tactic of **Persistence** (TA0003) and leverages the technique **Registry Run Keys/Startup Folder** (T1547.001). Attackers often seek to establish a foothold in a target environment, ensuring that their malicious activities persist even after reboots, which serves their goal of maintaining access to sensitive data.

  The primary data source for detecting this behavior includes **Windows registry event logs**, which monitor changes to critical registry paths and can reveal unauthorized modifications by malicious agents.

  ### Investigation Steps
  - **Review Registry Logs:** Examine Windows registry logs for entries related to the specified path (`\Software\Microsoft\Windows\CurrentVersion\Run\ntkd`) to confirm the presence of the suspicious key and any associated values.
  - **Check for Unusual Process Creation:** Look for any processes initiated at system startup that correspond with the identified registry key in the process creation event logs. Correlate timestamps to see if execution aligns with system boot times.
  - **Monitor Network Activity:** Investigate outbound connections linked to processes that may have spawned from the suspicious registry entry. Check for unusual destinations or data exfiltration attempts.
  - **Analyze User Activity:** Verify which users or accounts made changes to the registry keys and any related activity logs for potential anomalies in user behavior or unauthorized access.

  ### Prioritization
  The critical level of this alert reflects the potential for significant risk to enterprise environments. Unauthorized persistence mechanisms can allow attackers to maintain control over compromised systems, making detection and response imperative to prevent further exploitation or data loss.

  ### Blind Spots and Assumptions
  This detection rule may not capture instances where attackers utilize alternative persistence mechanisms or use obfuscation techniques that disguise their actions. It assumes that the environment collects and retains sufficient registry logs to identify changes, which may not always be the case in all enterprise setups. Additionally, the effectiveness of the detection relies on proper configuration of logging and monitoring tools to correlate registry changes with other observable behaviors in the environment.

