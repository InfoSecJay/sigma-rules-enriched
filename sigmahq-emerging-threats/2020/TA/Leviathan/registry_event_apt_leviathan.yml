note: |
  ### Technical Context
  This rule detects the presence of a specific registry key associated with the Leviathan APT group, which has been linked to malicious activities targeting Malaysian organizations. The registry key in question, found at `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run\ntkd`, is indicative of persistence mechanisms often employed by adversaries to ensure their malware survives system reboots. The goal of the threat actor is typically to maintain a foothold in compromised environments, manipulate resources, and exfiltrate sensitive data.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0002) and **Privilege Escalation** (TA0004), specifically technique **T1547.001 - Registry Run Keys / Startup Folder**. By leveraging this technique, Leviathan can execute its payload automatically every time the user logs into the system, ensuring prolonged access to the victim's network.

  Primary data sources for evidence collection include Windows registry event logs that capture alterations to keys and values, which can reveal attempts to create or modify startup entries.

  ### Investigation Steps
  - **Review Registry Events**: Analyze registry event logs for the specific entry under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. Look for any anomalous changes related to the `ntkd` key.

  - **Check for Related Processes**: Investigate process creation logs to identify any instances of processes launched as a result of changes to the registry. Pay special attention to the parent-child relationship of processes initiating from this registry key.

  - **Correlate with User Activity**: Examine user activity logs to see if there were any abnormal logins or access patterns during the time the registry modification occurred. This can help establish the context of the changes.

  - **Assess Network Traffic**: Capture and analyze outbound network traffic from the affected host to identify any potential communications with known malicious infrastructures or unusual data exfiltration activities.

  ### Prioritization
  This alert is categorized as critical due to the potential for Leviathan's actions to lead to unauthorized access and data breaches within the enterprise. The likelihood of exploitation is high, especially if the organization operates in a sector of interest to the APT group.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for other methods of persistence or privilege escalation that do not involve registry modifications. The detection logic assumes that the `ntkd` key is solely indicative of malicious intent and may miss variants if they use different naming conventions. Moreover, the successful functionality of this alert depends on proper collection and retention of detailed Windows registry logs, which must be configured correctly within the organization’s logging infrastructure.

