logsource:
  category: process_creation
  product: windows
detection:
  selection_cli_1:
    CommandLine|contains|all:
    - 'Invoke-WMIMethod win32_process -name create -argumentlist'
    - 'rundll32 c:\windows'
  selection_cli_2:
    CommandLine|contains|all:
    - 'wmic /node:'
    - 'process call create "rundll32 c:\windows'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies the use of specific PowerShell command-line patterns linked to the UNC2452 threat actor group, known for various sophisticated attacks, including supply chain compromises. The rule focuses on detecting anomalous PowerShell invocations that attempt to execute the `rundll32` utility in a specific manner, indicating potential lateral movement or execution of code manipulated by malicious actors within the context of compromised networks.

  The threat scenario involves attackers abusing legitimate tools and techniques to execute arbitrary code, evade detection, and maintain persistence within an organization's environment. Attacker objectives may include data theft, further exploitation of network resources, or establishing footholds in critical systems for future operations. Key techniques leveraged by UNC2452 align with the MITRE ATT&CK framework, particularly:
  - **Execution - PowerShell (T1059.001)**
  - **Execution - WMI Execution (T1047)**

  Primary data sources for this detection include process creation events recorded by endpoint security solutions, which capture the command-line context of PowerShell execution attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check process creation events for instances where PowerShell commands match the specified patterns involving `Invoke-WMIMethod` or `wmic`, particularly focusing on those that invoke `rundll32`.

  - **Correlate with EDR Alerts**: Utilize EDR solutions to examine endpoint activity leading up to the detected command execution for potential indicators of compromise, including previous anomalous logins or resource access.

  - **Inspect Network Connections**: Analyze network logs for any outbound connections initiated by the affected systems that follow the time of the detected PowerShell execution, particularly those leading to suspicious external IP addresses.

  - **Examine System Event Logs**: Investigate Windows Security and System Event logs around the time of the alert to identify any related suspicious account logins or privilege escalations that might accompany the execution patterns.

  ### Prioritization
  The alert is classified as critical due to the potential for UNC2452 to leverage such command patterns to execute significant attacks against enterprise environments. The likelihood of this behavior indicating an active compromise raises the urgency for a thorough investigation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments that may not have comprehensive logging or where PowerShell command logging is disabled. The detection logic assumes that these specific command patterns will not be routinely used for legitimate administrative purposes. It’s essential to have process creation logs enabled and configured to capture full command-line details for the alert to function effectively.

