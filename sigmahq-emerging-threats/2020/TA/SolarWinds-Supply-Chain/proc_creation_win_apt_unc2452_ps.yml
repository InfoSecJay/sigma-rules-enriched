logsource:
  category: process_creation
  product: windows
detection:
  selection_cli_1:
    CommandLine|contains|all:
    - 'Invoke-WMIMethod win32_process -name create -argumentlist'
    - 'rundll32 c:\windows'
  selection_cli_2:
    CommandLine|contains|all:
    - 'wmic /node:'
    - 'process call create "rundll32 c:\windows'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This rule detects PowerShell command line patterns associated with the UNC2452 actors, specifically targeting the use of WMI to create processes utilizing `rundll32`. The objective of these commands typically involves executing malicious payloads or conducting lateral movement within a network after initial compromise. Relevant MITRE ATT&CK techniques include **Execution: PowerShell (T1059.001)** and **Execution: Command-Line Interface (T1047)**.

  Primary telemetry sources include process creation logs from Windows, specifically Security Event ID 4688 and Sysmon Event ID 1, which document command execution and process lineage. The security impact could be significant, as this behavior is often part of a larger attack aimed at compromising sensitive systems or data. Importantly, this detection does NOT confirm that the execution is malicious without further context.

  ### Investigation Steps

  - **Review process creation events:** Check Security Event ID 4688 for the user context and parent process associated with the event. Look for unusual user accounts or processes spawned by standard applications.

  - **Examine command line arguments:** Confirm the presence of the full command line in the detected events, specifically searching for phrases like `Invoke-WMIMethod win32_process -name create -argumentlist` or `wmic /node:`. Legitimate use will not typically involve these command patterns.

  - **Assess host role or asset criticality:** Determine if the affected system is critical to operations, such as domain controllers or servers handling sensitive data. Higher impact systems warrant escalated investigation.

  - **Correlate with known malicious indicators:** Cross-reference the detected command lines against known UNC2452 tactics and techniques. Look for additional suspicious behaviors, such as use of remote access tools or abnormal outbound connections.

  - **Identify high-confidence malicious indicators:** Check for recent security alerts or incidents involving the same user account or IP addresses to establish a timeline. If the command correlates with known attack patterns, escalate accordingly.

  - **Validate potential file creation:** Look for related file artifacts such as `.dll` files being created or modified in the `C:\Windows\` directory during the same timeframe. Monitor Sysmon Event ID 11 for any files that match expected malicious payload signatures.

  ### Prioritization

  This alert is classified as critical due to the potential impact on network security and the high likelihood of exploitation by sophisticated adversaries like UNC2452. The behavior detected is commonly used in advanced attacks, making it crucial for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded through the use of legitimate administrative tools or by obfuscating command line arguments. Reliance on the availability of Windows Process Creation logs is crucial for accurate detection; ensure logging is properly configured on all endpoints. Legitimate system administration activities may trigger this alert, such as authorized use of WMI for routine process management. A related detection that enhances coverage includes monitoring for unusual PowerShell execution activity to identify patterns of abuse outside of this specific rule.

