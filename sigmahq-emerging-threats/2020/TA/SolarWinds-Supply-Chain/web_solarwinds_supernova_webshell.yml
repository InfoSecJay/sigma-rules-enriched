  ### Technical Context
  This detection rule identifies potential access to the SUPERNOVA webshell associated with the SolarWinds software compromise. The SUPERNOVA webshell allows attackers to execute commands on affected systems, facilitating deeper infiltration and lateral movement within an organization's network. Identifying this activity is critical, as attackers leveraging webshells can manipulate and exfiltrate sensitive data, posing significant risks to system integrity and data confidentiality.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and techniques related to web service exploitation, particularly **Web Shell (T1505.003)**, which outlines the use of web-based command interfaces for unauthorized access. Effective monitoring of web server activity is crucial since malicious access often manifests as abnormal HTTP requests or responses leading to error codes like 500.

  Key telemetry sources for this detection comprise **Web Server Logs**, which will document HTTP requests and responses, giving insight into potential unauthorized access patterns. Analyzing these logs helps identify attempts to exploit vulnerabilities associated with the SUPERNOVA webshell.

  ### Investigation Steps
  - **Review Web Server Logs**: Analyze web server logs for requests containing `logoimagehandler.ashx` within the URI; pay close attention to the response codes, particularly HTTP 500 errors, which may indicate failed exploit attempts or webshell access issues.

  - **Cross-Reference with Other Logs**: Check related logs, such as application logs and system event logs, to gather context about the affected webserver, looking for any abnormal behavior or configuration changes that coincide with the detected activity.

  - **Assess User and Session Activity**: Investigate the originating IP addresses and user-agent strings associated with the detected requests to identify whether they belong to legitimate users or exhibit characteristics typical of automated tools or actors.

  - **Identify Anomalous File Changes**: Look for changes in file structures or new file creations within the web application directory associated with the SolarWinds platform, as the installation of webshells often results in unexpected files being present on the web server.

  ### Prioritization
  Given the criticality level assigned to this alert, it is imperative due to the significant impact a successful exploitation can have on the organization's overall security posture. The likelihood of this threat type remains substantial, especially against vulnerable environments hosting SolarWinds products, making immediate investigation necessary.

  ### Blind Spots and Assumptions
  One potential gap in this detection approach is the reliance on effective logging configurations within web servers; if logs are not adequately collected or retained, detection may be hindered. The detection logic assumes that all web requests are logged and that there are active monitoring and alerting mechanisms in place to respond to anomalies. Additionally, the absence of established baseline traffic patterns could lead to missing more subtle variations in access that may indicate compromise. Organizations should ensure comprehensive logging and monitoring of web servers for complete coverage against such threats.

