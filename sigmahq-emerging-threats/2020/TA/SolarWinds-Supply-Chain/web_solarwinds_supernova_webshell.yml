note: |
  ### Technical Context

  This Sigma rule detects attempts to access the SUPERNOVA webshell associated with the SolarWinds compromise. The behavior identified includes requests to specific endpoints that are characteristic of webshell exploitation attempts, serving the attacker’s objective of maintaining persistence within a compromised environment. This aligns with the MITRE ATT&CK framework under the tactic of "Persistence" and the technique "Web Shell" (T1505.003).

  The primary telemetry source is web server logs, specifically filtered for URIs and HTTP status codes. If malicious, this behavior indicates a potential ongoing compromise, allowing attackers to execute commands remotely. Notably, this detection does NOT confirm that the webshell is successfully deployed or accessed; further validation of the threat is required.

  ### Investigation Steps

  - **Review web server logs for suspicious requests:** Examine logs for Event ID indicative of HTTP requests, filtering for URIs containing `logoimagehandler.ashx` and any corresponding abnormal query parameters. Benign requests typically show patterns consistent with ordinary application behavior, such as standard application functionality or user interactions.

  - **Identify any corresponding HTTP status codes:** Specifically, look for occurrences of HTTP status code 500 alongside `logoimagehandler.ashx` requests, which could indicate abnormal application server behavior or exploitation attempts. Malicious indicators include repeated 500 errors triggered in a short time frame.

  - **Correlate with recent system modifications:** Check change logs and version control systems for any unauthorized changes in web server configurations or application files. Legitimate updates typically follow a scheduled maintenance window and are documented by the IT team.

  - **Cross-reference with known Indicator of Compromise (IOC):** Verify if the source IPs or user agents in the logs correlate with known malicious actors or attacks associated with the SolarWinds vulnerability disclosures. Known malicious indicators would include any IP addresses tied to recent threat intelligence reports.

  - **Assess asset criticality and exposure:** Identify if the web server hosting the application is an exposed asset or holds sensitive data. Critical assets with Internet exposure are higher priority for investigation.

  - **Look for payload artifacts or file changes:** Investigate for any abnormal file creations or modifications on the host associated with web shell activity, specifically related to unconventional or unauthorized scripts. Such file changes indicate potential exfiltration or command execution via the webshell.

  ### Prioritization

  This alert should be treated as critical due to its potential to indicate ongoing compromised infrastructure, especially on exposed servers. The ability of attackers to leverage webshells for remote management makes this a highly likely pathway for malicious abuse, particularly given the context of the SolarWinds supply chain attacks.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques such as obfuscation of the webshell traffic or alternative access methods outside of standard HTTP requests. Reliable detection requires comprehensive web server logging and potentially the implementation of WAF (Web Application Firewall) rules. Legitimate maintenance actions or debugging requests by developers could trigger the alert. Companion detections for webshells should include endpoint logging for command execution (e.g., scripts run from web server directories) and unusual outbound connection attempts.

