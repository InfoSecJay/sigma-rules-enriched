note: |
  ### Technical Context
  This detection rule aims to identify unauthorized access to the SUPERNOVA webshell, a malicious web access point associated with the SolarWinds breach. Attackers targeting an organization's systems may deploy the SUPERNOVA webshell to facilitate further malicious activities, including data exfiltration, lateral movement, and persistent access. The entry methods might exploit vulnerabilities in SolarWinds software to achieve initial access and establish a foothold within the victim's network.

  The relevant MITRE ATT&CK tactics for this activity include **Persistence** (TA0003) as the webshell provides the attacker with a lasting way to access the system without further exploitation. The specific technique identified is **Web Shell** (T1505.003), which enables intermittent remote access to the compromised environment.

  Primary data sources that will provide the best evidence against this detection include **web server logs**, which capture HTTP requests to the web server. Specifically, logs containing URI queries, response codes, and associated client IP addresses can shed light on suspicious access patterns indicative of webshell usage.

  ### Investigation Steps
  - **Analyze Web Server Logs**: Review web server logs for URIs containing 'logoimagehandler.ashx'. Pay special attention to response codes and timestamps associated with anomalies or patterns that suggest unusual access from external IPs.
  - **Investigate Source IPs**: Identify the client IPs making the requests to the SUPERNOVA webshell. Check for any geographic or organizational discrepancies that could indicate unauthorized access.
  - **Correlate with Other Events**: Look for contextual information by correlating web server access logs with other telemetry, such as EDR alerts or NDR events, that may indicate associated malicious activities or lateral movement.
  - **Conduct Threat Hunting**: Proactively search for known indicators of compromise (IOCs) linked to the SUPERNOVA malware across the environment, utilizing threat intelligence feeds to identify any potential infections.

  ### Prioritization
  Given the critical nature of this alert, any detected access to the SUPERNOVA webshell poses a significant risk to the enterprise. The likelihood of continued exploitation and data compromise warrants immediate investigation and response due to the history of this vulnerability leading to substantial organizational impact.

  ### Blind Spots and Assumptions
  This detection rule may not effectively identify all instances of webshell usage, especially if the attacker modifies URI queries to evade detection. The detection logic assumes that relevant web server logging is configured properly and that access to the affected SolarWinds applications is monitored adequately. Moreover, the alert relies on the web server logs containing accurate records of client requests, which may be affected if log retention policies are poorly configured.

