title: UNC2452 Process Creation Patterns
id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
status: test
description: Detects a specific process creation patterns as seen used by 
  UNC2452 and provided by Microsoft as Microsoft Defender ATP queries
references:
- https://www.microsoft.com/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
author: Florian Roth (Nextron Systems)
date: 2021-01-22
modified: 2024-09-12
tags:
- attack.execution
- attack.t1059.001
- detection.emerging-threats
    # - sunburst
    # - unc2452
logsource:
  category: process_creation
  product: windows
detection:
    # To avoid writing complex condition. "selection_generic_1" and "selection_generic_2" are the same except for the extension used.
  selection_generic_1:
    CommandLine|contains:
    - '7z.exe a -v500m -mx9 -r0 -p'
    - '7z.exe a -mx9 -r0 -p'
    CommandLine|contains|all:
    - '.zip'
    - '.txt'
  selection_generic_2:
    CommandLine|contains:
    - '7z.exe a -v500m -mx9 -r0 -p'
    - '7z.exe a -mx9 -r0 -p'
    CommandLine|contains|all:
    - '.zip'
    - '.log'
  selection_generic_3:
    ParentCommandLine|contains|all:
    - 'wscript.exe'
    - '.vbs'
    CommandLine|contains|all:
    - 'rundll32.exe'
    - 'C:\Windows'
    - '.dll,Tk_'
  selection_generic_4:
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - 'C:\Windows'
    - '.dll'
    CommandLine|contains: 'cmd.exe /C '
  selection_generic_5:
    ParentImage|endswith: '\rundll32.exe'
    Image|endswith: '\dllhost.exe'
    CommandLine: ''
  condition: 1 of selection_generic_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects specific command-line patterns indicative of malicious activity associated with the UNC2452 threat actor, particularly the manipulation of compression and script execution utilities such as 7-zip and rundll32. The likely attacker objective is to package and exfiltrate sensitive information through file compression or execute malicious code using scripting languages. This behavior corresponds to the MITRE ATT&CK technique T1059.001 (Command and Scripting Interpreter: PowerShell).

  The primary telemetry source is Windows process creation logs, particularly monitoring Security Event ID 4688 and Sysmon Event ID 1 for command-line activity. If malicious, successful exploitation could lead to data exfiltration and further compromise of the enterprise environment. This detection does NOT confirm malicious intent solely based on the command line entries; it requires context to ascertain the activity's legitimacy.

  ### Investigation Steps

  - **Check recent process creations:** Review Security Event ID 4688 logs for the presence of `7z.exe`, `rundll32.exe`, or `cmd.exe` and their command lines. Look for patterns matching the rule criteria (e.g., `.zip`, `.txt`, `.log`). If identified, correlate the timing with known alert windows.

  - **Evaluate parent processes:** Investigate the parent process of detections. If `wscript.exe` or `rundll32.exe` is the parent, further analyze the command line for indicators of script execution (e.g., `.vbs` files) indicating potential exploitation.

  - **Inspect legitimate behaviors:** Determine if any recent use of `7z.exe` was for typical file archive creation by authorized users. Legitimate examples may show commands with more generic flags without suspicious parameters (e.g., no `-p` flag or extensive compression settings).

  - **Review file creation or network activity:** Examine associated file creation timestamps in system directories, particularly any generated archives or logs related to the `C:\Windows\` directory. If found, validate file integrity and check for subsequent network connections to unusual IP addresses or domains.

  - **Identify high-confidence malicious indicators:** Look for command lines where `cmd.exe /C` or `dllhost.exe` invoke processes based on `rundll32.exe` as a parent, especially those executing `.dll` files with cryptic or obfuscated argument patterns.

  - **Correlate alert with threat intelligence:** Cross-reference any identified behaviors with threat intelligence feeds regarding UNC2452 to validate if the observed behaviors align with known tactics, techniques, and procedures (TTPs) used by the actor.

  ### Prioritization

  This alert is of high severity within the enterprise context due to its association with a known advanced persistent threat (APT), UNC2452. The impact of compromised systems could lead to extensive data breaches and disruption of operations. Malicious abuse likelihood is high as these command patterns are commonly deployed in targeted attacks aiming to manipulate or exfiltrate sensitive information.

  ### Blind Spots and Assumptions

  This detection may be limited by the use of legitimate applications for benign file archiving and scripting tasks that could trigger the alert. It assumes that the relevant process creation logs are collected and monitored adequately across systems. Additionally, common evasion techniques may involve running processes with altered command-line arguments or employing alternate scripting tools. A related detection that strengthens coverage would be monitoring for connections to known C2 infrastructure linked to UNC2452 activities.

