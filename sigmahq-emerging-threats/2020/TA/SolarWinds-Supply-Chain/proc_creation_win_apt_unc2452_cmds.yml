title: UNC2452 Process Creation Patterns
id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
status: test
description: Detects a specific process creation patterns as seen used by UNC2452
  and provided by Microsoft as Microsoft Defender ATP queries
references:
- https://www.microsoft.com/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
author: Florian Roth (Nextron Systems)
date: 2021-01-22
modified: 2024-09-12
tags:
- attack.execution
- attack.t1059.001
- detection.emerging-threats
    # - sunburst
    # - unc2452
logsource:
  category: process_creation
  product: windows
detection:
    # To avoid writing complex condition. "selection_generic_1" and "selection_generic_2" are the same except for the extension used.
  selection_generic_1:
    CommandLine|contains:
    - '7z.exe a -v500m -mx9 -r0 -p'
    - '7z.exe a -mx9 -r0 -p'
    CommandLine|contains|all:
    - '.zip'
    - '.txt'
  selection_generic_2:
    CommandLine|contains:
    - '7z.exe a -v500m -mx9 -r0 -p'
    - '7z.exe a -mx9 -r0 -p'
    CommandLine|contains|all:
    - '.zip'
    - '.log'
  selection_generic_3:
    ParentCommandLine|contains|all:
    - 'wscript.exe'
    - '.vbs'
    CommandLine|contains|all:
    - 'rundll32.exe'
    - 'C:\Windows'
    - '.dll,Tk_'
  selection_generic_4:
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - 'C:\Windows'
    - '.dll'
    CommandLine|contains: 'cmd.exe /C '
  selection_generic_5:
    ParentImage|endswith: '\rundll32.exe'
    Image|endswith: '\dllhost.exe'
    CommandLine: ''
  condition: 1 of selection_generic_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  The rule titled "UNC2452 Process Creation Patterns" is designed to detect specific process creation behaviors associated with the UNC2452 threat actor, also referred to as the SolarWinds attacker. This detection focuses on abnormal command-line patterns and parent-child relationships among processes commonly exploited during a sophisticated attack, such as the one involving the SolarWinds Orion platform. Attacker objectives likely include data exfiltration, lateral movement within the network, and persistence, aiming to access sensitive systems and information.

  This rule primarily references techniques from the MITRE ATT&CK framework, particularly under the execution tactic. It includes techniques such as T1059.001 (Command and Scripting Interpreter: PowerShell), which highlights the execution of scripts or malicious commands via well-known Windows tools. The pattern of using `rundll32.exe` and `cmd.exe` in the command lines is indicative of advanced malicious behaviors that aim to bypass traditional security measures.

  Key data sources for this detection include:
  - Process creation event logs from Windows systems.
  - Command-line activity logs that capture executed commands and parameters.
  - Parent-child process relationships, which can reveal the context in which these executions occur.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation logs for instances of the detected command-line patterns. Identify the originating user and system to assess the legitimacy of the activity.

  - **Analyze Parent-Child Relationships**: Investigate the parent processes associated with the detected commands, particularly looking for `wscript.exe`, `rundll32.exe`, and `dllhost.exe`. Unusual parent-child relationships may indicate exploitation techniques commonly used by UNC2452.

  - **Correlate with Other Security Events**: Look for related events across other security controls (EDR, SIEM) that may indicate additional malicious behavior, such as failed logins, unusual outbound connections, or privilege escalation events.

  - **Scan for Related Artifacts**: Conduct a forensic analysis of the system to identify any artifacts related to the process patterns. This includes checking for the presence of suspicious scripts or the attempted execution of files with extensions such as `.vbs`, `.dll`, or `.log`.

  ### Prioritization
  Given the high level of sophistication associated with UNC2452, alerts stemming from this detection should be considered high priority. The potential impact of a successful compromise could lead to significant data breaches, thus warranting immediate attention from security responders.

  ### Blind Spots and Assumptions
  Detection capability may be limited if process creation logs are not adequately collected or retained, particularly on endpoint devices or servers. The detection logic assumes that all relevant command-line executions will generate process creation events for monitoring. Certain environments may lack visibility into the execution of scripts or nested process chains, and therefore may not capture all incidents related to UNC2452 activities. Moreover, an effective response requires that command-line logging is enabled on all relevant systems.

