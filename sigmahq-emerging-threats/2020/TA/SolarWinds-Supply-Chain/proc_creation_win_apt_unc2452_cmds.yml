title: UNC2452 Process Creation Patterns
id: 9be34ad0-b6a7-4fbd-91cf-fc7ec1047f5f
status: test
description: Detects a specific process creation patterns as seen used by UNC2452
  and provided by Microsoft as Microsoft Defender ATP queries
references:
- https://www.microsoft.com/security/blog/2021/01/20/deep-dive-into-the-solorigate-second-stage-activation-from-sunburst-to-teardrop-and-raindrop/
author: Florian Roth (Nextron Systems)
date: 2021-01-22
modified: 2024-09-12
tags:
- attack.execution
- attack.t1059.001
- detection.emerging-threats
    # - sunburst
    # - unc2452
logsource:
  category: process_creation
  product: windows
detection:
    # To avoid writing complex condition. "selection_generic_1" and "selection_generic_2" are the same except for the extension used.
  selection_generic_1:
    CommandLine|contains:
    - '7z.exe a -v500m -mx9 -r0 -p'
    - '7z.exe a -mx9 -r0 -p'
    CommandLine|contains|all:
    - '.zip'
    - '.txt'
  selection_generic_2:
    CommandLine|contains:
    - '7z.exe a -v500m -mx9 -r0 -p'
    - '7z.exe a -mx9 -r0 -p'
    CommandLine|contains|all:
    - '.zip'
    - '.log'
  selection_generic_3:
    ParentCommandLine|contains|all:
    - 'wscript.exe'
    - '.vbs'
    CommandLine|contains|all:
    - 'rundll32.exe'
    - 'C:\Windows'
    - '.dll,Tk_'
  selection_generic_4:
    ParentImage|endswith: '\rundll32.exe'
    ParentCommandLine|contains|all:
    - 'C:\Windows'
    - '.dll'
    CommandLine|contains: 'cmd.exe /C '
  selection_generic_5:
    ParentImage|endswith: '\rundll32.exe'
    Image|endswith: '\dllhost.exe'
    CommandLine: ''
  condition: 1 of selection_generic_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects specific process creation patterns associated with UNC2452, particularly utilizing 7-Zip and Windows Script Host (wscript.exe) with rundll32.exe. The likely objective of the attacker is to exfiltrate data or execute further commands, aligning with the MITRE ATT&CK Tactic: Execution (TA0040), Technique: Command and Scripting Interpreter - Windows Command Shell (T1059.001). The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which log new process creations and command line arguments.

  If malicious, this behavior can lead to unauthorized data exfiltration and potential lateral movement within the network. It’s essential to note that this detection does NOT confirm malicious activity on its own; it identifies patterns that may be used in an attack but require further investigation to confirm intent and impact.

  ---

  ### Investigation Steps

  - **Review process creation logs for suspicious activity:** Analyze Security Event ID 4688 and Sysmon Event ID 1 for instances of `7z.exe` being executed with command line arguments containing `-p` or `-mx9` and check the command line for `.zip`, `.txt`, or `.log` file extensions. Legitimate use of `7z.exe` typically does not involve sensitive file types or unusual compression parameters.

  - **Examine parent process relationships:** Identify parent processes of any detected `rundll32.exe` executions. Focus on instances where the parent command line includes `wscript.exe` with a `.vbs` script. Such patterns are commonly associated with malicious scripts attempting to leverage `rundll32.exe` for execution.

  - **Confirm execution context:** Check the context of `rundll32.exe` execution (Security Event ID 4688), specifically looking for command lines that include `cmd.exe /C` and point to the `C:\Windows` directory containing a `.dll`. This could indicate an attempt to run malicious commands.

  - **Look for process anomalies:** Verify if `dllhost.exe` is spawned with `rundll32.exe` as the parent process. This could indicate an attempt to execute DLL files dynamically, which is atypical for normal operation.

  - **Evaluate associated activity:** Cross-reference findings with network logs for unusual inbound or outbound connections that might suggest data exfiltration following the detected process creation. Particularly monitor for connections to known malicious IP addresses.

  - **Check for legitimate usage examples:** Identify and document expected legitimate activity involving `7z.exe` and `wscript.exe` usage within your environment. For example, scheduled backups or automated scripts should be recognized as benign.

  ---

  ### Prioritization

  This alert should be prioritized as high severity, considering that it may indicate advanced adversary activity, specifically targeting critical business systems for data exfiltration. The likelihood of malicious abuse is significant, as UNC2452 tactics have been weaponized in recent attacks against various sectors, underscoring the need for rapid investigation.

  ---

  ### Blind Spots and Assumptions

  Detection accuracy may be limited by potential evasion techniques, including the renaming or modification of tools such as `7z.exe` or `rundll32.exe`. Ensure logging is properly configured to capture all process creation events, including command line details. Legitimate activities such as software updates or maintenance scripts may unintentionally trigger the alert. Complementing this rule with detections for unusual outbound traffic or lateral movement events (e.g., T1075 - Pass the Hash) enhances the overall security posture.

