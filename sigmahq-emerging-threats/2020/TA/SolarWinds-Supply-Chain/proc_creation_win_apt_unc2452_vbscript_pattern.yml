title: Suspicious VBScript UN2452 Pattern
id: 20c3f09d-c53d-4e85-8b74-6aa50e2f1b61
status: test
description: Detects suspicious inline VBScript keywords as used by UNC2452
references:
- https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
author: Florian Roth (Nextron Systems)
date: 2021-03-05
modified: 2022-10-09
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'Execute'
    - 'CreateObject'
    - 'RegRead'
    - 'window.close'
    - '\Microsoft\Windows\CurrentVersion'
  filter:
    CommandLine|contains: '\Software\Microsoft\Windows\CurrentVersion\Run'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the use of suspicious inline VBScript keywords that are commonly exploited by the UNC2452 threat actor group, also known as Nobelium. The presence of commands like `Execute`, `CreateObject`, and `RegRead` in process creation events may indicate that an attacker is trying to execute malicious payloads or establish persistence on a compromised system. UNC2452 is known for its sophisticated tactics, often aiming to steal sensitive information from organizations, particularly those in the technology and security sectors.

  The relevant MITRE ATT&CK tactics include **Persistence (T1547.001)**, which involves establishing methods to keep a foothold in the environment, and **Privilege Escalation** techniques. Attackers may use VBScript to achieve persistent execution or escalate privileges by manipulating registry settings or environmental variables.

  The primary data sources for this detection are **process creation logs** on Windows systems, as they provide insight into command-line arguments used during process execution, allowing analysts to detect potentially malicious scripted activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation events in your SIEM for instances where the detected suspicious VBScript command-line patterns appear. Focus on processes that execute scripts or commands typically associated with persistence mechanisms.

  - **Correlate with User Activity:** Analyze the context of the process creation events by correlating them with user activities and behavioral baselines to identify any anomalies or unauthorized attempts to execute scripts.

  - **Inspect Registry Modifications:** Check the Windows Registry for any recent changes to the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` path, which could indicate attempts to establish persistence through malicious scripts.

  - **Conduct File Integrity Checks:** Verify the integrity and reputation of any VBScript files or associated payloads found on the filesystem that may correlate with the suspicious command lines detected.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of UNC2452's tactics, which could lead to data breaches and significant operational disruptions. The likelihood of encountering such behavior is heightened given the increasing sophistication of attackers and their methods.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by systems that do not log process creation events comprehensively or by environments where VBScript is disabled or filtered. The detection logic assumes that the presence of the specified keywords indicates malicious intent, which may not always be the case. Effective alerting requires that process logging is enabled on all Windows endpoints and that appropriate SIEM configurations are in place to capture and analyze the relevant telemetry data.

