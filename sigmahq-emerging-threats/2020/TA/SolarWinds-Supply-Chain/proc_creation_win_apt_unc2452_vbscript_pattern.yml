title: Suspicious VBScript UN2452 Pattern
id: 20c3f09d-c53d-4e85-8b74-6aa50e2f1b61
status: test
description: Detects suspicious inline VBScript keywords as used by UNC2452
references:
- https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
author: Florian Roth (Nextron Systems)
date: 2021-03-05
modified: 2022-10-09
tags:
- attack.persistence
- attack.t1547.001
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'Execute'
    - 'CreateObject'
    - 'RegRead'
    - 'window.close'
    - '\Microsoft\Windows\CurrentVersion'
  filter:
    CommandLine|contains: '\Software\Microsoft\Windows\CurrentVersion\Run'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the presence of suspicious inline VBScript keywords, particularly those associated with the UNC2452 threat group (also known as Nobelium). UNC2452 is known for its advanced persistent threat operations, especially targeting governmental and organizational email systems, utilizing custom malware and techniques for long-term data exfiltration. The specific command patterns outlined in the rule suggest an attempt by the attacker to establish persistence (T1547.001) by manipulating Windows startup scripts.

  The threat scenario is characterized by attackers aiming to deploy malicious scripts that run automatically on system reboot or user login, potentially facilitating further exploitation or data theft. Attackers leveraging VBScript can manipulate system configurations, access sensitive data, and execute arbitrary code—all activities aligned with maintaining a foothold within the targeted environment.

  Relevant MITRE ATT&CK tactics include:
  - Persistence (T1547.001): Abuse of startup folder for persistence.
  - Execution (T1059.005): Scripting for executing malicious actions.

  Primary data sources for model detection include:
  - Process creation events to monitor executed commands and the invocation of scripts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation logs for instances of VBScript execution that include keywords like 'Execute', 'CreateObject', 'RegRead', and 'window.close'.

  - **Analyze Command Line Arguments:** For identified processes, analyze command line arguments for malicious patterns, especially those that interact with registry or Windows startup directories (e.g., entries under '\Software\Microsoft\Windows\CurrentVersion\Run').

  - **Correlate with Historical Data:** Cross-reference findings with historical activity in the environment to identify any established persistence mechanisms or previously logged suspicious behavior coinciding with the alert generation.

  - **Inspect Event Logs:** Look into relevant Windows event logs (such as Security and Application logs) that could provide additional context about the execution and associated user activity surrounding the suspicious VBScript.

  ### Prioritization
  The severity of this alert is high due to the potential for long-term persistence and control that can be established by attackers using VBScript. The likelihood of exploitation can also be significant, especially in environments vulnerable to social engineering or where such scripts can execute with elevated privileges.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments that do not log process command line arguments, as such logs are integral for this detection to function effectively. Additionally, the assumption that all inline VBScript executions matching the specified patterns are malicious may lead to false positives, as legitimate administrative scripts could also trigger alerts. Ensuring that process creation logs are collected and retained is crucial for the successful implementation of this detection rule.

