logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - 'Execute'
    - 'CreateObject'
    - 'RegRead'
    - 'window.close'
    - '\Microsoft\Windows\CurrentVersion'
  filter:
    CommandLine|contains: '\Software\Microsoft\Windows\CurrentVersion\Run'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of inline VBScript that contains specific keywords associated with malicious activity by the UNC2452 group, such as 'Execute', 'CreateObject', 'RegRead', and 'window.close'. The likely objective of an attacker employing these scripts is to establish persistence and escalate privileges by modifying registry keys or executing malicious commands without raising traditional alarms. This detection aligns with the MITRE ATT&CK tactics of Privilege Escalation (TA0004) and Persistence (TA0003), particularly under the technique ID T1547.001.

  The primary telemetry source for this rule is Windows process creation logs, specifically focusing on CommandLine parameters associated with script execution. The security impact of successful exploitation could include unauthorized access or control over compromised systems. Importantly, this detection does not confirm malicious intent on its own; further investigation is required to contextualize the findings.

  ### Investigation Steps

  - **Examine CommandLine parameters**: Check for Event ID 4688 in the Security logs or Sysmon Event ID 1. Look for keywords "Execute", "CreateObject", "RegRead", and "window.close" in the CommandLine; these are strong indicators of potential malicious usage.

  - **Validate persistence mechanisms**: Inspect if the logs contain the registry path `\Software\Microsoft\Windows\CurrentVersion\Run`. This path indicates attempts to establish persistence; observe for any non-standard executables that are associated with user accounts.

  - **Identify legitimate usage patterns**: Cross-reference the identified CommandLine strings with known administrative tasks, such as legitimate software installations or system updates, that may use similar scripting techniques.

  - **Cross-check process tree**: Utilize Sysmon to view the parent-child process relationship for the identified process. If it's spawned by a non-standard parent process (e.g., command-line shells or unknown applications), it may indicate malicious intent.

  - **Review endpoint role**: Determine the role and criticality of the affected system. If the system has elevated privileges or administrative access, the risk escalates, necessitating immediate action.

  - **Check for file creation or modification artifacts**: Look for related events (e.g., File Creation Event ID 4663) that coincide with the execution of the VBScript. Pay attention to suspicious executable files in locations like `%TEMP%` or user profile folders, which may indicate data exfiltration or the placement of malware.

  ### Prioritization

  This alert should be considered high priority due to the potential impact on critical systems; if exploited, the attacker could gain elevated privileges and persistence on the network. The use of keyword patterns indicative of a known threat actor such as UNC2452 increases the likelihood of malicious abuse, making timely investigation essential.

  ### Blind Spots and Assumptions

  There are known limitations in detecting obfuscated or encoded VBScript, which can evade detection rules. Some legitimate administrative tools or scripting environments may generate similar command line patterns, resulting in potential false positives. Ensuring logging is configured to capture detailed process creation and command line arguments is crucial for reliable detection. A companion detection to enhance coverage could involve monitoring for anomalous registry modifications under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run` across multiple systems, which may reveal coordinated malicious activity.

