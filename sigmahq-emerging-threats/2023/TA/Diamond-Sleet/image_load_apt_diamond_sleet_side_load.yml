note: |
  ### Technical Context

  This Sigma rule detects DLL sideloading, a technique where an attacker loads a malicious DLL into a legitimate application, bypassing standard security checks. The likely objective of the attacker is to establish persistence and execute malicious code while maintaining stealth. The relevant MITRE ATT&CK tactic is "Persistence" (TA0003), and the technique is "DLL Side-Loading" (T1574.001). The primary telemetry source is Windows image load events, specifically tracking process creations and DLL loads, particularly through Event ID .audit. The security impact, if confirmed as malicious, could lead to unauthorized access or control over the affected system. This detection does NOT confirm that the activity is inherently malicious without further investigation.

  ### Investigation Steps

  - **Check process creation logs: ** Review windows security logs for Event ID 4688 to identify processes: specifically look for `clip.exe` in conjunction with the loading of `Version.dll` or `wsmprovhost.exe` loading `DSROLE.dll`. Compare the user context to expected behavior for these binaries.

  - **Validate DLL origins: ** Use PowerShell or Sysinternals tools to inspect the file properties of `Version.dll` and `DSROLE.dll`. Verify if the digital signatures are legitimate, and check if their paths correspond to typical application installations.

  - **Identify network connections: ** Investigate for any network activity linked to the identified processes by checking for outbound connections in Windows Firewall logs. Malicious activity may exhibit unusual connections to external hosts (unrelated to the expected application behavior).

  - **Document legitimate vs. malicious patterns: ** Note that `clip.exe` is typically a benign clipboard manager. However, if it's running in an unusual context or with unusual arguments (such as trying to load non-standard DLLs), it raises suspicion.

  - **Search for additional indicators: ** Review Windows Event ID 4104 (PowerShell script block logging) for any executed commands that may drop or interact with the DLLs in question. Look for scripts that invoke system binaries with unusual parameters.

  ### Prioritization

  This alert should be considered high severity due to the potential compromise of systems typically involved in sensitive operations. DLL sideloading is a known technique among threat actors, particularly in advanced persistent threat (APT) groups, making the likelihood of malicious abuse significant if confirmed.

  ### Blind Spots and Assumptions

  The main detection limitation lies in the possibility of legitimate applications also sideloading DLLs and the potential for them to trigger false positives. Required log sources include enhanced process logging and file creation events for reliable detection. Legitimate activities that may trigger the alert include application updates that involve unloading and loading of DLLs in legitimate contexts. A related detection to strengthen coverage is monitoring for unusual changes to application binaries through file integrity monitoring solutions.

