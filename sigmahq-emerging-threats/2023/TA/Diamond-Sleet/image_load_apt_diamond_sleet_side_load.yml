note: |
  ### Technical Context

  This rule detects DLL sideloading, a technique where a malicious DLL is loaded through a trusted executable, circumventing security controls. The likely attacker objective is to execute arbitrary code on a compromised host while maintaining camouflage by utilizing legitimate binaries. This behavior is positioned in the MITRE ATT&CK framework under Tactics such as Defense Evasion (TA0005) and Persistence (TA0003), specifically targeting techniques T1574.001 (DLL Sideloading).

  The primary telemetry sources are Windows Image Load events, specifically targeting the loading of DLLs associated with benign executables located in the ProgramData directory. If successful, this could lead to privilege escalation or system compromise. However, the detection alone does not confirm malicious intent; it must be investigated further in the context of additional activities and indicators of compromise.

  ### Investigation Steps

  - **Identify the initial suspicious executable:** Check for Event ID 4104 (PowerShell logs) for any preceding scripts that may invoke `clip.exe` or `wsmprovhost.exe`. Confirm if these processes are being executed without prior legitimate use.

  - **Assess loaded DLLs:** Review Event ID 4624 (logon events) and correlate with Sysmon Event ID 7 (Image loaded). Look for `Version.dll` and `DSROLE.dll` loaded within the context of the detected executables. Compare timestamps related to their execution to identify timing anomalies.

  - **Review persistence mechanisms:** Investigate the Windows Startup folder and Task Scheduler for any scheduled tasks or shortcuts that may attempt to relaunch `clip.exe` or `wsmprovhost.exe`, noting creation dates. Legitimate tasks or shortcuts should reference signed binaries.

  - **Evaluate process hierarchy:** Use Sysmon Event ID 1 (Process creation) to analyze parent-child relationships of the detected processes. A significant deviation from typical system processes may indicate malicious activity (e.g., `clip.exe` being launched by an uncommon parent process).

  - **Check for suspicious network activity:** Evaluate network logs (like Windows Firewall logs or proxy logs) for outbound connections initiated by `clip.exe` or `wsmprovhost.exe`, which are uncommon for these executables. Look for unexpected domains or IPs that the processes may be communicating with.

  ### Prioritization

  This alert should be considered high-priority due to its association with sophisticated APT tactics, like DLL sideloading, which can facilitate lateral movement and persistence within the network. The likelihood of malicious exploitation is high, particularly given the rising profiles of similar threats. Also, this technique is commonly weaponized against enterprise infrastructures.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by misconfigured logging settings that do not capture all relevant events for DLL loading or process creation. Legitimate applications may also load similar DLLs, creating a challenge in distinguishing malicious from benign activity. Additionally, attackers might use code obfuscation or benign executables for related evasion. A complementary detection to consider is monitoring for abnormal process parent-child relationships, which may indicate misuse of trusted applications.

