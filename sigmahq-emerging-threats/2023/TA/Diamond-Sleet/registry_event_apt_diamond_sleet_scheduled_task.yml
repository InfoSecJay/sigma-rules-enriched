note: |
  ### Technical Context

  This Sigma rule detects the creation of a scheduled task in the Windows registry that is indicative of activity related to the Diamond Sleet APT group, particularly exploiting the TeamCity CVE-2023-42793 vulnerability. The behavior suggests an attacker may aim to establish persistence on a compromised system or execute malicious tasks automatically. This activity aligns with the MITRE ATT&CK technique of Task Scheduling (T1053) under the Defense Evasion tactic.

  The primary telemetry sources include Windows Event Logs related to registry changes (e.g., Event ID 13 for registry modifications) and specifically monitoring for modifications related to scheduled tasks. If confirmed malicious, this could lead to unauthorized access or further exploitation within the network. It's important to note that the detection does NOT confirm the execution or success of any malicious activities on its own; it merely indicates a potential precursor to such actions.

  ### Investigation Steps

  - **Review registry changes:**
    Check Windows Event ID 13 logs for entries pertaining to the creation of new tasks under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. Look for any scheduled task names referencing "Windows TeamCity Settings User Interface" as a primary indicator of malicious intent.

  - **Validate scheduled task execution:**
    Use PowerShell command `Get-ScheduledTask` to confirm if the newly created task is present on the host and assess its execution settings. Look for execution triggers and actions that deviate from normal operational patterns.

  - **Correlate with affected systems:**
    Identify if any systems have the TeamCity application installed. Check for Event ID 4688 (process creation) around the same timestamps of registry changes to correlate with the execution of suspicious binaries linked to the created task.

  - **Identify legitimate task patterns:**
    Contrast against known, legitimate scheduled tasks within the environment. Document typical scheduled tasks running in your organization that should not trigger alerts, focusing on the names and execution paths.

  - **Check historical context:**
    Review historical logs for prior occurrences of registry changes at the same registry path. Assess if the creation of this task aligns with any known maintenance windows or updates from authorized personnel.

  ### Prioritization

  This alert is of high severity due to its high potential impact on critical systems often used for CI/CD processes. The likelihood of malicious exploitation is significant given the activities of the known APT group targeting specific vulnerabilities. The creation of scheduled tasks is a common tactic utilized by threat actors for persistence.

  ### Blind Spots and Assumptions

  Detection may have limitations if Windows logging is not enabled or if the registry was altered in a manner that circumvents standard logging. Activities such as legitimate software updates or administrative tasks could trigger the same alert. Related detections should include monitoring for unusual process creation events (Event ID 4688) associated with scheduled tasks, enhancing detection capabilities for follow-on activities.

