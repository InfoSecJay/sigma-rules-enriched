note: |
  ### Technical Context
  This detection rule identifies the creation of a scheduled task related to the Diamond Sleet APT group, which has targeted the TeamCity application by exploiting the CVE-2023-42793 vulnerability. The focus on creating tasks in the Windows registry indicates an effort by adversaries to maintain persistence and automate malicious activities within a compromised environment. This behavior can facilitate further exploitation or data exfiltration, aligning with the attacker’s objective to control the targeted infrastructure.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), specifically targeting **Scheduled Task/Job (T1569)** to run malicious scripts or executables undetected. By utilizing Windows’ task scheduling capabilities, attackers aim to obscure their activities and evade detection mechanisms. The primary data sources for detection consist of registry event logs, particularly from Windows which capture the modifications in the task scheduler settings and provide insights into the creation of scheduled tasks.

  ### Investigation Steps
  - **Examine Registry Logs:** Review registry event logs for any suspicious entries under `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\` to identify newly created tasks associated with the TeamCity application.
  - **Analyze Scheduled Task Attributes:** Investigate the attributes of the created scheduled tasks, focusing on their execution settings, triggers, and actions that could indicate malicious intent or unauthorized modifications.
  - **Correlate with Incident Reports:** Cross-reference the identified scheduled tasks with known indicators of compromise related to Diamond Sleet APT activities or CVE-2023-42793 exploitation reports to determine the relevance and true impact.
  - **Identify Contextual User Activity:** Look for user activity logs around the time of the task creation to ascertain whether they correspond to legitimate administrative actions or if they stem from unauthorized user accounts.

  ### Prioritization
  Given the high severity level of this alert, it signifies a critical potential security incident in the enterprise environment, as it indicates an advanced persistent threat's maneuvering for persistence and possible further exploitation within the network.

  ### Blind Spots and Assumptions
  This detection rule may have coverage gaps in environments where registry logging is disabled or where the system does not log all task modifications comprehensively. It assumes that the attackers will create scheduled tasks using expected naming conventions or paths. Therefore, ensuring that registry event logging is enabled and appropriately configured is vital for effective detection of these malicious activities.

