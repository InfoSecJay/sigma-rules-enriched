note: |
  ### Technical Context

  This Sigma rule detects the creation of a registry entry associated with a scheduled task related to the exploitation of the TeamCity CVE-2023-42793 vulnerability, specifically linked to the Diamond Sleet APT group. The likely attacker objective is to establish persistence on compromised systems by leveraging scheduled tasks to execute malicious payloads. This relates to the MITRE ATT&CK tactic of Persistence and technique T1685 (Scheduled Task/Job).

  The primary telemetry source involves Windows registry event logs, focusing on the path of the registry entries created for scheduled tasks. If malicious actors successfully deploy this method, they could maintain an ongoing presence within the network, enabling subsequent actions such as data exfiltration or lateral movement. Importantly, the detection of this registry event alone does not confirm that malicious activity is occurring, as legitimate applications may also create scheduled tasks.

  ### Investigation Steps

  - **Review created scheduled tasks:** Inspect the registry path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\` for entries within the last 24 hours. Look for the entry 'Windows TeamCity Settings User Interface' indicating potential malicious activity.

  - **Check Event IDs 4697 and 4698:** Validate whether the creation of a new service or scheduled task corresponds with the registry modifications. Focus on specific details including the task's command line and execution settings to establish context.

  - **Identify legitimate scheduled tasks:** Document any known legitimate scheduled tasks associated with TeamCity or other corporate applications. Compare recently created tasks against this baseline for discrepancy.

  - **Correlate with other telemetry:** Cross-reference this event with process creation logs such as Sysmon Event ID 1 to check for unexpected processes executing under the same timeframe as the task creation, specifically those attempting to use the TeamCity application.

  - **Examine user account activity:** Investigate the user accounts that generated these registry events through Security Event ID 4624, focusing on atypical account behavior or activity outside regular hours.

  - **Ascertain host context:** Confirm the system role and criticality of the affected asset. Critical systems, such as those running CI/CD pipelines using TeamCity, will warrant heightened scrutiny and rapid response.

  ### Prioritization

  This alert is significant due to the potential impact on critical infrastructure tied to development and deployment pipelines. Given the targeted use of the exploit by a known APT group, the likelihood of malicious abuse is high, as is the potential for subsequent exploitation or data theft. This behavior is consistent with advanced persistent threat tactics, warranting immediate investigation.

  ### Blind Spots and Assumptions

  This detection method may be circumvented by advanced evasion techniques such as legitimate tool use where scheduled tasks are common for maintenance or application updates. Continuous monitoring of Windows registry logs is essential for reliable detection, and any absence of real-time logging may hinder recognition of these events. Legitimate scheduled tasks from TeamCity or similar software could trigger this alert, leading to false positives. Complementary detections such as monitoring for unusual outbound network connections from these scheduled tasks can strengthen overall coverage and correlate potentially malicious activity.

