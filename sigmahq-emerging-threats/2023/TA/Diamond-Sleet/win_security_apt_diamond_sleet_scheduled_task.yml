note: |
  ### Technical Context

  This rule detects the creation of a scheduled task associated with the Diamond Sleet APT, specifically targeting a known vulnerability in TeamCity (CVE-2023-42793). The likely attacker objective is to establish persistence within compromised environments to execute malicious payloads at system startup or user session login. The detection aligns with the MITRE ATT&CK tactics of Execution (T1203) and Persistence (T1053.005).

  The primary telemetry source is Windows Security Event Log, specifically Event ID 4698, which captures the creation of scheduled tasks. If malicious, this behavior could allow adversaries to maintain access to systems, leading to data exfiltration or lateral movement. It's important to note that this detection does NOT confirm that the detected task has been executed or that the system is currently compromised without further analysis.

  ### Investigation Steps

  - **Check created task details:** Locate Event ID 4698 in the Security log to inspect the newly created task details, including the TaskName ('\Windows TeamCity Settings User Interface') and TaskContent for the string 'uTYNkfKxHiZrx3KJ'. Malicious tasks typically feature unusual or obfuscated names.

  - **Examine task execution history:** Review Event ID 4697 (Process Creation) to determine if the scheduled task has executed after creation, potentially indicating malicious activity. Legitimate scheduled tasks will usually have clear and identifiable names and paths.

  - **Identify parent process:** Look for Event ID 4688 to track the creation of processes spawned by the scheduled task. Malicious processes may show unusual parent processes or execution contexts that deviate from expected operational behavior.

  - **Verify security policies:** Ensure that the Advanced Audit Policy setting (Object Access > Audit Other Object Access Events) is configured correctly. Misconfiguration can lead to undetected task creation events.

  - **Cross-reference user activity:** Analyze user activity in relation to the task creation by reviewing relevant account logon events (Event ID 4624) to confirm that task creation aligns with legitimate user actions or administrative tasks.

  ### Prioritization

  This alert is critical due to its potential impact on high-value systems where the scheduled task could enable ongoing access to sensitive data. The likelihood of malicious abuse is high, especially considering the targeted exploitation of a known vulnerability. This behavior is often weaponized by advanced persistent threat (APT) groups.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques such as task name obfuscation or deletion after creation. Make sure that log sources are enabled for complete visibility, as missing Event ID 4698 instances could lead to gaps in detection capabilities. Genuine administrative tasks may also trigger the alert if not properly managed. A complementary detection rule could focus on monitoring for subsequent task activity or execution, thus enhancing overall detection coverage.

