note: |
  ### Technical Context
  This detection rule identifies the creation of a scheduled task associated with the Diamond Sleet APT actor, specifically targeting systems that have been exploited through the TeamCity CVE-2023-42793 vulnerability. The rule focuses on an Event ID 4698 in Windows security logs, which indicates that a new scheduled task has been created. The malicious task detected is named '\Windows TeamCity Settings User Interface' and contains specific suspicious content indicative of potential backdoor activity or persistence mechanisms employed by the attackers.

  The threat scenario involves advanced persistent threat (APT) actors leveraging legitimate software vulnerabilities to execute their malicious objectives, such as establishing a foothold within a network for ongoing surveillance, data exfiltration, or further compromise. These threat actors may employ this technique to ensure continuity of access even after initial indicators of compromise have been remediated. Relevant MITRE ATT&CK tactics and techniques include **Execution (T1059)** for executing commands, **Persistence (T1053.005)** for maintaining access through scheduled tasks, and **Privilege Escalation (T1068)** for exploiting vulnerabilities to gain elevated permissions.

  Primary data sources include Windows Security logs, specifically focusing on security events related to task creation and modifications. Also, examining event logs related to process creation would provide additional context about the execution of potentially malicious commands linked to the scheduled tasks.

  ### Investigation Steps
  - **Review Security Logs**: Analyze Windows Security Event ID 4698 logs to identify the timing and statistics of scheduled task creation. Pay special attention to the task name and its parameters.
  - **Correlate with Other Events**: Look for Event ID 4688 (Process Creation) around the same timeframe to capture any processes initiated by the newly created scheduled task. This can help identify any malicious activity that may have been executed.
  - **Check for Anomalous Behavior**: Investigate any unusual behavior associated with the user account that created the scheduled task to determine if it was compromised. Look for multiple failed logins or signs of privilege escalation.
  - **Analyze Registry Changes**: Review registry changes associated with scheduled tasks in the Windows Registry to find other potential indicators of compromise related to this APT activity.

  ### Prioritization
  This alert is considered critical due to the significant impact of APT activity on enterprise environments, particularly when targeting a known vulnerability. The likelihood of such activities increases during periods of heightened threat intelligence around specific vulnerabilities.

  ### Blind Spots and Assumptions
  The detection logic may not cover situations where the scheduled task creation is obfuscated or if the task runs under different names or parameters that do not match the specified detection criteria. Additionally, if audit logging settings are not properly configured, or if Event ID 4698 is not generated or collected, this detection will be ineffective. It is assumed that the environment has the Advanced Audit Policy setting for Object Access > Audit Other Object Access Events enabled to generate the necessary logs for detection.

