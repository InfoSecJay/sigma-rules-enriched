note: |
  ### Technical Context

  This Sigma rule detects the execution of a PowerShell script utilizing specific function calls commonly associated with the FIN7 threat group. The behavior primarily signifies an adversary attempting to deploy malware or scripts for data exfiltration and lateral movement within a target environment. The relevant MITRE ATT&CK tactic is **Execution (TA0002)**, and the specific technique is **Command and Scripting Interpreter: Windows PowerShell (T1059.001)**.

  The primary telemetry sources are PowerShell logs, specifically ScriptBlock logging, which should capture the execution of PowerShell scripts. If this activity is malicious, it can lead to significant security incidents, including data breaches and system compromise. Importantly, this detection does NOT confirm an active compromise on its own; further investigation is necessary to determine intent and outcome.

  ### Investigation Steps

  - **Review PowerShell Script Execution Logs**: Check for PowerShell logs (Event ID 4104) that contain the detected ScriptBlockText, specifically looking for invocation of `MainPayload` and `::WriteAllBytes` functions. This is indicative of possible malicious payload execution.

  - **Assess the Source of the Script**: Determine the origin of the script by reviewing the file path or script source (e.g., the command line or invoking process). Legitimate scripts will typically originate from approved administrative scripts, while suspicious executions may come from unexpected user directories.

  - **Validate User Context**: Identify the user context under which the script was executed. If it was run under a service account or a user without administrative privileges, this may signify malicious intentions. Normal administrative scripts would be executed by system administrators.

  - **Inspect System Changes**: Check for any system modifications immediately following script execution, such as new scheduled tasks or altered registry entries that might indicate the script was a part of a larger attack chain. Utilize Event IDs such as 4698 (scheduled task creation) for this validation.

  - **Cross-reference with Threat Intelligence**: Correlate the execution with threat intelligence feeds related to FIN7 tactics and techniques, which may provide additional context or historical data indicating previous compromises using similar methods.

  - **Look for Other Indicators of Compromise (IoCs)**: Investigate related behavioral patterns or indicators that may align with known FIN7 activity. Validate network traffic (e.g., unusual outbound connections associated with WScript.exe) to check for potential data exfiltration.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems, particularly if the execution aligns with known APT behaviors. The likelihood of malicious abuse is significant given the targeted nature of FIN7, which often leverages sophisticated scripts for destructive purposes. Such behavior is commonly weaponized and warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by factors such as improperly configured PowerShell logging or the potential for the adversary to obfuscate scripts. This rule relies on ScriptBlock logging; therefore, if it's disabled or improperly configured, appropriate coverage is lost. Legitimate administrative activities might inadvertently trigger the alert, especially in environments where PowerShell is heavily used for automation. A companion detection like monitoring for unusual outbound traffic or anomalous logins will strengthen overall detection capabilities against these threats.

