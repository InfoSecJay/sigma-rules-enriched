note: |
  ### Technical Context

  This detection rule identifies the creation of PowerShell scripts with specific names or suffixes associated with FIN7 activity, a known APT group. The likely objective of the attacker is to establish initial footholds or execute malicious commands on compromised systems, often leveraging such scripts for lateral movement or data exfiltration. The relevant MITRE ATT&CK tactic is Execution, specifically Technique T1059.001 (Command and Scripting Interpreter: PowerShell).

  The primary telemetry sources needed include file event logs from Windows systems, particularly monitoring for the creation of files with names ending in '_64refl.ps1' or precisely 'host_ip.ps1'. If malicious, this behavior could indicate a targeted attempt to compromise the system and facilitate further attacks. However, it’s important to note that the detection of script creation alone does NOT confirm that malicious activity is occurring; legitimate scripts may also be created by authorized users.

  ### Investigation Steps

  - **Check file creation events:** Review Windows File Event logs (Event ID 4663) for details on the newly created PowerShell scripts, specifically looking for TargetFilename values '_64refl.ps1' or 'host_ip.ps1'. Compare the user context under which these scripts were created.

  - **Identify parent processes:** Investigate the parent process associated with the script creation events by examining Process Creation events (Event ID 4688) to see if they stem from legitimate applications or processes. Legitimate activity often originates from known administration contexts.

  - **Verify script contents:** If accessible, retrieve the contents of the detected PowerShell scripts (Action: Get-Content <path_to_script>) to identify any suspicious commands or obfuscated code, which are typically indicators of malicious scripts.

  - **Compare timestamps and user behavior:** Cross-reference the creation timestamps of the scripts with user activity logs (Security Event ID 4624) to determine if the script creation aligns with unusual or unexpected user behavior.

  - **Monitor for related network activity:** Correlate this event with outbound connection attempts in Windows Firewall logs or network detection systems, looking for connections that may indicate C2 communication or data exfiltration following the script creation.

  ### Prioritization

  This alert is considered high severity due to the potential impact on the affected system and the likelihood of malicious abuse, particularly as FIN7 is known for utilizing such PowerShell scripts to facilitate advanced attacks. The likelihood of this behavior being weaponized is high due to the group's targeted tactics and techniques.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where PowerShell script logging is not enforced, making it difficult to discern legitimate scripts from malicious ones. Similar non-targeted PowerShell scripts executed by authorized users, such as routine maintenance tasks, could trigger this alert. A related detection might include monitoring for execution of PowerShell commands through known offensive frameworks (e.g., Cobalt Strike), which helps strengthen coverage against similar threats.

