note: |
  ### Technical Context
  This detection rule identifies the creation of specific PowerShell scripts that have been associated with the Advanced Persistent Threat (APT) group FIN7. FIN7 is known for targeting various sectors, particularly those related to financial services, and uses sophisticated techniques to deploy attacks, often leveraging PowerShell for command execution. The rule looks for scripts with names that have been commonly used in previous FIN7 campaigns, indicating potential malicious behavior.

  The primary motive of attackers using these scripts is usually to execute payloads that facilitate lateral movement, data exfiltration, or other nefarious activities within compromised networks. The ability to create and invoke such scripts may indicate an initial compromise phase, where an attacker is establishing a foothold within the environment.

  This rule correlates with several MITRE ATT&CK tactics and techniques, including:
  - Execution (TA0002): The use of scripts to execute commands.
  - User Execution (T1203): Possibly involving social engineering to prompt users to execute these scripts.

  The primary data sources that can be leveraged for this detection include file creation events from Windows systems, where activity may indicate the presence of malicious scripts.

  ### Investigation Steps
  - **Review File Creation Events**: Check for the creation of PowerShell scripts ending with '_64refl.ps1' and 'host_ip.ps1'. Investigate the timestamp and the source system for any unusual activity.
  - **Analyze PowerShell Command History**: Examine the PowerShell command execution logs to corroborate the script's purpose. Look for commands executed immediately before and after script creation to determine the context.
  - **Inspect Related Process Activities**: Look into process creation logs for any unexpected PowerShell instances or unusual parent-child process relationships that occurred around the same time the script was created.
  - **Correlate with User Activity**: Review user login and activity logs to identify whether the script execution followed any suspicious or unauthorized access patterns.

  ### Prioritization
  This alert has a high severity level due to the potential for significant impact in case of a successful compromise leading to data breaches or lateral movement within the network. The threat landscape indicates that APT groups like FIN7 are increasingly sophisticated, making early detection critical.

  ### Blind Spots and Assumptions
  This detection may not cover all variants of malicious PowerShell activity, particularly if attackers use different naming conventions or obfuscate their command scripts effectively. The logic assumes that the presence of specific named scripts is a clear indicator of compromise, which may not always hold true in environments with legitimate PowerShell use. Additionally, this alert requires proper logging configurations for file and process events on Windows to function effectively, and any gaps in these logs could significantly hinder detection capabilities.

