note: |
  ### Technical Context

  This Sigma rule detects the creation of specific PowerShell script files that are commonly associated with FIN7, a known advanced persistent threat (APT) group. The behavior can indicate malicious intent, typically involving initial access, command and control, or lateral movement objectives. Relevant MITRE ATT&CK tactics include "Execution" (TA0002) and the technique "PowerShell" (T1059.001). The primary telemetry sources include Windows File Event logs, specifically monitoring file creation processes to identify suspicious script filenames. If malicious, the creation of these scripts could lead to further exploitation, data exfiltration, or system compromise. However, this detection does NOT confirm that malicious activity is actively occurring without further context.

  ### Investigation Steps

  - **Review file creation telemetry:** Check Windows Security Event ID 4663 for file creation events specifically targeting filenames ending with '_64refl.ps1' or '\host_ip.ps1'. Look for creation events from unusual or untrusted paths as potential malicious indicators.

  - **Correlate with process execution logs:** Examine Sysmon Event ID 1 to identify if the PowerShell scripts were executed immediately after creation. Malicious use typically involves execution within a short time frame, whereas legitimate scripts may have a longer timeline or originate from trusted sources.

  - **Identify legitimate PowerShell script usage:** Assess the context of the script creation by reviewing the asset owner and application roles. Legitimate scripts might originate from trusted administrative locations or known automation tools that follow standard naming conventions unrelated to FIN7.

  - **Check for outbound network connections:** Validate if there are subsequent outbound connections from the host to suspicious or known malicious IP addresses after script creation using Windows Firewall logs (Event ID 5156). Malicious behavior often includes communication with C2 servers.

  - **Evaluate user account behavior:** Investigate user activity surrounding the alert via the Windows Security Event ID 4624, focusing on how the user authenticated to the system. Unusual sign-ins or logins from external networks could indicate compromised credentials.

  - **Look for companion detections:** Assess if there's a related alert for suspicious PowerShell commands (e.g., cmdlets like `Invoke-Expression` or `Invoke-WebRequest`) which may indicate exploitation following script creation, enhancing context for the investigation.

  ### Prioritization

  This alert has high severity due to the potential impact on critical systems, particularly if they contain sensitive data or are used in chain attacks. The likelihood of malicious exploitation is significant considering the script naming conventions are tied to known APT groups, making it a targeted, weaponized behavior.

  ### Blind Spots and Assumptions

  Detection may miss variants or obfuscated script names from the same threat actor or other actors using similar techniques. Reliable detection requires comprehensive logging from all endpoint systems and standard file monitoring configurations. Legitimate administrative activities, such as script updates or routine maintenance tasks, might also trigger this alert. A related detection to strengthen coverage is monitoring for suspicious PowerShell command execution patterns that often follow script creation.

