  ---

  ### Technical Context

  This Sigma rule detects the creation of PowerShell scripts with specific filenames commonly associated with FIN7 operations, particularly files ending in "_64refl.ps1" or named "host_ip.ps1". The likely attacker objective is to execute malicious commands or payloads on compromised systems, targeting sensitive data and lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactics of Execution (TA0002) and the technique of Command and Scripting Interpreter (T1059.001).

  The primary telemetry sources include Windows file event logs, specifically targeting event IDs associated with file creations (e.g., Event ID 4663 for access to an object). If successful, such behavior could lead to unauthorized access and control over critical assets. However, this detection does NOT confirm that the PowerShell script is malicious on its own, as legitimate users may create files with these names for benign purposes.

  ---

  ### Investigation Steps

  - **Check file creation events:** Review Windows Security Event ID 4663 for the relevant file creation, confirming the TargetFilename is either "_64refl.ps1" or "host_ip.ps1". If the file creation originates from legitimate processes (e.g., user-initiated PowerShell usage), it may be benign.

  - **Assess the process creating the file:** Analyze the parent process of the file creation event (Event ID 4688/Sysmon Event ID 1). Look for anomalous parent processes such as "powershell.exe" if it was launched from outside known administrative contexts, which may indicate malicious intent.

  - **Investigate file contents (if possible):** If the script file is accessible, review its content for suspicious commands or obfuscation techniques. Look for code execution patterns, especially those that align with known FIN7 methodologies.

  - **Identify network connections:** Review any outbound connections established immediately after the creation using Network Event logs (e.g., Windows Firewall logs). Look for suspicious connections to command-and-control (C2) servers or unusual ports.

  - **Establish a baseline for legitimate scripts:** Document legitimate PowerShell scripts commonly run by admins within the organization. Compare behavior and filename patterns to identify potential false positives.

  - **Monitor affected hosts' behavior:** If a potential malicious file was created, follow the investigation by monitoring the affected system for lateral movement or indicators of compromise. Use EDR solutions to assess any further suspicious activity.

  ---

  ### Prioritization

  This alert is of high severity due to the potential compromise of sensitive systems and the likelihood of malicious abuse by APT groups like FIN7. The specificity of file names being weaponized highlights their significance in executing attacks, making quick triage critical.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques if an adversary uses non-standard file names or executes PowerShell commands without creating files. Reliable detection requires proper logging configurations for file events, as missing logs could hinder investigations. Legitimate activities could include automated scripts for system administration or monitoring tasks creating similar file names. A companion detection, such as monitoring unusual PowerShell command invocations, can enhance coverage against script-based attacks.

