note: |
  ### Technical Context

  This detection identifies potential malicious execution of the PowerShell script known as "POWERTRASH." This script is often associated with advanced persistent threat (APT) groups like FIN7, targeting enterprises with specific payloads designed for data exfiltration and lateral movement. The script's actions indicate an adversary attempting to obfuscate malicious activity through legitimate PowerShell functionality, which can lead to unauthorized access to sensitive data.

  Relevant MITRE ATT&CK tactics include "Execution" (TA0002) and the technique "PowerShell" (T1059.001). The primary telemetry sources for this detection are Windows PowerShell logs, specifically focusing on script execution events. If malicious, the impact could include significant data loss or exposure, especially in sensitive business environments like Veeam servers utilized for backup and recovery. However, the detection alone does not confirm that a compromise has occurred, as legitimate administrative tasks may also invoke similar scripts.

  ### Investigation Steps

  - **Review PowerShell Execution Logs:** Check for PowerShell Executive Event ID 4104 entries, specifically for script blocks containing 'IO.Compression.DeflateStream', 'IO.MemoryStream', or other listed strings. Compare with known good scripts in your environment.

  - **Identify Process Creation Events:** Look for Security Event ID 4688 for processes initiated by PowerShell (e.g., powershell.exe) around the same timeframe. Confirm if the parent process is a legitimate scheduled task or administrative action versus unexpected activity.

  - **Examine Command-Line Arguments:** Analyze command-line arguments of the identified PowerShell process in Event ID 4688. Legitimate commands often contain recognizable parameters; presence of obfuscated strings or unusual parameters suggests potential misuse.

  - **Investigate Recent Changes to GAC:** Check for any modifications to the Global Assembly Cache (GAC), which may be reflected in System Event ID 7045 logs. Authorized updates from IT administrators are typical; unauthorized changes may indicate compromise.

  - **Validate Asset Configurations:** Ensure that the systems executing the script are not critical servers without adequate security controls. Investigators should identify if these hosts have enhanced logging capabilities enabled within the audit policy to catch PowerShell activity.

  - **Cross-reference with Threat Intelligence:** If the behavior is identified within a known timeframe of APT activity characterized by FIN7, corroborate findings with threat intelligence reports from sources tracking similar campaigns.

  ### Prioritization

  This alert should be given high priority due to its potential impact on sensitive systems, especially those involved in data backup and recovery processes. The established connections to recognized threat actors indicate a high likelihood of malicious abuse, as this specific technique has become a well-known vector for exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for misconfigured logging settings that may omit key events. The rule may also be triggered by legitimate automated tasks or scripts that employ similar PowerShell commands for benign purposes. Additionally, environments lacking comprehensive PowerShell execution logging may miss critical details. A companion detection to bolster coverage could include monitoring unusual outbound connections from systems executing identified scripts, correlating with potential data exfiltration attempts.

