note: |
  ### Technical Context
  This detection rule identifies anomalies related to scheduled tasks in Windows environments, specifically targeting the known names associated with the SVR (State-Sponsored Adversaries) used in the operation of the graphical Proton backdoor. The adversary's objectives typically include maintaining persistence within a compromised environment, enabling ongoing access to sensitive data, and performing further reconnaissance or exploitation activities. By leveraging scheduled tasks, attackers can execute malicious payloads or maintain control over systems without alerting defenders.

  Relevant MITRE ATT&CK techniques include:
  - **Persistence: Scheduled Tasks/Job** (T1053)
  - **Registry Run Keys / Startup Folder** (T1060)

  The primary data sources for this detection are Windows Event Logs, specifically those related to task creation and configuration changes. Events such as 4698 (a task was created), 4699 (a task was removed), and 4702 (a task was updated) will provide critical insights into unauthorized or suspicious scheduled tasks being established by potential threat actors.

  ### Investigation Steps
  - **Review Scheduled Task Logs:**: Examine Windows Event Logs for Event IDs 4698, 4699, and 4702. Focus on the `TaskName` field to identify any instances of the known malicious scheduled tasks listed in the detection logic.
  - **Analyze Process Creation Events:**: Investigate Event ID 4688 (process creation) around the time the suspicious scheduled tasks were created or altered. Check for the execution of unusual processes that may indicate the execution of a backdoor or related payload.
  - **Correlate with User Activity:**: Look into user activity logs to determine if these scheduled tasks were created by legitimate users or accounts. Identify if any accounts were used in a context that is inconsistent with normal behaviors or roles.
  - **Check for Persistence Techniques:**: Investigate other potential persistence mechanisms if the suspicious tasks are detected, such as modifications to startup folders or registry keys to further understand the breadth of the potential compromise.

  ### Prioritization
  This alert is considered high-severity due to the significant risk posed by the SVR and their use of persistence mechanisms. The likelihood of exploitation is elevated, given the sophistication typically associated with state-sponsored adversaries and the potential impact on enterprise security and data confidentiality.

  ### Blind Spots and Assumptions
  The detection logic assumes that all scheduled tasks will generate the specified Windows Event Logs; however, there may be scenarios where log generation is disabled or events are not recorded due to configuration issues. There is also a possibility that the threat actor may use non-standard task names that would not be captured by this rule. Required logs for the alert to function include comprehensive Windows Audit Policy settings for security log creation, focusing on audit policies related to task creation and modification.

