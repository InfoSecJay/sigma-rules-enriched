note: |
  ### Technical Context

  This Sigma rule detects the creation, modification, or deletion of scheduled tasks associated with SVR-specific task names that may indicate the use of the GraphicalProton backdoor. The likely attacker objective includes establishing persistence within the compromised environment, enabling continued access to the victim's systems for exfiltrating data or conducting further malicious actions. Relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and the technique **Create or Modify System Process** (T1543).

  Primary telemetry sources include Windows Security event logs, particularly Event IDs 4698 (Creating a Scheduled Task), 4699 (Removing a Scheduled Task), and 4702 (Updating a Scheduled Task Configuration). If these activities are malicious, they could lead to unauthorized access and control over the environment. This detection does NOT confirm that a scheduled task is malicious by itself without further context or analysis.

  ### Investigation Steps

  - **Check Event IDs**: Review Windows Security event logs for Event ID 4698, 4699, and 4702 to identify scheduled task activity. Focus on task names associated with SVR, like '\Microsoft\Windows\DefenderUPDService' and '\WindowUpdate', which are linked to potential malicious activity.

  - **Validate Scheduled Task Details**: For any identified tasks, examine their properties including Action, Trigger, and Conditions. Malicious tasks may have unusual execution contexts or commands pointing to non-standard executables or scripts.

  - **Look for Anomalous Creation Patterns**: Identify creation events of scheduled tasks happening outside normal operational hours (e.g., late night or early morning) as they may indicate malicious intent. Review timestamps against expected operational schedules.

  - **Identify Legitimate Instances**: Confirm expected scheduled tasks related to standard system operations, such as those for updates (e.g., '\Microsoft\Windows\WindowsUpdate\Scheduled AutoCheck'). Legitimate tasks would typically originate from well-known applications without irregular modifications.

  - **Check for Other Related Activity**: Identify other logs or events (e.g., process creation logs from Event ID 4688) that correlate with identified scheduled tasks to track any potentially harmful execution patterns that follow their creation.

  - **Assess Impacted Systems**: Determine the criticality of systems affected by the detected scheduled tasks. Tasks running on domain controllers or sensitive endpoints should be prioritized for in-depth investigation.

  ### Prioritization

  The alert has high severity due to the potential impact on critical systems that could be compromised by attackers utilizing SVR-related persistence techniques. Given the established use of similar methods by threat actors, the likelihood of malicious abuse is elevated.

  ### Blind Spots and Assumptions

  Detection may miss variants of scheduled task names or custom obfuscations used by attackers to evade detection. High-confidence detection relies on the complete logging of Windows Security logs, specifically configured to capture scheduled task events. Legitimate administrative activities may inadvertently trigger the alert, such as routine system updates by IT staff. Companion detections related to account logins (like Event ID 4624), process execution, or lateral movement can reinforce visibility of potential threats.

