  ---

  ### Technical Context

  This Sigma rule detects the creation or modification of scheduled tasks in Windows that match names associated with the SVR (State-Sponsored Threat Actors) targeting Campaigns, particularly those linked to the GraphicalProton backdoor. The likely attacker objective is to maintain persistence on compromised systems, facilitating further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Persistence (T1053.005) involving scheduled tasks.

  Primary telemetry sources include Windows Security logs, specifically Event IDs 4698 (a new scheduled task has been created), 4699 (a scheduled task has been deleted), and 4702 (a scheduled task has been modified). If malicious, the security impact could be significant, leading to increased control for threat actors over affected systems. Importantly, this detection does NOT confirm malicious activity on its own; benign task creation for legitimate purposes can also match the task names.

  ---

  ### Investigation Steps

  - **Review security event logs for scheduled tasks:**
    Check Windows Security logs for Event ID 4698, along with the specified task names. Look for any creation timestamps that coincide with user sessions that shouldn't be creating them.

  - **Identify the user context:**
    Examine the `SubjectUserName` and `SubjectDomainName` fields from Event ID 4698. Malicious actors often utilize system or non-privileged accounts, whereas legitimate tasks might be created by administrative or application-specific accounts.

  - **Check for modification or deletion events:**
    Confirm through Event IDs 4702 and 4699 if there have been modifications or deletions to these scheduled tasks, as this can illustrate an attempt to hide malicious persistence mechanisms.

  - **Correlate with other logs for signs of intrusion:**
    Assess other logs (e.g., Sysmon for process creations) around the time of the alert for suspicious application execution or command-line arguments that match known exploitation patterns.

  - **Determine legitimate task creation patterns:**
    Cross-reference the task names with established baselines of scheduled tasks deployed within the organization. Scheduled tasks for legitimate maintenance operations should generally align with known IT management practices.

  - **Assess system impact:**
    Evaluate the role of the affected system. Critical systems with unusual scheduled tasks can indicate a higher risk of future attacks or data breaches, requiring immediate escalation.

  ---

  ### Prioritization

  This alert warrants high priority due to the potential impact on critical infrastructure. The behavior is indicative of advanced persistent threat techniques, increasing the likelihood of malicious abuse, especially if these scheduled tasks deviate from established norms.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist due to possible evasion techniques, such as attackers using non-standard task names or modifying timelines to fit within legitimate operational hours. Reliable detection requires comprehensive logging configurations for scheduled task events. Legitimate activities, such as system updates or maintenance, may trigger similar alerts, necessitating thorough contextual review. Companion detections, such as monitoring for abnormal process creations in Sysmon logs, can strengthen coverage against this persistence technique.

