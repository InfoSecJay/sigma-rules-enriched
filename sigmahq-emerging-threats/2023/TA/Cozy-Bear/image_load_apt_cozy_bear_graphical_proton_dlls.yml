  ---

  ### Technical Context

  This Sigma rule detects the loading of specific DLLs that are indicative of the GraphicalProton backdoor, a sophisticated malware typically used for command and control and persistence by state-sponsored actors. The attacker objective is to establish a foothold on the compromised system, enabling further exploitation, data exfiltration, or additional malware deployment.

  This behavior relates to relevant MITRE ATT&CK techniques such as Persistence (T1547), Defense Evasion (T1562), and Privilege Escalation (T1574.001). The primary telemetry sources for detection are Windows image load events, particularly monitoring for specific DLL load histograms reflected in Event ID  powershell loads or Sysmon Event ID 5 related to image loading.

  Malicious use of these DLLs can significantly compromise the integrity and confidentiality of systems, while detection alone does not confirm active exploitation; DLL loading may occur without malicious intent in legitimate software as well.

  ---

  ### Investigation Steps

  - **Review loaded DLLs:** Check for the presence of the following DLLs in system logs: `AclNumsInvertHost.dll`, `AddressResourcesSpec.dll`, `BlendMonitorStringBuild.dll`, and others listed in the rule. Use Sysmon Event ID 5 or Security Event ID 4688 to find this information.

  - **Identify the parent process:** For each of the detected DLLs, trace back the parent process to determine its legitimacy. Look for unusual executable paths or processes that may indicate malicious activity. Focus on Event ID 4688 for detailed process creation information.

  - **Examine execution context:** Validate if the processes that loaded these DLLs are running under unusual user contexts. Check the fields for user accounts and group memberships in events related to process creation.

  - **Identify legitimate software:** Cross-reference the detected DLL functionalities against known software signatures. Legitimate applications may use similar DLLs under normal operational conditions, while unexpected behavior can be a strong indicator of compromise.

  - **Analyze recent changes to the system:** Investigate any recent installations or updates that could coincide with the loading of suspicious DLLs. Look for Event ID 7045 (New Service) or relevant software installation logs for any indications of unauthorized changes.

  - **Correlate with threat intelligence:** Use external threat intelligence sources to assess if the detected DLLs have been linked with known malicious activity or groups. This may involve reviewing CISA advisories or similar threat reports.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for exploitation through DLL loading, particularly if the host system is critical to operations. The likelihood of malicious intent is heightened by the specific nature of the DLLs being tracked, which are associated with known advanced persistent threats (APTs).

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques where attackers rename or modify DLLs to avoid detection. Complete visibility requires a comprehensive logging configuration, including Sysmon and Windows event logs. Legitimate applications might trigger this alert if they utilize the same DLLs for functionality, and it's advisable to cross-reference with known software inventories. Additionally, companion detections of process creation and unusual network activity can further enhance detection coverage in the context of a potential compromise.

