note: |
  ### Technical Context

  This Sigma rule detects the loading of specific DLL files associated with the GraphicalProton backdoor, a malware deployed for various malicious activities, including persistence, privilege escalation, and user execution. Attackers leveraging this backdoor usually aim to establish a foothold within an environment, gather sensitive information, or maintain command and control over compromised systems. The relevant MITRE ATT&CK tactics include Persistence and Privilege Escalation (TA0003, TA0004) and the technique of DLL Hijacking (T1574.001).

  The primary telemetry sources for this detection are Windows image load logs, particularly focusing on image loading events. The potential security impact is significant if these DLLs are loaded on critical systems, as this may indicate system compromise. Importantly, this detection does NOT confirm that the system is definitively compromised; it only flags the presence of specific malicious DLLs that may warrant further investigation.

  ### Investigation Steps

  - **Examine Loaded DLLs**: Review Windows Event ID  dish with a focus on ImageLoaded events to confirm the presence of the specified DLL names. Look for suspicious process parents and execution context.

  - **Verify Process Origin**: Check the execution path of processes that loaded these DLLs. Legitimate applications generally run from known directories (e.g., `C:\Program Files`), while suspicious activity may originate from temporary or user profile directories.

  - **Analyze Process Behavior**: Investigate the behavior of processes loading these DLLs, noting if they exhibit common signs of backdoor activity (e.g., network connections, unapproved file modifications). Use Sysmon Event ID 11 for network activity.

  - **Correlate with EDR Data**: Utilize endpoint detection and response (EDR) tools to correlate alerts with any recent user activity that may explain legitimate use of those DLLs. Identify if users with administrative privileges have executed these processes.

  - **Assess Host Role**: Determine the criticality of the asset where the DLLs were detected. Compromise on a domain controller poses a higher risk than a standard user machine.

  - **Identify Malicious Indicators**: Utilize threat intelligence feeds to correlate the detected DLLs with known malicious hashes or parent processes. This increases confidence in identifying compromise.

  ### Prioritization

  This alert is medium severity, primarily due to the potential impact on critical systems and the likelihood of malicious abuse. The specific use of known backdoor DLLs indicates a targeted effort by adversaries, suggesting a considerable focus on gaining unauthorized access and control.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use of these DLLs in certain enterprise applications or misconfigurations that allow their presence. Required log sources include Windows image load logs, and vigilance is needed to ensure they are enabled. Additionally, benign applications may occasionally use similar names, potentially triggering false positives. A related detection to bolster coverage could include monitoring for anomalous network behavior from processes that load these DLLs, providing further context for investigation.

