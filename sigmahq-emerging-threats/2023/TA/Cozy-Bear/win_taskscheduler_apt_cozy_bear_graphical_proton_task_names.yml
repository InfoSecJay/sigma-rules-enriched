note: |
  ### Technical Context

  This Sigma rule detects the creation, update, or deletion of scheduled tasks specifically associated with known names used by the SVR (State Sponsored Actor) leveraging the GraphicalProton backdoor. The likely attacker objective is to establish persistence on the victim machine by misuse of scheduled tasks for malicious actions. This behavior aligns with the MITRE ATT&CK framework under the tactic of Persistence and the technique of Scheduled Tasks (T1053). Primary telemetry sources include the Windows Task Scheduler operational logs, specifically Event ID 129 (Task Created), Event ID 140 (Task Updated), and Event ID 141 (Task Deleted). If malicious, this behavior can allow attackers ongoing access and control over the targeted systems. Importantly, this detection does not alone confirm malicious behavior; it merely indicates the presence of specific scheduled task names that require further investigation.

  ### Investigation Steps

  - **Check Event Logs for Task Changes:** Review the Microsoft-Windows-TaskScheduler/Operational logs for Event IDs 129, 140, and 141. Look for entries corresponding to the provided task names, with a focus on timing and source to assess whether they correlate with user-initiated actions or suspicious behavior.

  - **Identify Malicious Indicators:** Specifically look for task names such as '\defender' or '\Microsoft\Windows\DefenderService' being created or modified. If these tasks appear without adequate context or prior activity, it may indicate a compromise.

  - **Verify Legitimate Scheduled Tasks:** Cross-reference the detected tasks against known legitimate scheduled tasks active in your environment. For example, ensure that scheduled tasks related to Windows Defender or application updates are expected based on your organization's deployment and maintenance cycle.

  - **Analyze Task Properties:** For any identified suspicious tasks, analyze their properties, including triggers and actions (accessible via PowerShell or Task Scheduler). Malicious tasks often execute unusual binary files or scripts at strange intervals or times.

  - **Check System Connections and Anomalies:** Utilize network logs to identify any unusual outbound connections or communications that align with the times the scheduled tasks were created. Use Firewall or IDS logs for suspicious IP addresses or domains.

  - **Correlation with Related Alerts:** Investigate other alerts or logs related to unauthorized user logins, application behavior, or policy changes within the same time frame. Notable patterns may strengthen the case for malicious activity (related detection ID: 8fa65166-f463-4fd2-ad4f-1436133c52e1).

  ### Prioritization

  This alert is considered high severity due to its implications for system integrity and potential unauthorized access. The presence of SVR-specific scheduled task names commonly correlates with persistence mechanisms, increasing the likelihood of exploitation if left unaddressed. Additionally, the abuse of scheduled tasks is a known technique that adversaries rely on to maintain a foothold in the environment.

  ### Blind Spots and Assumptions

  The detection may have limitations if the Task Scheduler logs are not activated, as they are not enabled by default. Attackers may use randomized or obfuscated task names to evade detection, necessitating close analysis of application logs and behavior. Legitimate activities such as software updates may trigger similar alerts if not understood in the right context. A helpful companion detection would focus on monitoring unusual file execution activities (e.g., Event ID 4688 for process creation) that coincide with the schedule task events.

