note: |
  ### Technical Context
  This detection rule is tailored to identify the creation, update, or deletion of scheduled tasks on Windows systems that align with specific patterns associated with the GraphicalProton backdoor, a threat commonly attributed to state-sponsored actors (SVR). By monitoring for these known task names, security teams can spot potentially malicious activity aimed at establishing persistence within a compromised environment. The attacker’s objectives likely include maintaining access to the target system, exfiltrating data, or executing other malicious activities undetected.

  The rule directly relates to the MITRE ATT&CK framework's **Persistence** tactic, specifically under techniques such as **Scheduled Task/Job** (T1053). By exploiting scheduled tasks, attackers can ensure their malware runs at set intervals or on specific triggers, effectively making it harder to detect during routine operations. The primary data source leveraged for this detection is the Windows Task Scheduler operational event log, which captures events related to task lifecycle changes, specifically Event IDs 129, 140, and 141.

  ### Investigation Steps
  - **Review Scheduled Task Events**: Check the Windows Task Scheduler operational event log for Event IDs 129, 140, and 141, and correlate any findings with the task names identified in the detection rule.
  - **Analyze Task Configuration**: Examine the configurations of any suspicious tasks for unusual parameters or settings that deviate from standard operating procedures, focusing on command-line arguments and user context.
  - **Correlate with Other Indicators**: Identify related events, such as process creation logs or network connections, to assess potential command-and-control activity linked to the suspicious scheduled tasks.
  - **Identify Affected Systems**: Determine the presence of known indicators of compromise (IOCs) associated with the GraphicalProton backdoor on systems where the suspicious tasks were identified, and conduct a broader search for additional artifacts.

  ### Prioritization
  Given the high severity of this alert, it signals a likely attempt by sophisticated actors to establish a foothold in the enterprise environment. The combination of known task names and the context of persistence makes this a critical alert that warrants immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may miss scenarios where attackers use non-standard or custom task names, which can hinder recognition of their activities. Additionally, the effectiveness of this rule assumes that the operational event logs for the Task Scheduler are enabled on monitored systems, as they are disabled by default in Windows environments. Any failure to enable these logs will result in gaps in detection coverage, making it crucial for security teams to configure their environments accordingly to maximize the effectiveness of this alert.

