note: |
  ### Technical Context

  This detection rule identifies potential command-and-control (C2) beaconing activity to specific domains associated with 0-day attacks targeting iOS devices, as reported by Kaspersky and the FSB. Attackers leveraging these domains may aim to establish persistence and remotely control infected devices for data exfiltration or further exploitation. The relevant MITRE ATT&CK tactic is Command and Control (T1071), with a technique ID of G0020.

  The primary telemetry source for this detection is proxy log data, specifically looking for HTTP/HTTPS requests that contain designated hostnames. If malicious, the security implications could include data theft, unauthorized remote access, or lateral movement within the network. This detection alone does not confirm a successful compromise but indicates potential malicious activity that warrants investigation.

  ### Investigation Steps

  - **Review proxy logs for beaconing patterns**: Analyze proxy logs for recurring requests to the specified domains over a short time frame (e.g., multiple requests within a 5-minute period). Focus on log fields such as `cs-host` (client hostname), time, and destination IP.

  - **Identify first-access timestamps**: Check the initial occurrence of requests to these domains in the logs to establish the timeline of potential compromise. Legitimate applications typically make fewer outbound requests to unknown domains.

  - **Compare traffic against known good baselines**: Validate if the requesting host has a history of accessing these domains or if this activity is anomalous. Benign traffic may involve known business operations, such as software updates or licensing checks.

  - **Correlate with DNS resolution logs**: Investigate any DNS queries made for these domains and cross-reference the source IPs to identify if internal devices are conducting unusual DNS lookups indicative of compromise.

  - **Capture and analyze payloads from suspicious requests**: If possible, examine the data transferred during the requests to these domains. Look for base64-encoded content or irregular payload sizes that may suggest malicious data exfiltration.

  - **Evaluate asset criticality and response**: Determine the role of the affected host (e.g., a server hosting sensitive data vs. an isolated user machine). High-criticality assets require immediate containment and further forensic analysis.

  ### Prioritization

  This alert has high severity due to the nature of the affected domains and the potential impact of command-and-control operations that may lead to significant data breaches. The likelihood of malicious abuse is high, given the specific targeting of systems by advanced threat actors. This behavior is often weaponized in sophisticated and ongoing cyber threats.

  ### Blind Spots and Assumptions

  Detection limitations may include domain registration or hosting changes that could result in false negatives if attackers shift to new domains. Required log sources include comprehensive proxy and DNS logs, and both must be properly configured for reliable detection. Legitimate activities that can trigger the alert include third-party services requiring necessary communications to these domains, such as content delivery networks. A related detection, such as DNS C2 activities, may strengthen coverage and provide additional context for identifying potential intrusions.

