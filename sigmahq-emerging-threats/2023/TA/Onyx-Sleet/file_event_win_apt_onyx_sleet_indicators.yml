  ### Technical Context

  This Sigma rule detects file creation activity indicating potential Onyx Sleet APT (Advanced Persistent Threat) behavior, specifically targeting the creation of `inetmgr.exe` within the Windows ADFS (Active Directory Federation Services) directory. The attacker’s objective is likely to establish backdoor access or manipulate authentication services, enabling further exploitation of the network. This activity is associated with the MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Command and Scripting Interpreter" (T1059).

  The primary telemetry source is Windows file event logs, specifically monitoring actions related to file creation events. If malicious, such behavior could lead to unauthorized access and control over sensitive authentication processes. Notably, this detection does NOT confirm active exploitation on its own, as legitimate software development or administrative activities may also result in similar file creation events.

  ---

  ### Investigation Steps

  - **Examine file creation logs:** Review Windows Event ID 4663 logs for the creation of `inetmgr.exe` under `C:\Windows\ADFS\bg`. Look for alerts with the “Create File” operation to identify if suspicious processes initiated this action.

  - **Identify the parent process:** Correlate with Event ID 4688 to check the parent process that created `inetmgr.exe`. Benign processes like administrative tools would indicate legitimate actions, while unexpected parent processes may indicate malicious intent.

  - **Analyze timestamps and patterns:** Compare the timestamps of file creation against known maintenance periods or patch cycles. Unscheduled file activity at odd hours could indicate malicious behavior, deviating from typical operational hours.

  - **Validate file integrity and origin:** Use threat intelligence databases or utilities to assess the reputation of `inetmgr.exe`. Check if the hash of the created file matches any known malicious signatures or unusual variants.

  - **Correlate with user activity:** Examine user account activity around the file creation time using Event ID 4624 (Logon) to identify unusual logins or unauthorized access attempts. Verify if the user is authorized to perform actions within ADFS.

  ---

  ### Prioritization

  This alert is assessed as high severity due to its potential impact on critical identity and access management systems. The likelihood of malicious abuse is elevated, given the targeted nature of the APT group. This behavior aligns with known tactics used by cybercriminals, making it a priority for investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging or misconfiguration in logging settings for file events. Adversaries may attempt to evade detection through direct file creation in less monitored directories or use of legitimate administrative tools. Legitimate software updates or administrative tasks could trigger this alert, so contextual investigation is vital. A related detection mechanism to strengthen coverage includes monitoring for abnormal PowerShell scripts, as they are often utilized in initial compromises.

