  ### Technical Context
  This detection rule identifies file creation activity linked to the Onyx Sleet APT group, specifically monitoring for the creation of the executable file `inetmgr.exe` in the Windows ADFS background directory. The presence of this file may indicate that an attacker is attempting to maintain or establish persistence on a compromised system, often leveraging the TeamCity vulnerability CVE-2023-42793 as the entry point for their operations.

  The likely objectives of such attacks involve gaining unauthorized access to sensitive information, executing additional malware or tools, and moving laterally within the enterprise network. The detection logic is based on the MITRE ATT&CK framework, specifically targeting the technique for Execution (T1203 - Exploit Public-Facing Application) and potentially impacting the Initial Access (T1190 - Exploit Public-Facing Application) tactics.

  Relevant telemetry sources that can provide evidence of this activity include file event logs from Windows systems to detect the specific file creation, alongside EDR data that may reveal any anomalous or malicious behavior associated with processes that interact with this file.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine the Windows file event logs for any occurrences of `inetmgr.exe` being created in the `C:\Windows\ADFS\bg\` directory, noting the user context and any associated parent processes.

  - **Analyze EDR Alerts:** Investigate EDR alerts around the time of the file creation for any suspicious process behavior, particularly any connections or commands executed by the file that may indicate further exploitation.

  - **Cross-reference Network Traffic:** Correlate the file creation events with network traffic logs to uncover any outbound connections initiated by the system post-file creation, which may indicate data exfiltration or command-and-control communications.

  - **Examine User Activity:** Assess user account activity leading up to the file creation event to determine if there were any unauthorized access attempts or unusual login activities that coincide with the detection.

  ### Prioritization
  This alert has a high severity due to the potential impact of APT-related file creation activities, which could signify a compromise of sensitive systems or data. The likelihood of successful exploitation in enterprise environments is significant, especially if the vulnerabilities are left unpatched.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if file event logging is not enabled or if there are restrictive policies in place that prevent logging of certain types of file operations. The detection logic assumes that the `inetmgr.exe` file is not a legitimate application used in the environment. Moreover, required logs for this rule to function effectively include comprehensive file event logging specifically capturing created files in system directories and proper EDR telemetry to provide context about process executions related to these alerts.

