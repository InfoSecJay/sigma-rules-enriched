  ### Technical Context

  This Sigma rule detects the creation of the file `inetmgr.exe` in the `C:\Windows\ADFS\bg\` directory, which is indicative of activity associated with the Onyx Sleet APT group. The likely objective of the attacker is to exploit vulnerable systems by placing malicious code, leveraging the process to maintain persistence and potentially execute further malicious activities. This behavior maps to the MITRE ATT&CK framework under the technique T1105: Ingress Tool Transfer, where adversaries transfer tools or payloads into a compromised environment.

  The primary telemetry source for this detection is Windows file event logs, specifically events related to file creation. If this activity is malicious, it poses a significant risk as it may provide the adversary with the means to execute a remote payload, potentially leading to data exfiltration or lateral movement within the network. Importantly, this detection does NOT confirm that the file is inherently malicious without further context; legitimate applications may potentially invoke similar file creation.

  ---

  ### Investigation Steps

  - **Assess the file creation event:** Review Windows Security Event ID 4663 to identify the creation of `C:\Windows\ADFS\bg\inetmgr.exe` and the process that executed this action. Look for process names known for being abused in similar adversary operations.

  - **Check parent process details:** Examine Sysmon Event ID 1 to analyze the parent process that initiated the file creation. Verify whether the parent process is a legitimate system service or a known malicious process.

  - **Evaluate recent changes in ADFS configuration:** Investigate any recent administrative activities on the ADFS service. Windows Event Logs related to ADFS configuration changes can indicate legitimate maintenance versus potential exploitation.

  - **Identify network behavior post-file creation:** Check outbound connections made by the newly created `inetmgr.exe` using Sysmon Event ID 3 (network connection). Look for connections to known malicious IPs or unusual external communication patterns.

  - **Compare to known good behavior:** Review similar file paths and processes within the environment. Legitimate instances of `inetmgr.exe` creation typically do not occur in the `C:\Windows\ADFS\bg\` path and are part of authorized update procedures.

  - **Conduct threat intelligence lookup:** Search in threat intelligence databases for any indicators associated with the file creation event or the wider Onyx Sleet APT group operations to validate potential malicious intent.

  ---

  ### Prioritization

  This alert is considered high severity due to the critical nature of Windows ADFS systems in enterprise environments. The impact of compromised systems can be extensive, allowing for potential unauthorized access to sensitive information. Additionally, the likelihood of malicious activity is heightened, as the detection relates to a known APT targeting vulnerabilities for scripted exploitation.

  ---

  ### Blind Spots and Assumptions

  This detection may not identify all instances of malicious file creation due to file renaming or evasion through obfuscation techniques. Additionally, reliable detection requires proactive logging settings, particularly enabling file auditing on specific directories. Legitimate administrative activities, such as software updates or configuration changes, can trigger similar alerts. A companion detection worth noting involves monitoring for suspicious PowerShell activity (T1086) which may precede or follow file creation by the APT.

