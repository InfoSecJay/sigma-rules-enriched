logsource:
  product: windows
  category: image_load
detection:
  selection_mscoree:
    Image: 'C:\ProgramShared\PresentationHost.exe'
    ImageLoaded: ':\ProgramShared\mscoree.dll'
  selection_colorui:
    Image: 'C:\ProgramData\Adobe\colorcpl.exe'
    ImageLoaded: 'C:\ProgramData\Adobe\colorui.dll'
  selection_mapistub:
    Image: 'C:\ProgramData\Oracle\Java\fixmapi.exe'
    ImageLoaded: 'C:\ProgramData\Oracle\Java\mapistub.dll'
  selection_hid:
    Image: 'C:\ProgramData\Adobe\ARM\tabcal.exe'
    ImageLoaded: 'C:\ProgramData\Adobe\ARM\HID.dll'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the sideloading of trojanized DLLs associated with the Lazarus APT group, specifically targeting executable processes that are known to load malicious DLLs deceptively or through exploitation of the legitimate software environment. The likely objective of the attacker is to deploy malware for espionage or data exfiltration in sensitive environments, such as aerospace companies. This behavior corresponds with the following MITRE ATT&CK tactics and techniques: Execution (T1203), Persistence (T1574.001), and Privilege Escalation (T1068).

  The primary telemetry sources are Windows image load events, specifically through the Windows Event log for image loads (Event ID 4104) or Sysmon (Event ID 7) which provides details about which DLLs are being loaded by executed processes. If malicious, this activity can compromise sensitive data and offer adversaries persistence and control over the target environment. It is important to note that this detection does NOT confirm that the loaded DLL is inherently malicious; additional investigation is required to verify the nature of the DLL.

  ### Investigation Steps

  - **Verify the Process Origins:**
    Examine the parent process and file details for `C:\ProgramShared\PresentationHost.exe`, `C:\ProgramData\Adobe\colorcpl.exe`, or any other specified paths to confirm they are legitimate software installations. Known benign applications should correspond with verified hashes.

  - **Identify Loaded DLLs:**
    Utilize Sysmon Event ID 7 logs to review the DLLs loaded by suspicious processes. Check if any of the DLLs (e.g., `mscoree.dll`, `colorui.dll`, `mapistub.dll`, `HID.dll`) do not match legitimate versions or are located in unusual directories.

  - **Check for Anomaly in Execution Context:**
    Cross-reference the alerting process with expected behavior from legitimate activities, such as normal use of Adobe applications or Java processes. Look for discrepancies in execution parameters or command lines suggesting misuse or unexpected automation.

  - **Review Event Log for Additional Indicators:**
    Investigate Windows Security Event ID 4688 for any suspicious command lines related to the execution of the identified processes and corresponding DLL loads. Look for signs of obfuscation or automation that indicate malicious intent.

  - **Analyze Network Activity:**
    Conduct network traffic analysis to identify any unusual outbound connections originating from the suspect processes. Look for connections to known malicious IP addresses or domains associated with the Lazarus group.

  - **Scan for Known Malicious Hashes:**
    Use endpoint detection tools to check for known malicious hashes related to the identified DLLs or executables from threat intelligence feeds or internal investigations. If matches are found, escalate for immediate containment procedures.

  ### Prioritization

  This alert has high severity due to the critical nature of the impacted systems, particularly in sensitive sectors like aerospace. The likelihood of malicious abuse is significant given the active targeting of such organizations by APT groups. This behavior is commonly weaponized in sophisticated attacks, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications that may utilize similar mechanisms for DLL loading, potentially leading to false positives. Ensure all relevant telemetry is being collected, particularly Windows event logs and Sysmon configuration to capture image load events accurately. Legitimate behavior such as software updates or development environments may also trigger this alert. Implementing companion detections for anomalies in parent-child process relationships can enhance overall detection coverage.

