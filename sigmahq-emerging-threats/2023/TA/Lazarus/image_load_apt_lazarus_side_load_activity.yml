note: |
  ### Technical Context

  This Sigma rule detects the sideloading of trojanized DLLs associated with the Lazarus Group, particularly linked to campaigns targeting organizations in the aerospace sector. The behavior observed involves a legitimate executable loading a malicious DLL, indicating an attempt to execute code with potentially harmful intentions. This technique relates to MITRE ATT&CK under the tactics of Persistence (TA0003), Execution (TA0002), and Privilege Escalation (TA0004) with the specific technique being DLL Sideloading (T1574.001). Primary telemetry sources include Windows Image Load events, specifically tracking the execution of executables like `PresentationHost.exe` and `colorcpl.exe` alongside their corresponding DLLs. If malicious, a successful sideload might enable remote access, data exfiltration, or further lateral movement within the network. This detection does NOT confirm that a breach has occurred without additional forensic evidence corroborating exploitation.

  ### Investigation Steps

  - **Review Event IDs for Executable Loads:** Check for Windows Event ID 4104 or Sysmon Event ID 10 to identify the loading of `C:\ProgramShared\PresentationHost.exe` with `mscoree.dll` or any other listed DLLs. Noted loading times and source paths can help differentiate between malicious and benign behavior.

  - **Analyze the Context of Executables:** Validate the legitimacy of `C:\ProgramShared\PresentationHost.exe`, `C:\ProgramData\Adobe\colorcpl.exe`, and others. These executables should have a recognized publisher and expected file size—any discrepancies could indicate malicious tampering.

  - **Correlate User Behavior with Alerting Events:** Witness user activity around the time the alert fired. Legitimate interaction with the affected executables—executed from known directories by expected users—may suggest benign behavior.

  - **Investigate the DLLs for Known Bad Signatures:** Use an anti-virus/malware tool to analyze `mscoree.dll`, `colorui.dll`, `mapistub.dll`, and `HID.dll` to determine if they are flagged or known to be malicious based on threat intelligence feeds.

  - **Assess Network Traffic Post-Alert Trigger:** Review network logs for any outbound connections or unusual traffic patterns correlating with the execution of the detected components. Malicious indicators might include connections to known Command and Control (C2) IPs.

  ### Prioritization

  This alert is of high severity due to the critical nature of the systems involved (targeting aerospace sectors). The likelihood of malicious exploitation is significant given the sophisticated tactics of the Lazarus Group, which is known for leveraging such methods for infiltration and persistent access. The weaponization of DLL sideloading is well-documented, increasing the need for immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded through legitimate use of similar DLL-loading techniques in benign applications, such as software updates or internal tools. Adequate logging configurations for Windows Image Load events are essential for reliable detection. Additionally, benign application usage, like loading dynamically linked libraries in the development environments, might trigger false positives. Companion detections could include monitoring for unusual PowerShell or command line activities following the execution of flagged executables to better ascertain behavior patterns.

