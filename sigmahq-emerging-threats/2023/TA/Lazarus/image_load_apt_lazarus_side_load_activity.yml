logsource:
  product: windows
  category: image_load
detection:
  selection_mscoree:
    Image: 'C:\ProgramShared\PresentationHost.exe'
    ImageLoaded: ':\ProgramShared\mscoree.dll'
  selection_colorui:
    Image: 'C:\ProgramData\Adobe\colorcpl.exe'
    ImageLoaded: 'C:\ProgramData\Adobe\colorui.dll'
  selection_mapistub:
    Image: 'C:\ProgramData\Oracle\Java\fixmapi.exe'
    ImageLoaded: 'C:\ProgramData\Oracle\Java\mapistub.dll'
  selection_hid:
    Image: 'C:\ProgramData\Adobe\ARM\tabcal.exe'
    ImageLoaded: 'C:\ProgramData\Adobe\ARM\HID.dll'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious DLL sideloading activities associated with the Lazarus APT group, particularly in the context of a reported attack campaign against a Spanish aerospace company. Sideloading occurs when a legitimate application loads a malicious DLL, allowing attackers to execute their malware stealthily. In this instance, the targeted DLLs are trojanized versions of standard libraries related to various legitimate applications, which Lazarus uses to maintain access or escalate privileges in a compromised environment.

  The likely attacker objectives include persistent access to the network, data exfiltration, or the execution of further malicious payloads in the environment. This behavior corresponds with MITRE ATT&CK techniques, specifically `T1574.001 - DLL Side-Loading`, which falls under the tactics of `Defense Evasion`, `Persistence`, and `Privilege Escalation`. The primary data sources relevant to detecting this activity are Windows operating system logs, particularly those capturing image load events.

  ### Investigation Steps
  - **Review Image Load Events**: Check image load events in the Windows logs to identify any abnormal DLLs being loaded, especially those associated with the specified paths in the detection logic.
  - **Analyze Process Execution Logs**: Investigate related process execution logs to understand the context in which the "PresentationHost.exe," "colorcpl.exe," "fixmapi.exe," and "tabcal.exe" were executed, looking for anomalies in timing or source.
  - **Correlate Network Activity**: Look for suspicious outbound network connections initiated by these processes, which may indicate attempted data exfiltration or communication with a command and control server connected to the Lazarus APT.
  - **Check for Other Malware Indicators**: Search for additional indicators of compromise (IoCs) associated with Lazarus operations, such as known malicious file hashes or registry modifications that align with their tactics.

  ### Prioritization
  The alert severity is considered high due to the potential for significant impact if advanced persistent threats successfully establish a foothold in the environment. The likelihood of such threats operating in industries like aerospace is also elevated, making this detection critical for cybersecurity posture.

  ### Blind Spots and Assumptions
  One blind spot in this detection coverage is the potential for legitimate software updates or benign applications that might trigger similar DLL sideloading patterns, leading to false positives. The rules also assume that the process paths and binaries remain constant and are not altered by an attacker. This detection relies heavily on having comprehensive logging enabled for image load events and may miss instances if such logs are not retained or correctly configured. It's crucial that organizations maintain thorough monitoring and logging practices to ensure effectiveness.

