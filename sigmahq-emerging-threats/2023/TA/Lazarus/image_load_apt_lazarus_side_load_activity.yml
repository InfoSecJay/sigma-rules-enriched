detection:
  selection_mscoree:
    Image: 'C:\ProgramShared\PresentationHost.exe'
    ImageLoaded: ':\ProgramShared\mscoree.dll'
  selection_colorui:
    Image: 'C:\ProgramData\Adobe\colorcpl.exe'
    ImageLoaded: 'C:\ProgramData\Adobe\colorui.dll'
  selection_mapistub:
    Image: 'C:\ProgramData\Oracle\Java\fixmapi.exe'
    ImageLoaded: 'C:\ProgramData\Oracle\Java\mapistub.dll'
  selection_hid:
    Image: 'C:\ProgramData\Adobe\ARM\tabcal.exe'
    ImageLoaded: 'C:\ProgramData\Adobe\ARM\HID.dll'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the sideloading of malicious DLLs associated with the Lazarus APT group, which has been linked to cyber-attacks aimed at various industries, including aerospace. Sideloading involves the execution of a legitimate application that is tricked into loading a trojanized DLL, thereby enabling the attacker to gain unauthorized access or execute malicious code on the victim's system. In the referenced cases involving a Spanish aerospace company, the attackers were found to be employing this technique to compromise systems, likely with intentions of espionage or data theft.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1562)**: The attackers exploit the legitimate applications to evade detection while executing malicious payloads.
  - **Privilege Escalation (T1574)**: The sideloaded DLLs may be designed to execute with elevated privileges, allowing attackers to escalate their control over the system.
  - The identified techniques, such as **T1574.001** (DLL Side-Loading) and **T1574.002** (File and Directory Permissions Modification), directly reflect the methods used by Lazarus in their campaigns.

  The primary data sources for evidentiary logs will be process creation events and image load events on Windows systems, specifically focusing on the instances where legitimate applications load unfamiliar or unauthorized DLLs.

  ### Investigation Steps
  - **Review Image Load Events**: Examine Windows process logs for instances where the specified applications (e.g., `PresentationHost.exe`, `colorcpl.exe`, `fixmapi.exe`, `tabcal.exe`) are loading DLLs. Pay particular attention to any anomalies in the `ImageLoaded` path.
  - **Correlate with Recent Changes**: Investigate any changes or newly deployed software in the environments for associations with the applications noted in the detection logic, ensuring to track version history and source locations of these binaries.
  - **Analyze Execution Context**: Determine the user or system context in which the DLL sideloading occurs, looking for signs of privilege escalation or unauthorized access that aligns with known patterns of Lazarus APT activity.
  - **Search for Indicators of Compromise**: Utilize threat intelligence sources to identify any known hashes or signatures related to the DLLs used in past Lazarus APT breaches and check against your environment's file integrity.

  ### Prioritization
  This alert is considered high severity due to the sophisticated nature of the Lazarus APT group, which indicates a significant threat to sensitive and critical infrastructure. The potential for data theft and system compromise, especially in sectors like aerospace, necessitates immediate investigation and response.

  ### Blind Spots and Assumptions
  The detection logic primarily hinges on the presence of specific application-DLL pairings and may not account for all potential sideloading scenarios. There are possible gaps if new legitimate applications are introduced or if attackers use different paths or filenames for their malicious DLLs. This rule assumes that process creation and image load events are adequately logged and retained in the environment, which requires appropriate configurations of the logging system for full visibility.

