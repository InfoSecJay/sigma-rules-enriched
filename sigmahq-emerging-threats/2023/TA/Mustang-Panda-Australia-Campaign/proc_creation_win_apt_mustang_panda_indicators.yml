note: |
  ### Technical Context

  This Sigma rule detects the execution of specific command line strings associated with the anomalous behavior of the Mustang Panda APT group targeting Australian governmental entities. The behavior signifies an attempt to establish persistence via modification of the Windows registry to load a malicious DLL file during system startup. The likely attacker objective is to maintain access and execute payloads without detection.

  This detection aligns with the MITRE ATT&CK tactic of “Execution” (TA0002) and specifically the technique of “Startup Items” (T1053.001). Primary telemetry sources include Windows process creation logs, notably Security Event ID 4688 and Sysmon Event ID 1, capturing command line operations. If malicious, this behavior could grant an adversary persistence on the system within a sensitive environment. Importantly, this detection does NOT confirm a successful execution of the malicious payload or that the system is compromised without further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Filter for Security Event ID 4688 or Sysmon Event ID 1 from the relevant timeframe. Check for command lines containing 'copy SolidPDFCreator.dll' or modification patterns in the registry paths mentioned in the rule.

  - **Validate registry changes for persistence:** Access the registry to inspect the key `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`. Look for entries related to 'SolidPDF' and match the creation times with the event logs to identify potential unauthorized changes.

  - **Identify benign activities:** Establish a baseline of expected behavior in the environment. Legitimate activities might involve similar DLL file operations if they are part of approved software deployments or updates. Cross-reference legitimate users or processes involved in such actions.

  - **Identify high-confidence malicious indicators:** Look for command lines that exhibit both 'reg ' and 'SolidPDF' in conjunction with the specific directory path. The combination of these elements may indicate a significant compromise attempt.

  - **Assess criticality of affected host:** Determine the role of the affected asset, especially if it’s a server or workstation handling sensitive data or government-related tasks. Higher criticality may necessitate immediate containment actions.

  - **Confirm file integrity and exfiltration:** Inspect the file system for the existence of `SolidPDFCreator.dll` in `C:\Users\Public\Libraries\PhotoTvRHD\`. Validate its hash against known malware signatures or established clean versions.

  ### Prioritization

  This alert signifies a high severity due to the impact of potentially compromising systems within a governmental entity, as well as the likelihood of malicious abuse by advanced persistent threats. The specific command patterns detected have been shown to be part of a targeted campaign, indicating a degree of sophistication that necessitates urgent investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by sophisticated evasion techniques, such as obfuscation of the command line or utilization of legitimate system processes to avoid triggering alerts. It is crucial to ensure that Windows event logging and Sysmon are properly configured to capture all relevant logs. Legitimate software installation or updates utilizing similar registry modifications may inadvertently trigger this alert. Companion detections for monitoring unusual behavior in the log-in or registry access process can strengthen overall coverage.

