note: |
  ### Technical Context
  This rule detects specific command line execution patterns associated with the threat actor known as Mustang Panda, linked to targeted operations against the Australian government. Mustang Panda's tactics typically involve the deployment of malware to establish footholds within targeted networks, facilitating data exfiltration and further exploitation. Their approach may involve manipulating legitimate software processes, such as SolidPDFCreator, to evade detection while executing malicious intentions.

  Relevant MITRE ATT&CK tactics include **Execution (T1203)** as the actors execute commands to run the malware, and **Persistence (T1547)** as they create registry entries to ensure the malware runs on system reboot. These activities underscore Mustang Panda's methodical approach in maintaining and establishing long-term access to compromised systems, ultimately serving the objectives of espionage and data theft.

  Primary data sources that can provide insights into this activity include process creation logs, which capture command line arguments and can reveal suspicious command execution patterns, and Windows registry logs, which would show modifications to autostart locations indicative of persistence mechanisms.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for process creation events that match the command line patterns associated with Mustang Panda, particularly focusing on `'copy SolidPDFCreator.dll'` and registry modification commands related to persistence.

  - **Analyze Registry Changes**: Investigate any modifications to the Windows registry, specifically looking for entries under `\Windows\CurrentVersion\Run` to identify any unauthorized persistence mechanisms introduced by the threat actor.

  - **Correlate with Network Activity**: Check network traffic logs for any unusual outbound connections that may coincide with the identified command line activities, noting any potential data exfiltration attempts.

  - **Investigate Suspicious File Locations**: Check the specified file locations in the alerts (e.g., `C:\Users\Public\Libraries\PhotoTvRHD\`) for the presence of `SolidPDFCreator.dll` and investigate other files that may be present in the same directory for potential indicators of compromise.

  ### Prioritization
  The alert is categorized as high priority due to the association with advanced persistent threat (APT) activity and the potential impact on government networks. Given that such targeted attacks carry a high likelihood of success in achieving their malicious objectives, swift investigation and response are critical.

  ### Blind Spots and Assumptions
  The detection logic assumes that logs for process creation and registry modification are adequately configured and retained. There may be gaps in coverage for other potential command variations or alternate persistence mechanisms that Mustang Panda could employ. Additionally, if logging configurations are insufficient or if similar benign applications generate command line patterns that match the detections, false positives could occur. Proper configurations are necessary for effective monitoring of process and registry activities related to this threat.

