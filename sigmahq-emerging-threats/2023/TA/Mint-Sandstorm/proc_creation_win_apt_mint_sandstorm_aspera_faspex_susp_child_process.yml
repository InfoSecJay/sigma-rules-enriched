title: Mint Sandstorm - AsperaFaspex Suspicious Process Execution
id: 91048c0d-5b81-4b85-a099-c9ee4fb87979
status: test
description: Detects suspicious execution from AsperaFaspex as seen used by Mint
  Sandstorm
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
date: 2023-04-20
modified: 2025-10-19
tags:
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains|all:
    - 'aspera'
    - '\ruby'
  selection_special_child_powershell_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
  selection_special_child_powershell_cli:
  - CommandLine|contains:
    - ' echo '
    - '-dumpmode'
    - '-ssh'
    - '.dmp'
    - 'add-MpPreference'
    - 'adscredentials'
    - 'bitsadmin'
    - 'certutil'
    - 'csvhost.exe'
    - 'DownloadFile'
    - 'DownloadString'
    - 'dsquery'
    - 'ekern.exe'
    - 'FromBase64String'
    - 'iex '
    - 'iex('
    - 'Invoke-Expression'
    - 'Invoke-WebRequest'
    - 'localgroup administrators'
    - 'o365accountconfiguration'
    - 'samaccountname='
    - 'set-MpPreference'
    - 'svhost.exe'
    - 'System.IO.Compression'
    - 'System.IO.MemoryStream'
    - 'usoprivate'
    - 'usoshared'
    - 'whoami'
  - CommandLine|re:
    - '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}'
    - 'net\s+user'
    - 'net\s+group'
    - 'query\s+session'
  selection_special_child_lsass_1:
    CommandLine|contains: 'lsass'
  selection_special_child_lsass_2:
    CommandLine|contains:
    - 'procdump'
    - 'tasklist'
    - 'findstr'
  selection_child_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains: 'http'
  selection_child_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: 'http'
  selection_child_script:
    CommandLine|contains:
    - 'E:jscript'
    - 'e:vbscript'
  selection_child_localgroup:
    CommandLine|contains|all:
    - 'localgroup Administrators'
    - '/add'
  selection_child_net:
    CommandLine|contains: 'net'     # Covers net1
    CommandLine|contains|all:
    - 'user'
    - '/add'
  selection_child_reg:
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableAntiSpyware'
    - '\Microsoft\Windows Defender'
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableRestrictedAdmin'
    - 'CurrentControlSet\Control\Lsa'
  selection_child_wmic_1:
    CommandLine|contains|all:
    - 'wmic'
    - 'process call create'
  selection_child_wmic_2:
    CommandLine|contains|all:
    - 'wmic'
    - 'delete'
    - 'shadowcopy'
  selection_child_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin'
    - 'delete'
    - 'shadows'
  selection_child_wbadmin:
    CommandLine|contains|all:
    - 'wbadmin'
    - 'delete'
    - 'catalog'
  condition: selection_parent and (all of selection_special_child_powershell_* 
    or all of selection_special_child_lsass_* or 1 of selection_child_*)
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This rule detects suspicious process execution patterns linked to AsperaFaspex, particularly when used in conjunction with PowerShell and various command-line utilities. The likely attacker objective is to leverage legitimate tools like AsperaFaspex to exfiltrate data or manipulate system configurations covertly. This activity correlates with the MITRE ATT&CK tactic of Execution (TA0002) and techniques such as Command and Scripting Interpreter (T1059) and Process Injection (T1055). The primary telemetry sources include process creation logs, specifically Windows Security Event ID 4688 and Sysmon Event ID 1, which detail process execution and command-line parameters. If the activity is malicious, it could indicate a breach with significant data theft or manipulation implications. Notably, this detection does NOT confirm that the activity is malicious on its own; it may also flag legitimate administrative actions.

  ### Investigation Steps

  - **Identify parent process: ** Review Event ID 4688 for the parent process containing "aspera" or "ruby." Legitimate cases may involve IT personnel using Aspera for data transfer, while suspicious executions may be tied to unauthorized administrative actions.

  - **Examine PowerShell execution: ** Look for child processes with images ending in "powershell.exe" or "powershell_ise.exe" and specific command-line arguments (e.g., "Invoke-WebRequest," "certutil"). URLs or commands indicating possible data retrieval or network connection should raise suspicion.

  - **Review command-line patterns: ** Check for command-line patterns indicating illicit activities, such as "vssadmin delete shadows" or "reg add" commands modifying Defender settings. These commands suggest an intention to disable security measures.

  - **Analyze LSASS interactions: ** Investigate any processes that interact with lsass.exe, especially those using commands like "procdump" or "tasklist," as these attempts may signal credential harvesting or other sensitive data access.

  - **Check for executable downloads: ** Look for the execution of wget.exe or curl.exe in combination with HTTP commands within the command-line arguments. Successful downloads executed at unusual hours may indicate an attempt to import malicious software.

  - **Understand legitimate Aspera usage: ** Validate typical AsperaFaspex operations—legitimate users may execute the application to transfer files, but unexpected parameters or high-frequency executions could indicate exploitation.

  ### Prioritization

  This alert should be treated as critical due to the high security impact of the affected systems, especially if sensitive data is targeted for exfiltration. The likelihood of exploitation is high given the historical usage patterns by nation-state actors, particularly Mint Sandstorm, to gain unauthorized access to enterprise systems.

  ### Blind Spots and Assumptions

  Detection may be limited by missing or misconfigured logging sources; ensure Windows process creation logs are enabled across endpoints for reliable coverage. Legitimate administrative tasks may trigger this alert, particularly in environments utilizing AsperaFaspex heavily, such as R&D or data recovery operations. A related detection to pair with this alert would be monitoring for anomalous remote access activity or abnormal file transfers, which would strengthen the overall detection framework for potential data breaches.

