title: Mint Sandstorm - AsperaFaspex Suspicious Process Execution
id: 91048c0d-5b81-4b85-a099-c9ee4fb87979
status: test
description: Detects suspicious execution from AsperaFaspex as seen used by Mint Sandstorm
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
date: 2023-04-20
modified: 2025-10-19
tags:
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains|all:
    - 'aspera'
    - '\ruby'
  selection_special_child_powershell_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
  selection_special_child_powershell_cli:
  - CommandLine|contains:
    - ' echo '
    - '-dumpmode'
    - '-ssh'
    - '.dmp'
    - 'add-MpPreference'
    - 'adscredentials'
    - 'bitsadmin'
    - 'certutil'
    - 'csvhost.exe'
    - 'DownloadFile'
    - 'DownloadString'
    - 'dsquery'
    - 'ekern.exe'
    - 'FromBase64String'
    - 'iex '
    - 'iex('
    - 'Invoke-Expression'
    - 'Invoke-WebRequest'
    - 'localgroup administrators'
    - 'o365accountconfiguration'
    - 'samaccountname='
    - 'set-MpPreference'
    - 'svhost.exe'
    - 'System.IO.Compression'
    - 'System.IO.MemoryStream'
    - 'usoprivate'
    - 'usoshared'
    - 'whoami'
  - CommandLine|re:
    - '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}'
    - 'net\s+user'
    - 'net\s+group'
    - 'query\s+session'
  selection_special_child_lsass_1:
    CommandLine|contains: 'lsass'
  selection_special_child_lsass_2:
    CommandLine|contains:
    - 'procdump'
    - 'tasklist'
    - 'findstr'
  selection_child_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains: 'http'
  selection_child_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: 'http'
  selection_child_script:
    CommandLine|contains:
    - 'E:jscript'
    - 'e:vbscript'
  selection_child_localgroup:
    CommandLine|contains|all:
    - 'localgroup Administrators'
    - '/add'
  selection_child_net:
    CommandLine|contains: 'net'     # Covers net1
    CommandLine|contains|all:
    - 'user'
    - '/add'
  selection_child_reg:
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableAntiSpyware'
    - '\Microsoft\Windows Defender'
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableRestrictedAdmin'
    - 'CurrentControlSet\Control\Lsa'
  selection_child_wmic_1:
    CommandLine|contains|all:
    - 'wmic'
    - 'process call create'
  selection_child_wmic_2:
    CommandLine|contains|all:
    - 'wmic'
    - 'delete'
    - 'shadowcopy'
  selection_child_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin'
    - 'delete'
    - 'shadows'
  selection_child_wbadmin:
    CommandLine|contains|all:
    - 'wbadmin'
    - 'delete'
    - 'catalog'
  condition: selection_parent and (all of selection_special_child_powershell_* or
    all of selection_special_child_lsass_* or 1 of selection_child_*)
falsepositives:
- Unlikely
level: critical
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious process creation initiated by AsperaFaspex, specifically looking for parent processes that contain certain indicators related to execution patterns commonly associated with the Mint Sandstorm adversary group. The primary behavior being detected entails the spawning of PowerShell or other common tools (e.g., WMIC, VSSAdmin) with specific command-line arguments or targets, which could indicate attempts to execute potentially malicious commands, disable security features, or exfiltrate data.

  The likely attacker objective is to facilitate post-exploitation actions such as credential harvesting, lateral movement, or data exfiltration, aligning with the MITRE ATT&CK tactics of Execution (TA0002) and Credential Access (TA0006). Primary telemetry sources include Windows process creation logs, specifically Event ID 4688 and Sysmon Event ID 1, which document details about processes being created on the endpoint. If malicious, the detected behavior could lead to severe impacts including unauthorized access to sensitive data, compromise of additional accounts, or establishment of persistent access within the network.

  It is important to note that this detection does NOT definitively confirm malicious activity on its own, as legitimate administrative tasks may also invoke similar command patterns. Analysts should thoroughly investigate context and correlation with other telemetry.

  ---

  ### Investigation Steps

  - **Review parent process details:** Examine the parent process for the detected suspicious activity (Security Event ID 4688 / Sysmon Event ID 1). Identify if it originates from AsperaFaspex or any other legitimate application to determine context.

  - **Analyze command-line arguments:** Look for command-line arguments associated with the process (Event ID 4688, `ProcessCommandLine` field) that match suspicious patterns like `Invoke-Expression`, `net user`, or `reg add`. A high-confidence malicious indicator would be the presence of commands attempting to manage user accounts or disable security features.

  - **Evaluate execution of PowerShell:** Check for child processes spawned that match PowerShell executable paths (e.g., `\powershell.exe`, `\powershell_ise.exe`) with any of the associated suspicious arguments. Legitimate PowerShell activity often involves script execution without anomalous flags.

  - **Cross-reference additional telemetry:** Look at related Sysmon logs for network connections or file accesses (Sysmon Event IDs 3 and 23) initiated by the child processes for potential data exfiltration activity.

  - **Assess the system's role and environment:** Understand the context of the host machine (e.g., server, workstation) and its criticality within the enterprise to gauge the impact of potential malicious actions.

  - **Validate usage of legitimate tools:** Confirm whether the detected tools (e.g., `wget`, `curl`, `wmic`) are being used in a normal operational context by legitimate users or automated processes evident in your environment.

  ---

  ### Prioritization

  This alert is of critical severity due to the possibility of a high-value target being attacked using sophisticated techniques leveraged by a nation-state actor. The likelihood of malicious abuse is elevated given the established tactics of Mint Sandstorm, marking this behavior as a potentially clear indicator of an ongoing targeted attack.

  ---

  ### Blind Spots and Assumptions

  Detection may miss sophisticated evasion techniques such as process hollowing or reflective DLL injection, which could mask malicious activity. Ensuring comprehensive logging practices, including enabling relevant security auditing and ensuring all PowerShell activities are logged, is crucial for reliable detection. Legitimate administrative scripts that interact with user accounts or modify system settings may inadvertently trigger the alert. Companion detections such as monitoring for unusual network activity (e.g., connections to known malicious IPs or domains) can provide additional coverage and context to the investigation.

