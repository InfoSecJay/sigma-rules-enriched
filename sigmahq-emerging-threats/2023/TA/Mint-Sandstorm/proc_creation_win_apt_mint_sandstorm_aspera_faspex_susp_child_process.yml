title: Mint Sandstorm - AsperaFaspex Suspicious Process Execution
id: 91048c0d-5b81-4b85-a099-c9ee4fb87979
status: test
description: Detects suspicious execution from AsperaFaspex as seen used by Mint Sandstorm
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
date: 2023-04-20
modified: 2025-10-19
tags:
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|contains|all:
    - 'aspera'
    - '\ruby'
  selection_special_child_powershell_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
  selection_special_child_powershell_cli:
  - CommandLine|contains:
    - ' echo '
    - '-dumpmode'
    - '-ssh'
    - '.dmp'
    - 'add-MpPreference'
    - 'adscredentials'
    - 'bitsadmin'
    - 'certutil'
    - 'csvhost.exe'
    - 'DownloadFile'
    - 'DownloadString'
    - 'dsquery'
    - 'ekern.exe'
    - 'FromBase64String'
    - 'iex '
    - 'iex('
    - 'Invoke-Expression'
    - 'Invoke-WebRequest'
    - 'localgroup administrators'
    - 'o365accountconfiguration'
    - 'samaccountname='
    - 'set-MpPreference'
    - 'svhost.exe'
    - 'System.IO.Compression'
    - 'System.IO.MemoryStream'
    - 'usoprivate'
    - 'usoshared'
    - 'whoami'
  - CommandLine|re:
    - '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}'
    - 'net\s+user'
    - 'net\s+group'
    - 'query\s+session'
  selection_special_child_lsass_1:
    CommandLine|contains: 'lsass'
  selection_special_child_lsass_2:
    CommandLine|contains:
    - 'procdump'
    - 'tasklist'
    - 'findstr'
  selection_child_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains: 'http'
  selection_child_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: 'http'
  selection_child_script:
    CommandLine|contains:
    - 'E:jscript'
    - 'e:vbscript'
  selection_child_localgroup:
    CommandLine|contains|all:
    - 'localgroup Administrators'
    - '/add'
  selection_child_net:
    CommandLine|contains: 'net'     # Covers net1
    CommandLine|contains|all:
    - 'user'
    - '/add'
  selection_child_reg:
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableAntiSpyware'
    - '\Microsoft\Windows Defender'
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableRestrictedAdmin'
    - 'CurrentControlSet\Control\Lsa'
  selection_child_wmic_1:
    CommandLine|contains|all:
    - 'wmic'
    - 'process call create'
  selection_child_wmic_2:
    CommandLine|contains|all:
    - 'wmic'
    - 'delete'
    - 'shadowcopy'
  selection_child_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin'
    - 'delete'
    - 'shadows'
  selection_child_wbadmin:
    CommandLine|contains|all:
    - 'wbadmin'
    - 'delete'
    - 'catalog'
  condition: selection_parent and (all of selection_special_child_powershell_* or
    all of selection_special_child_lsass_* or 1 of selection_child_*)
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies suspicious execution behaviors associated with AsperaFaspex, particularly those indicative of Mint Sandstorm, a known nation-state threat actor. The rule specifically looks for processes spawned by Aspera, a file transfer application, that invoke PowerShell and other utilities commonly used for malicious activities, such as data exfiltration, privilege escalation, and reconnaissance. Attackers using tools from this family often aim to access sensitive data or disrupt services within enterprise environments.

  The relevant MITRE ATT&CK tactics include Execution (TA0002) as attackers may execute commands within a compromised environment to achieve their objectives. Notable techniques observed include PowerShell (T1059.001), Command-Line Interface (T1059.003), and Windows Management Instrumentation (T1047), which the attackers leverage to manipulate processes and access resources stealthily. Primary data sources for this detection include process creation logs from Windows, which will provide the necessary evidence regarding executed commands and their parent-child relationships.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine Windows process creation events to identify instances where AsperaFaspex has spawned PowerShell or other suspicious child processes. Focus on the parent-child relationship to understand the sequence of execution.

  - **Analyze Command-Line Arguments**: Investigate the command-line arguments of the identified processes for patterns indicating misuse, such as references to tools like "wget" or "curl", or commands typically associated with privilege escalation or data exfiltration (e.g., `-ssh`, `add-MpPreference`).

  - **Collect Additional Context**: Gather logs from endpoints and security tools. Look for any unauthorized access attempts or changes in user privileges, particularly involving administrative groups, that coincide with the created processes.

  - **Correlate with Threat Intelligence**: Utilize threat intelligence sources to see if these activities align with known indicators of compromise (IOCs) related to Mint Sandstorm. This can aid in determining the potential impact and urgency of the incident.

  ### Prioritization
  This alert is deemed critical due to the high impact and likelihood of Mint Sandstorm's operations, which could lead to potential data breaches or significant operational disruptions in an enterprise environment. Given the sophistication of the threat actor, timely investigation and mitigation are essential.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the processes have been obfuscated or if the attacker utilizes less common utilities for execution that are not captured by this rule. The detection logic assumes that log collection is properly configured across all endpoints and that the relevant process execution telemetry is being logged reliably. Additionally, there may be false negatives if legitimate business processes trigger the same command patterns observed by attackers.

