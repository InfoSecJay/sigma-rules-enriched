detection:
  selection:
    ParentImage|endswith: '\ws_tomcatservice.exe'
  filter_main_repadmin:
    Image|endswith: '\repadmin.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of processes associated with the Log4J vulnerability exploitation, specifically targeting the Windows Service for Apache Tomcat (`ws_tomcatservice.exe`). It is designed to detect malicious activities attributed to the Mint Sandstorm threat group, known for using sophisticated steganography and sophisticated tradecraft in their attacks. The likely attacker objectives include gaining initial access to high-value targets, executing payloads to facilitate command and control, and exfiltrating sensitive data.

  The detection aligns with several MITRE ATT&CK tactics and techniques, particularly:
  - **Execution (TA0002)** - exploiting the Log4J vulnerability via remote execution.
  - **Command and Control (TA0011)** - establishing persistence through remote services like Tomcat.
  - **Initial Access (TA0001)** - leveraging vulnerabilities to penetrate defenses.

  The primary data sources for this detection include process creation events on Windows systems, focusing on the behavior of the specified parent process and any related executable files.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for any instances of `ws_tomcatservice.exe` as a parent process. Verify time stamps and associated user accounts to assess the context of the activity.

  - **Analyze Command Line Parameters:** Evaluate the command line arguments used with the executed process to identify any suspicious flags or inputs that suggest exploitation of the Log4J vulnerability.

  - **Correlate with Known Bad Indicators:** Cross-reference observed behaviors with threat intelligence on Mint Sandstorm and related indicators of compromise (IOCs) to determine any affiliations with known threat activity.

  - **Inspect for Anomalous Network Connections:** Check for unusual outbound connections from the affected machine, particularly concerning established ports associated with web services (e.g., HTTP/HTTPS), to identify potential command and control traffic.

  ### Prioritization
  The detected behavior is considered high severity due to the potential impact of successful exploitation, which can lead to broader network compromise, data exfiltration, and sustained access by the threat actor.

  ### Blind Spots and Assumptions
  This detection rule may miss instances of exploitation where the Log4J vulnerability is leveraged without the specified parent process or in environments where Tomcat is not used. It assumes that the logs for process creation events are available and configured correctly to capture sufficient detail. Additionally, if replication processes like `repadmin.exe` are legitimately executed in a good context, there may be false negatives. Effective monitoring of related processes and infrastructures is essential for comprehensive detection.

