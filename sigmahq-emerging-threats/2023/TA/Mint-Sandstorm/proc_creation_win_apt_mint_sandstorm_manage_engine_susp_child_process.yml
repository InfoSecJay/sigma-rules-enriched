title: Mint Sandstorm - ManageEngine Suspicious Process Execution
id: 58d8341a-5849-44cd-8ac8-8b020413a31b
status: test
description: Detects suspicious execution from ManageEngine as seen used by Mint Sandstorm
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
date: 2023-04-20
modified: 2025-10-19
tags:
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_path:
    ParentImage|contains:
    - 'manageengine'
    - 'ServiceDesk'
  selection_parent_image:
    ParentImage|contains: '\java'
  selection_special_child_powershell_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
  selection_special_child_powershell_cli:
  - CommandLine|contains:
    - ' echo '
    - '-dumpmode'
    - '-ssh'
    - '.dmp'
    - 'add-MpPreference'
    - 'adscredentials'
    - 'bitsadmin'
    - 'certutil'
    - 'csvhost.exe'
    - 'DownloadFile'
    - 'DownloadString'
    - 'dsquery'
    - 'ekern.exe'
    - 'FromBase64String'
    - 'iex '
    - 'iex('
    - 'Invoke-Expression'
    - 'Invoke-WebRequest'
    - 'localgroup administrators'
    - 'o365accountconfiguration'
    - 'samaccountname='
    - 'set-MpPreference'
    - 'svhost.exe'
    - 'System.IO.Compression'
    - 'System.IO.MemoryStream'
    - 'usoprivate'
    - 'usoshared'
    - 'whoami'
  - CommandLine|re: '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}'
  - CommandLine|re: 'net\s+user'
  - CommandLine|re: 'net\s+group'
  - CommandLine|re: 'query\ssession'
  selection_special_child_lsass_1:
    CommandLine|contains: 'lsass'
  selection_special_child_lsass_2:
    CommandLine|contains:
    - 'procdump'
    - 'tasklist'
    - 'findstr'
  selection_child_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains: 'http'
  selection_child_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: 'http'
  selection_child_script:
    CommandLine|contains:
    - 'E:jscript'
    - 'e:vbscript'
  selection_child_localgroup:
    CommandLine|contains|all:
    - 'localgroup Administrators'
    - '/add'
  selection_child_net:
    CommandLine|contains: 'net'     # Covers net1
    CommandLine|contains|all:
    - 'user'
    - '/add'
  selection_child_reg:
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableAntiSpyware'
    - '\Microsoft\Windows Defender'
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableRestrictedAdmin'
    - 'CurrentControlSet\Control\Lsa'
  selection_child_wmic_1:
    CommandLine|contains|all:
    - 'wmic'
    - 'process call create'
  selection_child_wmic_2:
    CommandLine|contains|all:
    - 'wmic'
    - 'delete'
    - 'shadowcopy'
  selection_child_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin'
    - 'delete'
    - 'shadows'
  selection_child_wbadmin:
    CommandLine|contains|all:
    - 'wbadmin'
    - 'delete'
    - 'catalog'
  filter_main:
    CommandLine|contains|all:
    - 'download.microsoft.com'
    - 'manageengine.com'
    - 'msiexec'
  condition: all of selection_parent_* and (all of selection_special_child_powershell_*
    or all of selection_special_child_lsass_* or 1 of selection_child_*) and not filter_main
falsepositives:
- Unlikely
level: critical
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious process execution related to ManageEngine software, specifically focusing on instances where PowerShell scripts or other executable commands are spawned from its processes. The likely attacker objective is to leverage ManageEngine's trusted capabilities to perform unauthorized actions or exfiltrate sensitive data, commonly associated with the Mint Sandstorm threat actor. The relevant MITRE ATT&CK techniques include Execution (T1203) and Credential Access (T1003). Primary telemetry sources include Windows Process Creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity can lead to severe data breaches and lateral movement within the network. This detection alone does NOT confirm that malicious activity is occurring; further investigation is necessary to assess intent and outcome.

  ---

  ### Investigation Steps

  - **Review Process Creation Events**: Check for Security Event ID 4688 or Sysmon Event ID 1 associated with ManageEngine. Note the ParentImage path contains "manageengine" or "ServiceDesk" and analyze the spawned child processes for indicators of suspicious behavior.

  - **Inspect PowerShell Commands**: Identify any command lines executed that contain common malicious patterns such as `Invoke-WebRequest`, `certutil`, and `base64` decoding operations. Confirm whether legitimate management scripts are in use, which may be benign.

  - **Validate Child Processes**: Look for the execution of `lsass`, `wget.exe`, or `curl.exe` as child processes. If the CommandLine includes actions such as `localgroup Administrators /add`, it indicates a potential privilege escalation attempt.

  - **Analyze Registry Modifications**: Check for commands related to Windows registry manipulations, particularly involving `DisableAntiSpyware` or `DisableRestrictedAdmin`, which are associated with attempts to disable security measures. This can be confirmed through PowerShell logs showing registry keys modifications.

  - **Determine Network Activity**: Look for network connections or requests originating from these suspicious processes to `manageengine.com` or `download.microsoft.com`. Assess if any data exfiltration attempts are indicated through unusual traffic patterns.

  - **Identify Fuels Legitimate Operations**: Document typical ManageEngine operations or scripts that may use PowerShell or process creation. Compare these against suspicious findings to determine potential false positives and establish context for investigations.

  ---

  ### Prioritization

  The alert severity is critical due to its association with ManageEngine processes, which are prevalent in many enterprises. The likelihood of abuse is high given the specific methods used by adversaries like Mint Sandstorm, who often exploit trusted software. This behavior also aligns with known tactics used in targeted attacks, making it significant in the context of enterprise security.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logs capturing all PowerShell activity or in environments where ManageEngine executes frequently. Legitimate administrative processes could inadvertently trigger the alert, thus requiring thorough analysis to avoid misclassification. A related detection that strengthens coverage includes monitoring for unusual scheduled tasks or service manipulations indicative of further compromise.

