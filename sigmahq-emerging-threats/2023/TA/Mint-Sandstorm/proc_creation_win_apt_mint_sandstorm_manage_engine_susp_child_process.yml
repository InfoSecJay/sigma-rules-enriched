title: Mint Sandstorm - ManageEngine Suspicious Process Execution
id: 58d8341a-5849-44cd-8ac8-8b020413a31b
status: test
description: Detects suspicious execution from ManageEngine as seen used by Mint Sandstorm
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
date: 2023-04-20
modified: 2025-10-19
tags:
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_path:
    ParentImage|contains:
    - 'manageengine'
    - 'ServiceDesk'
  selection_parent_image:
    ParentImage|contains: '\java'
  selection_special_child_powershell_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
  selection_special_child_powershell_cli:
  - CommandLine|contains:
    - ' echo '
    - '-dumpmode'
    - '-ssh'
    - '.dmp'
    - 'add-MpPreference'
    - 'adscredentials'
    - 'bitsadmin'
    - 'certutil'
    - 'csvhost.exe'
    - 'DownloadFile'
    - 'DownloadString'
    - 'dsquery'
    - 'ekern.exe'
    - 'FromBase64String'
    - 'iex '
    - 'iex('
    - 'Invoke-Expression'
    - 'Invoke-WebRequest'
    - 'localgroup administrators'
    - 'o365accountconfiguration'
    - 'samaccountname='
    - 'set-MpPreference'
    - 'svhost.exe'
    - 'System.IO.Compression'
    - 'System.IO.MemoryStream'
    - 'usoprivate'
    - 'usoshared'
    - 'whoami'
  - CommandLine|re: '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}'
  - CommandLine|re: 'net\s+user'
  - CommandLine|re: 'net\s+group'
  - CommandLine|re: 'query\ssession'
  selection_special_child_lsass_1:
    CommandLine|contains: 'lsass'
  selection_special_child_lsass_2:
    CommandLine|contains:
    - 'procdump'
    - 'tasklist'
    - 'findstr'
  selection_child_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains: 'http'
  selection_child_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: 'http'
  selection_child_script:
    CommandLine|contains:
    - 'E:jscript'
    - 'e:vbscript'
  selection_child_localgroup:
    CommandLine|contains|all:
    - 'localgroup Administrators'
    - '/add'
  selection_child_net:
    CommandLine|contains: 'net'     # Covers net1
    CommandLine|contains|all:
    - 'user'
    - '/add'
  selection_child_reg:
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableAntiSpyware'
    - '\Microsoft\Windows Defender'
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableRestrictedAdmin'
    - 'CurrentControlSet\Control\Lsa'
  selection_child_wmic_1:
    CommandLine|contains|all:
    - 'wmic'
    - 'process call create'
  selection_child_wmic_2:
    CommandLine|contains|all:
    - 'wmic'
    - 'delete'
    - 'shadowcopy'
  selection_child_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin'
    - 'delete'
    - 'shadows'
  selection_child_wbadmin:
    CommandLine|contains|all:
    - 'wbadmin'
    - 'delete'
    - 'catalog'
  filter_main:
    CommandLine|contains|all:
    - 'download.microsoft.com'
    - 'manageengine.com'
    - 'msiexec'
  condition: all of selection_parent_* and (all of selection_special_child_powershell_*
    or all of selection_special_child_lsass_* or 1 of selection_child_*) and not filter_main
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies suspicious process execution associated with ManageEngine, a legitimate IT management software that has recently been exploited by the Mint Sandstorm threat actor group. The rule is designed to flag potentially malicious behaviors that may involve abuse of ManageEngine components, especially invoking PowerShell commands or utilizing tools to manipulate system processes, which are indicative of compromise. An attacker leveraging Mint Sandstorm tactics aims to gain unauthorized access, perform lateral movement, elevate privileges, and extract sensitive data from targeted high-value environments.

  Relevant MITRE ATT&CK tactics/techniques associated with this rule include **Execution (TA0002)**, particularly techniques such as **Command and Scripting Interpreter (T1059)** and **Process Injection (T1055)**. These techniques enable attackers to execute arbitrary commands and inject processes, which may allow continued access and operational capabilities within compromised systems.

  The primary data sources for this detection include **process creation events** from Windows systems, which provide detailed records of executables being launched, including their parent-child relationships and command-line arguments. Additional data to corroborate findings may come from security information and event management (SIEM) solutions aggregating logs from endpoint detection and response (EDR) mechanisms and any relevant network detection solutions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for any instances of ManageEngine-related processes that were executed. Pay particular attention to command-line arguments that may be associated with known malicious behaviors as defined in the detection logic.

  - **Examine Powershell Execution**: Look for instances of PowerShell execution spawned from ManageEngine processes. Specifically, identify any command-line patterns that match the listed suspicious commands, especially those relating to download activities or system process manipulation.

  - **Correlate with EDR Artifacts**: Utilize EDR tools to identify suspicious behaviors, such as attempts to access or dump LSASS or commands that modify local groups or service settings. Cross-reference these with the suspected ManageEngine process executions.

  - **Investigate Network Calls**: Check network activity logs to see if the suspicious processes generated outbound connections to known malicious IP addresses, especially domains such as manageengine.com and download.microsoft.com which have been flagged in the context of this detection.

  ### Prioritization
  The severity of this alert is marked as critical due to the potential impact Mint Sandstorm exploits can have on high-value targets. The likelihood of encountering such attacks in enterprise environments dealing with sensitive or proprietary data justifies urgent investigation and response efforts.

  ### Blind Spots and Assumptions
  One gap in detection coverage may include non-Windows platforms, as the detection is focused on process creation events specifically from Windows systems. Additionally, this rule assumes that ManageEngine will typically execute as expected, meaning deviations from default configurations may not trigger the detection. It relies on comprehensive logging of process creations and command-line arguments, which must be enabled and adequately captured within the enterprise environment to ensure the effectiveness of the rule. Any absence of log normalization may hinder the detection of these threats effectively.

