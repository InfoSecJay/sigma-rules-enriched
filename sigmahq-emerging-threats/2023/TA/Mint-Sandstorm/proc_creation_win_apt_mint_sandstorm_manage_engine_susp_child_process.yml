title: Mint Sandstorm - ManageEngine Suspicious Process Execution
id: 58d8341a-5849-44cd-8ac8-8b020413a31b
status: test
description: Detects suspicious execution from ManageEngine as seen used by Mint
  Sandstorm
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
date: 2023-04-20
modified: 2025-10-19
tags:
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_path:
    ParentImage|contains:
    - 'manageengine'
    - 'ServiceDesk'
  selection_parent_image:
    ParentImage|contains: '\java'
  selection_special_child_powershell_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
  selection_special_child_powershell_cli:
  - CommandLine|contains:
    - ' echo '
    - '-dumpmode'
    - '-ssh'
    - '.dmp'
    - 'add-MpPreference'
    - 'adscredentials'
    - 'bitsadmin'
    - 'certutil'
    - 'csvhost.exe'
    - 'DownloadFile'
    - 'DownloadString'
    - 'dsquery'
    - 'ekern.exe'
    - 'FromBase64String'
    - 'iex '
    - 'iex('
    - 'Invoke-Expression'
    - 'Invoke-WebRequest'
    - 'localgroup administrators'
    - 'o365accountconfiguration'
    - 'samaccountname='
    - 'set-MpPreference'
    - 'svhost.exe'
    - 'System.IO.Compression'
    - 'System.IO.MemoryStream'
    - 'usoprivate'
    - 'usoshared'
    - 'whoami'
  - CommandLine|re: '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}'
  - CommandLine|re: 'net\s+user'
  - CommandLine|re: 'net\s+group'
  - CommandLine|re: 'query\ssession'
  selection_special_child_lsass_1:
    CommandLine|contains: 'lsass'
  selection_special_child_lsass_2:
    CommandLine|contains:
    - 'procdump'
    - 'tasklist'
    - 'findstr'
  selection_child_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains: 'http'
  selection_child_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: 'http'
  selection_child_script:
    CommandLine|contains:
    - 'E:jscript'
    - 'e:vbscript'
  selection_child_localgroup:
    CommandLine|contains|all:
    - 'localgroup Administrators'
    - '/add'
  selection_child_net:
    CommandLine|contains: 'net'     # Covers net1
    CommandLine|contains|all:
    - 'user'
    - '/add'
  selection_child_reg:
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableAntiSpyware'
    - '\Microsoft\Windows Defender'
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableRestrictedAdmin'
    - 'CurrentControlSet\Control\Lsa'
  selection_child_wmic_1:
    CommandLine|contains|all:
    - 'wmic'
    - 'process call create'
  selection_child_wmic_2:
    CommandLine|contains|all:
    - 'wmic'
    - 'delete'
    - 'shadowcopy'
  selection_child_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin'
    - 'delete'
    - 'shadows'
  selection_child_wbadmin:
    CommandLine|contains|all:
    - 'wbadmin'
    - 'delete'
    - 'catalog'
  filter_main:
    CommandLine|contains|all:
    - 'download.microsoft.com'
    - 'manageengine.com'
    - 'msiexec'
  condition: all of selection_parent_* and (all of 
    selection_special_child_powershell_* or all of 
    selection_special_child_lsass_* or 1 of selection_child_*) and not 
    filter_main
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects suspicious process executions originating from the ManageEngine platform, particularly when accompanied by specific PowerShell commands or actions indicative of a malicious intent. The likely attacker objective includes executing arbitrary commands or exfiltrating sensitive data from endpoints, particularly focusing on exploiting ManageEngine vulnerabilities or misconfigurations. This detection relates to the MITRE ATT&CK technique for Remote File Copy (T1105) under the Execution tactic.

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688, and potentially Sysmon Event ID 1 for more detailed command line visibility. If malicious, this behavior may allow adversaries to manipulate user privileges, install unauthorized software, or exfiltrate data. Importantly, this detection does NOT confirm that a successful breach or exfiltration has occurred; it only indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Review process creation logs**: Check Security Event ID 4688 for the execution of `java.exe` as a parent process, which indicates ManageEngine activity. Look for child processes that include PowerShell-related commands.

  - **Analyze command line arguments**: Specifically, look for command lines containing keywords like `Invoke-WebRequest`, `wget.exe`, or suspicious strings like `-dumpmode`. Such indicators may show attempts to exfiltrate data or manipulate system configurations.

  - **Validate legitimate application use**: If the ManageEngine application is in use, confirm its normal operation with expected command line arguments. Typical execution paths and parameters should not include suspicious payloads or commands described in the detection logic.

  - **Identify high-confidence malicious indicators**: Look for child processes spawned by PowerShell that execute commands such as `wmic process call create` or attempt to manipulate system processes using command lines including `lsass` or `vssadmin`.

  - **Check for abnormal network connections**: Review network logs (e.g., firewall or proxy logs) for connections to known malicious sites or unusual domains related to `manageengine.com` or `download.microsoft.com` during the same timeframe as the alert.

  ### Prioritization

  This alert is classified as critical due to the potential impact on sensitive user data and administrative privileges. The likelihood of malicious abuse is high, particularly given recent tactics employed by threat actors like Mint Sandstorm targeting ManageEngine users. This behavior is also aligned with known attack methodologies that exploit trusted software as an entry point.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques where attackers may manipulate process names or use legitimate command-line arguments that appear benign. Reliable detection requires complete and properly configured logging for Windows processes and PowerShell execution. Legitimate IT operations such as software updates or administrative tasks may inadvertently trigger this alert. A related detection rule focusing on known vulnerabilities within ManageEngine could strengthen overall coverage and response capabilities.

