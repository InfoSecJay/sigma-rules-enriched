title: Mint Sandstorm - ManageEngine Suspicious Process Execution
id: 58d8341a-5849-44cd-8ac8-8b020413a31b
status: test
description: Detects suspicious execution from ManageEngine as seen used by Mint Sandstorm
references:
- https://www.microsoft.com/en-us/security/blog/2023/04/18/nation-state-threat-actor-mint-sandstorm-refines-tradecraft-to-attack-high-value-targets/
author: Nasreddine Bencherchali (Nextron Systems), MSTIC (idea)
date: 2023-04-20
modified: 2023-04-25
tags:
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_path:
    ParentImage|contains:
    - 'manageengine'
    - 'ServiceDesk'
  selection_parent_image:
    ParentImage|contains: '\java'
  selection_special_child_powershell_img:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
  selection_special_child_powershell_cli:
  - CommandLine|contains:
    - ' echo '
    - '-dumpmode'
    - '-ssh'
    - '.dmp'
    - 'add-MpPreference'
    - 'adscredentials'
    - 'bitsadmin'
    - 'certutil'
    - 'csvhost.exe'
    - 'DownloadFile'
    - 'DownloadString'
    - 'dsquery'
    - 'ekern.exe'
    - 'FromBase64String'
    - 'iex '
    - 'iex('
    - 'Invoke-Expression'
    - 'Invoke-WebRequest'
    - 'localgroup administrators'
    - 'net group'
    - 'net user'
    - 'o365accountconfiguration'
    - 'query session'
    - 'samaccountname='
    - 'set-MpPreference'
    - 'svhost.exe'
    - 'System.IO.Compression'
    - 'System.IO.MemoryStream'
    - 'usoprivate'
    - 'usoshared'
    - 'whoami'
  - CommandLine|re: '[-/–][Ee^]{1,2}[ncodema^]*\s[A-Za-z0-9+/=]{15,}'
  selection_special_child_lsass_1:
    CommandLine|contains: 'lsass'
  selection_special_child_lsass_2:
    CommandLine|contains:
    - 'procdump'
    - 'tasklist'
    - 'findstr'
  selection_child_wget:
    Image|endswith: '\wget.exe'
    CommandLine|contains: 'http'
  selection_child_curl:
    Image|endswith: '\curl.exe'
    CommandLine|contains: 'http'
  selection_child_script:
    CommandLine|contains:
    - 'E:jscript'
    - 'e:vbscript'
  selection_child_localgroup:
    CommandLine|contains|all:
    - 'localgroup Administrators'
    - '/add'
  selection_child_net:
    CommandLine|contains: 'net'     # Covers net1
    CommandLine|contains|all:
    - 'user'
    - '/add'
  selection_child_reg:
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableAntiSpyware'
    - '\Microsoft\Windows Defender'
  - CommandLine|contains|all:
    - 'reg add'
    - 'DisableRestrictedAdmin'
    - 'CurrentControlSet\Control\Lsa'
  selection_child_wmic_1:
    CommandLine|contains|all:
    - 'wmic'
    - 'process call create'
  selection_child_wmic_2:
    CommandLine|contains|all:
    - 'wmic'
    - 'delete'
    - 'shadowcopy'
  selection_child_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin'
    - 'delete'
    - 'shadows'
  selection_child_wbadmin:
    CommandLine|contains|all:
    - 'wbadmin'
    - 'delete'
    - 'catalog'
  filter_main:
    CommandLine|contains|all:
    - 'download.microsoft.com'
    - 'manageengine.com'
    - 'msiexec'
  condition: all of selection_parent_* and (all of selection_special_child_powershell_*
    or all of selection_special_child_lsass_* or 1 of selection_child_*) and not filter_main
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  The "Mint Sandstorm - ManageEngine Suspicious Process Execution" detection rule aims to identify potentially malicious behaviors associated with the execution of processes tied to ManageEngine software. This detection is informed by recent tactics observed in the Mint Sandstorm threat actor's operations, which typically target high-value organizations to carry out espionage. Likely attacker objectives include credential harvesting, lateral movement, and data exfiltration through the exploitation of legitimate tools, such as PowerShell and ManageEngine, that may facilitate their malicious operations.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (T1203): Malware execution through legitimate applications, such as ManageEngine.
  - **Credential Access** (T1003): Techniques such as credential dumping that may be facilitated by the methods detected in this rule.
  - **Privilege Escalation** (T1068): Utilizing ManageEngine processes to escalate privileges within the network.

  The primary data sources for this rule are Windows process creation events, particularly focusing on CommandLine arguments that indicate illegitimate or suspicious utilization of ManageEngine software and associated PowerShell commands.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events to identify any occurrences of ManageEngine or related binaries initiating suspicious child processes, particularly those invoking PowerShell or executing commands commonly associated with malicious activity.
  - **Examine CommandLine Arguments**: Look for specific CommandLine patterns that could indicate misuse, such as those containing suspicious keywords like 'DownloadFile', 'Invoke-Expression', or references to credential manipulation commands.
  - **Check Parent-Child Process Relationships**: Investigate the lineage of processes to establish if suspicious child processes were spawned by ManageEngine components, which may indicate malicious intent.
  - **Monitor Network Traffic**: Inspect outbound connections for any unusual data exchanges linked to ManageEngine activities, especially requests to known malicious domains or unverified third-party servers.

  ### Prioritization
  The severity of this alert is critical, as it indicates potential exploitation of ManageEngine by a sophisticated threat actor known for targeting enterprise environments. The likelihood of significant negative impact, including data breaches and system compromises, warrants immediate investigation and response.

  ### Blind Spots and Assumptions
  This detection rule may not account for all operational uses of ManageEngine, which could lead to false negatives in cases of benign use. Furthermore, it assumes that all relevant process creation logs are being collected and monitored effectively. Organizations must have adequate logging configurations in place, specifically for process creation events and PowerShell execution, to ensure comprehensive detection capabilities are realized.

