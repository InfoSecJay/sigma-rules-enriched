logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'cleanLL'
    - 'usersfiles.war'
    - 'Remove-Item -Path "$tomcat_dir'
    - 'SysAidServer'
    - 'sleep '
    - 'while(1)'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a PowerShell script associated with the Lace Tempest APT group, specifically targeting the execution of commands designed to delete evidence from compromised systems. The primary goal of this behavior is to obfuscate malicious activities by removing logs and files that could be useful for forensic analysis. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and specifically the technique of Command and Scripting Interpreter: PowerShell (T1059.001).

  The primary telemetry sources for this detection include Windows PowerShell script block logs, which require Script Block Logging to be enabled (Event ID 4104). If confirmed malicious, this behavior can severely impact incident response efforts due to the loss of crucial forensic evidence. Importantly, this detection does NOT confirm that a compromise has occurred; further investigation is required to establish the context of the PowerShell execution.

  ### Investigation Steps

  - **Check PowerShell script block logs:** Look for Event ID 4104 corresponding to the detected script execution. Validate that the script contains the keywords 'cleanLL' and 'Remove-Item -Path "$tomcat_dir', indicating potential malicious intent.

  - **Review process creation logs:** Examine Security Event ID 4688 for the creation of PowerShell processes around the time of the alert. Look for suspicious command-line arguments that include the identified script block text.

  - **Assess host activity:** Confirm host activity and role—ensure the host is expected to run PowerShell scripts. Legitimate PowerShell usage might involve typical IT administration tasks, devoid of unusual patterns like perpetual loops ('while(1)') or file deletions related to System or user files.

  - **Correlate with external threat intelligence:** Investigate whether the host or related nodes have reported any compromise indications linked to the Lace Tempest APT framework in external threat intelligence feeds.

  - **Identify evidence of deletion actions:** Look for artifacts left by the execution, such as Event ID 4616 (System time changed) or missing log files, indicating evidence deletion aligned with the identified script’s objectives.

  ### Prioritization

  This alert is deemed high severity due to its association with a known APT group, the potential for significant data loss, and the likelihood of malicious abuse in the context of evidence obliteration. The techniques employed in the script are common among adversaries seeking to disrupt forensic investigations, heightening the need for swift response.

  ### Blind Spots and Assumptions

  Detection may miss instances where logging is insufficient, such as when Script Block Logging is not enabled. Specific legitimate activity like routine maintenance scripts could trigger this detection, particularly if they include similar file operations. A companion detection to consider would be monitoring for unusual file deletion activity in combination with Windows Event ID 4660 (File Deleted) for enhanced evidence tracking.

