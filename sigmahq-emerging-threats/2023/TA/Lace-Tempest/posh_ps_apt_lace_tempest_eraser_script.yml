title: Lace Tempest PowerShell Evidence Eraser
id: b377ddab-502d-4519-9e8c-5590033d2d70
status: test
description: |
  Detects a PowerShell script used by Lace Tempest APT to erase evidence from victim servers by exploiting CVE-2023-47246 as reported by SysAid Team
references:
- https://www.sysaid.com/blog/service-desk/on-premise-software-security-vulnerability-notification
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-11-09
tags:
- attack.execution
- attack.t1059.001
- detection.emerging-threats
logsource:
  product: windows
  category: ps_script
  definition: 'Requirements: Script Block Logging must be enabled'
detection:
  selection:
    ScriptBlockText|contains|all:
    - 'cleanLL'
    - 'usersfiles.war'
    - 'Remove-Item -Path "$tomcat_dir'
    - 'SysAidServer'
    - 'sleep '
    - 'while(1)'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of a PowerShell script associated with the Lace Tempest APT group, which is known for leveraging PowerShell to erase evidence on compromised servers. Specifically, the script exploits CVE-2023-47246, a vulnerability that allows attackers to manipulate server behavior for malicious purposes. The key objectives of the attackers likely include covering their tracks after gaining unauthorized access and ensuring persistence while evading detection.

  The MITRE ATT&CK framework identifies this activity under several relevant tactics and techniques, including **Execution (T1059.001)**, which pertains to the use of PowerShell for executing commands. Other techniques that might be relevant, although not directly applicable within this rule, include methods for achieving persistence or modifying host-based defenses.

  Primary data sources critical to detecting this behavior include **PowerShell script block logs**, which must be enabled for effective visibility, along with other telemetry from Windows event logs that may indicate unusual process behaviors or access patterns.

  ### Investigation Steps
  - **Review PowerShell Logs**: Examine script block logging in Windows Event Logs, focusing on any instances where the detected keywords appear within the PowerShell commands executed on compromised servers.

  - **Analyze Process Creation Events**: Investigate any processes spawned by PowerShell around the time of the detected script execution, looking for signs of unusual command history or unexpected parent-child process relationships.

  - **Check Vulnerability Management Reports**: Confirm if the impacted servers have been assessed for CVE-2023-47246 to ensure proper patching has been applied and identify any systems still vulnerable.

  - **Evaluate User Behavior**: Look into the user accounts that executed the script, assessing for compromised accounts or unusual login patterns that could indicate malicious activity or insider threats.

  ### Prioritization
  This alert is considered high severity due to the potential for data exfiltration and the erasure of critical forensic evidence, which can significantly hinder incident response efforts. The likelihood of impactful incidents is elevated given the active nature of the Lace Tempest group and their targeting of enterprise environments.

  ### Blind Spots and Assumptions
  One potential blind spot in detection coverage is the reliance on PowerShell script block logging, which must be enabled across all relevant systems for the alert to be effective. Assumptions made by the detection logic include the presence of specific strings related to the malicious script. If attackers employ different erasure methods or obfuscate their commands, the detection may fail. Additionally, the effectiveness of this alert is contingent upon having enabled logging, which may not be universally configured in all Windows environments.

