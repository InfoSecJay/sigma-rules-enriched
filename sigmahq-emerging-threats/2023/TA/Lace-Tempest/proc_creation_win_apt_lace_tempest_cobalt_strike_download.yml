  ---

  ### Technical Context

  This Sigma rule detects the execution of a specific PowerShell command line associated with the Lace Tempest framework, used to download Cobalt Strike, a common post-exploitation tool. The likely attacker objective is to establish a foothold in the environment for further malicious activity, such as lateral movement or data exfiltration. This behavior corresponds to the MITRE ATT&CK tactic of Execution (TA0002) and the technique of Command and Scripting Interpreter: PowerShell (T1059.001).

  The primary telemetry source is Windows process creation logs, specifically focusing on Process Creation Events (Event ID 4688) or Sysmon Event ID 1, which capture detailed command line execution. If this command was executed maliciously, it poses a significant risk as it indicates a direct attempt to deliver a payload or establish command and control. Importantly, this detection does NOT confirm successful malware execution or the establishment of persistence on its own.

  ---

  ### Investigation Steps

  - **Identify the alerting command line:** Review security event logs for Event ID 4688 where the CommandLine contains `-nop -w hidden -c IEX ((new-object net.webclient).downloadstring(`. Pay attention to any suspicious parent processes such as PowerShell or cmd.exe.

  - **Determine process parentage:** Check the `ParentImage` field in Event ID 4688 to identify the process that initiated the malicious PowerShell command. Typical legitimate processes may include Windows services or user-initiated applications, while suspicious parents may include known malware binaries.

  - **Validate file creation or network activity:** Investigate temporary file creation or outbound network connections established by the identified process. Look for established connections on unusual ports or to suspicious external destinations, indicating potential C2 communication.

  - **Assess recent user behavior:** Check for recent logins and actions by the user associated with the alerting process. Analyze Windows Security logs (Event ID 4624) and, if applicable, consider context around privileged users or administrative access that may indicate risk.

  - **Review the system's role and criticality:** Identify the role of the affected host (e.g., server, workstation) and its criticality within the enterprise architecture. Systems with higher criticality may require expedited response or containment measures.

  - **Document legitimate PowerShell use:** Identify instances of legitimate PowerShell use in the past week on the host by reviewing command lines or scripts run by users. Normal uses may include automation scripts or system administration tasks that do not employ the `-nop` or `-w hidden` flags.

  ---

  ### Prioritization

  Given that this alert surfaces high-risk behavior linked to the execution of a known method for downloading Cobalt Strike, its impact is significant, especially if occurring on critical assets. The likelihood of malicious abuse is high, as this method is a common technique used during real-world attacks. This type of activity is frequently observed in threat scenarios related to post-exploitation.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by adversaries using obfuscation techniques in their command lines or employing alternate scripting languages. Ensuring comprehensive logging of PowerShell activities, including script block logging, is crucial for reliable detection. Legitimate administrative scripts may trigger this alert if they use similar command patterns. Companion detections such as monitoring for known malicious outbound connections or unusual process spawning behavior can enhance overall coverage and context.

