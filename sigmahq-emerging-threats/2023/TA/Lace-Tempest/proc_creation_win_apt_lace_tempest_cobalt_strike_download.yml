detection:
  selection:
    CommandLine|contains|all:
    - -nop -w hidden -c IEX ((new-object net.webclient).downloadstring(
    - /a')
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule targets the detection of command-line execution indicative of the Lace Tempest threat actor utilizing Cobalt Strike for malicious purposes. Specifically, it identifies patterns where attackers leverage PowerShell to download Cobalt Strike through specific command-line parameters often associated with stealthy execution. The primary objective of such an attack is to establish a foothold within the network, often following initial access, while evading detection by security solutions.

  This detection aligns with the MITRE ATT&CK tactics of **Execution** (TA0002), particularly the technique for **Command-Line Interface** (T1059), which details how attackers use command-line tools to execute code on targeted systems. The attack may be part of broader tactics including **Initial Access** (TA0001) and **Persistence** (TA0003), aiming at establishing and maintaining control over compromised environments.

  Key telemetry sources for this detection include **process creation events** that log command-line arguments, allowing visibility into PowerShell executions that exhibit suspicious behavior.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for process creation related to PowerShell execution, specifically looking for command lines that include the patterns detected by the Sigma rule, indicating potential Cobalt Strike download behavior.

  - **Correlate with Network Traffic:** Investigate network logs and firewall logs for HTTP/S requests correlating with the timestamps of suspicious command-line executions. Look for unusual outbound connections to known or unknown IP addresses associated with Lace Tempest.

  - **Check for Persistence Mechanisms:** Examine the system for any newly created scheduled tasks, services, or registry entries that may indicate the establishment of persistence by the threat actor using Cobalt Strike.

  - **Conduct Threat Hunting on Affected Hosts:** Perform a deep dive investigation on the affected host, looking for any other signs of compromise such as unusual account activity, unauthorized software installations, or integrity checks on critical system files.

  ### Prioritization
  Given the potential for high-impact actions by a tailored threat actor like Lace Tempest, whose tools like Cobalt Strike are aimed at executing post-exploitation commands, this alert is classified as high severity. The likelihood of an attacker successfully leveraging these actions necessitates prompt investigation and response.

  ### Blind Spots and Assumptions
  This detection relies heavily on the presence of complete process creation logs; any gaps in capturing detailed command-line parameters might prevent successful detection of the attack behavior. It assumes that PowerShell execution will be logged effectively and that the environments do not use exceptions or obfuscation techniques that mask malicious activity. Additionally, misconfigurations in logging for Windows Event IDs relevant to process creation could hinder the effectiveness of this alert.

