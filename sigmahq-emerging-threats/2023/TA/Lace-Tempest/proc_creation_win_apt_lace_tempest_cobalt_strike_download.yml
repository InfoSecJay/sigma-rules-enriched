  ---

  ### Technical Context

  This rule detects the execution of a command line typically associated with Lace Tempest, which uses PowerShell to download the Cobalt Strike framework. The likely objective is to establish a foothold in the target environment through the deployment of Cobalt Strike, commonly utilized for post-exploitation tasks, including lateral movement and credential harvesting. This detection aligns with the MITRE ATT&CK tactic *Execution* (T1203) and technique *Command and Scripting Interpreter* (T1059).

  The primary telemetry sources are Windows process creation logs, specifically focusing on Sysmon Event ID 1 and Security Event ID 4688. If this behavior is confirmed as malicious, it could lead to significant security risks, including unauthorized access and data exfiltration. Importantly, this detection does NOT prove an organization has been successfully compromised, as legitimate uses of PowerShell for administrative tasks may resemble this command line.

  ---

  ### Investigation Steps

  - **Check Process Execution Context:** Review Sysmon Event ID 1 and Security Event ID 4688 logs for any process execution that matches the detected command line. Look for parent-child relationships where PowerShell is invoked unexpectedly, particularly from unusual paths (e.g., not from C:\Windows\System32).

  - **Validate Parent Process:** Inspect the parent process ID linked to the detected command. Common benign parent processes may include legitimate services or user-initiated scripts, while suspicious origins might include processes initiated by other executables or scripts.

  - **Look for Network Connections:** Analyze network traffic logs for any outbound connections initiated by the process to known malicious IPs or URLs commonly used by Cobalt Strike. Key fields to monitor include destination IP and port for unusual behavior.

  - **Identify Scheduled Tasks:** Review scheduled tasks in the environment for any unexpected, newly created tasks that could correlate with the timeframe of the alert. Event ID 4698 (Task Creation) can be used to investigate newly created tasks.

  - **Correlate with User Activity:** Examine user activity in Windows Security logs to see if the user account associated with the execution has a legitimate reason for using PowerShell. Assess for sign-on attempts and failed authentications which may suggest credential misuse.

  - **Confirm Legitimate PowerShell Use:** Compare against normal usage baselines for PowerShell in your environment. Identify any script execution or command line patterns that are typical for administrative tasks to reduce false positives.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on compromised systems and the likelihood of malicious exploitation of Cobalt Strike within networks. Such behaviors are increasingly weaponized and can facilitate further breaches and data loss.

  ---

  ### Blind Spots and Assumptions

  This detection may face limitations if command line logging is disabled or if PowerShell execution logging is not configured. Additionally, legitimate administrative scripts that use similar command syntax could trigger this alert. To strengthen detection, correlate this alert with triggers from PowerShell script block logging (Event ID 4104) to catch potential scripting anomalies used in tandem with such command execution.

