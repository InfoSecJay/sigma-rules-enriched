  ### Technical Context

  This rule detects the creation of specific PowerShell script files, particularly those associated with the FIN7 group. The malicious actor's likely objective is to deploy payloads that can exploit system vulnerabilities and facilitate further attacks, including data exfiltration and lateral movement within the network. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and File and Directory Discovery (T1083).

  The primary telemetry sources are Windows file event logs, specifically pertaining to file creation operations. If this behavior is identified as malicious, it could lead to significant security impacts, such as unauthorized access or data breaches. However, it is crucial to note that this detection alone does not prove malicious intent without corroborating evidence.

  ---

  ### Investigation Steps

  - **Verify file creation events:** Check security logs for File Event logs (Event ID 4663) to confirm the creation of files named `user.exe`, `usersfiles.war`, or files under the usersfiles path in `C:\Program Files\SysAidServer\tomcat\webapps\`.

  - **Analyze PowerShell execution history:** Query PowerShell operational logs (Event ID 400) to identify any commands executed that might have invoked these file creations. Look for scripts that utilize the `-File` parameter which may indicate automation.

  - **Identify legitimate usage:** Investigate whether the identified paths are actively used within your organization's applications, specifically within any authorized setups of SysAid. Document user and application mappings to rule out benign activity.

  - **Correlate with user access logs:** Review Windows Security Event IDs 4624 and 4625 for logon activity associated with the creation timeframes of the identified files. Pay attention to unusual logons from administrator accounts or new users.

  - **Confirm known malicious indicators:** Check for the presence of known malicious artifacts associated with FIN7 within the created files, such as hardcoded IPs or commands directed toward exfiltration. Use threat intelligence feeds to reference hashes or signatures of previously identified malicious files.

  - **Monitor process executions:** Validate if any process executions correlate with the file creation using Sysmon Event ID 1 for details on new processes initiated, especially around the same timestamps.

  ---

  ### Prioritization

  This alert is of high severity due to the potential compromise of critical systems, specifically those running web applications like SysAid, which may contain sensitive data. The likelihood of malicious abuse is high given FIN7’s history of targeting such systems, and the specific behavior detected is commonly weaponized.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where Windows file event logging is not comprehensively configured, leading to potential missed detections. Legitimate activities, such as routine software updates or legitimate user activity, may trigger this alert. A companion detection rule that monitors for unusual PowerShell command activity (T1059.001) would enhance coverage and threat correlation capabilities.

