detection:
  selection:
  - TargetFilename|endswith:
    - ':\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe'
    - ':\Program Files\SysAidServer\tomcat\webapps\usersfiles.war'
    - ':\Program Files\SysAidServer\tomcat\webapps\leave'
  - TargetFilename|contains: ':\Program Files\SysAidServer\tomcat\webapps\user.'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the creation of PowerShell script files with specific names or suffixes frequently associated with FIN7’s tactics. The behavior suggests an attempt to execute potentially malicious scripts as part of an attack, possibly to facilitate remote code execution or credential harvesting. It aligns with the MITRE ATT&CK tactic of Execution (TA0002), specifically the technique, PowerShell (T1059.001). Relevant telemetry sources include Windows File Event logs that specifically track file creation events, particularly those indicating potential unauthorized application deployment or execution.

  If the detected activity is malicious, it may lead to unauthorized access or control over sensitive resources within the environment. Importantly, this detection alone does not confirm malicious intent; legitimate administrative actions or system updates may also create similar file artifacts.

  ### Investigation Steps

  - **Review file creation events:** Check Windows Event Log (Event ID 4663) for file creation in the directories specified, particularly `C:\Program Files\SysAidServer\tomcat\webapps\`. Look for `user.exe`, `.war`, or files in `leave` folders.

  - **Validate script behavior:** If a relevant PowerShell script is found, extract its contents using PowerShell commands (e.g., `Get-Content <filepath>`), and analyze for suspicious commands or obfuscation patterns.

  - **Cross-reference user accounts:** Investigate the account used to create these files (Event ID 4624) and confirm whether it aligns with expected user behavior. Be alert for service accounts or admin accounts used outside their normal contexts.

  - **Check for alert repetition:** Analyze logs for the frequency of similar file creation events within a short timeframe, which could indicate an automated attempt to deploy multiple payloads simultaneously.

  - **Identify expected benign activity:** Consider that legitimate user file creation in the SysAid application may generate similar events. Cross-reference with user access logs and review recent changes to the application or system configuration.

  ### Prioritization

  Given the significance of the affected system (a potential target for data exfiltration or lateral movement), and the probability of malicious usage by actors like FIN7, this detection is of high priority. The behavior aligns with known tactics and is routinely weaponized in attacks.

  ### Blind Spots and Assumptions

  This detection may be bypassed by adversaries using different file naming conventions or obscuring their tracks through file deletion post-execution. Reliable detection requires ensuring logs from file events are enabled and retained, as some benign activities, such as software updates or maintenance tasks, may inadvertently trigger this alert. Companion detections, such as monitoring for unusual PowerShell execution logs (Event ID 4103), strongly reinforce overall visibility into potential malicious behavior.

