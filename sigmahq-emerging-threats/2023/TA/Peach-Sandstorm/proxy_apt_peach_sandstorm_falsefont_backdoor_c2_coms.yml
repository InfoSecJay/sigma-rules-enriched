  ### Technical Context

  This Sigma rule detects potential command and control (C2) communication associated with the Peach Sandstorm APT. Specifically, it identifies suspicious outbound HTTP GET requests targeting specific URIs indicative of attempting to initiate or restart a connection with a C2 server. The likely attacker objective is to regain access to a compromised system or execute further command and control operations.

  This behavior corresponds to the MITRE ATT&CK tactic **Command and Control** (T1071.001), specifically leveraging web protocols. The primary telemetry source is web proxy logs, particularly entries that capture HTTP methods, URIs, and associated metadata. If the behavior is confirmed malicious, it has a significant security impact, potentially indicating an ongoing compromise that could lead to data exfiltration or further intrusion.

  However, this detection does NOT confirm that the activity is unequivocally related to Peach Sandstorm APT without additional context, such as malicious payload or confirmed correlation with known indicators of compromise (IOCs).

  ### Investigation Steps

  - **Check outbound HTTP requests:** Investigate web proxy logs for HTTP GET requests (Event ID: N/A, Monitoring via Proxy Logs) specifically targeting the URIs `/api/Core/Command/Init` or `/api/Core/Command/Restart`. Legitimate applications should not access these URIs without a known and verifiable context.

  - **Gauge context of the request:** Validate the originating source IP address against asset inventory for role classification; requests from unknown or unnecessary devices should raise alerts.

  - **Examine request metadata:** Review the details of the HTTP GET request to identify unusual User-Agent strings or headers in the logs (HTTP Headers in Proxy Logs). Common legitimate traffic will have well-known User-Agents related to browsers or trusted applications.

  - **Identify High-Confidence Malicious Indicator:** Check for the presence of well-known malicious IP addresses or domains associated with Peach Sandstorm in threat intelligence platforms for any correlation with the outbound request.

  - **Review surrounding activity:** Analyze surrounding logs for anomalies, particularly any initial compromise indicators like lateral movement or credential dumping (e.g., Security Event ID 4624 - Logon events). Legitimate user activity should not exhibit multiple attempts to access sensitive systems or services.

  ### Prioritization

  This alert should be treated with medium severity as it comes from an asset capable of impacting critical infrastructure. The likelihood of malicious abuse is moderate given the associated threat actor. While Peach Sandstorm is an emerging threat, C2 activities representative of any APT group should be closely monitored.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include the use of disguised User-Agent strings or tunneling through legitimate domain traffic to bypass scrutiny. Detection depends heavily on comprehensive logging from web proxies and correct configurations to capture all HTTP traffic. Legitimate applications may inadvertently trigger this alert if they communicate with the specified paths under unusual operational circumstances. A companion detection that enhances coverage would be monitoring for known Peach Sandstorm IOCs in endpoint logs.

