note: |
  ### Technical Context
  This rule detects potential Command and Control (C2) communication activity related to the Peach Sandstorm APT group. The Peach Sandstorm threat actor has been known to leverage C2 infrastructure that may be detected through anomalous HTTP requests directed at specific API endpoints. By monitoring traffic patterns that invoke suspicious methods like 'GET' to endpoints such as `/api/Core/Command/Init` and `/api/Core/Command/Restart`, security teams can uncover possible attempts at remote command execution or other malicious interactions with compromised systems.

  The anticipated attacker objectives behind this behavior typically involve establishing and maintaining a foothold in victim networks, exfiltrating sensitive data, or orchestrating further attack actions while remaining covert. The relevant MITRE ATT&CK techniques that apply here include Command and Control (T1071.001 - Application Layer Protocol) and Remote Services (T1021.001 - Remote Desktop Protocol), highlighting the risk of unauthorized access and control that these communications might facilitate.

  Primary data sources providing the best insights into this behavior include proxy logs, which can capture outgoing traffic attempts to the suspicious endpoints, as well as web application logs that monitor interactions with APIs. By focusing on these logs, analysts can more effectively correlate detected activity with known threat patterns associated with Peach Sandstorm.

  ### Investigation Steps
  - **Review Proxy Logs:** Collect logs from proxy servers filtering for outgoing connections matching the specified API endpoints. Focus on any unusual patterns in traffic volume or destinations that diverge from established baselines.

  - **Analyze HTTP Requests:** Examine the details of HTTP GET requests made to the identified endpoints, paying attention to any anomalies in user agents, request headers, or payloads that could indicate malicious usage.

  - **Cross-Reference with Threat Intelligence:** Utilize threat intelligence feeds to check for indicators of compromise (IOCs) or known associated IP addresses related to Peach Sandstorm activity, and assess whether any of these IOCs are present in the network logs.

  - **Investigate User Behavior:** Look for any signs of unusual user activity or system behavior correlating with the timings of the detected C2 communications. This may include unauthorized account access, abnormal application usage, or escalated privileges.

  ### Prioritization
  This alert's severity is considered medium because, while the potential to compromise sensitive assets exists, the activity must still be corroborated with additional evidence of malicious intent or successful exploitation. Prompt investigation is crucial to understanding the context and impact.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include scenarios where direct communication with C2 servers does not utilize the monitored API endpoints or if the traffic bypasses the proxy. The detection logic assumes that all necessary logging configurations are in place and that the specific endpoints are indeed indicative of Peach Sandstorm activity. Also, any network traffic that encrypts communication or utilizes non-standard ports may evade detection entirely without appropriate logging enabled.

