  ### Technical Context

  This Sigma rule detects potential Command and Control (C2) communications associated with the Peach Sandstorm APT by identifying abnormal HTTP GET requests to specific API endpoints, namely `'/api/Core/Command/Init'` and `'/api/Core/Command/Restart'`. The likely attacker objective is to establish a communication channel to execute commands on compromised systems or to maintain persistence. This corresponds to the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1071).

  The primary telemetry source is web proxy logs, which should include HTTP request data such as the method, URI, and possibly user-agent strings. In the event of a malicious incident, the impact could involve unauthorized remote control of affected systems, data exfiltration, or lateral movement within the network. It is important to note that this detection does NOT confirm that a compromise has occurred on its own, as legitimate applications may use similar API calls.

  ---

  ### Investigation Steps

  - **Review proxy logs for suspicious HTTP activity:** Examine logs for Event ID 8000 (or relevant entries based on your proxy setup) focusing on GET requests to the mentioned URIs, especially outside of expected operational hours.

  - **Identify user-agent strings:** Cross-reference the user-agent strings in the HTTP logs to identify whether they are associated with legitimate applications or uncommon/dubious sources that might indicate tooling related to Peach Sandstorm.

  - **Evaluate the context of API calls:** Check if the behavior aligns with known legitimate use cases for the API endpoints, such as internal application monitoring or maintenance operations. Document any discrepancies.

  - **Look for high-confidence malicious indicators:** Monitor for repeated requests from a single source IP to the designated API endpoints, as well as unusual return status codes (like 4XX or 5XX) that may indicate automated exploitation attempts.

  - **Investigate asset criticality:** If any of the requesting IPs are from high-value targets, such as servers or admin workstations, escalate based on the potential impact of a compromised account or system.

  - **Validate any recent file creation:** If applicable, verify the system for any indicators of compromise (IoCs) such as new executables or scripts created around the time of suspicious logs, particularly noting suspicious file paths or sizes.

  ---

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on systems that could be weaponized for broader attacks. The likelihood of malicious abuse is moderate, as APT groups like Peach Sandstorm often target specific sectors while employing sophisticated methods to evade detection.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if web proxy logs are incomplete, and legitimate services could generate similar HTTP requests, posing a risk of false positives. A thorough review of the expected legitimate activity around the API endpoints is essential to differentiate between benign and malicious behavior. Related detection measures, like monitoring for unusual outbound DNS queries or other C2 patterns, can help bolster the defense against this threat.

