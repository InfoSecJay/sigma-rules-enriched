logsource:
  service: okta
  product: okta
detection:
  selection:
    eventtype:
    - 'user.lifecycle.create'
    - 'user.lifecycle.activate'
    target.user.display.name|contains: 'svc_network_backup'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation or activation of user accounts in Okta that match specific naming conventions associated with the 2023 Okta Support System breach. The likely objective of an attacker using these names is to establish unauthorized access through accounts that might be mistaken for legitimate service accounts. This detection primarily aligns with the MITRE ATT&CK tactics of Credential Access (TA0006) and the technique of User Execution (T1203) as attackers often create accounts to facilitate further attacks.

  The primary telemetry sources include Okta logs specifically focused on user lifecycle events. The security impact is significant; malicious account creation can lead to unauthorized access to sensitive systems and data. Importantly, this detection does NOT confirm that a breach has occurred on its own; further investigation is required to validate whether the account activity is malicious or benign.

  ### Investigation Steps

  - **Review Okta User Lifecycle Events**: Check for Event Types `user.lifecycle.create` and `user.lifecycle.activate` in Okta logs. Focus on timestamps around the alert generation and correlate with typical business hours for the organization.

  - **Verify Display Name Usage**: Identify if the detected display name (e.g., 'svc_network_backup') is a known legitimate user account in your environment. If so, document its normal operational context to determine if this is a false positive.

  - **Inspect Associated IP Addresses**: Analyze the IP addresses involved in the account creation or activation events. Look for any high-risk geolocations or known malicious IPs that deviate from expected traffic.

  - **Cross-reference Audit Logs**: Check related Audit Trails in Okta for unusual actions taken by the newly created account, such as access to sensitive applications or resources not typically accessed by similar accounts.

  - **Examine User Roles and Permissions**: Review the assigned roles and permissions for the triggered accounts. Ensure they align with the expected usage patterns of similar legitimate accounts.

  - **Validate Account Activity Post-Creation**: For any accounts created or activated, assess their subsequent activity within Okta, including login attempts, to confirm if they are being used inappropriately or if activity matches expected behavior.

  ### Prioritization

  The severity of this alert is medium, as the creation of unauthorized accounts can lead to critical breaches depending on the access rights associated with the new accounts. The likelihood of malicious abuse is moderate, particularly if accounts align with known breached naming conventions, and while this behavior is not universally weaponized, it does represent a potential entry point for attackers.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through the use of other legitimate usernames that may not be appropriately filtered out, allowing attackers to bypass this detection. It is pivotal to ensure comprehensive logging from Okta is enabled to capture all necessary lifecycle events. Legitimate activities, such as automated account provisioning during deployment scenarios, may inadvertently trigger this alert. A related detection to strengthen coverage could involve monitoring for abnormal authentication patterns following account activation.

