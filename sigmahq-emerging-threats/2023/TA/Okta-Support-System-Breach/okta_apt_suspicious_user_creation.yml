  ### Technical Context

  This rule detects the creation or activation of user accounts in Okta that specifically include naming patterns indicative of recent compromise events, particularly related to the Okta Support System 2023 breach. The likely attacker objective is unauthorized access to systems or data by creating accounts that mimic legitimate service accounts known in the organization, facilitating further credential abuse or lateral movement. This activity aligns with the MITRE ATT&CK tactic "Credential Access" (TA0006) and technique "Valid Accounts" (T1078).

  Primary telemetry sources include Okta logs, specifically event types for user lifecycle management, such as `user.lifecycle.create` and `user.lifecycle.activate`. If successful, this behavior could lead to unauthorized access and data exfiltration, significantly impacting organizational security. Importantly, this detection does NOT confirm direct malicious intent on its own; it merely indicates the action taken without context on the account’s utilization.

  ---

  ### Investigation Steps

  - **Verify event types:** Check for `user.lifecycle.create` or `user.lifecycle.activate` events in Okta logs. Look for Event ID that matches these lifecycle changes to confirm the alert correlation.

  - **Review usernames:** Look for specific display names in the logs that contain ‘svc_network_backup’. Compare against an inventory of recognized and legitimate service account names to differentiate between benign and suspicious account creations.

  - **Check account permissions:** Examine the permissions associated with the new or activated account. Elevated or unusual permissions that do not align with typical service accounts may indicate malicious intent. Check Okta API call logs for elevated access (e.g., API permissions retrieval).

  - **Investigate timeline:** Cross-reference the timing of the account creation or activation with other security events in your environment (e.g., significant logins, failed authentication attempts) to assess if this may be part of a larger attack pattern.

  - **Identify associated activities:** Investigate subsequent activities from the new accounts, such as logins or API usage. Legitimate accounts should have a clear activity record matching operational needs, while suspicious accounts may show irregular behavior.

  - **Assess asset criticality:** Determine if the systems the new accounts are attempting to access are critical assets within the environment, as a breach of critical systems could have severe repercussions.

  ---

  ### Prioritization

  This alert should be treated with medium severity given that it involves the creation of possibly unauthorized accounts directly linked to a high-profile breach. While the likelihood of malicious abuse is significant given the context of the Okta incident, whether this behavior is weaponized varies by organization, depending on existing account controls and monitoring mechanisms.

  ---

  ### Blind Spots and Assumptions

  Detection could be limited by legitimate account creation or activation for system upgrades, migrations, or scheduled tasks that may trigger this alert. Ensure that logging for all user lifecycle event types is enabled in Okta to achieve reliable detection coverage. Additionally, similar naming patterns might exist for legitimate service accounts, necessitating thorough verification. This detection can be complemented by monitoring authentication failures or suspicious login activity as part of a broader investigation strategy.

