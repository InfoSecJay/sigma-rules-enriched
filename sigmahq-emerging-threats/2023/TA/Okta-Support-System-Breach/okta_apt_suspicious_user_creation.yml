note: |
  ### Technical Context

  This Sigma rule detects the creation or activation of user accounts in Okta with specific names tied to the 2023 breach, particularly targeting account names like 'svc_network_backup'. This behavior may indicate an attempt by an adversary to compromise internal systems by leveraging potentially deceptive account names for lateral movement or privilege escalation. The relevant MITRE ATT&CK tactic is Credential Access, specifically the technique T1078 (Valid Accounts).

  Primary telemetry for this detection comes from Okta logs, specifically those related to user lifecycle events, such as account creation and account activation. If malicious, the security impact could be substantial; unauthorized accounts can be used to access sensitive systems and data. It is crucial to note that this detection alone does not confirm malicious intent; a legitimate administrator could also create or activate accounts.

  ### Investigation Steps

  - **Review user account details:** Check the account creation time (Event Type: `user.lifecycle.create`) and activation logs (Event Type: `user.lifecycle.activate`) for `svc_network_backup` in Okta logs. Validate whether the account creation follows organizational procedures.

  - **Evaluate account activity:** Cross-reference the user account's login attempts in Okta's system (Event Type: `user.session.start`), and ensure that there are no unauthorized access patterns, such as logins from unusual geolocations or timings.

  - **Identify legitimate account usage:** Determine if similar accounts (e.g., service accounts) are in use within your organization. Review previous instances where such accounts were created or modified to understand normal operating behavior.

  - **Scrutinize related activities:** Look for other suspicious accounts created around the same time (Event Type: `user.lifecycle.create`). Analyze patterns, such as simultaneous activations or proximity in time, which may indicate bulk account creation attempts.

  - **Check admin activity:** Review the Okta admin logs for account management changes (Event Type: `user.admin.create`). Determine if there were recent administrative activities allowing these account modifications, indicating potential insider threats.

  ### Prioritization

  This alert is of medium severity due to the impact potential of an unauthorized account creation in a critical identity management system like Okta. The likelihood of abuse is heightened considering the breach context, as adversaries often exploit newly created accounts for unauthorized access. However, without further corroborative evidence, the alert may also reflect legitimate administrative activities.

  ### Blind Spots and Assumptions

  This detection may be bypassed by legitimate administrative actions, which could lead to false positives. Reliable detection depends on comprehensive Okta logging configuration and active monitoring of account creation patterns. Legitimate automation processes could also trigger alerts; for instance, service accounts might be created regularly for maintenance tasks. A related detection to consider would be monitoring for suspicious login behaviors associated with the created accounts, enhancing overall security visibility.

