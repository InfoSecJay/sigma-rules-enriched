title: Okta 2023 Breach Indicator Of Compromise
id: 00a8e92a-776b-425f-80f2-82d8f8fab2e5
status: test
description: |
  Detects new user account creation or activation with specific names related to the Okta Support System 2023 breach.
  This rule can be enhanced by filtering out known and legitimate username used in your environnement.
author: Muhammad Faisal (@faisalusuf)
date: 2023-10-25
references:
- https://www.beyondtrust.com/blog/entry/okta-support-unit-breach
- https://developer.okta.com/docs/reference/api/event-types/
tags:
- attack.credential-access
- detection.emerging-threats
logsource:
  service: okta
  product: okta
detection:
  selection:
    eventtype:
    - 'user.lifecycle.create'
    - 'user.lifecycle.activate'
    target.user.display.name|contains: 'svc_network_backup'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential indicators of compromise (IOCs) related to the Okta 2023 breach by monitoring for the creation or activation of new user accounts with specific names associated with the incident, such as 'svc_network_backup'. The main objective of the threat actor during the Okta breach was to exploit user identities and gain unauthorized access to sensitive information. By creating or activating user accounts with specific names, an attacker could be attempting to facilitate lateral movement or establish persistence within the network.

  Relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and associated techniques such as **Account Manipulation** (T1098), where malicious actors may create or activate accounts to exploit elevated privileges. Primary data sources for this detection include Okta logs that detail user lifecycle events, specifically focusing on user creation and activation logs that can shed light on unauthorized or suspicious account activities.

  ### Investigation Steps
  - **Review Okta User Lifecycle Logs:** Examine the logs for any 'user.lifecycle.create' or 'user.lifecycle.activate' events corresponding to the targeted account names. Look for patterns or anomalies related to timing, frequency, or source IP addresses.

  - **Correlate with User Access Patterns:** Analyze the access patterns associated with the created accounts to determine if they exhibit unusual behavior, such as accessing sensitive resources not typically associated with that account.

  - **Check for Anomalous Permissions:** Investigate the permissions assigned to the newly created or activated accounts to ensure they align with organizational policies. Look for any elevation of privileges that could signify unauthorized access.

  - **Filter Out Known Good Accounts:** Utilize information available in your environment to filter out legitimate account names that are known to be valid. This helps reduce false positives and allows for a more focused investigation.

  ### Prioritization
  The medium severity of this alert is justified due to the potential impact of unauthorized account creation, which can facilitate broader attacks on enterprise resources. Given the high profile of the Okta 2023 breach, vigilance is necessary as the likelihood of an ongoing threat remains elevated.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the log settings are not properly configured to capture all relevant user lifecycle events. The detection logic assumes that the naming conventions used for legitimate accounts are well understood and documented, which may not always be the case. For this alert to function effectively, organizations must ensure that comprehensive logging of user lifecycle events is enabled within Okta and that these logs are forwarded to a central monitoring solution.

