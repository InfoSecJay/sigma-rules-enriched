logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
    - 'zxFunction'
    - 'RemoteDiskXXXXX'
  condition: selection
fields:
- CommandLine
- ParentCommandLine
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies the execution of ZxShell malware through the invocation of the classic `rundll32.exe` Windows utility. Attackers may employ ZxShell to facilitate remote access and control over infected systems, typically aiming to exfiltrate data, pivot further into the network, and perform additional malicious activities without being detected. The rule looks for specific command-line arguments, such as references to `zxFunction` or suspicious remote disk references, which are indicative of this malware’s operational mechanics.

  The relevant MITRE ATT&CK framework tactics and techniques include:
  - **Execution**: T1059.003 (Command and Scripting Interpreter: Windows Command Shell)
  - **Defense Evasion**: T1218.011 (Signed Binary Proxy Execution)
  - **Initial Access**: G0001 (Adversary-in-the-middle)

  Primary data sources for this detection include process creation logs that capture the execution details of processes like `rundll32.exe`, along with command-line arguments that can reveal malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs for instances of `rundll32.exe` and filter by the command-line arguments `zxFunction` or `RemoteDiskXXXXX`. Pay attention to the parent process to understand the context of the invocation.

  - **Correlate with Network Activity**: Check any associated outbound network traffic that may indicate communication with known malicious IP addresses or domains, especially around the time `rundll32.exe` was executed.

  - **Examine Artifact Details**: Investigate the details of the binaries associated with the identified process to ensure they are not altered or mimicking legitimate applications. Evaluate binary signatures where applicable.

  - **Alert on Anomalous Behavior**: Monitor for irregular behavior patterns suggesting that typical user activities are being disrupted or altered due to malware presence. This may involve heightened scrutiny of account activities that coincide with the detected execution.

  ### Prioritization
  This alert is classified as critical due to the high potential impact of ZxShell malware on enterprise environments, as it can facilitate unauthorized remote access, data exfiltration, and lateral movement within networks. The combination of potentially malicious command line arguments and the use of a trusted Windows utility heightens the likelihood of a successful attack.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if necessary logging is not enabled on endpoints or if `rundll32.exe` is used legitimately without the malicious command-line arguments, thereby introducing false negatives. The detection logic assumes that the malware will use recognizable command-line patterns, which may change or be obfuscated. For optimal functionality, process creation event logging must be enabled across all endpoints, and any legitimate command-line arguments should be well-documented to reduce false positives.

