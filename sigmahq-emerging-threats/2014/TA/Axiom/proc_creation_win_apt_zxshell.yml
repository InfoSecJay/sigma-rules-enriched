note: |
  ### Technical Context

  The rule detects the execution of the ZxShell malware via the use of the `rundll32.exe` process, specifically by monitoring for command-line invocations that include the function name 'zxFunction' and a suspicious argument 'RemoteDiskXXXXX'. The likely objective of the attacker is to execute arbitrary code or establish a malicious connection using this disguised method. This behavior aligns with the MITRE ATT&CK techniques for Execution (T1059.003) and Living off the Land (T1218.011). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 for process launches, and Sysmon Event ID 1 for command-line details. If malicious, this behavior can result in a compromise of the system and potential lateral movement within the network. However, this detection does NOT confirm that the ZxShell malware is present without further context from surrounding events.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check Windows Security Event ID 4688 and Sysmon Event ID 1 for entries where `rundll32.exe` is launched with command line containing 'zxFunction' and 'RemoteDiskXXXXX'. Verify the legitimacy based on known software deployments.

  - **Correlate Suspicious Network Connections**: Analyze network logs (e.g., Windows Firewall logs or EDR telemetry) for outbound connections initiated shortly after the suspicious process execution, specifically to uncommon or foreign IP addresses.

  - **Check for Other Malicious Indicators**: Look for additional signs of compromise in Sysmon Event ID 23, focusing on suspicious parent-child process relationships involving `rundll32.exe`. Evaluate processes spawned by `rundll32.exe`.

  - **Establish Baseline for Legitimate Behavior**: Identify usage patterns of `rundll32.exe` in your environment, especially when associated with known software or system tasks to determine if the command-line context is indicative of legitimate operations.

  - **Examine File System Changes**: Investigate file creation or modification events (e.g., Sysmon Event ID 11) in the directories associated with `rundll32.exe` or related temporary folders for unusual activity after the detected execution.

  ### Prioritization

  This alert carries a critical severity due to the potential for severe impact on compromised systems, including data exfiltration or persistent access. Given that this behavior mimics legitimate use cases, it requires rapid investigation to confirm malicious intent, as techniques like this are commonly exploited in the wild.

  ### Blind Spots and Assumptions

  Detection may be limited if `rundll32.exe` is used legitimately for specific benign functions, which can trigger false positives. Reliable detection requires visibility into process creation logs, which can be omitted if endpoint monitoring is not properly configured. Additionally, legitimate administrative tasks or software installations could mistakenly trigger this detection. Companion detections to enhance coverage include monitoring for anomalous PowerShell usage (T1059.001) as it may relate and escalate to similar behaviors or facilitate the introduction of the malware.

