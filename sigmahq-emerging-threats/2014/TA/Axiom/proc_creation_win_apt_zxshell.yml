detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
    - 'zxFunction'
    - 'RemoteDiskXXXXX'
  condition: selection
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the execution of ZxShell malware by identifying the use of the `rundll32.exe` process with command-line parameters indicative of its operation, specifically looking for terms such as 'zxFunction' and 'RemoteDiskXXXXX'. The likely attacker objective is to execute malicious code stealthily by leveraging legitimate Windows utilities to evade detection. This behavior correlates with the MITRE ATT&CK tactic 'Execution' (TA0002) and technique 'Command and Scripting Interpreter: Windows Command Shell' (T1059.003).

  The primary telemetry source is process creation logs from Windows, specifically leveraging Event ID 4688 in the Security event logs. If malicious, the presence of this execution could indicate a breach or the establishment of a persistent foothold in the environment. Importantly, this detection does NOT confirm that a system is compromised, as benign processes may trigger this rule if legitimate command line arguments are used in `rundll32.exe`.

  ### Investigation Steps

  - **Examine process creation logs:** Review Windows Event ID 4688 for any instances of `rundll32.exe` being executed. Check the CommandLine field for the presence of 'zxFunction' and 'RemoteDiskXXXXX'. Look for these exact strings as malicious indicators.

  - **Identify host role and context:** Determine the role of the affected host (e.g., server, workstation) and whether it normally runs `rundll32.exe` with similar parameters. Legitimate administrative or system maintenance scripts may use this utility but not typically with the specified command line.

  - **Correlate with other security logs:** Check for related events (e.g., Event ID 4672 indicating special privileges assigned) occurring around the same time as the detected execution. A combination of multiple atypical events may indicate malicious activity.

  - **Investigate network activity:** Look for any abnormal network connections originating from the system using tools like network monitoring or endpoint detection logs. For example, track outbound connections to external IPs immediately following the ZxShell execution. This could be indicative of data exfiltration.

  - **Analyze file system changes:** Validate for any suspicious file creation or modification artifacts in the system’s TEMP directory or the directories associated with `rundll32.exe`. Use File Create or Modify event logs to identify any files that were dropped or modified immediately after the ZxShell execution.

  - **Review related detections for additional context:** Consider running complementary detections focused on lateral movement or command-and-control communications to strengthen the investigation. For instance, look at logs indicating unusual PowerShell usage or other command-line interfaces typically leveraged by attackers.

  ### Prioritization

  This alert should be treated with high urgency due to the criticality of the system being affected and the likelihood of exploiting legitimate processes for malicious intents. This behavior is not only uncommon but is also a recognized tactic used in many known attacks, increasing the importance of swift investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include alterations to command-line parameters or the use of alternative tools to achieve similar outcomes without triggering this rule. Reliable detection necessitates well-configured logging for all process creations and may require extended log retention to assist in post-event analysis. Legitimate administrative tasks and scripts using `rundll32.exe` with modified command-line arguments can trigger false positives. Companion detections may include monitoring for abnormal scheduled tasks that could be associated with malware persistence mechanisms.

