logsource:
  category: process_creation
  product: windows
detection:
  selection_cli_1:
    CommandLine|contains:
    - 'tracert -h 10 yahoo.com'
    - '.WSqmCons))|iex;'
    - 'Fr`omBa`se6`4Str`ing'
  selection_cli_2:
    CommandLine|contains|all:
    - 'net use https://docs.live.net'
    - '@aol.co.uk'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule focuses on identifying commands associated with the Turla cyber espionage group, as reported by ESET in May 2020. Turla, known for their sophisticated cyber operations primarily targeting governmental and military organizations, employs various techniques to gain and maintain access to victim networks. The commands flagged in this rule indicate potential malicious activity, which could involve reconnaissance efforts, data exfiltration, or command-and-control interactions.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1203)**: Techniques used to execute unauthorized code or commands.
  - **Command and Control (T1071.001)**: Application Layer Protocol – Web Protocols – for exfiltration.
  - **Exfiltration Over Command and Control Channel (T1041)**: Methods for transferring stolen data.
  The primary data source for detecting these commands is the process creation logs from Windows systems, which capture command-line arguments used during the execution of processes. Analysts should focus on these logs to identify potentially malicious activity related to Turla's operations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of the specified command-line patterns in process creation logs on affected endpoints, which can show paths of execution that correspond to Turla's known commands.
  - **Correlate with Network Traffic**: Analyze outbound network connections and filter for unusual destinations or protocols that may correlate with the command types detected, particularly those suggesting command-and-control traffic.
  - **Examine User Accounts**: Investigate the user account under which the suspicious commands were executed for any anomalies in usage patterns that could indicate unauthorized access or privilege escalation.
  - **Evaluate Security Alerts**: Cross-reference the findings from this rule with existing SIEM alerts and EDR data to contextualize potential attacks or lateral movement within the network.

  ### Prioritization
  This alert should be treated as critical due to the high impact and likelihood associated with actions potentially taken by a recognized advanced persistent threat (APT) like Turla. Given their history of targeting sensitive organizations, any detection of their command usage indicates an urgent need for response.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to the variability of command obfuscation or modifications made by attackers to bypass detection. The detection logic assumes that the monitored systems maintain adequate logging levels for process creation events and that the command-line inputs used during execution are captured correctly. Any limitations in log retention or filtering that obscure contextual data may hinder effective analysis and response.

