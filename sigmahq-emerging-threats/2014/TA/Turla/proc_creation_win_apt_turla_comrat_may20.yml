logsource:
  category: process_creation
  product: windows
detection:
  selection_cli_1:
    CommandLine|contains:
    - 'tracert -h 10 yahoo.com'
    - '.WSqmCons))|iex;'
    - 'Fr`omBa`se6`4Str`ing'
  selection_cli_2:
    CommandLine|re: 'net\s+use\s+https://docs.live.net'
    CommandLine|contains: '@aol.co.uk'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies potentially malicious commands associated with the Turla Group, a well-known advanced persistent threat (APT) actor. The rule is based on a report from ESET detailing specific command-line usage that is characteristic of Turla's operations. The attackers often leverage these commands as part of their reconnaissance, persistence, and execution phases to manipulate systems and maintain access. The behaviors detected include unusual network commands, attempts to access cloud resources, and obfuscated PowerShell commands.

  The relevant MITRE ATT&CK tactics and techniques implicated include:
  - **Execution** (T1059.001): Malicious code execution via command-line shell.
  - **Persistence** (T1053.005): Persistence via services or scheduled tasks using specific network connections.
  - **Defense Evasion** (T1027): Obfuscated files or information to disguise malicious activity.
  - **Privilege Escalation** (G0010): Gaining higher-level permissions.

  Primary data sources to examine for this detection include process creation logs on Windows systems, particularly focusing on command-line parameters that can provide insights into the intent and origin of executed commands.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation events to identify any instances of the specified commands from the Turla Group. Focus on the command-line arguments for any suspicious activity.
  - **Analyze Network Connections:** Investigate any outbound connections related to the commands, particularly those attempting to access known malicious domains or unusual URLs, such as `https://docs.live.net`.
  - **Cross-reference User Accounts:** Identify the user accounts that executed these commands and assess their legitimacy and permissions, looking for any anomalous behavior or unusual account privileges.
  - **Scan for Malware Artifacts:** Utilize endpoint security tools to search for known Turla malware signatures or any persistent artifacts tied to the command execution observed in the logs.

  ### Prioritization
  Given the Turla Group's history of targeted attacks and sophisticated tactics, alerts triggered by this detection rule should be treated with high urgency due to the potential impact on system integrity and data security. The likelihood of exploitation based on the prevalence of these commands in APT operations adds to the critical nature of this alert.

  ### Blind Spots and Assumptions
  This detection may miss variations of the command that do not match the specified strings directly or obfuscated forms that deviate from common patterns. Additionally, if proper logging isn't configured on endpoints to capture all command-line arguments, the detection may fail to trigger. Assumptions include that the monitored systems are running Windows and that logs are retained for an adequate period to facilitate thorough investigation.

