detection:
  selection_ldifde:
    CommandLine|contains|all:
    - 'ldifde'
    - '-f -n'
    - 'eprod.ldf'
  selection_lateral_movement:
    CommandLine|contains|all:
    - 'copy \\\\'
    - 'c$'
    CommandLine|contains:
    - '\aaaa\procdump64.exe'
    - '\aaaa\netsess.exe'
    - '\aaaa\7za.exe'
    - '\c$\aaaa\'
  condition: 1 of selection_*
