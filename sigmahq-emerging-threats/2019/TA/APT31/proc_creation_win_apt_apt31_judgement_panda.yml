logsource:
  category: process_creation
  product: windows
detection:
  selection_ldifde:
    CommandLine|contains|all:
    - 'ldifde'
    - '-f -n'
    - 'eprod.ldf'
  selection_lateral_movement:
    CommandLine|contains|all:
    - 'copy \\\\'
    - 'c$'
    CommandLine|contains:
    - '\aaaa\procdump64.exe'
    - '\aaaa\netsess.exe'
    - '\aaaa\7za.exe'
    - '\c$\aaaa\'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity associated with APT31, also known as Judgement Panda. It focuses on actions that indicate lateral movement and credential access by monitoring the use of specific command-line patterns associated with PowerShell and other common tools. APT31 has been known to target various sectors, primarily focusing on espionage and data theft, often leveraging legitimate administrative tools in their operations. The attacker’s goal is likely to move laterally within the environment, elevate privileges, and eventually exfiltrate sensitive data.

  The detection logic employs keyword searches to identify the execution of the `ldifde` command, which is commonly used for LDAP directory exports, along with commands that suggest the use of tools such as ProcDump, Netsess, and 7-Zip, which can facilitate data access and lateral movement. Relevant MITRE ATT&CK tactics include:
  - Lateral Movement (T1021)
  - Credential Access (T1003)
  - Remote System Discovery (T1560.001)

  The primary data source for this detection comes from process creation events on Windows systems, which log command-line executions that can reveal if unauthorized tools or commands are being utilized.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine Windows process creation logs for entries matching the command-line patterns specified in the detection logic. Pay close attention to parameters indicating lateral movement, especially within administrative contexts.

  - **Identify Unusual SMB Activity:** Investigate SMB logs for any unusual file copy commands or access to administrative shares that could indicate an attacker is attempting to exploit these methods for lateral movement.

  - **Correlate with User Activity:** Check if the users executing these commands have a legitimate need for such actions. Look for discrepancies in user roles and behavior that could suggest compromise or malicious intent.

  - **Examine Directory Enumeration Requests:** Analyze LDAP query logs, particularly those involving the `ldifde` command, to determine if there are unauthorized attempts to enumerate directory services, which can indicate reconnaissance before lateral movement.

  ### Prioritization
  Given the critical nature of the threat posed by APT31, which includes advanced persistent threat characteristics and the potential for significant data loss, this alert warrants immediate attention and response from security teams. The likelihood of exploitation in environments lacking strong security measures is high.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of APT31 activity, particularly if attackers utilize custom or less common tools that do not align with the specified command-line patterns. It assumes that detailed process creation logging is enabled and that command-line arguments are being logged comprehensively. Additionally, environments that lack adequate monitoring of network traffic and SMB file access may miss related activity, which could provide context for the alerts generated by this rule.

