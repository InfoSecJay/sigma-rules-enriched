logsource:
  category: process_creation
  product: windows
detection:
  selection_ldifde:
    CommandLine|contains|all:
    - 'ldifde'
    - '-f -n'
    - 'eprod.ldf'
  selection_lateral_movement:
    CommandLine|contains|all:
    - 'copy \\\\'
    - 'c$'
    CommandLine|contains:
    - '\aaaa\procdump64.exe'
    - '\aaaa\netsess.exe'
    - '\aaaa\7za.exe'
    - '\c$\aaaa\'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule targets potential activities associated with APT31, a threat actor known for espionage campaigns, particularly against organizations in critical sectors. The rule specifically detects the use of `ldifde`, a tool often leveraged for Active Directory queries that may indicate an attempt to extract sensitive information or credentials. Additionally, it looks for lateral movement activities, which may suggest an effort by an attacker to move within the network after initial exploitation. The primary objective of APT31 is typically to gather intelligence that could be used to inform strategic advantages or exploitations.

  Relevant MITRE ATT&CK tactics for this detection include **Collection (TA0009)** as the attacker is trying to gather sensitive information, **Lateral Movement (TA0008)** for the moves made through the network, and **Credential Access (TA0006)** which encompasses the techniques used to obtain account credentials. In particular, techniques such as **T1003.001 (Credential Dumping: LSASS Memory)** and **T1560.001 (Archive Collected Data: Archive via Utility)** apply. This makes the detection effective at highlighting fundamental actions in data exfiltration and system compromise linked to APT31 activities.

  Primary data sources that provide the best evidence for these activities include **process creation logs** on Windows systems, capturing command line arguments for executed processes and any related network connections during lateral movement attempts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for instances of `ldifde` usage, especially with command line arguments including `-f -n` and `eprod.ldf`, which may indicate an unauthorized attempt to extract Active Directory data.
  - **Examine Lateral Movement Credentials:** Identify process creation events that involve attempts to connect via administrative shares (`c$`) combined with suspicious command line activities that could involve tools like `procdump64.exe`, `netsess.exe`, and `7za.exe`.
  - **Collect Network Traffic Logs:** Inspect network traffic for unusual SMB traffic patterns or connections initiated to uncommon endpoints, especially during times coinciding with potential APT31 activities.
  - **Audit User Account Activities:** Look for user accounts implicated in the logs that show high levels of access, or any that have inconsistent behavior which might indicate compromise or misuse.

  ### Prioritization
  This alert should be treated with high priority due to the significant threat level posed by APT31. Given their high capability and intent to gather sensitive data, any detected activity must be rapidly investigated to mitigate potential data breaches or intelligence compromises.

  ### Blind Spots and Assumptions
  The detection logic may overlook activities that use similar methods but involve different tools or variations on `ldifde`. Assumptions are made that the logged command-line inputs are not obfuscated or altered, and that logging for process creation is appropriately configured across all endpoints. Additionally, if logging is disabled for Lateral Movement tools or there are constraints in network flow logging, certain activities could go undetected. Therefore, it is essential to ensure the logging policies are robust and that any benign occurrences of these commands are well understood in the context of the organization.

