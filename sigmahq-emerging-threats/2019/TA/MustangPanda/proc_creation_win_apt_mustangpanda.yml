logsource:
  category: process_creation
  product: windows
detection:
  selection_cli:
  - CommandLine|contains:
    - 'Temp\wtask.exe /create'
    - '%windir:~-3,1%%PUBLIC:~-9,1%'
    - '/tn "Security Script '
    - '%windir:~-1,1%'
  - CommandLine|contains|all:
    - '/E:vbscript'
    - 'C:\Users\'
    - '.txt'
    - '/F'
  selection_img:
    Image|endswith: 'Temp\winwsh.exe'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of potentially malicious process parameters associated with the Mustang Panda APT group, specifically targeting Windows environments. The attackers aim to deploy malware payloads using scripts (typically VBScript) while disguising their operations with process names like "wtask.exe" and "winwsh.exe". Relevant MITRE ATT&CK tactics include Resource Development (T1587.001) for developing malicious tools and Initial Access through these processes.

  Primary telemetry sources include Windows Process Creation logs (Event ID 4688). If this behavior is malicious, it could lead to unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does not confirm successful execution of the malicious payload or infection; further investigation of the processes and their impact is required.

  ### Investigation Steps

  - **Check Process Creation Events:** Review Security Event ID 4688 for process creation events related to "Temp\wtask.exe" and "Temp\winwsh.exe". Focus on the command line parameters for indicators of compromise.

  - **Examine Command Line Parameters:** Analyze command lines for occurrences of '/E:vbscript', '%windir:~-3,1%%PUBLIC:~-9,1%/', and references to 'C:\Users\*.txt'. Malicious activity often contains these specific strings.

  - **Identify Legitimate Activity:** Determine whether the processes were initiated by known legitimate applications or users. Look for common system maintenance scripts and their command-line usages that do not include identified malicious parameters.

  - **Correlate with File System Changes:** Check file creation events in Temp directory (using Sysmon Event ID 11 or Windows Event ID 4663) for files created by the detected processes. Look for newly created VBScript or text files, which are common payload artifacts.

  - **Investigate User Context:** Review logged-in user sessions around the time of the alert. Identify whether the user corresponds to sensitive roles or has anomalous behaviors that may indicate an account compromise.

  ### Prioritization

  This alert is of high severity due to the potential for critical system compromise if the detected behaviors are confirmed as malicious. Given the sophistication of the Mustang Panda group and their targeting of vulnerable sectors, there is a high likelihood these techniques are weaponized and successfully employed against similar environments.

  ### Blind Spots and Assumptions

  Detection may be limited by false negatives arising from process renaming or obfuscation techniques employed by attackers. Additionally, appropriate logging configurations must be in place to capture all relevant event types, particularly for process creation and file modifications. Legitimate administrative scripts could trigger this rule, necessitating thorough contextual analysis. Related detections include those monitoring for unusual VBScript execution or script file access to enhance visibility into potential malicious activities.

