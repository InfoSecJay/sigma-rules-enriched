logsource:
  category: process_creation
  product: windows
detection:
  selection_cli:
  - CommandLine|contains:
    - 'Temp\wtask.exe /create'
    - '%windir:~-3,1%%PUBLIC:~-9,1%'
    - '/tn "Security Script '
    - '%windir:~-1,1%'
  - CommandLine|contains|all:
    - '/E:vbscript'
    - 'C:\Users\'
    - '.txt'
    - '/F'
  selection_img:
    Image|endswith: 'Temp\winwsh.exe'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies specific indicators associated with the Mustang Panda threat actor, known for using droppers to deploy malware. The rule focuses on unique process creation patterns, specifically the command-line parameters associated with Mustang Panda's droppers that utilize WinWsh (Windows script host) to execute malicious payloads. The typical objective of Mustang Panda is to infiltrate targeted systems to establish a foothold for further exploitation, often against minority groups and organizations in both the public and private sectors.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **T1587.001: Development of Payloads** - The creation and deployment of malicious payloads.
  This rule relies primarily on telemetry from process creation events, specifically monitoring for unusual command-line arguments that reference specific executables frequently associated with Mustang Panda operations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for any instances of `wtask.exe` being called with suspicious arguments, particularly those involving paths to user directories and scripts indicated in the command line.

  - **Check the Executable Path**: Verify the locations of any instances of `winwsh.exe`, particularly under the `Temp` directory. This executable’s unexpected presence can indicate compromise.

  - **Analyze Command-Line Arguments**: Focus on command-line parameters for created processes. Look for the usage of the `/E:vbscript` flag and references to `.txt` files in user directories, as these are significant to the detection.

  - **Correlate with Other Logs**: Cross-reference any findings with logs from your EDR or NGFW to see if there are any associated network connections or other behaviors indicative of post-exploitation activities.

  ### Prioritization
  The alert is classified as high severity due to Mustang Panda's proven track record of targeting vulnerable organizations, which can lead to significant data breaches and operational disruptions.

  ### Blind Spots and Assumptions
  This detection rule may not account for variations in command-line patterns or the usage of alternative scripting languages that might be leveraged by the attacker. The detection logic assumes that monitoring for specific process creations is adequately configured and that logs are retained for sufficient periods. If these logs are not configured to capture detailed command-line arguments or if the environment lacks logging capabilities for `Temp` folder activities, detections may be missed.

