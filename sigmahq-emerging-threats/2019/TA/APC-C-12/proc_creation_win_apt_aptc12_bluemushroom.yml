detection:
  selection:
    CommandLine|contains|all:
    - 'regsvr32'
    - '\AppData\Local\'
    - '.dll'
    - ',DllEntry'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of `regsvr32` to load a DLL located in the AppData Local directory, which is a behavior often associated with loading malicious DLLs for persistence or execution. The likely attacker objective is to execute malicious code without raising suspicion, potentially for data exfiltration, lateral movement, or establishing persistence. This behavior corresponds to the MITRE ATT&CK technique T1218.010: **Signed Binary Proxy Execution (regsvr32)**.

  The primary telemetry source is Windows process creation logs, specifically looking for Event ID 4688 entries that indicate the execution of the `regsvr32` command with specific command-line arguments. If this activity is malicious, it could lead to unauthorized access, data theft, or a compromised system. This detection does NOT confirm that the loaded DLL is malicious on its own; further investigation is required to analyze the DLL and its source.

  ### Investigation Steps

  - **Identify the command execution details:** Review Event ID 4688 in the Security logs to find the `regsvr32` command execution. Look for command-line arguments referencing DLLs in the `C:\Users\<username>\AppData\Local\` directory.

  - **Check for known malicious DLLs:** Validate any loaded DLLs against threat intelligence sources. Malicious indicators include names or hashes associated with known threats in the BlueMushroom family.

  - **Review related process activity:** Check for parent-child process relationships surrounding the `regsvr32` execution. Use Sysmon Event ID  Processes (Event ID 1) to assess if unusual parent processes (e.g., script engines) executed `regsvr32`.

  - **Identify legitimate usage patterns:** Cross-reference typical software that might legitimately use `regsvr32` for DLL registration, especially applications requiring COM components in user profiles. Investigate standard application install logs or SCCM/Intune for expected installations.

  - **Examine file system changes:** Look for file operations related to the DLL, including creation/modification timestamps and file integrity monitoring logs. High confidence in malicious behavior may be established if the file was created within a suspicious context.

  ### Prioritization

  This alert is considered medium severity due to its potential impact if executed on critical assets; loading malicious DLLs can grant attackers high-level access and persistence. Historically, `regsvr32` loading has been weaponized by various adversarial groups, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection may be limited by the evasion techniques such as modifying the DLL file signature or placing DLLs in other directories. It is essential to ensure that logging for process creation (Event ID 4688) and file system activity is enabled and properly configured. Legitimate activities like software installations or system updates may also trigger this alert. Companion detections that strengthen coverage include monitoring for unusual DLL creations in the user’s AppData directory or flagged execution of PowerShell scripts that invoke `regsvr32`.

