note: |
  ### Technical Context

  This Sigma rule detects the execution of `regsvr32` to load DLL files from the user's AppData local directory, specifically those containing the substring `,DllEntry` in their command line. This behavior is often exploited by attackers to load malicious or non-standard libraries in a way that may evade detection. The likely objective is to run a payload associated with APT-C-12 (BlueMushroom), which typically focuses on stealthy lateral movement and persistence within an environment.

  This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (T1203) via the technique of Functionality Abuse (T1218.010). Primary telemetry sources include Windows process creation events, specifically Security Event ID 4688 for process creation details and Sysmon Event ID 1 for command line options. If successful, this could allow an attacker to establish a foothold or execute further malicious activities. However, this detection does not confirm malicious intent on its own, as `regsvr32` can also be used legitimately by IT personnel.

  ### Investigation Steps

  - **Examine process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for commands containing `regsvr32` and DLLs located in `C:\Users\<username>\AppData\Local\`. Validate whether the command line includes `,DllEntry`.

  - **Identify high-confidence malicious indicators:** Look for unusual DLL paths that are not common in your environment and contain strings indicative of known malware. Check for files that were created or modified within the AppData directory during unusual hours or outside of expected user activity.

  - **Review related activities:** Check for additional signs of lateral movement or persistence, such as new scheduled tasks or unusual registry changes within `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`.

  - **Establish baseline behavior:** Compare the identified execution against expected usage of `regsvr32` by legitimate applications or administrators. Confirm it is not related to normal application deployments or updates that might require DLL registration.

  - **Monitor for preceding suspicious activity:** Correlate this detection with recent logins or other unusual access patterns, such as failed login attempts, that may indicate a compromised user account.

  ### Prioritization

  The alert is of medium severity due to the potential impact on critical systems if exploited, given that the AppData directory is often overlooked. The likelihood of malicious actors using this technique is considerable as it is a common method for executing payloads while masking their activity.

  ### Blind Spots and Assumptions

  Detection may be limited by administrative actions that genuinely require `regsvr32` to operate from the AppData directory, resulting in false positives. It is vital to ensure logging for System and Security event sources, particularly for process creation, is properly configured. Additionally, malicious use of this technique may be accompanied by other indicators such as unusual network activity or file modifications, making companion detections focused on those behaviors valuable for corroborating investigations.

