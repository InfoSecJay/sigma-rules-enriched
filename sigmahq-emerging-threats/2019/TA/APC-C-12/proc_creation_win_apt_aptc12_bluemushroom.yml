note: |
  ### Technical Context
  This detection rule is designed to identify the usage of `regsvr32` to load DLL files from the AppData Local directory, which may indicate a potential APT-C-12 BlueMushroom attack. Attackers often leverage this method to execute malicious DLLs without raising significant alarm, as legitimate system processes like `regsvr32` are used. The likely objective of such an attack is to establish persistence on compromised systems or to facilitate further attacks within the network while avoiding traditional security measures.

  The relevant MITRE ATT&CK tactics for this activity include **Defense Evasion** (TA0005) and the specific technique of **Signed Binary Proxy Execution** (T1218.010), which encompasses the misuse of trusted system binaries for executing malicious payloads. The primary data sources to monitor for this detection will be **process creation events** from Windows systems, which log the execution of applications and their command lines.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events for instances of `regsvr32` being executed, especially those where command lines display DLLs located within the AppData Local directory.
  - **Analyze Command Line Arguments:** Inspect the command line arguments for any suspicious entries, particularly those that involve unexpected DLL names or usage of `DllEntry`.
  - **Correlate with User Activity:** Check the user account associated with the execution of `regsvr32`. Ensure that the account is authorized to perform such actions and investigate if there are any known signs of compromise or anomalous behavior.
  - **Inspect System Integrity:** Look for additional artifacts that may indicate compromise, such as unexpected files in the AppData Local directory or unusual outbound connections shortly following the execution of the detected command.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to the potential for significant enterprise impact if the activity is associated with an advanced persistent threat, which may lead to data breaches, lateral movement, or further exploitation within the network.

  ### Blind Spots and Assumptions
  One important blind spot is the potential for legitimate administrative tasks that may involve the use of `regsvr32`, which could result in false positives. The detection logic assumes that all `regsvr32` executions from the AppData Local directory are malicious without distinguishing between benign and malicious activity. Additionally, for the alert to function correctly, it is crucial that process creation logging is adequately configured and that command line arguments are not truncated in the logs.

