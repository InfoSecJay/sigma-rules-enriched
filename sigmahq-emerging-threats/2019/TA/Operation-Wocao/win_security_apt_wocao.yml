level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts by adversaries to leverage the `checkadmin.exe` tool for enumerating local administrator accounts within a Windows environment. The likely attacker objective is to gain intelligence about local user privileges, potentially as a preliminary step in obtaining elevated access or compromising critical systems. The related MITRE ATT&CK tactics and techniques include Privilege Escalation (T1068) and Discovery (T1012).

  Primary telemetry sources involve Windows Security Logs, specifically focusing on Event ID 4799, which captures events related to local group membership changes. The malicious impact includes unauthorized access to sensitive data and system control, especially if administrative accounts are targeted and leveraged. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative tasks can also invoke this activity.

  ### Investigation Steps

  - **Identify the context of the alert: Check Event ID 4799 for the targeted administrator username**: Review the "Target User Name" field for entries starting with "Administr" to determine the specific accounts under scrutiny.

  - **Review the process calling the enumerator: Examine the Caller Process Name field in the logs**: Confirm that the process name matches `checkadmin.exe`. If found running from a non-standard location, this could indicate suspicious activity.

  - **Correlate with other logs: Cross-reference activity with Windows Security Event ID 4624 (Logon)**: Match timestamps of the alert with successful logon events to establish whether the action correlates with an authorized administrator session.

  - **Determine expected legitimate usage: Assess known administrative functions**: Understand that `checkadmin.exe` may be utilized by authorized personnel as part of standard operating procedures, particularly within systems designated for administrative tasks.

  - **Identify signs of potential adversarial behavior: Look for unusual patterns around the use of `checkadmin.exe`**: If the event occurs during non-business hours or on systems not typically accessed by known administrators, this can indicate malicious intent.

  - **Assess system criticality: Note the role of the affected asset**: Investigate assets with elevated privileges (e.g., domain controllers, management servers) as they are more critical and likely targets for privilege escalation.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive systems and accounts. The likelihood of malicious abuse is significant, given that attackers often target local administrators to gain footholds on critical infrastructure. Such behavior is commonly weaponized in adversarial tactics, making swift investigation essential.

  ### Blind Spots and Assumptions

  This detection may miss logins from local administrator accounts that do not utilize `checkadmin.exe`. Additionally, successful execution can occur in environments lacking complete or proper logging configurations, leading to gaps in visibility. Legitimate activity, such as internal audits or assessments by authorized users, can also trigger this alert. A companion detection to enhance coverage is monitoring for Windows Security Event ID 4672, which indicates special privileges assigned to a logon, corroborating elevated access attempts.

