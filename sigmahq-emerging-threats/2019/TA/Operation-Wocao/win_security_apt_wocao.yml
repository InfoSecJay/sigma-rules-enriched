note: |
  ### Technical Context
  This detection rule identifies potential malicious activities associated with the Operation Wocao group, connected to Chinese cyber espionage efforts. The primary focus is on identifying enumeration tactics used to gather information about local system administrators through the `checkadmin.exe` tool. Attackers may aim to compromise systems by exploiting administrative credentials or gathering sensitive information to facilitate lateral movement within networks.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Discovery** (TA0007): Gaining knowledge about the system and environment.
  - **User Group Enumeration** (T1012): Checking local user accounts to identify privileged users.
  - **Defense Evasion** (TA0005): Using legitimate tools or processes to avoid detection.
  - **Office Application Startup** (T1053.005): Malicious execution through legitimate system processes.
  - **PowerShell** (T1059.001): Possible use of PowerShell for executing commands or scripts.

  Primary data sources for this detection are Windows security event logs, specifically focusing on Event ID 4799, which captures local group memberships and administrative changes.

  ### Investigation Steps
  - **Review Event Logs:** Check Windows Security Event logs for Event ID 4799 associated with `Administr` group modifications to identify potential abuse of privileges.
  - **Examine Process Execution:** Investigate the execution of `checkadmin.exe` for the associated user and correlating events indicating other suspicious behavior or execution patterns.
  - **Assess User Permissions:** Analyze the permissions and access rights of the `Administr` users listed to determine if any unauthorized changes have occurred recently or if any anomalous accounts have elevated privileges.
  - **Correlate with Other Activities:** Look for additional logs that might indicate suspicious behavior, such as unusual PowerShell command usage or deviations in network traffic patterns during the timeframe of this activity.

  ### Prioritization
  This alert is prioritized as high due to the potential severe impact that local administrative access can have for an enterprise environment. The likelihood of attackers using these enumeration tactics to exploit further vulnerabilities increases the urgency of the response.

  ### Blind Spots and Assumptions
  This detection logic may miss cases where the tool `checkadmin.exe` is used for legitimate administrative purposes, potentially leading to false positives. Additionally, there may be gaps in detection if not all instances of the executable are logged or if logging is not enabled for event ID 4799. It assumes that systems are configured to log security events consistently, particularly those related to user group modifications. Without such logging, the rule may fail to capture relevant evidence.

