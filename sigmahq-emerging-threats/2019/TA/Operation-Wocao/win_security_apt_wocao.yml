note: |
  ### Technical Context

  This Sigma rule detects the execution of a specific process, `checkadmin.exe`, used to enumerate local administrator accounts on Windows systems. Likely attacker objectives include privilege escalation and reconnaissance, allowing unauthorized users to identify potential targets for further exploitation. This behavior is related to the MITRE ATT&CK techniques for **Privilege Escalation (T1068)** and **Access Token Manipulation (T1134)**.

  The primary telemetry source is Windows Security logs, specifically Security Event ID 4799, which records account enumeration activities. If the detected activity is malicious, it could lead to unauthorized access or control over sensitive systems. However, this detection alone does not confirm malicious intent, as legitimate administrators may also utilize `checkadmin.exe` for valid purposes.

  ### Investigation Steps

  - **Validate logged executions of `checkadmin.exe`:** Check for Security Event ID 4799 and filter by CallerProcessName ending with `\checkadmin.exe`. Verify the context of execution—was it initiated by an administrator, or does it appear anomalous for non-admins?

  - **Cross-reference target usernames:** Examine the logs to see if the target usernames starting with "Administr" align with known user accounts. Legitimate activity may involve mainly the built-in Admin account, while unusual accounts could indicate malicious intent.

  - **Review process lineage:** Utilize Sysinternals Process Explorer or equivalent to investigate the parent process of `checkadmin.exe`. Malicious instances may have unusual parent processes; legitimate usage typically stems from known administrative tools or sessions.

  - **Check for unusual login patterns:** Review relevant Windows Security logs for logon events (Event ID 4624) preceding or following the execution of `checkadmin.exe`. Look for logins from non-standard locations or accounts not usually employed for administration tasks.

  - **Assess asset criticality:** Determine the role of the host where the detection occurred. Critical assets (e.g., domain controllers or sensitive servers) being targeted by this application warrants a higher priority investigation.

  - **Validate legitimate use cases:** Investigate documented tools within your environment that legitimately use `checkadmin.exe`. Cross-check against known and legitimate administrative activities to differentiate between benign and suspicious behaviors.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact on critical systems and the high likelihood of abuse for privilege escalation. Attackers often exploit administration tools like `checkadmin.exe` to gather intelligence or execute further attacks, making it essential to respond quickly.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through renaming the executable or using alternative enumeration tools that may lack similar logging. Ensure Windows Security event logging is properly configured to capture all relevant activities. Some legitimate usages of `checkadmin.exe` for administrative oversight could trigger this alert, but it’s important to account for the context of execution. A companion detection could include monitoring for Event ID 4624 logon events, which would enhance visibility into the account activity related to the `checkadmin.exe` execution.

