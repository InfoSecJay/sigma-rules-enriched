note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity associated with the use of the `checkadmin.exe` tool, particularly when it's invoked by users with administrative privileges. The rule aims to uncover unauthorized attempts to enumerate local administrator accounts within an enterprise environment. Such enumeration is a common tactic used by threat actors to gather information that can be leveraged for further exploitation, such as privilege escalation or lateral movement.

  The likely attacker objective is to identify accounts with elevated privileges, which may be leveraged to gain deeper access into an organization's infrastructure. This activity could be linked to the Operation Wocao threat group, which has been known to engage in similar tactics. Relevant MITRE ATT&CK techniques include:
  - **T1012**: Query Registry
  - **T1069**: Permission Groups Discovery
  - **T1036.004**: Masquerading - Rename System Utilities
  - **T1027**: Obfuscated Files or Information
  - **T1059.001**: Command and Scripting Interpreter - PowerShell
  - **T1053.005**: Scheduled Task/Job - Scheduled Task
  - **Attack Persistence**: Leveraging administrative access for maintaining persistence.

  Primary data sources for this detection would include Windows Security logs, specifically Event ID 4799, which captures changes in user account properties, and could indicate attempts to adversarially query local administrator privileges.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Security logs for Event ID 4799 that match the indicators defined in the detection rule, focusing on the `CallerProcessName` and `TargetUserName` fields.
  - **Analyze User Activity**: Investigate the user activity of the identified account—check for any unusual or suspicious login times, locations, or other behaviors that deviate from normal activity patterns.
  - **Correlate with Process Logs**: Utilize process creation event logs to establish a timeline of the execution of `checkadmin.exe`, looking for any accompanying processes that suggest coordinated attack behavior or lateral movement.
  - **Inspect Administrative Privileges**: Perform an audit of the local administrator accounts on the affected systems to determine if any unauthorized changes or additions were made that may suggest compromise or misuse of administrative privileges.

  ### Prioritization
  This alert is categorized as high severity due to the potential impact of unauthorized administrative access in an enterprise environment. The likelihood of threat actors leveraging such information for further exploitation necessitates prompt investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Event ID 4799 logging is not enabled or if other non-malicious uses of `checkadmin.exe` are commonplace in the environment, resulting in false positives. The detection logic assumes that administrative user actions are typically well-logged and that `checkadmin.exe` is not frequently used in legitimate administrative activities. Ensuring full logging capabilities for Windows Security events and monitoring for the expected operation of administrative tools are essential for effective detection.

