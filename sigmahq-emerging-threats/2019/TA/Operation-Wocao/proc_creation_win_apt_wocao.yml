logsource:
  category: process_creation
  product: windows
  definition: The 'System Security Extension' audit subcategory need to be 
    enabled to log the EID 4697
detection:
  selection:
    CommandLine|contains:
    - 'checkadmin.exe 127.0.0.1 -all'
    - 'netsh advfirewall firewall add rule name=powershell dir=in'
    - 'cmd /c powershell.exe -ep bypass -file c:\s.ps1'
    - '/tn win32times /f'
    - 'create win32times binPath='
    - '\c$\windows\system32\devmgr.dll'
    - ' -exec bypass -enc JgAg'
    - 'type *keepass\KeePass.config.xml'
    - 'iie.exe iie.txt'
    - 'reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\'
  condition: selection
falsepositives:
- Administrators that use checkadmin.exe tool to enumerate local administrators
level: high
note: |
  ### Technical Context

  This Sigma rule detects specific command-line activities indicative of lateral movement, privilege escalation, and persistence mechanisms often associated with the Operation Wocao adversary group. The likely attacker objective includes establishing footholds in the environment, maintaining persistence, and querying sensitive information. Relevant MITRE ATT&CK tactics and techniques include Credential Dumping (T1003), Access Token Manipulation (T1134), and Scheduled Task Creation (T1053.005). The primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1. If malicious, this activity can enable unauthorized access and manipulation of critical systems and information. It is essential to note that this detection does not confirm a successful compromise by itself, as benign uses of the involved commands can also occur.

  ### Investigation Steps

  - **Analyze Process Creation Logs:**
    Review Security Event ID 4688 for the specific command lines that triggered the alert, focusing on entries containing the phrases listed in the detection criteria. Look for unusual parent processes indicating potential malicious execution.

  - **Investigate User Context:**
    Identify the user account that executed the detected commands. Check for any unusual patterns in user activity or whether the user typically employs these tools, which may indicate legitimate administrative actions.

  - **Check for High-Confidence Malicious Indicators:**
    Specifically look for command-line entries like `powershell.exe -ep bypass -file c:\s.ps1` and `cmd /c powershell.exe -ep bypass -file c:\s.ps1`. These suggest potentially malicious script execution and require deep scrutiny.

  - **Review Scheduled Tasks:**
    If the alert includes `create win32times binPath=`, examine scheduled tasks (Event ID 4698) for unexpected or suspicious tasks created by the user, focusing on the context of the paths and executables specified.

  - **Confirm Legitimate Activity:**
    Validate if the same command patterns are common in your environment. For example, document normal administrative usage of `checkadmin.exe` by administrators for enumerating local admin users, noting if that practice aligns with current alerts.

  - **Assess Network Traffic:**
    Correlate with network logs, focusing on any outbound connections initiated by the affected system, particularly connections after command executions that could indicate data exfiltration or command and control communication.

  ### Prioritization

  The severity of this alert is high due to the potential impact on critical systems, as it suggests activity typical of advanced adversaries aiming for long-term persistence. The likelihood of malicious abuse is elevated given the context of Operation Wocao and previously observed behaviors. This type of command execution is commonly weaponized in the cyberattack landscape, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  There are limitations in detecting obfuscation methods that attackers may employ to disguise their activities. Ensure that process creation logging is correctly configured to capture these events. Legitimate administrative activities, such as using `checkadmin.exe` for privileged user enumeration, may trigger similar alerts, complicating detection efforts. A related detection to strengthen coverage includes monitoring for unusual Powershell commands and scripts being executed that may complement this alert.

