logsource:
  category: process_creation
  product: windows
  definition: The 'System Security Extension' audit subcategory need to be enabled
    to log the EID 4697
detection:
  selection:
    CommandLine|contains:
    - 'checkadmin.exe 127.0.0.1 -all'
    - 'netsh advfirewall firewall add rule name=powershell dir=in'
    - 'cmd /c powershell.exe -ep bypass -file c:\s.ps1'
    - '/tn win32times /f'
    - 'create win32times binPath='
    - '\c$\windows\system32\devmgr.dll'
    - ' -exec bypass -enc JgAg'
    - 'type *keepass\KeePass.config.xml'
    - 'iie.exe iie.txt'
    - 'reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\'
  condition: selection
falsepositives:
- Administrators that use checkadmin.exe tool to enumerate local administrators
level: high
note: |
  ### Technical Context
  This detection rule identifies potential indicators of compromise associated with the malicious activities of Operation Wocao, a threat group linked to Chinese cyber espionage. The rule focuses on the execution of specific commands that reflect reconnaissance, persistence, and lateral movement activities. Attackers leveraging these commands may seek to enumerate system states, manipulate firewall rules, or establish persistence through the Windows Task Scheduler.

  The detected activities align with several MITRE ATT&CK tactics and techniques, including:
  - **Reconnaissance** (T1087): Searching for valuable data or system configurations.
  - **Privilege Escalation** (T1068): Gaining elevated permissions through exploitation.
  - **Defense Evasion** (T1203): Bypassing security mechanisms to execute malicious scripts or commands unnoticed.
  - **Execution** (T1059): Running scripts or binaries which could facilitate further compromise.

  Primary logging sources for this detection include process creation events on Windows, which allow monitoring executed commands and their associated arguments, as well as potentially relevant Windows event logs related to task scheduling and system security.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for the execution of commands that match the specified patterns in the detection logic, particularly for any instances of `powershell.exe` with the `-ep bypass` option.
  - **Inspect Security Event Logs**: Examine Windows Event ID 4697 logs for any creations of scheduled tasks, especially those that might have unusual binPath values or point to suspicious binaries such as `devmgr.dll`.
  - **Examine Network Traffic**: Check for any connections made to `127.0.0.1` that could be related to `checkadmin.exe`, ensuring that it aligns with legitimate administrative activity and isn’t indicative of lateral movement or unauthorized enumeration.
  - **Investigate Firewall Rule Changes**: Scrutinize changes to Windows Firewall configurations, particularly any rules added via `netsh advfirewall`, to determine if they were created legitimately or as part of an attack.

  ### Prioritization
  The high severity of this alert is due to the significant potential impact of such reconnaissance and persistency attempts by advanced threat actors. Given the likelihood of successful exploitation leading to data exfiltration, the activity must be prioritized for immediate investigation in an enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where legitimate administrative users employ similar commands for benign purposes, which could lead to false positives. Additionally, it relies on the assumption that Windows auditing for process creation and security events has been properly configured and enabled, particularly encryption policies. Without comprehensive logging capturing all process creation events, detection might be incomplete, leaving organizations vulnerable to undetected lateral movements or privilege escalations.

