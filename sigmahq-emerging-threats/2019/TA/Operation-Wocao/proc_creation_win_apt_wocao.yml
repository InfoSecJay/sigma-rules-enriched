detection:
  selection:
    CommandLine|contains:
    - 'checkadmin.exe 127.0.0.1 -all'
    - 'netsh advfirewall firewall add rule name=powershell dir=in'
    - 'cmd /c powershell.exe -ep bypass -file c:\s.ps1'
    - '/tn win32times /f'
    - 'create win32times binPath='
    - '\c$\windows\system32\devmgr.dll'
    - ' -exec bypass -enc JgAg'
    - 'type *keepass\KeePass.config.xml'
    - 'iie.exe iie.txt'
    - 'reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\'
  condition: selection
falsepositives:
- Administrators that use checkadmin.exe tool to enumerate local administrators
level: high
note: |
  ### Technical Context
  This detection rule targets suspicious activity related to a Chinese hacking group known as "Operation Wocao." The rule specifically monitors for command-line usage patterns that correlate to the tools and techniques used in this group's operations. A threat actor leveraging these commands could aim to gain unauthorized access, maintain persistence, or execute malicious scripts within a target environment, highlighting a risk of privilege escalation and defense evasion tactics.

  Relevant MITRE ATT&CK techniques associated with this activity include:
  - **T1059.001 - PowerShell**: Utilizing PowerShell scripts to execute commands.
  - **T1012 - Query Registry**: Extracting sensitive information from the registry.
  - **T1036.004 - Masquerading: Match Legitimate Name or Location**: Using filenames that mimic legitimate applications to deceive detection mechanisms.
  - **T1053.005 - Scheduled Task/Job: Scheduled Task**: Creating or modifying scheduled tasks for persistence.

  The primary data sources for detection include Windows process creation logs, which provide insights into executed commands, command-line arguments, and the identities of users who ran them.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of the suspicious command lines specified in the detection rule to identify any unauthorized execution attempts.

  - **Collect Network Traffic Data**: Examine outbound connections related to the processes identified, particularly those instructing network configuration changes (e.g., netsh commands) to detect potential data exfiltration or command and control.

  - **Inspect Active Directory (AD) Events**: Look for any changes or queries that indicate privilege escalation attempts, particularly regarding group memberships and administrative changes that may align with Wocao tactics.

  - **Validate Scheduled Tasks**: Check for newly created or modified scheduled tasks that correspond with the findings, especially those that execute PowerShell scripts or run Windows binaries from unusual locations.

  ### Prioritization
  The alert is classified as high severity due to its association with advanced persistent threats that focus on privilege escalation and potential long-term access to sensitive systems. The probability of successful exploitation increases when these tactics are observed in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection if certain execution contexts (e.g., local administrator activity or legitimate use of the mentioned tools) are not adequately monitored, as the detection logic relies heavily on specific command-line patterns. Additionally, if the logging for the ‘System Security Extension’ is not enabled across Windows hosts, alerts may be missed. The assumption is that the commands listed are benign under normal operational circumstances, leading to potential false positives that analysts must manually investigate.

