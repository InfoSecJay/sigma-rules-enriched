detection:
  selection:
    CommandLine|contains:
    - 'checkadmin.exe 127.0.0.1 -all'
    - 'netsh advfirewall firewall add rule name=powershell dir=in'
    - 'cmd /c powershell.exe -ep bypass -file c:\s.ps1'
    - '/tn win32times /f'
    - 'create win32times binPath='
    - '\c$\windows\system32\devmgr.dll'
    - ' -exec bypass -enc JgAg'
    - 'type *keepass\KeePass.config.xml'
    - 'iie.exe iie.txt'
    - 'reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\'
  condition: selection
falsepositives:
- Administrators that use checkadmin.exe tool to enumerate local administrators
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects specific command-line behaviors associated with the Operation Wocao hacking group, which includes misuse of tools related to privilege escalation, persistence, and discovery on Windows systems. The likely attacker objective is to establish persistence, enumerate user access, and potentially deploy malicious payloads. This detection maps to multiple MITRE ATT&CK techniques, specifically T1012 (Query Registry), T1059.001 (PowerShell), T1036.004 (Masquerading), and T1053.005 (Scheduled Task/Job).

  The primary telemetry sources include Windows Security Event ID 4688 (process creation) and Event ID 4697 (service creation), which require the 'System Security Extension' audit subcategory to be enabled. If malicious, the impact could be severe, potentially leading to data theft or system compromise. This detection does NOT confirm malicious intent by itself; legitimate administrative tool use may generate similar events.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine Windows Security Event ID 4688 for command-line arguments matching the rule's patterns (e.g., `checkadmin.exe`, `powershell.exe -ep bypass`). Benign use of `checkadmin.exe` will often originate from administrative user sessions on endpoints.

  - **Check service creation events:** Investigate Windows Security Event ID 4697 for any unusual creation of services that reflect the suspicious behavior outlined in the rule, such as creating services with unusual `binPath` values or associated with `devmgr.dll`.

  - **Cross-verify with user activity:** Look into the associated user accounts in the event logs to gauge whether the actions were taken by expected administrative users or under anomalous circumstances (e.g., unusual login times or locations).

  - **Examine file creation artifacts:** Validate the presence of files (c:\s.ps1 and others) associated with the command-line arguments, checking for unusual file creation activities or scripting artifacts by accessing file creation logs.

  - **Identify legitimate admin activities:** Confirm whether the listed command contexts have been executed as part of routine administrative operations, such as management of Windows firewall rules, by retrieving relevant change history and talking to respective administrators.

  - **Look for misleading indicators:** Verify if commands related to `reg query` targeting `HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\` were executed by users with known secure intentions, as they could suggest legitimate administrative tasks rather than malicious enumeration.

  ---

  ### Prioritization

  The alert severity is high due to the significant security implications of successful exploitation associated with the affected system, particularly if it involves domain controllers or critical infrastructure. The likelihood of malicious abuse is high, given that the tactics employed are often weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through alternative command execution methods or encoded payloads to bypass detection. Reliable detection depends on enabling system security event auditing configured correctly to log necessary events. Legitimate administrative tasks utilizing similar commands may inadvertently trigger alerts. A companion detection focused on scheduled tasks (T1053.005) can provide additional context to improve detection efficacy.

