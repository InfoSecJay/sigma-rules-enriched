detection:
  selection_xcopy:
    CommandLine|contains|all:
    - 'xcopy /S /E /C /Q /H \\\\'
    - '\sysvol\'
  selection_adexplorer:
    CommandLine|contains|all:
    - 'adexplorer -snapshot "" c:\users\'
    - '\downloads\'
    - '.snp'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule targets potential credential theft activities associated with Russian APT groups, specifically as detailed in the Global Threat Report 2019 by CrowdStrike. The rule is designed to identify suspicious command-line activities, particularly the use of `xcopy` and `adexplorer` that indicate attempts to exfiltrate sensitive credential-related information. Attackers involved in this activity may aim to gather data from Active Directory environments, which can lead to account takeover and enable further lateral movement within the target network.

  The relevant MITRE ATT&CK tactics/techniques associated with this detection include:
  - **Credential Access** (TA0006)
    - **T1552.001**: Credentials from Password Stores
    - **T1003.003**: Credential Dumping: Windows Security Accounts Manager (SAM)

  Primary data sources that will provide the best evidence for this detection include:
  - Process creation events from Windows systems, capturing command-line arguments that could reveal malicious intent and operations in real-time.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the Windows process creation logs to find instances of the `xcopy` command, particularly those targeting network paths or sensitive directories like `\sysvol\`. Look for unusual or unauthorized user accounts performing these actions.
  - **Investigate `adexplorer` Usage**: Validate any instances of `adexplorer` commands within the process creation logs, focusing on the use of snapshots and the directories they are accessing, particularly if users are attempting to snapshot credential stores.
  - **Cross-Reference User Activity**: Check the user accounts associated with the detected command executions against typical usage patterns. Identify whether any of these accounts are unusual or have recently been compromised.
  - **Evaluate Network Traffic**: If possible, inspect network logs for unusual outbound connections that could coincide with the detected command executions, potentially indicating data exfiltration activities.

  ### Prioritization
  Given the critical level of this detection, the potential impact of credential theft is high, with a significant likelihood of further malicious activities, including account takeover and unauthorized access to critical systems within the enterprise environment.

  ### Blind Spots and Assumptions
  This detection may have blind spots, particularly in environments that do not have comprehensive logging enabled for process creation events or where command-line auditing is disabled. The logic assumes that the specific command patterns associated with credential theft will be present and does not account for variations in command usage or obfuscation techniques used by attackers. To ensure proper functioning of this alert, Windows process creation logging must be enabled, along with the necessary security controls to capture detailed command-line arguments.

