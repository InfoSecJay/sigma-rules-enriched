detection:
  selection_xcopy:
    CommandLine|contains|all:
    - 'xcopy /S /E /C /Q /H \\\\'
    - '\sysvol\'
  selection_adexplorer:
    CommandLine|contains|all:
    - 'adexplorer -snapshot "" c:\users\'
    - '\downloads\'
    - '.snp'
  condition: 1 of selection_*
