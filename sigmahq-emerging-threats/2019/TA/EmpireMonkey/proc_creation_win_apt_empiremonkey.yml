note: |
  ### Technical Context
  This detection rule identifies potential activity associated with the EmpireMonkey Advanced Persistent Threat (APT), which is known for its sophisticated tactics in executing malicious payloads. EmpireMonkey employs various execution techniques, including scripting and batch file executions, to compromise target systems stealthily. The primary objective of attackers using EmpireMonkey is often to exfiltrate sensitive data or establish persistent access within the environment.

  The relevant MITRE ATT&CK tactics and techniques for this detection are "Defense Evasion" (TA0005) and "Scripting" (T1218.010). These techniques are indicative of an adversary attempting to mask their activity in a legitimate and difficult-to-detect manner. The best sources of telemetry for detecting this behavior include process creation events, particularly those that capture command lines executed on Windows systems. By monitoring these events, analysts can identify unusual execution patterns indicative of malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check Windows process creation logs for instances of commands containing '/e:jscript' and references to temp files like '\Local\Temp\Errors.bat'. This can provide immediate insights into potential malicious activities.

  - **Correlate with Other Logs:** Cross-reference findings with other telemetry sources, such as Windows Event Logs and Application logs, to identify if these processes were spawned from suspicious parent processes or were associated with known malicious indicators.

  - **Check for Persistence Mechanisms:** Investigate any additional persistence strategies employed by EmpireMonkey, such as scheduled tasks or registry modifications, that may follow initial execution.

  - **Analyze Network Traffic:** Examine outbound network connections from the compromised host for signs of data exfiltration or communication with known malicious command-and-control infrastructure.

  ### Prioritization
  Given the high potential impact of APT activities like those from EmpireMonkey, alerts generated by this detection should be prioritized as high severity. The likelihood of serious data breaches and possible wide-scale compromise in an enterprise environment justifies this classification.

  ### Blind Spots and Assumptions
  This detection rule may not capture all variants of EmpireMonkey activity, as attackers continually adapt their techniques to bypass detection. It assumes that the execution of specific command line patterns correlates directly with malicious intent, which may not always be accurate in every environment. Additionally, effective detection requires proper logging configurations for process creation events. Organizations must ensure that detailed process logging is enabled to support this rule's efficacy.

