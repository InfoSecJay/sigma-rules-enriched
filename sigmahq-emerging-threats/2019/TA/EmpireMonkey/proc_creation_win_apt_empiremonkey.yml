note: |
  ### Technical Context

  This rule detects potentially malicious activity associated with the EmpireMonkey APT actor, specifically the execution of scripts with specific command-line arguments indicating potentially evasive or stealthy tactics. The likely attacker objective is to execute payloads that may lead to further exploitation, lateral movement, or data exfiltration without detection. This behavior aligns with the MITRE ATT&CK technique T1218.010 (Signed Binary Proxy Execution).

  The primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1. If the detected behavior is indeed malicious, the security impact could be significant, potentially leading to the compromise of sensitive systems or data. However, this detection does NOT confirm that malicious activity has occurred on its own; it merely highlights suspicious command-line usage that warrants further investigation.

  ### Investigation Steps

  - **Review Process Creation Logs**: Check for Security Event ID 4688 and/or Sysmon Event ID 1. Look specifically for the presence of command-line arguments containing '/e:jscript' and the path '\Local\Temp\Errors.bat'. Legitimate usage of bat scripts should not normally include these parameters.

  - **Analyze Command Parent Process**: Investigate the parent process of the detected command to identify how it was initiated. For example, normal usage of command prompts or PowerShell should not spawn processes containing these arguments in the command line.

  - **Confirm File Existence and Content**: Verify the presence and content of the file located at '\Local\Temp\Errors.bat'. Legitimate files in this location should not contain executable payloads or unexpected script content.

  - **Check Recent Execution History**: Investigate any recent execution history related to the user or system that triggered the alert. Cross-reference with Event ID 4688 for other suspicious process creations within a 5-minute window to identify possible lateral movement.

  - **Validate User Context**: Examine the user context under which the suspicious process was executed. Legitimate user actions, especially for administrative accounts, should have corresponding business activity, such as software installs or maintenance tasks.

  - **Baseline Legitimate Activity**: Document and compare against known legitimate scripts or scheduled tasks within your environment that utilize similar command structures. Ensure expected operational workflows don't involve unauthorized script execution.

  ### Prioritization

  This alert is considered high priority due to the significant potential impact of an APT activity on critical enterprise systems. The likelihood of malicious abuse is elevated given the interest from documented threat actors like EmpireMonkey. Furthermore, the patterns observed in this alert are characteristic of typically weaponized techniques for stealthy infiltration or lateral movement.

  ### Blind Spots and Assumptions

  This detection may have limitations due to the use of obfuscation techniques or alternative script execution methods that bypass standard detection. Reliable detection depends on monitoring and configuration of process creation logs (including Sysmon and Windows Event logs) for detailed insights. Additionally, legitimate administrative tasks or malware testing may inadvertently trigger alerts, necessitating further investigation into the context of the event. A companion detection could include looking for unusual outbound connections from processes spawned under this suspicious tree, particularly towards known malicious IPs or domains.

