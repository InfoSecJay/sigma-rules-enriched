note: |
  ### Technical Context
  This detection rule identifies potential command and control (C2) communications associated with the Equation Group, specifically targeting IP addresses leaked by the Shadow Brokers. By monitoring firewall logs for outbound and inbound connections to known malicious IPs, the rule helps security analysts detect compromised systems that may be participating in a larger attack or data exfiltration campaign.

  The Equation Group, believed to be linked to the NSA, employs sophisticated techniques to establish persistent access to targeted networks, allowing for cyber-espionage or disruption of operations. The attacker’s objectives often include data exfiltration, reconnaissance, and maintaining a foothold within the target environment.

  Relevant MITRE ATT&CK tactics include:
  - Command and Control (TA0011)
  - Exfiltration Over Command and Control Channel (T1041)

  The primary data source for this detection is firewall logs, which will show any communications to the specific IP addresses tied to the threat actors.

  ### Investigation Steps
  - **Review Firewall Logs**: Check firewall logs for any outbound or inbound connections to the specified IP addresses ('69.42.98.86' and '89.185.234.145'). Look for unusual traffic patterns or volumes that stand out from normal operations.

  - **Analyze Host Activity**: Investigate the source and destination systems involved in the communications. Gather additional context from EDR solutions to identify any malware or unauthorized software that may facilitate C2 relations.

  - **Correlate with Other Logs**: Cross-reference the detected connections with proxy logs, DNS queries, and VPN logs to uncover other potential related activity. Seek any unusual patterns or transfer of large data sets coinciding with the identified IP affiliations.

  - **Perform Threat Intelligence Lookup**: Utilize threat intelligence feeds to gather more information about the identified IP addresses. Determine if further malicious associations are documented and if any known Indicators of Compromise (IoCs) are present within your network.

  ### Prioritization
  The alert's severity is high due to the critical nature of C2 communications, which can signify an active compromise within the environment. The likelihood of exploitation from established adversaries at this level, such as the Equation Group, necessitates immediate investigation to mitigate potential data loss or network integrity compromise.

  ### Blind Spots and Assumptions
  This detection rule is limited to the specific IPs mentioned; any new or altered C2 infrastructure used by the Equation Group may evade detection. The rule assumes that firewall logs are properly configured and collected without gaps in data retention. If these logs are not available or if there are misconfigurations in the firewall, this detection will not be effective. Properly enabling logging for all relevant traffic patterns is crucial for monitoring potential adversarial communications.

