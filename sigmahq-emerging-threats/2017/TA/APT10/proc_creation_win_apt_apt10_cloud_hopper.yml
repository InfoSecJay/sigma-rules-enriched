detection:
  selection_cscript:
    Image|endswith: '\cscript.exe'
    CommandLine|contains: '.vbs /shell '
  selection_csvde:
    CommandLine|contains|all:
    - 'csvde -f C:\windows\web\'
    - '.log'
  condition: 1 of selection_*
