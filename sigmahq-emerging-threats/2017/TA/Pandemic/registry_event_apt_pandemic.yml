note: |
  ### Technical Context

  This Sigma rule detects modifications to a specific Windows registry key associated with the Pandemic malware implant, particularly targeting the service instance at `\SYSTEM\CurrentControlSet\services\null\Instance`. The likely attacker objective is to establish persistence on the compromised system for command-and-control communications. This behavior maps to the MITRE ATT&CK technique T1105 (Ingress Tool Transfer) under the Command and Control tactic.

  The primary telemetry source for detection is Windows registry event logs. Monitoring this registry key modification indicates potential unauthorized access with significant impact, including data theft or further lateral movement within the network. It is essential to note that detection of this registry modification does NOT confirm active malicious behavior on its own; further investigation into the context and intentions behind the change is necessary.

  ### Investigation Steps

  - **Examine registry modifications:** Check Windows Security Event ID 4657 for modifications to the registry key `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\services\null\Instance`. Look for changes made by unexpected or non-administrative users, which may indicate malicious activity.

  - **Identify service state:** Use Sysinternals’ `ProcMon` or Windows Event ID 7045 to inspect the current state of services for any running processes related to the modified registry key. A legitimate service should not reference `null`, and any unexpected presence could be considered malicious.

  - **Review recent activities:** Check the security log for Event ID 4688 to analyze the process creation activity around the time of the registry modification. Look for unexpected process launches by non-system users that reference unknown executables.

  - **Correlate with C2 indicators:** Validate outbound network connections associated with the affected system against known command-and-control IPs or domains, using firewall or proxy logs. Look for anomalous behavior post-registry modification indicating potential exfiltration or command execution.

  - **Establish baseline behavior:** Compare current registry and service settings against a known good baseline for the asset in question. Legitimate services and operating states should reflect expected configurations established during setup.

  ### Prioritization

  This alert should be treated as critical due to its association with advanced persistent threats. The behavior indicates a potential compromise of a system that could lead to further exploitation. The targeting of specific registry keys by malware is a known tactic for maintaining persistence and command-and-control capabilities, which increases the likelihood of abuse.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by configurations that do not log all registry modifications or by systems with disabled Auditing features. Legitimate software updates or configurations may also alter this registry key. Monitoring for related behaviors, such as the execution of known malware signatures, can reinforce detection strategies against this threat.

