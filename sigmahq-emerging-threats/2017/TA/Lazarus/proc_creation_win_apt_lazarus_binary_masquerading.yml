title: Lazarus System Binary Masquerading
id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
status: test
description: Detects binaries used by the Lazarus group which use system names but
  are executed and launched from non-default location
references:
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/07180244/Lazarus_Under_The_Hood_PDF_final.pdf
author: Trent Liffick (@tliffick), Bartlomiej Czyz (@bczyz1)
date: 2020-06-03
modified: 2023-03-10
tags:
- attack.defense-evasion
- attack.t1036.005
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\msdtc.exe'
    - '\gpsvc.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where binaries associated with the Lazarus group are executed while masquerading as legitimate system processes. Specifically, it focuses on binaries named `msdtc.exe` and `gpsvc.exe`, which are typically found in the `C:\Windows\System32` or `C:\Windows\SysWOW64` directories, but are launched from non-standard locations. This method of deception is often employed by threat actors to evade detection and maintain persistence within a compromised environment.

  The primary objective of such behavior is to execute malicious code while leveraging trusted process names, thereby obscuring the attack from defensive measures and security personnel. The Lazarus group is known for its sophisticated cyber-espionage operations, and impersonating legitimate binaries helps them achieve their goals while minimizing the likelihood of detection. This activity falls under the MITRE ATT&CK tactics of **Defense Evasion** and the technique **Masquerading** (T1036.005).

  Relevant telemetry for this detection primarily comes from process creation events, which will indicate when and from where these binaries are executed, allowing analysts to assess whether they originate from suspicious locations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events to identify any instances of `msdtc.exe` or `gpsvc.exe` being executed from unusual directories that deviate from the normal `System32` or `SysWOW64` paths.

  - **Validate Binary Integrity**: Confirm the hashes of the detected binaries against a known good source. This can help ascertain whether the binaries have been modified or replaced with malicious variants.

  - **Check System Log for Anomalies**: Investigate surrounding events in the system logs leading to and following the execution of the suspicious binaries to identify any related malicious activity or lateral movement.

  - **Conduct File Path Analysis**: Document the file paths from which these executables were run. Pay special attention to any patterns of execution, such as processes being executed from user directories, temporary folders, or other non-standard locations.

  ### Prioritization
  The alert is considered high-severity due to the potential for significant impact; the Lazarus group is known for targeting sensitive information and conducting large-scale intrusions, which poses a serious risk to enterprise environments. Additionally, the likelihood of such evasion techniques being employed increases given the group's capabilities.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage since this rule specifically targets a select few binaries and may not account for other mimicked processes. The detection logic assumes that malicious actors will execute known binaries under their typical names; however, they may also use obfuscation techniques or completely different names. For the alert to function effectively, comprehensive logging must be enabled for process creation events to provide the required visibility into system behaviors.

