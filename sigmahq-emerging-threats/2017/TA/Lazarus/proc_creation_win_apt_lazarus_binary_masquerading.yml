title: Lazarus System Binary Masquerading
id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
status: test
description: Detects binaries used by the Lazarus group which use system names 
  but are executed and launched from non-default location
references:
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/07180244/Lazarus_Under_The_Hood_PDF_final.pdf
author: Trent Liffick (@tliffick), Bartlomiej Czyz (@bczyz1)
date: 2020-06-03
modified: 2023-03-10
tags:
- attack.defense-evasion
- attack.t1036.005
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\msdtc.exe'
    - '\gpsvc.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of process binaries, specifically `msdtc.exe` and `gpsvc.exe`, that are masquerading as legitimate system processes but are launched from non-standard directories. The likely attacker objective is to execute malware that mimics trusted system processes to evade detection and maintain persistence within the environment. This behavior correlates with the MITRE ATT&CK technique "Masquerade User Account" (T1036.005).

  The primary telemetry sources required are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, capturing details about the image execution context. If malicious, this could indicate a breach that undermines system integrity and may lead to data exfiltration or further lateral movement. It is important to note that this detection does NOT confirm that the process is malicious on its own; legitimate use cases may exist.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 and Sysmon Event ID 1 for instances where `msdtc.exe` or `gpsvc.exe` were executed from locations other than `C:\Windows\System32\` or `C:\Windows\SysWOW64\`. Look for anomalies in execution paths that could indicate malicious activity.

  - **Identify execution context:** Investigate the user context under which the potentially malicious processes are executed. A mismatch with typical administrative users or known accounts could warrant deeper analysis around Event ID 4720 details to see if new local accounts are being created.

  - **Correlate with known behavior:** For legitimate activities, typical `msdtc.exe` and `gpsvc.exe` execution often aligns with system updates or management tasks, frequently triggered by system-level account IDs like `SYSTEM` or service accounts. Confirm whether the behavior aligns with a scheduled task or regular maintenance.

  - **Examine for parent processes:** Utilize Sysmon Event ID 1 to identify the parent process of the suspicious commands. Malicious activity may often have unusual parent-child relationships, especially if initiated by a benign process like `cmd.exe` or `powershell.exe`.

  - **Check system integrity:** Use file integrity monitoring tools to assess if any alterations to system files or directories have occurred around the time of alerts generated by this rule. A change in the expected binary path could indicate an attempt to conceal malicious activity.

  - **Query for related logs:** Investigate other security logs such as Windows Defender ATP if present. Look for detections or alerts related to the same binaries within a similar timeframe, which may confirm attempted exploitation or further malicious activity.

  ### Prioritization

  The alert is high severity within an enterprise context due to the potential compromise of critical system processes that play key roles in system management. The likelihood of adversary abuse is significant, as groups like Lazarus are known for utilizing these techniques to hide their actions. This behavior can be indicative of advanced persistent threat (APT) activity.

  ### Blind Spots and Assumptions

  Detection may be limited if the systems do not log necessary process creation events or if telemetry is misconfigured. Adversaries might employ file deletion or process injection techniques to avoid detection. Legitimate administrative tasks or software updates may trigger this alert due to unexpected execution paths. Tracking activities surrounding file changes or behavioral analysis trends could provide additional coverage, such as alerts for unusual PowerShell or command line execution.

