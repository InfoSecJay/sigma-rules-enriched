title: Lazarus System Binary Masquerading
id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
status: test
description: Detects binaries used by the Lazarus group which use system names 
  but are executed and launched from non-default location
references:
- https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/07180244/Lazarus_Under_The_Hood_PDF_final.pdf
author: Trent Liffick (@tliffick), Bartlomiej Czyz (@bczyz1)
date: 2020-06-03
modified: 2023-03-10
tags:
- attack.stealth
- attack.t1036.005
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - '\msdtc.exe'
    - '\gpsvc.exe'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not filter
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of binaries associated with the Lazarus group, specifically looking for instances of `msdtc.exe` and `gpsvc.exe` that are launched from non-standard directories, such as locations outside of the Windows System32 or SysWOW64 directories. The likely objective of the attacker is to masquerade malicious executables as legitimate system processes to avoid detection while performing actions such as data exfiltration or system compromise. This behavior aligns with the MITRE ATT&CK technique T1036.005, known as “Masquerading: Match Legitimate Name or Purpose.”

  Primary telemetry sources for this detection include Windows process creation events captured by Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could indicate a significant security breach or an attempt to maintain persistence within the network. However, this detection does NOT confirm that the detected binary is malicious without further investigation; it only indicates that a legitimate file is being executed from an unusual location.

  ### Investigation Steps

  - **Verify process creation details**: Check for Security Event ID 4688 and Sysmon Event ID 1 logs. Look for `msdtc.exe` or `gpsvc.exe` with a command line that specifies a non-standard execution path, such as `C:\Users\<username>\AppData\Local\Temp\`.

  - **Correlate with parent process**: Investigate the parent process of the detected execution. A legitimate process (e.g., `explorer.exe`) is more indicative of expected behavior, whereas unexpected parent processes (like command prompt or PowerShell) raise suspicion.

  - **Analyze binary integrity**: Use tools like `sigcheck` to assess the digital signature and file hashes of the identified binaries. Confirm if they match known legitimate versions. An unsigned or unknown publisher raises significant concern.

  - **Identify command line arguments**: Review the command line parameters of the executed processes. Legitimate system processes tend to have standard arguments, while irregular flags or parameters may indicate malicious intent.

  - **Monitor for lateral movement attempts**: Look for any related network connection attempts made by the detected processes. Use firewall logs or outbound connection logs to identify unusual external communication patterns.

  ### Prioritization

  This alert is prioritized as high due to the potential impact of an affected system being compromised. The likelihood of abuse by adversaries, particularly advanced threat actors like Lazarus, is significant due to their history of utilizing masquerading techniques to facilitate attacks. This behavior is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Limitations include the possibility of legitimate application behaviors that may produce similar alerts, such as software updates running from non-standard directories. It is essential to ensure the collection of both Security Event IDs and Sysmon logs for reliable detection. A legitimate application performing updates or maintenance might trigger the alert if using a similar naming convention. A related detection rule for unusual command-line parameters (e.g., T1059 for scripting) would complement this alert.

