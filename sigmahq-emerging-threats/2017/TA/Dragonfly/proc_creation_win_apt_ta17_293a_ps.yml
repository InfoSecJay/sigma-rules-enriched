detection:
  selection:
    CommandLine|contains|all:
    - 'ps.exe -accepteula'
    - '-s cmd /c netstat'
  condition: selection
falsepositives:
- Renamed SysInternals tool
level: high
note: |
  ### Technical Context

  This rule detects the execution of a renamed SysInternals tool (specifically `ps.exe`) with commands typically used by sophisticated threat actors such as those in the Dragonfly APT group. The likely objective is to gather system information or perform actions stealthily, such as network enumeration. This behavior aligns with the MITRE ATT&CK techniques of "T1036.003: Masquerading: Rename" and "G0035: Dragonfly".

  The primary telemetry source is the Windows process creation logs, specifically Security Event ID 4688 and/or Sysmon Event ID 1, which capture process creation events and associated command-line arguments. If malicious, the security impact can include unauthorized access to network information and potential lateral movement within the environment. Importantly, this detection does NOT prove malicious intent on its own, as legitimate use of the renamed tool can occur.

  ### Investigation Steps

  - **Review process creation logs**: Look for Security Event ID 4688 or Sysmon Event ID 1. Confirm if `ps.exe` is executed with the command line arguments containing `-accepteula` and `-s cmd /c netstat`. A typical legitimate execution might not include such command-line parameters.

  - **Check parent process relationships**: Investigate the parent process ID captured in the logs. A legitimate process (like a scheduled task or administrative script) should be among those performing expected administrative activities. Unexpected parent processes such as malicious binaries or scripts should raise suspicion.

  - **Correlate with other security events**: Look for other significant security events around the same timestamp, such as suspicious login events (Event ID 4624) from unfamiliar accounts or unusual network connections (Event ID 5156). Patterns that support actor behavior raise confidence of malicious intent.

  - **Analyze the source of the `ps.exe` file**: Validate where `ps.exe` originated. Examine file creation timestamps and hashes using tools like Windows File Explorer and forensic analysis tools. Files created or modified outside normal operational practices may indicate a compromised state.

  - **Conduct a network traffic analysis**: Monitor outbound connections from the host executing `ps.exe` for unusual traffic patterns or connections to known malicious IP addresses. Use tools such as NetFlow or raw packet captures to validate.

  ### Prioritization

  This alert is of high severity due to the potential impact on enterprise security, as the affected system could be leveraged for further attacks. The specific behavior of executing a renamed SysInternals tool is commonly weaponized by advanced threat actors, contributing to a higher likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate use of renamed tools, which may trigger the alert. Variability in command-line arguments could also affect detection efficacy. Reliable detection requires comprehensive logging configurations, specifically enabling detailed audit policies for process creations. A related detection includes monitoring for file renaming events (Event ID 4663) to capture changes to known tools that can indicate misuse or adversarial behavior.

