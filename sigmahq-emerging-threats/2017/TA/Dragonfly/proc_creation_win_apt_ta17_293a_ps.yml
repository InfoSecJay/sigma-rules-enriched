detection:
  selection:
    CommandLine|contains|all:
    - 'ps.exe -accepteula'
    - '-s cmd /c netstat'
  condition: selection
falsepositives:
- Renamed SysInternals tool
level: high
note: |
  ### Technical Context

  This detection rule identifies the execution of a renamed SysInternals tool, specifically "ps.exe," which is commonly utilized by advanced persistent threat (APT) groups such as Dragonfly to facilitate malicious activities. The likely attacker objective is to perform reconnaissance or lateral movement within a compromised network, enabling them to gather system information or establish a foothold. This behavior aligns with the MITRE ATT&CK techniques: "Command and Control" (T1071) as it facilitates communication over a command line, and "Defense Evasion" (T1036.003) as it involves executing a tool under a renamed, benign-looking filename.

  Primary telemetry sources include Windows Process Creation logs (Event ID 4688 or Sysmon Event ID 1) capturing process initiation details. The security impact is significant if malicious, as it may indicate an attempted compromise of sensitive systems through covert tool usage. However, this detection alone does NOT confirm malicious activity; benign configurations or legitimate administrative use of renamed binaries may trigger the alert.

  ### Investigation Steps

  - **Inspect the command line arguments of the process:** Check for the presence of 'ps.exe -accepteula' and '-s cmd /c netstat' in the process initiation logs (Event ID 4688 / Sysmon ID 1). Benign use may include standard administrative tasks, but unexpected usage patterns should raise suspicion.

  - **Correlate parent process execution:** Identify the parent process of the observed 'ps.exe' instance using the "ParentProcessId" field in the logs. A legitimate parent process (e.g., powershell.exe initiated by an admin) may signify benign behavior, while a suspicious process (e.g., running under a user account with low privileges) could indicate malicious intent.

  - **Verify process execution frequency:** Analyze the frequency of 'ps.exe' executions in the Windows event logs over a specified timeframe. Unexpected spikes or repeated execution within a short period may reveal potential malicious activity.

  - **Examine user account activity:** Review account activity associated with the execution of 'ps.exe.' If the executing user account has low context or privilege levels, combined with anomalous login patterns (failed logins or off-hours access), it raises the likelihood of malicious activity.

  - **Check for additional SysInternals tools:** Review recent process creation logs for other instances of SysInternals tools named inconsistently, which might indicate a broader strategy of employing renamed tools for evasion.

  ### Prioritization

  The severity of this alert is high due to the potential for significant system impact if 'ps.exe' is used maliciously. The likelihood of abuse is notable, given that the Dragonfly APT group has been known to leverage this tactic for reconnaissance and lateral movement within enterprises. This behavior is not only uncommon but can be strategically weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as threat actors re-naming SysInternals tools to generic or common names before execution. Accurate detection requires comprehensive logging configurations, including inclusion of Sysmon event logging for process creations. Legitimate activities by system administrators, like the use of SysInternals tools for maintenance, may inadvertently trigger this alert. Companion detections involving unusual network connections or command execution patterns could strengthen overall coverage against this behavior.

