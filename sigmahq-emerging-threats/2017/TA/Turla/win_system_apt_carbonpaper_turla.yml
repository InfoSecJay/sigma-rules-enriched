note: |
  ### Technical Context
  This rule detects the installation of specific malicious services potentially associated with the Turla threat actor group, as outlined in ESET's Carbon Paper report. The Turla group is known for targeting enterprises and government institutions to maintain persistent access and execute various types of espionage-related activities. The identified service names, such as 'srservice', 'ipvpn', and 'hkmsvc', are indicators of potential malicious persistence mechanisms being employed by the attacker, often installed to facilitate remote control or data exfiltration.

  The detection logic is relevant to several MITRE ATT&CK tactics and techniques, specifically:
  - **Persistence** (TA0003) — utilizing malicious services to maintain presence on the system.
  - **Privilege Escalation** (TA0004) — installing services to gain higher privileges or control over the victim system.
  The primary data source providing evidence for this detection will be the Event Log service on Windows systems, specifically targeting entries created by the Service Control Manager (SCM) that relate to service installations.

  ### Investigation Steps
  - **Review Event Logs**: Collect and analyze Windows Event Logs, particularly focusing on Event ID 7045 logged by the Service Control Manager. Look for entries that match the specified service names indicative of Turla activity.
  - **Correlate with User Actions**: Investigate the accounts associated with the service installation. Correlate this with user account activity to identify potentially compromised credentials or unusual access around the time of service creation.
  - **Analyze Service Behavior**: For any identified services, check their configuration and behavior. Investigate startup parameters, dependencies, and execution context by querying the system's services.
  - **Evaluate Network Activity**: Monitor network connections and traffic originating from or targeting the identified services to detect any anomalous outbound connections or communication patterns that may indicate nefarious activities.

  ### Prioritization
  The severity of this alert is high due to the potential impact of a successful Turla installation, which can lead to compromise, data exfiltration, and further infiltration within the enterprise. The likelihood of this occurring is elevated in organizations that have been targeted by advanced persistent threat actors.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if sufficient log retention policies are not in place, which could lead to loss of data concerning prior service installations. The detection logic assumes that the services align precisely with the known names from the Turla group and may miss variants or renamed services. Additionally, the alert requires proper configuration of Windows Event Logging to ensure the necessary logs are available for monitoring service installations.

