note: |
  ### Technical Context
  This detection rule identifies the use of specific named pipes that are associated with the Turla Group, a sophisticated threat actor known for targeting government and military organizations. Named pipes are a method of inter-process communication commonly exploited by malware for command and control (C2) communication or for facilitating lateral movement within a network. The likely attacker objective in this scenario is to establish persistence on a compromised host or to facilitate further operations in a targeted network environment.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (T1106)**: Execution of commands through inter-process communication mechanisms.
  - **Command and Control (T1071)**: Use of named pipes for external communication channels.

  Primary data sources that will provide the best evidence for this detection include:
  - **Windows Sysmon logs**: Specifically Event ID 17 (named pipe creation) and Event ID 18 (named pipe deletion), which require proper configuration to capture these events effectively.

  ### Investigation Steps
  - **Collect Sysmon Logs**: Review Sysmon logs, specifically Event ID 17 and Event ID 18, to identify any instances of named pipe creation and deletion that match the specified pipe names related to Turla Group activity.
  - **Analyze Process Creation Events**: Investigate process creation events from Windows Event Logs to identify any suspicious processes that may have interacted with the identified named pipes, particularly looking for unusual parent-child relationships or known malware signatures.
  - **Inspect Network Traffic**: Examine network traffic logs (if applicable) for unusual connections originating from processes associated with the named pipes detected, as this may indicate C2 communication or exfiltration attempts.
  - **Review Systems for Artifacts**: Check the affected systems for indicators of compromise (IoCs) related to Turla Group, including unusual binaries, registry changes, or persistence mechanisms associated with the named pipes.

  ### Prioritization
  Given the critical impact of potential espionage or data exfiltration associated with Turla Group activities, this alert is prioritized as severe due to the likelihood of extensive damage to organizational security and data integrity.

  ### Blind Spots and Assumptions
  This detection logic assumes that Sysmon is configured correctly to log named pipe events, which may not be the case in all environments. There could be gaps in detection coverage if monitoring solutions do not enable these specific logs. Additionally, the effectiveness of this rule could be limited if attackers shift to using different named pipes or additional obfuscation techniques. Required logs for this alert to function effectively include properly configured Sysmon logs capturing Event IDs related to named pipe operations.

