note: |
  ### Technical Context

  This Sigma rule detects the creation of named pipes commonly associated with the Turla group, a well-known advanced persistent threat (APT) actor. The likely attacker objective is to establish covert communication channels for command and control (C2) operations or to facilitate lateral movement within the compromised environment. Relevant MITRE ATT&CK techniques include Command and Control over named pipes (T1106) and Execution using named pipes (G0010). The main telemetry source is Sysmon logs capturing Event IDs 17 (named pipe created) and 18 (named pipe connected). If malicious, this behavior indicates potential remote access and persistence in the environment. However, this detection does NOT automatically confirm malicious intentions as named pipes may be employed for legitimate internal communications.

  ### Investigation Steps

  - **Review Sysmon Event IDs 17 and 18 logs:** Filter for Event ID 17, looking for creation of named pipes specifically named '\atctl', '\comnap', '\iehelper', '\sdlrpc', or '\userpipe'. Check for the process IDs and parent process IDs to understand which applications are involved. Legitimate activity typically consists of common Windows services or applications that do not use these names.

  - **Correlate with process creation logs:** Examine Security Event ID 4688 for processes that interact with named pipes. Identify parent processes and user contexts to assess if the creation follows expected operational workflows.

  - **Analyze network communications:** Utilize network traffic logs (such as NetFlow or Windows Firewall logs) to check for unusual outbound connections from systems with named pipes created, particularly connections to unknown or suspicious IPs.

  - **Identify high-confidence malicious indicators:** Search for related files and processes in the file system that match Turla group characteristics. The execution of named pipes like '\atctl' without associated legitimate applications (e.g., processes not typically used to establish named pipes) may indicate compromise.

  - **Check for persistence mechanisms:** Look for Registry entries or scheduled tasks that reference these named pipes, which may indicate an attempt to establish persistence that could further complicate removal.

  ### Prioritization

  The severity of this alert is critical due to the impact on potential compromise within high-value assets, particularly if named pipes are leveraged for command and control. The likelihood of malicious abuse is high given the association with a known APT group, making this behavior a common target for exploitation.

  ### Blind Spots and Assumptions

  Detection may miss named pipes created by malicious actors using different or obfuscated names, hence relying solely on pipe names may lead to incomplete coverage. Ensure that Sysmon is properly configured to log named pipe events and that all relevant log sources are integrated for comprehensive detection. Legitimate internal applications may create similar named pipes, potentially leading to false positives. Consider companion detections that monitor for unusual process behavior and anomalous network communications, which can enhance visibility into potential threats linked to named pipe usage.

