  ---

  ### Technical Context

  This Sigma rule detects the creation of named pipes that are commonly associated with Turla group malware. Named pipes serve as inter-process communication channels, and the presence of specific named pipes (`\atctl`, `\comnap`, `\iehelper`, `\sdlrpc`, `\userpipe`) suggests potential adversary activity typically aimed at establishing persistence or facilitating command-and-control communications. Relevant MITRE ATT&CK tactics include Execution (T1203) and Remote Services (T1021). The primary telemetry source is Windows event logging, specifically Sysmon Event IDs 17 and 18, which log named pipe creation events. If these named pipes are indeed related to malicious activity, the security impact could be significant, potentially leading to data exfiltration or further compromise. However, the detection of these named pipes does NOT confirm malicious activity on its own, as legitimate applications may also utilize them.

  ---

  ### Investigation Steps

  - **Review Sysmon logs for named pipe creation events:** Check for Sysmon Event IDs 17 and 18 to identify instances of named pipe creation. Focus on the PipeName field for values such as `\atctl` or `\comnap`.

  - **Verify process details associated with the named pipes:** For any identified alerts, gather information from Sysmon Event ID 1 to determine the process that created the named pipe, looking for uncommon or suspicious parent processes (e.g., no associated legitimate software).

  - **Identify network activity related to established named pipes:** Correlate with firewall or network logs to see if unusual outbound traffic is associated with the identified processes using the named pipes. Compare data to baseline network behavior.

  - **Examine historical logs for similar named pipe activity:** Look for previous occurrences of the same named pipes over a designated period in Event IDs 17 and 18 to identify potential patterns or recurrent activity indicative of persistence.

  - **Check system logs for legitimate uses:** Document what benign behaviors typically look like, such as application updates or service communications that usually involve the named pipes, to establish context for the activity.

  ---

  ### Prioritization

  This alert should be considered critical due to the high-security risk posed by the Turla group, known for sophisticated attacks and potential lateral movement within networks. Given the weaponization of these specific named pipes, confirming an alert could indicate serious intrusions within enterprise environments, especially if they coincide with other suspicious activity.

  ---

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion where adversaries may use different named pipes or obfuscate pipe names. Additionally, without proper Sysmon configuration, necessary log data might not be captured reliably. Legitimate applications or services utilizing these named pipes for benign purposes such as inter-process communication may trigger false positives. A related detection to strengthen coverage could involve monitoring for unusual process creation or command-line activity associated with these named pipe names.

