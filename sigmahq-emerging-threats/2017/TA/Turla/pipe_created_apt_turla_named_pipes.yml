note: |
  ### Technical Context
  This rule is designed to detect the usage of specific named pipes that are commonly associated with activities from the Turla group, a well-known cyber threat actor. Named pipes are a method for inter-process communication in Windows, and the presence of specific pipe names such as `\atctl`, `\comnap`, `\iehelper`, `\sdlrpc`, and `\userpipe` may indicate malicious activity linked to the Turla group's exploits and operations. The objective of attackers utilizing these named pipes typically includes establishing command and control channels or facilitating further intrusions into target networks, often aiming for intelligence gathering or data exfiltration.

  The relevant MITRE ATT&CK techniques applicable to this rule include:
  - **Execution:** Techniques involving the execution of commands (T1106).
  - **Group:** This detection specifically targets the Turla group (G0010).

  The primary data source for this detection is the Sysmon logs, specifically focusing on configured event IDs related to named pipe creation (Event ID 17 and 18). Ensuring proper logging configurations for Sysmon is critical to effective detection and investigation.

  ### Investigation Steps
  - **Review Named Pipe Logs:** Analyze Sysmon logs for Event ID 17 and 18 to identify any unexpected or suspicious named pipe creations that match the pipe names associated with the Turla group.
  - **Correlate with Process Activity:** Check for processes that interact with the named pipes using tools like EDR solutions to identify potential malicious executables or scripts that may have engaged with these pipes.
  - **Investigate Network Connections:** Look for outbound network connections related to any identified processes, as these may indicate command and control communications or data exfiltration attempts.
  - **Assess Affected Hosts and Users:** Determine which hosts and user accounts are involved in these named pipe activities to understand the scope of the possible compromise and to identify potentially affected systems for further analysis.

  ### Prioritization
  This alert is deemed critical due to the high potential impact of Turla group activities, which often include advanced persistent threats (APTs) targeting sensitive data and government entities. The likelihood of seeing such named pipe activity in an environment increases with the presence of high-value targets, making it imperative for analysts to act swiftly on these alerts.

  ### Blind Spots and Assumptions
  There are potential blind spots in this detection rule regarding the configuration of Sysmon logging. If Sysmon is not correctly set up to log named pipe events, detection will not occur. Additionally, the detection logic assumes that these named pipes will only be used by malicious actors and may not account for legitimate applications that could trigger false positives. Adequate logging configuration and continuous monitoring are essential for the accurate function of this alert, as well as a comprehensive understanding of the environment's normal behavior to differentiate between benign and malicious operations.

