  ### Technical Context
  This rule detects the creation of a potentially malicious service associated with the Turla PNG dropper—a threat actor tool used in sophisticated cyber-espionage campaigns. The PNG dropper typically leverages Windows' built-in service management capabilities to establish persistence on compromised systems, allowing attackers to maintain a foothold and execute further malicious actions. The core objective of this tactic is to gain long-term access to a target network while blending in with legitimate operations.

  The relevant MITRE ATT&CK tactics and techniques for this detection are **Persistence (T1543.003)**, which involves the installation of malicious services, and **Account Manipulation (G0010)**, indicating manipulation of accounts or credentials to maintain access. By monitoring service creation events, particularly those originating from the Service Control Manager, security teams can identify potential threats, facilitating prompt investigation and remediation.

  The primary data sources relevant to this detection include **Windows event logs** such as system logs, particularly focusing on service creation events linked to the Service Control Manager. Key event IDs like 7045, which indicate a service installation, are critical for identifying potentially malicious behavior.

  ### Investigation Steps
  - **Review Event Logs:** Examine Windows system logs, focusing on Event ID 7045 to identify any new services created, particularly those with the name 'WerFaultSvc'. Note the time and context of their creation.
  - **Analyze Service Configuration:** Investigate the configuration of the detected service to check for any unusual parameters or execution paths that may indicate malicious intent.
  - **Correlate with Other Data Sources:** Look into additional telemetry from your EDR or NDR tools to identify any associated processes, network connections, or anomalies that may corroborate the service’s malicious nature.
  - **Cross-Reference Threat Intelligence:** Consult threat intelligence reports, such as the one from NCC Group regarding the Turla PNG dropper, to establish the known IOAs (Indicators of Attack) and see if they match with your findings.

  ### Prioritization
  Given its high level of persistence and the typical targeting of sensitive environments by the Turla Group, alerts generated by this detection rule should be regarded as critical. The potential for significant data exfiltration or lateral movement within the network makes this detection imperative for timely response.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the logs for service creation events are not being captured properly or if the security monitoring tools are misconfigured. The detection logic assumes that the service creation is abnormal; however, it does not account for legitimate applications that may use the same service name. Proper configuration of Windows logging, specifically ensuring that system event logs are active and retained, is essential for this alert to function effectively. Analysts should be cautious about false positives when handling this detection, as benign applications may also create similar services.

