  ### Technical Context
  This detection rule identifies the establishment of malicious services, specifically targeting the Turla PNG dropper as highlighted in a report by NCC Group. The Turla group is known for advanced persistent threats (APTs) targeting government and enterprise networks, using sophisticated methods to maintain persistence and escalate privileges within the compromised environment. In this context, the Turla PNG dropper utilizes a Windows service named "WerFaultSvc" to execute its malicious payload, which could facilitate unauthorized remote access or data exfiltration.

  The threat scenario involves an attacker deploying the Turla PNG dropper to establish a foothold within a target network through service manipulation. The likely objectives include maintaining persistence, elevating privileges, and executing further exploitation tactics. This aligns with the MITRE ATT&CK framework, particularly the following tactics and techniques:
  - Persistence (T1543.003) – Creating or modifying system services.
  - Privilege Escalation (G0010) – Utilizing services to run malicious code under higher privileges.

  To effectively analyze these activities, primary data sources would include Windows event logs, specifically Service Control Manager logs (EventID 7045), which detail service creation and modifications.

  ### Investigation Steps
  - **Review Service Creation Events:** Examine Windows Event Logs for Event ID 7045 to track all service creation activities, focusing specifically on entries with the ServiceName "WerFaultSvc" and inspect the provider details.
  - **Correlate with Other Logs:** Analyze related logs, such as process creation events or security logs, to identify if the service was called by unusual processes or if other indicators of compromise exist.
  - **Check for Service Anomalies:** Investigate if the "WerFaultSvc" service is running outside of its expected parameters or if there are multiple instances of it that could indicate malicious activity.
  - **Monitor Network Activity:** Utilize network telemetry to review outbound connections from this service for any suspicious activity, particularly connections to known malicious IP addresses or domains associated with Turla.

  ### Prioritization
  This alert is categorized as critical due to the high potential impact associated with APT activities and the likelihood of attackers using similar tactics to establish persistence and escalate privileges in enterprise environments.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate administrative actions creating similar service entries, which could lead to false positives. The detection logic assumes that all instances of the "WerFaultSvc" service, when registered by the Service Control Manager, indicate malicious activity, which may not always be the case. For effective detection, it is crucial that Windows event logging is properly configured to capture all service-related events, specifically Event ID 7045, to ensure visibility into any potentially malicious service creation.

