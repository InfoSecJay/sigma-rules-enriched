note: |
  ### Technical Context

  This rule detects the creation of a potentially malicious service named "WerFaultSvc" by the Service Control Manager (Event ID 7045). This activity is characteristic of the Turla advanced persistent threat (APT) group, which often utilizes obfuscated methods to maintain persistence and escalate privileges on compromised systems. The relevant MITRE ATT&CK tactics include Persistence (T1543.003) and Privilege Escalation (T1068). The primary telemetry source is Windows Event logs, particularly the System log, where Service Control Manager events are recorded. If confirmed malicious, it could facilitate unauthorized system access or data exfiltration. This detection does NOT confirm that an attack is occurring; it only indicates suspicious service creation that warrants further investigation.

  ### Investigation Steps

  - **Check for recent service creation events**: Review the System Event log for Event ID 7045. Identify if "WerFaultSvc" was created within an unusual timeframe or context (i.e., outside of typical maintenance windows).

  - **Validate service properties**: Investigate the service's configuration using `sc qc WerFaultSvc`. Look for unusual parameters or service dependencies that do not align with legitimate operations.

  - **Identify parent process information**: Cross-reference the creation event with Event ID 4688 (Process Creation) to find the parent process that spawned the service. Look for known malicious processes or scripts that may correlate with the service creation.

  - **Observe legitimate vs. malicious service behavior**: Review expected behavior of "WerFaultSvc" in other environments where it is legitimately used for error reporting. Confirm that no suspicious interaction with other processes or files is occurring.

  - **Investigate service execution path**: Check the executable path of "WerFaultSvc" in the Service Control Manager. Malicious instances might have a non-standard path or location, contrasting with legitimate versions found in the Windows System directory.

  - **Analyze network activity**: Monitor outbound connections initiated by the associated service using tools like Sysmon or Windows Firewall logs. Look for unusual IP addresses or domains that may indicate command and control or data exfiltration.

  ### Prioritization

  This alert is critical because it involves the creation of a service that could allow an attacker to achieve persistence on a compromised system. The likelihood of malicious abuse is high given the historical context of the Turla group utilizing similar techniques. This behavior is often weaponized, especially in targeted APT scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if Event ID 7045 logging is not properly configured on all systems, potentially allowing malicious services to go unnoticed. Legitimate system updates or configuration changes may trigger this alert; therefore, analysts must assess the context surrounding service creation. A companion detection to strengthen coverage would be monitoring for abnormal process execution patterns related to other known malicious service behaviors, such as those linked to code injection techniques.

