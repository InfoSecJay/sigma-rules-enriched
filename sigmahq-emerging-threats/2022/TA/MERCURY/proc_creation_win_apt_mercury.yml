note: |
  ### Technical Context

  This rule detects the execution of suspicious PowerShell command line patterns associated with the MERCURY APT group. The behavior primarily involves command line arguments indicating encoded script execution, which can be part of lateral movement, remote execution, or payload delivery. The likely attacker objective is to leverage PowerShell to execute malicious scripts in the context of an initial compromise or to further penetrate the target environment.

  The relevant MITRE ATT&CK tactics are **Execution** (TA0002) and the associated technique **Command-Line Interface** (T1059.001). The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on the Security Event ID 4688, which logs process creation events, and auxiliary sources such as Sysmon for detailed command line logging. If malicious, this behavior can lead to unauthorized data access or system compromise. Notably, this detection does NOT confirm that the execution is always malicious, as legitimate administrative actions may also utilize similar command patterns.

  ### Investigation Steps

  - **Review Security Event ID 4688**: Analyze event logs for the process creation involving `powershell.exe` with the suspicious command line arguments `-exec bypass -w 1 -enc`. Determine the parent process ID to establish the context of the execution.

  - **Examine Sysmon Event ID 1**: Check Sysmon logs to confirm the command line and associated hashes for the PowerShell process. Compare these against known benign behavior such as administrative scripts or automation tasks commonly used within your environment.

  - **Identify Indicator of Compromise**: Look for the Base64 decoded command string which suggests obfuscation—if it points to known malicious payloads or behavior associated with MERCURY APT, flag this as a high-confidence malicious indicator.

  - **Cross-reference with Scheduled Tasks**: Investigate any unusual scheduled tasks or scripts running within the environment that may utilize similar command patterns for legitimate maintenance, confirming whether these are expected or abnormal.

  - **Assess Asset Criticality**: Determine if the alert originated from a critical asset or server role (like a domain controller or web server), indicating a higher severity for potential exploitation.

  - **Check for File Creation/Exfiltration**: Validate potential creation of suspicious files or logs that may indicate data exfiltration post-execution, focusing on file creation logs and any abnormal outbound connections that may coincide with the process execution.

  ### Prioritization

  This alert has high severity as it may indicate an active compromise involving critical systems. The likelihood of malicious abuse is elevated given the specific use of PowerShell command patterns linked with a known threat actor. Additionally, behaviors indicative of MERCURY APT are known to be weaponized in targeted attacks, particularly against specific sectors.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of necessary log sources (e.g., Sysmon not deployed across all endpoints). Evasion techniques may include changing command obfuscation methods or employing alternate execution methods. Legitimate administrative activities, such as scripted maintenance tasks or deployments, could unintentionally trigger this alert. A related detection worth integrating is monitoring for unusual PowerShell module imports or encoding techniques, which could provide an additional layer of threat intelligence contextualization.

