note: |
  ### Technical Context
  This detection rule identifies suspicious command line patterns associated with the MERCURY Advanced Persistent Threat (APT) group. MERCURY has been known to exploit vulnerabilities like Log4j to gain unauthorized access, primarily targeting organizations in Israel. This rule focuses on detecting encoded PowerShell commands that are often used in post-exploitation activities, such as executing malicious scripts or lateral movement within a compromised environment.

  The typical attacker objectives for MERCURY include gaining persistence, executing malware, and exfiltrating sensitive information. The detected command line patterns suggest attempts to bypass security mechanisms and execute potentially harmful scripts in a stealthy manner. Relevant MITRE ATT&CK tactics include **Execution** and **Command and Scripting Interpreter** (T1059.001).

  The primary data sources for this detection are **process creation logs** from Windows systems, which provide visibility into command-line arguments initiated by running processes, allowing for identification of potentially malicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events around the time of the alert to identify the full command line execution context and parent processes. Look for the use of `powershell.exe` or `pwsh.exe` with suspicious arguments.

  - **Check for Anomalous Script Execution:** Investigate any PowerShell scripts executed that might resemble encoded command patterns typical for MERCURY. Correlate with known baseline behaviors for scripts within the environment.

  - **Identify System Changes and Network Connections:** Assess any changes made to the system configurations or connections established to external IP addresses, particularly after the execution of the suspicious commands. Tracking subsequent network traffic can provide insight into potential data exfiltration or command and control activities.

  - **Correlate with Threat Intelligence:** Utilize threat intelligence feeds to verify if any IP addresses or domains acting as command and control servers relate to MERCURY APT operations or other known malicious entities.

  ### Prioritization
  The alert is classified as high severity due to the potential impact of MERCURY APT activities on sensitive organizational data and infrastructure. Given the known capabilities of this APT group and their focus on strategic targets, the likelihood of successful exploitation necessitates immediate investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if processes utilize encoding or obfuscation techniques that do not match the specified patterns. Assumptions include that all relevant PowerShell execution will be captured in process creation logs; however, if logging is not properly configured, or if security measures such as application whitelisting intervene, detection may be impaired. Ensuring that PowerShell logging and appropriate process auditing are enabled is essential for the effectiveness of this alert.

