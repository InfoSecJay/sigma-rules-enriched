  ---

  ### Technical Context

  This rule detects the execution of PowerShell commands using obfuscation techniques characteristic of the MERCURY APT (Advanced Persistent Threat). The specific command patterns indicate attempts to bypass security mechanisms and execute potentially malicious scripts on Windows systems. The likely attacker objective is to establish a foothold within an environment, gather information, or deploy further payloads. This behavior aligns with the MITRE ATT&CK technique: Execution, specifically T1059.001 (PowerShell).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on the CommandLine field of Event ID 4688. If malicious, the impact could lead to data exfiltration, lateral movement, or deployment of additional malware. Importantly, this detection does NOT prove that a compromise has occurred on its own; further investigation is required to correlate with malicious context.

  ---

  ### Investigation Steps

  - **Search for the detection command in logs**: Review Windows Security Event ID 4688 for processes where the CommandLine contains ‘-exec bypass -w 1 -enc’ or the associated encoded PowerShell script (decoding for clarity if needed).

  - **Verify parent process context**: Check the ParentProcessId in Event ID 4688 to determine if the command was executed from a legitimate process like cmd.exe or a suspicious one like a known malware executable.

  - **Evaluate system roles**: Identify the host's role; legitimate PowerShell activity may occur on administration or development servers, while unexpected usage on endpoints with limited privilege should raise suspicion.

  - **Compare with known benign scripts**: Cross-reference observed PowerShell execution patterns against a baseline of known benign scripts or common administrative tasks run at the affected time to differentiate between malicious and legitimate actions.

  - **Check for process anomalies**: Analyze the Process command lines in conjunction with Sysmon Event ID 1 for unusual process creation patterns or multiple instances that could indicate a script is being executed in rapid succession, typical of scripted attacks.

  - **Investigate historical alerts**: Look for previous alerts regarding similar command patterns or IP connections that may indicate ongoing MERCURY APT activity to build a comprehensive assessment of potential compromise.

  ---

  ### Prioritization

  This alert is of high severity due to the high impact on the affected system, which may be critical for organizational operations. The likelihood of malicious abuse is considerable as the activity aligns with tactics commonly used by advanced adversaries, and the specific command line patterns have been weaponized in past incidents.

  ---

  ### Blind Spots and Assumptions

  This detection may be circumvented by utilizing alternative command execution methods or heavily obfuscated command lines, which are not captured by this rule. Reliable detection also depends on ensuring that detailed process creation logging is enabled for all systems. Legitimate administrative tasks, such as running scripts for system maintenance, may trigger this alert. A companion detection that strengthens coverage would be monitoring for unusual outbound connections linked to the scripts executed, which might indicate data exfiltration.

