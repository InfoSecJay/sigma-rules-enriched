  ### Technical Context

  This rule detects the creation of scheduled tasks using Windows command-line parameters that are characteristic of ACTINIUM's persistence mechanisms. The likely objective of the attacker is to establish persistence on the compromised system, enabling further exploitation or data exfiltration over time. The relevant MITRE ATT&CK tactic and technique is Persistence (T1053) with a specific focus on Scheduled Task/Job (T1053.005).

  The primary telemetry source for this detection is Windows process creation logs, particularly focusing on Event ID 4688 where the command line contains key parameters associated with `schtasks`. If confirmed malicious, this behavior could lead to unauthorized access or control over the affected system. It is vital to note that this detection does NOT confirm that malicious activity is occurring solely based on this signature; legitimate use of scheduled tasks can trigger similar alerts.

  ---

  ### Investigation Steps

  - **Examine the process creation logs:** Review Security Event ID 4688 for the associated task creation. Check for a command line containing `schtasks`, `create`, `wscript`, and `/e:vbscript`. Malicious instances will have atypical, obfuscated, or unusual command arguments compared to benign scheduled tasks.

  - **Validate legitimate task creation:** Cross-reference with expected business operations. Legitimate scheduled tasks will typically involve standard applications and scripts being invoked, with clear, descriptive command-line parameters that match known operational procedures.

  - **Check for recent changes in scheduled tasks:** Use PowerShell or task scheduler management (Task Scheduler Library) to enumerate tasks created in the last 24 hours. Look for anomalies in the task names or configurations that deviate from organizational norms.

  - **Assess user context of task creation:** Review log entries for Event ID 4624 to identify the user account associated with the task creation. Confirm if this account has the necessary administrative privileges, as misuse of administrative accounts may indicate malicious activity.

  - **Examine the presence of abnormal VBScript files:** Investigate file paths associated with the execution of `wscript.exe` for newly created or modified `.vbs` files. Use FileSystem Event logs for creation (Event ID 4663) and look for characteristics such as uncommon file names or locations that deviate from standard deployment.

  - **Identify system impact and containment procedures:** If malicious activity is confirmed, prioritize containment steps, including isolating the affected host and conducting a detailed forensic investigation to understand the possible impact on enterprise assets and data integrity.

  ---

  ### Prioritization

  This alert is considered high severity due to its potential impact, as compromised scheduled tasks can enable persistent threats that may lead to data loss and system integrity issues. The likelihood of abuse is elevated, given that the observed behaviors align closely with known adversarial tactics. Additionally, ACTINIUM's targeting of specific regions heightens the risk for enterprises in those areas.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate scheduled task creation processes, such as routine maintenance or automated updates that may trigger false positives. Reliable detection requires comprehensive logging for process creation and command-line arguments, ensuring no gaps exist in configurations. Additionally, benign administrative actions by IT personnel, such as system monitoring or maintenance, could lead to similar alerts. Companion detections, such as monitoring for unusual script execution patterns (like PowerShell commands leveraging `Invoke-Expression`), can strengthen coverage against ACTINIUM-like attacks.

