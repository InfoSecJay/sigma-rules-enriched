note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks using `schtasks` with specific parameters indicative of ACTINIUM activity, specifically targeting the execution of VBScript via Windows Script Host (`wscript`). The likely objective of this behavior is to establish persistence on compromised systems, allowing adversaries to maintain access over time and execute additional malicious payloads or scripts.

  The relevant MITRE ATT&CK tactics and techniques are:
  - **Persistence (T1053)**, specifically **Scheduled Task/Job (T1053.005)**.

  The primary telemetry source is Windows process creation logs, particularly focusing on Security Event ID 4688 and Sysmon Event ID 1. If malicious, this behavior could allow an attacker to maintain long-term access to a system, stealing data or deploying further attacks. However, this detection alone does not confirm malicious intent, as legitimate scheduled task creation could invoke similar command-line parameters.

  ### Investigation Steps

  - **Verify process creation details: ** Review Security Event ID 4688 or Sysmon Event ID 1 for processes created with the command line including 'schtasks', 'create', 'wscript', and ' /e:vbscript'. Look for timestamps and user accounts to discern if this was invoked by typical administration tasks.

  - **Identify related scheduled tasks: ** Query scheduled tasks using PowerShell commands (`Get-ScheduledTask | Where-Object { $_.Actions -like '*wscript*' }`) to identify if this task was created recently and whether it is linked to known legitimate administrative tasks or accounts.

  - **Check for anomalous user behavior: ** Cross-reference the user account associated with the task creation with normal user activity patterns. Accounts commonly involved in scheduled task creation should be validated; deviations may indicate malicious activity.

  - **Ensure logging of process command lines: ** Confirm that command line logging is enabled in the environment to ensure full visibility into process creation details necessary for this detection.

  - **Investigate related alerts: ** Look for other indicators or detections related to malicious scripting activities or known IOCs associated with ACTINIUM within the environment that could indicate a broader compromise.

  ### Prioritization

  This alert is high priority due to the potential impact of persistence on critical systems. The likelihood of malicious abuse is significant, given the targeted use of the rule by threat actors such as ACTINIUM, whose tactics focus heavily on stealth and evasion strategies involving scheduled tasks.

  ### Blind Spots and Assumptions

  This detection may be limited by environments that do not log command line arguments in process creation events. Legitimate activities such as system maintenance schedules could generate similar alerts, leading to false positives. A related detection could involve tracking abnormal script execution patterns or flagging unusual command-line parameters in PowerShell activities to enhance overall monitoring capabilities.

