note: |
  ### Technical Context
  This detection rule identifies potential persistence mechanisms employed by the ACTINIUM threat actor through the use of Windows Scheduled Tasks. Specifically, it focuses on the creation of scheduled tasks using the `schtasks` command with parameters that indicate the execution of VBScript, which is a common tactic for embedding malicious behavior in a seemingly legitimate process. The primary objective for attackers using this method is to maintain a foothold in the environment, enabling them to launch further attacks or exfiltrate data undetected.

  The key relevant tactics and techniques from the MITRE ATT&CK framework are:
  - **Persistence (T1547)**: Techniques that enable an attacker to maintain access to systems across restarts, system changes, and other interruptions.
  - **Scheduled Task/Job (T1053.005)**: Specifically centers on the creation of scheduled tasks as a persistence mechanism.

  For detection, the best telemetry comes from **process creation logs** on Windows systems, as they provide information about commands executed, including parameters and associated processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of the `schtasks` command in the process creation logs. Pay special attention to those commands that include `create`, `wscript`, and `/e:vbscript` in the parameters.

  - **Analyze Scheduled Tasks**: Evaluate the scheduled tasks that have been created by reviewing the Task Scheduler on affected systems. Look for any tasks that appear unusual, especially those configured to run scripts or executables that lack proper documentation or legitimate business purposes.

  - **Check for Related Network Activity**: Investigate any network activity related to the execution of scripts identified in the process creation logs. This includes outbound connections initiated by the script which may indicate data exfiltration or command-and-control (C2) communication.

  - **Correlate with User Activity**: Verify the authenticity of the user who created the scheduled tasks. Determine whether there are any unusual patterns in account activity or access to systems that could suggest compromised credentials.

  ### Prioritization
  This alert should be considered high severity due to the involvement of a sophisticated threat actor like ACTINIUM, which is known for targeting organizations for espionage or data theft. The likelihood of exploitation is increased given the persistence nature of the identified behavior.

  ### Blind Spots and Assumptions
  There may be gaps in detection if process creation logs are not collected or if certain systems do not log scheduled task creations due to misconfigurations. The detection logic assumes that typical usage patterns do not include the specific command and parameters identified, which could lead to false negatives if such commands are legitimately executed in the environment. Therefore, rigorous log collection configurations across all endpoints are necessary to ensure complete coverage for this alert to function effectively.

