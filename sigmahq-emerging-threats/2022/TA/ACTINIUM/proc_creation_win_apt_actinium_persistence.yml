  ### Technical Context
  This detection rule identifies potential persistence activity associated with the ACTINIUM threat actor, known for targeting organizations with malicious scheduled tasks. Specifically, it captures command line parameters typically used to create scheduled tasks involving VBScript execution through Windows' `schtasks` utility. In these scenarios, attackers aim to establish a foothold in the environment that allows them to execute malicious scripts or commands at set intervals, which aligns with their broader objectives of espionage or data exfiltration.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003), specifically **Scheduled Task/Job** (T1053) and **Create Scheduled Task** (T1053.005). By leveraging scheduled tasks, attackers can ensure their malicious code is executed automatically, even after system reboots. The primary data sources for detecting this activity include Windows process creation logs which capture command line arguments and the context of task creation.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze Windows process creation logs for events that match the specified command line containing 'schtasks', 'create', 'wscript', and '/e:vbscript'. Pay close attention to the user context under which these commands were executed.
  - **Correlate with Scheduled Task Logs**: Investigate the Task Scheduler logs to see if any suspicious scheduled tasks were created or modified during the timeframe of the detected activity. This can reveal the presence of any malicious VBScript executions.
  - **Check User Account Activity**: Look for unusual account activity that could indicate a compromised account, such as logins from unusual IP addresses or service accounts being used without prior authorization. This can help establish whether the activity is linked to a malicious insider or external threat actor.
  - **Monitor for Related Network Activity**: If possible, analyze network traffic for outbound connections that might correlate with the script’s execution. This could show data exfiltration attempts or communications with command and control (C2) servers.

  ### Prioritization
  This alert should be treated with high urgency due to its indication of potential persistence methods employed by a known threat actor, where successful exploitation can lead to significant compromise within the organization.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if logging for process creation events is not adequately configured or if the logging level does not capture complete command lines. This detection logic assumes that the command contains specific parameters synonymous with ACTINIUM activity; thus, variations in tactics or command structure could bypass detection. Additionally, comprehensive monitoring of scheduled task modifications is necessary to ensure accurate assessments of legitimate against malicious activities. Confirm that appropriate logging levels for process creation events are enabled to support this detection.

