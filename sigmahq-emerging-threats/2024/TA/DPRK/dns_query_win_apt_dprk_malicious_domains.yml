  ### Technical Context
  This rule detects DNS queries directed towards command and control (C2) domains that are known to be associated with North Korean (DPRK) threat actors. Organizations can be targeted to steal sensitive data, disrupt operations, or conduct espionage activities. The presence of requests to these C2 domains may indicate that a compromised host is communicating with an external attacker-controlled server, potentially facilitating further malicious activity such as data exfiltration or the deployment of additional payloads.

  In the MITRE ATT&CK framework, this rule relates to the tactics of "Command and Control" (TA0011), specifically leveraging techniques such as "Application Layer Protocol" (T1071) and "DNS Tunneling" (T1071.001). Detecting these DNS queries is essential for identifying potential compromises within a network and initiating an appropriate response.

  Primary data sources for this detection include DNS query logs generated by DNS servers or security appliances that monitor DNS traffic. This information can provide visibility into unusual or malicious domain resolution requests that could indicate a breach or ongoing malicious activity.

  ### Investigation Steps
  - **Review DNS Query Logs:** Analyze logs for repeated queries or unusual patterns towards the identified C2 domains (`connection.lockscreen.kro.kr` and `updating.dothome.co.kr`) to confirm if a host is trying to communicate with these domains.

  - **Correlate with Host Activity:** Investigate the processes and network connections on the hosts generating the DNS queries to identify potential malware or unauthorized applications attempting to establish C2 communications.

  - **Examine User Behavior:** Check for any recent user account activity that correlates with the DNS queries, including logins, file access, or other actions that may indicate compromise or data exfiltration efforts.

  - **Monitor Network Traffic:** Use network detection tools to check for outbound connections to suspicious IP addresses associated with the C2 domains and look for unusual traffic patterns that may indicate further malicious activity.

  ### Prioritization
  The severity of this alert is high, as communication with known DPRK C2 domains signals a potential active compromise within the network. The implications of such intrusions can lead to serious data breaches, financial losses, and significant operational disruptions.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for encrypted DNS traffic (DoH or DoH) that could obscure malicious communications. This rule assumes that the DNS logs are comprehensive and correctly configured to log all necessary queries; missing log sources or misconfigured logging could reduce the efficacy of this detection. Moreover, false positives are unlikely but should still be monitored, particularly in environments with legitimate reasons for accessing such domains.

