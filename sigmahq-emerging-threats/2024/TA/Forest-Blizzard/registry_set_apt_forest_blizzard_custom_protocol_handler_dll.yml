note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows registry that set the default DLL for a specific custom protocol handler. This behavior is associated with post-compromise activities of the Forest Blizzard APT group, likely aiming to establish persistence on the target system and potentially escalate privileges. The relevant MITRE ATT&CK tactic is Persistence (TA0003) with the technique named "Create or Modify System Process: Windows Service" (T1547.001).

  The primary telemetry source is Windows Registry logs focusing on registry changes, specifically targeting registry keys associated with the CLSID of the custom protocol handler. If malicious, this could allow adversaries to execute arbitrary code under the context of a legitimate application. It is important to note that this detection does NOT confirm the execution of malicious code without further corroborating evidence.

  ### Investigation Steps

  - **Review the Registry Key Change:** Analyze the registry event with Event ID corresponding to registry changes. Check if the key path includes `\CLSID\{026CC6D7-34B2-33D5-B551-CA31EB6CE345}\Server` and confirms that the value's data ends with `.dll`. Any unapproved modification is suspicious.

  - **Correlate with Process Creation Events:** Look for associated Process Creation events (Security Event ID 4688 or Sysmon Event ID 1) that show execution of the newly registered DLL. Indicators include process names that are atypical or originate from temporary folders, suggesting exploitation.

  - **Examine For Related Scheduled Tasks:** Investigate if any scheduled tasks (Event ID 4698) were created around the same timeframe that may utilize the custom protocol handler. This behavior can signify an attempt to automate execution.

  - **Identify Legitimate Usage of this Protocol:** Confirm if there are legitimate applications known to use this particular CLSID. Documentation or application inventory may help validate benign usage to avoid false positives.

  - **Check for Previous Alerts and Incidents:** Review historical alerts for patterns or recurrence of activity involving protocol handler registry modifications that weren't previously noted. This pattern recognition can help trace compromise history.

  - **Assess Host Role and Asset Criticality:** Determine the criticality of the affected host, focusing on whether it contains sensitive data or serves crucial business functions. A compromised host in a high-impact operational role poses a significant risk.

  ### Prioritization

  This alert is high severity as it targets critical persistence mechanisms often exploited by advanced threat actors. The likelihood of malicious activity is elevated, particularly in systems handling sensitive data or administrative tasks. Such registry modifications are commonly weaponized for stealthy persistence following an initial compromise.

  ### Blind Spots and Assumptions

  The primary limitation of this detection is that skilled adversaries may utilize techniques to evade registry monitoring to avoid detection, such as modifying the registry through non-standard means. It relies on comprehensive monitoring of registry activity, which may not be enabled or properly configured in all environments. Legitimate third-party applications may also trigger this alert if they use similar custom handlers. Complementary detections, such as monitoring for unusual code execution via Event ID 4688, can strengthen overall monitoring capabilities.

