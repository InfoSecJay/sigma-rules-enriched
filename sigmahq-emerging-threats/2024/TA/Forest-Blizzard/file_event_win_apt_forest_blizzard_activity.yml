title: Forest Blizzard APT - File Creation Activity
id: b92d1d19-f5c9-4ed6-bbd5-7476709dc389
status: test
description: |
  Detects the creation of specific files inside of ProgramData directory.
  These files were seen being created by Forest Blizzard as described by MSFT.
references:
- https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-04-23
modified: 2024-07-11
tags:
- attack.defense-evasion
- attack.t1562.002
- detection.emerging-threats
logsource:
  category: file_event
  product: windows
detection:
  selection_programdata_driver_store:
    TargetFilename|startswith:
    - 'C:\ProgramData\Microsoft\v'
    - 'C:\ProgramData\Adobe\v'
    - 'C:\ProgramData\Comms\v'
    - 'C:\ProgramData\Intel\v'
    - 'C:\ProgramData\Kaspersky Lab\v'
    - 'C:\ProgramData\Bitdefender\v'
    - 'C:\ProgramData\ESET\v'
    - 'C:\ProgramData\NVIDIA\v'
    - 'C:\ProgramData\UbiSoft\v'
    - 'C:\ProgramData\Steam\v'
    TargetFilename|contains:
    - '\prnms003.inf_'
    - '\prnms009.inf_'
  selection_programdata_main:
    TargetFilename|startswith: 'C:\ProgramData\'
  selection_programdata_files_1:
    TargetFilename|endswith:
    - '.save'
    - '\doit.bat'
    - '\execute.bat'
    - '\servtask.bat'
        # Hashes|contains: '7d51e5cc51c43da5deae5fbc2dce9b85c0656c465bb25ab6bd063a503c1806a9' # Uncommon this if you collect hash information inf file events
  selection_programdata_files_2:
    TargetFilename|contains: '\wayzgoose'
    TargetFilename|endswith: '.dll'
  condition: selection_programdata_driver_store or (selection_programdata_main 
    and 1 of selection_programdata_files_*)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of specific malicious files in the ProgramData directory, which have been associated with the Forest Blizzard APT group. The likely objective of the attacker is to establish persistent access or conduct further malicious activities, such as credential harvesting, through specialized tools exploiting vulnerabilities like CVE-2022-38028. This behavior aligns with the MITRE ATT&CK tactic for defense evasion (T1562.002).

  The primary telemetry source for this detection comes from Windows file event logs, specifically monitoring for file creation activities in ProgramData. Malicious activity could severely compromise system integrity and confidentiality, especially if sensitive credentials are obtained. Importantly, this detection does NOT, on its own, confirm that malicious activity is occurring; it merely flags potential indicators that require further investigation.

  ### Investigation Steps

  - **Review file creation events:** Check Windows Security Event ID 4663 or Sysmon Event ID 11 for file creation activities in `C:\ProgramData\`. Focus on the timestamps and related processes that generated these events.

  - **Identify high-confidence malicious indicators:** Look for file names containing `\prnms003.inf_` or `\prnms009.inf_` along with associated hashes, particularly noting the hash `7d51e5cc51c43da5deae5fbc2dce9b85c0656c465bb25ab6bd063a503c1806a9`. Verify these against known malware signatures.

  - **Assess legitimate behavior:** Determine if any processes legitimately create files in the monitored directories, such as Windows Update or legitimate application installations, which would typically not generate filenames including `\doit.bat`, `\execute.bat`, or `\servtask.bat`.

  - **Examine process parent-child relationships:** Analyze the process hierarchy to understand which parent process (notably suspicious ones) led to the creation of the files. System processes or known applications should be expected as parents of benign file creations.

  - **Check for scheduled tasks and startup programs:** Verify if any newly created files are linked with scheduled tasks or autostart mechanisms that could indicate persistence. Use `schtasks` or Task Manager to review task configurations.

  - **Validate application behavior post-alert:** If similar file names are detected under legitimate user actions (e.g., software updates), cross-reference Event ID 403 and 4608 for account usage patterns indicating authorized activity.

  ### Prioritization

  This alert is of high severity due to the critical role of the affected system in potentially allowing an attacker to maintain a foothold within the environment. The likelihood of malicious abuse is significant, given the association with a known APT group, and the nature of the detected behavior is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection is limited by the specifics of file creation events; if malware self-deletes files post-execution, these may evade detection. Also, not all environments may log detailed file event data or have Sysmon properly configured. Legitimate application updates can trigger similar alerts, such as vendor updates for Adobe or NVIDIA. A related detection to enhance coverage could involve monitoring for unusual outbound connections from processes that create files in the ProgramData directory.

