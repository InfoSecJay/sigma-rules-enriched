title: Forest Blizzard APT - File Creation Activity
id: b92d1d19-f5c9-4ed6-bbd5-7476709dc389
status: experimental
description: |
  Detects the creation of specific files inside of ProgramData directory.
  These files were seen being created by Forest Blizzard as described by MSFT.
references:
- https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-04-23
modified: 2024-07-11
tags:
- attack.defense-evasion
- attack.t1562.002
- detection.emerging-threats
logsource:
  category: file_event
  product: windows
detection:
  selection_programdata_driver_store:
    TargetFilename|startswith:
    - 'C:\ProgramData\Microsoft\v'
    - 'C:\ProgramData\Adobe\v'
    - 'C:\ProgramData\Comms\v'
    - 'C:\ProgramData\Intel\v'
    - 'C:\ProgramData\Kaspersky Lab\v'
    - 'C:\ProgramData\Bitdefender\v'
    - 'C:\ProgramData\ESET\v'
    - 'C:\ProgramData\NVIDIA\v'
    - 'C:\ProgramData\UbiSoft\v'
    - 'C:\ProgramData\Steam\v'
    TargetFilename|contains:
    - '\prnms003.inf_'
    - '\prnms009.inf_'
  selection_programdata_main:
    TargetFilename|startswith: 'C:\ProgramData\'
  selection_programdata_files_1:
    TargetFilename|endswith:
    - '.save'
    - '\doit.bat'
    - '\execute.bat'
    - '\servtask.bat'
        # Hashes|contains: '7d51e5cc51c43da5deae5fbc2dce9b85c0656c465bb25ab6bd063a503c1806a9' # Uncommon this if you collect hash information inf file events
  selection_programdata_files_2:
    TargetFilename|contains: '\wayzgoose'
    TargetFilename|endswith: '.dll'
  condition: selection_programdata_driver_store or (selection_programdata_main and
    1 of selection_programdata_files_*)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of specific files within the ProgramData directory on Windows operating systems, which are associated with the Forest Blizzard APT group. The attackers likely aim to maintain persistence, execute further malicious activities, or exfiltrate sensitive information. Through manipulating seemingly benign directories like ProgramData, they can blend in with legitimate processes and evade typical security measures.

  The primary tactics and techniques relevant to this detection include **Defense Evasion** (T1562.002), as the attackers attempt to hide their actions in commonly overlooked areas of the file system. They utilize custom file names that may align with legitimate applications, making it challenging for standard detection mechanisms to flag unauthorized changes. This tactic is often employed post-compromise for continuing to operate undetected within the environment.

  The best telemetry sources for this detection include **file event logs** from Windows systems. These logs will capture file creation events that can indicate unauthorized activity, particularly within the specified directories.

  ### Investigation Steps
  - **Review File Event Logs**: Examine recent file creation events in the `C:\ProgramData` directory, focusing on filenames and paths that match the detection rule's criteria. Look for patterns that deviate from normal operations.

  - **Correlate with Process Logs**: Check process creation logs around the timestamps of suspicious file creations. Identify any unusual processes or executables that initiated during the same timeframe, as they may indicate a malicious dropper or execution vector.

  - **Analyze File Hashes**: If available, check the hashes of the identified files against known malware signatures or reputation services. Pay special attention to any hashes that align with the signatures of File Creation activities linked to APT groups like Forest Blizzard.

  - **Investigate Related Network Activity**: Review network logs, particularly for outbound connections or unusual traffic patterns at the time of the file creation events. This may reveal if the newly created files are being used to exfiltrate data or call back to a command and control server.

  ### Prioritization
  Given the association with the Forest Blizzard APT group, which indicates a sophisticated and potentially state-sponsored threat, the alerts generated by this rule should be considered high severity. The likelihood of significant impact is elevated in enterprise environments where sensitive data may be targeted.

  ### Blind Spots and Assumptions
  This detection logic relies on the assumption that file event logging is properly configured and enabled on endpoints. If logging is inadequate or disabled, detection coverage will significantly diminish. Additionally, false positives are minimized, but the rule may miss newer or adapted methods used by threat actors that deviate from established patterns. Environments with custom applications or legitimate usage of the monitored directories should also be incorporated into an understanding of normal behavior to reduce alert fatigue.

