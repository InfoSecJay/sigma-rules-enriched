title: Forest Blizzard APT - File Creation Activity
id: b92d1d19-f5c9-4ed6-bbd5-7476709dc389
status: test
description: |
  Detects the creation of specific files inside of ProgramData directory.
  These files were seen being created by Forest Blizzard as described by MSFT.
references:
- https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-04-23
modified: 2024-07-11
tags:
- attack.defense-impairment
- attack.t1685.001
- detection.emerging-threats
logsource:
  category: file_event
  product: windows
detection:
  selection_programdata_driver_store:
    TargetFilename|startswith:
    - 'C:\ProgramData\Microsoft\v'
    - 'C:\ProgramData\Adobe\v'
    - 'C:\ProgramData\Comms\v'
    - 'C:\ProgramData\Intel\v'
    - 'C:\ProgramData\Kaspersky Lab\v'
    - 'C:\ProgramData\Bitdefender\v'
    - 'C:\ProgramData\ESET\v'
    - 'C:\ProgramData\NVIDIA\v'
    - 'C:\ProgramData\UbiSoft\v'
    - 'C:\ProgramData\Steam\v'
    TargetFilename|contains:
    - '\prnms003.inf_'
    - '\prnms009.inf_'
  selection_programdata_main:
    TargetFilename|startswith: 'C:\ProgramData\'
  selection_programdata_files_1:
    TargetFilename|endswith:
    - '.save'
    - '\doit.bat'
    - '\execute.bat'
    - '\servtask.bat'
        # Hashes|contains: '7d51e5cc51c43da5deae5fbc2dce9b85c0656c465bb25ab6bd063a503c1806a9' # Uncommon this if you collect hash information inf file events
  selection_programdata_files_2:
    TargetFilename|contains: '\wayzgoose'
    TargetFilename|endswith: '.dll'
  condition: selection_programdata_driver_store or (selection_programdata_main 
    and 1 of selection_programdata_files_*)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects file creation activities associated with the Forest Blizzard APT group. Specifically, it identifies files created within the ProgramData directory that exhibit specific naming patterns, which are indicative of this group’s post-compromise toolset designed to exploit vulnerabilities, such as CVE-2022-38028. The primary MITRE ATT&CK tactics at play include Defense Evasion (T1089) and Execution (T1203), highlighting both the attempts to obscure malicious activity and execute payloads. Key telemetry consists of Windows file event logs, particularly those monitoring file creations with accurate path specifications. If these activities are determined to be malicious, they could facilitate further credential theft or lateral movement within the network. Importantly, this detection alone does not confirm malicious intent without further context or corroborating evidence from additional logs.

  ### Investigation Steps

  - **Verify file creation paths:** Check for file creations in `C:\ProgramData\*` for any occurrences of file names like `\doit.bat`, `\servtask.bat`, or `.dll` files containing the term `\wayzgoose`. This can indicate potential malicious activity rather than expected behavior.

  - **Assess unusual file extensions:** Review alerts for file creations that include the extensions `.save` and any unexpected `.inf` files. New or modified files with these extensions could suggest malicious intent, especially when tied to known patterns.

  - **Inspect hashes for known malware:** If hash information is collected, cross-reference created file hashes with known malicious signatures, such as '7d51e5cc51c43da5deae5fbc2dce9b85c0656c465bb25ab6bd063a503c1806a9'. A match would indicate high confidence in a malicious file.

  - **Analyze historical file activity:** Examine the Windows File logs (Event ID 4663) to identify any prior occurrences of the detected file creation. Legitimate applications might regularly create files in the ProgramData area, whereas unusual spikes or the specific pattern detected can indicate an intrusion.

  - **Confirm user and process context:** Investigate the user account and process responsible for the file creation using Event ID 4688 (Process Creation). Identify if these actions were conducted by known administrative accounts or unusual service accounts, which may flag potential privilege escalation attempts.

  ### Prioritization

  This alert is high-priority due to its exploitation by a known APT group within the attack lifecycle, indicating significant risk to enterprise security. The behavior observed is correlated with credential acquisition and lateral movement tactics, making it likely to be malicious. Given the specificity of the file paths and names, it is less likely to be mistaken for benign activity.

  ### Blind Spots and Assumptions

  One limitation of this detection is the potential for legitimate applications to create files in the specified directories, leading to possible false positives. The effectiveness of this detection relies heavily on comprehensive file event logging configuration in the Windows environment. Additionally, attackers may employ obfuscation techniques or modify file paths to evade detection. Complementary detections might include monitoring for suspicious process creations or network connections initiated by files created in the ProgramData directory to enhance detection capabilities.

