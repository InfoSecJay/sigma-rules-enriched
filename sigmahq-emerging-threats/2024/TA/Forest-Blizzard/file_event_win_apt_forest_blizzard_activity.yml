title: Forest Blizzard APT - File Creation Activity
id: b92d1d19-f5c9-4ed6-bbd5-7476709dc389
status: test
description: |
  Detects the creation of specific files inside of ProgramData directory.
  These files were seen being created by Forest Blizzard as described by MSFT.
references:
- https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-04-23
modified: 2024-07-11
tags:
- attack.defense-evasion
- attack.t1562.002
- detection.emerging-threats
logsource:
  category: file_event
  product: windows
detection:
  selection_programdata_driver_store:
    TargetFilename|startswith:
    - 'C:\ProgramData\Microsoft\v'
    - 'C:\ProgramData\Adobe\v'
    - 'C:\ProgramData\Comms\v'
    - 'C:\ProgramData\Intel\v'
    - 'C:\ProgramData\Kaspersky Lab\v'
    - 'C:\ProgramData\Bitdefender\v'
    - 'C:\ProgramData\ESET\v'
    - 'C:\ProgramData\NVIDIA\v'
    - 'C:\ProgramData\UbiSoft\v'
    - 'C:\ProgramData\Steam\v'
    TargetFilename|contains:
    - '\prnms003.inf_'
    - '\prnms009.inf_'
  selection_programdata_main:
    TargetFilename|startswith: 'C:\ProgramData\'
  selection_programdata_files_1:
    TargetFilename|endswith:
    - '.save'
    - '\doit.bat'
    - '\execute.bat'
    - '\servtask.bat'
        # Hashes|contains: '7d51e5cc51c43da5deae5fbc2dce9b85c0656c465bb25ab6bd063a503c1806a9' # Uncommon this if you collect hash information inf file events
  selection_programdata_files_2:
    TargetFilename|contains: '\wayzgoose'
    TargetFilename|endswith: '.dll'
  condition: selection_programdata_driver_store or (selection_programdata_main and
    1 of selection_programdata_files_*)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects specific file creation activities in the `C:\ProgramData` directory associated with the Forest Blizzard APT group. These file creations are indicative of custom post-compromise tools utilized for exploiting vulnerabilities, such as CVE-2022-38028, to obtain credentials. The potential threat scenario involves an attacker leveraging compromised systems to install malicious files that aid in further exploitation, data exfiltration, or facilitating lateral movement within a network.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion** (TA0005) by attempting to hide malicious activities within a common directory used by legitimate applications. The techniques specifically listed are **Indicator Removal on Host** (T1562.002), where attackers may create benign-looking files to bypass detection mechanisms.

  Primary data sources for detecting this activity will include file event logs on Windows systems, which capture file creation events and identify suspicious filenames or paths that match the described patterns.

  ### Investigation Steps
  - **Review File Creation Logs**: Analyze recent file creation events in the `C:\ProgramData` directory for suspicious filenames, especially those starting with the specified prefixes and containing `_inf_` or common script extensions like `.bat`.

  - **Investigate File Hashes**: If available, check the hashes of the created files against known malicious indicators, especially any suspicious `.dll` files or those named with `_inf_`, as these could be tied to the Forest Blizzard APT activity.

  - **Verify Execution Attempts**: Check for execution attempts related to any discovered batch files (e.g., `doit.bat`, `execute.bat`, `servtask.bat`). Reviewing process execution logs can provide insight into whether these scripts were executed and by which process.

  - **Correlate with Network Activity**: Examine network connections initiated by processes that are creating these files, looking for unusual outbound connections or communications to known malicious command and control (C2) infrastructure.

  ### Prioritization
  This alert is considered high severity due to the critical nature of the actions associated with APT groups. The creation of files within protected directories can indicate an active compromise, potentially allowing attackers to maintain persistence and conduct further malicious activities within the enterprise network.

  ### Blind Spots and Assumptions
  One possible gap in detection coverage is the absence of file creation logs on systems where logging isn't properly configured or enabled. This means that if logs aren't being captured correctly, malicious actions may go undetected. Additionally, the detection logic assumes that the naming conventions provided are consistently used by the attacker; any deviations in file naming or locations could lead to missed detections. Ensuring that file event logging is enabled for all relevant endpoints will be crucial for this alert to function effectively.

