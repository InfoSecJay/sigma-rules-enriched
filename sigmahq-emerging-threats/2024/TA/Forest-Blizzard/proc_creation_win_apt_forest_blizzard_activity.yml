logsource:
  category: process_creation
  product: windows
detection:
  selection_hashes:
    Hashes|contains:
    - 'SHA256=6b311c0a977d21e772ac4e99762234da852bbf84293386fbe78622a96c0b052f'
    - 'SHA256=c60ead92cd376b689d1b4450f2578b36ea0bf64f3963cfa5546279fa4424c2a5'
  selection_schtasks_create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - 'Create'
    - '/RU'
    - 'SYSTEM'
    - '\Microsoft\Windows\WinSrv'
    CommandLine|contains:
    - 'servtask.bat'
    - 'execute.bat'
    - 'doit.bat'
  selection_schtasks_delete:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - 'Delete'
    - '/F '
    - '\Microsoft\Windows\WinSrv'
  selection_powershell:
    CommandLine|contains|all:
    - 'Get-ChildItem'
    - '.save'
    - 'Compress-Archive -DestinationPath C:\ProgramData\'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of specific processes related to the Forest Blizzard APT group, especially involving command-line activities with `schtasks.exe` and PowerShell. The likely attacker objective is to create and delete scheduled tasks to maintain persistence and potentially execute malicious scripts. The relevant MITRE ATT&CK tactics and techniques are Execution (T1203) and Command and Scripting Interpreter (T1047). The primary telemetry sources include Windows Process Creation logs (Event ID 4688) and might involve Sysmon logs if Sysmon is deployed (Event ID 1). If malicious, this behavior poses a high security risk by enabling unauthorized task scheduling, which could allow the execution of further malicious payloads. However, this detection does NOT confirm exploitation without additional contextual information.

  ### Investigation Steps

  - **Review process creation logs:** Check Security Event ID 4688 for processes executing `schtasks.exe`. Compare the command line against the defined patterns, particularly for "-Create" and "-Delete" actions with parameters targeting `\Microsoft\Windows\WinSrv`.

  - **Identify high-confidence malicious indicators:** Look for known hashes in the event logs matching the malicious SHA256 hashes, specifically `6b311c0a977d21e772ac4e99762234da852bbf84293386fbe78622a96c0b052f` and `c60ead92cd376b689d1b4450f2578b36ea0bf64f3963cfa5546279fa4424c2a5`.

  - **Analyze scheduled tasks registry:** Inspect the Task Scheduler in Windows for newly created tasks that match the naming conventions seen in the command line logs. Confirm if tasks link to any abnormal execution paths or scripts.

  - **Validate legitimate behavior:** Search for instances of `schtasks.exe` being used for standard operations, like scheduled updates or routine maintenance tasks. Expect to see common parameters and command structures without suspicious file names like `servtask.bat`.

  - **Monitor PowerShell command usage:** Check for PowerShell commands executing `Get-ChildItem` and `Compress-Archive -DestinationPath C:\ProgramData\`. Validate if they relate to legitimate administrative scripts or if they contain unauthorized content.

  ### Prioritization

  The alert should be considered high severity due to the potential impact on critical systems. The likelihood of abuse is significant, given that the behavior is indicative of tactics utilized by APT actors, specifically for persistence and exploitation. As the techniques detected are common among threat actors, prompt investigation is essential.

  ### Blind Spots and Assumptions

  The primary detection limitations include potential evasion techniques where malicious actors might modify command syntax or utilize obfuscated scripts. Reliable detection requires configuring appropriate logging on Windows systems, including ensuring Event ID 4688 and Sysmon Event ID 1 are active. Similar benign activities may occur during legitimate system administration. Another companion detection could involve monitoring for anomalous task scheduler access events (Event ID 4698) to enhance coverage against malicious uses.

