title: Forest Blizzard APT - Process Creation Activity
id: 07db928c-8632-488e-ac7d-3db847489175
status: experimental
description: |
  Detects the execution of specific processes and command line combination.
  These were seen being created by Forest Blizzard as described by MSFT.
references:
- https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-04-23
modified: 2025-01-22
tags:
- attack.defense-evasion
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_hashes:
    Hashes|contains:
    - 'SHA256=6b311c0a977d21e772ac4e99762234da852bbf84293386fbe78622a96c0b052f'
    - 'SHA256=c60ead92cd376b689d1b4450f2578b36ea0bf64f3963cfa5546279fa4424c2a5'
  selection_schtasks_create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - 'Create'
    - '/RU'
    - 'SYSTEM'
    - '\Microsoft\Windows\WinSrv'
    CommandLine|contains:
    - 'servtask.bat'
    - 'execute.bat'
    - 'doit.bat'
  selection_schtasks_delete:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - 'Delete'
    - '/F '
    - '\Microsoft\Windows\WinSrv'
  selection_powershell:
    CommandLine|contains|all:
    - 'Get-ChildItem'
    - '.save'
    - 'Compress-Archive -DestinationPath C:\ProgramData\'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is specifically designed to identify process creation activities related to the Forest Blizzard APT group, which utilizes custom post-compromise tools to exploit vulnerabilities for credential theft, particularly referenced around CVE-2022-38028. The rule focuses on detecting certain command line parameters and processes, such as the use of `schtasks.exe` for creating or deleting scheduled tasks, along with specific batch file executions and PowerShell commands associated with adversarial activities. The malicious objective generally revolves around maintaining persistence, executing commands, and obfuscating actions in a Windows environment.

  The relevant MITRE ATT&CK tactics associated with this detection include:
  - **Execution** (TA0002): The adversary is executing malicious scripts and processes.
  - **Defense Evasion** (TA0005): The use of legitimate tools (like `schtasks.exe` and PowerShell) represents an evasion technique to blend malicious activities within normal administrative actions.

  Primary data sources for this detection will include Windows process creation events, focusing on the execution of `schtasks.exe` and PowerShell commands. Logs that record command line arguments and the associated hashes of executing binaries will provide the best evidence to support investigations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze Windows process creation logs, specifically looking for instances of `schtasks.exe` and its command line arguments that match the detection criteria, including the specified batch files and parameters.

  - **Cross-Reference Hashes**: Validate the integrity of any executing files by comparing their SHA256 hashes against known malicious hashes documented for Forest Blizzard activities. Collect the hashes from associated logs.

  - **Analyze PowerShell Command Logs**: Investigate PowerShell execution logs for command lines containing `Get-ChildItem` and `Compress-Archive -DestinationPath C:\ProgramData\`. Look for any unusual patterns or deviations from typical administrative usage.

  - **Identify Affected Systems**: Determine which systems were affected by this activity and assess their roles within the enterprise environment to evaluate potential impacts and the scope of intrusion.

  ### Prioritization
  The alert is classified as high severity due to the serious implications of credential theft and possible further exploitation of compromised systems. The likelihood of this being part of an active APT operation escalates its urgency, necessitating immediate investigation and response to mitigate any broader incidents.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage due to potential variations in command line arguments or alternate methods used by Forest Blizzard that do not match the defined patterns. The detection logic assumes that logs for process creation and PowerShell commands are adequately captured and retained. Any configurations or policies disabling command line logging may hinder the effectiveness of detection. Additionally, there exists an assumption that the identified malicious hashes are not modified before execution, which could hinder their detection.

