title: Forest Blizzard APT - Process Creation Activity
id: 07db928c-8632-488e-ac7d-3db847489175
status: experimental
description: |
  Detects the execution of specific processes and command line combination.
  These were seen being created by Forest Blizzard as described by MSFT.
references:
- https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-04-23
modified: 2025-01-22
tags:
- attack.defense-evasion
- attack.execution
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_hashes:
    Hashes|contains:
    - 'SHA256=6b311c0a977d21e772ac4e99762234da852bbf84293386fbe78622a96c0b052f'
    - 'SHA256=c60ead92cd376b689d1b4450f2578b36ea0bf64f3963cfa5546279fa4424c2a5'
  selection_schtasks_create:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - 'Create'
    - '/RU'
    - 'SYSTEM'
    - '\Microsoft\Windows\WinSrv'
    CommandLine|contains:
    - 'servtask.bat'
    - 'execute.bat'
    - 'doit.bat'
  selection_schtasks_delete:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
    - 'Delete'
    - '/F '
    - '\Microsoft\Windows\WinSrv'
  selection_powershell:
    CommandLine|contains|all:
    - 'Get-ChildItem'
    - '.save'
    - 'Compress-Archive -DestinationPath C:\ProgramData\'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of specific processes and command-line combinations associated with the Forest Blizzard APT group's activities. The likely attacker objective is to create, modify, or delete scheduled tasks using `schtasks.exe`, as well as to compress sensitive data for exfiltration through PowerShell commands. Relevant MITRE ATT&CK techniques include **T1053: Scheduled Task/Job** and **T1140: Deobfuscate/Decode Files or Information**. Primary telemetry sources are Windows process creation logs, targeting specific Event IDs such as *4688* for process creation and PowerShell execution logs. The potential security impact includes unauthorized access and data exfiltration, compromising system integrity and confidentiality. This detection does not confirm that the identified process is malicious on its own, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Review Event ID 4688 logs**: Check for processes matching the specified SHA256 hashes. Focus on the `Image` and `CommandLine` fields for exact matches. Any instance of the indicated hashes signifies potential malicious activity.

  - **Analyze PowerShell command executions**: Look for PowerShell logs (Event ID 4104) containing keywords `Get-ChildItem .save Compress-Archive -DestinationPath C:\ProgramData\`. Legitimate usage might involve typical administrative functions without these specific components.

  - **Correlate scheduled task modifications**: Investigate recent Event ID 4698 (Task Created) and 4706 (Task Updated) logs for tasks named `servtask.bat`, `execute.bat`, and `doit.bat` under the `\Microsoft\Windows\WinSrv` path. Monitor for should-be-deleted tasks that may correspond to the illegitimate scheduled task deletion.

  - **Identify unusual `schtasks.exe` activity**: Examine logs for any `schtasks.exe` execution that contains `Create` or `Delete` parameters alongside `/RU SYSTEM`. Any discrepancies from normal operational patterns indicate a higher probability of malicious intent.

  - **Evaluate system context and role**: Determine the role of the affected system. If it is a critical server, prioritize further forensic analysis. Assess whether such scheduled tasks are common for that server's operation.

  ### Prioritization

  Given the high impact of affected systems like servers or domain controllers, the likelihood of malicious abuse is significant, especially given the refined tactics seen in associated APT activity. This behavior is not typical in a well-secured environment and aligns with common attack patterns.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as obfuscating command-line parameters or using legitimate accounts. Required logs include a full set of Windows Event logs for accurate analysis, particularly focusing on process creation and scheduled task actions. Legitimate activities that might trigger the alert include standard administrative processes or system maintenance when utilizing `schtasks.exe`. Companion detections may include monitoring for suspicious PowerShell commands or usage patterns, strengthening the overall detection landscape.

