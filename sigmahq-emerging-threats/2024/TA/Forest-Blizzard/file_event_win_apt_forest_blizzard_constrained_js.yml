title: Forest Blizzard APT - JavaScript Constrained File Creation
id: ec7c4e9b-9bc9-47c7-a32f-b53b598da642
status: test
description: |
  Detects the creation of JavaScript files inside of the DriverStore directory.
  Forest Blizzard used this to exploit the CVE-2022-38028 vulnerability in Windows Print Spooler service by modifying a JavaScript constraints file and executing it with SYSTEM-level permissions.
references:
- https://www.microsoft.com/en-us/security/blog/2024/04/22/analyzing-forest-blizzards-custom-post-compromise-tool-for-exploiting-cve-2022-38028-to-obtain-credentials/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-04-23
tags:
- attack.defense-evasion
- attack.t1562.002
- detection.emerging-threats
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|startswith: 'C:\Windows\System32\DriverStore\FileRepository\'
    TargetFilename|endswith: '\.js'
  condition: selection
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of JavaScript files in the Windows DriverStore directory, a technique attributed to the Forest Blizzard APT group. This group is known to exploit the CVE-2022-38028 vulnerability within the Windows Print Spooler service, allowing for the execution of arbitrary code with SYSTEM-level permissions. By creating malicious JavaScript files, attackers can manipulate the system and potentially gain further access or escalate privileges.

  The relevant MITRE ATT&CK tactics include **Defense Evasion (T1562.002)**, which encompasses strategies used by adversaries to avoid detection or to maneuver through secured environments. By modifying JavaScript constraint files, attackers can bypass security measures that may flag non-standard file operations or unexpected behaviors.

  Primary data sources for this detection include Windows file event logs that track file creation activities, providing insight into unauthorized modifications within sensitive directories. Monitoring these logs is crucial for a comprehensive understanding of file-based attacks targeting system-level resources.

  ### Investigation Steps
  - **Review File Creation Logs**: Examine Windows file event logs for entries capturing JavaScript file creations within the DriverStore directory. Check timestamps, filenames, and associated user accounts for abnormal patterns.

  - **Analyze Parent Processes**: Investigate the process tree related to the JavaScript file creation. Determine if any suspicious processes initiated the file creation, as this could indicate compromise or exploitation of vulnerabilities.

  - **Correlation with Print Spooler Activity**: Look for any related activities or anomalies involving the Windows Print Spooler service around the time of the JavaScript file creation. Assess if there were unauthorized Print Spooler actions that could connect to the exploitation of CVE-2022-38028.

  - **Inspect System Configurations**: Validate system configurations and security controls for potential weaknesses or misconfigurations that could have facilitated this file creation. Ensure that logging and monitoring settings are properly configured for critical directories.

  ### Prioritization
  The severity of this alert is considered medium because even though the direct creation of JavaScript files in a sensitive directory is a significant indicator of potential exploitation, the actual impact on the environment is dependent on subsequent actions taken by the attacker and existing defenses in place.

  ### Blind Spots and Assumptions
  This detection may miss instances where JavaScript files are created in other directories or through different methods of file creation that do not involve the DriverStore. It assumes logging is adequately configured to capture file events for all user contexts, particularly for SYSTEM-level actions. Additionally, if there are other legitimate services or applications that modify JavaScript files in this directory, these could lead to false negatives or positives unless properly analyzed. Ensuring comprehensive logging of process activities and file interactions is essential for accurate detection.

