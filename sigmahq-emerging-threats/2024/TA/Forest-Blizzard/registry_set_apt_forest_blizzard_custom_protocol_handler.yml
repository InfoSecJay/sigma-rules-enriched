note: |
  ### Technical Context

  This rule detects the creation of a custom protocol handler named "rogue" within the Windows Registry, specifically under the path `\PROTOCOLS\Handler\rogue\CLSID`. This behavior is indicative of an attacker establishing persistence on a compromised host, typically for the purpose of enabling remote command execution or persistence through a malicious protocol handler. This activity directly aligns with the MITRE ATT&CK tactics of Persistence (TA0003) and Privilege Escalation (TA0004), specifically technique T1547.001 (Registry Run Keys / Startup Folder).

  The primary telemetry source for this detection is Windows Registry activity logged as `registry_set` events. The potential security impact is significant; if malicious, it can enable the attacker to execute arbitrary code whenever the protocol is invoked. Importantly, this detection does NOT confirm that the handler is being actively exploited or invoked; it merely indicates that a potentially malicious change has been made to the registry.

  ### Investigation Steps

  - **Check Registry Entries for the Handler: ** Investigate the registry path `HKEY_CLASSES_ROOT\PROTOCOLS\Handler\rogue\CLSID` to find creation timestamps and any associated command-line parameters. A legitimate entry should not exist unless you have prior knowledge of its use.

  - **Review Process Creation Logs: ** Look for Security Event ID 4688 (Process Creation) or Sysmon Event ID 1 for new processes that might be initiated by this custom handler. Check the command line for unusual arguments or paths indicative of malicious activity.

  - **Examine User Activities: ** Review recent user actions around the time of the registry change using Event ID 4624 (Logon) to assess whether the modification was made by legitimate administrative users versus potentially compromised accounts.

  - **Cross-reference with Known Bad Indicators:** Cross-check the creation of the handler with threat intelligence databases to confirm if the GUID `{026CC6D7-34B2-33D5-B551-CA31EB6CE345}` is associated with known malicious activity or actors like Forest Blizzard APT.

  - **Look for Network Activity Related to the Protocol:** Review network logs, particularly DNS queries or HTTP requests that might be related to the "rogue" handler, as this may indicate external communication attempts by the malicious code.

  ### Prioritization

  This alert is high-severity due to its potential impact on system integrity and ability to be exploited for remote code execution. Given that the creation of custom protocol handlers can be a common tactic among attackers for establishing persistence, the likelihood of this behavior being leveraged for malicious purposes is elevated.

  ### Blind Spots and Assumptions

  Detection may be limited by the logging configuration; if Registry auditing is not enabled, crucial telemetry may be absent. Additionally, legitimate applications may create custom protocol handlers for benign reasons, which could trigger this alert. Related detections to consider include changes to `Run` keys in the registry (T1547.001) for additional context on persistence mechanisms.

