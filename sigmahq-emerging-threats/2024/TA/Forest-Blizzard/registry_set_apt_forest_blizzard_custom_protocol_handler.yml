note: |
  ### Technical Context
  This rule detects the creation of a custom protocol handler named "rogue" in the Windows registry, which has been associated with the Forest Blizzard APT. This threat actor has been reported to exploit vulnerabilities and establish persistent access on compromised systems. The creation of unique protocol handlers typically serves as a mechanism for attackers to bypass security controls, facilitating command and control or data exfiltration post-compromise.

  The relevant MITRE ATT&CK techniques for this activity include **T1547.001: Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder**, indicating the establishment of persistence on the system. By monitoring the registry for unusual entries related to protocol handlers, security teams can identify potential indicators of compromise that may lead back to malicious activity associated with this APT group.

  Primary data sources for this detection rule will include **Windows registry modification logs**, which reflect changes made to registry keys, particularly those related to protocol handlers and CLSIDs.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate the Windows registry for the creation and configuration of the "rogue" protocol handler under `\PROTOCOLS\Handler\`. Look for values and keys that reference unusual CLSIDs.
  - **Examine Process Activity**: Check for any processes that leverage the custom protocol handler shortly after creation. Pay special attention to any parent-child relationships that may indicate malicious execution patterns.
  - **Analyze Network Traffic**: Capture and analyze network traffic that may be initiated through the rogue protocol. Look for indicators of command and control activities or unusual outbound connections.
  - **Check for Additional Persistence Mechanisms**: Scrutinize other related autostart locations (e.g., Services, Scheduled Tasks) to identify any other persistence techniques aligning with APT behavior that may accompany the creation of the custom protocol handler.

  ### Prioritization
  The severity of this alert is high because the creation of a custom protocol handler can indicate a significant security threat, suggesting that an attacker has gained persistent access and is potentially exploiting it for malicious purposes. Given the associated risks, prompt investigation is warranted to mitigate any further compromise.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may include other stealthy persistence mechanisms not associated with custom protocol handlers, as the alert specifically targets a singular registry entry. The detection logic assumes that adversaries will use the specific name "rogue" for their protocol handler. Additionally, the monitoring of Windows registry changes must be correctly configured, as missing logs or improper permissions could lead to the inability to capture and alert on these critical modifications.

