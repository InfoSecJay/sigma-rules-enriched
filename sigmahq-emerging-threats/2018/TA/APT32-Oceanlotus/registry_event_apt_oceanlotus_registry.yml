logsource:
  category: registry_event
  product: windows
detection:
  selection_clsid:
    TargetObject|contains: '\SOFTWARE\Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_hkcu:
    TargetObject|contains:
            # HKCU\SOFTWARE\Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\
    - 'Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\'
            # HKCU\SOFTWARE\Classes\AppX3bbba44c6cae4d9695755183472171e2\
    - 'Classes\AppX3bbba44c6cae4d9695755183472171e2\'
            # HKCU\SOFTWARE\Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\
    - 'Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\'
    - 'Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_appx_1:
    TargetObject|contains: '\SOFTWARE\App\'
  selection_appx_2:
    TargetObject|contains:
    - 'AppXbf13d4ea2945444d8b13e2121cb6b663\'
    - 'AppX70162486c7554f7f80f481985d67586d\'
    - 'AppX37cc7fdccd644b4f85f4b22d5a3f105a\'
    TargetObject|endswith:
    - 'Application'
    - 'DefaultIcon'
  condition: selection_clsid or selection_hkcu or all of selection_appx_*
falsepositives:
- Unknown
level: critical
note: |
  ---

  ### Technical Context

  This rule detects the creation of specific Windows registry keys associated with OceanLotus (APT32) activity, which can indicate an advanced persistent threat (APT) aiming to maintain persistence within a compromised environment. The attacker might target sensitive systems to gather intelligence or establish a foothold for further exploitation. This behavior aligns with the MITRE ATT&CK tactic of "Persistence" (TA0003) and the technique of "Registry Run Keys / Startup Folder" (T1112).

  The primary telemetry for this detection comes from Windows registry event logs that capture registry modifications. If malicious, this can lead to unauthorized access to sensitive data or control over critical systems. It’s essential to note that this detection alone does not confirm that the registry key activity is malicious without additional context.

  ---

  ### Investigation Steps

  - **Review registry event logs:** Check Windows Event ID 4657 (Registry value modified) and Event ID 4663 (An object was accessed) for the specific registry paths, including `HKCU\SOFTWARE\Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model` and others mentioned in the detection.

  - **Identify abnormal applications:** Look for unusual or non-standard applications associated with the registry keys. Legitimate applications typically have established signatures and expected behaviors. Validate against known applications within your environment.

  - **Cross-reference process creation logs:** Utilize Windows Event ID 4688 (A new process has been created) to identify any processes that were running concurrently with the registry key creation. Analyze their path and signed status to assess for malicious indicators.

  - **Investigate user activity:** Check the `Account Name` and `Subject User Name` fields in the registry event logs for any suspicious or unfamiliar user accounts that could indicate unauthorized access.

  - **Assess system role significance:** Consider the criticality of the affected system. If the registry keys were created on domain controllers or highly sensitive servers, escalate the investigation process due to the increased risk.

  - **Verify against external threat intelligence:** Reference known IOC lists related to OceanLotus to check if the detected registry activity aligns with reported malicious behaviors from threat intelligence feeds.

  ---

  ### Prioritization

  This alert should be treated with high priority due to its association with known APT behavior and the potential impact on critical systems. The likelihood of this technique being weaponized by adversaries is significant, particularly in targeted campaigns against high-value corporate entities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation or other evasion techniques employed by advanced adversaries, such as renaming or disguising the applications interacting with the registry. Ensure that registry auditing is configured properly to capture all relevant changes. Legitimate software installations, updates, or user actions may trigger alerts due to their similar registry modifications. Companion detections such as process creation events (Event ID 4688) enhance coverage on potential malicious activities following registry changes.

