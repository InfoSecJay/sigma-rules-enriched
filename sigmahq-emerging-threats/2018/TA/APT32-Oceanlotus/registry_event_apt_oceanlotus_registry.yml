logsource:
  category: registry_event
  product: windows
detection:
  selection_clsid:
    TargetObject|contains: '\SOFTWARE\Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_hkcu:
    TargetObject|contains:
            # HKCU\SOFTWARE\Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\
    - 'Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\'
            # HKCU\SOFTWARE\Classes\AppX3bbba44c6cae4d9695755183472171e2\
    - 'Classes\AppX3bbba44c6cae4d9695755183472171e2\'
            # HKCU\SOFTWARE\Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\
    - 'Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\'
    - 'Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_appx_1:
    TargetObject|contains: '\SOFTWARE\App\'
  selection_appx_2:
    TargetObject|contains:
    - 'AppXbf13d4ea2945444d8b13e2121cb6b663\'
    - 'AppX70162486c7554f7f80f481985d67586d\'
    - 'AppX37cc7fdccd644b4f85f4b22d5a3f105a\'
    TargetObject|endswith:
    - 'Application'
    - 'DefaultIcon'
  condition: selection_clsid or selection_hkcu or all of selection_appx_*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This rule detects the creation of specific Windows registry keys associated with OceanLotus (APT32) malicious activity. The examination of these registry keys often indicates an intrusion that aims to establish persistence on compromised systems, allowing the adversary to maintain access and control. This detection falls under the MITRE ATT&CK framework within the Persistence tactic (TA0003), specifically Techniques T1112 (Modify Registry). The primary telemetry source for this alert is Windows registry event logs, specifically those involving registry key modifications. If malicious, the security impact is significant; it may indicate a breach leading to data exfiltration or further compromise. Importantly, this detection does not confirm the actual execution of malicious software on its own.

  ### Investigation Steps

  - **Verify registry key creation timestamps**: Check the creation timestamps of the detected keys against known good baselines and recent changes to system configurations. Use Registry Event Logs (Event ID 4657) to provide context.

  - **Identify process associations**: Review processes created around the time the registry keys were modified. Look specifically for Process Creation Logs (Event ID 4688) that reference unusual executables or scripts initiated shortly after registry changes.

  - **Audit legitimate AppX installs**: Review the entries under `HKCU\SOFTWARE\App\` to confirm if these keys correspond with legitimate AppX installs or updates. Legitimate entries generally relate to user-installed applications through the Windows Store.

  - **Correlate with known threat indicators**: Check the detected keys against established repository sources of OceanLotus indicators (e.g., use the provided GitHub IOCs). Any match should heighten suspicion and warrant further investigation.

  - **Evaluate system roles and criticality**: Assess the role of the impacted asset within the environment. High-privilege systems or critical infrastructure assets demand a higher urgency of response.

  - **Investigate user accounts**: Analyze user activity logs for any anomalous behavior or unauthorized access related to accounts with administrative privileges in conjunction with registry activity.

  ### Prioritization

  The alert severity is critical due to the potential impact stemming from a compromised system that can lead to persistent access by an advanced threat actor. Given that APT32 employs sophisticated techniques, the likelihood of malicious abuse is high, particularly in organizations targeted for intellectual property theft or espionage activities.

  ### Blind Spots and Assumptions

  Detection may be limited by the availability of registry change logs, requiring proper configurations for comprehensive monitoring. Evasion techniques could involve legitimate applications that are misconfigured or established by users, potentially leading to false positives. Monitoring for companion detections, such as unusual network connections (e.g., external callbacks made by abnormal or unrecognized processes), would strengthen coverage and context for this activity.

