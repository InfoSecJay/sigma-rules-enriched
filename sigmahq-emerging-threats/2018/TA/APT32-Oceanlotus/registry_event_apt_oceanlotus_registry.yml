title: OceanLotus Registry Activity
id: 4ac5fc44-a601-4c06-955b-309df8c4e9d4
status: test
description: Detects registry keys created in OceanLotus (also known as APT32) attacks
references:
- https://www.welivesecurity.com/2019/03/20/fake-or-fake-keeping-up-with-oceanlotus-decoys/
- https://github.com/eset/malware-ioc/tree/master/oceanlotus
author: megan201296, Jonhnathan Ribeiro
date: 2019-04-14
modified: 2023-09-28
tags:
- attack.defense-evasion
- attack.t1112
- detection.emerging-threats
logsource:
  category: registry_event
  product: windows
detection:
  selection_clsid:
    TargetObject|contains: '\SOFTWARE\Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_hkcu:
    TargetObject|contains:
            # HKCU\SOFTWARE\Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\
    - 'Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\'
            # HKCU\SOFTWARE\Classes\AppX3bbba44c6cae4d9695755183472171e2\
    - 'Classes\AppX3bbba44c6cae4d9695755183472171e2\'
            # HKCU\SOFTWARE\Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\
    - 'Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\'
    - 'Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_appx_1:
    TargetObject|contains: '\SOFTWARE\App\'
  selection_appx_2:
    TargetObject|contains:
    - 'AppXbf13d4ea2945444d8b13e2121cb6b663\'
    - 'AppX70162486c7554f7f80f481985d67586d\'
    - 'AppX37cc7fdccd644b4f85f4b22d5a3f105a\'
    TargetObject|endswith:
    - 'Application'
    - 'DefaultIcon'
  condition: selection_clsid or selection_hkcu or all of selection_appx_*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule is designed to identify specific registry activities associated with OceanLotus, also known as APT32, a sophisticated group recognized for their cyber espionage operations. The rule focuses on the creation of specific registry keys that are typical indicators of compromise in environments that have been targeted by this actor. By leveraging these registry manipulations, attackers may attempt to persist malicious software, facilitate command-and-control communications, or obfuscate their operational footprints, ultimately aiming to exfiltrate sensitive data or establish long-term access to compromised systems.

  OceanLotus operates with techniques aligned with various MITRE ATT&CK tactics, primarily under "Defense Evasion" (T1070 - Indicator Removal on Host) and "Persistence" (T1112 - Modify Registry). Identifying these registry changes is crucial for early detection of potential breaches associated with this threat group. The data sources for this detection include Windows registry event logs, which can capture these changes when they occur, allowing security teams to respond swiftly upon detection of anomalies.

  ### Investigation Steps
  - **Review Registry Logs:** Analyze Windows registry event logs for entries closely associated with the specific keys identified in the detection rule to determine if they are legitimate or indicative of malicious activity.
  - **Investigate Process Activities:** Correlate registry changes with process creation logs to identify any associated executable behavior, focusing on unusual processes or parent-child relationships that deviate from normal usage patterns.
  - **Examine Network Connections:** Check for any outbound network connections or unusual communication patterns originating from systems that have exhibited these registry changes, as these may indicate command-and-control activity.
  - **Assess User Behavior:** Evaluate user activity related to the timelines of the registry changes, looking for any irregular logons or unexpected administrative changes that could suggest compromised user accounts or privilege escalation attempts.

  ### Prioritization
  The severity of this alert is critical due to OceanLotus's established history of targeting organizations for espionage and data theft. The potential impact of a successful compromise could include loss of sensitive data and significant damage to the organization’s reputation.

  ### Blind Spots and Assumptions
  This detection logic may not fully cover all tactics employed by OceanLotus, particularly if the attacker utilizes similar registry keys or obfuscation techniques that are not captured in this rule. It assumes that complete registry event logging is enabled and configured to record all relevant modifications, which may not be the case in all environments. Analysts should ensure that their logging configurations are sufficient to support this detection and consider integrating additional telemetry sources for comprehensive coverage.

