logsource:
  category: registry_event
  product: windows
detection:
  selection_clsid:
    TargetObject|contains: '\SOFTWARE\Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_hkcu:
    TargetObject|contains:
            # HKCU\SOFTWARE\Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\
    - 'Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\'
            # HKCU\SOFTWARE\Classes\AppX3bbba44c6cae4d9695755183472171e2\
    - 'Classes\AppX3bbba44c6cae4d9695755183472171e2\'
            # HKCU\SOFTWARE\Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\
    - 'Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\'
    - 'Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_appx_1:
    TargetObject|contains: '\SOFTWARE\App\'
  selection_appx_2:
    TargetObject|contains:
    - 'AppXbf13d4ea2945444d8b13e2121cb6b663\'
    - 'AppX70162486c7554f7f80f481985d67586d\'
    - 'AppX37cc7fdccd644b4f85f4b22d5a3f105a\'
    TargetObject|endswith:
    - 'Application'
    - 'DefaultIcon'
  condition: selection_clsid or selection_hkcu or all of selection_appx_*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the creation of specific registry keys associated with OceanLotus (also known as APT32) attacks. The objective of such behavior is often to maintain persistence on compromised systems or to create backdoors for further exploitation. This falls under the MITRE ATT&CK technique T1112: Modifying Registry. The primary telemetry source is Windows Registry event logs, specifically focusing on registry key creation or modification events.

  If malicious, this behavior indicates a potential compromise, allowing attackers to persistently access or control the affected system. It is important to note that this detection does NOT confirm an active compromise on its own; further investigation is required to understand the context and intent behind the detected registry modifications.

  ### Investigation Steps

  - **Confirm the registry modification timestamp**: Check the TargetObject field in the registry event logs (Event ID 4657) for the creation of keys under `HKCU\SOFTWARE\Classes\`, specifically for entries matching the specified AppX GUIDs and CLSIDs. Note the timestamps; legitimate software installations may create similar keys.

  - **Identify the user associated with the activity**: Cross-reference the event's Logon ID and User field from the registry event logs (Event ID 4657) to establish the user account responsible for the modification. Legitimate activities often occur under known administrative accounts or during software installations.

  - **Check for additional suspicious behavior**: Review security event logs (Event ID 4688) for new processes spawned shortly before or after the registry changes. Focus on indicators like PowerShell or CMD execution that may coincide with registry modifications, as these could signal execution of a malicious payload.

  - **Examine for malicious executables or configurations**: Look for unusual binaries or executables in common directories, especially those corresponding to the registry keys (e.g., directories highlighted in the TargetObject). Validate their hashes against known malicious signatures.

  - **Review asset criticality based on context**: Assess the affected system's role within the infrastructure. If the detection occurs on a high-privilege asset or a system with sensitive data, escalate for immediate remediation.

  - **Correlate with other detection mechanisms**: Investigate other related detections to confirm if there's a pattern indicating a larger campaign, such as network logs pointing to unusual outbound connections or other registry creation patterns detected in the environment.

  ### Prioritization

  The alert is critical due to the potential for a compromised system to be used for persistent access or further exploitation. The likelihood of this behavior being malicious is high, given the historical context of OceanLotus's tactics, which frequently target organizational data. This specific registry activity is not common in legitimate operations, emphasizing its potential danger.

  ### Blind Spots and Assumptions

  Detection limitations may arise if logging levels for Windows registry events are not adequately configured, leading to missed registry modifications. Legitimate software installations or updates could unintentionally trigger this alert, necessitating contextual understanding of the environment. A related detection that strengthens coverage could include monitoring for suspicious application installations or network traffic anomalies, providing further context for the registry changes.

