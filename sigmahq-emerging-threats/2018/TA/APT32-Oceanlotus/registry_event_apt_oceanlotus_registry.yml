title: OceanLotus Registry Activity
id: 4ac5fc44-a601-4c06-955b-309df8c4e9d4
status: test
description: Detects registry keys created in OceanLotus (also known as APT32) attacks
references:
- https://www.welivesecurity.com/2019/03/20/fake-or-fake-keeping-up-with-oceanlotus-decoys/
- https://github.com/eset/malware-ioc/tree/master/oceanlotus
author: megan201296, Jonhnathan Ribeiro
date: 2019-04-14
modified: 2023-09-28
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
- detection.emerging-threats
logsource:
  category: registry_event
  product: windows
detection:
  selection_clsid:
    TargetObject|contains: '\SOFTWARE\Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_hkcu:
    TargetObject|contains:
            # HKCU\SOFTWARE\Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\
    - 'Classes\AppXc52346ec40fb4061ad96be0e6cb7d16a\'
            # HKCU\SOFTWARE\Classes\AppX3bbba44c6cae4d9695755183472171e2\
    - 'Classes\AppX3bbba44c6cae4d9695755183472171e2\'
            # HKCU\SOFTWARE\Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\
    - 'Classes\CLSID\{E3517E26-8E93-458D-A6DF-8030BC80528B}\'
    - 'Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model'
  selection_appx_1:
    TargetObject|contains: '\SOFTWARE\App\'
  selection_appx_2:
    TargetObject|contains:
    - 'AppXbf13d4ea2945444d8b13e2121cb6b663\'
    - 'AppX70162486c7554f7f80f481985d67586d\'
    - 'AppX37cc7fdccd644b4f85f4b22d5a3f105a\'
    TargetObject|endswith:
    - 'Application'
    - 'DefaultIcon'
  condition: selection_clsid or selection_hkcu or all of selection_appx_*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies potentially malicious registry activities associated with OceanLotus, also known as APT32. OceanLotus is a suspected state-sponsored threat actor from Vietnam that has been observed targeting various industries with sophisticated malware and tactics. The rule focuses on specific registry keys typically created during an intrusion, revealing attempts at establishing persistence or obfuscating their presence. Attackers leveraging OceanLotus likely aim to gather intelligence, maintain access, or deploy further malicious payloads within an organization's infrastructure.

  Relevant tactics and techniques from the MITRE ATT&CK framework include:
  - **Persistence (T1547)**: Creating registry keys to maintain malware execution after system reboots.
  - **Defense Evasion (T1112)**: Modifying system settings to evade detection.

  The primary data sources for this detection involve Windows registry event logs that can show the creation and modification of registry keys, which are crucial for understanding unauthorized changes on a system.

  ### Investigation Steps
  - **Review Registry Events**: Examine the Windows registry event logs for keys matching the specific signatures outlined in the detection rule (e.g., `\SOFTWARE\Classes\CLSID\{E08A0F4B-1F65-4D4D-9A09-BD4625B9C5A1}\Model`).
  - **Analyze Process Creation Logs**: Investigate process creation events around the same timeframe to identify any unusual processes that may have been spawned alongside the registry modifications.
  - **Check for Network Connections**: Look for any network connections that align with the timestamps of the registry changes, especially to known malicious endpoints associated with OceanLotus campaign activities.
  - **Assess User Activity**: Verify user activity during the time the registry entries were created to discern whether the actions align with legitimate administrative tasks or indicate potential compromise.

  ### Prioritization
  This alert is classified as critical due to the heightened risk posed by OceanLotus attacks, which can lead to significant data breaches or system compromises. The likelihood of exploitation is concerning, especially in sectors handling sensitive information.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage could be the absence of comprehensive registry event logging for every endpoint, which may lead to missed detections if logs are not enabled by default. The detection logic assumes that the relevant registry keys will be created on compromised hosts and does not consider legitimate administrative actions that may also generate similar entries. For the detection to be effective, it is essential that registry event logging is adequately configured and retained for sufficient historical review.

