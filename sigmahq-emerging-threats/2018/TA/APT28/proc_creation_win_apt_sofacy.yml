logsource:
  category: process_creation
  product: windows
detection:
  selection_path:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
    - '%LOCALAPPDATA%'
    - '\AppData\Local\'
  selection_extensions:
  - CommandLine|contains: '.dat",'
  - CommandLine|endswith:
    - '.dll #1'
    - '.dll" #1'
    - '.dll",#1'
  filter_main_exclude_temp:
    CommandLine|contains: '\AppData\Local\Temp\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies malicious activity associated with the Sofacy Trojan, a known tool leveraged by the APT28 threat group. Specifically, it targets the execution of `rundll32.exe` with command lines indicative of malicious intent, typically associated with the loading of payloads or execution of second-stage malware through DLLs. Attackers using this technique often aim to maintain persistence within a network or to execute additional payloads and commands under the radar by masquerading legitimate processes.

  The relevant MITRE ATT&CK tactics and techniques for this rule include:
  - **Execution (TA0002)**, specifically through `Command-Line Interface (T1059.003)` where the attacker manipulates command line interfaces to execute scripts and commands, and
  - **Defense Evasion (TA0005)** using `Server Software Component (T1218.011)` to execute malicious code.

  Primary data sources likely to yield valuable evidence are process creation event logs, where details about executed processes, command line arguments, and associated images can be found. Analyzing these logs will aid analysts in identifying abnormal or suspicious command lines that deviate from standard operational behavior.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for instances of `rundll32.exe` being executed. Pay close attention to the command line arguments to identify unusual parameters, particularly those containing paths to `%LOCALAPPDATA%` or files executed from temporary directories.

  - **Examine Command Line Patterns:** Investigate for command lines that contain `.dat`, `.dll #1`, or similar constructs which are frequently used by Sofacy loaders. Cross-reference these with known indicators of compromise for additional context.

  - **Check for Alternative Payload Execution:** Look for instances where other processes related to this activity could be executed or spawned by `rundll32.exe`. Presence of abnormal parent-child relationships in the process tree may reveal further insight into the attack lifecycle.

  - **Identify Related Network Activity:** Monitor network logs for connections made shortly after these identified execution events. This can help determine if any data exfiltration or command-and-control activity follows the execution of the Trojan.

  ### Prioritization
  The severity of this alert is high as Sofacy Trojan activity indicates a targeted attack that could lead to significant data breaches or system compromise within the enterprise. The likelihood of encountering such threats increases given the advanced capabilities and persistence of APT28.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on the specific behavior of `rundll32.exe`, which may be used legitimately in some contexts. There may be assumptions that this command line structure will always indicate malicious intent. The detection logic assumes that process creation logs are adequately retained and accessible. If logging is misconfigured or if events are purged, detection will likely fail. It is crucial for organizations to ensure their process creation logging is enabled and configured appropriately to ensure this alert is actionable.

