logsource:
  category: process_creation
  product: windows
detection:
  selection_path:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
    - '%LOCALAPPDATA%'
    - '\AppData\Local\'
  selection_extensions:
  - CommandLine|contains: '.dat",'
  - CommandLine|endswith:
    - '.dll #1'
    - '.dll" #1'
    - '.dll",#1'
  filter_main_exclude_temp:
    CommandLine|contains: '\AppData\Local\Temp\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the Sofacy Trojan Loader, commonly associated with APT28, and specifically identifies instances where `rundll32.exe` is invoked in conjunction with specific command line arguments that could indicate malicious payload execution. The likely attacker objective is to load and execute additional malicious components or payloads to establish persistence and further compromise targeted systems.

  Relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Steganography (T1218.011), which highlight the method of delivering the payload and disguising its activity. Primary telemetry sources for detecting this behavior include Windows event logs for process creation (Event ID 4688) and Sysmon logs (Event ID 1) for more detailed process execution context.

  If malicious, this activity could lead to data exfiltration, lateral movement, or additional malware installation. However, it is important to note that this detection does NOT confirm active compromise without further investigation into associated behavior and contextual analysis.

  ### Investigation Steps

  - **Review process creation logs**: Check for Event ID 4688 and Sysmon Event ID 1 for instances of `rundll32.exe` execution, particularly focusing on the `CommandLine` field for unusual arguments or paths.

  - **Analyze command line details**: Identify command lines that include `%LOCALAPPDATA%` or `\AppData\Local\`, and ensure that there are no references to the `\AppData\Local\Temp\` directory, as this filter indicates potential benign execution.

  - **Correlate with known malicious Indicators of Compromise (IOCs)**: Look for command line arguments that contain `.dat",` or variations ending with `.dll`, which are high-confidence indicators of malicious activity based on previous investigations.

  - **Identify legitimate software behavior**: Cross-reference the command line arguments against known software that may legitimately use `rundll32.exe` with similar paths; examples may include system updates or software installations, which typically do not include suspicious `.dat` or `.dll` conditions.

  - **Check for artifact creation**: Confirm any relevant file creations within directories referenced in the command line arguments, such as unexpected files appearing in `%LOCALAPPDATA%` or unusual DLLs in local application data folders.

  - **Assess the asset role**: Consider the criticality and role of affected systems. For example, `rundll32.exe` executions on endpoints not known to run legitimate software that utilizes this process should raise immediate concerns.

  ### Prioritization

  This alert should be treated with high severity as it indicates potential Trojan activity targeting critical enterprise systems. Given APT28's history of sophisticated and organized attacks, the likelihood of malicious abuse is significant, especially in environments with government or high-profile assets. Such behaviors are commonly weaponized, necessitating prompt analysis and potential containment strategies.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of obfuscation techniques that adversaries may use to disguise command-line arguments. This rule relies on specific command-line strings and paths, and if such indicators are altered, detection may fail. Additionally, legitimate software may invoke similar behavior, particularly during updates or deployments, which can lead to false positives. For comprehensive coverage, companion detections, such as identifying unusual network connections following process execution, can help confirm suspicious activity.

