logsource:
  category: process_creation
  product: windows
detection:
  selection_path:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
    - '%LOCALAPPDATA%'
    - '\AppData\Local\'
  selection_extensions:
  - CommandLine|contains: '.dat",'
  - CommandLine|endswith:
    - '.dll #1'
    - '.dll" #1'
    - '.dll",#1'
  filter_main_exclude_temp:
    CommandLine|contains: '\AppData\Local\Temp\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects activity indicative of the Sofacy Trojan loader, specifically looking for instances where `rundll32.exe` is invoked with command-line parameters associated with the loading of malicious DLLs from the local application data directory. The behavior often aligns with the tactics used by APT28 to deliver additional payloads. The relevant MITRE ATT&CK tactics include Execution (T1059.003) and Defense Evasion (T1218.011). Primary telemetry sources are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1.

  If left unchecked, this activity can lead to data exfiltration, lateral movement, or further compromise of the affected environment. However, it is important to note that this detection does NOT confirm that a malicious action was completed, as it may also trigger on benign uses of `rundll32.exe`.

  ### Investigation Steps

  - **Examine the command line arguments: **Review the command line associated with `rundll32.exe` (Event ID 4688/Sysmon ID 1) for signs of malicious activity, paying particular attention to any reference to `%LOCALAPPDATA%` and unusual strings such as '.dat"' or '.dll #1'. Malicious variants will often exhibit suspicious patterns.

  - **Verify the parent process: **Check the parent process of the detected `rundll32.exe` invocation (often explorer.exe) for unusual or unauthorized parent processes or service host instances (Event ID 4688/Sysmon ID 1). Legitimate behavior typically involves standard OS components like an interactive user query.

  - **Assess the file path: **Look for files created or accessed in the `%LOCALAPPDATA%\Temp\` directory as part of the command line. Compare file creation timestamps with the alert timestamp for indicators of suspicious activity (exploring the temp directory can indicate potential evasion tactics).

  - **Identify related processes: **Correlate with other suspicious activities or child processes spawned by the same parent. Attacker workflows often exhibit patterns where multiple processes are invoked shortly after the loader runs (e.g., additional PowerShell, Curl).

  - **Check for known indicators of compromise: **Cross-reference the loaded DLL names against threat intelligence databases or internal lists of known malicious binaries to identify high-confidence malicious indicators related to APT28 activity.

  ### Prioritization

  The severity of this alert is high due to the risk of sophisticated malware deployment that can lead to significant breaches. The likelihood of abuse is elevated as APT28 is known to deploy such tactics routinely. The behavior is specifically weaponized to bypass standard security controls by using legitimate Windows functionalities.

  ### Blind Spots and Assumptions

  Detection relies heavily on the appropriate logging configurations for Event ID 4688 and Sysmon logs; any gaps in logging could lead to missed detections. Legitimate administrative tasks or software installations may inadvertently trigger this alert, especially those involving legitimate use of `rundll32.exe`. Companion detections include monitoring for lateral movement patterns post-invocation of the loader, such as abnormal connections to known command and control (C2) infrastructure or attempts at privilege escalation.

