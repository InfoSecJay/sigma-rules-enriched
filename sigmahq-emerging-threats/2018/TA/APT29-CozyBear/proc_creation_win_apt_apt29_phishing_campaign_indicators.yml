note: |
  ### Technical Context
  This detection rule identifies command-line indicators associated with a phishing campaign attributed to the APT29 threat actor, also known as Cozy Bear. The rule focuses on specific command-line patterns that suggest the execution of malicious scripts designed to exploit vulnerabilities and gain access to targeted systems. The threat scenario typically revolves around initial access through phishing, where attackers aim to compromise credentials of high-value targets such as government agencies and non-profits.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1203)**: The command-line indicators suggest potential exploitation through the execution of malicious scripts delivered via phishing.
  - **Defense Evasion (T1218.011)**: The command-line parameters indicate attempts to evade standard security tools, particularly using the `-ep bypass` switch.

  Primary data sources that would provide valuable evidence for this detection include Windows process creation logs, which detail command-line arguments used by executables as they are launched on endpoints.

  ### Investigation Steps
  - **Review Process Creation Events**: Check process creation logs for instances of suspicious commands matching the specified indicators, especially those related to `-noni -ep bypass $` and commands containing 'cyzfc.dat,' or 'PointFunctionCall'.

  - **Collect Related Network Traffic**: Analyze network logs for any unusual outbound connections from affected systems, particularly to known malicious IP addresses or domains associated with APT29.

  - **Perform Endpoint Forensics**: Investigate the endpoints where the malicious command-line indicators were detected, looking for evidence of execution artifacts, such as script files or other related binaries.

  - **Evaluate User Activity**: Review user access logs and behavior on affected systems to determine whether any unauthorized access or privilege escalation occurred as a result of the phishing campaign.

  ### Prioritization
  This alert is critical due to the impact of APT29 activity on sensitive environments. The likelihood of such campaigns successfully leading to data compromise necessitates immediate attention from responders.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where process creation logging is not enabled, leading to missed detections. The detection logic assumes that attackers will leverage the specific command-line patterns identified and may not account for custom or obfuscated command executions. Additionally, proper logging configurations and monitoring are required for the alert to function effectively across the enterprise.

