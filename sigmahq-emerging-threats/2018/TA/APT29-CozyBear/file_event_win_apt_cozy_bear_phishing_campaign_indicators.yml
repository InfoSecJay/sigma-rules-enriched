  ### Technical Context

  This Sigma rule detects the creation of specific file indicators related to a phishing campaign attributed to APT29 (Cozy Bear). The behavior includes the use of malicious filenames such as 'ds7002.lnk', 'ds7002.pdf', and 'ds7002.zip,' which are commonly part of deceptive tactics employed to lure users into executing malware or providing sensitive information. The likely attacker objective is to gain unauthorized access to sensitive data within the target organization, leading to potential exfiltration or further lateral movement.

  This detection aligns with the MITRE ATT&CK techniques T1218.011 (Signed Binary Proxy Execution). The primary telemetry source for this detection is Windows file creation events (specifically the file event logs), which will capture the relevant indicators. If confirmed malicious, the impact could be significant, potentially leading to successful data breaches or system compromises. Importantly, this detection does NOT confirm malicious activity on its own; the presence of these filenames requires further contextual investigation to determine intent and execution.

  ### Investigation Steps

  - **Review file creation events:** Check Windows Security Event ID 4663 for file creation involving 'ds7002.lnk', 'ds7002.pdf', and 'ds7002.zip'. Validate the paths and access attempts to determine if they originate from suspicious locations.

  - **Correlate process creation logs:** Look for related process creation events (Security Event ID 4688) that indicate execution linked to the identified filenames. Verify if the executing process is legitimate or associated with known malware.

  - **Check for external communications:** Analyze outbound network connections from the host using Windows Firewall logs (Event ID 5156) or Proxy logs. Look for unusual communication patterns with external IPs immediately after the detection of the file event.

  - **Identify legitimate usage:** Investigate whether the files can be correlated with known projects or departments within the organization. Legitimate files may come from internal sources, while anomalies from common locations (e.g., user desktops) may indicate misuse.

  - **Assess host role consistency:** Determine the role of the affected host—if it's a high-value asset such as an executive workstation, this may elevate the alert severity.

  - **Verify file artifact behavior:** If any of the detected files were downloaded, check for associated logs that indicate file transfers or email attachments. Fields to examine include 'src', 'dest', and 'file_size'.

  ### Prioritization

  This alert is classified as critical due to the potential impact on information security and the likelihood of malicious use in a phishing context. Given that APT29 utilizes sophisticated tactics and is known for targeting sensitive information, this behavior is often weaponized and requires immediate investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations since adversaries can rename malicious files to avoid detection. The detection requires file event logging to be appropriately configured on endpoints, which must be actively monitored. Legitimate personnel might inadvertently trigger this alert by downloading common files for business purposes. A companion detection that enhances coverage could involve monitoring for known command and control (C2) traffic associated with APT29 tools and techniques.

