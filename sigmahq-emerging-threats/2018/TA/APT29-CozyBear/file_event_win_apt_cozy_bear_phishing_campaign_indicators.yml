  ---

  ### Technical Context

  This rule detects specific file indicators associated with the APT29 (Cozy Bear) phishing campaign, particularly looking for file names like 'ds7002.lnk,' 'ds7002.pdf,' and 'ds7002.zip.' The likely attacker objective is to deliver malicious payloads or perform reconnaissance within targeted environments after successfully phish user credentials. This behavior aligns with the MITRE ATT&CK framework, specifically the tactic "Execution" (TA0002) and the technique "File and Directory Discovery" (T1218.011).

  Primary telemetry sources include Windows file event logs that capture file creation or modification events. If malicious, these files could be used to deploy further tools or exfiltrate sensitive data. This detection does NOT on its own confirm a breach; it indicates potentially malicious files but requires further investigation into context and usage.

  ---

  ### Investigation Steps

  - **Search for file event logs:**
    Review Windows file event logs (Event ID 4663) for file creations involving 'ds7002.lnk,' 'ds7002.pdf,' or 'ds7002.zip' to determine if these files were created on critical assets.

  - **Examine process execution:**
    Investigate for any processes initiated by these files, specifically looking for Event ID 4688 (Process Creation). Identify if any suspicious commands or executable paths were called that may indicate malicious execution.

  - **Review user activity logs:**
    Analyze security logs to determine if the creating user has a history of legitimate activity that correlates with expected operational behavior. Expected behavior would include normal file activity consistent with job functions, with no prior incidents.

  - **Correlate emails and attachments:**
    Look into email logs (e.g., Mimecast, Proofpoint) to identify if these files were delivered via email. Investigating attached emails may reveal phishing attempts or social engineering techniques.

  - **Check for lateral movement indicators:**
    If files were found on a system servicing critical assets or accounts, review logs for any signs of lateral movement, such as authentication logs (Event ID 4624) or anomalous network connections related to the system in question.

  - **Identify unusual network activity:**
    Look for outbound traffic patterns indicating potential exfiltration associated with these files, using firewall or IDS/IPS logs to spot anomalies like large transfers or connections to known malicious IPs.

  ---

  ### Prioritization

  This alert is critical due to the association with APT29, a sophisticated threat actor known for targeting sensitive organizations. The likelihood of malicious use is high as this behavior often precedes more severe attacks, making early detection vital. Given the potential impact on sensitive data, immediate investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging for file events is not correctly enabled or if the system has been misconfigured, potentially allowing malicious files to create without detection. Additionally, legitimate internal file-sharing operations or benign documents could trigger the alert. A related detection, such as monitoring for unusual process creation related to the identified files, would strengthen overall coverage.

