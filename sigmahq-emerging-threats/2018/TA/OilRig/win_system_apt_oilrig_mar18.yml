note: |
  ### Technical Context
  This detection rule identifies the use of scheduled tasks by the OilRig Advanced Persistent Threat (APT), specifically focusing on persistence mechanisms that enable the malware to remain active in a compromised environment. By leveraging scheduled tasks, the attackers can persistently execute malicious payloads, allowing them to maintain access and execute further commands or payloads as needed. The primary objective of such behavior is to ensure longevity in the target environment while evading detection by legitimate security measures.

  The associated MITRE ATT&CK techniques include **T1053.005 (Scheduled Task/Job: Scheduled Task)**, which relates to the creation of scheduled tasks for executing malware, and **T1543.003 (Create or Modify System Process: Windows Service)**, relevant here as the rule also monitors for new service creation by the Service Control Manager. Other tactics that may be indirectly indicated include **TA0003 (Persistence)**, reflecting the objective of extending the foothold within the organization.

  Primary data sources for this detection include Windows System Event logs, particularly those related to Service Control Manager events where Event ID 7045 indicates that a service was installed. This log will provide the necessary evidence of potentially malicious scheduled tasks being created by the attackers.

  ### Investigation Steps
  - **Review Scheduled Task Logs:** Examine Windows Event Logs for Event ID 7045 to identify any newly created scheduled tasks and look for suspicious patterns or names that could indicate malicious activity, particularly those resembling `SC Scheduled Scan` or `UpdatMachine`.

  - **Analyze Service Creation:** Investigate the details surrounding the service creation event logged by Windows. Focus on the `ServiceName`, `Provider_Name`, and ensure to correlate with other system events to trace back the origin of the command.

  - **Correlate with Other Logs:** Collect and analyze logs from other sources such as EDR, SIEM, and network logs that may indicate associated file creation or command execution correlating with the identified scheduled tasks. Look for unusually high levels of network communication or file access patterns.

  - **Check for Ongoing Malicious Activity:** Assess the execution context of the scheduled tasks. Check for file drops or execution patterns in process creation logs to identify if the tasks are actively running malicious process instances and correlate with known malicious indicators from threat intelligence.

  ### Prioritization
  The alert is classified as critical due to the high impact of OilRig APT's capabilities. The likelihood of exploitation can be considerable, given the sophisticated methods used to maintain persistence within targeted systems, which could lead to extensive data breaches or system compromises.

  ### Blind Spots and Assumptions
  This detection rule relies on the availability of relevant Windows system logs, particularly ensuring that Event ID 7045 logs are enabled and configured correctly across the enterprise environment. A blind spot exists if scheduled tasks are created and executed without corresponding logs due to misconfiguration or log retention policies. Additionally, the rule assumes that the names of the services contain identifiable patterns that indicate malicious intent; however, legitimate services sometimes use similar naming conventions, which could lead to false positives if not appropriately contextualized.

