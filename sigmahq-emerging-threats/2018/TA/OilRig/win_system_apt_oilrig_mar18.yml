note: |
  ### Technical Context
  This detection rule identifies persistence mechanisms employed by the OilRig APT group through the creation of scheduled tasks on Windows systems. The rule targets specific event logs associated with the Service Control Manager (SCM) that reveal newly registered scheduled scans, which may indicate an attempt to maintain access and execute malicious activities over time. OilRig is known for sophisticated attacks against various sectors, including energy and government, primarily focusing on data exfiltration and reconnaissance.

  The relevant MITRE ATT&CK tactics involved include:
  - **Persistence (T1053.005)**: Establishing scheduled tasks to maintain a foothold within the environment.
  - **Defense Evasion (T1543.003)**: Creating or modifying system services to hide malicious activity.
  - **Command and Control (T1071.004)**: Utilizing legitimate channels for data exfiltration or remote access.

  Key data sources for this alert involve Windows Event Logs, specifically those generated by the Service Control Manager, which logs events like the creation of new services, including scheduled tasks.

  ### Investigation Steps
  - **Review Event Logs**: Examine Windows Event ID 7045 entries in the Service Control Manager logs to confirm the creation of scheduled tasks named 'SC Scheduled Scan' or 'UpdatMachine'.
  - **Correlate with Process Creation**: Investigate associated process creation events (Event ID 4688) to identify any related malicious scripts or binaries that may have been executed in conjunction with the newly scheduled tasks.
  - **Audit Current Scheduled Tasks**: Analyze the scheduled tasks on affected endpoints using the `schtasks` command to check for instances that deviate from the organizational baseline or exhibit suspicious behavior.
  - **Check for Indicators of Compromise**: Scan for patterns of known OilRig indicators of compromise (IOCs) alongside the detection findings to ascertain if the environment has been targeted or breached.

  ### Prioritization
  The alert is critical due to the significant risk posed by APT groups like OilRig, which may establish persistent access to sensitive environments. The capability to create scheduled tasks indicates a high likelihood of evasion and ongoing compromise, warranting immediate investigation.

  ### Blind Spots and Assumptions
  This detection may miss activity if logs are not collected or if Service Control Manager logs are disabled for any reason. It assumes that the Service Control Manager logs are enabled and configured correctly to capture relevant events. Additionally, the detection logic is based on specific service names, and any changes or obfuscations employed by an attacker could evade detection. This requires that standard Windows logging is adequately maintained across the enterprise environment.

