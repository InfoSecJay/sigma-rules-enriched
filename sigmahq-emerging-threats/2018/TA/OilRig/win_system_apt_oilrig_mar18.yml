note: |
  ### Technical Context

  This rule detects the creation of potentially malicious scheduled tasks associated with the OilRig advanced persistent threat (APT) actor. Such tasks, once established, are used to maintain persistence and facilitate secondary actions, such as executing payloads or exfiltrating data. The attacker objective is to establish a foothold on the target system, enabling ongoing control and data manipulation.

  Relevant MITRE ATT&CK tactics include Persistence (TA0003) and Execution (TA0002), specifically techniques T1053.005 (Scheduled Task/Job) and T1543.003 (Create or Modify System Process). The primary telemetry sources for this detection are Windows Security and System Event logs, specifically Event ID 7045 which logs new service installations by the Service Control Manager. If malicious, the presence of these scheduled tasks can lead to sustained control over the system, data theft, or lateral movement.

  This detection does NOT confirm active exploitation on its own; it merely identifies the creation of scheduled tasks that require further investigation to assess their legitimacy.

  ### Investigation Steps

  - **Check event details of Event ID 7045:** Review the System log for Event ID 7045 entries. Look for the specific ServiceName values 'SC Scheduled Scan' or 'UpdatMachine'. If found, note the User Name and computer context that created the task.

  - **Verify scheduled task settings:** Use PowerShell or Task Scheduler to list the properties of the identified tasks. Run `Get-ScheduledTask | where {$_.TaskName -like '*SC Scheduled Scan*' -or $_.TaskName -like '*UpdatMachine*'}`. Legitimate tasks will have non-malicious actions outlined and appropriate triggers.

  - **Inspect creation context:** Cross-reference the Event ID 7045 entries with security logs (Event ID 4624 - logon events). Look for service creation under unusual account contexts, such as SYSTEM or administrative accounts from suspicious IP addresses.

  - **Identify abnormal frequency or periodicity:** If the task is found to execute with irregular frequency or at non-standard intervals (e.g., every few minutes), flag this as potentially malicious. Legitimate scheduled tasks typically adhere to defined schedules that are predictable.

  - **Correlate with other detection sources:** Review other related detections, such as process creation logs (Event ID 4688) for activities tied to the created scheduled tasks. Look for suspicious parent process relationships that may indicate lateral movement or persistence mechanisms.

  ### Prioritization

  This alert is deemed critical due to the high impact on enterprise security if a malicious task is identified, especially in sensitive systems. The likelihood of adversary abuse is significant, as this behavior mirrors common tactics used by APT groups like OilRig for persistence. Scheduled tasks are frequently weaponized, making timely reviews essential.

  ### Blind Spots and Assumptions

  The detection may be evaded by legitimate scheduled tasks being obscured among common administrative tasks or misconfigured logging setups. Ensure that the log sources for Security and System events are enabled, as non-active logging may miss such entries. Legitimate use cases include routine maintenance tasks, updates from known software vendors, or admin-initiated scheduled scans. A related detection to monitor is Event ID 4688 for process creation, which would provide further context on task executions related to identified scheduled tasks.

