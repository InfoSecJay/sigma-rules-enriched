note: |
  ### Technical Context

  This Sigma rule detects the creation of scheduled tasks associated with the OilRig APT, specifically targeting the addition of such tasks via the Service Control Manager, indicated by Event ID 7045. The malicious behavior typically aims to establish persistence within an infected system, allowing the adversary to maintain access and execute further payloads. This activity is categorized under the MITRE ATT&CK techniques T1053.005 (Scheduled Task/Job: Windows Task Scheduler) and T1543.003 (Create or Modify System Process: Windows Service).

  The primary telemetry source for this detection is Windows Event Logs, specifically the System log capturing Event ID 7045. If this activity is malicious, it may lead to significant security impacts such as data exfiltration, further compromise of systems, or lateral movement within the environment. It is important to note that while this detection indicates potential malicious behavior, it does not confirm compromise on its own; legitimate scheduled tasks can also trigger this alert.

  ### Investigation Steps

  - **Review Event Logs for suspicious tasks:** Check Windows Event Log (System) for Event ID 7045. Look for ServiceName values 'SC Scheduled Scan' and 'UpdatMachine'. Note that if these are created by known user accounts or service accounts with legitimate use cases, further investigation into the context is necessary.

  - **Identify the creator of the scheduled task:** Utilize Sysinternals’ Process Explorer to ascertain the parent process associated with the creation of the task. If this process shows unusual behavior or is associated with known malware, it indicates potential malicious activity.

  - **Check task execution time and recurrence:** Investigate the properties of the created scheduled tasks via the Task Scheduler. Scheduled tasks with odd timing (e.g., executed at irregular hours) or high recurrence rates (such as every minute) can indicate malicious intent.

  - **Compare with known scheduled tasks:** Assess the system for baseline scheduled tasks to identify if the detected tasks are new or anomalous. Utilization of scripts or tools to compile legitimate scheduled tasks can help identify discrepancies.

  - **Examine related registry entries:** Check the registry, particularly under HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks for any suspicious entries correlating with the detected scheduled task.

  - **Monitor for follow-up activity:** Keep an eye on the execution of the scheduled tasks, particularly sudden spikes in network activity or process creations in conjunction with their execution. Malicious behavior may manifest as data exfiltration or additional suspicious process execution.

  ### Prioritization

  This alert should be treated as critical given the potential for operational disruption and data compromise associated with persistent footholds in enterprise environments. The likelihood of this behavior being leveraged by adversaries like OilRig makes it a high-priority investigation.

  ### Blind Spots and Assumptions

  This detection may miss events if the scheduled task creates are executed without generating the expected Event ID 7045 (e.g., direct API calls). It also assumes that all required logging is enabled on the endpoint. Legitimate activities, such as software updates or system maintenance tasks, may also trigger this alert. A companion detection for monitoring modifications to system processes or services would enhance coverage against similar persistence methods.

