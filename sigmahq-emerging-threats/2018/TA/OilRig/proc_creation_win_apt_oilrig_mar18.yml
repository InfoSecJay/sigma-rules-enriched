logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    CommandLine|contains|all:
    - 'SC Scheduled Scan'
    - '\microsoft\Taskbar\autoit3.exe'
  selection_temp:
    Image|contains: '\Windows\Temp\DB\'
    Image|endswith: '.exe'
  selection_service:
    Image: 'C:\Windows\system32\Service.exe'
    CommandLine|contains:
    - 'i'
    - 'u'
  selection_autoit:
    ParentImage|endswith: '\local\microsoft\Taskbar\autoit3.exe'
    CommandLine|contains|all:
    - 'nslookup.exe'
    - '-q=TXT'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects potentially malicious behavior associated with the OilRig APT group, specifically indicating the use of scheduled tasks, temporary executable files, and other related activity that may suggest privilege escalation and persistence tactics. The likely objective of such activity is to establish persistence on the system and facilitate command-and-control communications. The behavior relates to MITRE ATT&CK tactics and techniques including Privilege Escalation (T1068), Execution (T1059.003), and Persistence (T1543.003).

  The primary telemetry sources for this detection are Windows process creation logs, specifically focusing on Event ID 4688, which provides data on new processes being created, and potentially Sysmon Event ID 1 for detailed process attribution. The security impact of successful exploitation could include unauthorized system access, data exfiltration, or lateral movement within the network. However, it is crucial to note that this detection does NOT confirm malicious intent on its own; further investigation is required to establish context.

  ### Investigation Steps

  - **Review process creation logs:**
    Analyze Windows Security Event ID 4688 for any instances of `autoit3.exe` initiated from `C:\local\microsoft\Taskbar`. Legitimate behavior typically does not include such processes in this context.

  - **Check for scheduled tasks activity:**
    Look for any recent task creation or modification events that include the command line containing 'SC Scheduled Scan' within `C:\Windows\System32\Tasks`. Malicious indicators may include unexpected scheduled tasks designed to run at odd intervals.

  - **Investigate temporary executable files:**
    Search for executable files in the directory `C:\Windows\Temp\DB\`. Files executing from this directory without a legitimate process originating from an internal application may indicate malicious activity.

  - **Identify unusual command-line parameters:**
    Analyze the command line for processes linked to `Service.exe`—specifically looking for command strings that include 'i' and 'u'. This is highly atypical, suggesting potential exploitation.

  - **Cross-reference with DNS resolution requests:**
    For instances of `nslookup.exe` launched by `autoit3.exe`, collect the command line arguments for any DNS queries containing 'TXT'. Suspicious patterns or external IPs can indicate command-and-control activity.

  - **Evaluate host criticality and responses:**
    Establish the role of the affected host within your environment. Systems critical for operations require an immediate and thorough investigation upon detection of any of the above behaviors.

  ### Prioritization

  This alert should be classified as critical due to its association with an advanced persistent threat that targets high-value assets. The likelihood of malicious abuse is significant, especially given the capabilities and historical methodology of the OilRig group. This type of behavior has been commonly weaponized, warranting prioritized investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if proper logging configurations are not in place, particularly for process creation and task scheduling logs. Adversaries may use legitimate system tools in an unconventional manner to evade detection. Additionally, scheduled tasks and temporary files might also be generated by legitimate administrative scripts or maintenance tasks, requiring careful contextual assessment. A companion detection to consider would be monitoring for unusual network traffic to the external IPs queried by `nslookup.exe`, enhancing comprehensive coverage against this tactic.

