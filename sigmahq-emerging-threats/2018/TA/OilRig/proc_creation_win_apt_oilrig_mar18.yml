logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    CommandLine|contains|all:
    - 'SC Scheduled Scan'
    - '\microsoft\Taskbar\autoit3.exe'
  selection_temp:
    Image|contains: '\Windows\Temp\DB\'
    Image|endswith: '.exe'
  selection_service:
    Image: 'C:\Windows\system32\Service.exe'
    CommandLine|contains:
    - 'i'
    - 'u'
  selection_autoit:
    ParentImage|endswith: '\local\microsoft\Taskbar\autoit3.exe'
    CommandLine|contains|all:
    - 'nslookup.exe'
    - '-q=TXT'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects behaviors associated with the OilRig APT group, specifically targeting suspicious execution patterns linked to scheduled tasks and the AutoIt scripting language. The likely attacker objective is to maintain persistence and execute reconnaissance operations within a victim's environment. Relevant MITRE ATT&CK tactics include "Execution" (TA0002), "Persistence" (TA0003), and "Privilege Escalation" (TA0004), particularly techniques G0049, T1053.005, and T1543.003. Primary telemetry sources are Windows process creation logs (Security Event ID 4688 and/or Sysmon Event ID 1) focusing on command lines and images. If confirmed malicious, these actions could lead to unauthorized access, data exfiltration, and potential further exploitation of the network. Importantly, this detection does NOT confirm active compromise on its own.

  ### Investigation Steps

  - **Review process creation logs for AutoIt activity:** Check Windows Security Event ID 4688 or Sysmon Event ID 1. Look for command lines containing 'nslookup.exe' and '-q=TXT' and verify if the parent process is 'autoit3.exe'. Any such activity may indicate malicious persistence.

  - **Investigate scheduled task executions:** Query task scheduler logs for any tasks running 'SC Scheduled Scan' and check their command line arguments for unusual parameters or references to `autoit3.exe`. Regular tasks should not exhibit command lines tied to suspicious software pathing.

  - **Examine service creation logs:** Look in the Windows Event Viewer for Service Control Manager logs (Event ID 7045) to identify any services being created with images from 'C:\Windows\system32\Service.exe' that include command line flags 'i' or 'u'. This could signify unauthorized service creation.

  - **Evaluate the legitimacy of identified artifacts:** Cross-reference any instances of binaries in 'C:\Windows\Temp\DB\' ending with '.exe' against known good process lists in your environment. Legitimate binaries should conform to established naming conventions and known application paths.

  - **Assess network traffic for unusual patterns:** Utilize network logs to analyze any associated outbound connections or anomalies tied to the identified processes, particularly focusing on connections established by 'nslookup.exe', which might suggest DNS tunneling.

  ### Prioritization

  This alert is critical due to the potential impact of compromised systems that could serve as a foothold for further exploitation. The techniques employed are commonly weaponized by threat actors like OilRig, indicating a high likelihood of malicious intent behind the detected behavior.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques, such as renaming established executables or utilizing legitimate applications to mask malicious behavior. Ensure that logging configurations are properly set up to capture all necessary process and service creation events. Legitimate administrative tasks may trigger similar alerts, such as the use of scheduled tasks for system maintenance. Consider implementing companion detections for other known APT behaviors to enhance visibility and coverage.

