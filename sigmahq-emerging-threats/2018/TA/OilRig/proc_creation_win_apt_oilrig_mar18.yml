logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    CommandLine|contains|all:
    - 'SC Scheduled Scan'
    - '\microsoft\Taskbar\autoit3.exe'
  selection_temp:
    Image|contains: '\Windows\Temp\DB\'
    Image|endswith: '.exe'
  selection_service:
    Image: 'C:\Windows\system32\Service.exe'
    CommandLine|contains:
    - 'i'
    - 'u'
  selection_autoit:
    ParentImage|endswith: '\local\microsoft\Taskbar\autoit3.exe'
    CommandLine|contains|all:
    - 'nslookup.exe'
    - '-q=TXT'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule is designed to identify potential activity associated with the OilRig APT group, which is known for sophisticated cyberattacks primarily aimed at Middle Eastern organizations and critical infrastructure. The rule targets specific executable runs, command line invocations, and patterns in scheduled tasks that align with behaviors typically seen in OilRig operations. Attackers affiliated with this group often seek to gain unauthorized access, install backdoors for persistence, and execute commands to gather sensitive information or disrupt operations.

  Relevant tactics and techniques from the MITRE ATT&CK framework include:
  - **Privilege Escalation (T1068)**: Utilizing vulnerabilities or misconfigurations to gain higher-level permissions.
  - **Execution (T1203)**: Running malicious code within the environment.
  - **Persistence (T1543.003)**: Creating or modifying services to ensure continued access.
  - **Defense Evasion (T1071.004)**: Using application layer protocols to evade detection.

  To effectively capture the activities associated with this detection, primary data sources include process creation events, command line arguments, and scheduled task logs from Windows systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for any instances where the command lines match configurations related to `SC Scheduled Scan` or subprocesses involving `autoit3.exe`. Pay special attention to any unusual parameters or contexts in which these processes were invoked.

  - **Analyze Scheduled Tasks**: Investigate any scheduled tasks that reference `SC Scheduled Scan` or display unusual execution patterns linking back to the `autoit3.exe`, ensuring no unauthorized changes or tasks were created.

  - **Inspect Image Paths**: Look for executables running from atypical directories, particularly any instances in `C:\Windows\Temp\DB\` or any other temporary file paths, and correlate them with known malicious artifacts.

  - **Check Service Creation Events**: Scrutinize service creation logs, especially for `C:\Windows\system32\Service.exe`, focusing on command lines that contain the parameters 'i' or 'u', indicating possibly malicious intent.

  ### Prioritization
  Given the critical severity of this alert, it reflects a high potential impact due to the capability of OilRig to disrupt critical services or compromise sensitive information. Quick identification and response to this type of activity are vital in an enterprise environment to mitigate damage and restore trusted operations.

  ### Blind Spots and Assumptions
  This detection rule might miss instances where the malicious activity does not utilize the specified command line arguments or file paths, leading to potential evasion. Additionally, it assumes that logging for process creation and scheduled tasks is appropriately configured within the organization's Windows systems. Thus, standard logging settings must be verified to ensure all relevant events are captured to support this detection logic effectively.

