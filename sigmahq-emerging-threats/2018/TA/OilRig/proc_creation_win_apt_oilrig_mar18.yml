logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    CommandLine|contains|all:
    - 'SC Scheduled Scan'
    - '\microsoft\Taskbar\autoit3.exe'
  selection_temp:
    Image|contains: '\Windows\Temp\DB\'
    Image|endswith: '.exe'
  selection_service:
    Image: 'C:\Windows\system32\Service.exe'
    CommandLine|contains:
    - 'i'
    - 'u'
  selection_autoit:
    ParentImage|endswith: '\local\microsoft\Taskbar\autoit3.exe'
    CommandLine|contains|all:
    - 'nslookup.exe'
    - '-q=TXT'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies potential activity associated with the OilRig APT group, which is known for its sophisticated cyberespionage operations primarily targeting entities within the Middle East. The rule is designed to detect various components of OilRig's tactics, particularly those involving the use of the AutoIt scripting language, scheduled tasks, and the manipulation of system services to establish persistence and execute commands. Attackers may employ these techniques to maintain control over compromised systems, extract data, and further infiltrate internal networks.

  Relevant MITRE ATT&CK tactics and techniques indicated in this rule include:
  - **Persistence** (T1071.004 - Command and Control over Web Protocols)
  - **Defense Evasion** (T1543.003 - Create or Modify System Process)
  - **Execution** (T1053.005 - Scheduled Task/Job)
  - **Discovery** (T1112 - Modify Registry)
  - **Command and Control** (T1071.004 - Application Layer Protocol)

  Primary data sources to support the detection include process creation events, especially those involving scheduled tasks and service manipulations, as well as any logs from executables located in the Windows Temp directory.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of 'SC Scheduled Scan' or 'autoit3.exe' related to ParentImage commands. Pay particular attention to command lines that indicate unusual launches or modify legitimate processes.

  - **Examine Scheduled Task Configurations**: Search for scheduled tasks that reference 'autoit3.exe' or any command line that contains suspicious parameters, especially in the context of the Windows Temp directory.

  - **Analyze Service Operations**: Investigate any invocations of 'Service.exe' with command lines containing 'i' or 'u' which can be indicators of service manipulation linked to persistence strategies employed by the OilRig group.

  - **Collect Affected System Artifacts**: Gather detailed logs from affected systems that show potential indicators of compromise related to registry modifications, unknown executables running from the Windows Temp directory, or any unusual network traffic patterns.

  ### Prioritization
  This alert is critical due to the high potential impact of operation by the OilRig APT group, which may lead to significant data breaches or system compromises. The likelihood of an incident occurring with the similar techniques observed necessitates immediate investigation and response.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if systems do not generate detailed process creation logs or if logging is not properly configured for scheduled tasks and service creation. The logic assumes that any instance of 'autoit3.exe' or unexpected command lines indicate malicious intent, which may not always hold true in every environment. Further, without appropriate filtering or additional context, benign activity may lead to false positives. Sufficient logging for process execution and task scheduling is crucial for accurate detection and response.

