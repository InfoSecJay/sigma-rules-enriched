  ### Technical Context

  This Sigma rule detects modifications to the Windows registry that are associated with persistence mechanisms used by the OilRig APT group. The rule specifically targets changes to registry keys that may indicate an attempt to establish a foothold within the environment or maintain persistence after a system reboot. The likely attacker objective is to ensure that their malware runs automatically upon system start or user login, facilitating their long-term control over the compromised system.

  Relevant MITRE ATT&CK tactics include Persistence (TA0003) and Execution (TA0002), with techniques such as Registry Run Keys/Startup Folder (T1543.003) and Scheduled Task (T1053.005). The primary telemetry source is Windows registry event logs, specifically monitoring for changes to the keys associated with user-mode application persistence. If malicious, this behavior can lead to unauthorized access and sustained control over critical systems. Importantly, this detection does NOT confirm that a system is compromised on its own; further investigation is required to ascertain the context of the registry changes.

  ### Investigation Steps

  - **Check event logs for registry changes:** Review the Windows registry event logs (Event ID 4657) for changes to the following keys: `SOFTWARE\Microsoft\Windows\CurrentVersion\UMe` and `SOFTWARE\Microsoft\Windows\CurrentVersion\UT`. Look for timestamp patterns that align with user logins or system restarts to determine normal behavior.

  - **Identify processes related to registry changes:** Cross-reference any associated process creation events (Security Event ID 4688) around the time of the registry modification. Investigate any unusual executables or scripts running and check if they are signed or known to the environment.

  - **Evaluate user account activity:** Analyze user account activity (Event ID 4624) to determine if the registry changes correspond to unexpected or anonymous user logins. Focus on logins from unauthorized accounts that may indicate malicious access.

  - **Correlate with endpoint protection alerts:** Review any alerts from endpoint protection or EDR solutions that may reveal related malicious behavior, such as detections of known OilRig malware signatures or related C2 communication patterns.

  - **Document legitimate use cases:** Identify if there are legitimate applications or administrative tasks that commonly modify the identified registry keys in your environment. Common benign applications will have consistent naming conventions or known update procedures and should occur during scheduled maintenance windows.

  - **Check for persistence and command-and-control indicators:** Look for further indications of persistence, such as the creation of scheduled tasks (Event ID 4698) that may align with established OilRig tactics. Also, review network logs for potential command-and-control communication patterns associated with these events.

  ### Prioritization

  This alert should be considered high priority due to the critical role of the affected system and the likelihood that the behavior is indicative of malicious intent. The OilRig APT group is known for sophisticated tactics aimed at long-term persistence, making this detection a serious security concern that warrants immediate investigation.

  ### Blind Spots and Assumptions

  The detection may be evaded through techniques such as modifying the registry keys in less common or legitimate contexts that are not covered by this rule. Reliable detection requires comprehensive logging of registry events, which may not be enabled in all environments. Legitimate applications, such as system management tools or auto-update processes, may inadvertently trigger the alert. A related detection worth considering is monitoring for unusual process behavior associated with registry changes, which can help strengthen coverage against these types of threats.

