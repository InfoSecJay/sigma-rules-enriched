  ### Technical Context

  This rule detects attempts by the OilRig APT group to establish persistence on Windows systems through specific registry manipulations. The objective is to allow malicious code to automatically execute during system boot or user login. The relevant MITRE ATT&CK tactics include Persistence (T1543.003) and Privilege Escalation (T1053.005) associated with registry modifications. The primary telemetry source is Windows Registry Event Logs, specifically monitoring changes to the `SOFTWARE\Microsoft\Windows\CurrentVersion\` path. If this behavior is confirmed malicious, it may allow the adversary long-term access to compromised systems. Importantly, this detection does NOT confirm an active compromise; it merely indicates a potentially suspicious registry change.

  ### Investigation Steps

  - **Check Registry Event Log Entries**: Review Windows Registry Event Logs (Event IDs 4657 and 4663) for modifications to `SOFTWARE\Microsoft\Windows\CurrentVersion\UMe` and `SOFTWARE\Microsoft\Windows\CurrentVersion\UT`, specifically looking for unexpected value changes or additions.

  - **Identify High-Confidence Malicious Indicators**: Confirm any registry modifications related to this detection as they may correlate with established persistence techniques used by the OilRig APT group. Look for non-standard applications or scripts that reference these registry paths.

  - **Assess System Role and Criticality**: Determine if the affected host is a critical system (e.g., domain controllers, servers) versus a standard endpoint. Investigate potential impacts based on the system's purpose and the sensitivity of its data.

  - **Investigate User Activity**: Check user activity logs (e.g., Security Event Log Event ID 4624) to see if legitimate logins occurred around the time of registry changes. Legitimate users should not modify registry keys related to application execution without administrative intent.

  - **Correlation with Other Threat Detection**: Look for any associated indicators of compromise (IOCs) in process creation logs (Event ID 4688) to see if any chaotic or unusual processes followed the registry change that may suggest script execution.

  ### Prioritization

  This alert is critical due to its potential for allowing persistent malicious access to key systems, which could facilitate further exploitation. The behavior is indicative of a known advanced threat actor's techniques and is likely to be weaponized against high-value targets, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include adversaries modifying registry values that are common among legitimate applications to avoid detection. Reliable detection depends on the completeness of registry event logging, which must be enabled and correctly configured across all Windows hosts. Legitimate administrative tasks may trigger similar alerts, especially during software installations or system updates. Companion detections that enhance coverage include monitoring for unusual process creations or network communications (e.g., outbound connections from unrecognized executables) following registry modifications.

