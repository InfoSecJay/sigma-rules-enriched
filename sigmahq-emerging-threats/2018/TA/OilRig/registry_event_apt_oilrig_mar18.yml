note: |
  ### Technical Context
  This detection rule is designed to identify potential persistence mechanisms employed by the OilRig APT group through modifications to the Windows registry. Specifically, it looks for registry entries that end with `SOFTWARE\Microsoft\Windows\CurrentVersion\UMe` and `SOFTWARE\Microsoft\Windows\CurrentVersion\UT`, which are indicative of techniques used for malware persistence. The objective of the attacker is likely to maintain access to compromised systems, enabling them to execute commands or retrieve data even after system reboots or user logouts.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Persistence (T1543.003)** and **Privilege Escalation (T1053.005)**. Techniques such as **Registry Run Keys / Startup Folder (T1060)** are specifically relevant, as modifying these registry keys allows attackers to execute their payloads automatically at startup. The rule also touches on aspects of **Defense Evasion (T1112)**, as the alterations made to the registry might be hidden from standard user scrutiny. Primary data sources for this detection include Windows registry event logs, which need to be enabled for effective monitoring.

  ### Investigation Steps
  - **Review Registry Events:** Analyze registry event logs for the specified target objects (`UMe` and `UT`) to identify any unauthorized modifications that could indicate an APT presence.
  - **Correlate with Process Creation Logs:** Check process creation logs to see if any anomalous processes have been spawned around the time of registry modifications, particularly those linked to known malicious behaviors.
  - **Examine Network Connections:** Investigate outbound network connections made by processes that have been modified in the registry, especially those that might indicate command-and-control communication (e.g., unusual ports or destinations).
  - **User Behavior Analysis:** Look into user account activities to identify any suspicious elevations or logins that coincide with the registry changes, which may hint at lateral movement or privilege escalation attempts.

  ### Prioritization
  This alert is classified as critical due to the potential long-term access and control an APT like OilRig could gain through registry persistence. The likelihood of such persistence tactics being utilized in a sophisticated attack scenario is high, making it essential for rapid investigation and remediation efforts.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the configuration of logging systems; if registry event logging is not enabled on endpoints, the alert will fail to capture relevant activities. Additionally, this rule assumes that the specific registry paths targeted by the threat actors have not been altered or obfuscated, which is a common evasion tactic. Required configurations for this alert to function effectively include comprehensive logging policies that cover Windows registry operations and ensuring that relevant detection systems can analyze these logs in real-time.

