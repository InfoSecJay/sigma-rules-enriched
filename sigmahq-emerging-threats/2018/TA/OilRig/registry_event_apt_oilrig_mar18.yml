  ### Technical Context

  This Sigma rule detects modifications to specific Windows Registry keys that are commonly utilized for persistence by the OilRig APT group. The behavior observed indicates an attempt to establish persistence on compromised systems, enabling the adversary to maintain access over time. The likely attacker objective is to create an unauthorized backdoor or to execute malicious code upon system startup or user logon.

  Relevant MITRE ATT&CK techniques include Persistence (T1543.003), as well as Command and Control (T1071.004) associated with Windows Registry modifications. The primary telemetry sources include Windows Registry event logs. If malicious, such activity can lead to long-term system compromise and potential data exfiltration or lateral movement. It's essential to note that this detection does NOT confirm that the system is currently compromised, as legitimate software may modify similar registry keys.

  ---

  ### Investigation Steps

  - **Identify affected Registry keys: ** Review the registry changes for modifications to `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\UMe` or `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\UT`. Determine if the changes align with known legitimate applications or unusual configurations.

  - **Correlate with process creation events: ** Check for associated process creation events (Security Event ID 4688) around the time of the registry modifications to see if suspicious executables were launched.

  - **Review application logs for installation activity: ** Inspect software installation logs (Event ID 11707) or deployment logs that might indicate legitimate software installations correlating with the registry entries.

  - **Look for high-confidence indicators: ** Identify additional malicious obfuscation patterns or unusual parent-child process relationships that might indicate exploitation connected to these registry modifications.

  - **Document legitimate behavior: ** Confirm any legitimate applications or services that may require similar registry modifications, documenting expected behavior from known software installations or updates.

  - **Monitor for lateral movement activity: ** Evaluate network logs for unusual outbound connections or authentication attempts (i.e., Event ID 4624) that may indicate misuse of the established persistence mechanisms found in the registry.

  ---

  ### Prioritization

  The severity of this alert is critical because it involves persistence mechanisms that can facilitate sustained access by adversaries. The potential impact on the affected system is high, given that such modifications often lead to further exploitation and lateral movement within the network. Since registry modifications for persistence are commonly weaponized, this alert warrants immediate attention.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise if logs are not properly configured to capture registry changes, or if adversaries employ obfuscation techniques to disguise their activity. Additionally, legitimate software installations or updates may trigger this alert, leading to potential false positives. Companion detections, such as monitoring for local script execution or remote access tool deployments (like RATs), can strengthen overall coverage against potential exploitation techniques associated with this detection.

