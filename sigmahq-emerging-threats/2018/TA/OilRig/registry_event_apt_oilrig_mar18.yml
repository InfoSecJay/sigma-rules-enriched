  ### Technical Context
  This detection rule identifies registry persistence methods associated with the OilRig APT group, which is known for targeted attacks against various sectors, including finance and telecommunications. The rule focuses on specific registry keys that the attackers may modify to maintain persistence on compromised systems, thereby facilitating their continued access and control over the environment. OilRig's objectives typically include data exfiltration, lateral movement, and establishing continuous presence within a network.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Persistence** (TA0003) - **Registry Run Keys / Startup Folder** (T1543.003)
  - **Credential Access** (TA0006) - **Process Injection** (T1053.005)
  - **Defense Evasion** (TA0005) - **Indicator Removal on Host** (T1112)
  - **Command and Control** (TA0011) - **Application Layer Protocol** (T1071.004)

  The primary data sources for detecting this activity are Windows registry event logs, which capture modifications to the registry keys. Monitoring these events will help to identify unauthorized changes that may indicate malicious intent.

  ### Investigation Steps
  - **Review Registry Events:** Examine Windows registry event logs for changes to keys ending with 'SOFTWARE\Microsoft\Windows\CurrentVersion\UMe' and 'SOFTWARE\Microsoft\Windows\CurrentVersion\UT'.
  - **Analyze Related Process Activity:** Investigate the processes that correlate with the registry events, identifying any suspicious or unfamiliar executables that may have been executed in conjunction with these changes.
  - **Check for Lateral Movement Indicators:** Look for signs of lateral movement such as unusual authentication patterns or attempts to access forbidden resources that might indicate the presence of the OilRig malware.
  - **Conduct Threat Intelligence Review:** Utilize threat intelligence feeds to gather additional context on detected behaviors or indicators related to the OilRig APT group to understand the broader implications of the detection.

  ### Prioritization
  This alert is considered critical due to the high potential impact associated with APT threats like OilRig. Given their objective to establish persistent access within enterprise networks, quick identification and response are essential to mitigate severe risks such as data loss and operational disruption.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise if registry logging is not enabled or if the registry monitoring solution lacks access to critical subkeys. The detection logic assumes that attackers will manipulate these specific registry keys, and therefore, it may miss other persistence techniques not captured by the monitored keys. Additionally, the effectiveness of this alert relies on unaltered logging configurations and the comprehensiveness of event data collected from affected systems.

