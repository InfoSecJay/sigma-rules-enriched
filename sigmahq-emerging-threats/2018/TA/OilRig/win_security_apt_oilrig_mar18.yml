note: |
  ### Technical Context

  This rule detects the creation of scheduled tasks related to potential malicious activity by the OilRig APT group, specifically targeting task names "SC Scheduled Scan" and "UpdatMachine." The likely attacker objective is to maintain persistence on compromised systems, allowing them to execute malicious payloads or commands at predetermined times. This activity aligns with the MITRE ATT&CK technique for "Scheduled Task/Job" (T1053.005) and the technique for "Create or Modify System Process" (T1543.003).

  The primary telemetry sources for this alert are Windows Security Event logs, particularly Event ID 4698, which logs when a scheduled task is created. If detected, malicious scheduled tasks can enable the adversary to maintain a foothold in the environment while executing secondary objectives. Importantly, the detection does NOT confirm that the task is malicious on its own; legitimate scheduled tasks can share similar names and purposes.

  ### Investigation Steps

  - **Review detected task details:** Check for Event ID 4698 in the Security logs to validate the creation of the scheduled task. Note the TaskName, User, and Action fields. Look for any unusual users or specific execution times. Scheduled tasks from legitimate software should not match the detected names.

  - **Query task scheduler for active tasks:** Use `schtasks /query /fo LIST /v` on the affected host to list all scheduled tasks. Compare the output against the alerts. Legitimate scheduled tasks should have standard execution paths and should have originated from well-known software.

  - **Inspect for command execution:** Monitor the Security logs for Event ID 4688 that shows process creation. Look for processes spawned by the scheduled tasks that are suspicious or non-standard (e.g., command shell or PowerShell executing unusual scripts).

  - **Verify related system changes:** Investigate Event IDs 5145 (File Share Access), 4672 (Special Privileges Assigned), or 4656 (Handle Created) around the same timeframe as the task creation. This can indicate further malicious activity or attempts to access sensitive files.

  - **Check for common evasion techniques:** Review if the task names have generic or misleading titles that may indicate an attempt to blend in with legitimate software (e.g., system update tasks). Additionally, assess logs for Windows Defender or other antivirus detection specifics—it may suggest attempts to disable defenses.

  ### Prioritization

  This alert is critical due to its association with advanced persistent threats (APTs) which target sensitive assets. The likelihood of malicious abuse is high, given that APT groups like OilRig regularly employ scheduled tasks to maintain persistence. The behavior detected here is often weaponized in real-world scenarios, making it essential to investigate promptly.

  ### Blind Spots and Assumptions

  Detection may miss alterations to existing tasks rather than their creation, as these can also indicate persistence strategies. Reliable detection requires that security logging is enabled for task creation events (Event ID 4698) and associated process creation. Legitimate system updates or scheduled scans from trusted applications might trigger similar alerts. A companion detection to consider includes monitoring for registry modifications related to task creation, which may further indicate system changes made by an adversary.

