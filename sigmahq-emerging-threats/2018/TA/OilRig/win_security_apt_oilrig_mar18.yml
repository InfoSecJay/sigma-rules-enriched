note: |
  ### Technical Context
  This detection rule identifies the creation of scheduled tasks that are indicative of persistence mechanisms employed by the OilRig APT group. Typically, attackers use such methods to maintain their foothold in a compromised system. By registering tasks to execute malicious scripts or programs at specified intervals, adversaries can automate their activities, exfiltrate data, or execute further attacks without user intervention. The rule specifically monitors the creation of scheduled tasks with names associated with OilRig’s tactics.

  The primary motivation of attackers utilizing scheduled tasks is to establish persistence, ensuring that their malicious capabilities remain operational even after system reboots or user logoff. The OilRig threat group, known for targeting organizations in the energy sector, employs sophisticated evasion techniques and may utilize these tasks to facilitate lateral movement or to exfiltrate sensitive information continuously.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003), specifically using Scheduled Task/Job (T1053.005).
  - **Execution** (TA0002), leveraging system processes to run commands (T1543.003).
  - **Defense Evasion** (TA0005), through techniques related to abnormal process creation, which can obscure malicious activities (T1112).

  The primary data source for detection in this context will be Windows Security event logs (particularly Event ID 4698), which log the creation of scheduled tasks.

  ### Investigation Steps
  - **Review Scheduled Task Creation Events**: Analyze Event ID 4698 logs for tasks with suspicious names like 'SC Scheduled Scan' or 'UpdatMachine'. Verify their legitimacy and the context of the user account that created them.
  - **Examine Task Execution History**: Investigate the task's history and execution logs to determine if and when the task has run. Look for suspicious execution patterns or unusual command-line arguments.
  - **Correlate with User Activity**: Check user activity around the time of task creation. Investigate for any anomalous behavior related to the account that created the task or connections that may indicate lateral movement.
  - **Conduct Process Analysis**: Perform a review of related processes spawned by these scheduled tasks, identifying any indicators of compromise or deviations from expected behavior.

  ### Prioritization
  This alert is of critical severity due to the potential impact of persistent backdoors established by advanced threat actors like OilRig. The likelihood of detection and response challenges during ongoing compromises elevates its priority for immediate investigation.

  ### Blind Spots and Assumptions
  Detection may be limited in environments where logging of Windows Security events is not adequately configured or where scheduled tasks are legitimate but poorly documented, leading to potential false positives. This rule assumes that Event ID 4698 logging is enabled and actively monitored, which is essential for the alert to function correctly. There may also be scenarios where attackers use different names for their scheduled tasks, requiring continuous adaptation of detection criteria.

