logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
    - '/delete'
    - '/change'
    CommandLine|contains|all:
    - '/TN'
    - '\Microsoft\Windows\Defrag\ScheduledDefrag'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors for the disabling or deactivation of the scheduled defragmentation task on Windows systems, specifically targeting the Slingshot APT group’s behaviors. The use of the `schtasks.exe` command with arguments that indicate deletion or modification of the Windows Defrag task can signify an attacker's attempt to create persistence, maintain control, or manipulate system resources without detection. Deactivating this task could hinder the proper functioning of system maintenance activities, potentially leading to performance degradation or assisting in the concealment of malicious activities.

  The attack aligns with several MITRE ATT&CK tactics and techniques, specifically **Persistence** (T1053.005), which involves leveraging scheduled tasks for maintaining access to compromised systems, and **Privilege Escalation** (S0111), as attackers may seek to elevate their privileges through altering system configurations.

  The primary data sources for this detection include Windows process creation events, specifically logs related to the execution of `schtasks.exe`. Analyzing these logs will provide insights into when and how the modification commands were issued.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the Windows process creation events to locate instances of `schtasks.exe` calling with parameters to delete or change the defragmentation task. Note the timestamp and parent processes to assess potential malicious activity.
  - **Examine Command-Line Arguments**: Inspect the command-line arguments associated with the `schtasks.exe` executions. Look for unusual parameters or unexpected usage patterns that deviate from standard operational procedures.
  - **Correlate with User Activity**: Cross-reference the timing of the events with user activity logs to identify any anomalous behavior, such as logins from unusual accounts or operating at odd hours, which could indicate malicious intentions.
  - **Investigate System Impact**: Assess the impact of the disabled defragmentation task on system performance and integrity. Check for other altered scheduled tasks or processes that could indicate a broader attack strategy.

  ### Prioritization
  The alert carries medium severity due to its potential implications for system performance and user operations. A compromised scheduled task can signal the presence of an advanced threat actor who may exploit this to further escalate privileges or maintain unauthorized access.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging is not adequately configured. The detection logic assumes that all relevant execution events of `schtasks.exe` are captured and that unauthorized changes are not part of normal operational processes. Continuous logging of process execution and command-line arguments must be configured on all relevant endpoints for this detection to function effectively.

