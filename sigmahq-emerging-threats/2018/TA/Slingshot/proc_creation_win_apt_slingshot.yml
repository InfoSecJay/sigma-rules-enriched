logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
    - '/delete'
    - '/change'
    CommandLine|contains|all:
    - '/TN'
    - '\Microsoft\Windows\Defrag\ScheduledDefrag'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the intentional deactivation or modification of the scheduled defragmentation task (`ScheduledDefrag`) on Windows systems. Such behavior may indicate an attacker attempting to disrupt system performance monitoring or attempting persistence mechanisms by manipulating scheduled tasks. The likely attacker objective is to obscure malicious activities or maintain control over the machine without being detected. This behavior is associated with the MITRE ATT&CK Technique: **T1053.005 - Scheduled Task/Job Modification**, and the tactic is **Persistence**.

  The primary telemetry source for this detection includes process creation logs, specifically focusing on the `schtasks.exe` execution, encompassing Event ID 4688 from Windows Security logs. If malicious, this activity can lead to further exploitation of the system. Importantly, this detection does NOT confirm the presence of active compromise on its own; additional context is necessary to assess the threat fully.

  ---

  ### Investigation Steps

  - **Check process creation logs:**
    Review Security Event ID 4688 for `schtasks.exe` execution. Look for any command lines that contain `/delete` or `/change` alongside `/TN \Microsoft\Windows\Defrag\ScheduledDefrag`. Malicious activity typically shows multiple, rapid executions.

  - **Verify command line parameters:**
    Inspect the command line details in the logs for specific modifications or deletions of the defrag task, particularly the presence of `\Microsoft\Windows\Defrag\ScheduledDefrag`. Legitimate administrators may modify this, but frequent or unusual edits can indicate malicious intent.

  - **Identify host role:**
    Determine if the affected system is a critical server relying on regular defragmentation for performance. A change on such assets may indicate a higher risk of exploitation, reinforcing the need for immediate investigation.

  - **Assess the timeline of changes:**
    Correlate the timing of this alert with other activity logs, such as logons (Event ID 4624) or remote connection events (Event ID 5140). Look for spikes in activity or unusual patterns that coincide with the changes to the scheduled task.

  - **Conduct user behavior analysis:**
    Review the user accounts that executed the schtasks commands. Compare with user roles; administrative accounts may legitimately modify scheduled tasks, while anomalous user accounts performing these actions could signify an intrusion.

  - **Evaluate for persistent threats:**
    Cross-check for other scheduled tasks whose parameters might have been altered. Look for anomalies like unexpected tasks or altered execution times that could indicate persistence mechanisms, which can be suspected if multiple suspicious task modifications are evident.

  ---

  ### Prioritization

  The severity of this alert is medium due to the possibility of a significant impact on system performance and the risk of enabling further malicious actions. The deactivation of a routine maintenance task, such as defragmentation, is not commonplace and suggests a higher likelihood of abuse, particularly within understood APT behaviors.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured log settings, causing missed events if specific logs are not enabled or retained long enough. Legitimate administrative changes to scheduled tasks can trigger this alert, potentially leading to false positives if not contextualized properly. Companion detection via logs related to user account control or anomalous account behavior (e.g., Event ID 4720 for account creation) could enhance coverage against persistence threats.

