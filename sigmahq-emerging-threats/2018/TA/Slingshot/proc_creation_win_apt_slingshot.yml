title: Defrag Deactivation
id: 958d81aa-8566-4cea-a565-59ccd4df27b0
status: test
description: Detects the deactivation and disabling of the Scheduled defragmentation
  task as seen by Slingshot APT group
references:
- https://securelist.com/apt-slingshot/84312/
author: Florian Roth (Nextron Systems), Bartlomiej Czyz (@bczyz1)
date: 2019-03-04
modified: 2022-10-09
tags:
- attack.persistence
- attack.t1053.005
- attack.s0111
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
    - '/delete'
    - '/change'
    CommandLine|contains|all:
    - '/TN'
    - '\Microsoft\Windows\Defrag\ScheduledDefrag'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the deactivation or disabling of the scheduled defragmentation task in Windows, which is an action commonly linked to the tactics employed by the Slingshot APT group. Attackers may disable or modify system maintenance tasks, such as scheduled defragmentation, to evade detection and hinder system performance analysis. By targeting these legitimate built-in functionalities, adversaries can create an environment that is more favorable for malicious activities.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Persistence** (TA0003), specifically the technique of **Scheduled Task/Job** (T1053.005). Attackers aiming to maintain a foothold may exploit such mechanisms to establish persistence while simultaneously minimizing attention from security teams. The primary telemetry required for this detection includes **process creation events**, focusing on executions of `schtasks.exe`, which is responsible for task scheduling in Windows environments.

  ### Investigation Steps
  - **Verify Scheduled Tasks:** Check the list of current scheduled tasks on the affected system to confirm if the `ScheduledDefrag` task has indeed been deactivated or altered.
  - **Analyze Process Creation Logs:** Investigate process creation logs for the invocation of `schtasks.exe` to gather information about the command syntax and specific arguments used in the execution.
  - **Check for Unusual Activity:** Look for additional events in the timeframe surrounding the detection, particularly any suspicious process activity or changes to system files and configurations that may indicate further compromise.
  - **Review Security Policies:** Assess Group Policy settings and local security policies for any recent changes that may have facilitated unauthorized alterations to scheduled tasks or system maintenance configurations.

  ### Prioritization
  This alert warrants medium severity due to the potential impact on system integrity and performance. Disabling scheduled tasks can signify an attempt to obscure malicious activities or enable other nefarious operations, which increases the likelihood of subsequent compromises.

  ### Blind Spots and Assumptions
  There may be gaps in detecting other task-related alterations that do not use `schtasks.exe` or similar command-line tools, as alternative methods could bypass this detection logic. The rule assumes that the execution of `schtasks.exe` with specific arguments is indicative of malicious behavior, which may not account for benign administrative activities. Additionally, comprehensive logging configurations must be enabled to ensure that process creation events are captured efficiently, as the absence of such logs could lead to missed detections.

