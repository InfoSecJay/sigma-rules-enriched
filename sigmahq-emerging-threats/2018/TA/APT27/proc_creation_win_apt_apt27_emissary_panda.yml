  product: windows
detection:
  selection_sllauncher:
    ParentImage|endswith: '\sllauncher.exe'
    Image|endswith: '\svchost.exe'
  selection_svchost:
    ParentImage|contains: '\AppData\Roaming\'
    Image|endswith: '\svchost.exe'
    CommandLine|contains: '-k'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies the execution of DLL side-loading malware associated with the APT27 group, also known as Emissary Panda. APT27 conducts advanced persistent threat (APT) operations typically targeting organizations for espionage and data exfiltration. This specific activity often involves the exploitation of legitimate processes to load malicious DLLs, enabling attackers to maintain persistence and evade detection. The primary goal of Emissary Panda is to stealthily gain a footing within the victim's network while moving laterally to capture sensitive information.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003): The threat actor establishes persistence through DLL side-loading techniques.
  - **Privilege Escalation** (TA0004): By using legitimate Windows processes to load malicious code, attackers may elevate their privileges.
  - **Defense Evasion** (TA0005): Leveraging legitimate binaries helps bypass security controls designed to detect suspicious behavior.

  Main data sources for detecting this behavior include:
  - **Process creation logs** from Windows Event Logs that detail process parent-child relationships and command-line arguments. Observing unusual command lines or parent processes can provide insight into malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Windows process creation logs to identify any launches of `svchost.exe` by the expected parent process `sllauncher.exe`. Look for unusual command lines that include `-k`, which could indicate DLL side-loading activity.

  - **Cross-reference with Known Good:** Compare the identified processes against known legitimate instances of `svchost.exe` running in your environment. Confirm whether the binary paths and versions match those typically associated with the operating system.

  - **Check for Unusual Parent Paths:** Investigate the parent image paths within process creation events. Instances where `svchost.exe` is launched from unexpected locations, such as user profile directories, warrant further scrutiny.

  - **Assess for Related Artifacts:** Collect and analyze any artifacts related to other processes spawned by `sllauncher.exe`. Including memory dumps or file system paths can provide insight into potential malicious payload execution or lateral movement.

  ### Prioritization
  Given that DLL side-loading techniques enable attackers to exploit trusted processes, this alert holds a critical severity level in an enterprise environment. Compromised processes represent a significant risk for data exfiltration and lateral movement within the network, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  This detection may not cover all potential instances of APT27 activity, especially if the attackers utilize different processes or methods not captured by this specific rule. Assumptions include that processes like `sllauncher.exe` will always follow the expected patterns for DLL side-loading. Furthermore, sufficient logging configurations for process creation events must be in place for effective detection.

