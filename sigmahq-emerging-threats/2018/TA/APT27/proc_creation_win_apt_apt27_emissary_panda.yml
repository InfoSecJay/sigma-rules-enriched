detection:
  selection_sllauncher:
    ParentImage|endswith: '\sllauncher.exe'
    Image|endswith: '\svchost.exe'
  selection_svchost:
    ParentImage|contains: '\AppData\Roaming\'
    Image|endswith: '\svchost.exe'
    CommandLine|contains: '-k'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This detection rule identifies the execution of DLL side-loading malware associated with APT27, also known as Emissary Panda. The attackers typically aim to maintain persistence and escalate privileges within the target environment, leveraging trusted processes like `svchost.exe` to execute malicious payloads covertly. This behavior is particularly alarming in the context of the MITRE ATT&CK framework, involving Tactic: Persistence, Technique: DLL Search Order Hijacking (T1574.001).

  The primary telemetry sources for this detection are Windows process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, which both provide insights on process activity. If malicious, this activity could lead to significant security breaches, including unauthorized access, data exfiltration, and further lateral movement within the network. However, it is crucial to understand that this detection alone does not confirm an incident; additional context is needed to ascertain intent and impact.

  ### Investigation Steps

  - **Identify suspicious process creation:** Review Security Event ID 4688 for new process events. Look for instances where `ParentImage` ends with `sllauncher.exe` and `Image` ends with `svchost.exe`. Benign instances are usually initiated by system processes or application services.

  - **Analyze command-line arguments:** Investigate Sysmon Event ID 1 to check for instances of `svchost.exe` with command-line arguments containing `-k`. Malicious behavior often has unusual or unexpected arguments, unlike typical service calls.

  - **Check for process lineage:** Examine the creation chain of any suspicious `svchost.exe` instances to identify if they initiated from `C:\Users\<username>\AppData\Roaming\`. Legitimate applications will not typically spawn from user profile paths without clear association.

  - **Validate the legitimacy of the parent process:** Evaluate the credibility of `sllauncher.exe`. Ensure it is known software, while a lack of digital signatures or unusual file paths (e.g., user directories) may indicate malicious intent.

  - **Look for indicators of exfiltration activity:** Correlate outputs with common file access or network activity associated with known malicious actors. Monitor for unauthorized outbound connections, which may indicate data exfiltration.

  - **Identify legitimate activity patterns:** Consider common usages of `svchost.exe`. Expected behavior often involves system updates or service initialization, which can be identified through consistent patterns in logs over time.

  ### Prioritization

  The alert is critical due to the potential impact on system integrity and the likelihood of exploitation by advanced persistent threats. APT27 is known for using sophisticated methods, making this behavior a strong indicator of malicious intent, especially if associated with sensitive systems.

  ### Blind Spots and Assumptions

  Detection may be limited by malware employing techniques to evade detection, such as process name obfuscation or alternate DLLs. Reliable logging configurations are required for complete visibility; ensure Sysmon is properly deployed. Legitimate software updating or maintenance activities may trigger similar alerts, necessitating careful context analysis. A recommended companion detection could involve monitoring for unusual network traffic to validate whether the executed instance is interacting with known malicious C2 servers.

