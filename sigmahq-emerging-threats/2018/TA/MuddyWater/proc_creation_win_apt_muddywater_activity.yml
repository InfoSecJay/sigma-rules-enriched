logsource:
  category: process_creation
  product: windows
detection:
  selection_mshta:
    CommandLine|contains|all:
    - 'vbscript:Close(Execute("CreateObject('
    - 'powershell'
    - '-w 1 -exec Bypass'
    - '\ProgramData\'
  selection_survey:
    CommandLine|contains|all:
    - 'Win32_OperatingSystem'
    - 'Win32_NetworkAdapterConfiguration'
    - 'root\SecurityCenter2'
    - '[System.Net.DNS]'
  selection_pwsh_backdoor:
    CommandLine|contains|all:
    - '[Convert]::ToBase64String'
    - '[System.Text.Encoding]::UTF8.GetString]'
    - 'GetResponse().GetResponseStream()'
    - '[System.Net.HttpWebRequest]::Create('
    - '-bxor '
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects behaviors associated with potential MuddyWater APT activity, specifically focusing on the use of mshta, PowerShell backdoors, and network-related commands typically utilized in post-exploitation scenarios. The likely attacker objective is to establish persistence and execute payloads for data exfiltration or lateral movement within the network. The relevant MITRE ATT&CK tactics include Execution (TA0002) and Defense Evasion (TA0005), specifically techniques G0069 (Masquerading).

  Primary telemetry sources include Windows process creation logs, specifically Security Event ID 4688 or Sysmon Event ID 1, which log command line arguments used to execute processes. Malicious use of these commands can lead to unauthorized data access or system compromise, potentially impacting sensitive information and system integrity. Importantly, this detection does NOT confirm that a system has been fully compromised or that malicious activity is ongoing; further investigation is required.

  ### Investigation Steps

  - **Check the process creation logs**: Review Security Event ID 4688 or Sysmon Event ID 1 for any recent command lines associated with `mshta`, especially those containing strings like 'vbscript:Close(Execute("CreateObject(' or '-exec Bypass'. Look for the presence of unusual command line arguments that do not align with legitimate use.

  - **Identify scripted PowerShell executions**: Look for PowerShell command invocations including `-bxor`, `[Convert]::ToBase64String`, and HTTP-related commands in command line arguments. These are strong indicators of potential backdoor activity.

  - **Evaluate normal environment behavior**: Establish a baseline of permitted mshta and PowerShell use in your environment. Typical legitimate activities include scheduled scripts or authorized automation tasks using clear command line arguments without obfuscation.

  - **Correlate observed commands with network activity**: Inspect outbound connections or DNS queries related to the commands found, checking for any indicators of data exfiltration or contact with known malicious IPs or domains. Implement network firewall logs for this validation.

  - **Assess affected system’s role**: Determine the criticality of the system where the behavior was detected. If part of a high-value asset (e.g., domain controllers), prioritize further investigation and containment.

  - **Cross-reference with existing intelligence**: Verify if the usage patterns align with known tactics from the MuddyWater APT, utilizing intel resources regarding ongoing campaigns or indicators of compromise associated with this group.

  ### Prioritization

  This alert is of high severity given the potential impact on critical systems and the likelihood of malicious activity. The tactics employed by adversaries in this context are often weaponized, possibly leading to severe breaches. Immediate triaging is essential due to the high risk associated with APT activity.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging, particularly if the system is not set to capture all process creation events. Legitimate administrative scripts or scheduled tasks can trigger similar alerts, necessitating context-aware analysis. A relevant companion detection includes monitoring for unusual PowerShell execution patterns using `Get-Command` or `Invoke-WebRequest`, which can strengthen coverage against this APT's techniques.

