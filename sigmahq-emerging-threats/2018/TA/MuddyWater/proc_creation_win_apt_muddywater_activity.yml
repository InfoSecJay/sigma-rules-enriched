detection:
  selection_mshta:
    CommandLine|contains|all:
    - 'vbscript:Close(Execute("CreateObject('
    - 'powershell'
    - '-w 1 -exec Bypass'
    - '\ProgramData\'
  selection_survey:
    CommandLine|contains|all:
    - 'Win32_OperatingSystem'
    - 'Win32_NetworkAdapterConfiguration'
    - 'root\SecurityCenter2'
    - '[System.Net.DNS]'
  selection_pwsh_backdoor:
    CommandLine|contains|all:
    - '[Convert]::ToBase64String'
    - '[System.Text.Encoding]::UTF8.GetString]'
    - 'GetResponse().GetResponseStream()'
    - '[System.Net.HttpWebRequest]::Create('
    - '-bxor '
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects specific command line patterns consistent with the behavior of the MuddyWater APT group, known for executing malicious scripts via Windows processes. The primary objective of such an attack is to establish persistent access to compromised systems through techniques like backdooring and information exfiltration. This behavior relates to the MITRE ATT&CK technique: **Execution - Command and Scripting Interpreter (T1059)** and **Persistence - Create or Modify System Process (T1543)**.

  The relevant telemetry source for this detection is Windows process creation logs, specifically focusing on Event ID 4688 and Sysmon Event ID 1. If the behavior is determined to be malicious, it can allow attackers to maintain control over the environment, steal sensitive information, or actively compromise additional systems. Importantly, this detection does NOT confirm an attacker’s presence or successful data exfiltration on its own; further investigation is required to assess the full context.

  ### Investigation Steps

  - **Review process creation events:** Analyze Security Event ID 4688 or Sysmon Event ID 1 for process creation involving `mshta.exe` with command line arguments containing `vbscript:Close(Execute("CreateObject(` or `powershell -w 1 -exec Bypass`, as these are high-confidence indicators of potential malicious activity.

  - **Correlate with network activity:** Check network logs for abnormal outbound connections, particularly those initiated by processes related to this command line activity, such as connections to known malicious IPs or domains relevant to MuddyWater.

  - **Identify legitimate usage patterns:** Look for expected use of `mshta.exe` or `powershell` in your environment, such as internal automation scripts or IT administrative tasks. Many organizations utilize PowerShell for legitimate tasks, often bypassing execution policies.

  - **Examine scheduled tasks and persistence mechanisms:** Review Task Scheduler for entries linked to unusual commands or scripts that replicate the observed command lines, particularly focusing on keys like `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`.

  - **Analyze for potential file artifacts:** Investigate `C:\ProgramData\` or similar directories for newly created files or scripts, especially those encoded in Base64 or containing unusual script executions. Look for hidden or obfuscated artifacts related to the `GetResponse()` method.

  ### Prioritization

  This alert is of high severity, reflecting the potential for significant impact based on the compromised system's role, such as a domain controller or a system with sensitive data. The likelihood of malicious abuse is raised due to the known tactics of MuddyWater, indicating a high risk of exploitation if this activity is confirmed as malicious.

  ### Blind Spots and Assumptions

  Detection limitations may include evasion techniques like obfuscation in command arguments or the use of other scripting languages that may not be captured by existing logging configurations. Reliable detection requires proper logging settings for process creation and command line evidence, as well as monitoring for typical legitimate uses that could trigger these alerts, such as administrative PowerShell scripts. A related detection to consider would be one that monitors for unusual patterns in PowerShell command execution, enhancing coverage around potential malicious scripting activities.

