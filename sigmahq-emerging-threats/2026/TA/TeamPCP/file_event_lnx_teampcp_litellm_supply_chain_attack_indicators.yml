logsource:
  category: file_event
  product: linux
detection:
  selection:
    Image|contains: '/python3'
    TargetFilename|endswith:
    - '/.config/sysmon/sysmon.py'
    - '/.config/systemd/user/sysmon.service'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of specific persistence files associated with the LiteLLM supply chain attack, primarily targeting Linux-based systems. The malicious activity seeks to establish a foothold by installing a persistent command-and-control (C2) backdoor, along with harvesting sensitive credentials from the system. This behavior correlates with the MITRE ATT&CK technique T1543.002 (Application Layer Protocol).

  The primary telemetry source for this detection includes Linux file event logs that specifically track modifications or creations of files. If malicious, this activity could lead to account compromise and further intrusions within the network. Importantly, while this detection indicates potentially unauthorized persistence mechanisms, it does not confirm that credential harvesting or backdoor activation has occurred.

  ### Investigation Steps

  - **Review file creation events:** Check for Linux file event logs (e.g., `auditd` logs) showing `TargetFilename` entries for `.config/sysmon/sysmon.py` and `.config/systemd/user/sysmon.service`. Look for the creation of these files along with the timestamp of creation.

  - **Identify parent processes:** Investigate the parent process of any related file creation events (Security Event IDs for `auditd`, e.g., 1102). Confirm if the process originates from a legitimate source (e.g., a trusted Python interpreter) or if it appears suspiciously related to unauthorized scripts.

  - **Compare against normal behavior:** Identify normal user and system behavior where Python scripts are deployed in your environment. Expected legitimate activities should not involve these specific file paths or abnormal process relationships with user-level operations.

  - **Verify file contents:** If detected files are present, examine their contents for known malicious signatures or blobs using tools like `cat` or `less`. Significant patterns of unusual network activity or root privileges would suggest malicious intent.

  - **Correlate with C2 traffic:** Analyze network logs for any outgoing connections from the affected host to unusual domains or IP addresses, particularly those associated with TeamPCP, as persistent backdoors typically beacon out to external C2 infrastructure.

  - **Cross-check with threat intelligence:** Validate if the system shows indicators of compromise (IOCs) related to the LiteLLM threat actor or similar campaigns. Use threat intelligence reports to match against the alert findings.

  ### Prioritization

  This alert is of high severity given that it involves the potential establishment of persistence mechanisms by an active threat actor. The likelihood of malicious abuse is significant, as this technique has been seen in targeted supply chain attacks. Since this behavior aligns with documented adversary tactics, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the completeness of the logging configuration on Linux systems; missing `auditd` logs could result in gaps. Legitimate software deployment practices involving Python could trigger false positives. Related detections that strengthen coverage are those focusing on unusual process executions or network outbound connections from user-level scripts which can indicate stages of post-exploitation activity.

