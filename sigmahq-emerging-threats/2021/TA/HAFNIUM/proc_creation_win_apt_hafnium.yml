title: HAFNIUM Exchange Exploitation Activity
id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
status: test
description: Detects activity observed by different researchers to be HAFNIUM group
  activity (or related) on Exchange servers
references:
- https://blog.truesec.com/2021/03/07/exchange-zero-day-proxylogon-and-hafnium/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
- https://twitter.com/GadixCRK/status/1369313704869834753?s=20
- https://twitter.com/BleepinComputer/status/1372218235949617161
author: Florian Roth (Nextron Systems)
date: 2021-03-09
modified: 2023-03-09
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1546
- attack.t1053
- attack.g0125
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_attrib:
    CommandLine|contains|all:
    - 'attrib'
    - ' +h '
    - ' +s '
    - ' +r '
    - '.aspx'
  selection_vsperfmon:
  - Image|contains: '\ProgramData\VSPerfMon\'
  - CommandLine|contains|all:
    - 'schtasks'
    - 'VSPerfMon'
  selection_opera_1:
    Image|endswith: 'Opera_browser.exe'
    ParentImage|endswith:
    - '\services.exe'
    - '\svchost.exe'
  selection_opera_2:
    Image|endswith: 'Users\Public\opera\Opera_browser.exe'
  selection_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin list shadows'
    - 'Temp\__output'
  selection_makecab_1:
    Image|endswith: '\makecab.exe'
    CommandLine|contains|all:
    - 'inetpub\wwwroot\'
    - '.dmp.zip'
  selection_makecab_2:
    Image|endswith: '\makecab.exe'
    CommandLine|contains:
    - 'Microsoft\Exchange Server\'
    - 'compressionmemory'
    - '.gif'
  selection_7zip:
    CommandLine|contains|all:
    - ' -t7z '
    - 'C:\Programdata\pst'
    - '\it.zip'
  selection_rundll32:
    CommandLine|contains|all:
    - '\comsvcs.dll'
    - 'Minidump'
    - 'full '
    - '\inetpub\wwwroot'
  selection_other:
    CommandLine|contains:
    - 'Windows\Temp\xx.bat'
    - 'Windows\WwanSvcdcs'
    - 'Windows\Temp\cw.exe'
  condition: 1 of selection*
falsepositives:
- Unlikely
level: critical
note: |
  ---

  ### Technical Context

  This Sigma rule detects various suspicious process creation activities associated with the HAFNIUM group, particularly targeting Microsoft Exchange servers. The rule identifies attempts to create hidden files or manipulate backup shadow copies, indicative of potential data exfiltration or persistence tactics employed by attackers. The primary MITRE ATT&CK tactics relate to Execution (TA0002) and Persistence (TA0003), with techniques including Privilege Escalation (T1546) and Scheduler (T1053).

  Key telemetry sources include Windows Process Creation logs (Security Event ID 4688), Sysmon Event ID 1 for process creation, and logs specifically from the Exchange server environment. If malicious, this behavior could lead to unauthorized access or data leakage from critical Exchange servers. However, the detection does NOT confirm active exploitation or compromise by itself; further investigation is necessary to establish the context and intent behind the observed activity.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 and Sysmon Event ID 1 to identify the processes involved. Look for command lines that include 'attrib +h +s +r *.aspx' or 'vssadmin list shadows' to find potential malicious actions.

  - **Investigate specific file access:** Look for any accesses to 'C:\ProgramData\VSPerfMon\*.dll' or 'C:\inetpub\wwwroot\*.gif' in the filesystem. Malicious indicators include unusual file types or access patterns that are not typical for server operations, like compressed files or dumps.

  - **Correlation with user behavior:** Verify that no authorized user or application legitimately scheduled tasks using 'schtasks' with the process 'VSPerfMon'. Document any expected behaviors of admins or services that might invoke these actions to rule out false positives.

  - **Flag unusual command structures:** Identify command lines that utilize 'makecab.exe' with parameters for compressing files in the Exchange Server directories (e.g., 'inetpub\wwwroot'). Compare against typical administrative activities for the Exchange environment.

  - **Monitor for known malicious indicators:** Look for file creation or modification timestamps that align with the command line patterns identified as malicious, especially in temporary or hidden directories. High-confidence indicators include the presence of .zip files containing sensitive data or unusual Minidump files.

  ---

  ### Prioritization

  Given the critical role of Exchange servers in an enterprise, any alert related to HAFNIUM exploitation attempts is severe. The likelihood of malicious abuse is high due to the advanced nature of the threat actors involved and the common targeting of these systems for data exfiltration or backdoor installation.

  ---

  ### Blind Spots and Assumptions

  This rule relies heavily on Windows process creation telemetry; environments with insufficient logging enabled may fail to detect such activities. Legitimate activities, such as maintenance scripts or backup tasks running on the Exchange server, may trigger false positives. Companion detections focused on network activity, such as unusual outbound connections from Exchange servers or atypical API calls, can enhance overall threat visibility.

