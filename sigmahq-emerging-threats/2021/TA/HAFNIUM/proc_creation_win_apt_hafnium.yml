title: HAFNIUM Exchange Exploitation Activity
id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
status: test
description: Detects activity observed by different researchers to be HAFNIUM 
  group activity (or related) on Exchange servers
references:
- https://blog.truesec.com/2021/03/07/exchange-zero-day-proxylogon-and-hafnium/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
- https://twitter.com/GadixCRK/status/1369313704869834753?s=20
- https://twitter.com/BleepinComputer/status/1372218235949617161
author: Florian Roth (Nextron Systems)
date: 2021-03-09
modified: 2023-03-09
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1546
- attack.t1053
- attack.g0125
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_attrib:
    CommandLine|contains|all:
    - 'attrib'
    - ' +h '
    - ' +s '
    - ' +r '
    - '.aspx'
  selection_vsperfmon:
  - Image|contains: '\ProgramData\VSPerfMon\'
  - CommandLine|contains|all:
    - 'schtasks'
    - 'VSPerfMon'
  selection_opera_1:
    Image|endswith: 'Opera_browser.exe'
    ParentImage|endswith:
    - '\services.exe'
    - '\svchost.exe'
  selection_opera_2:
    Image|endswith: 'Users\Public\opera\Opera_browser.exe'
  selection_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin list shadows'
    - 'Temp\__output'
  selection_makecab_1:
    Image|endswith: '\makecab.exe'
    CommandLine|contains|all:
    - 'inetpub\wwwroot\'
    - '.dmp.zip'
  selection_makecab_2:
    Image|endswith: '\makecab.exe'
    CommandLine|contains:
    - 'Microsoft\Exchange Server\'
    - 'compressionmemory'
    - '.gif'
  selection_7zip:
    CommandLine|contains|all:
    - ' -t7z '
    - 'C:\Programdata\pst'
    - '\it.zip'
  selection_rundll32:
    CommandLine|contains|all:
    - '\comsvcs.dll'
    - 'Minidump'
    - 'full '
    - '\inetpub\wwwroot'
  selection_other:
    CommandLine|contains:
    - 'Windows\Temp\xx.bat'
    - 'Windows\WwanSvcdcs'
    - 'Windows\Temp\cw.exe'
  condition: 1 of selection*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects suspicious process creations and command-line invocations associated with the HAFNIUM cyber threat group, particularly on Microsoft Exchange servers. The behaviors detected indicate possible exploitation of vulnerabilities to establish persistence and escalate privileges for data exfiltration. The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Privilege Escalation (T1068).

  Primary telemetry sources include Windows process creation logs (Event ID 4688) and Sysmon logs (Event ID 1) capturing detailed process activity and command-line arguments. A successful exploitation may lead to unauthorized access to sensitive data and potentially compromise the integrity of the Exchange server environment. However, detection of these activities does not confirm that a compromise has occurred; it merely indicates suspicious behavior that requires further investigation.

  ### Investigation Steps

  - **Examine process creation logs**: Check Windows Security Event ID 4688 and Sysmon Event ID 1 for any instances of processes like `makecab.exe`, `Opera_browser.exe`, or `vssadmin` being executed with unusual command-line arguments.

  - **Identify suspicious command-line patterns**: Look for command lines containing keywords such as 'attrib', ' +h ', ' +s ', and ' +r ' along with '.aspx'. These patterns indicate potential attempts to evade detection by hiding files.

  - **Analyze the origin of the processes**: Determine if the `makecab.exe` or `vssadmin` processes are initiated from unusual directories (e.g., not from 'C:\Windows\System32' or 'C:\Windows'). Any execution from 'ProgramData' or 'Temp' is suspicious.

  - **Review legitimate activity**: Cross-reference legitimate server maintenance tasks and ensure that expected command-line arguments for `vssadmin` do not match detected suspicious patterns. Legitimate backups or shadow copies would typically not include options for listing shadows on a temp directory.

  - **Correlate with telemetry from Exchange logs**: Investigate Exchange Server logs for any inbound or outbound traffic that coincides with the timing of suspicious process executions. Look for unusual authentication attempts or data retrieval activities that correspond to the alert.

  - **Confirm potential data exfiltration**: Look for indications of compressed files (e.g., `*.zip` or `*.dmp.zip`) being created or transferred to external locations, particularly by any detected processes. This could imply data is being packaged for extraction.

  ### Prioritization

  This alert should be prioritized as critical given the high impact of an exploited Exchange server within an enterprise. The likelihood of malicious abuse is elevated due to the known targeting by HAFNIUM, which has been associated with widespread exploitation of zero-day vulnerabilities. This behavior is commonly weaponized by advanced threat actors, necessitating rapid investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is improperly configured or if processes are obscured by legitimate applications mimicking malicious behavior. There is a potential for false negatives if processes are executed in legitimate contexts but with unusual arguments. Additionally, monitoring for legitimate activities such as administrative tasks on the Exchange server may trigger the alert. Companion detections include monitoring for unusual network traffic patterns or authentication failures, which enhance visibility into potential compromise activities.

