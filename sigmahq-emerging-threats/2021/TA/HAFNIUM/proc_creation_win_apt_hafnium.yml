title: HAFNIUM Exchange Exploitation Activity
id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
status: test
description: Detects activity observed by different researchers to be HAFNIUM group
  activity (or related) on Exchange servers
references:
- https://blog.truesec.com/2021/03/07/exchange-zero-day-proxylogon-and-hafnium/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
- https://twitter.com/GadixCRK/status/1369313704869834753?s=20
- https://twitter.com/BleepinComputer/status/1372218235949617161
author: Florian Roth (Nextron Systems)
date: 2021-03-09
modified: 2023-03-09
tags:
- attack.persistence
- attack.t1546
- attack.t1053
- attack.g0125
- detection.emerging-threats
logsource:
  category: process_creation
  product: windows
detection:
  selection_attrib:
    CommandLine|contains|all:
    - 'attrib'
    - ' +h '
    - ' +s '
    - ' +r '
    - '.aspx'
  selection_vsperfmon:
  - Image|contains: '\ProgramData\VSPerfMon\'
  - CommandLine|contains|all:
    - 'schtasks'
    - 'VSPerfMon'
  selection_opera_1:
    Image|endswith: 'Opera_browser.exe'
    ParentImage|endswith:
    - '\services.exe'
    - '\svchost.exe'
  selection_opera_2:
    Image|endswith: 'Users\Public\opera\Opera_browser.exe'
  selection_vssadmin:
    CommandLine|contains|all:
    - 'vssadmin list shadows'
    - 'Temp\__output'
  selection_makecab_1:
    Image|endswith: '\makecab.exe'
    CommandLine|contains|all:
    - 'inetpub\wwwroot\'
    - '.dmp.zip'
  selection_makecab_2:
    Image|endswith: '\makecab.exe'
    CommandLine|contains:
    - 'Microsoft\Exchange Server\'
    - 'compressionmemory'
    - '.gif'
  selection_7zip:
    CommandLine|contains|all:
    - ' -t7z '
    - 'C:\Programdata\pst'
    - '\it.zip'
  selection_rundll32:
    CommandLine|contains|all:
    - '\comsvcs.dll'
    - 'Minidump'
    - 'full '
    - '\inetpub\wwwroot'
  selection_other:
    CommandLine|contains:
    - 'Windows\Temp\xx.bat'
    - 'Windows\WwanSvcdcs'
    - 'Windows\Temp\cw.exe'
  condition: 1 of selection*
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This detection rule identifies potential exploitation activities associated with the HAFNIUM threat group, particularly targeting Microsoft Exchange servers. HAFNIUM is known for leveraging vulnerabilities in Exchange, such as the ProxyLogon vulnerabilities, to gain unauthorized access, establish persistence, and exfiltrate sensitive data. Attackers often employ various tools and commands to manipulate server configurations, extract data, and create backdoors for continued access. This rule covers multiple techniques used in exploitation chains that involve modifying files, creating scheduled tasks, and executing remote commands.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (T1546)**: Utilizing techniques to maintain access on compromised systems.
  - **Scheduled Tasks/Job (T1053)**: Creating tasks to execute payloads or malicious binaries at scheduled intervals.
  - **Exploitation of Remote Services (G0125)**: Targeting exposed services like Exchange to exploit vulnerabilities for initial access.

  Primary data sources for detection include:
  - **Process creation events** from Windows logs, which provide insights into commands executed and processes spawned on the Exchange server.
  - **Event logs** related to the manipulation of the Windows Task Scheduler which can reveal any scheduled tasks created by adversaries.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation events for instances of unusual command-line arguments, such as the presence of 'attrib' and '.aspx' files which are typically associated with HAFNIUM’s techniques.
  - **Inspect Scheduled Tasks**: Investigate scheduled tasks on Exchange servers to identify anything abnormal, particularly those created using 'schtasks' that may involve the use of 'VSPerfMon' or executing commands in an unusual context.
  - **Check for File Modifications**: Look for recent changes in sensitive directories (e.g., `inetpub\wwwroot\`) that could have originated from execution of tools like `makecab.exe`, which can be misused in exploitation scenarios.
  - **Gather Network Logs**: If applicable, analyze network traffic logs to detect any outbound connections that may indicate data exfiltration, especially related to suspicious processes that have been identified.

  ### Prioritization
  The alert's severity is marked as critical due to the direct implications of successful exploitation of Exchange servers, which can lead to significant data breaches and compromise of organizational email communications. The likelihood of HAFNIUM activities continues to be high given their active targeting of vulnerabilities.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of certain logging configurations, especially if process creation logs are not fully enabled. The detection logic assumes that the cmdlet and tools used by the HAFNIUM group are not modified significantly to evade detection. Additionally, a lack of monitoring for network logs may hinder the ability to capture data exfiltration attempts, necessitating robust logging practices across the enterprise to ensure incident detection is comprehensive.

