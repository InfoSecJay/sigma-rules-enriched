note: |
  ### Technical Context
  This detection rule identifies access attempts to the DEWMODE webshell, which is leveraged by threat actors for maintaining persistence on compromised systems. Webshells like DEWMODE enable attackers to execute commands, redirect traffic, and facilitate data exfiltration. The likelihood of an attacker utilizing this technique is bolder in targeted cyber intrusions, often following an initial exploitation phase to retain control over the environment.

  The relevant MITRE ATT&CK tactics include Persistence (TA0003) and the technique **Web Shell (T1505.003)**. Attackers exploiting web applications typically aim to expand their control to manipulate data or present further risks to the network by establishing persistent access through the installed webshell. Monitoring web traffic to detect HTTP requests linked to such webshells is crucial for the timely identification of intrusions.

  Primary data sources for detecting this activity include web server logs, which capture all incoming HTTP requests and their associated query parameters.

  ### Investigation Steps
  - **Review Web Server Logs:** Check for logs from web servers containing query strings with suspicious parameters (`?dwn=`, `&fn=`, and other indicators of webshell access) that show unauthorized access attempts.

  - **Analyze User Behavior:** Investigate the user agent strings or originating IP addresses associated with the detected requests to identify patterns that may point to malicious activity or insider threats.

  - **Cross-reference with Known Indicators:** Compare detected activity against known indicators of compromise related to DEWMODE or webshells to assess the nature of queries being executed.

  - **Inspect Accompanying Network Traffic:** Examine network traffic associated with the web server’s requests for any unusual outbound connections that may indicate data exfiltration or further malicious activity.

  ### Prioritization
  The severity of this alert is high due to the potential impact webshells can have on an enterprise's security posture, enabling attackers to execute arbitrary commands and potentially access sensitive data unnoticed.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments that do not maintain detailed web server logging for all incoming requests or where logging is not centralized. The detection logic assumes that webshell activity will follow recognizable patterns in query parameters; however, sophisticated attackers may obfuscate their queries to bypass detection. Adequate logging configurations must be in place to ensure query strings are captured in the web server logs for this detection rule to function effectively.

