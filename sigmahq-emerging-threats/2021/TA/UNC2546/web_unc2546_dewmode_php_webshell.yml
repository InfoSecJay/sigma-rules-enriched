note: |
  ### Technical Context

  This Sigma rule detects access attempts to the DEWMODE webshell, a known exploitation vector used to achieve persistence and control over compromised web servers. Attackers typically leverage this webshell to exfiltrate sensitive data, manipulate resources, or deploy additional malware. The relevant MITRE ATT&CK tactic is "Persistence" and the technique is "Web Shell" (T1505.003).

  Primary telemetry sources include web server logs capturing access logs (e.g., IIS logs, Apache access logs) detailing URI queries and parameters. If an access to the DEWMODE webshell is confirmed malicious, it may lead to severe security incidents, including data theft or system compromise. It is crucial to emphasize that this detection does NOT confirm that an attacker has successfully executed arbitrary commands, only that the webshell was accessed.

  ### Investigation Steps

  - **Inspect web server access logs:** Review relevant log entries for suspicious requests matching the query patterns specified in the rule. Identify Event ID  logs like IIS 500 or Apache access logs where `cs-uri-query` contains `?dwn=` or similar parameters.

  - **Correlate against previous requests:** Look for unusual patterns in the same session or from the same IP address in the web server logs. Check if there are multiple requests made in a short timeframe (e.g., rapid succession within minutes) indicative of potential automated exploitation.

  - **Assess impacted server roles:** Determine the role of the server that registered the alert. If it is hosting critical services (e.g., a financial web application), prioritize the investigation and consider containing the server.

  - **Validate legitimate access patterns:** Confirm whether requests to the webshell were part of scheduled maintenance or legitimate administrative actions. Document the requester’s identity, purpose, and whether access was consistent with known operational procedures.

  - **Identify high-confidence malicious indicators:** Check for any accompanying artifacts such as newly created files with unusual timestamps on the server's filesystem, or evidence of command execution following the webshell access, indicating a compromise.

  ### Prioritization

  The alert severity is high due to the potential impact on web servers, which can serve crucial enterprise functions and sensitive data. This behavior is often exploited in targeted attacks, increasing the likelihood of malicious use, and it is associated with advanced threat actors utilizing webshells for persistence.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false negatives, as attackers may obfuscate their initial access attempts or use alternative vectors not covered by this rule. Reliable detection requires proper logging configurations to capture all relevant URI queries in web server logs. Additionally, legitimate administrative access to web applications could trigger this alert, especially during updates or maintenance. A complementary detection to consider is monitoring for changes to web server file structures or configurations, which can indicate further exploitation.

