  ---

  ### Technical Context

  This rule detects access attempts to the DEWMODE webshell, commonly exploited through vulnerable applications like Accellion FTA. Attackers leveraging this webshell aim to maintain persistence, exfiltrate data, or conduct further malicious activities by executing commands on compromised systems. The relevant MITRE ATT&CK tactics include Persistence and the technique T1505.003 (Web Shell).

  Primary telemetry sources include web server logs, specifically logs that capture URI queries. If exploited successfully, the security impact includes unauthorized access to sensitive data and system control by the adversary. Note that this detection does NOT confirm that the webshell is being used maliciously; it merely indicates an access attempt which requires further investigation.

  ---

  ### Investigation Steps

  - **Verify URI access patterns:** Analyze web server logs (e.g., Event ID 4616 or web server access logs) for entries matching `?dwn=`, `&fn=`, or `&dwn=` to identify suspicious access to webshells.

  - **Assess normal web traffic:** Cross-reference legitimate usage patterns, such as maintenance updates or authorized user access written in your web server documentation or user access logs.

  - **Look for successful exploits:** Check for other indicators of compromise around the same timestamps, such as unusual process creation involving cmd.exe or powershell.exe, indicated by Sysmon Event ID 1 and 4688.

  - **Correlate with user activity:** Investigate the user agent string associated with the suspicious access. Legitimate users typically exhibit consistent user agent patterns, while abuse may show automated or non-standard user agents.

  - **Conduct endpoint verification:** If identified as high-risk, check the host for file creation or exfiltration artifacts, particularly around forensic logs or any .html files added recently in the web server directory.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact of data theft and system compromise on critical business operations. The likelihood of malicious abuse is elevated, especially given that exploitation of web shells is a common tactic employed by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured web server logging or if web traffic is encrypted (HTTPS), which could obscure URI parameters. Legitimate backup operations or system maintenance might trigger similar alerts. Companion detections related to general web access anomalies or abnormal patterns in user behavior could strengthen overall detection capabilities.

