logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|contains:
    - 'windows\system32\Physmem.sys'
    - 'Windows\system32\ime\SHARED\WimBootConfigurations.ini'
    - 'Windows\system32\ime\IMEJP\WimBootConfigurations.ini'
    - 'Windows\system32\ime\IMETC\WimBootConfigurations.ini'
  registry_image:
    Image|contains:
    - 'windows\system32\filepath2'
    - 'windows\system32\ime'
    CommandLine|contains: 'reg add'
  registry_key:
    CommandLine|contains:
    - 'HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32'
    - 'HKEY_LOCAL_MACHINE\software\classes\clsid\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32'
  condition: selection or all of registry_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious behavior associated with the SOURGUM actor, which involves the manipulation of system components and the registry to facilitate persistence and privilege escalation on Windows systems. The likely attacker objective is to establish a foothold in the target environment and maintain access through various covert mechanisms, indicating a sophisticated threat actor. Relevant MITRE ATT&CK tactics include Persistence (TA0003) and Privilege Escalation (TA0004), specifically focusing on techniques like "Boot or Logon Autostart Execution" (T1546) and its subtype utilizing executables in system directories (T1546.015).

  The primary telemetry sources include process creation logs (Event ID 4688) and registry modification activities (Event ID 4657). If malicious, the impact could range from unauthorized data access to complete system compromise. Importantly, this detection does not confirm an active compromise on its own; additional context and investigation are necessary to understand intent and scale.

  ### Investigation Steps

  - **Check for process creation entries:** Review Windows Security Event ID 4688 logs for instances where the image path contains 'windows\system32\Physmem.sys' or any of the 'WimBootConfigurations.ini' files. Look for unusual command line parameters that may indicate exploitation attempts.

  - **Examine registry changes:** Search for Windows Security Event ID 4657 logs that detail registry modifications, specifically targeting changes linked to 'HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32' or '{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32'. Investigate the context and intent of these modifications.

  - **Identify known indicators of compromise:** Correlate findings with threat intelligence feeds to check if the detected binaries have been reported in malicious activity related to SOURGUM. Verify the file hashes against threat databases (e.g., VirusTotal).

  - **Review legitimate usage patterns:** Determine if the affected system typically utilizes the IME components referenced, which can indicate benign activity or misconfigurations within multi-language environments. Note the user behavior associated with these components prior to the alerts.

  - **Assess log integrity settings:** Ensure that the logging configurations for process creations and registry modifications are properly set up to capture relevant events consistently. Verify audit policies for completeness based on organizational standards.

  - **Evaluate asset criticality:** Consider the role of the affected machine in your IT environment. If it is a critical system (e.g., domain controller), prioritize follow-up actions and containment measures.

  ### Prioritization

  This alert is high severity due to the critical nature of the potential compromise, especially if it involves a domain controller or a sensitive endpoint. The likelihood of malicious abuse is significant, given that the behavior aligns with known tactics used by the SOURGUM actor, which demonstrates a history of targeted attacks against enterprises.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for obfuscation or evasion techniques that may hide the malicious presence of these registry entries or processes. Required log sources include comprehensive collection of process creation and registry modification events to ensure accurate detection. Legitimate activities that may trigger this alert include the installation of IMEs by enterprise applications. A companion detection to strengthen coverage would involve monitoring for outbound network connections or unusual data exfiltration attempts linked to the identified processes.

