logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|contains:
    - 'windows\system32\Physmem.sys'
    - 'Windows\system32\ime\SHARED\WimBootConfigurations.ini'
    - 'Windows\system32\ime\IMEJP\WimBootConfigurations.ini'
    - 'Windows\system32\ime\IMETC\WimBootConfigurations.ini'
  registry_image:
    Image|contains:
    - 'windows\system32\filepath2'
    - 'windows\system32\ime'
    CommandLine|contains: 'reg add'
  registry_key:
    CommandLine|contains:
    - 'HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32'
    - 'HKEY_LOCAL_MACHINE\software\classes\clsid\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32'
  condition: selection or all of registry_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule focuses on identifying potentially malicious behaviors associated with the SOURGUM actor, a threat primarily known for exploiting zero-day vulnerabilities and deploying sophisticated malware. The rule aims to capture specific file system and registry modifications indicative of SOURGUM's tactics. The typical objectives of an attacker utilizing these methods may involve establishing persistence, escalating privileges, and conducting reconnaissance to maintain control over compromised systems.

  The detection aligns with the MITRE ATT&CK framework, particularly techniques such as **T1546: Event Triggered Execution** and **T1546.015: Impair Defenses**, which illustrate the means of using native Windows functionalities to execute payloads. The rule effectively monitors processes and registry entries that are typical indicators of malicious activity associated with advanced persistent threats.

  Key data sources for this detection include **Windows process creation logs**, which can capture attempts to execute malicious executables, and **registry modification logs**, which reveal attempts to alter system configurations or introduce new behaviors that may facilitate an attack.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the logs for any instances of process creation involving 'Physmem.sys' or associated *.ini files located within the specified Windows directories. Pay special attention to any creation events that deviate from baseline behavior.

  - **Analyze Registry Modifications:** Investigate any instances of registry commands resembling 'reg add' that pertain to critical registry keys mentioned in the detection logic. Check for unusual patterns that may indicate privilege escalation attempts or changes designed to compromise system integrity.

  - **Cross-Reference with IOC Lists:** Utilize the provided references to check indicators of compromise (IOCs) related to SOURGUM in endpoint detection and response (EDR) tools. Look for related file hashes, IP addresses, and domain names that may correlate with the identified behaviors.

  - **Conduct an Impact Analysis:** Identify affected systems or users in direct relation to the detected behaviors. Review authentication logs and access records for any signs of lateral movement or additional exploits linked to the SOURGUM actor's known tactics.

  ### Prioritization
  The alert is categorized as high due to the potential impact of the SOURGUM actor's techniques, which can lead to significant data breaches, operational disruption, and long-term compromise of sensitive systems within an enterprise environment.

  ### Blind Spots and Assumptions
  This detection might miss advanced evasion techniques where the actor employs alternative methods to obscure malicious activity, potentially leading to undetected or false negative scenarios. The logic assumes the presence of typical process creation and registry access logs; thus, any absence of logging due to misconfigurations or diverse operating environments may hinder detection effectiveness. Maintaining comprehensive logging and monitoring configurations across all endpoints is essential to ensure visibility into such actor behaviors.

