logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains:
    - 'C:\Windows\cert.exe'
    - 'del /q /f c:\kworking\agent.crt'
    - 'Kaseya VSA Agent Hot-fix'
    - '\AppData\Local\Temp\MsMpEng.exe'
    - 'rmdir /s /q %SystemDrive%\inetpub\logs'
    - 'del /s /q /f %SystemDrive%\\*.log'
    - 'c:\kworking1\agent.exe'
    - 'c:\kworking1\agent.crt'
  selection2:
    Image:
    - 'C:\Windows\MsMpEng.exe'
    - 'C:\Windows\cert.exe'
    - 'C:\kworking\agent.exe'
    - 'C:\kworking1\agent.exe'
  selection3:
    CommandLine|contains|all:
    - 'del /s /q /f'
    - 'WebPages\Errors\webErrorLog.txt'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects specific command line patterns and file access behaviors associated with the REvil ransomware group's Kaseya incident. The primary attacker objective is to execute malicious commands that delete log files, manipulate certificates, and install rogue agents, ultimately leading to the deployment of ransomware. This activity is categorized under the MITRE ATT&CK technique T1059 (Command and Scripting Interpreter) and tactic TA0002 (Execution).

  The primary telemetry source is process creation logs from Windows environments, specifically targeting Event ID 4688. Malicious actions can severely impact system availability and confidentiality, particularly in environments that rely on Kaseya for IT management. It is important to note that this detection does NOT confirm malicious intent on its own; further investigation is necessary to establish the context of the command execution.

  ### Investigation Steps

  - **Analyze Process Creation Events:** Review Event ID 4688 for processes like `C:\Windows\cert.exe` or `C:\kworking\agent.exe`. Check for unusual parent processes that may indicate exploitation.

  - **Inspect Command Line Arguments:** Look for command line patterns containing `del /q /f c:\kworking\agent.crt` or references to `Kaseya VSA Agent Hot-fix`. Malicious indicators include bulk deletion commands or file manipulations.

  - **Validate File Access and Execution Locations:** Confirm the existence of path `C:\kworking\` and inspect any executables like `MsMpEng.exe` or `agent.exe`. Legitimate operations should ideally not access these directories.

  - **Examine Temporary Files:** Search in the `AppData\Local\Temp\` directory for any recently executed `MsMpEng.exe`. An unexpected occurrence or failure to match with known good behavior is indicative of compromise.

  - **Identify Historical Log Deletions:** Check for any events where log files are deleted from `C:\inetpub\logs`. Legitimate systems typically retain these logs for auditing and should not routinely delete them.

  - **Cross-reference with Other Alerts and Context:** Verify if other detections exist for similar file manipulations or process creations. Correlate findings with known threats related to the REvil group for a more comprehensive assessment.

  ### Prioritization

  This alert should be treated with high priority due to the potential for significant operational impact and data loss. The likelihood of malicious abuse is critical, especially given the historical use of these techniques by the REvil group. Such behaviors are commonly weaponized in targeted attacks against managed service providers and enterprises.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging configurations, such as if process creation logging is disabled or not properly configured. There is a risk of false positives from legitimate administrative actions or software installations. Companion detections that strengthen coverage include alerts for abnormal network traffic or unauthorized web requests associated with the identified processes, such as those aimed at external command and control (C2) servers.

