logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    CommandLine|contains:
    - 'C:\Windows\cert.exe'
    - 'del /q /f c:\kworking\agent.crt'
    - 'Kaseya VSA Agent Hot-fix'
    - '\AppData\Local\Temp\MsMpEng.exe'
    - 'rmdir /s /q %SystemDrive%\inetpub\logs'
    - 'del /s /q /f %SystemDrive%\\*.log'
    - 'c:\kworking1\agent.exe'
    - 'c:\kworking1\agent.crt'
  selection2:
    Image:
    - 'C:\Windows\MsMpEng.exe'
    - 'C:\Windows\cert.exe'
    - 'C:\kworking\agent.exe'
    - 'C:\kworking1\agent.exe'
  selection3:
    CommandLine|contains|all:
    - 'del /s /q /f'
    - 'WebPages\Errors\webErrorLog.txt'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies specific command line patterns and processes commonly associated with the REvil ransomware group, specifically in the context of the Kaseya ransomware incident. The REvil group utilized malicious updates to compromise Managed Service Providers (MSPs) and deploy their ransomware across numerous clients, creating a wide-scale impact. The rule focuses on identifying abnormal file deletions and the execution of suspicious executables, which are indicative of attempted infiltration and lateral movement within the organization's network.

  Relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - **Execution** (TA0002) related to **Command and Scripting Interpreter** (T1059)
  - **Persistence** (TA0003) involving **Malicious File** (G0115)

  Primary data sources for effective detection include process creation events from Windows systems, which provide insight into executed commands and running processes, as well as command-line parameters that can signal malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs from Windows systems for instances of the flagged command lines and image paths. Pay particular attention to context surrounding known executables related to the REvil attack.
  - **Analyze File System Changes**: Investigate any deletions or modifications to files, especially log files and certificates in the specified directories. Use file integrity monitoring tools, if available, to detect unauthorized changes.
  - **Correlate with Network Traffic**: Check for any outbound connections or unusual communications originating from systems flagged by the detection. Identify any anomalous behavior that could suggest lateral movement or command and control communications.
  - **Monitor User Behavior**: Look for unusual user activity patterns that align with the execution of the detected commands, focusing on elevated privileges or access that might indicate a compromised account.

  ### Prioritization
  The alert is marked as critical due to the high potential impact of ransomware attacks, particularly given the extensive operational disruptions that REvil has historically caused. The likelihood of successful exploitation is also significant, considering the prominence of the methods used in this attack.

  ### Blind Spots and Assumptions
  This detection logic may not capture every instance of REvil or similar ransomware activity, particularly if the attackers use stealthy techniques to obscure their command line activities or utilize other means of persistence. Additionally, this rule assumes that the relevant Windows logs are properly configured to capture the necessary process creation data. Any gaps in logging or discrepancies in configurations could result in missed detections or false negatives.

