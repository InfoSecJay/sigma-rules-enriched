note: |
  ### Technical Context

  This rule detects network alerts from Prisma Cloud related to potentially suspicious activities classified by severity levels: critical, high, medium, or low. The behavior being detected suggests a potential attacker attempting to exploit cloud network configurations or access sensitive resources within AWS, Azure, or GCP environments. The likely attacker objective is to gain unauthorized access, exfiltrate data, or establish persistence within the cloud infrastructure.

  The relevant MITRE ATT&CK tactics include *Initial Access (TA0001)* and *Credential Access (TA0006)*, indicating attempts to gain entry into cloud environments. Primary telemetry sources are network activity logs captured by Prisma Cloud from cloud service providers. If malicious, the security impact could include unauthorized access to sensitive data or disruption of services. Notably, this detection does not confirm the presence of a successful breach solely based on the alert; further analysis is required to validate malicious intent.

  ### Investigation Steps

  - **Review the alert details:** Validate the alert severity (critical, high, medium, or low) and the specific policy that triggered the alert by examining Prisma Cloud logs (alert object fields, severity level).

  - **Analyze affected resources:** Check the affected cloud resources (e.g., specific VM instances or networks) in AWS, Azure, or GCP for unusual configurations or recent changes by referencing cloud provider management console logs.

  - **Correlate network activity:** Investigate inbound and outbound traffic patterns surrounding the alert using Prisma Cloud network activity logs (event type: network flow). Look for anomalies like unauthorized IP addresses or unexpected data transfers.

  - **Identify legitimate configurations:** Compare the alert with known legitimate configuration changes within the cloud environment, such as routine network adjustments or authorized changes to security groups.

  - **Evaluate user actions:** Examine user activity logs (IAM logs) in the cloud management console for signs of unusual or administrative access attempts that coincide with the alert timeframe.

  - **Determine high-confidence malicious indicators:** Look for indicators such as repeated failed access attempts, unfamiliar IP geolocation accessing sensitive resources, or signs of lateral movement across network segments that coincide with the alert.

  ### Prioritization

  This alert is of high severity due to the potential impact of unauthorized access to cloud resources. The likelihood of malicious exploitation is significant, given that misconfigured or exploited cloud networks are commonly targeted by adversaries. This behavior is frequently weaponized in current attack strategies.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false positives due to legitimate cloud configuration changes or updates that may trigger alerts. Required log sources for effective coverage include comprehensive logging from all cloud environments monitored by Prisma Cloud. Legitimate activities, such as routine maintenance or authorized access, could trigger similar alerts. A related detection could include monitoring IAM policy changes, which can provide additional context for user actions leading to cloud alert triggers.

