note: |
  ### Technical Context

  This rule detects instances where a user has initiated an eDiscovery search or exported a PST file within an Office 365 environment. The likely attacker objective is to collect sensitive or protected information from email archives or SharePoint using eDiscovery tools, potentially in a data exfiltration attempt. The relevant MITRE ATT&CK tactics and techniques include Collection (TA0009) and Data from Information Repositories (T1213). Primary telemetry sources are Microsoft 365 logs from the Security Compliance Center, specifically focusing on audit logs related to eDiscovery activities. If malicious, this behavior could lead to unauthorized access and theft of sensitive data. However, this detection does NOT confirm malicious intent on its own, as eDiscovery searches can be conducted for legitimate compliance and legal purposes.

  ### Investigation Steps

  - **Review eDiscovery activity details:** Check Security Compliance Center logs for Event Type `SearchExportDownloaded`. Look for unusual user accounts or patterns of usage outside of typical business hours.

  - **Validate user permissions:** Confirm the initiating user has appropriate permissions to perform eDiscovery actions (e.g., compliance admin role). This can be checked in Microsoft 365 Admin Center under User Roles and Permissions.

  - **Assess export size and frequency:** Examine the size of the exported PST files. Significant or unusual amounts of data (e.g., beyond typical legal hold or compliance check sizes) should raise flags.

  - **Identify benign examples:** Document expected activity by reviewing historical eDiscovery exports conducted by this user or similar roles. Cross-reference with legitimate cases to establish a baseline.

  - **Check for additional signals of compromise:** Correlate eDiscovery exports with other suspicious activities, such as odd user behavior in audit logs (e.g., multiple failed login attempts, access from unusual IPs).

  - **Look for post-export activity:** Investigate any follow-up actions akin to data transfers or access attempts on sensitive data repositories following the export, using logs like Microsoft 365 audit logs for SharePoint and Exchange.

  ### Prioritization

  The alert severity is considered low primarily due to the frequent legitimate use of eDiscovery for compliance purposes. However, the potential for abuse exists, especially if accompanied by other suspicious activities, and this behavior can be weaponized in targeted data exfiltration scenarios.

  ### Blind Spots and Assumptions

  Detections may miss legitimate compliance/export activity, especially in larger organizations where frequent eDiscovery actions are normative. Complete logging of all Microsoft 365 audit logs is necessary for reliable detection. Additionally, legitimate eDiscovery exports may trigger the alert in scenarios involving routine legal checks or investigations, indicating that context must be considered. It may be beneficial to integrate this alert with detections for unauthorized access attempts to strengthen overall coverage against data exfiltration attempts.

