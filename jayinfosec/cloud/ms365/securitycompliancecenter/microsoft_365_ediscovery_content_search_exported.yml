note: |
  ### Technical Context

  The rule detects when the results of a content search in Microsoft 365's Security and Compliance Center are exported. This behavior could indicate an adversary attempting to exfiltrate sensitive information from user mailboxes or files, supporting exfiltration objectives. It relates to the MITRE ATT&CK tactic "Collection" (ID: TA0011) and technique "Data from Information Repositories" (ID: T1114.002). The primary telemetry source is the M365 Security and Compliance Center audit logs, particularly focusing on the `SearchExported` operation within the `ThreatManagement` category.

  If malicious, this activity could lead to unauthorized data leakage and compromise an organization's sensitive information. However, this detection does NOT confirm any unauthorized access on its own; legitimate compliance-related exports may also generate this alert.

  ### Investigation Steps

  - **Check the export context:** Review audit logs for entries related to `SearchExported` (Event ID: 1001). Identify the user initiating the export and confirm their role within the organization. Legitimate users typically include compliance officers or legal teams executing prescribed searches.

  - **Validate the scope of the search:** Cross-reference the search parameters and exported content type with established corporate policies. Look for unusual patterns, such as exports by users without a documented reason.

  - **Examine associated user activity:** Investigate user authentication logs (Event IDs: 4624 for logons) for the exporting user, focusing on access patterns prior to the export action. Multiple failed login attempts or logins from unusual locations may raise suspicion.

  - **Identify suspicious scheduling behavior:** Check if the export was scheduled outside of normal working hours, which could indicate malicious intent. Legitimate activities usually follow standard business hours.

  - **Document data volume:** Assess the amount of data exported. Large exports compared to historical norms (e.g., exporting entire mailboxes) can indicate suspicious activity.

  - **Review related alerts:** Investigate any concurrent alerts for data leakage or insider threat indicators, which often complement this type of export detection.

  ### Prioritization

  This alert is considered low severity due to its context in the enterprise. However, the potential impact of data leakage is significant, warranting attention. The likelihood of malicious abuse is moderate, particularly if the activity falls outside the scope of normal user behavior or occurs in sensitive areas of the organization.

  ### Blind Spots and Assumptions

  Detection may have limitations due to potential evasion techniques, such as legitimate exports being manipulated to mask malicious intent. Reliable detection requires comprehensive audit logging configurations in M365 Security and Compliance Center. Legitimate activities may include exports for litigation or compliance reviews, which should be documented. A related detection would be filtering for anomalous logon behavior to the Security and Compliance Center, providing complementary coverage against unauthorized access.

