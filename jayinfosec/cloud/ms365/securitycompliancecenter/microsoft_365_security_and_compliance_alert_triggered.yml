note: |
  ### Technical Context

  This rule detects alerts from the Microsoft 365 Security and Compliance Center that indicate potential threats or policy violations, focusing on activities such as unusual file deletions, restricted email sending, potential ransomware behaviors, and mass downloads by users. The likely attacker objective is to exploit organizational assets, disrupt operations, or exfiltrate sensitive information. This behavior falls under MITRE ATT&CK tactic "Initial Access" (TA0001) and technique "Valid Accounts" (T1078.004).

  Primary telemetry sources include logs generated from the Microsoft 365 Security & Compliance Center, specifically looking for events under "ThreatManagement" operations. If malicious, the impact could involve data loss, identity theft, or ransomware infections, potentially affecting business continuity. However, it is critical to note that detection of these alerts does NOT independently indicate malicious activity without further context and investigation.

  ### Investigation Steps

  - **Review alert details in Microsoft 365 compliance center:** Check the timestamp, user involved, and specific operation details related to the alert. Record Event ID 5000 for unexpected behaviors or changes attributed to high-risk operations.

  - **Analyze user activity logs:** Extract and review logs for the user’s recent activities, specifically looking at Event ID 5002 (Sign-in events) for successful and failed login attempts, as unusual sign-in patterns may indicate compromised accounts.

  - **Check for unusual file activity:** Look for Event ID 5136 in SharePoint logs indicating any file deletions by the user that exceed typical organizational thresholds (e.g., 10 files in a short timeframe could be suspicious).

  - **Correlate with existing baselines of user behavior:** Compare the recorded user actions against expected behaviors for their role. If the user is in a non-administrative role, mass deletion or download activity (over 100 files in one session) may indicate malicious intent.

  - **Identify contextual threats in email logs:** Use Microsoft 365 Defender’s email threat logs for any blocked sending actions by the user (Event ID 5003). Analyze if any attachments or links were flagged, which could provide evidence of phishing attempts.

  - **Certify legitimate activities:** Confirm whether any recent organizational changes might explain the activities (e.g., scheduled file migrations or updates). Look for corresponding communications or notifications in Microsoft Teams or Email.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems and data when involving account misuse or threats like ransomware. The likelihood of malicious exploitation is moderate, as attackers often leverage existing accounts to facilitate further access.

  ### Blind Spots and Assumptions

  Detection of alerts may miss context surrounding legitimate activities like bulk deletions during data migrations or mailbox clean-ups. The effectiveness hinges on proper configuration for the Security Compliance Center logs. Additionally, false positives may arise from legitimate behaviors, necessitating a careful review of user intent and patterns. Companion detections include monitoring for abnormal authentication behaviors (like M365 sign-in from unusual locations), which can reinforce the investigation with additional context.

