note: |
  ### Technical Context

  This Sigma rule detects unusual volumes of file deletion activities reported by Microsoft 365 Cloud App Security. An attacker’s objective may be to destroy evidence of prior malicious activities or to disrupt operations by deleting important files. The relevant MITRE ATT&CK tactic for this behavior is **Impact (TA0040)** and the specific technique is **Data Manipulation (T1485)**.

  The primary telemetry source is Microsoft 365 Security and Compliance Center logs, specifically those detailing file deletion events. If malicious, this behavior could severely impact data availability and operational integrity. However, it is important to note that this detection does not confirm malicious intent without further context; users may legitimately delete files as part of routine maintenance or cleanup.

  ### Investigation Steps

  - **Review file deletion logs**: Check the Microsoft 365 Security and Compliance Center logs for events related to file deletion. Focus on eventName 'Unusual volume of file deletion' within the last 24 hours for the affected user.

  - **Identify user context**: Determine the role and responsibilities of the user conducting the deletions. If they typically manage files, high-volume deletions may not be suspicious; if not, this indicates a potential issue.

  - **Correlate with user activity**: Look for patterns of activity leading to the deletions. Review the last logon events (Event ID 4624 in Azure AD logs) and any recent changes to user permissions or roles that may explain a surge in deletion activity.

  - **Verify file recovery options**: Check if any recovery options (e.g., recycle bin) were utilized immediately following the deletions. This can indicate an attempt to rectify or explain the mass deletion actions.

  - **Investigate surrounding alerts**: Look for other simultaneous alerts related to the same user, such as account compromise flags (e.g., unexpected login locations) or privilege escalation activities (Event ID 4672) that may suggest a broader compromise.

  ### Prioritization

  This alert should be considered of medium severity due to the potential impact on critical systems if important files are maliciously deleted. The likelihood of this behavior being abused is moderate, particularly if the user is not in an administrative role. While file deletion can be associated with cleanup, abnormal volumes in a short period raise concerns of deliberate data manipulation.

  ### Blind Spots and Assumptions

  Detection may be limited if users frequently delete files legitimately, which could generate false positives. The accuracy of alerts relies on sufficient logging configurations within Microsoft 365, ensuring all file actions are logged appropriately. Legitimate account activity such as end-of-quarter cleanup or regulatory compliance might trigger this alert. A related detection to consider is **Data Exfiltration (T1041)** which can further assess the risk of the environment through simultaneous file extraction activities.

