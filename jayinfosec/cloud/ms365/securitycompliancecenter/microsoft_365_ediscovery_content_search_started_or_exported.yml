  ### Technical Context

  This detection rule identifies when a user initiates an eDiscovery search or exports a PST file within Microsoft 365's Security Compliance Center, indicating an attempt to collect sensitive data. The likely attacker objective is to gather information for malicious use, such as intellectual property theft or data exfiltration. This activity aligns with the MITRE ATT&CK tactic of Collection (TA0023) and technique Data from Information Repositories (T1114).

  The primary telemetry sources include Microsoft 365 logs, specifically the security and compliance center activity logs. If malicious, the security impact is significant; unauthorized eDiscovery operations could lead to exposure or theft of sensitive data. Notably, this detection does NOT confirm malicious intent on its own, as legitimate compliance and legal searches can trigger similar alerts.

  ### Investigation Steps

  - **Review eDiscovery activity log:** Check the Security & Compliance Center activity log in Microsoft 365 (event name: 'eDiscovery search started or exported') for the relevant user and time frame.

  - **Identify user roles:** Verify if the user has appropriate permissions to perform eDiscovery actions. Legitimate users typically include compliance officers or legal staff, while unexpected users may indicate potential abuse.

  - **Examine export details:** Look at the attributes of the PST file export, such as size and timestamp, to see if it aligns with regular operational behavior. Large exports outside of normal working hours may indicate malicious intent.

  - **Cross-check user actions:** Analyze User Sign-In logs (Azure AD Sign-ins, Event ID: 4624) for any additional suspicious activities (e.g., uncharacteristic logons) around the time the eDiscovery operation was executed.

  - **Look for anomaly patterns:** Establish a baseline of normal eDiscovery usage within your organization and identify deviations from this pattern. Frequent or unauthorized searches may suggest improper data access or preparations for data exfiltration.

  - **Analyze IP address source:** Check the IP address from which the eDiscovery was initiated. Connections from unfamiliar or geolocated regions that do not match known locations of legitimate users should raise red flags.

  ### Prioritization

  This alert carries medium severity due to the potential impact of sensitive data exposure and moderate likelihood of misuse. While many organizations utilize eDiscovery for compliance, the frequency of misuse in data breach scenarios makes this detection relevant and urgent.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging in Microsoft 365, as not all user actions may be fully captured. Some legitimate activities, such as routine compliance searches, could create noise in the alerting system. Additionally, companion detections such as monitoring for anomalous user behavior (e.g., Azure AD risky sign-ins or unusual access patterns) can enhance overall coverage and context of this investigation.

