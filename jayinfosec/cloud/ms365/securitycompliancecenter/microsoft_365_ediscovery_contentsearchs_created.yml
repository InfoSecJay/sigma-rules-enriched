note: |
  ### Technical Context

  This Sigma rule detects the creation of a content search within the Microsoft 365 Security and Compliance Center, which may indicate attempts to gather sensitive or potentially incriminating information. The likely objective of an attacker using this technique is to exfiltrate private data or prepare for data manipulation alongside other malicious activities. This behavior aligns with the MITRE ATT&CK tactic "Collection" (TA0122) and technique "Data from Information Repositories" (T1114.002).

  The primary telemetry source is Microsoft 365's Security and Compliance Center audit logs. This detection is significant because malicious actors may leverage eDiscovery searches to aggregate targeted data without alerting system defenses. However, this detection does NOT independently confirm malicious intent, as legitimate compliance or legal investigations may result in similar activity.

  ### Investigation Steps

  - **Check the audit log for search details:** Review the Security and Compliance Center audit logs for Event ID corresponding to the search creation. Look for fields such as "UserId," "SearchName," and "SearchQuery" to identify the context and specific user activity around the search creation.

  - **Identify user behavior patterns:** Investigate the user who initiated the search by reviewing their historical actions in Microsoft 365. Frequent eDiscovery activity from a user without clear justification could indicate potential misuse.

  - **Examine related activities:** Look for additional actions taken by the user following the search creation, such as exporting search results. Inspect logs for Event IDs related to content export to determine whether the search was followed by data exfiltration.

  - **Understand legitimate usage:** Confirm if the search aligns with known compliance or legal requests by cross-referencing against organizational policies and the user’s job role. Many organizations conduct eDiscovery for regulatory compliance, so ensure the context is understood.

  - **Compile potential risk assessment:** Evaluate the system's impact based on the user's role and the data being searched. For instance, if the search involves sensitive HR data by an unauthorized user, consider this a high-risk scenario.

  - **Monitor for evasion techniques:** Be aware that attackers could create searches using compromised accounts that mimic legitimate user behavior. Filtering for known administrative accounts or unusual roles performing eDiscovery operations will help identify potential abuse.

  ### Prioritization

  This alert is classified as low severity, given that content searches can often be legitimate, particularly in compliance contexts. However, it warrants attention due to the potential for abuse, especially if associated with high-value data or sensitive information that is commonly targeted during illicit information gathering activities.

  ### Blind Spots and Assumptions

  Detection is limited by false positives due to legitimate compliance eDiscovery activities. Ensure that all necessary Microsoft 365 Security and Compliance Center logs are configured for reliable detection. Be cognizant that privileged user activities could trigger this alert in valid contexts. A related detection to enhance monitoring could involve tracking data exports following search creation, which would indicate further investigation into potential data exfiltration attempts.

