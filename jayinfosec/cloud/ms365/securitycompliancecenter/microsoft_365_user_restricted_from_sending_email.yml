note: |
  ### Technical Context

  This detection identifies when a user in Microsoft 365 is restricted from sending emails due to exceeding service policy limits. The likely attacker objective could involve either abusing email capabilities or attempting to overwhelm service limits as a form of operational disruption. This situation pertains to the MITRE ATT&CK tactic "Initial Access" (TA0001) and technique "Valid Accounts" (T1078). Primary telemetry sources include Microsoft 365 Security Compliance Center logs, specifically focused on alert events related to user capabilities. If this alert is triggered maliciously, it may indicate an attempt to exploit the user’s account or perform unauthorized mass email actions. Importantly, this detection does NOT confirm whether the restriction resulted from malicious activity; legitimate user behavior could also trigger this alert.

  ### Investigation Steps

  - **Check the user's sending behavior:** Review the Microsoft 365 security logs for Event ID indicative of email activities (e.g., Event ID 164, regarding mail flow and user actions) within the last 24 hours. Look for signs of excessive sending or unusual patterns like mass emails to unknown recipients, which could indicate an abnormal or malicious operation.

  - **Verify the email restriction details:** Access the Security Compliance Center and retrieve details on the alert, specifically focusing on the 'User restricted from sending email' event, including timestamps and affected user information. Compare against normal user behavior to identify potential misuse.

  - **Identify potential account compromise:** Cross-reference the restricted user's recent login activity logs (e.g., Azure AD sign-in logs) for anomalies. Check for sign-ins from unusual locations or devices that diverge from normal patterns, which may indicate that the account was compromised leading to the restriction.

  - **Evaluate the user's role and permissions:** Assess the criticality of the affected user’s role within the organization. Highlight whether this individual holds administrative privileges or is part of sensitive departments (e.g., finance, HR), as this could have higher implications if compromised.

  - **Look for legitimate triggers:** Determine if the user was recently involved in activities like sending large email blasts for legitimate business purposes, which may explain the restriction. Check company policies regarding email distribution limits that could account for this scenario.

  ### Prioritization

  The alert has a medium severity due to the potential impact on communication channels for critical users. While the likelihood of this being misused exists, it's equally plausible that legitimate user activity triggered this restriction. This type of behavior is not frequently weaponized, although it can indicate attempts to conduct business email compromise or other misuse if observed alongside suspicious actions.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion through intermittent email bursts that remain below threshold limits, which would not trigger this alert. Reliable detection requires proper logging configurations from Microsoft 365, including all necessary role and activity monitoring within the Security Compliance Center. Legitimate activities that may trigger this alert include bulk email communications for marketing or internal announcements. A related detection that may strengthen coverage is monitoring for unusual login behaviors (Azure AD anomalies) which could indicate compromised accounts.

