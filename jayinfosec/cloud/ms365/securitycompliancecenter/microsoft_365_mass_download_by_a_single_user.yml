note: |
  ### Technical Context

  This rule detects instances where a single user performs more than 50 downloads within a one-minute timeframe from Microsoft 365, as reported by Microsoft Cloud App Security (MCAS). Such behavior often indicates potential data exfiltration, suggesting that the attacker is attempting to gather sensitive information rapidly. This activity aligns with the MITRE ATT&CK tactic **Exfiltration** (TA0010) and technique **Exfiltration Over Command and Control Channel** (T1041).

  The primary telemetry source for this detection is the Microsoft 365 Security Compliance Center logs, specifically entries related to alerts triggered for mass downloads. If malicious, this could lead to unauthorized data loss or exposure of sensitive corporate information. However, it is important to note that this detection alone does not confirm nefarious intent; high-volume downloads can occur due to legitimate user activities.

  ### Investigation Steps

  - **Review download logs for the user**: Check Microsoft 365 activity logs (Event IDs related to file downloads) to confirm the nature and origin of the files downloaded. Look for unusual file types that are not typically accessed by the user.

  - **Assess user context and role**: Verify the user’s role within the organization. If they are part of an administrative team or involved in a legitimate bulk operation, their activity may be expected rather than malicious.

  - **Evaluate download patterns**: Analyze the download timing and volume compared to the user's historical behavior. Look for deviations from normal download activity (e.g., average downloads per minute).

  - **Cross-check with cloud storage access logs**: Inspect logs from OneDrive or SharePoint for connections (Event IDs for file access) from the user’s account around the same timeframe, validating or negating context.

  - **Identify high-confidence malicious indicators**: Check for simultaneous logins from different geographic locations or suspicious IP addresses at the time of the downloads, indicating possible account compromise.

  - **Investigate file access permissions**: Confirm if the user had appropriate permissions to access and download the files in question. Lack of proper authorization may indicate an insider threat or compromised credentials.

  ### Prioritization

  This alert is critical, given that it signifies potential massive data exfiltration by a single user, which could have severe implications on the organization's data security. The likelihood of malicious use is high, especially if the user’s behavior deviates significantly from their baseline activity. Mass download activities are commonly weaponized during insider threats or compromised accounts.

  ### Blind Spots and Assumptions

  This detection may face limitations as legitimate cloud synchronization processes or routine actions by superusers can trigger the alert. It requires a complete integration of Microsoft 365 logs to ensure thorough monitoring and must account for potential evasion tactics, such as exploiting unmonitored API interfaces. Related detections include alerts for abnormal login activities (e.g., multiple geographic locations) to reinforce assessments of potential account compromise.

