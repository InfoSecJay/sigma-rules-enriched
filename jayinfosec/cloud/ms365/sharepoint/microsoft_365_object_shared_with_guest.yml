note: |
  ### Technical Context

  This Sigma rule detects when a user shares a document from Microsoft 365 SharePoint or OneDrive with a guest user. The likely attacker objective could involve data exfiltration or unauthorized access to sensitive documents, potentially aligning with insider threats or external attackers attempting to exploit compromised user accounts. This behavior falls under the MITRE ATT&CK tactic "Collection" (TA0043) and the technique "Data from Information Repositories" (T1213).

  Primary telemetry sources include Microsoft 365 audit logs specifically monitoring sharing activities (sharing events). The security impact could be significant if sensitive information is inadvertently or maliciously exposed to external collaborators. Importantly, this detection alone does not confirm malicious intent; legitimate business activities might also trigger it, particularly in collaborative environments.

  ### Investigation Steps

  - **Verify sharing context:** Check the specific document shared and its content type using Microsoft 365 Audit Logs (Log Type: SharePoint/OneDrive Sharing). Documents containing proprietary or sensitive information should raise immediate concern.

  - **Evaluate user behavior:** Analyze the sharing user’s previous activities in Azure Active Directory (Azure AD Sign-In Logs with Event ID 4624). Compare sharing frequency and context; unusual patterns (e.g., frequent guest sharing) could indicate malicious intent.

  - **Identify guest recipient:** Review the guest user's profile and activities in Microsoft 365 (Log Type: Azure AD User), including previous access patterns. Establish if the recipient is a known third party or a possibly unauthorized entity.

  - **Monitor for follow-up actions:** Watch for later actions taken by the guest user, such as downloading documents or further sharing (Relevant logs: SharePoint/OneDrive Access Logs). High-volume downloads or further sharing with additional guests could indicate malicious activity.

  - **Assess organizational policy compliance:** Determine whether the sharing aligns with company policies regarding data sharing with guests. Unauthorized sharing of sensitive information against policy guidelines should be escalated.

  ### Prioritization

  While this alert is rated low in severity, the impact may vary based on the document shared and the role of the sharing user. The likelihood of malicious abuse is moderate, particularly if sensitive information is involved, as unauthorized sharing may provide adversaries with backdoor access to corporate resources. This behavior can be weaponized by insider threats or compromised accounts.

  ### Blind Spots and Assumptions

  Detection may be limited by users' legitimate business needs; employees may often need to share documents with guests, potentially generating false positives. Reliable detection requires configured audit logging within Microsoft 365 for all sharing events. Additionally, legitimate scenarios, such as external collaborations and consulting projects, can inadvertently trigger alerts. A companion rule to strengthen coverage could involve monitoring unusual access requests or downloads by guest users following sharing events.

