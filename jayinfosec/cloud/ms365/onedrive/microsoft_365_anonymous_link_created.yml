note: |
  ### Technical Context

  This Sigma rule detects the creation of anonymous sharing links for documents in Microsoft 365 OneDrive or SharePoint. This behavior allows any unauthenticated user with the link to access potentially sensitive documents, representing a security risk if not properly managed. The likely attacker objective could be data exfiltration or unauthorized access to confidential information.

  This detection aligns with the MITRE ATT&CK framework under the tactic "Collection" (TA0009) and technique "Data from Information Repositories" (T1213). The primary telemetry source is Microsoft 365 cloud logs, specifically focusing on operations within OneDrive and SharePoint environments. If malicious, the security impact could be significant due to exposure of sensitive documents. However, this detection alone does NOT confirm that the document has been accessed or exfiltrated.

  ### Investigation Steps

  - **Verify anonymous link creation event:** Look for Microsoft 365 audit logs (Event ID relevant to AnonymousLinkCreated) to confirm the specific document for which the link was created, checking fields such as `UserPrincipalName`, `DocumentId`, and `LinkType`.

  - **Cross-check document sensitivity:** Review the document metadata in SharePoint or OneDrive (fields like `IsSensitive`, `Classification`, or custom tags) to assess if it contains confidential or proprietary information that could pose a risk.

  - **Identify legitimate link sharing patterns:** Analyze previous log entries for the same user (Event IDs related to `ShareLink`, `LinkSharing`) to establish if they commonly create anonymous links for legitimate reasons, such as sharing with collaborators on non-sensitive documents.

  - **Detect multiple anonymous links created by a single user:** Search for instances where the same user has created multiple anonymous links in a short time frame (check `CreatedTimestamp` and `LinkCount` fields) to indicate potential malicious behavior or misuse of permissions.

  - **Flag indicators of potentially malicious context:** Look for suspicious activity from the user (e.g., logins from unusual locations or devices in Azure AD logs, sign-ins without MFA) correlating with the event time of the link creation, which could suggest a compromised account.

  - **Assess the criticality of impacted assets:** Determine the significance of the document and its associated library (e.g., if it resides in a department dealing with sensitive information) to prioritize the investigation's urgency.

  ### Prioritization

  This alert is medium severity as it may indicate potential data exposure depending on the sensitivity of the documents involved. The likelihood of malicious use is moderate, especially if there is a pattern of misuse detected. While anonymous links can be used for collaboration, their misuse can lead to significant data breaches.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of audit logging in Microsoft 365; ensure that sharing link events are enabled. Users may legitimately create anonymous links, especially in collaborative environments, which can trigger this alert. Companion detections surrounding unusual access logs or changes to document permissions could provide additional context and strengthen coverage against potential misuse.

