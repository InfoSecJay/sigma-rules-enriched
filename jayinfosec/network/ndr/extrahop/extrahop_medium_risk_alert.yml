note: |
  ### Technical Context

  This Sigma rule detects moderate-risk alerts generated by the ExtraHop Reveal(x) 360 Network Detection and Response platform, specifically focusing on detections with a risk score of 30 or below. The likely attacker objective may involve initial compromise activities, lateral movement attempts, or reconnaissance efforts that typically generate lower severity alerts before escalating. Relevant MITRE ATT&CK tactics include Execution (T1203), Lateral Movement (T1021), and Discovery (T1087). The primary telemetry sources are the ExtraHop NDR logs, which capture detailed network traffic and behavioral anomalies. If malicious, the security impact may involve unauthorized access or exfiltration of sensitive data. Importantly, this detection does NOT confirm that an active compromise has occurred on its own, as lower risk scores may also be triggered by benign activities or misconfigurations.

  ### Investigation Steps

  - **Review risk score details:** Check the ExtraHop dashboard for the specific detection alert, focusing on the risk score (<= 30), and examine contextual information provided about the incident to assess if additional scrutiny is warranted.

  - **Correlate with historical alerts:** Investigate if similar low-risk alerts have been generated from the same asset or user over the past days or weeks; patterns may indicate automated benign behavior or indicate a reconnaissance stage (e.g., multiple service queries).

  - **Analyze network behavior:** Utilize ExtraHop or related network monitoring logs (e.g., packet captures) to inspect outbound connections from the affected device within the timeframe of the alert. Look for connections to known benign services (e.g., scheduled updates) versus external IPs, which might signify suspicious lateral movement.

  - **Identify legitimate operations:** Verify expected behavior from the monitored assets; for instance, if the alert originates from a server executing regular backups or updates, or from a user involved in legitimate network troubleshooting tasks.

  - **Document anomalous patterns:** If the alert exhibits indicators such as frequent connections to multiple external IP addresses or unusual spikes in services being queried, document these findings as high-confidence indicators of potential malicious behavior.

  - **Check for external context:** Search for any known threat intelligence or alerts related to the IP addresses or domain names involved in the alert to validate their risk status and potential association with observed attack patterns.

  ### Prioritization

  This alert is of medium severity in an enterprise context, as it may indicate the early stages of network exploitation or lateral movement. However, the low-risk score implies the likelihood of actual malicious activity may be lower compared to higher-risk alerts, necessitating a balanced investigation approach before escalation.

  ### Blind Spots and Assumptions

  Detecting medium-risk alerts is inherently limited, as they may also result from legitimate operational behavior or misconfigured NDR settings. Ensure ExtraHop logging is fully enabled and that detection thresholds reflect the organization's risk tolerance for more reliable alerts. Legitimate activities, such as routine scanning by network management tools, may inadvertently trigger this alert. A related detection to consider for further investigation could involve high-risk alerts generated by the same system, which, if triggered in tandem, may strengthen the assessment of a potential compromise.

