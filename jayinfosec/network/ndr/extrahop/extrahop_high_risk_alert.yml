logsource:
  product: extrahop
detection:
  risk_range1:
    risk_score: ">= 31"                  # greater than or equal to a risk score of 31 (between 31-79)
  risk_range2:
    risk_score: "<= 79"                  # less than or equal to a risk score of 79 (between 31-79)
  condition: risk_range1 and risk_range2
falsepositives:
- Unlikely
level: high

note: |
  ### Technical Context

  This rule detects critical risk alerts generated by the ExtraHop Reveal(x) 360 Network Detection and Response platform, specifically focusing on alerts with a risk score between 31 and 79. The behavior typically indicates potential malicious activity, such as lateral movement, command-and-control communications, or execution of potentially harmful processes within the network. This falls under the MITRE ATT&CK tactics of Execution (T1203), Lateral Movement (T1021), and Command and Control (T1071).

  The primary telemetry source is the ExtraHop system, which provides detections based on network analysis. Malicious activity can lead to breaches, data exfiltration, or persistent threats. It is important to note that this detection alone does not confirm that a breach or malicious activity has occurred; it simply indicates a higher risk scenario that requires further investigation.

  ### Investigation Steps

  - **Review alert details:** Check the ExtraHop console for the specific detection that triggered the alert, noting the risk score and contextual details, such as affected endpoints and any associated behaviors.

  - **Correlate associated network traffic:** Analyze the related network traffic patterns and sources using ExtraHop logs to determine if they correlate with known malicious indicators (e.g., unusual outbound connections, high data transfer rates).

  - **Assess legitimate activity:** Identify normal user behavior by comparing the alert timeframe with historical network activity; look for regularly scheduled batch jobs or system maintenance that could explain traffic patterns.

  - **Identify high-confidence malicious indicators:** Look for distinct indicators such as connections to known malicious IPs or domains, or abnormal communication patterns with external servers over HTTP/S or DNS.

  - **Review endpoint security logs:** Examine security event logs from impacted systems (e.g., Windows Security Event ID 4688 for process creations or Sysmon Event ID 1) to identify any newly created processes that correspond with the alert.

  ### Prioritization

  This alert is classified as high severity due to its association with critical risk detections that imply potential network compromise. The likelihood of malicious abuse is significant, given that the detected behaviors often align with known attacker techniques. The nature of network communication analyzed makes it a frequent target for exploitation.

  ### Blind Spots and Assumptions

  The detection's effectiveness may be limited if network traffic is encrypted or if the ExtraHop logs are not adequately configured to capture all relevant data. Legitimate activities such as legitimate internal communications or software updates could trigger similar alerts. It is advisable to combine this detection with other telemetry sources, such as SIEM logs for user activity, to strengthen overall coverage, particularly in detecting lateral movement.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
