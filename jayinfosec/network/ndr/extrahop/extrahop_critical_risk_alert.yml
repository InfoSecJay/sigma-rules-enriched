note: |
  ### Technical Context

  This rule detects high-risk activities identified by the ExtraHop Reveal(x) 360 NDR platform, specifically where risk scores are 80 or higher. Such detections may indicate potentially malicious behavior, including lateral movement, persistence tactics, or command-and-control (C2) activity. The relevant MITRE ATT&CK tactics include execution (TA0002), lateral movement (TA0008), and command-and-control (TA0011).

  The primary telemetry source for this detection is the ExtraHop network appliance, which analyzes traffic patterns and behavioral anomalies. If these activities are indeed malicious, they could lead to unauthorized data access or system compromise. However, this detection alone does not confirm that malicious activity is occurring; further investigation is required to assess the context and implications of the detected risk.

  ### Investigation Steps

  - **Verify risk score details: ** Examine the ExtraHop alert details for specific risk metrics. Record the risk score and associated detection categories to assess the severity of the alert.

  - **Review network traffic: ** Analyze network flows in ExtraHop for the prior hour to identify any unusual traffic patterns, including external communications or traffic to unexpected services from the affected endpoint.

  - **Identify affected assets: ** Determine which hosts triggered the alert and their role within the environment (e.g., critical server vs. standard workstation) by checking device identities in the ExtraHop console.

  - **Examine related alerts: ** Look for companion alerts in ExtraHop related to the same host or user that may reinforce the likelihood of malicious activity, especially alerts characterized by execution anomalies or unusual network connections.

  - **Assess legitimate activity: ** Review user and system activity for the affected assets to identify expected usage patterns, such as scheduled backups or high-throughput operations that might align with the detected risk.

  - **Capture evidence of data anomalies: ** Check for file creation or modification events in conjunction with the alert, focusing on timestamps and unusual sizes, especially in sensitive directories. Look for excessive outbound connections or data exfiltration attempts via ExtraHop's flow data.

  ### Prioritization

  This alert has critical severity due to the potential impact on sensitive systems, which could result in data breaches or lateral movement across the enterprise network. Given the high risk score associated with the detected behaviors, there is a significant likelihood of malicious exploitation. Such behaviors are often associated with advanced persistent threats (APTs) and are commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques, such as traffic obfuscation or encrypted tunnels used by attackers to blend into normal traffic. It requires proper configurations in ExtraHop to ensure comprehensive coverage of network activity. Legitimate activities, such as automated backup processes or system maintenance traffic, may trigger this alert. Related detections, such as those monitoring for anomalous admin login attempts or reconnaissance activities, can provide additional context and improve the overall detection coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
