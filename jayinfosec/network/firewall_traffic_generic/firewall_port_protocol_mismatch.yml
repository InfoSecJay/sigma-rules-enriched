note: |
  ### Technical Context

  This Sigma rule detects mismatches between expected port numbers and their associated transport protocols in network firewall logs. Specifically, it identifies when traffic on common protocols such as HTTP, HTTPS, and DNS is reported over an unexpected port, a behavior often employed by adversaries to bypass security controls and establish command and control (C2) communications. This can fall under the MITRE ATT&CK tactic of Command and Control (T1071) where attackers manipulate legitimate protocols to evade detection.

  The primary telemetry source is firewall logs, specifically focusing on transport layers detailing the network protocol and destination port. If malicious, the impact could include unauthorized data exfiltration, malware installation, or lateral movement within the network. It's crucial to understand that this detection alone does not confirm malicious activity; it may also indicate misconfigurations, benign applications, or unusual yet legitimate uses of protocols.

  ### Investigation Steps

  - **Check firewall logs for the alert:** Review firewall logs (e.g., Cisco ASA, Palo Alto, or similar) for Event IDs indicating protocol mismatch (e.g., destination port and network protocol fields). Look for entries matching the conditions in the Sigma rule.

  - **Identify common benign applications:** Compare the observed traffic against known applications using non-standard ports (e.g., internal web servers on alternate ports, specialized applications) to rule out legitimate behavior.

  - **Look for patterns of matching source IPs:** Inspect other logs (e.g., network flow logs or IDS alerts) for related suspicious activities from the same source IP that triggered the mismatch (e.g., unusual outbound connections).

  - **Document the impact of affected systems:** Determine the role and criticality of affected assets involved in the alert (e.g., server or workstation) by reviewing asset inventory or configuration management systems.

  - **Confirm erroneous configuration changes:** Check for recent changes to firewall configurations or rules that may have introduced the mismatch (e.g., firewall change logs or version control entries).

  - **Cross-reference with known malicious indicators:** Use threat intelligence feeds to verify if the destination IPs involved in the alert are associated with known malicious actors or C2 infrastructure.

  ### Prioritization

  The severity of this alert is low due to the potential of both misconfigurations and benign applications using unexpected ports. However, if observed on critical infrastructure, analysts should assess the likelihood of exploitation or C2 usage, as the behavior could be weaponized in specific contexts, particularly if seen alongside other suspicious indicators.

  ### Blind Spots and Assumptions

  This detection may miss traffic obfuscated through encryption or advanced evasion techniques employing legitimate ports and protocols. It is important that firewall logging is adequately configured to capture all relevant traffic types, including non-standard settings. Additionally, legitimate IT operations, such as system migrations or use of service tunneling, may trigger this alert. A related detection rule could focus on anomalous outbound connection attempts, enhancing overall monitoring of potential C2 traffic.

