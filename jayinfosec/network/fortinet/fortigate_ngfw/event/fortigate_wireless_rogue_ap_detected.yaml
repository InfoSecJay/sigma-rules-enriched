note: |
  ### Technical Context

  This detection identifies potential unauthorized rogue access point (AP) activity from FortiGate event logs. The behavior being detected involves the identification and suppression of rogue access points, which can be leveraged by attackers to perform man-in-the-middle attacks, capture sensitive information, or redirect users to malicious sites. This corresponds to the MITRE ATT&CK tactic of **Execution** and technique **T1059: Command-Line Interface**.

  The primary telemetry sources include FortiGate logs with specific log IDs associated with rogue AP events. If malicious, the presence of rogue APs poses risks such as data interception, unauthorized network access, or malware distribution. However, this detection does NOT confirm the identity or intent of the operator of the rogue AP nor does it assess the impact or success of any attack.

  ### Investigation Steps

  - **Review FortiGate logs for rogue AP entries**: Check event logs from FortiGate with `logid` values: 43521, 43563, 43564, etc., and filter by `subtype: 'wireless'` for signs of rogue AP behavior.

  - **Verify rogue AP device details**: Look at the `devid` field in logs to identify the device responsible for the rogue AP detection. Cross-reference with known, legitimate devices to assess if newly detected devices are unauthorized.

  - **Analyze suppression and unsuppression events**: Identify events with `logid: 43569` (Rogue AP suppressed) and `logid: 43570` (Rogue AP unsuppressed) to understand whether the system actively manages detected rogue APs, indicating potential follow-up actions taken or required.

  - **Look for similar traffic patterns during detection times**: Review user events or access logs for unusual traffic patterns or access requests around the timestamps of rogue AP detections (e.g., logins from unknown devices to sensitive resources).

  - **Investigate surrounding legitimate wireless activity**: Validate whether expected legitimate wireless activity coincides with the rogue AP alerts—this could include authorized personnel operating mobile APs for business needs (bring-your-own-device scenarios).

  - **Identify potential phishing or security impacts**: Investigate whether users connected to the rogue access point inadvertently, leading to security events like unusual credential requests or suspicious logon attempts.

  ### Prioritization

  The severity of this alert can be considered medium to high, as unauthorized access points can lead to significant security risks, especially in environments with sensitive data. The likelihood of malicious exploitation is notable given that rogue APs are a common tactic used by adversaries in network attacks. Given the nature of wireless technology, this behavior can be easily weaponized.

  ### Blind Spots and Assumptions

  Detection is limited by the ability of FortiGate to identify rogue APs, which may be evaded by sophisticated adversaries using encryption or stealth configurations. Reliable detection requires proper logging configurations for the FortiGate appliance. Legitimate activities such as authorized testing or installation of temporary APs by IT staff can trigger this alert. A companion detection to reinforce coverage would be monitoring user authentication logs for suspicious login attempts associated with rogue AP alerts.

