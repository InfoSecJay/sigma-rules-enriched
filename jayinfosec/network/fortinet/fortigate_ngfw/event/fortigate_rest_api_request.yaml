note: |
  ### Technical Context

  The Sigma rule detects both successful and failed interactions with the FortiGate REST API, which can be indicative of either legitimate administrative tasks or potential unauthorized access attempts. The likely objective of an attacker could be to manipulate network configurations, extract sensitive data, or maintain persistence via API-based control. This detection aligns with the MITRE ATT&CK framework under the Execution tactic, specifically technique T1106 (API Usage).

  The primary telemetry sources are the FortiGate event logs, particularly those associated with the REST API interactions, identified by log IDs 47301 and 47302. If malicious, the security impact could include unauthorized changes to firewall policies or exposure of sensitive network information. It is important to note that detection does NOT confirm malicious intent or access on its own, as failed requests can originate from legitimate or misconfigured administrative tools.

  ### Investigation Steps

  - **Analyze API Interaction Logs**: Review FortiGate event logs for successful API requests (Log ID 47301) to understand the nature of the call. Look for unusual endpoints or methods (e.g., DELETE, PUT) that deviate from standard operational behavior.

  - **Correlate User Activity**: Cross-reference user IDs from the logs against known administrative accounts. Unauthorized users or unusual user-agent strings in API requests may indicate malicious activity.

  - **Identify Failures Against Normal Behavior**: Look for patterns in failed API requests (Log ID 47302). If you see multiple failures within a short timeframe, investigate if these are from an automated script or unauthorized attempts.

  - **Review Configuration Changes**: For any successful API calls, check if changes were made to critical configurations, such as firewall rules or user permissions. Document whether these changes align with approved administrative actions.

  - **Validate Legitimate User Actions**: Ensure interactions align with expected administrative schedules. If changes coincide with routine maintenance windows or authorized administrative access, they may be benign.

  - **Check for Any Anomalies in Source IPs**: Analyze the source IP addresses of API requests. Unexpected external IPs accessing the FortiGate REST API should be treated as suspicious and warrant further investigation.

  ### Prioritization

  The alert severity is moderate. While interaction with the FortiGate REST API is a normal administrative function, any unusual or unauthorized access attempts could lead to significant network configuration changes and potential breaches. The likelihood of malicious exploitation is present, given that the API can control critical network infrastructure.

  ### Blind Spots and Assumptions

  Detection may miss attempts where adversaries utilize stealthy or legitimate tools that mimic normal API traffic. Reliable log monitoring requires proper configuration of FortiGate to capture REST API events. Legitimate automation scripts might trigger alerts if not carefully configured. A related detection to strengthen coverage could involve monitoring for policy changes or unusual access patterns in FortiGate firewall logs.

