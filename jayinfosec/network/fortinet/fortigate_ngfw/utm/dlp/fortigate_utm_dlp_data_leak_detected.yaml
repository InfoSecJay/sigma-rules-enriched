note: |
  ### Technical Context

  This rule detects potential data leakage through FortiGate's unified threat management (UTM) data loss prevention (DLP) mechanisms. The behavior identified includes the matching of sensitive content against defined DLP policies using various methods, such as keyword matches and regular expressions. The likely attacker objective could be to exfiltrate sensitive information, such as personal data or intellectual property, from the organization's network. This detection aligns with the MITRE ATT&CK tactic **Exfiltration** (TA0010), particularly technique **Exfiltration Over Web Service** (T1041).

  The primary telemetry sources are FortiGate UTM logs, specifically log IDs 24576 and 24577, which signify warnings and notifications of detected data leaks. If confirmed malicious, this could lead to significant data breaches, regulatory fines, and reputational damage. However, it is crucial to note that this detection does NOT confirm that a data leak has occurred on its own; it only indicates that potentially sensitive data was flagged.

  ### Investigation Steps

  - **Review DLP log details:** Check FortiGate logs for log IDs 24576 and 24577. Look at fields such as `srcip`, `dstip`, `url`, and `filename` to identify the source and destination of the traffic, and assess if the flagged content is indeed sensitive.

  - **Correlate user activity:** Analyze user activity leading up to the alert. Look for specific user logins or access patterns that correlate with the event in the log. Ensure the user is authorized to access the flagged data and assess their recent actions via the source IP.

  - **Assess traffic type:** Identify the `httpmethod` and `filetype` in the logs. Typical benign activities might include service requests or authorized downloads through expected applications. Malicious indicators might include unauthorized uploads to external or unusual URLs.

  - **Validate against DLP policy:** Confirm if the content being flagged should legitimately trigger the DLP (e.g., sensitive data like PII or financial records). Find out if there are recent changes to the DLP policies that may have affected the logging.

  - **Monitor exfiltration behavior:** Investigate for additional indicators of exfiltration, such as unusual outbound connections, use of uncommon ports, or high volumes of data being sent to cloud services or external IPs. This can be cross-referenced with Network Flow logs.

  ### Prioritization

  The alert is categorized as high severity due to the potential impact on sensitive systems, especially if the data pertains to personally identifiable information or critical business information. Given the high likelihood of malicious activity leveraging DLP gaps for data exfiltration, this behavior should be treated urgently. Data leaks are increasingly weaponized by various threat actors, amplifying the need for thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of the DLP policies; legitimate file transfers might inadvertently trigger alerts due to overly broad keyword definitions. Required log sources must be properly configured to ensure complete visibility of DLP events. Note that legitimate employees may trigger this alert during routine data sharing or if sharing corporate resources with partners. A related detection to enhance coverage would be monitoring outbound traffic trends for significant deviations from baseline behavior.

