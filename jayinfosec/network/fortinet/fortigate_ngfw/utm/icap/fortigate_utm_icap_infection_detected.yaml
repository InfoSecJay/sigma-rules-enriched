note: |
  ### Technical Context

  This Sigma rule detects traffic blocked by FortiGate UTM's Internet Content Adaptation Protocol (ICAP) when a potential infection is identified. This indicates that network traffic from endpoints attempting to reach external resources has likely been altered or compromised, with the fortigate appliance preventing the connection to malicious elements. The likely objective of the attacker is to exploit vulnerable systems within the network, aiming for data exfiltration or further malware deployment.

  Relevant MITRE ATT&CK tactic is **Command and Control (TA0011)**, specifically technique **Application Layer Protocol (T1071)**. The primary telemetry source for this detection is FortiGate UTM logs, particularly focusing on log ID `60001`. The security impact of a confirmed infection can range from malware propagation to unauthorized data access. It should be noted that this detection does NOT confirm active compromise on its own and requires further investigation to validate the infection's nature and impact.

  ### Investigation Steps

  - **Review FortiGate UTM logs for log ID `60001`:** Filter logs to identify entries with "traffic blocked" due to ICAP infections. Focus on the `msg` and `url` fields for indications of the blocked content.

  - **Investigate specific `dstip`:** Cross-reference the destination IP (`dstip`) of the blocked traffic against threat intelligence sources to determine if it is a known malicious IP.

  - **Validate `infection` and `virusid`:** Examine the fields `infection` and `virusid` in the log entry for specific indicators of the malware detected. High-confidence malicious indicators include known signatures that match confirmed malware.

  - **Identify patterns of legitimate traffic:** Review baseline traffic behavior from users accessing common, legitimate sites. Ensure that there is nothing unusual in `url` requests indicative of benign user activity.

  - **Correlate with host endpoint protection events:** If available, check endpoint detection and response (EDR) logs for any concurrent alerts indicating similar threat activity or infection on devices linked to the identified `dstip`.

  - **Examine user behavior leading to alert:** Analyze user activity logs to determine if the user was visiting suspicious sites or engaging in activities typically associated with malware delivery (e.g., downloads from untrusted sources).

  ### Prioritization

  This alert should be treated with medium to low priority in an enterprise context. The severity is influenced by the criticality of the affected system and the potential for exploiting underlying vulnerabilities. Given that many infections can lead to unauthorized access, timely investigation is essential despite the low initial alert level.

  ### Blind Spots and Assumptions

  Evasion techniques might include attackers using encrypted traffic to circumvent detection. There is a reliance on having FortiGate logs properly configured and collected for effective detection. Legitimate activities such as software updates or user behavior related to browsing may inadvertently trigger this alert. A related detection could be logs indicating unusual patterns of outbound traffic from the same network segments, which would enhance overall detection coverage.

