note: |
  ### Technical Context

  This Sigma rule detects antiphishing activity by a FortiGate next-generation firewall (NGFW) web filter that monitors corporate credentials submitted to external websites. The primary attacker objective is to capture or exfiltrate sensitive user credentials, often as part of initial access tactics such as credential theft. The relevant MITRE ATT&CK tactics and techniques for this detection are Initial Access (TA0001) and Phishing (T1566).

  The primary telemetry source for this rule is the FortiGate UTM logs, specifically the event types relating to antiphishing activity. If this behavior is malicious, it can lead to unauthorized access to corporate accounts and data breaches. It is important to note that this detection does NOT confirm that credentials were actually compromised or misused—it only indicates that a match occurred based on the UTM's rules.

  ### Investigation Steps

  - **Review blocked URLs:** Check log entries with `logid` values `13651`, `13652`, or `13653` to identify any URLs that were blocked due to matching antiphishing rules. Correlate blocked URLs with known phishing domains.

  - **Analyze matched domains:** For events with `logid` values `13648` or `13649`, examine the `referralurl` and `url` fields to assess whether communications involve potentially malicious domains or trusted corporate sites.

  - **Validate user behavior:** Look at the `user` and `srcip` fields in the logs to gather context about the user’s normal operation. Confirm expected behavior by cross-referencing user account activity over the last week, which may help distinguish between legitimate accidental submissions and phishing attempts.

  - **Evaluate matching credentials:** Examine the `antiphishdc` field to see if the matched credentials correspond to a sensitive user role or high-value target. This will help assess the magnitude of potential risk.

  - **Cross-reference authentication server:** Investigate the `authserver` field entries. Ensure the credentials being analyzed correspond to a legitimate corporate authentication endpoint. Misconfigured servers may lead to false positives.

  - **Understand attack implications:** If blocking is flagged, determine how the blocked site or IP relates to known malicious actors or campaigns. Check its reputation against threat intelligence databases.

  ### Prioritization

  This alert has medium severity because it indicates potential credential submission to external sites, which could lead to account compromise. The risk is heightened if the user is from a critical asset role (e.g., finance or IT). While the behavior is not uncommon in phishing attempts, it does require immediate investigation to prevent possible credential theft.

  ### Blind Spots and Assumptions

  Detection is limited by the configuration of the FortiGate UTM appliance; if the web filter settings are misconfigured or disabled, this rule may not trigger. Legitimate activities such as multi-factor authentication prompts or security assessments may also inadvertently trigger this alert. A related detection to consider is monitoring outbound connections to known malicious IPs or domains to further assess the threat landscape.

