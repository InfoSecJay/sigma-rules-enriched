note: |
  ### Technical Context

  This Sigma rule detects events related to FortiGate's UTM web filter for antiphishing, which actively scans for corporate credentials being submitted to external websites. The primary objective of the attacker is often to steal credentials for unauthorized access to corporate resources, fitting into the MITRE ATT&CK tactic of Initial Access (TA0001) with technique T1566, which focuses on phishing. The primary telemetry sources are FortiGate UTM logs – specifically those related to web filtering and antiphishing actions, identified by event log IDs 13648 to 13653. If malicious, this behavior may lead to compromised user accounts and unauthorized access to sensitive information. However, this detection does not confirm that any credentials were successfully harvested, only that an attempt occurred.

  ### Investigation Steps

  - **Review alert log details**: Access FortiGate logs associated with the alert, focusing on Event IDs 13651 or 13652, and inspect the fields `srcip`, `dstip`, `url`, and `user` to identify the user and source of the request. Document any IP addresses that are out of the ordinary for that user, which could indicate malicious intent.

  - **Assess the referral URL**: Check the `referralurl` field for known phishing or malicious websites. Legitimate URLs should match previously trusted domains or have valid certificates, while suspicious referrals could indicate a phishing attempt.

  - **Validate user context**: Determine if the `user` field matches expected patterns for the user’s typical behavior. If the user typically accesses internal resources instead of external sites, this could signify an abnormal risk.

  - **Investigate the matched rules**: Review `antiphishrule` and `antiphishdc` fields to see which specific antiphishing profile was triggered. Cross-reference with your organization’s policies to evaluate if the flagged action aligns with known security configurations.

  - **Identify blocked actions**: If any of the events (IDs 13651, 13652) indicate that access was blocked, cross-check `msg` for insights on why the request was blocked and any corresponding follow-up actions needed to secure the user’s environment.

  - **Examine similar events**: Look for patterns by checking for multiple occurrences of this alert within the same timeframe from the same user or IP. High-frequency alerts might indicate a targeted phishing attempt, warranting higher prioritization.

  ### Prioritization

  The alert has medium severity due to the potential impact on compromised corporate credentials, which can lead to system breaches. The likelihood of this being an actual malicious attempt is moderate, especially as phishing techniques are commonly weaponized against enterprises. However, it should not be disregarded, as high volumes of these alerts may expose significant risks.

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of the FortiGate appliance to categorize and accurately flag all phishing attempts, especially if they leverage newly registered or lesser-known domains. Log collection settings must be properly configured for UTM and web filtering to ensure coverage. Legitimate activities could include employees accessing external sites for business purposes, which could inadvertently trigger alerts. Related detections might include checks for anomalous user behavior through behavioral analysis or monitoring of unauthorized outbound connections.

