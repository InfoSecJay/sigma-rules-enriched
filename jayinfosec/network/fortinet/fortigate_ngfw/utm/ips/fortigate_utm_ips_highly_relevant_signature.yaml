note: |
  ### Technical Context

  This Sigma rule detects internal lateral movement attempts using FortiGate's Unified Threat Management (UTM) Intrusion Prevention System (IPS) signatures, focusing on various exploitation and backdoor efforts targeting private network systems. The likely attacker objective is to execute malicious commands or gain unauthorized access to sensitive information, which can facilitate further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002) and specifically targets techniques such as "Scripting" (T1064) and "Command and Control" (TA0011).

  Primary telemetry sources include FortiGate logs categorized as UTM, particularly focusing on fields like `attack`, `srcip`, `dstip`, and user information. If malicious, this activity poses a high security risk as it indicates an attempt at unauthorized lateral movement or exploitation within the enterprise network. It is crucial to note that this detection does NOT confirm a successful exploit or compromise on its own; it merely indicates potential malicious activity requiring further investigation.

  ### Investigation Steps

  - **Identify the source IP address and user: ** Review FortiGate logs and extract `srcip` and `user` fields to understand where the attack originated. Determine if the source machine is a known or unusual asset within the network.

  - **Analyze the destination IP and services: ** Check the `dstip` in correlating logs to identify the target system. Analyze if this traffic is targeting critical assets, such as servers hosting sensitive data, or if it is benign inter-system communication.

  - **Examine the attack signatures: ** Investigate the `attack` field for keywords like `Meterpreter`, `Mimikatz`, or `Webshell`, which indicate high-confidence malicious techniques. This insight can help prioritize response actions based on the severity of the threat.

  - **Review legitimate internal traffic patterns: ** Validate expected operational behaviors based on documented workflows. For example, legitimate internal tools or services that might communicate in ways similar to the detected signatures (e.g., administrative scripts running between servers) should be noted for context.

  - **Correlate with other security tools: ** Cross-reference with endpoint detection and response (EDR) solutions or intrusion detection systems (IDS) to check for alerts related to the same user or source IP within a defined timeframe, indicating a coordinated attack vector.

  - **Document file creation or data access: ** For high-risk events, validate artifact creation by checking file logs or monitoring data access patterns on the target system to confirm if sensitive data is being exfiltrated or manipulated post-detection.

  ### Prioritization

  This alert should be considered critical due to the potential impact of the affected systems, particularly if targeted assets include sensitive or core infrastructure. The likelihood of malicious abuse is high, given the prevalence of the identified tools in known attacks and their potential implications on security. This behavior is well-documented in the context of lateral movement, further underscoring its severity.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion techniques, such as using legitimate tools or scripts that may also match the signatures, leading to false positives. Accurate configuration of FortiGate logging and ensuring necessary logs are captured are critical for reliable detection; missing logs can hinder investigations. Additionally, legitimate internal maintenance activities or automated scripts might trigger similar alerts, which necessitates careful analysis of context to differentiate between benign and malicious actions. A companion detection to enhance coverage could involve monitoring for anomalous user behavior, which may indicate a compromised account executing lateral movements.

