note: |
  ### Technical Context

  This rule detects anomalies in session creation through FortiGate UTM, indicating potential Denial of Service (DoS) attacks. Adversaries may attempt to exhaust system resources by establishing an excessive number of connections to a target system, leading to service disruption. This behavior maps to the MITRE ATT&CK tactic of Impact (T1498), specifically in the context of resource exhaustion techniques.

  Primary telemetry sources include FortiGate logs, specifically looking for UTM anomalies related to TCP, UDP, or ICMP sessions. The potential security impact of this detection can be significant, as successful DoS attacks can render services unavailable, impacting operations and business continuity. However, this detection does NOT confirm malicious intent, as high-session counts can be generated by legitimate security testing, misconfigured applications, or unusual traffic patterns.

  ### Investigation Steps

  - **Review UTM Anomaly Logs**: Check FortiGate logs for log IDs ending in '18432', '18433', or '18434' within the UTM category that indicate anomalous session creation. Look for patterns of excessive connections from a single source IP (`srcip`) to a target IP (`dstip`).

  - **Identify Source IP Behavior**: Validate the `srcip` against known IP threat intelligence databases. An IP address flagged for malicious activity may indicate a high-confidence malicious indicator.

  - **Assess Peak Session Counts**: Review the `session` count referenced in the logs against established thresholds. Indicate legitimate traffic levels for services to determine if the observed traffic pattern is likely malicious or benign.

  - **Cross-Reference Affected Services**: Investigate the services (`service` field) under attack and correlate with known and expected traffic patterns. Identify if the affected services are critical to business operations, which would elevate the severity of the incident.

  - **Perform Network Traffic Analysis**: Utilize packet capture and flow analysis to corroborate session counts and determine if legitimate workloads or configurations might be raising session limits unintentionally.

  - **Track Historical Trends**: Compare current logs with historical data on sessions from the same source IP to determine if the observed behavior is an anomaly or part of a recurring trend (potential testing scenario or misconfiguration).

  ### Prioritization

  The severity is considered low due to the nature of session alerts typically arising from both benign and malicious sources. However, if high-traffic sources target critical services, the risk of malicious abuse exists. While this behavior can frequently indicate potential DoS attacks, it also has legitimate explanations which must be explored before escalating.

  ### Blind Spots and Assumptions

  The detection may have limitations if threshold settings are not properly tuned, leaving room for evasion techniques such as session spreading across multiple IPs. Effective detection relies on correctly configured logs from the FortiGate appliances, capturing required UTM anomaly events. Legitimate activities such as automated backups or software updates could trigger similar alerts. For augmented coverage, consider companion detections around network anomalies (e.g. unusual spikes in traffic volume or packet rates) to enhance insight into potential DoS attack vectors.

