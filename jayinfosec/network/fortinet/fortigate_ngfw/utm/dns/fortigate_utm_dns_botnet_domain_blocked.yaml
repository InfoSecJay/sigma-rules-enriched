date: 2023/11/20
logsource:
  category: appliance
  product: fortigate
  service: utm
detection:
  selection:
    type: 'utm'
    subtype: 'dns'
    eventtype: 'dns-response'
    logid|endswith:
    - '54600'           # Domain blocked by DNS botnet C&amp;C (IP)
    - '54601'           # Domain blocked by DNS botnet C&amp;C (Domain)
  condition: selection
fields:
- dstip
- action
- botnetdomain
- qname
falsepositives:
