level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS responses related to blocked botnet domains or IP addresses by FortiGate's UTM service. It indicates attempts by malware or compromised systems to reach Command and Control (C2) infrastructure, suggesting an attacker may be trying to control infected devices. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011) with the technique **Application Layer Protocol** (T1071.004). Primary telemetry sources include FortiGate UTM logs, specifically the DNS event type logs (Log IDs 54600 and 54601). If successful, this behavior can enable ongoing remote access or malware communication, potentially impacting confidentiality and system integrity. However, this detection does NOT independently confirm that a host is compromised; it only indicates that there was an attempt to reach a known malicious domain or IP.

  ### Investigation Steps

  - **Review blocked domain or IP:** Check the `botnetdomain` and `dstip` fields in the log for any known malicious indicators from threat intelligence sources.
  - **Correlate with endpoint telemetry:** Review Security Event ID 4688 (process creation) on devices that attempted to resolve the blocked domain to identify associated malicious processes, particularly those executed in a short time frame after the DNS request.
  - **Identify legitimate use cases:** Determine if users or services in the environment regularly communicate with the blocked domain (e.g., verify the business case for applications that may rely on it, and check against organizational approved domains).
  - **Examine additional network traffic:** Look at firewall and proxy logs (specifically HTTP/S traffic) for connections to the blocked domain or IP, using log sources like `firewall log` or `proxy log` with fields such as `url`, `http_method`, and `user_agent` to identify patterns of malicious activity.
  - **Alert on repeated occurrences:** Investigate multiple block events (in a short timespan) from the same internal IP, which could indicate a compromised system repeatedly attempting to connect to malicious infrastructure.
  - **Validate suppression mechanisms:** Ensure that legitimate DNS filtering configurations (such as corporate security measures against certain domains) aren't mistakenly suppressing this alert and leading to blind spots.

  ### Prioritization

  This alert should be treated with medium priority due to its potential impact on compromised systems reaching C2. The likelihood of malicious abuse is notable, as many malware families rely on hitting known botnet domains. However, false positives can occur due to legitimate software or systems that may inadvertently connect due to misconfiguration.

  ### Blind Spots and Assumptions

  Detection efficacy can be limited by previously cached DNS records or legit traffic misidentifying as malicious. Ensure logs from FortiGate are appropriately configured to capture all relevant DNS filtering events. Legitimate activities, such as internal services contacting a third-party service, could trigger this alert. A companion detection to consider is monitoring for outbound connection attempts flagged by other endpoint monitoring solutions (like EDR alerts for suspicious outbound connections), which can provide a fuller picture of potential compromises.

