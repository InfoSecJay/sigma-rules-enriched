title: FortiGate UTM DNS Botnet Domain Blocked
id: b6320cca-4ab8-4e4f-9532-eeb24e5ae00c
status: experimental
description: Detects FortiGate NGFW UTM DNS events where a domain or IP address 
  was blocked at the DNS name resolving stage by FortiGuard Services DNS botnet 
  C&C protection.
