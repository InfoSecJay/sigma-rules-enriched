note: |
  ### Technical Context

  This detection rule identifies instances where FortiGate UTM (Unified Threat Management) security profiles detect infected files as part of their malware scanning capabilities. The likely objective is to block or allow access to potentially harmful files that may facilitate post-exploitation activities, such as data exfiltration or lateral movement. Relevant MITRE ATT&CK techniques include Execution (T1203 - Exploitation for Client Execution) and other relevant techniques depending on file type and context.

  Primary telemetry sources include FortiGate logs, specifically UTM logs related to infection detections, including log types indicating blocked or passed files. If the detection is confirmed as malicious, impacts could include loss of data integrity, unauthorized access, or disruption of services. However, this detection does NOT confirm that the affected file executed successfully or that any further malicious activity occurred.

  ### Investigation Steps

  - **Identify the source of the infection alert:** Review FortiGate UTM logs (Log ID 8192, 8193, 8194) for the source IP (srcip) of the infected file. Cross-reference with known asset inventories to establish legitimacy—typically, legitimate files will be from trusted sources.

  - **Assess the path and type of the infected file:** Examine the URL and file type logged in the UTM incident. For instance, check for high-risk file types commonly associated with malware (e.g., .exe, .zip) and validate the file's origin. Look for indicators such as unusual filenames or extensions.

  - **Correlate with FortiSandbox outputs:** Analyze logs with Log IDs 9234, 9235 indicating results from FortiSandbox that might provide insight into how the file was categorized. Note whether it was flagged with warnings or notices and if there are prior instances involving the same file or URL.

  - **Evaluate host behavior post-alert:** Investigate if there were any outbound connections or unusual processes on the endpoint following the time of infection detection using process monitoring logs. Legitimate traffic should reflect regular business operations without unauthorized outbound connections.

  - **Review for prior infections or patterns:** Check previous UTM logs for similar URL detections or from the same srcip to see if this is part of a larger infection campaign, which might indicate ongoing adversary actions.

  - **Assess user activity surrounding the detection:** Check the user context against the logs indicating file detection to see if the user typically engages in activities that may justify encountering malware (e.g., downloading software, accessing untrusted sites). Legitimate behavior should correlate with known user roles.

  ### Prioritization

  The alert severity is categorized as medium due to the system's role in the environment and the potential for the infected file to compromise data integrity or lead to unauthorized access. While infections can be common, indicating a likelihood for malicious use, the context of the alert should govern the response strategy.

  ### Blind Spots and Assumptions

  Detection may be limited by the capability of FortiGate to analyze all potential file types accurately, which adversaries may evade by using obfuscation techniques or encryption. Required log sources must be correctly configured, including comprehensive logging on the FortiGate appliance. Legitimate activities, such as downloading files from trusted vendors, could trigger this alert. A related detection to consider is network traffic anomalies associated with identified malware exploitation patterns, reinforcing the need for a holistic view on the network's health.

