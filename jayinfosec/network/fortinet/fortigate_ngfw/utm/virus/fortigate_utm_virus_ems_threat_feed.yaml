note: |
  ### Technical Context

  This Sigma rule detects specific events related to virus signatures reported by the FortiClient Endpoint Management Server (EMS) threat feeds, indicating files or MIME data that have been flagged as infected. The primary objective of such detections is to identify potential malware threats executed within the network, aiming to compromise data integrity or confidentiality. The relevant MITRE ATT&CK tactic is "Execution," with technique ID T1059 (Command and Scripting Interpreter). The primary telemetry sources include FortiGate UTM logs, specifically those indicating threats and events corresponding to infected files (Log IDs: 8216, 8217, 8218, 8219).

  If malicious, the detection signals a potential malware infection that may facilitate lateral movement, data exfiltration, or other malicious activities. However, this detection does NOT confirm the presence or execution of malware on its own, as legitimate applications could also trigger these alerts if they process infected file types.

  ### Investigation Steps

  - **Review specific log entries**: Access UTM logs from FortiGate appliance looking for Event IDs 8216-8219. Investigate the srcip and dstip fields to identify the source and destination of the infected files.

  - **Identify malicious indicators**: Look for repetitive alerts from the same srcip indicating multiple file infections, or inspect the user field for any anomalous account activity that may relate to the infection event.

  - **Cross-reference with existing systems**: Check endpoints or servers for any quarantined files or entries in the FortiClient logs that correspond to reported infections. Review FortiClient event logs for blocked processes or updates regarding remediation.

  - **Analyze benign behavior**: Validate whether the flagged files are associated with expected application behavior by checking the nature of the files against known-good indicators or running applications in the environment.

  - **Investigate destination communication**: Check for outbound communications from detected infected sources to external IP addresses using firewall logs, identifying any potential exfiltration by reviewing allowed and disallowed service communications.

  - **Check for EDR/AV alerts**: Look at endpoint detection and response (EDR) tools or antivirus logs for corroborating evidence of the malware infection, such as blocked execution attempts or logs of malicious activity that align with the alerts.

  ### Prioritization

  This alert carries medium severity due to the potential impact on systems within critical enterprise infrastructure, as infected files can lead to data breaches or service outages. Given the likelihood of malicious activity, these detections should be prioritized alongside other indicators of compromise, particularly when correlated with suspicious user or process behavior.

  ### Blind Spots and Assumptions

  Limitations include the possibility of false positives due to legitimate applications triggering these alerts, thus requiring investigation into each incident. Full reliance on default log configurations must be avoided; thorough log retention and proper integration of EMS threat feeds are essential for effective detection. Legitimate activities may involve automated processes or backups scanning for threats. Strengthening coverage may involve combining this Sigma rule with others that detect unusual file downloads or execution patterns to validate suspected malware behavior further.

