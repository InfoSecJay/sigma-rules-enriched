note: |
  ### Technical Context

  This Sigma rule detects the blocking of files by the FortiGate next-generation firewall (NGFW) due to identified viruses via its Unified Threat Management (UTM) capabilities. The behavior typically indicates that an adversary may have attempted to upload or download malicious files, thereby compromising confidentiality or system integrity. This aligns with the MITRE ATT&CK tactic of "Execution" (TA0040), specifically the technique "User Execution" (T1203), where a malicious document or executable is run by a user.

  The primary telemetry source for this detection is the FortiGate UTM logs, specifically the logs that indicate file activity blocked due to malware (Log ID 8448). If malicious, this behavior suggests an active attempt to introduce harmful code into the environment. However, this detection does NOT confirm that an infection has occurred on the system, nor does it indicate whether the file was successfully executed prior to being blocked.

  ### Investigation Steps

  - **Review telemetry for blocked files:** Examine FortiGate logs (Log ID 8448) for entries where files were blocked. Look for fields like `virusid`, `srcip`, and `filename` to identify potential sources of attack.

  - **Identify the source IP address:** Assess the `srcip` field in the logs. If the IP address is from expected internal ranges (e.g., 192.168.0.0/16), it may indicate a user-initiated action rather than an external attack.

  - **Correlate with endpoint events:** Check related endpoint security logs for process creation events around the time of the FortiGate alert, specifically Security Event ID 4688 or Sysmon Event ID 1. This can help establish whether any processes attempted to access or execute the blocked file.

  - **Investigate user activity:** Review user activity logs for prior actions taken by the implicated user or system, focusing on file downloads or email attachments. This helps determine if the blocked file may have been introduced by legitimate usage patterns.

  - **Check for common evasion tactics:** Be aware of common evasion techniques, such as users attempting to download similar files or using different protocols (e.g., FTP) to bypass controls. Scrutinize additional file transfers or suspicious DNS queries around the alert timeframe.

  ### Prioritization

  The severity of this alert is high due to the potential for malware introduction into the network, particularly in environments where sensitive information is processed. Given the likelihood of malicious use of UTM evasion techniques, it warrants immediate investigation to prevent possible exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as changing file extensions or using encrypted channels for exfiltration. Reliable detection requires comprehensive logging configurations on the FortiGate, ensuring that UTM events are captured. Legitimate software updates or file-sharing processes may sometimes trigger this alert. Companion detections that could enhance coverage include looking for unusual outbound connections from user workstations or anomalous process creation related to file transfer applications.

