note: |
  ### Technical Context

  This rule detects in-line blocking events triggered by FortiGate's UTM (Unified Threat Management) system, specifically when it identifies an infected file. The objective of this detection is to prevent the spread of malware within the network by intercepting and blocking malicious files before they can be executed or transmitted further. This activity corresponds to the MITRE ATT&CK tactic "Execution" and technique "Command and Scripting Interpreter" (T1059).

  The primary telemetry source for this detection is FortiGate UTM logs related to inline blocking events, specifically log IDs 8220, 8221, 8222, and 8223. If the behavior detected is confirmed malicious, it poses a high security risk, as it indicates that infected files are being actively blocked. However, it is crucial to note that this detection does NOT confirm whether malware has already been executed on the endpoint or gained a foothold within the environment.

  ### Investigation Steps

  - **Review log details for block events:** Examine FortiGate logs with log IDs ending in 8220 – 8223. Look for the 'url', 'srcip', and 'user' fields to identify the source of the block and if multiple/block events are occurring from the same source.

  - **Correlate with endpoint activity:** If the blocked IP address is from an internal subnet (e.g., 10.x.x.x or 192.168.x.x), check endpoint logs (Windows Security Event ID 4688) to determine if any process executions occurred from that source around the same time as the detection. Look for abnormal or unexpected processes.

  - **Identify recurring issues or patterns:** Track if the same infected file is being repeatedly blocked from the same source IP. This could indicate a misconfigured application or a system repeatedly attempting to access a malicious resource, which warrants further investigation.

  - **Evaluate potential false positives:** Consider legitimate applications that might generate false positives. For example, file transfer applications that may mistakenly identify benign files as threats. Review the 'srccountry' and 'dstip' to assess if they align with known trusted connections.

  - **Document the malicious indicators:** If a specific URL or file type is consistently identified as infected, document these indicators. High-confidence malicious indicators include frequently blocked URLs with common malware signatures or file extensions (e.g., .exe/.scr).

  - **Check for exfiltration artifacts:** If blocking events are part of a larger pattern, confirm if the blocked file was attempted to be exfiltrated. Look for outbound file transfer logs (FTP/Event IDs 4688/4663) for user activity corresponding with the blocking events.

  ### Prioritization

  This alert should be considered medium severity due to its detection of potentially malware-laden files attempting to enter the network. The likelihood of malicious abuse is moderate given the inline blocking nature of the detection, which implies that detection often correlates with recognized threats. However, malicious exploitation directly from the identified source is not guaranteed.

  ### Blind Spots and Assumptions

  Detection may miss threats if file types not covered by the UTM scanning are used. Additionally, attackers could employ evasion techniques like encoding or compressing files to avoid detection. Reliance on FortiGate's UTM logs means that logs must be correctly configured and comprehensive to ensure full visibility. Legitimate activities, such as bulk file uploads or downloads from trusted administrators, might inadvertently trigger this alert. Companion detections could involve monitoring for outbound connections to known malicious URLs or integrating a file integrity monitoring solution to strengthen coverage against silent compromise attempts.

