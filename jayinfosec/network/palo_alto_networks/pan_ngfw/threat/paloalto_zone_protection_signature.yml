note: |
  ### Technical Context

  This Sigma rule detects potential denial-of-service (DoS) and scanning attempts against a network using Palo Alto Networks' Zone Protection signatures. The likely attacker objective is to overwhelm network resources, disrupt service availability, or map the network for further exploitation. The detection relates to MITRE ATT&CK tactic "Initial Access" (TA0040) and technique "Exploit Public-Facing Application" (T1190).

  The primary telemetry source is Palo Alto Networks threat logs, specifically looking for entries with `type` set to 'THREAT' and `subtype` indicating 'flood' or 'scan'. If a malicious DoS attack is confirmed, it can lead to significant service disruption and financial loss. However, this detection alone does not confirm a successful breach, as it may also capture benign scans from vulnerability assessments or misconfigured systems.

  ### Investigation Steps

  - **Review threat logs for alerts:**
    Check the Palo Alto threat logs for entries with `type: 'THREAT'` and `subtype` indicating either 'flood' or 'scan'. This will give you insight into possible attacks.

  - **Identify action taken on detected traffic:**
    Look for the `action` field—specifically values like 'deny', 'drop', or 'reset-both'. A 'deny' or 'block' action greatly increases the likelihood of a malicious attack.

  - **Check source and destination IP addresses:**
    Examine the `src` and `dst` fields for known malicious IPs or suspicious geographic locations. Cross-reference with threat intelligence feeds.

  - **Analyze frequency and pattern of alerts:**
    Review the `severity` field for patterns in the logs over time. A high frequency of alerts from a single IP within a short timeframe could indicate a targeted attack.

  - **Validate legitimate traffic sources:**
    Confirm legitimate operational traffic, such as automated vulnerability scanners from specific IP ranges or known internal services. This can be done by comparing timestamps and source IPs against normal operational logs.

  - **Assess for companion threats:**
    Correlate findings with intrusion detection/prevention system logs to identify any additional malicious activity occurring concurrently, which may include larger coordinated attacks.

  ### Prioritization

  The alert is of medium severity due to the potential impact on system availability and performance if malicious. In a mature enterprise context, the likelihood of such behavior being exploited by adversaries is significant, especially with increasing sophistication in attack vectors targeting network resources.

  ### Blind Spots and Assumptions

  This detection may not catch attackers employing advanced evasion techniques such as spoofed IPs or fragmentation methods, which may bypass alerting. Continuous logging from the Palo Alto device and proper configuration is critical to ensure reliable detection. Legitimate activities like scheduled vulnerability scans from internal security teams can also trigger this alert. A companion detection is correlating this log with suspicious attempts to access sensitive services or ports that have been recently targeted.

