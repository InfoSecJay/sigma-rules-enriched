level: critical
note: |
  ### Technical Context

  This rule detects various internal network threats that involve the use of well-known attack tools and techniques for lateral movement within private networks. The behavior includes attempts to exploit vulnerabilities or use unauthorized software to probe or compromise other internal systems. The likely attacker objective is to extend access and control across the network, often as a prelude to data exfiltration or further compromise. This detection aligns with the MITRE ATT&CK technique "Lateral Movement" (T1021) and "Execution" (T1059).

  The primary telemetry sources are Palo Alto Networks threat logs, specifically monitoring events associated with UTM appliance types that relate to vulnerabilities and spyware. If the activity is malicious, it could lead to unauthorized access, data loss, or larger systemic compromises. It is crucial to note that this detection does NOT confirm an actual compromise or successful exploitation on its own; it merely indicates that tools associated with potential threats were observed.

  ### Investigation Steps

  - **Check event logs for threat activity:** Review Palo Alto threat logs for Event Type "utm," focusing on subtype fields showing "vulnerability" or "spyware." Look for threatid entries such as "Mimikatz," "Cobalt Strike," or similar tools listed in the Sigma rule.

  - **Examine source and destination IPs:** Validate the source (`src`) and destination (`dst`) IP addresses against internal asset databases or DHCP logs. Legitimate internal traffic typically involves known systems communicating, such as file servers or domain controllers, rather than unusual, non-registered IPs.

  - **Cross-reference user activity:** Investigate user activity around the timestamps of the alerts by checking Windows Security Event ID 4624 (Logon) and correlating unusual logon behaviors (e.g., multiple rapid logons at different devices) with the threatid logged in Palo Alto.

  - **Identify high-confidence malicious indicators:** Look for associated actions that indicate blocking or dropping of malicious traffic. A high-confidence indicator is if an action field shows "deny" or "block," suggesting proactive defense mechanisms actively preventing the attack.

  - **Review endpoint security controls:** Assess the logs from endpoint protection software (e.g., EDR tools) for alerts that may correlate with the detected threat. Cross-check timestamps of the Palo Alto entries against endpoints for corroborated indications of exploit attempts or tool use.

  - **Monitor for lateral movement patterns:** Observe logs for processes related to "PsExec" or other remote execution tools noted in the Sigma rule, checking for patterns suggesting unauthorized administrative access or system enumeration that can indicate lateral movement attempts.

  ### Prioritization

  This alert is critical due to its implication of potential lateral movement within high-value internal systems. The likelihood of malicious intent is compounded by the use of recognizable tool signatures that are commonly weaponized in cyberattacks. The impact can escalate quickly, leading to widespread compromise if not acted on promptly.

  ### Blind Spots and Assumptions

  Detection potentially misses activity if attackers modify their tools or use less recognized applications to avoid signature detection. Proper logging configurations for the Palo Alto devices are essential for accurate detection, and environments lacking comprehensive endpoint logging may report undetected lateral movements. Additionally, legitimate administrative tools used by IT staff may trigger false positives; for instance, authorized vulnerability scanning tools could mimic the detected behaviors. A related detection could include monitoring for abnormal administrative access logs, enhancing overall visibility into potential insider threats or credential misuse.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
