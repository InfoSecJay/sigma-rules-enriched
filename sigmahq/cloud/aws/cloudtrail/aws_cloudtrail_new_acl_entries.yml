  ### Technical Context

  This rule detects the creation of new network ACL (Access Control List) entries in an AWS environment, specifically through the CloudTrail service. By doing this, it captures behavior that indicates potential changes to network security configurations, which could be leveraged by adversaries to manipulate access control for their objectives. The likely attacker objective is to open new attack vectors to facilitate unauthorized access or lateral movement within the AWS infrastructure.

  The relevant MITRE ATT&CK technique is **Defense Evasion (T1562.007)**, as changing ACLs may help an attacker evade existing network defenses. The primary telemetry source is **AWS CloudTrail**, specifically looking for events with **eventSource: ec2.amazonaws.com** and **eventName: CreateNetworkAclEntry**. If malicious, this behavior could significantly impact the confidentiality and integrity of data and resources by allowing unmonitored access. This detection does NOT confirm that the configuration change is malicious on its own—legitimate access configurations can trigger this rule as well.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for the event:** Check CloudTrail for **eventName: CreateNetworkAclEntry** and correlate it with **eventTime, userIdentity, and sourceIPAddress** fields. For example, a log entry from an unexpected user or an anomalous IP should be flagged as suspicious.

  - **Cross-check against known legitimate changes:** Verify if the detected change matches documented maintenance or security governance activities. Legitimate actions may include enabling access for specific services or for public access to a public-facing workload.

  - **Investigate associated network traffic:** Utilize VPC flow logs to assess traffic before and after the ACL modification. Look for increased traffic patterns to the affected resources or unexpected inbound/outbound connections that could indicate post-configuration exploitation.

  - **Asses IAM role changes:** Check for any changes in IAM policies or roles coinciding with the ACL entry creation by reviewing **CloudTrail logs** for **eventName: PutRolePolicy** or **eventName: AttachRolePolicy** events, which may reveal an attempted elevation of privileges alongside the network changes.

  - **Validate impacted resources:** Identify the resources associated with the modified ACL and their criticality level (e.g., public-facing web servers). If these resources are known to host sensitive data, classify the alert severity accordingly.

  ---

  ### Prioritization

  This alert is considered **low severity**, as new ACL entries can stem from legitimate administrative use, such as enabling access for cloud applications or staff. However, given the potential for adversaries to exploit such changes, analysts must remain vigilant, particularly in public-facing contexts where misuse of ACLs can lead to significant data compromise.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if CloudTrail logging is not enabled for the account, or if log retention policies are inadequate. Additionally, known benign activities, such as security updates for services, can trigger this alert. A companion detection to consider is monitoring for changes to **network security groups (NSGs)**, as they often relate to ACL changes and can provide insight into broader network manipulation attempts.

