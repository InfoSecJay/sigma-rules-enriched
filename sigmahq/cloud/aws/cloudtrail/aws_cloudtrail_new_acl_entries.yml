note: |
  ### Technical Context
  This detection rule identifies when a new network ACL (Access Control List) entry is added to a route table in Amazon Web Services (AWS). The ability to modify network ACLs can indicate potential unauthorized changes that may expose sensitive resources or enable malicious communication pathways. Attackers may exploit this capability to establish new attack vectors, gain lateral movement access within a cloud environment, or create backdoors for future exploitation.

  In the context of AWS, the most likely tension for this detection encompasses actions taken by attackers to manipulate network configurations for malicious purposes, such as data exfiltration or command and control (C2) communications. The relevant MITRE ATT&CK tactics for this rule include **Defense Evasion** (T1562) and specifically **Network Accessibility** (T1562.007), highlighting that the modification of ACLs can be a tactic employed to bypass security controls and facilitate nefarious activities.

  Primary data sources for validating this detection include AWS CloudTrail logs, which provide insights into API calls made to AWS services, including network ACL changes. Monitoring these logs can uncover suspicious or unexpected modifications that warrant further investigation.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Examine AWS CloudTrail logs for the `CreateNetworkAclEntry` events to identify the source of the changes and any coinciding actions that may indicate unauthorized access or configuration manipulation.
  - **Assess Network Configuration Changes:** Analyze the specific changes made to the network ACLs, noting any entries that permit or deny traffic, and correlate them with existing security group settings and routing configurations to determine if there are any inconsistencies.
  - **Check User Activity:** Investigate the IAM user or role associated with the event. Verify whether the action is consistent with the user's known activity patterns and permissions, ensuring that no compromised credentials are involved.
  - **Evaluate for Unusual Access Patterns:** If there are changes in ACLs that expose resources, monitor for subsequent attempts to access those resources, noting unusual IP addresses or geolocations indicative of a potential breach or malicious activity.

  ### Prioritization
  Given that allowing unauthorized access through network ACL modifications can expose critical assets and lead to data breaches, this alert is classified as low severity. However, if other anomalous actions are detected alongside ACL modifications, it could escalate in priority due to the potential risk posed to the environment.

  ### Blind Spots and Assumptions
  This detection rule may not capture all scenarios of unauthorized access if attackers manipulate network ACLs through other means, such as Service Control Policies or console access. The detection logic assumes that legitimate administrative activities should be accounted for and may require contextual evaluation to reduce false positives. The effective operation of this alert presumes that AWS CloudTrail logging is enabled and configured to capture all relevant API call events, including those pertaining to network ACL modifications. Proper logging setups in AWS are crucial for accurate detection and response capabilities.

