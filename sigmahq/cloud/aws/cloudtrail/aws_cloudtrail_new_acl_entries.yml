note: |
  ### Technical Context

  This rule detects the creation of new network ACL (Access Control List) entries in an AWS environment. Such activities may indicate an attacker attempting to manipulate network configurations to open new attack vectors for data exfiltration or lateral movement. The relevant MITRE ATT&CK tactic is Defense Impairment (TA0042) and the specific technique is Application Layer Protocol Manipulation (T1686.001).

  The primary telemetry source is AWS CloudTrail, particularly focusing on the event type "CreateNetworkAclEntry." If this action is malicious, it could allow unauthorized traffic into sensitive resources or applications. It is important to note that this detection does NOT confirm malicious intent by itself; legitimate changes can occur as part of regular network management.

  ### Investigation Steps

  - **Verify event details:** Review CloudTrail logs for the event `CreateNetworkAclEntry` (Event ID: 6). Check fields such as `eventTime`, `userIdentity`, and `sourceIPAddress`. If the user is an authorized network admin managing ACLs, classify as benign.

  - **Inspect network ACL changes:** Examine the updated ACL entries for any rules that allow access from unusual or untrusted IP addresses. Look for `ruleAction: "allow"` paired with known malicious IPs or ranges.

  - **Assess affected resources:** Identify the route table affected by the new ACL entry to determine if it impacts critical resources such as publicly accessible instances or databases (e.g., check EC2 instance configurations and security groups).

  - **Review prior activity:** Investigate prior CloudTrail logs leading up to the event to check for any suspicious activity, such as unauthorized IAM console logins or prior IAM permission changes.

  - **Compare with expected behavior:** Identify recent legitimate changes to network ACLs by trusted admins. For routine developments, ACL changes are often accompanied by `CreateNetworkAcl` events; if these are missing, it raises red flags.

  ### Prioritization

  This alert should be considered low severity unless tied to critical assets, as the addition of ACL entries can typically be part of normal network management practices. However, the potential for malicious exploitation warrants closer inspection, especially if associated with compromised credentials or unauthorized accounts.

  ### Blind Spots and Assumptions

  The primary detection limitation includes potential legitimate activities by network admins, which may prevent missed detections if ACLs are frequently updated. Required log sources include comprehensive CloudTrail logging to capture all relevant API calls, particularly if AWS services are configured restrictively. Additionally, closely related detections, such as unauthorized IAM policy changes (e.g., `CreatePolicy`), could help provide wider coverage of potential compromise.

