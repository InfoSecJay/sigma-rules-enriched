  ### Technical Context

  This Sigma rule detects the creation of new network access control list (ACL) entries in AWS, specifically monitoring for the `CreateNetworkAclEntry` event via CloudTrail. The likely attacker objective is to manipulate or expand access to resources within an AWS environment, potentially facilitating lateral movement, data exfiltration, or the establishment of persistent backdoors. This behavior is aligned with the MITRE ATT&CK tactic of Defense Evasion (ID: T1562.007).

  The primary telemetry source for this detection is AWS CloudTrail logs, which record activity within an AWS account. If an unauthorized actor successfully adds network ACL entries that open new attack vectors, the security impact could be significant, as it could lead to increased access to critical resources. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate changes by authorized personnel can trigger the alert.

  ---

  ### Investigation Steps

  - **Review the event details:** Check CloudTrail logs for `eventSource: ec2.amazonaws.com` and `eventName: CreateNetworkAclEntry`, focusing on attributes like `sourceIpAddress`, `userName`, and `eventTime` for context on the actor involved.

  - **Analyze the changes made:** Identify the specific changes to the ACL by examining the `networkAclId` and the list of rules added. Compare this against existing documented configurations to ascertain whether the entries are appropriate or anomalous.

  - **Validate legitimate activities:** Confirm whether there was prior knowledge of planned ACL changes documented by the operations or security team, indicating a legitimate purpose for the added entries, which can be verified against change management records.

  - **Identify high-confidence malicious indicators:** Look for unusual patterns, such as ACL entries allowing access from unfamiliar IP ranges or at odd times, which may indicate malicious intent. Note any entries that enable internet access to sensitive resources.

  - **Check asset criticality:** Determine if the affected network ACL governs access to highly sensitive environments, such as production systems or databases, amplifying the severity of the incident.

  - **Examine broader network activity:** Review other relevant CloudTrail events before and after the `CreateNetworkAclEntry`, such as `AuthorizeSecurityGroupIngress`, to see if this change was part of a larger, potentially malicious activity sequence against the network setup.

  ---

  ### Prioritization

  The alert severity is low due to its potential for legitimate use, although it warrants attention as changes to ACLs can significantly impact security posture. The likelihood for malicious abuse exists, especially if changes were made by an unexpected user or without clear authorization. This behavior is sometimes weaponized in cloud environments, necessitating prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if AWS CloudTrail is misconfigured or events are not retained adequately. Legitimate user actions may trigger this alert, particularly during routine maintenance or access provisioning tasks. Monitoring ACL configuration changes alongside intrusion detection measures increases the reliability and context for this alert.

