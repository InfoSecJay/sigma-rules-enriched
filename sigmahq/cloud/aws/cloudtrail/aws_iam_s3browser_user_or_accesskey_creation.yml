logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
    - 'CreateUser'
    - 'CreateAccessKey'
    userAgent|contains: 'S3 Browser'
  condition: selection
falsepositives:
- Valid usage of S3 Browser for IAM User and/or AccessKey creation
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of AWS IAM users or access keys via the S3 Browser utility, specifically looking for entries in CloudTrail that originate from this user agent. The likely attacker objective is to establish unauthorized access to AWS resources, enabling further exploitation or persistence. This behavior aligns with the MITRE ATT&CK tactics of **Persistence (T1078.004)** and **Initial Access (T1078)**, as attackers may leverage compromised IAM credentials to gain foothold in the environment. The primary telemetry source for this detection is AWS CloudTrail logs, capturing event data related to IAM actions. If this behavior is malicious, it can lead to unauthorized cloud resource access and potential data breaches. However, this detection does NOT confirm that the created user or access key has been actively exploited or used in malicious activity.

  ### Investigation Steps

  - **Review CloudTrail events for IAM actions:** Search CloudTrail logs for Event Names `CreateUser` and `CreateAccessKey` with the source IP and user agent `S3 Browser`. Focus on Event IDs: `AWS::IAM::User` and `AWS::IAM::AccessKey`. Track the creation time and context of the entries.

  - **Correlate IAM actions with user context:** Check if the user initiating the action has a legitimate business reason for creating IAM users or access keys. Document the expected actions taken during that time to compare against the alert.

  - **Investigate creation origin and role:** Identify the AWS region and account that contains the created IAM user or access key. Validate if this account typically utilizes the S3 Browser tool. Investigate asset criticality if the activity occurs in a production environment.

  - **Confirm surrounding IAM activities:** Look for other IAM-related activities such as policy changes or additional user creations within a 24-hour window (Event ID: `CreateGroup`, `AttachUserPolicy`). This can indicate a campaign of malicious activity.

  - **Identify known malicious patterns:** Examine the AWS access keys created for unusual permissions or high-risk actions that deviate from normal user operations. Check for usage of those keys across CloudTrail logs for signs of potential data exfiltration or privilege escalation.

  ### Prioritization

  This alert is of **high severity** as it indicates potential unauthorized administrative access to AWS resources. The likelihood of malicious abuse is significant since the S3 Browser is typically not used for routine operations, making its presence indicative of possible compromise. This behavior is weaponized by adversaries to exploit AWS environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of relevant CloudTrail configurations, which might lead to incomplete data collection. Legitimate instances of S3 Browser use for creating IAM users could trigger false positives if not reviewed carefully. Additionally, this detection should be complemented by monitoring for abnormal API calls made with the newly created IAM entities to strengthen coverage against misuse.

