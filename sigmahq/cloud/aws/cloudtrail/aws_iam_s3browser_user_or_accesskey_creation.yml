logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
    - 'CreateUser'
    - 'CreateAccessKey'
    userAgent|contains: 'S3 Browser'
  condition: selection
falsepositives:
- Valid usage of S3 Browser for IAM User and/or AccessKey creation
level: high
note: |
  ### Technical Context

  This rule detects the creation of IAM users or access keys via the S3 Browser utility, indicating potential abuse of permissions. The likely attacker objective is to gain persistent access to AWS resources, enabling data theft or infrastructure manipulation. This behavior aligns with MITRE ATT&CK techniques for Privilege Escalation (T1078: Valid Accounts) and Initial Access (T1059.009: Command and Scripting Interpreter - Powershell).

  The primary telemetry source is AWS CloudTrail, specifically logs that capture IAM events. A successful detection indicates a potential security breach, as an unauthorized or suspicious account creation can facilitate lateral movement or data exfiltration within the AWS environment. Importantly, this detection does NOT confirm malicious intent on its own; it requires further investigation to determine the legitimacy of the S3 Browser usage.

  ### Investigation Steps

  - **Review CloudTrail logs for user activity**: Check for CloudTrail Event Name `CreateUser` and/or `CreateAccessKey` associated with the user agent containing 'S3 Browser'. Pay attention to the `userIdentity` field to determine who initiated the action and if it aligns with expected user roles.

  - **Analyze IAM permissions of the new user**: Investigate the IAM policies attached to the newly created user by correlating the `userIdentity` information with IAM Policy ARNs. Determine if they have excessive permissions, especially for sensitive actions such as `s3:*` or `iam:*`.

  - **Look for previous legitimate S3 Browser activity**: Validate expected use cases by identifying historical usages of "S3 Browser" under the same user. Legitimate activity should show consistent patterns with regular AWS operations rather than anomalous spikes or one-off actions.

  - **Cross-reference with security alerts**: Investigate for any interactive sessions that precede this event, such as login attempts or failed authentications. Attacks may exhibit failed login events (e.g., Event Name: `ConsoleLogin` or `GetSessionToken`) before successful user or access key creation.

  - **Check for associated logs on other services**: If the IAM user subsequently exhibits suspicious behavior (e.g., access to sensitive data stored in S3), validate logs from S3 buckets via the `s3:ListBucket`, `s3:GetObject` events in CloudTrail for unauthorized access post-creation.

  ### Prioritization

  This alert is high-severity due to the critical roles that IAM users and access keys play in AWS security. If misused, they can lead to severe data breaches or resource manipulation. Given the prevalence of abuse surrounding user creation in AWS environments, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where S3 Browser is legitimately used in the organization, potentially leading to false positives. Proper CloudTrail configuration is crucial for comprehensive visibility, and missing logs might obscure detection. Additionally, legitimate automation scripts that create users or access keys could trigger the alert, necessitating contextual inquiry. A related detection to consider is unusual IAM permissions modification (e.g., T1080: Abuse Elevation Control Mechanism) following such events.

