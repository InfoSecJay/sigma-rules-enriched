logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
    - 'CreateUser'
    - 'CreateAccessKey'
    userAgent|contains: 'S3 Browser'
  condition: selection
falsepositives:
- Valid usage of S3 Browser for IAM User and/or AccessKey creation
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the S3 Browser utility to create AWS IAM (Identity and Access Management) users or access keys. The S3 Browser is a third-party tool that enables users to interact with Amazon S3 storage, but it can also be misused by threat actors to compromise cloud environments. The likely objectives include unauthorized data access or manipulation by creating new IAM users with elevated privileges, which can lead to further exploitation within the AWS environment.

  The rule aligns with several MITRE ATT&CK tactics and techniques, notably **Persistence (T1078.004)**, where attackers maintain access by creating accounts, and **Execution (T1059.009)**, referring to the command-line interface aspect of using tools like S3 Browser. Other relevant tactics may include **Privilege Escalation** and **Defense Evasion**, as attackers can use created access keys to evade detection while performing malicious actions.

  The primary data source for this detection is AWS CloudTrail logs, which capture events related to API calls in the AWS environment. Monitoring these logs allows for the identification of suspicious activity such as the creation of users and access keys, especially those initiated by third-party tools.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Check AWS CloudTrail logs for `CreateUser` and `CreateAccessKey` events tied to the detected user agent 'S3 Browser'. Pay particular attention to the timestamps and context of these events.
  - **Analyze User Permissions:** Investigate the permissions associated with the newly created IAM users. Determine whether they possess elevated privileges or access to sensitive resources that could be exploited by an attacker.
  - **Check for Anomalous IP Addresses:** Look for any unusual source IP addresses associated with the API calls. Validate whether these requests originate from known and secure locations, or if they appear to be coming from potentially compromised or foreign IP ranges.
  - **Audit CloudTrail Configuration:** Ensure that your AWS CloudTrail is correctly configured to log all relevant events. Validate that log retention settings allow for adequate historical review and that logging is enabled for all regions.

  ### Prioritization
  This alert has been marked as high severity due to the high potential impact of unauthorized access to IAM resources. The creation of users or access keys can lead to significant data exfiltration or manipulation, making it critical for investigation in an enterprise environment.

  ### Blind Spots and Assumptions
  One potential blind spot for this detection is the assumption that all legitimate uses of S3 Browser are well-understood; therefore, false positives could occur if legitimate admins use the tool for compliant purposes. Additionally, the detection relies heavily on the presence of detailed CloudTrail logs; if logging is misconfigured, gaps could exist in detection coverage. Ensuring CloudTrail is comprehensive and regularly audited is vital for this rule’s effectiveness.

