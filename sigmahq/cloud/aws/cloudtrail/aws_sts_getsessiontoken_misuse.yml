note: |
  ### Technical Context

  This Sigma rule detects unauthorized or unusual usage of the AWS STS GetSessionToken API call, which can be exploited by attackers to obtain temporary security credentials. The likely attacker objective is to facilitate lateral movement or escalate privileges within an AWS environment by acquiring tokens that allow access to additional resources. This behavior corresponds with the MITRE ATT&CK tactics for Lateral Movement (T1075) and Privilege Escalation (T1548).

  The primary telemetry source is AWS CloudTrail logs, specifically monitoring the "GetSessionToken" events from the STS service. If malicious, this could lead to unauthorized access to sensitive resources or accounts within the cloud infrastructure. It’s important to note that this detection alone does not confirm malicious intent; the context of the user and environment must be examined.

  ### Investigation Steps

  - **Validate user identity context:** Check the user identity against IAM policies using AWS IAM Console or API. Confirm if the user account has legitimate reasons to call GetSessionToken. Unfamiliar users or misconfigured IAM roles may indicate potential compromise.

  - **Review CloudTrail logs for event details:** Filter CloudTrail logs for "eventSource" equal to "sts.amazonaws.com" and "eventName" equal to "GetSessionToken." Check the "userAgent" field to look for abnormal patterns or known malicious software agents.

  - **Correlate with other account activity:** Examine CloudTrail “ConsoleLogin” events or API activity associated with the same user identity within a relevant time frame to detect suspicious patterns. Legitimate admins may invoke GetSessionToken sporadically; a sudden spike can indicate malicious activity.

  - **Check IP address and geographic location:** Analyze the source IP addresses making the STS calls; compare them against known locations for your organization. An alert for login attempts from unfamiliar geographies should raise concern.

  - **Assess IAM role permissions:** Review the IAM roles and policies that correspond with the user invoking GetSessionToken. Weak or overly permissive roles could increase the risk of privilege escalation.

  - **Investigate for potential credential theft artifacts:** Look for other indicators of compromise in conjunction with this event, such as unexpected IAM policy changes in CloudTrail logs or indications of credentials being leaked (e.g., exposed in public repositories).

  ### Prioritization

  The alert severity is low due to the potential for legitimate users such as admins to invoke GetSessionToken routinely, but it can escalate if done by unauthorized users. The likelihood of malicious abuse increases if the user identity appears anomalous or if associated with other suspicious behaviors.

  ### Blind Spots and Assumptions

  This alert may miss legitimate administrative actions, as system or network administrators may invoke GetSessionToken without malicious intent. Reliable detection requires comprehensive CloudTrail logging enabled, with sufficient retention policies in place. Additionally, the behavior can be confused with legitimate DevOps activities if developers are granted wide permissions. Related detections include unusual IAM policy changes or escalated privilege requests, which can enhance context in identifying potential misuse.

