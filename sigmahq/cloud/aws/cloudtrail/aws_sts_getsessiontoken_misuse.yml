level: low
note: |
  ### Technical Context
  The rule identifies suspicious usage of the AWS Security Token Service (STS) `GetSessionToken` API call. This API call allows users to request temporary security credentials, which can be exploited by attackers to gain unauthorized access to resources or escalate privileges within an AWS environment. Attackers may use this tactic to create session tokens for lateral movement within a compromised account or to impersonate other users, thus evading detection.

  The primary tactics involved here are "Lateral Movement" and "Privilege Escalation," specifically related to the MITRE ATT&CK techniques T1548 (Abuse Elevation Control Mechanism) and T1550 (Use Alternate Authentication Material). Unauthorized or unexpected calls to the `GetSessionToken` endpoint should be regarded as potential indicators of account compromise, especially if they originate from unusual user identities or geographic locations.

  Relevant primary data sources for this detection include AWS CloudTrail logs, which record API calls made within an AWS account. Monitoring these logs will help identify any irregularities in the use of temporary security credentials.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine the AWS CloudTrail logs for unusual entries regarding the `GetSessionToken` API call. Pay special attention to the user identity, user agent, and regions associated with the API requests.

  - **Identify User Context**: Determine the legitimacy of the IAM user making the request. Cross-reference the user identity with operational roles and expected behavior patterns to identify any deviations from normal activity.

  - **Analyze Access Patterns**: Look for subsequent API calls made using the temporary credentials obtained from `GetSessionToken`. Analyze these calls for any lateral movement or privilege escalation attempts, such as accessing sensitive resources or performing administrative actions.

  - **Conduct Behavioral Analysis**: Investigate the context of the requests by correlating them with behavioral baselines. Identify any anomalous behavior that could indicate malicious intent, such as accessing resources outside the user's standard operation scope.

  ### Prioritization
  The alert has been categorized as low severity; however, it warrants further investigation, especially in environments where `GetSessionToken` usage is infrequent. While the activity can sometimes be legitimate, unexplained or unexpected instances may indicate potential compromise, necessitating a cautious approach.

  ### Blind Spots and Assumptions
  This detection rule primarily assumes that `GetSessionToken` calls from unusual sources or identities signify compromise, which might not always hold true. There may be gaps in detection if logging for AWS CloudTrail is improperly configured or if there are extensions in place that obfuscate event details. It also assumes that analysts are familiar with typical usage patterns for accounts, which may not always align across varied organizational environments. Ensuring comprehensive CloudTrail logging is essential for the rule to function effectively.

