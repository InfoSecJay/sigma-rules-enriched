  ---

  ### Technical Context

  This Sigma rule detects the suspicious invocation of the `GetSessionToken` API call within AWS, which allows for the generation of temporary security credentials. Attackers may exploit this functionality to acquire session tokens that facilitate lateral movement within the environment or escalate privileges by assuming roles with broader access than their current IAM permissions. Relevant MITRE ATT&CK tactics include Lateral Movement (TA0008), Privilege Escalation (TA0004), and Defense Evasion (TA0005), specifically techniques T1548 (Abuse Elevation Control Mechanism) and T1550 (Use Alternate Authentication Material).

  The primary telemetry sources for this detection are CloudTrail logs. Specifically, the log type related to AWS API calls must capture details such as user identity, event source, and event name associated with the `GetSessionToken` call. If malicious, this behavior could lead to unauthorized access to sensitive resources. It's important to note that this detection does NOT confirm malicious behavior on its own, as the `GetSessionToken` API can also be legitimately invoked by authorized administrators or services.

  ---

  ### Investigation Steps

  - **Analyze user identity and source:** Review the `userIdentity` field from CloudTrail logs (Event Name: `GetSessionToken`). Legitimate administrative users typically have elevated permissions and frequently engage in such activities. In contrast, unfamiliar IAM users or internal accounts should raise flags.

  - **Verify the context of token requests:** Check the `userAgent` and `sourceIpAddress` fields associated with the API call. Activity from non-standard IP ranges or unusual user agents compared to documented organizational behavior should prompt deeper analysis.

  - **Assess IAM Role permissions:** Cross-reference the role assumed via this token (if applicable) against established access policies. If the role grants access beyond standard verification levels for the user, this may indicate a potential compromise.

  - **Identify session token usage:** Examine subsequent CloudTrail logs following the `GetSessionToken` call to detect if the token was used to perform additional actions (e.g., EC2 `RunInstances`, S3 `PutObject`) beyond the expected administrative behavior. Artifacts from unauthorized actions could indicate a compromised environment.

  - **Document expected behaviors:** Compare the detected activity against expected patterns for authorized tasks within your environment. For instance, scheduled tasks executed by recognized automation tools should not invoke `GetSessionToken` unless explicitly required for AWS resource management.

  ---

  ### Prioritization

  The alert severity is low due to its potential legitimate uses, primarily by system administrators. However, the likelihood of abuse exists, particularly if the request originates from unrecognized users or sources. This behavior can be exploited by attackers as part of a broader strategy for lateral movement and privilege escalation, making investigation essential.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate broad usage of `GetSessionToken` in combination with IAM user permissions. Ensure that CloudTrail is enabled for all regions to capture relevant events reliably. Activities such as routine administrative token requests by legitimate staff can trigger this alert, necessitating careful context evaluation. Companion detections, such as monitoring AWS IAM role changes (Event Name: `UpdateAssumeRolePolicy`), can enhance security oversight and mitigate blind spots around privilege escalation risks.

