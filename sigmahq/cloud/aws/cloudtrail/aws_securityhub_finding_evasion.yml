note: |
  ### Technical Context

  This rule detects modifications to findings within AWS SecurityHub, specifically targeting actions like `BatchUpdateFindings`, `DeleteInsight`, `UpdateFindings`, and `UpdateInsight`. The likely attacker objective is to obfuscate or manipulate security findings, which may indicate attempts to evade detection of malicious activities or alter the perceived security posture of AWS resources. This activity aligns with the MITRE ATT&CK technique for defense evasion (T1562).

  Primary telemetry sources include AWS CloudTrail logs, specifically focusing on event types associated with SecurityHub interactions. If these actions are malicious, they could facilitate attackers in hiding their tracks or altering critical security information, leading to an increased risk of undetected threats. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may invoke similar events.

  ### Investigation Steps

  - **Examine CloudTrail logs for relevant events**: Review AWS CloudTrail logs for events with `eventSource` set to `securityhub.amazonaws.com` and `eventName` parameters including `BatchUpdateFindings`, `DeleteInsight`, `UpdateFindings`, and `UpdateInsight`. Look for timestamps surrounding the alert to understand the context of the modification.

  - **Identify user identity and role**: Correlate the triggering events with the `userIdentity` field in the CloudTrail log entries. Determine if the user is a legitimate administrator or if there is an unknown or unauthorized user making the changes.

  - **Assess the timing and scope of updates**: Check `resources` and `requestParameters` fields in the logs for the specific findings being updated or deleted. Look for patterns such as large number of findings being modified at once, which is less typical for legitimate activity.

  - **Compare with known administrative actions**: Identify if the detected actions can be attributed to normal operational behaviors by reviewing the history of findings management in the SecurityHub. Compare with documented administrative activities, particularly during maintenance windows or routine audits.

  - **Look for typical manipulative behavior**: Watch for changes that downgrade findings severity or remove critical alerts. If multiple critical findings are suddenly updated to a "resolved" state, this could indicate malicious intent.

  - **Check for related detections**: Validate if any other alerts have been triggered in correlation with the SecurityHub modifications, such as suspicious API calls to AWS resources or focus on the broader context of the changes seen, which may point to an overarching threat campaign.

  ### Prioritization

  The alert severity is high due to the potential impact on the integrity of the organization's security posture. If this behavior is exploited by an adversary, it significantly increases the risk of undetected breaches. This modification of findings is a tactic frequently weaponized to obscure malicious activities, warranting immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use legitimate administrative roles to enact these changes while compromising the integrity of the SecurityHub findings. Reliable detection requires comprehensive CloudTrail logging enabled for all AWS regions. Benign activities that may trigger this alert could stem from routine administrative reviews or updates associated with maintaining compliance. A related detection to consider is monitoring for unusual patterns in CloudTrail logs, particularly focusing on activities across different AWS services that may further indicate misconfiguration or attempts to manipulate security settings.

