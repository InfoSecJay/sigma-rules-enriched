note: |
  ### Technical Context

  This rule detects modifications to findings within AWS SecurityHub, specifically actions such as updating or deleting findings and insights. The likely attacker objective is to cover their tracks by manipulating detection findings, potentially obscuring their malicious activities or erasing indicators of compromise. The relevant MITRE ATT&CK tactic is Defense Evasion (T1085) with a focus on the technique of Indicator Removal on Host (T1562.001). The primary telemetry sources are AWS CloudTrail logs, particularly events related to SecurityHub. If malicious, the impact could include sustained access to the environment without detection or the ability to escalate privileges undetected. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrator actions can also trigger these alerts.

  ### Investigation Steps

  - **Verify event source and action type:** Review AWS CloudTrail logs for event sources with `eventSource: securityhub.amazonaws.com` and actions of interest, such as `BatchUpdateFindings`, `DeleteInsight`, `UpdateFindings`, or `UpdateInsight` (EventName). Pay attention to the user or role associated with these actions to establish context.

  - **Identify the user role:** Check the identity of the user or role executing the finding modifications. Legitimate actions might come from known administrative roles, such as `SecurityAdmin`, while unexpected roles or users not aligned with typical responsibilities (e.g., an application user making changes) should raise suspicion.

  - **Cross-check timing and context:** Look for patterns in logging that may indicate attempts to hide a prior suspicious activity. Check for the timing of these modifications against other potentially malicious actions, such as unauthorized API calls made to other AWS services (like EC2 or IAM).

  - **Assess the CloudTrail logs for related findings:** In AWS CloudTrail, search for prior findings shortly before modifications were made for evidence of alerts that were original context for the created findings. This can help differentiate between routine maintenance and potential malicious intent.

  - **Look for indications of evasion:** Note if there are patterns where multiple finding updates or deletions occur in quick succession. A high confidence malicious indicator could be a user performing `BatchUpdateFindings` immediately after unusual actions or cloud misconfigurations were detected.

  ### Prioritization

  The alert is considered high severity due to the potential impact of the affected system, as findings in SecurityHub are critical for maintaining visibility and governance within AWS environments. The likelihood of malicious abuse is moderate to high, as adversaries commonly seek to manipulate detection systems to avoid detection of ongoing activities, particularly in cloud environments.

  ### Blind Spots and Assumptions

  The detection does not account for legitimate actions from internal systems or administrators, which may lead to false positives. There can be lapses in coverage if CloudTrail logging is not fully enabled or if certain actions are not captured due to log retention policies. Legitimate activities could include routine maintenance by security teams or responses to identified vulnerabilities. Companion detections that bolster coverage include monitoring for unauthorized changes to IAM policies or unusual patterns in other AWS service logs.

