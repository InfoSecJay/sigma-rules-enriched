note: |
  ### Technical Context

  This Sigma rule detects the modification of an AWS EC2 snapshot's permissions through the `ModifySnapshotAttribute` API call, which allows an attacker to share a snapshot with another AWS account. The likely attacker objective is to exfiltrate sensitive data stored in the snapshot, potentially for malicious purposes such as data theft or setting up unauthorized backups. This behavior aligns with the MITRE ATT&CK tactic of Exfiltration (TA0010) and technique T1537 (Exfiltration Over Cloud Storage).

  The primary telemetry source is AWS CloudTrail logs, specifically tracking the `ModifySnapshotAttribute` event. If malicious, this activity could lead to unauthorized access to sensitive data backups. Importantly, this detection does NOT confirm malicious intent on its own; legitimate changes by authorized users can trigger the same alert.

  ### Investigation Steps

  - **Check recent CloudTrail events:** Review AWS CloudTrail logs for `EventName: ModifySnapshotAttribute` (Event ID for AWS CloudTrail logs) and correlate the source IP (field: `sourceIPAddress`) to determine if it is a known internal address or an external source.

  - **Validate user permissions:** Verify the IAM role or user who executed the `ModifySnapshotAttribute` call. Review their permissions for snapshot modification (fields: `userIdentity`, `eventSource`, `eventTime`). Legitimate requests will likely come from users with specific roles assigned for backup management.

  - **Examine snapshot sharing details:** Look for `requestParameters` in the event log to check if the snapshot was shared with another AWS account. An unusual account ID or a pattern of multiple simultaneous modifications can indicate malicious intent.

  - **Identify high-risk snapshots:** Determine the snapshot identifiers involved (field: `requestParameters.snapshotId`). Assess the snapshot content and its criticality; any modifications to snapshots containing sensitive data should be prioritized for further investigation.

  - **Assess recent permissions history:** Consult AWS CloudTrail for previous `ModifySnapshotAttribute` events (field: `eventTime`) applied to the same snapshot to identify any unusual patterns or changes in permissions within a short timeframe.

  ### Prioritization

  This alert is medium severity due to the potential impact of exposing sensitive data stored in snapshots. The likelihood of malicious abuse is moderate, particularly in environments with multiple users interacting with AWS resources. While the alert can originate from legitimate activity, it is crucial to investigate any modifications that deviate from established operational norms.

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete CloudTrail logging; ensure all region and service data is being captured appropriately. Evasion techniques might involve using compromised legitimate accounts to modify snapshot permissions without raising suspicion. Additionally, legitimate maintenance activities by DevOps teams could inadvertently trigger this alert. Related detections include unauthorized AWS IAM policy modifications, providing a more comprehensive view of potential exfiltration risks.

