note: |
  ### Technical Context
  This detection rule identifies instances where an AWS EC2 snapshot's permissions are modified to allow access from a different AWS account. This behavior could indicate potential exfiltration of sensitive data, as an attacker may attempt to gain unauthorized access to these snapshots containing critical information.

  In a threat scenario, a malicious actor could exploit misconfigurations or compromise credentials to manipulate snapshot permissions, thereby exfiltrating sensitive data from an organization's AWS environment. The objective typically revolves around data theft, which aligns with the MITRE ATT&CK techniques for exfiltration, specifically T1537: “Exploitation of Cloud Services.”

  The relevant data sources for this detection include AWS CloudTrail logs, which record activity related to AWS services, including modifications to resource properties like EC2 snapshots.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Examine the CloudTrail logs for the `ModifySnapshotAttribute` event. Note the `sourceAccount` and `destinationAccount` parameters to understand which accounts are involved.

  - **Correlate with IAM Permissions:** Investigate the IAM policies associated with the user or service that performed the modification. Look for unusual permissions or roles that grant elevated access to modify snapshot attributes.

  - **Analyze Snapshot Usage:** Identify the snapshots that had their permissions modified and assess their content and sensitivity. Determine if these snapshots contain proprietary or sensitive data that could be targeted by an attacker.

  - **Monitor for Subsequent Access:** Track any subsequent access logs to the modified snapshots. The presence of access from unrecognized accounts could indicate a potential data breach or an exfiltration attempt.

  ### Prioritization
  The severity of this alert is medium due to the potential risk of unauthorized data exposure and exfiltration, particularly if sensitive or critical data is stored in the snapshots. Given the widespread use of cloud services, the likelihood of encountering this type of attack is moderately high, especially if permissions are not properly managed.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative activities that involve modifying snapshot permissions, which could lead to false positives. Additionally, the detection logic assumes that CloudTrail logging is enabled and properly configured for all regions and accounts in the AWS environment. If logs are not being recorded or retained, the ability to detect these modifications will be compromised. Analysts must ensure that CloudTrail is set up to log all necessary events related to EC2 snapshots.

