title: Ingress/Egress Security Group Modification
id: 6fb77778-040f-4015-9440-572aa9b6b580
status: test
description: |
  Detects when an account makes changes to the ingress or egress rules of a security group.
  This can indicate that an attacker is attempting to open up new attack vectors in the account, that they are trying to exfiltrate data over the network, or that they are trying to allow machines in that VPC/Subnet to contact a C&C server.
references:
- https://www.gorillastack.com/blog/real-time-events/important-aws-cloudtrail-security-events-tracking/
author: jamesc-grafana
date: 2024-07-11
tags:
- attack.initial-access
- attack.t1190
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2.amazonaws.com'
    eventName:
    - 'AuthorizeSecurityGroupEgress'
    - 'AuthorizeSecurityGroupIngress'
    - 'RevokeSecurityGroupEgress'
    - 'RevokeSecurityGroupIngress'
  condition: selection
falsepositives:
- New VPCs and Subnets being setup requiring a different security profile to those
  already defined
- A single port being opened for a new service that is known to be deploying
- Administrators closing unused ports to reduce the attack surface
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to the ingress and egress rules of an AWS security group via CloudTrail logs. Such modifications can indicate malicious activity where an attacker attempts to manipulate network access controls to either expose internal assets or exfiltrate data. This behavior is critical as it can represent a pivot point for further lateral movement within the network or establish communication with external command and control (C&C) servers.

  The likely attacker objectives in this scenario include broadening the attack surface by opening necessary ports to facilitate incoming connections or preventing outbound traffic that would otherwise alert the organization to ongoing data exfiltration attempts. Attackers utilizing techniques such as "Network Accessibility" (T1190) may leverage valid user credentials to deploy disguised modifications.

  Relevant MITRE ATT&CK tactics include:
  - **Initial Access** (TA0001): Modifying security group rules can grant unauthorized access to a network.
  - **Command and Control** (TA0011): Opening new ingress rules may facilitate communication with external entities.

  Primary data sources to investigate include AWS CloudTrail logs, particularly for event names like `AuthorizeSecurityGroupEgress`, `AuthorizeSecurityGroupIngress`, `RevokeSecurityGroupEgress`, and `RevokeSecurityGroupIngress`.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Inspect AWS CloudTrail logs for `AuthorizeSecurityGroupEgress` and `AuthorizeSecurityGroupIngress` events. Focus on timestamps, user identities, and source IP addresses to establish context around the changes.
  - **Examine Security Group Configurations:** Analyze the current security group rules to identify any unexpected inbound or outbound permissions that could signify unauthorized access paths.
  - **Identify User Activity Patterns:** Cross-reference the modifying accounts with other activity logs to identify unusual access patterns or actions that may correlate with the security group rule changes.
  - **Evaluate User Permissions:** Assess the permissions associated with the user accounts initiating the changes. Ensure they align with role-based access control policies and are appropriate for their responsibilities.

  ### Prioritization
  This alert is rated as medium severity due to the potential for significant impact on the organization’s infrastructure and data security. Unauthorized changes to ingress and egress rules could lead to data breaches or system compromises if not addressed promptly.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging for CloudTrail events is not correctly configured or if there are legitimate use cases for security group modifications that are not thoroughly understood by the monitoring team. The detection logic assumes that any modification of rules is potentially malicious without considering contextual authorizations that may exist for specific roles within the organization. Required logs for this alert to function effectively include comprehensive CloudTrail logs to capture all relevant security group modification events.

