title: Ingress/Egress Security Group Modification
id: 6fb77778-040f-4015-9440-572aa9b6b580
status: test
description: |
  Detects when an account makes changes to the ingress or egress rules of a security group.
  This can indicate that an attacker is attempting to open up new attack vectors in the account, that they are trying to exfiltrate data over the network, or that they are trying to allow machines in that VPC/Subnet to contact a C&C server.
references:
- https://www.gorillastack.com/blog/real-time-events/important-aws-cloudtrail-security-events-tracking/
author: jamesc-grafana
date: 2024-07-11
tags:
- attack.initial-access
- attack.t1190
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2.amazonaws.com'
    eventName:
    - 'AuthorizeSecurityGroupEgress'
    - 'AuthorizeSecurityGroupIngress'
    - 'RevokeSecurityGroupEgress'
    - 'RevokeSecurityGroupIngress'
  condition: selection
falsepositives:
- New VPCs and Subnets being setup requiring a different security profile to those
  already defined
- A single port being opened for a new service that is known to be deploying
- Administrators closing unused ports to reduce the attack surface
level: medium
note: |
  ---

  ### Technical Context

  This rule detects modifications to ingress and egress rules within AWS Security Groups using CloudTrail logs. Typically, an attacker aims to create new pathways for data exfiltration or command and control (C&C) communication by leveraging these permissions. This activity aligns with the MITRE ATT&CK framework tactic of Initial Access and technique T1190 (Exploit Public-Facing Application). The primary telemetry source is AWS CloudTrail, specifically looking for events related to security group configuration changes such as `AuthorizeSecurityGroupEgress` and `AuthorizeSecurityGroupIngress`. If malicious, this activity can significantly impact data confidentiality and network integrity. Notably, this detection does NOT confirm malicious intent on its own; it requires further context and corroboration with additional signs of compromise.

  ---

  ### Investigation Steps

  - **Identify related AWS CloudTrail events:** Check for Event Names `AuthorizeSecurityGroupEgress`, `AuthorizeSecurityGroupIngress`, `RevokeSecurityGroupEgress`, or `RevokeSecurityGroupIngress` in CloudTrail logs (Log Type: Management Events) to confirm security group rule changes.

  - **Assess the source of change:** Review the `userIdentity` field in the identified events to determine if the actions were performed by a known administrator or an anomalous IAM user. Malicious indicators include changes made by users without known access or those who were previously inactive.

  - **Analyze changed rules:** Examine the `requestParameters` JSON object in CloudTrail logs for added rules, paying attention to CIDR blocks and port numbers. Opening unexpected ports (e.g., TCP port 443 to an external IP) could indicate malicious intent.

  - **Review legitimate changes:** Cross-reference with operational baseline documentation to validate expected changes, such as opening specific ports for known applications or services. Routine maintenance should not lead to extensive ingress or egress modifications.

  - **Investigate related activity patterns:** Look for simultaneous IAM policy changes or anomalous API calls that could point to broader compromise (e.g., unauthorized usage of other AWS resources).

  - **Validate external connections:** Confirm if any new egress rules provide direct outbound access to external IPs. Use VPC flow logs to review if traffic is flowing to suspicious external addresses that correlate with the changes.

  ---

  ### Prioritization

  This alert warrants medium severity due to the potential impact on network security and system integrity. The likelihood of malicious use is significant, as attackers often manipulate security group rules to facilitate data exfiltration or establish access to compromised systems. Such behavior is regularly exploited in the wild.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by a lack of detailed IAM logging or insufficient CloudTrail configuration (such as missing management events). Legitimate activities, such as establishing new environments or administrative updates, may occasionally trigger this alert. A companion detection rule evaluating high-volume traffic to newly added egress IPs would enhance coverage of potential data exfiltration attempts.

