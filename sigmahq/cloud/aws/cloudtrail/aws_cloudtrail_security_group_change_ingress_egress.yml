title: Ingress/Egress Security Group Modification
id: 6fb77778-040f-4015-9440-572aa9b6b580
status: test
description: |
  Detects when an account makes changes to the ingress or egress rules of a security group.
  This can indicate that an attacker is attempting to open up new attack vectors in the account, that they are trying to exfiltrate data over the network, or that they are trying to allow machines in that VPC/Subnet to contact a C&C server.
references:
- https://www.gorillastack.com/blog/real-time-events/important-aws-cloudtrail-security-events-tracking/
author: jamesc-grafana
date: 2024-07-11
tags:
- attack.initial-access
- attack.t1190
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ec2.amazonaws.com'
    eventName:
    - 'AuthorizeSecurityGroupEgress'
    - 'AuthorizeSecurityGroupIngress'
    - 'RevokeSecurityGroupEgress'
    - 'RevokeSecurityGroupIngress'
  condition: selection
falsepositives:
- New VPCs and Subnets being setup requiring a different security profile to 
  those already defined
- A single port being opened for a new service that is known to be deploying
- Administrators closing unused ports to reduce the attack surface
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the ingress and egress rules of an AWS security group, specifically actions that authorize or revoke permissions. Such behavior is often associated with an attacker’s objective to create new attack vectors, facilitate data exfiltration, or establish communication with command-and-control (C&C) servers. The relevant MITRE ATT&CK tactic is **Initial Access** (T1190).

  The primary telemetry source is AWS CloudTrail, which logs API calls made to the AWS account. The specific event names of interest include ‘AuthorizeSecurityGroupEgress,’ ‘AuthorizeSecurityGroupIngress,’ ‘RevokeSecurityGroupEgress,’ and ‘RevokeSecurityGroupIngress.’ If this behavior is malicious, it could allow unauthorized external access to sensitive resources in a cloud environment. It is critical to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities can also trigger similar events.

  ### Investigation Steps

  - **Review CloudTrail logs for specific events:** Examine CloudTrail logs for `eventName` fields containing ‘AuthorizeSecurityGroupEgress’ or ‘AuthorizeSecurityGroupIngress’. Look for modifications made in a short time frame or from unusual user accounts.

  - **Identify the user or role triggering the change:** Determine the `userIdentity` field associated with the event. If changes were made by a non-administrative user or an automated process without clear justification, this is a high-confidence indicator of potential compromise.

  - **Check for patterns of changes:** Analyze the `eventTime` field for multiple changes in quick succession or within unusual hours. Sequential modifications to security groups are indicative of an adversary trying to establish persistence or exfiltrate data.

  - **Verify against known legitimate activities:** Look for temporary changes made by known applications or legitimate administrative access. Review the activities of teams setting up new VPCs or migrating services, as these may require security modifications.

  - **Assess affected security groups and related resources:** Investigate the security groups that were modified. Cross-reference `resourceId` fields with critical resources (e.g., EC2 instances handling sensitive data) for risks associated with exposure.

  ### Prioritization

  The severity of this alert is medium due to its potential impact on network security. While unauthorized changes can significantly increase risks, legitimate administrative actions may also trigger the alert during routine updates or service deployments. However, the modifications are frequently weaponized by adversaries, especially in the context of lateral movement and data exfiltration.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured CloudTrail log settings or inadequate retention policies. Legitimate activities such as setting up new services or decommissioning old ones may trigger the alert. It is also important to note that effective monitoring of AWS IAM roles or user permissions can strengthen coverage, as misconfigured policies may allow unauthorized modifications.

