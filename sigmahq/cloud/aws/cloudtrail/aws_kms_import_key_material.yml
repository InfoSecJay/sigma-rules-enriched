note: |
  ### Technical Context

  This detection rule identifies the import or deletion of key material in AWS KMS (Key Management Service). These actions are typically associated with ransomware attacks or data manipulation, where adversaries may aim to disrupt or encrypt sensitive data. The relevant MITRE ATT&CK tactics include “Impact” (TA0040) and the techniques “Data Encrypted for Impact” (T1486) and “Resource Development” (T1608.003).

  The primary telemetry sources are CloudTrail logs that capture API calls made to AWS services, specifically focusing on the events `ImportKeyMaterial` and `DeleteImportedKeyMaterial`. If these events are triggered maliciously, they could imply an attempt to compromise data confidentiality or availability. Notably, this detection does NOT confirm that malicious intent is present; it merely signals unusual activity that requires further investigation.

  ### Investigation Steps

  - **Review CloudTrail logs for specific events:** Validate the presence of CloudTrail logs that include `eventSource: 'kms.amazonaws.com'` and check for `eventName: 'ImportKeyMaterial'` or `DeleteImportedKeyMaterial`. Note the timestamps, user identity, and source IP to assess the context of the action.

  - **Correlate with IAM policies:** Inspect the IAM role or user associated with the detected KMS activities. Check for permissions related to key management. If the user or role does not have legitimate business reasons for importing or deleting key material, this might indicate a potential security concern.

  - **Check for alternate indicators of compromise:** Look for high-confidence indicators such as anomalies in access patterns or API usage within the same time frame. For example, inspect for any unusual spikes in data access (i.e., S3 bucket read/write operations) correlated with the key material actions.

  - **Identify legitimate usage:** Consider whether the organization has documented use cases for importing key material, such as compliance requirements related to key management. Review approved processes to determine if this activity aligns with expected behavior.

  - **Investigate asset criticality:** Assess the impact on any affected systems or data. If the key material belongs to critical resources (e.g., production databases, sensitive data stores), prioritize investigation. Conversely, if it's tied to development or testing environments, context may lessen urgency.

  ### Prioritization

  Given the potential impact of unauthorized key material management on confidentiality and availability, alerts stemming from this detection should be treated with high severity. The likelihood of malicious use is significant, as this behavior is not typical for legitimate operations and may indicate attempts to facilitate ransomware attacks or disrupt services. The infrequency of such actions enhances their importance.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion by adversaries utilizing tools or methods to mask their actions, such as spoofing API calls or using compromised legitimate keys. Reliable detection hinges on accurate CloudTrail configurations; missing logs may lead to incomplete visibility. Legitimate activities that may trigger this alert include rare compliance-driven imports in hybrid cloud environments. Companion detections could include monitoring other CloudTrail events related to AWS KMS, such as `CreateKey` or `ScheduleKeyDeletion`, to ensure comprehensive oversight of key management activities.

