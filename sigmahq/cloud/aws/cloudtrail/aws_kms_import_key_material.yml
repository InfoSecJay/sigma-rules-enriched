note: |
  ### Technical Context
  This rule detects the importing or deletion of key material in AWS Key Management Service (KMS). Such activities are not only uncommon but can also be indicative of malicious behavior, particularly in the context of ransomware attacks where attackers may attempt to control encryption keys to deny access to data. The primary objectives of these threats include disrupting business operations and demanding ransom for key recovery.

  The relevant MITRE ATT&CK tactics for this detection include "Impact" (TA0040) and "Resource Development" (TA0042), with specific techniques such as "Data Encrypted for Impact" (T1486) and "Development of Resources for Targeting" (T1608.003). Monitoring these events can help identify potential attempts to manipulate data encryption systems, a tactic often leveraged by attackers to instigate high-impact incidents.

  The primary data sources for this detection will be AWS CloudTrail logs that capture API calls made to AWS services, specifically focusing on events related to AWS KMS.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine AWS CloudTrail logs for entries related to `ImportKeyMaterial` and `DeleteImportedKeyMaterial`, noting the IAM user or role executing the actions and the timestamps of these events.

  - **Cross-Reference Context**: Check contextual information about the identified IAM user/role, including their permissions and recent activity, to assess whether the actions align with expected administrative tasks or indicate potential compromise.

  - **Assess Environment Changes**: Investigate the broader AWS environment for any recent changes, including the setup of KMS key policies, IAM changes, or other cloud infrastructure modifications that may correlate with the suspicious activities.

  - **Engage Stakeholders**: Notify relevant teams, such as cloud security or incident response teams, about the findings for potential follow-up actions, which may include further investigation or remediation steps.

  ### Prioritization
  The alert is considered high severity due to its connection to potential ransomware attack scenarios, which can lead to significant operational disruption and financial loss. The likelihood of legitimate use is low, as the importation or deletion of key material is rare in enterprise environments.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for less common AWS actions or API calls that fall outside the specific events mentioned. The detection logic assumes that all relevant activities are logged by AWS CloudTrail, and any misconfigurations could lead to a lack of visibility. Organizations must ensure that logging for KMS actions is enabled and that IAM roles have appropriate permissions to detect such operations effectively.

