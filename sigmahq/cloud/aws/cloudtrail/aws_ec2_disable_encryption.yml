note: |
  ### Technical Context

  This rule detects the disabling of default encryption for Amazon Elastic Block Store (EBS) volumes via a CloudTrail event. The likely attacker objective is to compromise the confidentiality and integrity of sensitive data stored on EBS volumes by allowing unencrypted volumes to be created. This behavior is aligned with the MITRE ATT&CK technique "Data Encrypted for Impact" (T1486) and the "Data Manipulation" tactic. The primary telemetry source for detection is AWS CloudTrail, specifically monitoring for the `DisableEbsEncryptionByDefault` event. If malicious, this action can lead to unencrypted data exposure, potentially violating compliance and security policies. This detection does NOT confirm malicious intent without additional context, as legitimate administrators may disable encryption for specific valid reasons.

  ### Investigation Steps

  - **Check recent changes to EBS settings:** Review CloudTrail logs for the `DisableEbsEncryptionByDefault` event (Event Name) to assess the timestamp, source IP, and user identity involved in the action. Look for unusual activity around the same time.

  - **Identify user roles executing the command:** Verify whether the initiating IAM role or user has elevated permissions associated with modifying security settings. Use CloudTrail logs to correlate with IAM activity, focusing on principal ID and role details.

  - **Analyze EBS volume configurations:** Confirm the encryption status of existing EBS volumes by utilizing the AWS Management Console or CLI with `describe-volumes` API call. Check if any new builds or modifications involved unencrypted storage solutions.

  - **Review historical activity of the initiating user:** Cross-reference the user's historical actions in CloudTrail to identify any previous concerns or irregularities, especially around data management or sensitive resource handling.

  - **Investigate decentralized policy or procedures changes:** Confirm if there was an organizational procedure, such as a scheduled maintenance event or legitimate policy update communicated in advance that justified this change.

  ### Prioritization

  This alert has a medium severity level due to the potential risk of sensitive data exposure and the likelihood that disabling encryption could be weaponized by an insider or sophisticated external adversary. The impact is elevated if the affected account is associated with production data storage in a critical system environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into all IAM roles, particularly if overly permissive policies exist. Additionally, legitimate administrator actions or maintenance activities could trigger this alert without malicious intent. A companion detection for changes to IAM policies or heightened user permissions would enhance overall coverage.

