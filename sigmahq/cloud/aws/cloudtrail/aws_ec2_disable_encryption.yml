note: |
  ### Technical Context
  This detection rule identifies instances where the default encryption for Amazon Elastic Block Store (EBS) volumes in an AWS region has been disabled. Default encryption ensures that all newly created EBS volumes in a region are automatically encrypted, thus protecting sensitive data at rest. When an attacker gains access to management credentials or implements malicious changes, they may disable this setting to facilitate data theft or compromise.

  The primary intention behind disabling EBS encryption often aligns with tactics aiming to facilitate unauthorized access to sensitive information at rest without the necessary security controls. A relevant MITRE ATT&CK technique associated with this behavior is **Data Encrypted for Impact (T1486)**, where attackers may alter encryption settings to weaken data protection, and **Data Manipulation (T1565)**, as these changes could also impact the integrity of the stored data.

  Primary data sources to monitor include **CloudTrail logs**, which capture administrative actions taken within AWS services, providing insights into changes to EBS settings, including the disabling of encryption.

  ### Investigation Steps
  - **Review AWS CloudTrail Logs**: Examine CloudTrail logs for entries with the event name `DisableEbsEncryptionByDefault` to identify when this action was taken and by which user or service.
  - **Correlate with User Activity**: Check for other activities from the same IAM user or role around the time of the disablement event to assess the context and motive behind this change.
  - **Assess EBS Volume Status**: Survey the current encryption status of EBS volumes in the affected region to determine if any volumes lack encryption, which can indicate potential risks to sensitive information.
  - **Identify Sourcing of Commands**: Investigate any relevant access patterns from IP addresses, such as potential unauthorized access through previously compromised credentials.

  ### Prioritization
  This alert is of medium severity due to the potential impact of disabling encryption for EBS volumes, which could expose sensitive data in the environment. The likelihood of being exploited increases if the controls around IAM permissions and access to sensitive data are not tightly managed.

  ### Blind Spots and Assumptions
  One gap in detection coverage may involve changes made via the AWS Management Console, which could lead to missed indicators if the capturing of CloudTrail logs is misconfigured or lacks sufficient detail. The detection logic assumes that all actions are logged correctly and that appropriate IAM policies are enforced to prevent unauthorized changes. Without accurate logging of changes and detailed permission configurations in place, sensitive actions could evade detection.

