falsepositives:
- Automated processes that uses Terraform may lead to false positives.
- SAML Provider could be updated by a system administrator. Verify whether the 
  user identity, user agent, and/or hostname should be making changes in your 
  environment.
- SAML Provider being updated from unfamiliar users should be investigated. If 
  known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious activities related to SAML (Security Assertion Markup Language) in AWS, specifically events involving the `AssumeRoleWithSAML` and `UpdateSAMLProvider` API calls. Attackers may leverage SAML to gain unauthorized access to AWS resources by creating backdoors or manipulating existing roles. This detection correlates with the MITRE ATT&CK tactics of Initial Access (TA0001), Persistence (TA0003), and Privilege Escalation (TA0004) under techniques like T1078 (Valid Accounts) and T1548 (Abuse Elevation Control Mechanism).

  The primary telemetry source for this detection is CloudTrail, which logs AWS API calls, including the relevant event types. If malicious, such activity could allow adversaries to obtain unauthorized access to sensitive AWS resources, escalating privileges and compromising the cloud environment. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative operations or automated processes may also trigger similar alerts.

  ### Investigation Steps

  - **Check API call details**: Review the CloudTrail logs for Event Name `AssumeRoleWithSAML` or `UpdateSAMLProvider` (EventSource: `sts.amazonaws.com` or `iam.amazonaws.com`). Focus on the `userIdentity` field to identify the user making the request and validate their role within your organization.

  - **Identify legitimate activities**: Look for historical patterns of similar SAML updates conducted by system administrators. Compare the user agent and hostname fields against recognized legitimate users or services that are expected to perform such actions.

  - **Analyze user context**: Verify whether the `userIdentity` making the SAML call is consistent with your role delegation policies and environmental context. Pay attention if updates originate from unfamiliar IP addresses or geolocations.

  - **Search for benign exceptions**: Investigate known automated processes, for instance, Terraform deployments or CI/CD pipelines, that may trigger these events. Ensure these processes are documented and have appropriate exception handling in the detection rule.

  - **Correlate with broader activity**: Examine for other related API activities in the same time frame that may indicate malicious intent, such as unauthorized attempts to create or delete SAML providers.

  - **Assess high-confidence indicators**: Look for instances where the `userIdentity.type` is an assumed role rather than an actual user, especially if associated with suspicious IP address patterns or locations outside normal operational boundaries.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on cloud resources if malicious. While not commonly weaponized, it represents a critical vector for unauthorized access. The likelihood of malicious activity is present, especially if the user who performed the action lacks the usual context for making such API calls.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives from legitimate automated deployments. Required log sources include CloudTrail with proper configurations to capture all API calls, as well as IAM settings to ensure all user roles are correctly assigned and monitored. Legitimate administrative tasks by well-known service accounts may trigger this alert. A related detection, monitoring for unusual IAM role permissions, can provide complementary coverage against further abuse scenarios.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
