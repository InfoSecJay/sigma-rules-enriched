logsource:
  product: aws
  service: cloudtrail
detection:
  selection_sts:
    eventSource: 'sts.amazonaws.com'
    eventName: 'AssumeRoleWithSAML'
  selection_iam:
    eventSource: 'iam.amazonaws.com'
    eventName: 'UpdateSAMLProvider'
  condition: 1 of selection_*
falsepositives:
- Automated processes that uses Terraform may lead to false positives.
- SAML Provider could be updated by a system administrator. Verify whether the user
  identity, user agent, and/or hostname should be making changes in your environment.
- SAML Provider being updated from unfamiliar users should be investigated. If known
  behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity related to SAML (Security Assertion Markup Language) in Amazon Web Services (AWS). Specifically, it focuses on actions such as `AssumeRoleWithSAML` and `UpdateSAMLProvider`, which could indicate that an attacker is attempting to gain unauthorized access or escalate privileges within an AWS environment. By exploiting SAML, attackers can establish backdoor access to resources without the need for conventional credential harvesting.

  The likely attacker objectives include lateral movement within the cloud infrastructure, persistent access to AWS accounts, and possible evasion of security mechanisms. The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Initial Access** (T1078), **Privilege Escalation** (T1548), and **Persistence** (T1550). Primary data sources for effective detection are AWS CloudTrail logs, which capture API calls and changes made to the AWS environment, allowing for tracking of suspicious user activity around SAML.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Analyze AWS CloudTrail logs to identify any recent `AssumeRoleWithSAML` and `UpdateSAMLProvider` API calls. Check for unusual session durations, unexpected roles assumed, or unfamiliar IAM users involved in these actions.
  - **Correlate User Information:** Verify the identity and context of the users making the SAML provider updates. Cross-reference against known personnel to check for unauthorized or anomalous accounts that may indicate compromise.
  - **Examine User Agent and Source IP:** Investigate the user agent and source IP addresses associated with the SAML requests. Look for anomalies, such as access from unusual geographical locations or devices not typically used by your organization's personnel.
  - **Assess Role Permissions:** Review the permissions associated with any roles that were assumed using `AssumeRoleWithSAML`. Ensure they align with expected operational roles and investigate if the permissions exceed what's necessary for legitimate activities.

  ### Prioritization
  This alert carries medium severity due to the potential impact of unauthorized access and privilege escalation in cloud environments. Given the likelihood that attackers may exploit SAML misconfigurations, it is essential to promptly investigate these alerts to mitigate potential security risks.

  ### Blind Spots and Assumptions
  This rule may not capture all malicious uses of SAML, especially if attackers utilize structures or legitimate access methods that do not trigger AWS logging. Assumptions in the detection logic include that all SAML updates are suspicious unless proven otherwise and that any SAML access should be closely monitored. Required logs for this detection to function effectively include comprehensive AWS CloudTrail records configured to log all relevant API actions associated with IAM and STS services.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
