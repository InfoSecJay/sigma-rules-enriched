note: |
  ---

  ### Technical Context

  This detection rule identifies potentially unauthorized or suspicious activities related to SAML (Security Assertion Markup Language) in AWS, specifically through the `AssumeRoleWithSAML` and `UpdateSAMLProvider` API calls. The likely attacker objective is to gain persistent backdoor access to AWS resources by exploiting SAML for unauthorized role assumption or updating SAML providers to introduce malicious assertions. The behavior aligns with MITRE ATT&CK techniques T1078 (Valid Accounts) and T1550 (Use of Credentials).

  Primary telemetry sources include AWS CloudTrail logs, capturing events for AWS Identity and Access Management (IAM) and Security Token Service (STS). If malicious, the impact could enable an intruder to execute actions across AWS resources, leading to data exfiltration or further compromise. However, this detection does NOT confirm nefarious intent on its own, as legitimate administrative activities may produce similar log entries.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for relevant events:** Search CloudTrail logs for `eventSource` equal to `sts.amazonaws.com` and `eventName` equal to `AssumeRoleWithSAML`, as well as `eventSource` equal to `iam.amazonaws.com` and `eventName` equal to `UpdateSAMLProvider`. Check Event IDs related to these actions for any potential anomalies in user identity.

  - **Validate user identity and context:** Cross-reference the user making the API calls against IAM policies and roles. Ensure that the user has the appropriate permissions and is part of a trusted entity making the changes.

  - **Identify existing SAML providers:** Inspect existing SAML providers in the AWS account. Legitimate activity typically involves known users or services updating SAML configurations; unexpected changes should raise suspicion and warrant further investigation.

  - **Check for unusual user agents or IPs:** Analyze the API call’s `userAgent` and originating IP address. Patterns inconsistent with normal operations can indicate a compromised account or unauthorized access.

  - **Cross-check against false positive factors:** Note that automated processes, such as those using Terraform, may trigger this alert. If such automation is common in your environment, verify whether these activities align with established operational procedures.

  - **Assess historical SAML provider updates:** Review past `UpdateSAMLProvider` events for prior activity by the same user. Repeated changes, particularly from unfamiliar sources or at odd hours, could signal malicious intent needing further assessment.

  ---

  ### Prioritization

  This alert should be treated with medium severity given the potential to enable unauthorized access and lateral movement within the AWS environment. If the affected role or SAML provider configuration impacts critical cloud resources or services, the urgency increases. The likelihood of abuse is moderate, as using SAML for access manipulation is a known adversary tactic.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by insufficient logging if not all relevant AWS services are integrated into CloudTrail. Legitimate activities such as automated deployments or updates by trusted administrators may trigger alerts. Regular reviews of IAM permissions and role configurations are necessary to differentiate benign from suspicious activity. A complementary detection could include monitoring for unusual EC2 API actions following SAML-related activities to identify potential lateral movement.

