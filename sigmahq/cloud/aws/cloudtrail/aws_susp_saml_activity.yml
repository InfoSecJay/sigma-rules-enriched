level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious activity related to SAML (Security Assertion Markup Language) within AWS environments, specifically the `AssumeRoleWithSAML` and `UpdateSAMLProvider` API calls. The likely attacker objective is to gain unauthorized access to AWS resources or establish persistence through the creation or modification of SAML providers used for federated identities. These actions correlate with the MITRE ATT&CK tactics of Initial Access (T1078), Persistence (T1548), and Credential Access (T1550).

  The primary telemetry source is AWS CloudTrail, which logs API calls and actions taken within AWS services. If malicious, this behavior could lead to unauthorized resource access and potential data breaches. It is important to note that this detection does NOT confirm malicious intent on its own since legitimate administrative actions or automation tools commonly trigger similar API calls.

  ### Investigation Steps

  - **Review CloudTrail logs for any `AssumeRoleWithSAML` activity**: Check CloudTrail for Event Name `AssumeRoleWithSAML` (Event Source: `sts.amazonaws.com`). Correlate against known legitimate identity providers and roles. Look for unexpected user IDs or timestamps indicative of unauthorized access patterns.

  - **Examine SAML Provider modifications**: Investigate CloudTrail for Event Name `UpdateSAMLProvider` (Event Source: `iam.amazonaws.com`). Ensure that the user making the updates is an authorized administrator. Look for changes made by unknown or untrusted entities.

  - **Identify known user agents and hostnames for benign activity**: Cross-reference logs against a list of legitimate administrative users and their expected environments. Any updates made from unfamiliar user agents or hostnames should be flagged for deeper investigation.

  - **Assess the IAM policy of the user performing the actions**: Review IAM permissions associated with the user who triggered the alert. High-privilege users performing these actions could indicate a legitimate change, while low-privileged users raising the alert may signal potential compromise.

  - **Correlate with additional security tools for related events**: Look for complementary detection alerts from systems such as GuardDuty, which may highlight unusual API calls or behavior patterns that align with malicious access attempts.

  ### Prioritization

  The severity of this alert is medium. It is critical as it involves potential unauthorized access to AWS resources, especially if performed by non-administrative users. While not extraordinarily common, the exploitation of SAML for backdoor access is a recognized method among adversaries, making this behavior potentially dangerous.

  ### Blind Spots and Assumptions

  This detection has limitations, as automated processes (like Terraform) may trigger false positives for this rule. Reliable detection depends on full CloudTrail logging captured for all IAM and STS activities. Legitimate administrative updates can trigger this alert, especially when conducted from expected sources. A related detection for additional coverage involves monitoring changes in IAM roles (Event Name: `CreateRole` or `DeleteRole`) to catch any role manipulation attempts in conjunction with SAML provider updates.

