note: |
  ### Technical Context

  This detection identifies changes to the master password of an AWS RDS database instance, specifically triggered through the ModifyDBInstance API call. Attackers may aim to gain unauthorized access or maintain persistence by altering the master password, enabling further exploitation or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic of Exfiltration (TA0010) and specifically targets technique T1020 (Automated Exfiltration).

  The primary telemetry source for this detection is AWS CloudTrail, capturing event details such as API call parameters and user identity. If malicious, changing a master password can facilitate unauthorized data access or manipulation. However, this alert does NOT confirm that malicious activity has occurred; further investigation is necessary to ascertain context.

  ### Investigation Steps

  - **Review CloudTrail logs for password change:** Check CloudTrail logs (Event Name: `ModifyDBInstance`, Event Source: `rds.amazonaws.com`) for this specific event. Analyze the `requestParameters` for the `masterUserPassword` key to see if it contains any unexpected values, such as indications of a compromised user.

  - **Determine the actor behind the change:** Identify the principal ID from the CloudTrail event (field: `userIdentity`) and verify if it corresponds to a legitimate user or service role. Compare with expected user activity patterns for changes to the DB instance.

  - **Check for subsequent login attempts:** Look for login attempts to the RDS instance immediately following the password change (CloudTrail Event Name: `CreateDBUser` or log-in API calls). Ensure that the timing of these logins aligns with normal operational hours.

  - **Identify potential benign changes:** Confirm if the password change was part of a scheduled or documented maintenance activity. Check for prior communication from admins regarding RDS changes, potentially found in internal ticketing systems or change control logs.

  - **Evaluate the impacted RDS instance:** Assess the criticality of the affected RDS instance based on assets associated with it (e.g., production vs. development). High-value databases increase the severity of the alert.

  ### Prioritization

  This alert has a medium severity rating. The potential impact of an unauthorized password change on critical RDS databases can lead to significant data breaches or service disruptions. However, the likelihood of abuse is balanced by the requirement for valid AWS permissions, making it moderately risky and less frequent than some direct exploit attempts.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques, such as using IAM roles or service accounts that do not generate alerts. The reliable detection of this event relies on proper CloudTrail configuration and logging for RDS service actions. Legitimate maintenance by authorized administrators can trigger this alert. Related detections might include monitoring for unusual database connections or failed login activities to provide additional context on potentially malicious behaviors.

