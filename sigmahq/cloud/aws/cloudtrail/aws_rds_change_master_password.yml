note: |
  ### Technical Context
  This detection rule identifies changes to the master password of Amazon RDS (Relational Database Service) instances. Such modifications may indicate unauthorized attempts to access sensitive databases, particularly in scenarios where a compromised account may be exploited to facilitate data exfiltration. Attackers might change the master password to lock out legitimate users while they extract data undetected, an objective aligned with lateral movement across the network and exfiltration of sensitive information.

  The relevant MITRE ATT&CK tactics for this rule include **Exfiltration** (TA0010), specifically the technique **Data from Cloud Storage** (T1020), which describes methods that adversaries use to extract data from cloud-stored resources. The primary data source for these detections is AWS CloudTrail logs, which capture API calls made on AWS services, including RDS.

  ### Investigation Steps
  - **Review AWS CloudTrail Logs:** Analyze CloudTrail logs around the time of the alert for the `ModifyDBInstance` event, focusing on changes to the `masterUserPassword`. Look specifically for unusual or unexpected changes, particularly from unfamiliar IAM users or roles.

  - **Correlate with IAM Activity:** Investigate the identity and access management (IAM) activities associated with the user or role that executed the password change. Look for any recent modifications to policies, roles, or permissions that may indicate a compromised account.

  - **Identify Other RDS Activity:** Examine other RDS events surrounding the time of the password change to check for potentially malicious actions, such as unauthorized database snapshots or export activities.

  - **Review Bastion Host Connections:** If applicable, check for connections to the RDS instance from bastion hosts or other entry points. Look for suspicious or anomalous source IPs that may correlate with the password change.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized database access and the likelihood that a password change could indicate a significant security incident, including data exfiltration. Monitoring this change is critical to safeguarding sensitive organizational information.

  ### Blind Spots and Assumptions
  There may be detection gaps regarding benign administrative changes made by trusted personnel, which could lead to false positives in this environment. The detection logic assumes that all legitimate password changes are communicated through standard processes, meaning any changes by authorized admins may not always be captured if they occur outside typical workflows. Continuous monitoring and comprehensive audit trails are required for effective detection and response to this alert.

