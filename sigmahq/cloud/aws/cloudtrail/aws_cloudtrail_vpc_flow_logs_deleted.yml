note: |
  ### Technical Context
  This detection rule focuses on identifying deletions of Virtual Private Cloud (VPC) Flow Logs within the AWS Elastic Compute Cloud (EC2) environment through the `DeleteFlowLogs` API call. Deleting flow logs is a tactic utilized by adversaries to obscure their network activity. By removing these logs, attackers can evade detection, ultimately hindering forensic investigations and reducing visibility into potentially malicious operations. The objective of such activity is typically to eliminate evidence of nefarious actions, making it difficult for security teams to analyze and respond to incidents.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the technique **Indicator Removal on Host** (T1070). The primary data source for this alert is AWS CloudTrail logs, which capture API calls made within the AWS environment, including the deletions of VPC Flow Logs. Monitoring these logs is crucial for detecting attempts to manipulate or delete audit trails, which can indicate unauthorized access or malicious intent.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine AWS CloudTrail logs around the time of the deletion event to identify the identity of the user or service that executed the `DeleteFlowLogs` API call. Look for any unusual patterns or unexpected identities performing this action.
  - **Correlate with User Activity**: Investigate the associated IAM user or role to determine if they have a legitimate reason for deleting VPC Flow Logs or if their activity may suggest compromise. Look for other actions they undertook immediately before and after the deletion.
  - **Analyze Network Activity**: Check VPC Flow Log entries prior to the deletion event for abnormal traffic patterns or indications of data exfiltration, ensuring you understand what data may have been obscured. Assess if this action relates to known anomalous activities or high-risk assets.
  - **Verify Authorized Change Management**: Cross-reference with your organization’s change management records to confirm whether the deletion was authorized. If the deletion coincides with scheduled maintenance or testing, document this context.

  ### Prioritization
  The severity of this alert is high due to the critical nature of VPC Flow Logs in monitoring network traffic and the potential implications of deletion. Losing this telemetry can severely impact incident response and threat detection capabilities, especially in a large enterprise environment where visibility is essential for security posture.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if AWS CloudTrail logging is not properly configured or if log file integrity is not ensured. The detection logic assumes that all deletions of flow logs are indicative of malicious activity; however, legitimate administrative actions may also lead to similar events, particularly during maintenance. For the alert to function effectively, continuous logging of AWS CloudTrail is essential, and all necessary permissions must be granted to capture API call details accurately.

