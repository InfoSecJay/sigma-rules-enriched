  selection_status_null:
    errorCode:
  condition: selection_event_name and 1 of selection_status_*
falsepositives:
- During maintenance operations or testing, authorized administrators may delete
  VPC Flow Logs as part of routine network management or cleanup activities.
level: high
note: |
  ### Technical Context

  This rule detects the deletion of AWS VPC Flow Logs through the DeleteFlowLogs API call. Such behavior is indicative of an adversary attempting to eradicate traces of their network activity, thereby obstructing forensic investigation efforts and overall visibility into any potentially malicious operations. The relevant MITRE ATT&CK tactics include **Defense Evasion** (ATP ID: T1564) and **Cloud Infrastructure Discovery** (T1526).

  Primary telemetry sources include AWS CloudTrail logs, specifically focusing on event types related to the **DeleteFlowLogs** API call. If an attacker successfully deletes these logs, it complicates incident response and can significantly impair the organization’s security posture. However, this detection does not confirm that malicious activity is occurring on its own; it only indicates that deletion of flow logs has taken place.

  ### Investigation Steps

  - **Verify event occurrence:** Review CloudTrail logs for the `DeleteFlowLogs` API call (Event ID: `DeleteFlowLogs`). Check the timestamp and source IP address to see if it aligns with known administrative actions.

  - **Correlate user activity:** Cross-reference the IAM user or role triggering the deletion with recent activity. Legitimate users typically engage in routine tasks rather than bulk deletions of multiple logs.

  - **Check for additional malicious indicators:** Look for patterns of abnormal behavior surrounding the deletion event, such as unexpected API calls within a short time frame (e.g., repeated attempts to delete logs and other high-risk API calls).

  - **Assess log retention policies:** Ensure that the organization’s log retention and monitoring policies are in place and verify that appropriate CloudTrail logging levels are configured to capture relevant activities.

  - **Identify potential misconfigurations:** Check if there have been any recent changes to IAM permissions or policies that may have enabled this deletion operation.

  ### Prioritization

  Alerts for the deletion of VPC Flow Logs should be treated with high severity, as they can severely impact the organization's ability to perform threat detection and incident response. The likelihood of this behavior being abused by malicious actors is high, as it is a common tactic to cover up unauthorized network activities.

  ### Blind Spots and Assumptions

  This detection may be bypassed by attackers utilizing account compromise techniques or legitimate user credentials to perform the deletion. Required log sources include comprehensive AWS CloudTrail logging, ensuring that all API calls are captured. Cleanup actions by authorized personnel during maintenance could trigger this alert, necessitating contextual awareness. A related detection to consider is monitoring for unexpected API calls to `CreateFlowLogs`, which may indicate an adversary attempting to re-establish visibility after log deletion.

