note: |
  ### Technical Context

  This Sigma rule detects the deletion of VPC Flow Logs in AWS Elastic Compute Cloud (EC2) using the DeleteFlowLogs API call. Attackers may delete flow logs to remove records of their network activity, effectively evading detection and hindering forensic investigations. This behavior is typically associated with the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and the technique "Deletions" (T1070). The primary telemetry sources for this detection are AWS CloudTrail logs, specifically looking for entries related to the DeleteFlowLogs API calls.

  If successful, this activity significantly decreases the visibility of potentially malicious actions within the environment. However, it is important to note that this detection alone does not confirm malicious intent; legitimate administrative actions can also result in the deletion of flow logs.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for DeleteFlowLogs API calls:** Check for EventName: "DeleteFlowLogs" in AWS CloudTrail logs (log type: CloudTrail events). Look for unusual deletion times or patterns outside of regular maintenance schedules.

  - **Identify the IAM user or role performing the deletion:** Filter CloudTrail logs by the UserIdentity field associated with the DeleteFlowLogs event. Confirm if the identity has the necessary permissions and if their activity is consistent with legitimate administrative tasks.

  - **Correlate with other recent log actions:** Examine additional CloudTrail logs for related activities (e.g., CreateFlowLogs, UpdateFlowLogs) around the same time to assess if this deletion is part of suspicious behavior or a legitimate cleanup.

  - **Determine the impact of VPC Flow Log deletion:** Check which VPC Flow Logs were deleted by reviewing the response details of the DeleteFlowLogs call (specifically the LogGroupIDs). This can help assess potential gaps in logging and impact on forensic analysis.

  - **Look for recent administrative activity:** Investigate recent IAM activities by querying AWS CloudTrail for all events made by the affected user or role within the past 24-48 hours, focusing on actions that could relate to network security configurations.

  - **Establish typical behavior for flow log management:** Validate that the deletion is not part of standard operating procedures. Authorized users usually maintain logging settings unless specifically tasked with routine maintenance or testing; compare the deletion against a schedule of known legitimate activities.

  ---

  ### Prioritization

  This alert should be considered high priority due to its potential impact on the ability to investigate network activity on critical systems. The likelihood of malicious abuse is significant, as attackers commonly seek to erase traces of their actions. The behavior is weaponized in scenarios where adversaries aim to evade detection or obscure their tactics.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by missed API calls or incomplete log configurations in AWS, necessitating proper CloudTrail settings for comprehensive visibility. Routine maintenance actions by authorized personnel can trigger this alert, potentially leading to false positives. A related detection to consider is monitoring for unusual IAM user activity or significant changes in role permissions, which could further strengthen monitoring and response capabilities.

