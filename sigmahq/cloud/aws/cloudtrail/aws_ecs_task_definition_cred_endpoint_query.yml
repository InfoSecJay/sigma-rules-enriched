title: AWS ECS Task Definition That Queries The Credential Endpoint
id: b94bf91e-c2bf-4047-9c43-c6810f43baad
status: test
description: |
  Detects when an Elastic Container Service (ECS) Task Definition includes a command to query the credential endpoint.
  This can indicate a potential adversary adding a backdoor to establish persistence or escalate privileges.
references:
- https://github.com/RhinoSecurityLabs/pacu/blob/866376cd711666c775bbfcde0524c817f2c5b181/pacu/modules/ecs__backdoor_task_def/main.py
- https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_RegisterTaskDefinition.html
- https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
author: Darin Smith
date: 2022-06-07
modified: 2023-04-24
tags:
- attack.persistence
- attack.t1525
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ecs.amazonaws.com'
    eventName:
    - 'DescribeTaskDefinition'
    - 'RegisterTaskDefinition'
    - 'RunTask'
    requestParameters.containerDefinitions.command|contains: '$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI'
  condition: selection
falsepositives:
- Task Definition being modified to request credentials from the Task Metadata Service
  for valid reasons
level: medium
note: |
  ### Technical Context
  This detection rule identifies when an AWS Elastic Container Service (ECS) Task Definition includes a command to query the `credential endpoint`, which can indicate malicious activity aimed at establishing persistence or privilege escalation within an AWS environment. An attacker may modify an ECS task definition to access sensitive credential information provided by AWS, potentially allowing them to conduct further attacks or maintain persistent access to the environment.

  The associated MITRE ATT&CK techniques relevant to this activity include **Persistence (T1525)**, which relates to actions taken to maintain access to a system or environment. The focusing on task definitions to gain unauthorized access to AWS credentials demonstrates a malicious intention to elevate privileges and exploit the AWS infrastructure.

  Primary data sources for monitoring this behavior include AWS CloudTrail logs, which record events related to the management of ECS services, including task definitions. By scrutinizing these logs, security teams can detect modifications that could indicate an adversary's attempt to backdoor their access through task definitions.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine AWS CloudTrail logs for events related to `DescribeTaskDefinition`, `RegisterTaskDefinition`, and `RunTask` that contain commands querying `$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI`. Look for any recent task definitions that have been modified or created.

  - **Assess Task Definition Metadata**: Analyze the metadata of the ECS task definitions to determine if they include unusual commands or configurations. Pay close attention to any tasks that have been registered with commands to access AWS services in an uncharacteristic manner.

  - **Correlation with Normal Behavior**: Compare findings against baseline behavior of ECS task definitions within your organization. Investigate any discrepancies or unexpected changes in the use of commands that query credential endpoints.

  - **Verify User Actions**: Investigate the IAM roles or user actions associated with the modifications to ECS task definitions. Evaluate whether the users have legitimate reasons for these actions or if they appear anomalous.

  ### Prioritization
  The alert is rated as **medium** severity due to the potential impact associated with unauthorized access to AWS credentials, which could lead to significant compromise within the AWS environment. The likelihood of occurrence is moderate, as attackers actively target cloud environments to gain footholds for further exploitation.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots such as misconfigured IAM roles that could allow legitimate modifications to take place without alerting the SOC. Assumptions made by the detection logic include that any query to the credential endpoint is inherently malicious, without considering legitimate use cases for accessing AWS credentials. For the alert to function effectively, it requires comprehensive CloudTrail logging to capture all relevant ECS events, which may not be configured in all environments.

