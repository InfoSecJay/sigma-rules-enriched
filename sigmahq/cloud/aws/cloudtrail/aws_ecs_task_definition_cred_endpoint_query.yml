logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'ecs.amazonaws.com'
    eventName:
    - 'DescribeTaskDefinition'
    - 'RegisterTaskDefinition'
    - 'RunTask'
    requestParameters.containerDefinitions.command|contains: '$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI'
  condition: selection
falsepositives:
- Task Definition being modified to request credentials from the Task Metadata 
  Service for valid reasons
level: medium
note: |
  ### Technical Context

  This rule detects when an AWS Elastic Container Service (ECS) Task Definition contains a command that queries the AWS Credential Endpoint, often represented by the `$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI` variable. This behavior may indicate an attempt by an adversary to establish persistence or escalate privileges by adding backdoors for unauthorized access. The relevant MITRE ATT&CK tactic is Persistence (TA0003) with the technique ID T1525 (Container and Resource Monitoring).

  The primary telemetry source for this detection is AWS CloudTrail logs, specifically event types such as `DescribeTaskDefinition`, `RegisterTaskDefinition`, and `RunTask`. If detected activity is malicious, it can allow compromised containers to gain access to AWS resources and sensitive credentials. However, this detection alone does not confirm malicious intent, as legitimate task definitions may also access the credential endpoint for valid operational purposes.

  ### Investigation Steps

  - **Verify CloudTrail Events:** Review AWS CloudTrail logs for `RegisterTaskDefinition` events within the timeframe of the alert. Look for attributes like `requestParameters.containerDefinitions.command` including `$AWS_CONTAINER_CREDENTIALS_RELATIVE_URI`.

  - **Identify Modification Patterns:** Check for unusual or unauthorized modifications in `DescribeTaskDefinition` events, focusing on any significant changes to container command parameters that may indicate backdoor implementations.

  - **Locate Task Role Permissions:** Investigate the IAM roles associated with the affected Task Definition. Confirm that the permissions align with expected role configurations and do not allow excessive access to sensitive AWS resources.

  - **Establish Legitimate Usage:** Document instances of valid ECS Task Definitions that require querying the credential endpoint, which helps establish benign behavior for ongoing monitoring.

  - **Detect High-Confidence Malicious Indicators:** Look for associations with known malicious actors or tools that leverage containers for privilege escalation; this may include known GitHub repositories with backdoor implementations, like the one referenced in the alert.

  ### Prioritization

  This alert is of medium severity due to its potential impact on sensitive AWS resources and the likelihood of privilege escalation via compromised containers. While this behavior can indicate a malicious actor's activity, it is essential to differentiate it from legitimate operational requirements.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of obfuscation, where adversaries may alter commands to avoid detection. Reliable detection requires comprehensive coverage of AWS CloudTrail logs, specifically for ECS-related actions. Legitimate activities such as automated deployment scripts may inadvertently trigger the alert. A related detection to consider is querying for unusual patterns in IAM policy changes, which can enhance visibility into potential privilege escalation attempts.

