  false positives, it can be exempted from the rule.


level: low
note: |
  ### Technical Context

  This rule detects modifications or deletions of AWS ElastiCache security groups, including authorization changes to ingress and egress rules. The likely attacker objective is to alter security group settings to facilitate unauthorized access to ElastiCache resources, potentially leading to data exfiltration or compromise. This behavior maps to the MITRE ATT&CK tactic "Impact" (TA0040) and technique "Data Manipulation" (T1531).

  The primary telemetry source is AWS CloudTrail, which logs the relevant API calls: `DeleteCacheSecurityGroup`, `AuthorizeCacheSecurityGroupIngress`, `RevokeCacheSecurityGroupIngress`, `AuthorizeCacheSecurityGroupEgress`, and `RevokeCacheSecurityGroupEgress`. If these modifications are malicious, they can compromise the confidentiality and integrity of sensitive data stored in ElastiCache. Importantly, this detection does NOT confirm malicious activity on its own without considering the context of the changes, including the identity of the initiator and legitimate usage patterns.

  ### Investigation Steps

  - **Identify the user making changes:** Review CloudTrail logs (EventSource: `elasticache.amazonaws.com`, EventName: any of the detected events). Check fields: `userIdentity.username`, `userAgent`, and `sourceIPAddress`. Legitimate administrative actions will typically come from known administrative accounts or systems.

  - **Check for unusual patterns in security group changes:** Look for multiple rapid changes to security groups, which may indicate abuse. Monitor CloudTrail for EventTime timestamps close together for suspicious behavior.

  - **Validate the purpose of the security group adjustments:** Access any change management or ticketing systems used within the organization to correlate any planned activities or changes associated with the detected incidents.

  - **Note any indicators of compromise:** Specifically, check CloudTrail for changes initiated by user identities that are unfamiliar or not associated with expected administrative roles. This may indicate compromised credentials.

  - **Review related ElastiCache access attempts:** Correlate with CloudWatch logs for unexpected or unauthorized access attempts to ElastiCache instances following the security group modification events.

  ### Prioritization

  This alert has a low severity rating in a mature enterprise context due to the relatively limited impact of a single security group change; however, heightened risk exists when these changes originate from unauthorized users or systems. Although this behavior could potentially be weaponized, it typically requires further steps to be effectively exploited.

  ### Blind Spots and Assumptions

  Detection may be limited if AWS CloudTrail logging is not enabled or configured correctly for ElastiCache. Legitimate administrative actions, such as scheduled changes by network administrators for maintenance or upgrades, can trigger this alert. Additional detection rules focused on unauthorized access to ElastiCache resources should be implemented to strengthen coverage and context for any detected changes.

