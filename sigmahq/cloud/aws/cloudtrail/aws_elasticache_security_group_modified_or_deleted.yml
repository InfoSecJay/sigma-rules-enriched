note: |
  ### Technical Context
  This rule detects modifications or deletions of security groups associated with AWS ElastiCache. Security groups are pivotal for controlling access to resources, and any unauthorized changes can expose sensitive data, allowing attackers to exploit vulnerabilities or perform data exfiltration. The likely attacker objective in such scenarios is to manipulate access controls, which can facilitate lateral movement or compromise data integrity.

  Relevant MITRE ATT&CK techniques connected to this alert include **Impact** (T1485), particularly **Data Destruction (T1485)**, where attackers may seek to alter security configurations to create vulnerabilities. The applicable tactics involve **Credential Access (TA0006)**, since access to security group changes usually requires proper permissions, which could be exploited through compromised credentials.

  The primary data sources for detecting these activities include Amazon CloudTrail logs that capture API calls and changes to AWS service states, as they record events that indicate when listings, modifications, or deletions to ElastiCache security groups occur.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Analyze recent CloudTrail logs for the `DeleteCacheSecurityGroup` and other related event names. Identify any unexpected or unauthorized changes to security groups.

  - **Validate User Actions**: Cross-reference the IAM user or role that initiated the change. Verify if the modification aligns with known administrative practices. Investigate any changes made by unfamiliar users or from unusual IP addresses.

  - **Examine Security Group Metadata**: Investigate the source and destination configurations of the affected security groups. Unusual ingress and egress rules may highlight misconfigurations or malicious intent.

  - **Check for Corroborative Activity**: Analyze associated logs for signs of suspicious activity, such as unauthorized access attempts, changes to IAM roles, or activity from uncommon geographical locations. Tie these activities back to the changes detected in the security groups.

  ### Prioritization
  This alert has a low severity classification; however, modifications or deletions of security groups can indicate potential misconfigurations or malicious intent, necessitating investigation to mitigate risks of exposure or unauthorized access.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage if AWS CloudTrail logging is not enabled for ElastiCache or if logs are not retained for an adequate duration. The detection logic assumes that changes to security groups are monitored adequately and that changes should follow established administrative procedures. Organizations must ensure that CloudTrail is configured correctly and log data is continuously reviewed to effectively capture these alerts.

