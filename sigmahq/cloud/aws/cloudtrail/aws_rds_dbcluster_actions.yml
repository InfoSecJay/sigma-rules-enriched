  ### Technical Context

  This Sigma rule detects modifications to or deletions of AWS RDS clusters, which could indicate unauthorized attempts at data exfiltration or unauthorized access to sensitive databases. The likely attacker objective is to disrupt services, manipulate configurations, or access and extract confidential information. This behavior falls under the MITRE ATT&CK tactic of Exfiltration (TA0010) and specifically relates to the technique of Data from Information Repositories (T1020).

  The primary telemetry source involves AWS CloudTrail logs capturing the event actions for RDS clusters. Specifically, the event names of interest are `ModifyDBCluster` and `DeleteDBCluster`. If malicious, the impact could be significant, as unauthorized changes or deletions can lead to data loss or exposure. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative actions may also trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for the specific event names**: Investigate AWS CloudTrail logs for `eventName` fields containing `ModifyDBCluster` or `DeleteDBCluster`. Check `userIdentity` fields to ascertain if the request was made by a known authorized user.

  - **Identify time and context of the event**: Look at the `eventTime` field against known maintenance schedules to determine if this action aligns with legitimate activities, such as authorized updates or routine maintenance tasks.

  - **Check the associated IAM roles and policies**: Evaluate the permissions of the user or service that invoked the modification or deletion. Confirm that their IAM policies are appropriate for such actions and have not been altered to permit excessive access.

  - **Look for high-confidence indicators of compromise**: Investigate other related API actions in the same timeframe, such as `CreateDBSnapshot` or `ListDBInstances`, which could indicate preparatory steps for unauthorized data access.

  - **Validate against known scheduled maintenance**: Confirm if this modification or deletion was performed as part of a documented, planned event by cross-referencing with change management records or incident tickets.

  - **Monitor for recent access patterns**: Cross-reference this event with recent login activities and API usage (e.g., `DescribeDBInstances`) to identify if unusual accounts or access strategies were employed prior to the modification or deletion.

  ---

  ### Prioritization

  This alert is high severity due to the critical nature of RDS clusters in hosting databases and the significant impact unauthorized modifications or deletions can have on data integrity and availability. Given the potential for data breaches and the commonality of weaponization in cloud environments, any alert triggered by this rule should be addressed promptly.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detecting the context of modifications or deletions, as legitimate scheduled changes may raise similar alerts. A comprehensive log source configuration is required to ensure all relevant API actions are logged and accessible in CloudTrail. Common legitimate activities, such as permission updates for routine maintenance tasks, may trigger false positives. It is recommended to implement companion detection for unauthorized IAM privileges changes to strengthen the overall monitoring of RDS security.

