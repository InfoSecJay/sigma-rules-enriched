note: |
  ### Technical Context
  This rule detects modifications or deletions of Amazon RDS clusters, which can indicate suspicious activities such as data exfiltration attempts, unauthorized access, or accidental exposure of sensitive data. Attackers may target RDS clusters to exploit sensitive information, disrupt operations, or gain unauthorized access to key data sets. Modifying or deleting a database cluster can potentially lead to the loss of availability of critical data and services, prompting serious security concerns.

  Relevant MITRE ATT&CK tactics include **Exfiltration** (TA0010) and technique **Data from Cloud Storage Object** (T1020). These tactics highlight the risk of attackers manipulating cloud resources to extract sensitive information. The primary data sources for this detection are AWS CloudTrail logs, which capture API activity within the AWS environment and provide visibility into actions taken on RDS clusters.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Analyze AWS CloudTrail logs for the specific events `ModifyDBCluster` and `DeleteDBCluster`. Cross-check the event time with other logs to correlate user activities.
  - **Identify User Permissions:** Examine the IAM roles and policies associated with the user or service account that executed the modifications or deletions. Look for any unusual permissions that could indicate privilege escalation.
  - **Audit Recent Changes:** Check for recently documented changes within AWS systems, including maintenance notifications or planned updates that may rationalize the detected events. This helps in confirming legitimate administrative tasks.
  - **Correlate with Additional Metrics:** Look for unusual patterns in network traffic or database access logs that align with the timing of the modification or deletion event. This can help determine if there was any exfiltration activity occurring simultaneously.

  ### Prioritization
  This alert is considered high severity due to the potential impact of unauthorized modifications or deletions to database clusters, which could lead to significant data loss or exposure of sensitive information. The likelihood of malicious actions, coupled with the critical nature of the data often stored within RDS clusters, amplifies the urgency of investigating such alerts.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage might be the inability to correlate modifications or deletions with unauthorized access if the logs are insufficiently detailed or retained for a limited time. The assumption is made that CloudTrail logging is properly configured to capture all necessary API calls concerning RDS modifications and deletions. If the logs are missing or improperly filtered, the detection will not function effectively, limiting the capability of analysts to respond properly. Ensuring comprehensive logging and monitoring of IAM activities is essential for accurate detection.

