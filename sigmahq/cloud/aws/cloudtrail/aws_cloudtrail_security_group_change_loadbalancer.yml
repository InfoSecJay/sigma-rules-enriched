logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'elasticloadbalancing.amazonaws.com'
    eventName:
    - 'ApplySecurityGroupsToLoadBalancer'
    - 'SetSecurityGroups'
  condition: selection
falsepositives:
- Repurposing of an ELB or ALB to serve a different or additional application
- Changes to security groups to allow for new services to be deployed
level: medium
note: |
  ### Technical Context

  This rule detects changes made to the security groups of AWS Elastic Load Balancers (ELB) or Application Load Balancers (ALB). Such modifications may reflect a misconfiguration potentially allowing excessive traffic into a critical system, or they may indicate malicious activity aimed at enabling unwanted connections within an organization's Virtual Private Cloud (VPC). The related MITRE ATT&CK tactic is Initial Access, particularly technique T1190 (Exploit Public-Facing Application). Primary telemetry sources are AWS CloudTrail logs, specifically monitoring the `elasticloadbalancing.amazonaws.com` service for actions related to security group modifications. If malicious, these actions can lead to unauthorized access and exploitation of the environment. It is important to note that this detection alone does not prove that an attacker has successfully accessed the system; it only indicates a potential risk introduced by configuration changes.

  ### Investigation Steps

  - **Examine CloudTrail logs for security group changes:** Look for `eventSource` equal to `elasticloadbalancing.amazonaws.com` and `eventName` set to either `ApplySecurityGroupsToLoadBalancer` or `SetSecurityGroups` with timestamps that align with the alert trigger. This helps identify the exact changes made.

  - **Identify the user making the changes:** Check the `userIdentity` field in the CloudTrail event logs to determine who initiated the changes. Unrecognized or suspicious user IAM roles should be flagged for further review.

  - **Evaluate the security group configuration post-change:** Analyze the incoming and outgoing rules for the modified security groups linked to the ELB/ALB to assess if they allow unintentional traffic. Legitimate configurations typically restrict access to known IP addresses or services.

  - **Correlate with other network activity:** Investigate Network Access Control Lists (NACLs) and VPC flow logs to see if there are any corresponding events that support or contradict the findings from the ELB security group changes. This assists in building context around the activity.

  - **Cross-reference with scheduled maintenance or deployment schedules:** If changes align with planned operations, such as repurposing an ELB for new applications or deployments, note these as legitimate activity. Consult the change management system for approvals.

  - **Document any high-risk indicators of compromise:** Recognize any unusual traffic patterns or new ingress rules that significantly expand exposure of the ELB/ALB to the internet, as these are strong indicators of potentially malicious configurations.

  ### Prioritization

  This alert is of medium severity, given that the affected system—an ELB/ALB—plays a critical role in directing traffic to applications. If configuration changes permit excessive access, the risk of exploitation is substantial. This behavior is monitored as it can be weaponized by attackers to gain footholds in cloud environments.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative changes that could trigger the alert. Proper AWS CloudTrail configuration is critical for ensuring exhaustive logging; ensure that all necessary services are being logged for maximum visibility. Additionally, legitimate updates for service redeployment could inadvertently match this rule, leading to false positives. A companion detection to consider is monitoring changes to IAM policies or roles that may enable excessive permissions, further safeguarding against potential abuse.

