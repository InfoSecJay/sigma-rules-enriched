logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'elasticloadbalancing.amazonaws.com'
    eventName:
    - 'ApplySecurityGroupsToLoadBalancer'
    - 'SetSecurityGroups'
  condition: selection
falsepositives:
- Repurposing of an ELB or ALB to serve a different or additional application
- Changes to security groups to allow for new services to be deployed
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized or unexpected changes to the security groups associated with Elastic Load Balancers (ELBs) or Application Load Balancers (ALBs) in an AWS environment. Such modifications can lead to increased vulnerability by allowing more traffic than necessary, creating potential pathways for malicious actors to exploit. Attackers may aim to manipulate these settings to establish new connections, redirect traffic, or facilitate lateral movement within a Virtual Private Cloud (VPC).

  The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) given that changes to security groups can signify attempts to facilitate initial entry into a network, and **Exploitation of Vulnerabilities** (TA0041), specifically related to the technique of *Exploitation of Remote Services* (T1190). The primary data sources for detecting these modifications are AWS CloudTrail logs, which provide visibility into API calls made within the AWS environment.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Analyze AWS CloudTrail logs for `ApplySecurityGroupsToLoadBalancer` and `SetSecurityGroups` events to identify changes made to the security group settings. Pay attention to the `eventTime` and `userIdentity` fields to determine when and who made the changes.

  - **Verify Source IPs and User Agents**: Check the source IP addresses which initiated the changes against known entity ranges and investigate any anomalous IPs. Also, look for unusual user agents that may indicate non-standard activity.

  - **Assess Security Group Rules**: Examine the new security group rules added or modified. Identify any excessive permissions granted, such as allowing traffic from all IPs (0.0.0.0/0) on critical ports.

  - **Identify Associated Resources**: Map out which resources (e.g., EC2 instances, databases) are associated with the modified ELB or ALB. Ensure that these resources align with the expected configurations for the applications they support.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of allowing unauthorized access to critical services within the cloud environment. The likelihood of exploitation increases when security settings are misconfigured, making timely investigation essential.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection logic is the lack of visibility into legitimate changes made during scheduled maintenance or reconfiguration by authorized personnel. The detection assumes that all modifications are anomalous, ignoring the possibility of intentional, legitimate updates. Additionally, it relies on AWS CloudTrail being enabled and properly configured to capture all relevant events; if CloudTrail logging is misconfigured or disabled, detection will fail entirely.

