title: AWS EC2 VM Export Failure
id: 54b9a76a-3c71-4673-b4b3-2edb4566ea7b
status: test
description: An attempt to export an AWS EC2 instance has been detected. A VM Export
  might indicate an attempt to extract information from an instance.
references:
- https://docs.aws.amazon.com/vm-import/latest/userguide/vmexport.html#export-instance
author: Diogo Braz
date: 2020-04-16
modified: 2022-10-05
tags:
- attack.collection
- attack.t1005
- attack.exfiltration
- attack.t1537
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'CreateInstanceExportTask'
    eventSource: 'ec2.amazonaws.com'
  filter1:
    errorMessage|contains: '*'
  filter2:
    errorCode|contains: '*'
  filter3:
    responseElements|contains: 'Failure'
  condition: selection and not 1 of filter*
level: low
note: |
  ### Technical Context
  This detection rule identifies failed attempt to export an AWS EC2 instance through the CloudTrail logs. The ability to export a virtual machine (VM) might suggest that an attacker is seeking to extract sensitive information or configurations from compromised instances within an AWS environment. A successful VM export could lead to exfiltration of critical data, affecting the confidentiality and integrity of systems.

  The primary objective of an attacker engaging in this behavior is to retrieve sensitive data or insights from an EC2 instance, which may contain valuable intellectual property or sensitive information. This action aligns with the MITRE ATT&CK techniques, specifically **T1005 - Data from Local System** and **T1537 - Transfer Data to External Site**.

  The best telemetry source to analyze for this detection is CloudTrail logs, which capture the API calls made in AWS accounts, including the failed VM export attempts, providing necessary context regarding the event.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Examine the CloudTrail logs for the `CreateInstanceExportTask` event to gather additional context regarding the user who initiated the export attempt and the specific instance targeted.
  - **Analyze Security Group and IAM Policies:** Investigate whether any security group rules or IAM policies were recently changed that could facilitate unauthorized access or actions related to exporting VMs.
  - **Identify User Behavior:** Determine if the user or role that attempted the export has a history of suspicious behavior or if it matches patterns from known users who would typically perform such actions.
  - **Monitor Related Activities:** Keep an eye on any subsequent events, such as instance termination or other EC2 API calls that may indicate further attempts to manipulate or export sensitive data.

  ### Prioritization
  The alert is considered low severity due to the current failure in execution, but it indicates potential reconnaissance activity or unauthorized attempts that could precede further malicious actions. Continuous monitoring is essential.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of suspicious behavior, particularly if the attacker uses legitimate credentials or if the initial VM export attempt does not fail. The detection assumes that the CloudTrail logging is enabled and appropriately configured to capture all relevant events. If CloudTrail logs are not properly retained, it may hinder the ability to investigate related activities thoroughly. Additionally, assumed behaviors of users may not account for compromised accounts or insider threats, which could skew analysis.

