logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'CreateInstanceExportTask'
    eventSource: 'ec2.amazonaws.com'
  filter1:
    errorMessage|contains: '*'
  filter2:
    errorCode|contains: '*'
  filter3:
    responseElements|contains: 'Failure'
  condition: selection and not 1 of filter*
level: low
note: |
  ### Technical Context

  This rule detects failure events related to AWS EC2 instance export attempts, specifically tracking when a user initiates a CreateInstanceExportTask that does not complete successfully. The likely attacker objective could be to extract sensitive information from an EC2 instance, which might indicate a data exfiltration plan or compromise. This activity aligns with MITRE ATT&CK techniques such as "Exfiltration Over Command and Control Channel" (T1041) and "Data Staged" (T1074).

  Primary telemetry sources include AWS CloudTrail logs, specifically looking for events where the event name is ‘CreateInstanceExportTask’ and where error messages and codes indicate failure. If malicious, failure to export could indicate that the attacker was unable to exfiltrate sensitive data, preserving the integrity of that information. This detection does not confirm malicious intent on its own, as legitimate user error can also trigger export task failures.

  ### Investigation Steps

  - **Review CloudTrail logs for CreateInstanceExportTask events:** Look for Event Name `CreateInstanceExportTask` in CloudTrail logs (Event Source: `ec2.amazonaws.com`, Event Type: `Error`). Identify user accounts that initiated the request for patterns of suspicious behavior.

  - **Check for error codes and messages:** Validate the error codes and messages associated with the failed export attempts by filtering for `errorMessage` and `errorCode` fields. Common non-malicious indicators might include `InvalidInstanceID.NotFound` or `InsufficientInstanceCapacity`, while unexplained errors may indicate malicious interest.

  - **Identify host interactions:** Examine associated IAM permissions for the user who attempted the export. Users lacking necessary permissions for exports could signal a compromised account attempting to access restricted data.

  - **Analyze S3 bucket activity:** If there are any linked S3 buckets identified in export tasks, review S3 logs for `PutObject` or `GetObject` actions during the timeframe of the failed export. This helps identify possible follow-on events intended for data exfiltration.

  - **Correlate with other events:** Check for simultaneous patterns within your logs (e.g., unusual console sign-ins, other export tasks initiated from that AWS account, or any other abnormalities). This context can help verify whether this failed request is part of a more extensive attack.

  - **Review gameplay for expected activities:** Compare the export attempt against known workflows. Legitimate use might include admins exporting instances for backup purposes; thus, successful completion patterns should be well-established within the organization’s operation to rule out abnormal behavior.

  ### Prioritization

  This alert should be considered low severity given the failure of the export and the possibility that the action was initiated by a legitimate user. However, frequent failures from certain users or accounts, especially lacking the typical role or permission for exports, could signify potential malicious behavior. The overall likelihood of malicious use is moderate if correlated with other suspicious activities.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate users to encounter export failures due to misconfigurations or permissions issues. Ensure CloudTrail is actively logging these events and verify that IAM policies are configured appropriately for export actions. Activities such as legitimate data backups or migrations might trigger similar alerts. A related detection might focus on logging any successful CreateInstanceExportTask events to ensure visibility of both attempted and executed data exfiltration tactics.

