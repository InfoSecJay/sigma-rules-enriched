note: |
  ### Technical Context

  This Sigma rule detects changes to the identity provider configurations within AWS Identity Center (formerly known as AWS SSO). Such changes can indicate an adversary attempting to establish persistent access to resources or escalate privileges through user impersonation, which may facilitate unauthorized actions within the AWS environment. Relevant MITRE ATT&CK tactics include Persistence (T1543) and Credential Access (T1556), specifically focusing on identity provider manipulation for gaining access rights.

  The primary telemetry sources for this detection are AWS CloudTrail logs that capture actions taken within the AWS Identity Center. Event names include `AssociateDirectory`, `DisableExternalIdPConfigurationForDirectory`, `DisassociateDirectory`, and `EnableExternalIdPConfigurationForDirectory`. If malicious, these actions can lead to unauthorized access or privilege escalation. Importantly, this detection does not confirm malicious intent by itself, as legitimate administrative activities could result in similar alerts.

  ### Investigation Steps

  - **Verify CloudTrail Logs:** Review AWS CloudTrail logs for Event Name: `EnableExternalIdPConfigurationForDirectory` within the last 24 hours for any unauthorized configurations, focusing on the `userIdentity` field to identify the initiator of the change.

  - **Identify the Proximity of Changes:** Check if the changes coincide with recent user provisioning events or access requests by comparing against Event IDs related to user management, like `CreateUser` or `UpdateUser`.

  - **Look for Patterns of Abuse:** Search for multiple identity provider change events in a short time frame. For example, if `AssociateDirectory` and `DisassociateDirectory` events occur back-to-back from the same user or role, this could indicate reconnaissance or exploitation attempts.

  - **Analyze User Roles and Context:** Assess the role associated with the user making the changes. Authorized changes should typically originate from administrative roles (like AWS IAM Admin) within a defined change management process. Investigate any deviations from this standard as potential indicators of a security incident.

  - **Monitor for Related Changes:** Review other security-relevant configurations within the Identity Center or related services (such as IAM roles or permission boundary adjustments) for simultaneous changes that may indicate an elevated risk.

  ### Prioritization

  This alert is of high severity due to its potential impact on the organization's security posture. Changes to identity providers can lead to unauthorized access and privilege escalation, making it crucial to investigate promptly. Such behavior is known to be weaponized by attackers seeking persistence within cloud environments.

  ### Blind Spots and Assumptions

  Detection may be limited if log retention settings for CloudTrail do not sufficiently cover the timeframe of investigation or if certain AWS account configurations are not monitored. Legitimate changes by system administrators can trigger this alert, particularly during routine audits or updates. A related detection for “IAM Policy Changes” offers complementary coverage to identify broader configuration changes that could indicate a more significant security breach.

