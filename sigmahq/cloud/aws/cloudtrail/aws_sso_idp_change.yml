note: |
  ### Technical Context
  This rule detects changes to the AWS Identity Center (formerly AWS SSO) identity provider configuration. Such changes can allow threat actors to gain persistent access to resources within the AWS environment by enabling user impersonation, thereby facilitating privilege escalation and unauthorized access to sensitive data. An attacker may exploit this situation to manipulate user identities, thereby bypassing security mechanisms and maintaining stealthy presence within the network.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1543)**, where an attacker establishes a foothold for long-term access, and **Credential Access (T1556)** for user impersonation through changes in the identity provider configuration. The technique **Defense Evasion (T1560)** may also apply as an attacker seeks to obscure malicious actions. The primary data source for this detection is AWS CloudTrail, which provides logs of all API calls made in the AWS environment, including those related to identity provider changes.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Analyze CloudTrail logs for the specified event sources and names to identify any unauthorized changes to the identity provider configuration.
  - **Cross-Reference User Roles**: Investigate the permissions and roles associated with the users who initiated the changes. Ensure they have proper authorization for making such alterations.
  - **Audit Identity Provider Configurations**: Examine the current identity provider settings to identify any anomalies or unauthorized changes, such as enabling external IdPs or disassociating directories.
  - **Analyze Related Access Patterns**: Review login and access logs for unusual activities from accounts that were potentially impacted by the identity provider changes, especially during or after the changes were made.

  ### Prioritization
  This alert is considered high-severity due to the significant risk posed by unauthorized identity provider changes within an AWS environment, potentially allowing attackers to impersonate users and gain persistent access, leading to data breaches or system compromises.

  ### Blind Spots and Assumptions
  There may be gaps in detection for legitimate changes made by authorized users, which could lead to false positives. The detection logic assumes that changes logged in CloudTrail are not legitimate administrative activities, which may not always be the case. For the alert to function as intended, it is important to ensure that CloudTrail logging is enabled and properly configured to capture all relevant identity provider changes within the AWS environment.

