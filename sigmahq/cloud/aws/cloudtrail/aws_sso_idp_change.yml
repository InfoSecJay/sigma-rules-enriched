note: |
  ### Technical Context

  This Sigma rule detects changes to the identity provider configuration within AWS Identity Center (formerly known as AWS SSO). Such changes can indicate an adversary's attempt to establish persistent access by impersonating users or escalating privileges within the cloud environment. The relevant MITRE ATT&CK tactics include **Persistence** (TA0050) and **Credential Access** (TA0006), specifically within the technique of **Credential Dumping** (T1556). The primary telemetry source is AWS CloudTrail logs, focusing on the `sso-directory.amazonaws.com` and `sso.amazonaws.com` event sources. A malicious change could allow unauthorized users to gain elevated access rights, impacting the overall security posture of the cloud environment. Importantly, this detection does not, on its own, confirm that the change was malicious or unauthorized; it only indicates that a configuration alteration occurred.

  ### Investigation Steps

  - **Verify the event details:** Review the AWS CloudTrail logs for event IDs related to identity provider changes such as `AssociateDirectory`, `DisassociateDirectory`, or `EnableExternalIdPConfigurationForDirectory`. Check fields like `userIdentity`, `eventName`, and `eventTime` to identify the initiator and timing of the change.

  - **Assess user context:** Identify the IAM user or role associated with the change. Confirm whether this identity is authorized for such modifications based on your organization’s access control policies. Legitimate users performing configurations should typically have a role such as `Administrator` or `Identity Center Admin`.

  - **Examine related security events:** Correlate the change with other security alerts or events, such as failed login attempts or changes to user permissions in IAM or Identity Center. Look for suspicious patterns indicating potential account compromise.

  - **Identify unauthorized changes:** Analyze the history of identity provider configurations to determine the legitimacy of the change. Unauthorized alterations often occur outside of planned maintenance windows or by unrecognized identities.

  - **Check for downstream impacts:** Assess whether the change led to modifications in user access rights or if new identity provider integrations were established. Review identity provider configurations for unexpected users or federated access that could indicate a breach.

  ### Prioritization

  This alert should be considered high severity due to the critical nature of identity provider changes, which can allow attackers persistent access to the environment. The likelihood of abuse is significant, as successful exploitation can lead directly to credential theft and further compromise of AWS resources. Given the elevated risk presented by such changes, they are commonly targeted in malicious campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the timing of the logged events, as AWS CloudTrail logs may not capture all changes in real-time if logging is incorrectly configured or if changes are made by a privileged user. Authorized changes by legitimate users may also trigger false positives, particularly during routine audits or updates. A companion detection to consider is monitoring for unusual sign-in activity through AWS CloudTrail that correlates with these identity provider changes, enhancing the overall coverage against potential abuse.

