note: |
  ### Technical Context

  This Sigma rule detects the creation of an IP set within AWS GuardDuty, which may indicate an attempt to alter security configurations by adding trusted IPs—potentially to suppress alerts for malicious IPs. The likely attacker objective is to evade detection from security mechanisms by manipulating trusted settings for their malicious activities. This behavior maps to the MITRE ATT&CK framework under the tactic of "Defense Evasion" (ID: TA0005) and the technique "Hide Artifacts" (ID: T1685).

  The primary telemetry source is AWS CloudTrail, specifically monitoring for event names such as `CreateIPSet`. The security impact of this action is significant if performed by an unauthorized user, as it may allow malicious actors to suppress detection of their activities within the environment. This detection does NOT confirm malicious intent on its own; legitimate changes may occur for valid reasons, such as changes to ignore internal scanning tools.

  ### Investigation Steps

  - **Review CloudTrail logs for CreateIPSet events**: Filter for `eventSource: guardduty.amazonaws.com` and `eventName: CreateIPSet`. Focus on the `userIdentity` field to determine if the user account belongs to an authorized administrator or a non-standard account.

  - **Check the IP addresses in the created IP set**: Compare the added IPs against threat intelligence feeds. Malicious IPs that align with known threat actors or patterns are high-confidence indicators of potential misuse.

  - **Verify the user’s role and recent activity**: Inspect the IAM role associated with the user making the change. Look for other suspicious actions within CloudTrail (Event ID: 1) that may indicate compromised credentials.

  - **Investigate context around the change**: Determine if there were any recent security alerts or unusual behavior reported in AWS services prior to the creation of the IP set. Unexpected changes near security incidents can imply malicious intent.

  - **Identify valid uses for CreateIPSet events**: Valid use cases typically include modifications to integrate internal scanner IPs. Document such cases to differentiate between benign and suspicious activities during investigation.

  ### Prioritization

  This alert is high severity due to the potential to undermine AWS GuardDuty's monitoring capabilities, impacting the organization’s defensive posture. The likelihood of malicious abuse is significant, as attackers often seek to evade detection. Altering trusted IP lists is a commonly weaponized tactic used in various intrusions.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate changes (e.g., for internal scanners) may produce similar alerts. Ensuring all relevant CloudTrail logs are configured and captured correctly is essential for reliable detection. Additionally, organizations may not fully audit or track IP set changes, creating blind spots. Related detections, such as unauthorized modifications to IAM roles or security groups, can provide complementary coverage and enhance alert validation.

