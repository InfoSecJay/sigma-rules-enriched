note: |
  ### Technical Context
  This rule detects modifications to the list of trusted IPs in AWS GuardDuty, specifically when a new IP set is created. Attackers may attempt to adjust these settings to suppress alerts related to their malicious activities, enabling them to operate without raising alarms. The likely objective is to create a false sense of security by whitelisting IPs associated with attacker infrastructure or internal tools used in an attack lifecycle.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), with a specific focus on the technique **Indicator Removal on Host** (T1562.001). By whitelisting specific IPs, an attacker could effectively neutralize the surveillance capabilities of GuardDuty, increasing the likelihood of successful reconnaissance and lateral movement in the cloud environment.

  The primary data source for detecting this behavior is AWS CloudTrail logs, which provide detailed records of actions taken in the AWS environment, including modifications to GuardDuty IP sets. Analysts should prioritize these logs for effective investigation of potential security breaches.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine AWS CloudTrail logs for events matching `CreateIPSet` under the `eventSource` of `guardduty.amazonaws.com`. Take note of user identity and source IPs.
  - **Correlate User Activity**: Analyze associated IAM user activity and permissions to ensure that the user who made the changes has appropriate authorization to modify GuardDuty settings.
  - **Identify Timing and Patterns**: Look for patterns or frequency of changes made to the trusted IP list, especially any recent or bulk modifications that deviate from normal operations.
  - **Cross-Reference Known Threats**: Cross-reference the whitelisted IPs against threat intelligence feeds to identify any known malicious IP addresses that may have been inappropriately whitelisted.

  ### Prioritization
  This alert merits a high severity level due to the significant impact it poses to cloud security posture. The likelihood of malicious actors leveraging this capability to evade detection makes it critical for prompt investigation and remediation.

  ### Blind Spots and Assumptions
  The detection assumes that modifications to IP sets are indicative of malicious intent, which may not account for legitimate operational changes, such as those made to support internal tools. Additionally, this rule may not capture changes made through other mechanisms outside of CloudTrail logging, or if logging is misconfigured or disabled. Proper CloudTrail logging configuration is essential for this alert to function effectively, as any gaps in log coverage could lead to undetected actions.

