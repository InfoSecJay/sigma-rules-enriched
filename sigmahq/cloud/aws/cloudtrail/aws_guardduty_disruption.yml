note: |
  ### Technical Context

  This rule detects changes to AWS GuardDuty's trusted IP list through the creation of an IP Set. The likely objective of this behavior is to allow or block specific IPs, potentially shielding malicious activities from detection by disabling alerts related to certain IPs. The related MITRE ATT&CK tactic is Defense Evasion (T1562.001). The primary telemetry source is AWS CloudTrail logs, specifically monitoring the `eventSource` of `guardduty.amazonaws.com` and `eventName` of `CreateIPSet`.

  If successful, this could significantly impact security by masking malicious behavior or allowing adversaries to interact undetected with the environment. It is important to note that detection of this activity does NOT confirm malicious intent on its own, as legitimate changes may occur, such as updates to cater for internal security scanning tools.

  ### Investigation Steps

  - **Verify GuardDuty configuration changes:** Check AWS CloudTrail logs for `eventSource: guardduty.amazonaws.com` and `eventName: CreateIPSet` to identify the time and user initiating changes. Compare timestamps with other significant security events for context.

  - **Identify user and source of changes:** Review the `userIdentity` field in CloudTrail logs to confirm the user account executing the change. Investigate if the account has a legitimate business need or if it reflects unusual activity, such as being a service account or an unexpected user.

  - **Assess IPs in the trusted list:** If `CreateIPSet` is identified, examine the contents of the updated IP Set for any known suspicious IPs or ranges that could indicate malicious activity. A high-confidence malicious indicator would be the presence of IPs associated with known threats.

  - **Determine the context of the changes:** Understand the reasoning behind the IP Set updates by checking related service logs or communications (e.g., team tickets or Change Management logs) to identify if the alterations correspond to established protocols or were authorized without oversight.

  - **Analyze patterns in historical changes:** Review previous CloudTrail logs for frequency and patterns of `CreateIPSet` events, identifying any repetitive behaviors or changes that coincide with suspicious account activities. This can indicate potential threat actor behavior by observing unapproved patterns.

  - **Check for legitimate internal activities:** Look for documented internal changes pertaining to trusted IPs, such as authorized pen testing or security scans that necessitated updates to GuardDuty's IP lists. Legitimate activities typically would be logged in service announcements or change notifications.

  ### Prioritization

  The alert is high priority due to its potential impact on the integrity of AWS GuardDuty security alerts. Since trusted IP configuration can significantly decrease the likelihood of detecting malicious behavior, unauthorized changes are often indicative of initial infiltration vectors and are commonly exploited by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by possible evasion techniques, such as sophisticated attackers using legitimate accounts to create or modify IP sets. Requires that CloudTrail logging is properly configured for GuardDuty to capture all relevant events. Legitimate activities may include internal security protocols, such as scanning allowances for internal IPs. A companion detection rule monitoring suspicious IAM role changes could enhance coverage against unauthorized access attempts.

