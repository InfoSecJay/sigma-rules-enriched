title: New AWS Lambda Function URL Configuration Created
id: ec541962-c05a-4420-b9ea-84de072d18f4
status: experimental
description: |
  Detects when a user creates a Lambda function URL configuration, which could be used to expose the function to the internet and potentially allow unauthorized access to the function's IAM role for AWS API calls.
  This could give an adversary access to the privileges associated with the Lambda service role that is attached to that function.
references:
- https://docs.aws.amazon.com/lambda/latest/dg/API_CreateFunctionUrlConfig.html
- https://cloud.hacktricks.xyz/pentesting-cloud/aws-security/aws-privilege-escalation/aws-lambda-privesc
- https://www.wiz.io/blog/how-to-set-secure-defaults-on-aws
author: Ivan Saakov
date: 2024-12-19
tags:
- attack.initial-access
- attack.privilege-escalation
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: lambda.amazonaws.com
    eventName: 'CreateFunctionUrlConfig'
  condition: selection
falsepositives:
- Creating a Lambda function URL configuration may be performed by a system 
  administrator. Verify whether the user identity, user agent, and/or hostname 
  should be making changes in your environment.
- Creating a Lambda function URL configuration from unfamiliar users should be 
  investigated. If known behavior is causing false positives, it can be exempted
  from the rule.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a Lambda function URL configuration, which exposes the Lambda function to the internet. An attacker may leverage this misconfiguration to gain unauthorized access to the function's IAM role, allowing them to perform additional AWS API calls with elevated privileges. This behavior aligns with the MITRE ATT&CK tactics of Initial Access (TA0001) and Privilege Escalation (TA0004), specifically targeting the technique for Application Layer Protocol (T1071). The primary telemetry source is AWS CloudTrail logs, capturing events related to AWS Lambda service actions. If malicious, this activity could lead to unauthorized access to sensitive resources or data exfiltration. However, this detection does NOT confirm that malicious activity has occurred on its own, as legitimate users may also create function URLs for valid purposes.

  ### Investigation Steps

  - **Review recent Lambda configurations:** Check AWS CloudTrail logs for Event Name `CreateFunctionUrlConfig` (Event ID: N/A) and note the `userIdentity` and `sourceIPAddress` to confirm whether the user is part of a known operational team or appears suspicious.

  - **Correlate user actions with IAM roles:** Investigate the IAM role associated with the Lambda function created. Look for any permissions that may grant excessive privileges compared to standard operations. Evaluate based on IAM policy ARN fields.

  - **Identify legitimate usage patterns:** Validate if the user has a documented reason for creating a function URL. Cross-reference with operational logs or internal policies to establish their authority to make such changes.

  - **Check for additional anomalous events:** Look for related events around the time of the `CreateFunctionUrlConfig`, such as unusual API calls from the same user identity or IP address, especially for privileged API actions (e.g., Create, Update, or Delete actions on IAM).

  - **Investigate IAM role policies for exposure risks:** Analyze the role tied to the function for any overly permissive IAM policies that might be exploited. Focus on policy ARNs in the CloudTrail logs that could expose sensitive information or grant administrative access.

  - **Assess previous Lambda URL configurations:** Review past configurations by extracting all Lambda function configurations within AWS CloudTrail to understand the historical context. Use AWS CLI/API to list configurations and assess changes over a defined period.

  ### Prioritization

  This alert has medium severity due to the potential impact on the affected system, as it can expose sensitive functions to unauthorized access. The likelihood of malicious usage increases if the action originates from unknown or unfamiliar user identities, making it critical to assess the context surrounding the event. Abusers may weaponize this configuration to gain escalated privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of CloudTrail logging for all API events, which can lead to non-detection of similar unauthorized activities. Legitimate system administrators may trigger this alert when performing normal deployments. It's essential to ensure comprehensive logging is enabled to catch all relevant events and consider companion detections, such as monitoring for changes to IAM policies or other Lambda function configurations for enhanced threat visibility.

