logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: lambda.amazonaws.com
    eventName: 'CreateFunctionUrlConfig'
  condition: selection
falsepositives:
- Creating a Lambda function URL configuration may be performed by a system administrator.
  Verify whether the user identity, user agent, and/or hostname should be making changes
  in your environment.
- Creating a Lambda function URL configuration from unfamiliar users should be investigated.
  If known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the creation of a configuration for an AWS Lambda function URL, which may unintentionally expose the function to the public internet. Such exposure could allow unauthorized users to access the function's IAM role and its privileges. The likely attacker objective is to leverage misconfigurations for unauthorized access and privilege escalation within the AWS environment. This behavior relates to the MITRE ATT&CK tactic **Initial Access (TA0001)** and technique **Exploitation for Client Execution (T1203)** when misconfigured services are exploited.

  The primary telemetry source is AWS CloudTrail, specifically tracking events related to Lambda service actions. If this behavior is malicious, it could lead to unauthorized data access or manipulation. Importantly, this detection does not confirm exploitation; it merely indicates that a potentially risky configuration was created.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for the event:** Check CloudTrail for Event Name `CreateFunctionUrlConfig`. Look specifically for log types under the AWS Lambda service detailing the user ID and source IP involved in the action.

  - **Identify user and role context:** Verify the Identity and Access Management (IAM) roles associated with the user who executed the creation. Cross-reference against expected IAM roles to identify anomalies.

  - **Assess legitimate usage patterns:** Check the organization’s SOP for creating Lambda configurations. If the action is frequently undertaken by your DevOps team under specific circumstances (e.g., new deployments), document this as benign.

  - **Validate IAM role permissions:** Review the permissions associated with the Lambda function's IAM role. Ensure they are not overly permissive and check for role trust policies that might allow unexpected AWS accounts.

  - **Revoke or investigate unauthorized configurations:** If the trigger was generated by an unfamiliar user or during unexpected hours, correlate with other security tools (e.g., SIEM) for suspicious activity.

  - **Monitor for subsequent API calls:** Post-creation monitoring for API calls made by the configured Lambda function URL, checking for unusual patterns or actions could signal ongoing malicious activity.

  ---

  ### Prioritization

  This alert is of medium severity as it indicates a potential misconfiguration that could be exploited. The impact could be significant if a critical Lambda function is accessible without proper authentication. Misconfiguration in cloud services like AWS Lambda is commonly exploited, making this a relevant concern for SOC analysts.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited by missing CloudTrail logs; ensure logging is enabled for all necessary AWS services. Legitimate actions may include routine updates by trusted administrators. Additionally, the alert may not capture configurations made through infrastructure-as-code tools (e.g., Terraform). Companion detections like monitoring IAM role changes or unauthorized API calls to AWS Lambda can strengthen coverage.

