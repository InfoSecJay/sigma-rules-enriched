- Creating a Lambda function URL configuration from unfamiliar users should be investigated.
  If known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This rule detects the creation of AWS Lambda function URL configurations, a potential vector for exposing serverless functions to the internet. When a Lambda function URL is configured, it opens up the function to public access, permitting external entities to invoke it. This could lead to unauthorized access to the Lambda function's underlying IAM roles, enabling attackers to exploit the function for malicious actions, including privilege escalation within the AWS environment.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Initial Access (T1078)**, as an improperly configured Lambda URL may facilitate unauthorized entries, and **Privilege Escalation (T1068)** if compromised access to the IAM role grants additional privileges to an attacker. These considerations highlight the importance of maintaining strict controls over who can create and configure such URLs.

  The best evidence for this detection will primarily come from **AWS CloudTrail logs**, which record the relevant API calls and changes made to Lambda configurations, enabling visibility into who created the URL and under what circumstances.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Check the AWS CloudTrail logs for the `CreateFunctionUrlConfig` event to capture details about when and by whom the configuration was created, including the user identity and source IP.
  - **Verify User Authenticity**: Assess whether the user who created the function URL is authorized and if the action aligns with their normal behavior, focusing on unusual user agents or hosts.
  - **Inspect Lambda Execution Role Policies**: Analyze the IAM role associated with the Lambda function to determine the permissions granted and evaluate potential impacts of exploitation if the function URL had been misconfigured.
  - **Cross-Reference with Asset Inventory**: Confirm whether the Lambda function in question aligns with your organization's asset inventory and security policies, reviewing the purpose and expected access levels for that function.

  ### Prioritization
  This alert is marked as medium severity due to the potential risk of unauthorized access and privilege escalation that could result from misconfigured Lambda function URLs. Given the increasing reliance on serverless architectures, any exposure could lead to significant consequences.

  ### Blind Spots and Assumptions
  This detection rule may not capture all unauthorized URL creations if CloudTrail logs are not properly configured or if access to these logs is restricted. It assumes that the environment has adequate logging enabled for CloudTrail events and that all user actions are recorded. Additionally, organizations may experience false positives when legitimate users, such as administrators, create function URLs as part of their routine operations, potentially obscuring genuine malicious activities. Continuous monitoring and tuning of the detection logic will be essential to achieve optimal coverage.

