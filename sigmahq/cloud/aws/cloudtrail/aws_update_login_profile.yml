title: AWS User Login Profile Was Modified
id: 055fb148-60f8-462d-ad16-26926ce050f1
status: test
description: |
  Detects activity when someone is changing passwords on behalf of other users.
  An attacker with the "iam:UpdateLoginProfile" permission on other users can change the password used to login to the AWS console on any user that already has a login profile setup.
references:
- https://github.com/RhinoSecurityLabs/AWS-IAM-Privilege-Escalation
author: toffeebr33k
date: 2021-08-09
modified: 2024-04-26
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName: 'UpdateLoginProfile'
  filter_main_user_identity:
    userIdentity.arn|fieldref: requestParameters.userName
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate user account administration
level: high
note: |
  ### Technical Context
  This detection rule identifies modifications to AWS user login profiles, specifically focusing on when one user changes the login credentials of another. Such activity typically indicates an attacker with the necessary permissions leveraging the "iam:UpdateLoginProfile" capability to gain unauthorized access to other user accounts within an AWS environment. By altering login profiles, attackers may bypass existing security measures, impersonate legitimate users, and execute malicious operations under their credentials.

  The primary threat scenario involves a compromised AWS account or a malicious insider with escalating privileges, using these changes to conduct further reconnaissance or launch attacks. Modifying login profiles can serve various malicious objectives, including account Takeover and unauthorized data access. This behavior aligns with several relevant MITRE ATT&CK tactics and techniques, notably **Persistence** (T1098 - Account Manipulation) and **Privilege Escalation**.

  The best evidence for detecting this behavior can be sourced from AWS CloudTrail logs, which capture all API interactions with the IAM service, including login profile updates.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Check AWS CloudTrail logs for `UpdateLoginProfile` events. Pay attention to timestamps and user identities involved in these changes, especially looking for any anomalies.
  - **Identify User Identity Changes**: Investigate the user accounts whose profiles were altered. Determine if there’s a connection between these changes and any reported security incidents or suspicious activities.
  - **Audit Permissions**: Examine the IAM permissions associated with the user making the changes. Identify if they have legitimate reasons for possessing the "iam:UpdateLoginProfile" privilege or if this is indicative of privilege escalation.
  - **Correlate with Other Activities**: Look for related suspicious activities in the AWS environment, such as unusual console logins or failed authentication attempts, to gauge if this modification is part of a broader unauthorized access attempt.

  ### Prioritization
  The severity of this alert is high due to the potential for misuse of credentials and unauthorized access to sensitive resources. Given the critical nature of AWS accounts in cloud infrastructures, any changes to user login profiles may indicate escalating privilege abuse or account takeover, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, especially in dynamic environments where legitimate user account administration might also trigger similar events. The detection logic assumes that all user actions relying on the `iam:UpdateLoginProfile` permission are worth flagging, disregarding the context of potential legitimate administrative changes. For optimal alert functionality, organizations must ensure comprehensive logging is enabled for AWS CloudTrail, specifically monitoring IAM-related events to capture all relevant activities effectively.

