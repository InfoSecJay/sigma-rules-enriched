logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName: 'UpdateLoginProfile'
  filter_main_user_identity:
    userIdentity.arn|fieldref: requestParameters.userName
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate user account administration
level: high
note: |
  ---

  ### Technical Context

  This rule detects changes made to AWS user login profiles through the `iam:UpdateLoginProfile` API. The likely attacker objective is to gain unauthorized access to the AWS Management Console by changing the passwords of other users, thereby enabling further actions within the environment. The relevant MITRE ATT&CK technique is Privilege Escalation via the `User Credentials` manipulation (T1098).

  Primary telemetry comes from AWS CloudTrail logs, specifically tracking any `UpdateLoginProfile` event. A malicious change to a user's login profile can allow an adversary to bypass authentication safeguards and potentially compromise sensitive resources. This detection does NOT confirm that an unauthorized account compromise occurred, as legitimate administrative activities can trigger similar events.

  ---

  ### Investigation Steps

  - **Verify the user modification request source:** Check CloudTrail logs for the `UpdateLoginProfile` API call. Look for suspect `userIdentity.arn` which may indicate an unusual login path (e.g., unfamiliar IP addresses or geographic locations).

  - **Identify the affected user accounts:** Review the `requestParameters.userName` field in the CloudTrail log entry to determine which user’s login profile was modified. Compare this against your organization's user account matrix.

  - **Assess login activity of the modified account:** Investigate the login history of the affected user(s) to confirm if they have logged in recently and if the access was legitimate. Check for AWS CloudTrail `ConsoleLogin` events associated with the affected user.

  - **Document legitimate administrative actions:** Consult your IAM and administration policies to ascertain if this password change aligns with expected administrative tasks. If done through an authorized process or on a scheduled basis, it may be benign.

  - **Look for indicators of account compromise:** Analyze the account activity logs for the IAM user executing the password change. Look for any recent unauthorized AWS services access attempts or unusual CloudTrail event patterns linked with that IAM user.

  - **Review any IAM policy changes:** Verify if any IAM policies were modified recently that grant elevated privileges to the user initiating the change. Search through CloudTrail logs for `PutUserPolicy`, `AttachUserPolicy`, or `DetachUserPolicy` events.

  ---

  ### Prioritization

  This alert has a high severity due to the inherent risks associated with unauthorized password changes in cloud environments. The affected system's criticality may be significant if it involves users with access to sensitive or high-value resources, and this behavior is a common tactic used by adversaries to exploit AWS accounts and escalate privileges.

  ---

  ### Blind Spots and Assumptions

  Detection may miss attempts where an attacker uses shared accounts or impersonates legitimate users. Ensure that AWS CloudTrail logging is fully enabled for comprehensive coverage and consider the use of multi-factor authentication (MFA) to mitigate risks. Legitimate administrative functions may trigger this alert during user management tasks. A related detection to consider is monitoring for the `DeleteLoginProfile` API call, which can also indicate malicious intent if occurring alongside other suspicious activities.

