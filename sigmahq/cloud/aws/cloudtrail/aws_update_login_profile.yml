title: AWS User Login Profile Was Modified
id: 055fb148-60f8-462d-ad16-26926ce050f1
status: test
description: |
  Detects activity when someone is changing passwords on behalf of other users.
  An attacker with the "iam:UpdateLoginProfile" permission on other users can change the password used to login to the AWS console on any user that already has a login profile setup.
references:
- https://github.com/RhinoSecurityLabs/AWS-IAM-Privilege-Escalation
author: toffeebr33k
date: 2021-08-09
modified: 2024-04-26
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName: 'UpdateLoginProfile'
  filter_main_user_identity:
    userIdentity.arn|fieldref: requestParameters.userName
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate user account administration
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to AWS user login profiles through the `UpdateLoginProfile` event, indicating potential unauthorized password changes. An attacker who has been granted permissions to update login profiles can misuse this capability to gain access to accounts, facilitating further privilege escalation and lateral movement within the AWS environment. This falls under the MITRE ATT&CK tactic of Persistence, specifically technique T1098 (Account Manipulation).

  The primary telemetry source for this detection is AWS CloudTrail, specifically monitoring events from the IAM service. If malicious, this action could compromise account integrity and lead to unauthorized access to sensitive resources. It is important to note that this detection does NOT alone confirm malicious activity, as legitimate user account administration can also result in these events.

  ### Investigation Steps

  - **Review CloudTrail logs for `UpdateLoginProfile`:** Search for `eventName: "UpdateLoginProfile"` in the CloudTrail logs (Event Source: `iam.amazonaws.com`). This indicates a password change attempt on a login profile.

  - **Identify user identity in the event:** Correlate the `userIdentity.arn` with `requestParameters.userName` to determine which user’s login profile was modified. Check if the modifying user has appropriate administrative privileges or unusual access levels.

  - **Assess role and permissions of the modifying user:** Validate the IAM policies associated with the user performing the modification. Compare permissions against what is necessary for their role to identify any privilege escalation.

  - **Check for legitimate account administration:** Look for expected administrative activity timestamps aligned with user role responsibilities. Identify whether the event corresponds with regular maintenance windows or known administrative actions.

  - **Correlate with other account activity:** Investigate other actions performed by the modifying user around the same timeframe using CloudTrail to identify potentially malicious patterns, such as access to sensitive S3 buckets or changes to other IAM policies.

  - **Monitor for unusual login behavior post-modification:** Review CloudTrail logs for subsequent `ConsoleLogin` events for the affected user to determine if unauthorized access occurred after the password change.

  ### Prioritization

  This alert is high severity due to the potential impact on account integrity and access to AWS resources. The likelihood of malicious use is significant if the event is performed by an unauthorized user or an administrator with excessive privileges. Such behavior is commonly weaponized by attackers to gain persistent access within compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for CloudTrail is not configured comprehensively; the absence of logs can hinder the ability to catch unauthorized changes. Legitimate user activity, such as routine password updates for compliance, may also trigger this alert. A related detection to strengthen coverage could involve monitoring for `CreateUser` or `DeleteUser` events, which may accompany malicious account modifications.

