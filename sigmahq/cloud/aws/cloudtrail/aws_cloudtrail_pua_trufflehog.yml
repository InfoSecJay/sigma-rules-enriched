note: |
  ### Technical Context

  This rule detects the execution of TruffleHog, a tool used for scanning code repositories for sensitive information such as API keys and credentials, within AWS environments. Attackers may leverage TruffleHog to harvest credentials from repositories for further exploitation. The relevant MITRE ATT&CK tactics and techniques are Credential Access (TA0006) and Credential Dumping (T1555, T1003). The primary telemetry source is AWS CloudTrail logs, specifically monitoring the userAgent field for entries indicating TruffleHog usage.

  If malicious, the execution of TruffleHog could facilitate unauthorized access to critical systems by revealing sensitive credentials. This detection does NOT confirm whether the execution was authorized by security teams, and further investigation is needed to determine intent and context.

  ### Investigation Steps

  - **Review CloudTrail logs for TruffleHog activity**: Filter for CloudTrail logs where `userAgent` contains 'TruffleHog'. Note the `eventTime`, `eventName`, and `sourceIPAddress` for sessions users.

  - **Identify user context and IAM role**: Check the `userIdentity` field from CloudTrail logs to determine the IAM role associated with the activity. Verify if this role is usually permitted to conduct such scans.

  - **Examine repository contents for sensitive data**: Analyze the repositories scanned during the TruffleHog execution. Check for exposed secrets and validate if legitimate security assessments were underway (e.g., authorized scans should reference specific security policies).

  - **Establish communication patterns**: Investigate network traffic logs (e.g., VPC Flow Logs or AWS Network Access Logs) to identify any outbound connections to suspicious IP addresses or domains following TruffleHog execution.

  - **Cross-reference with known threat actors**: Use intelligence feeds to assess if the behavior aligns with known threat actor tactics, techniques, and procedures (TTPs) identified in relevant sources, such as the Rapid7 blog referencing new threat groups operating in the cloud.

  ### Prioritization

  This alert should be considered of medium severity. The impact can vary significantly based on the role of the affected systems, as unauthorized credential harvesting could lead to escalation of privileges and compromise of critical assets. The usage of TruffleHog in cloud environments can indicate malicious intent, especially when associated with abnormal user patterns, although it may also be deployed legitimately by security teams.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where logging is misconfigured or inadequately monitored. Attackers could be employing obfuscation techniques to hide their true user agent or using alternative credential harvesting methods that are less detectable. Additionally, legitimate security assessments, when communicated poorly among teams, may trigger similar alerts. A complementary detection could be monitoring for unusual access patterns to sensitive AWS resources, such as unauthorized attempts to access other AWS services following TruffleHog execution.

