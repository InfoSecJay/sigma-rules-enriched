note: |
  ### Technical Context

  This rule detects specific administrative actions in AWS CloudTrail, namely the disabling, deleting, or updating of a CloudTrail. These actions can potentially indicate an attacker’s attempt to cover their tracks by preventing logging of subsequent malicious activity. The likely attacker objective is to manipulate service configurations to evade detection of further actions, aligning with the MITRE ATT&CK tactic of Defense Evasion (T1561) and specifically the technique of Impair Defenses (T1685).

  Primary telemetry sources include AWS CloudTrail logs, specifically focusing on event data capturing changes to CloudTrail configurations such as `StopLogging`, `UpdateTrail`, or `DeleteTrail`. If these actions are executed maliciously, the security impact could be severe, as it undermines the integrity of activity monitoring in the AWS environment. However, the detection does NOT confirm malicious intent on its own; valid administrative changes can trigger these alerts as well.

  ### Investigation Steps

  - **Review CloudTrail log entries:** Cross-reference TimeStamp and eventName fields for any `StopLogging`, `UpdateTrail`, or `DeleteTrail` events (Event Name) from CloudTrail logs. Identify the IAM user or role responsible for these actions.

  - **Identify legitimate administrative activity:** Check for logged actions by known AWS administrators during typical maintenance windows. Confirm that changes align with documented procedures or change management calendars.

  - **Examine associated IAM user roles:** Investigate permissions assigned to users or roles that executed the changes. Look for potential privilege escalation or access anomalies.

  - **Validate system behavior post-event:** Assess other CloudTrail logs for unusual activity after the changes were made, especially queries, config changes, or deletion of resources that could suggest attempted obfuscation.

  - **Look for related API calls:** Assess for sequences of API calls where `StopLogging` is followed by potentially suspicious actions like `RunInstances` or `DeleteBucket`. The presence of these calls post-configuration change can indicate malicious intent.

  - **Check for configuration backup:** Confirm if backup configurations or logs exist prior to `UpdateTrail` or `DeleteTrail`. This can help establish if the change was planned or part of a potential malicious workflow.

  ### Prioritization

  This alert is medium severity due to the potential impact on monitoring capabilities in critical systems. The likelihood of malicious abuse is moderate, as disabling or manipulating logging is a common tactic among adversaries to maintain persistence. These behaviors are weaponized often, particularly in targeted attacks against multi-cloud environments like AWS.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative changes masking malicious behavior. Requires comprehensive logging from AWS CloudTrail and correctly configured IAM policies for reliable detection. Legitimate activities that may trigger this alert include standard operational changes during scheduled maintenance. A related detection for broader coverage includes monitoring for suspicious API calls across other AWS services that align with attempted evasions.

