note: |
  ### Technical Context
  This rule detects significant modifications to AWS CloudTrail configurations, specifically events where logging is stopped, a trail is updated, or a trail is deleted. These actions can indicate potentially malicious activity, such as an attacker attempting to evade detection by disabling logging mechanisms that capture user activity and API calls within an AWS environment. The likely objectives of an attacker in this scenario may include hiding their tracks after conducting unauthorized operations or attempting to establish persistence without being detected.

  The applicable MITRE ATT&CK tactics include **Defense Evasion** (T1562) and specifically the sub-technique **Disable Cloud Logs** (T1562.008). By disabling, deleting, or modifying CloudTrail logging settings, an attacker can effectively obscure their actions, making it more difficult for security teams to investigate incidents or monitor for unusual behavior.

  Key telemetry for this detection includes CloudTrail logs that document all API calls made to AWS services, specifically targeting events related to CloudTrail trails. This data source provides the essential evidence needed to identify unauthorized changes to logging configurations.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Analyze recent CloudTrail logs for StopLogging, UpdateTrail, or DeleteTrail events, paying attention to the principal user/role involved and the timing of these changes.
  - **Check IAM User Activities:** Query AWS Identity and Access Management (IAM) logs to establish whether the user or role executing the changes has unusual or unauthorized access rights, recent access patterns, or potential indicators of compromise.
  - **Audit Permissions:** Evaluate the permissions tied to the user/role who executed the logging changes to identify any overly permissive settings that could allow unauthorized actions.
  - **Identify Related Activities:** Investigate any preceding or subsequent activities linked to the same user/role, particularly those involving resource modifications or IAM changes, to determine if there’s a broader pattern of suspicious behavior.

  ### Prioritization
  This alert is considered medium severity due to the potential impact on an organization’s ability to detect and respond to threats. If logging is disabled or deleted, it hampers the overall security posture and increases the risk of undetected malicious activities.

  ### Blind Spots and Assumptions
  This detection may miss legitimate administrative actions by authorized users or automated processes that manage CloudTrail configurations. The logic assumes that only malicious actors would disable or modify logging settings without valid operational reasons. Additionally, proper configurations must be in place to ensure that CloudTrail logging is active and sending logs to a reliable, secure destination for analysis. If CloudTrail is not configured correctly or is not logging API calls, detection capabilities will be significantly weakened.

