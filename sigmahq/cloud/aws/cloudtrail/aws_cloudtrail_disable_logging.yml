note: |
  ### Technical Context

  This rule detects actions taken to stop, update, or delete an AWS CloudTrail, which is crucial for maintaining an audit trail of API activity within an AWS account. The likely adversary objective is to evade detection and maintain persistence by altering or disabling logging features. Relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically technique "Disable or Modify Tools" (T1562.008). The primary telemetry sources include AWS CloudTrail logs, specifically focusing on the event source `cloudtrail.amazonaws.com` and event names `StopLogging`, `UpdateTrail`, and `DeleteTrail`.

  If an attacker's objective successfully compromises CloudTrail, they can execute malicious activities without being logged, significantly impacting the organization's ability to investigate incidents. This detection does NOT prove malicious intent on its own, as legitimate changes by administrators can also trigger the alert.

  ### Investigation Steps

  - **Check recent CloudTrail activity:** Review CloudTrail logs for `StopLogging`, `UpdateTrail`, or `DeleteTrail` events. Document the `userIdentity` field to identify the AWS principal making the changes. Compare timestamps with known maintenance windows to confirm legitimacy.

  - **Identify user roles:** Validate the associated IAM roles/permissions of the initiator found in the `userIdentity` field. Legitimate admin users would typically have roles such as `AdministratorAccess`. Unexpected roles or changes indicate potential malicious activity.

  - **Examine event details:** Look for unusual values in the `requestParameters` within the detected events. If `StopLogging` is initiated for a previously active trail with no valid justification, this is a strong indicator of malicious intent.

  - **Review service access patterns:** Analyze other CloudTrail events leading up to the detected changes, specifically focusing on unusual patterns tied to an account. Compare this to established baseline behavior.

  - **Investigate alert history:** Utilize AWS Config to check configuration history for the affected CloudTrail. Look for frequency and timing of logging modifications; multiple changes over brief periods could indicate evasion attempts.

  - **Cross-reference with security tools:** Match incidents against endpoints or alerts from security tools for simultaneous suspicious activity like unauthorized access patterns or escalated privileges.

  ### Prioritization

  This alert should be treated with medium severity due to the importance of CloudTrail in incident detection. The likelihood of malicious abuse is high, especially if threats are targeting logging services to hide their tracks. Given the common exploitation of CloudTrail settings, timely investigation is essential.

  ### Blind Spots and Assumptions

  Detection may be limited by the loss of logs if CloudTrail is stopped or deleted and could be circumvented by sophisticated attackers who possess IAM permissions. All relevant AWS CloudTrail logging sources need to be enabled appropriately for comprehensive visibility. Legitimate administrative activity such as scheduled maintenance can trigger the alert, necessitating context for accurate investigation. Companion detections include monitoring for IAM changes that may indicate privileged account manipulation alongside CloudTrail modifications.

