title: AWS EnableRegion Command Monitoring
id: a5ffb6ea-c784-4e01-b30a-deb6e58ca2ab
status: experimental
description: |
  Detects the use of the EnableRegion command in AWS CloudTrail logs.
  While AWS has 30+ regions, some of them are enabled by default, others must be explicitly enabled in each account separately.
  There may be situations where security monitoring does not cover some new AWS regions.
  Monitoring the EnableRegion command is important for identifying potential persistence mechanisms employed by adversaries, as enabling additional regions can facilitate continued access and operations within an AWS environment.
references:
- https://docs.aws.amazon.com/accounts/latest/reference/API_EnableRegion.html
- https://awscli.amazonaws.com/v2/documentation/api/2.14.0/reference/account/enable-region.html
author: Ivan Saakov, Sergey Zelenskiy
date: 2025-10-19
tags:
- attack.persistence
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'EnableRegion'
    eventSource: 'account.amazonaws.com'
  condition: selection
falsepositives:
- Legitimate use of the EnableRegion command by authorized administrators.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `EnableRegion` command within AWS CloudTrail logs. Attackers may utilize this command to enable AWS regions that are not enabled by default as a persistence mechanism, allowing them continued access to an environment. The relevant MITRE ATT&CK tactics and techniques are Persistence (T1546) and Cloud Service Account Credential Dumping (T1550). Primary telemetry sources include AWS CloudTrail log events, specifically looking for entries where the `eventName` is `EnableRegion` and the `eventSource` is `account.amazonaws.com`.

  The security impact can be substantial if an unauthorized user enables a new region, as it may indicate an escalation of access privileges or an attempt to maintain persistence in the environment. Importantly, this detection alone does not confirm malicious activity; further analysis is required to evaluate the context of the command execution and associated user identities.

  ### Investigation Steps

  - **Examine CloudTrail logs for `EnableRegion` events**: Look for CloudTrail logs with `eventName` set to `EnableRegion`, filtering for the `eventSource` `account.amazonaws.com`. Check for `userIdentity` fields to determine if a legitimate user triggered the action or if it appears anomalous.

  - **Validate the IAM role of the user executing the command**: Review the associated `userIdentity.arn` in the CloudTrail event to identify the permissions granted. Compare against typical administrative role behavior; look for deviations, such as roles with limited access suddenly altering multiple regions.

  - **Check if the region was previously disabled**: Identify the existing regions within the AWS account using the AWS CLI (`aws ec2 describe-regions`). If the enabled region is not frequently utilized in the organization, it may raise suspicion.

  - **Look for unusual activity surrounding the command**: Investigate recent AWS API calls made by the same user or role to assess behavior patterns, focusing on account management and security services like IAM or security groups.

  - **Assess legitimate user patterns**: Discuss with the cloud management team to understand scheduled maintenance, testing, or expansions that may explain enabling a new region. If these reasons align with expected behaviors, document them for further clarity.

  - **Identify a high-confidence malicious indicator**: If the command execution occurs after hours or from an unusual IP address, such as a foreign location or a known proxy, flag this as a strong indicator of malicious intent.

  ### Prioritization

  This alert should be treated as medium severity due to the potential for significant impact if an unauthorized user has enabled a new region. The likelihood of abuse is moderate, as such operations may be targeted to facilitate illicit activities. While the command itself may not be commonly weaponized, it forms a critical component in broader attack vectors associated with persistence in cloud environments.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate commands executed by authorized users, which may trigger the alert. Further, if CloudTrail logging is not enabled for all regions, activities in those regions may go undetected. Additionally, legitimate activities such as routine expansions or configurations may cause misinterpretations of the command's intentions. A related detection to consider might include monitoring for unusual IAM changes or usage patterns (e.g., `AddUserToGroup`, `PutUserPolicy`) which could indicate compromised credentials or unauthorized access attempts.

