- https://docs.aws.amazon.com/accounts/latest/reference/API_EnableRegion.html
- https://awscli.amazonaws.com/v2/documentation/api/2.14.0/reference/account/enable-region.html
author: Ivan Saakov, Sergey Zelenskiy
date: 2025-10-19
tags:
- attack.persistence
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: 'EnableRegion'
    eventSource: 'account.amazonaws.com'
  condition: selection
falsepositives:
- Legitimate use of the EnableRegion command by authorized administrators.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the `EnableRegion` command in AWS CloudTrail logs. The command is utilized to enable geographical regions within an AWS account that may not be activated by default. Attackers may exploit this functionality as a potential persistence mechanism, allowing them to maintain access to an AWS environment by activating regions for executing malicious operations without detection. By monitoring the `EnableRegion` command, security teams can identify unusual or unauthorized changes that may signal potential malicious activity.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1543)**, as enabling additional regions can provide attackers with alternative environments to operate from undetected. Another applicable technique is **Account Manipulation (T1098)** as it involves altering account-level configurations that can lead to account misuse. This alert is primarily driven from AWS CloudTrail logs, which record all account activity and API calls made within the AWS environment, offering visibility into potentially malicious changes.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Gather the CloudTrail logs and filter for the `EnableRegion` command. Note the timestamp, user identity, and source IP associated with the command's execution.
  - **Verify User Permissions**: Cross-reference the identity executing the command with your IAM policies to assess whether they have appropriate permissions to execute the `EnableRegion` action. Investigate if the action aligns with known roles and responsibilities.
  - **Check for Anomalies**: Analyze if the region being enabled was already active or if it is an unusual region for the organization. Look for patterns of behavior such as enabling multiple regions in quick succession or by unexpected users.
  - **Assess Regional Resources**: If the command was executed legitimately, confirm that no unauthorized resources were created in the newly enabled region. Verify that all activities align with the organization’s operational needs and comply with security policies.

  ### Prioritization
  This alert should be considered medium to high priority due to the potential security risks associated with enabling additional AWS regions, which can allow persistence, lateral movement, and unauthorized access if abused.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if CloudTrail logging is not enabled for all regions or if there are gaps in visibility due to IAM role misuse. This rule assumes that all legitimate administrator actions are appropriately logged and that user permissions are regularly monitored. Proper configuration of AWS CloudTrail is essential for this detection to function effectively, as it requires comprehensive logging of AWS account events across all enabled regions.

