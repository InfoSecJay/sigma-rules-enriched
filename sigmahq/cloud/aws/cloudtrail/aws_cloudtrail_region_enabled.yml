note: |
  ---

  ### Technical Context

  This rule detects the execution of the `EnableRegion` command in AWS CloudTrail logs. This command is used to enable specific AWS regions that may not be enabled by default for the account, potentially allowing adversaries to establish unauthorized persistence and access regions for malicious activities. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), and the associated technique is **Enable Account Functionality** (T1078).

  The primary telemetry source is AWS CloudTrail, which logs API calls and user activity within the AWS environment. If malicious, enabling additional regions can facilitate lateral movement, data exfiltration, or establishing footholds that may evade detection. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate users may execute this command as part of routine administration.

  ---

  ### Investigation Steps

  - **Verify the user executing the command:** Review CloudTrail logs for the `UserIdentity` field associated with the `EnableRegion` event (Event Name: `EnableRegion`). Determine if the user has a history of administrative actions or has the requisite permissions for enabling AWS regions.

  - **Check for unusual regional activity:** Look for recent `EnableRegion` commands and correlate them with any subsequent activities in those regions. Review logs for any unusual resource creation or management within these regions (Event IDs: `CreateInstance`, `LaunchConfiguration`, etc.).

  - **Assess the account’s regional configuration:** Query the AWS account configuration to verify the expected enabled regions. Compare it to the regions enabled by the suspicious command to confirm legitimacy.

  - **Identify other related events:** Search for any preceding or subsequent command events in CloudTrail (e.g., `CreateAccessKey`, `RunInstances`) that may indicate malicious intent, focusing on how these actions relate to the recent enabling of new regions.

  - **Review the IAM policies for the user:** Check IAM permissions and roles associated with the user who executed the `EnableRegion` command, focusing on policies that grant unrestricted access to modify resources across multiple regions.

  ---

  ### Prioritization

  The alert is of medium severity, as enabling new regions could be a precursor to malicious activities that facilitate unauthorized access to resources. While this behavior is uncommon in routine operations, it can indicate serious intent if executed by unauthorized users or from unusual geographical locations.

  ---

  ### Blind Spots and Assumptions

  Detection may miss cases where the command is executed from legitimate service accounts or with high privileges that are misused. Ensure CloudTrail is properly configured to capture all API events and that logs are retained for analysis. Legitimate administrative actions may include enabling regions when scaling operations or during compliance reviews. A related detection would be monitoring for unusual API calls following region enablement, such as unexpected resource creations in enabled regions.

