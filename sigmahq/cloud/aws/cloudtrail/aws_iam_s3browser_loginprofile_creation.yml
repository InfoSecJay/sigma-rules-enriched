title: AWS IAM S3Browser LoginProfile Creation
id: db014773-b1d3-46bd-ba26-133337c0ffee
status: test
description: Detects S3 Browser utility performing reconnaissance looking for 
  existing IAM Users without a LoginProfile defined then (when found) creating a
  LoginProfile.
references:
- https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
author: daniel.bohannon@permiso.io (@danielhbohannon)
date: 2023-05-17
tags:
- attack.execution
- attack.persistence
- attack.initial-access
- attack.privilege-escalation
- attack.stealth
- attack.t1059.009
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
    - 'GetLoginProfile'
    - 'CreateLoginProfile'
    userAgent|contains: 'S3 Browser'
  condition: selection
falsepositives:
- Valid usage of S3 Browser for IAM LoginProfile listing and/or creation
level: high
note: |
  ### Technical Context

  This rule detects the use of the S3 Browser tool performing reconnaissance on AWS IAM users to identify those without a defined LoginProfile. The attacker may aim to create a LoginProfile for compromised or unauthorized IAM users to gain persistent access to resources. This behavior fits within the MITRE ATT&CK framework, specifically under the tactics of Persistence (T1078.004) and Execution (T1059.009). The primary telemetry source is AWS CloudTrail logs, capturing events related to IAM API calls such as `GetLoginProfile` and `CreateLoginProfile`. If malicious, this behavior could lead to unauthorized access and potential data exfiltration. It’s important to note that this detection does NOT confirm malicious activity on its own, as legitimate use of S3 Browser for IAM management can produce similar events.

  ### Investigation Steps

  - **Review CloudTrail Logs for Relevant Events:** Check AWS CloudTrail logs for `eventName` entries of `GetLoginProfile` and `CreateLoginProfile`. Focus on the `userAgent` field containing 'S3 Browser' for potential misuse.

  - **Correlate User Activity with IAM Policies:** Examine the IAM policies associated with the user executing these actions. Ensure that the user has legitimate roles that necessitate use of the S3 Browser.

  - **Analyze Frequency of API Calls:** Identify patterns in how frequently `GetLoginProfile` and `CreateLoginProfile` API calls are made in a certain time range, as excessive or out-of-hours calls may indicate malicious activity.

  - **Identify Existing LoginProfiles:** For users identified by `GetLoginProfile`, determine their current state of having a LoginProfile set and verify legitimate activity. Legitimate user accounts typically will have a LoginProfile configured if frequent access is required.

  - **Assess Malicious Indicators on User Context:** Look for users that have had no prior LoginProfile but show attempts to create one rapidly after the `GetLoginProfile`. This is a high-confidence indicator of potential malicious activity.

  - **Monitor for Exfiltration Artifacts:** If a LoginProfile is created, validate any immediate file creation or access activity associated with that account that could indicate ongoing malicious actions, such as unauthorized data downloads from S3 buckets.

  ### Prioritization

  This alert is considered high severity due to the significant impact potential on AWS resources and the likelihood that the behavior may indicate an attempt to exploit IAM vulnerabilities. The use of recognized tools like S3 Browser is common among attackers, making it a notable risk for credential-related exploitation.

  ### Blind Spots and Assumptions

  Detection may have limitations if CloudTrail logging is not fully enabled for IAM actions; thus, review IAM configuration for logging policies. Legitimate account management practices may trigger the alert, especially from third-party tools like the S3 Browser that are used for maintenance and operations. A related detection could include monitoring for unusual S3 bucket access patterns, which may indicate malicious activity following the creation of a LoginProfile.

