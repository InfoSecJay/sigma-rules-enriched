title: AWS IAM S3Browser LoginProfile Creation
id: db014773-b1d3-46bd-ba26-133337c0ffee
status: test
description: Detects S3 Browser utility performing reconnaissance looking for 
  existing IAM Users without a LoginProfile defined then (when found) creating a
  LoginProfile.
references:
- https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
author: daniel.bohannon@permiso.io (@danielhbohannon)
date: 2023-05-17
tags:
- attack.execution
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.privilege-escalation
- attack.t1059.009
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
    - 'GetLoginProfile'
    - 'CreateLoginProfile'
    userAgent|contains: 'S3 Browser'
  condition: selection
falsepositives:
- Valid usage of S3 Browser for IAM LoginProfile listing and/or creation
level: high
note: |
  ### Technical Context

  This rule detects activity from the S3 Browser tool where an attacker attempts to enumerate IAM users who do not have a LoginProfile and subsequently creates one for these users. This behavior is indicative of a reconnaissance stage followed by a potential privilege escalation tactic, allowing the attacker to control user access to S3 resources. The relevant MITRE ATT&CK tactics and techniques include: **Initial Access (TA0001)** and **Privilege Escalation (TA0004)**, specifically **Valid Accounts (T1078.004)**.

  The primary telemetry source is Amazon CloudTrail logs, captured through the `iam.amazonaws.com` service, specifically the events `GetLoginProfile` and `CreateLoginProfile`. If malicious, this activity could lead to unauthorized access and management of cloud resources, enabling further exploitation. Importantly, this detection does NOT confirm that malicious activity occurred without additional context or validation of the user's intent and legitimacy.

  ### Investigation Steps

  - **Check for suspicious user accounts:**
    Review IAM user details in the AWS Management Console for accounts associated with the detected event. Specifically, verify user account status (e.g., "Active" vs "Inactive") to confirm if unexpected or unknown accounts attempted to create LoginProfiles.

  - **Validate the user agent:**
    Cross-reference the CloudTrail logs (`eventSource` and `userAgent` fields) to confirm that the detected `userAgent` contains 'S3 Browser'. Validate expected using scenarios for S3 Browser in your environment.

  - **Identify LoginProfile creation events:**
    Examine CloudTrail logs for `CreateLoginProfile` events within the past 30 minutes (Event ID must be specified by the user for exact event filtering). Look for anomalies such as multiple accounts being affected in rapid succession.

  - **Assess typical benign usage patterns:**
    Document typical use cases of S3 Browser in your enterprise, including which accounts regularly create LoginProfiles. A high degree of variance from this baseline indicates potential malicious activity.

  - **Review access to S3 buckets:**
    Investigate privileges assigned to accounts found in the previous steps, particularly focusing on IAM policies. Look for indicators of excessive permissions being granted just after a LoginProfile is created.

  - **Correlate with other suspicious activities:**
    Check for related IAM operations (e.g., `iam:ListUsers`, `iam:CreateUser`, `iam:DeleteUser`) in the same time frame to identify potential coordinated actions indicative of an intrusion attempt.

  ### Prioritization

  The alert is categorized as high severity due to its capacity for exploitation of IAM configurations directly linked to user access control, making it a prime target for attackers looking to gain persistence and escalate privileges in AWS environments. The likelihood of malicious abuse is significant given the explicit functionality of the S3 Browser tool identified in attack narratives.

  ### Blind Spots and Assumptions

  Detection may be evaded through the use of other legitimate client tools that do not identify as 'S3 Browser' in the user agent, or if relevant CloudTrail logging is not enabled for all necessary IAM events. Legitimate activities such as administrative IAM configuration changes may spur the same alert. A companion detection to strengthen your defenses would include monitoring for unusual `iam:ChangePassword` actions that could indicate compromised accounts following the creation of LoginProfiles.

