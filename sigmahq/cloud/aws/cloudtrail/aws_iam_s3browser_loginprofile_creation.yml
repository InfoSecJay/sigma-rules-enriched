title: AWS IAM S3Browser LoginProfile Creation
id: db014773-b1d3-46bd-ba26-133337c0ffee
status: test
description: Detects S3 Browser utility performing reconnaissance looking for existing
  IAM Users without a LoginProfile defined then (when found) creating a LoginProfile.
references:
- https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
author: daniel.bohannon@permiso.io (@danielhbohannon)
date: 2023-05-17
tags:
- attack.execution
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.privilege-escalation
- attack.t1059.009
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName:
    - 'GetLoginProfile'
    - 'CreateLoginProfile'
    userAgent|contains: 'S3 Browser'
  condition: selection
falsepositives:
- Valid usage of S3 Browser for IAM LoginProfile listing and/or creation
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the S3 Browser utility, which is an application that allows users to interact with Amazon S3 storage. The rule specifically targets scenarios where an attacker may be using S3 Browser to conduct reconnaissance within an AWS environment. By listing existing IAM Users who do not have a LoginProfile defined, the potential attacker can create LoginProfiles for these users, thereby gaining unauthorized access to sensitive resources or escalating privileges within the AWS account.

  The likely attacker objectives in this scenario include compromising the security of an AWS environment by identifying and exploiting IAM Users without LoginProfiles, ultimately aiming for increased privileges and persistence within the environment. This behavior aligns with several MITRE ATT&CK tactics and techniques, particularly:
  - **Initial Access (TA0001)**: using the presence of IAM Users to gain entry.
  - **Execution (TA0002)**: executing commands through the S3 Browser.
  - **Persistence (TA0003)**: creating LoginProfiles to maintain access.
  - **Privilege Escalation (TA0004)**: obtaining elevated permissions through LoginProfile creation.

  The primary data source for this detection is AWS CloudTrail logs, which record API calls and provide a detailed view of IAM user activities, specifically focusing on the event source and name.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Check AWS CloudTrail logs for the `GetLoginProfile` and `CreateLoginProfile` events associated with the S3 Browser user agent. Look for patterns that suggest unauthorized or unusual attempts to manipulate LoginProfiles.

  - **Audit IAM User Configurations**: Examine the configurations of IAM Users that were listed in the logs. Identify any accounts that were modified or created without proper approval, especially those that lacked a LoginProfile before the detected activity.

  - **Check for Concurrent Access Patterns**: Investigate other AWS services used in conjunction with the IAM actions during the specified timeframe. Analyze for any connections that indicate potential lateral movement or unusual access by these user accounts.

  - **Assess Permissions and Policies**: Evaluate the permissions assigned to IAM Users that had LoginProfiles created through S3 Browser. Look for any overly permissive policies that could have been exploited by attackers.

  ### Prioritization
  This alert is considered high severity in an enterprise environment due to the potential for unauthorized access and privilege escalation, which could lead to significant security breaches and loss of data integrity if the IAM Users are successfully manipulated.

  ### Blind Spots and Assumptions
  Detection coverage is limited by the reliance on CloudTrail logs; if logging is improperly configured or disabled, this alert may not trigger. The detection logic assumes that the S3 Browser is the only tool being used for this activity, overlooking potential use of custom scripts or other utilities that may not provide recognizable user agents. Finally, successful detection relies on ensuring that all relevant IAM actions are logged appropriately within the AWS environment.

