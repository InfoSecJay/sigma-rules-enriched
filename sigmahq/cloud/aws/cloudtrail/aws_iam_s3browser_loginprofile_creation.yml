  ---

  ### Technical Context

  This rule detects the S3 Browser utility accessing AWS IAM to check for existing users without LoginProfiles and subsequently creating those profiles. The objective is likely to facilitate unauthorized access by creating credentials for accounts that lack such profiles, aiding in lateral movement or privilege escalation. This behavior aligns with the MITRE ATT&CK technique "Accounts Manipulation" (T1078.004) and "Command-Line Interface" (T1059.009).

  The primary telemetry sources are AWS CloudTrail logs, specifically focusing on events related to `iam.amazonaws.com`, particularly `GetLoginProfile` and `CreateLoginProfile`. If successful, this activity could lead to elevated access privileges for the threat actor, compromising the integrity and security of AWS resources. Importantly, this detection alone does NOT confirm malicious intent or successful unauthorized actions without corroborating evidence from additional logs or context.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for suspicious activity:** Search for `eventSource` set to `iam.amazonaws.com` and `eventName` containing `CreateLoginProfile` or `GetLoginProfile` (Event IDs can vary). Note the `userAgent` field should show 'S3 Browser' as a potential malicious indicator.

  - **Identify legitimate user profiles:** Check the AWS IAM user list in conjunction with the `GetLoginProfile` executions. Users typically having a LoginProfile set do not trigger this detection; note the relevant fields for existing profiles.

  - **Assess the affected user accounts:** Record which IAM usernames were targeted. Look at their permissions and roles to determine their criticality. Accounts with elevated permissions are of higher concern when manipulated.

  - **Correlate with other AWS activity:** Investigate any additional AWS API calls from the same user around the time of the alert. Look for any signs of further exploitation, usage of privileges, or attempts to modify other IAM settings.

  - **Document access patterns:** Focus on timeline and frequency of events. If the detected activity occurs repeatedly but regularly by a known user (via regular work or schedule), note as potential benign behavior.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential security impact on IAM user accounts, which could provide unauthorized access. The likelihood of malicious use is significant, especially if S3 Browser is not part of standard operational tasks within the organization. Such behaviors have been weaponized in real-world attacks, warranting immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of specific AWS CloudTrail logs or potential misuse of legitimate accounts, which could lead to false positives. Organizations should ensure that CloudTrail logging is properly configured to capture all relevant IAM events. Legitimate usage may trigger alerts, especially by administrators managing user accounts. For enhanced detection coverage, consider monitoring for related suspicious API operations, such as unusual `iam.amazonaws.com` permissions changes or failed login attempts.

