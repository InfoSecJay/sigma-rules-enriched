title: Malicious Usage Of IMDS Credentials Outside Of AWS Infrastructure
id: 352a918a-34d8-4882-8470-44830c507aa3
status: test
description: |
  Detects when an instance identity has taken an action that isn't inside SSM.
  This can indicate that a compromised EC2 instance is being used as a pivot point.
references:
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-identity-roles.html
- https://ermetic.com/blog/aws/aws-ec2-imds-what-you-need-to-know/
- https://www.packetmischief.ca/2023/07/31/amazon-ec2-credential-exfiltration-how-it-happens-and-how-to-mitigate-it/#lifting-credentials-from-imds-this-is-why-we-cant-have-nice-things
author: jamesc-grafana
date: 2024-07-11
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.persistence
- attack.stealth
- attack.t1078
- attack.t1078.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.arn|re: '.+:assumed-role/aws:.+'
  filter_main_generic:
  - eventSource: 'ssm.amazonaws.com'
  - eventName: 'RegisterManagedInstance'
  - sourceIPAddress: 'AWS Internal'
  condition: selection and not 1 of filter_main_*
falsepositives:
- A team has configured an EC2 instance to use instance profiles that grant the 
  option for the EC2 instance to talk to other AWS Services
level: high
note: |
  ### Technical Context

  This rule detects the use of Instance Metadata Service (IMDS) credentials from an EC2 instance performing actions outside of AWS Systems Manager (SSM). This behavior often suggests a compromised EC2 instance being utilized as a pivot point for further malicious activities, such as data exfiltration or privilege escalation. The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) and **Persistence** (TA0003), particularly focusing on techniques like **Valid Accounts** (T1078) and **Valid Accounts: EC2 Instance Profiles** (T1078.002).

  The primary telemetry sources for this detection are AWS CloudTrail logs, specifically looking for events that show anomalous actions taken by instances using assumed roles. If this behavior is confirmed malicious, it could lead to unauthorized access and manipulation of cloud resources. However, this detection alone does not confirm that an EC2 instance has been truly compromised, as benign usage of IMDS credentials for legitimate intra-cloud communications can also generate similar alerts.

  ### Investigation Steps

  - **Check CloudTrail event details:** Review AWS CloudTrail logs for suspicious actions attributed to the instance, focusing on **eventSource** as `ssm.amazonaws.com` and **eventName** as `RegisterManagedInstance`. Identify any abnormal or unexpected actions that deviate from normal operational behavior.

  - **Validate source IP address:** Investigate the **sourceIPAddress** of the event. Look for any external IP addresses or unexpected origins that may indicate malicious activity, as legitimate SSM actions will typically have `sourceIPAddress` as `AWS Internal`.

  - **Identify recent role assumptions:** Cross-reference the userIdentity ARN with recent IAM role assumptions to identify any roles that are being used unusually. Look for log entries that show an immediate post-assumption activity that could signal malicious use of elevated privileges.

  - **Examine EC2 instance configurations:** Confirm that the affected EC2 instance is configured correctly for legitimate roles. Review the instance profile permissions, ensuring they are restricted adequately and specifically verify logs relating to **EC2 actions** (Event ID for EC2 API calls) involving IMDS access.

  - **Confirm expected behavior:** Document normal operational tasks for the EC2 instance under review. This might include validating usage patterns against CloudTrail logs over a defined period to establish a baseline of legitimate activity and behaviors.

  - **Investigate external communications:** If applicable, review any outbound API calls made from the EC2 instance to external IP addresses or services. Look for metrics that indicate potential data exfiltration, such as high volumes of data transfers or unusual endpoint accesses.

  ### Prioritization

  The alert is classified as high severity because it involves potentially compromised infrastructure that could grant attackers extensive access to cloud resources. The likelihood of malicious activity is significant due to the nature of unauthorized use of IMDS credentials, which are often weaponized for lateral movement and persistence in cloud environments.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers utilize techniques to obfuscate their activity, such as using legitimate accounts for credential access or feasible misconfiguration by authorized users leading to false alerts. It requires comprehensive CloudTrail and IAM logs for reliable detection; without these logs, the likelihood of undetected malicious actions increases. Additionally, legitimate administrative actions involving pivoting across AWS resources can trigger this alert, thus necessitating contextual investigation. A companion detection to enhance coverage could involve monitoring for unusual patterns in **AWS IAM policy changes** related to EC2 instance permissions.

