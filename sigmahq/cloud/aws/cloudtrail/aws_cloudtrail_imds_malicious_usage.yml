title: Malicious Usage Of IMDS Credentials Outside Of AWS Infrastructure
id: 352a918a-34d8-4882-8470-44830c507aa3
status: test
description: |
  Detects when an instance identity has taken an action that isn't inside SSM.
  This can indicate that a compromised EC2 instance is being used as a pivot point.
references:
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-identity-roles.html
- https://ermetic.com/blog/aws/aws-ec2-imds-what-you-need-to-know/
- https://www.packetmischief.ca/2023/07/31/amazon-ec2-credential-exfiltration-how-it-happens-and-how-to-mitigate-it/#lifting-credentials-from-imds-this-is-why-we-cant-have-nice-things
author: jamesc-grafana
date: 2024-07-11
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.initial-access
- attack.persistence
- attack.t1078
- attack.t1078.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.arn|re: '.+:assumed-role/aws:.+'
  filter_main_generic:
  - eventSource: 'ssm.amazonaws.com'
  - eventName: 'RegisterManagedInstance'
  - sourceIPAddress: 'AWS Internal'
  condition: selection and not 1 of filter_main_*
falsepositives:
- A team has configured an EC2 instance to use instance profiles that grant the 
  option for the EC2 instance to talk to other AWS Services
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized actions taken by an EC2 instance identity outside of AWS Systems Manager (SSM), indicating potential misuse of EC2 instance metadata service (IMDS) credentials. The likely attacker objective is to exploit a compromised EC2 instance for pivoting or escalating privileges within the AWS environment. This behavior aligns with the MITRE ATT&CK tactics and techniques of **Initial Access (T1078)** and **Privilege Escalation (T1078.002)**.

  The primary telemetry source is AWS CloudTrail logs, specifically focusing on the `eventSource` related to SSM and the actions taken by roles associated with EC2 instances. If the activity is indeed malicious, it could lead to unauthorized access or manipulation of sensitive data and services. It is important to note that this detection does NOT confirm that malicious activity occurred on its own; further investigation is required.

  ### Investigation Steps

  - **Review CloudTrail logs for suspicious actions:** Check for CloudTrail events where `eventSource` is `ssm.amazonaws.com` and `eventName` is not `RegisterManagedInstance`. Look for unusual activities particularly from EC2 instance roles.

  - **Identify source IP addresses:** Examine the `sourceIPAddress` field in the relevant CloudTrail logs. Legitimate SSM operations should originate from `AWS Internal`. Connections from external IPs may indicate compromise.

  - **Evaluate IAM role permissions:** Validate the permissions associated with the EC2 instance’s IAM role. Ensure that it does not have elevated permissions that allow interaction with other services outside the intended scope for SSM-managed instances.

  - **Correlate with known network behavior:** Cross-check outbound traffic from the compromised EC2 instances to detect any connections made to risky endpoints. Legitimate EC2 instances should not communicate with unknown external IPs unless predefined.

  - **Document prior actions of the affected instance:** Review the logs for previous legitimate SSM commands executed by the instance that may explain its operations. Establish a baseline to distinguish between normal and suspicious behavior.

  ### Prioritization

  This alert is of **high** severity as it affects the integrity of the AWS infrastructure and could indicate a compromised EC2 instance being used as a pivot point for further attacks. Given the common exploitation of EC2 roles for lateral movement, the likelihood of malicious abuse is significant, making immediate review critical.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of CloudTrail logging, especially if logging is incomplete or not properly enabled for all regions. Legitimate activities such as automated scripts calling SSM commands from secure EC2 instances may trigger this alert. A related detection to consider is anomalous behavior in IAM policies or roles being modified, which could support investigative efforts in this context.

