title: Malicious Usage Of IMDS Credentials Outside Of AWS Infrastructure
id: 352a918a-34d8-4882-8470-44830c507aa3
status: test
description: |
  Detects when an instance identity has taken an action that isn't inside SSM.
  This can indicate that a compromised EC2 instance is being used as a pivot point.
references:
- https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-identity-roles.html
- https://ermetic.com/blog/aws/aws-ec2-imds-what-you-need-to-know/
- https://www.packetmischief.ca/2023/07/31/amazon-ec2-credential-exfiltration-how-it-happens-and-how-to-mitigate-it/#lifting-credentials-from-imds-this-is-why-we-cant-have-nice-things
author: jamesc-grafana
date: 2024-07-11
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.initial-access
- attack.persistence
- attack.t1078
- attack.t1078.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.arn|re: '.+:assumed-role/aws:.+'
  filter_main_generic:
  - eventSource: 'ssm.amazonaws.com'
  - eventName: 'RegisterManagedInstance'
  - sourceIPAddress: 'AWS Internal'
  condition: selection and not 1 of filter_main_*
falsepositives:
- A team has configured an EC2 instance to use instance profiles that grant the option
  for the EC2 instance to talk to other AWS Services
level: high
note: |
  ---

  ### Technical Context

  This rule detects when an EC2 instance, utilizing an assumed role, performs actions outside of AWS Systems Manager (SSM). This behavior can indicate a compromised EC2 instance being used as a pivot point for lateral movement or credential exfiltration. The likely attacker objective might include gaining unauthorized access to other AWS resources by leveraging IMDS (Instance Metadata Service) credentials.

  The relevant MITRE ATT&CK technique for this detection is **Valid Accounts (T1078)** and **Valid Accounts via Instance MetaData Service (T1078.002)**. The primary telemetry sources are AWS CloudTrail logs, particularly focusing on the `eventSource`, `eventName`, and `sourceIPAddress` fields. If the activity is malicious, it could lead to significant security incidents, including data breaches or unauthorized resource modifications. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate usage patterns may also trigger the alert.

  ---

  ### Investigation Steps

  - **Review the CloudTrail event:** Check CloudTrail logs for `eventSource` set to `ssm.amazonaws.com` and `eventName` set to `RegisterManagedInstance`. Validate that the `sourceIPAddress` is not from a known AWS internal range, which could indicate misuse of the instance metadata credentials.

  - **Monitor assumed role activity:** Analyze the `userIdentity.arn` in the CloudTrail logs for instances of format `assumed-role/aws:`, focusing on how often this role is being used for actions outside the approved SSM context. Frequent role assumption coupled with suspicious events may indicate a potential compromise.

  - **Validate the source IP address:** Identify the `sourceIPAddress` involved in the events. Ensure it matches legitimate internal AWS IP addresses. Abnormal external IP addresses or unusual geolocation patterns may characterize malicious behavior.

  - **Identify legitimate usage patterns:** Determine normal operational behavior for the EC2 instances in question. Regular configurations or maintenance tasks may involve SSM, while anything accessing AWS services directly from an EC2 instance should be reviewed critically as exceptions to routine practices.

  - **Look for additional indicators of compromise:** Check for atypical creation or modification events (e.g., unusual IAM role changes or EC2 instance launches). Review for any other related events tied to the same user or instance that could provide context to the suspicious behavior.

  - **Document findings in your incident log:** Record any anomalies or expected behaviors related to the alerted EC2 instance and surrounding context (e.g., timing, IP address, user roles) for further investigation or response actions.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of compromised AWS credentials. The potential impact on sensitive resources is significant, and this behavior is known to be weaponized by adversaries seeking to exploit cloud infrastructures. The likelihood of malicious activity is high when actions are outside of expected SSM usage.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if CloudTrail logging is not configured to capture all relevant events or if a sophisticated adversary uses evasion techniques to mask their activities. Legitimate activities such as automated scripts invoking SSM may lead to false positives, requiring contextual understanding. A companion detection to strengthen coverage would involve monitoring IAM role changes and analyzing API call patterns for anomalous behavior.

