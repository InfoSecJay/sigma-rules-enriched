note: |
  ### Technical Context

  This rule detects successful logins to the AWS Management Console that occur without Multi-Factor Authentication (MFA). This behavior may indicate compromised credentials or configuration weaknesses, such as an AWS Identity and Access Management (IAM) user account that is not properly secured. The likely attacker objective could be unauthorized access to AWS resources, which may facilitate further actions like data exfiltration or manipulation of settings.

  The relevant MITRE ATT&CK tactic is Initial Access (TA0001) with the specific technique being Valid Accounts (T1078.004). The primary telemetry source for this detection is AWS CloudTrail logs, particularly focusing on event names related to console sign-ins. If malicious, the security impact can be significant, potentially allowing threats to gain a foothold in the AWS environment and escalate privileges. This detection does NOT confirm that unauthorized access was successful on its own; further investigation is required to establish the nature of activities post-login.

  ### Investigation Steps

  - **Review CloudTrail log entries:** Look for `ConsoleLogin` events with `MFAUsed: NO` and `ConsoleLogin: Success` from relevant user accounts. Event IDs to focus on include `ConsoleLogin` entries from CloudTrail.

  - **Check IAM user settings:** Validate the IAM user's MFA configuration. Users without MFA enabled are potential weak points; make sure to compare user activity logs against established security policies.

  - **Identify account activity context:** Evaluate other CloudTrail events (e.g., S3, EC2 actions) linked to the identified login to assess if any suspicious or unusual actions (e.g., large data downloads) were performed shortly after the login event.

  - **Assess normal user behavior:** Review historical CloudTrail logs for the same IAM user account to establish a baseline of legitimate login times and activities. Consistency helps to identify anomalies.

  - **Cross-reference with alert thresholds:** Examine the frequency of `ConsoleLogin` events for the affected account. Multiple logins without MFA in a short period can indicate an ongoing attack or credential abuse.

  ### Prioritization

  This alert holds medium severity due to the potential impact on sensitive AWS resources and the relatively high likelihood of malicious activity in environments lacking stringent MFA policies. The absence of MFA can be a common vulnerability exploited by attackers to gain access to cloud environments.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users logging in without MFA if organizational policies allow it. Additionally, organizations must ensure AWS CloudTrail is configured correctly to capture all relevant events. Legitimate scenarios, such as internal testing or automated scripts, may inadvertently trigger this alert. A related detection of "AWS Console Login Failures" provides companion coverage by identifying possible unauthorized access attempts before successful logins are established.

