note: |
  ### Technical Context
  This detection rule identifies successful login events to AWS Management Console that occur without Multi-Factor Authentication (MFA). The absence of MFA is a significant security risk, as it can indicate potential unauthorized access attempts resulting from compromised user credentials or misconfigurations in security settings. Attackers may exploit accounts that lack MFA enforcement to gain access to sensitive resources, escalating their privileges and furthering their objectives within the cloud environment.

  The relevant MITRE ATT&CK tactics involved include:
  - **Initial Access (TA0001)**: The attacker gains access to the cloud environment, potentially leveraging stolen credentials.
  - **Persistence (TA0003)**: Once inside, attackers may attempt to establish continued access.
  - **Privilege Escalation (TA0004)**: If the logged-in user has elevated permissions, the attacker may seek to escalate their access further.
  - **Defense Evasion (TA0005)**: By circumventing MFA, attackers can evade detection mechanisms.

  Primary data sources that can provide crucial evidence for this detection include AWS CloudTrail logs, particularly those that capture console sign-in attempts and associated metadata surrounding the login events.

  ### Investigation Steps
  - **Review AWS CloudTrail Logs**: Examine CloudTrail logs for the `ConsoleLogin` event that shows successful logins where `MFAUsed` is marked as 'NO'. Note the user identities involved in these logins.
  - **Analyze User Activities**: Look into the activity of the affected user accounts leading up to the login event. Investigate any unusual behaviors, such as accessing unexpected resources, changes to IAM policies, or modifications to security groups.
  - **Correlate with User Access Policies**: Assess the IAM policies and permissions associated with the user accounts. Verify if the permissions align with expected roles and if MFA enforcement is required per organizational policy.
  - **Investigate for further signs of compromise**: If compromised credentials are suspected, conduct a broader investigation for any indicators of adversarial behavior. Ensure to check for additional compromised accounts, unusual access patterns, or privileged user access anomalies.

  ### Prioritization
  The medium severity of this alert is justified in an enterprise context as successful AWS console logins without MFA pose a substantial risk of unauthorized access, with potential implications for data confidentiality, integrity, and availability. The likelihood of misuse increases if an attacker successfully gains entry through compromised credentials, especially if sensitive operations are subsequently performed.

  ### Blind Spots and Assumptions
  Detection coverage is limited to monitoring for successful logins without MFA; thus, any logins utilizing MFA remain undetected, even if they are unauthorized. This rule assumes proper logging is enabled for AWS CloudTrail and that MFA is mandated and properly configured for all relevant accounts. If logging is misconfigured or if users are exempt from MFA requirements, detections may be incomplete or ineffective.

