  ---

  ### Technical Context

  This rule detects successful logins to the AWS Management Console that occur without Multi-Factor Authentication (MFA) being used. Such behavior can indicate potential unauthorized access, particularly if credentials have been compromised or if there are misconfigured security settings in AWS Identity and Access Management (IAM). The attacker objective likely involves establishing a foothold in the AWS environment for further exploitation or data exfiltration.

  This detection aligns with the MITRE ATT&CK framework under the tactic "Initial Access" (TA0001) and technique "Valid Accounts" (T1078.004). The primary telemetry source for this detection is CloudTrail logs, specifically looking for ConsoleLogin events. If malicious, this could lead to unauthorized resource modifications, data leaks, or additional privilege escalation attempts. It is essential to note that this detection does NOT automatically confirm that credentials were stolen; it may simply indicate a legitimate account was used without MFA configured.

  ---

  ### Investigation Steps

  - **Check CloudTrail logs for the ConsoleLogin event:**
    Look for Event Name `ConsoleLogin` with Additional Event Data: `{"MFAUsed": "NO"}` and Response Elements: `{"ConsoleLogin": "Success"}`. This provides clear indicators of successful logins without MFA.

  - **Verify user account status:**
    Review IAM user settings to ensure the account is legitimate and assess the MFA configuration. A missing MFA configuration on high-privilege accounts (e.g., administrators) is a critical security risk.

  - **Identify recent IAM policy changes:**
    Examine IAM logs for any changes to policies or permissions around the time of the login event. Look for Event Name `PutUserPolicy` or similar to detect possible privilege escalation maneuvers.

  - **Evaluate expected user behavior:**
    Compare the login timestamps with the user's normal activity patterns. Users typically log in during business hours; any logins at unusual times may merit further scrutiny.

  - **Investigate the source IP addresses:**
    Review the source IP address of the login attempts. Check against established safe whitelist IP ranges for your organization. Any unfamiliar source IPs could indicate unauthorized access.

  - **Look for subsequent API calls post-login:**
    Investigate other AWS service API calls made using the same credentials within a short timeframe following the ConsoleLogin event. Check for anomalous actions, such as changing security groups or creating new IAM users.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to its potential impact on the affected AWS environment. Successful logins without MFA can expose sensitive resources to unauthorized users, making it a likely target for attackers. Although not all instances of this alert indicate malicious activity, the lack of MFA represents a notable security gap that needs quick remediation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited in environments where CloudTrail is not configured properly or is missing critical logs, especially if users log in via other methods without MFA. Additionally, legitimate activities such as troubleshooting or administrative logins could trigger this alert if MFA is temporarily disabled for specific accounts. Companion detections, such as monitoring for changes in IAM roles or policies following a ConsoleLogin event, would provide more comprehensive security coverage.

