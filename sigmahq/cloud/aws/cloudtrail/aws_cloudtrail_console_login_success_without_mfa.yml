note: |
  ### Technical Context

  This rule detects successful logins to the AWS Management Console where Multi-Factor Authentication (MFA) was not used. This behavior can indicate compromised credentials or potential misconfigurations within the AWS account. The likely attacker objective behind this action is unauthorized access to resources, potentially leading to data exfiltration or manipulation. The relevant MITRE ATT&CK tactic is *Initial Access* and the technique is *Valid Accounts (T1078.004)*. The primary telemetry source is AWS CloudTrail, specifically logs pertaining to console login events.

  If malicious, successful logins without MFA can enable an adversary to gain privileged access to critical resources. However, it is important to note that this detection does NOT confirm the identity of the individual logged in; it only signifies that a login occurred without MFA.

  ### Investigation Steps

  - **Review CloudTrail logs for the ConsoleLogin event:** Check CloudTrail logs for `eventName: ConsoleLogin` and `responseElements.ConsoleLogin: Success` with `additionalEventData.MFAUsed: NO`. Focus on the `eventTime` and `sourceIPAddress` fields to identify the origin of the login attempt.

  - **Identify user account details:** Cross-reference the AWS Identity and Access Management (IAM) user or role associated with the login. Review if the account is privileged or has sensitive permissions, indicating higher risk.

  - **Compare historical login patterns:** Analyze previous CloudTrail logs for this user or role to determine baseline login behavior. Look for discrepancies in geographic location, time of access, or absence of MFA usage that could point to anomalies.

  - **Investigate the user’s recent activity post-login:** After confirming suspicious login, investigate subsequent API calls made by the user. Check for changes in IAM policies or unauthorized access to resources using CloudTrail event `eventType: Update*`.

  - **Determine legitimate access patterns:** Document expected login behaviors, including typical IP addresses, user locations, and the use of MFA. This context will aid in distinguishing between potential attacks and legitimate usage.

  - **Monitor for signs of credential compromise:** Investigate for any further signs of credential abuse or lateral movement post-login. Watch for additional failed login attempts or attempts to change MFA settings for the same user.

  ### Prioritization

  This alert has medium severity due to the impact of potential unauthorized access to critical AWS resources. The likelihood of malicious exploitation is notable, especially in environments where MFA is not strictly enforced. Successful console logins without MFA are weaponized tactics commonly used by adversaries to gain a foothold within an organization’s infrastructure.

  ### Blind Spots and Assumptions

  This detection can be limited by the absence of configured CloudTrail logs, which must be enabled for comprehensive coverage. There is also a risk of false security with users inadvertently bypassing MFA due to session tokens or misconfigurations. Legitimate users may trigger this alert during onboarding or temporary access scenarios. A complementary detection would include monitoring for *IAM policy changes* (see T1078), as unauthorized modifications may follow a successful login without MFA.

