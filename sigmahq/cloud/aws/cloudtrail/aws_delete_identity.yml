note: |
  ### Technical Context
  This detection rule monitors the deletion of Amazon Simple Email Service (SES) identities, specifically capturing instances of the "DeleteIdentity" event. This behavior could indicate that an attacker is attempting to erase tracks of their activities, especially if the deleted identity was used for unauthorized or malicious actions within an AWS environment. The likely attacker objectives include evading detection, maintaining persistence, or denying access to services leveraged during an attack.

  The relevant MITRE ATT&CK techniques for this scenario include **Defense Evasion (T1560)**, as deleting identities can help adversaries cover their tracks. Additionally, **Indicator Removal on Host (T1070)** applies, indicating efforts to erase evidence of previous malicious operations. The primary data source for this detection is AWS CloudTrail logs, which provide a comprehensive view of API calls, including those related to identity management.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine the CloudTrail logs for events related to "DeleteIdentity" in SES. Pay attention to the times, user identities, and source IP addresses associated with this event to determine if they correlate with known malicious activity or unauthorized access attempts.

  - **Correlate User Activity**: Identify other actions performed by the user or role that initiated the deletion. Look for patterns of suspicious behavior such as unusual resource provisioning, access to sensitive data, or actions taken shortly before the deletion event.

  - **Check IAM Permissions**: Investigate the IAM permissions of the user or role that executed the delete command. Ensure that appropriate controls are in place to prevent unauthorized access and that the permissions align with the principle of least privilege.

  - **Assess Account Usage**: Determine if the SES identity was previously associated with any phishing emails or malicious activities. Analyzing the email sending patterns or any associated accounts may reveal a broader malicious context.

  ### Prioritization
  The alert is categorized as medium severity due to the potential impact on cloud security posture and data exfiltration risks. Given that SES is often used to communicate in phishing campaigns, the likelihood of significant disruption or data loss increases if identities are deleted without justification.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if access to CloudTrail logs is not consistently maintained or if there is a delay in log ingestion. The detection logic assumes that the deletion event itself is captured without filtering out synthetic or benign activities that might use similar API calls. Additionally, if CloudTrail logging is disabled or misconfigured, this alert will not function as intended, leaving gaps in monitoring activities within the AWS environment.

