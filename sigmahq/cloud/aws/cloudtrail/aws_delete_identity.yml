note: |
  ### Technical Context

  This rule detects the deletion of an SES identity using the `DeleteIdentity` event in an AWS environment. The likely attacker objective is to impair detection capabilities by removing accounts associated with suspicious or malicious activities. This behavior falls under the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Indicator Removal on Host" (T1070). The primary telemetry source is AWS CloudTrail, specifically monitoring `DeleteIdentity` API calls. If malicious, the impact can be significant as it may indicate an adversary attempting to cover their tracks by eliminating user accounts used during an intrusion. Importantly, this detection does NOT confirm that malicious activity occurred on its own; further investigation is required.

  ### Investigation Steps

  - **Verify event context**: Check AWS CloudTrail logs for `DeleteIdentity` events (EventName) related to the identity deletion. Note the time, source IP, and user agent to assess legitimacy.

  - **Identify the user account**: Investigate the IAM user or role that executed the `DeleteIdentity` event (UserName or UserArn), looking for previous suspicious activities or anomalous behavior, such as multiple failed logins.

  - **Compare against known identities**: Cross-reference the deleted SES identity (Identity) with known operational accounts. Validate whether it is legitimate by checking the AWS Management Console or related documentation.

  - **Review preceding actions**: Analyze CloudTrail logs for actions performed by the account prior to the deletion. Look for signs of malicious activity, particularly the creation of resources or accessing sensitive information (e.g., `SendEmail`, `GetIdentityVerificationAttributes`).

  - **Document legitimate account behavior**: Determine if any other authorized personnel managed the SES identities. Validate expected operational patterns, such as routine account cleanups or access by approved users.

  - **Check for signs of wider compromise**: Review other AWS accounts in the organization for any related malicious indicators, such as unusual access patterns or unexpected account deletions.

  ### Prioritization

  This alert is of medium severity, particularly if it involves critical AWS resources or users with elevated privileges. The likelihood of malicious abuse is moderate, as attackers often seek to erase traces of their activities. While this behavior is not commonly weaponized on its own, it can indicate broader malicious activities.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using valid credentials for deletion or impersonating legitimate users. Reliable detection requires comprehensive CloudTrail logging to capture all relevant API activity. Legitimate activities, such as consistent identity management practices, can trigger this alert. Companion detections such as `CreateIdentity` and other account management-related events may strengthen overall coverage and enhance context.

