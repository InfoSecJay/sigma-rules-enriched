note: |
  ### Technical Context

  This rule detects the deletion of an SES identity via the AWS CloudTrail service, specifically monitoring for the `DeleteIdentity` event. Attackers may target SES identities to erase traces of their activities, especially if these identities were used to send phishing emails or to exfiltrate sensitive information. This behavior fits within the MITRE ATT&CK framework under the tactic of Defense Evasion (ID: T1070) due to the intention to cover tracks.

  The primary telemetry source for this detection is AWS CloudTrail logs, particularly focusing on events logged by `ses.amazonaws.com`. If malicious, the deletion of an SES identity could indicate an adversary attempting to disrupt legitimate communication flows or to evade detection. However, this detection alone does not confirm that the identity deletion is malicious, as legitimate administrative actions could also trigger this event.

  ### Investigation Steps

  - **Check CloudTrail Logs:** Search CloudTrail for the `DeleteIdentity` event (EventName) related to the SES service. Look for user identity (userName, userArn) associated with this action. Benign behavior may show common administrative users or service accounts when properly managed.

  - **Validate User Activity:** Review recent activities of the identity being deleted by checking events prior to the `DeleteIdentity` action. Look for unusual patterns or spikes of suspicious operations like bulk email sending.

  - **Identify Source of Deletion:** Determine if a recognized IAM user or role executed the `DeleteIdentity` event. Check userAgent and sourceIPAddress fields in the CloudTrail logs to ensure it aligns with known administrator access.

  - **Cross-reference with Security Incidents:** Investigate if there are any ongoing security incidents or alerts that correlate with the timing of the deletion. Look for other malicious indicators like unusual EC2 instances or unauthorized API calls.

  - **Review Policies for SES Identities:** Assess the IAM policies governing SES identities to evaluate if the permissions are aligned with intended usage. Misconfigurations could allow unauthorized deletions or manipulations.

  - **Identify Related Alerts:** Monitor for other associated alerts or anomalies, such as failed login attempts or unauthorized access attempts preceding the `DeleteIdentity`. Cross referring to AWS CloudWatch metrics or additional logging may provide context.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact, particularly if the deleted identity is critical for operations or has been misused in malicious activities. The likelihood of abuse is heightened in environments prone to credential theft and email phishing attacks, making this behavior notable for further investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrators to delete SES identities, which may trigger false positives. Reliable detection requires accurate configurations of CloudTrail logging for SES events. Legitimate activities, such as routine identity management or cleaning up unused resources, may cause similar alerts. As a companion detection, monitor for increases in `SendEmail` events or unusual API calls prior to identity deletions to enhance context and coverage.

