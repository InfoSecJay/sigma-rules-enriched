  condition: selection
falsepositives:
- AssumeRole may be done by a system or network administrator. Verify whether the
  user identity, user agent, and/or hostname should be making changes in your environment.
- AssumeRole from unfamiliar users or hosts should be investigated. If known behavior
  is causing false positives, it can be exempted from the rule.
- Automated processes that uses Terraform may lead to false positives.
level: low
note: |
  ### Technical Context
  This rule detects suspicious usage of the AWS Security Token Service (STS) AssumeRole action. Attackers may leverage this capability to compromise additional roles and escalate their privileges within the environment. By misusing AssumeRole, they can gain unauthorized access to resources that are otherwise restricted, facilitating lateral movement within an organization’s cloud infrastructure.

  The relevant MITRE ATT&CK tactics associated with this detection include **Lateral Movement** (TA0008) and **Privilege Escalation** (TA0004), with techniques like **Exploitation for Client Execution** (T1548) and **Valid Accounts** (T1550). This highlights the potential misuse of valid credentials or roles to perform malicious actions within the AWS ecosystem.

  The primary data sources for detection are AWS CloudTrail logs. These logs provide detailed records of actions taken in the AWS environment, allowing security teams to analyze the use of AssumeRole by different users and roles.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine AWS CloudTrail logs for instances of the AssumeRole action. Look for users or services that should not normally make these requests.
  - **Check Session Context**: Analyze the `sessionIssuer` details to identify the source role that is being assumed. Ensure it correlates with known and expected administrative actions.
  - **Validate User Actions**: Investigate the user identities making these AssumeRole requests. Check for any unfamiliar usernames or anomalies in their activity patterns and user agents.
  - **Assess Network Origins**: Evaluate the source IP addresses and hostnames involved in these requests. Look for characteristics that may indicate a malicious actor, such as geolocations that don't align with normal enterprise operations.

  ### Prioritization
  This alert is assigned a low severity because while misuse of AssumeRole can indicate a serious security issue, it often results from legitimate administrative activities. However, any requests from unfamiliar users or atypical sources should be promptly investigated to mitigate potential threats.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if appropriate CloudTrail logging is not enabled or if the logs are not retained for an adequate period. The detection logic assumes that all legitimate AssumeRole requests are generated from known administrative users and does not account for automated processes (like those using Terraform) that may generate false positives. Ensuring comprehensive and consistent logging with proper configurations is crucial for the effectiveness of this detection rule.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
