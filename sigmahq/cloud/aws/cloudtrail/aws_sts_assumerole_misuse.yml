logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    userIdentity.type: AssumedRole
    userIdentity.sessionContext.sessionIssuer.type: Role
  condition: selection
falsepositives:
- AssumeRole may be done by a system or network administrator. Verify whether 
  the user identity, user agent, and/or hostname should be making changes in 
  your environment.
- AssumeRole from unfamiliar users or hosts should be investigated. If known 
  behavior is causing false positives, it can be exempted from the rule.
- Automated processes that uses Terraform may lead to false positives.
level: low
note: |
  ### Technical Context

  This rule detects the suspicious use of the AWS STS AssumeRole API, indicating a potential lateral movement or privilege escalation attempt by an unauthorized user or compromised account. Attackers may leverage AssumeRole for accessing additional permissions from other roles, facilitating their movement within an AWS environment. Relevant MITRE ATT&CK tactics are Lateral Movement (TA0008) and Privilege Escalation (TA0004), specifically the technique T1548 for abuse of elevation control. The primary telemetry source is AWS CloudTrail logs, particularly focusing on `userIdentity.type` and `userIdentity.sessionContext.sessionIssuer.type`. If malicious, this behavior can enable unauthorized access to sensitive resources, increasing the overall attack surface. This detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger this alert.

  ### Investigation Steps

  - **Correlate user identity and session context:** Check for the `userIdentity` in the CloudTrail logs (EventName: AssumeRole) to identify roles that are being assumed and verify if the `sessionIssuer.type` is a legitimate role or user, which could indicate benign activity.

  - **Validate expected role assumptions:** Review the role assumption in conjunction with known architectural practices; legitimate administrators typically assume roles from specific IP addresses or via designated applications (e.g., AWS CLI or Terraform). Compare against known good practices.

  - **Analyze API call frequency:** Monitor the frequency of AssumeRole calls (CloudTrail Event Time, EventName: AssumeRole). Unusually high volumes from a single user or source could indicate malicious activity.

  - **Investigate user agent and host details:** Verify the `userAgent` (CloudTrail EventSource) and `sourceIPAddress` fields for the AssumeRole call; any requests from unfamiliar or suspicious agents or addresses should warrant further investigation.

  - **Create an alert for known automation signatures:** If the logs indicate AssumeRole calls by automated tools (e.g., from CI/CD pipeline), validate their expected behavior and ensure that the user identity matches authorized automation accounts.

  - **Cross-reference with user permissions:** Map the AWS Identity and Access Management (IAM) policies of the user making the AssumeRole request. Any permissions that exceed expected privileges should be flagged for deeper examination.

  ### Prioritization

  This alert is low severity within the enterprise context as legitimate administrative account usage may trigger it often. However, it could signal potential privilege escalation or lateral movement attempts by unauthorized users, which is a common tactic in AWS environments.

  ### Blind Spots and Assumptions

  Detection may be limited by users legitimately assuming roles as part of their responsibilities, potentially masking malicious behavior. Reliable detection mandates consistent CloudTrail logging configurations. Additionally, automated tools such as Terraform can cause false positives if their activity is not adequately monitored. A related detection to consider implementing is monitoring IAM policy change notifications to strengthen the overall security posture.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
