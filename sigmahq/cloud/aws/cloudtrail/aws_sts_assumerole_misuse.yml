falsepositives:
- AssumeRole may be done by a system or network administrator. Verify whether 
  the user identity, user agent, and/or hostname should be making changes in 
  your environment.
- AssumeRole from unfamiliar users or hosts should be investigated. If known 
  behavior is causing false positives, it can be exempted from the rule.
- Automated processes that uses Terraform may lead to false positives.
level: low
note: |
  ### Technical Context

  This rule detects instances where an AWS Identity and Access Management (IAM) role is assumed via the AWS Security Token Service (STS). The behavior typically indicates potential lateral movement or privilege escalation activities, particularly if initiated by non-administrative users or from unusual sources. This aligns with the MITRE ATT&CK framework tactics related to "Lateral Movement" (TA0008) and "Privilege Escalation" (TA0004), specifically techniques such as T1548 (Abuse Elevation Control Mechanism) and T1550. The primary telemetry source is AWS CloudTrail, with required logs showing user identity types, session contexts, and role assumptions.

  If malicious, such activity could indicate an attacker attempting to gain elevated access or access sensitive resources inappropriately. Importantly, this detection does NOT confirm malicious intent or administrative oversight without further context about the identities and locations involved.

  ### Investigation Steps

  - **Verify user identity and role context:** Review CloudTrail logs for Event Name `AssumeRole`. Investigate the `userIdentity` field to identify if the user initiating the request is expected to have authorized access.

  - **Analyze session sources:** Check for `sourceIPAddress` in the CloudTrail logs. A legitimate user generally accesses their roles from known IP addresses; any unfamiliar IPs should raise red flags.

  - **Confirm user agent legitimacy:** Examine the `userAgent` string in the CloudTrail events. Legitimate role assumptions should originate from expected user agents or system processes. Unusual user agents indicate potential abuse.

  - **Check for known configurations:** Validate that the account or role performing the AssumeRole action aligns with known administrative or automated processes, such as Terraform configurations. Compare the `userIdentity.sessionContext.sessionIssuer` against documented practices.

  - **Identify related suspicious activity:** Look for other CloudTrail logs in close temporal proximity to the AssumeRole event, such as `RunCommand` or `PutObject`, which could suggest further privilege escalation or lateral movement.

  - **Review historical context:** Consult past CloudTrail logs for the specific role and user identity involved to establish a baseline of expected actions and identify anomalies in their behavior.

  ### Prioritization

  This alert is flagged as low priority primarily due to the routine use of AssumeRole by system or network administrators. However, the likelihood of abuse exists, especially for accounts with wider access privileges. If detected from unfamiliar sources or non-administrative roles, it warrants higher scrutiny.

  ### Blind Spots and Assumptions

  Detection may miss cases where attackers impersonate legitimate users or misuse roles without triggering other alerts. Continuous log collection from CloudTrail is essential for reliable detection. The behavior may also arise from legitimate automated scripts invoking AssumeRole, leading to false positives. Pairing this detection with alerts for unusual AWS API calls or unusual IAM permissions will strengthen overall coverage and context.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
