falsepositives:
- AssumeRole may be done by a system or network administrator. Verify whether the
  user identity, user agent, and/or hostname should be making changes in your environment.
- AssumeRole from unfamiliar users or hosts should be investigated. If known behavior
  is causing false positives, it can be exempted from the rule.
- Automated processes that uses Terraform may lead to false positives.
level: low
note: |
  ### Technical Context

  This Sigma rule detects the suspicious use of the AWS STS AssumeRole API call, specifically when the user identity is an assumed role. This behavior is commonly exploited by attackers to move laterally within an AWS environment or escalate privileges, as it allows them to assume more powerful roles. The relevant MITRE ATT&CK tactics are Lateral Movement (TA0008) and Privilege Escalation (TA0004), along with techniques T1548 (Abuse Elevation Control Mechanism) and T1550 (Use Alternate Authentication Material).

  The primary telemetry source is AWS CloudTrail, which logs API actions across your AWS account. Key log types include events with `eventName` set to `AssumeRole`. If malicious, this behavior could indicate an ongoing lateral movement or privilege escalation attempt, potentially compromising sensitive resources. It is crucial to note that this detection does NOT confirm malicious activity by itself, as legitimate administrative actions may trigger these alerts.

  ### Investigation Steps

  - **Review CloudTrail logs for relevant events:** Search CloudTrail logs for events where `eventName` equals `AssumeRole` and `userIdentity.type` equals `AssumedRole`. Filter by timestamps matching the alert to identify associated activities.

  - **Identify the context of the role assumption:** Examine the `userIdentity.sessionContext.sessionIssuer` fields to understand which role was assumed and the originating user. Legitimate actions by known administrators should be logged under expected roles.

  - **Assess user identity legitimacy:** Verify the user identity associated with the assume role action against your user database. Look for unusual or unauthorized users attempting to assume roles that grant elevated privileges.

  - **Examine resource access following assume role actions:** Investigate subsequent actions taken by the assumed role, such as access to sensitive data or resources. Look for `eventSource` indicating changes to IAM policies or access logs showing unexpected S3 bucket access.

  - **Check for automated process involvement:** Determine if the AssumeRole action correlates with tasks managed by Terraform or other automated tools. Filter tags or identifiable patterns in API calls made using automation, as these may indicate benign activity.

  - **Document indicators of compromise:** Identify high-confidence malicious indicators such as unusual sources for AssumeRole actions or signatures indicating scripted access patterns (e.g., repeated or rapid API calls from the same IP range).

  ### Prioritization

  The alert carries a low severity level due to the likelihood of benign administrative actions triggering it. However, if detected in the context of compromised credentials or unusual user behavior, it poses a risk to the integrity of cloud resources. It is essential to observe if the behavior appears to fit a trend of privilege escalation, which is often a precursor to further exploits.

  ### Blind Spots and Assumptions

  Detection can be limited if CloudTrail logging is misconfigured or incomplete. Legitimate actions from automated processes or recognized administrators may trigger alerts, leading to noise in the data. Attackers might employ evasion techniques such as rotating assumed roles frequently or mimicking legitimate user behavior. A related detection to improve coverage is monitoring AWS IAM policy changes (T1503), as privilege escalation often accompanies lateral movement behaviors.

