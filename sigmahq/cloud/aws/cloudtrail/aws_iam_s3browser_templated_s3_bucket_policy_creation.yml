title: AWS IAM S3Browser Templated S3 Bucket Policy Creation
id: db014773-7375-4f4e-b83b-133337c0ffee
status: test
description: Detects S3 browser utility creating Inline IAM policy containing 
  default S3 bucket name placeholder value of "<YOUR-BUCKET-NAME>".
references:
- https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
author: daniel.bohannon@permiso.io (@danielhbohannon)
date: 2023-05-17
tags:
- attack.execution
- attack.t1059.009
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.privilege-escalation
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: PutUserPolicy
    userAgent|contains: 'S3 Browser'
    requestParameters|contains|all:
    - '"arn:aws:s3:::<YOUR-BUCKET-NAME>/*"'
    - '"s3:GetObject"'
    - '"Allow"'
  condition: selection
falsepositives:
- Valid usage of S3 browser with accidental creation of default Inline IAM 
  policy without changing default S3 bucket name placeholder value
level: high
note: |
  ### Technical Context

  This rule detects the unauthorized creation of an IAM policy using the S3 Browser that includes a default placeholder value `<YOUR-BUCKET-NAME>`, which indicates a potentially careless action or a pre-configured attack. The likely attacker objective involves either privilege escalation or initial access by exploiting misconfigured permissions in AWS S3 buckets. This behavior aligns with MITRE ATT&CK Tactics: Execution (T1059.009 for scripting) and Persistence (T1078.004 for valid accounts).

  The primary telemetry sources are AWS CloudTrail logs, specifically `PutUserPolicy` events under `iam.amazonaws.com`. If malicious, this could lead to unauthorized access or information leakage through improper S3 bucket access. However, this detection does NOT confirm malicious intent on its own, as it may also result from legitimate usage of the S3 Browser tool without modifying the bucket placeholder value.

  ### Investigation Steps

  - **Validate User Context**: Check the IAM user associated with the alert. Review user activity and permissions for signs of compromise or unusual access patterns. Look for high-risk role assignments, EventName `PutUserPolicy`, and check CloudTrail logs for UserIdentity fields.

  - **Examine Policy Details**: Analyze the specific policy created. Use CloudTrail logs to find the `requestParameters` field containing the policy with the placeholder value, specifically `arn:aws:s3:::<YOUR-BUCKET-NAME>/*`, to determine if this was a legitimate configuration.

  - **Identify Legitimate Activity**: Investigate other recent `PutUserPolicy` changes made by the same user or application via CloudTrail logs to establish a normal baseline of activity. Confirm if the user regularly uses the S3 Browser for benign tasks.

  - **Look for Malicious Indicators**: Search for multiple instances of policy changes involving the same placeholder from different users. Effective query parameters should include `userAgent: "S3 Browser"` and `eventSource: iam.amazonaws.com` for correlating suspicious activity.

  - **Assess S3 Bucket Configuration**: Verify the S3 bucket's policy linked to the alert. Review settings, permissions, and any access logs to ensure there is no inappropriate access configured.

  ### Prioritization

  The alert severity is high due to the potential impact of unauthorized IAM policy changes which can lead to elevated privilege access. The likelihood of malicious abuse exists, especially when default settings are used, and this tactic is increasingly weaponized to exploit misconfigured permissions in AWS environments.

  ### Blind Spots and Assumptions

  This detection may not identify legitimate use cases where users accidentally create policies with default placeholders while using the S3 Browser. Reliable detection requires consistent logging of AWS CloudTrail event metadata. Legitimate activities might include non-malicious administrative tasks by cloud users unaware of default configurations. Strengthening coverage could include companion detections for cross-referencing IAM policy changes with unusual user activity or failed access attempts in S3, providing a broader context for any observed behavior.

