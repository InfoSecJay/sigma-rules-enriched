title: AWS IAM S3Browser Templated S3 Bucket Policy Creation
id: db014773-7375-4f4e-b83b-133337c0ffee
status: test
description: Detects S3 browser utility creating Inline IAM policy containing 
  default S3 bucket name placeholder value of "<YOUR-BUCKET-NAME>".
references:
- https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
author: daniel.bohannon@permiso.io (@danielhbohannon)
date: 2023-05-17
tags:
- attack.execution
- attack.stealth
- attack.t1059.009
- attack.persistence
- attack.initial-access
- attack.privilege-escalation
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: PutUserPolicy
    userAgent|contains: 'S3 Browser'
    requestParameters|contains|all:
    - '"arn:aws:s3:::<YOUR-BUCKET-NAME>/*"'
    - '"s3:GetObject"'
    - '"Allow"'
  condition: selection
falsepositives:
- Valid usage of S3 browser with accidental creation of default Inline IAM 
  policy without changing default S3 bucket name placeholder value
level: high
note: |
  ### Technical Context

  This detection identifies attempts to create an inline IAM policy that grants `s3:GetObject` permissions on a specified S3 bucket using the S3 Browser tool. The likely attacker objective is to exploit misconfigured S3 permissions to gain unauthorized data access and exfiltration. It aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and the technique of Abuse Elevation Control Mechanism (T1078.004).

  The primary telemetry source is AWS CloudTrail logs, specifically focusing on the `PutUserPolicy` API event emitted by IAM. If this behavior is malicious, it could result in unauthorized access to sensitive data stored in the S3 bucket. However, this detection does NOT confirm that the action is malicious on its own, as it may also represent a legitimate misconfiguration or error by a user unaware of the default placeholder.

  ### Investigation Steps

  - **Check IAM Policy Creation Events**: Review CloudTrail logs for event name `PutUserPolicy` (Event ID: `PutUserPolicy`) and verify the associated user agent contains 'S3 Browser'. Malicious indicators include source IP addresses that are not part of your known user base.

  - **Inspect Policy Details**: Examine the `requestParameters` field in the CloudTrail logs to confirm it contains the placeholder `<YOUR-BUCKET-NAME>`. A legitimate use case would typically involve a user modifying the bucket name to match a valid production bucket.

  - **Review User Access Levels**: Investigate the role and access level of the user who triggered the alert by checking the IAM Dashboard. Be cautious with users having elevated permissions or who have used the S3 Browser tool for sensitive operations.

  - **Validate User Agent Logs**: Cross-reference the user agent details in other AWS logs (e.g., ELB or VPC Flow Logs) to establish baseline behavior and check for unusual patterns or multiple requests from a single source that could indicate abuse.

  - **Assess Affected Bucket Permissions**: Check the S3 bucket's permission settings in the AWS Management Console to confirm if any policies grant overly permissive access (`s3:GetObject`). Legitimate implementation should exclude default or placeholder configurations.

  ### Prioritization

  This alert is of high severity due to the potential impact on confidentiality if an S3 bucket containing sensitive data is improperly configured. The likelihood of malicious abuse is considerable since similar tactics are weaponized to escalate privileges and gain access to valuable cloud resources.

  ### Blind Spots and Assumptions

  Detection may be limited by overlooked IAM user policies, allowing default configurations to persist. Effective monitoring requires enabling detailed CloudTrail logging for all region events. Legitimate actions, such as routine reconfigurations by DevOps teams or accidental policy creations, can trigger this alert. A companion detection to strengthen coverage could involve monitoring for additional IAM policy changes that deviate from baseline configurations.

