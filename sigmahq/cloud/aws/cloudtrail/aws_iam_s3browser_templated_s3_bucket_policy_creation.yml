title: AWS IAM S3Browser Templated S3 Bucket Policy Creation
id: db014773-7375-4f4e-b83b-133337c0ffee
status: test
description: Detects S3 browser utility creating Inline IAM policy containing default
  S3 bucket name placeholder value of "<YOUR-BUCKET-NAME>".
references:
- https://permiso.io/blog/s/unmasking-guivil-new-cloud-threat-actor
author: daniel.bohannon@permiso.io (@danielhbohannon)
date: 2023-05-17
tags:
- attack.execution
- attack.t1059.009
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.privilege-escalation
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: PutUserPolicy
    userAgent|contains: 'S3 Browser'
    requestParameters|contains|all:
    - '"arn:aws:s3:::<YOUR-BUCKET-NAME>/*"'
    - '"s3:GetObject"'
    - '"Allow"'
  condition: selection
falsepositives:
- Valid usage of S3 browser with accidental creation of default Inline IAM policy
  without changing default S3 bucket name placeholder value
level: high
note: |
  ### Technical Context
  This rule detects the creation of inline IAM policies in AWS that utilize the default S3 bucket name placeholder `<YOUR-BUCKET-NAME>` by the S3 Browser utility. Such actions are indicative of possible misconfigurations or malicious attempts to exploit permissions for unauthorized access to S3 buckets. Attackers may leverage these policies to gain access to sensitive data stored in S3 or escalate their privileges by giving themselves or others undue access rights.

  The relevant MITRE ATT&CK tactics include **Execution (T1059.009)**, which pertains to command and scripting interpreter usage, and **Persistence (T1078.004)**, which involves maintaining access to cloud environments through IAM roles or policies. The attack could also involve **Defense Evasion** techniques if the attacker modifies or creates policies that hide their intent, as well as **Initial Access** if they gain entry through IAM user credentials.

  The primary data source for this detection is **AWS CloudTrail**, which logs API calls made in the AWS environment, capturing the relevant details of IAM policies being created or modified.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Inspect AWS CloudTrail logs for the `PutUserPolicy` events initiated by any user agent that contains 'S3 Browser'. Focus on timestamps correlating with the alerts to ascertain the context of the action.
  - **Analyze IAM Policy Details**: Examine the details of the created inline policies, paying special attention to any indication of the use of default bucket naming conventions, particularly those with the placeholder `<YOUR-BUCKET-NAME>`.
  - **Check User Activity**: Investigate the user accounts that executed this command. Analyze their access levels, recent activities, and relationships with other AWS resources to determine if they may have been compromised or are using tools wrongly.
  - **Evaluate Bucket Permissions**: Validate the permissions associated with the newly created policy. Assess the implications of these permissions on existing S3 buckets and whether they inadvertently allow unauthorized access.

  ### Prioritization
  Given the high severity of this alert, it highlights a potential security vulnerability within the AWS environment that could allow unauthorized access to sensitive data. The likelihood of legitimate users accidentally creating these policies also indicates a need for vigilance, as it may be a precursor to exploitation by malicious actors.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage where logs are not captured for all configurations of S3 Browser or if users are using alternative methods to set IAM policies. The detection logic assumes that the presence of `<YOUR-BUCKET-NAME>` is a clear indicator of misuse without accounting for cases where an organization might use this placeholder in legitimate scenarios. Required logs include detailed CloudTrail configurations ensuring that all IAM and S3-related events are logged for comprehensive monitoring.

