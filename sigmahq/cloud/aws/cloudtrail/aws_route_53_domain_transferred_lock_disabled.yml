  ---

  ### Technical Context

  This Sigma rule detects the removal of the transfer lock on an AWS Route 53 domain, which is an action typically taken to facilitate a domain transfer to another registrar. The likely attacker objective is to gain control over a domain, allowing them to redirect traffic or deploy phishing sites after transferring ownership. This action aligns with the MITRE ATT&CK technique **T1098: Account Manipulation**.

  The primary telemetry source is AWS CloudTrail, specifically monitoring API call events with the `eventSource` set to `route53.amazonaws.com` and `eventName` as `DisableDomainTransferLock`. A successful execution of this action suggests a possible escalation of privilege or persistence strategy by an attacker. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can trigger the alert.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for `DisableDomainTransferLock`:** Check for Event Name with `eventName` set to `DisableDomainTransferLock` in CloudTrail logs. Verify the IAM user or role initiating the action and assess if they typically manage domain settings.

  - **Analyze user identity and associated IP address:** Look at the `userIdentity` field to identify the user initiating the event. Cross-reference against known administrators and expected users for domain management tasks.

  - **Investigate abnormal agent or host behavior:** Confirm the `userAgent` field in the log. Look for strange patterns, such as changes made from unfamiliar IP addresses or devices that do not normally execute domain configurations.

  - **Verify the prior state of the domain’s transfer lock:** Look back at historical CloudTrail logs for the domain in question to confirm if there was previously a transfer lock enabled and whether this aligns with client actions or expected administrative procedures.

  - **Understand legitimate usage cases:** Document expected behaviors such as regular domain management operations by IT personnel. If the action aligns with scheduled activities, it may be benign.

  - **Identify potentially malicious indicators:** Correlate the timing of `DisableDomainTransferLock` with any recent unauthorized access events or alerts from network monitoring tools, indicating a broader compromise situation.

  ---

  ### Prioritization

  This alert is considered low severity but requires immediate attention due to the potential high impact if misused, especially if the domain is critical for business operations. The likelihood of abuse exists, as attackers often look to modify domain ownership as a step in their strategy to maintain persistence and control.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques might include usage of legitimate admin credentials by attackers with stolen access. The requirement of comprehensive CloudTrail logging is critical for reliable detection; ensure that logging is active for all relevant AWS services. Actions such as standard administrative activities might also trigger this alert, necessitating context about expected behaviors in your environment. A related detection to consider is monitoring for unusual IAM activity that might indicate compromised credentials used for this operation.

