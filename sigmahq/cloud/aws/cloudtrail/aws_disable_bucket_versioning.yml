logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName: PutBucketVersioning
    requestParameters|contains: 'Suspended'
  condition: selection
falsepositives:
- AWS administrator legitimately disabling bucket versioning
level: medium
note: |
  ### Technical Context
  This detection rule monitors for the disabling of versioning on Amazon S3 buckets, a critical step often taken by threat actors during AWS ransomware incidents. When attackers disable versioning, they can easily delete S3 objects without the ability to recover previous versions, aiding their objectives of data destruction and extortion. By detecting these changes, security teams can intervene early in a potential attack chain.

  The rule aligns with the MITRE ATT&CK framework, specifically with the tactic of **Impact** (TA0040) and the technique **Data Destruction** (T1490). When versioning is removed, the likelihood of permanent data loss increases significantly, underscoring the urgency of investigating these alerts.

  The primary data sources for this detection are AWS CloudTrail logs, which record API calls made to the AWS environment. These logs will capture events related to the configuration changes of S3 buckets, specifically looking for the `PutBucketVersioning` event to determine if versioning has been disabled.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Collect and analyze AWS CloudTrail logs for any `PutBucketVersioning` events, especially those flagged with `Suspended`. Determine the source and timing of these changes.
  - **Identify Associated Activity:** Investigate if there were any other related changes made around the same time, such as deletions of S3 objects or modifications to the bucket policy that could indicate malicious intent.
  - **Check User Activity:** Verify which IAM roles or users have executed the action to disable versioning. Determine if these identities are operating as expected or if they are potentially compromised.
  - **Assess Impact on Data:** Evaluate the contents of the S3 bucket before and after the versioning change to identify any critical data loss or deletions that occurred.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of data loss from unauthorized changes to S3 bucket versioning, which could enable attackers to destroy vital enterprise data. Early detection can mitigate the likelihood of broader ransomware impacts.

  ### Blind Spots and Assumptions
  One key gap in detection coverage is the possibility of legitimate AWS administrators disabling versioning for valid reasons, which may lead to false positives. The detection logic assumes there are no planned changes or legitimate business processes conducted at the time of the alert. To ensure proper functionality, it is essential that CloudTrail logging is configured to capture all relevant S3 events, specifically the `PutBucketVersioning` changes.

