title: AWS S3 Bucket Versioning Disable
id: a136ac98-b2bc-4189-a14d-f0d0388e57a7
status: test
description: Detects when S3 bucket versioning is disabled. Threat actors use 
  this technique during AWS ransomware incidents prior to deleting S3 objects.
references:
- https://invictus-ir.medium.com/ransomware-in-the-cloud-7f14805bbe82
author: Sean Johnstone | Unit 42
date: 2023-10-28
tags:
- attack.impact
- attack.t1490
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: s3.amazonaws.com
    eventName: PutBucketVersioning
    requestParameters|contains: 'Suspended'
  condition: selection
falsepositives:
- AWS administrator legitimately disabling bucket versioning
level: medium
note: |
  ### Technical Context

  This rule detects the disabling of versioning on S3 buckets, denoted by the action `PutBucketVersioning` with the `Suspended` state. Attackers may execute this behavior as part of a ransomware strategy to prevent recovery of data by eliminating versioned backups. This action aligns with the MITRE ATT&CK tactic of Impact (TA0040) and the technique T1490, which focuses on data destruction or unauthorized encryption.

  The primary telemetry source is AWS CloudTrail logs, specifically monitoring the `PutBucketVersioning` API call within the S3 service. The security impact of this action is significant as it can hinder recovery efforts during an active ransomware attack, leading to permanent data loss. This detection alone does not confirm malicious intent; legitimate AWS administrators might disable versioning for operational reasons.

  ---

  ### Investigation Steps

  - **Verify the timing of the change:** Check the timestamp of the `PutBucketVersioning` event in CloudTrail logs for suspicious timeframes, especially outside of normal business hours (Event Source: `aws.cloudtrail`, Event Name: `PutBucketVersioning`, `eventTime` field).

  - **Identify who performed the action:** Review the `userIdentity` field in the CloudTrail log entry to determine which IAM user or role performed the versioning disable operation. Look for accounts with excessive permissions or unfamiliar sources.

  - **Assess legitimate usage patterns:** Compare the action against the organization's change management policies. If S3 bucket versioning was disabled as part of a planned update and documented by a responsible team, mark the event as benign.

  - **Cross-reference other event activity:** Look for additional related CloudTrail events within a short timeframe surrounding the version disable action, such as object deletions (e.g., `DeleteObject`, `DeleteObjects`) which might indicate a potential ransomware activity.

  - **Check for alerts from companion detections:** Correlate findings with any alerts from related Sigma rules that might indicate suspicious activity or data exfiltration attempts from the same AWS account.

  ---

  ### Prioritization

  The alert carries a medium severity due to the potential critical impact on data recovery capabilities across production environments. The likelihood of this behavior being used maliciously is moderate, especially in the context of ransomware targeting AWS infrastructures. Disabling versioning is a common prelude to data destruction attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be circumvented by legitimate administrative actions, such as changes made by AWS managers or automated processes that adjust bucket configurations. Compliance with AWS logging best practices is crucial, especially ensuring that CloudTrail is enabled and properly configured to capture all API calls. Legitimate instances of disabling versioning can arise from maintenance or intentional security measures. A related detection to consider is monitoring for suspicious or excessive S3 object deletion events, as they often accompany threats to data integrity.

