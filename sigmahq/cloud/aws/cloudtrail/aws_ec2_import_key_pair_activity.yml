note: |
  ### Technical Context

  This rule detects the import of SSH key pairs into AWS EC2, which may signal attempts by malicious actors to gain unauthorized access to EC2 instances. The likely attacker objective is to establish persistence or escalate privileges within cloud environments to access and exfiltrate sensitive data. This behavior maps to the MITRE ATT&CK tactics of Initial Access (TA0001), Persistence (TA0003), and Privilege Escalation (TA0004), specifically utilizing the technique "Valid Accounts" (T1078).

  Primary telemetry sources include AWS CloudTrail logs, specifically focusing on the `ImportKeyPair` API event for detecting unauthorized key pair imports. If malicious, this activity could lead to compromised instances, increased risk of data breaches, or unauthorized actions within the AWS environment. However, it is crucial to clarify that this detection alone does not confirm malicious intent, as legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Check CloudTrail logs for ImportKeyPair events:** Review AWS CloudTrail logs for entries where `eventSource` is `ec2.amazonaws.com` and `eventName` is `ImportKeyPair` (Event ID). Pay attention to the `userIdentity` field to identify who performed the action.

  - **Verify the user identity and source IP:** Ensure the user performing the key import is authorized. Check the `userAgent` and `sourceIPAddress` fields to verify that they originate from expected internal networks or service accounts.

  - **Assess the context of key pair usage:** Identify if the imported key pair is associated with known AMIs or existing EC2 instances. Record any relationships with high-privileged accounts or suspicious patterns of usage.

  - **Look for patterns of unusual activity:** Identify multiple `ImportKeyPair` events occurring in a short time frame or from non-standard accounts, which may indicate automated scripts or unauthorized bulk actions.

  - **Identify legitimate administrative actions:** Cross-reference with known administrative activities. Confirm that there isn’t a scheduled task, deployment process, or other authorized activity that accounts for the key import.

  - **Look for high-confidence malicious indicators:** Validate unusual patterns such as importing multiple unauthorized key pairs in tandem with increased activity across various AWS resources or suspicious API calls (e.g., `RunInstances` or `StartInstances`).

  ### Prioritization

  This alert severity is medium based on the potential impact of the affected systems, especially if they host sensitive data or critical applications. The likelihood of malicious abuse is moderate due to the common practice of administrating key pairs, but this behavior is often weaponized by attackers seeking persistence or access within cloud environments.

  ### Blind Spots and Assumptions

  Detection limitations may arise from incomplete logging settings, as CloudTrail captures must be properly configured to include `ImportKeyPair` actions. Legitimate administrative processes, such as DevOps practices or automated infrastructure deployment scripts, may also trigger the alert. Consider implementing companion detections around EC2 instance state changes or unusual IAM policy modifications to enhance coverage.

