note: |
  ### Technical Context
  This detection rule identifies the importation of SSH key pairs into AWS EC2 instances, which is a critical operation that could potentially signal malicious activities. Attackers may use this technique to gain unauthorized access to cloud infrastructure, enabling them to execute commands, exfiltrate data, or maintain persistence on compromised systems. The import of SSH keys can facilitate initial access, privilege escalation, and other malicious actions that jeopardize sensitive organizational data and operational integrity.

  This activity corresponds to several MITRE ATT&CK tactics and techniques, including **Initial Access (T1078)**, which involves valid accounts to gain access to cloud resources, and **Persistence (T1098)**, where malicious users maintain access through backdoor methods. Monitoring these events is essential, as unauthorized key imports are a clear indicator of potential threats.

  The primary data source for detecting this activity is AWS CloudTrail logs. These logs provide detailed information about events that occur within your AWS account, including API calls made to EC2 services.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine AWS CloudTrail logs for the `ImportKeyPair` events, paying close attention to the user identity and source IP address. Ensure that these match expected administrative actions and are from authorized locations.

  - **Check User Permissions**: Analyze the permissions and roles of the user or service account that performed the key import to determine if their access level is appropriate given their operational responsibilities.

  - **Audit Associated EC2 Instances**: Investigate the EC2 instances that have had keys imported in order to check for any unauthorized access attempts or suspicious activities following the import event.

  - **Correlate with Other Activity**: Look for related activities in the vicinity of the time the key import occurred, such as atypical logins or changes to instance configurations, which may indicate further compromise or preparatory steps for a later attack.

  ### Prioritization
  This alert should be treated with medium severity due to the potential for significant impact if an attacker successfully gains unauthorized access through imported SSH keys. While such activities can arise from legitimate administrative actions, the context and frequency should determine the urgency of response.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of unauthorized key imports, especially if they occur from compromised accounts with legitimate privileges. The assumption is that users with access to import keys do not misuse their privileges. Additionally, for the alert to function properly, comprehensive logging via AWS CloudTrail must be enabled, as it records the required API events necessary for detection. Potential gaps in detection could also arise from scenarios where key pairs are managed through automated processes without sufficient logging or oversight.

