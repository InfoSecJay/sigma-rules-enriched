note: |
  ### Technical Context

  This rule detects the import of SSH key pairs into AWS EC2 instances, which may indicate an unauthorized user attempting to gain access to those instances. The likely attacker objective is to establish initial access, create persistence mechanisms, or escalate privileges, potentially compromising sensitive data and operational integrity. The relevant MITRE ATT&CK tactics include Initial Access (T1078), Persistence (T1053), and Defense Evasion (T1070).

  The primary telemetry source is AWS CloudTrail, specifically monitoring `ImportKeyPair` API calls within the `ec2.amazonaws.com` service. If malicious, this activity could allow unauthorized access to systems, leading to potential data breaches or operational disruptions. Importantly, this detection does NOT confirm an actual breach or successful unauthorized access, as legitimate users may also perform this action.

  ### Investigation Steps

  - **Verify the user identity**: Check CloudTrail logs for the `ImportKeyPair` event (Event ID: `ImportKeyPair`). Confirm the IAM user's identity, ensuring the user is expected to perform such actions.

  - **Inspect the source IP address**: Cross-reference the source IP of the `ImportKeyPair` event with your organization's IP whitelist. Flag any public or unexpected IP addresses that could indicate malicious intent.

  - **Review user agent details**: Analyze the user agent string associated with the `ImportKeyPair` API call. Unusual or suspicious user agents may indicate automated or unauthorized scripts.

  - **Identify legitimate use cases**: For authorized users, this action may be part of routine administrative tasks. Confirm if the users regularly import SSH keys, ensuring audit trails are consistent with expected behavior.

  - **Assess for automation or scripts**: Review the context of the API call for automated processes or CI/CD pipelines that include the `ImportKeyPair` action. Validate that these processes are documented and authorized.

  - **Look for subsequent activity**: Track if any subsequent SSH authentications occur from the newly imported key. Log files and SSH access logs will indicate if the key was utilized for connecting to sensitive instances.

  ### Prioritization

  This alert should be considered medium priority due to the potential for unauthorized access to critical infrastructure. While such activities can be legitimate, the likelihood of malicious exploitation in cloud environments, especially with automated environments and increasingly sophisticated attackers, warrants a timely investigation.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by possible AWS API logging misconfigurations, which could lead to the non-capture of this event. Legitimate administrative actions may trigger the alert when key pairs are imported for valid purposes, especially in cloud automation contexts. A companion detection such as monitoring `AuthorizeSecurityGroupIngress` events can enhance visibility into unauthorized access attempts following key import activities.

