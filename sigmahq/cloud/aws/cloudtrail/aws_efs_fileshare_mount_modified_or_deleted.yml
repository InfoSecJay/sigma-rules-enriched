note: |
  ### Technical Context

  This Sigma rule detects the deletion or modification of an Amazon Elastic File System (EFS) mount target. Such actions could indicate an attacker’s attempt to disrupt services by targeting file shares utilized by applications or EC2 instances. The likely objective is to cause denial of service or data accessibility issues, potentially facilitating further malicious activity. This behavior corresponds to the MITRE ATT&CK technique for "Data Manipulation" (T1485).

  The primary telemetry source is AWS CloudTrail logs, specifically looking for `DeleteMountTarget` events from the `elasticfilesystem.amazonaws.com` service. If executed by an unauthorized actor, the impact could lead to application failures or data loss. However, this detection alone does not confirm malicious intent or activity without additional context such as user identity, permissions, or prior related events.

  ### Investigation Steps

  - **Check CloudTrail logs for `DeleteMountTarget` events**: Search for CloudTrail logs where the `eventName` is `DeleteMountTarget`. Verify the `eventTime`, `userIdentity`, and `sourceIPAddress` fields to assess if the action originated from an authorized user or role.

  - **Validate the permissions of the user initiating the action**: Review IAM policy permissions associated with the `userIdentity` to ensure the actor has legitimate rights to delete EFS mount targets. Focus on assessing any unusual permissions that may not align with standard operational practices.

  - **Identify associated application instances**: Cross-reference the deleted mount target with running EC2 instances or services using it. Use tags or EFS metadata to identify dependencies and potential operational disruptions. For legitimate workflows, the deletion should correlate with scheduled maintenance or updates.

  - **Look for additional suspicious CloudTrail events**: Check for other recent events from the same user or role such as `CreateMountTarget`, `AttachFileSystem`, or multiple deletion requests. Multiple actions in a short timeframe may indicate malicious activity.

  - **Examine execution context**: Investigate the timing of the deletion in relation to other incidents or alerts in your environment. Look for concurrent anomalies such as unusual login attempts or changes around the same time.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical applications relying on the EFS mounts. Although direct evidence of malicious intent is not always clear, the likelihood of misuse of such capabilities is concerning given that service disruptions can be easily weaponized by attackers.

  ### Blind Spots and Assumptions

  The detection may be limited if CloudTrail logging is not enabled or properly configured to capture all necessary events. Legitimate activities, such as maintenance or scheduled deletions, could trigger the alert. A related detection to consider is monitoring `CreateMountTarget` actions in conjunction with deletions to identify potential abuse instances where new mounts are created following deletions.

