note: |
  ### Technical Context
  This detection rule identifies instances where an Amazon Elastic File System (EFS) mount target has been modified or deleted. Such actions can be indicative of a threat actor attempting to disrupt essential services that rely on the EFS for storage, ultimately aiming to cause downtime or data inaccessibility. Understanding this behavior is critical, as it can signal malicious intent such as sabotage or a prelude to more sophisticated attacks.

  A potential adversary may target EFS mount deletions with objectives to impact system availability, disrupt business operations, or deny access to critical data. Techniques relevant to this detection include **T1485: Data Destruction**, part of the Impact tactic in the MITRE ATT&CK framework, where deletion of resources can lead to significant operational impairment for affected applications. The primary data source relevant for this detection is AWS CloudTrail logs, which track API calls made to AWS services.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Analyze AWS CloudTrail logs for entries associated with EFS operations, specifically focusing on the `DeleteMountTarget` API calls. Check for the instance IDs and user identities involved in these actions.
  - **Cross-Reference IAM Policies**: Examine the Identity and Access Management (IAM) policies for the users or roles that executed the deletion. Ensure that there are no overly permissive policies allowing unauthorized deletion of resources.
  - **Assess Application Dependencies**: Identify the applications or services using the EFS mounts targeted for deletion. Determine if these services were impacted, potentially revealing if the deletion caused outages or interruptions.
  - **Monitor for Related Activity**: Check for correlated activities such as creation or modification of other EFS resources around the same timeframe to uncover any patterns that could indicate further malicious intent.

  ### Prioritization
  Given the nature of cloud infrastructures and reliance on EFS for data storage, alerts on mount target deletion should be prioritized as medium severity. This is due to the potential for significant business impact arising from service disruption or data accessibility issues, especially in environments where continuous access to data is critical.

  ### Blind Spots and Assumptions
  One major gap in detection coverage is the reliance on AWS CloudTrail logging being enabled and correctly configured, as missing logs could lead to undetected alterations. The detection logic assumes that deletions of mount targets are in fact malicious; in certain environments or circumstances, legitimate administrative actions might cause similar entries. Ensuring detailed and continuous logging, particularly for EFS actions, is vital for the effectiveness of this alert.

