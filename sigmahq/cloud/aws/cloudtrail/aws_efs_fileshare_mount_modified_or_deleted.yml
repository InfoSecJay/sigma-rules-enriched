  ---

  ### Technical Context

  This rule detects the deletion of an Amazon Elastic File System (EFS) mount target, which could signify an attempt by an attacker to disrupt services that rely on the affected file share. The likely objective of the attacker in this scenario could be to deny access to data or impair application functionality, consistent with the MITRE ATT&CK tactic “Impact” (T1485). The primary telemetry source is AWS CloudTrail, specifically looking for the event "DeleteMountTarget."

  Malicious execution of this event could lead to significant operational impacts as applications dependent on the EFS would encounter errors or downtime. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions can also trigger this event.

  ---

  ### Investigation Steps

  - **Check CloudTrail logs for DeleteMountTarget events:** Review CloudTrail logs (Event Name: `DeleteMountTarget`, Event Source: `elasticfilesystem.amazonaws.com`) for the time of the alert. Look for any alterations in the Resource Name field indicating affected file systems.

  - **Identify the user or role performing the action:** Verify the IAM user or role associated with the deletion event. Anomalies in identity usage, such as accounts not previously associated with EFS management, can indicate potential malicious activity.

  - **Review recent changes to IAM permissions:** Analyze permissions for roles and users who accessed the EFS mount prior to the deletion (IAM Policy changes in CloudTrail events). Confirm that these permissions align with their expected responsibilities.

  - **Assess application dependencies:** Identify applications or instances currently using the deleted mount target. Cross-reference these workloads to determine business impact and verify if they experienced outages during or after the deletion event.

  - **Look for patterns of repeated deletions or modifications:** Investigate if there have been multiple similar CloudTrail events (DeleteMountTarget) in a short timeframe, as this behavior could indicate automated scripts or repeated attacks aimed at disrupting services.

  - **Evaluate legitimate administrative activity:** Document known operations that could necessitate the deletion of EFS mount targets. Compare against logs to differentiate between benign administrative actions and suspicious behavior.

  ---

  ### Prioritization

  This alert is assessed as medium severity due to the potential operational disruption to critical applications relying on the deleted EFS file share. While the likelihood of malicious activity varies, the ability to weaponize such actions during an active compromise makes it a prioritized event for investigation.

  ---

  ### Blind Spots and Assumptions

  There are limitations to this detection, as legitimate configuration management practices may lead to similar deletion events. Proper logging must be configured for comprehensive coverage, including ensuring all CloudTrail logs are retained and monitored. Legitimate maintenance or operational procedures, such as scaling down resources or decommissioning services, can trigger this alert. A related detection that strengthens coverage includes monitoring for unusual IAM policies or role assumption events that precede deletion actions.

