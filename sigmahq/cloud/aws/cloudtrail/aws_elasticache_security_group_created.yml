note: |
  ### Technical Context
  This detection rule is designed to identify the creation of security groups within AWS ElastiCache, a managed caching service that can play a role in data handling and storage. The creation of a security group may indicate an initial step in establishing persistence for potentially malicious activity, such as unauthorized access or data exfiltration. Attackers may exploit this feature to configure access controls for their own use, allowing them to bypass existing security measures and manipulate data in cached repositories.

  Relevant MITRE ATT&CK tactics include **Persistence** and the technique **T1136 - Create Account**. The specific sub-technique involved here may align with **T1136.003 - Create Cache Security Group**, as it relates directly to altering security settings in the environment. The primary data source for this detection is **AWS CloudTrail logs**, which record API calls made against AWS services, including event details for security group modifications.

  ### Investigation Steps
  - **Verify User Identity**: Check the identity of the user or service account that initiated the creation of the ElastiCache security group. Look for any unfamiliar or suspicious accounts that do not typically engage in this type of activity.

  - **Analyze Event Context**: Review the event details in AWS CloudTrail logs. Pay attention to the timestamps, IP addresses, and user agents that align with the creation event to detect any unusual access patterns.

  - **Examine Security Group Rules**: Investigate the rules and settings of the newly created security group. Look for overly permissive settings or IP ranges that could facilitate unauthorized access or suspicious communications.

  - **Correlate with Other Logs**: Cross-reference the creation event with other relevant logs, such as VPC flow logs or NDR alerts, to identify any subsequent suspicious behavior, like unexpected outbound traffic from ElastiCache instances.

  ### Prioritization
  The severity of this alert in an enterprise environment is considered low, as legitimate changes by system administrators can trigger it. However, it remains critical to investigate to ensure malicious actors are not using security group creation to establish persistence.

  ### Blind Spots and Assumptions
  This detection rule may have gaps if AWS CloudTrail logging is not enabled for all regions or if the logs are not retained long enough for retrospective analysis. The logic assumes that security group creations are not common within the environment and relies on the identity of the user and context surrounding the action to differentiate between normal and potentially malicious behavior. Proper configurations and permissions must be in place to capture the necessary CloudTrail logs for effective detection and investigation.

