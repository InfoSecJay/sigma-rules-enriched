  ---

  ### Technical Context

  This rule detects the creation of an AWS ElastiCache security group, which is an operation that can signify an attempt to manage access controls for ElastiCache resources. An attacker may create a security group to modify access policies or facilitate data exfiltration routes, potentially to bypass existing firewall rules. This behavior corresponds to the MITRE ATT&CK framework's tactic of Persistence (ID: T1136) and more specifically, the technique of Create Account (ID: T1136.003).

  The primary telemetry source for this detection is AWS CloudTrail. The log type will include records of API calls made to Amazon ElastiCache, specifically the event name "CreateCacheSecurityGroup." If this detection logs a malicious activity, it could result in unauthorized access to sensitive caching services or data. Importantly, this detection does NOT confirm malicious intent on its own; it merely indicates that a security group was created and requires further investigation to ascertain the context and legitimacy.

  ---

  ### Investigation Steps

  - **Verify user identity and context: **Check the user and IAM role associated with the "CreateCacheSecurityGroup" event in CloudTrail logs. Look for familiar, authorized accounts versus unknown or suspicious identities, and consider the user agent and originating IP address.

  - **Analyze timestamps: **Correlate the event timestamp (CloudTrail’s eventTime field) with other activities in the environment. Verify whether legitimate maintenance or administrative tasks coincide with the creation of the security group.

  - **Identify related security group creations: **Review the AWS CloudTrail logs for the last 30 minutes for any other "CreateCacheSecurityGroup" events. Rapid or bulk security group creation may indicate malicious intent.

  - **Legitimate behavior check: **Investigate whether security group creation aligns with planned changes or configurations in your organization. Consult change management logs to confirm whether the activity was scheduled.

  - **Monitor additional API interactions: **Assess for follow-up actions related to the created security group; examine logs for events like “AuthorizeSecurityGroupIngress” (which would permit access) within a 24-hour window after the group creation.

  ---

  ### Prioritization

  The alert severity is low, given that the event indicates a potential configuration change rather than an active exploit. However, if the affected ElastiCache instance holds sensitive data, the likelihood of abuse must be evaluated, especially if the event is tied to unfamiliar users or abnormal patterns. While creating security groups isn't inherently malicious, it can facilitate broader exploitation if used with malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection relies on comprehensive CloudTrail logging of ElastiCache events; any gaps could lead to undetected activities. Legitimate activities, such as routine maintenance by administrators, could trigger this alert and result in false positives. Additionally, consider companion detections related to network configuration changes, such as AWS security group changes (other than ElastiCache) to enhance situational awareness in case of broader attempts at exploitation.

