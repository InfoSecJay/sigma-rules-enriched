note: |
  ### Technical Context

  This rule detects the creation of an AWS ElastiCache security group, which may indicate an attempt to establish persistence or reconfigure access controls. The likely attacker objective is to facilitate unauthorized access or communication within cloud resources, aligning with the MITRE ATT&CK technique of "Create or Modify System Process" (T1136.003). The primary telemetry sources include AWS CloudTrail logs, specifically looking for the `CreateCacheSecurityGroup` event from the `elasticache.amazonaws.com` service. If malicious, this action could lead to unauthorized data access or compromise within AWS environments. However, this detection alone does NOT confirm malicious intent, as legitimate administrators may also create security groups.

  ### Investigation Steps

  - **Identify user identity:** Review AWS CloudTrail logs for the `CreateCacheSecurityGroup` event (Event Name) to find the `userIdentity` field. Verify if the user is an authorized AWS account. Legitimate changes typically involve known administrator accounts.

  - **Analyze user agent and IP:** Check the `userAgent` and `sourceIPAddress` in CloudTrail logs associated with the event. Look for known, trusted IPs or user agents. Unusual or unfamiliar IPs should be flagged for deeper investigation.

  - **Review security group configuration:** Inspect the configurations of the newly created security group, particularly the inbound and outbound rules. Look for open configurations that allow traffic from suspicious or untrusted IP ranges, which could indicate malicious intent.

  - **Evaluate historical context:** Search for any previous `CreateCacheSecurityGroup` events and examine if there is a pattern of repeated creations from the same user or host. Frequent creations could signify a potential breach.

  - **Contextualize with network traffic:** Check VPC flow logs or internal monitoring for traffic patterns to or from the newly created security group. Malicious activity often follows the creation of security groups, such as unexpected data transfer or unauthorized service access.

  ### Prioritization

  This alert should be considered low severity unless correlated with additional anomalous activities or high-risk assets. The creation of ElastiCache security groups could indicate potential malicious behavior if associated with unfamiliar users or IP addresses, though it may also represent benign administrative actions.

  ### Blind Spots and Assumptions

  Detection relies heavily on accurate AWS CloudTrail logging, which must be properly configured to ensure complete visibility. The rule may miss legitimate actions performed by trusted administrators, especially if they operate from known or whitelisted IP addresses. Additionally, monitoring for related activities, such as the deletion of security groups or changes to IAM policies (T1530), can strengthen overall coverage and context around potential misconfigurations or attacks.

