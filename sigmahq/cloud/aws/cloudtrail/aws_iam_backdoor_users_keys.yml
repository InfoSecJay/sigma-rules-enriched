title: AWS IAM Backdoor Users Keys
id: 0a5177f4-6ca9-44c2-aacf-d3f3d8b6e4d2
status: test
description: |
  Detects AWS API key creation for a user by another user.
  Backdoored users can be used to obtain persistence in the AWS environment.
  Also with this alert, you can detect a flow of AWS keys in your org.
references:
- https://github.com/RhinoSecurityLabs/pacu/blob/866376cd711666c775bbfcde0524c817f2c5b181/pacu/modules/iam__backdoor_users_keys/main.py
author: faloker
date: 2020-02-12
modified: 2022-10-09
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_source:
    eventSource: iam.amazonaws.com
    eventName: CreateAccessKey
  filter:
    userIdentity.arn|contains: responseElements.accessKey.userName
  condition: selection_source and not filter
falsepositives:
- Adding user keys to their own accounts (the filter cannot cover all possible variants
  of user naming)
- AWS API keys legitimate exchange workflows
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of AWS API keys for a user by another user, which can indicate potential backdoor access to an AWS environment. The ability to create access keys for users other than oneself can be abused by malicious actors to establish persistence within the cloud infrastructure, enabling unauthorized actions while maintaining covert access. This behavior is often associated with attackers who have gained sufficient privileges to manipulate IAM policies, allowing them to evade detection and maintain control over cloud resources.

  The relevant MITRE ATT&CK tactics here include **Persistence (T1098)**, as creating backdoor access keys is a method for establishing ongoing access to resources, and **Privilege Escalation**, where an attacker may leverage elevated permissions to perform these actions. This rule primarily analyzes AWS CloudTrail logs, specifically focusing on events related to the IAM service and key management, which provide detailed records of AWS API calls.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Examine AWS CloudTrail logs for events with the `CreateAccessKey` action to identify any anomalous key creation activities by users other than themselves.
  - **Assess User Permissions:** Verify the IAM policies associated with users involved in key creation to determine if they have unauthorized privileges that could facilitate backdooring.
  - **Cross-Reference with Key Usage:** Investigate usage patterns of the newly created API keys by correlating them with additional CloudTrail logs, focusing on unusual access patterns or resource manipulation.
  - **Check for Other Backdoor Indicators:** Look for other common signs of backdoor creation, such as unusual IAM roles, policies granting excessive permissions, or a flow of access keys linked to new or compromised user accounts.

  ### Prioritization
  This alert is of medium severity as it highlights potentially malicious activities that can lead to severe security breaches if backdoor access is confirmed. The likelihood of exploited privileges, along with the potential impact of unauthorized access to sensitive resources, warrants prompt investigation and response.

  ### Blind Spots and Assumptions
  This detection logic may not fully capture all instances of backdoor creation, particularly in cases where users can create access keys for other service accounts or if there are workflows that involve legitimate key creations which may go unnoticed. The accuracy of the detection depends on the proper configuration of CloudTrail to capture all IAM-related events; missing or configured-inaccurately logs can lead to missed detections. Additionally, the logic assumes that users would be inclined to create keys only for accounts other than their own, which may not be the case in legitimate use cases.

