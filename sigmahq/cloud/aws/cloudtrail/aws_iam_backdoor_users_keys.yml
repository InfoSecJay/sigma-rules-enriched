title: AWS IAM Backdoor Users Keys
id: 0a5177f4-6ca9-44c2-aacf-d3f3d8b6e4d2
status: test
description: |
  Detects AWS API key creation for a user by another user.
  Backdoored users can be used to obtain persistence in the AWS environment.
  Also with this alert, you can detect a flow of AWS keys in your org.
references:
- https://github.com/RhinoSecurityLabs/pacu/blob/866376cd711666c775bbfcde0524c817f2c5b181/pacu/modules/iam__backdoor_users_keys/main.py
author: faloker
date: 2020-02-12
modified: 2022-10-09
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_source:
    eventSource: iam.amazonaws.com
    eventName: CreateAccessKey
  filter:
    userIdentity.arn|contains: responseElements.accessKey.userName
  condition: selection_source and not filter
falsepositives:
- Adding user keys to their own accounts (the filter cannot cover all possible 
  variants of user naming)
- AWS API keys legitimate exchange workflows
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the event where an AWS user creates an access key for another user, indicating a potential backdoor creation in an AWS environment. Attackers may leverage this behavior to maintain unauthorized access and manipulate resources without detection. This behavior is associated with the MITRE ATT&CK framework under the tactic of Persistence and the technique ID T1098 (Account Manipulation).

  The primary telemetry source for this detection is AWS CloudTrail logs, specifically focusing on the Event Name `CreateAccessKey` to identify unauthorized key creation activity. If malicious, this could lead to significant security impact, allowing attackers to maintain long-term access to AWS resources undetected. Importantly, this detection does NOT confirm that the access key is used for malicious purposes without further contextual investigation.

  ---

  ### Investigation Steps

  - **Check CloudTrail logs for `CreateAccessKey`:** Review CloudTrail logs for the `CreateAccessKey` event (Event Name) to identify the user who created the key. Look for unusual users or roles creating access keys, especially from unfamiliar IP addresses.

  - **Examine user permissions and roles:** Validate the permissions of the user that created the access key (check for Event Source: `iam.amazonaws.com`). Look for excessive privileges or anomalous role assignments compared to standard practice.

  - **Review recent activity for the affected account:** Investigate the last 5–10 CloudTrail events related to the affected user or role that had an access key created, focusing on date/time stamps and actions performed. Established profiles typically show predictable patterns of behavior.

  - **Identify the access key usage:** Search CloudTrail for logs referencing the newly created access key to confirm any subsequent API calls made using that key. Malicious indicators include access attempts outside of normal hours or unusual resource access patterns.

  - **Correlate with known malicious indicators:** Cross-reference the user agents or IP addresses noted in the `CreateAccessKey` event with threat intelligence sources (e.g., blocklists, known bad actors) to identify any malicious associations.

  ---

  ### Prioritization

  This alert carries medium severity based on the potential impact of the affected AWS user account. Unauthorized access key creation can lead to privilege escalation and persistence risks, particularly in environments where such credentials can be exploited. Although this behavior can occur legitimately, unexpected access key creations from unmonitored accounts should be investigated promptly.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate user workflows, such as system administrators creating keys for service accounts. This alert may be triggered by common practices in DevOps or automation accounts, necessitating contextual understanding of user roles. Required AWS CloudTrail log configurations must be correctly set to ensure reliable event logging. A related detection to strengthen coverage includes monitoring for unusual activity following the issuance of access keys, such as unauthorized API access or resource manipulation.

