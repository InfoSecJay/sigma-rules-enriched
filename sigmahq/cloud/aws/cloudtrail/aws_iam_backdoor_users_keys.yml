title: AWS IAM Backdoor Users Keys
id: 0a5177f4-6ca9-44c2-aacf-d3f3d8b6e4d2
status: test
description: |
  Detects AWS API key creation for a user by another user.
  Backdoored users can be used to obtain persistence in the AWS environment.
  Also with this alert, you can detect a flow of AWS keys in your org.
references:
- https://github.com/RhinoSecurityLabs/pacu/blob/866376cd711666c775bbfcde0524c817f2c5b181/pacu/modules/iam__backdoor_users_keys/main.py
- https://github.com/SigmaHQ/sigma/issues/6223
author: faloker
date: 2020-02-12
modified: 2026-08-14
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: CreateAccessKey
  filter_main_same_user:
    userIdentity.arn|fieldref|contains: responseElements.accessKey.userName
  condition: selection and not 1 of filter_main_*
falsepositives:
- Adding user keys to their own accounts (the filter cannot cover all possible 
  variants of user naming)
- AWS API keys legitimate exchange workflows
level: medium
note: |
  ### Technical Context

  This rule detects the creation of AWS IAM access keys for a user by another user, indicating a potential backdoor setup within the AWS environment. Attackers may aim to establish persistence, maintain access, or perform reconnaissance without detection, thereby compromising cloud infrastructure. The relevant MITRE ATT&CK tactics are Persistence (T1098) and Privilege Escalation (T1098). The primary telemetry source is AWS CloudTrail, which logs API call actions. Failure to detect such unauthorized key management can enable attackers to exploit the environment significantly, allowing for data exfiltration or further lateral movement. Importantly, this detection does NOT confirm malicious activity on its own; further analysis is required to establish intent.

  ### Investigation Steps

  - **Review CloudTrail logs for API call details**: Check CloudTrail logs for the CreateAccessKey event (Event Name: CreateAccessKey). Verify the `userIdentity.arn` field to ascertain who initiated the key creation and ensure it is not the same user for whom the access key was created.

  - **Identify unusual user behavior**: Investigate whether the initiating user has a legitimate business need to create access keys for others. Look for role changes or unusual activity patterns preceding the key creation.

  - **Compare with legitimate activity**: For typical activity, access keys should primarily be created by administrative accounts under specific workflows, such as onboarding new services. Document and cross-reference legitimate access key creation requests with the logs.

  - **Correlate access keys with IAM policies**: Check the permissions associated with the newly created access key in the IAM console to identify potentially excessive privileges. This includes auditing for inline and managed policies that might facilitate privilege escalation.

  - **Search for unauthorized access attempts using newly created keys**: Use CloudTrail to look for successful or failed API calls made using the newly created access keys. Look into fields like `eventSource` and `eventName` to trace actions taken with these keys that deviate from normal usage patterns.

  - **Validate account ownership and potential phishing vectors**: Confirm the legitimacy of the involved accounts, including checking for recent user logins and potential phishing attempts that may have compromised credentials.

  ### Prioritization

  The alert severity is medium due to the potential security impact of unauthorized key creation within a cloud environment. While the likelihood of abuse is significant, especially in a mature enterprise setting, such behavior can sometimes stem from legitimate DevOps practices. However, this workflow is often weaponized to establish persistence.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate users may create keys for their own accounts, a common practice that can trigger false positives. Consistent logging from AWS CloudTrail, particularly around IAM activities, is necessary for reliable detection. Legitimate activities may include developers creating keys for service accounts. A companion detection that strengthens coverage would involve monitoring for unusual patterns of API calls originating from newly created keys.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
