  ---

  ### Technical Context

  This rule detects potentially unauthorized operations involving AWS Glue development endpoints, specifically the creation, deletion, or updating of these endpoints. The likely attacker objective is to leverage Glue for data processing or extraction, potentially for exfiltration or privilege escalation. Related MITRE ATT&CK tactics include **Initial Access (TA0001)** and **Privilege Escalation (TA0004)**, with techniques such as **Account Manipulation (T1098)** and **Cloud Service Discovery (T1098)**.

  The primary telemetry sources are AWS CloudTrail logs, capturing event details for AWS Glue API calls. The security impact of malicious behavior could involve unauthorized data access or manipulation. This detection does NOT confirm malicious intent on its own, as legitimate administrative actions can trigger it.

  ---

  ### Investigation Steps

  - **Identify user actions:** Review AWS CloudTrail logs for Event Name fields including **CreateDevEndpoint**, **DeleteDevEndpoint**, and **UpdateDevEndpoint**. Check the **userIdentity** and **eventTime** fields to verify if these actions correlate with known legitimate administrative tasks.

  - **Assess user context:** Confirm whether the user associated with the Glue operations is authorized to perform these actions. Compare against IAM policies and user roles; unexpected user IDs could indicate potential compromise.

  - **Examine recent activity:** Look for a sequence of Glue endpoint actions in CloudTrail within a short timeframe (e.g., multiple Create/Update/Delete actions). This activity may indicate exploratory behavior typical of an attacker trying to establish control.

  - **Analyze IP address and user agent:** Validate the **sourceIPAddress** and **userAgent** fields in CloudTrail logs. Any discrepancies from known administration workstation IPs or typical user agents should raise flags for further investigation.

  - **Verify legitimate operations:** Standard development uses AWS Glue for ETL operations with expected lifecycle events. Confirm if documented development workflows align with the detected activity, focusing on known project timelines and users.

  - **Check for related anomalies:** Monitor for any unusual S3 bucket access or data movements linked to the same user. Review associated CloudTrail logs for S3 API calls (e.g., GetObject, PutObject) in conjunction with Glue actions.

  ---

  ### Prioritization

  This alert is considered low severity due to the lower risk associated with Glue development endpoints compared to other AWS services. However, unauthorized modification or creation of these endpoints can lead to data access risks, especially if the affected system contains sensitive information. Malicious exploitation of these actions can occasionally align with attacker techniques, but such activities are less common than more direct exploitation methods.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by changes in AWS identities or roles that could allow legitimate users to perform these actions without triggering alerts. False positives can occur if system administrators are routinely performing Glue endpoint management. Logging setup in CloudTrail must capture all related events accurately for reliable detection; ensure CloudTrail is enabled across all AWS regions. A companion detection could involve monitoring for anomalous S3 access correlated to the development endpoint activity for enhanced context and coverage.

