logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: elasticfilesystem.amazonaws.com
    eventName: DeleteFileSystem
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects modifications or deletions of AWS EFS (Elastic File System) file shares, specifically via the DeleteFileSystem API call. The likely attacker objective is to disrupt service availability or exfiltrate sensitive data by targeting file shares that contain critical or confidential information. The related MITRE ATT&CK technique is "Impact" (T1499), which encompasses actions taken by malicious actors to cause system downtime or data loss.

  The primary telemetry source is AWS CloudTrail logs, which capture events related to API calls in AWS services. Specifically, look for `eventSource: elasticfilesystem.amazonaws.com` and `eventName: DeleteFileSystem`. If this behavior is confirmed malicious, it could lead to significant data loss or operational disruption. Importantly, this detection does NOT confirm intent to maliciously act on the file share without additional context and investigation.

  ### Investigation Steps

  - **Verify CloudTrail logs for DELETE events:** Check AWS CloudTrail logs for entries with `eventSource: elasticfilesystem.amazonaws.com` and `eventName: DeleteFileSystem`. Focus on the `userIdentity` field to review who initiated the deletion and their IAM permissions.

  - **Check for associated delete mount targets:** If `DeleteFileSystem` was executed, confirm whether delete operations for mount targets precede this action. Look for `eventName: DeleteMountTarget` in the CloudTrail logs.

  - **Examine affected EFS configuration:** Review the EFS file system configuration via the AWS Management Console or CLI, paying attention to the `CreationTime` and `FileSystemId` fields. Legitimate changes may include manageable operational adjustments by authorized users.

  - **Look for unusual IAM activity:** Search for any recent changes in IAM roles or policies linked to the user or service account attempting to delete the file system. This can highlight potential privilege escalation attempts.

  - **Identify criticality of the affected EFS:** Understand the role of the modified or deleted EFS in business operations. Analyze whether it was associated with sensitive applications or data, impacting security and compliance.

  ### Prioritization

  This alert has medium severity due to the potential for significant operational impact if critical file shares are targeted. The likelihood of malicious abuse is moderate, as the role of EFS in cloud architectures makes it a viable target for disruption. While delete operations are not incredibly common, they can be weaponized during ransomware or insider threats.

  ### Blind Spots and Assumptions

  Detection limitations include missed API calls if CloudTrail logging is not consistently enabled or configured correctly. Legitimate activities that may trigger this alert could include administrative maintenance or legitimate user requests for cleanup. A related detection that enhances coverage is monitoring for unusual API call patterns, such as high frequency of delete actions from specific identities, indicating suspicious behavior.

