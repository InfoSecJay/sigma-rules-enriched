title: AWS EFS Fileshare Modified or Deleted
id: 25cb1ba1-8a19-4a23-a198-d252664c8cef
status: test
description: |
  Detects when a EFS Fileshare is modified or deleted.
  You can't delete a file system that is in use.
  If the file system has any mount targets, the adversary must first delete them, so deletion of a mount will occur before deletion of a fileshare.
references:
- https://docs.aws.amazon.com/efs/latest/ug/API_DeleteFileSystem.html
author: Austin Songer @austinsonger
date: 2021-08-15
modified: 2022-10-09
tags:
- attack.impact
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: elasticfilesystem.amazonaws.com
    eventName: DeleteFileSystem
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of AWS Elastic File System (EFS) file shares through AWS CloudTrail logs. Such actions could indicate potential malicious activities, especially if they occur unexpectedly or outside of normal operational hours. In typical threat scenarios, attackers may attempt to disrupt services or exfiltrate data by modifying or deleting file systems, potentially seeking to eliminate traces of their presence or sabotaging target resources.

  The relevant MITRE ATT&CK tactics include **Impact (TA0040)**, with specific techniques such as **Data Destruction (T1485)** and **Data Manipulation (T1293)**. Both techniques reflect an attacker's intent to manipulate or destroy data in order to hinder business operations or hide their activities. Analysts should focus on AWS CloudTrail logs to capture detailed records of the deletion and modification events and trace any preceding actions that led to these modifications.

  Primary data sources for this rule include:
  - AWS CloudTrail logs, specifically events related to EFS actions.
  - Logs from any security tools in place to monitor AWS activities for unusual patterns.

  ### Investigation Steps
  - **Review AWS CloudTrail Logs:** Examine CloudTrail logs for recent events associated with EFS actions, particularly `DeleteFileSystem` events. Look for the context and timeframe of the deletion to establish whether it aligns with known administrative actions.

  - **Analyze User Activity:** Investigate the IAM user or role that triggered the modification or deletion. Determine if this actor has a valid reason to perform such an operation, considering both identity and access privileges.

  - **Cross-reference with Normal Activity:** Compare the current EFS activity against the historical baseline to identify any anomalies. This includes evaluating whether the file system was in use prior to deletion, as unmounted file systems are subject to deletion.

  - **Check for Mount Target Deletions:** If a file system was deleted, confirm whether correlated events show that any mount targets were deleted beforehand. This could provide insight into the potential malicious behavior of unauthorized deletions.

  ### Prioritization
  The medium severity of this alert is justified due to the potential for significant operational impact; unauthorized deletion or modification of file shares can lead to data loss, service disruption, and hindered recovery efforts in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by instances where AWS CloudTrail logging is not fully enabled or configured, potentially missing out on critical events. The detection logic assumes that the actors performing the deletions are not authorized, which may not always hold true in environments with complex delegation. To ensure functionality, CloudTrail logs must capture all EFS-related actions effectively, thus requiring comprehensive logging configurations.

