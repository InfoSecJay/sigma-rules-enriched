  ---

  ### Technical Context

  This rule detects the deletion or modification of an AWS Elastic File System (EFS) fileshare, specifically actions initiated with the `DeleteFileSystem` API call. The likely objective of an attacker could be to disrupt services, remove traces of their activity, or prepare the environment for further exploitation. This behavior aligns with the MITRE ATT&CK tactic for Impact (TA0040) and the technique for Data Destruction (T1485).

  Primary telemetry sources include AWS CloudTrail logs which capture the relevant API events. If this action is malicious, it can lead to data loss, service disruptions, and operational setbacks. However, it is important to note that this detection does NOT confirm malicious intent, as benign administrative actions (e.g., system maintenance) can trigger the same event.

  ---

  ### Investigation Steps

  - **Check CloudTrail logs for the `DeleteFileSystem` event:** Review AWS CloudTrail logs for `eventSource` equal to `elasticfilesystem.amazonaws.com` and `eventName` equal to `DeleteFileSystem`. Focus on identifying any anomalies such as deletion times outside of regular business hours.

  - **Correlate the event with existing EFS mount targets:** Identify if any mount targets existed prior to the deletion by reviewing the CloudTrail logs for `CreateMountTarget` events. If no mount targets existed, this adds context to potential malicious activity.

  - **Validate the user identity making the deletion request:** Investigate the `userIdentity` field associated with the deletion in the CloudTrail logs. If the user is not an authorized administrator or lacks any history of modifications, this could indicate a malicious action.

  - **Review recent changes or activity on the filesystem:** Analyze EFS access logs or CloudTrail logs to check for prior write activities on the fileshare. Unexpected modifications leading up to the deletion, especially from a non-administrator account, can signal suspicious behavior.

  - **Identify legitimate activities during investigation:** Assess if there are any scheduled maintenance activities, especially from automated systems or known administrative accounts, that may justify the deletion or modification actions.

  - **Look for subsequent resource changes:** Check for additional events in CloudTrail logs following the `DeleteFileSystem` event, such as additional API calls related to resource cleanup or suspicious network traffic that may indicate an exfiltration attempt.

  ---

  ### Prioritization

  The severity of this alert is medium, as it can indicate significant operational impact if filesystems are being maliciously deleted. Given that attackers often seek to destroy or modify access to data to cover their tracks, this behavior has a higher likelihood of being weaponized in actual attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative deletions triggering this rule. Reliable detection requires comprehensive CloudTrail logging configurations to capture all EFS-related API activity. Additionally, actions triggering this alert could arise from automated scripts or configurations, and not always indicate malicious intent. A companion detection to consider is monitoring for unusual login activities (e.g., failed logins) from the user making the deletion request, which can help establish context around potential user impersonation.

