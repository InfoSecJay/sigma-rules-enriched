note: |
  ### Technical Context
  This rule detects modifications to the AWS EC2 instance startup shell script, which is a critical component that runs as root or SYSTEM during the boot process of an instance. Attackers may exploit this capability to embed malicious scripts that could facilitate persistent access, data exfiltration, or other malicious activities within an organization’s cloud environment. The typical threat scenario involves a compromised IAM account or misconfigurations that allow unauthorized users to modify instance attributes and inject malicious scripts.

  The presence of such modifications can indicate potential malicious activities tied to the MITRE ATT&CK techniques, particularly those under the Execution tactic, including:
  - **T1059.001 - Command and Scripting Interpreter: Shell**
  - **T1059.003 - Command and Scripting Interpreter: Windows Command Shell**
  - **T1059.004 - Command and Scripting Interpreter: Unix Shell**

  The primary data source for this detection is AWS CloudTrail logs, which track API calls and modifications made to EC2 instances, thus providing a detailed account of any changes made to instance attributes, including startup scripts.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine the CloudTrail logs for events capturing `ModifyInstanceAttribute` actions, specifically filtering for changes to the `userData` attribute.
  - **Identify Source IP Addresses**: Check the source IP addresses associated with the modification events to identify if the changes originated from legitimate users or unexpected locations.
  - **Examine IAM Policies**: Investigate the IAM policies of user accounts and roles that have made changes to ensure they have appropriate permissions and are not overly permissive.
  - **Analyze Instance Performance Logs**: Look for unusual behavior or performance degradation in the affected EC2 instances that might indicate the execution of unauthorized scripts.

  ### Prioritization
  This alert is classified as high severity due to the significant risk that unauthorized changes to startup scripts can pose. Malicious scripts executed with root privileges significantly increase the likelihood of compromise within the cloud environment, making it essential to address such alerts with urgency.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the logs from CloudTrail are not being retained long enough or if there are misconfigurations that prevent logging of relevant events. Additionally, the detection assumes that all changes to the startup script should be scrutinized, which may not account for valid operational requirements such as routine maintenance or updates by authorized personnel. This alert relies on the existence of robust CloudTrail logging configurations to capture changes effectively; without these, detection may be incomplete or ineffective.

