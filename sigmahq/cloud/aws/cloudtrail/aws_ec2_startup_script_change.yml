note: |
  ### Technical Context

  This rule detects modifications to the startup shell script executed as root on AWS EC2 instances. Such changes can be indicative of an attacker trying to establish persistence or execute malicious commands on system startup. The likely goal here is to execute scripts that may exfiltrate data, install backdoors, or perform other nefarious activities upon instance launch. The relevant MITRE ATT&CK tactic is "Execution" with techniques T1059.001 (Command and Scripting Interpreter: Bash), T1059.003 (Command and Scripting Interpreter: PowerShell), and T1059.004 (Command and Scripting Interpreter: Windows Command Shell).

  Primary telemetry sources include AWS CloudTrail logs, specifically monitoring `eventSource: ec2.amazonaws.com` and `eventName: ModifyInstanceAttribute`. If detected modifications are malicious, the attacker could gain persistent access to the compromised EC2 instance. This detection does NOT confirm malicious intent on its own as valid changes to startup scripts may occur during administration or provisioning activities.

  ### Investigation Steps

  - **Check CloudTrail logs for modifications:** Review AWS CloudTrail logs for `ModifyInstanceAttribute` events. Key fields to examine: `userIdentity`, `eventTime`, and `requestParameters`. Look for unfamiliar or anomalous user identities associated with the modification.

  - **Validate expected behavior:** Assess whether the modification was part of approved change management processes. Valid changes are typically associated with specified personnel and documented in change logs.

  - **Identify high-risk indicators:** Look for unusual scripts or commands in the `userData` field of `ModifyInstanceAttribute` events that include remote callouts or encoded data (e.g., base64-encoded strings).

  - **Cross-reference with instance configuration:** Examine the EC2 instance's tags and metadata (using AWS CLI or Console) to ensure that the instances whose scripts were modified are correctly configured and assessed regarding their role and criticality to the enterprise.

  - **Review IAM roles and user privileges:** Investigate if the IAM user or role responsible for the modification has excessive permissions. Ensure that the principle of least privilege is being applied.

  ### Prioritization

  Severity is high due to the potential for unrestricted execution of scripts with root privileges on EC2 instances, which can lead to significant data exfiltration or operational disruption. The likelihood of malicious exploitation is high, especially if unfamiliar patterns are observed in `userData` modifications, as these may frequently be weaponized by adversaries.

  ### Blind Spots and Assumptions

  Possible evasion techniques might include legitimate users falsely modifying startup scripts to blend in with regular activity. The detection relies on effective logging configurations for AWS CloudTrail; therefore, logs must be enabled and retained for comprehensive visibility. Legitimate CI/CD processes may also trigger the alert during automated deployments. A related detection to consider increasing overall coverage is monitoring `RunInstances` events to detect when new instances are provisioned with potentially malicious user data.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
