title: RDS Database Security Group Modification
id: 14f3f1c8-02d5-43a2-a191-91ffb52d3015
status: test
description: |
  Detects changes to the security group entries for RDS databases.
  This can indicate that a misconfiguration has occurred which potentially exposes the database to the public internet, a wider audience within the VPC or that removal of valid rules has occurred which could impact the availability of the database to legitimate services and users.
references:
- https://www.gorillastack.com/blog/real-time-events/important-aws-cloudtrail-security-events-tracking/
author: jamesc-grafana
date: 2024-07-11
tags:
- attack.initial-access
- attack.t1190
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'rds.amazonaws.com'
    eventName:
    - 'AuthorizeDBSecurityGroupIngress'
    - 'CreateDBSecurityGroup'
    - 'DeleteDBSecurityGroup'
    - 'RevokeDBSecurityGroupIngress'
  condition: selection
falsepositives:
- Creation of a new Database that needs new security group rules
level: medium
note: |
  ### Technical Context
  This rule detects modifications made to security group entries associated with Amazon RDS (Relational Database Service) databases, specifically through AWS CloudTrail logs. Such modifications can indicate potential misconfigurations that may inadvertently expose the database to the public internet, unauthorized access within the Virtual Private Cloud (VPC), or the removal of valid rules that could hinder legitimate services and users' access. The attacker’s objective may be to exploit these vulnerabilities to gain initial access, compromise sensitive data, or cause service disruptions.

  The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001), particularly the technique of **Exploitation of Public-Facing Application** (T1190). Attackers may attempt to alter security settings to create entry points for later exploitation or reconnaissance. The primary data source for this detection is **AWS CloudTrail logs**, which detail every API call made in the AWS environment, thus providing comprehensive visibility into security group changes.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Analyze AWS CloudTrail logs for `AuthorizeDBSecurityGroupIngress`, `CreateDBSecurityGroup`, `DeleteDBSecurityGroup`, and `RevokeDBSecurityGroupIngress` events to identify unauthorized or unexpected changes to RDS security groups.
  - **Assess Security Group Rules**: Validate the configuration of RDS security groups by comparing current settings against the organization's security policies to identify any misconfigurations or unnecessary public access.
  - **Monitor VPC Flow Logs**: Examine VPC flow logs for unusual traffic patterns targeting the RDS databases which could indicate exposure as a result of the modified security group rules.
  - **Investigate Related Account Activity**: Investigate the AWS account activity, including IAM role usage and user API activities, that coincided with the alteration of security group rules to assess legitimate versus suspicious actions.

  ### Prioritization
  The alert is considered medium severity within an enterprise environment due to the potential impact on database availability and security. Unauthorized modifications to security groups can lead to significant vulnerabilities, exposing sensitive data and increasing the risk of compromise.

  ### Blind Spots and Assumptions
  A gap in detection coverage includes environments where AWS CloudTrail logging is not properly configured or disabled, preventing the capture of necessary logs for this alert. The detection logic assumes that any change to the security group entries is suspicious without contextual analysis, which could lead to false positives, such as legitimate configurations for new databases. The effectiveness of this alert is contingent upon having detailed CloudTrail logging enabled for all relevant RDS activities and sufficient retention periods for forensic analysis.

