level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to AWS RDS database security group entries, specifically actions that manage ingress and egress rules. The behavior indicates potential misconfigurations that could expose databases to unauthorized access, thereby compromising data integrity and confidentiality. The likely attacker objective could be to gain unauthorized access or disrupt legitimate users by editing rules incorrectly. This detection pertains to the MITRE ATT&CK tactic of **Initial Access** (TA0001) and specifically targets the technique **Exploit Public-Facing Application** (T1190). The primary telemetry source is AWS CloudTrail, capturing events such as `AuthorizeDBSecurityGroupIngress`, `CreateDBSecurityGroup`, `DeleteDBSecurityGroup`, and `RevokeDBSecurityGroupIngress`. If malicious, it may lead to serious security incidents, including data breaches. However, this detection does not confirm malicious intent on its own, as legitimate operations might equally trigger these alerts.

  ### Investigation Steps

  - **Verify log events for context:** Review AWS CloudTrail logs for events with `eventSource: rds.amazonaws.com` and `eventName` related to security group modifications. Check relevant fields such as `userIdentity`, `sourceIPAddress`, and timestamp to understand the origin and timing of the change.

  - **Assess the affected security group:** Inspect the updated security group rules in the AWS Management Console to determine if ingress rules allow overly permissive access (e.g., `0.0.0.0/0`). An indication of a serious issue would be unauthorized public access to the database.

  - **Identify legitimate configuration changes:** Determine if the involved user or role is performing expected administrative tasks, such as modifying security rules as documented in change management records or AWS operations. For instance, security group adjustments should correlate with database provisioning or maintenance scripts.

  - **Cross-reference past configurations:** Use AWS Config or similar tools to verify the historical behavior of the modified security group, noting any significant alterations in rules that deviate from the baseline defined in organizational policy.

  - **Look for indicators of abuse:** Search for patterns in the `sourceIPAddress` field of CloudTrail logs that indicate access from unusual external IP ranges or consecutive failed authorization attempts prior to the security group modifications, typically a sign of malicious activity.

  ### Prioritization

  This alert is classified as medium severity. Affected systems, such as production RDS databases, often hold critical business data. The likelihood of malicious abuse is moderate due to the appeal of gaining unwarranted access, and such configurations are frequently targeted by attackers seeking to exploit vulnerabilities in public-facing applications.

  ### Blind Spots and Assumptions

  Detection may be limited if CloudTrail logging is misconfigured or incomplete, potentially missing critical events. Legitimate activities, such as deploying new databases, could trigger the alert unintentionally. It is advisable to complement this rule with detections for unusual access patterns or unauthorized changes to IAM roles associated with RDS to enhance overall security posture.

