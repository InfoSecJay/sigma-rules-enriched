note: |
  ### Technical Context

  This rule detects the disabling of AWS Config services by monitoring for events such as `DeleteDeliveryChannel` and `StopConfigurationRecorder`. The likely attacker objective may involve attempting to evade detection or alter the environment's configuration for malicious purposes. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically Technique T1685.002 - "Disable Security Software."

  Primary telemetry sources include AWS CloudTrail logs, specifically focusing on events related to AWS Config service actions. If the detected behavior is indeed malicious, it may compromise visibility into changes within the AWS environment, potentially facilitating unauthorized access or manipulation of AWS resources. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative changes may result in similar log entries.

  ### Investigation Steps

  - **Check CloudTrail logs for relevant events:** Review AWS CloudTrail logs for `eventSource` as `config.amazonaws.com` and `eventName` as either `DeleteDeliveryChannel` or `StopConfigurationRecorder`. Note the `userIdentity` field to identify the user or role initiating the action.

  - **Identify user roles and permissions:** Verify the permissions associated with the user or role that triggered the event. Authorized users may have legitimate reasons for disabling AWS Config, while unexpected roles or users may indicate malicious intent.

  - **Cross-reference with IAM policies:** Analyze IAM policies assigned to the user/role for the presence of `config:StopConfigurationRecorder` and `config:DeleteDeliveryChannel` permissions. High privilege or overly permissive policies may increase suspicion of malicious activity.

  - **Look for recent changes in AWS Config settings:** Review any previous relevant configurations in AWS Config within the last 30 days. Confirm whether legitimate organizational changes correlate with the time of the detected event.

  - **Examine related AWS service activity:** Review other AWS CloudTrail logs for anomalous service actions surrounding the time of the detected events, such as illicit instance provisioning or key management changes. Indicators include unauthorized changes to S3 bucket policies or CloudTrail settings.

  ### Prioritization

  This alert carries a high severity due to the potential impact on the security posture of the AWS environment. The likelihood of malicious abuse is elevated, especially as disabling AWS Config can hinder monitoring and logging, making it a common target for adversaries aiming to conceal their activities.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false negatives if CloudTrail logging is misconfigured or disabled, leading to missed events. Legitimate activities may trigger this alert, particularly during authorized configuration updates or site maintenance. A related detection to consider includes monitoring for unexpected IAM policy changes or any modifications to CloudTrail configurations to strengthen coverage against potential abuse.

