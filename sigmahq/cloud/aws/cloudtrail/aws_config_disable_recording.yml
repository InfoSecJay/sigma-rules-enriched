note: |
  ### Technical Context
  This detection rule is focused on identifying actions that disable the AWS Config service, specifically the deletion of delivery channels and the stopping of configuration recorders. These actions can indicate an attempt by malicious actors to evade detection and monitoring within an AWS environment. By disabling AWS Config, an attacker can hinder the ability to track changes and activities related to AWS resources, potentially allowing them to conduct further nefarious actions unnoticed.

  The likely attacker objectives include establishing persistence or performing lateral movements within the AWS infrastructure, ultimately aiming to exfiltrate sensitive data or disrupt business operations. The rule pertains to the MITRE ATT&CK framework under the tactic of "Defense Evasion" with a specific focus on technique T1562.008, which deals with disabling security features.

  Primary data sources for this detection include AWS CloudTrail logs, which record all API calls made within the AWS environment. Investigating these logs can reveal unauthorized or suspicious activity indicative of a potential security breach.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Check AWS CloudTrail logs for recent events related to 'DeleteDeliveryChannel' and 'StopConfigurationRecorder' to identify any unauthorized modifications to AWS Config settings.
  - **Analyze IAM Policies:** Investigate IAM role permissions and policies for any changes that could grant unauthorized users the ability to modify or disable AWS Config functionalities.
  - **Correlate with Other Security Tools:** Cross-reference findings with alerts or logs from other AWS services or security tools to identify any patterns or additional signs of compromise.
  - **Assess Impact Level:** Evaluate the potential impact of the detected activity on AWS resource configuration and compliance, determining if sensitive configurations have been altered or disabled.

  ### Prioritization
  The alert is classified as high severity due to the critical role that AWS Config plays in resource monitoring and compliance. Disabling it poses a significant risk, as it can allow attackers to carry out their operations with reduced visibility and oversight.

  ### Blind Spots and Assumptions
  This detection rule relies on the assumption that AWS CloudTrail logging is enabled and properly configured to capture all relevant events. Gaps in detection coverage may exist if the logs are not retained for a sufficient duration or if certain accounts have permission to alter AWS Config settings without adequate oversight. Additionally, false positives may occur from legitimate changes made by authorized personnel, emphasizing the importance of contextual analysis in responding to alerts.

