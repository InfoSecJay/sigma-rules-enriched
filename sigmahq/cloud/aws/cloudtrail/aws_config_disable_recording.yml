note: |
  ### Technical Context

  This Sigma rule detects the disabling of AWS Config services, specifically the deletion of delivery channels or stopping configuration recorders. These actions may indicate an attacker attempting to evade detection measures by preventing changes in the configuration from being recorded, thus obscuring their activities. The primary objectives are likely to maintain persistence or facilitate further attacks without leaving traces.

  Relevant MITRE ATT&CK tactics include "Defense Evasion" (T1562) and the specific technique "Disable or Evade Logging" (T1562.008). Telemetry sources for this detection rely predominantly on AWS CloudTrail logs where events are logged for actions taken on AWS Config. If malicious, this behavior can severely impact security visibility and compliance within the AWS environment. Importantly, this detection does NOT confirm that a breach has occurred but highlights potentially suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Check CloudTrail logs for disabled services:** Search for CloudTrail Event Name "DeleteDeliveryChannel" and "StopConfigurationRecorder" in AWS CloudTrail logs (Event Source: config.amazonaws.com). Note the timestamps and originating AWS IAM users for correlation with any other suspicious activities.

  - **Determine legitimate changes:** Identify if there were any known maintenance windows or changes within the AWS environment where a valid change to AWS Config settings was documented. Cross-reference with change management logs.

  - **Review IAM user activity:** Analyze the identity of the IAM user or role that performed the actions (using CloudTrail fields such as "userIdentity"). Look for unusual access patterns or rights that may point to credential compromise.

  - **Identify related API calls:** Look for additional CloudTrail API calls made before or after the disabling actions, such as "PutDeliveryChannel" or "StartConfigurationRecorder," which may indicate attempts to manipulate configuration monitoring more broadly.

  - **Evaluate asset criticality:** Assess the criticality of the affected AWS accounts and resources to determine the potential impact of losing AWS Config monitoring. Pay special attention if it relates to compliance-sensitive data or critical applications.

  ### Prioritization

  This alert is classified as high severity due to the critical nature of AWS Config in maintaining security visibility for cloud resources. The likelihood of malicious exploitation is significant, especially given that disabling logging features is a common technique used by attackers to cover their tracks. Such actions are not typical for routine operations in an enterprise environment.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the absence of CloudTrail logging for AWS Config changes if logging is not properly configured. Adversaries might use IAM roles with elevated permissions for legitimate actions that may trigger this alert, potentially leading to false positives. It is also essential to consider companion detections like "AWS IAM Policy Changes" to enhance oversight of permission escalations that enable these types of actions.

