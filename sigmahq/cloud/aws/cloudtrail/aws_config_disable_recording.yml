  ---

  ### Technical Context

  This rule detects events related to the disabling of AWS Config services, specifically when a delivery channel is deleted or a configuration recorder is stopped. The likely objective of an attacker would be to disable auditing mechanisms within the AWS environment, thereby preventing detection of malicious activities or changes to resources. This behavior aligns with the MITRE ATT&CK technique of Defense Evasion (T1562.008). The primary telemetry source is AWS CloudTrail, which records activity across the AWS environment, specifically looking for events like `DeleteDeliveryChannel` and `StopConfigurationRecorder`. If malicious, this action could lead to a substantial security impact as it may obscure unauthorized changes or deployments. However, this detection does not confirm malicious intent on its own, as legitimate operations may warrant the disabling of AWS Config.

  ---

  ### Investigation Steps

  - **Review cloud trail logs for relevant events:** Examine AWS CloudTrail logs for `eventSource: config.amazonaws.com` and `eventName: DeleteDeliveryChannel` or `StopConfigurationRecorder` in the specified timeframe. Look for abnormal timings or unusual IAM user activity associated with these actions.

  - **Identify user and role context:** Check the IAM user or role associated with the triggering events. Validate whether the activity aligns with the user’s expected behavior and role responsibilities. Legitimate users typically wouldn't disable configurations without a strong business justification.

  - **Cross-reference with configuration change logs:** Investigate AWS Config history to validate whether there were legitimate prior changes or operational reasons for stopping the configuration recorder. Look for entries that indicate normal lifecycle operations compared to the alert time.

  - **Examine permissions of the triggering entities:** Review IAM policies and permission boundaries for the user or role that disabled the AWS Config service. Ensure that these permissions were strictly necessary and not overly permissive, which could indicate a security oversight.

  - **Conduct a risk assessment of affected resources:** Identify which AWS resources are managed by the AWS Config recorder that was stopped or disabled. Determine the sensitivity and criticality of these resources, considering if any are particularly valuable or vulnerable.

  - **Monitor for subsequent modifications:** Set alerts to detect any resource modifications or deletions following the disabling of AWS Config to track potentially malicious actions carried out obscured from logging.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the significant security impact of disabling critical monitoring services in AWS. The likelihood of malicious abuse is heightened in environments with shared account access, making the exposure of vulnerabilities easily exploitable. This behavior is known to be targeted by adversaries seeking to avoid detection.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the availability of CloudTrail logs for the relevant timeframe; if logging is improperly configured or if logs are deleted, the activity may go unnoticed. Additionally, certain administrative changes or legitimate operational procedures may inadvertently trigger this alert, such as routine maintenance updates. A related detection such as monitoring for `CreateDeliveryChannel` could provide further insights into changes made following the disabling of AWS Config, strengthening overall coverage.

