title: AWS STS GetCallerIdentity Enumeration Via TruffleHog
id: 9b1b8e9b-0a5d-4af1-9d2f-4c4b6e7c2c9d
status: experimental
description: |
  Detects the use of TruffleHog for AWS credential validation by identifying GetCallerIdentity API calls where the userAgent indicates TruffleHog.
  Threat actors leverage TruffleHog to enumerate and validate exposed AWS keys.
  Successful exploitation allows threat actors to confirm the validity of compromised AWS credentials, facilitating further unauthorized access and actions within the AWS environment.
references:
- https://www.rapid7.com/blog/post/tr-crimson-collective-a-new-threat-group-observed-operating-in-the-cloud/
- https://docs.aws.amazon.com/STS/latest/APIReference/API_GetCallerIdentity.html
- https://github.com/trufflesecurity/trufflehog
author: Adan Alvarez @adanalvarez
date: 2025-10-12
tags:
- attack.discovery
- attack.t1087.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'sts.amazonaws.com'
    eventName: 'GetCallerIdentity'
    userAgent|contains: 'TruffleHog'
  condition: selection
falsepositives:
- Legitimate internal security scanning or key validation that intentionally 
  uses TruffleHog. Authorize and filter known scanner roles, IP ranges, or 
  assumed roles as needed.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the `GetCallerIdentity` API call in AWS when the `userAgent` field indicates it originated from TruffleHog. Attackers may leverage TruffleHog to scan for exposed AWS credentials, confirming their validity and thereby escalating their access within the AWS environment. This behavior aligns with the MITRE ATT&CK tactic of **Discovery** and technique **T1087.004: Account Discovery**.

  The primary telemetry source for this detection is AWS CloudTrail logs, specifically capturing events from the `sts.amazonaws.com` event source. If malicious, successful exploitation can lead to unauthorized access and actions within the AWS infrastructure. Importantly, this detection does not confirm that legitimate credentials have been compromised; it only indicates the use of the tool within the environment.

  ### Investigation Steps

  - **Identify CloudTrail logs for GET requests:** Review AWS CloudTrail logs for `eventSource` set to `sts.amazonaws.com` and `eventName` as `GetCallerIdentity` (Event ID: N/A). Check the `userAgent` field for the presence of "TruffleHog."

  - **Verify user context:** Cross-reference the IAM user or role making the API call against expected asset permissions. Legitimate credentials may belong to known applications or services performing security checks.

  - **Examine preceding and following actions:** Investigate surrounding CloudTrail logs for multiple sequential API calls made by the same user/role to identify patterns indicative of enumeration or exploitation attempts.

  - **Assess IP and Role legitimacy:** Identify the source IP and role associated with the detected event. Compare against a whitelist of known internal scanning tools and roles to determine if the activity is authorized or expected.

  - **Look for configuration drift:** Check AWS Config rules or S3 bucket policies for unauthorized changes or misconfigured policies that might indicate exposure of AWS keys, leading to possibly compromised credentials.

  ### Prioritization

  The alert should be considered medium severity due to the potential impact on the affected AWS environment. The use of TruffleHog for credential validation indicates a significant likelihood of malicious intent, particularly if the API calls deviate from typical usage patterns.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of CloudTrail, as not all AWS accounts have comprehensive logging enabled. Legitimate internal security scanning may trigger this alert, particularly if TruffleHog is used for valid purposes. Related detections include monitoring for unauthorized calls to other AWS STS API endpoints, such as `AssumeRole`, which can enhance visibility into potential attacks.

