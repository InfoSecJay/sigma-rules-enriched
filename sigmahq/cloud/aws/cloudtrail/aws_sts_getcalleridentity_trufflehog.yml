title: AWS STS GetCallerIdentity Enumeration Via TruffleHog
id: 9b1b8e9b-0a5d-4af1-9d2f-4c4b6e7c2c9d
status: experimental
description: |
  Detects the use of TruffleHog for AWS credential validation by identifying GetCallerIdentity API calls where the userAgent indicates TruffleHog.
  Threat actors leverage TruffleHog to enumerate and validate exposed AWS keys.
  Successful exploitation allows threat actors to confirm the validity of compromised AWS credentials, facilitating further unauthorized access and actions within the AWS environment.
references:
- https://www.rapid7.com/blog/post/tr-crimson-collective-a-new-threat-group-observed-operating-in-the-cloud/
- https://docs.aws.amazon.com/STS/latest/APIReference/API_GetCallerIdentity.html
- https://github.com/trufflesecurity/trufflehog
author: Adan Alvarez @adanalvarez
date: 2025-10-12
tags:
- attack.discovery
- attack.t1087.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'sts.amazonaws.com'
    eventName: 'GetCallerIdentity'
    userAgent|contains: 'TruffleHog'
  condition: selection
falsepositives:
- Legitimate internal security scanning or key validation that intentionally uses
  TruffleHog. Authorize and filter known scanner roles, IP ranges, or assumed roles
  as needed.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of TruffleHog in conjunction with the AWS Security Token Service (STS) by monitoring for API calls to `GetCallerIdentity` where the user agent specifically indicates TruffleHog usage. TruffleHog is a tool often leveraged by threat actors to detect and verify exposed AWS credentials, enabling them to enumerate the permissions associated with potentially compromised keys. The successful exploitation of this capability allows attackers to gain further unauthorized access within AWS environments, posing significant risks to data integrity and confidentiality.

  The relevant MITRE ATT&CK techniques for this detection include **Account Discovery (T1087.004)**, which covers enumeration actions taken by attackers to discover account information within cloud environments. Notably, by validating AWS keys, attackers may expose sensitive resources or escalate privileges, complicating incident response efforts.

  Primary data sources for this detection rule comprise **AWS CloudTrail logs**, which capture detailed records of API calls made within AWS, including information on the source of the requests, the user agents, and the actions performed.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Analyze AWS CloudTrail logs for `GetCallerIdentity` API calls made with the user agent containing 'TruffleHog'. Pay attention to the timestamps and source IPs to establish context.
  - **Identify Source IP and User**: Cross-reference the source IP address in the cloud logs with internal asset records to determine if the request originated from a legitimate user or system. Investigate any unfamiliar IPs.
  - **Check for Credential Exposure**: Review recent changes to IAM policies and permissions, and assess whether there have been any recent deployments or changes that could compromise credentials. Validate the source of any exposed AWS keys found recently.
  - **Audit for Additional Activities**: Investigate further API calls associated with the same user/entity to identify any additional suspicious behaviors, such as unusually high access levels or access to sensitive resources.

  ### Prioritization
  This alert carries a medium severity due to the potential for significant impact from unauthorized access to cloud resources. Given the ease with which compromised credentials can lead to further exploitation, it is vital that such activities are investigated promptly.

  ### Blind Spots and Assumptions
  The detection coverage may lack depth if CloudTrail logging is not comprehensively configured or if there are gaps in the logging duration that prevent access to historical data. Additionally, the detection assumes that the user agent string accurately reflects TruffleHog usage, which may not always be the case if actors obfuscate their tools. To ensure this alert functions effectively, organizations need to enable full AWS CloudTrail logging for pertinent services and ensure that all relevant permissions are assigned to monitoring roles for comprehensive visibility.

