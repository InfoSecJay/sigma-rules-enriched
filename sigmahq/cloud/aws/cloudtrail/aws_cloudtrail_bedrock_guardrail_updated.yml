note: |
  ### Technical Context

  This Sigma rule detects modifications to guardrails within Amazon Bedrock, specifically through the `UpdateGuardrail` API call. Such activities may indicate an adversary attempting to alleviate regulatory controls, thereby influencing AI model behaviors to produce unsafe or unauthorized outputs. The relevant MITRE ATT&CK technique is Defense Evasion (T1685).

  The primary telemetry source is AWS CloudTrail logs, specifically tracking events related to Amazon Bedrock. If these guardrails are maliciously altered, they could lead to exploitable vulnerabilities within applications relying on AI models. However, this detection alone does not confirm malicious intent, as legitimate updates by authorized personnel may trigger the same alert.

  ### Investigation Steps

  - **Review relevant CloudTrail logs**: Search for `EventName` = `UpdateGuardrail` and `EventSource` = `bedrock.amazonaws.com`. Identify the `userIdentity` field to check if actions were performed by authorized IAM roles or service accounts.

  - **Validate the source of the request**: Cross-reference `sourceIPAddress` from logs with known IP addresses of your organization's AWS accounts. Legitimate updates will come from internal or trusted sources.

  - **Assess frequency and timing of updates**: Check for unusual patterns in guardrail updates by analyzing timestamps, focusing on any updates made outside of regular operational hours, which could indicate malicious behavior.

  - **Identify changes in guardrail parameters**: Look into the `updatedGuardrail` content, specifically focusing on parameters that control model safety. Any significant relaxations of restrictions or additions of new functionality could indicate an attempt to disable security mechanisms.

  - **Correlate with user activity logs**: Review `CloudTrail` logs for any preceding or subsequent IAM actions by the same user or role (e.g., `PassRole`, `AssumeRole`). Malicious activity may involve privilege escalation or accessing sensitive resources.

  - **Monitor for abnormal model behavior**: After any guardrail changes, observe outputs from AI models for nonsensical or unsafe responses. This may include unexpected data, requests for unauthorized access, or inconsistent information presentation.

  ### Prioritization

  This alert is categorized as medium severity due to the potential impact on AI model integrity in critical business processes. While incidents of unauthorized guardrail updates are less common, the potential for misuse makes it necessary to address promptly, especially in sectors where compliance is vital.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations; ensure CloudTrail is meticulously tracking all relevant Bedrock events. Legitimate administrative actions might trigger this alert, including necessary updates by authorized personnel. A companion detection to consider is monitoring IAM role usage for actions related to `PassRole`, which can indicate privilege escalation efforts used in tandem with guardrail modifications.

