note: |
  ### Technical Context

  This rule detects the deletion of an Amazon Bedrock guardrail, which serves as a safety control mechanism to restrict model outputs and ensure compliance with safety standards. An attacker may aim to remove these guardrails to allow for unrestricted or harmful model behavior, enhancing their ability to manipulate AI outputs for malicious purposes. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0041), specifically the technique of Indirect Defenses (T1685).

  The primary telemetry source is AWS CloudTrail, which tracks AWS API calls, specifically the `DeleteGuardrail` event. The security impact of deleting a guardrail is significant as it can lead to unauthorized responses from AI models that could be leveraged for exploitation or disinformation. This detection does NOT confirm that the deletion was malicious—it could be legitimate activity performed by authorized personnel.

  ### Investigation Steps

  - **Identify CloudTrail Logs for Deletion Events**: Search CloudTrail logs for the `DeleteGuardrail` event (Event Name) specifically under `bedrock.amazonaws.com` (Event Source). This confirms whether the deletion occurred and provides context for the action.

  - **Review User Identity and Permissions**: Investigate the IAM user or role that executed the deletion by correlating against `userIdentity` field in the CloudTrail logs. Evaluate whether the user has appropriate permissions and whether their activity aligns with expected behavior.

  - **Check for Recent Guardrail Modifications**: Look for any prior `PutGuardrail` or similar modification events within the last 24 hours before the deletion to determine if there were malicious adjustments prior to this action, which might indicate a premeditated attack.

  - **Assess Asset Criticality**: Determine the criticality of the AWS resources linked to the deleted guardrail. Highly sensitive AI models should be prioritized for further scrutiny as their misuse can lead to greater security risks.

  - **Validate with System Owners**: Reach out to the team responsible for AI deployments to confirm if any legitimate guardrail deletions were planned or necessary, comparing against documented operational activities.

  - **Investigate for Other Related Indicators**: Look for additional suspicious activities in CloudTrail, such as unusual API calls within the same timeframe (e.g., `CreateModel`, `UpdateModel`) that may suggest nefarious intent associated with the guardrail deletion.

  ### Prioritization

  This alert should be treated with medium severity considering the potential impact of AI model misuse and the likelihood of malicious activity in environments utilizing AI capabilities. Deletion of guardrails can facilitate exploitation in environments where model outputs must be closely monitored and controlled, making this behavior a common point of concern.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques if attackers delete guardrails and quickly revert other changes to cover their tracks. Reliable detection of this event requires proper AWS CloudTrail logging configured for Bedrock, and any legitimate personnel action may inadvertently trigger the alert, such as maintenance by authorized users. A related detection to consider is monitoring for unauthorized API activity around AWS Bedrock, which may strengthen overall coverage against such threats.

