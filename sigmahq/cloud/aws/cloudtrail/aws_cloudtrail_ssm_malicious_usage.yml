title: Potential Malicious Usage of CloudTrail System Manager
id: 38e7f511-3f74-41d4-836e-f57dfa18eead
status: test
description: |
  Detect when System Manager successfully executes commands against an instance.
references:
- https://github.com/elastic/detection-rules/blob/v8.6.0/rules/integrations/aws/initial_access_via_system_manager.toml
author: jamesc-grafana
date: 2024-07-11
modified: 2025-12-08
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.t1566
- attack.t1566.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_event:
    eventName: 'SendCommand'
    eventSource: 'ssm.amazonaws.com'
  selection_status_success:
    errorCode: 'Success'
  selection_status_null:
    errorCode:
  condition: selection_event and 1 of selection_status_*
falsepositives:
- There are legitimate uses of SSM to send commands to EC2 instances
- Legitimate users may have to use SSM to perform actions against machines in the
  Cloud to update or maintain them
level: high
note: |
  ### Technical Context
  This detection rule identifies potential malicious usage of AWS Systems Manager (SSM) by monitoring for successful command executions on EC2 instances. When an attacker gains access to AWS credentials, they can utilize SSM to execute arbitrary commands on instances, potentially leading to unauthorized changes, data exfiltration, or lateral movement within the cloud environment. The objective of such an attack could be to compromise sensitive data or to install additional malicious tools on affected systems.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access** (TA0001): Attackers might gain access using compromised credentials.
  - **Privilege Escalation** (TA0004): By sending commands to EC2 instances, attackers could escalate their privileges and further exploit the environment.
  - **Phishing** (T1566) and **Phishing - Credential Harvesting** (T1566.002): These encompass common methods attackers use to gather AWS credentials for unauthorized access.

  Primary data sources for investigation include AWS CloudTrail logs, which record API calls made by users and services, providing visibility into command executions and user activity in the AWS environment.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Examine CloudTrail logs for events with eventName `SendCommand` and eventSource `ssm.amazonaws.com` to identify any successful commands executed on EC2 instances.
  - **Identify User Context**: Analyze the user identity or IAM role associated with these commands to determine whether it matches known legitimate usage, especially focusing on any anomalies in user behavior.
  - **Audit EC2 Instance Activity**: Check the logs of the affected EC2 instances for unauthorized command executions or changes made as a result of the SSM commands, including looking for unusual processes or modifications.
  - **Compare Against Known Baselines**: Compare discovered command executions against baseline activities for your environment to identify any deviations from typical usage of Systems Manager.

  ### Prioritization
  The alert has a high severity level due to the potential impact of unauthorized command execution within the cloud environment, which can lead to critical data loss, service disruption, or regulatory non-compliance.

  ### Blind Spots and Assumptions
  This detection rule may not capture all legitimate usage scenarios, as there are valid instances where SSM commands are executed for maintenance and updates. It assumes that any `SendCommand` event that returns a success status or null error code is potentially malicious, which may not always be true. Additionally, comprehensive CloudTrail logging and monitoring must be enabled, and IAM policies should be effectively configured to ensure proper coverage for this alert to function accurately.

