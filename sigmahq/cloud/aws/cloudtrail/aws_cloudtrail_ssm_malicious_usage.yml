title: Potential Malicious Usage of CloudTrail System Manager
id: 38e7f511-3f74-41d4-836e-f57dfa18eead
status: test
description: |
  Detect when System Manager successfully executes commands against an instance.
references:
- https://github.com/elastic/detection-rules/blob/v8.6.0/rules/integrations/aws/initial_access_via_system_manager.toml
author: jamesc-grafana
date: 2024-07-11
modified: 2025-12-08
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.t1566
- attack.t1566.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_event:
    eventName: 'SendCommand'
    eventSource: 'ssm.amazonaws.com'
  selection_status_success:
    errorCode: 'Success'
  selection_status_null:
    errorCode:
  condition: selection_event and 1 of selection_status_*
falsepositives:
- There are legitimate uses of SSM to send commands to EC2 instances
- Legitimate users may have to use SSM to perform actions against machines in the
  Cloud to update or maintain them
level: high
note: |
  ---

  ### Technical Context

  This rule detects when the AWS System Manager (SSM) successfully executes commands against an EC2 instance, indicated by the `SendCommand` event with a success status. The likely attacker objective is to gain initial access or escalate privileges on targeted EC2 instances remotely, potentially leading to further compromise within the cloud environment. The relevant MITRE ATT&CK tactics include Initial Access (TA0001) and Privilege Escalation (TA0004), with the associated techniques being T1566 (Phishing) and T1566.002 (Phishing via Service).

  The primary telemetries are AWS CloudTrail logs capturing `SendCommand` events from the SSM service. If this activity is malicious, the impact could include unauthorized access, data exfiltration, and disruption of services. This detection does NOT confirm malicious intent by itself, as legitimate users may perform these actions for system maintenance and updates.

  ---

  ### Investigation Steps

  - **Verify event context:** Review AWS CloudTrail logs for Event Name `SendCommand` and confirm Source Event as `ssm.amazonaws.com`. Check for unusual patterns such as commands run outside business hours or from untrusted IAM roles.

  - **Identify command execution:** Examine the `command` field in the CloudTrail logs associated with the event to determine if the executed command is a standard maintenance command (e.g., `Update-SSMAgent`) or suspicious (e.g., `wget` or `curl` commands).

  - **Correlate with IAM roles:** Check the IAM role and the identity of the user or service executing the command. Legitimate users typically have defined roles tied to operational tasks. Unexpected roles or new principals may suggest compromised accounts.

  - **Examine network activity:** Look for associated IP addresses in VPC Flow Logs related to the command execution time to identify unusual outbound connections or data transfer events indicating potential data exfiltration.

  - **Review documentation:** If available, cross-reference the executed command with the organization’s Change Management records to determine if there was legitimate authorization for such actions.

  - **Check additional resources:** Investigate other companion detections related to privilege escalation or lateral movement, such as AWS CloudTrail logs for `CreateUser`, `AttachUserPolicy`, or other suspicious API calls immediately following the `SendCommand`.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact of an adversary gaining control over EC2 instances, which can lead to further compromise or data leakage. Given that SSM is a legitimate administration tool, the likelihood of its abuse in attacks is significant, and this behavior is commonly weaponized in cloud environments.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations if AWS CloudTrail logging is not properly configured or if logs are not retained adequately. Normal administrative tasks using SSM by trusted users may trigger this alert, creating false positives. A related detection to enhance coverage could involve monitoring for any API calls to IAM roles (`CreateRole`, `AttachRolePolicy`) shortly after the SSM commands, as this may indicate an attempted privilege escalation.

