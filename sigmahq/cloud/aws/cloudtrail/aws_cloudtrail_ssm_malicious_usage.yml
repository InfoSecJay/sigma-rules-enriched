title: Potential Malicious Usage of CloudTrail System Manager
id: 38e7f511-3f74-41d4-836e-f57dfa18eead
status: test
description: |
  Detect when System Manager successfully executes commands against an instance.
references:
- https://github.com/elastic/detection-rules/blob/v8.6.0/rules/integrations/aws/initial_access_via_system_manager.toml
author: jamesc-grafana
date: 2024-07-11
modified: 2025-12-08
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.t1566
- attack.t1566.002
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_event:
    eventName: 'SendCommand'
    eventSource: 'ssm.amazonaws.com'
  selection_status_success:
    errorCode: 'Success'
  selection_status_null:
    errorCode:
  condition: selection_event and 1 of selection_status_*
falsepositives:
- There are legitimate uses of SSM to send commands to EC2 instances
- Legitimate users may have to use SSM to perform actions against machines in 
  the Cloud to update or maintain them
level: high
note: |
  ### Technical Context

  This Sigma rule detects successful command execution via AWS Systems Manager (SSM) against EC2 instances. An attacker could leverage this feature to obtain unauthorized access or manipulate cloud resources remotely, possibly aiming for privilege escalation or lateral movement. The relevant MITRE ATT&CK tactics include Initial Access (TA0001) and Privilege Escalation (TA0004) with the techniques being Exponential Growth (T1566) and Exponential Growth via API interaction (T1566.002).

  The primary telemetry source is AWS CloudTrail, specifically logs recording the event names and error codes related to SSM command executions. If this behavior is malicious, it could lead to unauthorized operations on critical instances, potentially compromising sensitive data or operational integrity. Importantly, this detection does NOT prove malicious intent on its own; legitimate users may perform similar actions under approved operational circumstances.

  ---

  ### Investigation Steps

  - **Check CloudTrail for event details**: Review CloudTrail logs for `eventName`: `SendCommand` from `ssm.amazonaws.com` (Event ID not explicitly numbered but available in CloudTrail logs). Look for unusual or new EC2 instance targets not typically managed by legitimate administrators.

  - **Identify incident time and context**: Cross-reference the timestamp of the command execution in CloudTrail with other logs (e.g., VPC flow logs, instance log files) for concurrent activities. Suspicious activity patterns may indicate a compromise.

  - **Examine command parameters**: Analyze the parameters within the `SendCommand` payload, focusing on the `DocumentName` and `Parameter` fields (e.g., command scripts or deployment actions). Compare against normal operational scripts; any unusual or unauthorized commands should be flagged.

  - **Review user identity and permissions**: Inspect the `userIdentity` field in CloudTrail logs. Check for any unexpected IAM user or role engagements triggering the command. Ensure the users have proper permissions that align with their roles.

  - **Correlate with legitimate SSM usage**: Identify normal patterns of SSM usage within your organization, such as maintenance tasks or software updates processed by known administrators. Legitimacy can be established by cross-referencing scheduled maintenance windows or specific administrative work orders.

  - **Trace responses to the command**: If possible, validate the status of executed commands via the SSM Command Status API. Check if output indicates unauthorized changes or installations on the affected instances, contrasting with expected outcome logs.

  ---

  ### Prioritization

  This alert carries a high severity level due to the potential for significant operational impact if malicious activity is confirmed, particularly in environments where critical applications run on affected instances. The functionality of Systems Manager is essential, and the likelihood of abuse in this context is elevated given the rise of cloud-targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be hindered by legitimate administrative actions that can trigger the alert, such as routine system updates or configurations by valid users. Reliance on CloudTrail logs means proper logging must be configured to capture SSM commands effectively. Additionally, additional related detections, such as unauthorized API calls or changes to IAM roles, can enhance overall security posture and event correlation efforts.

