note: |
  ### Technical Context
  This detection rule identifies the creation or deletion of Amazon Elastic Kubernetes Service (EKS) clusters by monitoring actions in AWS CloudTrail. The rule aims to highlight potentially unauthorized actions that might indicate malicious intent, such as the compromise of AWS credentials or the implementation of unauthorized workloads. Attackers might create or delete EKS clusters to establish persistence or disrupt services, impacting the integrity and availability of applications running on Kubernetes.

  Relevant MITRE ATT&CK tactics include **Impact (TA0040)** and techniques such as **Data Manipulation (T1485)**. An attacker with access to cloud resources could exploit administrative privileges to manipulate the cloud infrastructure, leading to data loss or service outages. The primary data source for this detection is AWS CloudTrail logs, which provide detailed records of API calls made in an AWS environment, allowing for insight into user activity around EKS management.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Examine the CloudTrail logs for `CreateCluster` and `DeleteCluster` events in the time frame of the alert to identify the corresponding user identity and source IP.
  - **Verify User Context:** Investigate the user or role that executed the cluster creation or deletion—determine if it's a known administrator or an unfamiliar account with recent activity.
  - **Audit IAM Policies:** Check the IAM (Identity Access Management) policies associated with the user or role to ensure they have appropriate permissions. Look for signs of privilege escalation or unauthorized policy changes.
  - **Analyze Cluster Activity:** If clusters were created, analyze their activity and configurations for any malicious workloads or unexpected network patterns that could indicate exploitation.

  ### Prioritization
  The alert is considered low severity due to the potential for both legitimate administrative activities and unauthorized actions; however, the presence of unusual clusters or unfamiliar user accounts should be rigorously investigated to mitigate potential security risks.

  ### Blind Spots and Assumptions
  This detection may not capture actions performed via the AWS Management Console or through third-party tools lacking proper logging. Additionally, it assumes that users with permission to manage EKS clusters are appropriately vetted. Required logging includes AWS CloudTrail, which must be enabled and configured to capture all relevant API activity for this detection to function effectively.

