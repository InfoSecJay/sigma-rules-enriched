  ---

  ### Technical Context

  This rule detects the creation or deletion of Amazon EKS (Elastic Kubernetes Service) clusters via CloudTrail logs. These actions may indicate an adversary attempting to establish or dismantle infrastructure as part of a broader attack strategy, such as exfiltration of data or denial of service. The relevant MITRE ATT&CK tactics and techniques are “Impact” (T1485).

  Primary telemetry sources include AWS CloudTrail, particularly logs relating to the EKS service. The security impact of an unauthorized EKS cluster creation can be significant, potentially serving as a staging ground for further malicious activities or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions can trigger these alerts.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for EKS events:** Check for CloudTrail Event Source `eks.amazonaws.com` and Event Name `CreateCluster` or `DeleteCluster`. Extract details including the IAM user identity and timestamp to verify if actions align with expected usage patterns.

  - **Identify user activity context:** Cross-reference the user identity with AWS IAM user permissions. Look for potential roles that may not regularly perform cluster management. Benign activity typically includes expected user accounts for cluster administration.

  - **Evaluate the source of the API calls:** Examine the user agent and originating IP address linked to the event. Malicious indicators include access from unknown or suspicious IP ranges compared to historical data.

  - **Investigate unusual patterns of cluster creation or deletion:** Consider whether there has been an abrupt change in the frequency or timing of cluster operations. Legitimate usage often reflects patterns aligned with development cycles or operational demands.

  - **Validate against security configurations:** Ensure appropriate guardrails and permissions are configured within AWS. Check AWS Config to identify if there are any policy violations related to unexpected cluster changes.

  - **Explore related CloudTrail logs:** Look for other AWS services' logs that may indicate correlated activity, such as `RunInstances` or `CreateSecurityGroup`, which might further corroborate attacker behavior.

  ---

  ### Prioritization

  The severity of this alert is low, as it may indicate routine operations by authorized users, but it warrants investigation, especially if done by unfamiliar identities. The likelihood of malicious abuse can increase if conducted by unrecognized users or during odd hours. This behavior can be weaponized if attackers create clusters to host malware or conduct unauthorized data access.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include CloudTrail log delays and potential lack of configurations to monitor all relevant user roles. EKS cluster deletions could occur legitimately during maintenance or scaling activities. A companion detection to enhance coverage could involve monitoring AWS Lambda for functions that interact with EKS APIs, providing insights into automated processes that may not be immediately visible.

