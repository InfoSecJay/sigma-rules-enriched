title: AWS Console GetSigninToken Potential Abuse
id: f8103686-e3e8-46f3-be72-65f7fcb4aa53
status: test
description: |
  Detects potentially suspicious events involving "GetSigninToken".
  An adversary using the "aws_consoler" tool can leverage this console API to create temporary federated credential that help obfuscate which AWS credential is compromised (the original access key) and enables the adversary to pivot from the AWS CLI to console sessions without the need for MFA using the new access key issued in this request.
references:
- https://github.com/NetSPI/aws_consoler
- https://www.crowdstrike.com/blog/analysis-of-intrusion-campaign-targeting-telecom-and-bpo-companies/
author: Chester Le Bron (@123Le_Bron)
date: 2024-02-26
tags:
- attack.lateral-movement
- attack.t1021.007
- attack.t1550.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'signin.amazonaws.com'
    eventName: 'GetSigninToken'
  filter_main_console_ua:
    userAgent|contains: 'Jersey/${project.version}'
  condition: selection and not 1 of filter_main_*
falsepositives:
- GetSigninToken events will occur when using AWS SSO portal to login and will 
  generate false positives if you do not filter for the expected user agent(s), 
  see filter. Non-SSO configured roles would be abnormal and should be 
  investigated.
level: medium
note: |
  ### Technical Context

  This rule detects suspicious use of the AWS "GetSigninToken" API, which can enable an adversary to create temporary federated credentials that obfuscate the original access key. The likely objective of an attacker using this method is to pivot from AWS CLI operations to console access, potentially bypassing MFA and further compromising the AWS environment. This activity aligns with the MITRE ATT&CK tactic of Lateral Movement (TA0008) and the technique for External Remote Services (T1021.007) and Access Token Manipulation (T1550.001). The primary telemetry source is AWS CloudTrail, specifically logs detailing events from the `signin.amazonaws.com` endpoint. If this behavior is malicious, it could lead to unauthorized access to sensitive AWS resources. However, it is important to note that this detection does not confirm that a compromise has necessarily occurred; legitimate SSO configurations may also trigger similar alerts.

  ### Investigation Steps

  - **Check CloudTrail logs**: Review AWS CloudTrail logs for EventName "GetSigninToken" with eventSource "signin.amazonaws.com". Look for userAgent fields that do NOT match expected patterns (e.g., "aws_console" or "AWS_SSO") as these may indicate suspicious usage.

  - **Identify unusual user accounts**: Evaluate the IAM user or role associated with the event. If the account is not typically used for console logins or is historically inactive, it could indicate a potential compromise.

  - **Verify legitimate SSO usage**: Confirm if the occurrence of the "GetSigninToken" event aligns with known SSO logins in your environment. Approved SSO login events should correlate with expected user agent strings.

  - **Analyze access tokens issued**: If available, review any created temporary access tokens linked to the event. Check their expiration times and the permissions they grant, as unusually permissive tokens could signify misuse.

  - **Cross-reference multi-factor authentication (MFA) status**: Investigate whether the affected account requires MFA and whether any recent changes were made to the MFA settings that could have allowed this action without proper verification.

  ### Prioritization

  The alert is medium severity due to its potential to enable unauthorized AWS console access, particularly in high-impact environments with sensitive data. The likelihood of malicious abuse is moderate, as adversaries often employ this technique to facilitate lateral movement within cloud environments. This API call is not commonly weaponized in isolation but may form part of a broader sequence of exploitation actions.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using approved user agents or while operating through SSO configurations, leading to false negatives. Reliable detection requires comprehensive CloudTrail logging and correct configuration to capture all relevant events. Legitimate activities, such as users accessing the AWS console through approved SSO mechanisms, can trigger this alert, necessitating careful contextual analysis. A companion detection might include monitoring for AWS IAM changes or other API calls related to Access Token Manipulation techniques to enhance the security posture against potential lateral movement.

