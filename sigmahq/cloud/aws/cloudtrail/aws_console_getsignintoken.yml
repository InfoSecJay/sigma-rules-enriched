title: AWS Console GetSigninToken Potential Abuse
id: f8103686-e3e8-46f3-be72-65f7fcb4aa53
status: test
description: |
  Detects potentially suspicious events involving "GetSigninToken".
  An adversary using the "aws_consoler" tool can leverage this console API to create temporary federated credential that help obfuscate which AWS credential is compromised (the original access key) and enables the adversary to pivot from the AWS CLI to console sessions without the need for MFA using the new access key issued in this request.
references:
- https://github.com/NetSPI/aws_consoler
- https://www.crowdstrike.com/blog/analysis-of-intrusion-campaign-targeting-telecom-and-bpo-companies/
author: Chester Le Bron (@123Le_Bron)
date: 2024-02-26
tags:
- attack.lateral-movement
- attack.defense-evasion
- attack.t1021.007
- attack.t1550.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'signin.amazonaws.com'
    eventName: 'GetSigninToken'
  filter_main_console_ua:
    userAgent|contains: 'Jersey/${project.version}'
  condition: selection and not 1 of filter_main_*
falsepositives:
- GetSigninToken events will occur when using AWS SSO portal to login and will 
  generate false positives if you do not filter for the expected user agent(s), 
  see filter. Non-SSO configured roles would be abnormal and should be 
  investigated.
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `GetSigninToken` API call in AWS, which can indicate potential misuse of AWS credentials. Attackers may leverage this functionality to obtain temporary federated credentials that obfuscate which original AWS access key has been compromised, allowing them to transition from CLI operations to AWS Console access without needing Multi-Factor Authentication (MFA). This behavior falls under the MITRE ATT&CK tactics of Lateral Movement (T1021.007) and Defense Evasion (T1550.001).

  The primary telemetry source for this detection is AWS CloudTrail logs, specifically focused on events where `eventSource` is `signin.amazonaws.com` and the `eventName` is `GetSigninToken`. If this behavior is malicious, it could lead to unauthorized access to sensitive AWS resources. This detection does NOT confirm that the activity is malicious on its own, as legitimate use cases exist, such as access through properly configured AWS SSO portals.

  ### Investigation Steps

  - **Review CloudTrail logs for GetSigninToken events:** Filter by `eventSource` = `signin.amazonaws.com` and `eventName` = `GetSigninToken` (CloudTrail logs). Note user associated with the event and match against legitimate access patterns.

  - **Check the user agent string:** Ensure the user agent does NOT contain `Jersey/${project.version}` in the logs. If the user agent is from typical AWS SSO login behaviors, the activity may be benign.

  - **Identify unusual IAM role usage:** Look for `GetSigninToken` invocations from non-SSO configured IAM roles or usernames that are not commonly associated with AWS Console access. This could indicate a compromise (CloudTrail logs, involved user fields).

  - **Verify temporal patterns:** Check how frequently this API call has been invoked over time. A sudden spike in usage could imply automated abuse or exploitation (CloudTrail logs, timestamp fields).

  - **Assess asset criticality:** Investigate `GetSigninToken` usage from high-privilege accounts or sensitive environments (e.g., production accounts). Such behavior should always be validated.

  ### Prioritization

  The alert has medium severity due to its potential impact on AWS environments, where unauthorized console access could lead to data exposure or system misconfigurations. The likelihood of malicious abuse is notable, especially when considering methods utilized by attackers to bypass security controls, though not every instance is malicious or harmful.

  ### Blind Spots and Assumptions

  This rule may miss instances where attackers use alternative methods for session management or employ legitimate user agents to conceal their actions. Accurate detection relies on proper logging configurations for AWS CloudTrail, including tracking all sign-in events. Additionally, legitimate activities like accessing AWS Console via SSO may trigger this rule, making contextual understanding essential. Companion detections, such as monitoring for unusual IAM role change events, can strengthen overall assessment and response capabilities.

