note: |
  ### Technical Context
  This rule detects failed AWS console login attempts, specifically identifying instances wherein authentication has failed. These events are critical for alerting security teams to possible brute-force attacks or unauthorized access attempts to AWS accounts. Recognizing these patterns can help mitigate risks associated with credential theft and unauthorized account compromise, which could lead to severe data breaches or cloud resource exploitation.

  The potential threat scenario involves attackers attempting to gain access to AWS accounts by systematically trying various username and password combinations. The main objectives of these attackers are typically to gain control over cloud resources, exfiltrate sensitive data, or deploy malicious infrastructure. Detecting failed login attempts gives the security operations center (SOC) an early warning of such intrusion attempts.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic:** Credential Access (ID: TA0006)
  - **Technique:** Brute Force (ID: T1110)

  The primary data sources for this detection are AWS CloudTrail logs, which track events related to account activity and API calls within the AWS environment.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Examine AWS CloudTrail logs focusing on the `ConsoleLogin` events that have the `errorMessage` indicating "Failed authentication." This will help identify the nature and volume of failed login attempts.
  - **Analyze Source IP Addresses:** Assess the source IP addresses associated with the failed logins. This may reveal if the attempts are coming from unusual or blacklisted locations potentially linked to known malicious actors.
  - **Identify User Accounts Targeted:** Determine which user accounts are being targeted by these failed attempts. Anomalies such as repeated attacks on specific accounts should be investigated further for correlation with known users or roles.
  - **Check for Brute Force Patterns:** Look for patterns indicative of brute force attacks, such as multiple failed attempts in a short timeframe from the same IP address. This could suggest a systematic effort to guess credentials.

  ### Prioritization
  The severity of this alert is medium because while failed login attempts can stem from legitimate users incorrectly entering credentials, a high volume of these attempts may indicate an ongoing attack effort. Given the impact of potential unauthorized access to AWS resources, quick investigation and remediation are imperative.

  ### Blind Spots and Assumptions
  This detection relies on the availability of AWS CloudTrail logs, thus any gaps in log retention or configurations may lead to missed detection of events. The assumption behind the detection logic is that significant numbers of failed logins indicate potential malicious behavior; however, this does not account for scenarios such as legitimate users mistakenly entering credentials. Additional logging configurations surrounding MFA attempts or unusual activity within accounts may be necessary to enhance detection capabilities.

