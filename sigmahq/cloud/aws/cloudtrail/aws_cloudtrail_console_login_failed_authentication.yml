note: |
  ---

  ### Technical Context

  This rule detects failed AWS Console login attempts specifically focusing on authentication failures. Such behavior may indicate an adversary attempting to gain unauthorized access through various means, including brute-force attacks on user credentials. This aligns with the MITRE ATT&CK tactic of Credential Access, particularly technique T1110 (Brute Force).

  The primary telemetry source is AWS CloudTrail logs, specifically looking for events where `eventName` is `ConsoleLogin` and `errorMessage` indicates 'Failed authentication'. If the alert is valid, it may signify an ongoing or attempted breach that could compromise sensitive cloud resources. Importantly, this detection does NOT confirm that an account has been successfully compromised, as it only registers failed login attempts.

  ---

  ### Investigation Steps

  - **Examine CloudTrail logs for `ConsoleLogin` events:** Review AWS CloudTrail logs for events where `eventName` is `ConsoleLogin` and `errorMessage` contains 'Failed authentication'. Look for repeated login attempts from the same source IP address within a short timeframe as a potential indicator of brute-force attempts.

  - **Identify the source IP address:** Check the `sourceIPAddress` field in the CloudTrail event to determine the origin of the failed logins. Verify against known ranges for your organization to identify potential external threats.

  - **Investigate user account activity:** Use AWS Identity and Access Management (IAM) to review the user accounts associated with the failed login attempts. Ensure that no accounts have been compromised or show unusual behavior, especially high-privilege users like root or IAM admin.

  - **Check for recent password changes:** Investigate if the accounts involved in the failed attempts have undergone recent password changes. In legitimate activity, authorized users may log in with new credentials after updates.

  - **Look for patterns of legitimate activity:** Confirm that there are no significant legitimate user activities overlapping the failed attempts, which could indicate scheduled maintenance or systems integration, thereby ruling out false positives.

  ---

  ### Prioritization

  This alert should be considered medium severity. It may indicate malicious behavior attempting to gain access to critical AWS accounts. The likelihood of such authentication failures being related to a brute-force attack is higher given the exploitation of AWS services in recent adversarial campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to log retention policies if CloudTrail logs are not kept for an adequate duration, potentially allowing attackers to erase evidence. The alert might also be triggered by legitimate user error or misconfigured applications attempting to authenticate repeatedly. Companion detections, such as monitoring for successful `ConsoleLogin` events following a series of failed attempts, can enhance context and coverage on potential compromises.

