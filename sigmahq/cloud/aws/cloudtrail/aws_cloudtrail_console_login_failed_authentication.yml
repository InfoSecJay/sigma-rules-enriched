note: |
  ### Technical Context

  This rule detects failed authentication attempts to the AWS Management Console, specifically focusing on events where the `ConsoleLogin` action receives an error message indicating 'Failed authentication'. The likely attacker objective is to compromise AWS credentials, which could lead to unauthorized access to resources. This behavior fits into the MITRE ATT&CK framework under the tactic of Credential Access (TA0006) and the technique known as Brute Force (T1110.001). Primary telemetry sources include AWS CloudTrail logs, which capture and log API calls made in the AWS environment.

  If successful, this attack could allow the adversary to gain control over critical cloud resources, leading to data breaches or service interruptions. It is important to note that this detection does NOT confirm successful login attempts or confirm malicious intent on its own; it merely highlights failed authentication attempts that warrant further investigation.

  ### Investigation Steps

  - **Review CloudTrail logs for the event:** Examine CloudTrail logs for `eventName: ConsoleLogin` with `errorMessage: Failed authentication` (Event Type: Management Console) using AWS CLI or AWS Management Console. Identify the time and IP address associated with the failures.

  - **Analyze IP address source:** Investigate the IP addresses generating multiple failed login attempts. Cross-reference with threat intelligence sources to determine if the IPs are known malicious addresses. Look for signs of geolocation anomalies or access from unexpected regions.

  - **Assess legitimate user behavior:** Determine if the authenticated user associated with the fail attempts has a history of legitimate activity or is attempting to log in during off-hours or from unusual locations. Look for the `aws:userid` field in the CloudTrail log to correlate with user access patterns.

  - **Identify repeated attempts:** Focus on the frequency of failed attempts. If there are more than 5 failed login attempts from the same IP within a short timeframe (e.g., 1 hour), this may indicate brute force attacks. Calculate using timestamps in `eventTime`.

  - **Check for additional related events:** Look for related events in CloudTrail, such as successful logins following a series of fails or unusual activities (e.g., creating IAM roles or modifying security configurations). This could suggest an attempted account takeover.

  ### Prioritization

  This alert has medium severity due to the potential exposure of AWS Management Console access, impacting cloud security posture. The likelihood of malicious abuse is significant, particularly for root accounts or accounts with high privileges. While failed logins can occur due to benign user error, repeated failures may indicate a systematic attack, making it a priority for investigation.

  ### Blind Spots and Assumptions

  There are limitations to the detection capabilities, as it may not capture all types of failed authentication events (e.g., API calls failing due to incorrect parameters). Evasion techniques such as credential stuffing could exploit legitimate user accounts with minimal failures. The AWS environment must have CloudTrail logging enabled and properly configured for effective detection. Legitimate activities, such as users incorrectly entering credentials, may trigger this alert. A related detection to strengthen coverage would be monitoring for successful logins immediately following multiple failed attempts.

