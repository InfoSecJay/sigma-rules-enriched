falsepositives:
- A S3 configuration change may be done by a system or network administrator. Verify
  whether the user identity, user agent, and/or hostname should be making changes
  in your environment. S3 configuration change from unfamiliar users or hosts should
  be investigated. If known behavior is causing false positives, it can be exempted
  from the rule.
level: low
note: |
  ### Technical Context
  This detection rule identifies tampering with Amazon S3 data management configurations, specifically through changes to bucket logging, website configuration, encryption, lifecycle policies, and replication settings. Attackers may aim to manipulate these settings to obscure activities, alter data retention policies, trigger unauthorized data replication, or restore objects to exploit sensitive information stored in S3. Such behaviors often indicate a broader strategy to exfiltrate data or infiltrate the environment unnoticed.

  The relevant MITRE ATT&CK tactics for this detection include **Exfiltration (TA0010)**, focusing on techniques like **Data Encrypted (T1537)**, where attackers encrypt data to mask its exfiltration. Unauthorized configuration changes can lead to vulnerabilities that facilitate further exploitation or unauthorized access. Primary data sources for detecting these activities include AWS CloudTrail logs, which record API calls made to S3, providing a detailed trail of user actions on S3 resources.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Check AWS CloudTrail logs for `PutBucketLogging`, `PutBucketWebsite`, `PutEncryptionConfiguration`, `PutLifecycleConfiguration`, `PutReplicationConfiguration`, `ReplicateObject`, and `RestoreObject` events to identify unauthorized changes.
  - **Verify User Activity**: Confirm the identity and activity of the user making the changes. Identify if the user agent or host performing these actions is typical for administrative tasks within your environment.
  - **Assess Impact of Changes**: Evaluate the potential impact of the detected changes on your S3 data management policies. This includes understanding how alterations may affect data security, availability, and audit trails.
  - **Investigate Correlating Events**: Look for associated activities around the time of the changes, such as unusual or unauthorized API calls, signs of lateral movement, or other indicators of compromise.

  ### Prioritization
  This alert is rated as low severity due to the potential for false positives from legitimate administrative actions. However, unexpected or unauthorized changes can signal an ongoing risk, demanding prompt investigation to mitigate possible data exfiltration or manipulation.

  ### Blind Spots and Assumptions
  This detection relies on the thorough configuration of AWS CloudTrail for capturing S3-related API calls. If CloudTrail is not properly set up or if log retention policies are insufficient, relevant events may not be recorded, leading to gaps in detection coverage. Assumptions include that all users making changes are authorized to do so; thus, actual administrative behavior may lead to misclassification of legitimate activities as threats. Analysts should ensure that CloudTrail is enabled for S3 and that all relevant logs are retained for sufficient durations.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
