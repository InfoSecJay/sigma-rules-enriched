title: AWS New Lambda Layer Attached
id: 97fbabf8-8e1b-47a2-b7d5-a418d2b95e3d
status: test
description: |
  Detects when a user attached a Lambda layer to an existing Lambda function.
  A malicious Lambda layer could execute arbitrary code in the context of the function's IAM role.
  This would give an adversary access to resources that the function has access to.
references:
- https://docs.aws.amazon.com/lambda/latest/dg/API_UpdateFunctionConfiguration.html
- https://github.com/clearvector/lambda-spy
author: Austin Songer
date: 2021-09-23
modified: 2025-03-17
tags:
- attack.privilege-escalation
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: lambda.amazonaws.com
    eventName|startswith: 'UpdateFunctionConfiguration'
    requestParameters.layers|contains: '*'
  condition: selection
falsepositives:
- Lambda Layer being attached may be performed by a system administrator. Verify whether
  the user identity, user agent, and/or hostname should be making changes in your
  environment.
- Lambda Layer being attached from unfamiliar users should be investigated. If known
  behavior is causing false positives, it can be exempted from the rule.
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects when a user attaches a Lambda layer to an existing AWS Lambda function, particularly monitoring `UpdateFunctionConfiguration` events. The probable attacker objective is to leverage the attached Lambda layer for executing arbitrary code with the IAM role privileges of the Lambda function, potentially leading to unauthorized access to sensitive resources. This detection corresponds with the MITRE ATT&CK tactic of "Privilege Escalation" (Tactics ID: TA0004), specifically technique "Use of Trusted Relationship" (T1322).

  Primary telemetry sources for this detection include AWS CloudTrail logs, detailing events related to Lambda changes. If malicious, this action could lead to significant security breaches through privilege escalation. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate updates by authorized users may also trigger the alert.

  ---

  ### Investigation Steps

  - **Verify the user identity and role:**
    Check CloudTrail logs for the `Event Name: UpdateFunctionConfiguration` (Event ID: ?) to identify the IAM user/role making the change. Confirm if the user has the required permissions historically and is expected to perform this action.

  - **Assess the IAM role privileges:**
    Examine the IAM policies associated with the impacted Lambda function. If the role has excessive permissions (e.g., full access to AWS resources), this could indicate heightened risk if the Lambda layer is compromised.

  - **Review the origin of the change:**
    Investigate the `userAgent` field in the CloudTrail logs to determine the origin of the API call. Legitimate changes (e.g., from known IP ranges or specific administrative user agents) should be less concerning than those from unexpected sources.

  - **Inspect the associated Lambda layer:**
    Check for the specific layer ID referenced in the `requestParameters.layers` field. Cross-reference with a whitelist of approved layers. If the ID is unfamiliar or associated with prior security incidents, consider it a high-confidence indicator of potential compromise.

  - **Evaluate Lambda function activity:**
    Look into any recent invocations of the affected Lambda function through CloudWatch logs. Compare this activity with the timing of the layer attachment. Unusual execution patterns may indicate misuse or compromise.

  - **Check for related detections:**
    Review alerts from any companion detections related to unauthorized AWS API activity. This includes CloudTrail monitoring for suspicious API calls that might precede or follow the Lambda layer attachment.

  ---

  ### Prioritization

  The alert is of low severity in a mature enterprise context but should not be overlooked. The impact is moderate, as Lambda functions can have access to critical systems and data. However, the common occurrence of administrators attaching layers means that the likelihood of malicious abuse is relatively low, though still possible depending on contextual factors.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include higher-tier users masking their actions or utilizing benign-sounding layer names to avoid initial scrutiny. Reliable detection requires enabling comprehensive AWS CloudTrail logging, particularly for Lambda functions. Legitimate activities may include routine updates by trusted administrative personnel. A related detection could include monitoring for changes to IAM roles associated with Lambda functions, which would provide additional coverage for privilege escalation risks.

