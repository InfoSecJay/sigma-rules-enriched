title: AWS New Lambda Layer Attached
id: 97fbabf8-8e1b-47a2-b7d5-a418d2b95e3d
status: test
description: |
  Detects when a user attached a Lambda layer to an existing Lambda function.
  A malicious Lambda layer could execute arbitrary code in the context of the function's IAM role.
  This would give an adversary access to resources that the function has access to.
references:
- https://docs.aws.amazon.com/lambda/latest/dg/API_UpdateFunctionConfiguration.html
- https://github.com/clearvector/lambda-spy
author: Austin Songer
date: 2021-09-23
modified: 2025-03-17
tags:
- attack.privilege-escalation
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: lambda.amazonaws.com
    eventName|startswith: 'UpdateFunctionConfiguration'
    requestParameters.layers|contains: '*'
  condition: selection
falsepositives:
- Lambda Layer being attached may be performed by a system administrator. Verify
  whether the user identity, user agent, and/or hostname should be making 
  changes in your environment.
- Lambda Layer being attached from unfamiliar users should be investigated. If 
  known behavior is causing false positives, it can be exempted from the rule.
level: low
note: |
  ### Technical Context

  This rule detects when a user attaches a Lambda layer to an existing Lambda function, a behavior that could indicate an attempt to escalate privileges or execute unauthorized code. An adversary may seek to leverage this functionality to insert malicious code that runs within the permissions of the Lambda function's IAM role, potentially granting access to sensitive resources. The relevant MITRE ATT&CK tactic is **Privilege Escalation**, with the technique being **Exploitation of Vulnerability** (T1203).

  The primary telemetry sources for this alert are AWS CloudTrail logs, specifically focusing on the `UpdateFunctionConfiguration` events relating to the modification of Lambda functions. If malicious, the impact can be significant, as it could lead to unauthorized access or data exfiltration. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate updates by administrators can also generate this alert.

  ### Investigation Steps

  - **Examine CloudTrail logs for event details**: Look for Event Name `UpdateFunctionConfiguration` within CloudTrail logs (Event ID: `AWS::Lambda::Function`). Filter results by the user identity and time to determine if the requester is legitimate.

  - **Check the `requestParameters.layers` field**: Identify any layers being added to the Lambda function. Unrecognized layers or those sourced from unknown repositories may indicate malicious activity. Compare against known good configurations.

  - **Validate user identity and access history**: Investigate the legitimacy of the user making the modification by checking IAM policies, roles attached, and previous API usage logs (AWS CloudTrail). Confirm whether this user has the appropriate permissions for such changes.

  - **Identify common legitimate usage patterns**: Review the organizational processes for modifying Lambda configurations. Determine if the change aligns with expected maintenance schedules or known application development practices.

  - **Assess the impact of the Lambda function**: Evaluate the criticality of the Lambda function being modified. Functions with elevated permissions or access to sensitive data pose a higher risk if compromised via malicious layers.

  - **Cross-reference with related alerts**: Look for other security events that may be correlated, such as unusual IAM role modifications or network traffic from Lambda functions that exhibit unexpected behavior, providing context to the alert.

  ### Prioritization

  The alert is considered low severity in a mature enterprise SOC context; however, the actual risk depends on the privileges associated with the Lambda function in question. While the likelihood of malicious abuse exists, particularly if unexpected users are modifying configurations, such changes are not uncommon in typical development cycles.

  ### Blind Spots and Assumptions

  One limitation in detection is the potential for evasion through carefully crafted legitimate IAM policies that allow unmonitored changes. Assurance of AWS CloudTrail being configured correctly for capturing all relevant Lambda events is essential. Additionally, legitimate integrations, such as CI/CD pipelines attaching layers for updates, could trigger the alert without malicious intent. Companion detections that could enhance coverage include monitoring for unusual IAM role changes or unexpected AWS service usage patterns.

