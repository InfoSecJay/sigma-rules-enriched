title: AWS New Lambda Layer Attached
id: 97fbabf8-8e1b-47a2-b7d5-a418d2b95e3d
status: test
description: |
  Detects when a user attached a Lambda layer to an existing Lambda function.
  A malicious Lambda layer could execute arbitrary code in the context of the function's IAM role.
  This would give an adversary access to resources that the function has access to.
references:
- https://docs.aws.amazon.com/lambda/latest/dg/API_UpdateFunctionConfiguration.html
- https://github.com/clearvector/lambda-spy
author: Austin Songer
date: 2021-09-23
modified: 2025-03-17
tags:
- attack.privilege-escalation
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: lambda.amazonaws.com
    eventName|startswith: 'UpdateFunctionConfiguration'
    requestParameters.layers|contains: '*'
  condition: selection
falsepositives:
- Lambda Layer being attached may be performed by a system administrator. Verify whether
  the user identity, user agent, and/or hostname should be making changes in your
  environment.
- Lambda Layer being attached from unfamiliar users should be investigated. If known
  behavior is causing false positives, it can be exempted from the rule.
level: low
note: |
  ### Technical Context
  This detection rule identifies when a Lambda layer is attached to an existing AWS Lambda function, which may indicate potential unauthorized modifications. Attackers can exploit Lambda layers to execute arbitrary code in the context of the function's IAM role, allowing them to access sensitive resources and perform malicious actions within the AWS environment. This threat scenario poses risks such as privilege escalation and unauthorized data access, as an adversary could leverage the Lambda function's permissions to gain further footholds within the cloud infrastructure.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Privilege Escalation** (T1068) – Exploiting the permissions of an IAM role associated with the Lambda function.
  - **Execution** (T1203) – Running arbitrary code using the Lambda layer.

  The primary data sources applicable for this detection are AWS CloudTrail logs, which record API calls made within the AWS account, providing a detailed history of changes to Lambda functions and associated configurations.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Check AWS CloudTrail logs for the specific event of `UpdateFunctionConfiguration` to verify the details of the event, including the user, timestamp, and source IP.
  - **Identify User Credentials**: Investigate the identity (IAM user or role) associated with the Lambda layer attachment to determine if the activity aligns with expected administrative actions or if it’s suspicious.
  - **Inspect Lambda Function Permissions**: Analyze the IAM role assigned to the affected Lambda function to understand the permissions that the newly attached layer might exploit.
  - **Monitor for Unusual Patterns**: Look for unusual behavior in the usage of Lambda functions associated with the newly attached layer, such as unauthorized function invocations or access to resources outside normal operations.

  ### Prioritization
  This alert is classified as low severity due to the potential for both legitimate administrative activities and possible malicious actions. However, unauthorized modifications to Lambda configurations warrant timely investigation given the risks associated with privilege escalation within the cloud environment.

  ### Blind Spots and Assumptions
  There may be gaps in the detection coverage if CloudTrail logging is not fully enabled for all regions or services, as missing logs could prevent detection of legitimate Lambda function modifications. The detection logic assumes that not all Lambda layer attachments represent malicious activity, as system administrators may legitimately perform these actions. To ensure accurate detection, AWS CloudTrail must be properly configured to log all Lambda API calls and retain logs for analysis.

