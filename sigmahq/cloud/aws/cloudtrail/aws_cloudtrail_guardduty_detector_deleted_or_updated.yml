falsepositives:
- Legitimate detector deletion by an admin (e.g., during account decommissioning).
- Temporary disablement for troubleshooting (verify via change management tickets).
- Automated deployment tools (e.g. Terraform) managing GuardDuty state.
level: high
note: |
  ### Technical Context
  This rule detects when an AWS GuardDuty detector is deleted or updated to a disabled state. Such actions may indicate malicious intent, especially when performed by unauthorized users seeking to negate security monitoring and cover their tracks during a compromise. When a GuardDuty detector is deleted, the service ceases to monitor for threats, leading to potential undetected malicious activities in the environment.

  The likely attacker objectives include evading detection of ongoing malicious activities within the AWS environment, such as lateral movement, data exfiltration, or persistent access. This behavior is associated with the MITRE ATT&CK techniques for defense evasion, including **T1562.001 - Disable or Modify Security Tools** and **T1562.008 - Indicator Blocking**. By disabling or removing GuardDuty, attackers aim to avoid triggering alerts that would notify administrators of suspicious or harmful actions.

  Primary data sources for detecting this activity include AWS CloudTrail logs, which capture API calls made across AWS services, providing context about the identity and source of requests related to the deletion or modification of the GuardDuty detector.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Filter CloudTrail logs for events where the `eventSource` is `guardduty.amazonaws.com`, particularly focusing on `DeleteDetector` and `UpdateDetector` events.

  - **Verify User Identity**: Validate the user identity that executed the deletion or update action, ensuring it aligns with authorized accounts. Cross-reference with IAM policies and access controls.

  - **Assess Change Management Practices**: Investigate recent change management tickets or procedures that might justify the deletion or disabling of the detector, verifying legitimate administrative activities.

  - **Audit Related Security Configurations**: Examine related AWS security settings and configurations to ensure that other monitoring or security tools remain active, mitigating the potential for undetected threats.

  ### Prioritization
  This alert is considered high severity due to the significant impact that the deletion or disabling of GuardDuty can have on the security posture of the organization. The likelihood of exploitation is heightened in environments actively monitored for security threats, making rapid investigation and response critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios where GuardDuty is deliberately disabled by legitimate users, such as during scheduled maintenance or troubleshooting. The detection logic assumes that all actions are taken by users who fall outside acceptable operational practices, and it relies on the availability of CloudTrail logs configured to record all necessary API calls. Additionally, it assumes that legitimate changes are documented through formal change management processes, which may not always be the case in every enterprise environment.

