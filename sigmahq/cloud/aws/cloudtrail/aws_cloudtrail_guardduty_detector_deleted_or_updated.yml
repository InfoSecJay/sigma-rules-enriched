falsepositives:
- Legitimate detector deletion by an admin (e.g., during account 
  decommissioning).
- Temporary disablement for troubleshooting (verify via change management 
  tickets).
- Automated deployment tools (e.g. Terraform) managing GuardDuty state.
level: high
note: |
  ### Technical Context

  This rule detects when an AWS GuardDuty detector is either deleted or updated to be disabled. This behavior could indicate a potentially malicious actor attempting to evade detection of their activities by stopping GuardDuty from monitoring for threats. The relevant MITRE ATT&CK techniques are Defense Evasion (T1562.001) and Defense Evasion: Disable Security Tools (T1562.008). Log sources for this detection include AWS CloudTrail, specifically focusing on events from the `guardduty.amazonaws.com` service and the `DeleteDetector` and `UpdateDetector` actions. The security impact of a successful execution is significant, as it stops all threat monitoring and renders existing findings obsolete. However, this detection does not prove malicious intent without further contextual investigation.

  ### Investigation Steps

  - **Validate the user identity: ** Cross-reference the `userIdentity` field from CloudTrail logs (Event ID 50800) to confirm the identity initiating the action. Confirm whether the action aligns with expected administrative tasks or scheduled automation.

  - **Review change management procedures: ** Check for corresponding change management tickets or documentation that authorize the `DeleteDetector` or disabling via `UpdateDetector`. This may help identify legitimate administrative actions versus potential malicious activity.

  - **Analyze event logs: ** Review CloudTrail logs for `DeleteDetector` (Event Name) and `UpdateDetector` (Event Name) actions within a relevant timeframe. Confirm that the `errorCode` is `Success` to validate the action's execution.

  - **Identify recent alerts or findings: ** Examine prior GuardDuty findings and alerts within the last 30 days to see if the detector was operational up to the point of deletion/disablement, indicating potential threat activity.

  - **Check for automated tool usage: ** In cloud infrastructure, look for indications that automated deployment tools (e.g., Terraform configurations) were used around the time of the detector update. Event parameters for automated scripts might log in different accounts and could provide context.

  - **Correlate with other detections: ** Investigate if there are other security logs or alerts related to suspicious behavior (e.g., new IAM role creations, unusual API activity) occurring around the same timestamp. This can strengthen the case for or against malicious activity.

  ### Prioritization

  This alert has high-severity implications due to the critical role GuardDuty plays in threat monitoring within the AWS environment. The likelihood of this behavior being exploited maliciously is significant, as disabling security tools is a common tactic for attackers aiming to avoid detection.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured AWS CloudTrail logging, which could result in key actions not being logged. Legitimate maintenance activities, such as preparatory steps for decommissioning accounts or performing troubleshooting, could falsely trigger the alert. One complementary detection to consider is monitoring for unexpected modifications to IAM policies or instances prior to the deletion of GuardDuty, which would signal elevated concern for malicious actions occurring in conjunction with this rule.

