falsepositives:
- Legitimate detector deletion by an admin (e.g., during account 
  decommissioning).
- Temporary disablement for troubleshooting (verify via change management 
  tickets).
- Automated deployment tools (e.g. Terraform) managing GuardDuty state.
level: high
note: |
  ### Technical Context

  This rule detects actions related to the deletion or disabling of an AWS GuardDuty detector, which is critical for detecting malicious activities in an AWS environment. The likely objective of an attacker triggering this rule is to impair the monitoring capabilities of GuardDuty, allowing them to execute malicious activities without being detected. This behavior aligns with the MITRE ATT&CK techniques T1685 (Defense Evasion) and T1685.002 (Disable or Modify Security Tools). The primary telemetry source for this detection is AWS CloudTrail logs, specifically monitoring for the `DeleteDetector` and `UpdateDetector` events issued by the GuardDuty service.

  If successful, the deletion or disabling of GuardDuty may leave the environment vulnerable to undetected intrusions, as existing findings and ongoing monitoring are halted. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions (e.g., decommissioning or troubleshooting) can also trigger these events.

  ### Investigation Steps

  - **Review CloudTrail logs for deletion actions:** Check for CloudTrail Event Name `DeleteDetector` or `UpdateDetector` where `requestParameters.enable` is set to `'false'`. Look for UserIdentity to identify the actor and correlate with expected user roles.

  - **Validate user identity and context:** Confirm whether the account triggering the event has legitimate reasons for the action (e.g., support requests, change management documentation). Check for associated AWS IAM user or role with `aws:userid` field.

  - **Examine recent activity in the console/CLI:** Search for recent operations in the CloudTrail logs before the event that may correspond with potential malicious behavior, such as unauthorized access attempts or changes made to critical IAM roles.

  - **Check for automated infrastructure management tools:** Identify if any CI/CD tools (e.g., Terraform or AWS Config) were responsible for the deletion or modification. Look for execution records associated with known infrastructure management pipelines.

  - **Identify high-confidence malicious indicators:** Monitor for multiple related alerts, such as a sudden increase in privileged API calls before the deletion action, typically observed in the `eventSource: iam.amazonaws.com` with relevant action types.

  - **Note expected benign behaviors:** Legitimate administrative actions for troubleshooting or decommissioning should be documented; ensure verification with operational teams, especially if related changes occurred around the same time.

  ### Prioritization

  This alert is considered high severity due to the potential impact on an organization's security posture. If GuardDuty is deleted or disabled, existing threat detection capabilities are compromised, increasing the likelihood of undetected adversarial activity. This behavior is commonly weaponized by attackers to evade security tools and maintain persistence in the environment.

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited if CloudTrail logs are not properly configured or retained, as absence of logs can prevent insight into historically malicious behaviors. Legitimate administrative activities, such as scheduled maintenance or automated deployments, can produce similar alerts. Companion detections, such as IAM user privilege escalation (e.g., T1078), strengthen the coverage against misused accounts and contextually suspicious behavior leading to GuardDuty modifications.

