  ### Technical Context

  This Sigma rule detects the restoration of a new public AWS RDS (Relational Database Service) instance from a snapshot, specifically when the instance is marked as publicly accessible. The likely attacker objective is to facilitate data exfiltration by creating a publicly accessible database, which can be exploited to access sensitive data. This activity aligns with the MITRE ATT&CK tactic of Exfiltration (TA0020), particularly the technique "Exfiltration Over Command and Control Channel" (T1020).

  The primary telemetry source for this rule is AWS CloudTrail logs, which capture events related to AWS services. The specific log type of interest is the RDS event indicating database instance restoration, with key fields like `eventSource`, `responseElements.publiclyAccessible`, and `eventName`. If malicious, this behavior could lead to unauthorized data access and leakage, undermining the organization's data security. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Review CloudTrail logs for the restoration event:** Check AWS CloudTrail logs for `eventSource: rds.amazonaws.com` and `eventName: RestoreDBInstanceFromDBSnapshot`. Look for log entries with `responseElements.publiclyAccessible: 'true'`.

  - **Validate instance configuration:** Identify the RDS instance created by the restoration. Validate its configuration settings, particularly security group rules and IAM role permissions, to ensure it aligns with organizational policy and contains no overly permissive access.

  - **Assess legitimate administrative actions:** Determine if this restoration is expected by verifying any recent maintenance or administrative schedule. Look for documented changes in the Change Management system that may justify the restoration of the public RDS instance.

  - **Correlate with related alerts:** Search for prior alerts in CloudTrail that may indicate reconnaissance or privilege escalation activity, which could demonstrate an attacker was preparing the environment for data exfiltration prior to the instance restoration.

  - **Identify high-confidence malicious indicators:** Check for unusual or unauthorized accounts triggering this restore action, paying attention to activity by less privileged users or accounts that are typically not associated with database administration.

  ### Prioritization

  The alert severity is high due to the significant risk posed by a publicly accessible RDS instance, especially in environments housing sensitive or proprietary data. The likelihood of malicious abuse is elevated, considering adversaries commonly utilize similar tactics for data exfiltration, making this behavior suspicious.

  ### Blind Spots and Assumptions

  Detection limitations exist around legitimate use cases where authorized users may restore a public database for valid reasons, such as temporary development or testing purposes. Reliable detection requires sufficient CloudTrail logs that adequately capture all RDS events, ensuring no gaps in coverage. Additionally, common administrative actions or automated scripts that restore public instances could inadvertently trigger this alert. A related detection to strengthen coverage could involve monitoring IAM user activity for unusual snapshot access patterns or privileges.

