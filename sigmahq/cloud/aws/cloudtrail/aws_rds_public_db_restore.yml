note: |
  ### Technical Context
  This detection rule identifies the restoration of a public Amazon RDS (Relational Database Service) instance from a snapshot. This activity is indicative of potentially unauthorized data exposure and may be carried out during a data exfiltration attempt, as it gives an attacker the ability to access sensitive database information from a publicly accessible database instance. The attack scenario may involve a compromised AWS account or misconfigured permissions, allowing an actor to manipulate database instances to exfiltrate data without appropriate authorization.

  Relevant MITRE ATT&CK tactics and techniques associated with this alert include **Exfiltration** (TA0010) and **Exfiltration Over Alternative Protocol** (T1020), highlighting the risk posed by exposing internal databases to the internet and the potential for data breach incidents. Primary data sources for this detection include AWS CloudTrail logs, which provide visibility into RDS events and configurations, particularly those indicating public access modifications.

  ### Investigation Steps
  - **Review AWS CloudTrail Logs:** Assess the logs for entries related to RDS actions, specifically `RestoreDBInstanceFromDBSnapshot`, focusing on events marked `publiclyAccessible: 'true'`.
  - **Check RDS Configuration:** Inspect the configuration of the restored RDS instance for security settings, including network access control lists, security groups, and parameter groups to confirm that the instance should be publicly accessible.
  - **Analyze Snapshot Origin:** Investigate the snapshots from which the database instance was restored. Determine the source, creation time, and any associated compliance or security concerns regarding the contents of these snapshots.
  - **Audit IAM Permissions:** Look into the Identity and Access Management (IAM) policies tied to the user or role that performed the restoration. Verify if there were any recent changes that could have granted escalation privileges enabling this action.

  ### Prioritization
  The severity of this alert is high, as exposing a database instance to the public internet can lead to significant data breaches and compromise sensitive information. Given the potential for unauthorized access, any instance recovery operations should be immediately investigated in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic may not cover instances where an attacker has altered or deleted related audit logs to obfuscate their actions. The assumption is that the CloudTrail logging is correctly set up and enabled for all required services. Additionally, proper IAM role configurations must be in place to trigger alerts effectively; gaps may arise if user permissions allow undetected modifications or if snapshots are restored without alerting relevant auditing measures.

