note: |
  ### Technical Context

  This detection rule identifies the usage of AWS root account credentials. The likely attacker objective is to gain full control over AWS resources, allowing for data exfiltration, service disruptions, or unauthorized changes. It aligns with the MITRE ATT&CK technique "Valid Accounts" (T1078.004). The primary telemetry source is AWS CloudTrail, focusing on event logs related to root account usage. If this behavior is malicious, it poses a significant security risk, as root account access enables unrestricted control of all AWS resources and settings. However, this detection alone does NOT confirm malicious intent, as there are legitimate tasks that may require root account usage.

  ### Investigation Steps

  - **Verify event logs for root account activity:** Check AWS CloudTrail logs for `EventName` denoting root account actions. Look specifically for `userIdentity.type` set to "Root". Record the associated `eventTime`, `sourceIPAddress`, and `userAgent` for context.

  - **Correlate with recent administrative activity:** Investigate any recent changes made by the root account by reviewing AWS Config or IAM activity logs. Document whether any routine maintenance or legitimate requests align with the detected root account activity.

  - **Check for unusual IP address access:** Analyze `sourceIPAddress` fields from the logs. Cross-reference IP addresses against known locations for your organization to identify anomalies, which may indicate unauthorized access.

  - **Identify legitimate root account usage patterns:** Document expected and frequent legitimate activities that utilize the root account, such as billing tasks and account setup changes. Compare these patterns against the current alert.

  - **Evaluate for high-confidence malicious indicators:** Look for events involving high-impact AWS services like EC2 instance modifications or S3 bucket policy changes immediately following root account access. These may represent attempts to escalate privileges or exfiltrate data.

  ### Prioritization

  This alert carries medium severity due to the high impact a compromised root account can have. The likelihood of malicious abuse is significant, as root account access can lead to severe breaches. While legitimate usage may occur, the potential for exploitation makes this behavior concerning.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing session tokens or AWS Roles to obscure behavior. CloudTrail logs must be configured to capture all events; otherwise, some root account activities might go unnoticed. Legitimate activities include AWS support actions or customer verifications that could trigger this alert. A companion detection to consider is monitoring for unusual IAM role or permission changes, which can complement root account usage detection.

