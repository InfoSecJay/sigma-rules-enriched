falsepositives:
- A domain may be transferred to another AWS account by a system or network 
  administrator. Verify whether the user identity, user agent, and/or hostname 
  should be making changes in your environment. Domain transfers from unfamiliar
  users or hosts should be investigated. If known behavior is causing false 
  positives, it can be exempted from the rule.
level: low
note: |
  ### Technical Context

  This detection captures events where a domain managed in AWS Route 53 is requested to be transferred to another AWS account, likely indicating unauthorized access or malicious intent to take control of the domain. The attacker’s objective could be to establish persistence, disrupt services, or conduct phishing attacks by controlling domains that belonged to legitimate users or organizations. This behavior maps to the MITRE ATT&CK tactic of Persistence (TA0003) and technique of Domain Spoofing (T1098).

  The primary telemetry source for this detection is AWS CloudTrail, specifically monitoring the `TransferDomainToAnotherAwsAccount` API call. If malicious, an unauthorized domain transfer could lead to significant security impacts, including loss of domain control, leading to potential data breaches or disruption of services. This detection does NOT, on its own, confirm that the transfer was malicious and requires context around the requesting user or process.

  ---

  ### Investigation Steps

  - **Verify user identity and permissions:** Review the user’s principles of least privilege. Check the CloudTrail logs for the `UserIdentity` field of the event, correlating with IAM roles or user activities to see if they have legitimate authorization for such actions.

  - **Analyze the timestamp and activity context:** Look at the time of the transfer against known legitimate operational patterns. Assess if the transfer occurred during unusual hours or was repeated too frequently, which might indicate scripting or automation by an attacker.

  - **Check associated user agent and IP information:** Investigate the `sourceIPAddress` and user agent string within the CloudTrail logs (e.g., AWS CloudTrail Log files). Unrecognized IP addresses or user agents appearing in association with this action should be flagged for further investigation.

  - **Review historical changes to domain settings:** Identify prior changes to the domain settings through the Route 53 console or logs. Significant or unauthorized changes preceding the transfer request could indicate insider threats or compromised accounts.

  - **Assess the potential for false positives:** Determine if expected business practices, such as migrations or restructurings, coincide with the domain transfer request. Validate with known administrators and document their typical patterns to calibrate alerts accordingly.

  ---

  ### Prioritization

  The alert is considered low severity in a typical enterprise context; however, it should not be ignored as the system impacted might host critical applications. The likelihood of malicious abuse is moderate, particularly in larger environments where account credentials could be compromised. While domain transfers are not commonly weaponized, they can have serious impacts if an attacker successfully carries one out.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detecting obfuscated or authorized transfers that may be carried out by legitimate administrators, which could lead to false positives. Reliable detection of this activity hinges on the proper configuration of CloudTrail logs and ensures that all events relating to Route 53 are being logged. Legitimate activities that may trigger this alert include intra-organizational transfers by known DSPs. A companion detection to consider is monitoring for unusual IAM permissions changes or credential examples that can help correlate potentially malicious activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
