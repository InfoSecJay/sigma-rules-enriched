note: |
  ### Technical Context

  This rule detects the deletion of Amazon S3 buckets through AWS CloudTrail logs, specifically looking for the `DeleteBucket` event. The likely attacker objective is to destroy critical data repositories, leading to data loss or to obstruct detection efforts during a broader compromise. Relevant MITRE ATT&CK tactic includes **Impact (TA0040)** and technique **Data Destruction (T1485)**. Primary telemetry sources include AWS CloudTrail logs detailing API calls and their outcomes, particularly focusing on `eventName` and `errorCode`. If malicious, this action could result in significant data integrity issues and operational disruptions for the affected systems. This detection does not confirm whether the deletion was authorized or allowed by a legitimate administrator.

  ### Investigation Steps

  - **Check CloudTrail logs for S3 DeleteBucket events:** Query CloudTrail for `eventName` equal to `DeleteBucket` (Event ID: N/A specific to CloudTrail), focusing on timestamps to correlate with the alert. Look for high-impact resource identifiers (bucket names).

  - **Correlate the event with IAM user activity:** Investigate the `userIdentity` field in the CloudTrail log to identify the user or role performing the deletion. Confirm if this entity has a legitimate reason for the action based on recent activities and policies.

  - **Identify time of deletion:** Validate the timestamp against routine maintenance logs to assess if the timing relates to expected administrative tasks. Legitimate deletions should correlate with maintenance schedules documented in internal records.

  - **Review associated deletion error codes:** Analyze the `errorCode` field in CloudTrail logs. Look for `errorCode: 'Success'`, confirming the deletion was executed without policy or permission issues. Be wary of deletions with null or unexpected error codes indicating possible manipulation.

  - **Assess bucket criticality:** Determine the importance of the deleted S3 bucket. Review data retention policies or business impact assessments to establish if the deletion could lead to severe organizational consequences.

  - **Look for patterns of multiple deletions:** Search for unusual activity patterns, such as batch deletions of multiple buckets within a short time frame, which may indicate malicious intent rather than normal operations.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on data integrity and availability of vital resources. The likelihood of malicious abuse is moderate, as S3 buckets often contain sensitive data that adversaries may target. While not all deletions are malicious, they can indicate a significant threat if occurring unexpectedly.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative users executing deletions during maintenance or testing activities, which could backfire if not well-documented. The effectiveness of this detection relies on properly enabled CloudTrail logging; if logging is disabled or improperly configured, detections may be missed. Legitimate activities, such as planned data migrations or clean-ups, might trigger this alert without indicating malicious intent. A companion detection to consider is monitoring for unusual IAM role or user activity prior to the deletion event.

