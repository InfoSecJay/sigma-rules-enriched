note: |
  ### Technical Context
  This detection rule identifies the deletion of S3 buckets in AWS CloudTrail logs, a critical operation that could indicate potential data loss as well as unauthorized access attempts to sensitive cloud data. Attackers may delete S3 buckets to sabotage data integrity, eliminate evidence of their activities, or disrupt business operations. They may target buckets that contain sensitive or critical data to achieve their objectives of exfiltration or destruction.

  Relevant MITRE ATT&CK tactics associated with this behavior include **Defense Evasion (T1561)**, where attackers attempt to hide their tracks by deleting resources, and **Impact (T1485)**, which encompasses actions taken to disrupt the operations of target systems or organizations by destroying data resources.

  The primary data source for this detection is AWS CloudTrail logs, which provide detailed records of actions taken on AWS resources, including the event name for the deletion of buckets.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Collect and analyze AWS CloudTrail logs for `DeleteBucket` events. Verify the user or role responsible for the deletion and assess their permissions to determine if the action was authorized.

  - **Examine User Activity**: Investigate recent activity by the user or role that performed the deletion. Look for unusual behavior or patterns, such as access from unexpected IP addresses or unusual timing of operations compared to historical data.

  - **Check for S3 Bucket Backups**: Assess if any backups or snapshots of the deleted bucket exist. Understanding the data loss impact helps prioritize immediate remediation actions.

  - **Conduct a Policy Review**: Review IAM roles and permissions associated with the deleting user or role. Assess whether principle of least privilege is enforced and if there are necessary alerts for sensitive actions like bucket deletions.

  ### Prioritization
  The alert's medium severity level is justified because while S3 bucket deletions can occur as part of legitimate operations, unauthorized deletions may lead to significant data loss or operational disruption, making immediate investigation crucial.

  ### Blind Spots and Assumptions
  This detection logic may not cover all scenarios where an S3 bucket deletion occurs, as legitimate administrative activities, such as maintenance or testing, could produce false positives. There is an assumption that adequate logging is enabled for CloudTrail and retains sufficient historical data for analysis. Additionally, unauthorized actions may be masked by administrative privileges, making it difficult to discern between legitimate and malicious deletions effectively.

