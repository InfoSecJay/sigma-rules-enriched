level: medium
note: |
  ### Technical Context

  This rule detects the deletion of S3 buckets as recorded in AWS CloudTrail logs. The typical objective behind such deletions could be data exfiltration, unauthorized access, or destructive actions by malicious actors. In terms of the MITRE ATT&CK framework, it aligns with the tactic of "Defense Evasion" (TA0005) and the technique "Impair Defenses" (T1485). Primary telemetry sources include AWS CloudTrail logs, which must capture specific event names and statuses associated with S3 bucket activities. The security impact of a malicious deletion can be significant, leading to data loss and service disruption. Importantly, this alert does NOT confirm intent; legitimate bucket deletions could occur as part of authorized management activities.

  ### Investigation Steps

  - **Verify event details in CloudTrail logs:** Check for event name *DeleteBucket* and related details in CloudTrail logs (Event Name: `DeleteBucket`, Source IP address: `aws:SourceIp`, Event Time: `eventTime`). Look for timestamps correlating with user activity.

  - **Identify the user/role responsible:** Review the *eventSource* field in the CloudTrail logs to identify the IAM user or role that executed the deletion. If the user is not an authorized admin (e.g., a developer or tester), it increases the suspicion of malicious activity.

  - **Correlate with existing user activities:** Examine CloudTrail logs for related actions by the same user (e.g., listing buckets before deletion using `ListBuckets`) within the same time frame. Legitimate activities usually have documented operational histories.

  - **Assess potential impacts on services:** Evaluate the criticality of the S3 bucket involved, considering its roles (e.g., hosting critical applications or holding sensitive data). Focus on organizational policies regarding data retention and backup.

  - **Investigate for lateral movement or escalation:** Cross-reference IAM permissions for the user who deleted the bucket. Check if they have permissions that allow them to escalate privileges or access sensitive resources. Look for unusual access patterns or unauthorized IAM role assumptions.

  ### Prioritization

  The alert has medium severity due to the potential impact on data integrity and availability, particularly if sensitive data is involved. The likelihood of malicious abuse is moderate, as unauthorized deletions can lead to significant operational disruptions. Although commonly weaponized actions exist, such as in data exfiltration scenarios, authorized administrative activities may also trigger this alert.

  ### Blind Spots and Assumptions

  One limitation of detection is that legitimate maintenance or testing activities by authorized users may trigger bucket deletion alerts, potentially leading to false positives. A reliance on CloudTrail as a sole telemetry source means that accurate log configurations are essential for reliable detection. Furthermore, automated CI/CD processes may delete and recreate S3 buckets routinely, which could mimic malicious behavior. A companion detection involving tracking unusual patterns of IAM role changes or unusual patterns in user login attempts could strengthen overall security posture.

