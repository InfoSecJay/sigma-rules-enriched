falsepositives:
- Automated processes using tools like Terraform may trigger this alert.
- Legitimate administrative actions by authorized system administrators could cause
  this alert. Verify the user identity, user agent, and hostname to ensure they are
  expected.
- Deletions by unfamiliar users should be investigated. If the behavior is known and
  expected, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the deletion of an AWS SAML provider through AWS CloudTrail logs. The removal of a SAML provider may indicate potential malicious activity aimed at obstructing administrative governance or security operations within an AWS environment. In scenarios of compromise, an attacker may seek to disable access for the information security team or administrators to impede their response to ongoing incidents or investigations.

  Relevant MITRE ATT&CK tactics/techniques include **Initial Access (T1078.004)**, which specifically pertains to exploitation of legitimate access methods; **Privilege Escalation (T1531)**, reflecting attempts to manipulate service configurations to gain unauthorized privileges; and **Defense Evasion (T1070)**, where attackers attempt to conceal their actions from monitoring systems. The primary data source for this detection is **AWS CloudTrail**, which logs API calls and can provide insights into who initiated the deletion and under what context.

  ### Investigation Steps
  - **Review CloudTrail Logs:** Examine AWS CloudTrail logs for the `DeleteSAMLProvider` event, focusing on the identity of the user or service account that initiated the deletion to determine if it was authorized.
  - **Correlate with IAM Policies:** Check the IAM roles and policies associated with the user or account that performed the deletion to ensure they possess transparency and legitimacy concerning the action taken.
  - **Analyze User Activity Logs:** Investigate recent activities of the user or service account involved by analyzing other CloudTrail events, particularly those relevant to permissions changes, asset accesses, or other administrative tasks leading up to the deletion.
  - **Validate Against Known Processes:** Cross-reference the event against standard operational practices within your organization to identify whether automated tools (such as Terraform) or authorized personnel were responsible for the deletion.

  ### Prioritization
  This alert is considered medium severity due to the potential impact on administrative access within the AWS environment. A successful deletion could impede the organization's security team's ability to respond to security incidents, increasing the likelihood of extended unauthorized access or damage.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include instances of **successful deletions** performed by users with legitimate operational roles, which might not trigger alerts due to expected behavior. The detection logic assumes that any deletion of a SAML provider is suspicious and should be investigated, but may miss contextual nuances surrounding expected administrative activities. Effective monitoring relies on the availability of AWS CloudTrail logs, which must be enabled and correctly configured to capture relevant events for alerting.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
