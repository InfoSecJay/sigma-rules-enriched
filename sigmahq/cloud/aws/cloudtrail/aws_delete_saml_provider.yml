falsepositives:
- Automated processes using tools like Terraform may trigger this alert.
- Legitimate administrative actions by authorized system administrators could 
  cause this alert. Verify the user identity, user agent, and hostname to ensure
  they are expected.
- Deletions by unfamiliar users should be investigated. If the behavior is known
  and expected, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the deletion of an AWS SAML provider through the AWS IAM service, specifically when the event status is marked as "success." This behavior may indicate malicious intent, as attackers could remove SAML providers to disrupt administrative access or hinder incident response capabilities. The relevant MITRE ATT&CK techniques include T1078.004 (Valid Accounts: Application accounts) and T1531 (Account Access Removal), fitting within the tactics of Privilege Escalation and Impact.

  The primary telemetry source is AWS CloudTrail logs, which capture API activity related to AWS IAM. Malicious deletion of a SAML provider can significantly impact an organization by hampering access for legitimate users, potentially leading to unauthorized control or disruptions in service. It is important to note that this detection does NOT confirm that a malicious actor is behind the deletion; it could also result from legitimate administrative actions, necessitating further investigation.

  ### Investigation Steps

  - **Verify CloudTrail logs:** Check AWS CloudTrail logs for Event Name `DeleteSAMLProvider` (Event Source: `iam.amazonaws.com`). Look for the `userIdentity` field to identify who initiated the deletion. An expected user should be an administrator or known service account.

  - **Analyze timestamps:** Review the timestamp of the deletion event against ongoing security incidents or administrative activities. Legitimate deletions will often correlate with scheduled maintenance or known security reviews.

  - **Cross-reference with IAM policies:** Review the IAM policies assigned to the user who performed the deletion. Ensure that this user has a documented role that includes such actions. A user without appropriate permissions may indicate potential compromise.

  - **Investigate unusual user behavior:** Determine if the user account that executed the deletion has exhibited unusual activity patterns leading up to the event, such as logins from unfamiliar IP addresses. Look at corresponding CloudTrail events for unusual API calls.

  - **Check for automation involvement:** If the deletion aligns with the execution of Infrastructure as Code tools (like Terraform), confirm that this was a legitimate operation. Validate with documented changes or infrastructure management policies.

  ### Prioritization

  This alert is of medium severity due to the critical nature of IAM configurations in AWS environments. While the likelihood of this behavior being abused is moderate, it is essential to prioritize further investigation, especially if the deletion is performed by unfamiliar users or during irregular hours. This activity can lead to significant operational impacts if exploited by adversaries.

  ### Blind Spots and Assumptions

  One limitation of this detection is that legitimate administrative actions may trigger the alert, especially in environments using automated tools for infrastructure management. Reliable detection requires continuous logging from CloudTrail, and alerts can be bypassed by insider threats with valid access. Legitimate operations, like scheduled deletions during maintenance windows, may also cause this alert. Companion detections such as monitoring IAM policy changes or user sign-in events can enhance coverage against potential misuse.

