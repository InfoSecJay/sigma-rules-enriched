title: AWS SAML Provider Deletion Activity
id: ccd6a6c8-bb4e-4a91-9d2a-07e632819374
status: experimental
description: |
  Detects the deletion of an AWS SAML provider, potentially indicating malicious intent to disrupt administrative or security team access.
  An attacker can remove the SAML provider for the information security team or a team of system administrators, to make it difficult for them to work and investigate at the time of the attack and after it.
references:
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteSAMLProvider.html
author: Ivan Saakov
date: 2024-12-19
tags:
- attack.t1078.004
- attack.privilege-escalation
- attack.defense-evasion
- attack.initial-access
- attack.persistence
- attack.t1531
- attack.impact
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: 'iam.amazonaws.com'
    eventName: 'DeleteSAMLProvider'
    status: 'success'
  condition: selection
falsepositives:
- Automated processes using tools like Terraform may trigger this alert.
- Legitimate administrative actions by authorized system administrators could 
  cause this alert. Verify the user identity, user agent, and hostname to ensure
  they are expected.
- Deletions by unfamiliar users should be investigated. If the behavior is known
  and expected, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of an AWS SAML provider, indicating a potential intent to disrupt access for security and administrative teams within the organization. The typical attacker objective is to hinder visibility and remediation efforts during a compromise, aligning with tactics of persistence and defense evasion (MITRE ATT&CK technique: T1078.004 - Valid Accounts and T1531 - Account Access Removal). Primary telemetry sources include AWS CloudTrail logs, specifically targeting the `DeleteSAMLProvider` event, which details actions taken under AWS Identity and Access Management (IAM). If malicious, this activity could lead to significant disruptions in access control and monitoring. However, this detection alone does not confirm malicious intent; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Verify IAM user identity:** Check the `userIdentity` field in the CloudTrail log for the `DeleteSAMLProvider` event (EventName: `DeleteSAMLProvider`, EventSource: `iam.amazonaws.com`). Confirm whether this user has a legitimate role to perform deletions.

  - **Examine user agent and source IP:** Assess the `sourceIPAddress` and `userAgent` fields for unusual or unfamiliar origin points that deviate from recognized administrative patterns, as authorized admins usually operate from predefined, trusted IPs.

  - **Review recent SAML provider usage:** Investigate CloudTrail logs for the `CreateSAMLProvider` event to confirm the timeframe of SAML provider creation, ensuring it aligns with user access needs and hasn’t been recently used by the security team.

  - **Identify automated processes:** Look for patterns of automation, such as Terraform, which may cause false positives in deletion activity. Check if the event coincides with known deployments or infrastructure adjustments.

  - **Check for multiple deletion events:** Analyze the CloudTrail logs for any repeat deletion actions attempted by the same user within a short timeframe to identify potential brute-force or malicious attempts.

  ### Prioritization

  The alert is medium severity due to its potential impact on access management systems. The likelihood of this behavior being abused is moderate, given that adversaries commonly disable or remove access methods to minimize organizational visibility during an attack. While this activity can indicate an attack, context such as user role and previous activity is essential for accurate assessment.

  ### Blind Spots and Assumptions

  Detection accuracy may be limited by evasion techniques such as attackers impersonating legitimate users with stolen credentials. Reliably detecting this activity requires complete logging configuration for AWS CloudTrail to capture all relevant actions. Legitimate administrative actions, particularly by known users making standard changes, may also trigger this alert and should be evaluated carefully. Companion detections, such as monitoring for creation of unexpected IAM roles or users (EventName: `CreateRole` or `CreateUser`), can provide additional context and strengthen overall security posture.

