note: |
  ### Technical Context
  This detection rule identifies the addition of a new network route within an AWS environment, specifically through the monitoring of AWS CloudTrail logs. The presence of new routes can signify changes in network configurations that may be part of legitimate administrative tasks, but they can also indicate potential malicious activities such as lateral movement, exfiltration pathways, or command and control (C2) communications. Attackers may seek to manipulate network routes to obscure their activities or to redirect traffic for malicious purposes.

  The relevant MITRE ATT&CK tactics and techniques involved in this scenario include **Defense Evasion (TA0005)** and **Indicator Removal on Host (T1562.007)**. By creating new routes, an attacker could establish a hidden path in the network or analyze traffic to aid future operations undetected. The primary data sources that will yield the most pertinent evidence for this detection include AWS CloudTrail logs which detail API calls made in the AWS environment, highlighting events such as `CreateRoute` tied to network configuration changes.

  ### Investigation Steps
  - **Review CloudTrail Logs**: Analyze AWS CloudTrail logs focusing on the `CreateRoute` events to determine the user or role initiating the route addition and any associated modifications that may have been made around the same time.
  - **Check for Anomalous Patterns**: Identify any unusual timings, frequency, or patterns in the `CreateRoute` events that deviate from baseline administrative behaviors, especially those that coincide with other potentially suspicious activity.
  - **Correlate with IAM Roles**: Investigate the Identity and Access Management (IAM) roles and permissions of the entity (user or application) that executed the `CreateRoute` event to assess if they align with expected privileges and investigate any role misuse or privilege escalation.
  - **Assess Network Traffic**: Monitor network traffic to/from the newly created route for abnormal activity or connections that could indicate malicious use or unauthorized access attempts.

  ### Prioritization
  The alert should be considered medium severity as the creation of a new network route can both indicate legitimate operations, such as the creation of new VPCs or subnets, and also signify potential malicious activity aimed at obfuscating attacker actions. Analysts must carefully evaluate the context of the route change to determine its intent.

  ### Blind Spots and Assumptions
  Potential blind spots in this detection logic include environments where logging may not cover all API calls or where CloudTrail logging is configured inadequately. The assumption made in this detection is that all network-related changes are captured in CloudTrail and that administrative actions follow normal operational protocols. Additionally, without proper logging and monitoring of network traffic, detection of any misuse of new routes may be limited, underscoring the need for comprehensive network visibility to validate the presence of suspicious activities related to these routes.

