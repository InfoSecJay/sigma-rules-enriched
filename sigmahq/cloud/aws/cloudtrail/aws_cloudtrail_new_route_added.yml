  ### Technical Context

  This Sigma rule detects the creation of a new network route in AWS, specifically through the `CreateRoute` API call. An attacker might want to modify routing tables to redirect traffic, potentially facilitating data exfiltration or malicious command and control communications. The relevant MITRE ATT&CK tactic is "Defense Evasion," under technique T1562.007 (Route Injection). The primary telemetry sources for this detection are AWS CloudTrail logs that track API calls, specifically focusing on `eventSource` and `eventName`.

  If malicious, this could enable attackers to reroute critical traffic, leading to data breaches or altered traffic flows within the cloud environment. Notably, this detection does NOT confirm unauthorized access or exploitation by itself, as legitimate administrative actions may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review CloudTrail logs for 'CreateRoute' events:** Check AWS CloudTrail logs (Event Name: `CreateRoute`, Event Source: `ec2.amazonaws.com`) for unusual timestamps correlating with user activities.

  - **Correlate user identity with actions taken:** Verify the AWS Identity and Access Management (IAM) user or role responsible for the `CreateRoute` event. Check for unexpected changes by cross-referencing with IAM access logs that might indicate compromised credentials.

  - **Identify VPC/Subnet setups:** Determine if the route addition is linked to legitimate infrastructure changes, such as a new VPC or subnet setup, which should normally occur during project initiation phases.

  - **Check for additional suspicious route modifications:** Investigate if there are multiple route creation events in a short timeframe, indicating possible automation or nefarious activity, and log these occurrences by extracting relevant fields from CloudTrail logs.

  - **Document network configurations:** Validate the intent of the new route by analyzing expected routing behavior, ensuring that the addition aligns with established network traffic flows identified in network documentation.

  - **Triangulate with other security alerts:** Look for concurrent alerts related to the same AWS account or resource, such as instances of data exfiltration or unauthorized EC2 instance provisioning, to assess a broader context of potential malicious behavior.

  ---

  ### Prioritization

  This alert is of medium severity due to its potential impact on cloud infrastructure. The likelihood of exploitation is moderate; while route modifications can be used maliciously, they often happen for benign administrative purposes. The commonality of weaponized tactics in cloud environments raises the significance of this alert.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging or misconfigured CloudTrail settings, which could fail to capture all relevant API calls. Legitimate actions such as provisioning new network resources or adjusting routing for valid traffic management can trigger this alert. A recommended companion detection is monitoring for unauthorized IAM policy changes that could facilitate undue permissions, strengthening overall security posture.

