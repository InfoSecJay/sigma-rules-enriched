note: |
  ### Technical Context

  This Sigma rule detects the creation of a new network route in AWS, specifically through the `CreateRoute` event in the AWS CloudTrail logs. Attackers may use this tactic to redirect traffic, facilitate lateral movement, or exfiltrate data by manipulating the route tables to avoid detection. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005) and the technique is "Network Traffic Manipulation" (T1562.007). The primary telemetry sources include AWS CloudTrail logs with events specifically logging route changes under the EC2 service.

  If malicious, this behavior could significantly impact network security by allowing unauthorized data interception or redirection of traffic. This detection does NOT confirm malicious intent or activity on its own and requires contextual analysis to assess its legitimacy.

  ### Investigation Steps

  - **Check CloudTrail logs for the event:** Review AWS CloudTrail logs for `eventSource: ec2.amazonaws.com` and `eventName: CreateRoute`. Identify the time of the event and correlate with other activities in the account.

  - **Identify the IAM user or role responsible:** Look for the `userIdentity` field in the CloudTrail log corresponding to the `CreateRoute` event. Assess if this user or role typically performs such actions and if their behavior aligns with expected operations.

  - **Assess related network configurations:** Investigate associated VPC and route tables. Document existing routes and verify if the new route aligns with legitimate network architecture practices, such as new subnet requirements.

  - **Evaluate tags and source IP address:** Check for any tags associated with the resources created, including the source IP in the CloudTrail logs. Compare them with known administrative IP addresses to ascertain legitimate use cases.

  - **Identify previous routing activity:** Review for patterns in routing changes in logs over the last 14 days to identify any unusual frequency or timing of the route changes, which could indicate malicious activity.

  - **Consult documented changes and network topology:** Verify any recent infrastructure changes documented in service tickets or through approved change management processes. This will help differentiate expected administrative actions from potential compromise.

  ### Prioritization

  The alert has medium severity because any unauthorized routing changes could disrupt service continuity or be leveraged for malicious purposes. The relatively low likelihood of unauthorized route creation exists, but attackers often weaponize such changes when conducting more sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as the use of legitimate credentials by malicious actors, which may bypass this alert. Reliable detection requires proper CloudTrail logging configurations to capture all relevant events. Legitimate activities, such as the creation of new subnets or VPCs, may also result in triggering this alert. A related detection to enhance security coverage could monitor for `DeleteRoute` events to identify any subsequent attempts to revert or remove routes that could denote abnormal behavior.

