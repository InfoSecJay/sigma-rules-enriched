note: |
  ### Technical Context

  This Sigma rule detects the event of a new network route being added to a route table in AWS. The likely attacker objective could include altering traffic flow to illicitly access, disrupt, or exfiltrate data within the targeted VPC, thus potentially establishing a foothold within the network. The relevant MITRE ATT&CK tactic is "Defense Impairment," with the technique ID T1686.001, which encompasses actions that disrupt or manipulate established network routing paths.

  The primary telemetry source required for this detection is AWS CloudTrail logs, specifically looking for the `CreateRoute` event from the EC2 service. If the activity is malicious, it can lead to unauthorized communication paths, potentially allowing data theft or denial of service within the network. However, this detection does NOT confirm the intention behind the route addition; it merely highlights that a route has been created.

  ### Investigation Steps

  - **Verify the event details:** Review CloudTrail logs for the event `CreateRoute` (eventName) to confirm the action occurred, and check fields such as `userIdentity`, `sourceIPAddress`, and `responseElements`. Evaluate if the user or role performing the action is authorized.

  - **Catalog the route details:** Identify the added route's destination CIDR block and target gateway. Analyze whether these routes are legitimate by comparing them against expected routing configurations within the VPC.

  - **Cross-reference with other logs:** Check for ancillary events in CloudTrail, such as `CreateVpc` or `CreateSubnet`, which may indicate related, legitimate infrastructure changes. If these actions are present, they could legitimate the route addition.

  - **Identify potential malicious indicators:** Look for anomalous user accounts, especially those without explicit permissions or accounts accessing the AWS environment from unusual geographic locations. Suspicious patterns may indicate a possible account compromise.

  - **Document expected behaviors:** Recognize that new routes may be added during legitimate network expansions or infrastructure changes, such as new VPCs or subnets. Identify those specific cases to differentiate from potentially malicious alterations.

  ### Prioritization

  This alert is medium priority within an enterprise context because, while adding a route can be a legitimate administrative action, it could also signal a malicious attempt to reroute traffic for nefarious purposes. The impact of affecting system routes can be substantial, as it directly alters network access and data flow. Given the common exploitation of network configurations in AWS environments, vigilance is necessary.

  ### Blind Spots and Assumptions

  This detection may have limitations, as it relies solely on the presence of the `CreateRoute` event and does not account for other routing manipulations that may go undetected. Appropriate CloudTrail logging must be enabled for reliable detection, and oversight can occur if log retention is insufficient. Legitimate activities such as the setup of new VPCs or subnets may generate similar alerts. A related detection to consider is tracking `DeleteRoute` events, as routine manipulation of networking configurations often involves both creating and deleting routes.

