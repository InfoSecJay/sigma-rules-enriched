note: |
  ### Technical Context

  This Sigma rule detects the configuration of automatic email forwarding from Google Workspace accounts to external domains. This behavior could indicate malicious intent, such as data exfiltration or unauthorized access, as an adversary may set up forwarding to siphon sensitive information outside the organization. The relevant MITRE ATT&CK tactic is **Collection** (TA0011), specifically the technique of **Email Forwarding** (T1114.003).

  The primary telemetry source for this detection is Google Workspace login activity logs, specifically looking for logs with the event name `email_forwarding_out_of_domain`. If malicious, this behavior may lead to significant security risks, including data leaks of proprietary or sensitive information. However, it is important to note that this detection alone does not confirm unauthorized access, as legitimate users may also configure email forwarding for valid business purposes.

  ### Investigation Steps

  - **Review Google Workspace login activity logs**: Check for events with `protoPayload.metadata.event.eventName: 'email_forwarding_out_of_domain'` and correlate with user account change logs (Event ID related to Google Workspace Admin API) to identify changes made and their timestamps.

  - **Correlate user activities**: Investigate whether the user exhibited any suspicious behavior (e.g., unusual login times or from atypical locations) in combination with the email forwarding setup. Look for access times in the `login.googleapis.com` log.

  - **Assess user role and necessity**: Identify the user's role within the organization to determine if email forwarding is aligned with their job responsibilities. Legitimate use cases often involve roles in sales, HR, or IT support.

  - **Identify high-risk events**: Check if any accounts with forwarding set up have been involved in previous security incidents, particularly focusing on unusual activities around the time the forwarding was configured.

  - **Validate external domain destination**: Analyze the external domain to which emails are being forwarded. Look for any domains known for malicious activity or those not associated with company operations.

  - **Check for ongoing legitimacy**: Look in the Google Workspace Admin console for any return to default settings or changes post-alert generation. Continuous automatic forwarding without proper justification should be flagged for further investigation.

  ### Prioritization

  This alert should be treated with medium severity. While automatic forwarding can be part of legitimate operations, it often raises red flags regarding data leakage, especially if configured to unknown external domains. The likelihood of malicious abuse is notable given that exfiltration tactics are commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users inadvertently triggering the alert due to misconfigured settings. Reliable detection requires appropriate logging configuration in Google Workspace Admin to capture all necessary events. Additionally, while suspicious, email forwarding can sometimes be legitimate, especially for remote work arrangements. A companion detection might include tracking login anomalies, such as unusual geolocations or device types, to strengthen overall visibility into potential account compromise.

