note: |
  ### Technical Context

  This Sigma rule detects login attempts in Google Workspace that are flagged as potential attacks by government-backed threat actors, specifically when the login event emits a 'gov_attack_warning' event. The likely attacker objective is the unauthorized access to sensitive data or user accounts, aiming to carry out espionage or data exfiltration. This behavior aligns with the MITRE ATT&CK technique T1078: Valid Accounts, where adversaries use legitimate credentials to gain access.

  Primary telemetry sources include Google Cloud audit logs, specifically the `login.googleapis.com` service, and relevant log types are structured as `protoPayload`. If confirmed malicious, this activity could lead to privacy breaches, data leaks, or infiltration of organizational resources. Importantly, this detection does NOT confirm that an account has been compromised; it merely indicates anomalous access that warrants further investigation.

  ### Investigation Steps

  - **Review the login details:** Examine the `protoPayload.authenticationInfo.principalEmail` field for the user attempting to log in. Confirm if this user is legitimate and requires access. Malicious indicators include unfamiliar user accounts or accounts with unusual access permissions.

  - **Analyze login timestamps:** Check the `protoPayload.metadata.event.timestamp` to identify the timing of the login attempt. Compare this against the user's usual login patterns to identify anomalies. Regular business hours are expected, while off-hour logins may indicate suspicious activity.

  - **Investigate account activity:** Review recent activities associated with the account in the `admin.googleapis.com/admin/reports/v1/activity/users/all/applications/login` endpoint for unusual activity in the preceding weeks. Legitimate activity often includes scheduled access for system maintenance rather than multiple failed login attempts or sudden geo-location changes.

  - **Examine user geolocation:** Look into the `geoLocation` field for the login attempt. Logins originating from unexpected countries or regions can be high-confidence indicators of malicious activity. Evaluate if the IP addresses correspond to known safe locations for the user.

  - **Check user permissions and roles:** Validate the user's role by referencing the Google Admin Console. Ensure the account has the appropriate permissions aligned with their job function. Elevated permissions or roles in the attempt can be a red flag for unauthorized access.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on sensitive data access within Google Workspace. Given the ability of state-sponsored actors to exploit valid account credentials, the likelihood of malicious abuse is significant. Additionally, the trend of government-backed threat actors targeting enterprises makes this behavior concerning in an enterprise context.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not collect all necessary Google Workspace audit logs, which are crucial for accurate investigation. Legitimate activities, such as penetration testing or scheduled maintenance by an internal team, may trigger similar alerts if not properly coordinated. A related detection that strengthens coverage would be monitoring for unusual failed login attempts leading up to the 'gov_attack_warning' alerts, which can indicate credential stuffing or phishing attempts.

