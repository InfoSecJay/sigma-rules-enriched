note: |
  ### Technical Context

  This Sigma rule detects login attempts in Google Workspace flagged as potential attacks by government-backed threat actors. The behavior indicates an alarming attempt to access sensitive accounts, possibly resulting in data theft or unauthorized access to organizational resources. This detection aligns with the MITRE ATT&CK tactic of **Initial Access** (TA0001) and technique **Valid Accounts** (T1078).

  The primary telemetry source for this detection is Google Cloud Platform (GCP) logs, specifically the login activity logs from Google Workspace. The potential security impact of a successful malicious login includes data exfiltration, privilege escalation, or persistent access to the organization’s environment. It is essential to note that the detection of a "gov_attack_warning" does NOT confirm actual compromise; it is a preliminary alert indicating suspicious activity that requires further investigation.

  ### Investigation Steps

  - **Verify the alert timestamp and source IP:** Cross-reference the alert's timestamp with internal logs (e.g., Google Workspace Admin Logs) for any anomalous logins within the same time frame, focusing on Event IDs relevant to login attempts, such as `login.googleapis.com`.

  - **Assess account status:** Check if the account associated with the alert has had recent changes in permissions or role escalations using Google Admin console logs (Admin Logs > Login), looking for any changes related to the user account.

  - **Analyze login location and device:** Review the geographical origin of the login attempts. Use Google Cloud's access transparency logs to determine if the IP is from known regions. Note any legitimate users who typically log in from that location.

  - **Document legitimate access patterns:** Identify and note expected behavior for high-risk accounts that may log in frequently, establishing a baseline for typical access times, geographical locations, and devices used—search for `login.googleapis.com` logs to confirm normal patterns.

  - **Identify suspicious login attempts:** Focus on accounts experiencing multiple failed login attempts in conjunction with the “gov_attack_warning.” Investigate the correlation using the same GCP logs and evaluate based on frequency, timing, and IP addresses.

  - **Check for additional context or enablers:** Look for other relevant activities in the Google Workspace Admin Audit logs that may indicate prior suspicious behavior, such as data exports or device management engagements following the login.

  ### Prioritization

  This alert should be treated with high priority due to the potential impact on sensitive systems and data. The likelihood of malicious exploitation is significant, given the association with government-backed actors, who commonly target organizations for espionage or data theft.

  ### Blind Spots and Assumptions

  Detection may be limited by the configurations of logging in Google Workspace; ensuring comprehensive logging is crucial for accurate detection. Legitimate activities, such as scheduled login attempts by remote staff or service account activities, can trigger this alert. Companion detections, like monitoring for unusual account activity during the same time frame (e.g., mass access of files or changes in user settings), can enhance overall security visibility.

