note: |
  ### Technical Context

  This rule detects suspicious login activities within Google Workspace, particularly logins flagged as "suspicious" by Google. The behaviors being monitored include the use of less secure applications, unexpected login attempts, or programmatic logins that deviate from typical user patterns. These activities suggest potential unauthorized access or account compromise attempts, with the aim to exploit user accounts or escalate privileges.

  The relevant MITRE ATT&CK tactic is **Initial Access** (TA0001) and the technique is **Valid Accounts** (T1078.004). The primary telemetry source for this detection is Google Cloud Platform's audit logs, specifically the Google Workspace login logs. If the detected activity is malicious, it could lead to unauthorized data access or disruption of services.

  It is important to note that this detection does NOT confirm that an account compromise has occurred on its own. Legitimate activity could also generate similar alerts, indicating the need for further investigation.

  ### Investigation Steps

  - **Review the login timestamps and source IP addresses:** Check Audit logs (API: `bigquery.googleapis.com`, Log type: `GCP_Audit`) for suspicious activity patterns, particularly logins from unusual geographic locations or at odd hours. Benign login attempts typically come from recognized and consistent IP addresses corresponding to the user's location.

  - **Analyze user account activity:** Examine the Google Admin console for any recent changes or anomalies in account settings, like password resets or 2FA changes, following telemetry from Google Workspace's Activity Reports (Endpoint: `/admin/reports/v1/userUsageReport`). Malicious indicators include changes made without user authorization or on accounts inactive for extended periods.

  - **Correlate with user behavior reports:** Use the Google Workspace activity report to find normal login patterns for the affected user. Authorized users will exhibit consistent login times and devices, while suspicious accounts may show multiple failed login attempts or deviations from established behaviors.

  - **Inspect for concurrent logins from different locations:** Utilize login event logs for simultaneous access from disparate locations that exceed normal behavior patterns (Log type: `GCP_Audit`, Event fields: `protoPayload.serviceName`, `protoPayload.metadata.event.eventName`). Multiple logins from different geographic regions can indicate credential theft or account sharing.

  - **Check for integrations with less secure applications:** Determine if any recent application integrations with Google Workspace were installed that are classified as less secure (Documentation: `suspicious_login_less_secure_app`). Benign use typically involves well-known business applications, while malicious uses often include unknown or newly enabled applications.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on user accounts and company data. The likelihood of malicious exploitation is moderate, as adversaries frequently target valid accounts to gain unauthorized access. This behavior is already known to be weaponized in various phishing and credential stuffing campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false positives from legitimate third-party apps that fall under "less secure" classifications. Required log sources must ensure comprehensive logging of all authentication attempts to capture relevant events reliably. Legitimate activities that may trigger this alert include users accessing their accounts from different locations due to travel or remote work setups. A related detection that could strengthen coverage is monitoring for abnormal volume spikes in login failures (MITRE ID: T1078.001).

