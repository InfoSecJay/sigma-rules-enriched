note: |
  ### Technical Context

  This Sigma rule detects suspicious login activity in Google Workspace, specifically focusing on logins flagged by Google as potentially malicious. The behavior may indicate an adversary's attempt to gain unauthorized access, either through compromised credentials, less secure apps, or programmatic access methods. This aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and the technique for Valid Accounts (T1078.004).

  The primary telemetry source for this detection is Google Cloud’s audit logging, particularly the login activity logs. If these logins are indeed malicious, they could lead to data breaches or unauthorized actions within organizational resources. However, it is essential to note that this detection alone does not confirm that the account was compromised; further investigation is necessary to establish intent.

  ### Investigation Steps

  - **Check for additional context in logs**: Review the Google Workspace login activity audit logs (Event types: `suspicious_login`, `suspicious_login_less_secure_app`, `suspicious_programmatic_login`) for the user account in question. Compare timestamps and IP addresses to known good logins.

  - **Verify user role and asset criticality**: Determine the role of the affected user (e.g., admin, regular user) and the sensitivity of their access level. Consider the impact of suspicious activity based on their permissions and assets they have access to.

  - **Identify high-confidence malicious indicators**: Look for unusual geographic locations or anomalous IP addresses in the login attempts. Cross-reference with known malicious IP databases to assess risk.

  - **Establish a baseline for legitimate activity**: Analyze historical login patterns for the affected account to identify typical login behavior (e.g., usual IP ranges and login times) and compare it against the suspicious entries.

  - **Evaluate for previous security incidents**: Check for any prior incidents reported against the user account or related to the network segment, which may provide context for this suspicious behavior.

  - **Monitor subsequent activities post-login**: If the login is verified as suspicious, monitor for unusual actions taken after the login event, such as changes to account settings or unauthorized file access.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized access to sensitive organizational resources. The likelihood of malicious actors exploiting compromised credentials is significant, especially considering that suspicious login activities are commonly weaponized in attacks. Continuously monitoring such behavior is critical to mitigate risk.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate users accessing accounts from atypical locations due to remote work or travel, which could trigger false positives. Reliable detection relies on comprehensive logging configurations within Google Workspace. Additionally, this detection does not account for lateral movements or account misuse within the network post-login. Monitoring for related detections, such as unusual account activity following a suspicious login, can enhance overall coverage.

