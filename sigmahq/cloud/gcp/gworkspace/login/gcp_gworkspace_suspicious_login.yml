note: |
  ### Technical Context

  This rule detects suspicious login activity within Google Workspace, specifically targeting logins identified as potentially harmful by Google. The behaviors include attempts to log in via less secure applications, general suspicious logins, and programmatic logins that are categorized as suspicious. The likely attacker objective is to gain unauthorized access to sensitive information or resources within the organization's Google Workspace.

  This detection relates to the MITRE ATT&CK framework, particularly the tactic of Initial Access and the technique T1078.004 (Valid Accounts). The primary telemetry source for this detection includes Google Cloud logging (GCP) focused on login activities with specific event types. If malicious, the security impact could be significant, potentially leading to data breaches or unauthorized access to sensitive organizational data. However, it is important to note that this detection does NOT confirm that malicious activity has occurred; it merely indicates that a suspicious login attempt has been flagged.

  ### Investigation Steps

  - **Review event details in Google Cloud Logs:** Check `protoPayload.metadata` for event details like `eventName` which can be 'suspicious_login', 'suspicious_login_less_secure_app', or 'suspicious_programmatic_login'. Ensure you validate the user account involved is legitimate and assess its normal login patterns.

  - **Verify user account activity:** Utilize Google Workspace Admin Reports API to retrieve previous successful and failed login attempts for the affected user. Investigate for any anomalies in geolocation, IP addresses, and times of access compared to the user’s normal access patterns.

  - **Cross-reference user roles:** Identify the user’s roles and permissions in Google Workspace to assess the potential impact of a compromised account. Higher privileges increase the severity of the alert.

  - **Analyze device details for logins:** Check for device details in the logs such as browser types or device IDs to determine if any unusual devices have accessed the account. Any use of historically unrecognized or flagged devices may indicate malicious activity.

  - **Correlate with other alerts:** Look for concurrent alerts related to account access, such as account creation or permission changes in Google Workspace. Multiple indicators may signify an ongoing attack or series of compromises.

  - **Assess legitimate behavior:** Document and review any known business applications or projects that require less secure app access and confirm whether these logins are expected and documented as part of regular business operations.

  ### Prioritization

  The alert severity is medium due to the moderate impact associated with a compromised Google Workspace account, especially if it has access to sensitive data. However, the likelihood of malicious abuse is significant given that the login behavior is explicitly classified as suspicious. Such behaviors can often be weaponized by adversaries to conduct further attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate logins being flagged as suspicious due to the use of less secure apps or unusual access locations. Reliable detection requires proper Google Cloud logging configurations to ensure all relevant events are captured. Additionally, normal user behavior, such as using less secure apps as part of legitimate workflows, may trigger the alert. A related detection that strengthens coverage includes monitoring for unusual file sharing or changes in Google Drive, which may indicate further malicious activity tied to the suspicious login.

