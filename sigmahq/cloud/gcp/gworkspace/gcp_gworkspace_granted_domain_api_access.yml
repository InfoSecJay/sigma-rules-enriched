note: |
  ### Technical Context

  This rule detects when a service account in Google Workspace is granted domain authority through the API, indicating potential unauthorized privilege escalation. The likely attacker objective could be to gain elevated access to manipulate or extract sensitive data across the domain. This activity corresponds to the MITRE ATT&CK technique "Application Layer Protocol" (T1098). Primary telemetry sources include Google Cloud Logging, specifically the G Suite Admin audit logs for events related to API client access.

  If malicious, this behavior could allow an adversary to perform automated actions across user accounts and resources, posing a significant risk to the security posture of the organization. However, this detection does NOT confirm that the access was malicious; it merely indicates that a service account was granted elevated permissions, which could also be part of legitimate administrative activity.

  ### Investigation Steps

  - **Verify the source account:**
    Review the user associated with the service account (look for user ID or email in logs) to confirm if the request originated from a known, authorized administrator. Check for unusual login timestamps (Audit log events).

  - **Check the scope of domain access:**
    Inspect the authorized API client settings to determine which scopes were granted. Legitimate requests typically involve limited access for specific API functions; excessive or sensitive scope requests may indicate misuse.

  - **Analyze recent user and group activity:**
    Review changes in user and group permissions made before and after this event (Audit log Event IDs 2000-2015). Suspicious alterations made around the same time may signify malicious intent.

  - **Identify service account usage patterns:**
    Look for any unusual or unexpected API calls from the service account following the access grant (Google Cloud API logs). Indicators of compromise include access to sensitive resources not typically used by the service account.

  - **Examine system impact:**
    Evaluate the criticality of resources accessed by the service account after authorization. If the service account accesses sensitive systems or performs actions that could result in data exfiltration, prioritize further investigation.

  ### Prioritization

  This alert carries medium severity due to the potential for privilege escalation within Google Workspace. While the impact may vary based on the criticality of the service account, the likelihood of malicious use remains significant since this behavior may enable attackers to escalate their access and perform harmful activities.

  ### Blind Spots and Assumptions

  Detection may be limited by service accounts with legitimate administrative roles, leading to false positives if not properly contextualized. Comprehensive logging must be enabled for Google Cloud to capture G Suite Admin audit logs reliably. Legitimate administrative tasks, such as setting up a new application with required access, may trigger this alert. Integrating detections for unusual service account API usage could strengthen event correlation and alerting capabilities.

