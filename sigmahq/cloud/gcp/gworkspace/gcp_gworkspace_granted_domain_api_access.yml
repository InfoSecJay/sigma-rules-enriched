note: |
  ### Technical Context
  This detection rule identifies when a service account in Google Workspace is granted domain authority through API access. Such activities can signal attempts to abuse administrative privileges, possibly by malicious insiders or external actors gaining access to sensitive data and system controls. The attacker’s objective may include establishing persistent access to the environment, escalating privileges, or manipulating configurations to leverage domain-level capabilities for further exploitation.

  The relevant MITRE ATT&CK tactics associated with this rule include **Persistence** (TA0003) and **Privilege Escalation** (TA0004). Specifically, it maps to technique **T1098: Account Manipulation**, which involves changing account status or permissions to increase an attacker's control over an environment.

  Primary data sources that hold the relevant logs for this rule include Google Cloud Platform's audit logs, specifically the Google Workspace admin logs, which track significant administrative actions within the Google Workspace environment.

  ### Investigation Steps
  - **Review Audit Logs**: Examine the Google Workspace admin audit logs to identify the specific service account granted domain authority. Look for timestamps and user context for additional insights.
  - **Analyze Permissions**: Assess the permissions associated with the granted domain authority to determine whether they align with expected service account functionality and organizational policies.
  - **Investigate Service Accounts**: Cross-reference the activity with the list of active service accounts to ensure there is no suspicious or unauthorized account accessing domain-level permissions.
  - **Monitor for Follow-Up Actions**: After establishing that domain authority was granted, check for any subsequent activities that may indicate malicious behavior, such as configuration changes, access to sensitive data, or interactions with other API resources.

  ### Prioritization
  The severity of this alert is medium, as granting domain authority can significantly impact the security posture of the organization, potentially allowing an attacker to gain extensive control over the environment. However, the likelihood of misuse depends on the context and existing security measures in place.

  ### Blind Spots and Assumptions
  This detection rule may have gaps if the logging configuration for Google Workspace activities is incomplete or not properly set to capture all relevant events. The assumption made is that all service accounts should adhere to strict usage policies, and any deviation should be flagged. Additionally, comprehensive audit logging must be enabled in Google Cloud to ensure that all relevant events are recorded, or the detection may not function as intended.

