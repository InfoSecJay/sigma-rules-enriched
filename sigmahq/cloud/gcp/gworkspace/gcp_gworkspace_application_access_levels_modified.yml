title: Google Workspace Application Access Level Modified
id: 22f2fb54-5312-435d-852f-7c74f81684ca
status: test
description: |
  Detects when an access level is changed for a Google workspace application.
  An access level is part of BeyondCorp Enterprise which is Google Workspace's way of enforcing Zero Trust model.
  An adversary would be able to remove access levels to gain easier access to Google workspace resources.
references:
- https://developers.google.com/admin-sdk/reports/v1/appendix/activity/admin-application-settings
- https://support.google.com/a/answer/9261439
author: Bryan Lim
date: 2024-01-12
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: gcp
  service: google_workspace.admin
detection:
  selection:
    eventService: 'admin.googleapis.com'
    eventName: 'CHANGE_APPLICATION_SETTING'
    setting_name|startswith: 'ContextAwareAccess'
  condition: selection
falsepositives:
- Legitimate administrative activities changing the access levels for an 
  application
level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes to access levels for Google Workspace applications, specifically when settings related to Context-Aware Access are modified. The likely objective of an attacker triggering this alert would be to lower security barriers, enabling easier access to sensitive resources within Google Workspace, thereby facilitating data theft or unauthorized actions. This behavior aligns with the MITRE ATT&CK technique for Privilege Escalation (T1098.003) under the tactic of Persistence.

  The primary telemetry source for this detection is the Google Admin Activity API, specifically events logged under `admin.googleapis.com` with the `CHANGE_APPLICATION_SETTING` event name. Malicious modifications of access levels could lead to severe security impacts, allowing attackers greater access without proper authorization. Importantly, this detection does not confirm malicious intent or impact on its own, as legitimate administrative actions may produce similar log entries.

  ### Investigation Steps

  - **Review change history for the affected application: **Check the Google Workspace Admin Activity log (Event Name: `CHANGE_APPLICATION_SETTING`) for related entries. Verify the user account making the change to identify if it belongs to authorized administrative personnel versus unexpected sources, such as service accounts or newly created accounts.

  - **Identify the specific change made: **Look for the `setting_name` attribute in the event log entries where 'ContextAwareAccess' modifications are indicated. Assess the nature of the change; legitimate changes should align with organizational policy rather than indicate an unusual drop in access levels.

  - **Examine user role context: **Profile the impacted account to determine if the user holds a legitimate administrative role (e.g., `Super Admin`). Compare against documented roles within Google Workspace to rule out unauthorized privilege escalation.

  - **Cross-reference recent user activity: **Utilize the Admin Activity logs to find other actions by the same user around the time of the access level modification. Look for patterns, such as rapid changes or changes to multiple applications, which may indicate a potential compromise.

  - **Check for concurrent alerts or anomalies: **Investigate if other alert conditions have been triggered around the same timeframe, such as suspicious login activity (Google Workspace logins, Event ID: `USER_LOGIN`). This could indicate a broader threat or coordinated attack.

  ### Prioritization

  This alert has medium severity due to the potential impact on system security and the possibility of malicious abuse. Changes to access levels related to Context-Aware Access can significantly lower defenses, making this a common tactic employed by adversaries in various forms of attacks seeking unauthorized access.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate user actions to trigger this alert, particularly during routine administrative maintenance. Reliably detecting such changes requires configuration to ensure comprehensive logging within Google Workspace. Additionally, user account modifications or role changes could also evoke this alert without malicious intent. A related detection to consider that enhances coverage includes monitoring failed login attempts or unusual access patterns (Event Name: `USER_LOGIN`), which may indicate a compromised account contextually tied to these changes.

