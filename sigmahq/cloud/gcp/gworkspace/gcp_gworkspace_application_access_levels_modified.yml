title: Google Workspace Application Access Level Modified
id: 22f2fb54-5312-435d-852f-7c74f81684ca
status: test
description: |
  Detects when an access level is changed for a Google workspace application.
  An access level is part of BeyondCorp Enterprise which is Google Workspace's way of enforcing Zero Trust model.
  An adversary would be able to remove access levels to gain easier access to Google workspace resources.
references:
- https://developers.google.com/admin-sdk/reports/v1/appendix/activity/admin-application-settings
- https://support.google.com/a/answer/9261439
author: Bryan Lim
date: 2024-01-12
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: gcp
  service: google_workspace.admin
detection:
  selection:
    eventService: 'admin.googleapis.com'
    eventName: 'CHANGE_APPLICATION_SETTING'
    setting_name|startswith: 'ContextAwareAccess'
  condition: selection
falsepositives:
- Legitimate administrative activities changing the access levels for an application
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects changes to access levels for applications within Google Workspace, specifically focusing on the "ContextAwareAccess" settings. The likely objective of an attacker modifying these settings is to weaken access controls, thereby facilitating unauthorized access to sensitive resources. This activity aligns with the MITRE ATT&CK tactic of Persistence and technique T1098.003 (Application Layer Protocol).

  The primary telemetry source is the Google Workspace Admin Activity logs, specifically events logged under `admin.googleapis.com` with the event name `CHANGE_APPLICATION_SETTING`. If malicious, the security impact includes elevated privileges for unauthorized users, potentially exposing sensitive data. It's crucial to note that this detection alone does not confirm malicious intent; legitimate administrative activities can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review event details:** Examine the Google Workspace Admin Activity logs for EventName: `CHANGE_APPLICATION_SETTING`. Focus on the fields `email` (administrator making the change), `timestamp`, and affected `setting_name`. Verify whether the changes align with known administrative functions or user requests.

  - **Assess administrative privileges:** Check if the user account modifying the access level has appropriate administrative privileges. Compare their access role against organizational policy to determine if a legitimate user could perform this action.

  - **Evaluate change frequency:** Determine how often the access levels for applications have been modified. Frequent or sudden changes might indicate a compromised account or misconfiguration. Cross-check with the user group and expected change logs.

  - **Identify high-confidence malicious indicators:** Investigate if the changes coincide with any known attack patterns or indications of network compromise. Specifically, look for unusual user activity leading up to the change, such as multiple login attempts or access from atypical geographic locations.

  - **Review legitimate use cases:** Document typical scenarios where administrators modify access levels, such as for new users or applications. Establish thresholds or triggers for expected changes.

  - **Monitor related activities:** Investigate subsequent activity in Google Workspace that utilizes the modified application settings, specifically looking for unauthorized access attempts or data exfiltration behaviors in the Admin Activity logs.

  ---

  ### Prioritization

  This alert is considered medium severity due to the potential impact on data confidentiality and unauthorized access. The likelihood of malicious abuse is moderate, especially if the change is made by an unexpected or unauthorized user. Such behavior can represent a potential entry point for further exploitation and lateral movement within the organization.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative activities triggering the alert, which requires context to interpret correctly. Ensuring comprehensive logging configurations for Google Workspace Admin Activity is crucial for reliable detection. Legitimate activities, such as application audits or policy updates, may also result in similar alerts. A related detection to strengthen coverage includes tracking failed login attempts or unusual access patterns for administrative accounts, which can help correlate potential malicious intent.

