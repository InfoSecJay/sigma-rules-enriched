title: Google Workspace Application Access Level Modified
id: 22f2fb54-5312-435d-852f-7c74f81684ca
status: test
description: |
  Detects when an access level is changed for a Google workspace application.
  An access level is part of BeyondCorp Enterprise which is Google Workspace's way of enforcing Zero Trust model.
  An adversary would be able to remove access levels to gain easier access to Google workspace resources.
references:
- https://developers.google.com/admin-sdk/reports/v1/appendix/activity/admin-application-settings
- https://support.google.com/a/answer/9261439
author: Bryan Lim
date: 2024-01-12
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: gcp
  service: google_workspace.admin
detection:
  selection:
    eventService: 'admin.googleapis.com'
    eventName: 'CHANGE_APPLICATION_SETTING'
    setting_name|startswith: 'ContextAwareAccess'
  condition: selection
falsepositives:
- Legitimate administrative activities changing the access levels for an application
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to application access levels within Google Workspace, specifically changes related to Context-Aware Access settings. These settings are part of Google's BeyondCorp Enterprise framework, designed to enforce a Zero Trust security model. By altering access levels, an attacker could potentially weaken security controls, allowing unauthorized access to sensitive Google Workspace resources and data.

  The primary threat scenario involves an insider threat or an external attacker gaining privileges, either through stolen credentials or administrative account compromise, to manipulate access settings. This could lead to unauthorized access to critical applications and data, representing a significant operational risk to the organization.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003)
  - **Privilege Escalation** (TA0004)
  - **User Execution** (T1098.003) - specifically regarding manipulation of application access settings.

  Primary data sources for this detection include Google Workspace admin logs, which can provide valuable insights into administrative activities related to setting changes.

  ### Investigation Steps
  - **Review Admin Activity Logs:** Collect and analyze Google Workspace admin activity logs to identify the user account that made the changes, along with timestamps and prior access levels.

  - **Audit User Roles:** Verify the roles and permissions of the user accounts involved in the access level modification. Look for any signs of elevation in privileges that may suggest unauthorized access.

  - **Correlation with Other Alerts:** Check for any related security alerts, such as unusual login activity or changes made by service accounts, which might indicate broader malicious behavior.

  - **Investigate Contextual Factors:** Assess whether the changes align with any approved administrative activities, by cross-referencing with change management records or scheduled maintenance.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized access to sensitive resources, coupled with the fact that such modifications can be indicative of wider security breaches. The likelihood of exploitation is heightened if administrative access is compromised.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the lack of insight into legitimate administrative changes that could occur amidst these alerts, leading to possible false positives. The detection logic assumes that changes made through legitimate administrative paths are still subject to scrutiny, but may not account for a compromised admin account’s actions. Additionally, adequate logging of admin actions must be enabled in Google Workspace for the alert to function effectively, including proper configuration of the Google Cloud Audit Logs to capture relevant events.

