note: |
  ### Technical Context

  This Sigma rule detects the removal of applications from Google Workspace, specifically events tagged as `REMOVE_APPLICATION` and `REMOVE_APPLICATION_FROM_WHITELIST`. An attacker may aim to disrupt organizational operations or hide malicious activities by removing monitoring or security applications. This behavior is associated with the MITRE ATT&CK tactic "Impact" (TA0040) and techniques like "Data Destruction" (T1485) and "Application Layer DDoS" (T1498).

  Primary telemetry sources include Google Workspace Admin logs, focusing on the `admin.googleapis.com` log type. If the removal is unauthorized, it could compromise security controls, potentially leading to data exfiltration or service disruption. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate removals may occur in response to policy changes or application lifecycle management.

  ### Investigation Steps

  - **Verify logged events:** Cross-check recent logs for Event Names `REMOVE_APPLICATION` and `REMOVE_APPLICATION_FROM_WHITELIST` within Google Workspace Audit logs (accessible via the Google Cloud Platform console).

  - **Identify user activities:** Investigate the user account associated with the event. Look for previous actions performed by the account in the last 30 days. Legitimate admins often show a history of app management activity in the Google Admin console.

  - **Check role permissions:** Review the permissions of the user who performed the application removal. Use the `Admin SDK` to verify if they have "Super Admin" or "Application Management" roles, which are needed for legitimate removals.

  - **Look for anomalous behavior:** Identify if there were any immediate follow-up actions post-removal. Be alert for accounts attempting to install unauthorized applications or making rapid subsequent changes to other settings.

  - **Assess logs for unrelated removals:** Review if multiple applications were removed in a short timeframe, suggesting potential malicious user behavior or an unauthorized admin-level breach.

  - **Determine organizational context:** Confirm if the application removed aligns with expected behaviors. If an essential security application (like a SIEM integration) is missing, it may indicate malicious intent as opposed to routine maintenance.

  ### Prioritization

  The alert has medium severity due to its potential impact on security infrastructure. The likelihood of malicious abuse is moderate, as unauthorized removals can disrupt essential services or security monitoring. This behavior is weaponized against organizations by adversaries aiming to obscure their actions or destabilize operations.

  ### Blind Spots and Assumptions

  Detection may be limited if proper audit logging is not configured for Google Workspace; this is essential for reliable visibility into changes. Legitimate organizational changes, such as app updates or replacements, may also trigger this alert. A related detection to consider is auditing application installations that follow application removals, as this can indicate a potential compromise such as installing rogue software post-removal.

