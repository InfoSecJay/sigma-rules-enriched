note: |
  ### Technical Context
  This detection rule identifies events where an application has been removed from Google Workspace. Such activity may indicate administrative tasks performed by legitimate system administrators; however, it can also signify malicious actions taken by threat actors aiming to disrupt operations, maintain persistence, or conceal their activities. By removing key applications, an attacker can impede security controls, access valuable resources, or execute further attacks under the guise of legitimate activities.

  The relevant MITRE ATT&CK tactics include **Impact** (TA0040), which encompasses techniques that can affect the integrity, availability, or confidentiality of organizational systems. Specifically, the technique **Application Layer Protocol - 15 (T1480)** may be relevant, as attackers could leverage application removals to sabotage cloud-based services or data.

  The primary log sources for evidence include Google Cloud audit logs, specifically those related to admin activities within Google Workspace. These logs will contain detailed entries that include the actions performed, the user initiating the action, timestamps, and affected applications.

  ### Investigation Steps
  - **Review Audit Logs**: Examine Google Workspace admin audit logs to identify the specific application removal events, including the initiating user and timestamps.
  - **Identify User Context**: Determine if the user performing the removal has the necessary permissions and whether this activity aligns with their expected role within the organization.
  - **Check for Unusual Patterns**: Analyze the timeline of other admin actions leading up to the removal to identify potentially irregular patterns or correlations with other security events.
  - **Assess Application Dependencies**: Identify any critical applications that were removed and assess the potential impact on business operations or security monitoring capabilities.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact on the organization’s security posture, especially if key applications are removed by unauthorized users. The likelihood of abuse or error in a cloud environment warrants timely investigation.

  ### Blind Spots and Assumptions
  This detection rule primarily relies on audit logging from Google Workspace, which assumes that all relevant log retention policies are correctly configured and operational. A potential gap in coverage exists if logs are not captured for all relevant administrative actions, or if abusive actions are masked under legitimate administrative processes. Moreover, the detection logic assumes that application removals are not part of routine administrative maintenance performed by authorized personnel.

