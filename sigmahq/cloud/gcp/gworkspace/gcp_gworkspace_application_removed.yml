  ---

  ### Technical Context

  This Sigma rule detects the removal of applications from Google Workspace, specifically through events logged as `REMOVE_APPLICATION` and `REMOVE_APPLICATION_FROM_WHITELIST`. The likely attacker objective is to disrupt services, targeting business continuity or data integrity by tampering with essential applications in the Google Workspace environment. This behavior aligns with the MITRE ATT&CK tactic of "Impact" (TA0040) and the technique "Service Stop" (T1499).

  Primary telemetry sources include Google Workspace Admin logs, particularly audit logs related to application management. If malicious, this activity can disrupt business operations, potentially leading to data loss or unavailability of critical services. Importantly, this detection does NOT confirm malicious intent on its own; it may also be the result of legitimate administrative actions.

  ---

  ### Investigation Steps

  - **Check Audit Logs for Authoritative Changes:** Review Google Workspace Admin Audit logs for Event ID related to `REMOVE_APPLICATION` or `REMOVE_APPLICATION_FROM_WHITELIST`, focusing on the `initiator` field to identify the user who performed the action.

  - **Verify User Accountability:** Determine if the user who initiated the application removal is an authorized administrator. Legitimate administrators should have roles reflecting necessary permissions within the `User Roles` and `Admin Roles` sections of Google Workspace administration.

  - **Correlate with Recent Changes:** Investigate related changes in the Admin Activity logs for any recent actions by the same user. Review for suspicious activity such as unauthorized role changes or additional application removals.

  - **Identify Critical Applications Removed:** Cross-reference the removed applications against a list of business-critical applications detailed in collaboration tools. Look for any unauthorized applications that could impact operational workflows.

  - **Examine Application Functionality Post-Removal:** Assess the operational status of the organization’s Google Workspace applications after the removal event to identify any disruptions that signal a potential compromise.

  ---

  ### Prioritization

  This alert is considered medium severity due to the potential impact that removal of critical applications can have on business operations. While legitimate admin activities can trigger this alert, the likelihood of malicious actors abusing this capability is significant, especially in targeted attacks or insider threats.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that can trigger false positives, such as routine application maintenance. Comprehensive logging from Google Workspace is required for effective detection, especially when monitoring changes made by privileged users. Additionally, legitimate third-party application removals through automated systems may also trigger this alert. Related detection for unauthorized changes in user permissions or role escalations can enhance visibility of potential misuse.

