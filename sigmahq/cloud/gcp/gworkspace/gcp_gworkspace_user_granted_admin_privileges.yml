note: |
  ### Technical Context

  This Sigma rule detects when a user is granted admin privileges within Google Workspace. Such behavior may indicate a potential escalation of privileges, which attackers might exploit to gain enhanced access and control over the Google Workspace environment. The relevant MITRE ATT&CK tactic for this behavior is Privilege Escalation (T1068) and its associated technique is Grant Privileges (T1098).

  The primary telemetry source for this detection is Google Workspace admin audit logs, specifically events associated with privilege modifications. If malicious, the granting of admin privileges could allow an unauthorized user to manipulate settings, access sensitive information, or conduct further attacks. This detection does NOT prove malicious intent or guarantee that the admin access was improperly assigned; legitimate administrative activities may also generate this alert.

  ### Investigation Steps

  - **Review Google Workspace Admin Audit Logs:** Check logs for Event Name "GRANT_ADMIN_PRIVILEGE" or "GRANT_DELEGATED_ADMIN_PRIVILEGES" from the Google Workspace Admin SDK. Look for changes to user role assignments that were not part of a scheduled or documented organization process.

  - **Identify the User's Audit History:** Look into the specific user account that was granted admin privileges. Review Google Workspace logs for any suspicious activity before the privilege grant, such as excessive failed login attempts or unusual account access patterns related to Event ID "login".

  - **Validate Administrative Change Documentation:** Confirm whether this change aligns with expected organizational policies by checking internal communication records (like emails or ticketing systems) for the justification of granting such privileges. Legitimate changes will typically have documentation linked to a user request or an organizational change management procedure.

  - **Examine the User's Role Context:** Evaluate the criticality of the affected user account based on their role. Regular users should not gain admin rights without substantial reason; changes in roles for high-privilege accounts should be thoroughly backed by justification.

  - **Correlate with Known Abuse Patterns:** Check for any related alerts or previous similar privilege escalation events in the timeframe surrounding this alert. Look for patterns that suggest coordinated abusive behavior, such as multiple users granted admin privileges around the same time.

  ### Prioritization

  This alert is rated as medium severity. The impact could be significant if the user granted admin privileges is not authorized, especially on critical systems within the Google Workspace environment. The likelihood of malicious abuse is moderate, as the granting of such privileges is a common tactic used by attackers for persistence and control.

  ### Blind Spots and Assumptions

  This detection may be limited by the context of legitimate administrative processes, where authorized personnel can grant admin rights. If audit logging is not configured properly or if there is a lack of visibility into user behavior prior to the privilege elevation, detection may be incomplete. Legitimate activities that might trigger this alert include routine privilege changes by IT staff for onboarding/offboarding purposes. A related detection that strengthens coverage would be to monitor for "Remove Admin Privileges" events to determine if there are atypical patterns of privilege toggling, which may indicate malicious intent.

