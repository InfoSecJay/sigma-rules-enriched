note: |
  ### Technical Context
  This detection rule identifies instances where a user within Google Workspace is granted administrative privileges, specifically through the event names "GRANT_DELEGATED_ADMIN_PRIVILEGES" and "GRANT_ADMIN_PRIVILEGE." Gaining admin rights can enable an attacker to manipulate user accounts, access sensitive data, and establish long-term persistence within the organization. The rule acts as a safeguard to alert security teams to potential unauthorized privilege escalations or misconfigurations that could lead to insecure environments.

  In terms of MITRE ATT&CK, this activity falls under the "Privilege Escalation" tactic, specifically associated with technique T1098, which is related to granting elevated permissions that could compromise security integrity. Monitoring these changes is vital for detecting rogue administration or compromised accounts that might be exploited by adversaries.

  The primary data source for this detection is Google Cloud Platform (GCP) audit logs related to Google Workspace, specifically those that log administrative changes and user settings. Utilizing these logs enables the detection of abnormal modifications to user roles that could signify malicious activity or human error.

  ### Investigation Steps
  - **Review Audit Logs:** Analyze GCP audit logs for entries corresponding to the "GRANT_ADMIN_PRIVILEGE" and "GRANT_DELEGATED_ADMIN_PRIVILEGES" events to verify the context of the privilege escalation.
  - **Identify User Context:** Determine the user account that received the elevated privileges and evaluate its activity history for any suspicious behavior or previous alerts related to the account.
  - **Check for Justification:** Investigate whether the privilege changes were authorized or documented as part of administrative processes. Look for any recent access requests or changes that would support the legitimacy of the granted privileges.
  - **Monitor Related Activities:** Conduct a broader analysis of user actions post-privilege elevation, such as modifications to user accounts, access to sensitive data, or changes within organizational policies that could indicate misuse.

  ### Prioritization
  The severity of this alert is medium due to the balance of threat impact and likelihood. While granting admin rights can significantly impact the security posture of the organization, legitimate administrative changes may frequently occur. However, it is essential to monitor these events closely as they could indicate potential abuse of governance and account integrity.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the filtering of legitimate administrative actions, as system administrators may routinely modify user privileges without malicious intent. The detection logic assumes that any granted admin privileges should be scrutinized and that appropriate audit logging is enabled for Google Workspace. Ensuring comprehensive logs are captured and configurations set for audit trails is essential for the rule's effectiveness, making it crucial for organizations to establish baseline behaviors for administrative changes.

