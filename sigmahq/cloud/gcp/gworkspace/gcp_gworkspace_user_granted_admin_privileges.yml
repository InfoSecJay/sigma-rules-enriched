  ---

  ### Technical Context

  This Sigma rule detects instances where a Google Workspace user is granted admin privileges, specifically through the events "GRANT_DELEGATED_ADMIN_PRIVILEGES" and "GRANT_ADMIN_PRIVILEGE". The primary goal for an attacker would be to escalate their privileges within the organization, thus allowing them to execute further malicious activities with elevated permissions. This behavior corresponds to the MITRE ATT&CK tactic of Privilege Escalation, particularly technique T1098.

  The primary telemetry source for this detection is Google Cloud Platform (GCP) logs, specifically audit logs for Google Workspace administrative actions. If malicious, the elevation of privileges can lead to unauthorized access to sensitive organizational data and potentially facilitate lateral movement within the environment. It is crucial to note that this detection alone does not confirm malicious intent; legitimate administrative activities by authorized personnel may also trigger this rule.

  ---

  ### Investigation Steps

  - **Review event details:** Check for Security Event service logs indicating "GRANT_DELEGATED_ADMIN_PRIVILEGES" or "GRANT_ADMIN_PRIVILEGE" in the GCP Logs Explorer (logName: "admin.googleapis.com"). Confirm who granted the privileges, to whom, and the timestamp of the event.

  - **Identify user account role:** Analyze user account details (user email, organizational unit) associated with the privilege escalation. Compare against a baseline of expected admin accounts to detect any anomalies.

  - **Trace back to user activity:** Examine prior user actions leading to this event in the Admin Activity Reports (API endpoint: reports.v1.userUsageReport). Review if this user had a history of escalated privileges or a record of suspicious login patterns.

  - **Determine context of change:** Assess whether the user was part of an approved process for requiring admin rights, such as a project with a justified need for access. Valid requests typically come from operational departments and have documented approval.

  - **Check related account activities:** Look for recent changes to the same user account, including logins from unusual locations or any failed login attempts that might indicate account compromise (utilizing logs from Identity and Access Management for monitoring).

  ---

  ### Prioritization

  This alert has medium severity due to the potential risk it poses if an unauthorized user is granted elevated privileges. The likelihood of abuse is significant, as this behavior can lead to widespread impact if attackers gain admin access. Privilege escalation is commonly weaponized in attacks targeting cloud environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations are inadequate, particularly if audit logs for administrative actions are not fully enabled. Legitimate use cases, like onboarding new admins or reassigning roles, could trigger this alert and should be validated. Companion detections include logs for abnormal login activities or user account changes that may indicate prior compromise attempts, enhancing overall visibility.

