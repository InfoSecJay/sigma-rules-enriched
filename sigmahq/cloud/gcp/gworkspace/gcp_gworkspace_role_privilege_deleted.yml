  ### Technical Context

  This Sigma rule detects the deletion of role privileges within Google Workspace, specifically tracking events where an administrator removes a user’s privilege level. The likely attacker objective here is to diminish the security posture of the organization by stripping away critical administrative capabilities or hiding their tracks after gaining unauthorized privileges. This behavior fits into the MITRE ATT&CK framework under the tactic of **Impact (TA0040)**, specifically the technique **Account Access Removal (T1585.002)**.

  The primary telemetry source for this detection is Google Workspace audit logging, particularly from the **Admin Activity** logs which capture changes in user permissions. The security impact of a privilege removal could be significant, enabling further attacker activities by providing them with an opportunity to assume a victim's role without proper oversight. However, this detection does not, on its own, confirm malicious intent, as legitimate administrators may also perform this action for valid reasons.

  ---

  ### Investigation Steps

  - **Review the corresponding Admin Activity log entry:** Look for Google Workspace Admin Activity Log entries with `eventName: REMOVE_PRIVILEGE`, containing details about who performed the action (userEmail) and which privilege was removed (role). Check timestamp alignment with other suspicious activities.

  - **Validate the user’s privilege history:** Use Google Workspace Admin Console reports or API calls to check the user's prior roles and privileges to confirm whether the deletion was authorized (Role Use Record). If the privilege removal was sudden or unexpected, this may indicate malicious intent.

  - **Cross-reference user activity:** Investigate the user (userEmail) that performed the action in the context of their role and prior activities. Ensure that the user typically has appropriate access rights and is not acting outside of expected behaviors based on audit log entries.

  - **Identify expected legitimate behaviors:** Crosscheck with staffing changes or audits performed in the Google Workspace environment. If this deletion corresponds to a documented change in responsibility or fewer role privileges, it could be an expected behavior rather than a malicious act.

  - **Check for related administrative activity:** Assess if other administrative actions occurred shortly before or after the REMOVE_PRIVILEGE event, such as `GRANT_PRIVILEGE` events or role assignments to ensure this isn’t part of an evolving attack chain.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact on administrative controls within Google Workspace. The likelihood of malicious abuse is moderate, as attackers often target admin roles to impair defenses. While privilege modifications can be legitimate, unexpected deletions warrant further scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the misconfiguration of audit logging in Google Workspace, as without comprehensive logging, relevant administrative actions could be missed. Legitimate administrative roles may trigger this alert during regular account maintenance. Companion detections, such as monitoring for simultaneous privilege grants or suspicious login activities, can enhance context and provide greater insight into the nature of these changes.

