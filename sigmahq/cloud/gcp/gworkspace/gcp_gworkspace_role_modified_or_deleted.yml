note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of roles within Google Workspace, specifically monitoring events related to role changes such as DELETE_ROLE, RENAME_ROLE, and UPDATE_ROLE. The likely objective of an attacker triggering this alert would be to escalate privileges, reduce access controls, or disrupt operations by changing administrative roles. This activity falls under the MITRE ATT&CK tactic "Privilege Escalation" (TA0004) and the technique "Permission Group Modification" (T1589).

  The primary telemetry source for this detection is Google Workspace Admin Activity logs, which provide events related to changes made by administrators. If malicious, such changes could allow unauthorized users elevated permissions or potentially lock out legitimate administrators. It is crucial to note that this detection does NOT confirm malicious intent on its own; role modifications may also be part of legitimate administrative functions.

  ### Investigation Steps

  - **Check event details:** Examine Google Workspace Admin Activity logs for Event IDs associated with DELETE_ROLE, RENAME_ROLE, and UPDATE_ROLE. Look specifically for changes made by users with admin roles. Noting who made the change is critical.

  - **Identify unauthorized modifications:** Look for role modifications occurring outside of regular business hours. Cross-reference the timestamps with expected operational hours to discern potential unauthorized activity.

  - **Verify legitimate changes:** Review recent legitimate role changes (e.g., by querying audit logs for the past week) to identify normal administrative workflows. Expected changes should align with planned organizational role adjustments.

  - **Assess user context:** Evaluate the user who modified the role. Verify whether this user typically performs administrative functions. A low-privilege user suddenly modifying roles indicates potential nefarious activity.

  - **Monitor for repetitive patterns:** Look for repeated role deletions or modifications within a short time frame. This could indicate a script or automated process being used by an attacker attempting to weaken network controls.

  ### Prioritization

  This alert carries medium severity given the critical nature of roles in Google Workspace, where privilege escalation can lead to widespread access to sensitive data. The likelihood of malicious abuse is moderate, considering attackers often target administrative roles, and such behaviors can be weaponized for lateral movement or disruption.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate admins to alter roles for various reasons, which could trigger false positives. Reliable detection necessitates thorough logging configurations within Google Workspace to capture all relevant admin activities. Legitimate activities such as routine administrative updates or role reshuffling during onboarding may trigger this alert. A related detection such as unauthorized admin account activity should be monitored concurrently to provide additional context and improve coverage against privilege escalation attempts.

