note: |
  ### Technical Context
  This detection rule identifies significant administrative actions within Google Workspace, specifically targeting modifications and deletions of roles through logging events. Such events are critical as they may involve the alteration of access permissions for users, which can impact an organization's security posture by either unintentionally or maliciously granting excessive privileges to users. The primary objective behind this activity is often to execute unauthorized access or to disrupt legitimate administrative practices.

  The detection aligns with the MITRE ATT&CK framework under the **Impact** tactic (TA0040), particularly method **Account Access Removal** (T1531) and **Data Manipulation** (T1565). These techniques emphasize the risk associated with privilege mishandling and the potential for adversaries to exploit compromised accounts or misconfigured permissions to gain control or disrupt services.

  The primary data sources for this detection include Google Workspace admin logs that track role assignments, modifications, and deletions. These logs provide direct evidence of administrative changes, enabling security teams to correlate incidents with possible malicious behavior within their cloud environment.

  ### Investigation Steps
  - **Review Admin Event Logs**: Collect logs from Google Workspace’s admin audit to identify the specific roles modified or deleted, alongside the associated user accounts and timestamps for insight into frequency and pattern of changes.
  - **Correlate User Activity**: Analyze user activity logs leading up to the role modification or deletion to determine if there were any suspicious or unauthorized accesses by the involved accounts.
  - **Assess Role Permissions**: Examine the permissions associated with the modified or deleted roles to evaluate whether the changes posed potential security risks and if they align with established organizational policies.
  - **Interview Account Owners**: Engage with the users identified in the logs to verify whether the changes were legitimate and to understand the context behind these role adjustments.

  ### Prioritization
  Given the medium severity of this alert, it is essential to act promptly, as unauthorized role modifications could enable malicious actors to escalate privileges and gain access to sensitive data or systems, significantly impacting the organization’s security landscape.

  ### Blind Spots and Assumptions
  The detection logic may not cover changes made through non-standard channels or via API accesses that do not generate logs in the expected format. It also assumes that the Google Workspace API is correctly logging all relevant administrative changes. In addition, it requires that audit logging is enabled for the Google Workspace environment to ensure comprehensive visibility into role changes. Without this logging, critical activities may go undetected, leaving potential security gaps.

