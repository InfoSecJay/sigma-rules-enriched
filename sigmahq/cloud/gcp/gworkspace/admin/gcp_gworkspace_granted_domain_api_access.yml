note: |
  ### Technical Context

  This Sigma rule detects the event where a service account is granted domain-wide authority in Google Workspace through the `AUTHORIZE_API_CLIENT_ACCESS` event. The likely objective of an attacker utilizing this functionality would be to escalate privileges, allowing unauthorized access to sensitive organizational data or to perform actions on behalf of all users within a domain. This behavior is associated with the MITRE ATT&CK tactic of Privilege Escalation, specifically the technique: [T1098 - Account Manipulation](https://attack.mitre.org/techniques/T1098/).

  The primary telemetry source for this detection is Google Workspace Admin logs, specifically focusing on audit logs that capture administrative activities and configurations. If this event is part of a malicious action, it could result in significant security risks including unauthorized data access or interference in user accounts. It is crucial to note that this detection alone does not confirm malicious intent, as legitimate administrative activities could similarly trigger the alert.

  ### Investigation Steps

  - **Review event details for source account:**
    Check the Google Workspace Admin activity logs (`admin.googleapis.com`) for the event `AUTHORIZE_API_CLIENT_ACCESS`. Verify the identity of the service account requesting domain-wide authority (fields like `actor.email`) and ensure they are authorized personnel.

  - **Cross-check recent administrative actions:**
    Investigate the admin activity logs for other relevant actions surrounding the timeframe of the alert. Look for suspicious activities such as unusual account creations or modifications that could indicate an ongoing attack.

  - **Identify expected legitimate behavior:**
    Document recent instances where service accounts were authorized for domain-wide access for approved projects or integrations. Ensure these align with organizational policy and have proper documentation.

  - **Look for high-confidence malicious indicators:**
    Identify any service accounts that are new, have recently been created, or whose permissions have been expanded without corresponding business justification. Uncommonly privileged service accounts should raise red flags.

  - **Validate file creation or exfiltration artifacts:**
    If applicable, monitor for call logs or API access related to sensitive Google Workspace data post-authorization. Look for unusual patterns or spikes in data access using tools like Google Vault.

  - **Confirm system configuration checks:**
    Ensure that your Google Workspace logging is correctly configured to capture all relevant audit logs. Regularly assess and audit active service accounts for compliance with security policies.

  ### Prioritization

  This alert has medium severity due to the potential impact on the entire Google Workspace environment if malicious access is granted. The likelihood of abuse is significant, given the common targeting of service accounts for privilege escalation, making it an attractive vector for attackers.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering alerts, which could reduce urgent responses if not properly investigated. The effectiveness of this detection relies heavily on proper log collection configurations in Google Workspace. Administrators should be aware that benign administrative actions may resemble malicious activity. Related detections include monitoring for unusual API calls made by high-privilege service accounts.

