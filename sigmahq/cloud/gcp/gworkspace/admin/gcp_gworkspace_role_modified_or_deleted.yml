note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of roles within Google Workspace. This behavior is indicative of attempts to escalate privileges or alter access controls, potentially with the goal of unauthorized information access or lateral movement within an organization's Google services environment. The relevant MITRE ATT&CK tactic is "Privilege Escalation" (TA0004) with techniques including "Permission Groups Discovery" (T1069) and "Permission Management" (T1537).

  The primary telemetry sources involve Google Workspace Admin activity logs, specifically events captured under the admin.Google API. The security impact of malicious behavior in this context could result in unauthorized administrative capabilities or access to sensitive data. It is important to note that this detection does NOT confirm malicious intent; legitimate administrative actions could result in similar logs.

  ### Investigation Steps

  - **Review Admin Activity Logs**: Examine Google Workspace Admin Activity logs for Event Name entries of `DELETE_ROLE`, `RENAME_ROLE`, or `UPDATE_ROLE` within a specific timeframe. Focus on fields such as `actor` and `targetResource` to identify who made the changes and what roles were altered.

  - **Assess User Context**: Identify the actor associated with the detected events. Validate whether this user has a legitimate reason to change roles. Consider their current permissions and role history to understand any suspicious behavior.

  - **Check Role Assignment Changes**: Look for changes in role assignments that could indicate privilege escalation. Compare the role's previous and current states, focusing on sensitivity levels and administrative capabilities.

  - **Evaluate Legitimate Administrative Actions**: Verify if there are scheduled or regular admin activities that correspond to the time of detection. Administrative changes during standard maintenance windows may indicate benign activity.

  - **Cross-Reference Related Accounts**: Search for related activity by the same user or other accounts that coincide with the role modifications. Look for additional events linked to `UPDATE_USER` or `DELETE_USER` as they could indicate a coordinated effort.

  - **Document Historical Context**: Retrieve prior logs for the same user and any modified roles to establish a behavioral baseline. Frequent or unexplained changes could indicate an elevated risk.

  ### Prioritization

  This alert is medium severity due to the potential risk associated with unauthorized modifications to administrative roles. While such activities can be legitimate, they are a critical control point for privilege escalation attacks and are commonly weaponized by adversaries to gain higher access levels.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative changes triggering alerts. It assumes all required Google Workspace Admin logs are available and properly configured to capture relevant changes. Additionally, certain legitimate operations like role delegations in a managed environment may generate similar events. A companion detection to consider is monitoring Google Workspace API access patterns for unusual or unsupported actions that correlate with role changes, enhancing overall security posture.

