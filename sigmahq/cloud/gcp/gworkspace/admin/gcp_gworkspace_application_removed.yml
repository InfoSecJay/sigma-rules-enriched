note: |
  ### Technical Context

  This rule detects events indicating the removal of an application from Google Workspace, specifically through the `REMOVE_APPLICATION` and `REMOVE_APPLICATION_FROM_WHITELIST` event names. The likely attacker objective may involve undermining application controls, either to disable security measures or to exploit weaknesses within the environment for data exfiltration or lateral movement. This detection aligns with the MITRE ATT&CK tactic of Impact (TA0040) and technique of Application Layer Denial of Service (T1499).

  Primary telemetry comes from Google Cloud Platform (GCP) audit logs, specifically under the Google Workspace Admin service. If performed maliciously, this action could lead to the unregulated usage of sensitive data through unauthorized applications. However, this detection does NOT confirm malicious intent outright; legitimate administrative actions frequently take place within the same context.

  ### Investigation Steps

  - **Identify related user actions: ** Examine the GCP audit logs for Event ID `REMOVE_APPLICATION` or `REMOVE_APPLICATION_FROM_WHITELIST` in the `admin.googleapis.com` service around the same time as alert generation. Check the `email` and `actor` fields to correlate user actions with known administrator accounts.

  - **Review application context: ** Determine which application was removed by checking the `applicationName` field in the logs. Evaluate whether this application is known to be critical to business functions or security posture.

  - **Assess previous modifications: ** Investigate preceding actions leading up to the application removal in the GCP audit logs. Look for event types such as `ADD_APPLICATION` or configuration changes relevant to the application to understand the timeline of changes.

  - **Analyze the user’s role: ** Cross-reference the actor’s `role` or `group` attributes with organizational policies. Verify if the user has legitimate permissions as an administrator to remove applications, constraining potential threats from unauthorized personnel.

  - **Check audit log retention and coverage: ** Validate the retention period for GCP audit logs to ensure that necessary logs are available for review. Confirm that logs are configured to capture all relevant application interactions.

  ### Prioritization

  This alert is medium severity due to the potential impact on security controls if the application removed is critical. Given the nature of application management in Google Workspace, there is a moderate likelihood this behavior could be exploited maliciously. However, cases of legitimate removal by system administrators are common, necessitating thorough investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential obfuscation techniques by adversaries, such as accessing Google Workspace with legitimate administrator accounts to remove applications covertly. Reliable detection requires logs from the GCP audit trail to be fully enabled. Legitimate activities that might trigger the alert include routine application management by official administrators. A related detection to consider is any unauthorized addition of applications (via `ADD_APPLICATION`), which would strengthen scrutiny on changes in application management.

