note: |
  ### Technical Context

  This Sigma rule detects when a Google Workspace user is granted admin privileges, specifically through events such as `GRANT_DELEGATED_ADMIN_PRIVILEGES` or `GRANT_ADMIN_PRIVILEGE`. The likely objective of an attacker triggering this alert would be to gain unauthorized administrative control over the Google Workspace environment, enabling them to manipulate user settings, access sensitive data, or introduce malicious activities across the organization. Relevant MITRE ATT&CK tactics include "Privilege Escalation" (TA0004) and "Administrator Account" (T1098).

  The primary telemetry source is Google Cloud Platform (GCP) logs, specifically Google Workspace admin audit logs that capture user permission changes. If malicious, this behavior could lead to significant security risks, including unauthorized access to critical resources and data. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions by authorized personnel can also trigger it.

  ### Investigation Steps

  - **Review admin change logs**: Check Google Workspace admin audit logs (Event type: `admin.googleapis.com`) for the specific events `GRANT_DELEGATED_ADMIN_PRIVILEGES` or `GRANT_ADMIN_PRIVILEGE`. Identify the user who received the privileges and their previous role to ascertain if this was expected.

  - **Evaluate user role changes**: Confirm the business justification for any user role changes. Cross-reference the affected user against HR records or asset management databases to validate if they should have administrative privileges.

  - **Assess related user activity**: Look for subsequent actions taken by the newly granted admin user, such as changes to other user roles or permissions (audit log entries for events like `UPDATE_USER`). Unexpected or excessive role changes post-privilege grant indicate potential malicious behavior.

  - **Investigate multiple admin grants**: Identify if there are simultaneous privilege grants occurring within a short time frame for other users, which could suggest coordinated unauthorized activity. Check for patterns or outliers in the logs.

  - **Check for alerts on sensitive resources**: Review alerts related to sensitive resources accessed or modified by the newly privileged user. Specifically, look for activities involving data exports or configuration changes to critical Google Workspace settings.

  ### Prioritization

  This alert signifies medium severity due to the potential impact on data security and user privacy. The likelihood of malicious abuse increases if the user granted admin privileges does not align with their job responsibilities, especially in environments where such privilege escalation is uncommon.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to legitimate temporary role changes or resets of admin privileges during onboarding/offboarding processes. Required log sources include Google Workspace admin audit logs configured to capture detailed activity. Benign activities may include authorized admins performing routine administrative tasks leading to privilege grants. A companion detection rule for "Google Workspace Admin User Suspended" can enhance coverage by flagging cases where a newly granted admin user is subsequently suspended, adding context to their behavior.

