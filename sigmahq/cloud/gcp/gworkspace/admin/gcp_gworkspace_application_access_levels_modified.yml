title: Google Workspace Application Access Level Modified
id: 22f2fb54-5312-435d-852f-7c74f81684ca
status: test
description: |
  Detects when an access level is changed for a Google workspace application.
  An access level is part of BeyondCorp Enterprise which is Google Workspace's way of enforcing Zero Trust model.
  An adversary would be able to remove access levels to gain easier access to Google workspace resources.
references:
- https://developers.google.com/admin-sdk/reports/v1/appendix/activity/admin-application-settings
- https://support.google.com/a/answer/9261439
author: Bryan Lim
date: 2024-01-12
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: gcp
  service: google_workspace.admin
detection:
  selection:
    eventService: 'admin.googleapis.com'
    eventName: 'CHANGE_APPLICATION_SETTING'
    setting_name|startswith: 'ContextAwareAccess'
  condition: selection
falsepositives:
- Legitimate administrative activities changing the access levels for an 
  application
level: medium
note: |
  ### Technical Context

  This rule detects changes to the access level of Google Workspace applications, specifically when these changes relate to Context-Aware Access settings. An attacker could modify these access levels to bypass security controls, thereby gaining unauthorized access to sensitive resources within the Google Workspace environment. This activity is relevant to the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Privilege Escalation (T1098.003).

  The primary telemetry source for this detection is the Google Workspace Admin Activity API, which logs events such as `CHANGE_APPLICATION_SETTING`. If malicious, this change may enable an adversary to exploit vulnerabilities or achieve higher access levels than intended. However, this detection does not confirm malicious activity on its own, as it may also occur during legitimate administrative operations.

  ### Investigation Steps

  - **Confirm the event type:** Review Google Workspace Admin Activity API logs to ensure that the event captured is indeed of type `CHANGE_APPLICATION_SETTING` with the `setting_name` starting with `ContextAwareAccess`. Look for Event ID that corresponds to this log entry.

  - **Check the initiator:** Identify who initiated the access level change by reviewing the `actorEmail` field in the logs. Verify whether this user is an authorized administrator or if the account is suspicious.

  - **Review the change details:** Examine the `applicationId` and `newValue` fields to assess what specific access levels were modified. Malicious indicators could include changes that reduce security controls or grant broader access than previously configured.

  - **Identify legitimate actions:** Compare the change with historical log activity for the same user. Legitimate changes may align with scheduled administrative reviews or updates, while arbitrary changes not in line with normal operational patterns could indicate compromise.

  - **Monitor related account activity:** Correlate this event with subsequent user activity in the Google Workspace Admin logs. Look for unusual sign-ins or actions taken by the affected application that signify unauthorized access attempts.

  - **Assess system criticality:** Determine the criticality of the application affected by this change. If the application handles sensitive data or high-value operations, prioritize this incident for deeper investigation.

  ### Prioritization

  The alert severity is medium due to the potential for impact on sensitive Google Workspace resources if the change is indeed malicious. The likelihood of abuse is moderate, as legitimate administrative activities can lead to similar alerts, but the behavior of reducing access controls is increasingly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations for the Google Workspace Admin Activity API are not properly implemented or if significant delays occur in log delivery. Legitimate activities, such as scheduled administrative reviews or policy updates, could trigger this alert without malicious intent. A related detection that enhances coverage is monitoring user sign-in anomalies or privileged actions following application access level changes.

