note: |
  ### Technical Context

  This Sigma rule detects the event of disabling multi-factor authentication (MFA) within Google Workspace. An attacker may seek to disable MFA to facilitate unauthorized access to user accounts, thus compromising sensitive data or systems. This behavior relates to the MITRE ATT&CK tactic "Credential Access" (TA0006) and the technique "Account Manipulation" (T1098). The primary telemetry source is Google Workspace Admin Activity logs (admin.googleapis.com), specifically monitoring events like ENFORCE_STRONG_AUTHENTICATION and ALLOW_STRONG_AUTHENTICATION. If malicious, the absence of MFA increases the risk of account takeover. This detection does NOT confirm that malicious intent was present; it merely indicates that MFA settings were altered.

  ### Investigation Steps

  - **Review Admin Activity Logs**: Check Google Workspace Admin Activity logs for the event `ENFORCE_STRONG_AUTHENTICATION` or `ALLOW_STRONG_AUTHENTICATION` with `eventValue` set to 'false’ (Admin API logs). Legitimate changes should include a valid administrator's email tied to a legitimate security review.

  - **Correlate with User Roles**: Verify the user account associated with the change (Event ID: 101) against expected roles. Legitimate administrators typically handle security settings; an unfamiliar admin account making such changes should raise suspicion.

  - **Check for Previous MFA State**: Investigate prior logs to confirm whether MFA was enabled before the recent change (fields `eventName` and `eventValue`). If the logs show that MFA was reliably enforced prior and suddenly turned off without change requests, mark this as suspicious.

  - **Identify Timing of Changes**: Note the timestamp of MFA disablement and cross-reference it with other potentially malicious events (e.g. unusual login times, failed login attempts). If the change occurred during maintenance or outside of normal hours, it should be flagged.

  - **Analyze Failed Login Attempts**: Look into login attempts using the Google Workspace logs (Event ID: 108). A spike in failed logins following the disabling of MFA could indicate an active attack targeting user accounts.

  - **Highlight Legitimate Use Cases**: Identify if the disabling of MFA coincided with a legitimate company event (e.g., a tool rollout requiring different auth configurations) and if communications around this were documented and acknowledged by the team.

  ### Prioritization

  Alert severity is medium, as MFA protection is critical for securing user accounts. The likelihood of malicious abuse increases significantly if the change is linked to vulnerabilities exploited by adversaries. While disabling MFA is an exploitation avenue, it is sometimes part of routine maintenance by authorized personnel, requiring further investigation.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative activity regarding MFA changes if no supporting context (e.g., communicated policy changes) is available. It's also susceptible to evasion by sophisticated users attempting to mimic administrative behavior. Ensure logging for review is comprehensive and consider implementing a companion detection rule to monitor for unexpected account logins following the MFA status change, such as unusual login IP addresses or geolocation anomalies.

