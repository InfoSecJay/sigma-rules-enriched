note: |
  ### Technical Context

  This rule detects the deletion of role privileges in Google Workspace, specifically when an administrator removes permissions from an existing role. The likely attacker objective could be to reduce visibility, impede investigations, or facilitate unauthorized access by removing oversight from certain roles. This aligns with the MITRE ATT&CK tactic of **Impact** (TA0040) and technique **Account Manipulation** (T1098). The primary telemetry sources include Google Workspace Admin Audit Logs, particularly focusing on the event service `admin.googleapis.com` for events related to privilege changes.

  If this behavior is malicious, it can lead to significant security impacts, such as unauthorized account control or data exfiltration by compromising administrative privileges. However, it's important to note that this detection does NOT confirm malicious intent by itself; legitimate administrative actions can also trigger this alert.

  ### Investigation Steps

  - **Review specific event details:** Check Google Workspace Admin Audit Logs for Event ID related to `REMOVE_PRIVILEGE` in the activity report. Look for fields indicating the user account that made the alteration, the role affected, and the timestamp of the event. Compare against user role assignments and determine if this aligns with expected administrative activity.

  - **Identify unusual user behavior:** Investigate the account that performed the privilege removal. Look for preceding logs that indicate other suspicious behaviors (e.g., multiple high-privilege changes in a short timeframe, unusual login patterns).

  - **Compare with legitimate admin changes:** Reference the organization's change management logs to determine if the privilege removal was previously approved. Document any discrepancies or unauthorized changes against established policies.

  - **Assess the role impact:** Evaluate the significance of the deleted role privilege. Investigate if this role is critical for system access or has elevated permissions that could affect data integrity or accessibility.

  - **Correlate with other detections:** Cross-reference with existing alerts on privilege elevation or user account management. A simultaneous alert for account manipulation is a strong indicator of malicious activity.

  ### Prioritization

  This alert carries medium severity due to the potential impact on system accessibility and integrity if privilege removals are executed maliciously. The likelihood of abuse is heightened in environments where administrative privileges can dictate significant access over sensitive data. While privilege deletions may occur legitimately, the context and frequency of such events necessitate focused review.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers using legitimate accounts or administrative processes to conceal malicious activity. Reliable detection requirements include proper logging configurations in Google Workspace to capture all relevant admin actions. Legitimate activities that may trigger the alert include routine role reassessments and compliance-related privilege adjustments. A related detection to consider is the alerting on new role assignments or modifications to user privileges to strengthen coverage against misuse.

