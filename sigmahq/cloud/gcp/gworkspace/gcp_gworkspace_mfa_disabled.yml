note: |
  ### Technical Context
  This rule detects when multi-factor authentication (MFA) is disabled within a Google Workspace environment. Disabling MFA significantly increases the risk of unauthorized access, especially in enterprises where sensitive information is contained within cloud applications. An attacker may disable MFA to lower the security barriers for subsequent credential theft or account takeover attempts, facilitating lateral movement within the organization. The motivation behind this could be to launch further attacks, steal intellectual property, or perform data breaches.

  The relevant MITRE ATT&CK tactics/techniques applicable to this detection include "Impact" (TA0040) due to the potential for unauthorized access, and "Credential Dumping" (TA0006) or "Account Manipulation" (TA0030) since disabling MFA may be part of a broader exploitation strategy. Key telemetry sources to consider include Google Cloud Platform (GCP) logs, particularly audit logs related to administrative activities within Google Workspace, to track when MFA settings are modified.

  ### Investigation Steps
  - **Review Audit Logs:** Examine Google Workspace audit logs for any recent events related to MFA settings, especially focusing on changes to the "ENFORCE_STRONG_AUTHENTICATION" and "ALLOW_STRONG_AUTHENTICATION" events.
  - **Identify Administrative Actions:** Look for actions taken by administrators that coincide with the timestamp of the MFA change. This includes identifying if the action was legitimate or if any unauthorized personnel accessed administrative accounts.
  - **Correlation with User Behavior:** Analyze user access patterns, especially around the time MFA was disabled. Look for unusual login attempts or access from unfamiliar locations that may indicate a compromised account.
  - **Verify Current MFA Settings:** Check the current MFA configurations across all Google Workspace accounts to ensure compliance and identify any additional accounts that may have had MFA disabled unexpectedly.

  ### Prioritization
  The severity of this alert is medium because while MFA disablement does pose a significant risk, it may also occur legitimately by system administrators for various reasons. However, the likelihood of exploitation increases dramatically once MFA is removed, making prompt investigation crucial.

  ### Blind Spots and Assumptions
  This detection rule assumes that all changes to MFA settings are logged appropriately and that the logs are retained per organizational policies. A potential blind spot includes legitimate MFA disablement by administrators that could falsely trigger investigations. Additionally, if audit logging is not enabled or configured incorrectly within Google Workspace, the detection may fail to capture relevant events. Organizations must ensure that audit logs specifically for security settings are enabled and regularly reviewed for further accuracy in detection.

