note: |
  ### Technical Context

  This rule detects when multi-factor authentication (MFA) settings are disabled in Google Workspace, specifically when the events `ENFORCE_STRONG_AUTHENTICATION` or `ALLOW_STRONG_AUTHENTICATION` are logged with a new value of `false`. This behavior can indicate a potential security weakness, as disabling MFA may allow unauthorized access to user accounts, aligning with the attack technique of Credential Dumping (MITRE ATT&CK ID: T1003). The primary telemetry source for this detection is Google Workspace admin logs, capturing changes to security settings.

  The security impact of malicious activity in this context includes an increased risk of account compromise, leading to data exfiltration or unauthorized actions within the organization. Note that this detection does NOT confirm malicious activity on its own; legitimate administrative actions may also disable MFA.

  ### Investigation Steps

  - **Audit event logs for MFA changes**: Review Google Workspace admin logs for `eventName` entries of `ENFORCE_STRONG_AUTHENTICATION` and `ALLOW_STRONG_AUTHENTICATION` with `new_value: 'false'` to identify when MFA was disabled. Target logs should include fields such as `eventTime`, `userEmail`, and `eventSource`.

  - **Check admin account activity**: Determine if the MFA was disabled by an administrator. Search for other admin activities around the same time that may indicate routine behavior, such as `userAccountChanges` or `permissionAdjustments`, to establish legitimacy.

  - **Identify non-administrative user accounts**: Look for disabled MFA settings on high-risk or sensitive accounts, especially those belonging to privileged roles. Review relevant logs for accounts that are typically monitored, like finance or IT administrators.

  - **Evaluate account access post-MFA disablement**: Investigate subsequent login attempts or actions by the user after MFA was disabled. Specifically, check for anomalous login times or geolocation in Google Workspace login logs that deviate from the user's normal patterns.

  - **Document expected administrative practices**: Collect and confirm documented changes in security policy or administrative communication that allowed MFA to be disabled. Anomalies in this documentation may need to be escalated for further investigation.

  - **Correlate with other security controls**: Review correlated alerts or detection systems, such as DLP incidents or unusual data access following the MFA disablement, which could indicate potential exploitation of this vulnerability.

  ### Prioritization

  The alert is medium severity as disabling MFA can significantly impact account security, particularly for sensitive roles. There is a moderate likelihood of malicious exploitation of this behavior, especially if it coincides with other suspicious activities. As MFA is widely recognized as a critical security control, its removal is often weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by inadequate logging configurations in Google Workspace or delays in log propagation. Legitimate activities, such as authorized administrative work or temporary account adjustments, may trigger the alert and require careful distinction. Related detections could include failed login attempts within a short time after MFA is disabled, enhancing threat identification across multiple layers.

