note: |
  ### Technical Context
  This rule detects modifications or deletions of VPN tunnels within Google Cloud Platform (GCP). These actions may indicate unauthorized changes that could lead to data exfiltration or disruptions in service access. Attackers may aim to manipulate VPN configurations to reroute traffic, intercept communications, or shut down critical access points. If the changes are made by unauthorized or unfamiliar users, it could be indicative of a security breach, including credential theft or account compromise.

  The relevant MITRE ATT&CK tactics include **Impact** (TA0040), which covers elements such as service stop and data destruction. Techniques associated with this detection rule include **Account Manipulation** (T1098), as it may involve users with administrative privileges altering VPN configurations. The primary data sources for this detection are GCP audit logs, specifically the logs related to VPN tunnel creation and deletion activities which capture the required method, user identity, and timestamp.

  ### Investigation Steps
  - **Review GCP Audit Logs:** Examine GCP audit logs for entries related to `compute.vpnTunnels.insert` and `compute.vpnTunnels.delete` methods. Look for any unusual or unauthorized user activity around these operations.

  - **Identify User Context:** Correlate the user IDs associated with the VPN tunnel modifications or deletions to validate whether the actions were performed by legitimate administrators or unfamiliar users.

  - **Analyze Change Frequency:** Determine if there has been an increase in the frequency of VPN tunnel modifications or deletions, which could indicate scripted or automated attacks rather than standard administrative practices.

  - **Check for Alerts on User Behavior:** Use any available user and entity behavior analytics (UEBA) tools to see if the user involved in the modification or deletion of the tunnel exhibited anomalous behavior leading up to the event.

  ### Prioritization
  This alert should be treated with medium priority due to the potential impact of an insider threat or unauthorized access, which may undermine the security of the organization’s infrastructure and data. The likelihood of serious implications warrants prompt investigation to assess the legitimacy of the changes.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include scenarios where changes are made through scripts or APIs by authorized administrators, which could go unnoticed if not properly monitored. The detection assumes logs are adequately captured and retained for audit purposes, and that no legitimate administrative activities are occurring at the same time that could lead to false negatives. It is crucial to ensure that GCP audit logging is enabled and properly configured to capture all relevant events associated with VPN tunnels.

