note: |
  ### Technical Context

  This rule detects modifications or deletions of VPN Tunnels in Google Cloud. Such actions may indicate an attacker attempting to disrupt connectivity or exfiltrate data by severing secure channels. The likely objective of the attacker would be to compromise network integrity or facilitate lateral movement. This detection aligns with the MITRE ATT&CK tactic **Impact** and technique **Network Denial of Service (T1499)**.

  The primary telemetry source is the Google Cloud audit logs, specifically targeting **gcp.audit** logs showcasing the `compute.vpnTunnels.insert` and `compute.vpnTunnels.delete` method calls. If these operations are malicious, they can severely disrupt secure communications, affecting data integrity and availability. However, this detection does NOT confirm malicious intent on its own; legitimate administrative actions can inadvertently trigger it.

  ### Investigation Steps

  - **Check the user identity performing the action**: Review the logs for the `protoPayload.authenticationInfo.principalEmail` field to determine if the user is an authorized administrator or if it is an unfamiliar account attempting unauthorized changes.

  - **Identify the source of the request**: Assess the `protoPayload.request.metadata` for `userAgent` and `remoteIP`, ensuring they align with expected user behavior. Look for differences in location or access patterns that may indicate compromised credentials.

  - **Review VPN Tunnel status and configuration prior to modification**: Use `gcp.compute.vpnTunnels.get` to verify the state and recent configurations of the tunnel to establish if legitimate changes were made. Signs of expected modifications might include scheduled maintenance or configuration updates documented in change management systems.

  - **Analyze the timing of the modification or deletion**: Investigate `gcp.audit.timestamp` to correlate with suspicious user activity or other indicators of compromise (e.g., access from uncommon locations or at odd hours).

  - **Cross-reference recent changes**: Check for related alerts or reports indicating user behavior anomalies, such as account lockouts or unrecognized behavior leading up to the VPN modification. Companion detections could include alerts for unexpected API calls or internal reconnaissance.

  ### Prioritization

  This alert is of medium severity due to the potential impact on network availability and the likelihood of malicious abuse through unauthorized VPN modifications or deletions. While legitimate administrative actions can trigger the alert, the consistent targeting of these resources may indicate an active threat.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate administrative behavior to trigger this alert, especially during scheduled maintenance or operational changes. Reliable detection requires comprehensive audit logging configurations in GCP. Legitimate activities like VPN reconfigurations for business needs can also cause false positives. A related detection for **VPC firewall rule modifications** can help strengthen overall network security visibility.

