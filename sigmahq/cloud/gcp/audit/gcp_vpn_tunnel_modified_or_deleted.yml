  ---

  ### Technical Context

  This rule detects modifications or deletions of VPN tunnels within Google Cloud Platform (GCP). Attackers may target VPN tunnels to disrupt secure communication channels or insert malicious tunnel configurations for exfiltration purposes, achieving the impact of manipulating network traffic for reconnaissance or unauthorized access. The relevant MITRE ATT&CK tactic is Impact (TA0040) and the technique is Network Denial of Service (T1498).

  Primary telemetry sources include GCP audit logs, particularly focused on events related to the `compute.vpnTunnels.insert` and `compute.vpnTunnels.delete` method calls. If malicious, this behavior can lead to unauthorized access to resources or service disruptions. However, this detection alone does NOT confirm malicious intent—it may also indicate legitimate administrative activity.

  ---

  ### Investigation Steps

  - **Check the user identity:**
    Review GCP audit logs for the user identity associated with the event (audit log fields: `actor`). Compare it against known administrators to determine if the action aligns with expected behavior.

  - **Analyze the event timestamp:**
    Correlate the timestamp of the modification or deletion (timestamp field) to assess whether it occurred during normal business hours or maintenance windows.

  - **Review related GCP service activity:**
    Identify other GCP API calls made by the user around the same time. Look for suspicious activities such as changes to firewall rules or IAM policy alterations, as these can indicate a broader compromise.

  - **Verify user agent and source IP:**
    Check the user agent and source IP addresses in the logs (fields: `user_agent`, `ip_address`). Investigate any requests coming from unrecognized IP ranges or unusual user agents.

  - **Examine tunnel configuration changes:**
    If a tunnel was modified, review the new configuration (from log fields detailing configuration changes) for anomalies or unauthorized settings that may indicate tampering.

  - **Evaluate the asset's criticality:**
    Assess the importance of the affected VPN tunnel based on the services it connects. Critical VPNs linked to sensitive data flows require immediate investigation to prevent potential data exposure.

  ---

  ### Prioritization

  This alert has a medium severity level due to the potential impact on secure communications within the enterprise network. Unauthorized modifications or deletions of VPN tunnels can lead to significant security risks, particularly if exploited during active adversarial engagement. The likelihood of malicious abuse is moderate, especially if the activity involves unfamiliar users.

  ---

  ### Blind Spots and Assumptions

  Limitations include the possibility that authorized administrators might trigger false positives, as legitimate changes to VPN tunnels are common during system maintenance. Reliable detection also requires properly configured GCP audit logging to capture all relevant activity. Activities such as scheduled maintenance by known personnel may trigger alerts without malicious intent. A related detection that strengthens coverage is monitoring for unusual IAM policy changes, as this can directly impact users with permissions to modify VPN configurations.

