logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name|endswith:
    - .serviceAccounts.patch
    - .serviceAccounts.create
    - .serviceAccounts.update
    - .serviceAccounts.enable
    - .serviceAccounts.undelete
  condition: selection
falsepositives:
- Service Account being modified may be performed by a system administrator. Verify
  whether the user identity, user agent, and/or hostname should be making changes
  in your environment.
- Service Account modified from unfamiliar users should be investigated. If known
  behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to service accounts within Google Cloud, a critical component of cloud identity and access management. Service accounts are often leveraged by applications or virtual machines to interact with Google Cloud resources. Thus, unauthorized changes to these accounts can signify a malicious actor attempting to gain elevated access or alter the behavior of cloud applications for nefarious purposes. Typical attacker objectives may include privilege escalation, resource manipulation, or lateral movement within the cloud environment.

  The relevant MITRE ATT&CK tactics applicable here include **Initial Access** (TA0001) and **Privilege Escalation** (TA0004), specifically the technique **T1078: Valid Accounts**, which involves the use of legitimate credentials to gain unauthorized access. The primary data source for this detection includes audit logs from Google Cloud, which capture all IAM-related events, particularly those involving service account modifications.

  ### Investigation Steps
  - **Review Audit Logs**: Examine GCP audit logs for entries related to service account modifications, particularly focusing on the `method_name` calls identified (e.g., `.serviceAccounts.patch`, `.serviceAccounts.create`).
  - **Analyze User Context**: Investigate the user identity and user agent that initiated the modification to determine if the change aligns with expected administrative behavior or patterns.
  - **Check for Anomalous Behavior**: Identify any unusual patterns or frequencies of service account changes that may indicate potential compromise or misuse, especially from unfamiliar IP addresses.
  - **Evaluate Service Account Permissions**: Assess the permissions granted to the modified service accounts to ensure they have not been escalated beyond necessary operational requirements.

  ### Prioritization
  The alert's severity is medium due to the potential impact of unauthorized service account modifications, which can lead to significant operational disruptions, data breaches, or unauthorized access to cloud resources. The likelihood of such events is heightened in environments with critical applications reliant on these accounts.

  ### Blind Spots and Assumptions
  One of the gaps in detection coverage may arise from legitimate administrative actions that could lead to false positives if not adequately monitored. The detection logic assumes that modifications to service accounts are performed primarily by authorized personnel; however, the risk of stolen credentials means even familiar user activities can be malicious. For the alert to function effectively, comprehensive GCP audit logs must be enabled and configured appropriately to capture all relevant service account events.

