  ---

  ### Technical Context

  This Sigma rule detects modifications to Google Cloud service accounts, including actions such as patching, creating, updating, enabling, or undeleting service accounts. The likely attacker objective is to gain unauthorized access to resources or escalate privileges by modifying service accounts in order to impersonate legitimate users or processes. This behavior aligns with the MITRE ATT&CK tactic of **Impact** (TA0040) and technique of **Account Manipulation** (T1098).

  Primary telemetry sources include Google Cloud Audit logs, specifically the logging of activities in the IAM API. If these modifications are malicious, they can lead to significant security impacts, including unauthorized access to sensitive data and services. This detection does NOT confirm whether the changes were performed by an authorized user or script; further contextual investigation is required.

  ---

  ### Investigation Steps

  - **Review the User Identity:**
    Investigate the user account making the modification by checking the `protoPayload.authenticationInfo.principalEmail` field in the GCP Audit logs. Look for known admin users versus unfamiliar identities to assess legitimacy.

  - **Check the Action Timestamp:**
    Correlate the timing of the modifications with known patterns of malicious activity or normal business operations using the `timestamp` field in the log entry. Irregular hours or suspicious patterns may indicate a security concern.

  - **Analyze the Changed Attributes:**
    Examine the specific attributes that were modified by looking at the `protoPayload.serviceAccount` fields, such as `serviceAccountEmail` and `serviceAccountId`. Legitimate changes usually follow a documented process; deviations may indicate malicious intent.

  - **Identify Relevant API Calls:**
    Filter audit logs for `method_name` fields that include `.serviceAccounts.*`. Check for multiple modifications in a short time frame, which may indicate automated exploitation rather than a human-admin action.

  - **Look for Service Account Role Changes:**
    Check for any changes in the roles assigned to the service account through `protoPayload.serviceAccountPolicy`. An increase in permissions (e.g., roles that allow data access) can signify potential privilege escalation.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for privilege escalation and unauthorized access to sensitive resources. Although service accounts are commonly modified for legitimate administrative purposes, the likelihood of malicious abuse is elevated, requiring prompt investigation, especially in environments where these accounts have significant access.

  ---

  ### Blind Spots and Assumptions

  The detection may miss modifications made through console or API calls from ephemeral environments or automated scripts that intentionally obfuscate user identities. Reliable detection requires proper configuration of Google Cloud's audit logging. Additionally, legitimate activity, such as regular administrative updates, may trigger the alert. A related detection to consider is monitoring for unusual login attempts to service accounts, which can further help identify possible breaches or misuse.

