note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of DNS zones within Google Cloud, specifically targeting the methods `Dns.ManagedZones.Delete`, `Dns.ManagedZones.Update`, and `Dns.ManagedZones.Patch`. An attacker may aim to disrupt service, redirect traffic, or exfiltrate sensitive information by altering DNS configurations. The alert corresponds to the MITRE ATT&CK tactic of Impact (TA0040), specifically technique T1491: Defective Delivery.

  The primary telemetry sources for this detection are Google Cloud audit logs, which capture changes to DNS management. If malicious, these actions can lead to significant service outages or unauthorized access. However, this detection alone does not confirm intent or that an unauthorized user executed the modifications; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Check audit logs for recent changes**: Look for `gcp.audit` logs with method names `Dns.ManagedZones.Delete`, `Dns.ManagedZones.Update`, or `Dns.ManagedZones.Patch`. Ensure all relevant timestamps correlate with the alert trigger time.

  - **Identify the user executing the changes**: Review the `actor` and `serviceAccountEmail` fields in the audit logs. Legitimate changes typically originate from administrative accounts, while changes by generic or newly created service accounts may be suspicious.

  - **Validate the impacted DNS zone**: Cross-reference the DNS zone name in the alert with a known inventory of DNS zones. Changes affecting critical assets should be prioritized.

  - **Check for other related audit activities**: Look for additional `gcp.audit` entries, such as unauthorized access or network egress, that occur shortly before or after the DNS modification to assess for broader malicious activity.

  - **Investigation of legitimate use cases**: Confirm if the changes were part of scheduled maintenance or updates communicated through change management processes.

  - **Assess for potential data exfiltration**: If the DNS modifications involve redirecting traffic, inspect for unusual outbound connections that correspond to the modified DNS entries.

  ### Prioritization

  This alert has medium severity because unauthorized changes to DNS zones can disrupt system functionality and impact user access. The likelihood of exploitation is moderate, as such changes are weaponized in domain hijacking and phishing attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging is misconfigured or not enabled for all relevant changes. Evasion could occur if an attacker has legitimate access privileges or employs techniques to obscure their actions. Legitimate administrative changes or updates can trigger this alert, leading to potential false positives. A related detection to enhance coverage would be monitoring for unusual egress traffic patterns or access attempts that may indicate an attempted data breach following DNS alterations.

