note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of DNS zones within Google Cloud Platform (GCP), a critical aspect of cloud infrastructure management. DNS zones hold vital information regarding the domain name system, including domain records that facilitate domain resolution. Unauthorized alterations or deletions of these zones can lead to denial of service, misdirection of legitimate traffic, or exposure of internal services—objectives often sought by malicious actors seeking to disrupt services or exfiltrate sensitive information.

  The associated MITRE ATT&CK tactics and techniques relevant to this detection are "Impact" (TA0040) as the changes to DNS zones can be leveraged to disrupt service availability or recon services to cause additional security incidents. Techniques such as "Data Manipulation" (T1485) would be pertinent as attackers may target specific settings to manipulate domain resolutions.

  The primary data sources for this detection include GCP audit logs specifically tailored for DNS management activities. These logs will detail the methods used for creating, deleting, or modifying DNS zones and provide essential context regarding what prompted those changes.

  ### Investigation Steps
  - **Review Audit Logs**: Inspect the GCP audit logs for any entries related to 'Dns.ManagedZones.Delete', 'Dns.ManagedZones.Update', or 'Dns.ManagedZones.Patch' methods around the time of the alert. Note any unusual patterns or spikes in activity.
  - **Identify User Context**: Determine the identity of users or service accounts that executed the modifications or deletions to assess the legitimacy of their actions. Examine if this behavior aligns with their typical responsibilities.
  - **Cross-Reference IAM Policies**: Check the roles and permissions assigned to users or service accounts involved in the changes to ensure they have appropriate access. Look for any recent changes in IAM policies that may grant excessive permissions.
  - **Assess Related Services**: Consider other services within GCP that may be linked to DNS zones, such as load balancers or compute instances. Investigate any connectivity issues or anomalies that may relate to the DNS changes.

  ### Prioritization
  This alert is deemed medium severity due to the potential impact of unauthorized DNS zone modifications or deletions, which can disrupt services, lead to data exfiltration, or facilitate further attacks. The likelihood increases significantly in environments with frequent changes in personnel or service account permissions.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if audit logging is not configured to capture all relevant DNS-related activity or if logs are retained for insufficient periods. This rule assumes proper IAM controls are in place to prevent unauthorized access to DNS management functions. Additionally, the detection logic depends on comprehensive logging of GCP audit events, which must be enabled and correctly configured for effective monitoring.

