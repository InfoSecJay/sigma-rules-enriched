title: Google Cloud Kubernetes Admission Controller
id: 6ad91e31-53df-4826-bd27-0166171c8040
status: test
description: |
  Identifies when an admission controller is executed in GCP Kubernetes.
  A Kubernetes Admission controller intercepts, and possibly modifies, requests to the Kubernetes API server.
  The behavior of this admission controller is determined by an admission webhook (MutatingAdmissionWebhook or ValidatingAdmissionWebhook) that the user deploys in the cluster.
  An adversary can use such webhooks as the MutatingAdmissionWebhook for obtaining persistence in the cluster.
  For example, attackers can intercept and modify the pod creation operations in the cluster and add their malicious container to every created pod. An adversary can use the webhook ValidatingAdmissionWebhook, which could be used to obtain access credentials.
  An adversary could use the webhook to intercept the requests to the API server, record secrets, and other sensitive information.
references:
- https://cloud.google.com/kubernetes-engine/docs
author: Austin Songer @austinsonger
date: 2021-11-25
modified: 2022-12-18
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.defense-evasion
- attack.persistence
- attack.t1078
- attack.credential-access
- attack.t1552
- attack.t1552.007
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name|startswith: 'admissionregistration.k8s.io.v'
    gcp.audit.method_name|contains:
    - '.mutatingwebhookconfigurations.'
    - '.validatingwebhookconfigurations.'
    gcp.audit.method_name|endswith:
    - 'create'
    - 'patch'
    - 'replace'
  condition: selection
falsepositives:
- Google Cloud Kubernetes Admission Controller may be done by a system administrator.
- If known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This rule detects the execution of admission controllers within Google Cloud Kubernetes environments, particularly when invoking mutating or validating webhooks. Admission controllers are crucial components of Kubernetes that enable administrators to enforce policies at various stages of the API request lifecycle. However, they also pose a risk if exploited by malicious actors aiming to gain persistence or manipulate pod configurations. The threat scenario involves attackers deploying their webhooks to modify requests or intercept sensitive information, such as access credentials.

  The relevant MITRE ATT&CK tactics associated with this rule include:
  - **Initial Access (TA0001)**: Exploiting admission controllers can allow an adversary entry into the Kubernetes cluster.
  - **Persistence (TA0003)**: By utilizing mutating webhooks, attackers can ensure their malicious containers are deployed in every new pod.
  - **Credential Access (TA0006)**: Validating webhooks can be used to capture secrets and credentials passing through API requests.
  - **Defense Evasion (TA0005)**: Attackers may modify requests to obscure their presence and manipulate behavior without detection.

  Primary data sources for this detection include GCP audit logs, which capture Kubernetes API interactions, providing necessary context for investigation and validation of the suspicious activities.

  ### Investigation Steps
  - **Review GCP Audit Logs**: Examine the GCP audit logs focusing on entries related to `admissionregistration.k8s.io` method names, particularly those that include `.mutatingwebhookconfigurations.` and `.validatingwebhookconfigurations.`.
  - **Analyze Admission Controller Configuration**: Inspect the configurations of admission controllers in the Kubernetes cluster to identify any unfamiliar or unauthorized webhooks that may have been deployed.
  - **Validate Pod Deployment Routines**: Check for unusual patterns in pod creation and modification processes that may indicate an attempt to deploy malicious containers.
  - **Monitor Cluster Logs for Sensitive Information Access**: Look for signs of sensitive data exposure or interception attempts, especially through webhooks, that could indicate credential access activities.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized admission controller modifications on the Kubernetes environment, which could lead to significant data breaches or persistent access for adversaries. The likelihood of such activities occurring is elevated, especially in environments with limited monitoring for admission controllers.

  ### Blind Spots and Assumptions
  One gap in detection coverage includes benign configurations made by system administrators, which could lead to false positives if not properly understood. The detection logic assumes that all admission webhook configurations are authorized; therefore, it requires vigilance in monitoring actual deployments. Additionally, accurate GCP audit logs are essential for this alert to function effectively, making it imperative that logging is properly configured and enabled across the Kubernetes cluster.

