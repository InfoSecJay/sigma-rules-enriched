title: Google Cloud Kubernetes Admission Controller
id: 6ad91e31-53df-4826-bd27-0166171c8040
status: test
description: |
  Identifies when an admission controller is executed in GCP Kubernetes.
  A Kubernetes Admission controller intercepts, and possibly modifies, requests to the Kubernetes API server.
  The behavior of this admission controller is determined by an admission webhook (MutatingAdmissionWebhook or ValidatingAdmissionWebhook) that the user deploys in the cluster.
  An adversary can use such webhooks as the MutatingAdmissionWebhook for obtaining persistence in the cluster.
  For example, attackers can intercept and modify the pod creation operations in the cluster and add their malicious container to every created pod. An adversary can use the webhook ValidatingAdmissionWebhook, which could be used to obtain access credentials.
  An adversary could use the webhook to intercept the requests to the API server, record secrets, and other sensitive information.
references:
- https://cloud.google.com/kubernetes-engine/docs
author: Austin Songer @austinsonger
date: 2021-11-25
modified: 2022-12-18
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.defense-evasion
- attack.persistence
- attack.t1078
- attack.credential-access
- attack.t1552
- attack.t1552.007
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name|startswith: 'admissionregistration.k8s.io.v'
    gcp.audit.method_name|contains:
    - '.mutatingwebhookconfigurations.'
    - '.validatingwebhookconfigurations.'
    gcp.audit.method_name|endswith:
    - 'create'
    - 'patch'
    - 'replace'
  condition: selection
falsepositives:
- Google Cloud Kubernetes Admission Controller may be done by a system 
  administrator.
- If known behavior is causing false positives, it can be exempted from the 
  rule.
level: medium
note: |
  ### Technical Context

  This rule detects executions of Kubernetes Admission Controllers that handle requests to the Kubernetes API server, particularly focusing on MutatingAdmissionWebhook and ValidatingAdmissionWebhook actions such as create, patch, and replace. Attackers may leverage these webhooks to gain persistence within a Kubernetes cluster by manipulating pod creation operations or intercepting requests to capture sensitive information such as credentials and secrets.

  Relevant MITRE ATT&CK techniques include **Persistence (T1078)** for establishing ongoing access and **Credential Access (T1552)** for capturing sensitive data. The primary telemetry source is Google Cloud Platform (GCP) audit logs, specifically filtering for entries related to admission controller activities. If malicious, the impact could be significant, leading to unauthorized modifications or data exfiltration. This detection alone does NOT confirm malicious intent, as legitimate administrators may perform similar operations.

  ### Investigation Steps

  - **Review the audit logs for related events:** Check GCP audit logs (resource type: GKE Cluster) for Event ID matching `admissionregistration.k8s.io.v` method names (e.g., `.mutatingwebhookconfigurations.create`). Look for unexpected changes from known administrators or unusual timestamps.

  - **Identify the admitting user or service account:** Examine the field `authenticationInfo.user` in the audit logs to assess who initiated the admission controller events. Cross-reference this with a list of known authorized users or service accounts.

  - **Check for unusual webhook configurations:** Validate the configurations of MutatingAdmissionWebhook and ValidatingAdmissionWebhook against the expected configurations normally deployed in the environment. Use `kubectl get mutatingwebhookconfiguration` and `kubectl get validatingwebhookconfiguration` commands to pull current configurations.

  - **Assess for unauthorized container images:** Investigate whether the pods created during the time of the alert have been modified to include unauthorized or suspicious container images by checking the pod specs through `kubectl get pods -o yaml`.

  - **Correlate with other security detections:** Look for related alerts from other detections that monitor for API server activity or changes within the Kubernetes environment. This can strengthen context and help provide a clearer picture of the activity's legitimacy.

  - **Identify expected benign behavior:** Document and understand how your team typically uses admission controllers for legitimate deployments, such as normal configuration or policy enforcement patterns. This benchmark can help differentiate between expected and anomalous activities.

  ### Prioritization

  The alert is medium severity due to the potential impact of unauthorized access and modification of critical cluster resources. Given the capability of adversaries to exploit admission controllers, this behavior is a known vector for privilege escalation and persistent threats. While not every detection indicates malicious activity, the nature of interaction with Kubernetes admission controllers warrants careful examination.

  ### Blind Spots and Assumptions

  Legitimate administrative activities can easily trigger these alerts, particularly during regular deployments or cluster configuration updates. A limitation includes the need for complete GCP audit log captures to ensure detection reliability, as incomplete logs could lead to missed malicious activity. Adversaries may use evasion techniques such as deploying under the guise of legitimate service accounts or scheduled jobs. A related detection to consider is the monitoring of changes to Kubernetes Role-Based Access Control (RBAC) settings, which can provide additional insights into potential privilege escalation attempts.

