title: Google Cloud Kubernetes Admission Controller
id: 6ad91e31-53df-4826-bd27-0166171c8040
status: test
description: |
  Identifies when an admission controller is executed in GCP Kubernetes.
  A Kubernetes Admission controller intercepts, and possibly modifies, requests to the Kubernetes API server.
  The behavior of this admission controller is determined by an admission webhook (MutatingAdmissionWebhook or ValidatingAdmissionWebhook) that the user deploys in the cluster.
  An adversary can use such webhooks as the MutatingAdmissionWebhook for obtaining persistence in the cluster.
  For example, attackers can intercept and modify the pod creation operations in the cluster and add their malicious container to every created pod. An adversary can use the webhook ValidatingAdmissionWebhook, which could be used to obtain access credentials.
  An adversary could use the webhook to intercept the requests to the API server, record secrets, and other sensitive information.
references:
- https://cloud.google.com/kubernetes-engine/docs
author: Austin Songer @austinsonger
date: 2021-11-25
modified: 2022-12-18
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.persistence
- attack.stealth
- attack.t1078
- attack.credential-access
- attack.t1552
- attack.t1552.007
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name|startswith: 'admissionregistration.k8s.io.v'
    gcp.audit.method_name|contains:
    - '.mutatingwebhookconfigurations.'
    - '.validatingwebhookconfigurations.'
    gcp.audit.method_name|endswith:
    - 'create'
    - 'patch'
    - 'replace'
  condition: selection
falsepositives:
- Google Cloud Kubernetes Admission Controller may be done by a system 
  administrator.
- If known behavior is causing false positives, it can be exempted from the 
  rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of admission controller operations in Google Cloud Kubernetes, specifically when a MutatingAdmissionWebhook or ValidatingAdmissionWebhook is used to intercept requests to the Kubernetes API server. An attacker may utilize these webhooks to persist malicious containers within newly created pods or to access sensitive information by modifying valid requests. The relevant MITRE ATT&CK techniques include Persistence (T1078) and Credential Access (T1552).

  Primary telemetry sources are Google Cloud audit logs (gcp.audit) containing method names related to the creating, patching, or replacing of admission webhook configurations. If malicious, this behavior can lead to unauthorized access, privilege escalation, and potential data exfiltration within the Kubernetes cluster. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions by system administrators may trigger these events.

  ### Investigation Steps

  - **Review admission webhook configurations:**
    Check for any recent changes or additions in Kubernetes API server admission registration logs (gcp.audit). Legitimate configurations should align with the organization's operational standards and not introduce unexpected or unauthorized behaviors.

  - **Identify unusual method calls:**
    Filter gcp.audit logs (Event Type: "admissionregistration.k8s.io.v*" with "create", "patch", "replace") for atypical patterns or entries outside of normal operational hours. Look for alterations that deviate from established webhook activities.

  - **Check for high-risk indicators:**
    Investigate any occurrences of gcp.audit.method_name containing ".mutatingwebhookconfigurations." These are common targets for attackers aiming to inject malicious payloads into pods. Strongly correlate with specific namespaces where sensitive operations occur.

  - **Document legitimate administrative actions:**
    Understand the expected normal activity within the cluster, including routine updates or changes made by system administrators. Review timelines and related activities to differentiate regular maintenance from potentially malicious actions.

  - **Perform artifact validation:**
    Validate log records for unexpected file creation or alteration events in conjunction with webhook activity. Check for any unauthorized access to secret management systems or credential stores that may coincide with the webhook execution.

  ### Prioritization

  This alert has a medium severity rating because it targets Kubernetes configurations that are critical for cluster security and integrity. The likelihood of malicious abuse is noteworthy, as attackers frequently employ admission webhooks for persistence and data access in cloud-native environments. This behavior is known to be weaponized in the exploitation of Kubernetes clusters.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may delete or obfuscate webhook configurations quickly after exploitation, leaving fewer artifacts in logs. Reliable detection requires comprehensive logging of gcp.audit for all admission controller activities, as narrower configurations may miss malicious attempts. Legitimate administrative actions, such as deployments or updates by authorized personnel, could trigger these alerts. A companion detection to enrich coverage could involve monitoring for anomalous Kubernetes role-based access control (RBAC) changes, which may indicate attempts to abuse permissions related to admission configurations.

