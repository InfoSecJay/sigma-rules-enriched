- Exceptions can be added to this rule to filter expected behavior.
level: medium
note: |
  ### Technical Context

  This rule detects modifications or deletions of firewall rules in Google Cloud Platform (GCP), which may indicate unauthorized changes to network security policies. The likely attacker objective is to create an opening in network defenses, facilitating movement within the environment or establishing persistent access. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), with techniques involving **Remote Service Session Hijacking** (T1562).

  The primary telemetry source is GCP audit logs, specifically focusing on actions tied to firewall management using the methods: `Compute.Firewalls.Delete`, `Compute.Firewalls.Patch`, `Compute.Firewalls.Update`, and `Compute.Firewalls.Insert`. If malicious, these changes can compromise the security posture of a cloud environment. Importantly, this detection does NOT confirm that a change was malicious; it only indicates that a firewall rule was altered or removed.

  ### Investigation Steps

  - **Identify the user making the change**: Review GCP audit logs (Log Type: Audit Log) and focus on the `protoPayload.authenticationInfo.principalEmail` field to check the user account responsible for the actions. Compare against known administrator accounts for legitimacy.

  - **Check the timestamp of the change**: Cross-reference the timestamps in GCP audit logs (Field: `insertId`) to verify if the changes occurred during an expected maintenance window or security assessment. Legitimate changes often happen under scheduled change control.

  - **Review related network activities**: Look for correlated changes in GCP network logs (Log Type: VPC Flow Logs) around the same timeframe as the firewall modifications to identify potential exploitation attempts or unauthorized access.

  - **Examine firewall rule changes**: Validate the specific attributes of the modified or deleted rules by analyzing the fields `protoPayload.serviceName`, `protoPayload.methodName`, and `protoPayload.request`. Assess if new rules weaken defenses, such as allowing inbound traffic from untrusted IPs.

  - **Assess the environment context**: Identify the criticality of the affected GCP asset (e.g., production environment vs. staging) to ascertain the potential impact of the firewall modification. Production changes warrant a higher level of scrutiny.

  ### Prioritization

  This alert should be assessed with medium priority. The impact can be significant if the firewall changes result in unauthorized access to sensitive systems, especially in production environments. Given the nature of firewall configurations, this behavior can be widely abused by attackers, though it may also occur during routine administrative tasks.

  ### Blind Spots and Assumptions

  This detection may have limitations around legitimate administrative actions that result in similar alerts, such as planned maintenance or updates. It requires well-configured audit logging in GCP to ensure complete visibility of firewall changes. Legitimate activities, such as scheduled updates or deployments, may inadvertently trigger the alert. Strengthening detection coverage can involve monitoring changes to access control policies alongside firewall alterations to provide a broader context of potential threats.

