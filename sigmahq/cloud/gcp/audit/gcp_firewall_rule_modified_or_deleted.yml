title: Google Cloud Firewall Modified or Deleted
id: fe513c69-734c-4d4a-8548-ac5f609be82b
status: test
description: Detects  when a firewall rule is modified or deleted in Google Cloud
  Platform (GCP).
references:
- https://cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
- https://developers.google.com/resources/api-libraries/documentation/compute/v1/java/latest/com/google/api/services/compute/Compute.Firewalls.html
author: Austin Songer @austinsonger
date: 2021-08-13
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1562
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - v*.Compute.Firewalls.Delete
    - v*.Compute.Firewalls.Patch
    - v*.Compute.Firewalls.Update
    - v*.Compute.Firewalls.Insert
  condition: selection
falsepositives:
- Firewall rules being modified or deleted may be performed by a system administrator.
  Verify that the firewall configuration change was expected.
- Exceptions can be added to this rule to filter expected behavior.
level: medium
note: |
  ### Technical Context
  This rule detects modifications or deletions of firewall rules within the Google Cloud Platform (GCP). Such actions can indicate a potential security breach, particularly if conducted by unauthorized users, suggesting attempts to evade detection by altering network protections like firewalls. Attackers often target firewall configurations to create pathways for unauthorized access, disrupt services, or conceal their activities from security monitoring.

  The relevant MITRE ATT&CK tactics include Defense Evasion, with specific techniques such as T1562: Impair Defense Tools. In this context, the manipulation of firewall rules can allow attackers to mask their presence or facilitate lateral movement within the cloud environment. Primary data sources include GCP audit logs, which detail API activity, including method calls related to firewall rule management.

  ### Investigation Steps
  - **Review Audit Logs:** Examine GCP audit logs for the method names associated with firewall modifications, particularly looking for `v*.Compute.Firewalls.Delete`, `v*.Compute.Firewalls.Patch`, and `v*.Compute.Firewalls.Update`. This will provide long-term context around the firewall's rule changes.
  - **Identify User Context:** Analyze the identity of the user or service account making the changes. Look for anomalies such as changes made by unexpected users or during unusual hours that could indicate unauthorized access.
  - **Cross-reference Changes:** Validate the modified or deleted rules against known approved changes to verify if they were legitimate administrative actions. This step helps eliminate false positives and identifies potentially malicious alterations.
  - **Monitor Network Traffic:** Use network security tools to track any suspicious traffic patterns resulting from the modified or deleted rules. This may help identify ongoing attacks that exploit altered firewall configurations.

  ### Prioritization
  This alert is of medium severity due to the potential for significant impact; unauthorized changes to firewall rules directly affect the organization's security posture and can lead to data breaches or service interruptions. The likelihood of such changes being a precursor to malicious activity warrants immediate investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if GCP audit logging is not enabled uniformly across the environment, or if logs are not retained long enough for review. The detection logic assumes that all legitimate changes to firewall rules are authorized and expected; anomalies should be verified against a change management process. Required logs for the alert include comprehensive audit logs from GCP, which must be configured to capture all relevant API activity associated with firewall management.

