logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - v*.Compute.Firewalls.Delete
    - v*.Compute.Firewalls.Patch
    - v*.Compute.Firewalls.Update
    - v*.Compute.Firewalls.Insert
  condition: selection
falsepositives:
- Firewall rules being modified or deleted may be performed by a system 
  administrator. Verify that the firewall configuration change was expected.
- Exceptions can be added to this rule to filter expected behavior.
level: medium
note: |
  ### Technical Context

  This rule detects modifications or deletions of firewall rules within Google Cloud Platform (GCP) which can indicate unauthorized attempts to bypass security controls or alter network access configurations. An attacker may aim to open a pathway for lateral movement, data exfiltration, or external access to sensitive resources. This behavior fits within the MITRE ATT&CK framework under the Defense Evasion tactic (T1562) and specifically the technique of Impair Defenses (T1685).

  The primary telemetry source for this detection is GCP audit logs, particularly focusing on entries related to firewall actions. If malicious, altering or deleting firewall rules could expose critical resources and increase the attack surface. It is important to note that this detection alone does not confirm malicious activity; legitimate administrative actions by system administrators are common and may trigger this rule.

  ### Investigation Steps

  - **Review audit logs for specific actions**: Check GCP audit logs for log entries with `method_name` that includes `v*.Compute.Firewalls.Delete`, `v*.Compute.Firewalls.Patch`, `v*.Compute.Firewalls.Update`, or `v*.Compute.Firewalls.Insert`. Identify the principal user initiating the action and correlate with expected administrative activities.

  - **Validate timing and context**: Cross-reference the timestamp of the firewall modification against any known change management records or scheduled maintenance activities to determine if the change was anticipated or documented.

  - **Investigate principal identity**: Identify the service account or user that performed the action. Look for accounts with excessive permissions or those that should not have access to modify firewall settings, especially on critical systems.

  - **Check for related network activity**: Analyze traffic logs for any unusual access patterns immediately after the firewall rule changes. Look for increased outbound connections, particularly involving sensitive resources or data exfiltration (e.g., large volume of egress traffic).

  - **Assess valid rule configurations**: Compare the current firewall rules against a baseline configuration or previous known good states. Document legitimate changes and validate their necessity to ensure no unauthorized modifications persist.

  - **Identify any suspicious patterns**: Note if multiple rules were changed or deleted in a short time frame, as this could indicate malicious intent rather than standard operational changes.

  ### Prioritization

  This alert is medium priority due to the potential impact on network defenses and the likelihood that such changes can be weaponized to facilitate malicious activities. Unauthorized modifications can significantly increase the risk to sensitive data and system integrity if left unaddressed.

  ### Blind Spots and Assumptions

  Detection may be limited by the logging configurations in GCP, as auditing must be properly enabled to capture the requisite information. Legitimate activities, such as routine updates or security changes by authorized personnel, may trigger this alert. Additionally, the lack of context about the change could lead to false positives. Monitoring for companion detections related to unauthorized access attempts or abnormal user behavior can provide stronger contextual awareness and coverage against attacks targeting firewall configurations.

