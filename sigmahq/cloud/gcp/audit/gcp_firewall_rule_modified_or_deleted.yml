  ---

  ### Technical Context

  This rule detects modifications or deletions of firewall rules within Google Cloud Platform (GCP), specifically through logging events that indicate changes to firewall configurations. A likely attacker objective could be to weaken the perimeter defenses, allowing for subsequent network-based attacks or lateral movement within cloud environments. This behavior maps to the MITRE ATT&CK tactic Defense Evasion (ID: T1562) wherein an adversary may try to modify security configurations to facilitate their actions unnoticed.

  The primary telemetry sources are GCP audit logs, with specific focus on method names related to firewall changes, such as Compute.Firewalls.Delete, Compute.Firewalls.Patch, and Compute.Firewalls.Update. Malicious modifications could lead to unauthorized access or exposure of sensitive resources. However, it is critical to note that this detection does NOT confirm malicious intent without correlating with contextual information, such as user roles and other log data.

  ---

  ### Investigation Steps

  - **Review relevant audit logs:** Analyze GCP audit logs for Event Types related to firewall changes (gcp.audit) and fields such as method_name, resource, and actor to confirm whether the activity follows expected patterns.

  - **Identify user permissions:** Check the IAM roles of the user or service account that triggered the log to determine if they have the appropriate permissions for modifying firewall rules. Common roles that usually perform such changes include 'roles/compute.securityAdmin'.

  - **Evaluate historical changes:** Compare the current firewall configuration against historical logs, including previous versions, to identify suspicious or unexpected modifications. Use GCP's built-in change history or snapshot features for validation.

  - **Look for other suspicious actions:** Investigate concurrent or prior actions in the same log window, such as unusual instances (Event ID: v*.Compute.Instances.*) or service account access that may indicate a coordinated malicious effort.

  - **Assess benign configurations:** Confirm with system administrators if the firewall changes were communicated and scheduled. Investigate logs from trusted stakeholders to cross-reference legitimate modifications (e.g., maintenance windows).

  - **Validate against exfiltration artifacts:** If changes were made to allow incoming traffic, check for unusual outbound connections (e.g., egress firewall rules) by correlating network flow logs or VPC Flow Logs for suspicious IP addresses or volumes.

  ---

  ### Prioritization

  This alert is significant for enterprise security because unauthorized changes to firewall rules can lead to increased risk of exposure and data breaches. The likelihood of malicious abuse is considerable, especially in cases involving elevated permissions. While such behavior can result from legitimate administrative tasks, the frequency of targeted attacks exploiting firewall misconfigurations makes it a critical area for monitoring.

  ---

  ### Blind Spots and Assumptions

  Detection relies heavily on accurate logging configurations in GCP; if audit logging is insufficient or misconfigured, legitimate activity may evade detection. Evasion techniques may include using a compromised account with admin privileges to mask malicious changes. Legitimate administrators making changes during maintenance windows may trigger this alert. A companion detection to consider is unauthorized access attempts to critical cloud resources, which can provide additional context when analyzing firewall rule modifications.

