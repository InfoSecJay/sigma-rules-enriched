title: Google Cloud Kubernetes RoleBinding
id: 0322d9f2-289a-47c2-b5e1-b63c90901a3e
status: test
description: Detects the creation or patching of potential malicious RoleBinding.
  This includes RoleBindings and ClusterRoleBinding.
references:
- https://github.com/elastic/detection-rules/pull/1267
- https://kubernetes.io/docs/reference/kubernetes-api/authorization-resources/cluster-role-v1/#ClusterRole
- https://cloud.google.com/kubernetes-engine/docs/how-to/role-based-access-control
- https://kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
author: Austin Songer @austinsonger
date: 2021-08-09
modified: 2022-10-09
tags:
- attack.credential-access
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - io.k8s.authorization.rbac.v*.clusterrolebindings.create
    - io.k8s.authorization.rbac.v*.rolebindings.create
    - io.k8s.authorization.rbac.v*.clusterrolebindings.patch
    - io.k8s.authorization.rbac.v*.rolebindings.patch
    - io.k8s.authorization.rbac.v*.clusterrolebindings.update
    - io.k8s.authorization.rbac.v*.rolebindings.update
    - io.k8s.authorization.rbac.v*.clusterrolebindings.delete
    - io.k8s.authorization.rbac.v*.rolebindings.delete
  condition: selection
falsepositives:
- RoleBindings and ClusterRoleBinding being modified or deleted may be performed by
  a system administrator. Verify whether the user identity, user agent, and/or hostname
  should be making changes in your environment.
- RoleBindings and ClusterRoleBinding modified or deleted from unfamiliar users should
  be investigated. If known behavior is causing false positives, it can be exempted
  from the rule.
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying the creation or modification of RoleBindings and ClusterRoleBindings within Google Cloud's Kubernetes environments. Such activities can be indicative of malicious actions, as attackers often attempt to escalate their privileges or gain unauthorized access to sensitive resources within a cluster. By manipulating RoleBindings, threat actors can grant themselves or compromised accounts elevated permissions, which can lead to data exfiltration, lateral movement, or further exploitation of cloud resources.

  The relevant MITRE ATT&CK tactics associated with this rule include **Privilege Escalation (T1068)**, where attackers exploit vulnerabilities to gain increased permissions, and **Credential Access (T1110)**, where they may leverage their elevated permissions to access sensitive credential information. This type of behavior may be observed in attacks where adversaries aim to compromise cloud environments, including instances involving tools and techniques specific to container orchestration attacks.

  Key data sources for evidence include **GCP Audit Logs**, which provide detailed entries about API calls made in the Google Cloud environment, thereby offering insight into potentially malicious RoleBinding activities, as well as user and service account actions that may accompany these changes.

  ### Investigation Steps
  - **Review GCP Audit Logs**: Check audit entries for any RoleBinding or ClusterRoleBinding creation or modification events, focusing on entries related to unexpected user accounts or service accounts that seem out of place.

  - **Analyze User Context**: Investigate the identity of the user or service account performing these actions, looking for unusual access patterns, unfamiliar IP addresses, or geographic locations that might indicate a compromised account.

  - **Inspect Related Resource Changes**: Look for other changes in Kubernetes resources that occurred around the same time as the RoleBinding modifications, such as deployments or services, which might provide context for the intent behind the changes.

  - **Verify Administrative Actions**: Confirm if the detected changes were indeed performed by legitimate system administrators. Understanding the workflow and expected changes can help differentiate between normal administrative activities and potential threats.

  ### Prioritization
  This alert holds medium severity due to the potential impact that unauthorized modifications to RoleBindings and ClusterRoleBindings can have on an enterprise's Kubernetes environment. The likelihood of exploitation is significant, especially in environments where privilege escalation can lead to broader access and control.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where GCP Audit Logging is not fully configured or where audit logs are not retained long enough for historical analysis. This rule assumes that malicious changes are being made by unexpected users; however, legitimate administrative actions may also trigger alerts. It is crucial that auditing is configured correctly and logs are collected from all relevant GCP services for this detection to be effective.

