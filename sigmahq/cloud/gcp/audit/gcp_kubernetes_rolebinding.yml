title: Google Cloud Kubernetes RoleBinding
id: 0322d9f2-289a-47c2-b5e1-b63c90901a3e
status: test
description: Detects the creation or patching of potential malicious 
  RoleBinding. This includes RoleBindings and ClusterRoleBinding.
references:
- https://github.com/elastic/detection-rules/pull/1267
- https://kubernetes.io/docs/reference/kubernetes-api/authorization-resources/cluster-role-v1/#ClusterRole
- https://cloud.google.com/kubernetes-engine/docs/how-to/role-based-access-control
- https://kubernetes.io/docs/reference/access-authn-authz/rbac/
- https://cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
author: Austin Songer @austinsonger
date: 2021-08-09
modified: 2022-10-09
tags:
- attack.credential-access
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - io.k8s.authorization.rbac.v*.clusterrolebindings.create
    - io.k8s.authorization.rbac.v*.rolebindings.create
    - io.k8s.authorization.rbac.v*.clusterrolebindings.patch
    - io.k8s.authorization.rbac.v*.rolebindings.patch
    - io.k8s.authorization.rbac.v*.clusterrolebindings.update
    - io.k8s.authorization.rbac.v*.rolebindings.update
    - io.k8s.authorization.rbac.v*.clusterrolebindings.delete
    - io.k8s.authorization.rbac.v*.rolebindings.delete
  condition: selection
falsepositives:
- RoleBindings and ClusterRoleBinding being modified or deleted may be performed
  by a system administrator. Verify whether the user identity, user agent, 
  and/or hostname should be making changes in your environment.
- RoleBindings and ClusterRoleBinding modified or deleted from unfamiliar users 
  should be investigated. If known behavior is causing false positives, it can 
  be exempted from the rule.
level: medium
note: |
  ### Technical Context

  This rule detects the creation or modification of RoleBindings and ClusterRoleBindings within Google Cloud Kubernetes environments. Attackers may seek to escalate privileges or grant broad access by manipulating RBAC roles, allowing them to execute unauthorized commands or access sensitive resources. This activity is associated with the MITRE ATT&CK tactic of **Credential Access** (TA0006) through techniques such as **Permission Group User** (T1069.001).

  The primary telemetry source for this detection is Google Cloud Audit logs, specifically actions logged under the method names related to role binding modifications. If malicious, these actions can significantly compromise the security of the Kubernetes cluster, enabling attackers to gain unauthorized access. However, this detection does NOT confirm the intent behind the change; benign modifications by authorized administrators can also trigger these alerts.

  ### Investigation Steps

  - **Verify the user identity and action context**: Cross-reference the user making the change against known administrators and their activities. Look at audit logs for timestamp (timestamp) and user identity (actor, email) for **unusual changes**.

  - **Check the modifications made in the ClusterRoleBindings**: Review detailed changes in the roles being granted or modified by examining the specific role definitions (role_ref) in the audit logs. Malicious changes often involve overly broad permissions like "cluster-admin."

  - **Compare against baseline administrative activity**: Identify regular usage patterns by legitimate admins against the detected modification. Look for known users or service accounts performing expected actions and confirm against the logs for IP addresses and user agents.

  - **Assess the cluster environment for possible compromise**: Review other logs such as Kubernetes cluster logs to see if there was unusual activity prior to the RoleBinding modifications, including unexpected pod deployments or access events.

  - **Review for potential cluster exposure configurations**: Investigate audit logs or infrastructure settings for any other signs of misconfiguration that could indicate a broader security issue or a deeper compromise, specifically around exposed services or secrets.

  - **Validate logs and necessary configurations**: Ensure that Google Cloud audit logging is enabled and properly configured to capture RBAC modifications, confirming relevant log entries include event types (method_name) indicating the creation or modification of RoleBindings.

  ### Prioritization

  The alert has medium severity as modifications in RoleBindings or ClusterRoleBindings can lead to escalated privileges or unauthorized access within critical Kubernetes clusters. Given the potential high impact of malicious actions in this space, this behavior is often weaponized, particularly in environments vulnerable to misconfiguration.

  ### Blind Spots and Assumptions

  This detection may miss actions taken through direct API calls if the required logging configuration is not enabled. Legitimate administrative activities could trigger these alerts, particularly during scheduled maintenance or updates. Monitoring for related detections, such as abnormal pod access patterns (e.g., creation of suspicious pods through other alerts), can provide stronger assurance of a malicious event.

