note: |
  ### Technical Context

  This rule detects modifications or deletions of Google Cloud SQL databases, including instances and user accounts. The likely attacker objective is to disrupt services, delete sensitive data, or alter user permissions to gain unauthorized access or control. This behavior aligns with the MITRE ATT&CK tactic of Impact (TA0040), with techniques including Data Destruction (T1485) and Account Access Removal (T1090).

  The primary telemetry sources include GCP Audit logs, specifically focusing on the methods `cloudsql.instances.create`, `cloudsql.instances.delete`, `cloudsql.users.update`, and `cloudsql.users.delete`. If malicious, such activity could lead to data loss or service outages. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions can trigger the same alerts.

  ### Investigation Steps

  - **Identify user actions: ** Review GCP Audit logs for `method_name` fields indicating `cloudsql.instances.delete` or `cloudsql.users.delete` with user identity details in the `user` field. Check for unusual user agents or IP addresses during these operations.

  - **Examine timestamp and frequency:** Ensure the timestamp of the modification or deletion aligns with expected maintenance windows. Frequent or out-of-hours changes can indicate suspicious behavior.

  - **Validate legitimate activity:** Determine if known system administrators executed a database modification or deletion, specifically checking roles and permissions associated with the user identities in the logs.

  - **Check for associated anomalies:** Look for unauthorized changes in user accounts (found using `cloudsql.users.update`), particularly when changes involve role escalations or unexpected user additions.

  - **Correlate with other indicators:** Cross-reference with recent security events or alerts that might indicate a broader attack, such as spikes in access requests to sensitive databases before the modification events.

  ### Prioritization

  This alert is medium severity due to the potential impact on sensitive data and service availability. Any modifications or deletions of databases can significantly affect operations. Given that these actions can be weaponized by malicious insiders or external attackers, they require swift investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative actions to trigger alerts, which could lead to false positives. Reliable detection relies on comprehensive GCP Audit log configuration to capture all relevant actions. Legitimate database modifications by trusted administrators may occur, necessitating careful validation. Related detections, such as unauthorized access alerts to database instances or unusual access patterns, can enhance context and coverage.

