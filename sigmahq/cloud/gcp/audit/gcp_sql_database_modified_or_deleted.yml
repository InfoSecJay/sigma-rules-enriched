note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of Google Cloud SQL databases, which are managed relational databases provided by Google Cloud Platform (GCP). This activity may indicate potential unauthorized changes by threat actors aiming to alter, disrupt, or exfiltrate sensitive data stored within these databases. Such actions may stem from malicious insiders or external attackers exploiting credentials to gain unauthorized access to cloud resources.

  The relevant MITRE ATT&CK tactics include **Impact (TA0040)**, specifically techniques such as **Data Manipulation (T1403)** and **Service Stop (T1489)**. Threat actors may target cloud databases to disrupt business operations, delete critical data, or alter database configurations to achieve broader access or evade detection. Given the sensitive nature of data commonly housed within SQL databases, detecting such alterations is paramount for maintaining data integrity and security.

  Primary data sources for this detection include **GCP audit logs**, which capture API calls and actions taken by users or service accounts within the environment. Monitoring these logs can provide insights into who made changes, the nature of those changes, and any suspicious activities around SQL instances.

  ### Investigation Steps
  - **Review GCP Audit Logs**: Analyze the GCP audit logs for entries related to `cloudsql.instances.delete`, `cloudsql.instances.create`, and `cloudsql.users.update` or `cloudsql.users.delete` methods. Look for unusual patterns or anomalies, especially changes made outside normal operational hours.

  - **Validate User Identity**: Confirm the identity of the user or service account that performed the modifications. Cross-reference this with your organization’s database access policies to determine if they have legitimate reasons for the changes made.

  - **Investigate User Agent and Hostname**: Examine the user agent string and hostname associated with the API calls. Check for suspicious sources, such as unfamiliar IP addresses, and assess if these hosts should have access to your cloud resources.

  - **Conduct Contextual Analysis**: Review recent changes to database configurations and application behavior. Investigate if there are related alerts, such as suspicious credentials being used or unusual login patterns, which might indicate a coordinated attack.

  ### Prioritization
  The severity of this alert is medium, as unauthorized modifications or deletions of a Cloud SQL database can compromise sensitive information and disrupt business processes, making timely detection and response critical to mitigate potential impacts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if audit logs are not retained for a sufficient period or if logging is not appropriately configured across all instances. The detection logic assumes that all changes originate from known entities or systems; however, misuse of valid accounts or misconfigurations can lead to overlooked threats. Adequate configuration of GCP audit logging and permissions management is essential for this alert to function effectively.

