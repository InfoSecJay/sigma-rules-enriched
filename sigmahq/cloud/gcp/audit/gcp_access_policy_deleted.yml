level: medium
note: |
  ### Technical Context
  This alert rule detects the deletion of access policies applied to Google Cloud Platform (GCP) resources, a critical security feature for managing access control effectively. By removing an access policy, an adversary could compromise the integrity of access management, potentially leading to unauthorized access to sensitive cloud resources. The detection focuses on identifying operations that involve the explicit deletion of these access policies, which can signal either malicious activities or misconfigurations.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003), as an attacker may seek to maintain access by manipulating resource access features. Additionally, the technique **T1098: Account Manipulation** can apply, as changes to access policies may allow unauthorized users to assume control over resources within the GCP environment. Primary data sources for correlating suspicious activity would include GCP Audit Logs, specifically looking for entries related to access policy modifications.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze GCP Audit Logs for entries pertaining to access policy deletion, focusing on the `accesscontextmanager.accessPolicies.delete` permission to identify user actions around the time of the alert.
  - **Inspect User Activity**: Assess the identity and role of the user who performed the deletion. Verify if the actions align with their responsibilities and if there have been any recent changes to their account permissions.
  - **Examine Access Levels**: Determine if the deletion of access policies resulted in unauthorized access or significant changes to access levels, and check for any subsequent suspicious activities following the policy modifications.
  - **Check for Contextual Factors**: Look for other changes in GCP settings or configurations around the same time as the deletion, as this could indicate a broader compromise or misconfiguration issue.

  ### Prioritization
  This alert is categorized as medium severity due to the potential impact of unauthorized access resulting from deleted policies. Given that access management is fundamental to maintaining security in a cloud environment, the likelihood of serious repercussions necessitates prompt investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the possibility of legitimate administrative actions leading to false positives, as the deletion of access policies may occur during regular maintenance or restructuring efforts by authorized personnel. The detection logic assumes that all access policy deletions are significant threats; thus, the context in which the deletion occurs can lead to misidentifications. Required logs for this detection to function effectively include comprehensive GCP Audit Logs with adequate retention periods to trace back actions taken within the timeframe under review.

