note: |
  ---

  ### Technical Context

  This Sigma rule detects the deletion of access policies within Google Cloud Platform (GCP), specifically targeting actions associated with the `accesscontextmanager` service. A likely objective of an attacker executing this behavior is to remove controls that restrict access to sensitive cloud resources, potentially paving the way for unauthorized access and exploitation. This activity aligns with the MITRE ATT&CK tactics of Persistence (TA0003) and Privilege Escalation (TA0004), specifically technique T1098 (Account Manipulation).

  The primary telemetry source for this detection is GCP audit logs, specifically focusing on entries where `data.protoPayload.serviceName` is `accesscontextmanager.googleapis.com`. If malicious in nature, this behavior could lead to significant security implications, such as unauthorized access to sensitive data or further privilege escalation. However, it's important to note that this detection alone does not confirm malicious intent, as legitimate administrative activities may also trigger the alert.

  ---

  ### Investigation Steps

  - **Check Audit Logs for Deletion Events:** Review GCP audit logs (Log type: Cloud Audit Logs) for entries with `methodName` indicating deletions (e.g., `accesscontextmanager.accessPolicies.delete`, `accesscontextmanager.accessPolicies.accessLevels.delete`). Confirm if the actor had appropriate permissions for legitimate administrative tasks.

  - **Correlate Event Timestamps:** Determine the time of the deletion event and cross-reference with other logs. Look for any unusual or unauthorized access to GCP resources within a 1-2 hour window before the deletion (`timestamp` field in logs) which may indicate malicious intent.

  - **Inspect User Actions:** Analyze the `authPrincipalEmail` field in the log entry to identify the user who issued the delete command. Compare this against a list of known administrators to assess the legitimacy of the action. Unexpected or unfamiliar accounts may indicate compromise.

  - **Validate Policy Changes:** For the deleted access policy, check previous configurations (saved in version histories) to understand the implications of the deletion on resource access. This validation assists in determining potential impacts of unauthorized deletions.

  - **Review Related Automated Processes:** Investigate any scripts or automation running in the environment that may perform legitimate access management activities. Identification of legitimate processes can provide context for certain deletions and may reduce false positives.

  - **Identify Misconfigurations:** Examine current GCP IAM settings and service accounts for possible misconfigurations that could allow excessive permissions. Confirm that no unintended changes occurred prior to the deletion event.

  ---

  ### Prioritization

  The severity of this alert is medium due to the impact it could have on sensitive resource access within GCP environments. While this removal of access policies is a significant red flag, it can occur in both legitimate administrative functions or malicious contexts. However, the ability to manipulate access controls can be weaponized frequently by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if auditing is not fully enabled across all GCP services or if logs are not retained for a sufficient period. Evasion techniques may include legitimate API access employed to manipulate policies that could mask unauthorized actions. Legitimate administrative activities, such as policy updates by authorized personnel, may also trigger this alert. A related detection to consider is monitoring for unexpected changes in IAM roles (audit logs for `iam.googleapis.com`), which could further enhance security coverage.

