title: GCP Access Policy Deleted
id: 32438676-1dba-4ac7-bf69-b86cba995e05
status: test
description: |
  Detects when an access policy that is applied to a GCP cloud resource is deleted.
  An adversary would be able to remove access policies to gain access to a GCP cloud resource.
references:
- https://cloud.google.com/access-context-manager/docs/audit-logging
- https://cloud.google.com/logging/docs/audit/understanding-audit-logs
- https://cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
author: Bryan Lim
date: 2024-01-12
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    data.protoPayload.authorizationInfo.permission:
    - 'accesscontextmanager.accessPolicies.delete'
    - 'accesscontextmanager.accessPolicies.accessLevels.delete'
    - 'accesscontextmanager.accessPolicies.accessZones.delete'
    - 'accesscontextmanager.accessPolicies.authorizedOrgsDescs.delete'
    data.protoPayload.authorizationInfo.granted: 'true'
    data.protoPayload.serviceName: 'accesscontextmanager.googleapis.com'
  condition: selection
falsepositives:
- Legitimate administrative activities
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of GCP access policies related to cloud resources. An adversary may aim to remove these policies to gain unauthorized access to resources, potentially allowing for further exploitation within the GCP environment. This behavior aligns with the MITRE ATT&CK tactic “Persistence” (TA0003) and the technique “Exploitation of Trust Relationships” (T1098). The primary telemetry source for this detection is GCP Audit logs, specifically the logs from the Access Context Manager service.

  If successful, the deletion of access policies could lead to significant security impacts, such as unauthorized access to sensitive data or resources. However, this detection alone does not confirm malicious intent; legitimate administrative activities can trigger the same alert.

  ### Investigation Steps

  - **Review audit logs for deletion events:**
    Check GCP Audit logs for Event Name entries indicating the deletion of access policies (e.g., `accesscontextmanager.accessPolicies.delete`), focusing on fields `protoPayload.serviceName` and `protoPayload.methodName`.

  - **Verify the user initiating the deletion:**
    Analyze the `protoPayload.authenticationInfo.principalEmail` to identify users who initiated the deletion. Cross-reference against known administrative personnel to distinguish benign actions from potential malicious insiders.

  - **Assess the timing and context of deletions:**
    Look for patterns in the timing of policy deletions. Legitimate activity may occur during scheduled maintenance hours, while suspicious deletions may occur outside of business hours.

  - **Check for modifications to policy structures:**
    Review the preceding logs to determine if related policies were altered (e.g., added or modified) before deletion, as this could indicate a malicious workflow.

  - **Identify approved change requests:**
    Verify if there are corresponding change requests or communication (via service tickets, emails, etc.) related to the deletion from authorized personnel. Lack of approval may signify an unauthorized action.

  - **Monitor other related administrative actions:**
    Analyze for related modifications to access levels or zones around the same time. Multiple policy changes or deletions in a short timeframe may indicate a coordinated attack.

  ### Prioritization

  This alert holds medium severity due to the potential impact on GCP resources if accessed maliciously. The likelihood of abuse is moderate, as the deletion of access policies is a common step in both exploitation and privilege escalation workflows. While not definitively malicious, it warrants careful tracking and analysis.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations. Internal policies could lead to legitimate deletions that generate alerts, causing potential false positives. Additionally, adversaries may employ techniques to mask their activities, such as using accounts with legitimate administrative privileges. A related detection to consider for coverage is monitoring for the creation of new roles or service accounts which may follow unauthorized policy deletions.

