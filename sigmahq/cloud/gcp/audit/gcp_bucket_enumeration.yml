note: |
  ### Technical Context

  This rule detects the enumeration of Google Cloud Storage (GCS) buckets, specifically focusing on the API methods `storage.buckets.list` and `storage.buckets.listChannels`. An attacker may leverage this information gathering to identify potential targets for further attacks, such as data exfiltration or privilege escalation. This behavior aligns with the MITRE ATT&CK tactic **Discovery** (TA0017) and technique **Cloud Service Enumeration** (T1086). The primary telemetry source for this detection comes from GCP audit logs, which record API calls made within the environment.

  If malicious, the enumeration of GCS buckets may facilitate unauthorized access to sensitive data, leading to severe data breaches or misuse of cloud resources. Importantly, this detection alone does not confirm a malicious compromise; rather, it indicates a need for further investigation into the context around the enumeration event.

  ### Investigation Steps

  - **Check Event Logs for Enumeration Details:** Review GCP audit logs for entries with `method_name` as `storage.buckets.list` or `storage.buckets.listChannels`. Look for user identities and the associated timestamps to understand the context of the call.

  - **Identify Unusual User Behavior:** Analyze the user identity making the retrieval request. If it originates from an unfamiliar or unexpected user or service account, flag it for further investigation.

  - **Validate Normal Administrator Activity:** Confirm whether the detected GCS enumeration corresponds with scheduled maintenance, operational scripts, or known administrative tasks performed by legitimate users or accounts. Document expected user roles engaging in such activities.

  - **Review User Agent Logs:** Investigate the user agent associated with the event in the audit logs. Legitimate administrative actions usually come from recognized user agents, while anomalous agents may indicate malicious activity.

  - **Determine Bucket Sensitivity:** Assess the sensitivity of the buckets being enumerated by checking associated metadata. Public or sensitive buckets being accessed without proper authority imply a higher risk.

  - **Cross-Reference Network Activity:** Inspect VPC logs or firewall logs around the same time to check for any suspicious ingress or egress traffic that could indicate data exfiltration attempts after the enumeration.

  ### Prioritization

  This alert has a low severity in an enterprise context, as enumeration alone does not imply immediate threat but indicates a reconnaissance phase. However, the potential for malicious exploitation exists, particularly if coupled with unauthorized access attempts. The likelihood of this behavior being weaponized can be moderate if bucket names suggest sensitive targets or if followed by further API calls indicating malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging for GCP resources is inadequately configured or if certain API calls do not register as logs, possibly due to internal policy changes. Legitimate activities, such as standard cloud provisioning or security assessments by admins, may trigger this alert. A companion detection to strengthen coverage would be monitoring for unauthorized access attempts following bucket enumeration, such as through GCS object access logging (Object Level Access Control).

