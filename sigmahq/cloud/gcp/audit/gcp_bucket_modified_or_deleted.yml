falsepositives:
- Storage Buckets being modified or deleted may be performed by a system 
  administrator. Verify whether the user identity, user agent, and/or hostname 
  should be making changes in your environment.
- Storage Buckets modified or deleted from unfamiliar users should be 
  investigated. If known behavior is causing false positives, it can be exempted
  from the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of Google Cloud Storage buckets, specifically targeting operations such as insertion, deletion, updating, or patching of storage bucket configurations. The likely objective of an attacker triggering this alert would be to manipulate or exfiltrate sensitive data, disrupt service availability, or perform illegal data deletions as part of an attack lifecycle phase. This behavior corresponds to the MITRE ATT&CK tactic "Impact" (TA0040), specifically techniques such as "Data Destruction" (T1485) and "Data Manipulation" (T1486).

  The primary telemetry source consists of Google Cloud Audit logs, specifically the gcp.audit logs that record API call details, including the method names of operations performed on storage buckets. If malicious, these actions could result in unauthorized access to or loss of critical business data. This detection rule does NOT confirm malicious intent on its own; it merely indicates that relevant operations have occurred that require further investigation.

  ### Investigation Steps

  - **Review affected user identity:**
    Examine the `userIdentity.email` field in the gcp.audit logs to identify the account responsible for the actions. Look for any unfamiliar accounts or those not typically associated with bucket management tasks.

  - **Extract event details:**
    Collect logs for the specific `method_name` events using `method_name: storage.buckets.delete`, `storage.buckets.insert`, `storage.buckets.update`, and `storage.buckets.patch`. Cross-reference with Event Timestamp to determine if any occur outside of normal operational hours.

  - **Identify legitimate changes:**
    Investigate the context of the changes by reviewing the associated metadata fields such as `serviceData.bucket.traitType` and `serviceData.bucket.traitValue`. Document all legitimate business activities that could justify the modifications, such as scheduled maintenance or policy updates that were communicated.

  - **Check for additional audit details:**
    Review the `serviceData.authorizationInfo` field for groups associated with the user who made the changes to ensure they typically have permissions to perform such actions. Cross-reference permission roles with Google IAM settings.

  - **Assess for high-confidence malicious indicators:**
    Look for repeated deletion or modification events in a short time frame or from a user who does not typically perform these actions. Anomalous patterns in `userAgent` or a high sequence of operations can indicate scripted or malicious activity.

  - **Validate data exfiltration indicators:**
    Check for unusual outbound API calls or bucket access patterns (e.g., excessive GET requests or download actions) prior to or after the modification event. Verify using gcp.audit for download operations that may indicate data extraction.

  ### Prioritization

  This alert is rated medium severity due to the critical nature of cloud storage management within an enterprise. The potential impact of unauthorized access to or loss of data is significant, and such actions are often weaponized by adversaries to disrupt services or exfiltrate sensitive information.

  ### Blind Spots and Assumptions

  Detection may be limited by role-based access controls in place that allow legitimate administrators to modify or delete buckets, which could lead to false positives. Ensure gcp.audit logging is fully enabled to capture all relevant actions reliably. Legitimate DevOps or IT changes may also trigger this alert, especially during maintenance windows. A companion detection involves monitoring for unusual API call patterns (e.g., excessive read requests) that may further elucidate potential malicious behaviors preceding an alert for bucket modifications.

