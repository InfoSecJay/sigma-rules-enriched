title: Google Cloud Kubernetes CronJob
id: cd3a808c-c7b7-4c50-a2f3-f4cfcd436435
status: test
description: |
  Identifies when a Google Cloud Kubernetes CronJob runs in Azure Cloud. Kubernetes Job is a controller that creates one or more pods and ensures that a specified number of them successfully terminate.
  Kubernetes Job can be used to run containers that perform finite tasks for batch jobs. Kubernetes CronJob is used to schedule Jobs.
  An Adversary may use Kubernetes CronJob for scheduling execution of malicious code that would run as a container in the cluster.
references:
- https://cloud.google.com/kubernetes-engine/docs
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- https://kubernetes.io/docs/concepts/workloads/controllers/job/
author: Austin Songer @austinsonger
date: 2021-11-22
modified: 2022-12-25
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - io.k8s.api.batch.v*.Job
    - io.k8s.api.batch.v*.CronJob
  condition: selection
falsepositives:
- Google Cloud Kubernetes CronJob/Job may be done by a system administrator.
- If known behavior is causing false positives, it can be exempted from the 
  rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Google Cloud Kubernetes CronJobs within a cluster, which can be an indicator of adversarial activity, as attackers may schedule malicious tasks using CronJobs. The objective could be to automate processes such as data exfiltration, payload delivery, or further propagation within the environment. This behavior aligns with the MITRE ATT&CK tactics of Persistence (TA0003), Privilege Escalation (TA0004), and Execution (TA0002) using the techniques for Scheduled Task/Job (T1053).

  The primary telemetry sources include GCP audit logs, specifically looking for events where the `method_name` corresponds to Job or CronJob executions. If malicious, the impact includes further exploitation of the Kubernetes environment, potential data loss, or operational disruption. It is important to note that this detection does NOT confirm malicious activity on its own; legitimate system administrators may also schedule CronJobs.

  ### Investigation Steps

  - **Verify the details of the CronJob execution:** Examine GCP audit logs for Event Type `io.k8s.api.batch.v*.CronJob` with fields including `project_id`, `user`, and `timestamp`. Compare the user executing the job against known administrators. Legitimate execution typically comes from known service accounts or administrators performing scheduled maintenance.

  - **Cross-reference identifying information:** Identify the creator of the CronJob using the field `requestPrincipal`. Document if this user is part of an authorized administrative role; unexpected users may indicate a compromise.

  - **Check for unusual execution patterns:** Look for CronJobs that run at odd hours or with high frequency by analyzing the `schedule` field in the GCP audit logs. Legitimate CronJobs often have predictable schedules aligned with business operations.

  - **Determine the impact of the CronJob:** Review the container image used by the CronJob with the field `requestBody` for any known malicious images or unusual repository sources. High-confidence indicators include the usage of images from untrusted or unknown repositories.

  - **Investigate subsequent Pod activity:** Assess any Pods created by the CronJob using `io.k8s.api.batch.v*.Job` logs. Check for suspicious activity such as high resource usage or network requests to external IPs, especially if they correspond to short-lived (ephemeral) jobs.

  - **Document relationships to prior activities:** Consider potential lateral movement or access to sensitive data if the CronJob accesses critical resources, recorded in the Kubernetes resource access logs or IAM policy logs.

  ### Prioritization

  The alert severity is medium due to the potential for impact on core cloud infrastructure through automation of malicious activities. Given that CronJobs can be leveraged for various purposes, including data theft or arbitrary code execution, the likelihood of misuse is significant, particularly in environments with less stringent access controls.

  ### Blind Spots and Assumptions

  Detection limitations may arise from misconfigurations in GCP audit logging, potentially resulting in missing logs for CronJob execution. Legitimate activities that may trigger the alert include regular maintenance tasks or scheduled reporting jobs by system administrators. A companion detection to strengthen coverage includes monitoring for abnormal network traffic from Pods created by these Jobs, as well as any unauthorized changes to Kubernetes RBAC permissions that might indicate privilege escalation attempts.

