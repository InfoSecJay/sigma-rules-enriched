note: |
  ### Technical Context

  This Sigma rule detects the deployment of Kubernetes workloads using the break-glass flag, which allows users to bypass Binary Authorization controls within Google Cloud Platform (GCP). Such actions are typically indicative of attempts to deploy potentially unsafe or unauthorized containers, often with the objective of avoiding security protocols for privilege escalation or malicious activities. The relevant MITRE ATT&CK tactic is **Defense Evasion (T1548)**, specifically related to **Application Layer Protocol Tactics (T1071)** and **Privilege Escalation.**

  The primary telemetry source is GCP Audit Logs, specifically looking for activities related to Kubernetes clusters. If malicious, the potential impact includes unauthorized access, the execution of harmful code within the Kubernetes environment, or lateral movement within the cloud infrastructure. It’s important to note that this detection does NOT confirm that the workloads are malicious on their own; they may be legitimately deployed if conducted under proper administrative protocols.

  ### Investigation Steps

  - **Review GCP Audit Logs for Kubernetes Pod Creation Events:** Check for entries with `Event ID: cloudaudit.googleapis.com/activity`, focusing on `data.protoPayload.methodName: 'io.k8s.core.v1.pods.create'`. Look for use of the break-glass flag in the `data.protoPayload.resource.labels` field.

  - **Identify User Context and Execution Time:** Examine the `data.protoPayload.authenticationInfo.principalEmail` field to determine who initiated the deployment. Confirm whether this user is authorized to perform such actions and validate the time of the event against known maintenance windows for legitimate deployments.

  - **Correlate Deployment with Previous Audit Trails:** Cross-reference the current activity with historical logs under the same project or cluster. Look for a sudden spike in deployment activities or irregularities in container images used, especially those outside of standard organization protocols.

  - **Assess Image Repository and Usage:** Validate the container image used during the deployment against a trusted source. If the image contains tags indicating known vulnerability (`data.protoPayload.resource.labels.image`), this could raise confidence in malicious intent.

  - **Monitor for Subsequent Unusual Network Activities:** After identifying a break-glass pod deployment, watch for unexpected outbound connections or internal service communications via logs like `GCP VPC Flow Logs`. Legitimate deployments should maintain expected communication patterns.

  ### Prioritization

  This alert is of medium severity as the affected system is a Kubernetes cluster that can host multiple critical workloads. While not all break-glass deployments are malicious, they pose significant risks if abused, especially as such methods are increasingly weaponized by adversaries to conduct privilege escalation or evade security policies.

  ### Blind Spots and Assumptions

  Detection limitations exist, especially if necessary audit logging is disabled or if break-glass flag usage is masked under valid user activity. Legitimate activities could include emergency deployments for critical service recovery or testing environments. A related detection to consider is deployment of unauthorized images (detected through regular image scanning logs), which would bolster coverage against this type of abuse.

