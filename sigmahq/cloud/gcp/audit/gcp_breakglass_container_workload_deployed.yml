note: |
  ### Technical Context

  This rule detects the deployment of Kubernetes workloads using break-glass overrides, which bypass Binary Authorization controls in Google Cloud Platform (GCP). The likely attacker objective is to deploy unauthorized or malicious workloads by circumventing established security measures. This behavior fits within the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and the technique of Valid Accounts (T1078), specifically through manipulation of existing Kubernetes configurations.

  The primary telemetry source for this rule is GCP cloud audit logs. Key log types include `cloudaudit.googleapis.com/activity`, specifically monitoring method calls to `io.k8s.core.v1.pods.create`. If the action is malicious, it can lead to unauthorized access, potentially enabling lateral movement or data breach. This detection does NOT confirm malicious intent outright; it may also capture legitimate and operational situations.

  ### Investigation Steps

  - **Examine audit logs for Kubernetes actions:** Look for GCP audit logs with `logName` set to `cloudaudit.googleapis.com/activity`. Filter for `resource.type` as `k8s_cluster` and `methodName` as `io.k8s.core.v1.pods.create`. Analyze the timestamps and user identities associated with these events.

  - **Identify the use of break-glass flag:** Check if the workload deployment includes the keyword `image-policy.k8s.io/break-glass` in the parameters. If found, this could indicate a possible bypass of Binary Authorization controls that should be closely reviewed.

  - **Compare against known legitimate deployments:** Investigate recent deployments in the same Kubernetes cluster to discern expected patterns. Legitimate break-glass usage typically follows an approved procedure, ideally documented and reviewed by relevant security teams.

  - **Assess user roles and permissions:** Review IAM roles for the user or service account initiating the deployment. Cross-reference with expected responsibilities to validate if the account had legitimate authorization for deploying under such conditions.

  - **Look for related deployments in proximity:** Investigate deployments around the same timestamp. Multiple break-glass flags used within a short time may signify a coordinated attempt, providing high confidence for malicious activity.

  ### Prioritization

  This alert warrants medium severity due to the potential impact on critical systems where unauthorized pods may disrupt operations or introduce vulnerabilities. The likelihood of malicious abuse increases when break-glass flags are used irresponsibly or in patterns typical of scripted deployment attacks. These overrides are known vectors for exploitation, underscoring the need for immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via controlled break-glass processes by insiders or misconfigured services that depend on Kubernetes. Reliable detection necessitates proper GCP audit logging configurations, without which activities may go undetected. Legitimate maintenance operations, especially during incident response scenarios, could trigger these alerts. Companion detections integrating `k8s.pods.delete` logs can provide additional context for unusual pod lifecycle events.

