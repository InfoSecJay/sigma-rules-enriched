note: |
  ### Technical Context
  This rule detects the unauthorized deployment of Kubernetes workloads in Google Cloud Platform (GCP) that utilize the "break-glass" flag to bypass Binary Authorization controls. This break-glass flag is intended for emergency situations, allowing risky actions that normally would be restricted, and its misuse can lead to security lapses and exposure to vulnerabilities in production environments. Attackers may exploit this capability to deploy malicious containers or further their objectives without validation, possibly leading to code injection, lateral movement, or data exfiltration.

  Relevant MITRE ATT&CK tactics and techniques impacted by this behavior include **Privilege Escalation (TA0004)** and **Defense Evasion (TA0005)**. Specifically, technique **T1548 - Abuse Elevation Control Mechanism** applies as attackers could misuse this break-glass mechanism to escalate privileges while avoiding existing security measures. The primary data sources for effective detection of this behavior are GCP's audit logs, where detailed information on Kubernetes pod creations is logged.

  ### Investigation Steps
  - **Review Audit Logs:** Check the GCP audit logs for entries that show the creation of Kubernetes pods and look specifically for the `break-glass` flag in the associated metadata.
  - **Analyze Deployment Context:** Investigate the context in which the break-glass flag was used, focusing on who initiated the deployment, when it occurred, and what the specified images are. Look for anomalies in the timing of deployments or the user accounts involved.
  - **Identify Risky Images:** Examine the container images that were deployed. Determine if these images are trusted and align with organizational policies, or if they are potentially malicious or unvetted.
  - **Cross-Reference Policies:** Validate the deployment against organizational Binary Authorization policies to assess whether required security checks were bypassed and investigate potential policy misconfigurations.

  ### Prioritization
  The alert is assigned a medium severity due to its potential for severe impact if exploited, as it allows deployment of unvalidated code that can introduce vulnerabilities to critical services. The likelihood of misuse is significant, considering the utility of the break-glass flag in time-sensitive scenarios.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the audit logging for Kubernetes resources is not fully enabled or if access logs do not capture all necessary activities. An assumption made by the detection logic is that any instance of the break-glass flag implies malicious intent, which may not always be the case; legitimate emergency situations also exist. The effectiveness of this alert relies on the configuration of GCP audit logs and the retention of relevant data types to ensure comprehensive monitoring of Kubernetes activities.

