logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - v*.Compute.PacketMirrorings.Get
    - v*.Compute.PacketMirrorings.Delete
    - v*.Compute.PacketMirrorings.Insert
    - v*.Compute.PacketMirrorings.Patch
    - v*.Compute.PacketMirrorings.List
    - v*.Compute.PacketMirrorings.aggregatedList
  condition: selection
falsepositives:
- Full Network Packet Capture may be done by a system or network administrator.
- If known behavior is causing false positives, it can be exempted from the 
  rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects actions related to Google Cloud Platform (GCP) packet mirroring, which can be exploited to perform full network traffic packet captures, allowing potential access to sensitive unencrypted internal communications. The likely attacker objective is to gather sensitive data in transit, which aligns with the MITRE ATT&CK tactic of Collection (T1074). Primary telemetry sources include GCP audit logs specifically focused on packet mirroring events, notably methods such as `Compute.PacketMirrorings.Get`, `Insert`, and `Delete`. If malicious, this activity can lead to serious data breaches and exposure of confidential information. It is crucial to note that this detection does NOT, on its own, confirm that data was successfully captured or exfiltrated.

  ### Investigation Steps

  - **Review GCP Audit Logs**: Check GCP audit logs for Event types related to packet mirroring. Focus on Event ID associated with `v*.Compute.PacketMirrorings.*`. Look for unusual accounts or timings that deviate from normalized admin actions.

  - **Identify Legitimate Packet Mirroring Use**: Confirm expected packet mirroring configurations by reviewing asset documentation. Documented internal traffic packet captures by system administrators during maintenance should have clear justification and logs showing regular operational usage.

  - **Check for Unauthenticated Access**: Analyze if any unexpected service accounts or users executed the packet mirroring operations. Focus on fields like `actor.email` or `caller_ip` in audit logs to determine if the behavior aligns with known entities.

  - **Correlate with Network Traffic**: Use internal network monitoring tools to verify if there are unencrypted communications during the times of detected packet mirroring actions. Analyze if sensitive data flows align and confirm packet captures did not occur.

  - **Validate Configuration Changes**: Look for events indicating modifications in mirroring settings. Events such as `Compute.PacketMirrorings.Patch` or `Delete` can suggest attempts to hide malicious activities. Ensure these operations have justifiable contexts from an administrative perspective.

  ### Prioritization

  The alert severity is medium due to the potential impact of sensitive data interception if malicious activity is confirmed. While packet mirroring is a legitimate tool for network analysis, its misuse for unauthorized data collection or exfiltration poses significant security risks, especially in environments handling sensitive information.

  ### Blind Spots and Assumptions

  Legitimate packet capture activities, performed by system or network administrators, might trigger this alert, leading to possible false positives. The detection is limited if audit logging is not properly configured to capture all relevant packet mirroring actions. A related detection to enhance coverage would include monitoring for anomalous API calls or data exfiltration using GCP data access logs.

