title: Google Full Network Traffic Packet Capture
id: 980a7598-1e7f-4962-9372-2d754c930d0e
status: test
description: Identifies potential full network packet capture in gcp. This feature
  can potentially be abused to read sensitive data from unencrypted internal traffic.
references:
- https://cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
- https://developers.google.com/resources/api-libraries/documentation/compute/v1/java/latest/com/google/api/services/compute/Compute.PacketMirrorings.html
author: Austin Songer @austinsonger
date: 2021-08-13
modified: 2022-10-09
tags:
- attack.collection
- attack.t1074
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - v*.Compute.PacketMirrorings.Get
    - v*.Compute.PacketMirrorings.Delete
    - v*.Compute.PacketMirrorings.Insert
    - v*.Compute.PacketMirrorings.Patch
    - v*.Compute.PacketMirrorings.List
    - v*.Compute.PacketMirrorings.aggregatedList
  condition: selection
falsepositives:
- Full Network Packet Capture may be done by a system or network administrator.
- If known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify potential unauthorized attempts to implement full network packet capture within Google Cloud Platform (GCP). Packet capturing can be exploited by attackers to intercept sensitive information from unencrypted internal traffic, which might include confidential data, credentials, or proprietary communications. Malicious actors may leverage this feature for data exfiltration or reconnaissance, significantly jeopardizing organizational security.

  The relevant MITRE ATT&CK tactics for this rule include **Collection (TA0011)** and **Data from Information Repositories (T1074)**. The intention behind using packet mirroring features could potentially align with reconnaissance and data gobbling efforts by threat actors. Detecting unauthorized packet mirroring activity is crucial for understanding both preventative measures and incident responses to potential data breaches.

  Primary data sources for this detection will be the GCP audit logs, particularly focusing on entries related to Packet Mirroring API calls. Monitoring these logs can provide insights into actions taken by users, including changes made regarding packet capture configurations which may indicate improper use.

  ### Investigation Steps
  - **Review GCP Audit Logs**: Examine GCP audit logs for calls to the Packet Mirroring API functions (Get, Insert, Delete, Patch, List). Pay close attention to the user accounts making these calls to identify any unauthorized access.

  - **Correlate with User Activity**: Investigate the context around any packets being captured by correlating the audit log events with the activities of the users who invoked the packet capture methods. Determine if these activities were conducted during expected or permitted operational times.

  - **Assess Network Configurations**: Evaluate the existing firewall rules, network configurations, and overall cloud infrastructure security posture. Look for any explicitly allowed ingress or egress rules that may indicate an intention to exfiltrate data through captured packets.

  - **Monitor for Patterns**: Establish baselines for normal packet capture activity to help identify unusual patterns or spikes in packet capture requests that may suggest malicious behavior.

  ### Prioritization
  The alert is categorized as medium severity due to the potential risk posed by unauthorized packet capture, which could lead to substantial confidential data exposure. Given that such actions may not always represent legitimate administrative activity, they require prompt investigation.

  ### Blind Spots and Assumptions
  Detection logic may miss legitimate administrative activities that require packet mirroring, especially in environments where cloud administrators routinely monitor traffic for performance or security assessments. Additionally, if packet capture is a known behavior (e.g., for security analysis), these alerts may generate false positives. The functionality of this alert depends on proper logging configurations, specifically enabling detailed audit logs within GCP. If audit logging is not adequately configured, detection may be incomplete.

