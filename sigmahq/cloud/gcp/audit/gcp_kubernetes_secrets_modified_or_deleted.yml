title: Google Cloud Kubernetes Secrets Modified or Deleted
id: 2f0bae2d-bf20-4465-be86-1311addebaa3
status: test
description: Identifies when the Secrets are Modified or Deleted.
references:
- https://cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
author: Austin Songer @austinsonger
date: 2021-08-09
modified: 2022-10-09
tags:
- attack.credential-access
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection:
    gcp.audit.method_name:
    - io.k8s.core.v*.secrets.create
    - io.k8s.core.v*.secrets.update
    - io.k8s.core.v*.secrets.patch
    - io.k8s.core.v*.secrets.delete
  condition: selection
falsepositives:
- Secrets being modified or deleted may be performed by a system administrator. 
  Verify whether the user identity, user agent, and/or hostname should be making
  changes in your environment.
- Secrets modified or deleted from unfamiliar users should be investigated. If 
  known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context

  This rule detects modifications or deletions of Kubernetes Secrets within Google Cloud, which are sensitive objects used to store and manage sensitive information (e.g., passwords, OAuth tokens). An adversary may target these secrets to gain unauthorized access to applications or services relying on them, aligning with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique of Exfiltration of Information (T1560). The primary telemetry source is GCP audit logs with event types relating to Kubernetes secret management actions.

  If malicious, the modification or deletion of secrets can lead to credential leakage or service disruption, posing a significant security risk. However, this detection does NOT confirm unauthorized access by itself, as legitimate system administrators may perform these actions as part of routine management tasks.

  ### Investigation Steps

  - **Check user identity and context:** Review the `protoPayload.authenticationInfo.email` field in GCP audit logs (Event Type: `gcp.audit`) to identify the user making the change. Verify if the user is known and authorized to manage secrets.

  - **Review modification history:** Analyze Kubernetes Cluster logs, focusing on the `io.k8s.core.v*.secrets.update` and `io.k8s.core.v*.secrets.delete` events. Look for changes that do not align with normal operational procedures or the owner of the Secret.

  - **Correlate with application behavior:** Identify which applications depend on the modified or deleted secrets. Review application logs for any anomalies or service failures post-modification, which may indicate exploitation attempts.

  - **Identify high-confidence malicious indicators:** Look for actions performed by unfamiliar users (e.g., service accounts or external users) that are associated with secret modifications. Cross-reference the `protoPayload.metadata` user agent and IP addresses against your environment’s typical usage patterns.

  - **Determine legitimate activity:** Validate that authorized administrators perform modifications within expected time windows and patterns, especially when making changes during scheduled maintenance.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems relying on Kubernetes Secrets. Although insider threats and misconfigured service accounts might misuse this action, unauthorized modification or deletion of secrets has become a common tactic for credential abuse, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Limitations include potential evasion by insiders who might perform legitimate actions while modifying secrets during expected maintenance windows. Required logs include GCP audit logs configured with adequate retention to reveal historical changes. Legitimate activities may arise when administrators update secrets to maintain or increase security posture. A related detection might include alerts for unauthorized access to Kubernetes API calls, enhancing coverage of suspicious activity trends around secret management.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
