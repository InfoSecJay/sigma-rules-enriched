note: |
  ### Technical Context
  This detection rule identifies when Kubernetes Secrets are modified or deleted within Google Cloud Platform (GCP). Kubernetes Secrets store sensitive information like passwords, OAuth tokens, and SSH keys, making them prime targets for attackers seeking to escalate privileges or perform lateral movement within an environment. The suspected threat scenario involves a malicious insider or external attacker attempting to manipulate or remove Secrets to either disrupt operations or gain unauthorized access to critical resources.

  This rule primarily relates to the MITRE ATT&CK framework under the tactics of Credential Access, specifically technique **T1552.003: Application Layer Protocol**. The ability to modify or delete Secrets can facilitate credential theft or access to other sensitive resources, and it raises concerns about the integrity of the Kubernetes environment.

  Primary data sources for this detection include GCP audit logs, which provide insights into Kubernetes API calls. Monitoring these logs allows security operations teams (SOCs) to detect and respond to potential unauthorized activities concerning Secrets in a timely manner.

  ### Investigation Steps
  - **Review Audit Logs**: Check GCP audit logs for entries related to secret creation, modification, or deletion events. Focus on method names such as `io.k8s.core.v*.secrets.create`, `update`, `patch`, or `delete`.

  - **Validate User Actions**: Verify the identity of the users making changes to the Secrets. Cross-reference usernames with roles and responsibilities—do they align with the actions being performed?

  - **Analyze User Agent and Hostname**: Look for unusual user agents or hostnames associated with the changes. Examine if the requests are originating from expected sources or if they appear anomalous.

  - **Assess for Known Behavior**: Identify if there are any documented changes by system administrators or automated processes that may lead to legitimate updates to Secrets. Investigate any unknown or unauthorized modifications, as they could signify a security incident.

  ### Prioritization
  The alert is assigned a medium severity level due to the potential impact of compromised Secrets, which could lead to significant security breaches if exploited. However, the likelihood of true positive alerts depends on the current operational context and the knowledge of authorized administrators.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if comprehensive logging configurations are not enabled in the GCP environment. This rule assumes that all relevant audit logs are collected and accessible for analysis. There may be instances where legitimate changes by system administrators lead to false positives; therefore, understanding user behavior is crucial. Additionally, this rule may not capture secret modifications performed outside the Kubernetes API (e.g., through direct access to infrastructure), which could go undetected by this mechanism.

