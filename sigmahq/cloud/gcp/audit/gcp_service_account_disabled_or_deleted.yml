  investigated. If known behavior is causing false positives, it can be exempted
  from the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the disabling or deletion of Google Cloud service accounts via audit logging. An attacker may aim to disrupt service access or impersonate legitimate users by compromising or manipulating service accounts, possibly leading to unauthorized actions in the environment. This behavior aligns with the MITRE ATT&CK technique "Account Manipulation" (T1531). Primary telemetry sources include Google Cloud Audit logs, specifically targeting method names that signify service account actions (e.g., `.serviceAccounts.disable` and `.serviceAccounts.delete`). If malicious, the security impact could include service disruptions or unauthorized access to cloud resources. Importantly, while this detection highlights suspicious account changes, it does not confirm malicious intent on its own.

  ### Investigation Steps

  - **Verify user actions: **Cross-check the `actor` field in the audit logs against authorized personnel lists to determine if the user initiating the change has legitimate privileges (GCP Audit log, method_name).

  - **Review recent access contexts: **Investigate the `userAgent` and `host` fields in the logs for the actor's identity. Determine if any service account modifications come from alarming or uncommon locations/devices associated with a specific legitimate task.

  - **Establish expected operational behavior: **Document standard administrative procedures in your environment regarding service account management to differentiate between benign changes and potentially harmful actions.

  - **Identify high-confidence malicious indicators: **Look for patterns where service accounts were disabled or deleted quickly after unauthorized access events (e.g., failed login attempts) in GCP logs, particularly if followed by changes in IAM policies.

  - **Review recent configuration changes: **Check GCP Configuration logs for recent changes to IAM roles or policies that may indicate misuse or unauthorized elevation of privileges coinciding with the service account modifications.

  ### Prioritization

  Alert severity is medium due to the potential impact on service operations and the likelihood that such actions can be weaponized by malicious actors. Disabling or deleting service accounts frequently aligns with tactics used in targeted attacks, making timely investigation critical.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative actions from authorized users. Effective logging configurations are necessary for consistent coverage—any prerequisites for logging must be validated. Legitimate changes, such as routine maintenance by internal admins, can trigger the alert. A related detection for monitoring unusual service account access patterns can strengthen overall coverage and context for this alert.

