  ---

  ### Technical Context

  This rule detects the disabling or deletion of service accounts in Google Cloud Platform (GCP) through specific API method calls. The likely attacker objective is to disrupt services or degrade the security posture by removing access points used for legitimate operations, facilitating lateral movement, or preventing detection of malicious activities. This behavior correlates with the MITRE ATT&CK technique for Impact (T1531).

  The primary telemetry source for this detection is GCP's audit logs, specifically looking for entries related to the methods `.serviceAccounts.disable` and `.serviceAccounts.delete`. If malicious, this can lead to service disruption or unauthorized access to sensitive resources. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrators may also disable or delete accounts for maintenance or security purposes.

  ---

  ### Investigation Steps

  - **Check service account context: **Verify the identity of the user initiating the disable or delete action: Look at the `authenticationinfo.principalEmail` field in GCP audit logs for the affected service account to assess if actions were taken by a legitimate admin or an unfamiliar user.

  - **Review timestamps of changes: **Cross-reference the timestamp of the action with recent suspicious activity: Analyze GCP audit logs to understand the timeline of changes or access patterns (look for `timestamp` field in the logs).

  - **Assess activity around service accounts: **Identify associated service account usage prior to disablement: Examine the `gcp.audit.method_name` field for other activities performed by the service account in question, such as API calls or resource access, to determine legitimate versus malicious use.

  - **Examine relevant cloud audit logs: **Collect comprehensive audit logs related to service account management: Validate using `shell` GCP commands or accessing `Logs Explorer` to search for logs specifically indicating service account deletions or modifications.

  - **Determine service account criticality: **Evaluate the importance of the affected service account: Assess the role assigned to the service account using GCP IAM roles to determine potential impact and the necessity of investigation if it holds high-privilege access.

  - **Identify patterns in user activities: **Analyze user activity logs for unusual behavior: Cross-reference logs for typical actions taken by administrators against those logged around the time of the account changes to identify deviations from expected behavior.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical cloud resources and operations if service accounts are manipulated maliciously. The likelihood of abuse is elevated, particularly in environments with less controlled access to cloud resources. This behavior can be weaponized by adversaries aiming to disrupt service or access sensitive data.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate activities by administrators that may trigger this alert, leading to false positives. Accurate and comprehensive logging configuration in GCP is crucial for reliable detection of similar threats. Events caused by system maintenance performed by trusted parties could mask malicious activities. Companion detections could include monitoring unexpected changes to IAM roles (`gcp.audit.method_name: .setIamPolicy`) which can further enhance overall coverage of service account activities.

