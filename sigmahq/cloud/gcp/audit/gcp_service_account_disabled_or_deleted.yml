note: |
  ### Technical Context
  This detection rule identifies instances where Google Cloud service accounts are disabled or deleted. These actions can signify administrative maintenance for legitimate purposes, but they may also indicate malicious activity by an attacker attempting to disrupt services or impersonate legitimate users. Attackers may seek to remove access to critical services or use disabled accounts as a vector for privilege escalation to gain unauthorized access to sensitive resources.

  The relevant MITRE ATT&CK tactics for this activity fall under **Impact** (ID: TA0040), and specifically relate to **Account Access Removal** (ID: T1531). The ability to delete or disable service accounts can hinder incident response capabilities or alter the operational integrity of a cloud environment.

  Primary data sources for monitoring these events include Google Cloud Platform (GCP) audit logs, which record administrative actions taken within the cloud infrastructure, and any IAM-related logs that detail changes to user account statuses.

  ### Investigation Steps
  - **Collect Audit Logs**: Review GCP audit logs for entries indicating `.serviceAccounts.disable` or `.serviceAccounts.delete` actions, noting the associated timestamps and user identities.
  - **Analyze User Context**: Investigate the user identity or service account responsible for the disabling or deletion. Cross-reference this information with known administrative roles and ensure it aligns with expected behavior.
  - **Check Recent Changes**: Look into recent changes made by the user or service account, including related IAM modifications. Verify whether these changes align with scheduled maintenance or planned activities.
  - **Identify Potential Impact**: Assess the services associated with the disabled or deleted service accounts, determining the potential operational or security impact on the cloud environment.

  ### Prioritization
  This alert is prioritized as medium severity in an enterprise environment because while disabling or deleting service accounts can indicate legitimate administrative actions, it also has the potential to disrupt services or facilitate unauthorized access, warranting careful examination.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if audit logging is not enabled or if logs have been improperly retained or configured in GCP. Additionally, the detection logic assumes that any disablement or deletion of service accounts is potentially malicious, not accounting for legitimate administrative activities. Ensuring comprehensive audit logging for all IAM changes is crucial for the rule's effective operation, along with configuration settings that allow for detailed user activity tracking.

