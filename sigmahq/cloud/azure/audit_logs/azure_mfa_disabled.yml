note: |
  ### Technical Context

  This rule detects instances where Multi-Factor Authentication (MFA) has been disabled in an Azure Active Directory environment. Such behavior may indicate an attempt by an attacker to bypass authentication mechanisms, potentially facilitating unauthorized access to sensitive resources. The likely attacker objective is to exploit the reduced security posture once MFA is disabled, making it easier to compromise accounts, particularly for privileged users.

  The relevant MITRE ATT&CK tactic for this activity is **Credential Access** (TA0006), specifically technique **Disable Multi-Factor Authentication** (T1556). The primary telemetry sources are Azure Audit Logs, specifically focusing on the operation `Disable Strong Authentication`. If malicious, this action can lead to account compromise and data exfiltration. This detection does not confirm malicious intent on its own, as legitimate administrative changes can also lead to MFA being disabled.

  ### Investigation Steps

  - **Check Azure Audit Logs for Disable Actions:** Review Azure Audit Logs (Event ID: {specific event ID}) for logs marking the operation name as `Disable Strong Authentication` and ensure that the result status is `success`. Note the requesting user account for context.

  - **Identify User Role and Permission Level:** Cross-reference the user account disabling MFA against the organizational structure. Ensure the account is not a low-privilege user or a generic service account, which might indicate potentially malicious behavior.

  - **Review Recent User Activity:** Investigate the user’s activity log leading up to the MFA change. Look for unusual login patterns or failed login attempts (Event ID: {specific event ID}) that could indicate the account was targeted prior to MFA being disabled.

  - **Look for Concurrent Changes in Permissions:** Check if there were any other configuration changes made around the same time as the MFA being disabled. This includes modifications to role assignments in Azure Active Directory, which could denote an attempt to escalate privileges.

  - **Legitimate Activity Review:** Validate if the disabling of MFA corresponds to an authorized administrative action. Refer to IT change management records to determine if this action aligns with company policies or scheduled maintenance.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of disabling MFA on an enterprise system. The likelihood of malicious abuse is moderate, as compromised accounts that lack MFA are often targeted by adversaries. While disabling MFA can be legitimate, it is a tactic frequently weaponized by attackers to facilitate account takeover.

  ### Blind Spots and Assumptions

  The detection is limited by the potential for legitimate administrative actions to generate similar alerts, such as manual MFA deactivations for users needing temporary access adjustments. Specific logging configurations must be in place to ensure comprehensive auditing of Azure operations. Legitimate activities like routine account management or troubleshooting can trigger this alert. Companion detections surrounding unusual access patterns or privilege escalation events would enhance coverage and context for analysts.

