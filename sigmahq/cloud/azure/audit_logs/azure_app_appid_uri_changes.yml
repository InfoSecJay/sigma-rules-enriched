note: |
  ### Technical Context
  This detection rule identifies unauthorized changes to an application's AppID URI within Azure environments. Such changes could indicate malicious activity aimed at manipulating application access or configurations, which attackers may utilize to gain elevated privileges or maintain persistence. The likely attacker objectives might include gaining unauthorized access to sensitive resources or evading security controls through altered application settings.

  Relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - **Initial Access** (TA0001)
  - **Defense Evasion** (TA0005)
  - **Persistence** (TA0003)
  - **Credential Access** (TA0006)
  - **Privilege Escalation** (TA0004)
  - **T1552: Unsecured Credentials**
  - **T1078.004: Valid Accounts - Cloud Accounts**

  The primary source of relevant data for this detection comes from Azure audit logs, specifically focusing on entries that indicate when applications or service principals have their AppID URIs updated, which is crucial for establishing changes in application behavior or configurations.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Examine the Azure audit logs for specific entries related to AppID URI updates. Investigate the timestamps and user accounts involved in these changes.
  - **Correlate with User Activity**: Cross-reference noted changes with user activities, ensuring that the individuals making these updates are appropriate (e.g., are they administrators?). Look for any anomalous access patterns.
  - **Analyze Application Settings**: Assess the broader implications of the AppID URI modification by reviewing other application settings that may have similarly changed, which could indicate potential privilege escalation or malicious intent.
  - **Check for Previous Versions**: If possible, compare the current AppID URI with previous configurations to understand the nature of the changes and identify any potentially unauthorized alterations.

  ### Prioritization
  This alert has a high severity rating due to the potential for significant security implications resulting from unauthorized changes to application configurations, which could lead to compromised access controls or system integrity.

  ### Blind Spots and Assumptions
  Detection may be limited by gaps in logging configurations; for instance, if Azure audit logs are not correctly configured to capture all relevant events or changes, some unauthorized activity may go unnoticed. Additionally, the detection logic assumes that legitimate changes are properly scheduled and documented, which may not always be the case. Analysts should be aware that false positives can occur when administrators are performing planned updates, so context and additional verification are essential for accurate incident response.

