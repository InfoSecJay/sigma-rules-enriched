note: |
  ### Technical Context

  This rule detects modifications to an application’s AppID URI in Azure. Such changes are often indicative of an attacker attempting to create or modify application settings to facilitate unauthorized access or persistence within an environment. The likely attacker objective could include maintaining access to sensitive resources or exfiltrating data.

  The relevant MITRE ATT&CK techniques for this detection include T1552 (Unsecured Credentials) and T1078.004 (Valid Accounts: Service Account). The primary telemetry source is Azure Audit Logs, specifically looking for entries related to application updates. If this behavior is malicious, it could lead to unauthorized access to resources, potential data breaches, or abuse of service identities. Notably, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities can trigger the rule.

  ### Investigation Steps

  - **Review Audit Log Entries:** Check Azure Audit Logs for Event Types indicating "Update Application" or "Update Service Principal" (e.g., `properties.message` field). Look for entries that lack appropriate change management documentation or show changes made outside of normal business hours.

  - **Validate Existing AppID Configuration:** Compare the AppID URI changes against existing configurations. Look for any discrepancies that align with unauthorized access patterns or unusual timing of changes, indicating potential compromise.

  - **Check for Previous Alerts:** Investigate if there have been previous alerts related to unauthorized changes in Azure roles or service principal modifications that might indicate a broader attack pattern.

  - **Identify Authorized Personnel:** Confirm the legitimacy by cross-checking the individual making the configuration changes against an approved administrator list. Review who initiated the change using `initiatedBy` in the audit logs.

  - **Monitor for Subsequent Changes:** After initial changes, watch for further modifications to the AppID URI or related settings in succession, which could indicate ongoing adversarial activity, barring benign deletions or updates.

  - **Examine Role Assignments:** Review role assignments to ensure that the service principal associated with the AppID is not granted excessive privileges. High-risk roles increase the chance of abuse by a compromised entity.

  ### Prioritization

  This alert is high severity due to the potential impact on sensitive applications if compromised. Given the nature of the detection, there's a moderate likelihood of malicious abuse since these configuration changes can be weaponized for initial access or persistence by adversaries actively targeting Azure environments.

  ### Blind Spots and Assumptions

  The detection may have limitations, such as false positives from legitimate administrative changes. Without proper alerting for privileged account use, unauthorized actions may go unnoticed. Legitimate activities could include planned updates by administrators under prior notification, which could trigger the rule. A related detection to improve coverage would involve alerts on unauthorized privilege escalations linked to service principals or application identities.

