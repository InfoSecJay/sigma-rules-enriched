note: |
  ### Technical Context

  This Sigma rule detects configuration changes to an application's AppID URI within Azure Active Directory. Such changes can indicate potential adversary activity targeting application identity management, potentially aiming to redirect legitimate authentication flows or exploit application permissions. The relevant MITRE ATT&CK tactics include Initial Access (T1078.004) and Persistence (T1552), as modifying AppID URIs can facilitate unauthorized access or maintain access after initial compromise. The primary telemetry sources are Azure audit logs, specifically focusing on changes related to application configurations. If these changes are malicious, they could lead to unauthorized access or manipulation of application credentials. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate alterations by administrators can trigger similar logs.

  ### Investigation Steps

  - **Review Audit Logs for AppID URI Changes:** Collect Azure audit logs (log type: auditlogs). Focus on fields containing `properties.message` values of "Update Application" or "Update Service principal." Correlate timestamps with the expected change schedule to discern legitimate admin activity from potential malicious modifications.

  - **Check for Unusual User Accounts:** Identify the user accounts that executed the changes (look in the `initiatedBy` field of the audit logs). Compare to the organization’s list of authorized administrators to detect unauthorized or unusual user accounts making the changes.

  - **Validate Against Change Management Processes:** Confirm whether the changes align with planned maintenance or updates as documented by the organization's change management policies. Legitimate changes should have prior approvals and notifications.

  - **Look for Multiple Concurrent Changes:** Analyze whether multiple applications had URI changes around the same time frame (time-based clustering in audit logs). Multiple unauthorized changes may indicate broader malicious activity targeting the environment.

  - **Identify Potential Combinations with Other Tactics:** Search for related audit logs that indicate account privilege escalations or creation of new service principals within a short timeframe (such as event IDs indicating changes to user roles or permissions). This may indicate an adversary's intent to establish persistence or enable further attacks.

  ### Prioritization

  The alert is marked as high severity due to the critical nature of application identity management in cloud environments. Unauthorized changes can lead to significant risk of credential theft or unauthorized access. While administrators may need to make changes, the frequency and nature of these modifications could indicate possible exploitation.

  ### Blind Spots and Assumptions

  Detection limitations exist as authorized administrators may inadvertently trigger alerts while making legitimate configuration changes. Ensuring comprehensive Azure audit logs are enabled is essential for reliable detection of these events. Legitimate change processes in development or testing environments may also generate similar logs. A related detection could involve monitoring for unusual service principal creations or modifications to role assignments, adding context to the changes observed here.

