note: |
  ### Technical Context

  The rule detects the retrieval of BitLocker recovery keys from Azure AD, an action that can signify an attempt by an attacker to gain access to encrypted data on a targeted device. The likely attacker objective is unauthorized access to encrypted information or the exploitation of sensitive data. This event correlates with the MITRE ATT&CK tactics of Credential Access (T1078) and Privilege Escalation (T1068).

  Primary telemetry sources include Azure Active Directory Audit Logs, specifically entry points for "Read BitLocker key" operations. If malicious, this behavior could lead to an attacker accessing valuable data protected by BitLocker encryption. Importantly, this detection alone does not confirm malicious intent, as legitimate administrators and IT personnel may also retrieve keys for device management purposes.

  ### Investigation Steps

  - **Check for unauthorized access patterns:** Review Azure AD Audit Logs for Event Category "KeyManagement" and Operation Name "Read BitLocker key". Look for accesses that occur outside of business hours or by accounts that do not normally perform such operations.

  - **Identify the user account performing the retrieval:** Cross-reference the PrincipalId (user or service account) against known accounts with BitLocker management responsibilities. Ensure that the retrieval aligns with expected roles, e.g., IT admins.

  - **Assess device association:** Track devices associated with the retrieved BitLocker keys. Use Azure AD device inventory to confirm whether the device is managed, legitimate, and aligns with the user’s normal activities.

  - **Look for additional suspicious activity:** Verify if the account has triggered other alerts within the past 30 days. Check for unusual sign-ins or attempts to access sensitive resources that correlate with this BitLocker key retrieval.

  - **Evaluate legitimate behavior:** Confirm expected usage patterns where authorized users may retrieve BitLocker keys to assist in user support or recovery situations. Note the timeframes and workflows typically associated with these requests to differentiate them from anomalous behavior.

  - **Correlate with other security alerts:** Ensure that there are no concurrent alerts from companion detections, such as anomalous account access (e.g., Azure AD sign-in logs indicating risky sign-ins from unusual locations).

  ### Prioritization

  This alert is of medium severity, given that it involves sensitive key retrieval that could lead to unauthorized access to encrypted data. The likelihood of malicious abuse is moderate, particularly if the retrieved keys are associated with critical or high-value systems. This behavior is not overly common; however, it can be weaponized by attackers seeking to escalate their privileges post-compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log all BitLocker key retrievals or by legitimate IT operations that could trigger false positives. The effective monitoring requires that Azure AD audit logs be properly enabled and configured. Additionally, legitimate access requests for BitLocker keys by admin users may frequently occur in a managed environment. A related detection that strengthens coverage would be monitoring for unusual account creation or privilege escalation events (e.g., managing BitLocker keys using high-privilege accounts).

