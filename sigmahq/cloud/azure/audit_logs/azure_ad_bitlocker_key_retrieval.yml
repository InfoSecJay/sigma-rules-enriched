note: |
  ### Technical Context

  This Sigma rule detects actions related to the retrieval of BitLocker recovery keys, specifically via the Azure Audit Logs for key management operations. The likely attacker objective could be to gain unauthorized access to encrypted drives by acquiring recovery keys, which would allow them to bypass security measures. This behavior aligns with the MITRE ATT&CK tactic of **Credential Access** (TA0006) and the technique **Account Manipulation** (T1078.004).

  The primary telemetry source is Azure Audit Logs, focusing on log entries where the **Category** is `KeyManagement` and the **OperationName** is `Read BitLocker key`. If malicious, the security impact could be significant, facilitating unauthorized access to sensitive data. This detection does NOT confirm that a successful breach has occurred; retrieval may also be a legitimate administrative action.

  ---

  ### Investigation Steps

  - **Identify source of retrieval request:** Check Azure Audit Logs for Event Type `Read BitLocker key`. Verify the **initiator** field to determine if it was triggered by a legitimate administrator or an unexpected account.

  - **Review user account permissions:** Investigate the user or account that initiated the key retrieval by examining Azure Active Directory for roles and group memberships. Look for unauthorized access patterns indicating a potential compromise.

  - **Compare retrieval with normal activity:** Assess the frequency and context of key retrieval actions. Typically, legitimate administrative actions may involve retrieval by specific IT personnel during authorized maintenance. Look for retrievals done by unusual users or outside of expected change windows.

  - **Seek additional context of suspicious activity:** Query for related Azure logs or activity reports (e.g., sign-ins, unauthorized access attempts) within the last 72 hours. Check for anomalous login locations or timeframes, which may indicate credential theft.

  - **Cross-reference against asset criticality:** Identify whether the computer or asset associated with the BitLocker key retrieval is critical or contains sensitive data. High-value assets should be prioritized for further investigation due to the risk posed by key exposure.

  ---

  ### Prioritization

  The alert has a medium severity due to the potential impact on highly sensitive encrypted resources and the moderate likelihood of abuse by attackers seeking to exploit weak security controls. The behavior is not commonly executed by everyday operations, thus increasing the need for quick analysis.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of granular logging for legitimate administrative actions or misconfigured permissions. Alerts can also be triggered by legitimate recovery key requests, which can dilute urgency. Ensure that all necessary Azure Audit Logs are configured and enabled for reliable detection. A related detection to consider is monitoring for abnormal login patterns from the same account, which can signal that key retrieval is part of a broader attack strategy.

