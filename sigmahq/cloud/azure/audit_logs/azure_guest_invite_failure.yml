note: |
  ### Technical Context

  This rule detects attempts by unauthorized users to invite guest accounts in Azure, which is a behavior indicative of privilege escalation or unauthorized access. The likely attacker objective includes gaining wider access or control over the environment by adding external entities, thereby facilitating lateral movement. This relates to the MITRE ATT&CK techniques: Initial Access (T1078.004 - Valid Accounts) and Privilege Escalation.

  The primary telemetry sources include Azure Active Directory Audit Logs, specifically focusing on events related to user invitations. If malicious, this activity can lead to unauthorized access to resources and sensitive data. Importantly, this detection does NOT confirm actual successful guest account creation; it only indicates an action attempt by a user who lacks permissions.

  ### Investigation Steps

  - **Review Azure Audit Logs:**
    Check the Azure Active Directory Audit Log for Event ID 119, which indicates an attempt to invite a guest user. Look for user IDs not listed in your organization's user governance, especially those lacking the "Global Administrator" or designated roles.

  - **Examine User Permissions:**
    Verify if the user attempting the invite has the necessary permissions to invite guest users. Benign behavior may include users who have legitimate roles such as "Guest Inviter" or "Global Administrator".

  - **Identify Recent User Activity:**
    Look for the user’s API activity using Azure Activity Log for patterns or anomalies. Review actions performed by the user before the invite attempt, such as requests for sensitive data or unusual resource access.

  - **Assess Impact on Critical Assets:**
    Determine if the user who triggered the alert has access to sensitive systems or applications. This can help prioritize response based on asset criticality.

  - **Document Any Follow-Up Actions:**
    If malicious intent is suspected, confirm if there are further attempts related to user invitations or unauthorized access. Look for persistent attempts over a defined period indicating a coordinated access strategy.

  ### Prioritization

  This alert has medium severity since it involves a potential attempt at privilege escalation with the capability of enabling unauthorized access. If the user who triggered the alert holds sensitive roles, the likelihood of malicious abuse increases. However, such behavior could also result from human error by non-malicious users unaware of the proper protocols.

  ### Blind Spots and Assumptions

  This detection may miss successfully executed malicious invites if the attacker gains temporary elevated privileges. It requires proper auditing settings in Azure AD to ensure comprehensive log capture. Legitimate users may trigger the alert due to lack of understanding about guest user policies. A related detection to consider would be successful guest invitations by non-authorized users, which would complement this alert in cases of ineffective privilege enforcement.

