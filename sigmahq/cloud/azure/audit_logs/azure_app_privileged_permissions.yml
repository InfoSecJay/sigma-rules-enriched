note: |
  ### Technical Context

  This Sigma rule detects when an administrator grants application roles or highly privileged delegated permissions to service principals in Microsoft Azure. The behavior indicates a potential privilege escalation or application misconfiguration, where an attacker may leverage these permissions to gain unauthorized access to sensitive data or systems. This falls under the MITRE ATT&CK tactic of **Persistence** and technique **T1098.003: Application Layer Protocol**.

  The primary telemetry source for this detection is the Azure Audit Logs, specifically looking for messages indicating app role assignments. If detected maliciously, this can lead to unauthorized elevation of privileges, allowing attackers to perform destructive actions within the environment. Importantly, this detection does NOT confirm that malicious activity is occurring; legitimate permissions may be granted for operational purposes.

  ### Investigation Steps

  - **Verify relevant role assignment details:** Check the Azure Audit Logs for Event ID `A023` and focus on the `properties.message` field to confirm if an admin genuinely intended to add the app role assignment for a necessary service principal.

  - **Assess administrative roles:** Identify if the user granting permissions has sufficient authorization. Check the `initiatedBy` field in the audit logs to verify this against corporate policies regarding privileged access.

  - **Investigate timing and frequency of the changes:** Look for any unusual patterns in the timing of the modifications. For instance, multiple permissions granted within a short window, potentially indicating batch processing by a malicious actor or a legitimate application deployment.

  - **Review legitimate usages for applications:** Clarify what legitimate activity looks like for the applications in question. This includes expected app permissions granted during standard deployment processes. Compare current permissions against documented application needs.

  - **Identify suspicious service principals:** Determine if the service principal associated with the permission change has a history of suspicious activity. Check for unusual login attempts or changes in resource access patterns using Azure Sign-in logs.

  ### Prioritization

  The alert severity is high due to the potential impact of unauthorized access on sensitive systems and data. Given that adversaries often utilize privileged permissions for lateral movement or data exfiltration, this behavior is highly likely to be malicious if not thoroughly justified. Furthermore, this type of permission granting is commonly weaponized in targeted attacks to escalate privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions that require similar permission changes for new applications or services. Ensure all relevant Azure Audit Logs are correctly configured to capture permission grants to strengthen coverage. Note that legitimate DevOps processes may routinely trigger this alert, warranting context awareness. A related detection to consider is the monitoring of failed login attempts immediately following permissions being granted, which may indicate an attacker attempting to exploit newly acquired access.

