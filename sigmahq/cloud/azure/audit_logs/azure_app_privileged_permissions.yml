note: |
  ### Technical Context
  This detection rule triggers an alert when an administrator assigns application roles or delegated permissions with elevated privileges within Azure environments. These types of permissions allow applications to access sensitive data or carry out actions on behalf of users, posing significant security risks if misused. The intention behind monitoring these events is to catch potential insider threats, malicious app integrations, or misconfigurations that could lead to unauthorized access or privilege escalation.

  The likely attacker objectives could encompass anything from data exfiltration to lateral movement within the infrastructure. By granting excessive permissions to an application, an attacker could leverage the application as a foothold for further exploitation within the environment. This aligns with MITRE ATT&CK tactics such as **Persistence** (TA0003) and **Privilege Escalation** (TA0004), particularly technique **T1098.003** (Application Layer Protocol: Permissions).

  To effectively detect these actions, the primary data source will be Azure audit logs, which capture events related to application permissions and role assignments.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Investigate the audit logs for any recent events indicating additions of app role assignments to service principals. Focus on unusual timestamps or accounts performing these changes.
  - **Identify Context**: Determine if the permissions granted align with legitimate operational needs by cross-referencing involved applications against known good configurations and usage policies.
  - **Analyze User Activity**: Assess the activity of the user or service account that granted the permissions, looking for any abnormal behavior or anomalies within the session leading up to the permission change.
  - **Cross-Check Permissions**: Evaluate the scopes of the roles assigned, ensuring they are appropriate for the application and do not provide excessive privileges that could be exploited.

  ### Prioritization
  The severity of this alert is high due to the potential for significant damage if an unauthorized user gains access to sensitive resources through improperly granted application permissions. The likelihood of such permissions being abused by either insiders or compromised accounts makes this a critical area of focus for security operations.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for certain legitimate role assignments that could lead to false positives. The logic assumes that all assignments made to service principals should be closely monitored; however, some applications may require elevated permissions for valid operational reasons. Additionally, this detection depends on having properly configured Azure audit logs, and if logging is insufficient or misconfigured, the rule may miss crucial events. It is essential to regularly review and fine-tune alerting thresholds to balance security with operational necessity.

