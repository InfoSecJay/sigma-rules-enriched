note: |
  ### Technical Context
  This rule monitors for any addition of users to global or device administrator roles within Azure environments. Such changes can indicate unauthorized privilege escalation attempts, potentially allowing attackers to gain significant control over user accounts and sensitive resources. The common threat scenario involves an attacker attempting to compromise administrative levels to manipulate configurations, exfiltrate data, or pivot further into the network.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1543)**, **Initial Access (T1078)**, and **Privilege Escalation (T1068)** as the actions taken might be used to maintain foothold and escalate their access rights. Techniques specifically applicable here include **Valid Accounts (T1078.004)** where users are added to critical roles, often bypassing standard authentication processes.

  The primary data source for this detection will be Azure Audit Logs that capture role management activities, specifically related to **RoleManagement** actions and associated operations when users are added as members to sensitive roles.

  ### Investigation Steps
  - **Review Azure Audit Logs:** Check the Azure Audit Logs for entries categorized under RoleManagement, focusing specifically on operations that involve adding users to global or device admin roles.
  - **Analyze User Context:** Identify the users being granted elevated permissions and evaluate their recent activities to assess if they align with legitimate administrative actions.
  - **Check for Anomalous Patterns:** Look for any patterns that stand out, such as multiple role assignments made in rapid succession or from unusual locations which may indicate a compromised account.
  - **Correlate with User Access Policies:** Cross-reference the changes with organizational access policies to validate that the assignments comply with given security protocols.

  ### Prioritization
  Given the potential for significant impact associated with unauthorized access to global or device administrator roles, this alert is marked as high severity. The likelihood of exploitation is also elevated in an enterprise environment where an attacker may aim for privilege escalation.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the logs are not consistently configured to capture all role management activities or if logs have retention policies that lead to loss of critical historical data. The detection logic assumes that all legitimate assignments will fall within expected operational patterns, which might not account for insider threats or social engineering tactics. Proper logging configurations in Azure are essential for this alert to function effectively, as insufficient log detail may lead to missed detections.

