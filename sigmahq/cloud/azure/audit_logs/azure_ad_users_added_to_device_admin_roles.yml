note: |
  ### Technical Context

  This Sigma rule detects instances where users are added to device administrator roles, which could indicate potential privilege escalation or unauthorized access. The likely attacker objective is to gain elevated privileges to further compromise or manipulate systems within the Azure environment. This activity is relevant to the MITRE ATT&CK tactic of **Privilege Escalation (T1068)** and technique **Valid Accounts (T1078.004)**. The primary telemetry source for this detection comes from Azure audit logs, specifically targeting events related to role management operations.

  If detected, the security impact could include unauthorized administrative access, potentially enabling an adversary to modify system configurations, deploy malware, or exfiltrate sensitive data. However, the detection does NOT confirm malicious intent on its own, as it may also reflect legitimate administrative actions performed by authorized personnel.

  ### Investigation Steps

  - **Identify recent role changes:** Review Azure Audit Logs for **OperationName** containing "Add member to role" and filter by **Category: RoleManagement**. Look for activities within the last 24 hours to assess the timing of role changes and whether they correlate with other suspicious events.

  - **Check for unfamiliar user accounts:** Cross-reference the users who were added to the device admin roles against your organization's authorized user list. Any unfamiliar accounts or recently created users may indicate malicious activity that warrants further investigation.

  - **Review legitimate administrative patterns:** Analyze the activity patterns of known administrators. Look for consistent roles assigned to legitimate users to determine if the detected event deviates from normal administrative behavior.

  - **Assess admin account activities:** Validate if any user accounts that were granted device admin roles have executed high-risk actions (e.g., creating new accounts, changing sensitive configurations) within the Azure environment. Look for Event IDs related to security events for any abnormal behavior.

  - **Investigate context around the role assignment:** Examine the **TargetResources** field in the event to ensure that the roles being assigned are appropriate for the users. The specific resource IDs (`7698a772-787b-4ac8-901f-60d6b08affd2` for Azure Device Administrator and `62e90394-69f5-4237-9190-012177145e10` for Global Admin) should be scrutinized against their expected usage in your environment.

  - **Check for historical changes in admin roles:** Query the Azure logs to find prior events where the same user or similar accounts were added to admin roles. Frequent changes could suggest an automated attempt to maintain persistence or evade detection.

  ### Prioritization

  This alert is of high severity due to its potential impact on sensitive systems being compromised, with a high likelihood of malicious use, especially given the nature of device administration roles. Such behavior is commonly weaponized by attackers looking to maintain control over compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited if Azure audit logs are not properly configured to capture all Role Management events. Legitimate activities, such as routine administrative tasks or onboarding processes, may trigger this alert. Additionally, one related detection could include monitoring for unusual changes in user group memberships or other administrative roles, which would complement the coverage and context of privileged access changes.

