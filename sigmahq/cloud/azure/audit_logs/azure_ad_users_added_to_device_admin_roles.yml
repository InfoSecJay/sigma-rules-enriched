  ---

  ### Technical Context

  This Sigma rule detects the addition of users to high-privilege roles within Azure, specifically 'Device Administrator' roles. The likely attacker objective is to gain escalated privileges, enabling unauthorized access to sensitive system controls or data. This behavior aligns with the MITRE ATT&CK technique for Process Injection, specifically T1078.004 (Valid Accounts).

  The primary telemetry source for this detection is Azure Audit Logs, specifically entries related to Role Management operations. If malicious, this behavior can significantly compromise organizational security by allowing the attacker to manipulate higher-level administrative functions. Importantly, this detection does NOT confirm that the actor performing the action is malicious; it may be a legitimate administrator performing their duties.

  ---

  ### Investigation Steps

  - **Review Audit Log Entries for Role Management Changes:** Examine Azure Audit Logs (Event ID: 20150) for recent entries under RoleManagement category. Identify the specifics of the entry, including `OperationName`, `InitiatedBy`, and `TargetResources` fields.

  - **Verify Legitimate User Activity:** Cross-reference the user added to the role with a list of known administrators in your organization. Check for any recent role changes in the identity management system or team communications that justify the addition.

  - **Check User 'Add to Role' History:** Look for a sequence of events for the user in question. Specifically, review logs showing past permissions or role changes within a short timeframe that might indicate privilege escalation activities.

  - **Identify High-Confidence Malicious Indicators:** What constitutes a risk factor includes the addition of users who are not part of the internal IT or administration teams. Correlate `User Principal Name` or `User ID` against an internal employee list or IAM system.

  - **Assess Target Resource Types:** Ensure that the roles in `TargetResources` (IDs: `7698a772-787b-4ac8-901f-60d6b08affd2` and `62e90394-69f5-4237-9190-012177145e10`) align with expected user assignments. Any discrepancies should trigger further examination.

  ---

  ### Prioritization

  This alert is of high severity, especially if it involves critical systems or user accounts reflective of increased risk exposure. The likelihood of malicious abuse is high, given that escalation to admin roles is a common tactic in both initial access and persistence phases of an attack. This behavior is often weaponized by adversaries targeting enterprise environments for further exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by lack of comprehensive logging on all role changes or if Azure IAM settings do not consistently capture such events. Evasion might occur via legitimate administrative actions that are within policy compliance but are executed for malicious intents. Legitimate activities such as routine onboarding may also trigger the alert. Complementary detections could involve monitoring for lateral movement within privileged accounts or subsequent role changes that follow the addition event.

