note: |
  ### Technical Context

  This rule detects changes to critical roles within an Azure environment, specifically when users are added to device administrator roles. The primary objective of an attacker would be to gain elevated permissions to execute malicious activities or maintain persistence. This behavior aligns with the ATT&CK MITRE technique for "Account Manipulation" (T1078.004), indicative of initial access and privilege escalation tactics.

  Key telemetry sources include Azure audit logs, particularly those capturing role management activities under the `RoleManagement` category. If the behavior is malicious, it poses a severe impact by potentially compromising device security and allowing attackers to control sensitive systems. It is crucial to note that this detection alone does not confirm malicious intent; benign organizational changes could trigger the same alerts.

  ### Investigation Steps

  - **Review Azure Audit Logs**: Query the Audit logs for `Category: RoleManagement` and `OperationName: Add member to role`. Check for unexpected user accounts such as external or unmanaged users added to device admin roles.
  - **Validate User Context**: Confirm the context of the added users. Legitimate additions should correspond to known projects, departmental changes, or approvals. Suspicious users may lack prior roles or context.
  - **Identify Role Changes**: Cross-reference the `TargetResources` in the logs with Azure role IDs. Check if the operations involve high-privilege roles like 'Global Administrator' or 'Device Administrator' (IDs: 7698a772-787b-4ac8-901f-60d6b08affd2 and 62e90394-69f5-4237-9190-012177145e10).
  - **Correlate with Recent Changes**: Look for any recent changes related to user account management and group policy to see if this aligns with further suspicious behavior, such as account lockouts or failed sign-ins.
  - **Check Login Patterns**: Review logins leading to the addition event. Unusual or atypical access patterns from external IPs or during non-business hours should be flagged as potential malicious indicators.
  - **Assess Asset Criticality**: Evaluate the affected devices or users for critical roles within the organizational context. Changes to admin roles on critical infrastructure should escalate response efforts.

  ### Prioritization

  This alert is of high severity due to the high impact if compromised systems are abused. Malicious actors commonly seek to exploit elevated privileges, making this behavior a significant indicator of potential breaches. Weaponization of privilege escalation tactics is a known threat vector in numerous cyber incidents.

  ### Blind Spots and Assumptions

  Detection might miss legitimate administrative changes during scheduled maintenance or updates involving user role changes. Moreover, the effectiveness of this rule is contingent on proper logging configurations in Azure. Additionally, internal organizational processes may lead to expected role changes that could trigger false alarms. Related detections that may enhance coverage include alerts on "User Account Creation" and "Unusual Login Activities" within Azure services.

