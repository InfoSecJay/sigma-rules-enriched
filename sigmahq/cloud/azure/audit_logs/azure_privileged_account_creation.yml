note: |
  ### Technical Context
  This detection rule is designed to identify instances where a new administrator account is created within an Azure environment. The ability to create new privileged accounts can be exploited by attackers to gain unauthorized access, escalate privileges, and maintain persistence within a network. The decreasing barrier for entry into privileged account management highlights the need for vigilant monitoring, as attackers often seek to create such accounts post-compromise to enable further malicious activities.

  In this threat scenario, an attacker may use compromised credentials to gain legitimate access and then leverage this access to create new admin accounts, allowing them to operate with elevated privileges and conduct further operations without detection. The relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access** (TA0001)
  - **Persistence** (TA0003)
  - **Privilege Escalation** (TA0004)
  - **Defense Evasion** (TA0005)
  - **Valid Accounts** (T1078.004)

  The primary data source for this detection will be Azure audit logs, which provide comprehensive information on changes to user accounts and role assignments within the Azure Active Directory.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Examine the Azure audit logs for any recent entries related to user creation events that have the message “Add user” or “Add member to role,” focusing particularly on events marked as “Success.”

  - **Correlate with User Activity**: Investigate the timeline of the new admin account creation to see if it corresponds with any other suspicious activities, such as failed login attempts or unexpected access from unusual locations.

  - **Evaluate Existing Admin Accounts**: Assess the list of existing admin accounts to determine whether the newly created account aligns with the organization’s policies and practices. Look for patterns or anomalies in admin account creation, such as multiple accounts being created within a short period.

  - **Check for Access Patterns**: Monitor the ongoing activity of the newly created admin account. Investigate any unusual actions or access patterns that could indicate the account is being used for malicious purposes.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of unauthorized privileged access, which could lead to significant security incidents, including data breaches and system compromise. The likelihood of exploitation derives from the increasing number of threats targeting privileged accounts within enterprise environments.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may occur if Azure audit logs are not retained for an adequate duration or if the logging of specific user account actions is disabled. The detection logic assumes that legitimate activities such as routine admin account creation or modifications are infrequent and thus more readily flagged; however, this might miss cases where such actions are conducted maliciously by insiders. For the alert to function effectively, Azure audit logging must be enabled, and appropriate settings must be configured to capture all relevant user account management events.

