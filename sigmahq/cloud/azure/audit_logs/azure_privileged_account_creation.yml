note: |
  ### Technical Context

  This Sigma rule detects the creation of new admin accounts in Azure environments, specifically through events indicating successful additions of users to privileged roles. Attackers targeting privileged account creation often aim to escalate their access privileges or maintain persistence within the environment. This behavior aligns with the MITRE ATT&CK techniques for initial access (T1078.004 - Valid Accounts) and persistence. The primary telemetry source for this alert is Azure Audit Logs, which capture critical account modifications. If the creation of a new admin account is malicious, it could significantly compromise security, allowing attackers to execute further actions with elevated privileges. However, this detection does NOT confirm that the activity is inherently malicious, as legitimate administrative tasks can also trigger this alert.

  ### Investigation Steps

  - **Verify the source of the alert**: Review Azure Audit Logs (Event ID related to user role changes) for properties containing "Add user" or "Add member to role" to confirm the action's origin and context.
  - **Cross-reference the initiating account**: Check whether the account that executed the addition has a history of such actions or is a known administrative role, which could indicate legitimate or suspicious activity.
  - **Investigate user context**: Assess the user associated with the new admin account to determine if they have a history of legitimate access patterns. Look for common administrative activities that may be expected, such as regular access modifications or role changes.
  - **Identify associated timestamps**: Cross-check the timestamp of the new account creation with other Azure activities (like login attempts) to see if they align with known usage patterns, which could highlight anomalous behavior.
  - **Review alerts for concurrent suspicious activity**: Analyze if there were any other alerts generated around the same time in the audit logs that might indicate a malicious attack vector, such as failed login attempts or changes to security configurations.
  - **Monitor for unusual role assignments**: Check for indications of excessive privileges (e.g., multiple high-level roles assigned to a single account) that may suggest a compromised admin either via the event logs or API queries.

  ### Prioritization

  The severity of this alert is medium, as it directly impacts the security posture of the affected systems, notably those with administrative capabilities. The likelihood of malicious abuse is moderate; attackers commonly target privileged account creation to facilitate unauthorized access. This activity is often weaponized as part of larger attack sequences.

  ### Blind Spots and Assumptions

  One major detection limitation is the potential for legitimate administrative actions to trigger this alert, making it vital to contextualize findings within broader account activities. If Azure Audit Logs are not correctly configured or monitored, there may be gaps in visibility. Additionally, automated administrative processes could generate false positives. A relevant companion detection rule might involve monitoring for unusual Access Control List (ACL) changes or privilege escalations to strengthen overall coverage of account modifications.

