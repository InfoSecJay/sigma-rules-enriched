note: |
  ### Technical Context

  This rule detects the creation of new administrator accounts within a system, particularly focusing on logs that indicate an addition to a privileged role. The likely attacker objective is to establish persistent access to resources by escalating privileges, allowing for further actions like data exfiltration or lateral movement. The relevant MITRE ATT&CK tactics include Initial Access (T1078), Persistence (T1078.004), and Privilege Escalation (T1068).

  Primary telemetry sources include Azure Audit Logs that capture administrative changes within Azure Active Directory. If malicious, this behavior could lead to unauthorized access, data breaches, or system compromise. However, this detection alone does not confirm that the action was illegitimate, as legitimate administrative activities may trigger the same alert.

  ### Investigation Steps

  - **Check for context of account creation:** Review Azure Audit Logs (Event ID 360) for the user account associated with the creation event. Look for unusual user accounts or accounts created outside of regular business hours.

  - **Validate legitimate admin roles:** Cross-reference recent privileged role assignments with HR or IT records to ensure the creation aligns with personnel changes or planned administrative actions.

  - **Examine source of the request:** Investigate the IP address and user agent associated with the account creation event. Look for anomalies such as requests from unexpected locations or devices not typically used for administrative tasks.

  - **Identify potential misuse of admin accounts:** Review subsequent access logs for actions taken by the new admin account within 24 hours of creation. Look for suspicious file access or changes to security settings that typically do not align with legitimate administrative work.

  - **Monitor for related alerts:** Correlate this alert with any existing detections of suspicious behavior, such as failed logins (Event ID 4625) or unusual account enumeration activities. This can help confirm if the account creation is part of a broader malicious campaign.

  ### Prioritization

  This alert is of medium severity as it primarily concerns accounts with elevated privileges, which, if abused, can lead to significant impacts in an enterprise environment. The likelihood of this behavior being malicious is moderate, especially if not aligned with documented administrative changes. As account creation is commonly weaponized in various attack vectors, timely investigation is critical.

  ### Blind Spots and Assumptions

  Detection may be limited by failed logging configurations or the absence of comprehensive audit trails for all administrative actions. Evasion techniques may include legitimate admins creating accounts in response to perceived threats or setting up redundancy. Legitimate actions, such as staff role changes or business process updates, may also trigger this alert. A related detection to enhance coverage could include monitoring changes to user role memberships and Azure AD anomaly detections.

