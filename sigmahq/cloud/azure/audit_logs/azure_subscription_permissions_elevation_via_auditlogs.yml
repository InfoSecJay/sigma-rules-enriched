note: |
  ### Technical Context
  This detection rule is designed to identify instances where a user is granted elevated permissions to manage all Azure subscriptions. Such an elevation typically involves a user being assigned the "User Access Administrator" role, which could lead to unauthorized access or modification of Azure resources, posing significant security risks to your organization. Attackers may exploit this privilege escalation to gain comprehensive control over cloud resources, facilitating lateral movement and data exfiltration, or reinforcements to their foothold in the environment.

  The key MITRE ATT&CK techniques related to this detection include:

  - **T1078 - Valid Accounts:** Exploiting legitimate account credentials for unauthorized access and actions.
  - **T1068 - Exploitation of Elevation of Privilege Vulnerabilities:** Gaining elevated access to perform administrative tasks.

  The primary data source for this rule is the Azure Audit Logs, specifically focusing on entries related to administrative role assignments and user access modifications. These logs provide critical insights into who is being assigned what roles and can help correlate actions leading to unauthorized access.

  ### Investigation Steps
  - **Review Audit Logs:** Examine the Azure Audit Logs for any recent administrative events associated with user role assignments. Look for any unapproved changes to "User Access Administrator" roles.
  - **Cross-check with Change Management Records:** Verify if the observed elevation of permissions aligns with the organization's change management or escalation policies. Confirm approval for such changes from authorized personnel.
  - **Assess User Activity:** Investigate the recent activity of the user affected by the permission elevation. Determine if there are any unusual login attempts or actions that deviate from typical user behavior.
  - **Evaluate Permissions Impact:** Analyze the implications of the assigned role on Azure resources. Identify what subscriptions and resources the elevated user now has access to and check for any suspicious access patterns.

  ### Prioritization
  This alert is marked as high severity due to its potential impact on organizational security. Unauthorized elevation of permissions could allow an attacker to manipulate critical cloud resources, leading to extensive data breaches or service disruptions.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if not all Azure subscription audit logs are being collected or if there are permissions assigned through APIs or automation tools that do not generate audit entries. The detection logic assumes that any elevation of permission is unauthorized unless explicitly approved by a system administrator. Accurate detection relies on robust logging configurations and timely log ingestion to ensure that all relevant events are captured for analysis.

