note: |
  ### Technical Context

  This Sigma rule detects the elevation of user permissions to the "User Access Administrator" role in Azure, allowing the user to manage all Azure subscriptions within the environment. The likely attacker objective is to gain broad control over Azure resources, which could facilitate further malicious activities such as data exfiltration or unauthorized access to critical services.

  The detection pertains to the MITRE ATT&CK framework under the tactic of Privilege Escalation (T1078). The primary telemetry sources include Azure Audit Logs, specifically focused on administrative configurations that indicate role assignments. If malicious, this behavior could lead to significant security risks, including unauthorized resource access and potential data breaches. It is crucial to note that this detection alone does not confirm malicious intent; legitimate administrative actions could also trigger this alert.

  ### Investigation Steps

  - **Verify event record in Azure Audit Logs:** Review logs from Azure Audit Logs, filtering for events with Category 'Administrative' and OperationName 'Assigns the caller to user access admin.' Check for affected user accounts and the timestamp of the event.

  - **Assess user account legitimacy:** Determine if the user account undergoing elevation is known and expected to have administrative rights. Cross-reference against a list of authorized personnel or accounts and check for any recent anomalous behaviors.

  - **Review administrative change approvals:** Validate if the permission elevation was pre-approved by a System Administrator. Check internal documentation or ticketing systems to confirm if the change aligns with established protocols.

  - **Look for additional suspicious activity:** Investigate if the elevated user has conducted any unusual or unauthorized actions post-elevation by examining subsequent Azure Audit Logs for resource access patterns or unauthorized service configurations.

  - **Identify correlating alerts:** Check for other alerts related to privilege escalation actions in the environment. Cross-reference with alerts related to suspicious logins (e.g., unusual login times, unknown IP addresses) from Azure AD sign-in logs.

  ### Prioritization

  This alert has a high severity due to the risk it poses to the entire Azure environment. The affected system’s criticality, coupled with the potential for malicious abuse through privilege escalation, underscores the importance of investigating such changes immediately. This behavior is also commonly weaponized by adversaries to gain extensive control over cloud resources.

  ### Blind Spots and Assumptions

  Potential evasion techniques include malicious users exploiting existing administrative protocols to elevate their privileges, which may mask unauthorized actions. Reliable detection requires comprehensive logging from Azure Audit Logs and may assume no overlaps in legitimate administrative tasks occur within timeframes that generate false positives. Legitimate activities like planned permission adjustments should also be considered. A related detection for Continuous Monitoring could include alerts for role assignment changes combined with unusual login activity to strengthen coverage against malicious actions.

