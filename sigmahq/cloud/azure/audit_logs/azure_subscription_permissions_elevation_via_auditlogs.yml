note: |
  ### Technical Context

  This rule detects when a user is granted the role of User Access Administrator on an Azure subscription, which allows them to manage access to all subscriptions under that account. The likely attacker objective is to escalate privileges and gain broad access to sensitive Azure resources, which may facilitate further exploitation or data exfiltration. The relevant MITRE ATT&CK tactics and techniques are **Privilege Escalation (T1068)** and **Valid Accounts (T1078)**.

  The primary telemetry source for this detection is Azure Audit Logs, specifically focusing on events where modifications to user roles occur. The security impact of this behavior is significant as it can allow unauthorized users to manage access rights and perform actions across critical cloud resources, potentially leading to data breaches. This detection does NOT confirm malicious intent on its own, as legitimate administrative actions can also trigger this rule.

  ### Investigation Steps

  - **Check Azure Audit Logs for the specific operation event**: Review Azure Audit Logs for the event where the operation name is "Assigns the caller to user access admin" with a focus on `Event Time`, `Caller`, and `Target resource` fields. Any unexpected assignments should be flagged for further scrutiny.

  - **Verify the identity of the user involved**: Investigate if the user who received increased privileges has a legitimate need for such access. Look for their role in the organization, and cross-reference this against recent changes in `User Role Assignments`.

  - **Review other related administrative actions**: Search for additional related events in the Azure Audit Logs around the time of the privilege escalation, such as changes to `Access Control (IAM)` with operation names like "Add role assignment" or "Remove role assignment", to identify any suspicious patterns.

  - **Identify and assess whether the change was approved**: Confirm whether this privilege change was pre-approved and documented by system administrators. Look for ticketing system logs or internal approval documents correlating to the time of the role assignment.

  - **Evaluate system role and criticality**: Determine whether the affected Azure subscriptions are hosting sensitive or mission-critical applications. High-impact services warrant immediate investigation if unauthorized access is detected.

  ### Prioritization

  This alert is of high severity due to its potential impact on cloud resources and the likelihood of malicious abuse. Privilege escalation in Azure is a common tactic for attackers, making this behavior particularly concerning. Immediate review is warranted, especially if no prior authorization is found.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of full audit logging; if auditing is not properly configured in Azure, this event may go unrecorded. Legitimate administrative changes can also trigger alerts, requiring clear validation processes for privilege changes. Related detections, such as those monitoring for configuration changes in Azure Role-Based Access Control (RBAC), can provide additional context and strengthen coverage against potential malicious activity.

