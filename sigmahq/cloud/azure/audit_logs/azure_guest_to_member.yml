note: |
  ### Technical Context

  This Sigma rule detects changes in user status from "Guest" to "Member" in Azure Active Directory, indicating possible unauthorized privilege escalation. Attackers may leverage this change to gain elevated access to resources, facilitating further malicious activities such as data exfiltration or lateral movement. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **Valid Accounts** (T1078.004).

  The primary telemetry source for this detection is Azure Active Directory audit logs, specifically the `UserManagement` category. If the alert is confirmed as malicious, it could lead to unauthorized access to sensitive user resources and potential data breaches. This detection does NOT independently confirm malicious activity since legitimate administrative actions can also trigger it.

  ### Investigation Steps

  - **Verify the operation details:** Review the Azure Active Directory audit logs to confirm the `OperationName` is `Update user` and check the fields for `oldValue` ("Guest") and `newValue` ("Member"). Look for `Event ID`: AuditLogs in the logs.

  - **Analyze user activity prior to the change:** Check the recent authentication logs for the affected user account. Review sign-in attempts (Event ID: 4624) to determine if there were any unusual access patterns or failed logins.

  - **Identify legitimate role assignments:** If the user type change is expected, validate that this change was authorized by a System Administrator. Check for any internal tickets or approvals linked to the user's account modification.

  - **Assess the user’s asset access:** Examine the roles and permissions assigned to the user after the change. Analyze the `RoleAssigned` logs for sensitive resource access rights to evaluate risk.

  - **Determine contextual factors of change:** Investigate if the change coincides with other suspicious activities, such as multiple failed logins or privilege escalations occurring in a similar timeframe.

  - **Look for additional endpoint indicators:** If the affected user account shows signs of further activity, check for file access logs related to sensitive data on the endpoints they accessed. Validate logs for downloads or modifications that could indicate exfiltration attempts (e.g., SharePoint or OneDrive access logs).

  ### Prioritization

  This alert should be treated with medium priority. While the scope of impact largely depends on the system's role, any unauthorized elevation to member status poses a moderate risk, as it may provide attackers with broader access to resources. Privilege escalation behaviors are often weaponized in attacks, heightening the necessity for prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative changes, which could falsely trigger the rule. It is essential to ensure Azure Active Directory audit logs are enabled and properly configured to capture the necessary events. Legitimate activities, such as a planned administrative user upgrade or scheduled account management, may also trigger this alert. A companion detection could include auditing for `UserCreated` events to strengthen overall monitoring of account changes.

