level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes in user account types from "Guest" to "Member" within an Azure Active Directory environment. This type of modification may indicate a possible elevation of privilege attempt by an adversary aiming to gain broader access to resources or perform unauthorized actions. The relevant MITRE ATT&CK tactic is **Persistence**, with the corresponding technique being **Valid Accounts (T1078.004)**.

  Primary telemetry sources include Azure audit logs specifically focusing on user management activities. If malicious, this behavior can lead to unauthorized access and actions within the organization’s resources, thereby posing a significant security risk. However, this rule does NOT confirm malicious activity on its own, as it can also occur as part of a legitimate administrative process.

  ### Investigation Steps

  - **Investigate operation details:** Review Azure Audit Logs for Event Category 'UserManagement' and OperationName 'Update user'. Confirm if the user responsible for the change has appropriate administrative privileges.

  - **Check user activity reports:** Query Azure AD sign-ins for the time window around the change (using Azure AD logs). Confirm whether the account in question was actively signing in, which would indicate legitimate usage versus potential compromise.

  - **Identify administrative approval:** Validate if the role change from "Guest" to "Member" was documented or approved by a System Administrator. Look for associated ticketing system entries or internal communications confirming the request.

  - **Review invoked modifications:** Explore the 'properties.message' field in the Azure logs for signs of unusual or repetitive changes across multiple accounts that may suggest scripted or automated attempts to compromise accounts.

  - **Assess account sensitivity:** Note the role and permissions assigned to the user post-elevation. Verify if the account is associated with sensitive assets or critical systems within the enterprise, increasing threat impact if abused.

  ### Prioritization

  This alert is medium severity as it suggests a potential risk of privilege escalation. The impact level is high if the affected user has access to sensitive systems, but the likelihood of malicious abuse depends on the context of the user’s role and the legitimacy of the change request.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of detailed logging configurations in Azure AD. Legitimate administrative activities can easily trigger this alert if not monitored with contextual acknowledgment. An important companion detection would be monitoring for failed sign-in attempts from the same user before the elevation, indicating possible credential abuse prior to a legitimate change.

