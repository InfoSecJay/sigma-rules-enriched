title: User State Changed From Guest To Member
id: 8dee7a0d-43fd-4b3c-8cd1-605e189d195e
status: test
description: Detects the change of user type from "Guest" to "Member" for potential
  elevation of privilege.
references:
- https://learn.microsoft.com/en-gb/entra/architecture/security-operations-user-accounts#monitoring-external-user-sign-ins
author: MikeDuddington, '@dudders1'
date: 2022-06-30
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.initial-access
- attack.t1078.004
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    Category: 'UserManagement'
    OperationName: 'Update user'
    properties.message: '"displayName":"UserType","oldValue":"[\"Guest\"]","newValue":"[\"Member\"]"'
  condition: selection
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context
  This detection rule identifies changes in user account types from "Guest" to "Member," which may indicate potential privilege escalation by an unauthorized user. Such activity could suggest that an attacker is attempting to gain broader access to sensitive resources within the organization, possibly to perform reconnaissance or execute malicious actions. Given Azure's role in managing user identities and permissions, this alteration in user status could directly correlate to unlawful access attempts, such as exploiting a vulnerability or leveraging credentials.

  The relevant MITRE ATT&CK techniques associated with this detection include **T1078.004: Valid Accounts: Local Accounts** and aspects of **Persistence**, **Defense Evasion**, and **Privilege Escalation** tactics. The detection leverages data sourced from Azure's audit logs that track user management activities, specifically focusing on operations involving changes to user roles and their corresponding properties.

  ### Investigation Steps
  - **Review Audit Logs**: Check Azure audit logs for additional context surrounding the user role change. Look for preceding or following changes made to the same user account or other related accounts.
  - **Correlate with Authentication Logs**: Examine logs for unusual sign-in activity or multiple failed authentication attempts that could indicate an attempted account takeover prior to the privilege escalation.
  - **Assess User Activity**: Investigate the user’s activity post-role change for any suspicious behavior, such as accessing sensitive resources or attempting to manipulate configurations.
  - **Verify Authorization**: Confirm whether the account changes were performed by a legitimate System Administrator and check for any alerts or approvals that would indicate authorized actions.

  ### Prioritization
  This alert is classified as medium severity because unauthorized role changes can lead directly to unauthorized access to critical assets and sensitive data. If left unaddressed, such changes can significantly increase the organization's attack surface.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for cases where legitimate administrative changes are made under approved circumstances. The detection logic assumes that any change from "Guest" to "Member" without proper authorization represents a potential security risk. For the alert to function effectively, comprehensive auditing of user management within Azure must be enabled and properly configured to capture all user role alterations.

