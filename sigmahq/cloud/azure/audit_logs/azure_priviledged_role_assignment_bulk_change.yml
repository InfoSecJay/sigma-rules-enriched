note: |
  ### Technical Context
  This detection rule identifies instances where users are being removed from privileged roles in bulk within an Azure Active Directory environment. Such deletions can indicate malicious activities aimed at disrupting operations, hiding the presence of an attacker, or facilitating unauthorized access by modifying user permissions. Attackers may seek to manipulate access controls to evade detection or prepare the environment for further exploitation.

  The actions detected through this rule align with several MITRE ATT&CK tactics and techniques, particularly those involving "Privilege Escalation" (T1068) and "Persistence" (T1098). In this scenario, the attacker may aim to escalate their privileges or maintain persistent access by modifying the permissions of critical accounts. The primary data source for this rule stems from Azure's audit logs, which track changes in role assignments and permissions.

  ### Investigation Steps
  - **Review Audit Logs:** Examine the Azure audit logs for entries related to bulk removal of users from privileged roles. Look for patterns in the timing and frequency of these changes.
  - **Verify User Activity:** Investigate the accounts that executed the removal actions to ensure they are legitimate users with appropriate administrative permissions. Look for any atypical account behavior or access patterns.
  - **Cross-Reference Changes:** Check for any corresponding changes to other accounts that may suggest broader privilege manipulation or account takeover attempts. This may include changes in group memberships or elevated permissions around the same timeframe.
  - **Assess Impact:** Determine the potential impact of these deletions on operational capabilities. Identify which users lost access to privileged roles and evaluate the necessity of their permissions for business operations.

  ### Prioritization
  This alert is considered high severity due to the potential risk of unauthorized access and privilege escalation that may result from improper or malicious modifications to user permissions. The likelihood of this threat occurring increases with the prominence of privileged roles within the organization.

  ### Blind Spots and Assumptions
  This detection may not capture scenarios where privileged roles are altered without bulk deletion (i.e., single deletions may go unnoticed) or legitimate administrative actions that can occur during intentional user account changes. The detection logic assumes that the bulk removal of users from privileged roles is inherently suspicious, which may overlook legitimate administrative activities if proper governance and oversight are not in place. Additionally, Azure audit logging must be correctly configured to ensure these actions are logged and available for analysis.

