note: |
  ### Technical Context

  The rule detects bulk removal of users from privileged roles within Azure Active Directory, which may indicate an attempt to undermine account access or privileges. Attackers may aim to disrupt administrative capabilities or manipulate permissions to further their objectives, potentially facilitating lateral movement or persistence. This behavior aligns with the MITRE ATT&CK tactic of **Privilege Escalation** (TA-0022) and technique **T1098: Account Manipulation**.

  The primary telemetry source is Azure Active Directory's audit logs, which include entries related to role assignments and modifications. If malicious, the impact could range from unauthorized access changes to potential breach exploitation. However, this detection alone does not confirm malicious intent; legitimate administrative actions may also trigger it.

  ### Investigation Steps

  - **Review Azure AD Audit Logs**: Look for entries under Event Category “RoleManagement” for Event IDs associated with role removals. Pay attention to user accounts making changes, particularly if they are not standard administrators.

  - **Identify Bulk Changes**: Check if the detected entries indicate multiple users being removed in a single action. Legitimate activity usually involves granular changes, not bulk operations.

  - **Cross-reference User Activity**: Investigate the user or service principal responsible for the removals by correlating their recent activities in Azure AD logs (e.g., sign-in logs) for unusual patterns or times.

  - **Validate Account Permission Levels**: Look for any accounts that were removed from privileged roles and verify if they previously held administrative rights, including details on their access history.

  - **Check for Recent Permission Granting**: Investigate if there were recent bulk addition events (Event category “RoleManagement”, role assignment changes). If the same user or account was granted certain roles just before the removals, this could point to malicious lateral movement.

  - **Monitor for Subsequent Activities**: After a bulk removal alert, ensure to check for related access attempts, unauthorized logins, or permission escalations on critical systems.

  ### Prioritization

  This alert is High Severity due to the potential impact on privileged accounts which can lead to significant security risks if misused. The likelihood of malicious exploitation is pronounced, especially if the operation aligns with known tactics used by adversaries in privilege manipulation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into legitimate administrative actions that can also trigger this alert, such as routine role management. Ensure logs from Azure AD Audit and Sign-in logs are configured properly for reliable detection. Legitimate bulk role removals during administrative housekeeping could result in false positives. A related detection strategy could involve monitoring for suspicious login patterns following changes to privilege assignments.

