note: |
  ### Technical Context
  This rule detects instances where new credentials are added to an existing application within Azure environments. When a malicious actor gains unauthorized access, they may add their own credentials to compromise application security, enabling privileged access or persistent threats. The use of unexpected processes to add these credentials signals a potential breach, necessitating immediate investigation.

  The threat scenario typically revolves around privilege escalation and persistence in cloud environments. Attackers may seek to manipulate application settings to create a backdoor for ongoing access or to escalate privileges, which can facilitate further malicious activity. This behavior aligns with the MITRE ATT&CK techniques such as T1098.001 (Account Manipulation: Application Credential) and T1136 (Create Account), where unauthorized addition or modification of credentials is a critical vector.

  The primary data sources for this detection include Azure audit logs, which provide comprehensive records of application-level changes, including the addition of credentials or service principals. Analyzing these logs can reveal unauthorized modifications that warrant further scrutiny.

  ### Investigation Steps
  - **Review Azure Audit Logs:** Collect and examine the relevant Azure audit logs focusing on entries related to credential modifications for applications. Look specifically for any timestamps and user accounts outside of expected operational hours.

  - **Identify User Context:** Determine the identity of the user or service principal that initiated the addition of credentials. Assess whether this account is legitimate and whether it exhibits any anomalous behavior or access patterns.

  - **Analyze Change Patterns:** Look for patterns of behavior around the credential addition. Identify if previous changes have been made by the same user or service principal and if those changes were authorized as part of standard operational procedures.

  - **Investigate Application Behavior:** If credentials were added, validate whether there is abnormal application behavior or access attempts that could indicate a compromise, linking back to the added credentials.

  ### Prioritization
  This alert is critical in an enterprise context due to the potential for significant impact. Unauthorized credential changes can lead to compromised accounts, data breaches, and further exploitation of vulnerabilities, making timely investigation essential to mitigate risk.

  ### Blind Spots and Assumptions
  This detection rule may miss instances of credential additions during normal working hours or those that are part of pre-approved workflows, potentially leading to false positives. The logic assumes that any change to application credentials outside of expected patterns is malicious, which may not encompass all scenarios. Additionally, comprehensive logging and alerting must be enabled within Azure audit systems to ensure that all relevant changes are captured for effective alerting.

