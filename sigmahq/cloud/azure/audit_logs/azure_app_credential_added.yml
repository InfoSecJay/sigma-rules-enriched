  ---

  ### Technical Context

  This Sigma rule detects the addition of new credentials to existing applications in Azure. This behavior may indicate an attacker attempting to gain elevated access or maintain persistence within the environment by modifying application credentials without following standard processes. The relevant MITRE ATT&CK tactic is **Privilege Escalation** (T1068), specifically the technique **Exploitation for Credential Access** (T1098.001). The primary telemetry source is Azure audit logs pertaining to application management, specifically the logs that capture updates to application credentials.

  If malicious, the impact could be significant, as unauthorized credentials enable lateral movement or access to sensitive resources. It's important to note that this detection does not confirm malicious intent on its own, as legitimate updates to application credentials during operational workflows could also trigger this alert.

  ---

  ### Investigation Steps

  - **Review Azure Audit Logs for Changes**: Examine Azure audit logs (Event Type: `Update application - Certificates and secrets management` or `Update Service principal/Update Application`) around the time of the alert. Identify any unusual accounts or non-standard operational times that can indicate potential malicious activity.

  - **Identify User Account Context**: Check the user account making the credential addition. Look for accounts that typically should not make changes to application settings (e.g., standard user accounts), which could indicate an attacker using a compromised account.

  - **Assess Normal Operational Activity**: Validate if the credential update aligns with expected workflows during normal business hours. Authentic changes often come with documented support tickets or prior communications.

  - **Cross-Reference with App Management Teams**: Engage with relevant application management teams to verify if they are aware of any scheduled updates or legitimate credential changes. Compare timestamps from logs with any known maintenance schedules.

  - **Check for Anomalous API Calls**: Analyze for any associated API calls in the Azure audit logs that could show unusual patterns or sequences prior to the credential addition, indicating potential reconnaissance or preparation stages typical of an attacker.

  - **Look for Credential Linking**: Investigate if the added credentials are linked to actions involving sensitive resources or roles that escalate privilege or access critical services, noting potential indicators of an ongoing attack.

  ---

  ### Prioritization

  This alert is high severity due to the potential for significant impact if malicious actors gain unauthorized access to sensitive applications. The ability to add credentials is often weaponized as it allows lateral movement and abuse of privileges, making it a common behavior of threat actors in environments with minimal access controls.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded through rapid credential changes during legitimate business operations, potentially leading to false negatives. Additionally, the detection relies on proper logging configurations in Azure; missing audit logs can diminish visibility into these activities. Legitimate automated processes or DevOps activities may trigger this alert, necessitating context from operational teams. Companion detections such as monitoring for anomalous login attempts or unusual administrative activities can enhance overall monitoring and reduce false positive rates.

