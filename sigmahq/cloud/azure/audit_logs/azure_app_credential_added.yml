note: |
  ### Technical Context

  This rule detects when new credentials are added to an existing application in Azure. This behavior may indicate an attacker’s objective to escalate privileges or maintain persistence by injecting their credentials into applications, potentially to exfiltrate data or execute unauthorized actions. This detection relates to the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and the technique of Application Layer Credentials (T1098.001).

  Telemetry is primarily sourced from Azure Audit Logs, specifically looking for entries related to applications where modifications to certificates and secrets management occur. If malicious, this could allow unauthorized access and control over applications, making it critical to investigate. It's important to note that this detection does NOT confirm malicious activity on its own, as it may also occur during legitimate credential rotations or updates.

  ### Investigation Steps

  - **Check for legitimate application changes:**
    Review Azure Audit Logs (Event ID specific to application updates) for entries during normal business hours and correlate with known application change schedules. Ensure updates match documented workflows.

  - **Identify new credentials added:**
    Look for logs containing the message 'Update application - Certificates and secrets management' or 'Update Service principal/Update Application'. Verify if the added credentials belong to authorized users.

  - **Review affected application role:**
    Determine the criticality of the involved application. If it is a critical enterprise service, prioritize the investigation as it may represent a higher risk for data exposure.

  - **Correlate with user activity:**
    Analyze Azure Active Directory sign-ins (Audit Logs) around the same time to see if there are unauthorized access attempts or suspicious behavior from users associated with the new credentials.

  - **Search for unusual application privileges:**
    Identify whether the newly added credentials have been granted elevated permissions or roles within the application. Unusual privilege assignments may indicate malicious intent.

  ### Prioritization

  This alert is deemed high severity due to the potential impact on sensitive applications and data access. The likelihood of malicious abuse is elevated, especially if combined with other anomalous IAM changes. Such behaviors are often weaponized in credential theft and privilege escalation attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the non-universal configuration of Azure's logging capabilities, which can result in missing logs. Legitimate business processes, such as routine updates or developer actions, may trigger this alert. A related detection to consider is monitoring for logins made using administrative privileges shortly before or after credential updates, as it could strengthen the identification of malicious activity.

