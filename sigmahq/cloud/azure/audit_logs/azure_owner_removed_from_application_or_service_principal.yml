note: |
  ### Technical Context

  This rule detects the removal of an owner from an application or service principal in Azure. The likely attacker objective is to disrupt access control, potentially facilitating unauthorized access to applications or resources while masking their tracks. This behavior aligns with the MITRE ATT&CK tactics of "Stealth" (T1564.001).

  Primary telemetry sources include Azure Audit Logs, specifically monitoring for operations like 'Remove owner from service principal' and 'Remove owner from application.' If malicious, this action can lead to significant security risks such as unauthorized access or denial of service for legitimate users. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative activities may trigger this rule if not correlated with other context.

  ### Investigation Steps

  - **Analyze the user initiating the action:** Review Azure Audit Log entries for the relevant event IDs (e.g., 'Remove owner from service principal' or 'Remove owner from application') to identify the user who performed the removal. Determine if this user typically has rights for such actions.

  - **Validate context of removal:** Check the historical audit logs for changes associated with this application or service principal. Verify if this removal aligns with usual administrative patterns or if it's out of the ordinary (e.g., unusual user location or timing).

  - **Cross-reference with recent access attempts:** Assess user sign-ins around the same timeframe in Azure Active Directory logs (Event ID 4624) to identify any anomalous or unauthorized access that may correlate with the owner removal event.

  - **Identify benign scenarios:** Consider whether this event aligns with known administrative changes, such as expected owner removals when updating application permissions due to organizational restructuring.

  - **Flag high-confidence malicious indicators:** Look for repeated removal events over a short time span or removal actions performed by non-administrative users that fall outside typical roles, indicating potential reconnaissance or malicious intent.

  ### Prioritization

  This alert is of medium severity. While the impact can be high if a critical service principal is affected, the likelihood of malicious abuse needs careful evaluation based on user behavior and context. Such behaviors can be weaponized in targeted attacks, but they also occur in legitimate administrative operations.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative actions to trigger alerts, particularly if not properly monitored. Required log sources include properly configured Azure Audit Logs to capture all relevant owner removal events. Legitimate activities, such as periodic administrative updates, may cause false positives. A related detection might involve monitoring failed sign-in attempts or unusual access patterns to provide further context to any owner removal events.

