note: |
  ### Technical Context

  This Sigma rule detects the removal of a service principal in Azure, indicating potential unauthorized access or management changes to applications and resources. The likely attacker objective is to dismantle access mechanisms, thereby disrupting services or covering their tracks post-compromise. This behavior is related to the MITRE ATT&CK technique "Account Manipulation" (T1098), wherein an adversary alters account settings to gain a foothold or obfuscate their actions.

  The primary telemetry source is Azure audit logs, specifically capturing events with the operation name 'Remove service principal'. If malicious, this activity can critically impact the security posture by removing essential application access controls. However, this detection does NOT confirm malicious intent on its own; it merely indicates that a service principal was removed, necessitating further investigation into the context of the change.

  ### Investigation Steps

  - **Verify user identity and permission level:** Check the user or service account that initiated the removal by reviewing Azure audit logs for the user identity (e.g., `initiatedBy` field in the event). Legitimate changes should often be made by admins or well-known service accounts.

  - **Review the timestamp of the event:** Cross-reference the removal time with any recent suspicious activity in related logs, such as logins from unfamiliar IP addresses or accounts not typically associated with administrative tasks. Azure Logins can be reviewed (Sign-ins logs) for time correlation.

  - **Evaluate the service principal's role and function:** Identify the service principal that was removed to understand its purpose and dependencies. Service principals tied to critical applications should raise flags if removed unexpectedly.

  - **Correlate with additional Azure activity:** Audit logs for recent changes (Event ID relevant to Azure actions), looking for patterns in account manipulations or changes around the time of the service principal removal, which may indicate coordinated activity.

  - **Check for false positives:** Ensure that the context of removal was not part of intended administrative workflows. For situations where a service principal is routinely removed, assess the known associated admin actions or documented changes.

  - **Identify high-confidence malicious indicators:** Look for subsequent changes that indicate misuse of privilege, such as unauthorized creation of new service principals or suspicious delegations immediately following the removal event.

  ### Prioritization

  This alert is of medium severity due to the potential impact on application accessibility and security. The likelihood of malicious abuse is moderate, especially if the removal occurs under unusual circumstances or by unauthorized accounts. Given that adversaries often seek to manipulate access controls, awareness is vital.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering false positives, particularly if roles are poorly managed or documented. Required log sources include comprehensive Azure audit logs and access logs for the Azure Active Directory, ensuring all related events are captured. Additionally, automated remediation scripts or system maintenance tasks may also trigger the alert. A related detection to strengthen coverage could be monitoring for "Add service principal" or "Update service principal" actions occurring shortly after a removal event.

