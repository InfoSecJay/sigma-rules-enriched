note: |
  ### Technical Context
  This detection rule monitors for modifications made to user risk and multi-factor authentication (MFA) registration policies in Microsoft Azure. Such changes may indicate unauthorized attempts by attackers to weaken security measures, allowing them to bypass MFA and potentially gain persistent access to resources. The modification of these policies could be a precursor to further attacks, as attackers seek to exploit lower security thresholds to facilitate unauthorized access.

  The detection is aligned with the MITRE ATT&CK framework, particularly under the tactics of **Persistence** (TA0003) and **Credential Access** (TA0006). Specific techniques related to this detection include **Account Manipulation** (T1098) and **MFA Fatigue** (T1074), where attackers manipulate account settings to reduce the effectiveness of existing security protocols.

  The primary data sources for this detection will be Azure audit logs, which capture activities related to policy changes, specifically those actions undertaken through the Azure Active Directory Management UX.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze Azure audit logs for the `Update User Risk and MFA Registration Policy` operation to understand the context and actor initiating the change.
  - **Identify Unauthorized Changes**: Cross-reference the changes made with known maintenance schedules or authorized updates to ascertain if the modifications were legitimate.
  - **Assess Impact on Security**: Evaluate the implications of the policy changes on the organization's risk posture, focusing on the specific alterations to the MFA requirements and user risk assessment thresholds.
  - **Monitor User Activity**: Look for unusual user behaviors or access patterns following the policy update, which may indicate exploitation attempts.

  ### Prioritization
  This alert is considered high severity due to the critical nature of MFA controls in securing user identities. Unauthorized modifications can severely impact the integrity of the security model, increasing the likelihood of successful breaches.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage lies in the reliance on Azure audit logs, which may not capture all instances of policy changes if the logging level is insufficiently configured. Additionally, the detection logic assumes that any policy update not documented as authorized is malicious, which might lead to false positives. To enhance detection efficacy, ensure comprehensive logging is enabled for auditing Azure activities, particularly focusing on administrative changes.

