  ---
  ### Technical Context

  This Sigma rule detects modifications to the user risk and Multi-Factor Authentication (MFA) registration policy within Azure Active Directory (AAD). Such changes may be executed by an attacker aiming to weaken security controls, bypass MFA protections, and facilitate unauthorized access to sensitive systems. The relevant MITRE ATT&CK tactic is "Persistence" (TA0003) and the technique is "Application Layer Protocol" (T1071).

  The primary telemetry source for this detection is the Azure audit logs, specifically events related to user and group management operations. Malicious alterations to these policies can severely impact the organization’s security posture by creating opportunities for exploitation. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative updates may trigger similar log entries.

  ---

  ### Investigation Steps

  - **Review audit logs for operation details:** Investigate Azure Audit Logs for Event IDs associated with "Update User Risk and MFA Registration Policy." Check for anomalies like unexpected timestamps or unusual user accounts performing these operations.

  - **Identify the user account making the changes:** Confirm whether the account that triggered the alert is legitimate. Review the account's activity history in Azure Active Directory for unusual access or privilege changes.

  - **Verify legitimate changes:** Cross-reference policy updates with documented administrative actions. Conduct a review of the organization's change management records to identify if the modification aligns with approved security policies.

  - **Look for high-risk indicators:** Identify if the operation was conducted from a non-standard or unusual IP address. Check for simultaneous access requests or changes to other security settings (e.g., enabling risky user roles).

  - **Assess impact on MFA applicability:** Determine whether the updated policy introduces any weaker security thresholds that adversely affect multi-factor authentication requirements. Evaluate if there are any known vulnerabilities associated with these changes.

  - **Check for related activities in Azure logs:** Review Azure Sign-ins and Risky Sign-ins logs for subsequent logins or suspicious patterns following the policy update, indicating potential exploitation attempts.

  ---

  ### Prioritization

  The alert has a high severity due to potentially critical impacts on an organization's security structure. If malicious activity succeeds, attackers can gain unauthorized access, compromising sensitive systems. Furthermore, this behavior is notably weaponized in various attack scenarios, making it essential to prioritize investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss if policies are altered via API calls rather than through the AAD Management UX, focusing on legitimate administrative activities that might trigger similar alerts. There is a need for comprehensive logging configurations to capture all relevant actions for effective detection. Companion detections such as monitoring Azure Sign-ins can provide additional context about possible exploitation attempts after policy changes.

