note: |
  ### Technical Context

  This rule detects changes to the user risk and MFA registration policy within Azure Active Directory (AAD). Attackers may aim to modify these policies to compromise multi-factor authentication (MFA) mechanisms, decreasing account security and facilitating further unauthorized access. The relevant MITRE ATT&CK tactic is **Persistence**, with the technique being **Valid Accounts (T1078)**.

  The primary telemetry source is Azure audit logs, specifically the logs associated with policy changes logged under the `AAD Management UX` service. If malicious, the impact could be significant as it may allow attackers to bypass essential authentication measures. This detection does NOT confirm that an attack has occurred; it only indicates a policy change that requires further investigation to determine intent.

  ### Investigation Steps

  - **Validate context of the change**: Review the Azure audit logs for Event Types involving `Update User Risk and MFA Registration Policy` (Audit logs, Operation name field). Confirm whether the change aligns with documented administrative activities, such as routine updates or policy adjustments.

  - **Identify the user performing the action**: Analyze the `initiatedBy` field in Azure audit logs to determine who triggered the policy change. Legitimate changes should be made by known administrators; anomalies should be further scrutinized.

  - **Check the timing and frequency**: Look at the timestamp of the policy changes (Event timestamp in Azure audit logs) to determine if they correlate with suspicious activity or off-hours access patterns, which may suggest unauthorized user behavior.

  - **Examine previous policy states**: Retrieve historical policy settings and observe any significant deviations from established security standards. Discrepancies may indicate tampering or attempted security reduction.

  - **Cross-reference with other alerts**: Review related security alerts during the same timeframe for any additional indicators of compromise, such as suspicious account logins or privilege escalations, to establish a comprehensive view of the potential threat.

  ### Prioritization

  This alert should be considered high severity due to its potential to weaken security measures critical to the protection of sensitive user accounts. The likelihood of malicious abuse is heightened, as altering MFA policies is a common tactic employed by attackers to maintain persistence or facilitate unauthorized access.

  ### Blind Spots and Assumptions

  The detection can be bypassed by malicious actors with legitimate user credentials, particularly if they are administrators. Ensuring reliable logging configurations for Azure audit logs is crucial for detection. Additionally, legitimate changes by known administrators may trigger this alert, so context is essential. A related detection to consider is monitoring for unusual administrative access patterns that may indicate account compromise.

