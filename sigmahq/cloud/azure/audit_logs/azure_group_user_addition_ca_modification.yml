note: |
  ### Technical Context

  This rule detects the addition of a user to a group that has Conditional Access (CA) policy modification access within Azure. The likely attacker objective is to escalate privileges and manipulate access controls to sensitive resources. The relevant MITRE ATT&CK techniques include: T1548 (Abuse Elevation Control Mechanism) and T1556 (Credential Dumping). The primary telemetry source is Azure Audit Logs, specifically looking for events related to group membership changes. If malicious, this could allow an unauthorized user to modify CA policies, increasing the risk of unauthorized access to secure assets. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative changes may trigger the same alert.

  ### Investigation Steps

  - **Review audit logs for group additions:** Check Azure Audit Log Event ID for "Add member from group." Look for entries that include suspicious or unauthorized users added to high-privilege groups such as "Global Admins" or "Conditional Access Admins."

  - **Validate administrative actions:** Confirm if the user added had recent legitimate requests or administrative activity (e.g., ticket submissions) within the ITSM system that may justify the addition. If found, this may indicate benign behavior.

  - **Investigate user roles for abnormal behavior:** Retrieve user roles and groups from Azure AD within the last 30 days to identify any applied changes. Look for an increase in privileges without a valid business justification.

  - **Cross-reference user activities:** Analyze the user's Azure MFA activity for recent sign-ins to ensure they correlate with acceptable patterns – e.g., no unusual geographical access points or times of access.

  - **Monitor related conditional access policies:** Review the specific CA policies linked to the affected group to determine if there were modifications following the user addition. Look for Event ID 7910 (policy modified) that might indicate further unauthorized changes.

  - **Check for automation tools:** Identify whether the addition was made via an automation tool (such as PowerShell scripts) by inspecting Activity Logs for any unusual scripting activities that correlate with the timing of the group addition.

  ### Prioritization

  This alert should be prioritized as medium severity. The impact on sensitive systems could be significant if malicious data or access are gained. The likelihood of abuse is moderate, given that CA policy modification access is highly coveted among attackers, but the frequency of legitimate administrative actions may reduce overall urgency.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as using legitimate credentials or services to make group modifications unnoticed. Required log sources for reliable detection include ensuring comprehensive Azure Audit Logs are actively collected and retained. Legitimate administrative personnel increasing group memberships may trigger alerts, necessitating a clear understanding of group administration practices. A companion detection could involve monitoring for unauthorized modifications to critical service roles or policies, reinforcing coverage of potential privilege escalation attempts.

