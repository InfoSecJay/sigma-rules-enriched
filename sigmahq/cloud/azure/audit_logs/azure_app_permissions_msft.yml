note: |
  ### Technical Context

  This Sigma rule detects when an application is granted delegated or app role permissions within the Microsoft ecosystem, specifically targeting Microsoft Graph, Exchange, SharePoint, or Azure AD. Such behaviors could indicate attempts by an attacker to escalate privileges, enabling unauthorized application access to sensitive data and resources for nefarious purposes. Relevant MITRE ATT&CK tactics include Credential Access (T1518) and potentially Execution by granting unauthorized access to resources.

  The primary telemetry for this detection is sourced from Azure audit logs, specifically events that track permission grants for applications. If malicious, this behavior could enable data exfiltration or manipulation by a compromised or malicious service principal. However, this detection does NOT confirm that the permissions are being misused; legitimate applications also require such permissions for functioning.

  ### Investigation Steps

  - **Review recent permission grants:** Check Azure audit logs for Event IDs related to "Add delegated permission grant" and "Add app role assignment to service principal" within the last 7 days. Confirm if they correspond to known or whitelisted applications.

  - **Analyze application purpose:** Identify the application acquiring the permissions. Verify its purpose and expected behavior against your organization's application catalog. Consult fields like `appId`, `displayName`, and `servicePrincipalId` within the logs.

  - **Identify high-confidence malicious indicators:** Look for patterns of permission grants from unknown or unapproved applications, especially those requesting high-privilege permissions on sensitive resources. Specific permissions such as those related to "All mailboxes" or "Full access to SharePoint sites" raise red flags.

  - **Correlate with user activities:** Validate whether these permission grants correlate with anomalous user activity, such as unusual login locations or times. Review user logs (Azure AD Sign-In logs) for any spikes in access following application permission grants.

  - **Assess legitimate application behavior:** Determine common scenarios of legitimate permission grants, such as initial configuration of CI/CD pipelines, to help differentiate benign from malicious activities. Such scenarios should have a clear business justification tied to service principals known in the environment.

  - **Check for prior alerts or incidents:** Review historical incidents and alerts related to app permission grants that have been categorized as false positives to contextualize the current alert. Cross-reference with threat intelligence databases for recognized malicious IPs or domains.

  ### Prioritization

  This alert has high severity due to the significant impact an application with escalated permissions may have on an organization, specifically if it has access to sensitive data. The likelihood that attackers leverage similar tactics makes this alert very critical, as malicious actors frequently target app permissions to facilitate further exploitation.

  ### Blind Spots and Assumptions

  The detection may miss evasion techniques where attackers leverage legitimate applications to request permissions, assuming that these applications are trustworthy. Additionally, without comprehensive logging from the Azure environment, the detection could fail to capture all relevant activities. Legitimate business operations, particularly during onboarding of applications or services, may trigger this alert. Related detections, such as unusual authentication patterns for service principals or excessive permission grants, should be implemented to enhance overall security posture.

