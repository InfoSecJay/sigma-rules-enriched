  ---

  ### Technical Context

  This Sigma rule detects the granting of delegated permissions or app role assignments to applications within Microsoft environments such as Microsoft Graph, Exchange, SharePoint, or Azure AD. The likely attacker objective is to gain unauthorized access to sensitive resources or to escalate privileges by leveraging these granted permissions. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (T1078) using techniques such as Application Layer Protocol (T1528).

  The primary telemetry source is the Azure audit logs, specifically looking for events related to permission grants. The security impact if these actions are malicious can include unauthorized data access, data exfiltration, and potential lateral movement within the environment. It is important to note that this detection does NOT confirm whether the actions were initiated by a legitimate user or an attacker without further contextual analysis.

  ---

  ### Investigation Steps

  - **Review Azure Audit Logs:** Check Azure audit logs for Event ID 110 for entries indicating "Add delegated permission grant" or "Add app role assignment to service principal" around the timestamp of the alert. Compare the app in question against known legitimate applications in your environment.

  - **Evaluate the Application’s Purpose:** Identify the application that received the permissions. Determine if it is a known and necessary tool in the enterprise. Legitimate applications typically include office productivity tools or specific internal applications documented in your organization’s asset inventory.

  - **Check for Role Assignments:** Analyze role assignments for the service principal associated with the application. Use Azure's RBAC (Role-Based Access Control) to confirm if roles such as "Company Administrator" or "Global Reader" have been assigned, which may indicate potentially risky permissions.

  - **Investigate User Context:** Review who initiated the permission change by examining the “initiated by” field in the audit logs. Suspicious actions from service accounts or unexpected users should be flagged as they could indicate credentials being misused.

  - **Correlate with Other Alerts:** Look for other alerts that indicate unusual behavior, such as failed logins or MFA bypass attempts, to assess if these permission grants correlate with a larger attempted compromise within the environment.

  - **Identify Legitimate Exception Cases:** Consult with relevant teams (e.g., DevOps, Application Support) to validate if the permission was legitimately requested as part of normal operational activity and document this for future reference.

  ---

  ### Prioritization

  This alert is of high severity due to the direct implications for credential access with potentially sensitive data exposure involved. The likelihood of malicious abuse is significant, especially if associated with anomalous user behavior, as attackers frequently leverage granted permissions to escalate privileges and access protected resources.

  ---

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate permissions to be granted during regular operations, which may trigger these alerts, leading to false positives. Reliable detection necessitates comprehensive logging of Azure audit activities and a well-defined baseline of legitimate application access. Legitimate developer or admin activities may also trigger this alert, particularly during application deployment or integration processes. A related detection rule focusing on unusual service principal logins or failed authentication attempts would provide complementary coverage.

