note: |
  ### Technical Context
  This detection rule identifies instances when an application is granted delegated or app role permissions within the Microsoft environment, specifically targeting Microsoft Graph, Exchange, SharePoint, or Azure AD. The primary concern revolves around potentially malicious applications that may gain unauthorized access to sensitive information or execute actions within the user's context, which could lead to data leakage or unauthorized operations.

  In a threat scenario, attackers may leverage an application’s elevated permissions to move laterally through the network, access user data, or compromise accounts with much higher privileges. This is particularly relevant as many attacks today are increasingly targeting authentication processes and application permissions as a means of executing their objectives.

  The following MITRE ATT&CK tactics and techniques are relevant to this detection:
  - **Credential Access (TA0006)**, which describes techniques for stealing or obtaining authentication credentials.
  - **Application Layer Protocol (T1071)** that may be exploited to communicate with legitimate services under the guise of normal operations.

  Key telemetry sources that provide evidence to support this detection include audit logs from the Azure Active Directory, particularly focusing on application permission grants.

  ### Investigation Steps
  - **Review Audit Logs**: Check Azure AD audit logs for any recent "Add delegated permission grant" or "Add app role assignment to service principal" entries to identify the application's permission changes.

  - **Verify Application Ownership**: Investigate the owning entity of the application being granted permissions. Identify whether it belongs to a known trustworthy source, and assess if the permissions requested are legitimate.

  - **Assess Impact**: Determine what data and resources the application now has access to as a result of the permission grant. Pay attention to highly privileged actions that could lead to significant impacts if abused.

  - **Monitor for Anomalies**: Look for unusual activity or patterns following the permission grant. This includes unexpected access to sensitive data or actions that the legitimate users of the application would not normally perform.

  ### Prioritization
  This alert carries a high severity level due to the potential for significant impact stemming from unauthorized data access and privilege escalation within the enterprise. The likelihood of malicious applications being granted extensive permissions warrants immediate attention.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for permissions granted to benign applications that genuinely require elevated rights for legitimate operations, which could lead to false positives. The detection relies on the accuracy and completeness of Azure AD audit logs; if logging is not adequately configured, the alert may miss crucial events or present incomplete data. It is assumed that analysts have baseline knowledge of legitimate applications and their permission requirements in the enterprise.

