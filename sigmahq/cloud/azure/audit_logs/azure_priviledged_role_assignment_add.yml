note: |
  ### Technical Context

  This rule detects when a user is added to a privileged role within Azure Active Directory, indicating a potential elevation of privileges. This behavior can allow an attacker to gain increased access to sensitive resources, which may facilitate lateral movement, data exfiltration, or further compromise of the environment. The relevant MITRE ATT&CK tactic is "Privilege Escalation," specifically technique T1078.004 (Authorized Credential Use).

  The primary telemetry source for this alert is Azure Active Directory audit logs, particularly focusing on records showing role assignments. If a legitimate administrator adds a user to a privileged role, this is a routine action; however, if an unauthorized user attempts to obtain these privileges, it poses a significant security risk. Importantly, this detection does NOT confirm that the action is malicious; further investigation is necessary to validate the context and intent behind the role assignment.

  ### Investigation Steps

  - **Check the audit logs for role changes:** Review Azure Active Directory audit logs for Event ID 201 or similar entries indicating "Add eligible member" and "Add eligible member (permanent)." Confirm the user account and details of the role assigned to assess legitimacy.

  - **Validate the administrator’s actions:** Check the history of the administrator who performed the action. Compare against known change management processes to determine if this role change aligns with typical administrative responsibilities.

  - **Identify the user’s previous roles:** Investigate the previous roles assigned to the user via Azure AD roles. A sudden elevation from a non-privileged role to a high-privileged role can indicate suspicious activity.

  - **Review for potential insider threat scenarios:** Assess whether the user is a current employee or a contractor. Additionally, obtain context on their current project involvement. If the user should not have the new privileges based on their role, flag for further review.

  - **Look for correlated suspicious behavior:** Identify any other recent alerts or significant actions taken by the same user or administrator around the time of adding the user to a privileged role to evaluate patterns of potential compromise.

  - **Examine recent failed authentication attempts:** Review Azure AD sign-in logs for any failed access attempts by the user or associated accounts (Event ID 4625) around the same timeframe, which could indicate an adversarial attempt to access elevated permissions unsuccessfully.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on system security and access control. The likelihood of malicious use is significant, as unauthorized privilege escalation can lead to critical systems being compromised. Such behavior is often weaponized by threat actors to execute further attacks within the environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete audit logging or potential evasion tactics such as legitimate administrator impersonation. Reliance on proper logging configurations in Azure AD is essential for effective detection. Additionally, legitimate organizational changes or administrative tasks can trigger this alert, which emphasizes the need for contextual understanding. An associated detection method might involve monitoring unusual administrative access requests or role modifications, enhancing overall coverage against privilege escalation attacks.

