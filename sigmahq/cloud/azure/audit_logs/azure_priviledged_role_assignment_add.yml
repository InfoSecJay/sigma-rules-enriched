  ---

  ### Technical Context

  This rule detects instances of users being added to privileged roles within Azure Active Directory, specifically through messages such as "Add eligible member (permanent)" or "Add eligible member (eligible)." The likely attacker objective is to gain elevated access to resources, potentially enabling further exploitation or data exfiltration. This activity corresponds to the MITRE ATT&CK techniques T1078.004 (Valid Accounts - Cloud Accounts) under the tactics of Persistence, Initial Access, Privilege Escalation, and Defense Evasion.

  The primary telemetry source for this detection is Azure AD audit logs, where role assignment changes are tracked. If malicious, adding users to privileged roles can lead to unauthorized access to critical systems and data. However, it’s crucial to note that this detection does NOT confirm that the action itself is malicious; legitimate administrative changes may trigger this alert.

  ---

  ### Investigation Steps

  - **Review audit logs for role changes:** Check Azure AD audit logs (Log Type: AuditLogs, Fields: activityType, targetResources) for “Add eligible member” entries linked to suspicious user accounts or unusual timeframes.
  - **Validate user account legitimacy:** Cross-reference the user being added to the privileged role with your internal user database to prove they are a legitimate account. Look for user roles and recent activity.
  - **Check for patterns of escalation:** Look for multiple privilege changes in succession for the same user (Event ID: 1001) to determine if there are anomalous patterns suggestive of malicious intent.
  - **Identify administrator actions:** Confirm if the addition of the user to the role was conducted by an established administrator. Look for user IDs in the action that correspond to known IT staff versus suspicious accounts.
  - **Evaluate impacted resources:** Assess the criticality of the resources associated with the new privileged role (Field: targetResources). Privileged access to sensitive systems should be treated with higher scrutiny.
  - **Document response actions:** Record any follow-up actions taken, such as revoking access or notifying higher tier analysts for deeper investigation into user behavior following the role change.

  ---

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on system integrity and the likelihood of malicious exploitation of privileged roles. The technique used for privilege escalation is common in attacks, particularly in environments with complex access controls.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations due to lag in log collection or misconfigurations that result in incomplete data. Legitimate administrative actions, such as routine role assignments during personnel changes, could trigger this alert. Companion detections include monitoring for suspicious login patterns or access to sensitive information immediately following role changes, which could provide a fuller picture of user activity.

