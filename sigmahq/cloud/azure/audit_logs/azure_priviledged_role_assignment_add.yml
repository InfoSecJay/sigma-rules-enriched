note: |
  ### Technical Context
  This detection rule identifies instances where a user has been added to a privileged role within Azure Active Directory (Azure AD). Such an action is significant, as it can be indicative of unauthorized privilege escalation attempts, where an attacker may seek to gain elevated permissions to carry out malicious activities undetected. The potential threat could originate from various threat actors aiming to compromise or manipulate user privileges, ultimately leading to data breaches or lateral movement within the network.

  The relevant MITRE ATT&CK tactics for this behavior include **Persistence (T1548)** and **Privilege Escalation (T1078.004)**, as adding users to privileged roles is a common method for attackers to maintain access to an environment. The detection relies heavily on analyzing Azure audit logs, which are expected to contain entries related to role assignments, illustrating when and by whom a user was granted access.

  Primary data sources for this detection include Azure AD audit logs, specifically those that reflect changes to role assignments. Observing these logs can help identify anomalous or unauthorized modifications to user roles that deviate from typical organizational behavior.

  ### Investigation Steps
  - **Review Audit Logs**: Examine Azure AD audit logs for entries featuring the phrases "Add eligible member (permanent)" or "Add eligible member (eligible)" to identify instances of users being added to privileged roles.
  - **Verify User Roles**: Cross-check the user roles assigned against the organization's standard role assignments to determine if the changes were legitimate or suspicious.
  - **Investigate Timing and Context**: Analyze the timing of the role changes in relation to other access events to see if they correlate with known security incidents or suspicious activity to ascertain their legitimacy.
  - **Correlate with Other Data Sources**: Check additional telemetry from related systems (such as VPN logs or EDR alerts) for unusual access patterns following the role assignment changes, as this could highlight potential exploitation.

  ### Prioritization
  This alert is considered high priority due to the potential impact of unauthorized privilege escalation in an enterprise environment. If an attacker gains elevated privileges, they may exfiltrate sensitive information, disrupt critical services, or further compromise other accounts.

  ### Blind Spots and Assumptions
  One of the primary gaps in detection coverage includes monitoring false positives from legitimate administrative actions that often occur during routine maintenance or user provisioning. The detection logic assumes that all role assignment changes warrant scrutiny, which may not account for trusted administrative behavior. Additionally, this rule relies on comprehensive and continuous logging of Azure AD audit logs, and any disruptions in logging could hinder the rule's effectiveness. Proper configurations must be ensured to capture all relevant changes in user role assignments for accurate detection.

