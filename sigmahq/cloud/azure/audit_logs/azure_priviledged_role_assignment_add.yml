note: |
  ### Technical Context

  This detection identifies when a user is added to a privileged role within an Azure Active Directory (AD) environment. Such behavior could indicate an attacker attempting to escalate privileges or establish persistence by gaining access to higher access levels in a compromised account. The relevant MITRE ATT&CK tactic is Privilege Escalation (TA0004), specifically the technique of Valid Accounts (T1078.004). The primary telemetry sources are Azure AD audit logs, specifically focusing on role assignments.

  If malicious, this activity can lead to unauthorized data access, system control, and the potential for further lateral movement within the organization. However, it is important to note that this detection does NOT automatically confirm malicious intent; legitimate administrative actions can generate similar alerts.

  ### Investigation Steps

  - **Review Azure AD audit logs for events (Event ID):** Focus on Event ID 4728 indicating role changes. Check 'properties.message' for values like "Add eligible member (permanent)" or "Add eligible member (eligible)."

  - **Assess the user involved:** Identify if the user being added has a history of privileged activity. Legitimate administrative users typically have documented permissions and role assignments.

  - **Verify role assignment context:** Cross-reference with a list of authorized roles and staff who are permitted to assign users to these roles to distinguish between benign and malicious actions.

  - **Analyze related user activity:** Look for previous login attempts or suspicious activity by the user prior to the role change. Use Azure AD sign-in logs to check for anomalous sign-in locations or times.

  - **Confirm asset criticality:** Determine the importance of the system or application impacted by the privilege change. Privileged roles on highly critical systems warrant a higher alert prioritization.

  - **Check for bulk assignments:** If multiple users are added to privileged roles simultaneously, assess the context of the change, as this could indicate potential bulk provisioning by an adversary.

  ### Prioritization

  This alert has high severity due to the significant impact of unauthorized privilege escalation within critical systems. The likelihood of malicious abuse is elevated given that attackers often target privileged roles to increase their level of control. This behavior is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logs are not sufficiently configured or if critical events are missing due to log retention policies. Legitimate administrative actions, such as scheduled role assignments during onboarding, may also trigger these alerts. A related detection to consider is monitoring for changes in group memberships or role deletions within Azure AD (e.g., Event ID 4729), which can help identify suspicious privilege adjustments.

