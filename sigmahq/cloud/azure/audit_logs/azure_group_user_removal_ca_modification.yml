note: |
  ### Technical Context

  This rule detects when a user is removed from a group that has access to Conditional Access (CA) policy modification capabilities. This behavior is often indicative of privilege escalation attempts or organization-specific privilege manipulation. The likely attacker objective is to disrupt legitimate access control or to maneuver undetected in the environment by impeding rightful policy modifications or access rights.

  The relevant MITRE ATT&CK tactics include: **Privilege Escalation** (TA0004) and **Credential Access** (TA0006) with techniques such as **Valid Accounts** (T1078) and **Access Token Manipulation** (T1548). Primary telemetry sources for this detection are Azure Active Directory audit logs, specifically look for entries related to group membership changes. If malicious, this activity could lead to unauthorized access to sensitive resources or the ability to alter CA policies. However, this detection does NOT automatically confirm malicious intent; it merely indicates a potentially concerning configuration change.

  ### Investigation Steps

  - **Review Audit Log Entry**: Examine the Azure AD Audit Log for **Event ID 200** records where the **properties.message** equals "Remove member from group." Look for user names and affected group identifiers to assess legitimate versus suspicious activity.

  - **Identify User Role**: Determine the role of the user who was removed. Review their assigned roles and permissions before the change. Legitimate users usually have known roles; any unexpected changes here may indicate malicious activity.

  - **Check Group Membership Impact**: Verify what access rights the removed user had within that group. For example, if the user had admin privileges, this could suggest a stronger malicious intent. Contextualize this removal against organizational policies on group membership.

  - **Cross-Referencing Recent Changes**: Investigate other recent changes in Azure AD, particularly any modifications to the same group or changes in membership for groups with higher privileges that occurred around the same timeframe.

  - **Evaluate Approval Processes**: Check for approvals or documentation regarding the removal. Were there any authorized procedures or workflows followed? Lack of documentation may indicate an unauthorized action.

  - **Pull Related Security Events**: Review for any other security events that correlate with group membership changes. For instance, look for failed sign-in attempts or suspicious account activities recorded in Security Event ID 4625 that coincide with the time of the group change.

  ### Prioritization

  This alert has a medium severity due to the potential impact on user access controls and the likelihood of malicious activity. The ability to modify Conditional Access policies is a critical function that can easily be weaponized, making the detection of unauthorized group removals especially concerning.

  ### Blind Spots and Assumptions

  This detection may be circumvented by legitimate administrative actions, meaning standard operational workflows could unintentionally trigger alerts, especially during changes in role or permission management. It relies on comprehensive logging configurations in Azure AD, and incomplete records may lead to missed detections. Corresponding detections that could enhance coverage include monitoring for **Add member to group** events that may signify an attempt to change access positions closely related to the observed removal activity.

