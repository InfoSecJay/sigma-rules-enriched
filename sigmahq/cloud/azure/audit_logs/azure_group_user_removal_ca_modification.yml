note: |
  ### Technical Context
  This detection rule is designed to monitor and alert on the removal of users from groups that possess Conditional Access (CA) policy modification privileges in an Azure environment. The objective of this detection is to identify potentially malicious activities wherein attackers may seek to alter access controls by removing users from critical groups, thus compromising security configurations. In scenarios of internal or external threats, attackers may aim to gain unauthorized access or persist within a network by manipulating group memberships associated with privilege escalation and access controls.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include **Persistence (T1548)** and **Credential Access (T1556)**. The removal of a user from high-privilege groups not only indicates a change in permissions but could also signify an attempt to evade defenses or establish persistence within the organization's environment. Key data sources for this detection include Azure audit logs, which contain detailed records of operations performed within Azure Active Directory, particularly concerning group membership changes.

  ### Investigation Steps
  - **Review Audit Logs**: Examine the Azure audit logs to identify the specific event of group membership removal, focusing on properties such as the user affected and the group from which they were removed.
  - **Analyze Group Memberships**: Cross-reference the user’s previous group memberships to determine if they had access to critical resources or permissions, assessing potential impacts on security posture.
  - **Identify User Activity**: Investigate the activities of the user prior to their removal to evaluate any unusual or malicious actions that may have warranted their group membership change.
  - **Validate Legitimate Changes**: Confirm with the appropriate administrative teams whether the removal was pre-approved or part of an authorized process, reducing false positives.

  ### Prioritization
  Given the potential impact of unauthorized modifications to group memberships on security controls, this alert is prioritized as medium severity. The likelihood of an attack using this technique is significant, especially in environments where CA policies dictate essential access controls.

  ### Blind Spots and Assumptions
  One blind spot in this detection logic is the possibility of legitimate administrative actions resulting in the removal of users from groups, which could lead to false positives if not properly validated. Additionally, the detection assumes that all relevant audit logs are enabled and correctly configured in Azure to capture these events. If audit logging is incomplete or misconfigured, this alert may fail to function as intended, leaving gaps in monitoring for potentially malicious activities.

