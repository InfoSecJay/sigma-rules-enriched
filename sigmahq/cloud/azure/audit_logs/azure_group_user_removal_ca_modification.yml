note: |
  ### Technical Context

  This Sigma rule detects the removal of a user from a group that has Conditional Access (CA) policy modification rights within Azure Active Directory. Such behavior may indicate an attacker seeking to undermine existing security controls or attempting to escalate privileges by targeting legitimate accounts with elevated access. This detection aligns with the following MITRE ATT&CK tactics and techniques: Privilege Escalation (T1548), Credential Access (T1556), and Persistence.

  The primary telemetry source for this detection is Azure Active Directory audit logs, specifically focusing on events where a user’s group membership is changed. If this behavior is executed maliciously, it can lead to unauthorized access or disruptions in security policy enforcement. However, it’s essential to note that this detection does NOT confirm malicious intent or context on its own, as there may be legitimate business reasons for such modifications.

  ### Investigation Steps

  - **Review Azure Active Directory audit logs**: Check Azure AD audit logs for Event ID 4780, which indicates user group membership changes, specifically for groups with CA policy modification access.

  - **Confirm previous user group status**: Investigate the user’s previous group memberships to validate expected roles. If the user was a member of a sensitive group prior to their removal, the action could be indicative of malicious intent.

  - **Cross-check user removal with approved changes**: Verify if the removal aligns with documented changes or approvals. Legitimate operations may occur within normal operational windows with appropriate approval logs.

  - **Check for re-addition of the user**: Examine recent events for any attempts to re-add the removed user back to the group or similar groups. This may indicate an attacker trying to regain access.

  - **Analyze related user activities**: Assess any other actions taken by the user around the time of the group removal that might indicate suspicious behavior, such as increased failed login attempts or access to sensitive resources.

  - **Scarcity of benign removals**: Note that legitimate user removals from groups with CA policy modification access are rare and should be documented or justified, making unsolicited removals a critical indicator of potential compromise.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on security controls within the environment. While the likelihood of abuse depends on contextual factors surrounding the user’s role and access, unauthorized modifications to CA policy groups are frequently targeted by adversaries looking to weaken defenses and increase their foothold within the organization.

  ### Blind Spots and Assumptions

  One limitation of this detection is that legitimate administrative activities, such as user role reassignments or organizational restructures, may trigger the alert and could lead to false positives. Accurate detection also depends on the proper configuration of Azure AD audit logging to ensure all modifications are captured. Related detections could include monitoring general group membership changes or alterations to CA policies, providing broader visibility into these critical events.

