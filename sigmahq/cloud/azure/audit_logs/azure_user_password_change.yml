note: |
  ### Technical Context
  This rule detects instances of users resetting their passwords within Azure Active Directory (Azure AD). The ability for users to reset their passwords can indicate either legitimate user actions or potential malicious activity, where an attacker may attempt to gain unauthorized access to accounts by resetting passwords. This detection is crucial in identifying unauthorized account compromise, particularly when it happens under suspicious circumstances.

  The threat scenario typically involves attackers who may have obtained some form of access to a user's account or credentials and subsequently utilize the password reset functionality to lock out the legitimate user, gaining sustained access to sensitive resources. This behavior aligns with several MITRE ATT&CK techniques, notably **T1078.004: Valid Accounts: Local Accounts**, as attackers could manipulate legitimate functions to achieve their objectives, alongside tactics tied to privilege escalation and initial access.

  Primary data sources for this detection include Azure AD audit logs, which capture various user management activities, including password resets and their outcomes. These logs provide the necessary evidence to assess whether a password reset was initiated by legitimate user actions or indicative of a potential compromise.

  ### Investigation Steps
  - **Review Audit Logs:** Investigate Azure AD audit logs for the specific entry related to the password reset, focusing on the `ActivityType` and `InitiatedBy` fields to determine if the action was legitimate.
  - **Validate User Actions:** Check if the password reset corresponds with known user activity or if there are any indicators of unusual behavior preceding the reset, such as failed login attempts from unfamiliar locations.
  - **Cross-Reference IP Addresses:** Look into the IP addresses from which the password reset was initiated to determine if they are recognized as belonging to the legitimate user or if they match any known malicious sources.
  - **Engage User Verification:** If there are concerns surrounding the legitimacy of the password reset, promptly reach out to the affected user to confirm whether they initiated the reset and to understand their recent activities.

  ### Prioritization
  The alert is given a medium severity due to the potential for account compromise and unauthorized access to sensitive resources within an enterprise environment. Even though legitimate users may initiate password reset requests, the context of these actions demands careful scrutiny to mitigate against potential security breaches.

  ### Blind Spots and Assumptions
  This detection may not account for cases where password resets are implicitly legitimate as part of a scheduled security protocol or administration process. It assumes that the necessary logging configurations are in place within Azure AD to capture all user management activities, particularly those configuration options related to password management. Additionally, the detection could miss resets initiated through external attack vectors if the audit logs are incomplete or misconfigured to log such events.

