logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    Category: 'UserManagement'
    Status: 'Success'
    Initiatedby: 'UPN'
  filter:
    Target|contains: 'UPN'
    ActivityType|contains: 'Password reset'
  condition: selection and filter
falsepositives:
- If this was approved by System Administrator or confirmed user action.
level: medium
note: |
  ### Technical Context

  This rule detects successful password resets initiated by users in Azure Active Directory. The likely objective of an attacker is to gain unauthorized access to an account by resetting the user’s password, facilitating credential access or privilege escalation. This behavior corresponds to MITRE ATT&CK techniques T1078.004 (Valid Accounts: Domain Accounts) and T1078 (Valid Accounts). The primary telemetry source is Azure AD audit logs, specifically focusing on user management events, particularly password resets.

  If malicious, this behavior may indicate an attempt to compromise accounts and escalate privileges undetected. Importantly, successful password resets alone do not confirm any malicious intent; they may occur as part of a legitimate user request or administrator action.

  ### Investigation Steps

  - **Validate user identity:** Confirm the password reset was initiated by the legitimate user. Check the UPN (User Principal Name) against recent tickets or helpdesk calls, especially if the reset falls outside normal user behavior.

  - **Review audit logs:** Analyze Azure AD audit logs for Event Category: 'UserManagement' and Status: 'Success'. Specifically, look for Activity Type: 'Password reset' and capture the 'InitiatedBy' actor details to match against known authorized users.

  - **Identify approved actions:** Look for previous administrative approvals for password resets. Cross-reference the timestamps of the reset action with known helpdesk resolutions or user activity to determine if the action was legitimate.

  - **Check for account anomalies:** Investigate the user's account for any unusual behavior, such as failed login attempts or multiple password resets in a short timeframe, which may indicate an ongoing attack. Use Azure AD Sign-in logs for Event IDs related to sign-in failures.

  - **Correlate with other indicators:** Look for subsequent logins from unfamiliar IP addresses or geolocations immediately following the password reset event. Use Azure AD Sign-in logs to spot suspicious sign-in patterns that could indicate compromise.

  - **Monitor for additional impacts:** Check if the account was used for any unauthorized access to sensitive data or resources post-reset. Review access logs to critical assets or services that the user can access with the new password.

  ### Prioritization

  This alert has medium severity due to the potential for significant security impact if an attacker successfully compromises an account. The likelihood of malicious abuse is moderate since attackers commonly exploit valid accounts, especially when they target key users with elevated privileges.

  ### Blind Spots and Assumptions

  A primary detection limitation exists if users are performing legitimate password resets, which may trigger false alerts. Azure AD audit logs must be properly configured to capture all relevant events. Legitimate activities, such as scheduled organizational password updates or user self-service resets, may also generate this alert. A companion detection could involve monitoring for anomalous post-password reset behavior, such as unusual account access patterns (e.g., elevated permissions or external logins).

