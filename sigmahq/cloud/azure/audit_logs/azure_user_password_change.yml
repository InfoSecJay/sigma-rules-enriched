level: medium
note: |
  ### Technical Context

  This rule detects successful password resets initiated by a user account in Azure Active Directory. The likely attacker objective is credential theft or account takeover, often indicative of lateral movement or an attempt to escalate privileges within a compromised environment. The relevant MITRE ATT&CK tactic is "Credential Access" and the technique is "Valid Accounts" (T1078.004). The primary telemetry source is Azure AD audit logs, specifically focusing on logs related to user management activities. If malicious, this behavior could allow an adversary to gain unauthorized access to sensitive resources, leading to potential data breaches. However, this detection does NOT confirm malicious intent on its own; legitimate password resets by users or administrators can trigger the alert.

  ---

  ### Investigation Steps

  - **Review the initiating user account activity:** Investigate Azure AD sign-in logs (Event ID 4624, or relevant sign-in API events) to confirm whether the password reset was initiated from a known, expected location or user behavior pattern. Benign activity will show logins from recognized IP addresses or devices.

  - **Check for multiple resets:** Query the Azure AD audit logs for the same user account for multiple password reset attempts in a short timeframe, which can indicate malicious behavior. Look for consistent entries for "Password reset" in the ActivityType field.

  - **Verify user authorization:** Assess whether the password reset aligns with known user activities or organizational policies, checking for approval workflows in systems like ServiceNow if applicable. Legitimate resets should be correlated with support tickets or user self-service logs.

  - **Investigate IP address anomalies:** Cross-reference the signed IP addresses of the password reset against any threat intelligence. Any external, geolocated IPs without prior user access may indicate a potential compromise, warranting closer examination.

  - **Conduct a user account risk assessment:** Determine the risk level of the account that initiated the password reset by evaluating its role, permissions, and recent suspicious activity (e.g., failed logins, unusual access patterns). Higher criticality accounts are prioritized for deeper investigation.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to its potential impact on user accounts that can lead to unauthorized access. While password resets can be legitimate, the likelihood of adversarial exploitation through credential theft makes this behavior noteworthy, especially for sensitive accounts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by users legitimately resetting passwords in response to security incidents, thereby inducing false positives. Furthermore, this rule relies on the configuration of Azure AD audit log settings to ensure comprehensive capture of user management events. Legitimate admin actions or user-initiated resets may trigger the alert, leading to potential confusion. A related detection to consider is alerting on failed login attempts correlated with successful resets, providing context to investigate potential credential abuse comprehensively.

