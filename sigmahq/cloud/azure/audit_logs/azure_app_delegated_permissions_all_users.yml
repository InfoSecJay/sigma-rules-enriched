note: |
  ### Technical Context
  This rule detects instances where highly privileged delegated permissions are granted on behalf of all users within Azure environments. Such permissions could allow malicious actors to perform actions as any user in the system, leading to a significant compromise of user data and system integrity. Attackers often aim to elevate their privileges to gain unauthorized access or to perform actions without alerting security personnel, potentially leading to data breaches or system manipulation.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Credential Access** (Tactic ID: TA0006) and **Application Layer Protocol** manipulation (Technique ID: T1528). These activities not only indicate potential credential theft but also signal misuse of trusted applications to abuse the permissions granted to them. The primary data source involved in this detection logic includes Azure audit logs, which capture permission changes and can provide insights into high-risk modifications of delegated permissions.

  ### Investigation Steps
  - **Review Audit Logs:** Examine Azure audit logs for entries related to "Add delegated permission grant" to identify the scope and context of the changes made.
  - **Assess Affected Applications:** Determine which applications have been granted elevated permissions and validate their legitimacy. Look for any unfamiliar or unauthorized application grants.
  - **Cross-reference User Access:** Compare the permissions granted with the principle of least privilege to identify potential over-provisioning of access across users.
  - **Monitor User Actions:** Analyze subsequent actions taken by users affected by the permission change to detect any anomalous behavior that may indicate further exploitation.

  ### Prioritization
  This alert is marked as high severity due to the potential risk associated with unauthorized access to all users’ data and resources. The likelihood of exploitation is significant, especially if a privileged application is compromised or misconfigured.

  ### Blind Spots and Assumptions
  The detection logic may not capture legitimate scenarios where permissions are required for business operations, which could lead to false positives. Additionally, this rule assumes that all changes to delegated permissions are appropriately logged and accessible in the Azure audit logs. Any gaps in logging, such as lack of detailed permission change logs or issues with log aggregation, could impair detection capabilities. It is essential to ensure that Azure audit logs are configured to capture all relevant permission changes for this rule to function correctly.

