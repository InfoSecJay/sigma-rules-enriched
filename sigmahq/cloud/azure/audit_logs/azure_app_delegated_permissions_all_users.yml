  ---

  ### Technical Context

  This rule detects instances where highly privileged delegated permissions are granted to applications on behalf of all users within Azure. This behavior may indicate a misconfiguration or a potential compromise, as it can allow unauthorized access to sensitive user data. The likely attacker objective is to broaden access rights, enabling exfiltration of credentials or sensitive information from multiple users in the environment. This detection is relevant to the MITRE ATT&CK framework, specifically under the tactic of Credential Access (T1075) and the technique Application Layer Protocol (T1528).

  The primary telemetry source involved is Azure Audit Logs, with specific log types related to permission grants. If malicious, such activity poses a significant risk, as it can facilitate unauthorized application access to sensitive data across the organization. This detection does NOT prove that any data has been exfiltrated or manipulated; it merely highlights that permission grants have occurred.

  ---

  ### Investigation Steps

  - **Review granted permissions details**: Inspect Azure Audit Log entries (Event types: "Add delegated permission grant"). Focus on entries with `properties.message` indicating permission grants to ensure they match expected configurations.

  - **Correlate with application context**: Confirm if the application requesting the permissions is legitimate by checking its Azure AD application registration and associated role assignments. Check `identity` fields for known trustworthy applications.

  - **Identify excessive permissions granted**: Look for patterns where delegated permissions are granted more broadly than necessary (e.g., "All users" vs. specific user groups). Malicious indicators include any permissions that are atypical for the identified application purpose.

  - **Investigate historical access changes**: Check the timeline of permission grants over the past 30 days using the Azure portal or PowerShell. Look for any sudden spikes or unusual patterns in permission assignments, particularly to high-risk applications.

  - **Document normal application behavior**: Establish what legitimate permission grants look like for common applications in your environment and compare against current logs. Authorized applications typically require specific user groups’ delegated permissions, not blanket access.

  - **Cross-reference with other detections**: Validate the findings against existing security alerts related to user access anomalies or unexpected changes in permissions structure, which could indicate an ongoing attack.

  ---

  ### Prioritization

  Given the potential impact of the affected Azure environment, this alert should be considered high severity. Highly privileged delegated permissions can facilitate significant unauthorized access if exploited. The likelihood of malicious abuse is elevated if multiple permissions are granted to applications without a clear justification, making it a common target for attackers exploiting weaknesses in privileged access management.

  ---

  ### Blind Spots and Assumptions

  Detection of these events may be limited if Azure Audit Logs are not thoroughly configured to capture all relevant permission changes. Attackers might use similar legitimate applications to grant themselves broader access, creating potential false positives. This alert may also trigger in legitimate scenarios, such as a service requiring elevated permissions for functional reasons. A companion detection to explore would be changes to Azure AD role assignments, as overlapping concerns with privilege elevation can enhance overall visibility into potential breaches.

