  ---

  ### Technical Context

  This rule detects events where highly privileged delegated permissions are granted for all users within Azure Active Directory (AAD). Attackers aim to escalate their privileges, potentially giving them broad access to sensitive data and actions across user accounts. This behavior aligns with the MITRE ATT&CK tactic of Credential Access, specifically the technique "Application Permissions" (T1528).

  The primary logging source is Azure AD audit logs, specifically looking for messages indicating permission grants. If the behavior is malicious, it can lead to unauthorized data access and system manipulation, creating significant security risks. However, this detection alone does not confirm malicious activity; it may include legitimate permission changes that are needed for applications.

  ---

  ### Investigation Steps

  - **Review audit logs for permission grants:** Check Azure Active Directory audit logs for Event IDs corresponding to permission grants. Focus on properties.message containing "Add delegated permission grant." Assess if multiple permissions are granted in a batch.

  - **Identify the application and its necessity:** Determine the application linked to the permission grant. Validate whether it is a known, trusted application required for business operations. Unexpected applications should be flagged for further investigation.

  - **Correlate user accounts impacted:** Analyze which user accounts were affected by these permission grants. Check if any accounts belong to users with privileged access roles, as this could indicate a higher risk of exploitation.

  - **Cross-reference with recent activity:** Look for associated events in Azure AD logs, such as unusual sign-ins (Event ID 4624) or permission modifications (Event ID 5123), to determine any suspicious activity leading up to the permission grant.

  - **Compare with baseline permissions:** Evaluate the permissions previously assigned to the application. Consider referring to historical audit logs to assess whether the permissions granted align with the application's required functionality.

  - **Check for external integrations:** Identify if any automated processes (like CI/CD pipelines) or external integrations triggered the permission change. Legitimate tools may necessitate broad permissions but require careful scrutiny.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on sensitive systems and data. The likelihood of malicious use is notable, as attackers often seek broad access to exploit vulnerabilities. Additionally, the behavior of granting permissions universally is a known tactic in many attack campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may miss events concealed by legitimate administrative actions, such as bulk permission assignments for valid applications. Reliable detection depends on proper logging configurations within Azure AD, particularly with audit logs enabled. Legitimate business processes such as application onboarding could trigger this alert and require context to differentiate. A related detection could involve monitoring for unusual user permission changes (T1075) to enhance overall threat visibility in permission management.

