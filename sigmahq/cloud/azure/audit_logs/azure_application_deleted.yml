note: |
  ### Technical Context

  This Sigma rule detects the deletion of applications in Azure, specifically targeting operations labeled as "Delete application," "Hard Delete application," and "Delete administrative unit." The likely objective of an attacker could be to disrupt services, remove evidence of compromise, or prepare for further exploitation tactics. This behavior aligns with the MITRE ATT&CK technique T1489: Data Destruction.

  The primary telemetry sources include Azure audit logs, particularly focused on fields related to the operationName of the delete action. If malicious activity is confirmed, it may lead to service disruptions and loss of critical functionality in applications. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also trigger the alert.

  ### Investigation Steps

  - **Identify user identity associated with the deletion:** Check Azure audit logs (Operation Name field) for the identity of the user performing the deletion. Ensure it matches known administrator roles. A legitimate identity would typically be a member of a designated admin group.

  - **Verify context of the deletion action:** Review the timestamp and user context against recent changes in your environment. For example, if multiple deletions occur within a short timeframe, investigate correspondences to known admin activities or scheduled maintenance.

  - **Check user agent and hostname:** Investigate the user agent and hostname from the audit logs (Event fields relevant to user activity). Look for anomalies or unfamiliar sources initiating the delete operation. Malicious actors may appear from unexpected locations.

  - **Assess application impact:** Determine the criticality of the deleted application in your business environment. High-impact applications can signal that disruption was intentional rather than routine maintenance.

  - **Review historical deletion patterns:** Compare the deletion event against historical logs for similar actions (e.g., using Azure audit logs looking for past application removal events). Regular administrative tasks may exhibit consistent patterns, while sudden changes can indicate potential abuse.

  ### Prioritization

  This alert should be treated with medium severity. Deletion of applications could lead to operational disruptions and malicious campaigns aiming to render services unavailable. While such deletions can happen for legitimate reasons, the possibility of malicious activity, especially if triggered by unfamiliar or unauthorized users, necessitates prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of logs if Azure audit logging is not properly configured or is incomplete. Adversaries may employ techniques to mask their identities or automate deletions with legitimate accounts. Additionally, legitimate application maintenance activities—especially during scheduled updates—may trigger this alert. A related detection focusing on unauthorized login attempts or privilege escalation (e.g., T1078: Valid Accounts) can enhance overall monitoring and coverage against malicious actions.

