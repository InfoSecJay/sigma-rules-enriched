title: Guest Users Invited To Tenant By Non Approved Inviters
id: 4ad97bf5-a514-41a4-abd3-4f3455ad4865
status: test
description: Detects guest users being invited to tenant by non-approved inviters
references:
- https://learn.microsoft.com/en-gb/entra/architecture/security-operations-user-accounts#monitoring-external-user-sign-ins
author: MikeDuddington, '@dudders1'
date: 2022-07-28
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.t1078
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    Category: 'UserManagement'
    OperationName: 'Invite external user'
  filter:
    InitiatedBy|contains: '<approved guest inviter use OR for multiple>'
  condition: selection and not filter
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to invite guest users to a tenant in Azure by individuals who are not on the approved list of inviters. Such actions may signify an unauthorized attempt to extend access to external parties, which can lead to potential data breaches or misuse of resources. Attackers may leverage such opportunities by infiltrating corporate environments, gaining access to sensitive information, and establishing footholds within the organization for further exploitation.

  The relevant MITRE ATT&CK tactics and techniques associated with this rule include:
  - **Initial Access (T1078)**: Gaining access to the network or environment through valid accounts, in this case by inviting unauthorized guest users.
  - **Persistence**: Allowing external users to maintain access to resources by enabling guest accounts.
  - **Privilege Escalation**: Potential misuse of guest accounts to move through the network and acquire sensitive data.

  Primary data sources for effective detection and investigation include Azure audit logs, which encompass operations related to user management and external user invitations.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Check the user management audit logs for records of guest invitations initiated by non-approved users. Focus on the timestamps and user identities involved in the invitations.

  - **Identify the Inviter's Credentials**: Determine the roles and permissions of the inviter. Look for any indication of escalated privileges or unusual access patterns that may suggest compromise.

  - **Cross-Reference Approved Inviter List**: Compare the list of invited users against the organization’s approved inviter list. Confirm any discrepancies and validate the legitimacy of unapproved invitations through appropriate staff members.

  - **Monitor External User Activity**: Keep an eye on the activities of recently invited guest users. Look for unusual access patterns or login attempts that deviate from expected behavior for users with such privileges.

  ### Prioritization
  The alert is classified as medium severity due to its potential impact on data security and the likelihood of misuse by unauthorized users. Guest accounts can lead to significant risks if misused, especially in organizations that handle sensitive or proprietary information.

  ### Blind Spots and Assumptions
  This detection rule assumes that the organization maintains a robust list of approved guest inviters and that the Azure audit logs are correctly configured to capture all necessary user management activities. A potential gap in detection could arise from legitimate actions taken by system administrators that may not be captured, leading to false positive alerts. Also, if the audit logs are not adequately indexed or retained, critical events could be missed, leaving the organization vulnerable during investigations.

