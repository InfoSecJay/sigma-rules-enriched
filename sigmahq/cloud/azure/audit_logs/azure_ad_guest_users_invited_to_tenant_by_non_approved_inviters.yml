logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    Category: 'UserManagement'
    OperationName: 'Invite external user'
  filter:
    InitiatedBy|contains: '<approved guest inviter use OR for multiple>'
  condition: selection and not filter
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects when guest users are invited to an Azure tenant by non-approved inviters, which signifies a potential threat to organizational security. The attacker’s objective could be to gain unauthorized access to resources by leveraging guest accounts, thereby facilitating lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK tactics and techniques of Privilege Escalation (TA0004) and Initial Access (TA0001), specifically using Valid Accounts (T1078).

  The primary telemetry sources for this detection are Azure audit logs, specifically focusing on user management events relevant to guest invitations. If malicious, such actions could lead to unauthorized data access or system compromise. It is critical to note that this detection does NOT confirm malicious intent on its own; additional context is required regarding the invitation's legitimacy.

  ### Investigation Steps

  - **Identify the inviter: **Review the `InitiatedBy` field in Azure Audit Logs (OperationName: 'Invite external user', Event ID: specific IDs) to determine if the inviter is an approved user. Legitimate invites will typically come from authorized administrators.

  - **Check for user role and purpose:** Confirm the role of the inviting user. Cross-reference with the organization’s policy on who is authorized to invite external users. Expected behavior shows that only designated administrators should perform this action.

  - **Assess the guest user details:** Investigate the attributes of the newly invited guest users, including their email domain. Suspicious or generic domains (e.g., public email providers) may indicate a higher risk.

  - **Audit recent activities:** Review the recent activities of the inviter around the time of the alert by examining additional audit logs (like `Sign-in logs` and `Audit logs`) to identify any unusual behavior, such as multiple invite attempts.

  - **Look for patterns in guest accounts:** Analyze if the same non-approved inviter has repeatedly invited guest users in a short timeframe, indicating potential account abuse. A legitimate inviter will have a consistent and single invitation pattern.

  - **Evaluate contextual risk:** Consider the resource access granted to the invited guest users. If guest users are granted highly sensitive access permissions, this raises the security risk profile significantly.

  ### Prioritization

  This alert should be marked as medium severity because it potentially indicates unauthorized attempts to extend access to the organization’s resources. Given that guest accounts can be exploited for lateral movement or sensitive data leakage and that such behaviors are weaponized in several attacks, it's critical to evaluate with prompt action.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of established inviter lists. Non-malicious invites from recently approved users can trigger the alert, potentially leading to false positives. Reliable detection depends on correctly configured Azure audit logging. Monitor for companion detections related to suspicious sign-in activities (e.g., unusual IP addresses in sign-in logs) to strengthen overall security posture.

