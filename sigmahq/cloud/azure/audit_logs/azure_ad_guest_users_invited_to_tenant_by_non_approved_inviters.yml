title: Guest Users Invited To Tenant By Non Approved Inviters
id: 4ad97bf5-a514-41a4-abd3-4f3455ad4865
status: test
description: Detects guest users being invited to tenant by non-approved 
  inviters
references:
- https://learn.microsoft.com/en-gb/entra/architecture/security-operations-user-accounts#monitoring-external-user-sign-ins
author: MikeDuddington, '@dudders1'
date: 2022-07-28
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.t1078
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    Category: 'UserManagement'
    OperationName: 'Invite external user'
  filter:
    InitiatedBy|contains: '<approved guest inviter use OR for multiple>'
  condition: selection and not filter
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where a guest user is invited to the Azure tenant by non-approved users. The likely objective of an attacker is to gain unauthorized access to the organization’s resources by leveraging external accounts, possibly for malicious activities like data exfiltration or further lateral movement within the network. The relevant MITRE ATT&CK tactic is **Credential Access** (TA0006) using the technique **Valid Accounts** (T1078).

  The primary telemetry source for this rule is Azure audit logs, specifically focusing on user management activities related to external user invites. If identified as malicious, the security impact can be significant, as unauthorized guest access poses risks to sensitive data and organizational integrity. Importantly, this detection does NOT confirm that malicious activity is taking place; it only highlights potential anomalies that require further investigation.

  ### Investigation Steps

  - **Review Azure audit logs for invite activity:** Check Azure Active Directory audit logs (Event ID: 7) for "Invite external user" operations, focusing on the `InitiatedBy` field to identify non-approved inviter accounts.

  - **Verify appropriateness of inviters:** Cross-reference the user's permissions against the approved list of guest inviters. If the issuer is not on the approved list, this may indicate a malicious invitation.

  - **Analyze user roles of invited guests:** Check the assigned roles of the invited guests in the Azure portal. Legitimate invites typically involve accounts tied to business purposes, whereas anomalous roles could indicate a malicious intent.

  - **Investigate any associated sign-in logs:** Review sign-in logs (Event ID: 4624/4625) to determine if the new guest accounts have attempted to log in or if there are unusual access patterns following their invitation.

  - **Cross-check with recent privilege changes:** Look into previous Azure audit logs for recent changes in user permissions for both the inviter and invited accounts to identify indicators of privilege escalation.

  ### Prioritization

  This alert should be considered medium severity. The impact of compromised guest accounts can be high, especially for sensitive systems since such accounts can provide access to critical resources. The likelihood of malicious abuse is significant given that guest invitations can be weaponized to bypass traditional security measures.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as the use of approved accounts by adversaries to invite malicious users without raising suspicion. Reliable detection relies on the complete and correctly configured Azure audit logs. Legitimate activities might include temporary guest invitations for collaboration with partners or vendors. A related detection for enhancing overall security posture includes monitoring for anomalous user sign-ins or account-related activities following guest user invitations.

