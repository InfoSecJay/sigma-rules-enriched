note: |
  ---

  ### Technical Context

  This rule detects unauthorized guest user invitations within an Azure tenant, specifically when these invitations are initiated by users not on an approved inviter list. The likely objective of an attacker utilizing this method is to infiltrate an organization, gain access to sensitive resources, or conduct reconnaissance. This behavior aligns with the MITRE ATT&CK tactic of **Initial Access** (TA0001) and technique **Valid Accounts** (T1078).

  The primary telemetry sources are Azure Audit Logs, specifically focusing on user management activities related to external user invitations. If malicious, this behavior could allow unauthorized access to corporate resources, potentially leading to data breaches or lateral movement within the environment. Importantly, this detection does not confirm that a malicious action has occurred; it only identifies unauthorized invitation attempts.

  ---

  ### Investigation Steps

  - **Check invitation details:** Review Azure Audit Logs (Event ID related to UserManagement, such as 'Invite external user') for the `initiatedBy` field. Verify if the inviter's email is from the approved inviter list. Legitimate activity should match known users who have authorization to invite external guests.

  - **Analyze invited user attributes:** Assess the properties of the invited guest (e.g., email domain, access level). Guest accounts created with unfamiliar domains or those requesting elevated privileges may indicate malicious intent.

  - **Confirm user account provenance:** Investigate the inviter’s account for suspicious activity (e.g., recent account compromise indicators). Use Azure Sign-In logs to identify any sign-ins from unusual locations or devices (fields: `location`, `clientAppUsed`).

  - **Identify patterns of misuse:** Establish if multiple invites from non-approved users are occurring in a short time frame. Correlate this with Azure Audit logs for bulk actions, which can suggest coordinated unauthorized activity.

  - **Review recent changes to the inviter list:** Analyze any modifications to the approved inviter list (Azure Audit Log changes). Sudden additions or removals may indicate insider threats or administrative errors, highlighting potential risks.

  ---

  ### Prioritization

  This alert's severity is medium due to the potential impact on corporate security and resources, especially in environments handling sensitive data. The likelihood of abuse is significant, as unauthorized invitations can lead to unwanted access. This technique is increasingly weaponized by adversaries to bypass traditional security controls.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include attackers using an approved inviter's account to bypass detection, or legitimate users may inadvertently trigger the alert when they invite users from newly acquired or legitimate external partners. Reliable detection requires comprehensive logging configurations for Azure Audit logs, specifically ensuring that user management activities are being captured consistently. A companion detection to enhance coverage may include alerts for suspicious sign-in activities or unauthorized changes to user roles in the tenant.

