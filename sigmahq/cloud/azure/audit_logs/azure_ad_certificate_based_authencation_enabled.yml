note: |
  ### Technical Context

  This Sigma rule detects when certificate-based authentication is enabled in an Azure Active Directory (Azure AD) tenant. This action can signify a shift in the authentication strategy, potentially aimed at enhancing the security posture or, conversely, facilitating unauthorized access if exploited by an adversary. The attacker objective is likely to leverage this configuration for credential access, persistence, or privilege escalation. The relevant MITRE ATT&CK tactics include Credential Access and Persistence (T1556).

  The primary source of telemetry is Azure AD audit logs, specifically events documenting modifications to authentication methods. If malicious, enabling certificate-based authentication could allow adversaries to bypass traditional credential checks, effectively gaining access to sensitive systems. This detection does NOT confirm that an adversary has successfully exploited the configuration; it merely indicates that a change has been made.

  ### Investigation Steps

  - **Verify the operation context: **: Confirm when the "Authentication Methods Policy Update" occurred by reviewing Azure AD Audit Logs (Log Type: Azure Audit Logs, Field: OperationName). Determine if the timing aligns with legitimate administrative activities.

  - **Identify the target resources modified: **: Examine the affected resources' properties for any unauthorized changes, particularly focusing on modified properties with the value 'AuthenticationMethodsPolicy'. This helps isolate any suspicious alterations.

  - **Review associated user activities: **: Audit user accounts that triggered the modification by referring to Event IDs relevant to changes in Azure AD (e.g., Event ID 4781 for user account attributes). Identify if the user has administrative privileges or if there has been any unusual access pattern.

  - **Establish a baseline for legitimate behavior: **: Document past instances of authentication method changes by accessing audit logs. Analyze legitimate administrative updates to determine if the current alert deviates from expected patterns in configuration changes.

  - **Assess potential malicious indicators: **: Look for correlating malicious activities, such as failed logins or abnormal access attempts around the time of the policy update, by reviewing logs for failed sign-ins (Log Type: Azure AD Sign-in logs, Field: ResultStatus).

  ### Prioritization

  This alert is considered medium severity as it indicates a potential shift in authentication methods that could impact sensitive systems. The likelihood of malicious abuse exists due to the high value of gaining access through certificate-based authentication, which is increasingly weaponized in sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement for comprehensive audit logging in Azure AD; insufficiently monitored environments may miss legitimate context for this change. Legitimate activities, such as routine administrative policy updates by authorized personnel, might trigger this alert. A related detection could include monitoring for unusual login patterns immediately following any authentication methods change, enhancing overall coverage.

