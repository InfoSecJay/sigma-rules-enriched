  ---

  ### Technical Context

  This rule detects when certificate-based authentication (CBA) is enabled in an Azure Active Directory (Azure AD) tenant. Such authentication methods are often leveraged by adversaries to establish persistence and facilitate unauthorized access, potentially leading to privilege escalation. The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), **Credential Access** (TA1203), and **Persistence** (TA0003), with techniques linked to **Authentication Methods Policy Update** (T1556).

  The primary telemetry source for this detection is Azure AD audit logs, specifically focusing on the event corresponding to updates in authentication methods policies. If malicious, the enabling of CBA could significantly impact the security posture of the organization by allowing attackers to bypass traditional credential mechanisms. Importantly, the detection does not confirm that malicious activity has occurred; CBA may be enabled for legitimate business reasons.

  ---

  ### Investigation Steps

  - **Review audit logs for recent changes:** Check Azure AD audit logs (Event ID for Authentication Methods Policy Update) for the user who made the change. Confirm that the modification aligns with known administrative practices.

  - **Identify the user or service principal:** Look for the `initiatedBy` field in the logs to determine which account enabled CBA, and correlate against typical user roles (e.g., Global Administrators should be the only ones modifying this setting).

  - **Check for anomalous patterns in authentication methods:** Validate if other authentication methods are being used excessively by the user associated with the change (e.g., monitoring for any rapid configuration changes in `AuthenticationMethodsPolicy`).

  - **Assess legitimate use cases:** Verify whether there are existing policies that might necessitate enabling CBA, particularly for applications with business-critical access, to contextualize this modification as benign.

  - **Correlate with recent campaign tactics:** Research if any recent adversarial activity or threat intelligence indicators relate to users or service accounts making changes to authentication policies, especially those underscored in the referenced articles.

  - **Monitor subsequent authentication attempts:** Evaluate log-in attempts following the change to CBA, especially if there are successes from previously unknown locations or devices, which could indicate exploitation.

  ---

  ### Prioritization

  The severity of this alert is medium due to its potential impact on critical account security within Azure AD. While enabling certificate-based authentication could represent a legitimate security measure, it also poses a risk of exploitation by adversaries frequently targeting authentication mechanisms to gain footholds within enterprise environments.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the frequency of Azure AD audit log collection and potential gaps in logging configurations, which can obscure legitimate administrative actions. Additionally, legitimate cloud administrators may occasionally enable CBA out of necessity without malicious intent. A related detection to strengthen coverage could involve monitoring for excessive changes to user authentication policies (e.g., multiple modifications in a short time frame), which could help identify potentially malicious activity or insider threats.

