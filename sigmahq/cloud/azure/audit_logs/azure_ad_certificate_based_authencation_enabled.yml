note: |
  ### Technical Context

  This rule detects when certificate-based authentication has been enabled in an Azure Active Directory (AAD) tenant, specifically monitoring the operation named 'Authentication Methods Policy Update.' The likely attacker objective is to establish persistent access within an environment, potentially as a means to bypass standard authentication methods. This activity aligns with the MITRE ATT&CK tactic of Credential Access (TA0006), specifically technique T1556 (Credential Dumping).

  The primary telemetry source is Azure Active Directory audit logs, specifically focusing on log entries that indicate modifications to authentication methods policies. If successfully exploited, this behavior could allow an adversary to escalate privileges within the cloud environment and maintain long-term access. However, this detection does NOT confirm malicious intent on its own, as legitimate administrators may also configure certificate-based authentication for security purposes.

  ### Investigation Steps

  - **Review the relevant audit log entries:** Check Azure AD audit logs (Event ID: 1200) for 'Authentication Methods Policy Update' events in the last 24 hours. Look for the `initiatedBy` field to identify who made the change; ensure the identity is expected or legitimate.

  - **Evaluate recent permissions changes:** Query for administrative activities on user roles (Event ID: 1205). Determine if the account initiating the certificate authentication update also has elevated privileges that justify this configuration, or if it appears anomalous.

  - **Identify expected legitimate use cases:** Understand how certificate-based authentication is typically used within your environment. For instance, confirm whether this type of authentication has been enabled as part of a broader security initiative or migration to passwordless authentication.

  - **Assess environment for prior alerts:** Cross-reference recent alerts related to privilege escalation or unauthorized access attempts within the context of the Azure AD tenant. Look for patterns or correlations that indicate an escalating threat posture.

  - **Correlate with known malware or attack patterns:** Use threat intelligence sources to identify if the user or account associated with this alert has been previously tied to known attack campaigns or malware that utilizes certificate-based authentication for persistence.

  ### Prioritization

  This alert should be treated as medium severity due to the critical nature of Azure AD. While legitimate use may occur for enhancing security, the enabling of certificate-based authentication can be leveraged by attackers to bypass traditional security controls. Given the escalating trend in credential theft and identity-related attacks, this behavior is increasingly weaponized in cloud environments.

  ### Blind Spots and Assumptions

  Detection may be evaded through administrative impersonation of legitimate account holders or misuse of previously established access tokens. The reliability of this detection requires audit logging settings to be correctly configured in Azure AD to capture all relevant events. Legitimate changes, such as updates by trusted IT personnel, may trigger this alert and need careful contextual investigation. A companion detection to strengthen coverage includes monitoring for unusual authentication methods configuration changes that could precede or follow this alert.

