note: |
  ### Technical Context
  This detection rule identifies when certificate-based authentication (CBA) has been enabled within an Azure Active Directory (Azure AD) tenant, which can be an indicator of attackers implementing persistence mechanisms in a compromised environment. CBA allows users to authenticate without passwords, raising the possibility of credential misuse, especially if configured improperly or without proper oversight. Attackers may exploit this to gain unauthorized access or to maintain persistence within an organization’s network, particularly during privilege escalation attempts.

  In this scenario, the likely attacker objective includes bypassing traditional authentication methods and establishing a foothold through legitimate credentials. The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Defense Evasion (TA0005)**: Manipulating authentication methods to avoid detection.
  - **Credential Access (TA0006)**: Stealing or misusing credentials.
  - **Persistence (TA0003)**: Ensuring continued access to a compromised system.
  - **Privilege Escalation (TA0004)**: Gaining elevated access as a part of maintaining control.

  The primary data sources that will yield the most relevant evidence include Azure AD audit logs, specifically tracking changes in authentication methods, which can indicate unauthorized or suspicious modifications by an attacker.

  ### Investigation Steps
  - **Review Azure AD Audit Logs**: Analyze the Azure Active Directory audit logs to identify the specific changes made to the Authentication Methods Policy. Look for unusual timestamps, sources of these changes, or any anomalous accounts involved.

  - **Identify Affected Accounts**: Check which accounts were modified during the configuration of certificate-based authentication. Verify if these accounts have unusual activity or were previously exposed to data breaches.

  - **Assess Certificate Issuance**: Investigate any certificate issuance related to the accounts that were modified. This includes reviewing if certificates were issued without following the organization’s standard procedures or from untrusted sources.

  - **Correlate with User Behavior**: Cross-reference the modified accounts and their recent activities. Look for any lateral movement within the network or attempts to access sensitive resources immediately before or after the authentication policy was altered.

  ### Prioritization
  The severity of this alert is medium due to the potential risks associated with enabling certificate-based authentication, which could lead to credential misuse or unauthorized access. The likelihood of such configurations being deployed maliciously adds to the urgency for investigation.

  ### Blind Spots and Assumptions
  Detection capabilities may be limited by the completeness of Azure AD audit logs; if logging is not enabled for authentication changes, this detection will not work. The assumption is that all modifications to authentication policies are legitimate unless proven otherwise. Adequate logging configurations must be in place, including enabling full audit logging for administrative changes in Azure AD, to ensure timely and effective detection of potentially malicious activities.

