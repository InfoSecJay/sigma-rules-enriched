  ---

  ### Technical Context

  This Sigma rule detects the addition of a new root certificate authority (CA) within an Azure AD tenant via the operation "Set Company Information." This could indicate an attacker’s attempt to facilitate certificate-based authentication for unauthorized purposes, such as lateral movement or privilege escalation, by leveraging trusted CAs to issue valid certificates that allow access to sensitive resources. The relevant MITRE ATT&CK tactics include "Credential Access" (TA0011) and "Persistence" (TA0003), specifically the techniques related to certificate-based authentication (T1556).

  The primary telemetry sources required for this detection are Azure AD audit logs, specifically focusing on logs related to "Set Company Information" operations. The security impact could be substantial, as a compromised CA might enable adversaries to impersonate legitimate users or devices. It's important to clarify that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities could also generate this alert.

  ---

  ### Investigation Steps

  - **Review audit logs for CAs added:** Check Azure AD audit logs (Event ID related to "Set Company Information") for any modifications to TrustedCAsForPasswordlessAuth. Identify who made the change, their role, and if it aligns with organizational practices.

  - **Examine user roles involved:** Look for any anomalies in the user account (including changes) that modified the Trusted CAs. Evaluate if the account has historical permissions/roles that justify the change.

  - **Identify recent certificate usage:** Investigate recent activities associated with the newly added CA in Azure AD (e.g., certificate issuance logs) to determine if these certificates are actively being used within the environment.

  - **Document legitimate administrative actions:** Confirm if the addition aligns with planned certificate management schedules or if it followed any corporate security protocols, such as notifications or ticketing requirements.

  - **Look for high-confidence malicious indicators:** Validate against known malicious patterns in Azure AD where unauthorized CAs have been added. This could involve cross-referencing against threat intelligence to see if the added CA matches any reported threats.

  - **Assess asset criticality and permissions:** Evaluate the Azure resources and applications that may rely on certificate-based authentication. Determine the system's criticality and the potential impact if the added CA is exploited.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential risk of credential theft or privilege escalation associated with unauthorized access to trusted certificate authorities. While this behavior can be weaponized, it is not frequently exploited in common attack scenarios without additional supporting actions.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative activities to trigger this alert, such as changes made by authorized IT personnel during maintenance. Required log sources include complete Azure AD audit logs, ensuring monitoring encompasses all relevant operational changes. Additionally, administrative tasks related to certificate management may account for false positives. A companion detection to consider is monitoring for certificate usage tied to newly added CAs, as this can provide context for potential abuse.

