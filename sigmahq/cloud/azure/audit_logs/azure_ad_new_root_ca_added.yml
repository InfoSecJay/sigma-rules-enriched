logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: 'Set Company Information'
    TargetResources.modifiedProperties.newValue|contains: 'TrustedCAsForPasswordlessAuth'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of a new root Certificate Authority (CA) to an Azure Active Directory (Azure AD) tenant, which may be used to facilitate certificate-based authentication. The likely objective of this behavior by an attacker includes establishing persistence or escalating privileges within the environment via unauthorized access to certificate-based logins. This activity relates to the MITRE ATT&CK technique "Application Layer Protocol" (T1556), which involves malicious manipulation of trust mechanisms for authentication.

  The primary telemetry sources include Azure AD audit logs, specifically monitoring the `OperationName` for `Set Company Information` and modifications to the `TrustedCAsForPasswordlessAuth`. If malicious, this behavior could grant adversaries unauthorized access pathways and potential lateral movement within the network. Importantly, this detection does NOT confirm that the addition of a new CA is inherently malicious; it simply highlights the action for review.

  ### Investigation Steps

  - **Review Azure AD audit logs:**
    Check Azure AD audit logs for `OperationName: Set Company Information` (Audit log Event ID: 4624), focusing on `TargetResources.modifiedProperties.newValue` to identify any added CAs. Look for CAs that are not part of the organization’s standard certificate inventory.

  - **Validate existing certificate policies:**
    Cross-reference the added root CA against organizational policies and known legitimate CAs to determine if the change is authorized. Established policies should not include unknown or suspicious CAs.

  - **Assess user permissions:**
    Investigate the identity of the user who performed the CA addition by checking the `initiatedBy` field in the audit log. Ensure the user has the appropriate permissions and is a known administrator or trusted role within the organization.

  - **Correlate with known issuance dates:**
    Identify the timestamp of the CA addition and correlate against known compromise events or administrative changes in your environment. Legitimate CA additions typically occur during scheduled maintenance or policy updates.

  - **Look for other related changes:**
    Check for additional security configurations modified around the same time, such as changes in Conditional Access policies or Multi-Factor Authentication settings. Multiple simultaneous changes may indicate malicious behavior.

  ### Prioritization

  This alert should be regarded with medium severity due to the potential impact of unauthorized access in cloud environments and the likelihood that this method is weaponized by attackers for privilege escalation and persistence. Misconfigurations or unauthorized CA additions can lead to significant security incidents, especially if the affected system controls critical infrastructure.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where adversaries may delete or alter logs post-activities, making detection difficult. Reliable monitoring must ensure that Azure AD audit logs are adequately retained and adequately configured. Additionally, benign activities such as legitimate administrative updates may trigger this alert, highlighting the need for contextual analysis. A related detection to consider is monitoring the creation or modification of users with elevated privileges or the addition of new roles in Azure AD, which may complement this rule’s coverage.

