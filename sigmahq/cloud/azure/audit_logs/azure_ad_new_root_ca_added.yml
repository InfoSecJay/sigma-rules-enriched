title: New Root Certificate Authority Added
id: 4bb80281-3756-4ec8-a88e-523c5a6fda9e
status: test
description: Detects newly added root certificate authority to an AzureAD tenant to
  support certificate based authentication.
references:
- https://posts.specterops.io/passwordless-persistence-and-privilege-escalation-in-azure-98a01310be3f
- https://goodworkaround.com/2022/02/15/digging-into-azure-ad-certificate-based-authentication/
author: Harjot Shah Singh, '@cyb3rjy0t'
date: 2024-03-26
tags:
- attack.defense-evasion
- attack.credential-access
- attack.persistence
- attack.privilege-escalation
- attack.t1556
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: 'Set Company Information'
    TargetResources.modifiedProperties.newValue|contains: 'TrustedCAsForPasswordlessAuth'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where a new root Certificate Authority (CA) has been added to an Azure Active Directory (Azure AD) tenant. Such an action may indicate an attacker attempting to establish a foothold or maintain persistence within a compromised environment by enabling certificate-based authentication. Attackers could exploit this capability to gain unauthorized access and escalate privileges, ultimately leading to potential data exfiltration or system compromise.

  The relevant MITRE ATT&CK tactics/techniques associated with this detection include:
  - **Defense Evasion (T1203)**: Adding a legitimate root CA can help attackers hide their activities within the certificate store.
  - **Credential Access (T1556)**: Attackers could leverage newly added certificates to facilitate unauthorized access to accounts and systems.
  - **Persistence (T1098)**: Establishing a root CA allows attackers to create persistent access mechanisms even under audits or during regular credential changes.
  - **Privilege Escalation (T1055)**: Using certificates can enable attackers to escalate privileges, especially in environments utilizing certificate-based authentication.

  Primary data sources for this alert include:
  - Azure AD audit logs, which capture changes to the company information, including Certificate Authority modifications.

  ### Investigation Steps
  - **Review Audit Logs**: Examine Azure AD audit logs for the "Set Company Information" operation to confirm the addition of a new root CA and gather details about the user or service account that performed this action.
  - **Analyze User Context**: Investigate the account used for the CA addition, checking for anomalies or signs of compromise, such as unusual geographic locations or behavior patterns.
  - **Check Certificate Validity**: Assess the newly added root certificate's legitimacy by checking its issuer details and associated policies to ensure it aligns with business requirements.
  - **Identify Related Changes**: Look for any other modifications related to security settings or user permissions around the same time the root CA was added, which may indicate larger changes or attacks in progress.

  ### Prioritization
  This alert is tagged with medium severity due to the potential for significant impact in an enterprise environment. If successfully exploited, the added root CA could allow unauthorized users to bypass standard authentication mechanisms, increasing the risk of data breaches and system compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, especially if the operation is performed by a legitimate user or a service account with elevated privileges that normally conducts such activities. The detection logic assumes all legitimate root CA changes are known and that appropriate monitoring has been implemented in Azure AD. Additional logs related to user sign-ins and administrative actions may be necessary for comprehensive coverage and effective alert validation.

