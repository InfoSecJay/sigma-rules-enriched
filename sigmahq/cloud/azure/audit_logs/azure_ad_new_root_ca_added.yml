title: New Root Certificate Authority Added
id: 4bb80281-3756-4ec8-a88e-523c5a6fda9e
status: test
description: Detects newly added root certificate authority to an AzureAD tenant
  to support certificate based authentication.
references:
- https://posts.specterops.io/passwordless-persistence-and-privilege-escalation-in-azure-98a01310be3f
- https://goodworkaround.com/2022/02/15/digging-into-azure-ad-certificate-based-authentication/
author: Harjot Shah Singh, '@cyb3rjy0t'
date: 2024-03-26
tags:
- attack.defense-evasion
- attack.credential-access
- attack.persistence
- attack.privilege-escalation
- attack.t1556
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName: 'Set Company Information'
    TargetResources.modifiedProperties.newValue|contains: 'TrustedCAsForPasswordlessAuth'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the addition of a new root certificate authority (CA) in an Azure Active Directory (AzureAD) environment. Attackers may add a rogue CA to enable certificate-based authentication, facilitating unauthorized access and privilege escalation. The relevant MITRE ATT&CK tactics include Persistence (T1546) and Credential Access (T1556). Primary telemetry sources required include Azure Audit Logs, specifically monitoring the operation name for changes in company information regarding Trusted CAs for passwordless authentication. If malicious, the addition of an unauthorized CA could allow attackers to impersonate users or escalate privileges. This detection does NOT confirm that the CA is malicious or that it has been exploited; further investigation is required.

  ### Investigation Steps

  - **Identify the source of the change:** Review Azure Audit Logs (Operation Name: 'Set Company Information') to confirm the user or service principal that made the change. Check for unexpected accounts or elevated privileges associated with the action.

  - **Determine the context of the CA addition:** Look at the timestamp and correlate it with other activity such as user sign-ins or unusual account behavior in Azure AD logs. Legitimate additions may coincide with a known scheduled change or maintenance activity.

  - **Check for prior alerts or anomalies:** Search for any previous alerts that may indicate suspicious activity related to user accounts or certificate management (Event types that originated prior to this change) using Azure AD logs.

  - **Verify the trustworthiness of the CA:** Conduct a review of the newly added CA to ensure it is a legitimate entity. Compare against approved certificate lists or organizational policies for trusted CAs, focusing on fields such as the CA name and issuer.

  - **Document the environment:** Compile system and asset criticality details for the AzureAD tenant involved to understand the potential impact of a compromised CA. Determine if this tenant handles sensitive data or critical infrastructure.

  - **Examine for unauthorized access:** Look for new certificate issuance events or unusual access patterns to resources protected by the new CA in Azure logs, particularly focusing on authentication types and user agent strings.

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized access and the elevated risk associated with certificate-based authentication. The likelihood of malicious abuse is moderate, as this method is often weaponized for persistence and privilege escalation. The nature of the environment and its critical services influences the urgency of response.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of Azure AD logging and the potential for attackers to spoof legitimate operations. Verify that audit log settings are correctly configured to capture all relevant events. Legitimate administrative actions may inadvertently trigger the alert, especially during organizational changes or migrations. A related detection to consider is monitoring for unauthorized certificate issuances, which can provide additional context around the introduction of a new CA.

