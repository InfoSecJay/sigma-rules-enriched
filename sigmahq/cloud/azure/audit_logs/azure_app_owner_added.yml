note: |
  ### Technical Context
  This rule detects when a new owner is added to an application within Azure Active Directory (AAD). This action could indicate an attempt by an attacker to gain control over an application, potentially allowing them to make unauthorized modifications or configurations. The presence of a new owner can also be indicative of credential access tactics, where attackers seek elevated privileges for malicious activities.

  The threat scenario involves an insider or external attacker gaining some access to the application and subsequently elevating their permissions to carry out further exploits. Common objectives may include exfiltrating sensitive data, manipulating application settings, or using the application as a pivot point for further attacks within the organization.

  Relevant MITRE ATT&CK tactics include:
  - **T1552: Application Layer Protocol** - Abusing trusted applications or their configurations.
  - **T1078: Valid Accounts** - Exploiting legitimate user accounts to gain access.

  The primary data source for detecting this activity will be Azure audit logs, specifically focusing on audit events that log changes in application ownership.

  ### Investigation Steps
  - **Review Audit Logs**: Check Azure audit logs for entries indicating that a new owner was added to an application. Pay attention to the user who made the change and the time of the activity.

  - **Analyze User Activity**: Investigate the activity of the user who added the new owner. Determine if there were any preceding suspicious logins or operations linked to the account.

  - **Cross-Reference Changes**: Look for any other modifications made within a short time frame before or after the owner was added, such as changes to application permissions or roles.

  - **Verify Legitimate Usage**: Confirm whether the changes align with known administrative operations. Engage with the application owner and IT admins to validate if the owner addition was authorized.

  ### Prioritization
  This alert has medium severity due to the potential risk of unauthorized access being granted to applications, which could enable attackers to manipulate critical assets and information within the enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic may not capture scenarios where owners are added through legitimate administrative actions, potentially leading to false positives during regular maintenance activities. Additionally, it assumes that all relevant personnel are properly authenticated and that audit logs are accurately capturing all events related to application ownership changes. Proper logging configurations for Azure audit logs must be in place for this detection rule to function effectively.

