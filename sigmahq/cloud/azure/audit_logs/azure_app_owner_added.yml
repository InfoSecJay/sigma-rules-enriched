note: |
  ### Technical Context

  This rule detects the addition of a new owner to an application, typically involving an account being granted privileges to modify or configure that application. The likely attacker objective is to gain elevated privileges within an application, potentially facilitating unauthorized changes or access to sensitive information. Relevant MITRE ATT&CK tactics include Credential Access (T1552) and the technique of Abuse Elevation Control Mechanism (T1548). The primary telemetry source is Azure audit logs, specifically entries with the relevant event indicating an ownership change. If malicious, this behavior could lead to significant compromise of application integrity and data security. However, this detection alone does NOT confirm that the action was unauthorized, as legitimate administrators may perform this task.

  ### Investigation Steps

  - **Verify ownership changes:**
    Review Azure audit logs (e.g., Event ID corresponding to application ownership) to confirm the identity of the user performing the action. Look for consistent patterns with known administrative actions.

  - **Check application criticality:**
    Determine the criticality of the affected application by consulting asset management databases. High-impact applications may warrant higher investigation urgency.

  - **Inspect activity logs for user behavior:**
    Analyze the logs preceding the ownership change (e.g., Azure Sign-in logs) for suspicious activity associated with the user, focusing on failed login attempts, unusual login times, or access from unexpected locations.

  - **Evaluate historical context:**
    Investigate if similar ownership changes were made recently by the same user or in a short timeframe, which may indicate a pattern of escalation (e.g., multiple ownership changes for other applications).

  - **Document legitimate administrative patterns:**
    Identify and document expected administrative behaviors indicating legitimate roles, such as routine application ownership updates during personnel changes or organizational restructuring.

  ### Prioritization

  The alert's severity is medium due to its potential impact on application integrity and data security. The likelihood of malicious abuse exists, particularly if the affected application is critical, making it a target for attackers seeking to manipulate application settings or access. This behavior is moderately common in operational contexts, as ownership changes can be part of routine administrative tasks.

  ### Blind Spots and Assumptions

  Detection limitations may include legitimate administrative actions triggering the alert without malicious intent. Reliable detection requires proper configuration of Azure audit logs to capture all ownership modifications. Additionally, a common legitimate activity that may trigger the alert is a scheduled application review or updates by authorized personnel. A related detection that strengthens coverage would include tracking unusual patterns in user permission escalations (e.g., granting access to sensitive roles or resources).

