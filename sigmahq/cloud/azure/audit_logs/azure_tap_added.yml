note: |
  ### Technical Context

  This rule detects the addition of a Temporary Access Pass (TAP) to a user account in Azure AD, specifically when the process involves privileged accounts. The likely attacker objective is to gain elevated access to sensitive resources, facilitating account compromise or ongoing persistence in an environment. This behavior corresponds to the MITRE ATT&CK technique T1078.004: “Account Manipulation” under the "Initial Access" and "Persistence" tactics. The primary telemetry source is Azure Audit Logs, particularly entries about updates on security information of user accounts.

  If a malicious actor successfully adds a TAP to a privileged account, they could exploit it for unauthorized actions, potentially leading to data breaches or lateral movement within the enterprise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can also trigger this alert, necessitating further investigation.

  ### Investigation Steps

  - **Verify account type and privileges:** Check if the account with the new TAP is classified as a privileged account (e.g., Global Admin, Privileged Role). This can be done using Azure AD role assignment logs for user roles.

  - **Review Audit Logs for other changes:** Look for any simultaneous modifications in user properties (e.g., Azure Event ID 4720, user creation events) or permission changes that could indicate suspicious activity.

  - **Analyze TAP registration details:** Check the specific logs under Azure Audit Logs for event properties, filtering by “Admin registered temporary access pass method for user.” Identify unusual times or user IP addresses.

  - **Evaluate legitimate use cases:** Cross-reference with known administrators' activities around the time of the alert. Legitimate TAP additions typically occur during proactive security audits or onboarding sessions.

  - **Identify high-confidence malicious indicators:** Look for unusual behavior, such as TAP registrations followed by multiple failed login attempts (Azure M365 logs) or access to sensitive data shortly after the TAP activation.

  ### Prioritization

  This alert is high severity due to the sensitivity of privileged accounts and the risk associated with unauthorized TAPs. Malicious actors often exploit vulnerabilities in account management for lateral movement, making this behavior a common tactic in their exploitation strategies.

  ### Blind Spots and Assumptions

  The detection may miss scenarios where an attacker gains access to an admin's account without register modifications. Reliance on Azure AD logs is critical; misconfigurations could lead to blind spots. Legitimate TAP registrations by administrators for maintenance or to facilitate privileged tasks may also trigger this alert. A related detection could involve monitoring for unusual login patterns post-TAP registration, enhancing the overall coverage of this threat vector.

