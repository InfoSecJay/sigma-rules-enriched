note: |
  ### Technical Context
  This rule detects the addition of a Temporary Access Pass (TAP) to a user's account, specifically targeting privileged accounts. A TAP can provide temporary access to Azure Active Directory (Azure AD) resources, allowing users to authenticate without a password. Attackers may exploit this capability to bypass traditional authentication mechanisms, potentially gaining unauthorized access to sensitive information or systems. By inserting a TAP into a privileged account, an adversary can maintain persistence and facilitate lateral movements within the environment.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access - T1078.004**: Valid Accounts (specifically through the use of Temporary Access Pass).
  - **Privilege Escalation**: Gaining unauthorized elevated access through anomalies in account management.
  - **Persistence**: Leveraging TAPs to maintain access without alerting traditional monitoring systems.

  Primary telemetry sources for this detection include Azure audit logs, which contain changes to user account security settings and access information.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Investigate the Azure audit logs for entries related to the registration of security information, particularly looking for the message indicating a TAP being added.
  - **Analyze User Account Changes**: Cross-reference other recent account changes for the same user, such as password resets or modifications in account roles, to determine if the TAP addition is correlated with suspicious activity.
  - **Check for Anomalous Activity**: Look for unusual access patterns from the user account post-TAP addition, such as access to sensitive resources or unusual geographical logins.
  - **Correlation with Threat Intelligence**: Validate against known threat intelligence to identify if the affected account has been targeted previously or used in malicious activities.

  ### Prioritization
  The alert's severity is high because the addition of a TAP to a privileged account can signify a critical security risk, as it may enable unauthorized access or privilege escalation by an adversary, which can lead to significant data breaches or security incidents.

  ### Blind Spots and Assumptions
  This detection rule may miss scenarios where TAPs are legitimately added by administrators during maintenance or operational requirements, leading to potential false positives. The logic assumes that every TAP addition is suspicious without considering the broader context of account activity. Additionally, it relies on the comprehensive logging of account changes within Azure Audit Logs; if these logs are not enabled or correctly configured, the detection will fail.

