  ---

  ### Technical Context

  This rule detects the addition of a Temporary Access Pass (TAP) to an account, particularly when applied to privileged accounts. The likely objective of an attacker is to gain unauthorized access to sensitive systems or data by exploiting a simplified authentication method that bypasses traditional credential requirements. This behavior aligns with the MITRE ATT&CK tactic of **Initial Access** (TA0001) and technique **Valid Accounts** (T1078.004).

  The primary telemetry source for this detection is Azure Audit Logs, specifically monitoring events related to the registration of security information and the status of TAP methods. If malicious, the security impact can be significant as it may allow attackers to bypass normal authentication mechanisms. This detection does NOT confirm malicious intent on its own; legitimate administrators may also register a TAP for valid use cases.

  ---

  ### Investigation Steps

  - **Review Azure Audit Logs for TAP registrations**: Check for Event IDs associated with the addition of a TAP, focusing on logs where `properties.message` equals "Admin registered security info" and `Status` indicates "Admin registered temporary access pass method for user."

  - **Identify affected user accounts**: Determine if the TAP was added to a privileged account, such as those belonging to administrators or critical system services. Validate account roles via the Azure AD or IAM admin console.

  - **Cross-check with existing user actions**: Look for related log entries for the affected account in the past 30 days for unexpected behavior (e.g., unusual logins, access to sensitive resources) using Azure AD sign-in logs.

  - **Assess legitimate TAP use**: Confirm whether the TAP addition aligns with standard operational procedures in your organization. For example, legitimate requests for temporary access should be documented and approved within your IT security policy.

  - **Investigate for signs of compromise**: Look for high-confidence indicators of malicious activity, such as prior suspicious login attempts or abnormal access patterns to sensitive data post-TAP addition.

  - **Monitor for follow-up events**: Set alerts for subsequent actions taken with the TAP, like access to or modifications of sensitive resources, which could indicate further exploitation.

  ---

  ### Prioritization

  The alert is high severity due to the potential impact on security if privileged accounts are compromised, increasing the likelihood of data breaches or unauthorized access. Temporary Access Passes are often leveraged by attackers to facilitate malicious activities since they streamline access without the need for a full authentication process.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in Azure AD logging settings that prevent complete visibility into TAP events. Legitimate activities, such as administration tasks or user updates following business processes, may trigger this alert. Additionally, related detections such as suspicious access to accounts after TAP addition (e.g., monitoring access logs for unusual resource usage) can enhance coverage and effectiveness in identifying potential abuse.

