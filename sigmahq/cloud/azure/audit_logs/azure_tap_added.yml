note: |
  ### Technical Context

  This rule detects the addition of a temporary access pass (TAP) to a user account, particularly focusing on privileged accounts. The likely attacker objective is to establish unauthorized access to sensitive systems or data by leveraging the TAP, which may allow them to bypass standard authentication mechanisms. Relevant MITRE ATT&CK tactics and techniques include "Privilege Escalation" (TA0004) and "Valid Accounts" (T1078.004). Primary telemetry sources include Azure audit logs, specifically focusing on entries where `properties.message` is "Admin registered security info" and `Status` indicates that an admin has registered a temporary access pass. If malicious, the security impact includes potential unauthorized access to systems and sensitive data. However, this detection alone does NOT confirm malicious intent, as there may be legitimate administrative actions.

  ### Investigation Steps

  - **Verify the user account context: ** Check the role and permissions of the affected account. Focus on whether it has elevated privileges or administrative access, which increases the impact of the alert. Review Azure AD logs, user attributes, and account roles.

  - **Review event details: ** Examine the Azure audit logs for the exact event where the TAP was added (Event ID for temporary access pass registration). Look for the presence of properties indicating the method along with timestamps for when the activity occurred.

  - **Identify recent changes around the account: ** Investigate other activity in the audit logs relevant to the account before and after the TAP was added. Look for logins from unusual locations, multiple failed attempts, or other anomaly indicators such as logins around the same timestamp.

  - **Assess common administrative actions: ** Evaluate if the TAP registration aligns with known legitimate behavior, such as scheduled maintenance, routine adjustments by authorized personnel, or other administrative activities documented in your SOC playbooks.

  - **Identify indicators of malicious intent: ** Look for any simultaneous account activity or access attempts that appear abnormal, such as access from unexpected IP addresses or systems. Check for logged events around Event ID that flag anomalous behavior.

  ### Prioritization

  This alert is of high severity due to its potential impact on privileged accounts, which can facilitate unauthorized access to sensitive infrastructure or data. The risk of malicious abuse is significant, as attackers often target admin accounts to maintain persistent access following initial compromise. Temporary access passes, when misused, are commonly exploited methods in modern attack vectors.

  ### Blind Spots and Assumptions

  Detection limitations may include users with legitimate administrative reasons for adding TAPs; thus, it is essential to verify the intent and context of each alert. Required configurations such as enabling comprehensive logging for Azure Admin activities are crucial for reliable detection. Legitimate activities like system updates or user training exercises may inadvertently trigger the alert. A related or companion detection includes monitoring for unusual login patterns immediately following TAP addition, which can help provide context and risk assessment for potentially malicious scenarios.

