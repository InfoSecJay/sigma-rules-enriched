note: |
  ### Technical Context

  This rule detects changes to device registration policies within Azure Active Directory. Such alterations may indicate potential adversary attempts to manipulate device authentication and enrollment, leading to unauthorized access or privilege escalation. An attacker may aim to bypass existing security measures, thereby solidifying a foothold within the network.

  This behavior corresponds to the MITRE ATT&CK tactic of **Privilege Escalation (TA0004)**, specifically the technique **T1484: Domain Group Membership Modification**. The primary telemetry source for this detection is Azure audit logs, specifically logs pertaining to policy alterations. The security impact of a malicious change could be significant, as it may facilitate the compromise of user devices and subsequent unauthorized actions.

  This detection does NOT confirm that a malicious action has occurred on its own; policy changes could be enacted by an administrator for legitimate purposes.

  ### Investigation Steps

  - **Review Azure Audit Logs:** Check audit log entries for the action "Set device registration policies" (Azure Activity logs). Look for changes made by unusual users or during off-hours which may signal malicious behavior.

  - **Identify User Context:** Determine the identity of the user or service principal that made the change (check `initiator` field). Changes made by legitimate, known administrators could signify expected behavior versus unfamiliar accounts or service principals indicative of compromise.

  - **Monitor for Subsequent Actions:** Review for actions following the policy change, such as device enrollments (check for Azure Intune enrollment logs). Rapid registrations of new devices can suggest exploitation of the modified policy.

  - **Establish Baseline Behavior:** Analyze normal admin activity related to policy changes (e.g., scheduled policy reviews or updates during maintenance windows) to better differentiate between benign and suspicious alterations.

  - **Check Device Status:** Validate the enrollment status of devices post-policy change (using device compliance reports). Unusual enrollments or compliance issues following changes may indicate adversarial actions.

  ### Prioritization

  This alert carries high severity, as changes to device registration policies can have a significant impact on the security posture of the organization. The likelihood of malicious abuse is notable, especially given the critical role device registration plays in identity and access management. Similar incidents have been weaponized in past breaches.

  ### Blind Spots and Assumptions

  This detection may have limitations regarding changes made by highly privileged users who are legitimate administrators, potentially masking malicious intent. The successful detection of changes requires comprehensive Azure audit logging configured properly. Additionally, direct endpoint interactions (e.g., enrollment from unmanaged devices) may pose false positives. A related detection could involve monitoring for unauthorized enrollments or logins from atypical device types that align with policy changes.

