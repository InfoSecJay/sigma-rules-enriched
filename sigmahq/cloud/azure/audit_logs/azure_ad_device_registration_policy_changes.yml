note: |
  ### Technical Context

  This Sigma rule detects changes to the device registration policy within Azure, specifically focusing on modifications made to settings governing how devices register with the service. The likely attacker objective is to manipulate device registration policies to facilitate unauthorized access or control devices that could be exploited for further attacks. This behavior falls under the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and technique "Modify Device Configuration" (T1484).

  The primary telemetry source comes from Azure Audit Logs, where activities related to policy changes are recorded. The security impact of unauthorized changes could lead to weakened security postures, allowing malicious actors to register rogue or compromised devices within the organizational environment. It's important to note that this detection does NOT confirm that malicious intent was involved; legitimate administrative changes could trigger the same alert.

  ### Investigation Steps

  - **Check audit logs for anomalies:** Review Azure Audit Logs for Event Category 'Policy' and ActivityDisplayName 'Set device registration policies' to identify the user who made the changes. Compare timestamps and user accounts involved against expected administrative activity.

  - **Review recent administrative activity:** Identify the roles of users making the changes. Legitimate activity may involve recognized IT staff with proper administrative roles. If the change was made by a previously inactive or non-administrative account, this is a red flag.

  - **Analyze scope of changes made:** Examine details of the policy change including before-and-after configurations. A wide-ranging alteration affecting multiple device types or user groups may indicate malicious intent.

  - **Check for unusual access patterns:** Investigate if the originating IP address of the change request matches the organization's typical access patterns for sensitive actions. Use the fields 'IPAddress' and 'InitiatedBy' in the Azure Credential Logs.

  - **Conduct user account validation:** Validate the user identity against HR records or directory services to ensure that the user account is legitimate and has not been compromised. This can include reviewing 'UserPrincipalName' and 'AccountEnabled' fields.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on device security and the likelihood of this behavior being weaponized by adversaries looking to manipulate or escalate privileges within the IT environment. Unauthorized changes can lead to significant data breaches or further exploitation of the network.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not thoroughly enabled for all necessary Azure services, or if privileged accounts are hijacked without clear indicators. Legitimate changes by IT staff frequently occur and may lead to false positives. A related detection could involve alerting on creation or modification of user accounts with elevated privileges, enhancing coverage of potential privilege escalation scenarios.

