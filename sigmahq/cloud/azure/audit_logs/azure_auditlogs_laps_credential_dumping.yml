  ---

  ### Technical Context

  This Sigma rule detects situations where an account retrieves the Windows Local Administrator Password Solution (LAPS) credential through Microsoft Entra ID. The primary objective of an attacker leveraging this capability is to escalate privileges on compromised endpoints by obtaining sensitive local account passwords. This behavior falls under the MITRE ATT&CK tactic of Privilege Escalation (Tactics: **TA0004**) and Technique: **T1098.005 (Accessing Local Administrator Passwords)**.

  The primary telemetry source for this detection is Azure Audit Logs, specifically focusing on 'Device' category entries reflecting the activity 'Recover device local administrator password'. If exploited maliciously, this access can lead to broader system compromise as local admin credentials are often pivotal for lateral movement and further privilege escalation. This detection does NOT, on its own, confirm that unauthorized access has occurred, as it may be performed during legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Review audit logs for activityType:** Access Azure Audit Logs (Event type: `Recover device local administrator password`). Ensure the `additionalDetails.additionalInfo` field contains the entry ‘Successfully recovered local credential by device id’ for event validation.

  - **Identify account owner:** Validate whether the user/account performing the credential retrieval is authorized. Cross-check the retrieval against your list of approved administrators who typically manage LAPS.

  - **Assess recent access patterns:** Check if the alert coincides with unusual account activity (Event ID: 4624 for logon events) from the account in question, focusing on timestamp and access location for anomalies.

  - **Audit legitimate use of LAPS:** Confirm expected retrieval patterns documented in your organization’s LAPS management policy. Many organizations may have routine access logs indicating when and by whom these credentials are regularly accessed, which provides a baseline for comparison.

  - **Correlate with related incidents:** Look for related alerts or incidents in the logs that may indicate a larger pattern of suspicious behavior. Monitor other activities such as abnormal API calls or service usage around the same timeframe.

  ---

  ### Prioritization

  Given the potential impact of local administrator credential exposure, which can lead to full system control, this alert is categorized as high severity. The likelihood of such behavior being abused in a malicious context is significant, as attackers commonly target admin passwords for lateral movement. Given its critical nature, this behavior is frequently weaponized across threat landscapes.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion where attackers may perform credential recovery using legitimate accounts during off-hours or under expected administrative processes. Successful detection relies on properly configured Azure Audit Logs to capture necessary activities. Legitimate activities such as scheduled admin tasks may inadvertently trigger the alert, indicating a need for careful contextual investigation. A related detection on suspicious administrative logon events (Event ID: 4624) can enhance visibility into potential misuse of administrative privileges.

