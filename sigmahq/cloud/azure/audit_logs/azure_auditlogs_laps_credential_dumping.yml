note: |
  ### Technical Context

  The Sigma rule detects instances where a user recovers the Windows Local Administrator Password Solution (LAPS) credential from Entra ID. This action may indicate an attacker attempting to gain elevated privileges on a target device, facilitating persistence or lateral movement within the network. The relevant MITRE ATT&CK tactics and techniques are: Privilege Escalation (T1068) and Persistence (T1098.005).

  Primary telemetry sources include Azure Audit Logs, specifically the "Device" category. The anticipated security impact involves unauthorized access to sensitive systems and potential system compromise. It is crucial to note that this detection does NOT confirm malicious intent on its own; approved activities by administrators can also trigger the rule.

  ### Investigation Steps

  - **Verify user activity context: ** Cross-reference the user account initiating the credential recovery with known administrator accounts: Review Azure Audit Logs (event types) and look at user account roles (e.g., roles.json) to understand if the action aligns with typical administrative duties.

  - **Examine the device ID used: ** Get details from the additionalDetails.additionalInfo field in Azure Audit Logs: Ensure the device ID corresponds to a legitimate corporate asset and not an unauthorized device.

  - **Identify indicator of compromise: ** Look for successful recoveries of LAPS credentials: Check "Successfully recovered local credential by device id" in the additionalDetails.additionalInfo field, considering the pattern of this behavior against normal enterprise operations.

  - **Check for multiple recovery attempts: ** Analyze repeated entries for the same device ID in the Azure Audit Logs: Multiple credential recovery attempts within a short timeframe may indicate malicious activity.

  - **Assess environment significance: ** Determine the criticality of the affected asset: If the device ID recovered is for a high-value target (e.g., servers, domain controllers), prioritize remediation actions compared to a less critical workstation.

  - **Document legitimate LAPS usage: ** Understand baseline patterns of approved administrative activities: Refer to the roles and responsibilities matrix to validate expected administrative interactions with LAPS within the entral-admin environment.

  ### Prioritization

  This alert is of high severity due to the potential compromise of administrative credentials, leading to elevated access to critical systems. The likelihood of malicious abuse is significant, especially in environments where LAPS is deployed, as it’s a known target for adversaries attempting to escalate privileges. Such behavior aligns with commonly weaponized tactics by attackers aiming for lateral movement or persistent access.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions being misclassified as suspicious activity. Required log sources must be correctly configured in Azure to capture all relevant audit logs. Legitimate activities such as scheduled updates or maintenance checks by IT personnel could also trigger this alert. A related detection to enhance coverage is monitoring for unusual access patterns targeting LAPS accounts across the organization's infrastructure.

