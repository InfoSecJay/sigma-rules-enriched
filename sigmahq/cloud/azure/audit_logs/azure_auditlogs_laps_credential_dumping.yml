note: |
  ### Technical Context
  This detection rule identifies when an account retrieves the Local Administrator Password Solution (LAPS) password from Microsoft Entra ID. The rule captures activities linked to unauthorized attempts or legitimate processes to access elevated credentials that could lead to privilege escalation or persistence within a compromised environment. Attackers may target LAPS as these passwords are crucial for maintaining access to Windows devices, especially in enterprise networks where lateral movement is a common tactic.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), focusing specifically on **Lateral Movement** via Credential Dumping (T1098.005). Understanding when and how often these administrator passwords are accessed can help in quickly identifying potential misuse, whether by an insider threat or external attacker.

  Primary data sources for this detection include **Azure audit logs**, which capture important events concerning user activities in Entra ID, allowing security teams to trace potentially malicious attempts to extract LAPS credentials effectively.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Analyze audit logs specifically looking for entries related to 'Recover device local administrator password' to identify any unauthorized credential retrieval activities.
  - **Correlate Alerts with User Behavior**: Check the context of the user accounts accessing the LAPS passwords. Look for unusual patterns, such as accounts with no legitimate need for privilege escalation or abnormal times of access.
  - **Inspect Device Access Logs**: Investigate which devices the credentials were accessed from to determine if it aligns with standard operating procedures or if any anomalies suggest malicious activity.
  - **Trace Back to Original Request**: If a legitimate administrator has accessed the LAPS password, gather related information to determine whether the activity correlates with approved changes or maintenance work.

  ### Prioritization
  This alert is categorized as high severity due to the substantial risk posed by unauthorized access to local administrator credentials. The capability to recover these passwords can facilitate extensive lateral movement and privilege escalation for an attacker within an enterprise network.

  ### Blind Spots and Assumptions
  This detection may not capture all potential misuse scenarios, especially if auditing is not consistently enforced across all systems. It assumes that Azure audit logging is correctly configured and that all necessary activities are being logged effectively. If audit logs are not comprehensive or if configurations have been bypassed, the detection mechanism may fail to trigger an alert for malicious attempts to access LAPS credentials.

