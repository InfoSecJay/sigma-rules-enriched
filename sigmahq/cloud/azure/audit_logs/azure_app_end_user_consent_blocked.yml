note: |
  ### Technical Context

  This Sigma rule detects attempts by applications to access user data in Azure that have been blocked due to risk-based consent policies. The likely attacker objective is to exploit user credentials or sensitive data through malicious applications that attempt to bypass consent prompts. This detection aligns with the MITRE ATT&CK tactic "Credential Access" (TA0006), specifically technique "Application Layer Protocol" (T1528). The primary telemetry source is Azure audit logs, focusing on logs that capture application consent failures. If malicious, this could indicate a significant security breach, leading to unauthorized access to sensitive data. However, this detection does NOT confirm that any successful compromise has occurred.

  ### Investigation Steps

  - **Review Azure Audit Logs for Event Details**: Check the Azure audit logs for Event ID related to application consent actions (e.g., `Microsoft.online.Security.userConsentBlockedForRiskyAppsExceptions`). Identify the application attempting access and user context.

  - **Correlate User Activity**: Determine if the user typically accesses applications that require similar permissions. Review user access patterns for anomalies or deviations from established norms.

  - **Check for Whitelisted Applications**: Verify if the application attempting access is on any approved or whitelisted applications list. Legitimate applications are usually documented and should not trigger consent block notification.

  - **Evaluate Security Risks**: Analyze the specific application trying to gain access for past incidents or vulnerabilities. Malicious indicators may include unauthorized or unknown applications without legitimate business purposes.

  - **Monitor for Repeated Attempts**: Identify if there are multiple consent request failures from the same application over a short timeframe, as this may indicate an automated attack attempt.

  ### Prioritization

  This alert is categorized as medium severity. The impact is dependent on whether sensitive user data or high-privilege accounts are implicated. While the likelihood of malicious abuse is moderate, applications exploiting the consent mechanism are often used in credential theft campaigns.

  ### Blind Spots and Assumptions

  Limitations of this detection include the potential for legitimate applications to trigger a consent block if they become misclassified as risky. Additionally, without comprehensive logging from all Azure services, some activity may not be captured. Finally, high-profile legitimate enterprise applications may sometimes be misclassified, necessitating close scrutiny of consent requests from trusted vendors or partners. A related detection to consider is monitoring application permission requests to see if previously blocked applications re-attempt access, enhancing visibility and response capabilities.

