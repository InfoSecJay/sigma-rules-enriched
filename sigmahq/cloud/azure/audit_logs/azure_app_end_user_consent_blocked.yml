note: |
  ### Technical Context
  This rule detects instances where an end user's consent for app access has been blocked due to identified risks associated with the application, specifically according to Azure's risk-based consent controls. The primary objective behind this behavior is to protect sensitive data and minimize the potential for unauthorized access to user credentials and sensitive organizational information. Such actions typically indicate an awareness of potential compromise or exploitation attempts by threat actors attempting to gain credential access or leverage risky applications for lateral movement within the environment.

  Relevant MITRE ATT&CK tactics include:
  - **Credential Access** (TA0006)
    - **Impair Defenses** (T1528): This activity may indicate that an attacker is leveraging risky applications to gain access to credentials or sensitive information by circumventing established security policies.

  The primary data sources for this detection are Azure audit logs, which will provide details on the permission requests and the reasons for any consent being denied.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Examine entries related to user consent and assess any patterns of refusal, particularly focusing on the `failure_status_reason` tied to `RiskyAppsExceptions`.
  - **Analyze User Activity**: Investigate user activity leading up to the consent blocking to identify whether there was any suspicious application activity or prior warning signs of potential account compromise.
  - **Correlate with Threat Intelligence**: Validate if the applications causing the consent blocks have known vulnerabilities or whether they have been flagged in threat intelligence feeds for risky behavior.
  - **Check for Misconfigurations**: Ensure that consent policies and risk settings in Azure are correctly configured and that legitimate applications are not being incorrectly flagged as risky.

  ### Prioritization
  This alert is of medium severity because while it indicates a protective measure against potentially hazardous applications, it can also signify targeted attempts by attackers to gain access to compromised credentials through means that have been flagged by Azure's security mechanisms.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage could arise from scenarios where consent is not logged or when applications operate within user-defined exceptions without triggering alerts. The detection logic assumes that the Azure audit logs are fully enabled and correctly capturing all consent requests and responses related to applications. Therefore, proper configuration and retention policies for these logs are essential to ensure the effectiveness of this alert.

