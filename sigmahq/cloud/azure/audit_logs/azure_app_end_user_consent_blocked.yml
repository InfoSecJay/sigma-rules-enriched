  ---

  ### Technical Context

  The detection rule identifies instances where user consent requests for applications are blocked due to risk-based assessments in an Azure environment. This behavior may indicate an attempt by an adversary to leverage an application that has been flagged as risky, potentially aiming to gain unauthorized access to sensitive resources or data. The relevant MITRE ATT&CK tactic is Credential Access, specifically Technique T1528: Misuse Elevation Control Mechanism.

  The primary telemetry source is Azure Audit Logs, specifically filtering for events related to user consent failures marked with the reason 'Microsoft.online.Security.userConsentBlockedForRiskyAppsExceptions'. A malicious activity impact includes unauthorized application access attempts that can lead to credential theft or data exfiltration. This detection does NOT independently confirm malicious intent; legitimate user actions or misconfigured security settings can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review Azure Audit Logs for Consent Block Events:** Look for entries in Audit Logs where `failure_status_reason` equals 'Microsoft.online.Security.userConsentBlockedForRiskyAppsExceptions'. Note timestamps and affected usernames.

  - **Cross-reference User Activity:** Investigate if the affected user has attempted to access a flagged application recently. Check for related Azure Active Directory sign-in logs (Event ID: 4624).

  - **Identify Known Risky Applications:** Research the application(s) for which consent was blocked. Use reputable sources or internal documentation to determine if the applications are legitimate or typically misused.

  - **Monitor Subsequent Activity:** Check if the user has made attempts to bypass consent after the alert was triggered. Look for repeated login attempts or use of alternative accounts in Azure AD logs.

  - **Establish Legitimacy of User Access Patterns:** Evaluate normal access patterns for the affected user, looking for discrepancies (e.g., unusual access times or locations) in Microsoft 365 Activity Logs.

  - **Correlate with Previous Alerts:** Investigate if similar consent blockage events have occurred previously or if this is part of an ongoing trend. Cross-reference security alerts indicating potential account compromise.

  ---

  ### Prioritization

  The alert severity is medium due to the potential for unauthorized access attempts to critical systems. The likelihood of malicious abuse is moderate, as adversaries often attempt to exploit applications with insufficient consent controls. This behavior can be relatively common but varies based on the enterprise's application landscape and Azure configuration.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of misconfigured applications leading to false positives, as legitimate consent requests may also be blocked. Required log sources must ensure proper logging configurations for Azure Audit Logs, as well as monitoring of Azure AD sign-in events for context. Legitimate activities that could trigger alerts include user access to new applications that have been assessed as risky based on organizational policies. A related detection to strengthen coverage would be tracking unusual authentication patterns or access attempts by users that could indicate compromised credentials.

