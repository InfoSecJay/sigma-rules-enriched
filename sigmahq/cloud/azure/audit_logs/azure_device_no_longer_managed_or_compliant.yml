  ### Technical Context

  This rule detects events when a device in Azure is reported as "no longer managed" or "no longer compliant." This behavior typically indicates a potential security gap, where an adversary could exploit unmanaged or non-compliant devices to gain unauthorized access or exfiltrate data. The relevant MITRE ATT&CK tactics and techniques are **TA0001: Initial Access** and **TA0005: Defense Evasion**.

  The primary telemetry sources for this detection are Azure Audit Logs, particularly focusing on logs categorized under device management activities. If this behavior is malicious, it can pose a significant security risk, as unmanaged devices may lack necessary security controls, providing an avenue for further compromise. Importantly, this detection does NOT confirm unauthorized access or exploitation but signifies a change in device status that may warrant further investigation.

  ### Investigation Steps

  - **Validate the device status change:** Review Azure Audit Logs for Event IDs related to device management, specifically filtering for operations named "Device no longer compliant" or "Device no longer managed." Check for accompanying timestamps and the identities of the users who initiated these changes.

  - **Check for administrative actions:** Investigate if there were recent legitimate administrative actions that intentionally caused the device to change status. This may involve correlating activities from Azure Portal or PowerShell API executions within the timeframe of the alert.

  - **Identify affected devices:** Use Azure Portal to find the affected device(s). Review the device's compliance status, security configurations, and any known vulnerabilities that could expose it to risk.

  - **Review associated user access:** Examine user logins and access patterns using Azure Active Directory logs (Event IDs 4624, 4648 for Logon events). Determine if the device in question is associated with users who have administrative or sensitive access levels.

  - **Document expected enterprise behavior:** Identify what compliant devices look like in your organization. They should typically have regular check-ins with management tools and security assessments confirming their state.

  - **Look for signs of potential abuse:** Search for unusual access patterns or activity related to the affected device, such as failed login attempts (Event ID 4625) or unusual outbound traffic, which could indicate an attempt to exploit an unmanaged device.

  ### Prioritization

  This alert is assigned medium severity due to the potential impact of unmanaged devices on the security posture of the enterprise. Given that unmanaged devices can be exploited easily by adversaries, the likelihood of malicious abuse is heightened. Furthermore, this behavior is often seen as a precursor to more extensive attacks, like lateral movement or data exfiltration.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain Azure logging configurations, particularly if logging for compliance changes is not fully enabled. Legitimate activities, such as an administrator failing to review a device's compliance status, could trigger this alert without malicious intent. A related detection, such as monitoring for unusual logon activity from devices recently marked as non-compliant, can strengthen coverage and context for potential risks.

