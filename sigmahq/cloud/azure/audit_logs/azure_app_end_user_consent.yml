note: |
  ### Technical Context
  This rule detects instances where an end user consents to an application without administrative approval within Azure environments. The scenario typically involves users unintentionally granting access to potentially harmful or unauthorized applications, leading to possible data exposure or malicious activities. Attackers may exploit this oversight to infiltrate the environment, leveraging the application's permissions for lateral movement or data exfiltration.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and specifically the technique of **Application Layer Protocol** (T1528), which refers to attackers taking advantage of application permissions to access sensitive data or systems. The primary data source for this detection is Azure audit logs, which capture consent events related to applications and user activities.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Analyze the Azure audit logs for any instances where users have granted consent to applications. Focus on entries with `ConsentContext.IsAdminConsent: 'false'`, as these indicate non-admin consent, which is more concerning for security.

  - **Identify Authorized Applications**: Cross-reference the applications that received consent with your organization's list of authorized applications. This will help to quickly pinpoint any anomalies or unauthorized applications that may pose a risk.

  - **Assess User Roles and Permissions**: Evaluate the permissions assigned to the applications that were granted consent, particularly looking for elevated privileges that could lead to security breaches if misappropriated.

  - **Monitor for Unusual Behavior**: After identifying unauthorized consents, check for any unusual behavior associated with the applications or user accounts, such as unexpected logins, data access anomalies, or administrative actions taken by non-admin users.

  ### Prioritization
  The severity of this alert is considered low; however, it should not be ignored. While incidents of unauthorized user consent can lead to serious security implications, their occurrence is likely less frequent in a well-governed environment. Continuous monitoring and user education can reduce this risk.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the monitoring of local user activities outside the Azure environment, which may not be reflected in Azure audit logs. The detection logic assumes that users are cognizant of the implications of granting consent to applications, which may not always be the case. Additionally, for this alert to function properly, Azure audit logs must be configured and retained according to best practices to capture all consent events accurately.

