  ---

  ### Technical Context

  This Sigma rule detects events where an end user grants consent to an application, specifically when the consent is not performed by an administrator. The likely attacker objective behind such actions is to gain unauthorized access to sensitive data or services by leveraging user trust in various applications. This behavior falls under the MITRE ATT&CK tactic of Credential Access (T1484) and the technique “Application Permissions” (T1528).

  The primary telemetry source for this detection is Azure audit logs, which provide detailed records of user consent activities for applications. If malicious, this could lead to unauthorized data access or application misuse. Importantly, this detection does NOT confirm that the application is malicious on its own; legitimate applications may also require user consent.

  ---

  ### Investigation Steps

  - **Verify Event Details:** Review Azure Audit logs for "ConsentContext.IsAdminConsent: false" (Event ID related to user consent) and record the user and application name involved. Check for known benign applications commonly used in your environment.

  - **Assess Application Reputation:** Cross-reference the application name against a blacklist of known malicious applications or a whitelist of approved applications. Use threat intelligence sources and organizational policies to validate legitimacy.

  - **Identify User Context:** Determine the user roles and permissions involved in the consent event. If the consenting user is a non-privileged account, assess their typical access patterns and whether the consent grants unusual permissions.

  - **Review Permission Scope:** Examine the level of permissions granted to the application. Document whether permissions relate to sensitive data (e.g., access to mail, contacts, files). Elevated access could indicate potential exploitation avenues.

  - **Monitor for Subsequent Actions:** Investigate whether the application attempted additional actions after consent, such as data exfiltration or access to administrative functions, typically observable in follow-up logs.

  - **Document Legitimate Use Cases:** Confirm expected user behavior with the application. If users frequently consent to the application due to organizational protocols, document this to avoid unnecessary escalations in the future.

  ---

  ### Prioritization

  The alert is of low severity due to the common practices of user consent for applications, but could escalate based on the trusted relationship between users and applications. While individual user consents may not indicate immediate malicious intent, repeated instances or unusual permissions should be closely monitored for potential exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss scenarios where an application gains consent through phishing or social engineering, as these methods can bypass traditional monitoring. Reliable detection requires comprehensive logging from Azure, including audit logs for user consent actions. Legitimate user activities, such as authorized third-party app grants, may trigger the alert. A related detection for enhanced coverage could include monitoring for changes in user permissions or logins from unusual locations or devices.

