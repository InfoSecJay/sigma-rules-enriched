note: |
  ### Technical Context

  This rule detects unauthorized changes to conditional access policies in Azure AD, likely indicating an attempt to manipulate user access controls. The attacker objective may include enabling unauthorized access to sensitive resources or escalating privileges through misconfigured policies. This behavior aligns with the MITRE ATT&CK tactic **Privilege Escalation (T1068)** and technique **Exploitation of Vulnerability (T1548)**.

  Primary telemetry sources include Azure Audit Logs, specifically log types that track modifications to conditional access. If malicious, the impact could be significant, allowing an adversary to bypass security requirements for accessing critical systems. This detection does NOT confirm that a malicious actor successfully modified the access policy but indicates potential unauthorized changes that warrant further investigation.

  ### Investigation Steps

  - **Review Azure Audit Logs:** Check the log entry for `Add conditional access policy` in Azure logs (Event Category: AuditLogs) to identify the user and timestamp of the change.

  - **Verify User Identity:** Confirm whether the user who made the change is authorized to modify conditional access policies. Look for legitimate users typically involved in such changes (e.g., Admin role).

  - **Evaluate User Agent and Hostname:** Check the user agent and originating hostname from the log entries for any anomalies, such as unfamiliar devices or locations, which could indicate malicious intent.

  - **Identify Malicious Indicators:** Look for indications of account compromise, such as multiple failed login attempts or successful logins from unusual geographic locations prior to the policy change.

  - **Correlate with Current Policy State:** Compare the modified policy with existing conditional access configurations. Document expected operational changes versus unexpected adjustments that could signify an attack vector.

  - **Assess the Role Permissions:** Confirm whether there's been any misconfiguration or excessive granted permissions for the user. Investigate any recent changes or anomalies in role assignments related to security or administrative functions.

  ### Prioritization

  The severity of this alert is medium due to the potential for significant impact if unauthorized access to enterprise resources occurs. The likelihood of malicious abuse increases if the affected user accounts are associated with sensitive privileges or if there is a known history of previous compromises.

  ### Blind Spots and Assumptions

  Evasion techniques may include the use of legitimate administrative accounts to make unwanted changes, thereby masking malicious activities. Reliable detection requires continuous logging of Azure Audit Logs and appropriate permissions to monitor all user activities. Legitimate activities that might trigger this alert include scheduled updates or role changes for users. A related detection to consider is monitoring for unusual user logins or changes in user roles, which strengthens overall monitoring of administrative actions.

