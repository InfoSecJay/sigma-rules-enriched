note: |
  ### Technical Context

  This rule detects the addition of conditional access policies in an Azure environment by non-approved actors. The likely attacker objective is to manipulate access controls to gain unauthorized privileges or access to sensitive resources. The detection is relevant to the MITRE ATT&CK tactic of **Privilege Escalation** (TA0004) and the technique **Prejudice Estimate Adjustments** (T1548). The primary telemetry source for this detection is Azure Audit Logs, specifically focusing on events related to changes in conditional access policies. If malicious, the potential security impact includes unauthorized access to resources and data breaches. Importantly, this detection does NOT confirm malicious intent solely based on policy changes; additional context is needed for a conclusive judgment.

  ### Investigation Steps

  - **Verify event details: ** Review the Azure Audit Logs (Event ID: Activity Log) for entries that include "Add conditional access policy." Check the timestamp, user identity, and source IP address for any anomalies against known legitimate activities.

  - **Evaluate user permissions:** Check if the actor performing the policy addition has the necessary permissions to make such changes. Review role assignments in Azure Active Directory (AAD) to identify any inappropriate elevation of privileges.

  - **Examine user identity:** Investigate the user identity involved in the change (e.g., user agent, hostname) to determine if it matches expected behavior. Legitimate changes often originate from well-known administrative accounts or service accounts designated for such tasks.

  - **Identify malicious indicators:** Look for correlated activities such as the creation of multiple conditional access policies within a short timeframe. Anomalies in these patterns are strong indicators of potential compromise.

  - **Assess environmental context:** Determine if the account has been involved in prior suspicious activities, such as failed login attempts or unusual geographic access patterns noted in Identity Protection alerts.

  - **Review alerting history:** Check previous alerts related to configuration changes to identify recurring patterns or repeated behaviors from the same actor, which may signify an ongoing compromise or improper configurations.

  ### Prioritization

  The alert severity is medium due to the potential impact on access control in the enterprise environment. Given that conditional access policies are critical for securing resources, unauthorized changes can lead to significant risks. The likelihood of malicious abuse is moderate, especially if the entity making the changes lacks proper approval.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in role permissions that can trigger false positives, particularly in organizations with complex permission structures. Logging configurations must ensure that all relevant Azure activity logs are retained and monitored optimally, as incomplete logging may hide unauthorized changes. Legitimate changes can occur during maintenance windows or policy reviews, which may trigger this alert. Additionally, companion detections such as monitoring for suspicious logins (e.g., atypical user behavior) can bolster overall security posture against such threats.

