note: |
  ### Technical Context
  This detection rule monitors and alerts on changes to conditional access policies within an Azure environment, specifically looking for actions that involve adding such policies. This type of change often indicates attempts to manipulate access control measures, potentially by unauthorized users or malicious actors. The primary objective in this context is to impose specific security measures that affect user authentication and access controls, thereby increasing their ability to conduct further attacks.

  The relevant MITRE ATT&CK tactics for this rule include **Privilege Escalation** (TA0004) as altering conditional access policies directly influences user permissions and access rights. Additionally, it may fall under **Defense Evasion** (TA0005), as attackers may attempt to configure access policies to obscure their activities from detection. The specific technique indicated here is **T1548 - Abuse Elevation Control Mechanism**, highlighting issues with user permissions when making configuration changes.

  The best sources of telemetry for this detection include Azure audit logs, which record activities and modifications made to access policies, capturing the necessary information about who made changes, what was altered, and when the actions occurred.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Gather and analyze recent Azure audit logs to identify the timestamp and details of the user making the changes to the conditional access policies. Look for anomalies in user identity or agent.
  - **Check User Permissions**: Investigate the permissions of the user who made the change to ensure they align with their role within the organization. Verify whether the user has legitimate authority to modify access controls.
  - **Analyze Related User Activity**: Examine other actions taken by the user in a timeframe surrounding the policy change to identify any other suspicious activities, such as accesses that could indicate privilege escalation attempts.
  - **Evaluate Conditional Access Impact**: Assess the immediate effects of the newly added conditional access policies to determine if they pose a risk or vulnerability that could be exploited by an unauthorized actor.

  ### Prioritization
  This alert has a medium severity as unauthorized changes to conditional access policies can significantly impact overall security posture, facilitating later stages of an attack or insider threats by manipulating user access.

  ### Blind Spots and Assumptions
  One potential blind spot within this detection is the possibility of legitimate users having misconfigured role permissions that result in benign changes being flagged by the rule. Additionally, the detection logic assumes that all changes to conditional access policies will be logged accurately in Azure audit logs. If audit logging is not configured correctly or if logs are not retained, the rule may fail to trigger or yield incomplete data necessary for a thorough investigation. Thus, it is essential to ensure Azure audit logging is properly set up and that logs are retained according to organizational policy.

