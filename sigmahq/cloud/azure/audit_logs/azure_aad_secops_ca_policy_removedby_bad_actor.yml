note: |
  ### Technical Context

  This rule detects the unauthorized deletion of conditional access policies within Azure, indicating a potential privilege escalation or insider threat behavior. The likely objective of an attacker could be to modify security controls to allow themselves or other malicious entities unauthorized access to sensitive systems or data. This behavior aligns with the MITRE ATT&CK technique for Abuse Elevation Control Mechanism (T1548) and Credential Dumping (T1556). The primary telemetry sources include Azure audit logs, specifically looking for events related to policy deletions.

  If an alert is triggered, the potential security impact is significant, as it may facilitate unauthorized access, thereby compromising the integrity and confidentiality of enterprise resources. However, this detection alone does not confirm malicious intent; it may result from misconfigurations or legitimate administrative actions.

  ### Investigation Steps

  - **Verify the user action source:** Review Azure audit logs for Event IDs that relate to user actions, specifically targeting the log name “AuditLogs” and the field `properties.message` for entries containing "Delete conditional access policy." Ensure that the user identity aligns with approved roles for policy management.

  - **Check user permissions and roles:** Inspect the Azure Active Directory roles assigned to the user initiating the deletion. Any modifications or unexpected elevated privileges should be flagged, as legitimate administrators typically possess a role like “Global Administrator” or “Conditional Access Administrator.”

  - **Assess the timeframe of the deletion:** Cross-reference the deletion event timestamp with other telemetry from Microsoft 365 or relevant security tools for unusual spikes in activity that might indicate controlled chaos or other attack vectors, such as lateral movement.

  - **Identify recent conditional access policies managed by the user:** Look for details in the audit logs about recent changes or deletions to conditional access policies by this user. Notably, if a pattern of approval and deletion exists, it may indicate either an insider action or a compromised account versus expected administrative maintenance.

  - **Review for related suspicious activity:** Examine user login activities, focusing on any anomalous geolocations or devices accessing the Azure admin portal around the time of the policy removal, using Azure AD sign-in logs (Event ID 4624).

  ### Prioritization

  This alert carries medium severity due to the potential for serious security impact from unauthorized access changes. The likelihood of malicious abuse is heightened, particularly if the affected user lacks appropriate permissions. This behavior is often weaponized in targeted attacks against enterprises with insufficient conditional access policies in place.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited due to misconfigurations in Azure role assignments or unique business needs leading to legitimate activity that could trigger this alert. A companion detection to enhance coverage includes monitoring for unusual authentication patterns or login attempts around the same time the policy deletions occur, as they may provide additional context to potential compromises.

