note: |
  ### Technical Context

  This rule detects the deletion of a Conditional Access (CA) policy by an unauthorized actor in an Azure environment. The likely attacker objective is to bypass security controls, gaining unauthorized access to sensitive resources by altering or removing access restrictions. This activity aligns with the Microsoft MITRE ATT&CK technique for Privilege Escalation (T1548) and Defense Evasion (T1556). The primary telemetry source is Azure Audit Logs, specifically monitoring entries where CA policies are modified. The security impact of this detection is high, as it may lead to unauthorized access to applications and sensitive data. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is required to assess the legitimacy of the user making the changes.

  ### Investigation Steps

  - **Review audit logs for user identity:** Check Azure audit logs for the `Delete conditional access policy` event to identify the user ID and IP address associated with the deletion (Log Type: Azure Audit Logs, Event Names: conditionalAccessPolicyDeleted). Contextualize whether this user should have made this change based on their role.

  - **Inspect previous policy states:** Query the state of the conditional access policies before deletion to assess their purpose and impact. Evaluate if the modification aligns with normal operational procedures (Log Type: Azure Audit Logs, relevant properties to examine).

  - **Check user permissions and roles:** Validate the permissions of the user who deleted the policy by reviewing their assigned roles in Azure AD. Look for any roles they should not possess that could indicate privilege abuse (Log Type: Azure AD Role Assignments).

  - **Identify the source of user actions:** Review the user agent and hostname associated with the deletion event. Confirm if these match expected patterns for users with similar roles to identify potential anomalies (Log Type: Azure Audit Logs, Fields: `userAgent`, `hostname`).

  - **Recognize legitimate changes:** Document expected or common behavior associated with conditional access changes from appropriate roles, such as scheduled updates by the Security Operations team versus unexpected deletions by non-administrator accounts.

  - **Search for related malicious indicators:** Check for additional logs indicating unauthorized access attempts or policy changes within a short timeframe before and after the deletion event (e.g., sign-ins, suspicious user actions within Azure logs).

  ### Prioritization

  The alert has medium severity due to the potential for significant security impact when a Conditional Access policy is removed improperly. The malicious use likelihood is moderate, as unauthorized removal of access controls is a common tactic employed by adversaries to facilitate lateral movement and data exfiltration. This behavior is often weaponized during targeted attacks against organizations.

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate administrative actions could trigger the alert, especially if role permissions are misconfigured. Adequate logging configurations are required to capture all relevant activity in Azure Audit Logs. Additionally, similar actions may occur during legitimate security assessments or audits by approved personnel. A companion detection using alerts for unusual sign-in patterns or anomalies in user behavior related to the same Azure resources would strengthen overall security posture.

