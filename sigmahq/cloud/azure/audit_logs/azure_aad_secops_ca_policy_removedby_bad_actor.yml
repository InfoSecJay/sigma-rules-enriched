  ### Technical Context

  This Sigma rule detects the deletion of a Conditional Access (CA) policy by a non-approved actor within Microsoft Azure. The behavior indicates an attempt to weaken security posture by removing access controls, which can be a precursor to unauthorized access or lateral movement within the network. The likely attacker objective is to either enable easier access for themselves or to facilitate a broader attack campaign without being hindered by existing security measures.

  This activity aligns with the MITRE ATT&CK tactic of **Privilege Escalation** (TA0004) and the technique **Impair Defenses** (T1556). The primary telemetry source is Azure Audit Logs, recording events related to changes in Conditional Access policies. If malicious, this action could compromise the security of the entire Azure environment by allowing unauthorized users access to sensitive resources. However, this detection alone does not confirm malicious intent, as it may also result from misconfigured permissions or legitimate administrative activity.

  ---

  ### Investigation Steps

  - **Validate user identity and permissions:** Check the Azure Audit Logs for Event Type "Delete Conditional Access Policy" to confirm if the actor had appropriate permissions. Legitimate users with appropriate roles, such as IT administrators, typically initiate such actions.

  - **Identify the time of deletion:** Review the timestamp of the deletion event against other logs (e.g., Azure AD sign-ins) to see if there were any concurrent suspicious sign-ins or activities from unusual locations or user agents.

  - **Inspect recent policy changes:** Analyze the Audit logs for prior Conditional Access policy modifications to determine if the deletion was part of a sequence of suspicious changes. Look for multiple "Create" or "Modify" events preceding the delete event.

  - **Check for malicious indicators:** Look for high-confidence indicators of compromise, such as IP addresses or user agents that have been flagged in previous incidents. Use the User Principal Name (UPN) in Azure logs to cross-reference known malicious actors.

  - **Analyze related role assignments:** Investigate if any role assignments or permissions were altered just before the deletion. Audit any relevant "Add role" or "Remove role" events to see if they correlate with unauthorized changes.

  - **Review related security alerts:** Cross-reference with any existing alerts regarding potential privilege escalation or anomalous user behavior to enhance the context of this incident. Look for similar detections in the same timeframe.

  ---

  ### Prioritization

  This alert is of medium severity since it can significantly impact the security posture by potentially enabling unauthorized access if the change was malicious. However, the likelihood of abuse depends on the actor's permissions and the associated context of the situation. Given that such actions can be weaponized by skilled attackers, a swift and thorough investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include impersonating legitimate user accounts to execute such deletions, making it critical to ensure robust identity management practices are in place. Reliably detecting such changes requires appropriately logging all relevant Azure activities and maintaining consistent access control frameworks. Legitimate scenarios that might trigger this alert include general administrative housekeeping by security teams. A related detection might include monitoring for suspicious role assignments within Azure, further strengthening coverage against privilege escalation and unauthorized configuration changes.

