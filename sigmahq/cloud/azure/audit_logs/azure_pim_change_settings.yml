note: |
  ### Technical Context

  The rule detects changes to Privileged Identity Management (PIM) roles in Azure Active Directory. This behavior typically indicates attempts by an attacker to escalate privileges or establish persistence within the environment by modifying role assignments or settings. The relevant MITRE ATT&CK tactic for this detection is "Privilege Escalation," specifically technique "T1078.004: Valid Accounts - Privileged Account." Primary telemetry sources include Azure audit logs, particularly events associated with PIM. If malicious, these changes could grant unauthorized access to critical resources and data. Importantly, this detection does NOT prove malicious intent without further context, as legitimate administrative changes may also trigger this alert.

  ### Investigation Steps

  - **Verify recent PIM changes:**
    Check Azure audit logs for Event IDs related to PIM changes (e.g., `Update role setting in PIM`) to identify the user and time of the change. Analyze the `initiated by` field for unusual accounts or service principals.

  - **Correlate with user activity:**
    Review user sign-in logs (Azure AD Sign-ins) to assess recent activity of the account that made the PIM change. Look for anomalies, such as logins from suspicious locations or atypical hours.

  - **Identify elevated privileges granted:**
    Examine the specific roles affected by the PIM changes. Use logs to determine if sensitive roles (like Global Administrator or Security Administrator) were assigned inappropriately.

  - **Assess legitimate changes:**
    Identify and document recent legitimate administrative activities in the environment related to PIM changes. Compare expected administrative operations against the anomalies observed.

  - **Monitor for subsequent activities:**
    Track changes in user assignments following the PIM modification through Azure audit logs. Look for actions that indicate privilege escalation like new role assignments or the creation of accounts with elevated privileges.

  ### Prioritization

  This alert is of high severity due to the potential impact on privileged access management within the environment. The likelihood of malicious exploitation is significant, as changes to PIM roles are frequently targeted in attacks to gain elevated access, representing a common and effective weaponization tactic.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations, which could omit critical events if not accurately set. Legitimate administrative activities (such as routine updates or role changes) can also trigger the alert, complicating context interpretation. Companion detections, such as monitoring for unusual service principal activities or sign-ins, can strengthen overall coverage for authentication and privilege abuse.

