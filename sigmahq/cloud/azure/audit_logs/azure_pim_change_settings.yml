  ---

  ### Technical Context

  This rule detects changes made to Privileged Identity Management (PIM) roles in Azure Active Directory, specifically when the message "Update role setting in PIM" is logged. The likely attacker objective is to escalate privileges, maintain persistence, or evade detection by modifying access roles to sensitive systems or data. The relevant MITRE ATT&CK tactics include Initial Access, Defense Evasion, Privilege Escalation, and Persistence (T1078.004).

  The primary telemetry source comes from Azure audit logs, capturing activity related to role assignments and modifications. If malicious, such changes could allow unauthorized users to gain elevated access, compromising system integrity and data security. It’s important to note that detecting role changes does NOT confirm that the changes were unauthorized or malicious on their own; they may also reflect legitimate administrative activities.

  ---

  ### Investigation Steps

  - **Review audit logs for PIM role modifications:** Examine Azure Audit Logs for Event Types indicating "Update role setting in PIM" (log type: auditLogs). Note who initiated the change and what roles were affected. Compare against known and approved administrative user activity.

  - **Identify recent administrative change patterns:** Look for patterns of PIM role modifications within the last 30 days, including the user IDs associated with these changes. Legitimate activity typically shows modification by designated administrators within expected timeframes.

  - **Cross-reference user roles with identity management policy:** Check against current identity management policies to validate that changes align with organizational roles and responsibilities. Any discrepancies may indicate insider threats or misuse of credentials.

  - **Correlate with user authentication logs:** Pull Azure Sign-In logs (log type: signIns) for the user(s) involved in the changes. Look for anomalous login times, IP addresses, or locations that deviate from normal behavior, indicating possible credential compromise.

  - **Track potential follow-up actions:** After detecting role alterations, look for subsequent operations that leverage enhanced privileges, such as access attempts to sensitive resources or creation of new administrative users, using Activity Logs for abnormal behavior.

  ---

  ### Prioritization

  The high severity of this alert is based on the system's critical nature involving user access and permissions management. The likelihood of such role changes being abused for escalating privileges or unauthorized access is significant, especially since PIM settings commonly store sensitive, elevated access to resources.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using legitimate administrative accounts or services to carry out role changes without detection. Reliable detection requires comprehensive logging configurations in Azure, including audit and sign-in logs. Legitimate administrative tasks, such as scheduled PIM updates or policy reviews, may trigger these alerts. A related detection that strengthens coverage is monitoring for unusual access operations following role changes, helping identify exploitation attempts immediately after privilege elevation.

