note: |
  ### Technical Context

  This rule detects when Privileged Identity Management (PIM) elevation requests are either approved or denied within Azure Active Directory. An attacker may exploit PIM to gain elevated privileges, allowing them to perform administrative actions covertly, often setting the stage for further destructive actions such as lateral movement or data exfiltration. This behavior aligns with the MITRE ATT&CK framework, specifically under the "Privilege Escalation" tactic, technique T1078.004 (Delegation).

  The primary telemetry source is Azure audit logs, specifically those that capture events related to PIM. If these elevation requests are determined to be unauthorized, the security impact could be significant, leading to potential system compromise and unauthorized access to sensitive data or configurations. However, this detection alone does not confirm whether the elevation was successfully leveraged for malicious purposes; it only indicates that an elevation request was processed.

  ---

  ### Investigation Steps

  - **Identify the requester details:** Review Azure audit logs (Event Type: "Request Approved" or "Request Denied"). Check fields such as "initiatedBy" to identify the user requesting the elevation and cross-reference with known authorized users.

  - **Compare against baseline behaviors:** Identify legitimate usage patterns for PIM requests in your organization, focusing on the frequency and timing of such requests. Legitimate users typically submit requests outside non-business hours sparingly, unlike the patterns that might arise from compromised accounts.

  - **Assess user role and activity:** Examine the roles assigned to the user making the request. Use Azure AD Graph API to query the user’s roles and identify if they were recently modified or inappropriate for their job function, indicating potential abuse.

  - **Verify request origin:** Investigate the source IP and geographical location associated with the PIM request in the audit log, noting any anomalies. Requests appearing from unexpected geolocations or known risk regions should raise further scrutiny.

  - **Confirm multi-factor authentication (MFA) status:** Check if MFA was enforced for the user during the request process. Any elevation requests bypassing MFA requirements may indicate malicious intent.

  - **Track subsequent actions post-elevation:** Review audit logs for subsequent administrative actions taken by the elevated user. This may indicate if the elevation was used maliciously, such as unauthorized changes to configurations or user permissions.

  ---

  ### Prioritization

  This alert is of high severity due to the elevated privileges involved and the potential for significant impact if a malicious actor successfully exploits this access. Privileged Identity Management is a critical control, and abnormal activity surrounding it should be prioritized for investigation as it can lead to widespread access to sensitive resources.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques such as misuse of legitimate accounts authorized for PIM requests, which can mask malicious activities. Reliable detection requires properly configured Azure audit logging and continuous monitoring of privileged role requests. Legitimate administrative activities may trigger the alert, particularly during periods of user onboarding or system updates. To strengthen coverage, companion detections related to unusual changes in user roles or configurations in Azure should be implemented.

