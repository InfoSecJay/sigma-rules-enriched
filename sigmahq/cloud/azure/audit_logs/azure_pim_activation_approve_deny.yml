note: |
  ### Technical Context

  The Sigma rule detects when a request for role elevation through Azure's Privileged Identity Management (PIM) is either approved or denied. This behavior can indicate potential unauthorized attempts to escalate privileges, as adversaries may target privileged accounts to gain broader access to systems or sensitive data. This alert aligns with the MITRE ATT&CK framework, specifically the tactics of **Persistence** and **Privilege Escalation** (T1078.004).

  Primary telemetry sources include Azure Activity Logs and audit logs, capturing events related to PIM activities. A malicious outcome could lead to the attacker gaining elevated privileges, allowing them to perform unauthorized actions within the environment. However, the alert alone does not confirm malicious intent; legitimate administrative actions by authorized personnel may also trigger this rule.

  ### Investigation Steps

  - **Review the PIM approval/denial logs:** Examine Azure AD audit logs (Event IDs associated with PIM) for the specific action timestamps. Look at properties such as `initiatedBy`, `operationName`, and `resultStatus`. Ensure that the request aligns with known administrative schedules.

  - **Assess user roles and permissions:** Check the relevant user accounts involved in the request. Validate whether the requesting user has a legitimate reason for role elevation or if they are unauthorized. Review the account’s recent activities for any suspicious behavior.

  - **Identify common timing patterns:** Compare the event timestamps against historical patterns of approved/denied requests. Investigate if the timing corresponds with known operational times for legitimate activities in your organization.

  - **Correlate related Azure AD logs:** Look at Azure AD sign-ins and audit logs for specific patterns of malicious activity, such as unusual sign-in locations or behavior (Event IDs like 4624 for logon events). This may indicate if the account in question has been compromised.

  - **Verify any associated assets or systems:** Cross-reference the affected users' activities against critical assets (e.g., systems handling sensitive data or administrative tools) to determine the potential impact on the enterprise.

  ### Prioritization

  This alert is considered high severity due to the potential risk to critical systems and sensitive data management. The perceived intent to elevate privileges can be indicative of malicious behavior, especially if originating from accounts with a history of non-standard activity. Given the importance of privileged accounts, such actions are commonly weaponized by adversaries seeking persistent access.

  ### Blind Spots and Assumptions

  This detection may miss legitimate PIM usage by actual administrators, leading to false positives if not properly contextualized. Additionally, if Azure logs are not properly configured or monitored, critical events may be overlooked. Adversaries may also employ evasion tactics, such as timing their elevation requests during known maintenance windows. A related detection, monitoring for multiple failed PIM requests followed by an approved request (indicating possible credential stuffing), would enhance coverage and provide further context for investigations.

