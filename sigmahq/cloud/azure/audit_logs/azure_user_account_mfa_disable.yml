title: Multi Factor Authentication Disabled For User Account
id: b18454c8-0be3-41f7-86bc-9c614611b839
status: test
description: |
  Detects changes to the "StrongAuthenticationRequirement" value, where the state is set to "0" or "Disabled".
  Threat actors were seen disabling multi factor authentication for users in order to maintain or achieve access to the account. Also see in SIM Swap attacks.
references:
- https://www.sans.org/blog/defending-against-scattered-spider-and-the-com-with-cybercrime-intelligence/
author: Harjot Singh (@cyb3rjy0t)
date: 2024-08-21
tags:
- attack.credential-access
- attack.persistence
logsource:
  product: azure
  service: auditlogs
  definition: 'Requirements: The TargetResources array needs to be mapped accurately
    in order for this rule to work'
detection:
  selection:
    LoggedByService: 'Core Directory'
    Category: 'UserManagement'
    OperationName: 'Update user'
    TargetResources.ModifiedProperties.DisplayName: 'StrongAuthenticationRequirement'
    TargetResources.ModifiedProperties.NewValue|contains: "State\":0"
  condition: selection
falsepositives:
- Legitimate authorized activity.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where the "StrongAuthenticationRequirement" for user accounts is set to "0" or "Disabled," indicating that multi-factor authentication (MFA) has been disabled. Attackers disable MFA to simplify unauthorized access to user accounts, facilitating credential theft and account takeover. The detection aligns with MITRE ATT&CK techniques such as "Account Manipulation" (T1098) and "Credential Dumping" (T1003).

  The primary telemetry source is Azure Audit Logs, focusing on entries related to user management operations, specifically "Update user" actions. If these actions are malicious, they can lead to account compromise and persistent unauthorized access. It is crucial to note that this detection alone does not confirm malicious intent; legitimate administrative changes can also result in MFA being disabled.

  ### Investigation Steps

  - **Review Azure Audit Logs for the alert event:** Check Audit Logs (Event ID specific to Azure) around the timestamp of detection. Look for the "Update user" operation specifically for the affected account.

  - **Examine Modified Properties:** Confirm that the affected account has "StrongAuthenticationRequirement" set to "0". If this was legitimate, there should be a correlating request with proper administrative context.

  - **Identify Recent Account Activity:** Investigate if there are any recent logins or suspicious activities (e.g., Event ID 4624 in Windows Security Logs) associated with the user account post-modification. Focus on new IP addresses or unusual access times.

  - **Cross-Check User Role and Permissions:** Validate if the user account has administrative privileges, which may justify changes. If role does not align with expected behavior, it may warrant further scrutiny.

  - **Correlate with SIM Swap or Phishing Incidents:** Investigate any reports or incidents regarding SIM swap attacks or phishing that could indicate a broader campaign targeting user accounts.

  - **Monitor for immediate subsequent logins:** If a logon event occurs shortly after MFA is disabled, such as Event ID 4624, highlight the need for urgent containment actions.

  ### Prioritization

  The alert is considered medium severity due to the critical impact of disabling MFA, especially on high-privileged user accounts. The likelihood of malicious exploitation is significant, given the common approach of attackers to weaken security controls before attempting account takeovers. Disabling MFA is a known tactic in numerous attacks.

  ### Blind Spots and Assumptions

  While this rule is effective at detecting unauthorized changes, legitimate administrative actions can trigger false positives. Reliable detection requires properly configured Azure logs that include accurate mapping of "TargetResources". Legitimate scenarios such as an administrative reset or configuration changes may also result in the same alert being generated. A related detection to monitor would include failed login attempts (T1078) or unusual account creation events to further build contextual understanding in the event of an attack.

