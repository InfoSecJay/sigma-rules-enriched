title: Multi Factor Authentication Disabled For User Account
id: b18454c8-0be3-41f7-86bc-9c614611b839
status: test
description: |
  Detects changes to the "StrongAuthenticationRequirement" value, where the state is set to "0" or "Disabled".
  Threat actors were seen disabling multi factor authentication for users in order to maintain or achieve access to the account. Also see in SIM Swap attacks.
references:
- https://www.sans.org/blog/defending-against-scattered-spider-and-the-com-with-cybercrime-intelligence/
author: Harjot Singh (@cyb3rjy0t)
date: 2024-08-21
tags:
- attack.credential-access
- attack.persistence
logsource:
  product: azure
  service: auditlogs
  definition: 'Requirements: The TargetResources array needs to be mapped accurately
    in order for this rule to work'
detection:
  selection:
    LoggedByService: 'Core Directory'
    Category: 'UserManagement'
    OperationName: 'Update user'
    TargetResources.ModifiedProperties.DisplayName: 'StrongAuthenticationRequirement'
    TargetResources.ModifiedProperties.NewValue|contains: "State\":0"
  condition: selection
falsepositives:
- Legitimate authorized activity.
level: medium
note: |
  ### Technical Context
  This rule detects changes to the Multi-Factor Authentication (MFA) settings for user accounts within Azure Active Directory. Specifically, it identifies alterations where the "StrongAuthenticationRequirement" is set to "0" or marked as "Disabled." The detection is crucial because threat actors often disable MFA as a tactic to facilitate unauthorized access to accounts—this can include techniques such as SIM swap attacks where attackers gain control over user accounts to bypass security measures.

  The related MITRE ATT&CK tactics include **Credential Access (TA0006)** and **Persistence (TA0003)**, with relevant techniques such as **Account Manipulation (T1098)** and **Application Layer Protocol (T1071)** potentially involved. The primary data source to gather evidence in this scenario is Azure audit logs, specifically focused on user management operations that capture any alterations to security configurations.

  ### Investigation Steps
  - **Review Azure Audit Logs:** Collect and analyze Azure audit logs for entries related to user management, specifically looking for updates to the "StrongAuthenticationRequirement" property that indicate disabling of MFA.
  - **Identify Potential Threat Actors:** Cross-reference the detected changes with the user accounts to determine if the changes correspond with any known threat actor behavior or timeline of suspicious activities.
  - **Analyze User Account Activity:** Investigate the activities of the affected user account preceding and following the MFA change, focusing on logins, access patterns, and unusual access from unfamiliar IP addresses.
  - **Check for Related Alerts:** Search for additional alerts that might indicate the use of compromised credentials or suspicious activities associated with accounts around the timeframe of the MFA changes.

  ### Prioritization
  The alert is categorized with a medium severity level due to the potential high impact of disabling MFA—this action significantly decreases the security posture of user accounts, increasing the likelihood of unauthorized access and data breaches.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if legitimate changes to MFA settings are made by authorized personnel, which could create false positives. The effectiveness of this detection relies on accurate logging of changes in user management settings within Azure Active Directory. Assumptions include that changes are made through standard Azure interfaces and that logged data is complete and unaltered. Establishing appropriate logging configurations and access controls is essential for this alert to function correctly.

