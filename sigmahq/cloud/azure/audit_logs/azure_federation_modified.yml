note: |
  ### Technical Context

  This Sigma rule detects modifications to federation settings within an Azure Active Directory environment, specifically when either a user or application changes these settings. The likely attacker objective is to establish persistence or elevate privileges by altering federated authentication mechanisms, which could facilitate unauthorized access to corporate resources. This behavior aligns with the MITRE ATT&CK techniques for Initial Access (T1078) and Persistence (T1136).

  Primary telemetry sources include Azure Audit Logs, specifically focusing on the `ActivityDisplayName` field for "Set federation settings on domain." If malicious, altering federation settings could undermine security controls, potentially enabling attackers to impersonate legitimate users. However, this alert does NOT inherently confirm malicious intent or actions, as legitimate administrative operations can also trigger it.

  ### Investigation Steps

  - **Verify user identity and agent:** Check the user identity and user agent associated with the activity. Review Azure Audit Logs (log type: auditlogs) and confirm that the user has appropriate administrative roles. Unknown users or unusual user agents should raise suspicions.

  - **Cross-reference hostname:** Investigate the hostname from which the changes were made using Azure logs. Document whether legitimate administrative users typically make changes from that location; if not, assess for potential compromise.

  - **Examine timestamps and frequency:** Review the timestamps of the changes. Look for unusual activity patterns, such as rapid multiple modifications occurring in a short period, which could indicate an attacker's attempts to manipulate settings.

  - **Evaluate existing federation configurations:** Assess current federation settings against expected configurations. Changes to critical settings, such as domain claims or relying parties, could indicate malicious intent, especially if the alteration deviates from standard procedures.

  - **Document legitimate change requests:** Identify any expected or approved modifications to federation settings based on recent change requests or ticketing system entries. If changes do not correspond with documented workflows, flag them for further investigation.

  ### Prioritization

  This alert is of medium severity, primarily due to the potential impact of affected systems, particularly those that handle federated identities. Given the complexity of Azure environments, the likelihood of malicious exploitation is moderate; attackers often target authentication mechanisms to gain footholds. This behavior is commonly weaponized in advanced attacks.

  ### Blind Spots and Assumptions

  Threat actors may employ evasion techniques, such as using legitimate administrative accounts or changing federation settings in a manner that mimics authorized activities. Reliable detection necessitates comprehensive logging configurations, particularly for Azure environment changes. Additionally, actions by system administrators can trigger this alert; thus, it is crucial to understand legitimate user behavior. Companion detections could include monitoring for anomalous authentication attempts or failed login events (e.g., Azure sign-in logs), which may indicate attempts to exploit modified federation settings.

