note: |
  ### Technical Context

  This rule detects modifications to federation settings in Azure AD, which can indicate unauthorized changes that may affect how identities are authenticated across services. The likely objective of an attacker could be to achieve persistence or elevate privileges by compromising federation configurations to redirect or manipulate authentication flows. This behavior aligns with the MITRE ATT&CK tactics of **Persistence (T1078)** and **Defense Evasion**, as modifying these settings can help bypass traditional access controls.

  The primary telemetry source is Azure audit logs, specifically focusing on the event where the activity display name is "Set federation settings on domain." If malicious, changes to federation settings can lead to unauthorized access or denial of service for legitimate users. It is important to note that this detection does not confirm malicious intent or compromise, as legitimate system administrators may make similar changes.

  ---

  ### Investigation Steps

  - **Check Azure Audit Logs for Federation Changes:** Review Azure audit logs for Event IDs related to federation settings, filtering for ActivityDisplayName: "Set federation settings on domain." Focus on the timestamp of the alert to narrow the search.

  - **Identify the User Performing the Action:** Determine the identity of the user who made the modification, checking for any irregularities in user agent or hostname. Legitimate adjustments are typically made by known IT staff or administrators.

  - **Validate Recent Activity for the User Account:** Investigate recent login actions of the user account found in the previous step, accessing Sign-ins logs (Audit Logs) to see if there are any unusual sign-in patterns or locations before and after the modification.

  - **Review Documentation of Change Requests:** Look for any internal documentation or ticketing system entries that could explain the modification. This may help identify if the action aligns with known administrative tasks versus potentially malicious changes.

  - **Examine for Lateral Movement Indicators:** Search for additional suspicious activities or indicators of lateral movement correlating with the modification time, such as newly created accounts or privileges escalated at the time (Security Event ID 4672).

  - **Compare with Known Behavior:** If the modification is attributed to a legitimate user context, compare against historical data of federation changes to see whether they conform to expected operational patterns.

  ---

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on identity and access management systems. Modifications to federation settings can be exploited by attackers to gain unauthorized access, but they can also result from legitimate administrative tasks, necessitating careful investigation. This behavior is not commonly weaponized unless combined with other tactics or techniques.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the required configuration of logging in Azure AD, as misconfigurations can lead to missed alerts. Additionally, legitimate administrative changes can trigger the alert, especially if made by system administrators. A companion detection to consider is monitoring changes to user roles or privileges in Azure AD that can indicate potential malicious intent or follow-up actions on compromised accounts.

