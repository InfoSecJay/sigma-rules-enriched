note: |
  ### Technical Context
  This rule detects modifications to federation settings in Azure Active Directory (AAD), specifically when a user or application changes these critical configurations. The ability to manipulate federation settings can enable unauthorized access and elevate privileges within the organization, making it a prime target for threat actors aiming to compromise user accounts or establish persistent access. Attackers may target federation settings as part of their strategy to maintain access to an environment or regain control after a breach.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**: Gaining unauthorized access to the network.
  - **Privilege Escalation (TA0004)**: Manipulating federation settings can lead to escalation of privileges through misconfigured authentication methods.
  - **Persistence (TA0003)**: Maintaining their foothold within the environment by adjusting federation configurations.
  - **Defense Evasion (TA0005)**: Altering settings without detection to evade security mechanisms.

  The primary data source for this detection is the Azure audit logs, which document changes to federation settings and serve as the primary evidence of potential malicious activity related to these configurations.

  ### Investigation Steps
  - **Review Audit Logs**: Examine Azure audit logs for the specific entries related to changes in federation settings, focusing on the timestamps and user identifiers involved in these modifications.
  - **Verify User Context**: Validate the identity of the user or application making the changes. Check if they have the necessary permissions and if their activity patterns align with expected behavior.
  - **Investigate User Agent and Hostname**: Analyze the user agent and hostname involved in the modification to ascertain if they match known administrative accounts or if they appear suspicious.
  - **Check for Prior Incidents**: Look for any previous alerts or indications of compromise regarding the user or application making the changes, as multiple modifications could indicate a targeted attack.

  ### Prioritization
  This alert is categorized with medium severity due to the potential impact of unauthorized modifications to critical access settings, which can lead to significant security breaches. The likelihood of false positives from legitimate administrative actions underscores the need for careful investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if audit logging is not fully enabled or configured for certain administrative actions. The detection logic assumes that any modifications to federation settings by non-admin users are suspicious; however, legitimate changes by system administrators can occur. It is crucial to ensure that Azure audit logs are correctly configured to capture all necessary events related to federation settings for this rule to function as intended.

