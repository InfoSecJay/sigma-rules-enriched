  ---

  ### Technical Context

  This Sigma rule detects modifications to federation settings in Azure Active Directory, indicating a potential privilege escalation or an unauthorized change in domain configuration. The likely attacker objective includes gaining access to sensitive resources or accounts through improper federation controls, which could facilitate unauthorized access or lateral movement within the environment. This behavior is associated with the MITRE ATT&CK technique **T1078: Valid Accounts**.

  The primary telemetry source for this detection is Azure Active Directory Audit Logs, specifically logging events related to federation setting alterations. If malicious, such changes can severely impact the security posture, allowing attackers to manipulate authentication processes. It is essential to note that this detection alone does not confirm malicious intent; legitimate administrative actions by authorized users or applications may also trigger this alert.

  ---

  ### Investigation Steps

  - **Check audit logs for relevant activity:** Review Azure Audit Logs (Event type: FederationSettingsChanged) with filters on the `ActivityDisplayName` for "Set federation settings on domain". Look for actions taken in unusual time frames or by unfamiliar user accounts.

  - **Verify user identity and intentions:** Identify the user account making changes using fields such as `UserId` and `ClientIp`. Confirm if this account has the necessary permissions and was involved in a legitimate use case, such as an administrator performing scheduled maintenance.

  - **Look for suspicious patterns of federation configuration:** Analyze the changes made, focusing on fields like `ModifiedProperties`. Unusual entries that deviate from normal operational settings should be flagged for further investigation.

  - **Assess device and user behavior:** Check the source of the modification (field: `UserAgent` and `Hostname`). Legitimate changes should come from recognized devices and user agents tied to admins. Any changes from unexpected sources (e.g., foreign IP addresses) warrant immediate review.

  - **Examine recent changes or baseline settings:** Compare current federation settings against known baseline configurations to identify any unauthorized adjustments. Document discrepancies and highlight any configurations that enable weaker authentication methods.

  - **Cross-reference with other alerts:** Review any concurrent alerts related to account creations or privilege escalations that may suggest a coordinated attempt to modify federation settings. This can provide additional context and strengthen the malicious hypothesis.

  ---

  ### Prioritization

  The alert has medium severity due to the potential risk involved in unauthorized modification of federation settings, which can provide an attack vector for malicious actors. Given that these settings are crucial for access control, the likelihood of malicious abuse is elevated, especially if the activity falls outside expected patterns of administrative behavior.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the authenticity of the executing user; if a legitimate account is compromised, modifications may go unnoticed. Continuous logging configurations for Azure Active Directory are required to capture all relevant activities effectively. Additionally, legitimate activities, such as approved changes by system administrators, may inadvertently trigger this alert. A companion detection to consider is monitoring for unusual failed logins (e.g., T1060: Application Layer Protocol) which may indicate an attempted exploit or lateral movement activity around the same timeframe as federation setting changes.

