note: |
  ### Technical Context

  This rule detects the creation and immediate deletion of a user account within a short time frame. Such behavior may indicate an attacker's objective to create temporary access for malicious purposes while avoiding detection. This activity falls under the MITRE ATT&CK tactic of **Persistence** (TA0003) and the technique of **Valid Accounts** (T1078). The primary telemetry source is Azure Audit Logs, specifically focusing on events with messages containing "Add user" and "Delete user" with a status of Success. If malicious, this behavior could allow unauthorized access to the environment and potentially lead to data exfiltration or increased foothold. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate administrative actions may also exhibit similar patterns.

  ### Investigation Steps

  - **Review Azure Audit Logs for User Events**: Check Azure Audit Logs (Event ID N/A) for entries with "Add user" and "Delete user" messages. Focus on the timestamp to confirm creation and deletion occurred within the same minute.

  - **Verify User Account Necessity**: Assess whether the created user account aligns with organizational requirements or policies. Confirm if this action was expected based on recent projects or administrative changes.

  - **Analyze Account Creator Activity**: Identify which administrator executed the account creation. Review their recent activity logs to see if there are any unusual patterns or behaviors related to privilege escalation.

  - **Check Related Logins for the Account**: Investigate any logins associated with the new account before its deletion. Look at additional Azure logs (Event ID N/A) to verify the account was not used for any unauthorized actions.

  - **Identify Legitimate Behavior Patterns**: Understand and document the organization's processes regarding user account management to differentiate between normal administrative actions and potential misuse.

  ### Prioritization

  This alert is of high severity as it involves the potential creation of unauthorized access points in sensitive systems. The likelihood of this behavior being weaponized is significant, particularly in environments where compromised credentials could lead to extensive privilege escalation and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the completeness and configuration of Azure Audit Logs; ensure that auditing is consistently enabled across all relevant resources. Legitimate administrative actions, particularly during onboarding or offboarding processes, can trigger this alert. A related detection to strengthen coverage could include monitoring for unusual account login attempts following account creations or deletions, enhancing the chance of identifying malicious intent behind such actions.

