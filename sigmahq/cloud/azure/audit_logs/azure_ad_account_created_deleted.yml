note: |
  ### Technical Context
  This detection rule identifies instances where a user account is both created and deleted within a short time frame, suggesting a potentially malicious operation. Attackers may leverage such tactics to establish temporary accounts that facilitate unauthorized access, lateral movement, or data exfiltration, while minimizing the risk of detection. The exploit can align with various stages of the attack lifecycle, particularly initial access, privilege escalation, and persistence.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**: T1078 – Valid Accounts
  - **Persistence (TA0003)**: T1078 – Valid Accounts
  - **Privilege Escalation (TA0004)**: T1078 – Valid Accounts
  - **Defense Evasion (TA0005)**: T1078 – Valid Accounts

  The primary data source for this detection is Azure Active Directory audit logs, which capture events associated with user account management, including creation and deletion.

  ### Investigation Steps
  - **Review Azure Audit Logs:** Collect and examine audit logs from Azure Active Directory to identify events that highlight user account creation followed closely by deletion. Focus on time stamps to verify the gap is within a short and suspicious range.

  - **Validate Account Activity:** Investigate the context surrounding the user account activity. Look for additional actions (e.g., logging in or accessing resources) performed by the newly created account before its deletion.

  - **Inspect User Identifier Patterns:** Check for anomalies in the user account names or IDs to determine if standard naming conventions were bypassed, which can indicate scripted or automated account generation.

  - **Monitor for Administrator Actions:** Analyze previous similar behaviors in the Azure environment to differentiate between potential legitimate administrative actions versus unusual patterns that are indicative of an attack.

  ### Prioritization
  The high severity of this alert is driven by the potential for attackers to exploit quickly created and deleted accounts to gain access to sensitive systems. The likelihood of this type of behavior being legitimate is low, making it crucial to investigate promptly.

  ### Blind Spots and Assumptions
  This detection logic may miss incidents where accounts are created and deleted outside of the monitored Azure audit logs, such as through other administrative interfaces or third-party tools. Furthermore, the rule assumes that the actions will always be in close temporal proximity, which may not hold true in all scenarios. Complete visibility into administrative actions requires proper log collection configurations to ensure all relevant account management events are captured.

