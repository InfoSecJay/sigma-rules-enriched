note: |
  ### Technical Context

  This Sigma rule detects the creation and subsequent deletion of user accounts within a short time frame, indicative of potentially malicious behavior, such as the establishment of a temporary account used for unauthorized access before being deleted to evade detection. The attacker may aim to achieve persistence, lateral movement, or initial access without leaving long-term traces. This activity aligns with the MITRE ATT&CK technique T1078 (Valid Accounts) under the tactic of Credential Access.

  The primary telemetry sources for this detection are Azure Audit Logs, specifically filtering for events related to user account creation and deletion. If these actions are performed maliciously, it could lead to unauthorized access, data exfiltration, or system compromise. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also trigger these events.

  ### Investigation Steps

  - **Check Azure Audit Logs for User Events:** Review Azure Audit Logs for `Add user` and `Delete user` events (Log type: Azure Audit Logs, Event category: Directory Management). Cross-reference the timestamps to confirm the accounts are created and deleted within the suspected timeframe (e.g., less than 5 minutes).

  - **Identify Account Details:** Investigate the details of the created and deleted accounts, focusing on their usernames and any associated permissions. Look for patterns (e.g., generic names like "temp_user" that may indicate a non-legitimate creation).

  - **Assess Admin Action Legitimacy:** Determine if the creation and deletion align with expected administrative behavior. For example, did this happen during routine maintenance or following an approved change request?

  - **Look for Related Privilege Escalation Events:** Review other events surrounding the time frame of account modification, checking for additional suspicious activity such as privilege escalations through Security Event IDs 4672 (Special privileges assigned).

  - **Document User Access Patterns:** Cross-check the actions of the created account in the logs (e.g., login attempts, resource access) for any abnormal access. Use Event ID 4624 (Logon) to verify login activity patterns.

  - **Evaluate for Evasion Posture:** Consider the possibility of an attacker creating multiple accounts in quick succession to bypass detection methods. If multiple "creation/delete" pairs are found, this increases the likelihood of malicious intent.

  ### Prioritization

  This alert is high-severity due to its potential impact on the security posture of the enterprise. The likelihood of abuse is heightened given that attackers often use short-lived accounts to bypass detection mechanisms and achieve unauthorized access. Such behavior is consistently weaponized in various attack scenarios, notably in credential theft and lateral movement tactics.

  ### Blind Spots and Assumptions

  Detection may be limited in environments without comprehensive logging settings or where Azure Audit Logs are not properly collected or retained. Legitimate administrative actions, such as account batch processing or user replacement after termination, might trigger the alert. A companion detection to strengthen coverage includes monitoring for unusual login behavior associated with recently created accounts, potentially using the high-fidelity user access logs to detect signs of compromise or misuse.

