note: |
  ### Technical Context
  This detection rule identifies changes to authenticated methods within user accounts in Azure, which may indicate potentially malicious activity. Attackers often resort to modifying an account's authentication methods to retain access and enable persistence, particularly after initial compromise where they assume control of legitimate accounts. Such modifications can allow attackers to bypass standard security protocols and maintain an abnormal foothold within an organization's infrastructure.

  Relevant MITRE ATT&CK tactics and techniques that apply include:
  - **Privilege Escalation (T1068)**: Attackers can use account modifications to escalate their privileges.
  - **Credential Access (T1556)**: By changing authentication methods, attackers can aim to capture credentials or establish unauthorized access.
  - **Persistence (T1098)**: This technique entails maintaining access through changes in authentication settings.
  - **Defense Evasion (T1070)**: Attackers may employ this tactic to minimize detection by altering user management logs or configurations.

  The primary data sources relevant for this detection include Azure audit logs, which capture events related to user management changes and authentication method modifications.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Examine the audit logs from Azure, focusing specifically on entries logged by the "Authentication Methods" service. Look for changes categorized under "User registered security info."
  - **Correlate with User Activity**: Investigate any recent activity associated with the user accounts that experienced authentication method changes. Look for signs of unusual logins or access patterns.
  - **Check for Unauthorized Access**: Analyze if there are any indications of unauthorized access or abnormal behaviors linked to the affected users, such as access from unusual locations or devices.
  - **Assess Roles and Permissions**: Verify the roles and privileges assigned to accounts that have altered their authentication methods. Ensure they align with expected operational roles and no excess privileges have been granted.

  ### Prioritization
  This alert should be treated with medium severity due to the potential impact of unauthorized access to credentials and accounts, which could lead to data breaches and further compromise of systems. The likelihood of such changes indicating malicious activity is heightened in enterprise environments, especially if they occur outside normal administrative schedules.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios where legitimate administrative users modify authentication methods without patterns indicative of compromise. The detection logic assumes that any changes to authentication methods outside of regular operational procedures signal potential malicious activity. To ensure accurate detection, it's essential that Azure audit logs are enabled and capturing events related to user management and authentication configurations.

