note: |
  ### Technical Context

  This rule detects changes to authentication methods in Azure Active Directory (AAD) by monitoring audit logs for a user registering new security information. This behavior may indicate that an attacker has gained access to a user account and is adding alternate authentication methods to maintain persistence, enabling them to evade detection and access the account later. The relevant MITRE ATT&CK techniques are "Account Manipulation" (T1098) and "Credential Dumping" (T1556).

  Primary telemetry sources include Azure audit logs. Specifically, the log types to monitor are ‘UserManagement’ events with the operation name ‘User registered security info’. If malicious, this activity could facilitate unauthorized access and long-term persistence within the environment. Importantly, this detection alone does not prove malicious activity; legitimate administrative actions or user-initiated changes could trigger the rule.

  ### Investigation Steps

  - **Review AAD audit logs for suspicious account changes:** Investigate Azure audit logs (Event ID relevant to user management changes) focusing on user accounts that registered new security information. Look for entries logged by the ‘Authentication Methods’ service.

  - **Identify account ownership and recent login activity:** Validate the legitimate user identity associated with the modified account by checking Azure Sign-in logs for last login times, IP addresses, and user agent strings. Benign behavior typically shows activity from known user locations and devices.

  - **Examine the types of registered authentication methods:** Verify the newly registered security information. Legitimate changes may include device registrations or additional MFA methods. Unexpected methods (e.g., unrecognized phone numbers or email addresses) could indicate malicious intent.

  - **Correlate with identity protection alerts:** Check Microsoft Identity Protection for any risk detections related to the affected account. Elevated risk scores or alerts can indicate that the account may have been compromised, contributing to malicious indicators.

  - **Evaluate permission levels of the affected account:** Investigate the roles and permissions assigned to the account. Accounts with elevated privileges would pose a greater risk if their authentication methods were altered compared to standard user accounts, heightening the priority of the investigation.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential risk factor associated with changing authentication methods, which can be indicative of privilege escalation and persistence mechanisms. Given that many adversaries exploit legitimate functionalities for these changes, the likelihood of malicious intent is moderate but concerning.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate administrative changes to trigger the alert without malicious intent. Essential log sources include Azure audit logs and the necessity for enabling detailed auditing to track all changes effectively. Legitimate actions like user self-service password resets may also generate similar alerts, so appropriate context is essential. A companion detection to consider is monitoring for unusual sign-in attempts or password reset events (T1078.001), which can provide broader context around account security.

