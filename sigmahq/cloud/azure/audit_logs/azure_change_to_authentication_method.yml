note: |
  ### Technical Context

  This Sigma rule detects changes to authentication methods, specifically when new security information is registered for user accounts in Azure. Attackers may exploit this functionality to add their authentication methods to a compromised account, ensuring continuous access and persistence. The relevant MITRE ATT&CK tactics include Credential Access (T1556) and Persistence (T1098). The primary telemetry source is Azure Audit Logs, specifically looking for the `Authentication Methods` logged by the service, where the operation indicates a user registered security info. If this activity is malicious, it may lead to unauthorized access to sensitive data and resources within the organization. Notably, this detection does NOT confirm that an account has been compromised or misused; it merely indicates that an authentication method has been changed.

  ### Investigation Steps

  - **Check Azure Audit Logs**: Review Azure Audit Logs for Event ID related to `User registered security info` within the last 48 hours. Ensure the `LoggedByService` is `Authentication Methods` and `Category` is `UserManagement`.

  - **Identify user behavior**: Determine if the user has a legitimate reason for changing their authentication method (e.g., they recently lost their mobile device). Use user behavioral analytics to contextualize actions.

  - **Verify source IP and time of change**: Cross-reference the time of the authentication method change with the user's typical login patterns. Look for unexpected geolocation or IP address anomalies in the sign-in logs (Azure AD sign-in logs).

  - **Audit account role and permissions**: Review the account involved in the change for any elevated privileges assigned recently. Validate roles against your organization’s role-based access control policies.

  - **Look for other related activities**: Monitor for any subsequent unusual account activity following the change to authentication methods. This can include failed login attempts or password resets in Azure AD sign-in logs.

  - **Review MFA configurations**: If applicable, confirm that multi-factor authentication (MFA) is still enabled on the user account, as this can mitigate unauthorized access even if an auth method was added.

  ### Prioritization

  This alert is medium severity. While the likelihood of malicious abuse is significant due to the nature of the action (changing authentication methods), the impact depends on the sensitivity of the affected account and its permissions. Such behaviors are often weaponized in account compromise scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if notifications or logging settings in Azure are misconfigured. Legitimate activities, such as an account owner legitimately registering a new security device, may trigger this alert. Additional detections, such as monitoring for anomalous sign-in patterns, can enhance coverage and provide broader context for risk assessments.

