note: |
  ### Technical Context

  This rule detects the creation of a service principal in Azure, which can be indicative of an attempt to facilitate unauthorized access to Azure resources. The likely attacker objective is to establish a foothold within the Azure environment and create new identities that can operate with defined permissions. This behavior aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and the technique of Valid Accounts (T1078).

  The primary telemetry sources include Azure Audit Logs, specifically looking for the operation name 'Add service principal.' If this alert is triggered by an unauthorized entity, it could lead to significant security implications, as it may suggest an escalation of privileges or lateral movement within Azure. However, this detection does NOT confirm malicious intent on its own, as service principals can be legitimately created by administrators or through automated processes.

  ### Investigation Steps

  - **Verify identity of the creator:** Review Azure Audit Logs for the user identity associated with the creation of the service principal. Analyze fields such as `initiatedBy/user/id` to confirm if the action was performed by a legitimate administrator or an unfamiliar identity.

  - **Check for unusual user agents:** Look at the logged `userAgent` in the audit logs for the action. Legitimate service principal creation typically comes from known administrative machines. Any unknown or suspicious user agent may indicate malicious activity.

  - **Examine role assignment:** Investigate the specific roles assigned to the newly created service principal. Use Azure Role-Based Access Control logs to see if critical permissions (like Owner or Contributor) have been granted that exceed expected operational permissions for the creator.

  - **Look for automation patterns:** Analyze if the service principal creation correlates with any CI/CD processes or automated scripts. Legitimate automation will have established patterns and should come from specific pipeline execution logs rather than ad hoc requests.

  - **Audit the timing of behavior:** Compare the timestamp of the service principal creation event in the Audit Logs. Instances outside of normal operational hours (based on historical data) should be flagged for further investigation.

  ### Prioritization

  This alert has medium severity, primarily due to the potential security risks associated with unauthorized service principal creation. The likelihood of malicious abuse is moderate, particularly if unusual patterns or identities are associated with the creation event. Service principals are often targeted by attackers as they can grant extensive access to resources.

  ### Blind Spots and Assumptions

  Detection may be limited in environments with high administrative turnover, where legitimate users frequently create service principals. The alert may also be triggered by legitimate automated applications that operate within Azure. Useful companion detections could include monitoring for changes to Azure RBAC assignments, as they can signal an abuse of permissions granted to service principals.

