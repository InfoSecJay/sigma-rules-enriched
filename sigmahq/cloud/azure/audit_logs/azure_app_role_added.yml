note: |
  ### Technical Context

  This Sigma rule detects when a service principal is assigned to Azure AD roles, including high-privilege roles like global administrator or Azure RBAC roles such as subscription owner. Such behavior could indicate an attempt by an attacker to grant themselves or a compromised app elevated permissions within the Azure environment, which can lead to further access and potential exploitation of sensitive resources. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **Application Layer Authorization** (T1098.003).

  The primary telemetry source for this detection is Azure Audit Logs, specifically monitoring activities related to service principals (Service Principal Type: `Service Principal`). If malicious, these assignments could enable unauthorized access to critical systems, data exfiltration, or lateral movement within the cloud infrastructure. It's essential to note that the detection of an app being assigned a role does NOT confirm malicious intent on its own, as legitimate applications may require role assignments for operational purposes.

  ### Investigation Steps

  - **Check the role assignment source:** Review Azure Audit Logs (Event Category: ServicePrincipalRoleAssignments) to identify who initiated the assignment, focusing on the `initiator` field. Look for unfamiliar or unauthorized accounts if the role was not expected.

  - **Identify the target service principal:** Validate the service principal involved by checking its `objectId`, `displayName`, and current role assignments. Investigate if it corresponds to a known legitimate application or if it is suspicious. Legitimate applications will typically have a documented use case and owner.

  - **Review role details for sensitivity:** Cross-reference the assigned role against Azure RBAC roles documentation. High-risk roles such as Global Administrator or Owner should trigger an alert for further scrutiny due to their extensive permissions.

  - **Examine timestamps and patterns:** Analyze the timing of the role assignment against the organization’s change management practices. Ensure that assignments follow documented change requests and that there are no unusual patterns or bulk assignments during off-hours.

  - **Track recent service principal activities:** Look into recent activity logs for the service principal in question. Check for sudden changes in behavior that could indicate compromise, such as unusual API requests or logins.

  - **Identify legitimate scoped role assignments:** Review instances where service principals are legitimately assigned roles for specific resources (scoped assignments). Document these to distinguish between valid and potentially malicious assignments.

  ### Prioritization

  This alert should be considered medium severity due to the potential high impact on security, especially if it involves only a few critical systems or services. The likelihood of malicious use is moderate, as adversaries actively exploit cloud role assignments to gain or maintain access. While such assignments can be legitimate, the frequency with which attackers manipulate Azure roles warrants thorough investigation.

  ### Blind Spots and Assumptions

  Limitations in detection may arise if Azure Audit Logs are not configured to capture all necessary role assignment events or if log retention policies are too short. Attackers may evade detection by utilizing compromised but legitimate accounts to assign roles. Legitimate activities that might trigger this alert include automated deployment scripts or app permissions being modified for new service requirements. A related detection to consider is monitoring for unusual API calls made by service principals to identify potential abuse of newly assigned permissions.

