logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    targetResources.type: 'Service Principal'
    properties.message:
    - Add member to role
    - Add eligible member to role
    - Add scoped member to role
  condition: selection
falsepositives:
- When the permission is legitimately needed for the app
level: medium
note: |
  ### Technical Context
  This detection rule identifies when an application is assigned roles in Azure Active Directory (AD) that could grant elevated permissions, such as global administrator or Azure RBAC roles like subscription owner. The potential threat scenario involves an attacker exploiting a vulnerable application or service principal to gain unauthorized access to sensitive resources by manipulating role assignments. This behavior can indicate malicious activity aimed at privilege escalation within the cloud environment, allowing attackers to access critical data or perform unauthorized actions.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), with techniques specifically referenced as **Service Account Abuse** (T1098.003). Analysts should pay close attention to Azure AD audit logs that capture such role assignments, as they can provide insight into potentially unauthorized or unusual changes to application permissions.

  Primary data sources for this detection should include Azure AD audit logs, which record changes to service principals and role assignments, showcasing when and how privileges are modified within the Azure environment.

  ### Investigation Steps
  - **Review Audit Logs:** Check the Azure AD audit logs for any recent changes in role assignments, particularly focusing on entries related to "Add member to role," "Add eligible member to role," and "Add scoped member to role." Look for unusual timestamps or administrative users.

  - **Analyze Role Assignments:** Cross-reference the applications with assigned roles against known applications. Investigate any service principals being granted high-level permissions that are not aligned with their intended purpose.

  - **Correlate User Actions:** Investigate user activity surrounding the time of the role assignment. Look for any logins from unusual IP addresses, accounts with little activity prior to the change, or patterns that may indicate a compromise.

  - **Check for Legitimate Use Cases:** Assess whether the role assignments were valid by confirming with system owners or through other internal procedures. Analyze surrounding log data to identify if these changes might be part of regular operations.

  ### Prioritization
  This alert should be considered medium severity due to the potential for significant impact on the organization’s security posture. Elevated permissions granted to potentially insecure applications can lead to serious vulnerabilities, risking data breaches or unauthorized access.

  ### Blind Spots and Assumptions
  One gap in detection coverage is that legitimate role assignments made for valid applications may generate false positives, as the detection logic does not differentiate between benign and malicious changes. This rule assumes that any role assignment change is suspicious, which may not always be the case. Additionally, the effectiveness of this alert relies on having comprehensive logging enabled for Azure AD audit events, which must be properly configured to ensure that role assignments are recorded in detail for effective monitoring.

