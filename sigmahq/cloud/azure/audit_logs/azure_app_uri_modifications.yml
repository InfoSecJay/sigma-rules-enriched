title: Application URI Configuration Changes
id: 0055ad1f-be85-4798-83cf-a6da17c993b3
status: test
description: |
  Detects when a configuration change is made to an applications URI.
  URIs for domain names that no longer exist (dangling URIs), not using HTTPS, wildcards at the end of the domain, URIs that are no unique to that app, or URIs that point to domains you do not control should be investigated.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-configuration-changes
author: Mark Morowczynski '@markmorow', Bailey Bercik '@baileybercik'
date: 2022-06-02
tags:
- attack.initial-access
- attack.defense-evasion
- attack.t1528
- attack.t1078.004
- attack.persistence
- attack.credential-access
- attack.privilege-escalation
logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    properties.message: Update Application Sucess- Property Name AppAddress
  condition: selection
falsepositives:
- When and administrator is making legitimate URI configuration changes to an application.
  This should be a planned event.
level: high
note: |
  ### Technical Context
  This rule detects changes made to application URIs, which can signify potentially malicious activity. Attackers may exploit configuration errors or make unauthorized changes to redirect users or exfiltrate data. Anomalies such as the creation of dangling URIs (pointing to non-existent domains), non-HTTPS usage, and wildcards in domain names are indicators that should be investigated further. An attacker might leverage these changes to bypass security mechanisms, conduct phishing attacks, or establish persistence with malicious infrastructure.

  Relevant MITRE ATT&CK techniques related to this detection include:
  - **Initial Access (T1190)**: Exploit Public-Facing Application
  - **Defense Evasion (T1528)**: Application Layer Protocol
  - **Persistence (T1140)**: Network Share Modification
  - **Credential Access (T1078.004)**: Valid Accounts

  The primary data sources for this detection are Azure audit logs, which provide detailed records of application configuration changes, highlighting any suspicious URI modifications.

  ### Investigation Steps
  - **Review Audit Logs**: Examine Azure audit logs for entries related to application URI configuration changes. Look for unusual patterns or changes that deviate from documented policies.
  - **Assess URI Validity**: Identify newly configured URIs to ensure they are valid and not pointing to suspicious or unauthorized domains. Check for dangling URIs or those without HTTPS.
  - **Monitor for Redirects**: Investigate if the new URIs are redirecting traffic in unexpected ways or to domains controlled by threat actors to assess potential data exfiltration attempts.
  - **Check Application Permissions**: Verify the permissions and roles of the accounts making the URI changes to ensure no unauthorized access has occurred. Look for privilege escalation paths that could have enabled these changes.

  ### Prioritization
  This alert's severity is high due to the potential impact of malicious URI changes, which could lead to data breaches, user redirection to malicious sites, or the compromise of application integrity. Given the likelihood of configuration changes being exploited by attackers, rapid investigation is critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if proper logging is not enabled for all applications or if only certain domains are monitored. The detection logic assumes that all URI changes should follow established organization protocols; however, legitimate administrative changes may occur that could generate false positives. Adequate logging configuration and comprehensive monitoring are essential for the alert to function effectively.

