logsource:
  product: azure
  service: auditlogs
detection:
  selection:
    properties.message: Update Application Sucess- Property Name AppAddress
  condition: selection
falsepositives:
- When and administrator is making legitimate URI configuration changes to an 
  application. This should be a planned event.
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized changes to the configuration of an application's URI within Azure audit logs. It focuses on changes that may indicate malicious behavior, such as redirecting traffic to non-existent or untrusted domains, which could lead to credential theft or phishing attacks. The likely attacker objective is to establish control over application traffic or to persist compromised access through manipulated application settings.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Initial Access (TA0001) - Exploit Public-Facing Application (T1190)
  - Stealth (TA0005) - Application Layer Protocol Abuse (T1528)
  - Credential Access (TA0006) - Abuse Elevation Control Mechanism (T1068)

  Primary telemetry sources for this detection come from Azure Audit Logs, specifically logging actions related to modification of application properties. The security impact of any malicious behavior can involve not only data exposure but also a foothold in the environment for further attacks. It's important to note that this detection does NOT confirm that the change was unauthorized without further context.

  ### Investigation Steps

  - **Check Recent Application Configuration Changes:** Review Azure Audit Logs for modifications to URIs using the event type `Update Application Success` along with the property name `AppAddress`. Identify all changes made within the last 7 days.

  - **Identify Malicious Indicators:** Look for entries that include URIs pointing to domains that do not belong to your organization or that use deprecated protocols, such as HTTP instead of HTTPS. Domains with patterns indicative of phishing (e.g., use of common misspellings) should be flagged.

  - **Correlate with Known Applications:** Validate changed URIs against a list of legitimate applications that your organization controls. Confirm that any URI change aligns with approved configurations.

  - **Review Administrator Activity:** Examine the user accounts that performed the modifications to ensure that the changes correlate with legitimate administrative tasks; legitimate changes should be part of standardized change management processes.

  - **Audit User Roles and Permissions:** Investigate the user roles involved in making these changes. Confirm whether the modifying accounts have appropriate permissions in line with their job functions. Unusual changes made by users with elevated privileges could indicate potential abuse.

  ### Prioritization

  This alert is of high severity due to its potential impact on application integrity and user data security. The likelihood of malicious exploitation is significant, especially if sensitive data routes through compromised URIs. The behavior described is commonly weaponized in both initial access and credential theft.

  ### Blind Spots and Assumptions

  Detection may miss changes made through direct API calls or faster interfaces not logged thoroughly. Alerts can also be triggered by legitimate administrative activities during planned maintenance. Ensure that audit logs are properly configured to capture all modification events for valid detection coverage. A related detection to consider is monitoring for access to high-risk application environments or unusual user authentication events.

