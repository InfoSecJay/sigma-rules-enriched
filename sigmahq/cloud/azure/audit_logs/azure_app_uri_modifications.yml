  condition: selection
falsepositives:
- When and administrator is making legitimate URI configuration changes to an 
  application. This should be a planned event.
level: high
note: |
  ### Technical Context

  This rule detects modifications to application URI configurations, specifically focusing on changes that may indicate malicious activity, such as unapproved URIs, dangling URIs, or URIs pointing to untrusted domains. The likely attacker objective is to manipulate application behavior for exfiltration, credential harvesting, or establishing persistence. Relevant MITRE ATT&CK tactics include Initial Access (T1078.004: Valid Accounts) and Defense Evasion (T1528: Steal Application Credentials). The primary telemetry source is Azure audit logs, specifically where updates to application configurations are recorded.

  If malicious, these changes could allow attackers to redirect legitimate application traffic or extract sensitive information. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative changes may also trigger the alert.

  ### Investigation Steps

  - **Review Azure Audit Logs for Configuration Changes**: Check the Azure audit logs (Event ID related to `Update Application`) for any recent changes to application URIs. Confirm if any URI changes involve domains you do not control or configurations that lack HTTPS.

  - **Identify Unapproved URIs**: Look for URIs that do not match the organization's approved domain registry. For example, any entries pointing to `.xyz` or other non-trusted domains should be flagged as suspicious.

  - **Verify Scheduled Maintenance Activities**: Confirm if there were legitimate administrative operations scheduled around the time of the alert. Approved change requests should typically accompany any URI modifications.

  - **Check for Duplicated or Wildcard URIs**: Inspect for URI entries that are not unique to the application or contain wildcards (e.g., `*.example.com`). These may indicate an effort to bypass security measures.

  - **Assess for High-Confidence Malicious Indicators**: Identify any URI configurations linking to known malicious domains (check against updated threat intelligence feeds). This includes domains flagged for phishing or malware distribution.

  ### Prioritization

  This alert has a high severity due to the critical nature of application availability and the potential for attackers to exploit modified URI configurations. The likelihood of malicious abuse increases when these changes deviate from established organizational policies, particularly if they involve unknown or unapproved domains.

  ### Blind Spots and Assumptions

  Detection may be limited by the visibility of administrative actions; if logs are not retained or monitored adequately, legitimate changes could be overlooked, causing false negatives. Evasion techniques may include legitimate administrators performing unsanctioned changes without routing them through established processes. Additionally, other legitimate activities, such as routine updates or reconfigurations prompted by service enhancements, may trigger this alert. Related detections to consider are those focusing on Azure Active Directory account access (T1078) to further enrich the context around potential unauthorized changes.

