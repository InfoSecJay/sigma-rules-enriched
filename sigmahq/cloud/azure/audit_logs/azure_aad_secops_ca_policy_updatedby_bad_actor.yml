note: |
  ### Technical Context
  This rule detects unauthorized modifications to conditional access policies within the Azure environment. Such alterations could suggest that an attacker has gained access to administrative privileges and is attempting to manipulate security measures to weaken the organization's defenses. The potential objectives for an attacker may include establishing persistence in the environment, escalating privileges, or evading existing security controls.

  Relevant MITRE ATT&CK tactics/techniques for this detection include:
  - **Privilege Escalation (T1068)**: Gaining elevated access to resources.
  - **Credential Access (T1556)**: Modifying policies may be an avenue for accessing sensitive information.
  - **Defense Evasion (T1548)**: Altering conditional access can help bypass security restrictions.

  Primary data sources for gathering evidence include Azure audit logs, which track changes to conditional access policies, user identities involved in the modifications, and the corresponding timestamps of these actions.

  ### Investigation Steps
  - **Review Azure Audit Logs**: Examine the audit logs specifically for changes related to conditional access policies. Pay attention to the user identities responsible for these changes.

  - **Verify User Authorization**: Check if the actor making the changes has the appropriate permissions and is a recognized administrator for updating conditional access policies.

  - **Analyze Modified Properties**: Compare the old and new values of the modified properties to understand the impact and intent behind the changes.

  - **Correlate with Other Security Events**: Look for any other significant security events that coincide with these changes, which may indicate a broader attack vector or pattern.

  ### Prioritization
  The severity of this alert is medium due to the nature of the changes being potentially critical to security posture; unauthorized modifications can lead to data breaches or unauthorized access but may also result from misconfigurations that are part of normal operations.

  ### Blind Spots and Assumptions
  The detection logic assumes that all changes to conditional access policies are logged properly and that the actor's credentials are reliably identifiable. A gap exists in detecting the initial compromise that may have allowed an unauthorized actor to make such changes. Additionally, misconfigured role permissions could lead to false positives, highlighting the need for proper log management and user role definitions within Azure to ensure effective monitoring.

