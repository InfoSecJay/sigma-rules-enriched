note: |
  ### Technical Context

  This rule detects unauthorized updates to conditional access policies in Azure, indicating potential privilege escalation or credential access attempts. The likely attacker objective is to alter access controls to facilitate unauthorized access to sensitive resources, potentially leading to data breaches or further escalation of privileges. The relevant MITRE ATT&CK technique associated with this detection is T1548 (Abuse Elevation Control Mechanism), which encompasses various methods of gaining elevated permissions.

  The primary telemetry sources include Azure audit logs that specifically track changes made to conditional access policies. The security impact of malicious changes can be significant, as it may allow attackers to bypass critical security controls. Importantly, this detection does NOT confirm that any unauthorized access has occurred, merely that a change was made by a non-approved actor.

  ### Investigation Steps

  - **Verify Actor Approval Status:** Review the identity of the actor making the changes by checking the "initiating user" field in the Azure audit logs. Compare against a list of sanctioned users with permission to modify conditional access policies.

  - **Examine Modified Properties:** Identify the specific properties that were altered (fields such as "old" and "new" values) in the Azure audit log entries (AuditLogEventType: "Update conditional access policy"). Document any significant changes that could impact security postures, like broadening access.

  - **Check User Context:** Assess the user agent and hostname associated with the change request. Legitimate changes should originate from IT admin workstations or known management tools. Any foreign or unexpected context may indicate malice.

  - **Correlate with Other Activities:** Look for related events in the Azure activity logs, such as changes to permissions (Event Types: "Role assignment created/updated"). Anomalies here may indicate an ongoing exploitation or configuration drift.

  - **Audit Role Configuration:** Cross-verify potential misconfigurations of roles and permissions that could allow unauthorized changes. Review role assignment logs (RoleAssignments) to ensure only appropriate users had access to modify conditional access policies.

  ### Prioritization

  This alert should be considered medium priority in an enterprise context. The affected systems are critical because they enforce access controls that protect sensitive data. The likelihood of malicious abuse is moderate, given that altering access policies is a common tactic during attacks aimed at bypassing security mechanisms.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logs are not correctly configured to capture specific changes, or if legitimate administrative activities occur outside standard procedures. Common evasion techniques include attackers compromising approved accounts or leveraging elevated permissions obtained through social engineering. One related detection that strengthens coverage is monitoring for excessive login attempts from users whose access was altered.

