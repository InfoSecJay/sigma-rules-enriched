note: |
  ### Technical Context

  This Sigma rule detects unauthorized changes to conditional access policies within an Azure environment. An attacker may attempt to modify these settings to weaken access controls, allowing unauthorized access to sensitive resources or data. This behavior aligns with the MITRE ATT&CK tactic of "Privilege Escalation" (TA0004), including techniques such as "Privilege Elevation via Application Layer" (T1548) and "Valid Accounts" (T1556). The primary telemetry source is Azure Audit Logs, specifically tracking events that contain messages related to updates on conditional access policies.

  If malicious, the impact could involve unauthorized access to critical systems, data exfiltration, or further compromise of user accounts. Notably, this detection does NOT confirm malicious intent on its own, as legitimate, authorized roles could also make policy updates.

  ### Investigation Steps

  - **Confirm user identity and legitimacy**: Review the actor initiating the change by checking Azure audit logs (Event IDs corresponding to AuditLogs). Validate whether this individual has the necessary permissions to modify conditional access policies under normal operational procedures.

  - **Investigate modified properties**: Analyze the "old" versus "new" values within the alerting event. Look for significant or suspicious changes that deviate from standard configurations, such as relaxed access conditions or policy disabling.

  - **Cross-check user agent and hostname**: Look into the user agent string and hostname involved in the policy update. Check for any anomalies, such as access from unusual locations or systems not typically associated with administrative actions.

  - **Review historical context**: Investigate prior modifications to the conditional access policies by visiting the historical logs. Ensure there is a clear pattern of behavior consistent with the user role, indicating typical modification activities versus abnormal ones.

  - **Identify high-confidence malicious indicators**: Look for changes that coincide with potential exploitation patterns, such as modifying policies to allow access from previously restricted devices (Event ID details reflecting policy change types).

  - **Evaluate impact and severity of changes**: Assess whether affected policies govern access to high-value assets or data. Confirm if the current changes have lowered security postures significantly, making systems more vulnerable.

  ### Prioritization

  This alert should be considered medium severity due to the potential for significant security impact if sensitive access controls are altered. The likelihood of malicious activity is heightened, given that attackers often target conditional access policies to gain unauthorized access to enterprise systems. The behavior is commonly weaponized in targeted attacks, emphasizing the need for thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured role permissions that allow legitimate users to make changes that may trigger the alert. Organizations must ensure comprehensive logging of Azure activity and proper permission configurations for reliable detection. Legitimate activities, such as routine policy updates by authorized personnel, may inadvertently trigger this alert. Compounding detection efforts through log monitoring for user activities related to system administration can bolster security coverage against unauthorized changes.

