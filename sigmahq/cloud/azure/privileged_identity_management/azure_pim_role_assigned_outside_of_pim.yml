note: |
  ### Technical Context
  This detection rule aims to identify instances where privileged roles are assigned outside of Azure's Privileged Identity Management (PIM) system. When an attacker successfully exploits vulnerabilities or misconfigurations, they may attempt to escalate privileges by assigning themselves or others privileged roles without going through the established PIM process. This circumvention can lead to unauthorized access to critical systems and sensitive data, significantly increasing the risk to the organization.

  The likely attacker objectives involve gaining elevated permissions to perform malicious activities, such as data exfiltration, lateral movement, or instigating further attacks within the network. The relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - Initial Access (TA0001)
  - Defense Evasion (TA0005)
  - Valid Accounts (T1078)
  - Persistence (TA0003)
  - Privilege Escalation (TA0004)

  Data sources that will provide the best evidence for this alert are Azure's PIM logs, specifically monitoring for configuration changes concerning role assignments and the absence of PIM approval workflows.

  ### Investigation Steps
  - **Review Azure PIM Logs:** Check the Azure PIM activity logs for entries indicating role assignments that bypass the PIM approval process. Note the users involved, roles assigned, and timestamps.
  - **Assess User Roles and Activities:** Evaluate the context of the affected accounts. Investigate whether the users have legitimate reasons to receive elevated permissions and examine their recent activities for any suspicious behavior or anomalies.
  - **Check for Policy Violations:** Verify organization policies regarding role assignments. Ensure that any privileges granted outside of PIM are documented, authorized, and comply with internal governance rules.
  - **Monitor Related Alerts:** Look for related alerts across other security tools like EDR and SIEM that could indicate broader compromise activities, such as failed login attempts or unusual account behaviors.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of unmonitored privilege escalations, which can lead to severe data breaches and system compromises. The likelihood of exploitation is increased in environments with poor monitoring or compliance practices.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if role assignments are made through other unauthorized methods or systems that do not integrate with Azure PIM. The rule assumes that all roles must go through PIM; misconfigurations could lead to false negatives. Additionally, Azure logs need to be enabled and retained properly, as missing logs could prevent detection of such critical events.

