note: |
  ### Technical Context

  This Sigma rule detects the assignment of privileged roles outside of Privileged Identity Management (PIM) within Azure Active Directory. Such behavior may indicate an attempt by an attacker to escalate privileges or establish persistence through unauthorized role assignment. The relevant MITRE ATT&CK tactics and techniques include Initial Access (TA0001), Persistence (TA0003), and Privilege Escalation (T1068).

  The primary telemetry source is Azure Active Directory's PIM logs, which capture events related to role assignments. If a malicious actor obtains unauthorized access to an account or exploits weaknesses in the PIM configuration, they could gain elevated privileges, significantly compromising the security posture of the environment. This detection alone does NOT confirm malicious activity without further investigation into the context and nature of the role assignment.

  ### Investigation Steps

  - **Review role assignment history:** Look for Azure AD logs related to role assignments to determine when and by whom the roles were assigned. Focus on Event ID 60002 (role assignments) and check for timestamps indicating recent changes that fall outside authorized operating procedures.

  - **Verify assignments against PIM configurations:** Cross-reference the detected role assignments with PIM configurations to confirm if they were authorized. Legitimate behavior typically reflects timely and documented role requests.

  - **Identify high-risk users:** Filter role assignment logs by user type. Pay special attention to assignments to accounts that typically have elevated privileges (e.g., global administrators) that were not previously identified as needing those roles.

  - **Examine session activity:** Check for any user activities following the role assignment in Azure AD sign-in logs (Event ID 4624) to identify potentially malicious logins or changes made using elevated privileges.

  - **Assess for policy violations:** Investigate any assigned roles that contradict the organization's role assignment policies, indicating potential abuse or misconfiguration.

  - **Correlate with other alerts:** Look for other related alerts or incidents that may indicate a broader attack attempt, such as failed login attempts (Event ID 4625) or anomalies in user behavior that align with the timing of the role assignment.

  ### Prioritization

  The alert should be considered high severity due to the potential for significant operational impact if adversaries exploit unauthorized role assignments. The likelihood of malicious abuse is elevated, especially in environments with critical assets where administrative privileges are sensitive and commonly targeted.

  ### Blind Spots and Assumptions

  Potential limitations include evasion techniques such as using legitimate accounts to perform unauthorized assignments. Reliable detection requires proper Azure PIM configuration and logging settings enabled for auditing role assignments. Legitimate activities, like emergency role assignments or critical incident responses, may inadvertently trigger the alert. A related detection to strengthen coverage would include monitoring for anomalous sign-in patterns following role changes in Azure AD, such as unusual geolocation or device usage.

