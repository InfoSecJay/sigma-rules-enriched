note: |
  ### Technical Context

  This rule detects role assignments of privileged roles in Azure that occur outside the Privileged Identity Management (PIM) system. The behavior may indicate unauthorized privilege escalation or lateral movement activity by an attacker aiming to gain elevated access to sensitive resources. This detection correlates with MITRE ATT&CK techniques such as "Valid Accounts" (T1078) and "Privilege Escalation" (T1068). The primary telemetry source is Azure PIM event logs, specifically focusing on role assignment events. If malicious, this activity could lead to substantial security breaches, allowing the attacker to manipulate critical systems and data.

  However, this detection does not confirm if the account is malicious on its own, as legitimate administrators may need to assign roles outside of PIM for various business purposes.

  ### Investigation Steps

  - **Review role assignment details:** Check Azure PIM logs for Event Type `rolesAssignedOutsidePrivilegedIdentityManagementAlertConfiguration` to ascertain who assigned the roles, to whom, and at what time. Focus on entries that deviate from expected admin role assignment processes.

  - **Identify role assignment sources:** Verify whether the role assignments bypassed standard PIM procedures. Legitimate behavior might show frequent role assignments only via PIM for designated super-users.

  - **Correlate with user activity:** Cross-reference the Azure AD sign-in logs (Event ID 4624) to determine if users assigned roles are engaged in unusual login patterns, particularly from atypical locations or devices.

  - **Check for anomalous role assignments:** Investigate for any assignments to high-privilege roles (e.g., Global Administrator, Privileged Role Administrator) that could indicate a malicious intent, especially if performed by non-roles responsible for such security functions.

  - **Assess endpoint security:** For any affected accounts, review device security logs to check for irregular behavior or compromise indicators, such as unusual software installations or user-initiated processes not linked to their role.

  ### Prioritization

  The alert is high severity due to the potential impact on critical assets within the Azure environment. The likelihood of malicious abuse is elevated, especially if the behavior is consistent with known attack patterns for account compromise. Privilege assignments outside PIM are not typical and require immediate investigation as they may be indicative of exploitation activity.

  ### Blind Spots and Assumptions

  Detection may miss scenarios where attackers have legitimate accounts that are already privileged and use them to avoid detection. Reliable detection requires comprehensive logging of Azure PIM configurations and role assignment activities. Legitimate urgency to assign roles outside of PIM for operational reasons may also trigger this alert. Companion detections such as unusual sign-ins or administrative activities should be closely monitored to enhance detection accuracy.

