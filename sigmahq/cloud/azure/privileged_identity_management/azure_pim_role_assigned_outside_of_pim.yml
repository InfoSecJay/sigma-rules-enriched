  ---

  ### Technical Context

  This Sigma rule detects the assignment of privileged roles outside the Privileged Identity Management (PIM) framework in Azure Active Directory. Such assignments may indicate attempts by an adversary to escalate their privileges or gain unauthorized access to critical resources by circumventing established security controls like PIM. The relevant MITRE ATT&CK tactics and techniques are Defense Evasion (T1561), Privilege Escalation (T1068), and Initial Access via Valid Accounts (T1078). The primary telemetry source is Azure PIM logs, specifically capturing risk event types related to role assignments.

  If malicious, the security impact could include unauthorized access to sensitive systems and data, potentially paving the way for further exploitation or lateral movement within the organization's environment. However, this detection does NOT confirm that the role assignment was malicious; it merely signals a deviation from expected governance practices.

  ---

  ### Investigation Steps

  - **Check PIM Assignment Policies:** Review Azure Active Directory’s PIM policies to understand the expected role assignment workflows. Look for successful assignments where `riskEventType` is marked as `rolesAssignedOutsidePrivilegedIdentityManagementAlertConfiguration`, identifying roles and users involved.

  - **Identify Involved User Accounts:** Evaluate the user accounts associated with the role assignments outside PIM. Legitimate assignments might include elevated access for IT staff during an approved maintenance window, which should correlate with change management records.

  - **Correlate with User Activity:** Analyze user behavior around the time of the alert generated. Look for relevant Azure AD sign-ins (Log type: Sign-in logs, Event IDs: 4624) or unusual changes made by the user post-assignment that deviate from their baseline significantly.

  - **Review Role Assignment History:** Investigate Azure AD audit logs focusing on `Azure.ActiveDirectory.RoleManagement/RoleAssignment` events to trace any quick changes or patterns indicating unexpected behavior or suspicious timing of assignments.

  - **Assess Affected Resource Impact:** Determine the criticality of resources tied to the assigned roles. High-impact systems under these roles could include those handling sensitive customer data or privileged administrative access.

  - **Evaluate for Malicious Patterns:** Search for known IP addresses or users tied to previous incidents as identified in threat intelligence feeds to confirm if the involved accounts have associated malicious behavior previously (Log type: Azure AD logs).

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential for privilege escalation and significant risk if an adversary compromises the integrity of critical systems. Given that roles can grant extensive permissions, the likelihood of abuse is high, especially if the behavior deviates from normal administrative operations.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques where adversaries may mask malicious role assignments under legitimate administrative actions. Reliable detection requires proper configuration of Azure PIM logs and alerting settings. Some legitimate activities, like temporary role assignments for contractors or help desk staff, may trigger this alert. A related detection focusing on Azure AD sign-in anomalies would further strengthen coverage against unauthorized access attempts.

