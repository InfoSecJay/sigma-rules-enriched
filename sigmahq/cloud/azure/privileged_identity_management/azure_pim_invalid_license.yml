note: |
  ### Technical Context

  This rule detects the absence of the proper Privileged Identity Management (PIM) licenses, leading to risks associated with compliance and security posture. Attackers may exploit this vulnerability to gain unauthorized access to privileged accounts or escalate their privileges, ultimately compromising sensitive systems. Relevant MITRE ATT&CK techniques include **T1078: Valid Accounts** and **T1072: Software Deployment Tools** within the tactic of Initial Access and Persistence. Primary telemetry sources are Azure logs, specifically from the PIM service, indicating invalid license alerts. The security impact of malicious exploitation can include unauthorized access to critical resources, leading to data breaches. Importantly, this detection does NOT confirm active exploitation or compromise without further evidence.

  ### Investigation Steps

  - **Verify license status:** Review Azure PIM logs focusing on `riskEventType` with the value `invalidLicenseAlertIncident` (Event IDs associated with license review) to confirm if licenses have indeed expired or are misconfigured.

  - **Check for recent license changes:** Look into Azure activity logs (Audit Logs in Azure AD) for any changes made to PIM configurations, particularly around the time of the alert. Note any administrators or users who altered settings.

  - **Assess legitimate subscription usage:** Based on organization knowledge, ensure that current Azure subscriptions correspond with the required services and PIM features. Verify that users in your environment have sufficient licenses, such as Microsoft Entra Premium P2.

  - **Identify suspicious user activity:** Review the user activity logs for any failed or unusual access attempts to privileged resources following the license alert. Look for patterns of login failures or unexpected changes in access levels.

  - **Examine previous license alerts:** Analyze historical PIM alerts within the last 60 days to provide context on how frequently invalid license incidents occur and correlate them with any noted security events.

  ### Prioritization

  The alert is high severity due to its potential impact on the security of privileged accounts, which hold significant access rights. Given the likelihood of adversaries leveraging expired or invalid licenses to bypass security controls, this behavior is critical to address promptly. Such license violations can be exploited for lateral movement or privilege escalation, making them a common vector in targeted attacks.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if licenses are routinely checked or if diligent license management practices are in place, which could create false positives. Additionally, legitimate business operations may lead to frequent invalid license alerts during transitions to new subscriptions or renewals. A related detection method might include alerting on changes to user roles within Azure AD (Event ID 4800) to strengthen coverage against identity exploitation.

