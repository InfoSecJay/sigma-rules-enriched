note: |
  ### Technical Context

  This rule detects instances where an organization lacks the appropriate licensing for Azure Privileged Identity Management (PIM), specifically resulting in an "invalid license" alert. The likely attacker objective is to exploit misconfigurations or permissions issues in an environment without adequate PIM licensing, potentially leading to unauthorized privilege escalation. The relevant MITRE ATT&CK techniques are *Initial Access (T1078)* and *Privilege Escalation (T1068)*. The primary telemetry sources required are Azure activity logs, focusing on PIM service events. If exploited, this situation may lead to unauthorized access to privileged accounts or roles, compromising the environment's security posture. This detection does NOT confirm actual exploitation or misuse of accounts on its own; further investigation is required.

  ### Investigation Steps

  - **Validate license status: ** Check Azure portal for current PIM licenses under Azure Active Directory > Licenses. Confirm if the organization possesses valid Microsoft Entra Premium P2 or Microsoft Entra ID Governance licenses.

  - **Review risk events: ** Examine Azure activity logs for the `invalidLicenseAlertIncident` type in the PIM service. Look for timestamped entries and correlating user actions that might indicate attempts to escalate privileges.

  - **Identify user actions: ** Investigate corresponding Azure AD sign-ins during the same timeframe as the invalid license alerts (Azure AD sign-in logs). Pay attention to failed sign-ins, which may indicate malicious attempts to access PIM functionalities.

  - **Analyze recent changes: ** Review Azure log records for any recent license modifications or permissions changes associated with PIM (Management Activity logs, Event IDs 3650–3653). Determine if such changes coincide with the alert trigger.

  - **Compare with expected behavior: ** Assess expected user activity in PIM during the alert period. Validate if common administrative tasks were logged, such as role assignments or access requests, which align with organizational operations.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on privileged account security. The lack of proper PIM licensing increases the risk of privilege escalation by malicious users or misconfigured accounts. The behavior is weaponized for attacks targeting initial access and privilege escalation within Azure environments.

  ### Blind Spots and Assumptions

  This detection may miss cases where valid licenses exist but were improperly configured, allowing evasion. Reliable detection requires appropriately configured Azure logging for PIM activities. Legitimate activities, such as routine license audits or user role modification, may inadvertently trigger this alert. Consider pairing this detection with user activity monitoring for Azure sign-ins to enhance visibility into actual privilege access attempts.

