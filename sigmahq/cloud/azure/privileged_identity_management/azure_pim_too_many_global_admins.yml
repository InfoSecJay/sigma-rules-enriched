note: |
  ### Technical Context
  This detection rule identifies scenarios in which an enterprise has an excessive number of accounts assigned the Global Administrator role in Azure Active Directory (AAD). Global Admins possess broad, high-level permissions, which can lead to serious security incidents if misused or if the accounts are compromised. The primary goal of malicious actors may be to gain administrative control over resources, carrying out goal-oriented attacks such as data exfiltration, lateral movement, or the deployment of additional exploitation tools.

  The relevant MITRE ATT&CK tactics involved in this detection include **Initial Access (TA0001)**, **Persistence (TA0003)**, **Privilege Escalation (TA0004)**, and **Defense Evasion (TA0005)**. Techniques particularly relevant here are **T1078: Valid Accounts**, as compromised legitimate credentials can enable attackers to operate undetected. Primary data sources for effective detection include logs from Azure's Privileged Identity Management (PIM), which tracks role assignments and alerts on events concerning privileged accounts.

  ### Investigation Steps
  - **Review Global Admin Assignments**: Assess the list of users with Global Administrator privileges to identify any that are unnecessary or no longer relevant. This can help in reducing the attack surface.

  - **Examine Recent Role Changes**: Investigate logs for any recent changes in role assignments, focusing on the timestamps and the identities of those involved in the modifications.

  - **Audit Audit Logs**: Check Azure audit logs for signs of unusual access patterns or suspicious activities related to user accounts with elevated privileges, particularly any configuration changes by these accounts.

  - **Validate Threshold Settings**: Determine if the threshold for triggering alerts in Privileged Identity Management (PIM) is appropriately configured, as overly sensitive thresholds can lead to false positives.

  ### Prioritization
  This alert warrants high severity due to the potential risk associated with having too many Global Admins, which could facilitate unauthorized access to critical resources and expose the organization to significant security threats.

  ### Blind Spots and Assumptions
  This detection logic may miss cases where Global Administrator accounts are inadequately monitored or managed but do not exceed the alert threshold. There's an assumption that thresholds set within PIM are appropriate; thus, organizations should regularly review and adjust these settings according to their risk profile. Required logs for this alert to function effectively include comprehensive audit logs from Azure Active Directory and Privileged Identity Management that capture role assignments and modifications.

