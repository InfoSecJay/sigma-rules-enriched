note: |
  ### Technical Context

  This Sigma rule detects when there are an excessive number of accounts assigned the Global Administrator role in Azure AD. This behavior often indicates a potential misconfiguration, which attackers may exploit to gain elevated privileges and access sensitive data. The likely attacker objective is to maintain persistence within the environment and escalate privileges, thereby achieving lateral movement and further compromise. The relevant MITRE ATT&CK framework tactics include Privilege Escalation (TA0004) and Initial Access (TA0001), specifically the technique for Valid Accounts (T1078).

  Primary telemetry sources include Azure AD logs, specifically from Azure Privileged Identity Management (PIM). The security impact of this incident can lead to a significant breach of sensitive data or systems if an attacker gains control over multiple Global Administrators. Importantly, this detection does NOT confirm malicious activity on its own; it signals a potential issue that requires further investigation into the necessity and legitimacy of the Global Administrator assignments.

  ### Investigation Steps

  - **Review current Global Admin assignments:** Check Azure AD for the current list of Global Administrators. Compare it against organizational policy to identify if the number exceeds acceptable limits based on the size and role of the organization.

  - **Examine logs for recent role changes:** Look into Azure AD audit logs (Event ID: 1001) for any recent changes to Global Administrator roles, including who made the changes and whether the changes align with expected administrative actions.

  - **Validate account purpose and activity:** Investigate the purpose and recent activity of each Global Admin account. Verify that their usage aligns with roles defined in the organization to distinguish legitimate users from potential oversights or compromises.

  - **Identify suspicious login attempts related to admin accounts:** Check for any atypical or failed sign-in attempts associated with Global Admin accounts in Azure AD sign-in logs. Particularly look for administrative accounts showing sign-ins from unusual geographic locations or devices (Event IDs: 4624 and 4625).

  - **Evaluate the organization's threshold settings in PIM:** Confirm whether the threshold for global admin assignments is appropriate and in accordance with established security policies. This can help determine if the alert is a result of configured parameters rather than any malicious activity.

  ### Prioritization

  This alert is high severity due to the potential for widespread access to sensitive systems and data if multiple Global Administrators are compromised. The likelihood of malicious use is significant, as attackers commonly seek to escalate privileges for lateral movement. The behavior of having too many Global Admins may also be a footing for compliance violations.

  ### Blind Spots and Assumptions

  Detection relies on proper logging configurations in Azure AD and PIM; if logs are not correctly retained or monitored, alerts may be missed. Legitimate administrative role changes, particularly during audits or migrations, may trigger this alert. As a companion detection, monitoring for anomalous login patterns could further strengthen security by highlighting suspicious behaviors related to these privileged accounts.

