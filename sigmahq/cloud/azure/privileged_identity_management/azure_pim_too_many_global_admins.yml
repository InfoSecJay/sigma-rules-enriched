note: |
  ### Technical Context

  This detection identifies situations where an excessive number of accounts have been assigned the Global Administrator role in an Azure environment. The behavior suggests that an attacker may aim to increase administrative access points within the environment to facilitate further exploitation or lateral movement. In terms of the MITRE ATT&CK framework, this behavior aligns with the tactics of Initial Access (TA0001), Persistence (TA0003), and Privilege Escalation (TA0004) under technique ID T1078 (Valid Accounts).

  The primary telemetry source for this alert is Azure's Privileged Identity Management (PIM) logs, specifically capturing the event type `tooManyGlobalAdminsAssignedToTenantAlertIncident`. If the alert corresponds to malicious activity, the compromised accounts pose a significant security risk, potentially allowing unauthorized access to sensitive resources. However, this detection does NOT confirm malicious intent on its own, as it may result from an administrative oversight or misconfiguration.

  ### Investigation Steps

  - **Review the Global Administrator list:** Check the current list of Global Administrators via Azure Active Directory (AAD) (Event ID: N/A). Investigate the necessity of each account that holds this role to determine if any are unauthorized or outdated.

  - **Confirm recent changes to roles:** Look for changes in role assignments in Azure Activity Logs (Log Type: Azure Log Analytics, Query Fields: `Event Category`, `Operation Name`, `Caller`), identifying when and by whom these changes were made.

  - **Identify legitimate administrative practices:** Note if the organization has a documented process for assigning Global Administrator roles. Legitimate roles may include necessary personnel from IT and security teams, compared with any unfamiliar accounts.

  - **Inspect account activity:** Use Azure AD sign-in logs (Event ID: N/A, Log Type: AAD Sign-in Logs) to check the last login time and activity of the Global Administrator accounts. High levels of unusual logins from unexpected IP addresses can indicate malicious activity.

  - **Look for alert thresholds:** Investigate the configured threshold settings in PIM for the Global Administrator role. If set low, this may lead to false positives, meaning the findings could reflect normal operational behavior rather than a security issue.

  ### Prioritization

  This alert is of high severity because it indicates a proliferation of administrative access, which increases the vulnerability of the environment. The likelihood of malicious abuse is significant, as attackers often aim to gain administrative privileges. Furthermore, this behavior is a common tactic employed to establish persistence and control within a compromised environment.

  ### Blind Spots and Assumptions

  Detection may be limited if PIM configurations aren't correctly set up or if logs are not being adequately captured or retained. Legitimate administrative activities, such as organizational restructuring or role changes, may trigger this alert. A related detection that could effectively complement this coverage is logging instances of role modifications in Azure Activity Logs, which would provide additional context around changes in administrative roles.

