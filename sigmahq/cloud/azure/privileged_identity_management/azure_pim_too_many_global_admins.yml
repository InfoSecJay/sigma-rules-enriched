  ---

  ### Technical Context

  This Sigma rule detects situations where an unusually high number of accounts are assigned the Global Administrator role within an Azure environment. This behavior may indicate a potential security risk, as attackers often aim to gain elevated privileges to exploit or persist within an organization's infrastructure. The relevant MITRE ATT&CK techniques are Privilege Escalation (T1068) and Valid Accounts (T1078).

  The primary telemetry sources include Azure Privileged Identity Management logs, specifically events where the "riskEventType" is set to "tooManyGlobalAdminsAssignedToTenantAlertIncident." If malicious, this could lead to unauthorized access to sensitive data or systems, enabling attackers to perform actions with high-level privileges. Importantly, this detection alone does not confirm malicious intent; legitimate administrative practices might also result in multiple Global Administrators being created.

  ---

  ### Investigation Steps

  - **Check current Global Administrator count:** Review Azure PIM logs for the number of accounts currently assigned the Global Administrator role (e.g., log type: `PIM activity logs`, relevant field: `GlobalAdminCount`).

  - **Identify credential changes:** Investigate if there have been recent changes or temporary assignments to Global Administrator roles (e.g., look for `roleAssignment` events and `status` fields in Azure logs).

  - **Review recent administrative activities:** Examine Azure activity logs for high-risk activities performed by these Global Administrators (e.g., Event types: `Add-GlobalAdmin`, `Remove-GlobalAdmin`).

  - **Correlate with user behavior:** Validate legitimate usage by reviewing the access patterns and actions taken by these accounts (e.g., usage frequency, locations—logged via relevant telemetry fields: `lastLogin`, `activityType`).

  - **Identify inactive accounts:** Look for long-term inactive users that have recently been granted Global Administrator privileges, which could indicate potential account compromise (e.g., `lastActivity` field in audit logs).

  - **Assess role takeover risk:** Correlate findings with potential phishing or social engineering incidents reported within your organization to identify if these accounts may have been accessed improperly.

  ---

  ### Prioritization

  This alert should be treated with high severity, given that the Global Administrator role provides comprehensive access to Azure resources. The likelihood of malicious exploitation is significant, especially if attackers are successfully able to compromise one or more of these privileged accounts. Assigning excessive Global Administrators is not a common practice and is frequently weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Limitations may arise from configurations that fail to capture transient administrator role assignments or from users switching roles frequently. Additionally, legitimate administrative activities, such as diversity in administrative roles or proactive security measures, may unintentionally trigger this alert.  A related detection to enhance coverage would include tracking Anomalous User Activity events, which can indicate whether newly assigned Global Administrators are engaging in suspicious actions.

