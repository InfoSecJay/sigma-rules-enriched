note: |
  ### Technical Context

  This rule detects instances where a privileged role in Azure can be activated without the requirement for multi-factor authentication (MFA). The likely attacker objective is to escalate privileges or maintain persistence without triggering additional security checks, potentially leading to unauthorized access to sensitive resources. This behavior corresponds to the MITRE ATT&CK technique: **T1078 - Valid Accounts**, specifically under tactics related to initial access and privilege escalation.

  The primary telemetry source is Azure Privileged Identity Management (PIM) logs, focusing on incidents flagged under `riskEventType` of 'noMfaOnRoleActivationAlertIncident'. If malicious, this could enable an attacker to gain access to and manipulate critical systems or data without adequate authentication measures. Notably, this detection does **NOT** confirm that an unauthorized role has been activated, only that the mechanism for activation lacks MFA.

  ### Investigation Steps

  - **Verify user identity and MFA requirements:** Check the user's sign-in logs (Azure AD Sign-in logs) for authentication status and ensure MFA was not bypassed legitimately. Confirm whether the user account is expected to have MFA configured.

  - **Identify privileged role details:** Review role activation logs in Azure PIM (e.g., log type: Azure PIM Activity logs, fields: `roleId`, `userId`, `activityType`) to see which specific role was activated. Compare against standard permissions for the user to check for anomalies.

  - **Monitor for suspicious activity post-activation:** After detecting MFA-less role activation, monitor for unusual actions (e.g., elevated access attempts, sensitive data access) in Azure Activity logs (Event IDs: 2000-2040) that would be atypical for the user’s behavior profile.

  - **Assess affected system impact:** Determine the criticality of the asset tied to the activated role (e.g., access to Azure Resource Manager) to prioritize response efforts based on potential risk exposure.

  - **Flag high-confidence malicious indicators:** Look for rapid or concurrent role activations from the same user (<5 minutes) which may indicate malicious intent, especially if the roles are unrelated (anomalous role-switching behavior).

  ### Prioritization

  The alert carries **high severity** due to the potential impact on privileged access to sensitive systems without MFA safeguards. Given the likelihood that attackers may aim to exploit such misconfigurations for privilege escalation, it reflects a common vector for malicious actors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users having proper roles activated without MFA, such as during maintenance windows or other exceptions. Reliable detection requires that PIM logging configurations are correctly set up to capture all relevant events. Activities such as automated deployments or system maintenance could inadvertently trigger the rule. A companion detection to strengthen coverage is monitoring for suspicious sign-ins from new or untrusted devices within Azure AD.

