note: |
  ### Technical Context

  This rule detects instances where a user can activate a privileged role in Azure without undergoing multi-factor authentication (MFA). The likely attacker objective is to escalate privileges and gain access to sensitive resources, potentially leading to unauthorized changes or data exfiltration. This behavior fits into the MITRE ATT&CK framework under the tactic "Initial Access" (TA0001) and technique "Valid Accounts" (T1078).

  Primary telemetry sources include Azure Privileged Identity Management (PIM) logs, specifically events relating to role activations. If malicious, this behavior could compromise critical assets and allow for unauthorized administrative tasks. Importantly, this detection does NOT confirm that privilege escalation has occurred, only that a role activation lack MFA, which can indicate a misconfiguration or a more nuanced method of attack.

  ### Investigation Steps

  - **Verify role activation without MFA:** Check Azure PIM logs for Event ID related to `riskEventType: noMfaOnRoleActivationAlertIncident`. Look for any relevant user accounts that do not require MFA for their role activation.

  - **Assess user sign-in behavior:** Review sign-in logs (Azure AD Sign-in logs) to confirm if the user is performing MFA at sign-in. Look for "MFA Required" in the Authentication Details to determine legitimate access patterns.

  - **Compare with organizational policy:** Evaluate if the role activation policy aligns with the organization's security policy regarding MFA enforcement. Legitimate configurations should require MFA for all privilege role activations.

  - **Identify high-risk user accounts:** Cross-reference activated roles with user account privileges. Focus on accounts with administrative or highly privileged roles. If accessed by a user with a known history of suspicious activity, further investigation is warranted.

  - **Document expected behavior changes:** Observe the role activation frequency and patterns. Legitimate roles should have predictable activation patterns correlating with operational needs, while unusual activation times or excessive activations can indicate misconduct.

  - **Check for additional alerts:** Review for any correlated alerts or indications of unusual activities (e.g., multiple failed logins followed by a successful MFA-less role activation). This can indicate an adversary using valid accounts for lateral movement or privilege escalation.

  ### Prioritization

  Alert severity is high due to the potential impact on critical systems and sensitive data if a privileged role is activated without MFA. The risk of malicious abuse is significant, as it highlights a gap that threat actors could exploit for lateral movement or unauthorized access. While this specific behavior may not be commonly weaponized, it represents a known method of privilege escalation.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate users may be configured not to require MFA on certain accounts or under specific conditions. The lack of detailed user training may lead to users inadvertently triggering the alert during acceptable business operations. Logs from Azure AD and PIM must be configured correctly to ensure comprehensive coverage. A related detection to strengthen overall coverage includes monitoring for events where users are granted or assigned roles outside of normal operating hours, indicating potential compromise.

