note: |
  ### Technical Context

  This Sigma rule detects instances where users have been assigned a privileged role but are not utilizing it within a defined period. This behavior can indicate potential privilege misuse or redundant role assignments, which may lead to privilege escalation or account abuse. The likely attacker objective may be to maintain a low profile while having elevated access that is not actively monitored.

  This aligns with the MITRE ATT&CK tactics of "Initial Access" (TA0001) and "Privilege Escalation" (TA0004), as well as the technique "Valid Accounts" (T1078). The primary telemetry source is Azure Privileged Identity Management (PIM) logs specifically looking for risk event types of 'redundantAssignmentAlertIncident'. If malicious, unmonitored privileged accounts could lead to significant security breaches, allowing unauthorized access to sensitive areas of the environment. This detection does NOT confirm that malicious activity occurred; it only indicates that an assigned privilege role was not leveraged.

  ### Investigation Steps

  - **Check user activity logs for the last 30 days**: Review Azure PIM logs to identify the last active use of the privileged role by the user (Log type: Azure PIM, Field: lastActiveDate). Compare this against the role assignment date.

  - **Confirm role necessity**: Review the rationale for the user's privileged role assignment. If the user typically works in a non-privileged capacity, this may indicate a potential misconfiguration or an unused privilege (Field: roleAssignment).

  - **Identify high-confidence malicious indicators**: Look for any recent unauthorized access attempts or unusual logins associated with the user (Event IDs: 4624 for successful logins) that occurred outside of regular working hours.

  - **Assess legitimate usage patterns**: Validate whether the user has legitimate reasons for not using the privileged role, such as being in a training phase or if their responsibilities have changed recently. Check if there are any organizational communications regarding role requirements.

  - **Evaluate the criticality of the host**: Determine if the user is associated with critical systems or sensitive data. High-value roles should have stricter monitoring and enforcement policies to ensure compliance with usage.

  - **Investigate account configurations**: Check for any linked accounts, such as generic or service accounts that might make privileged access inactive, ensuring that they are still incorporated under appropriate usage policy (Log type: Azure AD audit logs).

  ### Prioritization

  This alert is high severity due to the potential risk of unmonitored privileged accounts being exploited. Systems tied to these roles often handle sensitive data and administrative functions, making them prime targets for adversaries. Additionally, failing to realize and monitor such behaviors can facilitate unnoticed intrusions or lateral movements within the network.

  ### Blind Spots and Assumptions

  This detection has limitations in identifying users who may not actively use their roles but are compliant due to no recent activity. Evasion techniques may include legitimate role usage during critical ceasing periods or circumvention through shared accounts with active privileges. PIM must be properly configured to gather necessary logs regularly. A related detection to consider is monitoring for anomalous login patterns (Event ID: 4625 for failed logins), enhancing the ability to correlate suspicious activity against users with redundant role statuses.

