note: |
  ### Technical Context
  This rule identifies instances when a user is assigned a privileged role, such as those managed through Azure's Privileged Identity Management (PIM), but is not utilizing that role. This behavior could indicate oversight, a misconfiguration, or potentially malicious activities where an attacker may have gained access to the role without using it, thereby maintaining low visibility within the environment. Attackers often seek to escalate privileges and gain control of sensitive operations, making such detection critical for preventing unauthorized access.

  The relevant MITRE ATT&CK tactics include **Initial Access (TA0001)**, where an attacker first gains access to the network; **Defense Evasion (TA0005)**, as attackers may try to hide their activities by not using legitimate roles assigned to them; **T1078: Valid Accounts**, where valid credentials are exploited; **Persistence (TA0003)**, as attackers may use these roles to establish a foothold, and **Privilege Escalation (TA0004)**, where they can gain elevated access. This rule primarily draws logs from Azure PIM, which tracks changes and usage of privileged roles.

  ### Investigation Steps
  - **Collect Azure PIM Logs:** Gather logs from Azure Privileged Identity Management to identify the timeframe when the privileged role was assigned and subsequent activity, or lack thereof, associated with the user account.
  - **Review User Activity:** Analyze the historical audit logs for the user in question; check for any unusual login attempts or actions performed outside their expected usage patterns.
  - **Examine Role Permissions and Assignments:** Investigate the specific permissions associated with the role not being used. Determine if the exposed permissions could lead to further exploitation or if they pose a significant risk based on company policy.
  - **Alert on User Behavior:** Set up additional monitoring on the affected user accounts, especially if the lack of usage aligns with other suspicious activities within the organization, such as abnormal login times or geographical anomalies.

  ### Prioritization
  This alert's severity is high due to the potential risk of privilege misuse or unauthorized access. If an attacker has acquired a privileged role without intention of use, they could exploit this to elevate their presence within the environment without detection, which may lead to significant impacts.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the privileged role is assigned to accounts that are not consistently monitored or if users do not log in regularly (e.g., service accounts). The detection logic assumes there is a clear correlation between role assignment and expected activity patterns; however, legitimate users may also have infrequent need for certain privileges. Required logs for this alert include detailed event logs from Azure PIM, which track both role assignments and user actions in the environment.

