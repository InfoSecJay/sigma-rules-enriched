note: |
  ### Technical Context

  This Sigma rule detects accounts with privileged roles that have not signed in over a defined period. The typical attacker objective is to either exploit a stale account with unchanged permissions for unauthorized access or to leverage it for privilege escalation in a compromised system. This detection relates to the MITRE ATT&CK tactic of Credential Access (T1078 - Valid Accounts) and may indicate potential persistence or defense evasion strategies employed by an adversary.

  Primary telemetry sources include Azure Privileged Identity Management (PIM) logs, specifically looking at events associated with stale sign-in alerts. If malicious, the impact can be significant as it may provide unmonitored access to sensitive systems. However, this detection does NOT confirm that the stale account has been compromised; rather, it highlights accounts that require review.

  ### Investigation Steps

  - **Check last sign-in datetime**: Review the Azure AD sign-in logs (Event ID 4624) for the stale account to verify the last successful authentication attempt. A legitimate account typically has regular sign-ins consistent with user activity patterns.

  - **Identify account role and permissions**: Use Azure PIM logs to retrieve the roles assigned to the stale account, ensuring it is not unexpectedly elevated. Compare these roles against organizational policies to flag unexpected privilege levels.

  - **Evaluate audit logs for changes**: Look for any modification records in Azure Active Directory logs (Audit Logs) related to role assignment or permission changes for the stale account. Legitimate activity should show no drastic changes without proper authorization.

  - **Analyze associated resources**: Investigate resources connected to the stale account for unusual activity in the Azure Resource Manager or resource logs (Activity Log). Any unauthorized changes or access rights should be a high-confidence malicious indicator.

  - **Correlate with known malicious patterns**: Cross-reference the stale account's activity with threat intelligence sources for any reports of abuse related to stale privileged accounts. This could indicate more extensive security issues.

  ### Prioritization

  This alert should be considered high severity due to the potential access enabled by stale privileged accounts. The likelihood of malicious abuse is significant, as attackers often seek compromised but active accounts to bypass security controls. Such behavior is well-documented and weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives for accounts that are legitimately inactive due to business needs or roles. Ensure that Azure AD logs are configured to capture all relevant sign-in and audit events for reliable detection. Legitimate scenarios such as employees on extended leave or contractors with infrequent access may trigger this alert. A relevant companion detection includes monitoring for any role elevation events that occur just before or after a stale account alert, enhancing the overall security posture.

