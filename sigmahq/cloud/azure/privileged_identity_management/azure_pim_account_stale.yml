note: |
  ### Technical Context

  This Sigma rule detects accounts with privileged roles within the Azure environment that have not signed in for a specified duration. The primary behavior being identified is the existence of stale accounts, which may indicate poor account hygiene and potential avenues for exploitation by adversaries. The likely attacker objective is to gain unauthorized access or persist within an environment through a dormant but privileged account, potentially facilitating lateral movement or privilege escalation.

  This rule maps to the MITRE ATT&CK tactic of "Initial Access" (TA0001) and the technique of "Valid Accounts" (T1078). The primary telemetry source for this detection is Azure Privileged Identity Management (PIM) logs, specifically the risk event types indicating stale sign-in alerts. If malicious, the presence of such accounts could lead to unauthorized access to sensitive resources. However, this detection does not confirm active compromise or malicious intent by itself, as it might also include benign accounts that are no longer in active use.

  ### Investigation Steps

  - **Review the account status:** Examine the details of the stale account, including role assignments and any activity logged within Azure PIM (Event Type: staleSignInAlertIncident). Confirm if the account is truly inactive or if it is being managed appropriately.

  - **Identify last sign-in activities:** Query Azure AD sign-in logs (Event ID: 4624) to check the last sign-in timestamp for the account in question. If it aligns with the stale alert duration, proceed to further investigation.

  - **Check for related privileged role assignments:** Validate the account's role against existing privileged roles within the organization. Look for any indications that the role is redundant or unnecessary, which could suggest misuse (Log Source: Azure PIM).

  - **Cross-reference with alert history:** Investigate if there are any prior alerts related to this account in Azure Security Center logs (Log Type: Security Alerts). Identify patterns indicating whether the account was previously flagged or used for suspicious activities.

  - **Assess legitimate use cases:** Determine if there are organizational policies justifying the account’s inactivity. For instance, if the account belongs to a seasonal role or was created for a specific project that has since concluded, it may not require regular sign-ins.

  - **Analyze for potential exploitation:** Look for any sign of unauthorized access attempts (Event ID: 4625), such as failed logins with this account. This could indicate an ongoing threat leveraging a dormant account for malicious activity.

  ### Prioritization

  The alert is of high severity due to the potential security implications of unused privileged accounts. Stale accounts can be targeted by adversaries for unauthorized access and are frequently weaponized in lateral movement attacks. The potential impact on critical systems heightens the urgency to investigate such alerts promptly.

  ### Blind Spots and Assumptions

  This detection may be limited by the reliance on Azure logs, which can be misconfigured or incomplete if proper logging policies aren't enforced. Legitimate accounts that have not been cleaned up after personnel changes may falsely trigger this alert. It is also possible that advanced adversaries may actively avoid detection by ensuring long-term account staleness in compromised accounts. A useful companion detection to enhance coverage would be monitoring for internal account management changes or privilege adjustments (Event ID: 4732 for group membership changes).

