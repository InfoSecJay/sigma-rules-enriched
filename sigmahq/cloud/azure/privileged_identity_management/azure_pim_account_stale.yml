note: |
  ### Technical Context
  This detection rule identifies accounts with privileged roles that have not signed in for a specified duration, indicative of "stale" accounts. Attackers often exploit inactive accounts to obtain unauthorized access to sensitive resources, circumventing security measures and facilitating further attacks. By detecting these stale accounts, organizations can proactively reclaim privileged access and bolster their overall security posture.

  The threat scenario involves an adversary potentially using stale accounts to regain access to an organization’s infrastructure without detection, allowing them to maintain footholds in the environment. This is particularly concerning as such accounts could be leveraged for privilege escalation, lateral movement, or persistence within the system.

  Relevant MITRE ATT&CK tactics include:
  - **Initial Access (T1078)**: Using valid accounts to access systems.
  - **Persistence (T1078)**: Maintaining access through privileged accounts.
  - **Privilege Escalation (T1068)**: Gaining elevated access by exploiting stale account privileges.

  Primary data sources for this detection include Azure Privileged Identity Management (PIM) logs that specifically capture events related to account staleness and sign-in activities.

  ### Investigation Steps
  - **Review Azure PIM Logs**: Examine the PIM audit logs for entries related to stale account sign-ins, noting the duration of inactivity and the role assignments associated with these accounts.
  - **Identify Account Ownership**: Determine who owns or manages the stale accounts through Active Directory (AD) group memberships or user access reviews to assess the potential impact of an unauthorized access event.
  - **Evaluate Associated Alerts**: Cross-reference any stale account alerts with other security alerts or incidents to identify potential correlating events that could indicate suspicious activity or exploitation.
  - **Implement Account Review Procedures**: Ensure a governance process is in place for regular review of privileged accounts, including guidelines for the timely deprovisioning of stale accounts and alerts for unused admin roles.

  ### Prioritization
  The severity of this alert is high because stale accounts serve as prime targets for attackers looking to exploit dormant access for illicit purposes. The impact of such unauthorized access could facilitate significant breaches, highlighting the critical need for timely intervention to mitigate risks.

  ### Blind Spots and Assumptions
  This detection logic may not capture stale accounts that still have activity through automated processes or services, potentially allowing an attacker to maintain access undetected. It assumes that all stale accounts are inactive; however, organizational policies may necessitate certain accounts to remain open even if not regularly signed into. Required logs include detailed Azure PIM activity logs, which must be correctly configured to ensure visibility of all sign-in events linked to privileged roles.

