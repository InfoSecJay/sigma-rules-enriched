  ### Technical Context

  This Sigma rule detects an anomalously high number of virtual machine (VM) creation or deployment activities within Azure. Such behavior is commonly associated with an adversary attempting to expand their footprint in a compromised environment, potentially leading to unauthorized resource provisioning or lateral movement. The associated MITRE ATT&CK tactic is "Privilege Escalation" (TA0004) and the technique is "Container or Cloud Service Creation" (T1098).

  The primary telemetry source for this detection is Azure Activity Logs, specifically events related to resource deployments, which include log types for "write" operations to VMs and resource deployments. If malicious, the impact could lead to unauthorized access to sensitive data or services through newly created VMs. Importantly, this detection does not prove malicious intent on its own, as legitimate users may engage in the same activities for valid administrative or development purposes.

  ### Investigation Steps

  - **Review Azure Activity Logs for resource creation events**: Check for logs that include "Microsoft.Compute/virtualMachines/write" and "Microsoft.Resources/deployments/write" (Event Type: Write). Verify the timestamp and user identity associated with these activities.

  - **Cross-reference with user roles**: Identify if the user performing the VM creation has the necessary permissions (e.g., 'Owner' or 'Contributor' roles). Legitimate activities should only be performed by users with appropriate administrative privileges.

  - **Assess the volume of resource creation**: Quantify the number of VM creation events in a specified timeframe (e.g., within 24 hours). An unusually high number compared to historical averages could indicate malicious intent and should be escalated.

  - **Evaluate geolocation of the user**: Check the IP geolocation for the user performing the deployments. Activity from unexpected regions, particularly from areas known for cyber threats, may raise suspicion.

  - **Investigate associated resource changes**: Look for related activities in Azure logs such as changes to Network Security Groups (NSGs) or storage account configurations linked to newly created VMs, which may indicate attempts to expose services.

  - **Identify any alerts or changes to security controls**: Review for any alerts within Azure Security Center or other security controls that may have been triggered surrounding the time of the VM creation. Frequent alerts could highlight ongoing malicious activities.

  ### Prioritization

  This alert is of medium severity due to the potential impact of newly created VMs in an enterprise environment, which could facilitate further malicious activities. The likelihood of abuse is significant, especially if the behavior deviates from established norms, making it critical to investigate.

  ### Blind Spots and Assumptions

  Detection limitations could arise if logs are not retained for an adequate duration or if monitoring configurations do not include relevant service permissions. Legitimate activities such as planned infrastructure scaling or testing could also trigger the alert. A related detection to enhance coverage would be monitoring for suspicious Azure Activity Log entries related to unauthorized access attempts or role assignments.

