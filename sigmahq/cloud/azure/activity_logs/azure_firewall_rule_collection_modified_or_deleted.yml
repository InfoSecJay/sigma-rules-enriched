note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Firewall Rule Collections, which include Application, NAT, and Network rules. Such actions are often carried out by an adversary to alter firewall configurations to allow unauthorized traffic, facilitating lateral movement or data exfiltration. This behavior correlates with the MITRE ATT&CK tactics of Impact (T1499) and Defense Evasion (T1686.001).

  Primary telemetry sources include Azure Activity logs, specifically focusing on operation names related to creating, modifying, or deleting rule collections for Azure Firewalls. If malicious, this could enable attackers to bypass network protections. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate modifications may occur during regular administrative tasks.

  ### Investigation Steps

  - **Review Azure Activity Logs:** Check Activity logs for Event Names like `Microsoft.Network/azureFirewalls/applicationRuleCollections/write` or `delete`. Look for unusual timestamps or patterns that deviate from historical configurations.

  - **Validate User Identity:** Investigate the user identity associated with the modification or deletion. Confirm if this user typically performs such actions and evaluate against roles and permissions.

  - **Cross-Reference with Configuration History:** Access the Azure Resource Manager to review historical configurations of the affected rule collections. Compare against changes to identify any discrepancies.

  - **Identify Unusual User Agents:** Examine the User Agent associated with these changes. High-risk changes made from unusual user agents, particularly those not associated with administrator roles, may indicate malicious intent.

  - **Check for Related Alerts:** Investigate if there are any correlating logs or alerts regarding unauthorized access attempts or privilege escalation events around the time of the rule modification.

  ### Prioritization

  The severity of this alert is medium due to its potential impact on the network security posture. While modifications of firewall rules can be an administrative task, they may signal an adversary’s efforts to undermine security controls, especially if performed by unauthorized personnel.

  ### Blind Spots and Assumptions

  Detection may miss legitimate modifications made by authorized personnel, especially if done during regular maintenance. Awareness of proper access controls and logging settings is critical for reliable detection. Additionally, the alert may trigger on benign updates by automated scripts or processes that frequently adjust firewall rules. A companion detection for unauthorized API calls to Azure resources can enhance overall security monitoring.

