  ---

  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Firewall Rule Collections, including Application, NAT, and Network rules. The likely attacker objective is to manipulate firewall settings to allow malicious traffic or obscure their activities, thereby compromising network security. This activity aligns with the MITRE ATT&CK technique “Impair Defenses” (T1562.004) as it involves altering security controls.

  The primary telemetry source is Azure Activity Logs, which provide records of operations performed on Azure Firewall. If malicious, this could lead to unauthorized access or data exfiltration. Notably, this detection does not confirm that changes were made with malicious intent; legitimate administrative actions can also trigger alerts.

  ---

  ### Investigation Steps

  - **Review the user identity making changes:** Cross-check the user associated with the operation (userPrincipalName or initiator) against your organization’s list of authorized administrative users in Azure. Confirm the legitimacy of the user’s activities and intent.

  - **Check operation timestamps and context:** Analyze the time of changes in Azure Activity Logs (ActivityLog) around the same time period. Look for unusual patterns such as late-night modifications, which could indicate potential abuse.

  - **Investigate application and NAT rule collections:** Query Azure Activity Logs for Event Name: `Microsoft.Network/azureFirewalls/applicationRuleCollections/write` and `Microsoft.Network/azureFirewalls/applicationRuleCollections/delete`. Pay attention to any rule modifications or deletions that deviate from expected configurations.

  - **Identify known legitimate changes:** Document the expected operations for rule changes based on recent projects or business needs. This includes understanding when specific administrators were granted permissions to modify rules.

  - **Look for signs of repeated or bulk changes:** Search for multiple rule modifications or deletions in quick succession (e.g., within the same minute). This could indicate an automation script potentially used by attackers to bypass defenses systematically.

  ---

  ### Prioritization

  This alert should be considered medium severity based on the potential impact of affecting Azure Firewall configurations that control network access. The likelihood of malicious abuse is moderate, given that attackers often target firewall settings to gain unauthorized access or persist within environments. This behavior is commonly weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the granularity of Azure Activity Logs, as not all changes may be captured if logs are not retained appropriately. Evasion techniques may include using service principals or application identities to perform these actions without direct human oversight. Legitimate activities, such as scheduled rule updates or maintenance, may trigger this alert, particularly if performed by lesser-known administrative accounts. Companion detections, such as monitoring any related Azure Diagnostics Logs for impacted resources or services, can help strengthen coverage.

