note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Firewall Rule Collections, which include Application, NAT, and Network rules. The likely objective of an attacker is to evade detection by changing the firewall configuration, potentially allowing malicious traffic to bypass security controls. This behavior fits into the MITRE ATT&CK tactic of "Impact" (TA0040) and the technique of "Exploitation of Application Layer Protocol" (T1562.004). The primary telemetry source for this detection is Azure Activity Logs, specifically operation names related to firewall rule collections (e.g., WRITE and DELETE operations). If malicious, such changes could lead to unauthorized access to sensitive resources. This detection does NOT confirm actual malicious activity on its own, as legitimate administrators may also modify or delete these rules.

  ### Investigation Steps

  - **Check activity logs for relevant operations**: Review Azure Activity Logs for Event Records with operation names: `MICROSOFT.NETWORK/AZUREFIREWALLS/APPLICATIONRULECOLLECTIONS/WRITE`, `DELETE`, `NATRULECOLLECTIONS/WRITE`, `DELETE`, and `NETWORKRULECOLLECTIONS/WRITE`, `DELETE`.

  - **Identify the user performing the changes**: Examine the `initiatedBy` field in the activity log entries to ascertain if the actions were performed by known administrators or unfamiliar identities, which may indicate suspicious behavior.

  - **Verify legitimate administrative actions**: Confirm that users have assigned roles (e.g., Network Contributor or Owner role) that permits access to modify Azure Firewall rules. Changes from expected user types are more likely benign.

  - **Correlate timestamps with incident history**: Cross-reference the timestamp of the rule modification or deletion with past incidents in your organization, looking for patterns or anomalies that indicate a larger compromise.

  - **Evaluate the user agent and source IP**: Analyze the `userAgent` and `sourceIPAddress` from the activity logs for anomalies that might suggest a malicious actor attempting to access and modify firewall configurations from an unexpected location.

  ### Prioritization

  This alert has medium severity in an enterprise context due to the potential impact on network security if unauthorized changes are made. The likelihood of malicious abuse is high, as attackers often seek to exploit firewall misconfigurations. Such behavior is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers possess legitimate administrative credentials. Reliable detection requires comprehensive logging from Azure Activity Logs configured to capture all relevant operations. Legitimate activities, such as scheduled maintenance or configuration reviews, may also trigger this alert. A related detection rule monitoring unusual Azure role assignments could complement coverage by identifying compromised accounts gaining excessive permissions.

