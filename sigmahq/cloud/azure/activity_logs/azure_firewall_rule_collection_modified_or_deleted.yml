note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of Azure Firewall Rule Collections, including Application, NAT, and Network rule collections. Such activities are critical as they can alter network security configurations and potentially lead to unauthorized access or data exfiltration. Attackers may seek to manipulate firewall rules to evade detection, redirect traffic, or allow malicious traffic through, compromising the integrity of the network environment.

  The relevant MITRE ATT&CK tactics associated with this detection include **Impact (TA0040)** and **Defense Evasion (TA0005)**. Specifically, it relates to the technique **T1562.004: Disable or Modify Security Tools**, as modifying or deleting firewall rules directly impacts the security posture of the enterprise.

  The primary data source for this rule is Azure Activity Logs which record all management operations including those related to rule collections in Azure Firewall. Monitoring these logs offers crucial insights into changes made and can assist in identifying potential malicious activities.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Examine the Azure Activity Logs for entries matching the rule operations related to rule collection modifications and deletions. Look for performance anomalies or unexpected user behavior associated with the logged operations.

  - **Identify User Context**: Validate the identity of users or service principals making changes to the firewall rules. Cross-reference their usernames with organizational access policies to detect any unauthorized access.

  - **Analyze Change Patterns**: Investigate the frequency and pattern of modifications or deletions. Anomalies, such as multiple changes within a short period or actions taken by users with typically no firewall management activity, should be flagged.

  - **Check for Alerts on Unusual Access**: Consult additional security tools (such as EDR or SIEM) for alerts related to unauthorized access to Azure accounts, particularly around the time of the changes detected in the Activity Logs.

  ### Prioritization
  This alert is classified as medium severity as modifications of firewall rules can significantly impact the security of resources within Azure. The risk stems from both the likelihood of unauthorized personnel attempting to alter security configurations and the potential impact of such actions.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if logging for certain administrative operations is not enabled or if Azure Activity Logs are not retained long enough for investigation. The detection logic assumes that the operations are made by legitimate users; thus, it may result in false positives for authorized changes by system administrators. Adequate configurations to capture and retain activity logs are essential for maintaining the effectiveness of this alert.

