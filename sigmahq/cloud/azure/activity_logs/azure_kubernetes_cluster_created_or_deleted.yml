  ---

  ### Technical Context

  This Sigma rule detects the creation or deletion of Azure Kubernetes Clusters, indicating potential infrastructure changes. An attacker may aim to deploy malicious workloads, disrupt services, or exfiltrate data by manipulating Kubernetes environments. This activity relates to the MITRE ATT&CK technique for cloud infrastructure manipulation (T1485), as well as data staging (T1496) or disruption (T1489).

  Primary telemetry sources include Azure Activity Logs, focusing on operations related to Kubernetes connected clusters. If these actions are malicious, they can lead to unauthorized access, service disruption, or data compromise in critical cloud-native applications. It's important to note that this rule does NOT confirm malice on its own, as legitimate users may create or delete clusters as part of routine operations.

  ---

  ### Investigation Steps

  - **Check user identity and user agent:**
    Review the 'caller' field from Azure Activity Logs (Activity Log Event ID 711) to verify if the operator is an unexpected or unauthorized user.

  - **Identify cluster operations:**
    Examine the operationName field for entries related to "MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/WRITE" or "MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/DELETE" within the last 24 hours to confirm alerts are tied to cluster creation/deletion.

  - **Assess cluster lifecycle context:**
    Investigate recent legitimate changes by cross-referencing team schedules or planned changes to see if the cluster alterations align with known administrative activities.

  - **Look for adjacent suspicious activities:**
    Review for additional signs of compromise, such as miscellaneous (unrelated) changes in Azure Activity Logs or unusual API calls made by the same user leading up to the cluster modifications.

  - **Verify system roles and importance:**
    Assess whether the affected clusters host sensitive applications or data. Prioritize investigation if a mission-critical environment is impacted.

  - **Correlate with network and data telemetry:**
    Check for logs indicating data exfiltration or network access to/from the newly created or deleted clusters, such as traffic logs from Azure Firewalls or Network Security Groups, to identify possible data theft.

  ---

  ### Prioritization

  The alert is of low to moderate severity. While individual Kubernetes cluster operations may not directly indicate malicious intent, a cluster's creation or deletion might be exploited for broader attack objectives, especially in sensitive environments. Given the attack surface of Kubernetes in modern cloud architectures, timely investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  Detection relies on complete Azure Activity Log metadata; any gaps may undermine visibility. An attacker could attempt to evade detection by using legitimate credentials or deploying changes during off-hours. Additionally, internal processes or policies may necessitate cluster modifications, which could trigger false positives. Companion detections, such as monitoring for unusual access patterns in Azure RBAC, would enhance coverage and contextualize alerts.

