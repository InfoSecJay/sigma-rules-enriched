note: |
  ### Technical Context

  This rule detects the creation or deletion of Azure Kubernetes clusters, indicating potentially unauthorized modifications to container orchestration environments. Attackers may exploit this ability to deploy malicious workloads, disrupt services, or exfiltrate data. The relevant MITRE ATT&CK tactics and techniques include **Resource Hijacking (T1485)** and **Cloud Service Dashboard (T1496)**. This detection relies on Azure Activity Logs that specifically highlight actions related to Azure Kubernetes Service (AKS) management.

  If malicious, the impacts can include severe service disruptions, exposure of sensitive data, and the establishment of unauthorized services within the environment. Importantly, while this detection identifies potentially harmful activity, it does not confirm intentional malicious behavior or indicate the permission levels of the user performing the action.

  ### Investigation Steps

  - **Verify user identity and permissions:** Check the user account associated with the Azure Activity Log entry (operationName). Legitimate administrators typically follow change management processes and use pre-approved IAM roles. Compare against the organization's known user accounts and roles in Azure.

  - **Check user agent and source IP:** Review the user agent and source IP in the Azure Activity Log to confirm they match expected patterns for your environment. Unfamiliar user agents or source IPs could indicate a malicious actor.

  - **Review cluster operational impacts:** Analyze the time of the cluster creation or deletion against current operational schedules. Confirm whether there were any planned outages or maintenance activities occurring that may explain legitimate changes.

  - **Identify previous cluster activity:** Look for related cluster activity leading up to the event by querying Azure Activity Logs for the same resource. A sudden spike in API calls associated with Kubernetes resource management could suggest reconnaissance or malicious intentions.

  - **Investigate for potential service disruption:** Consider the criticality of the systems affected by the cluster operations. If vital services or applications rely on the affected Kubernetes cluster, the detection should be prioritized for immediate review.

  ### Prioritization

  This alert is of low to medium severity depending on the context of the affected system and the user behavior observed. The likelihood of malicious abuse is moderate, particularly if anomalies in user behavior or IP addresses are noted. Creation or deletion of Kubernetes clusters is often weaponized in cloud environments for various attack vectors, necessitating thorough investigation.

  ### Blind Spots and Assumptions

  The detection may miss creations or deletions executed through automated scripts or trusted applications if appropriate logging is not enabled. It's essential to ensure that Azure Activity Log retention and configurations are correctly set for accurate record-keeping. Legitimate activities such as scheduled maintenance or approved role changes could trigger the alert. Strengthening coverage can be achieved by adding detections for related actions such as modifications to cluster roles and permissions, which could indicate a broader malicious strategy.

