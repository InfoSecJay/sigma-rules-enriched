note: |
  ### Technical Context
  This detection rule identifies the creation or deletion of Azure Kubernetes clusters in an enterprise's Azure environment. Such actions may indicate legitimate administrative activities but could also signify malicious behavior, such as an attacker establishing or dismantling infrastructure for operations within a compromised account. Understanding the context of these changes is critical for incident response.

  Attackers may aim to create new Kubernetes clusters to deploy malicious containerized applications or to hide their activities from detection. They may also delete clusters post-operation to eliminate evidence of their presence. Notable tactics applicable to this behavior include **Impact (T1485)**, where adversaries seek to disrupt availability through malicious alterations or deletions, and **Initial Access (T1496)**, where an unauthorized actor gains control within cloud environments.

  Primary data sources for this detection include Azure Activity Logs, which capture resource creation and deletion events. Additionally, monitoring user accounts and roles involved in these operations can provide context to distinguish between legitimate and potentially malicious actions.

  ### Investigation Steps
  - **Review Activity Logs:** Examine Azure Activity Logs for recorded events related to cluster creation or deletion, focusing on the operation times and associated user identities.
  - **Correlate User Actions:** Investigate the accounts used for these operations. Correlate the identity of users with their roles and permissions, ensuring they have the proper clearance for these actions.
  - **Analyze User Behavior:** Look for patterns in user behavior surrounding the creation or deletion events. Determine if there were unusual access patterns, such as actions taken from unfamiliar IP addresses or during atypical hours.
  - **Cross-Reference Network Security Events:** Review any network traffic logs that may indicate communication with the newly created clusters or unusual data exfiltration attempts that align with the timing of the cluster operations.

  ### Prioritization
  This alert is categorized as low severity; however, it should not be dismissed as it indicates potential changes in the cloud environment that could be used for malicious purposes. The impact could escalate if an unauthorized cluster is used to host malware or exfiltrate data.

  ### Blind Spots and Assumptions
  This detection rule may miss events if Azure Activity Logs are not properly configured to record all relevant actions or if there are gaps in logging capabilities. There is an assumption that the user identities and accounts are well-managed and monitored; any compromised credentials will create significant detection challenges. For effective alerting, logging must be enabled for Azure Activity Logs and monitored for changes in user privileges or roles.

