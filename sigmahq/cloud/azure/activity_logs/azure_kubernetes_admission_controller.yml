logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith:
    - 'MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/ADMISSIONREGISTRATION.K8S.IO'
    - 'MICROSOFT.CONTAINERSERVICE/MANAGEDCLUSTERS/ADMISSIONREGISTRATION.K8S.IO'
    operationName|endswith:
    - '/MUTATINGWEBHOOKCONFIGURATIONS/WRITE'
    - '/VALIDATINGWEBHOOKCONFIGURATIONS/WRITE'
  condition: selection
falsepositives:
- Azure Kubernetes Admissions Controller may be done by a system administrator.
- If known behavior is causing false positives, it can be exempted from the 
  rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications related to Kubernetes admission controllers, specifically when a user creates or modifies MutatingAdmissionWebhook or ValidatingAdmissionWebhook configurations in Azure Kubernetes Service. The likely attacker objective is to gain persistence or compromise the security of the Kubernetes cluster by manipulating pod creation requests, either to introduce malicious containers or to capture sensitive information such as secrets. This behavior aligns with the MITRE ATT&CK tactics and techniques of Privilege Escalation (T1078) and Credential Access (T1552).

  The primary telemetry source for this detection is Azure Activity Logs, specifically looking for events related to the operation of admission registration in Kubernetes. If the actions are malicious, they could lead to unauthorized access or data breaches. However, this detection does not confirm the intent behind the changes to the admission webhooks without additional context; legitimate configuration changes by authorized personnel can also trigger the rule.

  ### Investigation Steps

  - **Check Azure Activity Logs:** Review Azure Activity Logs for Event Type: “Operation” and filter for `operationName` entries starting with `MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS` or `MICROSOFT.CONTAINERSERVICE/MANAGEDCLUSTERS`. Look for entries involving `MUTATINGWEBHOOKCONFIGURATIONS/WRITE` or `VALIDATINGWEBHOOKCONFIGURATIONS/WRITE`.

  - **Identify suspicious modifications:** Assess the `properties` field in the logs to identify whether the webhook configurations include unrecognized or potentially malicious container images, or if they are targeting sensitive namespaces.

  - **Review access controls:** Evaluate any changes in Role-Based Access Control (RBAC) linked to the SANDBOX environment. Identify whether any unauthorized principal has been granted write access to webhook configurations through `RoleAssignments`.

  - **Examine legitimate behavior patterns:** Compare recent webhook creation/modification logs against known system administrator behavior. Identify expected patterns, such as typical JSON configurations or timestamps aligning with maintenance windows.

  - **Correlate with known indicators:** Look for signs of malicious activity such as known bad container images in the webhook configuration data, or correlate with threat intelligence feeds for identification of malicious webhook patterns.

  - **Check for additional security configurations:** Review any related detections or alerts in your Security Information and Event Management (SIEM) platform that may indicate broader Kubernetes-related threats, such as unusual API calls or unexpected deployment activities in the cluster.

  ### Prioritization

  This alert should be treated with medium priority because unauthorized modifications to admission controllers can significantly compromise the integrity of the Kubernetes environment. While the likelihood of abuse is moderate, the potential impact on sensitive data and services is critical, making this behavior warrant further investigation. Admission controllers are commonly targeted by adversaries for persistence and access, increasing the overall risk.

  ### Blind Spots and Assumptions

  This detection may struggle against evasion techniques such as legitimate privilege escalation or misconfigured RBAC rules that allow unauthorized users to modify webhook configurations unnoticed. Reliable detection requires full access to Azure Activity Logs and appropriate monitoring of account permissions within the cluster environment. Legitimate activities such as routine updates by vetted system admins could trigger this alert mistakenly. Companion detections should include alerting on unusual deployment patterns or changes in Kubernetes API interactions to strengthen coverage against potential abuse.

