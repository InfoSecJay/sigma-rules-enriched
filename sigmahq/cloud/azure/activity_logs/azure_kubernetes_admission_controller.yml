logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith:
    - 'MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/ADMISSIONREGISTRATION.K8S.IO'
    - 'MICROSOFT.CONTAINERSERVICE/MANAGEDCLUSTERS/ADMISSIONREGISTRATION.K8S.IO'
    operationName|endswith:
    - '/MUTATINGWEBHOOKCONFIGURATIONS/WRITE'
    - '/VALIDATINGWEBHOOKCONFIGURATIONS/WRITE'
  condition: selection
falsepositives:
- Azure Kubernetes Admissions Controller may be done by a system administrator.
- If known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This rule detects the use of Azure Kubernetes Admission Controllers, specifically when an admission webhook is executed. Admission controllers are mechanisms in Kubernetes that intercept requests to the API server, allowing administrators to enforce policies on resource creation and modification. However, an attacker can exploit these webhooks for malicious activities, such as inserting backdoors or capturing sensitive information like credentials.

  In a potential threat scenario, an adversary with access to the cluster could deploy a malicious admission controller as a `MutatingAdmissionWebhook`, allowing them to automatically modify any new pods to include malicious containers. Alternatively, a `ValidatingAdmissionWebhook` could be used to capture and record sensitive information from API requests, like secrets. This behavior aligns with multiple MITRE ATT&CK tactics, including **Initial Access (TA0001)**, **Privilege Escalation (TA0004)**, **Persistence (TA0003)**, and **Credential Access (TA0006)**, particularly techniques like **T1078** (Valid Accounts) and **T1552.007** (Application Layer Protocol).

  The primary data sources for this detection include Azure activity logs related to Kubernetes operations, specifically logs that capture events associated with AdmissionRegistration and webhook configuration changes.

  ### Investigation Steps
  - **Review Admission Controller Logs:** Examine Azure activity logs for entries related to `AdmissionRegistration.k8s.io` to identify any unauthorized or unusual configuration changes.
  - **Analyze Pod Creation Events:** Investigate pod creation logs to determine if any pods were altered with malicious containers through the admission webhook.
  - **Inspect Webhook Configurations:** Look for newly created or modified `MutatingWebhookConfiguration` and `ValidatingWebhookConfiguration` resources, analyzing their payloads and any endpoints they connect to.
  - **Check for Anomalous Access:** Monitor activity for unusual API requests or access patterns that may indicate an adversary is attempting to capture sensitive information via interception.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized access and persistence methods in a Kubernetes environment. Attackers leveraging admission controllers pose a significant risk to the integrity and confidentiality of the cluster and its workloads.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include environments where logging for Kubernetes API calls is not properly configured or secured. The detection logic assumes that all legitimate access to admission controller operations is expected behavior, meaning that misconfigurations or approved administrative actions could generate false positives. For this alert to function effectively, logging for Azure activity must be enabled and properly configured to capture all relevant events related to admission controllers.

