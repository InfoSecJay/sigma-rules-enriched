logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith:
    - 'MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/ADMISSIONREGISTRATION.K8S.IO'
    - 'MICROSOFT.CONTAINERSERVICE/MANAGEDCLUSTERS/ADMISSIONREGISTRATION.K8S.IO'
    operationName|endswith:
    - '/MUTATINGWEBHOOKCONFIGURATIONS/WRITE'
    - '/VALIDATINGWEBHOOKCONFIGURATIONS/WRITE'
  condition: selection
falsepositives:
- Azure Kubernetes Admissions Controller may be done by a system administrator.
- If known behavior is causing false positives, it can be exempted from the 
  rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of admission controllers within Azure Kubernetes environments, specifically focusing on the actions related to MutatingAdmissionWebhook and ValidatingAdmissionWebhook configurations. Attackers may leverage these webhooks to manipulate Kubernetes API requests, gaining persistence by ensuring malicious containers are injected into newly created pods, or intercepting and stealing sensitive information such as access credentials. The relevant MITRE ATT&CK tactics include Persistence (TA0003), Credential Access (TA0006), and Privilege Escalation (TA0004), specifically techniques T1078 (Valid Accounts) and T1552 (Credential Access).

  The primary telemetry source for this detection comes from Azure activity logs, particularly those events associated with Kubernetes admission controller configurations (read/write actions). If malicious, such behavior could compromise the integrity of Kubernetes workloads and expose sensitive information or infrastructure. Importantly, this detection alone does not confirm adversarial intent, as legitimate administrators may perform similar actions for valid operational reasons.

  ### Investigation Steps

  - **Check admission configuration activity logs**: Review Azure activity logs for Event Type: "Write" on "/MUTATINGWEBHOOKCONFIGURATIONS" and "/VALIDATINGWEBHOOKCONFIGURATIONS". Look specifically for operation names beginning with 'MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/ADMISSIONREGISTRATION.K8S.IO'.

  - **Assess administrator credentials**: Confirm if the users making these modifications have elevated permissions. Review Azure's Role-Based Access Control (RBAC) settings for any users with roles such as "Kubernetes Cluster Admin" or "Kubernetes Cluster User".

  - **Identify known benign activities**: Validate if the operation correlates with known legitimate administrative changes, such as scheduled pods or application deployments involving admission controllers. Contextualize the changes based on recent changes in Kubernetes manifest files or CI/CD pipeline activities.

  - **Examine webhook behavior**: Analyze current webhook configurations for any anomalies. Malicious webhooks might include external endpoints or suspicious code snippets that do not match the organization's typical deployment patterns.

  - **Query connection history**: Investigate logs for unusual access patterns or source IPs associated with Kubernetes API requests from services outside of the expected administrative networks. Check Activity Log entries for any suspicious source IPs or excessive write operations.

  - **Look for sensitive data exposure**: Query logs for API request activities that involve sensitive information, such as secrets or config maps. Check if any entries exhibit anomalies or high-risk operations, particularly during unexpected timeframes.

  ### Prioritization

  This alert warrants medium severity due to the potential impact of unauthorized modifications in Kubernetes environments, which can lead to persistence, malicious code execution, or credential theft. The likelihood of adversarial use is moderate, as this method has been weaponized in various attack campaigns targeting Kubernetes infrastructure.

  ### Blind Spots and Assumptions

  Detection is limited by scenarios where legitimate administrative actions may trigger the rule, such as routine updates or configurations by trusted users. Required logs must be configured to capture Kubernetes admission controller activities comprehensively, with risk that misconfigured environments may underreport relevant events. Common evasion techniques include legitimate users creating webhooks under normal operational parameters, thus camouflaging malicious changes. A related detection to enhance coverage could include monitoring for unusual patterns in Linux process executions (e.g., execution of a container runtime), potentially indicating exploitation of identified vulnerabilities.

