  ---

  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Application Gateways, which can be indicative of unauthorized changes to cloud infrastructure. An attacker may seek to disrupt services, exfiltrate data, or weaponize the application gateway for exploitation purposes. This activity aligns with the MITRE ATT&CK tactic of "Impact" (TA0040) and the technique of "Network Intrusion" (T1499).

  The primary telemetry source is Azure Activity Logs, specifically looking for events involving the operations MICROSOFT.NETWORK/APPLICATIONGATEWAYS/WRITE and MICROSOFT.NETWORK/APPLICATIONGATEWAYS/DELETE. The security impact could range from service outages to data breaches if these changes are made maliciously. It is crucial to note that this detection only indicates a change occurred and does not confirm whether the change was authorized or malicious.

  ---

  ### Investigation Steps

  - **Review Azure Activity Logs:** Check Azure Activity Logs (Resource Provider Operations) for Event IDs related to APPLICATIONGATEWAYS/WRITE and APPLICATIONGATEWAYS/DELETE. Identify the user account making the changes and verify if it corresponds to an authorized administrator.

  - **Analyze User Identity Details:** Investigate the user identity performing the operation. Look for anomalies in identity, such as unfamiliar accounts or accounts with insufficient permissions attempting to modify or delete application gateways.

  - **Examine User Agents and Hostnames:** Assess the user agents and hostnames involved in the modification or deletion actions. Ensure they match expected administrative behavior. For example, modifications from an unexpected IP or device could indicate malicious intent.

  - **Identify Change Impact:** Verify what changes were made to the application gateway configuration, such as updating listener settings or backend pools. Changes should align with documented maintenance activities.

  - **Cross-reference with Change Management:** Compare modification records with internal change management systems to confirm if the actions were pre-approved. Legitimate changes should have clear documentation in service tickets or project management tools.

  - **Look for Signs of Exfiltration:** If an application gateway was deleted, investigate for any log entries that suggest the data was exfiltrated prior to deletion. Check for unusual outbound traffic patterns or API calls around the time of the deletion event.

  ---

  ### Prioritization

  This alert is of medium severity as it indicates potential unauthorized changes to critical network infrastructure, which could lead to service disruption or data exposure. The likelihood of this behavior being weaponized is significant due to the strategic value of application gateways in cloud environments. Determining whether such changes are malicious or legitimate will be key in prioritizing the investigation.

  ---

  ### Blind Spots and Assumptions

  There are potential limitations in detecting unauthorized changes if logging configurations are incomplete or if log retention policies are inadequate, particularly around administrative actions. Legitimate operational changes from trusted administrators can often trigger these alerts; thus, normal change management practices should be scrutinized to reduce false positives. Related detections, such as suspicious API calls or unusual user activity patterns, can strengthen the overall security posture and provide additional context to the investigation.

