note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of Azure Application Gateways in a cloud environment. Application Gateways are essential components in Azure, providing load balancing and security features for web applications. When an attacker gains access to Azure management capabilities, they might attempt to modify or delete these gateways to disrupt services, exfiltrate data, or perform lateral movement within the cloud infrastructure.

  The likely attacker objectives in this scenario include creating denial-of-service conditions, undermining application security configurations, or establishing footholds for further malicious activities. This behavior aligns with the MITRE ATT&CK framework under the tactics of **Impact** (TA0040), particularly involving the technique **Data Loss** (T1485) and **Service Stop** (T1440).

  The primary data sources for this detection include Azure Activity Logs, which record all changes and accesses to resources, and are crucial for monitoring actions taken on Application Gateways.

  ### Investigation Steps
  - **Review Activity Logs**: Examine the Azure Activity Logs for entries related to Application Gateways, focusing on the specific operation names for modifications or deletions. Look for timestamps and user identities associated with the actions.

  - **Identify User Context**: Assess the user account that performed the modification or deletion. Investigate whether the actions were carried out by a privileged account and if the user’s recent activity matches expected behavior, particularly for administrators.

  - **Analyze Source IP and Hostnames**: Correlate the user actions with the source IP and hostname to identify any anomalous access patterns. Investigate if the actions came from known management locations versus unexpected or external sources.

  - **Validate Application State**: Confirm the current state of the Application Gateway post-modification or deletion. Evaluate the impact on associated services and ensure there are no further malicious changes that were not detected.

  ### Prioritization
  The severity of this alert is medium due to the potential risk of significant service disruption and data loss within the enterprise. The threat's impact is heightened if the changes originate from compromised accounts or malicious actors.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logging for Azure Activity Logs is misconfigured or if activity logs are not retained adequately. This rule assumes that legitimate actions by system administrators or known users have been documented and that anomalous behaviors are effectively highlighted. To optimize detection accuracy, ensure that logging is enabled, with necessary permissions and activity tracking in place for comprehensive visibility into Azure resource management.

