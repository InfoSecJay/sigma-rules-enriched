note: |
  ### Technical Context

  This Sigma rule detects when an Azure Application Gateway is modified or deleted via the Azure Activity Logs. The likely attacker objective is to disrupt network traffic management or exploit misconfigurations for unauthorized access. The relevant MITRE ATT&CK tactic is "Impact" (TA0040), and the technique is "Application Layer Protocol Manipulation" (T1095). Primary telemetry sources include Azure Activity Logs, specifically focusing on operation names like `MICROSOFT.NETWORK/APPLICATIONGATEWAYS/WRITE` and `MICROSOFT.NETWORK/APPLICATIONGATEWAYS/DELETE`. If malicious, this activity can lead to network downtime, data exfiltration, or unauthorized access points being created. This detection does not confirm that the action is malicious on its own, as legitimate changes by system administrators may also trigger this rule.

  ### Investigation Steps

  - **Identify user activity**: Check Azure Activity Logs for Event Details (operation name, resource ID) associated with the modification or deletion. Record the triggering user identity and compare against known administrative users.

  - **Review user agent**: Validate if the user agent associated with the action is expected for administrative tasks. Potential anomalies (e.g., known non-administrative user agents) should raise further investigation.

  - **Assess operational necessity**: Verify if the detected modification or deletion aligns with scheduled maintenance or legitimate changes. Check change management records for correlation with administrative actions.

  - **Cross-reference modification type**: For modified gateways, examine configuration properties in the Azure Activity Logs' Event Details. Note any significant changes to SSL settings, backend pools, or routing rules that could pose a risk.

  - **Correlate with other alerts**: Investigate if there are concurrent alerts in Azure Security Center indicating abnormal activities, such as unusual login patterns or excessive changes to Azure resources by the same user.

  ### Prioritization

  This alert has medium severity due to the potential impact on essential network services managed by the Application Gateway. While legitimate administrative changes can be common, modifications by unauthorized users or at unusual times may indicate malicious intent, necessitating thorough investigation.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of valid credentials by adversaries who have gained insider access or are leveraging compromised accounts to conduct modifications. Ensuring Azure Activity Logs are properly integrated and retention settings are configured is crucial for reliable detection. Legitimate activities, such as scheduled maintenance or bug fixes, may trigger this alert. A related detection to strengthen coverage includes alerts on unauthorized access to Azure resources leveraging Azure Active Directory logs (for user sign-ins and role assignments).

