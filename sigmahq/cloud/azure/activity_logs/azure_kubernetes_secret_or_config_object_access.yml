note: |
  ### Technical Context
  This detection rule focuses on identifying when Kubernetes accounts access sensitive objects, specifically ConfigMaps and Secrets, within an Azure Kubernetes Service (AKS) environment. The primary threat scenario involves potential unauthorized access or modification of these sensitive Kubernetes objects, which could lead to data exfiltration, configuration changes, or the execution of malicious payloads. Attackers may exploit compromised service accounts or credentials to access these resources, achieving objectives such as privilege escalation or lateral movement within the cluster.

  Relevant MITRE ATT&CK tactics and techniques applicable to this detection include:
  - **Data Manipulation (T1485)**: The unauthorized modification of sensitive objects can lead to adverse effects on application integrity.
  - **Access Token Manipulation (T1496)**: An attacker may leverage privileges associated with Kubernetes accounts to manipulate sensitive data.
  - **Insecure Container Orchestration (T1489)**: Abuse of container orchestration services to access sensitive data exemplifies insecure deployment practices.

  The primary data sources for this detection include Azure's activity logs, specifically those monitoring operations related to Kubernetes services. These logs encompass activities from Kubernetes connected clusters that detail access to ConfigMaps and Secrets.

  ### Investigation Steps
  - **Review Activity Logs**: Examine Azure activity logs for `MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/CONFIGMAPS/WRITE`, `DELETE` and `SECRETS/WRITE`, `DELETE` operations. Identify which accounts initiated these actions and from what user agents.
  - **Verify User Context**: Investigate the user or service account involved in the access. Check for any prior suspicious activity associated with the account and ascertain if they should have permissions to access sensitive Kubernetes objects.
  - **Inspect Recent Changes**: Look for any recent changes to the Kubernetes role-based access control (RBAC) settings that might have granted elevated privileges to users or services. Ensure that access policies align with least privilege principles.
  - **Cross-check with Known Baselines**: Compare access patterns against established baselines for your Kubernetes environment to identify anomalies or deviations. Pay particular attention to access requests from unfamiliar user agents or sources.

  ### Prioritization
  This alert has medium severity due to the significant potential impact of unauthorized access to Kubernetes Secrets and ConfigMaps on overall security posture. Given the likelihood of such access being exploited for malicious purposes in a cloud-native environment, prompt investigation is crucial.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the Azure activity logs are not configured to capture all Kubernetes interactions or if certain access patterns are expected and deemed legitimate. Assumptions made by the detection logic include the need for adequate IAM policies in place that limit access to sensitive objects. To ensure the alert functions effectively, it is essential to have activity logs enabled for all Kubernetes operations and to regularly review RBAC configurations and permissions within the AKS environment.

