note: |
  ### Technical Context

  This rule detects access events to sensitive Kubernetes objects such as ConfigMaps and Secrets via unauthorized write or delete operations. The likely objective of an attacker is to exfiltrate, manipulate, or remove sensitive configuration data that could be leveraged for further attacks, including escalation of privileges or lateral movement within the cloud environment. This activity corresponds to MITRE ATT&CK tactics including **Credential Access (T1485)** and **Data Manipulation (T1496)**, as well as **Impact (T1489)**.

  Primary telemetry sources include Azure Activity Logs, specifically focusing on operations involving Kubernetes configurations. The potential security impact of malicious behavior includes exposing sensitive application secrets or causing operational disruption. This detection does NOT confirm malicious intent on its own; legitimate system administrators may also trigger these alerts during routine updates or maintenance.

  ### Investigation Steps

  - **Verify user identity and role:** Check the identity of the user initiating the event using Azure Activity Logs. Look for unexpected administrators or service accounts performing write/delete operations on ConfigMaps or Secrets.

  - **Review operation details:** Check for specific operation names in the logs, such as `MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/SECRETS/WRITE`. If any operations are executed unexpectedly outside of a recognized maintenance window, this may indicate malicious behavior.

  - **Assess the context of access:** Validate the user agent and source IP in the event logs. Identify whether the access occurred from a known or trusted network. Access from unfamiliar users or locations warrants deeper investigation.

  - **Identify recent changes:** Examine the timeline of changes made to ConfigMaps or Secrets. If there are multiple deletions or modifications in a short timeframe, correlate with other logging for suspicious activity or potential insider threats.

  - **Determine legitimate access patterns:** Cross-reference schedules for known administrative tasks. Check for documented processes and whether the user performing the access aligns with normal operational behavior.

  - **Look for high-confidence malicious indicators:** Search for logs where both write and delete operations are performed in a single session, indicating possible tampering with sensitive configurations. Use Azure Activity Logs and filter by `Microsoft.Kubernetes` and activity types to identify these patterns.

  ### Prioritization

  This alert is of medium severity due to the critical role of Kubernetes secrets and config objects in application security. While the probability of malicious abuse exists, particularly in cloud environments, many benign administrative actions could trigger it. Nonetheless, repeated or suspicious access attempts should be prioritized for deeper investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate activities, such as maintenance tasks, causing false positives, especially when executed by system administrators. Reliable detection requires complete Azure Activity Log configuration for Kubernetes operations to ensure coverage. Additionally, consider known workflows or common applications that regularly access these objects; such benign activity might lead to elevated alerting. A companion detection that strengthens coverage would be alerts on Kubernetes RBAC changes that precede unauthorized access attempts.

