title: Azure Kubernetes CronJob
id: 1c71e254-6655-42c1-b2d6-5e4718d7fc0a
status: test
description: |
  Identifies when a Azure Kubernetes CronJob runs in Azure Cloud. Kubernetes Job is a controller that creates one or more pods and ensures that a specified number of them successfully terminate.
  Kubernetes Job can be used to run containers that perform finite tasks for batch jobs. Kubernetes CronJob is used to schedule Jobs.
  An Adversary may use Kubernetes CronJob for scheduling execution of malicious code that would run as a container in the cluster.
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- https://kubernetes.io/docs/concepts/workloads/controllers/job/
- https://www.microsoft.com/security/blog/2020/04/02/attack-matrix-kubernetes/
author: Austin Songer @austinsonger
date: 2021-11-22
modified: 2022-12-18
tags:
- attack.persistence
- attack.t1053.003
- attack.privilege-escalation
- attack.execution
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith:
    - 'MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/BATCH'
    - 'MICROSOFT.CONTAINERSERVICE/MANAGEDCLUSTERS/BATCH'
    operationName|endswith:
    - '/CRONJOBS/WRITE'
    - '/JOBS/WRITE'
  condition: selection
falsepositives:
- Azure Kubernetes CronJob/Job may be done by a system administrator.
- If known behavior is causing false positives, it can be exempted from the 
  rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of Azure Kubernetes CronJobs, which are used to schedule one or more Jobs that run finite tasks within a Kubernetes cluster. An adversary might exploit CronJobs to deploy and execute malicious containers, often to automate tasks like data exfiltration, lateral movement, or persistent access. This behavior aligns with the MITRE ATT&CK framework under the tactic of "Execution" (T1053.003) and involves scheduled execution of potentially harmful workloads.

  Primary telemetry for this detection comes from Azure Activity Logs, specifically tracking operations under `MICROSOFT.KUBERNETES` and `MICROSOFT.CONTAINERSERVICE`. If this activity is malicious, it poses a significant security risk as it could facilitate unauthorized actions within the cluster. However, this detection does NOT confirm malicious intent or execution on its own; it requires further investigation to contextualize the motive.

  ### Investigation Steps

  - **Review specific Azure Activity Logs:** Examine logs for operations related to `/CRONJOBS/WRITE` and `/JOBS/WRITE` under **Event Category: ResourceManagement** to identify recent CronJob activities. Focus on `operationName` and `status` fields.

  - **Identify legitimate scheduled tasks:** Verify if the detected CronJob was planned by a known system administrator. Cross-reference with scheduled tasks documented in the organization’s change management or governance policies.

  - **Check for unusual container images:** Inspect the cron job configurations for any containers executing from unusual or unapproved images (e.g., images not from the organization’s registry). Look for `image` fields in the job specifications.

  - **Assess the role of initiators:** Check the **caller** field in the logs. If the initiator is a non-administrator user or an unexpected service principle, flag this as a high-confidence malicious indicator.

  - **Examine resource consumption:** Monitor the resource usage of running pods created by these CronJobs (e.g., CPU and memory). Unusual spikes or sustained high usage could indicate malicious activity, especially if not aligned with expected behavior.

  ### Prioritization

  This alert carries medium severity because it involves potential unauthorized execution within a critical cloud infrastructure component. The risk escalates if the affected cluster houses sensitive applications or data. Given that adversaries often manipulate scheduled tasks, this behavior warrants close examination.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Azure Activity Logs; ensure logging is sufficiently detailed to capture all relevant actions. Evasion techniques can include legitimate CronJob usage by administrators, which may trigger this alert. Common activities like routine backups or automated maintenance scripts can also generate similar alerts. A related detection to enhance coverage includes monitoring for unauthorized changes to Kubernetes deployments or configurations, identifying potential persistence vectors.

