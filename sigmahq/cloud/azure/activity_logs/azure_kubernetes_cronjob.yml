title: Azure Kubernetes CronJob
id: 1c71e254-6655-42c1-b2d6-5e4718d7fc0a
status: test
description: |
  Identifies when a Azure Kubernetes CronJob runs in Azure Cloud. Kubernetes Job is a controller that creates one or more pods and ensures that a specified number of them successfully terminate.
  Kubernetes Job can be used to run containers that perform finite tasks for batch jobs. Kubernetes CronJob is used to schedule Jobs.
  An Adversary may use Kubernetes CronJob for scheduling execution of malicious code that would run as a container in the cluster.
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
- https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- https://kubernetes.io/docs/concepts/workloads/controllers/job/
- https://www.microsoft.com/security/blog/2020/04/02/attack-matrix-kubernetes/
author: Austin Songer @austinsonger
date: 2021-11-22
modified: 2022-12-18
tags:
- attack.persistence
- attack.t1053.003
- attack.privilege-escalation
- attack.execution
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith:
    - 'MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/BATCH'
    - 'MICROSOFT.CONTAINERSERVICE/MANAGEDCLUSTERS/BATCH'
    operationName|endswith:
    - '/CRONJOBS/WRITE'
    - '/JOBS/WRITE'
  condition: selection
falsepositives:
- Azure Kubernetes CronJob/Job may be done by a system administrator.
- If known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This rule detects the execution of Azure Kubernetes CronJobs, which are scheduled tasks that run inside a Kubernetes cluster. By leveraging CronJobs, attackers can potentially automate the execution of malicious containers, helping them to maintain access or perform other malicious actions without continuous human oversight. The attacker might aim to deploy these containers for data exfiltration, lateral movement within the cluster, or even as a part of a larger orchestration of a sophisticated attack.

  The relevant MITRE ATT&CK tactics include **Execution (T1203)**, where the attacker executes code through established methods, and **Persistence (T1053.003)**, since CronJobs can maintain execution over time in an environment. This creates a permanent presence, enabling further exploitation. Within the cloud context, it is essential to monitor operations that involve Kubernetes as adversaries may exploit these legitimate services to conduct nefarious activities, bypassing traditional security controls.

  Primary data sources include Azure Activity Logs, specifically monitoring for `operationName` events indicating CronJob or Job creation and scheduling. Monitoring these logs is crucial for detecting any potentially unauthorized CronJob configurations that may indicate compromise.

  ### Investigation Steps
  - **Review Activity Logs**: Check Azure Activity Logs for any `CRONJOBS/WRITE` or `JOBS/WRITE` operations that were executed. Look for unusual timestamps, user accounts, or patterns that deviate from normal administrator behavior.
  - **Analyze Kubernetes Configurations**: Inspect Kubernetes configurations to identify any recently added or modified CronJobs. Pay close attention to the command and image configurations of these jobs for signs of malicious code or suspicious behaviors.
  - **Correlate with User Actions**: Cross-reference the timing of the CronJob events with user activity logs. Validate whether system administrators were involved and whether their activities are justifiable and legitimate based on established change management protocols.
  - **Monitor Pod Activity**: Investigate the pods created by the CronJobs for any unexpected network activity or resource usage patterns. This can indicate that the containers are running malicious actions or communicating with external command and control servers.

  ### Prioritization
  The alert has medium severity due to the potential for automated malicious activities that can escalate privileges or maintain persistent access to cloud resources. If left undetected, these behaviors could lead to significant breaches, data loss, or service disruptions.

  ### Blind Spots and Assumptions
  One key gap in detection is the reliance on the accuracy and completeness of Azure Activity Logs; any configuration that does not log CronJob actions may go unnoticed. Additionally, the logic assumes that all CronJob creations are malicious unless proven otherwise, which could lead to false positives from legitimate administrative tasks. To successfully detect these events, it is essential that Azure Activity Logs are correctly configured and that appropriate retention policies are in place to capture critical event history.

