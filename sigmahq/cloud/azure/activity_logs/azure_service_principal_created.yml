  ### Technical Context
  This detection rule identifies the creation of service principals in Azure, which are critical components for managing access to applications and other Azure resources. When a new service principal is created, it can indicate that an application or service will be granted permissions to interact with Azure resources on behalf of a user or application. However, malicious actors may also create service principals to gain unauthorized access to sensitive data or services, significantly increasing their capability to operate undetected within the Azure environment.

  The likely objectives of an attacker creating a service principal include establishing persistence, escalating privileges, or exfiltrating data. When exploited improperly, service principals can serve as vectors for lateral movement, privilege escalation, or data theft, especially if combined with compromised credentials or configurations. This activity resonates with the MITRE ATT&CK framework tactically under **Defense Evasion (T1070)**, as attackers might use legitimate tools and features to obscure their actions.

  The primary data source to monitor for this detection is the **Azure Activity Logs**, which capture detailed audit logs of actions taken on Azure resources, including the creation of service principals.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Start by examining the Azure Activity Logs for entries related to service principal creation. Look for unexpected or unusual timestamps, users, or applications tied to these events.
  - **Examine User Identity and Context**: Investigate the identity of the user generating the service principal. Analyze whether this user typically performs such actions, and check their previous activity for any anomalies or indicators of compromise.
  - **Assess Permissions Granted**: Analyze the permissions that the newly created service principal has been granted. Ensure that they align with the principle of least privilege and do not inadvertently expose sensitive data or services.
  - **Monitor for Follow-Up Actions**: Keep an eye on any subsequent actions taken by the service principal, such as API calls or resource access. This can reveal whether the service principal is being used for legitimate purposes or malicious activity.

  ### Prioritization
  The severity of this alert is considered medium because while service principals are common and often created by legitimate administrators, their creation by unexpected users or under unusual circumstances hints at potential malicious activity that could undermine Azure security and lead to data breaches.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the inability to distinguish between genuine usage and malicious intent concerning service principal creation without thorough user context. The detection logic assumes that any creation of a service principal by previously authenticated and authorized users is legitimate, potentially overlooking compromised accounts. Additionally, it requires that Azure Activity Logs are configured to capture all relevant security events, which may not always be the case in various environments where logging policies differ.

