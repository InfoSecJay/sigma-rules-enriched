  ---

  ### Technical Context

  This rule detects the creation of a service principal in Azure, a critical action that allows applications to authenticate to Azure resources. The likely attacker objective is to establish a foothold within the Azure environment, enabling further actions such as privilege escalation or unauthorized access to data and services. This behavior is mapped to the MITRE ATT&CK technique for "Service Account Creation" (T1098) under the "Defense Evasion" tactic.

  The primary telemetry source for this alert is Azure Activity Logs, which capture administrative actions taken within Azure environments. If this behavior is malicious, the security impact includes unauthorized access, potential data exfiltration, and the risk of lateral movement within the cloud infrastructure. Importantly, this detection does NOT confirm malicious intent without additional context; legitimate administrators may also create service principals for valid operational needs.

  ---

  ### Investigation Steps

  - **Identify the user creating the service principal:** Check Azure Activity Logs for the `initiatedBy` field and confirm the user’s identity (e.g., User Principal Name). Consider legitimate users such as system administrators versus unfamiliar or unexpected accounts.

  - **Review creation time and context:** Validate the `eventTime` field in the Azure Activity Logs to check if the service principal was created outside of regular business hours or during unusual patterns, which could indicate malicious intent.

  - **Correlate with recent activities:** Analyze any preceding or subsequent logs for the same user to identify related operations (such as permission changes) in Azure Activity Logs, focusing on `properties.message` for "Add service principal" events.

  - **Verify service principal permissions:** Check the permissions granted to the new service principal by querying Azure RBAC settings. Malicious service principals may have excessive permission levels (e.g., Contributor or Owner roles).

  - **Document legitimate service principal patterns:** Reference previous known good activities for creating service principals within your organization to compare typical user agents and hostnames, validating against any unusual changes in the Azure environment.

  - **Assess for indicators of compromise:** Look for signs of abnormal behavior linked to the service principal's actions post-creation, such as access attempts to sensitive resources. Review Azure Activity Logs for operations that the service principal performs shortly after its creation.

  ---

  ### Prioritization

  This alert is of medium severity, as the creation of a service principal can have significant implications, especially if perpetrated by a potentially compromised or unauthorized user. The likelihood of malicious abuse is moderate, as attackers often leverage service principals to facilitate persistence and further operations in cloud environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the reliance on comprehensive logging configurations in Azure, as any misconfiguration could impair the ability to detect unauthorized actions. Legitimate administrative actions—such as proactive management by IT teams—might also trigger this alert. A related detection to strengthen coverage is monitoring for "Service Principal Management" activities, as unusual patterns might indicate compromise attempts.

