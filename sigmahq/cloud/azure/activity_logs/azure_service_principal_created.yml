note: |
  ### Technical Context

  This rule detects the creation of service principals within Azure Active Directory, which are utilized to manage access for applications, services, or users to Azure resources. The likely objective for an attacker could be to establish unauthorized access to resources, facilitating lateral movement or persistence within the environment. This behavior aligns with the MITRE ATT&CK technique **Credential Access: Service Account Credential** (T1078.003).

  The primary telemetry source is Azure Activity Logs, specifically looking for log entries with messages indicating the addition of a service principal. If malicious, this activity may grant an attacker unintended access to Azure applications and resources. Importantly, this detection does not confirm malicious intent on its own; legitimate service principal creation by authorized users is common.

  ### Investigation Steps

  - **Examine the user identity creating the service principal:** Identify the user account in the Activity Log Event with relevant fields such as `initiated-by.user.id`. Verify if the action aligns with the user’s role; unexpected users should be flagged.

  - **Review creation timestamps of service principals:** Cross-reference the creation timestamp in the log entries with scheduled changes or updates. Legitimate service principal creation is often part of planned deployments or development workflows.

  - **Identify associated user agent and IP address:** Investigate the `initiated-by.userAgent` and `initiated-by.ipAddress` fields to corroborate the source of the request. Unusual user agents or IP addresses, especially from external sources, should raise suspicion.

  - **Check for additional Azure resource modifications:** Look for related logs (e.g., Role Assignments) in the Activity Log (Event Type: "Microsoft.Authorization/roleAssignments/write") around the same timestamp to identify any concurrent suspicious activity indicative of escalation.

  - **Analyze service principal permission levels:** Identify the permissions associated with the created service principal by reviewing the associated `properties.appRoleAssignments` field. Excessive permissions, especially for unknown entities, indicate potential misuse.

  ### Prioritization

  The alert severity is medium due to the potential for higher impact if a malicious user creates a service principal with wide-ranging access. The likelihood of abuse is moderate, as accessing Azure resources through service principals is a common approach for attackers. While not all service principal creation is weaponized, its misuse can lead to significant security risks.

  ### Blind Spots and Assumptions

  Detection may be limited if Azure Activity Logging is not correctly configured to record all relevant events or if complex permission structures exist. Legitimate activities such as application onboarding or infrastructure changes could trigger the alert, suggesting a need for contextual awareness. A related detection to bolster coverage would be monitoring the modification of existing service principals or unexpected role assignments, ensuring comprehensive visibility into potential abuse.

