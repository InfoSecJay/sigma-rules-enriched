note: |
  ### Technical Context

  This Sigma rule detects the creation of a service principal in Azure, which can be indicative of an unauthorized attempt to gain access rights in an Azure environment. The likely attacker objective is to establish a service principal for operating or executing tasks that require elevated privileges, similar to a user account. This behavior aligns with the MITRE ATT&CK tactic of "Initial Access" (TA0001) and the technique "Application Layer Protocol" (T1071), as an attacker may use service principals to perform actions on behalf of applications.

  The primary telemetry source for this detection comes from Azure Activity Logs, specifically the event logs that denote service principal actions. If malicious, the creation of a service principal can lead to unauthorized access to sensitive resources or data within Azure. It is important to note that this detection does NOT confirm intent or subsequent malicious actions; it solely identifies the act of creation.

  ### Investigation Steps

  - **Verify the user and context of creation:** Check the `userIdentity` field in the Activity Log for the user account that triggered the event. Determine if the user has a legitimate reason to create a service principal based on their role and previous activities.

  - **Review related authentication logs:** Inspect Azure AD sign-in logs (Event ID 4624) for the same user account within a realistic timeframe to confirm if they have logged in or made other changes that align with typical admin activities.

  - **Assess the service principal's properties:** Examine the associated properties of the service principal creation event for unusual configurations, such as overly permissive roles or unfamiliar application IDs. This could indicate potential abuse or malicious intent.

  - **Identify recent changes in the Azure environment:** Look for other recent changes made by the same user or from the same IP address in the Azure Activity Log, especially around times of high administrative activity, which may indicate operational tasks versus potentially malicious actions.

  - **Understand legitimate service principal creation:** Service principals are often created by automated services or approved applications (e.g., CI/CD pipelines). Confirm if the user and application associated with the creation align with organizational policies and automated processes.

  ### Prioritization

  The alert severity is categorized as medium due to the potential risk of unauthorized access through service principals, which can be exploited for lateral movement or data exfiltration. While users with proper permissions may create service principals legitimately, the likelihood of abuse exists and merits investigation.

  ### Blind Spots and Assumptions

  Detection might miss legitimate service principal creations initiated by automated tools or scripts operated by authorized personnel. Additionally, a lack of comprehensive audit logs or misconfiguration in Azure Activity Logging could lead to incomplete visibility of relevant actions. Monitor for complementary detections regarding Azure AD admin activities or unusual application registrations to enhance contextual awareness and coverage.

