level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of Kubernetes ClusterRoles and Roles within Azure Kubernetes Service (AKS). Such changes could signify an attacker attempting to escalate privileges within the cluster or alter access controls to compromise sensitive resources. Attackers may aim to manipulate roles to achieve unauthorized access to critical services or containerized applications, leading to potential data breaches or service disruptions.

  The relevant MITRE ATT&CK tactics and techniques for this detection include "Impact" (T1485), which denotes the potential disruption of services or data integrity, "Misuse Elevation of Privilege" (T1496), concerning unauthorized access escalation, and "Privilege Escalation through Role Modification" (T1489), which highlights the risks associated with altering RBAC roles in Kubernetes environments.

  The primary data sources for effective monitoring consist of Azure Activity Logs, which capture detailed events related to Kubernetes RBAC operations. These logs enable security teams to assess actions taken against roles and links to overall access control management.

  ### Investigation Steps
  - **Review Activity Logs**: Examine Azure Activity Logs for any entries corresponding to role modifications or deletions, focusing on timestamps and specific user accounts involved in the operations.
  - **Validate User Context**: Determine if the users making changes have appropriate permissions. Investigate any changes made by unfamiliar or unexpected user accounts to rule out potential compromise.
  - **Correlate with Cluster Events**: Analyze Kubernetes audit logs alongside Activity Logs to gain a complete view of role-related activities and spot any suspicious patterns or anomalies.
  - **Assess Impact and Accessibility**: Evaluate which resources were affected by modified roles and assess whether sensitive data was exposed or if critical services became vulnerable due to these role changes.

  ### Prioritization
  The severity of this alert is considered medium due to the potential for significant impact on security posture and operational integrity. Unauthorized modifications to Kubernetes roles can lead to privilege escalation and compromise of the entire cluster, making early detection critical.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise if Activity Logs are not configured correctly or if logs are not retained for a sufficient period. This detection logic assumes that standard RBAC configurations are in place and that any changes to them should be closely monitored. Additionally, it is assumed that environments are actively maintained with appropriate auditing policies, making Activity Logs readily accessible for analysis. Without proper configurations, the alert may not trigger on legitimate administrative operations that should occur within the cluster.

