note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of ClusterRoles and Roles in Azure Kubernetes Service, specifically operations related to RBAC (Role-Based Access Control). The likely attacker objective is to escalate privileges, gain unauthorized access to cluster resources, or disrupt service by altering role bindings. This detection aligns with the MITRE ATT&CK tactics of **Privileged Escalation (TA0004)** and techniques such as **Role or Access Token Manipulation (T1485)** and **Permissions Changes (T1496)**. The primary telemetry source for this detection is Azure Activity Logs, which provide records of RBAC operations. If malicious, this behavior could enable an adversary to control or compromise Kubernetes resources, significantly impacting the environment. This detection does NOT confirm that malicious activity occurred, as legitimate changes by authorized administrators may trigger the alert.

  ### Investigation Steps

  - **Identify the user initiating changes:** Search Activity Logs for the **operationName** values of `ROLES/WRITE` and `ROLES/DELETE`, focusing on the `caller` field to check the user identity associated with the change. Review if the user has legitimate admin privileges.

  - **Examine timestamps for sudden changes:** Look for a cluster of role modification events within a short time frame using **event timestamps** to identify unusual activity patterns or potential brute force attempts.

  - **Correlate with known good activity:** Review role changes against a historical baseline within the **Activity Logs**. Legitimate changes, like scheduled updates by known admins, should align with maintenance windows or planned deployments.

  - **Check for unusual IP addresses or user agents:** Analyze logs for any anomalies in **userAgent** or **clientIP** fields during the role modifications. Compare this data against authorized access points to identify potential external compromises.

  - **Monitor for associated privilege escalation actions:** Investigate subsequent activities that may leverage newly granted roles or escalated privileges using telemetry from the **Kubernetes API Audit logs**. Look specifically for commands or API calls that indicate suspicious resource access following role modifications.

  ### Prioritization

  This alert carries a medium severity level due to its potential impact on core Kubernetes management systems. Unauthorized manipulation of roles and privileges could lead to broader compromise, and the operational nature of Kubernetes makes such changes commonly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Limitations include potential evasion where an attacker, using legitimate credentials, modifies roles to cloak their activities. Reliable detection requires properly configured Activity Logs for full coverage of Kubernetes operations. Legitimate administrative activities, such as routine access adjustments, may also trigger the rule, leading to false positives. Companion detections that enhance coverage include monitoring for suspicious API activity within Kubernetes itself and leveraging other role changes in Azure, like workloads or namespaces.

