logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName: MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION
  condition: selection
falsepositives:
- If this was approved by System Administrator.
level: high
note: |
  ### Technical Context

  This rule detects unauthorized elevation of permissions within Azure subscriptions that can potentially grant full access to Azure resources. The likely attacker objective is to gain control over various subscription settings, allowing further exploits or unauthorized data access. This detection maps to the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and the technique of Valid Accounts (T1078.004). Primary telemetry sources include Azure Activity Logs, specifically focusing on the `operationName` related to Microsoft Authorization. If malicious, this behavior can lead to significant risks, including unauthorized resource manipulation or data exfiltration. However, this detection does NOT confirm that malicious activity is taking place; it requires additional context to determine intent.

  ### Investigation Steps

  - **Review Activity Log Entries:** Check Azure Activity Logs for Event IDs related to `MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION` around the time of the alert, specifically looking for unexpected elevation requests that were not pre-approved.

  - **Identify User Context:** Validate the user or service account that triggered the elevation. Confirm if this account has a legitimate role that necessitates such elevated permissions, reviewing its prior activity for anomalies.

  - **Evaluate Change History:** Examine the history of permission changes for this subscription. Look for any recent changes in roles/groups assigned to the user in the Azure Activity Log (Field: `properties`), highlighting any unexpected changes preceding the alert.

  - **Baseline Legitimate Behavior:** Document the common access and permission grant requests associated with your organization’s Azure management processes, ensuring you understand typical user roles and growth patterns for comparison.

  - **Review Related Resource Changes:** Investigate any concurrent changes to Azure resources or subscriptions (e.g., role assignments), focusing on actions that could indicate downstream malicious activities, such as resource creation or deletion attempts.

  - **Check for Related Alerts:** Identify if there are related alerts or abnormal activities reported in Azure Security Center or Microsoft Defender for Cloud that coincide with this permission elevation, enhancing the context around potential compromise.

  ### Prioritization

  This alert is high priority due to its potential impact on the integrity of Azure subscriptions, allowing significant unauthorized access if exploited. The likelihood of abuse is elevated given that attackers often seek administrative privileges to facilitate further malicious actions. Such permission elevation events are commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  There may be limitations in detection if logs are not configured to capture all relevant permission changes or if there are delays in log ingestion. Evasion techniques could include legitimate approvals for elevation that are quickly followed by malicious actions, making context critical for accurate evaluation. Activities such as scheduled administrative reviews or legitimate access requests might trigger this alert under specific circumstances, albeit infrequently. Implementing companion detections focusing on unusual API calls and reward assignment changes can bolster incident response readiness.

