note: |
  ### Technical Context
  This detection rule identifies when a user has been elevated to manage all Azure Subscriptions through specific operations logged in Azure Activity Logs. Such elevation of privileges can be indicative of unauthorized access, particularly if it was not a planned or approved action. Attackers may exploit this to gain control over multiple resources in the Azure environment, potentially leading to data exfiltration, service disruption, or further lateral movement within the cloud environment.

  The relevant MITRE ATT&CK tactics for this rule include **Privilege Escalation (TA0004)** and **Initial Access (TA0001)**, with specific attention to the technique **Valid Accounts (T1078.004)**. Attackers often seek to elevate privileges to gain higher-level access in cloud environments to exploit resources and maintain persistent access.

  The primary data source for this detection is Azure Activity Logs, which capture all significant operations performed within the Azure ecosystem, including changes to user roles and permissions.

  ### Investigation Steps
  - **Review Activity Logs:** Examine Azure Activity Logs for the specific operation `MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION` to identify which user initiated the privilege elevation and when it occurred.
  - **Verify User Authorization:** Check if the privilege elevation was pre-approved by a System Administrator or aligned with any organizational changes or updates in access control.
  - **Analyze Related Events:** Look for other activity from the user before and after the elevation, focusing on unusual API calls, access to sensitive resources, or changes in other permissions.
  - **Inspect Azure Role Assignments:** Investigate the role assignments to see if the user was granted other permissions beyond managing subscriptions, which could indicate further compromise.

  ### Prioritization
  This alert is considered **high** severity due to the significant risk associated with unauthorized high-level access in an Azure environment. The likelihood of exploitation is heightened as attackers often target elevation scenarios to gain control over sensitive data and resources.

  ### Blind Spots and Assumptions
  There may be blind spots in detection coverage if Activity Logs are not retained for an adequate period or if logging is misconfigured. The detection logic assumes that any elevation of privileges that is not pre-approved is potentially malicious; therefore, thorough process documentation and change management protocols are crucial for accurate interpretation. Adequate logging of Azure Activity, including operations and user changes, is required for this detection to function effectively.

