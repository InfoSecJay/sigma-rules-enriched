  ---

  ### Technical Context

  This Sigma rule detects when a user is elevated to manage all Azure subscriptions via the Microsoft.Authorization/ElevateAccess action. This behavior is often associated with unauthorized privilege escalation, which allows an attacker to gain full control over Azure resources, potentially leading to significant data breaches or service disruption.

  The relevant MITRE ATT&CK tactic is "Privilege Escalation" (TA0004), specifically technique "Valid Accounts" (T1078.004). The primary telemetry source is Azure Activity Logs, focusing on operation names related to elevation of access. If malicious, this can lead to an attacker manipulating, exfiltrating, or deleting critical resources within Azure. Notably, this detection alone does not confirm malicious activity, as legitimate administrative changes may occur under certain conditions.

  ---

  ### Investigation Steps

  - **Review the Activity Log for Elevation Actions:** Check Azure Activity Logs (Event Name: ElevateAccess) for entries related to the user and correlate timestamps with potential malicious activities.

  - **Validate Existing User Permissions:** Cross-reference the affected user's permissions (Azure RBAC roles) before and after the elevation. Legitimate administrators may have necessary roles like Owner or Contributor on the subscription.

  - **Identify Recent Changes in Azure Subscriptions:** Analyze resource and subscription changes made by the user before and after the elevation event, focusing on Event IDs indicating updates, deletions, or new resource creations.

  - **Investigate User Account Anomalies:** Look for signs of account compromise, such as unusual login locations, times, or patterns. Use Azure Sign-In Logs (Event IDs: 4624 for successful logins) to confirm recent activity.

  - **Assess Approval Workflow Evidence:** Check for any recorded approvals or planned changes within your change management system, ensuring that the elevation aligns with authorized administrative activities.

  ---

  ### Prioritization

  The alert has high severity due to the possibility of significant impacts on the Azure environment from unauthorized privilege escalation. The likelihood of malicious abuse is considerable, as attackers often target elevated privileges to compromise cloud resources. This behavior is commonly weaponized in cloud-based attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate elevation requests that are approved but not properly documented. Ensure Activity Logs are retained and configured according to Azure best practices for complete visibility. Legitimate selective elevation requests may trigger this alert during regular administrative activities. A related detection to consider includes monitoring for unusual API calls or changes made by elevated accounts, enhancing coverage against potential misuses of privileges.

