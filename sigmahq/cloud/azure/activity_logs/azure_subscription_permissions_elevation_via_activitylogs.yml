note: |
  ### Technical Context

  This Sigma rule detects instances where a user is granted elevated permissions to manage all Azure subscriptions within an organization. The likely attacker objective is to gain broader access to resources in Azure, potentially leading to unauthorized actions such as data exfiltration, service abuse, or account compromise. This behavior falls under the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and specifically targets the technique of Valid Accounts (T1078.004).

  Primary telemetry sources include Azure Activity Logs, specifically logs related to the operation `MICROSOFT.AUTHORIZATION/ELEVATEACCESS/ACTION`. If malicious, this change can significantly escalate risks, enabling an adversary to manipulate critical cloud resources and data. Importantly, this detection alone does not prove malicious intent; it could occur during legitimate administrative actions.

  ### Investigation Steps

  - **Verify User Authorization:**
    Check if the user who received elevated access is an expected System Administrator. Review Azure Activity Logs for any recent role assignment (Event Type: `Role Assignment`) and compare against organizational change management records.

  - **Review Timing and Context:**
    Assess the timing of the elevation request. Look for suspicious patterns, such as recent sign-ins from unfamiliar IP addresses or during off-hours. Check Azure AD Sign-in logs (Event ID: `SignInLogs`) for anomalies (e.g., Event Fields: `userPrincipalName`, `ipAddress`).

  - **Examine Role Assignment Details:**
    Confirm the details of the role assignment and the services impacted. Look for any concurrent administrative actions that may indicate an attack vector, especially other privileged operations (Event Type: `Write Role Assignment`).

  - **Identify Associated Actions:**
    Investigate related actions taken by the user post-elevation. Review Azure Activity Logs for any service modifications, deletions, or unauthorized access attempts (Event Types: `Resource Management`, `Subresource Changes`).

  - **Assess Asset Criticality:**
    If the user was assigned elevated permissions for critical Azure resources, escalate investigation efforts. Validate if there are any changes to high-value assets, such as Azure databases or sensitive storage accounts.

  ### Prioritization

  This alert is of high severity due to the potential for significant impact in an environment where Azure resources are critical for operations. The likelihood of malicious abuse is pronounced, especially if unauthorized elevation coincides with other suspicious behavior. This type of privilege escalation is commonly weaponized in attacks targeting cloud infrastructure.

  ### Blind Spots and Assumptions

  Detection may face limitations from configuration issues, such as inadequate logging settings in Azure which can hinder complete visibility into user actions. However, legitimate operational activity, such as an approved role assignment by a System Administrator, may trigger this alert. A companion detection to consider is monitoring for unusual resource modifications following an elevation event, as this can indicate possible exploitation of the new permissions granted.

