  ---

  ### Technical Context

  This Sigma rule detects the removal of an owner from an Azure application or service principal, indicating potential unauthorized access or administrative actions. The likely objective of an attacker may be to disrupt administrative control or facilitate further exploitation by weakening security postures and access control management. This behavior correlates with the MITRE ATT&CK tactic: **Initial Access** (TA0001) and technique: **Application Layer Protocol** (T1071).

  The primary telemetry source for this detection is Azure Activity Logs, specifically monitoring logs that capture user actions related to resource management. If this activity is malicious, it could lead to compromised applications or services, thereby impacting the security posture of the organization. Importantly, this detection does NOT confirm malicious intent on its own, as actions by legitimate administrators can trigger the same alert.

  ---

  ### Investigation Steps

  - **Check Azure Activity Logs:** Review Azure Activity Logs for Event ID **Audit-RemoveOwner** to identify the source of the removal action. Investigate the correlation of user identity with previous administrative actions.

  - **Identify the User Performing the Action:** Determine if the user removing the owner is a legitimate administrator. Cross-reference the user activity with records from Azure Active Directory (AAD) to identify any suspicious patterns or previous logins.

  - **Review Contextual Information:** Gather contextual information on the application or service principal from the Azure portal, focusing on its criticality to business operations. Assess if this service principal is tied to sensitive applications.

  - **Assess User and Host Authentication Details:** Examine IP addresses, user agents, and hostnames associated with the removal action for signs of anomalous behavior. Compare them against known legitimate management locations, such as VPNs or corporate networks.

  - **Document Legitimate Changes:** Validate if the removal coincides with scheduled maintenance or administrative reviews. Contact the responsible team if the removal falls within anticipated maintenance windows.

  - **Monitor for Related Changes:** Investigate the Azure Activity Logs for additional unusual account movements (e.g., new owners being added) around the same time frame to establish any related unauthorized activity.

  ---

  ### Prioritization

  This alert is considered medium severity within an enterprise context due to the impact an unauthorized removal of ownership can have on critical applications or services. The likelihood of abuse is concerning given the potential for administrative privilege escalation. While this specific activity is not frequently weaponized, it can serve as a precursor to further malicious actions.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the potential use of automated scripts by legitimate administrators, causing false positives if such tools are common within the organization. Ensuring comprehensive logging in Azure Activity Logs is necessary for reliable detection. Legitimate maintenance activities may also trigger this alert, especially if conducted during administrative reviews. Consider companion detections related to **Service Principal Credentials Modified** (T1121) to enhance overall security monitoring and context.

