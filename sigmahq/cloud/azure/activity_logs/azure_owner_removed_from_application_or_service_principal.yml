note: |
  ### Technical Context

  This rule detects the removal of an owner from an application or service principal in Azure. The likely attacker objective could be to disrupt legitimate access controls, potentially creating an avenue for identity theft or privilege escalation by removing users who have administrative capabilities. This behavior aligns with the MITRE ATT&CK tactic of "Credential Access" (TA0006) and the technique "Account Manipulation" (T1098).

  The primary telemetry sources are Azure Activity Logs, specifically the logs capturing actions related to service principal management. Security impact includes unauthorized access to applications or services if the removal facilitates unwarranted control or data access. It’s important to note that this detection does NOT confirm malicious activity on its own; legitimate administrative actions may trigger this alert.

  ### Investigation Steps

  - **Validate the action's context**: Check Azure Activity Logs for related entries around the time of the alert. Confirm the user identity, user agent, and associated hostname to ascertain if the owner removal was performed by an authorized administrator.

  - **Correlate recent activity**: Review the last 30 minutes of Azure Activity Logs (Event ID 5823 for modifications) for any suspicious changes to user roles or service principals, particularly looking for patterns of account manipulation by non-admin users.

  - **Identify high-confidence malicious indicators**: Look for the presence of unfamiliar users removing owners from critical applications. Examine the user identity and correspond it with known users who typically manage Azure services.

  - **Document expected behavior**: Compare the activity against historical data to determine if the removal of owners from applications or service principals follows the usual operational procedure. Legitimate actions typically involve anticipated app lifecycle events and should have clear justifications within change management logs.

  - **Assess the criticality of the service**: Identify the importance of the affected application or service principal. Investigate its role within the organization, especially if it's tied to sensitive data or critical business functions.

  ### Prioritization

  The alert indicates medium severity due to potential high impact if critical services are left unmonitored or mismanaged. The likelihood of abuse is moderate, particularly if an adversary gains sufficient access to alter service principal configurations, which is a common technique in identity-based attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if Azure Activity Logs are not adequately configured or retained, potentially missing legitimate administrative changes that could lead to false positives. It's crucial to understand that legitimate administrative actions may also trigger this alert, especially during maintenance or security audits. A related detection to enhance coverage would involve monitoring for "Add owner to service principal" actions, as they can complement the understanding of access changes within applications.

