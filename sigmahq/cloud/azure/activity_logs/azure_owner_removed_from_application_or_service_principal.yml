note: |
  ### Technical Context

  This Sigma rule detects when an owner is removed from an application or service principal in Azure, which may indicate unauthorized changes or potential account compromise. The likely objective of an attacker could be to gain control or manipulate application permissions for data access or service tampering, ultimately facilitating further malicious activities within the environment. This behavior aligns with the MITRE ATT&CK tactic **Defense Evasion** and technique **Account Manipulation (T1078)**.

  The primary telemetry sources for this detection include Azure Activity Logs, capturing event messages that reflect the changes made to owner statuses. If malicious, this could lead to unauthorized access to critical applications or services, directly impacting both security posture and operational integrity. However, this detection does NOT confirm that the behavior is malicious; legitimate administrative actions may trigger it.

  ### Investigation Steps

  - **Verify the user identity performing the action:** Check Azure Active Directory logs for the identity of the user making the change (Event Types: AuditLogs, Signins) and confirm if they have legitimate administrative permissions.

  - **Examine the source of the operation:** Review the Azure Activity Log for the `User Agent` and `Client IP Address` associated with the change. Cross-reference these with known or expected legitimate access patterns.

  - **Review ownership history:** Use the Azure Service Principal logs to check for recent ownership changes on the specific application. Look for events just prior to the removal to identify any suspicious contextual activities.

  - **Investigate removal patterns:** Validate whether the removal of the owner aligns with historical administrative actions. Compare against other Service Principals to identify any anomalous or unexpected ownership removals.

  - **Check for subsequent events:** Correlate with any follow-up actions taken post-removal, such as changes to permissions for the application itself, using Azure Activity Logs to identify potential misuse.

  - **Identify legitimate users:** Document and check the behavior of known administrators in your environment who may have initiated the owner removal. Validate their usual patterns against the timeline of the alert.

  ### Prioritization

  The severity of this alert is medium due to the potential impact from unauthorized access to applications or services, particularly if sensitive data is involved. While the likelihood of abuse is moderate, should this behavior be exploited, it can severely compromise the security posture of the organization. This behavior is not uncommon during privilege escalation attacks, making it important for timely review.

  ### Blind Spots and Assumptions

  Detection limitations include the reliance on logged activity, which may not capture all administrator actions if logs are misconfigured or incomplete. Evasion techniques can involve legitimate user actions that mask malicious intent, requiring contextual awareness of user roles. Additionally, activities by automated systems for application management may also trigger alerts. A related detection to consider is monitoring for changes in application permission sets or role assignments following owner removals, further strengthening oversight.

