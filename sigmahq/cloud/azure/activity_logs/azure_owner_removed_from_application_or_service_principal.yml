note: |
  ### Technical Context
  This detection rule identifies the removal of an owner from an application or service principal in Azure. Removing an owner from these resources can signal unauthorized access or malicious activity, as attackers often seek to alter permissions to hinder administrative capabilities or gain higher levels of control within cloud applications. The ability to manipulate service principals is crucial for leveraging resources within Azure environments, making this action a point of interest in potential insider threats or external compromises.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (TA0030) and **Cloud Service Dashboard Manipulation** (T1527), as an attacker may aim to obfuscate their activities by altering permissions and ownership in cloud services. Primary data sources for investigating this alert would include Azure activity logs, which provide records of changes related to ownership and permissions for applications and service principals.

  ### Investigation Steps
  - **Review Activity Logs:** Check Azure activity logs for entries marked "Remove owner from service principal" or "Remove owner from application" to identify who initiated the change and the context surrounding it.
  - **Analyze User Context:** Investigate the user identity making the request. Verify whether this user has legitimate administrative privileges, and correlate with user agent and hostname logs to assess the legitimacy of the action.
  - **Evaluate Related Permissions:** Examine the permissions associated with the application or service principal before and after the ownership removal to determine the potential impact on resource access.
  - **Cross-reference Organizational Policies:** Compare the observed behavior against organizational policies regarding owner removal from service principals and applications. Consider any pre-approved administrative actions that may explain the change.

  ### Prioritization
  This alert has a medium severity level due to the potential for significant impact if an unauthorized user removes an application owner, which could lead to harmful privileges or operations within the cloud environment. Given the increasing targeting of cloud resources by malicious actors, timely investigation is critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Azure activity logs are not being continuously monitored or collected effectively, as this could lead to missed alerts regarding legitimate ownership changes. The detection logic assumes that all ownership removals should be scrutinized and does not account for the possibility of legitimate administrative actions. Proper configuration of activity log collection and retention is necessary for this alert to function as intended.

