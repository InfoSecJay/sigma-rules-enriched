note: |
  ### Technical Context

  This rule detects modifications or deletions of Azure Point-to-site VPN gateways, which could be indicative of unauthorized access attempts or misconfigurations by an attacker. The likely objective of an adversary would be to disrupt secure communications or to set up their own VPN access for persistent control. This behavior aligns with the MITRE ATT&CK technique for "Impact" (TA0040), specifically "Service Stop" (T1489) and "Network Service Discovery" (T1046).

  Primary telemetry sources include Azure Activity Logs, specifically focusing on the operation names associated with VPN gateway modifications or deletions. If malicious, this activity can lead to loss of secure connectivity and unauthorized access to cloud resources. However, this detection does NOT confirm that a malicious actor is behind the modification or deletion, as legitimate administrators can also perform these actions.

  ### Investigation Steps

  - **Verify user identity:** Check the Azure Activity Logs for the `caller` field (Event ID: N/A) to identify the user performing the action. If the user is an unfamiliar Azure Active Directory account lacking administrative privileges, this could indicate potential unauthorized access.

  - **Assess modifications context:** Review the `operationName` field in the Activity Log for operations like `MICROSOFT.NETWORK/P2SVPNGATEWAYS/DELETE`. If this was executed outside of scheduled maintenance or known operational changes, it indicates higher risk.

  - **Evaluate associated changes:** Check for related operations in the same timeframe, particularly those modifying configurations or generating VPN profiles, to understand if it's part of a malicious workflow, such as `GENERATEVPNPROFILE/ACTION`.

  - **Cross-reference recent changes:** Examine user activity for known, legitimate modifications by system administrators. If the detected modifications align with routine tasks or approved change requests, the alert may be benign.

  - **Monitor for impacted systems:** Identify which systems rely on the Point-to-site VPN for secure access. Investigate any connectivity issues reported by users post-detection, as disruptions could indicate a successful impact.

  - **Review diagnostic settings:** Look into any changes made to `MICROSOFT.INSIGHTS/DIAGNOSTICSETTINGS/WRITE`, which may indicate an attempt to hide tracks of malicious activity by changing logging configurations or disabling alerts.

  ### Prioritization

  This alert should be treated with medium severity given that the affected Azure resources facilitate secure communication for potentially sensitive data flows. The likelihood of malicious abuse is moderate, especially if the action originates from an unfamiliar or unauthorized account. Such modifications and deletions are not uncommon targets for attackers focusing on network infrastructure.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate changes made by administrative accounts or automation scripts that could trigger false positives. Reliable detection requires comprehensive logging enabled for Azure Activity Logs, with a focus on monitoring access and modification of resources. Legitimate maintenance activities, such as scheduled updates by verified administrators, may trigger the alert. Related detections could include monitoring for unauthorized Azure user sign-ins (e.g., Azure sign-in logs) to provide additional context regarding who is performing the modifications and whether that user behavior is anomalous.

