note: |
  ### Technical Context
  This rule detects operations related to Azure Point-to-Site VPNs, specifically when a VPN gateway is modified or deleted. Such actions are often associated with legitimate administrative tasks; however, they can also signify suspicious activities or potential misconfigurations that could lead to unauthorized access. Attackers may attempt to modify or delete VPN settings to disrupt secure remote access or to create backdoors within the network.

  The relevant MITRE ATT&CK tactics here include **Impact** (TA0040) and specifically the technique **Account Manipulation** (T1098). Attackers manipulating VPN configurations could disrupt business operations or facilitate lateral movement within a target organization’s network. The primary data source for this rule is Azure's activity logs, which capture changes and operations performed on the Point-to-Site VPN gateways.

  ### Investigation Steps
  - **Verify Administrative Users**: Cross-reference the user identity making the changes with legitimate administrative accounts. High-risk user accounts performing modifications should be scrutinized for context and necessity.
  - **Review Activity Logs**: Gather Azure activity logs surrounding the event to identify all actions taken before and after the VPN modification or deletion. Pay close attention to operation timestamps and the sequence of actions.
  - **Analyze User Agent and Hostname**: Check the user agent and hostname from which the operation was conducted. Unusual user agents or requests from unfamiliar hostnames might indicate malicious activity.
  - **Assess Impact of Changes**: Evaluate network connectivity and configurations affected by the VPN changes. Determine if these modifications coincide with any other suspicious network behavior or alerts within the environment.

  ### Prioritization
  This alert is categorized as medium severity due to the potential impact of unauthorized changes to VPN configurations, which could facilitate an attacker’s ability to access sensitive areas of the network or disrupt normal operations.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the reliance on users having appropriate roles and permissions for modifications, which could blind the system to unauthorized activities performed by compromised or insider accounts. The rule assumes that applicable Azure activity logs are enabled and properly configured to record the necessary operations. Additionally, without context regarding typical administrative behaviors, legitimate changes could result in false positives, necessitating manual validation during an investigation.

