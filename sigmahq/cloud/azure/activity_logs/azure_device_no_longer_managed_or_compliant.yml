  ### Technical Context

  This rule detects when a device in Azure is reported as "no longer managed" or "no longer compliant." This behavior typically indicates a potential security gap in device management, possibly due to an intentional removal or misconfiguration. The likely attacker objective could be the exploitation of a vulnerability in an unmanaged or non-compliant device for unauthorized access or data exfiltration. This aligns with the MITRE ATT&CK tactic of Impact (TA0040) under the technique "Data Manipulation" (T1565).

  The primary telemetry sources are Azure Activity Logs, particularly focusing on specific properties within the activity message. If a device becomes unmanaged or non-compliant, it can increase the attack surface and lead to unauthorized activities. However, it is important to note this detection alone does NOT confirm malicious activity; it may result from administrative oversight or policy changes.

  ### Investigation Steps

  - **Review Azure Activity Logs for specific messages**: Search for Activity Logs (Event Type: AuditLogs) containing "Device no longer compliant" or "Device no longer managed" within the Message property to identify instances triggering the alert.

  - **Verify device compliance state**: Check the compliance state of the reported device using the Microsoft Intune portal or Azure AD, focusing on compliance policies, compliance status (compliant, non-compliant), and any recent changes to settings or policies.

  - **Identify recent administrative actions**: Investigate audit logs for any recent administrative actions related to the device, such as changes in device policies or configurations, by filtering for Activity Logs based on Event Initiator and Device ID.

  - **Correlate with legitimate administrative activities**: Determine if the alert coincides with known scheduled maintenance or administrative actions, matching timestamps against change control processes or documentation.

  - **Assess for common evasion techniques**: Consider whether any legitimate third-party tools or scripts have modified device management settings, which could explain the non-compliant status without malicious intent.

  ### Prioritization

  This alert is categorized as medium severity due to potential impacts on organizational security posture, especially if the affected device holds sensitive data or critical infrastructure roles. The likelihood of malicious abuse increases if the device remains unmanaged or unmonitored, given that adversaries may leverage such states for attacks. While not always weaponized, the transition to non-compliance is a known precursor to security incidents.

  ### Blind Spots and Assumptions

  Detection is limited by the necessity of proper logging configurations within Azure, as its absence could result in undetected policy changes. Legitimate user actions, such as administrative mistakes or configuration changes, may also trigger these alerts, complicating responses. Additionally, companion detections, like monitoring for unauthorized administrative changes or device configuration alterations, can bolster overall security coverage and mitigate risks related to unmanaged devices.

