  ---

  ### Technical Context

  This rule detects when a device in Azure has been marked as no longer managed or compliant, indicating that the device may have lost its security posture or management control. The likely attacker objective could include gaining unauthorized access to resources by exploiting unmonitored or unmanaged devices on the network. This incident relates to the MITRE ATT&CK technique "Impact" (T1499), as the loss of device compliance may allow adversaries to exploit systems for data exfiltration or lateral movement.

  The primary telemetry sources are Azure activity logs that capture changes in device management status and compliance. If malicious, this behavior could lead to unauthorized access or compromise sensitive organizational data. Importantly, this detection does NOT confirm actual compromise; it only highlights a change in device status which may require further investigation.

  ---

  ### Investigation Steps

  - **Check Azure Activity Logs for Compliance Status Change:** Review Azure activity logs (Event ID specifics may vary) for entries indicating "Device no longer compliant" or "Device no longer managed." Look for recent entries that correlate with the detection time.

  - **Identify Device Ownership and Sensitivity:** Determine the ownership and role of the affected device. If it is a critical asset, prioritize further investigation. Cross-reference the device ID with the organization's asset inventory.

  - **Review Recent Configuration Changes:** Inspect Azure AD logs on any recent configuration changes made to the compliance policies or device management settings that could affect the device's status.

  - **Look for Related User Activity:** Check for any user actions associated with the device around the time of the compliance status change (e.g., user logins, device enrollments) to identify whether an administrator may have intentionally altered device settings.

  - **Correlate with Other Security Events:** Evaluate other security alerts or anomalies (such as unexpected logins or changes in user permissions) that occurred around the same time to assess the overall security posture of the affected device.

  - **Consider Legitimate Administration Activity:** Recognize that administrators may periodically review device compliance. If there is a timestamp for such review close to the alert, document it and consider it in analysis, potentially indicating benign activity.

  ---

  ### Prioritization

  This alert has medium severity as it involves a change in device compliance, which could point to potential risks if left unchecked. The impact on the affected system can be considerable, especially if the device is critical in the network. The likelihood of malicious exploitation increases if such changes are not promptly addressed, particularly in environments following compliance and security best practices.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate reasons for a change in device compliance, such as updates or administrative actions. The alert relies on the proper logging configuration for Azure activity logs, which must be enabled for accurate detection. Legitimate administration activity, such as device inspection or policy updates, may trigger this alert. Companion detections, such as monitoring for unauthorized access or configuration changes following compliance loss, can strengthen security coverage.

