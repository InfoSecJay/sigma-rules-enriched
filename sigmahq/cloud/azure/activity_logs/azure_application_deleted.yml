  ---

  ### Technical Context

  This Sigma rule detects the deletion of applications within Azure, specifically tracking activities labeled as "Delete application" or "Hard Delete application." An attacker may aim to disrupt organizational operations or obscure their tracks by removing critical applications. This behavior corresponds to the MITRE ATT&CK tactic of Impact (T1489: Data Destruction) as it could lead to business disruption or data availability issues.

  The primary telemetry source for this detection is Azure Activity Logs, which capture events related to changes and actions taken within Azure environments. If this deletion is found to be malicious, it could significantly impair business functionality or lead to data loss. Importantly, this detection does NOT confirm that the deletion is unauthorized; legitimate administrators may perform this action as part of normal operations.

  ---

  ### Investigation Steps

  - **Verify user identity and roles:**
    Check the user who initiated the deletion using Azure Activity Logs (Event Category: Administrative). Ensure they have the appropriate administrative rights to delete applications. A deletion by a system administrator under regular circumstances may be legitimate.

  - **Review the user agent and IP address:**
    Examine the user agent strings and originating IP address from the Azure Activity Logs. Malicious deletions often originate from unusual or untrusted locations, while legitimate activity will be consistent with internal network IP ranges.

  - **Assess application deletion context:**
    Look for other changes made around the same time in the Azure Activity Logs, particularly related to user permissions or additional application changes (Event Category: Administrative). Multiple disruptive changes can indicate malicious intent.

  - **Identify recent application usage:**
    Check for usage logs of the deleted application within Azure Monitor or other logging solutions, focusing on patterns indicative of prior legitimate use. Notify if the application was critical for functional operations.

  - **Examine the deletion confirmation:**
    Validate the presence of post-deletion events (Event ID for application deletion) in the Azure Activity Logs to ensure no restoration attempts were made immediately after the deletion, which might indicate an adversarial action.

  ---

  ### Prioritization

  The severity of this alert is medium, as the impact depends on the criticality of the deleted application within the organization's infrastructure. The probability of malicious activity is plausible, especially if the deletion is traced back to an unfamiliar user. This behavior can often signify weaponized tactics used by attackers to gain control over the environment.

  ---

  ### Blind Spots and Assumptions

  Detection of application deletions does not account for potential evasion techniques such as API calls made through implicit administrative identities or service accounts. Reliable detection depends on comprehensive Azure Audit Logs and ensuring that logging is enabled for all relevant activities. Legitimate deletion by known administrators could trigger this alert, leading to potential false positives. Companion detections, such as monitoring for unauthorized changes in user roles or permissions, can strengthen coverage against this tactic.

