note: |
  ### Technical Context
  This detection rule identifies when an application is deleted in Azure environments, which could signify potentially malicious activity or misconfiguration. Attackers may target Azure applications for deletion to disrupt services, create chaos, or cover their tracks after gaining unauthorized access. The objectives might include disabling specific functionalities or erasing traces of previous attacks on the cloud infrastructure, providing an opportunity for later exploitation or lateral movement within the environment.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion** (T1089) and **Impact** (T1489). Defense Evasion techniques can manifest if an attacker deletes applications to hide their presence, while Impact is relevant as the deletion could lead to service downtime and loss of essential functionalities for the enterprise.

  The primary data source for this detection is the Azure activity logs, specifically monitoring for events related to application deletions. This source provides crucial information on who deleted the application, when the action occurred, and the context of the request, which is essential for evaluating the legitimacy of the operation.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Check the activity logs for any records of application deletion, focusing on the timestamps and the identities of the users who performed the deletions.

  - **Verify User Context:** Investigate the user identity of the account that executed the deletion. Determine if the actions align with the user's roles and responsibilities within the organization.

  - **Analyze Change Patterns:** Look for patterns of changes made by the same user or within a specific timeframe to identify unusual activities. Anomalous deletion requests, especially from unfamiliar users or accounts with atypical behavior, warrant further scrutiny.

  - **Correlate with Other Log Sources:** If available, review related logs from other sources (e.g., VPN, EDR) to contextualize the activities of the user around the time of the deletion. This might reveal whether it was part of a coordinated attack or another unauthorized action.

  ### Prioritization
  This alert has medium severity due to the potential impact that an unauthorized deletion of applications can have on services and operational capabilities. Given the elevated likelihood of exploitation in a cloud environment, it's crucial to evaluate the situation promptly to mitigate risks.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding routine maintenance activities performed by system administrators, as legitimate deletions could lead to false positives. The detection logic assumes that most application deletions are unusual, which may not hold true in every enterprise context. To ensure effectiveness, Azure activity logs must be correctly configured and retained for adequate timelines, capturing all relevant events to enable comprehensive monitoring of application management activities.

