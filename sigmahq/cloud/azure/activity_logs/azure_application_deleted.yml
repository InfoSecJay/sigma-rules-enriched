note: |
  ### Technical Context

  This rule detects the deletion of applications in Azure, including both standard and hard deletes. The likely objective of an attacker using this behavior is to disrupt services, erase tracks of malicious actions, or create backdoors for future access. This behavior aligns with the MITRE ATT&CK tactic and technique of **Defense Evasion (T1563)** and **Impact (T1489)**. The primary telemetry sources include Azure Activity Logs, specifically monitoring logs for events related to application deletion.

  If the deletion is performed maliciously, it can lead to service outages, data loss, or unauthorized access to sensitive systems. It is important to clarify that this detection does NOT confirm intent; legitimate users, such as system administrators, may also trigger this alert during routine maintenance.

  ### Investigation Steps

  - **Verify the user identity: **Cross-check the identity of the user responsible for the deletion using Azure AD logs (particularly look for Event ID 4624) to ensure they have appropriate permissions.

  - **Analyze associated application logs:** Look into the Azure Activity Logs and specifically examine entries for application creation or modifications (Event type: '/applications/{appId}') that occurred prior to the deletion event to determine the application's lifecycle.

  - **Check for multiple deletions:** Review activity logs for multiple deletion events occurring within a short timeframe, which may indicate a malicious attempt to disrupt multiple applications (Azure Activity Logs: 'Delete application' events).

  - **Review user's historical behavior: **Investigate past Azure activities of the account responsible for the deletion by checking user activity trends: Look for atypical behavior such as unusual login locations or access times.

  - **Audit application importance:** Assess the criticality of the deleted application within the enterprise's architecture; applications with high importance necessitate immediate escalation.

  - **Explore potential backdoor attempts:** Confirm if additional events indicating changes in roles or permissions within Azure AD (such as elevated permissions granted to other users) occurred post-deletion, which may suggest a broader attack.

  ### Prioritization

  The alert should be treated with medium severity as the deletion of an application can significantly affect system functionality and service delivery. The likelihood of malicious abuse is moderate, especially if the action comes from an unfamiliar user or outside normal patterns of administrative activity. This behavior can be weaponized as part of a broader strategy to degrade or disrupt service integrity.

  ### Blind Spots and Assumptions

  Detection may be limited due to the potential for legitimate administrative actions to trigger the alert. Ensure proper logging for crucial Azure services is configured to capture all relevant activity; any lapses could inhibit detection. Additionally, application deletions might occur regularly during maintenance, so context is vital—monitoring companion detections, such as unauthorized role changes in Azure AD, can strengthen overall coverage and contextual understanding.

