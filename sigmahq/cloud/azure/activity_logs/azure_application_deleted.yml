note: |
  ### Technical Context

  This Sigma rule detects the deletion of applications in Azure, indicating potential unauthorized access or modification of cloud resources. The likely objective of an attacker may be to disrupt services or to cover their tracks after initial access. The relevant MITRE ATT&CK tactic associated with this behavior is **Impact** (TA0040), and the technique is **Application Layer Denial of Service** (T1489).

  Primary telemetry sources include Azure Activity Logs, specifically changes reflected in application settings. The security impact of a malicious deletion could result in significant service outages or loss of functionality. Importantly, this detection does NOT confirm malicious intent on its own; a legitimate administrator could also perform an application deletion.

  ### Investigation Steps

  - **Review Azure Activity Logs for deletion events**: Look for Azure Activity Log entries with “Delete application” or “Hard Delete application” in the `properties.message` field (Log Type: ActivityLogs). Check the `initiatedBy` field to identify the user or service principal performing the action.

  - **Identify user identity and history**: Cross-reference the user’s activity logs within the last 7 days to determine if they have exhibited unusual behavior or executed high-risk actions that could indicate compromised credentials (Log Type: ActivityLogs, Fields: `initiatedBy`).

  - **Check for legitimate administrative actions**: Verify if deletions correlate with scheduled maintenance or system upgrades typically carried out by approved administrators. If routine administration is confirmed, note the `user agent` and `hostname` in the log records.

  - **Assess high-confidence malicious indicators**: Watch for application deletions initiated by non-admin users or unfamiliar accounts (Log Type: ActivityLogs). Anomalous patterns, such as multiple deletions in a short time frame, may indicate malicious intent.

  - **Validate sensitive application categories**: Evaluate the significance of the deleted application(s). If the deleted applications belong to critical services or contain sensitive data, prioritize further investigation, especially if high-impact systems are affected.

  - **Review for potential evasion techniques**: Consider whether the deletion was coordinated with other suspicious actions (e.g., significant changes to user permissions or roles) that may have preceded the deletion event.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of system outages and the relatively high likelihood of abuse by adversaries seeking to disrupt services. While legitimate administrators can trigger this behavior, malicious deletion is common among attackers aiming to obfuscate their footprints.

  ### Blind Spots and Assumptions

  Detection limitations may arise if Activity Logs are not properly configured to retain necessary data or if access control policies are lax, allowing unauthorized users elevated privileges. Legitimate administrative actions may inadvertently trigger this alert, particularly during routine system maintenance or application upgrades. A related detection might include monitoring for unusual role assignments or permission changes that often precede application deletions, strengthening comprehensive monitoring efforts.

