note: |
  ### Technical Context
  This rule detects modifications or deletions of devices or their configurations within Azure. Such activities could indicate unauthorized changes made by malicious actors aiming to disrupt services, exfiltrate data, or establish persistent access. Attackers may target device configurations to disable protections or insert rogue devices into the environment, allowing later exploitation or lateral movement.

  The relevant MITRE ATT&CK tactics associated with this detection include **Impact** (TA0040) as the changes could directly affect the availability and integrity of systems. Techniques like **Data Manipulation** (T1485) and **Data Destruction** (T1565.001) are specifically pertinent, as they encompass actions that may delete or alter critical device settings.

  The primary data source for this rule is Azure Activity Logs, which capture events related to changes made within the Azure environment, including both user-initiated and system-based actions regarding device management.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Check the activity logs for specific entries related to the deletion or modification of devices and their configurations around the timeframe of the alert to identify the original requester and the scope of the changes.

  - **Correlate User Activity**: Investigate the user identities associated with these changes. Assess whether unauthorized accounts or unfamiliar user agents initiated the modifications, which could indicate malicious intent.

  - **Examine Configuration Changes**: Analyze the details of any configuration changes made, noting specific attributes altered or removed. This can help determine the potential impact on the environment's security posture.

  - **Assess Admin Practices**: Evaluate whether the changes align with documented administrative practices. Determine if the activity was expected behavior from system administrators or part of legitimate maintenance operations.

  ### Prioritization
  This alert should be regarded with medium priority due to the potential impact of unauthorized changes on the organization’s operations and security posture. Given that legitimate administrative activities could also trigger this alert, further investigation is critical to determine the context of the change.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for actions executed through automated scripts or third-party integrations that bypass typical logging mechanisms. The detection logic assumes that any change to devices or their configurations is noteworthy; however, legitimate actions by system administrators can lead to false positives. Additionally, logs from device management solutions should be correctly configured to ensure comprehensive coverage for this alert to function effectively.

