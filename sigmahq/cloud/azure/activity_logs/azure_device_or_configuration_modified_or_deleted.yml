note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of devices or device configurations within Azure. The behavior points to potential unauthorized changes in an organization's Azure environment, which may indicate a compromised account or malicious insider activity. The likely attacker objective is to disable security measures or pivot to gain broader access within the enterprise infrastructure.

  The relevant MITRE ATT&CK tactics and techniques are **Impact (TA0040)** and **Impair Defenses (T1485)**. The primary telemetry source for this detection comes from Azure Activity Logs, specifically tracking events with messages indicating device deletion or modifications. Security impact can be significant, potentially allowing attackers to evade detection mechanisms or alter security configurations.

  Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may also trigger it.

  ### Investigation Steps

  - **Validate user identity and activity: ** Review the user identity performing the action in the Azure Activity Log (Log Type: activitylogs), focusing on `properties.userPrincipalName`. Confirm whether the identity is a privileged user or consistent with known administrators.

  - **Examine log details: ** Look for specific properties in the log entries such as `properties.message`, identifying actions like “Delete device” or “Update device configuration.” Investigate any unfamiliar user contexts or patterns.

  - **Analyze timestamps: ** Cross-reference the timestamps of the detected modification or deletion with other activity logs, such as login events (Event ID 4624) within Azure Active Directory, to determine if these changes align with any unusual logins or activity patterns.

  - **Identify expected behavior: ** Confirm if the actions were performed during normal administrative windows or by known system administrators. Ensure that modifications or deletions coincide with scheduled maintenance or policy updates.

  - **Identify critical systems affected: ** Assess if the devices or configurations in question are critical to enterprise operations. Evaluate additional logs for sensitive devices; the impact of changes here may elevate the threat level.

  ### Prioritization

  The alert is medium severity due to the potential high impact of unauthorized modifications on critical Azure resources. While some legitimate administrative changes occur, the likelihood of abuse for compromising security controls makes it essential for swift investigation. This behavior, while not the most common, is opportunistically weaponized in attacks targeting cloud infrastructure.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate users to trigger alerts during routine maintenance or updates. To ensure reliable detection, Activity Logs must be properly configured to capture all relevant events. Legitimate activities like routine device updates may trigger false positives, necessitating adequate context for proper investigation. A companion detection that strengthens coverage is monitoring for failed authentication attempts (Event ID 4625) prior to these actions, which may indicate an attacker trying to gain access.

