  ---

  ### Technical Context

  This rule detects the creation of a new Azure Cloud Shell instance, which may be leveraged for various tasks including script execution, cloud resource management, and automation. An attacker could utilize this feature to execute commands and scripts within the Azure environment, potentially leading to unauthorized access or data exfiltration. The relevant MITRE ATT&CK tactics are Execution (TA0002) and Scripting (T1059).

  The primary telemetry source for this detection is Azure Activity Logs, specifically related to the operation `MICROSOFT.PORTAL/CONSOLES/WRITE`. If this behavior is malicious, it could result in unauthorized changes to resource configurations or compromise sensitive information. Importantly, this detection alone does not conclusively prove malicious intent; it must be correlated with other activities and indicators.

  ---

  ### Investigation Steps

  - **Review Azure Activity Logs:** Look for Event IDs related to `MICROSOFT.PORTAL/CONSOLES/WRITE` to identify timestamps, resource IDs, and user identities associated with the Cloud Shell creation.

  - **Evaluate User Roles and Activity:** Check the Azure Active Directory logs for user role assignments (e.g., Azure Contributor, Owner). Legitimate admin users may create CloudsShells; compare recent user activities against expected administrative behavior.

  - **Correlate with Historical Logins:** Examine logs for any unusual login patterns or geographic locations from which the Cloud Shell was created, focusing on Event ID 4624 (Logon) from Azure AD. Benign behavior typically sees logins from within the organization's usual geographies.

  - **Analyze Cloud Shell Activity:** If a new Cloud Shell was created, inspect logs for any commands executed within that shell using the Azure CLI or PowerShell logs. Malicious indicators may include attempts to access critical resources or APIs that are uncharacteristic for the user.

  - **Identify Creation Patterns:** Check for multiple Cloud Shell creations in rapid succession or anomaly patterns (e.g., outside of business hours). Such behavior may indicate scripted attacks or automation attempts, which are uncommon for legitimate use.

  ---

  ### Prioritization

  The severity of this alert is moderate. While the creation of a Cloud Shell can be legitimate, greater concern arises if it occurs outside normal operational patterns or if executed by accounts with elevated privileges. The potential for misuse in executing unauthorized commands makes this behavior notable, especially in sensitive or critical environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by Azure Activity Log retention policies; if logs are not preserved adequately, critical data could be missing. Evasion techniques could include attackers using legitimate administrative accounts or creating Cloud Shells during legitimate maintenance windows. Additionally, automated processes may trigger this alert, leading to false positives. A related detection to enhance coverage would be monitoring unusual API calls or administrator activities via Azure Monitor logs to catch potentially exploitative behaviors or misconfigurations.

