note: |
  ### Technical Context
  This detection rule focuses on identifying the creation of a new Azure Cloud Shell through the Azure Activity Logs. Azure Cloud Shell is a browser-based command-line interface that allows users to manage Azure resources and automate cloud deployments using various tools. The creation of a new Cloud Shell environment can be a legitimate action taken by system administrators or developers. However, it could also indicate attempts by an attacker to establish a foothold within the cloud environment, execute commands, or escalate privileges.

  The relevant MITRE ATT&CK tactics for this detection include **Execution** (TA0002) and specifically technique **Command-Line Interface** (T1059). If attackers gain access to a user account with sufficient privileges, they could create a Cloud Shell to run commands unnoticed. The primary data source for this rule is Azure Activity Logs, providing visibility into operations performed on Azure resources.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Start by examining the Azure Activity Logs for the `MICROSOFT.PORTAL/CONSOLES/WRITE` operation to find entries related to new Cloud Shell creations.
  - **Identify User Context:** Investigate the user accounts associated with the Cloud Shell creation events to determine if these users have the appropriate permissions and whether their recent activity appears suspicious.
  - **Correlate with Other Security Events:** Cross-reference the time and user context of Cloud Shell creation with other security telemetry, such as identity and access management logs or failed login attempts, to identify any anomalous activity patterns.
  - **Assess Cloud Resource Changes:** Look for additional changes to critical Azure resources or configurations that occurred around the same time as the Cloud Shell creation, as these may indicate further malicious intents.

  ### Prioritization
  This alert is prioritized as medium severity due to its potential implications for cloud security. While the creation of a Cloud Shell can be a legitimate action, the ability to execute commands within the Azure environment raises the likelihood of malicious configuration changes or data exfiltration.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if there are insufficient logging settings or if Azure Activity Logs do not capture older entries. The detection logic assumes that the user creating the Cloud Shell has not been compromised and that all legitimate administrator actions will be annotated correctly in the logs. Enabling detailed logging within Azure and ensuring proper role assignments are essential for this alert to function effectively.

