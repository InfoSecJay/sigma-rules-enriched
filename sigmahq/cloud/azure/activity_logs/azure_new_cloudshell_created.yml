note: |
  ### Technical Context

  This rule detects the creation of a new Azure Cloud Shell resource within the Azure portal, an action often associated with the execution of commands and scripts using cloud resources. The likely attacker objective is to establish a foothold within the environment for further exploitation, such as conducting reconnaissance or deploying malicious payloads. This behavior aligns with the MITRE ATT&CK tactic for Execution (TA0002) and specifically the technique for Command and Scripting Interpreter (T1059).

  The primary telemetry sources include Azure Activity Logs, specifically fields related to resource management events. The security impact of this detection hinges on the potential for unauthorized access to cloud resources and command execution. Importantly, this detection does NOT confirm malicious activity by itself; legitimate users, such as system administrators, may create Cloud Shells for valid operational needs.

  ### Investigation Steps

  - **Check Azure Activity Logs for events:** Search Activity Logs for the operation `MICROSOFT.PORTAL/CONSOLES/WRITE` with a timestamp coinciding with the alert to confirm the Cloud Shell creation event occurring under the relevant subscription (look for Event ID 201, which indicates resources were created).

  - **Identify the identity of the user or service principal:** Review the `initiatedBy` field in the Activity Log entry to determine who created the Cloud Shell. Legitimate activity will typically show system administrators or service accounts associated with routine tasks.

  - **Evaluate the user’s role and permissions:** Cross-reference the user’s role against Azure RBAC permissions to identify if the user had adequate privileges to create Cloud Shells. Pay attention to roles such as Owner or Contributor, which are expected to perform such actions.

  - **Analyze subsequent Cloud Shell activity:** If Cloud Shell was created, investigate command execution through Azure Activity Logs or Azure Monitor logs. Commands executed from Cloud Shell could indicate malicious behavior if they show signs of lateral movement or data exfiltration.

  - **Look for anomalous patterns of activity:** Review the recent historical behavior of the user creating the Cloud Shell, focusing on any spikes in activity or command execution that deviated from normal usage patterns that are typically available to a user in that role.

  ### Prioritization

  This alert has a medium severity level primarily due to the elevated risk of cloud resource exploitation associated with unauthorized use of Cloud Shells. The likelihood of malicious exploitation is moderate as attackers commonly utilize cloud shells to execute scripts for harmful purposes, especially if the creator is not a known administrator.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion via legitimate accounts being compromised, which might trigger alerts that appear benign. An Azure subscription may also require specific configurations to capture all necessary logs, especially if diagnostic settings are misconfigured or not fully enabled. Moreover, automated tools or scripts run by legitimate users could trigger this alert, highlighting the need for context around user activity. A companion detection to strengthen coverage would be monitoring for unusual command execution patterns from Cloud Shells, which would reveal potential malicious intent post-creation.

