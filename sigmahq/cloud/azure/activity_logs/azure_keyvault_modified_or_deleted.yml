note: |
  ### Technical Context
  This rule detects modifications or deletions of Azure Key Vault instances. The potential threat scenario involves an attacker attempting to manipulate sensitive cryptographic keys or secrets stored within Azure Key Vault, which can have severe consequences for the integrity and confidentiality of an organization’s data. Attackers may target these resources in an effort to gain unauthorized access to cryptographic materials or to disrupt information systems operational capabilities.

  Relevant MITRE ATT&CK tactics include **Impact** (T1499) and **Credential Access** (T1552), specifically the technique for **Application Layer Protocol** (T1552.001) since Azure Key Vault is accessed via API calls. The primary data sources for this detection rule are Azure Activity Logs, which provide a record of changes made to Key Vault resources, including the nature of modifications and the identities of the users making those changes.

  ### Investigation Steps
  - **Review Activity Logs:** Analyze Azure Activity Logs to identify the specific user and type of operation involved in the Key Vault modification or deletion, focusing on the time frame of the alert.
  - **Check User Identity:** Verify the credentials of the user or service account that initiated the operation, ensuring they have the appropriate roles and permissions in accordance with organizational policies.
  - **Assess Familiarity of Changes:** Investigate whether the changes were made from known or expected hosts and user agents to rule out any suspicious activities by unfamiliar users.
  - **Look for Correlation with Other Activities:** Correlate the detected activity with other logs (e.g., Authentication logs or SIEM alerts) to identify any preceding suspicious behavior that could indicate a larger compromise.

  ### Prioritization
  This alert is considered medium severity due to the potential impact on the integrity and security of sensitive data within the Azure environment. Unauthorized changes to Key Vault configurations can lead to significant credential exposure or operational disruptions, especially if performed by unauthorized users.

  ### Blind Spots and Assumptions
  There may be coverage gaps in detecting legitimate administrative actions that could generate false positives, as key vault modifications are often necessary for maintenance and operational purposes. The detection logic assumes that attackers would not have legitimate access or reason to modify the Key Vault, which may not account for insider threats. Additionally, the rule relies on comprehensive logging of Azure Activity to be properly configured and enabled, as log omissions or misconfigurations could prevent alerts from capturing all relevant activity.

