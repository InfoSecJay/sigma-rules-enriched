  ---

  ### Technical Context

  This rule detects modifications or deletions of Azure Key Vault resources, specifically operations tied to vault management through the Azure Activity logs. An attacker may aim to disrupt access to sensitive information, delete secrets, or modify access policies, facilitating further credential harvesting activities. This corresponds to the MITRE ATT&CK technique for account access management (T1552) and its sub-technique T1552.001, which deals with credential access through cloud services.

  The primary telemetry source is Azure Activity Logs, specifically monitoring the operation names associated with Key Vault manipulation such as `MICROSOFT.KEYVAULT/VAULTS/WRITE` and `MICROSOFT.KEYVAULT/VAULTS/DELETE`. If detected activity is malicious, it can lead to credential compromise and unauthorized access to secured applications and data. However, this detection does NOT confirm malicious intent on its own, as legitimate administrators can perform these actions as part of routine maintenance.

  ---

  ### Investigation Steps

  - **Identify the initiating user identity:** Review the `userId` field in the Azure Activity log for the user attempting the operation. An unfamiliar or unauthorized user account may indicate malicious activity. Look for activity from accounts not typically involved in key management.

  - **Examine user agent and source IP:** Check the `userAgent` and `clientIP` fields of the event. Legitimate modifications typically arise from corporate IP ranges and recognized user agents, while unfamiliar sources may indicate a possible breach.

  - **Confirm the context of changes:** Assess the operation time and correlate it with standard maintenance schedules. Legitimate activity often follows organizational change management protocols, while abrupt or out-of-hours changes could signal malicious intent.

  - **Analyze negative or host-impacting behavior:** If the operation resulted in `MICROSOFT.KEYVAULT/VAULTS/DELETE`, verify `resultType` for ‘success’ or ‘failure’. A failed deletion may indicate an attempted compromise, while a successful deletion without prior context could highlight critical security risks.

  - **Review for previous related alerts:** Cross-reference this alert with other alerts concerning unauthorized access attempts to key vaults. This can indicate systematic attempts to exploit weaknesses in access management protocols.

  ---

  ### Prioritization

  Given the potential impact on sensitive data storage and access controls in Azure Key Vault, the severity of this alert is medium. While not every modification or deletion is malicious, unauthorized changes can lead to significant data breaches if abused, especially given the critical asset nature of key vaults.

  ---

  ### Blind Spots and Assumptions

  This detection relies on complete and proper logging configurations within Azure; missing logs may hinder accurate detection. Attackers might utilize legitimate credentials or blend with standard administrative activities, providing avenues for evasion. Legitimate administrative actions, especially scheduled operations, may trigger this alert, necessitating a contextual review. Companion detections around abnormal access patterns or failed authentication can further enhance monitoring efficacy.

