note: |
  ### Technical Context

  This rule detects modifications or deletions of Azure Key Vault resources, specifically actions like writing, deleting, or changing access policies. These behaviors could indicate an adversary's goal of compromising secrets, such as cryptographic keys or authentication tokens, which can facilitate unauthorized access to sensitive data or services. This activity aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique of Credentials from Password Stores (T1552) and Exfiltration Over Command and Control Channel (T1041).

  The primary telemetry source for this detection is Azure Activity Logs. Key log types include events related to operations on Key Vault, specifically looking for event names such as `MICROSOFT.KEYVAULT/VAULTS/WRITE`, `MICROSOFT.KEYVAULT/VAULTS/DELETE`, and `MICROSOFT.KEYVAULT/VAULTS/ACCESSPOLICIES/WRITE`. If malicious, these actions can critically impact your environment's security posture by potentially exposing sensitive information. However, it’s essential to note that this detection alone does not confirm malicious intent—it could also indicate legitimate administrative actions.

  ### Investigation Steps

  - **Verify the user identity and source:** Investigate the user account or service principal responsible for the activity. Reference Azure Activity Logs for `Caller` and `Identity` fields to determine if the actions were taken by a legitimate administrator or an unexpected user.

  - **Assess the timing of the modification:** Check the `EventTimestamp` in the Activity Logs to analyze if the modification occurred during regular business hours or outside of normal operating hours, which may raise suspicion and warrant further investigation.

  - **Check for associated events:** Look for other related operations occurring before or after the detected activity. Specifically, verify if there were any `MICROSOFT.KEYVAULT/VAULTS/DEPLOY/ACTION` events in the last hour which may suggest an automated process or legitimate system administration.

  - **Evaluate changes in access policies:** Review the specifics of the access policy modifications by examining the `Properties` field in the logs. Ensure changes align with expected permission levels (e.g., check if the roles assigned match organizational policies).

  - **Identify high-confidence malicious indicators:** Look for modifications made by unfamiliar users or from unrecognized IP addresses. This can be identified by correlating `Caller` and `ClientIp` fields against known user asset lists.

  - **Legitimate behavior comparison:** Understand typical administrative patterns, such as scheduled maintenance or updates. For example, regular updates to access policies may occur during known maintenance windows and are typically logged by authorized users.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on sensitive data stored in Azure Key Vaults. If exploited, unauthorized modifications or deletions could lead to severe data breaches. Given the nature of such actions, they are often weaponized in attack scenarios involving credential theft or data exfiltration.

  ### Blind Spots and Assumptions

  Detection limitations may arise if logging is not properly configured, resulting in incomplete visibility into user actions. Adversaries may attempt to delete logs or misuse legitimate accounts, making it essential to monitor for suspicious activity involving privileged access. Common legitimate activities that may trigger this alert include authorized changes by system administrators during routine maintenance. A related detection that enhances coverage is monitoring failed access attempts to the Key Vault, which could indicate probing or misuse attempts.

