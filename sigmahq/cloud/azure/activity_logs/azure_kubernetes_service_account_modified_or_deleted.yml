note: |
  ### Technical Context

  This rule detects modifications or deletions of service accounts within Azure Kubernetes Service (AKS). This behavior often indicates that an attacker is attempting to escalate privileges, establish persistence, or compromise cloud-native workloads. The relevant MITRE ATT&CK tactics include 'Privilege Escalation' (T1485) and 'Account Manipulation' (T1531). The primary telemetry sources are Azure Activity Logs, specifically looking for the operation logs of service accounts.

  If these actions are malicious, the impact can be significant, potentially including unauthorized access to sensitive resources or disruption of services. However, this detection does NOT confirm that an adversary has successfully compromised the environment without further context, such as user identity and permissions.

  ### Investigation Steps

  - **Identify the user making the change**: Check Azure Activity Logs for Event IDs corresponding to service account modifications or deletions. Review the 'caller' field to determine who initiated the action. Look for high-privilege users or anomalies in user behavior.

  - **Examine timestamps and context**: Analyze the timestamp of the changes and correlate it with other login events (e.g., account creation or login logs) to identify if any suspicious activities occurred around that time. Pay special attention to unusual account usage patterns.

  - **Review service account usage history**: Investigate the usage of the service account in Azure Activity Logs to pinpoint normal operational behaviors. This may include the number and type of pods or services the account has been associated with.

  - **Check for impersonation actions**: Look for any records of service account impersonation in Azure Activity Logs (using operation: 'IMPERSONATE/ACTION'). This detects if there were attempts to access resources using altered identities.

  - **Assess the legitimacy of the requests**: Cross-reference the origin of the modification requests against known trusted sources (e.g., your internal administrators). Also, be cautious of requests originating from networks or IP addresses that are not part of your expected environments.

  ### Prioritization

  This alert has medium severity primarily due to the potential for privilege escalation and unauthorized access. The likelihood of malicious abuse is moderate, particularly in enterprise environments with multiple administrators. While changes to service accounts can be legitimate, they are also commonly weaponized in broader attack strategies against cloud infrastructure.

  ### Blind Spots and Assumptions

  Detecting service account modifications can be hampered by legitimate administrative activities, which could generate false positives. Reliable detection requires appropriately configured Azure Activity Logs with relevant permissions. Additionally, automated CI/CD pipelines or DevOps workflows may legitimately modify service account permissions, potentially triggering this alert. A companion detection would be monitoring for abnormal cluster activities or unauthorized pod deployments to strengthen coverage against misused service accounts.

