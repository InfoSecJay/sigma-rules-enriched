note: |
  ### Technical Context
  This detection rule identifies activities related to the modification or deletion of service accounts within Azure Kubernetes Services (AKS). Service accounts play a crucial role in managing access permissions for pods within Kubernetes environments. Unauthorized modifications or deletions of these accounts can indicate malicious activity aimed at disrupting operations or gaining unauthorized access to cluster resources.

  The potential threat scenario involves an attacker seeking to manipulate service account permissions to either escalate privileges within the Kubernetes environment or ultimately launch further attacks against other connected resources. This could lead to data exposure, system disruption, or lateral movement within the organization's infrastructure. Attack tactics include Credential Access (T1531), Privilege Escalation (T1485), and Defense Evasion (T1496), as detailed in the MITRE ATT&CK framework.

  Primary data sources for this detection are Azure activity logs, which capture API operations and changes related to various Kubernetes resources. Monitoring these logs will help analysts identify unauthorized modifications or deletions that warrant further investigation.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Investigate Azure activity logs for the operation names related to service account modifications or deletions. Look for timestamps, user identities, and any correlating operations that may indicate unusual behavior.
  - **Correlate User Context**: Verify the identities making changes to service accounts. Cross-reference these identities with known administrative users and assess whether the changes align with their operational activities.
  - **Analyze Cluster Role Bindings**: Examine role bindings and permissions associated with the modified or deleted service accounts. Check for any unauthorized or excessive permissions that may facilitate malicious actions.
  - **Monitor Related API Calls**: Track any subsequent API calls made using the modified or deleted service accounts. Unusual API usage patterns immediately following changes may indicate potential exploitation.

  ### Prioritization
  The alert generated by this rule is considered medium severity due to the immediate risk posed by unauthorized modifications or deletions of service accounts, which can significantly impact access control and permissions within the Kubernetes environment.

  ### Blind Spots and Assumptions
  This detection may miss changes initiated by legitimate administrators if operations are performed within expected timeframes or under normal usage patterns, leading to potential false negatives. The detection logic assumes activity logs are correctly configured and that API operations are not excluded from logging. Additionally, this detection requires appropriate permissions to access Azure activity logs for full visibility into service account modifications or deletions, which may not be available to all operational staff.

