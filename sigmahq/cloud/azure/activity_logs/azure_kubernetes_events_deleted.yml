title: Azure Kubernetes Events Deleted
id: 225d8b09-e714-479c-a0e4-55e6f29adf35
status: test
description: Detects when Events are deleted in Azure Kubernetes. An adversary 
  may delete events in Azure Kubernetes in an attempt to evade detection.
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
- https://github.com/elastic/detection-rules/blob/da3852b681cf1a33898b1535892eab1f3a76177a/rules/integrations/azure/defense_evasion_kubernetes_events_deleted.toml
author: Austin Songer @austinsonger
date: 2021-07-24
modified: 2022-08-23
tags:
- attack.defense-evasion
- attack.t1562
- attack.t1562.001
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName: 
      MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/EVENTS.K8S.IO/EVENTS/DELETE
  condition: selection
falsepositives:
- Event deletions may be done by a system or network administrator. Verify 
  whether the username, hostname, and/or resource name should be making changes 
  in your environment. Events deletions from unfamiliar users or hosts should be
  investigated. If known behavior is causing false positives, it can be exempted
  from the rule.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects deletions of events within Azure Kubernetes, which may indicate an attempt by an adversary to evade detection of malicious activities. The likely attacker objective is to remove traces of unauthorized actions or alterations within the Kubernetes environment. This detection aligns with the MITRE ATT&CK technique for Defense Evasion (T1562.001), focusing on the deletion of events that could provide forensic information. The primary telemetry source is Azure Activity Logs, specifically targeting operationName related to the deletion of Kubernetes events. If malicious, the security impact is significant, as it could obscure malicious actions taken within the cluster. It is essential to note that this detection does NOT confirm malicious activity by itself without additional context.

  ### Investigation Steps

  - **Analyze the user account performing the deletion:** Review the Azure Activity Log (Event ID specific to Kubernetes operations) to verify the `caller` property. Confirm if the user has elevated permissions typical of administrative roles. Unfamiliar users or those without a legitimate administrative context should raise a flag.

  - **Check for recent changes in the environment:** Cross-reference the deletion event timestamps against other Kubernetes activities (such as deployments or configuration changes) in the Activity Logs. If the timing aligns with known maintenance windows or scheduled tasks, it may indicate benign activity.

  - **Investigate event deletion patterns:** Look for patterns of repeated event deletions from the same resource or user. Use Azure Monitor Logs to query deletions over time, focusing on the `resourceId` and `operationName`. Frequent deletions could signify malicious intent.

  - **Validate legitimate administrative actions:** Confirm if the deletions were performed by known admins during authorized maintenance. Review the time and contextual operations leading up to the deletions against the `status` field of related Kubernetes resources in Activity Logs for benign patterns.

  - **Correlate with other detection systems:** Leverage other security telemetry that tracks suspicious activities in your Azure environment (e.g., Azure Defender alerts related to anomalous access patterns). Cross-reference signatures or alerts related to potential privilege escalation.

  ### Prioritization

  This alert carries a medium severity in an enterprise context, mainly due to the possibility of covering up malicious activity in Kubernetes clusters, which are critical components of modern application deployment. The likelihood of abuse is heightened as adversaries often seek to manipulate cloud environments to evade detection. However, event deletions can also occur through legitimate administrative actions, necessitating careful investigation.

  ### Blind Spots and Assumptions

  The detection may miss instances where event deletions are made via legitimate automation scripts, which could trigger valid alerts. It relies heavily on Azure Activity Logs being configured correctly for comprehensive coverage; without these logs, detection may be ineffective. Administrators conducting regular clean-ups of old events may also cause false positives. Related detections for favorable contextual coverage could include alerts for unauthorized access or changes made to Kubernetes RBAC configurations.

