title: Azure Kubernetes Events Deleted
id: 225d8b09-e714-479c-a0e4-55e6f29adf35
status: test
description: Detects when Events are deleted in Azure Kubernetes. An adversary 
  may delete events in Azure Kubernetes in an attempt to evade detection.
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
- https://github.com/elastic/detection-rules/blob/da3852b681cf1a33898b1535892eab1f3a76177a/rules/integrations/azure/defense_evasion_kubernetes_events_deleted.toml
author: Austin Songer @austinsonger
date: 2021-07-24
modified: 2022-08-23
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName: 
      MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/EVENTS.K8S.IO/EVENTS/DELETE
  condition: selection
falsepositives:
- Event deletions may be done by a system or network administrator. Verify 
  whether the username, hostname, and/or resource name should be making changes 
  in your environment. Events deletions from unfamiliar users or hosts should be
  investigated. If known behavior is causing false positives, it can be exempted
  from the rule.
level: medium
note: |
  ### Technical Context

  This rule detects deletions of events within Azure Kubernetes, specifically through the deletion operation in the Kubernetes Events API. The behavior indicates an adversarial attempt to erase potential evidence of malicious activities, aligning with tactics aimed at evading detection through defense impairment. The relevant MITRE ATT&CK technique is "Delete Cloud Service Logs" (T1685).

  Primary telemetry sources involve Azure Activity Logs, where events are logged for actions taken within the Kubernetes clusters, particularly around event management activities. If malicious, this activity can significantly hinder incident response efforts by obscuring the evidential trail. It is important to note that this detection does not confirm malicious intent by itself; legitimate administrative users may also delete events for valid operational reasons.

  ### Investigation Steps

  - **Validate the identity of the user:** Check the username associated with the deletion event in Azure Activity Logs (API: `Microsoft.Kubernetes/ConnectedClusters/Events.K8s.io/Events/Delete`). Legitimate administrators may conduct similar actions; verify whether the user has expected roles and permissions.

  - **Examine the event logs for context:** Look for additional log entries around the time of deletion, particularly those showing event creation or anomalies (Event Type: `EventDeletions`). This helps establish a timeline and may reveal a pattern inconsistent with typical administrative behavior.

  - **Identify the resource and proximity of deletion:** Review the specific Kubernetes cluster and namespaces affected by these deletions using the `resourceId` in the telemetry fields. Determine if the deletion correlates with ongoing incidents or operational changes that justify legitimate activity.

  - **Monitor for concurrent anomalous actions:** Search for associated suspicious activities within the same timeframe, such as unsanctioned deployments or configuration changes (Event IDs related to `CREATE` or `UPDATE` operations). This may highlight a broader malicious tactic.

  - **Compare deletion patterns against normal practices:** Analyze historical activity logs to create a baseline of typical event deletion patterns. Identify any deviations that suggest abnormal behavior or excessive deletion rates, especially from unusual or unknown users.

  ### Prioritization

  Alerts for deleted events in Azure Kubernetes are a medium priority as they suggest potential evasion tactics that could be leveraged by malicious actors to mask their activities. The risk escalates if deletions are linked to critical systems where logging is essential for forensic analysis. While not always weaponized, patterns of such behavior merit timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist as this could also trigger due to legitimate administrative actions; hence, context from user roles is crucial. Required log sources must be configured properly in Azure Activity Logs to ensure comprehensive monitoring. Familiar legitimate actions may include routine maintenance by cloud administrators. Companion detections, such as monitoring for `CREATE` events in Kubernetes, could help build a clearer picture of potential malicious behavior related to the deletions.

