note: |
  ### Technical Context
  This detection rule identifies when events within Azure Kubernetes are deleted. In an enterprise environment, the deletion of Kubernetes events can indicate an adversary's attempt to cover their tracks or evade detection following a malicious activity. By eliminating these records, attackers can hinder the ability of security analysts to perform forensic investigations, making it challenging to understand the sequence of events leading to a potential compromise.

  The primary attacker objectives in this scenario typically involve data exfiltration, privilege escalation, or lateral movement within the cloud environment. Happy hunting grounds like Kubernetes clusters are ripe for attackers looking to manipulate workloads or resources. This activity aligns with the MITRE ATT&CK tactics for Defense Evasion (T1562) and specifically the technique for Deleting Event Data (T1562.001).

  The main data source that will provide the most relevant evidence for this detection is the Azure Activity Logs, specifically operations related to Kubernetes resource management, which record the deletion operations performed within the clusters.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Examine the Azure Activity Logs for operations related to Kubernetes, focusing on the deletion of events. Pay attention to timestamps and the user accounts involved in these actions.
  - **Identify User Context**: Investigate the identity of the user or service account performing the deletions. Verify whether the actions align with known roles and responsibilities within your organization.
  - **Correlate with Other Logs**: Look for correlation within other telemetry sources such as Kubernetes audit logs, network logs, and EDR data to identify any unusual activity associated with the account in question.
  - **Establish Normal Baseline**: Compare the deletion patterns against a baseline of normal operational activity within your Kubernetes environments to identify any deviations that warrant further investigation.

  ### Prioritization
  Given the potential for malicious actors to leverage deleted events as a means to obscure their activities, this alert holds medium severity. Timely detection and investigation can help prevent extended dwell time and mitigate risks associated with an active intruder in the environment.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots regarding legitimate administrative actions, as event deletions can occur during routine maintenance or cleanup tasks by system or network administrators. The detection logic assumes that all event deletions, regardless of the responsible user, warrant scrutiny, which may not be the case in all environments. Additionally, adequate logging must be enabled within Azure to capture these activities. If logs are not retained or if user roles are misconfigured, there may be gaps in detection efficacy.

