note: |
  ### Technical Context

  This rule detects rare subscription-level operations in Azure, specifically identifying actions taken from previously unseen source IP addresses that grant access to Azure resources, such as database accounts and storage accounts. The attacker objective here could be to gain unauthorized access to sensitive data or to escalate privileges within Azure, potentially leading to data breaches or service disruptions. This behavior aligns with MITRE ATT&CK technique T1003 (Credential Access).

  The primary telemetry sources for this detection come from Azure Activity Logs, which provide insight into user activities within the Azure environment. If malicious, these operations could lead to significant security impacts, such as the unauthorized access or manipulation of cloud resources. It is important to note that this detection alone does not confirm malicious intent; legitimate users may occasionally perform similar operations from new IP addresses, especially if they are working remotely or changing locations.

  ### Investigation Steps

  - **Review the Azure Activity Logs:** Check for the specified actions related to `listKeys` and `write` commands (e.g., `Microsoft.DocumentDB/databaseAccounts/listKeys/action`) in Activity Logs (noted in the Azure portal under "Monitor" → "Activity Log").

  - **Identify the source IP address:** Cross-reference the source IP address with internal records to determine whether it is recognized and expected (e.g., user documentation, IP whitelists). Legitimate sources may include a known office location or VPN.

  - **Analyze user account behavior:** Investigate the identity of the user who performed the operation. Look for unusual patterns, such as abnormal hours of operation or recent changes in permissions that might indicate credential theft.

  - **Examine related resource activity:** Check for ancillary operations around the time of the alert (e.g., other actions by the same user or adjacent IPs), focusing on any preceding events leading up to the unusual activity.

  - **Confirm recent legitimate changes:** Assess if organizational changes, such as staff onboarding or migrations, could explain the alert, particularly if they involve access changes to services like Azure Storage or Databases.

  - **Look for high-confidence malicious indicators:** Search for prior incidents or alerts associated with the detected IP address in internal threat intelligence sources to identify if it has been flagged for suspicious activities in the past.

  ### Prioritization

  The severity of this alert is medium, as it can indicate potential unauthorized access or account compromise. It is crucial to respond promptly to mitigate risks, given that this type of behavior can be weaponized for broader cloud exploitation if left unaddressed. The likelihood of malicious abuse is significant, especially in environments with high-value data.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users performing necessary operations from new IPs, especially during pandemics or workforce shifts. Reliable detection requires comprehensive logging capabilities within Azure and understanding of typical user behavior. This alert may be triggered by legitimate changes in cloud infrastructure management, particularly by service administrators. A companion detection to consider would be monitoring for failed login attempts associated with the same user or IP to provide additional context.

