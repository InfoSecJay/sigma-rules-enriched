  ### Technical Context

  This Sigma rule detects rare subscription-level operations in Azure by identifying IPs from which users grant access to other users on Azure resources via specific action keywords, such as `listKeys` or modifications to network security groups. The likely attacker objective is to escalate privileges or gain unauthorized access to sensitive Azure resources. Relevant MITRE ATT&CK tactics and techniques may include **Credential Access (TA0006)** with techniques such as **Credential Dumping (T1003)**.

  The primary telemetry source is Azure Activity Logs, which include operations performed within Azure resources. If this behavior is malicious, the impact could involve severe data breaches or unauthorized administrative access against essential services. This detection does NOT confirm malicious intent on its own; legitimate administrative activities may also trigger this rule.

  ---

  ### Investigation Steps

  - **Check the source IP address:** Review the Azure Activity Log for the `callerIpAddress` field. Compare against historical data to determine if the source is unauthorized or uncommon, noting any prior legitimate usage from the same entity.

  - **Verify user permissions:** Cross-reference the user initiating the action with Azure Active Directory logs (Event IDs: 4624 for logons, 4768 for Kerberos ticket requests) to ensure they have appropriate permissions for the operations being initiated.

  - **Review recent user activity:** Examine the history of changes made by the user in Azure Activity Logs. Legitimate administrative activities typically involve routine resource management, such as scheduled updates or routine maintenance.

  - **Identify action keywords:** Look specifically for the execution of commands such as `listKeys` or modifications to security groups. Record Event specific details: `resourceId`, `operationName`, and `statusCode` to assess the success or failure of these commands.

  - **Examine security group modifications:** Check for changes to Network Security Groups (NSGs) using the relevant operation logs. Any unexpected additions or deletions can indicate potentially malicious activity. Use Azure Resource Manager API logs to review this.

  - **Assess related alerting mechanisms:** Investigate whether companion detections exist for broader credential access attempts or unusual access patterns (e.g., alerts for multiple failed authentication attempts in the same timeframe).

  ---

  ### Prioritization

  This alert should be considered medium severity, particularly if it originates from a critical system or user account, as it may indicate potential privilege escalation or access abuse. The likelihood of malicious usage is moderate, given the specificity of the actions monitored, which are often weaponized in cloud environments.

  ---

  ### Blind Spots and Assumptions

  This detection may miss evasion attempts such as using legitimate user credentials or actions executed from within a trusted network environment. Reliable detection requires comprehensive logging from Azure Activity Logs capturing all relevant `write` and `listKeys` operations. Legitimate administrative actions, such as routine key rotations or security updates, may trigger this alert. A related detection to enhance coverage might monitor failed authentication attempts or anomalous patterns in user activity across Azure resources.

