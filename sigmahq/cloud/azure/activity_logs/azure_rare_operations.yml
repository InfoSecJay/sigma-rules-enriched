note: |
  ### Technical Context
  This rule detects instances where users in an Azure environment conduct rare subscription-level operations from previously unseen IP addresses. Specifically, it identifies actions that involve granting access to other users for various Azure resources, such as reading and writing keys for services like DocumentDB, Media Services, and Cognitive Services. The detection is crucial as it can indicate potential misuse of credentials, either by an insider or an external actor who has gained access to user accounts.

  In attack scenarios, malicious actors might exploit legitimate user credentials to manipulate access permissions for Azure resources, potentially leading to data breaches or unauthorized resource manipulation. The likely objectives may include gaining elevated permissions, exfiltrating sensitive data, or establishing persistent access to the environment.

  Relevant MITRE ATT&CK tactics for this detection include:
  - Credential Access (TA-0006, ID: T1003): This refers to the methods employed by attackers to gain unauthorized access to user credentials.
  - Persistence (TA-0003, ID: T1078): This tactic involves using legitimate credentials to maintain access to the system.

  Primary data sources for investigating these activities include Azure Activity Logs, which provide detailed information on user actions and can highlight unusual IP behaviors.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Examine the activity logs for the detected subscription-level operations, focusing on any anomalies or patterns, especially the source IP addresses associated with these actions.
  - **Correlate with User Access Controls**: Verify if the users performing these actions have the appropriate permissions consistent with their roles in the organization. Look for any excessive permissions or anomalies in user accounts.
  - **Investigate Source IP Addresses**: Validate the legitimacy of the source IP addresses by cross-referencing them against known safe IPs and identifying if they correlate with any suspicious or geographic anomalies.
  - **Conduct User Interviews**: If necessary, engage on-call personnel or affected users to confirm whether they performed the actions from the detected IP, gathering context around their recent activities and motivations.

  ### Prioritization
  The alert should be treated with medium severity due to the potential for significant impact if unauthorized access leads to resource modifications or data breaches. The likelihood of real threats is elevated if the operations originate from unknown or unusual IP addresses.

  ### Blind Spots and Assumptions
  This detection logic assumes that all Azure activity is logged correctly and that the monitored IP addresses encompass legitimate user ranges, which may not always be the case. Potential blind spots include rare yet valid operations that do not conform to typical patterns, resulting in false positives. Additionally, the detection relies heavily on the availability and configuration of Azure Activity Logs; any misconfigurations or omissions could lead to missed detections or incomplete context for the alerts.

