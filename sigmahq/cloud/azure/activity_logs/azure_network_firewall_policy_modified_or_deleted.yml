note: |
  ### Technical Context

  This rule detects modifications or deletions of Azure Firewall Policies, which are critical for controlling inbound and outbound traffic to Azure resources. The likely attacker objective may include disabling security controls to enable further malicious activities, such as data exfiltration or lateral movement within an Azure environment. This behavior aligns with the MITRE ATT&CK tactic of “Defense Evasion” (T1484) and the technique of “Disable Security Tools” (T1686.001).

  The primary telemetry source for this detection is Azure Activity Logs, specifically monitoring the operations related to firewall policies like WRITE and DELETE actions. If the logged activity is determined to be malicious, it could result in unauthorized access to sensitive systems or data breaches. This detection does NOT confirm that an actual breach has occurred, as legitimate administrative actions can also trigger it.

  ### Investigation Steps

  - **Verify user identity and role**: Cross-reference the user initiating the modification with Azure Active Directory to confirm whether they have appropriate administrative permissions. Review User Object ID and Role Assignment details.

  - **Check operation details in Activity Logs**: Retrieve Azure Activity Logs (Event ID: 590) and filter for the operations `MICROSOFT.NETWORK/FIREWALLPOLICIES/WRITE` or `MICROSOFT.NETWORK/FIREWALLPOLICIES/DELETE` to analyze the timestamp, user agent, and command context.

  - **Assess the legitimacy of actions**: Identify any routine maintenance or scheduled changes logged around the same timeframe by relevant users or automation accounts. Look for expected modifications that align with authorized administrative tasks.

  - **Investigate changes to critical firewall rules**: Review the specific changes made to firewall rules or collection settings (i.e., in forward and reverse proxy settings) to determine if they grant excessive permissions that could expose resources.

  - **Compile an audit of recent changes**: Create a report summarizing recent firewall policy modifications, including before-and-after states of rules, to identify unauthorized or suspicious alterations.

  - **Look for correlated alerts**: Check for any related alerts in security tools regarding access to other Azure resources or unusual traffic patterns that correlate with the timing of the policy changes.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on the security posture of Azure resources. Unauthorized modifications or deletions could enable adversaries to exploit vulnerabilities, and actions similar to this are frequently weaponized in cloud attacks. The likelihood of abuse is elevated, particularly in environments with multiple administrators making changes regularly.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where logging is not consistently configured or where legitimate activity may involve multiple users modifying policies. Adversaries may also use legitimate accounts to evade detection, complicating investigations. Additionally, administrative automation tools might trigger similar alerts without malicious intent. Consider supplementing with alerts for unusual logins or access patterns in Azure AD to strengthen coverage against unauthorized changes to firewall policies.

