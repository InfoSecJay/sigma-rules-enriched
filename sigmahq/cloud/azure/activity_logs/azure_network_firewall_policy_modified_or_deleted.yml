  ---

  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Firewall Policies, which could indicate unauthorized changes to network security configurations. The likely adversary objective may include disrupting network security controls, allowing malicious traffic, or hiding unauthorized access. This behavior is associated with the MITRE ATT&CK technique "Modify Existing Service" (T1562.007) under the tactic of "Impact."

  Primary telemetry sources include Azure Activity Logs, specifically monitoring for events related to the operations `MICROSOFT.NETWORK/FIREWALLPOLICIES/WRITE`, `DELETE`, or other related actions. If successful, a malicious action could lead to significant vulnerabilities and data exfiltration or unauthorized access. Importantly, the detection does not confirm that an attack has occurred on its own; legitimate changes by authorized personnel may trigger this alert.

  ---

  ### Investigation Steps

  - **Identify modifying user identity: ** Check Azure Activity Logs for `eventTime`, `caller`, and `status` fields to confirm who modified or deleted the firewall policy. Compare against expected user roles (e.g., system administrators).

  - **Review policy impact assessment: ** Investigate which firewall policy was modified by examining `properties`. Determine if the changes could weaken security (e.g., removal of essential rules).

  - **Check for related suspicious activity: ** Review the activity logs for any other anomalous events surrounding the modification time frame, such as unauthorized access or unusual user agent strings.

  - **Assess legitimate changes: ** Look for established activity patterns. Verify if changes align with known operational processes, such as scheduled updates or planned security configurations by authorized staff.

  - **Correlate with ongoing incidents: ** Cross-reference against any existing alerts or investigations; this could indicate broader malicious efforts if linked with other suspicious activities, like abnormal login attempts or changes in user roles.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact on security controls within Azure environments. Although not immediately indicative of a breach, the likelihood of misuse from unknown users can be significant, as adversaries often target firewall policies to facilitate undetected access.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of user identity validation and the completeness of log management configurations. Valid system administrators may generate false positives by legitimately modifying firewall settings. Implementing additional detection rules for user behavior analytics can strengthen the coverage against this alert, such as monitoring for unusual access patterns prior to modifications.

