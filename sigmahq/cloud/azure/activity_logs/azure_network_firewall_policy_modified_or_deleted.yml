note: |
  ### Technical Context
  This detection rule monitors for modifications or deletions of Azure Firewall Policies. Azure Firewall Policies are critical components that help define network security rules, and any unauthorized changes may point to potential compromise, malicious insider activity, or misconfigured access controls. Attackers may target these policies to create a permissive environment conducive to data exfiltration or lateral movement within the network.

  The relevant MITRE ATT&CK tactics for this detection are **Impact** (TA0040) and **Defense Evasion** (TA0069), specifically technique **T1562.007 - Impair Defenses: Network Share Permissions**. This equation highlights an attacker’s goal to undermine security measures in place, facilitating their objectives without being detected.

  The primary data source for this detection lies in Azure Activity Logs, which record various actions taken on Azure resources, providing visibility into changes made to Firewall Policies. These logs include operations performed by users, services, or applications that could indicate unauthorized attempts to manipulate security configurations.

  ### Investigation Steps
  - **Review Activity Logs:** Check Azure Activity Logs for `MICROSOFT.NETWORK/FIREWALLPOLICIES/WRITE`, `DELETE`, or related operations to identify the nature and source of the change.
  - **Verify User Context:** Investigate the user identity associated with the changes; analyze if this user has legitimate access and if their activity aligns with established roles and responsibilities.
  - **Assess Timing and Patterns:** Look for anomalies in the timing of changes or repeated modifications from the same user or IP address that could indicate malicious activity or misconfigured automated processes.
  - **Cross-reference with Security Controls:** Examine any corresponding alerts from other security controls (like SIEM or EDR) that may highlight potentially malicious behaviors or compromised accounts in relation to the Firewall Policy modifications.

  ### Prioritization
  The alert is considered medium priority due to the potential impact of unauthorized modifications to network security policies, which can lead to data breaches or other compromising activities. The likelihood of such actions occurring is heightened by the increasing sophistication of attackers targeting cloud environments.

  ### Blind Spots and Assumptions
  This detection logic assumes that the monitoring of Azure Activity Logs is properly enabled and that all relevant events are being recorded. A gap in coverage may exist if there are users or processes with elevated permissions making legitimate changes that are not thoroughly monitored, leading to potential false negatives. Additionally, this rule does not account for legitimate system administrator actions that may generate false positives, necessitating thorough investigation to ascertain the context of each alert.

