note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Network Firewall Policies, which are critical for enforcing security rules and access controls within Azure environments. The likely attacker objective is to alter firewall configurations to bypass security measures or facilitate unauthorized access. This behavior corresponds with the MITRE ATT&CK tactic "Impact" and technique ID T1562.007 (Impair Defenses).

  The primary telemetry source for this rule is Azure Activity Logs, specifically looking for events indicating changes to firewall policies. If malicious, such actions can lead to significant security weaknesses, making the organization vulnerable to attacks. It is important to note that the detection does not confirm malicious intent on its own; legitimate administrative actions may also trigger this rule.

  ### Investigation Steps

  - **Identify event details:** Review Azure Activity Logs (Event Type: 'Microsoft.Network/firewallPolicies/write' and 'Microsoft.Network/firewallPolicies/delete') to check the timestamp and user identity associated with the modification or deletion.

  - **Correlate user actions:** Validate the user identity against administrative roles. Check user role assignments in Azure (use Azure AD logs) to determine if the change was executed by a legitimate admin versus a potentially compromised account.

  - **Investigate change impact:** Examine the specific configurations that were modified or deleted, including rules and policies. Compare against baseline configurations to identify any unauthorized changes.

  - **Confirm expected behavior:** Document any recent scheduled maintenance or policy reviews by known administrators to rule out false positives. Ensure there's a record of legitimate changes made by the team.

  - **Identify high-confidence malicious indicators:** Look for modifications from unfamiliar IPs or users not assigned admin roles. Monitor for sudden deletions or changes made outside of standard business hours.

  ### Prioritization

  The alert's severity is medium, primarily due to the potential for significant impact if firewall policies are modified or deleted maliciously. The likelihood of abuse is elevated, as attackers may target firewall configurations to facilitate lateral movement or exfiltration. This specific behavior has been weaponized in past attacks, making timely investigation crucial.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate users being compromised, thus allowing attackers to make changes without raising alarms. This detection relies heavily on properly configured Azure Activity Logs; any misconfiguration may lead to blind spots. Legitimate maintenance activities, such as scheduled policy revisions by system admins, may also trigger this alert. A related detection to enhance coverage is monitoring Azure Active Directory sign-ins for unusual login patterns before or after policy changes.

