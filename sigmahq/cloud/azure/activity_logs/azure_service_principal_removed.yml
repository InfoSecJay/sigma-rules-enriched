note: |
  ### Technical Context

  This Sigma rule detects the removal of a service principal in Azure, which could indicate malicious activity such as unauthorized access or lateral movement within a cloud environment. The likely goal of an adversary is to disrupt services or facilitate further infiltration by eliminating entities that could control or authenticate processes in Azure. This behavior aligns with the MITRE ATT&CK technique T1078.003 (Valid Accounts: Cloud Accounts).

  The primary telemetry source for this detection is Azure Activity Logs, specifically monitoring events related to service principal management. If this activity is indeed malicious, it could lead to compromised cloud service operations or user account impersonation, potentially resulting in data breaches or service outages. However, this detection does NOT confirm that malicious activity is occurring; it may also represent legitimate administrative actions.

  ### Investigation Steps

  - **Review the user identity: ** Cross-reference the identity that removed the service principal against known administrators. Use Azure Activity Logs to examine the `caller` field in the activity logs (Event ID: 1) to identify if the action was taken by a legitimate admin or potentially a compromised account.

  - **Check timestamps and user behavior: ** Analyze the `eventTimestamp` field in the Azure Activity Logs to see if the removal coincides with unusual login patterns, such as access from unfamiliar IP addresses to assess potential malicious behavior.

  - **Evaluate service principal function: ** Identify the service principal's purpose by checking associated applications and resources to determine if its removal aligns with expected administrative activities. Use the `resourceId` field to establish what application or service depends on this principal.

  - **Investigate clustered user activity: ** Look for patterns of similar actions performed by the same user or IP address. Multiple changes within a short timeframe may indicate scripting or malicious automation, as seen in Azure Activity Logs.

  - **Identify benign administrative actions: ** Compare the removal to their historical activity. If the user has previously performed service principal management without incident, it may indicate legitimate behavior.

  - **Link to related alerts: ** Cross-reference with alerts related to successful logins or privilege escalations. Look for Azure sign-ins in the Azure Active Directory logs experiencing user agent changes that could indicate malicious activity (Event ID: 4624) preceding the service principal removal.

  ### Prioritization

  This alert is of medium severity because while the removal of a service principal can potentially disrupt services, it is often performed by system administrators for legitimate reasons. However, the likelihood of malicious abuse exists, particularly if the action is performed by unauthorized personnel or associated with other suspicious activities.

  ### Blind Spots and Assumptions

  Detection may face limitations due to legitimate administrative actions that could trigger this alert, such as system management changes or automated scripts. Organizations should ensure comprehensive logging of Azure Activity Logs is enabled for accurate detection. Additionally, false positives may arise if service principals are regularly retired or reconfigured by known users. Companion detections that focus on the usage patterns of service principals (e.g., excessive credential use) can provide additional context and strengthen overall coverage.

