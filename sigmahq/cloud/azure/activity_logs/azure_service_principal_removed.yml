note: |
  ### Technical Context
  This detection rule identifies instances where a service principal is removed in the Azure environment. A service principal represents an application or service within Azure Active Directory (Azure AD) and is essential for managing identities and access in cloud-based applications. Attackers may target service principals to disrupt operations, gain unauthorized access, or facilitate lateral movement within the cloud environment. The removal of a service principal could signify potential malicious activity, particularly if the action was taken by an unrecognized user or occurred outside of normal operating patterns.

  In terms of MITRE ATT&CK, this behavior could relate to the tactics of **Defense Evasion** and **Account Manipulation** (T1070 and T1112). Attackers may seek to hide their activities or change the security posture of the environment by manipulating service principals. Primary data sources for this detection include Azure activity logs, where actions related to service principals are recorded, including context around who initiated the removal and from what user agent or location.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Analyze the Azure activity logs for entries indicating the removal of service principals. Pay attention to the time, user identity, and associated metadata (e.g., user agent and source IP) to identify any anomalies.

  - **Verify User Identity:** Confirm the legitimacy of the user who removed the service principal. Check whether the user is recognized within your organizational structure and has the required permissions to perform this operation.

  - **Check Historical Patterns:** Compare the removal of the service principal against historical data to determine whether similar actions have been performed previously by the same or different users. Unexpected removals or changes in behavior should be flagged for further investigation.

  - **Investigate Contextual Factors:** Look for additional contextual information around the activity, such as other administrative changes made around the same time. Cross-reference against alerts for suspicious behavior in related systems like IAM and identity governance logs.

  ### Prioritization
  The severity of this alert is medium due to the potentially significant impact that unauthorized removal of service principals can have on cloud-based applications and services. Successful exploitation could allow an attacker to bypass security controls and facilitate unauthorized access, increasing the likelihood of follow-on attacks.

  ### Blind Spots and Assumptions
  This detection rule may not fully capture all scenarios in which service principals are altered, particularly legitimate administrative changes when they occur during maintenance windows. The detection logic assumes that the removal of service principals by known administrators is legitimate; however, it is crucial to consider implications of compromised credentials or insider threats. The rule requires comprehensive Azure activity logging to function effectively, and configurations must ensure that all service principal management activities are logged.

