  ---

  ### Technical Context

  This Sigma rule detects the removal of a service principal in Azure, a critical action that can influence application access and permissions. The likely objective of an attacker would be to disrupt services, escalate privileges, or cover their tracks after unauthorized access. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique of Service Account Manipulation (T1078.003).

  The primary telemetry sources required for this detection are Azure Activity Logs, specifically monitoring for entries with the event message "Remove service principal." The security impact is significant if this action is malicious, potentially resulting in unauthorized application access or loss of legitimate service operation. This detection alone does NOT confirm malicious intent; it requires context regarding the user identity and operational environment.

  ---

  ### Investigation Steps

  - **Check the User Identity and Context:** Review the user identity who triggered the alert. Use Azure Activity Logs, focusing on fields such as `identity`, `userType`, and `userAgent` to determine if the user has legitimate permissions to remove the service principal.

  - **Examine the Service Principal:** Identify which service principal was removed by querying the Azure Active Directory logs. Look for relevant fields such as `appId` or `displayName` to ascertain its purpose and whether the removal aligns with known administrative actions.

  - **Review Recent Changes by the User:** Inspect the Azure Audit Logs for recent activities by the user, particularly around the time of service principal removal. Look for repeated suspicious actions or changes (e.g., Event IDs related to `Add` or `Remove` operations) that may indicate malicious intent.

  - **Identify Legitimate Activity Patterns:** Document any known scheduled maintenance or administrative changes made by privileged accounts that regularly manage service principals. Compare these patterns against the timeframe of the alert to establish potential legitimacy.

  - **Investigate Related Security Incidents:** Cross-reference the user identity and removed service principal with any existing security incidents or alerts in your organization’s SIEM or security toolset, and analyze if this ties back to prior incidents.

  - **Filter for High-Confidence Malicious Indicators:** Pay special attention to service principals removed by unfamiliar or non-administrative user identities. Query using Azure AD logs for entries with `role` and `type` fields to detect unauthorized attempts.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact on access permissions for sensitive applications. The likelihood of malicious abuse is moderate, particularly in environments where service principals are integral to the operation of critical services. While removal of service principals can occur for legitimate reasons, it is also commonly weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics where an attacker might exploit a legitimate user’s credentials to remove service principals without raising suspicion. Required log sources must be correctly configured to capture Azure Activity Logs comprehensively. Legitimate activities, such as scheduled administrative clean-ups, may trigger the alert. A related detection includes monitoring for "Add service principal" events, which can provide insight into the context surrounding deletions and enhance overall visibility.

