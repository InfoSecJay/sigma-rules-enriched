note: |
  ### Technical Context

  This detection identifies the removal of a service principal in Azure, which may indicate an unauthorized attempt to disrupt access controls or potentially escalate privileges within the Azure environment. An attacker might aim to disable legitimate applications or services by removing their service principals, thereby hindering functions dependent on those identities.

  This behavior maps to the MITRE ATT&CK tactics of **Initial Access** (TA0001) and **Privilege Escalation** (TA0004), specifically the technique of **Service Account Compromise** (T1078). The primary telemetry sources for this detection are Azure Activity Logs where specific event types relate to administrative changes. If malicious, the impact could lead to service disruptions, unauthorized access, or lateral movement within Azure. However, this detection does NOT confirm that malicious intent was behind the removal; benign actions from authorized administrators can also trigger this alert.

  ### Investigation Steps

  - **Verify the user identity:**
    Check the `Caller` field in Azure Activity Logs (event type: `Remove service principal`) to confirm if the identity is known and expected for changes of this nature. Legitimate removals often involve recognized administrators.

  - **Examine user agents and IP addresses:**
    Investigate the `UserAgent` field and the originating `IP Address` for the removal event to identify whether the action is consistent with typical administrative access patterns, noting any anomalies.

  - **Assess the context of the removal:**
    In the Azure Activity Log, review the `TimeGenerated` and any related activities around the time the service principal was removed. Look for any preceding suspicious activities (e.g., unauthorized logins).

  - **Document service principal purpose:**
    Identify the role and functions of the removed service principal. Reference associated applications and services to determine potential impacts and whether other identities may be affected.

  - **Review for high-confidence malicious indicators:**
    Check if the removal was performed by a newly created or unknown Identity (`AppID` or `ServicePrincipalId`). If found, this is a strong indicator of malicious activity.

  - **Correlate with companion alerts:**
    Check for other alerts related to unauthorized access or modification of service principals in the Azure environment, especially those indicating suspicious role assignments or access attempts prior to the removal event.

  ### Prioritization

  The severity of this alert is medium as the impact can vary based on the criticality of the affected service principal. The likelihood of malicious abuse is moderate, especially if the change is made by unidentified users or during unusual hours. This behavior is not uncommon in attacks that can leverage service accounts for lateral movement or data exfiltration.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for Azure Activity Logs is incomplete or improperly configured. Legitimate activities, such as administrative changes performed during routine maintenance or known updates, may trigger the alert. There may also be occasional false positives related to authorized administrative activities. A companion detection would include monitoring for changes to role assignments that may indicate privilege escalation attempts in conjunction with service principal removals.

