note: |
  ### Technical Context

  This rule detects modifications or deletions of Azure Firewalls, indicating possible unauthorized changes made to critical Azure network security configurations. The likely attacker objective could include disrupting security controls, allowing for unauthorized inbound or outbound traffic, or conducting lateral movement within the network. This behavior is aligned with the MITRE ATT&CK tactic "Impact" (TA0040) and the technique "Modify Application-Level Protocol" (T1562.004).

  The primary telemetry sources include Azure Activity Logs, specifically operations related to Azure Firewall modifications and deletions (e.g., `MICROSOFT.NETWORK/AZUREFIREWALLS/WRITE` and `MICROSOFT.NETWORK/AZUREFIREWALLS/DELETE`). If malicious, this could lead to significant security exposures. Notably, this detection does not confirm malicious intent on its own; legitimate changes by authorized administrators can trigger the alert.

  ### Investigation Steps

  - **Verify user identity and role**: Cross-reference the user associated with the alert against Azure AD logs (Azure AD Sign-ins) for user role and last activity. Ensure the user has appropriate administrative privileges to modify the firewall.

  - **Check the user agent and hostname**: Inspect Azure Activity Logs for the `caller` field to validate whether the request originated from expected internal systems, indicating legitimate administrative activity.

  - **Assess the context of the changes**: Review `operationName` in Azure Activity Logs for timestamp proximity to other administrative actions to identify patterns of legitimate behavior (e.g., scheduled maintenance). Malicious activity may occur outside normal change windows.

  - **Identify recent changes to firewall rules**: Look for recent modifications in firewall rules and settings within the Azure portal to assess whether they align with organizational policies. Check for abrupt or multi-step changes that deviate from normal operational procedures.

  - **Investigate the frequency of modifications**: Analyze the frequency of activities logged under `MICROSOFT.NETWORK/AZUREFIREWALLS/WRITE` and `MICROSOFT.NETWORK/AZUREFIREWALLS/DELETE`. High-frequency changes may indicate automated or scripted attempts to bypass security controls.

  ### Prioritization

  This alert is of medium severity due to the potential high impact on network security configuration. Unauthorized changes, particularly by external adversaries, can greatly compromise the defenses of the environment. However, given that legitimate administrative actions can trigger this alert, the context must be carefully analyzed before escalation.

  ### Blind Spots and Assumptions

  Detection may miss sophisticated attackers using legitimate credentials to mask their activities, indicating a reliance on role-based access controls for accurate detection. Proper logging of Azure Activity requires ensuring that all relevant operations are enabled in Azure. Additionally, legitimate adjustments by system administrators for routine maintenance or changes may also trigger the alert, necessitating contextual awareness. Monitoring for unusual patterns in user account activity or implementing companion detections for system configuration changes would enhance coverage.

