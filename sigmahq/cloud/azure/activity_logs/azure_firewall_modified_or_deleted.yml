note: |
  ### Technical Context
  This detection rule monitors activity in Azure environments specifically focusing on the creation, modification, or deletion of Azure Firewalls. Azure Firewalls serve as critical components in network security and managing traffic flows. An attacker may seek to create, modify, or delete these firewalls to manipulate network traffic, bypass security measures, or escalate privileges within a compromised Azure environment. Such actions could indicate preparatory steps for broader attacks, including data exfiltration or lateral movement within the cloud infrastructure.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Impact (TA0040)**: This rule pertains to the potential impact that modifies network defenses.
  - **Defense Evasion (TA0064)**: Modifying a firewall can be an attempt to evade detection and control measures in place.
  - **Cloud Service Dashboard Manipulation (T1562.004)**: This specifically involves the tampering with cloud infrastructure components, which can severely disrupt operations.

  Primary telemetry sources for this detection are **Azure Activity Logs**, which record all operations against Azure resources, including actions taken on Azure Firewalls.

  ### Investigation Steps
  - **Review Activity Logs**: Examine Azure Activity Logs for events related to the operations specified (e.g., WRITE and DELETE on Azure Firewalls) to identify the context of the changes.
  - **Verify User Identity**: Check the identity of the user who initiated the changes against your organization’s IAM policies and determine if they had the necessary permissions.
  - **Analyze User Agent and Hostname**: Investigate the user agent and source IP address to confirm if they align with known administrative activity or if they seem suspicious or out of place.
  - **Assess Recent Activity**: Look for a pattern of changes preceding the alert and determine if they coincide with other suspicious activities, such as unusual networks or service deployments.

  ### Prioritization
  This alert warrants medium severity due to the potential impact on network security and operations. Unauthorized modifications or deletions of firewalls can compromise the entire cloud environment, potentially leading to data breaches or service disruptions.

  ### Blind Spots and Assumptions
  The detection logic may not cover modifications made through automated scripts or services that operate under administrative credentials, which could lead to legitimate changes being ignored. The rule assumes that access controls are appropriately configured to restrict unauthorized changes. The proper logging of Azure Activity Logs is crucial for this alert to function effectively, and any changes to the logging configuration could impact detection efficacy.

