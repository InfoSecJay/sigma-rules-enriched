note: |
  ### Technical Context

  This rule detects modifications or deletions of Azure Firewall resources, specifically actions associated with the `WRITE` and `DELETE` operations of Azure Firewalls. An attacker may exploit misconfigured permissions within Azure to remove or alter firewall rules, potentially allowing unauthorized traffic or service disruptions as part of lateral movement or data exfiltration efforts. This behavior aligns with the MITRE ATT&CK techniques, specifically Defense Evasion (T1562) and Impact (T1686.001).

  The primary telemetry source for this detection comes from Azure Activity Logs, which record changes to Azure resources. If malicious modifications are made, it could lead to compromised network security and expose sensitive information. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger it.

  ### Investigation Steps

  - **Verify user identity and role:** Check the user or service principal involved in the operation against Azure Active Directory logs (Event ID: 4624) to determine if their role permits such changes. Legitimate admins typically have assigned roles like 'Network Contributor' or 'Owner.'

  - **Inspect operation timestamps:** Cross-reference the modification or deletion timestamp with account activity logs for the user. Rapid, unexpected changes within a short timeframe may indicate malicious activity while regular administrative changes are often scheduled.

  - **Review previous configuration states:** Use Azure Resource Manager logs to retrieve previous configurations of the firewall. Look for discrepancies that align with typical behavioral patterns, such as removing outbound rules they seldom modified before.

  - **Identify peculiar user agents:** Check the user agent strings in the operation logs for anomalies. Legitimate administrative changes usually come from recognized IPs and agents, while suspicious agents could indicate unauthorized access.

  - **Analyze affected traffic:** If possible, examine the network traffic logs before and after the change. A sudden spike in traffic to or from unexpected endpoints could signal exploitation following the firewall change.

  ### Prioritization

  This alert is of medium severity, given that Azure Firewalls are critical for network security and function as a barrier against external threats. The likelihood of malicious abuse is moderate, particularly if an attacker has obtained elevated privileges. Additionally, the behavior is weaponized in actual attack scenarios aiming to disable or manipulate defensive measures.

  ### Blind Spots and Assumptions

  This detection may miss modifications made through other Azure management methods not captured in Activity Logs, such as via APIs or command-line interfaces with insufficient logging. Legitimate activities that could trigger the alert include routine administrative changes or updates by service accounts during maintenance. A companion detection, such as monitoring for Azure RBAC permission changes (Event ID: 228), can enhance visibility into potential privilege escalation tactics.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
