note: |
  ### Technical Context
  This detection rule monitors for unauthorized modifications and deletions of RoleBindings and ClusterRoleBindings within Azure Kubernetes Services (AKS). These actions can signify an attempt by an attacker to compromise access controls or escalate privileges within a Kubernetes environment. Attackers might aim to take control over critical resources or execute malicious containers by tampering with RoleBindings, which dictate the proper access roles assigned to users or entities within the Kubernetes cluster.

  The relevant MITRE ATT&CK tactics and techniques applied here include:
  - **T1485**: Data Destruction, which may take place when attackers delete important bindings.
  - **T1496**: Resource Hijacking, where an attacker may modify RoleBindings to gain unauthorized access to privileged resources.
  - **T1489**: Service Stop, potentially leading to service disruption via malicious role adjustments.

  The primary data source for this detection is Azure Activity Logs, which will capture operation names related to creating, updating, or deleting RoleBindings and ClusterRoleBindings.

  ### Investigation Steps
  - **Review Activity Logs**: Examine Azure Activity Logs for entries related to the operation names specified (e.g., WRITE/DELETE operations for RoleBindings and ClusterRoleBindings) to find the exact changes made.
  - **Identify User Context**: Correlate the activity with user identities, IP addresses, and user agents to determine if the actions were executed by legitimate admins or suspicious users.
  - **Analyze Kubernetes RBAC Policies**: Investigate existing RBAC policies prior to the modification to understand whether the changes could grant excessive privileges or access.
  - **Correlate with Application Behavior**: Cross-reference the timing of the RBAC modifications with other anomalies in application performance or unusual activities within the cluster.

  ### Prioritization
  This alert has medium severity due to the potential risk of unauthorized access or control over Kubernetes resources, which can lead to significant impact on application security and availability in an enterprise environment.

  ### Blind Spots and Assumptions
  There are gaps in detection if logging for Azure Activity Logs is not adequately configured or retained. The detection logic assumes that all changes to RoleBindings and ClusterRoleBindings made by legitimate administrators are acceptable; however, any unusual or unexpected modifications by less privileged users should be highly scrutinized. Furthermore, without insights into broader organizational access policies and practices, false positives may proliferate if anomalies are not contextualized within normal operating parameters.

