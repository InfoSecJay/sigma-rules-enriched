level: medium
note: |
  ### Technical Context

  This detection rule identifies changes to Kubernetes RoleBindings and ClusterRoleBindings within an Azure environment, specifically targeting write and delete operations. Such modifications can enable unauthorized users to gain elevated privileges, allowing them potentially malicious access to the cluster. The likely attacker objective is to escalate privileges or establish persistence within the Kubernetes environment.

  This aligns with the MITRE ATT&CK techniques for Privilege Escalation (T1485) and Data Exfiltration (T1496). Primary telemetry sources include Azure Activity Logs detailing RBAC (Role-Based Access Control) operations related to Kubernetes. The security implications of these actions can be severe, leading to compromised cluster integrity and data. This detection does NOT confirm malicious intent on its own; legitimate administrative actions may trigger these alerts.

  ### Investigation Steps

  - **Verify the user identity making changes:** Cross-reference user identities with the Audit logs (Azure Activity Logs). Unauthorized identities or unusual accounts modifying RoleBindings or ClusterRoleBindings should raise red flags.

  - **Check the operation details:** Examine the specific operation name from Azure Activity Logs (Event ID 4003, relevant fields: operationName) to identify if the action was a write or delete on RoleBinding or ClusterRoleBinding. Confirm familiarity with the user and the context of the change.

  - **Identify the context of the operation:** Review the timestamp and the source IP address of the operation (e.g., Activity Logs → caller IP). Mismatched or suspicious IP addresses that do not align with typical user behavior indicate potential malicious activity.

  - **Analyze legitimate configurations:** Understand standard RoleBinding/ClusterRoleBinding configurations typical for your environment. Actions reflecting roles that expand beyond expected access levels or legitimate changes should prompt further investigation.

  - **Look for unusual user agents:** Review the user agent strings in the Activity Logs for the requests related to the RoleBinding changes. Common administrative user agents (kubectl, Azure CLI) should be expected; mismatched or outlier user agents may indicate tooling misuse.

  ### Prioritization

  This alert carries medium severity due to the potential impact on Kubernetes security. Malicious modifications to RoleBindings can lead to privilege escalation, increasing the likelihood of further exploitation. While legitimate administrative tasks can trigger these alerts, understanding the context and the identity behind the actions is essential.

  ### Blind Spots and Assumptions

  One key limitation is the possibility of evasion techniques such as an attacker leveraging legitimate user identities (i.e., credential misuse). Ensuring comprehensive logging from Activity Logs is essential for reliable detection. Routine administrative modifications can also trigger this alert, necessitating a contextual review of user activities. Companion detections focusing on user behavior analytics or unusual access patterns would enhance coverage and reduce false positives.

