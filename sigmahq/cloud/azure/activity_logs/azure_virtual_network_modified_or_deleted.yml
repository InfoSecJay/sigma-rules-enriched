level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Virtual Networks (VNETs) and associated gateways, specifically targeting operation names that start with "MICROSOFT.NETWORK/VIRTUALNETWORKS/" or "MICROSOFT.NETWORK/VIRTUALNETWORKGATEWAYS/" and end with "/WRITE" or "/DELETE". The likely attacker objective is to disrupt network services, exfiltrate data, or gain unauthorized access to resources through network misconfigurations. This behavior aligns with the MITRE ATT&CK technique "Impact" (T1499).

  The primary telemetry source for this detection is Azure Activity Logs, specifically logs that track resource management actions in the Azure portal. The security impact of unauthorized modifications or deletions can include network service disruptions, loss of data integrity, and potential bypassing of security controls. It is important to note that the detection of these activities does not confirm malicious intent by itself; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Review user context**: Check the identity of the user performing the operation using Azure Activity Logs (log type: management). Look for anomalies such as unfamiliar user accounts or accounts with inappropriate permissions.

  - **Analyze operation details**: Examine the specific operation being logged, focusing on `operationName` fields for changes to VNETs or gateways. This includes checking the timestamp against typical administrative hours; look for activity outside of normal working hours as a red flag.

  - **Check for role assignments**: Validate the roles assigned to the user involved in the modification or deletion. Look up Azure Role-Based Access Control (RBAC) entries to confirm if the user should have permissions for such actions.

  - **Cross-reference legitimate changes**: Consult change management logs to identify if the modification or deletion is documented as an approved change. Ensure that the change aligns with organizational policies.

  - **Investigate network dependencies**: Use Azure Resource Graph to identify services or resources that depend on the modified or deleted VNETs. Look for possible disruptions in connectivity that may impact critical applications.

  - **Identify repeated attempts**: Analyze the activity logs for multiple changes by the same user or IP address within a short time frame, indicating a potential automated tool or attack pattern.

  ### Prioritization

  This alert holds medium severity due to the significant impact a modification or deletion can have on network infrastructure and services. The likelihood of malicious abuse is notable, especially in environments where permissions are misconfigured or where insiders may act unexpectedly. Given that network changes are often weaponized to create backdoors or disrupt services, timely investigation is crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative actions that could produce false positives, particularly from authorized personnel. Required log sources include comprehensive Azure Activity Logs configuration to ensure all management activities are captured effectively. Legitimate network adjustments, such as scheduled maintenance or security updates, could trigger this alert. A related detection to strengthen coverage would involve monitoring unusual administrative activity patterns, such as the creation or deletion of users with elevated privileges in Azure.

