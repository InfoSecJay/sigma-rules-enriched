title: Azure Virtual Network Modified or Deleted
id: bcfcc962-0e4a-4fd9-84bb-a833e672df3f
status: test
description: Identifies when a Virtual Network is modified or deleted in Azure.
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations
author: Austin Songer @austinsonger
date: 2021-08-08
modified: 2022-08-23
tags:
- attack.impact
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith:
    - MICROSOFT.NETWORK/VIRTUALNETWORKGATEWAYS/
    - MICROSOFT.NETWORK/VIRTUALNETWORKS/
    operationName|endswith:
    - /WRITE
    - /DELETE
  condition: selection
falsepositives:
- Virtual Network being modified or deleted may be performed by a system administrator.
  Verify whether the user identity, user agent, and/or hostname should be making changes
  in your environment.
- Virtual Network modified or deleted from unfamiliar users should be investigated.
  If known behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This rule detects modifications or deletions of Virtual Networks within Microsoft Azure. This activity could indicate a potential malicious insider threat or external actor attempting to compromise network segmentation, which is essential for maintaining proper security boundaries within cloud environments. Identifying unauthorized changes to Virtual Networks is critical as these alterations can lead to data exposure or lateral movement across the network.

  The threat scenario may involve attackers seeking to disrupt services, exfiltrate data, or create a more favorable environment for subsequent attacks. Critical MITRE ATT&CK tactics relevant to this detection include “Impact” (TA0040), especially focusing on techniques such as “Data Destruction” (T1485) or “Network Denial of Service” (T1498). The primary telemetry for this detection comes from Azure Activity Logs, which capture operation details surrounding resource management operations.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Investigate the Azure Activity Logs for any recent operations related to Virtual Network modifications or deletions. Focus on the `operationName` for signs of unauthorized activity.
  - **Check User Identity and Roles:** Validate the identities of users initiating these changes. Confirm that they have appropriate permissions and roles assigned that justify such modifications. Look for anomalies in usual behavior patterns.
  - **Analyze Change Patterns:** Examine the frequency and nature of the changes to determine if they align with typical administrative tasks. Look for unusual timing, such as after hours, or access from atypical network locations.
  - **Audit for Related Changes:** Look for other changes in close temporal proximity to the detected Virtual Network activity, such as alterations to Network Security Groups or Subnets, which could indicate coordinated malicious activity.

  ### Prioritization
  The alert is categorized as medium severity due to the potential impact of unauthorized changes to network infrastructure. If exploited, such activities could lead to critical vulnerabilities and service disruptions necessitating immediate investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage relating to legitimate administrative actions by authorized personnel, which may lead to false positives. The detection assumes that all modifications to Virtual Networks should be closely monitored; however, regular administrative tasks often involve changes that are necessary for operations. Required logs include Azure Activity Logs, and accurate configurations are essential to ensure comprehensive coverage of all relevant changes within the Azure environment.

