note: |
  ### Technical Context

  This rule detects modifications or deletions of Azure Application Security Groups (ASGs), which could indicate unauthorized changes to network security configurations within an Azure environment. The likely attacker objective is to manipulate network policies to allow or restrict access to resources, potentially facilitating lateral movement or exfiltration. The relevant MITRE ATT&CK tactic is "Impact" (TA0040), and the technique is "Application Layer Protocol" (T1071).

  Primary telemetry sources are Azure Activity Logs, specifically monitoring for `operationName` related to `MICROSOFT.NETWORK/APPLICATIONSECURITYGROUPS/WRITE` and `MICROSOFT.NETWORK/APPLICATIONSECURITYGROUPS/DELETE`. If malicious, this behavior can severely impact security posture by inadvertently opening access points or severing critical security channels. However, this detection alone does not confirm malicious intent; it could also be triggered by legitimate administrative activities.

  ---

  ### Investigation Steps

  - **Check activity details:** Review Azure Activity Logs under 'Microsoft.Network/applicationSecurityGroups' to identify the `userIdentity` and `timestamp` associated with changes. Look for unexpected or unfamiliar user accounts making these changes.

  - **Validate user legitimacy:** Investigate if the user account making the changes has the appropriate administrative privileges and whether the changes align with normal business practices. Admins should typically have access, while changes from non-admins may be suspicious.

  - **Examine change context:** Assess the rationale for modifications by cross-referencing tickets or change management logs. Record legitimate activities that coincide with the changes, confirming that they adhere to established operational protocols.

  - **Identify malicious indicators:** Look for alarmingly frequent modifications or deletions within a short timeframe—more than 3 times in an hour may indicate potential malicious activity or misconfiguration.

  - **Correlate with related activity:** If changes are detected, review for other potentially associated Azure activities (such as VM changes or role assignments) in the same time window to identify if this is part of a broader attack strategy against the network.

  - **Assess asset criticality:** Determine the criticality of the affected ASGs and related assets. Compromised ASGs associated with sensitive or high-value assets should trigger immediate escalation protocols.

  ---

  ### Prioritization

  This alert has medium severity due to the potential security impact of altering or deleting application security groups in Azure. The likelihood of malicious activity is moderate, as misconfigurations and unauthorized access are commonly exploited by attackers. Changes to ASGs are often weaponized in cloud environments to facilitate further exploitative actions.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include privileged user accounts disguising malicious actions as routine administration. Reliable detection requires consistent logging and monitoring of Azure Activity Logs; configurations must be verified to report all relevant events. Legitimate administrative activity may create false positives, particularly during routine maintenance or scheduled security updates. A related detection could involve monitoring changes to IAM policies or role assignments, providing improved coverage against privilege escalation or unauthorized changes to security structures.

