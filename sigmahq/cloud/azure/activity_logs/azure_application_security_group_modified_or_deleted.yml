note: |
  ### Technical Context
  This rule detects modifications or deletions of Azure Application Security Groups (ASGs). ASGs play a crucial role in controlling network traffic within Azure environments, allowing for the segmentation of resources based on application requirements. When an ASG is modified or deleted, it may indicate potential unauthorized changes aimed at compromising network security, escalating privileges, or facilitating lateral movement within the cloud infrastructure.

  The threat scenario is typically associated with insider threats, misconfigurations, or external attackers who gain access to administrative credentials. Attackers could leverage compromised accounts to manipulate network traffic settings, potentially creating avenues for exfiltrating data or launching further attacks. Key MITRE ATT&CK tactics relevant to this rule include **Impact** (TA0040) and techniques such as **Data Manipulation** (T1203), which could be indicative of malicious activities affecting the integrity of the network configurations.

  Primary data sources that will provide evidence for this detection are Azure Activity Logs, which capture activities related to resource management and configurations in the Azure environment.

  ### Investigation Steps
  - **Review Activity Logs**: Examine Azure Activity Logs for the specific user identity and timestamp related to the modification or deletion of the ASG to identify patterns of potentially unauthorized access.
  - **Verify User Permissions**: Assess the role and permissions of the user making the change to ensure they were authorized to modify or delete ASGs within the environment.
  - **Correlate with Identity Logs**: Investigate any related identity logs, such as Azure AD sign-in logs, to determine if the user account was compromised or if there were multiple sign-ins from suspicious locations around the time of the modification.
  - **Look for Anomalous Behavior**: Identify if the changes to ASGs correspond with other unusual activities in the environment, such as sudden spikes in network anomalies or access attempts from unfamiliar IP addresses.

  ### Prioritization
  This alert is marked as medium severity due to the significant potential impact on network security that unauthorized modifications or deletions of ASGs can have, particularly in production environments. While legitimate administrative changes do occur, the likelihood of an attacker's use of compromised credentials to execute these actions necessitates prompt investigation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if logs are not configured to capture all relevant modifications or deletions comprehensively. Additionally, the detection logic assumes that changes to ASGs are always indicative of malicious intent, disregarding legitimate administrative actions. Accurate logs from Azure Activity Logs need to be enabled and appropriately retained to ensure the effective functioning of this alert, as any misconfiguration in logging settings could lead to undetected malicious activities.

