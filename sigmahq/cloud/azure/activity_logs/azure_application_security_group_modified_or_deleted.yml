  ---

  ### Technical Context

  This rule detects modifications or deletions of Azure Application Security Groups (ASGs), which are key components in managing network security within Azure environments. An attacker may attempt to modify or delete ASGs to disrupt network controls or facilitate lateral movement within an environment. This activity aligns with the MITRE ATT&CK tactic of **Impact (TA0040)** and technique **Service Stop (T1489)**, as it can affect the availability and security posture of workloads.

  The primary telemetry source for this detection is Azure Activity Logs, specifically tracking the operations: `Microsoft.Network/ApplicationSecurityGroups/Write` for modifications and `Microsoft.Network/ApplicationSecurityGroups/Delete` for deletions. If malicious, this behavior could lead to unauthorized network access or the exposure of critical assets. Importantly, this detection does NOT confirm that the changes were malicious on their own; legitimate administrative actions may also generate similar alerts.

  ---

  ### Investigation Steps

  - **Check the user identity responsible for the change:** Review Azure Activity Logs (`OperationName`, `Caller`, and `Time`) to identify who initiated the modification or deletion. Validate whether this user has appropriate permissions and is an expected admin user.

  - **Examine the context of the change:** Look for patterns in the `UserAgent` and `SourceIP` fields to determine whether the request originated from a known, trusted location or if it appears suspicious. Legitimate changes typically come from internal networks rather than unfamiliar IPs.

  - **Assess the impact of the changes:** Identify the specific ASG that was modified or deleted by checking the `ResourceId` in Azure Activity Logs to understand what resources it protected. Evaluate whether sensitive workloads are affected and if a rollback or restoration is necessary.

  - **Identify legitimate change requests:** Cross-reference the change with any approved maintenance windows or service requests. Legitimate activities are often logged in service management tools alongside the activity logs.

  - **Look for additional suspicious activity:** Search for related logs around the time of the modification or deletion (such as `Activity Logs` for resource creation or `Network Security Group` changes) that might indicate a broader malicious campaign.

  - **Review for potential exfiltration or unapproved actions:** Investigate subsequent logs that show attempts to access resources connected to the modified ASGs. Keep an eye on Azure Sentinel alerts or other monitoring tools that may indicate unusual traffic patterns or data exfiltration attempts tied to the ASG changes.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for significant impacts on network security and accessibility of critical resources. The likelihood of malicious activity is elevated if the changes are made by unfamiliar or unauthorized accounts, especially if they correspond with other signs of compromise.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the reliance on Azure Activity Log settings; if the logs are not configured to retain sufficient history, recent deletions may be missing. Legitimate changes conducted by system administrators, particularly in a large organization, can trigger false positives. A related detection to consider is unauthorized access attempts recorded in Azure AD sign-in logs which can strengthen overall coverage of any potential compromise events.

