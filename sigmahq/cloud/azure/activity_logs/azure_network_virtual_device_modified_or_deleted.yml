note: |
  ### Technical Context

  This rule detects modifications or deletions of Azure Virtual Network devices, including network interfaces, virtual appliances, virtual hubs, and virtual routers. The likely attacker objective is to disrupt services, exfiltrate data, or introduce unauthorized access paths within the network infrastructure. This behavior aligns with the MITRE ATT&CK tactic of Impact (TA0040) and technique of Resource Hijacking (T1496).

  The primary telemetry source is Azure Activity Logs, which record events related to Azure resource management and activity. If malicious, the impact can be significant, leading to service outages or unauthorized access to sensitive resources. It is critical to note that this detection does NOT confirm malicious activity on its own; legitimate modifications by authorized users may also trigger the alert.

  ### Investigation Steps

  - **Verify user identity and permissions:** Check Azure Activity Logs for the `Caller` field in the operations associated with the alert. Ensure that the user executing the modification or deletion has the appropriate administrative privileges and is within the known list of authorized users for those operations.

  - **Assess the context of the operation:** Review the `EventTimestamp`, `OperationName`, and `ResourceId` fields in the related Azure Activity Log entries to determine if the event occurred during a maintenance window or scheduled update, which may indicate legitimate activity rather than a malicious action.

  - **Identify high-confidence malicious indicators:** Look for sudden changes in critical network devices, especially if the `Caller` is unfamiliar or has an unusual role, and check for the presence of multiple unauthorized operations in a short timeframe, potentially indicating lateral movement or privilege escalation.

  - **Review network device configuration history:** Use the Azure Resource Explorer to check the configuration change history for the affected network devices. Look for any recent updates or deletions of configurations that are inconsistent with normal operational practices.

  - **Correlate with potential service impacts:** Cross-reference the alert with Azure Service Health notifications to identify any potential service interruptions linked to the device changes. Recognize that legitimate service modifications may correlate with routine updates.

  - **Document and escalate unusual user behavior:** If the alert appears to stem from an unfamiliar user, document their previous activities and escalate for further investigation. High-frequency operations or changes across multiple devices should raise additional scrutiny.

  ### Prioritization

  The alert has medium severity due to the potential impact on core network services if modified or deleted improperly. The likelihood of malicious abuse exists, especially during periods of increased cyber threats targeting cloud resources. While such modifications can be benign, they are often weaponized by adversaries as part of their operational tactics.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false positives from legitimate administrative actions, especially during scheduled maintenance. Reliable detection requires comprehensive Azure Activity Logging to ensure all changes are captured. Legitimate activity, such as routine updates by cloud administrators, may trigger the alert. A companion detection related to unauthorized Azure resource creation or modifications (e.g., unusual patterns in `MICROSOFT.NETWORK/RESOURCECREATION`) may provide additional context and strengthen incident response efforts.

