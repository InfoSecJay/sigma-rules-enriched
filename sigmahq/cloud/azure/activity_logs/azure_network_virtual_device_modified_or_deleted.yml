note: |
  ### Technical Context
  This detection rule identifies when a virtual network device within Azure, such as a network interface, virtual hub, or virtual router, is modified or deleted. Such activities can be indicative of unauthorized changes to network configurations, potentially allowing an attacker to disrupt services, exfiltrate data, or exude control over network traffic. Attackers aiming to disrupt corporate infrastructure or re-route traffic could exploit this by targeting network devices.

  The relevant MITRE ATT&CK tactics associated with this detection are **Impact (TA0040)**, particularly techniques like **Data Manipulation (T1460)** and **Service Stop (T1489)**. These tactics and techniques highlight the potential for both data breaches and denials of service stemming from malicious modifications to essential network structures.

  Primary data sources for this detection include Azure activity logs that capture administrative operations on network devices. These logs contain critical information about who made changes, what kind of changes were made, and when they occurred, offering essential context for incident response.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Analyze the Azure activity logs for operations related to network interfaces, virtual hubs, and virtual routers, focusing on any WRITE or DELETE actions that are not part of normal operations.

  - **Correlate User Identity Information**: Cross-reference the user identities making the changes with internal personnel records to determine if the actions are being performed by authorized users or if they deviate from established admin behaviors.

  - **Investigate Owner Changes**: Look for modifications related to the ownership or management of virtual network devices that may indicate privilege escalation or unauthorized account compromise.

  - **Check for Related Alerts**: Examine if there are any preceding alerts or unusual activities, such as failed login attempts or unusual login locations, that may correlate with the timing of the network device changes to identify potential threats.

  ### Prioritization
  This alert is considered medium severity due to the potential impact unauthorized modifications can have on network integrity and availability. Such changes may lead to service disruptions, unauthorized access, or data breaches, making it critical to investigate swiftly.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage, particularly if logging is not enabled for specific Azure resource modifications outside of the network device category, leading to incomplete visibility. This detection logic assumes that any modification or deletion of network devices not sanctioned by usual IT processes could indicate malicious actions. For this rule to function correctly, Azure activity logs must be enabled and configured to record all relevant changes to the network devices involved.

