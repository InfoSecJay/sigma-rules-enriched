note: |
  ### Technical Context
  This rule detects operations involving the modification or deletion of keys in Azure Key Vaults, specifically looking for actions such as creating, updating, deleting, or purging keys. The primary objective behind these operations could range from routine maintenance by administrators to potential malicious activities by attackers aiming to manipulate cryptographic keys used for protecting sensitive information. Unauthorized access or modification of keys could jeopardize the confidentiality and integrity of data stored in Azure, making this a significant security concern.

  In an enterprise context, threat actors may aim to delete or modify keys to disrupt services or to gain unauthorized access to sensitive data, consistent with the behaviors associated with the MITRE ATT&CK framework. Notably, the relevant tactics are **Impact (TA0040)** and **Credential Access (TA0011)**. Techniques include **"Modify Authentication Process" (T1552)** and **"Application Layer Protocol" (T1552.001)**, where manipulating keys could facilitate broader access or compromise security mechanisms.

  The primary data source for effective detection in this case is Azure Activity Logs, which capture the operations performed on Key Vault resources, including details on what actions were taken and by whom.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Examine the logs for operations corresponding to key creation, modification, or deletion, noting the user identities and timestamps involved. Look for any anomalies, such as unusual acting accounts or unexpected times of access.

  - **Assess Permissions and Roles:** Check the roles and permissions assigned to the accounts involved in the key modifications or deletions to ensure that they are consistent with expected behaviors. Administrators should have necessary permissions, while unfamiliar account access warrants further scrutiny.

  - **Investigate User Behavior:** Evaluate the context of the user activity leading up to the key events. Analyze user agent strings and hostnames to determine if the requests originated from appropriate internal resources or external/untrusted systems.

  - **Cross-Reference with Other Logs:** Correlate findings with other telemetry data, such as network logs or endpoint protection alerts, to identify any unauthorized access attempts or associated malicious activities that may point to broader attack patterns.

  ### Prioritization
  The alert is deemed of medium severity due to the potential impact of unauthorized key modifications or deletions, which can lead to significant operational disruptions and data breaches. The likelihood of encountering such issues in an enterprise environment underscores the need for timely investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for actions performed via scripts or automated systems, which might not generate typical logs. The detection logic assumes that users should not modify keys outside of established operational protocols. Additionally, all relevant Azure Activity Logs must be properly configured and retained to ensure comprehensive monitoring capabilities for this alert to be effective.

