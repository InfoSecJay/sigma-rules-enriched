note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of keys within Azure Key Vault, which can indicate potential malicious activity. The primary objective of an attacker in this scenario would be to compromise sensitive data access by altering or removing critical encryption keys. This behavior maps to the MITRE ATT&CK technique for credential access, specifically T1552 (Unauthorized Access to Credentials). The primary telemetry source includes Azure activity logs, specifically focusing on operations related to key management such as updates, deletions, or imports. If malicious, these actions could lead to significant data compromise or service disruption. This detection does NOT confirm malicious intent without further context; legitimate administrative work may trigger similar alerts.

  ### Investigation Steps

  - **Check the user identity initiating the action**: Review Azure Activity Logs (Event Type: "Microsoft.KeyVault") for the `caller` field. Suspicious activities from unfamiliar users or service principals should be flagged for further investigation.

  - **Identify the time frame of the activity**: Cross-reference the event timestamps with normal user activity patterns to determine if the actions were performed during expected business hours or maintenance windows.

  - **Review account permissions**: Investigate the `properties` field in the activity logs to evaluate whether the user had the appropriate role permissions for modifying or deleting keys. Unauthorized changes should trigger an alert.

  - **Examine related activity logs**: Look at past Key Vault operations in the Azure Activity Logs to identify any patterns of suspicious actions, especially if multiple key modifications or deletions occur in a short time frame.

  - **Check for legitimate activities**: Validate if the key modifications align with planned maintenance actions or automated processes documented within your organization. Ensure that these are conducted by trusted administrators.

  - **Identify high-confidence malicious indicators**: Look for keys being deleted or purged (`operationName` includes "DELETE" or "PURGE") from accounts not commonly associated with key management. This should be systematically investigated as a potential security incident.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on data security if critical keys are altered or deleted, coupled with a relatively high likelihood of malicious intent given the sensitive nature of key management operations. This specific behavior is often exploited by threat actors aiming to compromise a system's integrity or confidentiality.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations or relevant roles lacking adequate oversight, allowing malicious actions to go unnoticed. Common benign activities, such as routine maintenance by privileged users, may trigger this alert. Related detections, such as monitoring unauthorized access attempts to Key Vault (T1552), should be integrated to enhance oversight and coverage around key management operations.

