note: |
  ### Technical Context
  This detection rule identifies the creation or deletion of Azure Container Registries (ACRs). These registries are crucial for storing and managing container images, and unauthorized modifications could indicate malicious activity, such as an insider threat or external attacker attempting to disrupt services. By monitoring the lifecycle of container registries, organizations can better secure their cloud-native applications and detect potential misconfigurations or security violations.

  The likely threat scenario involves attackers gaining access to Azure resources, perhaps via compromised credentials or misconfigurations, with the objective to sabotage applications by removing essential container registries or creating unauthorized ones to inject malicious images. This aligns with the MITRE ATT&CK techniques T1485 (Data Destruction), T1496 (Application Layer Protocol), and T1489 (Service Stop), which detail how adversaries can disrupt services or manipulate application configurations.

  The primary data sources for this detection are Azure Activity Logs, which provide insight into the operations performed within the Azure environment, specifically relating to container registries.

  ### Investigation Steps
  - **Review Activity Logs**: Examine Azure Activity Logs for the timestamps associated with the creation or deletion of container registries. Look for unusual patterns or operations conducted by unidentified or suspicious user accounts.
  - **Check User Context**: Investigate the context of the user initiating the changes, including their role, user agent, and the environment from where the commands were executed. Pay particular attention to any administrative activities performed by non-administrators.
  - **Assess Network Traffic**: Analyze network traffic to and from the Azure service involved in the registry activities. Pay attention to unusual spikes or unauthorized access attempts that may correlate with the registry changes.
  - **Evaluate Configuration Changes**: Cross-reference the detected changes with the organization's change management process to identify any compliance issues or unauthorized deployments that could signify malicious actions.

  ### Prioritization
  Although categorized with a low severity level, alerts for the creation or deletion of Azure Container Registries should not be overlooked. Any unauthorized modifications can have significant downstream impacts on application availability and security, warranting timely investigation based on the potential for data loss or service disruption.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage involves the inability to capture activities not logged in Azure Activity Logs due to misconfigurations or limited logging retention settings. The detection logic assumes that all changes to container registries will be captured within log entries, which might not account for manipulation through other Azure services or APIs. Ensuring comprehensive logging is enabled for user activities and system operations is essential for the effectiveness of this alert.

