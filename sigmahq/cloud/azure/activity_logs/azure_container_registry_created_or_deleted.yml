note: |
  ---

  ### Technical Context

  This rule detects the creation or deletion of Azure Container Registries, which represent significant actions in managing containerized applications. An attacker may aim to create a registry for storing malicious container images or delete an existing registry to conceal an attack. This activity relates to the MITRE ATT&CK technique T1485 (Data Destruction) and T1496 (Resource Hijacking). The primary telemetry source is Azure Activity Logs, specifically looking for the operations `MICROSOFT.CONTAINERREGISTRY/REGISTRIES/WRITE` and `MICROSOFT.CONTAINERREGISTRY/REGISTRIES/DELETE`. If performed maliciously, this could lead to unauthorized access to containerized services or the destruction of critical container resources. However, this detection does not confirm intent; it simply highlights the occurrence of an administrative or user-initiated action.

  ---

  ### Investigation Steps

  - **Verify user identity and context**: Check the initiating user's identity for the registry operation in Azure Activity Logs (Fields: `userPrincipalName`, `caller`), looking for known administrators involved in legitimate operations. If the user is unfamiliar or unauthorized, further investigation is warranted.

  - **Assess user agent and hostname**: Review the associated user agent string and hostname for the operation. Look for anomalies or known malicious indicators. Legitimate actions often come from trusted devices or service accounts.

  - **Cross-reference timestamps**: Confirm the timing of the registry creation/deletion with known operational schedules or maintenance windows. Unscheduled changes outside of normal behavior should be scrutinized further.

  - **Analyze related container activity**: Investigate if any container images were pushed or pulled around the time of the registry change (Event IDs `Microsoft.ContainerRegistry/Repositories/Pull` or `Push`). Malicious activity may correlate with unauthorized image management.

  - **Review access logs for privilege escalations**: Examine access logs (Audit logs in Azure) to detect any granted or escalated permissions around the same timeframe. An unusual privilege change may indicate preparation for malicious actions.

  - **Identify recovery mechanisms**: Assess if deletion operations were followed by recovery or replication actions of container resources. Insights into immediate restoration may indicate a defensive posture against malicious intent.

  ---

  ### Prioritization

  The severity of this alert is low for a mature enterprise, but it requires investigation due to the potential impact of unauthorized access to containerized environments. The likelihood of malicious abuse exists, particularly in target-rich infrastructures. However, the behavior is not commonly weaponized without additional context.

  ---

  ### Blind Spots and Assumptions

  This detection may miss actions performed using elevated administrative privileges that bypass standard auditing. Dependency on robust Azure Activity Logs is critical; ensure they are retained and configured correctly. Legitimate operations such as system updates or migrations may trigger the alert. Companion detections for registry interactions (e.g., container image changes) can enhance overall security posture.

