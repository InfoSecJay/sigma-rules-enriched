note: |
  ### Technical Context

  This Sigma rule detects the creation or deletion of Azure Container Registries, activities that can indicate unauthorized modifications to a cloud environment. An attacker may aim to establish, modify, or remove a registry to control access to container images, deploy malicious images, or disrupt operations. This behavior aligns with the MITRE ATT&CK tactics of Impact (TA0040) and Data Manipulation (T1485).

  Primary telemetry sources include Azure Activity Logs, specifically looking for operations conducted via the Microsoft.ContainerRegistry resource provider. Malicious actions here could significantly impact the integrity and availability of deployed applications. It's important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Correlate user identity and actions:** Inspect Azure Activity Logs for Event IDs related to `MICROSOFT.CONTAINERREGISTRY/REGISTRIES/WRITE` and `MICROSOFT.CONTAINERREGISTRY/REGISTRIES/DELETE`. Analyze user identity and user agent; compare against expected administrator accounts to identify anomalies.

  - **Review recent changes for unauthorized modifications:** Look into the timing and context of registry creation/deletion. Query the Change History in Azure Resource Manager to identify related activity. Legitimate modifications are typically conducted during designated maintenance periods or scheduled tasks.

  - **Examine affected resources:** Identify the impacted registries by checking for names, previous configurations, and the associated permissions set. Analyze container images associated with newly created registries for signs of malicious content, such as unexpected tags or non-standard images.

  - **Investigate the source of the action:** Analyze the network logs for the originating IP address and check whether it matches known or expected administration sources. Suspicious IPs should be further investigated for potential malicious activity.

  - **Evaluate surrounding activity for patterns:** Review other Azure Activity Logs around the same time to identify patterns that suggest automated or malicious actions, such as mass changes to multiple registries or sudden bursts of activity.

  ### Prioritization

  The alert is considered low to moderate severity due to the potential impact of unauthorized container registry modifications on application integrity and deployment processes. While the likelihood of malicious abuse exists, especially in environments with misconfigured access controls, this behavior is not frequently weaponized without additional context.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations; ensure Azure Activity Logs are continuously retained and accessible. Evasion techniques may include legitimate administrative access being misused or vulnerability in access controls allowing unauthorized users to make changes. Additionally, legitimate maintenance activities or automated deployments by CI/CD pipelines can generate false positives. Monitoring for related detections such as Azure Role Assignment changes (T1496) can augment visibility and help confirm malicious activity.

