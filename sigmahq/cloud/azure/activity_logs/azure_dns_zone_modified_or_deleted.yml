title: Azure DNS Zone Modified or Deleted
id: af6925b0-8826-47f1-9324-337507a0babd
status: test
description: Identifies when DNS zone is modified or deleted.
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
author: Austin Songer @austinsonger
date: 2021-08-08
modified: 2022-08-23
tags:
- attack.impact
- attack.t1565.001
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith: 'MICROSOFT.NETWORK/DNSZONES'
    operationName|endswith:
    - '/WRITE'
    - '/DELETE'
  condition: selection
falsepositives:
- DNS zone modified and deleted may be performed by a system administrator. 
  Verify whether the user identity, user agent, and/or hostname should be making
  changes in your environment.
- DNS zone modification from unfamiliar users should be investigated. If known 
  behavior is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context

  This detection rule identifies modifications or deletions of Azure DNS zones through activity logs, specifically monitoring operations that start with 'MICROSOFT.NETWORK/DNSZONES' and end with '/WRITE' or '/DELETE'. The likely objective of an attacker could be to disrupt DNS services, which can lead to denial-of-service attacks or unauthorized access to sensitive resources by redirecting traffic. This behavior aligns with the MITRE ATT&CK tactic "Impact" (T1565) and technique "Data Manipulation" (T1565.001).

  The primary telemetry source is Azure Activity Logs, which capture the relevant operations performed on DNS zones. A successful modification or deletion of DNS records can severely impact an organization's ability to manage its web services securely. This detection does NOT confirm malicious activity on its own; legitimate administrative actions can trigger this rule as well.

  ### Investigation Steps

  - **Verify user identity and intent:** Cross-reference the user ID associated with the detected operation against the organization's authorized personnel for DNS changes. Check Azure AD sign-ins (Event ID 4624) to identify if the user is recognized and had recent activity logged.

  - **Review changes in DNS records:** Examine the Azure Activity Logs for changes made during the timeframe of the alert, focusing on the `operationName`, `status`, `caller`, and `resourceId` fields to clarify the nature of the modification or deletion.

  - **Check for unusual user agents or IPs:** Scrutinize the `userAgent` field and IP address of the calling entity against known good configurations. Identify any anomalies or from unfamiliar locations that should not be modifying DNS zones.

  - **Identify recent DNS-related incidents:** Investigate recent alerts in Azure Security Center or other threat intelligence platforms that may indicate current or past incidents involving DNS manipulations, providing context for this behavior.

  - **Confirm legitimate changes:** Communicate with the IT team to verify if any planned changes were made by system administrators at the time of the alert. Obtain confirmation that expected changes align with logged actions.

  - **Flag suspicious patterns:** If multiple activities from the same user or service account are detected during a short time span, flag this behavior as potentially malicious. Look for patterns in modification events that involve critical DNS zones unexpectedly.

  ### Prioritization

  The alert is of medium severity due to the potential impact of DNS service disruptions on critical applications and services. The likelihood of malicious activity is moderate, especially if the changes originate from unauthorized sources. Given that attacks targeting DNS infrastructure are some of the more common tactics, these alerts should be prioritized for timely investigation.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative actions by system administrators who are authorized to make DNS changes, potentially leading to false positives. It requires proper configuration and retention of Azure Activity Logs to ensure all relevant data is captured. Furthermore, unusual activities such as changes from automated scripts or third-party integrations could trigger this alert. Related detections, such as monitoring for unusual creation of service principals or service accounts with elevated privileges, would strengthen overall security monitoring efforts.

