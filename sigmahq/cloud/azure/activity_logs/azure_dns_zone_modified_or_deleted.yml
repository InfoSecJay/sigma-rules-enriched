title: Azure DNS Zone Modified or Deleted
id: af6925b0-8826-47f1-9324-337507a0babd
status: test
description: Identifies when DNS zone is modified or deleted.
references:
- https://learn.microsoft.com/en-us/azure/role-based-access-control/resource-provider-operations#microsoftkubernetes
author: Austin Songer @austinsonger
date: 2021-08-08
modified: 2022-08-23
tags:
- attack.impact
- attack.t1565.001
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    operationName|startswith: 'MICROSOFT.NETWORK/DNSZONES'
    operationName|endswith:
    - '/WRITE'
    - '/DELETE'
  condition: selection
falsepositives:
- DNS zone modified and deleted may be performed by a system administrator. Verify
  whether the user identity, user agent, and/or hostname should be making changes
  in your environment.
- DNS zone modification from unfamiliar users should be investigated. If known behavior
  is causing false positives, it can be exempted from the rule.
level: medium
note: |
  ### Technical Context
  This detection rule identifies actions related to the modification or deletion of DNS zones within Azure, signaling potential unauthorized changes to vital DNS entries. Such actions could indicate an attacker attempting to disrupt services, redirect traffic for phishing or lateral movement, or perform reconnaissance by altering necessary DNS configurations. The likely objectives of an attacker include escalating privileges, exfiltrating data, or causing service disruptions through DNS tampering.

  This alert aligns with the MITRE ATT&CK techniques, specifically **T1565.001** - "Data Manipulation: DNS Spoofing." The associated tactic is **Impact**, as unauthorized changes to DNS records can compromise the integrity and availability of resources. Critical telemetry to monitor for this activity includes Azure Activity Logs that provide detailed insights into operations performed on DNS zones, helping to identify unusual modifications or deletions.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Examine the Azure Activity Logs for entries that indicate a modification or deletion of DNS zones. Pay attention to the timestamps and the user accounts associated with these actions.

  - **Verify User Identity**: Confirm the legitimacy of the user initiating the DNS changes. Investigate whether the user account has the necessary permissions and if the action aligns with their usual activity patterns.

  - **Inspect Related Resources**: Check for any related Azure resources that may be affected by the DNS changes. This includes verifying dependencies on services that rely on DNS, such as applications, VMs, or other cloud services.

  - **Correlation with Other Events**: Look for correlations with other suspicious events within your environment, such as unusual login behavior or failed access attempts that may precede or follow the DNS modifications.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized DNS modifications on the integrity and availability of services. The likelihood of high-risk activities occurring through such changes justifies immediate investigation.

  ### Blind Spots and Assumptions
  Gaps in coverage may include the detection of legitimate administrative activities that are common in environments with active DNS management, potentially leading to false positives. The detection logic assumes that any modification or deletion not aligned with standard user behavior warrants investigation. Required logs include comprehensive Azure Activity Logs that capture all operations performed on DNS resources to ensure this rule functions effectively.

