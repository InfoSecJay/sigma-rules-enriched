note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of network security configurations in Azure, specifically targeting operations on Network Security Groups (NSGs) and their associated security rules. Attackers may seek to modify or delete these configurations to manipulate firewall settings, thereby gaining unauthorized access or creating vulnerabilities within the network. The relevant MITRE ATT&CK tactic is **Impact** (TA0040) with techniques such as **T1553 - Subvert Trust Controls** and **T1484 - Domain Policy Modification** to facilitate lateral movement or denial of service.

  The primary telemetry sources for this detection include Azure Activity Logs, specifically focusing on logs containing the operation names for writing or deleting NSG configurations. If the changes are malicious, they could lead to significant security risks including unauthorized access to sensitive data or resources. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative actions can also trigger the alert.

  ### Investigation Steps

  - **Verify user identity and activity context:** Check the **user identity** associated with the operation in the Azure Activity Logs (Event Type: `Microsoft.Network/networkSecurityGroups/write` or `delete`). Look for unusual or unauthorized user accounts making changes to NSGs.

  - **Review operation source:** Assess the **user agent** and **hostname** from which the operation was performed. Validate if the source aligns with known admin user behavior and authorized devices.

  - **Identify recent changes:** Query the Azure Activity Logs for **Event IDs** related to `NetworkSecurityGroups` within the last 24-48 hours, noting any modifications or deletions that lack appropriate administrative justification.

  - **Collect baseline configuration:** Document expected configurations for critical NSGs. Legitimate operations typically involve expected internal user accounts and predefined change windows. Deviations from this baseline may indicate risk.

  - **Examine associated audit trails:** Look for additional logs related to NSG changes in Azure Resource Logs or management audit logs. Identify patterns of repeated modifications or altered access controls that suggest a malicious user.

  ### Prioritization

  This alert should be treated with medium severity, particularly if it involves critical systems or which are high in value to the organization. The likelihood of malicious abuse is notable, as attackers commonly target network security configurations to facilitate unauthorized access. This behavior has been weaponized in past threats, making it crucial to investigate promptly.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of misconfigurations being mistaken for malicious actions, particularly by trusted administrators. Effective detection requires that Azure Activity Logs are properly configured and monitored for specific operations. Legitimate administrative changes can also trigger this alert, such as routine security policy updates. A companion detection to consider could be modifications to Azure Role-Based Access Control (RBAC) settings, which often correlate with NSG changes and strengthen coverage against privilege escalation threats.

