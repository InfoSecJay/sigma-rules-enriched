note: |
  ### Technical Context
  This detection rule monitors changes made to Azure Network Security Groups (NSGs), particularly alterations or deletions of network security configurations. These configurations are crucial in defining what inbound and outbound traffic is allowed for the resources in a virtual network. Malicious actors may target these configurations with the intent to disrupt traffic flow, enable unauthorized access, or evade existing security controls. The ability to modify security rules can significantly impact an organization's cloud security posture.

  The rule is associated with the MITRE ATT&CK framework, particularly under the tactics of **Impact** (TA0040) and techniques like **Data Manipulation** (T1552) where attackers may adjust network configurations to facilitate their objectives. Effective monitoring of these actions allows security teams to detect unauthorized changes that could lead to data exfiltration or service disruptions.

  The primary data sources for this detection come from Azure Activity Logs, which provide detailed records of the operations performed on Azure resources, including the specific operations analyzed in this rule such as creating, modifying, or deleting NSGs and their rules.

  ### Investigation Steps
  - **Verify User Identity:** Check the identity of the user or service principal that made the change. Confirm whether this individual has the appropriate permissions and consistency with typical behavior for your environment.

  - **Examine Activity Logs:** Review Azure Activity Logs around the time of the modification or deletion. Look for patterns or anomalies in the context of other activities occurring at the same time, which might indicate automated processes or external access.

  - **Correlate with Access Logs:** Investigate Azure AD sign-in logs to identify the source of the access. Look for unfamiliar IP addresses or geographic locations that deviate from the user's typical sign-in patterns.

  - **Assess NSG Impact:** Analyze the implications of the change on the network traffic. Use network monitoring tools to evaluate whether legitimate traffic is being affected or blocked, which could indicate a misconfiguration or malicious intent.

  ### Prioritization
  The alert holds a medium severity in the enterprise context as unauthorized changes to network security configurations can have significant impacts on network security and availability. Given the potential for these changes to enable data breaches or disrupt services, timely investigation is critical.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage, particularly if legitimate configuration changes are frequently made by automated processes or trusted administrators. There is an assumption that such changes are susceptible to monitoring through Azure Activity Logs; if logging configurations are incorrect or logs are not retained, the detection could fail. Additionally, it may not catch changes made through unauthorized methods, such as API calls if proper access controls are not enforced. Ensuring comprehensive logging, especially for privileged operations within Azure, is crucial for this alert to function effectively.

