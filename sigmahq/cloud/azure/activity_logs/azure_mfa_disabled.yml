  ### Technical Context

  This rule detects when multi-factor authentication (MFA) is disabled within Azure Active Directory (AAD). This behavior indicates a possible attempt to bypass security mechanisms designed to protect user accounts. The likely attacker objective may include gaining unauthorized access to sensitive resources or user accounts by exploiting lower security settings. The relevant MITRE ATT&CK tactic and technique are Credential Access (T1556) and Defense Evasion (T1560).

  The primary telemetry source for this detection is Azure Active Directory activity logs, specifically monitoring for events where the event name is "Disable Strong Authentication" and the status is marked as successful. If this action is malicious, it could lead to unauthorized access and potential account compromise. However, this detection does NOT confirm malicious intent on its own, as authorized administrators may legitimately disable MFA under certain circumstances.

  ### Investigation Steps

  - **Review event logs for event name "Disable Strong Authentication":** Check Azure Active Directory activity logs for Event Name with value "Disable Strong Authentication" and Status as "success" to confirm the triggering event.

  - **Identify the user account involved:** Validate the user account that initiated the event (check fields: initiator, target) to determine if it aligns with typical administrator accounts. Legitimate modifications are usually performed by known IT personnel during system maintenance.

  - **Cross-reference recent administrative actions:** Inspect the activity log for any additional administrative actions taken by the same user account around the same timeframe (look for recent changes, logins, and other modifications) that may indicate unusual behavior.

  - **Evaluate the justifications for MFA disabling:** Retrieve the reason logged in the API call or follow-up documentation to understand the context behind the MFA being disabled. Look for approved exception requests or maintenance procedures.

  - **Check for unusual login patterns post-disabling:** Analyze user login attempts after the MFA disabling for unusual geography, time, or frequency (examine Event IDs 4624 for successful logins), helping identify possible unauthorized access attempts.

  ### Prioritization

  This alert is of medium severity in an enterprise context as it affects the security posture of user accounts that may be critical. The likelihood of malicious abuse is present since disabling MFA significantly lowers security measures, making it an attractive target for adversaries. Such behavior can be weaponized to facilitate account takeover attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential administrative actions that may be legitimate, triggering false positives. Reliable detection requires comprehensive logging from Azure Active Directory to identify all events relating to authentication methods. Legitimate activities that may trigger this alert include scheduled maintenance performed by IT staff in accordance with established guidelines. A related detection for monitoring unauthorized login attempts (e.g., through Azure AD logs for suspicious sign-ins) could enhance overall coverage.

