  ### Technical Context

  This rule detects instances where Multi-Factor Authentication (MFA) has been disabled within Azure Active Directory, indicating potential attempts to bypass authentication mechanisms. The likely attacker objective is to gain unauthorized access to accounts by weakening security protections. This correlates with several MITRE ATT&CK techniques, notably **T1556: Modify Authentication Process** and **T1078: Valid Accounts**. The primary telemetry source is Azure Activity Logs, specifically capturing events related to changes in authentication methods, notably the event named "Disable Strong Authentication." If malicious, this action can lead to account compromise and unauthorized data access. It is important to note that this detection does NOT confirm that a successful compromise has occurred—it merely indicates a risk elevation.

  ### Investigation Steps

  - **Correlate with User Permissions:**
    Review **Azure Activity Logs** (Event Name: "Disable Strong Authentication") for the user account in question. If the account belongs to an administrator or an authorized user, determine whether the action aligns with acceptable administrative practices or policy.

  - **Examine Recent Account Activity:**
    Check for any immediate user activity correlated with the MFA disable event, including **failed login attempts** or unusual login patterns. Look for Event ID related to login attempts, such as **Event ID 4625** (failed login) or **Event ID 4624** (successful login).

  - **Identify Legitimate Administrative Actions:**
    Assess if MFA was recently disabled in response to known administrative changes or maintenance (e.g., account audits or migrations). Authorized changes should be documented; reference the **Change Management** log.

  - **Evaluate Impact on Account Security:**
    Identify accounts that have MFA disabled without appropriate justification. Use Azure reports to assess whether any high-privilege accounts are affected and if they show signs of unusual access attempts.

  - **Look for Related Indicators of Compromise:**
    Investigate any **subsequent account access** logs that occur shortly after the MFA change. If the account exhibits access patterns indicative of a compromised account, such as access to sensitive resources or unusual geolocation access, consider this a high-confidence malicious indicator.

  ### Prioritization

  This alert is medium severity due to its potential impact on high-value accounts and the likelihood of being exploited by attackers to gain unauthorized access. Disabling MFA is a known tactic in credential abuse scenarios and is often precursory to further malicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging policies; without adequate retention or settings, some events may go unrecorded. Legitimate administrative modifications may trigger this alert, particularly in environments undergoing security adjustments or migrations. A related detection to consider for strengthening coverage is monitoring for unusual account activities post-MFA disable events, particularly failed login attempts and subsequent successful logins from new locations.

