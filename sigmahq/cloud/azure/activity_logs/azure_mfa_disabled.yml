note: |
  ### Technical Context
  This rule detects instances where Multi-Factor Authentication (MFA) has been disabled within an Azure Active Directory environment. Disabling MFA could indicate an attacker attempting to bypass authentication mechanisms to gain unauthorized access to sensitive systems or data. Such actions may form part of an attacker’s strategy to facilitate lateral movement, credential theft, or establish persistence within the network.

  Attackers may disable MFA to simplify their access to user accounts, especially if they have obtained valid credentials through phishing, social engineering, or other means. The likely objectives include accessing sensitive corporate resources, exploiting user privileges, or compromising additional accounts. This behavior is often linked to MITRE ATT&CK tactics, particularly **Defense Evasion** (TA0005) as well as techniques such as **Credential Access** (TA0006) and **Persistence** (TA0003), specifically technique **T1556: Compromise Credentials**.

  The primary data source for detecting this behavior is Azure Activity Logs, particularly focusing on events that indicate changes to authentication settings, such as the disabling of strong authentication protocols.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Investigate the Azure Activity Logs for the `Disable Strong Authentication` event to understand the timeline, user accounts involved, and the contextual details surrounding the event.
  - **Verify User Authorization:** Cross-check with internal policies and authorized change logs to validate whether the modification was legitimately performed by an administrator or if it appears suspicious.
  - **Examine Related User Actions:** Analyze subsequent actions taken by the affected user account, including logins, resource accesses, or any unusual activities that occurred shortly after MFA was disabled.
  - **Assess MFA Configuration:** Confirm the current MFA configuration for other user accounts to ensure compliance and evaluate potential vulnerabilities within the environment, as MFA should be enabled wherever possible.

  ### Prioritization
  This alert holds medium severity due to the potential for significant impact on the organization's security posture. If MFA is disabled maliciously, it can increase the risk of unauthorized access, which could lead to data breaches and the exfiltration of sensitive information.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include scenarios where legitimate administrators may disable MFA for valid reasons that are not captured by internal monitoring. Additionally, the detection logic assumes that all MFA changes are logged and visible in Azure Activity Logs; any misconfigurations could prevent triggering the alert. Furthermore, environments may require specific audit settings to be enabled for comprehensive logging of authentication modifications, which could otherwise lead to missed detections.

