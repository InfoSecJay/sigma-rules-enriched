  ---

  ### Technical Context

  This rule detects modifications or deletions of Azure VPN connections, specifically targeting operations logged as WRITE or DELETE actions for VPN connections. The likely attacker objective may involve disrupting secure communications, establishing unauthorized VPN configurations, or conducting lateral movement. This alert is aligned with the MITRE ATT&CK tactic of Impact (TA0081) and the technique for Data Destruction (T1485).

  The primary telemetry source is Azure Activity Logs, specifically looking for events related to the operations `MICROSOFT.NETWORK/VPNGATEWAYS/VPNCONNECTIONS/WRITE` and `MICROSOFT.NETWORK/VPNGATEWAYS/VPNCONNECTIONS/DELETE`. If malicious, turning off or modifying a VPN connection can severely hinder secure access to resources, providing the adversary an opportunity to exploit exploits further. However, this detection does not confirm the intent behind the actions—system administrators may also perform these operations legitimately.

  ---

  ### Investigation Steps

  - **Review event details:** Check the Azure Activity Logs for entries with operation names `MICROSOFT.NETWORK/VPNGATEWAYS/VPNCONNECTIONS/WRITE` or `DELETE`. Focus on attributes such as `initiator`, `user agent`, and `resource ID` to determine if the change aligns with expected user behavior.

  - **Identify user identity and context:** Validate the identity of the user performing the action against known administrative accounts. A legitimate admin modifying a connection is typical, while unfamiliar user accounts should raise suspicions (e.g., entries with `user principal name` containing non-company domains).

  - **Assess the timeframe and frequency:** Investigate if the modifications or deletions occurred during off-hours or outside typical administrative business hours. This could indicate potential malicious activity.

  - **Correlate with other telemetry:** Look for related events in Azure resources. Modifications should correlate with other notifications, such as changes to Network Security Groups or Azure Firewall rules, which could indicate broader network manipulation.

  - **Verify endpoint behavior:** Determine if any connected devices or servers show disrupted network connectivity after the VPN alteration. Unexpected loss of access can indicate potential exploitation attempts.

  - **Check for prior alerts or patterns:** Review historical logs for similar VPN connection changes that could tie back to a larger suspicious activity pattern. This contextual evidence can assist in identifying persistent threats.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact of VPN connection changes on secure communications, which could facilitate unauthorized access if abused. The likelihood of malicious action is moderate, as altering VPN settings can disrupt business operations, commonly weaponized in lateral movement by attackers.

  ---

  ### Blind Spots and Assumptions

  Detection may not identify all legitimate administrative actions, creating a risk of false positives. Assumptions include that all changes come from known administrators, while external actors may exploit compromised accounts. The alert could be triggered by routine maintenance or legitimate updates, requiring careful context verification. A related detection could include monitoring changes to Azure Role-Based Access Control (RBAC) permissions, which could indicate access abuse prior to a VPN modification.

