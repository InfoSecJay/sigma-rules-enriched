note: |
  ### Technical Context
  This rule detects modifications or deletions of VPN connections within Microsoft Azure, typically performed through activity logs that capture changes to VPN infrastructure. The ability to modify or delete a VPN connection could indicate a targeted attack aimed at disrupting secure connectivity or exfiltrating sensitive information. Attackers may either seek to escalate privileges to gain unauthorized access to cloud resources or simply sever secure connections to facilitate unauthorized activities.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Impact** (TA0040) as attackers may aim to disable security measures. Specific techniques involved may be **Data Destruction** (T1485) or **Service Stop** (T1489) if the intention is to compromise cloud service availability or integrity.

  Primary data sources for detecting this activity include Azure activity logs, which provide detailed records of operations performed on VPN connections, along with authentication logs and audit trails to confirm user intent and identity.

  ### Investigation Steps
  - **Verify User Identity**: Check the identity of the user or service account responsible for the modification or deletion of the VPN connection. Ensure that this action is consistent with their previous behaviors and expected privileges.
  - **Review Activity Logs**: Examine Azure activity logs for all recent operations related to the VPN gateway and connections. Look for patterns or anomalies, such as simultaneous changes from multiple sources or modifications made during unusual hours.
  - **Analyze Authentication Logs**: Investigate any authentication logs associated with the actions to identify whether the activity originated from a legitimate source or if there are indications of compromised accounts (e.g., unfamiliar IP addresses or geolocations).
  - **Cross-reference with Network Traffic**: Assess the network traffic to and from the modified or deleted VPN connections. Look for any unusual behavior before and after the change, such as spikes in outbound connections or unauthorized data transfers.

  ### Prioritization
  This alert carries medium severity due to the potential impact of unauthorized changes to VPN connections, which can lead to service disruption or data leakage. The likelihood of exploitation varies based on the administrative oversight and existing security controls in place.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging settings are misconfigured or if certain operations do not generate activity logs. The detection logic assumes that changes to VPN connections should only occur via authorized personnel, hence any modifications by unexpected users warrant investigation. Proper logging settings for Azure activity and network traffic must be enabled for this rule to function effectively, ensuring that all pertinent actions are recorded for analysis.

