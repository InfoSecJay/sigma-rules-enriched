note: |
  ### Technical Context

  This rule detects modifications and deletions of network policies in Azure Kubernetes Service (AKS). These actions may indicate unauthorized attempts to disrupt or alter network traffic controls, enabling further exploitation or lateral movement within the environment. The likely attacker objective is to manipulate access controls, potentially to allow communication between compromised containers or to exfiltrate data.

  The relevant MITRE ATT&CK tactics include **Impact** (T1496) and **Credential Access** (T1485), as altering network policies can facilitate unauthorized access or data exfiltration. The primary telemetry sources for this detection are Azure activity logs, specifically monitoring operations related to network policies. If malicious, the impact could be significant, potentially leading to unauthorized access or data breaches.

  This detection alone does NOT confirm malicious intent, as legitimate administrative actions can also trigger these alerts. Analysts should ascertain whether the changes align with expected network policy management activities by authorized users.

  ### Investigation Steps

  - **Verify user identity and activity purpose:** Check the identity associated with the change against an inventory of authorized personnel to see if the user is expected to modify network policies. Use Azure activity logs (operationName) to trace user actions.

  - **Identify the nature of changes made:** Review the specific network policy changes alongside their context in Azure activity logs (fields: operationName, timestamp, caller) to determine if they align with commonplace administrative activities or are suspicious.

  - **Assess the timing of changes:** Cross-reference the timestamps of the network policy modifications or deletions against other suspicious trends or alerts in Azure logs (Event ID: N/A). This can help determine if it coincides with other potentially malicious activities.

  - **Check configurations for false positives:** Determine whether the network policy change reflects expected behavior from other legitimate system processes or scheduled activities. Compare changes against an internal baseline of network policies to identify anomalies.

  - **Identify high-confidence malicious indicators:** Look for changes made by unfamiliar or unauthorized users that do not match typical administrative patterns (e.g., unexpected user agents or unfamiliar IP addresses in Azure activity logs).

  - **Document any exfiltration events or related incidents:** If suspicious changes are identified, check for any unusual outbound traffic associated with the affected pods or services through network logs, which may indicate potential data exfiltration attempts.

  ### Prioritization

  This alert holds medium severity due to the potential impact on network security if malicious actions are confirmed, especially in environments with sensitive workloads. The likelihood of abuse is moderate, given that network policies are often targeted during lateral movement and exploitation phases by adversaries. Although such changes can occur legitimately, they warrant immediate investigation to rule out any unauthorized activities.

  ### Blind Spots and Assumptions

  This detection might be limited by the presence of false positives stemming from legitimate network policy management. Analysts must ensure that Azure activity logs collect the necessary data for comprehensive visibility into changes. Unexpected changes from expected authorized users, such as known administrators, may pass unnoticed if not cross-referenced with an established baseline. Companion detections, such as alerts on suspicious container activity (e.g., excessive outbound connections), can enhance coverage and provide additional context regarding the network policy changes.

