note: |
  ### Technical Context
  This detection rule is designed to identify modifications or deletions of Azure Kubernetes network policies within an organization's cloud environment. Network policies in Kubernetes are essential for controlling the communication between pods, thus ensuring that only authorized interactions occur based on defined rules. An attacker may aim to alter or remove these policies to create covert communication channels between malicious pods, facilitate lateral movement within the cluster, or evade detection by restricting logging of traffic.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Initial Access** (ID: TA0001), which may be applicable if the changes signify a breach; **Execution** (ID: TA0002) if changes are used to deploy malicious containers; and **Impact** (ID: TA0009) as unauthorized modifications could disrupt operations or compromise system integrity. The specific techniques that link to this behavior include **T1485 - Data Destruction** and **T1496 - Resource Hijacking**, where attackers leverage their access to hijack resources or delete crucial security configurations.

  The primary data source for this detection is Azure activity logs, which capture a range of operations performed on Kubernetes resources. Monitoring these logs can provide insights into who made changes, what actions were taken, and when they occurred -- vital information for defending against potential threats.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Examine the Azure activity logs for Kubernetes to identify the user identity, time, and origin of the operation surrounding the modified or deleted network policies.
  - **Check User Agent and Hostname:** Verify whether the user agent and hostname associated with the network policy modification or deletion are legitimate and expected within your environment to identify potential unauthorized actions.
  - **Correlate with Kubernetes Pod Logs:** Investigate the logs of the Kubernetes pods involved to assess if the modifications correlate with unusual patterns or behaviors, such as unexpected container deployments or increased network traffic.
  - **Assess Role-Based Access Control (RBAC) Configurations:** Analyze the RBAC settings in your Kubernetes cluster to ensure that appropriate permissions are in place for users and that no users have excessive permissions that could allow unauthorized policy changes.

  ### Prioritization
  This alert is classified as medium severity due to the potential for significant impact if network policies are altered or deleted maliciously, allowing attackers to establish unauthorized communication channels or disrupt services. In an enterprise environment, the likelihood of such changes stemming from compromised credentials or insider threats necessitates prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if activity logging for Azure Kubernetes is not properly configured to capture all relevant operations. The detection logic assumes that the identities modifying network policies are unauthorized; however, legitimate changes made by system administrators or automated processes could inadvertently trigger this alert. It is critical to ensure that necessary logging levels are enabled for Azure activity logs to capture these events effectively. Additionally, assumptions based on user history may lead to false positives if known benign behaviors are not adequately accounted for in the alerting criteria.

