note: |
  ### Technical Context
  This rule detects scenarios where permissions are granted to accounts in Azure resources, specifically when the action originates from a previously unseen source IP address. Attackers may leverage this behavior to escalate privileges or maintain persistence within an environment by unexpectedly granting themselves or other entities elevated privileges. This could facilitate unauthorized access to sensitive resources, enabling data exfiltration or lateral movement across the network.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), with specific emphasis on the technique **Permission Groups** (T1098.003). Detection focuses on identifying potentially malicious activity associated with newly established permissions, which can indicate an intrusion or unauthorized access attempt to Azure resources.

  The primary data source for this detection is Azure Activity Logs, which provide comprehensive and detailed records of actions taken within an Azure environment, including role assignments and modifications to access permissions.

  ### Investigation Steps
  - **Review Activity Logs:** Analyze Azure Activity Logs to identify specific details related to the permission grants, including timestamps, source IP addresses, and user identities involved in the actions.
  - **Correlate Source IPs:** Investigate the source IP address triggering the alert to determine if it has been previously seen in legitimate activities or if it corresponds to known bad actors or locations.
  - **Identify Associated Accounts:** Examine the accounts that received permissions in the detected action. Investigate their activity and roles to determine if they align with organizational policies and expected access levels.
  - **Check for Patterns:** Assess if this permission grant occurs alongside other suspicious activities, such as multiple failed login attempts or changes to critical resources, to evaluate the risk level associated with the event.

  ### Prioritization
  The severity of this alert is considered medium due to its potential impact on the security posture of the enterprise. Unrecognized source IP addresses granting permissions can indicate an ongoing or past compromise, increasing the likelihood of unauthorized data access or lateral movement.

  ### Blind Spots and Assumptions
  One key gap in detection coverage could arise from legitimate changes made through automated systems or services that might not generate alarms, leading to many valid changes being filtered out as false positives. The detection logic assumes that any unseen source IP is a potential threat, which may not always hold true in cases of legitimate remote work scenarios or cloud resource access. For this alert to function effectively, comprehensive logging configurations should be in place for Azure Activity Logs to capture all relevant actions adequately.

