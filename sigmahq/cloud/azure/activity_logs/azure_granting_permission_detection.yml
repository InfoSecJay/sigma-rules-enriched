  ### Technical Context

  This Sigma rule detects the granting of permissions to an account within Azure when initiated from an IP address that has not been previously observed in the environment. The likely attacker objective is privilege escalation, potentially to facilitate unauthorized access or to maintain persistence within the Azure environment. This behavior aligns with the MITRE ATT&CK technique "Assigning Privileges" (T1098.003) under the "Persistence" tactic.

  The primary telemetry source for this rule includes Azure Activity Logs, specifically focusing on entries related to role assignments with the event type "Microsoft.Authorization/roleAssignments/write". If these alerts are malicious, they might indicate a significant breach of account control, leading to data loss or service disruptions. However, it is important to note that this detection does NOT confirm malicious intent on its own; legitimate changes by administrators can also trigger this alert.

  ### Investigation Steps

  - **Check source IP reputation:** Utilize threat intelligence sources to validate the IP address against known indicators of compromise. Check logs for Event ID related to Azure Activity (e.g., Event ID 201 for role assignment events) to confirm if the IP is associated with known malicious activity.

  - **Review role assignments:** Examine the details of the role assignment by accessing Azure Activity Log entries for the specific time window. Look for fields such as "principalId" and "roleDefinitionId" in the role assignment logs to identify the user account and permissions granted.

  - **Investigate user account activity:** Check the Azure AD sign-in logs (Event ID 4624) for the impacted user to identify any unusual sign-in patterns, such as access from foreign geographic locations or multiple failed login attempts preceding the assignment.

  - **Assess legitimate administrative activity:** Confirm whether the IP address corresponds to known organizational constraints. It is common for legitimate changes to come from specific internal IP ranges or VPNs used by administrators.

  - **Identify high-confidence malicious actions:** Look for additional suspicious Azure Activity Log entries or KQL queries related to the same user account around the time of the role assignment. Correlate with any unusual resource modifications or creations.

  ### Prioritization

  The severity of this alert is medium. While the affected system is Azure, where privilege escalation can lead to significant vulnerabilities, the likelihood of abuse depends on the context of the activity. However, the behavior is commonly weaponized, as attackers often seek to escalate privileges directly after gaining initial access.

  ### Blind Spots and Assumptions

  This detection may face limitations, as attackers can spoof IP addresses or use trusted remote environments to execute their actions. It requires active configuration of Azure Activity Logs in a way that records all relevant events for reliable detection. Furthermore, legitimate administrative actions from dynamic or remote users may trigger this alert. A companion detection to enhance coverage could involve monitoring Azure AD changes related to user groups and memberships that may indicate elevation of privileges or lateral movement tactics.

