note: |
  ### Technical Context

  This Sigma rule detects the deletion of Azure Kubernetes Pods, indicating potential unauthorized modifications to cloud-native applications. The likely attacker objective includes disrupting services, data exfiltration, or eliminating evidence of malicious activity. This behavior aligns with the MITRE ATT&CK tactic **Impact** (TA0057) and the technique **Resource Hijacking** (T1484). The primary telemetry source is Azure Activity Logs, specifically looking for the operation name **MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/PODS/DELETE**. If the deletion is malicious, it could disrupt application availability or lead to service downtime. However, this detection does NOT confirm that the deletion was unauthorized, as it could also be performed legitimately by system administrators or automated processes.

  ### Investigation Steps

  - **Verify user identity and source context:** Review the Azure Activity Logs and identify the user or service principal associated with the pod deletion (look for fields such as `caller` and `resourceId`). Confirm if this entity is known to manage pod resources.

  - **Cross-reference user roles:** Check the role assignments for the user who executed the deletion by querying the Azure Role-Based Access Control (RBAC) settings (e.g., Azure CLI command `az role assignment list`). Ensure they have appropriate permissions for pod management.

  - **Examine recent activity logs:** Analyze the Azure Activity Logs for related activities preceding the pod deletion to identify any unusual patterns, such as mass deletions or modifications by the same user ID or from the same IP address.

  - **Assess compliance with organizational policy:** Determine if there is a documented process for pod deletion and if the deletion aligns with legitimate operational changes (check for deployment updates or scheduled maintenance).

  - **Identify high-confidence malicious indicators:** Look for signs of privilege escalation or lateral movement in the activity logs, such as deletions performed by users who typically do not manage Kubernetes resources or include sudden usage from unfamiliar IP addresses.

  ### Prioritization

  The alert has medium severity due to the potential impact on critical workloads in production environments. The likelihood of malicious abuse exists, particularly in environments with less mature governance and oversight. Pod deletions are also a common tactic used by adversaries during service disruptions or cloud resource manipulation.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative activities that could trigger false positives. Ensure comprehensive logging is enabled for all Kubernetes operations to enhance visibility. Additionally, automated processes or CI/CD pipelines might generate similar logs. Companion detections such as monitoring for **pod creation** and **configuration changes** (e.g., `MICROSOFT.KUBERNETES/CONNECTEDCLUSTERS/PODS/WRITE`) can enhance detection coverage and context.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
