note: |
  ### Technical Context
  This detection rule identifies the deletion of Azure Kubernetes Pods, which can be an indicator of malicious activity or operational misconfigurations within Kubernetes environments. Kubernetes Pods are the smallest deployable units and deleting them may reflect an attacker’s attempts to disrupt services, escalate privileges, or hide their activity by erasing evidence. The suspected threat actor might be targeting the cloud-native environments to manipulate resources or exploit vulnerabilities, potentially aiming to impact service availability or achieve lateral movement within the organization's infrastructure.

  Relevant MITRE ATT&CK tactics include **Impact** (TA0040), specifically technique **Service Stop** (T1489), which involves affecting the operation of resources through service disruptions. The primary data source for this detection includes Azure Activity Logs, which record operations performed within the Azure environment. By monitoring these logs, analysts can gain insights into potentially unwanted deletions, particularly when paired with contextual information about the identity of the user performing the action.

  ### Investigation Steps
  - **Collect Activity Logs**: Retrieve Azure Activity Logs to find entries related to POD deletions, focusing on timestamps and operation names to understand the context and response actions taken.
  - **Analyze User Activity**: Verify the associated user identity performing the deletion against known administrators and service accounts. Look for unusual or unexpected identities, especially those lacking appropriate permissions.
  - **Review Pod Ownership and Purpose**: Investigate the specific Pods that were deleted to determine their role within the application environment and evaluate the impact of their removal, assessing if this aligns with any operational procedures.
  - **Monitor for Subsequent Actions**: After a deletion event, check for follow-up actions that could indicate malicious intent, such as the creation of new Pods under suspicious user accounts or a spike in network activity related to those resources.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of Pod deletions on service availability and data integrity, combined with the likelihood that such deletions could be indicative of malicious activity, especially if performed by unauthorized users.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by scenarios where Pod deletions are legitimate actions taken by system administrators, possibly leading to false positives. The detection logic assumes that all deletions should originate from known legitimate users and that anomalies will often correlate with unauthorized access attempts. Logs must be properly configured to capture all relevant Azure Activity Log details for accurate detection of these events.

