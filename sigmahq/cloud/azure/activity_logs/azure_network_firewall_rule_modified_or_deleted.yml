  ---

  ### Technical Context

  This Sigma rule detects modifications or deletions to Azure Firewall Rule Configurations, indicating changes to network security policies. Attackers may aim to bypass security measures or manipulate traffic rules, facilitating unauthorized access or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic "Impact" (TA0040), specifically technique "Data Manipulation" (T1503).

  The primary telemetry source is Azure Activity Logs, capturing operations involving firewall policy rule collections. The security impact of malicious modifications includes potential exposure of sensitive data or unauthorized network access. Importantly, this detection does NOT confirm that the change is inherently malicious; legitimate administrative actions may trigger it.

  ---

  ### Investigation Steps

  - **Review Azure Activity Logs:** Check for Event Types linked to "MICROSOFT.NETWORK/FIREWALLPOLICIES/RULECOLLECTIONGROUPS/WRITE" or "DELETE" for the timestamps of the alert. Validate legitimate changes can occur during maintenance windows or scheduled updates by administrators.

  - **Analyze User Identity:** Evaluate the identity of the user making the changes. Changes made by familiar, authorized personnel (with appropriate roles like Firewall Administrator) generally indicate benign activity, while unfamiliar users warrant deeper investigation.

  - **Inspect User Agent Information:** Determine the User Agent string associated with the operation. Legitimate actions typically originate from known management tools or IP addresses, while unknown user agents could indicate a compromised account.

  - **Check for Competing Alerts:** Investigate other related alerts or logs during the same timeframe, such as suspicious login attempts or API calls, that might indicate a broader attack vector. Cross-reference with relevant threat intelligence databases.

  - **Audit Firewall Rule Outcomes:** Verify current Firewall rules against expected configurations. Configurations that deviate from baseline security policies or allow unintended traffic types may signify malicious intent.

  - **Determine Asset Criticality:** Identify the criticality of the affected Azure Firewall. Changes in the firewall of critical assets could heighten risk levels, necessitating an expedited review and possible escalation.

  ---

  ### Prioritization

  The alert should be treated with medium priority due to the potential impact on critical network security configurations. The likelihood of malicious activity is moderate, as it can occur through legitimate administrative changes but is also a common tactic for adversaries to manipulate firewall settings for exploitation.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the settings of Azure Activity Logs; if not properly configured, changes may go undocumented. Legitimate changes by authorized administrators could trigger alerts, highlighting the need for contextual investigation. Companion detections, such as user access patterns or anomalous login alerts, can enhance coverage and contextual understanding for investigations.

