note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of Azure Firewall Rule Configurations, indicating potential unauthorized changes to firewall policies. The likely attacker objective is to create opportunities for lateral movement or data exfiltration by weakening network defenses via misconfigured or removed firewall rules. This behavior is aligned with the MITRE ATT&CK tactic of "Impact" (TA0040) and specifically techniques such as "Data Manipulation" (T1203) and "Network Denial of Service" (T1499).

  The primary telemetry sources for this detection are Azure Activity Logs, specifically operations related to firewall policy modifications. The security impact of such actions can lead to unauthorized access to critical systems or data loss if firewall protections are bypassed. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may trigger the alerts and need to be assessed.

  ### Investigation Steps

  - **Verify the User Identity and Role**: Check the user identity associated with the modification (Activity Log fields: `initiatedBy.user`, `initiatedBy.app`) and confirm if they have the appropriate administrative roles to modify firewall rules.

  - **Evaluate the Timestamp and Context**: Review the timestamp of the event (Activity Log field: `eventTimestamp`) relative to expected maintenance windows or known scheduled changes to filter out potential false positives related to benign administrative activity.

  - **Check for Unfamiliar Source IPs**: Investigate the source IP of the modification request (Activity Log field: `callerIpAddress`). Compare against known IP ranges for your organization to identify potential malicious external actors.

  - **Review Firewall Rule Changes**: Analyze specifics of the modified configurations (Activity Log fields: `properties`) to determine the nature and scope of changes made to the firewall rules. Pay attention to broad or permissive changes that significantly weaken firewall protections.

  - **Identify Historical Changes**: Utilize Azure Resource Graph queries to retrieve the history of firewall rule modifications. Determine if the changes fit expected patterns or represent a sudden shift in rule configurations that may indicate malicious behavior.

  - **Evaluate for Potential Data Exfiltration**: If configuration deletions were performed, validate if subsequent network traffic patterns indicate data exfiltration attempts (Examine flow logs or Azure Monitor data for unusual egress traffic).

  ### Prioritization

  This alert is of medium severity due to the impact of potential firewall rule changes on an organization’s security posture. The likelihood of malicious abuse is moderate, especially if changes are made by unauthorized users or outside normal operational patterns. While not every modification is indicative of an attack, compromised firewall rules can lead to serious breaches.

  ### Blind Spots and Assumptions

  There are detection limitations given that legitimate administrative actions can trigger the alert, particularly if not all administrative users are accounted for in oversight. Additionally, if logging configurations for Azure Activity Logs are not fully enabled or comprehensive, the detection may miss critical events. Common legitimate activities include scheduled maintenance or updates by known administrators. Companion detections such as user access modifications or unusual login patterns can enhance overall security monitoring in relation to firewall changes.

