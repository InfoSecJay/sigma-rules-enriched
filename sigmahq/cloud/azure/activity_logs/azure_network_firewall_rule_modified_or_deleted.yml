note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of Azure Firewall rule configurations, which are critical components in maintaining the security posture of Azure environments. Unauthorized changes to these configurations may indicate a potential security threat, such as an insider threat or a compromised account aiming to manipulate firewall settings for malicious purposes. Attackers may seek to create, modify, or remove rules to facilitate unauthorized access to cloud resources, harvest sensitive data, or disrupt services.

  Relevant MITRE ATT&CK tactics include **Impact (TA0040)**, particularly the technique **Data Manipulation (T1491)**, which encompasses actions that alter the integrity or availability of data through malicious modifications. The primary data source for this detection is Azure Activity Logs, which record user activities and administrative actions across Azure resources, providing crucial context for understanding the legitimacy of configuration changes.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Investigate the Azure Activity Logs to identify the specific changes made to the Firewall Rule Configurations, including timestamps, user identities, and the IP addresses or user agents involved.
  - **Correlate with User Access Levels**: Assess whether the user making the changes has appropriate administrative privileges and verify their user role to detect any unauthorized access.
  - **Check for Anomalous Access Patterns**: Look for unusual access patterns that might indicate a compromised account, such as changes made from unfamiliar locations or when atypical activity is detected.
  - **Audit Related Security Configurations**: Verify whether security policies and controls surrounding firewall access and modifications are in place, ensuring that logging, monitoring, and alerting mechanisms are functioning effectively.

  ### Prioritization
  The severity of this alert is medium as unauthorized modifications or deletions of firewall rules directly impact the security and integrity of cloud infrastructure. The likelihood of occurrence can vary based on the environment’s security posture and monitoring capabilities, but such activities warrant timely investigation to mitigate potential risks.

  ### Blind Spots and Assumptions
  This detection rule may miss legitimate administrative changes by trusted personnel, especially if proper access controls and logging are not enforced. The rule assumes that only authorized administrators make changes to firewall configurations and does not account for potential session hijacking or credential theft scenarios. For optimal function, continuous logging and retention of Azure Activity Logs must be ensured, and alerts should be tuned based on known organizational behavior to minimize false positives.

