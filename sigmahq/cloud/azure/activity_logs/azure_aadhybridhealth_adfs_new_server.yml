title: Azure Active Directory Hybrid Health AD FS New Server
id: 288a39fc-4914-4831-9ada-270e9dc12cb4
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the creation or update of a server instance in an Azure AD Hybrid health AD FS service.
  A threat actor can create a new AD Health ADFS service and create a fake server instance to spoof AD FS signing logs. There is no need to compromise an on-prem AD FS server.
  This can be done programmatically via HTTP requests to Azure.
references:
- https://o365blog.com/post/hybridhealthagent/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2023-10-11
tags:
- attack.defense-evasion
- attack.t1578
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    CategoryValue: 'Administrative'
    ResourceProviderValue: 'Microsoft.ADHybridHealthService'
    ResourceId|contains: 'AdFederationService'
    OperationNameValue: 'Microsoft.ADHybridHealthService/services/servicemembers/action'
  condition: selection
falsepositives:
- Legitimate AD FS servers added to an AAD Health AD FS service instance
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation or updating of a server instance within Azure AD Hybrid Health AD FS services, indicating potential suspicious activity. The likely attacker objective would be to establish a fake AD FS instance to manipulate or spoof authentication logs without compromising an existing on-premises AD FS server. This behavior correlates with the MITRE ATT&CK technique for Abuse Elevation Control Mechanism (T1578), particularly through administrative actions.

  The primary telemetry source is Azure activity logs, specifically logs categorized under Administrative actions. If malicious, the creation of a fake AD FS instance could lead to unauthorized access or the ability to generate fraudulent authentication records. However, this detection does NOT confirm that a compromise has occurred; it merely identifies the action of creating or modifying a server instance.

  ### Investigation Steps

  - **Check Azure Activity Logs for suspicious operations:** Review Azure activity logs (Event category: Administrative) for any entries related to `Microsoft.ADHybridHealthService` that indicate server instance creation or updates, filtering by `OperationNameValue: 'Microsoft.ADHybridHealthService/services/servicemembers/action'`.

  - **Identify legitimate server instances:** Compare the action against a baseline of authorized AD FS servers to identify legitimate updates. Expected behavior includes regular updates made by system administrators following pre-defined schedules.

  - **Examine resource IDs for anomalous entries:** Look for unusual naming conventions or resource patterns in the `ResourceId` field of the Azure logs that contain 'AdFederationService', indicating potential malicious intent.

  - **Validate the origin of API calls:** Identify any unusual or unauthorized IP addresses in the logs that may have triggered these actions, especially for automated scripting activity using Azure REST API.

  - **Assess user permissions and roles:** Investigate the permissions of the accounts associated with the creation or updates. Ensure that accounts involved in the detected actions have appropriate administrative privileges and are not associated with compromised accounts.

  ### Prioritization

  This alert is of medium severity due to the potential high impact on identity management within an enterprise. Given that AD FS is critical for authentication in many organizations, the likelihood of malicious use, especially in targeted attacks against identity infrastructure, is significant. This behavior is not commonly observed in benign operational changes, emphasizing the need for thorough investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations or the absence of detailed Azure activity logs. Attackers could use legitimate accounts with administrative privileges to create or manipulate AD FS instances undetected. Furthermore, legitimate actions from cloud security audits or administrative maintenance may trigger this alert. Compounding detection through monitoring of unusual API activity or user behavior analytics could enhance detection capabilities.

