title: Azure Active Directory Hybrid Health AD FS New Server
id: 288a39fc-4914-4831-9ada-270e9dc12cb4
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the creation or update of a server instance in an Azure AD Hybrid health AD FS service.
  A threat actor can create a new AD Health ADFS service and create a fake server instance to spoof AD FS signing logs. There is no need to compromise an on-prem AD FS server.
  This can be done programmatically via HTTP requests to Azure.
references:
- https://o365blog.com/post/hybridhealthagent/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2023-10-11
tags:
- attack.defense-evasion
- attack.t1578
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    CategoryValue: 'Administrative'
    ResourceProviderValue: 'Microsoft.ADHybridHealthService'
    ResourceId|contains: 'AdFederationService'
    OperationNameValue: 'Microsoft.ADHybridHealthService/services/servicemembers/action'
  condition: selection
falsepositives:
- Legitimate AD FS servers added to an AAD Health AD FS service instance
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation or modification of server instances in an Azure Active Directory Hybrid Health AD FS service by analyzing Azure activity logs categorized under "Administrative." The primary concern is that an attacker could exploit this capability to create fraudulent AD FS server instances, thereby enabling them to manipulate or spoof related AD FS signing logs without needing to compromise an existing on-premises AD FS server. This behavior allows the adversary to gain unauthorized access or conduct various malicious activities under the guise of legitimate AD FS operations.

  The threat scenario often revolves around adversaries attempting to maintain persistence, evade detection, or execute unauthorized actions within an organization's cloud environment. By creating a deceptive AD FS instance, attackers can bypass traditional security measures that rely heavily on the integrity of existing server instances. This behavior aligns with the MITRE ATT&CK tactics of **Defense Evasion** (T1562) by implementing strategies to avoid detection, as well as **Replication Through Removable Media** (T1578) that leverages misconfigurations to gain access to sensitive environments.

  The primary data source for these detections is the Azure activity logs, especially the entries that capture administrative actions related to the AD Hybrid health services, which include the creation or modification of server instances.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Analyze the Azure activity logs for entries related to administrative actions on the Microsoft.ADHybridHealthService. Look specifically for creation or modification operations within the AD FS resources.

  - **Correlate with AD FS Logs:** Cross-reference the identified entries in the Azure activity logs with existing AD FS logs to determine if any unexpected changes in service health or server status coincide with the detected activity.

  - **Audit User Access and Changes:** Examine user accounts that initiated the detected actions, verifying their permissions and intent. Look for signs of compromised accounts or misuse of privileges.

  - **Monitor for Subsequent Activity:** After identifying and validating any suspicious changes, monitor logs for subsequent suspicious activity that may suggest exploitation, such as unusual authentication patterns or spikes in AD FS logins.

  ### Prioritization
  This alert is rated medium severity due to the potential impact of compromising AD FS server instances, which could lead to unauthorized access to critical resources. The likelihood of this attack method being leveraged increases as adversaries seek ways to evade detection on cloud platforms.

  ### Blind Spots and Assumptions
  This detection logic may not cover legitimate scenarios where new AD FS server instances are created as part of routine maintenance or scaling efforts. It assumes that all legitimate operations are conducted by known and authorized users within the organization. Additionally, coverage may be limited by the logging configuration; it requires comprehensive Azure activity logging to be enabled for accurate detection. Regular reviews of permissions and Azure roles are essential to maintain an effective defensive posture.

