title: Azure Active Directory Hybrid Health AD FS New Server
id: 288a39fc-4914-4831-9ada-270e9dc12cb4
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the creation or update of a server instance in an Azure AD Hybrid health AD FS service.
  A threat actor can create a new AD Health ADFS service and create a fake server instance to spoof AD FS signing logs. There is no need to compromise an on-prem AD FS server.
  This can be done programmatically via HTTP requests to Azure.
references:
- https://o365blog.com/post/hybridhealthagent/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2023-10-11
tags:
- attack.defense-impairment
- attack.t1578
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    CategoryValue: 'Administrative'
    ResourceProviderValue: 'Microsoft.ADHybridHealthService'
    ResourceId|contains: 'AdFederationService'
    OperationNameValue: 'Microsoft.ADHybridHealthService/services/servicemembers/action'
  condition: selection
falsepositives:
- Legitimate AD FS servers added to an AAD Health AD FS service instance
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of an Azure Active Directory Hybrid Health AD FS service instance. Malicious actors may exploit this capability to create a fake server instance, thereby spoofing Active Directory Federation Services (AD FS) signing logs without needing to compromise an existing on-premises AD FS server. This behavior aligns with the MITRE ATT&CK tactic: **Defense Impairment (T1578)**, indicating collusion or deception aimed at undermining security controls.

  The primary telemetry source for this detection is the Azure Activity Logs, specifically logs under the Administrative category, which include events related to the management and configuration of Azure services. If malicious, this activity could potentially allow an adversary to impersonate users or disrupt authentication processes. However, this detection does NOT confirm that malicious activity occurred without further context, as legitimate administrative actions are also captured by this rule.

  ### Investigation Steps

  - **Verify recent Azure Activity Log entries:**
    Explore Azure Activity Logs, particularly looking for entries where `OperationNameValue` is set to `Microsoft.ADHybridHealthService/services/servicemembers/action`. This could indicate a change in AD FS server instances.

  - **Identify the initiator of the event:**
    Review the `Caller` field in the Activity Log for the creation event. Anomalous or unexpected user accounts (especially those not typically associated with administration) could be a strong indicator of potential malicious activity.

  - **Check for legitimate administrative behavior:**
    Compare changes against a baseline of normal operations; look for patterns of openings and closures around legitimate AD FS instances. Consistent entries in logs from known legitimate users indicate normal administrative functions.

  - **Analyze resource ID details:**
    Validate the `ResourceId` associated with the logged event. Ensure it adheres to expected patterns for legitimate AD FS instances (i.e., check for naming conventions or patterns generally followed by your organization).

  - **Review access permissions of the initiator:**
    Use Azure Access Control (IAM) logs to assess whether the user who created or modified the AD FS instance had the necessary roles and permissions. Unauthorized role assignments can correlate with suspicious activities.

  - **Monitor for secondary indicators:**
    Watch for subsequent events that indicate attempts to access or utilize the spoofed AD FS service, such as unusual sign-in logs or modified resource interactions tied to this service.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on authentication processes if exploited but may also indicate administrative changes by legitimate users in response to operational needs. While the creation of fake AD FS instances can be weaponized, it typically requires precise targeting, making its likelihood conditional on the sophistication of the adversary.

  ### Blind Spots and Assumptions

  The detection may miss certain evasion techniques where attackers could use legitimate accounts to mask their actions, highlighting a reliance on an accurate tracking of user permissions in Azure. Additionally, legitimate updates to AD FS services can also trigger this alert, causing potential false positives. It’s advisable to have companion detections around unusual authentication patterns or access log anomalies to strengthen coverage.

