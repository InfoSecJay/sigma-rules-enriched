title: Azure Active Directory Hybrid Health AD FS New Server
id: 288a39fc-4914-4831-9ada-270e9dc12cb4
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the creation or update of a server instance in an Azure AD Hybrid health AD FS service.
  A threat actor can create a new AD Health ADFS service and create a fake server instance to spoof AD FS signing logs. There is no need to compromise an on-prem AD FS server.
  This can be done programmatically via HTTP requests to Azure.
references:
- https://web.archive.org/web/20220619212736/https://o365blog.com/post/hybridhealthagent/
- https://aadinternals.com/talks/HelSec%20August%202021.pdf
- https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/identity#microsoftadhybridhealthservice
- https://www.inversecos.com/2023/01/detecting-fake-events-in-azure-sign-in.html
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2026-10-21
tags:
- attack.defense-impairment
- attack.t1578
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    category: 'Administrative'
    resourceId|contains: 'AdFederationService'
    operationName: 'MICROSOFT.ADHYBRIDHEALTHSERVICE/SERVICES/SERVICEMEMBERS/ACTION'
  condition: selection
falsepositives:
- Legitimate AD FS servers added to an AAD Health AD FS service instance
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation or update of a server instance within the Azure AD Hybrid Health AD FS service, potentially indicating the establishment of a fake server instance by an attacker. The likely objective is to manipulate or spoof AD FS signing logs, enabling unauthorized access or impersonation without compromising existing AD FS servers. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0011) and the technique of Misuse Elevation Control Mechanism (T1578). The primary telemetry source is Azure activity logs, specifically within the Administrative category. If malicious, the creation of a fake instance could allow an adversary to bypass security measures and misuse identity services. This detection does NOT confirm actual exploitation; it only indicates a potential malicious configuration change.

  ### Investigation Steps

  - **Check for unauthorized resource IDs:** Review Azure activity logs (Event category: Administrative) for entries with `resourceId` containing 'AdFederationService'. Identify instances created by unfamiliar or unauthorized accounts, particularly any created outside of standard operational hours.

  - **Validate operation names:** Look for log entries with `operationName` set to 'MICROSOFT.ADHYBRIDHEALTHSERVICE/SERVICES/SERVICEMEMBERS/ACTION'. Cross-reference the timestamp and user with known administrative actions to discern if changes were made by legitimate personnel.

  - **Review account permissions:** Examine users creating or updating server instances to ensure they possess the appropriate Azure role-based access controls (RBAC). Legitimate AD FS services should be limited to specific administrative roles; any deviations may indicate malicious intent.

  - **Identify potential spoofing activity:** Investigate any subsequent sign-in logs for unusual activity or entries that suggest spoofing attempts, especially around the time when new server instances were created. Look for anomalies such as logins from atypical IP addresses or devices.

  - **Analyze historical modifications:** Utilize Azure activity logs to assess historical changes to the AD FS instance. Frequent changes or updates, especially by non-privileged accounts, can indicate attempts to manipulate or disrupt service functionality.

  ### Prioritization

  This alert should be considered medium severity. The impact of a compromised Azure AD AD FS setup is significant, as it can affect access control across multiple services. While the likelihood of malicious abuse may vary, the potential for this method to be weaponized in identity theft and access manipulation makes it a relevant concern for security operations.

  ### Blind Spots and Assumptions

  Detection may be limited by the availability of comprehensive Azure activity logs; missing logs can hinder accurate assessments. Attackers may use legitimate administrative accounts to evade detection, as organizational roles may not accurately reflect actual usage. Additionally, the legitimate addition of AD FS servers to support business operations may trigger this alert without malicious intent. A companion detection could include monitoring abnormal patterns in AD FS signing logs to provide context for suspicious server instances.

