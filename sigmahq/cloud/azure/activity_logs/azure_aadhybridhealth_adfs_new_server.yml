title: Azure Active Directory Hybrid Health AD FS New Server
id: 288a39fc-4914-4831-9ada-270e9dc12cb4
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the creation or update of a server instance in an Azure AD Hybrid health AD FS service.
  A threat actor can create a new AD Health ADFS service and create a fake server instance to spoof AD FS signing logs. There is no need to compromise an on-prem AD FS server.
  This can be done programmatically via HTTP requests to Azure.
references:
- https://o365blog.com/post/hybridhealthagent/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2023-10-11
tags:
- attack.defense-evasion
- attack.t1578
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    CategoryValue: 'Administrative'
    ResourceProviderValue: 'Microsoft.ADHybridHealthService'
    ResourceId|contains: 'AdFederationService'
    OperationNameValue: 'Microsoft.ADHybridHealthService/services/servicemembers/action'
  condition: selection
falsepositives:
- Legitimate AD FS servers added to an AAD Health AD FS service instance
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation or modification of server instances in the Azure AD Hybrid Health AD FS service through Azure Activity Logs (Administrative category). The primary attacker objective is to establish a fraudulent server instance that could potentially spoof AD FS signing logs, thereby avoiding the need to compromise an existing on-premises AD FS server. The relevant MITRE ATT&CK techniques associated with this behavior include Defense Evasion (T1578).

  The primary telemetry source for this detection is Azure Activity Logs, specifically logs categorized under Administrative actions. If malicious, this activity may allow an attacker to manipulate authentication processes or impersonate legitimate users. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate actions may trigger similar alerts.

  ---

  ### Investigation Steps

  - **Review Azure Activity Logs:** Examine the logs for Activity Log entries matching ResourceProviderValue: 'Microsoft.ADHybridHealthService' and OperationNameValue: 'Microsoft.ADHybridHealthService/services/servicemembers/action'. Focus on Event timestamps and actors.

  - **Identify Malicious Indicators:** Look for unusual geographic locations or user accounts that do not typically manage the AD FS service. Check for entries with ResourceId containing 'AdFederationService' that originate from suspicious IPs.

  - **Confirm Legitimate Actions:** Cross-reference with known changes in the environment. Verify if any recent server instance adds were previously approved and align with regular maintenance schedules.

  - **Assess User Roles and Permissions:** Review the permissions of the user accounts that initiated the change. Ensure they have the appropriate roles (e.g., Azure AD administrator) that would justify this activity.

  - **Examine Associated Processes:** Investigate any additional logged activity on the Azure portal, such as related PowerShell commands or API calls that may have preceded the server creation event.

  - **Monitor for Further Activities:** Stay vigilant for subsequent actions by the same identity, especially any that could indicate further attempts to manipulate AD FS or related authentication processes.

  ---

  ### Prioritization

  The alert severity is considered medium due to the potential impact on critical authentication infrastructure and the realistic likelihood of malicious abuse. Given that spoofing AD FS logs directly relates to authentication integrity, this behavior should be treated with caution, although similar patterns can occur during legitimate administrative activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if appropriate Azure Activity Logs are not enabled or configured properly for logging detail. Legitimate administrative tasks, such as adding new servers for redundancy or updates, may trigger the alert. Companion detections such as Azure AD sign-in logs should be monitored for unusual authentication patterns that could indicate further abuse stemming from a manipulated AD FS service.

