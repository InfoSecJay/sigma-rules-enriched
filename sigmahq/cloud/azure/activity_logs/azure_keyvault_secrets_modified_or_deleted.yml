  ---

  ### Technical Context

  This detection rule identifies when secrets in Azure Key Vault are modified or deleted. Such actions could be indicative of malicious activities aimed at compromising sensitive information, altering configurations, or disabling security measures associated with critical credentials. The likely attacker objective here is to disrupt services, exfiltrate sensitive data, or obtain unauthorized access to systems.

  The relevant MITRE ATT&CK tactic is **Impact** (TA0005), specifically the technique **Credential Access: Data from Credential Store** (T1552.001). The primary telemetry source for this rule is the Azure Activity Logs, specifically logging events related to operations on Key Vault secrets. If these actions are unauthorized, the security impact includes potential data breaches, loss of application integrity, or configuration tampering related to sensitive credentials. Importantly, this detection does NOT confirm malicious activity on its own; further investigation is necessary to establish intent and context.

  ---

  ### Investigation Steps

  - **Identify the Activity Context:** Review Azure Activity Logs (Event Type: `MICROSOFT.KEYVAULT/VAULTS/SECRETS`) for associated user identities and timestamps. Determine whether the modifying user has a legitimate role or recent permission changes.

  - **Check for Unusual User Access Patterns:** Cross-reference the user triggering the modification or deletion with access logs. Look for anomalies such as access from unfamiliar IP addresses or devices that do not align with normal user behavior.

  - **Assess the Impact of Changes:** Investigate the specific secrets modified or deleted (log fields: `resourceId`, `operationName`, `status`). Validate whether those secrets were critical for application functionality and whether any known services may be affected.

  - **Confirm Expected Behavior:** Compare the modifications against recent change requests or scheduled maintenance activities. Document whether the actions align with previously communicated changes from legitimate administrators or automated services (e.g., CI/CD systems).

  - **Identify High-Confidence Malicious Indicators:** Look for evidence of the same user or system making multiple rapid modifications/deletions, especially nighttime or unusual hours, which could indicate automation or script-based access rather than manual operations. Draw attention to the presence of suspicious user agents in the logs.

  ---

  ### Prioritization

  This alert holds medium severity within an enterprise context due to the potential impact on key secrets that are fundamental to the security and operation of various services. The likelihood of malicious abuse is concerning, especially if it originates from atypical user behavior or access patterns. Such exploits are not uncommon as credentials can be pivotal for gaining additional access or control within an environment.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the risk of legitimate administrators inadvertently triggering the alert during routine operations, potentially causing false positives. This rule depends on comprehensive Azure Activity Log configurations to capture all relevant events accurately. Legitimate automated system updates, backup processes, or service misconfigurations can also lead to modifications being flagged. Companion detections like unauthorized access to the Azure Key Vault (T1552) or tracking of unusual authentication attempts provide additional context and assist in identifying compromised environments.

