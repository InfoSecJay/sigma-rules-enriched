note: |
  ### Technical Context
  This detection rule identifies unauthorized modifications or deletions of secrets within Azure Key Vaults, a critical component for managing sensitive information such as API keys and credentials. Such actions could indicate a potential security breach, where an attacker aims to disrupt services or exfiltrate sensitive data. The manipulation of secrets can allow unauthorized access to various resources across an organization's cloud environment.

  The relevant MITRE ATT&CK tactics for this detection include **Impact (TA0040)**, as unauthorized alterations to secrets can lead to service degradation or financial loss, and **Credential Access (TA0006)**, since attackers may aim to retrieve sensitive credentials stored in the Key Vault for further exploitation. Specific techniques involved are **T1552 - Unsecured Credentials** and **T1552.001 - Credentials In Files**, which may be applicable when secrets are improperly handled or exposed.

  The primary data source for this detection is **Azure Activity Logs**, which contain records of all operations related to the Azure Key Vault, including any create, update, or delete actions performed on secrets.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Check the Azure Activity logs for any `WRITE`, `DELETE`, or similar operations on Key Vault secrets. Pay particular attention to timestamps and user identities associated with the events.
  - **Analyze User Identity:** Verify the identity of the user who performed the action. Investigate whether the user is authorized to perform operations on the Key Vault and whether they usually access it.
  - **Correlate User Agent and Hostname:** Assess the user agent and hostname to identify any anomalous access patterns, such as requests from unfamiliar geographies or devices that should not have access.
  - **Check for Automation:** Determine if any automated processes or scripts are responsible for modifications. Review documented automation practices to rule out expected behaviors.

  ### Prioritization
  This alert is assigned a medium severity due to the potential impact on the organization; unauthorized changes to secrets can lead to compromised systems and loss of confidential information, especially if exploited by threat actors.

  ### Blind Spots and Assumptions
  There are possible gaps in detection, including scenarios where legitimate administrators perform changes based on routine maintenance. The detection logic assumes that certain modifications are unauthorized unless justified by context. It requires comprehensive logging and auditing of Azure services; if logging is misconfigured or logs are not retained long enough, detection may fail. Additionally, if organizations have multiple Key Vaults with varying access controls, the detection may miss critical events in lesser-monitored vaults.

