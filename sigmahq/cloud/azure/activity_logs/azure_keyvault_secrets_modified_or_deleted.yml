note: |
  ### Technical Context

  This rule detects modifications or deletions of secrets within Azure Key Vault, specifically monitoring operations such as WRITE, DELETE, and UPDATE on secrets. The likely objective of an attacker leveraging these actions is to alter, disable, or remove access to sensitive credentials, which could lead to unauthorized access to systems or data. Relevant MITRE ATT&CK techniques include Credential Access (T1552) and specifically the Use of Credentials (T1552.001).

  The primary telemetry sources are Azure Activity Logs that capture events related to Key Vault operations. If the alert indicates malicious behavior, it could lead to significant security repercussions, potentially compromising the integrity and confidentiality of sensitive data. Notably, this detection does NOT confirm that the activity is malicious; legitimate administration or system maintenance could also trigger such changes.

  ### Investigation Steps

  - **Review Azure Activity Logs:** Check for Event types including `MICROSOFT.KEYVAULT/VAULTS/SECRETS/WRITE` and `MICROSOFT.KEYVAULT/VAULTS/SECRETS/DELETE` within the Azure Activity Log to identify the user, timestamps, and specifics of the operations performed.

  - **Verify user identity and roles:** Cross-reference the user identity against assigned roles in Azure RBAC. Legitimate users with expected administrative privileges may modify secrets, while changes by accounts with no credential access history should trigger further investigation.

  - **Examine user agents and hostnames:** Investigate the IP addresses, user agents, and hostnames associated with the changes. Unexpected or unfamiliar hostnames, particularly from outside the organization’s network, could suggest malicious activity.

  - **Check for recovery and backup operations:** Review for events related to `MICROSOFT.KEYVAULT/VAULTS/SECRETS/BACKUP/ACTION` or `PURGE/ACTION`. Legitimate use of backups or purging may occur, but sudden changes in these areas should be scrutinized for unauthorized actions.

  - **Identify critical assets affected:** Determine if the modified or deleted secrets relate to critical applications or infrastructure; a change to high-impact secrets (e.g., database credentials) indicates an escalated risk level.

  - **Look for frequent modifications:** Analyze the frequency of secret changes over a specific timeframe. Unusually frequent modifications or deletions can indicate automated attacks or scripts used to disrupt operations.

  ### Prioritization

  This alert holds medium severity due to the potential impact on sensitive credential management within Azure. The likelihood of malicious intent is moderate, as such behavior can often indicate reconnaissance or attack preparation. This activity is weaponized in credential harvesting scenarios by attackers.

  ### Blind Spots and Assumptions

  There are limitations in detecting whether secret modifications are benign or malicious. Evasion techniques might include the use of legitimate admin credentials to blend in with typical activity. Reliable detection requires proper logging configurations for Azure Activity Logs. Legitimate system maintenance, especially by system administrators, might trigger this alert without malicious intent. A related detection to consider for enhanced coverage is monitoring for unauthorized Azure role assignments changes.

