  ---

  ### Technical Context

  This rule detects the addition of a user to an administrative role in Azure Active Directory (AD). The likely objective of an attacker would be to escalate privileges for unauthorized access or to perform malicious activities with higher permissions. This behavior relates to the MITRE ATT&CK technique for Privilege Escalation (T1098) and Account Manipulation (T1078). The primary telemetry source involves Azure Activity Logs, specifically events related to role modifications within Azure AD. If malicious, this will enable unauthorized access to sensitive resources, potentially leading to data breaches. However, this detection does NOT confirm malicious intent on its own, as legitimate role changes can occur.

  ---

  ### Investigation Steps

  - **Assess the added user’s context:** Review the Azure AD logs (Event ID: 400) for the affected user. Check if this user has legitimate business needs for elevated privileges or if they are an unusual account lacking prior activity.

  - **Verify the role changes:** Examine the specific Azure Activity Logs for the operation 'Add member to role.' Confirm the timestamp, the user performing the change, and other related properties. Look for any patterns indicative of automation or abuse.

  - **Correlate with legitimate activity:** Check for simultaneous entries showing expected business processes that may have justified the role change, such as a change in job function or departmental shifts. Cross-reference these with HR logs or ticketing systems.

  - **Identify high-confidence indicators:** Look for unusual patterns of role changes, such as changes made by Service Accounts or recurring changes in a short timeframe that align with known attack methods like rapid privilege escalation.

  - **Evaluate potential third-party integrations:** Investigate whether any third-party applications or services are configured to manage Azure AD roles that may lead to legitimate role modifications and potentially create false positives.

  ---

  ### Prioritization

  Alerts generated by this detection are of medium severity, as they involve potential privilege escalation in Azure AD. The impact level is significant due to the critical nature of administrative roles, and while not all role changes are harmful, the likelihood of abuse is prevalent, particularly if linked with suspicious activity.

  ---

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques, such as an attacker manipulating logs or using legitimate identity management features like Privileged Identity Management (PIM), which can create false positives. Required log sources must include comprehensive Azure Activity Logs, and if PIM is in use, it’s crucial to acquire its audit logs. Legitimate activities, such as role changes for newly hired administrators, may trigger the alert. A companion detection to strengthen coverage is monitoring user login behaviors post-role change to catch anomalous access patterns.

