note: |
  ### Technical Context
  This detection rule identifies instances where a user has been added to an Administrator role within Azure Active Directory (AD). Such modifications may indicate unauthorized privilege escalation attempts or misconfigurations in user roles that attackers could exploit. The primary objective of attackers in this scenario is to gain elevated privileges, which would allow further access and manipulation of the Azure environment, potentially compromising resources or data.

  From a threat perspective, this aligns with several MITRE ATT&CK tactics and techniques, including **Initial Access (TA0001)**, **Persistence (TA0003)**, and **Privilege Escalation (TA0004)**. Specifically, techniques such as **T1098.003: Account Manipulation** and **T1078: Valid Accounts** are relevant as attackers may manipulate user accounts to gain administrative control, enabling enduring access to the system.

  The primary data source for this detection is Azure's activity logs, which capture events related to user role assignments and modifications within Azure AD. Monitoring these logs is critical for identifying unauthorized changes that could signify a breach or security misconfiguration.

  ### Investigation Steps
  - **Review Azure Activity Logs:** Examine the Azure activity logs to identify the specifics of the “Add member to role” event, including the user who performed the action, the user added, and the time of the modification.
  - **Audit Role Assignments:** Cross-check the role assignments of the user added to the Administrator role to determine if this user should have such privileges. Identify any preceding events that may indicate suspicious activity leading to this change.
  - **Validate Change Authorization:** Confirm whether the role update was sanctioned through standard operational procedures. This includes reviewing whether the change was initiated through Privileged Identity Management (PIM) or an approved service account.
  - **Correlate with User Activity:** Analyze the activity of the user who was added to the Administrator role and the user who performed the action to identify any abnormal behavior or access patterns that may indicate malicious intent.

  ### Prioritization
  The severity of this alert is medium due to the critical nature of administrative roles within Azure AD. Unauthorized modifications can lead to significant security breaches, making this a concern for any enterprise's cybersecurity posture.

  ### Blind Spots and Assumptions
  This detection may not account for legitimate changes made via Privileged Identity Management (PIM), which could generate similar events in the logs. Additionally, the detection assumes that Azure activity logs are being properly monitored and retained. The functionality of this rule relies on accurate logging configurations and real-time monitoring of role management actions within Azure AD. Potential gaps in detection may arise if there is insufficient logging of related activities or if changes are made through APIs or automation tools that bypass standard logging.

