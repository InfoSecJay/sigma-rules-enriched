note: |
  ### Technical Context

  This rule detects the addition of a user to an administrator role within Azure Active Directory (Azure AD). The likely attacker objective is to gain elevated permissions that allow broader access to sensitive resources or the ability to manipulate the Azure environment. This aligns with the MITRE ATT&CK tactics of Privilege Escalation (TA0004) and Persistence (TA0003), specifically techniques T1098.003 (Account Manipulation) and T1078 (Valid Accounts).

  The primary telemetry source is the Azure Activity Logs, specifically focusing on entries where the operation is "Add member to role." The potential security impact is significant; if malicious, it could lead to unauthorized access and manipulation of critical cloud assets. This detection does NOT confirm malicious intent on its own, as legitimate role changes, such as through Privileged Identity Management (PIM), can also trigger this alert.

  ### Investigation Steps

  - **Review audit logs for the role change:** Check Azure Activity Logs for the Operation field set to "Add member to role" (Event ID not specified) and specifically look for modified properties with NewValue ending in 'Admins' or 'Administrator'.

  - **Validate user's historical activity:** Investigate the Azure AD sign-in logs (SignIns OAuth API) to determine if the user has a history of legitimate administrative actions prior to this event; look for atypical logins or locations.

  - **Identify potential rogue accounts:** Search for unusual user accounts or previously inactive accounts that were recently added to administrator roles; correlate their creation dates and access patterns.

  - **Assess legitimate use of PIM:** If applicable, verify if the user was enabled through Privileged Identity Management by checking state changes in Azure AD roles and reviewing the associated timestamps and user notifications.

  - **Check for related anomalous changes:** Look for other role changes, such as removals or assignments of high privileges to multiple users, within the same timeframe; this could indicate a coordinated attack.

  - **Gather contextual data on the affected system:** Review any previous alerts or incidents related to this user or role. High asset criticality or privileged account information may indicate a more severe threat posture.

  ### Prioritization

  The alert is of medium severity due to the potential impact of unauthorized access to critical cloud resources, combined with a moderate likelihood of malicious abuse, particularly in organizations with robust cloud infrastructures. Privileged accounts are often target candidates for various attack vectors, making this behavior noteworthy.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate activities such as PIM role activations, which could trigger false positives. Reliable detection requires configuration of Azure Activity Logs with adequate retention and collection of sign-in data. Additionally, benign activities could include routine admin changes or emergency role escalations. A related detection could involve monitoring for unusual authentication patterns with elevated privileges, strengthening overall visibility into potential insider threats.

