  ---

  ### Technical Context

  This Sigma rule detects when a user is added to an administrator role in Azure Active Directory (Azure AD), specifically targeting events where the operation is "Add member to role" and the modified property indicates an elevation to an admin-level position. The likely objective of an attacker in this case would be to gain unauthorized administrative privileges, allowing them to manipulate resources, access secrets, or escalate their control within the cloud environment. The relevant MITRE ATT&CK techniques are "Privilege Escalation" (T1068) and "Valid Accounts" (T1078).

  The primary telemetry source for this detection is Azure Activity Logs, which capture changes made in the Azure AD system, particularly through operations indicating role modifications. If malicious, this impact can result in severe data exposure, loss of integrity, or wide-ranging control over the cloud environment. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate processes like Privileged Identity Management (PIM) may trigger this event.

  ---

  ### Investigation Steps

  - **Check Azure Activity Logs for the event:** Review the Azure Activity Logs for Event ID related to role modification events. Focus on entries with `Operation: 'Add member to role'` and check the `ModifiedProperties[].NewValue` to confirm if the role includes 'Admins' or 'Administrator'.

  - **Identify recent user behavior:** Validate whether the user added to the admin role had any previous suspicious activity or requests in Azure logs. Look for unusual patterns or logins from new locations (Azure AD Sign-ins) that could indicate compromise.

  - **Verify PIM usage:** Assess if the change aligns with PIM usage by reviewing the Azure AD sign-in history and event logs around the same time frame. Legitimate role elevation may correlate with eligible users administratively activating their roles.

  - **Examine associated user roles:** Cross-check the targeted user account against your organization's user role policies. Determine if there were prior indications of changing roles that align with expected administrative workflows.

  - **Look for additional privilege escalation events:** Investigate related events in Azure logs to see if this addition was followed by other actions that suggest privilege escalation or misuse, such as accessing sensitive resources.

  - **Check the context of the operation:** Review any contextual information within Azure logs, such as the IP address or device type involved in the role addition. Any anomalies here could indicate malicious intent.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for severe impacts; gaining admin access compromises system integrity and can lead to further breaches. The likelihood of malicious abuse is notable, particularly in contexts where privileged accounts are targeted and weaponized for lateral movement or data theft.

  ---

  ### Blind Spots and Assumptions

  This detection can be evaded through techniques like API abuse or through legitimate admin activity, such as PIM, which can generate similar logs. Ensure that Azure Activity Logs are properly configured for comprehensive tracking of role changes. Legitimate administrative actions may concurrently trigger this alert, complicating incident analysis. A related detection to consider includes monitoring for anomalous Azure AD sign-in patterns after such role changes to strengthen overall security visibility.

