title: Azure Active Directory Hybrid Health AD FS Service Delete
id: 48739819-8230-4ee3-a8ea-e0289d1fb0ff
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the deletion of an Azure AD Hybrid health AD FS service instance in a tenant.
  A threat actor can create a new AD Health ADFS service and create a fake server to spoof AD FS signing logs.
  The health AD FS service can then be deleted after it is not longer needed via HTTP requests to Azure.
references:
- https://web.archive.org/web/20220619212736/https://o365blog.com/post/hybridhealthagent/
- https://aadinternals.com/talks/HelSec%20August%202021.pdf
- https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/identity#microsoftadhybridhealthservice
- https://www.inversecos.com/2023/01/detecting-fake-events-in-azure-sign-in.html
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2026-10-21
tags:
- attack.defense-impairment
- attack.t1578.003
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    category: 'Administrative'
    resourceId|contains: 'AdFederationService'
    operationName: 'MICROSOFT.ADHYBRIDHEALTHSERVICE/SERVICES/DELETE'
  condition: selection
falsepositives:
- Legitimate AAD Health AD FS service instances being deleted in a tenant
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of an Azure AD Hybrid Health AD FS service instance through Azure Activity Logs. Such a deletion may be indicative of an adversary's intention to obscure their tracks after creating a rogue service, which could lead to the manipulation or spoofing of AD FS signing logs to conduct further attacks. This behavior aligns with the MITRE ATT&CK tactic of **Defense Impairment** (TA0020) and the technique of **Impair Defenses: Application Layer** (T1578.003). The primary telemetry source is Azure Activity Logs, specifically focusing on administrative actions involving the Hybrid Health service. If this deletion is indeed malicious, it may severely compromise the integrity of authentication logs, enabling further exploitation or undetected access to the environment. However, this detection does NOT confirm that all deletions are malicious, as legitimate service instances may also be removed as part of regular operational procedures.

  ### Investigation Steps

  - **Check Azure Activity Logs:** Review Azure Activity Logs (Event ID equivalent) for records of the deletion event with `operationName: 'MICROSOFT.ADHYBRIDHEALTHSERVICE/SERVICES/DELETE'` filtered by the relevant timestamps indicating the alert. Identify any instances of suspicious user accounts engaging in this action.

  - **Identify User Context:** Investigate the `initiatedBy` field within the Azure Activity Logs to determine the account used for the deletion. Look for accounts with administrative privileges that do not commonly perform this action, indicating potential misuse.

  - **Correlate with Service Creation Events:** Look for corresponding service creation entries in the Azure Activity Logs to establish a timeline. Recent creation followed by deletion could suggest malicious intent, especially if an unexpected or unauthorized account created the service.

  - **Review Role and Permissions:** Examine the Azure Active Directory roles and permissions for the user account associated with the deletion event to ensure they align with expected operational patterns. Compare against legitimate admin accounts responsible for managing Hybrid Health services.

  - **Identify Legitimate Behavior Patterns:** Determine the regular lifecycle of AD FS service instances in your enterprise by consulting operational logs or documentation. Legitimate deletion events should occur within standard maintenance windows and involve known service accounts that regularly manage these resources.

  - **Monitor for Subsequent Suspicious Activity:** Check for any API calls to Azure AD or AD FS post-deletion that appear abnormal, particularly those requesting login or authentication logs, which could indicate attempts to leverage a maliciously created service.

  ### Prioritization

  This alert has medium severity. The affected systems are critical for authentication processes, and the likelihood of malicious abuse is considerable, especially if the deletion is linked to unauthorized user accounts. While this action may not be frequently weaponized in isolation, it could be part of a broader attack strategy involving impersonation or credential theft.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations for Azure services or filtering that excludes administrative actions. Legitimate activities, such as routine service management by trusted admins, could inadvertently trigger this alert. Additionally, it is important to correlate with other detections, such as monitoring unauthorized modifications to Azure AD roles, to strengthen coverage against potential attack patterns.

