title: Azure Active Directory Hybrid Health AD FS Service Delete
id: 48739819-8230-4ee3-a8ea-e0289d1fb0ff
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the deletion of an Azure AD Hybrid health AD FS service instance in a tenant.
  A threat actor can create a new AD Health ADFS service and create a fake server to spoof AD FS signing logs.
  The health AD FS service can then be deleted after it is not longer needed via HTTP requests to Azure.
references:
- https://o365blog.com/post/hybridhealthagent/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2023-10-11
tags:
- attack.defense-impairment
- attack.t1578.003
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    CategoryValue: 'Administrative'
    ResourceProviderValue: 'Microsoft.ADHybridHealthService'
    ResourceId|contains: 'AdFederationService'
    OperationNameValue: 'Microsoft.ADHybridHealthService/services/delete'
  condition: selection
falsepositives:
- Legitimate AAD Health AD FS service instances being deleted in a tenant
level: medium
note: |
  ### Technical Context

  This detection rule identifies the deletion of an Azure AD Hybrid Health AD FS service instance through Azure Activity logs. This behavior may indicate a malicious actor attempting to remove a compromised service that they previously established to spoof authentication logs. The attacker objective would typically involve manipulating authentication mechanisms to conduct unauthorized access or maintain stealth by eliminating evidence of their activities.

  The relevant MITRE ATT&CK tactic is **Defense Impairment (T1578)**, specifically the technique of **Application Layer Protocol Manipulation (T1578.003)**. The primary telemetry source is Azure Activity logs, particularly involving administrative actions. If this action is malicious, it can severely impact identity management, leading to unauthorized access or impersonation of legitimate users. However, this detection does NOT confirm that the deletion was malicious without additional corroborating evidence.

  ### Investigation Steps

  - **Review Azure Activity Logs: ** Examine logs for Event ID related to the operation `Microsoft.ADHybridHealthService/services/delete`. Look for the initiating user, timestamp, and associated resource details to identify if it aligns with expected administrative actions.

  - **Validate User Context:** Check the user who executed the deletion against known administrative accounts. Legitimate deletions are typically performed by authorized accounts during scheduled maintenance or service updates.

  - **Monitor Service Recreation:** Investigate whether a new AD FS service has been created shortly after deletion. Creation events should show a connection to potentially malicious infrastructure such as IPs or domains outside normal operational parameters.

  - **Identify Related Unique Resource Attributes:** Examine any log properties such as `ResourceId` or `ResourceProviderValue` for unusual patterns or discrepancies indicative of abnormal activity.

  - **Cross-reference with User Behavior Analytics:** Utilize security tools to assess if the activity fits within the normal behavior profile of the user or service account involved. Sudden changes in service management patterns may signal malicious intent.

  - **Check for Subsequent Authentication Failures:** Review authentication logs (e.g., Azure AD sign-in logs) for anomalies following the deletion that could indicate attempts to exploit the deletion of the AD FS service.

  ### Prioritization

  The severity of this alert is medium given that it points to potential identity security risks. If an AD FS service instance is maliciously deleted, it could enable significant unauthorized access if not controlled, but such actions are less commonly weaponized compared to direct credential theft techniques.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative activities triggering the alert, which are often common in routine maintenance. Log sources must be consistently configured to capture comprehensive Azure activity logs. Related detections might include monitoring for `ADHybridHealthService/service/create` events to identify the creation of potentially unauthorized services, strengthening overall coverage against this vector.

