title: Azure Active Directory Hybrid Health AD FS Service Delete
id: 48739819-8230-4ee3-a8ea-e0289d1fb0ff
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the deletion of an Azure AD Hybrid health AD FS service instance in a tenant.
  A threat actor can create a new AD Health ADFS service and create a fake server to spoof AD FS signing logs.
  The health AD FS service can then be deleted after it is not longer needed via HTTP requests to Azure.
references:
- https://o365blog.com/post/hybridhealthagent/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2023-10-11
tags:
- attack.defense-evasion
- attack.t1578.003
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    CategoryValue: 'Administrative'
    ResourceProviderValue: 'Microsoft.ADHybridHealthService'
    ResourceId|contains: 'AdFederationService'
    OperationNameValue: 'Microsoft.ADHybridHealthService/services/delete'
  condition: selection
falsepositives:
- Legitimate AAD Health AD FS service instances being deleted in a tenant
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of an Azure AD Hybrid health AD FS service instance via Azure activity logs. Attackers may create a malicious AD FS service to manipulate authentication logs, providing false indicators of compromise and misdirection during investigations. The primary relevant MITRE ATT&CK tactic is **Defense Evasion** and the technique is **Impair Defenses: Resource Hijacking (T1578.003)**.

  Primary telemetry sources include Azure Activity Logs, specifically focusing on administrative actions related to the 'Microsoft.ADHybridHealthService' resource type. If successful, this activity can lead to unauthorized access or manipulation of authentication processes. This detection alone does not confirm that a deletion was malicious; legitimate administrative actions can also trigger this alert.

  ### Investigation Steps

  - **Review the deletion event details**: Look for Azure activity logs (Event Type: Administrative) and check for OperationName `Microsoft.ADHybridHealthService/services/delete` and ResourceId containing `AdFederationService`. Compare the timestamp against scheduled maintenance windows or known changes.

  - **Analyze user account activity**: Check for associated Azure Active Directory sign-ins (Logs: SignIns) where the initiating user performed the delete operation. A suspicious or unfamiliar user account could indicate a threat actor is performing malicious activities.

  - **Identify legitimate service instances**: Confirm if the AD FS service instance was actively used or was a part of a legitimate service stack by cross-referencing other Azure logs (e.g., Health check logs, Service instance status) to determine normal operating parameters.

  - **Assess for high-confidence indicators**: Look for unusual patterns such as multiple delete operations in a short time frame or service creations following deletions that point towards a potential attack. Benign actions involve single deletions during expected timeframes.

  - **Validate against existing logging policies**: Ensure that proper logging levels are set for Azure activity logs. Without comprehensive logging capabilities, detection of similar unauthorized deletions may be obscured.

  ### Prioritization

  This alert should be treated with medium severity as it indicates potential defense evasion tactics that may lead to unauthorized modifications to the authentication framework. The risk increases if the target system handles critical identity services, making it a stakeholder in high-value attack surfaces. Such behavior is less common due to the administrative overhead, but when weaponized, it can significantly impact security posture.

  ### Blind Spots and Assumptions

  This detection may miss legitimate deletions of AD FS services initiated by authorized personnel, posing a challenge in distinguishing malicious activities from standard operational procedures. Additionally, if activity logs are not configured properly, the deletion actions might go undetected. Related alerts such as unauthorized creation of similar AD FS services (detected through the same telemetry) can provide stronger coverage against malicious activity.

