title: Azure Active Directory Hybrid Health AD FS Service Delete
id: 48739819-8230-4ee3-a8ea-e0289d1fb0ff
status: test
description: |
  This detection uses azureactivity logs (Administrative category) to identify the deletion of an Azure AD Hybrid health AD FS service instance in a tenant.
  A threat actor can create a new AD Health ADFS service and create a fake server to spoof AD FS signing logs.
  The health AD FS service can then be deleted after it is not longer needed via HTTP requests to Azure.
references:
- https://o365blog.com/post/hybridhealthagent/
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-08-26
modified: 2023-10-11
tags:
- attack.defense-evasion
- attack.t1578.003
logsource:
  product: azure
  service: activitylogs
detection:
  selection:
    CategoryValue: 'Administrative'
    ResourceProviderValue: 'Microsoft.ADHybridHealthService'
    ResourceId|contains: 'AdFederationService'
    OperationNameValue: 'Microsoft.ADHybridHealthService/services/delete'
  condition: selection
falsepositives:
- Legitimate AAD Health AD FS service instances being deleted in a tenant
level: medium
note: |
  ### Technical Context
  This detection rule identifies the deletion of an Azure AD Hybrid health Active Directory Federation Services (AD FS) instance within a tenant. By monitoring administrative activity logs, the rule aims to capture potentially malicious actions by threat actors intending to disable or manipulate AD FS components. The AD FS service is critical for authentication in hybrid environments, and its tampering could signify an attempt at undermining user identity management or disrupting federated authentication services, possibly for further unauthorized access or persistence.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (TA0005): The attacker may seek to establish control over the environment by deleting crucial services, thereby hiding their tracks.
  - **Impair Process Control** (T1578.003): Deleting an AD FS service can disrupt normal authentication workflows, which is a means to impair process control.

  The primary data sources for effective detection are Azure activity logs, specifically looking at administrative actions related to the AD Hybrid Health service. This provides visibility into actions taken by administrators or attackers within the Azure cloud environment.

  ### Investigation Steps
  - **Review Azure Activity Logs**: Examine the Azure activity logs for entries regarding the deletion of the AD FS service, paying attention to timestamps and associated user accounts.
  - **Analyze User Activity**: Identify any suspicious user accounts that executed the deletion or created AD FS instances, particularly those not typically associated with such administrative tasks.
  - **Correlate with Network Traffic**: If possible, monitor outbound traffic from the Azure environment for unusual HTTP requests made around the time of the deletion, indicating attempts to interact with external systems for nefarious purposes.
  - **Investigate Service Creation Events**: Look for logs indicating the creation of new AD FS services prior to deletion, which might suggest preparation for a spoofing attack.

  ### Prioritization
  This alert is rated medium severity due to the potential impact on user authentication and the likelihood that an attacker could exploit changes to authentication mechanisms, possibly bypassing security controls.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise from legitimate administrative actions that can mimic attack behavior, such as routine service deletions by authorized personnel. The detection logic assumes that logs detailing Azure AD health service activities are enabled and properly collected. Additionally, if the AD FS service was previously created through unauthorized means, the deletion event might not be tracked effectively without comprehensive logging configurations in place.

