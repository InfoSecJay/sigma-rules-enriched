note: |
  ### Technical Context

  This rule detects failed sign-in attempts that are blocked due to unmet Conditional Access (CA) policies in Azure. The behavior indicates potential unauthorized access attempts, where an attacker seeks to bypass security mechanisms to gain access to sensitive resources or accounts. The likely objective is credential access (MITRE ATT&CK ID: T1078.004 - Valid Accounts) or initial access (T1190 - Exploit Public-Facing Application).

  The primary telemetry source for this detection is Azure sign-in logs, specifically events indicating blocked access due to Conditional Access failures (ResultType: 53003). If malicious, this activity can result in compromised accounts and unauthorized access to critical services or data. However, this detection does NOT confirm an actual compromise; legitimate users may trigger these alerts due to misconfigurations or incorrect credentials.

  ### Investigation Steps

  - **Review sign-in logs for event details:** Check Azure Sign-in logs for ResultType 53003. Useful fields include UserPrincipalName, IP address, and Conditional Access policy involved. Analyze whether the IP address belongs to a known user location.

  - **Identify patterns of failures:** Look for multiple consecutive sign-in failures by the same account or from the same IP address. Track the time frame and compare against typical user log-in behavior.

  - **Verify Conditional Access policies:** Evaluate the Conditional Access policies that are in effect by referencing the affected account. Ensure that the configurations align with organizational policy and that the account is intended to bypass existing restrictions.

  - **Cross-reference service account activity:** Determine if the account involved is a service account. Review its configurations for possible mismanagement that may lead to legitimate failures rather than an attack attempt.

  - **Assess surrounding activity:** Examine other security logs (e.g., Azure AD audit logs, firewall logs) for related activities, such as successful logins post-failure or unusual account usage patterns that could indicate an attacker trying to use stolen credentials.

  ### Prioritization

  This alert should be classified as high severity due to the potential impact on sensitive systems and the likelihood that unresolved access issues may indicate active attempts by adversaries to exploit user accounts. Since incorrect configuration can commonly lead to benign alerts, this requires contextual investigation to confirm malicious intent.

  ### Blind Spots and Assumptions

  Evasion techniques may include attackers disguising their IP addresses or using legitimate credentials to evade detection. Reliable detection relies on properly configured Azure sign-in logs; ensure that these logs are enabled and retained as per compliance guidelines. Legitimate activities such as VPN connections or significant infrastructure changes can result in similar alerts. A companion detection to strengthen monitoring would be monitoring for successful logins following these failure events, which could indicate brute force or credential stuffing attempts.

