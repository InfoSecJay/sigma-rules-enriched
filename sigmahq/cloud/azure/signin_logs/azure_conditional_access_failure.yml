note: |
  ### Technical Context

  This Sigma rule detects failed sign-in attempts that are blocked by Conditional Access policies in Azure Active Directory (AAD). Attackers may aim to bypass security controls enforcing multi-factor authentication or other access conditions, potentially to gain unauthorized access to sensitive resources. The relevant MITRE ATT&CK tactic is **Credential Access** (TA0006), specifically technique **Valid Accounts** (T1078.004) as well as **Phishing** (T1110). The primary telemetry source is Azure Sign-in logs, specifically targeting ResultType 53003 which indicates failures due to conditional access enforcement.

  If exploited, a successful bypass of these controls could lead to unauthorized access to sensitive data or systems. However, this detection does not confirm that an actual attack is taking place; it only indicates that access conditions were not met. Multiple legitimate reasons could trigger this alert.

  ### Investigation Steps

  - **Review sign-in logs:** Check Azure Sign-in logs for events with ResultType 53003. Analyze timestamps, source IP addresses, and user accounts to validate if the sign-in attempts conform to expected behavior for those accounts.

  - **Correlate with user activity:** Investigate if the affected users have recent activities or changes that align with Conditional Access policy requirements. Look for legitimate IP ranges and times for user access; expected logins should match regular work hours.

  - **Identify high-risk indicators:** Look for repeated sign-in failures from the same IP address or user account over a short time frame, indicating a potential brute-force attack. Note if IPs are from known TOR exit nodes or sources associated with malicious activity.

  - **Evaluate legitimate service accounts:** Ensure that legitimate service accounts are not misconfigured, resulting in sign-in failures. Review the configuration of these accounts to ascertain compliance with Conditional Access policies.

  - **Analyze for misconfigured devices or services:** Investigate whether any services or devices were recently misconfigured or patched, resulting in unexpected access attempts. Ensure that these have properly updated configurations to adhere to Conditional Access requirements.

  ### Prioritization

  This alert warrants high severity due to the potential impact on sensitive systems and data access. The likelihood of malicious abuse is elevated as attackers often target conditional access controls. Such behavior is frequently weaponized in attempts to compromise accounts for lateral movement or data exfiltration.

  ### Blind Spots and Assumptions

  Detection is limited by possible misconfigurations in Conditional Access policies, which could lead to false positives. Legitimate scenarios, such as service account misconfiguration or temporary user issues, can also trigger this alert. Ensure the logging for Azure Sign-in events is enabled and properly configured to capture relevant telemetry. Related detections may involve monitoring for successful sign-ins following multiple failures or tracking unusual authentication attempts from atypical locations, further strengthening incident response.

