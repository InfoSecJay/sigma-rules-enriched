note: |
  ### Technical Context

  This Sigma rule detects a measurable increase (10% or greater) in successful authentications within a specified timeframe from Azure sign-in logs. Such behavior may indicate a potential credential stuffing attack, where attackers automate third-party credential use to gain unauthorized access to user accounts. This aligns with the MITRE ATT&CK tactic for Credential Access (TA0006), specifically the technique of Valid Accounts (T1078).

  The primary telemetry sources for this detection are Azure Sign-in Logs, capturing authentication success statuses. If the detected behavior is malicious, it can lead to unauthorized access and lateral movement within an organization, compromising sensitive data and resources. However, this detection does NOT confirm that malicious activity occurred; it merely indicates unusual authentication patterns that require further investigation.

  ### Investigation Steps

  - **Review successful sign-in patterns**: Analyze the Azure sign-in logs (event type: Success) for the affected user accounts within the specified timeframe to determine normal authentication trends and identify deviations.

  - **Check for anomalous geographic locations**: Examine the `Location` field in the sign-in logs for any sign-ins from unusual or multiple geographic locations that do not match the expected user behavior or known resources (`ClientIP` field).

  - **Verify user activity**: Assess legitimate user behavior by checking recent user activities in Microsoft 365, such as document access or application usage, to determine if there were corresponding legitimate actions that justify the sign-ins.

  - **Identify common account usage patterns**: Query Azure AD audit logs for the impacted user to see if there have been recent changes in permissions or roles that correlate with the increase in authentications.

  - **Alert on high-confidence anomalies**: Highlight accounts with a significant deviation in successful authentications (10% or greater) compared to the historical average over the preceding month, as these may indicate credential abuse attempts.

  ### Prioritization

  The severity of this alert is low but should not be overlooked, as the affected systems may be critical for user access. The likelihood of malicious behavior remains plausible, especially if the increase is associated with unrecognized IP addresses or suspicious locations. Moreover, this behavior can often be weaponized in ongoing attack campaigns.

  ### Blind Spots and Assumptions

  This detection may be evaded through techniques like IP whitelisting or using legitimate credentials for multiple sign-ins, potentially leading to false positives in high-activity environments. Additionally, the source logs must be properly configured to ensure comprehensive monitoring of Azure Sign-in logs. Legitimate increases, such as influxes of new users or recent changes in organizational structure, could also trigger alerts. Related detections, such as monitoring for unusual patterns of failed authentications (TSA0050), can enhance overall coverage.

