note: |
  ### Technical Context

  This Sigma rule detects a significant increase of 10% or greater in successful sign-ins across the environment, indicating potential account compromise or misuse of credentials. Attackers may aim to gain unauthorized access, escalate privileges, or leverage accounts for lateral movement. This behavior fits within the **Initial Access (TA0001)** and **Persistence (TA0003)** tactics, specifically utilizing the **Valid Accounts (T1078)** technique. The primary telemetry source is Azure Sign-in logs, which capture all attempted access and their outcomes (Success/Failure). If malicious, this activity could lead to unauthorized data access or compromise of critical systems. However, this detection does NOT confirm if the access was malicious on its own, as increased sign-ins could also be attributable to legitimate user behavior.

  ### Investigation Steps

  - **Review Azure Sign-in Logs for relevant Event IDs**: Specifically, examine Azure Sign-in logs (Event ID 4624) to track sign-in events and identify source IP addresses, user agents, and applications used for access.

  - **Correlate sign-in behavior with recent changes**: Assess whether there has been an increase in legitimate users, new employee onboarding, or changes in remote work policies that could explain increased sign-ins.

  - **Identify indicators of potentially malicious sign-ins**: Look for failed sign-in attempts (Event ID 4625) prior to the successful authentications that could indicate credential stuffing or brute-force attacks.

  - **Analyze user behavior and access patterns**: Check for anomalies in the context of user roles; significant shifts in access patterns (e.g., administrative access from non-admin accounts) could signify malicious intent.

  - **Investigate concurrent or unusual geographical location sign-ins**: Review the originating IP addresses for successful sign-ins; sign-ins from locations inconsistent with user profiles could indicate credential theft.

  - **Document expected legitimate behaviors**: Establish a baseline of normal sign-in activities for specific users or roles to distinguish between legitimate spikes in authentications versus potentially malicious ones.

  ### Prioritization

  This alert bears low severity as it may stem from benign activities like increased user onboarding or policy changes. However, the likelihood of account compromise is non-negligible, and given that account misuse is a common tactic among adversaries, prompt investigation is advised.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of legitimate credentials, complicating attribution of the sign-ins as malicious. The reliability of the detection hinges on having comprehensive Azure sign-in logs available. Legitimate activities like account sharing or external business engagements may trigger this alert. A related detection to consider is tracking anomalous sign-in geolocations alongside user sign-in patterns to enhance investigation accuracy.

