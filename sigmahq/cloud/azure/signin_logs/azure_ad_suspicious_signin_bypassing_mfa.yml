note: |
  ### Technical Context

  This Sigma rule detects successful authentication attempts exhibiting legacy client characteristics through specific user agent strings (e.g., 'BAV2ROPC', 'CBAinPROD'). Such behavior is typically associated with potential bypass of Multi-Factor Authentication (MFA), suggesting that attackers may exploit accepted legacy clients to execute a password spray attack. This detection aligns with the MITRE ATT&CK tactic of **Credential Access** (ID: T1078.004) and **Initial Access** (ID: T1110).

  The primary telemetry source is Azure Sign-in Logs, specifically monitoring authentication events with a focus on user agent strings indicative of outdated clients. If successful authentication via these legacy clients occurs, the risk is heightened that an attacker has gained unauthorized access to user accounts, bypassing modern MFA protections. Importantly, this detection does NOT confirm malicious behavior on its own, as legitimate users with legacy accounts may occasionally log in with these clients.

  ### Investigation Steps

  - **Verify user account status:** Check if the account involved in the alert is a known legacy account. Legitimate legacy users might include established service accounts or outdated client configurations.

  - **Examine sign-in logs:** Review Azure Sign-in Logs (Event ID 4624) for the user account. Look for additional attributes like `ipAddress`, `location`, or `clientAppUsed` that could help identify suspicious sign-ins.

  - **Correlate with user behavior:** Identify recent login patterns for the user through the Azure AD audit logs. Compare current activity against historical login behavior to assess if the authentication attempt is anomalous.

  - **Identify malicious indicators:** Check for multiple failed authentication attempts followed by the successful legacy login. Events with a high number of failures preceding a legacy authentication (potentially indicating a password spray attack) are strong indicators of malicious activity.

  - **Review MFA configurations:** Ensure that current MFA policies are in place for the affected user on the application level. Determine whether any recent changes to the MFA configuration might have caused a legitimate lapse.

  ### Prioritization

  This alert is high severity due to the potential for significant unauthorized access to critical systems if successful login via legacy clients is confirmed. The likelihood of malicious abuse is elevated, particularly if the behavior is linked to password spraying techniques, which are regularly weaponized in attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging for legacy client activity; if not all attempts are logged in Azure Sign-in Logs, insights could be missed. Additionally, legitimate users accessing legacy systems may trigger this alert unintentionally. A related detection of **Unsuccessful logins followed by a successful login** from the same IP could strengthen coverage and provide enhanced insights into potential attacks using legacy authentication methods.

