logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Status: 'Success'
    userAgent|contains:
    - 'BAV2ROPC'
    - 'CBAinPROD'
    - 'CBAinTAR'
  condition: selection
falsepositives:
- Known Legacy Accounts
level: high
note: |
  ### Technical Context

  The rule detects successful authentication attempts using legacy authentication clients, indicated by specific user-agent strings related to known legacy protocols. This behavior may signal a potential MFA (Multi-Factor Authentication) bypass, particularly if used in conjunction with a password spray attack. The likely attacker objective is to gain unauthorized access to accounts with minimal resistance, exploiting an outdated authentication mechanism to bypass modern security measures.

  Relevant MITRE ATT&CK tactics include Credential Access (T1078.004) and Initial Access (T1110). The primary telemetry sources include Azure sign-in logs, focusing on fields such as `Status` and `userAgent`. If malicious, the security impact can lead to unauthorized access, potential data exfiltration, and internal compromise. However, successful authentication via these legacy clients does NOT alone confirm that a breach has occurred; further investigation is needed to understand the context of the authentication.

  ### Investigation Steps

  - **Review authentication details:** Cross-reference the Azure sign-in log Event IDs for the specified user agent (e.g., `BAV2ROPC`, `CBAinPROD`, `CBAinTAR`) and check `Status` for successful authentications. Determine if the accounts involved are known legacy accounts based on user behavior.

  - **Analyze user activity prior to login:** Investigate Azure sign-in logs (`signInLogs`) for the user in question, looking for any unusual login attempts from atypical geolocations or times, indicating potential malicious activities, especially if there's a pattern of multiple failed logins followed by successful authentication.

  - **Identify associated alerts:** Check for related alerts or detection indicators that may coincide with the legacy authentication event, such as multiple unsuccessful sign-in attempts (Event ID: 4625), which could indicate preparation for a password spray attack.

  - **Assess impact of affected account:** Determine the criticality of the account involved in the successful logins. Accounts with elevated permissions or access to sensitive data increase the urgency of triggering alerts for potential malicious activity.

  - **Validate recent security updates:** Confirm if there were recent notifications about password spray attacks or security advisories related to the legacy authentication implementations. This can include checking communications from the security team regarding ongoing threat intelligence for your environment.

  - **Identify legitimate usage patterns:** Analyze historical login patterns for the user to establish a baseline for typical authentication methods. A spike in legacy authentication might signify unjustified account access that deviates from prior behaviors.

  ### Prioritization

  This alert is high priority due to the potential impact on sensitive systems and the ease of exploitation of legacy authentication methods. The likelihood of malicious abuse is high, particularly if legacy clients are not accounted for in the organization's authentication policy, making them a common target for attackers.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate applications or processes may utilize legacy authentication, hence triggering this alert. Reliable detection requires comprehensive logging from Azure and enforcement of MFA for all accounts. Awareness of legitimate user behavior changes is critical, as users may occasionally have legitimate reasons to use legacy clients. Related detections to reinforce coverage can include abnormal authentication patterns or simultaneous logins from geographically disparate locations.

