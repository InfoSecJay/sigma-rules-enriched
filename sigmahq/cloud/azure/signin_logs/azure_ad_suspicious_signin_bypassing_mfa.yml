note: |
  ### Technical Context
  This detection rule identifies successful authentication attempts using legacy client authentication methods, indicated by specific user agent strings. The likely intent behind such behavior could be an attacker attempting to bypass multi-factor authentication (MFA) protections, potentially through strategy such as password spraying against legitimate accounts. By leveraging the inherent weaknesses of legacy authentication mechanisms, attackers may exploit user accounts that have been configured to allow such methods, increasing the chances of gaining unauthorized access.

  The relevant MITRE ATT&CK tactics for this rule are:
  - **Initial Access (TA0001)**: Attackers often seek initial access to systems, and bypassing MFA can significantly ease this task.
  - **Credential Access (TA0006)**: This technique includes methods of obtaining valid credentials, such as through password spraying attacks, which the detected behavior may indicate.
  - **Privilege Escalation (TA0004)** and **Persistence (TA0003)**: If adversaries gain access using valid credentials, they may elevate privileges or establish ongoing access methods.

  The primary data sources for the detection comprise Azure Sign-in logs, specifically focusing on user agent strings of incoming authentication requests.

  ### Investigation Steps
  - **Review Azure Sign-in Logs**: Examine the Azure Sign-in logs for any entries that match the suspicious user agent strings and have a status of success. Pay attention to the timestamps and count of successful attempts.
  - **Identify Account Context**: Determine whether the accounts utilized in these authentication attempts are known legacy accounts. Investigate the properties and configurations of these accounts to confirm their authentication settings.
  - **Monitor for Anomalous Activity**: Cross-reference the accounts identified against typical usage patterns in the environment. Look for signs of unusual access patterns, such as logins from unusual geographical locations or at odd hours.
  - **Check Multi-Factor Authentication Settings**: Verify the MFA configurations on the accounts of concern. Identify if any accounts device exceptions were involved and whether the legacy authentication methods were intended or aligned with security policies.

  ### Prioritization
  This alert is marked as high severity due to the significant risk posed by successful legacy authentication attempts, which can indicate an ongoing attempt to exploit vulnerabilities in security controls that could lead to unauthorized access to sensitive resources.

  ### Blind Spots and Assumptions
  The detection coverage may have gaps concerning accounts that are not properly documented or that have not implemented modern security measures like MFA. There is an assumption that the relevant user agent strings correlate directly with potential MFA bypass attempts. Additionally, accurate logging and monitoring configurations in Azure are required for this alert to function effectively. If legacy authentication methods are disabled or not in use, any associated logging may be insufficient or absent, leading to undetected incidents.

