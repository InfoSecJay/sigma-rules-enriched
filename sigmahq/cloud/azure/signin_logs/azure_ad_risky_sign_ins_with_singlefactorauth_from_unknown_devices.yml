note: |
  ### Technical Context

  This rule detects authentication attempts from devices that are not registered in Active Directory (AD) and without multi-factor authentication (MFA) being enforced. The behavior suggests potential attempts by an attacker to gain access using non-compliant or unauthorized devices, possibly indicative of credential theft or misuse. The likely attacker objective is to exploit weak security policies to gain unauthorized access to the environment.

  The relevant MITRE ATT&CK tactic is **Initial Access** (TA0001) and the technique is **Valid Accounts** (T1078). The primary telemetry source is Azure sign-in logs, specifically focusing on authentication events. If malicious, this activity can lead to a significant security breach, endangering sensitive data and compromising system integrity. This detection does NOT confirm that the activity is malicious on its own, as it could also be triggered by legitimate user behavior if users are accessing services from non-registered devices.

  ### Investigation Steps

  - **Check sign-in logs for user identity:** Review Azure sign-in logs (Event ID: 4624) for the specific user attempting to authenticate from a non-registered device. Verify if the account is associated with known legitimate business actions.

  - **Analyze authentication context:** Examine the `RiskState` field in the sign-in logs for multiple behaviors such as inconsistent access patterns. Malicious indicators include repeated failures followed by a successful login.

  - **Verify device compliance status:** Look at the `DeviceDetail.trusttype` field. A null or empty value indicates the device is not registered in AD. Compare with expected values for authorized devices.

  - **Identify expected legitimate access:** Determine if similar users have logged in from the same non-registered device in the past. Document how often this behavior aligns with business operations.

  - **Look for associated failed logins:** Check for additional sign-in failures prior to successful attempts from the same device (Azure sign-in logs Event IDs) to highlight any suspicious patterns.

  ### Prioritization

  This alert has a high severity due to the potential impact on sensitive systems and data if unauthorized access occurs. The likelihood of malicious abuse is significant, especially if proper access controls are not enforced. Unauthorized device access behaviors are commonly exploited in attacks, making prompt investigation critical.

  ### Blind Spots and Assumptions

  Detection may be limited by potential user behavior patterns that are legitimate but could trigger this alert (e.g., employees accessing corporate resources from personal devices). Required log sources include comprehensive sign-in logs with detailed device information for reliable detection. The presence of similar alerts, such as successful logins from known risky IP addresses, can strengthen coverage and enhance incident response.

