note: |
  ### Technical Context

  The Sigma rule detects successful sign-in attempts from non-Active Directory (AD) registered devices lacking Multi-Factor Authentication (MFA) controls. The primary behavior indicated is an authentication event that may reflect unauthorized access attempts, either through compromised credentials or risky access from unmanaged devices. The likely objective of attackers is to gain access to corporate resources without proper channel vetting. This detection correlates with the MITRE ATT&CK technique “Valid Accounts” (T1078).

  The primary telemetry source includes Azure Sign-In Logs, showing relevant artifacts such as device trust type and authentication status. If determined to be malicious, this behavior can result in unauthorized access to sensitive data or resources. Importantly, this detection does not confirm that a user account has been compromised or that access will be abused without further contextual investigation.

  ### Investigation Steps

  - **Review the Azure Sign-In Log entries:** Check Event IDs for sign-ins from `SigninLogs` where `Status` is “Success” and `DeviceDetail.trusttype` is either empty or null. This confirms the lack of device compliance without MFA.

  - **Validate user behavior:** Compare sign-in times and locations with the user’s typical activity patterns. A significant deviation may indicate malicious access.

  - **Identify high-confidence malicious indicators:** Focus on successful logins from geographic locations not associated with the user or from unusual IP addresses. Use fields like `IPAddress` and `Location` in the logs for scrutiny.

  - **Assess device compliance requirements:** Verify expected behavior for registered devices, which should connect from pre-approved, compliant devices. Investigate why the device is unregistered.

  - **Check for simultaneous sign-ins:** Look for concurrent sessions or log-in attempts for the same user account. This could indicate credential compromise. Log fields of interest include `UserPrincipalName` and timestamp.

  - **Determine asset criticality impact:** Identify whether the accessed resources are critical or sensitive. High-profile accounts or sensitive data access should escalate investigation priority.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems when accessed by unauthorized devices. The likelihood of malicious exploitation is significant, given that attackers often misuse valid accounts for unauthorized access, particularly in environments that lack robust endpoint security measures.

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques that employ legitimate device identifiers or environments that have compromised credentials not easily identifiable through logs. Adequate logging configurations from Azure Sign-In Logs are critical for reliable detection. Legitimate actions, such as employee use of personal devices for work, may trigger alerts. Companion detections like “Unusual Authentication Events” (T1078) can enhance visibility into account abuse scenarios.

