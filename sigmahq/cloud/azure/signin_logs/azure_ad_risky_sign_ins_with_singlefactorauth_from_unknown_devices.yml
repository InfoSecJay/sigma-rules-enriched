note: |
  ### Technical Context
  This detection rule identifies instances of successful sign-in attempts from devices that are not registered with Active Directory (AD) and do not require multi-factor authentication (MFA). Such scenarios often indicate potential unauthorized access attempts, particularly if the login is occurring from unrecognized or compromised devices. The primary threat scenario includes attackers attempting to access enterprise resources without traditional verifications, essentially bypassing security measures designed to prevent unauthorized access.

  The applicable MITRE ATT&CK tactics include **Initial Access (T1078)**, where attackers gain initial foothold using valid accounts on non-compliant devices, and **Privilege Escalation (T1078)**, where they may leverage this access to gain further permissions within the environment. Successful sign-ins at risk without proper device compliance pose a significant threat as they could lead to data exfiltration or lateral movement within the organization.

  Key data sources for this detection include Azure Sign-in logs, which capture authentication events and their status. These logs will provide detailed information on user sign-ins, device compliance, and authentication methods used, making them essential for identifying these risky sign-in attempts.

  ### Investigation Steps
  - **Review Sign-in Logs:** Analyze Azure sign-in logs for the specific instances related to the detected alert. Pay close attention to user identities, time of access, and the device details associated with each sign-in attempt.
  - **Correlate with Device Management Data:** Examine device compliance statuses to confirm whether the sign-in attempts are genuinely from non-AD registered devices. Look for any historical change logs that may indicate recent device state changes.
  - **Analyze User Behavior:** Investigate the behaviors of the affected users around the time of the sign-in attempts for any anomalies, such as unusual geographic locations or access patterns outside their typical usage.
  - **Assess MFA Policies:** Confirm the organization’s MFA requirements and evaluate if there have been any recent changes to MFA enforcement that could have affected the detection logic, ensuring that legitimate access is not being improperly flagged.

  ### Prioritization
  Given the high likelihood of unauthorized access attempts from non-compliant devices, this alert is critical for maintaining the confidentiality and integrity of enterprise resources. The potential risk impact is significant, warranting immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may not cover all access scenarios, particularly if legitimate sign-ins from non-registered devices occur under specific conditions that are not captured in the current logic. Additionally, there is an assumption that all successful sign-ins should trigger attention, even if they may stem from legitimate sources that do not leverage MFA. For this alert to be effective, Azure Sign-in logging must be appropriately configured and comprehensive, capturing all relevant authentication events and device details.

