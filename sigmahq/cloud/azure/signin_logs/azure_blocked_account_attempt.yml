note: |
  ### Technical Context
  This rule detects instances where a user account that is either disabled or blocked attempts to log in. This behavior is indicative of potential malicious activity, where an attacker may be trying to exploit a legitimate account to gain access to resources despite the account being inactive. An attacker might attempt to brute-force a disabled account or use credentials from a previously compromised account in hopes that it remains accessible, thus achieving unauthorized access to sensitive organizational data.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**: Exploiting compromised account credentials (T1078).
  - **Privilege Escalation (TA0004)**: Attempting to gain elevated access through account manipulation (T1078.004).
  - **Defense Evasion (TA0005)**: Using disabled accounts to evade detection or as part of a cover-up.

  The primary data sources for this detection are Azure Sign-in logs, specifically filtering for login attempts with result codes indicating failure due to the account being disabled or blocked.

  ### Investigation Steps
  - **Review Sign-in Logs**: Investigate Azure Sign-in logs associated with the account in question. Look for patterns of failed logins and assess whether the account has a history of suspicious activity prior to the block or disablement.
  - **Analyze User Account Status**: Check the status of the account in the Azure Active Directory. Determine if the account was intentionally disabled or blocked due to policy violations or irregular activities.
  - **Correlate with Other Alerts**: Search for related alerts or logs from other security tools (e.g., EDR, SIEM) that might indicate unusual behavior, such as failed authentication logs or other abnormal activities correlating with the login attempts.
  - **Examine Security Policies**: Assess any applicable security policies that may have led to the disabling of the account. This could include security-related automations, multi-factor authentication failures, or other enforcement mechanisms.

  ### Prioritization
  This alert has medium severity due to its potential to indicate an ongoing attack. While the likelihood of exploitation via blocked or disabled accounts can vary, any indication of failed access attempts should be taken seriously, especially in organizations where accounts with elevated privileges are involved.

  ### Blind Spots and Assumptions
  The detection may miss scenarios where attackers use legitimate credentials for accounts that have not yet been disabled or improperly handle automated accounts. It assumes that the disabled account status is accurately reflected in Azure and that relevant sign-in logs are retained and available for analysis. Required configurations include proper logging settings in Azure Active Directory to ensure that sign-in attempts are recorded effectively.

