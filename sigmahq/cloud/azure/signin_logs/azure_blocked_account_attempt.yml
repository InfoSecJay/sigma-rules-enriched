note: |
  ### Technical Context

  This rule detects attempts to sign in to Azure accounts that have been disabled or blocked, primarily identifying failed access attempts that indicate potential abuse or testing of compromised credentials. The attacker’s objective with such behavior may include persistence or privilege escalation through leveraging accounts they control or are targeting, in alignment with the MITRE ATT&CK tactic: Persistence (TA0003), and technique: Account Manipulation (T1078.004).

  The primary telemetry sources are Azure Sign-in logs, specifically monitoring for entries where the ResultType equals 50057, which indicates a blocked account. If malicious, this attack can lead to unauthorized access to sensitive resources. However, a detection of this kind does not necessarily confirm successful credential theft or account compromise; it merely indicates an attempted access using an invalid account.

  ### Investigation Steps

  - **Review sign-in logs:** Access Azure Sign-in logs (Audit logs) for ResultType 50057. Check for the account's previous login attempts and their success/failure rates to establish a baseline of legitimate activity vs. potential brute force or targeted attack patterns.

  - **Identify multiple failed attempts:** Track the number of failed sign-in attempts within a short timeframe for the disabled/blocklisted account. A high volume of such attempts may indicate malicious intent, particularly if they originated from numerous IP addresses or unusual geographical locations.

  - **Validate account status:** Confirm whether the account is indeed disabled or blocked as per the organizational policy. Cross-reference with Azure Active Directory (AAD) user attributes to verify the current account state and recent changes.

  - **Examine associated services:** Investigate any links to autoscaling or automation solutions that may be associated with automated accounts that might also be disabled. Check Azure Automation runbooks and their execution logs for any actions that could lead to valid automation, which would reflect benign activity.

  - **Assess impacted system criticality:** Determine the criticality of systems the account had access to. If the account is associated with high-value services (e.g., finance or sensitive data), escalate investigations, as the impact of any compromise could be significant.

  - **Investigate IP addresses:** Scrutinize the IP addresses from which the failed login attempts originated. Cross-reference these IPs against a threat intelligence feed to identify known malicious origins or patterns.

  ### Prioritization

  This alert should be assigned a medium severity due to the potential impact on critical enterprise systems, as disabled or blocked accounts often belong to privileged users. The likelihood of malicious abuse is moderate, as attackers frequently attempt to leverage stolen credentials. This behavior can reflect groundwork for privilege escalation or lateral movement within a network.

  ### Blind Spots and Assumptions

  Detection may be limited by time-to-log availability in Azure Sign-in logs, which may not retain detailed data for extended periods. Automation scenarios, particularly in Azure, could trigger false positives if security configurations inadvertently disable service accounts. Related detections include anomalies related to Recent User Activity (e.g., spikes in logins, or password change requests), which can bolster visibility into potential credential abuse across multiple accounts.

