note: |
  ### Technical Context

  This Sigma rule detects failed sign-in attempts indicating that an account has been disabled or blocked (ResultType 50057). Adversaries may aim to exploit these accounts to gain unauthorized access or perform lateral movement within the network using stolen credentials. This behavior aligns with the MITRE ATT&CK technique "Valid Accounts" (T1078.004), specifically targeting persistence and privilege escalation.

  The primary telemetry source for this detection is Azure Sign-in logs, which capture login attempts and their results. If the activity is malicious, it could signify an attempted credential reuse by an attacker or a brute force attack on a disabled account. Importantly, this detection does NOT confirm that an attack or compromise occurred—it merely indicates an attempt to access a blocked account.

  ### Investigation Steps

  - **Check Azure Sign-in Logs:** Review Azure Sign-in logs for Event ID 50057 for the affected account to confirm repeated failed login attempts. Compare timestamps with other logs to assess the timing and frequency of the activity.

  - **Identify Common Account Behaviors:** Determine if there's a history of legitimate access for this account. Review past sign-in log events for successful logins to establish a baseline of expected behavior.

  - **Collect Additional Log Context:** Pull Account activity logs within Azure Active Directory for the disabled account to identify any recent changes, as legitimate administrative actions may coincide with the alert.

  - **Correlate with Security Incidents:** Investigate if the account was previously associated with any reported security incidents or phishing activity. Search for related anomalies in security incident logs that could suggest attempted misuse of the account.

  - **Check for Evasion Techniques:** Identify if there are any patterns in login attempts from unusual geographic locations or IP addresses that do not match previous access patterns for that account.

  ### Prioritization

  The severity of this alert is medium, as it indicates potentially malicious behavior targeting sensitive accounts. The likelihood of abuse is moderate since attackers frequently attempt to leverage disabled accounts for persistence or lateral movement. Such activities, if left unchecked, can lead to unauthorized access within the organization.

  ### Blind Spots and Assumptions

  One limitation of this detection is that legitimate administrative actions or automated services may trigger the alert, leading to false positives. Ensuring robust logging configurations on Azure is crucial for reliable detection. Additionally, legitimate scenarios, such as an admin disabling an account due to security policy updates or automated processes blocking an account after multiple failed attempts, could also prompt alerts. A related detection rule monitoring for unusual sign-in patterns could enhance the overall security posture.

