note: |
  ### Technical Context

  This Sigma rule detects instances where users have successfully authenticated to Azure Active Directory (Azure AD) with only single-factor authentication (MFA not required). The likely objective of an attacker exploiting this condition is to gain unauthorized access to user accounts, especially targeting accounts that have administrative privileges or sensitive roles. This behavior is aligned with the MITRE ATT&CK tactic of Credential Access (TA0006), specifically the technique of Valid Accounts (T1078.004).

  The primary telemetry source for this detection is Azure Sign-In Logs, specifically monitoring entries that indicate successful authentication attempts without MFA requirements. The security impact could be significant, as unauthorized users may gain access to sensitive data or perform actions that could compromise the integrity of the environment. It's crucial to note that this detection alone does NOT confirm malicious activity; legitimate user configurations may also result in single-factor authentication being used.

  ### Investigation Steps

  - **Review recent sign-in logs for suspicious accounts**: Check Azure Sign-In Logs (Log Type: **signinlogs**; Fields: **UserPrincipalName, Status, AuthenticationRequirement**) for entries indicating successful logins with 'singleFactorAuthentication'. Compare against known legitimate user behavior patterns.

  - **Identify high-privilege accounts**: Filter log entries by user role to focus on accounts with elevated permissions (e.g., Admin roles). High-privilege accounts authenticating without MFA requirements pose a higher risk.

  - **Assess conditional access policies**: Verify if legitimate users such as system administrators have documented exemptions for single-factor authentication. Relevant documentation may exist in Azure Active Directory conditional access configurations.

  - **Monitor for repeated single-factor authentication events**: Look for multiple occurrences of single-factor authentication successes from the same user within a short timeframe. This can indicate an attempt to subvert MFA requirements.

  - **Investigate any security alerts or changes in MFA configurations**: Check for recent alerts in Azure Security Center related to changes in MFA settings (e.g., enabling/disabling MFA policies). Such changes can impact the security posture and may explain single-factor authentications.

  ### Prioritization

  The alert is of low severity given that it does not immediately indicate a breach but reveals a potential weakness in access control. However, the involvement of high-privilege accounts or sensitive data should escalate its urgency. Attackers often exploit single-factor authentication in environments where MFA is not enforced, making this a valuable entry point for malicious activity.

  ### Blind Spots and Assumptions

  Detection may overlook legitimate scenarios, such as accounts intentionally configured for single-factor authentication due to business processes or exceptions. Ensuring comprehensive logging from Azure AD with all necessary configurations is crucial for effective detection. Legitimate activities, such as application service accounts or legacy application authentications, may trigger this alert. Companion detections may include monitoring Azure AD events like changes in Multi-Factor Authentication (MFA) settings for a better assessment of the security environment.

