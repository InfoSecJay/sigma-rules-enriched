note: |
  ### Technical Context

  This rule detects successful user authentication events where only single-factor authentication (SFA) was required. The behavior indicates potential misuse of authentication practices that may allow adversaries to exploit weak security measures for account access. The likely attacker objective is to gain unauthorized access to user accounts without the additional security barrier of multi-factor authentication (MFA).

  Relevant MITRE ATT&CK tactics include Credential Access (TA0006) and Persistence (TA0003), specifically aligned with the techniques T1078.004 (Valid Accounts: Local Accounts) and T1556.006 (Modify Authentication Process). Primary telemetry sources include Azure AD sign-in logs, specifically focusing on events where the `AuthenticationRequirement` field is logged as 'singleFactorAuthentication'. If malicious, this behavior could enable attackers to move laterally within the environment by accessing sensitive accounts. Importantly, this detection does NOT confirm whether the accessed accounts were compromised, only that they authenticated using SFA.

  ### Investigation Steps

  - **Review sign-in log entries:** Examine Azure AD sign-in logs (Log Type: SigninLogs) for Event IDs that show successful authentication (`Status: 'Success'`) with `AuthenticationRequirement: 'singleFactorAuthentication'`. Compare against expected user authentication patterns in your organization.

  - **Identify affected accounts:** Determine which user accounts are involved in these authentication events. Identify high-risk users, particularly those with privileged access, to assess potential risk.

  - **Assess MFA enforcement:** Verify the organization's MFA policies to determine if SFA is appropriately allowed. Determine if there were any recent changes to policy settings that could explain the occurrence of single-factor authentication.

  - **Correlate with additional security events:** Check if any suspicious activities or other security alerts associated with the affected user accounts are present in logs around the same time frame. Look for indicators such as unusual login locations or times.

  - **Investigate legitimate vs. illegitimate access:** Establish if any known exceptions (e.g., specific maintenance or testing by administrators) exist that would allow SFA. Document and validate these exceptions to distinguish between benign and potentially malicious activities.

  ### Prioritization

  This alert is considered low severity in a mature enterprise context, primarily due to the low probability of exploitation when MFA is generally enforced. However, it warrants attention because the use of SFA, especially for privileged accounts, can lead to unauthorized access, making it a potential vector for credential abuse and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited by the visibility of Azure AD logs; ensuring all sign-in logs are properly retained is crucial for reliable detection. Legitimate use cases, such as scheduled tasks or automated service accounts, may trigger this alert without indicating malicious intent. A related detection to strengthen coverage could involve monitoring for anomalous authentication activity, like multiple failed login attempts following a successful SFA event.

