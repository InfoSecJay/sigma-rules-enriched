note: |
  ### Technical Context
  This rule detects instances of successful user authentication to Azure Active Directory (Azure AD) which do not require Multi-Factor Authentication (MFA). In a threat scenario where attackers aim to gain unauthorized access to user accounts, relying solely on single-factor authentication can significantly increase the risk of account compromise. Attackers may exploit this weakness by using stolen credentials obtained through various means, including phishing campaigns or credential dumping, to authenticate and potentially escalate privileges.

  The relevant MITRE ATT&CK tactics associated with this detection are **Initial Access** (TA0001), as attackers need a foothold in the environment, and **Credential Access** (TA0006), focusing specifically on compromised accounts or **Valid Accounts** (T1078.004) where legitimate credentials are leveraged. Additionally, it touches on **Persistence** (TA0003) and **Privilege Escalation** (TA0004), highlighting the risk of unauthorized access and elevated permissions that can follow. The primary data sources for detecting this activity include Azure AD sign-in logs, which record authentication events and their requirements.

  ### Investigation Steps
  - **Review Sign-in Logs**: Analyze Azure AD sign-in logs to identify instances of successful authentications where **singleFactorAuthentication** is noted. Look for patterns indicating frequent single-factor authentications from particular users or IP addresses.

  - **Identify Suspicious User Behavior**: Cross-reference user activity before and after the single-factor authentication events. Investigate any anomalous actions like account modifications, access to sensitive resources, or logins from unusual locations.

  - **Examine Privileged User Accounts**: Pay special attention to accounts with elevated privileges. Confirm whether MFA is enforced for these users to prevent potential account exploitation that could lead to more severe consequences.

  - **Assess Configuration Policies**: Verify the organization's authentication policies regarding MFA requirements. Look for potential deviations or misconfigurations that might allow single-factor authentication, especially for high-risk users or sensitive applications.

  ### Prioritization
  The alert has a low severity level due to the conditional nature of single-factor authentication being permissible under specific scenarios, like those approved by system administrators. However, it remains important to monitor since this could indicate a broader security policy misalignment, especially in environments where MFA is expected.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios where single-factor authentication is deliberately allowed due to business needs approved by system administrators. The detection logic assumes that any successful login event marked as **singleFactorAuthentication** is a potential security risk. Moreover, proper logging from Azure AD must be enabled and configured appropriately for the alert to function effectively. Without visibility into sign-in logs or correct authentication configurations in place, valuable detections might be missed.

