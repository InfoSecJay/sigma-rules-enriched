note: |
  ### Technical Context

  This rule detects instances where a user has denied a multi-factor authentication (MFA) prompt, indicating they did not initiate the request. This behavior may signify that an adversary is attempting to gain access to the account, possibly having acquired the user's password but lacking the second factor of authentication. The relevant MITRE ATT&CK tactics and techniques include Credential Access (TA0006), specifically Credential Dumping (T1046) and Valid Accounts (T1078.004). Primary telemetry sources for this detection are Azure Sign-In Logs, particularly the fields related to Authentication Requirement and Status. If malicious, this behavior can lead to unauthorized access and subsequent compromise of sensitive information. This detection alone does not confirm compromise; it highlights a potentially anomalous activity that requires further investigation.

  ### Investigation Steps

  - **Check sign-in logs for unusual activity:** Review Azure Sign-In Logs (Event ID 700) for the user in question, focusing on timestamps of denied MFA requests to identify potential irregular access attempts. Look for multiple requests in a short timeframe.

  - **Assess user account status:** Verify the account's sign-in status using Azure Active Directory logs to see if there were recent changes, such as password resets or suspicious logins from new or unusual locations or devices.

  - **Validate legitimate behavior:** Investigate the user's login patterns for any benign activity that may explain the MFA denial, such as a missed click or timing issues during the login process to discern expected behavior from potential abuse.

  - **Identify high-confidence malicious indicators:** Cross-reference denied MFA attempts with security alerts for failed sign-ins (Event ID 50126). Frequent denied MFA requests closely following account compromise attempts may indicate a high-confidence malicious indicator.

  - **Monitor for subsequent authentication attempts:** Watch for subsequent successful or failed sign-in attempts following the MFA denial, as attackers may persist in trying to gain access. This includes examining the source IP addresses for anomalies.

  ### Prioritization

  This alert should be prioritized as medium severity. The impact is significant as it involves potentially compromised user accounts that could lead to data breaches. While the likelihood of malicious abuse is high, benign explanations exist, necessitating careful investigation before escalation.

  ### Blind Spots and Assumptions

  Limitations include the possibility of legitimate users accidentally denying the MFA prompt, which may create noise in the alerts. Reliable detection requires consistent logging configurations in Azure AD to ensure visibility on authentication events. Common benign activities, like help desk interventions or user training scenarios, could trigger this alert. A companion detection, such as multiple failed sign-ins within a short period, can strengthen coverage by identifying sequences of suspicious activity related to the alert.

