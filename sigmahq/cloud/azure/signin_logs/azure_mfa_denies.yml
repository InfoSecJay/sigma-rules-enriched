  ---

  ### Technical Context

  This rule detects instances where a user has indicated that they did not initiate the Multifactor Authentication (MFA) prompt but received a denial response instead. This behavior may suggest that an attacker is attempting to access the account without legitimate authorization, having already acquired the user's password.

  The likely attacker objective is account compromise and unauthorized access to sensitive data or systems, possibly using stolen credentials to circumvent straight authentication. This aligns with the MITRE ATT&CK techniques T1078.004 (Account Manipulation) and T1110 (Brute Force).

  Primary telemetry sources are Azure Sign-in logs, specifically focusing on events where `AuthenticationRequirement` is set to 'multiFactorAuthentication' and the `Status` is 'MFA Denied.' If malicious, this behavior poses significant security risks by enabling potential unauthorized access to systems and data. However, the detection alone does NOT confirm that an attack is occurring without correlating additional user activity context.

  ---

  ### Investigation Steps

  - **Evaluate User Context:** Review the user account associated with the alert in Azure Active Directory (Event ID: 4624, sign-in logs). Check for any recent sign-in attempts from unfamiliar IP addresses or geolocations that deviate from their normal behavior.

  - **Analyze Sign-in Logs:** Check Azure Sign-in logs (Log Type: SigninLogs) for multiple recent authentication requests to the account around the time of the alert. Look for patterns of rapid, repetitive login attempts that exceed the user’s regular activity.

  - **Review Previous MFA Events:** Validate any recent successful MFA attempts (SigninLogs) by this user to provide context. Legitimate users often have a log of recent MFA requests they initiated themselves. Cross-reference that with the denied event to see if it matches.

  - **Identify Malicious Indicators:** Assess for abnormal patterns like logins from known blacklisted regions or devices, using the Event ID for suspicious sign-ins. Ensure that any unfamiliar devices are flagged as high-confidence malicious indicators.

  - **Confirm Legitimate Activity:** Identify if there are legitimate reasons for MFA denials, such as users accidentally clicking ‘Deny’ while authentically logging in. Investigate the log for any unusual login timelines that fit this scenario.

  - **Check for Subsequent Access Attempts:** Investigate subsequent sign-in attempts to the account using the same Azure sign-in logs to determine if there are further failed or successful access attempts after this alert.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential for account compromise. If a critical account is involved, such as an administrative or high-value target, it raises the urgency of response, especially since credential abuse attacks commonly leverage stolen passwords alongside ineffective MFA.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate users inadvertently denying MFA requests, which could generate false positives. Reliable detection requires that Azure Sign-in logs are properly retained and configured for monitoring. Furthermore, legitimate multi-factor challenges may occur during user behavior typical login processes. A related detection to consider is failed login attempts tied to the same user account, as this can reinforce suspicions around attempted unauthorized access.

