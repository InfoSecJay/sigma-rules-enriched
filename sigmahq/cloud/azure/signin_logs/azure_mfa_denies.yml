note: |
  ### Technical Context

  The detection rule identifies instances where a user has denied a multifactor authentication (MFA) prompt, suggesting potential unauthorized access attempts. The likely attacker objective is to gain access to user accounts through credential theft, indicating the user may not have initiated the MFA request themselves. This behavior aligns with the MITRE ATT&CK tactic of "Credential Access" (TA0006) and the technique "Valid Accounts" (T1078.004).

  The primary telemetry source is Azure's sign-in logs, particularly focusing on the `AuthenticationRequirement` that specifies multi-factor authentication and those events where the `Status` contains "MFA Denied." If a malicious actor is exploiting this, it could lead to unauthorized access to sensitive information, data exfiltration, or lateral movement within the environment. Importantly, this detection alone does not confirm an attack; legitimate users may mistakenly deny valid MFA prompts.

  ### Investigation Steps

  - **Identify the source of the MFA prompts: **Review Azure sign-in logs (Event ID 4624) for IP addresses and locations associated with the MFA denials. Confirm if the origin of the sign-in request is typical for the user.

  - **Determine legitimate user behavior:** Validate expected MFA prompt interactions; legitimate users often approve MFA requests through known devices, while denials from unknown devices or locations may indicate compromise.

  - **Check for account compromise indicators:** Investigate the user account for any recent account changes or logins from suspicious locations (e.g., atypical country or IP address) in Azure sign-in logs (fields: `Location`, `IP Address`).

  - **Review associated sign-in attempts:** Analyze sign-in logs within a 5-10 minute timeframe before and after the denial to identify any failed or successful logins that coincide with MFA denial (Event IDs 4625 for failed attempts).

  - **Examine user activity logs for anomalies:** Investigate Azure Activity logs to reveal any changes made by the user account around the time of the MFA Denied event (fields: `Caller`, `Operation Name`, `Status`).

  - **Identify high-confidence malicious indicators:** Look for repeated MFA denial events from the same user within short periods, especially when paired with concurrent logins from a new geographic location, found in Azure sign-in logs.

  ### Prioritization

  This alert has medium severity due to the potential impact on exposed user accounts and the risk of credential theft. While MFA denial is not automatically indicative of a successful breach, the likelihood of abuse is significant, especially as attackers often target user accounts to bypass MFA protections.

  ### Blind Spots and Assumptions

  Detection may be limited by reliance on specific log sources; sign-in logs must be configured to capture all authentication events accurately, and misconfigurations may lead to null results. Legitimate activities, such as users mistakenly canceling MFA prompts, can trigger this alert. Related detections might include monitoring for a high volume of MFA denials across various accounts, aiding in the identification of coordinated attack attempts.

