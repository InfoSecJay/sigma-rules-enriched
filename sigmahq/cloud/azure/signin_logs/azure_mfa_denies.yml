note: |
  ### Technical Context
  This detection rule monitors for instances when multi-factor authentication (MFA) prompts are denied by users who did not instigate the prompt themselves. Such cases may signal a potential compromise where an attacker has gained access to a legitimate user's password but is unable to provide the additional authentication factor. The attacker’s objective could be to perform unauthorized actions such as data exfiltration or lateral movement within the network, leveraging compromised credentials to escalate privileges.

  Relevant MITRE ATT&CK tactics for this detection include **Credential Access (TA0006)** and specifically the techniques **Valid Accounts (T1078)** and **Account Manipulation (T1110)**. Both tactics pertain to strategies used by attackers to gain and exploit valid user credentials.

  The primary data sources for this detection rule are the authentication logs from Azure Active Directory's sign-in logs, which provide insights into user login attempts and authentication statuses.

  ### Investigation Steps
  - **Review Sign-in Logs:** Examine Azure sign-in logs for the timeframe around the alert, looking for patterns of failed MFA attempts tied to the compromised account in question.
  - **Identify Unusual Login Locations:** Check for any sign-ins from atypical geographical locations or IP addresses that do not align with known user behavior, indicating possible unauthorized access.
  - **Analyze User Behavior:** Investigate the account’s recent activities leading up to the denied MFA prompts, looking for unusual access patterns or changes in privileges that may indicate an attacker attempting lateral movement.
  - **Engage Users for Confirmation:** Reach out to the impacted users to confirm if they recognized any unauthorized access attempts and ensure they are following proper security protocols, including verifying their account credentials.

  ### Prioritization
  This alert is categorized with medium severity due to the potential risk associated with denied MFA prompts. It suggests that a valid user account may be compromised, which could lead to significant security issues if not addressed promptly.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, notably in scenarios where an attacker may use legitimate MFA apps or devices to bypass this detection method. The detection logic assumes that users will correctly recognize unauthorized MFA challenges and respond accordingly. For this alert to function effectively, it is essential that Azure sign-in logs are correctly configured to capture detailed MFA transaction events with sufficient retention policies in place.

