logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    properties.message: Device Code
  condition: selection
falsepositives:
- Applications that are input constrained will need to use device code flow and 
  are valid authentications.
level: medium
note: |
  ### Technical Context

  The Sigma rule detects instances of device code authentication flow being utilized within environments where it is not typical, particularly in configurations lacking input-constrained devices. This behavior may indicate potential misconfigurations, unauthorized or malicious applications attempting to authenticate, or acts of credential theft. The relevant MITRE ATT&CK tactics are **Initial Access (TA0001)** using **Valid Accounts (T1078)**. The primary telemetry source is Azure Sign-in logs, specifically the event fields capturing sign-in messages about device code usage. If malicious, the impact could lead to unauthorized access or account compromise. However, this detection alone does not confirm malicious intent as it may also capture legitimate use cases in specific scenarios.

  ### Investigation Steps

  - **Review Azure Sign-in log entries:** Filter for Security Event ID correlated with device code authentication (e.g., properties.message: Device Code). Look for timestamps, user accounts, and originating IP addresses to identify anomalies.

  - **Check for input-constrained devices:** Validate if the device code flow is initiated from known input-constrained devices (e.g., smart TVs, embedded systems). Compare against an asset inventory to confirm associated devices.

  - **Assess the frequency of sign-ins:** Identify multiple instances of device code authentication within a short time frame from the same account or IP address. This pattern could indicate brute-force attempts or credential abuse.

  - **Investigate user account activity:** Cross-reference affected user accounts with previous authentication attempts and look for any other sign-in anomalies or unusual patterns in user behavior via Azure AD logs.

  - **Correlate with known applications:** Review any applications installed on the systems initiating device code authentication. Assess their necessity and verify if they utilize device code flow for legitimate purposes, to separate benign operations from potential threats.

  - **Determine risk on key assets:** Prioritize investigation based on whether the authentication attempts pertain to critical or high-privilege accounts that could lead to escalated access if compromised.

  ### Prioritization

  This alert is medium severity due to the potential for unauthorized access through valid accounts, which can significantly impact sensitive environments. Since the use of device code flow is not typically expected without input-constrained devices, the likelihood of malicious abuse is higher. The behavior is often weaponized in credential theft scenarios, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where legitimate input-constrained devices exist, as these are valid use cases for device code flow. Logs must be properly configured to ensure Azure Sign-in logs capture all relevant authentication events for reliable detection. Legitimate multi-factor authentication setups might inadvertently trigger this alert. Companion detections related to abnormal sign-in patterns or failed authentication attempts can enhance overall detection capability.

