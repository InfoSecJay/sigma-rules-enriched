title: Application Using Device Code Authentication Flow
id: 248649b7-d64f-46f0-9fb2-a52774166fb5
status: test
description: |
  Device code flow is an OAuth 2.0 protocol flow specifically for input constrained devices and is not used in all environments.
  If this type of flow is seen in the environment and not being used in an input constrained device scenario, further investigation is warranted.
  This can be a misconfigured application or potentially something malicious.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-authentication-flows
author: Mark Morowczynski '@markmorow', Bailey Bercik '@baileybercik'
date: 2022-06-01
tags:
- attack.t1078
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.initial-access
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    properties.message: Device Code
  condition: selection
falsepositives:
- Applications that are input constrained will need to use device code flow and 
  are valid authentications.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized or misconfigured use of the device code flow in OAuth 2.0 authentication. The behavior suggests that an application may be attempting to authenticate using a method typically reserved for devices with limited input capabilities, which could indicate a potential adversary's attempt to gain access under the guise of legitimate activity. The relevant MITRE ATT&CK tactic is **Initial Access (TA0001)**, specifically the technique **Valid Accounts (T1078)**.

  The primary telemetry source is Azure Sign-In Logs, specifically looking for events related to the device code authentication flow. If misused, this behavior poses a security risk, as it could allow attackers to exploit valid credentials or misconfigured applications to gain unauthorized access. Importantly, this detection does NOT confirm that any malicious activity has occurred; it is an indication that investigation is warranted.

  ### Investigation Steps

  - **Examine sign-in logs:** Check Azure Sign-In Logs for Event Type records where `properties.message` includes "Device Code". Notate timestamps, user accounts, and IP addresses associated with the logins.

  - **Identify expected usage:** Review known applications in your environment to identify if any legitimate input-constrained applications require device code flow for authentication. Document their expected behavior for comparison.

  - **Evaluate user account activity:** Cross-reference the sign-in logs with user behavior analytics to identify unusual sign-in patterns or geographic locations that diverge from established norms for the affected user accounts.

  - **Look for high-confidence malicious indicators:** Investigate any sign-ins that originate from non-trusted IP ranges or are followed by unusual account activity, such as privilege escalation attempts (check Azure AD audit logs for Event IDs related to admin role assignments).

  - **Assess application configurations:** Identify any recent changes or configurations in your Azure applications that may have enabled unauthorized use of device code flow. Review deployment logs for potential misconfigurations.

  - **Correlate with other identity-related alerts:** Check for concurrent alerts related to invalid account usage or token requests to identify patterns or potential related incidents that may strengthen the case for malicious activity.

  ### Prioritization

  This alert is medium severity. The potential impact of unauthorized access to systems that utilize insider application flows is significant, particularly if they manage sensitive data or crucial infrastructure. Given that the device code flow is less common in secure environments, the likelihood of an attacker leveraging this method is a valid concern.

  ### Blind Spots and Assumptions

  Detection may be limited if Azure Sign-In logs are not fully configured or retained for an adequate timeframe. Legitimate applications that operate under constrained inputs could falsely trigger this alert, causing potential operational noise. Companion detections may include alerts on invalid sign-in attempts or unusual account behavior, which could help correlate potentially malicious activities.

