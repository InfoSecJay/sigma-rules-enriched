title: Applications That Are Using ROPC Authentication Flow
id: 55695bc0-c8cf-461f-a379-2535f563c854
status: test
description: |
  Resource owner password credentials (ROPC) should be avoided if at all possible as this requires the user to expose their current password credentials to the application directly.
  The application then uses those credentials to authenticate the user against the identity provider.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-authentication-flows
author: Mark Morowczynski '@markmorow', Bailey Bercik '@baileybercik'
date: 2022-06-01
tags:
- attack.stealth
- attack.t1078
- attack.persistence
- attack.privilege-escalation
- attack.initial-access
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    properties.message: ROPC
  condition: selection
falsepositives:
- Applications that are being used as part of automated testing or a legacy 
  application that cannot use any other modern authentication flow
level: medium
note: |
  ### Technical Context

  This rule detects applications utilizing the Resource Owner Password Credentials (ROPC) authentication flow, which is a method where users provide their password directly to the application. This behavior raises concerns as it exposes user credentials directly to third-party applications, potentially allowing for credential theft. The likely attacker objective is to authenticate as a legitimate user without their knowledge or consent, facilitating unauthorized access to sensitive resources.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection are "Initial Access" (TA0001) and "Valid Accounts" (T1078). The primary telemetry source is Azure Sign-in logs, which should include event types that indicate ROPC usage. If this behavior is malicious, it may lead to account compromise and data leakage. However, this detection does NOT confirm that the application is malicious on its own; legitimate applications or services may also utilize ROPC under certain circumstances.

  ### Investigation Steps

  - **Review sign-in logs for ROPC entries**: Examine Azure Sign-in logs (Event ID: Sign-ins) for entries where `properties.message` indicates “ROPC”. Verify if the application using ROPC is known or authorized.

  - **Cross-reference application legitimacy**: Identify the application making ROPC requests. Check your inventory of approved applications and their authentication methods to determine if the application is sanctioned.

  - **Look for unusual user account activity**: Investigate recent activity for the involved user accounts around the time of ROPC usage. Use Azure AD audit logs (Event ID: 4618) to check for any anomalies like failed logins or access attempts from unusual IP addresses.

  - **Identify common legitimate usage**: Confirm if the application is part of automated testing or a legacy system that mandates ROPC by checking your operational documentation or user access policies.

  - **Check for credential exposure**: Investigate if any sensitive credentials were logged or exposed in the application's activity. Review log entries and API outputs where passwords might inadvertently appear.

  - **Monitor access logs post-ROP**: After investigating, continue monitoring access logs for any suspicious behavior that follows the ROPC authentication, indicating potential malicious use of valid accounts.

  ### Prioritization

  This alert carries medium severity as it involves potential exposure of user credentials, which can lead to unauthorized access if exploited. The likelihood of malicious use is moderate; while ROPC can be utilized legitimately, it is often a vector for credential theft and should be treated with caution, particularly in environments with sensitive data.

  ### Blind Spots and Assumptions

  Detection may be limited by applications that deceptively use ROPC without triggering alerting mechanisms, thereby evading scrutiny. Reliable detection requires comprehensive sign-in log collection and monitoring configuration in Azure AD. Legitimate use cases may occur in automated testing suites, hence thorough examination of the context is necessary. Companion detections involving unusual access patterns or failed login attempts may strengthen the coverage of potential credential misuse.

