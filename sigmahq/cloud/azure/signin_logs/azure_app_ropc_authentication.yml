title: Applications That Are Using ROPC Authentication Flow
id: 55695bc0-c8cf-461f-a379-2535f563c854
status: test
description: |
  Resource owner password credentials (ROPC) should be avoided if at all possible as this requires the user to expose their current password credentials to the application directly.
  The application then uses those credentials to authenticate the user against the identity provider.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications#application-authentication-flows
author: Mark Morowczynski '@markmorow', Bailey Bercik '@baileybercik'
date: 2022-06-01
tags:
- attack.t1078
- attack.defense-evasion
- attack.persistence
- attack.privilege-escalation
- attack.initial-access
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    properties.message: ROPC
  condition: selection
falsepositives:
- Applications that are being used as part of automated testing or a legacy 
  application that cannot use any other modern authentication flow
level: medium
note: |
  ### Technical Context

  This rule detects the usage of the Resource Owner Password Credentials (ROPC) authentication flow within applications. This behavior is often exploited by adversaries to gain unauthorized access to user accounts, as it necessitates users providing their passwords directly to applications. The likely attacker objective is to escalate privileges or persist within a network post-access. This detection aligns with the MITRE ATT&CK framework, specifically with the techniques "Valid Accounts" (T1078) and "Defense Evasion" (T1562). The primary telemetry source is Azure Sign-In logs, specifically entries where the message indicates ROPC usage. If this behavior is confirmed malicious, it could facilitate unauthorized access to corporate resources and sensitive information. However, the detection alone does not confirm that the application is compromised; it may be legitimate in certain automated testing scenarios.

  ### Investigation Steps

  - **Validate the source of ROPC usage:** Review Azure Sign-In logs (Event ID 4624) and filter for messages referencing ROPC. Check the applications involved for any known, legitimate uses, especially during automated testing or within legacy applications.

  - **Review user credentials exposure:** Investigate if the same user account has been flagged for unusual activities across multiple endpoints (e.g., multiple sign-in attempts from distinct geographical locations) using the Azure activity logs.

  - **Analyze application behavior context:** Check for details about the applications using ROPC by querying Azure AD Application logs. Identify whether these applications are registered correctly and their associated permissions.

  - **Identify unauthorized access attempts:** Correlate the identification of the ROPC flow with other alerts or incidents (e.g., unexpected admin access) using combined log data from Azure AD and Security Information and Event Management (SIEM) systems.

  - **Risk assessment of affected assets:** Determine the criticality of the accounts involved in ROPC authentication and their roles in the organization. Higher privileged accounts should be investigated with higher scrutiny.

  - **Monitor for brute-force signs:** Look for signs of credential stuffing attacks, such as repeated failed login attempts associated with the same accounts, using event logs for transport layer security (TLS) handshakes and authentication failures.

  ### Prioritization

  The severity of alerts triggered by ROPC authentication flows should be considered medium due to the potential impact of unauthorized access, particularly if privileged accounts are involved. The likelihood of it being malicious is heightened due to the common use of ROPC in phishing or credential stuffing attacks, making it imperative to investigate promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by the application's legitimate use of ROPC for automated testing or legacy systems which cannot adapt to modern authentication flows. Reliable detection requires configuration of Azure sign-in logs and understanding of user application protocols. Potential legitimate triggers include personal or testing frameworks relying on ROPC for rapid user authentication. Companion detections such as monitoring for brute-force login attempts or unusual sign-in patterns provide a more comprehensive security posture.

