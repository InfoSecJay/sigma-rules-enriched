note: |
  ### Technical Context

  This rule detects the use of legacy authentication protocols like IMAP, POP3, MAPI, SMTP, and Exchange ActiveSync for sign-ins to an account. Attackers often leverage these protocols to bypass modern security mechanisms such as multi-factor authentication, often aiming to gain access to sensitive information or to maintain persistence in a compromised environment. The relevant MITRE ATT&CK tactics include Credential Access (T1078.004) and Persistence (T1110).

  The primary telemetry sources for this detection are Azure Sign-In logs, specifically focusing on the `ActivityDetails` and `ClientApp` fields to identify legacy authentication attempts. If this behavior is confirmed as malicious, it can lead to unauthorized access to user accounts and potential lateral movement within the organization’s network. Importantly, this detection does NOT confirm that an account has been compromised, as legitimate scenarios (e.g., specific user permissions) may warrant the use of these protocols.

  ### Investigation Steps

  - **Verify the user’s permissions and roles:**
    Check if the user associated with the legacy authentication attempt typically requires legacy authentication due to business needs. Confirm through Azure Active Directory User logs (specifically `UserPrincipalName` and `AssignedRoles` fields) to identify legitimate versus unnecessary use.

  - **Identify the sign-in time and location:**
    Cross-reference sign-in timestamps and locations in Azure Sign-In logs (e.g., `CreatedDateTime`, `Location` fields) against expected user behavior patterns. Unexpected sign-ins could indicate malicious intent.

  - **Examine session details for irregular patterns:**
    Analyze the `ClientApp` field to confirm the specific legacy protocol being used. For instance, if `ClientApp` shows unauthorized access from a non-standard protocol for a user role, this raises a red flag.

  - **Check for simultaneous sign-ins from different locations:**
    Look for anomalous sign-ins on the same account from disparate geographical locations within a short timeframe in Azure Sign-In logs. Use `Sign-in Status` and `IPAddress` fields to validate the likelihood of credential theft.

  - **Look for alerts on known malicious IPs:**
    Use threat intelligence sources to correlate the IP addresses found in Azure Sign-In logs against known malicious IP lists. Pay particular attention to any sign-ins labeled as `Failed` with high-risk indicators for potential brute-force attempts.

  ### Prioritization

  This alert is considered high severity due to the critical nature of legacy authentication bypassing strong security controls. The potential for attackers to exploit legacy authentication methods is significant, particularly as these protocols are often weaponized in credential-based attacks. The alert should therefore be prioritized, especially on accounts with elevated privileges or sensitive access.

  ### Blind Spots and Assumptions

  The detection may fail to identify legitimate business needs for legacy authentication if not properly communicated within the organization. There may be specific user groups authorized for these protocols, leading to potential false positives. It is also essential to ensure that all Azure Sign-In logs are properly configured and ingested for reliable detection. Companion detections, such as monitoring for unusual login activity or use of legacy protocols in conjunction with other suspicious behaviors, can strengthen overall coverage.

