  ---

  ### Technical Context

  This Sigma rule detects the use of legacy authentication protocols, such as IMAP, POP3, and SMTP, which are generally less secure than modern authentication methods. The likely attacker objective is to gain unauthorized access to user accounts or conduct credential harvesting, which can lead to account compromise. The relevant MITRE ATT&CK tactic for this behavior is "Credential Access" (TA0006), specifically technique "Valid Accounts" (T1078.004). Primary telemetry sources include Azure Sign-In Logs with relevant log types detailing the Client Application used. If malicious, the security impact could be severe, leading to unauthorized access to sensitive information. However, this detection does NOT confirm malicious intent on its own since legitimate applications may also leverage these legacy protocols.

  ---

  ### Investigation Steps

  - **Review User Authentication Activity:**
    Check Azure Sign-In Logs for Event IDs related to sign-ins (e.g., 4624) that show connections through legacy protocols. Determine the frequency and source IP addresses to identify unusual patterns.

  - **Identify Anomalous Users:**
    Filter for accounts identified with legacy authentication. Cross-reference with known safe users or groups; legitimate users may have been added to exception groups to utilize these protocols without concern.

  - **Examine ClientApp Usage:**
    Specifically look for activity on Client Apps like IMAP, POP3, and SMTP. A high volume of logins from these protocols compared to other modern apps may indicate potential abuse or compromise.

  - **Check for Access Patterns:**
    Analyze the timing of legacy authentication usage. Regular, predictable access outside of business hours may be indicative of a malicious actor impersonating credentialed users to bypass security measures.

  - **Correlate with Incident Reports:**
    Review any recent reports or alerts from your SIEM or threat intelligence platform concerning legacy application usage, credential reuse, or brute force attempts against user accounts.

  - **Investigate High-Confidence Indicators:**
    Focus on identifying IP addresses known for previous malicious activity or correlating with external attack patterns. Immediate follow-up should be performed if multiple failed sign-in attempts occur before a successful login using legacy methods.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact of account compromise, especially for privileged accounts within the enterprise environment. The likelihood of malicious abuse is notably high, given that legacy authentication methods are commonly targeted by attackers. The behavior observed is often weaponized as part of phishing campaigns and credential stuffing.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations due to users with legitimate business requirements to use legacy protocols, leading to false positives. Consistent logging of Azure Sign-In Logs is essential for this detection to be effective, and improper configurations may result in incomplete visibility. Additionally, various applications may authenticate using legacy methods, which could trigger alerts. A related detection to consider is monitoring for unusual access to critical resources immediately following successful legacy authentication events.

