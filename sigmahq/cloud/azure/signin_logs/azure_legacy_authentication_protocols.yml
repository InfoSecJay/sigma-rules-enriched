note: |
  ### Technical Context
  This detection rule identifies the use of legacy authentication protocols within an Azure environment. These protocols (such as IMAP, POP3, SMTP, and MAPI) are often targeted by attackers since they lack the multi-factor authentication protections present in more modern protocols. An attacker leveraging these protocols may aim to gain access to user accounts, steal credentials, or exfiltrate sensitive information. The usage of legacy protocols can indicate vulnerabilities that might be exploited to carry out unauthorized access or espionage within the environment.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Initial Access** (TA0001) through account manipulation,
  - **Credential Access** (TA0006) as attackers may exploit legacy authentication to steal user credentials,
  - **Privilege Escalation** (TA0004) by exploiting compromised accounts to gain elevated permissions.

  Primary data sources for this detection include Azure sign-in logs, which provide critical metadata on user authentication attempts, including the type of client application used.

  ### Investigation Steps
  - **Review Azure Sign-in Logs**: Collect and analyze Azure sign-in logs for the account being monitored, focusing on sign-ins that utilize legacy authentication protocols. Look for unusual login times or locations that deviate from normal user behavior.

  - **Identify User Context**: Determine if the affected account has been compromised by checking recent account activity and privilege changes. Review if the account is part of any exception groups that allow legacy authentication.

  - **Cross-Reference with Security Policies**: Consult your organization's security policies regarding the use of authentication protocols. Ensure that any exceptions for using legacy authentication are documented and valid.

  - **Monitor for Suspicious Activities**: After identifying the use of legacy authentication, monitor for subsequent suspicious activities related to that account, such as unusual access to sensitive resources or attempts to escalate privileges.

  ### Prioritization
  The alert is classified as high severity because the use of legacy authentication protocols poses a significant risk to the security posture of the organization. Attackers often exploit these vulnerabilities to gain unauthorized access to sensitive data and systems, making immediate investigation essential.

  ### Blind Spots and Assumptions
  Detection coverage is limited to environments where Azure sign-in logs are enabled and properly configured. The logic assumes that all legitimate usages of legacy authentication are documented and understood; thus, potential false positives may arise from legitimate users given exceptions. If logs for sign-in activities are not retained or analyzed consistently, there may be gaps in detecting true threats associated with legacy authentication protocols.

