note: |
  ### Technical Context

  This rule detects the use of legacy authentication protocols (e.g., IMAP, SMTP, MAPI) during sign-ins to an account. The likely attacker objective is to exploit less secure authentication mechanisms, potentially allowing unauthorized access to sensitive information or accounts. Relevant MITRE ATT&CK tactics include Persistence (T1078.004) and Credential Access (T1110). Primary telemetry sources include Azure Active Directory sign-in logs. If malicious, this behavior indicates an elevated risk of credential compromise and unauthorized access to resources. However, this detection does NOT confirm an actual compromise on its own; legitimate use by accounts with special exceptions may also trigger it.

  ### Investigation Steps

  - **Review sign-in log entry:** Check Azure AD sign-in logs for Event ID 4624; verify the `ClientApp` type indicates legacy authentication.

  - **Analyze user account status:** Confirm whether the detected account is part of an exception group allowing legacy authentication use, which would indicate legitimate activity versus potential abuse.

  - **Cross-reference logins:** Look for multiple sign-in attempts from different locations or devices within a short time span (e.g., 5 attempts in a minute) that may signal brute force or credential stuffing attempts.

  - **Validate failed sign-in attempts:** Investigate failed logins leading to successful legacy authentication sign-ins within the same time frame, particularly any indication of unusual geographic locations.

  - **Determination of asset criticality:** Assess the role of the affected account (e.g., admin vs. standard user) to gauge potential impact from malicious access to that account.

  ### Prioritization

  Given the potential impact of using legacy authentication on high-privilege accounts, the alert severity is high. The likelihood of malicious abuse is significant because legacy protocols are commonly targeted by attackers seeking to bypass modern authentication controls, thereby increasing the risk of attack.

  ### Blind Spots and Assumptions

  Detection may not capture all exploitation methods, especially if advanced evasion techniques are used (e.g., IP whitelisting or legitimate credential usage). Reliable detection necessitates proper logging of all sign-ins within Azure AD. Legitimate activities, such as service accounts using legacy protocols, may erroneously trigger alerts. A related detection to consider is monitoring for unusual user behavior following successful legacy authentication to strengthen incident response capabilities.

