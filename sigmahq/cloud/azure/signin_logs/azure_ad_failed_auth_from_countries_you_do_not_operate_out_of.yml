note: |
  ### Technical Context

  This rule detects failed authentication attempts originating from countries outside of defined operational regions. The likely attacker objective is to access user accounts using brute-force tactics or stolen credentials from non-local IP addresses, often indicating an attempt at account compromise. This behavior aligns with the MITRE ATT&CK technique for Valid Accounts (T1078.004) under the tactics of Initial Access and Credential Access. The primary telemetry sources include Azure Active Directory sign-in logs, specifically focusing on user authentication events that show the geographical location of the requests. If malicious, the impact could lead to unauthorized data access or account takeover. This detection does NOT confirm that an account is compromised on its own; it only highlights failed access attempts from unrecognized locations.

  ### Investigation Steps

  - **Review sign-in logs for failed authentication attempts**: Check Azure AD sign-in logs (Event ID 50053) for locations outside of operational countries as defined in the organization’s policy. Confirm if the attempts are concentrated in a single IP range or geographic area of concern.

  - **Identify legitimate service usage patterns**: Cross-reference recent successful authentication events (Event ID 50054) or service requests from the same user or service account to see if there’s an acceptable business reason for accessing from those countries.

  - **Analyze user account status and activity**: Look in Azure AD to audit user accounts attempting these logins. Focus on accounts with no expected activity from outside operational territories and flags for potential compromise.

  - **Correlate with other security alerts**: Check for simultaneous alerts involving the same user account. For example, if other alerts indicate lateral movement or privilege escalation (e.g., Event ID 4672 in security logs), mark these as high confidence malicious indicators.

  - **Investigate unusual IP addresses**: Utilize geolocation services to analyze the origins of the IP addresses involved. Look for known malicious IP lists or report the IPs to threat intelligence for potential blocklisting.

  ### Prioritization

  This alert is considered low severity due to the nature of the detection — while there are potential malicious attempts, failed authentications do not equate to guaranteed compromise. However, there is a moderate likelihood of abuse, particularly if the failed attempts correlate with successful logins into critical systems, which could indicate an ongoing attack.

  ### Blind Spots and Assumptions

  This detection may miss legitimate login attempts from legitimate users who travel or use VPNs, especially if authorized by system administrators. Reliable detection requires comprehensive and properly configured Azure AD sign-in logs. Also, if an adversary employs location spoofing techniques or trusted third-party services for proxying traffic, they may evade detection. A related detection could be monitoring for spikes in login failures across multiple user accounts from the same or nearby geographic locations, enhancing the ability to gauge threat level.

