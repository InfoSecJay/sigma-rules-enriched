logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Status: 'Success'
  selection1:
    Location|contains: '<Countries you DO operate out of e,g GB, use OR for multiple>'
  condition: not selection and not selection1
falsepositives:
- If this was approved by System Administrator.
level: low
note: |
  ### Technical Context

  This Sigma rule detects failed authentication attempts from geographic locations that do not correspond with the operational areas of the organization, which may indicate malicious actors attempting to gain unauthorized access. The likely objective of the attacker is credential theft or account compromise, typically aligning with the MITRE ATT&CK techniques for Account Credentials from External Sources (T1078.004) and Brute Force (T1110).

  The primary telemetry source for this detection is Azure Sign-In Logs, specifically monitoring the `Location` field of authentication requests. If left unmitigated, successful breaches could lead to unauthorized access to sensitive systems and data. This detection does NOT confirm that a successful compromise has occurred; a review of the authentication attempts is necessary to determine the legitimacy of the activity.

  ### Investigation Steps

  - **Check for failed authentication patterns:** Review Azure Sign-In Logs with Event IDs related to failed logins, focusing on the `Status` field, which should indicate a value such as 'Failure' for alert generation.

  - **Validate geographic location:** Investigate the `Location` field in the sign-in logs to confirm whether the attempted logins are from countries outside the approved operational countries list. Approved locations should align with business operations.

  - **Identify any successful logins:** Examine if there were successful authentication events immediately following the failures from the same IP addresses or locations, as this could indicate credential stuffing attempts.

  - **Review legitimate user activity:** Look for any prior approvals for access from foreign countries, validating that requests were pre-approved by system administrators, which would indicate that such login attempts should not be flagged as malicious.

  - **Seek evidence of credential exposure:** Investigate for indication of compromised credentials by correlating usernames from the sign-in logs with known data breaches or threat intelligence feeds for malicious IP addresses or previously reported compromised accounts.

  - **Monitor for repetition and volume:** Identify patterns in the volume of failed attempts from specific locations, as repeated access requests might indicate ongoing brute force attacks or insider threats trying multiple credential combinations.

  ### Prioritization

  This alert has a low severity level given the volume of potential false positives from legitimate user activities; however, high-risk systems and sensitive accounts should be prioritized. If the detection is validated, it may signal attempts of credential abuse, which could escalate to more severe incidents if successful.

  ### Blind Spots and Assumptions

  False positives are common in environments with remote or traveling employees. The rule may miss sophisticated attacks from attackers using VPNs or proxies to mask their real locations. Ensuring accurate log data collection from Azure Sign-In Logs is crucial for effective detection. Related detections such as tracking successful authentications from unusual locations can provide additional context and support in profiling possible threats.

