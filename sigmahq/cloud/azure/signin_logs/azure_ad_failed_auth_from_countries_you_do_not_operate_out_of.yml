  ---

  ### Technical Context

  This rule detects failed authentication attempts from geographic locations that do not correspond with the enterprise's operational footprint. The primary attacker objective is to validate compromised credentials or identify valid usernames within the organization. This aligns with the MITRE ATT&CK framework, specifically under the tactic of Credential Access (T1078.004) and Initial Access (T1110). The primary telemetry source is Azure AD Sign-in logs, specifically focusing on sign-in events that include geolocation data. If triggered, this alert indicates possible unauthorized access attempts that could lead to greater compromise if successful. However, this detection does NOT confirm malicious activity on its own, as it may also capture benign attempts from remote users or third-party services.

  ---

  ### Investigation Steps

  - **Review authentication logs:** Check Azure AD Sign-in logs (Event ID 4625) for failed authentication attempts from non-operational countries. Look for repeated failed attempts from the same IP or unusual activity patterns in the log entries.

  - **Identify legitimate exceptions:** Verify if any legitimate users are working remotely or if there has been recent travel to the suspected countries. Confirm with user management records.

  - **Examine user account status:** Look for additional details in the failed logins about the user accounts involved. Check for accounts that have recent password changes or are set to expire soon, as they may have been targeted.

  - **Correlate with threat intelligence:** Leverage threat intelligence feeds to assess whether the IP addresses associated with failed authentication attempts are known malicious sources. Cross-reference the results against threat databases.

  - **Monitor for further attempts:** Implement monitoring to see if there are escalated attempts after the initial failures. Check if there are successful logins following multiple failed attempts, indicating potential credential stuffing.

  ---

  ### Prioritization

  While the immediate impact of a failed authentication attempt is minimal, repeated attempts could suggest malicious activity, especially if they originate from high-risk locations. Given that such methods of credential validation are frequently weaponized by attackers, prolonged diligence is warranted.

  ---

  ### Blind Spots and Assumptions

  This detection may be less effective if log data for Azure AD Sign-in is not fully configured or captured; therefore, reliable logging must be ensured. Users traveling or using VPNs may inadvertently trigger alerts, creating potential noise. A related detection to consider is monitoring for successful logins from anomalous IP addresses following failed attempts, which could provide additional context on any possible unauthorized access.

