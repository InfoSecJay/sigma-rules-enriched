note: |
  ### Technical Context
  This rule detects failed authentication attempts originating from countries where your enterprise does not operate, which may indicate unauthorized access attempts or credential theft. Attackers often try to exploit systems from multiple geographic locations to evade detection and gain access to sensitive information, especially after compromising user credentials. This behavior is commonly associated with various tactics including initial access, credential access, and persistence.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (T1078.004):** Valid Accounts (Credential Dumping)
  - **Credential Access (T1110):** Brute Force
  - **Defense Evasion (various):** Non-Standard Access Patterns

  The primary data source for this detection is Azure's sign-in logs, which contain records of all authentication attempts, including successful and failed logins, and their geographical origins.

  ### Investigation Steps
  - **Review Sign-in Logs:** Analyze Azure sign-in logs for detailed records of failed authentication attempts, focusing on the source IP addresses and geographical locations of the requests.

  - **Identify Unrecognized Locations:** Cross-reference the countries from where failed logins are attempted against your organization's operational regions to confirm unauthorized access attempts.

  - **Check for Anomalous Patterns:** Investigate for patterns of access such as repeated failed logins from the same geographical region and correlate with common attack vectors like credential stuffing or brute force attacks.

  - **Coordinate with System Administrators:** Engage with System Administrators to verify if there are any legitimate business needs for access from the flagged countries or if these attempts should be classified as malicious.

  ### Prioritization
  Despite the low severity level assigned, investigating failed authentication attempts from foreign locations is critical, as they could indicate a potential precursor to more severe incidents involving credential theft or unauthorized system access.

  ### Blind Spots and Assumptions
  This detection may miss legitimate attempts that are permissible due to business needs, such as authorized remote work or partnerships with foreign entities. The rule assumes that the operational geographic boundaries for authentication attempts are well-defined and that all such boundaries are consistently enforced. Ensure that the Azure sign-in logs are enabled and configured properly, as any gaps in logging coverage or misconfiguration may impact detection capabilities.

