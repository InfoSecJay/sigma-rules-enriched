note: |
  ### Technical Context
  This rule detects instances where user access has been blocked by Azure Conditional Access policies. This situation often arises when an attacker attempts to authenticate with valid accounts using stolen credentials, or due to unusual patterns of access that don't conform to established login behaviors. The detection of access blocks serves as an early warning sign of potential unauthorized access attempts aimed at gaining entry into sensitive resources or systems.

  The relevant MITRE ATT&CK tactics include **Initial Access (TA0001)**, which encompasses unauthorized credential access, **Credential Access (TA0006)** when attackers try to exploit valid accounts, and **Defense Evasion (TA0005)** as adversaries might attempt to bypass security measures. Techniques such as **T1110 - Brute Force** and **T1078.004 - Valid Accounts: Domain Accounts** can be particularly relevant here as they involve attempts to leverage legitimate credentials in a blocked manner.

  Primary data sources for this detection include Azure sign-in logs, which track user access attempts and the results of those attempts, such as failed logins due to Conditional Access policies.

  ### Investigation Steps
  - **Review Sign-In Logs**: Check Azure sign-in logs for entries with a ResultType of `53003`, noting any blocked access attempts. Focus on the associated user accounts and the originating IP addresses.
  - **Analyze User Behavior**: Investigate the user activity patterns before the incident. Look for any unusual login attempts, such as logins from unknown geographic locations or IP addresses not typically associated with the user.
  - **Examine Conditional Access Policies**: Assess the Conditional Access policies in place for specific users or groups. Identify any recent changes or misconfigurations that could lead to legitimate users being blocked.
  - **Conduct Reconnaissance on User Accounts**: Utilize tools and queries to identify any recent changes to the affected user accounts, such as password updates or multi-factor authentication settings adjustments.

  ### Prioritization
  The alert is assigned a medium severity due to the potential impact of unauthorized access if such attempts are successful. Continuous unauthorized login attempts can indicate a heightened risk environment, requiring swift response to protect sensitive assets.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Conditional Access policies are not uniformly applied across all accounts or if sign-in logs retention configurations are inadequate. The detection logic assumes that blocks logged by ResultType `53003` are indicative of malicious behavior, but legitimate users might trigger this alert due to valid changes in access policies. Consequently, logging of Azure sign-in attempts and effective configuration of Conditional Access policies are essential for this alert to function correctly.

