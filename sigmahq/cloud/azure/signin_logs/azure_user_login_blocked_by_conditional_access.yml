  ### Technical Context

  This rule detects instances where user access is blocked by Azure Conditional Access policies, specifically when a token issuance is denied (Event ResultType 53003). This behavior typically indicates an unauthorized login attempt, which may be part of an attacker’s reconnaissance or credential stuffing strategy to gain access to valid account credentials. The relevant MITRE ATT&CK tactics and techniques include **Credential Access (T1110)** and **Valid Accounts (T1078.004)**.

  The primary telemetry source for this detection is Azure Sign-In logs, which capture details about authentication attempts and conditional access evaluations. If the blocked attempt is malicious, it may indicate an imminent threat to account security and overall organization integrity. However, this detection does NOT confirm that the access attempt was definitively made by a malicious actor, as there can be legitimate reasons for access being blocked.

  ---

  ### Investigation Steps

  - **Review sign-in logs for the blocked attempts:** Examine the Azure Sign-In logs for events with `ResultType: 53003`. Check the `UserPrincipalName`, `ClientAppUsed`, `Location`, and `Status` fields for contextual information on the blocked access.

  - **Validate user identity and recent activities:** Confirm whether the user associated with the blocked access has any recent suspicious activity, such as multiple failed login attempts or unusual geographic locations. Look for anomalies in events linked to the user in Event IDs associated with sign ins.

  - **Investigate any simultaneous logins:** Cross-reference the `UserPrincipalName` with other sign-in events around the same timeframe. If there are concurrent successful sign-in attempts from different geographical locations, this may indicate credential compromise.

  - **Check for legitimate reasons for access denial:** Assess if there were any recent changes to the Conditional Access policies or user status (e.g., temporary account lock, conditional access changes), which might account for the blocked access.

  - **Analyze API access logs:** If applicable, review any API usage logs related to the affected account for unusual activity or access patterns that could indicate automated attempts to access the account.

  - **Identify high-confidence indicators of compromise:** Look for patterns of failed authentications across multiple accounts or access attempts from known malicious IP ranges. Use threat intelligence feeds to inform the investigation.

  ---

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact on user credentials and the organization’s overall security posture. The likelihood of malicious abuse is real, especially in the context of automated brute-force attack patterns. Unauthorized access attempts are common, making timely investigation critical.

  ---

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques such as IP spoofing and the use of VPNs by attackers to disguise their location. Ensuring comprehensive log collection and proper configuration of Azure Conditional Access policies is crucial for reliable detection. Legitimate users, such as those operating from new locations or devices, may also trigger this alert. A related detection to consider is multiple failed login attempts (T1078.004), which can provide additional context on potential compromise.

