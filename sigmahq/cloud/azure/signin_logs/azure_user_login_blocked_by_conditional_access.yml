note: |
  ### Technical Context

  This rule detects when access to resources is blocked by Azure Conditional Access policies, specifically capturing scenarios where token issuance is denied (ResultType: 53003). Attackers may attempt to exploit valid credentials through unauthorized login attempts as part of their objective to gain persistence or escalate privileges within the environment. Relevant MITRE ATT&CK tactics include "Credential Access" (T1081) and "Initial Access" (T1078.004), particularly regarding managed accounts and external credential access.

  The primary telemetry source comes from Azure sign-in logs, which provide insights into authentication attempts and resultant access levels. If malicious, this behavior could signify an ongoing credential theft attempt or targeted attack, indicating potential unauthorized access to sensitive systems. Importantly, this detection does NOT confirm that the attempted access was indeed made by an unauthorized user, as legitimate users may also trigger this alert under specific conditions.

  ### Investigation Steps

  - **Analyze sign-in logs for failed attempts**: Review Azure sign-in logs (SignInLogs) for additional failed login attempts (Event ID relevant to ResultType: 53003) associated with the same user account to identify potential brute-force activity.

  - **Cross-reference user account activity**: Check for recent activity from the user account in Azure AD, looking for anomalous patterns (failed logins, logins from unusual IP addresses or locations) that could suggest credential abuse.

  - **Evaluate conditional access policies**: Inspect the specific conditional access policy that triggered this block (e.g., requiring multi-factor authentication), and validate if legitimate users have reported access issues, correlating it with organizational access requirements.

  - **Identify high-confidence malicious indicators**: Look for multiple repeated attempts from the same IP address or geographic location associated with known malicious actors; this context can be a strong indicator of attack activity.

  - **Establish baseline legitimate behavior**: Enquire if the user account is expected to authenticate from various devices or locations that would typically require access; if so, correlate these with any unusual access patterns.

  - **Verify compliance with privilege policies**: Ensure that users with administrator roles adhere to your organization’s policies and haven’t been susceptible to credential theft or abuse through phishing schemes or other means.

  ### Prioritization

  This alert has medium severity due to its potential impact on sensitive systems if unauthorized access is attempted. Although it indicates a blocked access attempt, the likelihood of malicious activity is moderate, as unauthorized attempts to exploit valid accounts are common tactics in breach attempts.

  ### Blind Spots and Assumptions

  Detection limitations may occur if not all necessary logging is enabled for Conditional Access, particularly for historical attempts. False positives can arise from legitimate user behavior, such as accessing resources from high-risk networks or changes in their working region. A companion detection, such as monitoring for account lockouts or spikes in failed authentications, would strengthen visibility into possible credential-based attacks.

