  ### Technical Context

  This rule detects instances in which access to a user account has been blocked by Azure Conditional Access policies, indicated by a ResultType of 53003. The likely motive of an adversary triggering this detection is to utilize unauthorized login attempts against valid user accounts, which could lead to credential theft or account compromise. The relevant MITRE ATT&CK tactics and techniques include "Credential Access" (T1110) and "Valid Accounts" (T1078.004).

  The primary telemetry source for this detection is Azure's sign-in logs, specifically looking for entries that indicate blocked access due to adherence to security policies. If this behavior is malicious, it could lead to unauthorized access to sensitive resources, data breaches, or lateral movement. Importantly, this alert on its own does NOT confirm an account compromise; it merely indicates that an access attempt failed due to policy restrictions.

  ---

  ### Investigation Steps

  - **Check logs for access patterns:** Query Azure sign-in logs (Event ID 53003) for the affected user account over the past 72 hours to discern if there were a series of repeated access attempts leading to the block. Multiple failures from unrecognized IP addresses can indicate malicious intent.

  - **Review user account details:** Look into user sign-in history for anomalies such as logins from suspicious geolocations or devices. Validate that these accesses align with known user behavior and expected operational contexts.

  - **Identify high-risk accounts:** Cross-reference the blocked access event with a list of high-privilege user accounts. Determine if the impacted account has elevated permissions, increasing the urgency of the investigation due to potential access to sensitive resources.

  - **Evaluate potential legitimate triggers:** Consider if the blocked access correlates with legitimate actions such as a user attempting to log in from a new device or network. If the user reported access issues, document this interaction for context.

  - **Correlate with incident reports:** Investigate if there are any active incidents or alerts associated with the same time frame that denote other suspicious activities, such as account lockouts or confirmed breaches.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact on high-privilege accounts and the likelihood of being exploited for credential access. While blocked access often signifies normal security protocols, multiple failed attempts from unknown locations heighten the risk of unauthorized access attempts, indicating possible malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if sign-in logs are not correctly configured or if Conditional Access policies do not align with current security practices. Additionally, legitimate users may trigger this alert while accessing from a new location or using a new device. A companion rule that could strengthen detection capabilities is monitoring unusual patterns in user authentication attempts, such as failed logins from known malicious IP addresses.

