note: |
  ### Technical Context
  This rule detects successful authentications to critical applications that utilize only single-factor authentication (SFA). In a security-conscious enterprise environment, the reliance on SFA can pose significant risks, especially for applications that expose sensitive data or facilitate privileged operations. Attackers could exploit this weak authentication method to gain access to important applications, potentially allowing them to perform unauthorized actions such as data exfiltration or privilege escalation.

  Threat actors may leverage credentials obtained through various means, such as phishing or credential stuffing, to authenticate using SFA. These actions align with the MITRE ATT&CK tactics of **Initial Access** (TA0001) and **Privilege Escalation** (TA0004), specifically the technique **Valid Accounts** (T1078). To effectively monitor for these events, telemetry from Azure Sign-In Logs will provide the most relevant evidence, helping security teams identify unauthorized access attempts.

  ### Investigation Steps
  - **Review Authentication Logs:** Analyze Azure sign-in logs for the specified AppId and verify if any suspicious successful logins were made using single-factor authentication. Look for patterns of access that deviate from the norm.
  - **Correlate User Behavior:** Investigate user behavior typically associated with the application in question; check for anomalies such as logins from unusual locations or at odd hours that could indicate misuse of credentials.
  - **Assess User Roles and Permissions:** Check the identity and privileges associated with the accounts that successfully authenticated. Determine if they were authorized to access the application using the provided authentication method.
  - **Evaluate System Administrator Approvals:** Validate if any authenticating actions were pre-approved by a system administrator, which could explain otherwise anomalous logins using SFA in a controlled manner.

  ### Prioritization
  This alert is considered medium severity due to the potential for unauthorized access and the likelihood of exploitation when sensitive applications are protected by only single-factor authentication. Quick and thorough investigation is essential to mitigate risks posed by such a vulnerability.

  ### Blind Spots and Assumptions
  There may be blind spots in detecting non-user-initiated access, such as automated scripts performing successful authentications without alerting to unusual behavior. The detection logic assumes that single-factor authentication should not be used for critical applications without additional context or approval from a system administrator. Required logs must be generated and retained from Azure Sign-In activity for accurate detection and correlation to work effectively.

