logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Status: 'Success'
    AppId: 'Insert Application ID use OR for multiple'
    AuthenticationRequirement: 'singleFactorAuthentication'
  condition: selection
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context

  This rule detects successful authentications to critical applications that only require single-factor authentication, which could indicate an insecure entry point for an attacker. The likely objective of an adversary exploiting this vulnerability is to gain unauthorized access to sensitive data or perform actions that elevate their privileges within a network. Relevant MITRE ATT&CK tactics include **Initial Access (TA0001)** and **Privilege Escalation (TA0004)**, specifically technique **Valid Accounts (T1078)**.

  The primary telemetry source for this detection is Azure Sign-In Logs, focusing on fields where `Status` is "Success," `AppId` reflects targeted applications, and `AuthenticationRequirement` indicates 'singleFactorAuthentication.' If malicious in nature, this behavior could lead to undetected unauthorized actions within critical applications. However, it's important to clarify that this detection alone does not confirm malicious intent; legitimate access by authorized users can also trigger the rule.

  ### Investigation Steps

  - **Review authentication events:** Check Azure Sign-In Logs (Event ID for sign-ins) for `AppId` and `AuthenticationRequirement` fields. Determine whether the access was performed by a legitimate user allowed to use single-factor authentication.

  - **Assess timing and frequency:** Examine historical login patterns for the user or service account (User Principal Name). Frequent access from different locations or times not consistent with the user’s typical behavior can indicate compromise.

  - **Identify anomalous user behavior:** Cross-reference other logs (such as Azure AD logs) for suspicious actions by the user post-authentication, such as creating or modifying administrative roles, unusual application access patterns, or accessing multiple critical apps in a short time frame.

  - **Verify application sensitivity:** Determine the criticality of the applications accessed using single-factor authentication. Assess if these applications contain sensitive data or capability to affect security settings.

  - **Look for lack of multi-factor authentication (MFA):** Check for policies around MFA enforcement for the applications in question. Legitimate authenticated sessions may have records of MFA usage, while single-factor authentications might reflect policy misconfigurations.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential risk associated with single-factor access to critical applications. The likelihood of malicious abuse is moderate; attackers often seek unsecured entry points to advance their objectives. While single-factor authentication is common, its use on sensitive applications is questionable and should be scrutinized.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that don’t enforce or log MFA usage. Adversaries might evade detection using legitimate accounts or through social engineering to bypass security policies. Additionally, legitimate system administrators performing maintenance tasks might trigger this alert. A related detection, such as monitoring for administrative actions taken after single-factor authentications, would enhance overall security awareness and reinforce coverage.

