note: |
  ### Technical Context

  This Sigma rule detects successful authentications to critical applications that utilized single-factor authentication (SFA). The likely attacker objective is to gain unauthorized access to sensitive systems or resources, leveraging weak authentication mechanisms. This behavior fits within the MITRE ATT&CK framework under the tactic "Initial Access" (TA0001), specifically technique "Valid Accounts" (T1078).

  The primary telemetry source comes from Azure sign-in logs, capturing authentication events. If this activity is malicious, it poses a significant risk, as attackers can exploit SFA to gain unauthorized access without robust authentication safeguards. It is important to note that this detection alone does not confirm a security breach, as legitimate users may also authenticate successfully with single-factor methods.

  ### Investigation Steps

  - **Review authentication logs:**
    Check Azure Sign-in logs for Event IDs related to successful authentications (e.g., Event ID 4624) focusing on the specific Application IDs in the Sigma rule. Identify patterns or abnormal access times that may indicate unauthorized use.

  - **Identify users with SFA access:**
    Determine which user accounts successfully authenticated to the applications using single-factor authentication. Cross-reference with user roles and responsibilities to flag any deviations from expected access patterns.

  - **Validate against known user behavior:**
    Compare normal authentication methods for the identified accounts. Users may typically use multi-factor authentication (MFA) for sensitive applications. Authenticating with SFA without legitimate prior approval could be a red flag.

  - **Look for high-confidence malicious indicators:**
    Investigate if any accounts were used from unusual device IP addresses or geolocations that do not align with normal user behavior. This can be observed in the sign-in logs under the "IPAddress" field.

  - **Review approvals for SFA use:**
    Check for documented approvals from system administrators regarding the use of single-factor authentication. Refer to any internal policies on acceptable authentication methods for the applications in question.

  - **Assess potential lateral movement:**
    If an unauthorized access attempt is confirmed, investigate for follow-on actions such as privilege escalation or lateral movement. Look for suspicious accounts performing administrative actions or accessing additional applications.

  ### Prioritization

  The alert severity is medium due to the potential impact of an unauthorized authentication to critical applications. The likelihood of malicious abuse is of concern, particularly if SFA is commonly used across sensitive areas. This behavior is notably weaponized in phishing attacks and exploitation of weak authentication protocols.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by attackers who may use legitimate credentials. SFA can be standard in certain environments, leading to benign triggers if proper approval processes are in place. Required log sources include Azure sign-in logs, and ensuring comprehensive logging configurations is vital for reliable detection. Companion detections to consider include monitoring for unusual activities such as account lockouts or failed login attempts that may signal credential abuse.

