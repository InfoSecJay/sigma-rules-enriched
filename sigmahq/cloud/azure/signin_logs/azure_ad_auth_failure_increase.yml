note: |
  ### Technical Context

  This Sigma rule detects anomalies in sign-in attempts by identifying a sudden increase of 10% or greater in failed authentication attempts, which can indicate brute force attacks, account enumeration, or compromised credentials being used. The likely attacker objective is to gain unauthorized access to user accounts or systems, aligning with MITRE ATT&CK tactic of Credential Access (TA0006) and specifically the technique of Valid Accounts (T1078). The primary telemetry sources include Azure Sign-In logs, specifically focusing on authentication status.

  If the detected behavior is malicious, it poses a significant security risk, as it may indicate ongoing attempts to breach user accounts within the enterprise environment. However, this detection on its own does NOT confirm a successful compromise; it merely indicates a potential attack vector requiring further investigation.

  ### Investigation Steps

  - **Review failed authentication counts:** Check Azure Sign-In logs for Event ID 4625 (failed logon) and compare the counts against historical baselines over a similar timeframe to confirm the 10% increase.

  - **Identify user accounts involved:** Determine which user accounts are experiencing increased failed authentication attempts. Legitimate user patterns typically show failed logins spike in conjunction with either user activity or defined operational periods (e.g., scheduled maintenance).

  - **Analyze geographic login locations:** Examine the sign-in logs for the attempted logins’ geographic locations. Look for unexpected locations or multiple login attempts from the same IP address or geographic region, which are indicators of potential brute force attacks.

  - **Correlate with other security events:** Cross-reference the failed authentications with other related logs (e.g., Microsoft Defender for Cloud alerts or other SIEM event types) for similarly timed security events that might suggest coordinated attack efforts.

  - **Check for account lockouts:** Look in Azure AD for accounts that are currently locked out due to failed sign-ins and assess if the lockouts align with the spike in failed logins, further indicating possible attack activity.

  - **Assess for service account risks:** Investigate any service accounts experiencing failed authentication attempts. Service accounts should have minimal failed logins; repeated failures can indicate legitimate misconfigurations or malicious attempts to exploit such accounts.

  ### Prioritization

  The severity of this alert is medium due to the potential for significant impact on user accounts and organizational access. There is a moderate likelihood of malicious abuse, as credential stuffing and brute force techniques are common in attacks targeting user accounts for initial access.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques such as using legitimate IP addresses or accounts with low usage thresholds to conduct attacks. Reliable detection requires consistent logging of Azure Sign-In events, which may not be enabled in all scenarios. Legitimate activities that could trigger this alert include user password resets or account lockouts due to legitimate user errors. A companion detection to consider is monitoring for unusual successful logins following this spike in failed attempts, providing a clearer picture of potential account compromises.

