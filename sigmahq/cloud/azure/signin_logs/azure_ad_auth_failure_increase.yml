note: |
  ### Technical Context

  This rule detects a significant increase in failed authentication attempts—specifically, a rise of 10% or more—during a defined analysis period. This behavior may indicate an adversary attempting to brute-force credentials, exploit misconfigured services, or conduct reconnaissance before gaining unauthorized access.

  Relevant MITRE ATT&CK techniques include **T1078: Valid Accounts**, within the tactics of credential access, persistence, and initial access. Primary telemetry sources are Azure signin logs, focusing on the status field for failed authentication events. A successful malicious outcome could lead to unauthorized access, lateral movement, or account compromise. This detection does NOT confirm malicious intent on its own; legitimate users may also trigger this alert due to misconfigured clients or forgotten passwords.

  ### Investigation Steps

  - **Verify recent authentication patterns:** Review signin logs (Azure) for the account in question, identified by Event Type "Failure", and analyze if the increased count is related to a specific user, time frame, or geographic anomalies.

  - **Analyze account activity history:** Check for recent failed attempts (Event ID 4625) within Azure logs. Prioritize accounts that show a significant deviation from historical authentication behavior.

  - **Correlate with known IPs:** Investigate the source IP addresses of failed attempts. Compare them against known internal locations that should not produce such authentication attempts.

  - **Identify legitimate user impact:** Confirm whether the increase aligns with scheduled activities, such as system maintenance or employee onboarding. Review communication with users to validate the context behind failed attempts.

  - **Assess high-risk accounts:** Focus on high-privilege accounts that are critical to your environment. Failed attempts on these accounts can signify attempted privilege escalation or targeted attacks.

  - **Monitor for subsequent success:** After determining potential malicious behavior, track if successful logins occur shortly after the increase in failed attempts for the same accounts, indicating potential compromise.

  ### Prioritization

  This alert is medium severity due to the potential for credential abuse, especially in critical accounts. The likelihood of malicious abuse is considerable if the increase correlates with external threat patterns or high-privilege accounts. Such behavior can be commonly weaponized in initial access or privilege escalation pathways.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate users to inadvertently trigger multiple failed logins, thus masking true malicious actions. Required logs must be accurately configured to capture all authentication attempts effectively. Additionally, attacks from trusted insiders or with compromised internal accounts may not generate alerts. Companion detections related to account creation or recovery activities can enhance surveillance and context around failed authentication attempts.

