title: Users Authenticating To Other Azure AD Tenants
id: 5f521e4b-0105-4b72-845b-2198a54487b9
status: test
description: Detect when users in your Azure AD tenant are authenticating to other
  Azure AD Tenants.
references:
- https://learn.microsoft.com/en-gb/entra/architecture/security-operations-user-accounts#monitoring-external-user-sign-ins
author: MikeDuddington, '@dudders1'
date: 2022-06-30
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Status: 'Success'
    HomeTenantId: 'HomeTenantID'
  filter:
    ResourceTenantId|contains: 'HomeTenantID'
  condition: selection and not filter
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context
  This detection rule identifies when users within an Azure Active Directory (Azure AD) tenant successfully authenticate to other Azure AD tenants, which could indicate potential account abuse or credential compromise. The behavior is concerning as attackers may seek to gain access to services or data in other tenants by leveraging valid user credentials. This act can lead to unauthorized data access or lateral movement between environments.

  The suspected threat behavior aligns with the MITRE ATT&CK framework, particularly under the techniques for **Initial Access** (T1078 - Valid Accounts) and **Privilege Escalation**. Attackers may exploit valid account credentials to access resources across different Azure AD tenants, escalating their privileges and broadening their attack surface. The primary data source for this detection is Azure AD sign-in logs, which capture authentication events and related attributes.

  ### Investigation Steps
  - **Review Azure AD Sign-in Logs**: Analyze the logs for entries indicating successful user authentication to non-home tenant resources. Pay special attention to timestamps, user accounts involved, and the number of unusual entries.

  - **Correlate with User Activity**: Cross-reference authentication attempts with regular user activity patterns to identify any anomalies or deviations from expected behavior. Check for users engaging in actions typically associated with lateral movement or privilege escalation.

  - **Identify Home Tenant Mismatch**: Investigate cases where the `HomeTenantId` does not match the `ResourceTenantId`. Document any legitimate business reasons for such activity, as approved access may lead to false positives.

  - **Assess User Roles and Permissions**: Review the permissions assigned to the users involved in these activities. Determine whether there are any anomalous permissions that suggest potential abuse or compromise of accounts.

  ### Prioritization
  Alerts for users authenticating to other Azure AD tenants should be treated with a medium severity due to the potential for unauthorized access and data exfiltration. The risk is elevated in cloud environments where multiple tenants may hold sensitive data, making it critical to promptly investigate such alerts.

  ### Blind Spots and Assumptions
  This detection rule may not capture all unauthorized access attempts if users have legitimate reasons to authenticate across tenants, particularly in organizations that require cross-tenant collaboration. The detection logic assumes that all sign-in activities by users to their home tenant are authorized, potentially missing compromised accounts involved in malicious activities. It requires that sign-in logs for external authentication events are enabled and correctly configured to facilitate comprehensive monitoring.

