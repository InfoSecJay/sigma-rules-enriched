  ---

  ### Technical Context

  This rule detects successful user authentication attempts to Azure Active Directory (Azure AD) tenants other than the user's home tenant. The potential attacker objective could involve using stolen or misconfigured credentials to access sensitive resources or conduct malicious activity in another organization's environment. This behavior aligns with the MITRE ATT&CK framework, specifically under the tactic "Credential Access" (ID: T1078.004) related to "Valid Accounts".

  The primary telemetry sources for this detection include Azure AD sign-in logs, specifically focusing on fields indicating the `HomeTenantId` and `ResourceTenantId`. If this activity is malicious, it could lead to unauthorized data access or lateral movement within a target environment. However, this detection does NOT confirm that the authentication event is malicious, as legitimate users may also connect to multiple tenants for business purposes.

  ---

  ### Investigation Steps

  - **Verify authentication details:** Review Azure AD sign-in logs (AuditLogs or SignIns) for the user in question. Check for `ResourceTenantId` indicating access to unexpected or unauthorized Azure AD tenants.

  - **Check user roles and permissions:** Inspect the user's role in Azure AD (e.g., via Azure Portal or using PowerShell `Get-AzureADUser`). Legitimate users may have a valid reason for accessing another tenant if they are authorized/licensed for such activities.

  - **Identify abnormal authentication patterns:** Look for unusual IP addresses or locations associated with the sign-in event by examining the `ClientAppUsed` and `IPAddress` fields in sign-in logs. Cross-reference with historical sign-in patterns for the user.

  - **Flag additional accounts involved:** If one user is accessing multiple Azure AD tenants, investigate related accounts or potential delegation configurations to identify if this indicates credential misuse across sessions.

  - **Assess for recent administrative appointments:** Determine if the user changed roles or if system administrators approved the cross-tenant access by checking logs for role changes or newly assigned Azure AD privileges.

  - **Analyze failed sign-in attempts:** Review sign-in logs for the same account for any failed attempts or unusual alerts prior to the successful authentication, noting patterns that might indicate credential stuffing or compromise.

  ---

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on sensitive data if the system is critical and the likelihood of malicious abuse is moderate. Cross-tenant access is not commonplace, raising suspicions, particularly if the sign-in fails to correlate with expected business activities.

  ---

  ### Blind Spots and Assumptions

  Detection may not capture attempts by compromised accounts if the legitimate user accesses other tenants consistently. Moreover, proper Azure AD sign-in log configurations are necessary to ensure complete visibility. Legitimate accounts belonging to contractors or partners may trigger the alert if accessing other tenants is part of their role. Related detections could include alerts for multiple failed authentication attempts from a single user, signifying potential credential abuse attempts.

