title: Users Authenticating To Other Azure AD Tenants
id: 5f521e4b-0105-4b72-845b-2198a54487b9
status: test
description: Detect when users in your Azure AD tenant are authenticating to 
  other Azure AD Tenants.
references:
- https://learn.microsoft.com/en-gb/entra/architecture/security-operations-user-accounts#monitoring-external-user-sign-ins
author: MikeDuddington, '@dudders1'
date: 2022-06-30
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.stealth
- attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Status: 'Success'
    HomeTenantId: 'HomeTenantID'
  filter:
    ResourceTenantId|contains: 'HomeTenantID'
  condition: selection and not filter
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context

  This rule detects successful user authentication attempts in Azure AD where users from your tenant are trying to access other Azure AD tenants. The behavior is indicative of potential account compromise, lateral movement, or abuse of permissions where an attacker may attempt to leverage an existing user account to gain access to external resources. This aligns with the MITRE ATT&CK techniques for Persistence (T1078.004) and Initial Access (T1078).

  The primary telemetry source for this detection is Azure Sign-In logs, specifically the sign-in events that capture authentication details. If this behavior is malicious, it can lead to unauthorized access to sensitive resources across multiple tenants. Importantly, this detection does NOT confirm that the user is malicious; it only indicates the action of accessing an external tenant, which may or may not be legitimate.

  ### Investigation Steps

  - **Verify user activity:** Review the user's recent sign-in logs (Sign-in logs in Azure AD) to identify legitimate activity patterns, such as accessing multiple tenants as part of managed operations or collaboration. Look for a consistent history of accessing the same tenants.

  - **Examine authentication details:** Check Event ID: 4624 in the Azure Sign-In logs for the specific authentication attempts, including the `App ID`, `Location`, and `User Principal Name`. Correlate these with known legitimate access requests to determine if the activity is expected.

  - **Identify high-risk logins:** Look for IP addresses or geographic locations that are unusual for the user or organization. Use `ClientAppUsed` and `Location` fields in the sign-in logs to correlate against normal operating patterns.

  - **Cross-reference with admin approvals:** Confirm if any approved external access was granted for the user (e.g., check with the System Administrator) by reviewing approval logs in Azure AD. Any successful sign-ins without such approvals should raise an alert.

  - **Check for exfiltration attempts:** Validate that there were no subsequent actions performed by the user that indicate data download or exfiltration following the successful authentication to another tenant. This may involve reviewing access logs for data-sensitive applications.

  ### Prioritization

  This alert carries medium severity due to the potential for unauthorized access across tenant boundaries, which can compromise sensitive data. While successful sign-ins could indicate legitimate collaboration, the likelihood of malicious abuse by attackers leveraging stolen credentials makes this behavior concerning.

  ### Blind Spots and Assumptions

  Detection may miss legitimate multi-tenant collaborations sanctioned by admins. Evasion techniques could include attackers using legitimate credentials or already compromised accounts for access. Additionally, log sources need proper configuration to capture all relevant sign-in events reliably. A related detection could involve monitoring Azure AD audit logs for changes to user permissions that coincide with tenant authentications.

