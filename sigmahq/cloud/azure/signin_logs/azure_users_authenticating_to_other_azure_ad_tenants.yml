logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Status: 'Success'
    HomeTenantId: 'HomeTenantID'
  filter:
    ResourceTenantId|contains: 'HomeTenantID'
  condition: selection and not filter
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where users in a specific Azure Active Directory (Azure AD) tenant are successfully authenticating to other Azure AD tenants. The likely attacker objective could be to escalate privileges, potentially leading to unauthorized access to sensitive data or resources across multiple tenants. This activity is relevant to the MITRE ATT&CK tactic of "Initial Access" (TA0001), specifically the technique of "Valid Accounts" (T1078.004). The primary telemetry source for this detection comes from Azure AD sign-in logs, specifically focusing on fields such as Status, HomeTenantId, and ResourceTenantId. If this activity is malicious, it could signify an account compromise or misuse of credentials, posing a security risk to the organization's data integrity across its AD environment. Importantly, this detection does NOT prove malicious intent on its own; authorized user actions with approval may generate similar log entries.

  ### Investigation Steps

  - **Review Azure AD sign-in logs:** Check for Event ID 4624 (logon) and Azure AD Sign-in logs for the specified user account, focusing on the Status (should be 'Success') and verifying if the ResourceTenantId is different from the HomeTenantId.

  - **Identify high-confidence malicious indicators:** Look for multiple successful authentications to varying Azure AD tenants from a single user account within a short timeframe. This could indicate credential misuse or an account compromise.

  - **Validate legitimate activity:** Confirm whether the user was scheduled for activities that require access to multiple tenants and verify if this behavior aligns with business operations. Check for any entries in the Change log or Communications logs that might indicate legitimate administrator approvals.

  - **Examine failed logins for additional context:** Access Azure AD sign-in logs for the same user to identify any patterns of failed attempts that could suggest prior reconnaissance and password guessing against multiple tenants.

  - **Evaluate the sensitivity of affected resources:** Assess the criticality of resources accessed in the context of potential risks due to the sign-ins. Specifically, look for any access requests for high-value data categorized under Business Impact Analysis (BIA).

  - **Cross-reference with previous alerts:** Look for historical alerts linked to the user’s account or the specific tenant(s) to determine if this behavior forms part of a broader attack pattern. This includes referencing prior detection events involving privileged account usage.

  ### Prioritization

  This alert is medium severity due to the potential impact on sensitive data when users authenticate across multiple Azure AD tenants, which may increase the likelihood of malicious account abuse. While not commonly weaponized, such behavior can indicate compromised credentials being excessively used in an organization's cloud environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging from all Azure AD tenants, making it unclear whether changes are authorized. Additionally, legitimate administrator actions may inadvertently trigger this alert, indicating a need for careful evaluation of user roles and permissions. A related detection to consider is the monitoring of account creation or modification logs in Azure AD, as these can provide additional context to user actions related to impersonation or unauthorized access.

