note: |
  ### Technical Context

  This Sigma rule detects failed login attempts to accounts that have been explicitly disabled by an administrator, indicated by a ResultType of `50057`. The likely objective of an attacker attempting to access a disabled account may include privilege escalation, reconnaissance, or various persistence techniques, particularly if they are trying to gain access to a higher-level account. This behavior aligns with the MITRE ATT&CK framework under the tactic of **Persistence** (TA0003) and the technique **Valid Accounts** (T1078.004).

  The primary telemetry source is Azure Sign-in logs, specifically focused on the `signinlogs` dataset, which captures detailed authentication attempts including outcome codes. If the sign-in attempts are from a malicious actor, they could indicate a significant security threat, potentially compromising sensitive data or accounts. However, it is crucial to note that this detection alone does NOT confirm any successful access or compromise; it merely indicates that an attempt was made against a disabled account.

  ### Investigation Steps

  - **Review sign-in logs for failed attempts**: Check Azure Sign-in logs for Event ID associated with ResultType `50057` to verify the failed login attempts on disabled accounts. Look for UserPrincipalName fields that match known disabled account patterns.

  - **Correlate user account status**: Verify the current status of the accounts in question through the Azure AD portal. Ensure that the accounts are indeed marked as disabled and review the disabling actions to identify potential legitimate reasons for the status.

  - **Identify potentially malicious patterns**: Look for multiple failed login attempts from the same IP address or geographic location, particularly if they are anomalous (e.g., outside regular access hours) as these may indicate brute-force attempts or automated scripts targeting disabled accounts.

  - **Document expected user activity**: Note any legitimate user workflows that involve access attempts on accounts, such as password reset requests or administrative actions, to differentiate from clearly unauthorized attempts.

  - **Cross-reference other logs**: Validate against other log sources, such as CloudTrail or Azure ATP logs, for any prior actions taken against these accounts or similar suspicious behavior that could indicate a coordinated attack.

  - **Assess security implications**: If a malicious intent is confirmed, determine if the involved accounts have elevated privileges that could allow attackers to escalate within the system, requiring urgent incident response measures.

  ### Prioritization

  This alert carries medium severity in an enterprise context due to the potential threat of unauthorized access attempts against disabled accounts, which may indicate either an active threat (e.g., attempted use of valid but disabled accounts) or reconnaissance behavior. Given the often weaponized nature of account compromise strategies, swift investigation is essential.

  ### Blind Spots and Assumptions

  Detection might be limited if accounts are disabled but not logged correctly or if the Azure log retention policies are insufficient, leading to gaps in the sign-in logs. Additionally, legitimate users attempting to access their accounts post-administrative role changes may inadvertently trigger this alert. To strengthen coverage, consider companion detections that monitor for changes to account statuses, such as account enablement alerts or unusual administrative activities related to user accounts.

