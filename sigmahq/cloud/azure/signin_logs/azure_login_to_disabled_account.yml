  ---

  ### Technical Context

  This Sigma rule detects failed login attempts to accounts that have been explicitly disabled by an administrator, identified by ResultType 50057 and a specific failure description. The likely objective of an attacker triggering this behavior could include reconnaissance or brute-force attempts to gain access to a system using disabled accounts, potentially leading to privilege escalation or persistence if successful. This relates to the MITRE ATT&CK tactic "Initial Access" and technique "Valid Accounts" (T1078.004).

  The primary telemetry sources for this detection are Azure Sign-in Logs, specifically looking for events where users attempt to log in to disabled accounts. If malicious, this activity can lead to significant security impacts, including unauthorized access attempts or system compromises. However, this detection alone does NOT confirm that any successful compromise has occurred.

  ---

  ### Investigation Steps

  - **Check sign-in logs for failed attempts:** Review Azure Sign-in Logs for Event ID related to ResultType 50057 for the specific disabled account. Track timestamps to correlate with other activities that may indicate ongoing attack patterns.

  - **Identify account ownership and role:** Determine legitimate ownership of the disabled account by cross-referencing with user management systems. Assess whether the account was recently disabled and confirm if any recent changes to the user’s permissions were documented.

  - **Investigate spikes in failed login attempts:** Look for patterns over time in failed login events for related accounts. Anomalies, such as multiple failed attempts from the same IP address (identified in the log field "Client IP"), can indicate malicious intent.

  - **Review legitimate access patterns:** Understand typical access behavior for the disabled account. If the account was active prior to disabling, document normal access times and frequency to differentiate between typical user behavior and suspicious activity.

  - **Examine adjacent account activities:** Evaluate the sign-in attempts on adjacent accounts to identify whether credentials are being targeted or if the attempts correlate with other suspicious activities within the network.

  ---

  ### Prioritization

  This alert should be considered medium priority due to the potential for significant impact if leveraged by an attacker to gain access to sensitive systems. The likelihood of malicious abuse is moderate, as disabled accounts are not typically accessed under normal operational circumstances. This behavior is not commonly weaponized but can indicate preparatory or reconnaissance activity preceding an attack.

  ---

  ### Blind Spots and Assumptions

  This detection could be evaded by attackers using general enumeration techniques to probe account states or by exploiting vulnerability cases of account management workflows. Reliable detection requires comprehensive logging configurations for Azure sign-in activities. Legitimate activities, such as administrators performing account audits, may trigger this alert. A related detection to strengthen coverage could involve monitoring for enumeration attempts against user accounts, focusing on succeed and failed login attempts across various account states.

