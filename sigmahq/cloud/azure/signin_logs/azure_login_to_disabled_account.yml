note: |
  ### Technical Context
  This detection rule monitors login attempts made to accounts that have been explicitly disabled within the Azure Active Directory environment. Specifically, it logs instances where an attacker or unauthorized user tries to authenticate using the credentials of an account that has been turned off for access, potentially indicating an attempt to retroactively access resources protected by that account. The threat scenarios around this detection could involve various malicious objectives, such as testing the security posture of the target environment, attempting to leverage credentials from compromised accounts, or evading traditional security mechanisms by attempting to gather intelligence on disabled accounts.

  The relevant MITRE ATT&CK techniques associated with this detection include **T1078.004 (Account Manipulation: Application Account)**, which relates to manipulating accounts in such a manner as to circumvent controls. The attempt to authenticate with disabled accounts also falls under tactics related to **Initial Access**—the initial entry point for an attacker—and **Persistence**, as attackers might try to access previously disabled accounts to regain access to systems after being temporarily barred.

  Primary data sources for this detection include Azure Sign-in Logs (specifically logs that document authentication attempts), which will provide key telemetry regarding login behavior, including timestamps, IP addresses, and results of sign-in attempts.

  ### Investigation Steps
  - **Examine Sign-in Logs:** Review Azure Sign-in logs to identify the specific timestamps, usernames, and IP addresses associated with the failed login attempts to disabled accounts.
  - **Identify Source of Attempts:** Investigate the source of the authentication attempts, particularly focusing on unusual IP addresses or geographic locations that may not be expected for authorized users.
  - **Cross-reference Disabled Accounts:** Cross-reference the sign-in attempt log with the list of disabled accounts to verify which accounts were targeted and their significance within the environment.
  - **Look for Patterns:** Analyze for patterns of repeated attempts across multiple disabled accounts, which may indicate automated tools or scripted attempts being employed against the organization.

  ### Prioritization
  The medium severity of this alert is warranted, as multiple failed login attempts to disabled accounts could indicate an ongoing reconnaissance effort or an automated attack, potentially enabling further malicious actions if successful. While individual attempts may not indicate immediate compromise, patterns may suggest a larger threat.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the lack of visibility into login attempts made from internal networks or configurations that might obscure the origin of the login attempts. The detection logic assumes that all disabled accounts will be reflected in the Azure Sign-in logs and that relevant logging settings are appropriately configured. If logging is insufficient or disabled accounts are not properly maintained, the rule may generate false negatives. Additionally, any configurations restricting access to disabled account information will hinder the effectiveness of the detection.

