note: |
  ### Technical Context

  This rule detects failed login attempts to accounts that have been administratively disabled, indicated by the ResultType 50057 and a corresponding description from Azure Sign-In logs. The behavior typically suggests an adversary attempting to gain access to an account that they believe is still active, possibly as a part of a credential harvesting or lateral movement strategy. The relevant MITRE ATT&CK technique is "Valid Accounts" (T1078.004).

  Primary telemetry sources include Azure Sign-In logs, particularly focusing on the fields detailing ResultType and ResultDescription. If malicious in nature, this type of behavior could signal an escalation attempt or continued reconnaissance by an adversary. It is essential to note that this detection alone does not confirm ongoing unauthorized access or successful exploitation of any accounts.

  ### Investigation Steps

  - **Review Azure Sign-In Logs:**
    Examine Azure Sign-In logs for Event ID representing the specific login attempt. Focus on the entries with ResultType 50057 to identify which disabled accounts are being targeted.

  - **Correlate Account Status:**
    Verify the status of the targeted accounts in Azure AD. Confirm whether these accounts are marked as disabled and ensure no recent administrative changes have occurred that would warrant these login attempts.

  - **Look for Repeated Attempts:**
    Identify any patterns or repeated occurrences of failed login attempts over a short timeframe from the same IP address or user agent. This may indicate automated scripts or tools being used by an adversary.

  - **Assess User Activity:**
    Check audit logs for normal activity associated with the disabled accounts. Note legitimate administrative operations that may have inadvertently triggered this alert, such as legitimate privileged user actions or changes made prior to the account disablement.

  - **Identify IP Geolocation:**
    Analyze the source IP addresses for origin and reputation. High-risk geolocations or IPs known for malicious activities should elevate the alert's priority.

  - **Cross-Reference to Other Logs:**
    Examine adjacent logs, such as those from Azure Active Directory for any activities involving other accounts from the same user group or historical access patterns that could indicate lateral movement attempts.

  ### Prioritization

  This alert carries medium severity due to the potential impact of unauthorized access attempts against disabled accounts. While these accounts are inactive, the likelihood of an adversary abusing this misconfiguration to further their objectives remains plausible. As a common tactic, such activity may lead to privilege escalation or systems compromise if not addressed.

  ### Blind Spots and Assumptions

  Detection may miss attempts if logs are not fully configured or retained, as certain activities may not be logged comprehensively. Legitimate activities, such as an admin's attempts to verify credentials during an account review, may trigger similar alerts. Additionally, related detections that monitor successful logins to active accounts (such as those with unusual behavior) would help strengthen overall coverage for credential misuse scenarios.

