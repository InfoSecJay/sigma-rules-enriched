note: |
  ### Technical Context
  This rule detects instances where users are attempting to log in but failing to complete multifactor authentication (MFA). This can signify potential account compromise, where an attacker possesses valid credentials but lacks the necessary second factor for authentication. The key objectives of such an attack often include unauthorized access to sensitive systems or data by exploiting weaknesses inherent in MFA implementations.

  In the landscape of cybersecurity, the tactics and techniques related to this detection can primarily be linked to the MITRE ATT&CK framework. Relevant tactics include **Initial Access** (TA0001), as the attacker is attempting to gain access through legitimate credentials, and **Credential Access** (TA0006), particularly the technique **Valid Accounts** (T1078.004), which highlights the use of valid user accounts for unauthorized access. The primary data source for this rule is the Azure Active Directory sign-in logs, which document authentication attempts and failures, providing critical context for the investigation.

  ### Investigation Steps
  - **Review Sign-in Logs**: Examine Azure sign-in logs for events associated with ResultType 50074 and 500121. Look for repeated authentication failures for the same user account, which may indicate a brute-force attempt or an attacker trying to bypass MFA.
  - **Analyze User Behavior**: Investigate the affected user's recent activity for any unusual logins or access patterns that deviate from their normal behavior, which could help identify if the account was compromised.
  - **Inspect MFA Configuration**: Verify the MFA settings for the affected user accounts to ensure they comply with security policies and check if any recent changes have been made to the MFA configuration that could affect authentication.
  - **Evaluate Related Alerts**: Cross-reference with other security alerts generated during the same timeframe, especially focusing on potential phishing attempts or suspicious login activities that may have predated the authentication failures.

  ### Prioritization
  This alert carries a medium level of severity due to the potential for a compromised account being targeted for unauthorized access. The combination of leaked credentials and failed MFA challenges suggests an active effort to exploit accounts, necessitating prompt response to mitigate risk.

  ### Blind Spots and Assumptions
  Detection logic inherently assumes that users will consistently utilize MFA and that failure logs will accurately reflect these interactions. Gaps in coverage may occur in environments where MFA is inconsistently enforced across applications or services. Furthermore, if logging for Azure sign-in attempts is not properly configured or is missing, the effectiveness of this alert will be significantly diminished, requiring comprehensive logging configurations to ensure all relevant data is captured and available for analysis.

