note: |
  ### Technical Context

  This rule detects failed multifactor authentication (MFA) attempts where a user has successfully entered their password but is unable to continue due to MFA challenges. This behavior may indicate that an attacker has obtained user credentials but has not gained access to the second factor, potentially signaling credential theft attempts or brute force attempts against MFA. This relates to the MITRE ATT&CK tactics of Credential Access (TA0006) with techniques including Valid Accounts (T1078.004) and Abuse Elevation Control Mechanism (T1110).

  The primary telemetry source is Azure Sign-In Logs, specifically looking for Event IDs that indicate MFA failures (ResultType 50074 and 500121). If malicious, this activity could lead to a successful compromise of user accounts and access to sensitive resources. Importantly, this detection does NOT confirm that an account has been compromised or that an attack is actively in progress without additional context.

  ### Investigation Steps

  - **Check Sign-In Logs:** Review Azure Sign-In Logs for ResultType 50074 and 500121 to identify specific timestamps and user accounts involved in MFA failures.

  - **Identify Legitimate Use Cases:** Determine if the users involved commonly experience MFA issues—such as using shared devices or experiencing connectivity issues—to distinguish between benign behavior and potential malicious activity.

  - **Correlate with Account Activity:** Examine any recent account activity in Azure AD (Audit logs) for unusual patterns, such as abnormal login locations or times, to detect potential account takeover attempts.

  - **Validate User Context:** Investigate if the attempted account access aligns with the user’s role. For instance, confirm if the user is authorized to access critical systems a high-risk target.

  - **Look for Repeated Failures:** Identify users with multiple consecutive failures in a short timeframe, as this can indicate brute force attempts or unauthorized login behaviors.

  - **Monitor for Related Alerts:** Check for other alerts related to credential access attempts or account lockouts that may complement this alert, enhancing the understanding of the context and threat level.

  ### Prioritization

  This alert is of medium severity as it indicates potential credential compromise involving multifactor authentication, which is a common method used by attackers when targeting accounts. The likelihood of malicious use is significant, especially for accounts with access to sensitive data. However, it can also occur through legitimate user errors.

  ### Blind Spots and Assumptions

  The main detection limitation is that attackers may exploit legitimate accounts to generate noise, making distinguishing between real threats and benign issues challenging. Reliable detection requires comprehensive Azure logging configurations, particularly for sign-in and user activity logs. Legitimate users may inadvertently trigger these alerts, such as during a device change or in cases of MFA app malfunction. Companion detections, like monitoring for unusual login patterns or failed access attempts, can strengthen overall security posture.

