note: |
  ### Technical Context

  This Sigma rule detects failed multifactor authentication (MFA) attempts for user logins, indicating that an attacker may have acquired a valid username and password but is unable to complete the authentication process. The likely objective is to gain unauthorized access to sensitive accounts without the necessary second factor of authentication. This behavior aligns with the MITRE ATT&CK techniques for credential access (T1078.004: Valid Accounts) and defense evasion (T1110: Brute Forcing).

  The primary telemetry source is Azure sign-in logs, specifically focusing on ResultType 50074 and 500121 related to MFA failures. If malicious, successful exploitation could lead to significant compromise of user accounts and associated resources. However, this detection alone does not confirm an active attack, as multiple failures could also indicate legitimate users having trouble with MFA prompts.

  ### Investigation Steps

  - **Examine MFA logs for failures:** Identify all instances of ResultType 50074 or 500121 within Azure sign-in logs during the alert timeframe. Look for repeated failed attempts on the same user account, which could indicate suspicious behavior.

  - **Check account status:** Look up the user account in Azure AD for any account lockouts or changes in authentication methods that may suggest legitimate issues, especially if multiple failed attempts coincide with recent password changes.

  - **Review successful logins:** Analyze recent successful sign-in events (Event ID 4624) for the affected account post-MFA failures to identify if an unauthorized access attempt was completed after bypassing MFA.

  - **Identify source IP addresses:** Cross-reference the sign-in attempts with geolocation data to determine if the IP addresses are from known locations or if they are anomalous to the user’s historical login patterns.

  - **Observe legitimate user behavior:** Confirm whether the user typically enables MFA, as consistent MFA engagement indicates they likely are not attempting to evade it but encountering issues instead.

  - **Assess for brute force attacks:** Use event log data (Event ID 4625 for failed logins) to check if there are multiple failed login attempts within a short time frame that could signify a brute force attack against accounts with weak passwords.

  ### Prioritization

  The severity of this alert is medium within an enterprise context due to the potential for significant account compromise, especially regarding privileged accounts. While not all MFA failures indicate malicious behavior, the increasing trend of credential stuffing attacks raises the likelihood of genuine threats. The ability of attackers to exploit compromised credentials makes monitoring for such activities essential.

  ### Blind Spots and Assumptions

  This detection may be limited by typical user activities like frequent logouts or configuration changes that could trigger MFA failures. Evasion techniques include attackers using proxy servers or VPNs to mask their true IP addresses when attempting access. Reliable detection requires correct configuration of Azure sign-in logs, particularly around MFA events. Related detections include monitoring for abnormal password reset requests which may precede or follow failed MFA attempts.

