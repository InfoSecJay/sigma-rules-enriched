note: |
  ### Technical Context

  This rule detects the use of AzureHound, a tool used by adversaries to collect and analyze data from Microsoft Azure environments. The likely attacker objective is to map out the Azure Active Directory (AAD) environment, identifying users, groups, and roles to facilitate further actions like privilege escalation or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of "Discovery" (TA0007) and the technique "Account Discovery" (T1087.004) as well as "Application Layer Protocol" (T1526).

  The primary telemetry source is Azure Sign-in Logs, specifically looking at the User-Agent string indicating the use of AzureHound during successful authentications (ResultType: 0). If malicious, this activity could lead to compromising user accounts and sensitive data. However, this detection does NOT confirm that the tool was used maliciously, as legitimate users may also use similar tools for authorized inventory and auditing activities.

  ### Investigation Steps

  - **Check for AzureHound signatures**: Look for User-Agent strings containing “azurehound” in Azure Sign-in Logs (Log type: signinlogs) within Event ID: 4624. Malicious activity will have this signature; benign activity may not correlate with known user activity.

  - **Assess user behavior**: Review the user accounts associated with the detected User-Agent. Compare logins against typical access patterns for the user. Activity from a service account without prior related login history can indicate atypical or malicious usage.

  - **Correlate with AAD group memberships**: Investigate Azure directory and group memberships for the affected user via Azure AD logs (Audit logs). Legitimate admin users may perform similar actions, while uncommon group memberships could signal compromised accounts.

  - **Identify geographical anomalies**: Identify the origin IP addresses of the sign-in attempts in the sign-in logs. Compare with the organization's known IP ranges. Malicious actors might use unknown external IPs or log in from unusual geographic locations.

  - **Monitor for additional reconnaissance tools**: Check for the use of other reconnaissance tools alongside AzureHound, such as utilizing Azure CLI commands or PowerShell scripts. These can be tracked in logs for Azure activities.

  - **Blacklist or whitelist legitimate tools**: Ensure a policy exists for legitimate tools that staff may use for Azure management. Documenting acceptable User-Agent strings will help differentiate benign use from potential threats.

  ### Prioritization

  This alert is considered high severity as it blooms from actions that directly impact the cloud identity management system, possibly leading to substantial data exposure. The likelihood of malicious abuse is significant, as tools like AzureHound are common in unauthorized reconnaissance activities typically carried out by adversaries.

  ### Blind Spots and Assumptions

  This detection has limitations as sophisticated attackers may modify User-Agent strings to evade detection. Continuous log collection from Azure Sign-in Logs and proper configurations are essential for reliable detection. Legitimate applications or services using AzureHound for authorized assessments can trigger this alert, highlighting the need for proper use case documentation. A related detection to enhance coverage would be monitoring for anomalous administrative actions within Azure AD, indicating misuse following the discovery phase.

