note: |
  ### Technical Context
  This detection rule identifies activity associated with AzureHound, a BloodHound data collector specifically designed for Microsoft Azure environments. When attackers successfully authenticate to Azure services, they may utilize AzureHound to gather information about the structure and permissions of Azure Active Directory (AD). This enables them to map out the environment and identify high-value targets or pathways for privilege escalation.

  The likely objective of an attacker using AzureHound is to perform reconnaissance within Azure environments, which can facilitate further attacks such as data exfiltration or lateral movement. The rule is aligned with the MITRE ATT&CK framework, particularly under the tactics of Discovery (ID: TA0007), and the techniques of Account Discovery (ID: T1087.004) and Cloud Service Discovery (ID: T1526).

  To effectively capture this detection, the primary data source utilized is the Azure sign-in logs, which provide a record of authentication attempts and highlight any unusual user-agent strings or patterns indicative of AzureHound's operation.

  ### Investigation Steps
  - **Review Sign-in Logs**: Examine the Azure sign-in logs for entries where the User-Agent contains 'azurehound'. Pay attention to the context of the authenticated user and the associated resource accesses.
  - **Correlate with User Activity**: Investigate the user’s recent activity and behaviors before and after the sign-in to determine if there are any indications of malicious intent or unusual access patterns that align with typical AzureHound usage.
  - **Analyze Permissions and Roles**: Assess the permissions and roles assigned to the user in Azure AD. Look for any accounts with excessive permissions that may facilitate further exploitation or lateral movement within the Azure environment.
  - **Monitor for Anomalous Behavior**: Set up tracking for any unusual account activity or access patterns from the same user or originating IP addresses post-detector alert, to identify any follow-up actions that may indicate a continuing threat.

  ### Prioritization
  This alert is of high severity because successful detection of AzureHound usage indicates an active reconnaissance phase in a potential attack life cycle. The threat posed is significant, as it can lead to exploitation and further compromise of Azure resources if not addressed promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, particularly if the logging settings for Azure sign-in events are not configured to capture all necessary data. Additionally, the detection logic assumes that AzureHound is used in its default configuration, which may not always be the case, as attackers can modify their tools. For the alert to function, it is essential that sign-in logging is enabled and comprehensively capturing User-Agent strings as part of authentication logs.

