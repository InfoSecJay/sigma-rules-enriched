  ### Technical Context
  This rule detects instances where a user account has been locked due to multiple failed login attempts, typically suggesting a brute-force attack or an automated credential stuffing attempt. The attacker may aim to gain unauthorized access by guessing passwords, often using scripts to automate the process. Such behavior can lead to compromised accounts, data breaches, and a cascade of privilege escalation if successful.

  Relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) as the attacker seeks to acquire valid credentials, leading to potential system compromise. The specific technique highlighted here is **Brute Force** (T1110), which involves systematically trying various combinations to crack user passwords. In an enterprise environment, the most useful telemetry for identifying these events comes from Azure Sign-In Logs, which capture authentication attempts and their outcomes.

  ### Investigation Steps
  - **Review Sign-In Logs**: Analyze the Azure sign-in logs for the specific user account that was locked. Look for an unusual number of failed login attempts within a short period, marked by `ResultType: 50053`.

  - **Correlate with User Behavior**: Investigate the typical login patterns of the user in question. Determine if their account has had consistent activity or if this lockout appears anomalous compared to historical login data.

  - **Examine IP Addresses**: Assess the source IP addresses associated with the failed attempts. Look for signs of geolocation anomalies or repeated attempts from suspicious IP ranges, which may suggest attack infrastructure.

  - **Educate on Password Hygiene**: If compromised accounts are suspected, ensure all users are following password best practices. Encourage the review of multi-factor authentication (MFA) enforcement to enhance account security.

  ### Prioritization
  The severity of this alert is medium due to the risk it presents in detecting possible brute-force or automated attacks. While not all lockouts indicate malicious behavior, the likelihood of an actual security threat increases if multiple accounts are impacted or if the attack patterns align with known attacker methodologies.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage exists if users employ legitimate automated tools that result in failed logins, such as password managers or third-party applications with incorrect credentials. The detection logic assumes that the frequency of failed attempts will not reflect normal user behavior, which may not be reliable in every organizational context. The alert relies on capturing Azure sign-in logs. Without proper logging configurations enabled, detection may fail, and genuine security incidents may go unnoticed.

