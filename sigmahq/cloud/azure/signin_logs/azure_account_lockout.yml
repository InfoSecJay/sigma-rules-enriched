note: |
  ### Technical Context

  This rule detects when a user account becomes locked due to excessive incorrect sign-in attempts, indicated by the Azure Sign-in logs with a ResultType of 50053. The likely attacker objective is credential abuse, where an adversary attempts to gain unauthorized access via brute-force login attempts. This aligns with the MITRE ATT&CK framework specifically under the tactic of Credential Access (TA0006) and the technique Brute Force (T1110).

  The primary telemetry source is Azure Sign-in logs, particularly focusing on failed authentication events. If malicious, this behavior indicates potential internal or external attackers attempting to exploit user accounts. However, this detection does NOT confirm that an account has been successfully compromised; further investigation is required to ascertain an actual security breach.

  ### Investigation Steps

  - **Examine sign-in logs for patterns:** Review Azure Sign-in logs for entries with ResultType 50053 focusing on the `UserPrincipalName` and `Timestamp`. Look for multiple failed login attempts leading to the lockout within a short timeframe, which are indicators of brute-force attacks.

  - **Check originating IP addresses:** Identify and analyze the `IPAddress` field associated with the account lockout events. If the IP addresses come from known malicious sources or unusual geographical locations for the user, this may indicate a potential attack.

  - **Review user account role and activity:** Confirm the role of the affected user account. For high-privilege accounts, this incident may require heightened urgency. Assess recent legitimate activities (if any) under the `UserType` field, like service accounts updating or accessing services.

  - **Evaluate for other failed logins:** Investigate recent Azure sign-in logs for additional `ResultType` events related to failed logins or non-lockout failures (ResultType 50052), particularly focusing on `StatusCode` and `FailureReason` for corroborating evidence.

  - **Identify account recovery attempts:** Check for any associated account recovery or password reset requests following the lockout event. Look for entries in Azure Active Directory logs (`AuditLogs`) that may signify an insider attempt to regain access.

  ### Prioritization

  The alert severity is medium due to potential impacts on user productivity and possible indications of account compromise. The likelihood of malicious abuse is moderate, particularly in systems where sensitive information is stored. Brute-force techniques are commonly weaponized; hence, such alerts warrant timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion if an adversary employs a slow or timed attack to avoid triggering lockouts. Ensure Azure Sign-in logging is enabled and properly configured to capture all authentication attempts. Legitimate activities, such as users forgetting their passwords, can also trigger this alert. A related detection to strengthen coverage would be monitoring successful logins following multiple failures, as this could indicate a compromised account.

