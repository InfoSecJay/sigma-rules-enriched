  ### Technical Context

  This Sigma rule detects user account lockouts due to repeated failed login attempts with incorrect credentials. This behavior often suggests attempts at unauthorized access, possibly indicating a brute force attack aimed at gaining control of the user's account. The likely attacker objective is to compromise sensitive information or resources by manipulating valid user credentials. This alert aligns with the MITRE ATT&CK technique for Credential Brute Force (T1110) under the Credential Access tactic.

  Primary telemetry sources include Azure Sign-in logs, specifically looking for the ResultType field with a value of 50053, which indicates a locked account. If this behavior is malicious, it could lead to unauthorized access and potentially significant security incidents. However, this detection on its own does not confirm that an account compromise has successfully occurred; it merely indicates repeated login failures leading to lockout.

  ---

  ### Investigation Steps

  - **Check Sign-in Logs for Contextual Activity:** Review Azure Active Directory sign-in logs (Event ID 50053) to determine the source IP addresses and timestamps associated with the failed login attempts. Look for any suspicious locations or multiple attempts from the same IP.

  - **Identify Account Ownership and Role:** Confirm the ownership of the locked account. Evaluate user privileges and role criticality, especially if the account has access to sensitive data or administrative tools. Legitimate users typically have a history of successful logins, which can be cross-referenced.

  - **Examine for Successful Logins Post-Lockout:** Investigate if there were any successful login attempts with the same credentials immediately before or after the lockout event. High-confidence malicious indicators include logins from unusual geolocations or times inconsistent with the user’s typical behavior.

  - **Assess Brute Force Indicators:** Analyze the preceding log entries to check the frequency and pattern of failed login attempts. A high volume within a short timeframe suggests a brute force attack. Look for patterns involving multiple usernames or concurrent attempts across several accounts.

  - **Review Security Incident Reports for Patterns:** Check for any ongoing security incidents or alerts that may correlate with the account lockout. Patterns of account lockouts can signify a broader attack or phishing campaign targeting multiple users.

  ---

  ### Prioritization

  This alert has a medium severity due to potential implications on user account privacy and security. While any account lockout can indicate simple user error, frequent occurrences may signify attempted credential stuffing or brute force exploits. Evaluation of affected accounts and their role within the organization is essential to determine the actual threat.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the accuracy and completeness of Azure Sign-in logs; if they are not configured or aggregated correctly, some events may be missed. Legitimate activities, such as a user forgetting credentials or administrative security policies that enforce frequent password changes, can also result in lockouts. Companion detections, such as unusual login patterns from the same IP or geographical location, can augment the understanding of possible threats.

