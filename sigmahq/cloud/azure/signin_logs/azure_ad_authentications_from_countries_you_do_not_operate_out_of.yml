note: |
  ### Technical Context

  This Sigma rule detects successful authentication attempts from geographic locations that are not part of the organization’s operational footprint. The detected behavior may indicate potential unauthorized access attempts or identity compromise, as attackers commonly leverage stolen credentials from unexpected locations. The relevant MITRE ATT&CK tactic is "Initial Access" (TA0001), with a focus on the technique "Valid Accounts" (T1078.004). The primary telemetry sources are Azure AD sign-in logs (SigninLogs) that capture authentication events, including any related location data. If confirmed malicious, this activity poses a significant risk as it can lead to unauthorized data access or exfiltration. This detection does NOT confirm that the activity is malicious on its own, as legitimate users could authenticate from abroad.

  ### Investigation Steps

  - **Verify the authentication details:** Check Azure AD sign-in logs (Event ID: 4624) for the user's authentication time, IP address, and geographical location. Look for sign-ins originating from unexpected countries that are outside the approved operational geography.

  - **Assess user account history:** Review historical authentication attempts for the account in question to identify any prior successful sign-ins from the same unexpected location or any account anomalies, such as account lockouts or multiple failed attempts leading up to this event.

  - **Check for legitimate business justification:** Confirm with the System Administrator if the user is authorized to access the network from a foreign country. This could involve verifying travel plans or remote work policies that justify the authentication.

  - **Identify malicious indicators:** Look for patterns in the sign-in logs indicating rapid multiple logins or failed sign-in attempts followed by a successful login. Such behavior could suggest credential stuffing or brute-force attacks.

  - **Review concerning session activities:** Monitor any post-authentication activities (via Azure Monitor) for abnormal actions performed by the account after the unusual sign-in, such as access to sensitive resources or high-value data.

  - **Document asset criticality:** Determine the nature of the account accessed (e.g., admin, finance) and its potential impact on the organization. Admin or privileged accounts are of much higher concern if accessed from locations outside normal operations.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized account access from unapproved locations. The likelihood of malicious exploitation is reasonable, as successful authentications are a common step in various attack vectors. Since attackers frequently tokenize compromised accounts through remote access, this behavior warrants immediate review.

  ### Blind Spots and Assumptions

  Detection may be limited by VPN usage or legitimate travel by employees that could bypass geographical detection. Reliable detection depends on properly configured Azure AD sign-in logs that capture comprehensive location data. There could be legitimate activities, such as remote work or travel, that trigger this alert, necessitating thorough investigation. Related detections such as abnormal activity following this sign-in (e.g., accessing sensitive files) can bolster investigative results.

