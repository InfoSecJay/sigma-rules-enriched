logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    Status: 'Success'
  filter:
    Location|contains: '<Countries you DO operate out of e,g GB, use OR for multiple>'
  condition: selection and not filter
falsepositives:
- If this was approved by System Administrator.
level: medium
note: |
  ### Technical Context
  This detection rule identifies successful authentication attempts from geographic locations that are not associated with your organization's operational regions. By tracking login events in Azure Active Directory sign-in logs, it aims to mitigate the risk of unauthorized access from potential attackers who may leverage compromised credentials from abroad. The primary threat scenario involves attackers using stolen credentials to gain unauthorized access to corporate resources, potentially leading to data breaches, lateral movement within the network, or other malicious activities.

  In terms of MITRE ATT&CK mappings, this rule closely relates to techniques such as **T1078.004: Valid Accounts: Cloud Accounts** and **T1110: Brute Force**. Both techniques highlight the importance of monitoring account access patterns and ensuring that authentication sources align with known geographical operational contexts. The primary data sources for this rule are Azure sign-in logs, which provide detailed information on user authentication events, including timestamps, user identities, and their associated geographic locations.

  ### Investigation Steps
  - **Review Sign-In Logs**: Assess Azure sign-in logs for successful authentication events, paying particular attention to the IP addresses and geolocation data associated with these logins. Check which users were authenticated from suspicious locations.
  - **Cross-Check User Activity**: Investigate user activity during the specified time frame to determine if these logins were legitimate, approved remote access, or potentially unauthorized attempts.
  - **Evaluate Organization's Geographical Limits**: Confirm and document the specific countries in which your organization operates to update and refine detection filters to avoid false positives from approved locations.
  - **Correlate with Additional Security Tools**: Utilize other security tools, such as your SIEM or threat intelligence platforms, to correlate these logins with known bad actors or patterns of suspicious behavior.

  ### Prioritization
  The alert's severity is rated as medium because unauthorized access attempts can lead to compromises of sensitive information, but the likelihood of such events may vary based on the organization's operational footprint and existing security measures.

  ### Blind Spots and Assumptions
  This detection rule may not cover instances of authorized access from non-operational regions if these have been pre-approved by system administrators, leading to potential false positives. Additionally, there could be gaps in detection if users are frequently traveling and access is legitimate, which is an assumption made by the detection logic. To ensure the alert functions correctly, it requires comprehensive, up-to-date logging configurations in Azure Active Directory’s sign-in logs.

