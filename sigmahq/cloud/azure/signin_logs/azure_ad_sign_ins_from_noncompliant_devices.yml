note: |
  ### Technical Context
  This rule detects sign-ins from devices that do not meet the compliance requirements established by the organization. Non-compliant devices can potentially pose significant security risks, as they may lack necessary security features, up-to-date patches, or approved software, making them attractive targets for attackers. The detection focuses on identifying unauthorized access attempts that could lead to data breaches, lateral movement, or exploitation of vulnerabilities within the network.

  The likely attacker objectives include gaining access to sensitive resources, exfiltrating data, or establishing a foothold within the network for future malicious activities. By monitoring sign-ins from non-compliant devices, organizations can proactively mitigate risks associated with credential misuse, unauthorized access, and potential data loss.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access** (TA0001)
  - **Persistence** (TA0003)
  - **Privilege Escalation** (TA0004)
  - **Defense Evasion** (TA0005)
  - **Valid Accounts** - Inherited from the technique (T1078.004) which addresses the use of compromised credentials to access systems.

  Primary data sources for this detection rely on Azure sign-in logs, which detail user authentication attempts along with device compliance status.

  ### Investigation Steps
  - **Review Sign-in Logs:** Analyze the Azure sign-in logs for recorded events where the `DeviceDetail.isCompliant` field indicates 'false'. Pay close attention to the timing and frequency of these logins, and correlate against known user behavior.

  - **Assess Device Compliance Posture:** Investigate the compliance status of identified devices using compliance management tools or platforms. Determine the reasons for non-compliance, such as outdated operating systems or unauthorized software installations.

  - **Correlate with User Access Levels:** Validate the access rights of users signing in from non-compliant devices. Check if these users possess elevated privileges that present a higher risk, and ensure that necessary controls are in place.

  - **Implement Monitoring for Anomalous Behavior:** Set up enhanced monitoring for abnormal user behavior post-sign-in from non-compliant devices. Look for actions such as accessing sensitive files or attempts to modify system settings that deviate from baseline activity.

  ### Prioritization
  The alert is categorized as high severity due to the critical risk that sign-ins from non-compliant devices can introduce vulnerabilities into the enterprise network. The potential for data breaches and unauthorized access is heightened, making swift response imperative.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where not all devices are properly enrolled or monitored for compliance status. The detection logic assumes that all necessary compliance configurations are accurately in place and that devices will report their compliance status correctly. Additionally, logging of Azure sign-in events must be enabled and properly configured for the alert to function effectively, which may vary based on organizational settings and compliance policies.

