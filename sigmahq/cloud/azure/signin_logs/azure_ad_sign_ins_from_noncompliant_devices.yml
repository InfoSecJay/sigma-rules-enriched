note: |
  ### Technical Context

  This Sigma rule detects attempted sign-ins to Azure services from devices classified as non-compliant. The intended attacker objective could involve gaining unauthorized access to sensitive data or resources, leveraging weaknesses associated with non-compliant devices. This aligns with the MITRE ATT&CK technique "Valid Accounts" (T1078.004) under the tactic of "Initial Access." The primary telemetry source is Azure Sign-In Logs, which include information about user authentication attempts, device compliance status, and the associated risk level. If malicious, this behavior may allow attackers to gain access to systems and data, potentially leading to data breaches or further exploitation. Importantly, this detection alone does not confirm that the sign-in was successful or indicative of malicious intent without further context.

  ### Investigation Steps

  - **Verify device compliance status**: Check the Azure sign-in logs for the event where `DeviceDetail.isCompliant` is set to 'false' (Sign-in Logs, fields: `DeviceDetail`). Obtain related compliance policy details to understand the implications.

  - **Identify user account activity**: Cross-reference the sign-in event with user account status (Azure AD logs or Sign-in Logs, field: `UserPrincipalName`). Determine if the account is associated with a high-risk user or sensitive role, indicating potential malicious intent.

  - **Review sign-in details**: Inspect sign-in logs for the specific time of the event (Sign-in Logs, fields: `Timestamp`, `IPAddress`, `UserAgent`) and analyze for geolocation and IP reputation. Assess if the access originated from unexpected locations.

  - **Monitor for repeated failed sign-in attempts**: Look for multiple sign-in attempts from the non-compliant device within a short timeframe (Sign-in Logs). High failed attempts could indicate automated attacks or account enumeration.

  - **Identify expected device usage patterns**: Establish a baseline for typical sign-in behaviors by legitimate users working on compliant devices (Sign-in Logs). Flag deviations from this baseline, as legitimate devices will usually have `DeviceDetail.isCompliant` set to 'true'.

  ### Prioritization

  The high severity of this alert is significant due to the potential impact of unauthorized access from non-compliant devices, which are often targeted by adversaries looking to exploit compliance gaps. The likelihood of malicious abuse is elevated, especially if the device lacks basic security postures. This behavior is commonly weaponized in attacks aiming to leverage compromised accounts.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of compliant-looking proxies or misconfigured compliance policies. It requires active monitoring of Azure AD configuration and user compliance settings for reliable detection. Legitimate activities such as a user intentionally signing in from a non-compliant device while traveling could trigger this alert. A companion detection to consider is monitoring for unusual user behavior post sign-in to capture any lateral movement or escalation attempts.

