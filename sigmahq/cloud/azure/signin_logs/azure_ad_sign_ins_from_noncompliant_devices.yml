note: |
  ### Technical Context

  This rule detects sign-ins occurring from devices that are flagged as non-compliant within the Azure environment. The likely objective for an attacker utilizing such devices is to exploit misconfigurations or reduced security controls that may accompany non-compliant status to gain unauthorized access or escalate privileges. Relevant tactics under the MITRE ATT&CK framework include Persistence, Initial Access, and credential access, specifically under technique T1078.004 (Account Manipulation).

  The primary telemetry source for this detection is Azure Sign-In Logs, specifically monitoring the `DeviceDetail.isCompliant` field. If malicious, this behavior may indicate an attacker leveraging a non-compliant device to bypass security measures, leading to potential data breaches or ongoing system compromise. However, this detection alone does not confirm that the sign-in is indeed a security incident; it requires further investigation to establish intent.

  ### Investigation Steps

  - **Review sign-in logs for user context**: Examine Azure Sign-In Logs for Event IDs related to the sign-in, focusing on fields such as `userPrincipalName`, `ipAddress`, and `deviceDetail.isCompliant`. Establish user legitimacy by confirming that the sign-in aligns with expected user behavior and access patterns.

  - **Cross-check device compliance status**: Validate compliance status against device registration systems (Intune, MDM). Legitimate devices typically have up-to-date policies and security configurations. Flags indicating compliance (like `isCompliant: 'true'`) should be present for expected devices.

  - **Correlate with failed sign-in attempts**: Inspect for any failed sign-in attempts associated with the same user or IP address in the Azure Sign-In Logs. A pattern of failed logins followed by a successful sign-in from a non-compliant device could indicate credential stuffing or brute-force attempts.

  - **Analyze login location and behavior**: Confirm the geographic origin of the sign-in (IP address) against known user locations. Non-compliant devices accessing from unusual locations could indicate malicious activity and should be further scrutinized.

  - **Identify any account anomalies**: Look for signs of account anomalies such as new or unusual group memberships, changes made, or frequent access outside of regular working hours within Azure Active Directory logs. Signs of abnormal privilege escalation or access could indicate exploitation.

  ### Prioritization

  This alert should be prioritized as high due to the potential risk posed by non-compliant devices accessing enterprise systems. Non-compliant devices are more susceptible to exploitation, increasing the likelihood of a successful attack, especially when attackers commonly target weaknesses in compliance policies to gain initial access.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of compliance assessments or misconfigurations in the logging setup, potentially allowing malicious actors to exploit gaps undetected. Organizations must ensure that Azure Sign-In Logs are correctly configured, and non-compliance criteria are well-defined. Legitimate user activities, like remote work or use of personal devices for business tasks, may inadvertently trigger alerts. A related detection to enhance coverage is monitoring for conditional access policy bypass alerts within Azure AD logs, which can correlate with non-compliant device sign-ins.

