title: Device Registration or Join Without MFA
id: 5afa454e-030c-4ab4-9253-a90aa7fcc581
status: test
description: Monitor and alert for device registration or join events where MFA 
  was not performed.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-devices#device-registrations-and-joins-outside-policy
author: Michael Epping, '@mepples21'
date: 2022-06-28
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.stealth
- attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResourceDisplayName: 'Device Registration Service'
    conditionalAccessStatus: 'success'
  filter_mfa:
    AuthenticationRequirement: 'multiFactorAuthentication'
  condition: selection and not filter_mfa
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects events where a device is registered or joined to the network without the implementation of multi-factor authentication (MFA). The abnormal behavior suggests potential unauthorized access to corporate resources, possibly indicating a breach of security policy or an attacker bypassing authentication controls. The likely attacker objective is to establish a foothold within the Enterprise environment for further exploitation or lateral movement.

  This behavior aligns with the MITRE ATT&CK tactic of "Initial Access" (TA0001) and the technique of "Valid Accounts" (T1078.004). The primary telemetry source for this detection is Azure activity logs, specifically the sign-in logs where device registration activities are recorded (e.g., ResourceDisplayName: 'Device Registration Service'). If malicious, this could lead to unauthorized access, privilege escalation, or persistence. It is essential to note that this detection alone does not confirm malicious intent; legitimate device registrations without MFA may occur under certain acceptable business scenarios.

  ### Investigation Steps

  - **Check sign-in logs:** Look for Azure sign-in logs with Event IDs related to device registrations (e.g., Event ID 4624). Confirm the ResourceDisplayName is 'Device Registration Service' and the Conditional Access Status is 'success'.

  - **Identify MFA policy compliance:** Review the organization's MFA policies to understand expected device registration behavior. Legitimate registrations typically occur under controlled conditions with MFA successfully executed.

  - **Examine user account details:** Assess the user accounts involved in the device registration. Look for any signs of compromise such as anomalous sign-in locations or high-risk users (e.g., Service Principal accounts).

  - **Evaluate time and frequency of events:** Investigate the timing of the alerts. Frequent or unusual device registrations from the same user or IP address can indicate scripted attacks or malware activity.

  - **Review conditional access policies:** Confirm if the organization’s Azure AD Conditional Access is correctly configured and enforcing MFA for device registrations. Misconfigurations may lead to legitimate registrations generating alerts.

  - **Cross-reference additional alerts:** Look for related alerts in the environment involving failed login attempts, unusual account activity, or any corresponding alerts in identity protection solutions that might indicate compromise (e.g., Azure AD risky sign-ins).

  ### Prioritization

  The severity of this alert is medium due to its potential impact on sensitive systems, as unauthorized device registrations may lead to further exploitation. The likelihood of malicious abuse is increased when MFA is not enforced, as attackers often seek to exploit any weaknesses in authentication mechanisms. This behavior is also commonly observed in initial access scenarios.

  ### Blind Spots and Assumptions

  This detection may miss device registrations if alternative authentication methods are used that do not rely on MFA. Reliable detection requires correct logging configurations in Azure and may overlook legitimate automation activities where devices are registered without MFA based on internal policy exceptions. A companion detection that could enhance coverage includes monitoring for failed authentication attempts (e.g., identifying users who frequently bypass MFA).

