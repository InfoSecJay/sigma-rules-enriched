title: Device Registration or Join Without MFA
id: 5afa454e-030c-4ab4-9253-a90aa7fcc581
status: test
description: Monitor and alert for device registration or join events where MFA was
  not performed.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-devices#device-registrations-and-joins-outside-policy
author: Michael Epping, '@mepples21'
date: 2022-06-28
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.defense-evasion
- attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResourceDisplayName: 'Device Registration Service'
    conditionalAccessStatus: 'success'
  filter_mfa:
    AuthenticationRequirement: 'multiFactorAuthentication'
  condition: selection and not filter_mfa
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects instances of device registrations or joins to the enterprise environment occurring without the enforcement of Multi-Factor Authentication (MFA). The likely threat scenario involves an attacker attempting to register a device to gain unauthorized access to organizational resources, thereby enhancing their foothold inside the network. Such actions may also facilitate lateral movement, granting the attacker elevated privileges over sensitive systems or data.

  Relevant MITRE ATT&CK tactics and techniques applicable to this rule include **Initial Access (TA0001)**, where an attacker may exploit a weakness in the authentication process to gain entry; **Persistence (TA0003)** through the registration of devices that can be used for subsequent access; and **Privilege Escalation (TA0004)**, particularly via **Valid Accounts (T1078.004)**, when unauthorized devices join the network without additional verification such as MFA.

  Primary data sources crucial for this detection include Azure sign-in logs which will contain relevant records of device registration events, conditional access status, and the authentication mechanisms used during these attempts.

  ### Investigation Steps
  - **Review Sign-in Logs:** Analyze Azure sign-in logs for device registration attempts where the `ConditionalAccessStatus` indicates `success` but no MFA was performed. Look for patterns or anomalies in the requests.
  - **Check Authentication Policies:** Investigate existing conditional access policies to ensure that MFA requirements are strictly enforced for device registrations, identifying any potential misconfigurations.
  - **Conduct User Behavior Analysis:** Evaluate user activities surrounding the time of the device registration to ascertain if there are any unusual access attempts or failed login events leading up to the registration.
  - **Assess Network Connections:** Monitor the network connections from the newly registered device for unusual traffic that might indicate a compromised state or unauthorized activities.

  ### Prioritization
  The alert is considered medium severity due to the potential for significant impact if an attacker successfully registers a device without MFA. This situation increases the likelihood of unauthorized access and exploitation of enterprise resources, thereby warranting prompt investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage may include device registrations occurring through legitimate user actions or false positives where users may inadvertently attempt to register devices without MFA. The detection logic assumes that all registrations should involve MFA and relies on the proper logging of conditional access statuses within Azure. If conditional access policies are not correctly configured or if sign-in logs are not captured comprehensively, the alert may miss legitimate events or falsely flag non-malicious activities.

