note: |
  ---

  ### Technical Context

  This Sigma rule detects instances of device registration or joining events in Azure where Multi-Factor Authentication (MFA) was not used. The likely attacker objective is to exploit insecure device registration processes, allowing unauthorized access and potential persistence within the environment. This behavior aligns with the MITRE ATT&CK tactic of Persistence using the technique "Valid Accounts" (T1078.004).

  The primary telemetry sources involved are Azure sign-in logs, particularly events detailing device registration services. If the detected behavior is malicious, it can lead to unauthorized access to sensitive resources and systems. However, it is crucial to note that this detection does NOT confirm a malicious intent by default; legitimate users may also register devices without MFA due to misconfiguration or policy exceptions.

  ---

  ### Investigation Steps

  - **Review Azure sign-in logs for events:** Identify entries for device registration (Audit Log and API Data) and check for `ResourceDisplayName: Device Registration Service` and `conditionalAccessStatus: success`.

  - **Identify user context:** Confirm the user associated with the registration event to determine if the user is authorized to register devices—look for `UserPrincipalName` and `IPAddress` fields in event logs.

  - **Correlate with Conditional Access policies:** Check the Conditional Access policies in Azure AD to ascertain whether MFA should have been enforced for the specific user and device type to determine if a policy violation occurred.

  - **Evaluate for legitimate behavior:** Determine if there were policy exceptions surrounding MFA that allowed this behavior. Look for other registrations or logins from the same user that utilize MFA.

  - **Identify high-confidence malicious indicators:** Investigate if any registrations originated from atypical locations or devices. Specifically, review `IPAddress` geography linked to the registration points that contradict the user's normal behavior patterns.

  - **Assess asset criticality based on device registration:** Classify registered devices based on their compliance with organizational security policies. Prioritize further investigation if the newly registered device has elevated privileges or accesses sensitive data.

  ---

  ### Prioritization

  The alert is of medium severity due to the potential security impact of unauthorized device registrations, especially in environments where sensitive data is at risk. The likelihood of malicious abuse is moderate, considering that attackers may exploit loopholes in MFA policies. While less common, absence of MFA can be weaponized by adversaries targeting weak device registration controls.

  ---

  ### Blind Spots and Assumptions

  Detection may miss MFA bypass tactics or scenarios where legitimate users are allowed to register devices without MFA due to exceptions. Reliable detection requires comprehensive logging of Azure AD sign-in events and specific Conditional Access configuration. Legitimate activities that may trigger this alert include helpdesk scenarios where MFA is not enforced or misconfigurations. Partnering this detection with monitoring for unusual login attempts (e.g., failed sign-ins) can strengthen overall detection capabilities.

