title: Device Registration or Join Without MFA
id: 5afa454e-030c-4ab4-9253-a90aa7fcc581
status: test
description: Monitor and alert for device registration or join events where MFA 
  was not performed.
references:
- https://learn.microsoft.com/en-us/entra/architecture/security-operations-devices#device-registrations-and-joins-outside-policy
author: Michael Epping, '@mepples21'
date: 2022-06-28
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.defense-evasion
- attack.t1078.004
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResourceDisplayName: 'Device Registration Service'
    conditionalAccessStatus: 'success'
  filter_mfa:
    AuthenticationRequirement: 'multiFactorAuthentication'
  condition: selection and not filter_mfa
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects device registration or joining events to Azure services where Multi-Factor Authentication (MFA) was not enforced. The behavior indicates potential bypass of security policies, likely aiming to compromise a system for initial access or persistence. Relevant MITRE ATT&CK tactics and techniques include Initial Access (TA0001) and Valid Accounts (T1078.004). The primary telemetry source is Azure Sign-In Logs, specifically focusing on records where the `ResourceDisplayName` is 'Device Registration Service' and `AuthenticationRequirement` is not met. If malicious, this situation could lead to unauthorized device access resulting in data breaches. However, this detection alone does NOT confirm whether any resulting access was exploited.

  ### Investigation Steps

  - **Check log entries for device registrations without MFA:** Review Azure Sign-In Logs for entries where `ResourceDisplayName` is 'Device Registration Service' and `AuthenticationRequirement` equals 'none'. Note the timestamp and user context for further analysis.

  - **Identify the device and user involved:** Cross-reference the logged event with asset inventory. Extract relevant fields such as `UserPrincipalName` and `DeviceID` from the log entries to confirm if the user is legitimate and whether the device is a known entity.

  - **Review user login patterns:** Correlate additional Azure Sign-In Logs (Event ID 4624) for the same user/root to analyze the frequency and geographical location of logins, highlighting any suspicious patterns that diverge from normal activity.

  - **Assess applicable Conditional Access policies:** Investigate whether the Conditional Access policies are appropriately configured and applied to the user in question. Evaluate existing policies for the enforcement of MFA to establish compliance and flag any policy gaps.

  - **Determine the context of legitimate device joins:** Identify expected behavior by reviewing device addition history, focusing on known operational changes (e.g., new hardware deployments) that might trigger device registrations without MFA.

  - **Look for high-confidence indicators of premeditated actions:** Examine if the user associated with the registration has approved administrative privileges or is linked to other suspicious activity flags in the logs. Focus on events of `conditionalAccessStatus` showing ‘success’ in conjunction with MFA bypass to quantify risk.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of unauthorized access on sensitive data and resources tied to the affected system. While device registration without MFA can often be an innocuous oversight, it is a common technique leveraged by adversaries to facilitate unregulated access. Given the criticality of identity and device management, detection must be prioritized to mitigate risks promptly.

  ### Blind Spots and Assumptions

  This detection may be evaded if users enroll devices using legitimate MFA but have permissions misconfigured in Conditional Access. Reliable detection requires comprehensive configurations of Azure sign-in logging. Legitimate activities such as new employee onboarding may result in similar alerts if MFA policies are improperly configured. Related detections include monitoring for improper Conditional Access bypass events, such as indicators of privilege escalation that complement this detection if MFA was bypassed but later utilized.

