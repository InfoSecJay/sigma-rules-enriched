note: |
  ### Technical Context
  This detection rule focuses on identifying sign-in attempts made from unknown devices located in non-trusted environments. Such attempts may indicate potential unauthorized access, often associated with malicious actors seeking to exploit systems from compromised or external devices. Attackers typically aim to gain initial access or escalate privileges by leveraging stolen credentials from an untrusted use location, potentially bypassing standard security measures.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Initial Access** (TA0001): Representing methods used by adversaries to gain an initial foothold within a network.
  - **Privilege Escalation** (TA0004): Highlighting the processes involved when attackers attempt to gain elevated access to internal systems.
  - **Defense Evasion** (TA0005): Related to techniques designed to avoid detection or circumvent security measures.

  The primary data source for this rule is the Azure Sign-in Logs, which provide insight into authentication attempts, user details, device information, and any anomalies that could suggest unauthorized access.

  ### Investigation Steps
  - **Review Sign-in Logs**: Check the Azure Sign-in Logs for all recent sign-ins, focusing on those from unfamiliar devices or locations. Look for anomalies or patterns in these log entries.
  - **Correlate User Details**: Analyze the user accounts associated with the sign-ins to identify any potentially compromised accounts or unusual access patterns, including machine learning anomaly detection if available.
  - **Assess Device Details**: Gather information on the devices attempting to sign in, checking for any previous recorded concerns. Confirm whether these devices are registered or compliant with your organization's security policies.
  - **Track Network Location and Behavior**: Evaluate the network location details against known trusted IPs and analyze any unusual behaviors or access attempts from unfamiliar geographic regions.

  ### Prioritization
  The low-severity alert is based on the limited context provided by the detection logic; while sign-ins from unknown devices may relate to security incidents, they may also be benign activities such as remote work or legitimate business needs.

  ### Blind Spots and Assumptions
  This detection may have gaps regarding device identification, especially if unregistered devices are used via mobile networks or if attackers spoof device details. The rule assumes that all sign-ins from unknown devices warrant concern, but some could be legitimate. Effective monitoring relies on accurate configurations of Azure's sign-in logs and may require enhanced visibility into user behaviors and network contexts for more robust detection.

