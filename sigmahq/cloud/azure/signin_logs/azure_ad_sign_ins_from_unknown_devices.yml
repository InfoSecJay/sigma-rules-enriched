note: |
  ### Technical Context

  This rule detects sign-ins from unknown devices attempting authentication from non-trusted locations. The likely attacker objective here is to gain unauthorized access to user accounts or systems, utilizing compromised credentials or exploiting poorly secured devices. This behavior aligns with the MITRE ATT&CK technique for Valid Accounts (T1078.004).

  The primary telemetry source for this detection is Azure Sign-in Logs, specifically targeting fields that describe authentication requirements, result types, and device details. If malicious, a successful sign-in could lead to unauthorized access, data exfiltration, and further lateral movement within the enterprise environment. This detection does NOT confirm that an attack is occurring without additional context or evidence of malicious intent, such as successful exploitation or lateral movement.

  ### Investigation Steps

  - **Review sign-in timestamps and source IPs:** Correlate sign-in logs (Event ID specific to Azure Sign-in Logs) with user account activity to detect any anomalies or patterns, such as logins at unusual hours or from geographically disparate locations compared to the user’s normal activity.

  - **Check for successful sign-ins from the same device:** Identify if there are legitimate historical sign-ins from devices or locations that are treated as unknown; review past sign-in telemetry (e.g., fields indicating device IDs and geographical locations) for sign-in frequency and patterns.

  - **Investigate device details in authentication logs:** Analyze the `DeviceDetail.deviceId` field for potential deviations from expected devices utilized by the user. Legitimate devices would frequently appear in sign-in logs, while unknown entries may indicate misuse or attempts by an attacker.

  - **Assess access patterns post sign-in:** If a sign-in attempt is flagged as unknown, examine subsequent access logs for unusual behavior (e.g., sensitive resource access or privilege escalation attempts). Check for lateral movement indicators across Azure resources through Azure AD sign-in logs.

  ### Prioritization

  This alert is of low severity due to the high volume of legitimate sign-ins from unknown devices, particularly in environments where users work remotely or utilize personal devices. However, the risk of malicious abuse is significant if leveraged by an adversary for lateral movement or data exfiltration. This behavior can be weaponized in targeted phishing or credential harvesting attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by users employing VPNs or unregistered devices, which can generate false positives or mask malicious activity. Consistent and comprehensive logging of Azure sign-in activities is required to improve detection capabilities. Legitimate activities, such as new employee setups or instances of remote work due to unforeseen events, may trigger this alert. A companion detection worth noting is any identification of failed sign-in attempts from unknown devices, which, together, would strengthen the delineation of genuine threats versus benign behavior.

