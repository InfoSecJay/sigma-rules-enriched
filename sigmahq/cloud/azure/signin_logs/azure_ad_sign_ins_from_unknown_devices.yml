note: |
  ### Technical Context

  This Sigma rule detects sign-ins to Azure services from devices that are not recognized as compliant or trusted. The likely attacker objective is to gain unauthorized access to corporate resources or data, potentially leveraging stolen credentials or compromised devices. This behavior relates to the MITRE ATT&CK framework's tactic of **Initial Access (TA0001)** and technique **Valid Accounts (T1078.004)**.

  The primary telemetry source is Azure Active Directory (AAD) sign-in logs, particularly focusing on the device details and network location of the sign-ins. If malicious, this behavior can lead to unauthorized data access or account compromise. Importantly, this detection does NOT confirm that an account was definitively compromised or that an attack is underway without additional context.

  ### Investigation Steps

  - **Verify sign-in details:** Review Azure sign-in logs (Event ID 4624) and specifically look for `DeviceDetail.deviceId` and `NetworkLocationDetails` fields. Confirm if the sign-in originated from an unrecognized or non-compliant device.

  - **Identify suspicious sign-in locations:** Cross-reference the `Location` field in the logs with known trusted locations in your organization. Non-compliant or foreign locations, particularly from unusual countries, should raise concern.

  - **Check legitimate users' access patterns:** Establish a baseline of normal sign-in behavior by reviewing the historical sign-in patterns of users. Legitimate access typically occurs from specific corporate IP addresses and devices recognized in your organizational inventory.

  - **Investigate the user account:** Look into the `UserPrincipalName` field for the account involved in the sign-in attempt. Assess whether this user has a history of similar login behavior, and flag if they do not.

  - **Confirm implementation of Multi-Factor Authentication (MFA):** Verify if the organization enforces MFA as part of the sign-in process for Azure accounts. Single-factor sign-ins (as indicated by `AuthenticationRequirement: singleFactorAuthentication`) are riskier if originating from untrusted devices.

  ### Prioritization

  This alert is of **low severity** in an enterprise context because sign-ins from unknown devices may not necessarily indicate an immediate threat but warrant investigation. The likelihood of malicious abuse is moderate, particularly if sensitive accounts are targeted, and this behavior is known to be weaponized for unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete device inventory data or configured compliance checks within Azure. Legitimate activities, such as remote work or travel, could inadvertently trigger this alert. Complementary detections, such as monitoring failed login attempts (e.g., Azure AD sign-in logs showing multiple failures), can enhance overall coverage against credential misuse.

