note: |
  ### Technical Context

  The Sigma rule detects anomalous sign-in activity across multiple tenants from different geographic locations within the same browser session. This behavior is indicative of possible credential theft or misuse, where an attacker may have gained access to user accounts by entering credentials in an unexpected environment or from a foreign location. The likely attacker objective is to compromise user accounts to access sensitive data or perform unauthorized actions on behalf of the user. This detection aligns with MITRE ATT&CK tactics and techniques such as "Stealthy Actions" (TA0005) and "Valid Accounts" (T1078).

  Primary telemetry sources include Azure risk detection logs, specifically looking for sign-in activity classified with the riskEventType of 'suspiciousBrowser'. If malicious, the security impact could be significant, resulting in unauthorized access to sensitive resources. It is crucial to note that this detection does NOT confirm that an account has been compromised; further investigation is required to establish intent.

  ### Investigation Steps

  - **Review Azure Risk Detection Logs**: Query Azure logs for `riskEventType: 'suspiciousBrowser'`, focusing on the `userPrincipalName`, `location`, and `timestamp` fields to identify recent anomalies and correlate with known user behavior.

  - **Analyze User Sign-in History**: Cross-reference other sign-ins for the affected user in Azure AD (Event ID 4624) for unusual patterns. Look for sign-ins from multiple countries in a short period or simultaneous access attempts that exceed normal user behavior.

  - **Identify Multiple Tenant Access**: Check for any unusual sign-ins to multiple tenants by the same user within the same browser session. Normal behavior usually only involves the user's primary or trusted accounts.

  - **Monitor Geolocation Patterns**: Validate suspicious sign-ins against typical geolocation patterns. For instance, a user typically signing in from the U.S. should not have access attempts from, for example, Eastern Europe within a few minutes.

  - **Check for Account Lockouts**: Investigate whether the affected user account experienced any account lockouts or failed sign-ins (Event ID 4625) that coincide with these alerts, highlighting potential brute force activities.

  - **Assess Response to Phishing Campaigns**: Consider recent phishing campaigns targeting users in your organization to cross-check if the flagged activity falls within known attack timelines.

  ### Prioritization

  This alert has a high severity rating due to the potential impact of compromised user accounts, which could lead to unauthorized access to sensitive systems. The likelihood of malicious abuse is considerable, especially in environments that manage sensitive data. As this behavior is commonly associated with current attack vectors, it warrants immediate attention.

  ### Blind Spots and Assumptions

  This detection may be limited if logs are not correctly configured to capture all sign-in events or if geolocation services are inaccurate. Legitimate cases, such as VPN use or travel, may trigger this alert, particularly for globally dispersed teams. Companion detections involving failed login attempts or suspicious file access can enhance coverage and help gauge the legitimacy of the identified behavior.

