note: |
  ### Technical Context
  This detection rule identifies suspicious browser activity that is indicative of potential account compromise. Specifically, it focuses on instances where a user signs in across multiple tenants from geographically diverse locations within a short time frame, suggesting possible credential theft or account takeover attempts. Such behavior might stem from various tactics employed by attackers, including single sign-on (SSO) abuse or the use of stolen credentials to access accounts across different organizational domains.

  The relevant MITRE ATT&CK techniques for this rule include **"Valid Accounts" (T1078)**, where attackers use valid credentials to gain access, leading to potential persistence, defense evasion, and even privilege escalation. It can also be associated with initial access tactics whereby attackers establish a foothold in the target environment.

  The primary data source used for this detection is **risk detection logs** from Azure, specifically focusing on sign-in activities that report unusual browser behaviors tied to multiple tenants.

  ### Investigation Steps
  - **Review Sign-In Logs:** Examine the Azure risk detection logs for the flagged user, noting the IP addresses and geolocation for each sign-in attempt to determine whether the activity is legitimate or suspicious.

  - **Correlate with User Activity:** Cross-reference the detected sign-ins with other user activities in the system (such as access to sensitive applications or data) to assess the context of the suspicious sign-ins.

  - **Assess Account Health:** Evaluate account settings and security measures, such as multi-factor authentication (MFA) status, for the impacted user. Look for any changes that could indicate prior compromise or successful login attempts leveraging stolen credentials.

  - **User Communication Review:** Consider reaching out to the user to verify whether they recognize the sign-in attempts and to gather additional context about their recent activities, particularly if they have traveled or accessed applications across different regions.

  ### Prioritization
  This alert should be treated with high severity due to the elevated risk of account compromises leading to unauthorized access across multiple organizational assets. The likelihood of a legitimate user signing in from geographically disparate locations in a short time frame is low, warranting immediate investigation.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of account compromise, especially if attackers use methods to avoid detection, such as leveraging VPNs or similar services that mask their true location. The rule assumes that unusual sign-in behavior correlates directly with malicious intent and does not account for legitimate scenarios like business travel or remote work. Furthermore, this alert relies on the availability of accurate risk detection logs from Azure, which must be appropriately configured to capture all relevant sign-in activity across different tenants.

