note: |
  ### Technical Context

  This detection identifies suspicious browser activity characterized by anomalous sign-in attempts across multiple tenants, originating from different geographical locations within the same browser session. Such behavior often indicates credential compromise or sophisticated account takeover attempts, as adversaries may use credential stuffing or phishing techniques to access accounts across various cloud services.

  This detection aligns with the MITRE ATT&CK tactic of "Initial Access" (TA0001) and technique "Valid Accounts" (T1078). The primary telemetry sources include Azure risk detection logs specifically related to user sign-in activities (e.g., `riskEventType: 'suspiciousBrowser'`). If confirmed malicious, this activity may lead to unauthorized access and potential data breaches, compromising sensitive organizational data. Notably, this detection does NOT confirm a successful account compromise on its own; it merely indicates suspicious sign-in intent.

  ### Investigation Steps

  - **Identify sign-in details: **Review Azure sign-in logs for the specific user across different tenants: Check for Event ID related to sign-in `Sign-in events (Azure AD logs)` with expected location details in the `location` field.

  - **Analyze geographical movement: **Determine if the sign-in attempts are from distinct countries unusual for the user: If the `country` field shows rapid transitions across international locales, this could indicate malicious activity.

  - **Check account history: **Evaluate the account's sign-in history for past suspicious activity: Cross-reference recent sign-ins (Event ID: `signIns`) and identify if the user had legitimate access patterns previously correlated with the regions identified.

  - **Assess user role and access level: **Examine the user’s role in Azure to assess potential impact: Critically evaluate high-level user roles (e.g., Global Admin) to understand the severity of compromise potential.

  - **Compare with established baselines: **Validate legitimate user behavior against the current sign-in activity: Establish a baseline of trusted access locations and times to differentiate benign versus malicious sign-ins.

  ### Prioritization

  The alert is of high severity due to the potential impact on sensitive systems if an account is compromised. The likelihood of malicious abuse is significant, particularly if advanced persistent threats are involved. This type of suspicious browser activity is commonly weaponized in credential theft campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the inability to capture legitimate but unusual user behavior, such as travelling employees or contractors. Required log sources include thorough Azure AD logging configurations for complete visibility. Various user activities, such as using VPNs or cloud services across global locations, could trigger this alert. Strengthening coverage with companion detections focusing on account lockout events or unusual API activity across Azure services may provide additional context for analysis.

