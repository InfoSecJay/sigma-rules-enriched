note: |
  ### Technical Context
  This detection rule identifies anomalies associated with SAML token issuers, specifically focusing on tokens that may have been compromised. When a SAML token is issued from an unusual or known malicious source, it could indicate an attack that aims to impersonate users or gain unauthorized access to sensitive resources. Attackers may leverage compromised identities to traverse a network, escalate privileges, or steal data, making the detection of such anomalies crucial for preventing exploitation of user accounts.

  The relevant MITRE ATT&CK tactics include **Credential Access (TA0006)** and **Initial Access (TA0001)**, specifically techniques such as **Exploitation of Vulnerability (T1203)** and **Valid Accounts (T1078)**. By monitoring for unusual claims in tokens, organizations can proactively identify potential breaches before they escalate. The primary data sources for this detection include telemetry from Azure's Risk Detection service, which tracks risk events related to identity and access management.

  ### Investigation Steps
  - **Review SAML Token Claims:**
    Analyze the claims provided within the flagged SAML token for inconsistencies or patterns that suggest it may have originated from a malicious issuer. Look for claims that differ significantly from established baselines.

  - **Check Issuer Information:**
    Validate the issuer of the SAML token against known legitimate issuer records. Any discrepancies or instances of tokens coming from unfamiliar domains should raise further scrutiny.

  - **Cross-Reference User Sign-Ins:**
    Investigate the user's recent sign-in activity across multiple services within the Azure environment. Look for unusual patterns, such as logins from atypical geolocations or non-standard devices.

  - **Monitor for Subsequent Activity:**
    Keep an eye on the user account's subsequent actions post-registration of the alarming token. An increase in administrative or sensitive operations may indicate compromised access following the anomalous SAML issuance.

  ### Prioritization
  The alert is classified as high severity due to the potential implications of compromised accounts, particularly in enterprise environments where unauthorized access may lead to significant data breaches or system disruptions. The nature of SAML tokens makes them a primary attack vector for adversaries seeking to exploit user identities.

  ### Blind Spots and Assumptions
  One primary gap in this detection is the dependence on accurate logging of risk events within Azure's service, which may not capture all malicious issuer instances if they use legitimate channels. The detection assumes that an increased frequency of anomalies correlates with malicious behavior, which may not always be the case due to administrative needs. Additionally, environments with custom SAML implementations may require specific configurations to ensure event logging for SAML token issuance is enabled and accurately captured.

