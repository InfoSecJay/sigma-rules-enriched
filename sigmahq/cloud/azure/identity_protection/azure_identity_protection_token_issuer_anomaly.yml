note: |
  ### Technical Context

  This rule detects anomalies in SAML token issuers, specifically when the issuer is potentially compromised or when the claims within the token align with known attacker patterns. The likely attacker objective is to exploit a compromised SAML token to gain unauthorized access to sensitive resources within the application ecosystem. This detection aligns with the MITRE ATT&CK technique for Credential Access (T1606), highlighting risks associated with token manipulation or interception.

  The primary telemetry sources include Azure Risk Detection logs, specifically focusing on the `riskEventType` field indicating a `tokenIssuerAnomaly`. If malicious, this behavior could lead to unauthorized access, identity impersonation, and significant security breaches within the enterprise. Importantly, this detection does NOT confirm a compromise on its own but rather indicates an unusual sign-in that warrants further investigation.

  ### Investigation Steps

  - **Review SAML token claims:** Inspect returned claims in the SAML token for inconsistencies or unusual values. For Azure, this can be found in the Risk Detection log under the claims field in the event record.

  - **Check issuer's domain:** Verify the domain of the SAML token issuer against known trustworthy issuers. Legitimate issuers should be pre-approved in the organization's SAML configuration.

  - **Cross-reference sign-in patterns:** Examine recent sign-in activities for the affected user within the Azure Sign-Ins logs (Event ID: 4624). Look for unusual geographic locations or device types that deviate from the user’s typical behavior.

  - **Identify correlated alerts:** Look for additional alerts related to the user or application in the risk detection logs to distinguish between benign behavioral patterns (e.g., known travel) and potential malicious indicators (e.g., multiple failed sign-in attempts).

  - **Check user access roles:** Validate the roles and permissions associated with the user account experiencing the anomaly. Elevated access to sensitive resources increases the severity of the situation if malicious intent is confirmed.

  ### Prioritization

  This alert carries high severity due to the potential impact on critical systems if an attacker successfully exploits a compromised SAML token. Given the nature of SAML tokens as critical components in authentication workflows, the likelihood of malicious abuse is significant. Such behaviors are also indicators of sophisticated attack strategies often employed by adversaries.

  ### Blind Spots and Assumptions

  The detection may be limited by incomplete log sources or lack of contextual information for determining true user intent. Legitimate activities, such as changes in user location or device usage, may trigger the alert without malicious intent. Ensuring comprehensive coverage through additional alerts, such as monitoring for anomalous Azure portal activity (e.g., administrative tasks) will strengthen the detection framework.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
