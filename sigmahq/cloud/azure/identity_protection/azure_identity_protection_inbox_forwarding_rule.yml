note: |
  ### Technical Context
  This rule detects the creation of suspicious inbox forwarding rules in Microsoft Azure, which may indicate a compromise of user accounts. Attackers often establish forwarding rules to exfiltrate sensitive information by discreetly sending copies of all emails to an external address, thereby avoiding detection. This tactic is typically employed after an initial compromise to gain continued access to sensitive communications and data. The objectives behind such actions usually include data theft, espionage, or establishing persistence within an organization.

  In terms of MITRE ATT&CK, this activity relates to the **Collection** tactic, specifically under the technique ID [T1114.003](https://attack.mitre.org/techniques/T1114/003/) which pertains to data **Email Collection**. Detection of such behavior can provide critical insight into potential account compromise or insider threats.

  Primary data sources for this detection include Azure risk detection logs, which detail user account activities, and can reveal unauthorized changes to inbox rules or suspicious forwarding behaviors.

  ### Investigation Steps
  - **Review Inbox Rules:** Analyze the mailbox rules of the affected user for any suspicious forwarding rules created in the last 30 days, especially those redirecting emails to external addresses.

  - **Check User Sign-In Activity:** Investigate the sign-in logs for the affected account to identify any unusual access patterns or geographical anomalies that may indicate account compromise.

  - **Monitor Additional Risk Events:** Look for related Azure risk detection events that might indicate further anomalous behavior, such as failed login attempts or login activity from unusual locations/devices.

  - **Communicate with the User:** If a suspicious rule is found, contact the user to verify whether they intentionally created the forwarding rule or if they may have fallen victim to a phishing attack.

  ### Prioritization
  This alert is classified as high severity given the potential for significant data loss or exposure resulting from unauthorized email forwarding. The likelihood of this behavior indicating compromise is elevated, particularly if it is coupled with signs of abnormal account activity.

  ### Blind Spots and Assumptions
  The detection logic assumes that all malicious inbox rules will be categorized correctly as 'suspiciousInboxForwarding' within Azure risk detection logs. There may be gaps in detection if legitimate users create forwarding rules without proper oversight. Additionally, if Azure's risk detection service is not fully enabled or misconfigured, this alert may not function effectively, leading to undetected account compromises or malicious activities.

