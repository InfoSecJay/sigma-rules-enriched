note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of inbox rules that forward emails to external addresses, signifying potential compromise or unauthorized access to a user's mailbox. The likely attacker objective is to exfiltrate sensitive information contained within email communications without detection. This behavior aligns with the MITRE ATT&CK tactic "Collection" (TA0009), specifically technique "Exfiltration Over Web Service" (T1041).

  The primary telemetry source is Microsoft Azure's identity protection logs, specifically the risk detection service which generates alerts for suspicious behaviors related to user identity accounts. If the activity is malicious, it can result in breaches of sensitive data and unauthorized access to critical information. Importantly, this detection does NOT confirm that an account has been compromised; it only indicates that suspicious forwarding rules have been created or altered.

  ---

  ### Investigation Steps

  - **Review risk event details**: Check Azure Identity Protection logs (Event ID: TBD) for the suspicious inbox forwarding activity. Look for email addresses that are external and unknown within the organization's acceptable domains.

  - **Examine user account activity**: Inspect the user's sign-in logs in the Azure AD (Event ID: 4624) around the same timeframe. Look for unusual sign-in locations or times that deviate from the user’s typical access patterns.

  - **Identify legitimate forwarding rules**: Confirm if the user had previously established any benign forwarding rules by cross-referencing with documented user activity. Look for internal forwarding addresses or known trusted entities.

  - **Analyze additional mailbox settings**: Validate other settings that may accompany the rule change, such as modifications in permissions or unusual delegated access. Filter for changes in the "Mailbox Settings" logs.

  - **Check for associated alerts**: Correlate with other alerts in Azure AD Identity Protection, such as multiple failed login attempts or alerts for leaked credentials, which may indicate worsening conditions.

  - **Assess external communication patterns**: Monitor the outbound email traffic for the user on logs (e.g., Exchange Online message tracking) for increased volume or unusual external communications following the rule creation/change.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact on sensitive information if malicious. The likelihood of such inbox rules being abused by attackers is significant, especially if they are targeting high-value accounts. Additionally, this type of behavior is often weaponized for data exfiltration and insider threats.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users creating similar forwarding rules for genuine business purposes, which may generate false positives. Accurate detection requires proper audit logging of all mailbox-related changes in Azure. Furthermore, methodical organizational communication about the use of inbox rules can help clarify legitimate activity. A related detection to strengthen coverage would be monitoring for unusual sign-in alerts (e.g., suspicious login attempts) which can indicate an account compromise leading to the rule creation.

