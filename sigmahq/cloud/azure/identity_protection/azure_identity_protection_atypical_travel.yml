note: |
  ### Technical Context

  The rule detects unusual sign-in behavior from a user account where sign-ins originate from geographically distant locations, indicating potential account compromise or unauthorized access. The attacker objective is likely credential theft or account abuse, utilizing stolen credentials to access sensitive resources without the user's knowledge. This behavior aligns with the MITRE ATT&CK tactic "Initial Access" (TA0001) and the technique "Valid Accounts" (T1078).

  Primary telemetry sources include Azure Active Directory logs, specifically risk event types with the property "unlikelyTravel." The security impact of malicious activity can be severe, leading to unauthorized access to sensitive data or systems. However, this detection does NOT confirm that an actual compromise has occurred; it merely indicates anomalous login activity that warrants further investigation.

  ### Investigation Steps

  - **Review sign-in logs for the affected user:** Check Azure Active Directory sign-in logs (Event IDs: 4624) for sign-in times, locations (IP addresses), and devices used. Look for discrepancies or patterns across sign-in attempts.

  - **Evaluate historical travel patterns:** Compare the geographical locations from which the user typically signs in to the locations flagged by this rule. An atypical location with no prior history suggests potential malicious activity.

  - **Examine risk event details:** Verify the full details of the "unlikelyTravel" event within Azure's Risk Detection service. High confidence indicators include valid sign-ins from an atypical location combined with another distant location within a short timeframe.

  - **Identify confirmation of legitimate activity:** Confirm if the user had planned travel or was working remotely during the timeframe of the alerts. Document any known legitimate patterns that may explain the activity.

  - **Investigate account activity restrospectively:** Check for any recent password changes or account recovery requests associated with the user account, as these could indicate previous compromise attempts or legitimate changes pending validation.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems if unauthorized access is confirmed. The likelihood of malicious intent is elevated since unusual sign-ins are often exploited by attackers to circumvent normal access controls. Such tactics are frequently weaponized in credential theft campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate users traveling for work, which could produce false positives. Reliable detection requires properly configured Azure AD logs to capture all necessary risk event types. Furthermore, similar legitimate actions might arise from VPN usage or remote work setups. A companion detection that strengthens coverage includes monitoring for unusual account activity patterns across the Azure AD sign-in logs and Azure Identity Protection alerts.

