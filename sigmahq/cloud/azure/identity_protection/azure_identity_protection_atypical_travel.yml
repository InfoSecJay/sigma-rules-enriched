note: |
  ### Technical Context

  This rule detects sign-in attempts from two geographically distant locations for the same user, identifying potential account compromise or unauthorized access attempts. Attackers may leverage stolen credentials or compromised session tokens to access accounts from anomalous locations. This behavior correlates with the MITRE ATT&CK tactic "Credential Access" (TA0006) and technique "Valid Accounts" (T1078).

  The primary telemetry source is Azure Active Directory (AAD) logs, specifically examining sign-in risk event types with a focus on "unlikelyTravel" segments. If malicious, this could lead to unauthorized data access or manipulation, raising severe security alarms for the organization. Importantly, this detection does NOT confirm that a compromise has occurred; it merely indicates suspicious logon behavior requiring further investigation.

  ### Investigation Steps

  - **Examine user sign-in logs: ** Check Azure AD Sign-in Reports for Event IDs related to user sign-ins (e.g., User Principal Name and sign-in status) to see if the actions correspond with unusual geographical locations.

  - **Validate the legitimacy of unusual locations: ** Compare the current sign-in locations with historical user sign-in patterns. Legitimate users may have typical access patterns, such as location consistency or regular travel routes.

  - **Look for concurrent sessions: ** Identify if there are simultaneous sign-ins from different geographic locations. This may be evident in the Azure AD sign-in logs, which can indicate credential sharing or account compromise.

  - **Identify potential malicious indicators: ** Review any sign-ins showing a high risk level from countries or regions that have historically posed a threat to your organization. Cross-reference the specific sign-in attempts with outside threat intelligence.

  - **Assess user behavior and context: ** Investigate recent activities logged in the Azure AD for the user. Activities such as privilege escalations or atypical resource access near the time of the suspicious sign-ins may indicate malicious intent.

  ### Prioritization

  The alert severity is high due to the potential impact on sensitive user accounts and the likelihood that geographic anomalies indicate account compromise. Such behaviors are commonly weaponized by attackers attempting to bypass traditional security measures, making this an urgent alert for SOC analysts.

  ### Blind Spots and Assumptions

  This detection may miss malicious activity if the adversary uses anonymizing tools (such as VPNs) to avoid geographic anomaly detection. Reliable detection requires comprehensive Azure AD logging configurations to ensure complete visibility of sign-in events. Legitimate scenarios, such as business travel, may also trigger the alert. A related detection is "Impossible Travel," which may further enhance monitoring of those same user accounts.

