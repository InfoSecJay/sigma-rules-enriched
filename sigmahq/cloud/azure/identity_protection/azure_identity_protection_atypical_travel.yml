note: |
  ### Technical Context
  This detection rule identifies instances of "atypical travel" by monitoring user sign-ins from geographically distant locations within a short timeframe. The typical threat scenario involves attackers leveraging stolen credentials or session tokens to access accounts, potentially undermining account security. These suspicious sign-in attempts may indicate an unauthorized user accessing sensitive data or systems, especially if one of the locations is unusual for the user based on their historical behavior.

  The rule maps to MITRE ATT&CK tactics such as *Initial Access (TA0001)* through *Valid Accounts (T1078)* since it is likely that a compromised account is being used for unauthorized access. Additionally, the detection relates to *Defense Evasion (TA0005)*, where attackers may attempt to mask their activities by blending in with normal account usage patterns. The data sources providing the strongest evidence for this detection include Azure risk detection logs, specifically focusing on sign-in events and user location data that reveal anomalous access patterns.

  ### Investigation Steps
  - **Review User Sign-in History:** Analyze the sign-in logs for the user in question to identify patterns of normal behavior and compare them to the detected atypical sign-ins.
  - **Geographical Context Analysis:** Investigate the locations from which the sign-ins originated to determine if they correlate with known VPN usage, unfamiliar regions, or other anomalies.
  - **Cross-Check with Other Alerts:** Correlate this detection with other alerts or anomalies, such as failed login attempts, account lockouts, or unusual account activity, to identify potential multistage attacks.
  - **User Interaction Confirmation:** If possible, reach out to the user to verify whether they were attempting to access their account from the detected locations and gather additional context about their activities.

  ### Prioritization
  The severity of this alert is high due to the potential impact of compromised accounts, which could lead to significant data breaches or unauthorized data access. Given the likelihood of credential theft and subsequent misuse, prompt investigation is essential to mitigate risk.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes users who frequently travel or utilize VPN services, as their legitimate sign-ins may trigger false positives. The detection logic assumes that unusual sign-in behavior is a result of compromised credentials rather than legitimate access, and that historical sign-in patterns are adequately recorded. Additionally, the detection relies on the presence of detailed sign-in logs, which may require specific configurations to be effective across all user accounts and locations.

