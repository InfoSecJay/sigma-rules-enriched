note: |
  ### Technical Context

  This rule detects sign-ins categorized as "unfamiliar properties" for users, which indicates attempts to access accounts from unknown devices, locations, or browsers. The likely attacker objective is to gain unauthorized access to accounts, potentially compromising sensitive data as part of an initial access or credential theft attempt. This behavior aligns with several relevant MITRE ATT&CK tactics and techniques, including Initial Access (TA0001) and Valid Accounts (T1078).

  The primary telemetry source is Azure's Risk Detection service, specifically targeting risk event types related to sign-in activities. If malicious, the security impact could be significant, leading to unauthorized data exposure or account takeover. However, it is important to note that this detection does NOT confirm malicious intent or compromise on its own, as there are legitimate scenarios that may trigger this alert.

  ### Investigation Steps

  - **Review sign-in history:** Examine Azure AD Sign-ins logs (Event ID: 90037) to identify the user's past sign-in locations and device usage. Compare this with the current attempt to determine if the activity is benign (e.g., work trip, new device) or suspicious.

  - **Analyze the unfamiliar properties:** Investigate the specific attributes of the sign-in attempt, including the unfamiliar device ID and geolocation fields. Legitimate devices may show consistent and predictable device IDs and locations in previous sign-ins.

  - **Look for additional context in user behavior:** Review Conditional Access and Identity Protection logs to see if there are patterns of unusual access, such as sign-ins from multiple locations in a short timeframe, indicating a potential account compromise.

  - **Check user account status:** Verify if the user account has been reported for suspicious activities or if it has unusual behavior patterns, such as recently reset passwords or escalated privileges.

  - **Identify high-confidence malicious indicators:** Check for simultaneous logins from geographically disparate locations or flagged IP addresses in security logs, which could suggest a credential stuffing or session hijacking attempt.

  ### Prioritization

  In an enterprise context, the alert severity is high due to the potential impact on sensitive user accounts and data. The likelihood of malicious abuse is considerable, as attackers often leverage unfamiliar sign-ins to initiate further access. This behavior is commonly weaponized in the context of compromised accounts.

  ### Blind Spots and Assumptions

  This detection could be limited by false positive scenarios, such as legitimate user activities like device changes or traveling workers. Required log sources must include detailed Azure AD sign-in logs and user activity logging to ensure comprehensive detection. The alert may be triggered by legitimate activities like a user switching to a new device or accessing resources from a foreign location. A related detection to strengthen coverage would be monitoring for Multiple Failed Sign-ins (T1070), which could identify attempts preceding a successful unfamiliar sign-in.

