note: |
  ### Technical Context

  This detection identifies instances of user sign-ins utilizing unfamiliar properties, such as a new device, location, or browser that do not align with the user's historical sign-in patterns. The likely attacker objective could be account takeover or unauthorized access through credential theft (e.g., phishing or brute-force attacks). This behavior relates to the MITRE ATT&CK technique T1078 (Valid Accounts).

  The primary telemetry source is Azure Risk Detection, which captures anomalous sign-in events based on user behavior analytics. If confirmed malicious, this activity could compromise sensitive data and lead to unauthorized actions within the environment. However, it is important to note that this detection does NOT confirm that an account has been compromised; it merely indicates a sign-in anomaly that requires further investigation.

  ### Investigation Steps

  - **Verify user sign-in history:** Look at Azure Active Directory sign-in logs (Log Analytics, Event ID 4624) for the reported user. Check the previous sign-ins for patterns in device, location, and browser. Legitimate changes may be observed if the user requires new access due to legitimate device or location changes.

  - **Assess unfamiliar sign-in features:** Check the Azure Risk Detection reports for “riskEventType: unfamiliarFeatures” logs. Look for the specific unfamiliar properties (e.g., new device IDs or unusual geographical locations). Compare against the user’s profile for known associated devices.

  - **Validate IP address against known geolocations:** Review the sign-in attempt’s IP address in relation to the user’s typical geolocation. Use threat intelligence feeds to classify the geolocation as benign or suspicious. This can serve as a high-confidence indicator of malicious activity, particularly if the sign-in attempt is from a known malicious region.

  - **Check for recent changes to user properties:** Review any recent changes to the user’s account in Azure AD, focusing on sign-in methods, authentication methods, or any changes that might indicate escalation of privileges or unauthorized access attempts.

  - **Identify related security incidents:** Correlate with other security alerts from related detections, such as credential dumping or lateral movement attempts (e.g., Event ID 4625 for failed sign-ins). Multiple correlated alerts can strengthen the case for a malicious intent behind the sign-in attempt.

  ### Prioritization

  Given the high impact of potential account takeovers in enterprise environments, this alert is of high severity. The likelihood of malicious abuse is considerable, especially when considering the common weaponization of stolen credentials. Account takeovers often lead to significant data breaches, making this alert a priority for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by users changing their devices or locations frequently, resulting in false positives. A reliable detection system requires proper logging configurations in Azure AD to capture detailed sign-in events. Legitimate activities, such as remote work or travel, can trigger this alert. Related detections, like anomalous user behavior analytics (e.g., multiple simultaneous logins), may provide additional context to assess potential threats effectively.

