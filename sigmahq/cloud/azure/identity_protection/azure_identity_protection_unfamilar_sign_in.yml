level: high
note: |
  ### Technical Context
  This rule detects sign-in attempts to Azure accounts that exhibit properties unfamiliar to the user based on their historical sign-in data. This could indicate unauthorized access attempts, where an attacker might be trying to exploit account credentials from atypical locations or devices. By identifying these anomalies, organizations can respond to potential account compromises or identity theft scenarios.

  The attackers' objectives typically align with gaining access to sensitive information or resources within the Azure environment, potentially allowing them to escalate privileges or establish persistence within the network. This detection aligns with several MITRE ATT&CK techniques, including 'Valid Accounts' (T1078) and various techniques across 'Initial Access' and 'Defense Evasion' categories. The primary data sources include Azure Risk Detection logs, sign-in history data, and potentially other telemetry that records authentication events, device metadata, and geolocation information.

  ### Investigation Steps
  - **Review Azure Sign-In Logs:** Analyze the sign-in logs to identify the unfamiliar properties such as devices, locations, or times associated with the alerts. Look for discrepancies compared to normal user behavior.

  - **Cross-Reference Historical Data:** Compare the current sign-in attempt with the user’s historical sign-in records to identify significant deviations. Assess patterns that indicate whether recent changes, such as device or location shifts, might contribute to perceived anomalies.

  - **Assess User Account Activity:** Investigate recent account activities, including password changes or unusual access patterns. This can provide insights into potential account compromise or if the user has legitimately changed their sign-in properties.

  - **Monitor for Related Alerts:** Check for any correlated alerts in the SIEM related to abnormal behaviors like failed login attempts, account lockouts, or other suspicious activities that might indicate a broader security issue involving the user account.

  ### Prioritization
  Alerts for unfamiliar sign-in properties are of high severity because they can indicate potential unauthorized access, which poses significant risk to sensitive data and resources. Immediate attention is recommended to mitigate the risk of a security breach.

  ### Blind Spots and Assumptions
  This detection rule may not cover all environments, especially if users consistently change devices or locations and appear legitimate. The assumption that a user's behavior is known and can be categorized as 'normal' may lead to false negatives for users with variable sign-in contexts. Necessary log sources include comprehensive sign-in history and risk detection logs, properly configured to capture all relevant authentication events in Azure for accurate detection capabilities.

