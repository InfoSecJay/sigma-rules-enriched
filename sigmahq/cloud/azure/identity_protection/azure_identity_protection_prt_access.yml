note: |
  ### Technical Context

  This detection rule identifies attempts to access Primary Refresh Tokens (PRTs), which can facilitate unauthorized lateral movement and credential theft within an organization. Attackers may aim to exploit a compromised account to gain persistent access across services, significantly enhancing their foothold within the network. The relevant MITRE ATT&CK tactics and techniques are Credential Access (TA0006) and Access Token Manipulation (T1528).

  The primary telemetry source for this rule is Azure Risk Detection service logs, specifically focusing on events categorized under `riskEventType` with the value `attemptedPrtAccess`. If malicious, successful access to PRTs poses significant risks, including data exfiltration, unauthorized actions within user contexts, and unauthorized privilege escalation. Importantly, this detection does NOT confirm that PRTs were successfully accessed; it merely signals an attempted access event.

  ### Investigation Steps

  - **Review risk event details:** Start by examining Azure Risk Detection logs for the `attemptedPrtAccess` event. Check user account identifiers and timestamps for correlating actions. Look for unusual logins or activities preceding this event to assess context.

  - **Identify high-confidence malicious indicators:** Cross-reference the user ID associated with the attempted access against known compromised accounts or accounts with unusual geographic login patterns. This may include reviewing Azure AD sign-in logs (Event ID 4624) for unauthorized sign-ins.

  - **Analyze user behavior:** Gather logins and other activity logs for the user in question from the Azure Active Directory sign-in logs, focusing on unusual access times or geographic locations. Legitimate activity often includes regular access patterns consistent with business hours and familiar locations.

  - **Evaluate system role and asset criticality:** Determine the role of the affected user account and whether it has elevated privileges. Accounts with administrative access should be prioritized for immediate investigation due to their potential impact on sensitive system resources.

  - **Check for recent token issuance:** Review Azure AD sign-in logs for any changes in token issuance correspondingly timed with the attempted PRT access. Look for anomalies such as multiple token requests or requests from unexpected devices.

  ### Prioritization

  This alert is classified as high severity due to the potential impact of compromised user credentials, especially within administrative contexts. The likelihood of malicious exploitation is significant since PRTs can enable lateral movement across services. Such behaviors are commonly weaponized in sophisticated attacks against enterprises.

  ### Blind Spots and Assumptions

  The detection may miss scenarios where legitimate users inadvertently trigger the alert due to multi-factor authentication challenges or other legitimate circumstances that require PRT access. Effective detection depends on the full and accurate configuration of Azure Risk Detection logs and may be limited if certain log types are omitted. Additionally, related detections around unusual sign-in patterns (e.g., failed logins or rapid access patterns) can complement this rule for enhanced security monitoring.

