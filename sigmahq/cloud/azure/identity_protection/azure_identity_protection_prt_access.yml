note: |
  ### Technical Context
  This detection rule monitors attempts to access Primary Refresh Tokens (PRTs), which are sensitive credentials used in modern authentication scenarios, especially in environments utilizing Azure Active Directory (AAD). Unauthorized access to a PRT can facilitate lateral movement within an organization’s infrastructure and might lead to credential theft. Attackers may seek PRT access to impersonate legitimate users, bypass security controls, and gain access to sensitive resources.

  The relevant MITRE ATT&CK tactics associated with this rule include **Credential Access** (ID: T1528), which describes various techniques used by adversaries to steal or access credentials. Understanding the potential intent behind PRT access attempts is crucial. Attackers often exploit weaknesses in authentication mechanisms to escalate privileges or access critical systems, which can pose significant risks to the enterprise.

  Primary data sources for this detection will include Azure AD logs, specifically from the risk detection service, which captures events related to authentication attempts. Reviewing these logs can provide insights into unauthorized access attempts and potential exploitation efforts.

  ### Investigation Steps
  - **Review Recent Azure AD Logs:** Check Azure AD risk detection logs for any entries related to attempted PRT access, focusing on the user accounts involved and the context of their actions.
  - **Analyze User Behavior Patterns:** Investigate the behavior of the user associated with the alert. Look for anomalies such as access from unusual locations, unfamiliar devices, or increased sign-in failure counts leading to the alert.
  - **Correlate with Other Security Events:** Identify if there were other security incidents or alerts correlating with the time of the attempted PRT access, such as failed login attempts or suspicious account modifications.
  - **Conduct User Interviews:** If necessary, reach out to the affected user(s) to confirm whether they were aware of and authorized any actions that could have triggered the event, enhancing situational awareness for potential phishing attempts or compromised credentials.

  ### Prioritization
  The severity of this alert is high, reflecting the potential impact on the organization if an attacker successfully accesses a Primary Refresh Token. Given the nature of PRTs and their ability to facilitate credential theft and lateral movement, immediate investigation and remediation are essential.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if the organization does not log all necessary authentication attempts, particularly from non-standard devices or locations. The detection logic assumes that access attempts to PRTs should be infrequent and that legitimate activities will not generate numerous alerts. Organizations must ensure that Azure AD logging is configured correctly for optimal monitoring and that sufficient threat intelligence is available to contextualize such alerts.

