note: |
  ### Technical Context

  The "Impossible Travel" Sigma rule detects user authentication activities that originate from geographically distant locations in a time frame that is shorter than what is physically possible. This behavior often indicates account compromise or credential theft, as an attacker with valid credentials could log in from multiple locations in rapid succession. The relevant MITRE ATT&CK tactics are **Initial Access (TA0001)** and **Valid Accounts (T1078)**. The primary telemetry source is Azure risk detection logs with a focus on risk event type `impossibleTravel`. If malicious, the impact can lead to unauthorized access to sensitive systems and data. This detection does NOT confirm that an account has been compromised without additional context, as legitimate users may similarly connect from different locations due to specific network configurations or VPN usage.

  ### Investigation Steps

  - **Review Azure AD sign-in logs**: Check for the user’s sign-in events (Event ID: 4624) indicating logins from disparate geographical locations within a suspiciously short time frame. Note legitimate travel patterns for comparison.

  - **Cross-reference VPN or remote access usage**: Identify if the user has logged in from a known VPN service or legitimate remote desktop software connecting from expected locations. Look for log entries indicating VPN activity in Network Activity logs.

  - **Assess account activity timeline**: Analyze the timestamps of sign-in attempts to confirm the impossibility of physical travel, specifically focusing on the time difference between logins from different IPs.

  - **Identify high-confidence malicious indicators**: Look for anomalous IP addresses or regions that do not correlate with the user's typical activity. Use geolocation services to check the credibility of the indicated locations.

  - **Check for compromised credentials**: Review for any recent alerts related to unusual account behavior or indications of phishing, such as anomalous password change events (Event ID: 4723 or 4724).

  ### Prioritization

  This alert is high severity due to the potential for account compromise, which can lead to extensive unauthorized access and data exfiltration specifically targeting critical systems. The likelihood of malicious abuse is significant, as adversaries frequently utilize stolen credentials to perform lateral movement.

  ### Blind Spots and Assumptions

  The detection has limitations, as users may trigger the alert through legitimate means, such as VPN usage or travel to remote locations. Reliable detection requires appropriate Azure AD configurations for event logging and alerts. Additionally, legitimate activities such as business travel or cloud service provisioning may lead to false positives. A companion detection would include monitoring for concurrent logins from different geographical locations, enhancing context around user activity.

