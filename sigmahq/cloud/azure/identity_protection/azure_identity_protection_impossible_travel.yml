note: |
  ### Technical Context

  This rule detects user activities that originate from geographic locations that are impossibly distant from one another within a time frame that exceeds the amount of time it would take to travel between those locations. The likely objective of an attacker leveraging this technique is to impersonate legitimate users to bypass authentication or gain unauthorized access to sensitive resources. This behavior is aligned with the MITRE ATT&CK technique of "Valid Accounts" (T1078), which is often leveraged during initial access or privilege escalation.

  Primary telemetry sources include Azure Active Directory risk detection logs, specifically focusing on risk event types related to user sign-ins. If malicious, this behavior could indicate a compromised account being used to impersonate a legitimate user, potentially leading to unauthorized access. However, it's important to note that this detection does NOT confirm a successful compromise; it merely indicates suspicious sign-in activity that warrants further investigation.

  ### Investigation Steps

  - **Check user sign-in logs for anomalies**: Review Azure Active Directory sign-in logs (which include Event IDs associated with login events) for the user implicated in the alert. Look for logins from multiple locations within a suspicious time frame that is inconsistent with the user's typical behavior.

  - **Verify legitimate travel patterns**: Investigate users' historical login patterns to confirm legitimate travel-related sign-ins. If a user logged in from Location A and then from Location B within a short time frame, ensure there is evidence of travel or VPN usage (e.g., VPN IP addresses).

  - **Assess VPN activity**: Look for logs indicating a VPN connection around the time of the alert. Check for Event IDs relating to VPN sessions in Azure and confirm the IP addresses used align with a legitimate exit node.

  - **Identify high-confidence malicious indicators**: Monitor for repeated alerts from the same user account, suggesting persistent attempts at unauthorized access. Evaluate other risk event types related to the account (such as failed logins or account lockouts) from Azure Network logs as additional context.

  - **Review account permissions and roles**: Validate the user account's access permissions to determine if it possesses elevated privileges, increasing the risk posed by potential account compromise.

  ### Prioritization

  The severity of this alert is high due to the potential impact on sensitive accounts and systems. The likelihood of malicious abuse is significant, as attackers regularly use techniques that exploit valid accounts for unauthorized access. This type of behavior is often weaponized in credential theft and account takeover attacks.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate users who frequently travel or utilize VPN services, which may result in false positives. Comprehensive coverage requires proper log configurations to capture all relevant sign-in events for accurate analysis. Additionally, legitimate user activity such as using remote access tools or legitimate account sharing may trigger this alert. A related detection to consider is the monitoring of suspicious permission changes or privilege escalations associated with the same user account, providing a more holistic view of potential compromise.

