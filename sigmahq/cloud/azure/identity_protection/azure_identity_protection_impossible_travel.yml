note: |
  ### Technical Context
  This detection rule identifies events where a user's login activity originates from two geographically distant locations within an implausibly short timeframe. Such scenarios often indicate compromised accounts and can be a sign of malicious activity, such as account takeovers or unauthorized access attempts. Attackers may leverage stolen credentials to access accounts from different regions, leading to quick movements across geographic boundaries, which normal user behavior typically does not exhibit.

  The relevant MITRE ATT&CK tactics and techniques include **Initial Access (TA0001)**, specifically **Valid Accounts (T1078)**, and may also relate to **Privilege Escalation (TA0004)** if the attacker gains elevated privileges following unauthorized access. Observing this behavior can significantly impact an organization’s security posture, as it may signal credential theft or misuse.

  Primary data sources that will provide necessary evidence for this detection include **Azure risk detection logs**, which capture information about sign-in attempts and associated risk events. Additionally, telemetry from VPN connections may provide context around legitimate user activities, helping to distinguish between benign and suspicious login attempts.

  ### Investigation Steps
  - **Review Azure Risk Detection Logs**: Examine logs related to sign-in events flagged as "impossible travel" to identify the specific accounts involved and the locations from which the login attempts originated.
  - **Check VPN Connection Logs**: Analyze VPN logs for valid connections that may explain the geographic anomalies detected in the sign-in attempts. Look for potential simultaneous connections from different regions.
  - **Investigate Account Activity**: Assess user activity associated with the flagged accounts, including recent changes in permissions, to identify any unusual behaviors or access patterns that could indicate an account compromise.
  - **Coordinate with User**: Contact the affected user to verify whether they attempted logins from multiple locations and to further investigate any reported suspicious activity.

  ### Prioritization
  The high severity of this alert is justified due to the potential impact of compromised accounts on an enterprise environment, where attackers can exfiltrate sensitive data or disrupt critical operations. The likelihood of such incidents occurring is also increasing with the rise in phishing and credential theft techniques.

  ### Blind Spots and Assumptions
  This detection logic may have gaps, particularly for users who legitimately travel frequently or those who connect via VPNs from different locations. The alert assumes that account activity is not authorized and fails to account for necessary configurations that would accurately capture all relevant activity. It requires comprehensive logging from Azure risk detection and other environment logs to operate effectively, ensuring that user movements are tracked adequately to avoid false positives.

