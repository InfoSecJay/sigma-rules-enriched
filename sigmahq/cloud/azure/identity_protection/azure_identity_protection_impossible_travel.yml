  ---

  ### Technical Context

  This rule detects user activities originating from geographically distant locations in a time frame that is not physically feasible for travel. Commonly referred to as "impossible travel," it indicates potential account compromise, where an attacker may have gained unauthorized access to a user's credentials, leading to simultaneous logins from different geographic locations. This behavior primarily aligns with the MITRE ATT&CK technique for valid accounts (T1078) and is relevant to tactics that include initial access, persistence, and defense evasion. Primary telemetry sources include Azure AD risk detection logs. If malicious, this could result in unauthorized data access, lateral movement, or data exfiltration. This detection does NOT confirm that an account was definitively compromised, as legitimate remote access methods (like VPN use) could trigger it.

  ---

  ### Investigation Steps

  - **Validate login details:** Review Azure AD sign-in logs for related Event IDs (e.g., 4624) to confirm times and locations of sign-in attempts. Compare the timestamps; if the sign-in occurs within an unrealistic travel time from the previously logged IP address, flag as suspicious.

  - **Check log correlation:** Analyze related logs for any other suspicious activities in the timeframe (e.g., multi-factor authentication logs). Confirm if the account shows patterns of unusual behavior that precede or follow the impossible travel alerts.

  - **Assess for legitimate activity:** Determine if the user typically operates across multiple geographic locations. If their historical sign-ins include VPN usage or remote work acknowledgments, this can offer benign context to the alert.

  - **Identify high-confidence indicators:** Look for anomalous patterns in failed login attempts (Event ID 4625) or unusual access to sensitive resources just after the impossible travel incident, indicating potential exploitation.

  - **Review account status:** Query Azure AD to check the user's account state and any recent changes, including password resets or additional sign-ins within a short time from other locations that may indicate credential theft.

  ---

  ### Prioritization

  This alert carries high severity due to the potential for unauthorized access to sensitive information systems and the high probability that it may indicate compromised user credentials. The nature of impossible travel is a known technique that attackers frequently exploit, making it critical for immediate review.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate activities such as connection through corporate VPNs or travel by the user not recorded in the system. Accurate detection requires comprehensive log configurations in Azure AD, with specific attention to monitoring VPN-related events. Related detections, such as those for anomalous authentication methods (e.g., T1110 - Mechanical Exploitation) could help reinforce context regarding compromised accounts.

