note: |
  ### Technical Context

  This Sigma rule detects user sign-in activity in Azure Active Directory that appears unusual based on historical patterns for that specific user. The likely objective of an attacker leveraging this behavior would be to gain unauthorized access to accounts, potentially leading to data exfiltration or lateral movement within the organization. This detection corresponds to the MITRE ATT&CK tactics of Initial Access (TA0001) and Persistence (TA0003) with the technique of Valid Accounts (T1078). The primary telemetry source is Azure AD's risk detection logs, focusing on riskEventType: 'investigationsThreatIntelligence'. If malicious, the impact can include unauthorized access to sensitive data and increased risk to the organization’s assets. Importantly, this detection does NOT confirm that an account has been compromised on its own; it requires further investigation to determine intent and context.

  ### Investigation Steps

  - **Review user sign-in history:** Check Azure AD sign-in logs for Event ID 4624 (Logon) associated with the same user to determine the context of their recent activity, such as the locations, devices, or applications used.

  - **Analyze suspicious behavior:** Look for sign-in events from unusual IP addresses or geographical locations not typical for the user. Verify against known bad IPs or geolocation patterns.

  - **Cross-reference with threat intelligence:** Consult third-party threat intelligence feeds that may indicate that the user's sign-in patterns align with known attack vectors. This information can support whether the event falls within typical malicious activity.

  - **Identify high-confidence malicious indicators:** If the user signed in to multiple accounts or different locations in a short time frame (e.g., within minutes), refer to Azure AD sign-in logs to capture these events and assess their legitimacy.

  - **Examine session context for legitimacy:** Legitimate activity may include sessions from known devices or locations. Confirm if the sign-ins match previously normal behavior patterns for that user or if there are drastic deviations.

  - **Check for related security alerts:** Review for any concurrent alerts or incidents, such as failed login attempts or unusual application access, from Microsoft Sentinel or other SIEM tools to ascertain if there are compounded concerns.

  ### Prioritization

  This alert is considered high-severity due to the potential for significant impact on enterprise security. The likelihood of malicious abuse is high, particularly with attackers frequently targeting accounts via credential theft or brute force methods. Given that unusual sign-in behavior is a common indicator of compromise, it warrants immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like using legitimate credentials that have already been compromised. Reliable detection requires comprehensive logging from Azure AD, particularly around sign-ins, and may miss events without robust log retention. Legitimate user behavior, such as traveling or remote work scenarios, may trigger this alert. A related detection worth considering includes monitoring for failed sign-in attempts (Event ID 4625) that can indicate brute force attempts against user accounts.

