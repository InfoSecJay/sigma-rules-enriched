note: |
  ### Technical Context

  This Sigma rule detects unusual user sign-in activities in Azure AD that align with patterns consistent with potential attacks. Likely attacker objectives include unauthorized account access or privilege escalation, often achieved through techniques such as credential dumping or account compromise. The relevant MITRE ATT&CK tactics include **Initial Access (TA0001)** and **Credential Access (TA0006)**, particularly the technique for **Valid Accounts (T1078)**.

  Primary telemetry sources include Azure AD logs, especially those under the Risk Detection category, capturing events related to user access behavior. If the detected activities are indeed malicious, they can lead to unauthorized access to sensitive resources or data breaches. It is crucial to note that this detection does NOT confirm a breach; it identifies potentially suspicious activities that warrant further investigation.

  ### Investigation Steps

  - **Review sign-in frequency and types**: Check Azure AD sign-in logs (Event ID: 4624). Compare abnormal sign-in attempts (e.g., unusual geographic locations or times) against the user’s normal sign-in patterns. Look for expected behavior, such as sign-ins from recognized devices or locations.

  - **Examine account activity**: Analyze the risk detection logs (riskEventType: ‘investigationsThreatIntelligence’) in Azure AD to identify multiple failed login attempts followed by a successful sign-in. This pattern may indicate credential stuffing attacks attempting to gain access.

  - **Correlate with other alerts**: Utilize security tools to cross-reference with additional anomaly detection alerts regarding the same user and devices, checking for previously logged threat indicators or other suspicious activities.

  - **Investigate device details**: Confirm the sign-in device via Azure Device Registration logs (Event ID not specified). Look for unknown or unauthorized devices. Legitimate devices should align with the user’s usual device set.

  - **Check for unusual access to resources**: Review access logs to sensitive data (such as Azure Blob Storage or other critical resources) post-alert trigger. Look for signs of lateral movement or data exfiltration attempts.

  ### Prioritization

  This alert is high severity as it indicates potential active attempts to exploit an Azure AD account. The criticality of the affected system—often linked to sensitive data or administrative functions—heightens the risk. Behavior similar to known attack patterns raises the likelihood of malicious intent, necessitating swift follow-up.

  ### Blind Spots and Assumptions

  Limitations include potential evasion methods employed by attackers, such as using established VPNs or legitimate credentials for access. Reliably capturing these alerts requires proper configuration of Azure AD logging and risk detection settings. Legitimate activities, such as remote work or access during unusual hours, can trigger this alert. A companion detection, such as monitoring for **Suspicious User Agent Strings** (T1071.001), could strengthen overall coverage.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
