note: |
  ### Technical Context

  This Sigma rule detects suspicious inbox manipulation rules within email services, specifically configurations that delete or relocate messages or folders in a user's inbox. The likely attacker objective is to conceal malicious activities such as phishing or exfiltration of sensitive information by manipulating what users see in their mailboxes. It relates to the MITRE ATT&CK Tactic: **Defense Evasion** and Technique: **Manipulation of inbox rules (T1140)**.

  The primary telemetry source for this detection is Azure's risk detection logs, particularly focusing on the event type `mcasSuspiciousInboxManipulationRules`. If this activity is malicious, it could lead to significant data breaches and unauthorized access to sensitive information. Importantly, this detection does NOT confirm that the rule was successfully executed; it only indicates that such a rule has been created or modified.

  ### Investigation Steps

  - **Check mailbox rule details:** Review the specific inbox manipulation rules by accessing the mailbox configuration through the Azure portal or the Email Management tool. Look for rules that delete or move messages in a manner inconsistent with the user's normal email usage.

  - **Verify user activity logs:** Correlate with Azure Active Directory logs (Event ID 4624) to confirm legitimate sign-ins made by the user. If sign-ins or mailbox changes are made from unusual locations or devices, it may indicate compromised credentials.

  - **Identify high-risk manipulation events:** Search for the specific `riskEventType: 'mcasSuspiciousInboxManipulationRules'` in the Azure risk detection logs. Identify if these events correspond with unusual login times or locations that could signify a compromise.

  - **Investigate historical inbox usage:** Compare current rules with past inbox rules configured for the user. Determine if there is a notable change or creation of rules that aligns with anomalies in user behavior, such as increased support tickets or password resets.

  - **Assess benign usage patterns:** Examine standard email management practices for the user. If they frequently utilize filters to categorize incoming emails, it may explain some legitimate rule manipulations, as opposed to sudden unusual configurations.

  - **Monitor for email forwarding rules:** Look for existing email forwarding rules in the mailbox settings that may be set without user knowledge, as this can indicate a malicious actor attempting to exfiltrate data. Access the mailbox settings and check for unusual forward configurations.

  ### Prioritization

  This alert has a high severity level due to its potential impact on the integrity of user communications and the likelihood of malicious abuse, particularly in targeted phishing or Business Email Compromise (BEC) scenarios. Such behavioral manipulation is frequently exploited by adversaries to evade detection and maintain access.

  ### Blind Spots and Assumptions

  Detection may be limited by the completeness and configuration of risk detection logs; misconfigured Azure policies could prevent full visibility into all user actions. Legitimate activities, like users implementing filters for organizational purposes, can trigger this alert. Companion detections, such as monitoring for unusual sign-ins (e.g., Azure AD logs or Conditional Access Policies), can enhance overall security posture and provide context to suspicious behavior.

