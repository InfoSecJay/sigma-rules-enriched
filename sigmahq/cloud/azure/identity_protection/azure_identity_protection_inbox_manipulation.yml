note: |
  ### Technical Context

  This rule detects suspicious modifications to a user's email inbox, specifically rules that delete or move messages or folders. This behavior is indicative of unauthorized attempts to manipulate or hide communications, which can facilitate data exfiltration or obfuscation of malicious activity. The primary objective of such an attack is often to disrupt normal communication, avoid detection, or maintain persistence within the network.

  The relevant MITRE ATT&CK tactics are **Defense Evasion** (TA0005) and **Impact** (TA0040), specifically the technique of **Email Rules Manipulation** (T1140). Primary telemetry sources include Microsoft Azure's risk detection logs, particularly focused on events flagged as `mcasSuspiciousInboxManipulationRules`. If this activity is malicious, it may result in significant operational impact, such as loss or alteration of critical communications.

  It is important to note that this detection does NOT confirm a confirmed breach or compromise; false positives can arise from legitimate email management behaviors.

  ### Investigation Steps

  - **Check risk detection logs for events:** Review logs for `riskEventType: mcasSuspiciousInboxManipulationRules` in Azure AD with event timestamps to correlate with the user’s activity to determine the context of the rule creation.

  - **Identify user and rule context:** Investigate the user associated with the suspicious activity. Validate if the user has job functions that typically require inbox rules. Legitimate activities might involve creating rules that prioritize certain emails or organize incoming communications based on specific criteria.

  - **Confirm the nature of manipulated rules:** Look for specific attributes in the inbox rules that are created or modified (event fields may include `RuleName`, `RuleAction`, `Condition`), focusing on actions like message deletion or unexpected folder movements that deviate from user norms.

  - **Correlate other user activities:** Review additional logs such as Sign-in logs (Event ID 4624) to see if there are any unusual sign-ins or failed login attempts around the time the rules were created or modified, which could suggest account takeover or compromise.

  - **Assess user permissions and share links:** Evaluate if the user has elevated privileges that allow modification of inbox rules. Unusual permissions could imply a potential security risk.

  - **Investigate for persistence mechanisms:** Look for additional indicators of compromise, such as unexpected application accesses via API logs, that might show broader malicious activity using the user's credentials.

  ### Prioritization

  This alert carries a high severity because it targets potential unauthorized manipulation of email communication, a critical channel for organizational operations. The likelihood of such manipulation being a precursor to further attacks or data breaches is significant, making this behavior a common tactic among adversaries.

  ### Blind Spots and Assumptions

  The detection relies heavily on the logging configurations of Azure, and if logging is not properly set up, these actions may go unmonitored. Users may have legitimate workflows that create or modify inbox rules, leading to false positives. Additionally, relevant detections could involve `mcasSuspiciousMailboxAccess` actions, providing a broader coverage regarding the integrity of user mailboxes during investigations.

