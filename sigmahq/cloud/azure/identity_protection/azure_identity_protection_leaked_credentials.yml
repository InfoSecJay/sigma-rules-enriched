note: |
  ### Technical Context

  This Sigma rule detects instances of leaked credentials within Azure Active Directory (AD), indicating that an attacker may have gained unauthorized access to valid user credentials. The likely objective of the attacker is to bypass authentication and impersonate legitimate users, which can lead to data breaches or unauthorized actions in the environment. This behavior aligns with the MITRE ATT&CK tactic of *Credential Access* (TA0006) and the associated technique of *Credential Dumping* (T1003).

  The primary telemetry source is Azure AD Risk Detection logs, specifically the `riskEventType` field with the value `leakedCredentials`. If these credentials have been compromised, the impact could be significant, enabling attackers to gain further access to sensitive data or systems. It should be noted that this detection does NOT confirm active exploitation on its own; it merely suggests that leaked credentials have been identified and require further investigation.

  ### Investigation Steps

  - **Check Azure AD Risk Detection logs**: Look for logs with the `riskEventType` field equal to `leakedCredentials`. Investigate the timestamp and associated user to determine if this aligns with recent observed user activity.

  - **Review recent sign-in activities**: Examine Azure AD sign-in logs (Event ID 4624) within the relevant time frame. Look for unusual patterns such as logins from unfamiliar geolocations or devices, which could indicate credential abuse.

  - **Identify core affected accounts**: Focus on high-privilege accounts (like administrators) that, if compromised, pose a greater risk to the organization. Check their roles in Azure AD and relevant activity logs.

  - **Analyze user behavior patterns**: Compare the affected user's recent actions, looking for deviations from baseline activity. For instance, if the user typically accesses resources during business hours and has been logging in at odd hours, raise this as a potential indicator of malicious use.

  - **Investigate automated alert triggers**: Assess for any legitimate application or service that may lead to false positives (e.g., third-party monitoring tools) or rare hash collisions. Validate if those tools could be responsible for the alert to reduce investigation time.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on critical accounts and high likelihood of malicious exploitation. Leaked credentials are commonly weaponized in post-exploitation scenarios, making prompt investigation essential to mitigate possible threats.

  ### Blind Spots and Assumptions

  Detection may be limited by the completeness of Azure AD logging configurations; ensure all relevant logs are enabled for reliable detection. High-value users might inadvertently trigger this alert through legitimate third-party integrations or tools. A related companion detection includes monitoring for anomalous sign-in attempts or unusual sign-in locations that can strengthen overall coverage against compromised accounts.

