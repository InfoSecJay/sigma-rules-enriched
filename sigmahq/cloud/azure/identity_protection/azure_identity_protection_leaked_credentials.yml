note: |
  ### Technical Context
  This detection rule identifies instances where a user’s valid Azure Active Directory (AD) credentials have been leaked. When attackers obtain leaked credentials, they can potentially gain unauthorized access to sensitive systems, pursue further reconnaissance activities, or execute a variety of malicious actions, thereby compromising the integrity of the target environment. The detection of leaked credentials may indicate that attackers are utilizing these leaked credentials to escalate privileges or move laterally within the network, which aligns with their objectives of gaining control over valuable resources or data.

  Relevant MITRE ATT&CK tactics/techniques include Credential Access (TA0006) and Reconnaissance (TA0007), specifically highlighting Credential Dumping (T1003) and Account Manipulation (T1098). These techniques suggest that attackers have successfully acquired information that can be used to navigate within an organizational system. Evidence for this detection primarily stems from Azure's risk detection service, which analyzes sign-in attempts and can provide insights into unusual activities or alerts pertaining to credential leaks.

  ### Investigation Steps
  - **Review Risk Detection Alerts**: Investigate alerts from Azure AD's risk detection service that indicate leaked credentials. Examine details surrounding the alerts including the timestamp and impacted accounts.
  - **Analyze Sign-in Logs**: Evaluate Azure AD sign-in logs during the timeframe of the credential leak alerts to identify any unusual or unauthorized access attempts originating from unfamiliar IP addresses or geolocations.
  - **Correlate with Security Events**: Correlate the findings with other security events from your SIEM, EDR, and additional telemetry to determine if unusual patterns or increased activity levels coincide with the credential leaks.
  - **Assess User Behavior**: Review user behavior analytics to identify unusual actions taken by the affected accounts after the detection of credential leaks, such as accessing resources or data that are inconsistent with their typical usage patterns.

  ### Prioritization
  Given the high potential impact associated with leaked credentials, including unauthorized access to critical systems and data breaches, this alert warrants high severity. In enterprise environments, the likelihood of exploitation of such leaks can lead to severe operational disruptions and trust issues with clients.

  ### Blind Spots and Assumptions
  Key gaps may include environments that do not utilize Azure AD's risk detection capabilities or have limited visibility into credential usage activities. The detection logic assumes that emergent credential leaks are logged and appropriately flagged by Azure AD, which may not occur in environments with default settings or lack of proper configuration. The effectiveness of this alert relies on robust logging from Azure services to ensure all relevant credential leak events are captured and reported.

