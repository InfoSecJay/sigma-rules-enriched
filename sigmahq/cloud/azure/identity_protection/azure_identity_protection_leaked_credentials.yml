  ### Technical Context

  This Sigma rule detects the event of valid Azure AD user credentials being leaked, which typically occurs due to data breaches, phishing attacks, or other credential harvesting methods. The likely objective of an attacker would be to gain unauthorized access to user accounts, enabling further espionage or lateral movement within the enterprise network. This detection corresponds to the MITRE ATT&CK tactic of "Credential Access" (TA0006), specifically technique "Leaked Credentials" (T1589).

  The primary telemetry source for this detection is Azure AD's risk detection service, which captures events related to credential leaks. If confirmed malicious, compromised credentials can lead to unauthorized account access, data exfiltration, or deployment of further attacks within the enterprise. Importantly, this detection alone does not confirm that a breach has occurred, as legitimate user behavior could potentially trigger a similar alert.

  ---

  ### Investigation Steps

  - **Confirm event details:** Verify the specific event ID from Azure AD’s risk detection logs (e.g., Event ID specific to 'leakedCredentials'). Check related fields for affected user accounts and timestamps of the detection to establish context.

  - **Assess user behavior:** Investigate recent login attempts for the affected user. Cross-reference these attempts against Azure AD Sign-In logs (e.g., Event ID 4624). Look for unusual locations, times, or devices that may indicate compromised credentials.

  - **Examine password reuse:** Cross-check the credentials against known-leaked databases or sources (e.g., Have I Been Pwned) for common password patterns or collisions. If found, it potentially validates suspicious access attempts.

  - **Review account roles and permissions:** Identify the role of the affected user account in the organization. Accounts with elevated privileges that have leaked credentials pose a higher risk, thus warranting urgent attention.

  - **Look for correlated threats:** Analyze Azure AD Identity Protection logs closely for other indicators of compromise (e.g., alerts for conditional access policies being triggered). Correlation with multiple risk events may suggest a higher confidence level regarding the compromise.

  ---

  ### Prioritization

  The alert severity is high because compromised credentials can provide immediate access to sensitive systems and data. The likelihood of malicious use is elevated, as this behavior is often exploited in the wild. Credential leaks are a common precursor to many targeted attacks, making this a critical alert to investigate promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the log retention policies within Azure AD, potentially resulting in missing contextual clues. Legitimate activity, such as a password reset or account relocation, could inadvertently trigger the rule, leading to false positives. A related detection that strengthens coverage is monitoring for unusual sign-in attempts from new locations or devices, which can provide additional context regarding the leak.

