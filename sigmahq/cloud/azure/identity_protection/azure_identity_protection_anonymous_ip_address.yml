  ---

  ### Technical Context

  This Sigma rule detects sign-ins associated with anonymous IP addresses, typically generated through the use of VPNs or privacy-focused browsers. The likely attacker objective is to obscure their identity and location while attempting unauthorized access to enterprise resources, potentially leading to credential theft or other malicious activities. This activity is relevant to the MITRE ATT&CK framework under the tactic of Credential Access (TA0006) and the technique of Exploit Public-Facing Applications (T1528).

  The primary telemetry source is Azure RiskDetection logs, specifically monitoring for events classified with the riskEventType of ‘anonymizedIPAddress’. If malicious, this behavior may allow attackers to infiltrate systems without easily being traced. It's important to note that this detection does NOT confirm that the sign-in was malicious on its own; further context and investigation are required to establish intent.

  ---

  ### Investigation Steps

  - **Check for Active Sessions**: Review Azure sign-in logs (Event ID: 4624) for sessions marked with the riskEventType ‘anonymizedIPAddress’. Compare timestamps and user agents to identify patterns of suspiciousness.

  - **Review Geo-Location Data**: Analyze sign-in logs for geographical inconsistencies. If the IP address originates from a country previously unseen in user access patterns, flag it for deeper review.

  - **Assess User History**: Investigate the account's recent activity (Event ID: 4624) and historical logins. Legitimate users typically show consistent patterns in login locations; anomalous logins may suggest compromise.

  - **Look for Subsequent Actions**: Identify any actions taken post login from the suspicious IP, such as access to sensitive resources or escalated permissions. Document any higher-risk actions taken from that session.

  - **Correlate with Other Alerts**: Check for existing alerts related to the same user account. An uptick in alerts from this user could indicate malicious activity leveraging the anonymity of the IP address.

  - **Validate Identity Protection Triggers**: Look into other risk detections within Azure Identity Protection that may indicate an escalation attempt alongside the anonymous login. This can highlight emerging threats.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on sensitive data if a malicious actor successfully exploits the anonymity of their connection. The likelihood of abuse is significant, as many adversaries employ techniques to hide their true identities when attacking organizations. Anonymous IP addresses are common in various attacks, especially in credential access scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by possible evasion techniques such as advanced proxy services that may not be flagged as anonymous IP addresses. Reliable detection requires proper configuration of Azure RiskDetection logs to ensure comprehensive monitoring. Legitimate activities like remote work may also trigger this alert from users using VPNs. Companion detections, such as monitoring high-privilege access following anonymous logins, can provide a broader security posture and enhanced visibility into potential threats.

