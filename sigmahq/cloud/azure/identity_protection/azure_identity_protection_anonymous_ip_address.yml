note: |
  ### Technical Context

  This rule detects sign-ins from an anonymous IP address, which may be indicative of users leveraging VPNs or anonymizing browsers to obscure their true location. This behavior could be linked to a variety of attacker objectives, including unauthorized access attempts or evasion of security controls. The relevant MITRE ATT&CK tactic is **Credential Access**, with technique ID **T1528**.

  The primary telemetry sources include Azure Risk Detection logs, specifically events categorized under the `riskEventType` of `anonymizedIPAddress`. If confirmed malicious, this behavior can lead to unauthorized access, data breaches, or impersonation of legitimate users. It is important to note that this detection does NOT confirm malicious intent on its own, as it may also correlate with legitimate user behavior in certain scenarios.

  ### Investigation Steps

  - **Review sign-in context:** Check Azure AD sign-in logs (Event ID: 4624) for additional details on the sign-in attempt, including the user account, timestamp, and associated device information.

  - **Identify known VPN usage:** Cross-reference the sign-in with known user behavior or organizational VPN usage policies. A legitimate user may regularly connect via a specific VPN service, while a suspicious sign-in may show a high-risk IP or geographic anomalies.

  - **Examine session risk levels:** Utilize Azure Identity Protection to assess the risk level assigned to the sign-in attempt. A high-risk sign-in from an anonymized IP should be prioritized for further investigation.

  - **Look for patterns of behavior:** Analyze previous sign-in attempts from the same user to identify any unusual patterns, such as multiple failed logins followed by a successful sign-in from an anonymous IP.

  - **Check for correlated alerts:** Review alerts in Azure Security Center for additional indicators of compromise associated with the IP address, such as other failed or risky sign-ins from different accounts in the same timeframe.

  ### Prioritization

  This alert is high severity due to the potential risk of compromised accounts, especially if the affected system is critical to business operations. The use of an anonymous IP is frequently associated with malicious activities attempting to bypass security measures.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of certain legitimate VPN services that could trigger the alert, potentially leading to false positives. Reliable detection relies on the consistent logging of Azure Risk Detection events and user activity patterns. Additionally, business travel or remote work scenarios may result in legitimate users appearing as anomalies. Companion detections include monitoring for **Unusual Location Sign-Ins** to strengthen the correlation of risky behavior across the enterprise.

