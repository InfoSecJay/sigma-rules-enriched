note: |
  ### Technical Context

  This Sigma rule detects sign-in attempts from IP addresses that are classified as malicious, based on threat intelligence feeds. The primary goal of an attacker utilizing such an IP would likely be unauthorized access to sensitive user accounts or systems, correlating with credential theft or compromised credentials. This aligns with the MITRE ATT&CK tactic **Initial Access** (TA0001) and technique **Exploitation of Credentials** (T1078).

  The primary telemetry source for this detection is Azure's risk detection service, specifically analyzing logs for the event type **suspiciousIPAddress**. If malicious, this behavior may indicate that an attacker has successfully bypassed initial defenses to attempt unauthorized access. However, this detection does NOT confirm that the sign-in was successful or that the account has been compromised.

  ### Investigation Steps

  - **Identify the triggering event:** Review Azure risk detection logs (Event ID specific to **suspiciousIPAddress**) for the user account in question. Look for the source IP associated with the sign-in attempt and identify if it matches known malicious IPs.

  - **Check recent sign-in history:** Cross-reference the suspicious sign-in with the user’s recent login activity in Azure AD (Log type: Azure AD Sign-in logs). Look for unusual patterns, such as multiple failed attempts or logins from geographical locations atypical for that user.

  - **Validate the malicious IP:** Use threat intelligence tools to confirm that the reported IP address is indeed malicious at the time of the sign-in. Document the threat intelligence source and the associated threat actor if available.

  - **Analyze the impact:** Determine the privilege level of the user account involved. High-privilege users (e.g., admins, finance) warrant more urgent investigation due to the potential impact on security and data integrity.

  - **Review legitimate activity:** Investigate if there have been recent changes in the user's typical sign-in patterns, such as traveling or remote work, and adapt the context of the sign-in accordingly.

  - **Search for related security incidents:** Check if there are any ongoing alerts or incidents associated with the user’s account or the malicious IP address in your detection and response platform. Intensify scrutiny on related security events.

  ### Prioritization

  This alert is considered high priority due to the potential impact of a successful malicious sign-in on sensitive systems and user accounts. The likelihood of credential exploitation via malicious IPs is high as attackers often leverage compromised infrastructure. This behavior is indeed weaponized by adversaries to gain initial access.

  ### Blind Spots and Assumptions

  Detection limitations may arise from reliance on threat intelligence feeds, which can have latency in updates. Legitimate users traveling may trigger the alert if they log in from IPs classified as suspicious. Ensure that Azure AD logs are correctly configured to capture all relevant sign-in events. A related detection to consider is monitoring for unusual geographical access patterns that may indicate further malicious activity.

