note: |
  ### Technical Context
  This detection rule identifies sign-in attempts originating from known malicious IP addresses, which are recognized at the time of the login. Attackers may leverage such IP addresses to automate access attempts, subsequently launching attacks against compromised user accounts or gathering sensitive data. When an organization sees sign-ins from these IP addresses, it often indicates potential account compromise attempts or unauthorized access, which could lead to further exploitation within the environment.

  The relevant MITRE ATT&CK tactics for this alert include **Initial Access (TA0001)** via techniques like **Command and Control (T1090)**. Attackers may use a variety of tools and techniques to mask their identity, so anomalous sign-ins from malicious IPs should raise immediate concern. The primary data source for this detection is the Azure Risk Detection service, which provides insights into potential threats related to user sign-ins based on risk events associated with the IP addresses utilized.

  ### Investigation Steps
  - **Review Sign-in Logs**: Examine the Azure sign-in logs for the user accounts associated with the flagged malicious IPs. Look for patterns such as repeated failed sign-in attempts or unusual times of access.
  - **Correlate with Other Alerts**: Check for other security alerts that may be tied to the user account in question. Analyze if there are existing alerts related to account compromise or unusual behavior in conjunction with the sign-in event.
  - **Assess User Activity**: Analyze other user activity in the timeframe surrounding the suspicious sign-in events. Look for any unauthorized actions taken by the account, such as accessing sensitive data or unusual resource requests.
  - **Contextual Information Gathering**: Gather additional context around the flagged malicious IP addresses. Utilize threat intelligence tools to assess the risk levels associated with these IPs and any known malware or attacks they have been connected to.

  ### Prioritization
  Alerts stemming from sign-ins using known malicious IP addresses should be prioritized as high severity due to the significant threat they pose. The likelihood of successful account compromise and subsequent exploitation is notable, warranting prompt analysis and response to mitigate potential breaches.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if malicious IPs are not consistently updated or if an environment does not leverage threat intelligence for IP reputation services. The detection logic assumes that all malicious IPs are effectively flagged and that legitimate users are not inadvertently accessing the services from those IPs. The accurate functioning of this alert relies on the availability of comprehensive Azure risk detection logs and timely updates to the list of known malicious IP addresses.

