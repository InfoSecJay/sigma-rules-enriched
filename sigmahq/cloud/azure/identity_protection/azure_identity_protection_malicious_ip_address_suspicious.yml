  ---

  ### Technical Context

  This rule detects sign-in attempts from IP addresses identified as malicious. Typically, these addresses are flagged in threat intelligence databases due to prior associations with malicious activities such as data breaches, botnets, or brute-force attacks. The likely objective of an adversary using a malicious IP address is to gain unauthorized access to user accounts and compromise sensitive information.

  The relevant MITRE ATT&CK tactic is **Credential Access** (TA0006) and the technique is **Exploitation of Credential Dumping** (T1003). Primary telemetry sources include Azure AD logs, specifically targeting the 'riskdetection' event type with a focus on the field `riskEventType` set to 'suspiciousIPAddress'. If malicious, this detection indicates an active attempt to access accounts from known harmful sources. Crucially, this detection does NOT confirm a successful account compromise on its own.

  ---

  ### Investigation Steps

  - **Verify user account activity:** Review Azure AD sign-in logs (Event ID 4624), focusing on the user account associated with the malicious IP. Look for multiple sign-ins from unusual locations or hours which may indicate compromise attempts, contrasting against typical user behavior.

  - **Assess IP reputation:** Check the IP address against threat intelligence platforms or services to confirm it is indeed categorized as malicious. A high reputation score indicating active abuse (e.g., spam, C2 activities) solidifies potential malicious intent.

  - **Correlate with other alerts:** Look for any related alerts concerning the user that may indicate further malicious behavior, such as unusual sign-in locations or failed attempts prior to this event. Explore associated logs for suspicious session duration or patterns.

  - **Review recent account activity:** Analyze the account’s recent actions (Event ID 4662) to identify any unauthorized access attempts or changes, such as modifications to security settings or account recovery mechanisms.

  - **Identify benign activity:** A legitimate sign-in might include a user accessing from an IP known to them or from locations aligned with their behavior patterns, corroborated by logs showing typical user access times and geolocation.

  ---

  ### Prioritization

  This alert is high severity due to the potential compromise of user accounts, particularly if the targeted users have access to sensitive systems or data. The likelihood of exploitation is significant, given the nature of the detected malicious activity, as attackers frequently utilize known malicious IPs for credential theft or brute-force attempts.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate uses of dynamic IP addresses that may be flagged in error. The risk detection relies on proper configurations of Azure Risk Detection logs to provide reliable alerts. Additionally, legitimate users may occasionally travel or use VPNs, triggering false positive alerts. A companion detection to consider is monitoring for abnormal account behaviors post sign-in, such as data exfiltration events or lateral movement indicative of further compromise.

