note: |
  ### Technical Context
  This detection rule targets password spray attacks, a common brute force technique where an attacker attempts to access multiple accounts using a few commonly used passwords. The primary objective of such attacks is to gain unauthorized access to user accounts while avoiding account lockouts that can occur with traditional brute force methods. Attackers may utilize this technique to compromise accounts and move laterally within the network, eventually leading to data theft or other malicious activities.

  Relevant MITRE ATT&CK tactics/techniques include:
  - **Credential Access** (TA0006)
    - **Password Spraying** (T1110.003): This technique specifically describes scenarios where an attacker systematically tests a limited set of passwords against multiple accounts to exploit weak password practices.

  The primary data source for this detection is Azure Risk Detection logs, which will capture events associated with the password spray attempts. These logs allow security teams to understand the context and frequency of suspicious sign-in activities.

  ### Investigation Steps
  - **Review Risk Detection Logs**: Check Azure's risk detection logs for any flagged sessions indicating password spray activity. Look for multiple failed sign-in attempts across different accounts using the same password.
  - **Correlate Account Activity**: Investigate the accounts that were targeted during the attack and correlate any unusual access patterns or activities with other sign-ins to identify potential compromises.
  - **Assess User Behavior**: Analyze the behavior of affected users around the time of flagged incidents. Consider looking for signs of account takeovers or unusual access to sensitive resources.
  - **Monitor Authentication Sources**: Verify if these attempts align with any external threat intelligence reports or known lists of compromised credentials to determine if the attack is part of a broader campaign.

  ### Prioritization
  This alert has a high severity level due to the potential impact of a successful password spray attack, which can lead to unauthorized access to sensitive resources, data breaches, and extended internal threats.

  ### Blind Spots and Assumptions
  The detection logic may miss password spray attempts that utilize less common passwords not flagged as risky or those occurring outside of the normal user behavior patterns. The effectiveness of this rule is also contingent on having comprehensive logging enabled for risk detection in Azure. If logging configurations are not set properly, some password attempts may go undetected, leading to gaps in coverage.

