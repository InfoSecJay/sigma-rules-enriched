note: |
  ### Technical Context

  This detection identifies successful password spray attacks, where an adversary attempts common passwords across multiple accounts, ultimately leading to successful authentication on one or more. The likely attacker objective is to gain unauthorized access to user accounts while evading detection by limiting the number of attempts per account. This activity aligns with the MITRE ATT&CK tactic of Credential Access, specifically the technique T1110 - "Brute Force."

  The primary telemetry source for this detection is Azure Risk Detection logs, specifically focusing on events tagged with `riskEventType: 'passwordSpray'`. If successful, this attack could lead to unauthorized data access, account compromise, or lateral movement within the organization. This detection does NOT, on its own, confirm that a breach has occurred; it merely indicates that a password spray attempt has succeeded.

  ---

  ### Investigation Steps

  - **Review user account access: ** Check for the user account that triggered the alert for any additional sign-in attempts (Azure AD sign-in logs Event IDs 4624) to determine if they were unauthorized.

  - **Analyze geolocation of sign-in attempts: ** Compare the location of the user’s sign-ins against previous records to identify unusual geographic access (Azure AD sign-in logs, fields: IP address, location).

  - **Investigate correlated risk detections: ** Look for additional risk detections associated with the user account (risk detection logs) that may indicate a pattern of compromise or unusual activity.

  - **Identify legitimate login patterns: ** Compare the sign-ins for the user against historical logon patterns to differentiate between normal, scheduled access, and potential malicious activity.

  - **Check MFA configurations: ** Verify if multi-factor authentication (MFA) logs (Azure MFA logs) indicate that MFA was successfully triggered or bypassed during the monitored time frame.

  - **Confirm targeted asset criticality: ** Assess the potential impact of the compromised account by identifying the role and resources the user account has access to, prioritizing the investigation based on those findings.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential for significant impact on the organization if sensitive accounts are compromised. The likelihood of malicious intent is substantial, as password spraying is a common tactic employed by attackers to bypass security controls. This technique is commonly weaponized in various campaigns, making fast and effective investigation crucial.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from the use of legitimate credential testing tools, which could resemble this behavior. A comprehensive log configuration for Azure Risk Detection is vital to capture all relevant events. Legitimate bulk access attempts from user management scripts or training sessions may also trigger this alert. Companion detections involving unusual user behavior or access patterns (such as sign-ins with anomalous IP addresses) will enhance the coverage and context of risk assessments.

