  ---

  ### Technical Context

  This Sigma rule detects password spray attacks, where an attacker attempts to access multiple accounts using a few common passwords. The likely objective is to gain unauthorized access to user accounts, especially those with weak passwords. This activity aligns with the MITRE ATT&CK technique "Brute Force" (T1110) under the Credential Access tactic.

  The primary telemetry source for this detection is the Azure Active Directory risk detection logs, specifically those generated from sign-in attempts. If the attack is successful, it could lead to unauthorized access to sensitive data or systems, significantly impacting security posture. It's crucial to note that this detection alone does not confirm an account has been compromised; legitimate users may also trigger it due to failed attempts on their own accounts.

  ---

  ### Investigation Steps

  - **Review risk detection logs:** Examine Azure Active Directory logs for Event IDs associated with password spray attacks. Focus on the `riskEventType` field showing "passwordSpray".

  - **Analyze recent sign-in attempts:** Investigate user sign-in activity within Azure AD for any unusual patterns (e.g., multiple failed login attempts from different IP addresses) prior to the password spray alert.

  - **Identify malicious indicators:** Look for known bad IP addresses or geolocations in the sign-in logs. Flag any successful logins following failed attempts as a high-confidence malicious indicator.

  - **Correlate with user behavior:** Check if legitimate user behavior was occurring around the alert time, such as password changes, self-service resets, or multi-factor authentication triggers.

  - **Assess account roles and criticality:** Determine if the affected accounts hold elevated privileges or access sensitive data. Prioritize investigations based on the criticality of the roles involved.

  - **Verify multi-factor authentication (MFA):** Confirm whether the impacted users have MFA enabled and assess if any attempts bypassed this layer of security during their access attempts.

  ---

  ### Prioritization

  This alert is considered high severity, particularly if it targets privileged accounts or sensitive organizational resources. The likelihood of malicious abuse is high due to the common use of password spraying in targeted attacks, making this behavior a notable indicator of potential compromise.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise if logs are not configured correctly or if the adversary uses obfuscation techniques to hide their activity. Legitimate user actions, such as account lockouts or common password resets, can also trigger this alert. A related detection for comprehensive coverage could include monitoring for atypical high-volume login attempts from a single IP address, adding further context to the risk of a password spray attack.

