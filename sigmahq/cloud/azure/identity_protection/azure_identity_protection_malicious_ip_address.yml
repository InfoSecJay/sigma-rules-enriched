note: |
  ### Technical Context
  This detection rule focuses on identifying sign-in attempts from IP addresses that are considered malicious, characterized by a high rate of sign-in failures. The underlying threat scenario involves attackers attempting to gain unauthorized access to user accounts through automated means, such as brute-force or credential stuffing attacks, especially from known bad actors. The likely objective of such attempted accesses is to compromise user accounts to facilitate further malicious activities, such as data theft or lateral movement within the network.

  Relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and **Command and Control** (TA0011). Specifically, this detection aligns with technique **T1090: Connection Proxy**, where attackers may use compromised IP addresses to obscure their activities. The primary data source for this detection comes from Azure's risk detection service, which monitors sign-in activities and identifies those flagged as originating from malicious sources.

  ### Investigation Steps
  - **Review Azure Risk Detection Logs:** Analyze the risk detection logs from Azure to identify the specific users affected, the associated IP addresses, and the frequency of sign-in failure events.

  - **Correlate User Behavior:** Examine other sign-in activities for the affected user around the time of the suspicious sign-ins. Look for changes in access patterns or failed sign-in attempts from different geolocations.

  - **Investigate IP Reputation:** Check the reputation of the detected malicious IP addresses using threat intelligence services or databases to confirm their status and determine if they relate to known attack campaigns.

  - **Monitor for Follow-Up Activities:** Observe any subsequent account behavior, such as account lockouts or unusual access to sensitive resources, that may indicate successful account compromise following these failed attempts.

  ### Prioritization
  The alert's severity is considered high due to the potential threat impact of unauthorized access attempts from malicious IP addresses, which could lead to significant data breaches or operational disruptions. The likelihood of these attempts is elevated in an enterprise environment that may be exposed to various types of attacks.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage for sign-ins using dynamic IP addresses or those that haven’t been previously classified as malicious. The detection logic assumes that failed sign-ins will be flagged in the Azure risk detection system consistently, and that the relevant logs are configured correctly and accessible for review. It’s also important to consider network-based detection of similar patterns in other services, as this rule strictly evaluates sign-ins based on Azure's criteria.

