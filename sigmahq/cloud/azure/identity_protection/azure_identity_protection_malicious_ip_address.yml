note: |
  ### Technical Context

  This Sigma rule detects sign-in attempts from identified malicious IP addresses characterized by a high failure rate, indicative of potential credential stuffing or brute force attacks. The likely attacker objective includes gaining unauthorized access to user accounts, which may lead to data theft or lateral movement within the network. Relevant MITRE ATT&CK tactics include "Credential Access" (TA0006) and "Brute Force" (T1110). The primary telemetry sources are Azure Risk Detection logs, specifically looking for incidents where `riskEventType` is tagged as `maliciousIPAddress`.

  If confirmed malicious, this behavior poses a high security threat, potentially leading to compromised accounts and further exploitation. However, this detection does NOT confirm that access was successfully gained or that the user’s credentials have been compromised solely based on sign-in failures.

  ### Investigation Steps

  - **Review Azure sign-in logs**: Look for sign-in logs (Event ID 4624) associated with the affected user to check for successful sign-ins from the same or different IP addresses within a relevant time frame. A sudden spike in logins from unusual locations may indicate account compromise.

  - **Correlate with user account activity**: Investigate other sign-in attempts (e.g., Event ID 4625 for failed logins) and correlate with the account activity logs to determine if there are legitimate reasons for these failures, such as recent user changes or new device registrations.

  - **Identify associated IP addresses**: Utilize the Azure Security Center to perform a reputation check on the identified malicious IP addresses, confirming they are known for malicious activities (e.g., part of threat intelligence feeds).

  - **Examine conditional access policies**: Verify if the user is under any conditional access policies that may block sign-ins from certain locations, which could explain an increase in sign-in failure attempts but may not necessarily indicate malicious intent.

  - **Check for additional authentication alerts**: Review additional protective measures or alerts triggered (like multi-factor authentication failures) connected to these sign-in attempts to ascertain whether they were properly enforced.

  ### Prioritization

  This alert is considered high severity due to the nature of compromised credentials potentially leading to unauthorized access to sensitive systems. The likelihood of malicious use is significant, especially in environments with known targeted user accounts. The behavior is commonly weaponized by attackers aiming to infiltrate accounts.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate users who may be traveling abroad or using VPNs, causing them to appear as malicious. Successful detection requires accurate configuration of Azure Risk Detection logs and retention policies. Additionally, activities such as legitimate user error or automated login attempts from bots might trigger this alert, leading to false positives. A related detection to consider is monitoring for unusual geographic sign-in patterns (ATT&CK T1078), which would enhance the investigation context.

