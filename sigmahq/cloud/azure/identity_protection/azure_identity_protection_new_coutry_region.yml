  ---

  ### Technical Context

  This Sigma rule detects sign-ins from new or infrequent countries for a given user, which may indicate potential account compromise. The likely objective of the attacker is to gain unauthorized access to accounts, potentially allowing for data exfiltration or lateral movement within the organization. The relevant MITRE ATT&CK tactic is **Initial Access** (TA0001) with technique **Valid Accounts** (T1078).

  Primary telemetry sources include Azure Active Directory sign-in logs, particularly focusing on risk event types related to geolocation. Malicious implications of such sign-ins can be significant, as they could represent unauthorized access to sensitive resources. However, this detection alone does NOT confirm malicious activity; legitimate users may travel or use virtual private networks (VPNs) which could trigger similar alerts.

  ---

  ### Investigation Steps

  - **Identify user sign-in location history:** Review Azure AD sign-in logs for the user (Event ID 4624) to establish a baseline of normal sign-in locations. Look specifically in fields `IPAddress` and `Location` for known locations to compare against new alerts.

  - **Correlate with other sign-in events:** Check for other recent sign-ins to the affected account using Azure AD logs. Identify patterns such as simultaneous sign-ins from multiple countries or unusual access times to strengthen the legitimacy assessment of the new country sign-in.

  - **Evaluate sign-in risk level:** Analyze the `RiskEventType` field for the specific event. High-risk events tied to the new country must be prioritized, especially if accompanied by unusual behavior such as MFA requests or password changes.

  - **Assess user role and critical assets:** Determine the role of the affected user within the organization. If the account has privileged access or interacts with critical assets, escalate the alert for immediate investigation.

  - **Review legitimate use cases:** Identify if the user was traveling or using legitimate remote access solutions. Validate any communications with the user or their manager to verify authorized access to the new country before concluding on potential malicious activity.

  - **Check for anomalous activity post sign-in:** Investigate actions taken by the account after the sign-in using Azure logs (for example, modifications to resources or access to sensitive files). Specific log fields to monitor include `ActivityType`, `TargetResource`, and `Outcome`.

  ---

  ### Prioritization

  The alert is of high severity due to the potential for account compromise, especially if tied to privileged user accounts. The risk of exploitation is elevated since attackers often utilize credential reuse across different geolocations. This scenario is weaponized in targeted attacks where access from unfamiliar geolocations is common.

  ---

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques such as employing VPNs or compromised remoting tools that mask the true origin of sign-ins. The accuracy of alerts relies heavily on proper Azure AD logging configurations; any gaps may lead to missed activity. Legitimate business travel or remote work scenarios can trigger alerts frequently. For broader coverage, companion detections can include monitoring failed sign-ins or unusual access patterns in conjunction with account changes or privilege escalation attempts.

