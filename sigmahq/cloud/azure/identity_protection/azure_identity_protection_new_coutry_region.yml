note: |
  ### Technical Context

  This Sigma rule detects user sign-ins from geographical locations that deviate from a user's historical login patterns, specifically identifying instances labeled as "new country" sign-ins. The likely attacker objective is to gain unauthorized access to user accounts through the use of credential stuffing or phishing, targeting accounts in different geographical regions. This aligns with the MITRE ATT&CK techniques: **Valid Accounts (T1078)** and **Credential Dumping (T1003)**.

  The primary telemetry source for this detection is Azure Active Directory logs, specifically the risk detection events within the **riskEventType** field showing "newCountry." If malicious, this behavior signifies potential account takeover or exfiltration risks. It is crucial to note that this detection does NOT confirm intent or successful compromise on its own; further investigation is necessary to ascertain the context of the login.

  ### Investigation Steps

  - **Review sign-in logs for context**: Check Azure AD sign-in logs (Event ID: 4624) for any sign-ins from the same user that have occurred recently, noting the countries and IP addresses involved for potential anomalies versus historical data.

  - **Assess risk detection metrics**: Evaluate user risk scores in Azure AD Identity Protection to identify if other risk events (e.g., impossible travel or atypical behavior) correlate with the "new country" activity.

  - **Identify high-confidence malicious indicators**: Investigate the IP address of the login attempt using threat intelligence sources to determine if it is associated with known malicious threat actors or networks.

  - **Confirm legitimate activity**: Compare the new sign-in location with the user's typical behavior patterns, considering legitimate travel or remote work scenarios that may justify access from a new country.

  - **Analyze multi-factor authentication (MFA) incidents**: Determine whether MFA was triggered during the sign-in from the new country, referencing the Azure AD audit logs (Event Type: MFA). A lack of MFA could indicate risky behavior.

  - **Check for suspicious administrative access**: Investigate if there are privileged role assignments or access escalations associated with the user following the anomalous login, indicating potential exploitation.

  ### Prioritization

  This alert is marked as high severity based on the potential impact of compromised user accounts, especially if critical assets could be accessed. The likelihood of malicious abuse is elevated given the recent increase in geographically diverse phishing and credential stuffing attacks. Such behaviors are commonly weaponized, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate sign-ins resulting from VPN use or travel, which may trigger the alert without malicious intent. Reliable detection requires properly configured Azure AD logging and risk detection settings. Additionally, similar logins could occur during authorized user travel or when utilizing globally dispersed services. Companion detections such as **"Impossible Travel"** or **"Unusual Sign-ins"** can further improve accuracy and context for evaluating the risk associated with these alerts.

