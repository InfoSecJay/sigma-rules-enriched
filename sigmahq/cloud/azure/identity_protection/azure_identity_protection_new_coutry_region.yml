note: |
  ### Technical Context

  This rule detects sign-in attempts from geographical locations that have not previously been associated with the user, which is indicative of potential account compromise or unauthorized access. The likely attacker objective is to gain access to user accounts from diverse geographical locations, suggesting possible credential theft or account takeover tactics. This aligns with the MITRE ATT&CK framework under the tactic “Initial Access” (TA0001) and the technique “Valid Accounts” (T1078).

  Primary telemetry sources include Azure Active Directory sign-in logs, specifically focusing on fields related to user sign-in events that indicate the geographical origin of the access. If the sign-in attempt is malicious, it could lead to unauthorized access, data exfiltration, and further lateral movement within the network. It is important to note that this detection does NOT confirm that an account has been compromised, as legitimate users can also sign in from new or infrequent locations.

  ### Investigation Steps

  - **Verify user’s sign-in history:** Review Azure Active Directory logs (Event ID 4624) for previous sign-in locations to establish a baseline for typical user behavior. Check the geographical locations of the last 5 sign-in attempts.

  - **Assess sign-in risk event details:** Examine the specific risk sign-in event details using Azure portal risk detection logs to confirm the ‘newCountry’ event type. Focus on user ID and risk score for insights into the unusual nature of the sign-in.

  - **Identify high-confidence malicious indicators:** Look for an unusual sign-in pattern, such as multiple failed sign-in attempts followed by a successful sign-in from a new country (Event ID 4625 followed by 4624). Compare timestamps and geographic locations to identify potential credential stuffing attempts.

  - **Contextualize based on user role:** Consider the user role and asset criticality. Investigate if the user has previously accessed sensitive data or systems, which may elevate the risk of an account compromise.

  - **Review legitimate activities:** Identify if the user has had business reasons to access from new countries (e.g., business trips or relocation), and corroborate this with HR or IT information to ascertain if the activity is legitimate.

  - **Document potential account recovery actions:** If confirmed as malicious, recommend enabling multi-factor authentication for the affected account, and begin account recovery processes such as resetting the password and reviewing account audit logs for further anomalies.

  ### Prioritization

  This alert is of high severity due to the potential for an account compromise in sensitive business applications, potentially impacting critical operations and data integrity. The likelihood of malicious abuse is significant as attackers often attempt to leverage valid accounts from new geographic locations to circumvent security measures. This behavior is a common vector for credential theft exploitation.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited by the completeness of Azure AD sign-in logs and any delays in real-time monitoring. Adversaries may use VPNs to mask their true location, bypassing detection. Legitimate activities triggering this alert may include employees traveling or using remote work tools. A companion detection could include monitoring for unusual behavior following the sign-in, such as unauthorized access to sensitive files (e.g., accessing files that are not typically accessed by the user).

