note: |
  ### Technical Context
  This detection rule monitors for user sign-ins from countries that the user has not previously accessed, indicating potentially fraudulent or unauthorized access attempts. The threat scenario often involves an attacker seeking to gather sensitive information or unauthorized access to resources by exploiting compromised credentials, which might be acquired through phishing or other malicious means. When a sign-in occurs from a new country, the potential objectives include data theft, system manipulation, or furthering privilege escalation efforts.

  The relevant MITRE ATT&CK tactics associated with this detection include **Initial Access (TA0001)**, particularly the **Valid Accounts (T1078)** technique, where attackers utilize legitimate user credentials for unauthorized access. Additionally, this activity can be tied to **Persistence (TA0003)** and **Defense Evasion (TA0005)** tactics as attackers may seek to establish footholds within the network. Primary data sources for this detection include logs from Azure risk detection services, which track user sign-in attempts and risk levels.

  ### Investigation Steps
  - **Review User Sign-in Logs:** Examine the Azure sign-in logs for the affected user to identify all sign-in attempts, noting the geographic origins and correlating them with historical access patterns.
  - **Analyze Risk Events:** Investigate the associated Azure risk detection events. Assess the context of the new country sign-ins, looking for any concurrent unusual behavior, such as logins from multiple locations in a short time frame.
  - **Correlate with Other Data Sources:** Cross-reference with VPN logs and proxy server logs to see if there are any additional connections that could provide insights into legitimate versus illegitimate access.
  - **Conduct User Context Checks:** Validate the legitimacy of new sign-ins by confirming whether the user intended to access resources from the detected new location, communicating with the user if necessary.

  ### Prioritization
  This alert is rated high severity due to the potential for unauthorized access to critical systems and data, particularly if credential compromise has occurred. Given the increasing prevalence of identity theft and credential stuffing attacks, it is essential to treat these alerts with urgency.

  ### Blind Spots and Assumptions
  One significant blind spot in this detection approach is the possibility of legitimate travel by users, which may generate false positives if not carefully contextualized. Another assumption is that the user may have not changed their authentication settings or enabled geo-blocking; therefore, such configurations must be reviewed. Adequate log coverage from Azure risk detection services is required for this alert to function effectively, along with proper user activity monitoring across other platforms.

