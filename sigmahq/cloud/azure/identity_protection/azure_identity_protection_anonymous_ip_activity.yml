note: |
  ### Technical Context
  This detection rule identifies user activities originating from IP addresses classified as anonymous proxies. An attacker may leverage anonymous proxies to obscure their true location, making it challenging for organizations to trace malicious actions back to the perpetrators. The primary objective of such an attacker includes gaining unauthorized access to systems, exfiltrating sensitive data, and carrying out reconnaissance without revealing their identity or location.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection are **Initial Access (TA0001)** through the use of anonymization services (T1078), and **Defense Evasion (TA0005)** by obscuring the attacker's identity. This activity can potentially lead to **Privilege Escalation (TA0004)** as attackers seek higher access permissions once they've breached an initial barrier.

  Primary data sources for this detection include Azure risk detection logs, which can provide insight into user sign-ins and associated metadata, particularly sign-ins flagged as risky due to the use of anonymous IP addresses. Additional context may be gathered from VPN logs, authentication logs, and other security monitoring tools that track user access patterns.

  ### Investigation Steps
  - **Review Azure Risk Detection Logs:** Start by examining the specific entries in Azure’s risk detection logs that indicated risky IP addresses. Pay special attention to the timestamp, user accounts involved, and whether there are other sign-ins from the same user in different locations.

  - **Analyze User Sign-In Context:** Correlate the detected activity with other sign-in attempts from the same user account. Look for patterns of geographic inconsistency or signs of unusual behavior when accessing resources.

  - **Investigate Associated Actions:** Check for subsequent actions taken by the user account after the session from the anonymous IP address. Track any modifications to permissions, creations of new accounts, or access to sensitive systems or data that may indicate further illicit activities.

  - **Monitor for Additional Anomalies:** Utilize other security tools such as EDR and SIEM to check for any additional suspicious activities on the user account prior to and after the flagged sign-in. This may include unusual process creation, privilege escalation events, and lateral movement queries.

  ### Prioritization
  The alert has a high severity rating due to the significant risk it poses in an enterprise environment. Activities from anonymous IP addresses often indicate attempts to bypass security measures, suggesting a serious potential for unauthorized access and data breaches.

  ### Blind Spots and Assumptions
  This detection logic may not account for legitimate users utilizing VPN services or remote work scenarios that intentionally route traffic through anonymous proxies. There may also be contexts in which these IPs are used for legitimate business purposes. Additionally, the rule assumes that the Azure risk detection capabilities are fully enabled and logging appropriate user activities. Any misconfigurations or lack of logging will result in missed detections.

