note: |
  ### Technical Context

  This detection identifies user activity originating from IP addresses classified as anonymous proxies, suggesting potential evasion tactics employed by attackers. The likely objective for an adversary utilizing an anonymous IP is to obscure their identity during unauthorized access attempts or lateral movements within the network. This behavior aligns with the MITRE ATT&CK techniques: "Account Manipulation" (T1078) and "Initial Access" (T1078).

  The primary telemetry source for this alert is Azure Risk Detection, specifically monitoring for the `riskyIPAddress` risk event type. If malicious, this activity can lead to unauthorized access, data exfiltration, or privilege escalation. However, this detection does NOT confirm malicious intent on its own; legitimate users may inadvertently use proxy services for valid reasons.

  ### Investigation Steps

  - **Review user sign-in activity:** Cross-reference the user account associated with the anonymous IP address against Azure Active Directory Sign-in logs (Event ID: 4624). Look for unusual sign-in patterns or successful auth attempts close in time to the flagged proxy activity.

  - **Check for existing account ownership:** Validate if the user typically accesses resources from known locations or legitimate IPs. Business operations or employees might use VPNs, cloud services, or other legitimate means, which could be benign.

  - **Identify related sessions:** Look at the user’s session history in Azure Active Directory (Event ID: 4624) for any other risky activities or additional signs of compromise such as login attempts from multiple locations in a short time frame.

  - **Assess session duration and resource access:** Analyze what resources were accessed during the session flagged by the proxy IP. Identify any abnormal requests that deviate from standard user behavior. Relevant fields might include `appId` or `resourceId` in Azure logs.

  - **Investigate associated IP reputation:** Check the reputation of the anomalous IP against threat intelligence feeds for previous malicious activities. Tools like VirusTotal can help determine if the IP is linked to known threats.

  - **Evaluate the user’s role and asset criticality:** Determine if the affected user has access to sensitive resources. High-criticality assets should prompt immediate attention and potentially incident response actions.

  ### Prioritization

  This alert should be classified with high severity, especially if the affected user has significant access rights within the organization. The presence of anonymous proxy usage is commonly weaponized by adversaries trying to mask their activities, indicating a high likelihood of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by users legitimately employing anonymous proxies for valid reasons, such as privacy concerns or bypassing geographic restrictions, leading to potential false positives. Reliable detection requires proper configuration of Azure Risk Detection telemetry. Additionally, normal employee usage of VPN services may trigger this alert, thereby necessitating further contextual investigation. A related detection could involve monitoring unusual geolocation sign-ins to provide comprehensive coverage against potential threats.

