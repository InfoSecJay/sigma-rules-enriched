note: |
  ### Technical Context

  This Sigma rule detects user sign-in activity originating from IP addresses that are classified as anonymous proxies. Such behavior often indicates an attempt by an attacker to conceal their true location during unauthorized access to an account. The likely attacker objective is to achieve initial access to sensitive information or resources by using an anonymous source to obfuscate their identity and evade detection. This situation corresponds to the MITRE ATT&CK technique "Valid Accounts" (TA0006) and "Use of Anonymous Proxy" (T1078).

  The primary telemetry source is Azure Risk Detection logs, specifically looking for events with the riskEventType set to "riskyIPAddress." If the detected activity is malicious, it poses a significant risk as it enables potential unauthorized access to corporate resources, bypassing conventional access controls. However, this detection does NOT confirm that the sign-in attempt was successfully executed, nor does it establish whether the user account is compromised on its own.

  ### Investigation Steps

  - **Review user sign-in history**: Cross-reference the sign-in event marked by the anonymous IP address against Azure Active Directory sign-in logs (Event IDs 4624, 4625) to identify any prior or subsequent suspicious behavior from the same user account.

  - **Verify IP reputation**: Conduct a lookup on the flagged anonymous IP address using threat intelligence platforms to determine if it is commonly associated with malicious activity or if it is used by legitimate users (e.g., privacy services).

  - **Check for unusual access patterns**: Analyze the user's recent activity within Azure Active Directory for access from other geographical locations or devices inconsistent with the user's typical behavior, utilizing fields like ‘Location’ and ‘Device Information’ in the logs.

  - **Identify high-confidence malicious indicators**: Investigate if the sign-in was followed by sensitive actions, such as changes to account settings or data exfiltration attempts, by reviewing related Azure logs (e.g., Azure Audit logs for suspicious API calls).

  - **Assess legitimate access scenarios**: Determine if the user typically uses a proxy for privacy (e.g., during travel) or if this is an anomalous behavior by comparing against historical sign-in patterns within the past 30 days.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems if a malicious actor gains unauthorized access. The likelihood of malicious abuse is elevated in contexts where sensitive data can be exploited, and the use of anonymous proxies is common among various threat actors seeking to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by unsuccessful sign-in attempts from flagged proxies that do not generate further alerts. Additionally, reliable detection requires properly configured Azure risk detection logs to ensure comprehensive visibility. Legitimate users may trigger this alert when accessing accounts from legal VPN services or during legitimate operational activities. A related detection that strengthens coverage is monitoring for successful credential use following this alert, specifically tracking subsequent actions against user account privileges.

