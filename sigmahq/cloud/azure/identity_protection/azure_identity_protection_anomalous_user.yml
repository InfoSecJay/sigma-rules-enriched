note: |
  ### Technical Context

  This Sigma rule detects anomalous user activity within Azure environments, specifically changes in user behavior that align with risk indicators from Microsoft Entra's Identity Protection. The likely attacker objective could include account compromise or privilege escalation, as anomalous behavior often precedes unauthorized access or configuration changes. Relevant MITRE ATT&CK tactic includes **Privilege Escalation** (TA0004) and technique **Use Alternate Authentication Material** (T1098).

  The primary telemetry sources are Azure Risk Detection logs, particularly events categorized as `anomalousUserActivity`. If this behavior is malicious, it could lead to unauthorized access and potential data breaches. It’s important to note that this detection alone does not confirm malicious intent; further investigation into user context is required.

  ### Investigation Steps

  - **Review sign-in logs:** Examine Azure AD Sign-in logs (Event ID 4624 for successful logins) for the same user. Look for unusual locations, devices, or times that deviate from their standard patterns.

  - **Examine user risk details:** Analyze the specific anomalous event details in Risk Detection logs, noting timestamps and deviation from baseline behavior. Compare with typical access patterns to identify inconsistencies.

  - **Check for recent Privilege Escalation activities:** Investigate Azure AD Audit logs for changes in user roles or permissions around the same time frame. Look for Event ID 4728 (added to a group) or 4729 (removed from a group).

  - **Identify legitimate activities:** Determine if the user was engaged in expected tasks or system maintenance, such as system updates or scheduled access events, which could explain legitimate behavior without concern.

  - **Look for suspicious session patterns:** Identify repeated failed login attempts or session bursts. Indicator fields in Azure AD logs should show `failureReason` if applicable, which could indicate brute force or account targeting.

  - **Evaluate device risk level:** Check the device compliance status in Intune, correlating any high-risk devices with the flagged user activity. Look for device IDs marked as non-compliant, which could suggest potential security issues.

  ### Prioritization

  This alert should be treated with high severity given the potential impact on sensitive systems and data. The likelihood of malicious abuse is elevated, as anomalous behavior can indicate compromised accounts which are often targeted in modern cyberattacks.

  ### Blind Spots and Assumptions

  Detection limitations may include misclassifications of legitimate user behavior, particularly in highly dynamic environments where role changes are common. Ensure that Azure Risk Detection and Audit logs are properly configured and collected for ideal detection reliability. Legitimate vertical user access, such as departmental changes, can trigger the alert. A companion detection worth considering is the monitoring of failed logins that might correlate to the same user or timeframe, providing context for risk assessment.

