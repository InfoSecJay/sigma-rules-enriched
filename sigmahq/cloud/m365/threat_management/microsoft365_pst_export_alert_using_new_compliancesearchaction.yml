note: |
  ### Technical Context

  The Sigma rule detects instances where a user has executed a PST export using the `New-ComplianceSearchAction` PowerShell command with the `-Export` flag within Microsoft 365 environments. This behavior may indicate an attempt to exfiltrate sensitive information or data from an organization's managed mailboxes or files. The likely attacker objective may involve unauthorized access to corporate data for malicious purposes, such as corporate espionage or data leakage.

  The relevant MITRE ATT&CK tactic is **Collection** (TA0009), specifically the technique **Data from Information Repositories** (T1114). The primary telemetry sources required are Microsoft 365 Security Compliance Center logs containing events related to PowerShell command executions. If executed maliciously, a successful PST export could facilitate data theft, significantly impacting the organization's confidentiality and compliance obligations. However, this detection does NOT confirm malicious intent on its own, as legitimate activities may also trigger this alert.

  ---

  ### Investigation Steps

  - **Identify the executing user:** Review the telemetry from the SecurityComplianceCenter logs (Event ID related to PowerShell command execution) to determine which user performed the `New-ComplianceSearchAction` command. Look for unusual accounts or permissions indicative of potential abuse.

  - **Examine the exported content type:** Check any provided summary logs or output artifacts for details on the content being exported, focusing on sensitive identifiers or large amounts of data being exported as PST files. Large exports or exports of sensitive datasets could indicate malicious intent.

  - **Assess user context:** Evaluate user roles and privileges associated with the account that executed the export. A user with a role that typically does not access sensitive information, conducting PST exports may warrant further investigation.

  - **Review related activity logs:** Cross-reference other logs for recent activity from the same user or originating IP addresses, particularly any failed sign-ins or unusual access patterns (e.g., outside normal business hours) to build a profile of user behavior.

  - **Document legitimate export scenarios:** Consider typical use cases for PST exports within your organization, including audit logs of scheduled eDiscovery exports performed by compliance or legal teams. Legitimate exports usually align with regulatory processes.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential risk associated with PST exports, which often contain sensitive information. The impact of data leakage can be significant, making such behavior a priority for investigation. While not every PST export indicates malicious intent, the likelihood of exploitation increases, especially if associated users exhibit anomalous behavior.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate users may periodically export PST files for compliance or migration tasks, potentially leading to false positives. Reliable detection requires continuous monitoring of Microsoft 365 activity logs, particularly ensuring that auditing is enabled for PowerShell command usage. Additional detection mechanisms, such as monitoring failed login attempts or integration with data loss prevention (DLP) systems, can strengthen overall coverage and security posture against similar threats.

