detection:
  selection:
    eventSource: SecurityComplianceCenter
    Payload|contains|all:
    - 'New-ComplianceSearchAction'
    - 'Export'
    - 'pst'
  condition: selection
falsepositives:
- Exporting a PST can be done for legitimate purposes by legitimate sources, but due
  to the sensitive nature of PST content, it must be monitored.
level: medium
note: |
  ### Technical Context
  This rule detects the use of the `New-ComplianceSearchAction` PowerShell command with the `-Export` flag to create PST exports in Microsoft 365 environments. The ability to export mailboxes to PST files can be leveraged by attackers for data exfiltration, particularly when targeting sensitive information contained in emails or attachments. Attackers might seek to harvest credentials, confidential communications, or sensitive documents, utilizing such exports to bypass standard security controls.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Collection (T1114)**. This technique covers scenarios where adversaries might collect sensitive data from target systems, especially using command-line tools or scripts to obtain data that could be used for further exploits, threats, or breaches. In an enterprise context, monitoring for unusual administrative PowerShell commands, especially exports of data, is crucial for maintaining data integrity and confidentiality.

  Primary data sources include logs from Microsoft 365's Security Compliance Center, which captures the events related to compliance actions and PowerShell commands. This ensures an effective visibility into potential misuse of tools that could facilitate data exports.

  ### Investigation Steps
  - **Review Security Compliance Center Logs:** Examine the relevant logs in the Microsoft 365 Security Compliance Center for instances of `New-ComplianceSearchAction` commands executed with the `-Export` flag to identify the user and timestamp of the activity.
  - **Analyze User Activity:** Investigate the user account that initiated the export command for any prior activities that may indicate malicious intent, such as unusual login locations, failed logins, or changes in user privileges.
  - **Check for Contextual Anomalies:** Validate the legitimacy of the export action by checking whether the user has a valid business justification for accessing the data and if the exported content aligns with authorized use cases.
  - **Cross-Reference with Other Logs:** Look for correlations with other log sources, such as email activity logs or Azure AD Sign-ins, to determine if this action occurred alongside any suspicious actions that could indicate a compromised account or insider threat.

  ### Prioritization
  Given the sensitivity of the data that can be exported using the `New-ComplianceSearchAction`, this alert is prioritized as medium severity. The potential for data loss and implications for regulatory compliance make it crucial to follow up on such actions, particularly in environments where sensitive information is handled.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, particularly if monitoring capabilities for PowerShell usage in Microsoft 365 aren't fully enabled or configured. This detection logic assumes the PowerShell command is executed in a context that can be logged effectively and does not account for users with unmonitored access to export data. Additionally, organizations must ensure their Microsoft 365 auditing settings are properly configured to capture all relevant logs for effective monitoring and alerting to function as intended.

