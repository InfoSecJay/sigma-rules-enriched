note: |
  ### Technical Context
  This rule detects when a user performs an eDiscovery search or exports a PST file within the Microsoft 365 environment. The action of exporting a PST file is significant due to the potential exposure of sensitive information contained within emails and associated attachments. Attackers may leverage eDiscovery features to collect sensitive data for purposes such as information theft or corporate espionage, escalating their ability to compromise an organization further.

  The relevant MITRE ATT&CK tactics include **Collection** (TA0009), specifically the technique of **Data from Information Repositories** (T1114). This tactic focuses on gathering valuable information from their stored locations within the organization's environment. The primary data source for this detection would be the Security & Compliance Center logs associated with Microsoft 365, particularly those related to eDiscovery searches and exported content.

  ### Investigation Steps
  - **Review eDiscovery Logs**: Examine the Security & Compliance Center logs for specific entries logging eDiscovery searches and PST file exports. Correlate the time of events with user actions to understand the intent behind these activities.

  - **Analyze User Behavior**: Investigate the user performing the eDiscovery search for any suspicious activity or anomalies such as sudden changes in privilege levels, unusual access patterns, or their recent login history.

  - **Collect Contextual Data**: Gather additional logs from Microsoft 365 services to understand the broader context of the user's actions, including any related access requests or outbound data transfers that may indicate post-export behavior.

  - **Validate Legitimate Use**: Determine if the exported PST was for legitimate purposes by reviewing user roles and permissions, confirming the necessity for such actions, and examining any established eDiscovery protocols within the organization.

  ### Prioritization
  This alert should be considered medium severity due to the potential risk of sensitive data exposure. While exporting a PST file can be justified for compliance or legal investigations, the presence of eDiscovery actions in unusual contexts necessitates immediate evaluation to mitigate any risks of data breaches.

  ### Blind Spots and Assumptions
  There may be gaps in detection capabilities if eDiscovery alerts are not enabled or if sufficient logging mechanisms are not configured within the Security & Compliance Center. This detection assumes that all legitimate eDiscovery uses are predefined and monitored according to organizational policy. Adequate configuration of Microsoft's compliance tools is necessary for the rule to function correctly, with comprehensive logs being imperative for effective oversight.

