note: |
  ### Technical Context

  This rule detects when a user initiates an eDiscovery search or exports a PST file from Microsoft 365, an action that, while legitimate, can expose sensitive information, including email content. The likely attacker objective behind such behavior is to extract confidential data, potentially for espionage, data leakage, or insider threats. This activity maps to the MITRE ATT&CK framework under the Collection tactic (TA0009) and specifically to the Data from Information Repositories technique (T1114).

  Primary telemetry sources include SecurityComplianceCenter logs within Microsoft 365, specifically focusing on event names such as "eDiscovery search started or exported." If this behavior is determined to be malicious, it could lead to unauthorized data exfiltration, compromising confidentiality. However, this detection does NOT confirm malicious intent by itself, as eDiscovery is often used for legitimate compliance purposes.

  ### Investigation Steps

  - **Identify the user performing the export**: Check the event log for the username and user account associated with the eDiscovery search (Event Source: SecurityComplianceCenter, Event Name: 'eDiscovery search started or exported', Fields: UserPrincipalName).

  - **Review the exported PST file**: If accessible, analyze the contents of the exported PST file for sensitive data, focusing on email body content and attachments that may indicate a data breach.

  - **Correlate with historical user behavior**: Investigate the user’s activity in Azure AD sign-in logs (Event ID: 4624) for unusual access patterns, like a high frequency of eDiscovery operations, that deviate from their typical usage patterns.

  - **Assess legitimate use cases**: Determine if the eDiscovery search was part of a documented legal investigation or compliance measure, looking for established procedures or approvals that justify the export (e.g., correspondence with legal, HR, or compliance departments).

  - **Monitor for unusual timing or frequency**: Cross-reference this alert with other eDiscovery alerts to see if similar exports occurred around the same time, which could indicate a coordinated attempt to gather sensitive information.

  - **Analyze IP address and device context**: Check the sign-in logs for the IP address and device used for the eDiscovery operation to rule out the possibility of Remote Access Tools or known compromised machines being utilized (Azure AD sign-in logs).

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive data exposure if a compromised user account or rogue insider is involved. The risk of exploitation is substantial, as eDiscovery's legitimate use is often a cover for data theft, and this behavior is known to be weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may miss legitimate activities by users performing eDiscovery for compliance reasons, such as legal inquiries or HR investigations. Additionally, the accuracy of detection relies on having the eDiscovery alert enabled and appropriately configured in Microsoft 365. An evasion technique might include using legitimate accounts to mask malicious intent. Related detections such as alerting on abnormal login activity or an increase in file downloads can further enhance coverage against potential data exfiltration attempts.

