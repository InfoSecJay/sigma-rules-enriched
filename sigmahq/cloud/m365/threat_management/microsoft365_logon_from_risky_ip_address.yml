  ---

  ### Technical Context

  This rule detects successful logons to sanctioned applications from IP addresses that have been flagged as risky by Microsoft Cloud App Security. The behavior indicates potential account compromise or suspicious activity, as attackers often use anonymizing services or compromised devices to access accounts maliciously. The likely objective of an attacker is to gain unauthorized access to sensitive resources, facilitating further actions like data exfiltration or lateral movement within the network.

  The relevant MITRE ATT&CK tactic is **Initial Access** (ID: TA0001) and the technique is **Valid Accounts** (ID: T1078). The primary telemetry source is Microsoft 365 logs collected via the Security Compliance Center, specifically focusing on events related to user sign-ins. The security impact of a malicious logon can be severe, potentially leading to data breaches or unauthorized changes to critical systems. However, this detection does NOT confirm that the account is compromised solely based on the identified risky IP address, as it could be a legitimate user connecting from a new or unexpected location.

  ---

  ### Investigation Steps

  - **Review sign-in details for anomalies:** Check the timestamp, user account details, and source of the logon using Microsoft 365 Security Logs (Event Source: SecurityComplianceCenter, Event Name: 'Log on from a risky IP address'). Compare these against known user habits to determine if this was an expected logon.

  - **Validate IP reputation:** Query third-party threat intelligence sources for the flagged IP address to assess historical malicious activity. Use open organizations like VirusTotal or similar databases that indicate if the IP has a history of compromise or is linked to known malicious actors.

  - **Identify known device association:** Look for prior successful sign-ins from this user or organization with typical user devices using Azure AD Sign-in logs (Event ID: 4624). If the device is inconsistent with past logons, it may indicate suspicious activity.

  - **Assess user behavioral patterns:** Review user activity over the past week to identify unusual actions such as accessing new applications or unusual geographic locations using Microsoft 365 user activity logs. Legitimate patterns include staying within expected application use and typical access hours.

  - **Cross-reference with simultaneous activities:** Check for simultaneous logins from the same user across different locations using Azure AD logs (Event IDs: 4624/4625). If multiple logons occur within short periods from disparate locations, it raises the likelihood of credential theft.

  ---

  ### Prioritization

  This alert has medium severity due to its potential impact on sensitive accounts and resources. While logons from risky IP addresses could indicate account compromise, this behavior can sometimes result from legitimate remote access situations. The technique of logging in from suspicious IPs is commonly weaponized, particularly in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion via the use of VPNs or other anonymity tools that mask the true origin of the logon. Reliable detection requires up-to-date Microsoft 365 logging configurations encompassing all relevant sign-in events. Legitimate activities that could trigger this alert include employees using VPNs to connect from foreign regions or legitimate third-party access from sanctioned apps. A related detection to strengthen coverage is monitoring for **Unusual User Behavior** (MITRE ID: T1071.001), which can help discern potential insider threats or automated scripts misusing accounts.

