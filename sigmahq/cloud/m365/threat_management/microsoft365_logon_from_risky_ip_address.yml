note: |
  ### Technical Context

  This Sigma rule detects successful logins to Microsoft Cloud applications from IP addresses flagged as risky by Microsoft Cloud App Security. The behavior indicates potential unauthorized access attempts by an adversary aiming to gain access to sensitive systems or data. This activity corresponds to the MITRE ATT&CK techniques for account compromise (T1078) and privilege escalation tactics. The primary telemetry sources include Microsoft 365 logs, specifically the Security Compliance Center events related to user authentication attempts. If malicious, this could lead to data exfiltration or unauthorized actions within enterprise applications. However, this detection does NOT confirm that the account has been compromised or the intent behind the login.

  ### Investigation Steps

  - **Review login details**: Check the user account that logged in from the risky IP address (Event IDs typical in M365 logs). Identify any anomalies in the user activity, such as unusual access times or locations.
  - **Cross-reference IP address**: Use threat intelligence feeds to determine the reputation of the IP address. Malicious indicators include IP addresses known for botnet activity or previous compromise reports.
  - **Evaluate normal usage patterns**: Analyze historical login activity for the affected user account, noting any legitimate access from the corresponding locations or IP addresses to establish a baseline.
  - **Inspect session activity**: Retrieve the activity logs associated with this login from the Security Compliance Center, focusing on actions executed post-authentication. Look for any administrative actions or access to sensitive data which may indicate misuse.
  - **Monitor for follow-up alerts**: Set alerts for further activities from the impacted account, looking for escalation of privileges or unusual access attempts immediately following this login, which can indicate a compromised session.

  ### Prioritization

  This alert carries a medium severity level due to its impact on potentially sensitive user accounts and the likelihood of malicious exploitation from risky IPs. While not all alerts indicate compromise, the behavior observed is often employed in real-world attacks, making it critical for timely investigation.

  ### Blind Spots and Assumptions

  Detection efficacy may be hindered by false positives stemming from legitimate remote access (e.g., VPN usage from unfamiliar locations). Ensure that Microsoft 365 logs are fully enabled and configured for comprehensive coverage. Legitimate business activities, such as authorized use of cloud services from dynamic IPs, may unintentionally trigger this alert. A related detection for failed logins or a dramatic increase in login frequency from the same risky IP should be monitored to strengthen overall security posture.

