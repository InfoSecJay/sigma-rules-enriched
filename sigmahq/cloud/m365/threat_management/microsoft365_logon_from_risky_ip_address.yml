note: |
  ### Technical Context

  This Sigma rule detects instances where a user successfully logs into Microsoft Cloud Apps from an IP address flagged as risky by Microsoft Cloud App Security. The likely objective for an attacker in this scenario is to gain unauthorized access to sensitive resources by exploiting compromised credentials, often through phishing or credential stuffing techniques. This behavior aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and technique Valid Accounts (T1078).

  The primary telemetry source for this alert comes from Microsoft 365's Security Compliance Center logs, specifically events related to user logins. If this behavior is malicious, it may indicate a compromised account with potential for lateral movement or data exfiltration. Importantly, this detection does NOT confirm that the user account is compromised without additional context; legitimate users may also connect from new or unusual locations.

  ### Investigation Steps

  - **Verify the user identity and context**: Confirm the outstanding user account's travel patterns and their typical login locations using Azure Active Directory sign-in logs (Event ID 4624) to assess if this connection is legitimate or anomalous.

  - **Examine the IP address for risk**: Cross-reference the reported risky IP address with threat intelligence feeds or services to determine its status, reputation, and any previous malicious activity associated with it.

  - **Check for multiple failed logins**: Review recent login attempts from the Azure Active Directory logs (Event ID 4625) to identify any preceding suspicious activities or multiple failed logins that could indicate credential stuffing efforts.

  - **Investigate associated session activity**: Look into the user's session activity post-login using audit logs from Microsoft Cloud Apps to identify any unusual actions, such as downloading sensitive data or accessing admin functions not typically executed by the user.

  - **Assess for concurrent sessions**: Monitor for any signs of concurrent access from different geolocations, indicating potential account sharing or compromise. Review Azure AD user sign-in logs for simultaneous logins from diverse IPs.

  ### Prioritization

  This alert holds medium severity, as successful logins from risky IPs can indicate compromised accounts leading to higher-risk actions. The criticality depends on the role of the affected user; accounts with administrative access carry more weight. Given that this tactic is commonly weaponized in real-world attacks, timely investigation is necessary.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of risk assessments provided by Microsoft Cloud App Security; legitimate business activities from contractors or traveling employees can trigger false positives. Ensure that logs from Microsoft 365 are correctly configured to capture necessary events for detection. A companion detection to consider is monitoring for changes in user permissions post-login, which could highlight potential privilege escalation actions.

