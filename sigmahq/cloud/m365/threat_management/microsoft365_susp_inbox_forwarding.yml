note: |
  ### Technical Context
  This detection rule identifies activities related to the creation of suspicious email forwarding rules in Microsoft 365, specifically when Cloud App Security flags an action that forwards emails to external addresses. Such behavior is typically indicative of potential email compromise, where an attacker seeks to exfiltrate sensitive information by automatically redirecting email communications to an unauthorized destination. The primary objective of the attacker in this scenario is usually to gather confidential information and maintain access to a victim's communications without their knowledge.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Exfiltration** (T1041) which encompasses unauthorized transfer of data outside of the organization. Observing such behavior allows security analysts to respond promptly, as it may signify an attempted or successful data breach, particularly if sensitive user information or communications are involved.

  Key telemetry sources for this detection include Microsoft 365's Security Compliance Center logs, which document changes in email settings, notably any creation or modification of inbox rules that could facilitate unauthorized email forwarding.

  ### Investigation Steps
  - **Review Email Rules:** Examine the specific inbox rules created, focusing on any that forward mail to external domains. Note the user who created these rules and the timing of their creation.
  - **Analyze User Behavior:** Investigate other activities performed by the user around the time the forwarding rule was established, looking for anomalous logins, unusual access patterns, or modifications to sensitive data.
  - **Check for External Communications:** Search for patterns of email sent to external addresses post-rule creation, particularly for sensitive keywords, phrases, or attachments that may indicate an exfiltration attempt.
  - **Consult Historical Data:** Compare the current configuration of email forwarding rules with historical data to identify any unauthorized changes or unusual patterns over time.

  ### Prioritization
  The alert's severity is considered **low**, reflecting a potential risk where forwarding rules may inadvertently disclose information but are not necessarily indicative of an active threat without further confirmation of malicious intent or consequences.

  ### Blind Spots and Assumptions
  This detection rule may not cover manual changes that bypass the monitored channels or settings. Additionally, it assumes that the only means of exfiltration is via explicit forwarding rules; an attacker might employ other methods to access and exfiltrate data without relying on these configurations. The necessary logs for accurate detection include complete tracking of changes within the Security Compliance Center for Microsoft 365, including alerts for rule creation and modification events.

