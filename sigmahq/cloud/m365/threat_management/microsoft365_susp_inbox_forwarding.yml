  ### Technical Context

  The rule detects the creation of suspicious email forwarding rules in Microsoft 365, where a user sets up forwarding to an external address. This behavior indicates potential data exfiltration, as attackers often use such rules to siphon sensitive information to external destinations. The relevant MITRE ATT&CK tactic is **Exfiltration** (TA0010) and the technique is **Exfiltration Over Web Service** (T1020). Primary telemetry sources include Microsoft’s Cloud App Security event logs, specifically tracking events from the Security Compliance Center. If malicious, the security impact could include unauthorized access to sensitive data and compromise of organizational confidentiality. Importantly, the detection of this behavior does NOT confirm malicious intent, as it may result from legitimate business processes or user error.

  ---

  ### Investigation Steps

  - **Review the event details**: Check the Security Compliance Center logs for Event Name "Suspicious inbox forwarding" to confirm the forwarding rule's specifics, including the external address to which emails are forwarded. Compare it against known and approved external communication domains.

  - **Validate user behavior**: Identify the user who created the forwarding rule by correlating the event with the user's activity logs. Look for previous actions from the user (e.g., Event ID 4624 for successful logons) to establish a behavioral baseline, focusing on whether this activity aligns with normal operational patterns.

  - **Check for multiple rules**: Look for any additional suspicious inbox forwarding rules from the same user or other users. Investigate Event ID logs (such as Event ID 365 and relevant subscription logs) for any patterns indicating bulk creation or modification of inbox rules.

  - **Analyze external communications**: Review the email logs (e.g., Exchange Online logs) to identify any recent communication with the external address. Look for evidence of sent emails containing sensitive content that matches the time frame of the suspicious rule creation.

  - **Examine account permissions**: Investigate if the user has excessive permissions or if they are in a sensitive role (e.g., finance or HR) that may justify scrutiny. Use Azure AD logs to review user role assignments and privilege levels.

  - **Document legitimate use cases**: Consider whether similar forwarding rules exist for legitimate business purposes (e.g., during employee exits or specific projects). Validate against documented business processes, ensuring legitimate rules are not inadvertently flagged.

  ---

  ### Prioritization

  This alert is low severity, as it may indicate either benign user behavior or potential early-stage data exfiltration. However, the likelihood of malicious abuse is moderate, as forwarding to external addresses is frequently associated with data theft. This behavior is recognized as a common tactic used by adversaries, warranting further investigation but not immediate escalation.

  ---

  ### Blind Spots and Assumptions

  This detection may miss incidents where forwarding rules are created via native email client settings or third-party apps that don't generate the expected telemetry. The effectiveness of this detection relies on having complete Cloud App Security logging configurations enabled. Legitimate internal forwarding rules for external partners may trigger this alert, notably in collaborative scenarios. A companion detection that strengthens overall coverage includes monitoring for anomalous external email activities, such as unexpected email volume or new foreign domains frequently contacted.

