note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious inbox forwarding rules in Microsoft 365, particularly those forwarding emails to external addresses. The typical attacker objective is to exfiltrate sensitive information by redirecting email communications outside of the organization. This behavior fits into the MITRE ATT&CK framework under the tactic "Exfiltration" and the technique "Exfiltration Over Web Service" (T1020). Primary telemetry sources include Microsoft 365 Security Compliance Center logs, specifically looking for events related to inbox rule modifications. If malicious, such activity could lead to unauthorized data exposure. Importantly, this detection does NOT confirm malicious intent by itself, as there can be legitimate reasons for creating forwarding rules.

  ### Investigation Steps

  - **Examine Security Compliance Center logs:** Look at logs with event names indicating "Suspicious inbox forwarding" (eventSource: SecurityComplianceCenter, eventName: 'Suspicious inbox forwarding') and note the user account involved. Validate if the user has a legitimate business need for forwarding emails externally.

  - **Verify contextual indicators for legitimacy:** Check if the user's email usage reflects typical behavior patterns by examining mailbox logs (such as mailbox audit logs). Flags to look for are a high volume of external forwarding rules created in a short time frame or unusual activity from the originating IP address.

  - **Assess user roles and permissions:** Determine the role of the user who created the forwarding rule. High-privilege or highly sensitive role users (like executives) require closer scrutiny compared to standard users.

  - **Analyze user behavior post-rule creation:** Review subsequent email traffic logs (like Exchange Online Message Trace) for any unusual patterns, such as a spike in outbound messages to external domains following the creation of the forwarding rule.

  - **Identify external email domains:** Cross-reference the external addresses used in the forwarding rules against known malicious or suspicious domains. Look at common threat intelligence sources for any reputational risks.

  ### Prioritization

  The alert severity is low, primarily due to the potential for legitimate use cases such as email management or setup for business needs. However, a moderate concern exists as this behavior can indicate a reasonably high risk of compromised accounts, especially if tied to sensitive data or high-privilege accounts. Since such forwarding rules are often weaponized in targeted phishing and data exfiltration campaigns, the investigation requires diligence.

  ### Blind Spots and Assumptions

  Detection may be limited by user behavior that mimics legitimate activity or users being unaware of the policies regarding email forwarding. Additionally, without proper logging configurations, such as lacking mailbox audit logging, it may be challenging to gather sufficient context. Legitimate activities that could trigger the alert include employees setting up forwarding rules for remote work or personal reasons. A companion detection, such as monitoring for unusual access to sensitive data (like file access logs), can help strengthen overall security posture against phishing attempts leading to this behavior.

