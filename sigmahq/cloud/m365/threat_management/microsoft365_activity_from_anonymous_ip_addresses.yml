note: |
  ### Technical Context
  This rule detects user activity from IP addresses identified as anonymous proxies within Microsoft Cloud App Security. Anonymizing services often obfuscate the true source of a connection, which can be a tactic used by malicious actors to conceal their identities during reconnaissance, data exfiltration, or unauthorized access attempts. By identifying such activities, organizations can proactively investigate possible malicious intent.

  The threat actor's objective may include exfiltrating sensitive data or accessing corporate resources without detection. The use of anonymizing proxies can signify attempts to bypass security measures, and it correlates with various attack methodologies. Relevant MITRE ATT&CK tactics include **Command and Control (T1071)** for communication through command and control channels and **Exfiltration Over Command and Control Channel (T1041)**, where data could be siphoned away silently under the radar of traditional security measures.

  The primary data sources for detection will come from Microsoft 365 security logs, particularly logs recorded in the Security Compliance Center related to user activities and their originating IP addresses.

  ### Investigation Steps
  - **Review Security Logs**: Examine Microsoft Cloud App Security logs for events related to user activity from the identified anonymous IP addresses, noting timestamps, user details, and any access patterns that deviate from normal behavior.

  - **Check User Context**: Investigate the users associated with the anonymous IP addresses to determine their normal behavior and potential business justification for using an anonymous proxy, such as remote work scenarios.

  - **Assess Network Traffic**: Analyze network traffic logs for communications originating from these IP addresses to identify any unusual data transmission patterns or destinations that warrant closer inspection.

  - **Consult Threat Intelligence**: Use threat intelligence resources to determine if the identified anonymous proxy IP addresses have been associated with known malicious activity or threat actors, providing context to the alert.

  ### Prioritization
  The severity of this alert is medium, as user connections from anonymous IP addresses can indicate possible unauthorized access or data exfiltration attempts. Given the ease with which attackers can manipulate their trace and the prevalence of anonymizing services, timely investigation is essential to mitigating potential threats.

  ### Blind Spots and Assumptions
  Detecting activity from anonymous IP addresses may not capture the full picture of user behavior, particularly in environments where legitimate use of VPNs or proxies is common. The detection logic assumes that any activity from these addresses is suspicious, which could lead to false positives, especially if legitimate users are utilizing privacy tools. Additionally, the effectiveness of this alert relies on accurate logging and alerting configurations in Microsoft 365, and erroneous or incomplete data may hinder comprehensive detection capabilities.

