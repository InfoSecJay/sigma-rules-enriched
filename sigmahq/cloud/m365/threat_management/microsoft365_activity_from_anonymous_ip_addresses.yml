note: |
  ### Technical Context

  This Sigma rule detects user activity reported by Microsoft Cloud App Security (MCAS) from IP addresses identified as anonymous proxies. The likely attacker objective is to obscure their location while interacting with enterprise applications, often as part of reconnaissance or to bypass restrictions on legitimate access to resources. This behavior maps to the MITRE ATT&CK tactic “Command and Control” (TA0011) and the technique “Commonly Used Port” (T1573). The primary telemetry sources are MCAS logs, specifically the Security Compliance Center events regarding user activities from anonymous IPs.

  If this activity is indeed malicious, it could indicate unauthorized access attempts, potentially leading to data exfiltration, data manipulation, or other nefarious actions. However, the detection does NOT confirm that the activity is indeed malicious on its own; some users may legitimately use VPNs or proxies for business purposes.

  ### Investigation Steps

  - **Identify user activity context:** Review MCAS logs for the event `Activity from anonymous IP addresses`, focusing on fields like `userPrincipalName`, `ipAddress`, and `eventTime` to understand who is accessing resources and what they are attempting to do.

  - **Examine IP reputation:** Cross-reference the reported anonymous IP addresses against threat intelligence sources (e.g., abuseipdb.com) to determine if they are known malicious IPs or if they are commonly used for benign purposes (e.g., legitimate VPN services).

  - **Review user behavior:** Look at user account activity in the Azure Active Directory (Audit Logs, Event ID 4624) for the last 30 days to identify any unusual patterns (e.g., frequent logins from various anonymous IPs) compared to their usual behavior to differentiate benign use cases from potential abuse.

  - **Check for data access patterns:** Monitor recent file access logs (e.g., SharePoint or OneDrive audit logs) associated with the user. Look for unusual patterns such as access to sensitive files or elevated access rights that correlate with the anonymous IP entry.

  - **Evaluate existing security controls:** Confirm the organization’s proxy and VPN usage policies to determine if the user is aligned with accepted practices. Assess if any legitimate business activities might result in similar alerts.

  - **Document and report high-confidence indicators:** If the examined user consistently logs in from multiple anonymous proxies with a pattern of accessing high-risk or sensitive files, escalate this as a high-confidence malicious indicator for further investigation.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive data if an unauthorized user is gaining access through an anonymous proxy. The likelihood of malicious abuse is moderate, as attackers commonly utilize such methods to mask their identity. The behavior is potentially weaponized; while many benign activities can trigger it, the risk from unidentified users merits urgent examination.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate users are using VPNs or proxies for valid business reasons, which can obscure intent. Reliable detection requires comprehensive integration of MCAS logs, Azure AD Audit Logs, and threat intelligence feeds. Additionally, activities such as remote work or legitimate VPN usage by employees can frequently trigger this alert. A related detection rule for monitoring unusual geolocation patterns (e.g., logins from geographically disparate locations in short time spans) could strengthen overall coverage against potential threats.

