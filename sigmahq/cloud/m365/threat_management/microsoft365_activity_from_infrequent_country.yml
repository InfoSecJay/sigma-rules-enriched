note: |
  ### Technical Context
  This detection rule monitors for activities initiated from geographical locations that users in the organization have not recently or ever accessed. Specifically, it leverages Microsoft Cloud App Security reports to flag anomalous behavior that could indicate potential account compromise or misuse. In a threat scenario, an attacker may use compromised credentials to access corporate resources from a foreign location to evade detection longer or to exploit specific vulnerabilities within the organization.

  The primary MITRE ATT&CK tactics associated with this type of detection include **Command and Control (T1071)** due to the potential use of external servers by attackers to maintain persistence and communicate with compromised systems. The technique **T1573 (Encrypted Channel)** may also be relevant if the attacker uses encryption to mask their malicious communications.

  Key telemetry sources for this rule include reports from Microsoft Cloud App Security, which provide insights into user logins and activities, and may also involve network logs if external connections (e.g., VPN usage) can be correlated with users’ activities.

  ### Investigation Steps
  - **Review Cloud App Security Logs:** Collect log data from Microsoft Cloud App Security to identify the specific user accounts involved in accessing services from the infrequent location. Look for patterns or anomalies that could suggest account compromise.

  - **Cross-Reference User Access Patterns:** Compare the logged activity from the infrequent country to users' typical access patterns. Identify whether this activity aligns with known user behavior or if it diverges significantly.

  - **Analyze VPN and Network Logs:** Examine VPN logs and other network traffic data that can help pinpoint whether legitimate VPN connections were established during the event timeframe. This will aid in confirming or refuting whether users were expected to be in the reported location.

  - **Investigate Authentication Logs:** Investigate logs from other authentication sources to check for unusual or suspicious login attempts or successful authentications that may correlate with the suspect activity in Cloud App Security.

  ### Prioritization
  This alert is of medium severity in an enterprise environment due to the potential risk of unauthorized access from unfamiliar locations, which could lead to data breaches or further exploitation of assets. The likelihood of such an event occurring may vary based on organizational geography and typical user behavior patterns.

  ### Blind Spots and Assumptions
  There may be detection gaps concerning legitimate users who may travel infrequently to new countries, potentially resulting in false positives. The rule assumes that the absence of prior access to certain locations is indicative of a threat, which may not be the case for all users. Required logs for optimal functionality include complete authentication and access logs from Microsoft Cloud App Security, along with network access logs for corroborative incident response insights.

