note: |
  ### Technical Context

  This rule detects activities originating from geographic locations that users in the organization have not recently visited or have never interacted with, as reported by Microsoft Cloud App Security. Likely attacker objectives include unauthorized access or manipulation of cloud resources, potentially indicating account compromise or data exfiltration attempts. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), specifically technique "Application Layer Protocol" (T1573).

  Primary telemetry sources include Microsoft 365 cloud logs, specifically focusing on events from the Security and Compliance Center. If malicious, this behavior could signify a breach, enabling adversaries to control or extract sensitive information from the environment. However, this detection does NOT confirm that the activity is inherently malicious; further contextual investigation is necessary.

  ### Investigation Steps

  - **Verify user activity history:** Cross-reference the user's historical logins using Azure AD Sign-In logs (Event ID 4624) to ascertain the validity of their geographic login history. A login from an unusual country without prior records may warrant further scrutiny.

  - **Review risk policies in place:** Check Microsoft Cloud App Security settings to identify the anomaly detection policies configured. Assess whether the detected country falls under known benign or commonly accessed regions for the organization.

  - **Analyze application access:** Examine logs for activities tied to critical apps (e.g., SharePoint, OneDrive) at the time of the event. Seek specific API call logs indicating application access patterns to confirm any unauthorized interactions.

  - **Identify known legitimate activities:** Investigate activities from trusted recently added users, such as remote workers or new hires, who may have legitimate reasons to access from uncommon locations. Confirm if there was a notified travel or remote session.

  - **Assess alerts from threat intelligence feeds:** Correlate detected country IPs against threat intelligence databases to see if known malicious entities are associated with the IP address triggering the alert, establishing a high-confidence malicious indicator.

  ### Prioritization

  The alert has a medium severity due to its implications for potential unauthorized access or compromise of critical cloud services. Given that attackers often leverage infrequent locations for command and control operations, the likelihood of malicious exploitation is significant, especially during periods of increased cloud adoption.

  ### Blind Spots and Assumptions

  Detection limitations include the risk of false positives from legitimate remote workers or users traveling abroad without prior notice. Reliable detection depends on proper logging configurations within Microsoft 365, particularly enabling detailed logging in Cloud App Security. Activities such as employee overseas travel or temporary assignments may trigger alerts. A companion detection to consider is monitoring for unusual geolocation-based logins against privileged accounts to strengthen coverage on potential account misuse.

