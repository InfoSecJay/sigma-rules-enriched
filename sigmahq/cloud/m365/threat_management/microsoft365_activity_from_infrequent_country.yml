  ---

  ### Technical Context

  This rule detects activities originating from geographic locations that have not been recently accessed, or have never been accessed, by any user within the organization. The likely objective of an attacker leveraging this behavior is to bypass security mechanisms in place by appearing from unrecognized locations, potentially gaining unauthorized access or moving laterally within the environment. This aligns with the MITRE ATT&CK tactic for Command and Control (TA0011) and the technique Exfiltration Over Command and Control Channel (T1573).

  The primary telemetry source for this rule is Microsoft 365's Cloud App Security logging, specifically the documented event named 'Activity from infrequent country'. If malicious, such activity could indicate a significant security breach, compromising sensitive enterprise data. However, this detection does NOT confirm malicious intent on its own, as legitimate users or services may occasionally access resources from unfamiliar geographic locations due to travel or legitimate third-party services.

  ---

  ### Investigation Steps

  - **Verify user location history:** Check the user account's login history within Azure AD (Event ID 4624) to determine if this is an expected access point or if the user has logged in from this location previously.

  - **Assess legitimate behavior:** Confirm if there are any known business operations, such as clients or partners, who routinely access the environment from this geographic region. Document any valid third-party integrations or business travel that supports the activity.

  - **Review activity specifics:** Analyze the Cloud App Security logs for additional details on the activity in terms of timestamps, accessed applications, and specific user actions that were performed during this session.

  - **Identify high-confidence malicious indicators:** If the originating IP matches known malicious IP databases or geo-located address lists, flag these access attempts as potentially malicious—cross-reference with threat intelligence feeds.

  - **Examine user account properties:** Review the Azure AD user profile for risk indicators such as multi-factor authentication settings, anomalies in sign-in logs, and recent changes in user permission levels.

  - **Document supporting details:** Generate a report that outlines all findings, including account history, geographic data, and potential alerts from SIEM tools like Microsoft Sentinel, for further escalation or investigation by Tier 3 analysts.

  ---

  ### Prioritization

  This alert is medium severity as it triggers on potentially unauthorized access from infrequent locations. The impact could be significant, especially if the affected system contains sensitive corporate data. While these geographic anomalies can indicate malicious activity, they may also stem from legitimate actions, requiring careful analysis.

  ---

  ### Blind Spots and Assumptions

  There is a potential for evasion if attackers utilize VPNs or proxies to mask their true location, leading to false negatives. Detection depends on the full integration of Microsoft 365 logging with threat management configurations. Legitimate activities such as remote workers using business travel or cloud services may inadvertently trigger this alert. Companion detections, such as failed login attempts from unknown locations or changes in user access permissions, can provide additional context and strengthen overall threat coverage.

