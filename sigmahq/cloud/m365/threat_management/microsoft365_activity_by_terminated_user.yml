note: |
  ### Technical Context

  This Sigma rule detects activities performed by users whose accounts have been terminated in Azure Active Directory (Azure AD) but continue to operate in other cloud environments, such as AWS or Salesforce. The likely attacker objective is to maintain access to resources post-termination, which can facilitate data exfiltration or resource manipulation. This behavior aligns with the MITRE ATT&CK technique T1078.001 (Valid Accounts: Local Accounts) and tactic TA0006 (Credential Access). The primary telemetry sources include Microsoft 365 security compliance logs, specifically monitoring event names related to terminated user activities.

  If malicious, the security impact could lead to unauthorized data access or manipulation, resulting in potential data breaches or integrity issues. However, this detection does NOT confirm malicious intent without further context and investigation, as there could be legitimate accounts remaining available for shared services.

  ### Investigation Steps

  - **Review Azure AD user status:** Verify the termination status of the user account reported by Microsoft Cloud App Security using Azure AD logs (Event IDs: 47826, 47827). Confirm that the account is indeed marked as terminated.

  - **Correlate AWS/Salesforce activity:** Examine logs from AWS CloudTrail or Salesforce Audit logs to identify any recent actions taken by the terminated user, focusing on critical operations like IAM changes (AWS Event Name: CreateUser, Salesforce API event names).

  - **Identify high-confidence malicious indicators:** Check for unusual IP addresses or geolocations associated with the activity (CloudTrail sourceIPAddress or Salesforce login IP). Any access from outside normal geographical patterns can indicate potential misuse.

  - **Document legitimate activity:** Analyze the user’s last legitimate activities before termination, comparing against the current logs to identify discrepancies. Look for expected behavior, such as user withdrawal processes involving access removal three days prior to termination.

  - **Check for additional accounts:** Investigate whether the terminated user might have employed additional accounts for resource management (e.g., service accounts). Search for logs indicating cross-account access patterns in AWS or Salesforce.

  ### Prioritization

  The alert is of medium severity due to the potential impact of unauthorized access to sensitive resources. The likelihood of malicious abuse is high in cases where users retain access beyond termination. This behavior can be weaponized, particularly in environments where users interact with unmanaged service accounts.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that the terminated user could still possess legitimate access if another account was overlooked during the termination process. Required log sources must include Azure AD logs and detailed AWS or Salesforce logs configured for anomaly detection. Legitimate activities, such as services utilizing shared accounts or scheduled tasks, may trigger alerts. A related detection to strengthen coverage could monitor for unusual account privilege escalations following user termination.

