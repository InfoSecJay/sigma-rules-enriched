note: |
  ### Technical Context
  This detection rule targets the activities of users whose accounts have been terminated in Azure Active Directory (Azure AD) but who are still able to perform actions in cloud-based applications like AWS or Salesforce. Typically, when users leave a company, their accounts should be deactivated to prevent unauthorized access. However, if external accounts or additional access methods remain active, these users can conduct potentially malicious activities, undermining the organization's security posture. This scenario is particularly critical as it represents a risk where former employees may exploit their lingering access privileges for data theft or infrastructure manipulation.

  Relevant MITRE ATT&CK tactics include *Account Manipulation* (T1098) and *Credential Dumping* (T1003), as terminated users might attempt to utilize residual credentials to gain access to sensitive resources, thereby leading to broader impacts on the organization's data integrity and confidentiality. The primary data sources to investigate include logs from Microsoft Cloud App Security, Azure AD logs for account status changes, and access logs from cloud service platforms like AWS and Salesforce.

  ### Investigation Steps
  - **Review Azure AD Audit Logs**: Check for logs associated with account termination to confirm that the user was indeed deactivated, and note any associated timeframes or anomalies.
  - **Investigate Cloud Service Activity Logs**: Analyze any recent activity logs from platforms such as AWS or Salesforce where the terminated user may have engaged in resource management or data access to identify unauthorized actions.
  - **Cross-reference with Active Directory Accounts**: Look for any external or additional accounts that were linked to the terminated user's privileges that might not have been disabled, leading to continued access.
  - **Assess Anomaly Detection Alerts**: Review alerts from Microsoft Cloud App Security for flagged activities linked to the terminated user's account, focusing on service interactions and any unusual behaviors that deviate from standard operating patterns.

  ### Prioritization
  This alert should be treated as medium severity due to the potential for significant impact if a user retains access after termination, which could lead to data breaches or service disruptions. The likelihood is moderate, especially if organizational practices around account termination and monitoring are lax.

  ### Blind Spots and Assumptions
  The primary blind spots of this detection rule may include accounts that do not use Azure AD or activities that occur outside of monitored environments. Additionally, this rule assumes that terminated user accounts will be flagged appropriately in Azure AD and that no unauthorized provisioning of other accounts is present. For the alert to function effectively, it requires continuous logging and monitoring of Azure AD and connected cloud service activities, ensuring integration between security management systems.

