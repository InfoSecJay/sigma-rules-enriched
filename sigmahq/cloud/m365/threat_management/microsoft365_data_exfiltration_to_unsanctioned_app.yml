note: |
  ### Technical Context

  This Sigma rule detects attempts to exfiltrate data from the organization using applications that are not sanctioned by the organization. The behavior indicates that a user or an IP address has successfully accessed and utilized unsanctioned applications, potentially leading to data leakage. The likely attacker objective is to bypass data protection measures and extract sensitive information unnoticed. This detection correlates with the MITRE ATT&CK technique Exfiltration to Cloud Storage (T1537).

  The primary telemetry source for this detection is Microsoft 365’s Security Compliance Center, specifically focusing on events that report engagements with unauthorized apps. If malicious, the security impact could involve the exposure of sensitive organizational data. This detection does NOT confirm malicious intent; it only highlights anomalous behavior involving unsanctioned applications.

  ### Investigation Steps

  - **Review Microsoft 365 Security logs**: Examine Security Event logs within the Security Compliance Center (Event Name: 'Data exfiltration to unsanctioned apps') to identify the user(s) involved and the specific application(s) accessed.

  - **Validate user context and activities**: Determine user roles through their Azure AD profiles to assess if their access to unsanctioned apps aligns with their job functions. Legitimate users may have occasional access for testing, but repeated instances may indicate vulnerability exploitation.

  - **Cross-check with sanctioned applications**: Compare the unsanctioned applications used in the alerts against your organization’s list of permitted applications, ensuring to identify those that might be inadvertently approved for use by departments.

  - **Identify abnormal data transfer volumes**: Investigate the amount of data purportedly exfiltrated by correlating this event with cloud application logs; significantly large file transfers to unknown cloud services may indicate malicious activity.

  - **Monitor for user behavioral patterns**: Utilize user behavior analytics tools to determine if the affected user has exhibited unusual patterns, such as accessing unsanctioned apps outside of normal work hours or high-frequency access anomalies.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on sensitive organizational data and the chance of covert malicious activity. The likelihood of attack exploitation is moderate, given that exfiltration to unauthorized applications is a common tactic used by adversaries.

  ### Blind Spots and Assumptions

  Possible evasion techniques include legitimate user actions blending with the attack, such as employees testing new applications. Reliable detection requires full visibility into unsanctioned app access; configurations must ensure all relevant logs are enabled. Activities like accessing third-party collaboration tools may trigger the alert. A related detection to consider is monitoring for data transfers to cloud storage (T1537) using sanctioned applications, reinforcing protective measures against unauthorized information flow.

