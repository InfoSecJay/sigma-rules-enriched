  ---

  ### Technical Context

  This rule detects instances where users are observed interacting with unsanctioned applications in a manner characteristic of information exfiltration attempts. The probable objective behind such behavior is to extract sensitive data from the organization, bypassing controls set on sanctioned applications. The relevant MITRE ATT&CK tactic is **Exfiltration (T1041)**, with the specific technique being **Exfiltration to an Unsanctioned Cloud Application (T1537)**. The primary telemetry source comes from Microsoft Cloud App Security logs, specifically the activity reports generated from the Security Compliance Center. If successfully malicious, this could lead to a significant data breach, potentially impacting confidentiality and compliance. Importantly, this detection alone does not confirm that exfiltration occurred; further investigation is required to understand the context behind the observed behavior.

  ---

  ### Investigation Steps

  - **Check user activity history**: Review the Microsoft Cloud App Security activity log for the user associated with the alert (Event Type: 'User Activity') to identify the context and frequency of interactions with unsanctioned applications.

  - **Verify sanctioned application list**: Cross-reference the applications accessed against the list of approved or sanctioned applications as documented in your organization's policy. Activities outside this scope should be scrutinized closely.

  - **Analyze file sharing activities**: Investigate if any file sharing events were logged (e.g., file ID, file type) during the time of the alert. Look for indicators of file uploads or downloads to the unsanctioned app (Telemetry: File Activity logs).

  - **Identify legitimate uses of similar apps**: Gather information on any known business-related uses of unsanctioned applications. Document user explanations and intentions if these are legitimate and expected for necessary business functions.

  - **Evaluate for high-confidence indicators**: Look for patterns of behavior consistent with exfiltration, such as uploads of large amounts of sensitive data (e.g., sensitive document types) to unverified cloud storage (Event: 'Data upload').

  - **Assess for API call anomalies**: Investigate related API calls (if applicable) made from the user's account to the unsanctioned app, analyzing the patterns and payloads to identify signs of scripted or automated exfiltration attempts.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of the affected system, particularly if sensitive data is involved. Malicious abuse is plausible, as unsanctioned apps can often be exploited to bypass corporate security measures. Such behavior is increasingly weaponized in attacks, warranting immediate investigation.

  ---

  ### Blind Spots and Assumptions

  There are potential evasion techniques, such as using approved applications to indirectly access unsanctioned ones or employing encryption to mask data exfiltration. Successful detection relies on properly configured Microsoft Cloud App Security onboarding to ensure all relevant logs are available. Additionally, activities by trusted users accessing unsanctioned apps for personal reasons may inadvertently trigger this alert. Related detections include unusual cloud application logins (e.g., failed logins) which can provide context for further investigations.

