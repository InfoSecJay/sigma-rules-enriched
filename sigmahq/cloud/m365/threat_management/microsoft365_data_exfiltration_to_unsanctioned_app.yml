note: |
  ### Technical Context
  This detection rule identifies instances where a user or IP address engages with unsanctioned applications in a manner indicative of data exfiltration efforts. The rule is triggered by alerts generated through Microsoft Cloud App Security (MCAS), which flags activities that deviate from authorized application usage policies established within an organization. Attackers may exploit these unsanctioned platforms to siphon sensitive data, thereby bypassing traditional security controls that typically focus on sanctioned applications.

  The likely attacker objective is to gather and transfer confidential information without detection, utilizing platforms that may not be monitored or controlled by the organization. This behavior aligns with the MITRE ATT&CK framework techniques such as Exfiltration Over Web Service (T1537) and may involve tactics associated with Data Exfiltration (TA0010). The primary data sources relevant to this detection include logs generated by Microsoft 365’s Security Compliance Center, which can offer insights into unsanctioned app interactions.

  ### Investigation Steps
  - **Review Security Alerts**: Check the Microsoft 365 Security Compliance Center for detailed alerts regarding unsanctioned app usage and filter by the pertinent timeframe to identify suspicious activities.
  - **Analyze User Behavior**: Investigate the behavior of the involved users for any prior records of unusual account activities or if they have a history of accessing unsanctioned applications.
  - **Examine Data Transfer Patterns**: Look for patterns of data transfer leading to the unsanctioned applications, such as the volume of data and the types of files being transferred.
  - **Correlate with Network Traffic**: If network logs are available, correlate the timestamps of the detected events with outbound traffic to identify any anomalies or unauthorized data flows.

  ### Prioritization
  Given that data exfiltration poses a significant risk to an organization's sensitive information, alerts generated by this rule should be treated with a medium priority. The likelihood of threat actors leveraging unsanctioned apps for data theft emphasizes the need for swift investigation and potential remediation steps.

  ### Blind Spots and Assumptions
  This detection may not cover all possible exfiltration methods, particularly if users employ encrypted apps or proprietary communication methods to transfer data. The detection logic assumes that all relevant unsanctioned app activities will be logged appropriately by Microsoft 365. To ensure the effectiveness of this alert, it is essential that Microsoft Cloud App Security is properly configured to monitor and report on both sanctioned and unsanctioned applications, and that the appropriate logging mechanisms are enabled within the Microsoft 365 environment.

