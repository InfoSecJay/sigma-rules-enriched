  ---

  ### Technical Context

  This Sigma rule detects instances where a user in Microsoft 365 has exceeded sending limits set by service policies and has subsequently been restricted from sending emails. The likely attacker objective is to exploit email functionality for phishing, spam, or data exfiltration, which could indicate an account compromise or misuse. This behavior fits into the MITRE ATT&CK tactic of Initial Access (T1071) and technique of Phishing (T1199). The primary telemetry sources include Microsoft 365 Security Compliance Center logs, specifically event logs indicating user restrictions. If malicious, this action could disrupt communication for legitimate users and indicate compromise or abuse of the account. Importantly, this detection does NOT confirm that the user account has been compromised; it solely indicates a threshold limit has been exceeded.

  ---

  ### Investigation Steps

  - **Review user email sending limits:** Verify the normal sending limits for the user as per Microsoft's service policies. Confirm if the user routinely operates near these limits and their legitimate usage patterns.

  - **Check recent login events:** Inspect Azure AD Sign-in logs (Event ID 4624) to determine if there are recent login attempts from unusual IP addresses or geolocations that could indicate an unauthorized user accessing the account.

  - **Audit email sending behavior:** Look at Mailbox Audit logs to review recent outbound emails (e.g., cmdlet `Get-MailboxAuditLog`) to confirm expected activity, and note any patterns of excessive sending or unexpected recipients.

  - **Investigate related account activity:** Examine Microsoft 365 logs for any anomalous account activities, such as password changes, multi-factor authentication failures, or unusual geolocation logins.

  - **Review compliance and anomaly detection policies:** Verify if any existing policies or anomaly detection alerts have flagged this user in the past for suspicious behavior or if they have been listed in user groups with higher exposure to potential exploits.

  ---

  ### Prioritization

  This alert is rated medium severity due to the potential impact on email communication for critical users. The likelihood of malicious abuse is moderate, as attackers often exploit email systems for phishing or spamming purposes. However, this behavior may also occur due to legitimate heavy use by high-traffic users or service limits inadvertently triggered.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist as users who naturally approach volume limits may trigger this alert without malicious intent. Having complete logging configurations within Microsoft 365’s Security Compliance Center is essential for accurate detection. The presence of legitimate high-volume users could confuse genuine threats, and other detections related to account compromise (e.g., unusual login alerts) should complement this monitoring for robust coverage.

