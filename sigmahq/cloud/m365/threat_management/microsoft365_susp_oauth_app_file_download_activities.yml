  ### Technical Context
  This detection rule identifies unusual file download activities from Microsoft SharePoint or OneDrive by OAuth applications, as reported by Microsoft Cloud App Security. Specifically, it targets scenarios where an application downloads multiple files that deviate from typical user behavior. This behavior may be indicative of data exfiltration attempts by malicious actors utilizing compromised credentials or unauthorized OAuth apps to gain access to sensitive information stored in the cloud.

  The threat scenario encompasses potential insider threats or external attacks, where an adversary uses legitimate applications to ultimately exfiltrate data undetected. The attacker may aim to harvest sensitive corporate data, intellectual property, or personal identifiable information for malicious purposes, ranging from corporate espionage to identity theft.

  Relevant MITRE ATT&CK tactics include **Exfiltration** (TA0010), where unauthorized data transfer is attempted, specifically employing techniques such as **Exfiltration Over External Command and Control Channel** (T1041) and **Exfiltration Over Web Service** (T1071). Primary data sources for this detection include Microsoft 365 auditing logs, which capture OAuth app activities and file access patterns.

  ### Investigation Steps
  - **Review OAuth App Permissions:** Examine the list of OAuth applications granted access to the account in question. Look for any unusual or unauthorized applications that may indicate potential compromise.

  - **Analyze Cloud Storage Logs:** Collect and analyze logs from SharePoint and OneDrive to trace the downloaded files' activity. Identify the user’s typical download patterns to determine what constitutes "unusual."

  - **Check User Behavior Analytics:** Investigate user behavior analytics data to identify any other anomalies in file access, including times of access and volume of files downloaded over a given period.

  - **Assess User Account Activity:** Review the account's recent activities across Microsoft Cloud services for any other suspicious actions, such as failed login attempts, unusual login times, or simultaneous access from multiple geographic locations.

  ### Prioritization
  This alert is of medium severity due to its potential to indicate data exfiltration, which can have significant impacts on sensitive information and corporate integrity. While not every alert will be indicative of an actual breach, the likelihood of misuse using legitimate applications represents a serious risk that requires timely investigation.

  ### Blind Spots and Assumptions
  One potential gap in coverage could arise from legitimate high-volume download activities that could falsely trigger this alert, such as routine data migrations or backups. The detection logic assumes that unusual behavior can be marked accurately based on user activity patterns; however, variability in legitimate business practices may lead to false positives. For the alert to function, consistent monitoring and logging of OAuth app activities along with thorough auditing settings in Microsoft 365 services must be properly configured.

