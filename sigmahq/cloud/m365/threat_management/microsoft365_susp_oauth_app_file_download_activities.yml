note: |
  ### Technical Context

  This Sigma rule detects anomalous file download activities from Microsoft SharePoint or OneDrive by an OAuth application. This behavior may indicate an unauthorized application is accessing and exfiltrating data, aiming to move sensitive information outside of the organization's control. The relevant MITRE ATT&CK tactic is "Exfiltration" (TA0010), with the technique being "Exfiltration Over Command and Control Channel" (T1041).

  The primary telemetry source is Microsoft 365's security compliance logs, specifically entries that capture suspicious OAuth activities. If malicious, the impact could encompass unauthorized data exposure or leakage of sensitive corporate information. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate applications may sometimes behave similarly under certain conditions.

  ### Investigation Steps

  - **Review the OAuth app details:** Check the application name and permissions associated with the downloads. Look for unfamiliar or non-approved applications that may be listed in the Microsoft 365 admin center under Azure AD > Enterprise applications.

  - **Analyze download volume and frequency:** Examine the logs for the specific event (Event Name: "Suspicious OAuth app file download activities"). Identify if there is an unusually high number of files downloaded in a short timeframe (e.g., more than 10 files in 1 hour), which can indicate suspicious behavior.

  - **Compare against normal user activity:** Assess the user's typical file access patterns in Microsoft SharePoint or OneDrive. If the user frequently downloads files but not at the volume or rate detected, this discrepancy can highlight potential malicious activity.

  - **Identify IP address and geographic location:** Investigate the source IP addresses for the OAuth downloads. Check if these IPs correspond to known proxies or geographic regions uncommon for the user, utilizing log details from Microsoft 365.

  - **Cross-reference with known indicators of compromise (IoCs):** Look for any files downloaded that are known IoCs or are linked to previous investigative findings within your organization.

  ### Prioritization

  This alert has a medium severity as it suggests potential unauthorized access to sensitive corporate data, carried out in a manner that may not fit typical user behavior. The likelihood of malicious abuse is moderate, as attackers commonly utilize OAuth applications to perform data exfiltration. However, the occurrence of false positives is possible if legitimate applications are misconfigured or overly broad in their permissions.

  ### Blind Spots and Assumptions

  Detection may be limited if not all OAuth applications are monitored or if relevant logs are not correctly configured in Microsoft 365. Additionally, legitimate activities—including automated data backup processes or bulk downloads by authorized personnel—can trigger this alert. A companion detection, such as monitoring for unusual API access patterns associated with the same user or OAuth app, would enhance contextual security monitoring.

