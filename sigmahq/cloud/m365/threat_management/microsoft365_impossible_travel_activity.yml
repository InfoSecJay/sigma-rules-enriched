note: |
  ### Technical Context

  This Sigma rule detects "impossible travel" activity within Microsoft 365, where a user is reported to have signed in from geographically distant locations in a timeframe that is not physically possible. This behavior often suggests account compromise, where an adversary is impersonating a legitimate user to gain unauthorized access to sensitive information. The relevant MITRE ATT&CK techniques include "Valid Accounts" (T1078) under the credential access tactic.

  Primary telemetry sources include Microsoft 365 Security logs, specifically those related to the SecurityComplianceCenter with event types indicating sign-in activities. If confirmed malicious, this behavior could lead to data exfiltration or unauthorized actions within the organization’s cloud environment. However, this detection alone does not confirm active credential theft; it merely indicates suspicious login patterns that warrant further investigation.

  ### Investigation Steps

  - **Check sign-in locations:** Review the sign-in logs for the user in Microsoft 365 via Security & Compliance Center. Look for `Event Name: 'UserLoggedIn'` and note the geographical locations of sign-ins to confirm if impossible travel is evident.

  - **Identify previous access locations:** Compare the current log-in location to prior sessions using the `Sign-in activity report`. Typical locations should cluster around the user's physical workspace; significant deviations could indicate malicious activity.

  - **Evaluate account activity:** Review the user's recent activities by checking the `Audit Logs` for any unusual permissions changes or unauthorized actions (Event ID 4624 for successful logins). Legitimate business travel should show location changes aligned with planned business events.

  - **Correlate with other alerts:** Cross-reference with other security alerts related to account access, such as alerts for credential theft or unusual user behavior. This can be done by reviewing Microsoft Sentinel or Defender reports for any additional concerning events related to the same account.

  - **Assess the importance of affected assets:** Determine if the affected account has access to critical assets or sensitive data. Higher criticality increases the urgency for immediate investigation.

  - **Document sign-in patterns:** Create a timeline of sign-in events for the user involved, noting any rapid succession of logins across distant locations. This can reinforce the likelihood of an account compromise.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on sensitive organizational data access. The likelihood of malicious abuse is significant, especially as compromised accounts are often weaponized in targeted attacks. The behavior detected is not common and can indicate a high-risk situation requiring immediate attention.

  ### Blind Spots and Assumptions

  Possible evasion techniques may include legitimate users utilizing VPNs to conceal actual locations, which could also trigger false positives. Reliable detection requires accurate and comprehensive logging configurations for all Microsoft 365 services. Additionally, users traveling for legitimate reasons may cause alerts, underlining the importance of employee travel logs. Related detections, such as "Suspicious sign-in alert" (T1078), can strengthen overall coverage by corroborating multiple suspicious login indicators.

