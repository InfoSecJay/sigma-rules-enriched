note: |
  ### Technical Context
  This detection rule is designed to identify "Impossible Travel" activities reported by Microsoft Cloud App Security, where a user has logged into their Microsoft 365 account from two geographically distant locations in an implausibly short time span. This behavior often indicates account compromise, where an attacker may be using stolen credentials to access sensitive data or perform unauthorized activities across multiple locations in a very short time frame.

  The threat scenario often involves a malicious actor gaining access to a user’s credentials through phishing, credential dumping, or brute force attacks, subsequently attempting to access corporate resources from different locations. The attacker’s objectives typically include data exfiltration, lateral movement, or gaining elevated privileges within the environment.

  Relevant MITRE ATT&CK techniques include:
  - **T1078**: Valid Accounts - using legitimate credentials to bypass security controls.

  Primary data sources that will contain the best evidence of these activities include:
  - Security logs from Microsoft 365 (Azure AD sign-in logs).
  - Usage audits from Microsoft Cloud App Security.
  - VPN logs, if remote access was involved.

  ### Investigation Steps
  - **Review Azure AD Sign-in Logs**: Check for sign-ins that originate from different geographical locations within a short time frame, especially for the same user account.
  - **Analyze Microsoft Cloud App Security Alerts**: Look for alerts specifically related to 'Impossible travel activity' and correlate them with other suspicious activity around the same time.
  - **Inspect Account Activity**: Monitor for any unusual activities associated with the user account, such as changes to account settings, new application authorizations, or access to sensitive resources.
  - **Investigate Related Access Patterns**: Review VPN, proxy, and firewall logs for additional sign-ins or access that could indicate lateral movement from suspicious locations or devices.

  ### Prioritization
  This alert should be treated with medium priority in an enterprise environment, given that impossible travel activities can indicate potential account compromise with varying degrees of impact on data security and availability. As remote access is common, false positives may arise; however, the urgency to investigate remains significant when valid threats are considered.

  ### Blind Spots and Assumptions
  The detection logic may not cover all instances of impossible travel, as it relies on accurate event capture from Microsoft Cloud App Security. Assumptions include the reliability of geolocation technology to accurately flag discrepancies in user locations. Required logs for this alert to function appropriately include Azure AD sign-in logs and events from Microsoft Cloud App Security, which must be enabled and correctly configured across the organization.

