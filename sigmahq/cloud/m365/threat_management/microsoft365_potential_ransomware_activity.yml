note: |
  ### Technical Context

  This Sigma rule detects incidents when a user uploads files to a Microsoft 365 cloud environment that have been flagged by Microsoft Cloud App Security as potentially infected with ransomware. The likely attacker objective is to deploy ransomware payloads to essential documents or backup files to disrupt business operations and demand a ransom for decryption. The relevant MITRE ATT&CK tactic is **Impact** and the technique is **Ransomware** (T1486). The primary telemetry source is the Microsoft 365 Security Compliance Center with required log types as Security events indicating potential malware activity.

  If malicious, this behavior can lead to data loss, operational disruption, and potential financial impact. Importantly, this detection does NOT confirm that a successful ransomware attack has occurred; it merely indicates the presence of potentially malicious uploads.

  ### Investigation Steps

  - **Identify the user and upload actions:** Collect Microsoft 365 Security event logs (Event ID related to `Potential ransomware activity`) to confirm which user uploaded the flagged files. Pay attention to the file types and sizes. In benign cases, these might be typical office files like `.docx` or `.xlsx`.

  - **Assess the uploaded files:** Review the specific files flagged for potential ransomware activity. Cross-reference hashes of these files against an established malware repository to identify known threats.

  - **Determine user context:** Analyze the user's historical activity and roles via Azure Active Directory logs for any suspicious behaviors (e.g., audit logs for unusual login locations or failed login attempts). Your focus should be on users with administrative permissions or those in sensitive departments as higher risk.

  - **Validate remediation actions:** Check if there were any actions taken post-alert (like an attempt to delete or modify flagged files) by analyzing audit logs for file operations (Event ID 4663). Remediation efforts might indicate a user's awareness of potential issues, contrasting with malicious intent.

  - **Contextualize with other alerts:** Cross-reference with additional alerts in Microsoft 365 Defender that may indicate ongoing malicious activity, like unusual account behavior or abnormal file access patterns.

  ### Prioritization

  This alert carries medium severity as it involves potential ransomware activity, which could fundamentally disrupt operations if not contained. The likelihood of malicious abuse is moderate given the prevalence of ransomware attacks in cloud environments, and this specific activity pattern is increasingly weaponized by attackers.

  ### Blind Spots and Assumptions

  Limitations may arise from users interacting with legitimate files that exhibit ransomware-like characteristics (e.g., compressed files often misidentified). Reliable detection demands proper configuration of Microsoft Cloud App Security policies, and absence of logs may obscure legitimate use cases, such as users uploading large datasets for analysis. A companion detection to consider is the identification of unusual file access patterns (such as simultaneous access from multiple users or rapid file download activities) to strengthen the investigation context.

