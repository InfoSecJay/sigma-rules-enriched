  ### Technical Context

  This Sigma rule detects potential ransomware activity by identifying when a user uploads files to a Microsoft Cloud service, specifically flagged by Microsoft Cloud App Security as likely infected with ransomware. The likely attacker objective is to leverage cloud storage to maintain and execute ransomware payloads, potentially leading to data exfiltration or encryption of critical enterprise data. This behavior aligns with the MITRE ATT&CK tactic of **Impact** (TA0020), specifically technique **Data Encrypted for Impact** (T1486).

  The primary telemetry source for this alert is the Microsoft 365 Security Compliance Center, focusing on event logs that indicate file uploads. If this detection represents malicious activity, it can significantly impact an organization by compromising sensitive data. However, this detection does NOT confirm that ransomware has executed or successfully encrypted files without further corroborating evidence.

  ---

  ### Investigation Steps

  - **Review event details for uploads:** Examine Security logs in the Microsoft 365 Security Compliance Center, specifically focusing on eventName: "Potential ransomware activity” where the status is "success." Note the user accounts and file names involved.

  - **Identify the files involved:** Check the hash values and file types of the uploaded files. Ransomware typically involves executable files or unusual file types (e.g., .exe, .vbs). Compare against known ransomware signatures if available.

  - **Evaluate user behavior:** Cross-reference the behavior with user activity logs (e.g., Azure Active Directory sign-in logs). Assess if the user account is atypical for file uploads, indicating potential compromise.

  - **Confirm legitimate uploads:** Look for patterns in uploaded files from the same user or other users. Routine legitimate activity may include common business documents (e.g., .docx, .xlsx) and could follow predefined naming conventions.

  - **Search for correlated alerts:** Query the logging platform for any additional alerts on the same user, especially focused on consecutive uploads or unusual outbound network traffic that could indicate data exfiltration.

  - **Assess file sharing permissions:** Use Microsoft 365 Admin logs to check if the uploaded files have been shared externally post-upload, as this may indicate an intent to propagate malware or exfiltrate sensitive data.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on organizational data integrity and confidentiality. While the likelihood of malicious abuse is significant, actual ransomware execution requires additional context. However, this behavior may indicate an ongoing or prelude malicious activity, warranting close scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the reliance on accurate categorization by Microsoft Cloud App Security, which might miss certain benign file uploads stemming from users engaging in normal business activities. Required log sources include comprehensive Microsoft 365 audit logs, configured correctly to avoid gaps in data collection. Legitimate activities, such as routine file uploads by users for collaboration, may trigger this alert. A related detection worth considering is monitoring for unusual file sharing behavior following uploads, which can indicate malicious intent.

