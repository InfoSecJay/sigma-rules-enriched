note: |
  ### Technical Context
  This detection rule identifies instances where a user has deleted an unusually large volume of files within Microsoft 365, as reported by Microsoft Cloud App Security. The primary threat scenario involves potential insider threats or compromised accounts where an adversary aims to exfiltrate, cover up, or destroy sensitive data. By evaluating the volume and frequency of deletion events, security teams can pinpoint possible malicious activities, such as data loss, which may be indicative of a larger breach or data sabotage.

  Relevant MITRE ATT&CK tactics include **Impact (TA0040)**, specifically technique **Data Manipulation (T1485)**, which focuses on the manipulation or destruction of data assets to disrupt operational continuity. Tracking these deletion events can assist in understanding and mitigating the risks associated with whether data is improperly managed or deleted without authorization.

  The primary data sources for this detection include logs from Microsoft 365 Security and Compliance Center, where file activity, including deletions, is logged. These logs provide critical visibility into user behavior, allowing security operations teams to investigate any anomalies effectively.

  ### Investigation Steps
  - **Review User Activity Logs:** Check user activity logs in Microsoft 365 to correlate the deletion events with any other suspicious behaviors or failed login attempts, which may indicate compromise.
  - **Analyze Deletion Patterns:** Assess the frequency and timing of the file deletion events to identify whether they are part of a usual pattern for the user or an anomaly that stands out.
  - **Cross-reference File Ownership:** Identify which files were deleted and who owned them. Look for patterns suggesting that sensitive files belonging to multiple users are being targeted.
  - **Validate External Access:** Investigate any recent external access to the affected accounts, such as logins from unfamiliar IP addresses or locations, to rule out unauthorized access.

  ### Prioritization
  The alert is considered medium severity due to the potential impact on data integrity and business operations, as a large volume of file deletions could signify either a malicious insider threat or compromised credentials. The likelihood of this behavior being indicative of actual malicious intent is increased when paired with other red flags in user behavior.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if logs from the Security Compliance Center are not properly retained or if the monitoring configurations do not capture anomalies in user behavior accurately. The detection logic assumes that the baseline for "unusual volume" is effectively defined within the environment, which may require fine-tuning as user behavior evolves. Additionally, continuous access to relevant logs, especially regarding file activity, is essential for the detection to function as intended.

