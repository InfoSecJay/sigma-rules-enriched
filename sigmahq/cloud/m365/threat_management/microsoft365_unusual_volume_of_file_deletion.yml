  ---

  ### Technical Context

  This Sigma rule detects an unusual volume of file deletions in a Microsoft 365 environment reported by Microsoft Cloud App Security. The behavior indicates potential data exfiltration or insider threat, where an attacker or an insider may attempt to remove sensitive files to hinder investigations or evade discovery. Relevant MITRE ATT&CK tactics include Impact (TA0002) and Data Destruction (T1485). The primary telemetry source comprises SecurityComplianceCenter logs capturing file activity, specifically focusing on events related to file deletions. If confirmed malicious, this activity could lead to significant data loss or compromise of sensitive information. Importantly, this detection does NOT confirm intent, as legitimate users may also delete large volumes of files during maintenance or clean-up activities.

  ---

  ### Investigation Steps

  - **Check for alert details:** Review the alert details within Microsoft Cloud App Security for timestamps, user accounts, and the specific number of files deleted. Document any corresponding user activities or contextual information within the user audit logs.

  - **Correlate log events:** Query the SecurityComplianceCenter logs for Event ID associated with file deletions within the specified timeframe. Compare against typical user behavior to identify anomalies (e.g., a standard user deleting hundreds of files in a single session).

  - **Review user permissions:** Examine user roles and permissions in Microsoft 365 to determine if the user had appropriate access to delete the reported volume of files. Look for any recent changes in permissions that may indicate a potential security risk.

  - **Identify high-confidence indicators:** Look for any attempts to delete specific file types, such as sensitive documents (.docx, .xlsx) or configuration files. Cross-reference deleted files with known sensitive data repositories or project files.

  - **Investigate ancillary activities:** Validate whether the user engaged in legitimate activities just prior to the deletions, such as completing a file audit or cleaning up old files. Check similar users' behaviors for normalization in daily or weekly activity patterns.

  - **Determine asset criticality:** Assess the environment and criticality of the affected assets, provided that the deleted files belong to high-value projects or contain sensitive information. Report these findings to the response team for potential escalation.

  ---

  ### Prioritization

  The severity of this alert is medium due to the possibility of significant data loss in the event of malicious intent. There is a moderate likelihood that this behavior is abused, especially if it coincides with new user accounts or recently escalated privileges. This behavior has historically been weaponized by insiders and external adversaries alike.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for high false positives, especially in organizations with routine file clean-ups. The required logs must be properly configured to ensure all file deletion activities are captured. Legitimate activities that may trigger this alert include batch file deletions during migrations or system clean-ups. A related detection worth monitoring is anomalous file access patterns prior to large deletions, which can indicate prep work for malicious intent.

