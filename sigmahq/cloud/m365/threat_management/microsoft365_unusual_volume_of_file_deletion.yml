  ### Technical Context

  This Sigma rule detects an unusual volume of file deletion events within Microsoft 365, specifically flagged by Microsoft Cloud App Security. The likely attacker objective behind this behavior is to remove traces of their activities, often associated with data exfiltration, sabotage, or insider threats. This aligns with the MITRE ATT&CK technique T1485: Data Destruction.

  The primary telemetry sources for this detection include Microsoft 365 security logs generated by the Security Compliance Center, particularly focusing on event names related to file deletion. If malicious, this behavior can have a significant impact, potentially resulting in data loss and disruption of business processes. However, this detection does NOT confirm malicious intent on its own, as legitimate users may also delete files for valid reasons, such as housekeeping or project completion.

  ---

  ### Investigation Steps

  - **Review deletion event details:** Examine SecurityComplianceCenter logs for Event Name: 'Unusual volume of file deletion' to identify which files were deleted, including timestamps and user accounts responsible. Compare against normal operational patterns.

  - **Validate user activity history:** Check the user's activity timeline via Microsoft 365 audit logs (Event ID: 4624 for logon events). Look for recent patterns indicating a high level of access to sensitive files prior to the deletions.

  - **Assess the number of deletions:** Determine the threshold for “unusual” by analyzing historical file deletion rates for similar roles or departments. Assess if the deletion count significantly deviates from normal behavior, which may reflect either benign or malicious intent.

  - **Identify high-confidence malicious indicators:** Look for any deletion activity coinciding with other suspicious behaviors, such as changes to sharing permissions or the presence of unusual IP addresses in sign-in logs (Azure AD sign-in logs, Event ID: 4624).

  - **Corroborate with legitimate activity:** Confirm whether the deletions align with legitimate business activities, like a project completion or user cleanup activity. Analyze usage patterns for files that were deleted, assessing if the deleted files were recently accessed by other users.

  - **Examine data retention policies:** Review Microsoft 365 data retention policies and compliance configurations to ascertain if deleted files fall under any archiving or compliance rules, as some deletions may occur under governed processes.

  ---

  ### Prioritization

  The alert has medium severity. The impact on affected systems can be substantial if critical or sensitive data is destroyed. If this behavior is displayed by irregular users or during off hours, it might suggest malicious intent and the likelihood of abuse is non-negligible, particularly in environments with sensitive data handling.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the accuracy of audit configuration; incomplete log retention can obscure comprehensive visibility into user actions. Legitimate housekeeping activities, such as periodic file clean-up by IT staff, may trigger the alert. A related detection involving abnormal file access patterns could strengthen coverage and provide context around file deletion activities.

