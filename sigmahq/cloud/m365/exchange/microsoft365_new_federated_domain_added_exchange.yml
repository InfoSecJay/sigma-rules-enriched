note: |
  ### Technical Context
  This rule detects the addition of a new Federated Domain within Microsoft Exchange. The creation of a federated domain allows for external identities to authenticate and access resources within an organization, which can be exploited by malicious actors to facilitate unauthorized access or establish persistent backdoors. Attackers may utilize such news domains to utilize federated credentials in order to bypass normal authentication controls, leading to potential escalation or lateral movement within the environment. Understanding the potential for misuse, this detection rule aims to identify such changes to mitigate associated risks.

  The relevant MITRE ATT&CK tactics for this activity include **Persistence** (TA0003) and the technique **Domain Fronting for Resource Access** (T1136.003), which involves adding domains that may be used to commandeer user credentials or perform man-in-the-middle attacks. The primary data sources for accurate detection include Exchange event logs that capture changes to federated domains, specifically events related to the `Add-FederatedDomain` action.

  ### Investigation Steps
  - **Review Exchange Logs**: Analyze the Exchange event logs for entries associated with the `Add-FederatedDomain` event, paying attention to the timing and involved accounts to ascertain the legitimacy of the change.

  - **Investigate Source Accounts**: Examine the account that initiated the addition of the federated domain. Look for any unusual activity or prior alerts associated with that account that could indicate compromised credentials or insider threats.

  - **Audit Existing Federation Configuration**: Check the configuration of already existing federated domains for anomalies or signs of unauthorized changes which could suggest a potential backdoor.

  - **Cross-reference with User Activity**: Validate the changes against historical user behavior. Check if there were any significant indicators of compromise leading up to the event, such as unusual access patterns or high volume administrative tasks.

  ### Prioritization
  This alert's medium severity is justified due to its potential impact on the organization’s security posture. Although not all additions of federated domains are malicious, each instance could signify a major risk, particularly when associated with suspicious accounts or patterns indicating potential abuse.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise if logging within Microsoft Exchange is not comprehensive or if auditing configurations are not correctly set up to capture all `Add-FederatedDomain` events. The detection logic assumes that the account initiating the domain addition has previously exhibited normal behavior and that proper logging configuration is in place to capture relevant events. Without adequate audit logs for Exchange or if certain administrative actions are omitted from logging, detection and subsequent investigation could be compromised.

