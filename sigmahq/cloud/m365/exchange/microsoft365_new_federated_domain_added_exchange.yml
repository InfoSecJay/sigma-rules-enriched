  ### Technical Context

  This Sigma rule detects the successful addition of a new federated domain in Exchange Online, which may indicate attempts to establish unauthorized trust relationships for authentication via federated identities. The likely attacker objective is to enable credential abuse through federation, often as part of a broader campaign targeting Microsoft 365 and other cloud services using techniques such as Golden SAML (attacks leveraging federated authentication). Relevant MITRE ATT&CK tactics include Persistence and associated technique T1136.003 (Create Account – Federated Domain).

  Primary telemetry sources include Microsoft 365 Exchange logs, specifically logs generated during actions categorized under the event name 'Add-FederatedDomain'. The security impact of this activity can be significant, as it may allow attackers to hijack user sessions or impersonate legitimate users. This detection does not confirm an active compromise on its own, as the addition of new federated domains can occur during legitimate administrative changes.

  ### Investigation Steps

  - **Verify associated user account activity:** Check the user account that performed the 'Add-FederatedDomain' action in Exchange logs (Event ID: 3600) to determine if it is a standard administrative user. Benign accounts typically include helpdesk or IT admins, while unfamiliar accounts or unusual locations may indicate malicious intent.

  - **Check for concurrent suspicious logins:** Review Azure AD sign-in logs (Event ID: 4624) around the time of the event for any anomalous login attempts or patterns, such as failed logins followed by successful federation domain additions. Malicious behavior could show a spike in logins from unrecognized IP addresses.

  - **Audit prior federated domains:** Look for previous 'Add-FederatedDomain' entries using Exchange logs to track any potentially malicious patterns of domain additions. Legitimate administrative changes are usually documented or configured as organizational policy.

  - **Investigate linked cloud services:** Determine if the added federated domain connects to unauthorized or unknown cloud service providers. Check Azure AD B2B settings and permissions to confirm proper business affiliations. An unauthorized domain could mean a high-confidence malicious indicator for credential theft.

  - **Confirm logging settings are appropriately configured:** Ensure Exchange and Azure logs are enabled and configured to capture events detailing domain federation changes. Missing logs may indicate a gap in monitoring, allowing malicious activities to go unnoticed.

  ### Prioritization

  The severity of this alert is medium due to the potential security implications of an unauthorized federated domain within a Microsoft 365 environment. Given the likelihood of credential abuse through this technique, timely investigation is crucial as federated domain addition is a favored tactic among sophisticated adversaries.

  ### Blind Spots and Assumptions

  This detection may encounter limitations if logging for domain federation changes is not properly configured in Exchange. Attackers may utilize legitimate administrative accounts to add federated domains, masking malicious intent. Additionally, benign actions may occur during scheduled maintenance or organizational changes. Related detections include monitoring for unusual Azure AD sign-in events or successful domain federation modifications, which can provide comprehensive coverage of potential abuses.

