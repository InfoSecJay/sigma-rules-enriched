title: Suspicious Email Delivered In Microsoft 365
id: 3569aefd-e535-4391-8c18-24bd01a21eaf
status: experimental
description: |
  Detects instances where an email, identified as malicious or suspicious by the Microsoft Defender for Office 365 (formerly ATP) engine, was delivered to a user's Inbox or Junk folder.
  It might indicate that a potential threat, such as a spearphishing attachment or links, has bypassed initial blocking mechanisms and reached an end-user, requiring further investigation and potential remediation.
references:
- https://learn.microsoft.com/en-us/defender-office-365/threat-explorer-real-time-detections-about
- https://research.splunk.com/cloud/605cc93a-70e4-4ee3-9a3d-1a62e8c9b6c2/
- https://github.com/Bert-JanP/Hunting-Queries-Detection-Rules/blob/e7250648cb16d4a497ae8737943bf010ea96d2e6/Defender%20For%20Cloud%20Apps/MaliciousEmailDeliveredInMailbox.md
author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
date: 2026-01-27
tags:
- attack.initial-access
- attack.t1566.001
- attack.t1566.002
logsource:
  service: audit
  product: m365
detection:
  selection:
    Workload: 'ThreatIntelligence'
    Operation: 'TIMailData'
    Directionality: 'Inbound'
  filter_main_blocked:
    DeliveryAction: 'Blocked'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where emails flagged as malicious or suspicious by Microsoft Defender for Office 365 are delivered to a user's Inbox or Junk folder. The attacker objective is likely to deliver phishing attempts, such as spearphishing with attachments or malicious links, that may lead to credential theft or malware infection. This behavior aligns with the MITRE ATT&CK tactic "Initial Access" (TA0001) and techniques "Spear Phishing Attachment" (T1566.001) and "Spear Phishing Link" (T1566.002). The primary telemetry source is Microsoft 365 audit logs, specifically tracking the email delivery actions within the Threat Intelligence workload. If malicious, this delivery could lead to compromised user accounts and internal systems. Importantly, this detection does NOT confirm that the user interacted with or was successfully phished by the email.

  ### Investigation Steps

  - **Review email delivery logs**: Investigate Microsoft 365 Audit Logs (Event ID: 50000) for details regarding the delivered email, including sender, subject line, and timestamp. Look for high-risk sender domains or blacklisted URLs.

  - **Analyze email content**: Inspect the message content of the suspicious email for known malicious attachments or phishing links. Check if URLs have been flagged in threat intelligence databases.

  - **Identify legitimate behavior indicators**: Determine if similar emails from trusted contacts have been received recently by the user. This includes safe communication patterns and emails from known colleagues, which may validate expected interactions.

  - **Cross-reference threat intelligence**: Use threat intelligence feeds to identify any reported indicators related to the sender or email content that align with known phishing campaigns or malicious activity.

  - **Assess user activity**: Review the user's recent activity logs (Microsoft 365 Activity Logs) within the past 24 hours to identify any actions taken on the suspicious email, such as opening or forwarding, which could indicate a potential compromise.

  - **Check for additional alerts**: Investigate if this alert is a part of a broader sequence by correlating with other detection signals, such as unusual login attempts or other suspicious emails flagged within the same timeframe.

  ### Prioritization

  The alert is medium severity due to the potential impact on user accounts and sensitive data if the email is malicious. The likelihood of abuse is moderate, given the weaponization of phishing techniques in today's threat landscape and the prevalence of initial access through email.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Microsoft 365 audit logging; ensure that delivery actions are fully enabled to capture all relevant events. Legitimate activities, such as auto-forwarding rules or bulk communications to users, may occasionally trigger this alert. Companion detections to consider include alerts for unusual email access or abnormal login behavior that could indicate exploitation following successful delivery.

