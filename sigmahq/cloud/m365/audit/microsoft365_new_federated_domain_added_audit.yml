  ---

  ### Technical Context

  This rule detects the addition of a new federated domain in Microsoft 365, which could indicate an attacker attempting to establish a foothold or backdoor access via federated identity manipulation. The likely objective of the attacker is to gain unauthorized access to resources and accounts by creating a new domain that enables federation with external identities. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (T1484) and the technique of Domain Fronting (T1484.002).

  Primary telemetry sources for this detection include Microsoft 365 audit logs that capture administrative operations. If malicious, this behavior can lead to unauthorized access and privilege escalation, posing a significant risk to the enterprise's security posture. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative actions may also result in the creation of new federated domains.

  ---

  ### Investigation Steps

  - **Assess the audit logs**: Review Microsoft 365 audit logs (Event ID: 4672) for entries related to “Operation” and confirm the context of the federated domain addition, including the user who performed the action and the timestamp. Cross-reference with known administrative tasks.

  - **Verify user permissions**: Check user permissions for the account that created the federated domain. Ensure that the account is authorized to make such changes, especially if it is a non-administrative user.

  - **Identify domain details**: Investigate the newly added federated domain's characteristics, such as its origin, registrant details, and if it aligns with known business operations. Anomalous or unrecognized domains may indicate malicious activity.

  - **Monitor for subsequent behavior**: Look for any related activities in the Microsoft 365 logs within 72 hours following the domain addition. Specifically, track unauthorized logins or changes to user roles that involve the new domain.

  - **Contextualize with historical data**: Compare this event against historical data of domain changes in Microsoft 365 to identify any patterns. Legitimate additions should show a trail consistent with internal business activities and past operations.

  - **Review related alerts**: Analyze any companion alerts that indicate unauthorized access attempts or federated credential abuse (align with related detection ID: 42127bdd-9133-474f-a6f1-97b6c08a4339) to provide additional context to the alert.

  ---

  ### Prioritization

  This alert warrants medium severity due to its potential for exploitation in privilege escalation or unauthorized access. Given that federated domains can be weaponized for lateral movement or credential abuse, prompt investigation is essential, especially on critical systems.

  ---

  ### Blind Spots and Assumptions

  Common detection limitations include the possibility of legitimate administrative changes that can trigger the alert, thus requiring contextual analysis. The necessity for comprehensive audit log retention and proper access configurations is vital for reliable detection. Legitimate actions, such as the creation of a federated domain for a new partner company, can also mimic malicious behavior. Related detections that strengthen coverage include monitoring for anomalous logins or lateral movement attempts following the domain addition.

