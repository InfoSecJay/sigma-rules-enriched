note: |
  ### Technical Context

  This rule detects the addition of new federated domains in Microsoft 365 environments. The behavior is often associated with adversaries attempting to expand their access by establishing a method of federated credential abuse, potentially serving as a backdoor for future attacks. The relevant MITRE ATT&CK tactic is “Defense Evasion” (TA0005) and the technique is “External Remote Services: Federated Identity” (T1484.002). Primary telemetry sources include Microsoft 365 Audit logs, specifically events related to domain management. If this behavior is malicious, it could enable unauthorized access to resources linked to the newly created domain. It is crucial to note that the detection of this event does NOT confirm malicious intent on its own, as legitimate business needs may require the creation of new federated domains.

  ### Investigation Steps

  - **Verify Event Sources:** Check Microsoft 365 Audit logs for Event ID 2001 (Audit Login) and Event ID 2004 (Domain Added) to confirm the occurrence and details of the new federated domain addition.

  - **Assess Contextual Details:** Analyze the attributes of the added domain including the "User ID," "Initiated by," and timestamps to identify any anomalous user behavior or patterns that deviate from normal operations.

  - **Identify Previous Activities:** Look for any recent suspicious activities or failed login attempts associated with the same user or administrative account (Event ID 4625 for failed logins), which may indicate potential credential compromise before the domain addition.

  - **Correlate with Other Alerts:** Review for related alerts around the same time the domain was added, such as unauthorized access attempts or anomalous geolocation in sign-ins, to build a comprehensive context of the incident.

  - **Confirm Legitimate Needs:** Identify whether the newly added domain aligns with known business processes or expansions. Check against a whitelist of approved federated domains to determine expected behavior.

  - **Examine for High-Confidence Malicious Indicators:** If the domain addition is part of a larger incident, correlate findings with any records of lateral movement observed in the environment, such as Event ID 4688 indicating suspicious process creation.

  ### Prioritization

  This alert should be categorized with medium severity. The potential impact on critical systems is high if the added domain facilitates unauthorized access. The likelihood of the observed behavior being malicious is notable, as adversaries commonly exploit federated systems to gain persistence or escalate privileges.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate administrative activities, like creating new domains for mergers or partnerships, may trigger this alert. To ensure reliable detection, full audit logging must be enabled in Microsoft 365, including the `Domain.Added` activities. Observing similar events in other cloud instances can indicate potential adversarial techniques, thus monitoring for abnormal patterns in cloud identity management logs could strengthen overall detection coverage.

