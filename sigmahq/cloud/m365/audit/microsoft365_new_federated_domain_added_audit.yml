note: |
  ### Technical Context
  This detection rule monitors for the addition of new Federated Domains within a Microsoft 365 environment, which can indicate potential malicious activity involving federated identities. Attackers may seek to add unauthorized federated domains as part of credential abuse or to establish a backdoor for accessing sensitive resources. The primary goal of such an attack could be to facilitate unauthorized access or lateral movement within the network by allowing compromised accounts to authenticate against additional domains.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and **Privilege Escalation** (TA0004), specifically the technique for "Access Token Manipulation" (T1484.002) as attackers may manipulate access tokens to assume identities tied to these new domains. The ideal telemetry for evidence includes audit logs specifically from Microsoft 365 that record domain-related operations, primarily focusing on changes to identity federation.

  ### Investigation Steps
  - **Review Audit Logs:** Examine Microsoft 365 audit logs for events related to domain additions. Look for entries that match the operation terms 'add' or 'new' and specifically reference 'domain'.
  - **Correlate User Activities:** Analyze the associated user accounts that initiated changes. Investigate any unusual or unexpected user behavior around the time of the domain addition, such as logins from unfamiliar locations or devices.
  - **Monitor Access Patterns:** Check for access attempts and tokens associated with the newly added federated domains. Pay attention to failed login attempts or access requests from anomalous sources.
  - **Assess Federated Domain Trust:** Evaluate any configurations or permissions granted to the new federated domain, ensuring they align with organizational policies and do not introduce vulnerabilities.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized domain additions that could facilitate credential theft or lateral movement within the enterprise. The likelihood of such actions increases in environments leveraging federated authentication, making it essential to monitor these changes closely.

  ### Blind Spots and Assumptions
  One key blind spot in this detection is the potential for legitimate administrative actions that may also trigger alerts, leading to false positives in detection. The rule assumes that all domain additions are conducted by legitimate users rather than automated processes or scripts. For this alert to function effectively, logging must be configured to ensure comprehensive audit coverage within Microsoft 365, capturing all relevant domain management events. Additionally, insufficient monitoring of user behavior could hinder the detection of legitimate threats.

