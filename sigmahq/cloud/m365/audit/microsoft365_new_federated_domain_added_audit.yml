note: |
  ### Technical Context

  This rule detects the addition of a new federated domain within an M365 environment, which may suggest unauthorized federated identity creations aimed at abusing credential access. A likely attacker objective could be to establish a backdoor for accessing resources or to facilitate lateral movement within the network. This behavior correlates with the MITRE ATT&CK technique for Privilege Escalation (T1484.002) and Defense Impairment.

  Primary telemetry sources include M365 audit logs focusing on operations related to domain management. If malicious, this activity could enable a threat actor to impersonate users or manipulate credential access. However, it is crucial to note that the mere addition of a new federated domain does not inherently indicate malicious activity without contextual analysis.

  ### Investigation Steps

  - **Review related audit logs:** Check M365 audit logs for Event ID reflecting domain management changes, focusing on fields such as `Operation` and `Target`. Look for anomalous patterns or timings inconsistent with normal domain management operations.

  - **Identify account changes:** Examine the user accounts associated with the newly added federated domain. Review details like `UserID` and `Operation` to see if any were added or modified by privileged accounts, indicating potential misuse of access rights.

  - **Analyze historical domain activity:** Assess prior additions or changes to federated domains from the same account. Unexpected frequency or patterns could suggest malicious attempts to establish multiple backdoors.

  - **Validate legitimate activities:** Confirm whether the addition corresponds with planned organizational changes or new partnerships. Cross-reference with communications from IT or relevant departments to ensure there is a valid business justification for the new domain creation.

  - **Monitor for subsequent access attempts:** Track any login attempts involving the new federated domain. Look for Event ID 4624 (logon) combined with unusual geolocation or authentication patterns, indicating potential credential abuse.

  - **Investigate domain trust relationships:** Review associated domain dependencies or trust relationships in the environment. Abnormal setups can signify an attempt to expand access beyond intended boundaries.

  ### Prioritization

  This alert is of medium severity, as the potential impact greatly hinges on the role of the affected system within the environment. The likelihood of abuse is significant, especially if the domain setup circumvents existing security measures. Such behaviors are known to be weaponized in targeted attacks, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics such as using legitimate accounts for domain additions or scripted automation to mask unauthorized changes. Furthermore, required audit log configurations must be enabled to ensure comprehensive monitoring of domain-related activities. Legitimate activities that may trigger this alert include corporate reorganizations or domain federations for bona fide business partnerships. A related detection that could enhance coverage is monitoring for unauthorized changes to user permissions within the M365 environment to detect escalation attempts linked to new federated identities.

