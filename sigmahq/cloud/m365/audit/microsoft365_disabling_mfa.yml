  ### Technical Context

  This Sigma rule detects activities related to the disabling of Multi-Factor Authentication (MFA) for user accounts, which is a critical security feature designed to protect accounts against unauthorized access. The likely attacker objective is to gain easier access to targeted accounts, making it simpler to bypass security measures and escalate privileges. The relevant MITRE ATT&CK tactics are Defense Evasion and Credential Access, specifically the technique ID T1556.006 (Modify Authentication Process).

  Primary telemetry sources include Microsoft 365 audit logs, specifically focusing on operations that indicate changes to authentication settings. If malicious, the security impact is significant, as disabling MFA exposes user accounts to higher risks of credential theft and unauthorized actions. It's important to note that this detection does NOT confirm malicious intent on its own, as it could be a legitimate administrative action.

  ### Investigation Steps

  - **Check for log details**: Review Microsoft 365 audit logs for Event IDs related to MFA changes, specifically searching for operations containing 'Disable Strong Authentication.' Focus on timestamps to correlate with user activity.

  - **Identify the user account involved**: Collect data for the user account that triggered the alert. Validate if it correlates with known administrators or service accounts, which might perform legitimate changes.

  - **Look for recent login activity**: Investigate the login history for the affected user account for any suspicious access attempts before or after the alert. Check for unusual geographic locations or devices using Event ID 4624 (logon event).

  - **Review related administrative actions**: Examine other administrative audit logs for related operations such as account alterations or privilege escalations around the same timeframe to indicate potential malicious workflows.

  - **Determine expected MFA settings**: Validate whether the organization has a policy on MFA configuration and if the disabled setting aligns with known operational practices. Confirm any scheduled maintenance or changes communicated previously.

  - **Identify high-confidence malicious indicators**: Look for additional alerts around the time of the operation that may indicate a compromised account, such as failed login attempts, or changes to other security settings, using relevant M365 APIs or logs.

  ### Prioritization

  This alert is considered high severity due to the critical nature of MFA in protecting user accounts and the significant probability that disabling it can lead to unauthorized access. The likelihood of malicious abuse is high, particularly in targeting high-value accounts, making this behavior a common tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques, such as insider threats or legitimate user actions, which can mislead initial assessments. Ensuring the completeness of audit log configurations is crucial for reliable detection. Legitimate administrative actions, including changes made during organizational policy updates or maintenance, may trigger the alert. A related detection that strengthens coverage is monitoring for unauthorized administrative access attempts, which would indicate an elevated risk of potential account compromise.

