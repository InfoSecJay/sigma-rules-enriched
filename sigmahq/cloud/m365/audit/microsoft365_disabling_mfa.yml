  ### Technical Context

  This Sigma rule detects the action of disabling Multi-Factor Authentication (MFA) within a Microsoft 365 environment. Attackers may disable MFA to facilitate unauthorized access to user accounts, as it reduces the security posture of the affected systems. The relevant MITRE ATT&CK tactics include Persistence (T1546), Credential Access (T1556), and Defense Evasion (T1563), specifically targeting the technique of Account Manipulation (T1556.006).

  The primary telemetry source is the Microsoft audit logs, specifically capturing audit events related to user and administrative actions. The security impact of a successful disabling of MFA could lead to unauthorized account access, which puts sensitive data at risk. It is important to note that this detection does not confirm whether the change was initiated by a legitimate user or is part of malicious activity without additional context.

  ### Investigation Steps

  - **Review Audit Logs for Disabling MFA Events:** Check Microsoft 365 audit logs for events with the operation "Disable Strong Authentication." Look for Event ID 4604 or equivalent, which indicates this specific change. Investigate the user account performing the action.

  - **Identify User Account Context:** Confirm if the user account that disabled MFA is assigned administrative privileges. If the account is a high-privilege admin account, this may indicate potential malicious activity.

  - **Correlate with Recent Login Activities:** Check for any unusual login activity (Event ID 4624) for the user account in the previous 30 minutes. Look for logins from unexpected geographic locations or foreign IP addresses.

  - **Cross-reference Legitimate Change Requests:** Validate the disabling of MFA against any existing change requests or tickets logged by the organization. If a legitimate change process was followed, this may be benign activity.

  - **Look for Follow-up Account Actions:** Investigate for subsequent account actions after disabling MFA, such as failed login attempts or suspicious access patterns (Event ID 4625). These can indicate that initial access was obtained maliciously.

  ### Prioritization

  This alert is high severity due to the potential risk it poses to account integrity and overall organizational security. The likelihood of exploitation is high, as disabling MFA is a common tactic employed by threat actors to gain easier access to sensitive resources. This behavior is frequently observed in credential theft and account takeover scenarios.

  ### Blind Spots and Assumptions

  Evasion techniques may include the legitimate user disabling MFA as part of a policy or administrative change, leading to false positives. Reliable detection requires comprehensive logging from Microsoft 365, and absence of such logging may hinder investigation. Regular administrative activities, such as user onboarding or policy updates, can inadvertently trigger this alert. A related detection that enhances coverage would be monitoring for unsuccessful login attempts following MFA changes, as it may indicate attempts to exploit disabled security measures.

