  ---

  ### Technical Context

  This rule detects the disabling of Multi-Factor Authentication (MFA) for user accounts in a Microsoft 365 environment. This behavior can be indicative of an attacker’s attempt to weaken account security, facilitating unauthorized access to sensitive data and systems. The likely objective of an attacker triggering this rule is to ensure easier access to compromised accounts or to prepare for later stages of an attack by removing an important security barrier.

  The relevant MITRE ATT&CK tactics involved are **Persistence** and **Credential Access** (Techniques: T1556.006). The primary telemetry source for this detection is Microsoft 365 audit logs, particularly focusing on entries related to the operation of disabling MFA. If malicious, disabling MFA can lead to severe security impacts, including unauthorized access and potential data breaches. However, this detection does NOT confirm that an unauthorized action has definitively taken place without further context confirming the attacker's identity.

  ---

  ### Investigation Steps

  - **Review audit logs for MFA changes**: Check Microsoft 365 audit logs (Event ID specific to MFA changes, e.g., 4880 for M365) to find "Disable Strong Authentication" operations. Look for timestamps that align with the alert.

  - **Identify user account status**: Verify the state of the user account associated with the MFA disable action. Confirm if it shows signs of compromise, such as suspicious logins or unusual activity preceding the operation.

  - **Cross-reference authentication history**: Look for recent authentications for the affected user account in Azure Active Directory sign-in logs (Log Type: Sign-in logs) for any unusual sign-ins that could suggest malicious activity leading up to the MFA change.

  - **Assess legitimate scenarios for MFA disablement**: Determine if there was an authorized administrative attempt to disable MFA, such as changing settings for service accounts or during user onboarding/offboarding processes. Check if any IT operations occurred around the alert time.

  - **Investigate related service account activity**: If the change was associated with a service or shared account, inspect the activity logs for any scheduled tasks or maintenance that might typically modify permissions or access rights.

  - **Note high-confidence malicious indicators**: If you find that the MFA disabling action was followed closely by suspicious login attempts or log entries from unusual locations, it indicates potential compromise. Event IDs from security logs (e.g., 4624 for successful authentication) should be heavily scrutinized.

  ---

  ### Prioritization

  This alert is high priority due to the risk posed by disabling MFA on critical accounts, especially in environments where sensitive data is handled. The likelihood of malicious abuse is significant, as the action directly impacts the security posture of the organization. Disabling MFA is a common tactic employed by adversaries to facilitate later stages of compromise.

  ---

  ### Blind Spots and Assumptions

  Detection could be evaded by legitimate administrators performing maintenance tasks or users disabling MFA as part of a known support procedure. Reliable detection requires comprehensive auditing settings in Microsoft 365 to ensure all MFA activities are logged. Legitimate activities that may trigger this alert include administrative actions related to onboarding or user management processes. A related detection to reinforce coverage is monitoring successful and failed login attempts across affected accounts to identify any patterns that may indicate a coordinated attack.

