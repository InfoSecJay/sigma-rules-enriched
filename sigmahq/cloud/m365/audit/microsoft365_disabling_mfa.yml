  ### Technical Context
  This detection rule identifies attempts to disable Multi-Factor Authentication (MFA) in Microsoft 365 environments. Disabling MFA is often a precursor to unauthorized access, enabling attackers to exploit stolen credentials and gain entry into sensitive systems without additional verification steps. Attackers may leverage such tactics after compromising user accounts or gaining elevated privileges, aiming to facilitate lateral movement or further credential access.

  The primary MITRE ATT&CK tactics applicable to this detection include **Persistence (TA0003)**, as disabling MFA can lead to long-term unauthorized access. Additionally, it falls under **Credential Access (TA0006)** since the lack of MFA simplifies the process of exploiting captured user credentials. The technique specifically referenced is **T1556.006: Abuse Elevation Control Mechanism**, which emphasizes malicious manipulation of account security settings.

  Data sources most relevant for this detection include audit logs from Microsoft 365, which specifically log operations related to security settings, such as MFA configurations and changes within the administrative console.

  ### Investigation Steps
  - **Review Audit Logs:** Collect and analyze audit logs from Microsoft 365 for any entries indicating when Multi-Factor Authentication was disabled. Look for unusual patterns or timing of changes.
  - **Identify User Activity:** Investigate user account activity leading up to the MFA change. Identify any recent sign-ins or account modifications that may suggest a compromised account or misuse of administrative privileges.
  - **Correlate with Alerts:** Cross-reference other security alerts in your environment, such as abnormal logins, failed MFA attempts, or changes to user roles that may align with the timeframe of the MFA disabling.
  - **Check for Policy Compliance:** Ensure that the actions taken comply with your organization's security policies. Investigate if legitimate administrative actions led to the change rather than malicious activity.

  ### Prioritization
  This alert is classified as high severity due to the significant risk it poses to account security and the potential for undetected data breaches. Disabling MFA can lead to unauthorized access and compromise sensitive information within the organization, making timely investigation critical.

  ### Blind Spots and Assumptions
  The detection logic may have blind spots regarding legitimate administrative actions where MFA is intentionally disabled for maintenance or updates. It assumes that the monitoring of audit logs is properly configured and that appropriate context helps distinguish between malicious and legitimate actions. It is essential to ensure that comprehensive logging is enabled in Microsoft 365 to capture all relevant security event changes for this alert to function effectively.

