note: |
  ### Technical Context

  This Sigma rule detects successful logins to the Microsoft Intune Company Portal, indicating potential bypass of Conditional Access Policies via tools like TokenSmith. The likely attacker objective is to gain unauthorized access to corporate resources or sensitive data by exploiting the trust relationship established with compliant devices in Intune. This behavior aligns with the MITRE ATT&CK technique for using valid accounts (T1078) under the tactics of privilege escalation, persistence, and initial access.

  Primary telemetry sources for this detection include Microsoft 365 audit logs, specifically the log type for user activity related to application access with the operation "UserLoggedIn". If this behavior is malicious, it can lead to unauthorized system access, data exfiltration, or persistence within the environment. However, a successful login detected by this rule does NOT confirm whether the actions taken post-login were malicious.

  ### Investigation Steps

  - **Review user login details: **Verify the user identity by checking the audit logs (Event ID: AzureADLogin, or relevant M365 audit logs) to ensure that the login event corresponds to a legitimate user’s account from an expected location and device type.

  - **Identify anomalous client application use: **Check if the login was performed using uncommon client applications or devices (rather than official corporate resources) by reviewing the AppName field in the Azure AD audit logs.

  - **Correlate with Conditional Access Policies: **Examine whether there are existing Conditional Access Policies that this login appears to bypass and investigate other related login events under the same user account in the last 30 days for patterns of suspicious authentication.

  - **Assess the login history: **Perform a historical comparison (e.g., last 90 days) of the user's login patterns to identify any unusual spike or changes in login behavior, looking for previously seen login intervals versus sudden changes.

  - **Evaluate response actions: **Determine whether any significant actions were taken following the login, such as device enrollment events (Event ID: AzureADDeviceRegistered) or data downloads (for example, from SharePoint or OneDrive) that could indicate data exfiltration.

  ### Prioritization

  This alert severity is high due to the potential for bypassing standard security controls, especially on high-impact systems managed through Intune. The likelihood of malicious abuse is significant, particularly if the login corresponds to known exploitation tools. Such behavior is not commonly benign and should be immediately investigated.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for adversaries to use legitimate credentials if valid user sessions are already established. Reliably detecting this alert requires complete audit logging from M365 with proper configurations to capture all authentication events. Legitimate activities, such as normal user logins from trusted locations or during scheduled maintenance, may trigger the alert. A related detection to consider is monitoring for anomalous user activity that follows a successful login to further assess the risk of account compromise.

