note: |
  ### Technical Context

  This rule detects successful logins to the Microsoft Intune Company Portal, which can potentially allow threat actors to bypass Conditional Access Policies and Intune device trust through tools like TokenSmith. The likely attacker objective is to gain unauthorized access to resources or sensitive data by circumventing established security measures. This behavior aligns with the MITRE ATT&CK tactic of "Initial Access" (TA0001) and the technique "Valid Accounts" (T1078).

  The primary telemetry source for this detection is audit logs from Microsoft 365, specifically looking for event entries related to successful user logins to Intune. If this behavior is malicious, it compromises the integrity of Conditional Access policies and allows potential exploitation of trusted devices. However, the detection does NOT confirm that a breach has occurred, as legitimate users might also trigger this rule if they log in through compromised means.

  ### Investigation Steps

  - **Review Azure AD logs for login details:** Check Azure Active Directory sign-in logs (Event ID 4624) for additional context around the user's IP address, session details, and any recent changes to their profile that could suggest account compromise.

  - **Correlate with other security events:** Look for related audit logs in Microsoft 365 for unusual activities, like changes to user roles or conditional access policies, which could indicate a broader attack vector being used in conjunction with the login.

  - **Assess recent user activity:** Examine the activity log for the logged-in user in the Intune portal to validate expected behavior, specifically looking for typical device registrations and user behavior consistent with legitimate activities.

  - **Identify any anomalies in device registration:** Check the Intune portal for any newly registered devices or abnormal device compliance states associated with the user, particularly entries that deviate from their normal usage patterns.

  - **Validate the authenticity of the login:** Use conditional access logs from Microsoft 365 to understand if the login was from a trusted location or device, and if any bypasses to the conditional access were triggered during the login.

  - **Evaluate user role and access levels:** Review directory role membership for the user by querying Azure AD to confirm that the account has not been escalated to higher roles without appropriate authorization, which might indicate malicious intent.

  ### Prioritization

  This alert carries a high severity due to the potential for significant impact on enterprise resources if an attacker successfully bypasses conditional access controls. The risk of malicious abuse is elevated given the direct method of circumventing security policies through the Intune Company Portal, a tactic that is considered increasingly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by reliance on the integrity of user credentials and the possibility of legitimate user actions causing false positives. Effective detection of this threat requires comprehensive logging configurations from Azure AD and Intune. Legitimate activities such as admin-initiated device enrollments may trigger similar alerts. A companion detection to consider is monitoring for failed login attempts (T1070) that could indicate brute-force attempts before a successful login via unauthorized tools.

