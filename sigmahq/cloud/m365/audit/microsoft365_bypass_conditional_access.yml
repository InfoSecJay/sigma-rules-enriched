note: |
  ### Technical Context
  This detection rule identifies successful logins to the Microsoft Intune Company Portal that may allow attackers to bypass Conditional Access Policies and device trust mechanisms. It specifically targets scenarios where a tool like TokenSmith is leveraged to manipulate authentication tokens, facilitating unauthorized access to sensitive resources. Attackers using such techniques typically aim to maintain persistence within a network, escalate privileges, or gain initial access by circumventing established security controls.

  The relevant MITRE ATT&CK tactics associated with this detection include:
  - **Initial Access (TA0001)**: Gaining a foothold in the environment.
  - **Privilege Escalation (TA0004)**: Gaining elevated access to resources that are normally protected from users.
  - **Defense Evasion (TA0005)**: Avoiding detection and protection mechanisms.

  Key data sources for detecting these behaviors include Microsoft 365 audit logs, particularly focusing on operations concerning user logins, which can reveal anomalies indicating potential misuse of authentication processes.

  ### Investigation Steps
  - **Review Audit Logs**: Examine Microsoft 365 audit logs for any occurrences of `UserLoggedIn` events associated with the ApplicationId `9ba1a5c7-f17a-4de9-a1f1-6178c8d51223`, filtering specifically for logins that succeeded unexpectedly or from unusual locations.
  - **Check for Conditional Access Events**: Investigate Conditional Access Policy logs to assess if the logged-in user typically requires certain conditions (such as multi-factor authentication) to access Intune. Look for discrepancies in their compliance status before and after the login event.
  - **Monitor for Unusual User Behavior**: Analyze the activities of users who successfully logged in, looking for signs of privileged account manipulation or unauthorized access to restricted resources that could stem from the successful use of TokenSmith or similar tools.
  - **Correlate User Logins with Token Requests**: If feasible, correlate the login events with any token requests that may appear in application logs, confirming whether standard security measures were circumvented during the authentication process.

  ### Prioritization
  This alert is classified as high severity due to its potential impact on the environment. The successful bypass of Conditional Access Policies poses a significant risk, as it allows unauthorized users to access sensitive resources and conduct further malicious activities within the network.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to variations in how the TokenSmith tool operates or other similar tools that accomplish login bypasses. The detection logic assumes that the identified ApplicationId correlates exclusively with the Microsoft Intune Company Portal, which may not hold true if new applications are introduced or configuration changes occur. Additionally, this rule relies on the availability of Microsoft 365 audit logs configured to capture all operations; if logging is incomplete or misconfigured, detections may be missed.

