note: |
  ### Technical Context
  This detection rule identifies user activities originating from IP addresses that have been deemed suspicious by Microsoft Threat Intelligence. Such IP addresses are often associated with malicious actions like botnet command and control (C&C) operations, which could indicate that a user account has been compromised and is being exploited by attackers. The objective of a malicious actor leveraging these IP addresses is typically to conduct data exfiltration, lateral movement, or to establish persistence within the organization's environment.

  In the context of the MITRE ATT&CK framework, this rule aligns with the "Command and Control" tactic (TA0011) and specifically the technique for **Application Layer Protocol** (T1573). By monitoring for these activities, security teams can quickly respond to potentially compromised accounts and mitigate any associated risks before further damage is done.

  Primary data sources for this detection include Microsoft Cloud App Security logs, particularly those related to user activities and security events, which can provide vital evidence regarding suspicious access patterns and anomalous user behavior.

  ### Investigation Steps
  - **Review Activity Logs:** Examine Microsoft Cloud App Security logs for additional context around the detected user activities, focusing on timestamps and associated actions to identify potential risks.
  - **Correlate with Known Threats:** Use threat intelligence platforms to correlate the IP addresses with known malicious IPs or threat actor indicators, determining if the activity aligns with established threat patterns.
  - **Analyze Account Behavior:** Investigate the accounts displaying activity from suspicious IPs for unusual access patterns, such as accessing critical systems outside normal hours or from atypical geographic locations.
  - **Cross-Check Endpoint Activity:** Look into EDR (Endpoint Detection and Response) logs for any suspicious processes or behaviors on endpoints linked to the affected user accounts to further identify any compromise.

  ### Prioritization
  The alert is of medium severity as it highlights potential signs of account compromise which could lead to significant security incidents. Rapid identification and investigation of such activities are crucial to prevent further exploitation or data loss.

  ### Blind Spots and Assumptions
  This detection may have blind spots related to unreported user activity from malicious IPs that are not captured by Microsoft Threat Intelligence. The assumption is that the activity from suspicious IP addresses directly correlates to compromised accounts, which may not always be the case—some legitimate business operations may erroneously trigger this alert. The functionality of this alert relies on having proper configurations and logging enabled within Microsoft Cloud App Security to capture relevant user activity and associated IP addresses effectively.

