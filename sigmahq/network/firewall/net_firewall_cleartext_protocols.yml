note: |
  ### Technical Context

  This Sigma rule detects the use of cleartext protocols for transmitting sensitive information over the network, specifically targeting common ports associated with non-encrypted traffic (e.g., HTTP, FTP, Telnet, etc.). The likely attacker objective is to capture unencrypted credentials, which may lead to account compromise and unauthorized access. This behavior aligns with the MITRE ATT&CK tactic **Credential Access** (TA0006) and technique **Credentials from Network Traffic** (T1040).

  The primary telemetry source for this detection is firewall logs, which capture network traffic flows and can identify connections made over specific ports associated with cleartext protocols. Malicious use of these protocols can expose sensitive information to adversaries, posing a significant security risk. It's important to note that this rule alone does not confirm malicious intent, as legitimate services may also utilize these ports for benign purposes.

  ### Investigation Steps

  - **Review firewall logs for specific connections:**
    Examine logs from the firewall (Event ID 114 or 5156) for any traffic on the specified ports (e.g., port 80, 21, or 23) that may indicate cleartext protocol usage. Check for unusually high outbound connections or unexpected sources.

  - **Investigate related user activity:**
    Check for recent user logins and activities associated with the endpoints showing cleartext traffic. Use account login logs (Event ID 4624) to correlate legitimate user behavior against detected alerts.

  - **Identify malicious traffic patterns:**
    Look for patterns such as repeated login attempts or connection attempts to sensitive services (e.g., FTP servers) using cleartext protocols. Correlate with known threat intelligence to identify if the connection aligns with known malicious IP addresses.

  - **Analyze application usage:**
    Investigate whether the applications generating this traffic are legitimate and intended to use cleartext protocols. Review application logs or process activity (Event ID 4688 for process creation) for context on the originating applications.

  - **Document and validate asset criticality:**
    Determine the context of the affected assets. If the connections are from critical systems or services, elevate the triage priority. Consider whether these systems should adhere to stricter communication protocols.

  ### Prioritization

  Alerts generated by this Sigma rule should be treated with moderate urgency, especially if sensitive systems are involved. Cleartext protocol usage can be a significant threat vector for credential theft, making the likelihood of malicious abuse high. Given that many organizations enforce policies against cleartext transmissions, this behavior is often indicative of a potential security lapse requiring immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate applications may occasionally utilize cleartext protocols under certain configurations. The effectiveness of this detection relies on accurate firewall logging configurations; without comprehensive logging, cleartext connections may go unnoticed. Activities from legacy systems or internal applications that are not transitioning to secure protocols might trigger false positives. A related detection includes monitoring for suspicious authentication attempts (e.g., Event ID 4776), which may corroborate against established connections on cleartext protocols.

