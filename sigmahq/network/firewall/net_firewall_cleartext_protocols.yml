note: |
  ### Technical Context
  This rule detects the use of cleartext protocols for transmitting usernames and credentials across networks. Such insecure communication channels expose sensitive information to interception by malicious actors, risking unauthorized access to systems and data. The primary threat scenario involves adversaries leveraging these protocols to eavesdrop on credentials, potentially leading to credential theft, lateral movement within networks, or other forms of credential-based attacks.

  Relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) through techniques such as **Network Sniffing** (T1040) and **Credential Dumping** (T1003). The lack of encryption in traffic can result in a critical vulnerability within an organization, particularly if administrative access or other sensitive operations rely on cleartext credentials.

  Primary data sources providing the best evidence include firewall logs to identify outbound traffic on cleartext ports (e.g., HTTP, FTP) as well as proxy logs that might log attempts to connect over these protocols.

  ### Investigation Steps
  - **Review Firewall Logs:** Check firewall logs for connections established over common cleartext ports, such as 80 (HTTP), 23 (Telnet), and 21 (FTP). Flag any unauthorized or unusual connections.

  - **Examine Proxy Logs:** Analyze proxy logs to identify outgoing requests sent over insecure protocols. Look for unencrypted credentials in HTTP headers or query strings.

  - **Analyze Network Traffic:** Utilize Network Detection and Response (NDR) tools to capture and examine traffic on the notable ports listed in the detection logic. Look for patterns of credential transmission.

  - **Evaluate Security Configuration:** Assess the security configurations for applications and services, ensuring they mandate encrypted channels (e.g., HTTPS, SFTP) for transmitting sensitive information. Verify if configurations have been periodically reviewed and updated.

  ### Prioritization
  The alert is considered **low severity** in an enterprise environment due to the frequency with which insecure protocols are deployed. However, the potential impact of credential compromise is significant, making it essential to address the underlying issue to mitigate future risks.

  ### Blind Spots and Assumptions
  Some gaps in detection coverage may arise from the difficulty in capturing encrypted traffic when secure methods (like VPNs) are employed without proper visibility tools. Additionally, the detection logic assumes that all relevant protocols are logged through the firewall; if any traffic does not pass through the firewall, it may go undetected. To ensure optimal detection capability, organizations should guarantee comprehensive firewall and proxy logging configurations across the network.

