  ---

  ### Technical Context

  This Sigma rule detects configurations indicating that a Cisco device has been deliberately shut down or modified to enter a different boot mode. This behavior typically reflects an attacker’s intent to disrupt service or manipulate device functionality, potentially resulting in denial of service to legitimate users. The relevant MITRE ATT&CK tactics and techniques include: **Impact (T1495)**, **Data Manipulation (T1529)**, and **Service Stop (T1565.001)**.

  Primary telemetry sources include Cisco AAA (Authentication, Authorization, and Accounting) logs, particularly looking for command entry related to system shutdown and boot mode modifications. If malicious, this activity may severely disrupt network operations and services. This detection does NOT confirm whether the action was executed maliciously; it could also stem from legitimate administrative activity.

  ---

  ### Investigation Steps

  - **Review AAA logs for shutdown commands**: Check Cisco AAA logs for entries containing keywords 'shutdown' or 'config-register 0x2100/0x2142'. Focus on Event IDs related to command executions. Identify the user accounts associated with these actions; legitimate administrators may rarely use these.

  - **Identify account owner and activity context**: Confirm the identity of the user who executed the commands and whether they had appropriate privileges during the time of the action. Cross-reference with known maintenance schedules and shift patterns.

  - **Check for concurrent administrative activity**: Investigate if there were other administrative commands executed around the same time as this shutdown command. Legitimate maintenance may include commands like 'reload' or device configuration adjustments.

  - **Evaluate the impact of device downtime**: Assess what services or applications depend on the affected Cisco device. Determine if the shutdown likely disrupted critical operations, indicating potential malicious intent.

  - **Look for patterns of command usage**: Create timelines of the user account involved in the shutdown commands. Frequent or unusual usage of shutdown or configuration commands could suggest compromise.

  - **Explore device logs for prior inconsistencies**: Inspect the configuration logs for prior unauthorized configuration changes or unusual behavior that may correlate with this event. Attackers may perform preparatory steps before executing a shutdown.

  ---

  ### Prioritization

  Given the potential impact on network functionality and the likelihood of service disruption, this alert should be treated with medium severity. If the action was initiated by an unauthorized user or a compromised account, the malicious potential is high, especially in environments where Cisco devices support mission-critical operations.

  ---

  ### Blind Spots and Assumptions

  This alert may not account for legitimate administrative activity, which can result in false positives. There can be limitations in visibility if AAA logging is not fully configured on all Cisco devices. Additionally, legitimate updates or configuration alterations could trigger the same log entries. A companion detection to strengthen coverage may include monitoring unauthorized access attempts or privileged account usage that precedes command execution.

