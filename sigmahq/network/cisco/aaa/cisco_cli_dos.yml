  ### Technical Context

  This Sigma rule detects commands in Cisco systems indicating an attempt to shut down the device or change its boot mode, notably `shutdown`, `config-register 0x2100`, or `config-register 0x2142`. Likely attacker objectives include disrupting service availability and crippling network infrastructure, fitting within the MITRE ATT&CK tactics of Impact (T1495) and Availability Impact (T1529). Primary telemetry sources are Cisco AAA logs, specifically log entries that capture command executions relating to device configurations.

  The security impact of malicious activity can lead to significant downtime and disruption of services, which can affect business operations. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrators may occasionally execute these commands.

  ### Investigation Steps

  - **Review command history logs**: Check Cisco AAA logs (Event ID: specific command logs) for any instances of "shutdown", "config-register 0x2100", or "config-register 0x2142". Compare against the expected behavior of the network team during maintenance hours.

  - **Identify the user account executing commands**: Validate the user identity by cross-referencing the command logs with AAA authentication logs (fields: username, timestamp). Look for accounts that are not commonly used for device maintenance.

  - **Investigate access patterns related to the command execution**: Examine related logs for unusual access times or locations that may indicate unauthorized access (fields: source IP, authentication timestamps).

  - **Check for concurrent suspicious activity**: Look for other alerting behaviors in the logs around the same timestamp (fields: command type, execution time) that may indicate coordinated attacks or unusual patterns.

  - **Determine if commands were executed via expected channels**: Ensure that commands were issued from known management stations or consoles. Any unexpected source may signal compromise.

  ### Prioritization

  This alert is considered medium severity due to the potential impact on critical network devices, with a high likelihood that malicious actors may leverage these commands to disrupt services. Such behavior is directly related to availability attacks, making it pertinent to respond quickly.

  ### Blind Spots and Assumptions

  This detection may be circumvented using automated scripts or legitimate administrator access, which can obfuscate unauthorized actions. Reliable detection requires proper configuration of logging for command executions within Cisco devices. Routine administrative activities during maintenance can trigger these alerts, thus necessitating contextual awareness. A related detection worth considering is alerting on abnormal configuration changes (e.g., unauthorized modifications to device settings) to strengthen detection coverage.

