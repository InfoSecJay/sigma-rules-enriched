note: |
  ### Technical Context

  This Sigma rule detects unauthorized access to Cisco devices where commands are executed to enumerate network information that isn’t typically stored in configuration files. The likely attacker objective is reconnaissance, aimed at gathering information about the network topology and services, which can be leveraged for further exploits or lateral movement. Relevant MITRE ATT&CK techniques include **Network Service Discovery (T1046)** and **Account Discovery (T1087)**.

  The primary telemetry sources for this detection are Cisco AAA (Authentication, Authorization, and Accounting) logs that capture command activities by users or processes. The security impact is significant if this data is accessed maliciously since it provides visibility into the network structure and active devices. Importantly, this detection does NOT confirm malicious intent on its own as such commands are also commonly executed by legitimate network administrators during routine troubleshooting.

  ### Investigation Steps

  - **Review command logs for unauthorized access:** Examine Cisco AAA logs (Event ID: 611) for any instances where commands such as `show cdp` or `show ip route` were executed by accounts that do not typically perform network discovery.

  - **Identify legitimate administrative behavior:** Cross-reference the command execution logs against expected user roles. Legitimate administrators may run these commands during maintenance or troubleshooting, particularly during incidents involving network issues.

  - **Check triple-check user accounts:** Look specifically for unusual user account activity, especially any generic or service accounts executing discovery commands, indicating possible unauthorized access or misuse.

  - **Assess context of command execution:** Investigate the timing and context of command execution, particularly during off-hours or coinciding with known incidents. High-confidence malicious indicators might include repeated execution of network enumeration commands from a user or system not historically associated with such activity.

  - **Correlate logs with network topology:** Use NetFlow or equivalent telemetry to validate if the commands align with observed network traffic patterns or inconsistencies suggesting probing or mapping efforts by potential attackers.

  - **Evaluate device vulnerability postures:** Catalog the type of commands executed relative to device criticality and vulnerability; commands such as `show version` may expose version info for exploitation by known vulnerabilities.

  ### Prioritization

  This alert severity is moderate, as network discovery behaviors may indicate initial reconnaissance attempts that could lead to further exploitation. The risk is elevated depending on the importance of the affected systems and the likelihood of being targeted, especially if the behavior deviates from typical patterns of network management.

  ### Blind Spots and Assumptions

  Detection is limited by the availability of complete and accurate Cisco AAA logging configurations; missing logs will hinder detection reliability. Legitimate administrative activity during authorized access windows may mistakenly trigger alerts if proper contextual data isn't considered. A related detection that strengthens coverage includes monitoring for unauthorized logins to Cisco devices (e.g., SSH login attempts) to catch potential threats before they execute discovery commands.

