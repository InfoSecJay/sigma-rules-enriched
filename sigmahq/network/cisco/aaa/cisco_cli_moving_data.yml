  ### Technical Context

  This rule detects the use of specific protocols and commands that may facilitate data transfer to or from Cisco devices, potentially indicating exfiltration or unauthorized configuration changes. The likely attacker objective could involve lateral movement within the network or establishing persistence by manipulating device configurations. Relevant MITRE ATT&CK tactics are Collection (T1056), Lateral Movement (T1075), and Exfiltration (T1041). Primary telemetry sources include Cisco AAA logs that capture authentication attempts and command execution logs.

  If malicious activity is confirmed, the security impact could be significant, potentially compromising network defenses or exposing sensitive configurations. This detection does NOT confirm that the activity is inherently unauthorized, as these commands may also be used legitimately during normal administrative operations.

  ### Investigation Steps

  - **Review command execution logs:** Analyze Cisco AAA logs for Event IDs related to command execution, focusing on keywords such as ‘tftp’, ‘rcp’, ‘puts’, ‘copy’, ‘configure replace’, and ‘archive tar’. Normal administrative changes should include time-stamped configurations with detailed user accounts.

  - **Correlate with user accounts:** Validate user accounts executing suspicious commands against known administrators. Look for anomalies such as unfamiliar accounts executing data transfer commands or unusual hours of activity.

  - **Identify high-risk destination IPs:** Examine the destination addresses included in the commands. Flag any transfers to external or unauthorized IPs using the `tftp` or `rcp` commands, which may indicate data exfiltration.

  - **Investigate system roles:** Determine the role of the affected Cisco device. For example, a router used for data transit should have minimal configuration changes, while a firewall may require routine updates. Unusual changes can indicate a compromise.

  - **Look for previous configurations:** Check for historical configuration changes associated with the impacted device over time. Legitimate behavior typically includes scheduled updates or management approvals documented in change management systems.

  ### Prioritization

  The severity of this alert is low to moderate, primarily depending on the criticality of the affected Cisco device and whether the commands were executed as part of rightful administrative tasks. However, the nature of the detected protocols suggests that they can be weaponized for lateral movement or exfiltration, warranting further investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations due to limited logging configurations, which might miss certain command executions or user activities. Legitimate administrative tasks, such as regular configuration backups, may inadvertently trigger the alert. An additional detection to consider is monitoring other command execution patterns within Cisco devices to strengthen coverage against unauthorized changes or data transfers.

