  ### Technical Context
  This rule detects configuration changes related to monitoring and packet capture on Cisco devices, specifically the setup or modification of monitor or span/rspan sessions. Attackers may leverage these configurations to intercept network traffic, which could allow them to capture sensitive data, such as credentials or session tokens. By using tools like a packet sniffer, an attacker can gain unauthorized access to communications within the network, leading to potential credential theft or further reconnaissance.

  The rule correlates with multiple MITRE ATT&CK tactics. Specifically, it pertains to **Credential Access (TA0006)** through techniques such as **Network Sniffing (T1040)**, where attackers passively gather valuable information from network traffic. It also aligns with **Discovery (TA0007)** tactics, as setting up a monitoring session can indicate malicious intent to surveil network communications.

  The primary data sources relevant to this detection rule include Cisco device logs, particularly from the Authentication, Authorization, and Accounting (AAA) subsystem, which would log events related to changes in monitoring configurations.

  ### Investigation Steps
  - **Review Cisco AAA Logs**: Query the AAA logs for entries related to 'monitor capture point', 'set span', or 'set rspan' to identify unauthorized changes or new configurations.
  - **Analyze Network Traffic**: Inspect network traffic flows for any signs of unusual packet capture activity or unexpected traffic redirection consistent with monitoring sessions.
  - **Verify Change Management Procedures**: Check against your organization's change management records to confirm whether the modifications were authorized and executed by legitimate personnel.
  - **Correlate with Endpoint Data**: Cross-reference any related EDR logs that might indicate tools commonly used for network sniffing activities being executed on endpoints.

  ### Prioritization
  This alert carries medium severity due to the potential impact of unauthorized traffic monitoring, which can lead to significant security breaches. However, consideration must be given to the likelihood of false positives from legitimate administrative activities.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of unauthorized monitoring setups if logging is incomplete or not configured to capture all relevant events. The detection logic assumes that any change made to monitoring configurations is potentially malicious, which may not always be the case, particularly if performed by authorized network administrators for legitimate troubleshooting. Sufficient logging of all administrative actions on Cisco devices is necessary for effective coverage, including detailed AAA logs that reflect monitoring configuration changes.

