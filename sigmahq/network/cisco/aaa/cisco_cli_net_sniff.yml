  ### Technical Context

  This Sigma rule detects instances where a monitor or span/rspan configuration is created or modified on Cisco network devices. The behavior being monitored is indicative of potential reconnaissance or credential access attempts, where an attacker aims to intercept or analyze network traffic. This activity links to the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique for Network Sniffing (T1040). The primary telemetry sources include Cisco AAA logs, which capture changes to monitoring and traffic mirroring configurations.

  If these configurations are malicious, the security impact could include the unauthorized collection of sensitive information, leading to potential data breaches. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also result in similar log entries.

  ### Investigation Steps

  - **Review configuration changes:** Examine Cisco AAA logs for Event IDs related to "monitor capture point," "set span," or "set rspan." Focus on the fields indicating the user and timestamp to assess if these changes align with administrative schedules.

  - **Identify user legitimacy:** Cross-reference the user making the configuration changes against known administrative accounts. Legitimate changes are typically performed by recognized IT staff during routine maintenance, while changes by unknown or suspicious accounts should raise red flags.

  - **Assess timing and volume of changes:** Look for rapid, successive changes to monitoring configurations within a short timeframe. Malicious actors might attempt multiple configurations to establish a foothold before expediting data collection.

  - **Examine network traffic and patterns:** If packet captures or netflow data are accessible, evaluate traffic patterns generated by the newly established spans. Legitimate spans may show common traffic like DHCP, but abnormal traffic patterns could indicate an active data exfiltration attempt.

  - **Check for historical anomalies:** Review previous configurations and monitoring setups. If similar changes have not been made recently in that environment, the current alterations could indicate nefarious activity—especially if occurring outside of standard operating hours.

  ### Prioritization

  This alert holds medium severity due to the potential impact on all systems routed through the modified monitoring configurations. While not every modification is malicious, the likelihood of abuse is moderate, given that network sniffing is a common tactic utilized by attackers to gain unauthorized access to credentials and sensitive data.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not correctly configured, as essential logs may be missing or insufficiently detailed. Legitimate activities such as network troubleshooting by admins can easily trigger this alert, necessitating careful validation. Companion detections, such as those monitoring for unusual access patterns to sensitive data or elevated privilege changes, can help strengthen overall coverage against malicious activities.

