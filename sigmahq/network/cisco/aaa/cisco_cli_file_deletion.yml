  ---

  ### Technical Context

  This Sigma rule detects file deletions from Cisco flash file systems, particularly using keywords like 'erase', 'delete', and 'format'. An attacker may seek to delete files to cover their tracks or maintain persistence by removing logs or important system files. This behavior aligns with the MITRE ATT&CK tactics and techniques of Defense Evasion (T1070.004) and Impact (T1561.001, T1561.002).

  The primary telemetry source for this detection is the AAA logs from Cisco devices, which record file management actions. If malicious, the impact could include loss of critical configurations, logs, or potential backdoors that an attacker might exploit later. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could cause similar log entries.

  ---

  ### Investigation Steps

  - **Verify the source of the event:** Check Cisco AAA logs, specifically Log Type: `delete`, `erase`, `format` commands under Event ID for file deletions. Look for the source IP of the connection to assess if it is a known trusted admin.

  - **Identify user context:** Review the user accounts associated with the file deletion commands in AAA logs. Legitimate administrative actions should show recognized usernames or service accounts, while unfamiliar accounts may warrant further investigation.

  - **Examine log file context:** Cross-reference if files deleted were system or operational logs. The absence of critical logs such as system configurations might indicate malicious intent, while common cleanup of space may occur during regular maintenance.

  - **Assess frequency of deletions:** Analyze the log entries for a high frequency or scheduled pattern of deletion events. Unusual spikes in deletions in a short timeframe might indicate malicious activity rather than standard admin practices.

  - **Review associated command history:** Investigate preceding or subsequent commands executed by the user. Context around deletions can clarify if the user was performing legitimate maintenance or if the actions align with typical attack workflows.

  ---

  ### Prioritization

  This alert holds medium severity due to the potential impact on system integrity and configuration. Deletion of critical files can indicate an adversary’s intent to disrupt operations or eliminate evidence of an intrusion. The likelihood of malicious abuse exists, especially in environments where file management is strictly monitored.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging levels on Cisco devices are insufficient or if AAA logs are not regularly monitored. An adversary could also employ non-standard deletion methods to evade detection. Legitimate administrative tasks, like routine file management or system clean-up, may trigger this alert. Companion detections may include monitoring for unauthorized access to AAA logs or unusual command usage patterns that show evidence of an attack.

