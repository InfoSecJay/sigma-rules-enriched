  ### Technical Context

  This Sigma rule detects file deletion events from the flash file systems on Cisco devices, focusing on actions like "erase," "delete," or "format." The likely adversary objective is to disrupt services by removing critical files or configurations, which fits into the MITRE ATT&CK tactic of Impact, specifically techniques T1561.001 (Data Destruction) and T1561.002 (Disk Structure Wrecking). The primary telemetry source is Cisco AAA logs, particularly focusing on event messages that signify file deletion activities.

  If the detected deletion is malicious, it could lead to significant disruptions in services, such as the inaccessibility of device configurations or critical dependencies. This detection does not confirm whether the file deletions were authorized or if they were directed by an authenticated user without malicious intent.

  ### Investigation Steps

  - **Verify the log details:** Check Cisco AAA logs for Event IDs showing file deletions. Look for messages containing the keywords "erase," "delete," or "format," specifically within the `msg` field for context.

  - **Assess recent configuration changes:** Investigate the timeline of events leading up to the delete operation by querying the last few commands executed by the user or admin. Look for patterns that might indicate preceding reconnaissance or an unusual sequence of commands.

  - **Correlate user identity and privileges:** Identify the user account associated with the file deletion by checking the AAA logs (`user` field). Validate if this user typically performs such actions or if this command was executed under unusual circumstances.

  - **Identify legitimate admin activity:** Review recent maintenance logs for the device to identify scheduled cleanup tasks or legitimate reasons for file deletions, ensuring they align with organizational policy for space management.

  - **Highlight indicators of compromise:** A lack of prior legitimate activity or

  repeated deletions without justification by a system administrator may indicate potential malicious actions. Document any such patterns as high-confidence indicators.

  ### Prioritization

  The severity of this alert is medium, given that while it can indicate a potentially malicious file deletion, not all file deletions are harmful, especially if done by authorized administrators for maintenance purposes. However, the potential impact on affected critical systems makes it essential to assess context and legitimacy.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log all deletion events or by log retention policies that prevent access to needed historical data. Legitimate admin activities such as regular flash memory maintenance could trigger this alert, making context vital for analysis. Related detection of unauthorized access to configuration files (e.g., tracking command executions prior to deletions) can enhance overall coverage and threat visibility.

