  ### Technical Context

  This Sigma rule detects file deletion actions within Cisco devices, specifically focusing on commands like "erase," "delete," and "format" executed on flash file systems. The likely attacker objective is to destroy evidence of prior malicious activity or hinder incident response efforts, aligning with the MITRE ATT&CK techniques for Data Destruction (T1561) and Indicator Removal on Host (T1070.004). The primary telemetry source is Cisco AAA logs, which track authentication and authorization attempts, including commands executed on the device.

  If malicious, this behavior could severely impact system integrity and availability, especially if critical configuration files or logs are deleted. However, it's important to note that this detection does NOT confirm malicious intent on its own, as file deletions can also be part of legitimate administrative tasks.

  ### Investigation Steps

  - **Identify the command context:** Review Cisco AAA logs (Event ID specific to command executions) for "erase", "delete", or "format" commands. Check the user and timestamp to establish legitimacy.

  - **Determine the user role:** Validate if the user executing the deletion is an authorized administrator or a user with elevated privileges. Legitimate admin commands are usually flagged for necessary routine maintenance.

  - **Assess frequency and volume of deletions:** Analyze log entries around the time of the alert to determine if multiple deletion commands were issued in quick succession, which is characteristic of malicious behavior aiming to wipe evidence.

  - **Correlate with previous activity:** Investigate preceding log entries to identify any suspicious user behavior patterns. Cross-reference with access logs for signs of unauthorized access or reconnaissance.

  - **Verify system impact:** Check the current state of the flash file system using the 'show flash' command to ascertain what files were deleted and evaluate if any critical system files or configurations are missing.

  - **Review relevant historical actions:** Look for associated detections of unusual configuration changes or access patterns prior to the deletions which may indicate an ongoing attack lifecycle focused on data destruction.

  ### Prioritization

  This alert should be considered of medium severity as it indicates potential data destruction on critical network devices. The likelihood of malicious abuse is moderate given the nature of the commands involved, and while not universally weaponized, it is a common action undertaken by attackers to cover tracks after compromising systems.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through legitimate administrative maintenance tasks that also involve file deletion. The need for properly configured AAA logs is critical; without them, detection may be unreliable. Legitimate activities such as routine system updates or hardware upgrades may trigger this alert. A companion detection to consider includes monitoring for unauthorized changes to configuration files, which would enhance visibility into possible prelude activity to the deletions.

