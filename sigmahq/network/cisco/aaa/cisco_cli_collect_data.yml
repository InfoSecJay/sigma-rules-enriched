  ### Technical Context
  This detection rule identifies commands executed on Cisco devices designed to collect configuration data, specifically leveraging commands like `show running-config`, `show startup-config`, and similar. These commands reveal system configurations, interfaces, and network settings that could be instrumental in planning a subsequent attack or exploit. Attackers may use this information to understand the network topology, identify vulnerabilities, or establish lateral movement paths within the infrastructure.

  The primary objectives of attackers leveraging these commands include reconnaissance to gather detailed information on the target's configuration and to exploit any identified weaknesses. Such actions align with the MITRE ATT&CK tactics of **Discovery** (TA0007) and **Credential Access** (TA0006), particularly techniques like **System Information Discovery** (T1087.001) and **Credential Dumping** (T1552.001).

  The primary data source for this detection includes logs from Cisco devices, specifically those related to the AAA (Authentication, Authorization, and Accounting) service, which captures command executions and configuration accesses.

  ### Investigation Steps
  - **Review Command Execution Logs:** Examine logs from the Cisco device's AAA service to identify any occurrences of the detected keywords related to configuration data extraction.
  - **Correlate with User Behavior:** Analyze the user accounts executing these commands to determine if they align with typical administrative actions or if they originate from anomalous accounts.
  - **Investigate Network Activity:** Look for any suspicious network activity following the command’s execution, such as unauthorized access to network segments or unusual data exfiltration patterns.
  - **Audit Configuration Changes:** Monitor any recent changes to network configurations that may have been informed by the collected data, which could indicate an escalation in malicious activities.

  ### Prioritization
  This alert is rated with a low severity level primarily because the commands are often used legitimately by system administrators. However, the potential impact of misuse elevates the need for monitoring, as attackers can leverage this innocuous command for malicious purposes.

  ### Blind Spots and Assumptions
  One key gap in detection coverage is the absence of logs from non-Cisco devices that may interface with or rely on Cisco configurations without triggering alerts. The detection logic assumes that users performing these commands are not authorized and ignores legitimate administrative activities, which could lead to false positives. Successful detection also requires comprehensive logging of command output and internal configurations from the Cisco devices, necessitating proper AAA logging configurations to capture all relevant activities.

