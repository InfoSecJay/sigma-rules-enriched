  ### Technical Context

  This Sigma rule detects the execution of common Cisco IOS commands that retrieve configuration files, such as "show running-config" and "show startup-config." The typical attacker objective is to gather sensitive configuration data which may include credentials or network settings, thereby aiding further exploitation. This behavior correlates primarily with the MITRE ATT&CK tactics of Discovery (TA0007) and Credential Access (TA0006), particularly techniques T1087.001 (Account Discovery) and T1005 (Data from Local System).

  The primary telemetry source for this detection is Cisco AAA logs containing Command Execution records. If the behavior is malicious, it could lead to unauthorized access or manipulation of network devices. It is crucial to note that this alert alone does not confirm malicious intent; legitimate administrative actions may trigger similar logs.

  ### Investigation Steps

  - **Review Command Execution Logs:**
    Check Cisco AAA logs (Event IDs: 11308 for command execution) for instances of "show running-config," "show startup-config," or "show archive config." Malicious indicators would include command usage from unexpected user accounts, especially those lacking appropriate administrative roles.

  - **Identify User Account Context:**
    Validate whether the user executing the commands has legitimate administrative privileges. For benign activity, expect the commands to be run from recognized administrative user accounts during scheduled maintenance windows.

  - **Inspect Command Output Log Artifacts:**
    Determine whether any sensitive data was extracted through captured command outputs. Check if there are logs or artifacts that indicate file creation or exfiltration subsequent to these commands.

  - **Cross-reference Change Management Records:**
    Review if there are internal change management tickets or records corresponding to the executed commands. Legitimate configurations typically follow a documented change control process, which should be absent in unauthorized access scenarios.

  - **Assess Frequency of Command Execution:**
    Examine historical logs for the frequency of the command executions by the user account. A spike in these commands could indicate reconnaissance activity by an adversary.

  ### Prioritization

  This alert is of low severity because the commands detected are often executed by legitimate administrators. However, the potential for abuse exists, especially if these commands are executed outside normal operational patterns, which underscores the importance of monitoring and investigating their occurrences.

  ### Blind Spots and Assumptions

  Detection limitations include adversaries employing obfuscation techniques or using legitimate credentials, which can mask suspicious activity. Reliable detection requires active logging of all command executions, as well as regular configuration monitoring. Legitimate network maintenance activities may trigger this alert; thus, context and prior authorization should be confirmed. A related detection could involve monitoring for unexpected changes in device configurations to further strengthen security coverage.

