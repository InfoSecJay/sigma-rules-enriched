  ### Technical Context

  This Sigma rule detects unauthorized modifications to a Cisco device's configuration, such as enabling an HTTP server, setting up a cron job, or changing access lists. The likely attacker objective is to maintain persistence or leverage command execution capabilities on the device. This behavior maps to the MITRE ATT&CK techniques of Persistence (T1505), Execution (T1053), and Impact (T1490). The primary telemetry sources include Cisco AAA logs, specifically looking for changes in device configuration. If malicious, such changes could allow an adversary to manipulate network traffic or schedule malicious tasks. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrators may execute similar commands during routine maintenance.

  ### Investigation Steps

  - **Review command logs for keywords: ** Examine Cisco AAA logs for commands like 'ip http server,' 'kron occurrence,' or 'access-list' (Log type: AAA Authentication logs). Identify unusual timestamps or user IDs not associated with regular admin activities.

  - **Confirm user roles and permissions:** Cross-reference the user executing the commands against current administrator access levels. Legitimate activity should show commands issued by users with appropriate privileges, consistent with their assigned roles.

  - **Assess network impact:** Analyze changes in device functionality or network behavior post-modifications. Check for new HTTP/HTTPS services using "show ip" commands or configuration dumps (Log type: Configuration files).

  - **Identify high-confidence malicious indicators:** Look for multiple related commands issued in a short period or atypical sequences of configuration changes that deviate from established organizational practices.

  - **Monitor for exploitation activity:** Check for any unauthorized outbound connections or unusual traffic patterns in conjunction with new configurations that could indicate exploitation (e.g., logs from Sysmon or firewall).

  ### Prioritization

  The alert is of medium severity, given that affected systems, such as routers and switches, play critical roles in network operations. While the likelihood of malicious abuse exists, especially within segmented networks, these actions can also arise from legitimate administrative tasks that may require careful validation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as legitimate admin actions or pre-established automated scripts that may trigger similar alerts. Reliable detection requires appropriate logging configurations on Cisco devices, ensuring all relevant AAA logs are retained. Legitimate configuration changes during maintenance windows or upgrades may trigger this alert. Implementing companion detections for unauthorized login attempts or significant network traffic shifts can enhance overall security posture.

