  ### Technical Context

  This Sigma rule detects instances where logging has been disabled on Cisco devices, which can be indicative of an adversarial effort to conceal malicious activity. The likely attacker objective is to evade detection capabilities and thereby maintain persistence or perform actions without telemetry that could lead to forensic analysis. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (ID: T1562.001).

  The primary telemetry sources for this detection are Cisco AAA logging and device configuration logs. If successful, disabling logging may result in significant security impacts, as it hinders the ability to trace unauthorized activities or changes to device configurations. Importantly, this detection does NOT confirm that a malicious actor is present, as there may be legitimate reasons for disabling logging.

  ---

  ### Investigation Steps

  - **Examine configuration changes:** Review Cisco configuration logs to identify `no logging` or `no aaa new-model` commands. Check for recent changes that could indicate unauthorized modifications.

  - **Validate user roles:** Investigate the user account associated with the logging change via AAA command logs (e.g., `show logging`). Confirm the legitimacy of the account and whether it follows typical administrative roles.

  - **Identify alert conditions:** Look for multiple instances of disabled logging across other devices; this could indicate a coordinated attack. Cross-reference device configurations that led to missed audit trails.

  - **Assess impact on security posture:** Determine if there are overlapping or redundant logging mechanisms in place on the affected device. Confirm either legitimate scheduled maintenance windows or adherence to policy.

  - **Capture and analyze altered configurations:** If the disabled logging is assessed as malicious, check for any signs of file transfers or unauthorized connections using device logs, especially prior to logging being disabled.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on the overall security posture of the network, particularly if critical systems are involved. The likelihood of malicious abuse is significant, as disabling logging is a common technique employed by attackers to maintain stealth. Such behavior is often weaponized, especially in advanced persistent threats (APTs).

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative actions that require disabling of logging, leading to potential false positives. Reliable detection requires that all Cisco devices are configured to log adequately and that logging settings are monitored continuously. Furthermore, legitimate maintenance activities, such as scheduled down-time or troubleshooting, may inadvertently trigger this alert. A related detection to strengthen coverage could include alerts for unusual configuration changes in Cisco devices, ideally analyzed in tandem.

