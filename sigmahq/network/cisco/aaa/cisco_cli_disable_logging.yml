  ### Technical Context

  This Sigma rule detects attempts to disable logging on Cisco devices by issuing commands such as 'no logging' or 'no aaa new-model'. The likely attacker objective is to hinder monitoring and forensics efforts, enabling further malicious actions without detection. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) with technique ID T1562.001. Primary telemetry sources include Cisco AAA (Authentication, Authorization, and Accounting) logs which capture logging commands and configurations. If malicious, disabling logging severely impacts the organization's ability to monitor and respond to threats effectively. This detection does NOT confirm that an attack has occurred; it only indicates an action that is commonly associated with malicious intentions.

  ---

  ### Investigation Steps

  - **Check the command execution history**: Review the Cisco device command line interface (CLI) or logs for the command history. Look for Event IDs related to configuration changes that include `no logging` or `no aaa new-model`. Legitimate admins may reference this command for troubleshooting but should always document the context of their actions.

  - **Identify user credentials**: Examine AAA logs for user authentication records at the time of command execution. Look for `user` fields that indicate privileged access (username, role, time). Any command issued by an unexpected user or at an unusual time may indicate malicious activity.

  - **Cross-reference timestamps**: Review the device's syslog messages around the time when the logging was disabled for any unusual activity. Compare the timestamps to identify if this command coincides with known incidents or anomalies in network traffic patterns.

  - **Confirm legitimate configurations**: Evaluate the configuration of the Cisco device to determine if logging was previously enabled and is critical for security monitoring. If logging was essential and suddenly disabled, that raises the likelihood of malicious intent.

  - **Assess network device criticality**: Identify the role of the affected Cisco device in your network (e.g., core router, firewall). Critical devices that have logging disabled significantly increase exposure to threats and should be prioritized for immediate investigation.

  ---

  ### Prioritization

  Alerts regarding disabling logging should be treated as high severity due to the potential for significant impact on security monitoring. The likelihood of malicious abuse is high, as this behavior is commonly weaponized by adversaries seeking to avoid detection during further exploits.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion through authenticated access by legitimate users, which can mask malicious intent. Required log sources must be consistently configured to ensure complete command logging during configuration changes. Legitimate maintenance activities, such as troubleshooting or performance tuning, could trigger the alert. A companion detection includes monitoring for access attempts to the device CLI, which could enhance context surrounding the disabling of logging.

