  ### Technical Context
  This rule detects unauthorized activities related to cryptographic keys within Cisco devices, specifically monitoring when private keys are exported or new certificates are installed. Such actions can signify potential malicious activities, such as an attacker attempting to exfiltrate sensitive information or establish a foothold in a network by manipulating cryptographic materials. Identifying this behavior is crucial in safeguarding the integrity of secure communications and authentication mechanisms within the enterprise.

  The potential threat scenario involves an attacker using these cryptographic commands to export private keys, facilitating further exploitation or impersonation attempts within the network. The primary objectives may include establishing persistence, evading defenses, and gaining access to sensitive data by manipulating key management functionalities.

  Relevant MITRE ATT&CK tactics and techniques linked to this detection include:
  - Credential Access (TA0006): Gaining access to valid credentials through exporting private keys.
  - Defense Evasion (TA0005): Employing trusted certificates to mask malicious activities.
  - T1553.004 - Impair Defenses: Exploiting cryptographic functions to bypass security controls.
  - T1552.004 - Unsecured Credentials: Misusing exported keys or certificates.

  The primary data sources for detecting this activity will be Cisco AAA logs, which provide insights into authentication, authorization, and accounting actions, including the execution of commands related to cryptographic material management.

  ### Investigation Steps
  - **Review AAA Logs:** Collect and analyze Cisco AAA logs for occurrences of the keywords `crypto pki export`, `crypto pki import`, and `crypto pki trustpoint`. Ensure to filter logs around the time of the alert for relevance.
  - **Identify Anomalous Patterns:** Look for any abnormal patterns or sequences of cryptographic command executions, especially from accounts that do not routinely perform these operations.
  - **Correlate with User Activity:** Cross-reference logged command executions with user activity within the network. Identify any accounts that might have recently experienced disturbances or were flagged for suspicious behavior.
  - **Examine Certificate Management Practices:** Assess the organization's certificate management practices to determine if there are known good certificates that could potentially lead to false positives, as well as to confirm proper security measures are in place for private keys.

  ### Prioritization
  Alerts triggered by this rule are prioritized as high due to the potential impact of unauthorized access to cryptographic keys, which can lead to significant security breaches, including data exfiltration and system compromise. The likelihood of an attacker leveraging such methods to gain a foothold in the enterprise further underscores the necessity for immediate investigation.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of key manipulation if logging is not configured properly on Cisco devices or if logs are not retained long enough for thorough analysis. The detection logic assumes that administrators typically do not execute these commands regularly; hence, any such executions are considered suspicious. To ensure efficacy, it is essential that detailed logging for AAA services is enabled and properly configured on affected devices, including all command executions related to cryptographic operations.

