note: |
  ### Technical Context

  This rule detects the use of Cisco commands related to the export and import of cryptographic keys and certificates, specifically `crypto pki export`, `crypto pki import`, and `crypto pki trustpoint`. These commands are often leveraged by attackers aiming to steal sensitive metadata, such as private keys or configurations, thereby enabling unauthorized access to encrypted communications. The relevant MITRE ATT&CK technique for this detection is Credential Access (T1552.004) as it involves obtaining credentials or cryptographic keys that can be exploited.

  The primary telemetry source for these detections includes Cisco AAA logs, which collect authentication and authorization attempts, and any subsequent commands executed on the Cisco device. The security impact of these commands being executed maliciously can be significant, leading to unauthorized decryption of traffic and potential data breaches. However, this detection does NOT confirm malicious intent outright, as legitimate administrative activities may trigger these commands.

  ### Investigation Steps

  - **Check Cisco AAA logs for command usage:** Review logs for Event ID related to the execution of `crypto pki export`, `crypto pki import`, and `crypto pki trustpoint`. Focus on timestamps and user IDs executing these commands to identify whether they align with expected administrative behavior.

  - **Validate user account legitimacy:** Assess the user accounts involved in executing the detected commands. Cross-reference against a whitelist of known administrators. Any unfamiliar or non-privileged user executing these commands should be flagged for further investigation.

  - **Monitor for changes in certificates:** Look for new or updated certificates in the Cisco device's configuration. Use the configuration logs to understand the context of these changes and whether they align with legitimate administrative activities.

  - **Identify potential exfiltration activities:** Check for custom scripts or unusual HTTP/HTTPS traffic linked to these commands that indicate potential data exfiltration. Look for patterns of behavior typically associated with malicious activity, such as unexpected outbound connections following the command execution.

  - **Compare against known baselines:** Establish a baseline of expected command usage for similar operational contexts. Analyze any recent deviations in command execution frequency or context (e.g., time of day), which could indicate suspicious activity.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of cryptographic key management in network security. The likelihood of malicious abuse is significant since attackers often seek to compromise encrypted communications. Additionally, the use of these commands is not common in regular administrative workflows, increasing the importance of a thorough investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative command execution by authorized personnel, which could trigger false positives. Cisco AAA logs must be enabled and properly configured to ensure complete coverage; a lack of logging could mean missing critical alerts. Additionally, legitimate certificate management actions by automated systems may inadvertently trigger this alert. Related detections could include unauthorized user logins (T1078) to identify accounts that may have been compromised before executing the commands related to cryptographic keys.

