note: |
  ### Technical Context

  This Sigma rule detects the use of Cisco CLI commands associated with importing and exporting cryptographic keys and certificates, specifically `crypto pki export` and `crypto pki import`. The likely attacker objective is to exfiltrate private keys or manipulate certificate trust relationships, which can lead to unauthorized access or man-in-the-middle attacks. This behavior is associated with the MITRE ATT&CK tactics of Credential Access (T1552) and Defense Evasion (T1553.004).

  The primary telemetry source is Cisco AAA logs, which provide information on command executions. If malicious, this action can compromise secure communications and integrity across network devices. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative activities may also produce similar log entries.

  ### Investigation Steps

  - **Review command execution logs:** Check Cisco AAA logs (Event ID assigned) for the keywords `crypto pki export` and `crypto pki import`. Legitimate administrative actions may include importing known good certificates by trusted personnel.

  - **Identify recent configuration changes:** Look for related commands in the Cisco configuration logs around the same timestamp. Check for legitimate additions or modifications to trustpoints that may help contextualize the activity.

  - **Verify source of the command:** Correlate the issuing user or IP address with known administrative users. Legitimate commands should be executed under established accounts with admin roles; any unfamiliar account or IP should be treated with suspicion.

  - **Analyze certificate metadata:** For executed commands leading to certificate installation, retrieve and inspect the certificate properties (like issuer and validity) to assess if they align with known organizational signing authorities.

  - **Check alert frequency and patterns:** Determine if this command was executed multiple times or from unusual locations, indicating a potential scripted or automated attack vector. Single instances from a legitimate source may be benign.

  - **Cross-reference with user activity:** Check the timeline of user activity closely before and after the command execution to identify any suspicious behavior patterns that could indicate a breach or compromise.

  ### Prioritization

  This alert is of high severity due to its potential impact on cryptographic integrity, particularly when involving sensitive systems such as firewalls or VPNs. The likelihood of malicious abuse is significant, as exporting private keys could empower an attacker to impersonate services or encrypt communications illicitly. This behavior is often weaponized in advanced persistent threat scenarios.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate administrators executing these commands for valid reasons, potentially leading to false positives. Reliable detection requires properly configured logs and auditing capabilities for Cisco devices to capture all command actions. Additionally, administrative processes that may involve legitimate certificate exports or imports could inadvertently trigger alerts. A related detection to consider is monitoring for unusual patterns in access controls relating to AAA logs, which can indicate broader attempts at privilege escalation.

