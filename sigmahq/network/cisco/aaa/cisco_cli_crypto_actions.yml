  ---

  ### Technical Context

  The Sigma rule detects the export of private keys and the installation of new certificates on Cisco devices through specific crypto commands. This behavior may indicate an attacker’s objective to extract cryptographic credentials for unauthorized access or to manipulate secure communications. The relevant MITRE ATT&CK tactics include Credential Access (TA0006) and Defense Evasion (TA0005), with techniques T1553.004 (Private Key Export) and T1552.004 (Certificate Installation).

  The primary telemetry sources are Cisco AAA logs that capture command-line interface (CLI) entries. If malicious, this behavior poses a significant security risk as it facilitates credential theft and potential pivoting within the network. It is important to note that this detection does NOT confirm malicious intent, as it may also represent legitimate administrative actions by authorized personnel.

  ---

  ### Investigation Steps

  - **Review specific command execution logs:** Analyze Cisco AAA logs for Event IDs related to "crypto pki export" or "crypto pki import." Look for timestamps and the user identity executing the command. Any commands not associated with known good administrative activities should be investigated further.

  - **Identify legitimate behavior:** Confirm if the user executing the command has a history of performing administrative tasks such as certificate management. Check for normal patterns of certificate updates or key exports which should be documented in the organization's CMDB or change management records.

  - **Evaluate user role and context:** Validate that the user account executing these commands is assigned the appropriate role. Look for any deviations from normal operating procedures, especially if the account is not typically involved in key management.

  - **Correlate with other security events:** Cross-reference the timestamp of detected commands with other security logs (e.g., IDS alerts, access logs) for concurrent suspicious activity. Look for unauthorized access attempts or alerts regarding lateral movement within the network.

  - **Extract and analyze relevant fields:** Collect and examine logs for additional fields such as source IP, session IDs, and command outputs. Unfamiliar IP addresses or sessions may indicate an ongoing attack or compromised device.

  - **Monitor for export file activity:** Check if any exported private key files were created during the timeframe of the detected commands. Look for file generation logs that may indicate abnormal exfiltration activities or unauthorized file transfers from the Cisco device.

  ---

  ### Prioritization

  This alert is of high severity in an enterprise context due to the critical nature of cryptographic keys. The likelihood of malicious abuse is substantial, as private key extraction is often targeted by adversaries to gain unauthorized access. Such behavior is not commonly performed by legitimate administrators, indicating a potential exploitation scenario.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative actions could trigger the alert, particularly during routine maintenance or upgrades. Accurate log collections from Cisco devices must be ensured for reliable detection, as incomplete logs could lead to false negatives. Additionally, common workflows such as certificate renewals may produce similar log entries, necessitating careful analysis of user context. A related detection rule for monitoring unauthorized access to SSH or administrative interface would bolster overall defenses.

