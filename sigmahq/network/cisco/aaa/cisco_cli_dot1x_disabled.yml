note: |
  ### Technical Context

  This Sigma rule detects the manual disablement of IEEE 802.1X (dot1x) authentication on Cisco network devices. Attackers may disable dot1x to bypass Network Access Control (NAC) mechanisms, enabling unauthorized devices to gain access to the internal network or to facilitate persistence and lateral movement. It falls under the MITRE ATT&CK tactic of Defense Evasion (T1562.001) and Persistence (T1556.004), as it aims to obscure unauthorized access.

  Primary telemetry sources include Cisco AAA logs related to authentication events, specifically event logging for commands that disable dot1x features. If malicious, this behavior can lead to unauthorized access and network security breaches. However, the detection alone does not confirm that malicious intent exists, as it may also arise from legitimate administrative actions for troubleshooting or port configuration.

  ### Investigation Steps

  - **Review CTA logs for disablement commands:** Check Cisco AAA logs (Event IDs correlating to command execution) for commands including "access-session port-control force-authorized," "no dot1x port-control," and similar variations. Look for timestamps and user account involved in the command execution.

  - **Identify account ownership:** Validate whether the account executing the disabling command is an authorized administrator or a privileged account. Check audit logs for recent activity from this account to determine if unusual behavior preceded the configuration change.

  - **Correlate with existing network access requests:** Examine any recent DHCP logs or network access records to identify devices that were connected or tried to connect before and after the dot1x change. Unfamiliar MAC addresses in association with the time of command execution might indicate possible rogue devices.

  - **Check for legitimate troubleshooting:** Assess if the command execution coincides with any reported network issues or maintenance windows, as legitimate admin actions may trigger this alert. Review ticketing system logs to match with administrator claims of connectivity issues.

  - **Monitor for potential lateral movement:** Conduct an analysis of network traffic to identify any newly connected devices post-command execution. Look for abnormal traffic patterns or connections to sensitive internal systems that were initiated following the disablement.

  - **Document security posture impact:** Consider the criticality of affected systems. If devices with disabled dot1x are managing sensitive data or connecting to high-value internal resources, this should escalate urgency for remediation and further investigation.

  ### Prioritization

  This alert should be treated with medium severity. While the disablement of dot1x authentication can indicate possible malicious activity, especially if conducted outside of maintenance windows, there is also a risk of false positives from legitimate administrative troubleshooting. Given the sophistication of current network threats, this behavior is often weaponized by attackers seeking unauthorized access.

  ### Blind Spots and Assumptions

  Detection may be limited in environments with insufficient logging or oversight on Cisco devices where administrators regularly disable dot1x for troubleshooting. Some legitimate activities, such as device remediation or updates, may trigger this alert without malicious intent. Related detections, such as monitoring for unusual authentication failures or access requests from suspicious devices (e.g., failed logins followed by configuration changes), will enhance coverage and context for investigations.

