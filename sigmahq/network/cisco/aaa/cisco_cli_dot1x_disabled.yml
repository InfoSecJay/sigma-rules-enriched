note: |
  ### Technical Context

  This Sigma rule detects the manual disablement of IEEE 802.1X (dot1x) authentication on Cisco network interfaces. Disabling dot1x effectively circumvents Network Access Control (NAC) measures, allowing unauthorized devices to access the internal network, which is a common tactic for establishing persistence or conducting lateral movement by adversaries or malicious insiders. This action aligns with MITRE ATT&CK techniques such as "Impair Defenses" (T1556) and "Exploitation for Client Execution" (T1685).

  Primary telemetry sources for this detection include Cisco AAA (Authentication, Authorization, and Accounting) logs that capture interface configuration changes. If performed maliciously, the impact is significant, as it could enable unauthorized access to sensitive internal resources. However, this detection does NOT confirm malicious intent on its own, as legitimate administrators may disable dot1x for valid troubleshooting purposes.

  ### Investigation Steps

  - **Review interface configuration changes:** Check Cisco AAA logs for Event IDs associated with the use of commands like `access-session port-control force-authorized`, `no access-session port-control`, or `no dot1x port-control`. Relevant fields include the source IP, timestamp, and the specific interface involved.

  - **Verify administrative justification:** Determine if the change was documented and approved by reviewing change management records specific to the affected network device. Look for pre-approved maintenance windows relevant to the asset.

  - **Identify repeatable behaviors:** Analyze logs for patterns. If multiple interfaces on the same device or across multiple devices are modified simultaneously, this could indicate malicious behavior. Legitimate changes typically affect a single interface and conform to defined maintenance schedules.

  - **Examine device roles and criticality:** Confirm the role of the affected device. Devices in sensitive areas, such as those connecting to data centers or key user groups, being impacted by dot1x deactivation should be escalated for further investigation.

  - **Look for rogue devices:** Investigate whether any unauthorized MAC addresses show up in the DHCP logs or ARP tables following the disablement. This could indicate lateral movement, as unauthorized devices might attempt to establish a presence after the dot1x has been disabled.

  ### Prioritization

  The alert severity is medium due to the impact on network security if unauthorized devices gain access. The likelihood of malicious abuse is concerning, especially in networks where NAC is critical. This behavior is known to be weaponized by both external attackers and insiders seeking to exploit network access controls.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as legitimate administrative changes that may mimic malicious activity. It is crucial to ensure all relevant Cisco logs related to AAA configurations are enabled and collected for consistent detection. Legitimate activities, such as troubleshooting administrator actions, may trigger the alert. A related detection could involve monitoring unauthorized MAC addresses on the network post-disablement to strengthen overall network integrity assessments.

