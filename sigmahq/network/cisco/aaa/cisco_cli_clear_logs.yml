  ### Technical Context

  This rule detects the execution of commands in Cisco network devices that clear command histories or log files, specifically "clear logging" and "clear archive". The likely attacker objective is to erase traces of malicious activity or facilitate further unauthorized actions without detection. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1070.003 (Clear Command History).

  The primary telemetry source for this detection is Cisco AAA logging, focusing on command execution events associated with user actions. If the behavior is malicious, it can indicate attempts to hide evidence of activities such as unauthorized configuration changes or network intrusions. It is important to note that this detection does NOT confirm the presence of an active intrusion, as legitimate network administrators may also perform these actions as part of routine management.

  ### Investigation Steps

  - **Verify command usage:** Check AAA logs for commands "clear logging" or "clear archive". Look for Cisco Event ID associated with command execution. Malicious use will typically follow unusual access patterns or be executed by unauthorized users.

  - **Assess user identity:** Review the user account that executed the command by correlating against user access logs (e.g., AAA logs). Compare the user roles; legitimate admins should have documented changes correlating with command usage.

  - **Investigate prior commands:** Identify preceding commands executed by the same user. Look for suspicious commands (Event ID: related Syslog) indicating reconnaissance or changes that could prompt log clearance.

  - **Contextualize command frequency:** Determine if the command was executed multiple times in a short period, which could indicate abnormal behavior. This may be noted in Syslog data that tracks command history.

  - **Review system impact:** Assess the configuration or devices impacted by the command. High-criticality devices (e.g., edge routers, firewalls) should be prioritized due to their importance in overall network security.

  ### Prioritization

  The alert severity is high because it involves significant equipment (network devices) used to protect sensitive organizational assets. The likelihood of malicious abuse is elevated, particularly in cases where unauthorized users execute such commands to suppress telemetry. Considering that this command is commonly weaponized by attackers during intrusions to obfuscate their activities, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Evasion techniques include legitimate admin actions that can trigger this alert, complicating context determinations. Detection may be limited if AAA logging is not properly configured or logs are not being retained long enough to analyze a complete activity timeline. A related detection to strengthen coverage includes monitoring for execution of suspicious network configuration commands that could lead to evidence being cleared.

