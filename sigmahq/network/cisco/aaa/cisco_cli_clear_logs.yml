  ### Technical Context

  This Sigma rule detects the execution of commands on Cisco network devices designed to clear command logs and archived logs. The intent behind such behavior is likely to evade detection and cover tracks following malicious activities or unauthorized access. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005), specifically technique T1070.003, which focuses on clearing application logs.

  The primary telemetry sources for this detection are logs from Cisco devices, particularly those related to AAA (Authentication, Authorization, and Accounting) functionality that capture command input. If malicious, this behavior could significantly hinder incident response efforts, as it obscures any logs that might contain evidence of prior suspicious activities or compromises. Importantly, this detection does not confirm whether any malicious activity occurred; it only reveals that log-clearing commands were executed.

  ---

  ### Investigation Steps

  - **Review command history:** Check the AAA logs (Event ID not specified) for any commands executed immediately before and after the log-clearing command. Look specifically for `clear logging` or `clear archive` commands, as their presence suggests an evasion attempt.

  - **Identify user context:** Analyze the log entries to determine which user or role executed the commands. Look for fields such as `username` and `timestamp` in the logs to ascertain if it was a legitimate administrator action or suspicious behavior.

  - **Correlate with other behaviors:** Examine previous commands in the logs to identify activities that led up to the log-clearing commands. Look for potentially malicious commands or unusual activities that preceded this behavior (e.g., configuration changes, user privilege escalations).

  - **Establish the device role:** Consider the criticality of the device under review—if it is a core system (e.g., a router handling significant traffic or a firewall), the implications of log-clearing are more severe compared to less critical devices.

  - **Check for administrative alerts:** Investigate if other administrative activities were logged around the same time, such as configuration changes or firmware updates, which might explain benign log cleaning versus malicious intent.

  - **Validate log retention settings:** Review the configuration of the logging settings on the Cisco devices to ensure that logs are properly retained and managed for security compliance. Identify any legacy configurations that may allow excessive log-clearing without notification.

  ---

  ### Prioritization

  This alert should be treated with high severity. The potential impact on the system is significant, as clearing logs can hamper forensic investigations and real-time monitoring. The likelihood of malicious abuse exists, especially if the command is executed in conjunction with other suspicious behavior, which underscores its weaponization in advanced persistent threat scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if the logging settings are incorrectly configured or if logs are not maintained properly, which could lead to a lack of historical data when evaluating activities. Legitimate administrative tasks may trigger this alert but should be rare. The absence of other logging systems or monitoring to capture unusual activities can also exacerbate the blind spots. A related detection to strengthen coverage would be an alert for suspicious administrative actions executed on the network device prior to the clearing of logs.

