  ### Technical Context
  This detection rule identifies the use of commands that clear command history on Cisco network devices, specifically commands like `clear logging` and `clear archive`. Such actions are primarily associated with defense evasion tactics employed by attackers who aim to erase traces of their activities, making it harder for security teams to investigate malicious actions. The likely goal of the threat actor is to obfuscate their presence and activities, which could involve unauthorized access or configuration changes on the network devices.

  This rule aligns with the MITRE ATT&CK technique T1070.003, which focuses on "Timestamps" as a method of defense evasion, where attackers clear or modify logs to avoid detection. By understanding the actions that lead to the deletion of logs, security analysts can gain insight into possible intruder activities and proactively defend against potential attacks.

  Primary data sources for successfully gathering evidence of this behavior include logs from Cisco devices (AAA logs) that record administrative actions. These logs can help analysts identify any remedial actions taken by legitimate users as well as potential malicious activity.

  ### Investigation Steps
  - **Review Cisco AAA Logs**: Check for entries that record the execution of `clear logging` and `clear archive` commands. Look for contextual details around these commands to identify potential unauthorized attempts.
  - **Analyze User Activity**: Investigate the user accounts that executed the clearing commands, focusing on their roles and expected activity. Look for signs of credential misuse or accounts with elevated privileges executing these commands unexpectedly.
  - **Correlate with Other Logs**: Cross-reference with other telemetry sources such as network device configuration logs, syslog entries, and any connected SIEM data to assess the overall context of activity during the time the logs were cleared.
  - **Identify Recent Changes**: Check for recent changes in device configurations that occurred before or after the clearing commands were executed, seeking indications of unauthorized changes aligned with common attack vectors.

  ### Prioritization
  The alert's severity is high due to the potential impact of attackers evading detection through log clearing, which could indicate a larger compromise or ongoing malicious operations aimed at critical network infrastructure.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of log clearing if the feature is disabled or if logs are configured not to capture these commands. Additionally, legitimate administrative actions could create false positives, as network administrators may sometimes need to clear logs for maintenance or performance reasons. To ensure effective detection, logging must be enabled and properly configured on Cisco devices to capture all relevant AAA command logs.

