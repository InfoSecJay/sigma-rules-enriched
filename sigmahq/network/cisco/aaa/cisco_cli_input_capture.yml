  ### Technical Context
  This detection rule is designed to identify the execution of specific Cisco commands that may indicate unauthorized access to device history or configuration logs. Command inputs such as "show history" or "show logging" provide insight into user activities on Cisco devices, revealing not only command usage but potentially exposing sensitive information, including full credentials and system configurations. Attackers may exploit these commands to gather intelligence on device configurations or previous user actions, facilitating further unauthorized manipulation or access escalation.

  The relevant MITRE ATT&CK tactics associated with this detection include **Credential Access** (TA0006) and specifically the technique **Account Manipulation** (T1552.003). These tactics highlight the risk of an attacker gaining access to sensitive data through unauthorized command execution on network devices, potentially enabling broader network compromises.

  Primary data sources for monitoring this activity include **Cisco AAA logs**, which log user authentication attempts and command inputs executed by users on networking devices. The presence of unusual command execution patterns can signal attempts to probe for information or perform reconnaissance on network device configurations.

  ### Investigation Steps
  - **Review AAA Logs**: Collect and analyze Cisco AAA logs for any occurrences of the detected commands such as "show history" or "show logging," particularly from unauthorized or unexpected user accounts.
  - **Identify User Context**: Determine the user identity associated with the command execution, assessing whether the user’s role is consistent with accessing historical command data.
  - **Monitor for Anomalous Behavior**: Investigate the context surrounding the command execution, looking for unusual access patterns at non-standard hours, or from unfamiliar IP addresses that may indicate potential account compromise.
  - **Check for Configuration Changes**: Look for any subsequent configuration changes made after the execution of these commands, which may reveal if the attacker attempted to exploit the obtained information.

  ### Prioritization
  The alert is categorized as medium severity due to the potential exposure of sensitive information through unauthorized command inputs. If exploited by an attacker, this could lead to significant security breaches and unauthorized changes across the network infrastructure.

  ### Blind Spots and Assumptions
  One primary gap in detection coverage is the reliance on logging settings; if the Cisco AAA logs are not properly configured or retained, instances of unauthorized command access could go undetected. The detection logic assumes that commands like "show history" are infrequently executed by legitimate administrators, especially in environments where remote logging is configured. Therefore, successful detection is contingent upon having comprehensive AAA logging enabled and properly configured for all relevant devices.

