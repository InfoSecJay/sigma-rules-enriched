note: |
  ### Technical Context

  This rule detects the use of specific Cisco "show" commands that may indicate unauthorized access or compromise of network devices. Attackers often gain access to network devices to retrieve configurations or credentials stored in command history. This behavior fits within the MITRE ATT&CK framework under the tactic of Credential Access (TA0006), specifically technique T1552.003, which involves accessing credential storage.

  The primary telemetry sources are Cisco AAA logs that capture user command input on devices. If malicious, the impact could involve a breach of network security, exposing sensitive configurations and credentials. It is important to note that this detection does NOT confirm that the command execution is malicious on its own; it may simply indicate administrative behavior.

  ### Investigation Steps

  - **Review AAA logs for command input events:** Check Cisco AAA logs (log type: authentication logs) for events (may include Event IDs related to command execution). Look for instances where "show history," "show history all," or "show logging" commands were executed by non-admin users.

  - **Assess the user identity executing commands:** Identify the user associated with the detected command. If the user is not typically associated with network device administration, flag as suspicious.

  - **Correlate with recent admin activity:** Cross-reference the command execution time with recent administrative actions (e.g., logins or configuration changes) to identify legitimate users interacting with device logs. Commands run outside normal hours may indicate unauthorized access.

  - **Check for Cisco console access patterns:** Look for telemetry that captures physical or remote console access (e.g., SSH or console logs). Legitimate admin activity should show expected usage patterns with few "show" commands.

  - **Look for command history extraction signs:** Investigate if there were any attempts to export or manipulate command history elsewhere. Indicators of exfiltration can include unusual file transfers post command execution.

  - **Scripted login activity:** Review any evidence of automated scripts or tools being used to log into the device. Note if command usage correlates with known administrative automation tasks.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on network security and the likelihood of misuse by malicious actors, particularly in environments where network devices handle sensitive data. While the commands are not commonly used by legitimate administrators, any unauthorized use presents a significant concern.

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative activities that may trigger this alert, especially if used by authorized personnel. Evasion techniques may include disguise through scripted automation where commands are executed in rapid succession. Reliable detection requires proper logging configuration on Cisco devices to ensure command input is captured. A related detection could include monitoring for unusual login patterns to network devices, which would strengthen overall security monitoring.

