  ### Technical Context

  This rule detects the creation or modification of local accounts on Cisco devices, as well as changes to remote authentication configurations. Attackers may aim to establish persistence within a network by creating or altering user accounts to gain unauthorized access and control over network devices. This behavior aligns with the MITRE ATT&CK technique for local account credential manipulation (T1136.001) and persistence through account creation or modification.

  The primary telemetry source is AAA (Authentication, Authorization, and Accounting) logs from Cisco devices. If malicious, such activities could lead to unauthorized access and a complete compromise of network infrastructure. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative activities can also trigger this alert.

  ### Investigation Steps

  - **Review relevant AAA logs:**
    Examine AAA logs for Event IDs related to account creation or modification (e.g., logging method with fields indicating `username` and `action`). Compare timestamps with authorized maintenance windows for anomalous activity.

  - **Validate account change details:**
    Check the username involved in the account creation or modification. Legitimate administrative actions typically maintain predictable naming conventions and are performed during regular business hours.

  - **Correlate with change management processes:**
    Review change management documentation for any recent authorized changes involving local account configurations on affected Cisco devices. Confirm that no unauthorized changes occurred outside documented changes.

  - **Identify remote access configurations:**
    Investigate any configurations related to remote authentication (e.g., RADIUS or TACACS+ settings) for unexpected changes or newly added parameters that could indicate an attacker’s foothold.

  - **Evaluate frequency of changes:**
    Analyze historical AAA logs for the frequency of account modifications. Frequent changes, especially outside the expected parameters, may indicate malicious behavior rather than expected configuration updates.

  ### Prioritization

  This alert should be considered high severity as it indicates potential unauthorized account access on critical network devices. The impact of a compromise can be extensive, allowing attackers to manipulate configurations across the network. Such activities are commonly associated with privilege escalation and may be weaponized by adversaries to retain access.

  ### Blind Spots and Assumptions

  The detection may be limited if AAA logs are not adequately retained or if encryption obscures account action details. Legitimate administrative personnel may also change configurations frequently, especially in response to incidents or network upgrades. A related detection would be monitoring for suspicious login attempts via remote authentication to strengthen visibility of potential credential abuse on the Cisco devices.

