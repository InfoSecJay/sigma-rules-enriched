logsource:
  product: zeek
  service: smb_files
detection:
  selection:
    path|contains|all:
    - '\\'
    - '\IPC$'
    name|endswith:
    - '-stdin'
    - '-stdout'
    - '-stderr'
  filter:
    name|startswith: 'PSEXESVC'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of PsExec or similar tools using SMB that create services with renamed identifiers (e.g., PSEXESVC). It identifies when a user attempts to leverage PsExec for lateral movement, evading typical detection mechanisms by obscuring service names. The likely attacker objective is to execute commands on remote systems without triggering defenses, indicating suspicious lateral movement within the environment.

  The relevant MITRE ATT&CK tactic is "Lateral Movement" (TA-0008) with the technique "Application Layer Protocol" (T1021.002). The primary telemetry source is Zeek, focusing on SMB file transfer logs. If the behavior is malicious, it can lead to unauthorized command execution and potential compromise of additional systems. Importantly, detection of this activity does NOT confirm malicious intent on its own, as legitimate administrative tasks can invoke similar behaviors.

  ### Investigation Steps

  - **Check the execution context:** Review Zeek logs for Event ID related to SMB file sharing indicating PsExec or similar executions, specifically noting 'service created' events with names containing 'PSEXESVC'. Look for unusual service names that align with attacker techniques.

  - **Identify source and destination systems:** Assess the source machine from which PsExec executed and the targeted systems. Look for unusual lateral movement patterns—such as internal IP addresses in unexpected segments.

  - **Compare with baseline behavior:** Validate against known legitimate use cases of PsExec within your organization's environment. Check for any recent changes in personnel or administrative rights that may justify expected use.

  - **Look for additional malicious indicators:** Cross-reference the identified event with existing threat intelligence to determine if the behavior aligns with known attacker tactics or if associated files were created or executed (e.g., unusual scripts or binaries).

  - **Check for EDR alerts:** Review any alerts or logs from endpoint detection tools that monitor for unusual process creations, such as observing processes that are spawned by PsExec (e.g., 'cmd.exe' being run with the context of PSEXESVC).

  ### Prioritization

  This alert has high severity as it indicates a potential lateral movement technique commonly exploited by adversaries. If the source is a privileged user or system, the impact could be significant, resulting in unauthorized access and compromise. This behavior is often weaponized in attacks targeting internal networks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion if the PsExec binary is renamed or if similar tools are utilized. Ensure logs from all critical systems are properly collected, especially those with administrative capabilities. Legitimate administrative activities may trigger this alert, particularly during system maintenance or updates. Companion detections, such as those monitoring for unusual service creation patterns or user logons, will reinforce coverage against this tactic.

