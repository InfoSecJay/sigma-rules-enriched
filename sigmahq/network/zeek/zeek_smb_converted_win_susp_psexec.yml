logsource:
  product: zeek
  service: smb_files
detection:
  selection:
    path|contains|all:
    - '\\'
    - '\IPC$'
    name|endswith:
    - '-stdin'
    - '-stdout'
    - '-stderr'
  filter:
    name|startswith: 'PSEXESVC'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious executions of PsExec or PAexec tools that have been utilized with renamed service names, specifically focused on instances where the events involve file paths that suggest lateral movement activities. Malicious actors often employ PsExec to execute processes on remote systems without the need for RDP. By renaming service names, they can obfuscate their activities, making detection harder. The primary objectives of such attackers include gaining unauthorized access to systems, moving laterally across the network, and executing arbitrary code on target machines.

  The relevant MITRE ATT&CK tactics for this behavior include **Lateral Movement** (TA0008) and technique **Remote Services: PSExec** (T1021.002). PsExec is a common tool used in exploitation campaigns, often indicative of attempts to maintain persistence or escalate privileges inside a compromised network. The primary sources of telemetry for detecting this behavior will be SMB file logs captured by Zeek, which can provide insights into file execution requests and command executions over the network.

  ### Investigation Steps
  - **Review SMB File Logs**: Examine corresponding Zeek SMB file logs for instances of PsExec or PAexec usage, specifically focusing on logs where the service name starts with "PSEXESVC" and involved suspicious paths indicating lateral movement.

  - **Analyze Process Creation Events**: Investigate associated process creation logs across endpoints for any suspicious processes that may have been executed using PsExec, looking for indicators of unusual parent-child process relationships.

  - **Correlate with Network Traffic**: Check for unusual network connections and traffic patterns that may correlate with the execution of PsExec, particularly targeted at multiple internal hosts in a short timeframe which can suggest a spread of malicious activity.

  - **Identify Abnormal Service Creation**: Look for any newly created or modified services on systems that are linked to PsExec usage, ensuring to correlate service names and execution times for anomalous activity.

  ### Prioritization
  The alert is deemed high severity due to the potential impact of lateral movement within an enterprise environment, where successful exploitation can lead to significant data breaches and unauthorized access to sensitive systems.

  ### Blind Spots and Assumptions
  There may be cases where legitimate administrative activities utilize PsExec in a benign manner, which poses a gap in detection coverage. The effectiveness of this detection relies on the completeness of the SMB file logs and their analysis. Additionally, the detection assumes that any renaming of the PsExec service follows a clear pattern (i.e., starting with "PSEXESVC"), and that all relevant logs are correctly configured to be captured and sent to the analysis platform for detection to function effectively.

