note: |
  ### Technical Context
  This Sigma rule detects the creation of remote tasks via the use of `at.exe` or API calls interacting with the ATSVC named pipe. The ability to remotely create and execute scheduled tasks can indicate malicious behavior, especially if conducted by unauthorized users or applications attempting to leverage legitimate tools for lateral movement within a network. This behavior could be indicative of an attacker aiming to establish persistence, execute commands remotely, or elevate their privileges within a target environment.

  Attackers exploiting this capability might seek to execute malicious payloads on targeted systems, creating backdoors or executing further commands while evading detection. The relevant MITRE ATT&CK tactics include Privilege Escalation (TA0004), Execution (TA0002), Lateral Movement (TA0008), and Persistence (TA0003). Techniques involved include Scheduled Task/Job (T1053.002), which reflects the attacker’s use of scheduled tasks to maintain access or perform actions remotely.

  The primary data sources for detecting this behavior include Zeek logs, particularly those related to SMB file service interactions, which can capture attempts to access named pipes such as ATSVC through which remote tasks may be scheduled.

  ### Investigation Steps
  - **Review Zeek Logs**: Collect and examine logs from Zeek related to SMB interactions, filtering for any access attempts to `\\*\IPC$` with a focus on entries that involve the ATSVC named pipe.

  - **Analyze Process Creation Events**: Check for any process creation events linked to `at.exe` or other scheduling processes on target hosts around the times indicated in the Zeek logs, identifying any unusual command line arguments or parental relationships.

  - **Investigate User Context**: Determine the user context under which the task was created. Look for accounts that may have been exploited, particularly service accounts or accounts with administrative privileges that shouldn’t typically execute such commands.

  - **Correlate with Other Security Events**: Cross-reference findings with other security telemetry sources such as EDR alerts or SIEM logs to identify any additional suspicious behavior or indicators of compromise surrounding the time of the detected remote task creation.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to the potential for significant impact. Unauthorized remote task creation can lead to privilege escalation or the execution of malware within a network, making it essential for quick response and investigation.

  ### Blind Spots and Assumptions
  One significant blind spot is the reliance on logging and detection capabilities of Zeek; if these logs are not properly configured or if named pipe interactions occur through atypical channels, such activities may go unnoticed. The detection logic assumes that the monitored environment includes potential uses of ATSVC and that baseline behavior is well-understood, allowing deviations to be effectively identified. Comprehensive logging of SMB interactions and adequate monitoring configurations are necessary for this alert to function correctly.

