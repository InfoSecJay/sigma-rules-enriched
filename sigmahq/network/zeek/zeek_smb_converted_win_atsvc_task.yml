note: |
  ### Technical Context

  This Sigma rule detects remote task creation through the interaction with the ATSVC named pipe, specifically when an attacker utilizes the `at.exe` tool or similar APIs. The likely objective of the attacker is to establish persistence, execute commands on a remote host, or leverage this technique for lateral movement within the network. Relevant MITRE ATT&CK tactics and techniques include **Execution (T1059)** for command execution, **Persistence (T1053.002)** for scheduled tasks, and **Lateral Movement (T1021)** when accessing remote systems.

  The primary telemetry source for this detection is from Zeek logs focusing on SMB file sharing accesses, specifically targeting named pipes under the IPC$ share. The security impact, if malicious, could enable an adversary to execute unauthorized commands on systems, potentially leading to data compromise or system integrity violations. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative operations may also generate similar events.

  ### Investigation Steps

  - **Identify remote task creation events:** Examine Zeek logs with attention to the `path` containing `\\*\IPC$` and the `name` as `atsvc`. Validate the associated SMB transactions (Event ID related, e.g., Event ID 10) to look for suspicious write operations specifically targeting ATSVC.

  - **Correlate with known `at.exe` usage:** Cross-reference any found events with documented usage of the `at.exe` command to understand the context. If other administrators are known to use this tool legitimately, confirm their activity logs to establish benign behavior.

  - **Review other IPC traffic:** Analyze other logs (e.g., Windows Event ID 4656) for related named pipe accesses, ensuring they are not part of a broader series of suspicious activities indicating potential lateral movement.

  - **Look for elevated permissions:** Check if the originating system shows signs of compromised accounts or if the task was created under a system context with elevated privileges. This can indicate a malicious actor attempting to exploit privileges (Probe Windows Event ID 4688 for reactions).

  - **Establish benign context for IPC access:** Verify historical patterns of legitimate software access and task scheduling within the environment. Identifying normal scheduling patterns can help distinguish between malicious and benign activity.

  ### Prioritization

  This alert should be considered medium severity due to the potential for an attacker to gain unauthorized access and maintain persistence through scheduled tasks. The impact on critical systems could lead to significant data leak or compromise if exploited. While this behavior is not commonly weaponized, the tools and techniques associated with remote task creation are well documented among threat actors.

  ### Blind Spots and Assumptions

  This detection may be evaded through techniques such as legitimate use of administrative tools or scripting that avoids creating tasks through `at.exe`. Reliable detection also requires proper logging configuration on SMB and event logging for scheduled tasks. Legitimate administrative activities, such as IT maintenance tasks or script-based automation, might trigger this alert. Companion detections should include monitoring for unusual usage patterns of administrative tools (such as `schtasks.exe`), enhancing coverage around task scheduling activity.

