  ---

  ### Technical Context

  This rule detects the use of the Encrypting File System Remote Protocol (MS-EFSRPC) within Microsoft Windows environments, specifically focusing on operations that start with "efs." The likely attacker objective is to exploit the protocol for credential theft, leveraging it in the PetitPotam attack to coerce a domain controller into authenticating with their malicious entity. The relevant MITRE ATT&CK tactic is Credential Access, specifically technique T1557.001 (Credential Dumping: NTLM), and also technique T1187 (Acquire User Credential). The primary telemetry source for this detection is DCE/RPC logs captured by systems monitoring network traffic with Zeek. If malicious, exploitation could lead to unauthorized access to sensitive credentials and potentially escalate privileges. This detection does *not* confirm malicious activity on its own, as legitimate administrative tasks may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review surrounding RPC logs: ** Investigate logs from the source IP (Zeek DCE/RPC logs with 'dce_rpc' service and related event types) for unusual patterns of activity around the detected event, especially within a 5-minute window before and after the alert. Look for legitimate administrative tasks versus anomalous behavior.

  - **Identify high-confidence malicious indicators: ** Focus on RPC call metrics from the source IP to determine frequency and volume. Reject calls that lack valid administrative context or appear after hours, looking for operations starting with 'efs'.

  - **Assess legitimate use cases: ** Identify if there are documented administrator activities or scheduled tasks that typically utilize EFS RPC calls. Check for the presence of known software or scripts used internally that might invoke this RPC function under normal operational circumstances.

  - **Correlate with SMB activities: ** Review SMB logs for ‘smb_mapping’ and ‘smb_files’ operations from the same source IP to identify any unauthorized lateral movement attempts or unusual file access patterns. Monitor for unexpected remote share accesses, focusing on sensitive shares.

  - **Check for authentication attempts: ** Look in logs for NTLM and Kerberos authentication events (Event IDs 4624 and 4768) related to the source IP to assess if there are excessive or suspicious authentication requests from that entity.

  ---

  ### Prioritization

  This alert is considered medium severity due to the sensitive nature of potential credential access involving EFS RPC calls. While the likelihood of abuse is moderate, this behavior can be weaponized in specific attack scenarios like PetitPotam, necessitating prompt investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may not capture all legitimate uses of EFS RPC due to its uncommon nature. Evasion techniques include attackers obfuscating legitimate traffic or using uncommon ports. Organizations must ensure they have comprehensive DCE/RPC logging enabled. Legitimate activities may include standard administrative tasks that invoke EFS. A companion detection to consider is monitoring for excess failed authentication attempts (Event ID 4625), which provides additional context on potential exploitation attempts.

