note: |
  ### Technical Context

  This Sigma rule detects the invocation of the Windows RPC library's Encrypting File System Remote Protocol (MS-EFSRPC) operations, particularly those starting with 'efs'. This behavior is atypical in most environments and often signifies an attempt to exploit the PetitPotam attack vector, which aims to capture NTLM hashes for unauthorized authentication. The relevant MITRE ATT&CK tactics include "Credential Access" (TA0006) and "Exploitation of Remote Services" (T1203).

  Primary telemetry sources include logs from network services and systems capable of tracking RPC calls, specifically Zeek logs for dce_rpc. The security impact of such behavior is significant, as successful execution could lead to credential compromise and lateral movement within the network. However, it is crucial to understand that this detection alone does not confirm malicious intent, as there are legitimate use cases for EFS RPC calls by system administrators or authorized software processes.

  ### Investigation Steps

  - **Review RPC usage logs:** Examine Zeek logs for dce_rpc calls, particularly those labeled with 'efs'. Look for Event IDs corresponding to dce_rpc operations to establish context around the alert. Identify legitimate IP ranges and typical usage patterns.

  - **Correlate with SMB activity:** Check logs under 'smb_mapping' and 'smb_files' from the source IP to assess if the RPC call correlates with unusual SMB traffic or or excessive enumeration attempts of network resources.

  - **Identify user and asset criticality:** Determine the asset's role within the network to assess potential impact. For example, if the source IP belongs to a sensitive server like a Domain Controller, the alert demands higher urgency.

  - **Analyze surrounding log events:** Gather additional logs from the source IP (e.g., NTLM, Kerberos, RDP) within a 10-minute window before and after to identify other suspicious activities that may indicate a coordinated attack pattern.

  - **Check for known benign versions:** Validate if there have been legitimate administrative tasks recorded around the same time that involve EFS, such as authorized backups or encryption tasks performed by IT staff.

  - **Identify malicious indicators:** Look for NTLM hash captures or unusual authentication requests to other systems from the same source IP following the EFS RPC calls, indicating a potential compromise.

  ### Prioritization

  This alert should be treated as moderate to high severity. The impact of the affected system is significant—especially if it involves credential access on critical infrastructure. The likelihood of malicious abuse is high, as this behavior is not standard across environments and typically requires further investigation. PetitPotam-related techniques have been weaponized in the wild.

  ### Blind Spots and Assumptions

  The detection may miss legitimate activities that utilize EFS RPC, leading to false positives, particularly from administrative tasks. The primary log source needed for reliable detection is comprehensive monitoring of RPC calls via Zeek. Additionally, ongoing monitoring for unusually high incidences of EFS RPC usage may help to establish baseline behavior standards, aiding in distinguishing normal from malicious activity. A related detection strategy includes monitoring for NTLM hash exfiltration events to complement this alert and improve coverage.

