note: |
  ### Technical Context
  This rule detects the usage of the Encrypting File System Remote Protocol (MS-EFSRPC) within Windows environments. Such activity is associated with the PetitPotam attack, where adversaries exploit this protocol to perform NTLM relay attacks against Active Directory. The goal of an attacker utilizing PetitPotam is often to gain unauthorized access to resources, escalate privileges, or capture sensitive data.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Credential Access** (T1557): Exploiting stored credentials to gain unauthorized access.
  - **Collection** (T1187): Gathering sensitive data from the environment.

  The primary data sources for detecting this activity include logs from the DCE/RPC service, related SMB activities, and potential references in Kerberos or NTLM traffic. Since MS-EFSRPC is not commonly used in everyday operations, any detected calls to this protocol should prompt immediate investigation.

  ### Investigation Steps
  - **Review RPC Logs**: Investigate DCE/RPC logs for calls related to 'efs' to identify the source IP and associated activities. This can provide insight into potentially malicious actions around file encryption.
  - **Analyze SMB Logs**: Examine SMB mapping and file access logs from the source IP to determine if unauthorized file operations occurred that may indicate exploitation attempts.
  - **Check User Context**: Assess the user privileges associated with the RPC calls. Look for unexpected or unauthorized accounts attempting to use the EFS RPC functionality.
  - **Surrounding Event Correlation**: Check surrounding logs (within a few minutes) such as RDP, NTLM, and Kerberos authentication attempts to identify any correlating activities that could indicate broader compromise.

  ### Prioritization
  This alert is classified as medium severity due to the potential impact of credential theft and unauthorized access that could result from a successful PetitPotam attack, combined with the relatively low likelihood of legitimate usage of MS-EFSRPC in most enterprise environments.

  ### Blind Spots and Assumptions
  Current detection coverage may be limited to only certain log types and may not capture all instances of EFS RPC usage, especially if logging configurations are not adequately set. The detection logic assumes that legitimate administrators would not invoke EFS RPC calls frequently; however, oversight of legitimate administrative tasks could lead to false positives. Proper configurations for dce_rpc logging and monitoring for SMB, Kerberos, and RDP traffic are critical for successful detection.

