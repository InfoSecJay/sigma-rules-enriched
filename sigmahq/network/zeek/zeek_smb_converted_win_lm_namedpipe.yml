note: |
  ### Technical Context

  This rule detects the use of newly observed remote named pipes that do not match known benign patterns, particularly those associated with lateral movement and remote execution. Likely adversary objectives include executing commands on remote systems, facilitating data exfiltration, or escalating privileges. This behavior relates to the MITRE ATT&CK tactic of Lateral Movement and the technique T1021.002 (Remote Services: Samba/Windows Named Pipes).

  The primary telemetry sources are Zeek logs, specifically related to SMB file access. In the context of compromise, successful detection may indicate an attacker is attempting to exploit operational network functionality for unauthorized access. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate applications may also use named pipes for inter-process communication.

  ### Investigation Steps

  - **Review named pipe access logs:** Analyze Zeek SMB file logs, looking for Event ID 1 entries with path containing `\\\\*\\IPC$`. Identify the remote host and compare with known infrastructure (e.g., AD, servers).

  - **Check against known benign named pipes:** Validate the detected named pipes against a list of confirmed benign pipes within your environment. Legitimate pipes often include well-documented system services like 'srvsvc' and 'lsarpc'.

  - **Identify unusual remote hosts:** Look for host connections that don't match the normal patterns. Malicious indicators include newly connected workstations or servers (e.g., Event ID 4624 showing logon types like 3 or 4). Cross-reference with the asset inventory.

  - **Track subsequent network communications:** Monitor for further suspicious activities originating from the identified remote connections, such as attempts to access administrative shares or execution of binaries, using tools such as Sysmon Events (ID 1 for process creation).

  - **Validate against threat intelligence:** Crosscheck the identified named pipes with threat intelligence feeds that may highlight known malicious named pipes or patterns associated with advanced attacks, focusing on any correlations with ongoing incidents or adversary techniques.

  ### Prioritization

  This alert has a high severity due to the potential impact on critical systems, as it indicates possible lateral movement or remote execution. The likelihood of abuse is elevated given that named pipes can be used by attackers to traverse networks stealthily, and similar patterns are commonly observed in advanced threat operations.

  ### Blind Spots and Assumptions

  This detection may not capture all malicious uses of named pipes, especially if attackers use custom or newly created pipes that are not already on the exclusion list. It requires complete and accurate logging from Zeek to ensure reliable detection. Legitimate activities, such as application updates or inter-process communications by authorized applications, may generate false positives. A companion detection worth monitoring is Sysmon's process creation and network connections which may provide further context around the use of these named pipes.

