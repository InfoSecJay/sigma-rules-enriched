note: |
  ### Technical Context
  This detection rule identifies newly observed remote named pipes accessed via the SMB protocol, specifically targeting the IPC$ share in Windows environments. Named pipes are a Windows inter-process communication mechanism that can be abused in lateral movement scenarios, allowing an attacker to execute commands on a remote host without using more traditional methods like RDP or ssh. By filtering out known legitimate named pipes, the rule aims tosurface anomalous activities that may signal an attack.

  In this context, attackers may seek to move laterally within the network to access sensitive resources or execute malicious payloads on other systems. Common objectives could include credential theft, data exfiltration, or establishing persistence within the network. The rule aligns with the MITRE ATT&CK framework, particularly the "Lateral Movement" tactic (ID: TA0030) and the technique "Remote Services: Named Pipe" (ID: T1021.002).

  Best evidence for this detection will primarily come from Zeek's logs of SMB file service activity, giving security teams insight into potential unauthorized access to named pipes.

  ### Investigation Steps
  - **Review Zeek SMB Logs**: Analyze the SMB file activity logs generated by Zeek for any entries that indicate access to newly observed named pipes. Pay special attention to the IPC$ share, as this is a common target for lateral movement.

  - **Correlate with Process Activity**: Cross-reference any identified named pipe usage with process creation events to identify suspicious processes and potential parent-child relationships, which can help clarify the context of the actions taken.

  - **Assess Network Connections**: Look at network connections and correlating source IP addresses to determine if there are any unexpected remote accesses or patterns that may indicate lateral movement. Verify if the access is coming from legitimate internal systems or outside threats.

  - **Check for Known Filters and Exclusions**: Ensure that your detection logic properly excludes known legitimate named pipes and examine the configurations to confirm that those filters are up-to-date, reducing the risk of false positives.

  ### Prioritization
  This alert is classified as high severity due to the potential for attackers to move laterally within the network undetected, which poses a significant risk to sensitive data and overall enterprise security. Quick identification and remediation of such activities can prevent further compromise.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots related to named pipes that have not been excluded or newly introduced legitimate pipes that mimic unusual behaviors. It assumes that the SMB logs are properly collected and monitored by Zeek, without any gaps in logging configurations. Lastly, the detection relies on the assumption that all known legitimate named pipes are appropriately filtered, thus any newly introduced legitimate pipes not accounted for could lead to false positives.

