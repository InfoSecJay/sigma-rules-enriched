note: |
  ### Technical Context

  This rule detects potential credential dumping activities leveraging Impacket's SecretDump, a tool used by attackers to extract credentials from Active Directory environments. The primary objective of the attacker is to steal credentials for lateral movement and privilege escalation within a network. It aligns with the MITRE ATT&CK techniques for credential access, specifically T1003.002 (Credentials from LSASS) and T1003.003 (Credentials from Cached Files). The rule analyzes Zeek logs for SMB file access patterns that match specific characteristics associated with credential dumping.

  The primary telemetry source is Zeek's SMB logs, specifically targeting file paths and names that suggest unauthorized access to sensitive files, particularly in the ADMIN$ share and the SYSTEM32 directory. If this detection is valid, it indicates compromised credentials and an elevated risk of further network compromise. However, this detection alone does not confirm that a credential dump has been successfully executed or that the identified user or system is malicious.

  ### Investigation Steps

  - **Verify SMB access details**: Check Zeek logs for Event IDs related to SMB traffic (e.g., SMB logs) for entries containing 'ADMIN$' and 'SYSTEM32\\' to identify the source IP and usernames involved.

  - **Correlate with user activity**: Review the context surrounding the identified SMB accesses to ensure they align with expected administrative activities. Look for legitimate access logs from users (e.g., Windows Event ID 4663 access to the ADMIN share) corresponding to workstation roles.

  - **Identify high-confidence indicators**: Look for the presence of temporary files with a '.tmp' extension in the SYSTEM32 directory accessed via SMB. Record the timestamp, source/destination IPs, and the user account being used to facilitate investigation.

  - **Assess for additional telemetry**: Review security and application logs (Windows Event Logs, particularly Event ID 4624 and Event ID 4672 for logon events) to confirm if the user account showing suspicious SMB activity was involved in any recent logon events, especially in unexpected locations.

  - **Document legitimate usage patterns**: Note that legitimate administrative tasks often involve regular access to the ADMIN$ share for legitimate software updates and patches. These should occur during scheduled maintenance periods and involve recognized IT personnel.

  ### Prioritization

  This alert is of high severity due to the potential for significant impact if an attacker succeeds in credential dumping. The likelihood of such techniques being leveraged against enterprise systems is high, as they are commonly used in modern cyberattack scenarios. Credential dumping is a foundational step for lateral movement, making this behavior critical to investigate promptly.

  ### Blind Spots and Assumptions

  Detection is limited because attackers may use different tools or methods to dump credentials, bypassing this specific detection. Ensure that Zeek is correctly configured to log all SMB traffic to catch relevant artifacts. Additionally, legitimate backup or maintenance scripts accessing SYSTEM32 via ADMIN$ may trigger this alert. A related detection to strengthen coverage could include monitoring Windows Event Logs for unusual authentication attempts or failed login patterns that correlate with the SMB access detected.

