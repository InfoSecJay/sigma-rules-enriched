  ### Technical Context

  This Sigma rule detects DNS requests containing the keyword "seed" directed at the domain ".nkn.org". Such requests are indicative of potential adversary communication attempts using the New Kind of Network (NKN), a decentralized networking service that can serve as a command-and-control (C2) channel. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically the technique of Application Layer Protocol (T1071).

  The primary telemetry sources involved are Zeek logs, specifically DNS request logs. If malicious, this behavior could signal an attempt to establish a covert communication channel with a compromised asset or to retrieve commands. It should be noted that this detection does NOT confirm that the activity is malicious without additional context, as legitimate services may also initiate similar DNS requests.

  ### Investigation Steps

  - **Review DNS request logs**: Examine Zeek DNS logs for Event ID indicating requests to `*.nkn.org`. Focus on timestamps, source IP addresses, and the full DNS query string.
  - **Identify patterns of suspicious behavior**: Look for multiple requests to `.nkn.org` from a single source IP or unusual source IPs initiating substantial upstream traffic, which could indicate intended C2 activity.
  - **Assess potential benign behavior**: Cross-reference the requesting host's activity around known legitimate uses of NKN technology or applications that may legitimately resolve these DNS requests.
  - **Check for correlating network traffic**: Analyze network traffic logs for subsequent outbound connections on unusual ports or addresses associated with `.nkn.org` after the DNS resolution; suspicious connections should correlate with the DNS query.
  - **Determine asset criticality**: Evaluate the importance of the affected host. If it is a high-value asset, escalate your investigation to include endpoint analysis for additional signs of compromise.
  - **Look for known IOCs**: Search for any known Indicators of Compromise (IOCs) related to NKN, particularly IPs or hashes associated with malicious deployments, which could corroborate a malicious intent behind the request.

  ### Prioritization

  Although flagged as low level, alerts related to command and control activities should always be treated with caution due to the potential impact on critical systems. While the likelihood of abuse from this specific service is low without additional context, the use of DNS for persistence and communication is a common tactic among sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications using NKN, leading to false positives. Full visibility requires comprehensive logging of all DNS queries from network and endpoint devices to properly assess context. Additionally, other DNS requests not captured in this rule may indicate further layers of potential C2 infrastructure; thus, correlating this detection with alerts targeting other known C2 channels enhances overall coverage.

