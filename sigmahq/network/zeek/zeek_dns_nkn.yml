  ### Technical Context
  This rule detects DNS requests directed towards domains associated with the New Kind of Network (NKN), a decentralized networking service that operates on blockchain technology. While NKN can be used for legitimate purposes like decentralized applications, it may also be exploited by threat actors to establish command and control (C2) channels. The detection occurs when requests contain specific keywords such as "seed" combined with the ".nkn.org" domain, indicating potential nefarious activity.

  Attackers may leverage NKN for covert communication with compromised hosts, seeking to evade traditional detection mechanisms. The potential objectives include maintaining persistence in an environment, exfiltrating data, or controlling infected systems. This aligns with several MITRE ATT&CK techniques, particularly "Command and Control" (TA0011) strategies involving non-standard protocols and domains. The primary data source for this detection exists within DNS Query logs, particularly from systems like Zeek, which capture detailed DNS traffic for analysis.

  ### Investigation Steps
  - **Review DNS Logs:** Analyze Zeek DNS logs for outbound queries containing the keywords "seed" and ".nkn.org." Look for patterns or anomalies in the request volume and context of the queries.

  - **Correlate with Host Activity:** Identify the source IPs making these DNS requests and cross-reference them with host activity logs to determine if they show signs of compromise or suspicious behavior.

  - **Monitor Related Traffic:** Inspect related network traffic patterns originating from the same host(s) that made the DNS requests. Look for unusual outbound connections leveraging other non-standard ports or protocols.

  - **Assess for Anomalous Behavior:** Evaluate any potential lateral movement or privilege escalation attempts associated with the identified hosts, especially if they correlate with established communication sessions to NKN domains.

  ### Prioritization
  The alert is flagged as low severity due to its isolated nature, meaning it requires additional contextual information to ascertain the actual threat level, particularly the potential for false positives from legitimate services utilizing the NKN framework.

  ### Blind Spots and Assumptions
  This detection logic may miss other C2 communications if they do not employ the specific DNS queries or if the threat actor alters or obfuscates their method of operation. It assumes that DNS logs are intact and being actively monitored, alongside proper logging configurations in place for Zeek to capture these relevant events. Additionally, organizations may lack visibility into encrypted traffic or other forms of obscure C2 communications, which could limit detection efficacy.

