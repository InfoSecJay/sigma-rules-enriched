note: |
  ### Technical Context

  This Sigma rule detects potentially unauthorized access to sensitive file extensions often associated with email client data, backup files, and sensitive system data (e.g., PST, OST, and KIRBI files). The behavior identified suggests an attempt by attackers to collect sensitive information from compromised machines or retrieve credential files, leading to potential data exfiltration. This activity aligns with the MITRE ATT&CK tactic "Collection" (T1056) and accompanying technique "Credential Dumping" (T1003).

  The primary telemetry source is Zeek logs related to SMB file access, capturing requests for files with specified extensions. The security impact of malicious access involves potential data breaches and unauthorized retrieval of sensitive company data. Importantly, this detection does NOT confirm malicious intent or execution, as legitimate users may access these file types for various operational purposes.

  ### Investigation Steps

  - **Check Zeek SMB logs for access requests:** Review Zeek logs, particularly 'smb_files' for any request to access files with sensitive extensions (e.g., `.pst`, `.ost`). Log fields of interest include `file.name`, `src_ip`, and `dst_ip`.

  - **Identify user roles and access patterns:** Cross-reference the requests against user roles—determine if the accessing user is authorized to handle sensitive files. Investigate usages from categories like admins versus regular users.

  - **Scope out legitimate use cases:** Verify if the access coincides with expected activities, such as backups performed by help desk operators or scheduled tasks from backup software, recorded with timestamps for ease of correlation.

  - **Correlate with authentication logs:** Check for any corresponding authentication events in your Windows Security Event logs (Event ID 4624) that might indicate whether the access is associated with legitimate user logins or suspicious account behavior.

  - **Look for repeated attempts or unusual access patterns:** Determine if there are multiple access attempts from a single user or IP address within a short period, which could indicate malicious intent. Anomalous timestamps should trigger deeper investigations.

  ### Prioritization

  This alert is considered medium severity due to its potential impact on sensitive information exposure and the likelihood of targets being weaponized by adversaries. Access to sensitive file types is uncommon and typically indicates either a backup operation or an unauthorized attempts to exfiltrate sensitive data.

  ### Blind Spots and Assumptions

  Detection is limited by legitimate activities that also trigger this alert, such as backup jobs or troubleshooting operations by IT staff. Ensuring Zeek is properly configured to log SMB file access is crucial for reliable detection. Validating logs for file access patterns while considering legitimate access, such as that by help desk operators, will help mitigate false positives. A related detection rule focusing on anomalous login behaviors can bolster overall detection capability and context.

