note: |
  ### Technical Context
  This rule detects access to sensitive file extensions that are commonly associated with email and data storage applications, such as Microsoft Outlook PST and OST files, backup, and dump files. The detection leverages Zeek's monitoring capabilities of SMB file activity to observe when these potentially sensitive files are accessed, which could indicate unauthorized data access, exfiltration, or lateral movement within the enterprise.

  The likely attacker objectives may include acquiring sensitive information, such as emails or backup data, which could be leveraged for further attacks, including phishing or social engineering. This behavior aligns with the MITRE ATT&CK framework, notably under the tactic of **Collection** (TA0009). Specifically, techniques like **Data from Information Repositories** (T1213) and **Data Staged** (T1074) are implied as attackers may collect and stage data for exfiltration.

  The primary data source for this rule is generated through Zeek's SMB files service, enabling visibility into file access patterns and potential anomalies concerning sensitive data types.

  ### Investigation Steps
  - **Review Zeek SMB Logs**: Check the Zeek logs where access to sensitive file extensions is recorded. Look for patterns of access that are inconsistent with typical user behavior or outside of business hours.

  - **Analyze User Context**: Identify the user accounts accessing these files. Determine if the user has a legitimate business need for accessing this data or if their access patterns suggest a potential compromise.

  - **Monitor for Unusual Network Activity**: Investigate any unusual outbound connections that coincide with access to the sensitive files. Look for large data transfers or connections to unrecognized external IP addresses.

  - **Correlate with Other Data Sources**: Enrich your investigation by cross-referencing with user activity logs from other security tools such as EDR or SIEM. Look for related alerts that might indicate a more extensive compromise or data theft.

  ### Prioritization
  This alert is deemed of medium severity due to the potential impact of sensitive data exposure and the moderate likelihood of unauthorized access. Given that these file types could harbor critical information, immediate investigation is warranted to mitigate risks.

  ### Blind Spots and Assumptions
  A notable gap in detection coverage may stem from the legitimate access patterns of users, such as help desk operators performing backups or re-imaging workstations, which can lead to false positives. The effectiveness of this rule assumes that Zeek is properly deployed and configured to monitor SMB traffic thoroughly. Additionally, legitimate business processes involving sensitive file extensions may not be adequately filtered out, potentially impacting the rule's false positive rate.

