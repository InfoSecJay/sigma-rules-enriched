note: |
  ---

  ### Technical Context

  This Sigma rule detects DNS queries that are associated with known cryptocurrency mining pool domains. The likely attacker objective is to leverage compromised machines for cryptojacking or unauthorized cryptocurrency mining activities. This behavior fits within the MITRE ATT&CK framework under the tactic of Execution and the technique T1569.002 (Container Deployment). Primary telemetry sources required for this detection include DNS logs collected by Zeek, focusing specifically on query details. If malicious, this activity can lead to resource abuse, increased cybersecurity risks, and potential reputational damage for the organization. This detection alone does NOT confirm actual mining activity; it only indicates potential intent based on DNS lookups.

  ---

  ### Investigation Steps

  - **Review DNS query log details**: Examine Zeek DNS logs (specifically the `dns.log` file) for queries matching the listed mining pool domains. Validate the `query` field against the known mining domains to identify potential threats.

  - **Check for response validation**: Assess the `answers` field in the DNS logs. If the response matches known malicious IPs (excluding `127.0.0.1` and `0.0.0.0`), it could indicate successful resolution and warrant further investigation.

  - **Correlate with network connections**: Review Zeek connection logs (`conn.log`) to check for outgoing connections to the resolved IP addresses. Pay attention to unusual outbound traffic patterns that may indicate illicit mining activities.

  - **Identify legitimate DNS query patterns**: Compare the alerting DNS queries against expected behavior within the environment. Legitimate business operations may include infrastructure monitoring, cloud management, or software updates from trusted domains.

  - **Verify subsequent HTTP/S activity**: Inspect HTTP logs from Zeek (`http.log`) for connections initiated to the queried domains. Check the `host` field to look for suspicious requests related to those domains, which may confirm mining activity.

  - **Assess for evasion attempts**: Document any distinct patterns indicating users attempting to filter or manipulate DNS queries for evasion. Analyze logs for dynamic DNS lookups (e.g., `mooo.com`) that might not directly correlate with malicious behavior but can create false positives.

  ---

  ### Prioritization

  The alert has a low severity due to the probability of benign DNS lookups and the mixed usage of mining domains in legitimate services. However, given the resource abuse risk and the potential for widespread exploitation through cryptojacking, it should be monitored closely, especially in high-value environments or systems.

  ---

  ### Blind Spots and Assumptions

  This detection can be evaded by using domain generation algorithms or obscure domain variations that may not be included in the rule. Effective detection relies on comprehensive DNS logging and may not trigger on ephemeral DNS queries. Legitimate activities such as cloud-based services may inadvertently trigger alerts if they query similar domains. A companion detection such as monitoring for increased CPU usage on machines for abnormal activity (e.g., high usage patterns aligning with unique processes) can enhance detection coverage.

