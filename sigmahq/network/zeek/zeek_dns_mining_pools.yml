falsepositives:
- A DNS lookup does not necessarily  mean a successful attempt, verify a) if there
  was a response using the zeek answers field, if there was then verify the connections
  (conn.log) to those IPs. b) verify if HTTP, SSL, or TLS activity to the domain that
  was queried. http.log field is 'host' and ssl/tls is 'server_name'.
level: low
note: |
  ### Technical Context
  This detection rule identifies clients performing DNS lookups associated with known cryptocurrency mining pools, specifically targeting Monero. The rule scans DNS query logs for entries that match the domains of various mining pools, which may indicate that an endpoint on the network is involved in or attempting unauthorized mining activities. Cryptocurrency mining can be a resource-intensive process that may indicate an attacker’s objectives to generate illicit profits by utilizing organizational resources without consent.

  The relevant MITRE ATT&CK tactics and techniques included are **Execution** (T1047 - Windows Management Instrumentation) and **Impact** (T1496 - Resource Hijacking). Attackers often use compromised systems or misconfigured devices to mine cryptocurrencies, putting additional strain on network resources and leading to potential data breaches or system degradation.

  Primary data sources for this detection include **DNS query logs** which can provide visibility into the namespaces being resolved by network clients. Additionally, logs from tools like Zeek can offer context around connection behavior, supplementing DNS query data with network activity insights.

  ### Investigation Steps
  - **Review DNS Query Logs**: Check the DNS logs for queries ending with the specified domains. Pay close attention to the frequency and patterns of these queries to identify potential mining activity.
  - **Correlate with Network Connections**: Use network traffic data (e.g., from Zeek) to track outbound connections to the identified mining pool IP addresses. Analyze whether any such connections were established and their nature.
  - **Examine Related HTTP/SSL/TLS Activity**: Look for related HTTP or SSL/TLS activity to the queried domains. Investigate 'http.log' and 'ssl.log' for evidence of any communication that took place after the DNS resolution that could indicate mining activity.
  - **Investigate the Endpoint's Resource Utilization**: Assess the resource consumption on endpoints associated with the queries. High CPU usage or unusual process activity may indicate that mining software is running.

  ### Prioritization
  This alert is assigned a low severity due to the nature of the activity being detected; while unauthorized mining can impact system performance and resource availability, it does not immediately indicate a breach or data compromise. However, sustained or widespread activity could point to more significant issues, such as malware infestation.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include domains that could be newly created or not widely known, hence not included in the predefined list. The detection logic assumes that malicious actors will use the specified domains to facilitate mining without advanced evasion techniques. Correct functioning of this alert relies on comprehensive DNS logging from Zeek, and it may be less effective if DNS traffic is encrypted or if logs are not retained for sufficient time.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
