note: |
  ### Technical Context
  This detection rule identifies the transfer of files that may contain sensitive credential data across network shares, specifically monitoring SMB file transfers. The presence of files with well-known names such as `lsass.dmp`, `ntds.dit`, or `sam` could indicate an attacker exfiltrating sensitive credential material or attempting to gather password data to facilitate unauthorized access in a Windows environment. The objective of such activity is typically to compromise user accounts, elevate privileges, or expand control over the network.

  Relevant MITRE ATT&CK tactics include:
  - Credential Access (TA0006)
    - Credential Dumping (T1003.001)
    - Credential Dumping: LSASS Memory (T1003.002)
    - Credential Dumping: Security Account Manager (T1003.003)

  The primary data sources for this detection include Zeek logs related to SMB file transfers. This telemetry is critical for identifying potentially malicious file transfer activities that could signify credential theft efforts.

  ### Investigation Steps
  - **Review SMB File Transfer Activities**: Examine Zeek logs for any transfers involving suspicious filenames such as `lsass`, `sam`, `ntds.dit`, and other credential data files. Ensure to check the timestamps and originating IP addresses of these transfers.

  - **Analyze Associated User Accounts**: Investigate the user accounts initiating these file transfers. Look for patterns of access that deviate from normal behavior, particularly focusing on accounts with elevated privileges or those not typically associated with administrative tasks.

  - **Check for Anomalous Network Shares**: Identify and evaluate any unusual or unauthorized network shares that might be utilized for transferring sensitive files. Assess the permissions and access logs for those shares to determine if legitimate or malicious actors have accessed them.

  - **Correlate with Other Security Events**: Look for other security alerts or events surrounding the time of the file transfers. Cross-reference login attempts, failed access events, or any activities that might indicate the preceding steps of credential exploitation, such as enumeration or attacks against other services.

  ### Prioritization
  Alerts generated from this detection rule should be considered of medium severity due to the high impact of credential theft, which could lead to significant security breaches if exploited. The likelihood of such behavior in an enterprise environment where file shares are commonplace elevates the need for prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate administrative activities that involve transferring sensitive files, potentially leading to false positives. The detection logic assumes that attackers will utilize known filenames related to credential data, which may not always be the case. Additionally, the effectiveness of this alert relies on having properly configured Zeek logs capturing SMB transfers; any misconfiguration or lack of logging could result in undetected malicious activity.

