  ---

  ### Technical Context

  This Sigma rule detects the transfer of files containing sensitive credential data (e.g., LSASS, SAM, NTDS.dit) over network shares, primarily through SMB traffic monitored by Zeek. The likely attacker objective is to extract sensitive authentication credentials for lateral movement or privilege escalation. Relevant MITRE ATT&CK techniques include Credential Dumping (T1003.001, T1003.002) and SMB/Windows Credential Access (T1003.003). The primary telemetry source is Zeek's SMB file transfer logs, focusing on the filenames specified in the detection criteria. If malicious, the security impact could be severe, potentially leading to unauthorized access across the enterprise environment. This detection does NOT confirm that an attacker has successfully obtained credentials; it only identifies the transfer of specific files.

  ---

  ### Investigation Steps

  - **Check Zeek SMB logs for suspicious file transfers:** Review SMB logs in Zeek for instances where files named `lsass`, `sam`, `ntds.dit`, or related are transferred. Focus on Event ID details in Zeek logs (e.g., `smb.files.transferred`).

  - **Identify expected administrator activity:** Confirm legitimate administrative context by checking for known administrator accounts that may transfer sensitive files as part of maintenance or troubleshooting, ensuring they don't access the identified files excessively or outside typical hours.

  - **Correlate with authentication logs:** Check Windows Security Event ID 4663 for file access attempts and Event ID 5145 for Share Object Access to validate if sensitive files were accessed prior to the transfer, indicating potential malicious intent.

  - **Investigate unusual file access patterns:** Look for anomalous access patterns from non-administrative accounts or from systems not typically used for administrative purposes. Identify anomalous behaviors and correlate with network traffic analysis.

  - **Assess network traffic during file transfers:** Use network flow logs to evaluate the direction and frequency of transfers involving sensitive files. High volume or patterns indicative of automation from individual hosts should be marked for further analysis.

  ---

  ### Prioritization

  This alert has medium severity due to the potential of sensitive credential exposure. The systems affected are often critical within the environment. However, the likelihood of malicious abuse is moderate since legitimate administrative transfers can also trigger the rule.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations for SMB traffic or due to encrypted SMB sessions, making file names invisible. Legitimate administrative tasks may mask real threats, and it’s essential to have context from identity management logs. Companion detections, such as those monitoring for unusual account behaviors or privilege escalation attempts, can provide additional context to strengthen overall security posture.

