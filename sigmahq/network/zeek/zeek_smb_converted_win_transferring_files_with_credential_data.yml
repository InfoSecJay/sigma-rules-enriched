note: |
  ### Technical Context

  This Sigma rule detects the transfer of files with well-known filenames associated with credential data using SMB network shares. Attackers may seek to obtain sensitive information, specifically credentials, for lateral movement or privilege escalation within a compromised environment. This behavior aligns with the MITRE ATT&CK techniques for Credential Dumping, specifically Techniques T1003.001 (LSASS Memory), T1003.002 (Security Account Manager), and T1003.003 (NTDS).

  The primary telemetry source comes from Zeek logs specific to SMB file activity. If malicious, this could enable an attacker to escalate privileges or carry out further attacks on the network. However, this detection does NOT confirm the intent behind the file transfer, as legitimate administrative activities can trigger similar alerts.

  ### Investigation Steps

  - **Review SMB transfer logs:** Validate any SMB file transfer events from Zeek (e.g., SMB log entries). Look for event details including the `name` field that involves sensitive filenames such as "\mimidrv" or "\lsass".

  - **Identify the source and destination IPs:** Check for unusual internal IP addresses or external IP communications in the Zeek logs. Malicious activity may originate from non-administrative hosts communicating with sensitive or critical systems.

  - **Correlate with user activity:** Cross-reference timestamps with user activity logs, such as Windows Event ID 4624, which records successful logins. A mismatch between administrative user access and the transferred files indicates a potential breach.

  - **Assess legitimate transfers:** Note that system administrators may legitimately transfer files like “\security” or “\ntds.dit” during maintenance work. Document the user and context for such activity.

  - **Analyze file contents:** If practical, review the contents of transferred files against known credential storage formats or data types. Malicious indicators include decrypted password hashes or plaintext credentials.

  - **Flag suspicious patterns:** Look for repeat occurrences or patterns in the SMB share access that may indicate automated credential dumping tools (e.g., any use of filenames frequently reported in credential dumping cases).

  ### Prioritization

  This alert should be treated with medium severity, given that it involves potentially sensitive credential data. The presence of such transfers in environments with critical asset exposure significantly increases the risk of an attacker successfully exploiting these credentials. Additionally, the common weaponization of SMB for credential harvesting escalates the urgency for thorough investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for file names to overlap with legitimate administrative activities, potentially generating false positives. Reliable detection relies on comprehensive Zeek SMB logs and contextual user behavior analytics. Legitimate activities that could trigger alerts include routine administrative tasks by authorized personnel. Companion detections that enhance coverage include monitoring for unusual login activity or process creation events (e.g., Windows Event ID 4688 indicating possible execution of unauthorized credential dumping tools).

