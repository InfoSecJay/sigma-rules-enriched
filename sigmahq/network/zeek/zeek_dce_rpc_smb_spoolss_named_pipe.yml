note: |
  ### Technical Context

  This Sigma rule detects the use of the `spoolss` named pipe over Server Message Block (SMB) communications, specifically when targeted at the `IPC$` share. This behavior is often tied to lateral movement within a network, as adversaries exploit the `spoolss` pipe to authenticate to machines with the spool service enabled using NTLM credentials. The relevant MITRE ATT&CK technique this rule pertains to is **Lateral Movement: Windows Admin Shares (T1021.002)**.

  The primary telemetry source for this detection is SMB traffic logs from Zeek, focusing on captured SMB file and authentication events. If the detected behavior is malicious, it could allow an attacker to gain unauthorized access to sensitive systems or data. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate domain controller functions may also trigger this rule.

  ### Investigation Steps

  - **Examine Zeek SMB logs for `spoolss` connections**: Look for specific entries in SMB logs that involve the named pipe `spoolss` and target the `IPC$` share. Analyze the source and destination IP addresses for expected machine communications.

  - **Identify high-confidence malicious indicators**: Check for connections where the source IP is not a known server or user that typically interacts with `spoolss`, especially if associated with unusual authentication attempts from external or insider sources.

  - **Review domain controller (DC) functionalities**: Determine if the domain controllers in question are legitimately configured to handle printing services or if they should not be acting as print servers, as this could contribute to benign noise in your logs.

  - **Validate expected behaviors**: Assess if legitimate print jobs or administrative tasks are linked to the uses of the `spoolss` pipe over SMB, and verify timings and users involved in such tasks to differentiate between benign and suspicious use.

  - **Correlate with other authentication logs**: Review Windows Security Event ID 4624 (Logon) and Event ID 4648 (Logon attempt using explicit credentials) to correlate any authentication sessions utilizing NTLM that also reference the `spoolss` pipe interactions mentioned in the Zeek logs.

  - **Check for unusual volumes of IPC traffic**: Monitor SMB traffic patterns for indications of excessive or anomalous usage of `spoolss`, especially in off-hours or from unexpected systems, as this can signify malicious attempts to leverage this named pipe for lateral movement.

  ### Prioritization

  This alert is of medium severity due to the potential for lateral movement and unauthorized access that could compromise critical systems, particularly if it involves a domain controller. The likelihood of malicious abuse is significant if such behavior is detected outside of normal operations, especially since `spoolss` exploitation is documented as a tactic for credential theft.

  ### Blind Spots and Assumptions

  The primary detection limitation is that legitimate administrative tasks may trigger this alert, contributing to potential false positives from domain controllers acting as print servers. Reliable detection requires accurate configurations of Zeek logs and may miss activity if SMB logging is not comprehensive. Activities such as routine administrative SMB interactions may also cause legitimate alerts. A related detection to strengthen coverage could include tracking NTLM authentication failures or unusual account behavior (e.g., sudden increases in failed logins) across the environment.

