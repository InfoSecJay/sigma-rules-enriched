note: |
  ### Technical Context
  This detection rule identifies the use of the `spoolss` named pipe over SMB, which is associated with remote print server management in Windows. Attackers may leverage this functionality to authenticate to machines with NTLM, especially in environments where unsecured delegation is possible, which can lead to lateral movement across the network. By manipulating the spooler service, an attacker can potentially escalate privileges and access sensitive resources, making this a critical indicator of malicious activity.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Lateral Movement** (TA0008)
    - **Technique T1021.002: SMB/Windows Admin Shares**: This technique highlights how attackers can use SMB shares, alongside named pipes like `spoolss`, to interact with remote systems.

  Primary data sources for this detection include network logs capturing SMB traffic (e.g., Zeek logs), which provide insights into all SMB communications, allowing analysts to track unexpected usage of named pipes.

  ### Investigation Steps
  - **Review SMB Traffic Logs**: Analyze Zeek SMB logs for instances where the `spoolss` named pipe is accessed. Specifically, focus on connections to `IPC$` shares and the context of the connections.
  - **Check for Anomalous Behavior**: Look for unusual patterns that deviate from expected usage, such as access from non-admin accounts or from unexpected workstations, indicating possible lateral movement.
  - **Investigate Authentication Records**: Examine authentication logs for NTLM challenges related to the `spoolss` pipe, particularly noting the originating hosts and any credential reuse.
  - **Correlate with Other Activities**: Cross-reference findings with other logs (e.g., Process Creation events and EDR data) to identify any associated malicious behaviors or tools that may corroborate the use of the `spoolss` named pipe.

  ### Prioritization
  The alert's severity is considered medium due to the proximity of the detected activity to privilege escalation and lateral movement tactics, which can result in significant compromises if successful. While the likelihood of such activity occurring in a well-secured environment may be lower, the potential impact on network security is substantial.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where logging of SMB traffic is not enabled, possibly missing genuine intrusions. The detection assumes that traffic analysis is being conducted and that the spooler service is not regularly misused in benign operations, like by legitimate print servers. Additionally, if the logs do not include the necessary details regarding named pipe usage, this rule may not function effectively. Continuous monitoring and appropriate configurations must be ensured for optimal detection capability.

