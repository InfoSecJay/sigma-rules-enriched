logsource:
  product: zeek
  service: kerberos
detection:
  selection:
    request_type: 'TGS'
    cipher: 'rc4-hmac'
  computer_acct:
    service|startswith: '$'
  condition: selection and not computer_acct
falsepositives:
- Normal enterprise SPN requests activity
level: medium
note: |
  ### Technical Context
  This rule detects Kerberos Ticket Granting Service (TGS) requests made using RC4 encryption, a behavior commonly associated with kerberoasting attacks. Kerberoasting is a technique where an attacker attempts to extract service account credentials from TGS tickets, which are requested for services that utilize Kerberos authentication. The attacker’s aim is usually to obtain these TGS tickets in order to crack the RC4-encrypted passwords offline, thereby gaining unauthorized access to sensitive resources.

  Relevant MITRE ATT&CK tactics include "Credential Access" (TA0006) and the technique "Kerberoasting" (T1558.003), both of which describe actions where adversaries aim to obtain valid credentials and take advantage of weak or easily guessable service account passwords. The primary data source for this detection is Kerberos ticket request logs, specifically monitored through tools like Zeek that can capture and analyze Kerberos network traffic.

  ### Investigation Steps
  - **Review Kerberos Logs:** Analyze Zeek Kerberos logs for TGS requests indicating the use of RC4 encryption. Focus on entries where the service principal name (SPN) is prefixed with a dollar sign ($), as these requests pertain to service accounts.

  - **Identify Unusual Activity:** Check for abnormal spikes in TGS requests or frequent requests for certain service accounts, which may suggest enumeration or reconnaissance activities common in kerberoasting scenarios.

  - **Inspect Account Behavior:** Investigate the accounts requesting tickets to determine if they are legitimate service accounts within your organization. Ensure that these accounts are not compromised by cross-referencing them with known baselines of usage.

  - **Validate Password Strength:** Review the password policies for service accounts involved in TGS requests. Assess if passwords follow best practices and are sufficiently complex to deter offline cracking methods.

  ### Prioritization
  The severity of this alert is medium due to the potential risk that compromised service account credentials pose to an enterprise. Successful kerberoasting can enable attackers to gain unauthorized access to sensitive systems and data, highlighting the importance of monitoring and responding to unusual Kerberos traffic.

  ### Blind Spots and Assumptions
  This detection may miss legitimate TGS requests that utilize strong encryption methods or involve non-standard behavior from service accounts. The rule assumes that all TGS requests using RC4 encryption for service accounts are suspicious, which may not always be the case in environments with normal operational activities. Additionally, proper logging configurations and monitoring of Kerberos traffic through tools like Zeek are necessary for the effectiveness of this detection, and any gaps in these configurations could hinder the alert's functionality.

