note: |
  ### Technical Context

  This Sigma rule detects Kerberos Ticket Granting Service (TGS) requests that utilize RC4-HMAC encryption, a behavior often associated with Kerberoasting attacks. The possible attacker objective is to extract service account credentials from Kerberos tickets that have been encrypted using the weaker RC4 cipher, which can be exploited to obtain plaintext passwords through offline cracking methods. This behavior falls under the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique of Kerberoasting (T1558.003).

  The primary telemetry source for this detection is Zeek logs detailing Kerberos traffic, specifically monitoring for TGS requests that use the RC4 cipher. If found malicious, this behavior can allow an adversary to gain unauthorized access to sensitive services. However, it is important to note that this detection does NOT confirm a successful Kerberoasting attack on its own, as legitimate service accounts may also use RC4 in non-malicious contexts.

  ### Investigation Steps

  - **Review Kerberos logs for TGS requests:** Examine Zeek logs for events matching the request_type 'TGS' and cipher 'rc4-hmac'. Look for unexpected accounts or patterns such as repeated requests for the same SPN.

  - **Identify vulnerable accounts:** Cross-reference detected TGS requests with known service accounts. Flag any accounts using SPNs that have weak or easily guessable passwords, which increases the likelihood of an attack.

  - **Assess for lateral movement:** Investigate if multiple requests are coming from a single source IP, potentially indicating an automated attack or brute-force approach. Look at surrounding traffic for other suspicious behavior.

  - **Validate benign activity:** Confirm if there are established service accounts that are expected to use RC4. Analyze historical log data to identify baseline traffic patterns and legitimate usage of TGS requests to distinguish normal from suspicious activity.

  - **Document request frequency and anomalies:** Track how often these TGS requests are made. High-frequency requests from accounts that do not typically interact with Kerberos may indicate malicious intent.

  - **Review endpoint security logs:** Check Windows Security Event ID 4769 (Kerberos service ticket requested) around the time of detected TGS requests for additional context, including user identifiers and associated service accounts.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on sensitive systems if compromised. Given that RC4 is widely considered weak, any usage in TGS requests raises the likelihood of malicious exploitation. Kerberoasting is a common tactic used by adversaries, making a proactive response necessary.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate Kerberos requests using RC4, such as those from legacy systems. Effective detection relies on comprehensive logging from Zeek and possible configuration to ensure all relevant Kerberos traffic is captured. Be aware that legitimate applications may trigger similar alerts if they utilize service accounts. Companion detections such as monitoring for frequent failed authentication attempts (Event ID 4771) can further enhance detection capabilities for Kerberos attack behaviors.

