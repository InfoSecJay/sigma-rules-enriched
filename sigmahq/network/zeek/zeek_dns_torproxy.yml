note: |
  ### Technical Context
  This rule detects DNS queries associated with known Tor proxies by monitoring for requests to domains typically used by the Tor network, such as those ending in `.onion` and `.tor2web`. Tor is commonly utilized by cybercriminals to anonymize their activities, obfuscate their location, and bypass network controls. Attackers may leverage Tor proxies to access illicit services, facilitate data exfiltration, or communicate with other compromised systems without revealing their identities.

  Relevant MITRE ATT&CK tactics include **Exfiltration (TA0010)**, where sensitive data could be stolen using these proxies, and **Network Service Discovery (T1048)**, indicating attempts to discover network services that might facilitate or obfuscate their activities. The investigation revolves around detecting unusual patterns in DNS traffic that may indicate nefarious use of the Tor network, which is increasingly important in an enterprise context.

  Primary data sources for this detection include DNS logs captured by network monitoring tools such as Zeek, which provide insights into the DNS queries made from within the organization. These logs will be instrumental in identifying whether users are attempting to connect to Tor-related domains.

  ### Investigation Steps
  - **Review DNS Query Logs:** Examine the DNS logs for any requests that match the specified Tor-related domain patterns. Assess the frequency and source of these queries to identify potential anomalies.
  - **Analyze Related Network Traffic:** Investigate outbound connections from the source IPs associated with the detected DNS queries. Look for unusual traffic patterns or connections to known Tor exit nodes.
  - **Correlate with User Activity:** Check for user activity logs that could explain the behavior of the systems making these DNS requests. This might include times of access and whether the users have a legitimate reason to be connecting to these domains.
  - **Validate Against Threat Intelligence:** Cross-reference the detected domains with threat intelligence sources to see if any of the queried `.onion` or Tor proxy domains are associated with known malicious actors or campaigns.

  ### Prioritization
  This alert has medium severity due to the likelihood that the presence of queries to Tor-related domains indicates potential malicious activity, such as data exfiltration or access to unauthorized services, which can significantly impact the organization's security posture.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage lies in environments where DNS queries are not effectively logged or monitored, especially if DNS requests are routed through external or less secured channels. The detection logic assumes that queries to Tor proxies are unwarranted unless clearly justified, which may not account for legitimate use cases. The availability of comprehensive DNS logging is critical for this alert to function effectively; without it, the detection may miss relevant queries or generate false positives due to user error or misunderstandings about the use of Tor.

