note: |
  ### Technical Context

  This detection rule identifies DNS queries for domains associated with Tor proxies, such as those ending in ".onion" or ".tor2web". The behavior indicates a potential attempt to access anonymized services, which is commonly exploited for various illicit activities, including exfiltration of data or accessing illegal content. The rule corresponds to the MITRE ATT&CK Tactic: Exfiltration (TA0010) and Technique: Exfiltration over Alternative Protocol (T1048). The primary telemetry source is Network DNS logs generated by Zeek, focusing on query types and response fields.

  If malicious, these activities may signal preparations for data exfiltration or communication with a command-and-control infrastructure. However, this detection does NOT confirm actual data exfiltration or malicious intent without additional context and corroborative evidence.

  ### Investigation Steps

  - **Review DNS Logs for Triggering Domains**: Examine Zeek DNS logs for queries matching the following patterns: '.onion', '.tor2web', or any listed in the Sigma rule. Look specifically for Event ID associated with DNS queries to these domains.

  - **Analyze Related Network Traffic**: Investigate the flow logs or PCAP captures associated with the queried domains for unusual outbound connections or large data transfers. Check host outbound connections to ensure there isn't unexpected traffic directed at these anonymized services.

  - **Validate Legitimate Usage**: Determine if the user or host has a legitimate business need for accessing Tor proxy services. Look for previous instances of access and logged user activity pertaining to these services.

  - **Check for Anomalous User Behavior**: Review the user activity surrounding the time of the alert. A user exhibiting unusual login patterns or rapid changes in access rights prior to the DNS queries should be considered a serious risk indicator.

  - **Identify High-Confidence Malicious Indicators**: Focus on users that show multiple queries to various Tor domains or repeated attempts within a short time frame. Cross-reference these with known threat actor behaviors if available.

  ### Prioritization

  The severity of this alert is medium due to the potential for serious security implications if the affected system is a critical asset engaging in sensitive data processing. The likelihood of malicious abuse is high, as Tor services are frequently weaponized for exfiltration and other illicit activities.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate activities, such as research involving Tor or network penetration testing, could trigger this alert. Reliable detection requires properly configured DNS logging and may not capture all possible DNS queries if the logging is incomplete or misconfigured. A related detection focusing on outbound traffic to common C2 IPs could enhance coverage against misuse of anonymized services.

