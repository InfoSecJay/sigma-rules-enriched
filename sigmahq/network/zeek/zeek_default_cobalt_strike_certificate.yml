  ### Technical Context

  This Sigma rule detects the presence of a known default Cobalt Strike certificate in HTTPS traffic, indicative of potential command and control (C2) communication from compromised hosts. The attacker’s objective is likely to establish a covert channel for persistent access and remote control over the victim’s environment. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique of Application Layer Protocol (T1071).

  The primary telemetry source is Zeek (formerly known as Bro), specifically its X.509 certificate logging capabilities, which capture details about certificates presented during HTTPS sessions. If malicious, the security impact could include unauthorized access, exfiltration of sensitive data, or lateral movement within the network. It is crucial to note that this detection does NOT confirm that a Cobalt Strike session is active or that any malicious activity is currently occurring—it merely identifies the use of a known certificate.

  ---

  ### Investigation Steps

  - **Verify certificate details**: Check Zeek X.509 logs for Event ID related to certificate handling (typically logged as "x509") that matches the serial number `8BB00EE`. Identify if the certificate was used for outbound connections or with known malicious IP addresses.

  - **Identify C2 traffic patterns**: Review additional Zeek logs, particularly HTTP and DNS logs, for connections to domains associated with known Cobalt Strike infrastructure. Look for repetitive connections or suspicious URLs that indicate potential command and control attempts.

  - **Assess compromised host behavior**: Investigate the originating host for any additional anomalous behavior such as unexpected process creation (Security Event ID 4688) or network connections to untrusted external IP addresses, which could confirm compromise.

  - **Check for legitimate use cases**: Determine if any known application or service within your environment intentionally uses this Cobalt Strike certificate. Document any valid use case to differentiate between benign activity and potential threats.

  - **Analyze endpoint protection alerts**: Cross-reference any alerts generated by endpoint security solutions on the same host. Look for behavior indicative of Cobalt Strike tools (e.g., process spawns of `beacon.exe` or unusual PowerShell commands).

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential impact on critical systems that may serve as a foothold for adversaries. The likelihood of malicious abuse is significant as Cobalt Strike is commonly utilized in targeted attacks and red teaming exercises. Given its default nature, this certificate is frequently weaponized by attackers to bypass detection mechanisms.

  ---

  ### Blind Spots and Assumptions

  The detection may miss variants of Cobalt Strike or customized certificates generated by attackers to evade recognition. Reliable detection requires comprehensive logging configurations from Zeek, specifically X.509, HTTP, and DNS logs. Legitimate activities may occasionally trigger this alert, especially in environments using legitimate security testing tools. Related detections like monitoring for unusual outbound connections (e.g., unexpected destinations in proxy logs) can enhance coverage against C2 operations.

