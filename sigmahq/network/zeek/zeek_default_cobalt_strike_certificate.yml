note: |
  ### Technical Context
  This rule detects the presence of a default Cobalt Strike SSL certificate by monitoring HTTPS traffic. Cobalt Strike is a widely used post-exploitation framework that allows attackers to maintain control over compromised systems. The default certificate, which is easily identifiable, indicates that a threat actor may be utilizing Cobalt Strike for command and control (C2) communications. Detection of this certificate could suggest a breach, in which attackers are exploiting the framework to facilitate lateral movement or data exfiltration.

  The relevant MITRE ATT&CK tactics include **Command and Control (TA0011)**, specifically the technique **Application Layer Protocol (T1071)**, which details how attackers utilize standard protocols such as HTTPS for stealthy C2 communication. The detection primarily leverages logs from network monitoring tools, specifically those that capture X.509 certificate details, making it easier to identify malicious activity that leverages Cobalt Strike for C2 operations.

  ### Investigation Steps
  - **Review Certificate Data:** Examine the HTTPS traffic for any instances of the default Cobalt Strike certificate. Pay close attention to the certificate serial number (8BB00EE) across all network traffic logs.
  - **Analyze Network Connections:** Investigate outbound connections from affected hosts to external IPs, focusing on unusual or unexpected destinations, especially if correlated with the certificate detection.
  - **Inspect Endpoint Activity:** Check EDR logs on potential compromised hosts for process executions associated with Cobalt Strike, such as `Beacon.exe`, or any other tools indicative of lateral movement.
  - **Evaluate Historical Traffic:** Look into previous network activity logs for patterns or occurrences of the same certificate being used, which could indicate ongoing or repeated attempts at exploitation.

  ### Prioritization
  The severity of this alert is considered high due to the significant implications of Cobalt Strike usage in an enterprise environment, where it may facilitate unauthorized access, data exfiltration, or other forms of malicious activity. The likelihood of detection reflects not only the active use of Cobalt Strike but also attempts to maintain stealth during potential intrusions.

  ### Blind Spots and Assumptions
  This detection may have gaps if network traffic is not fully monitored or if encrypted traffic bypasses the visibility of the monitoring solution. It assumes that the default Cobalt Strike certificate is being used without any modifications; should an attacker generate a custom certificate, this detection would fail. Additionally, it requires that the Zeek log source is appropriately configured to capture and analyze X.509 certificate information.

