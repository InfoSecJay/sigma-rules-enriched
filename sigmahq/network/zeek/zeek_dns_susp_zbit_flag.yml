title: Suspicious DNS Z Flag Bit Set
id: ede05abc-2c9e-4624-9944-9ff17fdc0bf5
status: test
description: |
  The DNS Z flag is bit within the DNS protocol header that is, per the IETF design, meant to be used reserved (unused).
  Although recently it has been used in DNSSec, the value being set to anything other than 0 should be rare.
  Otherwise if it is set to non 0 and DNSSec is being used, then excluding the legitimate domains is low effort and high reward.
  Determine if multiple of these files were accessed in a short period of time to further enhance the possibility of seeing if this was a one off or the possibility of larger sensitive file gathering.
  This Sigma query is designed to accompany the Corelight Threat Hunting Guide, which can be found here: https://www3.corelight.com/corelights-introductory-guide-to-threat-hunting-with-zeek-bro-logs'
references:
- https://twitter.com/neu5ron/status/1346245602502443009
- https://tdm.socprime.com/tdm/info/eLbyj4JjI15v#sigma
- https://tools.ietf.org/html/rfc2929#section-2.1
- https://www.netresec.com/?page=Blog&month=2021-01&post=Finding-Targeted-SUNBURST-Victims-with-pDNS
author: '@neu5ron, SOC Prime Team, Corelight'
date: 2021-05-04
modified: 2022-11-29
tags:
- attack.t1095
- attack.t1571
- attack.command-and-control
logsource:
  product: zeek
  service: dns
detection:
  z_flag_unset:
    Z: 0
  most_probable_valid_domain:
    query|contains: '.'
  exclude_tlds:
    query|endswith:
    - '.arpa'
    - '.local'
    - '.ultradns.net'
    - '.twtrdns.net'
    - '.azuredns-prd.info'
    - '.azure-dns.com'
    - '.azuredns-ff.info'
    - '.azuredns-ff.org'
    - '.azuregov-dns.org'
  exclude_query_types:
    qtype_name:
    - 'ns'
    - 'mx'
  exclude_responses:
    answers|endswith: '\\x00'
  exclude_netbios:
    id.resp_p:
    - 137
    - 138
    - 139
  condition: not z_flag_unset and most_probable_valid_domain and not (exclude_tlds
    or exclude_query_types or exclude_responses or exclude_netbios)
falsepositives:
- 'Internal or legitimate external domains using DNSSec. Verify if these are legitimate
  DNSSec domains and then exclude them.'
- 'If you work in a Public Sector then it may be good to exclude things like endswith
  ".edu", ".gov" and or ".mil"'
level: medium
note: |
  ---

  ### Technical Context

  This detection rule identifies DNS queries where the Z flag bit in the DNS protocol header is set to a non-zero value, which is unusual as per IETF standards. Attackers may exploit this to manipulate or exfiltrate data disguised as legitimate DNS traffic while using DNSSEC. The relevant MITRE ATT&CK tactics are **Command and Control (T1071)** and **Exfiltration Over Command and Control Channel (T1041)**. Primary telemetry is derived from **Zeek DNS logs**, focusing on DNS query details. If malicious, this behavior can indicate potential data exfiltration or command-and-control communication. However, this detection does **NOT** confirm malicious intent on its own, as legitimate DNSSEC use may result in similar patterns.

  ---

  ### Investigation Steps

  - **Verify the Z flag setting**: Check Zeek DNS logs for the Z flag status field to confirm it is set to a non-zero value (Field: `z`).
  - **Identify the queried domains**: Analyze the `query` field in the DNS logs to determine whether the queried domains are typically benign or indicative of suspicious activity. Look for domains that are uncommon or do not match common enterprise usage.
  - **Filter benign DNSSEC activity**: Cross-reference active domains against known legitimate external or internal DNSSEC domains. Exclude responses for domains that end with recognized extensions such as `.edu`, `.gov`, or `.mil` as potentially benign.
  - **Check for query frequency**: Investigate the frequency and volume of queries made to the identified domain in a short timeframe. Elevated query counts may indicate potential adversary reconnaissance or data gathering: use timestamps and count queries over a designated period.
  - **Review DNS response sizes**: Examine the `answers` field in the logs to see whether the response sizes are unusually large, which could indicate large data being transmitted; values atypical for legitimate traffic should be flagged.
  - **Reference legitimate activities**: Document expected legitimate activities around the use of DNS and confirm that authenticated uses of DNSSEC are being properly logged. Include any routine interactions with trusted services and internal applications.

  ---

  ### Prioritization

  The alert has medium severity as the detection may indicate potential data exfiltration efforts, especially if unusual domains are observed in conjunction with anomalous query patterns. Given the manipulation possible through DNS queries, this behavior carries a moderate likelihood of being abused in real-world attacks, warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate DNSSEC activity, which can set the Z flag to non-zero values, resulting in false positives. Reliable detection requires comprehensive logging from Zeek specifically configured to capture all DNS query types, including security-related anomalies. Legitimate transactions such as normal DNSSEC interactions and queries to educational or government domains may trigger alerts. Companion detections include monitoring DNS response patterns and the frequency of unusual DNS queries for enhanced context.

  ---

