title: Suspicious DNS Z Flag Bit Set
id: ede05abc-2c9e-4624-9944-9ff17fdc0bf5
status: test
description: |
  The DNS Z flag is bit within the DNS protocol header that is, per the IETF design, meant to be used reserved (unused).
  Although recently it has been used in DNSSec, the value being set to anything other than 0 should be rare.
  Otherwise if it is set to non 0 and DNSSec is being used, then excluding the legitimate domains is low effort and high reward.
  Determine if multiple of these files were accessed in a short period of time to further enhance the possibility of seeing if this was a one off or the possibility of larger sensitive file gathering.
  This Sigma query is designed to accompany the Corelight Threat Hunting Guide, which can be found here: https://www3.corelight.com/corelights-introductory-guide-to-threat-hunting-with-zeek-bro-logs'
references:
- https://twitter.com/neu5ron/status/1346245602502443009
- https://tdm.socprime.com/tdm/info/eLbyj4JjI15v#sigma
- https://tools.ietf.org/html/rfc2929#section-2.1
- https://www.netresec.com/?page=Blog&month=2021-01&post=Finding-Targeted-SUNBURST-Victims-with-pDNS
author: '@neu5ron, SOC Prime Team, Corelight'
date: 2021-05-04
modified: 2022-11-29
tags:
- attack.t1095
- attack.t1571
- attack.command-and-control
logsource:
  product: zeek
  service: dns
detection:
  z_flag_unset:
    Z: 0
  most_probable_valid_domain:
    query|contains: '.'
  exclude_tlds:
    query|endswith:
    - '.arpa'
    - '.local'
    - '.ultradns.net'
    - '.twtrdns.net'
    - '.azuredns-prd.info'
    - '.azure-dns.com'
    - '.azuredns-ff.info'
    - '.azuredns-ff.org'
    - '.azuregov-dns.org'
  exclude_query_types:
    qtype_name:
    - 'ns'
    - 'mx'
  exclude_responses:
    answers|endswith: '\\x00'
  exclude_netbios:
    id.resp_p:
    - 137
    - 138
    - 139
  condition: not z_flag_unset and most_probable_valid_domain and not 
    (exclude_tlds or exclude_query_types or exclude_responses or 
    exclude_netbios)
falsepositives:
- 'Internal or legitimate external domains using DNSSec. Verify if these are legitimate
  DNSSec domains and then exclude them.'
- 'If you work in a Public Sector then it may be good to exclude things like endswith
  ".edu", ".gov" and or ".mil"'
level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS queries where the Z flag is set to a non-zero value, which is atypical since this flag is designed to be reserved or unused. Attackers may exploit this functionality as a means to communicate with command and control (C2) servers or to exfiltrate data using manipulated DNS queries, especially when utilizing DNSSec. This behavior aligns with the MITRE ATT&CK framework under the tactic of Exfiltration (TA0010) and the technique T1095 (Non-Application Layer Protocol).

  Primary telemetry sources include DNS logs collected by network monitoring tools such as Zeek (formerly Bro). The presence of non-zero Z flags in DNS queries indicates potential malicious activity, as legitimate configurations should maintain the Z flag at zero. Importantly, this detection does NOT confirm malicious activity on its own; further investigation is required to understand the context of these queries.

  ### Investigation Steps

  - **Examine DNS query logs:** Check Zeek DNS logs (event type: dns) for entries where the Z flag is set to a non-zero value. Specifically, search for `id.orig_h` and `query` fields to identify the source and nature of these queries.

  - **Identify external requests:** Filter the logs by external domains (e.g., `query` contains valid domains without reserved TLDs) and confirm if they are related to known malicious indicators or recent threat intelligence reports.

  - **Review affected systems:** Validate the host role by identifying `id.orig_h` and ensuring it matches user behavior expectations for the asset. Legitimate internal servers should not generate anomalous DNS requests with non-zero Z flags.

  - **Cross-reference against baseline traffic:** Compare current DNS query volume against historical trends to determine if the frequency or pattern of these requests deviates from established norms within a defined timeframe (e.g., spikes in DNS requests over short intervals).

  - **Investigate for lateral movement:** If multiple Z flag violations occur in a short span, correlating log entries with other network traffic can reveal potential data exfiltration efforts, which may utilize DNS tunneling techniques.

  - **Correlate with other indicators:** Rely on additional security detections, such as abnormal outbound traffic (e.g., unusual TCP connections) and examine Security Event ID 4624 (Logon Events) to establish a timeline of user access patterns in conjunction with anomalous DNS activity.

  ### Prioritization

  This alert is of medium severity in the enterprise context due to the potential impact associated with compromised systems and the likelihood that attackers will utilize non-standard DNS queries to exfiltrate data or maintain C2 communication. The behavior raised in this alert is not commonly weaponized but can serve as a preliminary indicator of a larger, coordinated attack if followed by additional suspicious activity.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate services utilizing DNSSec may trigger this alert with non-zero Z flags. Reliable detection requires comprehensive logging from Zeek and other DNS infrastructure to prevent blind spots. Legitimate activity might include internal systems accessing educational or governmental domains, indicated by TLDs such as ".edu" or ".gov." A related detection to strengthen coverage could be a rule targeting DNS tunneling, which would indicate a simultaneous effort to use DNS for exfiltration methods.

