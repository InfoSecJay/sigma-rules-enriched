note: |
  ### Technical Context

  This Sigma rule detects specific DCE-RPC functions indicative of persistence mechanisms used by attackers, particularly operations related to printer service management and process creation. The likely objective of an attacker utilizing these methods is to establish a foothold in the network, ensuring the malicious process or service persists across system reboots. Relevant MITRE ATT&CK tactics and techniques include Persistence (T1547.004) and Privilege Escalation (T1544). The primary telemetry sources are Zeek logs, focusing on DCE-RPC service activities. If malicious, such actions could provide an attacker with enduring access and elevate privileges for further malicious activities. This detection does NOT confirm the presence of malware or compromise on its own, as legitimate administrative operations can trigger similar activities.

  ### Investigation Steps

  - **Identify suspicious RPC operations:** Review Zeek logs for events involving `RpcAddMonitor`, `RpcAddPrintProcessor`, `RpcAsyncAddMonitor`, and `RpcAsyncAddPrintProcessor`. Look for anomalies in the calling user context outside typical administrative accounts.

  - **Examine process creation events:** Check for `SeclCreateProcessWithLogonW` and `SeclCreateProcessWithLogonExW` operations in Zeek logs. Both operations should be analyzed for unusual accounts or credentials that do not align with normal operations.

  - **Review for legitimate activity:** Verify known administrative activities, such as printer management and system maintenance, which may generate similar logs. Ensure these activities are documented in the change management system to differentiate from potential malicious actions.

  - **Look for unauthorized access patterns:** Cross-reference user accounts involved in the detected RPC calls with user roles and responsibilities. Focus on any discrepancies, such as non-admin accounts executing sensitive RPC operations.

  - **Correlate with endpoint telemetry:** Check Windows Security Event ID 4688 (process creation) and Sysmon Event ID 1 to see if any created processes align with suspicious RPC activity. Identify if these processes have anomalous command-line arguments or if they show behaviors typical of malware.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on the system and the possibility of malicious persistence being established. The likelihood of this behavior being weaponized is moderate, particularly among sophisticated adversaries who leverage DCE-RPC for lateral movement and persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative tasks that also use DCE-RPC, leading to false positives. Ensure that detailed logging of these RPC events is properly configured to capture all instances effectively. Also, be aware that tools used for Windows management or troubleshooting might trigger similar logs. Incorporating companion detections for unusual user account behavior and notification on changes in printer services can enhance detection coverage.

