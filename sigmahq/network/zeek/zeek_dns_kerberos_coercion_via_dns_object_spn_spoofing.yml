note: |
  ### Technical Context
  This rule detects suspicious DNS queries that indicate potential Kerberos coercion attacks carried out via DNS object spoofing. The presence of a base64-encoded pattern, specifically "1UWhRCAAAAA..BAAAA," corresponds to a marshaled `CREDENTIAL_TARGET_INFORMATION` structure, which could signify an attacker's attempt to manipulate the authentication flow. In such scenarios, adversaries leverage compromised Service Principal Names (SPNs) to redirect authentication requests aimed at their controlled hosts, thereby coercing victims into unintentionally providing authentication tokens.

  Kernel of this detection pertains to the MITRE ATT&CK framework, specifically to tactics such as Credential Access (TA0006) where attackers aim to obtain valid user credentials, as well as Persistence (TA0003) and Privilege Escalation (TA0004). The techniques involved include, but are not limited to, Kerberos Ticket Granting Ticket (TGT) requests targeting attacker-controlled endpoints (T1557.001) and potentially bypassing existing security mechanisms by spoofing legitimate SPNs, which can be categorized under Initial Access methods (T1187).

  Primary data sources that should be monitored include DNS query logs, which can reveal unnatural patterns and suspicious requests for authentication redirection. Monitoring these logs will provide crucial insight during investigations into potential coercion attempts.

  ### Investigation Steps
  - **Review DNS Query Logs:**: Examine DNS logs for anomalous queries containing the specified base64-encoded pattern associated with Kerberos coercion attacks. Focus on unusual query timestamps or request patterns targeting uncommon or unexpected SPNs.

  - **Analyze Host Authentication Behavior:**: Investigate authentication attempts to systems that are associated with the DNS queries flagged by this detection. Look for patterns of failed or successful authentication requests that may indicate compromised credentials or unauthorized access attempts.

  - **Correlate with Active Directory Logs:**: Cross-reference the suspicious DNS queries with Active Directory logs (if available) to check for unauthorized SPN entries or changes to service accounts. This can help confirm whether an attacker is manipulating service principals.

  - **Implement Passive DNS Monitoring:**: If not already in place, consider deploying passive DNS monitoring solutions to gain additional historical context on DNS query patterns. This could help in identifying recurring suspicious behaviors over time.

  ### Prioritization
  The alert triggers a high-severity response due to the significant security implications of a successful Kerberos coercion attack, where login credentials could be jeopardized, leading to unauthorized access or escalation of privileges within the network. The likelihood of this type of attack occurring in an enterprise environment is increasing, particularly with growing sophistication in techniques used by threat actors.

  ### Blind Spots and Assumptions
  Detection coverage might be limited by gaps in DNS logging configurations or the improper setup of DNS query monitoring tools. Assumptions within this detection logic include the capability of DNS logs to capture all relevant queries without loss and the availability of sufficient context to assess the authenticity of SPNs. Ensuring that the appropriate logging levels are configured on DNS servers and that there are no filtering or exclusion settings in place is necessary for effective alerting.

