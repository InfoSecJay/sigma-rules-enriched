note: |
  ### Technical Context

  This rule detects DNS queries that contain specific patterns indicating potential Kerberos coercion attacks via DNS object spoofing. The behavior detected includes the manipulation of Service Principal Names (SPNs) to redirect authentication requests from legitimate hosts to attacker-controlled systems, enabling credential theft or unauthorized access to resources. The likely objective for an attacker using this technique is to gain unauthorized access to accounts and escalate privileges within an environment by tricking systems into authenticating to malicious endpoints.

  This behavior is associated with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique of Kerberos Coercion via DNS Spoofing (T1557.001). The primary telemetry source for this detection is DNS query logs collected by network monitoring solutions like Zeek, specifically looking for queries that contain base64-encoded patterns indicative of this coercion technique. If malicious, the security impact could involve compromised credentials and unauthorized system access; however, this detection alone does NOT confirm successful credential capture.

  ---

  ### Investigation Steps

  - **Check DNS query logs for suspicious patterns:** Review Zeek DNS logs (fields: `query`) for entries containing the strings 'UWhRCA' and 'BAAAA'. High-confidence malicious indicators are the presence of both patterns, especially if they originate from internal systems directing queries to external IPs.

  - **Verify host roles and recent changes:** Identify the source IPs of the suspicious queries across internal assets (Event ID from Zeek logs). Validate whether these systems are expected to communicate with the queried host or if they are protected servers in scope for credential access operations.

  - **Identify legitimate DNS query patterns:** Compare against known service hostnames and SPNs within the environment. Legitimate queries typically correspond to well-defined service roles and may not contain the suspicious patterns identified in the alert.

  - **Assess the duration and frequency of queries:** Analyze the volume and repetition of the suspicious DNS queries over time (using Zeek statistical data). A large volume from the same host could indicate an ongoing attack or enumeration attempt, while sporadic queries may indicate testing or misconfiguration.

  - **Correlate with authentication logs:** Cross-reference suspicious DNS queries with Kerberos ticket granting ticket (TGT) requests from Security Event ID 4769 in Active Directory logs. Legitimate TGT requests should not correlate with the timing of suspicious DNS queries.

  - **Monitor for follow-up actions:** Check for successful Kerberos authentications or additional malicious network activities following the alerts, using logs from Windows Event ID 4768 and related logs to ensure deeper investigation into potential data exfiltration or lateral movement attempts.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact of compromised credentials on enterprise assets, particularly if sensitive systems are involved. The likelihood of malicious abuse is significant given the ease of exploiting these vulnerabilities in authentication protocols like Kerberos. This behavior is known to be commonly weaponized by advanced adversaries targeting corporate environments.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the availability and configuration of DNS logging, as missing logs could hinder accurate detection. Attackers may employ domain fronting or legitimate services to obfuscate their malicious activities, potentially triggering these alerts during normal operations. Routine configurations of legitimate Active Directory service accounts may produce similar DNS queries, leading to false positives. Related detections, such as Kerberos Ticket Granting Ticket requests from unusual hosts, can improve coverage and context in investigations.

