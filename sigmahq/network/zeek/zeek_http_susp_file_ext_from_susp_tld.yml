title: HTTP Request to Low Reputation TLD or Suspicious File Extension
id: 68c2c604-92ad-468b-bf4a-aac49adad08c
status: experimental
description: |
  Detects HTTP requests to low reputation TLDs (e.g. .xyz, .top, .ru) or ending in suspicious file extensions (.exe, .dll, .hta), which may indicate malicious activity.
references:
- https://www.howtogeek.com/137270/50-file-extensions-that-are-potentially-dangerous-on-windows
- https://www.spamhaus.org/reputation-statistics/cctlds/domains/
author: '@signalblur, Corelight'
date: 2025-02-26
tags:
- attack.initial-access
- attack.command-and-control
logsource:
  product: zeek
  service: http
detection:
    # Suspicious TLD in the 'host' field OR malicious file extension in the 'uri' field.
  selection_suspicious_tld:
    host|endswith:
    - '.bid'
    - '.by'
    - '.cf'
    - '.click'
    - '.cm'
    - '.ga'
    - '.gq'
    - '.ir'
    - '.kp'
    - '.loan'
    - '.ml'
    - '.mm'
    - '.party'
    - '.pw'
    - '.ru'
    - '.su'
    - '.sy'
    - '.tk'
    - '.top'
    - '.tv'
    - '.ve'
    - '.work'
    - '.xyz'
  selection_malicious_ext:
    uri|endswith:
    - '.bat'
    - '.bin'
    - '.cmd'
    - '.cpl'
    - '.dll'
    - '.dylib'
    - '.elf'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.jar'
    - '.js'
    - '.lnk'
    - '.msi'
    - '.pif'
    - '.ps1'
    - '.py'
    - '.reg'
    - '.scr'
    - '.sh'
    - '.so'
    - '.vbs'
    - '.wsf'
  selection_malicious_mime:
    resp_mime_types:
    - 'application/vnd.microsoft.portable-executable'
    - 'application/x-bat'
    - 'application/x-dosexec'
    - 'application/x-elf'
    - 'application/x-iso9660-image'
    - 'application/x-java-archive'
    - 'application/x-ms-shortcut'
    - 'application/x-msdos-program'
    - 'application/x-msdownload'
    - 'application/x-python-code'
    - 'application/x-sh'
  condition: selection_suspicious_tld and 1 of selection_malicious_*
falsepositives:
- Rare legitimate software downloads from low quality TLDs
level: medium
note: |
  ### Technical Context
  This rule is designed to detect HTTP requests directed towards low-reputation top-level domains (TLDs), such as those frequently associated with malicious activities (e.g., .xyz, .ru), or requests that target suspicious file extensions (e.g., .exe, .dll). Such activities often indicate attempts by malicious actors to deliver payloads, escalate privileges, or establish command-and-control channels. Attackers might leverage these domains to host exploits, malware, or phishing kits, making early detection essential to mitigating their impact on the enterprise environment.

  Relevant MITRE ATT&CK tactics include **Initial Access** (TA0001), as malicious downloads may provide attackers with a foothold within the network, and **Command and Control** (TA0011), as these low-reputation TLDs can facilitate the exfiltration of data or further malicious activity. The techniques associated with these tactics include **Malware (T1203)**, which refers to the exploitation of unpatched vulnerabilities, and **External Remote Services (T1133)** for remote access and execution through compromised networks.

  The primary data source for this rule is HTTP request logs collected from a network monitoring solution such as Zeek. These logs will contain details on the host, URI, and response MIME type, providing evidence of suspicious outgoing connections or file downloads.

  ### Investigation Steps
  - **Review HTTP Logs**: Analyze the HTTP request logs for any requests targeting suspicious TLDs. Focus particularly on requests made to domain names listed in the detection logic to identify potential connections to malicious sites.

  - **Examine File Extensions**: Investigate the URIs in the logs for requests leading to the download of high-risk file extensions. Capture any download events that correlate with the specified malicious file types to assess their legitimacy.

  - **Inspect Response MIME Types**: Check the response MIME types in the HTTP logs for matches against known malicious MIME types, which may indicate an attempt to deliver executable files or scripts masquerading as benign content.

  - **Correlate with Endpoint Alerts**: If there are corresponding alerts from endpoint detection and response (EDR) tools, analyze those alerts to identify execution attempts or behaviors associated with the downloaded files to understand the potential impact fully.

  ### Prioritization
  The severity of this alert is to be regarded as medium. The likelihood of malicious activity using low-reputation TLDs and suspicious file extensions is a recognized tactic among threat actors, making early detection of such requests critical to preventing further exploitation.

  ### Blind Spots and Assumptions
  Blind spots may include false negatives arising from legitimate software downloads or network configurations that may not log all HTTP requests adequately. The detection logic assumes that the HTTP request logs are comprehensive and accessible. Additionally, it presumes that adverse reputations for certain TLDs and file extensions hold true; however, legitimate use cases might occur. Proper logging configurations and monitoring of HTTP requests are required for this alert to function effectively.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
