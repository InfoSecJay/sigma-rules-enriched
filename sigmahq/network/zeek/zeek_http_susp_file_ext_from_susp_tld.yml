title: HTTP Request to Low Reputation TLD or Suspicious File Extension
id: 68c2c604-92ad-468b-bf4a-aac49adad08c
status: experimental
description: |
  Detects HTTP requests to low reputation TLDs (e.g. .xyz, .top, .ru) or ending in suspicious file extensions (.exe, .dll, .hta), which may indicate malicious activity.
references:
- https://www.howtogeek.com/137270/50-file-extensions-that-are-potentially-dangerous-on-windows
- https://www.spamhaus.org/reputation-statistics/cctlds/domains/
author: '@signalblur, Corelight'
date: 2025-02-26
tags:
- attack.initial-access
- attack.command-and-control
logsource:
  product: zeek
  service: http
detection:
    # Suspicious TLD in the 'host' field OR malicious file extension in the 'uri' field.
  selection_suspicious_tld:
    host|endswith:
    - '.bid'
    - '.by'
    - '.cf'
    - '.click'
    - '.cm'
    - '.ga'
    - '.gq'
    - '.ir'
    - '.kp'
    - '.loan'
    - '.ml'
    - '.mm'
    - '.party'
    - '.pw'
    - '.ru'
    - '.su'
    - '.sy'
    - '.tk'
    - '.top'
    - '.tv'
    - '.ve'
    - '.work'
    - '.xyz'
  selection_malicious_ext:
    uri|endswith:
    - '.bat'
    - '.bin'
    - '.cmd'
    - '.cpl'
    - '.dll'
    - '.dylib'
    - '.elf'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.jar'
    - '.js'
    - '.lnk'
    - '.msi'
    - '.pif'
    - '.ps1'
    - '.py'
    - '.reg'
    - '.scr'
    - '.sh'
    - '.so'
    - '.vbs'
    - '.wsf'
  selection_malicious_mime:
    resp_mime_types:
    - 'application/vnd.microsoft.portable-executable'
    - 'application/x-bat'
    - 'application/x-dosexec'
    - 'application/x-elf'
    - 'application/x-iso9660-image'
    - 'application/x-java-archive'
    - 'application/x-ms-shortcut'
    - 'application/x-msdos-program'
    - 'application/x-msdownload'
    - 'application/x-python-code'
    - 'application/x-sh'
  condition: selection_suspicious_tld and 1 of selection_malicious_*
falsepositives:
- Rare legitimate software downloads from low quality TLDs
level: medium
note: |
  ### Technical Context

  This rule detects HTTP requests targeting low reputation top-level domains (TLDs) and requests for suspicious file extensions. Such behaviors are typically associated with malicious activities, including command and control (C2) communications or initial access attempts where attackers might host malware on less reputable domains. The relevant MITRE ATT&CK tactics include Initial Access (TA0001) and Command and Control (TA0011).

  Primary telemetry sources include HTTP logs from Zeek (Bro) with fields indicating the requested URI and host. If malicious, this behavior may indicate an attempted download or interaction with malware-laden resources that could compromise the integrity of the environment. Importantly, this detection does not confirm whether malware executed successfully or if the download was completed—only that a suspicious communication pattern was observed.

  ### Investigation Steps

  - **Check log entries for suspicious requests**: Review Zeek HTTP logs (e.g., `http`) for requests where `host` ends with any of the specified low reputation TLDs and where `uri` ends with any malicious file extension listed. Look for patterns or repeated attempts which may indicate automated scripts.

  - **Validate HTTP response analysis**: Investigate Zeek logs for the `resp_mime_types` field to find any responses indicating the transmission of malicious files (e.g., `application/x-msdownload`, `application/vnd.microsoft.portable-executable`). Match these against user agent strings for context.

  - **Look for known malicious file downloads**: Specifically focus on URI paths or file names that include well-known malware extensions (like `.exe`, `.scr`, `.dll`) within the same time frame. The presence of these indicators, especially if paired with a low reputation TLD, raises the malicious signal.

  - **Assess user behavior**: Cross-reference any detected traffic with user activity logs or endpoint protection logs to determine if the activity aligns with expected user behavior. For example, legitimate software downloads generally originate from verified vendors or known repositories.

  - **Identify successful connections to suspicious resources**: Review additional logs (e.g., firewall or proxy logs) for patterns of follow-up connections to the suspicious TLD after the HTTP request was made. An established connection could suggest deeper compromise attempts.

  - **Document any false positive cases**: Be aware of instances where rare legitimate software updates or downloads occur from low-quality TLDs (e.g., obscure development tools or legitimate open-source software) to differentiate between false positives and true threats.

  ### Prioritization

  This alert carries medium severity due to its potential impact based on the types of systems involved. Low reputation TLDs and suspicious file extensions are commonly leveraged by threat actors, increasing the likelihood of malicious abuse. However, as these domains can sometimes be used legitimately, analysts must investigate the context surrounding each alert.

  ### Blind Spots and Assumptions

  Detection may be limited if relevant logging configurations for Zeek are not properly set, particularly for outbound HTTP requests. Legitimate activities, such as unusual software downloading or updates from less common vendors, may trigger this alert. Companion detections, such as monitoring outbound DNS queries to these low reputation domains, can augment alert coverage and help confirm or mitigate findings from this Sigma rule.

