title: Executable from Webdav
id: aac2fd97-bcba-491b-ad66-a6edf89c71bf
status: test
description: 'Detects executable access via webdav6. Can be seen in APT 29 such as
  from the emulated APT 29 hackathon https://github.com/OTRF/detection-hackathon-apt29/'
references:
- http://carnal0wnage.attackresearch.com/2012/06/webdav-server-to-download-custom.html
- https://github.com/OTRF/detection-hackathon-apt29
author: 'SOC Prime, Adam Swan'
date: 2020-05-01
modified: 2021-11-27
tags:
- attack.command-and-control
- attack.t1105
logsource:
  product: zeek
  service: http
detection:
  selection_webdav:
  - c-useragent|contains: 'WebDAV'
  - c-uri|contains: 'webdav'
  selection_executable:
  - resp_mime_types|contains: 'dosexec'
  - c-uri|endswith: '.exe'
  condition: selection_webdav and selection_executable
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects access to executable files via WebDAV, a protocol often targeted for command and control (C2) by threat actors like APT29. The likely attacker objective is to download or execute malicious payloads from a compromised server to achieve persistence or conduct further exploitation. Relevant MITRE ATT&CK tactics include Command and Control (T1071) and Remote File Copy (T1105). The primary telemetry source is HTTP traffic logs monitored by Zeek, specifically looking for entries containing certain user agents and URI patterns associated with WebDAV. If malicious, this behavior can indicate an attempted infection or compromise of the target system. However, this detection does NOT confirm that execution has occurred or that the file was indeed malicious; it only indicates access.

  ### Investigation Steps

  - **Check HTTP Logs for Executable Access:** Review Zeek HTTP logs (e.g., log type: http.log) for entries where `c-uri` contains 'webdav' and ends with '.exe', and where `c-useragent` contains 'WebDAV'. Pay attention to suspicious IP addresses contacting internal systems.

  - **Evaluate Referrer Information:** Inspect the `c-referrer` field in the logs to determine if the request originated from a known or expected address. Legitimate traffic would typically originate from recognized internal or external sources.

  - **Validate File Type and Access Status:** Assess the response MIME type in the logs, specifically looking for `resp_mime_types` that should not flag executables (e.g., anything deviating from common types like 'text/html'). Identify instances where executable files were successfully downloaded.

  - **Correlate with Network Behavior:** Monitor for any subsequent network activity from the affected host following the WebDAV access. Look for abnormal outbound connections possibly indicating further malicious payload execution or communication.

  - **Review Asset Criticality:** Note the criticality of the impacted asset. Investigate whether it contains sensitive data or is part of a critical operational process, which would elevate the severity of the alert.

  - **Identify Known Malicious IPs:** Cross-reference the source IP of the WebDAV request against threat intelligence sources or blocklists to determine if it has previously been associated with malicious activities.

  ### Prioritization

  This alert should be given medium priority. While it indicates a potentially malicious access pattern indicative of C2 or payload delivery tactics, the actual risk presented depends on the nature of the asset involved and whether any follow-up malicious activity occurs.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete HTTP logging or if WebDAV is configured legitimately in the environment, which could result in false positives. The requirement for accurate log sources includes properly configured Zeek deployment capturing all HTTP traffic. Legitimate activities could involve standard operational use of WebDAV. A related detection could include monitoring for unusual outbound traffic patterns or uploads, which may indicate that an executable was executed post-download.

