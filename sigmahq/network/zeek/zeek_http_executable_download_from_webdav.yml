title: Executable from Webdav
id: aac2fd97-bcba-491b-ad66-a6edf89c71bf
status: test
description: 'Detects executable access via webdav6. Can be seen in APT 29 such as
  from the emulated APT 29 hackathon https://github.com/OTRF/detection-hackathon-apt29/'
references:
- http://carnal0wnage.attackresearch.com/2012/06/webdav-server-to-download-custom.html
- https://github.com/OTRF/detection-hackathon-apt29
author: 'SOC Prime, Adam Swan'
date: 2020-05-01
modified: 2021-11-27
tags:
- attack.command-and-control
- attack.t1105
logsource:
  product: zeek
  service: http
detection:
  selection_webdav:
  - c-useragent|contains: 'WebDAV'
  - c-uri|contains: 'webdav'
  selection_executable:
  - resp_mime_types|contains: 'dosexec'
  - c-uri|endswith: '.exe'
  condition: selection_webdav and selection_executable
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the access of executable files over WebDAV, a protocol used for allowing clients to collaboratively edit and manage files on remote web servers. The main threat scenario involves sophisticated attackers, such as those associated with APT29, leveraging WebDAV to distribute malicious executable files to target networks. By utilizing this method, attackers can execute payloads in an environment that may have specific security measures against conventional download methods, ultimately facilitating command and control operations or further intrusion.

  The relevant MITRE ATT&CK tactics/techniques involved include:
  - **Command and Control** (TA0011)
  - **Transfer Data to External Site** (T1105)

  The primary data sources for this detection are:
  - HTTP logs collected through the Zeek network analysis tool, which can provide insights into file transfers and network behaviors associated with potential malicious activities, specifically focusing on WebDAV interactions.

  ### Investigation Steps
  - **Review HTTP Logs:** Examine Zeek's HTTP logs for entries where the `c-useragent` field indicates WebDAV interactions, especially those containing '.exe' in the `c-uri`.
  - **Analyze MIME Types:** Verify the `resp_mime_types` in the identified HTTP log entries to confirm any instances of 'dosexec' as this behavior could signify the transfer of executable files.
  - **Evaluate Network Behavior:** Follow any anomalous patterns or connections involving WebDAV to detect signs of possible lateral movement or command and control communications that may leverage the transferred executables.
  - **Cross-reference Threat Intelligence:** Utilize known indicators of compromise (IOCs) associated with APT29 or similar threat actors to identify any correlation between flagged activities and known malicious behaviors among your resources.

  ### Prioritization
  This alert warrants medium severity due to the risk posed by executable downloads over a seemingly legitimate protocol. Successful execution of such payloads can lead to significant breaches, data exfiltration, and prolonged unauthorized access.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on network traffic that may not be logged consistently, particularly in environments lacking comprehensive HTTP logging solutions or where WebDAV traffic is heavily filtered. The detection logic assumes that executable files via WebDAV are indicative of malicious intent without context on their origin or purpose, which may not always be accurate. To function optimally, comprehensive logging of HTTP transactions and proper parsing of MIME types are essential.

