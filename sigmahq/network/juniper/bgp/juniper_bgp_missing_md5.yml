note: |
  ### Technical Context

  This rule detects instances where BGP (Border Gateway Protocol) communications on Juniper devices lack an MD5 checksum, which can indicate potential brute force attacks aimed at manipulating routing information. Attackers may leverage this vulnerability to launch routing hijacks or denial of service attacks, thereby compromising network integrity. The relevant MITRE ATT&CK techniques include **Credential Access (T1078)** for unauthorized access and **Brute Force (T1110)** targeting the BGP peer authentication.

  The primary telemetry source comes from Juniper BGP logs, specifically events that log BGP session outputs and data integrity checks. If malicious, this behavior can lead to critical routing vulnerabilities within the organization's network infrastructure. It is important to note that this detection does NOT confirm an active compromise by itself; it merely highlights a potential vulnerability that requires further investigation.

  ### Investigation Steps

  - **Verify BGP log details: **Access the Juniper BGP logs to review event entries where the phrase "missing MD5 digest" is present. Focus on Event ID logs that indicate failed BGP session authentications.

  - **Assess peer configurations: **Check BGP peer configuration settings for MD5 authentication. Ensure that configurations apply to all critical BGP connections, emphasizing the intent to secure routing data.

  - **Identify normal behavior: **Document typical BGP configurations in your environment where MD5 digests are implemented. Review for at least one properly authenticated peer session to establish a baseline for expected activity.

  - **Evaluate incoming traffic patterns: **Look for unusual or high volumes of session attempts on TCP port 179 in the firewall logs (Event ID: 3020) originating from external IP addresses that don’t usually interface with BGP.

  - **Correlate with broader telemetry: **Examine related logs such as routing updates and system alerts (e.g., Syslog entries related to route changes) to identify any trends or anomalies that align with the missing MD5 digest entries.

  - **Identify indicators of compromise: **Specifically look for high-volume attempts (multiple attempts within a short time-frame) from the same IP address to initiate BGP sessions without MD5, which may indicate malicious brute-forcing attempts.

  ### Prioritization

  This alert has a low severity level in an enterprise context, primarily because the existence of missing MD5 digests can be attributed to misconfigurations rather than confirmed malicious activity. However, without proper authentication, the routing system is vulnerable, making this issue potentially exploitable if targeted by a determined adversary.

  ### Blind Spots and Assumptions

  Detection efficacy may be compromised if Juniper BGP logging is not configured correctly, leading to missed alerts. Additionally, legitimate misconfigurations or administrative errors may trigger this alert, so context around configurations is critical. The absence of MD5 digest entries could also arise during maintenance or expected reconfigurations. It would be beneficial to implement companion detections for brute force login attempts to correlate any BGP session anomalies with unauthorized access patterns.

