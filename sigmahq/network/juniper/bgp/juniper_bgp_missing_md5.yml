note: |
  ### Technical Context

  This rule detects instances where Juniper Border Gateway Protocol (BGP) sessions are initiated without a valid MD5 digest, which could indicate a potential brute force attack aimed at manipulating routing configurations. The likely attacker objective is to compromise the integrity of routing decisions, which can lead to traffic interception or redirection. This behavior aligns with the MITRE ATT&CK technique for credential access (T1078) and defense evasion (T1557).

  The primary telemetry source is Juniper BGP logs, which must be enabled and properly ingested into the monitoring system. If malicious, this behavior can compromise network routing and lead to significant disruptions or data breaches. However, it is essential to note that this detection alone does not confirm malicious intent without additional context, as legitimate administrative actions or misconfigurations may also trigger similar alerts.

  ### Investigation Steps

  - **Review BGP logs for missing MD5 digests:** Analyze Juniper BGP logs (Event Type: Missing MD5) on the specified port (TCP 179), looking for any sessions lacking the MD5 hash. Malicious indicators include repeated sessions without valid digests in a short time span.

  - **Correlate with known BGP peers:** Validate the target BGP peers in the logs against your internal boundary. Legitimate configurations should display consistent MD5 digests for established BGP neighbors; discrepancies may indicate manipulation attempts.

  - **Check for recent configuration changes:** Examine the device configurations (Event Inputs: device_config_changes) to identify any recent modifications that may explain misconfigurations of MD5 settings. If changes align with the alerts, they require further investigation.

  - **Identify network traffic patterns:** Review any correlated network packet captures or flow logs indicating unusual traffic towards TCP port 179. Malicious traffic may exhibit erratic patterns or high-volume attempts to establish connections without proper authentication.

  - **Evaluate the criticality of the affected device:** Assess the role of the Juniper routing device in your network topology (e.g., core router vs. edge router) to determine the impact severity of any identified alert.

  ### Prioritization

  This alert is considered low priority in a typical enterprise context, primarily due to the low likelihood of malicious abuse from such log entries alone. However, if correlated with other alerts reminiscent of active exploitation techniques, it warrants elevated scrutiny. The behavior may be weaponized, especially in environments where BGP is critical for maintaining connectivity.

  ### Blind Spots and Assumptions

  Detection is limited by the proper configuration and logging of Juniper BGP services; missing logs could result in unmonitored attacks. Legitimate administrative activities, such as configuration updates or testing, may also trigger this alert if MD5 settings are temporarily misconfigured. Companion detections that strengthen coverage include alerts on unusual login patterns to BGP devices (T1078) or failed authentication attempts, providing context to the missing MD5 alerts.

