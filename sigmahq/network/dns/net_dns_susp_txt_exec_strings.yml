logsource:
  category: dns
detection:
  selection:
    record_type: 'TXT'
    answer|contains:
    - 'IEX'
    - 'Invoke-Expression'
    - 'cmd.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects potentially malicious DNS TXT records that contain command execution strings such as 'IEX', 'Invoke-Expression', and 'cmd.exe'. These patterns are commonly associated with PowerShell command execution and could indicate that an attacker is attempting to establish command-and-control communication or execute commands on a compromised system. The relevant MITRE ATT&CK technique for this alert is Command and Control via Application Layer Protocol (T1071.004).

  The primary telemetry sources include DNS logs, particularly those logging DNS TXT queries and responses. If these commands are executed in a PowerShell environment, the security impact could be significant, leading to unauthorized access, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that an attack is actively occurring; it only highlights suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Examine DNS logs:** Review DNS query logs for Event ID  DNS Query (Windows) or equivalent logs for your environment. Look for TXT records containing the keywords: 'IEX', 'Invoke-Expression', or 'cmd.exe'. Continuous queries to these strings may indicate malicious intent.

  - **Validate source IP:** Check the source IP of the DNS queries against known threat intelligence sources. If it matches a known malicious actor, this is a strong indicator of a compromise.

  - **Monitor related PowerShell activity:** Analyze Security Event ID 4688 (process creation) for PowerShell execution from unusual or non-standard hosts, especially if initiated shortly after receiving flagged DNS responses. Legitimate PowerShell administrators typically execute scripts from known management workstations during set hours.

  - **Inspect PowerShell command history:** On affected hosts, review the PowerShell command history (using Get-History or relevant logs) for any attempts to execute commands related to the detected DNS TXT records. Malicious activity may include unexpected script/block attempts.

  - **Correlate network activity:** Cross-reference outbound traffic logs to see if there are any connections to suspicious domains or IPs after the DNS queries. Malicious indicators include connections to uncommon ports or continuous traffic following the DNS requests.

  ### Prioritization

  This alert has high severity due to the potential impact on compromised systems and the likelihood of its exploitation for command-and-control purposes. The behavior detected by this rule is indicative of a tactic commonly weaponized in cyberattacks, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  This detection may miss obfuscated executions if adversaries use alternative command structures or legitimate applications for DNS queries. Additionally, some benign cloud applications might legitimately use similar DNS queries. Ensure that logging configurations for DNS queries are comprehensive and consider integrating additional detections for related behaviors, such as abnormal PowerShell executions, to enhance visibility.

