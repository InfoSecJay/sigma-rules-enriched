note: |
  ### Technical Context

  This rule detects DNS queries to known Monero mining pools, indicating potential unauthorized cryptocurrency mining activities on affected systems. Attackers may use these pools to leverage compromised machines for mining operations, which can lead to resource abuse and impact system performance. Relevant MITRE ATT&CK tactic is "Resource Development" (ID T1496), and specifically, the technique is "Cryptojacking" (ID T1496). The primary telemetry source for this detection is DNS query logs that capture outbound requests to specific Monero mining pool domains. If the activity is malicious, it can significantly degrade the performance of the affected systems and may lead to other security vulnerabilities. This detection does not confirm that mining is occurring; it only indicates that DNS queries matching known malicious pools were made.

  ### Investigation Steps

  - **Check DNS query logs**: Review DNS logs for Event ID 4000 to confirm queries made to any of the detected Monero mining pool domains. Capture the timestamp and source IP address for further assessment.

  - **Validate host activity**: Investigate the process list on the affected host for any unusual CPU or memory spikes. Look specifically for processes related to mining software, which may be running under legitimate account names.

  - **Identify user context**: Confirm the user accounts making the DNS requests. If requests come from service accounts or unusual accounts not typically associated with such activity, this could indicate malicious intent.

  - **Examine network flow**: Analyze network traffic (e.g., firewall logs or network monitoring tools) for outbound connections made to the detected domains. Legitimate traffic should show requests correlating with typical business operations.

  - **Correlate with other alerts**: Check for related alerts that may indicate the presence of malware or other signs of compromise. Any other indicators suggesting suspicious behavior should heighten concern regarding the mining detection.

  ### Prioritization

  This alert holds a high severity because it may indicate a potential insider threat or external compromise, impacting critical systems and resources. The likelihood of abuse is significant, especially if the mining activity is undetected, as it’s a common tactic employed by adversaries to exploit system resources.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of DNS logging or misconfiguration in logging settings. Legitimate activities, such as employee-initiated crypto mining, could trigger this alert and require further context to validate. A related detection might be monitoring for abnormal CPU usage on systems to confirm potential malicious mining activities, providing a more comprehensive view of the situation.

