note: |
  ### Technical Context
  This detection rule focuses on identifying suspicious DNS queries associated with Monero mining pools, which may indicate unauthorized cryptocurrency mining activities within an enterprise environment. Attackers often use compromised systems to mine cryptocurrencies covertly, seeking financial gain while utilizing the organization's resources, which can lead to performance degradation and increased operational costs.

  The primary threat scenario involves malicious insiders or external attackers who either covertly deploy malicious scripts or utilize existing vulnerabilities to establish mining operations. Their objective is to leverage organizational assets to mine Monero, a privacy-focused cryptocurrency, without detection, thus leading to potential exfiltration of company resources and increased network traffic.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Exfiltration Over Command and Control Channel (T1567)**: Utilizing mined resources to send data back to an attacker-controlled server.
  - **Resource Abuse (T1496)**: Misusing organizational resources (such as CPUs and bandwidth) for cryptocurrency mining.

  The primary data source for this detection is DNS query logs, which can provide crucial insights into the domains being resolved by internal systems.

  ### Investigation Steps
  - **Review DNS Query Logs**: Analyze the DNS query logs for entries matching known Monero mining pool domains. Pay particular attention to the frequency and context of these queries across multiple hosts.

  - **Analyze Network Traffic**: Monitor outbound traffic for any unusual patterns or large data transfers to the identified mining pool domains that may indicate mining activity or exfiltration of resources.

  - **Check for Resource Utilization**: Inspect system resource metrics across affected machines to identify unusual CPU usage patterns that may be indicative of cryptocurrency mining software running in the background.

  - **Investigate Known Hosts**: Identify and review any hosts making these DNS queries to understand their role in the environment and any potential vulnerabilities that may have been exploited to facilitate mining.

  ### Prioritization
  The alert is considered high severity due to the potential for significant resource abuse, operational impact, and the financial implications associated with unauthorized cryptocurrency mining on enterprise infrastructure.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate cryptocurrency mining activities, which could lead to false positive alerts if valid business use cases are not taken into account. The detection logic assumes that all traffic to these specific domains is unauthorized, which may not hold true in environments where employees have explicit permission to engage in cryptocurrency activities. The alert relies on comprehensive DNS query logging; therefore, any environments lacking robust DNS logging capabilities may fail to capture relevant indicators for this detection rule.

