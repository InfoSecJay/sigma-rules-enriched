logsource:
  category: dns
detection:
  selection1:
    query|startswith:
    - 'aaa.stage.'
    - 'post.1'
  selection2:
    query|contains: '.stage.123456.'
  condition: 1 of selection*
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule identifies suspicious DNS queries characteristic of Cobalt Strike beacons, which are often used in command-and-control (C2) communications to facilitate remote access to compromised systems. Cobalt Strike is a legitimate penetration testing tool that can also be exploited by threat actors for nefarious purposes, particularly in advanced persistent threat (APT) scenarios. The presence of DNS queries containing specific patterns, such as `aaa.stage.` or `post.1`, typically indicates that malicious actors are attempting to maintain communication with compromised endpoints.

  The primary attacker objective associated with this rule is to establish or maintain a covert communication channel with compromised systems, allowing them to execute further payloads or exfiltrate data. Should successful beaconing occur, attackers can effectively control affected machines and execute additional malicious tasks. This behavior aligns with the MITRE ATT&CK framework, specifically the **Command and Control** tactic (TA0011) and the **Application Layer Protocol** technique (T1071.004).

  Data sources that provide the most relevant evidence for detecting this behavior include DNS query logs, which can capture potentially malicious requests initiated from within the environment. Monitoring this telemetry is crucial to identifying and responding to outbound C2 traffic related to Cobalt Strike.

  ### Investigation Steps
  - **Review DNS Query Logs:** Examine the DNS logs for queries that begin with `aaa.stage.` or contain `.stage.123456.`. Take note of the frequency and source IPs associated with these requests.
  - **Correlate with Network Traffic:** Analyze network traffic flows for external connections made by the same source IPs as observed in the suspicious DNS queries. Check for unusual outbound traffic patterns that may indicate C2 activity.
  - **Assess Host Behavior:** Investigate the endpoints making the suspicious DNS queries. Look for process creation events that may indicate the presence of Cobalt Strike or related malware, such as unusual PowerShell executions or software installations.
  - **Monitor for Other Indicators:** Look for concurrent suspicious events, such as failed login attempts or other anomalous network activity that could be linked to a larger attack campaign involving Cobalt Strike.

  ### Prioritization
  Given the significant potential impact of Cobalt Strike on enterprise environments—where it can lead to data breaches, lateral movement, and long-term compromises—the alert is classified as critical. The likelihood of occurrence is heightened due to the tool's popularity among threat actors and its use in real-world attacks.

  ### Blind Spots and Assumptions
  This detection logic may not capture all Cobalt Strike activity since sophisticated attackers may use custom domains or encrypted traffic to evade detection. There is an assumption that DNS query logs are available and comprehensive; if DNS logging is not properly configured or if attackers use alternative methods for C2, detection could be missed. The effectiveness of this alert relies on the correct configuration of DNS logging at the firewall or network monitoring level, ensuring that all relevant queries are captured.

