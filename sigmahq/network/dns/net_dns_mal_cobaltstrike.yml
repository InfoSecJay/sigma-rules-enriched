note: |
  ### Technical Context

  This detection identifies suspicious DNS queries associated with Cobalt Strike beacons, particularly those that follow a predefined naming convention often leveraged by threat actors. The primary goal of an attacker using this technique is to maintain persistent command and control (C2) communication with compromised systems. This behavior is relevant to MITRE ATT&CK tactic **Command and Control (TA0011)** and technique **Application Layer Protocol: DNS (T1071.004)**. The primary telemetry source is DNS logs that capture the relevant query patterns for analysis. If malicious, successful exploitation could lead to unauthorized access and control over corporate resources. However, it is crucial to note that this detection alone does NOT confirm successful compromise; it indicates potential malicious activity requiring further investigation.

  ### Investigation Steps

  - **Verify DNS query analysis:** Review DNS query logs for Event ID(s) related to the alerts generated; focus on queries starting with 'aaa.stage.' or containing '.stage.123456.'. Compare with known legitimate DNS records to identify discrepancies.

  - **Assess the source IP:** Identify the originating source of the suspicious DNS queries; correlate against internal asset inventories to understand if the source IP corresponds to a known asset or an unauthorized machine.

  - **Investigate historical behavior:** Examine historical DNS logs within a 7-14 day timeframe for repetitive querying from the same host—this indicates potential persistence. Look for unusual spikes in DNS requests.

  - **Identify related processes:** On the affected hosts, check for process creation linked to known Cobalt Strike executables or beaconing behavior. Focus on Security Event ID 4688 and Sysmon Event ID 1 for suspicious process launches.

  - **Baseline normal activity:** Document expected DNS activity on your network by referencing common subdomains used by internal applications. Establish baselines to better differentiate between potential threats and legitimate traffic.

  - **Cross-check with threat intelligence:** Utilize threat intelligence sources to check if the identified DNS queries have been reported in malicious contexts, enhancing confidence in the malicious correlation.

  ### Prioritization

  Due to its critical nature, this alert indicates high-risk behavior that could lead to a compromised system. The likelihood of malicious abuse is significant, considering Cobalt Strike is frequently used in targeted attacks. This behavior is weaponized and represents a severe risk requiring immediate investigation to prevent data breaches.

  ### Blind Spots and Assumptions

  This detection might miss advanced evasion techniques, such as DNS over HTTPS (DoH) or legitimate applications mimicking the query patterns. Reliable coverage requires comprehensive DNS logging and long-term retention of logs to observe patterns. Legitimate internal applications may generate similar DNS requests; ensure that queries originating from known internal services are well-documented. Related detections, such as monitoring for unusual outbound network connections, strengthen overall threat visibility and response capabilities.

