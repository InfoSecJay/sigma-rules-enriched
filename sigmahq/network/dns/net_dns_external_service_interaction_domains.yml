note: |
  ### Technical Context
  This detection rule targets unusual DNS queries directed towards external service interaction domains commonly associated with out-of-band interactions after a successful Remote Code Execution (RCE) attack. It identifies requests to several known domains that are often leveraged by attackers to exfiltrate data or maintain persistence within a compromised environment. These interactions may indicate that an attacker is using command and control (C2) infrastructure to communicate with the compromised device, potentially resulting in further exploitation.

  The prevalent threat scenario involves an attacker who has gained initial access through exploitation of vulnerabilities (e.g., CVE-2025-59287), leading to RCE. Following this, they might use these interaction domains to establish communication channels or gather data from compromised systems. The relevant MITRE ATT&CK tactics and techniques related to this detection include Initial Access (T1190) and External Remote Services (T1595.002), as they both pertain to the establishment of communication after breaching a system's defenses.

  Primary data sources for this detection rule are DNS logs, which include logs of DNS queries made by internal systems. Monitoring these logs allows security teams to identify suspicious queries that may indicate malicious activity.

  ### Investigation Steps
  - **Review DNS Logs**: Analyze DNS logs for queries matching the specified domains known for external service interaction. Look for any patterns or spikes in suspicious queries that may correlate with other malicious indicators.

  - **Correlate with EDR Data**: Investigate endpoint detection and response (EDR) logs to look for signs of compromise or unusual process behavior on the same devices making the suspicious DNS queries.

  - **Inspect Network Traffic**: Use network detection response (NDR) tools to review outbound traffic patterns correlating with the identified DNS queries. Identify any communications to external IPs associated with the flagged domains.

  - **Validate Context of Activity**: Confirm whether any legitimate applications or services may have been misidentified as malicious, such as security scanning tools, to minimize false positives. Investigate the context of the DNS requests.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact in an enterprise environment. Successful RCE followed by outbound DNS communication to suspicious domains may indicate an active threat actor maintaining access or exfiltrating sensitive data.

  ### Blind Spots and Assumptions
  This detection may not capture all possible malicious interactions, as attackers could use non-standard or less-known domains to conceal their operations. The rule assumes that all relevant DNS logs are being generated and retained, which may not always be the case if DNS logging is incomplete or misconfigured. Additionally, the detection logic may not account for legitimate applications that may utilize the flagged domains for valid purposes, leading to potential false positives. Proper logging and monitoring configurations are essential for effective detection of these threats.

