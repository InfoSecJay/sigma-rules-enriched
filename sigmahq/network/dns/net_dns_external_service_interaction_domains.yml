logsource:
  category: dns
detection:
  selection:
    query|endswith:
    - '.burpcollaborator.net'         # Portswigger Burpsuite Collaborator
    - '.canarytokens.com'         # Thinkst Canary Canarytokens
    - '.ceye.io'
    - '.ddns.1433.eu.org'         # dig.pm
    - '.ddns.bypass.eu.org'         # dig.pm
    - '.ddns.xn--gg8h.eu.org'         # dig.pm
    - '.digimg.store'         # dnslog.ink
    - '.dns.su18.org'         # javaweb.org
    - '.dnshook.site'         # webhook.site
    - '.dnslog.cn'
    - '.dnslog.ink'         # dnslog.ink
    - '.gobygo.net'         # gobies.org
    - '.instances.httpworkbench.com'         # httpworkbench.com
    - '.interact.sh'         # Project Discovery Interactsh
    - '.log.dnslog.pp.ua'         # dnslog.org
    - '.log.dnslog.qzz.io'         # dnslog.org
    - '.log.dnslogs.dpdns.org'         # dnslog.org
    - '.log.javaweb.org'         # javaweb.org
    - '.log.nat.cloudns.ph'         # dnslog.org
    - '.oast.fun'         # Project Discovery Interactsh
    - '.oast.live'         # Project Discovery Interactsh
    - '.oast.me'         # Project Discovery Interactsh
    - '.oast.online'         # Project Discovery Interactsh
    - '.oast.pro'         # Project Discovery Interactsh
    - '.oast.site'         # Project Discovery Interactsh
    - '.oastify.com'         # Portswigger Burpsuite Collaborator
    - '.p8.lol'         # javaweb.org
    - '.requestbin.net'
  filter_main_polling:
    query|contains: 'polling.oastify.com'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate security scanning.
level: high
note: |
  ### Technical Context

  This Sigma rule detects DNS queries made to known external domains associated with out-of-band application security testing (OAST) and callback services. Such domains are often utilized by attackers to confirm the exploitation of vulnerabilities (e.g., SSRF, XXE) or by security professionals conducting assessments on internal applications. The likely objective involves an attacker attempting to verify successful attacks or data exfiltration by triggering an external DNS lookup.

  This behavior falls under the MITRE ATT&CK framework tactically categorized as Reconnaissance (T1595), specifically technique T1595.002, "External Remote Services". The primary telemetry sources include DNS logs that capture the query, response types, source IP addresses, and timestamps. If malicious in nature, this can lead to compromised systems and unauthorized data access. Importantly, while the detection of a DNS query alone highlights potential malicious activity, it does NOT confirm exploitation or breach without further corroborative evidence.

  ### Investigation Steps

  - **Examine the DNS query details**: Look for Event ID  DNS Query logs; check the queried domain for known external callback addresses (e.g., burpcollaborator.net, canarytokens.com). Compare the source IP with a list of recognized servers in your environment.

  - **Correlate with outgoing connections**: Monitor for concurrent outbound connection attempts (check for Event ID 5156 for Windows Firewall) from the source host to any suspicious external IPs, ensuring to identify unusual ports or protocols in use.

  - **Identify previous behavior of the source host**: Review historical DNS logs for the affected host; look for a pattern of queries to the same or similar external domains over a short period, indicating a potentially automated tool or malicious activity.

  - **Check for legitimate scanning activity**: Determine if the target system is related to any scheduled security assessments; verify logged activity against known internal tools or operations (e.g., Nuclei, Gobies) that may generate similar DNS queries.

  - **Analyze the query string for unique identifiers**: Inspect the full DNS query for unique subdomains that may reveal encoded session information. Legitimate queries often do not contain such encodings or would correlate with known testing protocols.

  ### Prioritization

  This alert should be treated as high severity due to the potential for serious impacts on application security and data integrity if malicious. The likelihood of adversaries using OAST domains to conduct scans or exploit services is significant, and similar tactics are frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of encrypted DNS (DoH/DoT), which would obfuscate DNS traffic, preventing visibility into queries. Additionally, if log configurations are not set to capture all DNS queries, legitimate testing behaviors could similarly trigger alerts. Organizations should consider companion detections related to outbound traffic anomalies to enhance context around potential exfiltration.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
