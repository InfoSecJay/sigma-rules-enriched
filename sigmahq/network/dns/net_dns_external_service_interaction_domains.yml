title: DNS Query to External Service Interaction Domains
id: aff715fa-4dd5-497a-8db3-910bea555566
status: test
description: |
  Detects DNS queries to well-known out-of-band application security testing (OAST) and callback domains.
  These services (e.g. Burp Collaborator, interactsh, canarytokens, dnslog.cn) are used by security
  researchers and attackers alike to confirm blind vulnerabilities such as SSRF, XXE, blind RCE, and
  Log4Shell-style injections, where the exploit payload triggers an external DNS lookup to a controlled domain.

  A detection indicates that a host on your network resolved one of these domains, which may mean:
      (1) an attacker is actively probing or exploiting a vulnerable service and using the callback to
      confirm code execution or data exfiltration,
      (2) a security scanner (e.g. Nuclei, Gobies) is running against internal targets.

  Investigate the source host, the full DNS query string (the unique subdomain prefix encodes the callback session),
  and any concurrent outbound connections or process activity to determine intent.
references:
- https://twitter.com/breakersall/status/1533493587828260866
- https://www.bitdefender.com/en-us/blog/businessinsights/bitdefender-advisory-critical-unauthenticated-rce-windows-server-update-services-cve-2025-59287
- https://github.com/SigmaHQ/sigma/pull/5724#issuecomment-3466382234
- https://hunt.io/blog/open-directory-nginx-rift-ghost-cms-multi-cve
author: Florian Roth (Nextron Systems), Matt Kelly (list of domains)
date: 2022-06-07
modified: 2026-07-23
tags:
- attack.initial-access
- attack.t1190
- attack.reconnaissance
- attack.t1595.002
logsource:
  category: dns
detection:
  selection:
    query|endswith:
    - '.burpcollaborator.net'         # Portswigger Burpsuite Collaborator
    - '.canarytokens.com'         # Thinkst Canary Canarytokens
    - '.ceye.io'
    - '.ddns.1443.eu.org'         # dig.pm
    - '.ddns.bypass.eu.org'         # dig.pm
    - '.ddns.xn--gg8h.eu.org'         # dig.pm
    - '.digimg.store'         # dnslog.ink
    - '.dns.su18.org'         # javaweb.org
    - '.dnshook.site'         # webhook.site
    - '.dnslog.cn'
    - '.dnslog.ink'         # dnslog.ink
    - '.gobygo.net'         # gobies.org
    - '.instances.httpworkbench.com'         # httpworkbench.com
    - '.interact.sh'         # Project Discovery Interactsh
    - '.log.dnslog.pp.ua'         # dnslog.org
    - '.log.dnslog.qzz.io'         # dnslog.org
    - '.log.dnslogs.dpdns.org'         # dnslog.org
    - '.log.javaweb.org'         # javaweb.org
    - '.log.nat.cloudns.ph'         # dnslog.org
    - '.oast.fun'         # Project Discovery Interactsh
    - '.oast.live'         # Project Discovery Interactsh
    - '.oast.me'         # Project Discovery Interactsh
    - '.oast.online'         # Project Discovery Interactsh
    - '.oast.pro'         # Project Discovery Interactsh
    - '.oast.site'         # Project Discovery Interactsh
    - '.oastify.com'         # Portswigger Burpsuite Collaborator
    - '.p8.lol'         # javaweb.org
    - '.requestbin.net'
  filter_main_polling:
    query|contains: 'polling.oastify.com'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate security scanning.
level: high
note: |
  ### Technical Context

  This rule detects DNS queries to domains commonly associated with out-of-band application security testing (OAST) and callback services used by both security researchers and attackers. The primary behavior being detected signifies that a host on the network initiated a DNS lookup to a known OAST domain, which could indicate exploitation attempts leveraging vulnerabilities like SSRF, XXE, or blind RCE. The detection relates to the MITRE ATT&CK tactics of Initial Access (T1190) and Reconnaissance (T1595.002).

  The main telemetry sources for this detection are DNS logs covering DNS query types (UDP/TCP), with a focus on specific domains listed in the Sigma rule. If the detection is confirmed maliciously, it may imply an active probing for vulnerabilities or a successful exploitation scenario. However, it is crucial to note that this detection does not conclusively prove that an exploit has succeeded or that malicious intent is present without further context.

  ### Investigation Steps

  - **Investigate the source host's recent activity**: Review network traffic logs (e.g., Event ID 4688) to identify processes that might have generated the DNS query. Look for any unusual outbound connections from this host, particularly to external addresses.

  - **Analyze DNS query details**: Check DNS logs for the complete query string, focusing on the unique subdomain prefix that encodes the callback session. This may provide insights into whether the interaction is legitimate or suspicious.

  - **Identify legitimate security scanning behavior**: Review logs for known legitimate security scanning tools operating within the environment (e.g., Nuclei or Gobies) and their expected activity patterns, such as scaling DNS queries within a short timeframe or accessing specific targets.

  - **Correlate with concurrent outbound connections**: Cross-reference DNS logs with firewall or proxy logs to identify any concurrent outbound traffic to external IPs associated with the queried domains. Malicious indicators include unusual spikes or traffic to the detected OAST domains outside of normal behavior.

  - **Assess asset criticality**: Determine the role of the host that initiated the DNS query. If it's a critical system (e.g., a web server or API gateway), prioritize your investigation.

  ### Prioritization

  This alert is high severity due to the potential risk it represents, particularly if the affected system has a critical role in the enterprise. The likelihood of malicious use is high, as these OAST domains are commonly exploited by attackers for reconnaissance and confirmation of successful code execution. Such behaviors can lead to data breaches or further compromise of internal systems.

  ### Blind Spots and Assumptions

  Effective detection is limited by the completeness of DNS logs. Should a threat actor employ encrypted DNS (DNS over HTTPS/TLS), these queries may not be captured. Additionally, legitimate activities such as authorized security testing or vulnerability assessments can trigger the alert, potentially leading to false positives. A related detection to consider could be monitoring outbound connections to newly registered or infrequently accessed domains to enhance coverage and identify potential abuse earlier.

