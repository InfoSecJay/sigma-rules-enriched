logsource:
  category: dns
detection:
  selection:
  - query|endswith:
    - '.burpcollaborator.net'           # Portswigger Burpsuite Collaborator
    - '.canarytokens.com'           # Thinkst Canary Canarytokens
    - '.ceye.io'
    - '.ddns.1443.eu.org'           # dig.pm
    - '.ddns.bypass.eu.org'           # dig.pm
    - '.ddns.xn--gg8h.eu.org'           # dig.pm
    - '.digimg.store'           # dnslog.ink
    - '.dns.su18.org'           # javaweb.org
    - '.dnshook.site'           # webhook.site
    - '.dnslog.cn'
    - '.dnslog.ink'           # dnslog.ink
    - '.gobygo.net'           # gobies.org
    - '.instances.httpworkbench.com'           # httpworkbench.com
    - '.interact.sh'           # Project Discovery Interactsh
    - '.log.dnslog.pp.ua'           # dnslog.org
    - '.log.dnslog.qzz.io'           # dnslog.org
    - '.log.dnslogs.dpdns.org'           # dnslog.org
    - '.log.javaweb.org'           # javaweb.org
    - '.log.nat.cloudns.ph'           # dnslog.org
    - '.oast.fun'           # Project Discovery Interactsh
    - '.oast.live'           # Project Discovery Interactsh
    - '.oast.me'           # Project Discovery Interactsh
    - '.oast.online'           # Project Discovery Interactsh
    - '.oast.pro'           # Project Discovery Interactsh
    - '.oast.site'           # Project Discovery Interactsh
    - '.oastify.com'           # Portswigger Burpsuite Collaborator
    - '.p8.lol'           # javaweb.org
    - '.requestbin.net'
    - '.requestrepo.com'
  - query: 'requestrepo.com'
  filter_main_polling:
    query|contains: 'polling.oastify.com'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate security scanning.
level: high
note: |
  ### Technical Context

  This Sigma rule detects DNS queries made to known out-of-band application security testing (OAST) and callback domains. These domains are often utilized by attackers and security researchers to verify successful exploitation of vulnerabilities, such as SSRF, XXE, blind RCE, and injection attacks that trigger external DNS lookups to a controlled server. The detected activity indicates the possibility that an attacker may be probing or exploiting an internal service or that an authorized security scanner is being used.

  The relevant MITRE ATT&CK tactics and techniques include Initial Access (T1190) and Reconnaissance (T1595.002). Primary telemetry sources for detection are DNS logs exhibiting specific query patterns. If malicious, the security impact could include unauthorized access, data exfiltration, or disruptive actions within the environment. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate security tools may trigger these queries.

  ### Investigation Steps

  - **Examine the source of DNS queries:** Review DNS logs (Event IDs 22 for Windows DNS server or Sysmon Event ID 23 for DNS query) to identify the originating host and the exact queries made, focusing on subdomain patterns and timestamps to assess intent.

  - **Assess concurrent network connections:** Check for simultaneous outbound connections from the identified host. Utilize firewall or proxy logs (e.g., firewall logs Event ID 5156 for Windows) to identify patterns, such as requests to known malicious IPs or other unauthorized services.

  - **Identify expected legitimate behavior:** Validate if the host is known to perform security scans or penetration testing activities that might involve callbacks to the detected domains. Check asset roles and activities in the context of ongoing security assessments.

  - **Look for high-confidence malicious indicators:** Cross-reference the details of the DNS query with known attacker activity. Monitor for unusual subdomain patterns typical of malicious exploitation attempts, such as those involving unexpected parameters or base64 encoding.

  - **Review recent changes on the host:** Check for any recent software installations, configuration changes, or unusual script execution (Security Event ID 4688 for process creation). Focus on the creation of temporary files or unusual outbound traffic spikes that could indicate data exfiltration.

  ### Prioritization

  This alert carries a high severity level due to the potential for significant impact on sensitive systems if exploited. The likelihood of such DNS queries being related to malicious activity is elevated, given the nature of the domains involved, which are commonly weaponized by attackers to affirm compromise.

  ### Blind Spots and Assumptions

  Detection may have limitations, as legitimate security tools could generate similar DNS queries, leading to false positives. Reliable detection requires comprehensive DNS logging configurations and monitoring. There is potential for misinterpretation of legitimate security assessments as malicious activity. Related detections, such as unusual outbound network connections or alerts for known exploit frameworks (e.g., Cobalt Strike, Metasploit), can improve overall coverage and context.

