falsepositives:
- Legitimate security scanning.
level: high
note: |
  ### Technical Context

  This Sigma rule detects DNS queries to a specific set of external domains commonly associated with command and control (C2) or exfiltration services used by attackers following remote code execution (RCE). The primary objective of these queries is likely to establish communication with a malicious server for further instructions or data exfiltration. This behavior falls under the MITRE ATT&CK tactics of Initial Access (TA0001), specifically using Exploit Public-Facing Application (T1190), with reconnaissance methods related to External Remote Services (T1595.002).

  The primary telemetry sources for this detection are DNS query logs, which should include Record Type A and AAAA, along with query fields indicating the DNS request and the responding IP. If this activity is indeed malicious, it can lead to a breach of sensitive information and escalation of privileges within the network. Importantly, this detection does NOT confirm a successful compromise on its own; it simply flags the existence of suspicious DNS queries indicative of potential malicious intent.

  ### Investigation Steps

  - **Review DNS query logs**: Check for DNS queries matching the following patterns: `.burpcollaborator.net`, `.oast.fun`, and other domains listed in the rule. Focus on Event ID 22 from your DNS logging solution to pinpoint these queries.

  - **Identify legitimate activity context**: Determine if there were any expected or approved testing activities during the timeframe of detection. Security scanning tools or internal tests may legitimately query these domains.

  - **Cross-reference with internal systems**: Analyze the related host's outbound connections (Event ID 5156) or application activity (Event ID 4688) for any process initiating these DNS queries. Windows environments may indicate processes like `powershell.exe` or `cmd.exe` that interacted with the external services.

  - **Investigate for indicators of compromise**: Look for actual external communication attempts correlated with the flagged DNS queries by reviewing firewall logs (Event ID 51530) for outbound connections to the identified domains, noting down the timestamps to establish a sequence of events.

  - **Examine threat intelligence**: Utilize threat intelligence platforms to correlate detected domains with known malicious entities or campaigns. Use the domain reputation system to assess whether these domains are flagged for malicious activity.

  - **Collect and analyze exfiltration artifacts**: Validate the logging of data transmission or file uploads linked to the detected queries. For example, check for any file access logs (Event ID 4663) or data transfer activities associated with the processes initiating the DNS queries.

  ### Prioritization

  This alert should be classified as high severity due to the potential impact on sensitive data and system integrity. The likelihood of malicious behavior is considerable, especially since the detected domains are heavily utilized by threat actors for establishing C2 channels. Such behavior can indicate a broader attack campaign or exploitation attempt that is commonly seen in the wild.

  ### Blind Spots and Assumptions

  The primary detection limitation lies in the potential for false positives stemming from legitimate security testing activities that could generate similar DNS queries. Reliable detection necessitates comprehensive DNS logging across all relevant assets and clear documentation of allowed domains for typical security tools. Additionally, legitimate cloud functions or services may legitimately query these domains, and frequent requests should invoke a review process. A companion detection to consider might be monitoring unusual outbound traffic patterns or encrypted DNS requests to further enhance the risk coverage.

