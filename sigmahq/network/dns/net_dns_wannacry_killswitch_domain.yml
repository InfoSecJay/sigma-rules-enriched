  ### Technical Context

  This rule detects DNS queries for known WannaCry killswitch domains. These domains were hardcoded in the WannaCry ransomware and can indicate an active attempt to successfully execute the ransomware payload on a system. The likely attacker objective is to establish command and control communication or to detonate the ransomware payload if it has been inadvertently triggered on an endpoint.

  This behavior aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001). The primary telemetry sources include DNS logs where the query strings of interest are explicitly identified. If malicious, the impact can be significant as WannaCry encrypts files on compromised systems, leading to data loss and service disruption.

  It is important to note that this detection does NOT confirm that an infection or successful attack has occurred; it only indicates that there have been attempts to reach known domains associated with WannaCry.

  ---

  ### Investigation Steps

  - **Review DNS Logs:** Examine DNS query logs (Event ID  DNS Query Logs) for queries matching 'ifferfsodp9ifjaposdfjhgosurijfaewrwergwea.testing', 'ifferfsodp9ifjaposdfjhgosurijfaewrwergwea.test', etc. Look for timestamps that correlate with system activity, specifically around noted indicators.

  - **Check Associated Processes:** Identify any processes on affected hosts using Sysmon Event ID 1 (Process Creation) that might correlate with these DNS queries. Look for suspicious or unexpected executables that could have triggered the DNS resolution.

  - **Correlate with Firewall Logs:** Investigate firewall logs for outbound connections made to the corresponding IPs of the identified domains (check logs for suspicious connections). Any unusual or unauthorized outbound connections should be flagged.

  - **Identify Legitimate Use Cases:** Confirm if there are any legitimate services within the environment known to utilize similar queries. This may indicate that the queries were a result of legitimate software updates or network services.

  - **Collect Endpoint Artifacts:** If the rule triggers and potential malicious indicators are confirmed, collect and analyze the endpoints for any signs of the WannaCry ransomware (e.g., encrypted files and ransom notes). Look for known file creation artifacts on critical assets.

  - **Escalate Findings:** If a query for any of the listed domains correlates with suspicious processes or outbound connections, escalate as a high-priority incident. Document all findings and corresponding investigative actions for further analysis.

  ---

  ### Prioritization

  Alerts triggered by this rule should be treated as high severity due to the critical nature of the WannaCry threat. The likelihood of exploitation is heightened in environments lacking proper patch management, making this behavior particularly concerning as it directly relates to widely weaponized ransomware.

  ---

  ### Blind Spots and Assumptions

  Detection relies on accurate DNS logging; misconfiguration or absence of DNS logs can result in missed indicators. Evasion techniques may include using encrypted DNS (DoH/DoH) or querying alternate domains. Additionally, legitimate testing activities by analysts or misconfigured applications could trigger this alert. Related detections include monitoring for abnormal file modifications or high CPU usage often associated with ransomware activity.

