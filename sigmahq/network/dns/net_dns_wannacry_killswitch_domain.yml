  ### Technical Context

  This rule detects DNS queries made to known WannaCry killswitch domains, specifically patterns associated with the malware's command and control infrastructure. The likely attacker objective is to either check if a system is infected with WannaCry or to retrieve additional commands if the malware is active. This behavior aligns with the MITRE ATT&CK technique "Application Layer Protocol" (TA0040: T1071.001), highlighting its use of standard DNS queries for C2 communication. The primary telemetry source is DNS logs, specifically looking for queries matching the specified suspicious domain names. If confirmed as malicious, this behavior could signify active infection and potential data encryption, leading to significant operational impact. This detection does NOT confirm an active infection on its own, as it can be triggered by benign queries or testing.

  ### Investigation Steps

  - **Check DNS query logs for specific domains:** Review DNS logs for Event ID DNS Query that match the following domains: `ifferfsodp9ifjaposdfjhgosurijfaewrwergwea.testing`, `ayylmaotjhsstasdfasdfasdfasdfasdfasdfasdf.com`. If found, escalate for further analysis.

  - **Verify host network connections:** Utilize network telemetry to identify if the affected hosts are attempting connections to these domains. Check logs for outbound connections on ports typically used by WannaCry, such as TCP/445 (SMB), ensuring to correlate the timestamps of DNS queries.

  - **Review historical network traffic patterns:** Assess past DNS query activity from affected hosts for anomalies. Legitimate systems typically show consistent, expected DNS patterns; compare against the baseline.

  - **Monitor for high-confidence malicious indicators:** Identify any associated network traffic or alerts for files or processes related to WannaCry (e.g., processes accessing C:\Windows\Temp\ or creating random files). Look for Sysmon Event ID 1 for process creations that correspond with the timeframe of DNS queries.

  - **Assess host role and criticality:** Determine if the querying host is critical in your environment. Servers with sensitive data exposed to ransomware may impact overall enterprise risk. Include asset context in the analysis to prioritize containment efforts.

  ### Prioritization

  The alert is high severity due to the potential impact of ransomware on the affected systems, which can lead to significant operational disruption and data loss. Given that WannaCry has historically been weaponized in widely publicized attacks, a positive detection necessitates immediate investigation.

  ### Blind Spots and Assumptions

  Detection is limited by any potential evasion tactics, such as malware configuring to bypass known domains or using custom DNS settings. Reliable detection requires complete logging of DNS queries, including recursive DNS traffic. Legitimate activities might include security analyst testing or malicious domain experiments by pentesters that could trigger similar alerts. Companion detections such as drops in service availability or unexpected file modifications would augment the overall investigation process.

