note: |
  ### Technical Context
  This detection rule identifies DNS queries made to the known "killswitch" domains associated with the WannaCry ransomware campaign. The WannaCry malware exploits vulnerabilities in the Windows operating system to encrypt files and demand ransom payments, making detection and prevention critical for enterprise security. Attackers may initiate this ransomware attack to disrupt operations, extort money, or cause reputational damage, especially in sectors reliant on digital infrastructure.

  The relevant MITRE ATT&CK tactics include **Command and Control (T1071.001)**, as the malware attempts to contact external servers once deployed in a compromised environment. The primary data source for this detection is the DNS query logs, which record the domain names requested by devices within the network. Monitoring these logs is essential in identifying potentially malicious activities before they escalate.

  ### Investigation Steps
  - **Review DNS Query Logs:** Examine the DNS logs for any queries matching the known WannaCry killswitch domains listed in the rule. This will help confirm if any internal systems were attempting to communicate with malicious external domains.
  - **Analyze Endpoint Activity:** Correlate the DNS query with process creation logs or EDR data on reported endpoints. Identify if there are any anomalous behaviors, such as unexpected processes or new executables that correspond with the DNS requests.
  - **Check for Malware Indicators:** Look for any additional IoCs that might indicate the presence of the WannaCry ransomware, including known file hashes, connections to unusual IP addresses, or unexpected changes to file systems.
  - **Assess Network Traffic:** Review network logs from the firewall and other network monitoring tools for any suspicious outbound connections made around the time the DNS queries were logged. This can shed light on potential exfiltration attempts or further malicious communications.

  ### Prioritization
  This alert has a high severity due to the potential impact of a ransomware attack on business operations, data integrity, and reputation. Given the likelihood of rapid propagation and significant damage, timely response to such indicators is crucial.

  ### Blind Spots and Assumptions
  The detection relies on the assumption that the DNS logs are being captured and retained in a timely manner. If DNS logging is misconfigured or not enabled, such requests may go undetected. Additionally, analysts must be aware that legitimate users might occasionally query these domains for testing or research purposes, which could generate false positives. To ensure effective detection, it is essential to maintain comprehensive and continuous logging configurations across all relevant network devices.

