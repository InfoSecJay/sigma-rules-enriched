  ### Technical Context
  This detection rule identifies suspicious DNS queries directed at the Telegram Bot API, specifically requests to `api.telegram.org`. The presence of these DNS queries may indicate the usage of malicious Telegram bots, which attackers can exploit for command-and-control (C2) communication or data exfiltration. Attackers often leverage Telegram's bot capabilities to manage compromised systems, deploy payloads, or steal data without being tracked easily, as Telegram provides a seemingly benign communication channel.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include **Command and Control (TA0011)**, particularly the technique of **Application Layer Protocol (T1102.002)**, where communication occurs over HTTP/S or other commonly used protocols to evade detection. The primary data source for this detection is DNS query logs, which capture all requests made to external domains and can reveal unusual outbound communications.

  ### Investigation Steps
  - **Review DNS Query Logs:** Examine the logs for recent queries to `api.telegram.org`, focusing on the timestamp and originating IP addresses to identify any anomalous patterns.
  - **Analyze Event Correlation:** Cross-reference any detected queries with endpoint activity, looking for instances of command execution, suspicious file transfers, or unexpected software installations that might tie back to the use of Telegram bots.
  - **Monitor Endpoint Connections:** Investigate compromised hosts for unusual outbound connections, particularly those that establish communication with known malicious IP addresses or Telegram bot accounts.
  - **Engage Incident Response:** If any malicious activity is confirmed, escalate the findings to the incident response team to contain the threat and conduct a full forensic analysis of the affected systems.

  ### Prioritization
  The severity of this alert is medium, as the detection of Telegram Bot API requests could indicate intermediate to advanced threats; however, legitimate business uses of Telegram cannot be ruled out. Response teams should assess the context of the detected activity to determine appropriate actions.

  ### Blind Spots and Assumptions
  This detection may have blind spots related to the legitimate use of Telegram bots within the organization, leading to potential false positives. It assumes that all DNS requests are logged and that no significant DNS obfuscation techniques (such as tunneling) are employed by attackers. The effectiveness of this rule depends on having comprehensive logging of DNS queries configured across the network, as well as the enforcement of consistent monitoring of suspicious outbound connections.

