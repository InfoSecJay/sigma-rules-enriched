  ### Technical Context

  This Sigma rule detects suspicious DNS queries made to the Telegram Bot API at `api.telegram.org`. Attackers may leverage this API to establish command and control (C2) communications, using Telegram as a covert channel to send commands or exfiltrate data. The activity aligns with the MITRE ATT&CK technique for Command and Control (T1102.002 - Application Layer Protocol). The primary telemetry source for this detection is DNS logs that capture query types and hostnames. If malicious, this behavior could lead to significant security incidents, such as data exfiltration or lateral movement within the environment. However, this detection alone does not confirm that the activity is malicious as it may also indicate legitimate uses of Telegram bots by company personnel.

  ### Investigation Steps

  - **Check DNS query logs:**
    Retrieve DNS logs where the queries reference `api.telegram.org`, particularly seeking Event ID  DNS Query events. Look for a high volume of queries which may indicate automated bot communications.

  - **Verify hostname resolution:**
    Examine the responses returned for the DNS queries to `api.telegram.org` to determine if they resulted in external IP addresses associated with known malicious Telegram C2 infrastructure.

  - **Investigate associated user accounts:**
    Cross-reference the timestamps of DNS queries with the accounts that made them. Look for unusual accounts or those with no prior association with Telegram, flagged as potentially compromised.

  - **Clarify legitimate usage:**
    Identify normal usage patterns of Telegram within the organization, consulting internal communications or development teams. Detect benign behavior characterized by sporadic queries during business hours by known users.

  - **Monitor outbound traffic:**
    Review the outbound traffic logs (e.g., firewall logs) to ensure there is no unusual volume or unique traffic patterns to the resolved IPs associated with Telegram.

  - **Assess endpoint activity:**
    Search for any processes or applications on endpoints initiating connections to `api.telegram.org`. Look for known Telegram client applications or any unauthorized scripts utilizing WebSocket or HTTP methods to this endpoint.

  ### Prioritization

  Alerts for DNS queries to Telegram's API should be treated with medium priority, as they may indicate potential command and control activity. Given the increasing use of Telegram for C2 among threat actors, there is a significant risk of exploitation, especially if unusual patterns emerge from critical systems.

  ### Blind Spots and Assumptions

  This detection may produce false positives from legitimate business uses of Telegram bots. It relies on accurate DNS logging configurations, and limited or absent logs may hinder effective detection. Additionally, evasion techniques could involve redirecting communications to less monitored or untracked domains. A related detection to strengthen coverage would be monitoring for unusual outbound traffic to predefined benign IP addresses associated with known Telegram services.

