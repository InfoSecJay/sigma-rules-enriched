level: medium
note: |
  ### Technical Context

  This Sigma rule detects DNS queries sent to wildcard DNS services that dynamically resolve subdomains to embedded IP addresses (e.g., nip.io, sslip.io). It is likely triggered by attackers aiming to establish command-and-control (C2) channels or set up phishing infrastructure without the need for custom domain registration, thereby enhancing their evasion tactics. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), with techniques T1071.004 (Application Layer Protocol: DNS) and T1568 (Dynamic Resolution).

  Primary telemetry sources include DNS logs capturing query details and responses. The security impact of malicious activity includes potential data exfiltration or unauthorized access to corporate resources. This detection does NOT confirm malicious activity on its own; legitimate users may access these services for valid development or testing purposes.

  ### Investigation Steps

  - **Review DNS logs for queries**: Inspect DNS query logs (e.g., DNS Event ID 22) for requests ending with `.nip.io`, `.sslip.io`, and other listed domains. Compare timestamps and originating IP addresses against known network traffic patterns.

  - **Identify high-confidence malicious activity**: Confirm whether the queried domains resolved to unusual or unexpected IP addresses. Malicious indicators could include any resolution to external IP addresses that match threat intelligence reports of known C2 servers.

  - **Examine host behaviors**: Check the originating system for recent process creation events (Security Event ID 4688 or Sysmon Event ID 1) that correspond to the timestamps of the DNS queries. Investigate any unusual applications not typically associated with healthy operations on that system.

  - **Identify and document legitimate use cases**: Cross-reference queries from known development teams or CI/CD tools utilizing wildcard DNS services for localized testing. Document cases where expected patterns (e.g., *.nip.io during a particular development cycle) occur.

  - **Assess for data leaks or exfiltration**: Investigate any related outbound traffic on the same timeline. Look for signs of data exfiltration to observed IP addresses, potentially indicated by firewall logs showing unexpected traffic flows.

  ### Prioritization

  This alert has medium severity due to the potential impact on the enterprise network if a malicious actor establishes a C2 channel. Wildcard DNS services are increasingly weaponized by adversaries, raising the likelihood of such inquiries being malicious rather than benign.

  ### Blind Spots and Assumptions

  This detection may miss queries to other similar wildcard DNS services not included in the list. It assumes all necessary DNS logging is enabled for comprehensive visibility. Legitimate development activity, especially from CI/CD systems or developers, may trigger the alert. A related detection that strengthens coverage is monitoring for unusual outbound connections from internal systems to unknown IPs following these DNS queries.

