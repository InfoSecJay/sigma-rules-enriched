note: |
  ### Technical Context

  This rule detects the creation of an administrator account on a Fortinet FortiGate Firewall. The likely attacker objective is to establish persistent access and control over the network by adding new administrative accounts, potentially part of an ongoing compromise. This activity fits into the MITRE ATT&CK tactic of **Persistence** (TA0003) and technique **Create Account** (T1136.001). The primary telemetry sources include FortiGate Event Logs, capturing the `action: 'Add'` with a focus on the `cfgpath: 'system.admin'`. If this behavior is malicious, it could lead to unauthorized access and manipulation of firewall rules or sensitive network configurations. Importantly, this detection does NOT confirm that the account creation is malicious on its own; legitimate administrative account creation is also possible.

  ### Investigation Steps

  - **Review account details:** Check admin account creation logs for `username`, `source IP`, and `timestamp` to identify unauthorized or suspicious patterns. Look for Event IDs related to admin creation in FortiGate logs.

  - **Correlate with user role:** Determine if the account was created by a legitimate administrator. Assess prior and subsequent logs for activities performed by the new account, particularly any changes in configurations or policies.

  - **Validate existing administrators:** Cross-reference the newly created account against a list of pre-approved administrative users to identify unauthorized accounts. This can be done by checking against the login history and documented admin roles.

  - **Analyze source IPs:** Investigate the source IP address of the logged action to determine if it originates from a known internal network location or if it appears suspicious or foreign.

  - **Identify related suspicious behavior:** Look for additional FortiGate logs showing account modifications or suspicious API calls that could indicate further malicious activity. For example, check for logins following the creation, especially from non-standard locations or times.

  - **Check for common administrative tasks:** Understand the context of the environment; if routine account creation is performed regularly, this may influence the severity of this specific alert. Overlay with change management records if available.

  ### Prioritization

  This alert should be taken seriously due to the potential impact of unauthorized administrative access on critical network configurations. The likelihood of malicious abuse is moderate, especially if associated with anomalous activity. Since the creation of admin accounts is a common tactic in attacks, it warrants prompt attention.

  ### Blind Spots and Assumptions

  Detection is limited if the FortiGate logging is misconfigured or if logs are tampered with. Legitimate activities such as onboarding new admin personnel for system maintenance can trigger this alert. Companion detections include monitoring for subsequent admin logins or unexpected configuration changes that can provide context for ongoing potential threats.

