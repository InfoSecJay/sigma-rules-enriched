note: |
  ### Technical Context

  This Sigma rule detects the creation of a new administrator account on a Fortinet FortiGate Firewall. The behavior indicates a potential persistence mechanism that attackers might employ to maintain access to the network. The likely objective is to establish control over the firewall, which may allow for further exploitation or lateral movement within the network. This aligns with the MITRE ATT&CK tactic of "Persistence" and the technique “Create Account” (T1136.001).

  The primary telemetry sources involved are FortiGate event logs specifically capturing configuration changes related to the `system.admin` configuration path. If malicious, such an action could lead to unauthorized access, significantly compromising the security of the network. However, it is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities could also trigger this detection.

  ### Investigation Steps

  - **Review log details for account information:** Check FortiGate Event ID 44547 for user account details (username, creation time) to identify if the account was created as part of standard operations.

  - **Identify legitimate administrative changes:** Verify if there were scheduled maintenance activities or documented procedures allowing for the creation of new admin accounts. Refer to FortiGate logs around the time of the event for any corresponding change details (IDs, timestamps).

  - **Assess account permissions:** Examine the privileges of the new administrator account. Cross-reference against legitimate admin roles to determine if the permissions are excessive or inconsistent with expected configurations.

  - **Analyze related events:** Look for FortiGate Event ID 20007 or 20001 to check if the new admin account has initiated suspicious or unusual actions shortly after its creation, such as modifying firewall rules or accessing sensitive data.

  - **Monitor for associated alerts:** Ensure that additional alerting mechanisms are in place for any subsequent logins by the new admin account. High-frequency logins from unusual IP addresses could indicate unauthorized access attempts.

  ### Prioritization

  This alert is medium severity due to its potential impact if a malicious actor gains admin access to the firewall, which could enable them to manipulate security policies or monitor network traffic. The likelihood of malicious exploitation is moderate, particularly in organizations experiencing high threat activity, making vigilance essential.

  ### Blind Spots and Assumptions

  Detection may miss cases where an attacker uses existing admin credentials to create accounts without generating new alerts. Additionally, appropriate logging configurations must be enabled to capture all relevant events accurately; lacking this could result in missed detections. Legitimate administrative activities, such as planned upgrades or changes, could trigger this alert. A related detection worth monitoring is unauthorized changes to firewall configuration (e.g., logging Event ID 20001), which could indicate a compromised account is actively modifying settings.

