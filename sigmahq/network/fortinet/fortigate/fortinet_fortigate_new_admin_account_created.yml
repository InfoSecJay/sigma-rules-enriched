note: |
  ### Technical Context
  This detection rule targets the creation of new administrator accounts on Fortinet FortiGate firewalls. Unauthorized addition of admin accounts poses a significant risk, as it can be leveraged by attackers to maintain persistence, control network configurations, and gain access to sensitive information. Attackers typically seek to create these accounts stealthily to ensure continued access to the network, which can facilitate data exfiltration, lateral movement, or further exploitation.

  In terms of MITRE ATT&CK, this detection correlates with the tactics of **Persistence** (TA0003) and specifically the technique **Account Manipulation** (T1136.001). These tactics show how threat actors often seek to maintain their foothold within a compromised environment by creating or modifying accounts or permissions.

  The primary data source for this detection includes FortiGate firewall logs, particularly focusing on event logs that record administrative actions. Reviewing these logs can reveal unauthorized modifications and help identify potential security incidents before they escalate.

  ### Investigation Steps
  - **Review Administrator Account Creation Logs:** Investigate the logs related to administrator account creation in the FortiGate event logs to confirm the legitimacy of the account. Pay special attention to timestamps and IP addresses associated with the creation action.

  - **Analyze User Account Activity:** Examine the activity logs of the newly created administrator account to identify any suspicious actions or patterns following its creation, such as unusual login attempts or configuration changes.

  - **Correlate with Network Traffic:** Monitor network traffic to and from the FortiGate firewall during the timeframe of the account creation. Look for any anomalous access patterns or connections that coincide with the timing of the log entries.

  - **Check for Other Permission Changes:** Besides new accounts, review if there were any other significant changes to user roles or permissions on the FortiGate firewall that could indicate a broader compromise attempt.

  ### Prioritization
  The severity of this alert is medium, given that unauthorized administrator accounts typically indicate a significant risk to the organization’s infrastructure. The likelihood of impact is high, as these accounts can be leveraged for extensive control over the network environment.

  ### Blind Spots and Assumptions
  This detection rule may not capture account creations performed through legitimate administrative workflows, potentially leading to false positives when authorized personnel create new accounts. The effectiveness of this detection assumes that all relevant logs are enabled and correctly configured on the FortiGate device, including the logging of administrative actions. Additionally, variations in administrative access policies and legitimate account creation practices can introduce gaps in detection coverage if not accounted for.

