note: |
  ### Technical Context

  This Sigma rule detects the addition of a new firewall policy on a Fortinet FortiGate Firewall. This behavior may indicate attempts to manipulate firewall configurations, possibly for the purposes of facilitating unauthorized access or obscuring malicious activities. The likely attacker objective is to create a path for data exfiltration or impose network control without detection. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (T1213) and technique **Application Layer Protocol** (T1071).

  The primary telemetry source for this detection is FortiGate event logs. Required log types include `event` logs that document configuration changes in firewall policies. If malicious, this action could allow attackers to bypass security controls. Notably, this detection does NOT confirm malicious intent on its own; legitimate administrative activities may also result in the same log entries.

  ### Investigation Steps

  - **Identify relevant event logs:** Review FortiGate `event` logs (Log ID: 44547) for entries showing the `Add` action under `cfgpath: firewall.policy`. Check the timestamp and user associated with the change to verify legitimate administrative actions.

  - **Correlate with known administrative changes:** Compare the log entries with change management records. Legitimate configurations typically involve routine maintenance or updates from known administrators, while unrecognized accounts may indicate potential malicious activity.

  - **Check policy details and rules:** Investigate the contents of the new firewall policy. Review fields such as `src`, `dst`, `action`, and `service` for any configurations that allow unexpected or potentially dangerous traffic patterns, such as unrestricted access or connections to non-trusted hosts.

  - **Monitor for additional anomalies:** After detecting a new policy addition, scan for follow-up actions like traffic pattern changes using FortiGate traffic logs. High volumes of unusual outbound traffic following a policy change could indicate attempts at data exfiltration.

  - **Assess asset criticality:** Review the impacted system’s role within the network. Policies on sensitive assets, such as databases or servers storing PII, warrant elevated scrutiny, as malicious modifications could have significant repercussions.

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized changes to firewall policies on critical systems. The likelihood of malicious exploitation is moderate, as alterations to network configurations are commonly used in advanced attacks. Such behaviors are increasingly weaponized in targeted campaigns.

  ### Blind Spots and Assumptions

  This detection may not capture all evasion techniques; an attacker with appropriate privileges may circumvent logging through direct system access. Ensuring complete event logging configurations on FortiGate devices is crucial for reliable detection. Legitimate firewall policy changes may trigger alerts, particularly during routine operational changes or updates. A related detection could involve monitoring for unauthorized access to FortiGate management interfaces (e.g., checking logins to the administrative console).

