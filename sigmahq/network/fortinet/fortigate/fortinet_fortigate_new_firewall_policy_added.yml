note: |
  ### Technical Context

  This rule detects the addition of a new firewall policy on a Fortinet FortiGate firewall, which may indicate an attempt to change network access controls. The likely attacker objective is to establish unauthorized communication paths, block security monitoring, or facilitate other malicious actions by modifying the firewall configuration. The relevant MITRE ATT&CK tactics and techniques are Defense Evasion (T1562) and Impair Defenses (T1685). The primary telemetry source for this detection is the FortiGate event logs, specifically capturing events related to firewall configuration changes.

  If malicious, the impact could range from unauthorized data access to complete network compromise depending on the specifics of the policy added. However, this detection does NOT confirm malicious intent, as legitimate administrators may add policies for valid operational needs.

  ### Investigation Steps

  - **Verify Event Details:** Review FortiGate event logs (Log ID: 44547) to confirm the creation of the firewall policy, including the timestamp, user account making the change, and the specific rules applied.

  - **Evaluate User Activity:** Check user activity logs associated with the account that added the firewall policy (Event ID: 10001) for prior behaviors. A legitimate user will typically follow proper protocols and document all changes, whereas unusual behavior may flag a malicious actor.

  - **Cross-reference Configurations:** Compare the new firewall policy to existing policies for significant deviation. A new rule that increases access to sensitive network segments (e.g., open ports to an internal database) is a strong malicious indicator.

  - **Investigate Approval Workflow:** Review any documented change requests or approval workflows (e.g., ticket systems) tied to the change. Legitimate changes will usually have corresponding records showing they were sanctioned by a management-level review.

  - **Monitor Network Traffic:** After policy addition, monitor for unusual traffic patterns on the FortiGate firewall (e.g., Log ID 030002) to identify any unauthorized access attempts or anomalous flows indicative of exploitation.

  ### Prioritization

  This alert has a medium severity due to the potential impact on critical infrastructure. The likelihood of malicious abuse is moderate, as adversaries often exploit firewall configurations to further their objectives. However, legitimate administrative actions can also trigger this alert, necessitating careful analysis.

  ### Blind Spots and Assumptions

  Evasion techniques that may reduce detection effectiveness include using service accounts with elevated privileges to mask unauthorized changes. Reliable detection relies on consistent logging from the FortiGate firewall, ensuring that specific event logs are enabled. Legitimate activities that may trigger this alert include scheduled maintenance or security updates implemented by authorized personnel. A related detection to enhance coverage would be monitoring for deletions of firewall policies, which can also signify attempts to undo security measures.

