  ### Technical Context

  This Sigma rule detects the action of adding a new firewall policy on a Fortinet FortiGate Firewall. The likely attacker objective is to modify network traffic control, potentially allowing unauthorized access or data exfiltration. This activity falls under the MITRE ATT&CK technique: Defense Evasion (T1562). The primary telemetry sources for this detection include FortiGate event logs (Event ID related to configuration changes). If malicious, this could lead to data breaches or compromised network security. It is important to note that this detection does NOT confirm malicious intent by itself; legitimate administrative actions can trigger the same alert.

  ---

  ### Investigation Steps

  - **Review configuration logs:** Examine FortiGate event logs for Event ID 44547, specifically looking for the log field `action: Add` and `cfgpath: firewall.policy`. Confirm if the user account making the change has legitimate access permissions.

  - **Analyze user account activity:** Investigate the user account that executed the policy addition. Check for any recent unauthorized access attempts or policy changes (Event ID 44547) to assess if this action is consistent with past behavior.

  - **Identify network traffic impacts:** Monitor traffic flows before and after the policy was added. Specifically look for logs indicating new rules affecting sensitive ports or protocols (e.g., TCP/22 for SSH or TCP/80 for HTTP).

  - **Check for concurrent alerts:** Look for other related alerts that may indicate a trend, such as unauthorized login attempts (Event ID 4625) or suspicious changes in other configurations (like VPN setups).

  - **Document legitimate changes:** Establish what typical administrative actions look like, such as scheduled maintenance or legitimate security policy updates. If this addition correlates with known maintenance windows or scheduled changes, it may validate the legitimacy of the action.

  - **Investigate device criticality:** Identify if the FortiGate is a key asset in the network architecture. High-value assets should be monitored more closely for changes and reviewed for anomalies.

  ---

  ### Prioritization

  This alert is considered medium severity. While adding a firewall policy can be a legitimate administrative action, it poses significant risks if abused. Due to the capability of firewall policies to impact network controls, such actions are often targeted by adversaries and can be weaponized for network infiltration or exfiltration.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to legitimate administrative changes that may also trigger the alert, which can create false positives. Ensure appropriate levels of logging are configured, as missing logs could result in undetected malicious alterations. Additionally, legitimate changes carried out during scheduled maintenance or configuration updates could inadvertently generate alerts. A related detection to consider is the monitoring of user account activity for unauthorized access attempts, which can enhance coverage and context for this alert.

