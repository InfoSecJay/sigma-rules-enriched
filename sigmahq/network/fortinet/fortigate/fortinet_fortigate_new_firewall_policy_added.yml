note: |
  ### Technical Context

  This rule detects the addition of a new firewall policy on a Fortinet FortiGate Firewall. The behavior is indicative of potential changes to network defenses, which can be exploited by adversaries to bypass existing security provisions. The likely attacker objective is to alter firewall rules to enable unauthorized access or data exfiltration. This detection aligns with the MITRE ATT&CK technique for "Modify Cloud Provider Infrastructure" (T1562).

  The primary telemetry sources for this rule are FortiGate event logs that contain configuration changes. If malicious, this activity can result in unauthorized network access and compromise the integrity of the security posture. Importantly, this detection does NOT confirm that malicious intent was behind the policy addition, as legitimate administrators may also perform this action.

  ### Investigation Steps

  - **Verify the change in firewall policies:**
    Review FortiGate Event Logs (Log ID 44547) for the entry showing "action": "Add" and "cfgpath": "firewall.policy". Ensure that the policy added aligns with expected administrative changes.

  - **Identify the user account making changes:**
    Inspect the event log for the user account associated with the policy addition. Ensure it corresponds to a known and legitimate administrator, and check for any recent anomalous login patterns (e.g., unusual success/fail counts in Event Log ID 20003).

  - **Analyze the newly added policy:**
    Examine the specifics of the new firewall rule, including source and destination IPs, ports allowed, and protocols. Compare against existing policies for discrepancies that could indicate unintended permissions.

  - **Determine the context of policy addition:**
    Check for recent related configurations or changes in network topology that may have legitimately warranted a new firewall rule (e.g., infrastructure upgrades). Cross-reference with maintenance schedules or change management records.

  - **Look for signs of lateral movement:**
    Investigate surrounding events for odd internal traffic patterns (e.g., unusual spike in connections to and from the newly permitted IPs) through traffic analysis tools such as Suricata or Zeek logs, focusing on unexpected destinations.

  - **Assess prior policies for potential evasion tactics:**
    Identify if previously established policies were altered or deleted which would indicate a malicious intent to mask unauthorized access methods. Review logs for "action" set to "Delete".

  ### Prioritization

  This alert has medium severity due to the potential impact on network security, particularly in environments where sensitive data is handled. The likelihood of malicious abuse is credible, as adversaries often modify firewall settings to facilitate attacks. Such behavior is not uncommon among threat actors targeting network vulnerabilities.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of legitimate administrative activity that can trigger this rule, which may lead to false positives. Ensuring comprehensive logging from FortiGate is essential for reliable detection; myriads of contextual logs should be reviewed. Similarly, occurrences like routine updates or policy revisions by authorized personnel could generate this alert. A related detection could include monitoring for deletions of existing firewall policies, which would enhance visibility into potentially malicious configurations.

