note: |
  ### Technical Context
  This detection rule identifies instances where a new firewall policy is added to a Fortinet FortiGate Firewall. The addition of firewall policies can signify legitimate configuration changes; however, it can also indicate potential malicious behavior, such as an attacker attempting to circumvent existing security measures or create avenues for unauthorized access. When an attacker gains administrative access, they may modify firewall rules to allow traffic that facilitates further attacks, spreading malware, or exfiltrating sensitive data.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (T1562) as attackers may seek to alter firewall policies to evade detection. They might use this technique to introduce hidden pathways within the network or restrict monitoring capabilities. The primary data source for this detection is the FortiGate event logs, which document configuration changes, including the addition and deletion of firewall rules.

  ### Investigation Steps
  - **Review FortiGate Event Logs:** Start by examining the event logs specific to the FortiGate device. Look for log entries that detail new firewall policy additions along with timestamps, user accounts involved, and any related changes in configuration.

  - **Identify User Activity:** Analyze the accounts making the configuration changes. Check for unusual user behavior or access patterns, especially if a non-administrative user is making changes typically reserved for administrative accounts.

  - **Cross-Reference with Network Traffic:** Investigate the network traffic patterns around the time the policy was added. Look for any anomalous traffic flows that may correlate with the policy change, such as unexpected inbound or outbound connections.

  - **Assess Policy Changes and Impact:** Evaluate the specifics of the newly added firewall policy. Determine its implications on network security—identify which services can be accessed or restricted and assess whether this could facilitate nefarious activities.

  ### Prioritization
  This alert should be considered medium severity due to the potential impact of unauthorized firewall changes. While changes may be benign, the likelihood of misuse in an enterprise network environment warrants prompt investigation.

  ### Blind Spots and Assumptions
  Detection capabilities are limited in environments where logging might not be properly configured or where FortiGate firewalls are not adequately monitored. The detection logic assumes that all changes are logged and that there’s a baseline of normal configuration activities for comparison. If logging for configuration changes is disabled or if users regularly make legitimate changes that are outside the anticipated scope, it could lead to false negatives or positives in detection. Additionally, without effective user activity monitoring, it may be challenging to identify unauthorized access to firewall configuration changes.

