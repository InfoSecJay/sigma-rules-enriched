note: |
  ### Technical Context
  This detection rule identifies the creation of a new local user account on a Fortinet FortiGate Firewall. Local user accounts may be established by administrators for system access, but an unexpected new user could indicate unauthorized access or attempts to establish a foothold within the network, particularly via VPN connections. Threat actors may exploit local user accounts to gain elevated privileges or maintain persistence within the environment, allowing them to execute malicious activities undetected.

  The rule is particularly relevant for detecting attacks associated with the MITRE ATT&CK technique for account creation (T1136.001), which falls under the tactic of Persistence. A malicious actor may create a new local user for future access, especially when attempting to establish covert administrative privileges. The most pertinent data sources in this context are the FortiGate event logs, which contain entries regarding configuration changes such as user account management and authentication logs.

  ### Investigation Steps
  - **Review FortiGate Event Logs:** Examine the event logs on the FortiGate device for the specific log entries related to new local user creation. Focus on timestamps, user IDs associated with creations, and the originating IP addresses to identify any anomalies.
  - **Correlate User Activity:** Analyze other user activity logs during the same timeframe to establish a pattern. Ensure that the new user creation correlates with legitimate administrative activities and check for any unusual access attempts related to this new account.
  - **Inspect Historical User Changes:** Investigate recent user account modifications or deletions in conjunction with the new user creation to identify potentially malicious behavior. Look for signs of excessive account provisioning or sudden spikes in user activity.
  - **Assess VPN Connectivity Logs:** If VPN connectivity to the FortiGate is enabled, check for any connections made using the newly created account. Focus on access patterns and whether the user is engaging in any suspicious activities indicative of malicious intent.

  ### Prioritization
  The alert should be considered medium severity due to the potential risk of unauthorized access and persistence. The likelihood of attack can be significant in environments where administrators may overlook the creation of local users on firewalls, particularly prior to or during network breaches.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots regarding legitimate administrative activities if monitoring processes are not adequately in place or if changes are expected during maintenance periods. The assumption is that all local user creations should be scrutinized; however, legitimate needs for account creation do exist which may lead to false positives. Furthermore, the effectiveness of this rule relies on comprehensive logging configurations on FortiGate devices, as well as proper monitoring practices to respond to the alerts generated.

