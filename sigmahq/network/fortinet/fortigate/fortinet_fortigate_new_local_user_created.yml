note: |
  ### Technical Context

  This rule detects the creation of a new local user account on a Fortinet FortiGate Firewall. The behavior indicates potential unauthorized access points, as new local users could allow VPN connections and other administrative access if misused. The likely attacker objective is to establish persistence within the environment or facilitate unauthorized remote access. This activity is classified under the MITRE ATT&CK tactic of Persistence, specifically technique T1136.001 (Local Account). The primary telemetry source is FortiGate event logs, specifically logs related to user configuration changes.

  If this behavior is malicious, it can significantly impact network security by providing an adversary with an additional means to access the network. However, this detection does NOT confirm malicious intent on its own, as local users can also be created for legitimate administrative purposes. Analysts must verify if the user creation aligns with an organization's policies.

  ### Investigation Steps

  - **Review the user details:** Check the username, creation time, and associated privileges in the FortiGate event logs (Log ID 44547). Confirm that the username isn’t associated with known users and assess whether the account has elevated permissions.

  - **Correlate with configuration changes:** Examine the FortiGate configuration changes around the same timestamp using CLI logs (Log ID 398) to identify any suspicious activity or changes made that may indicate malicious intent.

  - **Validate legitimate user creation:** Compare the new user creation against a list of authorized personnel and expected operational changes. If the creation aligns with scheduled maintenance or user onboarding, mark it as legitimate.

  - **Assess network connections:** Inspect VPN connection logs (Log ID 260000) for any connections originating from the newly created user account. Look for unusual IP addresses or timestamps that deviate from normal access patterns.

  - **Identify suspicious scripts or automation:** Search through the event logs for any automated scripts or procedures that might have executed around the same time as the user account creation, which could indicate an automated attack vector.

  - **Monitor for subsequent malicious behavior:** Keep track of any further alerts related to the newly created account, especially those involving unauthorized access or administrative actions, as this may indicate a compromised account being utilized for further exploits.

  ### Prioritization

  This alert is of medium severity, as the affected FortiGate firewall is critical for network security. The likelihood of malicious use is moderate; attackers often leverage local user accounts for VPN access. While this behavior is a common tactic, not all new user creations indicate compromise, prompting further analysis.

  ### Blind Spots and Assumptions

  This detection can be evaded if an adversary deletes or modifies audit logs following user creation. Reliable detection depends on consistent logging configurations on FortiGate devices. Legitimate activities, such as routine user onboarding, might trigger this alert. Companion detections, such as monitoring for unusual VPN connections (Log ID 260000), can strengthen coverage and provide additional context to the user creation event.

