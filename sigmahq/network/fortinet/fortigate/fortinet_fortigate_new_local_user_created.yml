note: |
  ---

  ### Technical Context

  This detection rule identifies the creation of a new local user on a Fortinet FortiGate Firewall, which is a behavior often leveraged by adversaries to establish persistence. Attackers may create such accounts to gain unauthorized access, particularly for VPN connections, allowing them to bypass network defenses. This activity aligns with the MITRE ATT&CK tactic of Persistence and the specific technique T1136.001 (Create Account).

  The primary telemetry source is FortiGate event logs, specifically events logged under `user.local` configuration changes. If this activity is malicious, it could lead to a significant security breach, as unauthorized users could establish backdoor access to sensitive network resources. Importantly, this detection does NOT confirm malicious intent on its own; further investigation is necessary to determine if the user creation was authorized.

  ---

  ### Investigation Steps

  - **Validate the user creation details:** Review the `event` logs (Log ID: 44547) on the FortiGate for specifics about the new user. Check for attributes such as username, IP address, and timestamps to identify potential unauthorized actions.

  - **Correlate with administrative activities:** Investigate any prior events (Log ID: 40112 for Admin Login) around the time of user creation to ensure that an authorized administrator logged in from a trusted IP address before this action. Legitimate changes would typically occur during scheduled maintenance or configuration reviews.

  - **Identify high-risk usernames:** Look for names of newly created users that might indicate malicious intent (e.g., `admin`, `vpnuser`, or similar deceptive usernames). Malicious behaviors often involve suspicious naming conventions to disguise unauthorized access.

  - **Monitor for additional associated activities:** Check for VPN logs (Log ID: 40319) and authentication events related to the new user. If the user is actively trying to connect immediately after creation, this is strongly indicative of adversarial behavior.

  - **Review account usage patterns:** Analyze other logs (FortiOS logs for user sessions) to assess if the new account is being used outside of normal operational patterns, such as access attempts at odd hours or from geographical locations that do not align with enterprise norms.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential for unauthorized access and persistence on critical systems. The likelihood of malicious abuse is moderate, especially in environments where user management is not tightly controlled. However, the creation of local users can also occur for legitimate administrative needs, necessitating careful investigation before concluding malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection of user creation may be evaded by insiders with administrative access creating users for legitimate operational purposes. Logs from the FortiGate must be correctly configured to ensure audit logging is enabled for user management changes. Furthermore, user creation could coincide with legitimate activities such as onboarding new staff or service account creation. Companion detections for user abuse, such as failed login attempts or unusual access patterns, should be analyzed to strengthen coverage against misuse.

