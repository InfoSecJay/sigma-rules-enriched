title: FortiGate - New Local User Created
id: ddbbe845-1d74-43a8-8231-2156d180234d
status: experimental
description: |
  Detects the creation of a new local user on a Fortinet FortiGate Firewall.
  The new local user could be used for VPN connections.
references:
- https://www.fortiguard.com/psirt/FG-IR-24-535
- https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/398/event
- https://docs.fortinet.com/document/fortigate/7.6.4/cli-reference/109120963/config-user-local
- https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/44547/44547-logid-event-config-objattr
author: Marco Pedrinazzi @pedrinazziM (InTheCyber)
date: 2025-11-01
tags:
- attack.persistence
- attack.t1136.001
logsource:
  product: fortigate
  service: event
detection:
  selection:
    action: 'Add'
    cfgpath: 'user.local'
  condition: selection
falsepositives:
- A local user can be created for legitimate purposes. Investigate the user 
  details to determine if it is authorized.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a new local user on a Fortinet FortiGate Firewall, indicating potential unauthorized access setup, particularly for VPN connections. The likely attacker objective is to establish persistence within the network, provide remote access, or escalate privileges. This behavior is aligned with the MITRE ATT&CK framework under the tactic "Persistence" (TA0003) and technique "Valid Accounts" (T1136.001).

  Primary telemetry sources include FortiGate event logs, which provide relevant log types like `event` logs that capture configurations associated with local user changes. If malicious, the creation of an unauthorized user can introduce significant security risks by enabling a backdoor for future access. This detection does not confirm that the user is malicious on its own; further investigation is required to validate the intent behind the user creation.

  ### Investigation Steps

  - **Review user creation details**: Check FortiGate event logs (Log ID 44547) for the new user creation event, particularly the `username`, `source IP`, and `admin` status. Verify if the username follows a naming convention aligned with legitimate users.

  - **Confirm the authorization of the user**: Cross-check with the user account documentation or with authorized personnel to see if the account was created as part of standard operations. Look for user roles and any associated access levels in configurations (`cfgpath: user.local`).

  - **Inspect associated VPN configurations**: Review VPN logs (Log ID 100002) to determine if the new user was granted VPN access. Any immediate connection attempts from the new account may indicate malicious intent.

  - **Analyze source IP activity**: Investigate the source IP address from which the user was created. Validate against known trusted IPs within the organization. Any external IP addresses may raise red flags.

  - **Look for patterns in similar events**: Analyze logs for multiple local user creations that occurred in a short time frame as this might indicate automated scripting or bulk creation, which is atypical for authentic configuration changes.

  - **Identify recent privileged or admin changes**: Check for any recent privileged access changes (Event ID 139' in FortiOS). This will help determine if the user creation correlates with privilege escalation events, suggesting a potential security breach.

  ### Prioritization

  The alert is of medium severity due to its potential impact on network security. A newly created local user can enable unauthorized access and should be treated seriously, especially if the action is not consistent with organizational procedures. The likelihood of misuse is moderate, particularly if the user was granted VPN access, a common vector for initial intrusion.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations not logging all relevant events, particularly if the FortiGate’s logging level is not set appropriately. Legitimate user creation for new employees or role changes may trigger this alert, indicating the need for contextual verification. A related detection includes monitoring failed logins (Event ID 100001), which can provide insight into potential misuse by the new account as attackers may attempt to access resources after creating a new user.

