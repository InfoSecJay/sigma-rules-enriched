note: |
  ### Technical Context
  This detection rule identifies modifications to VPN SSL settings on FortiGate devices, focusing particularly on changes to authentication rules. Such activity may indicate an attempt by an attacker to establish unauthorized access points or create VPN tunnels for malicious purposes. By adding a VPN SSL Web Portal, an attacker might facilitate remote access to internal systems, thereby increasing their foothold within the target network.

  The primary tactics associated with this detection are **Persistence (TA0003)** and **Initial Access (TA0001)**. The relevant technique is **External Remote Services (T1133)**, which can enable attackers to gain entry into a network through compromised SSL VPN configurations. The monitored data sources for this detection include FortiGate event logs that record configuration changes, providing critical insight into the adjustments being made to VPN settings.

  ### Investigation Steps
  - **Review Event Logs:** Check FortiGate event logs for records of VPN SSL settings changes, specifically focusing on timestamps, user accounts involved, and the actions performed.
  - **Assess User Access Levels:** Analyze the accounts that modified the settings to determine if they have authorization for such changes and verify if any accounts are behaving unusually.
  - **Examine Configurations:** Investigate any newly created VPN SSL Web Portals to ensure they conform to organizational policies and aren’t configured with overly permissive access settings.
  - **Monitor Subsequent Traffic:** Track any VPN traffic following the modifications, looking for unusual access patterns or connections to unauthorized internal resources.

  ### Prioritization
  Alerts for modifications to VPN SSL settings carry a medium severity level due to the potential for significant impact. If exploited, an attacker could gain remote access to sensitive networks, greatly increasing their ability to navigate and compromise additional systems.

  ### Blind Spots and Assumptions
  This detection logic may not capture all malicious activity as legitimate changes might occur regularly for operational purposes, leading to false positives. Additionally, the detection assumes that logging for configuration changes is enabled on the FortiGate devices. If these logs are not retained or are misconfigured, the detection will fail to function effectively, leaving potential threats undetected. Furthermore, the scope of detection is limited to FortiGate devices, so alterations performed through other systems or manually may go unnoticed.

