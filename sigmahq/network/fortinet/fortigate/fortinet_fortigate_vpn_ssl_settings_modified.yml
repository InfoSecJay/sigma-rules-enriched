note: |
  ### Technical Context

  This Sigma rule detects modifications made to VPN SSL settings on FortiGate devices. Specifically, it identifies changes to configuration paths related to SSL VPNs, such as adjustments to authentication rules. The likely attacker objective is to gain unauthorized remote access to the network or manipulate VPN settings for evasion or lateral movement within the enterprise environment. This behavior aligns with the MITRE ATT&CK techniques of Persistence (T1133) and Initial Access.

  The primary telemetry source for this detection is event logs from FortiGate devices, specifically those that capture configuration changes. The security impact can be significant if the changes allow unauthorized access, potentially exposing sensitive data or infrastructure to malicious actors. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative changes can also trigger this alert.

  ### Investigation Steps

  - **Review FortiGate event logs:** Check Event Logs in the FortiGate console (Log Type: Event) for log IDs indicating modifications to VPN settings (Log ID 44546). Look for the user who made the change and the timestamp to determine if it aligns with expected maintenance windows or behaviors.

  - **Identify user roles and permissions:** Analyze the initiating user's role to confirm whether they have legitimate permission to edit SSL VPN settings. Cross-reference user accounts with change history for configuration settings (Fields: usr, cfgpath).

  - **Check for recent VPN portal additions:** Look for logs indicating the addition of new SSL VPN web portals, which often coincide with modifications to SSL settings. Note relevant timestamps in relation to the configuration changes to connect events.

  - **Establish baseline changes:** Review historical configurations to identify if any recent changes to VPN SSL settings are outside of normal patterns. Detect any modifications that deviate from established authorization policies.

  - **Correlate with user activity:** Assess user login logs for the same timeframe (Event ID 4624). Identify if there are connections from unusual locations or multiple failed attempts to connect to the VPN, suggesting a potential brute force or enumeration attack leading to administrative access.

  ### Prioritization

  The severity of this alert is medium given that changes to VPN SSL settings can significantly affect security posture by enabling remote access. The likelihood of malicious abuse is moderate, particularly in cases of compromised credentials. However, administrative changes for legitimate purposes are common and can trigger the alert, necessitating careful context evaluation.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations or insufficient logging settings on FortiGate devices, allowing malicious behavior to go unnoticed if logs are not captured correctly. Legitimate maintenance activities, such as routine updates, could trigger the alert, leading to potential false positives. A companion detection method would involve monitoring network access logs post-configuration changes to identify any unauthorized access attempts.

