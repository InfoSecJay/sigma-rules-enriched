note: |
  ### Technical Context

  This rule detects modifications to VPN SSL settings on FortiGate devices, indicating potential unauthorized configuration changes. Attackers may aim to create vulnerabilities in remote access configurations, allowing for unauthorized access or data exfiltration. This behavior aligns with the MITRE ATT&CK tactic **Initial Access** (TA0001) and technique **External Remote Services** (T1133).

  The primary telemetry sources are FortiGate event logs, specifically those related to VPN configurations—logged under specific categories when settings are changed. If such modifications are initiated maliciously, they can lead to significant security risks, allowing attackers to bypass security controls and gain access to sensitive systems. However, this detection alone does not confirm intent or the success of malicious activity.

  ### Investigation Steps

  - **Review modified settings details:** Examine FortiGate event logs for Event ID 44546 that document the specifics of the SSL VPN changes (fields: `action`, `cfgpath`). Identify if changes align with expected administrative behavior.

  - **Check for associated user activity:** Correlate the timestamp of the configuration change with user activity logs for any suspicious access patterns (e.g., Event ID 4688 for related logins on the VPN).

  - **Validate against administrative procedures:** Compare the modification against standard operating procedures or change management records. Legitimate activities often follow documented protocols and have corresponding administrative requests.

  - **Identify high-confidence malicious indicators:** Look for unrecognized user accounts making changes or changes being made outside of business hours. Such anomalies could indicate malicious behavior.

  - **Examine network impact:** Assess any new VPN access routes or web portals created alongside the changes for potential exploitation (refer to FortiGate log IDs linked to portal changes).

  - **Evaluate critical infrastructure exposure:** Determine if these settings impact sensitive systems or data repositories, assessing the overall risk posed by any unauthorized changes.

  ### Prioritization

  The alert severity is medium due to the criticality of VPN configurations in enterprise environments. Unauthorized changes could lead to significant data breaches or system compromises, particularly if leveraged by threat actors. Moreover, the modification of these settings is a known tactic in various attack vectors, heightening the risk.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for legitimate administrative changes, such as routine configuration updates, which could generate false positives. Ensure that logging for all administrative actions is fully enabled on the FortiGate devices for reliable detection. Additionally, consider that other legitimate applications or system updates could trigger similar alerts, thus requiring careful analysis. A companion detection to monitor might involve unusual VPN connection logs or unusual data transfer volumes during or after configuration changes.

