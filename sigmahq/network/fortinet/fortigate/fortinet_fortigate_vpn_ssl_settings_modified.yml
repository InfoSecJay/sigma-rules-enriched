  ---

  ### Technical Context

  The Sigma rule detects modifications to VPN SSL settings on FortiGate devices, specifically actions that involve changes to authentication rules or SSL configurations. This behavior is often linked to an attacker’s objective of establishing a foothold within a network by manipulating VPN settings to facilitate unauthorized remote access. The relevant MITRE ATT&CK tactic is *Persistence* (TA0003), and the technique is *External Remote Services* (T1133).

  Primary telemetry sources include FortiGate event logs, particularly focusing on Event ID related to configuration changes within VPN settings. Malicious changes to these configurations could allow an adversary to create malicious VPN portals for credential harvesting or lateral movement. It is important to note that this detection alone does not confirm malicious intent; legitimate administrative changes to VPN settings could also trigger this alert.

  ---

  ### Investigation Steps

  - **Review Event Logs for Changes:** Examine FortiGate event logs (Event ID 44546) for entries related to 'Edit' actions on the `vpn.ssl.settings` configuration. Look for fields indicating the source IP and user making the change. Legitimate changes typically originate from internal, trusted administrative users.

  - **Identify Anomalous User Behavior:** Analyze the user account associated with the configuration change. Verify if the user normally performs such modifications. Unexpected behavior or changes from atypical accounts could indicate malicious activity.

  - **Check for Related SSL Web Portal Configurations:** Investigate if there have been any concurrent configuration changes regarding new VPN SSL Web Portals. Look for specific logs indicating new portal setups around the same timestamp as the detected change (Event ID 44546).

  - **Correlate with VPN User Activity:** Cross-reference the timing of the settings modification with VPN user activity logs. Look for a sudden spike in VPN connections, particularly those coming from external IP addresses or unusual geographic locations that could indicate the use of a malicious portal.

  - **Assess Impact on Critical Systems:** Determine the role of the affected FortiGate device within the network. If it's connected to critical infrastructure or data resources, prioritize the alert for immediate investigation.

  - **Verify Configuration Backup Integrity:** Check for configuration backups made prior to the modification to ensure that no unauthorized changes have been made without detection.

  ---

  ### Prioritization

  This alert should be treated with medium severity. The system impact is significant if exploited, as it could allow unauthorized access to the internal network through misconfigured VPN settings. The likelihood of this behavior being weaponized is moderate, particularly in targeted attacks against organizations where VPN access is essential.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative updates to trigger this alert. Changes may also go unlogged if logging is not correctly configured on FortiGate devices. Additionally, legitimate users may inadvertently cause false positives by making routine updates. A companion detection to consider is monitoring failed VPN connection attempts, which may indicate attempted exploitation of a misconfigured SSL VPN.

