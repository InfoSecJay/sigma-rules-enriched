level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to user groups on a FortiGate firewall, which can indicate potential changes to VPN access control. The attacker objective could include privilege escalation or gaining unauthorized access to network resources by modifying group memberships that control access. This behavior aligns with the MITRE ATT&CK tactics for Persistence (T1543) and Privilege Escalation (T1068). The primary telemetry source is FortiGate event logs, specifically those logging user group modifications, categorized under configuration events.

  If malicious, such changes can compromise the security of the network by allowing unauthorized users to access sensitive resources. However, this detection alone does not confirm malicious activity, as changes to user groups can also occur for legitimate administrative purposes.

  ### Investigation Steps

  - **Verify user group modification details:** Review FortiGate event logs for Event ID correlating to user group modification (e.g., Log ID 44547). Check for actions in the 'Action' field marked as 'Edit' under 'cfgpath' related to 'user.group'.

  - **Identify the user responsible for the change:** Analyze the logs to determine which user account made the modification, noting any unusual accounts with high privileges or unexpected admin actions.

  - **Assess the impact of the user group changes:** Investigate the group members before and after the modification. Expect legitimate modifications to only adjust group members, while malicious changes may add unauthorized accounts.

  - **Enrich context with authentication logs:** Cross-reference firewall logs with user authentication logs (Event ID 4624 from Windows Security logs) to establish if the modifying user account has recently logged into the firewall interface.

  - **Examine other associated logs for suspicious behavior:** Check for concurrent high-risk events, such as VPN connections from geographic locations inconsistent with normal usage, using FortiGate’s VPN logs.

  - **Document any high-confidence indicators of compromise:** Identify and document when unauthorized accounts were added to critical user groups, as this represents a clear malicious indicator.

  ### Prioritization

  This alert is of medium severity within an enterprise context since it affects access controls on a critical security device. The likelihood of malicious abuse is moderate, as user group modifications can allow attackers to establish persistent access. Although changes to user groups can occur for legitimate reasons, any unexpected modifications warrant a thorough investigation.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion if an attacker has legitimate credentials or administrative access to make changes without raising alarms. Reliable detection relies on consistent logging settings on FortiGate devices, specifically for configuration change events. Legitimate activities, such as routine administrative changes for new hires or role adjustments, may trigger this alert. A companion detection could include monitoring VPN connection logs for new or unexpected user associations with these groups, enhancing visibility into potential abuse.

