title: FortiGate - User Group Modified
id: 69ffc84e-8b1a-4024-8351-e018f66b8275
status: experimental
description: |
  Detects the modification of a user group on a Fortinet FortiGate Firewall.
  The group could be used to grant VPN access to a network.
references:
- https://www.fortiguard.com/psirt/FG-IR-24-535
- https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/398/event
- https://docs.fortinet.com/document/fortigate/7.6.4/cli-reference/328136827/config-user-group
- https://docs.fortinet.com/document/fortigate/7.6.4/fortios-log-message-reference/44547/44547-logid-event-config-objattr
author: Marco Pedrinazzi @pedrinazziM (InTheCyber)
date: 2025-11-01
tags:
- attack.persistence
- attack.privilege-escalation
    # - attack.t1098.007
logsource:
  product: fortigate
  service: event
detection:
  selection:
    action: 'Edit'
    cfgpath: 'user.group'
  condition: selection
falsepositives:
- A group can be modified for legitimate purposes.
level: medium
note: |
  ### Technical Context
  This detection rule identifies when a user group on a Fortinet FortiGate Firewall has been modified. Modifications to user groups can significantly impact access controls, potentially allowing unauthorized users to gain VPN access to sensitive network resources. Attackers may target this configuration to expand their foothold within the environment or to implement lateral movement strategies, contributing to longer-term persistence and privilege escalation tactics.

  In the context of the MITRE ATT&CK framework, this activity aligns with the tactics of **Persistence** and **Privilege Escalation**. Relevant techniques include **Access Token Manipulation (T1134)** and **Group Policy Modification (T1484)**. Successful exploitation can lead to significant security incidents, particularly if an adversary is attempting to coordinate unauthorized access to critical systems or data.

  Telemetry from **FortiGate event logs** will provide the best insights, particularly logs capturing configuration changes related to user groups. Additional context can be gathered from identity and access management logs, which may show user login patterns and correlate these changes with anomalous activity.

  ### Investigation Steps
  - **Review Event Logs:** Check recent FortiGate event logs for modifications to user groups, focusing on the action timestamp and the user account that performed the modification.
  - **Analyze User Activity:** Investigate the login history of the user who made the change to determine if their account was compromised or if there's unusual activity leading to the alteration.
  - **Examine VPN Access Logs:** Look into VPN access logs to identify any anomalies, such as unauthorized user connections following the user group modification.
  - **Correlate with Other Security Events:** Cross-reference changes with alerts from other security monitoring tools (like SIEM or EDR) to identify related malicious activities or patterns that may indicate a broader compromise.

  ### Prioritization
  This alert has a medium severity level because unauthorized modifications to security configurations can lead to significant vulnerabilities and breaches. Given the possible impact on access controls, quick analysis is necessary to prevent potential exploitation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative changes made by authorized personnel, which could generate false positives. This detection logic assumes that all modifications to user groups are indicative of malicious activity without considering the context of administrative workflows. The rule relies solely on logs from the FortiGate Firewall; therefore, proper logging and monitoring configurations must be in place to capture user group modifications effectively.

