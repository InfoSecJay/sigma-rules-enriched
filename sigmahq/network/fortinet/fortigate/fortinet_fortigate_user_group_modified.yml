note: |
  ### Technical Context

  This detection rule identifies the modification of user groups on a Fortinet FortiGate Firewall, which may indicate an unauthorized change that could impact user access, including to VPN services. The likely attacker objective is to manipulate group memberships to elevate privileges or facilitate unauthorized remote access to network resources. This behavior aligns with the MITRE ATT&CK tactic for Persistence and the technique for Privilege Escalation (T1068).

  The primary telemetry source is FortiGate's event logs, specifically focusing on events related to user group configuration changes. If malicious in nature, this could lead to significant security vulnerabilities, impacting both data protection and network accessibility. Importantly, this detection does not confirm malicious intent on its own, as legitimate modifications may occur for administrative purposes.

  ### Investigation Steps

  - **Verify the event details:** Check FortiGate event logs (Log ID 44547) for details of the modification, noting the timestamp, user initiating the change, and the specific group affected.

  - **Identify the modifying user:** Look for the user account associated with the modification within the event logs. Administrative-like accounts could be expected, while unfamiliar accounts warrant further scrutiny.

  - **Review group membership changes:** Assess the specific alterations made to the user group, cross-referencing with normal operational procedures for user management to determine if the changes align with expected behavior.

  - **Look for previous activity:** Investigate preceding log entries for suspicious activity (Log ID 398), specifically around user login attempts or other configuration changes made by the same user, which may indicate a broader attack.

  - **Check for legitimate group modification trends:** Differentiate routine administrative updates such as new user additions or changes to access rights from potentially malicious or unusual changes inconsistent with organization policy.

  - **Analyze related configurations:** Review VPN access policies tied to modified user groups to identify potential exposure points and evaluate the risk of data exfiltration or unauthorized access.

  ### Prioritization

  This alert holds medium severity due to its implications on user access controls and the potential for privilege escalation through unauthorized modifications. The likelihood of malicious abuse is moderate, given that improper user group modifications can lead to significant risks in network security. Although not the most commonly weaponized tactic, it remains critical for maintaining firewall integrity and security posture.

  ### Blind Spots and Assumptions

  The detection may miss events where access is quickly reverted or where the attacker covers their tracks by removing logs. Reliable detection depends on having proper logging enabled across all necessary configurations, particularly for user and group management on FortiGate devices. Legitimate administrative actions, such as scheduled user group reviews or updates, may trigger this alert. A companion detection such as monitoring for unauthorized changes in firewall policies can enhance overall coverage and threat detection.

