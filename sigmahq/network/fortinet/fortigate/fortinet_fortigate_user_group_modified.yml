  ---

  ### Technical Context

  This rule detects modifications to user groups on FortiGate firewalls, which can potentially grant or revoke VPN access to sensitive network resources. The likely attacker objective is to establish persistence, escalate privileges, or gain unauthorized access through modified user permissions. This behavior aligns with the MITRE ATT&CK tactics of persistence (TA0003) and privilege escalation (TA0004). The primary telemetry source for this detection is FortiGate event logs, specifically those generated via event logging for configuration changes.

  If the modification is malicious, it may lead to unauthorized access to critical infrastructure or sensitive data. However, this detection does NOT confirm malicious intent solely based on the logged activity, as user group modifications may also stem from legitimate administrative actions.

  ---

  ### Investigation Steps

  - **Check configuration change details: ** Access the FortiGate event logs for Event ID related to user group modification (Log ID: 44547). Investigate `username`, `groupname`, and `action` fields for unexpected changes.

  - **Identify legitimate modifications: ** Review recent changes in the `cfgpath: 'user.group'` to assess whether the modifications were performed by authorized personnel during regular maintenance. Look for corresponding timestamps aligned with administrative shifts.

  - **Scrutinize user group memberships: ** Investigate the user group configurations (CLI Command: `show user group`) to identify any users assigned to sensitive roles, and analyze recent members to check for any anomalies.

  - **Assess user activity logs: ** Review VPN connection attempts and user logins (Log ID: 20002) correlated with the action to identify any unauthorized access or unusual patterns following the modification.

  - **Review device and network integrity: ** Run a thorough check on device access controls, including other user account modifications within the same timeframe, to ensure that no additional privileges have been escalated that could indicate wider attack vectors.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact if user permissions are modified to allow unauthorized VPN access. The likelihood of malicious abuse is moderate since modifications to user groups are often a key step in establishing persistence and lateral movement in a network. This tactic is known to be weaponized by attackers targeting network devices to undermine security postures.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative actions may trigger this alert, resulting in potential false positives. Reliance on secure and comprehensive event log configurations is essential for effective detection; failure to log such changes could lead to missed alerts. Common legitimate activities that may trigger this alert include routine role adjustments tied to employee onboarding or offboarding processes. A related detection is tracking changes to user permissions in other systems, such as Identity and Access Management solutions, which can help provide context and confirmation of whether changes were part of a coordinated effort or isolated incidents.

