  ---

  ### Technical Context

  This Sigma rule detects the addition of a new VPN SSL Web Portal on a Fortinet FortiGate Firewall, indicative of potential changes to access controls or new entry points into the network. A likely attacker objective would be to establish a more accessible or covert channel for remote access, which can facilitate persistence or initial access. This behavior corresponds to the MITRE ATT&CK tactic of "Persistence" (TA0003) and the technique "External Remote Services" (T1133).

  Primary telemetry sources include FortiGate event logs, with specific focus on logs detailing configuration changes (Log ID 44547). If malicious, this behavior can lead to unauthorized remote access, which could compromise sensitive systems or data. Importantly, this detection alone does NOT confirm malicious intent, as legitimate administrative changes may also trigger this alert.

  ---

  ### Investigation Steps

  - **Verify configuration change details:** Review FortiGate event logs (Log ID 44547) for timestamp, user IDs, and specific configuration settings associated with the newly added VPN SSL Web Portal. Note any unusual usernames or timings that deviate from normal operational hours.

  - **Identify historical pattern:** Investigate previous configurations by querying FortiGate settings (CLI command: `show vpn ssl webportal`) to determine if previous portals exist and if these changes align with typical administrative behavior. Legitimate patterns may indicate regular maintenance, such as upgrades or user demand.

  - **Assess user access to changes:** Check user permissions associated with the event to determine if the user making the change has administrative rights. Cross-reference this with the user roles documented in the system to validate appropriateness.

  - **Look for correlating alerts:** Examine related security alerts around the same time frame or preceding configurations, specifically looking for abnormal network traffic associated with the new portal. This may include unusual login attempts or access requests (FortiGate Log Types: traffic, event).

  - **Monitor for subsequent access:** Set up a monitoring protocol for connections to the new web portal from external IPs, especially examining connection attempts on uncommon ports or regions. Any elevated access attempts should be logged and reviewed for patterns indicating reconnaissance or exploitation.

  - **Document any anomalies:** Any discrepancies in user behavior or configuration changes should be cataloged for further investigation or escalation. This could include irregular times of access, failed login attempts, or changes to authentication settings.

  ---

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on network security through unauthorized remote access configurations. The likelihood of malicious abuse is present, particularly if the addition of the VPN portal is not attributed to a known and trusted administrative change. This behavior can be a common tactic among threat actors attempting to infiltrate enterprise networks.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques may include altering configuration logs or utilizing compromised user accounts to mask the true intent of the change. Reliable detection necessitates that FortiGate logs are correctly configured and monitored; otherwise, critical events may be missed. Legitimate administrative actions such as expansions for business needs may also inadvertently trigger the alert. Companion detections around suspicious login patterns or lateral movement (e.g., using successful VPN logins combined with network traffic anomalies) can strengthen overall coverage.

