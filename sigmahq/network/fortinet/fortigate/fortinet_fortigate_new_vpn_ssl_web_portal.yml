level: medium
note: |
  ### Technical Context

  This rule detects the addition of a new VPN SSL Web Portal on a Fortinet FortiGate Firewall, which may indicate an attempt to establish unauthorized remote access to the network. The likely attacker objective is to facilitate the external connection of malicious actors to the internal network. This technique falls under MITRE ATT&CK's Initial Access tactic (TA0001) and Persistence technique (T1133). The primary telemetry source is FortiGate firewall event logs which capture system changes, particularly those related to configuration modifications. If malicious, the addition of a VPN SSL portal may compromise network security and allow unmonitored access to sensitive assets. Importantly, this detection does not confirm malicious intent on its own, as legitimate activities can also trigger this alert.

  ### Investigation Steps

  - **Review log details for the action:** Check the FortiGate event logs for Event ID relevant to the addition of a VPN SSL Web Portal (log ID 44547). Look for timestamps, admin account associated with the change, and configuration details to determine if the action was initiated by an authorized user.

  - **Identify previous portal configurations:** Investigate the change history for the VPN SSL Web Portal settings by reviewing the configuration logs (event log ID 398). Compare against expected configurations to see if the addition aligns with prior settings or organizational policies.

  - **Evaluate admin credentials used:** Verify whether the admin account responsible for the portal addition has a history of modification changes. Look for Event ID 4634 (logon) and Event ID 4624 (logon success) in the Windows Security logs to ensure appropriate user supervision.

  - **Flag unusual access patterns:** Analyze connections to the new VPN SSL Web Portal through network logs (FortiGate traffic logs). Look for lateral movement patterns or unusual geographic access locations that may indicate exploitation.

  - **Identify legitimate configurations:** Review how existing VPN SSL Web Portals are configured to establish a baseline. Confirm authorized uses for added portals against expected business needs.

  - **Search for related Security Alerts:** Conduct a review of alerts related to unusual configuration changes or unauthorized access attempts logged during the same period; this can include alerts for failed login attempts (Event ID 4625) or configuration change alerts.

  ### Prioritization

  The alert should be treated as medium severity due to the potential for impacting high-value assets if remote access is granted maliciously. The configuration change is a recognized method for unauthorized access, making its likelihood of malicious use moderate, especially if supported by additional suspicious behaviors.

  ### Blind Spots and Assumptions

  This detection may be limited by the configuration of logging on FortiGate devices; without proper event logging settings, key activities may be missed. Legitimate administrative activities, like routine updates or changes for business needs, could trigger this alert. A related detection includes monitoring for modifications to user permissions in conjunction with VPN changes, which enhances security oversight.

