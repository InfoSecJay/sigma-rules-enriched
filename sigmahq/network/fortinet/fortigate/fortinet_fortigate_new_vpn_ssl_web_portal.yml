note: |
  ### Technical Context
  This detection rule identifies the addition of a VPN SSL Web Portal on Fortinet FortiGate Firewalls. This behavior can signify an initial access vector or persistence mechanism being established by an attacker, particularly if it is accompanied by changes to VPN settings that might weaken security controls. The threat actor's goal may include enabling unauthorized remote access, facilitating lateral movement within the network, or exfiltrating sensitive data.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**: The addition of VPN services can serve as a means for attackers to gain foothold in an environment.
  - **Persistence (TA0003)**: By adding a persistent remote access mechanism such as a new VPN portal, attackers can maintain access even after initial breaches are remediated.
  - **Exploitation of Remote Services (T1133)**: This technique corresponds to the potential exploitation of the VPN service.

  Primary data sources include:
  - Fortigate Event Logs documenting configuration changes for VPN settings and web portal additions.
  - System and configuration logs that capture any related firewall activity.

  ### Investigation Steps
  - **Review Event Logs**: Examine FortiGate event logs for entries related to the addition of the VPN SSL Web Portal and any concurrent changes to existing VPN configurations for anomalies.
  - **Analyze User Access Patterns**: Investigate the user accounts associated with the new VPN portal. Look for unexpected account usage, new users, or accounts with elevated privileges.
  - **Check for Related Indicators**: Look for related suspicious activity such as unusual connection attempts or failed login attempts in connection with the new VPN portal in your log data.
  - **Correlate with Network Traffic**: Monitor network traffic logs to assess if there are any indicators of malicious activity directed at or through the newly created VPN portal.

  ### Prioritization
  The severity of this alert is medium due to the potential for significant unauthorized access to sensitive systems via the VPN SSL Web Portal. While the addition might be legitimate, in an enterprise environment, maintaining vigilance over such changes is crucial to mitigate risks associated with unauthorized access.

  ### Blind Spots and Assumptions
  One key blind spot is that legitimate administrators may add VPN SSL Web Portals without malicious intent, which could result in false positives for this alert. The detection logic assumes that any addition of a web portal is potentially suspicious; however, there may be legitimate business purposes behind such configurations. For this rule to function effectively, comprehensive logging of FortiGate configuration changes must be enabled, and timely response to any alerts is essential to mitigate potential risks.

