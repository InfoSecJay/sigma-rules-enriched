note: |
  ### Technical Context

  This Sigma rule detects the addition of new VPN SSL Web Portals on a Fortinet FortiGate Firewall, a behavior potentially indicative of adversarial activity aiming to establish persistence or facilitate initial access (MITRE ATT&CK Techniques: T1133). An attacker may exploit a newly created portal to redirect users to malicious resources or to access the internal network undetected. Primary telemetry sources include FortiGate event logs specifically focusing on VPN configurations and settings. If malicious, this behavior could allow unauthorized access to internal systems and data. It’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can also produce these logs.

  ### Investigation Steps

  - **Check VPN Portal Configuration:** Review Fortigate event logs (Log ID 44547) for details on the newly added VPN SSL Web Portal. Specifically, look for records showing the `action: 'Add'` within the VPN configuration path. If the portal was added without proper change management or notification, it may indicate malicious activity.

  - **Evaluate User Accounts Associated with Changes:** Use FortiGate event logs to identify the user account responsible for the addition (e.g., log fields like `src` indicating source IP/user). Verify that this account has the necessary administrative privileges related to VPN configurations and check for any unusual access patterns.

  - **Examine Recent Security Audits:** Check recent access logs and changes related to the VPN SSL configurations. Look for inconsistencies such as administrative changes being made outside of regular maintenance windows or observed behavior that deviates from established operational norms.

  - **Identify Legitimate Usage Patterns:** Determine if there are documented business needs for adding new VPN SSL Web Portals by consulting change management records or team communications. Compare these with previous configurations to see if the new portal aligns with business objectives.

  - **Monitor Network Traffic Through the New Portal:** Analyze traffic logs directed through the newly created VPN portal to detect any unusual patterns or connections to known malicious IP addresses. Use tools such as IDS to flag any suspicious outbound traffic.

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on network security by allowing unauthorized internal access. The likelihood of this behavior being malicious is moderate, especially if no legitimate business justification exists for the addition. Attackers frequently exploit VPN configurations, making this a valuable alert to investigate.

  ### Blind Spots and Assumptions

  Limitations in detection include possible evasion through configuration changes executed under legitimate credentials, leading to false positives. It requires comprehensive logging configurations for FortiGate to capture detailed audit events. Additionally, common administrative tasks, such as routine updates or changes for business functionalities, may trigger this alert. Companion detections, such as unusual behavior in the source account that made the change (e.g., rapid successive logins or other configuration changes from a non-standard location), would strengthen incident response efforts.

