note: |
  ### Technical Context

  This rule detects the addition of firewall address objects in a Fortinet FortiGate Firewall. An attacker may aim to create a new address object to manipulate traffic flows or establish unauthorized access paths. This behavior falls under the MITRE ATT&CK tactics of Defense Evasion (T1562) as it could facilitate attempts to bypass security controls. Primary telemetry sources include Fortigate event logs detailing configuration changes, particularly focusing on log types that capture actions related to firewall settings. A malicious addition of an address object could allow unauthorized external access to sensitive internal resources, posing a significant security threat. However, this detection alone does not confirm malicious intent; legitimate administrative tasks may also trigger similar alerts.

  ### Investigation Steps

  - **Review FortiGate event logs:** Check Event ID 44547 for logs of configuration changes, specifically focusing on the "Add" action and the "cfgpath" field containing "firewall.address."

  - **Identify changes to address objects:** Determine the specifics of the newly added address object—look for the "name" and "subnet" fields to ascertain if they closely match known malicious IP ranges or network addresses.

  - **Examine administrative user accounts:** Validate the user who performed the action against the "user" field in the logs. If the change was made by a non-administrative account or an account exhibiting anomalous behavior, this may indicate malicious activity.

  - **Check for legitimate operations:** Identify recent changes or operations within typical maintenance windows from known administrative personnel. If the addition coincides with scheduled updates or maintenance, it may indicate benign activity.

  - **Correlate actions with historical logs:** Look for prior modifications to firewall configurations or unusual patterns in address management from Event IDs around the time of the incident.

  ### Prioritization

  This alert has medium severity as it pertains to potentially critical assets like firewalls. The likelihood of malicious abuse is moderate; adding address objects is a common precursor to establishing unauthorized communication channels. However, legitimate administrative actions can frequently trigger this alert, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection may falter if logs are not configured to collect all relevant configuration changes from the FortiGate device. Benign administrative actions, such as legitimate updates or changes in response to security incidents, may falsely trigger this alert. A related detection to consider is monitoring for unusual outbound traffic to newly configured address objects, complementing internal surveillance of configuration changes.

