note: |
  ### Technical Context

  This Sigma rule detects the addition of firewall address objects on a FortiGate Firewall. An attacker might exploit this behavior to create or modify access controls to allow unauthorized network traffic, effectively bypassing security measures. This action aligns with the MITRE ATT&CK tactic 'Defense Evasion' (T1203), particularly the technique 'Modify Authentication Practices' (T1686.002).

  The primary telemetry source required for this detection is Fortigate Event Logs, specifically focusing on log entries that indicate changes to firewall configurations. If this action is malicious, it could lead to significant security impacts, such as unauthorized data access or exfiltration. However, this detection does not confirm intent or outcome, as legitimate changes made by administrators could trigger the same alert.

  ### Investigation Steps

  - **Review Fortigate Event Logs**: Check for Event ID related to address object changes (e.g., Log ID 44547) in Fortigate logs. Assess the timing relative to known network events or incidents.

  - **Validate User Context**: Identify the user account that triggered the change. Confirm if the account has a history of making configuration changes and whether they align with their role and responsibilities.

  - **Examine Configuration History**: Retrieve previous configurations to compare the new address object against established firewall rules. Documentation of planned changes should justify any deviations.

  - **Look for abnormal behavior**: Identify whether multiple address objects were added in a short time frame. Unusual spikes could indicate malicious activity, especially if they involve external IPs or previously unused internal ranges.

  - **Assess Benign Changes**: Confirm if the addition was part of a planned maintenance window or scheduled upgrade by cross-referencing with internal change logs or schedules.

  - **Check for Related Alerts**: Review for concurrent alerts that indicate potential privilege escalation or unauthorized access attempts that coincide with the address object addition.

  ### Prioritization

  This alert should be treated as medium severity in an enterprise context. The potential for malicious abuse exists, especially if the affected system handles critical network operations. However, since legitimate administrative activity can trigger similar alerts, further investigation is essential before escalating the response.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by misconfigurations or lack of detailed logging of administrative actions on Fortigate devices. Legitimate administrative changes, such as routine updates or network expansion, may frequently trigger this alert. A related detection, such as changes to firewall policies or unexpected inbound/outbound traffic, can enhance monitoring efforts and provide a more comprehensive threat landscape.

