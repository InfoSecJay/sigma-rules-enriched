note: |
  ### Technical Context

  This Sigma rule detects the addition of firewall address objects on Fortinet FortiGate devices. Attackers may add or modify address objects to facilitate unauthorized access or to hide malicious traffic. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion (TA0005)**, specifically the technique **Indicator Removal on Host (T1562)**. The primary telemetry source is Fortigate event logs, specifically logs associated with configuration changes in the firewall. If malicious, this action can significantly impact network security by allowing adversaries to manipulate traffic flow. It is vital to note that the detection of this event does NOT confirm malicious intent on its own, as legitimate changes may occur during routine maintenance or configuration adjustments.

  ### Investigation Steps

  - **Review Fortigate event logs for config changes:** Check Event ID 44547 in the FortiGate event logs for the specific action of adding an address object. Look at the `action`, `source`, and `destination` fields for any suspicious or unauthorized IP addresses.

  - **Identify legitimate administrative behaviors:** Investigate if any recent changes from administrators align with expected maintenance procedures. Look for periodic scheduled tasks or known administrative users modifying address objects.

  - **Check for repeat additions:** Analyze the logs for multiple additions over a short timeframe (e.g., under an hour). If many addresses are added, especially by non-administrative users, flag this as suspicious.

  - **Correlate with other device actions:** Review firewall logs for related actions, such as policy changes or rule modifications, within the same timeframe. Use Event ID 44546 (for policy changes) to see if changed policies apply to newly added address objects.

  - **Assess IP reputation:** For any identified address objects, use threat intelligence services to check if these IPs are known to be associated with malicious activity. A high ratio of added objects from malicious sources can indicate a high-confidence malicious indicator.

  - **Evaluate system criticality:** Determine the role of the affected Fortigate device within the network (e.g., edge firewall vs. internal segmentation). Higher criticality devices warrant immediate deeper investigation.

  ### Prioritization

  This alert carries medium severity due to the potential impact on network security, especially on critical infrastructure. The likelihood of malicious abuse exists given that adversaries often manipulate firewall configurations. This behavior, while not universally weaponized, can signify preparation for more serious attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging on FortiGate devices; ensure logging is enabled for configuration changes. Evasion techniques include the legitimate modification of address objects by authorized personnel or automated systems. Expected legitimate activities, such as pre-scheduled maintenance or legitimate network segmentation tasks, can trigger this alert. Companion detections, such as monitoring for unusual modifications to firewall policies or rules, can strengthen overall coverage.

