note: |
  ### Technical Context
  This rule detects instances where new firewall address objects are added to a Fortinet FortiGate firewall. The addition of address objects can signify legitimate configuration changes or may reflect malicious activity, such as an attacker establishing persistence or circumventing security policies. This behavior is vital to monitor as it directly affects the firewall's ability to regulate traffic and enforce security measures.

  Attackers might manipulate firewall configurations to create paths for unauthorized access, stealthy data exfiltration, or to disable protections against future attacks. Understanding how address objects are modified can help analysts detect suspicious configuration changes that may indicate compromised credentials or insider threats. Relevant MITRE ATT&CK techniques include **T1562** (Impair Application Control) as an attacker may add objects to bypass security protocols.

  The primary data source for this detection lies within the FortiGate event logs, specifically focused on logs generated for configuration changes related to firewall objects, which provide direct evidence of any modifications made.

  ### Investigation Steps
  - **Review Firewall Logs**: Examine the FortiGate event logs for entries related to the addition of address objects. Look for timestamp, user details, and action descriptions to identify potentially unauthorized changes.
  - **Check User Accounts**: Validate the authenticity of accounts used to make configuration changes. Ensure that only authorized personnel have access to modify firewall settings and consider checking for abnormal login patterns.
  - **Analyze Configuration Change History**: Assess the historical configuration changes on the FortiGate device to establish a baseline and identify any anomalies that deviate from normal modification patterns.
  - **Correlate with Other Security Logs**: Cross-reference with logs from other security tools (such as SIEM or EDR) to identify related events that could indicate a broader security incident or compromise.

  ### Prioritization
  The alert is assigned medium severity due to the growing risk posed by configuration changes on firewalls, which can significantly impact the security posture of the enterprise. The likelihood of malicious intent exists, especially if unauthorized users gain access to firewall settings.

  ### Blind Spots and Assumptions
  There may be gaps in detection when legitimate administrative changes occur, leading to potential false positives, as address objects can be added for valid purposes. The detection logic assumes that all changes should be documented and logically reviewed; however, if logging is improperly configured or not enabled for this specific action, the rule may not capture all pertinent data. Proper configuration of logging settings is essential for the effectiveness of this alert.

