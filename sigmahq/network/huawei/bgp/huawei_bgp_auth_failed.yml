note: |
  ### Technical Context

  This rule detects failed BGP authentication attempts, which may indicate an adversary attempting to brute force BGP credentials to manipulate routing tables. The likely attacker objective includes gaining unauthorized access to BGP sessions, potentially leading to traffic interception or misrouting as part of initial access or persistence tactics. This behavior is classified under the MITRE ATT&CK tactic of Credential Access (T1078) and Initial Access (T1557).

  The primary telemetry source for this detection is Huawei BGP logs, which must be enabled and ingested for effective monitoring. If successful, such attacks could significantly impact network integrity and availability. It is important to note that while this detection indicates an authentication failure, it does NOT confirm that an actual exploitation or successful access attempt occurred.

  ### Investigation Steps

  - **Review BGP log entries: **Check Huawei BGP logs for recent entries with 'BGP_AUTH_FAILED' and identify the IP addresses associated with failures for potential malicious actors.

  - **Compare against authorized IPs: **Cross-reference the failing IP addresses with the list of legitimate BGP peers in your network to identify any unauthorized or unexpected attempts.

  - **Examine timing of failures:** Look for patterns in the timing of authentication failures (e.g., frequency and intervals) to identify potential brute force attack behavior, which typically exhibits high rates of failure within a short time span.

  - **Identify legitimate BGP configuration:** Review BGP configurations for expected IP addresses that should be authenticating, confirming proper setup to rule out misconfigurations that could be benign.

  - **Check for associated network activity:** Investigate any traffic associated with the failing requests for unusual patterns, such as excessive SYN packets or other indications of scanning or reconnaissance activity from the failing IPs.

  ### Prioritization

  This alert should be considered moderate in severity due to its potential impact on network security. Failed BGP authentications can signify attempts to manipulate routing, which adversaries commonly target in network breaches. The likelihood of malicious intent is elevated given the context of the event.

  ### Blind Spots and Assumptions

  Detection can be limited by misconfigured BGP settings not logging authentication properly. It relies heavily on the ingestion of Huawei BGP logs, which must be actively enabled. Legitimate administrative activities may trigger this alert if misconfigurations occur. A related detection, monitoring for successful BGP authentication (i.e., unusual new peer configurations), can help strengthen overall coverage against such attacks.

