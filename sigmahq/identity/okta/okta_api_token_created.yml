note: |
  ### Technical Context
  This detection rule aims to identify when an API token is created in an Okta environment. API tokens are critical components that allow applications to interact with Okta's services, and their unauthorized creation can be a sign of suspicious activity or malicious intent. Attackers may attempt to create API tokens to gain programmatic access to sensitive information or to launch various attacks within the environment, thereby enabling persistence or lateral movement.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (T1136): API tokens can be used to maintain access to systems after initial compromise, allowing attackers to continue their activity undetected.
  - **Credential Access** (T1003): If an unauthorized actor is creating API tokens, they may be attempting to harvest tokens for further exploitation.

  The primary data source for this detection is the Okta system log, particularly focusing on events related to API token creation that can provide insights into who, when, and how the token was created.

  ### Investigation Steps
  - **Review Okta System Logs:** Check the Okta system log for events of type `system.api_token.create` to identify when and by whom the token was created.
  - **Correlate with User Activity:** Analyze the user activity logs of the individual or service account that created the API token, noting any unusual login patterns or actions that may suggest account compromise.
  - **Verify Token Usage:** Investigate any subsequent API calls made using the newly created token to assess whether it was utilized in a manner consistent with normal operational behavior.
  - **Check for Anomalies:** Look for anomalous patterns in the creation of API tokens, such as multiple tokens created in a short period or creation from unusual geographic locations or IP addresses.

  ### Prioritization
  The alert is rated as medium severity due to the potential impact of unauthorized API token creation on an enterprise's security posture. The likelihood of an API token being maliciously generated, especially if associated with an abnormal user or service behavior, necessitates timely investigation to prevent possible data breaches or unauthorized access.

  ### Blind Spots and Assumptions
  This detection rule assumes that all API token creation events are logged correctly and in a consistent format. Potential blind spots include the scenario where legitimate users create tokens for valid purposes, leading to false positives. The detection logic may not account for abnormalities in legitimate user behavior if prior user activity is not tracked comprehensively. Proper logging configurations must be in place in Okta to ensure this alert functions effectively, including retention of logs for API events.

