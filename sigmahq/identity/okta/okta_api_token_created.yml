  ---

  ### Technical Context

  This Sigma rule detects the creation of an API token in Okta, which is a critical action as it can grant access to various services and systems within an organization. The likely attacker objective is to establish persistence or lateral movement within the target environment by leveraging newly created API tokens for unauthorized access. The relevant MITRE ATT&CK tactics and techniques include **Persistence** (TA0003) and **Application Layer Protocol** abuse (T1071).

  The primary telemetry sources are Okta System Log events, specifically looking for the event type `system.api_token.create`. If this activity is malicious, it can lead to unauthorized account access, data exposure, or broader network takeovers. However, this detection does not confirm malicious intent on its own, as legitimate users may also create API tokens for valid purposes.

  ---

  ### Investigation Steps

  - **Check event details:** Review the Okta System Logs for `eventtype: system.api_token.create`. Identify the user ID, application involved, and timestamp of the event. Focus on unusual user accounts or systems with no legitimate need for API token usage.

  - **Analyze API token usage:** Investigate all associated API calls made with the newly created token. Cross-reference with Security Event ID 4624 (Logon) to identify if the token was used to access sensitive resources or perform unusual operations.

  - **Review user account activity:** Examine the user activity leading up to the token creation. Look for any suspicious behavior such as multiple failed login attempts (Event ID 4625), which could indicate an account compromise.

  - **Validate legitimate use cases:** Determine if the user has a documented and acceptable reason for creating the token. Check for prior authorization requests or established policies that allow such actions.

  - **Identify high-confidence threats:** Look for correlated events that might indicate malicious intent, such as simultaneous token creation and configuration changes in other connected applications or services, which can signify an actor attempting to escalate privileges or gain broader access.

  - **Monitor sensitive assets:** If the alert involves a critical asset, ensure additional monitoring is in place around that asset for unusual configurations or access patterns following the token creation.

  ---

  ### Prioritization

  This alert has medium severity. While API token creation is a normal part of application management, it can represent a high risk if created by unauthorized users or for malicious purposes. The likelihood of exploitation depends on the context of the creation, especially in systems with sensitive data or high privileges.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of full user identity exposure or real-time alerting from all API interactions following token creation. Legitimate activities, such as updates from development teams or other approved use cases, may trigger this alert. A related detection to strengthen coverage would be monitoring for unusual logon activity or changes made by accounts shortly after token creation to identify potential compromised accounts.

