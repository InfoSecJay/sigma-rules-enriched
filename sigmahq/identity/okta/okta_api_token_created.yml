note: |
  ### Technical Context

  This rule detects the creation of an API token in Okta, which is often a precursor to unauthorized access to resources by adversaries. The likely attacker objective is to leverage the token for further exploitation, such as accessing sensitive data or escalating privileges. This behavior maps to the MITRE ATT&CK technique "Application Layer Protocol" (T1071) under the tactic "Persistence."

  The primary telemetry source is Okta's system log, specifically looking for the event type `system.api_token.create`. If malicious, the creation of a token can enable attackers to maintain access or exfiltrate data. However, this detection alone does not confirm malicious activity; legitimate API token creation by authorized users can also trigger this alert.

  ### Investigation Steps

  - **Verify event details:** Review the Okta system logs for Event Type `system.api_token.create`. Check the `user`, `ip`, and `client application` fields for patterns or unexpected behavior, comparing with normal operation baselines.

  - **Identify legitimate practices:** Cross-reference the token creation with expected behaviors of known applications. Document legitimate API token creation frequencies and users, usually seen during approved development cycles or integrations.

  - **Evaluate user context:** Investigate the user associated with the token creation. Confirm if the user has a clear business need for API access — if the token was created by a non-technical user or from an unfamiliar geographical location, this is suspicious.

  - **Monitor token usage:** Look for subsequent API calls made using the newly created token. Analyze the success of these API calls (`eventType` for API calls such as `system.api_token.use`) to ensure the token is not being leveraged for unauthorized activities.

  - **Correlate with IAM policies:** Ensure the user creation aligns with your Identity and Access Management policies. If the affected user has exceeded their permitted roles or privileges, this could indicate account compromise.

  ### Prioritization

  This alert should be treated with medium priority. The impact varies significantly based on the role of the affected user; if the user has access to sensitive resources, this could indicate a more serious threat. The potential for malicious use is moderate, as API tokens are commonly used in automated workflows but can also be exploited by attackers.

  ### Blind Spots and Assumptions

  Detection may miss token creations that occur without logging enabled, or in environments with misconfigured logging. Evasion techniques might include legitimate users creating tokens for malicious intent under authorized pretexts. Other legitimate activities that could trigger this rule include routine API token creation for automated scripts. A companion detection could monitor for suspicious API calls made with new tokens, enhancing detection coverage.

