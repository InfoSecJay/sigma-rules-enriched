note: |
  ### Technical Context

  This rule detects the creation of an API token in Okta, which may indicate potential compromise if initiated by unauthorized users. Attackers often create API tokens to maintain persistence within a target environment, enabling them to interact with the Okta API for a variety of malicious purposes, including data exfiltration or lateral movement. This behavior corresponds to the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Valid Accounts (T1078).

  The primary telemetry source is the Okta system log, specifically the event logs related to API activities. If malicious, the creation of an unauthorized API token could allow attackers long-term access to sensitive systems and user accounts. Importantly, this detection does NOT confirm that the API token will be used for malicious activities, nor does it indicate whether the user is unauthorized without additional context.

  ### Investigation Steps

  - **Verify user identity and role: **Check the user's profile in Okta (via the Okta admin dashboard) to confirm if API token creation aligns with their role. Look for legitimate roles such as developers or integrators that routinely create tokens.

  - **Check event log details: **Review Okta system logs for Event Type `system.api_token.create` (source: Okta System Log), focusing on fields such as `user`, ` timestamp`, and `clientIp`. Correlate any anomalies, such as a token creation outside business hours or from an unexpected location.

  - **Identify token usage: **Search Okta logs for subsequent API calls made with the newly created token (log source: Okta API usage logs). Investigate any unusual patterns indicative of data extraction or unauthorized account management.

  - **Evaluate historical log context: **Cross-reference with previous logs for the specific user. Look for signs of unusual activity preceding the token creation, such as failed login attempts (Event ID: 400) or unusual permissions changes (Event Type: `system.user.update`).

  - **Review legitimate activities: **Be aware that legitimate API token creation is typically performed during application integrations or system updates. Document those contexts to differentiate from anomaly patterns.

  - **Document potential impact: **If confirmed malicious, assess the potential damage by identifying what data the token could access based on the user’s permissions in Okta. This could include user accounts, groups, or applications within the Okta environment.

  ### Prioritization

  This alert has medium severity due to the potential impact of an unauthorized API token on sensitive user data and applications. The likelihood of malicious abuse is moderate, as attackers frequently exploit API tokens for lateral movement or data theft, making this behavior a common target for weaponization in API-focused attacks.

  ### Blind Spots and Assumptions

  This detection can be evaded if attackers use existing credentials to create tokens or if they suppress logging in their malicious activity. Reliable detection requires consistent monitoring of Okta system logs and proper configuration to log all API session activities. Legitimate automated processes or admin scripting may also trigger this alert. A related detection to enhance coverage would be monitoring for unusual API usage spikes or an unexpected increase in API token creation events, which could indicate broader account compromise.

