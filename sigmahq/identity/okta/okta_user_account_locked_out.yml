  ### Technical Context

  This rule detects when a user account in Okta is locked out due to exceeding the maximum number of sign-in attempts. This behavior typically indicates an unsuccessful login attack, where an adversary may attempt password guessing or brute force strategies to gain unauthorized access to a user’s account. The likely attacker objective is to compromise user credentials for lateral movement or accessing sensitive data.

  This activity correlates with the MITRE ATT&CK technique T1531 (Account Access Removal). The primary telemetry source is the Okta system log, specifically looking for event types associated with account lockouts, such as “Max sign in attempts exceeded.” If malicious, this indicates that an adversary may be trying to gain unauthorized access to the environment, which could result in data breaches or operational disruptions. However, this detection does NOT confirm malicious intent on its own since account lockouts can also occur from legitimate user error.

  ### Investigation Steps

  - **Review the Event Log for Lockouts:** Check Okta system logs (eventType) for “user.account.locked_out” events to identify the specific user accounts affected and the timing of the events.

  - **Analyze Proximity of Lockouts:** Correlate account lockouts with previous login attempts within a short timeframe. Look for excessive failed logins (eventType e.g., “user.login.failed”) that could indicate a brute-force attack.

  - **Identify Legitimate User Behavior:** Check for legitimate users who may have been attempting to access their accounts during the lockout. Review if these users have a history of failed login attempts corresponding to the lockout event.

  - **Investigate User Account Activity:** Examine the history of the locked account for any unusual patterns, such as access from unrecognized IP addresses or locations prior to the lockout. Utilize fields such as “actor” and “ipAddress” in the Okta system logs.

  - **Monitor for Credential Stuffing Patterns:** Look for multiple accounts being targeted within a short time frame from the same IP address, which may indicate a wider attack campaign beyond a single locked account.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of multiple lockouts indicating an ongoing attack against user accounts. While lockouts can occur from user negligence, high-volume lockouts are likely indicative of malicious activity, and this behavior is commonly weaponized in credential stuffing and brute-force attacks.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated attacks that employ evasion techniques, such as slow brute-force attacks that do not immediately trigger account lockouts. It requires that adequate Okta logging is enabled to capture detailed system log events for application-level user authentication. Additionally, legitimate activities like users repeatedly entering incorrect passwords may trigger the alert. A related detection to consider is monitoring for failed login attempts (T1081), which can provide a more comprehensive view of authentication threats.

