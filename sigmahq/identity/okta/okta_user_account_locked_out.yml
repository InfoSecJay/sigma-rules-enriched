  ---

  ### Technical Context

  This rule detects when a user account in Okta has been locked out due to exceeding the maximum number of sign-in attempts. Such behavior can indicate a brute-force attack or an unauthorized user trying to access an account. The likely attacker objective is to gain access to sensitive data or resources by compromising user accounts. The relevant MITRE ATT&CK tactics and techniques are "Impact" (TA-0002) and "Account Access Removal" (T1531). The primary telemetry source is Okta system logs that capture events related to user authentication failures and lockouts. If the alert is triggered maliciously, it could result in account compromise and potential data breach. However, this detection does NOT confirm malicious intent on its own, as account lockouts can also occur due to legitimate user behavior, such as forgetting passwords.

  ---

  ### Investigation Steps

  - **Check for recent failed login attempts:** Review Okta system logs for entries related to the user account leading up to the lockout event. Look for Event Type "user.session.start" with "status": "REJECTED" and note the timestamp and IP addresses.

  - **Identify account change activity:** Check for any recent changes to the user's account (such as password resets or MFA changes) in the Okta system logs. Focus on Event Types like "user.account.update" and "user.password.reset."

  - **Validate legitimate user behavior:** Confirm if the user has been actively using the account. Check the history of the user’s sign-in activity using the "user.session.start" events. A normal pattern of sign-in activity should display consistent timestamps and successful logins, while abnormal spikes may indicate brute-force attempts.

  - **Cross-reference user roles and permissions:** Determine the criticality of the affected account by assessing its role within the organization. Higher privilege accounts or accounts with access to sensitive data would necessitate increased scrutiny.

  - **Identify high-confidence malicious indicators:** Look for repeated lockout events (e.g., 3 or more within a short timeframe). If identified along with common brute-force IP addresses (checking threat intelligence sources), it may indicate a targeted attack against the user account.

  ---

  ### Prioritization

  This alert has medium severity in an enterprise context, as it can indicate either a low-level brute-force attack or user error. The potential impact of compromising an account is high, especially for privileged accounts. However, the likelihood of this behavior being exploited maliciously can vary based on user awareness and the sensitivity of the data linked to the account.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as attackers using valid credentials or attempting only the maximum allowed failed login attempts without triggering alerts. Reliable detection requires proper logging and monitoring configurations in Okta. Legitimate activities that may trigger the alert include users forgetting their passwords or being locked out after routine credential updates. A related detection method includes monitoring for multiple OAuth authorization requests from the same IP address, which could indicate an attempt to exploit OAuth tokens (related detection T1543.003).

