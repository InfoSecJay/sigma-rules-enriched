  ### Technical Context

  This rule detects instances when a user account in Okta is locked out due to exceeding the maximum number of sign-in attempts. The likely attacker objective is to perform a brute force attack to gain unauthorized access to the account by repeatedly guessing the password. This behavior aligns with MITRE ATT&CK technique: Credential Dumping (T1531). The primary telemetry source is the Okta System Log, specifically targeting events related to account lockouts, which can reveal attempted unauthorized access. If malicious, this indicates a potential breach or targeted attack against user accounts. However, this detection does NOT confirm successful access or control over the account.

  ### Investigation Steps

  - **Check Okta System Log for lockout events**: Look for events with the display message "Max sign in attempts exceeded" (Event type: `user.session.lockout`). Review the user ID and timestamps to determine the context of the lockout.

  - **Review related sign-in attempt logs**: Analyze logs for successful or failed sign-in attempts immediately preceding the lockout (Event type: `user.session.signin`). Identify patterns such as multiple failed attempts from the same IP address.

  - **Correlate IP address with geolocation**: Verify if the IP address is from a known location for the user. If the attempt is from an unusual geographic area or outside of work hours, it may indicate malicious intent.

  - **Identify legitimate application usage patterns**: Understand and document legitimate access patterns for users. For example, if a user typically logs in from a corporate VPN, attempts from external IPs can be flagged as suspicious.

  - **Analyze for additional user account anomalies**: Check for other indications of compromise (e.g., changes in security settings, privilege escalations) by reviewing related events in the Okta system logs.

  - **Check for bulk lockout events**: If multiple accounts are locked out simultaneously from the same IP, this may suggest an automated attack (brute force), requiring further escalation.

  ### Prioritization

  The medium severity of this alert reflects the potential impact on user accounts, especially if critical accounts are being targeted. The likelihood of malicious abuse is moderate, as brute force attempts are a common method used by adversaries. While not always weaponized, account lockouts can indicate a broader targeting attempt.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated brute force attacks that utilize uncommon credentials or methods to avoid triggering lockouts. Reliable detection relies on properly configured Okta logs. Legitimate user behavior, such as multiple failed attempts due to lost credentials or an employee in a new location, can also trigger this alert. Companion detections, such as monitoring for unusual authentication patterns or password change requests, can strengthen overall security posture against unauthorized access attempts.

