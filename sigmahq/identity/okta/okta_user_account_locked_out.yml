note: |
  ### Technical Context
  This rule detects when a user account in Okta is locked out due to exceeding the maximum number of sign-in attempts. User account lockouts often serve as an indicator of potentially malicious activity, such as brute force attacks where an attacker attempts to gain unauthorized access to an account by systematically trying various passwords. A successful compromise can lead to privilege escalation, data breaches, or lateral movement within the network.

  The relevant MITRE ATT&CK tactics and techniques applicable to this rule are **Impact (TA0040)**, specifically **Account Access Removal (T1531)**. Attackers may attempt to lock out accounts to disrupt services or to force resets that could provide an opportunity for exploitation. The primary data sources for this detection are Okta system logs, specifically those related to user authentication events.

  ### Investigation Steps
  - **Review Okta Authentication Logs:** Examine the logs for the specific user account that was locked out to identify the timestamps and IP addresses of the failed login attempts leading to the lockout.
  - **Check for Patterns:** Analyze whether the lockout is part of a broader pattern affecting multiple accounts, which could indicate a systematic brute-force attack rather than a specific targeted incident.
  - **Access User Context:** Investigate the locked account's recent activities and permissions. Determine if the user account has elevated privileges that might make it a high-value target.
  - **Monitor for Follow-Up Incidents:** Prepare to look for subsequent actions such as password reset attempts or account recovery requests from the affected user, which may indicate that the attacker is escalating their efforts to gain access.

  ### Prioritization
  This alert is assigned medium severity due to the potential risk of account compromise tied to lockout events. In an enterprise environment, a series of lockouts can indicate an ongoing attack, requiring timely investigation to prevent further damage.

  ### Blind Spots and Assumptions
  The detection logic may not cover all scenarios of account lockouts, such as those caused by legitimate user actions (like forgotten credentials) or automated system processes. There may also be gaps if logging is not properly configured in Okta to capture every relevant authentication event. The effectiveness of this alert depends on comprehensive logging of user authentication attempts and understanding of normal user behavior patterns within the organization.

