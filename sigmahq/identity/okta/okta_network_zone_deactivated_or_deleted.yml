note: |
  ### Technical Context

  This Sigma rule detects events related to the deactivation or deletion of a Network Zone in Okta. The likely attacker objective could be to disrupt authentication mechanisms by altering access control configurations, potentially facilitating unauthorized access to resources. Relevant MITRE ATT&CK tactics include "Impact" (TA0020) and technique "Account Access Removal" (T1170). The primary telemetry source is the Okta System Log, specifically capturing events with types "zone.deactivate" and "zone.delete". The security impact is significant since altering network zones can directly affect user authentication and access controls. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could also trigger these events.

  ### Investigation Steps

  - **Check log details for context:** Review the Okta System Log for events with `eventType` set to "zone.deactivate" or "zone.delete" (Event ID 1234). Pay attention to the `actor` field to identify who initiated the change. Confirm whether the action aligns with expected administrative behavior.

  - **Identify prior configuration changes:** Look for preceding log events in the Okta System Log indicating modifications to the affected network zones. Check for events related to `zone.create` indicating a legitimate administrative workflow leading to zones being deactivated.

  - **Document user roles and actions:** Determine if the user performing the action has appropriate administrative privileges. Examine the `actor` role in Okta and consider if their recent activity is consistent with known security policies. Compare against the expected administrators who typically manage network zones.

  - **Monitor for related network zone activities:** Review logs for any attempts to create or modify rules within the affected Network Zone before the deletion or deactivation event. This includes checking for event types related to "zone.create" or "zone.update".

  - **Correlate with other system logs:** Cross-reference Okta logs with network firewalls or proxies to ascertain if there were unauthorized access attempts before or after the zone's state change. Logs should indicate potential lateral movement or probing behavior targeting sensitive services.

  ### Prioritization

  This alert is assessed at medium severity due to the potential impact on authentication and resource access in the enterprise. The likelihood of malicious abuse is moderate, especially if such changes are unaccompanied by justified administrative activity. This behavior, while not extremely common, can be weaponized by adversaries targeting authentication controls.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative activities if appropriate logging is not in place, leading to false positives. Evasion techniques may include actors impersonating legitimate admin roles or making rapid changes to obscure malicious activity. It's important to consider that legitimate user actions, such as scheduled changes or maintenance, may trigger this alert. A related detection to strengthen coverage could involve monitoring for unauthorized access attempts coinciding with changes to network zones.

