  ### Technical Context

  This Sigma rule detects events indicating that a network zone within Okta has been deactivated or deleted. The likely objective of an attacker could be to disrupt access by manipulating zones that control network access policies, potentially facilitating further lateral movement in the network. This activity maps to the MITRE ATT&CK tactic of **Impact (TA0040)**, specifically the technique of **Account Manipulation (T1098)**.

  The primary telemetry sources for this detection come from Okta system logs, particularly focusing on event types labeled as `zone.deactivate` or `zone.delete`. If malicious, this behavior can lead to unauthorized access changes or disruptions in access control mechanisms. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could also trigger these events.

  ### Investigation Steps

  - **Review event details for context:** Examine the Okta system logs for event types `zone.deactivate` and `zone.delete` between Event IDs 0 and 5000 for associated timestamps, user IDs, and IP addresses. Look for unexpected user accounts that may indicate unauthorized activity.

  - **Validate the user’s role and actions:** Check the user’s role in Okta and see if they have administrative privileges. Legitimate zone changes should typically originate from known administrators during a scheduled maintenance window.

  - **Identify associated changes:** Look for additional user activity surrounding the zone deactivation or deletion event. Cross-reference with Event IDs for login attempts (Event ID 1000) to see if any unexpected login patterns correlate with the zone changes.

  - **Check for IP Reputation:** Investigate the source IP address of the event against threat intelligence databases. An IP address with a poor reputation may indicate external malicious activity.

  - **Analyze related event sequences:** Review the Okta system logs for other related events performed by the same user or on the same zones around the same time. Look specifically for suspicious sequences that sometimes precede zone modifications.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on access control. The likelihood of malicious abuse is moderate as deactivating or deleting network zones can be critical for a network's security posture. However, such actions are sometimes weaponized by attackers during initial access or privilege escalation attempts.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations in Okta, which can prevent visibility into specific actions taken pre- or post-zone modifications. Legitimate administrative actions, such as routine security updates or reconfigurations, can trigger this alert, potentially leading to false positives. A companion detection rule monitoring for suspicious access patterns or administrative changes can enhance coverage and context regarding these events.

