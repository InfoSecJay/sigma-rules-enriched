note: |
  ### Technical Context
  This detection rule identifies events in Okta where a network zone is either deactivated or deleted. Network zones in Okta represent specific network environments from which users can access resources. When an attacker gains unauthorized access or manipulates these zones, they could potentially bypass security restrictions, facilitating lateral movement and access to sensitive information. The likely attacker objectives may include attempting to disrupt services, bypassing access controls, or preparing for further malicious actions.

  This activity relates to the MITRE ATT&CK framework under the tactics of "Impact" (TA0040) and techniques such as "Data Manipulation" (T1491) and "Account Access Removal" (T1531). Monitoring changes within identity management platforms like Okta is critical, as such activities can indicate initial penetration or internal misconfigurations being exploited by adversaries.

  The primary data sources for this rule are the System Log from Okta, which captures events related to user activity, system changes, and overarching configurations within an organization's identity management framework.

  ### Investigation Steps
  - **Review Okta System Logs**: Look for entries corresponding to `zone.deactivate` or `zone.delete` within the relevant timeframe. Identify which user or service account initiated the changes to assess legitimacy.

  - **Verify User Context**: Investigate the identity of the user or service account that performed the action. Check for unusual access patterns or privileges, and correlate it with existing access control policies to determine if the changes align with appropriate administrative actions.

  - **Analyze Network Impact**: Understand the implications of the deactivation or deletion of the network zone. Determine if this could facilitate unauthorized access to resources or expose sensitive areas of the environment.

  - **Cross-reference with Recent Activities**: Examine other related logs within your SIEM for actions executed by the same user or service account before and after the event. Look for any suspicious behaviors that could indicate malicious intent or breaches.

  ### Prioritization
  The alert is classified with medium severity due to the potential impact of unauthorized manipulation of network zones, which could allow adversaries to bypass security restrictions or disrupt services within the environment. Organizations should assess the frequency and context of occurrences to evaluate the likelihood of malicious intent.

  ### Blind Spots and Assumptions
  This detection logic may miss events occurring outside the Okta environment, such as changes made through direct API calls or those that do not generate logs within the standard Okta System Log. It assumes that all relevant zones will be logged consistently and that the user activity aligns with organizational norms. Adequate logging configurations must be ensured within Okta to facilitate accurate detection. Familiarity with and appropriate permissions for reviewing logs are essential for the successful application of this rule.

