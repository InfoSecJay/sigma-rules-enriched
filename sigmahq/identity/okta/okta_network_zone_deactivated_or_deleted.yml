  ### Technical Context

  This rule detects the deactivation or deletion of a network zone in Okta. Such actions may indicate administrative changes, which could be benign but may also suggest an attacker is attempting to alter authentication requirements or exploit misconfigured access controls. The relevant MITRE ATT&CK tactic is **Impact** (TA0040) and the technique is **Data Manipulation** (T1401). Primary telemetry sources include Okta System Log records, specifically focusing on events related to network zone changes.

  If these actions are malicious, they could compromise user access and compromise the overall security posture of the organization, potentially leading to unauthorized access to sensitive environments. However, this detection alone does not confirm that an adversary is present or that they have successfully exploited any vulnerabilities.

  ---

  ### Investigation Steps

  - **Review recent changes to network zones**: Check Okta System Log for Event Type `zone.deactivate` or `zone.delete` (e.g., Event IDs 3020054 for deactivate and 3020055 for delete). Cross-reference these events with administrative accounts that made the changes.

  - **Identify the originating user and their privileges**: Analyze logs to identify the user account responsible for the zone change. Determine if the account has administrative privileges or if it is a compromised user account by checking user status and associated group memberships.

  - **Correlate with other log events**: Look for unusual activity around the time of the zone change, such as multiple failed login attempts or API calls from suspicious IP addresses, using Okta logs to check for any anomalies.

  - **Check for legitimate administrative activity**: Validate if there were any scheduled maintenance or planned administrative updates by reviewing internal change logs or asking relevant IT personnel. Compare timestamps of changes to any pre-approved activities.

  - **Monitor related authentication behavior**: Assess authentication traffic post-event in Okta logs to identify any unusual access patterns or failures, indicating possible manipulation of security policies or misconfigurations.

  - **Identify potential data exfiltration attempts**: If the network zone changes relatedly affect access permissions, monitor for any subsequent high-risk file downloads or data exports utilizing Okta logs to check for unusual API access patterns.

  ---

  ### Prioritization

  This alert is medium severity due to the potential impact on user access and authentication integrity within the enterprise. While deactivation or deletion of network zones could be part of routine configurations, it carries a notable risk of malicious abuse, especially if linked with other suspicious activities.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detecting all legitimate administrative actions, particularly if they are scheduled or communicated effectively. Compromised administrative accounts may trigger this alert, highlighting the importance of robust user activity logs. False positives can arise from legitimate domain restructuring or administrative housekeeping. A companion detection for account compromise should be in place, such as monitoring for anomalous user login patterns that might suggest elevated privileges were misused.

