note: |
  ### Technical Context
  This detection rule identifies instances where an Okta end-user reports suspicious activity related to their account. The alert focuses on user-submitted reports signaling that they believe their account may have been compromised or misused. It serves as an early warning indicator that a user's credentials could be at risk, which is critical for proactively investigating potential account compromise or malicious activity.

  The primary threat scenario involves attackers attempting to gain unauthorized access to user accounts for data theft, privilege escalation, or lateral movement within the enterprise environment. By alerting on user-reported suspicious activity, security teams can prioritize investigations into potentially compromised accounts and take appropriate actions to secure them.

  Relevant MITRE ATT&CK tactics include:
  - **Resource Development (TA0042)**: The phase of gathering tools and infrastructure for an attack.
  - **User Execution (T1203)**: In scenarios where users are tricked into executing malicious content.
  - **Credential Dumping (T1003)**: If suspicious activity leads to credential theft or misuse.

  The primary data source for this detection will be Okta system logs, specifically the event types logging user-generated reports of suspicious activities.

  ### Investigation Steps
  - **Review Okta System Logs**: Analyze the Okta system logs for the reported event type `user.account.report_suspicious_activity_by_enduser` to identify the context and details surrounding the user's report.

  - **Correlate User Actions**: Look into the user's activity preceding the report, including login attempts and any other pertinent actions that may provide insights into potential compromise or misuse.

  - **Verify Account Activity**: Assess for any unauthorized access to the user's account by checking for unusual login locations, times, or failed authentication attempts that could indicate credential theft or phishing.

  - **Engage with the End-user**: Contact the reporting end-user to confirm their account activities and obtain more details regarding the circumstances around their report, such as any recent security concerns or notifications they may have received.

  ### Prioritization
  This alert is considered high severity as it signifies a potential compromise of user accounts, which can lead to data breaches or unauthorized access to critical resources. Quick investigation is essential to mitigate risks associated with user credential abuse in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding false positives, where end-users might incorrectly identify normal activities as suspicious. The detection logic assumes that the users are acting in good faith and that their reports indicate genuine security concerns. Additionally, this rule relies on the availability of Okta system logs that capture user-reported activities; any misconfiguration or lack of logging may hinder accurate detection and response.

