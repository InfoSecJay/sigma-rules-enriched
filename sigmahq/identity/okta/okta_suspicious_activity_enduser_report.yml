note: |
  ### Technical Context

  This rule detects when an Okta end-user reports suspicious activity related to their account. The likely attacker objective is to compromise user credentials for unauthorized access and actions within an enterprise environment. This behavior aligns with the MITRE ATT&CK tactic of "Resource Development" and the technique "Fraudulent Reporting" (T1586.003). Primary telemetry sources include Okta system logs, specifically focusing on the event type eventtype: 'user.account.report_suspicious_activity_by_enduser'.

  If the alert is confirmed as malicious, the security impact could include unauthorized access to sensitive data or services, possibly leading to data breaches or loss of integrity in user accounts. However, it should be clearly stated that this detection does NOT confirm malicious intent on its own; it merely indicates user concern regarding their account's security.

  ### Investigation Steps

  - **Review the Context of the Reported Activity:** Examine user context and the history of recent logins or actions by the user in Okta logs (Event Type: user.session.start) to assess the legitimacy of concerns raised.

  - **Analyze User Behavior Patterns:** Cross-reference reported suspicious activity against normal user behavior using Okta reports (e.g., logins from unusual locations, devices, or timeframes) to distinguish between benign and malicious patterns.

  - **Check for Signs of Compromise:** Investigate related events in the Okta system logs indicating multiple failed login attempts, account lockouts, or unusual account modifications (Event Type: user.account.lockout or user.account.modify) that might suggest an attacker attempting to gain access.

  - **Verify Support Tickets or Incident Reports:** If applicable, check the organization's ticketing system for related user reports or IT support tickets corresponding to the suspicious activity reported to validate or contextualize the alert further.

  - **Assess Benign User Reports:** Identify legitimate causes of user concerns, such as scheduled maintenance activities or interactions with administrators that may naturally lead a user to report their account as suspicious, ensuring to document these factors in ticketing systems.

  ### Prioritization

  This alert has a high severity level due to the potential impact on sensitive user accounts and access to corporate resources. The likelihood of malicious abuse is elevated, especially if combined with other warning signs such as unusual login patterns. This user-initiated alert serves as an early warning signal and should be reviewed promptly.

  ### Blind Spots and Assumptions

  Detection limitations include the risk of false positives from legitimate user concerns, such as misidentifying normal account activity as suspicious. Effective detection requires proper configuration of Okta system logs to capture the relevant event type. Legitimate activities, such as scheduled password changes or regular login attempts from new devices, may trigger this alert. A related detection to strengthen coverage would be monitoring for suspicious account access patterns or credential theft indicators, which could corroborate an escalated threat.

