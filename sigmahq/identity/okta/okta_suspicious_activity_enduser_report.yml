note: |
  ### Technical Context

  This Sigma rule detects instances where an Okta end-user reports potentially suspicious activity related to their account. The likely attacker objective is account compromise, where an adversary aims to gain unauthorized access or conduct malicious transactions using stolen credentials. This behavior aligns with the MITRE ATT&CK tactic "Resource Development" (TA0042) and technique "Compromise Accounts" (T1586.003).

  The primary telemetry source for this detection is Okta's System Log, specifically events generated under user account activity. If the detected activity is indeed malicious, it could lead to unauthorized access, data breaches, and potential compromise of sensitive information. Importantly, this detection does NOT confirm that malicious activity has occurred; it merely indicates that a user has flagged certain actions as suspicious.

  ### Investigation Steps

  - **Review the reporting user’s account activity:** Check Okta System Logs for events linked to the user's account (Event Type: `user.account.report_suspicious_activity_by_enduser`). Look specifically for unusual login times or locations that deviate from the user’s typical behavior.

  - **Correlate reported time with recent account activity:** Identify the timestamp of the suspicious report and correlate it with recent logins or account changes (Event Types: `user.session.start`, `user.session.end`, or any account orbit/changes). Look for anomalies or unauthorized access during this timeframe.

  - **Inspect user profile changes:** Verify if any unauthorized changes were made to the user’s profile or permissions around the time of the report (Okta Event Types: `user.profile.update`, `user.role.add`). Legitimate changes would reflect known activities or user requests.

  - **Assess multi-factor authentication (MFA) logs:** Check for any failures or unusual patterns in MFA events (Event Type: `user.authentication.mfa.factor`) that correspond with the user being compromised and have mismatched behavior (e.g., different IPs, devices).

  - **Validate user education efforts:** Look for existing security awareness training records for the user to distinguish between errors from user misunderstanding (e.g., misreporting normal activities) versus genuine suspicions.

  - **Monitor for subsequent alerts or escalations:** Track for any follow-up alerts indicating further suspicious activities or account compromise attempts on the user’s account, such as multiple failed login attempts from unfamiliar locations (Okta Event Type: `user.login.failed`).

  ### Prioritization

  This alert is high priority because it involves potentially compromised accounts, which are critical to the organization's security posture. Given that compromised accounts are frequently exploited in attacks, the likelihood of malicious abuse is significant, especially in environments where sensitive information is accessible.

  ### Blind Spots and Assumptions

  Limitations in detection may arise from users misidentifying normal activity as suspicious due to lack of familiarity with security protocols. Reliable detection requires comprehensive logging settings in Okta to capture all relevant events. Legitimate activities like legitimate password changes or updates may trigger these alerts. A related detection to consider is monitoring for failed login attempts (Okta Event Type: `user.login.failed`), which provides additional context to the initial alert and helps gauge potential account compromise.

