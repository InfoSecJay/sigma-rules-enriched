note: |
  ### Technical Context
  This rule detects the creation of new identity providers in Okta, an event that may signify an attempt to establish a new foothold within an organization's identity management system. Attackers might create identity providers to facilitate unauthorized access or impersonation, potentially bypassing existing security controls. In a scenario where an adversary gains access to an administrator's credentials, they could create an identity provider to redirect authentication requests, enabling access to sensitive resources or accounts.

  This behavior aligns with several MITRE ATT&CK tactics and techniques, notably **Persistence (T1543)**, where attackers establish new mechanisms to maintain access, and **Privilege Escalation (T1098.001)** through creating identity providers that could grant elevated permissions for compromised accounts. The primary data source for this detection is derived from Okta's system log events, specifically monitoring events related to identity provider lifecycle changes.

  ### Investigation Steps
  - **Review Identity Provider Creation Events:** Check the Okta system log for `system.idp.lifecycle.create` events to identify the details of the new identity provider, including the timestamp and the admin account used for creation.
  - **Correlate with User Activity Logs:** Examine user activity logs around the time of the identity provider creation to ascertain whether the admin's actions were authorized or appear suspicious.
  - **Audit Admin Permissions:** Review the permissions of the admin account that created the identity provider to ensure it has not been compromised or misused.
  - **Assess Identity Provider Configuration:** Analyze the configuration of the newly created identity provider to check for anomalies, such as unexpected redirect URIs or unauthorized configurations that might facilitate phishing or credential theft.

  ### Prioritization
  The alert is classified as medium severity due to the potential impact on the organization's security posture through unauthorized access or impersonation that might arise from identity provider misconfigurations, especially in high-stakes environments where privileged access is critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative actions, such as when an authorized admin creates an identity provider for valid purposes, which could lead to false positives. The rule operates under the assumption that the Okta system logs are active and thoroughly monitored. Proper configuration for capturing these logs is essential for the alert to function effectively, including sufficient log retention and access to relevant endpoint security logs to correlate potentially malicious behavior.

