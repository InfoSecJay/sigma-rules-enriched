  ---

  ### Technical Context

  This rule detects the creation of a new identity provider (IdP) within Okta's environment. The likely objective of an attacker triggering this behavior would be to establish a foothold, enabling them to authenticate as users within the organization or facilitate unauthorized access to sensitive resources. This activity aligns with the MITRE ATT&CK tactic of Persistence and the technique of External Remote Services (T1098.001).

  The primary telemetry source is Okta's System Log, specifically monitoring for the event type `system.idp.lifecycle.create`. If the event is malicious, it may allow attackers to manipulate authentication flows. However, it’s important to note that this detection does not confirm malicious intent on its own, as legitimate admin activities can also trigger this event.

  ---

  ### Investigation Steps

  - **Check recent Okta System Log entries:** Review the System Log for event type `system.idp.lifecycle.create`, particularly timestamps around the alert; legitimate admin creation of an IdP should originate from known admin accounts.

  - **Evaluate user and role permissions:** Verify if the user account associated with the creation event has the appropriate permissions; a legitimate admin should have roles such as "Super Admin" or "Org Admin."

  - **Analyze IdP configuration for anomalies:** Inspect the newly created IdP configuration for any unusual settings, such as unexpected redirect URIs or SAML configurations that do not align with the organization's policy.

  - **Cross-reference with user access metrics:** Identify any unusual access patterns or login attempts following the IdP creation event; monitor for any logins from unexpected IP addresses or geolocations.

  - **Identify any associated alert escalations:** If the creation is tied to further suspicious activity, such as mass entitlement changes or user impersonation attempts, it increases the likelihood of adversarial behavior.

  ---

  ### Prioritization

  This alert has a medium severity level. While the impact can be significant, especially if the creation of an IdP is used to establish unauthorized access, the likelihood of benign activity is relatively high if it correlates with known admin actions. However, this behavior is also an area commonly exploited by attackers in order to abuse authentication mechanisms.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by delays in log ingestion; real-time monitoring of the Okta System Log is recommended to quickly identify and respond to incidents. A legitimate admin setting up a new IdP for a valid external service could trigger this alert without malicious intent. Monitoring for companion detections such as abnormal authentication patterns or access across the newly added IdP will provide additional context to assess risk accurately.

