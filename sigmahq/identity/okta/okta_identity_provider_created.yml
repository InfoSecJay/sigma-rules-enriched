note: |
  ### Technical Context

  This rule detects the creation of a new identity provider (IdP) within Okta, which can indicate an attempt to establish a new authentication mechanism, potentially facilitating unauthorized access or privilege escalation. The attacker likely aims to impersonate legitimate users or enrich their access through malicious means. This behavior aligns with the MITRE ATT&CK technique T1098.001 (Account Manipulation: Identity Provider Association).

  The primary telemetry source is the Okta System Log, specifically looking for events with the type ‘system.idp.lifecycle.create.’ If malicious, this could significantly impact the organization's security posture by enabling an attacker to insert fake identities or modify access controls. However, this detection does NOT confirm malicious intent on its own, as legitimate administrators may create new IdPs in authorized circumstances.

  ### Investigation Steps

  - **Review Okta System Log for event details**: Check for Event Type `system.idp.lifecycle.create` within the Okta System Log API. Look for fields such as `actor`, `target`, and `eventTime`. Confirm if the actor is an authorized administrator.
  - **Identify changes in IdP configuration**: Retrieve the existing IdP configurations to determine if this is an expected addition. Use Okta API calls to list current IdPs and compare against the newly created one.
  - **Examine recent administrative actions**: Investigate the timeline for administrative activities leading up to the IdP creation by reviewing the Event Type `system.organization.lifecycle` for any unusual modifications by the same actor.
  - **Check for associated user accounts**: Look for user accounts associated with the newly created IdP to verify if they match existing legitimate users. Use the Okta API to retrieve user group memberships and roles that align with the IdP.
  - **Assess the necessity of the IdP**: Determine if the new IdP aligns with organizational needs and recent security policies. Identify projects or changes that may justify its creation to differentiate legitimate behavior from malicious intent.

  ### Prioritization

  This alert has medium severity as it could signify a strategic move by an adversary to establish persistence or leverage credential manipulation tactics. The likelihood of abusive creation is moderate, as many organizations regularly deploy new identity providers that may not result in malicious exploitation.

  ### Blind Spots and Assumptions

  Potential blind spots include evasion techniques where adversaries may mimic legitimate administrative behavior by using stolen credentials. Accurate detection relies on proper configuration of Okta auditing and complete visibility of administrative activities. Legitimate instances may trigger this alert when authorized administrators create identity providers for business needs, thus requiring context. Additional detection opportunities include monitoring for user account modifications to ensure that all IdPs are accounted for and justified.

