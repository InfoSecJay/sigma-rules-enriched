note: |
  ### Technical Context

  This Sigma rule detects the creation of a new identity provider (IdP) in Okta, which could indicate both legitimate administrative activity or potential malicious behavior. An attacker may aim to impersonate users or escalate privileges by introducing a rogue identity provider. The relevant MITRE ATT&CK tactic is "Persistence" (TA0003) with the technique "Valid Accounts" (T1098.001).

  The primary telemetry source is Okta system log data, specifically focusing on the event type `system.idp.lifecycle.create`. If malicious, this behavior can compromise the integrity of authentication processes across services. However, detection of this event alone does not confirm malicious intent, as legitimate administrative actions can trigger the same alert.

  ### Investigation Steps

  - **Review Okta system logs for the event type**: Check for `eventType: system.idp.lifecycle.create` using Okta's System Log API. Investigate the `actor` field to identify which administrator initiated the creation.

  - **Identify administrator roles**: Cross-reference the user’s administrative role with your organization's policy. Legitimate activity typically involves creation by users in the "Super Admin" or "Org Admin" roles.

  - **Evaluate the timestamp and frequency of events**: Analyze multiple IdP creation events within a short timeframe (e.g., less than 5 minutes) for potential automated scripts or suspicious behavior, which is an indicator of malicious activity.

  - **Inspect the new IdP configurations**: Review the details of the newly created IdP by examining fields such as `idpName` and `idpType` for any unexpected parameters that may indicate malicious intent.

  - **Check for recent unauthorized access patterns**: Verify if there were any recent failed login attempts correlating with the time of IdP creation by searching for corresponding `eventType: user.session.start` and `eventType: user.login.failure` events.

  - **Document response outcomes**: Maintain records of findings and document any legitimate administrative processes to contextualize detected alerts in future investigations.

  ### Prioritization

  This alert carries medium severity due to the potential impact on user authentication and service access if exploited. The likelihood of malicious abuse is moderate as legitimate administrative actions may provoke this alert. However, the creation of an unauthorized IdP could lead to significant security risks if used for account impersonation or unauthorized access.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate administrative workflows by authorized users. Ensure logging is enabled for the entire Okta environment to capture necessary events. An example of related detection is monitoring for IdP usage by inspecting `eventType: user.login.success` to trace actions performed with newly created identity providers, providing greater visibility into the security context of this alert.

