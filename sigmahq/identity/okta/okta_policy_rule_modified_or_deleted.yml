note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of policy rules within the Okta identity management system. This behavior may indicate an attacker attempting to undermine access control or to create aggressive exploitation methods by altering security protocols. The likely objective of an adversary could be to gain unauthorized access to sensitive resources or to maintain persistence. Relevant MITRE ATT&CK tactics include **Impact (T1489)**, particularly the technique of **Data Manipulation (T1485)**. Primary telemetry sources are Okta system logs, specifically focusing on event types `policy.rule.update` and `policy.rule.delete`. If the detected activity is malicious, it can lead to significant security risks, such as unauthorized access or resource compromise. This detection does NOT confirm that policy changes were made by an unauthorized user without further investigation.

  ### Investigation Steps

  - **Review recent policy changes: ** Investigate the list of modified or deleted policy rules using Okta System Log events with Event Type: `policy.rule.update` and `policy.rule.delete`. Look for changes made during suspicious timeframes or by accounts with no known administrative role.

  - **Identify user account behavior: ** Validate the user account responsible for the change by checking its access patterns within the last week using the `user.login` event types. Legitimate administrative changes should correlate with authorized user authentication events from the same account.

  - **Check administrative role and privileges: ** Review Okta logs for the account’s privilege levels by analyzing fields like `actor.id` and `target.id`. Confirm whether the user had appropriate permissions to modify/delete policy rules. Any deviation from standard privilege assignments is a possible indicator of malicious activity.

  - **Analyze related event logs for further anomalies: ** Investigate related events before and after the changes, specifically focusing on system logs with event types indicating unauthorized access attempts (e.g., `user.authentication`, `system.api.access`) which could indicate prior reconnaissance activities.

  - **Track policy changes against critical assets: ** Cross-reference the modified policy rules against the critical assets within your organization to determine if any sensitive resources or user groups were impacted. This analysis could reveal the breadth of the security implications following the policy changes.

  ### Prioritization

  The alert severity is medium due to the potential impact on critical systems related to identity and access management. The likelihood of malicious abuse is moderate, particularly among targeted attacks where access control modification assists exploitation efforts. Such behavior is not uncommon in sophisticated attack scenarios, making prompt investigation vital.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques such as legitimate administrative users misusing their privileges or automated scripts executing policy changes without proper oversight. Required log sources include comprehensive Okta System Logs, particularly focusing on event types related to policy changes. Legitimate operational activities such as scheduled system maintenance or automated compliance checks may trigger this alert. A complementary detection for failed authentication attempts or unrecognized IP access could enhance coverage against potentially malicious actions.

