note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of policy rules within the Okta Identity Management system. Such changes can indicate unauthorized access to sensitive configuration settings, potentially leading to escalated privileges or changes to access controls. The objective of an attacker might be to weaken security postures or facilitate unauthorized access for lateral movement. This behavior aligns with the MITRE ATT&CK tactic "Impact" (TA0040) and the technique "Modify Application Data" (T1485). The primary telemetry sources are Okta system logs, specifically the event types associated with policy rule modification and deletion. If malicious, this activity can severely compromise the integrity of the identity management framework and allow unauthorized entities increased access to critical systems. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate changes made by authorized personnel also generate similar logs.

  ### Investigation Steps

  - **Review system logs for event types:** Check Okta system logs for event types `policy.rule.update` and `policy.rule.delete` (API endpoint: `/api/v1/logs`). Compare timestamps with recent administrative changes to verify legitimacy.

  - **Identify accounts associated with changes:** Look for user identifiers in the log entries corresponding to the policy changes. Check if the account is a known administrator or if the change was made by an unexpected or suspicious account.

  - **Assess frequency of changes:** Investigate the change history for the relevant policy rules to determine if modifications occur in a suspicious pattern or if they correlate with presumed threat actor behavior (e.g., prior authentication failures or unusual logins).

  - **Evaluate expected behavior:** Determine if the modified or deleted policy rule corresponds with a scheduled maintenance window or legitimate administrative task. Compare the changes against documented policies within the organization.

  - **Check for additional alerting:** Confirm if there are companion detections that correlate with the policy changes, such as failed logins (Event ID: `authentication.failure`) or unusual user behavior, to strengthen the context of the incident.

  - **Validate any file creation or exfiltration:** If policy changes were made to enhance access privileges, review for any subsequent unusual access patterns to sensitive files or data losses (for example, check for event types related to data exports or downloads in Okta logs).

  ### Prioritization

  The severity of this alert is medium due to its potential impact on access control configurations in your enterprise environment. Unauthorized modifications could lead to malicious actors exploiting weakened policies. While this behavior can be weaponized, it is also associated with legitimate administrative operations, necessitating careful analysis of user context.

  ### Blind Spots and Assumptions

  This detection may be limited by the fact that authorized staff can also modify or delete policy rules, potentially leading to false positives. Ensure that comprehensive logging is enabled for Okta to capture all relevant activities vividly. Legitimate administrative changes, especially during organizational phase-outs or changes in policy, may trigger the alert without malicious intent. A related detection could involve monitoring for high-risk authentication methods or unusual login behavior that occurs around the same timeframe as the policy changes, strengthening overall security posture.

