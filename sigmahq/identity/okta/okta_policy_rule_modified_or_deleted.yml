note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of policy rules within the Okta identity management system. Such activity could indicate malicious actors attempting to bypass security controls or alter access permissions, potentially compromising user accounts or sensitive resources. In an enterprise environment, an attacker's objective may be to facilitate unauthorized access, increase their attack surface, or cover their tracks by manipulating identity policies.

  The relevant MITRE ATT&CK tactics for this detection include **Impact (TA0040)**, particularly techniques that involve data manipulation or service disruptions. Specifically, it could relate to **Permissions Modification (T1484)**, where attackers adjust access controls to facilitate further malicious activities. The primary data source for detecting these modifications is the Okta system log, which captures various event types associated with policy changes.

  ### Investigation Steps
  - **Review Okta System Logs**: Analyze the Okta system logs for entries specifically tagged with `policy.rule.update` or `policy.rule.delete` to identify the user and timestamp associated with such modifications.

  - **Verify User Context**: Assess the user accounts responsible for the modifications. Investigate their role, access rights, and whether the actions align with their responsibilities and expected behavior.

  - **Cross-reference with Policy History**: Check historical records of policy rules applied within Okta to ascertain any unauthorized changes and whether they deviate from standard configurations.

  - **Monitor for Subsequent Activity**: Keep an eye out for additional activities following the modifications or deletions, particularly those that involve access attempts from affected users or modifications to related resources.

  ### Prioritization
  This alert is of medium severity due to the potential impact changes to policy rules can have on the security posture of the enterprise. Unauthorized modifications could lead to extensive access privileges for malicious actors, making this a significant concern.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the quality and retention period of Okta logs. The detection logic assumes that monitoring of these event types is adequate and reliable without accounting for potential logging misconfigurations or delays in log aggregation. Ensuring comprehensive logging for Okta events is essential for effective detection capabilities in this area.

