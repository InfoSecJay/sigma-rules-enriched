note: |
  ### Technical Context

  This Sigma rule detects events related to modifications or deletions of applications within the Okta environment. The likely attacker objective is to either disable security controls by modifying application permissions or disrupt service availability by deleting critical applications. This behavior is associated with the MITRE ATT&CK tactic "Impact" (TA0040) and technique "Data Destruction" (T1485). The primary telemetry source is the Okta system logs, specifically tracking `eventtype` attributes for `application.lifecycle.update` and `application.lifecycle.delete`. If these actions are malicious, they could undermine identity management and unauthorized access could result in data breaches or service outages. It's important to note that this detection alone does not confirm intent; benign administrative actions could also trigger this alert.

  ### Investigation Steps

  - **Review log details for application changes:** Check Okta system logs for `eventtype` equal to `application.lifecycle.update` or `application.lifecycle.delete`. Verify the timestamp, user roles, and application names involved for context.

  - **Identify affected applications:** Cross-reference with documented applications within your organization. Look for any critical application modifications or deletions particularly those categorized as essential for operations.

  - **Correlate user activity:** Analyze the user's activity surrounding the event using fields such as `actor` and `actor_type` in the logs. Legitimate activity typically shows a user with administrative rights performing updates during normal business hours.

  - **Check for high-confidence malicious indicators:** Look for changes made by unknown or unauthorized administrators, unusual IP addresses, or access patterns outside normal parameters. Any activity from an unfamiliar account should raise concern.

  - **Assess potential replicas of legitimate behavior:** Consider automated processes or scheduled tasks that may trigger application updates. Ensure these are documented and approved changes rather than unexpected alterations.

  - **Validate with recent system configuration changes:** Review recent administrative actions via the Okta audit logs for accompanying changes that may align with the detected application modifications or deletions.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical applications and services that could be rendered inoperative. The likelihood of malicious abuse is moderate, especially if administrative credentials are compromised. Although somewhat common, such behaviors may also reflect legitimate administrative maintenance.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate administrative actions can trigger this alert, leading to false positives. Reliable detection requires comprehensive logging configurations to capture all application changes effectively. Additionally, automated tools or scheduled maintenance may produce similar log entries. Companion detections, such as monitoring for unusual user access patterns or failed authentication attempts, help strengthen overall security posture.

