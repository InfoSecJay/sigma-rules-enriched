  ---

  ### Technical Context

  This detection rule identifies modifications or deletions of applications within the Okta identity management platform. Such changes could indicate unauthorized attempts to disrupt services, manipulate access policies, or even disable security features to aid in lateral movement within the environment. The primary MITRE ATT&CK tactic is **Impact (T1499)**, with related techniques such as **Application Layer Denial of Service (T1499.001)** being relevant to this behavior. Primary telemetry sources consist of Okta System Log entries, focusing on event types indicating lifecycle changes for applications.

  If such modifications or deletions are executed maliciously, they could compromise the availability and integrity of identity and access management. However, this detection does NOT prove that malicious intent is behind the changes; benign administrative activity may also trigger these events.

  ---

  ### Investigation Steps

  - **Check Okta System Logs for Application Lifecycle Events:** Review the logs specifically for Event Types "application.lifecycle.update" and "application.lifecycle.delete" to identify all modifications or deletions with timestamps and user context.

  - **Identify Responsible Users:** Look for the `initiator` field in the log entries to determine who made the changes. Ensure the user has appropriate administrative privileges; legitimate cloud admin or security personnel should appear regularly.

  - **Review Recent Changes for Anomalies:** Evaluate the field data in logs for the specific applications affected, focusing on unusual modifications (e.g., critical application settings, new redirect URIs) or unexpected deletions, which may indicate a malicious act.

  - **Verify Application Usage Patterns:** Assess the log entries for normal application usage trends to contextualize the changes. For instance, applications frequently accessed by authorized users around regular work hours indicate expected behavior, while changes at unconventional times could signal malicious activity.

  - **Monitor for Related API Calls:** If a modification or deletion is detected, cross-reference with Okta API usage logs to check for any preceding lateral navigation events leading to the application changes that indicate potential exploitation attempts.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact of unauthorized changes to applications within Okta, which could jeopardize access controls. The likelihood of malicious abuse is moderate, as targeted attacks often aim to alter authentication processes. While such actions are not the most common vector, their impacts can be severe.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential misconfigurations in Okta logging that could obscure certain application lifecycle actions. Notably, legitimate administrative actions taken during maintenance or approval workflows might trigger this alert, complicating attribution. Additionally, companion detections for suspicious user logins or privileged access changes strengthen coverage and context for this rule.

