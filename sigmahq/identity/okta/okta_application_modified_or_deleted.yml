note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of applications within Okta's environment. Such activity may indicate a malicious attempt to disrupt access controls or change application configurations to facilitate unauthorized access. The likely attacker objective could include executing privilege escalation or gaining persistent access by tampering with application settings that control user permissions.

  This detection aligns with MITRE ATT&CK tactics and techniques such as Impact (TA0040) and Data Manipulation (T1049). The primary telemetry source is Okta System Log with event types specifically targeting `application.lifecycle.update` and `application.lifecycle.delete`. The security impact can be significant, as unauthorized changes to applications could lead to unauthorized access to sensitive data. However, this detection alone does not confirm malicious intent, as legitimate administrators may modify or delete applications as part of regular maintenance.

  ### Investigation Steps

  - **Verify the identity of the user making changes**: Check the Okta System Log (Event Type: `system.log`) for details on the user who triggered the application modification or deletion, including fields like `actor` and `user.id`. Compare against documented changes from the IT department.

  - **Check application details before the change**: Review application configurations in the Okta Admin Console to determine the expected settings and accessibility before the modification or deletion occurred, referencing the `application` and `status` fields in the logs.

  - **Assess the timing of the event**: Identify if the modification or deletion coincided with any unusual user activity (e.g., failed logins, recent access by a new or unrecognized user). Cross-reference timestamps in the system logs along with Security Event ID 4624 for logins.

  - **Correlate other security events**: Look for related entries in the System Log around the same time as the modification/deletion that may indicate suspicious activity (e.g., changes to group memberships, new users added). Specific event IDs to consider include `application.access`, `system.session.start`, and `system.session.end`.

  - **Document communication with application stakeholders**: Validate whether the change was communicated with internal teams, by reviewing any change management tickets related to the affected application, which can provide context for the modification.

  - **Identify unintended service disruptions**: Investigate user reports of access issues to the affected applications following the change. Review help desk tickets alongside log entries where users may have been impacted by the modification or deletion.

  ### Prioritization

  This alert should be treated with medium severity due to its potential impact on access management and the likelihood of adversarial exploitation. While the behavior may sometimes be legitimate, unauthorized changes can lead to significant security vulnerabilities or operational disruptions, making it a common area of interest for attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive change control logging or if authorized changes occur without proper oversight. Misconfigured alerts might also result in false positives from legitimate admin actions around application management. Evasion techniques might include unauthorized updates done by legitimate users with compromised credentials. A companion detection is tracking failed authentication attempts to applications, which can help to provide context around any suspicious application modifications or deletions.

