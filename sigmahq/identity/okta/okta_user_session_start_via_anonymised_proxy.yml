note: |
  ### Technical Context

  This rule detects the initiation of a user session in Okta when the user is connected through an anonymizing proxy service. This behavior typically indicates an attempt to obscure the user's true identity or location, which may align with adversarial objectives such as credential theft, account compromise, or privilege escalation. The relevant MITRE ATT&CK tactic is "Defense Evasion" (ID: T1685), as the use of anonymizing proxies is a common method for attackers to mask their activity.

  The primary telemetry source for this detection is Okta System Log events, specifically those that show user session activities and their associated security context. If malicious, this behavior could indicate an unauthorized access attempt to sensitive applications or data. However, this detection alone does not confirm that malicious activity is occurring, as legitimate users could employ anonymizing proxies for valid reasons.

  ### Investigation Steps

  - **Review session details:** Examine the Okta system log for Event Type: `user.session.start` to capture both the user ID and the timestamp. Record the `securityContext.isProxy` field to confirm the use of an anonymizing proxy.

  - **Correlate additional user behavior:** Check for atypical login behavior related to the user account in question, such as failed login attempts or unusual IP address resolutions in prior sessions from Event Type: `user.login`.

  - **Identify legitimate use cases:** Determine if the user belongs to roles or departments that may have justifications for using anonymizing proxies. Cross-reference with known legitimate proxy usage to assess if this behavior aligns with expected patterns.

  - **Analyze geolocation data:** Validate if the associated IP address of the anonymizing proxy is from a known untrusted region. Investigate using WHOIS data and GeoIP lookups to identify flagrant mismatches in geographical context.

  - **Check for historical incidents:** Search historical Okta logs for past suspicious activity related to the same account or any related accounts. Look for any entries that indicate prior use of anonymizing proxies or other indicators of compromise.

  - **Assess potential lateral movement:** Investigate if any subsequent requests or session starts from the same user IP escalate to sensitive applications or data access that may indicate unauthorized lateral movement or privilege escalation.

  ### Prioritization

  This alert is high severity due to the sensitive nature of identity management and the potential threat posed by using anonymizing proxies for sessions. The likelihood of malicious abuse is significant, as this behavior could suggest attempts to evade detection during unauthorized access or credential exploitation. Such tactics are commonly weaponized by adversaries in real-world attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from legitimate users who genuinely require privacy for valid business purposes. Additionally, any misconfiguration in logging could lead to missed detections. Expected legitimate activities might include remote workers or roles within privacy-sensitive departments utilizing anonymizing services. A companion detection that strengthens coverage would be monitoring for anomalous location changes or frequent shifts in session origins which could pinpoint further risk indicators.

