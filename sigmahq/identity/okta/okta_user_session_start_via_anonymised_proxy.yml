note: |
  ### Technical Context

  This Sigma rule detects the initiation of a user session in Okta when the user is connected through an anonymizing proxy service. The likely attacker objective is to obscure their identity and location while accessing applications or data, which can facilitate unauthorized access or other malicious actions. This detection aligns with the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and specifically targets the technique **Indicator Removal on Host** (T1562.006).

  The primary telemetry source is Okta system logs, specifically logs related to user session events. If malicious, this behavior could indicate an attempt to exploit credentials or access sensitive information while attempting to avoid detection. However, this detection does NOT confirm malicious intent on its own, as legitimate users might also use anonymizing proxies for valid reasons.

  ---

  ### Investigation Steps

  - **Review user session details:** Check Okta Event Type `user.session.start` entries (Event ID 0) for the user’s IP address, geographical origin, and timestamp. Compare against known user behavior for anomalies.

  - **Verify proxy use:** Analyze the `securitycontext.isproxy` field in the event log. True values may indicate use of an anonymizing proxy but should be validated against the user's expected network environment.

  - **Investigate authorization status:** Look for any `user.authentication` events in Okta logs (Event ID 0) associated with this session to ensure the user was correctly authenticated prior to session initiation.

  - **Assess historical behavior:** Use telemetry from prior sessions of the user to build a baseline. If previous sessions are typically initiated from non-proxy sources, this may indicate an anomaly worthy of further investigation.

  - **Correlate with other security alerts:** Check if the same user triggered other suspicious events, such as failed login attempts or suspicious application access. Cross-reference with security alerts for related behaviors.

  - **Identify legitimate use cases:** Document possible justifications for using an anonymizing proxy, such as privacy concerns or access from a highly secure network. Investigate any external factors or policies that might support justified use.

  ---

  ### Prioritization

  This alert is rated high due to the potential risk of an unauthorized user attempting to access sensitive enterprise applications while obscuring their identity. The likelihood of exploitation is significant since anonymizing proxies are often used in malicious workflows. This behavior is a known tactic in many attack campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if not all proxy IP addresses are effectively categorized, leading to possible evasion. Deny-list configurations for known anonymizing proxies should be established in Okta for improved reliability. Legitimate activities that may trigger this alert include employees accessing company resources while traveling or using VPN services for security. A related detection could include failed authentication attempts following a session start to strengthen incident context.

