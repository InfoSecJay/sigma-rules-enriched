  ---

  ### Technical Context

  This rule detects modifications or deletions to application sign-on policies within Okta. Such actions typically aim to bypass security controls, gain unauthorized access, or manipulate authentication mechanisms to facilitate malicious activity. The relevant MITRE ATT&CK techniques include Persistence (T1543) and Credential Access (T1110), highlighting the potential for an attacker to modify access controls or exploit weak sign-on policies. Primary telemetry sources involve Okta system logs reflecting API calls related to sign-on policy changes, specifically event types for policy updates and deletions. If these actions are malicious, they could indicate potential unauthorized access to critical applications, leading to security breaches. However, this detection does NOT confirm that the changes were executed by a malicious actor, as legitimate administrative changes may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review the event type:** Check Okta system logs for `application.policy.sign_on.update` or `application.policy.sign_on.rule.delete` (Event Type) to confirm the nature of the change and identify the user responsible.

  - **Examine user context:** Investigate the user account performing the action (Okta fields: `actor.login`, `actor.displayName`). Look for accounts with elevated privileges that may indicate administrative misuse vs. low-privilege accounts that may signal credential compromise.

  - **Check timestamps:** Compare the timestamps of the sign-on policy changes against known maintenance windows or user activity (Okta fields: `publishedAt`). Legitimate modifications typically occur during scheduled administrative activities.

  - **Look for related activities:** Search for other recent API events surrounding the log entries in the Okta system logs, such as multiple failed login attempts (Event Type: `user.authentication.sso.failed`), which may suggest a targeted attack or brute force attempt.

  - **Contextualize the application:** Identify the applications affected by the modified or deleted sign-on policies (Okta fields: `target.id` and `target.displayName`). Evaluate their criticality within your organization, as changes may have broader impact based on application sensitivity.

  - **Corroborate file changes, if applicable:** If there are file integrations with automated processes impacting the applications (API calls), confirm that no unauthorized configurations were saved or executed that could exfiltrate information or pose a security risk.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact on credential access and application security. The likelihood of malicious abuse is moderate, given that attackers often target authentication structures. While these actions could be part of routine administrative tasks, changes to sign-on policies should be closely monitored due to the risks posed to sensitive applications.

  ---

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative changes if proper logging and access controls are not enforced. There is a possibility of evasion via shared accounts or compromised admin credentials, which can mask malintent. Legitimate activities such as routine updates during maintenance may also trigger this alert. Related detections include tracking authentication failures and unusual user behavior, which can provide additional context and strengthen coverage against potential attacks.

