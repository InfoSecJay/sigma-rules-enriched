note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions of application sign-on policies within Okta, which can indicate an attempt to manipulate access controls. The likely attacker objective is to bypass security measures and gain unauthorized access to applications by altering how users authenticate. This behavior can fit into the MITRE ATT&CK tactics of **Impact (T1499)** and **Credential Access (T1078)**, as compromising authentication methods directly affects the integrity of access control.

  The primary telemetry source comes from the Okta system logs, specifically event types related to application policy changes. If the changes are malicious, the security impact includes potential unauthorized access to sensitive applications, leading to data breaches or system compromise. This detection does NOT confirm that unauthorized access has occurred; it only indicates a configuration change that may warrant further investigation.

  ### Investigation Steps

  - **Check event details for policy changes:** Review Okta system logs for Event Type `application.policy.sign_on.update` and `application.policy.sign_on.rule.delete`. Note the timestamps and user accounts involved. Verify if the changes align with known administrative workflows.

  - **Identify user roles for policy modification:** Determine if the user who made the modification holds an appropriate administrative role within Okta (e.g., Super Admin). Legitimate workflows should involve authorized personnel following change management processes.

  - **Review related application sign-on settings:** Examine the specific applications affected by the policy modifications. Look for any discrepancies that might indicate a deviation from normal application access requirements.

  - **Correlate with other security events:** Cross-reference the logs with related security events, such as failed login attempts (Event ID: 400), to identify unusual patterns or multiple failed attempts indicating exploitation attempts.

  - **Assess timing of changes:** Investigate the timing of events surrounding the policy modification or deletion logs. Look for anomalies that coincide with other suspicious activity (e.g., IP ranges, unusual access times).

  ### Prioritization

  This alert has medium severity due to its potential impact on high-value applications and the likelihood that attackers may exploit application sign-on policies. While not all changes indicate malice, unauthorized modifications are a recognized tactic by adversaries aiming for credential access.

  ### Blind Spots and Assumptions

  Detection limitations include situations where legitimate changes are made by authorized users during maintenance activities. The accuracy of detection relies heavily on proper logging configurations within Okta; ensure comprehensive logging is enabled. Legitimate activities that might trigger this alert include scheduled updates or policy shifts authorized by administrative personnel. Companion detections, such as monitoring for unusual login attempts following policy changes, can enhance visibility into potential unauthorized access.

