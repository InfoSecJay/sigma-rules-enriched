note: |
  ### Technical Context
  This detection rule identifies modifications or deletions of application Sign-on Policies within the Okta identity management platform. Such actions may indicate malicious activity by an attacker seeking to undermine security controls, enabling unauthorized access to applications or sensitive information. Modifying or deleting these policies can lead to broader exploitation, especially if attackers aim to bypass multi-factor authentication (MFA) or alter access restrictions.

  In the context of a typical threat scenario, an attacker could be attempting to leverage compromised credentials to manipulate application access and increase their foothold within the organization. This aligns with the MITRE ATT&CK tactics of **Initial Access** (T1078: Valid Accounts) and **Impact** (T1499: Endpoint Denial of Service), where the manipulation of identity and access controls can significantly disrupt organizational operations and compromise data integrity.

  The primary data source for this detection is Okta's system logs, specifically logs related to application event types that document changes to Sign-on Policies. Monitoring these logs allows security teams to catch any unauthorized policy alterations that may signal potential insider threats or externally orchestrated attacks.

  ### Investigation Steps
  - **Review Okta System Logs**: Examine the specific logs for entries corresponding to the altered application Sign-on Policies, focusing on `application.policy.sign_on.update` and `application.policy.sign_on.rule.delete` events.
  - **Correlate User Activity**: Verify which user accounts initiated these policy changes. Investigate the account's history for any suspicious behavior or prior alerts related to unauthorized access.
  - **Check for Related Access Requests**: Analyze application access logs around the time of the policy changes. Look for unusual authentication patterns or access attempts that may coincide with the modifications.
  - **Assess Impact on Application Security**: Determine what applications were affected by the policy changes and evaluate the potential security implications, such as the ability to bypass MFA or access sensitive resources.

  ### Prioritization
  This alert is categorized as medium severity due to the significant impact that unauthorized modifications to Sign-on Policies can have on security controls and the organization’s overall risk posture. Given the potential for data loss or unauthorized access, timely investigation and response are critical.

  ### Blind Spots and Assumptions
  One possible gap in detection coverage is the reliance solely on Okta logs, as attackers with sufficient privileges may alter logs to conceal their actions. The detection logic assumes that all policy modifications are intentional or authorized, which may not always hold true, especially in environments with multiple administrators. Additionally, the Okta logging configuration must be appropriately set to capture these events, which is critical for the effectiveness of this alert. Ensuring that relevant event type logs are retained and analyzed can mitigate potential blind spots.

