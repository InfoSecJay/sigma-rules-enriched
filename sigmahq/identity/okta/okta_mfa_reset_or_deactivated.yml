note: |
  ### Technical Context
  This rule detects attempts to deactivate or reset multi-factor authentication (MFA) settings in Okta, potentially indicating a compromised session or an insider threat. Attackers may pursue this objective to facilitate unauthorized access to corporate resources by disabling additional layers of security, thereby simplifying their access to sensitive information or systems. Such actions may be part of broader tactics aimed at account compromise and persistence within the target environment.

  Relevant MITRE ATT&CK tactics include **Persistence** (TA0003), **Credential Access** (TA0006), and **Defense Evasion** (TA0005), with the specific technique of **Multi-Factor Authentication Interception** (T1556.006). The activation or modification of MFA settings can signal an ongoing attack, particularly if no legitimate change request was initiated by an authorized user.

  The primary data source for this detection comes from **Okta system logs**, which track event types and provide details about changes made to user MFA factors. These logs are crucial for understanding the context around authentication activities and can help analysts identify suspicious behavior.

  ### Investigation Steps
  - **Review Okta System Logs**: Check the relevant event types (`user.mfa.factor.deactivate` and `user.mfa.factor.reset_all`) to confirm the actions and the users involved. Look for abnormalities such as changes made outside of regular business hours or by accounts that typically do not perform such actions.
  - **Verify User Identity and Authorization**: Cross-reference the logs with user activity and administrative privileges to ensure that the requested actions align with expected user behavior and permissions. Investigate whether the user has a known history of MFA adjustments.
  - **Analyze Related Authentication Events**: Examine correlated authentication events surrounding the MFA changes. Look for signs of account compromise, such as unusual login locations, failed authentication attempts, or concurrent logins from different geolocations.
  - **Inspect User Event Patterns**: Conduct a historical analysis of the user’s account for previous MFA modifications, login attempts, or behavioral anomalies. This will help contextualize whether the reset or deactivation is part of a pattern of suspicious activity.

  ### Prioritization
  The severity of this alert is medium due to the significant impact potential associated with unauthorized access that could arise from disabling MFA. Given that MFA serves as a critical layer of security in protecting user accounts, any unauthorized changes warrant a prompt investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if alerting is solely dependent on logged events from Okta, as legitimate MFA resets by administrators can also trigger the rule, leading to false positives. It assumes that all attempts to deactivate or reset MFA without proper context or justification are malicious. For the alert to function effectively, logging configurations must ensure that both successful and failed MFA-related events are captured in the Okta system logs.

