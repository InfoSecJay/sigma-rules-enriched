note: |
  ### Technical Context

  This rule detects attempts to deactivate or reset Multi-Factor Authentication (MFA) factors for user accounts in Okta. An attacker could aim to undermine account security, potentially leading to unauthorized access or account takeover. This behavior aligns with the MITRE ATT&CK techniques related to account manipulation, specifically T1556.006 (Compromise of a User’s Credentials).

  The primary telemetry source is the Okta system logs, specifically events related to MFA management. If successful and malicious, this action can significantly increase the risk of unauthorized access and data breaches. It’s important to note that this detection does NOT confirm malicious intent by itself, as legitimate system administrators may also perform MFA resets or deactivations.

  ### Investigation Steps

  - **Review MFA reset or deactivation event details:** Check the Okta system log for `eventType` values `user.mfa.factor.deactivate` or `user.mfa.factor.reset_all`. Look for user identifiers and timestamps to correlate these events with potential incidents.

  - **Identify the actor behind the event:** Analyze the `actor` field in the Okta event logs to determine the source IP address and whether the action was performed by an administrator or an unauthorized user. Legitimate administrator actions often come from known internal IP addresses.

  - **Assess user account activity around the event:** Examine user login history within the Okta logs for the account in question, focusing on any sign-ins immediately before the MFA reset or deactivation (Event ID can include `user.session.start`). This helps evaluate whether the user was compromised.

  - **Check for prior suspicious behavior:** Look for other potentially malicious events tied to the same user, such as failed login attempts or unusual account activity (e.g., too many password changes). This behavior can imply a compromised account.

  - **Validate the legitimacy of the MFA change:** Cross-reference the event with expected behavior by confirming if a legitimate MFA reset was communicated to the user or recorded through IT service management processes. Confirming user awareness can indicate authenticity.

  ### Prioritization

  The severity of this alert is medium due to potential impacts on sensitive accounts, especially those with elevated privileges. The likelihood of abuse is moderate; while not all MFA resets indicate malicious intent, they are commonly targeted by attackers to gain access.

  ### Blind Spots and Assumptions

  This detection may miss legitimate MFA changes performed by authorized personnel, requiring clear records of administrative actions. Additionally, attackers may use methods to bypass MFA altogether instead of attempting deactivation. Ensure that logging configuration includes detailed Okta system logs for comprehensive visibility. A related detection to consider is monitoring for unauthorized access to administrative accounts, as this can further indicate compromised credentials.

