note: |
  ### Technical Context

  This rule detects attempts to deactivate or reset Multi-Factor Authentication (MFA) factors within Okta, which could indicate unauthorized access or credential manipulation by an attacker. The attackers' objective typically involves attempting to bypass security measures to gain unfettered access to accounts or systems, which aligns with the MITRE ATT&CK tactic of Persistence and the technique ID TA0003, specifically T1556.006 (Modify Authentication Process).

  Primary telemetry sources for this rule include Okta system logs, particularly the event types related to MFA operations. If a malicious actor successfully deactivates or resets MFA, they could gain access to sensitive systems and data, significantly increasing the risk of unauthorized actions within the organization. It is important to note that this detection does NOT confirm that the attempted deactivation or reset was successful, nor does it confirm that a compromise occurred without further context.

  ### Investigation Steps

  - **Review MFA Reset/Deactivation Logs:** Retrieve Okta system logs (API event types: `user.mfa.factor.deactivate`, `user.mfa.factor.reset_all`). Identify the user account involved and timestamp of the event, focusing on unusual occurrence times or patterns.

  - **Analyze User Account Activity:** Look at the authentication logs for the affected account (Event IDs related to user logins). Confirm if the account has recent logins from suspicious IP addresses or locations inconsistent with normal behavior.

  - **Correlate with Administrative Actions:** Validate if the MFA change was initiated by a legitimate user or system administrator. Check the role of the user and log their recent activities to see if they correspond with policy allowances (i.e., administrative tasks without unusual assertions).

  - **Identify Malicious Indicators:** Look for repeated MFA resets or deactivations from the same source (i.e., IP or user agent). Multiple attempts within a short time frame may signify a brute-force or social engineering attempt.

  - **Evaluate Potential Benign Activity:** Confirm if legitimate users have requested MFA resets for account recovery purposes. Cross-reference help desk tickets or user submissions that may correlate with the timeframe of the alert.

  ### Prioritization

  The alert is of medium severity due to the potential impact of unauthorized account access enabled by disabling MFA. While legitimate administrative actions can occur, the likelihood of this behavior being exploited by adversaries makes it a notable concern, especially when scrutinized in conjunction with other suspicious account activities.

  ### Blind Spots and Assumptions

  Detection may have limitations if logs are not configured to capture all MFA-related events or if users are utilizing methods to evade detection, such as legitimate-looking traffic. Legitimate administrators can trigger this alert during routine management tasks, potentially leading to false positives. Related detections to strengthen coverage include monitoring for account logins following MFA resets, especially those outside of standard business hours, to identify unauthorized access attempts directly following such actions.

