note: |
  ### Technical Context

  This rule detects attempts to deactivate or reset Multi-Factor Authentication (MFA) settings in Okta, which is often indicative of an adversary trying to undermine account security controls. The likely attacker objective is to gain unauthorized access to an account by removing an essential layer of security, thereby enabling them to perform subsequent actions undetected. This behavior is related to the MITRE ATT&CK technique "Account Manipulation" (T1556.006).

  The primary telemetry sources are Okta system logs associated with MFA events, specifically the log types for event types like `user.mfa.factor.deactivate` and `user.mfa.factor.reset_all`. If these actions are malicious, they could lead to account compromise and unauthorized access to sensitive assets or information. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can also trigger these events.

  ### Investigation Steps

  - **Identify the user context:** Examine the Okta system log for the `user.mfa.factor.deactivate` or `user.mfa.factor.reset_all` events (Event Type fields). Note the user identity and whether this aligns with expected administrative actions, such as a system administrator performing routine maintenance.

  - **Correlate with IP addresses:** Cross-reference the source IP of the event with known users and locations. Malicious attempts typically originate from unusual geographic locations or ranges not associated with the user.

  - **Check recent account activity:** Review logs for any suspicious account actions within the last 24 hours leading up to the event (e.g., logins from unknown devices or locations). Refer to the `user.session.start` events to identify anomalous logins.

  - **Review MFA status history:** Investigate if MFA was previously enabled for the user in question. Analyze the `user.mfa.factor.create` events for any changes in the MFA configuration.

  - **Evaluate administrative actions:** Confirm that the action was initiated by a legitimate administrator. Review admin activity logs for any related or recent changes made by this user, especially around MFA settings, focusing on fields indicating user roles and timestamps.

  ### Prioritization

  The alert has medium severity based on the potential impact of the affected account's security and the likelihood that the detected behavior could be exploited for malicious purposes. Account manipulation, especially regarding MFA, is a common tactic utilized by adversaries to facilitate further attacks.

  ### Blind Spots and Assumptions

  This detection may miss legitimate MFA resets performed by authorized administrator accounts, potentially leading to false positives. Reliable detection requires comprehensive logging of all admin activities and user actions. Legitimate scenarios, such as an employee losing access to their MFA device, may occasionally trigger this alert. Companion detections, such as monitoring for suspicious logins following MFA changes, can enhance overall coverage and context around the detected activity.

