logsource:
  product: okta
  service: okta
detection:
  selection_event:
    eventType: 'policy.evaluate_sign_on'
    target.displayName: 'Okta Admin Console'
  selection_positive:
  - debugContext.debugData.behaviors|contains: 'POSITIVE'
  - debugContext.debugData.logOnlySecurityData|contains: 'POSITIVE'
  condition: all of selection_*
falsepositives:
- When an admin begins using the Admin Console and one of Okta's heuristics 
  incorrectly identifies the behavior as being unusual.
level: high
note: |
  ### Technical Context

  This Sigma rule detects new activities in the Okta Admin Console, specifically when Okta identifies behaviors that deviate from normal patterns, potentially indicating an unauthorized access attempt or privilege escalation. The likely attacker objective may include compromising administrative credentials to gain broader access to the enterprise environment. This detection aligns with the MITRE ATT&CK tactic of **Privilege Escalation** (TA0004) and the technique **Valid Accounts** (T1078.004).

  The primary telemetry source consists of Okta system logs, particularly focusing on event types related to sign-on policies and admin console behaviors. If the behavior is malicious, it could allow an attacker to manipulate user permissions or extract sensitive data. However, it's critical to note that this detection does NOT confirm unauthorized access on its own; further investigation is necessary to establish intent and identity.

  ### Investigation Steps

  - **Review relevant Okta system logs:** Check Event Type logs (e.g., policy.evaluate_sign_on) within `system.log` to locate the specific entries for the Admin Console activity. Look for entries with `debugContext.debugData.behaviors` containing 'POSITIVE'.

  - **Identify benign administrative activity:** Cross-reference timestamps with known administrative changes or support tasks performed by legitimate users. Document if activity correlates with scheduled maintenance or normal user behavior.

  - **Look for high-confidence malicious indicators:** Identify attempts to access the Admin Console from unusual IP addresses or in conjunction with other suspicious events, such as failed login attempts or rapid successive sign-on attempts. Look for events with field values indicating anomalous authentication locations.

  - **Correlate with user roles and permissions:** Validate the roles assigned to users triggering the alert. Ensure that users attempting access have the appropriate privileges for admin console actions, as unauthorized accounts can indicate compromise.

  - **Check for abnormal sign-on patterns:** Analyze sign-on event timestamps to detect patterns of activity outside of regular hours or increased access frequencies. Document any discrepancies between the user’s typical access patterns and recent behavior.

  ### Prioritization

  Given the elevated privileges associated with the admin console, unauthorized access attempts pose a high security risk. The likelihood of malicious abuse is significant, especially if accounts have been compromised. Moreover, activity targeting the admin console is commonly weaponized due to the sensitive nature of administrative functionalities.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives resulting from legitimate administrative activities mistakenly identified as suspicious by Okta heuristics. Proper log source configuration, including detailed system log entries, is essential for reliable detection. Legitimate users may trigger alerts through performative administrative tasks. A related detection to consider is monitoring for unusual login patterns in conjunction with IP geolocation analysis, which could strengthen security coverage against unauthorized access attempts.

