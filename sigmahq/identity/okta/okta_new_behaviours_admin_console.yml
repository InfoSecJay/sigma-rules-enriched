title: Okta New Admin Console Behaviours
id: a0b38b70-3cb5-484b-a4eb-c4d8e7bcc0a9
status: test
description: Detects when Okta identifies new activity in the Admin Console.
references:
- https://developer.okta.com/docs/reference/api/system-log/
- https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection
author: kelnage
date: 2023-09-07
modified: 2024-06-26
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.t1078.004
logsource:
  product: okta
  service: okta
detection:
  selection_event:
    eventtype: 'policy.evaluate_sign_on'
    target.displayname: 'Okta Admin Console'
  selection_positive:
  - debugcontext.debugdata.behaviors|contains: 'POSITIVE'
  - debugcontext.debugdata.logonlysecuritydata|contains: 'POSITIVE'
  condition: all of selection_*
falsepositives:
- When an admin begins using the Admin Console and one of Okta's heuristics incorrectly
  identifies the behavior as being unusual.
level: high
note: |
  ### Technical Context
  This detection rule monitors for abnormal activities identified by Okta in the Admin Console, specifically focusing on instances that show new or unusual behavior. The primary threat scenario involves an attacker potentially leveraging administrative access to manipulate settings, extract sensitive information, or execute unwanted changes within the organization's Okta environment. Given that the administrative console can significantly impact an organization's security posture, monitoring these activities is crucial for identifying unauthorized or malicious actions.

  In terms of the MITRE ATT&CK framework, this detection corresponds to tactics such as Privilege Escalation (TA0004) and Persistence (TA0003) and the technique T1078.004, which pertains to valid accounts being used by attackers after gaining access. This detection can help in identifying early stages of attacks or lateral movements, thereby enhancing overall security.

  The most relevant data sources for this detection include Okta system log events, specifically those related to the Admin Console activities. These logs provide insights into who accessed the console and what actions were performed, allowing for thorough investigations into potentially malicious behaviors.

  ### Investigation Steps
  - **Review Okta System Logs:** Collect and analyze system logs from Okta focusing on events related to the Admin Console. Identify any unusual IP addresses or timings that deviate from normal admin activity.

  - **Cross-Reference Administrative Actions:** Match any detected 'positive' behaviors with the typical actions performed by administrators. Confirm legitimacy by checking against previous logs to identify expected patterns.

  - **Investigate User Account Activity:** Evaluate the activities of user accounts that triggered the alert. Pay special attention to any changes in roles or permissions that could indicate unauthorized privilege escalation.

  - **Monitor External Access Patterns:** Assess if the behaviors coincide with access attempts from external sources or accounts that exhibit signs of compromise. Utilize VPN and proxy logs to identify unusual access patterns.

  ### Prioritization
  This alert is rated high severity as it addresses potential unauthorized administrative actions that can lead to critical changes to security configurations, data leakage, or further compromise within the network.

  ### Blind Spots and Assumptions
  The detection logic might miss certain legitimate administrative actions if the heuristics used by Okta inaccurately recognize normal behavior as unusual. Additionally, there may be gaps in visibility if not all Okta logs are collected or retained, particularly logs beyond the scope of admin console activities. This requires proper configurations in the Okta logging settings to ensure comprehensive coverage for effective monitoring.

