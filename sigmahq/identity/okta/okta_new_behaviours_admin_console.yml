title: Okta New Admin Console Behaviours
id: a0b38b70-3cb5-484b-a4eb-c4d8e7bcc0a9
status: test
description: Detects when Okta identifies new activity in the Admin Console.
references:
- https://developer.okta.com/docs/reference/api/system-log/
- https://sec.okta.com/articles/2023/08/cross-tenant-impersonation-prevention-and-detection
author: kelnage
date: 2023-09-07
modified: 2026-04-27
tags:
- attack.privilege-escalation
- attack.persistence
- attack.initial-access
- attack.stealth
- attack.t1078.004
logsource:
  product: okta
  service: okta
detection:
  selection_event:
    eventType: 'policy.evaluate_sign_on'
    target.displayName: 'Okta Admin Console'
  selection_positive:
  - debugContext.debugData.behaviors|contains: 'POSITIVE'
  - debugContext.debugData.logOnlySecurityData|contains: 'POSITIVE'
  condition: all of selection_*
falsepositives:
- When an admin begins using the Admin Console and one of Okta's heuristics 
  incorrectly identifies the behavior as being unusual.
level: high
note: |
  ### Technical Context

  This Sigma rule detects unusual patterns of activity within the Okta Admin Console, particularly when Okta identifies a new behavior classified as "POSITIVE" in its logging and debugging data. The likely objective of an attacker triggering this alert is to gain unauthorized administrative access or to implement changes that could facilitate lateral movement or persistence within the environment. The relevant MITRE ATT&CK tactics and techniques are Privilege Escalation (T1068) and Credential Access (T1078.004).

  The primary telemetry source for this detection is the Okta System Log, specifically monitoring events related to admin console access. If malicious, this behavior could indicate unauthorized access attempts or potential privilege escalation by a compromised account. However, this detection does NOT confirm that malicious activity has occurred; false positives may arise from legitimate administrative actions erroneously flagged by Okta heuristics.

  ### Investigation Steps

  - **Examine the User Account Activity:** Review User ID and IP address linked with the activity in the Okta System Log (Event Type: `policy.evaluate_sign_on`). Look for any accounts not typically associated with admin console usage.

  - **Verify Recent Changes in Admin Permissions:** Investigate any recent modifications to user roles or permissions that could allow elevation of privileges. Look for logs detailing role changes (e.g., Event Type: `user.assign_role`).

  - **Check Contextual Details Around the Alert:** Analyze debugContext fields like `debugContext.debugData.behaviors` and `debugContext.debugData.logOnlySecurityData` in the logs to understand the decision-making context. Confirm if the "POSITIVE" identification correlates with any known legitimate administrative tasks or if it appears anomalous.

  - **Establish Baseline for Legitimate Admin Activity:** Identify typical administrative console activity within your organization by reviewing normal admin login patterns and configuration changes over a specified timeframe. Compare these patterns to the alerting activity.

  - **Monitor for Anomalous Patterns Post-Alert:** After verifying the immediate alert, observe for any subsequent unauthorized access attempts or abnormal behavior within the same user account or from the same IP address.

  - **Cross-reference with Other Security Alerts:** Correlate this activity with other alerts such as unusual login attempts or geolocation changes (Event Type: `user.session.start`) to gauge a broader context of potential compromise.

  ### Prioritization

  The alert severity is high due to the potential for significant impact if an attacker compromises administrative access. The likelihood of malicious abuse is elevated given the extensive privileges associated with the Admin Console. Such behaviors are not only concerning but are often weaponized in targeted attacks, making rapid investigation critical.

  ### Blind Spots and Assumptions

  This detection may have limitations if the log sources are not configured to capture all relevant events or if Okta's heuristics misidentify the behavior. Legitimate activities such as scheduled administrative tasks may trigger the alert. Additionally, companion detection rules focusing on failed admin access attempts or unusual IP address logins can provide enhanced coverage and context for investigations.

