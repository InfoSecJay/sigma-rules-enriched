logsource:
  product: okta
  service: okta
detection:
  selection_event:
    eventtype: 'policy.evaluate_sign_on'
    target.displayname: 'Okta Admin Console'
  selection_positive:
  - debugcontext.debugdata.behaviors|contains: 'POSITIVE'
  - debugcontext.debugdata.logonlysecuritydata|contains: 'POSITIVE'
  condition: all of selection_*
falsepositives:
- When an admin begins using the Admin Console and one of Okta's heuristics 
  incorrectly identifies the behavior as being unusual.
level: high
note: |
  ### Technical Context

  This rule detects anomalous activities within the Okta Admin Console, specifically identifying when Okta evaluates a sign-on policy that results in a 'POSITIVE' behavior. An adversary may attempt to abuse administrative privileges or impersonate a legitimate admin to gain access, compromising the integrity of the account management system. The relevant MITRE ATT&CK tactic and technique include Privilege Escalation (TA0004) and Account Manipulation (T1078.004). The primary telemetry source comprises Okta system logs, focusing on event type `policy.evaluate_sign_on`. If malicious, this behavior could lead to unauthorized access to sensitive user data or administrative functions. However, this detection does NOT confirm that the action was malicious, as legitimate administrative activities could trigger it.

  ### Investigation Steps

  - **Review triggered events:** Examine Okta system logs for Event Type `policy.evaluate_sign_on`, focusing on entries with `debugcontext.debugdata.behaviors` and `debugcontext.debugdata.logonlysecuritydata` containing 'POSITIVE'.

  - **Validate admin role:** Cross-reference the user account triggering this event against the list of authorized admin users to confirm their legitimacy. Look for Event ID showing user roles.

  - **Check timestamps and frequency:** Analyze the frequency of the triggered events within relevant time frames to see if this behavior is isolated or part of a series of unusual activities. Excessive or rapid events may indicate automation or abuse.

  - **Identify previous legitimate access:** Confirm if the admin account has recently logged normal activities in the Admin Console, such as user updates or policy adjustments, helping distinguish between legitimate behavior and potential abuse.

  - **Rectify shared credentials:** Investigate potential credential sharing or misuse by correlating the admin activity with logins from unusual IP addresses or devices not typically associated with that user.

  - **Examine related security events:** Look for accompanying security events or alerts, such as account lockouts or failed login attempts, as these can indicate attempts to exploit admin access and may complement findings from this detection.

  ### Prioritization

  The alert severity is high due to the potential impact on sensitive systems being managed through the Okta Admin Console. The likelihood of malicious activity is significant, particularly in environments where impersonation of admin rights could lead to widespread unauthorized access. This behavior is a vector often weaponized by attackers seeking to exploit administrative capabilities.

  ### Blind Spots and Assumptions

  There are limitations in detecting sophisticated evasion techniques where attackers simulate legitimate administrative actions, which can lead to false positives. Reliable detection requires adequate logging configuration in Okta to capture all necessary telemetry. Legitimate activities, such as routine policy updates or system checks by authorized admins, may also trigger this alert. A related detection to consider is monitoring for abnormal login patterns from admin accounts, as this would strengthen coverage and provide context to potential unauthorized access.

