note: |
  ### Technical Context

  This Sigma rule detects the creation of a new user account within Okta's identity management system, specifically capturing events categorized as `user.lifecycle.create`. The likely attacker objective is to gain unauthorized access to systems and services by provisioning new accounts for exploitation. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and technique T1078 (Valid Accounts). The primary telemetry sources include Okta's system logs, particularly focusing on event types related to user lifecycle changes. If malicious, this could lead to unauthorized system access, potential data breaches, or lateral movement within the environment. Importantly, this detection does NOT confirm malicious intent by itself, as user accounts may be created through legitimate administrative actions.

  ### Investigation Steps

  - **Review user creation details**: Check Okta logs for Event Type `user.lifecycle.create` (log type: Okta System Log). Investigate created user attributes (username, email, attributes) to verify legitimacy against the user's profile in Active Directory or other HR systems.

  - **Examine account permission levels**: Identify the default roles or permissions assigned to the newly created user and validate against organizational policies to ensure compliance. Unusual permissions or administrative access given to the account may indicate potential malicious activity.

  - **Cross-reference with recent administrative activities**: Look for recent administrative log events (Event Type `user.lifecycle.create` may be near `user.lifecycle.activate`) to determine if there were legitimate administrative actions taken prior, such as an HR request or bulk user creation for onboarding.

  - **Monitor subsequent login attempts**: Query authentication logs for any subsequent login attempts using the newly created account (Event Type: `user.session.start`). Multiple failed logins could indicate an unauthorized actor testing account access.

  - **Identify associated IP addresses**: Analyze the source IPs from which the user creation event initiated. Check if they match known corporate networks or VPNs (Audit Log: IP Address field). Unauthorized or external IPs could indicate potential credential abuse.

  ### Prioritization

  This alert is of moderate severity due to the potential impact of unauthorized user creation on sensitive environments. If leveraged successfully, malicious actors could utilize these accounts to access critical systems. While new account creation is a common administrative task, such events should always be closely monitored for anomalies.

  ### Blind Spots and Assumptions

  This detection may miss activities if logging is not appropriately configured to capture all relevant user lifecycle events. Legitimate activities that may trigger this alert include bulk user creation by HR or IT teams during onboarding processes. To strengthen detection coverage, consider integrating user activity monitoring or account takeover detection systems that can complement alerting for suspicious account usage.

