note: |
  ### Technical Context
  This detection rule identifies the creation of new user accounts within the Okta identity management system. Monitoring for new user account creation is critical because cyber attackers often seek to establish unauthorized access points, which can facilitate later stages of their attack, including lateral movement and privilege escalation. By capturing instances of new user accounts being created, security teams can proactively monitor for suspicious activity that may indicate compromise or abuse of legitimate credentials.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Credential Access (TA0006)**: This tactic involves the acquisition of user credentials, which can be exploited by malicious actors to gain unauthorized access.
  - **Persistence (TA0003)**: New user accounts can be a method for attackers to ensure continued access to the network, often masquerading as legitimate users.

  Primary data sources for this alert are Okta event logs, specifically those related to user lifecycle events, which provide insight into user account management activities.

  ### Investigation Steps
  - **Review User Creation Logs**: Check Okta event logs for `user.lifecycle.create` entries and correlate them with the timing and context of other significant events, like logins from unusual locations or devices.
  - **Analyze User Role and Permissions**: Investigate the role and permissions assigned to the newly created account. Ensure that they align with the organization’s policy for user provisioning and access rights, particularly for sensitive resources.
  - **Correlate with Other Security Events**: Look for any corresponding security alerts in your SIEM, such as multiple failed login attempts, suspicious token usage, or unusual authentication methods, that might indicate a compromised system heralding the new account creation.
  - **Validate User Creation Authorization**: Confirm whether the user account was created legitimately. This may involve cross-referencing with internal change management systems or contacting the respective department for verification.

  ### Prioritization
  This alert is classified as informational, but in an enterprise environment, newly created user accounts, especially unexpected or unauthorized ones, could indicate potential security risks. As such, they warrant further investigation to determine if there is an underlying threat.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if Okta event logs are not properly monitored or if the integration with your SIEM is misconfigured. The detection logic assumes that all legitimate account creations are documented and authorized; however, coordinated attacks may simulate legitimate user activity. Additionally, required logs for this alert include comprehensive access event logging from Okta, which must be enabled for effective monitoring of user lifecycle events.

