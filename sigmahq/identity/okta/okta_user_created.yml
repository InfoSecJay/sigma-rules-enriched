note: |
  ### Technical Context

  This rule detects the creation of new user accounts in Okta, specifically through the event type "user.lifecycle.create." An attacker may aim to create unauthorized user accounts to gain access to sensitive resources or escalate privileges within the environment. The relevant MITRE ATT&CK tactic is Credential Access, with the technique being "Account Manipulation" (T1098). The primary telemetry source is Okta logs, particularly those capturing user event types. If this behavior is malicious, it could allow an adversary to impersonate a legitimate user, posing a significant security risk. This detection does NOT confirm whether the account creation is legitimate or unauthorized without further context.

  ### Investigation Steps

  - **Review user creation details:** Check Okta logs for Event Type `user.lifecycle.create`. Look for fields such as `actor`, `target`, and `eventTime` to identify who initiated the action and which account was created.

  - **Analyze actor identity:** Determine if the actor initiating the user account creation is a known administrator or if it originates from an unusual or unauthorized IP address. Focus on any anomalies in `ipAddress` or `userAgent` fields.

  - **Identify legitimate user creation:** Validate if the created account aligns with ongoing employee onboarding processes. Compare the `target` user with a list of expected new hires or service accounts to distinguish benign activity.

  - **Monitor for rapid account creation:** Check for multiple `user.lifecycle.create` events in a short timeframe. Rapid account creation could indicate a malicious attempt to establish a foothold. Look for Event ID groupings that occur within a few minutes.

  - **Confirm account activity:** Review subsequent actions taken by the newly created user accounts, such as logins or group memberships, by analyzing the session history in Okta. Investigate actions reflected in log types such as `user.session.start` to assess account utilization.

  ### Prioritization

  The alert is of low severity in an enterprise context due to its informational nature. However, if linked with suspicious or rapid account creations, it may indicate potential malicious activity aimed at exploiting vulnerabilities within the identity management process.

  ### Blind Spots and Assumptions

  This detection does not account for legitimate, authorized user account creation, which may frequently occur during onboarding. Evasion techniques may include using a legitimate administrator’s account to create users, making it harder to identify malicious intent. Ensure Okta logging is configured to capture necessary event types comprehensively. A companion detection to consider is monitoring failed login attempts from newly created accounts, which may indicate an unauthorized access attempt.

