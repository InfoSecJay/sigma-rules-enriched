  ### Technical Context

  This Sigma rule detects when Okta FastPass identifies and prevents a known phishing site during user authentication attempts. The likely attacker objective is to capture user credentials through fraudulent means, leveraging misleading interfaces to deceive users. This detection may relate to the MITRE ATT&CK framework, specifically under the Initial Access tactic and Phishing technique (T1566). The primary telemetry source is the Okta system logs, specifically focusing on event types related to user authentication. If malicious, this detection indicates an active attempt to breach user accounts via phishing methods. However, it does not confirm that a user’s credentials have been compromised, only that a phishing attempt was blocked.

  ### Investigation Steps

  - **Review log entries for blocked phishing attempts:** Check Okta system logs (Event Type: user.authentication.auth_via_mfa). Look for entries where `outcome.reason` is 'FastPass declined phishing attempt' and `outcome.result` is FAILURE.

  - **Examine the sources involved in the phishing attempt:** Identify the IP addresses or domains associated with the failed authentication. Filter for known malicious indicators by cross-referencing with threat intelligence feeds.

  - **Identify user contextual data:** Verify if the alert corresponds to sensitive accounts. Check if the impacted users had recent activity before the blocked attempt, which may indicate targeted phishing.

  - **Evaluate legitimate user behavior:** Consider regular patterns of access for the affected users. Frequent access to external sites or rapid changes in authentication methods may signal benign, albeit unusual, but legitimate activities.

  - **Assess any follow-on alerts or activities:** Look for corresponding alerts in phishing detection tools or other security solutions, which may indicate escalating brazen attempts against the organization.

  ### Prioritization

  This alert is of high severity due to its direct correlation with credential theft attempts against potentially sensitive user accounts. The likelihood of malicious abuse is significant, as phishing is a commonly weaponized tactic. Effective detection indicates proactive security measures, which could prevent serious data breaches.

  ### Blind Spots and Assumptions

  Detection may have limitations if attackers employ sophisticated domain spoofing techniques or if legitimate entities inadvertently access phishing sites parallel to their authentication attempts. Reliable detection relies on active monitoring of Okta logs, necessitating proper configuration of API event logging. Legitimate activities, such as remote work or sudden changes in user access patterns, can trigger the alert. A related detection to enhance coverage would be monitoring for suspicious authentication requests leading to successful logins outside of expected patterns.

