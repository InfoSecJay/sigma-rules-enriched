note: |
  ### Technical Context
  This rule detects instances where Okta FastPass successfully blocks attempts to authenticate via a known phishing site. When an attacker tries to exploit stolen credentials through phishing, their access can be thwarted by security measures like Okta FastPass. The objective of the attacker in this scenario is to gain unauthorized access to user accounts and sensitive information, which can lead to data breaches, lateral movement within an organization, or further credential theft.

  The relevant MITRE ATT&CK tactics are **Initial Access** and **Phishing** (T1566), as this detection directly relates to attempts to gain access via deceptive means. This alert focuses specifically on the lifecycle of malicious login attempts and the response from an identity management system. Key telemetry sources include Okta's system logs, which provide detailed information about authentication attempts, their outcomes, and relevant event types.

  ### Investigation Steps
  - **Review Okta System Logs**: Investigate recent authentication attempts in Okta logs to identify patterns or repeated attempts from specific IP addresses or to specific user accounts related to phishing activities.
  - **Analyze Event Types**: Focus on event types `user.authentication.auth_via_mfa`, filtering for cases where the outcome is “FastPass declined phishing attempt”. Cross-reference these with any known phishing URL databases to confirm the legitimacy of the blocks.
  - **Monitor User Behavior**: Check for any unusual activity from user accounts after the blocked attempts, such as failed login attempts, password changes, or simultaneous logins from different locations.
  - **Follow-Up with Users**: Communicate with affected users to confirm whether they received any phishing attempts and advise on phishing awareness and reporting mechanisms.

  ### Prioritization
  Given the potential for compromised credentials leading to greater security incidents, alerts triggered by this rule should be treated as high priority in an enterprise environment. Prompt investigation is crucial to mitigating unauthorized access risks.

  ### Blind Spots and Assumptions
  This detection logic may not capture all phishing attempts, as it is dependent on Okta's ability to recognize and categorize known phishing sites accurately. The detection relies on the proper configuration of logging and an up-to-date repository of phishing URLs. If Okta’s FastPass does not effectively identify a fishing site or if the site is new or unrecognized, the detection would not trigger an alert. Additionally, false negatives could occur if users bypass FastPass through other means or evade detection altogether.

