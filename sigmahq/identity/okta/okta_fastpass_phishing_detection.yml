  ---

  ### Technical Context

  This detection identifies attempts to authenticate against Okta using FastPass from sources recognized as phishing sites. It indicates a potential initial access attempt by an adversary trying to bypass authentication mechanisms. The likely attacker objective is to gain access to a victim's account by using stolen credentials obtained from a phishing site. This behavior correlates with the MITRE ATT&CK tactic of Initial Access (TA0001) and the specific technique of Phishing (T1566).

  Primary telemetry sources include Okta system logs, particularly focusing on the `user.authentication.auth_via_mfa` event type. If this behavior is malicious, it can lead to unauthorized access to corporate resources, data breaches, or further lateral movement within the network. However, this detection does NOT confirm that an account was compromised; it only indicates an authentication attempt from a flagged phishing attempt.

  ---

  ### Investigation Steps

  - **Review Okta logs for event specifics:** Check Okta system logs for `eventtype: user.authentication.auth_via_mfa` with outcome `reason: 'FastPass declined phishing attempt'`. This indicates a blocked authentication attempt.

  - **Analyze the timestamp and source IP:** Compare the event timestamps with the entity's known legitimate activity. Ensure the source IP is flagged in threat intelligence databases.

  - **Identify legitimate user behavior:** Validate recent user activities through the Okta admin dashboard, looking for patterns that show acceptable logins from recognized or expected locations vs. the flagged phishing IP.

  - **Correlate with other security telemetry:** Integrate data from endpoint protection platforms or firewalls to check if there are any alerts related to the originating IP or domain being utilized in known phishing campaigns.

  - **Verify MFA settings for the user:** Assess the Multi-Factor Authentication settings for the user in Okta to ensure they match organizational policy. Any deviations might indicate a potential compromise.

  - **Document findings for further investigation:** If multiple alerts surface from the same user or similar sources, escalate for deeper investigation into potential phishing activity or credential compromise incidents.

  ---

  ### Prioritization

  This alert has high severity as it involves possible credential theft which can lead to unauthorized access to systems. The likelihood of malicious abuse is significant due to the nature of phishing being a common attack vector aimed at enterprise organizations. This behavior is frequently weaponized in attacks targeting environment vulnerabilities.

  ---

  ### Blind Spots and Assumptions

  The primary limitation is the potential for noise from legitimate user actions, such as authorized access attempts from less common locations. Reliable detection also depends on comprehensive logging configurations within Okta, ensuring all authentication events are captured accurately. Legitimate users may inadvertently trigger alerts if they attempt access from a new location or device. Related detections may include monitoring for multiple authentication failures across user accounts which can also indicate phishing attempts.

