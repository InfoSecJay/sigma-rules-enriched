note: |
  ### Technical Context

  This rule detects attempts to access Okta-protected resources via known phishing sites that are blocked by Okta FastPass. An attacker using phishing techniques aims to obtain user credentials or gain unauthorized access to sensitive information. The relevant MITRE ATT&CK tactic is "Initial Access" and the technique is "Phishing" (T1566). The primary telemetry source is Okta logs, specifically focusing on authentication events related to multi-factor authentication (MFA) attempts.

  If an attacker is successful in exploiting phishing, they may gain unauthorized access to user accounts, leading to potential data breaches. Importantly, this detection does NOT confirm that a compromise has occurred; it only indicates a failed attempt against a known phishing site.

  ### Investigation Steps

  - **Review authentication logs**: Check Okta's system log for Event Type `user.authentication.auth_via_mfa` with fields including `outcome.reason` and `outcome.result`. A reason of 'FastPass declined phishing attempt' indicates a security measure that blocked a credential request.

  - **Validate legitimate access attempts**: Identify expected user behavior by reviewing the user’s recent login patterns in Okta. Look for logins from recognized geographic locations and device fingerprints that match previous sessions.

  - **Correlate with phishing intel**: Use threat intelligence feeds to compare the phishing site’s URL captured in the logs against a known list of malevolent domains. A match may indicate a high-risk scenario.

  - **Investigate user account activity**: Check for anomalous behaviors, such as unusual account lockouts or changes in device registration for the affected user within the last 30 days, tracking Event IDs 202 and 203 in Okta logs.

  - **Collect supplemental data**: If the alert is tied to a specific IP address, check firewall logs for any other access attempts from that address. Look for indicators such as failed authentication attempts logged at Event IDs 403 and 401.

  - **Assess asset risk**: Determine whether the affected account has elevated privileges or access to sensitive resources, if applicable. Higher risk accounts may warrant immediate user and asset monitoring.

  ### Prioritization

  This alert carries a high severity level due to the potential impact on account compromise and data breach scenarios. Given that phishing is a commonly exploited attack vector, the likelihood of malicious abuse is significant, necessitating timely analyst review.

  ### Blind Spots and Assumptions

  This detection may have limitations in identifying novel phishing sites that are not yet included in the blocked list. Log retention policies must be configured to ensure comprehensive access to user authentication logs and that FastPass measures are properly implemented in Okta. Valid user behavior could occasionally trigger this alert, particularly during legitimate 2FA events involving unusual or new devices. A related detection could include monitoring for new user registrations or authentications to new locations, further strengthening coverage against potential phishing attacks.

