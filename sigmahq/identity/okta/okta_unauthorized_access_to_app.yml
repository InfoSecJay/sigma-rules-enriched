  ### Technical Context

  This rule detects unauthorized access attempts to applications within the Okta identity management platform. The likely objective of an attacker could be to gain unauthorized entry to resources, which may lead to data breaches or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic: **Credential Access (TA0006)** and technique: **Brute Force (T1110)**.

  The primary telemetry source for this detection is Okta system logs, specifically entries that contain the event type that indicates unauthorized access attempts to applications. The security impact of such activities could be significant, including potential exposure of sensitive data and compromise of user accounts. It is important to note that this detection does NOT confirm whether the unauthorized access attempt was ultimately successful or if an attack is ongoing.

  ### Investigation Steps

  - **Review Okta system logs for unauthorized access attempts:** Filter logs by the event type that includes "User attempted unauthorized access to app" within the last 24 hours. Look for occurrences of this event, particularly noting repeated attempts by a single user or various users targeting the same application.

  - **Examine user context related to the alert:** Collect attributes from the Okta user profiles (API: /users) with user identifiers associated with the unauthorized access attempts. Note legitimate users who typically should have access and compare against any concurrent unauthorized attempts by those users or unknown accounts.

  - **Check for authorized access attempts:** Identify whether any legitimate users have made unsuccessful login attempts in conjunction with the unauthorized access logs. This could indicate user misconfiguration or password issues rather than a malicious attack.

  - **Investigate geographic login locations:** Analyze the IP addresses associated with the unauthorized access attempts using fields within the Okta logs. Determine if the attempted logins are coming from common locations relative to the users' typical access points (e.g., corporate VPN vs. unknown geographical locations).

  - **Confirm high-risk applications involved:** Identify applications under investigation and consider their sensitivity. For instance, unauthorized access attempts to financial or HR applications should escalate priority for further investigation versus less critical systems.

  ### Prioritization

  This alert is considered medium severity due to the implications of unauthorized access attempts on potentially sensitive applications. The likelihood of malicious abuse is moderate, especially if there are patterns of repeated attempts from the same source. However, the risk of these types of actions being part of normal user behavior, such as misconfiguration or confusion regarding access rights, could lead to false positives.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as the use of legitimate credentials obtained from phishing attempts, which may not trigger the rule. Reliable detection requires adequate configurations of Okta logging to capture detailed event types. Legitimate activities that may cause this alert include users mistakenly attempting to access applications outside their permissions due to a lack of awareness. A related detection that strengthens coverage is monitoring for multiple failed login events leading to potential account lockouts, which can indicate brute-force attack attempts.

