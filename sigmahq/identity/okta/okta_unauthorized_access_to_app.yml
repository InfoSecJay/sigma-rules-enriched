  ---

  ### Technical Context

  This Sigma rule detects attempts at unauthorized access to applications via the Okta identity platform, specifically identifying logs indicating that a user has attempted to access an application without valid credentials or without being assigned the appropriate permissions. The likely attacker objective is to gain unauthorized access to sensitive resources, which can facilitate data exfiltration or other malicious actions aligned with the exploitation of compromised credentials or social engineering. This behavior relates to the MITRE ATT&CK Technique: **Initial Access** (TA0001) and **Exploitation of Credential Access** (T1078).

  Primary telemetry sources include Okta system logs, specifically focusing on the event types that denote unauthorized access attempts. If malicious, this activity can lead to significant security impacts, including unauthorized data exposure or resource manipulation. However, this detection does NOT confirm successful access or exploitation; it only identifies attempts that are outside the user's permissions.

  ---

  ### Investigation Steps

  - **Identify the user in question**: Check the specific log entry for the `actor` or `user` fields in the Okta System Log (Event Types) to ascertain which user is associated with the unauthorized access attempt. Cross-reference against user roles to determine baseline access.

  - **Review application permissions**: Investigate the permissions associated with the targeted application by checking the `app` field in the logs. Validate whether the user should have had access to the application based on their assigned roles or groups.

  - **Analyze temporal patterns**: Look at the `timestamp` field within the Okta logs to determine if the unauthorized access attempts coincide with known business hours or user activity patterns. Legitimate access attempts should align with expected user behavior.

  - **Identify high-confidence malicious indicators**: Check for multiple attempts from the same user or originating IP address, as indicated by multiple log entries with the display message "User attempted unauthorized access to app." This signals a potential brute-force attack or an attacker's tool in use.

  - **Monitor for similar events**: Review other closely related alerting events or patterns, such as failed login attempt logs (e.g., Event Type: `user.session.evaluation.error`), to identify if this behavior is part of a larger exploitation attempt.

  ---

  ### Prioritization

  The alert is of medium severity as it pertains to attempts on critical applications, indicating possible credential misuse. While unauthorized access attempts are commonly attempted, the real risk is contingent on the application and the sensitivity of the data at stake. This behavior is frequently exploited in various attack scenarios, underscoring the need for prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if not all relevant Okta logs are retained or if log retention policies do not cover the necessary timeframe. Legitimate scenarios, such as users mistyping their credentials or unapproved access requests, could trigger this alert. A companion detection to consider is monitoring for user behavior anomalies, such as unusual login locations or times, which can enhance the context of this alert and provide further insight into potential threats.

