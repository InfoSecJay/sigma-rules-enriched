note: |
  ### Technical Context

  This rule detects unauthorized access attempts to applications within Okta, specifically when a user is denied access due to insufficient permissions. The likely attacker objective is to gain unauthorized access to sensitive applications, potentially leading to data exposure or manipulation. This behavior is associated with the MITRE ATT&CK tactic of **Credential Access** (TA0006) and the technique of **Brute Force** (T1110). The primary telemetry sources for this detection are Okta System Logs, focusing on Event Types related to access attempts and the associated display messages. If malicious, this behavior could facilitate unauthorized information access, compromise sensitive data, or establish a foothold within the environment. However, the detection does NOT confirm that unauthorized access was successful or provide context about the attacker's identity.

  ### Investigation Steps

  - **Review access logs for the event:** Examine Okta System Logs (Event Type: `user.session.login.failed`) within a specific timeframe related to the alert for additional context, noting timestamps and affected users.

  - **Correlate user roles and permissions:** Verify the affected user's role within Okta to determine if they were legitimately intended to access the application. Look for any recent changes to their permissions or group memberships that could explain the alert.

  - **Analyze failed login attempts:** Identify patterns of failed login attempts for the user, focusing on Event IDs associated with access issues. Document occurrences of repeated attempts that align with known attack patterns like brute force.

  - **Identify legitimate access patterns:** Determine if there are scheduled tasks or automated workflows tied to the application's resource that might cause legitimate access attempts—check for known system accounts or service accounts interacting with the app.

  - **Extract context from associated notifications:** Check for related notifications or alerts in Okta that may provide insight into the incident. This includes reviewing any system alerts or administrative modifications made just before the unauthorized access attempt.

  - **Assess neighboring security controls:** Evaluate other security mechanisms, such as multi-factor authentication (MFA) status. Confirm if MFA was bypassed or disabled for the user during the attempted access (correlate to the MFA logs).

  ### Prioritization

  The alert should be treated with medium severity due to the potential risk associated with unauthorized access to applications that may hold sensitive data. The likelihood of malicious abuse is moderate, especially if the behavior aligns with ongoing credential-based attacks, which are commonly weaponized in the threat landscape.

  ### Blind Spots and Assumptions

  Detection limits include the possibility of legitimate users mistakenly attempting access to applications they believe they have permission for, leading to potential false positives. It is important that Okta logs for unauthorized access attempts are consistently enabled and monitored; without proper logging of user access attempts, detection efficacy diminishes. Additionally, legitimate operations such as automated testing or misconfigured applications might trigger this alert. A related detection could include monitoring for **repeated successful logins after a series of failed attempts**, which could indicate a user successfully guessed credentials after earlier unauthorized tries.

