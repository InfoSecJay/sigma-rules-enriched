note: |
  ### Technical Context

  This rule detects access to Okta admin functions when routed through a proxy. The behavior indicates that an unauthorized user might be attempting to perform administrative actions that could lead to elevated access or data exfiltration. The likely attacker objective is to manipulate user roles, access sensitive data, or compromise authentication systems.

  Relevant MITRE ATT&CK tactics include **Credential Access** and specifically the technique **Exploitation for Credential Access (T1212)**. The primary telemetry sources are Okta logs, specifically those providing security context related to admin function access and proxy usage. If malicious, this behavior could allow an attacker to gain unauthorized control over user accounts, posing significant risk to the integrity of user data and security configurations. This detection does NOT confirm that the individual accessing these functions is malicious without additional context.

  ### Investigation Steps

  - **Examine Okta Admin Access Logs:** Review Okta logs for Event Type `admin.access` related to the user account involved. Look for any unusual timing or patterns inconsistent with typical administrative access.

  - **Identify Proxy Usage:** Confirm that the `securityContext.isProxy` field is set to `true` in the detected events. Legitimate administrator access typically does not route through a proxy.

  - **Review Request URIs:** Inspect the `debugContext.debugData.requestUri` field for URIs containing `admin`. Look for legitimate admin activities, such as routine modifications or scheduled maintenance tasks.

  - **Cross-Reference User Behavior:** Correlate the user account to other telemetry sources, such as endpoint logs (Event ID 4624) for user login times and hosts to determine normal activity patterns.

  - **Check for Unusual User Roles:** Verify whether the user account is associated with a standard or elevated role. A typical legitimate admin should have a role consistent with routine administrative operations, not unusual privileges.

  - **Assess for Malicious Indicators:** Look for signs of abuse such as concurrent logins from multiple locations or repeated access attempts outside of business hours. Any high volume of admin functions accessed through a proxy should raise suspicion.

  ### Prioritization

  This alert carries a medium severity rating due to the potential for serious security breaches if unauthorized access is confirmed. The likelihood of malicious abuse is moderate, particularly if the proxy access is uncharacteristic for the user. This behavior is increasingly weaponized in attacks targeting cloud identity and access management systems.

  ### Blind Spots and Assumptions

  Potential evasion techniques include using legitimate administrative credentials to mask malicious activities or tunneling through trusted proxies. Reliable detection requires thorough logging configurations in Okta, including updates to security context settings. Legitimate administrative actions performed through a proxy may trigger false positives. Companion detections, such as monitoring for unusual authentication patterns (e.g., multiple failed login attempts), would strengthen overall security posture and increase detection accuracy.

