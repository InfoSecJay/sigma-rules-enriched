  ### Technical Context

  This rule detects the creation of a new admin role assignment within Okta, identified by the event type `iam.resourceset.bindings.add`. The likely attacker objective may involve privilege escalation to gain elevated access rights for data exfiltration or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (TA0003) and the technique of **User Account Control** (T1078).

  The primary telemetry source for this detection is the Okta System Log, specifically the logs that capture IAM resource assignments. If the event is malicious, it could allow an adversary to maintain access to sensitive systems and data. It is important to note that while this detection raises an alert, it does NOT confirm malicious intent on its own, as legitimate administrative actions may also trigger this alert.

  ---

  ### Investigation Steps

  - **Check for legitimate changes: ** Review recent admin role assignments using Okta System Log (event type: `iam.resourceset.bindings.add`). Confirm if the change corresponds to a scheduled task or planned administrative activity.

  - **Identify high-confidence indicators: ** Cross-reference the event details with user behavioral analytics. Look for unusual timing or accounts that typically do not modify roles under normal circumstances.

  - **Analyze affected user roles: ** Investigate which users received new admin roles and assess their prior activity. Typical benign indicators include user accounts actively involved in administrative tasks.

  - **Review multi-factor authentication: ** Check if MFA (Multi-Factor Authentication) was used during role assignment via System Log events. Lack of MFA may indicate compromised credentials.

  - **Look for anomalies: ** Scrutinize other simultaneous events in the Okta log that may suggest orchestration, such as multiple role changes or failed login attempts, which could indicate malicious activity.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential impact of unauthorized privilege escalation on critical systems. The likelihood of abuse is moderate, as this technique is commonly weaponized by adversaries for persistence. Prompt investigation is essential to prevent exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative actions, which can trigger alerts without malicious intent. Ensure that Okta System Log is adequately configured to capture all relevant events related to user role assignments. Additionally, legitimate activity such as the onboarding of new users or lifecycle management processes may lead to this alert being triggered.

  Related detections, such as monitoring for unusual API usage patterns within Okta, can bolster coverage by linking potential nefarious actions with privilege escalations.

