note: |
  ### Technical Context
  This detection rule identifies the creation of new admin role assignments within Okta, which can indicate potential privilege escalation or unauthorized access within an organization's cloud environment. Attackers often aim to elevate their privileges or maintain persistence in compromised systems by assigning themselves administrative roles, thereby gaining extensive control over user accounts and cloud resources. Such activities can lead to data exfiltration, unauthorized changes, or lateral movement within the network.

  The relevant MITRE ATT&CK tactics associated with this activity include **Persistence** (TA0003), where attackers embed themselves within the environment, and **Privilege Escalation** (TA0004), as they seek to elevate their access rights. Specifically, the techniques could involve **Valid Accounts** (T1078), as attackers may manipulate role assignments to exploit legitimate access methods.

  Primary data sources for monitoring these activities involve Okta system logs, particularly focusing on event types related to role assignments and IAM changes. Security operations teams should ensure they have robust visibility into these logs to detect and respond to suspicious role changes effectively.

  ### Investigation Steps
  - **Review Okta Event Logs**: Examine the Okta system logs to identify the specific event type `iam.resourceset.bindings.add` and analyze the context of the role assignment, focusing on who initiated the change and if it aligns with typical user behavior.

  - **Correlate with User Activity**: Cross-reference the timestamp of the role assignment with user activity logs to assess whether the individual making the change had legitimate reasons for elevating privileges, ensuring that their recent actions do not raise any flags.

  - **Evaluate Role Assignment Patterns**: Investigate the frequency and pattern of role assignments within the organization to identify any anomalies, particularly unusual assignments to sensitive admin roles or unusual times when these changes were made.

  - **Analyze Affected User Accounts**: Identify all user accounts affected by the new role assignment and assess their recent activities and access logs for signs of malicious intent or misuse of privileged access.

  ### Prioritization
  The severity of this alert is considered medium in an enterprise environment due to the potential impact of unauthorized administrative access. If attackers successfully assign themselves high-level roles, they could cause significant harm, leading to data breaches or service disruptions.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments where Okta logs are not centralized or where system configuration lacks sufficient logging settings. The detection logic assumes that role assignments can only be carried out by recognized users, meaning any undetected rogue accounts or API misuse could bypass this alert. For effective detection, it is essential to have complete and accurate logging from Okta and to ensure that any changes to role assignments are closely monitored and examined in the context of overall user behavior.

