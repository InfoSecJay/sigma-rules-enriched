note: |
  ### Technical Context

  The rule detects the creation of a new admin role assignment within Okta, which may indicate unauthorized privilege escalation or an attempt to establish persistence by an attacker. This behavior is typically part of the initial access and persistence stages of the attack lifecycle, where adversaries gain elevated privileges to maintain long-term access to compromised environments. The detection relates to the MITRE ATT&CK frameworks, specifically Tactic: Persistence, Technique: Valid Accounts (T1078).

  The primary telemetry source is Okta's system log, specifically looking for the event type `iam.resourceset.bindings.add`. If this action is determined to be malicious, it may lead to unauthorized access to sensitive systems and data. Importantly, this detection alone does not confirm malicious intent, as legitimate admin role assignments can occur in a standard operational context.

  ### Investigation Steps

  - **Examine event logs for admin role assignments:** Review Okta system logs for the event type `iam.resourceset.bindings.add` around the time the alert was triggered. Identify the user ID and the role assigned. Legitimate activities may include scheduled role updates by IT personnel, typically occurring during regular maintenance windows.

  - **Verify user behavior and context:** Check the user's previous activity in Okta for a pattern of behavior. Assess their recent login attempts or API usages (e.g., Event IDs related to user activities such as `user.login`). Unusual behaviors like logins from non-standard locations are indicative of potential compromise.

  - **Assess role assignment relevance:** Determine the newly assigned admin role's permissions. Cross-reference with organizational policies to ensure the assigned permissions align with company practices and user needs. Unauthorized or elevated permissions without proper justification might indicate malicious activity.

  - **Follow-up on unusual timing:** Look for any configurations for the timing of role changes. Role assignments that occur outside of normal business hours or during off-peak times may signify an attempt to evade detection.

  - **Review related API interactions:** Investigate API activity around the given timestamp using Okta API logs. Look for anomalous calls such as `Iam.Permissions.Get` that might suggest an attacker was preparing to exploit newly acquired privileges.

  ### Prioritization

  This alert has medium severity due to the potential impact of compromised admin access within the Okta environment. Given that attackers often aim for privilege escalation as part of their workflow, the possibility of malicious abuse is plausible, especially in environments with critical assets and sensitive data.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of well-timed legitimate updates causing false positives, as authorized personnel may create new admin roles. Reliable detection hinges on comprehensive logging configurations within Okta and ensuring all necessary event types are captured. Additionally, common administrative activities, such as role updates during maintenance, may trigger this alert. For enhanced coverage, consider companion alerts for unusual login patterns (e.g., T1078 - Valid Accounts) to correlate with this administrative change.

