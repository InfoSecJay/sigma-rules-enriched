note: |
  ### Technical Context

  This Sigma rule detects the creation of a new admin role assignment in Okta, reflecting a potential privilege escalation or persistence technique. Attackers may leverage this behavior to gain higher access rights within an environment, facilitating further malicious activities. The relevant MITRE ATT&CK technique is **Privilege Escalation (Tactics: Persistence, Defense Evasion - T1068)**.

  The primary telemetry source is the Okta System Log, specifically looking for events of type `iam.resourceset.bindings.add`. If an unauthorized role assignment is confirmed, it can lead to unauthorized access to sensitive resources and actions within the organization. However, this detection does not confirm malicious intent on its own, as legit administrators may create or adjust role assignments for valid operational reasons.

  ### Investigation Steps

  - **Examine the event details:** Review Okta System Log entries for Event Type `iam.resourceset.bindings.add`. Check fields including `actor`, `target`, and `eventTime` for any suspicious alterations, especially if performed by a user not typically associated with administrative tasks.

  - **Correlate with user behavior:** Check the user’s historical activity to determine if the account has been involved in previous administrative changes or if the new assignment aligns with expected responsibilities.

  - **Identify legitimate role assignment patterns:** Validate if the new admin role was planned (e.g., scheduled during a staffing change). Document any evidence of pre-authorization for the role assignment, such as email confirmations or internal ticketing records.

  - **Look for other suspicious Okta events:** Investigate recent `iam.*` changes or unexpected logins following this event that may indicate malicious activity (e.g., Event Type `user.session.start` with unusual IP addresses).

  - **Validate audit trails:** Review associated audit logs for changes that precede the role assignment. Check for anomalies such as simultaneous changes across multiple admin accounts.

  ### Prioritization

  This alert should be considered medium severity given the inherent risk associated with admin role privileges. The likelihood of malicious abuse is moderate, especially if the environment indicates weak access controls or recent incidents of suspicious activity. Role escalations are a known tactic among threat actors seeking persistence.

  ### Blind Spots and Assumptions

  Detection is limited by the necessity for thorough logging and the potential for well-coordinated legitimate admin tasks that could mimic malicious action. False positives may arise from legitimate changes made for operational reasons. Adequate detection requires consistent monitoring of the Okta System Logs, and related detections could include monitoring for unusual login patterns or changes in user-access permissions to enhance situational awareness.

