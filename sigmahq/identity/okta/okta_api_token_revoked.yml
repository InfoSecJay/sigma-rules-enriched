  ### Technical Context

  This Sigma rule detects the revocation of API tokens within the Okta service. Such behavior is typically indicative of an admin's effort to mitigate unauthorized access, but it may also signal an active attack where an adversary has compromised user credentials and is attempting to disable access for legitimate users or escalate privileges. The relevant MITRE ATT&CK tactic is **Impact** (TA0034), with the technique being **Account Access Removal** (T1098).

  The primary telemetry sources for this detection are Okta system log events, specifically focusing on **eventType: system.api_token.revoke**. If malicious, this activity could lead to unauthorized privilege escalation or a denial of service for legitimate users. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrators may revoke tokens under routine security practices or when an account is suspected to be compromised.

  ### Investigation Steps

  - **Review API Token Activity**: Check Okta system logs for API token activities before and after the event ID for revocation (eventType: system.api_token.revoke). Identify if there were unusual token creations or user access patterns that led to this action.

  - **Assess User Context**: Validate the identity of the user who revoked the API token. Look for organizational roles in Okta logs (e.g., admin, app owner) to determine if the user had legitimate authority to perform this action.

  - **Identify Recent Authentication Events**: Review the authentication logs associated with the user in question. Focus on Event ID related to user logins (e.g., eventType: user.authentication.sso) around the same timeframe to identify any suspicious login patterns or geolocation anomalies.

  - **Check for Concurrent Revocation Actions**: Investigate if other API tokens were revoked simultaneously or in quick succession. Cross-reference with user behavior to identify potential malicious activity or signs of coordinated attacks.

  - **Identify Notable Changes to Admin Privileges**: Look for changes in permissions or roles around the time of the revocation event (eventType: user.profile.update). Legitimate privilege elevation or changes should correlate with the event; any discrepancies could indicate malicious behavior.

  ### Prioritization

  This alert has medium severity as it involves a sensitive action impacting user access privileges. The potential for malicious abuse exists, particularly if it is associated with unusual account activity or can lead to service disruption. This behavior can be weaponized, especially in scenarios involving compromised accounts.

  ### Blind Spots and Assumptions

  Detection may miss specific admin actions that intentionally revoke tokens without logging correctly if log settings are misconfigured. False positives may arise during routine security reviews. To strengthen coverage, complementary detections around account creation or deletion events may reveal context about token revocation actions.

