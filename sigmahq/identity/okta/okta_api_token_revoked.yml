note: |
  ### Technical Context

  This rule detects the revocation of an API token in Okta, which can indicate potential misuse or the need to enhance security following suspicious activities. Attackers might revoke API tokens to disrupt legitimate access while conducting their operations, or they may do so to cover their tracks after compromising a system. The relevant MITRE ATT&CK tactic is **Impact (TA0040)**, specifically the technique **Data Destruction (T1485)**.

  The primary telemetry source for this detection is the Okta System Log, which documents API token events among other security-related activities. If this action is malicious, it poses a significant security risk, as it may indicate an ongoing compromise or an attempt to disrupt legitimate workflows. However, this detection does not confirm that an unauthorized or malicious action occurred solely based on the revocation; further investigation is required to establish intent.

  ### Investigation Steps

  - **Check System Log for Revocation Details**: Access the Okta System Log, filter for `eventtype: system.api_token.revoke`. Examine the `actor` field for unexpected users and the `target` field for affected resources. Compare timestamps with user activity for anomalies.

  - **Identify Token Usage History**: Retrieve logs for the API token before its revocation. Use fields relating to `eventtype: system.api_token.create` or `system.api_token.use` to assess the token's activity history. High-frequency usage or access attempts from unusual locations can indicate malicious behavior.

  - **Review Recent User Behavior**: Investigate actions leading up to the revocation by checking for unusual login activity or multiple failed login attempts for the user associated with the revoked token. Notify any user account that shows an anomalous pattern as potential compromise.

  - **Assess Similar API Token Revocations**: Search for other recent token revocations that coincide with system-wide behavior changes, including changes to configurations or service disruptions. This can provide context for whether multiple tokens were revoked through phishing or credential theft.

  - **Correlate with Incident Response Actions**: If other events related to account takeover (like abnormal password changes or IP address changes) are noted around the same time, classify them as high-confidence indicators of user compromise.

  - **Monitor for Legitimate Token Administration Events**: Review administrative logs where tokens are managed or revoked intentionally for business purposes, using fields such as `eventtype: system.api_token.admin_revoke`. These may include routine revocations due to expired tokens or user role changes.

  ### Prioritization

  The alert severity is medium due to the implications of the affected system—the Okta identity provider is critical for user access to applications and data. The likelihood of malicious abuse is moderate since attackers often target identity management solutions to disrupt services or secure unauthorized access. Although revocation can occur legitimately, it is often associated with suspicious activities.

  ### Blind Spots and Assumptions

  Detection limitations include potential benign revocations by administrators that may generate false positives. Comprehensive log collection from Okta and relevant configurations are essential for reliable detection. Legitimate activities, such as routine token expiration or user-initiated revocations, may trigger this alert, complicating the investigation. Companion detections, such as monitoring for unauthorized access attempts (e.g., `system.api_token.use`), can help strengthen coverage by correlating related suspicious events.

