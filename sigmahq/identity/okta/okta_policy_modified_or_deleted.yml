note: |
  ### Technical Context
  This detection rule identifies events when an Okta policy is modified or deleted, highlighting potential unauthorized changes to key identity management configurations. The ability to alter authentication policies can significantly impact an organization's security posture, allowing attackers to bypass established access controls. The primary threat scenario involves an insider threat or an external actor who has gained unauthorized access to modify critical security settings to facilitate further exploitation within the environment.

  The relevant MITRE ATT&CK tactics for this detection include "Impact" (TA0001), as unauthorized modification or deletion of authentication policies can indicate malicious attempts to disrupt or manipulate access controls. Techniques that apply include "Data Manipulation" (T1565) and "Application Layer Protocol" misuse (T1071), as attackers may exploit legitimate tools to orchestrate unauthorized changes.

  The primary data source for this detection is the Okta system log, which contains detailed records of events specific to the lifecycle of policies. These logs provide insights into who modified or deleted policies, when they were changed, and the implications of such changes on overall security.

  ### Investigation Steps
  - **Review Okta System Logs**: Analyze recent entries in the Okta system log for events categorized as `policy.lifecycle.update` or `policy.lifecycle.delete`. Note the user identity, timestamps, and the specific policy that was altered or deleted.

  - **Validate User Context**: Confirm whether the individual responsible for the change is authorized to modify Okta policies. Investigate their user history and access privileges to identify any unusual patterns or unfamiliar accounts.

  - **Examine User Agent and Hostname**: Check the user agent strings and hostnames involved in the policy changes. Look for anomalies such as changes being made from unexpected locations or rare devices, which may indicate potential unauthorized access.

  - **Cross-Reference with Known Changes**: Determine if the policy changes align with any planned system maintenance or administrative activities. If pertinent, engage with system administration teams to validate any legitimate reasons for the updates.

  ### Prioritization
  This alert is considered of low severity due to the potential for benign reasons behind policy modifications by system administrators. However, unusual deletions or updates by unfamiliar users should still be treated with caution, given their potential to compromise the integrity of the environment.

  ### Blind Spots and Assumptions
  One gap in this detection logic is the possibility of legitimate changes being made by authorized personnel without proper logging due to inadequate auditing settings in Okta. The detection assumes that all policy modifications will be logged effectively and that logs are retained long enough for analysis. Additionally, organizations must ensure that their Okta logging configurations are set to capture all necessary events for proper detection. Without comprehensive log coverage, important events may go undetected, leading to potential threats bypassing this rule.

