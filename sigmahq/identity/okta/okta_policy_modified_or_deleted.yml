note: |
  ### Technical Context

  This Sigma rule detects changes to Okta policies, specifically when a policy is modified or deleted. Such alterations may be indicative of an attacker attempting to weaken security posture, gain unauthorized access, or disrupt normal operations. The relevant MITRE ATT&CK tactic is **Impact (TA0040)**, with specific techniques such as **Data Manipulation (T1565)**. The primary telemetry source comes from Okta's system logs that include events related to policy lifecycle updates and deletions. If malicious, the impact could be significant, potentially allowing unauthorized access or privilege escalation for adversaries. Notably, this detection does NOT confirm malicious intent on its own; it cannot distinguish between legitimate administrative changes and potentially harmful actions.

  ### Investigation Steps

  - **Review the event details**: Examine the logged events for `eventType` values of `policy.lifecycle.update` and `policy.lifecycle.delete` in Okta system logs to confirm the action taken.

  - **Identify the user performing the action**: Investigate the `actor` field in the log to determine the user associated with the change. If the user is an expected administrator, note their typical behavior and login patterns.

  - **Check for abnormal user agents**: Look at the `userAgent` field for the changes. If the agent does not match those typically used by known administrators, this may indicate potentially malicious activity.

  - **Assess the timing of the changes**: Compare the timestamps of the policy modifications or deletions against user activity within the environment. Anomalous timings or out-of-hours changes may require further investigation.

  - **Evaluate for multiple policy changes**: If multiple policies are modified or deleted in rapid succession from a single user, this could indicate malicious intent and should be escalated.

  - **Verify legitimate change requests**: Discuss with the operations team to confirm if the detected changes align with any scheduled maintenance or known administrative tasks. Document these communications for context during the investigation.

  ### Prioritization

  This alert is of **low severity**, given that Okta policy changes can be part of regular administrative actions. However, the potential for abuse, particularly if done by unauthorized users, elevates its importance. Unmonitored changes could lead to significant security vulnerabilities, making it essential to maintain oversight on policy management.

  ### Blind Spots and Assumptions

  The detection may miss legitimate modifications by trusted system administrators, particularly if their behaviors evolve or change. Reliable alerting requires comprehensive setup of Okta logging configurations. Importantly, actions by privileged accounts are not inherently malicious; therefore, contextual assessment is critical. A related detection to consider is monitoring for unusual login behavior or access patterns from the same actor, which could uncover a broader compromise.

