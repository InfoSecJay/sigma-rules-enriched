note: |
  ### Technical Context

  This Sigma rule detects modifications or deletions to Okta policies, which govern access control and authentication behavior across applications and users. The likely attacker objective is to manipulate these policies to bypass security controls, gain unauthorized access, or facilitate further malicious actions within the environment. This behavior aligns with the MITRE ATT&CK tactic "Impact" and technique "Account Manipulation" (T1098). The primary telemetry sources for this detection are Okta system logs, specifically focused on event types that indicate policy changes (e.g., `policy.lifecycle.update` and `policy.lifecycle.delete`). If malicious, such actions could compromise user access controls or diminish the organization's security posture. Importantly, this detection does not confirm malicious intent by itself; legitimate policy changes performed by authorized administrators can also trigger this rule.

  ### Investigation Steps

  - **Identify the user making the change**: Review the Okta system log entries for the eventType of `policy.lifecycle.update` or `policy.lifecycle.delete`. Look for fields such as `actor.id` and `actor.type` to determine who initiated the action. Verify if the user has administrative rights or if it appears to be unusual for the user role.

  - **Examine the timing of the change**: Compare the timestamps of the policy modifications or deletions. Investigate any changes made outside of normal business hours (e.g., midnight to 6 AM in your local timezone) to identify potentially suspicious activity.

  - **Assess the policy details**: Cross-reference the affected policy against known procedures. Check if the modifications align with legitimate activities, such as scheduled policy reviews or updates, or if they exhibit atypical patterns (e.g., removing security requirements or access restrictions).

  - **Review user agent and source host**: Analyze the `userAgent` and `source` hostname from the Okta events. Determine if the origin matches known administrative environments or is coming from an unexpected or suspicious IP address.

  - **Look for multiple changes in a short period**: Indicator of likely abuse: review event logs for multiple modifications or deletions within a short time frame (e.g., several events within a 5-minute window), indicating potential malicious intent, especially from non-typical actors.

  - **Identify IAM user roles and history**: Determine if the user modifying the policy has a history of legitimate administrative changes. Check the `actor.type` to spot if it’s a service account or an individual. Legitimate users with a history of policy management may indicate benign intent, while unfamiliar users may require further investigation.

  ### Prioritization

  This alert has low severity in the context of well-controlled environments but can be critical if unauthorized personnel are modifying access controls or security settings. The likelihood of exploitation increases if abnormal patterns are identified, especially when coupled with adversary techniques that leverage administrative privileges.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion through legitimate administrator actions that are misattributed to malicious intent. Approval workflows or controls might be absent, allowing unmonitored policy changes. Additionally, changes made by privileged users during routine maintenance may trigger alerts. Companion detections could include monitoring successful authentications for admins making changes or unusual logins following policy modifications to better contextualize risk.

