note: |
  ### Technical Context

  This rule detects successful multi-factor authentication (MFA) attempts that use bypass codes in Cisco Duo. Bypass codes are temporary passcodes generated by administrators, primarily intended for users facing issues with their primary authentication devices. The attacker objective behind exploiting bypass codes could be to gain unauthorized access to protected resources, particularly if they have compromised a user account. This activity maps to the MITRE ATT&CK framework under the tactics of "Credential Access" (TA0006) and "Initial Access" (TA0001), specifically the technique "Valid Accounts" (T1078).

  The primary telemetry source for this detection is Cisco Duo Logs, particularly events related to successful authentications with the reason field indicating "bypass_user." If an unauthorized individual successfully authenticates using a bypass code, it can lead to significant security risks, including data breaches or system compromise. However, this detection does NOT inherently prove malicious intent; it may represent legitimate access attempts by authorized users who followed the proper procedures.

  ### Investigation Steps

  - **Review authentication logs for the user:** Check Cisco Duo logs (Event Type: authentication) for the specific username and confirm the use of a bypass code (reason: bypass_user). Note the timestamps and compare them against expected access times for the user.

  - **Correlate with user activities:** Determine if the user has reported any issues with their primary authentication device around the time of access. If there are legitimate reasons for using a bypass code, such as known device malfunctions, this may indicate benign behavior.

  - **Check for unusual geographic access:** Identify the IP address and location of the access (Cisco Duo logs should include IP information). Validate if the login attempt originated from an unusual or unexpected geographic location compared to the user’s historical access patterns.

  - **Assess for multiple attempts:** Look for a series of MFA bypass attempts in a short timeframe for the same user (Cisco Duo logs may display consecutive authentications). A high number of bypass code uses may indicate an attempts to exploit the access method, and the corresponding timestamps should be closely examined.

  - **Identify any additional account compromise indicators:** Inspect related logs for signs of previous authentication failures or suspicious account activities (e.g., unusually reset password requests). Check Windows Security Event ID 4625 for failed login attempts, which may correlate with successful bypass code usage.

  ### Prioritization

  Alerts regarding successful MFA authentications via bypass codes should be treated with medium severity. While a successful bypass can indicate legitimate remote access challenges faced by users, it can also signify potential account compromise. Given that bypass codes are a known method to regain access without the primary device, they carry moderate risk that adversaries may exploit.

  ### Blind Spots and Assumptions

  This detection may have limitations if logs are not consistently captured or if bypass codes are being utilized frequently for legitimate reasons. Assumptions to note include the requirement for accurate logging configuration in Cisco Duo to ensure complete data capture. Additionally, legitimate troubleshooting behaviors—such as user device issues leading to legitimate bypass code use—may trigger the alert. A companion detection to strengthen coverage is monitoring for account lockouts or failed authentication attempts, which can indicate potential preparation for credential theft or misuse.

