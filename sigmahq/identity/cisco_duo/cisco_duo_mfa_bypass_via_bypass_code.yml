note: |
  ### Technical Context
  This detection rule identifies instances of successful multi-factor authentication (MFA) in Cisco Duo that occur via the use of a bypass code. Bypass codes serve as temporary passcodes generated by administrators, enabling users to access Duo-protected applications when they encounter issues with their enrolled MFA devices. This scenario can present risk as attackers may exploit vulnerable accounts to gain unauthorized access, using bypass codes during their intrusion attempts.

  In an enterprise context, bypass codes can be utilized maliciously if attackers gain access to a user's account or if an administrator unintentionally provides bypass code access to a compromised account. The attacker’s objective might be to gain initial access to sensitive information or systems, thereby achieving further environmental compromise.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access**: T1078 - Valid Accounts
  - **Credential Access**: T1110 - Brute Force
  - **Defense Evasion**: T1203 - Exploit Public-Facing Application

  The primary data sources for investigating this detection include Cisco Duo authentication logs, which record details of authentication events, including those that highlight the use of bypass codes.

  ### Investigation Steps
  - **Review Authentication Logs**: Evaluate the Cisco Duo authentication logs to identify the user and times when bypass codes were used. Look for unusual patterns, such as usage from unexpected locations or failed attempts prior to successful bypass code authentication.

  - **Check User Account Status**: Investigate the accounts that successfully authenticated using a bypass code. Ensure they are not compromised and that they are aware of their bypass code usage.

  - **Examine Administrator Actions**: If applicable, review logs showing when and why bypass codes were issued by administrators. Confirm that these actions were legitimate and aligned with organizational policies.

  - **Monitor for Unauthorized Access Attempts**: Look for any suspicious activities or attempts to access applications associated with accounts that have used bypass codes, especially from unfamiliar IP addresses or devices.

  ### Prioritization
  This alert carries medium severity due to the potential risk of unauthorized access, especially if an attacker successfully uses a bypass code to infiltrate systems. The likelihood of this occurring is heightened if proper controls around the issuance and usage of bypass codes are not enforced, making it essential to validate such events promptly.

  ### Blind Spots and Assumptions
  One gap in detection coverage may include environments that do not log all bypass code usages or where Cisco Duo configurations are not standardized, leaving certain authentication events unmonitored. The detection logic assumes that successful bypass code usage is always unusual and that bypass codes are adequately controlled by administrators. This requires proper logging configurations to ensure comprehensive visibility into all authentication events within the Cisco Duo environment.

