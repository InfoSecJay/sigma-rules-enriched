note: |
  ### Technical Context

  This rule detects successful multifactor authentication (MFA) attempts that utilize a bypass code within Cisco Duo. A bypass code is a temporary passcode created for users who cannot access their usual MFA devices, often due to circumstances like device loss or network issues. The likely attacker objective is to circumvent standard MFA controls, potentially allowing unauthorized access to sensitive applications. This behavior correlates with MITRE ATT&CK tactic “Credential Access” (TA0006) and technique “Valid Accounts” (T1078).

  The primary telemetry source for this detection is Cisco Duo authentication logs, specifically events tagged with `event_type: authentication` and `reason: bypass_user`. If used maliciously, it implies an attacker may have obtained the ability to generate a bypass code, indicating compromise of user credentials or insider threat. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate users may also employ bypass codes for valid reasons.

  ### Investigation Steps

  - **Verify the user’s identity:** Check the user account that triggered the alert against organizational records to confirm they are authorized to use a bypass code. Review user logs for `event_type: authentication` for additional context within the Duo logs.

  - **Analyze historical authentication logs:** Inspect the authentication attempts for the same user over the last 30 days. Look for suspicious patterns, such as multiple bypass code attempts or attempts from unusual locations — use Duo's creation timestamps and IP addresses in your analysis.

  - **Check non-MFA authentication activity:** Investigate other access logs during the same period to identify any other relevant authentication events, such as a single-factor login for the account. This could indicate whether the account may have been compromised prior to the bypass code usage.

  - **Assess the legitimacy of the bypass code usage:** Determine if the user typically requires a bypass code by reviewing their previous login behavior. A legitimate user might only utilize a bypass code during travel or device issues.

  - **Identify high-confidence malicious indicators:** Look for simultaneous successful logins from distinct geographic locations for the same user, indicating potential credential abuse. Confirm using the `user_ip` and `timestamp` fields within the Duo logs.

  - **Correlate with security events on endpoints:** Review endpoint security logs to check for any unusual activity related to the user’s devices, such as unauthorized access attempts, malware alerts, or system configuration changes indicative of potential compromise.

  ### Prioritization

  This alert is of medium severity due to the potential for unauthorized access to sensitive systems via legitimate credential misuse. While bypass codes are often used in legitimate circumstances, their successful use without verification can signify credential theft or exploitation of insider access, making it a compelling area for investigation.

  ### Blind Spots and Assumptions

  There are limitations in detection, including potential evasion techniques involving pre-planned bypass code usage by compromised accounts or authorized users circumventing security protocols. Reliable detection requires proper logging configuration in Cisco Duo to ensure all authentication events are recorded. Legitimate scenarios, such as users traveling or experiencing device issues, may trigger this alert. A related companion detection could involve monitoring for suspicious account logins or failed authentication attempts prior to the successful bypass code utilization for enhanced context.

