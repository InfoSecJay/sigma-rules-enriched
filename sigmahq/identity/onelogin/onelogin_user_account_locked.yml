  ---

  ### Technical Context

  This Sigma rule detects events where user accounts are locked or suspended in the OneLogin environment via the API. The likely attacker objective could be to lock out legitimate users to disrupt business operations, thereby achieving denial-of-service (DoS) impacts, or it may indicate credential stuffing attempts resulting in multiple failed login attempts before account lock. The relevant MITRE ATT&CK tactics include **Impact (TA0040)**, specifically the techniques **Account Lockout (T1579)**.

  The primary telemetry source required for this detection is the OneLogin’s event logs, specifically looking at event types related to user account actions. If malicious, locking or suspending user accounts can lead to significant downtime and operational disruption. This detection does NOT confirm unauthorized access on its own without further context, as accounts might be locked for legitimate administration purposes or due to user error.

  ---

  ### Investigation Steps

  - **Review event source logs:** Check OneLogin API logs for `event_type_id` 532 (user account locked), 551 (account suspended), and 553 (account locked). Confirm if the event occurred outside of normal business hours or unusual patterns that could indicate malicious activity.

  - **Identify account activity prior to lock:** Look at the preceding login events for the affected user account (event types 530 or similar) in OneLogin logs to see if multiple failed login attempts were made, suggesting credential stuffing or account takeover attempts.

  - **Determine legitimate admin actions:** Verify the presence of scheduled maintenance or known administrative activities during the time of the account locks. This could include changes documented in your change management system, supporting the legitimacy of the activity.

  - **Cross-reference affected users:** Identify if multiple accounts were simultaneously locked or suspended within a short time window, which can indicate a coordinated malicious effort versus isolated legitimate user activity.

  - **Monitor for subsequent attempts:** Look for any following login attempts or role changes for the affected users that might indicate a continuation of the attack or privilege escalation attempts post-lock.

  - **Assess user base criticality:** Evaluate the importance of the locked/suspended user accounts. Higher-level users or those associated with critical assets may warrant immediate escalation and faster response protocols.

  ---

  ### Prioritization

  The alert severity is low due to the potential for benign administrative actions leading to account locks. However, if observed amidst a pattern of failed logins or multiple accounts being targeted, the risk of malicious abuse increases, necessitating swift attention to protect critical resources.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by improper configuration of OneLogin logging or insufficient granularity in logged events. Legitimate user behavior, such as an administrator locking an account for maintenance, can also trigger this alert. Related detections, such as failed login attempts coupled with account lockout events (e.g., login failure counts), can enhance context and aid in identifying potential abuse.

