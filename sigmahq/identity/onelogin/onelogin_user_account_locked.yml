note: |
  ### Technical Context

  This Sigma rule detects when a user account in OneLogin is locked or suspended, which could indicate a potential security event or misconfigured account policies. The likely attacker objective might include an unauthorized user attempting to gain access through brute force methods or exploiting compromised credentials, leading to account access issues. This activity fits into the MITRE ATT&CK framework under the "Impact" tactic (T1499: Endpoint Denial of Service) as it can render accounts unusable.

  The primary telemetry source is OneLogin's event logs, specifically looking for events related to account lockouts or suspensions. If malicious, this activity may prevent legitimate users from accessing critical systems, impacting business operations or leading to data exposure. This detection does NOT confirm unauthorized access or compromise on its own, as legitimate user actions or policies can also trigger account lockouts.

  ### Investigation Steps

  - **Check event details for Event Type IDs:** Review OneLogin logs for Event Type IDs 532, 551, or 553. Confirm if the account is consistently locked due to failed login attempts, indicating possible malicious actor behavior.

  - **Examine the user account's activity history:** Investigate the user account in OneLogin for recent activity, including successful and failed login attempts. Look for multiple failed attempts followed by an account lock, suggesting brute-force activity.

  - **Determine if legitimate users have been impacted:** Assess if the locked user account is associated with critical operational roles. Account lockouts impacting high-privilege users should be prioritized compared to standard accounts.

  - **Check for external factors influencing lockouts:** Review recent IT changes (e.g., password policies or system updates) that may contribute to user account issues. If numerous accounts are locked simultaneously, this could indicate a systemic issue rather than malicious activity.

  - **Identify the source of failed login attempts:** If available, correlate any failed logins with their originating IP addresses from logs or alerts, typically found in Event Type ID 535. Investigate if those IPs are known for malicious activities or anomalies.

  ### Prioritization

  This alert should be considered low severity under normal circumstances; however, if critical accounts are impacted or if repeated incidents are observed, escalation may be warranted. The likelihood of malicious abuse is moderate, particularly if brute force or targeted attacks are suspected.

  ### Blind Spots and Assumptions

  This detection may be limited by configurations that do not log all failed logins, potentially missing relevant data. Additionally, legitimate users may trigger the alert during password changes or system updates, leading to false positives. A companion detection related to "Failed login attempts" (Event Type ID 535) would help strengthen coverage and discern between legitimate activity and potential attacks.

