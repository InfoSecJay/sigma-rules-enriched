note: |
  ### Technical Context
  This rule detects events related to user account lockouts and suspensions in OneLogin, specifically when accounts are locked (event types 532 and 553) or suspended (event type 551) through the API. Such actions are typically a part of an organization's security measures to prevent unauthorized access as a direct response to suspicious activity or multiple failed login attempts. The main objective of an attacker leveraging account lockouts may be to mask their activities or cause interruptions to the normal business operations by deliberately triggering these events via brute force attacks or exploitation of account credentials.

  The relevant MITRE ATT&CK tactics for this alert include **Impact (TA0005)** as the goal is to disrupt legitimate services by locking accounts, and potentially **Credential Access (TA0006)**, particularly through methods like credential dumping or unauthorized access that results in account lock or suspension as a byproduct. Primary data sources for this detection will include OneLogin event logs, particularly the logs that capture API interactions and user account status changes.

  ### Investigation Steps
  - **Review Lockout Events:** Check OneLogin API event logs for event types 532, 553, and 551 to understand the context of the account lockout or suspension. Determine if multiple accounts were affected or if a particular account exhibited suspicious activity prior to being locked.

  - **Analyze Account Activity:** Investigate recent activities associated with the locked or suspended accounts, looking for failed login attempts, unusual access timings, or potentially unauthorized requests that might suggest brute force attacks or exploitation attempts.

  - **Cross-Reference with User Behavior:** Cross-reference the account lockout events with user behavior analytics to identify any anomalies, such as logins from unusual IP addresses, geographic locations, or device types that could indicate malicious intent.

  - **Consult Security Policies:** Review organizational security settings and policies around account locking mechanisms to ascertain if expected thresholds for lockout were exceeded and whether such actions were aligned with established protocols.

  ### Prioritization
  The alert is considered low in severity due to the potential for false positives, as legitimate users may inadvertently trigger account locks through multiple failed logins. However, it may warrant further investigation especially if there are correlating indicators of compromise or if the frequency of such events is unusually high.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, particularly concerning legitimate activities that may result in account lockouts, such as user error or automated scripts. The detection logic assumes that any account lockout through the OneLogin API is potentially suspicious, without the context of user behavior or additional threat intelligence. Furthermore, access to comprehensive logging of user interactions with the OneLogin API is necessary for effective monitoring and response; lack of comprehensive auditing and logging configurations may hinder the overall efficacy of this rule.

