  ### Technical Context
  This detection rule identifies instances where a user in OneLogin has assumed the identity of another user account, potentially indicating unauthorized access or account compromise. The ability for one user to assume another's identity can be exploited by malicious insiders or external attackers who have gained access credentials. The attacker may aim to escalate privileges, gain access to sensitive data, or perform actions under the guise of another user to avoid detection.

  The related MITRE ATT&CK tactics include **Credential Access** (TA0006), specifically the technique of **Account Manipulation** (T1072), where an adversary may attempt to manipulate user accounts to gain unauthorized access or elevate privileges. The primary data source for detecting such behavior comes from OneLogin event logs, particularly focusing on event types that indicate account assumption activities.

  ### Investigation Steps
  - **Review OneLogin Event Logs:** Collect event logs from OneLogin that detail user activity, focusing specifically on events where the event_type_id is 3, which indicates user assumption actions.
  - **Analyze User Permissions:** Investigate the permissions of both the user assuming the identity and the target user. Check for any unusual changes in permission levels or roles that may indicate exploitation attempts.
  - **Monitor Conditional Access Policies:** Evaluate if any conditional access policies are triggered during the account assumption events. Look for anomalies or failure patterns in access requests that could signify malicious intent.
  - **Identify Anomalous Login Patterns:** Cross-reference the timestamps of the assumption events with other login records. Look for any unusual geographic location or time that may suggest that an account compromise has happened.

  ### Prioritization
  This alert is classified as low severity due to the lower likelihood of attack vectors associated with user account assumptions. However, given that such events can indicate insider threats or credential misuse, it should still be monitored closely, especially in sensitive environments.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes scenarios where an attacker uses legitimate credentials without triggering the account assumption log, thereby going undetected. The detection logic assumes that all account assumptions are authorized and correctly recorded; thus, any configuration issues in OneLogin, such as improperly set logging options, could prevent the detection from working effectively. Ensuring the integrity and completeness of event logging within OneLogin is critical for this rule to function accurately.

