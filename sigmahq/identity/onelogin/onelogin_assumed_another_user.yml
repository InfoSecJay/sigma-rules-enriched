  ### Technical Context

  This Sigma rule detects instances where a user assumes another user account in OneLogin. The behavior typically indicates a potential privilege escalation or unauthorized access, as attackers often attempt to hijack accounts to carry out malicious activities undetected. This falls under the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique of Account Manipulation (T1098). The primary telemetry source for this alert comes from OneLogin event logs, specifically focusing on event type ID 3, which records user assumption activities.

  If the event is malicious, it could lead to significant security impacts such as unauthorized access to sensitive data or systems. However, this detection does NOT confirm malicious intent on its own, as legitimate users may also assume accounts with proper authorization under specific circumstances.

  ---

  ### Investigation Steps

  - **Verify event details:** Check OneLogin event logs (event type ID 3) for the specific user account involved in the assumption. Look for unusual accounts being accessed, especially those with elevated privileges.

  - **Identify user context:** Determine whether the user assuming the account has a legitimate business need. Cross-reference with organizational policy on account delegation to assess if the activity aligns with expected behavior.

  - **Review associated activity:** Look for additional logs from OneLogin, such as authentication logs (event type ID 1), around the same time to identify any abnormal login attempts or unusual locations from which the accounts were accessed.

  - **Examine access permissions:** Audit the permissions of the user who assumed another account. Identify any unauthorized changes made during the session and document the scope of access.

  - **Scan for potential lateral movement:** Utilize network detection tools to check for unusual patterns of activity in the affected system, indicating potential lateral movement (e.g., logins from unexpected IP addresses or devices).

  - **Document and escalate findings:** If suspicious activity is confirmed, escalate to higher-tier analysts with detailed observations, including timestamps, user IDs, and any associated event logs for further investigation.

  ---

  ### Prioritization

  This alert is considered low severity due to its potential for benign usage in a controlled environment. However, the likelihood of malicious abuse increases if the accounts involved are highly privileged or if the behavior deviates from established access protocols. While this activity can be weaponized, it is not commonly seen unless an environment is being specifically targeted.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate users misusing the account assumption feature, leading to false positives. Reliable detection requires proper logging configurations in OneLogin, ensuring that all relevant event types are captured. Legitimate activities, such as account sharing for collaborative work, may also trigger this alert. A companion detection focusing on anomalous login patterns or account creation events would strengthen overall security coverage.

