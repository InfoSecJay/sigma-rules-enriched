  ### Technical Context

  This rule detects when a user assumes another user account within the OneLogin identity and access management system. The likely objective of this action may be to gain unauthorized access to sensitive resources or perform actions under another user’s identity, indicating a potential account compromise or insider threat. This behavior aligns with the MITRE ATT&CK tactic of **Impact (T1499)**, which involves an adversary wreaking havoc on an organization’s operations.

  The primary telemetry for this detection comes from OneLogin event logs, specifically looking for `event_type_id: 3`, which corresponds to account assumption activities. If this behavior is malicious, it could enable an attacker to manipulate user privileges, steal data, or disrupt services. It's important to note that this detection alone does not confirm malicious intent, as legitimate administrative actions may also trigger the rule.

  ### Investigation Steps

  - **Review event logs for account assumptions:** Examine OneLogin event logs for entries with `event_type_id: 3`. Check the associated `user_id` and `target_user_id` fields to confirm which accounts were involved.

  - **Identify unusual account behavior:** Cross-reference the login history for the `target_user_id` against typical usage patterns. Look for unusual locations, times, or devices used and compare entries from Event IDs to detect sign-ins from unrecognized IP addresses or geolocations.

  - **Assess legitimate admin actions:** Validate that the account assumption aligns with documented administrative procedures. If the assumed account is a service or admin account, confirm that its usage falls within expected operational changes or support workflows.

  - **Look for additional malicious indicators:** Investigate associated log events, such as failed login attempts or suspicious activity preceding the account assumption. Specifically, check for any abnormal changes in the user’s access rights or permissions immediately after the assumption using user group membership logs.

  - **Check for user notification:** Verify whether the presumed user received any alerts or notifications regarding the account assumption. This can be located in user activity logs and indicates if the login was recognized or notified to the legitimate user.

  ### Prioritization

  This alert is categorized as low severity due to potentially low-impact user accounts being involved. However, the likelihood of abuse is moderate, especially if it involves privileged user accounts. The behavior is not commonly weaponized on its own, but in conjunction with other techniques, it may become part of a larger attack strategy.

  ### Blind Spots and Assumptions

  Limitations include the potential for false positives from legitimate administrative activity, particularly in environments with frequent user changes. Reliable detection requires thorough logging configurations of OneLogin events, and any failures in logging these events may lead to gaps in detection. Additionally, legitimate scenarios could involve system migrations or user role changes that trigger this alert. A companion detection useful for strengthening coverage includes monitoring for unusual access patterns after an account assumption, such as elevated administrative actions immediately following the event.

