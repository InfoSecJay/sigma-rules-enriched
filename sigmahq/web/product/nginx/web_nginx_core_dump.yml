note: |
  ### Technical Context
  This detection rule identifies core dumps from Nginx worker processes, which typically indicate a failure or crash in the web server application. A core dump is a file that captures the memory of a running process at a specific time, usually when the process has terminated unexpectedly due to an error, such as a configuration mistake or an out-of-bounds memory access. However, core dumps can also be indicative of an exploitation attempt, where an attacker deliberately makes the application crash to investigate its memory state or attempt to gain unauthorized access to the system.

  The likely attacker objectives behind generating core dumps could include reconnaissance of the application’s behavior, extraction of sensitive data, or exploiting vulnerabilities within the Nginx server. This activity correlates with the MITRE ATT&CK techniques such as **Impact (T1499)**, particularly the subclass **Application Layer Denial of Service (T1499.004)**, which outlines the objective of disrupting the service and potentially leading to further exploitations.

  Relevant data sources for detection include Nginx logs that capture worker process events and core dump files themselves, detailing the process memory state at the time of the crash.

  ### Investigation Steps
  - **Review Nginx Logs:** Examine Nginx logs for entries that indicate the worker process has exited due to receiving a signal 6, which corresponds to a segmentation fault. Look for patterns or frequency of core dumps as this may indicate underlying issues or active attempts at exploitation.

  - **Analyze Core Dump Files:** If available, analyze the core dump files to extract information regarding the stack trace and memory state at the time of the crash. This analysis could help identify any malicious patterns or exploitation attempts.

  - **Check Configuration Settings:** Investigate the Nginx configuration for any misconfigurations or problematic plugins that may lead to crashes. Focus on recent changes that could correlate with the occurrence of the core dumps.

  - **Monitor for Unusual Patterns:** Implement broader monitoring for any repeated or systematic core dump occurrences, which could indicate sustained exploitation efforts or attempts to learn more about the Nginx deployment and its vulnerabilities.

  ### Prioritization
  The high severity of this alert is warranted due to the potential impact of an attacker successfully exploiting a vulnerability within Nginx, which could lead to unauthorized access to sensitive data or disruption of services, making it critical to investigate promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for non-standard configurations or custom Nginx setups that do not generate core dumps as expected. The detection logic assumes that the typical logs and configurations for Nginx are in place to capture core dump events. Additionally, if Nginx is running in an environment that disables core dumping for security purposes, this rule will not trigger, leading to potential blind spots in detecting serious issues. Required logging and configuration settings must be validated to ensure core dumps are enabled and accessible.

