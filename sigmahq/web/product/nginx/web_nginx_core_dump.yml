note: |
  ### Technical Context

  This Sigma rule detects core dumps generated by crashing Nginx worker processes, specifically those exiting with the message "exited on signal 6 (core dumped)." This behavior can indicate potential exploitation attempts, misconfigurations, or serious application issues, highlighting that an internal component of the web server has encountered a critical failure. The likely attacker objective could be to exploit vulnerabilities within Nginx or its associated components to execute arbitrary code or gain persistent access.

  This detection aligns with the MITRE ATT&CK framework under the tactic of "Impact" (TA0040) and specifically technique "Impact: Data Manipulation" (T1499.004). The primary telemetry source includes Nginx error logs, where the exit signal and accompanying details are recorded. If malicious, the security impact could range from service disruption to potential data breaches if exploited further. However, this detection does NOT confirm malicious intent or successful exploitation on its own; it merely indicates an abnormal process termination.

  ### Investigation Steps

  - **Review Nginx error logs**: Check Nginx logs located at `/var/log/nginx/error.log` for entries indicating "exited on signal 6 (core dumped)." Determine if recurring crashes correlate with specific requests or patterns.

  - **Analyze other logged signals**: Examine any additional signals in the Nginx logs that may indicate other types of crashes (e.g., segmentation faults). Lack of additional signals may support benign causes like misconfigurations.

  - **Inspect system resources and configuration**: Validate the server's resource allocations (using tools like `top` or `htop`) and check the Nginx configuration file (`/etc/nginx/nginx.conf`) for errors that could cause instability. Misconfiguration is a common benign cause.

  - **Identify recent changes**: Query version control or deployment logs (if applicable) for recent changes to the Nginx configuration or updates to related plugins. Note if customer changes were implemented that may impact stability.

  - **Correlate with other alerts**: Review SIEM alerts for related behaviors, particularly those involving high-frequency traffic or patterns that could lead to exploitation attempts. Specific indicators of compromise like excessive HTTP requests to unique endpoints could signal a broader attack.

  ### Prioritization

  This alert should be treated as high priority due to the potential for significant disruptions in service and the relatively high likelihood of abuse from attackers leveraging web server vulnerabilities. The nature of Nginx as a critical web server means that any instability may indicate a pathway to further exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of Nginx logging capabilities; core dumps may not always be enabled or logged as an event. Legitimate high-load conditions or application misconfigurations could trigger alerts, making context assessment crucial. To strengthen coverage, use companion detections focused on abnormal HTTP request patterns or external application monitoring solutions to ensure concurrent visibility into broader attack vectors.

