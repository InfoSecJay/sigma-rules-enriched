  ---

  ### Technical Context

  This rule detects segmentation fault errors, indicated by "exit signal Segmentation Fault," which occur when an Apache worker process crashes. The likely attacker objective could be a denial of service, as crashing the web server would disrupt service availability. This behavior aligns with the MITRE ATT&CK tactic of Impact (T1499.004), specifically via service exhaustion or web server disruption.

  The primary telemetry sources include the Apache error.log file, which must be monitored for such errors. If the segmentation fault is caused maliciously, it could lead to an unresponsive service, impacting business operations. It is important to note that this detection alone does not confirm malicious intent, as segmentation faults can also arise from legitimate application bugs or misconfigurations.

  ---

  ### Investigation Steps

  - **Review error.log for fault details:** Look for entries stating "exit signal Segmentation Fault" to confirm the rule's hit. This should be noted along with timestamps and process IDs to understand the context of the crash.

  - **Identify recent changes in configuration or deployment:** Check Apache access logs (Event ID 104) and configurations (Site configurations or .htaccess) for changes made before the crash. Look for unusual content delivery or spikes in traffic that might suggest abuse.

  - **Analyze related server resource usage:** Examine CPU and memory usage metrics during the time of the segmentation fault. High resource consumption could indicate a potential denial of service attack versus legitimate peak traffic.

  - **Cross-reference with Apache module usage:** Investigate any recent additions or updates to Apache modules that could introduce instability. Confirm whether these modules were necessary, and if they have prompted similar segmentation faults in other logs.

  - **Assess for repeated occurrences:** Determine if this segmentation fault is a one-time event or if there have been multiple instances. Recurring issues could indicate a need for more immediate remediation, while a singular instance may require confirmation of underlying application integrity.

  ---

  ### Prioritization

  This alert is of high severity due to its potential to critically impact services on the affected Apache server. The likelihood of malicious abuse is considered elevated, particularly if there are patterns of repetitive faults or associated anomalous traffic. The behavior can be weaponized for attacks aimed at service disruption.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist as segmentation faults may arise from legitimate software bugs or misconfigurations, potentially leading to false positives. Reliable detection relies on consistent monitoring of the Apache error.log, which must be enabled and properly configured. Legitimate activities, such as unexpected spikes in traffic or legitimate updates to the web application, may inadvertently trigger this alert. A related detection to consider is high error rates in Apache access logs, which could indicate broader service impact alongside segmentation faults.

