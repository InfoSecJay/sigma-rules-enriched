  ### Technical Context

  This Sigma rule detects segmentation fault errors generated by Apache web server worker processes. The presence of such errors may indicate an attempt to exploit vulnerabilities in the Apache service, potentially allowing an attacker to disrupt service or even execute arbitrary code, thereby achieving their malicious objectives. Relevant MITRE ATT&CK Tactic: Impact, Technique: Application Layer Denial of Service (T1499.004).

  The primary telemetry source for this detection is the Apache error log (error.log) which captures critical runtime errors including segmentation faults. If malicious, the impact could be significant, leading to website downtime or unauthorized access. This detection does NOT confirm that the segmentation fault is malicious on its own; legitimate application bugs can also cause this behavior.

  ---

  ### Investigation Steps

  - **Verify segmentation fault occurrence:** Check the Apache error log (error.log) for entries containing "exit signal Segmentation Fault" around the time of the alert, specifically under Apache's default log location or configured locations (e.g., `/var/log/apache2/error.log`).

  - **Cross-reference with application activity:** Investigate corresponding access logs (access.log) for unusual traffic patterns, such as multiple requests to a specific endpoint or non-standard HTTP methods before the segmentation fault occurred. Focus on patterns typical of scanning or exploit attempts.

  - **Identify Apache version vulnerability:** Confirm the version of Apache running on the affected host by using server status endpoints or checking installed packages. Look for known vulnerabilities associated with that version; utilize CVE databases for reference.

  - **Evaluate legitimate applications:** Review recent changes or updates made to the web application or the Apache configuration. Confirm this with development teams to identify if recent code changes may have introduced instability.

  - **Check for simultaneous faults or related processes:** Look into other potentially impacted worker processes. Review the process list (using `ps aux`) on the host to identify if multiple worker processes are crashing in a short time span, indicating a possible coordinated attack.

  - **Assess host criticality and potential escalations:** Determine the role of the affected host in the architecture (e.g., public-facing web server, internal application server) and assess the potential for further exploitation if accompanied by other attack vectors, like privilege escalation techniques.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential impact on a public-facing web server. If exploited, it can lead to service disruption and could be leveraged for further attacks. The commonality of the application layer being targeted elevates the urgency for investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss segmentation faults caused by non-malicious factors such as misconfigurations or application bugs. Ensuring that error logging is correctly configured is critical for reliable detection. Legitimate debugging or heavy load testing can trigger similar alerts. Companion detections include monitoring for unusual patterns in server resource usage or correlating errors with authentication anomalies to strengthen overall incident response coverage.

