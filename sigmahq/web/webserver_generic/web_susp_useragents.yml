title: Suspicious User-Agents Related To Recon Tools
id: 19aa4f58-94ca-45ff-bc34-92e533c0994a
status: test
description: Detects known suspicious (default) user-agents related to 
  scanning/recon tools
references:
- https://github.com/wpscanteam/wpscan/blob/196fbab5b1ce3870a43515153d4f07878a89d410/lib/wpscan/browser.rb
- https://github.com/xmendez/wfuzz/blob/1b695ee9a87d66a7d7bf6cae70d60a33fae51541/docs/user/basicusage.rst
- https://github.com/lanmaster53/recon-ng/blob/9e907dfe09fce2997f0301d746796408e01a60b7/recon/core/base.py#L92
author: Nasreddine Bencherchali (Nextron Systems), Tim Shelton
date: 2022-07-19
modified: 2023-01-02
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-user-agent|contains:
            # Add more tools as you see fit
    - 'Wfuzz/'
    - 'WPScan v'
    - 'Recon-ng/v'
    - 'GIS - AppSec Team - Project Vision'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects HTTP requests featuring suspicious user agents that are commonly associated with scanning or reconnaissance tools such as Wfuzz, WPScan, and Recon-ng. These tools are typically used by attackers to identify vulnerabilities in web applications, making their presence indicative of potential pre-attack activities.

  The relevant MITRE ATT&CK tactic is “Initial Access” and the technique is “Exploit Public-Facing Application” (T1190). The primary telemetry source for this detection is web server logs, specifically focusing on the `cs-user-agent` field of HTTP request logs. If malicious, the impact could range from data breaches to unauthorized access through discovered vulnerabilities.

  This detection does NOT confirm an active attack or successful exploitation, as legitimate web crawlers and automated testing mechanisms may use similar user agents.

  ---

  ### Investigation Steps

  - **Examine web server logs for the detected user-agent:** Look at your web access logs (e.g., IIS logs for Windows servers or Apache access logs) for entries containing suspicious user agents listed in the Sigma rule. Focus on Event IDs 5 (IIS) or 104 (Apache).

  - **Review the request patterns:** Cross-reference the time of suspicious requests with user behavior. Legitimate user activity typically shows unique user-agent strings and access patterns relevant to key services, rather than repetitive or automated scanning behavior.

  - **Identify high-confidence malicious indicators:** Look for multiple requests from the same IP exhibiting patterns of scanning, such as repeated access to diverse URLs or endpoints within a short time frame. Check for IP reputation using threat intelligence feeds.

  - **Validate against known safe tools:** Assess if these user agents correspond to legitimate site audit tools or security scanners used in your environment, confirming that they aren't associated with unauthorized testing activities.

  - **Check for corresponding error logs:** Look in your web server error logs (Event IDs 10 for IIS or 500+ for Apache) for entries that coincide with these requests, which might suggest probing attempts or failures typically left by scanning tools.

  - **Monitor for subsequent activity:** If the source IPs are associated with a recognized scanning tool, escalate for monitoring as they could follow up with attempts at exploitation. Look for signs of successful access or exploitation post-scan.

  ---

  ### Prioritization

  This alert should be considered medium severity. The impact depends on the criticality of the affected systems; web servers often hold sensitive data. The likelihood of malicious abuse is moderate but there is a realistic chance these activities could be precursors to a more serious attack, especially if they lead to successful vulnerability exploitation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss custom or modified user-agent strings used by adversaries to evade detection. Reliable detection requires comprehensive logging of web events and may necessitate configurations to capture user-agent strings consistently. Legitimate web scraping and automated testing tools may trigger this alert. A companion detection rule targeting exploit attempts (e.g., logging successful 4xx or 5xx responses) could enhance overall coverage and context of the alert.

