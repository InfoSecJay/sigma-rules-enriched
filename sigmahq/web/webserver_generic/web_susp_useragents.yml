logsource:
  category: webserver
detection:
  selection:
    cs-user-agent|contains:
            # Add more tools as you see fit
    - 'Wfuzz/'
    - 'WPScan v'
    - 'Recon-ng/v'
    - 'GIS - AppSec Team - Project Vision'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of known suspicious user-agents that are typically associated with reconnaissance tools commonly employed by attackers to gather information about systems and services. User-agents such as "Wfuzz", "WPScan", and "Recon-ng" are indicative of scanning activity aimed at vulnerability exploitation or data gathering—a precursor to more serious attacks like web application exploitation.

  The threat scenario involves an attacker utilizing these tools to identify vulnerabilities within an organization's web applications or APIs. The ultimate objective of such reconnaissance is often to facilitate initial access to the network, leading to exploitation of unpatched vulnerabilities. This aligns with the MITRE ATT&CK tactics of Initial Access (TA0001) and the corresponding technique, "Exploitation of Public-Facing Application" (T1190).

  Primary data sources to monitor include web server logs, specifically focusing on request headers which capture user-agent strings, thus allowing for identification of potentially malicious scanning activity.

  ### Investigation Steps
  - **Review Web Server Logs**: Examine web server access logs for entries with suspicious user-agent strings tied to reconnaissance tools. Focus on timestamps, originating IP addresses, and associated request methods.
  - **Identify Unusual Patterns**: Look for anomalous traffic patterns such as repeated requests to sensitive endpoints or an increase in requests from a single IP address, which may indicate automated scanning behavior.
  - **Cross-reference with Threat Intelligence**: Utilize threat intelligence feeds to correlate the detected user-agents with known malicious actor profiles or campaigns using these tools.
  - **Inspect Application Security Logs**: Analyze application logs for any corresponding alerts or events that may relate to scanning or probing activities, providing further context to the user-agent findings.

  ### Prioritization
  This alert has medium severity due to the potential impact of reconnaissance activities on the organization’s security posture. While not indicative of a confirmed attack, reconnaissance significantly increases the likelihood of future exploitation if vulnerabilities are present.

  ### Blind Spots and Assumptions
  The detection logic relies on a predefined list of user-agents, which may not cover all potential reconnaissance tools being utilized by attackers. Additionally, the effectiveness of this detection is contingent upon proper logging of user-agents in web server configurations; if user-agent strings are stripped or modified by security devices, the alert may fail to trigger. There is an assumption that reconnaissance attempts will use these known user-agents, potentially missing out on custom or less commonly known tools.

