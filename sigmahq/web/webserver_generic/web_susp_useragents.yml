logsource:
  category: webserver
detection:
  selection:
    cs-user-agent|contains:
            # Add more tools as you see fit
    - 'commix/'
    - 'feroxbuster/'
    - 'Fuzz Faster U Fool'
    - 'GIS - AppSec Team - Project Vision'
    - 'gobuster/'
    - 'Nikto/'
    - 'Nmap Scripting Engine'
    - 'Recon-ng/v'
    - 'sqlmap/'
    - 'WhatWeb/'
    - 'Wfuzz/'
    - 'WPScan v'
    - 'zgrab/'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects web requests that use known suspicious user-agents associated with various reconnaissance and scanning tools, including frameworks like Nmap, Gobuster, and SQLMap. These tools are often employed by attackers to gather information about network services, vulnerabilities, and system configurations, which can lead to a deeper compromise of the target environment. The relevant MITRE ATT&CK tactics and techniques for this detection are **Initial Access** (TA0001) and **Active Scanning** (T1595).

  The primary telemetry source for this detection is web server logs, specifically looking for `cs-user-agent` fields. If malicious, the impact could include exposure of sensitive information, unauthorized access to systems, or preparation for more severe attacks. It's important to note that the detection of a suspicious user-agent does **not** confirm actual exploitation or unauthorized activity on its own; further investigation is required.

  ### Investigation Steps

  - **Check web server logs for suspicious entries:** Review the web server logs (e.g., Apache or Nginx logs) for any instances of the `cs-user-agent` field containing entries like "SQLMap" or "Nmap". Note instances that have high frequency within a short time frame, as this may indicate probing.

  - **Identify the originating IP address:** Determine the source IP address of the request using fields in the web server logs (e.g., `client_ip`). Cross-reference this IP against threat intelligence databases or internal logs for known malicious entities.

  - **Review legitimate user-agent patterns:** Compare the detected suspicious user agents to normal business operations. For example, legitimate traffic from corporate environments would likely utilize standard browser user agents (e.g., Chrome/Firefox) and would be consistent with user behavior patterns, such as timing and request volume.

  - **Inspect correlated activity logs:** Check additional logs such as firewall logs or IDS alerts for outbound network connections that correspond with the timestamps of the suspicious user-agent entries, particularly looking for connections to known malicious IPs.

  - **Assess web application behavior:** Analyze the target application's performance and behavior concurrently with the alert, ensuring no signs of exploitation or data leakage during the period when the suspicious activity was flagged.

  ### Prioritization

  The severity of this alert is medium. The impact is contingent on the affected system's role (web application server) and potential exposure if an attacker successfully enumerates vulnerabilities. The likelihood of malicious abuse is moderate, as these reconnaissance tools are commonly weaponized in initial access attempts.

  ### Blind Spots and Assumptions

  There are limitations in this detection, as sophisticated adversaries may spoof their user-agent strings to mimic legitimate traffic and evade detection. Reliance on comprehensive logging from web servers is essential for effective monitoring, and improper configurations may lead to missed detections. Additionally, legitimate web crawlers and penetration testing tools may generate similar traffic, potentially triggering false positives. A related detection that strengthens coverage could be the monitoring of unusual patterns in HTTP request methods (e.g., a high volume of POST requests from a single source), which often accompanies scanning activities.

