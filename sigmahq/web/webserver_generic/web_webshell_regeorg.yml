title: Webshell ReGeorg Detection Via Web Logs
id: 2ea44a60-cfda-11ea-87d0-0242ac130003
status: test
description: Certain strings in the uri_query field when combined with null referer
  and null user agent can indicate activity associated with the webshell ReGeorg.
references:
- https://community.rsa.com/community/products/netwitness/blog/2019/02/19/web-shells-and-netwitness-part-3
- https://github.com/sensepost/reGeorg
author: Cian Heasley
date: 2020-08-04
modified: 2023-01-02
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains:
    - 'cmd=read'
    - 'connect&target'
    - 'cmd=connect'
    - 'cmd=disconnect'
    - 'cmd=forward'
  filter:
    cs-referer:
    cs-user-agent:
    cs-method: POST
  condition: selection and filter
falsepositives:
- Web applications that use the same URL parameters as ReGeorg
level: high
note: |
  ### Technical Context
  This detection rule identifies potential activity associated with the web shell variant known as ReGeorg through analysis of web server logs. Specifically, it looks for suspicious URI query strings that are commonly used in ReGeorg command execution, alongside an absence of a referrer and user agent. Attackers utilizing a web shell like ReGeorg typically aim to maintain persistence on the compromised server, execute remote commands, and potentially exfiltrate data without drawing attention.

  The relevant MITRE ATT&CK tactics for this rule fall under **Persistence** (TA0003) due to the nature of web shells allowing attackers to maintain access. Specifically, it relates to the technique **Remote File Copy** (T1505.003) where attackers can upload their malicious payloads to the server. The primary data source providing insights into this behavior is web server logs, which capture request parameters and the metadata associated with those requests.

  ### Investigation Steps
  - **Review Web Server Logs:** Collect web server logs that include requests with null referrer and user agent fields. Focus on entries that match the detected URI query parameters indicative of ReGeorg activity.
  - **Correlate with Other Events:** Check system and application logs for related suspicious activities around the same timestamps, such as anomalous file accesses or unusual process creations that could indicate exploited vulnerabilities.
  - **Analyze Network Traffic:** Consider leveraging Network Traffic Analysis tools to identify any outgoing connections associated with suspicious command execution. Look for unusual traffic patterns that might correlate with command operations.
  - **Assess Web Application Functionality:** Evaluate the legitimate use of URI parameters within any applications running on the web server to rule out false positives. Investigate if similar parameters are used in benign application features.

  ### Prioritization
  This alert is categorized as high severity due to the critical nature of web shell exploits in enabling attackers to maintain long-term access to sensitive systems and the potential for significant data exfiltration or damage.

  ### Blind Spots and Assumptions
  One blind spot in the detection logic is the potential for legitimate web applications to use similar command structures that could trigger false positives. The detection is based on the assumption that there are no legitimate uses of the specified URI strings under the conditions of null referrer and user agent. The alert requires comprehensive access to detailed web server logs; any misconfiguration, such as log retention settings or logging format, may impact the rule's effectiveness.

