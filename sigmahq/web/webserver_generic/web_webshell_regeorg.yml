title: Webshell ReGeorg Detection Via Web Logs
id: 2ea44a60-cfda-11ea-87d0-0242ac130003
status: test
description: Certain strings in the uri_query field when combined with null 
  referer and null user agent can indicate activity associated with the webshell
  ReGeorg.
references:
- https://community.rsa.com/community/products/netwitness/blog/2019/02/19/web-shells-and-netwitness-part-3
- https://github.com/sensepost/reGeorg
author: Cian Heasley
date: 2020-08-04
modified: 2023-01-02
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains:
    - 'cmd=read'
    - 'connect&target'
    - 'cmd=connect'
    - 'cmd=disconnect'
    - 'cmd=forward'
  filter:
    cs-referer:
    cs-user-agent:
    cs-method: POST
  condition: selection and filter
falsepositives:
- Web applications that use the same URL parameters as ReGeorg
level: high
note: |
  ### Technical Context

  This Sigma rule detects HTTP POST requests that contain specific command strings indicative of the ReGeorg webshell, particularly when the referer and user-agent are absent. The objective of the attacker is to establish remote control over a compromised web server, allowing for command execution and potential data exfiltration. This falls under the MITRE ATT&CK technique for web shells, specifically Persistence (T1505.003).

  The primary telemetry sources include web server logs that capture requests, particularly the `cs-uri-query`, `cs-referer`, and `cs-user-agent` fields. If malicious activity is confirmed, the security impact may involve unauthorized access and control over sensitive systems, data theft, or further lateral movement within the network. This detection does NOT confirm actual command execution or the presence of a webshell; it merely identifies suspicious patterns that require further investigation.

  ### Investigation Steps

  - **Review HTTP logs for matches:** Check web server logs for entries matching the `cs-uri-query` field against keywords: `cmd=read`, `connect&target`, `cmd=connect`, `cmd=disconnect`, `cmd=forward`, alongside `cs-referer` and `cs-user-agent` being null. Note legitimate web applications that utilize similar parameters.

  - **Identify unusual POST requests:** Filter logs for POST requests with missing user-agent and referer headers, as these are typically non-standard and may indicate webshell usage.

  - **Analyze the timestamp and frequency:** Cross-reference log entries by time and IP addresses to identify patterns that indicate automation or repeated attempts from specific sources.

  - **Investigate connected sessions:** Check relevant user and session activity for the affected web server (e.g., Web Server Event ID 4648 on IIS) to validate the context of incoming requests.

  - **Scan for known indicators of compromise (IOCs):** Utilize threat intelligence sources to compare the originating IP addresses or any suspicious file names against known malicious infrastructure.

  - **Examine file activity on server:** If suspicious activity is confirmed, validate potential file creation or modification by checking for unexpected new files or access to sensitive directories.

  ### Prioritization

  This alert holds high severity due to the critical impact of compromised web servers. Given the likelihood of exploiting such vulnerabilities via known webshell commands, this behavior is well-documented in attack vectors and is increasingly weaponized by adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate web applications using similar command strings or configurations that don't log expected telemetry. A comprehensive logging setup, including complete application performance logs and access logs, is necessary for reliable detection. Common benign activities that may trigger this alert include legitimate API interactions or internal application diagnostics. Companion detections could include monitoring for unusual outbound connections that follow the patterns observed in the ReGeorg activity.

