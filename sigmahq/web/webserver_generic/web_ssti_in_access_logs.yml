title: Server Side Template Injection Strings
id: ada3bc4f-f0fd-42b9-ba91-e105e8af7342
status: test
description: Detects SSTI attempts sent via GET requests in access logs
references:
- https://book.hacktricks.xyz/pentesting-web/ssti-server-side-template-injection
- https://github.com/payloadbox/ssti-payloads
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-14
tags:
- attack.defense-evasion
- attack.t1221
logsource:
  category: webserver
detection:
  select_method:
    cs-method: 'GET'
  keywords:
  - '={{'
  - '=%7B%7B'
  - '=${'
  - '=$%7B'
  - '=<%='
  - '=%3C%25='
  - '=@('
  - 'freemarker.template.utility.Execute'
  - .getClass().forName('javax.script.ScriptEngineManager')
  - 'T(org.apache.commons.io.IOUtils)'
  filter:
    sc-status: 404
  condition: select_method and keywords and not filter
falsepositives:
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you 
  experience a lot of FPs due to this think of adding more filters such as "User
  Agent" strings and more response codes
level: high
note: |
  ### Technical Context

  This Sigma rule detects server-side template injection (SSTI) attempts sent via HTTP GET requests, typically indicated by specific patterns such as `={{` or `${`. The likely attacker objective is to exploit a vulnerability that allows arbitrary code execution on a web server, potentially leading to data exfiltration or server takeover. This behavior relates to the MITRE ATT&CK tactic **Defense Evasion** and technique **T1221** (Template Injection).

  The primary telemetry sources include web server access logs, specifically looking for HTTP GET requests containing the defined keywords. If malicious, this can lead to severe impacts, such as unauthorized code execution or data compromise. It is important to clarify that this detection does NOT confirm successful exploitation; it merely identifies suspicious input patterns.

  ### Investigation Steps

  - **Examine web access logs**: Review access logs for suspicious GET request patterns. Look for log entries (e.g., Apache `access.log` or Nginx equivalent) containing the keywords from the rule. Pay attention to the `cs-uri-stem` field for URLs that might indicate tampering.

  - **Identify false positives**: Check for legitimate user activity, such as searches performed in search boxes, which may also generate requests containing these strings. Validate user agent strings to correlate with known application behaviors.

  - **Investigate response codes**: Focus on entries returning a 404 status code (`sc-status: 404`). These indicate that the requested resource was not found, potentially signaling probing behavior rather than legitimate access.

  - **Correlate with application logs**: If available, refer to application logs that may provide context on the handling of these requests. Monitor for any application-level errors or unexpected behaviors following these access attempts.

  - **Enrich analysis with user context**: Consider the role of the requesting user (e.g., admin vs. guest) to determine the legitimacy of the request. Malicious attempts are often executed from less privileged accounts or anonymous users.

  - **Validate access patterns**: Identify if requests originate from known internal IP addresses or external public addresses. High-confidence malicious indicators would include repeated patterns from the same source IP that correlate with failed requests leading to 404s.

  ### Prioritization

  This alert is considered high severity due to the potential impact on web application security. The likelihood of malicious abuse is significant, as SSTI exploits are commonly weaponized in modern attack vectors. The affected systems are often crucial to business operations, amplifying the urgency for immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate web application features triggering the alert, such as user-generated search queries. Required log sources must be correctly configured to capture detailed access logs for reliable detection. Companion detections include monitoring for anomalies in application error logs post-detection, which can provide additional context for assessing the attack surface.

