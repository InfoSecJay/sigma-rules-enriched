title: Server Side Template Injection Strings
id: ada3bc4f-f0fd-42b9-ba91-e105e8af7342
status: test
description: Detects SSTI attempts sent via GET requests in access logs
references:
- https://book.hacktricks.xyz/pentesting-web/ssti-server-side-template-injection
- https://github.com/payloadbox/ssti-payloads
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-14
tags:
- attack.defense-evasion
- attack.t1221
logsource:
  category: webserver
detection:
  select_method:
    cs-method: 'GET'
  keywords:
  - '={{'
  - '=%7B%7B'
  - '=${'
  - '=$%7B'
  - '=<%='
  - '=%3C%25='
  - '=@('
  - 'freemarker.template.utility.Execute'
  - .getClass().forName('javax.script.ScriptEngineManager')
  - 'T(org.apache.commons.io.IOUtils)'
  filter:
    sc-status: 404
  condition: select_method and keywords and not filter
falsepositives:
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you experience
  a lot of FPs due to this think of adding more filters such as "User Agent" strings
  and more response codes
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts at Server Side Template Injection (SSTI) utilizing GET requests observed in web server access logs. SSTI is a critical web vulnerability that allows attackers to inject and execute arbitrary code on a server, often leading to data breaches or unauthorized access to server resources. The rule flags instances in which common SSTI payloads are sent within HTTP GET parameters, specifically focusing on those that return a 404 HTTP status code, indicating that the requests were processed by the server without finding the intended resource. This provides a telling sign that malicious actors are probing the web application for vulnerabilities.

  The primary objective of an attacker exploiting SSTI is to manipulate the server-side logic to gain control over server execution. This could lead to code execution, sensitive data leakage, or even full system compromise. Techniques related to this behavior fall under the MITRE ATT&CK framework, specifically T1221 - "Template Injection". The attack leverages web application weaknesses in template rendering engines, making it essential to monitor web access logs for unusual patterns indicative of intrusion attempts.

  The best telemetry sources for capturing evidence of SSTI attempts are web server access logs, which should log all incoming requests including method types, parameters, and their respective status codes. Ensuring log completeness and accuracy will bolster investigations into suspicious activity.

  ### Investigation Steps
  - **Review Access Logs:** Examine the web server access logs for GET requests that include suspicious patterns indicative of SSTI, such as `={{`, `=%7B%7B`, and other listed keywords. Focus on entries returning a status code of 404, as these may indicate probing attempts.

  - **Analyze Web Application Responses:** Investigate the context and frequency of occurrences for identified SSTI payloads. Patterns of use may reveal systematic attack attempts or automated scanning tools, which can help refine response strategies.

  - **Conduct Traffic Analysis:** If available, utilize proxy logs to identify the originating IPs of the GET requests. This may help in determining whether the requests are from legitimate users or potential attackers.

  - **Enhance Filtering Mechanisms:** Implement additional filters to reduce false positives, such as examining user agent strings or context surrounding the requests (e.g., user roles or authenticated sessions) to distinguish between benign queries and potential attacks.

  ### Prioritization
  This alert is classified as high severity due to the serious implications of successful SSTI attacks, which can lead to significant breaches in confidentiality, integrity, and availability within enterprise environments, along with the likelihood of such vulnerabilities being targeted by attackers.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if web access logs are not comprehensive or if certain user-agent strings are not filtered out, potentially allowing malicious queries to go unnoticed. The rule assumes that all requests resulting in 404 responses are attempts to exploit SSTI, which may not always hold true, especially in cases of legitimate user activity or misconfigured environments. Proper logging configurations and retention policies are crucial for effective monitoring, requiring a comprehensive logging strategy that captures all relevant web activity to support this detection rule.

