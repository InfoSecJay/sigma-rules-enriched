title: Server Side Template Injection Strings
id: ada3bc4f-f0fd-42b9-ba91-e105e8af7342
status: test
description: Detects SSTI attempts sent via GET requests in access logs
references:
- https://book.hacktricks.xyz/pentesting-web/ssti-server-side-template-injection
- https://github.com/payloadbox/ssti-payloads
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-14
tags:
- attack.stealth
- attack.t1221
logsource:
  category: webserver
detection:
  select_method:
    cs-method: 'GET'
  keywords:
  - '={{'
  - '=%7B%7B'
  - '=${'
  - '=$%7B'
  - '=<%='
  - '=%3C%25='
  - '=@('
  - 'freemarker.template.utility.Execute'
  - .getClass().forName('javax.script.ScriptEngineManager')
  - 'T(org.apache.commons.io.IOUtils)'
  filter:
    sc-status: 404
  condition: select_method and keywords and not filter
falsepositives:
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you 
  experience a lot of FPs due to this think of adding more filters such as "User
  Agent" strings and more response codes
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential Server-Side Template Injection (SSTI) attempts identified through GET requests in web server access logs. The behavior indicates a possible adversary objective of executing arbitrary code on the server or retrieving sensitive information, facilitated by unreliable or buggy template engines. This detection aligns with the MITRE ATT&CK Tactic of "Initial Access" (TA0001) and the Technique "Exploitation of Client Execution" (T1171).

  Primary telemetry sources include web server access logs capturing HTTP requests, specifically focusing on GET method requests featuring SSTI payloads. If confirmed as malicious, this activity could lead to severe impacts such as data leakage, unauthorized access, or complete server compromise. It is important to note that this detection does NOT confirm successful exploitation or code execution; it merely indicates an attempt that requires further investigation.

  ### Investigation Steps

  - **Review access logs for SSTI patterns:** Examine web server access logs (e.g., `access.log`) for requests containing keywords like `={{`, `=${`, or similar payloads. Focus on entries with HTTP status codes indicating a 404 error, which suggests that the input was maliciously crafted.

  - **Analyze user agent strings:** Identify the user agent associated with suspicious requests to filter out benign behaviors, such as legitimate user searches or traffic from known vulnerability scanners. Look for anomalies or unusual user agent strings that may indicate automated tools or malicious intent.

  - **Evaluate request frequency and source:** Check for multiple requests over a short period from the same IP address attempting SSTI payloads. A high frequency of such requests is a strong indicator of automated exploitation attempts.

  - **Establish baseline user behavior:** Document standard patterns of user searches or interactions with the web application to discern legitimate requests from anomalous ones. Note that legitimate searches may employ some similar syntax but lack the targeted malicious payloads.

  - **Check for exploit framework signatures:** Utilize threat intelligence feeds or vulnerability management tools to match detected payloads against known exploit frameworks, confirming whether they correlate with documented attack vectors.

  - **Investigate backend interactions:** If applicable, verify if the web application integrates with APIs or databases, examining logs for any subsequent actions (e.g., unauthorized queries or command executions) after the initial suspicious request was logged.

  ### Prioritization

  The alert is high severity due to the critical role of the affected web application in potentially exposing sensitive data or server control. The specific nature of SSTI makes it a favored method among attackers, as it can lead directly to remote code execution, increasing the likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the inability to capture all HTTP request methods or by operational constraints that prevent monitoring all web server logs comprehensively. Legitimate activities, such as users experimenting with template syntax in search boxes, may trigger false positives; understanding contextual user behavior is therefore essential. Implementing companion detection rules for related attack vectors, such as Cross-Site Scripting (XSS) or Remote Code Execution (RCE) events, can help enhance security posture against web application vulnerabilities.

