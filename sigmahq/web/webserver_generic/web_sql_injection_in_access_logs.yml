title: SQL Injection Strings In URI
id: 5513deaf-f49a-46c2-a6c8-3f111b5cb453
status: test
description: Detects potential SQL injection attempts via GET requests in access logs.
references:
- https://www.acunetix.com/blog/articles/exploiting-sql-injection-example/
- https://www.acunetix.com/blog/articles/using-logs-to-investigate-a-web-application-attack/
- https://brightsec.com/blog/sql-injection-payloads/
- https://github.com/payloadbox/sql-injection-payload-list
- https://book.hacktricks.xyz/pentesting-web/sql-injection/mysql-injection
author: Saw Win Naung, Nasreddine Bencherchali (Nextron Systems), Thurein Oo (Yoma
  Bank)
date: 2020-02-22
modified: 2023-09-04
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-method: 'GET'
  keywords:
  - '@@version'
  - '%271%27%3D%271'
  - '=select '
  - '=select('
  - '=select%20'
  - 'concat_ws('
  - 'CONCAT(0x'
  - 'from mysql.innodb_table_stats'
  - 'from%20mysql.innodb_table_stats'
  - 'group_concat('
  - 'information_schema.tables'
  - 'json_arrayagg('
  - 'or 1=1#'
  - 'or%201=1#'
  - 'order by '
  - 'order%20by%20'
  - 'select * '
  - 'select database()'
  - 'select version()'
  - 'select%20*%20'
  - 'select%20database()'
  - 'select%20version()'
  - 'select%28sleep%2810%29'
  - 'SELECTCHAR('
  - 'table_schema'
  - 'UNION ALL SELECT'
  - 'UNION SELECT'
  - 'UNION%20ALL%20SELECT'
  - 'UNION%20SELECT'
  - "'1'='1"
  filter_main_status:
    sc-status: 404
  condition: selection and keywords and not 1 of filter_main_*
falsepositives:
- Java scripts and CSS Files
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you experience
  a lot of FPs due to this think of adding more filters such as "User Agent" strings
  and more response codes
level: high
note: |
  ### Technical Context
  This detection rule identifies potential SQL injection attempts through the analysis of GET requests in web server access logs. SQL injection (SQLi) is a prevalent method attackers use to exploit web applications by injecting malicious SQL queries, enabling unauthorized access to database content or application data. The primary goal of such attacks is to extract sensitive information, manipulate database records, or even execute administrative operations on the database.

  SQL injection attacks fall primarily under the MITRE ATT&CK tactic of Initial Access, specifically aligning with technique T1190, which involves exploiting vulnerabilities through user input. Successful SQLi can lead to severe data breaches and compromise the integrity of an organization's database. This detection heavily relies on access logs from web servers that record incoming requests, specifically highlighting patterns indicative of SQL injection strings in the URI.

  Primary data sources that will provide evidence for this detection include web server access logs, which capture incoming request details such as the HTTP method, requested URIs, and response status codes.

  ### Investigation Steps
  - **Review Access Logs:** Analyze the captured HTTP GET requests in the web server access logs for any patterns or keywords associated with SQL injection attempts, as listed in the detection keywords.
  - **Examine Response Codes:** Look for requests with a 404 (not found) status code in conjunction with the detected SQL injection patterns, as attackers may test for vulnerabilities that do not yet exist.
  - **Filter User-Agent Strings:** Investigate the User-Agent strings associated with the requests to identify any potential automated scanning tools or unusual sources that are not typical for normal user behavior.
  - **Assess Application Behavior:** Conduct a deeper examination of the affected web application to identify any abnormal behaviors, errors, or anomalies that might indicate a potential successful SQL injection attack, such as unexpected data outputs or unauthorized access attempts.

  ### Prioritization
  This alert carries a high severity rating due to the significant impact and likelihood of SQL injection threats in web applications, which can lead to unauthorized access and data breaches. The potential damage to the organization's reputation and data integrity makes timely detection and response critical.

  ### Blind Spots and Assumptions
  The detection logic may not cover all SQL injection cases, especially if attackers use obfuscation techniques or use encoded payloads that are not captured in the specified keywords. It assumes proper logging configurations are in place to capture all relevant access logs and that the appropriate filtering is applied to minimize false positives from benign requests such as legitimate user searches or internal scanning tools. It is essential to ensure the completeness and accuracy of incoming logs to optimize the detection of SQL injection attempts.

