title: SQL Injection Strings In URI
id: 5513deaf-f49a-46c2-a6c8-3f111b5cb453
status: test
description: Detects potential SQL injection attempts via GET requests in access
  logs.
references:
- https://www.acunetix.com/blog/articles/exploiting-sql-injection-example/
- https://www.acunetix.com/blog/articles/using-logs-to-investigate-a-web-application-attack/
- https://brightsec.com/blog/sql-injection-payloads/
- https://github.com/payloadbox/sql-injection-payload-list
- https://book.hacktricks.xyz/pentesting-web/sql-injection/mysql-injection
author: Saw Win Naung, Nasreddine Bencherchali (Nextron Systems), Thurein Oo 
  (Yoma Bank)
date: 2020-02-22
modified: 2023-09-04
tags:
- attack.initial-access
- attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-method: 'GET'
  keywords:
  - '@@version'
  - '%271%27%3D%271'
  - '=select '
  - '=select('
  - '=select%20'
  - 'concat_ws('
  - 'CONCAT(0x'
  - 'from mysql.innodb_table_stats'
  - 'from%20mysql.innodb_table_stats'
  - 'group_concat('
  - 'information_schema.tables'
  - 'json_arrayagg('
  - 'or 1=1#'
  - 'or%201=1#'
  - 'order by '
  - 'order%20by%20'
  - 'select * '
  - 'select database()'
  - 'select version()'
  - 'select%20*%20'
  - 'select%20database()'
  - 'select%20version()'
  - 'select%28sleep%2810%29'
  - 'SELECTCHAR('
  - 'table_schema'
  - 'UNION ALL SELECT'
  - 'UNION SELECT'
  - 'UNION%20ALL%20SELECT'
  - 'UNION%20SELECT'
  - "'1'='1"
  filter_main_status:
    sc-status: 404
  condition: selection and keywords and not 1 of filter_main_*
falsepositives:
- Java scripts and CSS Files
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you 
  experience a lot of FPs due to this think of adding more filters such as "User
  Agent" strings and more response codes
level: high
note: |
  ---

  ### Technical Context

  This rule detects potential SQL injection (SQLi) attempts through malicious strings included in GET requests to web applications. Attackers might attempt to exploit SQL vulnerabilities in the application to execute unauthorized SQL commands, retrieve sensitive data, or manipulate databases. The relevant MITRE ATT&CK tactics and techniques include Initial Access (T1190), which cover methods by which an adversary can gain entry into a system or application.

  The primary telemetry source for this detection is web server access logs, particularly focusing on incoming GET requests. A successful SQL injection can compromise the integrity and confidentiality of database information, potentially leading to data breaches or unauthorized access. However, this detection alone does not confirm an active exploitation or successful unauthorized access; further investigation is needed to determine the context of the request.

  ---

  ### Investigation Steps

  - **Review the access logs for affected endpoints:** Check web server access logs (e.g., IIS or Apache logs) for Event IDs corresponding to GET requests from the source IP noted in the alert. Look specifically for entries containing keywords associated with SQLi, such as '`UNION SELECT`' or '`or 1=1#`'.

  - **Correlate user-agent strings:** Identify if the same source IP address exhibits unusual activity or patterns—such as repeated requests containing SQL injection strings. Legitimate user-agent strings (e.g., common browsers) may indicate benign activity, while unknown or suspicious user agents could signify malicious intent.

  - **Check for multiple requests from the same source:** Examine if there are several GET requests in quick succession from the same IP address, and whether any of these contain other SQLi payloads. This repeated behavior can signify an ongoing attack rather than a single benign probe.

  - **Determine the status code of the responses:** Analyze the response status codes associated with the flagged requests. A high volume of 404 responses—especially when targeting specific database functionalities—can indicate probing rather than legitimate search behavior.

  - **Gather additional context from web application firewall (WAF) logs:** If available, check WAF logs for blocked requests originating from the same source IP which may provide context about attempted SQLi activities.

  - **Identify and validate any triggered alerts from the WAF:** Check if your WAF or web application security solutions have triggered alerts for these requests, consolidating evidence of attempted exploitation and enhancing the investigation outcome.

  ---

  ### Prioritization

  This alert should be treated with high priority given its potential impact on sensitive database information and the likelihood of exploitation in web applications being commonly weaponized. Systems hosting databases or critical applications are particularly at risk, requiring prompt investigation and remediation steps.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by benign traffic originating from legitimate user searches or automated tools (e.g., internal scanners). It is crucial to ensure that access logs are correctly configured to capture all HTTP method requests. Legitimate activities such as search queries to databases may inadvertently trigger the alert, necessitating further analysis. A companion detection rule focusing on SQL error messages in response content may provide a more comprehensive view of possible exploitation attempts.

