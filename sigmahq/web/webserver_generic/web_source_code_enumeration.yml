  ---

  ### Technical Context

  This rule detects attempts to enumerate source code repositories using `GET` requests that include keywords indicative of source code disclosure, specifically targeting endpoints containing '.git/'. The likely attacker objective is to discover and potentially exfiltrate sensitive source code or configuration files that may expose other vulnerabilities. This behavior falls under the MITRE ATT&CK tactic of Discovery (TA0007) and technique of File and Directory Discovery (T1083). The primary telemetry source is web server access logs that can capture HTTP requests. If successful, this behavior can lead to unauthorized access to source code or sensitive data, significantly impacting security. Importantly, this detection does NOT confirm a successful exfiltration of data or any subsequent malicious actions.

  ---

  ### Investigation Steps

  - **Review web server access logs:** Analyze logs for HTTP `GET` requests matching the keyword `'.git/'`. Validate the source IP against known legitimate IPs to distinguish between benign and malicious activity.

  - **Check for abnormal patterns:** Look for repeated requests for `'.git/'` from a single IP or multiple requests over a short time frame (e.g., multiple accesses within a minute). This could indicate a brute-force enumeration attempt.

  - **Identify user agent strings:** Investigate the `User-Agent` header in the HTTP requests. Legitimate users typically have known user agents (e.g., established browsers). Look for suspicious or default user agents often associated with automated tools.

  - **Cross-reference with firewall logs:** Check firewall logs for any blocked outbound connections related to the source IP. Review Event ID 5156 on Windows or similar blocking events on firewall devices to identify suspect activities.

  - **Determine asset sensitivity:** Identify if the web server hosting the source code is critical (e.g., deployment environment vs. staging). Higher criticality should escalate the investigation priority.

  - **Validate for initial footholds:** Check if any additional malicious indicators (e.g., unusual uploads or transfers) correlate with the time of enumeration attempts. This may include monitoring for suspicious uploads (e.g., Event IDs 11 for IIS if possible) following such a detection.

  ---

  ### Prioritization

  This alert has medium severity due to its potential impact on sensitive source code exposure. While the enumeration itself may not always indicate an imminent threat, the method used is common in exploitation scenarios and can further facilitate attacks if sensitive code is successfully revealed.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise if web server logs are not retained long enough or if logging configurations are not set to capture all relevant URL parameters. Legitimate activities that may trigger this alert include internal audits or authentic inquiries by developers. A related detection could be monitoring for direct access attempts to sensitive files using similar patterns, which strengthens overall coverage of source code protection.

