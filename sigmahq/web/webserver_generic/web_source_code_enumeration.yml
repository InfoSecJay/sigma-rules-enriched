  ### Technical Context

  This Sigma rule detects source code enumeration attempts through the use of GET requests that include keywords suggesting the targeted retrieval of sensitive code repositories, particularly those exposed via the `.git/` directory. Attackers typically leverage this behavior to gain unauthorized access to source code, configuration files, or credentials, aiming for data exfiltration or further exploitation opportunities. This activity is related to the MITRE ATT&CK technique "Data from Information Repositories" (T1083).

  The primary telemetry source is web server logs, specifically indicating GET requests to URL paths containing the `.git/` directory keyword. If successful, an attacker could exploit sensitive information about the application’s source code. However, this detection does not confirm that source code has been successfully retrieved or utilized maliciously; it merely identifies attempted access patterns.

  ### Investigation Steps

  - **Review web server access logs**: Check the logs for GET requests that include `.git/` in the URL (e.g., Event ID for web server access logs). Cross-reference the timestamps with reported incidents or queries for heightened awareness.

  - **Analyze request sources**: Identify originating IP addresses of the detected requests. Look for unusual or blacklisted IP addresses compared to expected traffic from legitimate users.

  - **Investigate request patterns**: Cross-reference the detected access with other logged activities (e.g., failed or successful login attempts). Legitimate activity often involves internal IPs accessing authorized resources, while malicious patterns show odd request frequencies or timings.

  - **Correlate with known bugs**: Check for vulnerabilities associated with exposed code repositories, such as Git misconfigurations. This can indicate whether the source code leak could be exploited further.

  - **Assess server configuration**: Validate server settings and permissions related to the `.git/` directory to ensure it is not publicly accessible. Review security hardening practices against common exploitation techniques.

  - **Document responses**: If malicious indicators are confirmed (e.g., highly anomalous request rates or patterns), escalate promptly to the incident response team for further investigation and potential remediation actions.

  ### Prioritization

  This alert has a medium severity level due to the potential risk associated with data leaks from source code repositories, which could lead to significant security incidents if exploited. The likelihood of abuse is concerning, as this behavior is commonly weaponized by adversaries actively searching for exploitable vulnerabilities.

  ### Blind Spots and Assumptions

  Detection reliability is contingent on comprehensive logging of web server access requests; misconfigured servers may evade detection. Legitimate activities that may inadvertently trigger the alert include automated scans from vulnerability assessment tools or internal development processes. A companion detection to enhance coverage could focus on monitoring for POST requests to the `.git/` directory, which may also indicate exfiltration attempts.

