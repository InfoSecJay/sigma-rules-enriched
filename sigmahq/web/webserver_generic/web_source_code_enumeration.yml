  ### Technical Context
  This rule detects attempts to enumerate source code through keyword searches in URL strings that involve GET requests. Attackers commonly look for exposed source code repositories, particularly those indicating a `.git/` directory, which can provide insight into an organization's internal codebase and sensitive information. By exploiting these exposed repositories, an attacker may aim to identify vulnerabilities, credentials, or proprietary logic that could facilitate further attacks or lead to data breaches.

  The likely objective of such an attack falls under the Discovery tactic (TA0007) in the MITRE ATT&CK framework, specifically technique T1083 - "File and Directory Discovery." In this scenario, attackers aim to gather detailed knowledge about the target's software and applications to exploit weaknesses or extract sensitive data.

  The primary data source for this detection is web server logs. These logs capture incoming GET requests and related parameters, making them instrumental in identifying suspicious activities related to source code enumeration attempts.

  ### Investigation Steps
  - **Review Web Server Logs:** Examine web server access logs for GET requests containing the keyword `.git/`. Focus on the URLs to determine the scope and rate of such requests.
  - **Identify Source IP:** Trace the source IP addresses making these GET requests. Verify if they originate from known or expected geographical locations and assess whether they belong to legitimate users or potential attackers.
  - **Investigate User Agent Strings:** Analyze the user agent strings associated with the GET requests. Look for unusual or automated tool signatures that may indicate a scanner or exploitation tool is being used.
  - **Cross-Reference with Other Data Sources:** Correlate findings with other telemetry, such as firewall logs and Intrusion Detection System (IDS) alerts, to gain a comprehensive view of potential suspicious activities around the time of the requests.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to the potential impact of source code exposure, which can lead to significant data loss, compromise of intellectual property, and increased vulnerability to further attacks. The likelihood of such attacks is growing, particularly as attackers increasingly target source code management practices.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage may arise from misconfigured web servers that do not log all access requests or from the absence of security measures to prevent public access to sensitive directories. The detection logic assumes that all GET requests for URLs containing `.git/` are malicious; however, legitimate requests for version control may sometimes yield false positives. To ensure the effectiveness of this rule, web server logging configurations need to be validated to confirm comprehensive logging of incoming requests and the presence of security controls to restrict access to sensitive directory paths.

