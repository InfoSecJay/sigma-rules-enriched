note: |
  ### Technical Context
  This detection rule aims to identify unauthorized command execution on F5 BIG-IP devices through the iControl REST API's "bash" endpoint. The rule specifically targets POST requests made to the `/mgmt/tm/util/bash` URI, which allows users to execute shell commands on the BIG-IP system. Attackers may exploit this command execution functionality to execute malicious commands, gain unauthorized access, or manipulate the BIG-IP configuration, thereby potentially disrupting services or exfiltrating sensitive data.

  The threat scenario mainly involves potentially malicious actors, including external attackers and unauthorized insider threats, attempting to exploit weaknesses in management interfaces for the purpose of executing arbitrary commands. This activity aligns with the MITRE ATT&CK techniques of **Execution (T1190)** and **Initial Access (T1190)** wherein attackers leverage exposed APIs to gain control or manipulate systems.

  The primary data sources for effective monitoring include web server logs that capture detailed information regarding incoming requests, such as the request method, URI path, and payloads that show command execution attempts via the iControl REST API.

  ### Investigation Steps
  - **Review Web Server Logs:** Start by examining web server access logs for POST requests to `/mgmt/tm/util/bash`. Look for suspicious or unexpected parameters that may indicate unauthorized command execution.
  - **Analyze Command Payloads:** Inspect the payloads of the detected POST requests to identify any malicious or unexpected commands being executed. Pay attention to commands that could indicate malware deployment or attempts to further compromise the system.
  - **Correlate with User Access:** Check the user contexts under which the commands were executed. Verify whether the users initiating the requests have the appropriate administrative permissions. Look for anomalies in user behavior or compromised accounts.
  - **Monitor for Subsequent Activity:** Keep an eye on any related network or application events following the command executions. This can include unusual outbound connections or changes in system configurations that may suggest an ongoing attack or exploitation.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized access and the ability to execute arbitrary commands on critical infrastructure. The likelihood of exploitation increases if the API is exposed to the internet and has not been properly secured, making it critical for immediate investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments that do not log all POST requests or where access logs are not adequately monitored. The detection logic assumes that legitimate administrative actions occur infrequently, which may not hold true in well-administrated environments. Additionally, without proper logging configurations for web activities, such as comprehensive API request logging, this rule may fail to capture all potential attacks or misuses of the API.

