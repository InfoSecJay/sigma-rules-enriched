note: |
  ### Technical Context

  This rule detects POST requests made to the F5 BIG-IP iControl REST API "bash" endpoint, which can allow execution of shell commands on the BIG-IP system. The behavior indicates a potential exploitation attempt, where an attacker may gain unauthorized access to execute commands, potentially leading to further system compromise or disruption. The relevant MITRE ATT&CK tactic is **Execution (TA0002)**, with technique **Remote Command Execution (T1190)**.

  Primary telemetry sources include web server access logs, specifically monitoring for requests to the F5 BIG-IP API. If malicious, the security impact could range from unauthorized command execution, system integrity compromise, to full control over the BIG-IP device. This detection does NOT confirm that the execution was successful or that malicious intent was indeed present without additional context.

  ### Investigation Steps

  - **Review web server logs: POST requests**: Check logs for Event ID related to web server activity that includes POST requests to `/mgmt/tm/util/bash`. Look for timestamps and IP addresses to correlate with other activities.

  - **Validate requesting IP address**: Investigate the source IP address associated with the POST request to determine if it's an authorized administrative location. Look specifically for common administrative IP ranges versus public internet addresses.

  - **Examine command payload**: Analyze the command payload sent in the POST request. Focus on suspicious or unexpected command strings that do not align with typical administrative tasks (e.g., `curl`, `wget`, `rm -rf`).

  - **Identify legitimate usage patterns**: Understand and document normal behaviors for administrative usage of the BIG-IP REST API. Confirm if requests match expected administrative scripts that regularly interact with the device.

  - **Correlate with user authentication logs**: Review authentication logs related to the administrator accounts used during the same timeframe. Check for any unauthorized access attempts or abnormal login behaviors.

  - **Seek signs of follow-on malicious activity**: Look for additional events that may follow the POST request such as file creation logs (e.g., Event ID 4688) or unusual network activity from the BIG-IP device indicating a potential compromise.

  ### Prioritization

  Alerts from this detection rule should be prioritized as medium severity. The F5 BIG-IP is a crucial system that handles traffic management and security; successful command execution could lead to significant disruptions or data loss. While there are legitimate uses for the REST API, the specificity of the "bash" endpoint means it's often a target for malicious exploitation.

  ### Blind Spots and Assumptions

  This detection may not capture all legitimate administrative command executions, especially if proper logging is not enabled on the F5 BIG-IP. Evasion tactics could include using obfuscation for the command payload or executing commands via alternative unauthorized methods not covered by the POST request detection. Ensure comprehensive logging for both the REST API and surrounding access logs. A related detection for unauthorized REST API access attempts could strengthen coverage against abuse.

