title: Cross Site Scripting Strings
id: 65354b83-a2ea-4ea6-8414-3ab38be0d409
status: test
description: Detects XSS attempts injected via GET requests in access logs
references:
- https://github.com/payloadbox/xss-payload-list
- https://portswigger.net/web-security/cross-site-scripting/contexts
author: Saw Win Naung, Nasreddine Bencherchali
date: 2021-08-15
modified: 2022-06-14
tags:
- attack.initial-access
- attack.t1189
logsource:
  category: webserver
detection:
  select_method:
    cs-method: 'GET'
  keywords:
  - '=<script>'
  - '=%3Cscript%3E'
  - '=%253Cscript%253E'
  - '<iframe '
  - '%3Ciframe '
  - '<svg '
  - '%3Csvg '
  - 'document.cookie'
  - 'document.domain'
  - ' onerror='
  - ' onresize='
  - ' onload="'
  - 'onmouseover='
  - '${alert'
  - 'javascript:alert'
  - 'javascript%3Aalert'
  filter:
    sc-status: 404
  condition: select_method and keywords and not filter
falsepositives:
- JavaScripts,CSS Files and PNG files
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you 
  experience a lot of FPs due to this think of adding more filters such as "User
  Agent" strings and more response codes
level: high
note: |
  ### Technical Context

  This Sigma rule detects cross-site scripting (XSS) injection attempts via GET requests logged in web server access logs. The likely attacker objective is to execute arbitrary JavaScript in the context of unsuspecting users, potentially enabling data theft, session hijacking, or redirection to malicious sites. This behavior aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and the technique of Exploit Public-Facing Application (T1189).

  The primary telemetry source is web server access logs, specifically focusing on HTTP GET requests that contain suspicious keywords indicative of XSS payloads. If malicious, this can lead to significant data compromise and exploitation of valid user sessions. It is important to note that detection alone does not confirm a successful XSS vulnerability exploit; it merely indicates an attempt.

  ### Investigation Steps

  - **Review access logs for flagged requests:** Examine web server access logs (e.g., IIS logs - Event ID 4624 or Apache logs) for entries containing keywords like `<script>`, `<iframe>`, or `javascript:alert`, focusing on the query string parameters.

  - **Validate legitimacy against application behavior:** Compare any identified suspicious GET requests with legitimate patterns of traffic. For instance, normal user input will avoid embedding JavaScript tags or suspicious attributes in queries.

  - **Correlate with response codes:** Investigate entries that yield a 404 status response, as indicated in the filter. A legitimate request should generally return 200 OK or relevant application-specific codes, while a spike in 404s may indicate probing activity.

  - **Identify IP sources and geolocation:** Collect the originating IP addresses of flagged requests and perform a geolocation lookup to determine if they are associated with suspicious or unexpected sources.

  - **Look for patterns over time:** Create a timeline of similar alerts to identify repeated attempts from the same source or patterns leading to potential attacks. This can be logged using SIEM tools that aggregate access logs.

  - **Collaborate with web application security teams:** If repeated alerts are confirmed, escalate findings to the web application security team to assess the application for vulnerabilities that may have been targeted.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on user data and application integrity. The likelihood of malicious exploitation is significant, as XSS is a commonly weaponized attack vector in web vulnerabilities, often leading to extensive data breaches.

  ### Blind Spots and Assumptions

  Limitations include the possibility of evasion techniques, such as encoding payloads or using unusual HTTP methods that may not be captured by this rule. Ensure comprehensive logging configurations are in place to avoid missing relevant data points. Legitimate activities, such as testing by internal developers or automated scanning tools, may trigger the alert, requiring careful review to distinguish between benign and malicious traffic. Companion detections, like those identifying attempted SQL injections or other web application attacks, can enhance overall coverage against application layer threats.

