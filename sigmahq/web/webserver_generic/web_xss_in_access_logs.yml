title: Cross Site Scripting Strings
id: 65354b83-a2ea-4ea6-8414-3ab38be0d409
status: test
description: Detects XSS attempts injected via GET requests in access logs
references:
- https://github.com/payloadbox/xss-payload-list
- https://portswigger.net/web-security/cross-site-scripting/contexts
author: Saw Win Naung, Nasreddine Bencherchali
date: 2021-08-15
modified: 2022-06-14
tags:
- attack.initial-access
- attack.t1189
logsource:
  category: webserver
detection:
  select_method:
    cs-method: 'GET'
  keywords:
  - '=<script>'
  - '=%3Cscript%3E'
  - '=%253Cscript%253E'
  - '<iframe '
  - '%3Ciframe '
  - '<svg '
  - '%3Csvg '
  - 'document.cookie'
  - 'document.domain'
  - ' onerror='
  - ' onresize='
  - ' onload="'
  - 'onmouseover='
  - '${alert'
  - 'javascript:alert'
  - 'javascript%3Aalert'
  filter:
    sc-status: 404
  condition: select_method and keywords and not filter
falsepositives:
- JavaScripts,CSS Files and PNG files
- User searches in search boxes of the respective website
- Internal vulnerability scanners can cause some serious FPs when used, if you experience
  a lot of FPs due to this think of adding more filters such as "User Agent" strings
  and more response codes
level: high
note: |
  ### Technical Context
  This rule detects potential Cross-Site Scripting (XSS) attempts that are injected into web applications via GET requests, as observed in web server access logs. XSS is a web security vulnerability that allows attackers to inject malicious scripts into content that is then served to users, compromising user data and potentially gaining unauthorized access to user sessions. The primary objective of such attacks is to manipulate client-side scripts of web pages to execute malicious code in the context of a user’s session.

  The detection logic scans for specific XSS patterns, such as `<script>` and variations, alongside other risky attributes like `onload` and `document.cookie`. These patterns may indicate that an attacker is attempting to execute JavaScript in the browser of a victim visiting a vulnerable page. Relevant MITRE ATT&CK tactics involved include **Initial Access** (TA0001), specifically through the technique **Exploitation of Public-Facing Applications** (T1189). This highlights the necessity for organizations to monitor and secure their web applications against such injection attacks.

  Primary data sources for this detection include web server access logs, which capture incoming requests to the web application, allowing for analysis of potentially harmful payloads targeting the site.

  ### Investigation Steps
  - **Review Access Logs:** Examine web server access logs for GET requests that contain the identified XSS payload strings. Check for abnormal patterns or a high frequency of requests from specific IP addresses.
  - **Analyze HTTP Response Codes:** Look for 404 responses alongside the identified strings, as this can indicate a probing attempt to test for vulnerabilities or presence of malicious scripts.
  - **Correlate User Activity:** Cross-reference the access logs with user session logs to identify if any users experienced issues or unusual behavior that coincides with the identified potentially malicious requests.
  - **Inspect Application Behavior:** Analyze the behavior of the web application and response headers in scenarios where such payloads resulted in errors. This can help validate if any successful injection occurred leading to actual exploitation.

  ### Prioritization
  The severity of this alert is high due to the significant impact that XSS vulnerabilities can have on user sessions and data integrity, posing a real threat to both users and the organization's security posture. Attack attempts leveraging XSS can lead to compromised user accounts, application vulnerabilities, and data breaches.

  ### Blind Spots and Assumptions
  There are several potential gaps in detection coverage, including nested and obfuscated scripts that may not trigger the current detection logic. The rule assumes that all risky payload injections will use identifiable patterns, potentially allowing sophisticated attackers to evade detection through encoding or alternative methods. For this alert to function effectively, it requires comprehensive access logging configurations on the web servers, and environments lacking such logging may miss critical XSS attempts.

