logsource:
  category: webserver
detection:
  selection_method:
    cs-method: 'GET'
  selection_keywords:
        # The "%20" is URL encoded version of the space
        # The "%2B" is URL encoded version of the "+"
  - '=whoami'
  - '=net%20user'
  - '=net+user'
  - '=net%2Buser'
  - '=cmd%20/c%'
  - '=cmd+/c+'
  - '=cmd%2B/c%'
  - '=cmd%20/r%'
  - '=cmd+/r+'
  - '=cmd%2B/r%'
  - '=cmd%20/k%'
  - '=cmd+/k+'
  - '=cmd%2B/k%'
  - '=powershell%'
  - '=powershell+'
  - '=tasklist%'
  - '=tasklist+'
  - '=wmic%'
  - '=wmic+'
  - '=ssh%'
  - '=ssh+'
  - '=python%'
  - '=python+'
  - '=python3%'
  - '=python3+'
  - '=ipconfig'
  - '=wget%'
  - '=wget+'
  - '=curl%'
  - '=curl+'
  - '=certutil'
  - '=copy%20%5C%5C'
  - '=dsquery%'
  - '=dsquery+'
  - '=nltest%'
  - '=nltest+'
  condition: all of selection_*
falsepositives:
- Web sites like wikis with articles on os commands and pages that include the 
  os commands in the URLs
- User searches in search boxes of the respective website
level: high
note: |
  ### Technical Context

  This Sigma rule detects common command strings typically associated with Windows webshells. These commands imply an attacker seeking to execute arbitrary commands on compromised systems, potentially leading to unauthorized access, data extraction, or further lateral movement within the network. The relevant MITRE ATT&CK tactic is "Persistence" (TA0003) and the technique identified is "Web Shell" (T1505.003). The primary telemetry source is web server logs, specifically monitoring for HTTP GET requests containing specific command strings.

  If malicious, this behavior could facilitate significant compromise, potentially leading to data breaches or prolonged presence on a network. This detection does NOT confirm exploitation or successful compromise without further context or corroborating evidence.

  ### Investigation Steps

  - **Inspect HTTP GET requests:** Review web server logs (Event ID 5023 or Apache access logs) for GET requests with payloads matching the keywords defined in the Sigma rule. Look for unusual patterns or frequent multiple requests indicative of probing or command execution.

  - **Verify the web server’s context:** Determine if the web server is expected to handle such requests, especially if they contain system command invocations (e.g., `=whoami`, `=net user`). Evaluate normal user behavior and application functionality that may generate similar requests.

  - **Check for known malicious user agents:** Look for unusual user agents or IP addresses associated with the GET requests in the logs (e.g., suspicious public proxies or Tor exit nodes). Criminal actors often employ specific user agents to mask activity.

  - **Analyze system responses for payload success:** Cross-reference accesses with web server response codes. Look for HTTP status codes 200 and 302 that indicate successful command execution or redirections potentially indicative of backdoor setup.

  - **Review for associated lateral movement:** Check for any follow-up requests originating from the same IP address that may indicate attempts to gather information or access other systems (e.g., using internal tools like `wmic` or `nltest`).

  ### Prioritization

  This alert warrants high severity due to its potential impact on system integrity and security. The likelihood of exploitation is significant as webshells are a common method for attackers to maintain persistence within a network. This behavior is frequently weaponized, especially in environments with exposed web services.

  ### Blind Spots and Assumptions

  There are limitations in detecting nuanced behaviors, such as encoded variations of commands or legitimate tool usage that may inadvertently invoke similar patterns. The effective monitoring of web server logs is crucial to capture this detection reliably. Legitimate activities that may trigger this alert include legitimate web applications that dynamically generate these commands in URL strings. A related detection to consider is monitoring for anomalous file modifications or uploads (potentially indicative of webshell deployment) within web directories.

