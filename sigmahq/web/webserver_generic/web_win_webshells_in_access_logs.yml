modified: 2022-11-18
tags:
- attack.persistence
- attack.t1505.003
logsource:
  category: webserver
detection:
  selection_method:
    cs-method: 'GET'
  selection_keywords:
        # The "%20" is URL encoded version of the space
        # The "%2B" is URL encoded version of the "+"
  - '=whoami'
  - '=net%20user'
  - '=net+user'
  - '=net%2Buser'
  - '=cmd%20/c%'
  - '=cmd+/c+'
  - '=cmd%2B/c%'
  - '=cmd%20/r%'
  - '=cmd+/r+'
  - '=cmd%2B/r%'
  - '=cmd%20/k%'
  - '=cmd+/k+'
  - '=cmd%2B/k%'
  - '=powershell%'
  - '=powershell+'
  - '=tasklist%'
  - '=tasklist+'
  - '=wmic%'
  - '=wmic+'
  - '=ssh%'
  - '=ssh+'
  - '=python%'
  - '=python+'
  - '=python3%'
  - '=python3+'
  - '=ipconfig'
  - '=wget%'
  - '=wget+'
  - '=curl%'
  - '=curl+'
  - '=certutil'
  - '=copy%20%5C%5C'
  - '=dsquery%'
  - '=dsquery+'
  - '=nltest%'
  - '=nltest+'
  condition: all of selection_*
falsepositives:
- Web sites like wikis with articles on os commands and pages that include the os
  commands in the URLs
- User searches in search boxes of the respective website
level: high
note: |
  ### Technical Context
  This detection rule identifies potential indicators of compromise associated with webshells on Windows web servers by monitoring for specific command strings in HTTP GET requests. Webshells are malicious scripts that attackers utilize to execute commands on a compromised server, achieve persistence, and control affected systems remotely. By detecting commonly used commands in webshells, such as `whoami`, `net user`, and various PowerShell commands, the rule helps organizations identify anomalous behavior that may signal ongoing exploitation or unauthorized access.

  The threat scenario this rule addresses typically involves attackers exploiting vulnerabilities in web applications, leading to remote code execution and the deployment of webshells. Attackers can then leverage these shells to perform reconnaissance, escalate privileges, or exfiltrate data, ultimately allowing them to maintain persistence within the environment. Relevant MITRE ATT&CK tactics include Persistence (T1505.003) and Execution (multiple techniques), as the observed behavior focuses on command execution and unauthorized system control.

  Primary data sources for this detection include web server logs, specifically those that capture the details of HTTP requests and responses. By inspecting these logs, security teams can uncover suspicious command invocations and understand the context and impact of any detected webshell activity.

  ### Investigation Steps
  - **Review Web Server Logs:** Analyze HTTP GET request logs for the presence of the specified command strings. Pay close attention to any unusual patterns or requests originating from unexpected IP addresses.

  - **Correlate with User Activity:** Investigate if the detected commands align with legitimate user activity. Look for related user sessions and compare them against the timestamp and context of the suspicious requests.

  - **Monitor for Unusual File Changes:** Track changes to web server files or directory structures around the time of detected webshell commands, as attackers often leverage existing binaries or drop additional payloads to aid their activities.

  - **Assess Network Traffic:** Use Network Detection and Response (NDR) tools to examine outbound traffic from the affected server for unusual communication, such as connections to known malicious IPs or excessive data transfers indicating potential data exfiltration.

  ### Prioritization
  Given the high potential impact of webshells facilitating remote command execution and unauthorized access, alerts raised by this detection rule should be treated with high urgency. The likelihood of exploitation targeting web applications is significant, necessitating immediate investigation to prevent further compromise.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of webshell activity, particularly if attackers modify the command syntax or employ obfuscation techniques to evade detection. Furthermore, the rule assumes that the server logs are correctly configured and that HTTP GET requests are specific and detailed enough to include the relevant command strings. If logging is inadequate or improperly configured, the effectiveness of this rule may be compromised, thereby limiting coverage against evolving threats.

