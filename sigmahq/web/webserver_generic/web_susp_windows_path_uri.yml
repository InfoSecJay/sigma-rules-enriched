title: Suspicious Windows Strings In URI
id: 9f6a34b4-2688-4eb7-a7f5-e39fef573d0e
status: test
description: Detects suspicious Windows strings in URI which could indicate possible
  exfiltration or webshell communication
references:
- https://thedfirreport.com/2022/06/06/will-the-real-msiexec-please-stand-up-exploit-leads-to-data-exfiltration/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-06
modified: 2023-01-02
tags:
- attack.persistence
- attack.exfiltration
- attack.t1505.003
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains:
    - '=C:/Users'
    - '=C:/Program%20Files'
    - '=C:/Windows'
    - '=C%3A%5CUsers'
    - '=C%3A%5CProgram%20Files'
    - '=C%3A%5CWindows'
  condition: selection
falsepositives:
- Legitimate application and websites that use windows paths in their URL
level: high
note: |
  ### Technical Context
  This rule detects the presence of suspicious Windows file paths in URIs, which may indicate potential data exfiltration or webshell communication. Attackers often use unusual or unexpected paths when attempting to communicate with compromised systems or send sensitive information to external servers. The presence of such patterns in web server logs can indicate an ongoing attack where the adversary is attempting to extract data or maintain persistence within the environment.

  The threat scenario may involve an adversary utilizing a webshell or leveraging vulnerabilities in web applications to execute commands on a compromised Windows system. This behavior can fall under the MITRE ATT&CK technique of **Exfiltration Over Web Service (T1041)** or **Application Layer Protocol (T1071)**, both of which focus on how attackers utilize web services for data exfiltration. Additionally, the technique of **Web Shell (T1505.003)** indicates that an attacker is actively controlling a compromised web application to carry out their objectives.

  Primary data sources for monitoring this detection rule include **web server logs** that capture HTTP request details, specifically focusing on URIs to identify any indications of potential malicious activity involving Windows file paths.

  ### Investigation Steps
  - **Review Web Server Logs**: Examine logs from the web server to identify the specific requests that triggered the alert. Look for unusual patterns or high-frequency requests containing Windows file paths.
  - **Analyze User Activity**: Investigate the user accounts associated with the alerts to determine if there are any anomalous behaviors, such as unauthorized access to files or unusual administrative privileges.
  - **Check for Compromised Web Applications**: Assess the integrity of your web applications for vulnerability exploitation. Look for signs of webshell uploads or unauthorized modifications that could facilitate remote access.
  - **Correlate with Threat Intelligence**: Cross-reference the identified URI patterns with threat intelligence feeds to see if similar activities have been reported in known attacks.

  ### Prioritization
  The severity of this alert is high, as the presence of suspicious Windows strings in URI can indicate active exfiltration efforts or the presence of webshells, both of which pose significant risks to data integrity and confidentiality within the enterprise environment.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the possibility of legitimate applications or users generating similar URI patterns, which could lead to false positives. The detection logic assumes that all requests containing Windows paths are malicious; thus, additional context around user behavior and historical patterns of legitimate web traffic is essential. For the alert to function optimally, comprehensive web server logging must be enabled and properly configured to capture all relevant URI queries.

