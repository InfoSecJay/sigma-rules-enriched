detection:
  selection:
    cs-uri-query|contains:
    - '=C:/Users'
    - '=C:/Program%20Files'
    - '=C:/Windows'
    - '=C%3A%5CUsers'
    - '=C%3A%5CProgram%20Files'
    - '=C%3A%5CWindows'
  condition: selection
falsepositives:
- Legitimate application and websites that use windows paths in their URL
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious URI query strings that may contain Windows file paths, which could indicate potential exfiltration attempts or webshell activity. Attackers may leverage these strings to access, manipulate, or extract sensitive data from compromised systems. The related MITRE ATT&CK technique is T1505.003 (Web Shells), with its primary focus on persistence and exfiltration tactics.

  The main telemetry source is web server logs, specifically analyzing the query strings within URI requests. Identify log types that contain `cs-uri-query` parameters, which provide insight into the requests received by the server. If malicious, this activity could lead to unauthorized access to files and critical data exposure. However, this detection alone does not confirm that an attack is occurring; it merely highlights potentially anomalous behavior that warrants further investigation.

  ### Investigation Steps

  - **Review web server access logs:** Look for entries containing `cs-uri-query` with indicators like `=C:/Users`, `=C:/Program%20Files`, or `=C:/Windows` (e.g., IIS logs: Log file fields `cs-uri-query`). Compare with legitimate traffic patterns.

  - **Identify expected benign activity:** Determine if the URI request corresponds to known applications or internal services. Typical legitimate queries may not include Windows file paths or usually involve standard web applications.

  - **Correlate with system logs:** Check Windows Event ID 4624 (Logon) and 4688 (Process Creation) to see if a user account initiated processes around the same timestamp as the suspicious URI activity, confirming user interaction.

  - **Validate against exfiltration patterns:** Assess whether the source IP or user agent exhibits patterns typical of automated tools or suspicious entities, which may correspond with the use of webshells.

  - **Examine high-confidence malicious indicators:** If the detected string contains encoded paths leading to sensitive files (e.g., `=C%3A%5CUsers`), flag for immediate containment and remediation actions.

  ### Prioritization

  This alert is considered high severity due to the potential impact with compromised systems exposing sensitive information. The likelihood of malicious abuse is elevated, as the presence of Windows file paths in URI strings is not typical and is frequently exploited in real attack scenarios.

  ### Blind Spots and Assumptions

  There are limitations regarding the detection of obfuscated or encoded web requests that may evade this alert. The visibility of web server logs may require comprehensive configurations to ensure all relevant parameters are logged. Additionally, certain legitimate applications may inadvertently trigger this alert by using Windows paths in their requests, necessitating contextual analysis. Companion detections, such as monitoring for known bad IP addresses in firewall logs, can strengthen overall coverage against related threats.

