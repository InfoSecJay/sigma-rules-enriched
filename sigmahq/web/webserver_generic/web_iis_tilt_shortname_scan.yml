note: |
  ### Technical Context

  This rule detects successful IIS shortname fuzzing scans by identifying requests made to an IIS server that contain the symbol "~" in the query string, specifically targeting a missing directory structure in older .NET frameworks. The likely attacker objective is to exploit the server's folder enumeration vulnerabilities for reconnaissance purposes, potentially leading to further exploitation of the web application or server. This behavior aligns with the MITRE ATT&CK tactic of Initial Access (TA0001) and technique T1190 (Exploit Public-Facing Application).

  Primary telemetry sources include web server logs, particularly for IIS servers, which capture HTTP request details. Key log types include URL query logs, HTTP methods, and response codes. If malicious, it may indicate an attacker is gathering sensitive information that could facilitate unauthorized access or exploitation. It's important to note that this detection does NOT confirm actual exploitation or compromise of the system on its own.

  ### Investigation Steps

  - **Review relevant web server logs:** Analyze IIS logs (typically located at C:\inetpub\logs\LogFiles) for Event ID details, focusing on requests with `cs-uri-query` values containing "~1" and methods `GET` or `OPTIONS` producing response codes 200 or 301.

  - **Identify benign usage patterns:** Verify if the detected requests align with normal business operations, such as automated service probing or legitimate development testing, particularly for older .NET applications that might utilize short naming conventions.

  - **Pinpoint high-confidence malicious indicators:** Seek multiple instances of the same or similar requests, particularly those repeatably targeting a single endpoint. Findings should show requests exhibiting the characteristics in the detection criteria across multiple users/IPs within a short timespan.

  - **Analyze request peaks in timing:** Examine the timestamps of the requests to identify any surge or anomalies, suggesting potential scanning behavior that deviates from typical user interaction patterns (e.g., embedded scripts vs. manual access).

  - **Cross-reference with external threat intelligence:** Check for known signatures or patterns associated with fuzzing tools that are reported online (e.g., scanner tools mentioned in the references) to validate the nature of the HTTP requests.

  - **Assess web application criticality:** Understand the asset role of the affected IIS server (e.g., public-facing, internal) to evaluate the potential impact of the detected behavior and the urgency of response required.

  ### Prioritization

  This alert is medium severity due to the potential for compromising web servers which are often critical assets. The likelihood of malicious use is moderate, especially against outdated configurations, as this technique is commonly misused in reconnaissance phases. Weaponization is plausible, particularly in environments with weak security postures.

  ### Blind Spots and Assumptions

  Detection limitations may arise from the use of legitimate tools or administrative access that could cause false positives. There may be a dependency on specific IIS logging configurations to capture necessary telemetry. Additionally, automated scripts and other network services could trigger similar alerts without malicious intent. A related detection that could enhance coverage includes monitoring for frequent HTTP 404 responses which may indicate probing for additional valid paths.

