logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains: '~1'
    cs-uri-query|endswith: 'a.aspx'
    cs-method:
    - GET
    - OPTIONS
        # Success only
    sc-status:
    - 200
    - 301
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potential IIS shortname fuzzing attacks, where an attacker attempts to discover sensitive directories or files on a web server by leveraging the legacy .NET framework. The exploitation involves sending crafted HTTP requests that include the tilde character (`~`), which can enumerate short file or directory names, potentially leading to information disclosure. By successfully retrieving URIs that include the `~` character in their queries and receive HTTP status codes indicative of valid responses (like 200 or 301), the attacker may infer the presence of specific files or resources.

  The primary objective of such attacks is likely to gather information about the structure of the web application and identify targets for subsequent exploitation attempts. This behavior aligns with the MITRE ATT&CK tactics for **Initial Access (TA0001)**, specifically technique **T1190: Exploit Public-Facing Application**. The relevant data sources for detecting this type of activity include web server logs, where entries related to HTTP requests can reveal suspicious patterns indicative of fuzzing attempts.

  ### Investigation Steps
  - **Review Web Server Logs:** Examine entries within the IIS logs that display requests containing the `~` symbol in the URI, particularly those that end with `.aspx`. Look for anomalous patterns or repeated access attempts from single IP addresses.

  - **Correlate with User-Agent Strings:** Analyze the User-Agent headers for the suspicious requests to determine if they correspond to known browser types or scanning tools. Unusual User-Agent strings may indicate automated tools engaged in fuzzing activities.

  - **Identify Referrer Information:** Investigate the "cs-referer" field in the logs to see if there are any abnormal or unexpected referrers that might indicate malicious activity, especially those leading to the fuzzing attack.

  - **Monitor Application Error Logs:** Check the application's error logs for any entries indicating failed attempts to access paths that include the tilde (`~`). These errors may provide additional context about the attacker’s methodology and the specific resources targeted.

  ### Prioritization
  This alert is assigned a medium severity due to the potential impact of information disclosure from successful fuzzing attacks. Given that sensitive directories could be exposed, it warrants prompt investigation, especially in environments where web applications contain critical data.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of IIS shortname fuzzing, particularly if the requests are obfuscated or the attack pattern evolves. Additionally, it assumes that the web server is configured to log relevant HTTP request details fully, including the query strings. If logging is insufficient or has been altered to exclude sensitive information, the effectiveness of this detection will be compromised. Ensuring that IIS is set up with comprehensive logging capabilities is essential for the success of this rule.

