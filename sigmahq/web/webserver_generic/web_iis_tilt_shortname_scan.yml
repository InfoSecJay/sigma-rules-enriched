  ### Technical Context

  This Sigma rule detects successful HTTP requests targeting IIS web servers where the URI contains the shortname indicator `~`, specifically when querying for resources like `a.aspx`. This pattern is often associated with attackers enumerating directory structures to identify vulnerable files or paths, with the objective of gaining further access or information from the server. Relevant MITRE ATT&CK tactics include Initial Access (TA0001) and the technique of Exploit Public-Facing Applications (T1190). The primary telemetry source is web server logs, focusing on HTTP request entries.

  If malicious, successful shortname fuzzing could lead to directory traversal, data exposure, or exploitation of vulnerabilities related to outdated components. However, this detection alone does not confirm malicious activity—it may also capture legitimate organizational scans or user behavior that happen to match the conditions described.

  ---

  ### Investigation Steps

  - **Analyze HTTP Request Logs**: Review web server logs for Event IDs corresponding to HTTP requests (e.g., IIS Log Format) containing `cs-uri-query` with `~1` and `endswith: 'a.aspx'`. Look for `sc-status` codes of `200` or `301` as potential indicators of success.

  - **Identify Frequent Request Patterns**: Check for an unusually high number of requests from a single source IP address that match the defined conditions. Legitimate user activity typically demonstrates a more balanced request frequency across various resources.

  - **Assess Failed Authorization Attempts**: Examine request logs for signs of prior failed access attempts from the same user-agent or IP. If there are excessive `403` or similar responses preceding the successful hits, it suggests malicious intent.

  - **Cross-reference Known Attack Patterns**: Reference external threat intelligence for known tools like IIS Shortname Scanner which utilize this attack vector. Look for user-agent strings or patterns that match these tools in the logs.

  - **Evaluate Cross-site Scripting (XSS) Attempts**: Identify if the fuzzing attempts may lead to an XSS vulnerability by reviewing for additional query parameters in the same requests, which could indicate further probing for vulnerabilities.

  ---

  ### Prioritization

  The alert is prioritized as medium severity due to the potential impact on exposed web servers. While the direct risk varies by organizational context, the likelihood of this behavior being malicious is moderate, especially in environments where such patterns are not typical. This technique has a history of being weaponized in initial access scenarios.

  ---

  ### Blind Spots and Assumptions

  The detection may miss obfuscated or less common fuzzing techniques not captured by the defined query parameters. It also relies on the presence of web server logs; ensuring that appropriate logging levels are configured is essential for reliable detection. Some benign user activities may trigger this alert, particularly during legitimate testing phases or automated scans. A related detection to consider is monitoring for failed access attempts that may precede successful requests, thereby strengthening coverage on potential misconfigured endpoints.

