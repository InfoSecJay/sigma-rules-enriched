note: |
  ### Technical Context
  This detection rule identifies HTTP requests with empty user agent strings logged by proxy servers. Empty user agents can signify evasive techniques employed by attackers, as they often camouflage malicious traffic and evade detection mechanisms reliant on user agent analysis. Attackers may leverage such HTTP requests to exploit web applications or communicate with command and control (C2) servers without raising suspicion. An empty user agent may also indicate the use of automation tools like PowerShell scripts.

  This behavior is associated with MITRE ATT&CK techniques such as **T1071.001 - Application Layer Protocol: Web Protocols** and **Defense Evasion**, which encompasses tactics that attackers use to evade detection mechanisms related to legitimate user behaviors. The primary source of evidence for these activities would be proxy logs, which record all HTTP requests and associated metadata.

  ### Investigation Steps
  - **Review Proxy Logs:** Analyze proxy server logs for HTTP requests containing empty user agents. Pay particular attention to the frequency and origin of these requests, as well as any associated error messages or unusual patterns.
  - **Check for Automation Tools:** Investigate whether the requests correlate with the use of automation tools or scripts, especially PowerShell scripts leveraging `New-Object Net.WebClient`. Look for any commands that may be initiating requests with empty user agents.
  - **Correlate with Other Activity:** Look for anomalies in user behavior during the same time frame. Analyze if the requests came from known devices or users and check for any additional suspicious activity originating from the same IP addresses.
  - **Scrutinize for Command and Control Indicators:** Investigate further if any web addresses or endpoints contacted by the empty user agent requests match known C2 infrastructures or have been previously flagged in threat intelligence feeds.

  ### Prioritization
  Considering the potential for these requests to indicate malicious activity, the alert carries a medium severity level. While the impact can be significant if linked to an attack, the likelihood of false positives is non-negligible, necessitating further investigation before conclusions are drawn.

  ### Blind Spots and Assumptions
  One gap in detection coverage is that legitimate applications or users may occasionally send requests with empty user agents, resulting in false positives. The detection logic assumes that empty user agents are always suspicious, which may not hold true in every context. Necessary configurations for the alert to function effectively include comprehensive logging of proxy activity, with logs available for review and analysis within the associated timeframe of the detection.

