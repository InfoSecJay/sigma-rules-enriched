note: |
  ### Technical Context

  This rule detects HTTP requests with an empty User-Agent string in proxy logs, which can indicate potentially anomalous behavior, such as misuse of scripting languages or automated tools that do not properly identify themselves. Attackers may exploit this behavior to conceal the origin of their requests, making it easier to evade detection while executing commands or exfiltrating data. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically the technique for Application Layer Protocol: Web Protocols (T1071.001).

  Primary telemetry sources include proxy logs that capture HTTP request details, specifically looking for log entries with a blank User-Agent field. If successfully malicious, this could enable the attacker to maintain communication with compromised systems or facilitate data exfiltration. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications or scripts can also make requests without a User-Agent.

  ### Investigation Steps

  - **Identify proxy log entries:** Review proxy logs for Event ID related to request activity, focusing on User-Agent fields that are recorded. Use the field `c-useragent: ''` to filter results for empty User-Agent strings.

  - **Examine timestamps and patterns:** Look for patterns in the time and frequency of these requests. Malicious requests often show irregular patterns or spikes in short time frames, particularly outside of business hours.

  - **Validate against known applications:** Cross-reference these requests with known applications in your environment. Legitimate tools like certain automated system maintenance scripts may generate requests without a User-Agent. Investigate any unfamiliar or undocumented applications making such requests.

  - **Check for associated activities:** Look for other suspicious behavior coinciding with empty User-Agent requests, such as outbound connections to unusual IP addresses or domain names. Investigate connections made within a short time before or after these requests.

  - **Review proxy logs for suspicious methods:** Identify the HTTP methods used alongside empty User-Agent strings. Uncommon methods like PUT or DELETE may indicate attempts to alter or upload data maliciously.

  ### Prioritization

  This alert is considered medium severity due to the potential for command and control activities through improperly identified requests, which can be indicative of an active threat. The impacted systems’ roles, especially if they host sensitive data or services, increase the urgency of investigation. While empty User-Agent strings can occur in benign scenarios, alerts warrant close examination due to potential exploitation by attackers.

  ### Blind Spots and Assumptions

  Detection may be evaded by attackers using obfuscation techniques or legitimate tools that, by design, omit User-Agent strings. Reliable detection requires comprehensive proxy logging configurations; ensure logs capture full HTTP request details. Legitimate applications, such as certain debugging tools or scripts, may trigger these alerts. A companion detection strategy could involve monitoring for other suspicious HTTP behavior, such as abnormal request methods or unusual destination IP addresses, to strengthen coverage.

