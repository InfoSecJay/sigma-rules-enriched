  ---

  ### Technical Context

  This Sigma rule detects HTTP requests with an empty User-Agent string in proxy logs. Such behavior may indicate attempts by attackers to use automated tools or scripts to interact with web services while avoiding detection, potentially indicating reconnaissance or initial command-and-control activity. This activity aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique Command and Control over Web Services (T1071.001).

  Primary telemetry sources for this rule include web proxy logs that capture HTTP request details, particularly focusing on the User-Agent header. If malicious, successful exploitation could facilitate data exfiltration or unauthorized access to services. Importantly, this detection does NOT confirm malicious intent on its own, as there may be legitimate scenarios where a User-Agent is omitted.

  ---

  ### Investigation Steps

  - **Check proxy logs for the alerting event**: Review web proxy logs for entries with an empty User-Agent field (e.g., `c-useragent: ''`). Determine the source IP, time, and targeted URLs.

  - **Cross-reference IP addresses**: Investigate if the IP address observed in the alert has a history of suspicious activity or is blacklisted in threat intelligence feeds.

  - **Identify legitimate use cases**: Determine if legitimate applications, such as certain automated monitoring tools or configurations in a development environment, typically send requests without a User-Agent. Establish baseline behavior for known applications.

  - **Analyze request frequency**: Investigate the frequency and volume of the requests made from the identified source. High volumes of empty User-Agent requests in a short time frame could indicate automated probing.

  - **Assess for potential payloads**: Check for subsequent requests or payload delivery associated with the source of the empty User-Agent requests. Examine for signs of additional suspicious parameters or the use of atypical request methods.

  - **Verify proxy configuration**: Ensure that the proxy server is configured to capture all necessary log details, including User-Agent fields. Identify any potential gaps in logging settings that might allow adversarial activity to go unnoticed.

  ---

  ### Prioritization

  This alert is of medium severity, as an affected system could be indicative of reconnaissance activity or a precursor to a more serious attack. The likelihood of malicious use is moderate due to the potential association with automated attacks. However, empty User-Agent strings may not always imply malicious intent, as they may occur during legitimate automated processes.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through legitimate tools that deliberately omit the User-Agent string. Reliable detection requires comprehensive logging from the proxy, ensuring that the User-Agent and other relevant fields are captured consistently. Additionally, legitimate automated scripts or applications may trigger this alert unintentionally, leading to false positives. Companion detections, such as monitoring for unusual redirect behavior or other anomalous HTTP request patterns, can help strengthen overall coverage.

