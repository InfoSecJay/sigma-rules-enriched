note: |
  ### Technical Context

  This rule detects HTTP requests with an empty User-Agent string, which may indicate potentially malicious activity. Attackers often manipulate headers to obscure their actions, which can support various objectives including command-and-control (C2) communications. This behavior fits into the MITRE ATT&CK framework under the tactic “Command and Control” (TA0011) and the technique “Application Layer Protocol: Web Protocols” (T1071.001).

  The primary telemetry sources for this detection are proxy logs that capture HTTP request details. A malicious HTTP request lacking a User-Agent could signify an atypical method of communication with an external server. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate applications can also generate requests with empty User-Agent strings.

  ### Investigation Steps

  - **Review proxy logs for User-Agent strings:** Check the proxy log entries for Event IDs pertaining to HTTP traffic (e.g., Web Proxy logs) to identify requests with an empty User-Agent. Note the timestamp, source IP, and destination URL.

  - **Correlate with known malicious IPs:** Search for the destination IP against threat intelligence feeds to see if it aligns with known malicious infrastructure. An external connection to a suspicious domain significantly increases the likelihood of malicious intent.

  - **Identify legitimate activity:** Look for legitimate applications that may use an empty User-Agent (e.g., scripting tools or specific automated processes). Ensure that these connections are tied to recognized and authorized applications.

  - **Examine HTTP request methods:** Analyze the overall request methods (e.g., GET, POST) associated with the empty User-Agent entries. Requests using uncommon methods alongside this header (like PUT or DELETE) could indicate malicious behavior.

  - **Inspect for additional suspicious patterns:** Review related logs for other anomalies around the same time frame (e.g., abnormal traffic volume, connections during off-hours) which could suggest an ongoing attack or reconnaissance.

  - **Validate any resultant files or exfiltration attempts:** Check for any subsequent file transfers or downloads associated with the identified requests (e.g., file artifacts from Event ID 4688 on Windows indicating process creation) that may indicate data exfiltration or malware delivery.

  ### Prioritization

  This alert is categorized as medium severity due to potential impacts on systems or data confidentiality. The likelihood of malicious abuse is moderate, given that the use of an empty User-Agent is not common but can indicate evasive tactics in a malicious workflow. While not a guaranteed sign of compromise, the behavior is unusual and warrants further investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques, as attackers could spoof User-Agent strings or utilize standard tools that don't send typical headers. Requires comprehensive logging configuration on proxy devices to ensure all HTTP traffic is captured. Legitimate automated tools and applications may generate empty User-Agent fields, leading to false positives. A related detection is monitoring for unusual outbound network connections (e.g., DNS logs or firewall exits) that can provide further evidence of C2 activity.

