detection:
  selection:
    c-useragent: 'Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko'
    cs-uri:
    - '/admin/get.php'
    - '/news.php'
    - '/login/process.php'
    cs-method: 'POST'
  condition: selection
falsepositives:
- Valid requests with this exact user agent to server scripts of the defined names
level: high
note: |
  ### Technical Context
  This detection rule identifies malicious traffic associated with Empire agents, specifically focusing on suspicious user agent strings and URI paths commonly used in command-and-control (C2) communications. Attackers leveraging Empire typically employ this tool to execute commands on compromised systems and maintain control over them, often masquerading their activities to evade detection. The user agent string `Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko` is indicative of a crafted request, while targeted URI paths such as `/admin/get.php`, `/news.php`, and `/login/process.php` suggest specific endpoints being exploited or abused.

  The relevant MITRE ATT&CK techniques involved in this detection include:
  - **T1071.001: Application Layer Protocol: Web Protocols** - This technique encompasses the use of various web-based communication methods for command-and-control.
  - **T1203: Exploitation for Client Execution** - It underscores the attacker's intent to exploit weaknesses in web applications to execute their payload.

  Primary data sources for this detection include proxy logs, which can reveal outbound traffic patterns that match the criteria specified in the detection logic. Collecting and analyzing these logs can help analysts identify potentially harmful activities facilitated by the Empire framework.

  ### Investigation Steps
  - **Review Proxy Logs:** Examine proxy logs for outbound connections matching the specified user agent string and the targeted URIs. Look for associated HTTP methods (POST) that indicate potential data exfiltration or command execution attempts.
  - **Correlate with Endpoint Activity:** Check endpoint detection and response (EDR) logs for any related process creation events that may indicate the Empire agent is executing commands on compromised hosts. Focus on unusual process behaviors that coincide with the proxy alerts.
  - **Analyze Network Traffic:** Use network detection and response (NDR) tools to analyze traffic patterns for any established connections to known malicious IPs or domains associated with Empire. Pay attention to unusual spikes in traffic or connections to the relevant URIs.
  - **Investigate User Behavior:** Conduct a review of the user account activities related to the alerts. Identify whether any unauthorized access or anomalies exist that could link back to compromised credentials used by the attacker.

  ### Prioritization
  This alert is categorized as high severity because it signals potential C2 activity associated with a known exploitation framework. The impact of successful command execution by an attacker can lead to data breaches, system compromise, and significant operational disruption.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage could be valid user requests that happen to match the specified user agent and URI paths, leading to false positives. Additionally, if proxies do not capture certain traffic or if SSL connections bypass proxy inspection, malicious activities may remain undetected. The detection logic assumes that the defined user agent and URIs are exclusively used by Empire agents, which may not be the case in all environments. Proper logging configurations for proxy servers are essential for this alert to function correctly, ensuring comprehensive visibility into HTTP requests processed by the system.

