note: |
  ### Technical Context

  This Sigma rule detects command-and-control (C2) traffic from the Empire framework through specific HTTP user agents and URI paths. The primary objective of the attacker is to maintain remote access and execute commands on compromised systems while evading detection. This activity aligns with the MITRE ATT&CK tactic of Command and Control (T1071.001).

  The primary telemetry sources for this rule include proxy logs that capture HTTP requests, specifically focusing on fields like the `c-useragent`, `cs-uri`, and `cs-method`. If malicious, the detected behavior indicates a potential ongoing compromise of the network, as Empire is typically used for post-exploitation actions. This alert does NOT confirm that a breach has occurred on its own; it merely indicates suspicious traffic that warrants further investigation.

  ### Investigation Steps

  - **Review the proxy logs for the specified user agent:** Check for occurrences of `c-useragent` matching 'Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko' to identify potential Empire traffic.

  - **Analyze specific endpoint activity:** Look for HTTP `POST` requests to `/admin/get.php`, `/news.php`, or `/login/process.php` in proxy logs (Event ID or log format depends on the system used). Investigate around timestamps of these requests for abnormal activities.

  - **Cross-reference affected systems:** Identify systems generating this traffic and evaluate their roles (e.g., web servers). Compare any known legitimate traffic patterns against anomalous activity.

  - **Look for high-confidence indicators of compromise:** Search for signs of infection on endpoints like execution of PowerShell commands associated with Empire, focusing on PowerShell logs (Event ID 4103) for execution directives.

  - **Validate legitimate traffic patterns:** Determine if the identified user agent and URIs are expected for any authorized applications or processes on the network. Document any regular business functions that might generate similar requests.

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems coupled with the likelihood of exploitation through known C2 vectors. Given the popularity of Empire as a tool for post-exploitation, such traffic is a strong indicator of potential malicious activity.

  ### Blind Spots and Assumptions

  Detection may miss traffic if adversaries spoof legitimate user agents or utilize different URI paths, complicating recognition of the threat. Additionally, the effectiveness of this detection relies on comprehensive proxy logging configurations and uninterrupted logging of all HTTP traffic. Legitimate activity such as scheduled tasks or internal scripts could trigger the alert with the same user agent. A companion detection such as monitoring PowerShell script executions (via Sysmon or Windows Event Logs) can provide additional visibility into potential compromises associated with this behavior.

