note: |
  ### Technical Context

  This Sigma rule detects HTTP POST requests originating from clients using a specific user agent string commonly associated with Empire agents, targeting particular URIs that may signal command and control (C2) communication. The likely attacker objective is to exploit vulnerable web applications, gain unauthorized access, or execute arbitrary commands under the guise of legitimate traffic. This behavior aligns with the MITRE ATT&CK technique for Application Layer Protocol: Web Service (T1071.001).

  Primary telemetry sources include web proxy logs, specifically focusing on user agent fields and the request URI patterns. If the detected behavior is malicious, it can lead to unauthorized access and control over systems, potentially culminating in data breaches or lateral movement. However, this detection does NOT inherently confirm malicious activity on its own, as legitimate traffic may use the same user agent and access the specified URIs.

  ### Investigation Steps

  - **Examine the request logs:** Review web proxy logs for Event ID <proxy_event_id> showing requests that match the specific user agent and URIs: targeted requests with POST method to '/admin/get.php', '/news.php', and '/login/process.php' indicate potential malicious activity.

  - **Assess session history:** Investigate the login sessions associated with the user agent string and the defined URIs. Look for requests that show a pattern of access from unusual locations or at odd hours which could signify credential abuse or automated attacks.

  - **Identify high-confidence indicators:** Cross-reference the user agent string with known Empire agent signatures. If this user agent is present in combination with strange request patterns or multiple attempts, it indicates a high confidence that it may be related to a command and control operation.

  - **Validate expected behavior:** Determine if legitimate applications are using the detected user agent to access the URIs. If business applications or internal tools are confirmed to use these requests, document their legitimate traffic to differentiate between benign and suspicious behavior.

  - **Monitor for related actions:** Check for associated malicious activities, such as file uploads or changes to application configurations on the server (Event ID <file_mod_event_id> or <config_change_event_id>) that could corroborate the malicious intent behind using the detected user agent.

  ### Prioritization

  The alert is considered high severity in an enterprise context due to its potential for facilitating exploitative behavior against critical web services. The likelihood of malicious abuse is elevated, given the specificity of the user agent with known deployment scenarios of Empire tools. This particular behavior is commonly weaponized for maintaining persistence or executing additional payloads.

  ### Blind Spots and Assumptions

  Detection limitations may arise from corporate web applications that use the same user agents for legitimate purposes, possibly leading to false positives. Reliable detection requires comprehensive proxy logs that capture all necessary fields, including user agents and request URIs. Legitimate activities that could trigger this alert include normal usage of internal web applications by employees using standard web browsers. A related detection that strengthens coverage includes monitoring for anomalous web application login attempts or failed authentications seen alongside the suspicious user agent traffic.

