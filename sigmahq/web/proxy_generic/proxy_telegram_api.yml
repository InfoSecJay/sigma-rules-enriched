logsource:
  category: proxy
detection:
  selection:
    cs-host: 'api.telegram.org'     # Often used by Bots
  filter:
    c-useragent|contains:
            # Used https://core.telegram.org/bots/samples for this list
    - 'Telegram'
    - 'Bot'
  condition: selection and not filter
falsepositives:
- Legitimate use of Telegram bots in the company
level: medium
note: |
  ### Technical Context

  This Sigma rule detects app requests sent to the Telegram API where the User-Agent string does not match typical identifiers associated with Telegram clients or bots. The likely attacker objective is to leverage the Telegram platform for command and control (C2) operations, sending or receiving instructions from compromised devices unnoticed. This behavior is associated with the MITRE ATT&CK technique for Application Layer Protocol: Command and Control via Web Service (T1071.001) and Remote Command Execution (T1102.002). The primary telemetry source for this detection is proxy logs that include fields like `cs-host` and `c-useragent`. The security impact can be significant if an adversary uses Telegram for malicious purposes, as it can facilitate covert communication with an attacker. This detection does NOT confirm that the activity is malicious; further investigation is needed to establish intent.

  ### Investigation Steps

  - **Verify proxy log entries:** Look for proxy logs with `cs-host` values of 'api.telegram.org'. Record the associated timestamps and IP addresses involved to assess if this corresponds with unusual activity from known users.

  - **Inspect User-Agent strings:** Focus on requests lacking common Telegram identifiers in the `c-useragent`. Legitimate traffic typically contains 'Telegram' or 'Bot'. Absence of these indicates potential malicious activity.

  - **Cross-reference user activity:** Check user activity before and after the alert was triggered. Legitimate users should have established usage patterns with recognized applications that match their roles. Look for deviations that might suggest impersonation or account compromise.

  - **Identify high-confidence indicators:** Note any authentication attempts or subsequent communications from suspicious IPs post-alert. Utilize threat intelligence sources to determine if these IPs are associated with known malicious activity.

  - **Correlate with endpoint behavior:** If available, check Sysmon Event ID 10 (ProcessAccess) and Event ID 1 (ProcessCreation) on the host to see if there are unauthorized processes interacting with the Telegram API, indicating possible malware or scripts in use.

  ### Prioritization

  This alert carries medium severity due to the potential misuse of the Telegram API for C2 communications, which could endanger sensitive enterprise data and operations. Given that Telegram is often exploited by threat actors for stealthy command and control, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate business use of Telegram bots. If non-standard User-Agent strings are used by benign applications or instances, they may trigger false positives. Reliable detection requires comprehensive proxy logging and potentially additional context from endpoint telemetry. Companion detections such as anomalous file activities (e.g., unusual uploads or downloads related to Telegram) could strengthen overall detection and response capabilities.

