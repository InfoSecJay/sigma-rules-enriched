logsource:
  category: proxy
detection:
  selection:
    cs-host: 'api.telegram.org'     # Often used by Bots
  filter:
    c-useragent|contains:
            # Used https://core.telegram.org/bots/samples for this list
    - 'Telegram'
    - 'Bot'
  condition: selection and not filter
falsepositives:
- Legitimate use of Telegram bots in the company
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious requests made to the Telegram API that do not utilize the standard user-agent strings typically associated with legitimate Telegram client applications. Attackers may exploit the Telegram API to facilitate command-and-control (C2) communication, data exfiltration, or other nefarious activities while leveraging the platform’s infrastructure to avoid detection. These requests could indicate the presence of malware, such as trojans or ransomware, which use Telegram's capabilities to manage and control compromised systems.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Command and Control (T1071.001)**, which covers application layer protocols, and **Defense Evasion (T1102.002)**, which addresses the use of standard applications to disguise malicious actions. The primary data sources for monitoring such activities are proxy logs, which record outbound HTTP(S) requests and can capture user-agent strings, allowing analysts to discern between legitimate use and potential threat activity.

  ### Investigation Steps
  - **Review Proxy Logs:** Examine proxy logs to identify outbound connections to `api.telegram.org`. Focus on traffic patterns and correlate timestamps with known account activity within your organization.
  - **Analyze User Agent Strings:** Filter the analyzed connections by the user-agent field to identify any requests that lack the expected Telegram user-agent strings. Pay special attention to requests that do not conform to recognized formats.
  - **Cross-Reference User Activity:** Map the suspicious requests to user and system accounts to determine if they correlate with legitimate user activity. Look for anomalies such as unusual account usage times or geographic locations.
  - **Investigate Related Artifacts:** If suspicious communications are identified, collect relevant artifacts such as process creation logs or any command executions that might provide insight into how the Telegram API was accessed. Additionally, track down any associated malware samples or indicators of compromise.

  ### Prioritization
  This alert should be treated with medium priority as it indicates potentially malicious activity involving the use of a legitimate platform for illicit purposes. Given the increasing prevalence of malware using messaging APIs for C2, timely response is crucial to prevent data leaks or further system compromises.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage is the legitimate use of Telegram bots within the organization, which may lead to false positives. The detection logic assumes that all malicious attempts will not utilize standard user-agent strings, which may not always be the case. Additionally, the effectiveness of this rule relies on comprehensive logging from the proxy server; any misconfigurations that prevent accurate logging of user-agent fields may hinder detection efficacy.

