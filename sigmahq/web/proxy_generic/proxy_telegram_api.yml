logsource:
  category: proxy
detection:
  selection:
    cs-host: 'api.telegram.org'     # Often used by Bots
  filter:
    c-useragent|contains:
            # Used https://core.telegram.org/bots/samples for this list
    - 'Telegram'
    - 'Bot'
  condition: selection and not filter
falsepositives:
- Legitimate use of Telegram bots in the company
level: medium
note: |
  ### Technical Context

  This rule detects HTTP requests made to the Telegram API that do not use the expected Telegram User-Agent, indicating potential misuse of the API for malicious purposes. Such behavior may suggest an attacker is attempting to communicate with compromised devices or exfiltrate data via a covert channel. The relevant MITRE ATT&CK tactic is Command and Control (T1102.002), with the technique of Application Layer Protocol (T1071.001).

  The primary telemetry source is proxy logs, specifically capturing HTTP requests and responses. Security implications include unauthorized data exfiltration or remote command execution by leveraging Telegram’s API to communicate with malwares. Notably, this detection does not confirm malicious activity on its own as legitimate business usage of Telegram bots could trigger the same alerts.

  ### Investigation Steps

  - **Check request details:** Examine proxy logs for Event ID related to web access (e.g., 1116 in Windows Firewall) to identify the time, source IP, and URI paths. Legitimate requests often feature a known Telegram User-Agent (like `TelegramBot`).

  - **Identify anomalous User-Agent strings:** Review User-Agent fields for requests to `api.telegram.org`. Look for suspicious entries that do not conform to expected formats. Any User-Agent strings outside of recognized Telegram patterns may indicate malicious intent.

  - **Correlate with internal bot usage:** Validate if the request correlates with known internal applications or legitimate uses. Identify whether legitimate services in the environment legitimately use the Telegram API, potentially filtering by authorized application signatures.

  - **Analyze outbound traffic volume:** Using NetFlow or equivalent telemetry, review the volume and frequency of requests to the Telegram API from the source IP. Anomalously high or bursty traffic patterns might signify malicious activity, particularly if no legitimate use case is established.

  - **Examine host behavior:** Validate if the requesting host shows other indicators of compromise such as running unauthorized software or unusual process creation (e.g., Security Event ID 4688 for remote code execution scenarios).

  - **Review historical access patterns:** Cross-reference this detection with historical proxy logs to identify patterns in access. Repeated accesses without user context may indicate malicious exploitation of the Telegram API.

  ### Prioritization

  This alert is deemed medium severity given that it involves potential misuse of a well-known communication channel that could be exploited for data exfiltration or controlling compromised endpoints. The likelihood of abuse is moderate, especially among threat actor groups targeting specific populations, as evident in documented cases of malware communication using Telegram.

  ### Blind Spots and Assumptions

  The detection may miss legitimate usage of Telegram bots employed within the organization, which could produce false positives. Evasion techniques might include altering User-Agent strings or using encryption to obscure the traffic. Ensuring comprehensive proxy logging configurations—capturing both metadata and full request details—is vital for reliable detection. A related detection to consider is monitoring for unusual authentication attempts or communications with other command-and-control (C2) infrastructure, which can complement this rule.

