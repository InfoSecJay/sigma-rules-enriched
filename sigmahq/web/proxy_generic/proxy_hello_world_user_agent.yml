note: |
  ### Technical Context
  This rule detects potential network traffic associated with a scraper botnet that utilizes the user-agent string "Hello-World/1.0." Such scraper botnets typically aim to harvest information from websites by automated means, which can lead to data theft, website performance degradation, or other forms of exploitation by malicious actors. The primary objective of an attacker using a scraper botnet would be to gather sensitive information, automate competitive analysis, or disrupt normal operations of targeted web services.

  Relevant MITRE ATT&CK tactics include **Reconnaissance** (TA0043), specifically the technique **Automated Collection** (T1595), where adversaries leverage automated tools to gather data from websites. The detected activity indicates a potential probing nature, where the botnet may be scanning for vulnerabilities or gathering information for more invasive attacks.

  The primary data sources for detecting this activity come from proxy logs, where requests made through the corporate network are recorded. These logs contain information regarding user-agents, request methods, response codes, and destination URLs, providing critical context for identifying unusual or malicious traffic patterns.

  ### Investigation Steps
  - **Review Proxy Logs**: Examine the proxy logs for entries where the user-agent is "Hello-World/1.0" and the HTTP method is "GET." Focus on identifying unusual destination URLs or repeated requests to the same endpoint.
  - **Analyze Traffic Patterns**: Assess the volume and frequency of requests linked to this user-agent. Look for patterns that may suggest automation or bot-like behavior, such as a high number of requests within a short timeframe.
  - **Correlate with Other Data Sources**: Cross-reference the proxy log findings with web server logs, intrusion detection systems, and any available threat intelligence feeds to determine if the observed activity aligns with known malicious behavior or toolsets.
  - **Investigate Source IPs**: Identify the source IP addresses associated with the detected traffic. Consider whether these IPs are internal systems known for legitimate testing or monitoring activity. Apply filters to mitigate false positives from expected traffic.

  ### Prioritization
  The alert has a medium severity level due to the potential impact of scraping activity, which can lead to data leakage and operational disruption if exploited. The likelihood of real threats emerging from such behavior necessitates prompt investigation, especially if it indicates active probing of critical systems.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of scraping behavior, especially if attackers use different user-agent strings or sophisticated techniques to mask their traffic. The rule assumes that the presence of the "Hello-World/1.0" user-agent in GET requests is indicative of malicious activity. For the alert to function effectively, comprehensive logging must be enabled on proxy systems, and network policies need to allow visibility into all outbound web traffic.

