  ### Technical Context

  This rule detects network traffic characterized by the use of the "Hello-World/1.0" user-agent string, suggesting possible reconnaissance activity associated with a scraper botnet. Attackers may use this method to identify and gather information on web-facing systems, potentially looking for vulnerabilities to exploit. The relevant MITRE ATT&CK technique is **Reconnaissance** (T1595).

  The primary telemetry source is proxy logs, with essential log types including user-agent strings and HTTP request methods. If the activity is malicious, it could potentially lead to data exfiltration or system compromise. However, this detection does not confirm malicious intent on its own, as legitimate tools and scripts may also use the same user-agent for benign purposes.

  ---

  ### Investigation Steps

  - **Review proxy logs for user-agent strings:** Filter logs for entries containing the "Hello-World/1.0" user-agent (e.g., Event ID 2000) to identify potential scraping activities.

  - **Check the source IP against internal assets:** Validate whether the traffic originates from expected locations. Legitimate development systems or scanning tools may account for this user-agent, especially if traffic is seen from internal IP ranges.

  - **Analyze GET request patterns:** Examine the frequency and target URLs of the requests; high-frequency requests to multiple endpoints could indicate malicious scanning.

  - **Correlate with other security alerts:** Look for other indicators of compromise or unusual behavior in conjunction with the detected user-agent, such as known vulnerability attempts or exploit patterns.

  - **Validate the context of the activity:** Check for any related legitimate user activity or scheduled tasks that might trigger normal GET requests; this may include maintenance scripts or automated testing tools that could falsely trigger this alert.

  - **Monitor for additional suspicious artifacts:** Investigate for signs of file creation or exfiltration related to the identified traffic, corroborated by tools such as EDR or SIEM for comprehensive insights.

  ---

  ### Prioritization

  This alert carries a medium severity due to its potential impact on web-facing systems while being indicative of reconnaissance activities that can lead to exploitation. While such user-agent strings are somewhat generic, the connection to recognized scraper botnets enhances the urgency to investigate.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate activities such as automated testing or scanning, which can also utilize the "Hello-World/1.0" user-agent. Proxy configurations must be verified to ensure comprehensive coverage of HTTP traffic logs. Related detections could include analysis of anomalous request behaviors or botnet-related traffic signatures, providing layered security monitoring.

