  ### Technical Context

  This rule detects outbound network traffic that includes the user-agent string "Hello-World/1.0," which is commonly associated with a scraper botnet. The likely attacker objective is to gather data from targeted web services or to exploit known vulnerabilities for further penetration. This behavior corresponds with the MITRE ATT&CK technique "Automated Collection" (T1595). The primary telemetry source required for this detection is proxy logs that capture user-agent strings and HTTP request methods. If malicious, this activity could lead to unauthorized data harvesting or exploitation attempts against web applications. It is critical to note that this detection does NOT confirm malicious intent on its own, as the user-agent may also be used by legitimate tools.

  ---

  ### Investigation Steps

  - **Check proxy logs for user-agent specifics**: Review the proxy logs for Event ID 2002 (or equivalent) for all instances containing the user-agent "Hello-World/1.0." Validate the frequency of requests and the endpoints being accessed, noting any unusual patterns.

  - **Identify the source IP of the traffic**: Isolate and investigate the originating IP addresses to ascertain whether they belong to known benign assets or external threat actors. Legitimate internal tools may trigger this user-agent string, typically from development or monitoring systems.

  - **Review requested URLs**: Look at the URLs requested in conjunction with this user-agent. Malicious requests may target sensitive or unusual endpoints, while benign behavior will often conform to standard API access patterns.

  - **Analyze traffic volume and patterns**: Evaluate the volume of requests made using this user-agent over a specific timeframe. A sudden spike in requests could indicate malicious activity as opposed to regular background tasks or periodic scans that may be identifiable via the specific source.

  - **Cross-reference prior activity for context**: Look at historical logs for the source IP and related user-agent strings. Frequently recurring access patterns using the same IP without legitimate business justification may indicate potential botnet activity.

  - **Consult with the asset owner for validation**: Engage with the owner of the affected assets to identify anticipated usage of scraping tools or development work that could be legitimately utilizing the "Hello-World/1.0" user-agent string.

  ---

  ### Prioritization

  This alert should be treated with medium priority due to its potential impact on web service integrity and data confidentiality. The likelihood of malicious abuse is moderate, especially if the traffic is coming from external IP addresses. Since the specific user-agent is less commonly weaponized compared to others, the context of the observed activity is key to determining urgency.

  ---

  ### Blind Spots and Assumptions

  Detection may not capture all instances if the attacker employs obfuscation techniques or variations of the user-agent string. Reliable logging for this detection requires comprehensive proxy logging configurations to ensure all HTTP traffic is fully captured. Legitimate activities such as routine automated tests or crawlers may trigger this rule, reflecting the need for contextual awareness. A related detection, such as identifying other known malicious user-agent strings, would help reinforce coverage and increase alert confidence.

