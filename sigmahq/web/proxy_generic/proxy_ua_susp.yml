title: Suspicious User Agent
id: 7195a772-4b3f-43a4-a210-6a003d65caa1
status: test
description: Detects suspicious malformed user agent strings in proxy logs
references:
- https://github.com/fastly/waf_testbed/blob/8bfc406551f3045e418cbaad7596cff8da331dfc/templates/default/scanners-user-agents.data.erb
author: Florian Roth (Nextron Systems)
date: 2017-07-08
modified: 2022-10-31
tags:
- attack.command-and-control
- attack.t1071.001
logsource:
  category: proxy
detection:
  selection1:
    c-useragent|startswith:
    - 'user-agent'          # User-Agent: User-Agent:
    - 'Mozilla/3.0 '
    - 'Mozilla/2.0 '
    - 'Mozilla/1.0 '
    - 'Mozilla '          # missing slash
    - ' Mozilla/'          # leading space
    - 'Mozila/'          # single 'l'
    - 'Mozilla/4.0 (compatible; MSIE 6.0; MS Web Services Client Protocol'          # https://twitter.com/NtSetDefault/status/1303643299509567488
  selection2:
    c-useragent|contains:
    - ' (compatible;MSIE '          # typical typo - missing space
    - '.0;Windows NT '          # typical typo - missing space
    - 'loader'          # https://twitter.com/securityonion/status/1522614635152744453?s=20&t=gHyPTSq5A27EqKwrCd9ohg
  selection3:
    c-useragent:
    - '_'
    - 'CertUtil URL Agent'          # https://twitter.com/stvemillertime/status/985150675527974912
    - 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:60.0)'          # CobaltStrike Beacon https://unit42.paloaltonetworks.com/tracking-oceanlotus-new-downloader-kerrdown/
    - 'Mozilla/5.0 (Windows NT 6.3; WOW64; rv:28.0) Gecko/20100101 Firefox/28.0'          # used by APT28 malware https://threatvector.cylance.com/en_us/home/inside-the-apt28-dll-backdoor-blitz.html
    - 'HTTPS'          # https://twitter.com/stvemillertime/status/1204437531632250880
    - 'Erbium-UA-4ce7c27cb4be9d32e333bf032c88235a'          # https://www.cyfirma.com/outofband/erbium-stealer-malware-report
    - 'x'          # Use by Racoon Stealer but could be something else
    - 'xxx'          # Use by Racoon Stealer but could be something else
  falsepositives:
  - c-useragent: 'Mozilla/3.0 * Acrobat *'        # Acrobat with linked content
  - cs-host|endswith:       # Adobe product traffic, example: Mozilla/3.0 (compatible; Adobe Synchronizer 10.12.20000)
    - '.acrobat.com'
    - '.adobe.com'
    - '.adobe.io'
  condition: 1 of selection* and not falsepositives
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious, malformed user agent strings in proxy logs that may indicate abnormal or malicious activity. Attackers often manipulate user agent strings to evade detection or impersonate legitimate web traffic, with objectives including reconnaissance, command-and-control (C2) communication, or initial access. This behavior maps to the MITRE ATT&CK framework under the Tactic “Command and Control” (TA0011) and Technique “Application Layer Protocol” (T1071.001). Primary telemetry sources for this detection include proxy logs, specifically targeting the `c-useragent` field where user agent strings are recorded.

  If the detected behavior is malicious, it could indicate an active compromise or ongoing exploitation of network resources. However, the detection does NOT confirm that malicious activity is occurring on its own; further investigation is required to determine intent and impact.

  ### Investigation Steps

  - **Review the user agent string:** Analyze the `c-useragent` field from the proxy logs (e.g., Event ID 1111 in Windows proxy logs) for any entries matching high-risk patterns, such as "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:60.0)" which indicates a Cobalt Strike beacon.

  - **Identify benign user agent patterns:** Check recent user agent entries to identify legitimate activity, such as standard user agent strings from known applications (e.g., "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"). Recognizing typical patterns helps reduce false positives.

  - **Correlate suspicious traffic with host activity:** Examine logs for the IPs generating the alerts and analyze related events (e.g., Security Event ID 4624 for logon) to verify if the activities correlate with permitted user behavior or if they deviate significantly.

  - **Investigate for malware persistence indicators:** Look for indicators of compromise (IOCs) related to malware associated with suspicious user agents, such as `CertUtil URL Agent` or `Racoon Stealer`. Check for file creations related to these agents and validates through process monitoring logs (Sysmon Event ID 1).

  - **Validate proxy configurations for accuracy:** Ensure that proxy logs are correctly configured to capture detailed user agent strings. Misconfigured proxies can lead to missing vital information, hindering detection capabilities.

  ### Prioritization

  This alert is of high severity given its potential impact on enterprise environments, where compromised systems can lead to data breaches or unauthorized access. The nature of malformed user agent strings is often weaponized by adversaries to craft tailored exploit approaches, contributing to the elevated risk associated with detected events.

  ### Blind Spots and Assumptions

  Detection limitations may include evasion techniques such as legitimate applications using ambiguous or malformed user agent strings that could create false positives. Reliable detection requires comprehensive proxy logging configurations that capture all traffic while ensuring user agent normalization. Legitimate activities might include automated systems generating malformed user agents. A related detection could be monitoring for unusual outbound connections that align with user agent anomalies, enhancing overall risk assessment.

