title: Suspicious User Agent
id: 7195a772-4b3f-43a4-a210-6a003d65caa1
status: test
description: Detects suspicious malformed user agent strings in proxy logs
references:
- https://github.com/fastly/waf_testbed/blob/8bfc406551f3045e418cbaad7596cff8da331dfc/templates/default/scanners-user-agents.data.erb
author: Florian Roth (Nextron Systems)
date: 2017-07-08
modified: 2022-10-31
tags:
- attack.command-and-control
- attack.t1071.001
logsource:
  category: proxy
detection:
  selection1:
    c-useragent|startswith:
    - 'user-agent'          # User-Agent: User-Agent:
    - 'Mozilla/3.0 '
    - 'Mozilla/2.0 '
    - 'Mozilla/1.0 '
    - 'Mozilla '          # missing slash
    - ' Mozilla/'          # leading space
    - 'Mozila/'          # single 'l'
    - 'Mozilla/4.0 (compatible; MSIE 6.0; MS Web Services Client Protocol'          # https://twitter.com/NtSetDefault/status/1303643299509567488
  selection2:
    c-useragent|contains:
    - ' (compatible;MSIE '          # typical typo - missing space
    - '.0;Windows NT '          # typical typo - missing space
    - 'loader'          # https://twitter.com/securityonion/status/1522614635152744453?s=20&t=gHyPTSq5A27EqKwrCd9ohg
  selection3:
    c-useragent:
    - '_'
    - 'CertUtil URL Agent'          # https://twitter.com/stvemillertime/status/985150675527974912
    - 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:60.0)'          # CobaltStrike Beacon https://unit42.paloaltonetworks.com/tracking-oceanlotus-new-downloader-kerrdown/
    - 'Mozilla/5.0 (Windows NT 6.3; WOW64; rv:28.0) Gecko/20100101 Firefox/28.0'          # used by APT28 malware https://threatvector.cylance.com/en_us/home/inside-the-apt28-dll-backdoor-blitz.html
    - 'HTTPS'          # https://twitter.com/stvemillertime/status/1204437531632250880
    - 'Erbium-UA-4ce7c27cb4be9d32e333bf032c88235a'          # https://www.cyfirma.com/outofband/erbium-stealer-malware-report
    - 'x'          # Use by Racoon Stealer but could be something else
    - 'xxx'          # Use by Racoon Stealer but could be something else
  falsepositives:
  - c-useragent: 'Mozilla/3.0 * Acrobat *'        # Acrobat with linked content
  - cs-host|endswith:       # Adobe product traffic, example: Mozilla/3.0 (compatible; Adobe Synchronizer 10.12.20000)
    - '.acrobat.com'
    - '.adobe.com'
    - '.adobe.io'
  condition: 1 of selection* and not falsepositives
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects suspicious and malformed user agent strings within proxy logs, which can indicate unauthorized or malicious activity. Attackers often use unconventional user agent strings to bypass detection mechanisms, to imitate legitimate traffic, or to camouflage their activities. By identifying these anomalies, security teams can better mitigate threats such as command-and-control communications, web application exploitation, or malicious downloads.

  The suspected threat actors utilizing these techniques may be targeting sensitive data or attempting to establish footholds in the network. The detected user agent strings are associated with various malware families, including Cobalt Strike and Racoon Stealer, indicating behavior typical of advanced persistent threats and other malicious actors. Relevant MITRE ATT&CK tactics and techniques associated with this detection include "Command and Control" (TA0011) and "Application Layer Protocol" (T1071.001).

  Primary data sources for effective detection include proxy logs, which capture outbound and inbound web traffic, and can show patterns of unusual user agent strings, linking them back to potential malicious activities.

  ### Investigation Steps
  - **Review Proxy Logs:** Collect proxy logs during the time of the alert and extract entries corresponding to the identified suspicious user agent strings. Correlate these logs with the users or devices involved for further context.
  - **Analyze Associated Payloads:** Investigate any downloads or web traffic that correlated with the suspicious user agent strings. This can reveal potential malware deliveries or interactions with known malicious domains.
  - **Identify Affected Systems:** Determine which endpoints are associated with the user agents flagged, and evaluate the health and security posture of those systems, looking for signs of compromise or unusual behavior.
  - **Monitor Additional Indicators:** Set up alerts for other related anomalies in user agent strings or abnormal traffic patterns, as sophisticated attackers may continuously modify their tactics.

  ### Prioritization
  This alert is classified as high severity because the presence of malformed user agent strings can indicate an active breach or advanced threat attempting to establish control in the enterprise environment. The likelihood of exploitation using these methods is significant, especially against high-value targets.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if not all proxy logs are captured or if there are configurations that exclude certain traffic. The detection logic assumes that attackers will use identifiable patterns in their user agents, potentially missing highly obfuscated user agent strings or legitimate applications that could erroneously trigger the alert. Ensuring comprehensive logging and proper configuration is essential for optimal functioning of this alerting mechanism.

