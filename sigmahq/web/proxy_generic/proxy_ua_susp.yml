title: Suspicious User Agent
id: 7195a772-4b3f-43a4-a210-6a003d65caa1
status: test
description: Detects suspicious malformed user agent strings in proxy logs
references:
- https://github.com/fastly/waf_testbed/blob/8bfc406551f3045e418cbaad7596cff8da331dfc/templates/default/scanners-user-agents.data.erb
author: Florian Roth (Nextron Systems)
date: 2017-07-08
modified: 2022-10-31
tags:
- attack.command-and-control
- attack.t1071.001
logsource:
  category: proxy
detection:
  selection1:
    c-useragent|startswith:
    - 'user-agent'          # User-Agent: User-Agent:
    - 'Mozilla/3.0 '
    - 'Mozilla/2.0 '
    - 'Mozilla/1.0 '
    - 'Mozilla '          # missing slash
    - ' Mozilla/'          # leading space
    - 'Mozila/'          # single 'l'
    - 'Mozilla/4.0 (compatible; MSIE 6.0; MS Web Services Client Protocol'          # https://twitter.com/NtSetDefault/status/1303643299509567488
  selection2:
    c-useragent|contains:
    - ' (compatible;MSIE '          # typical typo - missing space
    - '.0;Windows NT '          # typical typo - missing space
    - 'loader'          # https://twitter.com/securityonion/status/1522614635152744453?s=20&t=gHyPTSq5A27EqKwrCd9ohg
  selection3:
    c-useragent:
    - '_'
    - 'CertUtil URL Agent'          # https://twitter.com/stvemillertime/status/985150675527974912
    - 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:60.0)'          # CobaltStrike Beacon https://unit42.paloaltonetworks.com/tracking-oceanlotus-new-downloader-kerrdown/
    - 'Mozilla/5.0 (Windows NT 6.3; WOW64; rv:28.0) Gecko/20100101 Firefox/28.0'          # used by APT28 malware https://threatvector.cylance.com/en_us/home/inside-the-apt28-dll-backdoor-blitz.html
    - 'HTTPS'          # https://twitter.com/stvemillertime/status/1204437531632250880
    - 'Erbium-UA-4ce7c27cb4be9d32e333bf032c88235a'          # https://www.cyfirma.com/outofband/erbium-stealer-malware-report
    - 'x'          # Use by Racoon Stealer but could be something else
    - 'xxx'          # Use by Racoon Stealer but could be something else
  falsepositives:
  - c-useragent: 'Mozilla/3.0 * Acrobat *'        # Acrobat with linked content
  - cs-host|endswith:       # Adobe product traffic, example: Mozilla/3.0 (compatible; Adobe Synchronizer 10.12.20000)
    - '.acrobat.com'
    - '.adobe.com'
    - '.adobe.io'
  condition: 1 of selection* and not falsepositives
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects suspicious or malformed user agent strings in proxy logs, which may indicate attempts to obfuscate malicious activity or evade detection mechanisms. Malicious actors often manipulate user agent strings to disguise automated tools or malware communications, aiming to bypass security controls and blend in with legitimate traffic. This behavior aligns with the MITRE ATT&CK tactic of Command and Control (TA0011) and the technique of Application Layer Protocol (T1071.001).

  The primary telemetry source for this detection is proxy log files containing user agent strings. The security implications of such activity can be significant, as attackers may utilize these methods to exfiltrate data or establish persistent communications with compromised systems. It is important to note that the presence of a suspicious user agent does NOT confirm malicious intent on its own; further context and investigation are vital for a comprehensive assessment.

  ---

  ### Investigation Steps

  - **Check the user agent string:** Review the user agent field (e.g., `c-useragent`) in proxy logs for matches against the detection criteria. Look for entries resembling known malicious user agents (e.g., `Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:60.0)` associated with CobaltStrike).

  - **Assess traffic patterns:** Investigate the volume and frequency of connections from the system showing suspicious user agent activity. Anomalous spikes in traffic or connections to known malicious IPs are strong indicators of malicious intent.

  - **Examine related host activities:** Review Event ID 4688 (Process Creation) and Sysmon Event ID 1 for any processes launched on the affected host that correspond to the time of suspicious proxy log entries. Malicious processes may have command line arguments indicative of user agent manipulation.

  - **Validate legitimate traffic:** Cross-reference the affected system’s user agent strings against known benign patterns, such as those from a legitimate web browsing application (e.g., recent versions of browsers like Chrome or Firefox). Ensure entries for Adobe products do not trigger false positives.

  - **Look for asynchronous behavior:** Investigate the accompanying network logs for outbound TCP connections or DNS requests initiated shortly after the user agent matches. This could indicate command and control communications attempting to exploit the legitimate browsing traffic.

  - **Review false positive configurations:** Make sure that your proxy or web application firewall is accurately configured to avoid logging activity from trusted sources like Adobe Acrobat, ensuring that legitimate traffic does not generate unnecessary alerts.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact if malicious software is utilizing malformed user agents to evade detection. The likelihood of adversaries exploiting this technique is high, given the historical usage of obscured user agents in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may miss variations in user agent manipulation not covered in the existing patterns. Adversaries may employ customizable or newly developed tools to bypass these detections. Additionally, administrative tools or legitimate services that may manipulate user agents could trigger false positives. A companion detection to consider is monitoring DNS queries that correlate with unusual user agent activity, providing deeper visibility into potential command and control operations.

