title: Raw Paste Service Access
id: 5468045b-4fcc-4d1a-973c-c9c9578edacb
status: test
description: Detects direct access to raw pastes in different paste services 
  often used by malware in their second stages to download malicious code in 
  encrypted or encoded form
references:
- https://www.virustotal.com/gui/domain/paste.ee/relations
author: Florian Roth (Nextron Systems)
date: 2019-12-05
modified: 2023-01-19
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1102.001
- attack.t1102.003
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
    - '.paste.ee/r/'
    - '.pastebin.com/raw/'
    - '.hastebin.com/raw/'
    - '.ghostbin.co/paste/*/raw/'
    - 'pastetext.net/'
    - 'pastebin.pl/'
    - 'paste.ee/'
  condition: selection
falsepositives:
- User activity (e.g. developer that shared and copied code snippets and used 
  the raw link instead of just copy & paste)
level: high
note: |
  ### Technical Context

  This Sigma rule detects access to raw paste service URLs often used in post-exploitation scenarios by threat actors to download malicious payloads, scripts, or commands in an encoded or encrypted format. The attacker objective is typically to retrieve and execute payloads that can perform further actions on compromise, such as data exfiltration or lateral movement within the network. This behavior aligns with the MITRE ATT&CK framework under the following techniques: Command and Control (T1071.001) and Application Layer Protocol (T1102.001).

  The primary telemetry source is proxy logs, specifically looking for requests made to known paste service endpoints. If malicious, such activity can lead to significant security incidents, including malware infections and network breaches. It's essential to clarify that this detection does NOT confirm that a successful compromise occurred; it merely indicates an attempt to access potentially harmful content.

  ### Investigation Steps

  - **Check proxy logs for raw paste access:** Review proxy logs for Event ID indicating URL requests related to paste services (e.g., `.paste.ee/r/`, `.pastebin.com/raw/`). Legitimate access often includes URLs with parameters that indicate benign usage, such as user-submitted content for collaboration.

  - **Identify high-confidence malicious indicators:** Look for patterns such as access to multiple raw paste URLs in a short timeframe, especially if originating from the same IP or device. These behaviors are inconsistent with standard user activity and may indicate automated scripts or malware.

  - **Confirm user context:** Analyze the user account accessing the paste services and cross-reference with the asset type (e.g., workstation, server). If the user is a developer or an administrator, verify that their recent activities align with legitimate code-sharing practices.

  - **Monitor for follow-on actions:** If raw paste access is detected, check for subsequent process creations (Security Event ID 4688) that pull files or execute scripts. Look for command-line arguments that reference downloaded content from these paste services.

  - **Evaluate other traffic for correlation:** Examine network traffic logs for increased outbound connections to external IP addresses following raw paste access. This may indicate a command and control (C2) communication attempt.

  - **Assess impact and asset criticality:** Consider the role of the affected host within the organization. If it is a critical asset (e.g., a server hosting sensitive data), escalate the investigation promptly, as the consequences of a breach would be significant.

  ### Prioritization

  This alert has a high severity rating due to the potential impact on the organization's security posture if a compromise occurs. The likelihood of malicious intent is significant, as accessing paste services is commonly associated with malware activity and can directly correlate to subsequent compromise attempts, making this a prime target for exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate user activities (e.g., developers or researchers) triggering the alert when accessing paste services for benign coding purposes. Ensuring comprehensive proxy logging configuration and monitoring is critical for reliable detection. Moreover, closely related detection for outbound connections to known C2 servers can enhance the effectiveness of response efforts.

