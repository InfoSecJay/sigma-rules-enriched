title: Raw Paste Service Access
id: 5468045b-4fcc-4d1a-973c-c9c9578edacb
status: test
description: Detects direct access to raw pastes in different paste services often
  used by malware in their second stages to download malicious code in encrypted or
  encoded form
references:
- https://www.virustotal.com/gui/domain/paste.ee/relations
author: Florian Roth (Nextron Systems)
date: 2019-12-05
modified: 2023-01-19
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1102.001
- attack.t1102.003
- attack.defense-evasion
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
    - '.paste.ee/r/'
    - '.pastebin.com/raw/'
    - '.hastebin.com/raw/'
    - '.ghostbin.co/paste/*/raw/'
    - 'pastetext.net/'
    - 'pastebin.pl/'
    - 'paste.ee/'
  condition: selection
falsepositives:
- User activity (e.g. developer that shared and copied code snippets and used the
  raw link instead of just copy & paste)
level: high
note: |
  ---

  ### Technical Context

  This rule detects direct access to raw paste content from paste services such as Pastebin, Ghostbin, and Hastebin. Attackers may use these platforms to host malware payloads in encrypted or encoded formats, which are later retrieved during the second stage of an attack. The likely attacker objective is to download and execute malicious code without detection.

  Relevant MITRE ATT&CK tactics and techniques include Command and Control (T1071.001), Application Layer Protocol, and Remote File Copy (T1102.001). The primary telemetry sources are web proxy logs, specifically focusing on requests to raw paste URLs. The security impact is significant; accessing these resources could indicate an active compromise leading to data exfiltration or system compromise. Notably, this detection does NOT confirm that a breach has occurred without further contextual investigation.

  ---

  ### Investigation Steps

  - **Examine proxy logs for raw paste access:** Review web proxy logs for requests containing `.paste.ee/r/`, `.pastebin.com/raw/`, or similar patterns (Event ID 8002 for firewall/proxy logs). Note any unusual user behavior or access times.

  - **Identify high-confidence malicious indicators:** Look for a pattern of repeated access to multiple paste services within a short time period, especially from unusual internal hosts or during non-business hours, which may suggest a malware download attempt.

  - **Assess legitimate activity:** Determine if there are users in your environment, such as developers or data scientists, who have a valid reason to share code snippets via paste services. Check for typical user agents and acceptable access patterns.

  - **Correlate with additional telemetry:** Cross-reference the detected paste access with other logs, such as system process creation (Event ID 4688) to see if any processes initiated after the paste access correlate with known malicious signatures.

  - **Validate any payload delivery indicators:** If download activity is confirmed, check local systems for suspicious file creation or installation processes (e.g., look for common malware file extensions or executables).

  - **Review user and asset criticality:** Focus on alerts from high-privilege user accounts or critical systems. Anomalous paste access from these accounts warrants immediate investigation for potential escalation paths.

  ---

  ### Prioritization

  This alert is high-severity given the potential impact on sensitive systems and the likelihood of being exploited by adversaries. The access to paste services is often observed in targeted attacks, making it a common vector for malware distribution.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the ability of attackers to use legitimate paste services for malware hosting, and benign user activities may trigger the alert, such as legitimate code sharing among developers. Required log sources include comprehensive proxy logs with URL details for accurate detection. A companion detection to consider is monitoring for unusual outbound connections to known malicious domains, which can provide further context and validation of the threat.

