title: Raw Paste Service Access
id: 5468045b-4fcc-4d1a-973c-c9c9578edacb
status: test
description: Detects direct access to raw pastes in different paste services often
  used by malware in their second stages to download malicious code in encrypted or
  encoded form
references:
- https://www.virustotal.com/gui/domain/paste.ee/relations
author: Florian Roth (Nextron Systems)
date: 2019-12-05
modified: 2023-01-19
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1102.001
- attack.t1102.003
- attack.defense-evasion
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
    - '.paste.ee/r/'
    - '.pastebin.com/raw/'
    - '.hastebin.com/raw/'
    - '.ghostbin.co/paste/*/raw/'
    - 'pastetext.net/'
    - 'pastebin.pl/'
    - 'paste.ee/'
  condition: selection
falsepositives:
- User activity (e.g. developer that shared and copied code snippets and used the
  raw link instead of just copy & paste)
level: high
note: |
  ### Technical Context
  This rule detects access to raw paste services commonly utilized by attackers to download malicious payloads or exfiltrate data. These services, such as Pastebin and Hastebin, are frequently leveraged in the later stages of an attack for command and control (C2) operations. Attackers may use raw pastes to deliver encrypted or obfuscated code, enabling them to avoid detection by traditional security tools.

  In this context, the typical attacker objective is to securely download malware or exfiltrate sensitive information while minimizing the likelihood of detection. By connecting to these paste services, attackers can potentially execute further stages of their attack, such as executing malware on compromised hosts or facilitating data breaches.

  This detection aligns with several MITRE ATT&CK tactics and techniques, including *Command and Control* (TA0011), specifically techniques T1071.001 (Application Layer Protocol: Web Protocols) and T1102.001 (Web Service, API), among others. Effective sources of telemetry for this detection include proxy logs that capture web traffic and logs indicating direct access to URLs associated with these paste services.

  ### Investigation Steps
  - **Review Proxy Logs**: Analyze proxy logs for any requests targeting identified paste service URLs, focusing on timeframes correlating with other suspicious activity.
  - **Examine Endpoint Activity**: Look for unusual process creation events on endpoints that initiated connections to raw paste URLs, and check for any associated file downloads or executions.
  - **Investigate User Context**: Verify the user context of any detected access to raw paste services to determine if the activity aligns with known business functions or if it raises flags for investigation.
  - **Correlate with Threat Intelligence**: Cross-reference identified access patterns with threat intelligence feeds to check for known malicious activities or associated threat actors using raw paste services.

  ### Prioritization
  The severity of this alert is classified as high due to the potential impact of malware delivery and data exfiltration, which can lead to significant breaches and operational disruptions within an enterprise environment.

  ### Blind Spots and Assumptions
  This rule may not cover all attack vectors, particularly if attackers use less-known or evolving paste services not included in the detection logic. It assumes that proxy logs are adequately configured to capture all relevant web traffic to these paste services. Additionally, legitimate user activities such as developers sharing code snippets could manifest as false positives, highlighting the need for contextual analysis. The overall effectiveness of this rule hinges on the completeness and accuracy of log collection from proxies.

