title: Raw Paste Service Access
id: 5468045b-4fcc-4d1a-973c-c9c9578edacb
status: test
description: Detects direct access to raw pastes in different paste services 
  often used by malware in their second stages to download malicious code in 
  encrypted or encoded form
references:
- https://www.virustotal.com/gui/domain/paste.ee/relations
author: Florian Roth (Nextron Systems)
date: 2019-12-05
modified: 2023-01-19
tags:
- attack.command-and-control
- attack.t1071.001
- attack.t1102.001
- attack.t1102.003
- attack.defense-evasion
logsource:
  category: proxy
detection:
  selection:
    c-uri|contains:
    - '.paste.ee/r/'
    - '.pastebin.com/raw/'
    - '.hastebin.com/raw/'
    - '.ghostbin.co/paste/*/raw/'
    - 'pastetext.net/'
    - 'pastebin.pl/'
    - 'paste.ee/'
  condition: selection
falsepositives:
- User activity (e.g. developer that shared and copied code snippets and used 
  the raw link instead of just copy & paste)
level: high
note: |
  ### Technical Context

  This Sigma rule detects direct access to raw pastes from common paste services that are often utilized by malware to download encoded or encrypted malicious code. The likely attacker objective is to retrieve payloads that can be executed on compromised systems, which typically follows initial access or command-and-control (C2) operations. The rule relates to MITRE ATT&CK tactics, particularly “Command and Control” (TA0011) and techniques such as “Application Layer Protocol” (T1071.001) and “Exfiltration Over Command and Control Channel” (T1102).

  Primary telemetry sources include web proxy logs, which capture HTTP request details for outbound traffic. The security impact could be high if the connection is associated with malware communication. However, this detection alone does not confirm that malicious activity is occurring, as legitimate use cases also exist, such as developers sharing code snippets.

  ### Investigation Steps

  - **Review proxy logs for related traffic**: Check web proxy log entries (e.g., W3C, IIS logs) for URIs containing `.paste.ee/r/`, `.pastebin.com/raw/`, or other specified patterns (e.g., Event ID 1010); correlate these with timestamps of the alert.

  - **Identify source user and asset**: Determine the originating user's role and the asset involved. Legitimate usage may involve development or collaboration activities, particularly related to sharing code snippets.

  - **Cross-reference with known malicious samples**: Use threat intelligence to check if any of the accessed raw paste services or specific URIs match previously identified malicious indicators or malware signatures.

  - **Analyze HTTP header information**: Investigate the HTTP headers within proxy logs for unusual user agent strings or referrer information that indicates circumvention of typical web access patterns.

  - **Search for anomalies in outbound traffic volume**: Look for unusually high outbound traffic volumes to these services that could indicate scripted or automated downloading behavior, with consistent access patterns.

  ### Prioritization

  This alert carries a high severity rating based on the potential impact if a critical asset is compromised. The likelihood of malicious abuse is significant since the behavior is commonly associated with malware downloading payloads through paste services, which are frequently leveraged in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of encrypted traffic (such as HTTPS), which may obscure payload content and intent. The rule relies on accurate proxy logging configurations to ensure all relevant traffic is captured. Legitimate activities that might trigger this alert include developers using these paste services for sharing snippets of code. A related detection that enhances coverage would be monitoring for abnormal outbound requests to multiple paste services within a short time frame, indicating potential automated scraping or retrieval strategies.

