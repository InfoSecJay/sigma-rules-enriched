detection:
  selection:
    c-useragent|startswith:
    - 'Q2hyb21l'         # Chrome Encoded with offset to not include padding
    - 'QXBwbGVXZWJLaX'         # AppleWebKit Encoded with offset to not include padding
    - 'RGFsdmlr'         # Dalvik Encoded with offset to not include padding
    - 'TW96aWxsY'          # Mozilla Encoded with offset to not include padding (as used by YamaBot)
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects suspicious Base64 encoded User-Agent strings observed in HTTP requests, which may be indicative of malware or malicious activity attempting to mask its identity. Attackers often use obfuscation techniques such as encoding to evade basic detection methods and blend in with legitimate traffic. The presence of encoded User-Agent strings can signify that the traffic originates from automated tools, bots, or other nefarious software, potentially linked to command-and-control (C2) activities.

  The likely attacker objectives include establishing communication with compromised hosts, exfiltrating data, or orchestrating further attacks. Notably, this behavior can be associated with various tools and malware families that leverage Base64 encoding as part of their operational security measures. Relevant MITRE ATT&CK tactics include **Command and Control** (TA0011) with techniques like **Application Layer Protocol** (T1071.001) specifically targeting the transport of command and control traffic within legitimate protocols and applications.

  The primary data sources for this detection include proxy logs, which capture outgoing HTTP requests and provide insight into User-Agent strings used for accessing web resources.

  ### Investigation Steps
  - **Review Proxy Logs**: Analyze proxy logs where the suspicious Base64 encoded User-Agent strings were detected. Pay attention to the associated timestamps, source IP addresses, and destinations to understand the context of the requests.

  - **Correlate with Other Events**: Look for other security events or alerts that coincided with the HTTP requests featuring encoded User-Agent strings. Cross-reference with behaviors such as unusual connections, authentication failures, or high volumes of outbound traffic.

  - **Examine Network Traffic**: Utilize network detection and response tools to review traffic flows from the source IP. Investigate whether there’s persistent communication with known malicious C2 servers or any unusual data exfiltration patterns.

  - **Assess Endpoint Behavior**: Inspect affected endpoints for any signs of compromise. Collect and analyze any installed software, process activity, and credential usage that might correlate with malicious activity related to those User-Agent strings.

  ### Prioritization
  Given the potential implications of malware communicating via encoded User-Agent strings, this alert should be treated with medium severity. In an enterprise environment, such activity might indicate an active compromise, warranting prompt investigation to prevent further lateral movement or data loss.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for encoded User-Agent strings that don’t match the specific Base64 patterns defined in the rule, as attackers may continually adapt their obfuscation methods. The detection logic assumes that all relevant traffic will be visible and logged by the proxy infrastructure. Additionally, it requires comprehensive logging configurations on proxy devices to ensure all HTTP requests are captured and analyzed for anomalies.

