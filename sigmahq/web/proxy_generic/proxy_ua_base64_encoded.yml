detection:
  selection:
    c-useragent|startswith:
    - 'Q2hyb21l'         # Chrome Encoded with offset to not include padding
    - 'QXBwbGVXZWJLaX'         # AppleWebKit Encoded with offset to not include padding
    - 'RGFsdmlr'         # Dalvik Encoded with offset to not include padding
    - 'TW96aWxsY'          # Mozilla Encoded with offset to not include padding (as used by YamaBot)
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the presence of suspicious Base64 encoded User-Agent strings often employed by malware for obfuscation purposes. The likely attacker objective is to conceal command-and-control (C2) communications through stealthy HTTP requests, typically aiming to establish a persistent foothold. This behavior is related to the MITRE ATT&CK technique for Command and Control (T1071.001).

  The primary telemetry source for this detection is proxy logs that capture HTTP traffic, highlighting User-Agent strings in requests. If the alerts represent malicious behavior, they could indicate compromised systems communicating with threat actor infrastructure. This detection does NOT confirm that the behavior is malicious or a compromise on its own, as some legitimate applications may encode User-Agent strings for various reasons.

  ### Investigation Steps

  - **Review proxy logs for encoded User-Agents:** Examine for User-Agent strings starting with 'Q2hyb21l', 'QXBwbGVXZWJLaX', 'RGFsdmlr', or 'TW96aWxsY' in proxy log files (Event ID specific to your logging solution), filtering for outbound HTTP requests. Compare against known legitimate User-Agent patterns.

  - **Assess the nature of outbound connections:** Identify associated destination IP addresses and domain names, checking against threat intelligence sources for known bad actors. Malicious indicators may include matching domains with a history of malware activity.

  - **Compare with typical legitimate User-Agent activity:** Document expected User-Agent strings for common applications in your environment. Look for deviations in the User-Agent values of applications that are used generally within the organization.

  - **Verify correlation with other suspicious activity:** Cross-reference alerts with any other suspicious activities detected, such as unexpected file downloads or lateral movement efforts happening on the same host or user account.

  - **Check for high-volume outbound traffic:** Look for any spikes in outbound HTTP requests from the affected user or device correlating to the encoded User-Agent activity. This can indicate potential data exfiltration or abnormal behavior.

  - **Identify asset criticality:** Determine the role of the affected system. If it’s a critical asset (e.g., a server handling sensitive data), prioritize immediate investigation and containment measures.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive environments if malicious. While encoded User-Agent strings can indicate malware activity, they are not universally exploited patterns, making them less common. Given their nature, immediate attention is warranted to assess the legitimacy of the request and underlying system integrity.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques, as adversaries can use different encoding methods or alter User-Agent strings to bypass filtering. Reliable detection requires proper configuration of proxy logs that capture User-Agent values. Legitimate enterprise software may encode User-Agents similarly, which could result in false positives. Related detections for command-and-control communication can enhance coverage and help validate alerts.

