note: |
  ### Technical Context

  This rule detects the use of Windows PowerShell to send HTTP requests, which is indicative of command-and-control (C2) communications. Attackers may employ this technique to download payloads or exfiltrate data, leveraging PowerShell's ability to bypass traditional security controls. The relevant MITRE ATT&CK techniques are Command and Control (T1071.001) via application layer protocols.

  Primary telemetry sources include proxy logs, specifically looking for user-agent strings that contain 'WindowsPowerShell/'. If this behavior is confirmed as malicious, it can lead to severe security impacts, such as unauthorized data access or system compromise. However, it is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may also generate similar traffic.

  ### Investigation Steps

  - **Check proxy logs for specific user agents:** Review proxy logs for entries where the user agent contains 'WindowsPowerShell/'. Note the originating IP and associated username for context.

  - **Correlate user activity with PowerShell usage:** Identify legitimate administrative or scheduled tasks that may involve PowerShell. Cross-reference Event ID 4688 (Process Creation) in the Security logs for known good activity.

  - **Identify high-risk destination IPs:** Examine the URLs accessed by PowerShell requests in the proxy logs. Cross-reference them against threat intelligence sources for known malicious addresses.

  - **Evaluate the frequency and patterns of requests:** Look for repetitive patterns of PowerShell HTTP requests in a short time span, which may indicate scripted or automated behavior indicative of exfiltration.

  - **Analyze response content from the requests:** If possible, capture and analyze the HTTP responses to any PowerShell requests. Look for anomalous content suggesting data exfiltration or payload delivery.

  - **Assess asset criticality:** Determine if the originating host is a critical asset within the environment. Focus investigations on sensitive or high-privilege accounts that might indicate a higher likelihood of compromise.

  ### Prioritization

  This alert has medium severity primarily due to its potential impact on sensitive systems if the activity is confirmed as malicious. Given PowerShell's prevalence in attacks for C2 communications, the likelihood of abuse is high. It is also a common technique utilized in various exploit chains.

  ### Blind Spots and Assumptions

  This detection might miss obfuscated or altered user agents that could be used to evade detection. Reliable identification of this behavior requires proper proxy logging enabled and detailed monitoring of administrative scripts that could trigger false positives. Legitimate administrative activities, such as script execution for downloading updates or retrieving web content, could also generate similar alerts. A related detection to enhance coverage would include monitoring for suspicious PowerShell command executions (e.g., using Sysmon Event ID 1 for process creation).

