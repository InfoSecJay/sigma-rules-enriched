  ---

  ### Technical Context

  This Sigma rule detects the use of Windows PowerShell User Agent in web requests, indicating potential command-and-control communications or data exfiltration activities. The primary attacker objective behind this behavior typically involves concealing malicious traffic under the guise of legitimate PowerShell activity, allowing them to interact with external servers. Relevant MITRE ATT&CK tactic includes **Command and Control** (TA0011) and the technique **Application Layer Protocol** (T1071.001).

  The primary telemetry source is proxy logs capturing user agent strings in web traffic, usually through web filtering or forward proxy configurations. If this activity is malicious, it may signify an attempt to download payloads or perform data exfiltration. Importantly, this detection does NOT confirm that malicious activity is occurring; it merely indicates that potentially suspicious PowerShell user agent strings were observed in web requests.

  ---

  ### Investigation Steps

  - **Review proxy logs for PowerShell user agents:** Check for `c-useragent` field in your proxy logs for entries containing 'WindowsPowerShell/'. Look for indications of unexpected outbound requests, particularly during unusual hours.

  - **Correlate with process creation events:** Match detected web requests with Security Event ID 4688 (process creation logs) to see if PowerShell was invoked around the same time. Malicious indicators would include PowerShell processes executed in unexpected directories or with unusual parameters.

  - **Verify file downloads:** Look for Event ID 3104 in Windows Event logs which registers script output including download activity. Validate if the scripts triggered by PowerShell were meant for legitimate administrative purposes, and check the integrity of any downloaded files.

  - **Identify expected administrative behavior:** Review expected user activity for the administrative accounts that may trigger this rule. Examine for routine maintenance tasks that may correctly utilize the PowerShell User Agent, including IT support scripts.

  - **Search for associated activity:** Check for additional commands or behavior patterns in conjunction with the PowerShell user agent, such as unusual DNS queries or rapid HTTP requests indicative of data exfiltration.

  ---

  ### Prioritization

  This alert has medium severity due to its potential implication of command-and-control activity. The likelihood of malicious abuse is moderate, as attackers often leverage PowerShell to blend in with normal operations. While not universally weaponized, PowerShell requests via proxy logs can indicate ongoing malicious operations worthy of further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded using custom user agents or by tunneling through encrypted channels, which would not be captured by basic proxy logs. Reliable detection requires comprehensive logging from proxies configured to capture user agent data, alongside PowerShell and process execution logs. Administrative scripts that use PowerShell for legitimate tasks might trigger similar alerts, underscoring the need for context. Additionally, companion detections for unusual outbound connections (e.g., DNS queries) can provide deeper insights into potential malicious activities.

