  selection:
    c-useragent|contains: ' WindowsPowerShell/'
  condition: selection
falsepositives:
- Administrative scripts that download files from the Internet
- Administrative scripts that retrieve certain website contents
level: medium
note: |
  ### Technical Context

  This rule detects the use of PowerShell with a user agent indicating a PowerShell-based web request, specifically targeting the use of the 'Invoke-WebRequest' cmdlet. Adversaries may use this technique to download content or execute commands from a remote server, which could be part of a larger attack to establish command and control (C2) or exfiltrate data. This behavior aligns with the MITRE ATT&CK tactic **Command and Control** (TA0011) and the technique **Application Layer Protocol: Web Protocols** (T1071.001). The primary telemetry source is proxy logs that record web requests, particularly those from PowerShell. If malicious, this activity could result in unauthorized access, data exfiltration, or malware delivery. This detection does NOT confirm malicious intent; it may include legitimate administrative actions.

  ### Investigation Steps

  - **Review user agent strings:** Check for logs containing 'WindowsPowerShell/' in user agent fields (Proxy logs). Ensure that such requests correlate with known administrative activities. Legitimate usage may involve download requests from approved internal resources.

  - **Correlate with process activity:** Monitor for corresponding process creation events using Security Event ID 4688 or Sysmon Event ID 1 on affected hosts. Look for any PowerShell processes initiated around the same time as the suspicious web requests.

  - **Examine request URLs:** Analyze the URLs accessed in conjunction with the PowerShell user agent. Check for known malicious domains or IP addresses. High-confidence malicious indicators may include hex-encoded or obfuscated URLs that do not correspond to legitimate services.

  - **Identify file creation events:** Validate if any files are downloaded during the instance by checking for file creation timestamps in directories typically associated with PowerShell downloads, such as the Temp folder or user profile paths.

  - **Assess environment context:** Understand the role of the host making the requests. Administrative servers or workstations may exhibit different behaviors compared to typical user machines, and context can aid in determining the legitimacy of the activity.

  ### Prioritization

  This alert is considered medium severity due to the potential impact of unauthorized access or data exfiltration. The likelihood of abuse is moderate, as adversaries often leverage PowerShell for malicious purposes. While not all PowerShell web requests indicate malicious activity, the specific user agent combined with external request analysis necessitates prompt review.

  ### Blind Spots and Assumptions

  The detection may be evaded if adversaries spoof the user agent or launch PowerShell scripts directly without using web requests. It also relies on proxy logging configuration to capture relevant web traffic. Legitimate activities, such as IT management scripts fetching updates, can trigger the alert. A related detection could include monitoring for outbound connections establishing unusual PowerShell sessions or using alternative tools for remote command execution, enhancing overall coverage.

