note: |
  ### Technical Context
  This detection rule identifies instances of Windows PowerShell Web Access by monitoring user agent strings within proxy logs. The rule is designed to catch unauthorized or suspicious use of PowerShell, which is a powerful scripting language frequently leveraged by attackers for command and control (C2) purposes. Attackers may exploit legitimate administrative capabilities to download malicious files or retrieve harmful content. The potential objectives include data exfiltration, lateral movement within the network, and evading detection systems.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), as attackers attempt to mask their activities within legitimate tools, and **Command and Control** (TA0011), where they might establish a channel to control compromised systems remotely. The specific technique this rule addresses is **Application Layer Protocol: Web Protocols** (T1071.001), highlighting how malicious actors can utilize standard web communication mechanisms to avoid detection.

  The primary data source for this detection is **proxy logs**, where user agent strings can indicate PowerShell web requests. Analysts should review these logs to determine if legitimate administrative work or malicious activities are occurring.

  ### Investigation Steps
  - **Review Proxy Logs:** Examine proxy logs for entries that contain user agents with 'WindowsPowerShell/'. Pay special attention to the frequency of these requests and their destination URLs to assess legitimacy.
  - **Correlate with Endpoint Logs:** Check the endpoint logs for PowerShell process creation and activity around the same timestamps to identify if the web requests correlate with potentially malicious script executions.
  - **Assess User Context:** Investigate the user context under which the PowerShell commands were executed. Determine if the user has legitimate reasons to run PowerShell scripts, and identify if there are any anomalies in user activity patterns.
  - **Track Network Traffic:** Analyze any network traffic associated with identified PowerShell web access to detect unusual data transfers, connection attempts to unfamiliar external addresses, or any signs of lateral movement.

  ### Prioritization
  This alert carries a medium severity rating due to the potential for attackers using PowerShell commands to bypass security protocols and carry out malicious actions under the guise of legitimate administrative tasks. The likelihood of exploitation exists, particularly in environments where PowerShell is widely used for administrative purposes.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the reliance on proxy logs, which may not capture all instances where PowerShell is used, especially if the traffic is not routed through the proxy. The detection logic assumes that all PowerShell requests will include the 'WindowsPowerShell/' string and overlooks potential obfuscation techniques that attackers might use. Additionally, this rule requires that proxy logging be properly configured and enabled for it to function effectively, as missed logs could lead to undetected malicious activities.

