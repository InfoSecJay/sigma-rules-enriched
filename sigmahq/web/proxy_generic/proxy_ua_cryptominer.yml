note: |
  ### Technical Context
  This detection rule identifies suspicious User-Agent strings associated with cryptocurrency mining software, specifically targeting proxy logs. The presence of these unique User-Agent strings suggests that an attacker may be leveraging compromised systems within the enterprise to mine cryptocurrency clandestinely. Infected machines may be running mining software such as XMRig or CCMiner, potentially impacting system performance and leading to increased resource consumption.

  The primary objective of such attacks often revolves around generating illicit revenue by utilizing the organization's hardware without consent. This behavior can lead to serious consequences including degraded performance of corporate networks, increased operational costs, and possible secondary exploitation of the compromised machine.

  Relevant MITRE ATT&CK tactics include **Command and Control (T1071.001)**, as the mining software typically establishes outbound connections to communicate with command-and-control servers to receive instructions or to transfer mined currency. The primary data source for this detection is the **proxy logs**, which can provide insights into all outgoing requests and the associated User-Agent information.

  ### Investigation Steps
  - **Review Proxy Logs:** Analyze the proxy logs for the listed User-Agent strings ("XMRig " and "ccminer"). Focus on identifying patterns of unusual activity, such as frequent or continuous requests to uncommon or suspicious domains.
  - **Examine System Resources:** Check the CPU and memory usage on systems associated with the identified User-Agent strings. High utilization may indicate ongoing cryptocurrency mining activity.
  - **Verify Network Connections:** Inspect network connections from affected systems to determine if these machines are communicating with known mining pools or command-and-control servers.
  - **Conduct Software Inventory:** Compile a list of software installed on affected systems to identify any unauthorized cryptocurrency mining applications.

  ### Prioritization
  The alerts generated by this detection rule are considered high severity due to the potential impact of undisclosed mining operations on organizational resources and network performance. Given that cryptocurrency mining can escalate in infection scale quickly, it is crucial to act rapidly on these alerts.

  ### Blind Spots and Assumptions
  This detection rule may not catch all instances of cryptocurrency mining, especially if attackers use custom User-Agent strings or other evasion techniques. Additionally, the detection logic assumes that proxy logs are properly configured and enabled to capture User-Agent information. If the logs are not being collected or retained adequately, the effectiveness of this alert will be compromised. Furthermore, false positives may arise from legitimate users who employ similar User-Agent strings for valid reasons, necessitating careful investigation and validation.

