detection:
  selection:
    c-useragent|startswith: 'Microsoft-WebDAV-MiniRedir/'
    cs-method: 'GET'
  condition: selection
falsepositives:
- Administrative scripts that download files from the Internet
- Administrative scripts that retrieve certain website contents
- Legitimate WebDAV administration
level: high
note: |
  ### Technical Context

  This Sigma rule detects HTTP GET requests using the WebDAV Mini-Redirector user agent string, which may indicate a weaponized download cradle exploit. Attackers often utilize this technique to retrieve malicious payloads from remote servers. The relevant MITRE ATT&CK tactic is "Command and Control" (TA0011), with the technique being "Application Layer Protocol: Web Protocols" (T1071.001). The primary telemetry source is proxy logs, specifically looking for user agent strings and HTTP methods. If malicious, such activity could lead to unauthorized payload delivery and potential compromise of the host. This detection does NOT confirm exploitation on its own since legitimate administrative scripts may generate similar traffic.

  ### Investigation Steps

  - **Examine proxy logs for suspicious user agents**: Review logs for entries with `c-useragent` starting with `Microsoft-WebDAV-MiniRedir/` using your proxy's log source, focusing on Event ID related to HTTP requests.

  - **Check for outbound IP connections**: Investigate associated outgoing IP addresses for connections to known malicious domains or IPs resulting from the detected WebDAV activity. Use DNS logs and enrich findings against threat intelligence feeds.

  - **Identify legitimate WebDAV usage**: Validate whether this traffic corresponds to administrative tasks by checking if the source IP addresses belong to administrative workstations performing expected WebDAV operations. Confirm legitimate use cases such as file synchronization or retrieval from approved servers.

  - **Correlate with endpoint security alerts**: Look for concurrent alerts or indicators from endpoint protection solutions that address known exploitation behaviors such as unusual executable downloads, particularly from HTTP GET requests.

  - **Assess potential payloads**: If a suspicious connection is identified, check for file creation related to the observed WebDAV retrieval via Windows Event ID 4688 to confirm if any executable files were downloaded as a result.

  - **Review historical context for user behavior**: Analyze historical access patterns for the involved user accounts in Active Directory logs (Security Event ID 4663) to identify any anomalies in file access behavior coinciding with the detection.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems, as exploitation may lead to the execution of malicious code or data exfiltration. The likelihood of malicious abuse is notable, given that the WebDAV protocol is often exploited in targeted attacks. The behavior detected is commonly weaponized in conjunction with other attack vectors.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques if the attacker uses different user agent strings or legitimate WebDAV operations from trusted systems. Reliable detection requires well-configured proxy logs that capture user agent and HTTP method data consistently. Legitimate activities, such as authorized administrative downloads, could trigger alerts. A related detection to consider is alerts for file downloads from suspicious URLs using URL filtering solutions, which could provide context around the activity.

