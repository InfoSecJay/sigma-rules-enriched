note: |
  ### Technical Context
  This rule is designed to detect specific activity related to WebDAV using the Windows WebDAV MiniRedirector, particularly the `GET` method. The focus is on identifying potentially malicious file downloads via WebDAV, a protocol that can be exploited for command and control (C2) operations by transferring files from an adversary to a compromised system. Attackers often utilize the WebDAV protocol to circumvent traditional download protections, making it a useful tool for exfiltration or obtaining malicious payloads.

  The suspected threat scenario involves an adversary utilizing WebDAV to retrieve files, potentially as a part of their command and control strategy. This aligns with the MITRE ATT&CK framework, particularly under the **Command and Control** tactic. The relevant techniques include **Application Layer Protocol: Web Protocols** (T1071.001) that attackers may exploit to blend in with legitimate traffic.

  Primary data sources for effective detection include proxy logs that monitor HTTP requests and user agents, helping to identify anomalous WebDAV activity and its context. By analyzing these logs, security teams can better understand potentially threatening interactions with external servers.

  ### Investigation Steps
  - **Review Proxy Logs**: Examine proxy logs for entries matching the `Microsoft-WebDAV-MiniRedir/` user agent with `GET` requests. Pay close attention to the URLs accessed to assess if they lead to suspicious domains or files.

  - **Correlate Contextual Events**: Cross-reference the proxy logs with other telemetry sources, such as EDR alerts that might indicate unusual process behavior or network connections following the WebDAV requests.

  - **Identify Anomalous User Behavior**: Check for any unusual user activity or account anomalies, such as accounts that have accessed WebDAV endpoints but typically do not do so.

  - **Investigate Downloaded Content**: If suspicious activity is confirmed, investigate the files being downloaded for indicators of compromise or malware signatures to assess their legitimacy.

  ### Prioritization
  This alert is of high severity due to the potential for WebDAV activity to indicate malicious file retrieval and subsequent exploitation efforts. The likelihood that an attacker may be leveraging a common protocol for C2 purposes increases the urgency of investigation in an enterprise environment.

  ### Blind Spots and Assumptions
  Potential detection gaps may exist for legitimate administrative activities that use WebDAV for process automation or management. The detection logic assumes that malicious activity will align with the specific user agent and method; thus, atypical uses or variations may be missed. Additionally, this detection requires comprehensive proxy log configurations with adequate retention to ensure thorough investigation and response capabilities.

