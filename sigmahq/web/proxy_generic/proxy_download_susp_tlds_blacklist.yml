note: |
  ### Technical Context
  This rule detects the downloading of potentially malicious file types from hosts associated with suspicious top-level domains (TLDs). These TLDs are often linked to high-risk activities, such as distributing malware or engaging in phishing campaigns. Attackers may exploit trust in common domains by hosting malicious files on unusual TLDs, potentially leading to compromise of internal systems. The detection of such downloads can help the organization mitigate risks associated with initial access vectors and code execution.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**: Gaining access to a network initially.
  - **Phishing (T1566)**: Utilizing deceptive tactics to trick users into downloading malicious files.
  - **User Execution (T1203)**: Malicious files being executed by user actions, such as running downloaded executables.
  - **Malicious File Download (T1204.002)**: Direct downloading of harmful files such as scripts or executables.

  Primary data sources for detection include proxy logs that record web traffic and file download events. Specifically, these logs can reveal the domains being accessed and the types of files being downloaded, allowing security teams to identify potentially harmful activities originating from suspicious sources.

  ### Investigation Steps
  - **Review Proxy Logs**: Check the proxy logs for requests made to the identified suspicious TLDs and cross-reference against the download file types specified in the detection rule.
  - **Analyze Download Patterns**: Look for patterns of repeated downloads from these TLDs and correlate them with internal asset inventories to identify any compromised systems.
  - **Examine Endpoint Behavior**: Utilize EDR solutions to analyze the behavior of endpoints involved in the downloads, focusing on file executions that align with the detected TLDs.
  - **Conduct User Interviews**: If a suspicious download is confirmed, conduct interviews with users who accessed these files to determine the context and intent behind the downloads.

  ### Prioritization
  The severity of this alert is low; however, it should not be ignored. Downloads from suspicious TLDs can indicate probing for vulnerabilities or attempts to introduce malware into the environment, which may lead to significant security incidents if successful.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the comprehensiveness of the proxy logs. There is an assumption that all traffic is appropriately logged and that no security controls (e.g., web filtering) are bypassed. The detection relies on the presence of both proxy logging and the necessary configurations to forward relevant logs to the SIEM. Additionally, it assumes that users are not intentionally downloading files from known malicious TLDs for legitimate purposes.

