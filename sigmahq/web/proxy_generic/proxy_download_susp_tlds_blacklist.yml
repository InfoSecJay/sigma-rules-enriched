note: |
  ### Technical Context

  This Sigma rule detects the download of various file types from domains with suspicious top-level domains (TLDs). The behavior suggests an attacker may be attempting to deliver malware or malicious documents to a target by leveraging domains known for hosting malicious content. Relevant MITRE ATT&CK tactics include Initial Access (T1071.001) and Execution (T1203), with techniques T1566 (Phishing) and T1204.002 (Malicious File). The primary telemetry source is proxy logs, particularly focusing on the `cs-host` and `c-uri-extension` fields that capture the domain and file type of downloads.

  If such downloads are successful, they could lead to compromise of systems via malware, exploitation of vulnerabilities, or unauthorized access. However, this detection does NOT confirm that a file is malicious on its own; it merely indicates that a download event occurred from a suspicious domain.

  ### Investigation Steps

  - **Inspect proxy logs for the event**: Review logs from the proxy service that captured the event. Focus on Event ID or relevant proxy identifiers including `cs-host` and `c-uri-extension`. Look for downloads from the specified suspicious TLDs to validate the alert.

  - **Identify file type details**: Examine the downloaded file extension in the logs to determine if it is one of the targeted types (e.g., .exe, .vbs, .docx). Files such as .exe or .vbs should be treated with high suspicion, especially when sourced from dubious domains.

  - **Assess domain reputation**: Use threat intelligence feeds or reputation scoring services to evaluate the suspicious TLD’s history. Domains listed frequently in phishing or malware-related activities warrant closer scrutiny.

  - **Analyze historical download patterns for user behavior**: Review the past download activities of the user associated with this alert. Legitimate business operations may include downloads from trusted domains unrelated to malware, typically from known vendors or internal resources.

  - **Confirm containment measures in place**: Check if endpoint protection or other cybersecurity tools triggered any alerts or blocked downloads related to the suspicious activity. Confirming these could indicate proactive defenses.

  ### Prioritization

  This alert is classified as low severity due to its origin from domains identified as potentially suspicious rather than definitively malicious. The impact of affected systems varies based on user role and whether they download the files. While downloads could lead to exploitation if executed, these TLDs often harbor benign content as well.

  ### Blind Spots and Assumptions

  Detection may miss scenarios where legitimate downloads occur from suspicious TLDs due to business requirements. The rule relies on robust proxy logging configurations; missing these logs could prevent accurate detection. Legitimate activities, like downloading specific file types for business operations, can falsely trigger alerts. A related detection to consider examines internal execution of potentially malicious files post-download to strengthen the overall coverage.

