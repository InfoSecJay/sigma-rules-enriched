  ---

  ### Technical Context

  This rule detects connections to the InterPlanetary File System (IPFS) that contain user email addresses, which may indicate phishing activities where attackers host credential harvesting pages on IPFS. The likely attacker objective is to harvest credentials or distribute malicious content while evading traditional detection mechanisms. This behavior aligns with the MITRE ATT&CK tactic of "Collection" (TA0009) and the technique of "Credential Access" (T1056).

  Primary telemetry sources include proxy logs that capture HTTP requests with specific URLs leading to IPFS containing email addresses. If the detected behavior is malicious, it can lead to compromised credentials and unauthorized access to user accounts. This detection does NOT confirm that a system has been compromised; it merely indicates a connection to suspicious content that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review proxy logs for matches:** Check proxy logs for connections matching the regex pattern specifically under "cs-uri" fields, looking for entries like "ipfs.io" with user email formats, focusing on Event ID 80003 for proxy logs.

  - **Correlate with email activity:** Investigate recent email traffic, particularly outgoing messages, for any signs of unusual behavior or large numbers of user accounts potentially affected by credential harvesting activities.

  - **Validate against known benign uses:** Verify if there are any legitimate business purposes for accessing IPFS, ensuring the activity aligns with authorized software development or data sharing protocols.

  - **Identify patterns of malicious behavior:** Look for patterns such as repeated requests to the same IPFS resource, which may indicate attempts to harvest credentials (look for high request counts from the same user login).

  - **Assess affected system and user roles:** Consider the criticality of the affected systems, especially if they pertain to high-profile users or sensitive data. Assess user permissions to determine impact.

  - **Document any file exfiltration:** If access to malicious IPFS instances is confirmed, check for additional network activity that may indicate data exfiltration or malicious payloads downloaded, such as anomalous outbound data transfer volumes.

  ---

  ### Prioritization

  This alert is considered low severity, primarily due to the possibility of benign use cases for IPFS within the organization. However, the likelihood of malicious abuse should not be dismissed, given the documented use of IPFS for phishing and credential harvesting activities. Attacks leveraging IPFS are currently not the most common but warrant consideration due to their increasing prevalence.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of encrypted tunnels or modifications to the request patterns to avoid triggering detection rules. Reliable detection requires comprehensive logging of all outbound traffic related to HTTP requests, specifically through the proxy. Legitimate usages, such as internal development work involving IPFS, may trigger this alert. Complementing this detection with alerts for unusual outbound HTTP requests to other cloud storage services can help strengthen coverage.

