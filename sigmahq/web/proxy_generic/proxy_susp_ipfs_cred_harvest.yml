title: Suspicious Network Communication With IPFS
id: eb6c2004-1cef-427f-8885-9042974e5eb6
status: test
description: Detects connections to interplanetary file system (IPFS) containing a
  user's email address which mirrors behaviours observed in recent phishing campaigns
  leveraging IPFS to host credential harvesting webpages.
references:
- https://blog.talosintelligence.com/ipfs-abuse/
- https://github.com/Cisco-Talos/IOCs/tree/80caca039988252fbb3f27a2e89c2f2917f582e0/2022/11
- https://isc.sans.edu/diary/IPFS%20phishing%20and%20the%20need%20for%20correctly%20set%20HTTP%20security%20headers/29638
author: Gavin Knapp
date: 2023-03-16
tags:
- attack.collection
- attack.credential-access
- attack.t1056
logsource:
  category: proxy
detection:
  selection:
    cs-uri|re: '(?i)(ipfs\.io/|ipfs\.io\s).+\..+@.+\.[a-z]+'
  condition: selection
falsepositives:
- Legitimate use of IPFS being used in the organisation. However the cs-uri regex
  looking for a user email will likely negate this.
level: low
note: |
  ### Technical Context
  This detection rule identifies suspicious network communications aimed at the InterPlanetary File System (IPFS), specifically targeting connections that include user's email addresses. Such behaviors have been linked to recent phishing campaigns that utilize IPFS as a platform for hosting credential harvesting webpages. Attackers may leverage IPFS to obfuscate their activities, making it harder for security systems to detect malicious behavior. The threat here is primarily focused on credential access through social engineering tactics, where users are directed to phishing sites disguised under the IPFS address structure.

  The relevant MITRE ATT&CK tactics include **Collection (T1056)**, where the goal is to collect user credentials and sensitive information. The technique, specifically, is centered on **Credential Access (T1081)**, as the phishing attempts aim to gather credentials through deceptive means. Primary data sources for detecting this activity include proxy logs, which capture web traffic, allowing for the identification of suspicious URL patterns that suggest phishing attempts or unauthorized data collection.

  ### Investigation Steps
  - **Review Proxy Logs:** Examine proxy logs for connections to IPFS domains that include user email addresses based on the regex pattern provided in the detection logic. Look for any anomalous behaviors or high volumes of requests from specific users.

  - **Identify User Behavior Patterns:** Analyze the affected users' behavior around the time of the detected activity. Look for unusual login attempts or interactions with sensitive resources that may indicate successful phishing attempts.

  - **Correlate with Other Data Sources:** Cross-reference the identified proxy logs with endpoint detection evidence. Investigate any related alerts in the EDR for unusual process creations or file modifications coinciding with the suspicious IPFS communications.

  - **Assess for Legitimate Usage:** Determine if there are legitimate business reasons for accessing IPFS by consulting with relevant teams to identify if IPFS is used in any authorized workflows within the organization.

  ### Prioritization
  The alert's severity is considered low in an enterprise environment due to the possibility of legitimate usage of IPFS. However, there exists a moderate threat, as attackers may exploit this technology for credential harvesting, warranting careful investigation to confirm the nature of the observed behavior.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the existence of legitimate traffic to IPFS that does not involve email addresses, which may bypass this detection. The detection logic assumes that malicious behavior will manifest through identifiable patterns containing user email addresses, which may not capture all phishing attempts. For the alert to function correctly, comprehensive proxy logs must be enabled that capture all outbound traffic, alongside proper synchronization with the SIEM platform configured to analyze web traffic in relation to known indicators of phishing-related activities.

