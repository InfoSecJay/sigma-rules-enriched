  category: proxy
detection:
  selection:
      # Example request: http://www.advanced-port-scanner.com/checkupdate.php?lng=en&ver=2-5-3680&beta=n&type=upd&rmode=p&product=aps
      # Example request2: http://www.advanced-ip-scanner.com/checkupdate.php?lng=en&ver=2-5-3499&beta=n&type=upd&rmode=p&product=aips
    c-uri|contains: '/checkupdate.php'
    c-uri-query|contains|all:
    - 'lng='
    - 'ver='
    - 'beta='
    - 'type='
    - 'rmode='
    - 'product='
  condition: selection
falsepositives:
- Expected if you legitimately use the Advanced IP or Port Scanner utilities in 
  your environement.
level: medium
note: |
  ### Technical Context

  This rule detects outgoing HTTP requests made by Advanced IP/Port Scanner utilities to their update check endpoints, specifically looking for requests that include parameters indicative of a version check. The likely attacker objective is reconnaissance, where an adversary might utilize such tools to gather information on networked devices, services, or vulnerabilities for malicious purposes. This behavior aligns with the MITRE ATT&CK tactic of Discovery (TA0007), specifically the technique of Network Service Scanning (T1590).

  The primary telemetry source is proxy logs that capture outbound HTTP requests, specifically looking for the `c-uri` and `c-uri-query` fields. If identified as malicious, this behavior could indicate network surveillance or preparatory steps for exploitation. It is essential to note that this detection does NOT confirm malicious activity on its own; it merely indicates the use of a specific tool that could be leveraged for both legitimate and malicious purposes.

  ### Investigation Steps

  - **Assess proxy logs for specific request patterns:** Check proxy logs for Event IDs related to HTTP requests (e.g., firewall or proxy log Event ID). Look for URIs containing '/checkupdate.php' and ensure all associated query parameters (such as 'lng=', 'ver=', 'beta=', etc.) are present. Focus on whether the requests originate from unusual or unauthorized systems.

  - **Identify the asset's role and usage:** Establish if the source IP making the request is known to use Advanced IP/Port Scanner legitimately. Review asset documentation or systems that should typically have these tools installed and used.

  - **Confirm benign user activity:** Verify if the end-user on the device has previously run the Advanced IP/Port Scanner. Check for legitimate use logs, such as recent application launches or installation logs from trusted software repositories.

  - **Highlight suspicious external communication:** Look for HTTP requests in the proxy logs where the response codes indicate a recent update check. A 200 OK response for the specific endpoint could suggest usage consistent with reconnaissance behavior, especially if the originating machine's role is non-security.

  - **Correlate with additional telemetry:** Explore DDI logs (DNS, DHCP, IPAM) for DNS queries that coincide with the detected scan tool update checks. This can provide context on devices that may be scanning neighboring IP addresses or services.

  ### Prioritization

  This alert is of medium severity due to the potential impact on the organization’s network security posture. Devices running scanning tools can indicate active reconnaissance, which is often a precursor to exploitation. While the behavior is not uncommon in legitimate use cases, it warrants investigation when unauthorized scans originate from critical systems.

  ### Blind Spots and Assumptions

  This detection may have limitations if the scanning tools are configured to use non-standard update endpoints or are obfuscated in network traffic. Reliable detection requires proxy logs to be enabled with comprehensive coverage, particularly for HTTP traffic. Legitimate uses of scanning tools in development or security teams might trigger this alert without malicious intent. A related detection could monitor for a high volume of port scanning requests (e.g., connection attempts on common ports) which may correlate with the use of Advanced IP/Port Scanner.

