note: |
  ### Technical Context
  This detection rule focuses on identifying update check requests made by Advanced IP/Port Scanner utilities. These tools are commonly used for network discovery and can be leveraged for both legitimate security assessments and potential reconnaissance activities by threat actors. If an attacker familiarizes themselves with the organization's network layout using these scanners, they may aim to identify vulnerable devices for exploitation, leading to unauthorized access and network breaches.

  The relevant MITRE ATT&CK tactics that this rule targets are **Discovery** (TA0007) and **Reconnaissance** (TA0043). The detection is tied to technique **T1590: Gather Victim Information**. When legitimate network scanning tools send update requests, it could signal potential misuse when unexpected activity is observed, especially if accompanied by other suspicious behaviors.

  The primary data sources for this detection are proxy logs. These logs will contain HTTP/HTTPS requests, allowing security teams to observe unusual patterns or connections to known scanning tools that might indicate reconnaissance activities.

  ### Investigation Steps
  - **Review Proxy Logs**: Examine proxy logs for any instances of requests containing `/checkupdate.php`. Validate whether the user agents and originating IP addresses belong to known assets that are authorized to use Advanced IP/Port Scanner.

  - **Correlate User Activity**: Look into user activity logs for the same timeframe to determine whether there are accompanying commands executed on systems known to have the scanner tools installed. This helps to ascertain if the update check aligns with legitimate usage.

  - **Analyze Network Traffic**: Inspect the network traffic for anomalous patterns that correlate with the detected update checks, including the volume of scans and the types of IP ranges targeted, which might indicate potential probing by unauthorized users.

  - **Identify Contextual Anomalies**: Check for contextual anomalies where the scanner utilities are employed in sensitive environments or by users with atypical activity, such as scanner requests coming from external networks rather than internal trusted networks.

  ### Prioritization
  This alert warrants medium severity due to the possibility of legitimate use by internal users coupled with the risk it poses if malicious actors exploit these tools for reconnaissance. It is crucial to assess the context while considering the sensitivity of the network examined.

  ### Blind Spots and Assumptions
  A notable blind spot is the potential for false positives in environments where the Advanced IP or Port Scanner utilities are routinely used; legitimate updates would trigger this alert frequently. The detection logic assumes that the presence of update check requests from these tools correlates to reconnaissance activities. Additionally, successful detection requires that proxy logging is enabled and captures all outbound HTTP/HTTPS traffic in detail without filtering.

