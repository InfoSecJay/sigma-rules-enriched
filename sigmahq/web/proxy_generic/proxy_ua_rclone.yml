note: |
  ### Technical Context
  This detection rule looks for the use of `rclone`, a command-line program designed for managing files in cloud storage, initiated through a proxy server. Rclone can be leveraged by attackers to exfiltrate sensitive data from within an organization to external cloud storage services. This is particularly concerning in the context of business email compromise attacks, where attackers may aim to siphon off information with minimal detection.

  The likely objectives of an attacker utilizing rclone are to transfer confidential files out of the enterprise environment without raising alarms, achieving data exfiltration. Given the rise in cases involving rclone in breach scenarios, it's critical for organizations to detect this behavior promptly.

  Relevant MITRE ATT&CK tactics include:
  - **Exfiltration** (T1567) particularly focusing on **Exfiltration to Cloud Storage** (T1567.002).

  Primary data sources for monitoring this activity include:
  - Proxy logs that capture outbound requests and their associated user-agent strings, enabling detection of unauthorized rclone use.

  ### Investigation Steps
  - **Review Proxy Logs**: Analyze proxy logs for entries with user-agent strings starting with `rclone/v`. Focus on unusual or unauthorized file transfer requests.
  - **Inspect Source Requests**: Validate the originating IP addresses or users associated with the rclone activity to determine if they are legitimate or potentially compromised accounts.
  - **Correlate with Other Logs**: Check related logs, such as Cloud Service Provider logs (e.g., AWS S3 access logs) for any related file transfers to identify potential data exfiltration patterns.
  - **Identify Context**: Examine contextual information surrounding the detected activity, including time stamps and related activities from the same user or IP addresses to establish a timeline of actions leading up to the rclone usage.

  ### Prioritization
  This alert should be treated with medium to high severity given the potential impact of data exfiltration through cloud services. The ability for an attacker to leverage a widely-used tool like rclone means that the likelihood of legitimate use causing confusion must be balanced against the serious risks of data breaches.

  ### Blind Spots and Assumptions
  Possible gaps in detection coverage include legitimate usage of rclone by system administrators or developers that could trigger false positives. The detection logic assumes that rclone's user-agent string cannot be easily spoofed, and if attackers mask their requests, the detection may fail. Additionally, the alert relies on proper logging configuration for proxy servers to ensure full visibility into potentially suspicious outbound connections. Therefore, it is crucial that all proxy log entries are preserved and accessible for effective analysis.

