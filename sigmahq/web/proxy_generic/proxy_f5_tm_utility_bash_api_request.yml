  ### Technical Context

  This rule detects POST requests made to the F5 BIG-IP iControl REST API, specifically targeting the “bash” endpoint that enables command execution on the BIG-IP system. The likely attacker objective is to gain unauthorized command execution capabilities, which could lead to system compromise or data exfiltration. This behavior maps to the MITRE ATT&CK framework under the tactic of Initial Access and the technique T1190: Exploit Public-Facing Application.

  The primary telemetry source for this detection is web proxy logs, specifically focusing on HTTP request details including method, URI, and potential payloads. If malicious, this action may grant an attacker elevated privileges, allowing them to execute arbitrary commands on the BIG-IP appliance. Importantly, this detection does NOT confirm that the command execution is malicious on its own; legitimate administrative activities may trigger this alert as well.

  ### Investigation Steps

  - **Check the HTTP method and URI:** Review web proxy logs for POST requests matching Event ID 502 (if using Windows), or check your equivalent logging mechanism for REST API POST requests. Focus on entries where `cs-method` is 'POST' and `c-uri` ends with '/mgmt/tm/util/bash'.

  - **Analyze request payloads for suspicious content:** Inspect the payload or body of the POST requests for obfuscated or unusual commands, which may indicate an attempt at command injection or exploitation. Look for commonly exploited shell commands like `wget`, `curl`, or any base64 encoded command sequences.

  - **Review legitimate administrative activity:** Compare with known administrative access patterns. Legitimate activities often include specific command sequences tied to system configuration or health checks. Document any recent legitimate activities by system administrators to distinguish from malicious behavior.

  - **Investigate associated HTTP response codes:** Look for HTTP response codes associated with the API request. Status codes such as 500 or 403 might indicate failed execution attempts, while successful responses (200) could imply command execution without incident. Event ID 502 should also log these responses for context.

  - **Validate system roles and access controls:** Ensure that requests originate from trusted IPs or internal sources. Verify the roles of systems initiating these requests and confirm they align with expected behavior. High-risk systems include those directly handling sensitive information or critical infrastructure.

  - **Cross-reference with known malicious indicators:** Utilize threat intelligence feeds to cross-check the command payloads or IP addresses involved against known malicious actors or previous compromise indicators.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on critical systems if exploited, as the F5 BIG-IP often plays a central role in application delivery and network security. The likelihood of abuse is significant, given the method's potential for command execution and prior documented exploitation cases. Alerting on this behavior is warranted, as it's a recognized avenue for initial access attempts by adversaries.

  ### Blind Spots and Assumptions

  The detection may miss attempts that use slight variations in URIs, command obfuscation, or restricted access logs. Ensure that logging is appropriately configured to capture all necessary data for the API. Legitimate administrative activities, such as routine maintenance or updates executed through automated scripts, may also trigger this alert. A companion detection would be monitoring for unusual changes in configurations or system states immediately following these API calls, enhancing the context of the alert.

