note: |
  ### Technical Context
  This detection rule identifies unauthorized POST requests to the F5 BIG-IP iControl REST API's "bash" endpoint. This endpoint facilitates the execution of shell commands directly on the BIG-IP device, making it a potential target for attackers seeking to exploit the management interface. By leveraging this functionality, an adversary could gain control over the underlying system, execute malicious commands, exfiltrate data, or further escalate privileges within the network.

  The likely threat scenario involves a malicious actor using compromised credentials or exploiting a vulnerability to perform command execution on the BIG-IP without proper authorization. This could be part of a broader attack aimed at initial access (e.g., credential dumping or exploiting misconfigurations), where the attacker seeks to establish a foothold within an organization's critical infrastructure. The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) and technique **Exploitation of Remote Services** (T1190).

  Primary data sources for effective detection include proxy logs that capture HTTP request details, including method, URL, and headers, as these logs will show the executed commands and the originating client.

  ### Investigation Steps
  - **Review Proxy Logs**: Examine proxy logs for any suspicious POST requests directed at `/mgmt/tm/util/bash`. Focus on identifying unusual source IPs or user agents that deviate from normal administrative traffic.

  - **Analyze Command Parameters**: Investigate the payloads of the POST requests for potentially harmful commands or unusual parameters that may indicate an attempt to exploit the API maliciously.

  - **Correlate with User Activity**: Cross-reference the timing of the requests with user activity logs or authentication events to determine if the requests align with legitimate administrative actions or appear to involve unauthorized access attempts.

  - **Check for Anomalous Behavior**: Look for trends in command execution, such as an unusual number of requests to the API endpoint or execution of unexpected commands, which could signal an ongoing attack or compromise.

  ### Prioritization
  This alert reflects medium severity due to the potential impact of unauthorized command execution on critical network infrastructure. While legitimate administrative activities can occur, the likelihood of exploitation through poorly secured endpoints necessitates prompt investigation to prevent operational disruptions or data breaches.

  ### Blind Spots and Assumptions
  The detection logic may not account for legitimate administrative actions, leading to false positives in environments with valid use of the iControl API. Additionally, if logging is not properly configured or if proxy traffic is not analyzed, this may result in gaps in detection coverage. Assumptions include that attackers have the capability to send requests that appear legitimate, which emphasizes the need for monitoring user behavior and contextual anomalies to discern between authentic administrative use and malicious activities. Required logs must include detailed proxy log captures of HTTP interactions with the iControl REST API.

