note: |
  ### Technical Context
  This detection rule identifies executable file downloads from suspicious top-level domains (TLDs) that are not part of a predefined whitelist. The focus is specifically on file extensions commonly associated with malicious content, such as `.exe`, `.vbs`, and `.bat`, among others. Attackers often leverage social engineering tactics and other means to lure users into downloading malicious files, which can facilitate initial access (e.g., malware deployment) or exploitation of software vulnerabilities.

  The rule relates to several MITRE ATT&CK techniques, specifically:
  - Initial Access (TA0001)
    - Phishing (T1566)
    - Exploit Public-Facing Application (T1203)
    - User Execution (T1204.002)

  The key log source for this detection is proxy logs, which capture outbound web traffic and can provide insights into the files being downloaded from the internet. Monitoring these logs allows security teams to identify potential malicious activity that could compromise endpoints.

  ### Investigation Steps
  - **Review Proxy Logs:** Examine proxy logs for any outbound requests matching the identified suspicious TLDs and the specific executable file extensions listed in the detection rule. Look for anomalies or patterns that may indicate malicious downloads.

  - **Correlate with Endpoint Data:** Check endpoint detection and response (EDR) tool logs to see if the downloaded files were executed or if there were any other suspicious behaviors noted (such as unusual processes or file modifications).

  - **Investigate User Activity:** Assess user activity leading up to the download. This includes reviewing logs for any suspicious emails, messages, or visits to potentially malicious sites that could indicate social engineering attempts.

  - **Block and Report:** If suspicious downloads are confirmed, block further communication to the TLD in question and report the incident for further investigation. Encourage users to refrain from executing any unidentified or suspicious files.

  ### Prioritization
  Given the severity of potential malware infections through executable files, this alert is categorized as low, but it warrants prompt investigation. The impact can be significant if malicious software gains access to the network, making it critical to monitor such activities closely.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage due to false positives, as legitimate software downloads may trigger alerts. The detection logic assumes that suspicious domains not listed in the whitelist are malicious without context. Moreover, the effectiveness of this alert relies on proper log configurations from the proxy and may not catch downloads happening outside of monitored channels (e.g., directly from command line). Ensuring comprehensive log coverage will help enhance detection capabilities.

