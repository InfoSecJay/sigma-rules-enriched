note: |
  ### Technical Context

  This Sigma rule detects the download of executable files or scripts from suspicious top-level domains (TLDs) that are not part of a defined whitelist of legitimate domains. The likely attacker objective is to deliver malware or malicious payloads to a target system. The relevant MITRE ATT&CK tactics and techniques include Initial Access (TA0001) via Spear Phishing (T1566) and Execution (TA0002) through user execution (T1203).

  The primary telemetry sources are proxy logs that cover outbound web traffic and the HTTP request details. If malicious, this behavior could facilitate unauthorized code execution, leading to a potential compromise of sensitive data or system integrity. It is important to note that this detection does not confirm that the downloaded file was executed or that the system was compromised merely by the download event alone.

  ### Investigation Steps

  - **Analyze download details:**
    Review proxy logs for downloads from suspicious domains (e.g., non-whitelisted TLDs) by checking `cs-host` fields for domains not included in your organization's whitelist.

  - **Identify file types:**
    Inspect the `c-uri-extension` field for any of the listed extensions such as `.exe`, `.vbs`, or `.bat` to determine the file type being downloaded. Malicious indicators include executable formats typically used for malware distribution.

  - **Correlate with user actions:**
    Check the corresponding user activity on the endpoint using Windows Security Event ID 4688 (Process Creation) to see if the downloaded file was executed. Legitimate user activity may show document downloads without execution events shortly after.

  - **Review source IP addresses:**
    Investigate the source IP address in `cs-uri-query` or `cs-uri-path` fields, comparing it against threat intelligence to determine if it has known associations with malicious activities.

  - **Assess host criticality:**
    Evaluate whether the affected asset has critical data or functions. Higher criticality systems should be prioritized for immediate investigation and remediation.

  ### Prioritization

  This alert has low severity due to its detection of downloads from suspicious domains without confirming execution or malware installation. However, the likelihood of malicious intent is moderate as such behavior is often weaponized for phishing attacks targeting user systems. It requires attention, particularly in sensitive or high-value assets.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured proxy settings that do not log all outbound traffic or by reliance on domain whitelists that may not be comprehensive. Legitimate software downloads could trigger this alert, leading to potential false positives. A related detection to strengthen coverage would involve monitoring for any process executions tied to the flagged downloads, enhancing context around potential exploits.

