note: |
  ### Technical Context

  This Sigma rule detects the downloading of certain file types (e.g., executables, scripts, and document files) from dynamic DNS hostnames commonly associated with malicious activity. The likely objective of an attacker leveraging this behavior is to exfiltrate sensitive information, deliver a payload, or gain initial access to a target system (e.g., via malware). This aligns with the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Automated Exfiltration (T1041).

  The primary telemetry sources are proxy logs, specifically capturing fields related to the requested URL, hostnames, and response statuses. If the downloads are malicious, the security impact could be significant, leading to data breaches or system compromises. Importantly, this detection does NOT confirm that a file downloaded is malicious or that any action was executed successfully; it only indicates a suspicious download activity occurred.

  ### Investigation Steps

  - **Examine download URLs:** Review proxy logs (e.g., Event ID 8000 or equivalent) for downloads matching the specified file extensions from the identified dynamic DNS hosts. Cross-reference the exact hostnames to establish a baseline of the environment and check for known benign downloads.

  - **Identify high-risk file types:** Focus on logs that show downloads of 'exe', 'vbs', or 'ps1' files from suspicious hosts. These file types are often associated with malware and warrant elevated scrutiny compared to document types like ‘doc’ or ‘xls’.

  - **Check for hostname reputation:** Query known intelligence databases to assess the reputation of the dynamic DNS hostnames. A negative reputation can indicate malicious usage, such as hosting command and control servers or distributing malware.

  - **Verify expected behavior:** Cross-reference the downloads against legitimate software updates or common user activity, such as downloads from verified sources. Ensure the context of the requested file type aligns with established behaviors of users or systems within the environment.

  - **Correlate with endpoint activity:** Identify if any malicious indicators were triggered on the endpoint (e.g., antivirus alerts, endpoint detection logs) correlated with the time of download to strengthen the assessment of potential compromise.

  ### Prioritization

  This alert should be treated with medium priority due to its potential impact on compromised systems and the likelihood of malicious abuse. While the behavior can signal reconnaissance or initial intrusion attempts, it is less commonly weaponized than other vectors like phishing. The asset criticality should also guide urgency based on what systems were affected.

  ### Blind Spots and Assumptions

  Detection may be limited by the availability and completeness of proxy logs; ensure logging is configured to capture all relevant traffic. Common evasion techniques include attackers using obfuscation methods or legitimate domains that may also be flagged. Legitimate software installers or updates could trigger this rule when sourced from dynamic DNS providers. A related detection is monitoring for execution of downloaded scripts or files as it helps verify subsequent malicious activity post-download.

