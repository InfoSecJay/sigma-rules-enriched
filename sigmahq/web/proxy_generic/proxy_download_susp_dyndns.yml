note: |
  ### Technical Context

  This Sigma rule detects the downloading of specific file types (e.g., executables, scripts, and document files) from dynamic DNS (DDNS) hosts that are frequently associated with adversarial command-and-control (C2) activities. The likely objective of an attacker utilizing DDNS is to obscure their true IP addresses and maintain persistence, allowing for communication with compromised systems or for distributing malware.

  Relevant MITRE ATT&CK tactics include: **Command and Control (TA0011)** and **Application Layer Protocol (T1105)**, where the latter details the downloading of files. The primary telemetry source is proxy logs, specifically focusing on uri extensions (c-uri-extension) and hostnames (cs-host). If malicious, such activity can indicate an attempt to deliver payloads or tools for further exploitation. It is important to note that this detection does NOT confirm that a system is compromised but indicates potential malicious activity that warrants further investigation.

  ### Investigation Steps

  - **Check proxy logs for downloads**: Review proxy logs (log types) for events related to specific c-uri-extensions such as `.exe`, `.vbs`, or `.zip` originating from the suspicious DDNS hostnames listed. Focus on Security Event IDs related to the proxy server.

  - **Identify the downloading host**: Determine the endpoint (e.g., hostname or IP) that initiated the download to evaluate its criticality and role in the network. Look for Event ID 112 (Windows) for outbound traffic from the workstation.

  - **Analyze user behavior**: Assess the user account associated with the download. Cross-reference with normal user activities to spot any anomalies in the context of actions taken or file access patterns, such as repeated downloads from unusual sources.

  - **Validate high-confidence malicious indicators**: Identify if the downloaded file types are executable or script-based files (e.g., `.exe`, `.bat`, or `.ps1`). Flag these as high-risk indicators. Check for any subsequent execution of these files via Process Creation events (Security Event ID 4688).

  - **Determine legitimate usage**: Look for common business use cases that justify downloads from these targets, such as software repositories or IT maintenance tasks, that may involve legitimate file types.

  - **Correlate with endpoint security**: Validate if any endpoint security solutions logged detections related to the downloaded file. Cross-reference telemetry from EDR solutions indicating modifications or behaviors generated by the downloaded content.

  ### Prioritization

  The severity of this alert is medium due to the potential impact of the affected system being involved in further malicious activity or data exfiltration. The likelihood of malicious abuse is heightened given the nature of DDNS usage in known threat landscapes, making this behavior noteworthy. Given the common exploitation of such methods, this alert should be treated with a level of urgency.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility of benign activities triggering false positives, such as legitimate software downloads or updates from vendors. Reliably detecting this activity requires well-configured proxy logs capturing the relevant fields. Additionally, legitimate users may download files from dynamic DNS hosts unknowingly via links in phishing emails or compromised websites. It is advisable to maintain companion detections focused on process execution from downloads, enhancing overall situational awareness.

