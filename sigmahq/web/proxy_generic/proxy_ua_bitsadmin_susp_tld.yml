title: Bitsadmin to Uncommon TLD
id: 9eb68894-7476-4cd6-8752-23b51f5883a7
status: test
description: Detects Bitsadmin connections to domains with uncommon TLDs
references:
- https://twitter.com/jhencinski/status/1102695118455349248
- https://isc.sans.edu/forums/diary/Investigating+Microsoft+BITS+Activity/23281/
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2019-03-07
modified: 2026-09-30
tags:
- attack.command-and-control
- attack.execution
- attack.stealth
- attack.t1071.001
- attack.persistence
- attack.t1197
- attack.s0190
logsource:
  category: proxy
detection:
  selection:
    c-useragent|startswith: 'Microsoft BITS/'
  filter_main_legit_tlds:
    cs-host|endswith:
    - '.com'
    - '.microsoft'         # Microsoft brand TLD
    - '.net'
    - '.org'
    - '.scdn.co'         # spotify streaming
    - '.sfx.ms'         # Microsoft domain, example request: https://oneclient.sfx.ms/PreSignInSettings/Prod/2022-08-15-21-xx-xx/PreSignInSettingsConfig.json
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rare programs that use Bitsadmin and update from regional TLDs e.g. .uk or .ca
level: high
note: |
  ### Technical Context

  This rule detects instances of Microsoft BITS (Background Intelligent Transfer Service) making connections to domains with uncommon top-level domains (TLDs). Attackers may leverage BITS to exfiltrate data or download malicious payloads using legitimate Windows components, aiming to evade security monitoring. This behavior falls under the MITRE ATT&CK tactic of Command and Control (T1071.001) and Execution (T1197), as it can facilitate communication with external systems.

  Primary telemetry sources include proxy logs that capture HTTP/S requests, specifically focusing on fields like `c-useragent` and `cs-host`. If malicious, this indicates unauthorized external communications that could compromise network security and data integrity. However, it is essential to note that this detection does not confirm that the activity is inherently malicious; additional context and investigation are necessary to establish intent.

  ### Investigation Steps

  - **Review the proxy logs for BITS activity:** Check for entries with `c-useragent` starting with "Microsoft BITS/" in the proxy logs (e.g., Event ID 400 for Windows Proxy logs). Record the `cs-host` field to analyze the domain.

  - **Validate the TLD of the connected domain:** Cross-reference the domain captured in the `cs-host` field against common TLDs. Legitimate activity often ends with `.com`, `.net`, or `.microsoft`; any requests to uncommon TLDs (e.g., `.xyz`, `.top`) warrant further scrutiny.

  - **Correlate with endpoint logs:** Investigate the associated host's Security Event ID 4688 and Sysmon Event ID 1 to confirm if BITS was initiated by a legitimate process. This step helps differentiate benign usage from potential malicious exploitation.

  - **Identify high-confidence malicious indicators:** Look for repeated connections to multiple uncommon TLDs within a short timeframe. Confirm if IP addresses associated with these domains have been flagged in threat intelligence feeds.

  - **Assess the criticality of the affected host:** Determine the role of the host system in your environment. High-value assets (e.g., domain controllers, financial servers) should be prioritized for investigation compared to lower-risk endpoints.

  - **Examine for potential data exfiltration:** Check for unusual outbound traffic patterns originating from the host, including significant file transfers or requests to the unusual domains. Investigate log files, data flow reports, or file creation artifacts (e.g., uploads via file sharing).

  ### Prioritization

  This alert is of high severity due to the potential for data exfiltration or malicious payload delivery when a trusted service like BITS is leveraged by an adversary. The likelihood of malicious exploitation is notable, especially given the known usage of BITS for covert operations. This behavior is not commonly legitimate in enterprise environments, making it a high-priority alert for investigation.

  ### Blind Spots and Assumptions

  Detection limitations may arise from misconfigured or incomplete log sources; proxy logs must be enabled and correctly capturing all traffic. Additionally, legitimate applications may use BITS for updates from regional TLDs, which could trigger false positives. A companion detection measure would involve monitoring DNS request logs for abnormal lookups to similar uncommon TLDs, further enhancing detection capabilities.

