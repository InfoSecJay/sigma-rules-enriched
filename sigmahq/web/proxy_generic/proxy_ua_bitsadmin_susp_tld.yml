logsource:
  category: proxy
detection:
  selection:
    c-useragent|startswith: 'Microsoft BITS/'
  falsepositives:
    cs-host|endswith:
    - '.com'
    - '.net'
    - '.org'
    - '.scdn.co'         # spotify streaming
    - '.sfx.ms'         # Microsoft domain, example request: https://oneclient.sfx.ms/PreSignInSettings/Prod/2022-08-15-21-xx-xx/PreSignInSettingsConfig.json
  condition: selection and not falsepositives
falsepositives:
- Rare programs that use Bitsadmin and update from regional TLDs e.g. .uk or .ca
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of the Bitsadmin tool to connect to domains with uncommon top-level domains (TLDs). Attackers may utilize Bitsadmin to automate the download of malicious payloads from less reputable or newly registered domains, which is a technique often observed in multi-stage attacks aiming to establish command-and-control (C2) channels. This behavior is relevant to the MITRE ATT&CK technique T1071.001 (Application Layer Protocol: Web Protocols) and T1197 (Inclusion of Functionality from Untrusted Control Sphere).

  The primary telemetry source for this rule is proxy logs, particularly focusing on the user agent string associated with Bitsadmin, identified as starting with "Microsoft BITS/." If this detection is confirmed, it indicates a high probability of malicious activity, as connecting to uncommon TLDs is generally not a legitimate operational behavior. However, this detection does NOT confirm that the connection is malicious on its own, as legitimate applications may also connect to these domains under certain circumstances.

  ---

  ### Investigation Steps

  - **Review proxy log entries:** Examine relevant proxy logs for connections initiated by Bitsadmin, specifically looking at Event ID from your proxy solution and filtering for user agent strings starting with "Microsoft BITS/". Focus on timestamps correlating with the alert trigger.

  - **Identify uncommon TLDs:** Cross-reference the detected domains with a list of known uncommon TLDs to validate whether the connections align with known threat indicators or malicious domains. Pay special attention to domains with recently registered TLDs that are less commonly used.

  - **Check for benign usage:** Investigate legitimate use cases for Bitsadmin in your environment. Review current processes or applications that may legitimately use Bitsadmin to connect to TLDs, especially focusing on any that are known for utilizing TLDs such as .uk or .ca.

  - **Correlate with other security telemetry:** Look for complementary alerts or telemetry in your environment that may indicate further malicious activity, such as unusual process creation logs (e.g., Security Event ID 4688) that may show Bitsadmin being spawned by unexpected parent processes.

  - **Assess the impact on critical assets:** Determine whether the affected system is a critical asset within your infrastructure, considering its role and any sensitive data it may handle, to understand the potential impact of the malicious behavior.

  - **Validate file downloads:** Check for any newly created or modified files in the default download directory used by Bitsadmin. Use file creation timestamps and sizes to identify potential malicious payloads that may have been downloaded during the alert timeframe.

  ---

  ### Prioritization

  This alert has a high severity due to the potential for malicious command-and-control activity leveraging Bitsadmin to download payloads from uncommon TLDs. The likelihood of abuse is significant since the connections are atypical for normal operational environments, especially if they involve newly registered malicious domains. Such behavior is often weaponized by adversaries to facilitate further exploitation or persistence.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if proxies do not capture all outbound traffic or if Bitsadmin activity is misconfigured to utilize common TLDs, thus evading the rule. Additionally, other legitimate applications may also use Bitsadmin to connect to newer TLDs for updates. Ensure comprehensive logging of all outbound proxy connections to improve detection reliability. Related detections, such as the monitoring of unusual process creations coupled with external connections, can enhance overall visibility into potentially malicious behaviors.

