logsource:
  category: proxy
detection:
  selection:
    c-useragent|startswith: 'Microsoft BITS/'
  falsepositives:
    cs-host|endswith:
    - '.com'
    - '.net'
    - '.org'
    - '.scdn.co'         # spotify streaming
    - '.sfx.ms'         # Microsoft domain, example request: https://oneclient.sfx.ms/PreSignInSettings/Prod/2022-08-15-21-xx-xx/PreSignInSettingsConfig.json
  condition: selection and not falsepositives
falsepositives:
- Rare programs that use Bitsadmin and update from regional TLDs e.g. .uk or .ca
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of Bitsadmin to initiate connections to domains with uncommon top-level domains (TLDs), which are typically not associated with legitimate enterprise traffic. Attackers may use Bitsadmin as part of malware deployment or data exfiltration strategies, targeting obscure domains to avoid detection (MITRE ATT&CK Tactic: Command and Control, Technique: Application Layer Protocol, ID: T1071.001, and Persistence, ID: T1197). The primary telemetry source is proxy logs that capture outbound HTTP/S requests, specifically looking for User-Agent strings that start with "Microsoft BITS/".

  If malicious, this behavior could signify compromised systems attempting to communicate with command and control (C2) servers or download additional payloads. However, this detection does not confirm that malicious activity is occurring; legitimate application updates or network operations may also generate similar alerts, particularly from less common TLDs that are used in benign regional contexts.

  ### Investigation Steps

  - **Verify proxy logs for Bitsadmin usage**: Check proxy log entries for HTTP requests from the User-Agent "Microsoft BITS/". Look for Event IDs related to external web traffic (e.g., 5145 for Windows or equivalent proxy event IDs) to establish context for the request.

  - **Analyze the destination domain**: Investigate the TLD of the domain being reached. If it ends with an uncommon TLD (e.g., .xyz, .top, or other non-standard domains), escalate to a deeper investigation. Compare against a known list of common and safe domains.

  - **Establish normal Bitsadmin behavior**: Review past proxy logs or activity baseline reports to identify regular and legitimate usage patterns of Bitsadmin within your organization, particularly for known internal tool updates which may involve TLDs like .com or .net.

  - **Identify malicious indicators**: Look specifically for known malicious indicators within the context of the alert. This could include IP addresses associated with previously flagged malware, or specific paths that match known C2 infrastructure.

  - **Assess host criticality and impact**: Determine the role of the affected host within the network. If it is a critical asset, the alert should be prioritized for immediate investigation. For non-critical systems, document findings but assess lower urgency.

  - **Check for additional context on the telemetry**: Validate if multiple requests to different uncommon TLDs are present, indicating potential exfiltration attempts, and cross-reference with geolocation data to evaluate the legitimacy based on user location.

  ### Prioritization

  This alert is of high severity as it involves the potential compromise of network integrity through communication with untrusted, unusual domains. The likelihood of malicious activity is heightened due to the intentional use of uncommon TLDs, which are often an indication of obfuscation tactics employed by threat actors. Given that such behaviors can be weaponized for data breaches, prompt investigation is critical.

  ### Blind Spots and Assumptions

  Detection limitations may include evasion techniques where attackers could spoof legitimate User-Agent strings or use common TLDs to blend in. Reliable detection necessitates comprehensive logging configurations for proxy servers and thorough insight into both legitimate and suspicious traffic patterns. Legitimate tools and updates may occasionally trigger alerts, particularly for regional programs or external services that utilize less common domains. Companion detections can include monitoring for abnormal DNS queries or unexpected outbound connections to augment overall detection efficacy.

