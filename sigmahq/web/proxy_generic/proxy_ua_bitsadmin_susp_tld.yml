logsource:
  category: proxy
detection:
  selection:
    c-useragent|startswith: 'Microsoft BITS/'
  falsepositives:
    cs-host|endswith:
    - '.com'
    - '.net'
    - '.org'
    - '.scdn.co'         # spotify streaming
    - '.sfx.ms'         # Microsoft domain, example request: https://oneclient.sfx.ms/PreSignInSettings/Prod/2022-08-15-21-xx-xx/PreSignInSettingsConfig.json
  condition: selection and not falsepositives
falsepositives:
- Rare programs that use Bitsadmin and update from regional TLDs e.g. .uk or .ca
level: high
note: |
  ### Technical Context

  This rule detects the use of Microsoft’s Background Intelligent Transfer Service (BITS) to connect to domains with uncommon top-level domains (TLDs). An attacker may leverage BITS to download additional payloads or communicate with a command-and-control (C2) infrastructure, attempting to avoid detection by using less common domains that may not trigger standard security measures. This behavior maps to the MITRE ATT&CK technique "Application Layer Protocol" (T1071.001) and can also serve as a technique for "Defense Evasion" (T1203) or "Persistence" (T1197).

  The primary telemetry source is proxy logs, specifically focusing on requests originating from the user agent string that begins with 'Microsoft BITS/'. The security impact could be significant if these communications are tied to malicious activities, indicating a potential compromise or ongoing attack. It is important to note that the detection of this activity alone does not confirm malicious intent; further investigation is necessary to ascertain the context of the behavior.

  ### Investigation Steps

  - **Check the user agent:** Review proxy logs for user agent strings starting with 'Microsoft BITS/' in Event ID 1000 (Web Proxy) logs. This indicates the use of BITS in the environment.

  - **Verify domain reputation:** Investigate the domains with uncommon TLDs accessed by BITS. Use a domain reputation service to assess if they are noted for malicious activity, aiming to find high-confidence indicators such as new or previously flagged malicious domains.

  - **Analyze associated events:** Look for additional suspicious activity correlating with the BITS sessions, such as Security Event ID 4688 for process creation or Sysmon Event ID 1, to determine if any unusual executables are being called during the same time frame.

  - **Assess legitimate usage:** Understand if legitimate applications within the environment utilize BITS by evaluating known organizational tools. Consider TLDs that are commonly used in your organizational context to distinguish benign usage from potential threats.

  - **Look for unusual outbound connections:** Check outbound network traffic logs (e.g., firewall or IDS) for abnormal patterns or connections to the detected TLDs, specifically noting if any lead back to known malicious IP addresses or are out of the ordinary for your environment.

  - **Monitor for evasion tactics:** Be aware that attackers may configure BITS to use legitimate domains under their control (e.g., trusted services hosting malware) to evade detection. Assess any changes in behavior or anomalies linked to new BITS traffic that does not align with existing tools or user patterns.

  ### Prioritization

  This alert should be treated as high severity due to the critical nature of BITS being used for potentially malicious communication. The likelihood of abuse is moderate as uncommon TLDs can indicate significant risk, and attackers often exploit such channels for stealth operations. This behavior is not commonly seen in typical environments, heightening scrutiny.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that use BITS to connect to regional TLDs or cloud services, potentially resulting in false positives. Ensure that proxy logs capture all BITS activity fully and are configured to include full HTTP request and response headers. Additionally, be aware that common culprits behind these tactics are attackers leveraging application layer protocols to evade traditional security measures; companion detections could include monitoring for unusual file downloads or memory execution from benign processes.

