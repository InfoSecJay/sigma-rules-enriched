title: Bitsadmin to Uncommon TLD
id: 9eb68894-7476-4cd6-8752-23b51f5883a7
status: test
description: Detects Bitsadmin connections to domains with uncommon TLDs
references:
- https://twitter.com/jhencinski/status/1102695118455349248
- https://isc.sans.edu/forums/diary/Investigating+Microsoft+BITS+Activity/23281/
author: Florian Roth (Nextron Systems), Tim Shelton
date: 2019-03-07
modified: 2023-05-17
tags:
- attack.command-and-control
- attack.t1071.001
- attack.defense-evasion
- attack.persistence
- attack.t1197
- attack.s0190
logsource:
  category: proxy
detection:
  selection:
    c-useragent|startswith: 'Microsoft BITS/'
  falsepositives:
    cs-host|endswith:
    - '.com'
    - '.net'
    - '.org'
    - '.scdn.co'         # spotify streaming
    - '.sfx.ms'         # Microsoft domain, example request: https://oneclient.sfx.ms/PreSignInSettings/Prod/2022-08-15-21-xx-xx/PreSignInSettingsConfig.json
  condition: selection and not falsepositives
falsepositives:
- Rare programs that use Bitsadmin and update from regional TLDs e.g. .uk or .ca
level: high
note: |
  ### Technical Context
  This rule is designed to detect connections made by the Windows Background Intelligent Transfer Service (BITS) to domains with uncommon top-level domains (TLDs). The primary concern is that malicious actors can leverage BITS for command-and-control (C2) communications, often using it to download or upload files without raising suspicion. By targeting unusual TLDs, such as those not typically associated with legitimate enterprise communications, this rule helps to identify potentially malicious activity.

  Attackers may use BITS to persistently download or upload malicious payloads to and from compromised systems while blending in with normal system operations. The use of uncommon TLDs raises suspicion about the legitimacy of the communication. Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - Command and Control (T1071.001): Application Layer Protocol
  - Defense Evasion (T1197): Mansudo Authorization
  - Persistence (S0190): Background Intelligent Transfer Service (BITS)

  The primary data source for this detection is proxy logs, which record outbound connections made by network users, highlighting any suspicious interactions with uncommon domains.

  ### Investigation Steps
  - **Review Proxy Logs**: Analyze the proxy logs for outgoing connections from the user agent string starting with 'Microsoft BITS/' and correlate them with the associated domains.
  - **Identify Uncommon TLDs**: Compile a list of the uncommon TLDs contacted through BITS to assess if any are on the organization’s block list or have known malicious associations.
  - **Cross-reference User Activities**: Examine the user activities surrounding the times of BITS connections to determine any patterns, such as other suspicious network behavior or anomalies in user behavior.
  - **Assess File Transfers**: Investigate any files that BITS may have downloaded or uploaded during the detected sessions. Look for unusual file types or sizes that are not aligned with typical operational usage.

  ### Prioritization
  The alert has been classified as high severity due to its potential indication of command and control activity, which could lead to data exfiltration, ransomware deployment, or other malicious actions. The combination of anomalous TLDs and BITS communication necessitates prompt investigation to mitigate any threats.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate use cases where BITS is employed for updates or maintenance by rare programs that use uncommon TLDs like .uk or .ca. The detection logic assumes that any outbound connection via BITS to a TLD that does not fall into common categories is suspicious. This relies heavily on accurate and comprehensive proxy logging; if logs are misconfigured or missing, the detection will not function effectively.

