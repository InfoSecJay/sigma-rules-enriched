note: |
  ### Technical Context

  This Sigma rule detects the use of suspicious user agent strings commonly associated with exploit and pentest frameworks like Metasploit and Cobalt Strike in proxy logs. The attacker’s objective may be to obfuscate malicious HTTP traffic or leverage these frameworks for reconnaissance, exploitation, or command-and-control (C2) operations within the target environment. The relevant MITRE ATT&CK tactics and techniques include Command and Control (TA0011) and Application Layer Protocol (T1071.001).

  The primary telemetry source for this detection is proxy logs, specifically analyzing the user agent (c-useragent) fields for known patterns associated with exploitation tools. If malicious, this behavior could lead to unauthorized access, data exfiltration, or system compromise. It’s important to note that this detection does NOT confirm an active compromise on its own; benign applications or legitimate administrative tasks may also utilize atypical user agent strings.

  ### Investigation Steps

  - **Examine user agent strings:** Look for instances of distinct user agent signatures in the proxy logs (Event ID X or log type: proxy logs) matching known patterns like "Mozilla/4.0 (compatible; Metasploit RSPEC)" or other listed signatures. Evaluate against normal baseline data for your environment.

  - **Identify infected hosts:** Cross-reference IP addresses of the requests with internal asset inventory. Use network logs (NetFlow, DNS queries) to check if the same IPs exhibit unusual outbound traffic or frequent requests to external threat actor domains.

  - **Review previous activity:** Check the log history for the same user or device to identify any previous occurrences of suspicious user agents or patterns (Last Logon Event IDs) that may indicate recurring unauthorized access attempts.

  - **Validate legitimate traffic:** Establish a baseline for benign user agent strings typically seen in your environment. Assess if any similar patterns correlate with routine software tools or services your organization commonly uses.

  - **Inspect for payload usage:** Investigate for high-confidence malicious indicators by searching for outbound traffic to known malicious domains linked to tools like Metasploit or Cobalt Strike. Ensure to check if any associated payload files were created on affected systems (File Creation Event ID).

  - **Capture system behavior:** If applicable, deploy endpoint detection to monitor for any lightweight Agents or common exploits around known user agents. Evaluate for unauthorized software installations or processes during unusual login times.

  ### Prioritization

  This alert is high severity due to its potential impact on critical systems, as exploit frameworks are often used for high-risk attacks. The likelihood of malicious abuse is significant since these user agent strings are commonly weaponized for active exploitation or maintaining persistence.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate tools or applications to generate similar user agent strings, leading to false positives. Reliable detection requires comprehensive logging from all proxy sources, ensuring that logs capture all relevant user agent data. Legitimate activities, such as web scrapers or automated tools, may inadvertently trigger this alert. A companion detection to consider is monitoring for outbound connections to known malicious IPs, strengthening the detection of actual exploitation attempts.

