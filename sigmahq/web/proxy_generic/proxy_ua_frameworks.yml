title: Exploit Framework User Agent
id: fdd1bfb5-f60b-4a35-910e-f36ed3d0b32f
status: test
description: Detects suspicious user agent strings used by exploit / pentest frameworks
  like Metasploit in proxy logs
references:
- https://blog.didierstevens.com/2015/03/16/quickpost-metasploit-user-agent-strings/
author: Florian Roth (Nextron Systems)
date: 2017-07-08
modified: 2025-01-18
tags:
- attack.command-and-control
- attack.t1071.001
logsource:
  category: proxy
detection:
  selection:
    c-useragent:
        # Cobalt Strike https://www.cobaltstrike.com/help-malleable-c2
    - 'Internet Explorer *'
    - 'Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1; SV1; InfoPath.2)'         # https://bluescreenofjeff.com/2016-06-28-cobalt-strike-http-c2-redirectors-with-apache-mod_rewrite/

        # Metasploit Framework - Analysis by Didier Stevens https://blog.didierstevens.com/2015/03/16/quickpost-metasploit-user-agent-strings/
    - 'Mozilla/4.0 (compatible; Metasploit RSPEC)'
    - 'Mozilla/4.0 (compatible; MSIE 6.1; Windows NT)'
    - 'Mozilla/4.0 (compatible; MSIE 6.0; Windows NT 5.1)'         # old browser, rare, base-lining needed
    - 'Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0)'         # old browser, rare, base-lining needed
    - 'Mozilla/4.0 (compatible; MSIE 8.0; Windows NT 6.0; Trident/4.0)'         # old browser, rare, base-lining needed
    - 'Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0; Trident/4.0; SIMBAR={7DB0F6DE-8DE7-4841-9084-28FA914B0F2E};
      SLCC1; .N'
    - 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'         # only use in proxy logs - not for detection in web server logs
    - 'Mozilla/5.0 (Windows; U; Windows NT 5.1; en-US) AppleWebKit/525.13 (KHTML,
      like Gecko) Chrome/4.0.221.6 Safari/525.13'
    - 'Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; WOW64; Trident/5.0; MAAU)'         # Payloads

        # Metasploit Update by Florian Roth 08.07.2017
    - 'Mozilla/5.0'
    - 'Mozilla/4.0 (compatible; SPIPE/1.0'
        # - 'Mozilla/5.0 (compatible; MSIE 10.0; Windows NT 6.1; Trident/6.0)'  # too many false positives expected
        # - 'Mozilla/5.0 (Windows NT 6.1; Trident/7.0; rv:11.0) like Gecko'  # too many false positives expected
    - 'Mozilla/5.0 (Windows NT 6.3; rv:39.0) Gecko/20100101 Firefox/35.0'
    - 'Sametime Community Agent'         # Unknown if prone to false positives - https://github.com/rapid7/metasploit-framework/blob/97095ab3113de2f046e64a64c461a1f888554401/modules/exploits/windows/http/steamcast_useragent.rb
    - 'X-FORWARDED-FOR'
    - 'DotDotPwn v2.1'
    - 'SIPDROID'
    - 'Mozilla/5.0 (Windows NT 10.0; Win32; x32; rv:60.0)'         # CobaltStrike https://unit42.paloaltonetworks.com/tracking-oceanlotus-new-downloader-kerrdown/

        # Empire
    - 'Mozilla/6.0 (X11; Linux x86_64; rv:24.0) Gecko/20140205     Firefox/27.0 Iceweasel/25.3.0'

        # Exploits
    - '*wordpress hash grabber*'
    - '*exploit*'

        # Havoc
    - 'Mozilla/5.0 (Windows NT 6.1; WOW64) AppleWebKit/537.36 (KHTML, like Gecko)
      Chrome/96.0.4664.110 Safari/537.36'                                                                                      # https://github.com/HavocFramework/Havoc/issues/519
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of suspicious user agent strings associated with penetration testing and exploit frameworks, such as Metasploit and Cobalt Strike, in proxy log data. Attackers may employ these frameworks to conduct reconnaissance, exploit vulnerabilities, or establish command-and-control (C2) communications with compromised hosts. The user agent strings detected by this rule are often not typical for standard web traffic and can provide insights into unauthorized or malicious activities that may bypass traditional security controls.

  The likely attacker objectives can include gaining unauthorized access, executing payloads, or maintaining persistence in the target environment. This rule is particularly relevant in scenarios where adversaries attempt to blend in with legitimate traffic or use well-known exploit frameworks to evade detection. It aligns with several MITRE ATT&CK tactics and techniques, including:
  - **Command and Control (T1071.001)**: Application Layer Protocol (HTTP/HTTPS), which highlights the use of HTTP-based user agents for communication.

  The primary data source providing the most valuable evidence for this rule is proxy logs, which capture outgoing web traffic including user agent strings. This provides a rich context for identifying unusual traffic patterns that may indicate malicious behavior.

  ### Investigation Steps
  - **Review Proxy Logs**: Analyze proxy logs for occurrences of the suspicious user agents defined in the detection rule. Focus on high-volume logs corresponding to endpoints typically used for internet access.
  - **Correlate with Network Behavior**: Look for related network activity such as unusual outbound connections or connections to known malicious IP addresses coinciding with the flagged user agent traffic.
  - **Examine Endpoint Data**: Utilize EDR tools to investigate the endpoints from which the suspicious traffic originated. Look for signs of compromised applications or processes that might be responsible for the usage of these exploit framework user agents.
  - **Conduct Threat Intelligence Check**: Cross-reference the identified user agent strings and associated IP addresses with threat intelligence databases to determine if they have been linked to known malicious activities or campaigns.

  ### Prioritization
  Given the potential for successful exploitation and lateral movement within an enterprise network, alerts generated by this detection rule should be considered high priority. The use of exploit frameworks poses a significant threat, as they can lead to data breaches, system compromise, and potential damage to business operations.

  ### Blind Spots and Assumptions
  This detection logic may have gaps if exploit frameworks use non-standard or less common user agent strings that are not accounted for in the rule. Additionally, there is an assumption that proxy logs are correctly configured to capture all necessary traffic; without proper logging, some malicious activities may be missed. Furthermore, the detection relies on the premise that the identified user agents will be out of the ordinary within the organization's traffic patterns, necessitating ongoing baseline analysis to fine-tune the detection logic.

