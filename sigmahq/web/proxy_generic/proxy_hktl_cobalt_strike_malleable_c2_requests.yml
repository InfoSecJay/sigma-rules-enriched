note: |
  ### Technical Context

  This Sigma rule detects malicious traffic generated by Cobalt Strike's Malleable C2 profiles, focusing on specific user agents, HTTP methods, and URIs associated with command-and-control (C2) communications. The likely attacker objective is maintaining control over compromised systems and exfiltrating data from a network, fitting into the MITRE ATT&CK framework under the "Command and Control" tactic (T1071.001). Primary telemetry sources include proxy logs capturing HTTP traffic, specifically user-agent strings, HTTP methods, and URIs accessed. If malicious, successful detection implies an active C2 communication attempt which may lead to further compromise. However, this detection alone does NOT confirm a successful breach or unauthorized access.

  ### Investigation Steps

  - **Review proxy logs for notable user agents:** Check proxy logs (e.g., Event IDs related to HTTP traffic) for user-agent strings matching either of the Cobalt Strike patterns, such as `Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko`. Legitimate traffic will typically exhibit user-agent strings from common browsers without unusual strings or patterns.

  - **Analyze recent URI access patterns:** Focus on the detection of specific URIs such as `/s/ref=nb_sb_noss_1/` and `/N4215/adj/amzn.us.sr.aps` in the proxy logs. Legitimate activity will not consistently target these URIs unless there’s a follow-up legitimate inquiry or automated process.

  - **Verify HTTP response codes:** Investigate the response codes associated with the flagged proxy requests. Anomalies such as many `200 OK` responses to suspicious requests over a short period could indicate automated exploitation attempts.

  - **Check for known malicious indicators:** Validate for indicators of compromise (IoCs) related to Cobalt Strike usage, including any previously blocked or reported payloads that leverage similar traffic patterns or exploitations.

  - **Assess asset criticality:** Identify if the originating IP addresses include high-value assets (e.g., domain controllers, critical infrastructure systems) and if the sessions correlate with known business hours.

  - **Correlate with internal threat intelligence:** Cross-reference detected behaviors with threat intelligence feeds focusing on Cobalt Strike patterns, ensuring that any recorded IPs or traffic patterns align with known bad actor methodologies.

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems that may be under attack, coupled with the common weaponization of Cobalt Strike for conducting stealthy C2 communications. The likelihood of malicious abuse is significant given the prevalence of these patterns associated with actual compromise incidents.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion via obfuscation of user agents or URI patterns, as well as legitimate applications mimicking C2 traffic. Effective detection also relies on having comprehensive proxy logging configured to capture all relevant HTTP transaction details. Legitimate activities could inadvertently trigger these alerts when business applications utilize similar user agents or paths. A companion detection rule for monitoring DNS queries associated with the same user agents may enhance visibility into potential dual protocol C2 infrastructures.

