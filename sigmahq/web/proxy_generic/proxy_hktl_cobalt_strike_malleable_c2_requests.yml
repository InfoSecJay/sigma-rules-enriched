note: |
  ### Technical Context
  This detection rule identifies specific patterns associated with Cobalt Strike's malleable command and control (C2) profiles as they are observed in web proxy logs. By analyzing the structure of HTTP requests made during potential Cobalt Strike operations, the rule aims to highlight unusual user-agent strings, URI endpoints, and HTTP methods that are characteristic of Cobalt Strike’s malicious activities. These patterns may indicate attempts to communicate with compromised systems, exfiltrate data, or manage remote access within a target network.

  Cobalt Strike is often employed by threat actors for command and control, enabling them to orchestrate attacks, maintain persistence, and evade detection. The likely objectives of attackers using these profiles are to manipulate the HTTP traffic in a manner that blends in with legitimate web usage while establishing control over infected hosts. These activities fall under the MITRE ATT&CK framework's tactics and techniques, specifically focusing on Command and Control (T1071.001) and Defense Evasion tactics.

  Primary data sources for this detection rule include web proxy logs, which provide detailed records of outbound HTTP/HTTPS traffic, including user agents, request methods, and URI paths that can be scrutinized for signs of anomalous behavior associated with Cobalt Strike's use.

  ### Investigation Steps
  - **Review Proxy Logs**: Investigate proxy logs for any HTTP requests that match the suspicious user-agent strings, URI paths, and methods defined in the detection logic.
  - **Correlate with EDR Data**: Cross-reference the detected traffic patterns within endpoint detection and response (EDR) logs to identify any associated malicious processes or behaviors on endpoints.
  - **Audit for Compromised Accounts**: Determine if the suspicious proxy requests correspond with accounts known to be compromised or lacking proper security controls, focusing on administrative accounts.
  - **Look for Anomalous Activity**: Search for other anomalous activities occurring around the same time as the detected requests, such as unexpected file uploads, lateral movement events, or privilege escalations.

  ### Prioritization
  This alert is deemed high severity due to the critical role Cobalt Strike plays in facilitating persistent access for attackers, enabling the potential for data breaches, lateral movement, and further exploitation within the enterprise environment.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage is that legitimate user traffic may inadvertently trigger this alert, as the detection logic depends heavily on specific user-agent strings and URIs that could appear in valid usage scenarios. The assumption here is that the identified patterns are indicative of malicious intent, yet they may not be exclusive to Cobalt Strike when considered in isolation. Additionally, for this alert to function effectively, comprehensive logging must be enabled on proxy servers, ensuring full visibility into outbound web traffic, including detailed HTTP request data.

