  ### Technical Context

  This Sigma rule detects Cobalt Strike malicious activity by monitoring specific patterns in HTTP requests associated with Malleable C2 profiles. The rule focuses on identifying unusual User-Agent strings, HTTP methods, and URIs commonly used by adversaries leveraging Cobalt Strike to hide their command-and-control communications. The likely attacker objective is to establish covert control over the victim's system and exfiltrate data.

  Relevant MITRE ATT&CK tactics include **Command and Control (TA0011)** and the technique **Application Layer Protocol: Web Protocols (T1071.001)**. The primary telemetry source is proxy logs that capture HTTP request details, including User-Agent, request method, URI, and host. If this behavior is confirmed as malicious, it can lead to unauthorized access, data breaches, or lateral movement within the network. Importantly, this detection does NOT confirm an active compromise on its own, as legitimate users may sometimes trigger similar traffic patterns.

  ---

  ### Investigation Steps

  - **Review Proxy Logs for Detected Patterns:** Analyze proxy logs for Event IDs relevant to HTTP requests to check for matches to the specified User-Agents, methods, and URIs (e.g., Log Type: proxy access, Fields: c-useragent, cs-method, c-uri, cs-host).

  - **Identify High-Confidence Malicious Indicators:** Focus on requests containing User-Agent `Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko` targeting `www.amazon.com` with method `GET` or `POST`, which indicates Cobalt Strike activity.

  - **Validate Legitimate Activity:** Search for legitimate traffic associated with common business applications like Amazon, noting typical User-Agents or request patterns. Compare the presence of expected User-Agents or URIs used in the environment against those defined in the rule.

  - **Correlate with Additional Threat Intelligence:** Check if the originating IPs or User-Agents are known for malicious activity by cross-referencing threat intelligence platforms and security feeds.

  - **Assess Asset Criticality:** Determine the role of the involved host within the organization (e.g., server, workstation) to prioritize the investigation based on asset criticality. Malicious activity on critical infrastructure may require immediate escalation.

  - **Examine for File Creation or Exfiltration Indicators:** Review logs for anomalous file transfers or creation events following the identified patterns, focusing on possible data exfiltration attempts from endpoints.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact of compromised systems, especially if critical infrastructure is involved. The likelihood of malicious abuse is significant, given the common use of Cobalt Strike among threat actors for operational malware deployments. This behavior is frequently weaponized in attacks targeting enterprises.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by missing proxy logs or misconfigured logging that does not capture all required fields. Legitimate internal applications may trigger similar HTTP patterns, such as legitimate traffic to well-known cloud service providers. A related detection to consider is monitoring for unusual spikes in traffic to known C2 infrastructures, which can provide additional context regarding possible malicious intent.

