note: |
  ### Technical Context

  This Sigma rule detects communication patterns utilized by the Cobalt Strike malware framework, specifically targeting commonly used malleable profiles through HTTP requests with specific User-Agents, URIs, and methods. The likely attacker objective is to establish a command and control (C2) channel to deliver malicious payloads, exfiltrate data, or issue commands to compromised hosts. This behavior fits into the MITRE ATT&CK framework under the Command and Control tactic (T1071.001 - Application Layer Protocol).

  The primary telemetry source for this detection is proxy log data, capturing HTTP request details such as the User-Agent, request method, and target URL. If the behavior is malicious, it indicates an active compromise in the environment, allowing adversaries to maintain persistent access. However, this detection does NOT confirm that the activity is inherently malicious, as legitimate applications may exhibit similar HTTP request characteristics.

  ### Investigation Steps

  - **Review proxy logs for suspicious User-Agents:** Check for occurrences of User-Agent strings such as `Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko` with Event ID 800 or equivalent in the proxy logs. Legitimate software (e.g., browsers) may use these, but check for unusual frequency or context.

  - **Examine request URIs for patterns:** Look for requests to `/s/ref=nb_sb_noss_1/` or `/N4215/adj/amzn.us.sr.aps` in proxy logs under log type HTTP transaction logs. High volumes or unusual endpoints could indicate malicious activity.

  - **Identify high-confidence malicious indicators:** Flag any connections to `ocsp.verisign.com` using `/oscp/`, especially if paired with suspicious User-Agent strings, as this indicates potential command and control activity.

  - **Correlate with known malicious profiles:** Cross-reference observed User-Agent strings and URIs against Cobalt Strike Malleable C2 profiles available in threat intelligence repositories to identify matches that could confirm malicious intent.

  - **Verify Asset Criticality:** Assess the role of the affected system. If it’s a critical asset or serves a highly sensitive function in the network, prioritize this alert accordingly and initiate deeper investigations.

  - **Document expected legitimate behavior:** Note that routine applications can access `onedrive.live.com` under normal operations. Check for user's activity history to confirm if such requests align with expected usage patterns.

  ### Prioritization

  This alert should be treated with high severity due to its indication of potential C2 communication. The likelihood of malicious abuse is significant, as Cobalt Strike is commonly employed by advanced persistent threats (APTs) and cybercriminal groups. Given these aspects, it warrants immediate investigation to verify the legitimacy of the traffic.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as URL obfuscation or User-Agent spoofing, which could mask malicious activity. Ensuring comprehensive monitoring of proxy logs is crucial for reliable detection; incomplete logging may lead to missed malicious activity. Additionally, some legitimate applications may trigger similar patterns, potentially causing false positives. A related detection to strengthen this coverage might involve monitoring for unusual outbound traffic behaviors or the establishment of anomalous external connections post-infection.

