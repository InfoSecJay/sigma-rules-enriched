  ### Technical Context
  This detection rule identifies communication patterns associated with the Baby Shark C2 framework. Specifically, it looks for requests containing the specific URI fragment 'momyshark?key=', which is characteristic of Baby Shark's default command and control (C2) communication mechanism. The presence of these requests could indicate that an attacker is leveraging this tool to maintain a foothold in the network, facilitating further malicious activity such as data exfiltration or lateral movement.

  The typical scenario involves an attacker who has successfully compromised a system within the enterprise network, and they are using the Baby Shark agent to communicate with a C2 server. The primary objectives of the attacker could include gathering sensitive information, executing remote commands, or propagating additional malware within the infrastructure. Monitoring and responding to such communications is critical in preventing potential data breaches or further unauthorized access.

  This rule aligns with the MITRE ATT&CK framework, particularly focusing on the Command and Control tactic (TA0011) and the technique for Application Layer Protocol (T1071.001). The primary data source for this detection is proxy logs, which track outgoing HTTP/HTTPS requests, making it possible to identify patterns indicative of C2 communications.

  ### Investigation Steps
  - **Review Proxy Logs**: Examine proxy logs for outgoing requests that contain 'momyshark?key='. Pay special attention to the timestamps and source IP addresses to identify any patterns or anomalies.
  - **Correlate with Endpoint Activity**: Check the EDR or endpoint logs to see if any processes were spawned that could correlate with the timing of the detected proxy activity. Look for signs of abnormal behavior that might indicate a compromised endpoint.
  - **Assess Network Traffic**: Utilize NDR capabilities to analyze any unusual traffic patterns from the suspected machine to external sources. Investigate the volume and frequency of communications to discern whether they are consistent with legitimate usage.
  - **Investigate User Activity**: Determine if the user associated with the source IP has a history of suspicious behavior, such as accessing unusual applications or external domains that fall outside normal activity.

  ### Prioritization
  Given the critical level assigned to this alert, it signifies a high potential impact on the enterprise's security posture, as communication with known C2 frameworks like Baby Shark can indicate active exploitation or data compromise, demanding immediate investigation.

  ### Blind Spots and Assumptions
  The detection relies heavily on accurate proxy logs that capture all outbound traffic, which may not be configured in all environments. If proxy logging is incomplete or misconfigured, there could be gaps in detection. Additionally, this rule assumes that any valid user activity would not include the specific URI in question, which may not always hold true. Therefore, it is essential to ensure that proxy configurations are optimized to capture all relevant traffic consistently for the detection to function effectively.

