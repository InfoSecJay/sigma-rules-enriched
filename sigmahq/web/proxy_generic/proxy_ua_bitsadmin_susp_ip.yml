note: |
  ### Technical Context

  This rule detects the use of the Microsoft Background Intelligent Transfer Service (BITS) to connect to uncommon IP address servers instead of fully qualified domain names (FQDNs). Attackers may exploit BITS for downloading malicious payloads undetected, pivoting from compromised endpoints or utilizing external infrastructure for command and control activities. The relevant MITRE ATT&CK techniques include Command and Control (T1071.001) and Defense Evasion (T1197).

  Primary telemetry sources include proxy logs where user agent strings indicate BITS usage, specifically looking for connections to servers ending with numeric characters. If malicious, this activity could indicate data exfiltration or the execution of malicious payloads. Importantly, this detection does NOT confirm that the connection was successful in transferring malicious content without further investigation.

  ### Investigation Steps

  - **Check Proxy Logs**: Identify proxy logs (e.g., proxy log type) for connections with user agents starting with 'Microsoft BITS/' and `cs-host` ending in numeric characters (e.g., 1-9). Review for frequency and patterns, noting potential connections to untrustworthy IPs.

  - **Analyze Process Execution**: Use Sysmon Event ID 1 to check if any BITS processes were spawned that could correlate with the proxy activity. Focus on command-line execution parameters for indicators of misuse.

  - **Correlate with Known Bad IPs**: Cross-reference the uncommon IP addresses identified in the logs with threat intelligence feeds or blocklists to determine if they are associated with known malicious activity.

  - **Review Expected Behavior**: Validate legitimate business use of BITS by checking with stakeholders or documentation to determine if the detected activity aligns with expected usage patterns, such as internal application updates.

  - **Identify High-Confidence Indicators**: Look for evidence of large data transfers associated with BITS, such as Sysmon Event ID 8 showing network connections with abnormal data volumes relative to standard operations.

  ### Prioritization

  This alert should be treated with high severity given the potential for data exfiltration or malicious payload delivery via BITS. The likelihood of attackers leveraging this technique is significant, particularly in environments where BITS is present and commonly abused for stealthy downloads. This behavior is not typically benign and should be investigated promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete proxy log collection or misconfigured logging for BITS activities. Legitimate activities, such as internal software updates or third-party software dependencies utilizing BITS, could trigger false positives. A related detection mechanism would include monitoring for unusual outbound traffic patterns, which may complement the visibility of BITS connections.

