note: |
  ### Technical Context

  This rule detects the use of the Microsoft Background Intelligent Transfer Service (BITS) to connect to IP addresses rather than fully qualified domain names (FQDNs). This behavior is often indicative of an attacker using BITS for malicious downloads or communication without revealing the endpoint's identity. The likely attacker objective is to evade detection by obscuring the destination address using raw IPs, making it harder to analyze for known threats.

  This alert correlates with the MITRE ATT&CK technique "Application Layer Protocol: Web Service" (T1071.001) and may align with additional tactics including "Command and Control" and "Execution." The primary telemetry sources are proxy logs where BITS' User-Agent string is logged, specifically monitoring fields such as `cs-host` and `c-useragent`. If confirmed as malicious, the impact could include the downloading of malware or unauthorized data exfiltration.

  However, this detection does NOT confirm that an attack has occurred on its own, as legitimate use cases for BITS could also trigger this alert.

  ### Investigation Steps

  - **Check proxy logs for BITS connections:** Review proxy logs for connections where `c-useragent` contains 'Microsoft BITS/' and the `cs-host` field ends with digits from 1 to 9. Look for unusual IP addresses that are not recognized in your network.

  - **Investigate the destination IP:** Use threat intelligence sources to verify the reputation of the IP addresses involved. If the IP address is known for malicious activities (e.g., listed on blocklists), this strengthens the case for a malicious action.

  - **Analyze the process using BITS:** Check the system's process creation logs. Use Security Event ID 4688 or Sysmon Event ID 1 to find processes calling BITS. Compare timestamps to the proxy logs to correlate suspicious behavior.

  - **Assess expected BITS activity:** Determine if the BITS process is being used for known applications within the environment. Legitimate activities may include automatic software updates or internal application updates initiating BITS downloads.

  - **Examine file creation or download artifacts:** Scrutinize directories where files downloaded via BITS are stored (e.g., the `%Temp%` directory) to confirm whether any executable or suspicious files were created immediately after BITS was invoked.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact of an attack involving malware downloads or data exfiltration. The likelihood of malicious abuse is significant, as the usage of IP addresses rather than FQDNs is a common tactic employed by threat actors to avoid detection. This behavior is frequently weaponized in various attacks.

  ### Blind Spots and Assumptions

  Potential evasion techniques include using dynamic IP addresses that change frequently to bypass detection or employing encrypted channels through BITS. Reliable detection relies on having complete and accurate proxy logs; any gaps could lead to a missed assessment of malicious activity. Legitimate software that uses IP addresses for updates may lead to false positives, particularly in environments with custom applications. A companion detection, such as monitoring for unusual outbound traffic patterns, may enhance coverage and add context to suspicious BITS behavior.

