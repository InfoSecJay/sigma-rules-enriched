note: |
  ### Technical Context
  This detection rule identifies the use of Microsoft’s Background Intelligent Transfer Service (BITS) connecting to raw IP addresses instead of Fully Qualified Domain Names (FQDN). Such behavior raises suspicions about potential malicious downloads, as attackers often leverage BITS due to its ability to transfer files seamlessly in the background, making it a valuable tool for maintaining persistence or executing commands through command and control (C2) mechanisms.

  The primary threat scenario here involves an attacker using custom tooling or exploitation techniques to manipulate BITS for unauthorized software downloads. Typical objectives may include downloading payloads for further exploitation, such as establishing a persistent backdoor or exfiltrating sensitive data without detection. The use of IP addresses instead of FQDNs can indicate an attempt to bypass network detection mechanisms possibly aimed at hiding the true nature of the communication.

  This rule is relevant to several MITRE ATT&CK techniques, notably:
  - **Command and Control (T1071.001)**: Application Layer Protocol: Web Protocols
  - **Defense Evasion (T1197)**: Drive-by Compromise
  - **Persistence (T1050)**: New Service
  - **Application Layer Protocol (T1071)**: General Network Protocols

  The primary data source for this detection is proxy logs that capture web traffic, including the user agent strings and destination addresses.

  ### Investigation Steps
  - **Review Proxy Logs**: Extract logs from the proxy to identify requests made with the user agent 'Microsoft BITS/' connecting to IP addresses. Pay attention to the context of the connections and any associated metadata.
  - **Analyze Payloads**: If any downloads are identified, assess the nature of those files and their origin. Use tools like antivirus software or sandbox environments to analyze the payload for malicious behavior.
  - **Identify User Behavior**: Investigate the user behavior associated with those connections. Determine if this activity corresponds to the user’s known behavior or if it appears anomalous, indicating possible compromise.
  - **Correlate with Other Logs**: Look for related events in EDR logs or endpoint alerts that could provide additional context on the activities of the user or the processes initiated on the endpoint during the connection.

  ### Prioritization
  This alert is rated high severity due to the potential for attackers to use BITS for covert operations, such as persistent malware installation or data exfiltration. The use of raw IP addresses signifies a higher likelihood of malicious intent, warranting immediate investigation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if BITS is misconfigured or if logs are not properly forwarded from the proxy to the SIEM. The detection logic assumes that all use of BITS is malicious when it communicates via IP addresses, which may not account for legitimate internal services. Furthermore, required logs for this alert to function effectively include detailed proxy logs that capture user agents and destination addresses, ensuring visibility into all BITS-related traffic.

