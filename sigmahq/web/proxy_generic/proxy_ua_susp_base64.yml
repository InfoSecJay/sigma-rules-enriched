note: |
  ### Technical Context

  This detection rule identifies User-Agent strings that conclude with an equal sign, indicative of potential Base64 encoding often used in command-and-control (C2) communications. Attackers employ Base64 encoding to obfuscate their commands and payloads, making it difficult for traditional detection methods to recognize malicious traffic. Relevant MITRE ATT&CK techniques include Command and Control (T1071.001) which highlights the use of application layer protocols to communicate with compromised systems.

  The primary telemetry sources include proxy logs that capture web traffic details, specifically the User-Agent field. If this behavior is malicious, it suggests an active attempt by an adversary to establish a covert C2 channel for further exploitation. Importantly, this detection does NOT confirm malicious activity on its own; it requires additional context to ascertain intent.

  ### Investigation Steps

  - **Inspect User-Agent string variations:** Collect proxy log entries (Field: User-Agent) and identify versions ending with '='. Look for unusual or non-standard User-Agent values that deviate from common browser signatures.

  - **Analyze the originating IP address:** Cross-reference the IP in related logs (Event ID 5140, Firewall logs) to verify if this traffic pattern is typical for the asset or associated with known malicious activity (e.g., threat intelligence feeds).

  - **Review surrounding traffic:** Examine the web requests made by the user or asset within a time frame (Log type: Proxy logs) for other suspicious patterns such as odd destinations, high frequency of requests, or connections to known C2 servers.

  - **Identify legitimate User-Agent patterns:** Compare observed User-Agent strings against a known whitelist of common applications (such as Chrome, Firefox) to identify benign behavior.

  - **Validate file activity:** If the access involves file downloads, check for unusual file types or extensions created during the session (File creation logs) that may indicate payload delivery.

  ### Prioritization

  The alert is rated medium severity due to the potential impact of C2 communications on internal systems. The likelihood of malicious activity increases as Base64 encoding is commonly weaponized for data exfiltration or remote commands. However, the prevalence of benign applications also necessitates careful analysis to avoid false positives.

  ### Blind Spots and Assumptions

  Detection may be limited by factors such as encrypted traffic or the use of legitimate applications that might append Base64 encoding in their User-Agent strings. Reliable detection demands comprehensive logging configurations from proxy servers to capture all relevant User-Agent data. Legitimate web traffic from privacy-focused browsers may trigger this alert as well. A related detection to consider is monitoring for unusual outbound connections from the same asset, which can strengthen assessment of potential threats.

