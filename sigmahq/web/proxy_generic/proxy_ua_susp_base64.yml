  ---

  ### Technical Context

  This rule detects User-Agent strings that terminate with an equal sign, indicative of potential Base64 encoding. Attackers may use this technique to obfuscate their activities, often as part of a command-and-control (C2) communication setup. This behavior aligns with the MITRE ATT&CK tactic for Command and Control (T1071.001), focusing on application layer protocols for stealthy communications.

  Primary telemetry sources include proxy server logs that capture HTTP requests and User-Agent fields. If malicious, such C2 activities can lead to unauthorized access, data exfiltration, or other nefarious operations. It's important to note that this detection does NOT confirm malicious intent on its own; legitimate applications may also use obfuscated User-Agent strings.

  ---

  ### Investigation Steps

  - **Review proxy logs for User-Agent patterns:** Investigate proxy logs (Event IDs related to web access) focusing on the User-Agent field. Look for User-Agent strings that end with '=', indicating potential Base64 encoding. Cross-reference these with expected User-Agent formats.

  - **Identify known legitimate User-Agents:** Collect a baseline of legitimate User-Agent strings typically seen in your environment (from trusted applications). A legitimate User-Agent might resemble common browsers or enterprise applications and should not end with '='.

  - **Analyze related HTTP request metadata:** Look at matching HTTP request attributes such as request method (GET/POST), URI, and parameters. Unusual or unexpected queries accompanying obfuscated User-Agents could indicate malicious activity.

  - **Check for outbound requests to suspicious IPs:** Validate the destination IPs or domains against threat intelligence sources. Anomalous communication patterns (e.g., frequent requests to newly registered domains) alongside the flagged User-Agent should raise red flags.

  - **Reference companion detections on command-and-control:** Correlate this alert with larger context from related detection measures (e.g., anomalous DNS queries or suspicious user behavior) which may indicate a broader C2 compromise scenario.

  ---

  ### Prioritization

  This alert could signal medium-severity due to the potential for command-and-control activities, especially if originating from critical assets. Given the capability for evasion through encoded strings, there is a notable likelihood of malicious abuse, although not every encoded User-Agent is indicative of an attack.

  ---

  ### Blind Spots and Assumptions

  Limitations exist if proxy logs are not correctly collected or if base64 encoded strings are commonly used for legitimate purposes in the environment. Additionally, benign user applications, particularly in cloud or mobile contexts, may generate such User-Agent strings. Consider deploying companion detections focused on abnormal outbound network behavior to strengthen monitoring efforts related to C2 communications.

