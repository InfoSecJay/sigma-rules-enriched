logsource:
  category: proxy
detection:
  selection:
  - c-uri|contains: '/flash_install.php'
  - c-uri|endswith: '/install_flash_player.exe'
  filter:
    cs-host|endswith: '.adobe.com'
  condition: selection and not filter
falsepositives:
- Unknown flash download locations
level: high
note: |
  ### Technical Context
  This rule detects when a Flash Player update is initiated from a suspicious or unofficial location, specifically when the request contains the path to Adobe Flash installation files without being sourced from a legitimate Adobe domain. The threat scenario entails attackers potentially using fake or compromised Flash Player updates to distribute malware, leveraging a commonly trusted application update to bypass security mechanisms and deliver malicious payloads. This activity aligns with the MITRE ATT&CK techniques, particularly Initial Access (T1189: Drive-by Compromise) and Execution (T1204.002: Malicious File Execution).

  The primary data source that provides evidence for this detection is proxy logs, specifically focusing on URI paths that suggest software installations. By monitoring these logs, organizations can identify anomalies associated with software updates, especially when updates appear from domains that do not conform to known good sources for software.

  ### Investigation Steps
  - **Review Proxy Logs:** Check the proxy logs for any requests containing `/flash_install.php` or `/install_flash_player.exe` from IP addresses previously deemed suspicious or not recognized as legitimate Adobe sources.

  - **Validate Domain Reputation:** Conduct a domain reputation analysis for any domains presenting this installation request to ensure they are not associated with known malware distribution or phishing sites.

  - **Cross-reference User Activity:** Determine if the users who initiated these requests typically access Adobe sites. Look for anomalous behavior patterns, such as visits to unusual domains or unusual download patterns.

  - **Check for Malicious Artifacts:** Perform endpoint investigations on affected systems to identify if any unauthorized software installations or malicious payloads were triggered from the detected update attempt.

  ### Prioritization
  Given that this alert targets a method commonly used for malware delivery via trusted software, the severity is considered high due to the significant potential impact of a successful compromise, coupled with the moderate likelihood of threat actors leveraging unofficial updates as part of their attack strategy.

  ### Blind Spots and Assumptions
  There may be detection gaps regarding legitimate Flash updates that occur from cached or whitelisted domains that do not conform to this rule's criteria. The detection logic assumes that all unofficial domains are malicious, which may not always be the case, leading to potential false positives for benign circumstances. Additionally, proper functioning of the alert relies on comprehensive proxy logging capabilities being in place and actively monitored to capture the necessary traffic data.

