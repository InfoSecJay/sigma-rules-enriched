logsource:
  category: proxy
detection:
  selection:
  - c-uri|contains: '/flash_install.php'
  - c-uri|endswith: '/install_flash_player.exe'
  filter:
    cs-host|endswith: '.adobe.com'
  condition: selection and not filter
falsepositives:
- Unknown flash download locations
level: high
note: |
  ### Technical Context

  This rule detects attempts to download Adobe Flash Player from unofficial or suspicious sources, specifically through proxy logs. Attackers often use unofficial downloads to deliver malware under the guise of legitimate software to exploit vulnerabilities or execute malicious payloads. This activity corresponds to the MITRE ATT&CK tactics of Initial Access (T1078) and Execution (T1204.002). Primary telemetry sources include proxy logs, specifically looking for HTTP requests that contain certain URI patterns related to Flash Player installations. If successful, this could lead to unauthorized access, malware deployment, or system compromise. However, this detection does NOT confirm that malware has been successfully executed or installed.

  ### Investigation Steps

  - **Review proxy logs for suspicious downloads**: Check for logs indicating accesses to `/flash_install.php` or filenames ending with `/install_flash_player.exe`. Examine Event IDs related to proxy server logs (e.g., Event ID 1116 for Microsoft Proxy).

  - **Verify the source of the download**: Look at the `cs-host` field to confirm if it originates from a domain not associated with Adobe. Legitimate updates should only come from `*.adobe.com`.

  - **Assess user roles and behaviors**: Identify the user initiating the download using fields like `cs-username` or `src-ip`. Validate if this user has a legitimate need for a Flash update based on their role (e.g., a software developer).

  - **Correlate with malware signatures**: Check if the downloaded file matches known malicious hashes using Endpoint Detection and Response (EDR) solutions, focusing on any alert triggered by suspicious file creation on the endpoint.

  - **Examine user activity prior to the alert**: Review user behavior leading up to the event, including other websites visited or downloads, using web logs. Look for patterns that indicate social engineering attempts (e.g., phishing sites) which may have prompted the download.

  - **Check for alerts on related suspicious activity**: Look for previous alerts on the same user, IP address, or downloading behavior that might signify ongoing malicious actions or an active compromise.

  ### Prioritization

  This alert holds a high severity due to its potential for system compromise through malicious downloads. The likelihood of exploitation is elevated given the common targeting of outdated software like Flash Player. Since attackers frequently leverage unofficial software updates for malware distribution, this requires prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be bypassed by attackers using legitimate URLs or obfuscation techniques to hide malintent. Proxy logs must be comprehensive and correctly configured to capture all relevant requests; otherwise, suspicious activity may go unnoticed. Legitimate cases, such as internal software distribution processes or accidental user accesses, can trigger this alert. Companion detections, such as monitoring anomalous outgoing traffic to known malicious domains, can enhance coverage and validate threats.

