logsource:
  category: proxy
detection:
  selection:
  - c-uri|contains: '/flash_install.php'
  - c-uri|endswith: '/install_flash_player.exe'
  filter:
    cs-host|endswith: '.adobe.com'
  condition: selection and not filter
falsepositives:
- Unknown flash download locations
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to download Flash Player updates from unofficial locations, identified through specific URI patterns. The likely objective of an attacker is to deliver malicious payloads under the guise of legitimate software updates, facilitating initial access or execution of an exploit. This detection aligns with the MITRE ATT&CK tactics of Initial Access (TA0001) and either Valid Accounts (T1078) or User Execution (T1204.002).

  The primary telemetry source for this detection is proxy logs capturing web traffic. Specifically, logs should include fields like the `c-uri` and `cs-host`. If successful, downloading a Flash Player installer from an unofficial source poses a significant security risk, as it could lead to system compromise through malware deployment. It is important to note that this detection does NOT confirm an actual compromise but simply indicates a suspicious download attempt.

  ### Investigation Steps

  - **Review proxy logs for suspicious URIs:** Look at proxy Event IDs with `c-uri` containing '/flash_install.php' or ending with '/install_flash_player.exe'. A legitimate Flash update should come from official `adobe.com` sources.

  - **Correlate download timing with user activity:** Check for user account activities in the same timeframe around the suspicious download in logs such as Security Event ID 4624. This helps identify if an insider threat is possible or if it's likely legitimate user behavior.

  - **Check the source of download in the proxy logs:** Inspect `cs-host` for occurrences not matching `*.adobe.com`. High confidence malicious indicators include any download from domains with typos or variations, which may indicate phishing attempts.

  - **Assess endpoint activity post-download:** Investigate if the file `install_flash_player.exe` was executed on any endpoint by analyzing Security Event ID 4688 or Sysmon Event ID 1. Look for unusual parent processes that could indicate execution of a malicious payload.

  - **Cross-reference legitimate installation data:** Validate if the Flash Player installation logs (Event ID 11707) confirm it coming from an official source. Legitimate installations usually result from a recognized installer path, like the one listed in Microsoft or Adobe's documentation.

  - **Monitor for subsequent malicious behavior:** After identifying the download, review for any unusual outbound connections or script execution (e.g., PowerShell logs with Event ID 4104) as signs of exploitation or malware trying to communicate with a command and control server post-installation.

  ### Prioritization

  The alert severity is high due to the potential impact on the affected systems if the download is malicious. The likelihood of attackers abusing such a technique is substantiated, as malware often masquerades as legitimate software updates. This behavior is also commonly weaponized in phishing campaigns and drive-by downloads.

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as using legitimate domains with slight variations or utilizing updated software that bypasses detection systems. Reliable detection requires comprehensive logging from all proxies and endpoints executing software installations. Legitimate activities may include employees accessing third-party sites for Flash downloads, especially during troubleshooting sessions. A related detection rule focusing on executable file downloads from suspicious domains could enhance coverage and ensure comprehensive threat visibility.

