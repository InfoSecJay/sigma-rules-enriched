title: Local System Accounts Discovery - MacOs
id: ddf36b67-e872-4507-ab2e-46bda21b842c
status: test
description: |
  Detects enumeration of local system accounts on MacOS systems.
  This can be used by attackers to identify accounts for lateral movement or privilege escalation.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.001/T1087.001.md
- https://ss64.com/osx/dscl.html
- https://ss64.com/mac/dscacheutil.html
author: Alejandro Ortuno, oscd.community
date: 2020-10-08
modified: 2026-07-07
tags:
- attack.discovery
- attack.t1087.001
logsource:
  category: process_creation
  product: macos
detection:
  selection_dscl:
    Image|endswith: '/dscl'
    CommandLine|contains|all:
    - 'list'
    - '/users'
  selection_dscacheutil:
    Image|endswith: '/dscacheutil'
    CommandLine|contains|all:
    - '-q'
    - 'user'
  selection_root:
    CommandLine|contains: '''*:0:'''
  selection_passwd_sudo:
    Image|endswith:
    - '/cat'
    - '/awk'
    - '/grep'
    CommandLine|contains:
    - '/etc/passwd'
    - '/etc/sudoers'
  selection_id:
    Image|endswith: '/id'
  selection_lsof:
    Image|endswith: '/lsof'
    CommandLine|contains: '-u'
  selection_logged_in_users:
    Image|endswith:
    - '/who'
    - '/w'
    - '/users'
    - '/last'
  selection_home_dir_listing:
    Image|endswith: '/ls'
    CommandLine|endswith:
    - '/Users'
    - "/Users'"
    - '/Users"'
  selection_loginwindow_prefs:
    Image|endswith:
    - '/defaults'         # defaults read /Library/Preferences/com.apple.loginwindow
    - '/plutil'         # plutil -p /Library/Preferences/com.apple.loginwindow.plist
    CommandLine|contains: 'com.apple.loginwindow'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects the enumeration of local system accounts on macOS systems through various commands such as `dscl`, `dscacheutil`, `cat`, `awk`, and other tools. Attackers may utilize this behavior to identify potential accounts for lateral movement or privilege escalation, aiming to facilitate unauthorized access to sensitive data. The relevant MITRE ATT&CK technique is "Local Account Discovery" (T1087.001).

  Primary telemetry sources include process creation logs, particularly event logs capturing command-line arguments and the images executing the commands. If malicious, this behavior can pose significant risks, such as unauthorized access or privilege escalation across a network. However, this detection does NOT confirm that malicious activity is taking place on its own, as legitimate administrative activities may trigger similar alerts.

  ### Investigation Steps

  - **Verify the command execution context:** Check for macOS Security Event ID 4688 for the process creation of commands like `dscl`, `dscacheutil`, and `ls`. Analyze who executed the command and the time it was run.

  - **Review command-line arguments:** Examine the command-line arguments associated with the detected process. For example, `dscl` should include flags like `'list'` and `'/users'`, indicating account enumeration. Legitimate administrative commands will often have specific usage patterns and flags.

  - **Assess user roles and permissions:** Determine the user associated with the action by checking the logs and correlating against legitimate administrator accounts. Administrative users will typically perform these queries regularly.

  - **Identify high-confidence malicious indicators:** Look for unexpected invocations of `dscl` or `cat` with suspicious command-lines such as referencing `'/etc/passwd'` or `'/etc/sudoers'`. The appearance of these indicators may suggest a potential malicious attempt to glean user credentials or privilege.

  - **Establish baseline legitimate activity:** Document typical commands run by system administrators, like listing users through `id` or `who`, and compare against detected behaviors to distinguish between benign and malicious intents.

  ### Prioritization

  This alert should be considered low severity in a mature enterprise context, primarily due to its potential for benign execution during routine administrative tasks. However, repeated enumeration across multiple systems may indicate a higher likelihood of malicious intent, particularly if aligned with other suspicious behaviors. The command patterns in the rule are often weaponized by attackers to facilitate lateral movement.

  ### Blind Spots and Assumptions

  Potential evasion techniques include using obfuscated command-line arguments or executing the commands through indirect methods to bypass detection. Reliable detection requires proper logging configurations to ensure visibility into all relevant command executions. Benign legitimate activities could include system administration maintenance or audits that involve user enumeration. A related detection to strengthen coverage would involve monitoring for unusual patterns of access to high-privilege accounts or the use of process creation logs across preceding alerts.

