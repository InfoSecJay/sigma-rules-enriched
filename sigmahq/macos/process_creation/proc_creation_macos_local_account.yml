title: Local System Accounts Discovery - MacOs
id: ddf36b67-e872-4507-ab2e-46bda21b842c
status: test
description: Detects enumeration of local systeam accounts on MacOS
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.001/T1087.001.md
author: Alejandro Ortuno, oscd.community
date: 2020-10-08
modified: 2022-11-27
tags:
- attack.discovery
- attack.t1087.001
logsource:
  category: process_creation
  product: macos
detection:
  selection_1:
    Image|endswith: '/dscl'
    CommandLine|contains|all:
    - 'list'
    - '/users'
  selection_2:
    Image|endswith: '/dscacheutil'
    CommandLine|contains|all:
    - '-q'
    - 'user'
  selection_3:
    CommandLine|contains: '''x:0:'''
  selection_4:
    Image|endswith: '/cat'
    CommandLine|contains:
    - '/etc/passwd'
    - '/etc/sudoers'
  selection_5:
    Image|endswith: '/id'
  selection_6:
    Image|endswith: '/lsof'
    CommandLine|contains: '-u'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This rule is designed to detect the enumeration of local system accounts on macOS devices. Specifically, it targets various command-line utilities commonly used in account enumeration, such as `dscl`, `dscacheutil`, and `cat`, which can expose user information and system configurations. Attackers often seek to gather details about user accounts and permissions as part of the reconnaissance phase of an attack, aiming to identify potential targets for credential theft or lateral movement.

  The rule is aligned with the MITRE ATT&CK framework, particularly targeting the "Discovery" tactic and the technique T1087.001, which focuses on the discovery of user accounts. Understanding user account structures can provide valuable insight into organization hierarchy and necessary privileges needed for further exploitation. Primary data sources that may provide evidence of account enumeration activities include process creation events that log command-line arguments and the path of executed processes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events for occurrences of `dscl`, `dscacheutil`, `cat`, `id`, and `lsof`. Pay special attention to their command-line arguments for indications of account enumeration activities.
  - **Analyze Command-Line Arguments:** Investigate the command-line details for processes matching the selections defined in this detection rule. Look for flags and parameters related to listing user accounts or accessing sensitive configurations.
  - **Correlate with User Activity:** Cross-reference the identified enumeration activities with legitimate user accounts and their expected behaviors, focusing on unusual account accesses or enumeration by non-administrative roles.
  - **Monitor for Follow-Up Actions:** Look for subsequent actions taken after the enumeration activity, such as attempts to access or exploit user accounts, which may indicate a more significant compromise.

  ### Prioritization
  Despite its low-level classification, any detected account enumeration activity could indicate a potentially probing attacker attempting to gather critical information, warranting timely investigation to prevent further exploitation.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage regarding legitimate administrative tasks that may also invoke these commands without any malicious intent. It assumes that logs for the relevant process executions are available and not filtered out by security configurations. Care should be taken to ensure that all necessary logging is enabled on macOS systems to capture the relevant telemetry effectively.

