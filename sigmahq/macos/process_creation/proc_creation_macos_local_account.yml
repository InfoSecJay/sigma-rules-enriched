logsource:
  category: process_creation
  product: macos
detection:
  selection_1:
    Image|endswith: '/dscl'
    CommandLine|contains|all:
    - 'list'
    - '/users'
  selection_2:
    Image|endswith: '/dscacheutil'
    CommandLine|contains|all:
    - '-q'
    - 'user'
  selection_3:
    CommandLine|contains: '''x:0:'''
  selection_4:
    Image|endswith: '/cat'
    CommandLine|contains:
    - '/etc/passwd'
    - '/etc/sudoers'
  selection_5:
    Image|endswith: '/id'
  selection_6:
    Image|endswith: '/lsof'
    CommandLine|contains: '-u'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This Sigma rule detects enumeration of local system accounts on macOS devices. The likely attacker objective is to gather information about user accounts and potential privilege escalation opportunities. This behavior aligns with the MITRE ATT&CK technique for Discovery: Account Discovery (T1087.001). Primary telemetry sources include process creation events, specifically looking for log types related to macOS, such as bash or shell command executions.

  If malicious, this activity could enable an attacker to identify user accounts for further exploitation. However, it's important to note that this detection does NOT confirm malicious intent by itself, as legitimate administrative activities that enumerate users can also trigger this alert.

  ---

  ### Investigation Steps

  - **Review recent process executions:** Examine process creation logs (Event ID for macOS can include `process_created`) for instances of commands executed by `/dscl`, `/dscacheutil`, or `/cat`. Filter out processes with command line arguments indicating potential enumeration.

  - **Identify targeted user accounts:** Check if the command line references `/etc/passwd` or `/etc/sudoers` which can indicate an attempt to view system permissions. This could signify a deeper investigation is required.

  - **Establish baseline for legitimate activity:** Analyze logs for system administration commands run by known IT personnel during maintenance hours. Legitimate usage typically includes account enumeration for service checks, not targeting privileged access.

  - **Correlate with network activity:** Look for any outbound connections (if the host was attempting command and control) around the same timeframe in your network logs, noting connection attempts to unknown external IP addresses.

  - **Check the execution context:** Validate the user context under which these commands were executed. Commands run by non-admin users may indicate suspicious behavior, especially if the execution time appears unusual.

  - **Look for additional indicators of compromise:** Investigate whether these enumeration attempts coincide with lateral movement tactics, such as using `ssh` or `Telnet`, by checking SSH logs for unusual login attempts post-enumeration.

  ---

  ### Prioritization

  This alert is low-priority in an enterprise context because while it indicates a systematic enumeration of local accounts, such behavior can stem from routine administrative actions or legitimate scripting. However, it should still be investigated as it may be indicative of early reconnaissance by a threat actor.

  ---

  ### Blind Spots and Assumptions

  Detection may face limitations if logging levels are set too low, potentially missing critical account enumeration processes. Legitimate user administrative activities could trigger this alert, thereby introducing noise. Companion detections might include monitoring access to administrative logs or unusual account logins, which would bolster the analysis of potential malicious intent.

