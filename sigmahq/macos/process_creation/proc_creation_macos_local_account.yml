  ---

  ### Technical Context

  This Sigma rule detects the enumeration of local system accounts on macOS, a behavior often associated with reconnaissance activities performed by an attacker. The likely objective of such enumeration is to gather information about users and their privileges to identify potential targets for further attacks. This aligns with the MITRE ATT&CK tactic of Discovery, specifically technique T1087.001 (Account Discovery).

  The primary telemetry sources are process creation logs from macOS that capture commands executed including relevant command-line arguments. If this activity is malicious, it could lead to unauthorized access to user accounts or administrative controls, increasing the risk of further exploitation. It’s important to note that this detection does NOT confirm an actual compromise on its own; it only indicates that account enumeration may have occurred.

  ---

  ### Investigation Steps

  - **Examine process creation logs:** Review process creation events (macOS log type) for Event IDs corresponding to the execution of commands ending in `/dscl`, `/dscacheutil`, `/cat`, `/id`, or `/lsof`. Focus on those with command lines containing `/users`, `-q user`, or `/etc/passwd`.

  - **Identify high-confidence indicators:** Look for specific command usage such as `dscl . -list /Users` or `cat /etc/passwd`. These commands are typically not run by standard users and may indicate an unauthorized user attempting to gain account information.

  - **Compare timestamps with user activity:** Check if the timestamps of the detected commands correlate with legitimate administrative actions. Logs with minimal or no user activity preceding these commands may warrant a deeper investigation.

  - **Filter benign administrative access:** Identify legitimate administration activities, such as system administration by known system administrators using common management tools which may invoke similar commands without malicious intent.

  - **Review user roles and asset impact:** Assess the role of the machine from which the enumeration occurred. For critical systems (e.g., domain controllers), unauthorized account discovery can pose a higher risk compared to non-critical systems.

  - **Check for related artifact creation:** Validate if any indicators of file creation or exfiltration artifacts exist, such as unexpected file writes to `/etc/passwd` or unusual temporary files created by unauthorized commands.

  ---

  ### Prioritization

  The alert severity is considered low; however, the context of the affected system can elevate that status, particularly if the command originated from a highly trusted machine. Given that account enumeration is a common precursor to privilege escalation or further exploitation, ongoing monitoring is advisable. Typically, this behavior is weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include obfuscation of command execution or the use of legitimate administrative tools to perform similar functions, possibly obscuring malicious intent. Reliable detection requires properly configured logging that captures command-line execution details; ensure syslog or equivalent logging is enabled at all times. Legitimate administrative scripts may trigger this alert, so consider these contexts when evaluating alerts. Companion detections such as monitoring for repeated failed login attempts (T1078) can enhance the overall detection strategy.

