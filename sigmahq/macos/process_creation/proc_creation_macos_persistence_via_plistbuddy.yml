detection:
  selection:
    Image|endswith: '/PlistBuddy'
    CommandLine|contains|all:
    - 'RunAtLoad'
    - 'true'
    CommandLine|contains:
    - 'LaunchAgents'
    - 'LaunchDaemons'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule monitors for potential persistence mechanisms being established on macOS systems through the use of the PlistBuddy utility. Attackers may leverage PlistBuddy to manipulate property list files associated with LaunchAgents and LaunchDaemons, allowing them to ensure that malicious scripts or applications run at system startup. Such tactics are often employed to maintain a foothold in a compromised environment, enabling persistence even after system reboots.

  The probable threat scenario involves an attacker aiming to execute their code upon user login or system boot without detection, as observed with advanced malware families like Silver Sparrow. This technique specifically falls under MITRE ATT&CK tactics such as **Persistence** (TA0003) and **Privilege Escalation** (TA0004). The associated techniques include **T1543.001: Create or Modify System Process: Launch Agents** and **T1543.004: Create or Modify System Process: Launch Daemons**.

  The primary data source for this detection is process creation logs on macOS systems, which capture information regarding the execution of binaries, command-line arguments used, and their parent processes. Analyzing these logs is critical for uncovering unauthorized persistence mechanisms.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events on affected macOS hosts to identify instances of the PlistBuddy utility being executed with indicative command-line parameters.
  - **Correlate with Persistence Artifacts:** Check for alterations to LaunchAgents and LaunchDaemons directories, focusing on any newly created or modified plist files that may not correspond to standard application behavior.
  - **Analyze User Context:** Determine the user context under which PlistBuddy was executed. Investigate if this action corresponds with known user activity or if it appears anomalous within the environment.
  - **Inspect Related Logs:** Look at system log files, particularly around the time of detection, to ascertain if any other related processes were initiated that might indicate broader malicious activity.

  ### Prioritization
  The severity of this alert is high due to the significant implications of persistence mechanisms in enterprise environments. Successful exploitation can lead to prolonged unauthorized access, data exfiltration, or lateral movement, thereby increasing the urgency for response.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where macOS-specific logging may not be properly configured or where third-party security tooling is not in place to capture process activity comprehensively. The detection logic assumes that PlistBuddy usage is abnormal, thus relying on the defined command-line arguments to signal suspicious intent. There needs to be adequate logging of process creation events and command-line arguments for this rule to function effectively. Additionally, false positives might arise if legitimate applications use PlistBuddy for benign purposes.

