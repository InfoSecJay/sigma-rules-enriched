note: |
  ### Technical Context
  This detection rule identifies attempts to delete MacOS Time Machine backups using the native command-line utility `tmutil`. The primary threat scenario involves an adversary potentially trying to disable recovery options before executing a ransomware attack, thereby preventing victims from recovering their files through traditional backup methods. When ransomware strains encrypt or render files inaccessible, attackers often aim to eliminate backups to maximize their leverage over victims.

  The relevant MITRE ATT&CK tactics and techniques for this detection include "Impact" (T1490 - Inhibit System Recovery), which highlights activities that undermine system recovery capabilities. By deleting backups, adversaries seek to amplify the impact of their malicious activities, making data recovery significantly more challenging or impossible.

  The primary data sources for this detection are process creation events on macOS systems, specifically focusing on the execution of the `tmutil` command with arguments indicative of delete operations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the logs for `tmutil` command invocations that include 'delete' within the command line arguments. This will help identify any unauthorized attempts to remove backups by users or processes.
  - **Correlate with User Activity**: Analyze user activity around the time of the deletion attempt for any unusual behavior. Look for accounts that typically do not interfere with backup processes or were logged in unexpectedly.
  - **Examine File System Changes**: Investigate related file modifications on the backup directory (usually located under `/Volumes/`) to confirm that deletions coincide with the detected `tmutil` activity and document any affected files.
  - **Audit for Anomalous Behavior**: Assess the overall context of the incident by investigating other command-line utilities used around the same timeframe, particularly commands that may indicate broader system manipulation or suspicious data access.

  ### Prioritization
  The alert is of medium severity due to the potential impact on data recovery in the event of a ransomware attack. The likelihood of targeted actors attempting to delete backup systems increases, making detection critical for timely incident response.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include legitimate administrative activities or benign user behavior that use `tmutil` for valid functions other than deletion. The detection logic assumes that the use of `tmutil` with the 'delete' argument is always a sign of malicious intent, which may not hold true in all contexts. For effective detection, macOS process creation logs must be configured and retained properly, ensuring that all relevant command-line arguments are captured and available for analysis.

