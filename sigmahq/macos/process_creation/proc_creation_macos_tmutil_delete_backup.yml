note: |
  ### Technical Context

  This Sigma rule detects deletion attempts of MacOS Time Machine backups via the `tmutil` command. Such behavior may indicate an adversary's objective to hinder recovery efforts, especially before executing ransomware attacks, thereby amplifying the impact on affected systems. This aligns with the MITRE ATT&CK technique T1490 - "Inhibit System Recovery," which highlights methods used by attackers to prevent data restoration.

  The primary telemetry source for this detection is process creation logs showing executions related to `tmutil`. The expected log types include MacOS system logs capturing command-line arguments. If malicious, the security impact could be significant, as it may lead to irreversible data loss. However, this alert does NOT confirm that malicious intent is present without additional context surrounding the event.

  ### Investigation Steps

  - **Examine the command line arguments in logs:**: Review MacOS process creation logs (Event ID for process creation) for instances of `tmutil` being invoked with `delete`. Look for typical command patterns, such as `tmutil delete /Volumes/TimeMachine/BackupName`. Benign usage may include legitimate backup deletion by authorized users.

  - **Check user context of the command execution:**: Identify the executing user account from the process creation logs. Determine if the user has a legitimate business justification for deleting backups. Consider roles that may have such privileges, like system administrators or IT personnel.

  - **Audit for known good activity:**: Investigate recent scheduled maintenance or legitimate backup management operations that may reference `tmutil`. Review MacOS logs, particularly around the time of the alert, to verify expected backup activity.

  - **Identify failed attempts or anomalies around the event:**: Look for logs indicating failed attempts before the deletion command (e.g., permission errors) in syslogs. Examine for unusual patterns, such as commands executed shortly before the deletion attempt that might suggest nefarious intent.

  - **Validate the integrity of existing Time Machine backups:**: Use `tmutil listbackups` to verify that backups exist post-alert and confirm if their integrity is intact. Any discrepancies may warrant further investigation into potential malicious activity.

  ### Prioritization

  This alert has medium severity due to the potential impact on critical systems reliant on backup recovery. The likelihood of malicious behavior is significant, given that adversaries commonly target backup systems before ransomware deployment. Thus, it is essential not to ignore such alerts.

  ### Blind Spots and Assumptions

  Evasion techniques could include legitimate users performing allowed deletions or using obscure command variations that do not trigger normal alerting mechanisms. Reliable detection relies on comprehensive logging configurations for process creation on MacOS. Legitimate administrative tasks may trigger similar alerts during routine cleanup or upgrade processes, warranting careful review. Companion detections, such as those monitoring for unexpected process execution patterns (e.g., unusual parent-child process relationships), can enhance coverage and identify broader malicious activities.

