  ---

  ### Technical Context

  This rule detects attempts to delete backups on macOS systems using the `tmutil` command-line utility, which is part of the macOS backup framework. The likely adversary objective is to impede data recovery efforts before launching a ransomware attack or another form of data compromise. This behavior fits the MITRE ATT&CK tactic of **Impact (TA0040)**, with a specific technique of **Data Destruction (T1490)**. The primary telemetry sources include macOS process creation logs, particularly tracking specific commands and processes related to the execution of `tmutil`. If malicious, this activity poses a significant risk as it can lead to permanent data loss; however, this detection does NOT confirm malicious intent without additional context.

  ---

  ### Investigation Steps

  - **Review relevant process creation logs:** Check for macOS Security Event IDs tied to process creation, specifically Event ID 100 (process execution logs). Look for instances of `tmutil` in the command line with the `delete` option.

  - **Identify the user context of the action:** Verify the user account attempting the deletion. Look in the logs (e.g., logs stored in `/var/log/system.log`) to determine if this user typically performs legitimate backup operations or if it's an unusual activity for this account.

  - **Correlate timestamps with other activity:** Investigate preceding events related to the same user account in process logs (e.g., Event ID 100). Look for other suspicious commands or access patterns that might indicate an escalation of privilege or lateral movement prior to the deletion attempt.

  - **Evaluate system role and data criticality:** Determine the role of the affected system—if it's a server hosting critical or sensitive data (e.g., financial or client information) and assess the severity of data loss that would occur from a successful deletion.

  - **Identify high-confidence malicious indicators:** Check for attempts to delete multiple backups in quick succession or deletion attempts immediately followed by malware execution (correlate with logs of processes or network connections initiated around the same timeframe).

  ---

  ### Prioritization

  This alert is classified as medium severity due to its potential impact on critical system integrity, especially if backups are related to essential data. The likelihood of malicious abuse is moderate, as ransomware actors frequently target backup solutions. While not extremely common, there are known cases of weaponizing `tmutil` in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by users who have legitimate reasons to delete backups, as well as by the potential for changes in `tmutil` command usage in future macOS updates. Reliably detecting this behavior requires proper logging configurations on macOS systems to capture process creation events accurately. Additionally, legitimate activities such as system maintenance or user-initiated cleanup can trigger this alert. A related detection worth monitoring is unusual creation of system snapshots prior to deletion attempts, which may indicate preparation for data destruction.

