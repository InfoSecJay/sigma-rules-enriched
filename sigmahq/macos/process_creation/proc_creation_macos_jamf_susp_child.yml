title: JAMF MDM Potential Suspicious Child Process
id: 2316929c-01aa-438c-970f-099145ab1ee6
status: test
description: Detects potential suspicious child processes of "jamf". Could be a sign
  of potential abuse of Jamf as a C2 server as seen by Typhon MythicAgent.
references:
- https://github.com/MythicAgents/typhon/
- https://www.zoocoup.org/casper/jamf_cheatsheet.pdf
- https://docs.jamf.com/10.30.0/jamf-pro/administrator-guide/Components_Installed_on_Managed_Computers.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-22
tags:
- attack.execution
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    ParentImage|endswith: '/jamf'
    Image|endswith:
            # Note: Add additional binaries/commands that are uncommon during your typical admin usage of Jamf
    - '/bash'
    - '/sh'
  condition: selection
falsepositives:
- Legitimate execution of custom scripts or commands by Jamf administrators. Apply
  additional filters accordingly
level: medium
note: |
  ### Technical Context
  This rule detects potentially suspicious child processes initiated by the Jamf application on macOS systems. Jamf is a popular mobile device management (MDM) solution that can unintentionally be abused by actors seeking to establish command and control (C2) channels or execute unauthorized actions on managed devices. The detection focuses on abnormal or unauthorized interactions initiated under the Jamf process, particularly through shell commands that are not typically used in administrative tasks.

  The suspected threat scenario involves the potential misuse of Jamf as a C2 server, similar to tactics employed by the Typhon MythicAgent, which has been known to leverage legitimate applications for nefarious purposes. This could indicate an attacker attempting to gain persistent access, perform reconnaissance, or deploy other malicious payloads while masquerading within normal administrative processes.

  Relevant MITRE ATT&CK tactics/techniques include:
  - Execution (T1203): This covers the execution of scripts or processes initiated by the compromised parent process.
  - Living Off the Land (T1218): It involves using existing trusted tools, like Jamf, for malicious intent.

  Primary data sources for this detection include process creation events from macOS systems, which capture information about which processes were created, their parent processes, and the commands executed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check process creation logs for instances where child processes are spawned from the Jamf parent process, paying attention to any unusual commands executed below this parent level.
  - **Analyze Command Executions:** Examine the specific commands that are executing under the Jamf process for anomalies or patterns that do not align with typical administrative usage.
  - **Correlate with Historical Data:** Investigate historical data for the Jamf process to identify any similar patterns or behaviors that may indicate a malicious actor exploiting Jamf for nefarious purposes.
  - **Review User Activity Logs:** Cross-reference user activity during the detected events to ascertain whether legitimate administrative actions were being performed, or if unauthorized access has occurred.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of allowing an attacker to execute commands under a trusted MDM application, which can lead to significant changes in managed systems and represent a serious compromise of enterprise security.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage when legitimate execution of scripts or commands by Jamf administrators occurs, which may generate false positives. Additionally, the rule assumes that no other benign applications will spawn similar child processes under the Jamf parent process. The detection logic relies on relevant process creation logs being correctly configured and retained, making correct logging configurations crucial for effective monitoring.

