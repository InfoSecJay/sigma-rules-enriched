note: |
  ### Technical Context

  This rule detects the creation of a new user account and its addition to the admin group on macOS systems using the `sysadminctl` utility. This behavior indicates that an attacker may be attempting to escalate privileges or establish a foothold by gaining the ability to perform administrative tasks without authorization. The relevant MITRE ATT&CK tactics and techniques are Privilege Escalation (TA0004) and Create Account (T1078.003).

  The primary telemetry sources are macOS process creation logs, specifically monitoring the `sysadminctl` execution. If malicious, this behavior significantly increases the risk of unauthorized system access and the potential for further exploitation. Notably, this detection does NOT confirm whether the action was executed legitimately or maliciously; further context is required.

  ### Investigation Steps

  - **Review command execution details**: Check for Event IDs related to process creation, specifically look for macOS process logs to identify `sysadminctl` in the command line, including parameters `-addUser` and `-admin`.

  - **Identify suspicious user behavior**: Examine user account logs to determine if the user that was added has legitimate administrative needs. If the account does not correlate with known administrative activities, it is a suspicious indicator.

  - **Cross-reference system roles**: Validate if the system's role typically requires additional admin users. For critical systems, unauthorized admin additions are more concerning.

  - **Check user account creation timestamps**: Assess whether the account was created during non-business hours or unusual activity patterns which may indicate malicious intent.

  - **Analyze related logs for lateral movement**: Utilize logs from other security tools and systems (e.g., authentication logs and SIEM data) that may show the new account engaging in odd or unauthorized behavior after creation.

  ### Prioritization

  Given that this behavior affects administrative controls and could facilitate unauthorized access, the alert is of medium severity. The likelihood of malicious abuse is significant, especially since privilege escalation techniques are commonly weaponized in attacks. Immediate investigation is warranted to ensure system integrity.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use different utilities or methods for privilege escalation, such as direct modifications with other command-line tools. Ensure that logs from process creation are enabled, as absence of these logs would hinder detection capabilities. Legitimate system administrators may trigger this alert during routine management tasks, thus necessitating further review. A related detection is tracking unexpected changes to user privileges through system logs to strengthen overall coverage against unauthorized access.

