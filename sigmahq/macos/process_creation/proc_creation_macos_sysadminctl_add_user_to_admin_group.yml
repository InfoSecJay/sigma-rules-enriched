note: |
  ### Technical Context
  This rule detects instances where an attacker may attempt to create and add a user account to the admin group on macOS systems using the `sysadminctl` command-line utility. The primary threat scenario involves adversaries aiming to escalate privileges, establish persistence, or gain unauthorized access to higher-level administrative capabilities. This action could be indicative of malicious insider activity or an external attacker leveraging compromised credentials to gain control of administrative functionalities.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Persistence (TA0003)**: The adversary is creating or modifying accounts to maintain access.
  - **Privilege Escalation (TA0004)**: Adding a user to the admin group grants elevated permissions.
  - **Initial Access (TA0001)**: This could suggest attempts to establish footholds in the target environment.

  The primary data sources for this detection are process creation logs, specifically focusing on entries that detail command-line activity executed with the `sysadminctl` utility on macOS systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events for any instances of the `sysadminctl` command, specifically those that include `-addUser` and `-admin` in the command line.
  - **Analyze User Creation Events**: Trace any newly created user accounts back to their source, verifying whether they were intended legitimate accounts or potentially unauthorized additions to the admin group.
  - **Evaluate User Behavior**: Investigate the behavior of the user account that was added to the admin group; check logs for suspicious activities or changes in the system post-creation.
  - **Consult Configuration Management**: Verify system configurations and policies regarding user account management, ensuring that role-based access controls are properly set to prevent inappropriate privilege escalation.

  ### Prioritization
  This alert has medium severity due to its potential impact on system integrity and the ease with which it could be exploited by attackers. Instances of unauthorized user creation in the admin group can lead to significant breaches within an enterprise environment, heightening the need for immediate investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, such as instances where legitimate administrative activities may generate false positives, potentially masking actual threats. The detection logic assumes that `sysadminctl` will be the method of user account creation and does not account for other possible tools or methods that could bypass this specific detection. Logs related to process execution must be configured correctly on macOS systems, and there needs to be monitoring of command-line arguments to ensure comprehensive coverage.

