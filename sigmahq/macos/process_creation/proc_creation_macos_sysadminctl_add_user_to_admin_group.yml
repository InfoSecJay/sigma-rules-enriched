note: |
  ### Technical Context

  This Sigma rule detects the creation of a new user account with administrative privileges on macOS systems using the `sysadminctl` command. The likely objective for an attacker is to gain persistent access to a system by adding a user with elevated privileges, facilitating further actions like credential theft or lateral movement within the environment. This activity maps to the MITRE ATT&CK Technique T1078.003 (Valid Accounts: Local Accounts).

  The primary telemetry source for this detection is the process creation logs on macOS, specifically the `Image` and `CommandLine` values within the logs. If executed maliciously, this could lead to significant security impacts, such as unauthorized access and control over the system. However, this rule does NOT confirm malicious intent on its own, as legitimate administrative tasks may exhibit similar behaviors.

  ### Investigation Steps

  - **Inspect process creation logs:** Check macOS Security Event logs (Event ID for process creation) for entries where `Image` ends with `/sysadminctl`. Note the timestamp and user associated with the action.

  - **Review command line arguments:** Look for specific `CommandLine` arguments that include `-addUser` and `-admin`. Any addition of a user with these parameters should be scrutinized, especially if from non-standard accounts or during odd hours.

  - **Verify the new account:** If a new user is detected, check for the existence of this account in `/Users` directory and its group memberships. Understand the purpose of the user and its legitimacy.

  - **Identify legitimate administrative activities:** Cross-reference the user actions with scheduled maintenance or known administrative changes. Account creation typically correlates with documented change requests in the IT service management system.

  - **Check for concurrent malicious indicators:** Investigate if there are any outbound connections from this new account that are unusual—such as connections to known malicious IPs or domains. Look for logs that may indicate unusual privilege escalation post account creation.

  - **Assess host criticality:** Determine if the machine where this action occurred is a critical asset (e.g., a server vs. a desktop) and elevate the investigation based on its role in the environment.

  ### Prioritization

  This alert is of medium severity, as it indicates a potential escalation attempt on systems that may contain sensitive data or administrative privileges. The likelihood of malicious abuse is moderate, especially if the command is executed by unexpected users or during unusual timings. Such behavior is often weaponized in attacks aiming for persistence and control.

  ### Blind Spots and Assumptions

  Detection may be limited if the logs are not properly configured to capture all process creation events or if the attacker employs evasion tactics, such as modifying system paths. Legitimate administrative operations, like adding service accounts or restructuring user roles based on team changes, can also trigger this alert. A related detection to strengthen coverage could involve monitoring for failed login attempts or unusual login patterns after the creation of the admin account, providing added context to the behavior observed.

