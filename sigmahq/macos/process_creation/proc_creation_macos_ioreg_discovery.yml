title: System Information Discovery Using Ioreg
id: 2d5e7a8b-f484-4a24-945d-7f0efd52eab0
status: test
description: |
  Detects the use of "ioreg" which will show I/O Kit registry information.
  This process is used for system information discovery.
  It has been observed in-the-wild by calling this process directly or using bash and grep to look for specific strings.
references:
- https://www.virustotal.com/gui/file/0373d78db6c3c0f6f6dcc409821bf89e1ad8c165d6f95c5c80ecdce2219627d7/behavior
- https://www.virustotal.com/gui/file/4ffdc72d1ff1ee8228e31691020fc275afd1baee5a985403a71ca8c7bd36e2e4/behavior
- https://www.virustotal.com/gui/file/5907d59ec1303cfb5c0a0f4aaca3efc0830707d86c732ba6b9e842b5730b95dc/behavior
- https://www.trendmicro.com/en_ph/research/20/k/new-macos-backdoor-connected-to-oceanlotus-surfaces.html
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-12-20
modified: 2024-01-02
tags:
- attack.discovery
- attack.t1082
logsource:
  product: macos
  category: process_creation
detection:
    # Examples:
    #   /bin/bash /bin/sh -c ioreg -l | grep -e 'VirtualBox' -e 'Oracle' -e 'VMware' -e 'Parallels' | wc -l
    #   /usr/sbin/ioreg ioreg -rd1 -w0 -c AppleAHCIDiskDriver
    #   /bin/bash /bin/sh -c ioreg -l | grep -e 'USB Vendor Name'
    #   ioreg -rd1 -c IOPlatformExpertDevice | awk '/IOPlatformSerialNumber/ { split($0, line, \"\\\"\"); printf(\"%s\", line[4]); }
  selection_img:
  - Image|endswith: '/ioreg'
  - CommandLine|contains: 'ioreg'
  selection_cmd1:
    CommandLine|contains:
    - '-l'
    - '-c'
  selection_cmd2:
    CommandLine|contains:
    - 'AppleAHCIDiskDriver'
    - 'IOPlatformExpertDevice'
    - 'Oracle'
    - 'Parallels'
    - 'USB Vendor Name'
    - 'VirtualBox'
    - 'VMware'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the `ioreg` command on macOS systems, which is frequently used for gathering system information and I/O Kit registry details. Attackers may leverage this command to discover system configurations and hardware details, which can aid in the planning and execution of further attacks, such as privilege escalation or lateral movement within a network. The activity signals a potential unauthorized reconnaissance phase within a compromised environment or by a malicious insider.

  The main MITRE ATT&CK tactics applicable here are **Discovery** (TA0007) and the technique **System Information Discovery** (T1082). By understanding the system architecture and the hardware specifications, an attacker can formulate strategies to exploit the system more effectively.

  Primary data sources for this detection include process creation logs that detail command execution on macOS, capturing the instances where `ioreg` is invoked, particularly when used in conjunction with other commands like `bash` or `grep` to filter specific information.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for the execution of the `ioreg` command, specifically looking for unusual command-line arguments that could indicate a malicious intent.
  - **Correlate with User Activity**: Identify the user account associated with the execution of `ioreg` and determine if this user has legitimate administrative privileges or access to execute such commands.
  - **Analyze Command Patterns**: Look for patterns or sequences in command execution that may suggest automated or scripted behavior, particularly with the presence of piping commands like `grep`.
  - **Check for Associated Network Activity**: Investigate if there are outbound connections or data exfiltration attempts that occurred around the same time as the `ioreg` command execution, indicating potential data theft.

  ### Prioritization
  The severity of this alert should be considered medium, as the use of `ioreg` may indicate an attacker reconnaissance phase on the system, which could lead to more severe exploits. It is critical to assess the context, such as whether the command was executed by an authenticated user with administrative privileges.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative activities, as the use of `ioreg` can also be part of regular system maintenance and troubleshooting. The detection logic assumes that all instances of `ioreg` are potentially malicious, which may not be accurate in every case. Required logs for this alert to function effectively include detailed process creation logs that capture the command-line execution context, including user identity and timestamp information. The absence of such logs may lead to missed detections or false negatives.

