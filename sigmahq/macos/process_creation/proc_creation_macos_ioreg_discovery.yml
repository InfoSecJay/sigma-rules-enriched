logsource:
  product: macos
  category: process_creation
detection:
    # Examples:
    #   /bin/bash /bin/sh -c ioreg -l | grep -e 'VirtualBox' -e 'Oracle' -e 'VMware' -e 'Parallels' | wc -l
    #   /usr/sbin/ioreg ioreg -rd1 -w0 -c AppleAHCIDiskDriver
    #   /bin/bash /bin/sh -c ioreg -l | grep -e 'USB Vendor Name'
    #   ioreg -rd1 -c IOPlatformExpertDevice | awk '/IOPlatformSerialNumber/ { split($0, line, \"\\\"\"); printf(\"%s\", line[4]); }
  selection_img:
  - Image|endswith: '/ioreg'
  - CommandLine|contains: 'ioreg'
  selection_cmd1:
    CommandLine|contains:
    - '-l'
    - '-c'
  selection_cmd2:
    CommandLine|contains:
    - 'AppleAHCIDiskDriver'
    - 'IOPlatformExpertDevice'
    - 'Oracle'
    - 'Parallels'
    - 'USB Vendor Name'
    - 'VirtualBox'
    - 'VMware'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activities
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of the `ioreg` command on macOS systems, which is commonly used to gather system information regarding I/O Kit components. The likely attacker objective is to perform reconnaissance to discover hardware details, system configurations, and installed software, which can aid in later stages of an attack, such as establishing persistence or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Discovery, specifically Technique T1082 (System Information Discovery).

  The primary telemetry source for this detection is macOS process creation logs, which capture the execution of commands. If malicious, the security impact could include unauthorized access to sensitive system configurations, aiding further attacks or exploits. It's important to note that this detection does NOT confirm malicious activity on its own; further context is required to determine intent.

  ---

  ### Investigation Steps

  - **Review process execution logs:** Look for Security Event ID for process creation (usually logged in macOS audit logs). Check for entries related to `ioreg` in CommandLine fields.

  - **Analyze command parameters:** Check the CommandLine for flags such as `-l`, `-c`, and specific components like `IOPlatformExpertDevice` or `AppleAHCIDiskDriver`. Malicious usage often includes scripted execution that outputs sensitive information, unlike benign administrative use.

  - **Identify scheduled tasks or automation tools:** Validate if the command is being executed as part of scheduled tasks (e.g., cron jobs) or via automation frameworks (like Ansible). Legitimate IT admin activities might include regular health checks or hardware inventories.

  - **Cross-reference user account context:** Determine if the user executing this command has administrative privileges or if it aligns with normal user workflows. Suspicious accounts might hint at credential theft or insider threats.

  - **Check for additional suspicious behavior:** Look for patterns of behavior such as repeated executions of `ioreg`, especially in conjunction with execution of other system discovery commands (e.g., `system_profiler`, `pmset`) in a short timeframe, indicating reconnaissance activity.

  - **Assess the system's criticality:** Identify if the host executing `ioreg` is a critical system (e.g., servers, domain controllers). Execution in these environments raises the risk of significant impact from potential malicious activity.

  ---

  ### Prioritization

  The alert has medium severity as it may indicate potential reconnaissance activity from a compromised host or escalated user permissions. Since `ioreg` is a standard system command, likelihood of malicious abuse increases when it is executed under unusual user contexts or outside normal operational hours.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environmental configurations not logging detailed process execution or if command output is piped and not captured in logs. Legitimate activities, such as system audits or hardware inventories executed by trusted IT staff, may inadvertently trigger this alert. A companion detection for related command-line utilities, such as `system_profiler`, would strengthen monitoring for comprehensive system discovery efforts.

