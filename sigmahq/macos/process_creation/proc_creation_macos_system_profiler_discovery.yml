note: |
  ### Technical Context

  This Sigma rule detects the use of the `system_profiler` command on macOS, specifically when run with certain data types that provide extensive system information. The likely objective of an attacker using this command is to gather hardware and software configuration details or to identify the presence of security controls, potentially for evasion tactics. This detection maps to MITRE ATT&CK techniques T1082 (System Information Discovery) and T1497.001 (Virtualization/Sandbox Evasion). The primary telemetry source is macOS process creation logs, specifically looking for events related to the execution of the `system_profiler` command. A malicious execution can lead to increased system vulnerability by exposing system configurations. Importantly, this detection does NOT confirm malicious intent on its own, as `system_profiler` can be legitimately executed for administrative purposes.

  ### Investigation Steps

  - **Identify command invocation:** Review process creation logs for macOS (Event ID for process creation is relevant). Filter for `Image` ending with `/system_profiler` and check `CommandLine` for data types such as `SPApplicationsDataType`, `SPHardwareDataType`, or `SPNetworkDataType`. Legitimate uses typically do not include the use of these specific parameters.

  - **Examine execution context:** Validate the user context in which `system_profiler` was executed by checking user history logs or Terminal history on the affected system (e.g., use `last` command or check `/var/log/system.log`). Administrative users legitimate in executing system checks can indicate an expected activity.

  - **Cross-reference system configuration:** Look at existing inventory lists or configuration management databases (CMDB) to compare the system information reported by `system_profiler` with known configurations. Significant discrepancies between expected and reported data may indicate reconnaissance by an adversary.

  - **Assess for automation:** Check if the command was invoked as part of a script (e.g., look for cron jobs or launch daemons). Investigate any related scripts for signs of malicious intent or unusual patterns that go beyond typical administrative maintenance.

  - **High-confidence malicious indicator:** Identify if `system_profiler` was executed from a non-standard path or if chained with other suspicious commands within the same command line entry. For example, check if a suspected malware family is known to invoke it in its dropper or execution sequences.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant security impact if an attacker is collecting detailed system information. The likelihood of malicious abuse is moderate, as reconnaissance through `system_profiler` is a known technique among threat actors. This particular behavior can often be a precursor to lateral movement or further exploitation of the system.

  ### Blind Spots and Assumptions

  Detection may be limited if `system_profiler` is executed in a manner that circumvents standard logging (e.g., through obfuscation or direct command execution in a terminal session without logging). It is essential to ensure that process creation logging is enabled for all relevant macOS systems to capture this behavior reliably. Additionally, legitimate system administrators executing `system_profiler` for valid reasons can generate false positives, such as during routine system audits. A related detection that strengthens coverage could include monitoring for other known system information discovery commands or tools (e.g., `ifconfig`, `netstat`).

