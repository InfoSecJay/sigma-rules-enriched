title: System Information Discovery Using System_Profiler
id: 4809c683-059b-4935-879d-36835986f8cf
status: test
description: |
  Detects the execution of "system_profiler" with specific "Data Types" that have been seen being used by threat actors and malware. It provides system hardware and software configuration information.
  This process is primarily used for system information discovery. However, "system_profiler" can also be used to determine if virtualization software is being run for defense evasion purposes.
references:
- https://www.trendmicro.com/en_za/research/20/k/new-macos-backdoor-connected-to-oceanlotus-surfaces.html
- https://www.sentinelone.com/wp-content/uploads/pdf-gen/1630910064/20-common-tools-techniques-used-by-macos-threat-actors-malware.pdf
- https://ss64.com/mac/system_profiler.html
- https://objective-see.org/blog/blog_0x62.html
- https://www.welivesecurity.com/2019/04/09/oceanlotus-macos-malware-update/
- https://gist.github.com/nasbench/9a1ba4bc7094ea1b47bc42bf172961af
author: Stephen Lincoln `@slincoln_aiq` (AttackIQ)
date: 2024-01-02
tags:
- attack.discovery
- attack.defense-evasion
- attack.t1082
- attack.t1497.001
logsource:
  product: macos
  category: process_creation
detection:
  selection_img:
  - Image|endswith: '/system_profiler'
  - CommandLine|contains: 'system_profiler'
  selection_cmd:
        # Note: This list is based on CTI reporting. Threat actors might use other data types. Please refere to https://gist.github.com/nasbench/9a1ba4bc7094ea1b47bc42bf172961af for a full list
    CommandLine|contains:
    - 'SPApplicationsDataType'
    - 'SPHardwareDataType'
    - 'SPNetworkDataType'
    - 'SPUSBDataType'
  condition: all of selection_*
falsepositives:
- Legitimate administrative activities
level: medium
note: |
  ### Technical Context
  This detection rule monitors for the execution of the `system_profiler` command on macOS systems, specifically targeting command-line arguments that reveal detailed system hardware and software configurations. The presence of specific data types, such as `SPApplicationsDataType`, `SPHardwareDataType`, `SPNetworkDataType`, and `SPUSBDataType`, suggests an attacker may be performing system information discovery. Such execution can indicate intent to gather insights into the environment, potentially to identify vulnerabilities or assess defense mechanisms, especially if virtualization software is in use.

  Attackers often leverage this information to plan further attacks, such as privilege escalation or lateral movement within the network. A likely attacker objective in this scenario is to gather intelligence that could help bypass security controls. This behavior corresponds to the MITRE ATT&CK tactics for "Discovery" (TA0007) and "Defense Evasion" (TA0005), with specific techniques like "System Information Discovery" (T1082) and "System Information Discovery - Virtualization" (T1497.001).

  The primary data sources for this detection are process creation logs from macOS. These logs will capture details about executed commands and their arguments, providing crucial evidence of suspicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for instances of `system_profiler` being executed, especially those that include the flagged command line arguments indicating potential data types used by threat actors.

  - **Correlate with User Activity:** Identify the user or process initiating `system_profiler`. Investigate whether this aligns with typical administrative behavior or if it represents anomalous activity.

  - **Analyze System Information Output:** If available, review the output or documentation related to the `system_profiler` command to understand what data was accessed. Look for sensitive data types being queried.

  - **Check for Virtualization Software:** Determine whether virtualization tools are present on the system, as the usage of `system_profiler` to check for these tools could indicate attempts at evading detection mechanisms.

  ### Prioritization
  This rule is labeled as medium severity due to the potential impact of system information discovery on an enterprise environment. Although it may result from legitimate administrative processes, the likelihood that these commands are misused by an adversary necessitates timely investigation.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if the attacker utilizes alternative command options or other methods for information discovery that do not invoke `system_profiler`. The detection logic assumes that logs for process creation are enabled and retain sufficient detail to capture any relevant commands. Furthermore, if legitimate administrative activities frequently involve the flagged data types, there may be a need to fine-tune the detection to minimize false positives.

