note: |
  ### Technical Context

  This Sigma rule detects the execution of the `system_profiler` command on macOS systems, specifically when it requests system information via certain data types associated with applications, hardware, and network configurations. The likely attacker objective is to gather detailed system configuration data, which can be leveraged for planning further attacks, identifying vulnerabilities, or evading detection mechanisms within virtual environments. This activity aligns with the MITRE ATT&CK tactics of Discovery (T1082) and Defense Evasion (T1497.001).

  The primary telemetry source is macOS process creation logs that can be captured via `/var/log/system.log` or Event IDs related to process activity. Malicious execution of this command can lead to significant security impact, especially if it reveals the system's defenses or virtualization environment to an adversary. However, it is important to note that this detection does NOT confirm malicious intent solely based on the command's execution; legitimate administrative activities can also trigger it.

  ### Investigation Steps

  - **Review process creation logs**: Examine macOS Event IDs related to process creation (e.g., `Event ID 201` from `/var/log/install.log`). Look for `system_profiler` in the process tree and assess the parent process to identify if it originated from a legitimate administrative tool or script.

  - **Analyze command line arguments**: Identify any command line arguments used with `system_profiler`. Specifically, check for `SPApplicationsDataType`, `SPHardwareDataType`, `SPNetworkDataType`, or `SPUSBDataType`. Alert on the execution of these data types as they are commonly used for reconnaissance purposes by threat actors.

  - **Cross-reference legitimate use cases**: Determine if `system_profiler` was executed by known administrative accounts performing expected system checks. User account activity can provide context; for instance, legitimate administrators may run this command for troubleshooting.

  - **Investigate resulting output files**: If possible, capture and analyze outputs generated by `system_profiler`. Check for the creation of files that may contain sensitive system information, especially if the command was run non-interactively.

  - **Look for associated network activity**: Check system logs or network traffic for any attempts to exfiltrate the gathered system data after the command execution. Analyze unusual outbound connections or data transfers that correlate with the command's usage.

  ### Prioritization

  This alert is of medium severity due to the potential for information gathering and the likelihood of malicious abuse if combined with other tactics. The execution of `system_profiler` for reconnaissance is a common precursor to exploit attempts, especially against systems deemed critical.

  ### Blind Spots and Assumptions

  Difficulties may arise in distinguishing between legitimate administrative usage and malicious activity since both scenarios can trigger this alert. Reliable detection depends on comprehensive logging from the macOS environment, particularly process creation logs. Additionally, benign activities, such as system maintenance or inventory checks by IT staff, might produce similar alerts. A companion detection to consider is monitoring for unusual access patterns or abnormal privileges associated with the accounts executing this command.

