note: |
  ### Technical Context

  This Sigma rule detects the execution of the `hdiutil` utility specifically for mounting disk images on macOS systems. Such behavior can indicate an attacker's objective to access and manipulate data from disk images, potentially including malware delivery or data exfiltration. This activity aligns with the MITRE ATT&CK techniques for initial access (T1566.001 – Phishing: Spear Phishing Attachment) and collection (T1560.001 – Archive Collected Data).

  The primary telemetry source for this detection is the process creation logs in macOS, specifically looking at the event data for the execution of the `hdiutil` command with arguments such as "attach" or "mount." If malicious, this action grants the attacker unauthorized access to the contents of mounted disk images. It’s important to note that this detection does NOT confirm malicious intent by itself; legitimate administrative or user actions may invoke this command without malicious intent.

  ### Investigation Steps

  - **Review process creation logs**: Check for macOS process creation logs (Event ID 100) related to `hdiutil` with command-line arguments that include "attach" or "mount." Look for unusual execution context or timing that deviates from normal user behavior.

  - **Identify the user context**: Determine the user account initiating the `hdiutil` command. If executed by a standard user in a sensitive context (e.g., on a server or critical system), it may be malicious versus a legitimate usage on an administrator's machine.

  - **Inspect attached disk images**: Investigate logs for attached disk images, specifically using the filesystem event logs (e.g., `/private/var/log/system.log`). Validate the integrity and source of any mounted images, searching for known bad hashes or unusual file types.

  - **Check for related network activity**: Analyze network logs for unusual outbound traffic correlated with the execution of `hdiutil`. Look for evidence of data exfiltration (e.g., large file transfers or connections to unknown IPs) immediately following the command's execution.

  - **Correlate with known vulnerabilities**: Review current security advisories for any vulnerabilities related to `hdiutil` or associated disk image file types that may have been exploited to execute commands without direct user interaction.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on data security and integrity on macOS systems. While the likelihood of malicious abuse exists—especially in scenarios involving compromised accounts or systems—the behavior could also stem from legitimate administrative tasks, making careful context assessment crucial.

  ### Blind Spots and Assumptions

  Detection may suffer from limitations like the execution of `hdiutil` not being logged due to logging misconfigurations or conversation of processes to background tasks. Legitimate uses, such as routine administrative tasks or testing, may trigger this alert without malicious intent; thus, context is essential. It’s advisable to supplement this detection with monitoring on user behavior anomalies linked to process execution, such as using a companion rule for suspicious application launches within the same user session.

