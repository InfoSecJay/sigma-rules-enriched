note: |
  ### Technical Context
  This rule detects the execution of the `hdiutil` utility on macOS systems, specifically monitoring for commands that indicate attempts to mount disk images. Attackers may use these techniques to gain access to malicious disk images that could contain harmful payloads or tools, allowing them to execute unauthorized code or exfiltrate sensitive data. This activity can often be part of an initial access strategy where adversaries attempt to introduce malware into the environment or later stages of a compromise to facilitate C2 communications or data collection.

  The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) as the malicious use of `hdiutil` could signify entry into the system, and **Collection** (TA0009) if the disk image contains files of value. Specifically, techniques such as **Phishing: Spear Phishing Link** (T1566.001) may be utilized to lure users into executing the commands, while **Data from Information Repositories** (T1560.001) could be employed to gather sensitive information from the mounted disk images.

  Primary data sources for this detection rule include **process creation logs** on macOS, which capture the execution of applications and the associated command-line parameters used.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze macOS process creation logs for instances where `hdiutil` is executed, focusing on the command line to identify whether the `attach` or `mount` parameters are used.

  - **Check User Context:** Identify the user accounts executing the `hdiutil` command and cross-reference against known administrator activities to detect any anomalies or unauthorized access.

  - **Inspect Disk Image Sources:** Investigate the origin of the disk images being mounted, looking for unusual or suspicious sources. Correlate any identified disk images with intelligence on known malware or risky file types.

  - **Evaluate System Behavior post-Execution:** Monitor for subsequent activities following the mounting of disk images, as attackers may use this as a stepping stone for further malicious actions, including executing payloads or establishing persistence.

  ### Prioritization
  This alert is considered medium severity due to the potential risk associated with unauthorized access through disk image mounting, which could lead to malware deployment or data theft, especially if executed by non-administrative users.

  ### Blind Spots and Assumptions
  This detection logic may not cover scenarios where attackers use alternative methods or tools to mount disk images, bypassing `hdiutil` entirely. An assumption made is that the execution of `hdiutil` is abnormal unless tied directly to legitimate administrative tasks; thus, reliance on clear baselines is needed. It's also essential to ensure appropriate logging is enabled for macOS process creation to allow this alert to function effectively, particularly in the context of capturing full command-line arguments.

