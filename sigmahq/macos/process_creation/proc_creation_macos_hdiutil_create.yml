note: |
  ### Technical Context

  This detection identifies the use of the `hdiutil` utility on macOS to create disk images, which can be a method employed by attackers to exfiltrate data or prepare files for covert storage. If an attacker has access to a system and executes this command, their likely objective may include data theft, persistence, or hiding malicious payloads within disk images. This behavior aligns with the MITRE ATT&CK tactic of **Exfiltration** (TA0010), specifically the technique **Exfiltration Over Command and Control Channel** (T1041).

  The primary telemetry sources for this detection are macOS process creation logs, specifically focusing on process creation events recorded by macOS’s unified logging system. If malicious, the impact could lead to unauthorized access to sensitive data, potentially compromising the integrity and confidentiality of the organization’s assets. It is crucial to note that the execution of this command does NOT confirm nefarious activity on its own, as legitimate administrators may use `hdiutil` for legitimate administrative tasks.

  ### Investigation Steps

  - **Examine process details:** Check for Security Event ID related to process creation for `hdiutil`. Verify the command line parameters used; a suspicious command would include `create` along with unusual or unexpected arguments.

  - **Investigate the user context:** Identify the user account executing the command. If the command was executed by an administrative user or an atypical user account that typically does not engage in such activities, it may indicate malicious behavior.

  - **Correlate with historical activity:** Look into the logs to see if this command execution is a part of a larger suspicious behavioral pattern, particularly investigating logging timelines for any prior anomalous activities.

  - **Identify legitimate usage:** Determine if `hdiutil` usage aligns with documented administrative tasks. For example, check if there are prior scheduled tasks or maintenance activities that require disk image creation and whether they are documented.

  - **Assess the creation of disk images:** Check for newly created disk image files (typically with .dmg extension) in common directories (e.g., /Users/[username]/Desktop, /Volumes). Unusual timestamps or access patterns can suggest malicious intent.

  - **Review associated network traffic:** If applicable, check for any outbound traffic indicating that the disk image files may have been copied or transferred over the network immediately following their creation, particularly looking for large transfers or unusual external destinations.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of unauthorized data exfiltration from critical systems. While the likelihood of malicious usage is moderate, the command represents a common method utilized in macOS malware scenarios, thus warranting prompt investigation.

  ### Blind Spots and Assumptions

  The alert may generate false positives when legitimate users or administrators utilize `hdiutil` for normal functions such as backups or disk management. Evasion techniques may include using alternative commands or disguising activities under legitimate-looking user accounts. Reliable detection requires comprehensive logging of process creations and command-line arguments on macOS. A companion detection to consider is monitoring file access patterns in the same timeframe to provide context surrounding the created disk images.

