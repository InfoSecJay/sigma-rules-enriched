note: |
  ### Technical Context
  This detection rule identifies the execution of the `hdiutil` utility on macOS systems, specifically focusing on commands that are used to create disk images. The ability to create disk images can signify an attempt to exfiltrate data, as attackers may use this tool to archive sensitive information before transferring it to external networks. Attackers looking to manipulate or extract data could leverage `hdiutil` to encapsulate data and obfuscate their actions, making this functionality pivotal in various exploitation scenarios.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Exfiltration (TA0010)**, which focuses on data extraction techniques, and **Command and Scripting Interpreter (TA0053)**, showing the usage of command-line interfacing tools for executing actions on systems. Detecting inappropriate or unusual usages of `hdiutil` can help pinpoint potential data exfiltration attempts or unauthorized data manipulation.

  Key data sources for this detection include **process creation events** from macOS systems, as they provide insights into what processes are being initiated and their command-line parameters. Security teams should prioritize monitoring these logs to establish baselines for normal usage.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze recent process creation logs to identify instances of `hdiutil` being executed. Pay particular attention to the command-line arguments associated with each instance to determine if the context appears legitimate or suspicious.

  - **Correlate with User Activity:** Investigate whether the users executing `hdiutil` belong to administrative roles or typically perform disk imaging tasks. Check if these activities coincided with known or expected administrative tasks.

  - **Assess Network Traffic:** Examine egress network traffic during the time of `hdiutil` execution to identify any suspicious file transfers that coincide with the creation of disk images. Look for large payloads or access to uncommon external IP addresses.

  - **Conduct File Integrity Checks:** Identify whether newly created disk images are present on system files. Review file paths and timestamps to ascertain if there are any patterns that might suggest data exfiltration.

  ### Prioritization
  This alert is categorized as medium severity due to the potential for misuse of disk imaging tools to exfiltrate sensitive data, especially if executed under unusual circumstances. Although hdiutil is a legitimate tool, its presence in certain contexts raises a flag, prompting further investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate uses of `hdiutil` by administrators or routine tasks within the organization. The detection logic assumes that instances of `hdiutil` with the `create` command are suspicious; therefore, benign uses will likely generate false positives. Additionally, for this alert to function effectively, process creation logs must be enabled and accessible within the security monitoring environment.

