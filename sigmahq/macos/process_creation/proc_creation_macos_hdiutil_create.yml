  ### Technical Context

  The Sigma rule detects the execution of the `hdiutil` command-line utility specifically when it is used to create disk images on macOS systems. This behavior is of interest as it is often leveraged by attackers to create encrypted disk images that can contain stolen data or to obscure malicious files. The primary MITRE ATT&CK tactic relevant here is **Exfiltration** (TA0010), specifically technique **Exfiltration Over Command and Control Channel** (T1041).

  The primary telemetry source for this detection is the macOS process creation logs, specifically monitoring the command-line arguments of the `hdiutil` process. The security impact could be significant if an attacker uses this command for data exfiltration or to hide malicious content within a disk image. On its own, this detection does NOT confirm that the behavior is malicious; legitimate use by administrators can trigger the rule.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check macOS system logs for Security Event ID related entries where the image ends with `/hdiutil` and CommandLine contains ‘create’. Look for user context, timestamps, and associated parent processes to determine if the execution is expected.

  - **Validate command options:** Identify the parameters used with `hdiutil create`. Legitimate commands will often include parameters such as `-size` and `-type`. Malicious indicators include unusual sizes or types that don’t correspond with typical administrative tasks.

  - **Cross-reference user context:** Verify if the user executing the command has a legitimate reason to create a disk image. Look for known administrator accounts or unusual accounts in the logs to ascertain if the user is likely to be engaging in legitimate administrative work.

  - **Check for subsequent file creations:** After the execution of `hdiutil create`, validate file creation events by checking for mounted disk images or other related files using `ls /Volumes` or checking for entries in `/var/log/system.log` for associated volume mounts.

  - **Monitor for follow-up actions:** Look for additional suspicious behavior following the execution of `hdiutil`, such as unusual network activity or the execution of scripts that may indicate an attempt to exfiltrate data on the created disk image.

  ---

  ### Prioritization

  This alert has medium severity as it indicates potential data exfiltration on macOS systems. The impact is heightened on critical assets that may contain sensitive information, and the likelihood of malicious abuse exists given that disk images can mask illicit activities. However, the common use of this utility by legitimate users limits its immediate threat level.

  ---

  ### Blind Spots and Assumptions

  Detection of `hdiutil` usage may be evaded by disabling logging or by utilizing obfuscated command execution methods. Accurate detection requires proper configuration of macOS logging features to ensure process executions are logged correctly. Legitimate activities like system backups or user-initiated disk image creations could trigger this alert. A related detection to consider is monitoring file activity in `/Volumes` for unexpected content following the creation of a disk image.

