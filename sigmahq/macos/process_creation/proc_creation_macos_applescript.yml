note: |
  ### Technical Context

  This rule detects the execution of AppleScript through the macOS scripting interpreter, `osascript`. The objective of the attacker may include automation of malicious tasks, such as interacting with user files or launching further payloads. This behavior is primarily associated with the MITRE ATT&CK technique for *Command and Scripting Interpreter* (T1059.002).

  The primary telemetry source for this detection is process creation events on macOS, specifically focusing on the execution of the `osascript` binary. The potential security impact of this behavior is significant; if malicious, it could facilitate unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications may use AppleScript as part of their operational functionality.

  ### Investigation Steps

  - **Check for specific process creation events:** Review macOS process creation logs (Sysmon Event ID 1, or macOS native logs) for `osascript` executions. Note the timestamps and user context to assess user behavior.

  - **Inspect command-line parameters:** Evaluate the command line associated with each `osascript` process. Look for suspicious flags like `-e`, or file extensions such as `.scpt` or `.js`, which are indicative of potential misuse. Compare against legitimate script execution patterns.

  - **Identify benign examples:** Find instances where `osascript` might be legitimately called, like software installations or automation tools used by a user. Note contextual factors, such as the application being newly installed or functionality tied to a user’s role.

  - **Examine related scripts:** If suspicious AppleScripts are found, check for any related script files (e.g., `.scpt` files) in directories accessible by the user. Look for unusual creation or modification timestamps that do not align with legitimate user activity.

  - **Correlate with user activity logs:** Cross-reference execution times with user activity logs for atypical access patterns or behaviors (e.g., file accesses or network connections) that occur immediately before or after `osascript` execution.

  - **Review system impact assessments:** Assess the role of the affected host. If the system has critical functionalities or sensitive data, prioritize further analysis and potential remediation efforts based on the value of the target.

  ### Prioritization

  This alert should be treated with medium priority due to the moderate impact it can have on macOS systems. While misuse of AppleScript isn't the most commonly weaponized technique, it can facilitate further attacks, making it essential to investigate. The system's role significantly impacts the urgency of further actions.

  ### Blind Spots and Assumptions

  Detection is limited due to potential evasion by attackers using obfuscation in their AppleScript code or employing benign applications that integrate scripting for legitimate purposes. Required log sources include detailed macOS process creation logs; without them, detection may be unreliable. Legitimate scripting usage includes automation within applications or scheduled tasks, which means analysts must consider context. A companion detection rule for broader command execution (e.g., `bash` or `zsh`) can strengthen coverage against scripting misuse across the macOS environment.

