logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/osascript'
    CommandLine|contains:
    - ' -e '
    - '.scpt'
    - '.js'
  condition: selection
falsepositives:
- Application installers might contain scripts as part of the installation process.
level: medium
note: |
  ### Technical Context
  This rule detects the execution of AppleScript through the macOS interpreter `osascript`, which is commonly used to automate tasks and manage applications on macOS systems. The detection focuses on command-line invocations that include specific flags or script file types (like `.scpt` or `.js`). Attackers may leverage AppleScript for automation purposes; however, it can also be utilized for malicious actions such as gathering sensitive information, manipulating applications, or executing processes within the victim's environment.

  The threat scenario involves attackers who seek to exploit the macOS scripting capabilities to conduct lateral movement or automate malicious tasks. Since AppleScript has legitimate administrative uses, identifying malicious intent behind its execution is crucial for security teams. Relevant MITRE ATT&CK tactics include Execution (T1059.002) where the technique focuses specifically on interpreted scripting languages. The primary data sources for this detection are macOS process creation logs which track the execution of scripts through `osascript`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of `osascript` execution, focusing on the associated command-line arguments that indicate unusual script activity.
  - **Analyze Script Content:** If possible, retrieve and review the scripts being executed. Look for terms and commands that are uncommon or unexpected for your environment, such as commands that access sensitive files or network artifacts.
  - **Check User Context:** Determine the user context under which the AppleScript was executed. Pay attention to any administrative users or unusual accounts that may be involved, pointing to potential privilege escalation.
  - **Correlate with Other Events:** Analyze related logs from EDR systems or application logs that may provide additional context for the script's execution, such as network connections or application behavior post-execution.

  ### Prioritization
  This alert is classified as medium severity due to the potential for abuse of AppleScript capabilities within the macOS environment. While not a common vector for widespread attacks, its execution may indicate preparatory steps towards compromise or elevated privileges when linked with other suspicious activities.

  ### Blind Spots and Assumptions
  Gaps in detection coverage might include script executions that do not utilize `osascript` directly or those embedded within legitimate applications or installers. The detection logic assumes that detailed process creation logs are available and adequately configured, along with the capability to capture command-line arguments. If script obfuscation or misdirection techniques are employed, it may lead to false negatives. Additionally, it is assumed that defenders have visibility into user activity levels to distinguish between legitimate and suspicious script executions.

