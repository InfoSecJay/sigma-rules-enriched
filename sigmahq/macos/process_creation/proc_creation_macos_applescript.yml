title: MacOS Scripting Interpreter AppleScript
id: 1bc2e6c5-0885-472b-bed6-be5ea8eace55
status: test
description: Detects execution of AppleScript of the macOS scripting language 
  AppleScript.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1059.002/T1059.002.md
- https://redcanary.com/blog/applescript/
author: Alejandro Ortuno, oscd.community
date: 2020-10-21
modified: 2026-05-21
tags:
- attack.execution
- attack.t1059.002
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/osascript'
    CommandLine|contains:
    - ' -e '
    - '.scpt'
    - '.js'
  filter_optional_opencode:
        # OpenCode uses osascript to handle copying text from the TUI on MacOS devices. See https://github.com/anomalyco/opencode/blob/ca723f1cbc6fc4244ae57e61e9de8c4e37380ed4/packages/opencode/src/cli/cmd/tui/util/clipboard.ts#L65 for reference.
    ParentImage|endswith: 'opencode'
    CommandLine|contains|all:
    - 'osascript'
    - ' -e '
    - 'set imageData to the clipboard'
    - 'set fileRef'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Application installers might contain scripts as part of the installation 
  process.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of AppleScript via the `osascript` command. It is commonly used for automating tasks on macOS, but can also be exploited by attackers to execute malicious scripts that may perform unauthorized actions on the system. The likely attacker objective is to execute code that could manipulate system configurations, extract data, or further compromise systems. This behavior is associated with the MITRE ATT&CK technique "Command and Scripting Interpreter: AppleScript" (T1059.002).

  The primary telemetry sources for this detection are macOS process creation logs, specifically focusing on `osascript` executions. If this behavior is malicious, it can lead to unauthorized access, data exfiltration, or system control. However, this detection alone does not confirm malicious intent; it only highlights potentially suspicious usage of AppleScript.

  ### Investigation Steps

  - **Review process creation logs:** Check for process creation events such as macOS Security Event ID 100 and look for the presence of `osascript` in the Image field and terms like ' -e ' or '.scpt' in CommandLine.

  - **Correlate with user context:** Identify the user executing the script. If the user’s role does not typically involve script execution, it raises suspicion. Look for anomalous user accounts or accounts with no recent legitimate activity.

  - **Analyze command line arguments:** Confirm if any command lines executing `osascript` include unexpected flags or scripts that are not part of normal operations. Legitimate use cases often involve known, benign scripts, such as system updates or automation tasks.

  - **Identify high-confidence malicious indicators:** Focus on identifying patterns where `osascript` is called alongside indicated data exfiltration commands, including connections to external domains or unexpected file write operations.

  - **Check for benign usage patterns:** Normal application installations may leverage AppleScript as part of their process. Review installation logs (Installer Logs) to correlate expected scripting activity as part of legitimate software installations.

  - **Validate temporary files:** Investigate if any temporary files created during the AppleScript execution have unusual names or file extensions. Malicious scripts often generate obfuscated or non-standard file names for their payloads.

  ### Prioritization

  The alert has medium severity. While AppleScript usage on macOS is common, its potential for misuse in executing malicious commands makes investigation necessary. The risk escalates if the affected system is critical or sensitive, as script execution can be leveraged for deeper access and control, making it a vector for attack.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate applications that heavily utilize AppleScript, leading to false positives. It requires that proper logging configurations for process creation are enabled on all endpoints for accurate detection. Common activities such as application installations may trigger this alert. A related detection worth considering is monitoring for the execution of general scripting interpreters (e.g., Python, Bash) which can indicate broader malicious scripting activity.

