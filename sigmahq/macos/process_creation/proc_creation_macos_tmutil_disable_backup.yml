  ---

  ### Technical Context

  This rule detects the disabling of Time Machine, Apple’s backup utility, on macOS systems by monitoring the use of the native command-line tool 'tmutil' with the 'disable' argument. The likely attacker objective is to stop system backups, potentially to prevent recovery of malicious changes or data exfiltration. This behavior falls under the MITRE ATT&CK tactic "Impact" (T1490).

  The primary telemetry sources for this alert are macOS process creation events that capture command execution data, particularly focusing on the 'tmutil' file path and command-line arguments. If malicious, this action can severely impact the organization by preventing disaster recovery capabilities. It is important to note that this detection does not confirm malicious intent on its own, as legitimate administrators may execute this command during maintenance or troubleshooting.

  ---

  ### Investigation Steps

  - **Check Process Creation Events:** Review process creation logs (macOS Event ID not specified) for instances of 'tmutil' being executed with 'disable'. This will typically include fields such as `Image`, `CommandLine`, and `User`.

  - **Identify User Context:** Determine the user account associated with the 'tmutil' command. If this was initiated by a known administrator during documented maintenance, it may be benign. Look for `User` and `Terminal` fields in the logs.

  - **Examine Command Line Arguments:** Verify that the executed command includes the 'disable' argument. This is a strong indicator of potentially malicious activity, especially if it was executed outside normal administrative hours or by a non-administrative user.

  - **Analyze Historical Backup Usage:** Investigate the current status of Time Machine backups (System Preferences > Time Machine) for the affected system. If the backup was recently disabled without clear administrative justification, it may warrant further scrutiny.

  - **Review Recent Security Events:** Look for other relevant security events in conjunction with the Time Machine disable action, such as file modifications or deletions. Cross-reference with Event IDs for unauthorized file access and potential data loss.

  - **Validate Expected Behavior:** Recognize that legitimate administrators may use 'tmutil disable' as part of maintenance tasks. Expected behavior might include enabling or disabling Time Machine backups during system upgrades, observed during business hours, and in tracked communication with IT support.

  ---

  ### Prioritization

  This alert is of medium severity; disabling backup capabilities on critical systems can lead to significant security risks and data loss. This behavior is not commonly weaponized but can be leveraged in specific attack scenarios to obscure other malicious activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging for process creation events is misconfigured or disabled. There is a possibility that legitimate administrative actions typically occur, such as scheduled maintenance, prompting the same command. A companion detection that strengthens coverage is monitoring for unusual file modifications post Time Machine disable events, which could indicate data tampering or exfiltration immediately following the disabling action.

