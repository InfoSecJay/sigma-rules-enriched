note: |
  ### Technical Context

  This Sigma rule detects the invocation of the `tmutil` command with the `disable` argument, which is used to turn off Time Machine, Apple's built-in backup solution for macOS. The likely attacker objective is to disable automated backups to prevent backup recovery options after an intrusion, thus increasing their operational effectiveness. This behavior aligns with the MITRE ATT&CK tactic: **Impact** (TA0145) and technique: **T1490 - Inhibit System Recovery**.

  The primary telemetry source is the macOS process creation logs, specifically monitoring processes initiated via the command line. If malicious, disabling Time Machine could lead to a severe security impact by leaving the system more vulnerable to data loss or ransomware attacks, as backups are a critical recovery mechanism. Importantly, this detection does not verify whether the disabling of Time Machine is malicious on its own, as legitimate administrators may execute the same command for valid reasons.

  ### Investigation Steps

  - **Review command execution logs:** Check process creation logs for Event IDs related to command execution on macOS. Look specifically for `tmutil` with CommandLine containing `disable`. Validate the source and context of the execution.

  - **Validate user context:** Investigate the user account executing the command. Legitimate Time Machine configuration changes should involve administrative users or automated scripts. Non-standard user accounts executing this command could indicate malicious intent.

  - **Correlate with other telemetry:** Cross-reference with system log events (e.g., system.log) captured around the same time to identify any related activities such as suspicious logins or unauthorized access attempts.

  - **Monitor for backups:** Check the status of Time Machine backups through the Time Machine settings or logs. If backups were recently running and now show as disabled, this could indicate potential malicious activity aiming to inhibit recovery options.

  - **Identify persistence mechanisms:** Analyze for any signs of subsequent malicious behavior, such as file encryptions or changes in automatic backup configurations, which could indicate an ongoing attack or ransomware activity.

  - **Document expected behavior:** If users or scripts are known to disable backups frequently (e.g., for maintenance), document this as part of expected behavior to differentiate between benign and malicious activities.

  ### Prioritization

  This alert has a medium severity due to the potential impact on data integrity and recovery processes. The affected system's role as a backup mechanism makes it a target for attackers, and disabling backups is commonly associated with various attack vectors. The likelihood of malicious abuse increases if there are no legitimate operational needs for such actions in the detected timeframe.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as using alternative methods to disable backups or executing scripts that obfuscate command intent. Ensure macOS logging is properly configured to capture all `tmutil` command execution instances for reliable detection. Legitimate administrative actions may trigger this alert, especially during maintenance tasks. A related detection that strengthens coverage would be monitoring for any changes in backup configurations or abnormal deletion of backup files, which can indicate malicious intent.

