title: Guest Account Enabled Via Sysadminctl
id: d7329412-13bd-44ba-a072-3387f804a106
status: test
description: Detects attempts to enable the guest account using the sysadminctl 
  utility
references:
- https://ss64.com/osx/sysadminctl.html
author: Sohan G (D4rkCiph3r)
date: 2023-02-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.t1078
- attack.t1078.001
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/sysadminctl'
    CommandLine|contains|all:
            # By default the guest account is not active
    - ' -guestAccount'
    - ' on'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the enabling of the guest account on macOS systems using the `sysadminctl` utility. Attackers may aim to enable the guest account to facilitate persistence or unauthorized access without creating a traditional user account. This behavior aligns with the MITRE ATT&CK framework under the tactic "Initial Access" (TA0001) and technique "Valid Accounts" (T1078), specifically the subtype "Local Accounts" (T1078.001). The primary source of telemetry for this detection is process creation logs, particularly those capturing the execution of the `sysadminctl` command. The security impact can be significant, as enabling the guest account could allow an attacker to bypass standard authentication controls. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could also trigger the rule.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 or Sysmon Event ID 1 for instances of `sysadminctl` being executed. Focus on the command line parameters containing `-guestAccount` and `on`.

  - **Verify user account configuration:** Examine macOS's Users & Groups settings to confirm whether the guest account is enabled. If it is enabled legitimately, this could indicate benign configurations.

  - **Correlate with administrative actions:** Look for related administrative activities in the logs before and after the alert (such as Event ID 4688 for other user account changes). Benign examples include standard device management operations or changes made by authorized personnel.

  - **Identify high-confidence malicious behavior:** Cross-reference the command execution with known malicious IP addresses or user agents. A high-confidence indicator is if the command was executed in conjunction with other suspicious commands such as those related to unauthorized access.

  - **Assess asset criticality:** Determine the role of the affected macOS system. If it’s a critical system, the alert should be prioritized for further investigation.

  ### Prioritization

  The alert has low severity due to the possibility of benign administrative usage. However, if detected on a critical system or in conjunction with other malicious indicators, it may warrant escalation. The behavior could be weaponized in certain contexts, but it is not a commonly abused technique.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate system administrators might enable the guest account for valid reasons, such as debugging or guest access. Ensure logging for process creation is enabled and operational for thorough detection. Additionally, be aware that attackers may utilize legitimate administrative tools, making it difficult to distinguish between malicious and benign use. A related detection to strengthen coverage is monitoring for suspicious modifications to user account settings or querying other local account configurations.

