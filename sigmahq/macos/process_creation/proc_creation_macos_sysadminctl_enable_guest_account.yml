title: Guest Account Enabled Via Sysadminctl
id: d7329412-13bd-44ba-a072-3387f804a106
status: test
description: Detects attempts to enable the guest account using the sysadminctl utility
references:
- https://ss64.com/osx/sysadminctl.html
author: Sohan G (D4rkCiph3r)
date: 2023-02-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.initial-access
- attack.t1078
- attack.t1078.001
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/sysadminctl'
    CommandLine|contains|all:
            # By default the guest account is not active
    - ' -guestAccount'
    - ' on'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies attempts to enable the guest account on macOS systems using the **sysadminctl** utility, a command-line tool for managing user accounts. In a typical threat scenario, an attacker may attempt to enable the guest account to gain unauthorized access to the system while evading more stringent authentication measures. This tactic can facilitate unauthorized access (as indicated by its connection to MITRE ATT&CK techniques) and may allow further lateral movement within the network.

  Relevant MITRE ATT&CK tactics include **Persistence** (T1547) as this action establishes a backdoor by enabling account access, and **Initial Access** (T1078) due to the capability it gives an attacker to gain control over the host without proper credentials. The specific technique is **Valid Accounts** (T1078.001), as it is leveraging a built-in account rather than standard administrative credentials.

  The primary data sources that will contain important evidence include **process creation events**, specifically those logged on macOS devices. These events will document the execution of the sysadminctl utility along with detailed command-line arguments used, which are vital for analysis.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events on affected macOS systems to find instances of the sysadminctl command, particularly focusing on command lines containing `-guestAccount` and `on`.

  - **Cross-Reference User Activity:** Investigate the user account that executed the command. Verify if it is a legitimate system administrator or a potential impersonation by unauthorized insider threats.

  - **Analyze System Configuration:** Check the current state of the guest account through system preferences or relevant terminal commands to ascertain whether it was enabled and if this aligns with organizational policies.

  - **Monitor for Subsequent Activity:** Keep an eye on further unauthorized access attempts or privilege escalation behaviors post-enablement of the guest account, as attackers may exploit this newly established access to perform additional reconnaissance or lateral movement.

  ### Prioritization
  Alerts triggered by this detection rule should be assigned a low severity due to the relatively limited impact of the guest account alone, however, it presents an exploit vector for further attacks. The likelihood of attacks capitalizing on this vulnerability increases in environments where configurations allow guest access, thus warranting investigation into any such events.

  ### Blind Spots and Assumptions
  One of the gaps in detection coverage is that this rule solely focuses on the use of the sysadminctl utility; therefore, malicious attempts to enable the guest account through other means may go undetected. The logic assumes that any sysadminctl command including the specified arguments is inherently suspicious, which may not consider legitimate administrative tasks conducted by authorized personnel. Required logs include comprehensive process creation logs on macOS, necessitating configured settings to ensure the recording of all command-line activities for timely detection.

