logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/sysadminctl'
    CommandLine|contains|all:
            # By default the guest account is not active
    - ' -guestAccount'
    - ' on'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects the enabling of the Guest account on macOS systems via the `sysadminctl` utility, a process often linked to privilege escalation or initial access tactics. The likely attacker objective is to establish a weak entry point into the system, potentially compromising it with malicious intent. This activity aligns with the MITRE ATT&CK tactics and techniques of **Persistence (T1547)** and **Valid Accounts (T1078)**.

  The primary telemetry sources involve process creation logs from macOS, specifically focusing on the command line activity that includes the parameters for enabling the Guest account. If malicious, this can lead to unauthorized access or account misuse. Importantly, this detection does NOT confirm whether the action was executed successfully or if it was part of a legitimate system administration activity.

  ### Investigation Steps

  - **Identify command execution:** Review the process creation logs (Sysmon Event ID 1) for entries where the `Image` ends with `/sysadminctl` and includes `-guestAccount on`. Look for the user context under which this command was executed to determine if it originated from an administrator account or an unusual user.

  - **Check for administrative abuse:** Validate if the account executing this command has legitimate administrative privileges. Conflict with expected behavior if a non-admin user attempts to enable the Guest account.

  - **Monitor user account status:** Query the current status of the Guest account using `dscl . -read /Users/Guest` to confirm whether it is currently enabled or disabled. This can help establish if the alert corresponds with an ongoing malicious action or misconfiguration.

  - **Review recent changes:** Examine the macOS system logs (Console.app) for any changes to user account states around the time of the alert. Look specifically for events logged around the time `sysadminctl` was executed that might indicate a larger trend of unusual account management practices.

  - **Identify lateral movement attempts:** Analyze subsequent network activity from the target system, especially any connections that leverage the Guest account, as this can indicate attempts to use this account for lateral movement or exfiltration of data.

  ### Prioritization

  The alert has a low severity level due to the potential for legitimate administrative action; however, it still represents a significant risk given that the Guest account can be exploited by an adversary. The likelihood of this behavior being malicious increases in sensitive environments where strict account controls are expected.

  ### Blind Spots and Assumptions

  Detection may be limited if the `sysadminctl` command is executed with obfuscation or in conjunction with other utilities that do not generate clear logs. This rule relies on adequate logging configurations being in place across macOS devices. Legitimate administrative actions, such as a system admin enabling the Guest account for testing purposes, may trigger this alert. A related detection, such as monitoring for unusual user account modifications (e.g., creation, deletion, or privilege changes), can provide comprehensive coverage against account abuse scenarios.

