title: JAMF MDM Execution
id: be2e3a5c-9cc7-4d02-842a-68e9cb26ec49
status: test
description: |
  Detects execution of the "jamf" binary to create user accounts and run commands. For example, the binary can be abused by attackers on the system in order to bypass security controls or remove application control polices.
references:
- https://github.com/MythicAgents/typhon/
- https://www.zoocoup.org/casper/jamf_cheatsheet.pdf
- https://docs.jamf.com/10.30.0/jamf-pro/administrator-guide/Components_Installed_on_Managed_Computers.html
author: Jay Pandit
date: 2023-08-22
tags:
- attack.execution
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/jamf'
    CommandLine|contains:
            # Note: add or remove commands according to your policy
    - 'createAccount'
    - 'manage'
    - 'removeFramework'
    - 'removeMdmProfile'
    - 'resetPassword'
    - 'setComputerName'
  condition: selection
falsepositives:
- Legitimate use of the JAMF CLI tool by IT support and administrators
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the "jamf" binary on macOS, specifically targeting commands that create user accounts, manage settings, or alter device management profiles. An attacker may use these capabilities to bypass security controls or manipulate system configurations post-compromise, aiming to gain persistence or elevate privileges.

  The relevant MITRE ATT&CK tactic is **Execution (TA0002)** and the technique is **Command and Scripting Interpreter (T1059)**. The primary telemetry sources include process creation logs, specifically macOS logs capturing events related to the execution of binaries (e.g., syslog entries for system commands). If the detection indicates malicious behavior, it could compromise system integrity, allowing unauthorized access or control. This detection alone does not confirm malicious intent, as it can also align with legitimate administrative actions by IT personnel.

  ### Investigation Steps

  - **Check process creation logs:** Review macOS logs for **Event ID 100 (Process started)** for the "jamf" binary. Analyze the associated `CommandLine` arguments to verify if they match the suspicious commands listed.

  - **Identify benign usage patterns:** Look for command executions that align with standard administrative tasks, such as `jamf manage` invoked during scheduled maintenance windows by known admin users. Validate the user context executing the command.

  - **Investigate user account actions:** If `createAccount` is detected, cross-reference with existing user account records to ensure the action aligns with expected account provisioning policies. Verify the usernames, timestamps, and parental attributes of these accounts.

  - **Review historical execution context:** Analyze past executions of the "jamf" binary over the last 30 days. Determine if there's a pattern indicating misconfiguration or abuse, particularly in sensitive areas like system administration or security management.

  - **Assess the impact on critical assets:** Identify the host role of the affected system (e.g., whether it's a server, admin workstation, or user device) and the potential impact. Systems with critical roles should be prioritized for deeper investigation.

  ### Prioritization

  This alert is of low severity due to its potential for legitimate usage by IT departments; however, it requires attention since misuse could lead to significant security breaches. While abuse of the "jamf" utility is less common than other attack vectors, any unauthorized command execution warrants thorough examination due to the potential system-level implications.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not correctly configured or if 'jamf' commands are executed silently without clear logging patterns. Legitimate activities, such as IT administrative operations during software updates, could inadvertently trigger the alert. A related detection to consider is tracking unusual command line arguments or interactions with other system binaries that modify user accounts or security settings, enhancing overall coverage.

