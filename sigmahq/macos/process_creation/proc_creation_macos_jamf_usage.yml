title: JAMF MDM Execution
id: be2e3a5c-9cc7-4d02-842a-68e9cb26ec49
status: test
description: |
  Detects execution of the "jamf" binary to create user accounts and run commands. For example, the binary can be abused by attackers on the system in order to bypass security controls or remove application control polices.
references:
- https://github.com/MythicAgents/typhon/
- https://www.zoocoup.org/casper/jamf_cheatsheet.pdf
- https://docs.jamf.com/10.30.0/jamf-pro/administrator-guide/Components_Installed_on_Managed_Computers.html
author: Jay Pandit
date: 2023-08-22
tags:
- attack.execution
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/jamf'
    CommandLine|contains:
            # Note: add or remove commands according to your policy
    - 'createAccount'
    - 'manage'
    - 'removeFramework'
    - 'removeMdmProfile'
    - 'resetPassword'
    - 'setComputerName'
  condition: selection
falsepositives:
- Legitimate use of the JAMF CLI tool by IT support and administrators
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of the "jamf" binary, a command-line tool used in macOS environments for managing devices via the JAMF Mobile Device Management (MDM) solution. Attackers may exploit this legitimate tool to create user accounts, execute commands, and manipulate system settings, potentially bypassing security controls and disrupting service. Such actions could be part of a broader compromise seeking to maintain persistence, elevate privileges, or establish command and control on the targeted system.

  The relevant MITRE ATT&CK tactics and techniques that apply include:
  - **TA0002: Execution** - This tactic covers the execution of malware or unauthorized scripts within the environment.
  - **T1086: PowerShell** - While not directly related, the concept of abusing administrative tools aligns with this technique, as the jamf binary can create similar risk scenarios when used maliciously.

  Primary data sources for evidentiary support include process creation logs, which document when and how the jamf binary is executed, as these logs will show the command line arguments used and the context of execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for entries related to the "jamf" binary execution, particularly focusing on command line parameters such as `createAccount`, `manage`, or `removeMdmProfile`.
  - **Correlate with User Accounts**: Check for any unusual or unauthorized user accounts that have been created following the execution of the jamf commands, and investigate their activity.
  - **Evaluate Privilege Changes**: Look into any changes to system settings or configurations made via the jamf binary that could indicate malicious intent, such as resetting administrator passwords or removing MDM profiles.
  - **Investigate Contextual Factors**: Determine the user identity and context of the command execution; validate whether it was initiated by an authorized administrator or if the activity was anomalous.

  ### Prioritization
  This alert is designated as low severity, primarily because while the misuse of the jamf binary can indicate a significant security threat, typical administrative tasks by IT staff may trigger similar logs, necessitating careful contextual analysis.

  ### Blind Spots and Assumptions
  This detection approach may have gaps if the logging of process creation events is not enabled or if logs are not retained for a sufficient duration for analysis. The detection logic assumes that the execution of specific jamf commands is unauthorized; however, this may not always be the case as legitimate IT usage can overlap significantly. Proper logging configurations and monitoring of administrative activities on macOS devices are essential for this alert to function effectively.

