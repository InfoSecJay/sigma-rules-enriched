level: medium
note: |
  ### Technical Context
  This rule detects the execution of the command "osacompile" that may be initiated by potentially suspicious applications, specifically those categorized as applets or utilizing the osascript framework. The execution of osacompile – a command-line tool for compiling AppleScript source code into script apps – may denote an attempt by attackers to manipulate or automate tasks on macOS systems, potentially leading to abuse of legitimate functionality for malicious purposes.

  The primary threat scenario revolves around attackers using malcrafted scripts to execute code, privilege escalation, or lateral movement within macOS environments. The MITRE ATT&CK techniques relevant to this detection include **Execution (T1059.002)**, where the use of scripts can facilitate numerous malicious activities, as attackers often leverage scripting capabilities to automate certain operations on infected systems.

  Key data sources for this detection include **process creation events**, which can provide insights into command execution patterns and parent-child relationships of processes, thereby allowing investigators to quantify the legitimacy of the invoking application.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events to identify instances of "osacompile" execution. Pay close attention to the ParentImage to see if it originated from a known applet or osascript process.

  - **Analyze Command-Line Arguments:** Check the full command-line arguments associated with osacompile executions. Look for unusual or suspicious parameters that may indicate malicious intent.

  - **Correlate with User Activity:** Investigate the user account that initiated the execution. Determine if the account has a history of running scripts or is atypical for executing AppleScript commands.

  - **Examine Application Bundles:** If relevant, verify the integrity of the application bundle from which the process was executed. Look for signs of tampering or abnormal behavior that could further suggest malicious activity.

  ### Prioritization
  This alert is classified with medium severity because while the execution of osacompile itself is not inherently malicious, it may indicate clandestine attempts to utilize legitimate tools for harmful objectives, warranting further investigation.

  ### Blind Spots and Assumptions
  The detection logic may not cover all execution scenarios, particularly if the osacompile command is invoked from unusual or benign sources not captured in the current ruleset. Assumptions made include that the parent applications are known entities; however, deviating behavior from trusted applications could lead to missed detections. Comprehensive logging of process creation events is essential, as well as proper configurations to ensure that complete command-line parameters are logged for effective analysis.

