note: |
  ### Technical Context

  This Sigma rule detects the execution of the `chflags` utility with the "hidden" flag on macOS systems, indicating an attempt to make files or directories invisible to standard file browsing tools. The behavior may align with an attacker’s objective to conceal malicious files or processes, thereby evading detection. The relevant MITRE ATT&CK techniques are **T1564.004: Hidden Files and Directories** and **T1105: Ingress Tool Transfer**.

  The primary telemetry source is process creation logs from macOS, specifically monitoring command-line execution of `chflags`. If a malicious actor is effectively hiding files, it may impede incident response efforts by preventing visibility into those files. Notably, this detection does not confirm malicious intention by itself, as legitimate system administrators may also use the `chflags` command for appropriate use cases.

  ### Investigation Steps

  - **Check for unexpected execution of `chflags`:** Review process creation logs (macOS Event ID 100) to identify instances where `chflags` was run. Look for CommandLine entries that include `hidden` along with the user context to determine if this was initiated by a non-administrative user.

  - **Identify patterns of command usage:** Cross-reference executed commands starting with `chflags` to see the frequency and context of flagged activity. Legitimate usage typically includes specific administrative actions, such as hiding non-critical system files (e.g., `chflags hidden /path/to/file`).

  - **Analyze surrounding context logs:** Check for other command-line activities occurring before or after the `chflags` execution (macOS Event ID 100). Look for patterns of file creation or undesired modification that may indicate a sequence leading to concealment.

  - **Review file attributes post-execution:** Query the affected file metadata using the `ls -lO` command to verify if the "hidden" flag was set. Assess whether any files previously marked as non-hidden now have this designation, indicating possible file manipulation.

  - **Correlate with network activity:** Investigate any outbound network connections made by the machine around the same time as the `chflags` execution. Use logs from firewall and proxy servers to determine if there’s suspicious command-and-control (C2) activity (e.g., unusual connections to known bad IPs).

  ### Prioritization

  The alert has medium severity due to the potential impact on system integrity and data exposure. Hiding files is a tactic often weaponized by malicious actors to avoid detection alongside persistent threats, such as malware. The context of the affected systems, especially those containing sensitive information, necessitates prompt investigation to rule out compromise.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate users who frequently manipulate file flags, resulting in false positives. Additionally, if the operating system logging configurations do not capture all necessary execution logs, detection may fail. Legitimate use of `chflags` for administrative tasks can trigger this alert, complicating investigations. Related detections, such as monitoring for file modifications using `touch` (T1105), can enhance overall visibility and context in tracking suspicious activities.

