note: |
  ### Technical Context

  This rule detects the execution of the `chflags` command with the `hidden` flag on macOS systems. This behavior is often used by attackers to conceal malicious files or artifacts from users and security tools, thereby making detection and analysis more difficult. The objective of the attacker typically involves maintaining persistence or avoiding detection during a compromise.

  This detection relates to the MITRE ATT&CK techniques of Defense Evasion (T1564.004) and Credential Access (T1552.001). The primary telemetry source is macOS process creation logs, specifically monitoring the invocation of commands and their parameters. If malicious, the use of the hidden flag could allow an adversary to operate undetected within the system. However, this detection does NOT confirm malicious intent without correlating it to other suspicious activities or indicators.

  ### Investigation Steps

  - **Review recent process executions:** Check macOS process creation logs (Event ID for process creation) within the past 24 hours for instances of `chflags` with the `hidden` flag. Look for unusual timestamps or parent processes that hint at malicious activity.

  - **Validate legitimate usage:** Compare `chflags` execution patterns against typical administrative activities. For benign use, check for `chflags` commands run by known admin users, particularly in conjunction with system maintenance tasks. These will usually not include sudden changes to widely viewed files or directories.

  - **Identify suspicious command lines:** Analyze command-line arguments associated with the `chflags` execution. Indicators of compromise would include unusual combinations of file paths, particularly in user directories or non-standard system paths, indicating obscured malicious files.

  - **Correlate with system integrity checks:** Review file visibility and attributes following any `chflags` execution. Confirm hidden flags on critical files or directories that have not been authorized for hiding, indicating potential malicious intent.

  - **Check for associated lateral movement:** Investigate other alerts or logs indicating system access from unusual locations or methods immediately following the `chflags` execution. This could signify lateral movement or application of the hidden flag as part of a larger attack workflow.

  ### Prioritization

  This alert holds medium severity as it indicates a potential attempt at evasion or stealth by an adversary. The impact may vary based on the criticality of the affected system and its role in processing sensitive data. Given that the hiding of files is a commonly weaponized technique, prioritizing this alert can prevent further exploits in the environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of the `chflags` command by administrators. If logging is not configured to capture all process creation events comprehensively, some executions may go unnoticed. Legitimate scenarios, like system maintenance or user-level modifications, could also trigger this alert. Considering companion detections, monitoring for the creation of unusual hidden files (e.g., executable, script files) alongside this rule strengthens overall coverage against related malicious activities.

