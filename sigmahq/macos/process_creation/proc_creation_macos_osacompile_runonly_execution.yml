note: |
  ### Technical Context

  This rule detects potential suspicious executions of compiled AppleScripts using the `osacompile` utility with the flags `-x` (run-only) and `-e` (execute). The likely attacker objective is to execute malicious scripts that are obfuscated, making them harder to analyze and detect, while leveraging the native macOS scripting capabilities. This behavior aligns with the MITRE ATT&CK technique T1059.002 (Command and Scripting Interpreter: AppleScript). The primary telemetry source is macOS process creation logs, specifically focusing on command-line executions. If malicious, this could lead to unauthorized actions on the targeted system, including data exfiltration or lateral movement. Importantly, this detection does NOT confirm that the command was executed with malicious intent on its own; further investigation is required.

  ### Investigation Steps

  - **Review command-line parameters**: Check for occurrences of `osacompile -x -e` in process creation logs (macOS Unified Logs). Assess execution context, confirming whether the command originated from a legitimate user or process.

  - **Identify parent processes**: Analyze the parent process IDs linked to the alerting command via macOS logs. Malicious scripts often leverage benign applications (e.g., Terminal, Finder) as a launching point; discover if execution is unusual for the parent.

  - **Correlate with known threats**: Query threat intelligence feeds and community resources for malicious use cases leveraging `osacompile`. Validate whether similar command-line signatures have been observed in known attack campaigns.

  - **Establish baseline behavior**: Review routine administrative and legitimate automation jobs that utilize `osacompile`. Document common command-line structures and usage patterns within your environment to differentiate benign from suspicious activity.

  - **Investigate user behavior**: Check the user account activity leading to the alert, including recent logins and command history. Determine if the user is from a highly privileged group and if unusual or unauthorized activities precede the alert.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on sensitive macOS environments and the inherent risk of script-based execution being weaponized. The likelihood of malicious abuse is significant, especially in environments where AppleScript is commonly used for automation. The method of execution is not only possible but frequently employed in exploitation strategies.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative scripts that also utilize `osacompile`, leading to false positives. Ensure that macOS process creation logs are correctly configured to capture all necessary events, particularly command-line arguments. Additionally, remote execution tools or configuration management applications might trigger this alert during routine updates. Companion detections could involve monitoring for unusual network behavior or file system changes that follow the execution of `osacompile` commands, enhancing the detection coverage for potential abuse.

