  ### Technical Context

  This rule detects the execution of potentially suspicious run-only AppleScript commands compiled with the OSACompile utility. The identified behavior may indicate an adversary attempting to execute malicious scripts in a clandestine manner, possibly aiming to automate tasks that exfiltrate data or manipulate system settings without detection. The relevant MITRE ATT&CK tactic is Execution (T1059.002).

  Primary telemetry sources for this detection include macOS process creation logs with a focus on command line arguments that use 'osacompile' with specific flags: '-x' (to compile scripts) and '-e' (to execute). If malicious, this activity could lead to unauthorized control over systems or data compromise. Importantly, this detection does not confirm malicious intent without additional contextual information from other security telemetry.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review macOS process creation logs (Event ID 4688) for OSACompile executions. Look specifically for processes created by non-privileged users that include the command line arguments ‘osacompile -x -e’.

  - **Identify script origin:** Validate where the AppleScript content is being executed from, focusing on the path provided in the command line. Legitimate executions often originate from trusted directories (e.g., user home directories).

  - **Review user account activity:** Examine user account activity in relation to the execution of these scripts, particularly actions leading up to the use of OSACompile. Look for unusual user behavior that deviates from established usage patterns.

  - **Compare with known scripts:** Cross-reference the executed AppleScript with known legitimate AppleScripts used within the organization. Unexpected scripts or those that implement suspicious commands should raise red flags.

  - **Assess for lateral movement or data exfiltration:** Use network monitoring tools to inspect outbound connections initiated shortly after the execution of OSACompile. Be alert for unusual data transfer patterns that may indicate an attempt to exfiltrate sensitive information.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive macOS systems, particularly if employed by a privileged user to execute harmful commands. The likelihood of malicious abuse is moderate to high, as execution via OSACompile is an established technique among adversaries to automate malicious workflows. Such behavior is increasingly weaponized for targeted intrusions.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for evasion techniques, such as simply renaming scripts or executing them without OSACompile. Ensure that all macOS process creation logs are properly captured and stored for reliable detection. Legitimate automation tools or internal scripts may trigger this alert without malice. A companion detection to consider is monitoring for unusual outbound network connections from macOS systems following command executions to enhance context around potential data exfiltration.

