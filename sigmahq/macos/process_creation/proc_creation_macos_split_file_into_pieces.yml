  ---

  ### Technical Context

  This Sigma rule detects the use of the "split" command on macOS systems, which is commonly used to divide a large file into smaller parts. An attacker may use this technique to prepare sensitive data for exfiltration, making it easier to transfer over the network or store covertly. This behavior aligns with the MITRE ATT&CK technique for Exfiltration Over Alternative Protocol (T1030).

  The primary telemetry sources are macOS process creation logs, specifically capturing command invocations. If malicious, the use of the "split" command could indicate preparation for data exfiltration or misappropriation of sensitive files. However, this detection alone does not confirm the malicious intent or the completion of an exfiltration event, as legitimate administrative tasks may also utilize this command.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check macOS logs for Event IDs associated with process creation, specifically filtering for entries that reference the "split" command (e.g., syslog or Console.app logs). Look for user accounts that invoke this command that do not align with administrative tasks.

  - **Identify high-confidence malicious indicators:** Investigate any instances where "split" is used in conjunction with unusual file paths or sensitive file types (e.g., financial, medical records). Pay attention to command options that specify unusual segment sizes.

  - **Assess user context and permissions:** Validate the user accounts executing the "split" command against expected roles. Use macOS logs to identify if the command was run by privileged users or during expected operational hours versus anomalous times.

  - **Evaluate for legitimate behaviors:** Note any common scenarios where the "split" command might be used legitimately, such as large data file handling by data engineers or administrative users managing backups. Identify patterns in related commands to separate benign usage from suspicious activity.

  - **Correlate with network activity:** Review network logs for outbound connections or file transfers post-invocation of the "split" command. Use network monitoring tools to check for data movement that coincides with the timing of the "split" execution.

  ---

  ### Prioritization

  This alert should be treated with low severity in an enterprise context, as the "split" command can often be used legitimately for administrative activities. However, the potential risk for adversaries using it to facilitate exfiltration means it should not be dismissed outright. Activities that involve splitting sensitive or large files should be monitored, especially when conducted outside typical operational behavior.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate administrative tasks can trigger the alert, leading to potential false positives. Additionally, if system logging is not correctly configured on macOS, some events may not be captured. Furthermore, variations of the command or its usage in scripts may evade detection. Complementary detections, such as monitoring for unusual outbound connections or file transfers, would strengthen coverage against exfiltration attempts.

