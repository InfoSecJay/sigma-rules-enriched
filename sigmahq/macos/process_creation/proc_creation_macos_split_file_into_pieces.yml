  ### Technical Context
  This detection rule identifies the usage of the "split" command on macOS systems, which is commonly employed to divide large files into smaller parts. This activity can signal potential data exfiltration efforts, as attackers may split sensitive files to obscure their transfer or comply with file size limitations in certain channels or protocols. An attacker, aiming to remove sensitive information or large datasets, might utilize this command in conjunction with other tools to execute an extraction strategy without raising immediate alarm.

  The relevant MITRE ATT&CK tactics and techniques this detection pertains to are *Exfiltration* (TA0010) and *Exfiltration Over Command and Control Channel* (T1030). Successful detection of this behavior could provide key insights into potential data breach attempts being executed within the environment.

  Primary data sources to monitor for this rule include process creation events on macOS systems, which will provide visibility into command executions and their parameters. Monitoring these logs can help identify both suspicious usage patterns and know legitimate administrative activities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for instances of the "split" command being executed. Investigate the parent processes to determine if the command was executed in a legitimate context or indicative of suspicious behavior.

  - **Analyze Context of Execution:** Contextualize the command's usage by looking for accompanying network activity (e.g., outgoing network connections) that may indicate potential exfiltration activity following the file-splitting command.

  - **Correlate with User Activity:** Assess the user account associated with the command execution. Verify if the user has a legitimate reason or authorization to execute the "split" command and if any prior anomalous activity has been detected.

  - **Inspect File Transfer Logs:** If available, review logs related to file transfers to see if there are any outbound connections that align with the execution of the "split" command, particularly to external or unexpected destinations.

  ### Prioritization
  This alert is considered low severity due to the potential for legitimate administrative actions that involve splitting files. However, it should not be overlooked as it may also signify underlying data exfiltration tactics if observed along with suspicious behavior or abnormal network activity.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging for process creation on macOS systems is not enabled or adequately configured, which can result in missed detections. This logic assumes that the presence of the "split" command indicates malicious intent; however, it does not differentiate between legitimate administrative tasks and potential threats. Therefore, having comprehensive process audit logs and ensuring logging is properly configured are essential for this alert to function effectively.

