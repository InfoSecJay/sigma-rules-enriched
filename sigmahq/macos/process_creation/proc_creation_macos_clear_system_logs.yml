note: |
  ---

  ### Technical Context

  This Sigma rule detects the removal of system log files on macOS, specifically targeting commands that delete audit logs. The likely attacker objective is to erase traces of malicious activity to maintain persistence and avoid detection. This behavior fits within the MITRE ATT&CK framework under the tactic of **Defense Evasion** and the technique **T1070.002: File Deletion**. The primary telemetry sources include macOS process creation logs that capture command-line activity. The security impact of log deletion is significant, as it can hinder forensic investigations and incident response. Importantly, this detection does NOT confirm malicious intent without additional context, as legitimate administrative actions may also trigger this alert.

  ---

  ### Investigation Steps

  - **Check command line for malicious patterns:** Inspect the CommandLine field for evidence of using `rm`, `unlink`, or `shred` targeting `/var/log`, `/Users/`, or `/Library/Logs/`. Malicious activity may include recursive deletions (e.g., `rm -rf`).

  - **Review process creation logs:** Analyze Security Event ID 4688 for processes generated during the time of the alert. Cross-reference the parent process to identify suspicious backtracking (e.g., shell scripts invoking file deletions).

  - **Identify legitimate administrative actions:** Correlate any detected deletions with normal maintenance windows or update tasks, especially involving system logs, which may usually be performed by an IT administrator using tools like `logrotate`.

  - **Verify critical system logs exist:** Ensure critical logs (e.g., system.log, installed application logs) are present and were not modified or deleted recently. Compare against expected log retention policies.

  - **Assess user activity for context:** Review user activity and access patterns to determine whether the user account executing the deletion had legitimate reasons to purge logs or if it exhibits suspicious behavior in an unusual context.

  ---

  ### Prioritization

  The alert carries medium severity due to the potential impact on forensic investigations, particularly if triggered on critical systems. The likelihood of malicious abuse is moderate, as log deletion is a common step taken by attackers to cover tracks. This behavior is often weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include non-standard command execution or tampering with log retention settings. For reliable detection, ensure process creation logs are being correctly captured and that logging is enabled on macOS systems. Legitimate activities, such as system maintenance or log management by authorized personnel, may also generate this alert. A companion detection could involve monitoring for correlated anomalous user behavior to enhance investigative capabilities.

