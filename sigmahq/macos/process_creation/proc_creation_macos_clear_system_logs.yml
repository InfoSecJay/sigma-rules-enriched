title: Indicator Removal on Host - Clear Mac System Logs
id: acf61bd8-d814-4272-81f0-a7a269aa69aa
status: test
description: Detects deletion of local audit logs
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
author: remotephone, oscd.community
date: 2020-10-11
modified: 2022-09-16
tags:
- attack.defense-impairment
- attack.t1685.006
logsource:
  product: macos
  category: process_creation
detection:
  selection1:
    Image|endswith:
    - '/rm'
    - '/unlink'
    - '/shred'
  selection_cli_1:
    CommandLine|contains: '/var/log'
  selection_cli_2:
    CommandLine|contains|all:
    - '/Users/'
    - '/Library/Logs/'
  condition: selection1 and 1 of selection_cli*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of local audit logs on macOS systems, focusing on commands that are commonly used for file removal, such as `rm`, `unlink`, and `shred`. The primary objective of an attacker could be to cover their tracks by eliminating log entries that might reveal malicious actions, thus hindering incident response efforts. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (T1070.002), specifically targeting logs to obscure malicious activity.

  The main telemetry source is macOS process creation logs, capturing executions of deletion commands in conjunction with targeted directories where logs are stored (e.g., `/var/log`, `/Users/`, `/Library/Logs/`). If this behavior is malicious, it could significantly impede forensic investigations. Importantly, this detection does NOT confirm that malicious activity has occurred, as legitimate administrative activities may also trigger this rule.

  ### Investigation Steps

  - **Review command execution details:** Check Security Event logs for Event ID related to process creation, focusing on CommandLine fields for any occurrences of `/var/log`, `/Users/`, and `/Library/Logs/`.

  - **Assess the user context:** Identify the user associated with the command execution in macOS logs. If the command was executed by a known administrative user, this may be benign; however, unfamiliar accounts may warrant further investigation.

  - **Validate baseline logging practices:** Compare current logs against baseline configurations, ensuring logs are being archived and managed according to your organization’s policies. Any significant deviations might indicate a potential issue.

  - **Identify suspicious parameters:** Specifically look for high-confidence indicators like the use of `rm -rf` with unusual targets (e.g., logs outside expected directories) in the CommandLine field that could suggest nefarious intent.

  - **Correlate with other activities:** Investigate other processes executed by the same user during the same timeframe. Legitimate user behavior typically doesn’t include frequent deletion of logs, especially in a single session.

  - **Determine asset criticality:** Evaluate the significance of the affected host. Critical assets such as servers should be prioritized for deeper forensic analysis if they trigger this alert.

  ### Prioritization

  This alert is of medium severity based on the potential risk to system integrity and the likelihood that deleted logs could obstruct detection and response efforts during an active incident. While this behavior can indicate malicious activity, it is not uncommon for system administrators to perform log cleanup, though frequency and context should raise concerns.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative activities to trigger the alert, thereby generating false positives. Additionally, comprehensive logging configurations must be in place to reliably capture these events. Users may attempt to obscure their activity by using innocuous command variations or manipulating timestamps. A related detection to strengthen coverage could involve monitoring for unusual file creation or modification patterns in log directories prior to deletion events.

