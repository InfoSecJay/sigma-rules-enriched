note: |
  ### Technical Context
  This rule detects the deletion of local audit logs on macOS systems, specifically focusing on commands that clear system logs. The primary threat scenario involves an attacker seeking to remove traces of their activity post-compromise, which is a common behavior associated with stealthy persistence or lateral movement efforts. By deleting logs, the attacker aims to hinder forensic investigations and evade detection by security teams.

  Relevant tactics and techniques from the MITRE ATT&CK framework include:
  - **Defense Evasion (TA0005)**: The behavior falls under this tactic as the action is intended to evade detection mechanisms.
  - **Indicator Removal on Host (T1070.002)**: This specific technique identifies the activity of deleting system logs to obscure malicious operations.

  Primary data sources for effective detection include:
  - Process creation events from macOS systems, which record the execution of commands.
  - Audit log entries that may indicate log file modifications or deletions.

  ### Investigation Steps
  - **Review Process Creation Events**: Look for instances where processes like `/rm`, `/unlink`, or `/shred` are executed, particularly with command lines targeting system log directories such as `/var/log`, `/Users/`, or `/Library/Logs/`.
  - **Cross-check with User Activity**: Analyze user activity logs around the same timeframe to determine if any legitimate administrative actions took place that might explain the log deletions.
  - **Investigate Forensic Logs**: Gather and analyze any forensic logs available to see if there were attempts to access log files prior to their deletion, which could indicate malicious intent.
  - **Correlate with EDR Alerts**: If available, correlate findings with alerts from an Endpoint Detection and Response (EDR) solution to confirm whether any suspicious behavior was detected around the same time.

  ### Prioritization
  The alert is given medium severity due to its potential impact on an organization's security posture; unauthorized log deletions can severely hinder incident response and forensic investigations, making it a significant threat if indicative of malicious activity.

  ### Blind Spots and Assumptions
  One key gap in detection coverage is the potential for legitimate administrative actions to trigger alerts, such as routine maintenance or system updates that result in log deletions. The detection logic assumes that any deletion command targeting specific log directories is malicious without differentiating between benign and malicious activity. Additionally, for this alert to function effectively, adequate logging of process creation events must be ensured on all macOS endpoints, as well as access to the relevant command execution histories.

