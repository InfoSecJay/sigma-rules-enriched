title: Suspicious Installer Package Child Process
id: e0cfaecd-602d-41af-988d-f6ccebb2af26
status: test
description: Detects the execution of suspicious child processes from macOS 
  installer package parent process. This includes osascript, JXA, curl and wget 
  amongst other interpreters
references:
- https://redcanary.com/blog/clipping-silver-sparrows-wings/
- https://github.com/elastic/detection-rules/blob/4312d8c9583be524578a14fe6295c3370b9a9307/rules/macos/execution_installer_package_spawned_network_event.toml
author: Sohan G (D4rkCiph3r)
date: 2023-02-18
tags:
- attack.t1059
- attack.t1059.007
- attack.t1071
- attack.t1071.001
- attack.execution
- attack.command-and-control
logsource:
  category: process_creation
  product: macos
detection:
  selection_installer:
    ParentImage|endswith:
    - '/package_script_service'
    - '/installer'
    Image|endswith:
    - '/sh'
    - '/bash'
    - '/dash'
    - '/python'
    - '/ruby'
    - '/perl'
    - '/php'
    - '/javascript'
    - '/osascript'
    - '/tclsh'
    - '/curl'
    - '/wget'
    CommandLine|contains:
    - 'preinstall'
    - 'postinstall'
  condition: selection_installer
falsepositives:
- Legitimate software uses the scripts (preinstall, postinstall)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of suspicious child processes initiated by macOS installer packages, specifically targeting scripts and interpreters such as osascript, curl, and wget. The likely attacker objective is to execute malicious scripts or commands that could facilitate data exfiltration or unauthorized access. This behavior is relevant to MITRE ATT&CK techniques such as **Execution (T1059)** and **Command and Control (T1071)**.

  The primary telemetry sources for this detection are process creation logs from macOS, particularly focusing on Event ID for process creation. If malicious, this activity can lead to compromise, such as initial access or installation of persistent backdoors. Importantly, this detection does NOT confirm that the activity is malicious, as legitimate software installations may also trigger these alerts.

  ### Investigation Steps

  - **Review parent and child process relationships:** Check process creation logs for **Event ID 100 (macOS Process Creation)** to identify all child processes spawned by installer package parents like `/installer`. Ensure the `ParentImage` corresponds to known installer paths.

  - **Analyze command line arguments:** Focus on the command line of the child processes for entries containing `preinstall` or `postinstall`. Look for suspicious combinations or unexpected usage of `osascript`, `curl`, or `wget` that deviate from typical deployment behaviors.

  - **Correlate with known software packages:** Cross-reference the detected child processes against expected legitimate software behaviors. Legitimate scripts typically use standard installation paths and do not execute potentially harmful commands from parent processes.

  - **Check for network activity:** Investigate any associated network connections initiated by the child processes by examining logs for outbound connections made by `curl` or `wget`. Look for unusual domains or IP addresses that do not reflect valid software repositories.

  - **Monitor system integrity:** Validate the presence of any created files or changes made during installation. Use logs like `fseventsd` to check for unexpected file creations or modifications, particularly in sensitive directories.

  ### Prioritization

  This alert is of **medium** severity as it originates from a potentially compromised or misused system where installer packages are commonly used. The likelihood of malicious abuse is moderate, especially in environments where scripting is prevalent, making it a potentially weaponized behavior.

  ### Blind Spots and Assumptions

  This detection strategy has limitations due to potential evasion techniques, such as using different interpreters or renaming scripts to bypass detection. Reliable detection requires comprehensive logging of all macOS process creations, including permission settings for application execution. Additionally, legitimate software installations often deploy scripts that could trigger this alert, necessitating careful contextual analysis. A companion detection that could strengthen coverage involves monitoring network activity from installation processes to catch data exfiltration attempts.

