title: Suspicious Installer Package Child Process
id: e0cfaecd-602d-41af-988d-f6ccebb2af26
status: test
description: Detects the execution of suspicious child processes from macOS installer
  package parent process. This includes osascript, JXA, curl and wget amongst other
  interpreters
references:
- https://redcanary.com/blog/clipping-silver-sparrows-wings/
- https://github.com/elastic/detection-rules/blob/4312d8c9583be524578a14fe6295c3370b9a9307/rules/macos/execution_installer_package_spawned_network_event.toml
author: Sohan G (D4rkCiph3r)
date: 2023-02-18
tags:
- attack.t1059
- attack.t1059.007
- attack.t1071
- attack.t1071.001
- attack.execution
- attack.command-and-control
logsource:
  category: process_creation
  product: macos
detection:
  selection_installer:
    ParentImage|endswith:
    - '/package_script_service'
    - '/installer'
    Image|endswith:
    - '/sh'
    - '/bash'
    - '/dash'
    - '/python'
    - '/ruby'
    - '/perl'
    - '/php'
    - '/javascript'
    - '/osascript'
    - '/tclsh'
    - '/curl'
    - '/wget'
    CommandLine|contains:
    - 'preinstall'
    - 'postinstall'
  condition: selection_installer
falsepositives:
- Legitimate software uses the scripts (preinstall, postinstall)
level: medium
note: |
  ### Technical Context
  This rule detects the execution of suspicious child processes that originate from macOS installer package parent processes. It focuses on identifying potentially malicious commands executed through interpreters such as `osascript`, `curl`, and `wget`. The scenario often involves adversaries leveraging installer packages to execute scripts that may establish command and control frameworks, download additional payloads, or perform other actions that compromise system integrity.

  Attackers may utilize this technique to introduce malicious software onto a host. By executing scripts via familiar installation mechanisms, they can avoid detection while maintaining persistence or facilitating lateral movement across the network. The relevant MITRE ATT&CK tactics include *Execution (T1203)*, *Command and Control (T1071)*, and their associated techniques such as *Command and Scripting Interpreter (T1059)* and *Application Layer Protocol (T1071.001)*.

  The primary sources of evidence for this detection rule include process creation logs from macOS, which would capture the ParentImage and CommandLine of executed processes. Additionally, security tools monitoring script executions may provide further insight into the activities initiated by the installer.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Review the relevant logs for process creation events where the parent process ends with `/package_script_service` or `/installer` to identify suspicious child processes that could indicate malicious activity.

  - **Analyze CommandLine Arguments**: Investigate the command lines of the identified child processes, particularly looking for keywords such as `preinstall` or `postinstall` which often signify execution of post-installation scripts that may warrant further scrutiny.

  - **Correlate Network Activity**: Examine any associated network logs for connections initiated by child processes using `curl` or `wget`, as these commands may be retrieving additional malicious payloads or communicating with command and control servers.

  - **Assess for Legitimate Processes**: Determine if the flagged processes correlate with known legitimate software installations. Contextual awareness of your environment will assist in ideating potential false positives, especially when evaluating `preinstall` or `postinstall` activities.

  ### Prioritization
  This alert is marked with a medium severity due to the potential impact on system integrity and the likelihood that such tactics could be used by an attacker to deploy remote access tools or additional malware. Prompt investigation is essential to minimize any potential damages.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may arise if legitimate installers are executed that also use `osascript`, `curl`, or `wget` without triggering alerts. The detection logic assumes that instances of suspicious child processes will consistently appear under the specified installer parent processes. Additional log configurations, such as enhanced process logging or script activity monitoring, may be required to ensure comprehensive detection of all related activities.

