title: Credentials from Password Stores - Keychain
id: b120b587-a4c2-4b94-875d-99c9807d6955
status: test
description: Detects passwords dumps from Keychain
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.001/T1555.001.md
- https://gist.github.com/Capybara/6228955
author: Tim Ismilyaev, oscd.community, Florian Roth (Nextron Systems)
date: 2020-10-19
modified: 2021-11-27
tags:
- attack.credential-access
- attack.t1555.001
logsource:
  category: process_creation
  product: macos
detection:
  selection1:
    Image: '/usr/bin/security'
    CommandLine|contains:
    - 'find-certificate'
    - ' export '
  selection2:
    CommandLine|contains:
    - ' dump-keychain '
    - ' login-keychain '
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule focuses on identifying unauthorized attempts to extract or dump credentials from the macOS Keychain, a system that securely stores user passwords and private keys. The key actions highlighted by this rule include the use of the `security` command to access or export credentials. Attackers may target the Keychain to capture sensitive information, which can be exploited for lateral movement, privilege escalation, or further attacks within the enterprise network.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Credential Access** (TA0006)
  - **Credentials from Password Stores** (T1555.001)

  Primary data sources for this detection include process creation events from macOS systems, specifically focusing on command lines executed that fit the defined selection criteria (e.g., the use of `security` commands or associated flags indicating credential dumping activities).

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for any instances of the `security` command being executed, particularly focusing on the command line for keywords like `find-certificate` or `dump-keychain`.
  - **Correlate with User Activity:** Analyze user activity around the time of detected commands to determine if the execution aligns with legitimate administrative tasks or if it appears incongruous with typical user behavior.
  - **Identify Source IP/Host:** Investigate the originating host of the command execution to understand the broader context—was it executed on a known administrative machine or an unusual endpoint?
  - **Check for Known Malicious Patterns:** Consult threat intelligence feeds for indicators of compromise related to unauthorized credential access methods and correlate findings with the detected events.

  ### Prioritization
  Alerts generated by this detection rule should be considered medium priority due to the significant impact that compromised credentials can have on enterprise security, alongside the relatively high likelihood of attackers employing these tactics in their operations.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if process logging is not configured properly or if system integrity checks do not capture the `security` command's behavior. An assumption made by the detection logic is that any execution of the specified command strings is suspicious; however, it might include legitimate administrative activities that should be investigated further. Proper logging configuration of process creation events on macOS endpoints is essential for the alert to function effectively, along with context surrounding user behavior and administrative permissions.

