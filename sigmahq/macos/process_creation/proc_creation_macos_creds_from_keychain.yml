note: |
  ### Technical Context

  This Sigma rule detects the execution of commands related to the dumping of credentials from macOS Keychain. Specifically, it identifies the usage of the `security` command with parameters that indicate potential malicious activity, such as exporting certificates or dumping the Keychain content. The likely objective of this behavior is to obtain stored passwords or secure tokens, which can facilitate further unauthorized access and lateral movement within the network.

  This behavior is linked to the MITRE ATT&CK tactic of Credential Access, specifically technique T1555.001 (Credentials from Password Stores - Keychain). The primary telemetry source for this detection includes process creation logs from macOS, capturing details like command-line arguments and process images. If this activity is malicious, it poses a significant risk to the confidentiality of credentials. It's important to note that this detection does not confirm malicious intent by itself, as legitimate system administration activities could also trigger it.

  ### Investigation Steps

  - **Check process creation logs:** Review macOS process creation logs (e.g., `syslog`, `Unified Logs`) for Event IDs related to process execution, specifically for `/usr/bin/security`. Look for any occurrences of 'find-certificate', 'export', 'dump-keychain', or 'login-keychain'.

  - **Analyze command-line arguments:** For identified executions, analyze the full command-line arguments for signs of misuse, especially if the command starts with `security` and includes potentially malicious options. Legitimate usage typically does not involve bulk certificate exports or dumping entire keychains.

  - **Correlate with user activity:** Inspect the context of the command execution by correlating it with user login activity (e.g., user activity logs or authentication logs). Verify if the user executing the command has authorization for keychain management.

  - **Identify malicious indicators:** Look for usage patterns such as multiple executions of `security dump-keychain` within a short time frame from unusual accounts or during non-business hours, which may signify an attacker attempting to harvest credentials.

  - **Review Asset Role:** Determine the criticality of the affected system. If the system is a server or a key user workstation where sensitive applications are used, the risk is escalated.

  - **Validate file creation or exfiltration:** If the investigation leads to identifying export actions, check for the creation of temporary files that may store sensitive information. Review for any outgoing file transfers or alerts related to file sharing applications post-execution.

  ### Prioritization

  This alert carries a medium severity level due to its potential impact on credential confidentiality, especially if sensitive credentials are compromised. Given that accessing Keychain can lead to significant adversary advantages, and the behavior can be weaponized, its detection warrants prompt investigation.

  ### Blind Spots and Assumptions

  There are limitations in detecting malicious acts if users perform legitimate administrative tasks that involve similar command usage. Reliable detection requires proper logging configurations for process creations and access logs specific to macOS environments. Additionally, legitimate activities such as routine credential audits or administrative check-ups may trigger this alert, so context is crucial. A related detection to consider is monitoring for unusual outbound connections or file transfers post credential access attempts.

