  ---

  ### Technical Context

  This rule detects the execution of the `csrutil` command with parameters that disable System Integrity Protection (SIP) on macOS systems. SIP is a security feature designed to protect the system from malicious modifications. By disabling SIP, an adversary can execute unauthorized actions that could lead to further exploitation or persistence on the system. This behavior aligns with the MITRE ATT&CK technique "Disable or Modify System Security Software" (T1518.001).

  The primary telemetry source for this detection is macOS process creation logs that capture command-line executions, specifically targeting the parameters of `csrutil`. If malicious, disabling SIP could allow attackers to manipulate critical system files and processes. This detection does NOT confirm that an adversary has successfully compromised the system, as there may be legitimate administrative tasks that require SIP to be disabled temporarily.

  ---

  ### Investigation Steps

  - **Review the process creation logs**: Look for Security Event ID associated with the execution of `/usr/bin/csrutil`. Confirm that the command line includes `disable`. This indicates potential malicious intent.

  - **Verify legitimate administrative actions**: Check if there are any documented changes or maintenance tasks performed by administrative users around the time of this event. For example, usage by authorized personnel should have clear justification.

  - **Investigate user accounts**: Identify the user account associated with the `csrutil` execution. Compare this against standard administrative practices. A non-admin or unexpected account may indicate malicious activity.

  - **Cross-reference with system integrity logs**: Examine logs for other security settings, such as Event ID 1000 for SIP status before and after the execution of `csrutil disable`. Look for a transition from "enabled" to "disabled".

  - **Check for associated files**: Determine if there are newly created or modified files in system directories (e.g., `/System`, `/Library`). Creation timestamps or modifications coinciding with `csrutil` execution may indicate exploitation.

  ---

  ### Prioritization

  This alert should be considered medium severity due to its association with post-exploitation capabilities. Affected systems with SIP disabled are more susceptible to further malicious actions. While disabling SIP is relatively specific, the weaponization of such behaviors is well-documented among attackers, warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions; certain administrative roles may legitimately disable SIP. Additionally, if process creation logging is not enabled on macOS systems, this detection will not trigger. High-frequency administrative tasks could create false positives, necessitating contextual review. A related detection to consider is monitoring for unusual binary executions or modifications to core system processes following SIP being disabled, which can enhance overall coverage of this behavior.

