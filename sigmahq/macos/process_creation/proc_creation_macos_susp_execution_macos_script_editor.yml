note: |
  ### Technical Context

  This Sigma rule detects the spawning of unusual child processes from the macOS Script Editor application. Such behavior may indicate an attacker leveraging AppleScript or other scripts to execute malicious commands, potentially leading to unauthorized access or system compromise. The relevant MITRE ATT&CK tactics include Execution (T1204) and Defense Evasion (T1566), with techniques focusing on user execution via scripting (T1204.001) and command-line interface manipulation (T1059.002).

  The primary telemetry sources for this detection are process creation logs generated by macOS. Specifically, the detection looks for changes linked to the Script Editor application, which can indicate potential threats if followed by the invocation of scripting tools like `bash`, `curl`, or `osascript`. A successful detection indicates a suspicious use of the Script Editor but does not independently confirm malicious intent, as legitimate users may also invoke scripts for valid purposes.

  ### Investigation Steps

  - **Review process creation events:** Analyze process creation logs (macOS Event ID 100) for entries where the parent process is '/Script Editor' and the child process matches the images listed in the Sigma rule. Focus on suspicious combinations, such as `osascript` or `bash`, which are rarely used benignly.

  - **Correlate with user activity:** Check user activity concerning the execution to determine whether the user executing the script has any history with scripting tools. Consult authentication logs (macOS Event ID 4624) to verify if this user has legitimate reasons for using the Script Editor.

  - **Identify malicious indicators:** Look for process command-line arguments in conjunction with the detected child processes. Malicious arguments or unusual command patterns (e.g., remote URLs in `curl` or base64 decoding in `bash`) can indicate an active attack.

  - **Establish baseline normal behavior:** Document typical use cases of the Script Editor in your environment, including known scripts or automation processes. Compare against current alerts to identify deviations from normal usage patterns.

  - **Check for additional indicators of compromise (IoCs):** Utilize EDR or antivirus logs to investigate if the detected processes have previously been flagged as malicious. This may include records of known malware behavior or user reports.

  ### Prioritization

  This alert should be regarded as medium severity due to the sensitive nature of scripts potentially being executed on macOS devices, coupled with the likelihood of malicious misuse. Given that the Script Editor is a legitimate utility, any detection may indicate an atypical or weaponized use scenario that requires immediate further investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded through obscured command techniques or by executing scripts outside of the Script Editor context. It is crucial to ensure that full process creation auditing is enabled, as incomplete logs may hinder detection. Legitimate automation or user scripts run through System Administrators or DevOps teams may also trigger this alert. Consider companion detections related to active Script Editor usage, such as unauthorized AppleScript executions or command-line process creation events (macOS Event ID 100) that occur in the same timeframe for a more comprehensive analysis.

