note: |
  ### Technical Context

  This Sigma rule detects the execution of a renamed Remote Management and Monitoring (RMM) tool, MeshAgent, on MacOS systems. The typical attacker objective is to leverage a legitimate remote support tool for unauthorized access and control over compromised systems by renaming the original executable to evade detection. This behavior is relevant to the MITRE ATT&CK tactics of Command and Control (T1071) and Stealth (T1036.003). Primary telemetry sources include macOS process creation logs, specifically observing command line executions for relevant flags and original filenames. If malicious, such activity can lead to compromised systems and unauthorized access to sensitive data. It is important to note that this detection does NOT confirm malicious intent on its own; additional context is necessary for a conclusive assessment.

  ### Investigation Steps

  - **Check process creation logs for MeshAgent executions**: Review macOS process creation logs (such as Event ID 100) for any instances where the command line contains `--meshServiceName` and the original filename includes `meshagent`.

  - **Identify potential renaming indicators**: Look for processes that match the detection criteria but are not running from typical installation paths for MeshAgent, indicating possible renaming or spoofing attempts.

  - **Correlate with network traffic**: Analyze network traffic for outgoing connections from the identified process to unknown IP addresses. Look for suspicious DNS queries or HTTP requests originating from the MeshAgent executable.

  - **Benchmark against legitimate activity**: Compare identified instances against known legitimate uses of MeshAgent within your organization, such as updates or scheduled maintenance operations, to determine expected behavior.

  - **Document high-confidence malicious indicators**: Confirm the presence of the renamed instance in conjunction with any abnormal behavior, such as unknown network connections or unauthorized file access, as high-confidence indicators of compromise.

  - **Review asset criticality**: Assess the role and importance of the affected host or asset in your environment, prioritizing incidents on systems that manage sensitive data or critical infrastructure.

  ### Prioritization

  This alert carries a high severity level due to the potential impact on sensitive systems and the likelihood of being exploited for unauthorized access. The behavior is common in adversary workflows, particularly in targeted attacks that leverage previously trusted software.

  ### Blind Spots and Assumptions

  Detection may be limited if logging configurations are not set to capture detailed process creation events or if the attacker employs additional evasion techniques, such as using alternative remote access tools. Legitimate activities, such as IT maintenance tasks by authorized users, can also trigger this alert, potentially leading to false positives. Companion detections related to unusual network behavior or concurrent user activities on the same host may enhance coverage and context.

