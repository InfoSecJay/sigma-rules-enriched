note: |
  ### Technical Context

  This rule detects the execution of a renamed instance of the Remote Monitoring and Management (RMM) tool MeshAgent on macOS systems. Attackers may rename legitimate RMM tools like MeshAgent to evade detection and establish unauthorized remote access to compromised hosts. The relevant MITRE ATT&CK tactics are "Command and Control" (TA0011) and "Defense Evasion" (TA0005), specifically techniques T1219.002 (Remote Access Tools) and T1036.003 (Masquerading). The primary telemetry source is process creation logs on macOS, notably through the process creation events that indicate command-line arguments and original file names. If malicious, this behavior could lead to unauthorized control over systems, posing significant security risks. Importantly, this detection does NOT confirm malicious intent without further investigation into the context and additional activities related to the detected process.

  ---

  ### Investigation Steps

  - **Check command-line arguments**: Review the macOS process creation logs (Event ID 1002) for any instances of MeshAgent with command-line arguments containing `--meshServiceName`. Look for indicators unrelated to legitimate operations, such as unexpected parameters or odd service names.

  - **Validate original file name**: Inspect the logs for the original file name of the process. Identify if it contains 'meshagent', which is a strong indicator of potentially malicious activity. Compare this with known legitimate file names to confirm.

  - **Investigate related network activity**: Cross-reference the detection with network traffic logs (e.g., firewall logs for outbound connections) to identify if the MeshAgent instance attempted connections to suspicious IP addresses or domains. Track down any external communication typical for RMM tools.

  - **Identify host roles and permissions**: Confirm the role of the host where the alert triggered. If it is a user workstation rather than a server designated for remote access or IT administration, this discrepancy raises suspicion of misuse.

  - **Document legitimate behavior patterns**: Review expected behavior for legitimate instances of MeshAgent, including typical service names and command-line arguments, which often appear in managed deployment scenarios. Note any deviations from this baseline.

  - **Capture file and process artifacts**: If applicable, gather validation of any file creation or upload activity associated with the MeshAgent execution. Examine `/Library/LaunchDaemons/` or user directories for unauthorized artifacts related to MeshAgent activity.

  ---

  ### Prioritization

  This alert is considered high severity due to the potential impact on remote system access and control, particularly in enterprise environments. The likelihood of malicious abuse is significant, especially given the trend of attackers leveraging legitimate tools like RMM software in their operations. This behavior is commonly weaponized in attacks seeking persistent access.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the renaming of other RMM tools, leading to false negatives if the observable traits differ from those outlined. Required log sources, such as process creation logs, must be collected consistently across macOS systems for reliable monitoring. Legitimate activities that may trigger this alert include authorized IT support staff utilizing RMM tools for system management. Companion detections, such as monitoring for unusual outgoing network connections from legitimate processes, can help strengthen overall visibility and context around similar threats.

