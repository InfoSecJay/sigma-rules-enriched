  ---

  ### Technical Context

  This rule detects the execution of system utilities on macOS that are commonly used to discover network connections, such as `/who`, `/w`, `/last`, `/lsof`, and `/netstat`. The likely objective of an attacker using these commands is to gather information about the network environment and identify active users or services that could be potential targets for further exploitation. This behavior falls under the MITRE ATT&CK tactic Discovery, specifically the technique T1049 (Network Share Discovery).

  The primary telemetry sources include process creation logs, focusing on the macOS log types that capture command execution. If this activity is malicious, the security impact could involve unauthorized reconnaissance, enabling an attacker to plan subsequent actions more effectively. Importantly, this detection does NOT confirm that the activity is inherently malicious; legitimate administrative tasks may trigger the same rule.

  ---

  ### Investigation Steps

  - **Identify execution context**: Check for process creation logs (macOS system logs) for Event ID 1 reflecting the execution of `/who`, `/w`, `/last`, `/lsof`, or `/netstat`. Look for legitimate user accounts and examine timestamps to ascertain if the activity aligns with expected operational hours.

  - **Review process initiators**: Investigate the parent process of the command executions. For suspicious entries, confirm if they were initiated by a known or legitimate management tool, or by a less common command line interface that may indicate malicious intent.

  - **Evaluate user activity**: Cross-reference the executed commands with active sessions on the system (e.g., check `last` session logs in `/var/log/utmp`), focusing on whether there are any unexpected user accounts or unusual times of activity that deviate from normal usage patterns.

  - **Check for repeated execution**: If the detected commands are executed multiple times in quick succession, investigate this pattern as it may indicate a more thorough enumeration attempt. Look at the frequency of specific commands over time for anomalies.

  - **Correlate with network logs**: Use firewall logs to check for any high volume of outbound connections or requests post-command execution. Look for high-risk protocols or unusual external IP addresses that may suggest data exfiltration or lateral movement.

  ---

  ### Prioritization

  This alert is informational with moderate severity. While the potential impact on a system is low when observed in isolation, frequent or targeted recon activities can pave the way for more serious threats. Attackers often leverage such discovery commands as preliminary steps in lateral movement, making it essential to investigate further.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion through less common tools or custom scripts that could yield similar results without triggering this detection. Additionally, safeguards must ensure comprehensive logging of processes on macOS to enable reliable detection. Legitimate administrative activities, such as network troubleshooting or system audits, may mistakenly trigger this rule. A companion detection could involve monitoring for unusual outbound network connections following command execution, helping to provide context for the alert.

