note: |
  ### Technical Context
  This rule detects the execution of system utilities on macOS that are commonly used to discover network connections on an endpoint. The specific commands monitored include `who`, `w`, `last`, `lsof`, and `netstat`. Attackers may leverage these commands to enumerate network connections or discover active users on a compromised system, potentially facilitating further exploitative actions. By utilizing such utilities, malicious actors can gather critical information about the network environment and connected users, which can support additional attack vectors such as lateral movement or privilege escalation.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Discovery** (TA0007) and specifically the technique **System Network Connections Discovery** (T1049). This tracking enables analysts to understand the context of potential reconnaissance performed by adversaries on macOS systems.

  The primary data source for this detection is **process creation logs**. Monitoring these logs allows security teams to identify the execution of the specified network discovery commands and correlate them with user activity and other security events.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine process creation logs for the execution of `who`, `w`, `last`, `lsof`, and `netstat` commands. Take note of the user context and timing of each execution to assess if these actions are legitimate or indicative of suspicious behavior.
  - **Correlate with User Activity:** Investigate user authentication logs around the same timeframe to identify any abnormal login patterns or accounts being used. Understand if a legitimate user might be running these commands versus a compromised account.
  - **Examine Network Activity:** Check network logs to see if there are connections made to unusual external IP addresses immediately following the command executions. This can reveal if the system was an intermediary for further malicious activity.
  - **Conduct Contextual Analysis:** Gather additional context by analyzing endpoint telemetry, such as EDR alerts, to ensure that the commands did not occur as part of established legitimate administrative activities.

  ### Prioritization
  Given the potential for network reconnaissance leading to further exploitation, the severity of this alert is moderate; while the commands themselves may not always indicate malicious intent, their use in conjunction with other indicators could signify a high-risk situation necessitating immediate investigation.

  ### Blind Spots and Assumptions
  The detection logic may not cover all possible variations of system network connection discovery, such as other utilities or command options that could be used to achieve similar ends. It assumes that the monitored commands will not be obscured or renamed by an adversary. Additionally, the functionality relies on process creation logs being enabled and properly configured on all monitored macOS endpoints to ensure comprehensive coverage for detection.

