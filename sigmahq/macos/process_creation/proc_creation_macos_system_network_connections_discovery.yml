note: |
  ### Technical Context

  This Sigma rule detects the execution of system utilities on macOS that are commonly used to enumerate network connections, such as `who`, `w`, `last`, `lsof`, and `netstat`. The behavior indicates that an attacker may be attempting to gather information about active users and their connections, which can facilitate lateral movement or privilege escalation. The relevant MITRE ATT&CK tactic is "Discovery" and the technique is T1049 - System Network Connections Discovery.

  The primary telemetry source comes from process creation events on macOS, specifically looking at the command-line utilities executed by users. If such utilities are run frequently or in unusual contexts, it may indicate malicious intent. However, this detection does NOT confirm that the activity is malicious on its own, as it could also stem from legitimate administrative tasks or application defaults.

  ### Investigation Steps

  - **Review process creation events**: Check for Security Event ID related to process creation on macOS. Look for entries with `Image` ending in `/who`, `/w`, `/last`, `/lsof`, or `/netstat` within the `process_creation` logs. Benign use may include system administrators using these commands periodically or in response to troubleshooting needs.

  - **Correlate with user activity**: Analyze related logs for user context, especially focusing on account types (standard users vs. privileged accounts). Usage of these commands by non-administrative accounts may increase the suspicion of nefarious activity.

  - **Investigate execution context**: Review the execution time of these commands in conjunction with other user actions or breaches, particularly during odd hours or when systems are not typically being accessed.

  - **Identify automation attempts**: Search for unusual patterns in the execution of these commands (e.g., running in quick succession or in scripted automation). Use log fields to ascertain whether these commands were executed from known automation tools or scripts.

  - **Assess network implications**: If `netstat` or `lsof` is used, evaluate whether there is an indication of external connections to suspicious IPs or abnormal network activity. Look for flags and outgoing connections that deviate from normal behavior for the host.

  ### Prioritization

  This alert indicates network discovery behavior which may be leveraged by an attacker to assess a system's network footprint. The impact level is contingent upon the criticality of the affected assets; however, this behavior is often seen during reconnaissance phases of attacks, thus meriting elevated attention in most enterprise contexts.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative use that doesn’t trigger alerts, or use of custom scripts that obfuscate command execution. Reliable detection requires complete logging configuration on macOS to capture all process creation events. Additionally, legitimate automated processes that invoke these commands may pose as false positives, necessitating understanding of normal operational usage patterns. A related detection could be monitoring for unusual outbound network traffic that indicates data exfiltration attempts post-discovery.

