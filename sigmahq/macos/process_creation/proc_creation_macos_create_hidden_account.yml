title: Hidden User Creation
id: b22a5b36-2431-493a-8be1-0bae56c28ef3
status: test
description: Detects creation of a hidden user account on macOS (UserID < 500) or
  with IsHidden option
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.002/T1564.002.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-10
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1564.002
logsource:
  category: process_creation
  product: macos
detection:
  dscl_create:
    Image|endswith: '/dscl'
    CommandLine|contains: 'create'
  id_below_500:
    CommandLine|contains: UniqueID
    CommandLine|re: '([0-9]|[1-9][0-9]|[1-4][0-9]{2})'
  ishidden_option_declaration:
    CommandLine|contains: 'IsHidden'
  ishidden_option_confirmation:
    CommandLine|contains:
    - 'true'
    - 'yes'
    - '1'
  condition: dscl_create and id_below_500 or dscl_create and (ishidden_option_declaration
    and ishidden_option_confirmation)
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of hidden user accounts on macOS systems, specifically targeting user IDs below 500 or accounts created with the 'IsHidden' option. Attackers may create hidden accounts to maintain unauthorized access, evade detection, and conduct further malicious activities, such as data exfiltration or lateral movement within a network. The primary goal of these actions is to establish persistence within the system without alerting system administrators or security personnel.

  Relevant tactics and techniques from the MITRE ATT&CK framework include **Defense Evasion (T1564.002)**, which addresses methods like creating hidden user accounts to avoid user detection. By focusing on modifications to user accounts that are not easily visible, attackers can exploit these stealthy tactics to extend their foothold in the environment.

  Primary data sources for detecting this activity include **process creation events** from macOS logs, particularly when commands are executed involving the Directory Service command-line utility (`dscl`). Additional key telemetry includes logs capturing command-line parameters, which can reveal attempts to create hidden user accounts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check for process creation logs where the image ends with `/dscl` and the command line includes `'create'`. Pay attention to any accompanying command-line options indicating user ID or the 'IsHidden' declaration.

  - **Analyze Command-Line Arguments:** Investigate command-line arguments for the `UniqueID` and ensure the value is below 500, which signifies a potential hidden user account creation. Look for other patterns that may hint at abnormal configurations.

  - **Identify Unauthorized Accounts:** Cross-reference created user accounts against an inventory of legitimate users. Focus on accounts marked as hidden or with non-standard UserIDs, especially those emerging in a short time-frame.

  - **Gather Contextual Information:** Collect additional context linking the account creation to user or system activities preceding the event. Look into system logs, user activity, and any flags or alerts raised that indicate unusual administrative actions took place around the time of the account's creation.

  ### Prioritization
  This alert carries a medium severity level due to the potential impact of unauthorized hidden accounts. If attackers succeed in establishing these accounts, they can maintain persistent access for future exploits, posing significant risks to the confidentiality, integrity, and availability of enterprise systems.

  ### Blind Spots and Assumptions
  There may be blind spots in detecting hidden user account creation if the logging of process creation is misconfigured or if event logs are not retained for a sufficient period to analyze patterns. The detection logic assumes that the legitimate administrative activities do not use similar command line parameters within `dscl`, which could lead to false positives. It is crucial to ensure that logging for process creation events is enabled and properly configured to catch such activities effectively.

