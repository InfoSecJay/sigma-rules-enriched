title: Hidden User Creation
id: b22a5b36-2431-493a-8be1-0bae56c28ef3
status: test
description: Detects creation of a hidden user account on macOS (UserID < 500) 
  or with IsHidden option
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.002/T1564.002.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-10
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1564.002
logsource:
  category: process_creation
  product: macos
detection:
  dscl_create:
    Image|endswith: '/dscl'
    CommandLine|contains: 'create'
  id_below_500:
    CommandLine|contains: UniqueID
    CommandLine|re: '([0-9]|[1-9][0-9]|[1-4][0-9]{2})'
  ishidden_option_declaration:
    CommandLine|contains: 'IsHidden'
  ishidden_option_confirmation:
    CommandLine|contains:
    - 'true'
    - 'yes'
    - '1'
  condition: dscl_create and id_below_500 or dscl_create and 
    (ishidden_option_declaration and ishidden_option_confirmation)
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This rule detects the creation of hidden user accounts on macOS systems, specifically those with a UserID below 500 or those using the IsHidden option in the dscl command. The likely objective of an attacker is to establish a covert account to maintain persistence on the host while evading detection. This behavior corresponds to the MITRE ATT&CK technique: **T1564.002 - Hidden User Accounts**.

  The primary telemetry source for this detection is process creation logs from macOS systems, specifically logs capturing execution of the `dscl` command. If malicious, this activity can lead to unauthorized access and control over the affected system. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger similar alerts.

  ### Investigation Steps

  - **Review process creation logs:** Examine Security Event IDs related to process creation, specifically targeting logs for `dscl`. Focus on fields capturing CommandLine arguments for unusual account creation parameters.

  - **Check UserID values:** Assess the created user accounts for UserID values below 500. User accounts with IDs in this range are often indicative of hidden or unauthorized accounts.

  - **Validate the IsHidden flag:** Investigate whether the CommandLine parameters include `IsHidden` set to `true`, `yes`, or `1`. This is a strong indicator of an attempt to create a hidden user account.

  - **Identify legitimate administrative tasks:** Recognize expected behavior from system administrators, such as the creation of service accounts for applications that may use low UserIDs. Compare timestamps and contexts of logged events against known administrative activity.

  - **Correlate with account activity logs:** Look for unusual login attempts or activities related to the suspiciously created account in other logs (e.g., authentication logs). This may point to further insights into whether the account is being exploited.

  - **Assess system criticality:** Consider the host's role within the network. If the system is critical (e.g., a server hosting sensitive applications), prioritize these alerts higher due to the impact of potential abuse.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on system security and user data integrity. While the direct likelihood of abuse varies, hidden user accounts are commonly weaponized in post-exploitation scenarios, making these alerts significant.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions creating similar accounts without malicious intent. Ensure process creation logs for dscl are properly configured and retained for reliable detection. Additionally, legitimate software or scripts could also trigger this alert, such as automated deployment tools that create hidden accounts. Related detections may include monitoring for unusual authentication patterns, enhancing overall visibility into potential misuse of newly created accounts.

