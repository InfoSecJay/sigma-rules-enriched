title: Hidden User Creation
id: b22a5b36-2431-493a-8be1-0bae56c28ef3
status: test
description: Detects creation of a hidden user account on macOS (UserID < 500) 
  or with IsHidden option
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.002/T1564.002.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-10
modified: 2021-11-27
tags:
- attack.stealth
- attack.t1564.002
logsource:
  category: process_creation
  product: macos
detection:
  dscl_create:
    Image|endswith: '/dscl'
    CommandLine|contains: 'create'
  id_below_500:
    CommandLine|contains: UniqueID
    CommandLine|re: '([0-9]|[1-9][0-9]|[1-4][0-9]{2})'
  ishidden_option_declaration:
    CommandLine|contains: 'IsHidden'
  ishidden_option_confirmation:
    CommandLine|contains:
    - 'true'
    - 'yes'
    - '1'
  condition: dscl_create and id_below_500 or dscl_create and 
    (ishidden_option_declaration and ishidden_option_confirmation)
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of hidden user accounts on macOS systems, specifically those with UserID values less than 500 or designated as hidden through the `IsHidden` option. Attackers may aim to establish persistent access or cover their tracks by creating accounts that are not easily visible to system administrators. This behavior specifically aligns with the MITRE ATT&CK tactic of "Stealth" (T1564.002), which involves methods to obfuscate or conceal malicious activity.

  The primary telemetry sources are process creation logs related to the `dscl` command, specifically tracking command line arguments for user account creation actions. If malicious, this behavior can significantly compromise the security posture of the affected system, as an attacker can leverage hidden accounts for unauthorized access. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may invoke similar commands.

  ### Investigation Steps

  - **Verify process details:** Check for Security Event logs related to macOS process creation (e.g., log messages from `/var/log/system.log` or `Console.app`). Look for `dscl` with command line arguments like `create`, `UniqueID`, and `IsHidden`. Legitimate entries may show user account additions following standard administrative procedures.

  - **Inspect user account information:** Query the Mac system for existing user accounts using the command `dscl . list /Users UniqueID`. Accounts with UserIDs below 500 that are not part of normal administrative functions should raise concern.

  - **Assess account visibility:** Analyze the command output for accounts marked with the `IsHidden` option. If any accounts are marked as hidden without proper justification or are not recognized during user management tasks, this may indicate malicious activity.

  - **Look for associated malicious indicators:** Check for subsequent commands or actions taken by newly created accounts (e.g., logs that show login attempts or service executions tied to the hidden accounts). Monitor for `sudo` or `su` commands run by these hidden accounts, which may indicate system exploitation.

  - **Analyze log retention and alert configurations:** Review your logging setup to ensure that processes capturing logged events are active and stored long enough for forensic analysis. If specific logs are not enabled, it could mask legitimate activity or real threats.

  ### Prioritization

  This alert should be considered medium severity, as the creation of hidden accounts typically indicates an attempt to gain unauthorized access or to maintain persistence within an environment. The presence of a hidden user account increases the likelihood of malicious abuse, particularly in targeted attacks. This method is known for its stealth and can often be weaponized by attackers to evade detection.

  ### Blind Spots and Assumptions

  While this detection is effective, limitations include potential evasion techniques, such as the use of different command-line utilities or user creation methods that don’t involve `dscl`. Reliable detection requires correct logging configurations to capture all relevant user creation events. Additionally, legitimate administrative operations might trigger similar alerts, such as legitimate user provisioning by IT staff. A related detection to enhance coverage could involve monitoring for unusual login patterns or behavior from newly created accounts.

