detection:
  selection_1:
    Image|endswith:
    - '/nc'
    - '/netcat'
  selection_2:
    Image|endswith:
    - '/nmap'
    - '/telnet'
  filter:
    CommandLine|contains: 'l'
  condition: (selection_1 and not filter) or selection_2
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This detection identifies the execution of network scanning tools such as Netcat, Nmap, and Telnet, which can be used to enumerate local or remote network services. The likely attacker objective is to discover live hosts, open ports, or services running on a target environment, aiding in subsequent reconnaissance or exploitation efforts. This behavior relates to the MITRE ATT&CK tactic of Discovery and the technique T1046 (Network Service Scanning). The primary telemetry sources include process creation logs from macOS (such as syslog or unified logs), specifically monitoring for command-line events associated with the mentioned tools. If malicious, this activity can lead to network breaches or data exfiltration through service exploitation. It is important to note that this detection does NOT confirm that the action is malicious; legitimate administrative actions may also trigger the alert.

  ### Investigation Steps

  - **Review the command line arguments: ** Check the command line for Event ID associated with process creation (macOS unified logs) for any unusual flags or combinations indicative of scanning (i.e., typical usage patterns like `nmap -sP` for ping scans).

  - **Investigate recent usage history: ** Look for the execution timestamps of detected processes within the last 24 hours to assess if the activity correlates with other suspicious events (e.g., sudden spikes in network activity).

  - **Identify the executing user context: ** Review the user account in the logs (e.g., DEVUUID for macOS) to see if it aligns with legitimate administrative roles. Uncommon users running these tools may indicate potential abuse.

  - **Cross-reference network access logs: ** Validate outbound connections during the time of the scanning activity using application firewall logs or network activity logs (e.g., event logs showing outbound connections) to assess if any unauthorized external services were accessed.

  - **Understand normal administrative behavior: ** Document benign use of these tools by network admins. For example, authorized usage of nmap might typically involve specific IP ranges, service checks, or locations that don’t raise alarms.

  - **Look for brute force and login attempts: ** Analyze for related events like failed login attempts to systems in the scanned IP range (macOS auth logs), indicating potentially malicious intent after probing network services.

  ### Prioritization

  This alert should be classified as low severity. While it indicates a potential reconnaissance activity on the network, the likelihood of malicious abuse is moderate, as legitimate administrative actions may trigger the detection. However, network scanning is a common precursor to further exploits, underscoring the need for careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not sufficiently detailed, as the specifics of command-line arguments may not always be captured. Adversaries may employ evasion techniques, such as obfuscating tool names or using custom scripts that mirror legitimate traffic. Legitimate activities, such as network assessments by admins, can result in false positives. A related detection to enhance coverage would be monitoring for abnormal outbound connections that correlate with known scanning activities.

