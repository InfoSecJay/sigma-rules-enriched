logsource:
  category: process_creation
  product: macos
detection:
  selection_netcat:
    Image|endswith:
    - '/nc'
    - '/netcat'
  selection_other:
    Image|endswith:
    - '/nmap'
    - '/telnet'
  filter_main_nc_listen:
    CommandLine|re: '\s(?:--listen\b|-[46DdknrtuUvz]{0,10}l[46DdknrtuUvz]{0,10})'
  condition: (selection_netcat and not 1 of filter_main_nc_*) or selection_other
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This Sigma rule detects the enumeration of local or remote network services using tools like Netcat, Nmap, or Telnet, particularly when the command indicates a listening state. The likely attacker objective is reconnaissance, aimed at identifying open ports and services on the target machine to exploit vulnerabilities. This behavior correlates with the MITRE ATT&CK tactic **Discovery** and technique **Network Service Scanning (T1046)**. Primary telemetry sources include macOS process creation data, specifically logs that capture command line arguments and images of executed processes. If malicious, this activity could facilitate unauthorized access or lateral movement within the network. Importantly, this detection does NOT confirm that any malicious exploitation has occurred; it only highlights potential reconnaissance activity.

  ### Investigation Steps

  - **Review process creation logs for network scanning tools**: Check Security Event ID for macOS process creation (e.g., `syslog` entries) where the image ends with `/nc`, `/netcat`, `/nmap`, or `/telnet`. Identify if the command line includes arguments suggesting a listening state (`--listen`, `-l`).

  - **Validate the legitimacy of network scanning activity**: Compare the identified activities against a baseline of normal administrative functions on the affected asset. Legitimate actions may involve authorized downloads or scans performed during network assessment or troubleshooting.

  - **Correlate timing with other network logs**: Examine network traffic logs (such as `tcpdump` or `netstat`) during the same timeframe for unusual connections or access attempts to the same target systems.

  - **Identify high-confidence malicious indicators**: Look for repeated attempts to scan multiple IP addresses within a short timeframe, especially if followed by alerts of successful unauthorized access attempts.

  - **Assess asset criticality**: Determine the role of the affected system (e.g., server, workstation, gateway) and the potential impact of any unauthorized access based on its criticality within the organization.

  - **Check for evasion tactics**: Investigate potential use of obfuscation techniques, such as using custom or less common scanning tools that might not trigger detection but indicate advanced adversary behavior.

  ### Prioritization

  The severity of this alert is low due to its nature as a reconnaissance activity rather than an immediate threat. However, it can indicate potential preparation for more malicious actions, especially if observed on sensitive systems or in critical environments where reconnaissance is often a prelude to attack.

  ### Blind Spots and Assumptions

  Detection may be limited by the usage of custom or encrypted scanning tools that do not match known signatures. Reliable detection requires enabling comprehensive logging for process creations on macOS systems. Legitimate activities, such as network configuration changes or testing by authorized personnel, may trigger these alerts. A companion detection for broader coverage could involve monitoring direct HTTP requests or unusual service accesses that often follow network scanning activities.

