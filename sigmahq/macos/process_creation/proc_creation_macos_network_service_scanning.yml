detection:
  selection_1:
    Image|endswith:
    - '/nc'
    - '/netcat'
  selection_2:
    Image|endswith:
    - '/nmap'
    - '/telnet'
  filter:
    CommandLine|contains: 'l'
  condition: (selection_1 and not filter) or selection_2
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This detection rule identifies potential enumeration of local or remote network services on macOS systems by monitoring for the execution of common networking tools such as `nc`, `nmap`, and `telnet`. These tools, when employed maliciously, can be used by attackers to discover open ports and services, providing valuable information about the target system's configuration and potential vulnerabilities. The detection is particularly relevant in scenarios where an adversary seeks to gather intelligence prior to launching a more aggressive attack, facilitating an understanding of system defenses and potential entry points.

  The relevant MITRE ATT&CK tactics for this detection include **Discovery** (TA0007) and specifically the **Network Service Scanning** technique (T1046). The ability to scan services can indicate reconnaissance activities that precede exploitation attempts. Primary data sources for this detection will include process creation events, which capture the execution of these networking tools, and associated command-line arguments that provide context on their usage.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for process creation events related to `nc`, `nmap`, and `telnet` to identify any unusual execution patterns, particularly in sensitive network segments.
  - **Inspect Command-Line Parameters**: Check the command-line arguments of detected processes to determine if any include typical flags associated with port scanning, such as those containing 'l', which may reveal the intent behind the execution.
  - **Correlate with Network Logs**: Cross-reference findings with network traffic logs to identify outbound connections initiated by the scanning tools, which can help confirm if the activities were part of an external reconnaissance effort.
  - **Assess User Context**: Look into the user context under which the scanning was performed. Verify if the user is typically involved in network administration or if the action appears to diverge from their usual activity.

  ### Prioritization
  While the alert has been categorized as low severity, it's important to remain vigilant. Unauthorized network service scanning can be a stepping stone for more severe incidents such as data breaches or lateral movement within the network.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly regarding legitimate administrative activities that may involve the use of these tools in authorized contexts. The detection logic assumes that any invocation of these utilities without certain command-line flags represents suspicious behavior, bypassing legitimate use cases. Additionally, for the alert to function effectively, adequate logging configurations must be enabled to capture process creation events and their command-line inputs across macOS systems.

