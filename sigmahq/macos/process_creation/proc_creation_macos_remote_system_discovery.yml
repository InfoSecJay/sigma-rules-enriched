note: |
  ### Technical Context

  This rule detects system discovery behaviors on macOS, specifically the use of the `arp` and `ping` commands with specific parameters. The likely attacker objective is to map the network, identify active devices, and assess potential targets for further exploits. This activity aligns with the MITRE ATT&CK technique **Network Discovery (T1018)**.

  The primary telemetry source is process creation logs on macOS, specifically looking for command execution patterns. If malicious, this behavior may indicate pre-attack reconnaissance, posing a risk to network integrity. However, this detection does NOT confirm malicious intent on its own; legitimate administrative activities can trigger similar alerts.

  ### Investigation Steps

  - **Verify command context:** Check the command line parameters for `arp` and `ping` execution (Process Creation logs, macOS Event ID: 255). Look for suspicious or atypical patterns beyond regular administrative tasks.

  - **Assess network activity:** Review network flow logs for outbound traffic patterns originating from the affected host. Look for unusual connections to internal or external IP addresses that may not correspond to legitimate business operations.

  - **Identify legitimate activities:** Confirm if the `ping` command was invoked for common network troubleshooting (e.g., targeting regular organizational IP ranges). Compare against a baseline of expected administrative command usage in your environment.

  - **Highlight high-confidence indicators:** Note instances of `ping` command executed with private IP ranges (`10.x.x.x`, `172.x.x.x`, `192.168.x.x`). This pattern is typical for unsanctioned network enumeration.

  - **Examine endpoint configuration:** Validate auditable events on asset roles as critical hosts or servers might be at higher risk if discovered by unauthorized users.

  - **Investigate prior alerts:** Check for any previous alerts or logs indicating suspicious patterns of privilege escalation or unauthorized access attempts correlated with this behavior.

  ### Prioritization

  This alert is considered informational; while it indicates potential reconnaissance behavior, its actual impact depends on the criticality of the affected system and whether the activity correlates with known threats. The likelihood of malicious abuse exists but varies significantly based on contextual factors such as time of occurrence and user roles.

  ### Blind Spots and Assumptions

  Detection may miss cases where legitimate user behavior mimics this pattern, such as network diagnostics by system administrators. Ensuring full logging of process creations on endpoints is crucial for reliable detection. There are no specific evasions noted that directly hide `arp` or `ping` usage; however, variations in command syntax might circumvent detection. A related detection to consider is notable unauthorized access attempts (e.g., unusual login behavior) indicating potential coordination with network discovery efforts.

