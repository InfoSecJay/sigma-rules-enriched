logsource:
  category: process_creation
  product: macos
detection:
  selection_1:
    Image|endswith: '/arp'
    CommandLine|contains: '-a'
  selection_2:
    Image|endswith: '/ping'
    CommandLine|contains:
    - ' 10.'         # 10.0.0.0/8
    - ' 192.168.'         # 192.168.0.0/16
    - ' 172.16.'         # 172.16.0.0/12
    - ' 172.17.'
    - ' 172.18.'
    - ' 172.19.'
    - ' 172.20.'
    - ' 172.21.'
    - ' 172.22.'
    - ' 172.23.'
    - ' 172.24.'
    - ' 172.25.'
    - ' 172.26.'
    - ' 172.27.'
    - ' 172.28.'
    - ' 172.29.'
    - ' 172.30.'
    - ' 172.31.'
    - ' 127.'         # 127.0.0.0/8
    - ' 169.254.'         # 169.254.0.0/16
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: informational
note: |
  ### Technical Context
  This detection rule identifies remote system enumeration on macOS environments by monitoring the execution of specific network discovery commands. By detecting the use of the `arp` command with the `-a` argument and `ping` commands targeting local IP ranges (such as 10.*, 192.168.*, and 172.*), the rule aims to uncover potentially unauthorized reconnaissance activities that a malicious actor may conduct to map the internal network.

  Attackers may leverage these basic network tools to discover active devices and their IP addresses within a target network, allowing them to identify potential targets for further exploitation, lateral movement, or data exfiltration. The primary goal of such activities typically includes gathering intelligence on the organization's network structure and system configurations.

  Relevant MITRE ATT&CK tactics include:
  - **Discovery** (T1087): This tactic encompasses techniques that attackers utilize to gain knowledge about the target environment.
  - **Network Service Scanning** (T1018): This technique specifically refers to the enumeration of active hosts within a network segment using network utilities like `ping`.

  Primary data sources include:
  - Process creation logs from macOS systems to capture command line activity.
  - Network traffic logs that may corroborate ARP and ping operations executed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events to identify any instances of the `arp` and `ping` commands being executed, focusing on their arguments and the originating user context.
  - **Analyze Command-Line Arguments:** Investigate command-line parameters used in conjunction with the identified commands, especially looking for internal IP addresses which may indicate scanning activities.
  - **Correlate Network Traffic:** Check network traffic logs for spikes in ARP requests or ICMP ping requests that coincide with the detected process executions, to verify if the enumerated systems were indeed reachable.
  - **Identify Source of Activity:** Determine the user or system that initiated the commands and assess whether the behavior aligns with known roles and responsibilities, looking for possible unauthorized access or misconfiguration.

  ### Prioritization
  The alert is classified as informational due to its potential to indicate benign administrative activities. However, it should not be disregarded, as repeated enumeration attempts could signify a prelude to more malicious activities, warranting further investigation.

  ### Blind Spots and Assumptions
  This detection rule assumes that relevant logging is enabled on macOS systems for process creation events and includes complete command-line arguments. There may be gaps in detection for obfuscated or modified commands that accomplish similar enumeration objectives but do not match the specified patterns in the rule. Additionally, legitimate administrative tasks may generate false positives, thus requiring contextual awareness during investigations.

