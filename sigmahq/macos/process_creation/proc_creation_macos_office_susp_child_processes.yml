note: |
  ### Technical Context
  This detection rule identifies potentially malicious activity on macOS systems by monitoring for suspicious child processes initiated from legitimate Microsoft Office applications, such as Word or Excel. Attackers may abuse Office suite features, particularly executing macros that invoke malicious scripts or binaries. The objective is often to gain unauthorized access, exfiltrate data, or establish persistence on the victim's machine.

  In terms of MITRE ATT&CK framework relevance, this rule aligns with several tactics and techniques including:
  - **Execution (TA0002)**: Techniques used to run malicious scripts or commands.
  - **Persistence (TA0003)**: Malicious content within Office documents can create persistence through automated execution via macros.
  - **User Execution (T1204)**: Users inadvertently executing malicious macros in documents leads to attacks.

  The primary data sources for this detection are process creation logs from macOS, which detail any newly spawned processes and their parent processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the macOS process creation logs for any instances where known Office applications are the parent process of suspicious command-line tools such as `osascript`, `bash`, or `curl`.
  - **Examine Microsoft Office Document Activity**: Investigate any recently accessed Microsoft Office documents, particularly those that showed behavior consistent with macro execution or unusual modifications.
  - **Correlate with User Activity**: Check user activity logs and timeframes to determine if the execution of suspicious commands corresponds with user actions related to Office documents.
  - **Identify Anomalous Network Traffic**: If applicable, inspect network logs for unusual outbound connections or data exfiltration attempts from the systems where these suspicious processes initiated.

  ### Prioritization
  This alert holds a high severity level because successful exploitation through Office macros can allow attackers to execute arbitrary code with the permissions of the user, potentially leading to significant data breaches or system compromise in an enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic assumes that any legitimate usage of Office applications is constrained and does not genuinely require spawning the specified suspicious child processes. However, there may be gaps in logs due to certain preventative measures not being in place, such as proper user access controls or comprehensive logging for all process activations. Furthermore, if malicious actors use obfuscation techniques or benign processes, these may evade detection. For the alert to function accurately, complete process logging must be enabled on macOS systems, particularly focusing on process creation events.

