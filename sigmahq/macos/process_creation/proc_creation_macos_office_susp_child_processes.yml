note: |
  ### Technical Context

  This rule detects suspicious child processes spawned by Microsoft Office applications on MacOS, specifically looking for common command-line interpreters or scripting tools that may indicate the execution of malicious macros. The likely attacker objective is to execute arbitrary commands or scripts to gain persistence or exfiltrate data, leveraging the trust associated with Office documents. This detection aligns with MITRE ATT&CK tactic: Execution (TA0002) and techniques: User Execution (T1204.002) and Scripting (T1059.002).

  The primary telemetry source comes from MacOS process creation logs, specifically focusing on parental relationships between processes. If confirmed malicious, this behavior could lead to system compromise or data theft. However, this detection does NOT verify if the executed commands cause harm or if they are indeed tied to a malicious act; further analysis is needed to determine the intent.

  ### Investigation Steps

  - **Verify Parent Process:** Review the process creation log for Event IDs related to parent processes by checking logs from `/var/log/system.log` or using tools like `Console.app`. Confirm if the parent process is indeed one of the Microsoft Office applications mentioned.

  - **Identify Suspicious Child Processes:** Look for child processes in the system logs that match the specified patterns. Focus on processes like `/bash`, `/osascript`, or `/python`. Log entries should contain target command strings that signal potential malicious activity, such as executing base64 encoded scripts or unauthorized shell commands.

  - **Review Command Arguments:** Analyze the arguments passed to these child processes by inspecting the details in the logs. Malicious indicators might include commands utilizing `curl`, `wget`, or script files that perform network calls or file modifications, which typically do not occur in standard Office usage.

  - **Assess Legitimate Usage Patterns:** Determine if legitimate users frequently run scripts via Microsoft Office applications. Typical benign activity may involve automation via AppleScript or the exec command in protected environments, but lacking those specifics could indicate suspicious behavior.

  - **Check for Additional Artifact Creation:** Validate the presence of artifacts or legitimate files created by the process. Inspect `/tmp` or user directories for files with `.sh` or `.command` extensions created shortly after the child process ran, pointing to potential malicious activities.

  ### Prioritization

  This alert carries a high severity due to the potential impact on system integrity and data security if exploited, as well as the likelihood of misuse based on historical exploitation patterns. The nature of macro-based attacks in office suites makes these behavioral indicators relevant in detecting real threats.

  ### Blind Spots and Assumptions

  Malicious actors may employ evasion techniques, such as using encrypted scripts or obfuscating command arguments, which this rule may not catch. Reliable detection depends on having comprehensive logging enabled and properly configured for process creation on MacOS. Common legitimate tasks involving automated scripts or macros in enterprise environments may trigger this alert, necessitating careful interpretation of the context. Additionally, companion detections focusing on application-hitting persistence techniques, such as monitoring for unusual scheduled tasks or changes to document files, strengthen overall coverage.

