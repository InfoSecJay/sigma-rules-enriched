title: Payload Decoded and Decrypted via Built-in Utilities
id: 234dc5df-40b5-49d1-bf53-0d44ce778eca
status: test
description: Detects when a built-in utility is used to decode and decrypt a 
  payload after a macOS disk image (DMG) is executed. Malware authors may 
  attempt to evade detection and trick users into executing malicious code by 
  encoding and encrypting their payload and placing it in a disk image file. 
  This behavior is consistent with adware or malware families such as Bundlore 
  and Shlayer.
references:
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-5d42c3d772e04f1e8d0eb60f5233bc79def1ea73105a2d8822f44164f77ef823
author: Tim Rauch (rule), Elastic (idea)
date: 2022-10-17
tags:
- attack.t1059
- attack.t1204
- attack.execution
- attack.t1140
- attack.defense-evasion
- attack.s0482
- attack.s0402
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/openssl'
    CommandLine|contains|all:
    - '/Volumes/'
    - 'enc'
    - '-base64'
    - ' -d '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the OpenSSL utility where a decoded and decrypted payload is being processed from a macOS disk image (DMG) file. The behavior typically indicates a potential adversary attempting to evade detection by using built-in tools to handle encoded payloads, potentially for the purpose of deploying malware or adware, such as those in the Bundlore or Shlayer families. The relevant MITRE ATT&CK tactics and techniques include Execution (T1204) and Defense Evasion (T1140).

  Primary telemetry sources include macOS process creation logs, specifically focused on events generated when a process uses the OpenSSL utility with specific command line arguments indicating decoding operations. If malicious, the impact could involve unauthorized data manipulation or system compromise. Notably, this detection does not independently confirm that malicious activity is occurring, as legitimate uses of OpenSSL for data processing might trigger the same rule.

  ### Investigation Steps

  - **Check process creation details:** Review macOS process creation logs for Event ID associated with `OpenSSL` executions. Focus on logs that contain the string `/Volumes/` along with decode parameters like `-base64` and `-d`.

  - **Validate the context of DMG execution:** Determine if the DMG file opened precedes the OpenSSL command execution. Look for logs relating to the mounting of DMG files and confirm the source and integrity of the DMG.

  - **Identify high-confidence malicious indicators:** Look for unusual user accounts invoking `OpenSSL` from `/Volumes/` locations, which could suggest exploitation of legitimate tools. Check user permissions and historical behavior for anomalies.

  - **Establish expected use cases for OpenSSL:** Verify if the usage pattern of OpenSSL correlates with documented scripts or workflows within the organization, which may include routine data processing by trusted applications.

  - **Correlate with network activity:** If applicable, investigate outbound network logs for unusual connection attempts or file transfers following the decoded payload execution, as these may reveal nefarious intent.

  ### Prioritization

  This alert is medium severity due to the potential impact on sensitive systems, particularly if OpenSSL is used maliciously to execute payloads. The likelihood of malicious abuse is notable, especially given that the behavior aligns with known tactics for evasion and exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative uses of OpenSSL or similar tooling in automated workflows. Ensure logging capabilities for process creations are configured correctly to cover all necessary telemetry. Potential legitimate activities may involve regular use of OpenSSL for file handling by IT personnel. A companion detection rule monitoring for unusual DMG mounts or unapproved usages of OpenSSL could enhance overall security coverage.

