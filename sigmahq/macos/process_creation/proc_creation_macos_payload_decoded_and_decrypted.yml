title: Payload Decoded and Decrypted via Built-in Utilities
id: 234dc5df-40b5-49d1-bf53-0d44ce778eca
status: test
description: Detects when a built-in utility is used to decode and decrypt a 
  payload after a macOS disk image (DMG) is executed. Malware authors may 
  attempt to evade detection and trick users into executing malicious code by 
  encoding and encrypting their payload and placing it in a disk image file. 
  This behavior is consistent with adware or malware families such as Bundlore 
  and Shlayer.
references:
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-5d42c3d772e04f1e8d0eb60f5233bc79def1ea73105a2d8822f44164f77ef823
author: Tim Rauch (rule), Elastic (idea)
date: 2022-10-17
tags:
- attack.stealth
- attack.t1059
- attack.t1204
- attack.execution
- attack.t1140
- attack.s0482
- attack.s0402
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/openssl'
    CommandLine|contains|all:
    - '/Volumes/'
    - 'enc'
    - '-base64'
    - ' -d '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the usage of the `openssl` utility on macOS systems for decoding and decrypting payloads after a disk image (DMG) is executed. The likely attacker objective is to conceal malicious content by encoding it, then executing it in a manner that evades traditional detection methods. The relevant MITRE ATT&CK tactics and techniques are Execution (T1204) and Command-Line Interface (T1059). Primary telemetry sources required include macOS process creation logs, specifically looking for `process_creation` events. If malicious, the activity could lead to unauthorized data exfiltration or system compromise. This detection does NOT confirm that the activity is malicious on its own, as benign uses of these commands may occur.

  ### Investigation Steps

  - **Check process creation logs:** Review macOS process creation logs (Event ID associated with process creation) for the use of `openssl` with CommandLine fields containing `/Volumes/`, `enc`, `-base64`, and `-d`. Document any legitimate uses associated with trusted software installations.

  - **Examine recent DMG file executions:** Identify DMG files that were executed prior to the `openssl` command. Check for unusual file paths or timestamps in the macOS system logs (such as Unified Logging), which can indicate suspicious activity.

  - **Identify command line parameters:** Analyze the specific CommandLine used in the `openssl` execution. Confirm that it involves decoding payloads, specifically with the presence of both `-base64` and `-d` arguments. This combination is a high-confidence malicious indicator.

  - **Review legitimate usage examples:** Search for common legitimate uses of `openssl` in your environment, such as generating certificates or encrypting files. Benchmark against these examples to understand what benign activity looks like.

  - **Correlate with system integrity reports:** Employ file integrity monitoring tools to check for unexpected file changes or creations in directories related to executed DMG files (e.g., `/Volumes/`, `/Users/<username>/Downloads/`). Look for recent file activity that aligns with the suspicious `openssl` command.

  ### Prioritization

  This alert has medium severity due to the potential for significant impacts on compromised macOS systems. The likelihood of malicious abuse is moderate, especially in environments where disk images are frequently executed. The behavior is often associated with known malware, suggesting a need for urgent response and investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments lacking sufficient logging configurations, such as not recording all process creations or CommandLine arguments on macOS. Some legitimate applications, such as software development kits or encryption tools, may trigger this alert as they also utilize `openssl`. A companion detection to reinforce coverage would involve identifying unusual network activity correlating with the execution of decoded payloads, such as unexpected outbound connections immediately following the use of `openssl`.

