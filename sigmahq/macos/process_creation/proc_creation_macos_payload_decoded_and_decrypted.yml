logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/openssl'
    CommandLine|contains|all:
    - '/Volumes/'
    - 'enc'
    - '-base64'
    - ' -d '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the use of built-in macOS utilities, specifically OpenSSL, to decode and decrypt payloads after executing a macOS disk image (DMG). Attackers may employ this technique to obfuscate malicious code and evade detection mechanisms, often aiming to deliver adware or other malware, like Bundlore and Shlayer. The relevant MITRE ATT&CK tactics and techniques include *Execution (T1059)* and *Defense Evasion (T1204)*.

  The primary telemetry source involved is macOS process creation logs, specifically looking for OpenSSL execution with command-line parameters involving decryption. If malicious, the security impact can be significant as it may lead to unauthorized access, data theft, or further malware deployment. Importantly, this detection does not confirm that a malicious activity occurred; legitimate use of OpenSSL for encryption/decryption may also trigger this alert.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine macOS Process Creation logs (Event ID 100) for OpenSSL (Image path ending in '/openssl'). Look for associated command-line arguments including '/Volumes/', 'enc', '-base64', and '-d'.

  - **Identify high-confidence malicious indicators:** Check if the OpenSSL command was executed with a known malicious DMG file path. Malicious activity often involves hardcoded paths or unusual file names. Compare with previously identified hashes or paths related to known malware.

  - **Assess known legitimate behaviors:** Determine whether the OpenSSL usage aligns with expected operations, such as legitimate developers using it for encryption projects. Validate whether it fits within established workflows or patterns in your organization.

  - **Cross-reference user context:** Identify the user account that executed the OpenSSL command. Investigate if this account has a history of executing potentially risky commands, and cross-check against user behavior analytics for anomalies.

  - **Monitor for post-execution activities:** Investigate if any additional processes spawned after the decoding, which may indicate further exploitation, such as execution of secondary payloads or network connections. Check for unusual outgoing connections correlating with the time of the event.

  ---

  ### Prioritization

  The alert severity is medium, as it involves process creation that may indicate malicious behavior on a macOS system. However, the likelihood of abuse is moderate, given legitimate uses for OpenSSL exist. If the system is sensitive or part of a critical infrastructure, it must be handled with higher urgency.

  ---

  ### Blind Spots and Assumptions

  There are limitations in detecting evasion techniques, as attackers may use legitimate tools and methods to encrypt/decrypt payloads, making it difficult to differentiate between benign and malicious uses. Reliable detection requires proper logging configuration for all macOS processes to ensure this alert is generated consistently. Additionally, legitimate software installations or IT maintenance tasks may trigger this alert. A companion detection rule focused on unusual process spawning or outbound network connections may strengthen coverage and provide holistic situational awareness.

