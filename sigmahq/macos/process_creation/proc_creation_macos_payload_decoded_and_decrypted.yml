title: Payload Decoded and Decrypted via Built-in Utilities
id: 234dc5df-40b5-49d1-bf53-0d44ce778eca
status: test
description: Detects when a built-in utility is used to decode and decrypt a payload
  after a macOS disk image (DMG) is executed. Malware authors may attempt to evade
  detection and trick users into executing malicious code by encoding and encrypting
  their payload and placing it in a disk image file. This behavior is consistent with
  adware or malware families such as Bundlore and Shlayer.
references:
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-5d42c3d772e04f1e8d0eb60f5233bc79def1ea73105a2d8822f44164f77ef823
author: Tim Rauch (rule), Elastic (idea)
date: 2022-10-17
tags:
- attack.t1059
- attack.t1204
- attack.execution
- attack.t1140
- attack.defense-evasion
- attack.s0482
- attack.s0402
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/openssl'
    CommandLine|contains|all:
    - '/Volumes/'
    - 'enc'
    - '-base64'
    - ' -d '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the use of built-in macOS utilities, specifically OpenSSL, to decode and decrypt a payload after executing a disk image file (DMG). Attackers may exploit this technique to conceal malicious payloads from detection by encoding or encrypting them, then enticing users to run the harmful code embedded within a disk image. This behavior is commonly associated with malware families such as Bundlore and Shlayer, which are known for using social engineering methods to trick users into executing malicious applications.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1059)**: The attacker executes a built-in utility to carry out actions on the system.
  - **User Execution (T1204)**: The execution of the DMG file often requires the user's action, targeting social engineering techniques.
  - **Defense Evasion (T1140)**: Using trusted system utilities to manipulate data and evade detection mechanisms aligns with this technique.

  Primary data sources for this detection include macOS process creation logs, which provide insight into executed commands, the command line arguments passed, and the utilities used.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for instances where the OpenSSL binary is invoked with command line arguments related to decoding and decryption, specifically looking for entries that include '/Volumes/', 'enc', and '-base64 -d'.

  - **Collect Disk Image Analysis**: Gather and analyze any DMG files executed at the same time as the detected command. Search for hidden or encoded payloads that may reflect malicious intent.

  - **Identify User Interaction**: Confirm the circumstances of the user interaction leading to the execution of the DMG file. Investigate any phishing campaigns or social engineering attempts that may have prompted the user to open the disk image.

  - **Examine Network Activity**: Check for any unexpected outgoing network connections from the affected endpoint shortly after executing the DMG file. Look for unusual traffic patterns or communications that could indicate command and control (C2) activity.

  ### Prioritization
  This alert warrants medium priority in an enterprise environment due to the potential for significant impact through user-executed malware delivery methods. Given that the execution of encoded or encrypted payloads can lead to data breaches or ransomware attacks, this detection highlights a crucial vector for investigation.

  ### Blind Spots and Assumptions
  This detection rule relies on the accurate logging of process creation events on macOS systems. Any misconfiguration or lack of data collection in this area may result in a missed detection. Additionally, it assumes that malicious payloads will consistently utilize OpenSSL in this manner, which may not encompass all evasion techniques. As with all detections, monitoring and tuning may be necessary to reduce false positives stemming from legitimate use cases of the OpenSSL utility.

