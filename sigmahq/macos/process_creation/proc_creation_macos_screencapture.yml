note: |
  ### Technical Context

  The Sigma rule detects the execution of the macOS `screencapture` utility, which can be used by an attacker to capture screenshots of the desktop. The likely attacker objective is to gather sensitive information, such as credentials, compromised documents, or proprietary data visible on the screen. This behavior fits within the MITRE ATT&CK framework under the tactic "Collection" (ID: T1113).

  The primary telemetry source is macOS process creation logs, specifically targeting the `Image` field for the path `/usr/sbin/screencapture`. If malicious, the execution of this utility could lead to data exfiltration or support further foothold actions within the target environment. However, this detection does NOT confirm malicious intent on its own, as legitimate user actions, such as taking screenshots for documentation or sharing purposes, can also trigger the rule.

  ### Investigation Steps

  - **Evaluate recent process creation events:** Check for macOS process creation logs (Event ID for process creation) for the `screencapture` command. Analyze timestamp and associated user accounts for any suspicious patterns or triggering conditions.

  - **Correlate with user activity logs:** Review logs showing user activity around the time of the alert (e.g., `Console` logs or user access logs). Look for commands or applications that indicate whether the user was engaged or experiencing unusual activity that could correlate with the screenshot capture.

  - **Identify host role and critical systems:** Determine if the host executing `screencapture` is a critical system (e.g., finance department workstation vs. general office PC). This will help prioritize the investigation based on potential impact.

  - **Search for abnormal file creation patterns:** Investigate if the screenshots are being saved to unexpected directories or if there are accompanying actions like file exfiltration (e.g., via email or cloud storage). Verify file existence in common screenshot directories such as `/Users/[username]/Desktop/` or `/Users/[username]/Pictures/`.

  - **Check for known benign usage patterns:** Review the user's normal screenshot-taking behavior and associated activities (e.g., documentation or presentations). Look for consistent user patterns with the execution of `screencapture` that suggest legitimate use.

  - **Identify high-confidence malicious behavior indicators:** If `screencapture` is executed by a non-interactive user or in conjunction with known malicious processes (e.g., a suspected malware process), flag this as a high-confidence indicator of malicious behavior for further escalation.

  ### Prioritization

  This alert is of low severity as the execution of `screencapture` can frequently occur through legitimate user interaction. However, if detected on critical assets or alongside other suspicious activities, the likelihood of malicious use increases, warranting a closer examination.

  ### Blind Spots and Assumptions

  Detection may be limited by prior configuration of process logging on macOS. Legitimate activities, such as legitimate users taking screenshots in valid work scenarios (e.g., presentations or document reviews), can also trigger the alert. Related detections targeting abnormal file access or data exfiltration attempts (such as `T1041 Exfiltration Over Command and Control Channel`) can provide additional context and strengthen coverage against this behavior.

