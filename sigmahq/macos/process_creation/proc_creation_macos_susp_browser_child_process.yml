title: Suspicious Browser Child Process - MacOS
id: 0250638a-2b28-4541-86fc-ea4c558fa0c6
status: test
description: Detects suspicious child processes spawned from browsers. This could
  be a result of a potential web browser exploitation.
references:
- https://fr.slideshare.net/codeblue_jp/cb19-recent-apt-attack-on-crypto-exchange-employees-by-heungsoo-kang
- https://github.com/elastic/detection-rules/blob/4312d8c9583be524578a14fe6295c3370b9a9307/rules/macos/execution_initial_access_suspicious_browser_childproc.toml
author: Sohan G (D4rkCiph3r)
date: 2023-04-05
tags:
- attack.initial-access
- attack.execution
- attack.t1189
- attack.t1203
- attack.t1059
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    ParentImage|contains:
    - 'com.apple.WebKit.WebContent'
    - 'firefox'
    - 'Google Chrome Helper'
    - 'Google Chrome'
    - 'Microsoft Edge'
    - 'Opera'
    - 'Safari'
    - 'Tor Browser'
    Image|endswith:
    - '/bash'
    - '/curl'
    - '/dash'
    - '/ksh'
    - '/osascript'
    - '/perl'
    - '/php'
    - '/pwsh'
    - '/python'
    - '/sh'
    - '/tcsh'
    - '/wget'
    - '/zsh'
  filter_main_generic:
    CommandLine|contains: '--defaults-torrc'     # Informs tor to use default config file
  filter_main_ms_autoupdate:
    CommandLine|contains: '/Library/Application Support/Microsoft/MAU*/Microsoft AutoUpdate.app/Contents/MacOS/msupdate'     # Microsoft AutoUpdate utility
  filter_main_chrome:
    ParentImage|contains:
    - 'Google Chrome Helper'
    - 'Google Chrome'
    CommandLine|contains:
    - '/Volumes/Google Chrome/Google Chrome.app/Contents/Frameworks/*/Resources/install.sh'         # Install the Google Chrome browser
    - '/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/*/Resources/keystone_promote_preflight.sh'         # Updates the Google Chrome branding configuration files
    - '/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/*/Resources/keystone_promote_postflight.sh'         # Script that performs the post-installation tasks
  filter_main_ms_edge:
    ParentImage|contains: 'Microsoft Edge'
    CommandLine|contains:
    - 'IOPlatformExpertDevice'         # Retrieves the IOPlatformUUID (parent process - Microsoft Edge)
    - 'hw.model'         # Retrieves model name of the computer's hardware (parent process - Microsoft Edge)
  filter_main_chromerecovery:
    ParentImage|contains:
    - 'Google Chrome Helper'
    - 'Google Chrome'
    CommandLine|contains|all:
    - '/Users/'
    - '/Library/Application Support/Google/Chrome/recovery/'
    - '/ChromeRecovery'
  filter_optional_null:
        # Aoids alerting for the events which do not have command-line arguments
    CommandLine:
  filter_optional_empty:
        # Aoids alerting for the events which do not have command-line arguments
    CommandLine: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate browser install, update and recovery scripts
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious child processes that are spawned from various web browsers on macOS systems, such as Safari, Chrome, and Firefox. When a browser is exploited, malicious code can execute and spawn processes that could facilitate further attacks, such as data exfiltration or lateral movement within the environment. Attackers often leverage malicious child processes to execute harmful scripts or command-line utilities without the user's consent.

  The relevant MITRE ATT&CK tactics for this detection include **Initial Access** (TA0001) and **Execution** (TA0002). Specific techniques associated with this rule are **Exploitation for Client Execution** (T1189) and **Execution through Command-Line Interface** (T1059). The concerns arise from any unexpected child process creation stemming from a browser, particularly if the commands or scripts executed by those processes do not align with normal operational behavior.

  Primary data sources for detection include process creation events from macOS systems, which log details about parent processes and their child processes, including command lines used to initiate those child processes. This information is crucial in identifying potentially malicious activities stemming from legitimate browser applications.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for instances where browser parent processes spawn child processes, particularly those exhibiting unusual command-line arguments or invoking shell scripts.

  - **Analyze Command-Line Arguments:** Inspect the command-line parameters of suspicious child processes for indicators of exploitation techniques, such as calls to known interpreters or uncommon flags that suggest malicious intent.

  - **Check for Legitimate Usage Patterns:** Correlate the suspicious child processes with operational tasks to determine whether they align with expected usage patterns for browser operations, such as legitimate updates or installations.

  - **Investigate Associated Network Activity:** Monitor network traffic that corresponds with the identified processes to identify any outbound connections that could indicate data exfiltration or communication with Command and Control (C2) servers.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of browser exploits that can lead to significant data breaches or system compromise. The likelihood of encountering such exploitation tactics in a corporate environment, especially with focused adversaries, necessitates timely investigations.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage, particularly if logs are not retained long enough to identify recurring patterns or if process creation logging is disabled. The detection logic assumes that standard browsers are installed and running in the environment; it may not cover scenarios involving lesser-known alternative browsers. Additionally, required logs include detailed process creation logs capturing command lines and parent-child process relationships for accurate detection.

