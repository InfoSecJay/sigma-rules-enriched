title: Suspicious Browser Child Process - MacOS
id: 0250638a-2b28-4541-86fc-ea4c558fa0c6
status: test
description: Detects suspicious child processes spawned from browsers. This 
  could be a result of a potential web browser exploitation.
references:
- https://fr.slideshare.net/codeblue_jp/cb19-recent-apt-attack-on-crypto-exchange-employees-by-heungsoo-kang
- https://github.com/elastic/detection-rules/blob/4312d8c9583be524578a14fe6295c3370b9a9307/rules/macos/execution_initial_access_suspicious_browser_childproc.toml
author: Sohan G (D4rkCiph3r)
date: 2023-04-05
tags:
- attack.initial-access
- attack.execution
- attack.t1189
- attack.t1203
- attack.t1059
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    ParentImage|contains:
    - 'com.apple.WebKit.WebContent'
    - 'firefox'
    - 'Google Chrome Helper'
    - 'Google Chrome'
    - 'Microsoft Edge'
    - 'Opera'
    - 'Safari'
    - 'Tor Browser'
    Image|endswith:
    - '/bash'
    - '/curl'
    - '/dash'
    - '/ksh'
    - '/osascript'
    - '/perl'
    - '/php'
    - '/pwsh'
    - '/python'
    - '/sh'
    - '/tcsh'
    - '/wget'
    - '/zsh'
  filter_main_generic:
    CommandLine|contains: '--defaults-torrc'     # Informs tor to use default config file
  filter_main_ms_autoupdate:
    CommandLine|contains: '/Library/Application Support/Microsoft/MAU*/Microsoft AutoUpdate.app/Contents/MacOS/msupdate'     # Microsoft AutoUpdate utility
  filter_main_chrome:
    ParentImage|contains:
    - 'Google Chrome Helper'
    - 'Google Chrome'
    CommandLine|contains:
    - '/Volumes/Google Chrome/Google Chrome.app/Contents/Frameworks/*/Resources/install.sh'         # Install the Google Chrome browser
    - '/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/*/Resources/keystone_promote_preflight.sh'         # Updates the Google Chrome branding configuration files
    - '/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/*/Resources/keystone_promote_postflight.sh'         # Script that performs the post-installation tasks
  filter_main_ms_edge:
    ParentImage|contains: 'Microsoft Edge'
    CommandLine|contains:
    - 'IOPlatformExpertDevice'         # Retrieves the IOPlatformUUID (parent process - Microsoft Edge)
    - 'hw.model'         # Retrieves model name of the computer's hardware (parent process - Microsoft Edge)
  filter_main_chromerecovery:
    ParentImage|contains:
    - 'Google Chrome Helper'
    - 'Google Chrome'
    CommandLine|contains|all:
    - '/Users/'
    - '/Library/Application Support/Google/Chrome/recovery/'
    - '/ChromeRecovery'
  filter_optional_null:
        # Aoids alerting for the events which do not have command-line arguments
    CommandLine:
  filter_optional_empty:
        # Aoids alerting for the events which do not have command-line arguments
    CommandLine: ''
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate browser install, update and recovery scripts
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious child processes from known web browsers on macOS, indicating potential exploitation attempts. Attackers may target browsers to execute malicious scripts or commands, leveraging vulnerabilities within these applications. The primary MITRE ATT&CK tactics involved are **Initial Access (TA0001)** and **Execution (TA0002)**, specifically techniques **T1189 - Drive-by Compromise** and **T1203 - Exploitation for Client Execution**.

  The primary telemetry sources are macOS process creation logs (e.g., via `syslog` or `auditd`) showing event data for child processes spawned from browser parent processes. If malicious, this activity can lead to unauthorized access, data exfiltration, or the deployment of additional malware. However, this detection does NOT confirm malicious intent on its own, as legitimate browser operations may exhibit similar behaviors.

  ---

  ### Investigation Steps

  - **Examine process creation events:** Check macOS process creation logs (Event ID via `system.log` or `auditd`). Look for events where the parent process is a web browser and the child process matches the suspicious commands listed.

  - **Analyze command line arguments:** Review command line arguments of identified suspicious child processes. Commands containing `--defaults-torrc`, for example, indicate potential malicious use of Tor, suggesting an attempt to anonymize network activity.

  - **Confirm legitimate browser operations:** Validate if the alerting process relates to an expected browser update or installation. For instance, processes containing paths like `/Applications/Google Chrome.app/Contents/Frameworks/*/Resources/keystone_promote_*` indicate standard update tasks.

  - **Identify high-confidence malicious indicators:** Look for child processes created with commands like `/bash`, `/curl`, or `/python` executing from unexpected locations. For example, a process executing `/usr/bin/bash` spawned from a browser could indicate exploitation.

  - **Check for known malware signatures:** Use endpoint protection solutions to cross-reference any identified processes against known malware signatures or behaviors related to web browser exploitation.

  - **Assess system impact:** Determine the role and criticality of the affected host. For example, a browser exploit on a high-privilege machine may represent a greater risk than on a standard user workstation.

  ---

  ### Prioritization

  This alert carries medium severity in an enterprise context. Browser child processes could easily be exploited to initiate further attacks and exfiltrate sensitive data. While the likelihood of misuse is high given the prevalence of browser vulnerabilities, legitimate software update processes can also trigger this alert.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive process logging configurations on endpoints or potential process obfuscation techniques used by attackers. Legitimate activities such as browser installations and updates may also trigger this alert. To enhance detection, it’s prudent to employ complementary rules that monitor for unusual outbound network traffic arising from newly spawned processes.

