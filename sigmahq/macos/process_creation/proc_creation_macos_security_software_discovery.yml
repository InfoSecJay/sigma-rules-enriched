title: Security Software Discovery - MacOs
id: 0ed75b9c-c73b-424d-9e7d-496cd565fbe0
status: test
description: Detects usage of system utilities (only grep for now) to discover security
  software discovery
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-19
modified: 2022-11-27
tags:
- attack.discovery
- attack.t1518.001
logsource:
  category: process_creation
  product: macos
detection:
  image:
    Image: '/usr/bin/grep'
  selection_cli_1:
    CommandLine|contains:
    - 'nessusd'                # nessus vulnerability scanner
    - 'santad'                 # google santa
    - 'CbDefense'              # carbon black
    - 'falcond'                # crowdstrike falcon
    - 'td-agent'               # fluentd log shipper
    - 'packetbeat'             # elastic network logger/shipper
    - 'filebeat'               # elastic log file shipper
    - 'auditbeat'              # elastic auditing agent/log shipper
    - 'osqueryd'               # facebook osquery
    - 'BlockBlock'             # Objective-See persistence locations watcher/blocker
    - 'LuLu'                   # Objective-See firewall management utility
  selection_cli_2:   # Objective Development Software firewall management utility
    CommandLine|contains|all:
    - 'Little'
    - 'Snitch'
  condition: image and 1 of selection_cli_*
falsepositives:
- Legitimate activities
level: medium
note: |
  ### Technical Context
  This Sigma rule detects the use of the `grep` command on macOS systems to search for specific security software in system files. Attackers often utilize such discovery techniques to identify security and monitoring tools that could impede their activities, thus allowing them to evade detection or prepare for further actions. The threat scenario primarily involves threat actors conducting reconnaissance in an environment to gain insights into the security posture before executing their intended malicious actions.

  The relevant MITRE ATT&CK tactics encompassed by this detection are **Discovery** (TA0007) and specifically the technique **System Discovery** (T1518.001). The purpose of this technique is for attackers to identify installed security solutions like endpoint protection or network monitoring tools, which can provide insight into potential vulnerabilities or avenues for evasion. The primary data source for this rule is **process creation logs** on macOS, which capture command-line execution and can be analyzed for unusual usage patterns along with suspicious command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs from the process creation category on macOS to identify instances of the `grep` command being executed along with the specified command-line arguments targeting security software.
  - **Correlate with Authorized Software:** Establish a baseline of legitimate security software in your environment and correlate detected `grep` commands with this list to identify potentially malicious reconnaissance activity.
  - **Inspect User Context:** Determine the user context under which the `grep` command was executed to assess whether it was a legitimate user or potentially a compromised account performing reconnaissance.
  - **Assess Surrounding Activity:** Investigate other activities that occurred around the same time as the detected `grep` command to identify any related suspicious behavior or patterns, such as unusual network connections or file access.

  ### Prioritization
  This alert has medium severity due to the potential for attackers utilizing discovery techniques to gather information on security software, which could precede more serious attacks, such as data breaches, lateral movement, or other malicious activities.

  ### Blind Spots and Assumptions
  The detection logic may not catch instances where the `grep` command is run with obfuscation techniques, such as altered syntax, which attackers may employ to evade detection. It assumes that the specified tools are part of the environment and that command-line parameters are logged correctly by the system. This rule requires comprehensive process creation logging enabled and configured on macOS systems to function effectively, and gaps may exist if logging is incomplete or disabled.

