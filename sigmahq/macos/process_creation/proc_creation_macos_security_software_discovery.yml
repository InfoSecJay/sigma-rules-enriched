title: Security Software Discovery - MacOs
id: 0ed75b9c-c73b-424d-9e7d-496cd565fbe0
status: test
description: Detects usage of system utilities (only grep for now) to discover 
  security software discovery
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1518.001/T1518.001.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-19
modified: 2022-11-27
tags:
- attack.discovery
- attack.t1518.001
logsource:
  category: process_creation
  product: macos
detection:
  image:
    Image: '/usr/bin/grep'
  selection_cli_1:
    CommandLine|contains:
    - 'nessusd'                # nessus vulnerability scanner
    - 'santad'                 # google santa
    - 'CbDefense'              # carbon black
    - 'falcond'                # crowdstrike falcon
    - 'td-agent'               # fluentd log shipper
    - 'packetbeat'             # elastic network logger/shipper
    - 'filebeat'               # elastic log file shipper
    - 'auditbeat'              # elastic auditing agent/log shipper
    - 'osqueryd'               # facebook osquery
    - 'BlockBlock'             # Objective-See persistence locations watcher/blocker
    - 'LuLu'                   # Objective-See firewall management utility
  selection_cli_2:   # Objective Development Software firewall management utility
    CommandLine|contains|all:
    - 'Little'
    - 'Snitch'
  condition: image and 1 of selection_cli_*
falsepositives:
- Legitimate activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the `grep` system utility on macOS systems to search for the presence of specific security software. The likely attacker objective is to identify security measures within the environment, which may aid in planning subsequent attacks or exploitation attempts. This behavior is associated with the MITRE ATT&CK technique T1518.001 (Software Discovery). The primary telemetry source is process creation logs, specifically macOS system logs that record executed commands. If malicious, this activity can indicate reconnaissance efforts aimed at bypassing or disabling security controls. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative or security assessments may similarly conduct this behavior.

  ### Investigation Steps

  - **Verify process creation events:** Review macOS process creation logs (Event ID 10) for instances of `/usr/bin/grep` running commands that include security software names. Check fields like `CommandLine` for the presence of specific software terms listed in the rule.

  - **Identify legitimate usage:** Confirm whether grep usage is associated with routine system checks or maintenance by mapping results against known scheduled jobs or IT operations that involve security tool assessments.

  - **Examine network activity:** Investigate outbound connections from the host to external IP addresses during the time of the alert (using netstat or system logs). Malicious behavior often correlates with unexpected outbound connections.

  - **Look for related process behavior:** Cross-reference additional process creation logs (Event ID 10) to find parent-child relationships. Malicious processes may spawn from unusual parent processes or exhibit suspicious behavior immediately after the grep command was invoked.

  - **Assess asset criticality:** Evaluate the affected system’s role within the organization. A grep command run on an endpoint identified as critical could indicate a higher level of concern compared to similar activity on a non-critical or isolated system.

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on security posture if an attacker successfully identifies and targets security software. While the likelihood of malicious intent exists, legitimate administrative practices may trigger similar behavior.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete application logging or misconfigured logging settings, which can lead to missed instances of `grep` usage. The normal behavior could include system audits by administrators, hence resulting in false positives. A related detection to consider is monitoring for abnormal command execution patterns that look for `curl` or `wget`, which may indicate file retrieval following software discovery.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
