note: |
  ### Technical Context

  This rule detects attempts to enable the root account on macOS systems using the `dsenableroot` command. The likely attacker objective is to escalate privileges, allowing for broader access and control over the system, which can facilitate further attacks or data exfiltration. Relevant MITRE ATT&CK tactics include "Privilege Escalation" (TA0004) and the technique "Valid Accounts" (T1078.003).

  The primary telemetry source for this detection is macOS process creation logs. Specifically, it monitors events related to the execution of `dsenableroot`. If malicious, enabling the root account compromises system security and can lead to unauthorized access. This detection does NOT confirm malicious intent on its own, as legitimate administrators may also enable the root account for valid reasons.

  ### Investigation Steps

  - **Check process creation logs:** Verify execution of `dsenableroot` via macOS process creation logs (Event ID: 10). Record the user who executed this command and the associated timestamp.

  - **Review command line arguments:** Assess the command line parameters used with `dsenableroot`. Pay special attention to instances where `-d` is included, indicating potential misuse of the command for stealthy actions.

  - **Validate user context:** Determine if the user executing `dsenableroot` has legitimate administrative credentials. Review user roles and policies within the organization—operations by standard user accounts are suspicious.

  - **Look for additional artifacts:** Inspect for any subsequent actions by the root account after it has been enabled. This includes monitoring file changes or creation (e.g., system files being altered) that typically follow privilege escalation.

  - **Recognize expected usage patterns:** Identify and document any legitimate administrative activity involving `dsenableroot` in your environment, noting the usual users and the circumstances under which they utilize this tool.

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential risk of unauthorized privilege escalation on critical macOS systems. While the technique is weaponized in targeted attacks, it can also be executed during legitimate administrative tasks, necessitating a thorough investigation.

  ### Blind Spots and Assumptions

  There are limitations in detecting this activity since skilled attackers may use alternative methods or scripts to enable the root account that do not utilize `dsenableroot`. The effective logging of process creation and audit trails needs to be verified in macOS configurations to ensure coverage. Legitimate scenarios such as regular system maintenance by IT personnel can trigger this alert. Related detection for tracking other privilege escalation techniques, such as unauthorized `sudo` commands, can enhance overall monitoring capabilities.

