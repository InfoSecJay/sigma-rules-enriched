level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to enable the root account on macOS systems via the `dsenableroot` command. The likely objective of the attacker is to escalate privileges, facilitating unauthorized access or persistence on the system. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation (T1068) and technique T1078.003 (Domain Accounts).

  The primary telemetry sources for this detection are macOS process creation logs, particularly focusing on `Security Event ID 4688` for process creation events. If the process is executed with malicious intent, it can allow an adversary unrestricted control over the system. Importantly, this detection does NOT confirm that the root account has been successfully enabled or that the activity was malicious on its own, as benign administrative tasks may also attempt to enable the root account.

  ### Investigation Steps

  - **Review process creation logs:** Analyze macOS logs for `Event ID 4688` showing `dsenableroot` in the command line (CommandLine field), focusing on execution by non-admin users as a potential indicator of malicious intent.
  - **Identify command line arguments:** Check if the `CommandLine` field contains `-d`; this indicates a disable operation that could be used to evade detection by an unsuspecting admin.
  - **Assess user role and privilege:** Determine if the user executing `dsenableroot` is a regular user without administrative rights, which could indicate unauthorized privilege escalation attempts.
  - **Check for subsequent root account activity:** If the alert has triggered, look for logs that show the use of the root account (e.g., process creation events by `root`, Event ID 4688) soon after this command, as this may indicate successful privilege escalation.
  - **Document legitimate administrative actions:** Understand that legitimate admin users may run `dsenableroot` for valid purposes; therefore, review the context of the execution, such as user ID, timing, and organization policies regarding root account enablement.
  - **Correlate with historical access logs:** Review the `/var/log/system.log` and any security logs to check for historical commands or attempts to enable the root account prior to the alert, which may indicate an ongoing attack series.

  ### Prioritization

  This alert should be prioritized as medium severity. The impact could be significant if the root account is enabled on critical systems, as it would provide an adversary full system access. Although this behavior is less common in enterprise environments, it is a clear indicator of potential privilege escalation that various threat actors may employ.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate administrative actions during routine maintenance or configuration changes. Comprehensive logging for process creation and relevant user actions is necessary for reliable detection; ensure that audit logging is correctly configured on macOS systems. Activities such as administrative tasks to enable the root account by legitimate personnel might falsely trigger this alert. A companion detection rule focusing on unauthorized access attempts using the root account can enhance overall detection capabilities.

