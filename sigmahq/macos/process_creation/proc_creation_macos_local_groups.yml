logsource:
  category: process_creation
  product: macos
detection:
  selection_1:
    Image|endswith: '/dscacheutil'
    CommandLine|contains|all:
    - '-q'
    - 'group'
  selection_2:
    Image|endswith: '/cat'
    CommandLine|contains: '/etc/group'
  selection_3:
    Image|endswith: '/dscl'
    CommandLine|contains|all:
    - '-list'
    - '/groups'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: informational
note: |
  ### Technical Context
  This detection rule identifies potential enumeration of local system groups on macOS systems. Attackers often seek to gather information about local users and groups to identify accounts that may have elevated privileges or are part of administrative groups, which could be leveraged for lateral movement, privilege escalation, or persistence. The ability to extract group information can aid attackers in mapping the system's structure, determining access rights, and planning further actions against a target environment.

  The relevant MITRE ATT&CK techniques for this behavior fall under the "Discovery" tactic, specifically technique T1069.001, which pertains to enumerating local groups. Attackers employing these techniques typically aim to enhance their understanding of the system and the potential avenues for further exploitation or lateral movement.

  The primary telemetry sources that can provide valuable insights into this activity include process creation events, which log the execution of commands along with their parameters. Monitoring these logs can help detect when commands associated with group enumeration are executed, signaling potential malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs from macOS systems to identify any instances of the `dscacheutil`, `cat`, or `dscl` commands being executed with parameters related to group enumeration. Focus on the specific command-line arguments outlined in the detection conditions.

  - **Correlate with User Accounts:** Cross-reference any detected activity with the accounts executing the commands. Determine if these accounts should have legitimate reasons for performing local group enumeration.

  - **Analyze Contextual Activity:** Look for any suspicious behavior preceding or following the group enumeration commands. This may include unusual login times, unexpected access to sensitive directories, or commands indicative of post-exploitation activity.

  - **Check for Legitimate Administration Tasks:** Differentiate between suspected malicious activity and legitimate administrative actions. Investigate the roles of users to ensure that the observed behavior aligns with their expected operational practices.

  ### Prioritization
  The severity of this alert is deemed informational, as local group enumeration can be conducted for legitimate administrative tasks; however, its occurrence may also indicate a potential reconnaissance step by an unauthorized user. Monitoring is essential to distinguish between benign and malicious activity.

  ### Blind Spots and Assumptions
  This detection may not capture all methods of local group enumeration since attackers could use other tools or commands. The detection logic assumes that all instances of the identified commands are malicious, which may not account for legitimate administrative activities. For this rule to function effectively, the organization must ensure that process creation logs are enabled and that they capture comprehensive command-line parameter data on macOS systems.

