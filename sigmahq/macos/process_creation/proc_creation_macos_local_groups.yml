logsource:
  category: process_creation
  product: macos
detection:
  selection_1:
    Image|endswith: '/dscacheutil'
    CommandLine|contains|all:
    - '-q'
    - 'group'
  selection_2:
    Image|endswith: '/cat'
    CommandLine|contains: '/etc/group'
  selection_3:
    Image|endswith: '/dscl'
    CommandLine|contains|all:
    - '-list'
    - '/groups'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: informational
note: |
  ### Technical Context

  This Sigma rule detects the enumeration of local system groups on macOS using several commands such as `dscacheutil`, `cat`, and `dscl`. The likely attacker objective is to identify potential targets for privilege escalation or lateral movement, as knowing local group memberships can reveal which accounts have elevated permissions. This behavior aligns with the MITRE ATT&CK technique "Group Membership Discovery" (T1069.001).

  The primary telemetry sources are process creation logs on macOS, specifically focusing on command execution via `dscacheutil`, `cat`, and `dscl`. If utilized maliciously, this action can lead to enhanced access or exploitation of user accounts. Importantly, this detection does NOT confirm malicious intent on its own, as these commands may be executed during legitimate administrative tasks.

  ### Investigation Steps

  - **Review Process Creation Logs:** Check for macOS Security Event log types (Event ID 100) indicating process creation for `dscacheutil`, `cat`, or `dscl`, focusing on timestamps and user context.

  - **Analyze Command-Line Arguments:** Look for specific command line arguments used with detected processes. Malicious activity is more likely if you see `dscacheutil -q group` or `dscl -list /groups`.

  - **Identify Legitimate Use Cases:** Cross-reference the timestamps with known administrative maintenance windows and user activity. Legitimate group enumeration should align with scheduled tasks or approved administrative activities.

  - **Verify User Context:** Determine if the user running the commands has administrative privileges or is internal to the organization. Regular users initiating these actions could indicate unauthorized activity.

  - **Investigate Network Connections:** Check if there’s any unusual outbound traffic or connections from the host after the discovery commands were executed. Use network logs to identify external communication that may correlate with the enumeration.

  - **Document High-Confidence Indicators:** Mark users executing multiple enumeration commands within short time frames as suspicious. If these commands lead to privilege escalation commands (like adding users to menus), this is a high-confidence malicious indicator.

  ### Prioritization

  This alert should be categorized as informational but worthy of review due to the potential impact if used maliciously on critical systems. While group enumeration itself is relatively common, its exploitation makes it a concern; therefore, analysts should assess the context of execution to understand the risk.

  ### Blind Spots and Assumptions

  Detection may be limited by the visibility of logging configurations on macOS. Commands like `dscacheutil` or `dscl` can be used legitimately by administrators, causing potential false positives. Ensure that process creation logging is configured correctly for comprehensive visibility. Companion detections and logs related to privilege escalation (e.g., `Security Event ID 4688` for group changes) could strengthen coverage against potential abuse of gathered information.

