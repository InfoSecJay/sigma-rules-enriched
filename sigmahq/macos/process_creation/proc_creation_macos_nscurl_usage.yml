note: |
  ### Technical Context

  This rule detects the execution of the `nscurl` utility in macOS to download files, which may indicate potential data exfiltration or lateral movement by an adversary. The typical attacker objective includes downloading malicious payloads or sensitive data from target systems without raising immediate suspicion. This behavior is relevant to the MITRE ATT&CK tactic **Command and Control** (TA0011), specifically technique **Exfiltration Over Command and Control Channel** (T1105).

  Primary telemetry sources include macOS process creation logs, specifically monitoring for `nscurl` invoked with options typically used for downloading files. Malicious activity could lead to unauthorized data exfiltration or the execution of further attacks, significantly impacting the organization's security posture. Importantly, this detection does NOT confirm that the downloaded content is malicious; it merely indicates that a file download attempt occurred using `nscurl`.

  ### Investigation Steps

  - **Investigate the command line arguments used:** Review process creation logs (Process ID, Event ID) related to `nscurl`, checking the CommandLine field for flags such as `--download` or `--output`. This helps identify if the command parameters suggest a suspicious context.

  - **Check for unauthorized file paths:** Analyze the file paths indicated in the CommandLine logs for possible malicious destinations, particularly any references to unusual or non-standard directories.

  - **Confirm legitimate use cases:** Compare `nscurl` executions against known organizational policies or documentation. Normal usage may involve downloading system updates or application patches explicitly listed by administrators.

  - **Identify high-confidence malicious indicators:** Examine related network connections originating from the host (e.g., DNS queries or outbound HTTP requests) to known malicious IPs or domains, corroborated with Web Proxy or Network Traffic logs.

  - **Assess any scheduled tasks or scripts:** Review any launch agents or cron jobs that might invoke `nscurl` as part of a larger malicious framework, ensuring that no repeated executions appear without legitimate justification.

  ### Prioritization

  This alert has medium severity due to the potential risk of unauthorized file downloads impacting sensitive information or system integrity. Although not all `nscurl` executions are malicious, the likelihood of misuse in environments lacking stringent controls can lead to significant security incidents. This behavior is not commonly weaponized but warrants closer examination when observed.

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative uses of `nscurl`, especially if misconfigurations in logging occur. Required logs include detailed process creation logs and any relevant network activity logs to ensure comprehensive visibility. Certain legitimate applications might also utilize `nscurl` for updating or retrieving data. Monitoring for related alerts, such as unusual outbound transfers or other file download patterns, can enhance detection capabilities and provide context for this behavior.

