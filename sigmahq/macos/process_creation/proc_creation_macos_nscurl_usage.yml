note: |
  ### Technical Context
  This rule detects the execution of the `nscurl` utility on macOS systems when it is used to download files. `nscurl` is a command-line tool that can be used for making web requests, similar to `curl`, but with enhanced capabilities, especially focused on debugging App Transport Security (ATS) issues. Attackers may leverage this tool to download malicious payloads or exfiltrate data without triggering conventional security controls. The detection of such activity is critical in identifying potential command-and-control (C2) or exfiltration behaviors that could indicate a compromise.

  The likely attacker objectives when using `nscurl` include stealthy data theft or the downloading of additional malicious tools to further compromise the system. The rule is relevant to the MITRE ATT&CK techniques for Defense Evasion (T1560) and Command and Control (T1105), as attackers may attempt to blend in with legitimate traffic while executing malicious commands. The primary data sources for this detection are process creation logs, which will provide insights into the commands being executed and the context around their execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation events on affected macOS systems to identify any instances of `nscurl` being executed, paying close attention to the provided command line arguments.
  - **Analyze Suspicious Downloads**: Investigate the files that were downloaded using `nscurl`. Check the file paths and types to see if any potentially malicious content was retrieved.
  - **Cross-reference System Activity**: Correlate the timestamps of `nscurl` execution with other system activities, such as unusual outbound network connections or significant user account activity, to establish context.
  - **Check for Other Indicators**: Look for other indicators of compromise, such as the presence of known malicious binaries or unusual user behavior that may correspond with the use of `nscurl`.

  ### Prioritization
  The severity of this alert is medium because, while the legitimate use of `nscurl` exists, its capability to facilitate command-and-control communications poses a significant risk. The likelihood of an attack leveraging this tool increases if it is observed on endpoints that normally do not use it.

  ### Blind Spots and Assumptions
  This detection logic may miss instances of `nscurl` executed with obfuscated command line arguments or other command-line utilities that perform similar functions without triggering the alert. It assumes that all instances of `nscurl` usage are malicious, which may not account for legitimate administrative tasks. The successful detection of this event relies on having detailed process creation logs configured to capture sufficient data for analysis.

