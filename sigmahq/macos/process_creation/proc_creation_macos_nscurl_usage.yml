  ---

  ### Technical Context

  This Sigma rule detects the use of the `nscurl` utility on macOS to download files, which is often employed by attackers for file exfiltration or command-and-control activities. The main objective of the attacker may be to retrieve malicious payloads or tools from remote locations to compromise a system further. This behavior maps to MITRE ATT&CK techniques T1105 (Ingress Tool Transfer) and T1071 (Application Layer Protocol).

  The primary telemetry sources include process creation logs, specifically those related to macOS (e.g., system logs or `Unified Logging`). Critical log types may include details from Event IDs concerning process executions. If malicious, this behavior could lead to unauthorized data exfiltration or system breaches. It is vital to note that this detection does NOT confirm malicious intent on its own, as legitimate use cases exist.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine macOS process creation logs for Event IDs that show execution of `nscurl`. Look for fields like `Image` and `CommandLine` to identify the context of the command.

  - **Identify CommandLine arguments:** Pay special attention to CommandLine arguments. Legitimate use cases often have limited options without the `--download` flag, while malicious executions frequently use diverse flags such as `--download` or `--output` which can indicate potential malicious activity.

  - **Check file downloads:** After identifying suspicious `nscurl` executions, verify the target directories for any newly created or modified files. Use Unified Logging to identify `downloaded` file paths, typically in user home directories or system folders.

  - **Analyze outbound traffic:** Monitor network traffic for connections originating from the host executing `nscurl` to unusual external IPs or domains. Look for HTTP/S requests that correlate with recent `nscurl` executions.

  - **Investigate process parents and siblings:** Determine the parent process of the `nscurl` execution. Malicious downloads are often initiated by other suspicious processes. Check for unusual parent-child process relationships, particularly from known legitimate applications.

  ---

  ### Prioritization

  The alert is considered medium severity due to the potential impact of file downloads on sensitive systems, especially in environments where macOS is prevalent. The likelihood of malicious use is moderate, given the specificity of the behavior. While `nscurl` can be used for legitimate purposes, its utility in command-and-control operations makes it relevant for prioritization.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the use of process name obfuscation or legitimate administrative activities. Reliable detection requires complete logging enabled on macOS, including system and third-party process creation logs. Legitimate uses of `nscurl` by developers or system administrators may trigger alerts, necessitating context verification. Companion detections such as monitoring for unsolicited outbound connections (e.g., via Firewall logs) can reinforce coverage against exfiltration attempts.

