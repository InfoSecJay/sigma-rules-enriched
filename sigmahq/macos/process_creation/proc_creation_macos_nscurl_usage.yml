note: |
  ### Technical Context

  This rule detects the execution of the `nscurl` utility on macOS systems when it is used to download files. It highlights potential command-and-control (C2) behavior where an attacker may leverage `nscurl` to retrieve malicious payloads from remote locations. The relevant MITRE ATT&CK tactic is **Command and Control** (TA0011), and the technique is **File and Directory Permissions Modification** (T1105). Primary telemetry sources include macOS process creation logs, specifically focusing on command-line parameters associated with `nscurl`. If this behavior is malicious, it could indicate an active compromise, as it may facilitate the download of harmful software to the endpoint. However, this detection does NOT confirm that the downloaded file is malicious; further analysis is necessary to assess the file's intent and integrity.

  ### Investigation Steps

  - **Check process creation logs**: Review macOS process creation events (e.g., `log show --predicate 'process == "nscurl"'`) for Event ID tracking. Look for the presence of `nscurl` commands containing download flags.

  - **Evaluate command line arguments**: Identify any malicious indicators by analyzing the command line for the presence of sensitive flags like `--download`, `--output`, or `-o`. Legitimate `nscurl` usage will often use these flags with known URLs or internal sources.

  - **Correlate with network traffic logs**: Cross-reference any identified `nscurl` executions with network logs to identify the URL from which files were downloaded (e.g., DNS logs or HTTP request logs). Blocklisted or unknown domains might indicate malicious activity.

  - **Inspect downloaded files**: If possible, access the system to check the files in the specified download directory. Use `md5` or `shasum` commands to hash these files for further analysis. Legitimate files will have expected checksums based on company policy or software repositories.

  - **Identify host role relevance**: Determine the role of the affected macOS system (e.g., server, workstation). A server executing `nscurl` to download files may indicate higher risk compared to a trusted user workstation performing background updates.

  - **Review user behavior and context**: Look into the user account associated with the `nscurl` activity. Analyze additional logins or actions leading to the download event to discern any potential compromise, verifying if the user has a legitimate reason for such actions.

  ### Prioritization

  This alert should be treated with medium severity as it arises from behavior potentially indicative of a compromise. The impact is determined by the asset's criticality and the likelihood of malicious use of `nscurl` for C2 activities. While this behavior may not be frequently weaponized, it poses a risk if executed by a legitimate user account in an inappropriate context.

  ### Blind Spots and Assumptions

  Detection may be limited by variations in how `nscurl` is invoked or if it is leveraged in contexts not captured by process creation logs. There may be legitimate administrative tasks that require similar command structures. Also, macOS systems must be properly configured to ensure `nscurl` activity is adequately logged. Related detections could include those monitoring for suspicious outbound DNS queries.

