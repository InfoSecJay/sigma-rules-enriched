note: |
  ### Technical Context

  This rule detects the execution of the `osascript` binary with parameters that imply clipboard data collection on macOS systems. The likely objective of an attacker using this behavior is to harvest sensitive information from the user's clipboard, which could include passwords, credit card numbers, or other confidential data. This detection maps to MITRE ATT&CK technique T1115 (Clipboard Data) and T1059.002 (Command and Scripting Interpreter: AppleScript). The primary telemetry source is macOS process creation logs, specifically focusing on command line execution details.

  If malicious, successful clipboard data collection can lead to data breaches and unauthorized information disclosures. However, this detection does NOT confirm the act was successful or that the collected data was sensitive.

  ### Investigation Steps

  - **Review the command line arguments**: Check for the presence of "osascript -e clipboard" in macOS logging (Event ID: Security System Events). Analyze the entire command line for suspicious or unusual parameters that indicate malicious activity.

  - **Identify the process parent**: Use process trees from macOS logs to trace the parent process of the `osascript` command. Look for signs of unusual parent processes or contexts, such as execution from user profiles that typically don't run scripting tasks.

  - **Correlate with user activity**: Confirm whether clipboard content has been copied or accessed around the same time. Review applications that are typically used to manage clipboard data or to collect sensitive information.

  - **Assess host role and asset criticality**: Identify if the affected host is a critical system or frequently used by high-privilege user accounts. This adds context to the alert and helps prioritize response actions.

  - **Identify benign use cases**: Understand legitimate use cases for clipboard access in your environment, such as script automation by admin users. Cross-reference user profiles to ensure the `osascript` execution aligns with standard operational behavior.

  - **Look for concurrent malicious indicators**: Check for other alerts or logs that may indicate a broader attack. For instance, prior evidence of suspicious process execution (e.g., known malware processes) within the same window.

  ### Prioritization

  This alert is high severity due to its potential impact on data loss from critical systems and the likelihood of being leveraged by malicious actors seeking to exfiltrate sensitive information. Clipboard access is a common technique for attackers, making this behavior especially concerning.

  ### Blind Spots and Assumptions

  This rule may miss evasion techniques such as using encoded arguments or alternative scripting methods that don’t utilize `osascript`. Consistent logging of all application activities is required to reliably capture these events. Legitimate applications like automation tools may trigger this alert during normal operations, making context important. A related detection to enhance coverage could involve monitoring for unusual AppleScript executions or other clipboard access patterns outside the norm.

