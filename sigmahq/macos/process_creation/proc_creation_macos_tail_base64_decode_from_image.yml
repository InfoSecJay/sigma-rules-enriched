title: Potential Base64 Decoded From Images
id: 09a910bf-f71f-4737-9c40-88880ba5913d
status: test
description: |
  Detects the use of tail to extract bytes at an offset from an image and then decode the base64 value to create a new file with the decoded content. The detected execution is a bash one-liner.
references:
- https://www.virustotal.com/gui/file/16bafdf741e7a13137c489f3c8db1334f171c7cb13b62617d691b0a64783cc48/behavior
- https://www.virustotal.com/gui/file/483fafc64a2b84197e1ef6a3f51e443f84dc5742602e08b9e8ec6ad690b34ed0/behavior
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-12-20
tags:
- attack.stealth
- attack.t1140
logsource:
  product: macos
  category: process_creation
detection:
    # Example:  /bin/bash sh -c tail -c +21453 '/Volumes/Installer/Installer.app/Contents/Resources/workout-logo.jpeg' | base64 --decode > /tmp/54A0A2CD-FAD1-4D4D-AAF5-5266F6344ABE.zip
    # VT Query: 'behavior_processes:"tail" (behavior_processes:"jpeg" or behavior_processes:"jpg" or behavior_processes:"png" or behavior_processes:"gif") behavior_processes:"base64" behavior_processes:"--decode >" and tag:dmg'
  selection_image:
    Image|endswith: '/bash'
  selection_view:
    CommandLine|contains|all:
    - 'tail'
    - '-c'
  selection_b64:
    CommandLine|contains|all:
    - 'base64'
    - '-d'         # Also covers "--decode"
    - '>'
  selection_files:
    CommandLine|contains:
    - '.avif'
    - '.gif'
    - '.jfif'
    - '.jpeg'
    - '.jpg'
    - '.pjp'
    - '.pjpeg'
    - '.png'
    - '.svg'
    - '.webp'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a bash command that uses `tail` to extract a specific byte offset from image files and then decodes the base64 value into a new file. The probable intent behind this behavior is to exfiltrate or obfuscate malicious data by embedding it within image files, which is commonly utilized by adversaries to bypass detection mechanisms. This activity aligns with the MITRE ATT&CK technique T1140 (Undocumented API), as it may utilize expected file types to hide the execution of potentially harmful commands.

  The primary telemetry sources for this detection include process creation logs from macOS's system logging, specifically looking for command-line operations involving the `tail` and `base64` commands with file extensions associated with image formats. If malicious, this behavior could facilitate data theft or further exploitation by encoding sensitive data concealed within seemingly benign image files. However, this detection does not confirm that the extracted data is malicious or that the encoded file is indicative of an attack on its own.

  ### Investigation Steps

  - **Review command execution details:** Look for macOS process creation logs (Event IDs) that detail command lines executed. Focus on entries that invoke `bash`, `tail`, and `base64`, checking for images with extensions like `.jpeg`, `.jpg`, or `.png`.

  - **Correlate file creation with execution:** Examine the `/tmp/` directory for newly created files that are likely outputs from the command. Identify files named with GUID patterns or those created immediately after the detection, suggesting a high-confidence malicious indicator.

  - **Identify benign behavior:** Search for legitimate uses of `tail` and `base64` on image files in the environment. Document expected cases where this command may occur, such as legitimate maintenance tasks, to differentiate from potential abuse.

  - **Check for additional behaviors:** Assess other activity on the host surrounding the alert window, such as unusual network connections or other suspicious process executions that might indicate lateral movement or further compromise.

  - **Analyze system roles:** Consider the host system's role; for example, if it is a server known for handling media or file storage, expect more routine usage of image processing commands, which may help in contextualizing alerts.

  ### Prioritization

  This alert should be treated with high severity, particularly on endpoints that handle sensitive data or user-uploaded content. The use of steganography techniques, commonly weaponized in sophisticated attacks, raises the likelihood of malicious intent. The practice of embedding data in images to evade detection is increasingly utilized by threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete command-line logging configurations on macOS. Power users or automated scripts may trigger this alert through legitimate image processing tasks, posing a challenge for differentiation. Additionally, advanced adversaries might employ obfuscation techniques to avoid detection, such as altering command patterns or using alternative encoding methods. A companion detection rule for monitoring `curl` or `wget` for file downloads could enhance coverage, as these may be used in conjunction with extracted data.

