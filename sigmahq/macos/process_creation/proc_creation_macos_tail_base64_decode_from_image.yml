title: Potential Base64 Decoded From Images
id: 09a910bf-f71f-4737-9c40-88880ba5913d
status: test
description: |
  Detects the use of tail to extract bytes at an offset from an image and then decode the base64 value to create a new file with the decoded content. The detected execution is a bash one-liner.
references:
- https://www.virustotal.com/gui/file/16bafdf741e7a13137c489f3c8db1334f171c7cb13b62617d691b0a64783cc48/behavior
- https://www.virustotal.com/gui/file/483fafc64a2b84197e1ef6a3f51e443f84dc5742602e08b9e8ec6ad690b34ed0/behavior
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-12-20
tags:
- attack.defense-evasion
- attack.t1140
logsource:
  product: macos
  category: process_creation
detection:
    # Example:  /bin/bash sh -c tail -c +21453 '/Volumes/Installer/Installer.app/Contents/Resources/workout-logo.jpeg' | base64 --decode > /tmp/54A0A2CD-FAD1-4D4D-AAF5-5266F6344ABE.zip
    # VT Query: 'behavior_processes:"tail" (behavior_processes:"jpeg" or behavior_processes:"jpg" or behavior_processes:"png" or behavior_processes:"gif") behavior_processes:"base64" behavior_processes:"--decode >" and tag:dmg'
  selection_image:
    Image|endswith: '/bash'
  selection_view:
    CommandLine|contains|all:
    - 'tail'
    - '-c'
  selection_b64:
    CommandLine|contains|all:
    - 'base64'
    - '-d'         # Also covers "--decode"
    - '>'
  selection_files:
    CommandLine|contains:
    - '.avif'
    - '.gif'
    - '.jfif'
    - '.jpeg'
    - '.jpg'
    - '.pjp'
    - '.pjpeg'
    - '.png'
    - '.svg'
    - '.webp'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of a malicious command that extracts data from image files using the `tail` command in a Unix-like environment, specifically macOS. The command sequence reads a certain byte range from an image file, decodes a base64 string, and saves the output to a new file. This technique may be employed by attackers to exfiltrate data or execute payloads hidden within image files, leveraging image formats as a cover for their actions while avoiding typical detection mechanisms.

  The suspected threat behaviors relate closely to techniques within the MITRE ATT&CK framework, particularly under the category of "Defense Evasion" (TA0005) and the technique T1140, which involves using `Obfuscated Files or Information`. Attackers may be attempting to evade network defenses, security monitoring, or analysis environments by encoding their files as images, ultimately aiming to deliver or exfiltrate malicious payloads undetected.

  Primary data sources for detecting this behavior include:
  - Process creation logs from macOS, which can provide insights into command-line executions and potentially illicit activity.
  - File access logs to identify any suspicious read or write operations on image files that may not correspond to legitimate usage.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for entries containing the execution of the `bash` shell, particularly those including `tail`, `base64`, and any image file extensions (`.jpg`, `.png`, etc.) to identify potentially malicious commands.
  - **Analyze Command Line Arguments:** Pay close attention to the command-line string associated with the detected process. Look for patterns indicating the extraction and decoding of data from images, as well as any unusual file paths or temporary file creations.
  - **Inspect Affected Files:** Check the image files being manipulated for any encoding anomalies or unexpected binary data. Validate whether the files correspond to legitimate sources or if they exhibit signs of tampering.
  - **Identify Anomalous Behavior:** Look for any corresponding network activity related to the decoded files. This may include unusual outbound connections after the execution of the detected command that could indicate data exfiltration.

  ### Prioritization
  The severity of this alert is high due to the potential risk of data exfiltration or payload delivery, which could result in significant impacts on enterprise security. Given the effective use of benign file types to circumvent security measures, prompt investigation is critical to mitigate risks.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage for variations in command structures or obfuscated file formats that do not utilize the `tail` or `base64` commands directly. Additionally, if logs are not effectively capturing all macOS process creation events or command-line arguments, relevant activities could be missed. There is an assumption that the command will always involve a recognizable sequence. Accurate log configurations and monitoring for process creation on macOS systems are necessary for this detection rule to function effectively.

