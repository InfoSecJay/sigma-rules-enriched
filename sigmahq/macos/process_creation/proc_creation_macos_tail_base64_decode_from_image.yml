title: Potential Base64 Decoded From Images
id: 09a910bf-f71f-4737-9c40-88880ba5913d
status: test
description: |
  Detects the use of tail to extract bytes at an offset from an image and then decode the base64 value to create a new file with the decoded content. The detected execution is a bash one-liner.
references:
- https://www.virustotal.com/gui/file/16bafdf741e7a13137c489f3c8db1334f171c7cb13b62617d691b0a64783cc48/behavior
- https://www.virustotal.com/gui/file/483fafc64a2b84197e1ef6a3f51e443f84dc5742602e08b9e8ec6ad690b34ed0/behavior
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-12-20
tags:
- attack.defense-evasion
- attack.t1140
logsource:
  product: macos
  category: process_creation
detection:
    # Example:  /bin/bash sh -c tail -c +21453 '/Volumes/Installer/Installer.app/Contents/Resources/workout-logo.jpeg' | base64 --decode > /tmp/54A0A2CD-FAD1-4D4D-AAF5-5266F6344ABE.zip
    # VT Query: 'behavior_processes:"tail" (behavior_processes:"jpeg" or behavior_processes:"jpg" or behavior_processes:"png" or behavior_processes:"gif") behavior_processes:"base64" behavior_processes:"--decode >" and tag:dmg'
  selection_image:
    Image|endswith: '/bash'
  selection_view:
    CommandLine|contains|all:
    - 'tail'
    - '-c'
  selection_b64:
    CommandLine|contains|all:
    - 'base64'
    - '-d'         # Also covers "--decode"
    - '>'
  selection_files:
    CommandLine|contains:
    - '.avif'
    - '.gif'
    - '.jfif'
    - '.jpeg'
    - '.jpg'
    - '.pjp'
    - '.pjpeg'
    - '.png'
    - '.svg'
    - '.webp'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a bash command that uses `tail` to extract bytes from image files and decodes the extracted base64 content to create a new file. This behavior is typically indicative of an adversary attempting to exfiltrate or manipulate data hidden within image files, which aligns with tactics such as defense evasion and data exfiltration. This detection primarily references the MITRE ATT&CK technique T1140 (Obfuscated Files or Information).

  The primary telemetry source for this detection is macOS process creation logs, specifically capturing command line arguments associated with the process. If malicious, this behavior signifies an attempt to bypass security measures by hiding data within images. Importantly, this detection does NOT confirm that malicious activity has occurred on its own; further investigation of the context and associated actions is necessary.

  ### Investigation Steps

  - **Review the command line execution:** Check for the use of `tail` and `base64` within macOS logs (e.g., `Event ID 100)`. Look for patterns indicating byte extraction specifically from image files such as `.jpg`, `.png`, or `.gif`.

  - **Validate file creation in `/tmp`:** Investigate any new files generated in `/tmp` during the time of the alert. Track file creation events to confirm whether the decoded output was written to disk, focusing on known suspicious filenames or unusual file types.

  - **Identify file handling within expected behavior:** Compare the command against legitimate practices for handling image files in your environment (e.g., verifying that tools extracting image metadata are in use rather than data extraction). Note if common utilities or scripts were used that do not involve encoded data transformations.

  - **Assess user context and asset criticality:** Review the user account and the devices involved. Confirm if this activity corresponds to standard operational behavior for that user/host, as atypical patterns (such as running from unusual non-graphic users) can indicate compromise.

  - **Cross-reference URL or network activity:** If applicable, look for related outbound traffic or commands that could indicate unauthorized data exfiltration, particularly focused on HTTP/S requests to external domains that might follow the command's execution.

  ### Prioritization

  This alert should be considered high severity due to its potential to reveal an attempt at data exfiltration or evasion tactics employed by an adversary. The likelihood of malicious behavior is significant owing to the unique command structure that is not typical for regular operations, especially when targeting sensitive or potentially valuable data.

  ### Blind Spots and Assumptions

  This detection may have limitations in environments where legitimate scripts or applications perform similar actions for valid purposes, potentially leading to false positives. It also assumes availability of process command line details in logs, which may require configuration adjustments on macOS for reliability. There may be legitimate activities such as developers or skilled users manipulating image data in tools like graphics editors that could trigger this alert. Companion detections, such as monitoring for unusual outbound network requests (e.g., T1071 - Application Layer Protocol), would enhance coverage and context.

