note: |
  ### Technical Context

  This rule detects the use of the `dscl` command to add a user account to the administrator group on macOS systems. This behavior may indicate an attacker’s objective to escalate privileges or maintain persistence by granting themselves or a compromised account elevated access rights. Relevant MITRE ATT&CK techniques include "Create a Local Account" (T1078.003), and the associated tactic is "Persistence."

  The primary telemetry source for this detection is process creation logs on macOS systems, specifically looking for logs indicating the execution of the `dscl` command with specific command line parameters. If malicious, this behavior may allow an attacker to gain control over the system with administrative privileges, significantly increasing the security risk. Notably, this detection does NOT confirm that the execution was malicious without further contextual investigation.

  ---

  ### Investigation Steps

  - **Check command execution details:** Review macOS process creation logs (Event IDs from `/var/log/system.log` or by using `log show`) specifically for `dscl` commands, focusing on those that have `-append`, `/Groups/admin`, and `GroupMembership` in the command line.

  - **Identify legitimate administrative activity:** Examine whether the user account involved is known to perform administrative tasks or if the command was issued during a typical maintenance window by an authorized administrator.

  - **Investigate user account history:** Review user account creation and modification events via `/var/db/dslocal/nodes/Default/users/` to determine if the account was newly created or modified just prior to the alert being triggered.

  - **Look for additional suspicious activity:** Correlate this event with other potential indicators of compromise (IoCs), such as logins from unusual locations or times (check logs from `/var/log/secure.log`).

  - **Assess the asset's criticality:** Determine if the affected device is a sensitive endpoint (such as a server or a critical user workstation) that could have significant security implications if compromised.

  - **Identify high-confidence malicious indicators:** Track any consecutive logins or attempts to execute administrative commands following the `dscl` modification; focus on unexpected accounts or non-administrative user activity invoking privileged operations.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of privilege escalation on critical systems. The likelihood of malicious abuse is notable, as attackers often target administrative privileges to execute further attacks or maintain access. This behavior is a common tactic in various attack campaigns.

  ---

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative actions performed by authorized personnel or through legitimate scripts that manage users. Reliable detection also requires ensuring logging is enabled and properly configured on macOS systems. Related detections that can enhance coverage include monitoring for unusual logins or SSH access attempts correlated with the modified accounts.

