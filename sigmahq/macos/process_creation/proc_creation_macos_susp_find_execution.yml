note: |
  ### Technical Context

  This Sigma rule detects the use of the `find` command on macOS systems with specific parameters that suggest potential privilege escalation or system reconnaissance activity. The attacker aims to discover sensitive files or misconfigured permissions that could enable unauthorized access or exploitation. This behavior maps to the MITRE ATT&CK technique "File and Directory Discovery" (T1083). Primary telemetry sources include macOS process creation logs, specifically monitoring the command line arguments used by the `find` binary. If malicious, this could lead to significant security impacts, such as data exfiltration or lateral movement. However, this detection does NOT confirm malicious intent on its own, as legitimate system administration tasks may also utilize the `find` command.

  ### Investigation Steps

  - **Review command line arguments:** Examine Event ID 4688 for the `find` command usage with parameters such as `-perm -4000`, `-perm -2000`, or `-perm 0777`. Flags indicating high-risk permission settings could signify malicious intent.

  - **Correlate process lineage:** Track parent-child process relationships in Sysmon Event ID 1 to determine how the `find` process was invoked. Legitimate activities will typically show user-driven interactions or standard administrative scripts.

  - **Investigate file system changes:** Look for recent modifications, creations, or deletions of sensitive files (e.g., `/etc/passwd`, `/etc/shadow`). Anomalous or unexpected activity here, particularly following the identified `find` command invocation, may indicate malicious file discovery.

  - **Validate user context:** Check the user account executing the `find` command against security policies. Administrative users or system processes performing this query may be benign, while anomalies like non-admin accounts executing discovery queries should be flagged.

  - **Assess system role:** For critical servers or workstations, heightened scrutiny is required as this behavior can lead to severe data breaches. Perform asset criticality assessments on affected systems to determine necessary response actions.

  ### Prioritization

  This alert should be treated with medium priority as it indicates potential discovery activity which, while not inherently malicious, could be indicative of a larger attack vector if malicious tools or scripts are leveraged. The likelihood of this behavior being weaponized is moderate, particularly if combined with other suspicious activities.

  ### Blind Spots and Assumptions

  Detection may miss legitimate administrative activities that use the `find` command for necessary system maintenance. Adequate logging of command execution must be configured to capture both command line arguments and process parentage effectively. Moreover, users performing detailed directory discovery should be evaluated against standard operating behaviors, and companion detections could include suspicious access to sensitive directories or unexpected changes to administrative privileges.

