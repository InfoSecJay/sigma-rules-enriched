note: |
  ### Technical Context
  This detection rule identifies suspicious usage of the "find" binary on macOS systems, which could indicate potential reconnaissance and discovery activities by an attacker. The "find" command, while commonly used for legitimate file searching, can be manipulated by threat actors to identify files with specific permissions that may facilitate privilege escalation or unauthorized access. Attackers typically aim to gather information about sensitive files, misconfigured permissions, or privilege escalation paths within the system or network.

  The relevant MITRE ATT&CK tactics include **Discovery (TA0007)**, specifically techniques such as **File and Directory Discovery (T1083)**. These techniques describe how attackers can leverage system commands to discover locations and permissions of sensitive files, which can lead to further exploitation or lateral movement within an enterprise environment. The primary data source for this detection is **process creation logs**, which record details about command executions, including the image and command line arguments used.

  ### Investigation Steps
  - **Collect Process Creation Logs**: Gather recent process creation logs from macOS endpoints to identify any instances of the "find" command being executed with suspicious arguments indicative of potential discovery activities.
  - **Analyze Command Line Arguments**: Review the command line arguments used with the "find" binary. Pay particular attention to permissions flags that are often exploited, such as `-perm -4000`, `-perm -2000`, and others noted in the detection logic.
  - **Check User Accounts**: Investigate the accounts associated with the suspicious command executions. Determine whether the users have legitimate reasons to run these commands and if they possess higher privileges than expected.
  - **Correlate with Other Logs**: Look for other correlated suspicious activities that may have occurred around the same time as the find command execution, such as elevated privileges or attempts to access sensitive files.

  ### Prioritization
  This alert should be considered of medium severity due to the potential implications of unauthorized discovery activity that could lead to privilege escalation. Given the likelihood of misconfigured permissions in enterprise environments, detecting such behavior early is crucial in mitigating possible exploitation.

  ### Blind Spots and Assumptions
  This detection rule may not capture initial reconnaissance behaviors if the command is run under different binaries or arguments not accounted for in the detection logic. It assumes that all necessary logs related to process creation are enabled and retained on monitored macOS systems. Additionally, false positives may arise from legitimate administrative usage of the find command for maintenance purposes; thus, context around the executed commands is essential for accurate interpretation.

