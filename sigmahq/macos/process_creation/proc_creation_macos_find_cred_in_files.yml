  ---

  ### Technical Context

  This Sigma rule detects the execution of commands that search for credentials in files, particularly utilizing `grep` with the keyword "password" and the execution of LaZagne, a credential recovery tool. The likely attacker objective is to enumerate sensitive information, such as user passwords stored in file systems, to facilitate unauthorized access to systems or data. This behavior aligns with the MITRE ATT&CK tactic **Credential Access** and technique **T1552.001: Credentials in Files**.

  The primary telemetry source is macOS process creation logs, specifically looking at `process_creation` events. If malicious, this behavior could lead to a significant security impact by compromising user credentials, which can then be leveraged for further attacks or lateral movement. Importantly, this detection does NOT confirm credential compromise on its own; it merely indicates an attempt to extract potentially sensitive information.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Investigate macOS process creation logs for Security Event ID 4688 or Sysmon Event ID 1. Focus on entries where the Image ends with `/grep` or shows LaZagne execution, indicating potential credential harvesting activity.

  - **Check command line arguments:** Examine the CommandLine field for recent entries containing the terms "password" or "laZagne". Look for exact matches to confirm malicious intent versus benign usage in log files.

  - **Identify legitimate activities:** Investigate if any recently executed instances of `grep` with "password" are part of legitimate user scripts or administration functions that deal with password management. Correlate this against known user workflows with documented purposes.

  - **Flag high-confidence indicators:** Look for the presence of LaZagne in logs or any associated file paths being accessed that may indicate malicious use. If found, this serves as a strong indicator of credential harvesting.

  - **Confirm host context:** Validate the asset type or role of the host initiating this command. A server or workstation used for development or administration might raise fewer alarms than endpoints with no legitimate reason for executing such commands.

  - **Correlate with potential exfiltration:** Investigate for any ancillary artifact creation during these activities, such as temporary files or unusual outbound connections, which might indicate further credential exfiltration.

  ---

  ### Prioritization

  This alert should be considered high priority due to its potential impact on security posture. Affected systems could serve critical roles, and the techniques leveraged are commonly employed in credential theft maneuvers by adversaries, making this detection vital.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations if the logging framework does not capture all process creation events or command lines accurately. Additionally, legitimate administrative activities, such as IT maintenance or security assessments, could trigger these alerts. A relevant companion detection could be monitoring for anomalous file access patterns that correlate with user password searches, adding context to the investigation.

