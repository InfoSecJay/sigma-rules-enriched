note: |
  ### Technical Context
  This detection rule identifies attempts to extract passwords from files on macOS systems using the command-line tools `grep` and `laZagne`. The rule is triggered when the command line arguments reveal an intention to search for or extract sensitive credentials, which can indicate malicious behavior. Attackers often use such techniques to gather credentials that can facilitate further intrusion or lateral movement within a network.

  The relevant MITRE ATT&CK techniques for this behavior fall under T1552.001 - "Credentials from Password Stores," which highlights the extraction of stored credentials by malicious actors. This behavior occurs during the credential access phase of an attack, where the attacker aims to uncover sensitive information to leverage for privilege escalation or access to critical systems.

  Primary data sources for this detection include process creation logs on macOS, which provide visibility into commands executed on the system, allowing analysts to identify suspicious command-line arguments that could indicate credential extraction activities.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for `grep` and `laZagne` executions. Look for entries with command lines containing the term 'password', as they may indicate attempts to extract credentials.
  - **Analyze File Access Patterns:** Check for any unusual file access around the time of the detected command executions. Focus on common locations where sensitive files may reside, such as user profile directories or configuration files.
  - **Correlate User Activity:** Assess the context of the user account running the commands. Determine if the user has a legitimate reason to execute such commands or if their behavior deviates from established baselines.
  - **Investigate Related Network Activity:** If applicable, analyze network logs for any subsequent connections or data exfiltration attempts that may correlate with the timeline of the detected command execution.

  ### Prioritization
  This alert is deemed high severity because the extraction of credentials can lead to significant compromise within an enterprise environment. The potential impact includes unauthorized access to sensitive data and systems, making it essential for immediate investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the absence of logs from other operating systems or non-standard environments where similar credential extraction behavior could occur. The detection logic assumes that attacks will use `grep` or `laZagne` specifically; however, attackers may employ various other methods to access credentials. For this alert to function correctly, robust process creation logs must be enabled on macOS systems to capture relevant command executions.

