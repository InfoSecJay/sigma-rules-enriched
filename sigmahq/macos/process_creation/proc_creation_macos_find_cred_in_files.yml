note: |
  ### Technical Context

  The rule detects potential credential extraction attempts on macOS systems via the use of command-line tools like `grep` (specifically searching for "password") and `laZagne`, a utility for recovering passwords from various applications. The likely objective of an attacker utilizing these tools is to harvest sensitive credentials stored on the machine for unauthorized access or lateral movement within the environment. This activity aligns with the MITRE ATT&CK tactic of Credential Access, specifically technique T1552.001 (Credentials from Password Stores).

  The primary telemetry sources include macOS process creation logs, specifically monitoring for events related to `grep` and `laZagne`. The security impact is significant, as successful credential extraction could lead to unauthorized access to systems and data, potentially escalating further exploitation. Importantly, this detection does NOT confirm the success of credential extraction; it only identifies the usage of potentially malicious tools or commands.

  ### Investigation Steps

  - **Check for malicious command usage:** Review process creation logs (macOS Event ID equivalent) for entries involving `grep` with a command line containing "password" or the invocation of `laZagne`. Focus on the timestamp and user context for signs of unauthorized access.

  - **Validate expected user behavior:** Compare the command-line usage against roles expecting to run these tools. A legitimate administrator may use `grep` for debugging or service checks, while usage by non-privileged accounts or unusual hours is suspicious.

  - **Analyze the user context:** Identify the user account that executed the commands. If associated with a non-privileged user or unrecognized account, flag this for potential malicious activity.

  - **Correlate with other security events:** Look for related telemetry such as logs from endpoint detection and response (EDR) solutions that may show signs of privilege escalation attempts or lateral movement following the execution of these commands.

  - **Assess system criticality:** Determine if the affected host is a critical asset (e.g., server, admin workstation) that, if compromised, poses a high risk to the organization. Increased urgency in remediation actions is warranted in such cases.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive credentials. The likelihood of malicious use is high, as the tools and techniques involved are commonly weaponized in attacks for credential harvesting. Addressing these alerts promptly is crucial to prevent escalation and lateral movement by potential adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the execution of benign command-line tools that could trigger false positives, especially by users with legitimate administrative tasks. Ensure logging configurations are set to capture comprehensive process creation logs to improve detection reliability. Legitimate activities may include system administrators running `grep` for troubleshooting. Companion detections such as monitoring for unusual LDAP queries or access patterns can reinforce credential access defenses.

