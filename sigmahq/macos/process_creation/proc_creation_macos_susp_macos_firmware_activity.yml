detection:
  selection1:
    Image: '/usr/sbin/firmwarepasswd'
    CommandLine|contains:
    - 'setpasswd'
    - 'full'
    - 'delete'
    - 'check'
  condition: selection1
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious activities related to the manipulation of the firmware password on macOS devices. When an attacker gains unauthorized access to a Mac, they may attempt to set, modify, or remove the firmware password to bypass security measures, enabling them to alter startup settings or install malicious software. Such actions are typically carried out with the intent of maintaining persistence and gaining elevated privileges.

  The associated MITRE ATT&CK tactics include **Initial Access (TA0001)** as the manipulation of firmware settings can facilitate unauthorized access, and **Persistence (TA0003)**, as setting a firmware password can create additional barriers for security mechanisms. The relevant techniques are **Valid Accounts (T1078)**, which involves using legitimate credentials to access restricted functions, and **Boot or Logon Autostart Execution (T1547)**, as manipulating firmware into a particular state can influence system boot behavior.

  Primary data sources for this detection are **process creation events** from macOS systems, specifically looking for instances when the `/usr/sbin/firmwarepasswd` command is executed, particularly with commands indicating setting or removing passwords.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for entries related to `/usr/sbin/firmwarepasswd`, focusing on the context of usage, including the user’s identity and timing of execution.
  - **Analyze Command-Line Arguments**: Assess the command-line arguments passed with the `firmwarepasswd` command. Pay special attention to keywords such as 'setpasswd', 'full', 'delete', and 'check' which indicate potentially malicious activity.
  - **Check for User Context**: Investigate the user who executed the command. Look for any anomalies such as off-hours activity, non-administrative accounts performing administrative commands, or previous users with similar behavior patterns.
  - **Correlate with Other Logs**: Cross-reference findings with other logs, such as VPN connection logs, administrative access logs, and session histories, to identify any related suspicious activity or patterns.

  ### Prioritization
  This alert is considered medium priority due to the technical nature and potential impact of unauthorized firmware manipulation. While it might indicate a less common attack vector, should it reflect a genuine threat, it could lead to significant security breaches and prolonged unauthorized access.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include environments where firmware password commands are not audited effectively, especially if logging configurations are inadequate or not enabled. The detection logic assumes that the command execution is not part of a legitimate administrative task; therefore, context around user behavior and routines is necessary for accurate assessment. It's also necessary to have proper logging enabled for process creation events, as the absence of these logs will hinder the detection of such suspicious activity.

