level: medium
note: |
  ### Technical Context

  This rule detects suspicious activity involving the manipulation of the firmware password on macOS systems through the command `/usr/sbin/firmwarepasswd`. The likely attacker objective is to establish persistent access control or to conduct unauthorized system modifications, potentially enabling a malicious actor to bypass security features. This behavior maps to the MITRE ATT&CK technique: **System Information Discovery (T1082)**.

  The primary telemetry source is the macOS process creation logs, specifically looking for process invocations of the firmware password utility. If exploited, such manipulation can compromise system integrity and user data protection. However, it is important to note that the detection does not confirm malicious intent or successful exploitation on its own; legitimate administrative activity may result in similar command execution.

  ### Investigation Steps

  - **Review process creation logs**: Check for macOS Security Event ID that correlates with process creation for `/usr/sbin/firmwarepasswd`. Confirm the presence of suspicious command-line arguments such as `setpasswd`, `full`, `delete`, or `check`.

  - **Identify user context**: Determine the user account that executed the firmware password command. Legitimate admin actions typically involve known administrator accounts operating from standard administrative profiles.

  - **Cross-reference with endpoint role**: Assess the criticality of the affected macOS system (e.g., whether it is a server, development machine, or a personal device), as higher criticality systems warrant more scrutiny.

  - **Look for unusual command combinations**: A significant red flag would be the execution of `firmwarepasswd` commands with multiple flags (`setpasswd`, `full`, etc.) in a short time span by a non-admin user or outside normal business hours.

  - **Investigate recent changes to system configuration**: Using relevant logs (security, configuration change logs), identify any recent changes that may correlate with the alteration of system firmware settings before or after the alert.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on system security if malicious intent is confirmed. The chances of malicious abuse are moderate, as firmware password modifications are less common but can enable attackers to bypass essential security protections. This behavior has been observed in specific advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering this alert, which may lead to false positives. Therefore, proper log configurations are crucial for accurate detection. Additionally, some administrators may perform firmware password modifications as part of routine maintenance. Companions to this rule would include monitoring for unauthorized changes in system preferences, such as firmware or user account settings, to strengthen overall coverage and context.

