  ---

  ### Technical Context

  This Sigma rule detects the execution of the `firmwarepasswd` command on macOS systems, particularly commands that manipulate firmware passwords. The likely attacker objective is to alter the firmware password to gain unauthorized access or to prevent system recovery, which can facilitate further intrusion or data theft. This behavior aligns with the MITRE ATT&CK tactic "Impact" (T1499) and technique "Application Layer Protocol" (T1160).

  The primary telemetry source for this detection is macOS process creation logs, specifically targeting command executions. If malicious, this activity can severely impact system security, as it may allow an attacker to bypass recovery mechanisms or system security. This detection does NOT confirm whether the action was initiated by a malicious actor, as legitimate administrative activities may also trigger this rule.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for macOS Security Event related to process creation (Event ID for `firmwarepasswd`) to confirm if the process was initiated as part of an expected administrative task (e.g., user authorized to set firmware passwords).

  - **Examine command-line arguments:** Analyze the `CommandLine` field for the presence of terms like 'setpasswd', 'full', 'delete', or 'check' to identify potentially malicious intent. Any unexpected usage context warrants further investigation.

  - **Identify asset criticality:** Verify the host role of the machine executing this command, focusing on high-privilege machines (e.g., servers or devices containing sensitive data) that should not typically see this command executed.

  - **Detect suspicious behavior:** Check for additional indicators, such as other process creations (e.g., scripts or unauthorized tools) that might follow the firmware command, indicating a potential escalation of privileges or malicious workflow.

  - **Validate administrator legitimacy:** Correlate the alert with user authentication logs (for example, macOS logs for user sessions or admin access attempts) to ensure that the activity aligns with legitimate administrative permissions.

  ---

  ### Prioritization

  This alert holds medium severity due to the potential impact on critical systems, especially if firmware controls are compromised. While the likelihood of malicious abuse exists, especially in a targeted attack scenario, legitimate administrative actions can trigger similar alerts, thus requiring careful validation before escalation.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by an attacker who uses alternative tools or methods to manipulate firmware settings without invoking `firmwarepasswd`. Comprehensive logging configurations for process creation events are necessary for reliable detection. Legitimate activities, such as system administrators resetting firmware passwords, may also trigger this alert, underscoring the need for contextual analysis. A related detection to consider is monitoring for access to privileged account credentials or configurations that allow enabling or disabling firmware password protection.

