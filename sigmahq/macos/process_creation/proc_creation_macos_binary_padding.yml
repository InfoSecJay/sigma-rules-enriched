title: Binary Padding - MacOS
id: 95361ce5-c891-4b0a-87ca-e24607884a96
status: test
description: Adversaries may use binary padding to add junk data and change the on-disk
  representation of malware. This rule detect using dd and truncate to add a junk
  data to file.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1027.001/T1027.001.md
- https://linux.die.net/man/1/truncate
- https://linux.die.net/man/1/dd
author: 'Igor Fits, Mikhail Larin, oscd.community'
date: 2020-10-19
modified: 2023-02-17
tags:
- attack.defense-evasion
- attack.t1027.001
logsource:
  product: macos
  category: process_creation
detection:
  selection_truncate:
    Image|endswith: '/truncate'
    CommandLine|contains: '-s +'
  selection_dd:
    Image|endswith: '/dd'
    CommandLine|contains:
    - 'if=/dev/zero'         # if input is not /dev/zero, then there is no null padding
    - 'if=/dev/random'         # high-quality random data
    - 'if=/dev/urandom'         # low-quality random data
  condition: 1 of selection_*
falsepositives:
- Legitimate script work
level: high
note: |
  ### Technical Context
  This detection rule identifies the misuse of binary padding techniques on MacOS systems, particularly focusing on the use of the `dd` and `truncate` commands. Adversaries may employ these commands to add junk data to files, changing their on-disk representation to evade detection and analysis. Techniques such as these often serve as precursors to malware execution, obfuscating malicious code to reduce the chance of detection by security tools.

  The likely attack scenario involves an adversary attempting to modify a binary or script, using binary padding to evade signature-based detection by altering checksums or increasing file sizes without significant changes to functionality. This behavior aligns with the MITRE ATT&CK framework's tactics and techniques, specifically in the realm of "Defense Evasion" (ID: T1027.001).

  Primary data sources for detecting this activity include process creation logs, which capture command-line executions and the associated images. These logs provide insights into executed commands and parameters that can indicate malicious intent.

  ### Investigation Steps
  - **Review process creation logs:** Analyze logs for the execution of `truncate` and `dd` commands, especially those containing the flags `-s +` for `truncate` and `if=/dev/zero`, `if=/dev/random`, or `if=/dev/urandom` for `dd`.

  - **Examine suspicious command-line parameters:** Look for unusual or specific command-line arguments associated with `dd` and `truncate`, as these can indicate attempts to pad binary files. Focus on commands that deviate from normative usage patterns in your environment.

  - **Correlate with known baselines:** Compare the detected activities against established baselines for benign application behavior to identify outliers or unusual patterns. This can help filter potential false positives.

  - **Inspect associated file modifications:** Investigate the files being modified—check file creation, modification times, and sizes to identify any unusual or suspicious changes that align with execution of the identified commands.

  ### Prioritization
  This alert should be considered high-severity due to the potential impact on system integrity and security. The ability for adversaries to modify binaries and evade detection mechanisms significantly increases the risk of successful exploitation and data compromise.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the use of approved or legitimate scripts leveraging `dd` and `truncate` for benign purposes, which may lead to false positives. The detection logic assumes that use of these commands with specific flags indicates malicious intent, but benign use cases might exist. Additionally, the effectiveness of this rule is contingent on the configuration of logging for process creation events—if these logs are not enabled or are improperly configured, the detection may fail to capture relevant activity.

