title: Binary Padding - MacOS
id: 95361ce5-c891-4b0a-87ca-e24607884a96
status: test
description: Adversaries may use binary padding to add junk data and change the 
  on-disk representation of malware. This rule detect using dd and truncate to 
  add a junk data to file.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1027.001/T1027.001.md
- https://linux.die.net/man/1/truncate
- https://linux.die.net/man/1/dd
author: 'Igor Fits, Mikhail Larin, oscd.community'
date: 2020-10-19
modified: 2023-02-17
tags:
- attack.stealth
- attack.t1027.001
logsource:
  product: macos
  category: process_creation
detection:
  selection_truncate:
    Image|endswith: '/truncate'
    CommandLine|contains: '-s +'
  selection_dd:
    Image|endswith: '/dd'
    CommandLine|contains:
    - 'if=/dev/zero'         # if input is not /dev/zero, then there is no null padding
    - 'if=/dev/random'         # high-quality random data
    - 'if=/dev/urandom'         # low-quality random data
  condition: 1 of selection_*
falsepositives:
- Legitimate script work
level: high
note: |
  ### Technical Context

  This rule detects the use of binary padding techniques by observing the invocation of commands such as `dd` and `truncate`. Adversaries may exploit this method to insert junk data into files, altering their on-disk representation to evade detection or analysis. The likely objective is to obfuscate malware signatures, making it harder for security solutions to identify malicious files. This behavior aligns with the MITRE ATT&CK technique T1027.001 (Obfuscated Files or Information). The primary telemetry source is MacOS process creation logs, specifically targeting process execution events. If malicious, this can lead to undetected malware persistence on the system. However, this detection does not confirm that the observed activity is malicious, as legitimate administrative tasks may trigger similar command executions.

  ### Investigation Steps

  - **Verify process creation events**: Review MacOS system logs for Security Event ID 100 (process creation) to confirm the invocation of `truncate` or `dd` commands. Look for suspicious command lines that contain `-s +` (truncate) or use `/dev/zero`, `/dev/random`, or `/dev/urandom` (dd).

  - **Identify legitimate usage patterns**: Assess the command history (using `history` or shell logs) for normal `dd` or `truncate` usage patterns by system administrators or scripts, especially in scripts for data manipulation or backups to rule out benign activity.

  - **Review related process trees**: Analyze parent processes of the `dd` or `truncate` commands. Malicious usage is often preceded by a download or extraction of a suspicious file, observed via processes like `curl`, `wget`, or `unzip`.

  - **Examine file attributes post-execution**: Check the file modification times and sizes of affected files for anomalies. Look for newly modified files with padding that have creation dates coinciding with the detection time, using `ls -l` or similar commands.

  - **Correlate with known malicious indicators**: Cross-reference any identified files with known malware hashes using threat intelligence platforms or internal repositories to determine if the files are recognized as malicious.

  ### Prioritization

  This alert carries a high severity due to its potential impact on compromised systems. The use of binary padding is a common tactic among advanced adversaries to bypass detection mechanisms. If malware is confirmed, it may facilitate unauthorized access and other malicious actions, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative tasks can produce similar command invocations and may lead to false positives, like routine system maintenance or scripting. Continuous monitoring from process creation logs is essential, and incomplete logging configurations may yield gaps in detection. Companion detections include monitoring for known malicious file hashes or anomalous network traffic coinciding with the execution of such commands to enhance coverage.

