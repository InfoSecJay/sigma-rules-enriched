title: Binary Padding - MacOS
id: 95361ce5-c891-4b0a-87ca-e24607884a96
status: test
description: Adversaries may use binary padding to add junk data and change the 
  on-disk representation of malware. This rule detect using dd and truncate to 
  add a junk data to file.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1027.001/T1027.001.md
- https://linux.die.net/man/1/truncate
- https://linux.die.net/man/1/dd
author: 'Igor Fits, Mikhail Larin, oscd.community'
date: 2020-10-19
modified: 2023-02-17
tags:
- attack.defense-evasion
- attack.t1027.001
logsource:
  product: macos
  category: process_creation
detection:
  selection_truncate:
    Image|endswith: '/truncate'
    CommandLine|contains: '-s +'
  selection_dd:
    Image|endswith: '/dd'
    CommandLine|contains:
    - 'if=/dev/zero'         # if input is not /dev/zero, then there is no null padding
    - 'if=/dev/random'         # high-quality random data
    - 'if=/dev/urandom'         # low-quality random data
  condition: 1 of selection_*
falsepositives:
- Legitimate script work
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of binary padding techniques via the `dd` and `truncate` commands on macOS, a method adversaries may use to alter the on-disk representation of malicious files. The likely attacker objective is to obfuscate malicious code or manipulate file sizes to evade detection by security software. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (Tactic ID: TA0040) and the technique of Binary Padding (Technique ID: T1027.001). Primary telemetry sources include macOS process creation logs, specifically focusing on command-line arguments associated with these two tools. If malicious, this activity could facilitate malware execution that bypasses traditional security mechanisms. Importantly, this detection does NOT confirm that malicious activity is occurring without further analysis.

  ### Investigation Steps

  - **Check the command line used for process creation:** Review the logs for process creation events (Event ID: 4688) associated with `truncate` or `dd`. Look specifically for command lines containing `-s +` for `truncate` or `if=/dev/zero`, `if=/dev/random`, or `if=/dev/urandom` for `dd`. Malicious indicators include unusual or unexpected file targets.

  - **Identify the context of the execution:** Determine the user context that executed the command by checking the `User` field in the macOS logs. Legitimate use may include system administrators performing routine file operations, while unknown user accounts executing these commands may be suspicious.

  - **Analyze the affected files:** Investigate the files that were targeted by `truncate` or modified by `dd`. If the timestamp indicates recent activity and the file is executable in nature, it could indicate an attempt to manipulate executables or scripts.

  - **Look for related filesystem activity:** Review `/var/log/system.log` or use `fsusage` to identify concurrent file modifications or access patterns around the time of the process creation. Legitimate user activity may show predictable patterns, whereas random timings can point to malicious behavior.

  - **Cross-examine with file integrity monitoring logs:** Determine if file integrity monitoring alarms or logs from tools like OSSEC or FIM services were triggered during the time of the command execution. This may indicate suspicious changes to critical system files.

  - **Consider asset criticality:** If the affected system is a production server or hosts sensitive data, prioritize the investigation due to its higher security impact.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and the likelihood of malicious abuse through file obfuscation or manipulation techniques. Binary padding techniques are commonly weaponized in advanced persistent threat (APT) scenarios, making prompt investigation crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by the availability of log sources or configurations, as standard logs may not capture every instance of `dd` or `truncate` usage without proper monitoring in place. Additionally, legitimate activities such as routine system maintenance or application updates might trigger the alert. A related detection to strengthen coverage could include monitoring for creation or modification of executable files, as this behavior often accompanies binary padding activities.

