logsource:
  category: process_creation
  product: macos
detection:
  select_file_with_asterisk:
    Image: '/usr/bin/file'
    CommandLine|re: '(.){200,}'     # execution of the 'file */* *>> /tmp/output.txt' will produce huge commandline
  select_recursive_ls:
    Image: '/bin/ls'
    CommandLine|contains: '-R'
  select_find_execution:
    Image: '/usr/bin/find'
  select_mdfind_execution:
    Image: '/usr/bin/mdfind'
  select_tree_execution|endswith:
    Image: '/tree'
  condition: 1 of select*
falsepositives:
- Legitimate activities
level: informational
note: |
  ### Technical Context

  This Sigma rule detects the use of system utilities on MacOS designed for file and directory discovery. Malicious actors may employ these commands to locate sensitive files or system information, potentially leading to further exploitation. The relevant MITRE ATT&CK tactic is **Discovery** (Tactic ID: TA0007) with techniques including **File and Directory Discovery** (Technique ID: T1083). The primary telemetry sources include MacOS process creation logs, specifically monitoring system calls for common utilities such as `file`, `ls`, `find`, and `mdfind`. If malicious, this activity could indicate preparatory steps taken by an attacker to gather information before launching a full-scale attack. However, this detection does NOT confirm that the activity is illegitimate without further context.

  ### Investigation Steps

  - **Check process creation logs:** Review macOS logs for Event ID related to process creation capturing the use of specific tools (e.g., `/usr/bin/file`, `/bin/ls -R`, `/usr/bin/find`, `/usr/bin/mdfind`, `/usr/bin/tree`). Look for high-frequency, automated patterns indicative of malicious scanning.

  - **Evaluate command-line parameters:** Search for large `CommandLine` strings (greater than 200 characters) associated with the `file` command and analyze patterns for unusual file access behaviors. For example, commands like `file */* *>> /tmp/output.txt` indicate potential malicious intent.

  - **Identify legitimate use cases:** Recognize expected activity such as administrative scripts or system maintenance tasks using these commands under normal circumstances, particularly on systems managed by IT personnel with scheduled or manual file management requirements.

  - **Correlate with user context:** Investigate the user account that executed these commands. Look for anomalies such as unexpected privilege escalation or execution outside of typical working hours. Review `LastLogin` and user groups for suspicious accounts.

  - **Cross-reference with other detections:** Review for concurrent alerts involving lateral movement, such as unauthorized access to sensitive directories or credential dumping techniques. Companion detections include anomalous account logins (e.g., Event ID 4624) or suspicious file modification timestamps.

  ### Prioritization

  This alert should be prioritized low to medium due to its informational severity. While file and directory discovery can aid in future attacks, the immediate impact on a critical system depends on the user's context and intentions. The likelihood of malicious activity using these commands is notable, especially when used in conjunction with known attack patterns.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activity or authorized file management processes that could inadvertently trigger alerts. Ensure that process logging is appropriately configured on all endpoints to capture these events, as missing logs would hinder accurate detection. Additionally, concurrent similar commands entered by legitimate users may obscure malicious attempts. A related detection to consider is monitoring for abnormal changes in file access patterns (e.g., unusual read or write operations), which can complement the findings from the alerts generated by this Sigma rule.

