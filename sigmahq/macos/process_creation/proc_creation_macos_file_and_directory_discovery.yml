title: File and Directory Discovery - MacOS
id: 089dbdf6-b960-4bcc-90e3-ffc3480c20f6
status: test
description: Detects usage of system utilities to discover files and directories
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1083/T1083.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-19
modified: 2022-11-25
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: macos
detection:
  select_file_with_asterisk:
    Image: '/usr/bin/file'
    CommandLine|re: '(.){200,}'     # execution of the 'file */* *>> /tmp/output.txt' will produce huge commandline
  select_recursive_ls:
    Image: '/bin/ls'
    CommandLine|contains: '-R'
  select_find_execution:
    Image: '/usr/bin/find'
  select_mdfind_execution:
    Image: '/usr/bin/mdfind'
  select_tree_execution|endswith:
    Image: '/tree'
  condition: 1 of select*
falsepositives:
- Legitimate activities
level: informational
note: |
  ### Technical Context
  This detection rule monitors for the execution of system utilities on macOS that are commonly used for file and directory discovery. The specific commands targeted include `file`, `ls`, `find`, `mdfind`, and `tree`, which can be employed by attackers to gather information about files and directories on a system. The use of these tools is often a precursor to more malicious actions, as attackers may attempt to identify sensitive files or locations in preparation for data exfiltration or further exploitation.

  The threat scenario emphasizes the objectives of reconnaissance and information gathering, frequently employed by threat actors during the initial stages of an attack, such as in the Discovery phase of the MITRE ATT&CK framework. Related MITRE techniques include **File and Directory Discovery (T1083)**, which specifically involves searching and identifying files and directories that may hold valuable information or represent potential targets for exploitation.

  Primary data sources for this detection include **process creation events**, which log command line executions and associated parameters, allowing for the identification of suspicious command usage that aligns with known reconnaissance techniques.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation events for the execution of file enumeration commands such as `file`, `ls`, `find`, `mdfind`, and `tree`. Look for anomalous command line arguments that may indicate malicious intent.
  - **Investigate Command-Line Arguments:** Pay attention to command-line arguments that are indicative of recursive or extensive searches, such as the `-R` option in `ls` or overly long command lines that might suggest automated discovery scripts.
  - **Correlate with User Behavior:** Compare the identified commands against the normal baseline of user and account activity. Look for unusual patterns, such as execution during off-hours or by accounts with no prior history of these activities.
  - **Inspect Related Artifacts:** Examine any associated files, directory modifications, or subsequent network activity that may have been initiated following the execution of discovery commands, as these can provide context and indicate further malicious actions.

  ### Prioritization
  This alert is classified as informational due to the potential for false positives from legitimate administrative activities. However, the execution of discovery commands can indicate an initial reconnaissance effort, raising the need for further investigation in environments where such actions are atypical.

  ### Blind Spots and Assumptions
  The detection rule may not account for cases where discovery commands are executed using other tools or scripts that do not match the specified image paths, resulting in possible blind spots in detection coverage. Additionally, the effectiveness of this rule assumes that process creation logging is enabled and properly configured on all macOS endpoints. Should logs not be available or if commands are obfuscated, the detection may yield incomplete results.

