note: |
  ### Technical Context

  This Sigma rule detects the execution of MeshAgent, a remote access tool (RAT) that adversaries can leverage for persistent access to compromised systems. Attackers may rename the MeshAgent binary to avoid detection, so matching command lines with the argument `--meshServiceName` is crucial to identifying misuse. This behavior correlates with the MITRE ATT&CK tactic **Command and Control (T1219.002)**.

  The primary telemetry source for this detection is the macOS process creation logs, specifically tracking the command line arguments used during the execution of processes. If the activity is malicious, it can lead to unauthorized remote control and potential data exfiltration. Importantly, detection of this command line does not confirm active compromise; it merely flags potential usage of a known remote access tool which could also be legitimate in certain use cases.

  ### Investigation Steps

  - **Review process creation logs: **Check for macOS Security Event ID 100 (process creation) and focus on command lines containing '--meshServiceName'. Look for unusual parent processes or process names that do not match standard applications.

  - **Identify legitimate usage: **Determine if there are documented business processes or applications that utilize MeshAgent within your environment. Cross-reference with previous logs to establish a baseline for normal operation.

  - **Correlate user accounts: **Investigate the user context under which the MeshAgent was executed. Confirm if the account has a legitimate reason to invoke remote access tools, or if it appears compromised.

  - **Check for renamed binaries: **If MeshAgent is detected, validate if the binary file retains its original name or if it has been renamed. Files with atypical or suspicious names may indicate evasion tactics.

  - **Analyze network activity: **Review network logs for outbound connections associated with MeshAgent. Check for unusual ports being accessed or IP addresses that have no known business rationale.

  - **Document historical usage: **Cross-reference historical execution evidence of MeshAgent against reported incidents or anomalous behaviors, especially if detected activity matches against known threat indicators published in threat intelligence feeds.

  ### Prioritization

  This alert is of medium severity due to the potential impact on system integrity and data confidentiality if MeshAgent is used maliciously. The likelihood of abuse is heightened given its association with persistent access in attack vectors. The behavior is increasingly weaponized in sophisticated attack campaigns, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection can be limited by environments where MeshAgent is used legitimately, leading to potential false positives. Ensure that logging for process creation is fully enabled on all macOS assets to maintain visibility. Similarly, legitimate administrative tasks may invoke this behavior, which can clutter alerts. Complementary detections (e.g., monitoring for unusual network connections or abnormal user behavior) can strengthen coverage against adversary techniques.

