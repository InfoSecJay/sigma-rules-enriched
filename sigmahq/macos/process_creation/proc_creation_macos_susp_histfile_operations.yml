logsource:
  product: macos
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - '.bash_history'
    - '.zsh_history'
    - '.zhistory'
    - '.history'
    - '.sh_history'
    - 'fish_history'
  condition: selection
falsepositives:
- Legitimate administrative activity
- Legitimate software, cleaning hist file
level: medium
note: |
  ### Technical Context

  This rule detects command line operations that reference shell history files, specifically files such as `.bash_history`, `.zsh_history`, and others associated with different shell environments. The primary intent behind these actions could be an attacker attempting to cover their tracks by manipulating or deleting command history. This activity is particularly relevant in the credential access phase of the attack lifecycle, aligning with the MITRE ATT&CK technique of T1552.003 (Mixed Command-Line Interface).

  The main telemetry sources for this detection are macOS process creation logs, focusing on command line arguments associated with commands manipulating shell history files. Malicious activity may allow an adversary to erase evidence of prior command-line actions, facilitating further exploitation. However, this detection alone does not confirm malicious intent, as legitimate administrative activity may also include similar file operations.

  ### Investigation Steps

  - **Review process creation logs:** Check for macOS Security Event ID 100 and look for commands involving `.bash_history`, `.zsh_history`, etc., in the command line. Identify if the context indicates a legitimate user or an unexpected system process.

  - **Analyze user context:** Validate the user associated with the command line operation. If the command is executed by an administrative user during non-business hours or for non-administrative tasks, it could indicate potential misuse.

  - **Check for command history manipulation:** Determine if the command included actions such as deleting (`rm`) or modifying (`echo`, `cat`, etc.) history files. Look for keywords indicating attempts to clear or edit history records.

  - **Investigate recent system changes:** Examine the timeline of system logins and any changes to user roles or privileges to understand the context behind the shell history file access. Identify any anomalies in user behavior.

  - **Identify legitimate administrative behavior:** Recognize expected administrative accesses to history files, such as routine maintenance, user account configuration, or user support tasks, which would usually occur during business hours and involve authorized personnel.

  - **Correlate with other endpoint activities:** Review logs from related sources, such as console logs or authentication events, to detect patterns of unsanctioned access or lateral movement associated with the suspicious file operations.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on system integrity and the likelihood of malicious abuse. While the risk of legitimate administrative activities triggering this alert exists, the erasure of command history can be a red flag for targeted attacks or insider threats, making it essential to validate the context of the alert.

  ### Blind Spots and Assumptions

  Limitations include legitimate user activities that may trigger the detection, such as standard system maintenance or cleanup operations. Required log configurations must ensure that macOS process creation logs are intact and correctly forwarded to the SIEM. Additionally, consider companion detections, such as monitoring for failed login attempts or unusual authentication events, which can provide more context to the suspicious behavior detected by this rule.

