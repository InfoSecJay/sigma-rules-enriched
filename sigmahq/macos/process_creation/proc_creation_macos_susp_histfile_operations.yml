logsource:
  product: macos
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - '.bash_history'
    - '.zsh_history'
    - '.zhistory'
    - '.history'
    - '.sh_history'
    - 'fish_history'
  condition: selection
falsepositives:
- Legitimate administrative activity
- Legitimate software, cleaning hist file
level: medium
note: |
  ### Technical Context
  This rule detects suspicious command-line operations on user shell history files, specifically targeting file accesses or modifications to common history files like `.bash_history`, `.zsh_history`, and others. Attackers may exploit these files to obscure their tracks, obfuscate command usage, or manipulate system configurations by altering executed commands. The typical attacker objectives include credential theft, system reconnaissance, or maintaining persistence by tampering with historical command logs.

  The relevant MITRE ATT&CK tactics include Credential Access (TA0006) and specifically the technique for Credential Dumping: Unattended (T1552.003). By monitoring accesses to shell history files, an organization can identify potential unauthorized activities indicative of malicious intent, such as attempts to erase traces of nefarious commands used during an attack.

  Primary data sources for detection include process creation logs from macOS systems, which will provide insights into command-line executions and any anomalies related to adversarial techniques.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events to investigate which user account accessed or modified the history files in question, noting any unusual timestamps or unexpected users.
  - **Analyze Command-Line Arguments:** Look for command-line arguments that suggest deletion or modification patterns of shell history files, which may indicate a user attempting to cover their tracks.
  - **Correlate with User Activity:** Cross-reference the access or modifications to history files with user authentication logs to determine if the activities align with known user behaviors or if they are anomalies warranting further investigation.
  - **Interrogate Endpoint Behavior:** If applicable, analyze other logs or alerts from endpoint detection tools that may highlight suspicious behavior around the same timeframe, providing context to the activity associated with the history files.

  ### Prioritization
  This alert is of medium severity as the detection of manipulations on shell history files can indicate potential preparatory actions by a malicious actor, aiming to execute further attacks while remaining undetected. However, legitimate administrative activities can also trigger the alert, necessitating careful analysis.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage for scenarios where shell history files are not modified directly but are instead deleted or replaced through other means, potentially evading this rule. The detection logic assumes that the modifications to history files are indicative of malicious activity, which may not always hold true in the case of benign administrative actions. For this alert to function effectively, active monitoring and logging of process creation events on macOS implementations are required, along with proper SIEM configuration to identify relevant log sources for malicious patterns.

