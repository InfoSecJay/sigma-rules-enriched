note: |
  ### Technical Context
  This detection rule identifies instances where network sniffing tools, specifically `tcpdump` and `tshark`, are used on macOS. When an adversary places a network interface into promiscuous mode, it allows them to passively capture sensitive data traversing the network, which may include credentials and private communications. This technique is often employed to gather intelligence on network traffic before executing malicious actions, such as credential theft or further lateral movement within the network.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Discovery** (TA0007), specifically **Network Sniffing** (T1040). Attackers may utilize these techniques to observe communications in order to identify targets and sensitive data. The primary logs that will provide the most compelling evidence are process creation events on macOS systems, particularly focusing on the execution of the aforementioned tools.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine recent process creation events on macOS systems to identify when `tcpdump` or `tshark` were executed. Analyze the user context and other associated processes that were running at that time.

  - **Correlate Network Activity**: Check network logs for unusual traffic patterns during the periods these tools were active. Look for significant spikes in data transmission or addresses that may indicate exfiltration attempts.

  - **Inspect for Promiscuous Mode**: Verify the network interfaces on affected systems to check if any have been switched to promiscuous mode. This can provide insights into whether the network traffic was intentionally captured by an adversary.

  - **Review User Behavior**: Investigate the user accounts that initiated the processes. Consider whether their behavior aligns with expected administrative tasks or if they present signs of malicious intent.

  ### Prioritization
  This alert is considered informational but significant because while using network sniffing tools can be part of legitimate administrative tasks, their presence in unusual contexts or under suspicious user accounts can strongly indicate potential adversarial activity. The impact of data exposure is high, making timely investigations crucial.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios where custom or lesser-known sniffing tools are employed that do not match the specified detection logic. The detection assumes that the tools will generate standard process creation logs, which requires appropriate logging settings on macOS systems. Additionally, legitimate administrative activities may generate false positives if not contextualized with user behavior data and their respective activities. Ensuring comprehensive logging and proper configurations is essential for this rule to operate effectively.

