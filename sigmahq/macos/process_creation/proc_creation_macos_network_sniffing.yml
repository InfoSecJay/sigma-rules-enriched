note: |
  ### Technical Context

  This rule detects the execution of network sniffing tools such as `tcpdump` and `tshark` on macOS systems. These tools can be leveraged by adversaries to place network interfaces into promiscuous mode, allowing them to intercept and analyze unencrypted traffic. This behavior aligns with MITRE ATT&CK techniques: Credential Access (T1040) and Discovery (T1087). The primary telemetry source for this detection includes process creation logs specific to macOS, particularly those detailing the execution of identifiable binaries.

  If malicious, the impact could involve unauthorized data interception, potentially exposing sensitive information such as credentials or proprietary data. Importantly, the detection of these processes does not automatically indicate malicious activity, as legitimate administrative and security monitoring tasks may also involve their use.

  ### Investigation Steps

  - **Identify related process execution:** Check for macOS Security Event ID 201 (Process started) to confirm the execution of `tcpdump` or `tshark`. Look for unexpected execution patterns or times that coincide with escalated or unusual access requests.

  - **Review network configuration:** Examine the network interface settings using commands like `ifconfig` to verify if the network interface is in promiscuous mode. Legitimate configurations typically do not require promiscuous mode unless for specific monitoring tasks.

  - **Analyze network traffic logs:** Inspect associated network logs for unusual spikes in traffic or unauthorized access attempts. Utilize system logs (Console.app or syslog) for potential indicators of misuse around the time of execution.

  - **Confirm user context:** Assess the user account that initiated the sniffing tools by correlating with macOS system logs. Administrative accounts may legitimately run these tools, while non-privileged accounts triggering this alert would raise concern.

  - **Check process lineage:** Analyze the parent process of the `tcpdump` or `tshark` execution (Event ID 201) using `pgrep` or `ps -ef`. Queries should reveal legitimate or suspicious parent process behaviors rather than isolated execution.

  ### Prioritization

  This alert should be treated with moderate priority given its potential for exposing sensitive data in high-trust environments. The likelihood of malicious use is significant, especially in enterprise contexts where sophisticated adversaries may target sensitive networks. Tools like `tcpdump` and `tshark` are well-known and often leveraged in data exfiltration scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if the adversary uses technique variations to mask their activity, such as executing these tools within a container environment. Reliance on adequate logging configurations is essential; ensure process creation and network flow logs are enabled for accurate detection. Legitimate administrative tasks like network troubleshooting could trigger this alert. A companion detection could involve monitoring for unusual firewall rule adjustments at the same time as sniffing tool execution to strengthen coverage against data exfiltration activities.

