note: |
  ### Technical Context
  This detection rule identifies instances when a TeamViewer session is initiated on a macOS host, uncovering potential remote access by unauthorized users. TeamViewer is a widely-used remote support tool, which, when misused, can lead to unauthorized access and control over a target system. Attackers may leverage such tools for initial access or persistence in a compromised environment, aiming to exfiltrate data, install malware, or execute commands remotely.

  This detection directly correlates with MITRE ATT&CK techniques such as **T1133 - External Remote Services**, which describes the exploitation of external remote access services, often leading to further malicious actions within an enterprise. The primary data source for this detection is **process creation events** on macOS systems, logging the executable details and command line arguments used to launch remote sessions.

  ### Investigation Steps
  - **Review Process Creation Events**: Examine the process creation logs from the macOS host for any instances where the TeamViewer processes are initiated, focusing on the command line arguments used.
  - **Inspect Incoming Connections Log**: Locate and analyze the "incoming_connections.txt" file within the TeamViewer directory on the affected host to verify connection details, including timestamps and connecting IP addresses.
  - **Correlate with User Activity**: Check user activity logs around the time of the detected session to determine if there is legitimate authorization for the TeamViewer connection, or if there are discrepancies suggesting unauthorized access.
  - **Monitor Network Traffic**: Analyze network flow logs for unusual or unauthorized external communication that matches the timing and patterns of TeamViewer session initiation.

  ### Prioritization
  The severity of this alert is considered low, primarily because legitimate usage of TeamViewer can lead to false positives. However, organizations must remain vigilant since unauthorized access through such tools can lead to significant security incidents.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments where TeamViewer is not logged sufficiently or where other forms of remote access are employed, potentially evading detection. The detection logic assumes that the TeamViewer processes are not renamed or altered, which could bypass these checks. Additionally, the rule relies on proper logging configurations on macOS to capture relevant process creation events effectively.

