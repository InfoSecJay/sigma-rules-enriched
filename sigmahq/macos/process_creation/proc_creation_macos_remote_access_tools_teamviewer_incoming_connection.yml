  ---

  ### Technical Context

  This detection rule identifies when a TeamViewer remote support session is initiated on a macOS host through a specific command line execution. The primary attacker objective could be to gain unauthorized remote access to the target system, potentially leading to data exfiltration or further malicious activities. This behavior aligns with the MITRE ATT&CK technique **T1133: External Remote Services**.

  The primary telemetry source is macOS process creation logs, specifically identifying processes related to TeamViewer, such as `TeamViewer_Service` and `TeamViewer_Desktop`. If the activity is malicious, it could compromise system integrity and data confidentiality. Importantly, this detection does NOT confirm that the session is malicious on its own, as it may represent legitimate remote support activities.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event ID **4688** indicating the creation of `TeamViewer_Desktop` with command line arguments `--IPCport 5939 --Module 1`. Valid instances should show normal TeamViewer user activity.

  - **Examine incoming connection logs:** Validate the presence of an **incoming_connections.txt** log file in the TeamViewer folder on the affected host. Legitimate connections typically have known source IPs associated with authorized support personnel.

  - **Cross-reference user activity:** Analyze user account activity around the time of the alert. Look for Event ID **7010** to confirm if a known user is logged in when the session starts, supporting benign usage.

  - **Assess for concurrent suspicious activity:** Check for other processes running at the same time using Sysmon Event ID **1**. Look for known malicious patterns, such as unauthorized script executions or file transfers indicative of exploitation.

  - **Identify external IP addresses:** Use firewall logs or network flow data to assess the source IP of the TeamViewer connection. If the source IP does not align with your organization's remote support policy, further investigation is warranted.

  ---

  ### Prioritization

  This alert is of **low severity** as it may often indicate legitimate remote support sessions. However, due to its potential for exploitation, it requires immediate review, especially in sensitive environments where unauthorized access could lead to significant data loss or system compromise.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate use of TeamViewer for remote support, which can generate benign alerts. Ensure that macOS systems are configured to log the necessary process creation details to support detection reliability. Additionally, sessions initiated by legitimate support personnel may trigger this alert. A companion detection for monitoring unauthorized command-line tools (such as PowerShell usage) can enhance overall security posture.

