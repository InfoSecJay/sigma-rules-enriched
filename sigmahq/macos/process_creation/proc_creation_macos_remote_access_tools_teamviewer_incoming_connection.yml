note: |
  ### Technical Context

  This rule detects when a TeamViewer session is initiated on a MacOS host. The behavior indicates that an external party has established remote access, which can be part of a larger strategy for maintaining persistence or conducting unauthorized actions. The relevant MITRE ATT&CK tactic is **Persistence**, and the technique is **External Remote Services (T1133)**. The primary telemetry source is MacOS process creation logs, specifically monitoring command-line arguments used to launch TeamViewer. The security impact is significant if malicious, as it can lead to unauthorized data access or exfiltration. This detection does NOT confirm malicious intent on its own, as legitimate TeamViewer use may trigger the rule.

  ### Investigation Steps

  - **Review process creation logs:** Check MacOS Security Event ID 4688 or equivalent logs for entries with `/TeamViewer_Desktop --IPCport 5939 --Module 1` in the CommandLine field. This ensures that you capture the exact session initiation.

  - **Investigate incoming connections history:** Validate connection details by reviewing the `incoming_connections.txt` log located in the TeamViewer folder on the affected MacOS host. Look for any unexpected IP addresses or timestamps that indicate unauthorized access.

  - **Assess system role and usage:** Determine if the affected host is legitimate for remote access tools, such as a system used for technical support or IT administration. Legitimate usage typically includes known IPs and scheduled sessions.

  - **Correlate with user activity:** Check user login logs (e.g., via macOS Unified Logs or system logs) to verify if the user was active on the machine at the time of the session startup. A mismatch may indicate unauthorized use.

  - **Identify high-confidence malicious indicators:** Look for unusual command-line arguments or unexpected parent processes in the logs, particularly any deviations from typical TeamViewer startup characteristics.

  - **Monitor related file artifacts:** Verify for unusual file creation or modifications in the TeamViewer directory, which could indicate subsequent malicious actions following the remote session.

  ### Prioritization

  The alert is of **low severity** given it may reflect legitimate TeamViewer usage. However, if occurring on critical systems without prior authorization, it becomes more concerning due to the potential for malicious exploitation. Remote access tools are commonly weaponized in targeted attacks, further emphasizing the need for scrutiny.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use legitimate operations to gain access. Required log sources are necessary to capture complete command-line details, which may not be available if logging is misconfigured. Legitimate activities could include IT support operations or authorized access by trusted external vendors. A related detection to enhance coverage is the monitoring of unusual network connections (e.g., external IP connections during unexpected hours).

