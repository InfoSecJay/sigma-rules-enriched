  ---

  ### Technical Context

  This Sigma rule detects the execution of the MacOS `tmutil` utility with a specific command to add a new file or directory exclusion to Time Machine backups. The likely attacker objective is to prevent sensitive or mission-critical files from being backed up, thereby reducing the chances of recovery after a compromise or data loss incident. This behavior relates to the MITRE ATT&CK tactic of **Impact** (TA0040) and technique **Network Denial of Service** (T1490).

  The primary telemetry sources for this detection are process creation logs on MacOS, specifically targeting `tmutil` executions. If malicious, the impact could be significant, especially if an adversary seeks to manipulate backups to cover their tracks or encrypt critical data. This detection does NOT confirm malicious activity on its own; it merely indicates that an exclusion from Time Machine has been added, which could also be legitimate administrator behavior.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Examine logs for Security Event ID 4688 or equivalent MacOS Syslog entries (with fields indicating `Image` and `CommandLine`). Look for entries where `Image` ends with `/tmutil` and the `CommandLine` contains `addexclusion`.

  - **Evaluate the user context:** Identify the user account that executed the command. Legitimate activity would typically involve known administrators or IT personnel executing `tmutil` for maintenance. Unrecognized accounts running the command may require deeper investigation.

  - **Inspect exclusion list changes:** Validate the additions in the Time Machine exclusion list by checking system preferences (`/Library/Application Support/com.apple.TimeMachine/`) or running the command `tmutil isexcluded`. Look for new entries that might indicate malicious intent.

  - **Correlate with other security events:** Investigate if `tmutil` execution coincides with other suspicious activities on the same machine, such as process injection or unauthorized file access (e.g., via MacOS Audit logs or EDR solutions).

  - **Check for artifacts of file changes:** If files linked to the exclusion are critical, look for evidence of deletion or modifications around the time of `tmutil` execution. Monitor file system activity through logs for deleted or renamed files that could have been manipulated prior.

  ---

  ### Prioritization

  This alert warrants medium priority due to the potential impact on data integrity and recovery operations in the event of a compromise. The likelihood of malicious abuse is moderate, as this behavior can be weaponized by adversaries trying to cover tracks or disrupt recovery efforts. Regular monitoring of critical systems designated for essential backups is crucial.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by improper logging configurations; ensure process creation logs are enabled for comprehensive visibility. Legitimate administrative tasks can trigger this alert, especially during maintenance or reconfiguration of backup settings. A companion detection is the tracking of any excessive file deletions or modifications during or after `tmutil` executions, which can provide additional context to the activity observed.

