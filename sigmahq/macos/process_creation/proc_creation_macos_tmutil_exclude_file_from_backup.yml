title: New File Exclusion Added To Time Machine Via Tmutil - MacOS
id: 9acf45ed-3a26-4062-bf08-56857613eb52
status: test
description: |
  Detects the addition of a new file or path exclusion to MacOS Time Machine via the "tmutil" utility.
  An adversary could exclude a path from Time Machine backups to prevent certain files from being backed up.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1490/T1490.md#atomic-test-12---disable-time-machine
- https://www.loobins.io/binaries/tmutil/
author: Pratinav Chandra
date: 2024-05-29
tags:
- attack.impact
- attack.t1490
logsource:
  category: process_creation
  product: macos
detection:
  selection_img:
  - Image|endswith: '/tmutil'
  - CommandLine|contains: 'tmutil'
  selection_cmd:
    CommandLine|contains: 'addexclusion'
  condition: all of selection_*
falsepositives:
- Legitimate administrator activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the `tmutil` utility on macOS is used to add a new file or path exclusion within Time Machine backups. The potential threat scenario involves an adversary intentionally modifying backup settings to prevent sensitive files from being captured during backup processes. This may be part of a broader strategy to conceal malicious activity or maintain persistence within a compromised system.

  The relevant MITRE ATT&CK tactics at play are **Impact** (TA0005) and the specific technique **Data Destruction** (T1490). By excluding files from backups, attackers seek to eliminate traces of their activities, impacting an organization's ability to recover from incidents or understand the scope of a breach.

  Primary data sources include **process creation events** that log the execution of the `tmutil` command, specifically any usage involving the `addexclusion` parameter. Additionally, logs from system monitoring tools may provide context around legitimate administrator activities which could coexist with malicious usage.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate process creation logs for entries that show the invocation of the `tmutil` command with parameters related to `addexclusion`. This will help identify any unauthorized modifications to backup settings.

  - **Check System Integrity Logs:** Examine logs from file integrity monitoring solutions to determine if files or directories of interest have been excluded recently. This can indicate potential malicious activity if the exclusions correlate with sensitive data locations.

  - **Assess User Context:** Look into the user context and privileges associated with the `tmutil` command execution. Ensure that the actions were performed by authorized administrators rather than rogue accounts.

  - **Monitor for Subsequent Activity:** After identifying exclusions, look for related suspicious activities, such as attempts to access or manipulate excluded files, as well as any escalated privileges that may coincide with the `tmutil` usage.

  ### Prioritization
  The severity of this alert is medium, as the ability to manipulate Time Machine backups can greatly impact an organization's incident response and recovery capabilities, making it a significant indicator of potential compromise.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage due to the reliance on process creation logs, which may not capture all contexts where `tmutil` could be manipulated, such as preconfigured scripts or remote command execution tools. This detection assumes that the environment is configured to log such events comprehensively. If logging for process creation is not enabled or if exclusions are added in a legitimate context, it can result in false positives. Additionally, the rule assumes that all legitimate administrator activity has been captured and analyzed to distinguish between benign and malicious usage.

