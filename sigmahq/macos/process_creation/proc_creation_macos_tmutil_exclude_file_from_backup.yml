note: |
  ### Technical Context

  This detection identifies the addition of a new file or path exclusion in macOS Time Machine via the `tmutil` utility. An attacker may utilize this command to prevent certain files from being backed up, thereby facilitating data exfiltration or hiding persistent threats. The relevant MITRE ATT&CK technique is Data Destruction (T1490). The primary telemetry sources are macOS process creation logs, specifically focusing on the execution of the `tmutil` utility. If the activity is malicious, it could lead to critical data loss or undetected compromise within the environment. This detection does NOT confirm malicious intent on its own; legitimate administrative activities can trigger the same alerts.

  ### Investigation Steps

  - **Identify the execution of `tmutil`:** Review macOS process creation logs for Event ID correlating to the usage of `tmutil`. Specifically, check for logs that contain the command line arguments with the substring `addexclusion`.

  - **Validate the command line arguments:** Look for the specific command line containing `addexclusion`. Determine whether the excluded paths correspond to sensitive files or directories typically backed up by Time Machine, such as `/Users/<username>/Documents`.

  - **Examine user context and privileges:** Check the user account that executed the command in the logs. Compare it against known administrative users to determine if legitimate or suspicious users executed the command.

  - **Review legitimate use cases:** Understand common patterns of legitimate `tmutil` usage by administrators, such as the exclusion of large files or directories to manage backup space. Document what typical exclusion paths look like in your environment.

  - **Cross-reference against recent sensitive actions:** Investigate recent sensitive file accesses or modifications (Event ID 100) in connection with the time of the `tmutil` command execution. Look for high-value files that were accessed or could potentially be targets for exclusion.

  ### Prioritization

  This alert is of medium severity due to the potential impact of an affected system's integrity and the likelihood of malicious abuse, particularly in environments handling sensitive data. While this behavior can be legitimate, its specificity to the `tmutil` command increases the risk of exploitation by adversaries looking to evade detection.

  ### Blind Spots and Assumptions

  Detection may miss activities if logs are not configured to capture all process creation events accurately, particularly in tightly controlled system environments. There are legitimate scenarios where administrators adjust Time Machine settings, which could trigger this alert. Companion detections like monitoring for unusual file access patterns or processes modifying backup configurations will offer stronger coverage against data exfiltration attempts.

