note: |
  ### Technical Context
  This detection rule identifies instances where systems running macOS undergo a shutdown or reboot process, potentially triggered by an adversary attempting to disrupt access to critical systems or to facilitate destruction of data. The presence of shutdown commands such as `/shutdown`, `/reboot`, or `/halt` could indicate malicious activities, especially if occurring out of normal usage patterns. Attackers may use these actions as part of a larger strategy to either escape detection after a compromise or hinder incident response efforts.

  The associated MITRE ATT&CK techniques include **T1529: System Shutdown/Reboot**, which falls under the Impact tactic. This action of shutting down or rebooting systems may be leveraged to counteract investigations or damage the operational capability of victims.

  Key telemetry sources for this detection include macOS process creation events, as these logs would provide evidence of command execution related to the shutdown or reboot operations.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine macOS process creation logs for instances of the shutdown command (`/shutdown`, `/reboot`, or `/halt`). Look for unusual timestamps or user accounts that do not align with typical administrative practices.

  - **Check User Activity Context**: Investigate the user accounts executing these commands. If an account typically does not perform shutdown actions, it could indicate a potentially malicious activity occurring under that account.

  - **Correlate with Other Events**: Cross-reference the shutdown/reboot actions with other telemetry, such as remote access logs or alerts indicating prior suspicious behavior, to establish a timeline of events leading up to the shutdown.

  - **Analyze System and Application Logs**: Look into the system and application logs surrounding the time of the shutdown. This could reveal what processes or applications were running prior to the shutdown and might provide context for why the action was taken.

  ### Prioritization
  This alert is categorized as informational due to its potential for both legitimate administrative actions and malicious exploitation. While normal administrative users can initiate shutdowns, unauthorized or suspicious shutdown commands from unexpected accounts warrant closer scrutiny given their potential to disrupt operations during critical events.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage, particularly in distinguishing between legitimate administrative shutdowns and malicious actions, as genuinely necessary reboots or shutdowns are common in organizational environments. The detection logic assumes that all shutdown activities are abnormal when executed outside regular operational windows, potentially leading to false positives. For effective detection, system logging must be configured to capture detailed process execution events consistently.

