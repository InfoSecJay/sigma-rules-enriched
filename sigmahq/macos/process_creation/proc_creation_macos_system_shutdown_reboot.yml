note: |
  ### Technical Context

  This Sigma rule detects system shutdown or reboot commands executed on macOS systems. Such commands may be used by adversaries to disrupt services, hinder forensic analysis, or facilitate data destruction. The likely attacker objective is to cause instability in operations or continue malicious actions without detection. This behavior relates to the MITRE ATT&CK technique T1529, which focuses on the impact of terminating a session or hindering access. The primary telemetry source for this detection is the macOS process creation logs, specifically targeting executable paths for shutdown, reboot, or halt commands. The security impact of malicious activity includes system downtime, data loss, and potential unauthorized access to sensitive data. However, this detection does NOT confirm malicious intent on its own without additional context or corroborating evidence.

  ### Investigation Steps

  - **Identify command sources:** Review process creation logs for Event ID related to process execution, focusing on paths ending with `/shutdown`, `/reboot`, or `/halt`. Analyze username and timestamps to determine if the actions align with known administrative activities.

  - **Assess user intent:** Investigate the user account that triggered the shutdown or reboot command. Check for unusual behavior prior, such as concurrent logins from different locations or failed login attempts in logs (e.g., Console logs).

  - **Look for accomplice actions:** Analyze Mac system logs (e.g., unified logs or syslog) for other suspicious commands or activity (e.g., unauthorized file deletions or modifications) in the timeframe surrounding the shutdown/reboot.

  - **Review legitimate activities:** Note that legitimate administrative actions may follow similar patterns. For instance, IT personnel may perform a reboot after scheduled updates, which can be validated against change management records.

  - **Correlate with other alerts:** Check for any related security alerts around the same time, such as unauthorized access attempts or privilege escalations, which may indicate a coordinated attack rather than a benign administrative task.

  ### Prioritization

  This alert should be treated as a medium severity due to its potential impact on critical systems and services. The likelihood of malicious exploitation exists, especially if the action is performed by non-administrative accounts or correlates with unusual activity. While shutdown commands can be legitimate, they are often weaponized during attacks for disruption.

  ### Blind Spots and Assumptions

  The main detection limitation is the possibility of legitimate shutdowns or reboots performed by users with administrative privileges, which may obscure malicious intent. Reliable detection requires sufficient logging configurations to ensure macOS audit trails capture all relevant process executions. Legitimate IT maintenance tasks or user-initiated system shutdowns may trigger this alert. A companion detection would include monitoring for login/logout events or suspicious process creation patterns that coincide with this behavior for comprehensive analysis.

