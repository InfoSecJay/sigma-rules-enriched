logsource:
  category: process_creation
  product: macos
detection:
  selection_dscl:
    Image|endswith: '/dscl'
    CommandLine|contains: 'create'
  selection_sysadminctl:
    Image|endswith: '/sysadminctl'
    CommandLine|contains: 'addUser'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This detection rule identifies the creation of local user accounts on macOS systems. Such accounts can be leveraged by attackers to establish persistence without needing to deploy canonical remote access tools, enabling continued access to compromised systems. Attackers may create accounts to escalate privileges, concealed under legitimate administrative actions, thereby enabling further exploitation of the system or network.

  Relevant MITRE ATT&CK tactics for this rule include **Persistence (TA0003)**, specifically the technique **Account Creation (T1136.001)**. By creating new user accounts, an attacker can maintain access even if their initial foothold is identified and removed. Analysts should focus on log sources that provide insights into process creations and command-line arguments utilized during user account management.

  The primary data sources useful for this detection include **process creation logs**, particularly those capturing command-line activity of system administration tools (e.g., `dscl` and `sysadminctl`) used for adding user accounts on macOS systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for any instances of `dscl` or `sysadminctl` execution with `create` or `addUser` commands. Pay attention to the context in which these commands were issued.
  - **Correlate with User Activity**: Look for correlations between newly created user accounts and any known legitimate administrative actions within the same timeframe. Validate whether the actions align with expected workflows.
  - **Inspect User Account Attributes**: Investigate the attributes of newly created accounts, such as associated groups, permissions, and last access times to identify any suspicious configurations or potential misuse.
  - **Monitor Related Network Traffic**: Check for unusual outbound connections or access attempts from the newly created accounts. This can provide insights into any ongoing malicious activity tied to the accounts.

  ### Prioritization
  The severity of this alert is low; however, it warrants investigation due to the potential for malicious activities stemming from unauthorized account creation. Given the importance of maintaining strict control over user accounts, any unusual account creation should be assessed promptly to mitigate potential threats.

  ### Blind Spots and Assumptions
  One significant blind spot in this detection logic is its inability to capture legitimate administrative activities that may also involve the creation of user accounts, which can lead to false positives. It assumes that all instances of the `create` or `addUser` command indicate suspicious activity, which may not always be the case. Additionally, proper logging configuration is essential; process creation logging must be enabled and adequately configured on macOS systems for this alert to be effective.

