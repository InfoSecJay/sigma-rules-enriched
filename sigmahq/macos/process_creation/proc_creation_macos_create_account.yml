note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of local user accounts on macOS systems using the `dscl` or `sysadminctl` command-line tools. The likely attacker objective is to establish persistence by creating unauthorized accounts that may not require remote access tools, facilitating prolonged access to compromised systems. This activity aligns with the MITRE ATT&CK technique T1136.001 (Create Account). Primary telemetry sources include macOS process creation logs, specifically related to command execution events involving `dscl` and `sysadminctl`. If malicious, the creation of unauthorized accounts can lead to significant security breaches, data exfiltration, or lateral movement within the environment. This detection does NOT confirm malicious intent on its own, as legitimate administrative actions may produce similar log entries.

  ---

  ### Investigation Steps

  - **Check process creation logs**: Review macOS Security Event logs for Event ID related to process creations, specifically looking for logs with command lines containing `create` or `addUser` in connection with `dscl` or `sysadminctl`.

  - **Evaluate command context**: Verify the user who executed the command. Elevated privilege usage (e.g., root or admin users) for creating accounts outside of standard operational hours may indicate malicious behavior.

  - **Identify user account details**: Cross-reference newly created user accounts against the approved user account list. Accounts not recognized or created by unauthorized personnel should be flagged for further investigation.

  - **Review recent administrative activities**: Establish a baseline of legitimate administrative activities. Confirm if the logs show recent similar user creation activities approved by IT or system administrators, especially during maintenance windows.

  - **Correlate with other alerts**: Check for related alerts or suspicious activity within a close timeframe (e.g., failed login attempts, rapid account creations) to assess if these actions are part of a larger attack pattern.

  - **Validate audit logs**: If available, check for macOS audit logs pertaining to user account modifications and confirm the timestamp of the account creation aligns with user origin.

  ---

  ### Prioritization

  This alert poses a low severity in the context of a mature enterprise SOC, as local user account creation can often result from legitimate administrative tasks. However, the behavior is indicative of a potentially malicious action, especially if occurring under abnormal conditions. While not commonplace, the creation of unauthorized accounts can facilitate significant security concerns if an attacker exploits such persistence.

  ---

  ### Blind Spots and Assumptions

  Detection is limited to scenarios where logs from `dscl` or `sysadminctl` are reliably captured, particularly if logging configurations are not enabled for process creation events. Legitimate user account creation during scheduled maintenance or configuration updates may trigger alerts. A related detection method includes monitoring for suspicious login attempts or unauthorized access to systems post-account creation, which can strengthen overall coverage against potential adversary movements.

