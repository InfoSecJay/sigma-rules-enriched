detection:
  selection_dscl:
    Image|endswith: '/dscl'
    CommandLine|contains: 'create'
  selection_sysadminctl:
    Image|endswith: '/sysadminctl'
    CommandLine|contains: 'addUser'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This Sigma rule detects the creation of a new local user account on macOS systems using the `dscl` or `sysadminctl` commands. Attackers may leverage this behavior to establish persistence, enabling future access without relying on remote tools, particularly in scenarios where remote access may be closely monitored or blocked. This behavior aligns with the MITRE ATT&CK technique: **T1136.001 - User Account Creation**, categorized under the persistence tactic.

  Primary telemetry sources include macOS process creation logs, specifically from Security Event IDs related to command executions involving `dscl` or `sysadminctl`. If malicious, the introduction of a hidden user account can facilitate unauthorized activity or compromise on the system. However, this detection alone does NOT confirm malicious intent; legitimate administrative actions may also result in new user account creation.

  ### Investigation Steps

  - **Check process creation logs:** Review process creation logs (Sysmon Event ID 1) for entries related to `/dscl` or `/sysadminctl` execution. Look for the specific `CommandLine` arguments such as `create` or `addUser`.

  - **Examine user account details:** If a new account is created, check the attributes of the user against legitimate accounts. Valid accounts typically have parameters such as a user shell (e.g., `/bin/bash`) and appropriate group memberships, while suspicious accounts may have unusual usernames or elevated privileges.

  - **Review recent logins:** Cross-reference authentication logs (e.g., `/var/log/authd.log`) to identify login attempts using the newly created account. Legitimate accounts typically show access patterns consistent with business hours, while malicious accounts may have login attempts at unusual times.

  - **Identify command context:** Analyze whether `dscl` or `sysadminctl` commands were executed as part of an admin session or script. Legitimate admin use would include detailed command syntax and clear intentions regarding user management. Malicious attempts might lack clarity in command usage.

  - **Investigate linked processes:** Trace any linked or subsequent processes spawned after account creation. Malicious indicators could include processes that exhibit aberrant behavior or initiate network communications shortly after account setup.

  - **Evaluate endpoint roles:** Determine the role of the affected endpoint. Creation of accounts on critical assets (e.g., servers, sensitive workstations) should raise the alert level, necessitating deeper scrutiny compared to less critical endpoints.

  ### Prioritization

  This alert should be considered low severity due to the potential for benign administrative actions to trigger it. However, given that newly created local accounts can be weaponized for persistent access, it's important to closely analyze associated behaviors and system roles to gauge the level of threat they may pose.

  ### Blind Spots and Assumptions

  Detection could face limitations if logs are not fully operational or if the commands are run using obfuscated methods. Make sure the relevant command logging and Sysmon logging configurations are enabled for comprehensive coverage. Legitimate activities such as IT maintenance or user account provisioning may trigger this rule. Related detections could include monitoring unusual login activity or command execution for enhancing detection efficacy.

