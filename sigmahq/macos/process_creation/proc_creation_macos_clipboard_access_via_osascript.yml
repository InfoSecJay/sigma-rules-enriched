logsource:
  product: macos
  category: process_creation
detection:
  selection:
    Image|endswith: '/osascript'
    CommandLine|contains|all:
    - ' -e '
    - 'clipboard'
  filter_optional_opencode:
        # OpenCode uses osascript to handle copying text from the TUI on MacOS devices. See https://github.com/anomalyco/opencode/blob/ca723f1cbc6fc4244ae57e61e9de8c4e37380ed4/packages/opencode/src/cli/cmd/tui/util/clipboard.ts#L65 for reference.
    ParentImage|endswith: 'opencode'
    CommandLine|contains|all:
    - 'osascript'
    - ' -e '
    - 'set imageData to the clipboard'
    - 'set fileRef'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate clipboard utilities and automation scripts that read or write 
  clipboard content
- Developer tools and IDEs that use osascript for clipboard integration
level: medium
note: |
  ### Technical Context

  This rule detects the use of `osascript` specifically targeting clipboard access on macOS systems. An attacker may aim to illicitly collect sensitive information that has been copied to the clipboard, such as passwords or proprietary data, potentially to facilitate further malicious activities. This behavior aligns with the MITRE ATT&CK Collection tactic (T1115) and Execution tactic (T1059.002), emphasizing how adversaries can leverage scripting languages for exploitation.

  Primary telemetry sources include macOS process creation logs specific to `osascript`, which can reveal command-line arguments indicating clipboard access attempts. If successful, such activity could result in severe data compromise and exfiltration risks. Importantly, this detection alone does not confirm malicious intent, as legitimate applications may also utilize clipboard access for benign purposes.

  ### Investigation Steps

  - **Review process creation logs:** Look for `Process Creation` logs (e.g., `syslog` or `Unified Logs`) where `Image` ends with `/osascript`. Check fields for `CommandLine` containing `-e` and `clipboard` to identify potential malicious behavior.

  - **Verify command-line arguments:** Focus on any `osascript` commands that include arguments like `set imageData to the clipboard`. If these arguments are present, prioritize further analysis, as this indicates clipboard manipulation.

  - **Identify expected behavior:** Legitimate clipboard utilities and automation scripts will have similar command patterns, but they may not include sensitive data manipulation commands. Validate any legitimate context in which clipboard access occurs.

  - **Correlate with high-confidence indicators:** Investigate related alerts or historical behaviors indicating similar `osascript` usage associated with known malicious actors or techniques. Look for any unusual parent processes or associated network activity around the time of clipboard access.

  - **Assess host role and criticality:** Consider the role of the affected macOS device (e.g., developer machines vs. user endpoints). Critical assets may warrant immediate quarantine or deeper investigation if malicious use is detected.

  ### Prioritization

  This alert should be treated as medium severity. The potential impact can be high if sensitive data is exfiltrated. The likelihood of malicious abuse is moderate since clipboard access can often be legitimate, but the use of `osascript` in this context is a common tactic among attackers.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques, where attackers manipulate the Clipboard without utilizing `osascript`, thus avoiding detection. Reliable coverage requires proper logging configurations on macOS systems, specifically ensuring that process creation logs are enabled. Legitimate activities may trigger this alert, particularly from development tools using `osascript`. A companion detection related to unauthorized AppleScript activity (e.g., script execution from unusual paths) could bolster overall detection efforts.

