description: Detects access to clipboard content via osascript, which may be 
  used for data collection but also occurs in legitimate clipboard utilities and
  automation scripts
references:
- https://www.sentinelone.com/blog/how-offensive-actors-use-applescript-for-attacking-macos/
author: Sohan G (D4rkCiph3r)
