note: |
  ### Technical Context
  This rule detects changes made to file time attributes using specific command-line parameters that are often utilized by attackers to obscure the presence and modifications of files on a compromised system. By altering the timestamps, attackers aim to manipulate file metadata, making it difficult for defenders to detect unauthorized file access, changes, or creations. The primary objective of such behavior is to enhance operational security and evade detection, facilitating further malicious activities.

  Related to the MITRE ATT&CK framework, this detection falls under the **Defense Evasion** tactic (T1070), specifically technique **T1070.006: Timestomp**. This technique describes the manipulation of timestamps for files in order to mislead forensic investigations or detection mechanisms. The primary data source for this detection will be **process creation events**, particularly on macOS systems where the `touch` command is frequently used to change file timestamps.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of the `touch` command being run, focusing on command-line arguments such as `-t`, `-acmr`, `-d`, and `-r` that indicate specific timestamp modifications.
  - **Correlate with File Access Logs**: Identify any recent file creations or modifications in conjunction with the detected process to assess whether the changes align with typical user activity or seem suspicious.
  - **Examine User Activity**: Investigate the user account that executed the command to determine if the behavior is consistent with their normal activities or indicative of potential compromise.
  - **Assess File Integrity**: Check the integrity of files or directories affected by the timestamp changes to identify any unauthorized modifications or new files that may require further review.

  ### Prioritization
  The severity of this alert is considered medium because while timestamp manipulation is a common technique used by attackers to conceal their actions, the impact of such events can vary widely depending on the context, such as affected files and associated activities.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the potential for legitimate use of the `touch` command by administrators for maintenance tasks, leading to possible false positives. The detection logic assumes that such timestamp manipulations are not part of typical user workflows. Additionally, this alert requires comprehensive logging of process creation events on macOS systems to function effectively, alongside a known baseline of normal operational behavior for user accounts within the organization.

