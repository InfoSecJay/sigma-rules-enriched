  ---

  ### Technical Context

  This Sigma rule detects the modification of file time attributes using the `touch` command on macOS systems. Attackers may use this technique to obscure the last modified, access, or change times of files as part of an effort to hide malicious activities or maintain persistence. This behavior corresponds to the MITRE ATT&CK technique **T1070.006 - Timestomp**.

  The primary telemetry source required for this detection is macOS process creation logs, specifically for the `touch` command. If malicious, such behavior could allow an attacker to erase indicators of compromise, making it more difficult for security teams to analyze and respond to the incident. However, this detection alone does not confirm malicious intent, as there may be benign reasons for changing file timestamps.

  ---

  ### Investigation Steps

  - **Check process creation events:** Review macOS process creation logs (Audit Event ID 100) for instances of the `touch` command used with options `-t`, `-acmr`, `-d`, or `-r`. Identify the user and context under which the command was executed.

  - **Identify file targets:** Cross-reference process creation logs with file system change logs (e.g., `/var/log/system.log`), focusing on which files were affected by the timestamp modifications. Look for sensitive files that should not typically be altered.

  - **Determine user context:** Assess if the `touch` command was executed by a legitimate user or an unusual account with high privileges. Legitimate timestamps may include regular administrative tasks or scheduled maintenance by IT staff.

  - **Monitor for related behaviors:** Following any detected use of `touch`, check for additional malicious indicators, such as unusual modifications to system binaries or configuration files in `/etc/`, which may indicate a broader compromise (Event ID 100 + modification timestamps).

  - **Validate for potential evasion:** Investigate if file timestamps were altered frequently or in late hours when legitimate operational activity is low, potentially indicating an evasion strategy in play.

  ---

  ### Prioritization

  This alert should be regarded with medium priority. The potential impact is significant if malicious actors are using timestamp manipulation to obscure their activities. While this technique is not uncommon, its occurrence warrants immediate review due to its connection to stealthy attack behaviors.

  ---

  ### Blind Spots and Assumptions

  Possible evasion techniques include command-line obfuscation or using alternative tools that achieve the same outcome without triggering logging. Reliable detection requires appropriate logging configurations on macOS systems to capture process activity accurately. Legitimate administrative actions, such as routine system maintenance or file sharing, may generate similar alerts. A related detection to consider is file modification alerts from other system tools, such as `chmod` or `chown`, that might indicate further attempts to hide activities.

