note: |
  ### Technical Context

  This Sigma rule detects the alteration of file time attributes, which can indicate an attempt to conceal the creation or modification timestamp of files on macOS systems. The likely objective is to obfuscate suspicious activity, making it harder for defenders to identify changes in the environment. This behavior fits into the MITRE ATT&CK framework under the tactic "Defense Evasion" and the technique "Indicator Removal on Host" (T1070.006). The primary telemetry source is the macOS process creation logs, specifically the event indicating the execution of commands that manipulate file timestamps. If malicious, such changes can hinder forensic investigations and allow adversaries to blend in with normal operations. Importantly, this detection does NOT confirm malicious intent on its own; legitimate users may also modify timestamps.

  ### Investigation Steps

  - **Review process creation logs**: Examine macOS process creation logs for Event ID related to file manipulation with `Image` ending in '/touch'. Identify timestamps for both the modified file and the invoking command.

  - **Check command line arguments**: Filter for specific command line arguments such as '-t', '-acmr', '-d', or '-r'. Confirm if these parameters align with contextual file operations; parameters should indicate suspicious intent if associated with unauthorized access.

  - **Audit the affected file’s attributes**: Use `ls -l` or `stat` commands to view the latest access, modification, and change timestamps of the affected file. Legitimate use would show timestamps consistent with known, expected user behavior.

  - **Verify user activity**: Check user authentication logs or recent shell command logs to assess whether the user has legitimate access to modify files in the relevant directory. Unusual patterns, such as non-administrative users executing these commands, could indicate malicious activity.

  - **Identify persistent anomalous behavior**: Look for repeated executions of the '/touch' command with timestamp changes across multiple files within a short timeframe. Legitimate use would typically involve sporadic or purposeful file updates rather than broad, frequent changes.

  - **Examine file ownership and permissions**: Check if there has been an unexpected change in the ownership or permissions of the affected files using `ls -l` and `chmod` logs. Malicious indicators include unauthorized user accounts having elevated permissions for critical files.

  ### Prioritization

  This alert should be treated with medium severity. If the affected system contains sensitive or critical data, the impact of malicious file attribute changes can be significant. Additionally, while this behavior can be indicative of an adversarial tactic, it is relatively rare for legitimate users to modify timestamps without clear operational need.

  ### Blind Spots and Assumptions

  The detection may have limitations due to potential disablement of logging or usage of authorized tools by legitimate users for file maintenance. Required log sources include process creation logs from macOS, with necessary configurations to capture all relevant command line arguments. Legitimate system maintenance or backup scripts can inadvertently trigger this alert. A related detection, such as monitoring for unauthorized file access or modification events, would provide stronger context for potential malicious activity.

