title: Disable Security Tools
id: ff39f1a6-84ac-476f-a1af-37fcdf53d7c0
status: test
description: Detects disabling security tools
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-19
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: macos
detection:
  launchctl_unload:
    Image: '/bin/launchctl'
    CommandLine|contains: 'unload'
  security_plists:
    CommandLine|contains:
    - 'com.objective-see.lulu.plist'                             # Objective-See firewall management utility
    - 'com.objective-see.blockblock.plist'                       # Objective-See persistence locations watcher/blocker
    - 'com.google.santad.plist'                                  # google santa
    - 'com.carbonblack.defense.daemon.plist'                     # carbon black
    - 'com.carbonblack.daemon.plist'                             # carbon black
    - 'at.obdev.littlesnitchd.plist'                             # Objective Development Software firewall management utility
    - 'com.tenablesecurity.nessusagent.plist'                    # Tenable Nessus
    - 'com.opendns.osx.RoamingClientConfigUpdater.plist'         # OpenDNS Umbrella
    - 'com.crowdstrike.falcond.plist'                            # Crowdstrike Falcon
    - 'com.crowdstrike.userdaemon.plist'                         # Crowdstrike Falcon
    - 'osquery'                                                  # facebook osquery
    - 'filebeat'                                                 # elastic log file shipper
    - 'auditbeat'                                                # elastic auditing agent/log shipper
    - 'packetbeat'                                               # elastic network logger/shipper
    - 'td-agent'                                                 # fluentd log shipper
  disable_gatekeeper:
    Image: '/usr/sbin/spctl'
    CommandLine|contains: 'disable'
  condition: (launchctl_unload and security_plists) or disable_gatekeeper
falsepositives:
- Legitimate activities
level: medium
note: |
  ### Technical Context
  This rule detects actions that involve disabling security tools on macOS systems. Attackers often attempt to disable security mechanisms or services such as endpoint detection and response (EDR) solutions, firewalls, and application whitelisting to conceal their activities or facilitate malicious operations. By doing so, they can gain a foothold in the environment without the usual alerts triggered by security defenses.

  The relevant MITRE ATT&CK techniques that this rule associates with are T1562.001 (Impair Defenses: Disable or Modify Tools), which specifically addresses the disabling or circumvention of security configurations. The detection focuses on specific commands that manipulate macOS security tools and settings, making it an important signal for identifying potentially malicious activity.

  Primary data sources for this detection include process creation logs that capture command-line arguments, which can reveal attempts to unload services or modify security-related plists on macOS devices.

  ### Investigation Steps
  - **Review Process Logs:** Examine process creation logs to identify any instances of `launchctl unload` commands being executed, along with the associated command line arguments.
  - **Analyze Security Tool Activity:** Investigate the command line for any references to known security-related plists or tools such as CrowdStrike, Carbon Black, and other defense utilities that may be targeted.
  - **Correlate with Other Security Events:** Assess any other security events that coincide with the detection timeframe to uncover potential coordinated attacks or other evasive actions taken by the adversary.
  - **Check System Integrity:** Ensure that the integrity of the security tools remains intact by verifying their operational status and configuration settings following potential incidents.

  ### Prioritization
  The alert's severity is considered medium due to the potential for significant security breaches if attackers successfully disable key security defenses. Disabling these tools often serves as a precursor to further malicious activities, making timely investigation crucial.

  ### Blind Spots and Assumptions
  This detection may miss instances where security tools are manipulated without using the monitored commands, particularly if attackers utilize uncommon or legitimate methods to evade detection. The assumptions made include that the prescribed processes will always be logged under the expected conditions. Moreover, for this alert to function effectively, detailed logging of process creation events must be enabled across all macOS endpoints alongside unfiltered command-line logging.

