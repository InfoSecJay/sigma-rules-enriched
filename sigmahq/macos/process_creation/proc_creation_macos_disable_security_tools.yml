title: Disable Security Tools
id: ff39f1a6-84ac-476f-a1af-37fcdf53d7c0
status: test
description: Detects disabling security tools
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-19
modified: 2021-11-27
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: process_creation
  product: macos
detection:
  launchctl_unload:
    Image: '/bin/launchctl'
    CommandLine|contains: 'unload'
  security_plists:
    CommandLine|contains:
    - 'com.objective-see.lulu.plist'                             # Objective-See firewall management utility
    - 'com.objective-see.blockblock.plist'                       # Objective-See persistence locations watcher/blocker
    - 'com.google.santad.plist'                                  # google santa
    - 'com.carbonblack.defense.daemon.plist'                     # carbon black
    - 'com.carbonblack.daemon.plist'                             # carbon black
    - 'at.obdev.littlesnitchd.plist'                             # Objective Development Software firewall management utility
    - 'com.tenablesecurity.nessusagent.plist'                    # Tenable Nessus
    - 'com.opendns.osx.RoamingClientConfigUpdater.plist'         # OpenDNS Umbrella
    - 'com.crowdstrike.falcond.plist'                            # Crowdstrike Falcon
    - 'com.crowdstrike.userdaemon.plist'                         # Crowdstrike Falcon
    - 'osquery'                                                  # facebook osquery
    - 'filebeat'                                                 # elastic log file shipper
    - 'auditbeat'                                                # elastic auditing agent/log shipper
    - 'packetbeat'                                               # elastic network logger/shipper
    - 'td-agent'                                                 # fluentd log shipper
  disable_gatekeeper:
    Image: '/usr/sbin/spctl'
    CommandLine|contains: 'disable'
  condition: (launchctl_unload and security_plists) or disable_gatekeeper
falsepositives:
- Legitimate activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to disable macOS security tools using commands to unload specific launch agents or disable Gatekeeper. The likely attacker objective is to impair system defenses, making it easier to execute malicious activities without detection. The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1562.001). Primary telemetry sources include process creation logs on macOS systems, specifically monitoring for command-line arguments that indicate security tool manipulations. The security impact is significant, as disabling security tools can lead to system compromise or data loss. However, this detection does NOT confirm that malicious activity has occurred without further corroborating evidence.

  ### Investigation Steps

  - **Review process creation events:** Examine Security Event ID 4688 or Sysmon Event ID 1 for process creation events related to `/bin/launchctl` or `/usr/sbin/spctl`. Check if the command line arguments include `unload` or `disable`, respectively, indicating potential malicious intent.

  - **Correlate against security tool logs:** Verify log entries from security tools like CrowdStrike or Carbon Black for any corresponding alerts or unusual behavior around the same timestamp as the detected command. This can help correlate legitimate activity versus attacks.

  - **Validate expected legitimate behaviors:** Identify any known legitimate use cases for unloading config files or disabling Gatekeeper. For instance, system updates or authorized troubleshooting steps can explain such actions. Check for user context and processes related to trusted applications to confirm benign behavior.

  - **Identify high-confidence malicious indicators:** Check if malicious software known for disabling defenses is running. For example, an associated process may appear after the command execution in process creation logs, indicating a likely compromise.

  - **Assess host roles or asset criticality:** Evaluate the importance of the affected system within the organization's infrastructure. Systems housing sensitive data or critical functions warrant higher scrutiny for these alert findings.

  ### Prioritization

  In an enterprise context, this alert has medium severity. The impact is critical, especially if the affected system holds sensitive data or essential services. The likelihood of malicious abuse is high as attackers frequently aim to neutralize security protections, and this tactic is often weaponized during compromise attempts.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques where attackers bypass system logging or use alternate non-standard methods to disable security tools. Reliable detection requires comprehensive logging enabled across security software and macOS processes. Legitimate activities such as system maintenance or configuration changes may trigger this alert. A related detection is monitoring for unusual process parent-child relationships, especially with privileged processes, which can indicate a more extensive attack attempting to exploit security controls.

