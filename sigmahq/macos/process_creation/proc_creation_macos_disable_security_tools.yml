title: Disable Security Tools
id: ff39f1a6-84ac-476f-a1af-37fcdf53d7c0
status: test
description: Detects disabling security tools
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
author: Daniil Yugoslavskiy, oscd.community
date: 2020-10-19
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: process_creation
  product: macos
detection:
  launchctl_unload:
    Image: '/bin/launchctl'
    CommandLine|contains: 'unload'
  security_plists:
    CommandLine|contains:
    - 'com.objective-see.lulu.plist'                             # Objective-See firewall management utility
    - 'com.objective-see.blockblock.plist'                       # Objective-See persistence locations watcher/blocker
    - 'com.google.santad.plist'                                  # google santa
    - 'com.carbonblack.defense.daemon.plist'                     # carbon black
    - 'com.carbonblack.daemon.plist'                             # carbon black
    - 'at.obdev.littlesnitchd.plist'                             # Objective Development Software firewall management utility
    - 'com.tenablesecurity.nessusagent.plist'                    # Tenable Nessus
    - 'com.opendns.osx.RoamingClientConfigUpdater.plist'         # OpenDNS Umbrella
    - 'com.crowdstrike.falcond.plist'                            # Crowdstrike Falcon
    - 'com.crowdstrike.userdaemon.plist'                         # Crowdstrike Falcon
    - 'osquery'                                                  # facebook osquery
    - 'filebeat'                                                 # elastic log file shipper
    - 'auditbeat'                                                # elastic auditing agent/log shipper
    - 'packetbeat'                                               # elastic network logger/shipper
    - 'td-agent'                                                 # fluentd log shipper
  disable_gatekeeper:
    Image: '/usr/sbin/spctl'
    CommandLine|contains: 'disable'
  condition: (launchctl_unload and security_plists) or disable_gatekeeper
falsepositives:
- Legitimate activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the unloading or disabling of security tools on macOS systems, specifically through the use of `launchctl` and `spctl` commands. The likely attacker objective is to disable security controls—such as firewalls and monitoring agents—to create a more favorable environment for malicious activities. This behavior maps to the MITRE ATT&CK tactic of Defense Evasion (T1562.001).

  The primary telemetry source for this detection is process creation logs from macOS systems, focusing on specific command-line parameters and commands associated with security tools. If executed by an unauthorized user, this activity may lead to significant security impacts, including increased vulnerability to malware and unauthorized access. Importantly, this detection does not confirm malicious intent on its own, as it may also be triggered by legitimate administrative actions.

  ### Investigation Steps

  - **Review process creation logs**: Examine System logs for Process Event data (e.g., Event ID 100) for the execution of `/bin/launchctl` or `/usr/sbin/spctl` containing `unload` or `disable`. Correlate with the system's administrative activity for context.

  - **Identify security tools affected**: Check for command-line arguments within logs that cite known security plist files, such as `com.crowdstrike.falcond.plist` or `at.obdev.littlesnitchd.plist`. Compare with expected security tool configurations to determine if legitimate tools have been disabled.

  - **Validate user accounts**: Cross-reference the user account that executed the disabling commands with legitimate administrative roles. Unauthorized or unusual account usage increases the likelihood of malicious activity.

  - **Analyze system security logs**: Look for any suspicious patterns in the security logs within the Console app (e.g., `/var/log/system.log`) that indicate disabled security components such as Gatekeeper. Log entries may detail security tool status changes.

  - **Monitor for follow-up actions**: Investigate subsequent behaviors post-command execution, such as processes associated with malware or lateral movement attempts, which may be indicative of an ongoing compromise.

  ### Prioritization

  This alert has medium severity as it indicates potential disabling of essential security controls, critically affecting the trustworthiness of the affected system. The likelihood of malicious abuse is moderate, as attackers commonly seek to disable defenses before execution of further malicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions that also trigger these alerts, potentially leading to false positives if not contextualized. It's crucial that logging for process creation and relevant security logs is enabled and properly configured for accurate detection. Common management operations, such as routine updates or troubleshooting, might inadvertently trigger this rule. Related detections, such as monitoring for unusual process creation in conjunction with these tools, can enhance coverage and reduce false positives.

