note: |
  ### Technical Context

  This rule detects the use of the `base64` command-line utility in macOS for decoding base64-encoded text, particularly when the `-d` (decode) flag is used. Attackers may leverage this technique to obfuscate malicious payloads or data exfiltration attempts, as decoding can reveal sensitive content that is meant to be concealed from standard detection mechanisms. This behavior is associated with the MITRE ATT&CK technique T1027 (Obfuscated Files or Information), mapping to the Defense Evasion tactic.

  The primary telemetry source for this detection is macOS process creation logs, specifically through the command-line arguments associated with the `base64` utility. If successful, the impact could be significant as it may indicate an ongoing attack or data exfiltration. However, this detection alone does not confirm malicious intent, as the `base64` utility can be used in legitimate contexts, such as encoding and decoding files for technical purposes.

  ### Investigation Steps

  - **Check process creation logs: ** Review Security Event ID 4688 or Sysmon equivalent logs for the execution of `/usr/bin/base64` containing `-d` in the CommandLine field. Confirm the timestamp matches the alert.

  - **Identify the source of the command: ** Determine if the execution of `base64` was initiated by a legitimate user process or script. Analyze the parent process and user context for known legitimate actions.

  - **Search for decoded output artifacts: ** Look for any files or network activity that may have resulted from the decoding action. On macOS, check the user's home directory for unexpected files that correlate with the time of execution, or potential data exfiltration paths.

  - **Investigate surrounding activity: ** Review other process creation logs from the same timeframe for additional suspicious activities, such as unusual network connections or other obfuscation tactics.

  - **Cross-reference alert with benign use cases: ** Consider common legitimate uses of the base64 utility, such as encoding images for web pages or decoding configuration files. If relevant, check documentation for legitimate base64 usage within the organization.

  - **Evaluate user privilege levels: ** Assess whether the user executing the base64 command has elevated privileges that would make malicious activity easier or more dangerous. Investigate if the user is a standard user or in a more sensitive role.

  ### Prioritization

  The alert is of low severity based on its context in typical enterprise environments. While the base64 decoding can signify malicious attempts to decode payloads, it is often associated with benign administrative tasks. However, it should be prioritized when allied with additional suspicious behavior or if conducted by a user in a sensitive role.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through alternative encoding methods or tools that may not use the `base64` command, thereby circumventing this rule. Reliable detection relies on the consistent logging of process execution detail, which can vary based on system configurations. Legitimate activities such as decoding configuration files for legitimate applications can also trigger this alert. A companion detection rule that monitors for subsequent suspicious network connections or file creations following base64 decoding would enhance overall coverage.

