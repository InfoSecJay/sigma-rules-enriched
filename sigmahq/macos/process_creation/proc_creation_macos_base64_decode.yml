note: |
  ### Technical Context

  The Sigma rule detects the execution of the `base64` utility on macOS with the `-d` option, which indicates the decoding of Base64-encoded text. This behavior could be employed by an attacker to decode obfuscated payloads or commands that are delivered as Base64 strings with the objective of executing malicious actions or exfiltrating data. The relevant MITRE ATT&CK tactic is "Defense Evasion," and the technique is identified as T1027 (Obfuscated Files or Information).

  Primary telemetry sources include macOS process creation logs, specifically focusing on the command execution attributes. If this activity is malicious, it could be indicative of an initial payload being decoded for further exploitation, potentially leading to privilege escalation or lateral movement within the environment. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate applications or scripts may also utilize Base64 decoding.

  ### Investigation Steps

  - **Review Command Line Context**: Examine the full command line associated with the process (e.g., Base64 decoding of suspicious or unexpected input) using process creation logs (macOS: `fs_usage` or `dtrace`). Look for indicators like external URL input or known bad file hashes.

  - **Inspect Parent Process**: Identify the parent process of the `base64` command execution using process ID correlation in logs (e.g., `ps aux`). A legitimate parent process might indicate expected behavior, whereas execution from an unusual or unrelated process could suggest malicious activity.

  - **Analyze User Context**: Check the user account that executed the Base64 decoding process in user activity logs (e.g., `who`, `last`). Ensure that it matches expectations for normal user behavior. High-risk accounts (e.g., admin) triggering this process should be investigated further.

  - **Correlate with Other Activities**: Look for any related logs around the time the `base64` command executed (e.g., network connections, file modifications). Logs like `/var/log/system.log` or application logs could provide context on recent user activities, potentially linking the decoding with malware delivery methods.

  - **Validate Legitimate Usage**: Consult documentation for legitimate applications in your environment that may use Base64 decoding (e.g., software development or data processing tools). Compare the timing and context of execution against these legitimate tools to evaluate if the behavior is expected.

  - **Monitor for High-Confidence Malicious Indicators**: Focus on any decoded output that's later executed or written to disk. Check for file creation events (e.g., macOS system logs or `fs_usage`) in conjunction with suspicious Base64 activity, which could be indicative of a payload being set up for execution.

  ### Prioritization

  This alert carries low severity due to its low likelihood of immediate impact unless combined with additional suspicious behavior. While base64 decoding is a common technique used in both benign and malicious contexts, its potential for misuse specifically in the execution of obfuscated code makes it a detection point worth monitoring, particularly in controlled environments with sensitive information.

  ### Blind Spots and Assumptions

  The detection is limited by environments where logging for process creation is not configured properly or where `base64` commands are commonly used for legitimate workflows, such as software builds. False positives can arise from legitimate scripts decoding Base64 for standard operations. A companion detection rule focused on command and control behavior (e.g., unexplained network connections following the decoding) can strengthen coverage and assist in identifying malicious patterns.

