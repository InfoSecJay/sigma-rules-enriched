  ---

  ### Technical Context

  This Sigma rule detects the execution of the `dseditgroup` command on macOS systems, specifically noting when a user is added to the admin group, potentially granting elevated privileges. The likely attacker objective is to escalate privileges by introducing unauthorized users into a critical access group, thereby gaining control over sensitive system functions. This activity aligns with the MITRE ATT&CK tactic of Privilege Escalation, specifically the technique "Valid Accounts" (T1078.003).

  The primary telemetry source for this detection is macOS process creation logs, specifically for the `dseditgroup` utility. If successful, this behavior can lead to significant security impacts, including unauthorized system modifications and data access. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may result in similar alerts.

  ---

  ### Investigation Steps

  - **Review the command line arguments: **: Inspect logs for Security Event IDs associated with macOS process creation. Look for instances of `dseditgroup` with parameters that include `-o edit`, `-a`, `-t user`, and `admin`. Malicious changes may have unusual or unauthorized usernames.

  - **Check user history and roles: **: Verify if the user being added has legitimate administrative requirements. This can be done by examining user account details in `/etc/passwd` or using `dscl . -read /Groups/admin`. This context is crucial; established users may have valid reasons for their group permissions.

  - **Examine system logs for related activities: **: Analyze logs in `/var/log/system.log` or `Console.app` for any preceding suspicious activities or commands leading to the execution of `dseditgroup`. Look for patterns that might indicate exploitation rather than routine administrative tasks.

  - **Identify recent changes in system access: **: Utilize audit logs or Mac's Open Directory logs to find more context about modifications to user groups. Check for other unauthorized administrative actions or account creations around the same timestamp.

  - **Assess the asset criticality: **: Determine the role of the affected macOS device (e.g., server versus workstation) and its sensitivity to unauthorized administrative access. High-impact systems should take precedence in immediate review.

  ---

  ### Prioritization

  This alert is considered medium severity due to the potential for significant security impacts if an unauthorized user is granted admin privileges. While this behavior can indicate a real threat, it may also arise from benign administrative activity. However, given the common exploitation of privilege escalation methods, prompt investigation is warranted.

  ---

  ### Blind Spots and Assumptions

  The detection may miss attempts to use alternate methods for privilege escalation or if the command is executed in a non-standard way. Log retention and configurations for process execution need to be verified for consistent detection capability. Legitimate system administrators might trigger this alert during routine management tasks, particularly in environments with frequent permission adjustments. A companion detection like monitoring failed attempts to modify group memberships alongside successful changes can enhance threat hunting efforts.

