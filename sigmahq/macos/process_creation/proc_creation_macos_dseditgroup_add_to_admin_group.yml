note: |
  ### Technical Context

  This detection identifies when a user account is added to an administrative group using the `dseditgroup` command on macOS, which could grant elevated privileges. The likely attacker objective is to escalate privileges, maintaining a foothold within the environment for further actions, such as lateral movement or data exfiltration. This aligns with the MITRE ATT&CK tactic of Persistence and Privilege Escalation (T1078.003).

  The primary telemetry source includes process creation events from macOS, specifically tracking the execution of the `/dseditgroup` utility. Log types required are macOS system logs capturing command-line arguments, specifically monitoring CommandLine arguments for operations against admin groups. The security impact of such an event is significant if performed maliciously, as it can enable an attacker to perform high-level operations undetected. This detection does NOT confirm that the operation was malicious without further context or supporting evidence.

  ### Investigation Steps

  - **Review command-line arguments:** Examine process creation logs (Event ID for macOS) involving `dseditgroup` where CommandLine contains `-o edit`, `-a`, and `admin`. Look for abnormal usernames being added that are not part of standard administrative practices.

  - **Identify legitimate administrative activity:** Check for patterns in command execution. Verify if known IT personnel or automated management scripts commonly execute the `dseditgroup` command as part of routine administration, making note of regular usernames and time frames.

  - **Correlate with user account changes:** Monitor for other user account management activities logged around the same time (e.g., `dscl` commands, Event ID X). An elevated trajectory (frequency, timing) could suggest suspicious behavior.

  - **Validate logs for multiple instances:** Investigate if there are sequential `dseditgroup` executions tied to multiple accounts or repeated script executions in a short timeframe, suggesting possible batch privilege escalations rather than a one-off legitimate change.

  - **Capture artifact creation:** Ensure assessment of artifact creation, looking for the presence of abnormal files or logs that might indicate further exploitation attempts (e.g., unusual scripts initiated post-execution of the `dseditgroup` command).

  ### Prioritization

  The alert severity is medium due to the potential impact on the integrity and security of the affected macOS systems. While the behavior itself is not uncommon for legitimate administrative tasks, malicious actors frequently leverage similar techniques to gain higher-level access, making it a noteworthy alert.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use legitimate accounts or already have elevated privileges to perform actions without triggering logs. Reliable detection also requires ensuring logging for macOS commands is properly configured. Legitimate administrative activities, such as regular system updates or user role assignments, may trigger this alert. A related detection for user privilege changes (e.g., `dscl` user creation) could strengthen overall monitoring capabilities.

