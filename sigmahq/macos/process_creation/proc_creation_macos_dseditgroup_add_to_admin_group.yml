detection:
  selection:
    Image|endswith: '/dseditgroup'
    CommandLine|contains|all:
    - ' -o edit '         # edit operation
    - ' -a '         # username
    - ' -t user'
    - 'admin'         # Group name
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to add a user account to the administrator group on macOS systems using the `dseditgroup` utility. The rule signals potential privilege escalation activities where an unauthorized user is assigned administrative rights, a common tactic for attackers seeking to gain elevated privileges within a target environment. Such activities could allow the attacker to execute further malicious actions undetected, such as accessing sensitive data or establishing persistence.

  The relevant MITRE ATT&CK tactics and techniques applicable to this detection include **Persistence (T1078)**, specifically **Account Manipulation (T1078.003)**, which denotes an attacker gaining access by modifying accounts' group memberships. Additionally, this behavior may intersect with **Privilege Escalation (T1068)** as it involves elevating privileges to more sensitive access levels within the system.

  Primary data sources for detecting these activities are **process creation events**, particularly logs capturing command-line arguments and executable paths. Monitoring these logs can provide visibility into when changes to group memberships occur and highlight unusual patterns that could indicate malicious activity.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check for instances of the `dseditgroup` utility being executed. Focus on command-line arguments that include `-o edit`, `-a`, `-t user`, and `admin` to validate the actions being performed.

  - **Correlate with User Activity**: Determine if the user account being modified has a legitimate reason to be added to the admin group. Review authentication logs to confirm the user's activity and their role within the organization.

  - **Audit Group Memberships**: Review current group memberships for the admin group and any other high-privilege groups. Look for unauthorized additions or suspicious accounts that deviate from normal operational practices.

  - **Investigate Contextual Information**: Analyze associated logs around the time of the event for anomalies, such as failed login attempts, unusual times for administrative changes, or additional processes that may indicate further compromise.

  ### Prioritization
  The alert is assigned medium severity due to the potential for significant impact if an unauthorized user gains administrative access, coupled with the likelihood that such operations may be masked among legitimate administrative activities. This makes it crucial to quickly verify and mitigate any potential breaches.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of improper privilege escalations, particularly if attackers use other means or tools to manipulate group settings outside of the `dseditgroup` command or if they have legitimate administrative access. The logic assumes that any legitimate administrator activity is sufficiently documented and that there is a baseline of normal behavior established for group modifications. Adequate logging configurations are required to ensure process creation events are retained and accessible for analysis.

