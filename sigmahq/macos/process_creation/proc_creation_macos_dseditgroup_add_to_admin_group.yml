note: |
  ### Technical Context

  This Sigma rule detects the creation or addition of a user account to the administrator group on macOS via the `dseditgroup` utility, indicating a potential escalation of privileges. The likely attacker objective is to gain unauthorized administrative access, allowing further exploitation within the environment. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (T1078.003), specifically focusing on unauthorized elevation of privileges.

  The primary telemetry sources include process creation logs from macOS, specifically monitoring command-line executions. If malicious, this action can lead to significant security impacts, such as unauthorized data access or system control. This detection alone does not confirm malicious activity but indicates potentially risky changes that require further investigation.

  ### Investigation Steps

  - **Check process creation logs:** Review macOS Security Event ID 4688 for instances where `dseditgroup` is executed, including `CommandLine` fields for the complete command used. Look for unusual user accounts being granted admin access, especially if originated from untrusted locations or unusual times.

  - **Identify high-confidence malicious indicators:** Determine if the command line contains the parameters `-o edit -a [username] -t user admin`. An entry matching this indicates an addition of a user to the admin group, warranting immediate investigation.

  - **Validate legitimate administration activity:** Cross-reference the command’s execution time with scheduled maintenance or legitimate administrative activities. If the user and timing match known administrative changes or scheduled tasks, consider the event benign.

  - **Review user account history:** Examine `/etc/group` and audit logs to see if there have been multiple changes to the admin group over a short period. Frequent changes may indicate an ongoing unauthorized attempt to establish persistence.

  - **Assess asset criticality:** Identify if the affected system is a critical asset, such as a server or endpoint containing sensitive data. Changes on high-value targets can have greater security implications.

  - **Monitor for related activity:** Investigate if other processes or commands are initiated around the same time as `dseditgroup`, which may provide context or indicate further malicious behavior, such as remote access tools (RAT) being deployed.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on the affected system; unauthorized admin access can lead to further exploitation. The likelihood of abuse is significant, as this method is frequently weaponized in privilege escalation attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if the relevant log sources are not properly configured to capture process creation or command-line arguments. Legitimate administrative activities, such as IT maintenance tasks, may trigger this alert, emphasizing the need for context during investigation. A related detection to consider is monitoring for unusual account creation or modification events (e.g., via `syslog`), which can provide a broader view of potential malicious activity within the environment.

