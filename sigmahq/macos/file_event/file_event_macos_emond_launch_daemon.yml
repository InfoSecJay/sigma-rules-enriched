logsource:
  category: file_event
  product: macos
detection:
  selection_1:
    TargetFilename|contains: '/etc/emond.d/rules/'
    TargetFilename|endswith: '.plist'
  selection_2:
    TargetFilename|contains: '/private/var/db/emondClients/'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This rule detects potential adversarial attempts to gain persistence on MacOS systems by monitoring modifications to the Emond Launch Daemon configuration files. Attackers may leverage the Emond daemon by adding custom rules within `/etc/emond.d/rules/` or creating entries in `/private/var/db/emondClients/`, allowing them to execute arbitrary commands upon specific events or conditions while maintaining access even after a system reboot. The primary objectives of these actions typically include maintaining an illicit foothold in the targeted environment and achieving privilege escalation.

  Relevant MITRE ATT&CK techniques include **T1546.014 - Launch Daemon**, which focuses on the persistence mechanism exploitation through MacOS launch daemons. Successful implementation of this technique can enable attackers to execute malware or commands with potentially elevated privileges whenever the system or user initiates the daemons. The primary data sources to monitor for these changes include file event logs on MacOS devices, specifically those that capture modifications to the aforementioned directories and files associated with Emond.

  ### Investigation Steps
  - **Review File Event Logs:** Inspect file event logs for entries indicating changes to the `/etc/emond.d/rules/` and `/private/var/db/emondClients/` directories, specifically looking for additions or modifications to `.plist` files, which could be indicative of malicious activity.
  - **Validate Persistence Mechanisms:** Analyze any newly created or modified launch daemons for their content and origins, focusing on their configurations to determine if they seem legitimately associated with authorized applications or were created by an unauthorized user or process.
  - **Correlate with User Activity:** Cross-reference the timestamps of the changes with user activity logs to ascertain whether a legitimate administrator or user could have made these modifications, or if they coincide with suspicious logins or behavior patterns.
  - **Identify Suspicious Programs:** Determine if the newly configured daemons or rules are executing known malicious binaries or scripts. Investigate the hash values and signatures of any executables linked to the identified Emond configurations.

  ### Prioritization
  The alert's severity is categorized as medium due to the potential impact on system integrity and security. If an attacker successfully integrates persistent malware through these methods, they can maintain long-term access, posing a significant risk to the enterprise's network and sensitive data.

  ### Blind Spots and Assumptions
  The detection logic may not capture modifications made through legitimate administrative actions, leading to potential false positives. Additionally, there may be discrepancies in logging configurations or oversight of file events on less monitored endpoints. The effectiveness of this detection relies on comprehensive logging of all file system changes and accurate identification of user and administrative activity, ensuring that all alterations to Emond's configuration are appropriately tracked and analyzed.

