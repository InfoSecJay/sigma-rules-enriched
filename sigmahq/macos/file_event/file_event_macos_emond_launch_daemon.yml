logsource:
  category: file_event
  product: macos
detection:
  selection_1:
    TargetFilename|contains: '/etc/emond.d/rules/'
    TargetFilename|endswith: '.plist'
  selection_2:
    TargetFilename|contains: '/private/var/db/emondClients/'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications or additions to the Emond Launch Daemon on macOS systems, specifically focusing on changes to files in the `/etc/emond.d/rules/` directory and within `/private/var/db/emondClients/`. The likely attacker objective is to establish persistence and elevate privileges by tampering with system-level daemons. This detection aligns with the MITRE ATT&CK framework under the tactic of Persistence and the technique T1546.014 (Localized Privilege Escalation via Launch Daemons). Primary telemetry sources include file event logs from macOS systems, specifically monitoring file accesses or modifications in the targeted directories. If malicious, this can allow an adversary to re-execute payloads on system startup, thus maintaining their access. It is important to note that this detection does NOT confirm malicious intent on its own and should be corroborated with additional context and analysis.

  ### Investigation Steps

  - **Check for unauthorized file modifications:** Review `/etc/emond.d/rules/` and `/private/var/db/emondClients/` for new or unexpected `.plist` files. Note the creation timestamps and compare against standard change management records; legitimate admin changes typically involve documentation.

  - **Validate file contents:** For any newly created or modified `.plist` files, examine their contents for any suspicious commands or payloads. Legitimate `.plist` files should typically configure known services or system processes, not execute arbitrary code.

  - **Identify associated process execution:** Cross-reference any detected modifications with Security Event ID 4688 logs to identify processes that may have been spawned as a result. Look for unusual process creation times, especially those outside of authorized maintenance windows.

  - **Review system logs for anomalous behavior:** Investigate system logs (Console.app or `/var/log/system.log`) for any abnormal activities around the same time as the detected filesystem changes to correlate any anomalous behavior with the potential persistence mechanisms.

  - **Check for known indicators of compromise:** Use threat intelligence feeds to assess whether any persistence mechanisms detected match known adversary techniques or signatures, focusing particularly on T1546.014 activity.

  - **Assess host role and risk impact:** Determine if the impacted macOS system has a high criticality, such as being a domain controller or server. Elevated privileges or persistence on such systems can lead to significant security breaches.

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on macOS systems where persistence mechanisms could lead to compromise. Given the rising sophistication of attacks leveraging such techniques, there exists a moderate likelihood of abuse. While not every modification is malicious, it is a behavior commonly exploited by advanced adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging level is insufficient or if the system is not configured to audit changes to specific directories. Additionally, legitimate administrative activities may trigger the alert as IT personnel may also update or add rules. Companion detections, such as monitoring for unusual process executions tied to these modifications, can enhance incident response capabilities.

