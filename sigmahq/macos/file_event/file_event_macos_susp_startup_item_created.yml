note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of macOS startup item plist files, which can be used to establish persistence on a system by executing scripts or applications automatically during the boot process. Attackers commonly exploit this method to ensure their malicious code runs with each system restart, facilitating long-term footholds in a compromised environment.

  Relevant MITRE ATT&CK tactic is **Persistence**, with the technique identified as **Startup Items (T1037.005)**. The primary telemetry sources are file event logs from macOS, focusing on `/Library/StartupItems/` and `/System/Library/StartupItems`, where malicious plist files are likely to be created. The security impact can be significant, as a malicious startup item can allow undetected re-execution of malware. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative actions may also create startup items.

  ---

  ### Investigation Steps

  - **Review the file creation details:** Check for new plist files in `/Library/StartupItems/` or `/System/Library/StartupItems` with file event logs (specific log type: macOS file event). Look for abnormal or unexpected filenames such as those mimicking system processes.

  - **Identify the creator of the plist file:** In the file event log, investigate the `User` attribute associated with the plist creation for flags of unusual activity, such as creation by a non-administrator account or a scheduled task (`Event ID 1000` for macOS).

  - **Examine the contents of the plist file:** Open the suspected plist file to review its scripts and parameters, ensuring they match legitimate applications or processes and are not executing unauthorized or suspicious commands.

  - **Establish a baseline of legitimate startup items:** Compare newly created plist files against a whitelist of known good startup items. Document expected items for your environment to distinguish between benign and malicious behaviors effectively.

  - **Track file modification timestamps:** Use logs to see if multiple plist files are created in rapid succession or if a pattern of deletion and recreation exists. This may indicate an attacker trying to establish persistence continuously.

  - **Check for related activities:** Review system and application logs to see if there are correlated events, such as unexpected network connections or process creations (`Event ID 4688` for process creation), following the timeframe of the plist file creation.

  ---

  ### Prioritization

  This alert indicates potentially suspicious behavior due to its association with an important persistence mechanism that can allow attackers to maintain long-term access to critical systems. Given that such startup items could be exploited by attackers, especially in high-value targets, the urgency for investigation is moderate to high, depending on the environment’s criticality.

  ---

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative activity, as system administrators often modify startup items for legitimate purposes. Evasion techniques may involve using non-standard naming conventions for plist files or leveraging alternate persistence mechanisms that do not create startup items. Ensuring comprehensive logging, including file events, is critical for reliable detection. Companion detections could include monitoring for unauthorized process execution related to the plist files created.

