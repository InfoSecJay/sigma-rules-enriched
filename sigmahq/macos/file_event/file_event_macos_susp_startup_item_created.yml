title: Startup Item File Created - MacOS
id: dfe8b941-4e54-4242-b674-6b613d521962
status: test
description: |
  Detects the creation of a startup item plist file, that automatically get executed at boot initialization to establish persistence.
  Adversaries may use startup items automatically executed at boot initialization to establish persistence.
  Startup items execute during the final phase of the boot process and contain shell scripts or other executable files along with configuration information used by the system to determine the execution order for all startup items.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1037.005/T1037.005.md
- https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/StartupItems.html
author: Alejandro Ortuno, oscd.community
date: 2020-10-14
modified: 2024-08-11
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1037.005
logsource:
  category: file_event
  product: macos
detection:
  selection:
    TargetFilename|startswith:
    - '/Library/StartupItems/'
    - '/System/Library/StartupItems'
    TargetFilename|endswith: '.plist'
  condition: selection
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  The rule detects the creation of `.plist` files in specific macOS startup directories that are designed to automatically execute during system boot. This behavior is indicative of an adversary's objective to establish persistence on the affected macOS system, allowing them to run malicious code or scripts each time the system starts. The relevant MITRE ATT&CK tactic is **Persistence** (T1037.005).

  The primary telemetry source for this detection is macOS file event logs that monitor file creation activities. If this behavior is malicious, it poses a significant security risk as it enables unauthorized processes to run unnoticed at system startup. This detection does not on its own confirm malicious intent, as legitimate system administration activities may also result in the creation of startup items.

  ### Investigation Steps

  - **Check for recent file creation events:** Review macOS file event logs for Event ID associated with file creation (e.g., from Unified Logging framework). Focus on logs where the `TargetFilename` starts with `/Library/StartupItems/` or `/System/Library/StartupItems` and ends with `.plist`.

  - **Analyze contents of detected `.plist` files:** For any newly created `.plist` files, verify the contents to identify any suspicious scripts or commands that are set to execute. Legitimate items will often link to known system processes or software. Use `plutil -convert xml1 <path-to-plist>` to convert binary files for reading.

  - **Examine execution permissions:** Confirm that the created startup item has appropriate permissions. Malicious items may have overly permissive access settings (e.g., writable by all users). Check using `ls -l <path-to-plist>`.

  - **Identify the originating user context:** Investigate the user or process that created the item. Look for anomalies in user behavior or profiles, particularly if the history indicates unauthorized privilege escalation or previously benign accounts showing unusual activity.

  - **Determine host role and criticality:** Assess the context of the affected macOS system. Critical roles like endpoints in sensitive environments (e.g., finance, healthcare) heighten the need for immediate investigation compared to non-critical systems.

  - **Check for concurrent malicious indicators:** Correlate findings with other detections, such as abnormal network connections or processes associated with the user that aligns with known malicious behaviors (e.g., unusual outbound traffic patterns following the `.plist` creation).

  ### Prioritization

  This alert is rated low severity because while the affected system may be critical, the presence of a newly created startup item does not always indicate malicious activity. The likelihood of abusive intent can vary based on additional context, but the utilization of startup items for persistence is a common tactic observed among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive monitoring of all file modifications on macOS, particularly if filtering is in place. Additionally, legitimate administrative actions may trigger this alert, such as system updates or software installations. For reinforced coverage, correlate this detection with alerts that monitor process creation (Sysmon Event ID 1) to identify any potentially executed malicious payloads tied to the newly created startup item.

