title: Startup Item File Created - MacOS
id: dfe8b941-4e54-4242-b674-6b613d521962
status: test
description: |
  Detects the creation of a startup item plist file, that automatically get executed at boot initialization to establish persistence.
  Adversaries may use startup items automatically executed at boot initialization to establish persistence.
  Startup items execute during the final phase of the boot process and contain shell scripts or other executable files along with configuration information used by the system to determine the execution order for all startup items.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1037.005/T1037.005.md
- https://developer.apple.com/library/archive/documentation/MacOSX/Conceptual/BPSystemStartup/Chapters/StartupItems.html
author: Alejandro Ortuno, oscd.community
date: 2020-10-14
modified: 2024-08-11
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1037.005
logsource:
  category: file_event
  product: macos
detection:
  selection:
    TargetFilename|startswith:
    - '/Library/StartupItems/'
    - '/System/Library/StartupItems'
    TargetFilename|endswith: '.plist'
  condition: selection
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This detection rule identifies the creation of plist files in the `/Library/StartupItems/` and `/System/Library/StartupItems` directories on macOS systems. These files are used to configure startup items that execute during the boot process of the operating system. An adversary can leverage this mechanism to establish persistence by inserting malicious scripts that activate automatically with each system startup. The primary objectives of such attacks may include maintaining access to the system across reboots, executing payloads, or facilitating further exploitation once the system is re-initialized.

  The rule relates to the MITRE ATT&CK tactic of **Persistence** and specifically targets the technique **T1037.005: Startup Items**. By detecting changes in these system directories, security analysts can identify potentially malicious activities indicative of an attacker's attempt to persist on the host system.

  The best sources of telemetry for detecting this activity include **file event logs** from macOS, which record file creations, modifications, and deletions within the filesystem. Monitoring these logs will highlight unauthorized or unexpected plist file creations that could signal malicious intent.

  ### Investigation Steps
  - **Review File Events:** Examine file event logs for any newly created plist files in `/Library/StartupItems/` or `/System/Library/StartupItems`. Look specifically for timestamps that correlate with user logins or system reboots.

  - **Analyze the Plist Content:** Investigate the contents of the identified plist files to assess whether they contain scripts or executables that appear suspicious or are not associated with known and approved software.

  - **Check for Previous Instances:** Cross-reference the identified plist files with historical file event logs to determine if new files are modifications of previously legitimate startup items or entirely new entries.

  - **Investigate User and Process Context:** Analyze which user account created the plist files and the processes that were running at the time. Scrutinize accounts that lack legitimate administrative roles or seem atypical.

  ### Prioritization
  The alert is categorized as low severity. However, the presence of unauthorized startup items can signify an imminent risk of persistence on compromised systems, necessitating prompt investigation to mitigate potential long-term impacts.

  ### Blind Spots and Assumptions
  This detection may not cover scenarios where an attacker uses other methods to establish persistence, such as modifying other startup configurations or utilizing different file locations. The detection logic assumes that malicious actors will create files in the specified directories rather than using legitimate ones or hiding the files elsewhere. It requires that logging for file events is enabled on macOS systems to function effectively; otherwise, malicious activities could go undetected.

