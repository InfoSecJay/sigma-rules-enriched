  ### Technical Context

  This Sigma rule detects the creation of the file **/tmp/rootlog**, a file used by the **TripleCross eBPF rootkit** to verify if its backdoor is already active. The primary attacker objective is to establish persistence and facilitate covert command and control over the compromised system. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (T1547) and technique **Kernel Modules and Extensions** (T1212).

  The primary telemetry source for this detection includes **Linux file system event logs**, particularly monitoring file creation events. If this file is created maliciously, the security impact is significant, as it indicates a potential rootkit presence, resulting in escalated privileges and unauthorized access. This detection does NOT confirm active exploitation or that compromise is underway—it only indicates a potential precursor to malicious behavior.

  ### Investigation Steps

  - **Check for file creation event:** Review Linux file system logs for the creation of `/tmp/rootlog`. Use `inotify` or `auditd` with **Event ID 100** for file creation to confirm the event.

  - **Investigate parent process:** Identify the parent process that created the `/tmp/rootlog` file. Use `ps aux` or `auditd` logs to find the PID. A benign process may include standard administration tools; anything unusual could indicate malicious intent.

  - **Verify other rootkit indicators:** Look for known indicators of compromise associated with the TripleCross rootkit, such as additional suspicious file creations (e.g., `/etc/init.d/rk` or similar persistent files). Cross-reference timestamps and parent processes for correlation.

  - **Assess the host criticality:** Determine the role of the affected host. If it is a server hosting sensitive data, escalate the investigation priority. Note if this was on a test or development server to consider benign outputs.

  - **Analyze user behavior:** Review the running user context (`whoami` and `last` commands) to assess if the user has admin privileges or if there are unauthorized accounts. Unusual user activity may align with the rootkit behavior.

  ### Prioritization

  This alert is of **high severity** due to its implication of potential rootkit installation and system compromise. The likelihood of malicious abuse is high, given the nature of the file's purpose. Rootkits are commonly weaponized for stealthy and persistent access, warranting immediate attention.

  ### Blind Spots and Assumptions

  This detection may have limitations if logging isn’t appropriately configured, particularly for file events or process creation. Legitimate activities could trigger the alert, such as software installations or administrator scripts creating log files in `/tmp`. A related detection to enhance coverage is monitoring for other persistence mechanisms within the system, including unauthorized service definitions or modified init scripts.

