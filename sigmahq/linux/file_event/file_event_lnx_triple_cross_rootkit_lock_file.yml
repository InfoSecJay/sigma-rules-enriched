  ### Technical Context

  This Sigma rule detects the creation of a file named "rootlog" in the `/tmp` directory, which is associated with the TripleCross eBPF rootkit. The likely attacker objective is to establish and maintain persistence on the compromised system by using this log file to check for the active presence of the backdoor. The relevant MITRE ATT&CK tactic is 'Defense Evasion' (T1562), and the technique is 'Indicator Removal on Host' (T1070).

  The primary telemetry source is file event monitoring on Linux systems, specifically looking for events related to file creation. If this activity is malicious, it signifies a compromised environment where an attacker may be attempting to evade detection while maintaining access. Importantly, this detection does NOT confirm active exploitation or the presence of a fully operational rootkit on its own.

  ---

  ### Investigation Steps

  - **Review file creation logs:** Check for the presence of the file `/tmp/rootlog` with Linux audit logs (Audit Event ID 1100) or in file monitoring solutions. Malicious activity will show an unexpected creation time without a legitimate process context.

  - **Check parent processes:** Examine the process that created the file using the `pstree` or `ps` command. If the parent process is an unusual or unauthorized program (e.g., suspicious shell, Python script), this may indicate malicious activity.

  - **Assess recent activity:** Investigate any recent commands executed on the host using shell history files located in `/home/user/.bash_history`. Verify if there are any abnormal commands around the same timestamp as the file creation.

  - **Identify patterns of legitimate activity:** Analyze typical log paths for legitimate applications that may temporarily create files in `/tmp`, focusing on expected applications or services. Compare the behavior against system owner and usage context.

  - **Cross-reference with other indicators:** Look for signs of eBPF manipulation or abnormal behavior such as network connections established by pid 1 (init). This could indicate deeper malicious processes attempting to communicate externally.

  - **Monitor for further indicators of compromise:** Set alerts for continued file activity within `/tmp` or other temporary directories, as benign applications should not routinely interact with these locations in this manner.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential implications of rootkit presence on a system, which can compromise confidentiality, integrity, and availability. The likelihood of malicious abuse is significant, as the TripleCross rootkit is specifically designed to evade detection and maintain persistence, making its behavior a critical area of concern.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations in environments with custom applications or benign scripts that legitimately use the `/tmp` directory for logging. Reliable detection also depends on comprehensive file monitoring capabilities being enabled on all Linux systems. Legitimate activities such as software installations or updates could trigger alerts as well. A related detection to consider is monitoring for the presence of unexpected I/O calls or eBPF-related metrics, which could provide additional context around potential rootkit activity.

