  ### Technical Context

  This Sigma rule detects the creation of the file `/tmp/rootlog`, which is indicative of the TripleCross rootkit's operational checks. The primary objective of this behavior is to determine if the backdoor process is already active, potentially allowing an attacker to establish persistence and execute further malicious actions on the compromised host. This activity is aligned with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and specifically the technique of Rootkit Implementation (T1014).

  The primary telemetry source for this detection comes from file system events generated by Linux systems, particularly monitoring `/tmp` directory activities. If the detection signifies malicious activity, it can lead to significant security impacts, including unauthorized access, data theft, or lateral movement within the network. It is important to note that this detection alone does NOT confirm compromise but rather indicates the potential for rootkit activity.

  ### Investigation Steps

  - **Review file creation timestamp:** Check for the creation timestamp of `/tmp/rootlog` using `stat /tmp/rootlog` to establish when the file was created. A recent timestamp may align with the alert, indicating potential malicious activity.

  - **Analyze parent process attributes:** Use `ps -aux | grep "$(pgrep -f rootlog)"` to identify the parent process of `/tmp/rootlog`. A suspicious or unexpected parent process may indicate a compromise, especially if associated with known malicious behavior.

  - **Check for abnormal executables:** Review for suspicious files in `/tmp` or `/var/tmp`. Use `ls -la /tmp` and investigate any other executables that were recently created or modified, particularly those with unusual names or permissions.

  - **Identify legitimate service activity:** Confirm if the creation of `/tmp/rootlog` correlates with any expected application behavior or scheduled tasks on the host. For example, legitimate services may perform housekeeping or logging that involves `/tmp`, thereby providing context to the alert.

  - **Inspect system logs for suspicious network activity:** Look in `/var/log/syslog` or use `journalctl` for signs of unusual outbound connections or commands executed by any process that may relate to the creation of the log file.

  - **Cross-reference known indicators:** Use threat intelligence to compare the identified system or file behavior with known patterns associated with the TripleCross rootkit or other kernel-level rootkits, noting high-confidence indicators like identical file creation and associated process spawn events.

  ### Prioritization

  This alert has a high severity due to its potential impact on system integrity and confidentiality. The likelihood of malicious use is elevated, considering that rootkits are highly persistent, making this behavior significant. Such file creation patterns are often weaponized in targeted attacks, thus warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient file system logging or if the malware utilizes stealth techniques to mask its activity. It is essential to ensure that file event monitoring is correctly configured on Linux systems for reliable detection. Legitimate activities such as application debugging might inadvertently trigger this alert. A related detection for enhanced coverage would be monitoring for unusual network connections initiated by processes with relationships to `/tmp/rootlog`.

