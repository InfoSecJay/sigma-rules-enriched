  ### Technical Context
  This detection rule identifies the creation of the file "/tmp/rootlog," which is indicative of the activity related to the TripleCross rootkit. The TripleCross rootkit employs eBPF (extended Berkeley Packet Filter) to establish persistence and stealth capabilities on compromised Linux systems. The presence of the "rootlog" file serves as a check mechanism used by the rootkit to determine if its backdoor process is already active. The main objectives of an attacker utilizing this rootkit include maintaining unauthorized access to the system, evading detection, and potentially escalating privileges.

  In terms of the MITRE ATT&CK framework, this activity falls under the tactics of **Defense Evasion**. The specific techniques relevant to this detection include **T1070.001 - File and Directory Permissions Modification** and **T1045 - Software Compression** as it relates to the clandestine operation of the rootkit. Collecting data from file event logs on Linux systems will provide insights into unauthorized file creations, which in this case, may signal the presence of malicious activity.

  The primary data sources for detecting this behavior will include real-time file event logs generated on Linux systems, which document changes in the filesystem and can trigger alerts upon the creation of specific files like "rootlog."

  ### Investigation Steps
  - **Review File Event Logs:** Check file creation events to confirm the occurrence of the "rootlog" file in the "/tmp" directory and gather associated timestamps to correlate with other activities on the system.
  - **Analyze Process Activity:** Investigate related process execution at the time the "rootlog" file was created. Look for unusual processes, particularly those that may involve eBPF usage or backdoor operations.
  - **Examine System Integrity:** Ensure the integrity of the system by evaluating other sensitive areas, including the presence of unexpected or unauthorized binaries that may indicate rootkit activity.
  - **Check for Persistence Mechanisms:** Investigate startup scripts and services to determine if there are mechanisms set up that could maintain the rootkit’s presence across reboots, as well as any unusual modifications in system configurations.

  ### Prioritization
  This alert holds a high severity level due to the potential for the TripleCross rootkit to maintain persistent access to critical systems, leading to severe impacts on system integrity, confidentiality, and availability. The likelihood of such rootkit usage in targeted attacks underscores the need for prompt investigation.

  ### Blind Spots and Assumptions
  The detection logic assumes that the "rootlog" file will be created in the typical "/tmp" directory and that file event logging is enabled and properly configured on the monitored Linux systems. There may be gaps in coverage if systems do not log file creation events or if the rootkit employs alternative obfuscation techniques to avoid writing expected files. Analysts should be aware that variations in the behavior of the rootkit or its configuration may not trigger this specific alert.

