  ### Technical Context

  This Sigma rule detects the creation of files named "ebpfbackdoor" within the "cron.d" and "sudoers.d" directories, indicative of the TripleCross rootkit's persistence mechanism. The likely attacker objective is to establish a covert and persistent backdoor that allows continuous access to the compromised system, facilitating privilege escalation and execution of arbitrary code.

  Relevant MITRE ATT&CK tactic and technique include **Persistence (T1053.003)**. The primary telemetry source for this detection is Linux file event logs, specifically monitoring directory changes in "cron.d" and "sudoers.d." If malicious, this behavior can compromise the integrity of affected systems, permitting unauthorized escalation of privileges. Importantly, this detection does NOT confirm that the rootkit is actively executing or that other malicious activities are occurring.

  ### Investigation Steps

  - **Check for creation of 'ebpfbackdoor' files:** Review file event logs where `TargetFilename` ends with 'ebpfbackdoor'. This can be done via the `inotify` or `auditd` logs for changes in `/etc/cron.d/` and `/etc/sudoers.d/`.

  - **Identify the user context of file creation:** Check the owner and permissions of the 'ebpfbackdoor' file using `ls -l` or relevant system audit logs to identify if it was created by a high-privilege account, such as root, indicating potential malicious intent.

  - **Examine scheduled tasks and sudo configurations:** Review the contents of the affected files in "cron.d" and "sudoers.d" for unusual entries or commands that may allow execution of unauthorized scripts. Regular entries in these directories usually follow a consistent naming convention and purpose.

  - **Check other active processes:** Investigate current running processes related to 'ebpfbackdoor' using `ps aux` to identify if they show signs of malicious behavior, such as unusual command-line arguments or unknown processes running under normal user accounts.

  - **Look for additional signs of compromise:** Review system logs (`/var/log/syslog` or `/var/log/secure`) for any related suspicious activities or errors occurring around the time the file was created that could indicate execution or configuration errors of the rootkit.

  ### Prioritization

  This alert carries a **high severity level** in an enterprise context due to its potential impact on critical systems and the likelihood of exploitation by advanced persistent threats. The behavior detected is associated with known privilege escalation techniques and is not commonly found in routine administrative activities.

  ### Blind Spots and Assumptions

  Detection may be limited by systems not actively monitoring file changes in directories of interest, especially if auditing is not configured correctly. The alert could be triggered by legitimate updates or administrative actions if an authorized user modifies cron jobs or sudoers configurations. A related detection to strengthen coverage would be monitoring for unexpected modifications to **system integrity checks** or **unapproved user account provision/changes**.

