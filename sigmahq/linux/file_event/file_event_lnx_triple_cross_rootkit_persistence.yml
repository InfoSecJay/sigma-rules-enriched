  ### Technical Context

  This detection identifies the creation of files named "ebpfbackdoor" in the "cron.d" and "sudoers.d" directories on Linux systems, indicating potential use of the TripleCross eBPF rootkit for persistence. The likely objective of an attacker using this technique is to maintain unauthorized access to the system and execute malicious code covertly. Relevant MITRE ATT&CK tactics include Persistence (T1053.003) and Defense Evasion.

  The primary telemetry sources involved are Linux file event logs. The security impact of malicious activity using this method is significant, as it could allow an adversary to maintain control over systems and execute arbitrary commands. It is essential to note that this detection does NOT confirm that the system is compromised by itself; legitimate system administration practices may create similar file artifacts.

  ---

  ### Investigation Steps

  - **Check for recent file creation:** Review Linux file event logs (e.g., `/var/log/audit/audit.log`) for Event ID related to file creation. Look for "ebpfbackdoor" in the `TargetFilename` field; creation timestamps should be examined in context with other system activities.

  - **Validate purpose of directories:** Confirm the existence of "cron.d" and "sudoers.d" directories on the affected host. Legitimate files in these directories typically contain system user tasks or granted permissions. Check that files originate from trusted sources.

  - **Analyze file ownership and permissions:** Use the command `ls -l /etc/cron.d/` and `ls -l /etc/sudoers.d/` to discover ownership and permissions of "ebpfbackdoor". Legitimate files are generally owned by root with strict permissions (e.g., 600 for sudoers files).

  - **Review recent system command history:** Check bash command history (e.g., `~/.bash_history`) for unusual commands related to file manipulation or execution from the time the "ebpfbackdoor" was created. Look for high-confidence malicious indicators such as commands involving `chmod` or `chown` on these files.

  - **Assess system integrity:** Check the presence of other common rootkit indicators such as unexpected Kernel Module changes or unusual network connections that may align with malicious persistence. Utilize tools like `chkrootkit` or `rkhunter` for deeper validation.

  ---

  ### Prioritization

  The alert is categorized as high severity due to the potential for critical systems to be compromised. The creation of persistence mechanisms like "ebpfbackdoor" is a common method employed by attackers, increasing the likelihood of malicious activity. Effective containment and remediation efforts are vital to lessen further impacts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by operating system logging configurations; ensure auditd is appropriately configured to capture file events. Legitimate system updates or administrative processes could inadvertently trigger this alert. A related detection is any unusual process spawning from compromised binaries that may execute commands referencing the "ebpfbackdoor", enhancing monitoring coverage.

