  ### Technical Context

  This rule detects the creation of files named "ebpfbackdoor" within the "cron.d" and "sudoers.d" directories, which is indicative of the Triple Cross eBPF rootkit persistence mechanism. The primary objective of an attacker utilizing this method is to maintain persistence on a compromised system while executing malicious payloads without detection. This behavior aligns with the MITRE ATT&CK technique for scheduled tasks and execution (T1053.003), specifically focusing on Linux environments.

  Key telemetry sources include Linux file event logs capturing modifications to critical directories. If malicious, the security impact could be severe, enabling ongoing control of the affected system and the potential for escalated privileges. Importantly, this alert does not confirm malicious activity on its own, as there may be legitimate reasons for similar file creations.

  ### Investigation Steps

  - **Check for 'ebpfbackdoor' file creation:** Review Linux file event logs (e.g., `/var/log/audit/audit.log`) for Event Type: 'CREATE' in the directories `/etc/cron.d/` and `/etc/sudoers.d/`. Any entries indicating 'ebpfbackdoor' may suggest malicious activity.

  - **Validate established cron jobs:** List current cron jobs using `crontab -l` for all users or inspecting `ls -la /etc/cron.d/`. Look for unusual entries or commands associated with the 'ebpfbackdoor' file name, particularly those that execute frequently.

  - **Assess system privilege changes:** Review logs for `sudo` commands and `/var/log/auth.log` for any identification of sudo access that coincides with the timeline of the 'ebpfbackdoor' file creation. Malicious activity would show unexpected sudo invocations by unfamiliar users or processes.

  - **Identify legitimate background processing:** Understand standard use cases for `/etc/cron.d/` and `/etc/sudoers.d/`, typically involving system maintenance tasks. Legitimate entries should involve routine system jobs, not custom scripts or binaries that include 'ebpfbackdoor.'

  - **Search for related malicious indicators:** Conduct a system-wide search for other eBPF-related artifacts or binaries using commands like `find / -name '*eBPF*'`. Any unauthorized or anomalous files may indicate further compromise.

  - **Evaluate system and asset criticality:** Examine whether the affected system or host is critical to operations. Higher value assets may warrant immediate escalatory responses, including isolating the host for further forensic analysis.

  ### Prioritization

  The severity of this alert is high due to the potential for escalated privileges and persistent control on critical enterprise systems. The likelihood of malicious exploitation is significant as this technique is known and weaponized among attackers seeking to maintain stealthy access.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive file monitoring in all sensitive directories or by adversaries using alternative naming conventions. Ensure logging settings for Linux file events are configured to capture modifications effectively. Legitimate scheduled tasks and user permission changes may trigger this alert. Consider implementing additional detection mechanisms for associated behaviors, such as direct file execution or system calls that utilize eBPF functionalities (related detections, e.g., for unusual `bpf()` syscall usage).

