  ---

  ### Technical Context

  This Sigma rule detects the creation of files in the `/etc/sudoers.d/` directory, which is a mechanism that attackers may exploit to persist elevated privileges on a Linux system. By placing a malicious file here, a potential adversary can grant unauthorized users the ability to run commands with root privileges. The relevant MITRE ATT&CK tactic and technique for this behavior is **Privilege Escalation (T1053.003)**.

  The primary telemetry for this detection includes file creation logs from Linux systems. If malicious, this behavior represents a significant security risk as it may allow an attacker prolonged access and control over the system. It is crucial to note that the mere creation of files in this directory does NOT confirm malicious intent on its own, as legitimate administrators may also perform this action.

  ---

  ### Investigation Steps

  - **Verify file creation event:** Check file event logs (e.g., audit logs, file integrity monitoring) for specific entries where `TargetFilename` begins with `/etc/sudoers.d/`. Look for Event IDs specific to the Linux audit system (ID 132, for FILE_CREATE) to confirm the process that initiated the action.

  - **Identify the creating user:** Look for the `uid` or `user` field in the logs related to the file creation action. Confirm whether the user has legitimate administrative roles or whether it aligns with standard operational behavior.

  - **Assess file content for malice:** Retrieve and review the content of the newly created files in `/etc/sudoers.d/`. Look for potentially malicious entries that could indicate privilege escalation, such as unrecognized usernames or excessive command privileges (e.g., ALL=(ALL) ALL).

  - **Review historical changes:** Examine the `/etc/sudoers.d/` directory for previous changes or creations (querying by timestamps), particularly looking for patterns in file creation that deviate from expected administrative activity.

  - **Monitor administrator activities:** Collect logs showing legitimate administrative actions taken by known users within the environment. Document and compare these activities against the suspicious file creation to determine if the observed behavior is part of normal IT operations.

  - **Correlate with other security events:** Cross-reference any file creation with other security alerts, such as failed sudo attempts or IAM violations, to establish a broader context of the user's activities on the system.

  ---

  ### Prioritization

  This alert should be considered of medium severity in an enterprise context, as unauthorized modifications to `/etc/sudoers.d/` can significantly compromise system integrity and allow persistent malicious access. The likelihood of exploitation is moderate, depending on the system's configuration and the attacker’s sophistication.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of comprehensive logging for all file system events or if log retention policies are inadequate. Attackers could employ evasion techniques such as timed manipulation of logs or creating files through legitimate processes to avoid detection. Legitimate administrative actions, such as routine configuration changes or privileges management, may commonly trigger this alert. A related detection concerning unauthorized `sudo` command usage can strengthen coverage and provide additional context for assessing risk levels.

