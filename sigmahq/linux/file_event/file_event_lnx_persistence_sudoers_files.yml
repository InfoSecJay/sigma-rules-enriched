title: Persistence Via Sudoers Files
id: ddb26b76-4447-4807-871f-1b035b2bfa5d
status: test
description: |
  Detects the creation or modification of the main "/etc/sudoers" file or files within the "/etc/sudoers.d/" directory on Linux systems.
  Adversaries may alter sudoers configuration to execute commands with elevated privileges without supplying a password.
references:
- https://www.sudo.ws/docs/man/sudoers.man/
- https://github.com/h3xduck/TripleCross/blob/1f1c3e0958af8ad9f6ebe10ab442e75de33e91de/apps/deployer.sh
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-05
modified: 2026-08-15
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1548.003
logsource:
  product: linux
  category: file_event
detection:
  selection:
  - TargetFilename: '/etc/sudoers'
  - TargetFilename|startswith: '/etc/sudoers.d/'
  filter_main_dpkg:
    Image|endswith: '/usr/bin/dpkg'
    TargetFilename: '/etc/sudoers.d/README.dpkg-new'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate sudoers changes by administrators or configuration-management tools
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of the main "/etc/sudoers" file or any files within the "/etc/sudoers.d/" directory on Linux systems. Attackers may modify these files to gain elevated privileges for executing commands without providing a password, allowing them to maintain persistence within the environment. This behavior aligns with the MITRE ATT&CK technique "T1548.003: Sudo and Sudo Caching" under the "Privilege Escalation" tactic.

  The primary telemetry sources include file event logs from the Linux operating system, particularly monitoring changes to "/etc/sudoers" and "/etc/sudoers.d/". If malicious, the impact could include unauthorized access to sensitive system functions and data. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate changes made by system administrators or configuration management tools may trigger the alert.

  ### Investigation Steps

  - **Review file modification timestamps:** Check `/etc/sudoers` and `/etc/sudoers.d/` for unexpected recent changes. Compare against known change windows for legitimate configuration management.

  - **Examine user activity:** Look for recent login sessions or command executions by users with privileges to modify sudoers (such as users in the wheel group). Review logs using `last` or system logs for suspicious login patterns.

  - **Assess related processes:** Identify processes that accessed the sudoers files around the same time as the modification. For example, check for `dpkg` activities using Sysmon Event ID 1 or Linux audit logs.

  - **Identify legitimate changes:** Confirm if there are documented changes made by authorized personnel as part of system maintenance or updates; review change logs or tickets in the ticketing system.

  - **Check for anomalies:** Look for unlikely user agents or atypical request patterns, especially during the time of change. Cross-reference with your device or user baselines.

  - **Confirm abnormal permission escalations:** If the log indicates modification by non-administrative users, or if a script was responsible, validate execution logs (e.g., `bash_history`) or file creation timestamps for evidence of unauthorized use.

  ### Prioritization

  This alert is of medium severity because unauthorized changes to sudoers files can lead to significant security risks, particularly on systems that handle sensitive information or critical infrastructure. Although the likelihood of malicious abuse is moderate, this behavior is a known tactic used frequently by adversaries to maintain access and escalate privileges.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions, such as routine updates or configuration changes that modify sudoers files. Ensure comprehensive logging from Linux file auditing is enabled to capture all changes effectively. Valid legitimate activities may include authorized script updates or configuration management tool operations. A complementary detection method includes monitoring for abnormal command executions with elevated privileges, enhancing coverage of potential misuses of permissions.

