note: |
  ### Technical Context

  This rule detects the creation of any files in the `/etc/sudoers.d/` directory, which is commonly exploited by attackers to establish persistence through privilege escalation. By modifying or creating sudoers files, an attacker can grant themselves or others elevated administrative rights, enabling further exploitation or control over the system. The relevant MITRE ATT&CK tactics include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), specifically the technique **Sudo and Sudo Caching** (T1053.003). The primary telemetry sources for this detection are file event logs on Linux systems.

  If malicious activity is confirmed, the security impact could lead to unauthorized control over critical system functions or data exfiltration. Importantly, this detection does NOT confirm that malicious intent is present; benign administrator actions can also trigger this alert.

  ### Investigation Steps

  - **Verify file creation details:** Check `/var/log/auth.log` or `journalctl` entries for `sudo` commands executed by the user around the time the file was created. Legitimate modifications will often be logged during scheduled maintenance or updates by authorized personnel.

  - **Review timestamp alignment:** Cross-reference the creation timestamp of new sudoers files with user activities in system logs (e.g., `/var/log/syslog`). Look for excessive gaps between the user's other commands, which may indicate a malicious activity.

  - **Identify unusual user modifications:** Analyze the owner of the created files using `ls -al /etc/sudoers.d/`. Believable modifications will be performed by system administrators (like the `root` user), while modifications by uncommon users might indicate a compromised account.

  - **Examine existing sudoers configurations:** Review the content of new files created in `/etc/sudoers.d/` for unfamiliar commands or potential escalations. Use `sudo -l` to list users' privileges; any unexpected entries may hint at malicious configurations.

  - **Check for mass file manipulations:** Investigate whether multiple sudoers files were created in a short time frame, as this could indicate a scripted attack. Explore scripts or cron jobs using `crontab -l` or search in `/etc/cron.d/` for potential malicious activity.

  ### Prioritization

  The severity of this alert is medium as it pertains to the risk of unauthorized privilege escalation in an enterprise environment. The impact can be significant for systems with critical roles, especially if the attacker aims to maintain access after initial exploitation. Although this behavior can be weaponized, it often aligns with legitimate administrative tasks, necessitating careful review before escalation.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of stealthy scripts that do not create or modify files in `/etc/sudoers.d/`, or by legitimate administrator actions that might unintentionally trigger the alert. Reliable detection depends on the configuration of file event logging on Linux systems. Additionally, other legitimate activities, such as system patching or user privilege adjustments by administrators, could result in similar alerts. As a related detection method, monitoring changes to the main `/etc/sudoers` file itself may strengthen coverage against privilege escalation attempts.

