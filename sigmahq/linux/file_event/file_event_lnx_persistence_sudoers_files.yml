title: Persistence Via Sudoers.d Files
id: ddb26b76-4447-4807-871f-1b035b2bfa5d
status: test
description: |
  Detects the creation or modification of files within the "sudoers.d" directory on Linux systems.
  Such activity may indicate an attempt to establish or maintain privilege escalation by granting specific users elevated permissions.
  Unauthorized changes to sudoers files are a common technique used by attackers to persist administrative access.
references:
- https://github.com/h3xduck/TripleCross/blob/1f1c3e0958af8ad9f6ebe10ab442e75de33e91de/apps/deployer.sh
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-05
modified: 2026-03-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1548.003
logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename|startswith: '/etc/sudoers.d/'
  filter_main_dpkg:
    Image|endswith: '/usr/bin/dpkg'
    TargetFilename: '/etc/sudoers.d/README.dpkg-new'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Creation of legitimate files in sudoers.d folder as part of administrator work
level: medium
note: |
  ### Technical Context

  This rule detects the creation or modification of files in the `/etc/sudoers.d/` directory on Linux systems. This behavior is typically associated with attempts to establish or maintain elevated privileges, which can facilitate unauthorized administrative access. The likely objective of an attacker leveraging this technique is to persistently gain elevated permissions for future access. This detection aligns with the MITRE ATT&CK tactic "Privilege Escalation" and technique "Sudo and Sudo Caching" (T1548.003).

  The primary telemetry source for this detection comes from file event logs on Linux systems, specifically monitoring actions related to file creation and modification in the sudoers.d directory. If the alert is confirmed as malicious, the security impact could be significant, allowing attackers continued administrative access to compromised systems. However, it should be noted that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger the rule.

  ### Investigation Steps

  - **Verify file creation/modification timestamps:** Check for timestamps of newly created or modified files in `/etc/sudoers.d/` using the `stat` command. Malicious modifications may show recent timestamps inconsistent with expected administrative activities.

  - **Identify the user responsible for changes:** Review `/var/log/auth.log` or `/var/log/secure` for entries surrounding the time of the alert to locate the user or process responsible for the changes. Legitimate changes usually involve recognized administrative accounts.

  - **Check for specific entries in sudoers.d files:** Look for any nonsensical or broad entries like `ALL=(ALL) NOPASSWD: ALL`, which indicate potentially malicious permission grants. Legitimate modifications should typically be narrower in scope.

  - **Review change history of sudoers.d files:** Use a version control system (if utilized) or log audits to assess any changes made to sudoers.d files. Abnormal or frequent changes by non-admin users would be a red flag.

  - **Look for related processes:** Investigate any running processes associated with the user who modified the files. Review processes using `ps -ef` and correlate with the time of the changes. Unexpected binaries or command-line arguments can indicate malicious intent.

  ### Prioritization

  This alert should be treated with medium severity due to the potential risks associated with unauthorized administrative privilege escalation. The impact is significant given that the affected system could allow adversaries extended control and persistence. This behavior is a common tactic employed in attacks and should be investigated promptly, especially if seen on critical systems.

  ### Blind Spots and Assumptions

  There are detection limitations as legitimate administrative actions may trigger this alert through normal operational activity, such as routine configuration changes within the sudoers.d directory. Furthermore, if logging for file events on Linux systems is not appropriately configured or is disabled, the detection may be ineffective. It's important to consider that legitimate DevOps processes might modify these files during deployments. Companion detections related to process execution for certain commands (e.g., `visudo`) could enhance coverage and provide additional context for investigations.

