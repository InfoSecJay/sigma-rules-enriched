title: Persistence Via Sudoers.d Files
id: ddb26b76-4447-4807-871f-1b035b2bfa5d
status: test
description: |
  Detects the creation or modification of files within the "sudoers.d" directory on Linux systems.
  Such activity may indicate an attempt to establish or maintain privilege escalation by granting specific users elevated permissions.
  Unauthorized changes to sudoers files are a common technique used by attackers to persist administrative access.
references:
- https://github.com/h3xduck/TripleCross/blob/1f1c3e0958af8ad9f6ebe10ab442e75de33e91de/apps/deployer.sh
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-05
modified: 2026-03-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1548.003
logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename|startswith: '/etc/sudoers.d/'
  filter_main_dpkg:
    Image|endswith: '/usr/bin/dpkg'
    TargetFilename: '/etc/sudoers.d/README.dpkg-new'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Creation of legitimate files in sudoers.d folder as part of administrator work
level: medium
note: |
  ### Technical Context

  This rule detects the creation or modification of files within the `/etc/sudoers.d/` directory on Linux systems, indicating potential privilege escalation attempts by unauthorized users. The likely attacker objective is to establish persistent administrative access by modifying sudoers roles and permissions, thereby allowing themselves or other malicious actors elevated privileges. This behavior falls under the MITRE ATT&CK tactic of Privilege Escalation (TA0004), specifically the technique of Sudo and Sudo Caching (T1548.003).

  The primary telemetry sources for this alert are file event logs for the Linux OS, particularly focusing on events related to modifications in the `/etc/sudoers.d/` directory. Malicious manipulation of these files could lead to unauthorized administrative control, posing significant security risks. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may trigger the same events, especially during updates or configuration changes.

  ### Investigation Steps

  - **Check for recent changes in `/etc/sudoers.d/`:** Review file modification timestamps in the directory to identify any recent changes using `ls -lt /etc/sudoers.d/` and correlate against user activity.

  - **Correlate with system logins:** Investigate authentication logs (e.g., `auth.log` or via `journalctl`) for any unusual or unauthorized login attempts matching the timestamps of the sudoers modifications. Look for failed logins or logins from unexpected IP addresses.

  - **Validate legitimate administrative activities:** Confirm whether recent changes align with scheduled maintenance or updates by checking for administrative actions in logs (e.g., `apt`, `dpkg`) that could justify modifications to the `/etc/sudoers.d/` files.

  - **Identify high-confidence indicators of compromise:** Look for the presence of specific files created or modified that deviate from normal naming conventions or configurations, such as atypical file formats or obscure filenames in `/etc/sudoers.d/`.

  - **Assess user permissions for suspicious entries:** Review the contents of modified sudoers files with `visudo` or `cat` to identify any unfamiliar users or commands that could grant unauthorized access, focusing on new entries or modifications.

  - **Monitor additional persistence mechanisms:** Check for other known persistence techniques, like entries in `~/.bashrc` or cron jobs, which may synergize with unauthorized sudo access to strengthen threat actor footholds on the system.

  ### Prioritization

  This alert is assigned medium severity as it can impact critical systems that host sensitive data or services. Given that the manipulation of sudoers files is a common tactic for attackers, the likelihood of malicious abuse is significant, warranting prompt investigation to prevent escalation of privileges.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited if logging configurations are insufficient or if changes are made through processes that do not generate file event logs. Common administrative tasks—such as system updates—may trigger this alert, lending it a risk of false positives. Monitoring related processes like `sudo` commands not correlating suspicious file activities can add context to alerts and enhance detection coverage.

