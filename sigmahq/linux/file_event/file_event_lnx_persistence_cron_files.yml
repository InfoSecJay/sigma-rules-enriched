title: Persistence Via Cron Files
id: 6c4e2f43-d94d-4ead-b64d-97e53fa2bd05
status: test
description: Detects creation of cron file or files in Cron directories which could
  indicates potential persistence.
references:
- https://github.com/microsoft/MSTIC-Sysmon/blob/f1477c0512b0747c1455283069c21faec758e29d/linux/configs/attack-based/persistence/T1053.003_Cron_Activity.xml
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2022-12-31
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.003
logsource:
  product: linux
  category: file_event
detection:
  selection1:
    TargetFilename|startswith:
    - '/etc/cron.d/'
    - '/etc/cron.daily/'
    - '/etc/cron.hourly/'
    - '/etc/cron.monthly/'
    - '/etc/cron.weekly/'
    - '/var/spool/cron/crontabs/'
  selection2:
    TargetFilename|contains:
    - '/etc/cron.allow'
    - '/etc/cron.deny'
    - '/etc/crontab'
  condition: 1 of selection*
falsepositives:
- Any legitimate cron file.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of cron files or the modification of cron directories on Linux systems, which could indicate potential persistence mechanisms employed by threat actors. Cron jobs are scheduled tasks that run at specified intervals; attackers may exploit these to establish persistence on compromised systems, allowing them to execute malicious scripts or programs automatically. This behavior suggests goals such as maintaining access, executing further malicious actions, or evading detection.

  The relevant MITRE ATT&CK techniques include:
  - **Persistence via Cron Jobs** (T1053.003): This technique involves the manipulation of cron files to create scheduled tasks that may allow malicious code to run automatically at intervals.
  - **Privilege Escalation** (T1068): If attackers gain higher privileges while manipulating such configurations, they can further compromise the environment.

  Primary data sources for detecting these activities include:
  - File event logs from Linux systems, specifically monitoring directories like `/etc/cron.*` and `/var/spool/cron/crontabs/`.

  ### Investigation Steps
  - **Review File Event Logs**: Check logs for any recent events involving file creation or modification within the `/etc/cron.*` directories and `/var/spool/cron/crontabs/`.

  - **Analyze Cron Job Entries**: Examine the contents of detected cron jobs for unusual commands or scripts that could indicate malicious intent.

  - **Check for System Integrity**: Verify against known good configurations using file integrity monitoring tools, focusing on cron-related file paths to identify unauthorized changes.

  - **Correlate with User Activity**: Identify the user account associated with the creation of the cron file to assess whether the activity aligns with their expected behavior and privileges.

  ### Prioritization
  This alert is of medium severity in an enterprise environment as the creation of unauthorized cron jobs could signify an active compromise, leading to persistence in the network. The likelihood of such activities correlates with advanced threat actors, especially in environments where sensitive operations occur.

  ### Blind Spots and Assumptions
  Detection logic may miss legitimate cron job changes made by authorized personnel, leading to potential false positives. It assumes that the file event logs are capturing all relevant activities around cron jobs without gaps. The system must be configured to ensure proper logging of file events for the detection to be effective, with appropriate log retention policies in place to facilitate thorough investigations.

