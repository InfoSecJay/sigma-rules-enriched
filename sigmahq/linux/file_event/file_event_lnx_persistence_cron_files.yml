title: Persistence Via Cron Files
id: 6c4e2f43-d94d-4ead-b64d-97e53fa2bd05
status: test
description: Detects creation of cron file or files in Cron directories which 
  could indicates potential persistence.
references:
- https://github.com/microsoft/MSTIC-Sysmon/blob/f1477c0512b0747c1455283069c21faec758e29d/linux/configs/attack-based/persistence/T1053.003_Cron_Activity.xml
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2022-12-31
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.003
logsource:
  product: linux
  category: file_event
detection:
  selection1:
    TargetFilename|startswith:
    - '/etc/cron.d/'
    - '/etc/cron.daily/'
    - '/etc/cron.hourly/'
    - '/etc/cron.monthly/'
    - '/etc/cron.weekly/'
    - '/var/spool/cron/crontabs/'
  selection2:
    TargetFilename|contains:
    - '/etc/cron.allow'
    - '/etc/cron.deny'
    - '/etc/crontab'
  condition: 1 of selection*
falsepositives:
- Any legitimate cron file.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of cron files within specific Linux directories associated with scheduled tasks (e.g., `/etc/cron.d/`, `/etc/crontab`). Such changes could indicate attempts to establish persistent mechanisms for executing malicious commands. The likely attacker objective is to maintain access to a compromised system, allowing for the execution of code at regular intervals. This detection aligns with the MITRE ATT&CK tactic of Persistence, specifically technique T1053.003 (Cron Jobs) and Execution.

  The primary telemetry source is Linux file event logs that record modifications to the filesystem. A successful malicious activity could lead to the execution of unauthorized processes, potentially compromising system integrity and confidentiality. However, this detection does NOT confirm malicious intent on its own; legitimate system administrators frequently alter cron jobs for maintenance or scheduling purposes.

  ### Investigation Steps

  - **Identify recent cron file changes:** Review `/var/log/audit/audit.log` for Event ID 1102 detailing `execve` calls linked to cron job creation. Look for unusual filenames or patterns (e.g., those starting with a random string) that are not standard for the environment.

  - **Check the file ownership and permissions:** Validate the ownership of newly created cron files. Legitimate cron jobs typically have ownership by `root` or the user intended to run the job. Discrepancies might indicate malicious changes.

  - **Review cron job content:** Examine the contents of any modified or newly created files in `/etc/cron.*` or `/var/spool/cron/crontabs/` for suspicious command execution or unexpected behavior (e.g., base64-encoded or obfuscated scripts).

  - **Assess legitimate cron activity:** Identify any scheduled tasks in use by performing a `crontab -l` for users, ensuring they align with expected operational procedures, such as regular backups, updates, or maintenance scripts.

  - **Determine system criticality:** Consider the role of the affected system (e.g., server hosting sensitive applications). Prioritize investigation based on the potential impact on critical business functions if a malicious cron job executes.

  - **Identify high-confidence malicious indicators:** Look for newly created cron jobs that execute known malware or tools (e.g., shell scripts calling `curl` to fetch files from external IPs). Cross-reference with threat intelligence for signatures of known attacks.

  ### Prioritization

  This alert is of medium severity, as the impact largely depends on the importance of the compromised system. However, the likelihood of malicious abuse is significant due to the common tactic of using cron jobs for persistence in both targeted and opportunistic attacks.

  ### Blind Spots and Assumptions

  Detection may miss indicators if file creation events are suppressed or if logs are not configured to capture necessary details reliably. Evasion techniques might include legitimate cron job modifications to obscure malicious activity. Administrators may alter cron jobs routinely, generating false positives if not reviewed with context. Companion detections could include monitoring for unusual process execution tied to cron jobs or system auditing logs that might reveal broader attempts at privilege escalation.

