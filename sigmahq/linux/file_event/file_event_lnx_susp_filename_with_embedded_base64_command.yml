title: Suspicious Filename with Embedded Base64 Commands
id: 179b3686-6271-4d87-807d-17d843a8af73
status: experimental
description: |
  Detects files with specially crafted filenames that embed Base64-encoded bash payloads designed to execute when processed by shell scripts.
  These filenames exploit shell interpretation quirks to trigger hidden commands, a technique observed in VShell malware campaigns.
references:
- https://www.trellix.com/blogs/research/the-silent-fileless-threat-of-vshell/
author: '@kostastsale'
date: 2025-11-22
tags:
- attack.execution
- attack.t1059.004
- attack.defense-evasion
- attack.t1027
logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename|contains:
    - '{echo'
    - '{base64,-d}'
  condition: selection
falsepositives:
- Legitimate files with similar naming patterns (very unlikely).
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially malicious files with filenames that include Base64-encoded bash commands. The technique exploits specific shell interpretation quirks to execute hidden commands when processed by shell scripts. This method has been notably observed in VShell malware campaigns, where attackers craft filenames to circumvent traditional security measures and execute their payloads stealthily. Specifically, the use of embedded commands allows adversaries to employ fileless techniques, making detection more challenging.

  The relevant MITRE ATT&CK tactics for this detection are "Execution" (TA0002) and "Defense Evasion" (TA0005). The specific techniques include Command and Scripting Interpreter (T1059.004) for executing commands through a shell and Obfuscated Files or Information (T1027), as the payload is hidden within a filename. The primary data source for detecting this activity will include Linux file event logs, which capture information about file creations, modifications, or accesses.

  ### Investigation Steps
  - **Assess File Events:** Review the Linux file event logs for files with suspicious names containing patterns such as `{echo` or `{base64,-d}` to identify potential threats.
  - **Inspect Associated Processes:** Analyze the process creation logs to determine if any shell processes initiated by these suspicious files are executing commands, paying close attention to parent-child relationships.
  - **Evaluate Shell History:** If possible, review the shell command history of users who accessed the suspicious files to identify any command executions that align with the Base64 payloads embedded in the filenames.
  - **Correlate with User Activity:** Cross-reference the identified files and processes with the accounts that interacted with them to establish context and prioritize investigation according to user roles and permissions.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant impact on security posture. The embedded execution of payloads can lead to unauthorized access, data exfiltration, or further compromise, especially if executed by privileged users or within sensitive environments.

  ### Blind Spots and Assumptions
  This detection logic may miss legitimate files that coincidentally exhibit similar naming patterns, although such occurrences are considered very unlikely. Additionally, the effectiveness of this rule assumes all relevant file events are being logged appropriately; if logging configurations for file events on Linux are inadequate or disabled, detection will fail. There is also an assumption that threat actors are not using refined obfuscation techniques that escape this naming pattern.

