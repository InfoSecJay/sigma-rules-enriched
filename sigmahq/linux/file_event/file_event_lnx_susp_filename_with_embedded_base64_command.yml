  ---

  ### Technical Context

  This Sigma rule detects filenames containing embedded Base64 commands, which are indicative of an attack leveraging shell interpretation quirks to execute hidden commands. The likely attacker objective is to execute arbitrary code remotely while evading standard detection methods. This behavior aligns with the MITRE ATT&CK technique for command and control through the use of "PowerShell" or "Scripting" (T1059.004) and may involve evading defenses by obfuscating malicious commands (T1027).

  The primary telemetry source for this detection is Linux file events, specifically monitoring file creation or modification logs. If the observed behavior is indeed malicious, it could lead to unauthorized system access, data exfiltration, or persistent malware installation. Importantly, this detection alone does not confirm a successful execution of malicious commands—it only indicates the presence of suspicious filename patterns.

  ---

  ### Investigation Steps

  - **Examine affected filenames:** Look at the filename patterns in the log events (e.g., `/var/log/audit/audit.log` or `syslog`). Legitimate files should not contain sequences like `{echo` or `{base64,-d}`. Assess if the naming pattern deviates from organizational norms.

  - **Check file creation details:** Investigate Event ID 25230 from the `auditd` logs for the creation time and user who authored the file. Legitimate processes will typically have predictable timestamps and known users; anomalies here may indicate malicious activity.

  - **Analyze script execution contexts:** Review surrounding events in the same timeframe, like process executions linked to the suspicious filenames (Sysmon Event ID 1 or Bash process logs). A process attempting to run one of these filenames without authorization could indicate a compromise.

  - **Correlate with known malware indicators:** Look into threat intelligence feeds to cross-reference the filenames against known VShell malware patterns or similar attacks. Presence of any such indicators alongside the alert reinforces suspicion.

  - **Check for unusual parent processes:** Identify the parent processes of the suspicious file using process tree analysis (e.g., `pstree` or `ps -ef`). Legitimate scripts typically originate from expected parent processes (like user-initiated actions); deviations could suggest malicious exploitation.

  ---

  ### Prioritization

  This alert should be treated with high priority due to its impact on Linux environments where unauthorized shell command execution can lead to significant security incidents. The likelihood of malicious abuse is high given the use of obfuscated payloads in ongoing campaigns such as VShell, making it a common technique among threat actors.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques may include renaming malicious files or using different obfuscation methods that aren't detected by this rule. Organizations should ensure logging for file creations and modifications is enabled and properly configured on all Linux systems for reliable detection. Additionally, legitimate automated processes or backup scripts might trigger similar alerts, leading to possible false positives. A related detection to consider includes monitoring for unexpected outbound network connections or command executions that follow the triggering of this alert, which can help identify further malicious activity.

