level: high
note: |
  ### Technical Context

  This Sigma rule detects files on Linux systems that have filenames containing Base64-encoded commands embedded within them, which exploit shell interpretation quirks to run hidden instructions. The objective of an attacker using this technique is often to execute malicious payloads without detection through traditional means, as evidenced in VShell malware campaigns. This relates to the MITRE ATT&CK technique of Command-Line Interface (T1059.004) and Defense Evasion (T1027).

  The primary telemetry involved comes from Linux file events, specifically targeting file creation or modifications that contain certain encoded command sequences. If malicious, this behavior can lead to remote code execution, privilege escalation, or data exfiltration. Importantly, this detection does NOT confirm that the file was executed successfully, nor does it guarantee that the activity was malicious without additional context.

  ---

  ### Investigation Steps

  - **Identify affected file details:** Review file creation/modification logs for specific filenames that include `{echo` or `{base64,-d}` using Linux audit logs (e.g., `/var/log/audit/audit.log`), focusing on Event ID for file events (e.g., syscall 2 or 64).

  - **Verify execution attempts:** Check for any corresponding process creation events related to these files using Sysmon Event ID 1 or equivalent process monitoring tools. Look for directly related commands or scripts invoking these filenames.

  - **Correlate with command history:** Investigate user command histories (e.g., `.bash_history`) for commands that may have invoked the suspicious files. Analyze timestamps to confirm if file events align with user activities.

  - **Establish baseline for legitimate activity:** Identify known benign scripts or applications that may have similar naming conventions within the environment, and document their usual behavior to differentiate from suspicious activity.

  - **Examine file contents and payload:** If possible, analyze the contents of the suspicious files with tools like `base64`, looking for potentially harmful commands encoded that could indicate active exploitation.

  - **Assess host criticality and impact:** Determine the role of the affected Linux host (e.g., server, application host) and the potential impact of malicious activity based on its function within the network. High-privilege or critical systems should elevate the need for urgent action.

  ---

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems where these malicious payloads could lead to severe operational disruptions. The likelihood of malicious abuse is significant, as techniques like this are commonly employed in advanced persistent threats and script-based attacks. Furthermore, filesystem anomalies like this are often weaponized in various attack vectors.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of users to create variations of benign filenames that resemble those targeted by the rule, leading to false positives. Required log sources must include comprehensive audit logging configurations on Linux systems to capture all relevant file event actions. Legitimate build or update processes may inadvertently trigger this alert if they use similar naming conventions. A relevant companion detection would be monitoring for unusual process creations or command line executions associated with elevated permissions (e.g., `sudo`, or processes executing scripts).

