title: Suspicious Filename with Embedded Base64 Commands
id: 179b3686-6271-4d87-807d-17d843a8af73
status: experimental
description: |
  Detects files with specially crafted filenames that embed Base64-encoded bash payloads designed to execute when processed by shell scripts.
  These filenames exploit shell interpretation quirks to trigger hidden commands, a technique observed in VShell malware campaigns.
references:
- https://www.trellix.com/blogs/research/the-silent-fileless-threat-of-vshell/
author: '@kostastsale'
date: 2025-11-22
tags:
- attack.execution
- attack.stealth
- attack.t1059.004
- attack.t1027
logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename|contains:
    - '{echo'
    - '{base64,-d}'
  condition: selection
falsepositives:
- Legitimate files with similar naming patterns (very unlikely).
level: high
note: |
  ### Technical Context

  This Sigma rule detects filenames that contain commands structured in a way that they can execute Base64-encoded bash payloads when processed by a shell script, which may indicate a fileless malware attack. The likely attacker objective is to execute arbitrary commands on the host without being detected by traditional file-based defenses, leveraging the exploitation of shell interpretation quirks. This behavior aligns with the MITRE ATT&CK technique for Command and Scripting Interpreter, specifically PowerShell (T1059.004) and the method of Obfuscated Files or Information (T1027).

  Primary telemetry sources include Linux file event logs capturing file creation and modifications. The significant concern if malicious is that this behavior allows for stealthy execution of commands that could lead to data exfiltration, lateral movement, or further compromise of the system. It's essential to note that this detection does NOT confirm malicious intent on its own, as filenames may contain similar patterns due to benign activity or misconfiguration.

  ### Investigation Steps

  - **Review file creation logs**: Examine Linux file event logs for Event ID related to file creation (e.g., `/var/log/audit/audit.log`, checking for entries indicating creations with filenames containing `{echo` or `{base64,-d}`.
  - **Identify high-confidence malicious indicators**: Look for any processes spawned from these anomalous filenames that invoke a shell execution, recorded with a PID that can be traced to the creation events. Check `/proc/[PID]/cmdline` for suspicious commands associated with these events.
  - **Verify legitimate file examples**: Compare any flagged filenames against known legitimate scripts used within your environment (e.g., common admin scripts); legitimate ones usually do not contain embedded command indicators like `{echo` or `{base64,-d}`.
  - **Analyze the file's metadata**: Utilize `ls -l` and `stat` on the flagged files to assess ownership, modification times, and access rights to identify suspicious or unexpected users or groups having file ownership.
  - **Correlate with established threat intelligence**: Check the targeted system against known threat intelligence sources for indicators related to VShell malware campaigns, focusing on the presence of command sequences that match observed patterns.
  - **Monitor affected system behavior**: Continuously assess the host's logs for other suspicious activities post-detection, such as network connections or additional file creations that could indicate a wider compromise.

  ### Prioritization

  This alert should be treated with high severity, especially if it involves critical systems, as the presence of suspicious filenames may indicate an active exploitation attempt. The likelihood of malicious abuse is high, given that the methodologies used here are commonly weaponized in targeted malware campaigns.

  ### Blind Spots and Assumptions

  Detection may not flag all attempts, as attackers can use varied encoding techniques or alternative scripting languages to obfuscate their commands. Reliable detection requires comprehensive audit logging on all file operations and potential enforcement of additional security controls on script execution. Legitimate activities may include the use of scripts in automated software deployment, which can generate similarly structured filenames. To enhance coverage, a complementary detection rule for anomalous subprocess creations from these scripts using Shell or Python interpreters could strengthen detection capabilities.

