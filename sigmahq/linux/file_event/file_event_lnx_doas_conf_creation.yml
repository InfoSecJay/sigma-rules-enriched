note: |
  ### Technical Context

  This rule detects the creation of the `doas.conf` file on Linux systems, which governs how the `doas` command is used for privilege escalation. The likely attacker objective is to bypass standard security controls, allowing unauthorized users to execute commands with elevated privileges. This behavior is relevant to the MITRE ATT&CK technique "Sudo and Doas" (T1548). The primary telemetry source is Linux file event logs, specifically monitoring changes to the `/etc/doas.conf` file. If this behavior is malicious, it can significantly compromise system integrity and enable further exploitation. However, this detection does NOT confirm that the created file is being used for malicious intent on its own.

  ### Investigation Steps

  - **Check file existence and permissions:**
    Review the attributes of `/etc/doas.conf`. Use `ls -l /etc/doas.conf` to confirm permissions. Legitimate configurations typically have read permissions only for the root user.

  - **Examine recent changes and ownership:**
    Investigate who created the file by running `stat /etc/doas.conf`. A newly created file owned by a non-privileged user indicates potential malicious activity.

  - **Analyze related process creation events:**
    Query for Security Event ID 4688 for instances of the `doas` command being executed following the file’s creation. Look for atypical parent processes that may suggest misuse.

  - **Review system logs for administrative actions:**
    Check `/var/log/auth.log` for any `doas` command executions around the same time as the file creation. Legitimate use would generally follow established operational procedures.

  - **Identify recent user activity prior to detection:**
    Use command history logs (`~/.bash_history`) of users who may have created the `doas.conf` file. Look for unusual commands or indicators of privilege escalation attempts.

  ### Prioritization

  This alert is of medium severity due to the potential for high-impact privilege escalation on critical systems. The likelihood of malicious abuse is elevated, especially in environments where the `doas` command is not typically used. This specific behavior is not commonly weaponized but indicates attention is required.

  ### Blind Spots and Assumptions

  The detection may miss cases where log configurations do not capture file creations, leading to incomplete coverage. Legitimate activities such as system administration by trusted personnel may inadvertently trigger the alert. A related detection involving monitoring changes to the `/etc/sudoers` file strengthens overall visibility into privilege escalation mechanisms.

