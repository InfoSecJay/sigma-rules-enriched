  ### Technical Context
  This detection rule identifies the creation of the `doas.conf` file on Linux systems. The `doas` command provides a minimalistic alternative to `sudo`, allowing delegated administration with finer control. An attacker might create or modify this configuration file to grant unauthorized privileges, thereby escalating their access or maintaining persistence within a compromised environment. The creation of this file could indicate a potential threat actor's intent to configure an elevated permission environment, which is often a precursor to exploitation or lateral movement.

  The relevant MITRE ATT&CK tactics associated with this activity include **Defense Evasion (T1203)** and **Privilege Escalation (T1548)**. By creating or altering the `doas.conf`, an attacker aims to execute commands with elevated privileges, potentially bypassing existing security controls. The primary data source for this detection will be file event logs that monitor changes to critical system files on Linux hosts.

  ### Investigation Steps
  - **Review File Event Logs:** Examine logs for the creation of `/etc/doas.conf` and correlate the timestamp with other user activities. This could provide insights into whether the file was created legitimately or involved in malicious activities.
  - **Check User Activity:** Investigate the user accounts that triggered the creation of the file. Verify whether these accounts have legitimate reasons to modify or create configuration files like `doas.conf`.
  - **Audit Permissions:** Assess the current permissions set on the `doas.conf` file. Ensure the file does not allow unauthorized users access that could facilitate further exploitation.
  - **Monitor for Subsequent Executions:** Look for any subsequent use of the `doas` command following the creation of the `doas.conf`. Any abnormal executions may warrant additional investigation.

  ### Prioritization
  This alert is categorized with medium severity due to its high potential impact on security if an attacker successfully gains elevated privileges through the misuse of `doas`. The likelihood of this scenario increases in environments with rich user privileges, making it important for a SOC to monitor closely.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may exist if file event logging is not enabled or if there are misconfigurations in monitoring critical filesystem changes. The detection logic assumes that the creation of `doas.conf` is a potentially malicious action but may yield false positives if legitimate administrative activities occur. Adequate logging of file creation events and appropriate configurations on the Linux host are necessary to ensure the alert functions effectively.

