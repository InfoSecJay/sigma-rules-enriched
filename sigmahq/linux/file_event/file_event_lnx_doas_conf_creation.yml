note: |
  ### Technical Context

  This rule detects the creation of the `doas.conf` file on Linux systems, which is a configuration file for the `doas` command, allowing users to execute commands as another user, typically the superuser. Attackers may create this file to set up unauthorized privilege escalation or bypass access control on a compromised system. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and the technique **Privilege Escalation** (T1548).

  The primary telemetry source for this detection is Linux file system events tracking changes in critical configuration paths. A successful detection indicates potential malicious activity, as the unauthorized creation of this file could indicate an attempt to gain elevated privileges. However, this detection does NOT confirm whether the file was used for malicious purposes without further context.

  ### Investigation Steps

  - **Verify recent file changes:** Check Linux audit logs (e.g., `/var/log/audit/audit.log` or `Systemd Journal`) for Event ID related to file creation (e.g., `type=CONFIG_CHANGE`), looking for entries that include `/etc/doas.conf`.

  - **Investigate file ownership and permissions:** Ensure that the created file has appropriate ownership (e.g., owner should be root:root) and permissions (e.g., 0440). Malicious indicators include unusual ownership changes or overly permissive settings.

  - **Review command history:** Analyze user command history files (e.g., `~/.bash_history`) for any suspicious commands executed before and after the file creation. Look for signs of privilege manipulation or tools often associated with privilege escalation.

  - **Recognize legitimate usage:** Confirm whether `doas` is expected in your environment by checking its usage in `/etc/sudoers`. Legitimate use should show signed requests for elevated commands by authorized users.

  - **Check for additional filesystem artifacts:** Look for other file changes around the same timestamp, particularly in `/etc/` or `/bin/`, that could indicate a related compromise (e.g., changes to `/etc/passwd` or `/bin/su`), as part of broader privilege escalation attempts.

  ### Prioritization

  This alert is of medium severity as it indicates a potential privilege escalation attempt on critical systems. Given that `doas` is often used for severe modifications, the likelihood of malicious intent is moderate if flagged. The creation of configuration files like `doas.conf` is a common step in Linux exploitation.

  ### Blind Spots and Assumptions

  This detection may miss deliberate suppression mechanisms, such as using alternate file paths or renaming files post-creation. A requirement for reliable detection is the configuration of file integrity monitoring or audit logging on Linux hosts. Legitimate configurations or changes by DevOps teams may trigger this alert. A related detection could focus on monitoring user access patterns following `doas` file creation to capture potentially malicious usage.

