  manager
level: low # Can be increased to a higher level after some tuning
note: |
  ### Technical Context
  This detection rule monitors for the creation of shell scripts in the `/etc/profile.d/` directory on Linux systems, specifically targeting files that end with `.sh` or `.csh`. This behavior may indicate an attacker attempting to establish persistence by installing malicious shell scripts, as the `profile.d` folder is used to execute scripts automatically for user sessions. Attackers may exploit this mechanism to load malicious code at system startup, leading to unauthorized access or further compromise of the system.

  The likely attacker objectives include maintaining access to the compromised system and executing arbitrary commands under the context of legitimate processes. This tactic aligns with the **Persistence** tactic under the MITRE ATT&CK framework, specifically the techniques **T1037** (Boot or Logon Autostart Execution) and **T1547** (Windows Management Instrumentation). Primary data sources for this detection include file event logs capturing modifications to files within the `/etc/profile.d/` directory.

  ### Investigation Steps
  - **Review File Event Logs**: Check for newly created or modified files within the `/etc/profile.d/` directory. Pay particular attention to the filenames and contents of these scripts to determine if they exhibit suspicious behavior or references to known malware.
  - **Analyze Command History**: Look into user command history (e.g., `.bash_history`) for any commands related to script creation or modifications in the `/etc/profile.d/` directory. This can help identify potential malicious activities by users.
  - **Correlate with User Activity**: Analyze authentication logs or system logs for unusual user activity patterns correlating with the timestamps of the script creations. Unexpected behavior could indicate a compromised account.
  - **Check for Known Indicators**: Utilize threat intelligence feeds to compare filenames or script contents against known malware signatures, specifically focusing on indicators associated with GobRAT or similar malware families.

  ### Prioritization
  The severity of this alert is considered low due to the potential for legitimate administrative tasks that involve script creation in the `/etc/profile.d/` directory. However, continuous monitoring and tuning of the alert can help elevate its priority if shaped by contextual threat intelligence and environmental baselines.

  ### Blind Spots and Assumptions
  This detection rule may not identify all instances of malicious activity due to potential legitimate use cases for script creation in the monitored directory. The assumption is that any script created here is suspicious unless proven otherwise. The functionality of this alert relies on complete file event logging, and missing logs can lead to blind spots. Additional tuning may be needed to filter out legitimate scripts created during routine system updates or software installations.

