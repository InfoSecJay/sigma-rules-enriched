logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename|contains: '/etc/profile.d/'
    TargetFilename|endswith:
    - '.csh'
    - '.sh'
  condition: selection
falsepositives:
- Legitimate shell scripts in the "profile.d" directory could be common in your environment.
