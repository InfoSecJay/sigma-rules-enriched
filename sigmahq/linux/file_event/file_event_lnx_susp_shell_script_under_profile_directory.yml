title: Potentially Suspicious Shell Script Creation in Profile Folder
id: 13f08f54-e705-4498-91fd-cce9d9cee9f1
status: test
description: Detects the creation of shell scripts under the "profile.d" path.
references:
- https://blogs.jpcert.or.jp/en/2023/05/gobrat.html
- https://jstnk9.github.io/jstnk9/research/GobRAT-Malware/
- https://www.virustotal.com/gui/file/60bcd645450e4c846238cf0e7226dc40c84c96eba99f6b2cffcd0ab4a391c8b3/detection
- https://www.virustotal.com/gui/file/3e44c807a25a56f4068b5b8186eee5002eed6f26d665a8b791c472ad154585d1/detection
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-06-02
tags:
- attack.persistence
logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename|contains: '/etc/profile.d/'
    TargetFilename|endswith:
    - '.csh'
    - '.sh'
  condition: selection
falsepositives:
- Legitimate shell scripts in the "profile.d" directory could be common in your 
  environment. Apply additional filter accordingly via "image", by adding 
  specific filenames you "trust" or by correlating it with other events.
- Regular file creation during system update or software installation by the 
  package manager
level: low # Can be increased to a higher level after some tuning
note: |
  ### Technical Context

  This rule detects the creation of shell scripts with extensions `.sh` or `.csh` within the `/etc/profile.d/` directory, which is used to initialize user profiles on Linux systems. Attackers may aim to persist malicious payloads that are executed when users log in, facilitating long-term access while avoiding detection. This behavior aligns with the MITRE ATT&CK tactic of Persistence, specifically technique T1547.001 (Boot or Logon Autostart Execution: Scripts).

  The primary telemetry sources for this detection are file event logs from Linux systems, particularly focusing on file creation events within the specified directory. The security impact of this detection can be significant, as it indicates potential attempts to establish malicious persistence mechanisms. However, this detection alone does not confirm the malicious intent; it may also capture benign activities such as legitimate admin updates or configurations.

  ### Investigation Steps

  - **Review the file creation event details:** Check for Security Event ID for file creation in Linux systems to retrieve timestamps, user accounts, and command origins. Look for scripts created in a short time frame or irregular hours as potential malicious indicators.

  - **Assess the user context:** Evaluate the user account (via `/var/log/auth.log` or similar) that triggered the creation of the script. Legitimate scripts may be created by system administrators or automated tasks, while anomalous accounts indicative of compromise should be flagged.

  - **Examine script contents if possible:** If accessible, review the content of the created shell scripts for suspicious commands or obfuscated code. Legitimate scripts typically contain standard initialization commands or configuration settings.

  - **Correlate with process execution:** Analyze Sysmon Event ID 4688 for processes that executed following the script creation to identify any direct execution of malicious payloads. Look for unexpected or non-standard interpreter calls (e.g., `bash`, `sh`).

  - **Identify additional persistence mechanisms:** Look for other directories that may have been accessed around the same time (such as `/etc/cron.d/`, `/etc/init.d/`, or user-specific startup scripts) to identify other signs of compromise or persistence attempts.

  ### Prioritization

  This alert should be considered low-severity initially, but contextually important given that it involves potential persistence techniques. The likelihood of abuse is moderate; while the creation of shell scripts is not uncommon in Linux environments, it can be indicative of deeper malicious activity, especially when combined with suspicious user behavior or system configurations.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate software updates can result in similar entries, potentially overstating benign activity. The reliability of this detection depends on comprehensive logging configurations, including monitoring of file activities. Frequent administrative tasks might also trigger similar alerts, thus normalizing their context within operational thresholds. A related companion detection could be monitoring for unusual changes in startup services (e.g., using SystemD or crontab entries) to strengthen overall detection coverage.

