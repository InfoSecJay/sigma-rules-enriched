level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the `wget` command to download files directly into temporary directories, such as `/tmp` or `/var/tmp`, on Linux systems. Attackers often utilize `wget` to retrieve malware or other suspicious files clandestinely, facilitating further exploitation (e.g., downloading backdoors or exfiltrating data).

  Relevant MITRE ATT&CK techniques include Command and Control (T1105), as the downloads often serve as components of command and control frameworks or malware delivery mechanisms. The primary telemetry source for this rule consists of Linux file event logs capturing file operations, particularly those related to `wget`. If malicious, this behavior can lead to system compromise and unauthorized data access or exfiltration.

  It is important to note that this detection alone does not confirm malicious intent; legitimate system processes may also perform similar actions as part of their normal operations.

  ### Investigation Steps

  - **Check file creation logs:** Review security logs (Linux Audit logs, `/var/log/audit/audit.log`) for entries related to file creation in `/tmp/` or `/var/tmp/`. Look for events with `chmod` or `chown` operations right after `wget` executes. Legitimate applications typically create files without rapid permissions changes.

  - **Identify the process tree:** Examine the process tree using `pstree` or similar commands to find the parent/child relationship of the `wget` process. Note any abnormal parent processes that may indicate a malicious workflow (e.g., if run by `bash` or an unexpected service).

  - **Review the downloaded file:** Validate the contents of the downloaded file. Check its hash against threat intelligence sources or VirusTotal to identify known malicious files. A hash match with previously detected malware indicates high confidence in malicious intent.

  - **Audit command history:** Check the user's command history located in `~/.bash_history` or similar for any suspicious commands related to the `wget` usage. Legitimate users should have contextually appropriate histories; multiple `wget` calls in quick succession may indicate automation or scripting behavior.

  - **Monitor for network activity:** Analyze network logs (e.g., suricata or other IDS logs) for outgoing connections that may correspond with the `wget` executions. Look for unusual external IP addresses or domain lookups that were contacted immediately after the download.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on compromised systems, as temporary directories are often misused by attackers for staging malicious payloads. The likelihood of this behavior being abused for malicious purposes is moderate, given its common use in both legitimate and illicit scenarios. However, due to its association with command-and-control techniques, it warrants further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of monitoring on the full user command history or alternative file download methods (e.g., `curl` or scripts). Additionally, legitimate applications may trigger this alert when performing updates or fetching necessary components. Companion detections, such as those for unusual outbound connections or known malware hashes, strengthen the coverage against files downloaded using `wget`.

