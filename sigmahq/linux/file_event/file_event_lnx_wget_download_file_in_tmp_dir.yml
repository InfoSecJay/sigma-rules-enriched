logsource:
  product: linux
  category: file_event
detection:
  selection:
    Image|endswith: '/wget'
    TargetFilename|startswith:
    - '/tmp/'
    - '/var/tmp/'
  condition: selection
falsepositives:
- Legitimate downloads of files in the tmp folder.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of `wget`, a command-line utility for downloading files, when it targets temporary directories such as `/tmp` or `/var/tmp`. The behavior is often associated with malicious activities, where threat actors leverage `wget` to download payloads or other malicious content for further exploitation or persistence on compromised systems. In particular, this tactic aligns with the behavior seen in the GobRAT malware, which uses such techniques to establish command and control (C2) persistence.

  The rule relates to MITRE ATT&CK Tactics, specifically targeting **Command and Control** (T1071 - Application Layer Protocol) as threat actors often download malicious tools or ransomware via legitimate software. Another relevant technique is **Data from Local System** (T1005), as patient attackers often collect resources through automated scripts that leverage `wget` to communicate with their C2 infrastructure.

  Primary data sources for this detection include file event logs on Linux systems that monitor the creation or modification of files, which will indicate whether `wget` is executed with unusual parameters or targeting suspicious paths.

  ### Investigation Steps
  - **Review File Event Logs**: Examine file event logs for occurrences of `wget` targeting `/tmp` or `/var/tmp`. Look for any unusual timestamps or patterns in file creation that could indicate unauthorized downloads.
  - **Analyze Command History**: Check the command history on the affected machine (e.g., via `.bash_history`) to identify the context in which `wget` was executed. Look for commands that download executables, compressed files, or scripts.
  - **Correlate with Network Traffic**: Investigate outbound network traffic to see if there are any connections to suspicious IP addresses or domains corresponding to the downloads initiated by `wget`.
  - **Inspect Process Tree**: Analyze the process tree to identify parent processes that initiated `wget`. This can help uncover whether it was run maliciously or if it was part of a larger attack vector.

  ### Prioritization
  The severity of this alert is medium as it suggests potential malicious activity that may lead to further compromise or lateral movement. Given the risk of unauthorized downloads, monitoring and investigating such occurrences are critical to preserving the integrity of the environment.

  ### Blind Spots and Assumptions
  This detection may not capture legitimate uses of `wget` for safe purposes, leading to possible false positives. The detection assumes that the environment has adequate logging enabled for file events. If this logging is not configured correctly, the detection may miss relevant events or context that would clarify the purpose of a `wget` execution. Additionally, if the attacker employs a different method for downloading files, such as utilizing a different tool, this rule would not trigger, potentially indicating a gap in detection coverage.

