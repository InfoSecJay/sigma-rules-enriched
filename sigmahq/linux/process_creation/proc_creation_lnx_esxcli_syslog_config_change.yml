title: ESXi Syslog Configuration Change Via ESXCLI
id: 38eb1dbb-011f-40b1-a126-cf03a0210563
status: test
description: Detects changes to the ESXi syslog configuration via "esxcli"
references:
- https://support.solarwinds.com/SuccessCenter/s/article/Configure-ESXi-Syslog-to-LEM?language=en_US
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
author: Cedric Maurugeon
date: 2023-09-04
tags:
- attack.execution
- attack.defense-impairment
- attack.t1685
- attack.t1690
- attack.t1059.012
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/esxcli'
    CommandLine|contains|all:
    - 'system'
    - 'syslog'
    - 'config'
    CommandLine|contains: ' set'
  condition: selection
falsepositives:
- Legitimate administrative activities
level: medium
note: |
  ### Technical Context

  This detection rule identifies changes made to the ESXi syslog configuration using the `esxcli` command line interface. Such changes may indicate an attacker attempting to manipulate logging settings to evade detection by reducing visibility over activities, thereby supporting their objectives of stealthy lateral movement or data exfiltration. The relevant MITRE ATT&CK techniques include **T1685 - Modify System Image** and **T1059.012 - Command and Scripting Interpreter: PowerShell**.

  Primary telemetry sources include process creation logs from the ESXi host, specifically looking for entries related to the execution of `esxcli`. The security impact of malicious activity can be significant, as it may indicate an adversary is attempting to disrupt logging mechanisms or hide their tracks. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative changes are common and could trigger this alert.

  ### Investigation Steps

  - **Check process creation logs:** Review logs for Security Event ID 4688 or Sysmon Event ID 1 on the ESXi host to confirm the execution of `esxcli` with key parameters, focusing on the command line for 'system', 'syslog', and 'config'.

  - **Verify recent administrative activities:** Cross-reference against authorized change logs or documentation to determine if the command was run as part of expected maintenance or administrative processes, particularly for users with elevated privileges.

  - **Inspect command output:** If possible, gather logs or outputs that clearly indicate the previous and current configuration of syslog settings to identify unauthorized changes; look for critical values that don't align with established policy.

  - **Identify legitimate syslog configurations:** Review existing syslog configurations using a known baseline. Any command that diverges from baseline settings may warrant further investigation.

  - **Assess user accounts executing changes:** Investigate the user accounts that executed these commands. Look for any accounts with unusual access patterns or accounts that should not have executed the command due to role restrictions.

  ### Prioritization

  This alert has medium severity because it affects critical ESXi infrastructure and may indicate an active attempt to disrupt logging for malicious purposes. While administrative activities may trigger this alert, the potential for abuse and the operational impact of undetected compromise necessitates prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded if an attacker uses administrative accounts to change settings in a manner congruent with legitimate activity, potentially bypassing alerting mechanisms. Required log sources include robust ESXi process creation and command execution telemetry, which must be reliably configured. Legitimate administrative activities, such as routine syslog configuration changes, may also trigger the alert. Companion detections for monitoring user activity or unauthorized command executions can enhance visibility and understanding of the situation.

