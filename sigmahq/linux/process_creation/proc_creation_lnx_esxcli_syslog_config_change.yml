detection:
  selection:
    Image|endswith: '/esxcli'
    CommandLine|contains|all:
    - 'system'
    - 'syslog'
    - 'config'
    CommandLine|contains: ' set'
  condition: selection
falsepositives:
- Legitimate administrative activities
level: medium
note: |
  ### Technical Context
  This detection rule monitors for unauthorized changes to the ESXi syslog configuration through the use of the `esxcli` command-line interface. Attackers aiming to evade detection may exploit these changes to redirect log outputs, thereby obfuscating their activities or ensuring that potentially malicious actions are not recorded in the standard logging mechanisms. Administrators routinely use `esxcli` for configuration management; however, unauthorized modifications could indicate malicious intent, particularly in environments where log integrity is critical for incident response.

  The threat scenario here aligns with tactics focused on **Defense Evasion** (Mitre ID: T1562) and **Execution** (Mitre ID: T1059). Techniques such as **Application Layer Protocol** (T1562.001) and **Command and Scripting Interpreter** (T1059.012) are particularly relevant. Understanding these techniques helps analysts connect the dots regarding changes in a critical server environment that could undermine security posture. Primary data sources that contain the necessary evidence include process creation logs, which document command executions alongside their arguments, providing insight into potentially nefarious configuration adjustments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for instances of the `esxcli` command that include the keywords 'system', 'syslog', and 'config' alongside the command 'set' to identify unauthorized configuration changes.
  - **Analyze Syslog Configuration Files**: Check the current syslog configuration against standard settings. Any deviation could indicate potential malicious activity.
  - **Correlate with User Activity**: Assess user account activity in conjunction with the syslog changes. Pay particular attention to accounts that typically do not perform configuration changes or to accounts used outside of their normal operating hours.
  - **Examine Network Activity to Syslog Servers**: Review logs from network devices (e.g., firewalls or proxies) that could reveal suspicious connections or unexpected outgoing traffic to syslog servers, which might indicate log manipulation or data exfiltration attempts.

  ### Prioritization
  This alert carries medium severity due to the potential for attackers to exploit syslog configuration changes to conceal illicit activities, thus impacting the integrity of the security logging framework in the enterprise. The likelihood of a successful exploitation in an environment where logs are segmented from network access remains plausible.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if logging mechanisms are misconfigured or not fully enabled, particularly regarding process creation events. An assumption of this detection logic is that the targeted ESXi hosts are properly monitored and that logs are reliably collected and stored. Any gap in logging or oversight of administrative activities may lead to false negatives. Furthermore, legitimate administrative tasks may trigger this rule, requiring analysts to differentiate between benign and malicious behavior effectively.

