detection:
  selection:
    Image|endswith: '/esxcli'
    CommandLine|contains|all:
    - 'system'
    - 'syslog'
    - 'config'
    CommandLine|contains: ' set'
  condition: selection
falsepositives:
- Legitimate administrative activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes to the ESXi syslog configuration via the "esxcli" command-line interface. The likely attacker objective is to alter logging settings in order to evade detection and conceal malicious activities within the environment. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (T1562) and Execution (T1059.012).

  The primary telemetry source is Linux process creation logs, specifically targeting CommandLine and Image attributes to identify the use of 'esxcli'. If malicious, this could severely impact system visibility by disrupting logging and monitoring capabilities. Importantly, this detection does NOT confirm unauthorized access or compromise on its own; it only signals that a configuration change has occurred.

  ### Investigation Steps

  - **Review command execution logs**: Search for CommandLine entries containing 'esxcli' with Event ID 131072 in `/var/log/secure` or related logs to identify command execution contexts, including user accounts and execution times. Note any unusual accounts or times that deviate from expected admin usage.

  - **Validate legitimate vs. malicious changes**: Compare current syslog settings with historical configurations. If changes coincide with scheduled maintenance or approved updates, they are likely benign. Malicious changes may show unfamiliar log destinations or formats.

  - **Inspect user account permissions**: Cross-reference the executing user account against authorized ESXi admin accounts in the `/etc/passwd` file. Any unrecognized accounts attempting to execute 'esxcli' could indicate potential compromise.

  - **Collect logging metadata**: For any configured log destinations, verify whether changes are being routed to traditional monitoring logs, ensuring files are created as expected. Look for notable changes in syslog destinations or rotation settings in `/etc/syslog.conf`.

  - **Determine asset criticality**: Assess the ESXi host role and its importance to the overall infrastructure. Changes on production hosts are more critical and warrant immediate attention compared to test environments.

  ### Prioritization

  This alert carries a medium severity as it indicates potential tampering with logging configurations that could facilitate further malicious actions. The likelihood of abuse is moderate due to the potential for weaponization in environments lacking sufficient monitoring. Changes made in production environments are particularly concerning.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques such as command obfuscation or using scripted automation to modify configurations. Ensuring that syslog is properly configured to log such changes is essential; missing or misconfigured log sources may result in gaps in coverage. Legitimate administrative activities that utilize 'esxcli' for system maintenance may trigger this alert, necessitating careful analysis. A related detection for monitoring suspicious user account logins to the VMware environment may complement this alert for comprehensive coverage.

