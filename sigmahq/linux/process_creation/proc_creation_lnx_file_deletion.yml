  ### Technical Context

  This rule detects file deletion actions performed using the commands `rm`, `shred`, or `unlink` on Linux systems. The likely objective of an attacker triggering this behavior is to remove artifacts that could reveal intrusion activity, thereby covering their tracks. This behavior falls under the MITRE ATT&CK tactic of **Defense Evasion** (T1070.004: Indicator Removal on Host).

  The primary telemetry sources include process creation logs, specifically focusing on commands executed by users within the Linux environment. The security impact of a detected deletion could be significant, indicating a proactive attempt to erase evidence of compromise, which may suggest a larger malicious activity. It is crucial to note that this detection does NOT confirm whether the deletion led to harmful consequences or if the activity is truly malicious; it merely indicates that a file deletion process has occurred.

  ### Investigation Steps

  - **Check process creation logs: **Review logs for **syslog or audit logs** (e.g., `/var/log/syslog` or `/var/log/audit/audit.log`) for **Event IDs related to process creation**, focusing on entries that show the execution of the detected commands. Malicious indicators include unusually timed executions or executions by non-administrative users.

  - **Verify command arguments:** Assess the specific arguments passed alongside the deletion commands. Legitimate administration usually involves specific paths or target files while suspicious activity may delete extensive file sets or critical logs.

  - **Identify user context:** Cross-reference the user account executing the command. Check if it aligns with typical administrative behaviors. Malicious activity is suspected if a non-privileged user account is found deleting files in sensitive directories (e.g., `/var/log/` or `/etc/`).

  - **Analyze subsequent command execution:** Investigate subsequent commands executed in proximity to the deletion commands using `history` or similar commands. Malicious activity may include a sequence that reads files, modifies configurations, or unusual software installations before or after file deletions.

  - **Examine file access and modification logs:** Correlate deletion events with **file access logs** (e.g., `inotify` logs) to confirm if the files were recently accessed or modified, indicating a potential data exfiltration attempt prior to deletion.

  ### Prioritization

  This alert should be treated with moderate severity due to its implications on data integrity and potential evidence destruction, especially on critical or sensitive systems. The likelihood of malicious abuse is high, as file deletion is a common step in an attack lifecycle to avoid detection. This kind of behavior is generally weaponized for data obfuscation during attacks.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative activities that involve file deletions. Reliable detection depends on properly configured logging and monitoring for process creation events. Additionally, benign activities may include routine maintenance tasks carried out by system administrators. Companion detections include monitoring for log access patterns or unauthorized access to sensitive directories, enhancing coverage of potentially malicious activities.

