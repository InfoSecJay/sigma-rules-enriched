note: |
  ### Technical Context

  This rule detects the execution of file deletion commands (`rm`, `shred`, `unlink`) on Linux systems, which adversaries often use to eliminate traces of their actions after a compromise. The likely objective of the attacker is to remove logs or sensitive files that could otherwise be used for forensic analysis or recovery efforts. This behavior aligns with the MITRE ATT&CK technique T1070.004 - File Deletion.

  The primary telemetry sources include process creation logs from Linux, specifically monitoring for the execution of the deletion commands. If malicious, this behavior could indicate attempts to cover tracks or destroy evidence of unauthorized activity. It is crucial to understand that while this detection highlights the utilization of specific file deletion commands, it does NOT confirm malicious intent on its own; it could also be indicative of legitimate administrative activities.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID (or similar logging equivalent) related to executed commands, focusing on `/rm`, `/shred`, `/unlink`. Look in `/var/log/syslog` or `/var/log/auth.log` for relevant entries indicating suspicious command executions.

  - **Correlate timing with other activities:** Match the timestamps of deletion commands to previous or concurrent suspicious events, such as unauthorized access attempts, privilege escalations, or unusual login patterns from the same or associated accounts.

  - **Identify the user executing the command:** Document the user associated with the file deletion commands, ensuring you differentiate between legitimate admin users and potentially compromised accounts. Use logged user IDs from the event logs.

  - **Examine file integrity logs:** Check for changes in file integrity monitoring systems or relevant audit logs to identify specific files deleted. For instance, `auditd` logs demonstrating `delete` events can provide context on what was removed.

  - **Establish baseline for legitimate activity:** Investigate historical usage patterns of deletion commands to distinguish benign from malicious activities. Legitimate administrative tasks often include `rm` commands for necessary system cleanups that should be regular and well-documented.

  - **Look for high-confidence malicious patterns:** Identify unusual patterns like the deletion of multiple files in a short time frame or commands executed from unexpected scripts or cron jobs. These could indicate potential abuse.

  ### Prioritization

  The severity of this alert is medium. While the impact can be significant if critical system files or logs are deleted, legitimate activities can also trigger this detection, such as scheduled maintenance tasks. The likelihood of malicious intent increases when combined with other suspicious behaviors or anomalous user activity.

  ### Blind Spots and Assumptions

  Detection may be limited if command execution logs are not enabled or if logs are rotated frequently without proper retention. Legitimate administrative activities, especially in dynamic server environments, can trigger this rule. A companion detection to consider is monitoring for unexpected user account creations or privilege changes that might precede the file deletion events, enhancing overall monitoring of potential malicious behavior.

