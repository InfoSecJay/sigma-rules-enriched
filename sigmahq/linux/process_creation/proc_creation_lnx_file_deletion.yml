  ---

  ### Technical Context

  This alert detects the execution of file deletion commands commonly used by adversaries, specifically `rm`, `shred`, and `unlink`. The likely objective is to erase evidence of malicious activity or compromised files from target systems, thus hindering forensic investigation. This behavior aligns with the MITRE ATT&CK tactic: Defense Evasion (TA0005), specifically the technique: Indicator Removal on Host (T1070.004).

  The primary telemetry source is Linux process creation logs, which capture command execution including details such as timestamps and user context. If this activity is malicious, it could indicate an attempted cover-up post-intrusion to delete traces of other actions taken within the environment. It is important to note that this detection alone does not confirm malicious intent, as these commands can also be used for legitimate purposes under administrative contexts.

  ---

  ### Investigation Steps

  - **Check command execution details:** Review process creation logs for Event IDs associated with command execution (e.g., system logs in `/var/log/syslog`). Look for commands such as `rm`, `shred`, or `unlink` executed by unexpected users or during unusual hours.

  - **Verify user context:** Identify the user executing the commands. A legitimate administrator would typically have a consistent pattern of command usage in line with their duties. Investigate if a non-admin or unexpected user is associated with the command execution.

  - **Assess file deletion impact:** Investigate the directory and files targeted by the deletion commands. Check for critical files (system binaries, logs, etc.) that would typically not be deleted during regular administrative tasks.

  - **Monitor file system activity:** Utilize inodes and file change logs to identify any deleted files and timestamps of deletions. This can help link suspicious deletions with other potential indicators of compromise.

  - **Cross-verify with system audits:** Look into audit logs (if enabled) for actions leading up to file deletions. Assess if there were prior suspicious activities such as unauthorized access attempts or privilege escalations.

  ---

  ### Prioritization

  Given the potential impact on system integrity and the likelihood of malicious intent behind file deletions, this alert is of high concern, particularly on critical systems. It is important to investigate as evasive actions like file deletion are frequently exploited by attackers to erase their tracks, indicating potential ongoing compromise.

  ---

  ### Blind Spots and Assumptions

  This detection is susceptible to evasion if file deletion is performed through alternative means or by obfuscating command execution (e.g., using scripts or aliases). Reliable detection necessitates comprehensive logging configurations, including process creation and audit logs. Legitimate administrative tasks, such as regular system maintenance or cleanup operations, could trigger this alert. A related detection to consider is monitoring for unauthorized privilege escalations (e.g., via `sudo` or `su` commands) which could precede file deletions.

