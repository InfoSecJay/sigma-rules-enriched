note: |
  ### Technical Context
  This detection rule identifies potentially malicious file deletion activities on Linux systems, specifically targeting command executions such as `rm`, `shred`, or `unlink`. These commands are commonly utilized by attackers to eliminate traces of their activities, thereby evading detection. In a typical adversarial scenario, an intruder may gain unauthorized access to a system and, as part of their clean-up process, use these commands to remove log files, artifacts, or any compromised data to impede incident response efforts.

  This detection aligns with the MITRE ATT&CK framework, specifically with the tactic of **Defense Evasion** (TA0005) and technique **T1070.004: File Deletion**. The primary data sources for this detection are **process creation logs** from Linux systems, which capture command executions along with their parameters, assisting analysts in identifying unauthorized or suspicious command usage.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect logs that document the execution of `rm`, `shred`, and `unlink` commands. Pay attention to the user accounts executing these commands, as unauthorized accounts may signal malicious activity.
  - **Analyze Command Arguments:** Look at the arguments passed to the file deletion commands. Deletion of sensitive files or high volumes of files in rapid succession could indicate an ongoing attack or data exfiltration effort.
  - **Assess User Activity Context:** Cross-reference the command executions with user activity logs to determine if the commands were executed by legitimate users during typical operational hours or by unauthorized users during anomalous times.
  - **Check for Related Artifacts:** Look for other artifacts or behaviors indicative of adversary actions, such as unauthorized access attempts, lateral movement, or privilege escalation, to contextualize the file deletion activity.

  ### Prioritization
  This alert is classified as informational due to the potential for legitimate administrative activities that could trigger the same detection. However, its relevance increases in enterprise environments where unauthorized deletions can signify malicious intent and pose significant risks to data integrity and security.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios where file deletion is executed through composite scripts or automation tools, which may not trigger process creation logs as expected. The detection logic assumes that log collection and monitoring mechanisms are adequately configured on Linux systems to capture process creation events. Any absence of these logs or misconfigurations could hinder the effectiveness of this alert.

