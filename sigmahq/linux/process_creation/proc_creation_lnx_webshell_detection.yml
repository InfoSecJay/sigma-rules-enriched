logsource:
  product: linux
  category: process_creation
detection:
  selection_general:
    ParentImage|endswith:
    - '/httpd'
    - '/lighttpd'
    - '/nginx'
    - '/apache2'
    - '/node'
    - '/caddy'
  selection_tomcat:
    ParentCommandLine|contains|all:
    - '/bin/java'
    - 'tomcat'
  selection_websphere:    # ? just guessing
    ParentCommandLine|contains|all:
    - '/bin/java'
    - 'websphere'
  sub_processes:
    Image|endswith:
    - '/whoami'
    - '/ifconfig'
    - '/ip'
    - '/bin/uname'
    - '/bin/cat'
    - '/bin/crontab'
    - '/hostname'
    - '/iptables'
    - '/netstat'
    - '/pwd'
    - '/route'
  condition: 1 of selection_* and sub_processes
falsepositives:
- Web applications that invoke Linux command line tools
level: high
note: |
  ### Technical Context

  This rule detects the execution of suspicious subprocesses initiated by web server processes, such as Apache or NGINX. The likely attacker objective is to execute commands that could compromise the server, gather information, or establish persistence through a web shell. The relevant MITRE ATT&CK technique is "Web Shell" (T1505.003), which falls under the "Persistence" tactic. Logs from Linux process creation, specifically `audit` logs, will provide evidence of this behavior through event types related to process initiation. If malicious, this activity can lead to data exfiltration, server takeover, or further lateral movement within the environment. However, this detection does NOT confirm whether the detected process usage is inherently malicious, as legitimate applications may also invoke these commands.

  ### Investigation Steps

  - **Review process lineage**: Check the parent process of detected subprocesses in `audit` logs (Event ID 2260 for RHEL) to confirm it originated from a legitimate web server (e.g., Apache, NGINX). Benign usage would typically originate from automated scripts or scheduled jobs without associated suspicious subprocess calls.

  - **Examine command outputs**: Analyze logs for command invocations from the subprocesses detected. Suspicious invocations of commands like `/bin/cat`, `/whoami`, or `/netstat` may indicate probing or investigation activity by an attacker.

  - **Identify anomalies in process creation**: Look for unusual command patterns or execution times in process creation events that do not align with normal operational behavior. Legitimate user behavior might include infrequent, low-volume command usage; high-volume command calls could suggest adversarial actions.

  - **Cross-reference user activity**: Identify the user account that initiated the web server process using logs from `/var/log/auth.log` or `/var/log/secure`. Validate whether the user has appropriate permissions and if their actions align with expected operational behavior.

  - **Correlate with known threat intelligence**: Check the detected subprocess commands against known indicators of compromise (IoCs) related to web shells or various attack signatures. A match may indicate a higher likelihood of compromise.

  - **Validate file creation and modification logs**: Review logs for any creation or alteration of files, such as web shell scripts, on the web server directory (commonly `/var/www/html/`). Look for unexpected changes in files or new file creation events, especially those with suspicious content or patterns.

  ### Prioritization

  The alert is considered high severity due to the potential for significant impact if a web server is compromised. The likelihood of malicious behavior is high, as commands found in the alert are commonly weaponized by attackers leveraging web shells for persistence or reconnaissance.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers employing obfuscation techniques to disguise legitimate command invocations or by using less common subprocesses. Reliable detection requires comprehensive logging from process creation mechanisms. Legitimate web applications that invoke native Linux commands may generate false positives, necessitating on-the-fly analysis. Companion detections include monitoring for unusual file modifications within web directories to enhance coverage against potential web shell activity.

