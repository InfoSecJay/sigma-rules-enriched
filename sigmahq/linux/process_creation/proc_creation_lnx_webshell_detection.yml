logsource:
  product: linux
  category: process_creation
detection:
  selection_general:
    ParentImage|endswith:
    - '/httpd'
    - '/lighttpd'
    - '/nginx'
    - '/apache2'
    - '/node'
    - '/caddy'
  selection_tomcat:
    ParentCommandLine|contains|all:
    - '/bin/java'
    - 'tomcat'
  selection_websphere:    # ? just guessing
    ParentCommandLine|contains|all:
    - '/bin/java'
    - 'websphere'
  sub_processes:
    Image|endswith:
    - '/whoami'
    - '/ifconfig'
    - '/ip'
    - '/bin/uname'
    - '/bin/cat'
    - '/bin/crontab'
    - '/hostname'
    - '/iptables'
    - '/netstat'
    - '/pwd'
    - '/route'
  condition: 1 of selection_* and sub_processes
falsepositives:
- Web applications that invoke Linux command line tools
level: high
note: |
  ### Technical Context
  This detection rule identifies potential webshell activity on Linux systems by monitoring for suspicious subprocesses initiated by web server processes such as Apache, Nginx, or Node.js. Attackers often rely on webshells to gain unauthorized access to a server, allowing them to execute commands, exfiltrate data, or maintain persistence within the environment. This rule aims to flag commonly used commands that might be executed by webshells, helping security teams intercept malicious execution before further exploitation can occur.

  The likely attacker objective in this scenario is to interact with the server's filesystem or network through potentially unauthorized means, leveraging the web server as a means to execute arbitrary commands. The relevant MITRE ATT&CK tactics here include **Persistence** (TA0003) and **Command and Control** (TA0011), with techniques like **Web Shell** (T1505.003). The primary data source for this detection is process creation events, specifically focusing on the command items tied to web server processes and their subprocesses.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine detailed process creation logs on the Linux server for instances matching the parent images of web servers (e.g., httpd, nginx) followed by suspicious subprocess execution.
  - **Analyze Parent Command Lines:** For flagged processes, investigate the complete command line arguments to confirm the context and to identify any suspicious patterns or parameters that may indicate a compromise.
  - **Correlate with Known Indicators:** Compare the identified processes and command strings against a list of known malicious tools or techniques commonly associated with web shells to assess the legitimacy of the operations.
  - **Assess Network Connections:** Investigate any abnormal outbound network connections made by these suspicious subprocesses, focusing on unexpected protocols, remote hosts, or unusual data exfiltration patterns.

  ### Prioritization
  Given the high likelihood of significant impact from webshell activity, including potential data breaches and system compromise, this alert should be considered high-priority in any enterprise environment. The use of webshells is a clear indicator of exploitation, warranting immediate investigation and response.

  ### Blind Spots and Assumptions
  This detection rule may not fully cover all webshell behaviors, particularly if custom or less common command-line utilities are utilized by the attacker, resulting in potential evasion. The detection logic assumes a typical server configuration where subprocesses are executed directly through the monitored parent processes. For effective coverage, it is essential to ensure that detailed process creation logs are enabled and aggregated, especially in environments where non-standard web server configurations might exist.

