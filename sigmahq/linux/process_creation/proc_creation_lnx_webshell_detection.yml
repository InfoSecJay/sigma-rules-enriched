title: Linux Webshell Indicators
id: 818f7b24-0fba-4c49-a073-8b755573b9c7
status: test
description: Detects suspicious sub processes of web server processes
references:
- https://www.acunetix.com/blog/articles/web-shells-101-using-php-introduction-web-shells-part-2/
- https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron 
  Systems)
date: 2021-10-15
modified: 2026-08-19
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_parent_general:
    ParentImage|endswith:
    - '/httpd'
    - '/lighttpd'
    - '/nginx'
    - '/apache2'
    - '/node'
    - '/caddy'
  selection_parent_tomcat:
    ParentCommandLine|contains|all:
    - '/bin/java'
    - 'tomcat'
  selection_parent_websphere:    # ? just guessing
    ParentCommandLine|contains|all:
    - '/bin/java'
    - 'websphere'
  selection_child_processes:
    Image|endswith:
    - '/whoami'
    - '/ifconfig'
    - '/ip'
    - '/bin/uname'
    - '/bin/cat'
    - '/bin/crontab'
    - '/hostname'
    - '/iptables'
    - '/netstat'
    - '/pwd'
    - '/route'
  filter_optional_ip_neigh:
    ParentImage|endswith: '/node'
    CommandLine|contains: 'ip neigh show'
  condition: 1 of selection_parent_* and selection_child_processes and not 1 of 
    filter_optional_*
falsepositives:
- Web applications that invoke Linux command line tools
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious subprocesses spawned by web server processes, typically indicating potential unauthorized access via web shells. The likely objective of an attacker triggering this alert is to maintain persistence, gather system information, or conduct further reconnaissance within a compromised environment. Relevant MITRE ATT&CK tactics and techniques include Persistence (T1505.003) and Command and Control methods.

  The primary telemetry sources involved are Linux process creation logs, specifically monitoring parent-child process relationships. Key log types include Common Security Event Logging System (CSELS) for process creation events and kernel logs for process execution tracking. If malicious, this behavior could lead to unauthorized data access, system manipulation, or exploitation for broader network intrusions. This detection does NOT confirm that the subprocess originates from a malicious source without further investigation.

  ### Investigation Steps

  - **Identify suspicious subprocesses:** Review logs for event data where a web server process (e.g., `/httpd`, `/nginx`, `/apache2`) is a parent process with a child process that includes commands like `/bin/cat`, `/ip`, or `/whoami`. Validate the log fields such as `ParentImage` and `Image`.

  - **Check command usage:** Analyze the CommandLine field of detected processes. For example, processes initiated by the web server that include commands such as `ip neigh show` are less suspicious than those running `/bin/uname` or `/bin/cat`. Use system logs to establish context and intent.

  - **Review web application behavior:** Confirm expected application behavior by checking the application’s configuration for legitimate uses of command line tools. This includes scripts that may legitimately invoke processes during routine operations but do not invoke the listed suspicious subprocesses.

  - **Cross-reference process ownership:** Validate the user context under which the subprocesses are run. Legitimate web server processes should typically execute under specific users (e.g., `www-data`). Unknown or unexpected users may indicate malicious activity.

  - **Correlate with external threat intelligence:** Check known indicators related to web shell attacks within external databases or threat intelligence platforms. For high-confidence malicious indicators, cross-reference command strings and parent processes with threat intelligence reports.

  ### Prioritization

  This alert severity is high due to the critical role that web servers play in enterprise environments; a compromised web server can act as a gateway for further attacks. The likelihood of malicious abuse is significant as web shells are commonly weaponized in modern cyber threats. Recognizing this behavior is crucial for preventing potential data breaches or ransomware incidents.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use legitimate commands or obscure their actions through encoding or non-standard paths. Reliable detection requires comprehensive logging configurations, including enabling process execution tracking across all critical systems. Legitimate activities, such as automated scripts using web servers for backend processing, may inadvertently trigger this alert. A related detection rule that could strengthen coverage would involve monitoring for unauthorized changes to web server configuration files or unusual access patterns from anomalous user agents.

