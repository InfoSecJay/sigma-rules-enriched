note: |
  ### Technical Context

  This Sigma rule detects the execution of the Perl interpreter with specific command-line arguments that are commonly used in reverse shell attacks. The likely objective of an attacker executing such a command is to create a reverse shell that connects back to a remote server, allowing them unauthorized access to the compromised system. This behavior aligns with the MITRE ATT&CK tactic `Execution` and the technique `Command and Scripting Interpreter` (T1059).

  Primary telemetry sources include Linux process creation logs, specifically examining the `/proc` filesystem for process execution details surrounding the Perl binary. If successful, this behavior can result in unauthorized command execution, potential data exfiltration, or system compromise. It's important to note that this detection does not confirm malicious intent on its own, as legitimate scripts might inadvertently fall within the same command-line patterns.

  ### Investigation Steps

  - **Review process execution logs**: Check process creation logs (such as `/var/log/syslog` or auditing logs) for Event ID 1 on the presence of the Perl binary (`/usr/bin/perl` or similar) with command-line flags containing `-e`.

  - **Examine command-line arguments**: Focus on parsing the command line for indicators such as `fdopen(`, `::Socket::INET`, `Socket`, `connect`, `open`, or `exec`. The presence of these combined terms indicates high confidence of malicious activity.

  - **Identify normal Perl usage**: Compare against known benign Perl activities, such as scheduled scripts or administrative tasks normally using `perl`, which typically do not utilize the `-e` flag for direct execution.

  - **Check network activity**: Monitor outbound connections from the executing process. Inspect logs (e.g., `/var/log/iptables.log`) for suspicious network traffic or unusual connections to unknown IP addresses or domains.

  - **Assess system role and criticality**: Investigate host role; a reverse shell execution on a critical server (e.g., a database or application server) carries higher risk and warrants immediate escalation compared to non-critical systems.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential for system compromise. The use of reverse shells is a well-known method among adversaries for maintaining persistence and remote control of systems. Given the nature of this detection, especially if it appears on critical assets, it may indicate an active attack scenario.

  ### Blind Spots and Assumptions

  Detection may be limited if the Perl binary is renamed or if attacker methods change to use other scripting languages (e.g., Python, Bash). Ensure logging configurations are comprehensive to include command-line arguments. Legitimate usage may include administrative scripts that execute commands via Perl, which should be documented. Companion detection might include monitoring for unusual outbound connections that align with reverse shell behaviors, increasing overall detection fidelity.

