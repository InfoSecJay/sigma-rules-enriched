title: Potential Perl Reverse Shell Execution
id: 259df6bc-003f-4306-9f54-4ff1a08fa38e
status: test
description: Detects execution of the perl binary with the "-e" flag and common strings
  related to potential reverse shell activity
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: '@d4ns4n_, Nasreddine Bencherchali (Nextron Systems)'
date: 2023-04-07
tags:
- attack.execution
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/perl'
    CommandLine|contains: ' -e '
  selection_content:
  - CommandLine|contains|all:
    - 'fdopen('
    - '::Socket::INET'
  - CommandLine|contains|all:
    - 'Socket'
    - 'connect'
    - 'open'
    - 'exec'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies potential reverse shell activity on Linux systems through the execution of the Perl interpreter. Attackers often use scripting languages like Perl to establish remote shells, providing them interactive access to compromised systems. The execution of the Perl binary with the `-e` flag suggests that the attacker is running Perl commands directly from the command line, a common tactic used to obfuscate malicious actions.

  The primary MITRE ATT&CK tactics and techniques relevant to this detection include **Execution (T1203)**, since it focuses on how code is executed on the system, and **Command and Control (T1219)**, as establishing a reverse shell is a means for attackers to maintain control over the compromised asset. Key data sources for this detection include process creation logs from the operating system, which record details about executed processes and associated command lines.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs to identify any instances of the Perl interpreter being executed with suspicious command-line arguments, specifically looking for the `-e` flag.
  - **Analyze Command-Line Arguments**: Look for execution patterns that include common reverse shell features, such as commands calling `Socket`, `connect`, `exec`, or file descriptors being opened with `fdopen(`.
  - **Identify Anomalous User Accounts**: Check which user accounts executed the Perl command and assess whether they have a legitimate reason to run such commands. Look for unusual accounts or accounts operating outside of regular business hours.
  - **Correlate with Network Traffic**: If possible, analyze outbound network connections during the time frame of the execution to identify any connections to suspicious external IP addresses or domains, which could indicate data exfiltration or additional reverse shell connections being established.

  ### Prioritization
  This alert is classified as high severity due to the potential for extensive impact if a reverse shell is successfully established, allowing attackers full access to sensitive systems and data. The likelihood of detection is increased given that reverse shells are a common tactic employed by adversaries during intrusion attempts.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is related to the execution of reverse shells using other interpreted languages, such as Python or Bash, which this rule does not capture. The detection logic assumes that the presence of identifiable patterns in command-line arguments will consistently signal malicious intent; variations in encoding or evasion tactics could potentially bypass detection. Additionally, this rule relies on accurate logging of process creation events—if these logs are not retained or properly configured, the detection may fail to trigger.

