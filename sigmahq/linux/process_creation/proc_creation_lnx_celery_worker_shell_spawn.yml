falsepositives:
- Legacy or custom administrative tasks deliberately hardcoded with shell=True 
  or os.system execution inside Celery task functions.
- Media processing, deployment, or reporting pipelines that intentionally shell 
  out to external tools (e.g. ffmpeg, git) from within a task.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the spawning of a system shell (e.g., bash, sh) by a Celery worker process, indicating potential exploitation of command or prompt injection vulnerabilities within Python-based applications leveraging large language models (LLMs). The likely attacker objective is to execute arbitrary commands on the host system, giving attackers the ability to manipulate, exfiltrate, or damage data. This behavior aligns with the MITRE ATT&CK technique T1059.004 (Command and Scripting Interpreter: Unix Shell).

  Primary telemetry sources include Linux process creation logs where instances of shell interpreters initiated by Celery processes are recorded. The security impact, if malicious, could range from unauthorized access to significant data breach ramifications. Importantly, this detection does NOT confirm a successful compromise on its own; further investigation is necessary to correlate with other indicators.

  ### Investigation Steps

  - **Identify the process chain:** Review process creation logs for Security Event ID execve and correlate the parent process with Celery. Look specifically for logs with `ParentCommandLine` containing 'celery' and `Image` ending with common shell interpreters (bash, sh, etc.).

  - **Check for command injection indicators:** Analyze the Celery task code or configurations for known vulnerable patterns, particularly those using `shell=True` or `os.system`. Look for `task` metadata indicating unsanitized user input passed to shell execution functions (e.g., `ffmpeg`, `git` commands).

  - **Examine legitimate usage cases:** Validate instances where Celery tasks legitimately require shell access, such as media processing or deployment tasks. Ensure these tasks are part of expected workflows and well-documented in change management records.

  - **Confirm malicious indicators:** Monitor for additional logs that suggest further command execution beyond the initial shell spawn, such as lateral movement or connections initiated from the spawned shell. Examine network logs for outbound connections to suspicious or unknown IP addresses.

  - **Evaluate affected host role:** Determine the criticality of the host running the Celery worker. If the host is responsible for handling sensitive data or critical functions, escalate the alert priority and involve incident response teams.

  ### Prioritization

  This alert should be considered medium severity due to its association with known exploitation techniques and the potential for significant impact if a critical system is compromised. The likelihood of abuse is heightened given recent trends in exploiting LLMs for command injections. Given the specialized nature of Celery in enterprise environments, this behavior is less common but can have serious implications.

  ### Blind Spots and Assumptions

  Detection is limited by evasion techniques such as obfuscation of malicious input or use of non-standard shells. Ensuring comprehensive logging configurations are necessary for reliable detection; specifically, configurations should include process creation and system audit logs. Legitimate administrative tasks and automated CI/CD pipelines may trigger this alert, warranting a careful review of context. A related detection to strengthen coverage could focus on monitoring unusual command executions from worker processes outside of expected usage patterns.

