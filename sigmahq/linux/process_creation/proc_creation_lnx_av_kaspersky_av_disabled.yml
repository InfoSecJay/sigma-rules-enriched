title: Kaspersky Endpoint Security Stopped Via CommandLine - Linux
id: 36388120-b3f1-4ce9-b50b-280d9a7f4c04
status: experimental
description: |
  Detects execution of the Kaspersky init.d stop script on Linux systems either directly or via systemctl.
  This activity may indicate a manual interruption of the antivirus service by an administrator, or it could be a sign of potential tampering or evasion attempts by malicious actors.
references:
- https://support.kaspersky.com/KES4Linux/12.0.0/en-US/197929.htm
author: Milad Cheraghi
date: 2025-10-18
tags:
- attack.execution
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
            # Note: Add the list of shells allowed in your environment that can be used to run init.d scripts.
    - '/systemctl'
    - '/bash'
    - '/sh'
    CommandLine|contains|all:
    - 'stop'
    - 'kesl'
  condition: selection
falsepositives:
- System administrator manually stopping Kaspersky services
level: high
note: |
  ### Technical Context
  This detection rule identifies when the Kaspersky Endpoint Security (KES) service is stopped on Linux systems, either through direct execution of the service's initialization script or via the `systemctl` command. The stopping of an antivirus service could indicate a legitimate administrative action for maintenance purposes, but it may also suggest malicious activity seeking to evade detection or disrupt endpoint protection mechanisms. Attackers may attempt to disable security solutions like Kaspersky to facilitate malicious actions such as unauthorized data access or system compromise.

  The rule aligns with the MITRE ATT&CK framework, specifically under the tactic of *Execution* (TA0002) and *Defense Evasion* (TA0005). It utilizes the technique T1562.001, which pertains to the *Disable or Modify Tools* category, indicating efforts to impair the functionality of security solutions to avoid detection.

  The primary data sources for this detection include process creation events that capture command lines executed by users and applications, specifically targeting commands related to stopping the Kaspersky service.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for entries that indicate the `stop` command being executed for Kaspersky (e.g., containing "kesl") along with the process names `/systemctl` or `/bash`. Look for any unexpected times or users executing these commands.

  - **Analyze System Logs**: Check system logs (such as `/var/log/syslog` or `/var/log/messages`) for any related entries indicating unauthorized stopping of Kaspersky services. This can provide context on whether this action was preceded or followed by other suspicious activities.

  - **Investigate User Activity**: Look into the user account that executed the stop command. Assess if it was an administrative account or an unexpected user account that could signal potential insider threat activity or misuse of admin privileges.

  - **Check for Service Restarts**: Determine whether the Kaspersky service was restarted shortly after the stop command was executed. An immediate restart by a non-admin could suggest evasive maneuvers by an attacker, whereas a legitimate restart would typically be expected from an admin.

  ### Prioritization
  The severity of this alert is high due to the critical role antivirus solutions like Kaspersky play in safeguarding systems from malware and attacks. Unauthorized interruption of these services significantly heightens the risk of infections and data breaches within the enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may miss scenarios where attackers compromise the system and use alternative methods to disable Kaspersky without the stop command being executed, such as modifying system configurations. The detection is also predicated on the assumption that all command line executions are properly logged and captured, which may not occur if logging is misconfigured or limited. For optimal detection efficacy, ensure that process creation logging is enabled across all Linux endpoints and that it captures detailed command line arguments.

