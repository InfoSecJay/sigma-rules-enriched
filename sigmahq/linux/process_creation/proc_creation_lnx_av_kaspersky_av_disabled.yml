note: |
  ---

  ### Technical Context

  This rule detects the interruption of the Kaspersky Endpoint Security service on Linux systems through the execution of the stop script via command line, particularly using `/systemctl` or shell commands. The likely objective of the attacker could be to disable antivirus protections to facilitate subsequent stages of an attack, such as malware installation or data exfiltration. This activity aligns with the MITRE ATT&CK technique for "Service Stop" (T1562.001) under the defensive evasion tactic.

  Primary telemetry sources include Linux process creation logs, specifically monitoring Event IDs for the stopping of services through system management commands. If malicious, this could allow a threat actor to evade detection, thus facilitating further exploitations or breaches. Notably, this detection does NOT confirm malicious intent on its own as legitimate system administrators may also stop services during maintenance tasks.

  ---

  ### Investigation Steps

  - **Check process execution details:** Review process creation events, particularly focusing on Event ID  execve, and filter for any instance of Kaspersky being stopped with command lines containing "stop" and "kesl." Compare timestamps to understand if it correlates with other suspicious activities.

  - **Validate legitimate activities:** Look for typical commands from system administrators, such as stopping Kaspersky for scheduled maintenance or updates. In these cases, the command line will often include specific flags or corresponding log entries indicating administrative actions at expected hours.

  - **Identify high-confidence indicators:** Note any unexpected patterns in the command execution, such as execution from non-standard users or during odd hours. Check the user ID that executed the command; commands run by non-administrative users can indicate possible malicious activity.

  - **Check for alarm-based responses:** If the Kaspersky service stop was not authorized, cross-reference with security alert logs from the antivirus solution, documenting any alerts or block decisions made at the time of the command execution.

  - **Correlate system and installation integrity:** Review package management logs (such as `/var/log/dpkg.log`) and check for any recent installations or removals of any relevant security software, which may indicate evasion techniques taken by adversaries.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on endpoint security functions. The likelihood of malicious abuse is significant, especially in environments with strict security requirements where antivirus services play a critical role in preventing attacks. Given that service stops can easily be weaponized, prompt investigation is crucial.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscated commands or the use of alternative methods to stop services, such as using scripting languages. Reliable detection requires proper logging configurations for process creation and command-driven activities. Legitimate administrative tasks, such as routine maintenance or updates, might also trigger this alert. Companion detections, such as monitoring for abnormal outbound connections shortly after service interruption, can enhance coverage and mitigate false positives.

