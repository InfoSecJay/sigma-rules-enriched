title: Kaspersky Endpoint Security Stopped Via CommandLine - Linux
id: 36388120-b3f1-4ce9-b50b-280d9a7f4c04
status: experimental
description: |
  Detects execution of the Kaspersky init.d stop script on Linux systems either directly or via systemctl.
  This activity may indicate a manual interruption of the antivirus service by an administrator, or it could be a sign of potential tampering or evasion attempts by malicious actors.
references:
- https://support.kaspersky.com/KES4Linux/12.0.0/en-US/197929.htm
author: Milad Cheraghi
date: 2025-10-18
tags:
- attack.execution
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
            # Note: Add the list of shells allowed in your environment that can be used to run init.d scripts.
    - '/systemctl'
    - '/bash'
    - '/sh'
    CommandLine|contains|all:
    - 'stop'
    - 'kesl'
  condition: selection
falsepositives:
- System administrator manually stopping Kaspersky services
level: high
note: |
  ### Technical Context

  This rule detects the execution of the Kaspersky Endpoint Security (KES) service stop script on Linux systems, either directly through the command line or via systemctl. The likely attacker objective is to disable the antivirus service, which can facilitate malicious activities such as malware deployment or persistence without being detected. This behavior aligns with the MITRE ATT&CK technique T1562.001 (Impair Defenses: Disable or Tamper with Security Software).

  The primary telemetry sources include process creation logs from the Linux OS, specifically focusing on the command line used to invoke the service stop command related to KES. If malicious, the impact could be significant, as it directly reduces the security posture of the affected system. This detection does NOT confirm malicious intent on its own, as there are legitimate scenarios where an administrator may stop the antivirus service.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event logs related to process creation on Linux systems (e.g., `auditd` logs or `syslog` for `execve` events). Filter for invocations of `/systemctl` or `/bash` with `stop` and `kesl` in the command line.

  - **Identify the user initiating the command:** Analyze the user context under which the KES service stop command was executed. Validate if it was an unexpected user or a system admin logged in during that time.

  - **Examine timestamps and repetitions:** Check for multiple instances of the command execution logged within a short timeframe. Frequent stops might indicate an ongoing attack or malware trying to disable defenses.

  - **Correlate with baseline legitimate activity:** Verify historical logs from KES in your environment to establish a baseline for normal operations. It's common for system administrators to stop KES for maintenance or troubleshooting; confirm if such events align with administrative workflows.

  - **Evaluate related OS telemetry for file changes:** Investigate any changes in the `Kaspersky` installation directory or service status immediately after the stop command execution (e.g., `systemctl status kesl` or monitoring `/var/log/kaspersky/`).

  ### Prioritization

  This alert is of high severity because it involves a critical security application being disabled. The likelihood of malicious abuse is high, as disabling antivirus software is a common tactic for attackers during intrusions. Furthermore, this behavior is explicitly weaponized in various attack scenarios that involve compromise and persistence.

  ### Blind Spots and Assumptions

  This detection may have limitations if the adversary employs local privilege escalation to stop the KES service without leaving a clear trace. Required logging configurations must include detailed process creation events and command execution logs from endpoints. It's important to note that legitimate maintenance activities by administrators may trigger this alert, thus requiring careful contextual analysis. A related detection to consider is monitoring for service start attempts following a stop command (T1562.001), ensuring that any subsequent behavior aligns with legitimate administrative work.

