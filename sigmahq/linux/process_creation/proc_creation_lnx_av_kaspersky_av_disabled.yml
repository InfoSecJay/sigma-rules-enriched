level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Kaspersky endpoint security stop script on Linux systems, either directly or via the `systemctl` command. This behavior suggests either an administrative action to stop the antivirus service or a potential malicious attempt to disable security measures. The relevant MITRE ATT&CK tactic is "Defense Evasion" (T1562), with the technique specifically being "Impair Defenses" (T1685).

  The primary telemetry sources include Linux process creation logs and command line activity. If malicious, this could allow an adversary to disable endpoint detection and response capabilities, significantly increasing the risk to the system. It's important to note that this detection does not confirm malicious intent by itself; legitimate administrators may stop Kaspersky for valid reasons.

  ### Investigation Steps

  - **Review process execution logs**: Check Linux process logs (e.g., `/var/log/auth.log`, syslog) for entries related to `systemctl` or `bash`. Look for Event IDs or timestamps correlating with the alert to determine the user responsible and the context of the execution.

  - **Analyze command line parameters**: Identify the command line associated with the process execution; ensure it includes 'stop' and 'kesl'. Verify if this correlates with legitimate maintenance practices or unusual timings suggesting malicious intent.

  - **Identify related user activity**: Examine login activities around the alert time, focusing on privileged users (e.g., those with sudo access). Check for any irregularities or patterns of behavior that deviate from typical administrative tasks.

  - **Compare with expected behavior**: Confirm whether any recent legitimate maintenance operations were scheduled that may involve stopping the Kaspersky service, such as software updates or system reconfigurations. Note the typical timeframes and reasons for service interruptions.

  - **Check system logs for anomalies**: Review logs for any additional suspicious activities, such as unauthorized access attempts or changes in user permissions around the same time the antivirus was stopped. High-confidence indicators could include multiple failed login attempts or access from unusual IP addresses.

  - **Verify antivirus service status logs**: Confirm if Kaspersky service was resumed after stopping. If logs indicate that the service was not restarted within an expected timeframe for legitimate use, this may warrant further investigation.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on endpoint security and the likelihood of it being abused by adversaries. The ability to disable a critical security application is a common tactic for attackers intending to execute further exploitative actions undetected.

  ### Blind Spots and Assumptions

  A limitation of this detection is that it may be bypassed by adversaries using alternate methods to disable the antivirus service, such as manipulating system files directly. Consistent logging from the relevant sources (process creation, authentication, and service management logs) is necessary for reliable detection. Legitimate administrative tasks, such as scheduled maintenance or updates, may falsely trigger alerts. A companion detection to combine with this rule could involve monitoring for anomalous user behavior or privilege escalation attempts around the time of the service stoppage.

