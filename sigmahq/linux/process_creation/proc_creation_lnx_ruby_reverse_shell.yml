  ---

  ### Technical Context

  This Sigma rule detects the execution of Ruby scripts using the `-e` flag combined with socket-related functions such as `TCPSocket` and `rsocket`. This behavior strongly correlates with an adversary's objective to establish a reverse shell, enabling remote command execution and potential access to sensitive systems. This detection aligns with the MITRE ATT&CK technique "Command and Control" (T1071), particularly under the subgroup for "Application Layer Protocol" (T1071.001).

  Primary telemetry sources include Linux process creation logs, specifically focusing on command line arguments associated with the Ruby interpreter (e.g., `/usr/bin/ruby`, etc.). If malicious in nature, this activity could lead to unauthorized remote access, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that a successful reverse shell has been established, only that an attempt may have been made.

  ---

  ### Investigation Steps

  - **Check process creation logs**: Review the Linux process creation logs (e.g., `/var/log/auth.log` or `syslog`) for Event ID or activity showing the execution of Ruby. Focus on command line arguments containing `-e`, `TCPSocket`, or `rsocket`.

  - **Analyze command line specifics**: Validate whether the complete command line executed includes typical shell commands like `sh`, `bash`, or other shells followed by the Ruby execution, which might indicate a reverse shell setup rather than normal operation.

  - **Investigate the parent process**: Explore the parent process ID to understand the context in which this Ruby command was executed. Look for any suspicious parent processes indicative of lateral movement, such as known tools or scripts used in exploitation.

  - **Identify established network connections**: Use tools like `netstat` or `ss` to check for outbound connections on non-standard ports following the execution of the detected Ruby command. Look for connections to external addresses, indicating potential reverse shell capabilities.

  - **Baseline legitimate Ruby usage**: Review typical applications and scripts in your environment that legitimately use Ruby. Document their command line arguments to differentiate between expected and suspicious activity.

  - **Correlate with user activity logs**: Compare the timestamps of the Ruby execution with user login activity or any scheduled tasks that might indicate an authorized operation. Ensure that the user account associated with the process is recognized and has legitimate purposes to execute such scripts.

  ---

  ### Prioritization

  This alert is of medium severity as it may suggest an ongoing attack progression, notably in environments with critical systems. The likelihood of exploitation through a reverse shell is high, especially given Ruby's flexibility and prevalence in scripting. However, this behavior can also occur in legitimate contexts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging or configurations preventing the capture of all process executions. An attacker could evade detection by using alternate scripting methods or tools. Legitimate use cases, such as developers running scripts for automation, may trigger this alert. Related detections include monitoring for unusual outbound network connections or alerts on usage of command line interpreters, which further strengthen coverage against shell initiation attempts.

