note: |
  ### Technical Context

  This Sigma rule detects the execution of the Ruby programming language with the `-e` flag, which allows for direct execution of Ruby code from the command line. This behavior is often associated with the establishment of reverse shells, where an adversary executes commands that can lead to unauthorized remote access. The primary objective of this behavior is to create a communication channel back to an attacker-controlled server, facilitating unauthorized control over a compromised system. Relevant MITRE ATT&CK tactics include Execution (TA0002) and the technique for Command-Line Interface (T1059.006).

  The primary telemetry sources are Linux process creation logs, specifically looking for the command line arguments associated with `ruby`. If malicious, this behavior could indicate a serious security compromise, allowing remote code execution and data exfiltration. Importantly, this detection alone does not confirm that a reverse shell is established since legitimate Ruby scripts might use similar command patterns without malicious intent.

  ### Investigation Steps

  - **Check process creation logs:** Review Linux process creation logs (e.g., `/var/log/auth.log` or `proc` file system) for Event ID equivalent. Look for processes containing "ruby" with `-e` and socket-related commands.

  - **Examine command-line arguments:** Analyze the command line for any suspicious parameters (e.g., `rsocket`, `TCPSocket`). Take note of any unusual or obfuscated commands that may indicate attempts to hide malicious activity.

  - **Identify expected behavior:** Verify typical Ruby use in your environment, such as scheduled jobs or administrative scripts that use Ruby for automation. Compare against detected command structures.

  - **Look for connections to external IPs:** Inspect active network connections using tools like `netstat` or `ss` to identify any outbound socket connections originating from the Ruby process to untrusted IP addresses. Malicious connections will likely be to unusual or known bad IPs.

  - **Review related user behavior:** Check the user context under which the Ruby process was executed. Legitimate users may utilize Ruby commands for benign purposes, while unexpected users could indicate suspicious activity.

  - **Correlate with threat intelligence:** Use threat intelligence feeds to check if any command arguments or IP addresses associated with the process align with known threats or indicators of compromise (IOCs).

  ### Prioritization

  The alert severity is medium based on the potential impact of the affected system, which may be leveraged for lateral movement within the network. Given the inherently malicious nature of reverse shell setups, this behavior has a reasonable likelihood of being exploited. The behavior detected is weaponized in many attacks, making prompt investigation essential.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through obfuscation techniques or executing Ruby in less common ways that may not trigger this rule. Continuous log collection from relevant process and command execution logs is essential for reliable detection. Legitimate activities that may trigger the alert include authorized automation scripts or maintenance tasks utilizing Ruby. A related detection that could strengthen coverage is monitoring for suspicious outbound network connections to unexpected hosts, which may further validate the intent behind the Ruby execution.

