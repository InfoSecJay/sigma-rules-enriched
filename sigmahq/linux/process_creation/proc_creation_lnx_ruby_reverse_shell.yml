note: |
  ### Technical Context
  This detection rule identifies potential attempts to establish a reverse shell on a Linux system using the Ruby programming language. Specifically, it looks for the execution of Ruby with the `-e` flag, which allows inline execution of code, combined with calls to `socket` related functions such as `TCPSocket` or `rsocket`. Attackers may utilize reverse shells to maintain remote access to compromised systems, facilitating further exploitation or data exfiltration as part of a broader attack campaign.

  The likely attacker objectives include establishing persistence, exploiting sensitive data, or moving laterally within the network. They may leverage reverse shells to communicate with command and control (C2) servers, execute arbitrary commands, or escalate privileges. The relevant MITRE ATT&CK tactics and techniques for this rule are **Execution (T1203)**, which indicates a method of running unauthorized code, and **Command and Control (T1071)**, pertaining to the network communication between the compromised host and the attacker.

  Primary data sources that will provide the most relevant evidence include **process creation events** from Linux systems, which capture command executions and the associated parameters. These logs can help security teams discern malicious activity from benign scripting behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the process creation logs to identify instances where Ruby was executed with the `-e` flag accompanied by `TCPSocket` or `rsocket` in the command line. Pay special attention to the context in which this execution occurred.

  - **Analyze Network Connections:** Investigate active or recent network connections initiated by the Ruby processes. Look for outbound connections to unusual or suspicious IP addresses or domains that may indicate a reverse shell communication.

  - **Correlate with Historical Events:** Cross-reference the identified instances with previous alerts or known good behavior within your environment to identify patterns or anomalies that suggest malicious intent.

  - **Inspect System Integrity:** Examine affected systems for other signs of compromise, such as the presence of unauthorized backdoors, changes to system configurations, or other executed commands that could indicate further exploitation following the initial reverse shell attempt.

  ### Prioritization
  Given the potential severity of a reverse shell in an enterprise environment, this alert is classified as medium severity. The risk is significant due to the possibility of unauthorized data access, lateral movement, and persistent threats if such behavior is not investigated and contained promptly.

  ### Blind Spots and Assumptions
  Despite its effectiveness, there are inherent gaps in detection coverage. This rule may not capture all instances of reverse shells, particularly if different programming languages or methods are used outside of Ruby. The detection is based on the assumption that attackers will employ recognizable socket functions and that logging is correctly configured to capture process creation events. To function effectively, the proper logging configuration must be ensured, and all relevant process execution activities must be captured in the system logs.

