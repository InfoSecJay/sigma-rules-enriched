note: |
  ### Technical Context
  This detection rule identifies when the system files "passwd" or "shadow" are copied from a temporary path, likely indicating unauthorized attempts to access sensitive user credentials on a Linux-based system. The threat scenario involves an attacker or malicious insider attempting to gain access to user account information, which can be exploited for privilege escalation or lateral movement within the network. The primary attacker objective is credential theft, which can lead to unauthorized access to critical systems.

  Relevant MITRE ATT&CK tactics for this rule include "Credential Access" (TA0006) and specifically the technique "Credentials from Password Stores" (T1552.001). This technique encompasses various methods used by attackers to retrieve account credentials from secured locations. The best evidence for this detection can be gathered from process creation events that detail command line activity, particularly focusing on commands involving the `/tmp/` directory and references to the 'passwd' or 'shadow' files.

  ### Investigation Steps
  - **Review Process Creation Logs:** Collect and analyze process creation logs to identify command line executions containing '/tmp/' and either 'passwd' or 'shadow'. Look for the specific image name ending with '/cp'.
  - **Correlate User Activity:** Investigate the user accounts executing these commands. Cross-reference with user activity logs to determine if the behavior is typical for a legitimate user.
  - **Check File Integrity:** Monitor changes to the 'passwd' and 'shadow' files. Use filesystem auditing tools to assess if these files were altered or accessed in an unusual manner.
  - **Examine Temporary File Directories:** Analyze other files in the `/tmp/` directory around the same timestamp for additional context on the possible malicious activity or related incidents.

  ### Prioritization
  The high severity of this alert is justified due to the critical nature of the 'passwd' and 'shadow' files, which contain user account information. Unauthorized access to these files significantly increases the likelihood of account compromise and potential system breaches.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the possibility of attackers using obfuscated or alternative methods to access the files, which may not trigger this specific rule. The detection logic assumes that the commands will reference the `/tmp/` directory explicitly and that the copying tool is '/cp'. Additionally, this alert relies on having comprehensive logging enabled for process creation events, which must be accurately configured to capture relevant command line arguments for it to function effectively.

