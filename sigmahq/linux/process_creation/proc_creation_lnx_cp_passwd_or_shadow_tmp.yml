note: |
  ### Technical Context

  This rule detects instances where the files "passwd" or "shadow" are copied from the `/tmp` directory on Linux systems using the `cp` command. This behavior is indicative of a potential credential harvesting attempt, as these files often contain sensitive user information and password hashes. The attacker’s objective likely revolves around gaining unauthorized access to user accounts or further lateral movement within the environment. This behavior falls under the MITRE ATT&CK framework, specifically within the tactic of Credential Access (T1552.001).

  The primary telemetry sources for this detection are Linux process creation logs, which include command execution details. Monitoring the `CommandLine` field for evidence of copying these critical files is essential. If malicious, such activities could result in significant security risks as attackers could gain access to user credentials. Importantly, this detection does NOT confirm malicious activity on its own—additional context and correlation with endpoint behavior are needed before taking further action.

  ### Investigation Steps

  - **Identify the command origin:** Review the Syslog or audit logs for `Event ID` corresponding to the process creation, specifically looking for `cmd` or `command_line` fields that match the pattern of the copied files (e.g., `/tmp/*passwd*` or `/tmp/*shadow*`).

  - **Assess system role and criticality:** Determine the role of the affected system (e.g., critical server, user workstation) to prioritize investigation. Consider whether sensitive user accounts are present on the device in question.

  - **Validate legitimate activity:** Check for expected `cp` command usage on the affected system. Legitimate processes that use `/tmp` for temporary file storage should follow typical usage patterns, such as script run times, and whether file manipulations include proper user permissions.

  - **Correlate with user activity:** Reference the `auth.log` or equivalent to assess recent user authentication actions that might connect the executed command to known user behaviors or access patterns.

  - **Evaluate file presence and access times:** Look for recent timestamps on the `/tmp/passwd` or `/tmp/shadow` files that correspond with the `cp` command execution. Investigate whether these files were accessed in accordance with the organization’s normal operational patterns.

  - **Identify malicious indicators:** Check for root or unauthorized user accounts executing the command. Any `uid` of 0 or other unauthorized users in the logs executing the `cp` command should elevate the threat level.

  ### Prioritization

  Given that the affected files are critical for system authentication, the alert severity is high. The likelihood of malicious abuse is significant, as attackers frequently target these files for credential theft. This behavior is not only unusual but also commonly weaponized in various attack scenarios involving privilege escalation or lateral movement.

  ### Blind Spots and Assumptions

  The detection has inherent limitations, including potential evasion via disguising command usage or altering file locations. It requires comprehensive logging configuration on the Linux systems to ensure all relevant events are captured. Legitimate administrative scripts may generate similar alerts, necessitating further investigation. A related detection to enhance coverage would be monitoring direct access attempts to `/etc/passwd` or `/etc/shadow`, which are common in credential access scenarios.

