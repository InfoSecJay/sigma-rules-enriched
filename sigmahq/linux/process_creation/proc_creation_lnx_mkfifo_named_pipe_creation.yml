  ### Technical Context
  This detection rule identifies instances where the `mkfifo` utility is used to create a new named pipe on a Linux system. Named pipes can facilitate communication between processes and are commonly used in legitimate software development. However, their use can also indicate malicious behavior, such as establishing two-way communication channels for stealthy data exfiltration or remote command and control functions.

  In a threat scenario, an attacker may utilize `mkfifo` to create named pipes as part of an exploitation strategy to hide malicious activity or evade detection while conducting post-exploitation tasks. The intended objectives could include lateral movement, privilege escalation, or maintaining access to compromised systems without raising alarms.

  Relevant MITRE ATT&CK tactics/techniques for this activity include:
  - **Execution** (TA0002): The use of tools and scripts to execute commands and code within a system.
  - **Remote Services** (T1219): Exploiting named pipes for communication between processes, including malicious code execution.

  Primary data sources for this detection include:
  - Process creation events, which log the execution of commands and tools on the system.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check the process creation logs for entries related to `mkfifo`, noting the time of execution and the user context to discern any unauthorized activity.
  - **Analyze Parent Process Relationships:** Investigate the parent-child relationships in the process tree for the created named pipes, looking for other suspicious processes that may have invoked `mkfifo`.
  - **Inspect Named Pipe Usage:** Look for any read/write operations performed on the named pipes created by `mkfifo`, paying close attention to connections from or to external networks or unusual internal processes.
  - **Correlate with User Activity:** Cross-reference timestamps of the `mkfifo` command execution with user activity logs, especially for users who do not typically perform such operations, to identify potential misuse.

  ### Prioritization
  The alert's low severity is based on the relatively low likelihood of benign uses of `mkfifo` and its association with legitimate applications versus its potential for misuse by attackers. Investigating should focus on high-risk assets or unusual contexts to maximize resource efficiency.

  ### Blind Spots and Assumptions
  This detection relies on accurately capturing process creation events specifically for the `mkfifo` utility. Gaps in coverage may arise from resource-constrained devices or configurations that do not log process creation events comprehensively. Additionally, the detection assumes legitimate uses of `mkfifo` are controlled and monitored, so analysts must decide if the context of its use can be justified from other collected logs. For effective alerting, it is essential to ensure that relevant process logging is enabled and configured correctly across all Linux endpoints.

