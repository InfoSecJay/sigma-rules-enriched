  ---

  ### Technical Context

  This rule detects the creation of a named pipe using the "mkfifo" utility on a Linux system. The likely attacker objective is to facilitate inter-process communication for malicious purposes, such as evasion of detection or exfiltration of data. This behavior is associated with the MITRE ATT&CK technique **"Command and Control" (T1219)**.

  Primary telemetry sources include Linux process creation logs, specifically tracking the execution of the `mkfifo` command. If triggered by a malicious actor, the security impact could involve unauthorized data transfer or potential backdoor communication. It's important to note that this detection does not confirm the intent behind the creation of the named pipe on its own.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Review `/var/log/auth.log` (or equivalent) for Syslog entries confirming `mkfifo` execution. Look for unusual timestamps or user contexts that don’t match normal operational activity.

  - **Identify the parent process:** Use `ps -ef` or `pstree` to find the parent process of the mkfifo execution to assess whether it originated from known benign applications or potential malware.

  - **Review recent named pipe usage:** Check for named pipes in `/tmp` or other temporary directories with unexpected access patterns. Legitimate use cases often involve specific known applications like system daemons.

  - **Analyze file permissions:** Examine the permissions set on the created named pipe using `ls -l`, especially if they're configured to allow access to unauthorized users, indicating potential security risks.

  - **Query for active network connections:** Use `netstat` or `ss` to check for active connections that may correspond to the named pipe's intended use, looking for signs of data being sent to unauthorized destinations.

  - **Check user account activity:** Investigate the user associated with the mkfifo creation for unusual account activity, focusing on logins from atypical locations or times identified in `/var/log/lastlog`.

  ---

  ### Prioritization

  The alert severity is low due to the likelihood of benign uses of `mkfifo` within Unix system functionalities. However, if seen in an environment with no known application dependencies on named pipes, it could indicate malicious behavior, particularly in compromised environments. This behavior is not commonly weaponized, yet should still be assessed in the context of other suspicious activity.

  ---

  ### Blind Spots and Assumptions

  The detection may miss cases where the named pipe is created through alternatives to `mkfifo`, such as by using programming scripts or other means. It is crucial that the Linux audit daemon or similar logging is configured correctly to capture process creation events. Legitimate processes, like application installations or maintenance tasks, may trigger this alert. Monitoring related activities such as shell command execution (`T1059`) could provide additional context for anomalies.

