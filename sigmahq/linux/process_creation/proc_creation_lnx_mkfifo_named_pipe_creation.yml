  ### Technical Context

  This Sigma rule detects the creation of a named pipe using the `mkfifo` utility in Linux. Named pipes can be exploited by attackers to facilitate communication between processes, potentially allowing for command and control (C2) or data exfiltration while obfuscating activities. The relevant MITRE ATT&CK tactic for this behavior is **Execution** (TA0002) and the technique is **Command-Line Interface** (T1203). The primary telemetry source for this detection is process creation logs, specifically monitoring for commands executed and their associated parameters.

  If the activity is initiated by a malicious actor, it can lead to unauthorized access or data exfiltration. However, it is important to note that the creation of a named pipe using `mkfifo` does NOT confirm malicious behavior on its own, as it may also be a legitimate action performed by applications requiring inter-process communication.

  ### Investigation Steps

  - **Identify the user context:** Review process creation logs (e.g., `/var/log/auth.log`, Syslog) for Event ID indicating the user who executed the `mkfifo` command. Look for unusual user accounts or high-privilege accounts not typically associated with named pipe usage.

  - **Examine processes interacting with the pipe:** Investigate any associated processes using the named pipe via `lsof` or similar tools to confirm if the interactions are unusual or expected. Look for suspicious parent processes or processes that should not be communicating in this manner.

  - **Correlate with additional execution parameters:** Check the command-line arguments passed with `mkfifo` in the logs to understand the context. If a legitimate application is creating a named pipe for inter-process communication, the arguments will typically reference known application paths or workflows.

  - **Evaluate known exploits:** Research if there are any recent vulnerabilities associated with the application or environment where the named pipe is created. Leverage sites like CVE databases to check for current exploit statuses that could lead to malicious usage.

  - **Check for parallel file access:** Validate if any files are being created or modified simultaneously in the same directory where the named pipe is created. Look for file creation logs (e.g., in Syslog or audit logs) to identify any unauthorized file operations.

  - **Review network connections:** If the named pipe is suspected to facilitate C2, check outgoing connections made by processes interacting with the pipe using tools like `netstat` or `ss`. Look for connections to known malicious IPs or domains.

  ### Prioritization

  This alert should be treated with moderate severity due to the potential for exploiting named pipes for unauthorized data exchanges or command execution. While it has a low likelihood of being frequently weaponized, its occurrence in sensitive environments, especially involving critical systems, warrants careful investigation.

  ### Blind Spots and Assumptions

  The detection can be limited by environments where logging for process creation is not adequately configured. Named pipe creation might also occur in benign script operations or tools, triggering false positives. Organizations should ensure thorough logging setup for Shell commands and related execution logs to identify broader attack patterns. Companion detections, such as monitoring for unusual network connections after named pipe creation, can provide deeper insight and enhance detection efficacy.

