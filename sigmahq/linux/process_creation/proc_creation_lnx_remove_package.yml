title: Linux Package Uninstall
id: 95d61234-7f56-465c-6f2d-b562c6fedbc4
status: test
description: Detects linux package removal using builtin tools such as "yum", "apt",
  "apt-get" or "dpkg".
references:
- https://sysdig.com/blog/mitre-defense-evasion-falco
- https://www.tutorialspoint.com/how-to-install-a-software-on-linux-using-yum-command
- https://linuxhint.com/uninstall_yum_package/
- https://linuxhint.com/uninstall-debian-packages/
author: Tuan Le (NCSGroup), Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-09
tags:
- attack.defense-evasion
- attack.t1070
logsource:
  product: linux
  category: process_creation
detection:
  selection_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'erase'
    - 'remove'
  selection_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains:
    - 'remove'
    - 'purge'
  selection_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--remove '
    - ' -r '
  selection_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: ' -e '
  condition: 1 of selection_*
falsepositives:
- Administrator or administrator scripts might delete packages for several reasons
  (debugging, troubleshooting).
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects the uninstallation of packages on Linux systems using built-in package management tools like `yum`, `apt`, `apt-get`, `dpkg`, and `rpm`. The likely objective of an attacker could be to remove critical software or security tools, thereby hindering the system's defenses or utility. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1070).

  The primary telemetry sources include process creation logs, specifically those corresponding to events generated by package managers in Linux. If malicious, the uninstallation of security-related packages can significantly impact the system's integrity and overall security posture. However, this detection alone does not confirm malicious activity, as legitimate administrative actions can result in similar package removals.

  ---

  ### Investigation Steps

  - **Verify the Command Line Input:**
    Review the command line parameters used. Look for package managers invoking `yum`, `apt`, `dpkg`, or `rpm` with removal commands such as `remove`, `erase`, or `purge` (Sysmon Event ID 1 or Linux process logs).

  - **Identify the User Executing the Command:**
    Check who executed the package removal command. If executed by non-administrative users (e.g., user IDs below 1000), this could indicate suspicious behavior. Verify using `who` or checking `/var/log/auth.log`.

  - **Check Recent Package Installations and Removals:**
    Review the package management logs located in `/var/log/yum.log`, `/var/log/apt/history.log`, or similar, to correlate with the removal event timestamps (especially regarding system-critical or security packages).

  - **Assess the Context of the Activity:**
    Determine whether the removal falls within expected maintenance activities. Scheduled maintenance or routine admin tasks may account for this behavior if confirmed with prior knowledge or documentation.

  - **Monitor for Other Malicious Indicators:**
    Look for accompanying indicators such as unusual process behaviors or unauthorized network connections post-package removal (Sysmon Event ID 1 captures process creation; utilize command like `netstat` for connections).

  ---

  ### Prioritization

  The alert severity is low but should be monitored due to the potential impact on system integrity if critical security tools are uninstalled. While malicious use is possible, such actions are also common during legitimate administrative processes, thus requiring thorough contextual examination.

  ---

  ### Blind Spots and Assumptions

  Detection may miss nuanced evasion techniques such as using script wrappers to disguise package removal commands. Reliable detection calls for comprehensive logging, including process creation for package management commands. Legitimate tasks, such as routine updates or troubleshooting by administrative bodies, may trigger this alert. A related detection for unauthorized package installations or modifications would enhance coverage against potentially harmful activities.

