title: Linux Package Uninstall
id: 95d61234-7f56-465c-6f2d-b562c6fedbc4
status: test
description: Detects linux package removal using builtin tools such as "yum", "apt",
  "apt-get" or "dpkg".
references:
- https://sysdig.com/blog/mitre-defense-evasion-falco
- https://www.tutorialspoint.com/how-to-install-a-software-on-linux-using-yum-command
- https://linuxhint.com/uninstall_yum_package/
- https://linuxhint.com/uninstall-debian-packages/
author: Tuan Le (NCSGroup), Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-09
tags:
- attack.defense-evasion
- attack.t1070
logsource:
  product: linux
  category: process_creation
detection:
  selection_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'erase'
    - 'remove'
  selection_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains:
    - 'remove'
    - 'purge'
  selection_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--remove '
    - ' -r '
  selection_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: ' -e '
  condition: 1 of selection_*
falsepositives:
- Administrator or administrator scripts might delete packages for several reasons
  (debugging, troubleshooting).
level: low
note: |
  ### Technical Context
  This detection rule alerts on the uninstallation of Linux packages using built-in utilities such as `yum`, `apt`, `apt-get`, `dpkg`, or `rpm`. It is designed to identify potentially malicious activities where an attacker might attempt to disrupt services or remove monitoring tools and security software from a compromised system. The threat scenario typically involves an adversary attempting to evade detection by deleting logs or security applications, thereby facilitating their persistence or lateral movement within the network.

  Relevant MITRE ATT&CK tactics include **Defense Evasion (TA0005)**, specifically technique **Indicator Removal on Host (T1070)**, where attackers erase traces of their activities to evade detection. The primary data sources for this detection include process creation logs that record command line arguments and the images of executed processes. These logs provide insights into package management activities that may indicate a compromise if initiated under unusual circumstances.

  ### Investigation Steps
  - **Review Process Logs:** Examine process creation logs from the Linux systems to identify any instances of `yum`, `apt`, `dpkg`, or `rpm` commands used for uninstalling packages.
  - **Analyze Command Line Arguments:** Focus on the command line arguments associated with the package removal commands to detect unusual or suspicious patterns, particularly around times of security incidents.
  - **Correlate with User Activity:** Cross-reference the removal actions with user accounts to determine if the commands were executed by an authorized user or an unknown entity, especially during off-hours.
  - **Check for Other Malicious Indicators:** Investigate the system for other signs of compromise, such as unexpected network connections, alteration of system files, or changes in user privileges that could warrant further analysis.

  ### Prioritization
  The alert is prioritized as low severity due to the possibility of legitimate administrative activities, such as troubleshooting or system maintenance, being misclassified. However, it remains important to investigate these actions as they could indicate an underlying security issue if they align with suspicious user behavior or other concerning context.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logging is disabled or not properly configured, as these logs are critical for identifying suspicious package removal events. The detection logic assumes that the execution of these package management tools is not a regular part of administrative activities and that any unusual package deletions should be looked at more closely. Additionally, high false positive rates may occur, especially if administrators frequently execute such commands for legitimate purposes without corresponding controls in place to provide context.

