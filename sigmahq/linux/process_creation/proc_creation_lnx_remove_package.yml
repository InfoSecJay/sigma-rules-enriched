title: Linux Package Uninstall
id: 95d61234-7f56-465c-6f2d-b562c6fedbc4
status: test
description: Detects linux package removal using builtin tools such as "yum", 
  "apt", "apt-get" or "dpkg".
references:
- https://sysdig.com/blog/mitre-defense-evasion-falco
- https://www.tutorialspoint.com/how-to-install-a-software-on-linux-using-yum-command
- https://linuxhint.com/uninstall_yum_package/
- https://linuxhint.com/uninstall-debian-packages/
author: Tuan Le (NCSGroup), Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-09
tags:
- attack.stealth
- attack.t1070
logsource:
  product: linux
  category: process_creation
detection:
  selection_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'erase'
    - 'remove'
  selection_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains:
    - 'remove'
    - 'purge'
  selection_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--remove '
    - ' -r '
  selection_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: ' -e '
  condition: 1 of selection_*
falsepositives:
- Administrator or administrator scripts might delete packages for several 
  reasons (debugging, troubleshooting).
level: low
note: |
  ### Technical Context

  This Sigma rule detects the uninstallation of packages on Linux systems using built-in tools such as `yum`, `apt`, `apt-get`, or `dpkg`. The likely objective of an attacker triggering this behavior is to remove security software or other critical monitoring solutions to evade detection. This activity aligns with the MITRE ATT&CK technique for `T1070: Indicator Removal on Host`. The primary telemetry sources include process creation events from Linux, specifically those related to package management commands. If the behavior is malicious, it may compromise the integrity of the system and facilitate further unauthorized access or actions. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities can result in similar package removals.

  ### Investigation Steps

  - **Check process creation logs**: Review Linux process creation logs (e.g., auditd logs or syslog) for Event IDs related to process creation (e.g., 42 for auditd) surrounding the time of the alert. Validate whether non-standard packages are being removed.

  - **Identify command-line arguments**: Correlate command-line arguments with the alert. Commands containing options like `remove`, `purge`, `erase`, or `-e` should be analyzed. Legitimate commands generally involve routine maintenance on known packages.

  - **Review affected package details**: Investigate which specific packages were uninstalled. Look at package management logs located at `/var/log/yum.log`, `/var/log/apt/history.log` or `/var/log/dpkg.log` to confirm if critical security packages (e.g., antivirus or monitoring agents) were targeted.

  - **Determine process ancestry**: Use `pstree` or similar tools to check the parent processes of the command execution for unusual patterns or if the uninstallation command was spawned from a suspicious or non-administrative process.

  - **Assess frequency of uninstallations**: Check historical logs for the frequency of similar uninstall commands. Frequent uninstalls during off-hours may indicate malicious behavior or compromise compared to typical admin tasks which are often routine.

  - **Review associated logs for context**: Look for logs indicating the authentication of the user who executed the command. Confirm if the user has typical administrative privileges or if there’s a novel or unauthorized user context involved in the install/uninstall operations.

  ### Prioritization

  Alert severity is low due to the potential for legitimate administrative activities triggering the detection, such as debugging by system administrators. However, frequent or unusual package removals may suggest malicious intent. The likelihood of such uninstallation actions being leveraged for exploitation is moderate, given the common use of security evasion techniques in targeted attacks.

  ### Blind Spots and Assumptions

  The detection's limitations include the possibility of skilled adversaries evading detection through stealth techniques, such as using custom scripts to uninstall packages without generating typical process entries. Reliable detection requires proper logging configurations across all Linux package management tools. Legitimate activities that may falsely trigger this alert include routine system maintenance or troubleshooting by authorized personnel. A companion detection that could strengthen coverage includes monitoring for unusual process creation for uninstalled packages or unexpected parent-child process relationships during system auditing.

