title: Linux Package Uninstall
id: 95d61234-7f56-465c-6f2d-b562c6fedbc4
status: test
description: Detects linux package removal using builtin tools such as "yum", 
  "apt", "apt-get" or "dpkg".
references:
- https://sysdig.com/blog/mitre-defense-evasion-falco
- https://www.tutorialspoint.com/how-to-install-a-software-on-linux-using-yum-command
- https://linuxhint.com/uninstall_yum_package/
- https://linuxhint.com/uninstall-debian-packages/
author: Tuan Le (NCSGroup), Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-09
tags:
- attack.defense-evasion
- attack.t1070
logsource:
  product: linux
  category: process_creation
detection:
  selection_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'erase'
    - 'remove'
  selection_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains:
    - 'remove'
    - 'purge'
  selection_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--remove '
    - ' -r '
  selection_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: ' -e '
  condition: 1 of selection_*
falsepositives:
- Administrator or administrator scripts might delete packages for several 
  reasons (debugging, troubleshooting).
level: low
note: |
  ### Technical Context

  This Sigma rule detects the uninstallation of Linux packages through built-in command-line tools like `yum`, `apt`, `apt-get`, or `dpkg`. The likely attacker objective is to remove security software or critical applications, which can facilitate further malicious activity or cover tracks, aligning with MITRE ATT&CK Technique T1070: Indicator Removal on Host. Primary telemetry sources include process creation logs from the Linux operating system, specifically focusing on commands related to package removal. If this behavior is malicious, it could lead to significant security degradation, allowing attackers to compromise a host more easily. However, this detection alone does not confirm malicious intent, as legitimate administrative actions may also trigger the rule.

  ### Investigation Steps

  - **Check process logs for package uninstalls:** Review process creation logs (Sysmon Event ID or similar) for commands related to package removal. Look for entries with the command line containing 'erase', 'remove', 'purge', or '--remove'.

  - **Identify expected administrative actions:** Legitimate administrators often uninstall packages for legitimate purposes. Check for recent IT change management approvals that may correlate with the removal actions noted in the logs to differentiate benign behavior from potential attacks.

  - **Analyze command origins:** Investigate the user context of the command execution via `/var/log/auth.log` for authentication logs tied to the use of `sudo`. Unfamiliar accounts or unauthorized users running such commands should be flagged as suspicious.

  - **Correlate with recent malware activity:** Check for related alerts or telemetry indicating malware or unauthorized file access that occurred shortly before the uninstallation logs. Look for indicators such as unexpected outbound connections or modified executables in `/usr/bin` or `/usr/local/bin`.

  - **Validate critical system packages:** Cross-reference the removed packages with a list of critical applications for your environment. Removal of essential components (e.g., `iptables`, `sshd`) should be escalated for further investigation.

  - **Review for remediation attempts:** Look for follow-up actions immediately after uninstallation, such as reinstallation commands or suspicious behavior that could indicate an attacker is attempting to maintain persistence.

  ### Prioritization

  This alert carries a low severity level in an enterprise context. Although it indicates potential malicious activity, the likelihood of abuse is moderate given the common administrative use of package uninstallation. Such behavior is not typically weaponized in straightforward attacks but can be indicative of a broader attack strategy when correlated with other anomalous behavior.

  ### Blind Spots and Assumptions

  The primary limitation of this detection is the potential for legitimate administrative actions to trigger alerts, especially in environments where package maintenance occurs frequently. Required log sources include process creation and authorization logs, while missing or misconfigured log sources may result in undetectable malicious activities. Additionally, typical troubleshooting or debugging sessions may trigger similar alerts. A related detection to strengthen coverage could involve monitoring for the installation of packages (`apt install`, `yum install`), which can indicate a related threat.

