note: |
  ### Technical Context

  This Sigma rule detects the execution of the `esxcli` command with the "system" flag, typically used to gather various system information such as account details, modules, and network time protocol (NTP) configurations on ESXi hosts. The likely attacker objective is to collect sensitive configuration data that may aid in preparing for further attacks or establishing a foothold. Related MITRE ATT&CK tactics include Discovery (T1087: Account Discovery) and Execution (T1059.012: Command and Scripting Interpreter).

  The primary telemetry sources for this detection are process creation logs on Linux systems, specifically tracking the execution of the ESXi command-line interface. If malicious, this behavior can provide an attacker insight into the operational environment, potentially leading to exploitation. However, simply detecting this command does NOT confirm that malicious activity is occurring on its own, as legitimate administrative tasks may also trigger this alert.

  ### Investigation Steps

  - **Analyze process creation logs**: Review Linux process creation logs, specifically looking for Event IDs related to the execution of `/esxcli`. Check for CommandLine arguments containing "system".

  - **Evaluate command usage context**: Identify the user account executing the `esxcli system` command. Legitimate administrative activities will typically occur under known admin accounts during maintenance windows, not under unexpected or generic user accounts.

  - **Inspect command arguments**: Confirm the presence of specific flags (e.g., "get", "list") in the CommandLine. Legitimate system queries should show typical read operations, while unusual flags may indicate probing for sensitive information.

  - **Cross-reference with known schedules**: Check for any scheduled maintenance or administrative tasks correlating with the timestamp of the command's execution. Unexpected activity outside of regular schedules can indicate malicious behavior.

  - **Look for additional suspicious behavior**: Identify any follow-up commands executed by the same user or IP address shortly after `esxcli` is called, as sequential execution may indicate an attacker progressing through initial access strategies.

  ### Prioritization

  The alert severity is medium based on the impact of the affected ESXi systems, which are critical to virtualization infrastructure. While not all usages of this command denote malicious activity, misuse is common among adversaries exploring the environment. Therefore, a careful evaluation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by user impersonation techniques or legitimate administration roles executing these commands at unexpected times. Ensure logging is correctly configured to capture all relevant process creation events, as missing logs can lead to undetected activities. Legitimate system administrators may trigger alerts during routine checks. A related detection to consider is monitoring for unauthorized SSH access attempts to ESXi hosts, which strengthens the coverage of command execution monitoring.

