- attack.t1033
- attack.t1007
- attack.t1059.012
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'system'
  selection_cli:
    CommandLine|contains:
    - ' get'
    - ' list'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the `esxcli` command with the `system` flag, typically used to query and manage various components of an ESXi host. Attackers may leverage this command to gather detailed information about the system, such as user accounts, modules, NTP settings, and other configurations, potentially assisting in further exploitation or lateral movement within a virtualized environment. The rule specifically flags `esxcli` executions where the command line includes the word "system," which indicates that the query pertains to system information.

  The relevant MITRE ATT&CK techniques include:
  - **T1059.012 - Command and Scripting Interpreter: Unix Shell**: This technique encompasses the use of shell commands such as those executed in esxcli.
  - **T1007 - System Service Discovery**: Here, obtaining system information is essential for attackers to assess the operating environment.
  - **T1033 - System Information Discovery**: Understanding the underlying system's configuration can inform an attacker's strategy and next steps.

  Primary data sources to consider include Linux process creation logs, particularly pertaining to the running of the esxcli command. This log would highlight potentially unauthorized usage and assist in understanding the nature of the command.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances of the `esxcli` command being executed alongside the `system` flag. Look for any unusual timeframes or user accounts.
  - **Correlate with User Activity:** Identify the context of the user executing the command, and check whether the access aligns with normal administrative practices. If unusual, escalate for further analysis.
  - **Analyze Command Line Arguments:** Scrutinize additional command line arguments used with `esxcli` to discern any potentially malicious intent, such as commands with `get` or `list`.
  - **Monitor User Account Behavior:** Investigate the behavior of any user accounts associated with the execution, checking for signs of lateral movement or privilege escalation that may accompany system discoveries.

  ### Prioritization
  This alert is assigned a medium severity level due to the potential for attackers to exploit system information for more disruptive attacks. Although legitimate administrative actions may trigger the alert, the presence of `esxcli` related to unauthorized access poses a noteworthy risk in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if certain logs from the ESXi host are not being collected or if command executions are obscured due to valid administrative activity. The rule assumes that logs will consistently capture all relevant process creation data and that `esxcli` queries with various command line arguments will be distinguishable. Without comprehensive logging or proper configurations, alerts may be missed or misattributed to regular administrative tasks.

