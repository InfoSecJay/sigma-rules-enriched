note: |
  ### Technical Context

  This Sigma rule detects the invocation of a shell using the `capsh` utility, a common method leveraged by adversaries to bypass restrictions on privileged shell access. The likely attacker objective is to execute arbitrary commands with elevated capabilities or to maintain persistence by running a shell in an environment where direct access is restricted. This activity corresponds to the MITRE ATT&CK technique **Execution: Command-Line Interface (T1059)**. The primary telemetry sources include Linux process creation logs, specifically monitoring entries indicating the execution of `capsh` with specific command line arguments.

  If the behavior is found to be malicious, it suggests that an attacker may have escalated privileges, potentially leading to a compromised system. Importantly, this detection does NOT confirm that the system has been fully compromised, as it may also be triggered by legitimate users utilizing `capsh` for valid administrative tasks.

  ### Investigation Steps

  - **Check process details**: Review process creation logs for Event ID exec and identify parent processes. Validate whether `capsh` was invoked by unusual or unexpected parent processes (e.g., non-admin users or scripts).

  - **Examine command line arguments**: Analyze the CommandLine field for arguments ending with `--`. Look for any known malicious payloads or suspicious activity patterns, such as unusual shell commands or script names.

  - **Identify user context**: Determine the user account that invoked `capsh` and assess whether it aligns with expected administrative behavior. Legitimate actions typically come from system administrators, while unexpected users should raise suspicion.

  - **Correlate with user activity**: Cross-reference logs from user activity (e.g., bash, history logs) for any commands executed within a short timeframe before or after the `capsh` invocation. Malicious activity may show coordinated command execution indicative of a shell escape.

  - **Evaluate host role and criticality**: Determine the function of the affected system (e.g., server, desktop) and its role in the broader environment. For critical systems, such as those hosting sensitive applications, require higher scrutiny.

  ### Prioritization

  This alert is of high severity due to its potential to indicate privilege escalation in critical environments. The likelihood of malicious abuse is moderate, as the `capsh` utility can be weaponized for shell access by adversaries. Although not frequently employed, its execution raises concerns in contexts where administrative access is strictly controlled.

  ### Blind Spots and Assumptions

  This detection may miss certain evasion techniques if an attacker uses alternative methods to gain shell access or renames the `capsh` binary. Log sources must include comprehensive process creation telemetry for reliable detection; configurations should be verified for completeness. Legitimate administrative activities, such as system configuration changes by trusted users, may inadvertently trigger this alert. Related detections monitoring the execution of other shell escape utilities can complement this rule and strengthen overall detection coverage.

