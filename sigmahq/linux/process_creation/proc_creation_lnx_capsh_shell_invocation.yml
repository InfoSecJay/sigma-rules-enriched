note: |
  ### Technical Context
  This rule detects the use of the `capsh` utility to invoke a shell, an action that may indicate an attacker attempting to bypass restrictions or escalate privileges on a Linux system. The `capsh` command is often used to create an environment with specific capabilities, enabling users to execute commands that would typically be restricted by conventional privilege checks. An attacker aiming for persistence or lateral movement might use this method to gain shell access with elevated privileges, making it a significant threat in environments where Linux servers are critical.

  The corresponding MITRE ATT&CK tactics related to this detection include **Execution** (T1203) for the execution of commands, as well as **Privilege Escalation** (T1068) given the potential for gaining elevated privileges through the use of `capsh`. Primary data sources for this detection will include **process creation logs** from Linux systems, which capture detailed information about command executions, including the command line used and the executable invoked.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate the process creation logs on the affected Linux host for any instances of `capsh` being executed. Pay close attention to the command line parameters used during invocation.

  - **Analyze User Context:** Determine the user context under which the `capsh` command was executed. Verify if this user has legitimate administrative credentials or if their permissions have been recently modified.

  - **Correlate with Other Activities:** Check for abnormal activities around the same time as the `capsh` invocation, such as unusual login attempts or other execution requests from the same user, to uncover potential patterns of malicious behavior.

  - **Audit Capabilities and Permissions:** Investigate the capabilities assigned to the 'capsh' command on the impacted system. This should include auditing the current user and group permissions to assess if the executed command aligns with expected usage patterns for legitimate applications.

  ### Prioritization
  This alert is of high severity due to the potential for privilege escalation and shell access, which could lead to further compromise of the system and spread to other parts of the network. The likelihood of this behavior indicating malicious intent is significant, especially in environments where users do not typically engage in such actions.

  ### Blind Spots and Assumptions
  One possible gap in detection coverage is the reliance on process creation logs alone, meaning that if these logs are not enabled or preserved long enough for analysis, the detection will fail. The detection logic assumes that the usage of `capsh` in this manner is unauthorized, which may not hold true in all contexts; hence it is critical to complement this rule with additional context to reduce false positives. Proper configuration of process logging on Linux systems is essential for this alert to function effectively, as well as ensuring that comprehensive user auditing measures are implemented.

