title: Shell Execution via Find - Linux
id: 6adfbf8f-52be-4444-9bac-81b539624146
status: test
description: |
  Detects the use of the find command to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or exploitation attempt.
references:
- https://gtfobins.github.io/gtfobins/find/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/find'
    CommandLine|contains|all:
    - ' . '
    - '-exec'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the `find` command is used to execute a shell in a Linux environment. Such behavior is often linked to privilege escalation attempts, unauthorized command execution, or exploitation scenarios, where an attacker seeks to perform malicious actions while evading security controls. By leveraging the capabilities of the `find` command, an adversary can effectively bypass restrictions on command execution, particularly in environments implementing restricted shells.

  Relevant MITRE ATT&CK tactics include:
  - **Discovery** (TA0007): The use of the `find` command can be part of a broader reconnaissance effort.
  - **Execution** (TA0002): Executing a shell via `find` specifically relates to executing malicious commands to achieve attacker objectives.

  Primary telemetry sources that will provide insight into this behavior include:
  - Process creation logs, which capture command execution details.
  - Shell command logs, where applicable, that might log user interactions within the shell environment.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for entries that show the execution of the `find` command with `-exec` followed by a shell invocation. Investigate the user and context under which the command was executed.
  - **Analyze Command Line Arguments**: Pay close attention to command line arguments used with `find`, particularly those indicating potential exploitation methods, such as embedded shells (e.g., bash, sh).
  - **Correlate User Activity**: Assess the account from which the command was run. Determine if the execution context is consistent with normal user behavior and if there have been any recent privilege escalations or access anomalies.
  - **Examine Historical Logs for Patterns**: Investigate historical behavior of the identified user to determine if the use of `find` for shell execution has occurred before and if it correlates with suspicious behavior or patterns.

  ### Prioritization
  The alert's severity is high due to the potential risks associated with shell execution, which can lead to unauthorized access, data breaches, or system compromise. This behavior may indicate an active threat actor attempting to escalate privileges or manipulate the system.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage may arise from environments that do not log process creation events comprehensively or have restricted logging levels. The alert assumes the presence of adequate logging for the `find` command and relevant command-line arguments. Additionally, it may miss sophisticated attack techniques that obfuscate their use of common command-line utilities. Ensuring correct logging configurations and retention policies is necessary for the detection rule's effectiveness.

