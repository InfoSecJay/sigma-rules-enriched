logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/find'
    CommandLine|contains|all:
    - ' . '
    - '-exec'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a shell command via the `find` utility on Linux systems. Attackers may leverage this behavior to execute unauthorized commands, potentially indicating privilege escalation or exploitation attempts in the environment. This activity corresponds to the MITRE ATT&CK tactics of Discovery (TA0007) and Execution (TA0002), specifically targeting technique T1083 (File and Directory Discovery).

  The primary telemetry sources for this detection include Linux process creation logs, specifically focusing on command-line arguments utilized in the execution of `find`. If malicious, such activity could pave the way for deeper system compromise, unauthorized information access, or lateral movement within the network. It is important to note that detecting the execution of the `find` command in this manner does NOT confirm an attack on its own; additional context is required for a definitive conclusion.

  ### Investigation Steps

  - **Review command-line arguments for execution context:** Inspect process creation logs (e.g., Syslog or audit logs) for Event ID 1340 indicating `find` being executed. Look for `CommandLine` fields that contain `'.'` and `'-exec'` to validate if command execution was attempted through these parameters.

  - **Identify the invoking user and privilege level:** Check the `uid` and `gid` from the logs tied to the process creation to determine the level of access. If the command is executed by a non-privileged user in an unexpected context (e.g., non-administrative shell), further investigation is warranted.

  - **Establish baseline behavior for `find` usage:** Determine legitimate uses of the `find` command within your environment by reviewing previous command logs and identifying common parameters that users or scripts utilize. Normal usage typically does not include `-exec` with a shell invocation.

  - **Look for associated network activity:** Validate the presence of outbound network connections or unusual traffic patterns during the same timeframe as the shell execution. Check for `netstat` output or firewall logs for any unexpected outgoing connections that correspond with the user activity.

  - **Correlate with user behavior logs:** Review the user's recent activities in system logs to identify patterns that may suggest malicious intent or legitimate script execution. For example, scripts running under cron jobs or regular usage patterns may reveal benign activity rather than an exploit attempt.

  ### Prioritization

  This alert is high severity due to the potential impact on the affected system, especially if the command invocation leads to unauthorized access or escalation. The likelihood of abuse is significant, as this method is commonly weaponized in attacks targeting data exfiltration or system compromise.

  ### Blind Spots and Assumptions

  There are detection limitations as an attacker may mask their activity by manipulating command arguments or using alternative scripts. It's crucial to ensure comprehensive logging is enabled for process creations and command executions in Linux. Legitimate superuser scripts or administrative tasks may also trigger false positives. Companion detections such as `Shell Execution via Other Common Utilities` can provide reinforced coverage against broader command execution attempts.

