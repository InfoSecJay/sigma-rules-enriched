logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
            # You can add more grep variations such as fgrep, rgrep...etc
    - '/grep'
    - '/egrep'
    CommandLine|contains:
    - 'nessusd'                # nessus vulnerability scanner
    - 'td-agent'               # fluentd log shipper
    - 'packetbeat'             # elastic network logger/shipper
    - 'filebeat'               # elastic log file shipper
    - 'auditbeat'              # elastic auditing agent/log shipper
    - 'osqueryd'               # facebook osquery
    - 'cbagentd'               # carbon black
    - 'falcond'                # crowdstrike falcon
  condition: selection
falsepositives:
- Legitimate activities
level: low
note: |
  ### Technical Context
  This rule detects potentially malicious behavior on Linux systems where an attacker uses system utilities, specifically `grep` and `egrep`, to discover security software installations. The scenario typically involves an attacker who, with initial access to a system, is attempting to identify security tools, like endpoint protection or intrusion detection systems, which could impede their ability to operate undetected. By obtaining this knowledge, the attacker can evade detection or disable defenses.

  The relevant MITRE ATT&CK techniques for this behavior include **T1518.001 - Software Discovery**. This technique involves techniques used by adversaries to discover installed software on a system, validating whether specific security products are present to plan their next move. Primary data sources for this detection will be **process creation events**, as they capture the execution of commands and provide context on what information is being sought by the querying process.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs around the time of the alert to identify additional context, such as user accounts involved, parent processes, and any other unusual activity in conjunction with the command executed.

  - **Correlate with Security Inventory:** Cross-check the findings against an official list of installed security software to validate whether the command's purpose aligns with expected administrative or legitimate operations.

  - **Analyze CommandLine Arguments:** Investigate the full command line used, especially any options or flags to determine if they correspond to known attempts to probe for security utilities or illustrate unconventional usage patterns.

  - **Examine User Context:** Identify the user account that executed the commands and assess its privileges. Unusual accounts, such as service accounts or those not typically used for admin tasks, might indicate potential account compromise.

  ### Prioritization
  This alert is categorized as low severity, as it may result from legitimate administrative behavior rather than malicious intent. However, it warrants investigation due to the potential of attackers utilizing this process to uncover critical security tools.

  ### Blind Spots and Assumptions
  There may be gaps if the logging level for process creations is not sufficiently granular, leading to missed detections against other similar utilities or methods employed by attackers. The detection logic assumes that any listing of security software using `grep` or `egrep` is suspicious, which may not always be the case. Adequate logging of all command-line activity and appropriate configurations are essential for the alert to function effectively.

