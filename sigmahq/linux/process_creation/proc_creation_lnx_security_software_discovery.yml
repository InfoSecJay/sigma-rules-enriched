logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
            # You can add more grep variations such as fgrep, rgrep...etc
    - '/grep'
    - '/egrep'
    CommandLine|contains:
    - 'nessusd'                # nessus vulnerability scanner
    - 'td-agent'               # fluentd log shipper
    - 'packetbeat'             # elastic network logger/shipper
    - 'filebeat'               # elastic log file shipper
    - 'auditbeat'              # elastic auditing agent/log shipper
    - 'osqueryd'               # facebook osquery
    - 'cbagentd'               # carbon black
    - 'falcond'                # crowdstrike falcon
  condition: selection
falsepositives:
- Legitimate activities
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `grep` or `egrep` commands, specifically when used to search for the presence of security software like Nessus or Elastic Beats on a Linux system. The likely objective of the attacker is to identify security measures in place, which allows them to craft evasion techniques or plan further malicious activities. This detection aligns with the MITRE ATT&CK technique for Discovery: *System Information Discovery (T1518.001)*.

  The primary telemetry sources include process creation logs from Linux, focusing on command line invocations, particularly looking for specific security-related keywords. If malicious, this behavior could indicate reconnaissance efforts preceding a cyber attack. However, this detection alone does not confirm malicious intent since legitimate users may also execute these commands for valid purposes.

  ### Investigation Steps

  - **Check Process Creation Events**: Review process creation logs (e.g., audit logs located at `/var/log/audit/audit.log`) for Event ID 129 (executing command) matching patterns for `/grep` or `/egrep`. Verify the command line for target strings such as `nessusd`, `td-agent`, or `packetbeat`.

  - **Identify User Context**: Determine the user executing the command by filtering on the `user` field in the logs. Commands executed by non-administrative users during unusual hours may indicate potential malicious intent.

  - **Assess Command Context**: Analyze the context of the command invocation by checking parent process IDs (PPID) associated with the grep commands. Preferably, look for parent processes that are benign, such as standard system monitoring tools.

  - **Establish Expected Behavior**: Document and review legitimate usage scenarios where tools like Nessus or Fluentd are properly installed and managed. Changes in usage patterns or unexpected installations should be flagged for further investigation.

  - **Identify High-Confidence Indicators**: Look for repeated invocations of `grep` or `egrep` commands with suspicious keywords over a short period. Multiple occurrences may indicate an active reconnaissance operation by an adversary.

  ### Prioritization

  The alert severity is rated low due to the possibility of benign sources triggering the detection. While the behavior could indicate potential preparatory activity for an attack, the likelihood of misuse heavily depends on the environment. This type of discovery behavior is less commonly weaponized than direct exploit attempts.

  ### Blind Spots and Assumptions

  The detection may miss obfuscation techniques like command aliasing or the use of non-standard shells that could mask malicious activities. It requires proper logging configurations to capture all necessary process creation details. Legitimate administrative activities can also trigger the alert, particularly during routine security assessments or updates. Complementary detections such as monitoring for unexpected modifications to system binaries or known security utilities can help strengthen coverage against such reconnaissance attempts.

