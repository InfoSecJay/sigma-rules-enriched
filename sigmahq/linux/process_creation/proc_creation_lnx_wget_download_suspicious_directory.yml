logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/wget'
  selection_output:
  - CommandLine|re: '\s-O\s'       # We use regex to ensure a case sensitive argument detection
  - CommandLine|contains: '--output-document'
  selection_path:
    CommandLine|contains: '/tmp/'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of the `wget` command to download files into potentially suspicious directories, particularly the `/tmp/` directory, which is often exploited by attackers for temporary storage of malicious payloads. The likely threat scenario involves an attacker attempting to drop malware or exfiltrate data using this common command-line tool. By monitoring for these activities, security teams can anticipate potential Command and Control (C2) communications or data theft.

  The relevant MITRE ATT&CK techniques associated with this rule include **Command-Line Interface (T1059)** for using `wget` and **Data from Network Shared Drive (T1105)** for file downloads from suspicious locations. The primary data sources recommended for analysis include process creation logs, which record the execution of commands like `wget`, as well as command-line arguments that specify output locations.

  ### Investigation Steps
  - **Review Process Creation Logs:** Check logs for instances of `wget` executed, especially focusing on the command-line arguments that include `-O` or `--output-document` for output file naming.
  - **Inspect Download Locations:** Analyze the paths specified in command-line arguments to identify any downloaded files in `/tmp/` or other non-standard directories that could indicate malicious behavior.
  - **Validate Source of Downloads:** Investigate the URLs or servers from which files were downloaded to ascertain whether they are known domains associated with malicious activity or are otherwise suspicious.
  - **Correlate with User Actions:** Cross-reference the user account executing the `wget` command with other activity logs to determine if the account has shown any unusual behavior preceding or following the download event.

  ### Prioritization
  This alert is of medium severity due to the potential for significant impact, especially if malicious files are being downloaded. Such activities are often precursors to more extensive malware deployment or data exfiltration. Furthermore, the likelihood of encountering this behavior is moderate, especially in environments where users have access to command-line tools for file operations.

  ### Blind Spots and Assumptions
  There are several gaps in detection coverage to consider. This rule may not capture instances where attackers utilize other tools or methods to download files outside of `wget`, such as `curl`. Additionally, the detection logic assumes that logs for process creation and command-line arguments are being adequately captured and stored, which may not always be the case in every environment. Ensuring that logs from Linux systems are configured to capture command-line details will be essential for the efficacy of this detection rule.

