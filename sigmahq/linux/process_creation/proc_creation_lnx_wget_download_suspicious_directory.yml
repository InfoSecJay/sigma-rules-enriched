note: |
  ### Technical Context

  This Sigma rule detects the execution of the `wget` command to download files into potentially suspicious directories, specifically those under `/tmp/`. This behavior suggests an attacker may be attempting to retrieve additional payloads or malicious files as part of their command-and-control (C2) operations, often indicative of lateral movement or exfiltration attempts. The relevant MITRE ATT&CK technique is **Command-Line Interface** (T1059) and **Remote File Copy** (T1105).

  Primary telemetry sources include Linux process creation logs (such as `auditd`), specifically monitoring for command-line activity relevant to wget. If the observed action is malicious, it could lead to unauthorized access or exfiltration and compromise the integrity of the system. It is important to note that this detection does not confirm malicious intent on its own, as valid scenarios may exist for retrieving files in certain contexts.

  ### Investigation Steps

  - **Review process creation logs**: Look for Linux process creation events, specifically monitoring process creation events with `/usr/bin/wget` in Event IDs from `auditd` or Syslog. Example fields: `comm`, `pid`, `uid`, `euid`.

  - **Examine command line arguments**: For any identified `wget` executions, analyze the command line arguments. Pay special attention to flags such as `-O` or `--output-document`, which indicate a file is being saved with a specific name. This may reveal suspicious behavior, especially if coupled with path indicators leading to `/tmp/`.

  - **Verify download locations**: Assess the actual paths being used in the downloads. Legitimate use of `wget` typically targets known safe locations (e.g., user home directories) rather than ephemeral directories like `/tmp/` which are often used for transient file storage.

  - **Identify high-confidence malicious indicators**: Flag any cases where files downloaded via `wget` contain known hash values or patterns associated with malware, such as hashes from reported malware samples in VirusTotal. Use historical data to correlate against the hashes identified in the download.

  - **Check user context**: Review the user executing `wget`. If the command is run by a non-administrative user in an unusual directory or context, the likelihood of malicious activity increases.

  - **Investigate subsequent actions**: If files were downloaded into `/tmp/`, follow up with checks for subsequent executions, e.g., execution of these files, network calls made from the affected host, or even further file manipulations indicating exploitation.

  ### Prioritization

  This alert is considered medium severity as it involves potential malicious file downloads to a commonly used temporary directory. Given the ephemeral nature of `/tmp/`, malicious actors often exploit this behavior to evade detection, heightening the likelihood of abuse. Although not frequently weaponized as stand-alone action, it forms a part of a broader attack vector and is indicative of attempting to establish or maintain persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging around all `wget` usages, as benign cases (e.g., legitimate updates) might not trigger alerts. Ensure that appropriate audit logging is enabled to capture all process command lines for reliable detection. Additionally, user actions related to standard software updates may also generate similar alerts, which should be noted as legitimate. A companion detection for suspicious outbound network traffic (e.g., reviewing `iptables` or `netstat` logs) can help correlate and strengthen overall context around these logs.

