note: |
  ---

  ### Technical Context

  This rule detects the use of the `wget` command to download files into potentially suspicious directories, particularly `/tmp/`, which may indicate the presence of malware or the assembly of malicious tools by an adversary. The likely objective of the attacker could be to retrieve additional payloads or drop malicious files into a temporary location for subsequent execution, typically to avoid detection. This behavior maps to the MITRE ATT&CK technique “Remote File Copy” (T1105).

  The primary telemetry source for this detection is process creation logs from Linux systems, capturing specific command-line arguments associated with `wget`. If malicious, this activity could facilitate the deployment or execution of further compromise steps, heightening security risks. Importantly, this detection does NOT confirm the intent behind the file download; innocent users might also execute similar commands.

  ---

  ### Investigation Steps

  - **Review command-line arguments:** Validate events with `Process Creation` logs (Syslog with Event ID or equivalent) for commands containing `/wget`. Investigate argument patterns—look for `-O` or `--output-document`, indicating a specified output to a potentially insecure location.

  - **Check download path:** Examine the command-line for occurrences of `CommandLine` field containing `/tmp/`. If the output path deviates from expected (e.g., user home directories or application-specific paths), this raises the risk profile.

  - **Identify authorized users:** Cross-reference the initiating user account against a baseline of legitimate usage. Investigate permissions and roles to see if any unauthorized or atypical use of `wget` was executed by high-privilege accounts.

  - **Verify the existence of downloaded files:** Investigate file creation in the `/tmp/` directory. Look for recent files that have been downloaded alongside their hashes and timestamps. Files related to known malware hashes should escalate the incident.

  - **Analyze historical usage:** Review historical logs around the time of the alert (within a 24-48 hour window) for patterns of legitimate `wget` usage by trusted personnel or applications, identifying deviations from normal behavior.

  ---

  ### Prioritization

  The alert is of medium severity because the affected systems, if compromised, could facilitate further malicious activity. The use of `wget` in such contexts can indicate malicious intent, particularly given that unauthorized downloads are a commonly weaponized behavior. The potential impact increases if the command is executed by admin-level users or critical assets.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation techniques, where attackers could rename utilities or use script encoding to disguise malicious commands. It relies heavily on accurate command-line logging; therefore, ensure that process accounting (e.g., `auditd`) is properly configured. Legitimate automation scripts or software package installations might trigger this alert if they utilize `wget` without proper context. Companion detections, like file integrity monitoring for `.tmp` directories, can offer enhanced visibility into suspicious uploads or downloads.

