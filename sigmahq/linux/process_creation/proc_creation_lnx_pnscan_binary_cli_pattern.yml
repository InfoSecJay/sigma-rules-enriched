title: Pnscan Binary Data Transmission Activity
id: 97de11cd-4b67-4abf-9a8b-1020e670aa9e
status: test
description: |
  Detects command line patterns associated with the use of Pnscan for sending and receiving binary data across the network.
  This behavior has been identified in a Linux malware campaign targeting Docker, Apache Hadoop, Redis, and Confluence and was previously used by the threat actor known as TeamTNT
author: David Burkett (@signalblur)
date: 2024-04-16
references:
- https://www.cadosecurity.com/blog/spinning-yarn-a-new-linux-malware-campaign-targets-docker-apache-hadoop-redis-and-confluence
- https://intezer.com/wp-content/uploads/2021/09/TeamTNT-Cryptomining-Explosion.pdf
- https://regex101.com/r/RugQYK/1
- https://www.virustotal.com/gui/file/beddf70a7bab805f0c0b69ac0989db6755949f9f68525c08cb874988353f78a9/content
tags:
- attack.discovery
- attack.t1046
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|re: -(W|R)\s?(\s|"|')([0-9a-fA-F]{2}\s?){2,20}(\s|"|')
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the use of the Pnscan tool, which is associated with sending and receiving binary data over the network. Pnscan is commonly leveraged by attackers, notably the group TeamTNT, to exfiltrate data or communicate with compromised systems. The relevant MITRE ATT&CK tactic is **Discovery** (ID: T1046), indicating that the attacker may be scouting for additional systems or data to exploit.

  The primary telemetry source is Linux process creation logs, specifically looking for command line invocations that match the detection pattern for Pnscan. If malicious, the security impact could include data exfiltration or the establishment of a command-and-control channel. Importantly, this detection does not confirm that an attack is being executed; it only indicates that the Pnscan tool has been invoked, which could also occur due to legitimate use cases.

  ### Investigation Steps

  - **Review the command line arguments:** Check for instances of `-W` or `-R` in `cmdline` under the process creation logs (e.g., `/var/log/secure`). Look for the presence of hex-encoded payloads, which are common in malicious Pnscan usage.

  - **Inspect the process parentage:** Evaluate the parent process of the detected Pnscan invocation (use `pstree` or relevant logs). If the parent is a known benign tool or service (e.g., a legitimate Docker container or monitoring service), it may indicate legitimate use.

  - **Validate network activity:** Examine network logs for unusual outbound communications (e.g., using `tcpdump` or `iptables` logs). Look for non-standard ports or connections to known malicious IP addresses that were made immediately following Pnscan execution.

  - **Cross-reference with threat intelligence:** Investigate any related artifacts or sources in threat intelligence that may correlate with the detected command. Check for similar command line patterns observed in previous incidents involving TeamTNT.

  - **Identify system roles:** Consider the role of the affected asset. If a sensitive system (such as a Docker host or database server) was the source of the command, escalate the investigation due to increased risk.

  - **Check for file creation or modification:** Ensure no unexpected files were created or modified in the system's file structure as a result of the command (look in `/tmp`, `/var/tmp`, and any application-specific directories).

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact of data exfiltration or additional compromise. The high likelihood of malicious use by recognized threat actors makes it crucial for analytical follow-up, especially in environments using Docker or related services.

  ### Blind Spots and Assumptions

  Detection may be hampered by the use of process hiding techniques or by legitimate use of Pnscan in a controlled environment. Ensuring complete logging for all relevant process activities is essential. Additionally, legitimate system administrators could trigger this detection during network diagnostics for internal systems. A companion detection to consider would be monitoring outbound network connection logs for unusual destination patterns framing potential command-and-control communications.

