  ---

  ### Technical Context

  This Sigma rule detects the use of the Pnscan utility, which is commonly associated with transferring binary data over the network in Linux environments. Malicious actors, particularly the TeamTNT group, use this tool to establish unauthorized communications, potentially for exfiltration of sensitive data or to facilitate additional malicious payloads once they compromise systems like Docker, Apache Hadoop, Redis, and Confluence.

  The detection aligns with the MITRE ATT&CK tactic "Discovery" and technique "Network Sniffing" (T1046). The primary telemetry source for this detection is process creation logs from Linux systems, with key focus on command line arguments revealing Pnscan activity. If malicious, this behavior could lead to significant compromise of sensitive systems and potential data loss. Importantly, this detection does NOT confirm malicious intent on its own; legitimate instances of Pnscan usage may exist.

  ---

  ### Investigation Steps

  - **Review command line activity:** Check for Pnscan command invocations using process creation logs (e.g., `/var/log/syslog`, `/var/log/auth.log`) focusing on lines containing `-W` or `-R` options. For example, search for entries with command lines that match `-(W|R)\s?(\s|"|')([0-9a-fA-F]{2}\s?){2,20}(\s|"|')`.

  - **Validate host roles:** Identify whether the affected system is running critical services like Docker or Apache Hadoop. Validate against expected configurations and roles for these applications to assess risk.

  - **Identify high-confidence malicious indicators:** Look for known malicious patterns within the command line arguments. Any Pnscan command invocation that includes hex strings longer than 4 bytes after the `-W` or `-R` flag could indicate data manipulation or payload transfer and should be treated as suspicious.

  - **Check for legitimate uses:** Confirm if Pnscan was legitimately used for network diagnostics by querying the log history around the activity timestamp. Look for IT operations that may have executed commands with similar syntax to determine possible legitimate reasons.

  - **Investigate network traffic:** Assess network logs (e.g., NetFlow, Zeek logs) to identify anomalies correlating with the command execution time. Look for unrecognized IP addresses or excessive outbound connections using unusual ports.

  - **Review surrounding activities:** Check for related suspicious behaviors on the system leading up to the Pnscan invocation, such as unauthorized software installations or unexpected process activity (Event ID 1 from Sysmon for Linux).

  ---

  ### Prioritization

  This alert is of medium severity as it indicates potentially malicious command line activity on critical Linux systems. The likelihood of malicious abuse is high given the targeted technologies, and Pnscan is a known tool in the adversary's toolkit, often associated with reconnaissance and data exfiltration.

  ---

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers modify command lines or use alternative means to transfer data (e.g., using other network utilities). Successful detection relies on adequate logging configuration for all key Linux services; without capturing process creation data, detection capability diminishes. Additionally, legitimate activities such as systems administration tasks may inadvertently trigger this alert. A companion detection might involve monitoring for unusual outbound network connections that could correlate with Pnscan usage.

