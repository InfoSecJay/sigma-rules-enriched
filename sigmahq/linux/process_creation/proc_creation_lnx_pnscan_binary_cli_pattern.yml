level: medium
note: |
  ### Technical Context
  This detection rule identifies the use of Pnscan, a network scanning tool that can send and receive binary data, particularly through patterns detected in command line executions on Linux systems. Pnscan has been associated with malicious activities, particularly in recent malware campaigns that target services such as Docker, Apache Hadoop, Redis, and Confluence, as employed by the cybercriminal group known as TeamTNT. The likely attacker objective is to exploit vulnerabilities in these services or to facilitate further malicious actions like data exfiltration or lateral movement within the network.

  Relevant MITRE ATT&CK tactics include **Discovery (TA0007)**, as the use of Pnscan can indicate an enumeration of network services and configurations. The specific technique applicable here is **Network Service Scanning (T1046)**, which encompasses scanning for open ports and running services. This can be critical for attackers who seek to identify targets within a network to exploit.

  The primary data sources for this detection are **process creation logs** from Linux systems, which capture command line arguments associated with the execution of Pnscan and can provide insight into potentially malicious behavior.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the process creation logs for any instances of Pnscan being executed, focusing on the command line parameters used during execution.
  - **Check Network Traffic Logs**: Inspect the network traffic for unusual patterns or connections originating from systems where Pnscan was detected, especially targeting internal services like Docker or Hadoop.
  - **Evaluate System Integrity**: Confirm that the systems where Pnscan was detected are not part of an unauthorized compromise; look for indicators of compromise associated with TeamTNT.
  - **Correlate with Threat Intelligence**: Reference existing threat intelligence feeds to check if the IP addresses, domains, or patterns detected align with known malicious activity related to TeamTNT or similar threat actors.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of the threat actor's objectives, particularly if they successfully exploit targeted services. The likelihood of Pnscan usage indicating malicious intent in an enterprise environment raises the urgency for immediate investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by environments where process creation logs are not consistently captured or monitored, as well as potential obfuscation methods employed by attackers to disguise their command line inputs. The detection logic assumes that Pnscan will be invoked with recognizable command line patterns, which may not cover all possible variations used by attackers. Additionally, the execution of Pnscan may not always correlate directly with malicious intent; hence, further analysis is required to validate the context of its usage. Consistent logging from all Linux servers and services is required for accurate detection.

