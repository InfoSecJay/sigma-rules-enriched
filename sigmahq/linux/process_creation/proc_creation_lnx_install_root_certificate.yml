note: |
  ### Technical Context
  This rule detects the installation of new root certificates on Linux systems through processes that manage certificate authorities. Attackers may exploit this by deploying custom certificates to bypass security warnings when establishing connections to their controlled servers or command-and-control (C2) systems. By silently trusting malicious certificates, attackers can implement man-in-the-middle (MitM) attacks or facilitate data exfiltration without alerting users or security measures.

  In the context of the MITRE ATT&CK framework, this behavior is linked to the **Defense Evasion** tactic (TA0005) and specifically the **Install Root Certificate** technique (T1553.004). Attackers leveraging this technique may aim to manipulate trust relationships or control the secure communication channels within a target environment.

  The primary data sources for detecting these activities include process creation logs, which capture command invocations, arguments issued, and the contexts in which these processes run. Monitoring these logs is crucial as they often reveal attempts to manage certificate authorities, especially from unexpected processes or users.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for any instances of the processes `/update-ca-certificates` or `/update-ca-trust`. Look for unusual execution patterns, such as unexpected users or automation outside of routine maintenance.

  - **Correlate with User Activities**: Check preceding and subsequent user activities in the system related to the identified processes. Unusual privileges or account behaviors by administrative users may indicate a compromise or misuse.

  - **Verify Certificate Trust Store Changes**: Investigate modifications made to the certificate trust store. Look for newly installed certificates that weren't part of a legitimate update. Cross-reference newly added certificates with trusted Certificate Authorities.

  - **Assess Network Traffic**: Monitor outbound traffic for SSL/TLS connections to suspicious IP addresses or domains that may suggest communication with C2 servers. Anomalies in network patterns could correlate with the installation of new root certificates.

  ### Prioritization
  This alert holds a low severity level within an enterprise environment. While the presence of unauthorized root certificates can indicate potential risks, it often overlaps with legitimate administrative tasks. However, prioritization should increase if accompanied by suspicious process activities or unusual user behaviors.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if process creation logs are not enabled or if logging levels are insufficient to capture all relevant data. Additionally, there is an assumption that system administration practices are consistent and that any legitimate certificate installations are documented. Without appropriate logging configurations, such as enabling detailed process logging or monitoring all changes to the certificate trust store, the effectiveness of this detection could be significantly diminished.

