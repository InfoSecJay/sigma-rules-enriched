  ---

  ### Technical Context

  This rule detects the installation of new certificates on Linux systems, specifically through the processes related to certificate updates, such as `/update-ca-certificates` or `/update-ca-trust`. This behavior can be indicative of an attacker attempting to bypass security warnings when connecting to controlled servers or command-and-control (C2) infrastructure. The relevant MITRE ATT&CK tactic is **Defense Evasion (T1562)**, specifically the technique for **Install Root Certificates (T1553.004)**.

  The primary telemetry source is the Linux process creation logs that capture execution of commands related to certificate updates. If malicious, this behavior can aid attackers in establishing persistence or in facilitating data exfiltration without detection. It is important to note that this detection does NOT confirm malicious intent on its own, as it may occur due to legitimate administrative activities.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check Linux process logs (e.g., `/var/log/auth.log`, or system journal) for Event IDs indicating process execution of `/update-ca-certificates` or `/update-ca-trust`. Look for unusual execution times or from non-administrative accounts.

  - **Validate recent modifications to certificate files:** Inspect files in `/etc/ssl/certs/` and `/etc/pki/` for recent changes. Look at the timestamps and the accounts that made these changes to distinguish between benign administrative tasks and potential malicious activity.

  - **Cross-reference user activity logs:** Analyze user login logs (e.g., using `last` command or `/var/log/secure`) to identify if the users executing certificate updates have logged in from unusual IP addresses or during odd hours.

  - **Examine network connection logs:** Utilize firewall logs or network monitoring tools to identify any suspicious outbound connections made shortly after the certificate update, especially to known malicious IPs or URLs.

  - **Identify proof of legitimate activity:** Determine if there are scheduled tasks (e.g., `cron` jobs) configured for certificate management that match the times of the failed or successful updates. This can indicate typical administrative behavior versus an anomaly.

  - **Check for known C2 endpoint queries:** Search for any command history (e.g., `~/.bash_history`) or system logs indicating that the updated certificate was subsequently used to establish connections to suspicious domains.

  ---

  ### Prioritization

  The alert is of **low** severity because the affected system may be undergoing normal administrative activities related to certificate management. However, the likelihood of malicious abuse is notable, especially if associated with known indicators of compromise or anomalous user behaviors, as the installation of fraudulent root certificates is a tactic frequently exploited by adversaries.

  ---

  ### Blind Spots and Assumptions

  Limitations in detection can arise from legitimate administrative activities that may trigger this alert, especially in managed environments where certificates are regularly updated. Reliable detection requires comprehensive logging from process execution and user activity; any logging gaps could obscure malicious actions. A companion detection on outbound SSL certificate validation might strengthen overall coverage against this evasion technique.

