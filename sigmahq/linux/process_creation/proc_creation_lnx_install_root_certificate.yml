note: |
  ### Technical Context

  This rule detects the installation of new root certificates on a Linux system, specifically through processes like `/update-ca-certificates` or `/update-ca-trust`. Attackers often pursue the goal of establishing trusted communication channels to their controlled web servers or command-and-control (C2) servers, thereby enabling data exfiltration and bypassing security warnings. This aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1553.004 (Certificate Installation).

  The primary telemetry sources include process creation logs from Linux, identifying activity around certificate management tools. If malicious, the security impact is significant, as unauthorized certificates can undermine encryption integrity and trust in connections. Importantly, this detection alone does not confirm malicious intent; legitimate administration tasks may also trigger the rule.

  ### Investigation Steps

  - **Examine process creation logs:** Check for Linux process creation logs with a focus on Event ID for new certificates, specifically targeting fields like `process_name` and `command_line` to find evidence of certificate installation activities.

  - **Identify associated processes:** Cross-reference the detected processes with other recent logs in `/var/log/auth.log` to see if there were administrative activities related to system maintenance or legitimate certificate installations.

  - **Review recent certificate changes:** Investigate the directory where trusted certificates are stored (usually `/etc/ssl/certs/`) for newly added files. Benign indicators include usual updates from a known trusted source, while suspicious entries may be files tied to unauthorized organizations.

  - **Check for execution parameters:** Analyze the command-line arguments passed to the certificate installation commands for any unusual options or references to known malicious C2 domains, which would indicate high-confidence malicious activity.

  - **Validate asset criticality:** Ensure this behavior is evaluated on critical infrastructure systems, where unauthorized certificates could lead to significant compromise. Investigate if the host normally engages in certificate management or if this activity is anomalous.

  ### Prioritization

  The alert is considered low severity primarily due to the potential for false positives from legitimate administrative actions in Linux environments. However, the likelihood of malicious abuse exists, especially on critical assets where attackers typically deploy custom root certificates to facilitate covert communication. While certificate installations are less common as part of standard attack techniques, they can be a precursor to more nefarious activities.

  ### Blind Spots and Assumptions

  Evasion techniques include attackers employing obfuscation tactics, such as using benign-sounding tools or certificates from established organizations. Reliable detection requires comprehensive logging configurations on Linux systems, including the capture of all process creation events. Legitimate tasks, such as system updates initiated by administrators, may trigger the alert. Companion detections, such as monitoring for unusual outbound network connections, can enhance context and bolster investigative efficacy.

