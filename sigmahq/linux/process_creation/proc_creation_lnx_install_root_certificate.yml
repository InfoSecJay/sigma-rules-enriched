note: |
  ### Technical Context

  This Sigma rule detects the installation of new root certificates on Linux systems, which can be leveraged by attackers to prevent SSL warnings when connecting to malicious command and control (C2) servers. The likely objective of the adversary is to establish trusted communication channels for data exfiltration or to facilitate further malicious activities. This detection maps to the MITRE ATT&CK technique T1553.004 (Install Root Certificate).

  The primary telemetry source includes Linux process creation logs that capture command-line method calls. Such behavior poses a significant security risk, as unauthorized root certificates can enable SSL interception and man-in-the-middle attacks. It is important to note that this detection does NOT inherently confirm malicious intent. It can also be triggered by legitimate administrative actions, particularly during certificate updates.

  ### Investigation Steps

  - **Verify the process execution context**: Check for the command-line calls containing `/update-ca-certificates` or `/update-ca-trust` in Linux log files (e.g., `/var/log/syslog`, `/var/log/secure`). Look for unexpected processes initiated by non-privileged users as indicators of potential compromise.

  - **Identify the user and time of execution**: Examine the logs for Event IDs 1 (Sysmon) to check the user account that executed the process. Benign indicators include administrative users executing this during routine maintenance; however, unauthorized users should be considered suspicious.

  - **Review the installed certificates**: Locate and inspect the certificate store (e.g., `/etc/ssl/certs`) to identify any newly installed root certificates. High-confidence malicious indicators would include certificates issued by unknown or non-trusted certificate authorities.

  - **Cross-reference with known vulnerabilities or tools**: Search for any known associations (via sources like CISA alerts or security blogs) linking the detected activity to documented vulnerabilities or attack tools specific to the observed certificate installation.

  - **Monitor for concurrent abnormal activity**: Look for other suspicious behaviors within the same time frame, such as unusual outbound connections or process creations via logs (e.g., `auditd` logs) to identify coordinated malicious activity.

  - **Consider the role of the impacted host**: Assess whether the system where the certificate was installed hosts critical applications or functions that would be susceptible to man-in-the-middle attacks, enhancing the urgency of the investigation.

  ### Prioritization

  The severity of this alert is low to moderate, depending on the context of the affected system. However, if it occurs on critical infrastructure or servers handling sensitive data, the risk increases significantly. Although such activities are less common compared to direct exploitations, they remain a vector often utilized during targeted attacks.

  ### Blind Spots and Assumptions

  This detection may miss sophisticated evasion techniques where attackers use legitimate tools or processes to install certificates stealthily. Further, relying solely on process creation logs can overlook cases where attackers use alternative methods for certificate installation. Legitimate administrative activities, such as updates or unauthorized script execution, can trigger this alert. Companion detections, such as unusual outbound traffic logs or anomalies within SSL/TLS session setups, can strengthen coverage against potential threats.

