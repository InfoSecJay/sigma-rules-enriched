note: |
  ### Technical Context

  This rule detects the installation of new root certificates through specific command invocations related to updating certificate authorities on a Linux system. Attackers may exploit this behavior to plant malicious certificates, enabling them to intercept SSL traffic without triggering security warnings, particularly when communicating with command-and-control servers (C2s).

  The relevant MITRE ATT&CK tactic is Defense Evasion with the technique T1553.004: Certificate Authorities. Primary telemetry sources include Linux process creation logs, specifically monitoring the execution of commands like `/update-ca-certificates` or `/update-ca-trust`. If malicious, such activity can lead to severe security impacts, including data exfiltration or unauthorized access to secure communications. However, this detection does NOT confirm that malicious activity is occurring on its own; legitimate administrative tasks may also trigger this alert.

  ### Investigation Steps

  - **Identify the process execution context:** Review process creation logs for Event ID related to command execution. Check for associated user accounts (e.g., root) and timestamps to identify any unusual patterns.

  - **Verify the certificate installation:** Check the system's certificate store (e.g., `/etc/ssl/certs/`) for newly added certificates or changes to existing ones, focusing on certificates that were added in close temporal proximity to the detected command execution.

  - **Assess the environment:** Validate whether the command was executed under normal administrative practices. Confirm that the host is within an environment where updating certificates is expected; for instance, development vs. production systems may have different baseline behaviors.

  - **Look for malicious indicators:** Search for suspicious command parameters or user activity closely linked to unauthorized certificate installations. Identify any abnormal user behavior, such as commands run with `sudo` by non-privileged accounts.

  - **Examine related log entries:** Review logs from security monitoring tools like Syslog or system audit logs for additional activities related to network connections established post-certificate installation, especially to non-business IP addresses.

  ### Prioritization

  The alert is of low severity given the potential for legitimate administrative actions triggering it. However, the potential for malicious use, especially in environments handling sensitive data, necessitates investigation. This behavior can be weaponized by actors aiming to engage in man-in-the-middle attacks, making it essential to monitor.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques, such as attackers using less common commands for certificate installation that may not be captured by this rule. Administrators may frequently execute certificate updates as part of routine tasks, leading to potential false positives. Required logs include comprehensive process creation logs and audit logs. A companion detection to consider is monitoring outbound network connections for new IPs following a certificate installation, which could indicate an attempt to leverage the newly trusted certificates for C2 communication.

