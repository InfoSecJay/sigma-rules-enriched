- attack.t1548
- attack.t1554
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/setcap'
    CommandLine|contains: 'cap_setuid'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `setcap` utility to assign the `setuid` capability (`cap_setuid`) to a binary file on Linux systems. Such capability allows non-privileged users to change their user ID (UID) in ways typically restricted, including potentially allowing a binary to gain root-level access when executed. The likely objective of an attacker using this technique is to create a backdoor or maintain persistence within the system without raising immediate suspicion.

  The relevant MITRE ATT&CK Tactics are **Privilege Escalation** (TA0004) and **Defense Evasion** (TA0005), with techniques T1548 (Abuse Elevation Control Mechanism) and T1554 (Compromise Account). This detection primarily relies on process creation logs, specifically focusing on the command execution pattern associated with `/setcap` and `cap_setuid`. If malicious, this action can lead to unauthorized privilege escalation and system compromise. Importantly, this detection does NOT confirm a compromise on its own; it merely highlights a potential security misconfiguration or malicious intent in setting capabilities.

  ### Investigation Steps

  - **Check process creation logs:** Review Linux audit logs or Syslog entries for Event ID related to process creation, specifically focusing on entries where the `Image` ends with `/setcap` and the `CommandLine` contains `cap_setuid`. Look for abnormal execution patterns not consistent with normal operations.

  - **Validate the binary targeted:** Identify the binary that had its `setuid` capability set. Use `getcap <binary_path>` to examine capabilities on the binary; a legitimate binary typically should not have `cap_setuid` set unless specifically intended for controlled administrative functions.

  - **Correlate with known binaries:** Cross-reference the modified binary with a list of critical or high-value binaries in your environment. Identify if the `setcap` was applied to a non-standard binary that could indicate malicious usage.

  - **Monitor system changes:** Check for other changes made around the same time as the `setcap` execution. Review logs for unusual activities such as package installations, file modifications, or creation of cron jobs that may indicate wider compromise.

  - **Review user activity:** Look for the user that executed `setcap` and their recent activity. Analyze if this user account has a history of legitimate administrative tasks or if it has been newly created or altered in suspicious ways.

  - **Identify legitimate use cases:** Determine if `setcap` usage is common within your organization’s workflow for specific applications. If not, escalate the investigation as potential malicious activity.

  ### Prioritization

  The alert severity is classified as low due to the specific usage of `setcap`, which may have legitimate administrative purposes. However, its potential for abuse in a privileged escalation context is non-negligible, especially if coupled with other indicators of compromise. While not commonly weaponized on its own, should it occur alongside other suspicious behaviors, it warrants immediate review.

  ### Blind Spots and Assumptions

  Detection might miss legitimate workflows where `setcap` usage is necessary for application functionality, potentially leading to false positives. Reliable monitoring relies on thorough auditing configurations and adequate log retention for process creation events. Additionally, if the system is poorly monitored or configurations allow for unmonitored `setcap` usage, it may promote evasion opportunities for adversaries. Companion detections could include monitoring for unusual user activity or privilege escalation events (e.g., abnormal `sudo` usage or unexpected system modifications) to enhance security visibility.

