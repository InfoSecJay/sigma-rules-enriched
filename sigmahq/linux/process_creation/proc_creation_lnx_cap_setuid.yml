- attack.t1554
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/setcap'
    CommandLine|contains: 'cap_setuid'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the use of the `setcap` utility to set the `setuid` capability on a binary file in a Linux environment. The likely attacker objective is to grant an unprivileged process the ability to manipulate user IDs, potentially allowing execution as the root user (UID 0) in the future. This activity aligns with MITRE ATT&CK techniques, particularly **Privilege Escalation** (T1548) and **Persistence** (T1554). The primary telemetry source is the Linux process creation logs capturing command-line arguments and image names. If malicious, this could enable further exploitation by allowing an attacker to execute commands with elevated privileges. Importantly, this detection alone does not confirm malicious intent; legitimate administrative actions may also trigger the alert.

  ### Investigation Steps

  - **Check command execution history:** Review bash history (`/var/log/bash_history`) for users who executed `setcap` commands recently. Legitimate usage typically originates from system administrators performing necessary privilege adjustments.

  - **Validate recent binaries with modified capabilities:** Use the command `getcap -r /path/to/check` to identify binaries with the `cap_setuid` capability set. Confirm that these binaries should require such capabilities; unexpected binaries having this capability is a strong indicator of potential compromise.

  - **Analyze process creation events:** Look for Linux process creation logs (Syslog or custom logs) for Event ID related to process creation (usually found in `/var/log/syslog`). Cross-reference the `setcap` execution and review parent processes to see if they originate from expected administrator contexts or unusual sources.

  - **Monitor for subsequent malicious activities:** Investigate ongoing background processes linked to the binaries modified by `setcap`. High-confident indicators include additional privilege escalation attempts or abnormal network traffic from these processes.

  - **Assess permissions on sensitive binaries:** Review access permissions for the modified binaries using `ls -l /path/to/binary`. Verify that permissions and ownership are consistent with policy; irregular permissions may confirm exploitation.

  ### Prioritization

  This alert should be treated with a low to moderate severity in most enterprise contexts. The impact is higher if the affected binary is critical to system functions or applications. The likelihood of malicious abuse is noteworthy, as this technique is commonly used for privilege escalation and persistence in compromised environments.

  ### Blind Spots and Assumptions

  Detection may be limited if logs have not been configured to capture command-line arguments fully or if the `setcap` utility is not monitored consistently. Legitimate activities that might trigger this alert include routine updates or security hardening tasks by administrators. A related detection that strengthens coverage includes monitoring for unauthorized changes to `sudo` permissions or unexpected `setuid` binary modifications.

