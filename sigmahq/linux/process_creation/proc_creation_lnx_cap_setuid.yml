title: Linux Setuid Capability Set on a Binary via Setcap Utility
id: ed447910-bc30-4575-a598-3a2e49516a7a
status: experimental
description: |
  Detects the use of the 'setcap' utility to set the 'setuid' capability (cap_setuid) on a binary file.
  This capability allows a non privileged process to make arbitrary manipulations of user IDs (UIDs), including setting its current UID to a value that would otherwise be restricted (i.e. UID 0, the root user).
  This behavior can be used by adversaries to backdoor a binary in order to escalate privileges again in the future if needed.
references:
- https://man7.org/linux/man-pages/man8/setcap.8.html
- https://dfir.ch/posts/linux_capabilities/
- https://juggernaut-sec.com/capabilities/#cap_setuid
author: Luc Génaux
date: 2026-01-24
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1548
- attack.t1554
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/setcap'
    CommandLine|contains: 'cap_setuid'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This rule detects the use of the `setcap` utility to assign the `setuid` capability to a binary file on Linux systems. By leveraging `cap_setuid`, a non-privileged process can manipulate user IDs, potentially allowing attackers to escalate privileges or create backdoors for later exploitation. Attackers may target binaries that provide access to sensitive functions, enabling covert privilege escalation or maintaining persistence without triggering traditional access controls.

  The threat scenario revolves around an attacker who has already gained an initial foothold in the Linux system. Their objective is to enhance their control over the system by gaining elevated privileges, thereby facilitating further malicious actions such as data exfiltration or lateral movement. Relevant MITRE ATT&CK tactics include:

  - **Privilege Escalation (T1068)**: Using `setcap` to elevate privileges.
  - **Defense Evasion (T1218)**: Avoiding detection by modifying binaries rather than creating new ones.
  - **Persistence (T1548)**: Establishing prolonged access through modified file capabilities.

  Primary data sources for detection include process creation logs and command-line invocation records that detail the execution of the `setcap` command.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs to identify instances where the `setcap` command has been executed, focusing on the associated binary and the command-line arguments used.
  - **Analyze Binary Changes**: Inspect the affected binaries for any changes in capabilities, particularly those now possessing the `cap_setuid` capability, to assess potential backdoors.
  - **Correlate with User Activity**: Look at user account behavior and access patterns leading to the use of `setcap`, which may indicate unusual or unauthorized activities.
  - **Inspect System Integrity**: Use file integrity monitoring or comparison tools to review binaries that have been modified, ensuring that no unauthorized changes have been made apart from legitimate updates.

  ### Prioritization
  The alert is classified with low severity due to its occurrence being relatively uncommon and its potential use cases being situational. However, the likelihood of malicious intent exists if combined with suspicious user behavior or other indicators of compromise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if event logging is not enabled for process creations or if command-line arguments are not fully captured. The rule assumes that the legitimate use of `setcap` within the environment is minimal; however, some system configurations may require its use. Organizations should ensure that logging for `setcap` executions and capability changes on binaries is properly configured to facilitate effective monitoring.

