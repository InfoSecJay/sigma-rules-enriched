detection:
  selection:
    ParentImage|endswith: '/java'
    CommandLine|contains:
    - '/bin/sh'
    - 'bash'
    - 'dash'
    - 'ksh'
    - 'zsh'
    - 'csh'
    - 'fish'
    - 'curl'
    - 'wget'
    - 'python'
  condition: selection
