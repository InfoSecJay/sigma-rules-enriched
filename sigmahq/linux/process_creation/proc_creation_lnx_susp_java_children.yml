level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where a Java process spawns additional child processes that may indicate malicious activity, such as executing shell commands or downloading files. These behaviors typically suggest an attacker attempting to leverage Java applications to execute scripts or retrieve further payloads. The relevant MITRE ATT&CK tactic is Execution, specifically under Technique T1059 (Command and Scripting Interpreter).

  The primary telemetry source for this detection consists of process creation logs from Linux systems. Log types include `/var/log/syslog` or specific audit logs that capture `fork` and `exec` events pertaining to process initiation. If malicious, these actions could lead to system compromise or information theft. This detection does NOT confirm an active compromise on its own, as legitimate Java applications may invoke similar behaviors.

  ### Investigation Steps

  - **Review process creation logs:** Check `/var/log/syslog` for Event ID 100 and look for parent processes that contain the `java` keyword, paired with child processes executing command-line utilities like `/bin/sh`, `curl`, or `python`.

  - **Identify high-confidence malicious indicators:** Look for child processes with command lines that include `curl`, `wget`, or scripts in non-default locations that attempt to download files unexpectedly. Focus on entries with unusual paths or arguments.

  - **Validate against known benign behavior:** Standard Java applications may spawn child processes for legitimate purposes, such as application plugins or network calls. Cross-reference the process paths and arguments against known good lists to distinguish between normal and suspicious activity.

  - **Correlate network activity:** Use network logs (e.g., Zeek or firewall logs) to identify connections originating from the Java process’s child commands that attempt to reach suspicious or blacklisted IP addresses.

  - **Verify asset criticality:** Check the role of the affected system. Higher criticality assets (such as servers hosting sensitive applications) require more immediate attention compared to non-critical user workstations.

  - **Checkpoint for temporary files:** Search for temporary file creation related to the child processes in `/tmp` or `/var/tmp` directories, ensuring to flag any unexpected file types or content in these locations.

  ### Prioritization

  This alert deserves high priority due to the potential exploitation of Java applications for executing arbitrary commands, which poses a significant security risk to enterprise systems. The likelihood of malicious abuse is elevated, as command injection through Java processes has been weaponized in various attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging configurations, particularly if process creation logs are not adequately enabled on all Linux hosts. Legitimate activities that might trigger this alert include software updates or internal scripts designed for automation. A related detection worth monitoring is unusual outbound network connections (e.g., T1071 - Application Layer Protocol), which can provide additional context on suspicious child processes executing network activities.

