title: Suspicious Java Children Processes
id: d292e0af-9a18-420c-9525-ec0ac3936892
status: test
description: Detects java process spawning suspicious children
references:
- https://www.tecmint.com/different-types-of-linux-shells/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-03
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|endswith: '/java'
    CommandLine|contains:
    - '/bin/sh'
    - 'bash'
    - 'dash'
    - 'ksh'
    - 'zsh'
    - 'csh'
    - 'fish'
    - 'curl'
    - 'wget'
    - 'python'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious child processes spawned by Java applications on Linux systems. By focusing on parent processes that are Java-related, it seeks to uncover potentially malicious activities where an attacker may leverage a Java process to invoke a shell or execute other command-line utilities. Such activities could indicate attempts to gain command line access, execute scripts, or download malicious payloads.

  Attackers often utilize Java processes as a foothold due to their widespread deployment, especially in enterprise environments running Java applications. The objective is typically aimed at establishing persistence or escalating privileges by using the legitimate Java process to circumvent security controls. Relevant MITRE ATT&CK tactics and techniques include **Execution (TA0002)** and **User Execution (T1203)**, where the attacker exploits local or remote code execution vulnerabilities to execute arbitrary commands.

  The primary data sources for detecting this behavior include **process creation events**, which record instances of process executions alongside their command-line arguments, providing critical context for analysis.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine recent process creation logs to identify instances where Java has spawned processes containing shell commands or other potentially suspicious utilities.
  - **Investigate Command Line Arguments:** Analyze the command line arguments for the suspicious child processes. Look for anomalies such as atypical flags or the inclusion of script interpreters like `python` or download commands (`curl`, `wget`).
  - **Correlation with Recent Deployments:** Check if the detected Java processes correlate with any recent application deployments or updates, as legitimate changes may account for unusual behavior.
  - **Evaluate Environmental Context:** Consider the operational context by assessing whether any newly installed software or patching activities could explain the observed behavior, in order to differentiate between potential threats and benign activities.

  ### Prioritization
  This alert should be treated with high severity, as the execution of unexpected child processes from Java applications could indicate unauthorized access or compromise, potentially leading to further vulnerabilities within the enterprise environment.

  ### Blind Spots and Assumptions
  One main gap in detection coverage is the possibility of legitimate applications using Java to spawn shell processes for valid functionality, which could lead to false positives. The detection logic is also predicated on the assumption that suspicious shells will indeed be spawned under Java processes and that logging for process creation is enabled and properly configured. If system logging levels are insufficient, these events may not be captured, leaving a blind spot for potential threats.

