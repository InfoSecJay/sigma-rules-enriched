title: Syslog Clearing or Removal Via System Utilities
id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
status: test
description: |
  Detects specific commands commonly used to remove or empty the syslog. Which is a technique often used by attacker as a method to hide their tracks
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
- https://www.virustotal.com/gui/file/54d60fd58d7fa3475fa123985bfc1594df26da25c1f5fbc7dfdba15876dd8ac5/behavior
author: Max Altgelt (Nextron Systems), Roberto Rodriguez (Cyb3rWard0g), OTR 
  (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2025-10-15
tags:
- attack.defense-evasion
- attack.t1070.002
logsource:
  product: linux
  category: process_creation
detection:
  selection_file:
    CommandLine|contains: '/var/log/syslog'
  selection_command_rm:
        # Examples:
        #   rm -f /var/log/syslog
    Image|endswith: '/rm'
    CommandLine|contains:
    - ' -r '
    - ' -f '
    - ' -rf '
    - '/var/log/syslog'         # We use this to avoid re-writing a separate selection
  selection_command_unlink:
        # Examples:
        #   unlink /var/log/syslog
    Image|endswith: '/unlink'
  selection_command_mv:
        # Examples:
        #   mv /var/log/syslog
    Image|endswith: '/mv'
  selection_command_truncate:
        # Examples:
        #   truncate --size 0 /var/log/syslog
    Image|endswith: '/truncate'
    CommandLine|contains|all:
    - '0 '
    - '/var/log/syslog'         # We use this to avoid re-writing a separate selection
    CommandLine|contains:
    - '-s '
    - '-c '
    - '--size'
  selection_command_ln:
        # Examples:
        #   ln -sfn /dev/null /var/log/syslog
    Image|endswith: '/ln'
    CommandLine|contains|all:
    - '/dev/null '
    - '/var/log/syslog'         # We use this to avoid re-writing a separate selection
    CommandLine|contains:
    - '-sf '
    - '-sfn '
    - '-sfT '
  selection_command_cp:
        # Examples:
        #   cp /dev/null /var/log/syslog
    Image|endswith: '/cp'
    CommandLine|contains: '/dev/null'
  selection_command_shred:
        # Examples:
        #   shred -u /var/log/syslog
    Image|endswith: '/shred'
    CommandLine|contains: '-u '
  selection_unique_other:
    CommandLine|contains:
    - ' > /var/log/syslog'
    - ' >/var/log/syslog'
    - ' >| /var/log/syslog'          # redirection empties w spacing, noclobber
    - ': > /var/log/syslog'
    - ':> /var/log/syslog'
    - ':>/var/log/syslog'
    - '>|/var/log/syslog'
  selection_unique_journalctl:
    CommandLine|contains:
    - 'journalctl --vacuum'
    - 'journalctl --rotate'         # archives current journal files and creates new empty ones
  condition: (selection_file and 1 of selection_command_*) or 1 of 
    selection_unique_*
falsepositives:
- Log rotation.
- Maintenance.
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious activities that attempt to clear or remove system logs, particularly the syslog file in Linux environments. Adversaries may engage in this behavior to cover their tracks after executing malicious actions, aligning with their goal of obfuscating evidence of compromise. The relevant MITRE ATT&CK technique for this activity is T1070.002: Indicator Removal on Host - File Deletion. Primary telemetry sources include Linux process creation logs, specifically Event IDs that register command execution and system behaviors. If the activities flagged by this detection are malicious, it could indicate a severe compromise. However, this detection does NOT confirm malicious intent on its own without additional context such as previous suspicious activity or system misconfigurations.

  ### Investigation Steps

  - **Review process creation logs**: Check Linux process creation logs (e.g., audit logs or `proc` filesystem) for relevant entries indicating suspicious command executions, particularly involving commands like `rm`, `truncate`, or `journalctl`. Look for Event ID 242 which captures command executions.

  - **Check command parameters**: Investigate the command lines in the logs for suspicious parameters (e.g., `-f`, `--size`, and `/dev/null`) to identify specifically crafted commands that target `/var/log/syslog`. Legitimate activities may show regular log rotation configurations without high-risk flags.

  - **Correlate with user activities**: Validate the user executing the commands against expected roles for that host. Administrative users performing expected maintenance activities might trigger these alerts, while non-administrative accounts executing such commands should raise immediate suspicion.

  - **Analyze log retention configuration**: Inspect log retention settings to ascertain if legitimate log rotation or cleaning tasks are in place. Compare timestamps of the alerts with configured maintenance windows to distinguish benign activity from potential malicious attempts.

  - **Look for additional log types**: Ensure that systemd journal logs are also scrutinized for the presence of commands such as `journalctl --vacuum` and `journalctl --rotate` that might be used to manipulate the log rotation process, indicating potential circumvention of normal logging mechanisms.

  ### Prioritization

  This alert is high severity because it indicates possible active measures taken by an attacker to remove traces of their activities, especially on critical systems. The likelihood of malicious abuse is elevated since log clearing is a common tactic used by adversaries to evade detection after exploitation, making it a significant indicator of compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions like scheduled log rotation or maintenance scripts that can generate similar command patterns. To ensure reliable detection, log sources such as syslog, audit logs, and systemd journal logs should be properly configured and retained for analysis. Additionally, benign activities from privileged users could trigger the alert and may need contextual understanding, while related detections around process execution anomalies would enhance threat coverage and awareness.

