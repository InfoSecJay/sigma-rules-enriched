title: Syslog Clearing or Removal Via System Utilities
id: 3fcc9b35-39e4-44c0-a2ad-9e82b6902b31
status: test
description: |
  Detects specific commands commonly used to remove or empty the syslog. Which is a technique often used by attacker as a method to hide their tracks
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
- https://www.virustotal.com/gui/file/54d60fd58d7fa3475fa123985bfc1594df26da25c1f5fbc7dfdba15876dd8ac5/behavior
author: Max Altgelt (Nextron Systems), Roberto Rodriguez (Cyb3rWard0g), OTR 
  (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2025-10-15
tags:
- attack.defense-impairment
- attack.t1685.006
logsource:
  product: linux
  category: process_creation
detection:
  selection_file:
    CommandLine|contains: '/var/log/syslog'
  selection_command_rm:
        # Examples:
        #   rm -f /var/log/syslog
    Image|endswith: '/rm'
    CommandLine|contains:
    - ' -r '
    - ' -f '
    - ' -rf '
    - '/var/log/syslog'         # We use this to avoid re-writing a separate selection
  selection_command_unlink:
        # Examples:
        #   unlink /var/log/syslog
    Image|endswith: '/unlink'
  selection_command_mv:
        # Examples:
        #   mv /var/log/syslog
    Image|endswith: '/mv'
  selection_command_truncate:
        # Examples:
        #   truncate --size 0 /var/log/syslog
    Image|endswith: '/truncate'
    CommandLine|contains|all:
    - '0 '
    - '/var/log/syslog'         # We use this to avoid re-writing a separate selection
    CommandLine|contains:
    - '-s '
    - '-c '
    - '--size'
  selection_command_ln:
        # Examples:
        #   ln -sfn /dev/null /var/log/syslog
    Image|endswith: '/ln'
    CommandLine|contains|all:
    - '/dev/null '
    - '/var/log/syslog'         # We use this to avoid re-writing a separate selection
    CommandLine|contains:
    - '-sf '
    - '-sfn '
    - '-sfT '
  selection_command_cp:
        # Examples:
        #   cp /dev/null /var/log/syslog
    Image|endswith: '/cp'
    CommandLine|contains: '/dev/null'
  selection_command_shred:
        # Examples:
        #   shred -u /var/log/syslog
    Image|endswith: '/shred'
    CommandLine|contains: '-u '
  selection_unique_other:
    CommandLine|contains:
    - ' > /var/log/syslog'
    - ' >/var/log/syslog'
    - ' >| /var/log/syslog'          # redirection empties w spacing, noclobber
    - ': > /var/log/syslog'
    - ':> /var/log/syslog'
    - ':>/var/log/syslog'
    - '>|/var/log/syslog'
  selection_unique_journalctl:
    CommandLine|contains:
    - 'journalctl --vacuum'
    - 'journalctl --rotate'         # archives current journal files and creates new empty ones
  condition: (selection_file and 1 of selection_command_*) or 1 of 
    selection_unique_*
falsepositives:
- Log rotation.
- Maintenance.
level: high
note: |
  ### Technical Context

  This Sigma rule detects behaviors related to clearing or removing syslog files using various commands in Linux. The likely attacker objective is to erase evidence of unauthorized activity or facilitate further malicious actions without detection. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1070.002). The primary telemetry source is Linux process creation logs, primarily focused on commands executed related to the syslog. If malicious, this activity can severely compromise system integrity and forensics. This detection does NOT confirm that malicious activity has occurred; legitimate log rotation or maintenance tasks can trigger false positives.

  ### Investigation Steps

  - **Review command structures used:** Examine Process Creation logs (e.g., Syslog Event IDs for Linux) for commands containing `rm`, `truncate`, or `journalctl --vacuum` targeting `/var/log/syslog`. Malicious use often involves combinations of `-f`, `-r`, or redirection operators (`>`).

  - **Identify high-confidence malicious indicators:** Check for command executions that utilize `unlink`, `mv`, or `ln` targeting the syslog file. For example, execution of `ln -sfn /dev/null /var/log/syslog` indicates potential malicious intent of hiding logs.

  - **Correlate with user behavior:** Validate the context of the command. Legitimate rotation or log cleanup typically occurs during scheduled maintenance and involves standard logging utilities like `logrotate`, not direct manipulation of syslog logs.

  - **Check for additional telemetry:** Look for signs of abnormal log behavior in the `/var/log/` directory. This includes review of file timestamps (examine `ls -l /var/log` output) for recent edits or deletions that align with suspicious command usage to determine if logs were cleared.

  - **Validate against critical assets:** Determine if the affected system role is classified as critical (e.g., a server housing sensitive data). Higher impact from such actions warrants escalation to appropriate security personnel.

  - **Investigate historical context:** For ongoing incidents, analyze historical logs leading up to the command execution to identify prior suspicious activities or anomalies, focusing on user accounts executing these commands.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact on system integrity and the likelihood of malicious abuse. The ability to manipulate log files is commonly weaponized in adversary operations to evade detection and maintain persistence.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate system maintenance activities that could trigger this alert, such as scheduled log rotations. The SOC must ensure comprehensive logging from all applicable systems to maintain reliable detection. Additionally, tools like `logrotate` may clear logs in a benign manner, thus prompting the need for further correlation. A related detection that strengthens coverage is any KQL/SPL rule that flags anomalous authentication events related to the processes in question.

