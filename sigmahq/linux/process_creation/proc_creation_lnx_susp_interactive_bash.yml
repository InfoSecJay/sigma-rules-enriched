title: Interactive Bash Suspicious Children
id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
status: test
description: Detects suspicious interactive bash as a parent to rather uncommon 
  child processes
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2022-03-14
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.004
- attack.t1036
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    ParentCommandLine: 'bash -i'
  anomaly1:
    CommandLine|contains:
    - '-c import '
    - 'base64'
    - 'pty.spawn'
  anomaly2:
    Image|endswith:
    - 'whoami'
    - 'iptables'
    - '/ncat'
    - '/nc'
    - '/netcat'
  condition: selection and 1 of anomaly*
falsepositives:
- Legitimate software that uses these patterns
level: medium
note: |
  ### Technical Context

  This rule detects the creation of uncommon child processes under an interactive `bash` shell (ParentCommandLine: 'bash -i'), which can be indicative of potential malicious activity, such as command and control (C2) communications or lateral movement. The attacker's likely objective is to execute unexpected commands or manipulate system configurations stealthily, leveraging the interactive shell environment to evade detection. This aligns with the MITRE ATT&CK tactics of Execution (T1203) and Defense Evasion (T1036).

  Primary telemetry sources include Linux process creation logs that capture command line arguments and executed binaries. If malicious, this behavior can lead to unauthorized command execution or system compromise. Importantly, this detection does NOT confirm that a compromise has occurred; it merely highlights potentially suspicious activity that warrants further investigation.

  ### Investigation Steps

  - **Check parent process details:** Review process logs for Event IDs related to process creation (Linux logs) to identify whether 'bash -i' is indeed the parent process. Look for anomalous child processes like `whoami`, `iptables`, or `nc` that might indicate exploitation attempts.

  - **Validate command history:** Examine the shell history (typically found in `~/.bash_history` or captured via logging tools) to determine if the command execution aligns with regular user activity. Unexpected or unusual commands executed shortly after the detection may indicate malicious intent.

  - **Assess legitimate usage:** Identify expected processes that commonly use `bash -i` for legitimate purposes (e.g., interactive scripts run by administrators). If observed processes do not match this pattern or involve non-typical binaries, it could indicate malicious activity.

  - **Correlate with other logs:** Cross-reference findings with threat intelligence feeds and incident response tools to check if known malicious command patterns or indicators of compromise are present.

  - **Review user behavior:** Analyze user account activity and compare it against baseline behavior metrics considering the role of the user account and any associated risks. Unusual activity from accounts that typically do not use interactive `bash` could be concerning.

  ### Prioritization

  This alert should be treated as medium severity due to its potential impact on critical systems and the relatively high likelihood of malicious activity exploiting these patterns. While the presence of an interactive bash can indicate benign administrative actions, it is also a common method used by attackers to execute further commands, increasing its importance in triage processes.

  ### Blind Spots and Assumptions

  Detection may be circumvented by adversaries using obfuscated command execution or alternative shells that are not captured by this rule. Reliable detection requires adequate logging configurations on all Linux servers to ensure process creation telemetry is captured completely. Additionally, legitimate software may trigger this alert, such as system administration tools or scripts that utilize `bash -i`. A complementary detection to consider includes monitoring for unusual network connections initiated by these child processes, enhancing overall visibility into potential exploitation activities.

