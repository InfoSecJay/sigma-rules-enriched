title: Interactive Bash Suspicious Children
id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
status: test
description: Detects suspicious interactive bash as a parent to rather uncommon 
  child processes
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2022-03-14
tags:
- attack.execution
- attack.stealth
- attack.t1059.004
- attack.t1036
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    ParentCommandLine: 'bash -i'
  anomaly1:
    CommandLine|contains:
    - '-c import '
    - 'base64'
    - 'pty.spawn'
  anomaly2:
    Image|endswith:
    - 'whoami'
    - 'iptables'
    - '/ncat'
    - '/nc'
    - '/netcat'
  condition: selection and 1 of anomaly*
falsepositives:
- Legitimate software that uses these patterns
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where an interactive Bash shell (`bash -i`) serves as a parent process to potentially malicious child processes that are not commonly executed in standard environments, such as `whoami`, `iptables`, or various netcat binaries. The likely objective of an attacker using this method is to perform system reconnaissance or establish remote access through command execution, indicative of techniques in the MITRE ATT&CK framework, specifically "Command and Control" (T1071) and "Command-Line Interface" (T1059.004).

  The primary telemetry source for this alert is from Linux process creation logs, capturing details on command execution and parent-child relationships of processes. If the alert is confirmed maliciously, the security impact may involve unauthorized access, data exfiltration, or environment compromise. Notably, this detection does NOT definitively confirm malicious intent without additional context, as legitimate software may exhibit similar behavior.

  ### Investigation Steps

  - **Verify parent process legitimacy**: Check for legitimate applications that may spawn an interactive Bash session. Look for common Bash usage patterns in `/var/log/auth.log` (e.g., legitimate SSH access) to compare against Event IDs and user activity.

  - **Investigate child processes**: Identify any child processes spawned by the interactive Bash instance by examining `/proc/[PID]/task/[TASK_ID]/children`. Malicious child processes may exhibit unusual command flags (e.g., `-c import` or base64 encoding) not typical for routine administrative tasks.

  - **Correlate with network activity**: Review outbound network connections in `netstat` or use `ss` to identify any connections initiated by suspicious child processes (like netcat). Inspect connection attempts to unfamiliar IP addresses or domains for anomalies.

  - **Analyze execution context**: Evaluate the command and control effectiveness by reviewing user session details in `/var/log/wtmp` or `last`. This may reveal unauthorized account usage or unusual login behaviors.

  - **Check for artifacts of persistence**: Search for newly created scripts or binaries in `/usr/local/bin/`, `/tmp`, or user home directories. Confirm file creation times and paths to validate against known legitimate applications.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant compromise on critical systems. The likelihood of malicious abuse is moderate, as attackers prefer stealthy methods for avoiding detection, especially using interactive Bash for command execution is increasingly common in attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by environmental noise from legitimate applications that utilize similar command patterns, potentially leading to false positives. Ensure comprehensive logging configurations on Linux systems to capture all relevant process creation events. Additionally, common benign activities that may trigger these alerts include system administration tasks that involve network configurations or user verifications. A related detection that enhances coverage would include monitoring for unusual Bash scripts being created or executed, which could help in identifying combined attack vectors.

