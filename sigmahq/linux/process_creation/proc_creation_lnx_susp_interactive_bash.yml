title: Interactive Bash Suspicious Children
id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
status: test
description: Detects suspicious interactive bash as a parent to rather uncommon child
  processes
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2022-03-14
tags:
- attack.execution
- attack.defense-evasion
- attack.t1059.004
- attack.t1036
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    ParentCommandLine: 'bash -i'
  anomaly1:
    CommandLine|contains:
    - '-c import '
    - 'base64'
    - 'pty.spawn'
  anomaly2:
    Image|endswith:
    - 'whoami'
    - 'iptables'
    - '/ncat'
    - '/nc'
    - '/netcat'
  condition: selection and 1 of anomaly*
falsepositives:
- Legitimate software that uses these patterns
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where an interactive Bash shell (`bash -i`) serves as a parent process to uncommon child processes that might indicate unusual or potentially malicious activity. Attackers might employ interactive Bash sessions to further their objectives such as establishing persistence, executing commands in an obfuscated manner, or exfiltrating data. The detection primarily concerns scenarios where a legitimate user or attacker attempts to run suspicious commands within an interactive shell, potentially signaling an ongoing exploitation or lateral movement within the environment.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (TA0002)**: The use of a command shell to execute various commands.
  - **Defense Evasion (TA0005)**: Strategies aimed at avoiding detection by security tools during execution.
  - Techniques such as **Command and Scripting Interpreter (T1059.004)** and **Masquerading (T1036)** are particularly applicable; these describe ways attackers execute scripts and disguise their activities.

  The primary data sources for this detection are process creation events on Linux systems, which will capture the command line information and hierarchy of processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for process creation events related to `bash -i` as a parent process. Look for timestamps correlating with reported incidents and abnormal command execution.

  - **Analyze Suspicious Command Lines**: Focus on any child processes that use command line arguments indicating potential exfiltration or lateral movement (e.g., Base64 encoding, network tools like Netcat).

  - **Check User Activity**: Verify whether the user context running the interactive Bash session is legitimate. Investigate the user’s historical behavior for further anomalies.

  - **Cross-Reference with Security Tools**: Utilize EDR and SIEM tools to correlate the detected Bash parent with other security alerts, such as unusual login attempts or excessive privilege assignments.

  ### Prioritization
  This alert should be prioritized as medium severity due to the potential for significant impact on server integrity and data security. The combination of an interactive shell and suspicious child processes raises concerns about unauthorized access or malicious activities, which could lead to data breaches if left unchecked.

  ### Blind Spots and Assumptions
  This rule may not cover scenarios where legitimate software uses interactive Bash or the identified children processes for benign reasons, which could lead to false positives. The detection assumes that process creation logs are enabled and adequately capturing command line parameters. Additionally, if attackers employ different means to execute their commands or disguise their process tree, these activities might remain undetected, especially in environments where process information is not centrally logged or analyzed.

