note: |
  ### Technical Context

  This Sigma rule detects the execution of the `auditctl` command with the `-D` parameter, which is utilized to delete all audit rules and watches on Linux systems. This behavior is indicative of an attacker attempting to disable auditing to evade detection mechanisms, thereby covering their tracks. The relevant MITRE ATT&CK tactic is Defense Evasion, specifically technique ID T1562.012.

  The primary telemetry sources for this detection include process creation logs on Linux systems, specifically looking for the command execution of `auditctl`. If malicious, the impact can be severe as it usually leads to a significant reduction in visibility of other potential malicious activities on the affected system. Importantly, this detection does not confirm malicious intent on its own; legitimate administrative activities may also trigger this alert.

  ### Investigation Steps

  - **Review executed command details**: Check Syslog or relevant process logs (e.g., `/var/log/syslog`) for Event IDs associated with `auditctl` execution. Verify that the command line includes `-D` and evaluate the context of its execution.

  - **Determine actor legitimacy**: If `auditctl -D` was executed, identify the user account (check `/var/log/auth.log`). If executed by a known administrator during a documented maintenance window, this may indicate benign activity.

  - **Check for preceding audit modifications**: Review the logs for previous commands that altered audit rules (e.g., `auditctl -a`, `auditctl -A`). If found, confirm if there was a pattern consistent with legitimate administration.

  - **Identify system role impact**: Assess the role of the impacted system. If it is an endpoint or server critical for logging operations, the removal of audit rules poses an increased security risk.

  - **Correlate with other anomalies**: Look for other related activities around the same timestamp, such as unusual user logins or processes. If it correlates with suspicious network activity, investigate further.

  ### Prioritization

  This alert should be prioritized as high severity given the critical role of auditing in monitoring system activities and the likelihood that this behavior indicates malicious activity, particularly in environments where auditing is crucial to compliance and security. The technique of removing audit rules is commonly weaponized by attackers to reduce detection capabilities.

  ### Blind Spots and Assumptions

  Detection limitations may occur due to lack of logging configurations that capture all necessary process executions or command-line arguments. It should be noted that legitimate administrative actions, such as troubleshooting or reconfiguration, can also generate this alert. A companion detection to strengthen coverage could include alerts on modifications to `/etc/audit/audit.rules` or changes to audit daemon configurations.

