logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/auditctl'
    CommandLine|re: '-D'
  condition: selection
falsepositives:
- An administrator troubleshooting. Investigate all attempts.
level: high
note: |
  ### Technical Context
  This rule detects the execution of the `auditctl` command on Linux systems with the `-D` parameter, which is used to delete all configured audit rules. The command effectively disables the auditing capabilities of the system, potentially allowing attackers to conceal their activities without the overhead of monitoring, thus attempting to cover their tracks after a compromise or while performing malicious actions.

  Attackers aim to remove audit rules to hinder detection mechanisms that would normally log unauthorized access or suspicious actions. This behavior is indicative of a broader tactic used in the MITRE ATT&CK framework, specifically under **Defense Evasion** (T1562.012), which includes techniques where adversaries mask their presence to avoid detection.

  The primary data sources that will provide critical evidence for this detection include **process creation events**, particularly those that track command line arguments and executable paths in Linux environments. Additionally, reviewing historical audit logs, if still present, can provide context for any suspicious changes made.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of the `auditctl` command execution, specifically looking for entries that show the `-D` parameter was used. Check for the user account associated with this action.
  - **Correlate with User Activity**: Cross-reference the execution of the `auditctl -D` command with user activity logs to determine if this action aligns with normal administrative behavior or if it appears anomalous.
  - **Examine System Audit Logs**: If available, review historical audit logs to evaluate what rules were present prior to deletion and any changes made shortly before the `auditctl -D` command was executed.
  - **Assess Security Posture**: Determine the overall security posturing and existing controls on the affected Linux systems. Validate the necessity of the deleted audit rules and investigate the implications for overall system monitoring.

  ### Prioritization
  The alert is classified as high severity due to its significant impact on the enterprise's visibility and ability to detect future malicious activities. The ability to disable audit rules opens the door for unchecked exploitation, making it critical to respond promptly.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage depending on administrative privileges and system configurations. If legitimate users are allowed to delete audit rules without robust logging, that creates a potential blind spot. Assumptions are made that systems are configured with audit logging enabled and that recent actions can be reviewed accordingly. Additionally, historical audit logs may be purged or overwritten, making investigations more challenging unless sufficient log retention policies are established. Required logs, such as detailed process creation logs containing command line arguments, must be actively collected for this alert to be effective.

