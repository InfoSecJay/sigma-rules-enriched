note: |
  ### Technical Context

  This rule detects the use of the 'crontab' utility with the '-r' option, which is used to remove a user's current crontab. This behavior indicates a potential attempt to eliminate traces of other scheduled tasks that may be competing for system resources, commonly associated with cryptocurrency mining activities. The likely attacker objective is to seize control of system resources for malicious operations, specifically in competitive miner scenarios.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1203), and the technique is **Masquerading** (ID: T1036). The primary telemetry source is Linux process creation logs, specifically events pertaining to command executions. If this behavior is malicious, it can lead to significant security impacts, such as unauthorized resource hijacking. Importantly, this detection does NOT confirm that the activity is malicious without additional context, as legitimate system administration could also utilize this command.

  ### Investigation Steps

  - **Confirm process execution:** Review process creation logs for the 'crontab' utility using Syslog or Audit logs. Look for Event IDs or relevant fields indicating a command line of `crontab -r`. Note the user associated; administrative users may indicate benign behavior.

  - **Identify user context:** Analyze which user executed the command by examining the `User` or `UID` fields in the logs. Unexpected or non-standard accounts executing this command (e.g., service accounts) can indicate malicious activity.

  - **Check for altered crontab entries:** Investigate any recent changes to the crontab entries. Use the command `crontab -l` for the affected user to ensure there are no unexpected or unauthorized scheduled tasks. A lack of entries immediately following the removal can suggest malicious intent.

  - **Review related process activities:** Look for additional suspicious activities that occurred in proximity to the crontab removal actions, such as high CPU usage or processes associated with cryptocurrency mining (e.g., mining daemon processes). Review relevant logs for resource consumption anomalies.

  - **Correlate with known indicators:** Check any threat intelligence sources or internal repositories for known hashes or command patterns typically associated with cryptomining malware. Evaluate the command line context for common miner flags or configurations.

  ### Prioritization

  This alert's severity is medium due to the potential impact on compromised systems that could be exploited for unauthorized resource use. While removing crontab entries could indicate malicious behavior, the likelihood of abuse depends on user context and surrounding activities. This particular behavior can be weaponized in specific adversarial contexts, such as cryptocurrency mining.

  ### Blind Spots and Assumptions

  Common evasion techniques include legitimate admins performing crontab changes for maintenance, which may inadvertently trigger this alert. A reliance on process creation logs could miss other indicators if log sources are not properly configured. Activities such as scheduled maintenance tasks (e.g., cleanup jobs) may also result in legitimate use of 'crontab -r'. A related detection to consider is unusual execution patterns from common mining software or unexpected high processor utilization reported in system monitoring solutions.

