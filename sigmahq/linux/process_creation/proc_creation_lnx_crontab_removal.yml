note: |
  ### Technical Context
  This detection rule monitors for the usage of the `crontab` utility with the `-r` flag on Linux systems, which is a command used to remove the current user's crontab entries. The detection of this activity is particularly relevant in threat scenarios involving cryptocurrency mining, where attackers may employ this tactic to eliminate competing miners' scheduled jobs. By using this command, an attacker not only ensures that their mining processes run uninterrupted but also obscures their activities, maintaining a stealthy presence on the compromised system.

  The main MITRE ATT&CK tactics involved with this activity fall under **Defense Evasion** (TA0005), specifically the technique **T1203: Exploitation for Client Execution** where malicious actors exploit legitimate tools to achieve their objectives without raising alarms. Additionally, the presence of such activity may indicate a broader threat environment where unauthorized mining activities are prevalent, posing a significant risk to resource integrity and performance.

  The primary data source for this detection is process creation logs on Linux systems, specifically looking for entries that indicate the execution of the `crontab` command with the `-r` argument.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate process creation logs to confirm the execution of the `crontab -r` command, noting the user context and timestamp for potential anomalies.
  - **Correlate User Activity:** Check user behavior leading up to the crontab removal to identify any suspicious account activity or unauthorized access patterns.
  - **Examine Scheduled Tasks:** Analyze the crontab entries before and after the event to understand the context of what was removed and consult existing documentation for expected tasks.
  - **Assess System Resource Utilization:** Look for indications of cryptocurrency mining activity or other CPU-intensive processes that may relate to unauthorized usage of system resources.

  ### Prioritization
  This alert is considered of medium severity due to its indication of potential malicious activity in the form of resource hijacking through cryptocurrency mining. While the likelihood of occurrence may vary, such actions can significantly impact system performance and stability, warranting timely investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to the logging of all crontab modifications, as certain legitimate administrative actions could be misclassified. The detection logic assumes that the `-r` flag is used without additional benign flags and does not account for potential obfuscation techniques that attackers might employ. Adequate logging of process execution and user activity must be enabled for effective detection and investigation, especially in environments where crontab usage is common for legitimate tasks.

