note: |
  ### Technical Context

  This Sigma rule detects the execution of the `crontab` utility with a command line argument indicating the removal of the current crontab (`-r`). This behavior is often associated with attackers attempting to eliminate scheduled tasks set by legitimate users, allowing them to hijack system resources for activities such as cryptocurrency mining. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0060) and the technique is Indicator Removal on Host (T1070).

  The primary telemetry sources for this detection are Linux process creation logs, specifically tracking the invocation of `crontab` and its command line parameters. If malicious, this could enable attackers to operate without interference from other scheduled tasks, leading to unauthorized use of system resources. Importantly, this detection does NOT, on its own, confirm malicious intent as legitimate users may also need to modify or clear their crontab.

  ### Investigation Steps

  - **Check process creation logs for crontab activity:** Review Linux process creation logs (e.g., `/var/log/auth.log` or systemd logs) for entries with a command line containing `crontab -r`. Confirm the user ID associated with this action.

  - **Validate historical crontab entries:** Investigate the previous state of the crontab (`crontab -l`) before the deletion to assess whether legitimate scheduled tasks existed. Look for recent modifications or deletions.

  - **Identify the user executing the command:** Cross-reference the user ID with your organization’s directory to determine if the user typically has a valid reason to modify crontab entries. Legitimate users may include system administrators managing server environments.

  - **Examine logs for other suspicious activities:** Look for additional related behaviors, such as unexpected process execution or network connections, to corroborate if this action is part of a broader attack sequence. Verify process IDs (PIDs) in logs.

  - **Analyze system performance logs:** Review system performance logs for spikes in CPU or resource utilization around the time of the crontab removal, which may indicate unauthorized cryptocurrency mining activities.

  - **Check for known indicators of compromise (IOCs):** Search for IOCs associated with cryptocurrency mining on the affected host or system, such as unusual network traffic or the presence of known mining software.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on system resources if an attacker has successfully hijacked a host for cryptocurrency mining. The likelihood of malicious abuse is moderate, as this technique can be commonly exploited by adversaries seeking to eliminate competition on compromised systems. However, crontab removal can also happen during legitimate maintenance.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of monitoring for crontab executions on systems where logging is insufficient or improperly configured. Legitimate activities, such as scheduled server maintenance, could trigger this alert if users remove or modify crontab tasks. A related detection is monitoring for the execution of mining processes or uncommon network connections to identify actual resource abuse post-crontab removal.

