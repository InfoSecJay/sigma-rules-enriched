title: Container Residence Discovery Via Proc Virtual FS
id: 746c86fb-ccda-4816-8997-01386263acc4
status: test
description: Detects potential container discovery via listing of certain kernel features
  in the "/proc" virtual filesystem
references:
- https://blog.skyplabs.net/posts/container-detection/
- https://stackoverflow.com/questions/20010199/how-to-determine-if-a-process-runs-inside-lxc-docker
tags:
- attack.discovery
- attack.t1082
author: Seth Hanford
date: 2023-08-23
logsource:
  category: process_creation
  product: linux
detection:
  selection_tools:
    Image|endswith:
    - 'awk'
    - '/cat'
    - 'grep'
    - '/head'
    - '/less'
    - '/more'
    - '/nl'
    - '/tail'
  selection_procfs_kthreadd:    # outside containers, PID 2 == kthreadd
    CommandLine|contains: '/proc/2/'
  selection_procfs_target:
    CommandLine|contains: '/proc/'
    CommandLine|endswith:
    - '/cgroup'          # cgroups end in ':/' outside containers
    - '/sched'           # PID mismatch when run in containers
  condition: selection_tools and 1 of selection_procfs_*
falsepositives:
- Legitimate system administrator usage of these commands
- Some container tools or deployments may use these techniques natively to determine
  how they proceed with execution, and will need to be filtered
level: low
note: |
  ### Technical Context
  This detection rule identifies potential container enumeration activities by monitoring process creation events that involve specific command-line tools accessing the `/proc` filesystem in a Linux environment. Attackers may use these commands, such as `awk`, `grep`, or `head`, to probe the kernel features associated with containerized environments, allowing them to discern whether they are operating inside a container and potentially gather information about the host system.

  The primary threat scenario involves an attacker who has gained access to a system and is attempting to determine if it is running within a container. By doing so, they can assess the security measures in place and tailor their attacks accordingly. This behavior is aligned with the MITRE ATT&CK tactics of Discovery, particularly with the technique T1082: System Information Discovery, as it involves gathering system-level insights.

  Data sources that will provide the most relevant evidence include process creation logs from the operating system's auditing facilities. These logs capture the execution of command-line tools and their arguments, which are critical for identifying container discovery attempts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and examine logs related to process creation to determine if the flagged commands (e.g., `awk`, `grep`) were executed, and note the command-line arguments used to assess context.

  - **Analyze `/proc` Access Patterns**: Inspect access patterns to the `/proc` filesystem, particularly commands targeting `/proc/2/`, `/proc/cgroup`, and `/proc/sched`, to confirm any enumeration behavior related to container discovery.

  - **Correlate with Container Orchestration Logs**: Check logs from container orchestration platforms (like Docker or Kubernetes) to identify any legitimate administrative activities that might coincide with the detected tools being used, reducing false positives.

  - **Evaluate Historical Context**: Review the historical execution of similar commands on the host to determine if there is a baseline activity level for those processes, helping to identify anomalies more accurately.

  ### Prioritization
  This alert is tagged with a low severity due to its nature of detecting potential reconnaissance activity, which may not directly indicate a compromise. However, the likelihood of this activity leading to escalated privileges or data exfiltration in containerized environments necessitates monitoring and further investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage where legitimate system administrators also use these commands as part of routine tasks, which can lead to false positives. The detection logic makes the assumption that the presence of specific command-line tools accessing `/proc` in particular ways is indicative of malicious activity; however, there could be other benign use cases. Additionally, for the alert to function effectively, appropriate logging configurations must be enabled to capture detailed process creation events within the Linux operating environment.

