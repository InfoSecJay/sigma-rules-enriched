title: Container Residence Discovery Via Proc Virtual FS
id: 746c86fb-ccda-4816-8997-01386263acc4
status: test
description: Detects potential container discovery via listing of certain kernel
  features in the "/proc" virtual filesystem
references:
- https://blog.skyplabs.net/posts/container-detection/
- https://stackoverflow.com/questions/20010199/how-to-determine-if-a-process-runs-inside-lxc-docker
tags:
- attack.discovery
- attack.t1082
author: Seth Hanford
date: 2023-08-23
logsource:
  category: process_creation
  product: linux
detection:
  selection_tools:
    Image|endswith:
    - 'awk'
    - '/cat'
    - 'grep'
    - '/head'
    - '/less'
    - '/more'
    - '/nl'
    - '/tail'
  selection_procfs_kthreadd:    # outside containers, PID 2 == kthreadd
    CommandLine|contains: '/proc/2/'
  selection_procfs_target:
    CommandLine|contains: '/proc/'
    CommandLine|endswith:
    - '/cgroup'          # cgroups end in ':/' outside containers
    - '/sched'           # PID mismatch when run in containers
  condition: selection_tools and 1 of selection_procfs_*
falsepositives:
- Legitimate system administrator usage of these commands
- Some container tools or deployments may use these techniques natively to 
  determine how they proceed with execution, and will need to be filtered
level: low
note: |
  ### Technical Context

  This detection rule identifies attempts at container discovery through the listing of specific features in the Linux `/proc` virtual filesystem using common command-line tools (e.g., `awk`, `grep`). The likely objective of an attacker is to identify the operating environment and running containers, which could enable further exploitation or lateral movement within the system. This activity corresponds to the MITRE ATT&CK tactic of Discovery, specifically Technique T1082 (System Information Discovery).

  The primary telemetry sources required are process creation events from Linux systems, specifically monitoring command lines for tools that query `/proc/` paths. If malicious, this behavior could aid attackers in recognizing a target environment for subsequent exploitation. Importantly, this detection does NOT confirm that an actual compromise has occurred; it simply indicates the execution of commands typically associated with container inspection.

  ### Investigation Steps

  - **Examine process creation logs**: Look for Security Linux Event Logs (Syslog) capturing command lines with keywords from `/proc/` or specific tools (`awk`, `grep`). Focus on Syslog fields such as `command` or `args` to identify potential misuse.

  - **Identify user and process context**: Cross-reference the user executing the command against the system’s user roles. Legitimate administrative users may execute these commands, but anomalous activity by non-privileged accounts warrants further scrutiny.

  - **Check for command patterns**: Look for multiple invocations of `/proc/sched` or `/proc/cgroup` shortly after each other within the same process context (Event ID representation) to spot automated discovery attempts.

  - **Correlate with network logs**: Monitor for corresponding outbound connections to unfamiliar IP addresses that may follow container discovery patterns, as attackers may probe for services after identifying running containers.

  - **Validate the presence of containers**: Confirm legitimate container management activities, such as running expected container lifecycle commands (like `docker ps` or `kubectl get pods`), which may involve querying process information.

  ### Prioritization

  This alert is assigned a low severity due to the ambiguity surrounding the observed behavior. While it can indicate potential reconnaissance activities within a containerized environment, such actions are not always indicative of malicious intent and may frequently be performed by system administrators or automated tools in a normal operational context.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate container tooling, as these tools might inherently utilize commands that trigger this alert, leading to false positives. It’s crucial to ensure logs for process creation are comprehensive and configured correctly. Also, legitimate queries conducted by authorized users who manage containers might trigger similar alerts. A companion detection strategy can involve monitoring for unauthorized access attempts to the container management API, enhancing visibility into potentially malicious activities following discovered container paths.

