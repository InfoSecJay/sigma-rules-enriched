title: Container Residence Discovery Via Proc Virtual FS
id: 746c86fb-ccda-4816-8997-01386263acc4
status: test
description: Detects potential container discovery via listing of certain kernel features
  in the "/proc" virtual filesystem
references:
- https://blog.skyplabs.net/posts/container-detection/
- https://stackoverflow.com/questions/20010199/how-to-determine-if-a-process-runs-inside-lxc-docker
tags:
- attack.discovery
- attack.t1082
author: Seth Hanford
date: 2023-08-23
logsource:
  category: process_creation
  product: linux
detection:
  selection_tools:
    Image|endswith:
    - 'awk'
    - '/cat'
    - 'grep'
    - '/head'
    - '/less'
    - '/more'
    - '/nl'
    - '/tail'
  selection_procfs_kthreadd:    # outside containers, PID 2 == kthreadd
    CommandLine|contains: '/proc/2/'
  selection_procfs_target:
    CommandLine|contains: '/proc/'
    CommandLine|endswith:
    - '/cgroup'          # cgroups end in ':/' outside containers
    - '/sched'           # PID mismatch when run in containers
  condition: selection_tools and 1 of selection_procfs_*
falsepositives:
- Legitimate system administrator usage of these commands
- Some container tools or deployments may use these techniques natively to determine
  how they proceed with execution, and will need to be filtered
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects potential container discovery activities through the listing of specific kernel features in the "/proc" virtual filesystem. Attackers may aim to enumerate the host environment or gather information about other containers, facilitating further lateral movement or privilege escalation. The relevant MITRE ATT&CK tactic is **Discovery** (T1082) specifically targeting system information discovery. The primary telemetry sources include process creation logs on Linux, specifically the logs capturing command-line arguments and invoked processes. If the detected behavior is malicious, it may indicate an attacker gathering intelligence on running containers and their environments. Importantly, this detection does NOT confirm that malicious activity has occurred without further context.

  ---

  ### Investigation Steps

  - **Review command history:** Check for recent command execution involving tools like `cat`, `grep`, `awk`, etc., by reviewing `/var/log/auth.log` or equivalent authentication logs. Legitimate usage may include system monitoring or troubleshooting tasks.

  - **Inspect process details:** Examine process creation events (Linux syscalls or entries in `/proc/[PID]/cmdline`) for any instances where the command-line arguments include `/proc/[any PID]/`. Focus on unexpected usage on production systems.

  - **Check for container tools:** Identify whether legitimate container management tools (such as Docker or Kubernetes) were used around the time of the alert. Investigate permissions and roles associated with these containers for unusual access patterns.

  - **Look for anomalies in PID structures:** Analyze processes with PID 2 to see if there are instances where they are involved in discovering container information without expected normal behavior. Use process listing commands (`ps` or `top`) to confirm expected parent-child relationships.

  - **Cross-reference external logs:** Validate against firewall or network logs to ensure no external scanning or discovery attempts correlate with this behavior. Look for unusual outbound connections that may indicate command-and-control activity.

  ---

  ### Prioritization

  This alert is classified as low severity due to the lower likelihood of direct exploitation aimed at the affected system. However, the behavior is notable as it may facilitate later phases of an attack, and the tools used for discovery are commonly weaponized by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may miss adversaries using redirected or obfuscated command line inputs to avoid triggering this alert. The effectiveness of this detection relies heavily on the proper configuration of process logs on Linux systems. Legitimate requests from system administrators for container information may cause false positives, particularly in environments where tools for container orchestration heavily utilize process discovery. A companion detection rule focusing on anomalous container creation events could enhance overall monitoring effectiveness in this context.

