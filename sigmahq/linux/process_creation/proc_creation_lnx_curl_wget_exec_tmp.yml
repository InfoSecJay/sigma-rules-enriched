title: Suspicious Download and Execute Pattern via Curl/Wget
id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
status: experimental
description: |
  Detects suspicious use of command-line tools such as curl or wget to download remote
  content - particularly scripts - into temporary directories (e.g., /dev/shm, /tmp), followed by
  immediate execution, indicating potential malicious activity. This pattern is commonly used
  by malicious scripts, stagers, or downloaders in fileless or multi-stage Linux attacks.
references:
- https://gtfobins.github.io/gtfobins/wget/
- https://gtfobins.github.io/gtfobins/curl/
author: Aayush Gupta
date: 2025-06-17
tags:
- attack.execution
- attack.t1059.004
- attack.t1203
logsource:
  category: process_creation
  product: linux
detection:
  selection_downloader:
    CommandLine|contains:
    - '/curl'
    - '/wget'
  selection_tmp:
    CommandLine|contains:
    - '/tmp/'
    - '/dev/shm/'
  selection_executor:
    CommandLine|contains: 'sh -c'
  condition: all of selection_*
falsepositives:
- System update scripts using temporary files
- Installer scripts or automated provisioning tools
level: high
note: |
  ### Technical Context
  This rule is designed to detect suspicious activities involving the command-line tools `curl` and `wget` on Linux environments. These tools are commonly employed by attackers to download malicious scripts or binaries from remote locations, particularly into temporary directories such as `/tmp` or `/dev/shm`. The immediate execution of the downloaded content, often using shell commands, suggests a potential exploitation scenario. Attackers leverage this pattern to facilitate fileless attacks, where malicious activities are conducted without writing files to disk in a traditional manner.

  In a typical threat scenario, an adversary may utilize `curl` or `wget` to fetch a script that will execute commands to further compromise the environment, grab sensitive data, or create backdoors for persistent access. This behavior is characterized within the MITRE ATT&CK framework under the tactics of **Execution** (TA0002) and techniques such as **Command-Line Interface** (T1059.004) and **Exploitation of Remote Services** (T1203).

  Primary data sources for detecting this behavior include process creation logs, particularly those capturing command-line arguments, as they provide insights into the execution context of downloaded scripts.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs to identify any instances of `curl` or `wget` commands accessing `/tmp` or `/dev/shm`, paying special attention to command-line arguments used in these executions.

  - **Analyze Command History**: Investigate shell command history files (e.g., `.bash_history`) for any manual execution of `curl` or `wget` that may indicate user involvement in suspicious downloads.

  - **Correlate with Network Traffic**: Examine network logs to identify any outbound connections to external IP addresses or domains before the command execution, which may reveal the sources of the downloaded content.

  - **Verify Downloaded Files**: If applicable, inspect any temporary files created in `/tmp` or `/dev/shm` for malicious indicators, such as obfuscation, non-standard encodings, or connections to known malicious domains.

  ### Prioritization
  The alert signifies a high severity due to the potential for immediate malicious actions derived from executing downloaded scripts. The ability of attackers to exploit vulnerabilities through these means poses significant risks, warranting urgent investigation in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection may be limited in environments where logging is not enabled for process command-line parameters, as instances of legitimate usage of `curl` or `wget` could lead to false positives. Assumptions include that malicious downloads will always follow this specific pattern and that appropriate logging mechanisms are in place to capture command executions accurately. Environments employing automated scripts or system updates that use these tools may introduce further noise in the detection coverage, necessitating the need for refined detection logic or additional contextualization.

