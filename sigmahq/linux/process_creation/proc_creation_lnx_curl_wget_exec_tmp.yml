title: Suspicious Download and Execute Pattern via Curl/Wget
id: a2d9e2f3-0f43-4c7a-bcd9-9acfc0d723aa
status: experimental
description: |
  Detects suspicious use of command-line tools such as curl or wget to download remote
  content - particularly scripts - into temporary directories (e.g., /dev/shm, /tmp), followed by
  immediate execution, indicating potential malicious activity. This pattern is commonly used
  by malicious scripts, stagers, or downloaders in fileless or multi-stage Linux attacks.
references:
- https://gtfobins.github.io/gtfobins/wget/
- https://gtfobins.github.io/gtfobins/curl/
author: Aayush Gupta
date: 2025-06-17
tags:
- attack.execution
- attack.t1059.004
- attack.t1203
logsource:
  category: process_creation
  product: linux
detection:
  selection_downloader:
    CommandLine|contains:
    - '/curl'
    - '/wget'
  selection_tmp:
    CommandLine|contains:
    - '/tmp/'
    - '/dev/shm/'
  selection_executor:
    CommandLine|contains: 'sh -c'
  condition: all of selection_*
falsepositives:
- System update scripts using temporary files
- Installer scripts or automated provisioning tools
level: high
note: |
  ### Technical Context

  This rule detects suspicious activity involving command-line tools such as `curl` and `wget`, which are used to download content from the internet into temporary directories (e.g., `/tmp`, `/dev/shm`) followed by immediate script execution (e.g., `sh -c`). This behavior could indicate an adversary attempting to execute malicious scripts or commands in a stealthy manner, typical of fileless or multi-stage attacks. The relevant MITRE ATT&CK techniques include `Execution: Command-Line Interface (T1059.004)` and `Exploitation: Remote File Inclusion (T1203)`.

  The primary telemetry sources required are `process creation logs`, specifically focusing on the command line used at the time of process initiation. If this activity is malicious, it could lead to unauthorized execution of harmful scripts potentially affecting system integrity or data security. However, this detection does NOT confirm that the activity is malicious without additional context, as legitimate system updates or provisioning scripts may trigger similar commands.

  ### Investigation Steps

  - **Review command line arguments:** Check for processes utilizing `curl` or `wget` in combination with `/tmp` or `/dev/shm`. Use process creation logs (Linux audit logs or Syslog) filtering for entries with `CommandLine` fields containing `/curl` or `/wget`.

  - **Identify immediate execution patterns:** Look for command lines that include `sh -c` following the download. Validate using Syslog or process monitoring tools to find Event IDs related to executable scripts (`pid`, `uid`, `CommandLine`).

  - **Analyze context of the download:** Cross-reference the download URL or command output against threat intelligence sources to determine if the content originates from known malicious domains or IPs. Use web request logs to retrieve the original download URL context.

  - **Check for legitimate behavior:** Confirm if any identified use of `curl` or `wget` aligns with authorized system update scripts or provisioning tools. Reviewing the asset role and the allowed operational procedures can help distinguish benign from suspicious behavior.

  - **Look for high-confidence indicators:** Flag any `curl` or `wget` downloads executed in quick succession followed directly by execution commands. High urgency in execution warrants additional scrutiny.

  - **Validate integrity of executed commands:** Determine if the downloaded scripts contain obfuscated or base64 encoded content typical of malicious payloads. Use file integrity monitoring logs to capture the content of scripts run from the temporary directories.

  ### Prioritization

  This alert is of high severity due to the potential for remote code execution and system compromise. The use of common command-line tools for downloading and executing scripts poses a significant risk, and this behavior is frequently weaponized in multi-stage attacks.

  ### Blind Spots and Assumptions

  Detection is limited by the need to monitor comprehensive command line usage; if logging is incomplete, true malicious activity may go undetected. False positives can occur from legitimate activities like application installers or system maintenance scripts, which may also utilize similar patterns. Companion detections include monitoring for unusual outbound network requests or modifications to system files after the execution of the downloaded scripts, enhancing visibility into post-exploitation actions.

