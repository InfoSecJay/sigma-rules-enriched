  ### Technical Context
  This detection rule identifies potential hijacking attempts of the Amazon Simple Systems Manager (SSM) Agent on Linux systems. The rule is designed to capture instances where an attacker may attempt to misuse the SSM Agent, which can function as a remote access tool, to gain unauthorized control over AWS-hosted Linux instances. By leveraging the SSM Agent, an adversary could execute commands, modify configurations, and establish persistence without triggering traditional security alerts.

  This threat scenario typically relates to malicious insiders, external attackers who have gained some level of access, or automated scripts used by threat actors targeting cloud environments. The likely motivations of these attackers include maintaining long-term access to compromised systems, exfiltrating sensitive data, or moving laterally across cloud infrastructure. Relevant MITRE ATT&CK techniques for this detection include "Command and Control" (T1071) and "Persistence" (T1219.002) as attackers may utilize the SSM Agent to establish command and control channels via the AWS environment.

  Primary data sources for monitoring these activities should include process creation events from the Linux operating system. These logs will reveal command-line arguments used when launching the SSM Agent, which can indicate suspicious registration attempts.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for instances of the SSM Agent being executed with suspicious command-line arguments, particularly those containing flags such as `-register`, `-code`, `-id`, and `-region`.

  - **Correlate with AWS CloudTrail Events:** Examine AWS CloudTrail logs for any unusual API calls associated with the SSM Agent, particularly those that may indicate unauthorized actions taken by users or roles with SSM-related privileges.

  - **Check for Compromised Credentials:** Investigate if any AWS IAM roles or credentials with extensive SSM permissions have shown signs of compromise, including anomalous logins or access patterns.

  - **Evaluate Impact on System Configurations:** Assess the changes made to the system configurations or any new or modified IAM roles that may have been created as a result of the hijacking attempt, ensuring no persistence mechanisms have been established.

  ### Prioritization
  This alert holds medium severity owing to the potential impact of an attacker gaining unauthorized access to critical AWS resources via the SSM Agent. Given that the SSM Agent is a common tool for legitimate administrative tasks, the context of its usage should be closely observed to mitigate risk.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage could be the legitimate use of the SSM Agent by system administrators; thus, it's essential to establish a baseline of normal activity for this tool when refining detection logic. The detection logic also assumes that command-line arguments are consistently logged, which may not be the case in all configurations. Additionally, effective logging of process creation events is required for this alert to function properly, and any oversight in log retention policies may hinder detection capabilities.

