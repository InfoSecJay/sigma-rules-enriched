note: |
  ### Technical Context

  This Sigma rule detects attempts to register the Amazon SSM (Simple Systems Manager) Agent with potentially malicious parameters, indicating a possible hijack attempt. The likely attacker objective is to enable unauthorized remote access, effectively leveraging the SSM Agent as a remote access Trojan (RAT). This behavior corresponds with the MITRE ATT&CK technique for command and control (T1219.002) and persistence.

  The primary telemetry sources are system process creation logs specific to Linux environments, capturing data such as the image name and command line arguments used to initialize the SSM Agent. If malicious, this could allow adversaries to maintain control over the system, execute commands remotely, and evade detection. It is important to note that detection of this behavior does NOT, by itself, confirm active compromise or malicious intent, as legitimate system administrator activities may trigger the same alert.

  ### Investigation Steps

  - **Review process creation logs**: Check for instances of '/amazon-ssm-agent' in process creation logs, specifically Syslog or audit logs (e.g., /var/log/syslog or /var/log/audit/audit.log), focusing on the relevant Event ID or log pattern, with timestamps matching the alert.

  - **Examine command line arguments**: Identify if any command lines contain the parameters '-register ', '-code ', '-id ', and '-region '. Compare arguments against internal documentation on legitimate usage for deploying AWS SSM agents to differentiate between benign and suspicious activity.

  - **Correlate with user activity logs**: Cross-reference the time of the process creation with user login activity (e.g., /var/log/secure or using `last` command). Investigate if the initiating user has legitimate reasons to perform such actions or if the timing aligns with potential unauthorized access.

  - **Identify legitimate usage patterns**: Understand typical command and control patterns of authorized users deploying SSM agents. Look for infrequent manual registrations or changes to the agent configuration outside regular administrative maintenance schedules.

  - **Check for additional signs of compromise**: Validate the integrity of the SSM agent by checking for any unexpected connections to external IP addresses or unusual network traffic patterns around the time of registration. Investigate logs like '/var/log/syslog' for network-related messages.

  - **Assess host role and criticality**: Consider the importance of the compromised host. If the instance runs critical applications or contains sensitive data, escalate triage efforts accordingly to avoid potential data breaches or system hijacking.

  ### Prioritization

  The alert severity is medium due to the potential for a critical system to be compromised and misused by adversaries. The likelihood of malicious abuse is moderate, particularly if additional evidence supports unauthorized access. This behavior is concerning as it aligns with known exploitation tactics of remote access and persistence techniques.

  ### Blind Spots and Assumptions

  Detection may miss cases where legitimate admin processes mimic the detected patterns, leading to false positives. It's essential to ensure comprehensive logging of process creations and network activities for reliable detection. Legitimate administrative actions, such as system updates or configurations managed through the SSM Agent, can also trigger this alert. A related detection worth deploying is the monitoring of abnormal outbound network connections originating from SSM-managed instances to strengthen overall coverage against potential misuse.

