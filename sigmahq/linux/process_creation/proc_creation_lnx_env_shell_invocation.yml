note: |
  ### Technical Context

  This rule detects the invocation of a shell via the `env` command on Linux systems, which can indicate attempts by an attacker to circumvent restricted environments, escalate privileges, or execute arbitrary commands. The objective of this behavior is typically to gain unauthorized access to system functionalities or sensitive data. This detection aligns with the MITRE ATT&CK technique Execution - T1059 (Command and Scripting Interpreter).

  The primary telemetry sources for this detection include Linux process creation logs where the command executed is linked to the `env` command, specifically observing the associated CommandLine arguments for standard shell interpreters like `/bin/bash`, `/bin/sh`, or others. If malicious, this behavior poses a significant risk as it may indicate a successful exploitation of security controls. However, this detection does NOT confirm that the system has been compromised or that malicious actions have been conducted following the command's execution.

  ### Investigation Steps

  - **Verify process creation logs:** Check for Security Event IDs related to process creation, focusing on logs from `/var/log/auth.log` or `auditd` logs. Look for entries indicating the `env` command execution, specifically `CommandLine` entries ending with `/bin/bash`, `/bin/sh`, etc.

  - **Assess user context:** Identify the user who executed the command using the `who` or `last` commands. Determine if the user account is associated with legitimate administrative activity or if it appears anomalous.

  - **Cross-reference with benign activity:** Review typical use cases for the `env` command in your environment, such as backup scripts or application deployments. Look for patterns or frequency of execution that align with known legitimate processes.

  - **Search for malicious indicators:** Investigate for any unauthorized behavior that may follow the `env` command invocation, such as attempts to modify system configuration files or establish network connections through tools frequently used in post-exploitation scenarios.

  - **Look for shell session artifacts:** Check for indications of interactive shell sessions that could have been initiated after the command execution, such as entries in `~/.bash_history`, or unexpected persistent shell processes.

  ### Prioritization

  Due to the potential impact on the integrity of the affected Linux system and the common use of shell invocation in attacks, this alert has a high severity. The likelihood of malicious abuse is significant since bypassing restricted environments is a common tactic employed by threat actors.

  ### Blind Spots and Assumptions

  Detection limitations may include environments where `env` is legitimately used for routine operations, potentially resulting in false positives. Ensure that logging mechanisms like `auditd` are correctly configured to capture detailed process creation events. Legitimate activities such as toolchain builds or automated deployment scripts may trigger this alert, so understanding expected workflows is crucial. A related detection is monitoring for unauthorized process creations from suspicious or uncommon user accounts, which further strengthens coverage against potential exploitation attempts.

