detection:
  selection:
    Image|endswith: '/env'
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: selection
falsepositives:
- Github operations such as ghe-backup
level: high
note: |
  ### Technical Context

  This rule detects the invocation of interactive shells via the `env` command, which may indicate attempts by an attacker to bypass restricted shell environments, escalate privileges, or execute arbitrary commands. The likely objective of the adversary includes gaining unauthorized access and control over a system by using `env` to set environment variables and invoke a more privileged shell. This behavior is associated with the MITRE ATT&CK tactic "Execution" under the technique "Command and Scripting Interpreter: Unix Shell" (T1059.004).

  The primary telemetry sources include process creation logs, specifically Linux's `process_creation` logs, which capture actions like command executions along with the associated command line invocations. The security impact of successful exploitation could lead to unauthorized access and control of the system, altering its operational integrity. This detection does NOT confirm whether the command was executed by a malicious actor, as legitimate commands issued by authorized users may trigger it.

  ### Investigation Steps

  - **Examine process creation logs**: Check for Security Event ID 4717 (Linux process creation logs) that show the execution of the `/env` command. Pay attention to abnormal command line arguments indicating potential privilege escalation attempts.

  - **Analyze command line arguments**: Identify instances where the `env` command is followed by a shell invocation (e.g., `/bin/bash`). Anomalous use of `env` with this pattern could indicate malicious activity as opposed to expected usage scenarios in benign contexts, like automated scripts.

  - **Confirm host environment and restrictions**: Validate if the process was running in a restricted shell environment. Legitimate usage of `env` may occur in instances like GitHub operations (e.g., `ghe-backup`). If process creation logs reflect these scenarios, it could suggest normal operations.

  - **Identify environment variable manipulations**: Investigate any unusual environment variables set by the `env` invocation. Malicious activity may include variables that manipulate session behavior (such as `PATH` or `LD_PRELOAD`) to execute unauthorized binaries.

  - **Cross-check user and asset criticality**: Review the user context associated with the process. High-privileged users executing the `env` command should be scrutinized more closely compared to service accounts or system users, especially on critical infrastructure.

  ### Prioritization

  This alert should be considered high priority due to its potential impact on critical systems and infrastructure. The ability to invoke shells can lead to significant operational breaches if exploited maliciously. While this behavior may occur benignly, the likelihood of abuse in environments where restricted shells are deployed justifies immediate investigation.

  ### Blind Spots and Assumptions

  The detection may miss sophisticated obfuscation techniques where adversaries use alternative commands or scripts to achieve similar outcomes without triggering this rule. Reliable detection requires comprehensive logging configurations across all Linux systems to capture process creation events fully. Legitimate activities, such as certain administrative tasks or application behavior, may also trigger this alert. A complementary detection, such as monitoring for abnormal user activity (e.g., multiple shell invocation attempts from a single user), could enhance overall coverage and context for potential incidents.

