logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/env'
    CommandLine|endswith:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: selection
falsepositives:
- Github operations such as ghe-backup
level: high
note: |
  ### Technical Context
  This rule detects the invocation of a shell via the `env` command on Linux systems. The `env` command is often used to execute commands in a modified environment, and its use to invoke a shell can indicate unauthorized attempts to bypass shell restrictions, escalate privileges, or execute arbitrary commands. Attackers may leverage this technique as part of their exploitation workflow, especially in environments where shells are limited or restricted.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), specifically the technique **Command-Line Interface** (T1059). By invoking a shell through `env`, an attacker can gain additional control over the environment, modify the execution context, or run malicious scripts without raising immediate alarms.

  In enterprise environments, telemetry from process creation events serves as the primary data source for detecting this behavior, as it captures instances of command execution and related arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for any instances of the `env` command leading to shell invocation. Pay particular attention to unusual command line arguments or suspicious binary executions.
  - **Analyze User Behavior**: Investigate the user accounts that invoked the `env` command. Look for any deviations from normal usage patterns, such as unexpected privilege levels or times of access.
  - **Check File Integrity**: Identify any modified or newly created executables that may have been altered to facilitate this shell invocation method. Verify their integrity against known baselines.
  - **Correlate with Other Events**: Cross-reference the occurrences of `env` shell invocations with other security events, such as failed login attempts or privilege escalation activities, to build a comprehensive picture of potential compromise.

  ### Prioritization
  This alert is considered high severity due to the potential for significant impact if attackers successfully escalate privileges or execute arbitrary commands in an enterprise environment. Given the ongoing trends of sophisticated attacks targeting Linux systems, the likelihood of encountering such behavior is increased.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of unauthorized shell invocations, particularly if attackers employ different methods to achieve similar outcomes, such as using other commands or tools to create shells. The detection logic assumes that logging is enabled for process creation events across all Linux systems. Additionally, specific configurations or command syntax variations might lead to false negatives if they don't align precisely with the defined detection patterns.

