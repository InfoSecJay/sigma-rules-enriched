note: |
  ### Technical Context
  This rule detects the use of the base64 utility on Linux systems to decode arbitrary base64-encoded text. Base64 encoding is a common method used by attackers to obfuscate payloads or data, making it difficult for security tools to identify malicious content. By monitoring for the invocation of the base64 command with the decode option, security teams can uncover potential attempts to disguise payloads or other illicit content being executed on the system.

  Attackers may leverage this technique as part of a broader strategy to exfiltrate sensitive data or execute malicious scripts disguised as benign. The motive behind this behavior often lies within the “Defense Evasion” phase of a cyber-attack, where attackers strive to create mechanisms that obfuscate their true intentions from detection tools and security personnel.

  The relevant MITRE ATT&CK tactic is Defense Evasion, particularly the technique T1027 (Obfuscated Files or Information). The primary data source for this detection is process creation logs from Linux systems, which include information about executed commands and their parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate the process creation logs on the Linux system for instances where the base64 command is executed with the `-d` or `--decode` option to identify potentially unauthorized decoding actions.
  - **Analyze Command Context**: Examine the command-line arguments and the user context under which the base64 command was executed to ascertain if it corresponds with typical usage patterns or if it appears suspicious based on the environment.
  - **Correlate with Other Events**: Look for correlations with other log sources, like network activity or file system changes, that may indicate broader suspicious actions or an attempt to exfiltrate sensitive data after decoding.
  - **Investigate User Behavior**: Assess the user accounts that executed the base64 command for any signs of compromise, such as unusual login times or accessing sensitive resources outside of normal operating hours.

  ### Prioritization
  The severity of this alert is considered low; however, repeated occurrences or combinations with other suspicious activities could warrant escalation. While the use of base64 decoding might be legitimate for some system administration tasks, it poses a risk if employed to obfuscate malicious intentions.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if base64 decoding is occurring through other programming languages or scripts that may not invoke the `base64` utility directly. This detection logic assumes that malicious actors will utilize standard command-line usage, but advanced attackers might employ alternative techniques to achieve the same goal. Additionally, the effectiveness of this rule relies on the availability and proper configuration of process creation logs on Linux systems; without these logs, the detection cannot function.

