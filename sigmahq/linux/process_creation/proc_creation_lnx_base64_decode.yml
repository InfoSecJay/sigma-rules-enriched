note: |
  ### Technical Context

  This Sigma rule detects the execution of the `base64` utility on Linux systems, specifically targeting the use of the `-d` or `--decode` options to decode base64-encoded text. The likely objective of an attacker utilizing this command is to decode potentially obfuscated payloads or data, which could be part of a larger exploit or data exfiltration strategy. This behavior aligns with the MITRE ATT&CK technique T1027: Obfuscated Files or Information, implicating it as a tactic employed by adversaries to hide malicious activities.

  The primary telemetry source is Linux process creation logs, specifically capturing events related to the execution of processes. The relevant log details include the command-line arguments and the image path of the executing process. If this behavior is malicious, it may indicate an attempted compromise or data manipulation. Importantly, this detection does not confirm that the output of the decoding process is malicious by itself; further investigation is required to ascertain the intent and result of the action.

  ### Investigation Steps

  - **Check relevant process logs**: Review Linux process creation logs for Event IDs related to the `base64` command, particularly looking for entries that contain `Image` ending with `/base64` and `CommandLine` including `-d` or `--decode`.
  - **Correlate with user accounts**: Identify and verify the user account associated with the base64 command execution. Confirm if it is a legitimate administrative user or an unprivileged account, which might indicate potential misuse.
  - **Analyze command output**: Investigate the output of the base64 decode operation if available. Look for known malicious indicators or content that ensures clear understanding of the action's purpose.
  - **Review historical behavior**: Compare the command invocation context with previous process execution patterns for the user or system. Determine if using base64 is routine in their operational behavior or anomalous.
  - **Identify associated network activity**: Look for subsequent outbound network connections or data transfers that occur shortly after this command execution. Use network logs to examine connections initiated by the process after the command's execution.
  - **Contextualize software usage**: Confirm whether legitimate applications on the system commonly invoke the base64 utility for encoding and decoding tasks, such as during file transfers or data storage. Validate this by assessing application logs.

  ### Prioritization

  This alert has a low severity, as decoding base64-encoded text can be part of benign activities, but can also signal malicious intent. The impact is moderate, typically occurring on less critical systems unless associated with high-value information. The likelihood of exploitation is low, but the use of obfuscation techniques is routinely weaponized in cyberattacks.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers use tools that mimic base64 decoding without invoking the actual utility, such as custom scripts. Reliable detection of this behavior requires that Linux process creation logging is properly configured. Other legitimate applications may also trigger similar alerts when utilizing base64 processing functions for valid purposes. A companion detection could involve monitoring for suspicious command-line arguments across a wide range of potentially malicious binaries, ensuring broader coverage for obfuscation techniques.

