detection:
  selection:
    Image|endswith: '/base64'
    CommandLine|contains: '-d'     # Also covers "--decode"
  condition: selection
falsepositives:
- Legitimate activities
level: low
note: |
  ### Technical Context

  This rule detects the execution of the `base64` command-line utility on Linux systems to decode base64-encoded text, particularly focusing on invocations that include the `-d` (or `--decode`) option. An adversary may use this technique to covertly interpret and obfuscate data in order to execute payloads or extract sensitive information via a coded format. This behavior aligns with the MITRE ATT&CK technique "Obfuscated Files or Information" (T1027).

  Primary telemetry sources include Linux process creation logs, specifically the `CommandLine` parameter and the `Image` path, which helps reveal what commands were executed. If executed maliciously, this activity may signal data exfiltration or preparation for further exploitation. Notably, this detection does NOT confirm malicious intent on its own; legitimate use cases exist for decoding base64 text, especially in development and data manipulation environments.

  ### Investigation Steps

  - **Review process execution details**: Check for `Event ID` 4104 entries in `auditd` logs for `base64` executions. Look for a process tree to determine if it has a legitimate parent process (e.g., system scripts, cron jobs). Malicious behavior may emerge through unexpected parent processes or running without clear justification.

  - **Analyze command-line arguments**: Focus on the `CommandLine` field with `-d` to understand context. Legitimate uses might involve decoding configuration files or data, while arbitrary strings or unusual file accesses indicate malicious intent.

  - **Correlate against system logs**: Verify if the activity correlates with other system events around the same timestamp, such as suspicious SSH logins (var/log/auth.log) or unusual system accesses (via syslog), which could indicate an exploit framework being staged.

  - **Inspect related files**: Check for the presence of suspicious artifacts such as files created or modified around the time of the `base64` execution. Expected behavior includes legitimate log files or scripts, while unexpected binaries may indicate malicious downloads. Use `ls` commands to look at the last modified files in the relevant directories.

  - **Examine user context**: Identify the user context under which the `base64` command was executed. If invoked by a non-administrative user in a sensitive environment, consider it a higher-risk indicator than if run by a system account doing regular processing.

  ### Prioritization

  This alert has a low severity in an enterprise context due to the common, legitimate applications of base64 decoding in scripting and development tasks. However, it carries a risk of malicious abuse, particularly if found in conjunction with other suspicious activities or if performed by unauthorized user accounts.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases for base64 decoding in scripting environments, potentially leading to false positives. Ensure detailed logging is enabled for process creations and user activities to enhance detection reliability. Legitimate activities may include development scripts or data processing tasks utilizing legitimate encoding/decoding functions, which can confound analysis. A related detection rule that complements coverage is monitoring for removable media access, which could indicate exfiltration attempts alongside decoded information.

