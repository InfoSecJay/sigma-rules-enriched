title: Python WebServer Execution - Linux
id: 3f0f5957-04f8-4792-ad89-192b0303bde6
status: experimental
description: |
  Detects the execution of Python web servers via command line interface (CLI).
  After gaining access to target systems, adversaries may use Python's built-in HTTP server modules to quickly establish a web server without requiring additional software.
  This technique is commonly used in post-exploitation scenarios as it provides a simple method for transferring files between the compromised host and attacker-controlled systems.
references:
- https://www.atomicredteam.io/atomic-red-team/atomics/T1048.003#atomic-test-8---python3-httpserver
- https://docs.python.org/3/library/http.server.html
- https://docs.python.org/2/library/simplehttpserver.html
author: Mohamed LAKRI
date: 2025-10-17
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_img:
  - Image|endswith:
    - '/python'
    - '/python2'
    - '/python3'
  - Image|contains:
    - '/python2.'            # python image is always of the form ../python3.10; ../python is just a symlink
    - '/python3.'
  selection_module:
    CommandLine|contains:
    - 'http.server'
    - 'SimpleHTTPServer'
  condition: all of selection_*
falsepositives:
- Testing or development activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of Python web servers via the command line interface on Linux systems. Adversaries may leverage Python's built-in HTTP server capabilities for various malicious activities, particularly in post-exploitation scenarios. By establishing a simple web server, attackers can facilitate the transfer of files or data between a compromised system and their own remote control infrastructure. This behavior is a common tactic for exfiltrating sensitive information or maintaining persistence within an environment.

  The relevant MITRE ATT&CK tactics include **Exfiltration** (TA0010) and the technique **Exfiltration Over Web Service** (T1048.003). Attackers typically aim to minimize detection by using tools and functionalities that are native to the operating system, which can camouflage illicit actions under regular administrative tasks. Detection of Python web server activity is crucial as it may indicate further malicious intent, such as data theft or lateral movement.

  Primary data sources for this detection include **process creation events**, which capture command line executions, as well as potential logs from endpoint detection and response (EDR) solutions that monitor for unusual process behavior.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for the creation of processes that include `/python`, `/python2`, or `/python3` in their image paths. Focus on those with command lines that contain `http.server` or `SimpleHTTPServer`.
  - **Analyze Network Connections**: Investigate any established outbound network connections and corresponding traffic patterns. Look for unusual connections initiated by the Python process, especially towards external or unauthorized IP addresses.
  - **Check for File Transfers**: Look for any signs of file transfers using tools like tcpdump or network traffic analysis to determine if files have been uploaded or downloaded via the established web server.
  - **Correlate with User Activities**: Cross-reference the time of the detected Python web server execution with user activities and administrative tasks. Identify if the execution aligns with permissions and expectations for the user account involved.

  ### Prioritization
  This alert should be assigned a medium severity, as the execution of a Python web server can indicate an active compromise, especially if it deviates from typical user behavior. The likelihood of it being malicious increases in environments that do not routinely allow web server deployments by users.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where attackers use less common web server tools or write custom scripts. Additionally, if access to execute Python is legitimate in certain development contexts, false positives could arise from testing or authorized development activities. The detection logic assumes that process creation logs are adequately configured and monitored, which may not always be the case in all enterprise environments. Proper logging settings are essential for this alert to function effectively.

