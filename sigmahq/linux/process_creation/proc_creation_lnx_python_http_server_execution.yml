title: Python WebServer Execution - Linux
id: 3f0f5957-04f8-4792-ad89-192b0303bde6
status: experimental
description: |
  Detects the execution of Python web servers via command line interface (CLI).
  After gaining access to target systems, adversaries may use Python's built-in HTTP server modules to quickly establish a web server without requiring additional software.
  This technique is commonly used in post-exploitation scenarios as it provides a simple method for transferring files between the compromised host and attacker-controlled systems.
references:
- https://www.atomicredteam.io/atomic-red-team/atomics/T1048.003#atomic-test-8---python3-httpserver
- https://docs.python.org/3/library/http.server.html
- https://docs.python.org/2/library/simplehttpserver.html
author: Mohamed LAKRI
date: 2025-10-17
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_img:
  - Image|endswith:
    - '/python'
    - '/python2'
    - '/python3'
  - Image|contains:
    - '/python2.'            # python image is always of the form ../python3.10; ../python is just a symlink
    - '/python3.'
  selection_module:
    CommandLine|contains:
    - 'http.server'
    - 'SimpleHTTPServer'
  condition: all of selection_*
falsepositives:
- Testing or development activity
level: medium
note: |
  ### Technical Context

  This detection identifies instances where Python web servers, specifically through modules like `http.server` or `SimpleHTTPServer`, are executed via the command line on Linux systems. Such actions can indicate an adversary's attempt to set up a web server for file transfer post-exploitation, allowing them to interact with the compromised host or exfiltrate data. This behavior aligns with the MITRE ATT&CK tactic of "Exfiltration" (TA0046) and the technique "Exfiltration Over Alternate Protocol" (T1048.003).

  The primary telemetry source is from Linux process creation logs, capturing commands and execution details. If malicious, this behavior could facilitate unauthorized data access or enable a persistent foothold in the environment. It’s important to note that this detection alone does not confirm malicious intent; legitimate development or testing activities may also trigger the same alerts.

  ### Investigation Steps

  - **Review process creation logs:**
    Analyze Security Event ID for process creation to find commands related to the execution of Python web servers. Look for Event ID  cmdline that includes `http.server` or `SimpleHTTPServer` from `/proc/` directories.

  - **Identify command line arguments:**
    Check the complete command line in the process creation logs (e.g., /proc/[PID]/cmdline) for any unusual flags or parameters that could indicate an attempt to serve files or conduct exfiltration.

  - **Evaluate the user context:**
    Determine the executing user. If the command is run by non-administrator or unusual accounts, it may indicate compromise. Legitimate operations typically originate from user accounts assigned appropriate roles without anomalous privileges.

  - **Conduct network traffic analysis:**
    Inspect out-bound network connections (using tools like `netstat` or `ss`) initiated by the Python process and check for suspicious traffic patterns or communications to known malicious IP addresses.

  - **Check for file system changes:**
    Monitor the local filesystem for changes in the directory served by the Python web server. Look for the creation of unexpected files or directories that correlate with the execution timestamp.

  - **Look for companion processes:**
    Identify related suspicious activities such as other processes that were launched by the Python server. This includes `curl`, `wget`, or SSH connections, which could indicate an ongoing exfiltration operation.

  ### Prioritization

  This alert warrants a medium severity level due to the potential for significant security impact if malicious. The ability for an adversary to utilize simple modules like Python's HTTP server for data exfiltration is relatively common and often weaponized in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may limit visibility if the logs are not configured correctly. Legitimate development or testing activities could also produce similar alerts, leading to false positives. Moreover, adversaries might employ obfuscation or variations in command syntax to evade detection. Monitoring companion detections, such as unusual outbound connections from non-standard services, can enhance the response coverage.

