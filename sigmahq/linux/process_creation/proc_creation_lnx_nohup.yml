note: |
  ### Technical Context
  This rule detects the execution of processes using the `nohup` command on Linux systems. The `nohup` command allows running a command immune to hangups, meaning the command can continue executing even after the user has logged out. Attackers may exploit this feature to maintain persistence in a compromised environment, ensuring their malicious processes continue running without interruption, especially in situations where they might lose their shell session.

  Attackers leveraging `nohup` are likely attempting to maintain control over a machine or run long-lived processes associated with their activities, such as file persistence, data exfiltration, or even establishing backdoor connections. This behavior often indicates a breach where an attacker has escalated privileges and is executing commands designed to obfuscate their presence.

  The relevant MITRE ATT&CK tactics and techniques for this behavior include:
  - Execution (ID: TA0002)
  - Command and Scripting Interpreter: Unix Shell (ID: T1059.004)

  The primary data sources that will contain the best evidence are Linux process creation logs, which capture the execution of applications and associated command-line arguments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for the presence of `nohup` in the command line of recently initiated processes. Look for unusual or unexpected processes that could indicate malicious intent.
  - **Correlate with User Activity:** Examine user activities preceding the `nohup` execution; identify whether the user context appears legitimate or raises any concerns. Look for patterns of behavior inconsistent with normal operations for that user.
  - **Analyze Concurrent Activity:** Check for other suspicious activities occurring simultaneously with `nohup` execution, such as unexpected network connections, changes to user permissions, or uncommon file modifications that may suggest broader compromise.
  - **Collect Artifact Evidence:** Gather and analyze artifacts from related commands or processes (logs, network connections, etc.) to ascertain whether the `nohup` command was used for legitimate administrative purposes or potentially malicious operations.

  ### Prioritization
  The severity of this alert is medium due to the potential for the attacker to maintain persistence and avoid detection. Particularly in high-security environments, misuse of `nohup` can indicate active compromise and should be prioritized for immediate investigation to prevent further exploitation.

  ### Blind Spots and Assumptions
  While this detection rule targets the execution of `nohup`, it may not account for similar mechanisms attackers use to maintain persistence, such as creating cron jobs or using other shell commands. Additionally, the detection assumes that logs for process creation are configured correctly and that the system is not overly restricted to the point where legitimate use of `nohup` by administrators is common. If administrators or installed processes regularly use `nohup`, there may be a high number of false positives, which could dilute the value of this alert.

