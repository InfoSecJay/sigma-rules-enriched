  ---

  ### Technical Context

  This Sigma rule detects the execution of the `nohup` command on Linux systems, which is often used to run processes immune to hangups, allowing them to continue running after a user logs out. Attackers may utilize `nohup` to maintain persistence or run malicious scripts in the background, especially in compromised environments. The behavior aligns with the MITRE ATT&CK technique **Execution via Scripting** (T1059.004).

  The primary telemetry source is process creation logs from Linux systems. This includes log entries that document command executions and arguments. If malicious, the presence of `nohup` can indicate that an attacker is trying to maintain an unauthorized process without being disrupted. However, it is important to note that simply executing `nohup` does not inherently confirm malicious intent; legitimate users may also leverage this command for valid purposes.

  ---

  ### Investigation Steps

  - **Review process creation logs:**
    Inspect `/var/log/auth.log` for entries related to `nohup`. Look for unusual execution paths or arguments that don't match standard usage patterns.

  - **Identify usage context:**
    Determine if the command originator has legitimate administrative privileges. Flags indicating administrative usage may suggest benign intent, while usage by non-administrative accounts could be suspicious.

  - **Correlate with scheduled jobs:**
    Check for crontab entries associated with the user who executed `nohup` (e.g., `crontab -l -u [username]`). Legitimate entries should correspond with known scheduled tasks while unexpected entries may indicate malicious activity.

  - **Scan for additional process creations:**
    Examine Sysmon equivalent entries or process information for related child processes spawned by the nohup command. Look at PID relationships in `/proc/[pid]/` and check if these processes perform suspicious activities, particularly network communications or file access.

  - **Analyze network connections:**
    Check for outbound connections from processes associated with `nohup`. Use commands like `netstat -tunap` to find connections that could indicate data exfiltration or command-and-control (C2) activity.

  - **Look for common evasion patterns:**
    Assess if the execution of `nohup` follows after an unusual command that could indicate prior compromise—particularly, check for any `bash` or `sh` shell, which might have been used to initially spawn `nohup`.

  ---

  ### Prioritization

  The alert severity is medium, as while the `nohup` command can be weaponized to maintain process persistence, it is also commonly used for legitimate purposes, particularly by system administrators. Therefore, careful analysis is necessary to determine the nature of the execution in the context of the affected system.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques where attackers might obfuscate their commands or use alternate persistence methods. Reliable detection requires that process creation logs are properly configured and monitored, which can sometimes be overlooked. Additionally, administration-related automation scripts may trigger this alert, complicating threat assessment. A companion detection that may strengthen coverage is monitoring for unusual use of other execution commands like `screen` or `tmux`, which could indicate similar attack patterns.

