note: |
  ### Technical Context

  This rule detects the execution of the `nohup` command, which is often used by adversaries to ensure that processes remain running even after a user logs out or to circumvent environment restrictions. The likely objective is to maintain persistence or run shell commands in a non-interactive session, which can facilitate further exploitation. This aligns with the MITRE ATT&CK technique "Command and Scripting Interpreter: Unix Shell" (T1059.004).

  Primary telemetry sources are Linux process creation logs, specifically looking for events that indicate the command execution. If malicious, this could indicate unauthorized persistence mechanisms or command execution that would allow an attacker to maintain control over a system. Notably, this detection does **NOT** confirm that the process is inherently malicious; legitimate system administrators may utilize `nohup` for valid purposes.

  ### Investigation Steps

  - **Identify the executing user:** Examine the process creation logs (Linux Syslog or similar) for the `nohup` command execution. Look for the user ID or username associated with the process. Legitimate users such as system administrators or automated scripts may run this, while unexpected or low-privilege accounts could be suspicious.

  - **Review command arguments:** Check the arguments passed to `nohup` by analyzing the `cmdline` field in the process logs. Any invocation with obfuscated or malicious scripts (e.g., scripts pulling from untrusted sources) should be flagged as high-risk indicators.

  - **Monitor for parent-child process relationships:** Explore parent process IDs in the logs. If `nohup` is spawned from a well-known benign process (like a system service), it may be more acceptable. However, if it originates from a suspicious script or a command-line tool known for exploitation, it raises concerns.

  - **Fetch process lifecycle history:** Use telemetry tools to review the process lifecycle, ensuring it aligns with expected behavior. For example, legitimate use cases might involve long-running background scripts, while a sudden `nohup` execution at odd times could indicate malicious activity.

  - **Evaluate environment variables:** Investigate the environment variables associated with the running `nohup` command. Temporary variables that manipulate execution paths or access sensitive data may indicate malicious intent if they don't correlate with safe operations.

  ### Prioritization

  This alert has medium severity due to the potential for malicious use but is contextualized by the environment's risk profile. An affected system's criticality, particularly if it holds sensitive information or has direct access to the network, elevates the concern. Since `nohup` can be weaponized for persistence, any instance should prompt further analysis, especially in sensitive contexts.

  ### Blind Spots and Assumptions

  Detection may miss legitimate usage scenarios by system administrators running scripts that require persistence, thereby potentially leading to false positives. This detection relies on proper logging configurations for process creation; any gaps can result in undetected misuse. A related detection could include monitoring for other command execution patterns or suspicious command line activity to bolster context and coverage against malicious behaviors.

