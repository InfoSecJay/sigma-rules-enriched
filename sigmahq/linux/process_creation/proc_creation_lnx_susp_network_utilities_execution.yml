title: Linux Network Service Scanning Tools Execution
id: 3e102cd9-a70d-4a7a-9508-403963092f31
status: test
description: Detects execution of network scanning and reconnaisance tools. These
  tools can be used for the enumeration of local or remote network services for example.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md
- https://github.com/projectdiscovery/naabu
- https://github.com/Tib3rius/AutoRecon
author: Alejandro Ortuno, oscd.community, Georg Lauenstein (sure[secure])
date: 2020-10-21
modified: 2024-09-19
tags:
- attack.discovery
- attack.t1046
logsource:
  category: process_creation
  product: linux
detection:
  selection_netcat:
    Image|endswith:
    - '/nc'
    - '/ncat'
    - '/netcat'
    - '/socat'
  selection_network_scanning_tools:
    Image|endswith:
    - '/autorecon'
    - '/hping'
    - '/hping2'
    - '/hping3'
    - '/naabu'
    - '/nmap'
    - '/nping'
    - '/telnet'         # could be wget, curl, ssh, many things. basically everything that is able to do network connection. consider fine tuning
    - '/zenmap'
  filter_main_netcat_listen_flag:
    CommandLine|contains:
    - ' --listen '
    - ' -l '
  condition: (selection_netcat and not filter_main_netcat_listen_flag) or selection_network_scanning_tools
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This rule detects the execution of network service scanning tools commonly utilized for reconnaissance within Linux environments. Tools such as Nmap, Netcat, and AutoRecon can be leveraged by attackers to enumerate local and remote network services, revealing potential vulnerabilities to exploit. The goal of an attacker using these tools is typically to gather information about networked assets, services, and configurations to identify weaknesses that could be exploited in later stages of an attack.

  Relevant MITRE ATT&CK tactics include **Discovery** (TA0007), with techniques such as **Network Service Discovery** (T1046). This label refers to the methods attackers use to identify active services on network hosts, making it a key step in mapping out their targets. The primary data sources for detecting these activities are process creation logs from Linux systems, which record when and how executables are run, capturing the command line arguments used that may indicate scanning or enumeration actions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze relevant process creation logs to identify instances of network scanning tools (e.g., Nmap, Netcat) running on Linux systems. Pay close attention to the command line arguments to distinguish between legitimate use and potential malicious scanning activities.
  - **Check for Anomalous Behavior**: Look for unexpected patterns of network activity correlating with the execution of scanning tools, such as excessive outbound connections, requests to numerous ports, or attempts to reach a large number of hosts in a short time frame.
  - **Examine Historical Context**: Investigate if the detected tool executions correspond with known administrative tasks or scheduled jobs. Identify if there was any recent change in network policies or configurations that might explain the scanning activity.
  - **Correlate with Threat Intelligence**: Use threat intelligence sources to check for any indicators related to the detected scanning activities. This includes checking for known bad IPs or behaviors linked to threat actors that commonly employ such reconnaissance techniques.

  ### Prioritization
  The alert's severity is deemed **low** because while the execution of network scanning tools can indicate an attempted reconnaissance activity, it does not directly indicate a compromise unless correlated with suspicious network behavior or other threat indicators. Regular administrative tasks may trigger false positives in this context.

  ### Blind Spots and Assumptions
  Some blind spots include the possibility of benign administrative uses of these scanning tools not being suitably filtered out, leading to false positives. The detection logic assumes that network scanning will often not include flags for listening mode, potentially missing malicious configurations. Required logs include comprehensive process creation logs, which should be enabled for effective detection, as well as any logs from network devices that may reveal unusual connection patterns.

