title: Linux Network Service Scanning Tools Execution
id: 3e102cd9-a70d-4a7a-9508-403963092f31
status: test
description: Detects execution of network scanning and reconnaisance tools. 
  These tools can be used for the enumeration of local or remote network 
  services for example.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md
- https://github.com/projectdiscovery/naabu
- https://github.com/Tib3rius/AutoRecon
author: Alejandro Ortuno, oscd.community, Georg Lauenstein (sure[secure])
date: 2020-10-21
modified: 2024-09-19
tags:
- attack.discovery
- attack.t1046
logsource:
  category: process_creation
  product: linux
detection:
  selection_netcat:
    Image|endswith:
    - '/nc'
    - '/ncat'
    - '/netcat'
    - '/socat'
  selection_network_scanning_tools:
    Image|endswith:
    - '/autorecon'
    - '/hping'
    - '/hping2'
    - '/hping3'
    - '/naabu'
    - '/nmap'
    - '/nping'
    - '/telnet'         # could be wget, curl, ssh, many things. basically everything that is able to do network connection. consider fine tuning
    - '/zenmap'
  filter_main_netcat_listen_flag:
    CommandLine|contains:
    - ' --listen '
    - ' -l '
  condition: (selection_netcat and not filter_main_netcat_listen_flag) or 
    selection_network_scanning_tools
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects the execution of network scanning tools commonly used for reconnaissance, such as Nmap, Netcat, and AutoRecon, on Linux systems. The likely attacker objective is to enumerate local or remote network services to identify vulnerabilities or services for further exploitation. This behavior aligns with the MITRE ATT&CK tactic of Discovery, specifically technique T1046: Network Service Scanning.

  The primary telemetry sources include process creation logs from Linux, specifically `syslog` or `auditd`, which capture command line executions. If malicious, the use of these scanning tools could indicate an initial reconnaissance phase of an attack lifecycle. Importantly, this detection does not confirm that an attack is in progress; it only indicates the execution of scanning tools, which could also be benign administrative activities.

  ### Investigation Steps

  - **Identify the executing user:**
    Review the execution logs to confirm the user running the command (look for the `User` field in syslog or `auditd`). Benign use may involve administrative accounts, while usage by non-privileged users warrants further scrutiny.

  - **Examine command line arguments:**
    Check the `CommandLine` field for arguments that could indicate malicious intent, such as a lack of listening flags (e.g., `--listen` or `-l`) in Netcat executions. Malicious indicators include scanning flags commonly used in attacks, such as `-sS` for SYN scans in Nmap.

  - **Review log source details:**
    Collect and analyze logs from your `syslog` or `auditd` on the affected system, specifically for Event IDs indicating process creation (e.g., using `auditctl` rules). Look for the presence and frequency of these tools over a time frame.

  - **Look for additional reconnaissance activity:**
    Search for other process creations by the same user or during the same time frame that involve other discovery-related tools (e.g., `ping`, `curl`). For instance, any simultaneous processes running on other hosts can signal coordinated reconnaissance.

  - **Assess for associated network activity:**
    Validate the existence of unusual outbound connection attempts or traffic patterns that correspond with the time of the execution (e.g., unexpected scanning IPs) via your firewall logs or network monitoring tools.

  ### Prioritization

  The alert severity is considered low but warrants analysis due to the systems involved—especially critical infrastructure or sensitive environments. The likelihood of malicious abuse is moderate since these tools, while commonly used for legitimate purposes, can be weaponized in early reconnaissance phases by attackers.

  ### Blind Spots and Assumptions

  This detection rule may have limitations as legitimate administrative activities can trigger similar alerts. Notably, detection is reliant on consistent logging configurations and may miss scanning activities if logs are not adequately captured or rotated. Additionally, scanning tools that are executed with minimal command arguments or modified names could evade detection. A companion detection to consider is monitoring for abnormal network connections or traffic spikes from the scanning activity, which would provide additional context on potential malicious behavior.

