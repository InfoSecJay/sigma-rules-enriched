note: |
  ### Technical Context

  This Sigma rule detects the execution of shell commands via the `rsync` utility in Linux environments. An attacker may leverage this behavior to escalate privileges, perform unauthorized command execution, or compromise environments with restricted shell access. The relevant MITRE ATT&CK tactic is **Execution** (T1203), with the technique being **Command and Scripting Interpreter** (T1059).

  The primary telemetry source is process creation logs, specifically from Linux systems capturing details about command-line executions. If malicious, using `rsync` to spawn a shell can lead to significant security impacts, including lateral movement and data exfiltration. It is important to note that this detection does not confirm malicious intent on its own; legitimate uses of `rsync` for backups or file transfers can also trigger the alert.

  ### Investigation Steps

  - **Verify command-line usage**: Check the command line associated with the process creation event (e.g., Syslog or journald log). Look for indications of shell execution, such as "rsync -e /bin/bash". Legitimate `rsync` commands typically do not invoke a shell directly and focus on file transfers.

  - **Review process hierarchy**: Investigate the parent process of the `rsync` execution using process accounting logs (e.g., auditd). A shell (bash, zsh, etc.) spawned by `rsync` is a strong indicator of potential abuse, especially if the parent process deviates from expected administrative operations.

  - **Check execution context**: Analyze the user and group ID of the process. If `rsync` is executed by a non-administrative user in a sensitive context, this could be a red flag. Use logs from `/var/log/auth.log` to verify user context.

  - **Correlate with other telemetry**: Look for lateral movement indicators in the same timeframe. Check for outbound connections or suspicious command executions recorded in network logs (iptables or tcpdump) that may correlate with the `rsync` execution.

  - **Identify legitimate `rsync` usage**: Cross-reference logs to identify legitimate `rsync` activities, such as scheduled backups or synchronized file updates. Compare timestamps and command syntax against standard operational practices in your environment.

  ### Prioritization

  Given the potential impact on critical systems and the likelihood of exploitation, alerts triggered by this detection should be treated with high priority. Shell access via `rsync` is a technique that adversaries can weaponize, making it essential for prompt investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use obfuscation techniques or alternate command chaining methods that do not interact directly with `rsync`. It also assumes logging of process creation events is configured correctly and that `rsync` implementation details (like location) align with typical endpoint configurations. Legitimate administrative tasks under tightly controlled conditions might trigger the alert, such as scripted backups. A companion detection to consider is monitoring for unusual cron job executions that may set up `rsync` commands in a stealthy manner.

