detection:
  selection_root:
    CommandLine|contains: 'chown root'
  selection_perm:
    CommandLine|contains:
    - ' chmod u+s'
    - ' chmod g+s'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This Sigma rule detects the use of the `chown` and `chmod` commands with potentially malicious intent, specifically targeting changes that grant elevated privileges to files or directories (setuid or setgid). The likely attacker objective is to gain persistence or escalate privileges on a Linux system by modifying the ownership or permissions of executable files. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation, specifically technique T1548.001 (Abuse Elevation Control Mechanism).

  The primary telemetry sources include Linux process creation logs, focusing on command line arguments related to `chown` and `chmod`. If malicious, such actions could allow an adversary to execute code with elevated privileges, thereby compromising system integrity. It's important to note that this detection does NOT confirm malicious intent on its own and should be cross-referenced with additional context.

  ### Investigation Steps

  - **Review process creation logs:** Check Syslog or `/var/log/auth.log` for entries matching `command=chown root` or `command=chmod u+s`/`chmod g+s`, especially around the time of the alert.
  - **Examine user context:** Identify the user executing these commands, focusing on any non-administrative accounts making privilege changes. Look for unusual login times or patterns.
  - **Evaluate file attributes:** Inspect the affected files using `ls -l` to confirm changes in ownership or permissions. Legitimate entries should align with expected administrative practices, such as updating server scripts or binaries by root.
  - **Correlate with file access logs:** Check for subsequent executions of the modified files using audit logs (Auditd) for actions like read (open) and execute operations, which may indicate that they have been manipulated for exploitation.
  - **Identify other command usages:** Look for other commands executed around the same time that may indicate malicious intent, such as `wget`, `curl`, or scripts that download and execute remote payloads.
  - **Investigate system role and criticality:** Determine if the affected system is a production server or has high-value data, which increases the severity of potential compromises.

  ### Prioritization

  This alert should be treated with moderate urgency since it involves potentially dangerous operations on critical systems. The likelihood of malicious abuse is higher if the commands are run by unauthorized users or outside of normal maintenance windows. Moreover, privilege escalation attempts often lead to further exploitation, making them a common target for adversaries.

  ### Blind Spots and Assumptions

  Detection can be limited by circumvention techniques, such as administrative users executing these commands for legitimate purposes during maintenance. Proper logging configuration is critical; ensure that process command-line logging is enabled in all environments. Legitimate activities, like system patching or software updates by system administrators, may trigger this alert. A related detection to consider is monitoring for unusual patterns in user account logins and privilege changes immediately following the alerts triggered by this rule.

