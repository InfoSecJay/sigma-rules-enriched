detection:
  selection_root:
    CommandLine|contains: 'chown root'
  selection_perm:
    CommandLine|contains:
    - ' chmod u+s'
    - ' chmod g+s'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This rule is designed to detect suspicious changes in file privileges on Linux systems, specifically through the usage of the `chown` and `chmod` commands. By monitoring for command-line executions that involve changing ownership to root (`chown root`) or setting the setuid/setgid bit (`chmod u+s` or `chmod g+s`), this detection indicates potential malicious activity aimed at elevating privileges or maintaining persistence through unauthorized modifications to executable files.

  In an enterprise environment, an attacker may exploit the ability to change file permissions to gain unauthorized access to sensitive data or escalate their privileges to a higher user level. Their objective may include establishing backdoors or altering system binaries to ensure continued access after an initial compromise. The relevant MITRE ATT&CK tactics and techniques associated with this behavior include Defense Evasion (TA0005), Persistence (TA0003), and Privilege Escalation (TA0004), specifically the technique T1548.001, which refers to Abuse Elevation Control Mechanism.

  Key data sources for detecting this behavior include process creation logs from the Linux operating system, which capture command-line executions, thus offering insights into potentially unauthorized administrative actions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze the process creation logs for instances of the `chown` and `chmod` commands, looking for unusual patterns or timestamps that don't align with routine administrative activities.
  - **Correlate User Activity**: Investigate the user accounts executing these commands. Determine if there are any unauthorized users or account anomalies around the same time these commands were executed.
  - **Inspect File Ownership and Permissions**: Check the ownership and permissions of critical files and directories that have been modified using these commands. Look for any unauthorized changes, particularly on sensitive executables.
  - **Assess System Integrity**: Utilize integrity monitoring tools to confirm the file integrity of key system binaries to ensure that no malicious alterations have occurred as a result of the detected activity.

  ### Prioritization
  The alert is considered low to medium severity due to the potential for significant impact if an attacker manipulates file permissions to escalate privileges or install persistent malware. However, it may also signal legitimate administration activities within the environment, necessitating careful investigation.

  ### Blind Spots and Assumptions
  This detection rule may not cover scenarios where attackers use alternative methods or commands (e.g., through scripts or third-party tools) to modify file privileges. It also assumes that process creation logs are properly configured and ingested into the monitoring system. If logging is disabled or misconfigured, this alert will not function as intended, leading to gaps in visibility. Additionally, legitimate administrative tasks may trigger false positives, requiring contextual analysis to determine genuine threats.

