detection:
  selection_root:
    CommandLine|contains: 'chown root'
  selection_perm:
    CommandLine|contains:
    - ' chmod u+s'
    - ' chmod g+s'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects potential unauthorized privilege changes on Linux systems through the use of `chown` and `chmod` commands. The attacker’s likely objective is to escalate privileges, granting themselves elevated access to sensitive files or processes. This behavior aligns with the MITRE ATT&CK technique T1548.001: **Indicator Removal on Host - File Permission Modification** and can also relate to tactics around **Persistence** and **Privilege Escalation**.

  The primary telemetry source includes Linux process creation logs, specifically focusing on command executions. Malicious activity could lead to unauthorized access to critical resources, allowing attackers to manipulate system files or potentially maintain persistence. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities can also trigger this alert.

  ### Investigation Steps

  - **Verify command usage**: Examine process creation logs (e.g., logs from `/var/log/auth.log` or `Syslog`) for legitimate admin users executing `chown root` or `chmod u+s`/`g+s`. Identify if these actions correspond to typical administrative maintenance or are outside of expected operational hours.

  - **Identify suspicious command patterns**: Review commands executed by users with higher privileges. Look for multiple instances of `chmod` or `chown` commands executed in a single session (e.g., Syslog entries  `3-5 seconds apart`) from accounts that do not regularly perform these actions.

  - **Check file ownership and permissions**: Use `ls -la` to verify the files targeted by `chown` or `chmod`. If the ownership has been altered to `root` or if setuid/setgid is granted without justification, this may indicate malicious behavior.

  - **Audit user login history**: Inspect user login records (e.g., `last` command output and `/var/log/auth.log`) to determine if relevant commands were executed by unexpected users or during unusual times, correlating user activities with timestamps.

  - **Correlate with other detection alerts**: Look for concurrent alerts related to unauthorized access or privilege escalation attempts. If other suspicious behavior is identified around the same timeframe, assess for potential compound exploitation.

  ### Prioritization

  This alert is of **low severity** due to the nature of the commands being potentially tied to legitimate administrative tasks. However, it warrants investigation especially in systems containing sensitive data or critical applications where privilege escalation can lead to significant damage. The likelihood of being abused for malicious intent exists, especially with the growing trend of attackers targeting privilege escalation.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers employ alternative methods for privilege escalation or utilize scheduled tasks for command execution. Reliable detection requires consistent monitoring of specific log sources, such as `auth.log` and `Syslog`, configured to capture all execution attempts. Legitimate administrative activities, especially routine system updates, may inadvertently trigger this alert. Companion detections such as monitoring for anomalous login attempts or system file integrity monitoring can provide stronger coverage against privilege escalation threats.

