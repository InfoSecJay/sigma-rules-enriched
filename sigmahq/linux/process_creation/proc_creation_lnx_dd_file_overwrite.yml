detection:
  selection1:
    Image:
    - '/bin/dd'
    - '/usr/bin/dd'
  selection2:
    CommandLine|contains: 'of='
  selection3:
    CommandLine|contains:
    - 'if=/dev/zero'
    - 'if=/dev/null'
  condition: all of selection*
falsepositives:
- Any user deleting files that way.
level: low
note: |
  ### Technical Context
  This detection rule identifies the overwriting and deletion of files using the `dd` command on Linux systems. The `dd` tool is a powerful command-line utility that can copy and convert data, but it can also be misused by malicious actors to overwrite critical files, thereby hindering recovery efforts post-infection or erasing artifacts to conceal their presence. This behavior is often associated with attackers attempting to disrupt operations, destroy evidence, or enact other malicious objectives.

  In terms of relevant MITRE ATT&CK tactics, this activity falls under the **Impact** tactic (TA0040), specifically correlating to the **Data Destruction** technique (T1485). Analysts should be aware that although legitimate users may execute `dd` commands, the specific patterns detected can indicate potential abuses of this functionality, particularly when combined with certain flags that are commonly used in destructive scenarios.

  Primary data sources for detecting this behavior include **process creation events**, which can capture command executions, including the `dd` command, alongside its various arguments. Monitoring system logs for process execution can provide insight into whether `dd` is being used in a suspicious context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for the execution of `/bin/dd` or `/usr/bin/dd`, including the associated command line arguments used. Look specifically for instances where the arguments `of=` are present, particularly those involving sensitive or critical files.

  - **Analyze Command-Line Arguments**: Pay close attention to command-line arguments that indicate potential misuse, such as `if=/dev/zero` or `if=/dev/null`. These arguments suggest that data is being overwritten or erased, particularly if the output file is critical to system operations.

  - **Correlate with User Activity**: Investigate the user account that executed the command and assess whether this behavior aligns with their usual activities. Suspicious users or those without a clear reason to execute such commands should be flagged for further review.

  - **Check File Integrity**: If an overwrite is detected, assess the integrity of the affected files. Utilize file integrity monitors or snapshots to determine what changes were made and whether these actions align with normal operational practices.

  ### Prioritization
  This alert is of **low severity** in a standard enterprise environment, as legitimate administrative actions may result in similar logs. However, its significance escalates if observed in unexpected contexts or user accounts, possibly indicating malicious intent to destroy critical data or cover tracks.

  ### Blind Spots and Assumptions
  The detection relies on the presence of detailed process creation logs, which must be configured to capture command lines accurately. A gap in detection may exist if users have legitimate reasons to utilize the `dd` tool in their workflows without proper documentation or oversight. Assumptions in the detection logic include that the usage patterns of `dd` will be indicative of malicious intent; however, this may not hold true in all circumstances, especially if users are not educated on the risks associated with data destruction techniques.

