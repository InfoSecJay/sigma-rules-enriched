  ---

  ### Technical Context

  This rule detects instances of file overwriting or deletion using the `dd` command on Linux systems. The likely attacker objective is to manipulate or destroy data, which can support data exfiltration or denial of service, positioning this behavior under the MITRE ATT&CK tactic of "Impact" and technique ID T1485 (Data Destruction). Primary telemetry sources include process creation logs which capture the execution of the `dd` command—especially with command-line arguments indicating output directed to `/dev/null` or `/dev/zero`. If malicious, this activity can lead to significant data loss or service disruption; however, this detection does NOT confirm that the action was malicious without additional context surrounding the activity.

  ---

  ### Investigation Steps

  - **Verify command execution details:** Review process creation logs for Event ID  fork/exec (e.g., Sysmon Event ID 1) or use `auditd` logs. Look for processes with the image path `/bin/dd` or `/usr/bin/dd`, especially those containing 'of=' in the command line.

  - **Assess command context:** Investigate the full command-line parameters associated with `dd`. If the command includes 'if=/dev/zero' or 'if=/dev/null', verify if this aligns with expected maintenance or testing activities. Legitimate use cases might involve disk imaging or restoration.

  - **Identify high-confidence malicious indicators:** Check for recurring `dd` executions in rapid succession over a short timeframe. This behavior may suggest a deliberate attempt to overwrite files quickly, often indicative of malicious intent.

  - **Monitor affected systems for visibility:** Determine the criticality of the affected asset(s). Systems with high business value or sensitive data must be prioritized for deeper analysis, especially if `dd` was used in a scripted or automated manner.

  - **Correlate with user activity:** Investigate user accounts that executed the command. Confirm if the user has legitimate permissions or typical usage patterns for executing data manipulation commands. Unusual users or times may indicate compromise.

  ---

  ### Prioritization

  This alert should be considered low to medium severity, primarily due to the context that legitimate users can also engage in file deletion through `dd`. However, the likelihood of malicious abuse remains, especially on critical systems where data integrity is paramount, posing a risk of weaponization in data destruction tactics.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of appropriate logging configurations, such as unmonitored crontab entries or script executions. Legitimate administrative tasks involving the `dd` command may trigger alerts, especially in maintenance windows. An additional detection focusing on script executions or scheduled tasks could enhance overall coverage and help differentiate between benign and malicious activities.

