note: |
  ### Technical Context

  This detection rule identifies instances where a script interpreter, such as Node.js or Bun, spawns a credential scanning tool like Trufflehog or Gitleaks. This behavior is typically indicative of an adversary trying to locate and extract sensitive information, such as API keys or passwords, possibly for malicious use. The relevant MITRE ATT&CK tactics include Credential Access (T1552) and Execution (T1059.004). Primary telemetry sources will involve process creation logs specific to Linux systems. If malicious, the impact could range from data breaches to unauthorized access to critical systems. Importantly, this detection does NOT confirm compromise on its own, as legitimate security measures may trigger similar process executions.

  ### Investigation Steps

  - **Validate process creation:** Check for Security Event related to process creation, specifically focusing on Event ID 1 from Sysmon or equivalent Linux logs, filtering for any scripts running alongside Trufflehog or Gitleaks.

  - **Inspect command line arguments:** Review the command line parameters in the process creation events for terms like "trufflehog" or "gitleaks," which would indicate potential malicious scanning activity.

  - **Determine parent process legitimacy:** Assess the parent process information linked to the detected execution. Legitimate CI/CD processes may utilize credential scanners as part of their security checks; scrutinize the user and source context to discern if it aligns with expected activities.

  - **Check user roles and permissions:** Identify the user accounts involved in spawning these processes. High-privilege accounts or service accounts executing unexpected credential scans should raise red flags.

  - **Correlate with known vulnerabilities:** Cross-reference any findings against recent intelligence about the Shai-Hulud malware campaign or specific vulnerabilities related to the detected tools to ascertain if they’re being exploited.

  - **Evaluate system logs:** Look for unexpected file creations or network outbound connections in relevant logs (e.g., `/var/log/syslog` or `/var/log/auth.log`) that might indicate unauthorized data exfiltration following the scanning events.

  ### Prioritization

  This alert should be treated as high priority given its potential impact on data security and system integrity. The behavior detected is indicative of credential theft tactics that are actively weaponized by threat actors, making quick response critical.

  ### Blind Spots and Assumptions

  Detection may be limited if the telemetry from process creation is not adequately configured or if the detection environment lacks visibility into script interpreter activities. Legitimate DevOps routines utilizing credential scanners can trigger this alert, which must be taken into account to avoid false positives. Companion detections, such as those focusing on anomalous outbound connections or file access patterns, can reinforce coverage and provide more context to investigations.

