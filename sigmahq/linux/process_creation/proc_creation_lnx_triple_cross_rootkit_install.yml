title: Triple Cross eBPF Rootkit Install Commands
id: 22236d75-d5a0-4287-bf06-c93b1770860f
status: test
description: Detects default install commands of the Triple Cross eBPF rootkit based
  on the "deployer.sh" script
references:
- https://github.com/h3xduck/TripleCross/blob/1f1c3e0958af8ad9f6ebe10ab442e75de33e91de/apps/deployer.sh
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-05
tags:
- attack.defense-evasion
- attack.t1014
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/sudo'
    CommandLine|contains|all:
    - ' tc '
    - ' enp0s3 '
    CommandLine|contains:
    - ' qdisc '
    - ' filter '
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the installation commands associated with the Triple Cross eBPF rootkit, which often involve utilizing the `deployer.sh` script as outlined in the source repository. The rootkit is executed via sudo privileges, likely targeting Linux-based systems, and could enable an attacker to establish persistent malicious control over the compromised host. The attacker’s objectives may include maintaining stealthy access, data exfiltration, or further lateral movement within an enterprise network.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (T1070): The rootkit aims to evade detection by executing in user mode and possibly altering system behavior to mask its presence.
  - **Privilege Escalation** (T1014): Installation commands typically require elevated privileges, aligning with attempts to escalate permissions for persistent access.

  Primary data sources for effective detection include process creation logs, which will provide insight into the commands executed via the `sudo` command, enabling identification of the execution of potentially malicious scripts or commands associated with the eBPF rootkit.

  ### Investigation Steps
  - **Review Process Creation Logs**: Inspect process creation logs to identify any instances of the `sudo` command being executed alongside the keywords "tc" and "enp0s3" in the command line. This will help establish whether the rootkit installation was attempted.
  - **Analyze Command Line Arguments**: Extract and analyze command line arguments for any occurrences of "qdisc" and "filter" within processes created by high-privilege users, as these could signify malicious rootkit deployment activities.
  - **Correlate with User Activity**: Cross-reference the identified command executions with user activity logs to detect any suspicious access patterns or unauthorized user escalations leading up to the command execution.
  - **Verify System Integrity**: Conduct a systems integrity check focusing on tampered kernel parameters or suspicious eBPF programs loaded in memory that could indicate the presence of the Triple Cross rootkit.

  ### Prioritization
  The alert has been categorized as high severity due to the potential impact of a rootkit installation, which can lead to profound data breaches, exfiltration, and significant operational risks. The likelihood of occurrence is elevated since such rootkits may be utilized in targeted attacks or in exploitation scenarios of misconfigured systems.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on specific command patterns, which may not capture all variations an attacker might employ to install the rootkit. The detection logic assumes that the `sudo` command will be used in conjunction with specific parameters, which might not always hold true. Additionally, the effectiveness of this alert relies on comprehensive logging of process creation events; any misconfigurations or gaps in log retention, particularly on Linux systems, could hinder accurate detection of suspicious activities.

