title: Triple Cross eBPF Rootkit Install Commands
id: 22236d75-d5a0-4287-bf06-c93b1770860f
status: test
description: Detects default install commands of the Triple Cross eBPF rootkit 
  based on the "deployer.sh" script
references:
- https://github.com/h3xduck/TripleCross/blob/1f1c3e0958af8ad9f6ebe10ab442e75de33e91de/apps/deployer.sh
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-05
tags:
- attack.defense-evasion
- attack.t1014
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/sudo'
    CommandLine|contains|all:
    - ' tc '
    - ' enp0s3 '
    CommandLine|contains:
    - ' qdisc '
    - ' filter '
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the installation commands associated with the Triple Cross eBPF rootkit, specifically monitoring for the use of the `sudo` command along with specific arguments typically found in the "deployer.sh" script. The likely attacker objective is to establish persistent and stealthy rootkit functionality on a Linux host, enabling further exploitation and unauthorized access. This behavior fits within the MITRE ATT&CK framework under the "Defense Evasion" tactic (T1014: Rootkit).

  The primary telemetry source for this detection is Linux process creation logs, specifically focusing on commands executed via `sudo`. If malicious, the security impact includes compromised system integrity and unauthorized access to sensitive data or control over the system. It's important to note that this detection does NOT confirm malicious activity on its own; it only indicates the execution of commands that are commonly used by the rootkit, which may also have legitimate uses.

  ### Investigation Steps

  - **Check the process creation logs:** Review Linux process creation logs (e.g., `/var/log/auth.log` or `auditd` logs) for Event IDs that signify the execution of `sudo` with command lines containing `tc` and `enp0s3`.

  - **Correlate with network activity:** Look for corroborating evidence in network logs that might indicate unusual traffic patterns associated with the affected system or attempted connections to known malicious IPs.

  - **Identify expected behavior patterns:** Validate typical usage of `tc` commands on the system for legitimate network configuration, ensuring that any instances show expected parameters and argument usage unrelated to `enp0s3`.

  - **Investigate suspicious command lines:** Analyze the complete command line for any additional arguments or options that deviate from normal administrative practices to identify high-confidence malicious indicators.

  - **Examine system changes:** Review file system changes or newly installed files related to the rootkit, particularly looking for hidden files or modifications in directories such as `/proc`, which may indicate rootkit presence.

  - **Assess host criticality:** Determine the role of the affected host within the network; if it is a server or system with sensitive data, prioritize the investigation due to higher potential impact.

  ### Prioritization

  This alert should be treated with high severity due to its potential to indicate a serious compromise of Linux systems. Given the nature of rootkits and their ability to bypass traditional defenses, the likelihood of malicious abuse is significant, especially if the affected system handles critical operations or sensitive data.

  ### Blind Spots and Assumptions

  The detection may miss evasion techniques such as using alternative commands or scripts to achieve similar outcomes without utilizing `sudo`. An effective logging strategy is necessary, including comprehensive process auditing and `sudo` command logging. Legitimate administrative actions, particularly related to network configuration, might trigger this alert. A related detection to consider would be monitoring for suspicious changes in network interfaces or traffic shaping rules, given that the rootkit is heavily network-centric.

