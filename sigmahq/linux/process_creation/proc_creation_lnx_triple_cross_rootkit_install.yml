title: Triple Cross eBPF Rootkit Install Commands
id: 22236d75-d5a0-4287-bf06-c93b1770860f
status: test
description: Detects default install commands of the Triple Cross eBPF rootkit 
  based on the "deployer.sh" script
references:
- https://github.com/h3xduck/TripleCross/blob/1f1c3e0958af8ad9f6ebe10ab442e75de33e91de/apps/deployer.sh
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-05
tags:
- attack.stealth
- attack.t1014
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/sudo'
    CommandLine|contains|all:
    - ' tc '
    - ' enp0s3 '
    CommandLine|contains:
    - ' qdisc '
    - ' filter '
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This detection targets the installation commands associated with the Triple Cross eBPF rootkit, specifically those invoked via the `deployer.sh` script. The likely attacker objective is to establish a persistent foothold on a Linux system while maintaining stealth, leading to unauthorized access and control. The relevant MITRE ATT&CK tactic is **Persistence**, specifically technique **T1014: Rootkit**. The primary telemetry source is process creation logs on Linux systems, capturing details from commands run with escalated privileges.

  If successful, the malicious installation can facilitate further exploitation by enabling code execution and data exfiltration without detection. However, it's important to note that this detection does NOT confirm the execution of malicious code; it only indicates that a process was invoked with commands consistent with the Triple Cross installation.

  ### Investigation Steps

  - **Identify the command execution:** Review process creation logs (e.g., `/var/log/auth.log`) for entries associated with `sudo` that include the strings `tc`, `enp0s3`, `qdisc`, and `filter`. Look for Event ID 1 from Systemd journal logs indicating invocation via `sudo`.

  - **Verify command legitimacy:** Assess previous contexts for `tc` (traffic control) commands in your environment. Document instances where legitimate network configuration changes have been executed, indicating that such commands may not always be malicious.

  - **Check for unexpected network changes:** Look at the output of network interface configurations related to `enp0s3`. Use `ip link show enp0s3` and identify if there were any unauthorized modifications during the same timestamp as the detected command.

  - **Cross-reference with known indicators:** Investigate the system for known components of the Triple Cross rootkit by searching for suspicious files or processes, such as those listed in the deployer script (check `/tmp` and user home directories).

  - **Audit system user behavior:** Examine user activity around `sudo` access in the context of `deployer.sh` execution. Validate whether the invoking user has a legitimate reason for running this script or command.

  ### Prioritization

  The severity of this alert is high due to the potential impact on critical systems, as the Triple Cross rootkit can lead to extensive data compromise and persistence. The likelihood of exploitation is significant since this specific rootkit has been weaponized and is known for targeting enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be evaded by advanced attackers using alternative command line arguments or executing scripts through different means, making it essential to monitor various execution methods. Comprehensive process creation logs and elevated privilege audit logs are necessary for reliable detection; ensure your environment captures this data correctly. Legitimate activities such as network interface tuning by network administrators may inadvertently trigger this alert. Consider correlating with network monitoring tools to detect unusual traffic patterns that could indicate active rootkit techniques.

