title: Disable Or Stop Services
id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
status: test
description: |
  Detects the usage of utilities such as 'systemctl', 'service'...etc to stop or disable tools and services on Linux systems.
  Attackers may stop or disable security tools and services to evade detection, maintain persistence, or disrupt system operations.
references:
- https://www.trendmicro.com/pl_pl/research/20/i/the-evolution-of-malicious-shell-scripts.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-15
modified: 2025-03-18
tags:
- attack.defense-impairment
- attack.t1685
- attack.impact
- attack.t1489
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/service'
    - '/systemctl'
    - '/chkconfig'
    CommandLine|contains:
    - ' stop '
    - ' disable '
  filter_main_legit_snapd:
    Image|endswith: '/systemctl'
    CommandLine|contains:
    - '--no-reload disable snap-snapd-'
    - ' stop snap-snapd-'
  filter_main_ssh_preinstall:
    Image|endswith: '/systemctl'
    ParentCommandLine|contains: 'tmp.ci/preinst upgrade'
    CommandLine|contains|all:
    - ' stop '
    - 'ssh.'
  filter_main_ubuntu_upgrade:
    ParentCommandLine|contains: '/dpkg/info/ubuntu-pro-client.prerm upgrade'
    Image|endswith: '/systemctl'
  filter_optional_aws_agent:
    Image|endswith: '/systemctl'
    CommandLine|endswith: 'snap.amazon-ssm-agent.amazon-ssm-agent.service'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activities
- Some false positives are to be expected. Apply additional filters as needed 
  before pushing to production.
level: medium
note: |
  ### Technical Context

  This rule detects the use of Linux service management commands (such as `systemctl` and `service`) to stop or disable critical system services. This behavior is indicative of an adversary attempting to disable security tools, disrupt system operations, or maintain persistence. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005) and the specific technique is "Disable or Modify Tools" (T1685).

  The primary telemetry source is from process creation logs on Linux systems, specifically targeting the command invocations associated with the stopping or disabling of services. If malicious, this activity could compromise system integrity and enable unauthorized access. Importantly, this detection alone does not confirm malicious intent without correlation to additional context or behavior.

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID 1340 (Linux process creation) looking for commands with images ending in `/service` or `/systemctl` and containing the terms 'stop' or 'disable'. Malicious indicators include unexpected service management commands on critical security services like `firewalld` or `auditd`.

  - **Correlate with system state:** Confirm if the service being disabled is critical for system defense (e.g., antivirus or firewall services). If these services are stopped unexpectedly, it may indicate malicious action.

  - **Identify benign administrative actions:** Look for known timestamps of legitimate maintenance or updates. Commands related to snap service management (like `snapd`) usually indicate benign activities if the command line includes flags like `--no-reload`.

  - **Check parent process lineage:** Identify the parent process that executed the command (e.g., upgrade scripts or administration tasks). Relevant ParentCommandLine fields should exclude common administration behavior to reduce false positives.

  - **Assess impacted services:** Validate any disabled services using `systemctl is-active <service>` and compare against expected operational services. Legitimate stopping of services typically occurs during scheduled maintenance windows.

  ### Prioritization

  This alert has medium severity. The impact is high if critical services are disabled, which can lead to significant vulnerability. The likelihood of malicious abuse is moderate, as adversaries frequently use this technique to evade detection and maintain access. This behavior is known to be weaponized in various threat scenarios.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the absence of complete process creation logs for all service modifications, making it easier for attackers to evade detection. Legitimate administrative practices (like disabling services during updates) may also trigger this rule. Companion detections, such as monitoring for unusual patterns in user behavior or authentication logs, can strengthen overall coverage against these actions.

