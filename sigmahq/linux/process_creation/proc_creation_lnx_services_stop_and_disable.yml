note: |
  ### Technical Context

  This detection rule identifies the use of utilities such as `systemctl`, `service`, or `chkconfig` to stop or disable services on Linux systems. The likely attacker objective is to disrupt security monitoring, terminate processes, or render critical services inactive, facilitating further malicious activity. This behavior falls under the MITRE ATT&CK tactic of "Defense Evasion" (T1222) and the technique "Application Layer Protocol" (T1071).

  The primary telemetry sources include Linux process creation logs, specifically capturing command execution related to system service management. If malicious, this activity could lead to critical system compromise, service outages, or evasion of other security controls. It is important to note that this detection does NOT prove malicious intent on its own, as legitimate administrative actions may trigger similar alerts.

  ### Investigation Steps

  - **Check process creation logs**: Review `/var/log/syslog` or `/var/log/messages` for Event ID entries indicating the execution of `systemctl`, `service`, or `chkconfig` commands. Look for command lines containing the terms 'stop' or 'disable'.

  - **Identify user context**: Verify the user account executing the command. If it is a non-administrative account without a legitimate purpose for stopping services, it poses a serious threat. Use the `who` or `last` commands for context.

  - **Review system service status**: Use `systemctl list-units --state=disabled` to review what services have been disabled recently. Compare against expected operational configurations to spot unauthorized changes.

  - **Correlate with other alerting mechanisms**: Cross-reference alerts related to privilege escalation or unauthorized access attempts within `/var/log/auth.log` to assess if the command was part of a broader attack.

  - **Validate expected administrative activity**: Determine if recent service modifications align with scheduled maintenance or known administrative responsibilities. Look for logged maintenance windows or scheduled scripts using standard operational logs.

  - **Monitor for similar commands**: Check if additional related commands have been executed, such as re-enabling services via `systemctl start` or configuring services back through scripts. This could indicate sophisticated attempts to maintain persistence.

  ### Prioritization

  This alert is of medium severity due to its potential impact on system operations, especially on critical Linux servers. The likelihood of malicious abuse is significant, as attackers often attempt to disable security services to carry out their activities undetected. While the behavior isn’t uncommon in legitimate settings, current trends show it frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative tasks can trigger similar alerts. Additionally, misconfigured logging settings may lead to oversight of critical process creation events. Legitimate activities, such as routine service outages for maintenance, may result in false positives. A related detection that strengthens coverage would be monitoring for unusual process creations associated with service management commands (e.g., unusually timed or from unexpected user contexts).

