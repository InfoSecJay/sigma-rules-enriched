title: Disable Or Stop Services
id: de25eeb8-3655-4643-ac3a-b662d3f26b6b
status: test
description: Detects the usage of utilities such as 'systemctl', 'service'...etc to
  stop or disable tools and services
references:
- https://www.trendmicro.com/pl_pl/research/20/i/the-evolution-of-malicious-shell-scripts.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-15
tags:
- attack.defense-evasion
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/service'
    - '/systemctl'
    - '/chkconfig'
    CommandLine|contains:
    - 'stop'
    - 'disable'
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This rule detects the use of command-line utilities such as `systemctl`, `service`, and `chkconfig` on Linux systems to stop or disable services. Attackers may employ these tools to hinder defensive operations, disable security software, or manipulate processes crucial for system integrity. By stopping essential services, adversaries aim to establish persistence, evade detection, or create a more favorable environment for further exploitation.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) as the primary objective is to evade detection mechanisms. Techniques that apply include **T1497.001 - Process Hollowing** and **T1497.002 - Uninstalling Software**, both of which highlight methods attackers may use to disable defensive capabilities. Primary sources of data for this detection rule will focus on **process creation events** that log command execution, specifically capturing arguments passed to these utilities.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for any instances where `systemctl`, `service`, or `chkconfig` commands have been executed. Pay special attention to the command line arguments to identify intended actions like "stop" or "disable."
  - **Correlate User Activity:** Check the context of the commands by reviewing user activity logs and correlating them with the command execution times. Identify any anomalous user accounts or unexpected times of operation.
  - **Assess System Configurations:** Investigate the state of services on affected systems before and after the identified commands were executed. Check for any critical services that have been stopped or disabled excessively.
  - **Identify Intent:** Determine if the detected commands align with legitimate administrative tasks by verifying against standard operating procedures and change management policies within the organization.

  ### Prioritization
  The medium severity of this alert is due to its potential impact on system security and availability. While legitimate administrative activities can trigger these alerts, the likelihood of exploitation in enterprise environments warrants close investigation for malicious behavior.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage includes environments where logging for command execution is minimal or misconfigured, leading to missed events. Additionally, the detection logic assumes that stopping or disabling services for malicious purposes is discernible from legitimate admin tasks, which may not always hold true. To ensure the effectiveness of this rule, logging configurations must be properly implemented across all Linux systems to capture complete process creation details, including comprehensive command line arguments.

