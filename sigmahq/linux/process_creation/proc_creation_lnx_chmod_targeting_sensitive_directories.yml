title: Chmod Targeting Sensitive Directories
id: 6419afd1-3742-47a5-a7e6-b50386cd15f8
status: test
description: |
  Detects chmod targeting files in sensitive directory paths on Linux systems.
  Attackers may use chmod to change permissions of files in these directories to maintain persistence, escalate privileges, or disrupt system operations.
references:
- https://www.intezer.com/blog/malware-analysis/new-backdoor-sysjoker/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1222.002/T1222.002.md
author: 'Christopher Peacock @SecurePeacock, SCYTHE @scythe_io'
date: 2022-06-03
modified: 2026-03-18
tags:
- attack.defense-impairment
- attack.t1222.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/chmod'
    CommandLine|contains:
    - '/tmp/'
    - '/.Library/'
    - '/etc/'
    - '/opt/'
  filter_main_update_shells:
    CommandLine|contains: 'chmod --reference=/etc/shells'
    ParentCommandLine|endswith: '/update-shells'
  filter_main_postinst:
    CommandLine|contains: '/etc/'
    ParentCommandLine|contains|all:
    - '/var/lib/dpkg/info/'
    - '.postinst configure'
  filter_main_apt_key:
    CommandLine|startswith: 'chmod 700 /tmp/apt-key-gpghome.'
  filter_main_mkinitramfs:
    CommandLine|startswith: 'chmod 755 /var/tmp/mkinitramfs'
  filter_main_landscape:
    CommandLine: 'chmod 0775 /etc/landscape/'
  filter_main_ubuntu_apparmor:
    CommandLine: 'chmod 644 /etc/apparmor.d/tunables/home.d/ubuntu'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some false positives are to be expected. Apply additional filters as needed 
  before pushing to production.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of the `chmod` command targeting sensitive directories on Linux systems. The likely objective of an attacker utilizing this behavior is to alter file permissions to maintain persistence, escalate privileges, or disrupt operations on the system. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005) with the technique being `T1222.002 - File Permission Modification`.

  The primary telemetry sources include process creation logs from Linux systems, specifically targeting events where the `chmod` command is executed along with relevant command line arguments. If malicious, altering permissions in sensitive directories can enable attackers to exploit vulnerabilities or modify system behaviors. Importantly, this detection does NOT confirm that an attack is underway; further investigation is needed to assess intent and context.

  ### Investigation Steps

  - **Examine process creation logs**: Review process creation logs for Linux (e.g., `/var/log/auth.log` or `/var/log/syslog`), focusing on Event ID or log entries related to `chmod`. Look for unusual parent process names or commands executed by unrecognized users.

  - **Identify malicious command line patterns**: Confirm if there are instances of `chmod` modifying files in sensitive directories such as `/etc/`, `/tmp/`, or `/opt/`. Document any command line arguments used, specifically `chmod 0775 /etc/landscape/` or `chmod 700 /tmp/apt-key-gpghome.`.

  - **Profile expected behavior**: Determine what legitimate operations look like in the organization. For example, legitimate `chmod` operations might be executed by system updates or administrative tasks, typically observed in logs on regular maintenance schedules.

  - **Cross-reference user accounts**: Investigate the user account executing the `chmod` command. Your search should include checking if the user is an expected administrator or if the activity is performed by non-standard user accounts within the `/etc/passwd` file.

  - **Check for follow-on activities**: Look for subsequent logs related to file access or execution timestamps that may indicate malicious use of altered permissions, especially focusing on files previously modified by `chmod`.

  - **Evaluate script or automation tools**: Analyze the environment for authorized scripts or automation tooling that frequently utilizes `chmod`. Assess logs or directories for common patterns in their execution that might explain the changes without malicious intent.

  ### Prioritization

  This alert has medium severity due to the potential impact on sensitive directory permissions on critical systems. The likelihood of malicious abuse is moderate, as attackers often manipulate file permissions to maintain control or perform lateral movements, but these actions can also stem from misconfigured legitimate tasks being automated or executed.

  ### Blind Spots and Assumptions

  Detection can be limited by the inherent ability of attackers to obfuscate their activities using legitimate commands or scripts designed for administrative purposes, causing false positives. Required log sources include complete process creation telemetry and standard audit logs to ensure comprehensive coverage. Legitimate system administration activities, such as routine maintenance or user updates, may trigger similar alerts. Integrating other detections for file integrity monitoring, such as monitoring `auditd` logs, can strengthen overall visibility and response capabilities.

