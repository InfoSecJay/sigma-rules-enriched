title: Print History File Contents
id: d7821ff1-4527-4e33-9f84-d0d57fa2fb66
status: test
description: Detects events in which someone prints the contents of history files
  to the commandline or redirects it to a file for reconnaissance
references:
- https://github.com/sleventyeleven/linuxprivchecker/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.003/T1552.003.md
author: Florian Roth (Nextron Systems)
date: 2022-06-20
modified: 2022-09-15
tags:
- attack.reconnaissance
- attack.t1592.004
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/cat'
    - '/head'
    - '/tail'
    - '/more'
  selection_history:
  - CommandLine|contains:
    - '/.bash_history'
    - '/.zsh_history'
  - CommandLine|endswith:
    - '_history'
    - '.history'
    - 'zhistory'
  condition: all of selection*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This rule detects attempts to print the contents of user history files on Linux systems, which may indicate reconnaissance activities by an attacker. The command-line tools identified—`cat`, `head`, `tail`, and `more`—are commonly used to display file content. When an attacker gains access to a system, they may inspect user history files (such as `.bash_history`, `.zsh_history`, or other terminal history files) to gather information about past commands, potentially identifying sensitive tasks or credentials used by previous users.

  The primary objective for malicious actors is often to collect valuable insights that aid in later stages of an attack, such as privilege escalation, lateral movement, or data exfiltration. Relevant MITRE ATT&CK tactics include **Reconnaissance** (TA0043) and specific techniques such as **Accessing Command-Line History** (T1552.003). The actionable telemetry for this detection comes mainly from process creation logs, as they can reveal what commands were executed and what arguments were supplied.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate logs for any executed commands that involve `cat`, `head`, `tail`, or `more` alongside user history files (`.bash_history`, `.zsh_history`, etc.). Look for unusual user activity or multiple command invocations in a short time frame.
  - **Examine User Account Activity:** Check the activity of accounts that executed these commands for any changes in patterns or behavior, such as access during unusual times or logins from unexpected locations.
  - **Analyze User History Files:** Access the `.bash_history` and `.zsh_history` files for the affected users to identify any additional suspicious commands that may reveal more about the attacker's objectives or methods.
  - **Monitor File Access and Permissions:** Ensure that file access logs for the history files are enabled and review any non-standard permission changes or access events that could indicate an attempt to evade detection.

  ### Prioritization
  This alert carries medium severity within an enterprise environment because while legitimate administrative tasks may occasionally trigger it, the presence of command execution pertaining to history files suggests a potentially unauthorized attempt to gather sensitive information, which could precede more severe attacks.

  ### Blind Spots and Assumptions
  This detection rule relies on process creation logs, which may not capture every method an attacker could use to access or copy history files. There is an assumption that the user history files haven't been deleted or modified by attackers to cover their tracks. For this alert to function effectively, logging must be configured to capture comprehensive process creation details, including command-line arguments. If logging is insufficient or non-existent, the detection may not trigger as intended, resulting in missed malicious activities.

