title: Print History File Contents
id: d7821ff1-4527-4e33-9f84-d0d57fa2fb66
status: test
description: Detects events in which someone prints the contents of history 
  files to the commandline or redirects it to a file for reconnaissance
references:
- https://github.com/sleventyeleven/linuxprivchecker/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.003/T1552.003.md
author: Florian Roth (Nextron Systems)
date: 2022-06-20
modified: 2022-09-15
tags:
- attack.reconnaissance
- attack.t1592.004
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/cat'
    - '/head'
    - '/tail'
    - '/more'
  selection_history:
  - CommandLine|contains:
    - '/.bash_history'
    - '/.zsh_history'
  - CommandLine|endswith:
    - '_history'
    - '.history'
    - 'zhistory'
  condition: all of selection*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This rule detects instances where users print sensitive command history files to the command line or redirect this information to other files. This behavior can indicate reconnaissance activities by an attacker looking to gather information about user commands and environment configurations. The likely objective for an attacker may include gaining insights into system usage patterns or discovering vulnerabilities. This detection aligns with the MITRE ATT&CK tactic of Reconnaissance, specifically under technique T1592.004: "History and Command Line Data."

  The primary telemetry sources for this detection include Linux process creation events, specifically monitoring command-line arguments. Logs to examine include process auditing logs such as those generated by `auditd`. If the detected behavior is malicious, it may lead to unauthorized access or exposure of sensitive command history, which could contain credentials or other critical information. It is important to note that triggering this alert does NOT confirm malicious intent; legitimate administrative actions may also result in similar command patterns.

  ### Investigation Steps

  - **Review process creation events**: Lookup process creation logs (e.g., `auditd` logs) for Event ID 2264 indicating process creation. Focus on entries where `Image` ends with `/cat`, `/head`, `/tail`, or `/more` and correlate with the command line for instances of `/.bash_history`, `/.zsh_history`, or similar history files.

  - **Validate command-line arguments**: Analyze the `CommandLine` field for entries that contain or end with `/.bash_history`, `/.zsh_history`, or related terms. This includes patterns like `_history`, `.history`, or `zhistory`. Confirm if this usage aligns with legitimate activities (e.g., routine file reads by system administrators).

  - **Identify high-confidence malicious behavior**: Look for unusual timings or execution contexts, such as instances where these history files were accessed outside of expected hours or by non-administrative users, providing a higher risk threshold for further investigation.

  - **Check user account histories**: Review the account activity in `/var/log/auth.log` or equivalent to correlate access patterns prior to the process creation event. A significant deviation in user behavior may highlight a security concern.

  - **Inspect system for unauthorized file creations**: Check for newly created files that may serve as export targets for printed history data (e.g., using the `ls -lt` command in relevant directories) following detected events. Validate the legitimacy of those files against established operational practices.

  ### Prioritization

  This alert should be considered medium severity due to its potential implications for compromised systems where sensitive command history might be leveraged by an adversary. The likelihood of malicious exploitation is present, especially in environments where users are not primed for legitimate use of such commands. However, the common nature of administrative tasks may result in false positives.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited by the lack of thorough auditing of all process creations in Linux environments or if logging is improperly configured. Legitimate administrative behavior, such as routine analysis during shell sessions, may trigger the rule, leading to noise in alerts. Additionally, users with elevated privileges performing normal operations may be less scrutinized. Related detections, such as monitoring for unauthorized access to sensitive file locations or command-line input checks, would enhance coverage against potential misuse.

