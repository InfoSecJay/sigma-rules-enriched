detection:
  selection_img:
    Image|endswith: '/git'
    CommandLine|contains: ' clone '
  selection_keyword:
    CommandLine|contains:
            # Add more suspicious keywords
    - 'exploit'
    - 'Vulns'
    - 'vulnerability'
    - 'RCE'
    - 'RemoteCodeExecution'
    - 'Invoke-'
    - 'CVE-'
    - 'poc-'
    - 'ProofOfConcept'
            # Add more vuln names
    - 'proxyshell'
    - 'log4shell'
    - 'eternalblue'
    - 'eternal-blue'
    - 'MS17-'
  condition: all of selection_*
falsepositives:
- Unknown
