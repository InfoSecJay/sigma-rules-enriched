  ---

  ### Technical Context

  This rule detects the execution of the `git` command on Linux systems when it is used to clone remote repositories containing suspicious keywords, indicating potentially malicious reconnaissance activity. The likely attacker objective is to gather exploit code or proofs of concept related to known vulnerabilities, facilitating further attacks against the environment. This aligns with the MITRE ATT&CK tactic of Reconnaissance (TA0043) and the technique Subvert Trust Controls (T1593.003).

  Primary telemetry sources include process creation logs from Linux systems. Relevant log types are typically found in Syslog or auditd logs, capturing command line executions. If this behavior is malicious, it may lead to the deployment of harmful scripts or malware that could exploit the identified vulnerabilities. However, detection alone does not confirm successful exploitation or data compromise.

  ---

  ### Investigation Steps

  - **Review command line arguments:** Examine process creation logs (Syslog or auditd) for Event ID related to `git` cloning commands containing suspicious keywords (e.g., "exploit", "CVE-"). Note if the command was executed by an unauthorized user or context.

  - **Check remote repository URLs:** Validate the remote repository being cloned. If the URL points to known malicious domains or IPs, classify this as a high-confidence malicious indicator.

  - **Assess system roles:** Identify if the affected system is a critical asset (e.g., a web server or database). Cloning exploit repositories on such systems is more indicative of malicious intent.

  - **Analyze legitimate behavior:** Compare the findings to legitimate `git clone` commands usually associated with software development tasks. Such commands typically involve trusted repositories with no suspicious keywords or known exploit terms.

  - **Investigate associated artifacts:** Look for any unusual files or scripts created in the target directory after the clone operation. Confirm if any files match known exploit signatures or contain harmful code.

  ---

  ### Prioritization

  The alert severity is medium due to potential impact if exploited code is executed on critical systems. The likelihood of malicious abuse is moderate, as reconnaissance is commonly a precursor to exploitation. However, not all `git clone` operations are malicious, necessitating careful analysis.

  ---

  ### Blind Spots and Assumptions

  Detection may not capture encrypted repository cloning or command executions bypassed by anomalies in log configurations. Misconfigured or insufficient logging may lead to missed alerts, particularly in environments with high legitimate cloning activity. Related detections, such as unauthorized access to GitHub or GitLab repositories (e.g., monitoring API access), can support and strengthen overall incident coverage.

