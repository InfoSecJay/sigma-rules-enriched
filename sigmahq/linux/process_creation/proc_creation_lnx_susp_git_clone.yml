  ---

  ### Technical Context

  This Sigma rule detects the use of the `git clone` command in Linux environments, specifically when cloning repositories containing suspicious keywords associated with known vulnerabilities and exploits. The likely attacker objective is reconnaissance, where adversaries gather information or tools that could be exploited within the target environment. This behavior correlates with the MITRE ATT&CK tactic of Reconnaissance (TA0043) and technique T1593.003 (Gathering Victim Information), which includes the acquisition of code or tools relevant to facilitated attacks.

  Primary telemetry sources involve process creation events captured via Linux audit logs or syscall tracing, specifically looking for command-line arguments. If a malicious actor is responsible, it could lead to the acquisition of exploit code or other tools capable of furthering an attack. It’s important to note that this detection does NOT confirm that an intrusion has occurred; it merely indicates a potential risk that requires further investigation.

  ---

  ### Investigation Steps

  - **Investigate process creation events:** Review process creation logs (e.g., `/var/log/auth.log` or auditd logs) for the specific Event ID or command-line usage involving `git clone` to understand the context of the clone operation.

  - **Analyze command-line arguments for keywords:** Check the command line of the detected process for specific keywords such as 'exploit', 'CVE-', and 'RemoteCodeExecution'. These can indicate malicious intent. A legitimate usage may include terms like 'git clone' without these keywords.

  - **Validate repository source:** Identify the remote repository URL by inspecting the command line used. Verify the source against known legitimate repositories. Look for indicators of compromise (IoCs) or blacklisted addresses.

  - **Compare user account activity:** Examine if the user executing the command has a history of legitimate development activity or if this command is atypical for their role. Audit past command history (`~/.bash_history`) for unusual API usage patterns.

  - **Check for process parentage:** Determine the parent process ID (PPID) of the `git` command to see if it was spawned by an unusual or suspicious parent process. Malicious activity often involves unusual process chains.

  - **Monitor for subsequent activity:** After clone operations, keep watch for further suspicious commands or attempt to execute scripts from the cloned repository that may further indicate reconnaissance or exploitation attempts.

  ---

  ### Prioritization

  This alert has medium severity as it indicates potentially malicious reconnaissance activity which can precede further attacks. The likelihood of exploitation increases if the affected system is critical to operations or contains sensitive data. Such behaviors are commonly weaponized, making prompt investigation essential.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the completeness of logs; logs must be configured to capture all process executions reliably. Adversaries may employ various evasion techniques such as using obfuscated commands or legitimate-looking repository names. Legitimate development teams may sometimes clone repositories containing similar keywords in their documentation. Related detections could include monitoring for new unapproved executables or scripts derived from cloned repositories.

