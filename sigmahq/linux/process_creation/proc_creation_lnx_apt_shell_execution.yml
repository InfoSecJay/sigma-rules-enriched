title: Shell Invocation via Apt - Linux
id: bb382fd5-b454-47ea-a264-1828e4c766d6
status: test
description: |
  Detects the use of the "apt" and "apt-get" commands to execute a shell or proxy commands.
  Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/apt/
- https://gtfobins.github.io/gtfobins/apt-get/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-28
modified: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains: 'APT::Update::Pre-Invoke::='
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the invocation of the "apt" and "apt-get" commands with a specific focus on command-line arguments that include "APT::Update::Pre-Invoke::=". This behavior is indicative of potential privilege escalation or unauthorized command execution, where an attacker may attempt to leverage package management commands to execute arbitrary shell commands or manipulate system integrity. Relevant MITRE ATT&CK tactic includes "Discovery" (TA0007) with the technique "Command-Line Interface" (T1059).

  Primary telemetry sources for this rule consist of Linux process creation logs capturing command-line execution. The significant security impact includes the possibility of a compromised system where unauthorized actions are executed under elevated privileges. It is crucial to note that this detection does not confirm malicious intent on its own; legitimate admin activities may also trigger this rule.

  ### Investigation Steps

  - **Check process creation details:** Review process creation logs (e.g., Syslog or Audit logs) for Event ID 134 (Linux) and focus on fields such as `pid`, `ppid`, `cmdline`, and `uid` to identify the user executing these commands and the context around their usage.

  - **Identify command context:** Validate if the command is being utilized by known administrative users, such as `root` or system maintenance roles. Legitimate activities may include scheduled maintenance tasks that invoke updates through `apt`.

  - **Analyze command-line parameters:** Specifically check for command-line parameters following "APT::Update::Pre-Invoke::=", which can indicate an attempt to execute malicious commands. Ensure that this is not part of a legitimate software patch or update process.

  - **Correlate with system logs:** Cross-reference the invocation of these commands with system logs (e.g., `/var/log/syslog` or `/var/log/auth.log`) to identify if there were any unusual access attempts prior to executing the command, which may suggest a compromise.

  - **Check for file changes:** Investigate file modifications in key system directories (e.g., `/etc`, `/usr/bin`) around the time of apt invocation to identify any unauthorized changes or additions, indicating potential exploitation.

  ### Prioritization

  This alert carries medium severity due to the potential for privilege escalation and unauthorized access in a Linux environment. The risk is heightened if the affected system has critical infrastructure roles, as it could lead to further exploitation or lateral movement. Such command modifications are increasingly weaponized by adversaries in targeted attacks.

  ### Blind Spots and Assumptions

  The detection may not capture all methods of obtaining elevated privileges; attackers may obfuscate or manipulate command parameters to evade detection. Reliable detection requires proper logging configurations for process creations and command-line arguments on the Linux systems in scope. Legitimate actions like maintenance updates may inadvertently trigger this alert, necessitating context-aware analysis. Companion detections related to file integrity monitoring can bolster overall security coverage for unusual system behavior.

