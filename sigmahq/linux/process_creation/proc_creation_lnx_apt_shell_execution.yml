title: Shell Invocation via Apt - Linux
id: bb382fd5-b454-47ea-a264-1828e4c766d6
status: test
description: |
  Detects the use of the "apt" and "apt-get" commands to execute a shell or proxy commands.
  Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/apt/
- https://gtfobins.github.io/gtfobins/apt-get/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-28
modified: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains: 'APT::Update::Pre-Invoke::='
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies potential misuse of the `apt` and `apt-get` commands on Linux systems, specifically when these commands are used to execute shell or proxy commands. Such behavior may indicate attempts at privilege escalation or unauthorized command execution, as attackers could leverage these commands to perform actions beyond their intended privileges. The use of these package management tools in a malicious context is indicative of an attacker trying to break out of restricted environments, insinuating malicious intent.

  The relevant MITRE ATT&CK tactics for this detection include **Discovery** (TA Discovery) and specifically technique **T1083: File and Directory Discovery** and potentially **T1055: Process Injection**, depending on the command's execution context. These tactics involve gathering information about the system, executing commands, or manipulating processes in a way that might indicate persistent or escalated intrusion efforts.

  Primary data sources for this detection rule include **process creation logs**, which provide insights into command executions and their command-line arguments. Analyzing these logs can reveal suspicious usage patterns that warrant further investigation.

  ### Investigation Steps

  - **Review Process Creation Events:** Collect process creation logs around the time of the alert to identify the full command line used with `apt` or `apt-get`. Look for unusual arguments, particularly those related to unauthorized shell executions.

  - **Examine System Activity:** Investigate related system events or user activity that occurred around the same time. Check for any actions that suggest privilege escalation or unauthorized access attempts.

  - **Cross-Reference with User Accounts:** Verify the user accounts executing these commands. Look for any signs of impersonation or use of accounts that typically do not utilize package management tools.

  - **Analyze Environment Constraints:** Check if the system's configuration or user permissions should restrict the use of `apt` or `apt-get`. If these tools are used in restricted environments, further investigate the user's environment for signs of compromise.

  ### Prioritization

  This alert should be treated with medium priority under enterprise security operations due to the potential for privilege escalation and unauthorized system access, which pose significant risks to the integrity and security of the environment.

  ### Blind Spots and Assumptions

  This rule primarily focuses on the detection of command invocation patterns and may miss less obvious misuse of `apt`/`apt-get` that does not involve the command lines specified. Additionally, the detection logic assumes that appropriate process creation logs are available and that the commands would be executed with observable arguments. If logging configurations are insufficient or disabled, the detection capabilities may be impaired. Ensure that process logging is enabled and configure appropriate settings for comprehensive monitoring.

