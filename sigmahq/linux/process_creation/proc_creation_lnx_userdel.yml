note: |
  ### Technical Context
  This detection rule identifies the execution of the `userdel` command, which is utilized in Linux environments to remove user accounts and their associated files. Threat actors may exploit this command to delete user accounts as part of their operations to obfuscate their presence, prevent detection, or sabotage user access to crucial systems during an attack. By deleting users, attackers can hinder incident response efforts and consolidate their control over compromised systems.

  The scenario often aligns with privilege escalation or post-exploitation activities, where an intruder aims to cover their tracks and minimize the visibility of their actions post-compromise. In terms of MITRE ATT&CK framework, this behavior maps to **Impact** (TA0007) and specifically to the technique **Data Encrypted for Impact** (T1531).

  Key telemetry sources for detecting this activity include process creation logs from Linux, which capture command executions by users and can provide insight into any potentially malicious use of system binaries such as `userdel`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the Linux process creation logs for instances of `userdel` execution, paying attention to the user context and timestamps to determine if this action is part of a legitimate administrative task or potentially malicious behavior.

  - **Correlate with User Activity:** Investigate recent user account activities prior to the `userdel` command execution. Look for unusual deletions of high-privilege user accounts or the removal of service accounts that could indicate malicious intent.

  - **Analyze User Privileges:** Check the privilege level of the user who executed the `userdel` command. If the command was executed by a non-administrative user, this could indicate unauthorized actions that warrant further investigation.

  - **Collect Authentication Logs:** Gather and review authentication logs for abnormal login behavior leading up to the deletion event, such as logins from unusual IP addresses or at strange hours, which may suggest an intrusion.

  ### Prioritization
  The alert is considered medium priority due to the potential impact that the unauthorized deletion of user accounts can have on system integrity and availability. The likelihood of malicious actors utilizing this command to conceal their activities is significant, making timely investigation critical.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage could involve legitimate administrative activities leading to user deletions, which may result in false positives if not contextualized properly. The detection logic assumes that all executions of `userdel` are either unauthorized or abnormal, which may not hold true during maintenance or legitimate changes. Ensuring that comprehensive process creation logs are enabled and retained for an adequate timeframe is essential for this alert to function effectively.

