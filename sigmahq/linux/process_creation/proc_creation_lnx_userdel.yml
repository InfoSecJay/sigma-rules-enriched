note: |
  ### Technical Context

  This rule detects the execution of the `userdel` command, which is utilized to delete user accounts and their corresponding files on Linux systems. An attacker may employ this command to remove user accounts after gaining unauthorized access, thereby attempting to eliminate any evidence of their activities, such as disabling account access for users who may notice unusual activity.

  This behavior aligns with the MITRE ATT&CK framework under the tactic of "Impact" (TA0038) and the technique of "Data Manipulation" (T1531). The primary telemetry source is Linux process creation logs, specifically capturing command execution. If malicious, this action may allow an attacker to obscure their presence by deleting user accounts created for malicious purposes. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may result in similar executions.

  ### Investigation Steps

  - **Review recent `userdel` executions:** Check for Event IDs related to process creation (e.g., Syslog or audit logs) to identify when and by whom the `userdel` command was executed, focusing on timestamps and users involved.

  - **Correlate user deletions with account activity:** Investigate the account associated with the `userdel` execution. Look for recent suspicious behavior (failed logins, unusual access patterns) in authentication logs (e.g., `/var/log/auth.log`).

  - **Identify legitimate admin activities:** Determine if the command was run by an administrator user (e.g., `root` or authorized personnel) during scheduled maintenance or management tasks, which might explain regular account modifications.

  - **Inspect for batch deletions or linked commands:** Check the process history (e.g., command history of the shell, `/var/log/bash_history`) for instances where `userdel` might have been executed in conjunction with other user or group management commands that could indicate malicious intentions, e.g., `usermod`, `groupdel`.

  - **Assess account and file impact:** Review system access logs and file integrity both before and after the execution of `userdel`. Investigate if important service accounts were deleted or if sensitive files were removed.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on system security and user accessibility. Although the deletion of user accounts can be a common administrative task, its use in suspicious contexts raises concerns about potential malicious abuse, particularly if associated with other indicators of compromise.

  ### Blind Spots and Assumptions

  Detection may be limited if user deletion logs are not persistently stored or if process logging is not adequately configured, which can hinder comprehensive investigations. Legitimate administrative activities, such as user account maintenance or reassigning user roles, could trigger this alert. A related detection is the monitoring of `passwd` command executions (associated with user account manipulation) to provide a broader context of account management activities and potentially enhance visibility into administrative actions.

