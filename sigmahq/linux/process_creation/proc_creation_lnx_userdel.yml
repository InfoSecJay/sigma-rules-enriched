  ---

  ### Technical Context

  This Sigma rule detects the execution of the `userdel` command, which is used to delete user accounts and their associated files on Linux systems. Attackers may leverage this command to remove user accounts they have compromised or to erase traces of their activities. This behavior falls under the MITRE ATT&CK framework, specifically under the tactic "Impact" and technique T1531 (Account Access Removal).

  The primary telemetry source for this detection is Linux process creation logs which can capture command executions. Malicious execution of `userdel` can significantly impair the organization's security posture, especially if it is used to eliminate user accounts associated with monitoring or incident response. It is crucial to note that this detection alone does not confirm malicious intent; legitimate administrative activities may also trigger this alert.

  ---

  ### Investigation Steps

  - **Confirm process execution:**
    Check for the execution of the `userdel` command by reviewing Linux system logs, specifically looking for entries related to process creation (e.g., `/var/log/audit/audit.log` or equivalent), focusing on timestamps and the user ID that executed the command.

  - **Identify user deletion:**
    Look for specific fields showing deleted accounts, typically within the command line arguments logged in the audit log. Identify the user account(s) deleted and cross-reference with known active users to confirm legitimacy.

  - **Determine context of execution:**
    Examine the user context under which the `userdel` command was executed. Analyze the effective user ID and check whether it was a legitimate system administrator or an unexpected account with limited activity prior to execution.

  - **Investigate prior activities:**
    Review logs for suspicious activities leading up to the command execution. This may include unauthorized logins (Event ID 4624 for successful logins), unusual process creations, or any changes to user permissions (Event ID 4672).

  - **Document legitimate usage:**
    Identify the organization’s usual administrative practices regarding user account management. Compare the execution patterns of `userdel` to those expected in normal operations, such as regular user onboarding or offboarding incidents documented in the change management process.

  - **Evaluate alert correlation:**
    Look for any related alerts or activities that may indicate malicious intent, such as attempts to escalate privileges (Event ID 4672) or other process creations associated with account mismanagement prior to the user deletion.

  ---

  ### Prioritization

  This alert has medium severity. The impact of deleting user accounts can be significant, especially if those accounts are for personnel involved in security or oversight functions. However, this behavior is also a common administrative action, making it necessary to validate the context thoroughly before escalation.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if audit logging is not correctly configured on Linux systems, potentially missing key command executions. Legitimate administrative activities, such as routine account management, can trigger this alert as well. Companion detections, such as monitoring for privilege escalation activities or unusual account creations/deletions, can provide stronger context to assess whether the execution of `userdel` was malicious or benign.

