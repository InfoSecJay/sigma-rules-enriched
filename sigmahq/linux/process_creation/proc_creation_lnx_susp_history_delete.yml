logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/rm'
    - '/unlink'
    - '/shred'
  selection_history:
  - CommandLine|contains:
    - '/.bash_history'
    - '/.zsh_history'
  - CommandLine|endswith:
    - '_history'
    - '.history'
    - 'zhistory'
  condition: all of selection*
falsepositives:
- Legitimate administration activities
level: high
note: |
  ### Technical Context

  This rule detects the deletion of shell history files, such as `.bash_history` or `.zsh_history`, on Linux systems. The likely attacker objective is to cover tracks, making it harder for defenders to identify previous commands executed during a compromise or during reconnaissance efforts. This behavior aligns with the MITRE ATT&CK technique for Clear Command History (T1565.001). The primary telemetry source for this detection is process creation logs, specifically monitoring command line arguments for commands that interact with file deletions.

  If this behavior is confirmed as malicious, it can significantly impact investigations and incident response efforts, as it obscures the adversary's actions and intentions. However, it is essential to note that this detection does NOT confirm malicious behavior on its own, as legitimate administrative activities may also involve the deletion of history files.

  ### Investigation Steps

  - **Verify process creation events:** Check for Security Event ID 4688 or Sysmon Event ID 1 that show execution of commands like `/rm`, `/unlink`, or `/shred` on the system around the same time as the alert. Look for associated CommandLine arguments containing `.bash_history`, `.zsh_history`, or other history file patterns.

  - **Review command history for anomalies:** Investigate user command history files if accessible to compare with the deletion actions. Unusual command patterns or commands targeting sensitive areas indicate potential malicious intent.

  - **Assess user permissions:** Analyze the user's role and permissions using the `/etc/passwd` and `/etc/group` files to determine if the account has necessary privileges to perform file deletions. Abnormal elevation of privileges may indicate compromise.

  - **Identify legitimate activity:** Note that system administrators may delete history files for legitimate reasons, such as housekeeping. Document any permissible changes in the command structure conducted by authorized personnel.

  - **Capture event correlations:** Collect additional logs from related sources like audit logs (e.g., `auditd`) showing prior file access or modification events to establish timelines. Check for increased file system activities or unusual access patterns around these deletions.

  - **Determine high-confidence malicious indicators:** Look for repeated attempts to delete history files across multiple sessions or unusual patterns with parameterized command executions indicative of scripted or automated compromise behaviors.

  ### Prioritization

  The alert severity is high due to the potential for significant impact on system integrity and investigation processes when histories are deleted. The likelihood of malicious abuse is elevated since attackers often seek to remove traces of their actions. This behavior is frequently observed in real-world attacks aimed at post-exploitation remediation.

  ### Blind Spots and Assumptions

  This detection method has limitations; attackers may use alternative techniques to clear command histories or employ rootkits that mask their activities. Successful detection requires appropriate log configurations for file deletions and process creation events. Legitimate activities, such as routine administrative tasks or user error (accidental deletion), may also trigger this alert. Companion detections, such as monitoring for unusual file system activities (e.g., repeated access to `.bash_history`), can enhance overall coverage against obfuscation attempts.

