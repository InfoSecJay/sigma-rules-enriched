  ---

  ### Technical Context

  This Sigma rule detects the deletion of history files, such as `~/.bash_history`, typically used to remove traces of command execution on a Linux system. The likely attacker objective is to obscure malicious actions by erasing logs that could reveal their footprint. This behavior aligns with the MITRE ATT&CK technique T1565.001 (Information Manipulation: Deletion). The primary telemetry sources include Process Creation logs in Linux, particularly focusing on command-line arguments. If the behavior is malicious, it poses a significant risk as it may indicate an ongoing compromise or an attempt to cover tracks. Importantly, this detection does NOT confirm that malicious activity occurred without further context.

  ---

  ### Investigation Steps

  - **Review Process Creation Events**: Examine logs for Process Creation from `/var/log/auth.log` or Syslog entries, specifically looking for Event IDs indicating `rm`, `unlink`, or `shred` commands executed around the same time as the alert.

  - **Analyze Command-Line Arguments**: Filter logs for instances where the command-line arguments include `/.bash_history`, `/.zsh_history`, or similar (e.g., `.history`, `zhistory`). Malicious indicators include these deletion commands executed by non-administrative users.

  - **Identify Legitimate Activity**: Validate timestamps against known legitimate administrative tasks. Document changes performed by authorized users, such as cleanup activities after script executions, which often include history deletions.

  - **Correlate with User Activity Logs**: Cross-reference historical user account activity from `/var/log/auth.log` or `/var/log/secure`. Look for suspicious login patterns or sudo usage that precedes the deletion to establish contextual background.

  - **Check for Anomalous File Creation**: Look for unusually recent file creations in `/tmp` or `/var/tmp` directories that could indicate the staging of data before file deletion. Validate against `find` command outputs for analysis of timestamps.

  - **Monitor for Repeated Behavior**: Assess if this deletion occurs regularly and if associated commands (like `bash`, `zsh`, or other shells) are triggered under unusual circumstances, which might suggest an ongoing threat.

  ---

  ### Prioritization

  This alert is high severity as it involves critical filesystem changes on Linux systems, potentially indicating an intruder actively covering their tracks. The possibility of malicious abuse is significant given that attackers often delete command histories to evade detection, and the behavior is a commonly weaponized tactic.

  ---

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if logging is misconfigured or if the file history was deleted without proper logging of the process. Legitimate activities, such as system housekeeping or administrative duties, might trigger this alert, necessitating careful contextual analysis. Companion detections that enhance coverage include monitoring the creation and modification of sensitive files or directories, tracking unexpected usage of `sudo`, or analyzing anomalous command execution patterns.

