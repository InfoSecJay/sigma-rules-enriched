logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/rm'
    - '/unlink'
    - '/shred'
  selection_history:
  - CommandLine|contains:
    - '/.bash_history'
    - '/.zsh_history'
  - CommandLine|endswith:
    - '_history'
    - '.history'
    - 'zhistory'
  condition: all of selection*
falsepositives:
- Legitimate administration activities
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where history files, such as `~/.bash_history` or `~/.zsh_history`, are deleted from a Linux system. Attackers often delete these files to obscure their actions and avoid detection after executing malicious activities. By targeting these files, the attackers aim to erase evidence of their commands and activities, which could potentially inform defenders about their presence and tactics.

  The relevant MITRE ATT&CK techniques for this behavior include **T1552.003** (Inhibit System Recovery) which encompasses activities focused on covering up traces left by malicious actions. The tactic of concealing evidence aligns with the broader objective of maintaining persistence and evading detection.

  To effectively detect this behavior, the primary data source will be **process creation logs** from Linux systems. These logs will contain details about executed commands, including the presence of delete operations referencing specific history files.

  ### Investigation Steps
  - **Review Process Creation Logs**: Look for any entries in the process creation logs that show deletions involving history files, particularly commands utilizing `rm`, `unlink`, or `shred`.
  - **Analyze Command Line Arguments**: Investigate the command line arguments associated with those process creations, focusing on any that refer to `/.bash_history`, `/.zsh_history`, or similar patterns related to history file deletion.
  - **Confirm Context of Activity**: Establish whether the account executing these commands is legitimate and if the deletion is part of administrative activities. Cross-reference with user role activities and access privileges.
  - **Correlate with Other Log Sources**: If available, correlate findings with authentication logs or session records from remote access services to identify unusual access patterns or potential lateral movement.

  ### Prioritization
  This alert should be prioritized as high severity due to the serious implications of an attacker actively attempting to erase traces of their activity. Such behavior increases the likelihood of ongoing malicious activities or compromises impacting the integrity of sensitive data and systems.

  ### Blind Spots and Assumptions
  Detection may not cover legitimate administrative actions, as they could also result in deletion of history files, leading to potential false positives. The detection logic assumes that the necessary logging is already enabled for process creation events on Linux systems. Without the correct log retention settings or if they are not configured to capture command line arguments, this alert may fail to trigger on relevant malicious activity. Additionally, if alternative methods of deletion are used (such as altering the file attributes), the detection may miss these instances entirely.

