note: |
  ### Technical Context
  This detection rule identifies the invocation of the `at` or `atd` command, which are utilities commonly used to schedule tasks on Linux systems. While these tools can be employed for legitimate administrative purposes, adversaries often misuse them to establish persistence by scheduling the repeated execution of malicious code. By leveraging such capabilities, attackers can ensure that their payloads run at specified times, making detection and removal more challenging.

  In terms of the MITRE ATT&CK framework, this activity aligns with the tactics of **Persistence** and **Execution**. Specifically, it relates to the technique **T1053.002 - Scheduled Task/Job**. By understanding the misuse of scheduled tasks, Incident Response teams can identify potential adversary activity aimed at maintaining a foothold on a compromised system.

  The primary data source for this detection rule is **process creation logs** on Linux systems, which capture the details of command invocations, including the specific command used, the user that executed it, and the timestamp of execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for any instances of the `at` or `atd` commands being executed, paying particular attention to the user context and frequency of executions.
  - **Correlate with User Activity**: Validate the legitimacy of the user executing the command by checking their activity in the logs prior to the command invocation; investigate if unusual user behavior was noted.
  - **Analyze Scheduled Tasks**: Check the scheduled tasks to see what commands or scripts are set to run, and identify if they relate to known malicious behaviors or indicators of compromise.
  - **Verify System Integrity**: Conduct a review of the system for other signs of compromise, such as unusual network connections or modifications to critical files that might indicate a broader attack.

  ### Prioritization
  The alert's severity is considered low in an enterprise environment because the `at` command may be employed legitimately for scheduled tasks. However, frequent or unusual usage patterns warrant further investigation, especially if linked to users without expected administrative privileges.

  ### Blind Spots and Assumptions
  This detection rule may not identify all instances of persistent threats effectively, as advanced adversaries could use other methods for scheduling tasks that do not involve the `at` command. It assumes that process creation logging is enabled and adequately configured across all relevant systems. Additionally, the detection logic relies on recognizing the command's specific characteristics, potentially missing variant usages or alternatives that accomplish the same goals.

