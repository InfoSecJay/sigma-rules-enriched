note: |
  ### Technical Context

  This Sigma rule detects the execution of the `at` or `atd` utilities on Linux systems, which are used to schedule tasks for future execution. Adversaries commonly exploit these utilities to maintain persistence or schedule malicious payloads to run at a specified time, aligning with their strategic objectives of evading detection and establishing footholds in the environment. This detection relates to the MITRE ATT&CK tactic of **Persistence (T1053.002)** and **Execution (T1053)**.

  The primary telemetry source for this detection is the **process creation logs** from Linux systems, particularly focusing on the execution of specific images that end with `/at` or `/atd`. If malicious, the security impact could be severe as it allows attackers to execute code beyond the user's immediate control. Importantly, this detection does NOT confirm that the execution is malicious in nature; legitimate administrative tasks may invoke these utilities.

  ### Investigation Steps

  - **Review process creation logs:** Check for **Syslog entries** associated with the execution of `/at` or `/atd` utilities, specifically targeting fields like `command line arguments` and `user ID` to observe who initiated the task. Look for any unusual user accounts or commands.

  - **Correlate with user behavior:** Analyze the context of regular activity by checking the **history of scheduled tasks** using `atq`. Expect legitimate users (e.g., system administrators) to have configured these tasks regularly for maintenance rather than unusual or ad hoc scheduling.

  - **Identify high-confidence malicious indicators:** Look for executions that do not originate from known administrators or that include suspicious command line parameters, such as attempts to run scripts or binaries that are not typical for your environment.

  - **Evaluate system role impact:** Determine if the affected system is critical (e.g., a server vs. a user's local machine) and assess the potential escalations linked to scheduling malicious tasks on sensitive systems versus less critical environments.

  - **Document any evasion techniques:** Note that attackers may obfuscate the execution of these utilities or manipulate system timestamps to disguise their activities, and establish flagging criteria for such patterns in future monitoring.

  - **Explore companion detections:** Enhance visibility by correlating findings with any alerts related to processes like cron jobs (related detection: **T1053.001 - Cron**). This could provide a broader insight into how scheduling utilities are being utilized across the environment.

  ### Prioritization

  The alert severity for executions of `at` or `atd` is low, primarily because these tools can be utilized for legitimate administrative purposes. However, the potential for abuse exists, particularly on critical systems, making it important to confirm the intent behind their use.

  ### Blind Spots and Assumptions

  Detection may be limited if process execution logs are not fully captured across all relevant systems, leaving a gap in visibility. Additionally, legitimate administrative tasks may trigger this alert, which could skew the detection results. Related detections, such as those targeting cron jobs, can provide complementary coverage and a clearer picture of potential malicious scheduling activities.

