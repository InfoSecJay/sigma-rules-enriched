  ---

  ### Technical Context

  This Sigma rule detects the execution of the `at` or `atd` commands, which are utilities used to schedule tasks in Unix/Linux environments. Adversaries may leverage these commands to maintain persistence or schedule the execution of malicious scripts or binaries at future times, aligning with their objectives to retain access and execute code without raising immediate alarms. The relevant MITRE ATT&CK tactic and technique are Execution (T1053.002).

  The primary telemetry sources for this detection are Linux process creation logs, specifically focused on the execution of scheduled task commands. If malicious, the impact could include persistent malware that executes at scheduled intervals. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger the alert.

  ---

  ### Investigation Steps

  - **Check process creation logs:** Inspect `/var/log/secure` or using syslog for entries indicating the execution of the `at` or `atd` commands. Look for lines containing the text `at` or `atd` and note the user initiating the command.

  - **Validate user activity:** If a non-administrative user executed the command, this may indicate malicious activity. Cross-reference the username with authorized personnel to determine legitimacy.

  - **Review scheduled jobs:** Use the command `atq` to list jobs scheduled by the `at` utility. Confirm if any jobs are anomalous for the user role or organization context, including any execution of unusual scripts.

  - **Identify malicious indicators:** Check for unusual or suspicious scripts scheduled for execution. Specifically, look for paths containing tmp directories or non-standard executables (e.g., binaries not typically used by legitimate processes).

  - **Examine recent history changes:** Review `/var/log/auth.log` (or equivalents) for any recent changes to user privileges or group memberships that indicate potential privilege escalation or unauthorized access.

  - **Look for legitimate usage patterns:** Determine if similar scheduled tasks have been used historically by system administrators for legitimate purposes to differentiate benign from suspicious activity.

  ---

  ### Prioritization

  This alert has low severity in the context of regular enterprise operations. While the likelihood of malicious abuse is present, especially in environments where unauthorized access may occur, the execution of scheduled tasks is also commonplace for legitimate administrative purposes. As a result, careful contextual investigation is necessary without immediate escalation.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the configuration of logging for `command execution` in the Linux environment, which may not always capture every instance. Legitimate administration activities may frequently trigger this alert, such as scheduled backups or routine maintenance tasks. For enhanced coverage, companion detections for unusual cron job creations (`cron` execution logs) should be utilized to complement alerts around scheduled tasks.

