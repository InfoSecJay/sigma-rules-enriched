title: ESXi VSAN Information Discovery Via ESXCLI
id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
status: test
description: Detects execution of the "esxcli" command with the "vsan" flag in 
  order to retrieve information about virtual storage. Seen used by malware such
  as DarkSide.
references:
- https://www.trendmicro.com/en_us/research/21/e/darkside-linux-vms-targeted.html
- https://www.trendmicro.com/en_us/research/22/a/analysis-and-Impact-of-lockbit-ransomwares-first-linux-and-vmware-esxi-variant.html
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_vsan.html
author: Nasreddine Bencherchali (Nextron Systems), Cedric Maurugeon
date: 2023-09-04
tags:
- attack.discovery
- attack.execution
- attack.t1033
- attack.t1007
- attack.t1059.012
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'vsan'
  selection_cli:
    CommandLine|contains:
    - ' get'
    - ' list'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
# Note: level can be reduced to low in some envs
level: medium
note: |
  ### Technical Context

  This rule detects the execution of the `esxcli` command with the `vsan` flag, which is utilized to query information about VMware Virtual SAN. An attacker may use this command to gather intelligence on the virtual storage layout and configuration, potentially facilitating further attacks, such as ransomware deployments. The relevant MITRE ATT&CK tactics are *Discovery* (T1087) and *Execution* (T1059.012).

  The primary telemetry source for this detection is the process creation logs from the Linux host, specifically targeting events where the command line involves `esxcli` and contains the `vsan` keyword. If malicious, the security impact could be significant, providing the attacker with insights necessary for infiltration or data encryption. It is critical to note that this detection does NOT confirm malicious intent on its own since legitimate system administrators might execute similar queries for maintenance purposes.

  ### Investigation Steps

  - **Check process execution details:** Review process creation logs for Linux (such as `/var/log/syslog` or `journalctl`) using `grep` for Event IDs related to `esxcli`. Look for entries that contain the command line flags including `vsan` or associated `get` or `list` actions.

  - **Validate user context:** Identify the user executing the command. Administrative users or processes (e.g., those running as root) may suggest legitimate activity, while unexpected users (especially non-admins) should raise suspicion.

  - **Analyze command frequency:** Determine how often `esxcli` commands that include `vsan` are executed over the past week. Frequent execution within a short timeframe or during non-business hours may indicate adversarial behavior.

  - **Compare against baseline behavior:** Review expected and frequent `esxcli` commands executed in your environment. Legitimate administrative activities usually revolve around specific maintenance tasks and do not typically include `vsan` unless related to a genuine need for virtual storage management.

  - **Identify evidence of compromise:** Look for additional indicators related to known malware behaviors, such as simultaneous suspicious file creation or network connections initiated after the `esxcli` command execution. Any outbound connections to known malicious IPs post-execution should flag an immediate response.

  ### Prioritization

  The alert severity is assessed as medium due to the impact that access to virtual storage configurations can have on an enterprise's security posture. The likelihood of malicious usage is considerable, given that this command has been linked to ransomware tactics. While not commonly weaponized as a standalone command, it serves as part of a broader reconnaissance or exploitation strategy.

  ### Blind Spots and Assumptions

  Detection is limited due to potential obfuscation tactics, where attackers may employ shell scripting or other commands to mask their usage of `esxcli`. Reliable detection requires comprehensive logging configurations on the ESXi hosts to capture all process creation events. Additionally, common administrative tasks, such as storage monitoring and management, may generate similar alerts. A related detection to enhance coverage would be monitoring for unusual access or modifications to storage resources directly after executing ESXCLI commands.

