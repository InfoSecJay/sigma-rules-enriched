title: ESXi VSAN Information Discovery Via ESXCLI
id: d54c2f06-aca9-4e2b-81c9-5317858f4b79
status: test
description: Detects execution of the "esxcli" command with the "vsan" flag in order
  to retrieve information about virtual storage. Seen used by malware such as DarkSide.
references:
- https://www.trendmicro.com/en_us/research/21/e/darkside-linux-vms-targeted.html
- https://www.trendmicro.com/en_us/research/22/a/analysis-and-Impact-of-lockbit-ransomwares-first-linux-and-vmware-esxi-variant.html
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_vsan.html
author: Nasreddine Bencherchali (Nextron Systems), Cedric Maurugeon
date: 2023-09-04
tags:
- attack.discovery
- attack.execution
- attack.t1033
- attack.t1007
- attack.t1059.012
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'vsan'
  selection_cli:
    CommandLine|contains:
    - ' get'
    - ' list'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
# Note: level can be reduced to low in some envs
level: medium
note: |
  ### Technical Context
  This rule detects the execution of the `esxcli` command on Linux systems with the specific `vsan` flag, which is typically used to retrieve information about VMware vSAN (Virtual Storage Area Network) configurations and statuses. This command usage can indicate reconnaissance activities, especially when leveraged by threat actors to gather details on a virtual infrastructure, potentially as precursors to deeper attacks, such as ransomware deployments (notably attributed to groups like DarkSide and LockBit). The attacker’s objectives may include identifying vulnerable storage configurations or mapping the virtual environment to facilitate subsequent attacks.

  This behavior relates to several MITRE ATT&CK tactics and techniques, primarily under the **Discovery** tactic. Relevant techniques include:
  - **T1033: System Owner/User Discovery**: The attacker identifies users and owners within the system to assess the environment.
  - **T1007: System Service Discovery**: This technique involves gathering information about services running in the system, which can include discovering storage configurations.
  - **T1059.012: Command and Scripting Interpreter: Unix Shell**: The use of command-line interfaces to execute potentially malicious commands.

  The primary data sources for evidence of this activity include process creation logs, which capture details about commands executed on the system, and command-line arguments used during those executions.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for instances of the `esxcli` command being executed, paying close attention to any usage of the `vsan` flag or associated `get` and `list` commands.
  - **Correlate with User Activity**: Determine if the command execution correlates with legitimate user accounts or systems typically used for administration to identify anomalous behavior potentially indicative of a threat actor.
  - **Inspect Virtual Environment Configuration**: Validate the current configurations of the VMware environment to assess if unauthorized access or information retrieval has taken place, particularly focusing on vSAN settings.
  - **Monitor Related Network Activity**: Check network traffic logs for unusual connections to external addresses from the affected ESXi hosts that may suggest data exfiltration or command-and-control communications following the reconnaissance activity.

  ### Prioritization
  Given the potential impact of this alert, which may expose critical vulnerabilities in virtual storage configurations and lead to significant data breaches or system compromises, it should be prioritized as medium to high severity in an enterprise environment, particularly where VMware infrastructure is present.

  ### Blind Spots and Assumptions
  This detection rule may not account for legitimate administrative activities that utilize `esxcli` for maintenance and configuration purposes, which could result in false positives. The detection logic assumes that all `esxcli` commands containing the specific `vsan` indications are malicious, but there may be valid contexts for this usage. Additionally, comprehensive logging of command executions and process creation events is essential for the proper functioning of this alert; any gaps in telemetry, such as disabled logging or insufficient log retention policies, could lead to missed detections.

