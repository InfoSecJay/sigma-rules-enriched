title: Shell Execution Of Process Located In Tmp Directory
id: 2fade0b6-7423-4835-9d4f-335b39b83867
status: test
description: Detects execution of shells from a parent process located in a 
  temporary (/tmp) directory
references:
- https://blogs.jpcert.or.jp/en/2023/05/gobrat.html
- https://jstnk9.github.io/jstnk9/research/GobRAT-Malware/
- https://www.virustotal.com/gui/file/60bcd645450e4c846238cf0e7226dc40c84c96eba99f6b2cffcd0ab4a391c8b3/detection
- https://www.virustotal.com/gui/file/3e44c807a25a56f4068b5b8186eee5002eed6f26d665a8b791c472ad154585d1/detection
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-06-02
tags:
- attack.execution
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    ParentImage|startswith: '/tmp/'
    Image|endswith:
    - '/bash'
    - '/csh'
    - '/dash'
    - '/fish'
    - '/ksh'
    - '/sh'
    - '/zsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of shell processes (bash, csh, dash, fish, ksh, sh, zsh) spawned from a parent process located in the `/tmp` directory. The likely attacker objective is to execute malicious scripts or commands in a temporary directory, facilitating evasion by obscuring the true origin of the process. This behavior is aligned with the MITRE ATT&CK tactic "Execution" (TA0002) and the technique "Command-Line Interface" (T1059).

  The primary telemetry sources are Linux process creation logs, particularly focused on the parent image and child image paths. If malicious, this behavior may indicate a compromise leading to the execution of unauthorized commands or malware. Importantly, this detection does NOT confirm that the behavior is inherently malicious; legitimate applications may execute shells from `/tmp`.

  ### Investigation Steps

  - **Verify parent image source:** Check process creation events (e.g., `syslog` or `auditd` logs) for Event ID 226 (Linux) to identify the complete command line used; parse the `ParentImage` field for execution context.

  - **Identify malicious shell usage:** Look for known malicious hashes or indicators associated with the detected shells using threat intelligence sources, particularly those linked with payload behavior in the `/tmp` directory. Compare file hashes against items in VirusTotal.

  - **Review legitimate usage patterns:** Confirm standard usage of `/tmp` by applications in the environment. Investigate legitimate process executions where `ParentImage` originates from known or whitelisted software; these may typically include system upgrades or software installations.

  - **Assess user context:** Examine the user account associated with the shell execution within logs (e.g., `/var/log/auth.log`) to identify if it matches authorized users. Monitor for unexpected accounts or failed authentication attempts around the same timestamp.

  - **Correlate with other behaviors:** Investigate recent file creation in `/tmp` alongside the shell execution. Use file system monitoring logs to identify if suspicious scripts or executables were created that could indicate further attempts at persistence or lateral movement.

  ### Prioritization

  This alert should be treated with high severity as it indicates a potentially dangerous behavior that may indicate unauthorized command execution. Given the nature of temporary directories being typically abused by attackers, there is a significant likelihood of malicious intent, especially if coupled with other suspicious activities.

  ### Blind Spots and Assumptions

  Detection may be circumvented by adversaries using other execution techniques or legitimate applications running shells from various paths. Successful detection relies on capturing complete process creation logs, including parent-child relationships. Legitimate application updates or scheduled tasks may trigger this alert. Coupling this detection with user behavior analytics can enhance coverage by identifying anomalous patterns that deviate from the norm.

