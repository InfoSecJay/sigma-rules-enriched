note: |
  ### Technical Context
  This detection rule targets the execution of shell processes from a parent process located in the `/tmp` directory on Linux systems. The `/tmp` directory is commonly utilized for temporary storage during execution, making it a fruitful location for malicious activity, such as malware execution or scripts intended to evade detection. The execution of shells, particularly in this context, often indicates an attempt to maintain persistence or execute further malicious commands, aligning with the objectives of threat actors looking to compromise systems and move laterally within networks.

  The rule primarily relates to the MITRE ATT&CK techniques for execution, specifically under **Execution (T1203)** and potentially **Command and Scripting Interpreter (T1059)**. Attackers may leverage this technique to run commands or scripts, commonly facilitated through malware like GobRAT, which can manipulate process execution for their offensive needs. By monitoring processes originating from the `/tmp` directory, analysts can identify indicators of compromise before they lead to significant security incidents.

  Key telemetry sources for this detection include process creation events, which hold essential details about executed commands, their parent processes, and the paths from which they were launched. Monitoring these logs can help security teams identify suspicious execution patterns and respond accordingly.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze recent process creation logs for instances where shell processes (bash, sh, etc.) are launched from any parent processes located in the `/tmp` directory.

  - **Evaluate Parent Process Details:** Identify and investigate the parent processes that initiated the shell commands, checking for their origins, execution context, and behaviors that could indicate malicious activity.

  - **Correlate with Other Security Events:** Look for associated events across other logs, such as file access logs in `/tmp`, network connections originating from the shell processes, or anomalous user activity during the time of execution.

  - **Assess System Integrity:** Confirm that no unauthorized scripts or executables exist in the `/tmp` directory, and perform a broader analysis of the system for any indicators of compromise related to malware exploitation.

  ### Prioritization
  This alert's severity is classified as high due to the potential for significant impact on system integrity and the likelihood of malicious actors leveraging this method for executing code. The execution of shells from temporary directories can be indicative of a breach or an exploit attempt, warranting prompt investigation.

  ### Blind Spots and Assumptions
  Gaps in detection coverage could arise if process creation logs are not detailed or if logging configurations do not capture all relevant activities. The detection logic assumes that the shell execution can consistently be traced back to the `/tmp` directory, and there may be legitimate use cases for processes running from this path. It's critical to ensure that process creation logging is enabled and comprehensive on target systems to maximize the reliability of this alert.

