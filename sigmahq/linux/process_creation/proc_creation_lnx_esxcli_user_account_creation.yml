logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/esxcli'
    CommandLine|contains|all:
    - 'system '
    - 'account '
    - 'add '
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This rule detects the creation of user accounts on ESXi systems via the ESXCLI command line tool. The likely attacker objective is to establish persistent access to the virtual environment for future exploitation or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Persistence (Persistence) and the technique of Create Account (T1136) as well as Execution (Execution) under the sub-technique for Command-Line Interface (T1059.012).

  Primary telemetry sources include Linux process creation logs, specifically focusing on event details generated by the ESXCLI tool. If malicious, this activity could lead to unauthorized access and manipulation of virtualized resources. However, this detection does NOT confirm that the account creation is inherently malicious; it merely indicates that an account addition occurred through the specified command.

  ### Investigation Steps

  - **Verify the Process Creation Log:** Review process creation logs for Event IDs or equivalent records related to ESXCLI executions on the ESXi host. Look for log entries with fields indicating the Image path to `/esxcli` and confirm the command line contains the parameters `system`, `account`, and `add`.

  - **Check User Accounts for Anomalies:** Examine the user accounts created on the ESXi host for suspicious names or excessive privileges. Validate legitimate user accounts against the expected user list; unexpected or generic names (e.g., "admin123") may indicate malicious activity.

  - **Assess Logins Around the Alert Time:** Investigate login attempts and their sources before and after the account creation event. Utilize SSH logs or vCenter logs to track access patterns and confirm if the timing aligns with authorized administrative changes.

  - **Review Administration Activities:** Confirm if any scheduled maintenance or administrative activities might explain the command execution. Check for known scheduled tasks or authorized personnel activities that involve user management on the ESXi system.

  - **Analyze ESXi Configuration History:** Check configuration logs to detect recent changes in user account settings or access permissions. Compare these against a baseline if available to identify unauthorized modifications.

  ### Prioritization

  This alert has a medium severity level, as unauthorized account creation can significantly impact the security posture of the virtual environment. The likelihood of this behavior being malicious is high, especially if it coincides with other suspicious activities. This behavior is not commonly weaponized but can facilitate further malicious actions if an adversary gains access to these accounts.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations or if ESXCLI commands are executed through other tools (e.g., scripts or remote interfaces bypassing direct command execution logging). Legitimate administrative activities, such as scheduled updates or maintenance, may trigger the alert. Companion detections like SSH login attempts (T1086 - PowerShell, or similar) can further strengthen the security posture and coverage against unauthorized access attempts.

