  ### Technical Context
  This rule detects the execution of binaries located in potentially suspicious directories using the "nohup" command on Linux systems. The use of "nohup" suggests that the execution is intended to persist beyond the termination of a session, which is a common technique used by malicious actors to maintain control over compromised systems. Cybercriminals often deploy malware or other unauthorized applications in obscured paths—such as `/tmp/`—to evade detection, making this behavior particularly noteworthy.

  The threat scenario for this detection likely involves an attacker leveraging tools similar to GobRAT, known for utilizing such tactics to establish a foothold within compromised environments. These kinds of activities typically align with the following MITRE ATT&CK tactics and techniques:
  - **Execution (TA0002)**: The attacker aims to execute malicious code on the target system to achieve their objectives.
  - **System Information Discovery (T1082)**: If the command includes calls to gather system information, it reflects the reconnaissance phase of a potential intrusion.

  Primary data sources for this detection include logs from process creation events on Linux systems, which detail commands executed along with the context of their execution.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for any commands using "nohup" that target executables in the `/tmp/` directory, noting any associated command-line arguments and their origins.
  - **Correlate with File System Changes:** Check for any recently created or modified files in the `/tmp/` directory that correspond with the detected execution to assess whether they are associated with known malware.
  - **Examine User Activity:** Investigate the user accounts that triggered these nohup executions. Look for unusual patterns, such as known user accounts executing commands from non-standard locations or at unusual times.
  - **Validate Remote Connections:** If able, check for active network connections initiated by these processes. This may include unexpected outbound connections that could indicate data exfiltration or further command-and-control activity.

  ### Prioritization
  Given that the execution of binaries in obscure directories with nohup can signify malicious persistence mechanisms, this alert is categorized as high severity. The potential impact includes data breaches, unauthorized access, and system compromise, with the likelihood increasing in environments with known vulnerabilities.

  ### Blind Spots and Assumptions
  Detection logic may miss instances where the nohup command is used legitimately by authorized users for valid administrative tasks. Additionally, the coverage could be limited if process creation logs are not fully captured or if the monitoring tool is not configured to log all necessary command-line arguments. The rule assumes that `/tmp/` is indeed a suspicious location, which may not hold true in all contexts, underscoring the need to tailor monitoring to the specific environment and its operational practices.

