note: |
  ### Technical Context

  This rule detects the execution of binaries using the `nohup` command from potentially suspicious locations, specifically from the `/tmp/` directory. The typical attacker objective here is to execute malicious scripts or binaries in a manner that avoids hangup signals, maintaining persistence on compromised systems. This behavior fits within the MITRE ATT&CK framework under the tactic of Execution (TA0002) and the technique of Command and Scripting Interpreter (T1059).

  Primary telemetry sources for this detection include Linux process creation logs that capture command-line execution information. If malicious, this behavior may indicate that an adversary is attempting to run a persistent payload or other malicious activities in a stealthy manner. However, it is essential to note that this detection does NOT, on its own, confirm malicious intent or that the executed command is harmful without further context.

  ### Investigation Steps

  - **Check process creation logs:** Review Linux process logs for Event IDs associated with process creation (e.g., `syslog`, `audit.log`) to see if there are any entries indicating execution from the `/tmp/` directory with command lines that include `nohup`.

  - **Inspect command line arguments:** Analyze command line arguments used during the `nohup` execution to identify potentially malicious flags or unusual scripts being executed. Look for common indicators such as unexpected binary names or commands.

  - **Review user context:** Determine the user account that executed the command. Legitimate system processes typically run under system or known administrative users. Any unknown or suspicious user accounts executing these commands warrant further investigation.

  - **Correlate with file existence:** Validate if the file that was executed exists in the `/tmp/` directory and check its integrity. Use tools like `ls -l` or `file` to ascertain the file type and confirm whether it matches known malicious indicators or known benign behavior.

  - **Assess historical activity:** Investigate historical command usage by identifying patterns or repetitions of similar commands. Review `/var/log/auth.log` for sudo attempts by users that may correlate with this behavior.

  - **Monitor for ongoing use:** If the command was executed in an unusual manner but is also being continuously invoked, closely monitor this system for additional anomalies. Look for new processes spawned from the original command that may indicate a hidden or persistent malware infection.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact on the affected system, as binaries executed in this manner can lead to unauthorized access or system compromise. The likelihood of such behavior being malicious is significant, as attackers often use `nohup` for persistence mechanisms, particularly in environments where operations aim to avoid detection.

  ### Blind Spots and Assumptions

  Detection may be limited if logging is improperly configured or if `/tmp/` directory usage is high, resulting in noise from legitimate applications. Also, legitimate scheduled tasks may trigger this alert, such as system maintenance scripts stored in `/tmp/`. Companion detections that would enhance coverage include monitoring for anomalous access to `/tmp/`, such as unusual file creation events (e.g., `inotify` logs) and other execution logs.

