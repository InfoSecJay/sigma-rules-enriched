note: |
  ### Technical Context

  This Sigma rule detects the use of the `iptables` and `ufw` commands to flush all firewall rules and allow all network traffic. This behavior can indicate an attempt to evade detection or control of network traffic, often preceding further malicious activities, such as unauthorized data exfiltration or lateral movement within a network. The relevant MITRE ATT&CK tactic is Defense Evasion, specifically the technique T1562.004 (Impair Defenses: Process Injection). Primary telemetry sources include Linux process creation logs monitoring execution of commands including Event ID 202 (with associated command line arguments specific to iptables or UFW). The security impact of such actions can be significant, potentially allowing adversaries unrestricted access to network resources.

  This detection does not confirm that the command execution was malicious by itself; legitimate use by network administrators might also trigger alerts.

  ### Investigation Steps

  - **Review command execution context:** Check logs for Event ID 202 surrounding the alert timestamp, focusing on the user executing the command and any prior commands that might indicate administrative activity.

  - **Identify administrative roles:** Validate if the executing user is a known network administrator. Legitimate use of iptables or UFW can often be expected during maintenance or security updates; compare against typical operation logs to confirm normal administration behavior.

  - **Examine command parameters:** Analyze the command line arguments captured in the logs (e.g., `'iptables -F'`, `'ufw-logging-deny'`) to determine if they match evasive patterns. Unusual or frequent flushing (e.g., `-F` or `-X`) without corresponding legitimate configurations may indicate malicious intent.

  - **Check for additional indicators of compromise:** Look for related system activity in the same timeframe, such as unexpected network connections or unusual traffic patterns in network logs (e.g., bandwidth spikes, new outbound connections).

  - **Validate the existence of any recent policy changes:** Inspect configurations or changes made to firewall rules or related network policies around the time of the detection. Unauthorized modifications or unusual changes could suggest malicious activity.

  ### Prioritization

  This alert is of medium severity. The impact could range from low to high depending on the criticality of the affected systems and the malicious intent behind flushing firewall rules. The behavior is often weaponized by attackers seeking to evade defenses, thus warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for network administrators to execute the same commands legitimately, which may lead to false positives. Required log sources such as process creation logs must be properly configured for reliable detection. Legitimate activities, such as routine firewall updates or troubleshooting, may trigger the alert. Strong companion detections include monitoring for unusual outbound network traffic or unauthorized access to sensitive data during or shortly after firewall rule changes.

