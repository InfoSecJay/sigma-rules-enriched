logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/mount'
    CommandLine|contains|all:
    - 'hidepid=2'
    - ' -o '
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors for the execution of the "mount" command combined with the "hidepid" parameter in Linux systems. The "hidepid=2" option restricts visibility of process information, obscuring processes from other users on the system. This behavior is often leveraged by attackers to evade detection and maintain stealth during operations, particularly in scenarios involving credential theft or lateral movement within a network.

  The likely threat scenario involves an attacker who has gained access to a Linux environment and seeks to camouflage their activities. By using the hidepid parameter, potential malicious actions, such as installing rootkits or other tools, become less visible to system administrators and security personnel. The tactics and techniques aligned with this behavior include "Credential Access" (T1081) and "Defense Evasion" (T1564), both of which are critical in maintaining persistence and avoiding detection.

  The primary data sources relevant for this detection include process creation logs that capture command executions across the Linux systems, where details about executed commands and their parameters are stored.

  ### Investigation Steps
  - **Review Process Creation Logs:** Investigate logs for instances of the mount command execution with the hidepid parameter. Look for abnormal execution patterns or unexpected command usage.

  - **Correlate User Activity:** Analyze user activity preceding the command execution. Cross-reference with access logs to identify any unauthorized or unusual user actions that might indicate a compromise.

  - **Inspect System Configurations:** Check system configurations related to user access and process visibility settings. Ensure that any instances of hidepid usage are documented and validated for legitimacy.

  - **Analyze Suspicious Processes:** Identify and examine processes running concurrently with the mount command invocation. Look for known indicators of compromise (IoCs) or irregular processes that may suggest evasion tactics.

  ### Prioritization
  This alert is categorized as medium severity, as the execution of the mount command with the hidepid parameter may indicate an evasive behavior commonly associated with malicious actors attempting to conceal their actions in a compromised environment.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the reliance on process creation logs, which may not capture all instances of the command if logging is improperly configured or if the attacker takes additional steps to disguise their execution. The detection logic assumes that all relevant process activity is logged appropriately. It's essential to ensure that logging is enabled for command execution across all Linux servers, specifically focusing on process creation events to facilitate effective monitoring.

