note: |
  ### Technical Context

  This Sigma rule detects the execution of the "mount" command with the "hidepid=2" parameter on Linux systems. This command configuration is often used by attackers to prevent processes from being visible to other users, thereby obfuscating their malicious activities. The likely attacker objective is to execute hidden processes that may facilitate further exploitation or data exfiltration without detection.

  This behavior aligns with the MITRE ATT&CK technique: **T1564 - Hide Artifacts**. The primary telemetry source is Linux process creation logs, specifically monitoring command-line arguments for processes initiated via the "mount" command. If exploited maliciously, this behavior could lead to unauthorized access to sensitive information or escalation of privileges. However, detection of this command execution on its own does NOT confirm malicious intent; it may also result from legitimate system configurations or administrative actions.

  ### Investigation Steps

  - **Assess command execution context**: Review `/var/log/auth.log` or `syslog` for entries surrounding the time the mount command was executed. Look for user accounts performing this action, especially if the user is non-administrative or unusual for the context.

  - **Examine command line arguments**: Check process creation logs for Event ID `execve` or similar logs in `/proc/[pid]/cmdline` to validate the use of the "hidepid=2" parameter. If present, this is a high-confidence indicator of potential malicious action.

  - **Identify legitimate use cases**: Compare the impacted system's history for recent administrative activities that may involve legitimate use of mount with hidepid, particularly in high-security environments where such configurations might be warranted.

  - **Monitor for related process activity**: Investigate related processes spawned post-mount execution in `/proc/[pid]/task` or by checking processes via `ps` command. Look for known malicious tools or unusual process names that may indicate exploitation efforts.

  - **Validate file system changes**: Review `/var/log/audit/audit.log` for additional filesystem activity, especially in sensitive directories, which may imply attempts at data hiding following the mount command's execution.

  - **Check for other hides in the command**: Search for similar execution patterns in other command logs that may include arguments indicative of hiding processes, such as a repeated use of hidepid in various contexts, suggesting a pattern of evasion.

  ### Prioritization

  This alert has medium severity in an enterprise context due to the potential for significant impact on system security and the likelihood that adversaries may leverage this technique to obfuscate their activities. While the use of the "hidepid=2" parameter is not uncommon, its association with the mount command raises concerns about possible malicious intent, especially in multi-user environments.

  ### Blind Spots and Assumptions

  The detection may be limited by common evasion techniques, such as attackers using different parameters for the mount command or leveraging other methods to hide processes (e.g., rootkits). Reliable detection requires logging that captures command-line arguments and process creation events; without such logs, detection may be incomplete. Additionally, legitimate administrative tools and system maintenance actions may trigger this alert, necessitating further context to distinguish between benign and malicious behavior. Related detections, such as monitoring for unusual user account activity or the execution of commonly abused commands, would strengthen coverage in this area.

