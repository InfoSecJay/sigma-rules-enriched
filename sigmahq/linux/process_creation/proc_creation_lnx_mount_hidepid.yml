note: |
  ### Technical Context

  This rule detects the execution of the `mount` command with the `hidepid=2` parameter on a Linux system. The `hidepid` option is used to restrict process visibility, potentially allowing an attacker to conceal malicious processes from other users, thereby facilitating stealthy operations.

  The relevant MITRE ATT&CK tactics are "Credential Access" (TA0006) and "Stealth" (TA0005), specifically technique T1564, which focuses on hiding malicious activities. The primary telemetry source is Unix/Linux process creation logs, specifically monitoring executions of the `mount` command. If malicious, such activity could significantly reduce visibility into system processes, allowing an adversary to operate undetected. Importantly, this detection does not confirm malicious intent on its own; legitimate uses of the `mount` command may also involve the `hidepid` parameter.

  ### Investigation Steps

  - **Review process execution details**: Check Security Event logs for Event ID 1 from Sysmon for instances of `mount` executed with the `hidepid=2` parameter. Examine the CommandLine field for suspicious flags and context to determine the legitimacy of the call.

  - **Identify system user context**: Cross-reference the executing user account with known administrative or service accounts. Unusual executions under non-admin accounts may signal malicious activity.

  - **Verify expected behavior**: Compare this instance against normal operational procedures; legitimate scripts or applications on the system should typically not invoke `mount` with `hidepid=2`. Document any confirmed benign activity to refine detection capabilities.

  - **Check for related suspicious processes**: Investigate other active processes at the time of the `mount` command execution using `ps aux` or equivalent log entries. Look for processes with unusual parent-child relationships or ones terminating shortly after.

  - **Evaluate system-critical processes**: Assess the impact of affected systems; if critical servers (e.g., web servers, database servers) are involved, prioritize further investigation due to potential risks posed by undetected malicious activity.

  ### Prioritization

  This alert should be treated with medium severity primarily due to the potential for credential access and the ability of an adversary to conceal their presence. While not all instances may indicate malicious activity, the misuse of the `hidepid` parameter is a known technique that can enable further exploitation.

  ### Blind Spots and Assumptions

  The detection is limited by the potential for legitimate administrative use of `hidepid`, which can result in false positives. Additionally, if logging is not adequately configured on the Linux environment, execution may not be captured. Regular monitoring of processes and supplementary detections, such as abnormal user process execution patterns or command history, enhance coverage and reduce the risk of stealthy adversaries.

