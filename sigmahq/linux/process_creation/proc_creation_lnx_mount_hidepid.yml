  ---

  ### Technical Context

  This Sigma rule detects the execution of the "mount" command with the "hidepid=2" parameter on Linux systems. This behavior can be indicative of an attacker attempting to hide processes from other users, thereby concealing malicious activity or established persistence mechanisms. The likely attacker objective is to evade detection by both system users and security monitoring tools.

  This detection aligns with the MITRE ATT&CK framework under the tactic "Credential Access" and technique "Exploitation for Credential Access" (T1564). The primary telemetry sources are Linux process creation logs, specifically events associated with process execution. If malicious, this could allow an attacker to operate covertly on the system without exposure or immediate detection. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may invoke similar command parameters.

  ---

  ### Investigation Steps

  - **Check process execution logs:** Review process creation logs for relevant Events associated with PID and command line from `/var/log/audit/audit.log` or via `journalctl -u auditd`. Malicious indicators include any use of "mount" featuring `hidepid=2`.

  - **Assess user permissions:** Determine the user account that executed the command by correlating the PID with the user context. Anomalous accounts or those lacking administrative privileges executing this command should raise red flags.

  - **Identify legitimate use cases:** Review your organization's operational procedures for legitimate instances of using the `mount` command with the `hidepid=2` parameter to ensure that no unintentional configurations or processes are being flagged.

  - **Investigate related network activity:** Check for unusual network connections or established connections from the host around the same time using `netstat -tulnp` or checking `/var/log/secure`. Unnormal activities, especially from non-standard source IPs, warrant further scrutiny.

  - **Analyze file integrity:** Verify the integrity of critical system files or binaries and check for new file creation or modification timestamps using `ls -l` or `auditctl`. Unexpected changes should signal a response, especially if combined with the detected behavior.

  ---

  ### Prioritization

  The alert is rated as medium severity due to the potential for significant impact if a critical system is compromised, allowing unauthorized data access or manipulation. The likelihood of malicious abuse is moderate, as the behavior can be weaponized by adversaries to conceal their activities. It’s important to take this alert seriously, especially in environments where sensitive information is handled.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternative methods or tools to mount filesystems without using the "hidepid" parameter. Reliable detection requires full logging capability on process creation events; ensure your server configurations include process accounting. Additionally, legitimate users, particularly system administrators, may execute this command for valid reasons. Companion detections, such as abnormal login behaviors or monitoring for unauthorized user account creations, can strengthen overall detection and response capabilities.

