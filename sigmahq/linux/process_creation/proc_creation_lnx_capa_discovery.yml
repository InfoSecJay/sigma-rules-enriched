note: |
  ### Technical Context
  This detection rule focuses on identifying the usage of the `getcap` binary in a Linux environment. The `getcap` command is commonly employed by attackers to discover potential binaries on the system that possess capabilities which may allow them to execute processes with elevated privileges. This behavior often indicates reconnaissance activity aimed at identifying attack vectors, such as GTFOBins, which can be leveraged for privilege escalation or system compromise.

  Attackers utilizing this approach typically aim to gather extensive information about the environment to plan their subsequent moves, such as lateral movement or privilege escalation. By understanding which binaries have special capabilities, they can potentially manipulate these to execute malicious commands without triggering conventional security mechanisms.

  Relevant MITRE ATT&CK tactics include **Discovery** (TA0007) with the specific technique **File and Directory Discovery** (T1083). The primary data source for this detection is process creation logs on Linux systems, which capture the execution of commands and associated arguments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of the `getcap` command exhibiting unusual or unauthorized usage patterns.
  - **Analyze Command Line Arguments**: Investigate the command line passed to the `getcap` execution; especially note any use of the `-r` argument, which indicates recursive querying and may suggest more extensive scanning of the filesystem.
  - **Correlate with User Behavior**: Determine whether the user executing the command has legitimate reasons to run `getcap` or if this action is out of character for them, suggesting potential compromise.
  - **Conduct Binary Capability Reviews**: Assess the capabilities of binaries discovered from the `getcap` execution to identify any that can be exploited for privilege escalation or other malicious activities.

  ### Prioritization
  This alert is categorized as low severity; however, it should not be overlooked in an enterprise environment, as repeated attempts to discover capabilities can indicate an impending or ongoing attack, especially when combined with other anomalous behaviors.

  ### Blind Spots and Assumptions
  A potential gap in detection revolves around environments that do not log all process execution events or where `getcap` might be used legitimately by system administrators, leading to possible false positives. The detection logic assumes that the environment is configured to log command line arguments effectively. Moreover, if a user has been compromised, they might execute `getcap` through a different process or with different privileges, which this rule would not capture. Ensuring proper log configurations and enhancing visibility into process creation events is critical for effective detection.

