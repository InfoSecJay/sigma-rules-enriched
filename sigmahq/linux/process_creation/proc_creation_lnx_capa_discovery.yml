note: |
  ### Technical Context

  This Sigma rule detects the execution of the "getcap" command with the `-r` option on Linux systems. This command is typically used to identify files with capabilities, which may be leveraged by attackers for privilege escalation. The likely attacker objective is to gather information about binaries that could be exploited for privilege escalation via GTFOBins or similar techniques. This behavior correlates with the MITRE ATT&CK tactics for Discovery (TA0007) and specifically Technique T1083: File and Directory Discovery.

  The primary telemetry sources are process creation logs, specifically the execution record of the "getcap" binary. Key log fields include `Image` and `CommandLine`. If this activity is malicious, it could facilitate unauthorized privilege escalation, leading to further compromise within the environment. This detection does NOT confirm actual exploitation; it merely indicates reconnaissance activity.

  ### Investigation Steps

  - **Check process creation logs: ** Review process creation logs (Linux, `/var/log/auth.log` or `/var/log/syslog`) for Event ID 292 (Linux process creation) where `exec` shows the "getcap" command with the `-r` argument.

  - **Evaluate the command's output:** If possible, review the output generated by "getcap" for known sensitive binaries, comparing against known application lists to determine if sensitive binaries are being queried.

  - **Assess user context: ** Identify the user executing "getcap" by reviewing the logs and check if the user has administrative or unauthorized access. Legitimate usage may include system administrators performing standard permission checks.

  - **Identify process parentage: ** Analyze parent processes (e.g., `ps -f`) associated with "getcap" invocations to indicate if it was spawned by a potentially malicious process or legitimate applications.

  - **Look for frequency of use:** Examine the frequency of "getcap" executions over a time frame. Multiple executions or execution in rapid succession may indicate malicious intent compared to a single usage by an authorized user.

  ### Prioritization

  This alert is of **low severity** as the use of "getcap" may be common among administrators executing routine checks. However, given the nature of capability discovery for privilege escalation, it should be monitored closely in higher-risk environments. Unusual frequency or context may warrant escalation.

  ### Blind Spots and Assumptions

  Detection limitations include the risk of false positives from legitimate system administration activities. It is essential to configure logging for process creation and retain sufficient history for context-aware analysis. Additionally, usage of tools like `sudo` or other binaries for capability discovery might bypass alerting; therefore, companion detections targeting related tools or privilege escalation methods should be in place for comprehensive coverage.

