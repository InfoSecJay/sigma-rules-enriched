title: Enable BPF Kprobes Tracing
id: 7692f583-bd30-4008-8615-75dab3f08a99
status: test
description: Detects common command used to enable bpf kprobes tracing
references:
- https://embracethered.com/blog/posts/2021/offensive-bpf-bpftrace/
- https://bpftrace.org/
- https://www.kernel.org/doc/html/v5.0/trace/kprobetrace.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-25
tags:
- attack.execution
- attack.stealth
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains|all:
    - 'echo 1 >'
    - '/sys/kernel/debug/tracing/events/kprobes/'
    CommandLine|contains:
    - '/myprobe/enable'
    - '/myretprobe/enable'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of commands used to enable eBPF kprobes tracing on Linux systems. This action can be part of an adversary's toolkit for stealthy observability or data exfiltration, allowing them to inject probes into the kernel for monitoring system calls or modifying kernel behavior. The relevant MITRE ATT&CK tactics and techniques are Execution (TA0002) and System Interactions (T1557.001).

  The primary telemetry source is Linux process creation logs, specifically focusing on command execution details captured within the system's process auditing framework. If malicious, enabling kprobes could allow an attacker to eavesdrop on system operations, thus collecting sensitive data or facilitating further malicious activities. It’s critical to note that this detection does NOT confirm malicious intent on its own; legitimate system monitoring or debugging by administrators may also generate similar command executions.

  ### Investigation Steps

  - **Check process creation logs:** Review `auditd` logs or syslog for Process Creation Events containing CommandLine arguments matching `echo 1 > /sys/kernel/debug/tracing/events/kprobes/`. Look for unusual execution from non-administrative users.

  - **Validate enabling of kprobe commands:** Identify whether commands like `/myprobe/enable` or `/myretprobe/enable` were executed. This may be seen in `dmesg` output or `/var/log/syslog`; any unexpected context or origin warrants further investigation.

  - **Assess the user context:** Determine the user and role executing these commands. Legitimate usage is typically limited to security or performance engineers; anything from standard user accounts should raise red flags.

  - **Correlate with network activity:** Review network logs for potential data exfiltration or suspicious outbound connections initiated shortly after kprobe commands were run, especially looking for connections to untrusted IPs or unusual ports.

  - **Check for other kernel probing activities:** Examples include usage of tools like `bpftrace`. Review logs for related command executions and check for unexpected load modules in kernel space.

  ### Prioritization

  The severity of this alert is medium, as it may indicate a targeted attempt to manipulate kernel-level processes for malicious purposes. The impact can be significant if sensitive data is exposed, and while enabling kprobes is a legitimate operation, it is often weaponized in modern attack scenarios.

  ### Blind Spots and Assumptions

  Evasion techniques may include running commands in a shell or using benign processes to mask their activity. The necessity for sufficient logging configurations, such as enabling process auditing (auditd), is critical for reliable detection. Legitimate kernel debugging activities may trigger this alert; however, correlating system roles and historical behavior can provide additional context. Related detections include unusual kernel module loads, which may further strengthen the overall coverage of kernel manipulation activities.

