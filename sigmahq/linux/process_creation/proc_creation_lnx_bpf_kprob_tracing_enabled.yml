title: Enable BPF Kprobes Tracing
id: 7692f583-bd30-4008-8615-75dab3f08a99
status: test
description: Detects common command used to enable bpf kprobes tracing
references:
- https://embracethered.com/blog/posts/2021/offensive-bpf-bpftrace/
- https://bpftrace.org/
- https://www.kernel.org/doc/html/v5.0/trace/kprobetrace.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-25
tags:
- attack.execution
- attack.defense-evasion
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains|all:
    - 'echo 1 >'
    - '/sys/kernel/debug/tracing/events/kprobes/'
    CommandLine|contains:
    - '/myprobe/enable'
    - '/myretprobe/enable'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of commands used to enable BPF kprobes tracing on Linux systems. The likely attacker objective behind enabling kprobes may include detailed surveillance of kernel and process behavior, which can facilitate further exploitation or lateral movement. This detection maps to the MITRE ATT&CK tactics of **Execution** (TA0002) and **Defense Evasion** (TA0005) with techniques including **Command and Scripting Interpreter** (T1059) and **Process Injection** (T1505).

  The primary telemetry sources are Linux process creation logs, specifically focusing on the command line fields that show the execution of kprobes commands. If malicious, this could indicate an attempt to gain deeper insight into system operations or to manipulate system behavior undetected. Importantly, this detection does not confirm malicious behavior on its own, as legitimate system administrators may enable tracing for debugging purposes.

  ### Investigation Steps

  - **Examine command history for the process**: Review the command line arguments for processes associated with any alerts. Look for commands containing `echo 1 > /sys/kernel/debug/tracing/events/kprobes/...`. Expected benign activity could involve administrative tasks that aim to debug or analyze kernel functions.

  - **Validate user account conducting the activity**: Assess the user ID (UID) of the executing command. If the UID is that of a service account, assess if there are legitimate purposes for running this activity. Elevated privilege abuse increases the concern for malicious intent.

  - **Correlate with system logs**: Inspect `syslog` or `dmesg` logs for any kernel messages indicating changes in the tracing state or other suspicious kernel-level actions occurring around the same time as the detected command.

  - **Identify unusual parent processes**: Investigate the parent process ID (PPID) using `ps` or equivalent for processes executing kprobes. Legitimate commands would generally come from known administrative tools or scripts rather than obfuscated or unknown parent processes.

  - **Monitor for file modifications**: Check the Linux filesystem for changes under `/sys/kernel/debug/tracing/events/kprobes/`, especially files labeled with snippets of code or configurations that indicate a manipulation was executed recently.

  - **Identify network activity from the affected host**: Look for outbound connections or unusual network traffic patterns originating from the host where kprobes were enabled. This could include connections to C2 servers if exploitation is ongoing.

  ### Prioritization

  The severity of this alert is medium due to the potential security impact of unauthorized kernel tracing, which can be abused for reconnaissance or evasion. The likelihood of adversaries utilizing kprobes for malicious purposes is moderate, and while not ubiquitous, it is recognized in the context of sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using alternative methods to enable kprobes which are not captured by this rule, or concealing command executions through encoded scripts. The detection requires appropriate logging configurations to capture real-time process creation events. Legitimate activities may include authorized performance diagnostics by system administrators. Related detections that bolster coverage may involve monitoring suspicious process creation behaviors or command executions stemming from atypical user sessions.

