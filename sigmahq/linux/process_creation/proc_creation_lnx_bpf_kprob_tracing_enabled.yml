title: Enable BPF Kprobes Tracing
id: 7692f583-bd30-4008-8615-75dab3f08a99
status: test
description: Detects common command used to enable bpf kprobes tracing
references:
- https://embracethered.com/blog/posts/2021/offensive-bpf-bpftrace/
- https://bpftrace.org/
- https://www.kernel.org/doc/html/v5.0/trace/kprobetrace.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-25
tags:
- attack.execution
- attack.defense-evasion
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains|all:
    - 'echo 1 >'
    - '/sys/kernel/debug/tracing/events/kprobes/'
    CommandLine|contains:
    - '/myprobe/enable'
    - '/myretprobe/enable'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects attempts to enable BPF (Berkeley Packet Filter) kprobes tracing via command line actions that modify system tracing settings in a Linux environment. Attackers may leverage this technique to stealthily monitor system calls and network packet transfers, thereby gathering sensitive information or observing other processes' behavior. The suspected threat activity may be indicative of advanced persistent threats (APTs) or skilled adversaries aiming to conduct surveillance or preliminary reconnaissance on target systems.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (T1203)**: by running command line instructions that modify kernel tracing settings.
  - **Defense Evasion (T1218)**: as the action could hide malicious processes and their activities behind legitimate system functionalities.

  The primary data source for this detection lies within process creation logs, specifically monitoring command line arguments executed on Linux systems, which will provide visibility into the specific commands issued by potential attackers.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check process creation logs for any commands executed that contain `echo 1 > /sys/kernel/debug/tracing/events/kprobes/`. This will help identify attempts to manipulate BPF kprobes.

  - **Analyze Anomalous Command Patterns**: Look for unusual patterns or sequences of commands that may indicate scripting or automation, especially involving `'/myprobe/enable'` or `'/myretprobe/enable'`, which suggest an intentional probe activation.

  - **Correlate with Known Threat Indicators**: Investigate any flagged command executions in relation to known threat actors or campaigns utilizing BPF for reconnaissance, referencing threat intelligence feeds for context.

  - **Evaluate Configurations and Access Controls**: Ensure proper configurations are in place for process creation logs and review access controls to critical system features where BPF tools may be used, to limit unauthorized modifications.

  ### Prioritization
  Alerts generated by this rule should be considered medium severity due to the potential for malicious actors to both surveil and manipulate system processes, which can lead to significant impacts on data confidentiality and system integrity.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if process creation logging is not enabled or properly configured, potentially allowing malicious actions to go undetected. The detection logic assumes that the execution of specific commands directly indicates suspicious behavior, which may not always be accurate in environments where legitimate uses of such commands are present. Comprehensive logs from all relevant processes are required for the alert to function effectively and discern between legitimate administrative activities and potential malicious actions.

