logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
    - ' -name .htpasswd'
    - ' -perm -4000 '
  condition: selection
falsepositives:
- Legitimate administration activities
level: high
note: |
  ### Technical Context
  This detection rule identifies potential reconnaissance activities on Linux systems by monitoring command-line patterns that are commonly associated with gathering information about system configurations and sensitive files. Attackers often perform reconnaissance to map out a target's environment, locate valuable assets, and identify vulnerabilities before launching a more intrusive attack. In this case, the command patterns detected include searches for files like `.htpasswd`, which can contain hashed passwords, and checks for files with the SUID bit set, indicating escalated privileges that might be leveraged for further exploitation.

  Relevant MITRE ATT&CK tactics include **Reconnaissance** (TA0043) and techniques such as **File and Directory Discovery** (T1083) and **Permission Groups Discovery** (T1592.004). The primary data source for detecting this behavior will be process creation events on Linux, as they capture the command-line executions that reveal the nature of the actions being performed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation events for instances of the specific command patterns detected by the alert. Pay close attention to the context, such as the user executing the command and the time of its execution.
  - **Correlate with User Activity:** Check for anomalous user behavior around the time of the reconnaissance activity. Look for unusual login patterns or the use of privileged accounts that could indicate malicious intent.
  - **Examine System Configuration:** Verify that proper permissions are set on sensitive files and directories. Ensure that files with the SUID bit set are legitimate and that no unauthorized changes have occurred.
  - **Monitor for Follow-on Activities:** After identifying reconnaissance tactics, keep monitoring for subsequent actions such as privilege escalation attempts or lateral movement within the network that could indicate the attacker is further probing the environment.

  ### Prioritization
  This alert is classified as high severity because successful reconnaissance can lead to significant vulnerabilities being exploited, which may result in data breaches or the compromise of critical systems. The likelihood is heightened in environments with sensitive data or weak security configurations.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, primarily regarding legitimate administrative activities that may generate similar command-line executions, leading to false positives. The detection logic assumes that all reconnaissance attempts will follow the specified patterns and that process logging is properly configured to capture all relevant events. Ensuring comprehensive logging and monitoring configurations are in place will be vital for effective detection and response.

