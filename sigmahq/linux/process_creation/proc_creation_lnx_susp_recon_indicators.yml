note: |
  ### Technical Context

  This rule detects specific command patterns indicating reconnaissance activities on Linux systems, specifically searching for sensitive files and permissions. The likely attacker objective is to gather intelligence about the target environment, potentially locating files like `.htpasswd` which contain hashed credentials or identifying files with setuid permissions that may allow privilege escalation. The relevant MITRE ATT&CK techniques are "Reconnaissance" (T1592.004) and "Credential Access" (T1552.001). The primary telemetry sources involve process creation logs from Linux, capturing details such as CommandLine arguments. A successful detection of these patterns could indicate a malicious attempt to exploit sensitive data, emphasizing the need for immediate investigation. However, this detection does NOT confirm that any unauthorized access has occurred on its own.

  ---

  ### Investigation Steps

  - **Identify the command execution context:** Review process creation logs (e.g., `/var/log/audit/audit.log` or syslog) for Event IDs that show command execution, focusing on system users that should not be executing reconnaissance commands.
  - **Check for sensitive file presence:** Investigate the presence of files like `.htpasswd` in directories typical for web servers (e.g., `/var/www/`). Use commands like `find / -name .htpasswd` to verify legitimate vs. malicious searches.
  - **Assess user roles and activities:** Validate if the user executing the command has legitimate administrative roles. Expected activities for such users might include maintenance scripts that do not include suspicious search parameters.
  - **Correlate command execution with anomalies:** Cross-reference the command execution timestamps with known legitimate activities in logs to identify outlier behaviors. If the command execution occurs outside of normal operational hours, it may indicate malicious intent.
  - **Look for elevated permissions manipulation:** Check for occurrences of files with setuid permissions (e.g., `find / -perm -4000`). A legitimate system admin might regularly check permissions, but anomalous use may signify an attempt to exploit insecure binaries.
  - **Investigate the user agent and command options:** Examine additional fields in `auditd` logs to identify the complete CommandLine arguments used by processes, specifically looking for flags or options that differ from standard usage patterns for the environment.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential impact of an attacker using reconnaissance to gather sensitive information and exploit vulnerabilities on critical Linux systems. Given the nature of the commands involved, which can easily lead to credential access and privilege escalation, the likelihood of malicious abuse is significant, especially in environments with valuable assets.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging settings on all Linux systems, particularly if auditd is not correctly configured, or if verbose logging settings are not enabled. Additionally, legitimate system administration activities may inadvertently trigger this alert, such as security audits or configuration checks. Companion detections involving unusual user account behaviors or access logs to sensitive files can enhance overall coverage.

