detection:
  selection_nc:
    Image|endswith:
    - '/nc'
    - '/ncat'
  selection_flags:
    CommandLine|contains:
    - ' -c '
    - ' -e '
  selection_shell:
    CommandLine|contains:
    - ' ash'
    - ' bash'
    - ' bsh'
