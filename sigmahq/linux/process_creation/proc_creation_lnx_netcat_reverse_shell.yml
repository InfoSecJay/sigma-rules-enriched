note: |
  ### Technical Context
  This detection rule identifies potential reverse shell executions using the Netcat (`nc`) or Ncat command-line tools, particularly focusing on instances where these tools are executed with the `-e` or `-c` flags followed by a common shell executable (e.g., `bash`, `sh`). Attackers often leverage Netcat to create a reverse shell, providing them with unauthorized remote access to a compromised system. This allows them to execute commands, steal data, or pivot to other systems within the network, significantly increasing the potential damage they can inflict.

  The detected behavior is aligned with the MITRE ATT&CK tactics and techniques such as "Execution" (TA0002) and the "Command-Line Interface" technique (T1059). These tactics and techniques emphasize the use of command-line utilities to execute malicious activities, which is particularly relevant in penetration testing scenarios and real-world cyber-attacks.

  To effectively monitor for this activity, primary data sources include process creation events from Linux operating systems, which log the execution of commands and their parameters. Other relevant sources may include network telemetry for outbound connections and alerting on any command sequences that could indicate reverse shell behavior.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for the invocation of `nc` or `ncat` with the `-e` or `-c` flags, paying careful attention to any associated command shells that are used as arguments.

  - **Analyze Network Connections:** Investigate any unusual outbound network connections initiated by the process, particularly those that are not typical for your environment. Look for connections to external IPs that are not whitelisted.

  - **Correlate with User Activity:** Assess user activity and related permissions to determine whether the execution originated from a legitimate account or if it was a potential compromise of elevated privileges.

  - **Examine Script and Command History:** Collect and analyze the command history of the user to identify any preceding commands that may provide context or indicate prior suspicious activities leading up to the execution of the reverse shell.

  ### Prioritization
  The alert is categorized as high severity due to the significant risk of a successful reverse shell, which could lead to further exploitation of the network, data exfiltration, or lateral movement by an adversary. The likelihood of encountering such behavior in an enterprise environment warrants immediate investigation.

  ### Blind Spots and Assumptions
  The detection coverage may be limited by environments that do not log detailed process creation events or those that have not configured with sufficient logging detail for command-line arguments. The detection logic assumes that the execution of `nc` or `ncat` with specified flags indicates malicious behavior, which may not always be the case in environments where these tools are used legitimately for troubleshooting. Therefore, complete logging of process execution and command arguments is necessary for the alert to function as intended.

