logsource:
  category: process_creation
  product: linux
detection:
  selection_nc:
    Image|endswith:
    - '/nc.openbsd'
    - '/nc.traditional'
    - '/nc'
    - '/ncat'
    - '/netcat.openbsd'
    - '/netcat.traditional'
    - '/netcat'
  selection_flags:
    CommandLine|contains:
    - ' -c '
    - ' -e '
  selection_shell:
    CommandLine|contains:
    - ' ash'
    - ' bash'
    - ' bsh'
    - ' csh'
    - ' ksh'
    - ' pdksh'
    - ' sh'
    - ' tcsh'
    - '/bin/ash'
    - '/bin/bash'
    - '/bin/bsh'
    - '/bin/csh'
    - '/bin/ksh'
    - '/bin/pdksh'
    - '/bin/sh'
    - '/bin/tcsh'
    - '/bin/zsh'
    - '$IFSash'
    - '$IFSbash'
    - '$IFSbsh'
    - '$IFScsh'
    - '$IFSksh'
    - '$IFSpdksh'
    - '$IFSsh'
