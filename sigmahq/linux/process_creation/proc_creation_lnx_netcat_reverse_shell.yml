  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of Netcat, specifically with the `-e` or `-c` flags, which are commonly employed to create reverse shells. The likely attacker objective is to establish unauthorized remote access to the compromised host, enabling further exploitation or data exfiltration. This behavior maps to the MITRE ATT&CK technique "Command and Scripting Interpreter: Payloads" (T1059). Primary telemetry sources include Linux process creation logs, specifically focusing on command line arguments containing the identified execution patterns and shell names. If malicious, this behavior can lead to significant security breaches, such as data theft or system integrity compromise. However, this detection does NOT confirm the presence of an attacker without corroborating evidence of malicious intent or further suspicious activity.

  ### Investigation Steps

  - **Review process creation logs:** Inspect **Syslog or journal logs** for **process creation events** (e.g., `cmdline` fields) that match the criteria, specifically **Image ends with** `nc`, `ncat`, or `netcat` and containing `-e` or `-c` flags.

  - **Check command execution context:** Identify the user executing the command. Use logs from **/var/log/auth.log** to determine if the user has legitimate privileges or if they exhibit suspicious behavior that deviates from normal role-based access patterns.

  - **Investigate associated network activity:** Check for outbound network connections initiated by the process. Examine **iptables logs** or **netstat** output to confirm if the Netcat instance is trying to connect to an external IP address, particularly ones known for abuse or associated with command and control servers.

  - **Identify legitimate use cases:** In some environments, Netcat might be used for legitimate purposes, such as debugging or file transfer. Validate that other tools performing similar functions are present and acceptable for the organization.

  - **Correlate with other alerts:** Look for any additional alerts related to remote access tools or abnormal outbound connections around the same timestamp, enhancing the likelihood of confirming a malicious attempt.

  ### Prioritization

  This alert carries high severity due to the critical impact if a sensitive system is involved and the likelihood of malicious abuse, as reverse shell functionality is a common tactic employed by attackers to maintain persistence and further access to the network.

  ### Blind Spots and Assumptions

  Detection may be limited by users who could potentially have legitimate reasons for using Netcat, thereby generating false positives. Additionally, environments lacking robust logging configurations may miss critical event details necessary for effective detection and response. It's important to consider companion detections, such as monitoring for unusual outbound traffic anomalies, which could strengthen overall situational awareness regarding potential misuse of remote access tools.

