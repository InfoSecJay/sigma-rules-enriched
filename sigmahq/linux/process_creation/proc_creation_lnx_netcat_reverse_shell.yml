detection:
  selection_nc:
    Image|endswith:
    - '/nc'
    - '/ncat'
  selection_flags:
    CommandLine|contains:
    - ' -c '
    - ' -e '
  selection_shell:
    CommandLine|contains:
    - ' ash'
    - ' bash'
    - ' bsh'
    - ' csh'
    - ' ksh'
    - ' pdksh'
    - ' sh'
    - ' tcsh'
    - '/bin/ash'
    - '/bin/bash'
    - '/bin/bsh'
    - '/bin/csh'
    - '/bin/ksh'
    - '/bin/pdksh'
    - '/bin/sh'
    - '/bin/tcsh'
    - '/bin/zsh'
    - '$IFSash'
    - '$IFSbash'
    - '$IFSbsh'
    - '$IFScsh'
    - '$IFSksh'
    - '$IFSpdksh'
    - '$IFSsh'
    - '$IFStcsh'
    - '$IFSzsh'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the execution of Netcat (or Ncat) with the "-e" flag followed by various shell commands, which is often indicative of a reverse shell being established on a system. The primary objective of an attacker using this technique is to gain remote control over a compromised machine, allowing for further exploitation or data exfiltration. This activity aligns with the MITRE ATT&CK technique "Command and Control: Reverse Shell" (T1059).

  Primary telemetry sources include process creation logs, specifically from Linux systems that capture command line invocations (e.g., `auditd`, Syslog). If detected, this behavior can lead to significant security risks, such as unauthorized system access and data breaches. However, this detection does not confirm that a successful reverse shell session has been established; additional forensic investigations are necessary to validate the presence of an ongoing threat.

  ### Investigation Steps

  - **Review process creation logs:** Examine process creation logs for Event ID  execve or equivalent log entries, specifically looking for entries with the command line containing `nc`, `ncat`, and `-e` followed by any of the specified shell commands (like `/bin/bash`). Legitimate commands should not include the `-e` flag with the shell.

  - **Identify high confidence malicious indicators:** If a process running `nc` or `ncat` shows that it was invoked with command line elements such as `-e bash` or `-e sh`, escalate as a potential malicious activity. Note any suspicious parent process (e.g., if it's spawned from web server processes or scripts).

  - **Check network activity:** Investigate associated network connections on the host using `netstat` or similar tools. Look for unusual outbound connections or listening sockets directed at unknown external IP addresses, especially those established shortly after `nc` execution.

  - **Assess expected behavior:** Typical legitimate use of Netcat includes simple file transfers or local port listening without the `-e` flag. Review any recent procedures or incidents involving Netcat usage in your organization’s policies to validate legitimate context.

  - **Correlate with security policies:** Verify if any security controls or endpoint protection are in place that may log or block the execution of reverse shell attempts. This may include EDR solutions or host-based firewalls configured to alert on such behaviors.

  ### Prioritization

  The alert has a **high severity** level due to the significant impact of a compromised host and the high likelihood of this technique being weaponized by threat actors during compromise phases. The presence of a reverse shell can lead directly to data exfiltration and lateral movement within the network, thus warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging on Linux systems; ensure that process command line arguments are captured appropriately. Additionally, legitimate activities such as software testing or development tasks using Netcat may trigger this alert. A related detection to consider could be the monitoring of outbound connections that match patterns indicative of command-and-control traffic, which strengthens coverage against reverse shell activity.

