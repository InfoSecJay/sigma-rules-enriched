  product: linux
detection:
  selection_iptables_1:
    Image|endswith: '/service'
    CommandLine|contains|all:
    - 'iptables'
    - 'stop'
  selection_iptables_2:
    Image|endswith: '/service'
    CommandLine|contains|all:
    - 'ip6tables'
    - 'stop'
  selection_iptables_3:
    Image|endswith: '/chkconfig'
    CommandLine|contains|all:
    - 'iptables'
    - 'stop'
  selection_iptables_4:
    Image|endswith: '/chkconfig'
    CommandLine|contains|all:
    - 'ip6tables'
    - 'stop'
  selection_firewall_1:
    Image|endswith: '/systemctl'
    CommandLine|contains|all:
    - 'firewalld'
    - 'stop'
  selection_firewall_2:
    Image|endswith: '/systemctl'
    CommandLine|contains|all:
    - 'firewalld'
    - 'disable'
  selection_carbonblack_1:
    Image|endswith: '/service'
    CommandLine|contains|all:
    - 'cbdaemon'
    - 'stop'
  selection_carbonblack_2:
    Image|endswith: '/chkconfig'
    CommandLine|contains|all:
    - 'cbdaemon'
    - 'off'
  selection_carbonblack_3:
    Image|endswith: '/systemctl'
    CommandLine|contains|all:
    - 'cbdaemon'
    - 'stop'
  selection_carbonblack_4:
    Image|endswith: '/systemctl'
    CommandLine|contains|all:
    - 'cbdaemon'
    - 'disable'
  selection_selinux:
    Image|endswith: '/setenforce'
    CommandLine|contains: '0'
  selection_crowdstrike_1:
    Image|endswith: '/systemctl'
    CommandLine|contains|all:
    - 'stop'
    - 'falcon-sensor'
  selection_crowdstrike_2:
    Image|endswith: '/systemctl'
    CommandLine|contains|all:
    - 'disable'
    - 'falcon-sensor'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to disable security tools on Linux systems, which is a common tactic employed by attackers to circumvent defenses and maintain persistence within a compromised environment. By specifically monitoring command-line invocations related to disabling firewalls and security agents such as Carbon Black and CrowdStrike, the rule aims to highlight potentially malicious behavior indicative of an attacker seeking to enhance their operational stealth.

  The likely attacker objectives include evading detection and preparing the environment for lateral movement or data exfiltration, making this rule critical for spotting early signs of such threats. This activity falls under the MITRE ATT&CK tactic of "Defense Evasion," with techniques such as T1562.004, which pertains to disabling security tools. The primary data sources for this detection are process creation events that capture command-line arguments, enabling the detection of commands that attempt to explicitly disable security functions.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze logs for process creation events that match the identified patterns, focusing on command-line arguments that include commands like 'stop' or 'disable' with associated security tool executables such as 'firewalld', 'cbdaemon', or 'falcon-sensor'.

  - **Correlate with Security Tool Logs:** Look for corresponding logs from security tools (e.g., EDR or AV solutions) to determine if their operational status was altered around the same time as the detected commands, which may help corroborate malicious activity.

  - **Assess Admin Activity:** Evaluate legitimate administrative activities that may align with the timing of detected commands, ensuring to distinguish between potential operational changes that are authorized versus those that may indicate unauthorized access.

  - **Analyze for Compromise Indicators:** Leverage other telemetry such as network traffic logs, authentication logs, or user behavior analytics to look for signs of compromised accounts or unusual access patterns that might be associated with the actions detected.

  ### Prioritization
  Given the potential impact of disabling security tools on an enterprise network, including increased vulnerability to downstream attacks, this alert should be prioritized as medium severity. It reflects a significant operational concern, as it may indicate active attacker efforts to gain a foothold in the environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where logging of process creation events is not comprehensive or where security tools operate with different naming conventions. The detection logic assumes typical command-line patterns for disabling tools; thus, any non-standard approaches used by attackers would go undetected. Additionally, automated responses or specific configurations in the security tools must be set up to ensure accurate logging and processing of relevant events to maximize the rule's effectiveness.

