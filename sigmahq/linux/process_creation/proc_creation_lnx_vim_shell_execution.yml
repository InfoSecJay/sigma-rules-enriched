detection:
  selection_img:
    Image|endswith:
    - '/rvim'
    - '/vim'
    - '/vimdiff'
    CommandLine|contains:
    - ' --cmd'
    - ' -c '
  selection_cli:
    CommandLine|contains:
    - ':!/'
    - ':lua '
    - ':py '
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of the Vim text editor and its related commands (`rvim`, `vimdiff`) with specific command-line arguments that suggest an attempt to run shell commands or invoke other execution environments. The behavior indicates a potential privilege escalation or unauthorized command execution, as attackers may leverage Vim to escape restricted environments and execute commands. This activity aligns with the MITRE ATT&CK tactic: Discovery (ID: T1083) and the technique: Command-Line Interface (ID: T1059).

  The primary telemetry sources include process creation logs from Linux systems, specifically monitoring `/proc/*/cmdline` or other process event logs that capture command line parameters. If malicious, this activity could allow an adversary to gain control over the system, execute arbitrary commands, or maintain persistence. Notably, the detection does NOT confirm that the activity is malicious on its own; it may represent legitimate usage of Vim by authorized users.

  ### Investigation Steps

  - **Check command execution context**: Review the process execution details of detected instances, specifically focusing on the user who executed the command (`ps -aux` or similar logs). Legitimate uses of Vim typically occur under known user accounts in user-home directories, while malicious usage may originate from unexpected accounts like system or service users.

  - **Validate command line arguments**: Examine the exact command line arguments logged (e.g., through `/var/log/syslog` or other relevant logging mechanisms). Commands containing `--cmd`, `-c`, or invoking shells like `/bin/bash`, may indicate suspicious intent, especially if executing script commands not typical for the user.

  - **Correlate with user activity logs**: Check for recent user activity logs on the host (using `auditd` or similar logging) to determine if the user executed any unusual commands or had elevated privileges around the same time. Frequent usage of Vim or its variants for command execution beyond common text editing could indicate abuse.

  - **Analyze parent process relationships**: Use tools like `pstree` or `pgrep` to ascertain the parent processes related to the detected Vim executions. Malicious activity may often have unusual parent processes related to exploitation attempts or other suspicious behavior.

  - **Examine file interactions**: Investigate any written files or scripts associated with these Vim executions; check for newly created files in directories sensitive to the user or system (e.g., `/tmp`, user home directories, or configuration directories).

  - **Identify rogue processes**: Review security logs for processes running under unexpected contexts, such as suid scripts or system accounts executing Vim commands. Analyze if the executed commands correlate with known exploit techniques or lateral movement patterns.

  ### Prioritization

  This alert should be treated as high severity. The impact of successful exploitation could lead to significant compromise of host and network security, especially on critical systems. The likelihood of this technique being used by adversaries is high, as it provides an effective means of bypassing restrictions and executing commands without typical detection.

  ### Blind Spots and Assumptions

  Detection may be limited by improper log retention or lack of telemetry from affected systems, as some script-based executions could bypass logging. Legitimate activities, such as system administrators using Vim for configuration or scripting purposes, may trigger this alert. Companion detections, such as monitoring for other command-line based attacks or unauthorized privilege escalations, would enhance contextual analysis and reduce false positives.

