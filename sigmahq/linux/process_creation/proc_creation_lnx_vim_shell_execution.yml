title: Vim GTFOBin Abuse - Linux
id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
status: test
description: |
  Detects the use of "vim" and it's siblings commands to execute a shell or proxy commands.
  Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/vi/
- https://gtfobins.github.io/gtfobins/vim/
- https://gtfobins.github.io/gtfobins/rvim/
- https://gtfobins.github.io/gtfobins/vimdiff/
author: Nasreddine Bencherchali (Nextron Systems), Luc Génaux
date: 2022-12-28
modified: 2026-06-05
tags:
- attack.execution
- attack.discovery
- attack.t1059
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/rvim'
    - '/vi'
    - '/vim'
    - '/vimdiff'
    CommandLine|contains:
    - ' --cmd '
    - ' -c'
  selection_cli:
    CommandLine|contains:
    - ':!/'
    - ':!$'
    - ':!..'
    - ':lua '
    - ':py '
    - ':shell'
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/csh'
    - '/bin/ksh'
    - '/bin/zsh'
    - '/bin/tmux'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the invocation of the `vim`, `vi`, `rvim`, and `vimdiff` editors being used to execute shell commands through specially crafted command-line arguments. The behavior may indicate an attempt by an attacker to escalate privileges or execute arbitrary commands within a restricted environment. The relevant MITRE ATT&CK technique is **T1059 - Command and Scripting Interpreter**, and **T1083 - File and Directory Discovery**.

  Primary telemetry sources include Linux process creation logs, specifically monitoring `exec` events generated by tools like `auditd` or Syslog where command execution is logged. If the command execution is determined to be malicious, the impact could involve unauthorized changes to system configurations or the environment, data exfiltration, or lateral movement. However, detection alone does not confirm malicious intent, as legitimate users may employ these commands for valid administrative purposes.

  ### Investigation Steps

  - **Review the command line for suspicious patterns:** Check for command lines containing `:!`, `:/bin/`, or other unusual commands within the context of `vim`, `vi`, `rvim`, or `vimdiff` as seen in Syslog (e.g., `/var/log/syslog` or `/var/log/audit/audit.log`). Malicious use cases will often include shell commands or unusual scripts.

  - **Validate user context and permissions:** Cross-reference the user account executing the commands with acceptable user policies. Valid behavior typically includes administrative users performing authorized actions, while unknown or non-privileged accounts executing these commands may indicate malicious activity.

  - **Identify unexpected environments:** Check the execution location of the process (command path) and environmental variables. If these are executed from non-standard locations (e.g., user home directories without administrative privileges), it could indicate an evasion technique as seen in Auditd logs.

  - **Assess for related network activity:** Investigate for any outbound connections or network anomalies following the use of `vim`. For instance, examine `/var/log/secure` for suspicious SSH activities or unexpected connections immediately after the command execution.

  - **Confirm legitimate editor usage:** Determine if the command was used as part of a typical administrative task (e.g., system updates, file edits) by comparing timestamps and reviewing associated logs. Legitimate usage should connect with coordinates of normal operational activities, like scheduled maintenance.

  - **Cross-reference with established baselines:** Compare the alert against historical activity logs for the host. If similar command invocations are common without malicious outcomes, they may signify benign administrative work, which can help in contextualizing and prioritizing the current alert.

  ### Prioritization

  The severity of this alert is high, especially if it involves critical systems or sensitive data environments, as it indicates potential unauthorized command execution. The likelihood of malicious use is significant due to the common exploitation of shell capabilities via text editors in attempt to bypass security mechanisms.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as the use of non-standard execution paths or encoding commands in a manner that does not trigger the detection rule. Required log sources include insuring proper activity logging and audit configurations to capture process creation in real-time. Additionally, various legitimate activities - such as custom scripts in development environments - may inadvertently trigger this alert. Monitoring logs from other related detections, like shell invocation patterns or suspicious command combinations, can strengthen overall situational awareness.

