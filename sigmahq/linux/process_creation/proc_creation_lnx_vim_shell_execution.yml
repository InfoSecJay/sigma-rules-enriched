title: Vim GTFOBin Abuse - Linux
id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
status: test
description: |
  Detects the use of "vim" and it's siblings commands to execute a shell or proxy commands.
  Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/vim/
- https://gtfobins.github.io/gtfobins/rvim/
- https://gtfobins.github.io/gtfobins/vimdiff/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-28
modified: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/rvim'
    - '/vim'
    - '/vimdiff'
    CommandLine|contains:
    - ' --cmd'
    - ' -c '
  selection_cli:
    CommandLine|contains:
    - ':!/'
    - ':lua '
    - ':py '
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule focuses on identifying the misuse of `vim` and its related commands (such as `rvim` and `vimdiff`) for executing unauthorized shell commands. Attackers may exploit these commands to achieve unauthorized command execution or privilege escalation, particularly when they are operating in a restricted shell environment. The command-line options and syntax employed can indicate attempts to invoke shell commands or scripts that can enable further compromise of the system.

  The likely threat scenario involves attackers attempting to leverage the capabilities of `vim` as a covert means of executing shell commands, thereby breaking out of restricted environments where they may not have traditional shell access. This behavior may align with the **Execution** tactic (TA0002) in the MITRE ATT&CK framework, specifically the **Command and Scripting Interpreter** technique (T1059), where attackers attempt to execute commands in an operating system shell.

  Primary telemetry sources for detecting these behaviors include process creation logs, which capture details about the commands being executed, as well as any command-line arguments provided during execution. Monitoring for occurrences of `vim` alongside known patterns for command execution will be crucial for identifying potential malicious activities.

  ### Investigation Steps
  - **Review Process Logs**: Examine process creation logs for instances of `vim`, `rvim`, and `vimdiff` that include command-line arguments indicating potential command execution or shell spawning.
  - **Analyze Command-Line Patterns**: Look for uncommon command-line flags or patterns such as `--cmd`, `-c`, and shell invocation attempts (e.g., `/bin/bash`, `/bin/sh`), which can indicate malicious behavior.
  - **Check for Anomalous User Activity**: Investigate the context of the user initiating these commands. Specifically, consider whether they have proper permissions and whether their behavior deviates from the established baselines for normal operations.
  - **Correlate with Other Events**: Cross-reference the detected commands with other logs (e.g., authentication logs, file access logs) for signs of lateral movement or other malicious activities occurring concurrently.

  ### Prioritization
  The alert is classified as high severity due to the potential implications of unauthorized command execution, which could lead to system compromise or escalated persistent access for attackers. Given the ease with which `vim` can be exploited in this manner, prompt investigation is critical.

  ### Blind Spots and Assumptions
  Potential blind spots in detection coverage may arise from environments where standard logging is not configured for command-line arguments, or where users engage in legitimate use of `vim` that may not be scrutinized closely. The detection logic assumes that `vim` and its siblings are not used in their intended fashion for legitimate administrative tasks. For the alert to function effectively, it is crucial that comprehensive process creation logging, including command-line arguments, is enabled across the Linux hosts in question.

