title: Linux Logs Clearing Attempts
id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
status: stable
description: |
  Detects logs clearing attempts on Linux systems via utilities such as 'rm', 'rmdir', 'shred', and 'unlink' targeting log files and directories.
  Adversaries often try to clear logs to cover their tracks after performing malicious activities.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
author: Ömer Günal, oscd.community
date: 2020-10-07
modified: 2026-03-18
tags:
- attack.defense-impairment
- attack.t1685.006
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '/rm'            # covers /rmdir as well
    - '/rmdir'
    - '/shred'
    - '/unlink'
    CommandLine|contains:
    - '/var/log'
    - '/var/spool/mail'
  filter_main_legit_systat:
    Image|endswith: '/rm'
    CommandLine|startswith: 'rm -f /var/log/sysstat/'
  filter_main_dmseg:
    Image|endswith: '/rm'
    CommandLine|startswith: 'rm -f -- /var/log//dmesg'     # // before dmesg is not typo
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to clear logs on Linux systems using utilities like `rm`, `rmdir`, `shred`, and `unlink`, targeting common log file locations such as `/var/log`. The likely attacker objective is to erase traces of their activities to conceal malicious actions, thus mitigating the ability to conduct forensic analysis post-compromise. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1070.002 (Indicator Removal on Host).

  Primary telemetry sources include process creation logs (Sysmon or Linux process logs) that capture detailed command activities. The security impact of malicious log clearing can be significant, as it obstructs incident response efforts and threat detection. Importantly, this detection does not confirm that malicious activity occurred; legitimate administrative actions can also employ these commands in routine operations.

  ### Investigation Steps

  - **Review process creation logs:** Check for Sysmon Event ID 1 or Linux logs where `Image` ends with `/rm`, `/rmdir`, `/shred`, or `/unlink`, focusing on command lines containing `/var/log`. Look for multiple occurrences of these commands to establish patterns over a short timeline.

  - **Identify benign versus malicious indicators:** Confirm if the command line contains known benign usage, such as `rm -f /var/log/sysstat/`. If log clearing commands are targeting various log files indiscriminately, this may indicate malicious intent.

  - **Examine the executed command's context:** Collect additional details from `/var/log/syslog` to determine if the user context under which the logs are cleared is suspicious or unauthorized. Logins from unexpected accounts followed by log deletion attempts are particularly concerning.

  - **Validate against legitimate activity:** Cross-reference the timestamps of the log-clearing events with established maintenance schedules, ensuring that no scheduled log cleanup aligns with the timestamps seen in the alerts. Monitoring for expected system maintenance can help clarify context.

  - **Assess asset criticality:** Determine if the affected system has heightened importance or sensitivity, such as a server hosting critical applications or sensitive data. Higher priority systems demand immediate response if log clearing is confirmed as part of an intrusion.

  - **Check for file manipulation artifacts:** Investigate if files matching the names or patterns of cleared logs (e.g., `syslog`, `auth.log`) exhibit timestamps that indicate modification or deletion, confirming that log files were indeed targeted.

  ### Prioritization

  This alert should be considered medium to high priority based on the criticality of the affected system and the likelihood of misuse. Given that log clearing is a common tactic used by adversaries to evade detection, proactive investigation is critical, especially on sensitive or high-profile assets.

  ### Blind Spots and Assumptions

  Detection may be limited if log management configurations are not capturing detailed process creation logs or if logs are rotated too quickly. Evasion techniques could include using alternative commands or scripting methods not detected by this rule. Legitimate administration activities, such as scheduled log cleanup or routine maintenance, may inadvertently trigger this alert. Companion detections involving unexpected logins or abrupt changes in user activity patterns can help provide a fuller picture of potential malicious actions.

