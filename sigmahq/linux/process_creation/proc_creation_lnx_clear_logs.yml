logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '/rm'            # covers /rmdir as well
    - '/shred'
    - '/unlink'
    CommandLine|contains:
    - '/var/log'
    - '/var/spool/mail'
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts by adversaries to clear logs on Linux systems, specifically through commands designed to delete or shred log files. The primary objective of this behavior is to erase traces of malicious activity, which can impede incident response and forensic analysis. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically the technique T1070.002: Indicator Removal on Host (Clear Logs).

  The primary telemetry source for this rule is the process creation logs from Linux systems, capturing commands executed by users. If malicious, the impact can be severe, as it may indicate a compromise that could lead to data exfiltration or further malicious actions. However, this detection does NOT confirm that a compromise has occurred on its own, as legitimate administrative activities could also trigger similar log-clearing commands.

  ### Investigation Steps

  - **Validate the process execution: ** Check logs for Process Creation (e.g., `/var/log/auth.log` or `/var/log/syslog`) specifically looking for Event ID 100 or equivalent that indicates execution of commands like `/rm`, `/shred`, or `/unlink`.

  - **Review the command line arguments: ** Examine the CommandLine field in process creation logs for terms like `/var/log` or `/var/spool/mail`. Legitimate use may include system maintenance but should not occur under unusual circumstances or from unexpected users.

  - **Identify user context: ** Correlate the username associated with the log-clearing activity. Legitimate users may execute log-clearing commands during scheduled maintenance; however, unexpected users or external accounts executing such commands may be indicative of malicious intent.

  - **Track recent access to sensitive logs: ** Investigate any related access logs (e.g., `sudo` logs or system event logs) to see if there were recent suspicious attempts to access log directories prior to the clearing action, indicating potential pre-existing reconnaissance efforts.

  - **Assess for additional signs of intrusion: ** Search for other indicators of compromise that may align with log-clearing, such as unusual file modifications or access attempts, using tools like `auditd` to check for anomalous file access patterns on critical directories.

  ### Prioritization

  This alert is rated as medium severity within an enterprise context due to the potentially significant impact on security posture if log-clearing incidents are indeed adversarial in nature. Adversaries commonly employ these actions to conceal their activities, which raises the likelihood of malicious abuse if detected. Therefore, rapid investigation and validation of context are crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by logged events being overwritten or deleted by legitimate processes. Further, it assumes that log configuration captures all relevant process creation events. Legitimate administrative activities, such as routine log maintenance or debug scenarios, may trigger the detection as well. A related detection could be monitoring for unusual `sudo` usage patterns that could indicate privilege escalation attempts, providing additional context for investigations.

