logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '/rm'            # covers /rmdir as well
    - '/shred'
    - '/unlink'
    CommandLine|contains:
    - '/var/log'
    - '/var/spool/mail'
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to clear logs on Linux systems, which can indicate malicious activity aimed at obfuscating intrusions. When adversaries manage to gain unauthorized access to a system, one of their primary objectives is to eliminate traces of their activity to avoid detection. By clearing logs, attackers can cover their tracks and impede incident response efforts. The ability to erase log entries makes this tactic highly concerning as it can aid in prolonged unauthorized access and data exfiltration without detection.

  The relevant MITRE ATT&CK tactic for this detection is **Defense Evasion**, specifically the technique **T1070.002: Indicators of Compromise (IoC) Clearing**. This technique involves clearing or modifying logs that may contain proof of an intrusion or suspicious activity. In a Linux environment, this often takes place through command-line utilities designed to manage or delete files, especially those related to system logs.

  The primary telemetry sources for this detection include **process creation events**, which record commands executed on the system, along with their associated parameters. Monitoring these events provides critical insight into potentially malicious activities aimed at log clearance.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events for entries that match the alert's criteria, specifically commands involving log file management (e.g., `/rm`, `/shred`, `/unlink` targeting `/var/log` or `/var/spool/mail`).

  - **Correlate with User Activity:** Identify the user responsible for executing the detected commands and assess their privileges. Look for anomalies in their access patterns, especially focusing on unauthorized users or accounts with elevated privileges.

  - **Analyze System Logs:** Check the logs in `/var/log` for unusual gaps or missing entries around the time of the detected command execution. Look for evidence of prior activity that might have been cleared.

  - **Investigate Related System Changes:** Determine if any significant changes to the system or user accounts occurred during the timeline of the detected log-clearing actions, indicating a potential compromise or administrative error.

  ### Prioritization
  The alert is classified as medium severity due to the potential impact of an attacker clearing logs. Although not always indicative of an active compromise, the likelihood of attackers deleting logs suggests a need for immediate investigation, especially in sensitive environments where security incidents can result in significant consequences.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of log-clearing activity, as sophisticated adversaries might use alternative methods or scripts that bypass common command patterns. Additionally, the detection logic assumes that the command-line arguments provided will be consistently used by attackers. Required logs for this alert to function effectively include comprehensive process creation logs on the Linux systems monitored, necessitating proper configuration of logging services to capture all necessary events.

