title: Linux Logs Clearing Attempts
id: 80915f59-9b56-4616-9de0-fd0dea6c12fe
status: stable
description: |
  Detects logs clearing attempts on Linux systems via utilities such as 'rm', 'rmdir', 'shred', and 'unlink' targeting log files and directories.
  Adversaries often try to clear logs to cover their tracks after performing malicious activities.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.002/T1070.002.md
author: Ömer Günal, oscd.community
date: 2020-10-07
modified: 2026-03-18
tags:
- attack.defense-evasion
- attack.t1070.002
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
    - '/rm'            # covers /rmdir as well
    - '/rmdir'
    - '/shred'
    - '/unlink'
    CommandLine|contains:
    - '/var/log'
    - '/var/spool/mail'
  filter_main_legit_systat:
    Image|endswith: '/rm'
    CommandLine|startswith: 'rm -f /var/log/sysstat/'
  filter_main_dmseg:
    Image|endswith: '/rm'
    CommandLine|startswith: 'rm -f -- /var/log//dmesg'     # // before dmesg is not typo
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to clear logs on Linux systems using commands like `rm`, `rmdir`, `shred`, or `unlink`, specifically targeting log files and directories, commonly found in `/var/log` and `/var/spool/mail`. Its primary objective for attackers is to erase traces of malicious activities, reflecting an intention to obscure evidence of compromise. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" and the technique T1070.002 (Indicator Removal on Host).

  The primary telemetry sources include Linux process creation logs, particularly focusing on command execution details containing specific arguments indicating log file modifications. If successful, this could lead to a lack of accountability for prior actions on the system. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also result in similar command usage.

  ### Investigation Steps

  - **Examine recent process creation events:** Check for events like `syslog` or `auditd` with Event IDs related to command execution. Look for `Image` containing `/rm`, `/rmdir`, `/shred`, or `/unlink` and `CommandLine` containing log paths (e.g., `/var/log`). Legitimate commands to check for include `rm -f /var/log/sysstat/` which indicate standard log maintenance.

  - **Identify suspicious command usage:** Focus on processes that employ the aforementioned commands with abnormal timing or frequency, particularly during non-business hours. Look for command lines targeting files in `/var/log/` or indices such as user privileges or process owners that are unusual for the affected system.

  - **Cross-reference with user history:** Review the `last` command output or similar logs to correlate if the user executing the command has a legitimate reason for clearing logs. Identify any anomalous user actions preceding the log clearing attempts, which may indicate compromise.

  - **Check for subsequent system behavior:** Investigate logs post-incident to determine if there was an increase in system error logs or unusual activity from the affected system, which might suggest an attempt to cover up persistent malicious actions.

  - **Validate log retention policies:** Ensure log retention is appropriately configured and functionally replicates artifacts, and review settings in logging systems like `rsyslog` to ensure configurations are not mistakenly allowing legitimate overwrites.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on forensic investigations and the likelihood that an adversary may leverage log clearing techniques to hide malicious activity. Such techniques are commonly utilized by attackers in various scenarios of compromise.

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion tactics, where an attacker could schedule these commands through a cron job or disguise them within legitimate processes. It is essential to ensure comprehensive logging is enabled for process creation and commands executed. Legitimate administrative tasks, such as system maintenance or log rotations, could also trigger this rule. A related detection to complement this would involve monitoring for unexpected cron jobs or scheduled tasks that execute log-clearing commands, reinforcing overall coverage.

