note: |
  ### Technical Context

  This rule detects the execution of shell commands via the "nice" utility on Linux systems. Attackers may use "nice" as a method to manipulate the scheduling of processes to gain unauthorized access or perform privilege escalation, especially when breaking out from restricted environments or executing commands where user permissions may be limited. This behavior aligns with the MITRE ATT&CK tactic of Discovery (TA0007) and the specific technique for Unrestricted/Excessive Resource Consumption (T1083).

  The primary telemetry source is Linux process creation logs, specifically monitoring the execution of processes where "nice" is used alongside commonly exploited shell interpreters like `/bin/bash`, `/bin/sh`, `/bin/zsh`, and so forth. If this activity is malicious, it could lead to compromise or lateral movement within the network. It's essential to note that this detection does NOT, on its own, confirm malicious intent; it merely highlights suspicious command execution that requires further contextual investigation.

  ### Investigation Steps

  - **Review recent process executions:** Check Linux process creation logs (e.g., `/var/log/audit/audit.log` or Systemd journal logs) for `execve` syscall events. Look for Event ID that indicates the execution of "nice" followed by a shell interpreter. Validating unusual time stamps or user contexts may reveal illegitimate access patterns.

  - **Examine command history:** Investigate `.bash_history` or similar files for the user context under which "nice" was executed. Document any commands run immediately before or after the usage of "nice" that appear suspect or out of the ordinary.

  - **Identify abnormal user activity:** Look for patterns of usage, such as unusually high "nice" priority levels, executed by non-administrative users, indicating potential abuse. Cross-reference usage with expected operational behavior for the specific user role (e.g., a standard user is not expected to regularly escalate their process priority).

  - **Collect related network activity:** Utilize network monitoring (e.g., netstat or system logs) to correlate network connections established just after the execution of commands via "nice." Check if there are any outgoing connections to known malicious IPs or ports.

  - **Check for additional persistence mechanisms:** Investigate for any scripts or binaries that might have been executed in conjunction with or as a result of the "nice" command invocation. Determine if created files have unusual permissions or ownerships, indicating potential backdoor activity.

  ### Prioritization

  This alert is considered high-severity due to the potential for privilege escalation and unauthorized execution of commands from a compromised system. The likelihood of this behavior being malicious is significant, as it is a commonly utilized tactic by attackers to manipulate processes and escalate their privileges within a Linux environment.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for users with legitimate needs to employ "nice" without malicious intent, especially system administrators or developers using it for valid purposes. Additionally, false negatives may occur if telemetry is not comprehensive or if logging is improperly configured (e.g., Audit framework). Legitimate administrative activities, such as process management during performance tuning, may also trigger the alert. Companion detection, such as monitoring for unapproved SSH sessions or escalations (e.g., via `sudo` usage), can help strengthen the overall detection coverage of potentially malicious behavior.

