title: Execution Of Script Located In Potentially Suspicious Directory
id: 30bcce26-51c5-49f2-99c8-7b59e3af36c7
status: test
description: Detects executions of scripts located in potentially suspicious locations
  such as "/tmp" via a shell such as "bash", "sh", etc.
references:
- https://blogs.jpcert.or.jp/en/2023/05/gobrat.html
- https://jstnk9.github.io/jstnk9/research/GobRAT-Malware/
- https://www.virustotal.com/gui/file/60bcd645450e4c846238cf0e7226dc40c84c96eba99f6b2cffcd0ab4a391c8b3/detection
- https://www.virustotal.com/gui/file/3e44c807a25a56f4068b5b8186eee5002eed6f26d665a8b791c472ad154585d1/detection
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-06-02
tags:
- attack.execution
logsource:
  product: linux
  category: process_creation
detection:
  selection_img:
    Image|endswith:
    - '/bash'
    - '/csh'
    - '/dash'
    - '/fish'
    - '/ksh'
    - '/sh'
    - '/zsh'
  selection_flag:
    CommandLine|contains: ' -c '
  selection_paths:
        # Note: Add more suspicious paths
    CommandLine|contains: '/tmp/'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the execution of scripts from potentially suspicious directories, specifically those located in `/tmp`, using various Unix shell interpreters such as `bash`, `sh`, and others. This type of activity often indicates a possible execution of malicious scripts, which may have been placed in this directory with the intent of evading detection. Attackers may utilize these compromised scripts to perform unauthorized actions, exfiltrate data, or establish persistence in the environment.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002): This rule falls under the broader category of Execution, where an attacker executes malicious code on a compromised system.
  - **User Execution** (T1203): If the script is executed by a user, it points to user-initiated actions, potentially leveraging social engineering tactics.
  - **Command-Line Interface** (T1059): The specific detection criteria target command-line executions, which could indicate attempts to leverage shell functionalities for malicious activities.

  Primary data sources for effective detection include process creation events, which detail command-line arguments and the image names of executed processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs related to process creation to identify any unauthorized or suspicious shell executions from `/tmp` or other suspect paths. Focus on the command line used for execution to discern the intent.
  - **Correlate with File Access Logs**: Determine if there are recent file access events in `/tmp` that coincide with the execution times of the identified scripts. Look for signs of file creation or modification that may indicate malicious installations.
  - **Conduct a Directory Review**: Inspect the contents of the `/tmp` directory and any suspicious executables/scripts. Evaluate their origin and whether they match known malicious patterns or hashes.
  - **Assess User Context**: Investigate the user accounts that executed the scripts. Determine if they have elevated privileges or any unusual access patterns that might suggest credential compromise.

  ### Prioritization
  The alert has a medium severity due to the potential threat posed by malicious script execution, which can lead to data breaches or system compromises. The likelihood of this activity being part of an intrusion is elevated in environments with heightened exposure to risks such as malware or insider threats.

  ### Blind Spots and Assumptions
  This detection rule may miss execution attempts from other non-standard directories that attackers might exploit. The logic assumes that malicious scripts will always be executed with shell interpreters, which may not always be the case if they are executed in a different context. The effectiveness of this detection depends on capturing comprehensive process creation logs, including command-line arguments, and ensuring that logging is enabled across all relevant systems.

