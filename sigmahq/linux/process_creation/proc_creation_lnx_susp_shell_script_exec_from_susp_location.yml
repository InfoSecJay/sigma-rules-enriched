note: |
  ### Technical Context

  This Sigma rule detects the execution of shell scripts originating from the `/tmp` directory, which is often a temporary location used by attackers to execute malicious payloads. The likely attacker objective is to run a script that may establish a backdoor, exfiltrate data, or perform internal reconnaissance. This behavior aligns with the MITRE ATT&CK technique for Execution: **Command-Line Interface (T1202)**.

  The primary telemetry sources for this detection are processes created in a Linux environment, specifically monitoring process creation events. Relevant log types include the `process_creation` logs from various Linux logging tools (e.g., auditd or syslog). If malicious, this activity can lead to system compromise or data breach. Importantly, while this rule indicates suspicious activity, it does NOT confirm malicious intent on its own; scripts executed from `/tmp` can also be part of benign operations by legitimate system processes or users.

  ### Investigation Steps

  - **Examine process creation logs:** Check process creation logs for Event ID 100 in `auditd` or check `/var/log/syslog` for command executions. Look for entries involving processes that match the command line pattern including `/tmp/` and one of the specified shells.

  - **Identify the user context:** Determine the user that executed the script using the `uid` or `username` fields. Benign scripts might be executed by known system accounts (e.g., `www-data` for Apache or `root` for maintenance tasks), whereas unexpected users executing these scripts could indicate malicious activity.

  - **Review command line arguments:** Analyze the command line associated with the process. Legitimate scripts in the `/tmp` directory may include clear descriptive filenames and common arguments, while malicious scripts often have obfuscated or encoded content.

  - **Check for lateral movement:** Investigate any network activity or outbound connections initiated by processes found in the previous steps to identify if the script resulted in a communication attempt to external malicious infrastructure.

  - **Correlate with file integrity monitoring:** Confirm the existence of executed scripts in the `/tmp` directory by checking file metadata such as creation time and modification time. Sudden changes or the presence of executables that have not been observed prior could be a high-confidence indicator of malicious behavior.

  ### Prioritization

  This alert is of **medium severity** due to the potential impact on sensitive systems if malicious scripts are executed. The likelihood of abuse is moderate, as this behavior is weaponized by attackers for remote access and data exfiltration. The usage of the `/tmp` directory for script execution commonly suggests nefarious intentions, though not exclusively.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of script execution from legitimate applications that may use the `/tmp` directory for temporary file storage, thus resulting in false positives. Reliable detection requires proper logging configurations to capture detailed process creation events, specifically from tools like auditd. Some legitimate activities, such as automated tasks or scheduled jobs that utilize the `/tmp` directory for temporary execution, may trigger this alert. A related detection to strengthen coverage could monitor suspicious file creation or modification patterns in `/tmp`, correlating with unusual process executions.

