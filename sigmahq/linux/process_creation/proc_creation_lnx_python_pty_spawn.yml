note: |
  ### Technical Context

  This Sigma rule detects the spawning of a tty (teletypewriter) using the PTY module in Python, which is commonly used by attackers to establish a reverse shell. The objective of this behavior is often to gain remote command execution and establish persistence on a compromised system. This activity aligns with the MITRE ATT&CK techniques: Remote Command Execution (T1059) and specifically, Execution through Scripting (T1059.001).

  The primary telemetry sources for this detection include Linux process creation logs, typically generated by auditd or similar logging mechanisms that capture process execution details. If this activity is malicious, it can result in unauthorized access and control over the affected system, posing significant security risks. However, this detection on its own does NOT confirm malicious intent; it may also capture legitimate scripting use, such as system administrators using Python for automation or legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Analyze process details:** Review process creation logs for Event IDs related to process execution (e.g., auditd logs) to identify the parent process linked to the Python command invoking the PTY module. Look for unusual parent processes that are not typical for your environment.

  - **Identify command-line arguments:** Check the command line for the executed Python process. Specifically, look for strings like 'import pty', 'from pty', or 'spawn'. Malicious actors often have distinctive values, while legitimate usage will typically not invoke 'pty' in this context.

  - **Correlate with user activity:** Investigate user activity during the time the Python process was executed by examining user logs (e.g., whoami, last) to determine if the command was run by an authorized user during their session or if it appears as a standalone entry, raising suspicion.

  - **Review expected legitimate behavior:** Document instances where Python scripts are legitimately used in your environment, such as system maintenance or automation tasks, to establish a baseline for normal activity. Compare current incidents against this known good behavior.

  - **Evaluate host context:** Assess the role and criticality of the affected hosts. If the process was spawned on a sensitive server or endpoint (e.g., web server, database), the alert should be escalated due to the impact of potential exploitation.

  - **Check for network connections:** Investigate outbound connections initiated by the Python process. Use network logs (e.g., firewall logs) to verify if the process established any unexpected connections, indicating possible reverse shell activity.

  ---

  ### Prioritization

  This alert should be categorized as medium severity. While the impact can be significant if an attacker gains control of critical systems, the likelihood of false positives is non-negligible given that legitimate Python scripts might trigger the alert. Though not universally weaponized, the technique is well-known among attackers and warrants prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from variations in how legitimate scripts might execute similar calls to the PTY module, leading to false positives. Reliable detection requires proper logging configurations on Linux systems, ensuring process creation events are captured. Activities such as legitimate administrative scripting using Python could trigger this alert, and additional contextual detections, such as network connection patterns associated with the spawn action, would complement this detection effectively.

