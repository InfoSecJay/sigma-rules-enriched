note: |
  ### Technical Context
  This detection rule identifies instances where a Python process invokes the PTY (pseudo-terminal) module, specifically for spawning a "pretty" terminal interface. Such behavior is often associated with reverse shell activity, where an attacker establishes a remote command line interface to control a compromised system. The primary objective of an attacker using this technique would typically be to maintain access and execute commands on the victim's machine with a disguised terminal interface, making detection more challenging.

  The relevant MITRE ATT&CK tactics and techniques for this rule include:
  - **Execution** (TA0002)
    - **Command and Scripting Interpreter** (T1059): This technique encompasses the use of command-line interfaces or scripts to execute malicious payloads.

  The primary source of telemetry for this detection includes process creation events, specifically monitoring logs that capture command lines and executable paths, allowing security analysts to discern unusual or unauthorized use of the Python interpreter.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation events on Linux systems for instances where Python executables are spawned, especially if they include references to the PTY module or unusual command line arguments.
  - **Analyze Command Line Arguments**: Investigate the command line arguments associated with Python processes looking for patterns indicative of reverse shell activity, such as the import of the `pty` module or the word "spawn".
  - **Correlate with User Activity**: Verify the user account under which the Python process was run to determine if the behavior aligns with normal operational tasks or if it appears anomalous.
  - **Check for Network Connections**: Monitor for outbound network connections initiated shortly after the identified process creation events, as they may indicate attempts to establish a remote session.

  ### Prioritization
  The severity of this alert is medium due to its potential to indicate unauthorized remote access on a system, which could lead to data breaches or further intrusions. Given that these techniques are commonly employed by advanced threat actors, they require prompt investigation.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of potentially malicious activity, particularly if attackers utilize alternative programming languages or scripting methods for exploitation. Additionally, the rule assumes that proper logging is enabled for process creation events and that logs are retained adequately for analysis. If any necessary logging for command line inputs or suspicious module imports are not configured, it could lead to a gap in this detection's effectiveness.

