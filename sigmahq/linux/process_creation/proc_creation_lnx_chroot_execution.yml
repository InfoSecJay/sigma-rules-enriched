note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the `sudo` command with the `--chroot` option on Linux systems, which allows a user to change the root directory for command execution. Attackers may leverage this technique to evade detection and execute commands in a modified environment, particularly during privilege escalation efforts. The relevant MITRE ATT&CK tactic is "Privilege Escalation" (T1068).

  Primary telemetry sources include process creation logs, specifically Event ID for Linux process execution. If malicious, this behavior could indicate an attacker attempting to gain higher privileges or shelter their activities within a restricted environment. However, this detection does NOT confirm intent on its own; legitimate administrative tasks may also use `sudo --chroot`.

  ---

  ### Investigation Steps

  - **Check for suspicious command usage:** Review logs for Event ID related to sudo commands (e.g., `/var/log/auth.log`, `/var/log/secure`). Filter for entries containing `sudo --chroot` and note the invoking user and associated command lines.

  - **Identify the user executing the command:** Analyze user account activity to determine if the command was executed by a legitimate administrative user or an anomalous account. Pay attention to any unusual use patterns or newly created accounts.

  - **Review the execution context:** Look for commands run under `sudo --chroot` that originate from non-standard directories (e.g., `/tmp`, `/var/tmp`). Validate whether the command is part of acceptable administrative procedures or scripts.

  - **Correlate with other privilege escalation indicators:** Investigate any simultaneous alerts or logs indicating privilege escalation attempts, such as unusual `setuid` or `setgid` file executions.

  - **Assess affected systems' criticality:** Determine the role of the system where the alert triggered. Systems with sensitive data or elevated privileges should be prioritized for immediate response.

  - **Validate file operations:** Check for any created or modified files during the execution of the `sudo --chroot` command, particularly in unexpected locations, indicating potential exfiltration or unnatural activity.

  ---

  ### Prioritization

  This alert carries low severity; however, its context can escalate if triggered on systems with user permissions that allow sensitive access. While exploitation attempts using `sudo --chroot` are relatively uncommon, active monitoring is essential, especially in environments with high privilege tasks.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include using legitimate administrative scripts that utilize `sudo --chroot` for benign purposes such as testing or container management. Required log sources include comprehensive logging from `/var/log/auth.log` and `/proc` for process-related activity. Other common legitimate activities may involve system updates or maintenance tasks that invoke `sudo --chroot`. Related detections, such as unauthorized `setuid` modifications, could reinforce overall security coverage.

