logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/sudo'
    CommandLine|contains:
    - ' --chroot '
    - 'sudo -R '
  condition: selection
falsepositives:
- Legitimate administrative tasks or scripts that use 'sudo --chroot' for 
  containerization, testing, or system management.
level: low
note: |
  ### Technical Context

  This rule detects the execution of the 'sudo' command with the '--chroot' option on Linux systems, which allows administrators to change the root directory for subsequent commands—an action that can also be exploited by attackers to manipulate their environment more securely and evade detection. The typical attacker objective here is to escalate privileges while executing commands in an isolated environment, which can hide their activities from security monitoring tools. This behavior is relevant to the MITRE ATT&CK tactic of Privilege Escalation (T1068).

  Primary telemetry sources include process creation logs on Linux, particularly focusing on the command line arguments provided in these logs. If used maliciously, this technique could allow attackers to execute unauthorized commands with elevated privileges, increasing the risk to system security. Importantly, the detection of this specific command does NOT confirm that malicious intent exists on its own, as legitimate administrative processes may also invoke 'sudo --chroot'.

  ### Investigation Steps

  - **Check for unusual users executing sudo commands:** Review process creation logs (e.g., Syslog or journald) for instances of 'sudo' commands run by non-administrative users or unusual accounts (e.g., Event ID `/var/log/auth.log`; check `USER` field).

  - **Correlate command usage with known threat patterns:** Look for the execution of 'sudo --chroot' in conjunction with commands commonly associated with attacks, such as file manipulations or network connections from unusual paths (verify against `/var/log/syslog` or `/var/log/audit/audit.log`).

  - **Validate legitimate administrative activity:** Identify other instances of 'sudo --chroot' that are part of expected operations, such as container initialization or software testing. Create a baseline of normal administrative tasks to differentiate between benign and malicious usages.

  - **Analyze process lineage and parent processes:** Investigate the parent process IDs of the instances using 'sudo --chroot' to see if they stem from expected shell scripts or known cron jobs (review `pstree` or `ps -ef` outputs).

  - **Check for file system artifacts:** Look for any files created or modified right after the `sudo --chroot` command execution (e.g., using `ls -l` to review timestamps in the working directory).

  ### Prioritization

  This alert should be treated with a low severity level due to the potential for legitimate administrative tasks involving 'sudo --chroot'. However, the likelihood of malicious use increases especially if combined with other suspicious behaviors or executed by atypical user accounts. This behavior, while not frequently weaponized, becomes concerning in an environment where unauthorized privilege escalation is already suspected.

  ### Blind Spots and Assumptions

  Detection may be limited by instances where logging is not configured appropriately, as well as users with legitimate needs invoking 'sudo --chroot' for testing or maintenance routines. Additionally, undocumented scripts or one-off commands running this option may escape detection if not logged properly. A related detection, such as monitoring for abnormal process creation (e.g., Sysmon Event ID 1 for external calls), can strengthen coverage against potential misuse.

