note: |
  ### Technical Context

  This rule detects the execution of the `crontab` command with the `-l` flag, which lists scheduled cron jobs for a user. An attacker may employ this command to gather information about a target system's scheduling configurations to identify potential vulnerabilities or backdoor access points. This behavior is associated with the MITRE ATT&CK tactic of Discovery (TA0007) and specifically with the technique for System Information Discovery (T1007).

  The primary telemetry source for this rule is the Linux process creation logs, which contain information about executed commands. If exploited maliciously, this behavior could lead to compromised cron jobs or unauthorized task scheduling. Importantly, while this detection points towards a possible reconnaissance activity, it does not confirm malicious intent without additional correlating evidence.

  ### Investigation Steps

  - **Check process creation logs**: Examine Linux process creation logs (e.g., `/var/log/auth.log` or `audit logs`) for Event ID indicating the execution of `/crontab`. Look specifically for entries with command line arguments containing ` -l`.

  - **Identify user context**: Determine the user who executed the command. Legitimate use is more likely if a system administrator or a trusted application user is identified, while a request from a non-privileged or unusual account could indicate malicious intent.

  - **Review scheduled cron jobs**: Review the output of the cron jobs listed by the `crontab -l` command (if available) for any unusual entries. Malicious indicators may include recently modified jobs or entries with execution commands that are unfamiliar or suspicious.

  - **Correlate with additional telemetry**: Cross-reference the crontab access with other logs, such as SSH logs (Event ID 22 for successful logins) or file access logs (e.g., using `auditd` for unauthorized changes), to identify if this is part of a broader unauthorized access pattern.

  - **Assess legitimate use cases**: Note that normal administrative tasks or automated scripts may also invoke `crontab -l`. If the command was run by known admin users at expected times without unusual subsequent activity, it may not be a concern.

  ### Prioritization

  The alert has a low severity due to the potential for benign use of the `crontab` command by legitimate system administrators on critical systems. However, the likelihood of malicious abuse exists, especially if coupled with anomalous behavior or executed by unexpected accounts. This command is often weaponized in targeted environments to facilitate further exploitation.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers who utilize alternative methods of scheduling or non-standard command variations, which might not trigger this rule. Reliable detection requires complete logging configurations for Linux process creation, specifically for user commands and not just root activity. Legitimate administrative tasks that may trigger this alert include routine maintenance or scheduled job audits. Related detections that could strengthen coverage include monitoring for unusual cron job executions or modifications in conjunction with changes to the user's access or privilege levels.

