title: Potential Suspicious Change To Sensitive/Critical Files
id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
status: test
description: |
  Detects changes of sensitive and critical files. Monitors files that you don't expect to change without planning on Linux system.
  These files include, but are not limited to, system configuration files, authentication files, and critical application files.
  Attackers often target these files to maintain persistence, escalate privileges, or disrupt system operations.
references:
- https://learn.microsoft.com/en-us/azure/defender-for-cloud/file-integrity-monitoring-overview#which-files-should-i-monitor
author: '@d4ns4n_ (Wuerth-Phoenix)'
date: 2023-05-30
modified: 2026-03-18
tags:
- attack.impact
- attack.t1565.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_img_1:
    Image|endswith:
    - '/cat'
    - '/echo'
    - '/grep'
    - '/head'
    - '/more'
    - '/tail'
    CommandLine|contains: '>'
  selection_img_2:
    Image|endswith:
    - '/emacs'
    - '/nano'
    - '/sed'
    - '/vi'
    - '/vim'
  selection_paths:
    CommandLine|contains:
    - '/bin/login'
    - '/bin/passwd'
    - '/boot/'
    - '/etc/*.conf'
    - '/etc/cron.'         # Covers different cron config files "daily", "hourly", etc.
    - '/etc/crontab'
    - '/etc/hosts'
    - '/etc/init.d'
    - '/etc/sudoers'
    - '/opt/bin/'
    - '/sbin'         # Covers: '/opt/sbin', '/usr/local/sbin/', '/usr/sbin/'
    - '/usr/bin/'
    - '/usr/local/bin/'
  filter_main_mdadm.conf:
    Image|endswith: '/bin/sed'
    CommandLine|startswith:
    - 'sed -i /^*'
    - 'sed -ne s/^'
    CommandLine|endswith: '/etc/mdadm/mdadm.conf'
  condition: 1 of selection_img_* and selection_paths and not 1 of filter_main_*
falsepositives:
- Some false positives are to be expected on user or administrator machines. 
  Apply additional filters as needed.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to sensitive and critical files on Linux systems, such as system configurations, authentication files, and critical application files. Attackers often manipulate these files to maintain persistence, escalate privileges, or disrupt operations. The relevant MITRE ATT&CK tactic is "Impact" (TA0040), and the technique is "Data Manipulation" (T1565.001).

  The primary telemetry sources for this detection include Linux process creation logs, specifically around the command execution of tools typically used to manipulate files, such as `sed`, `echo`, or text editors (`vi`, `nano`). If these modifications are malicious, they could lead to severe disruptions in system integrity or provide attackers with elevated privileges. Notably, this detection does NOT confirm that the modification was unauthorized or malicious without further contextual evidence.

  ### Investigation Steps

  - **Identify the command and file modified:** Check for process creation logs (e.g., Syslog, Audit logs) using `Event ID` correlated with changes to `/etc/*.conf`, `/bin/login`, or `/etc/sudoers` to verify the specific command executed.

  - **Assess user context:** Review the user context (e.g., UID and username) associated with the process creations. Legitimate changes often originate from administrative accounts during scheduled maintenance or config changes, while unexpected entries from standard users could signal malicious intent.

  - **Check for command arguments:** Examine command-line arguments in the logs for processes (e.g., `/bin/sed`, `/bin/echo`) that are executing modifications. Look for patterns indicating file overwrites followed by unexpected options or paths.

  - **Validate file integrity post-change:** Utilize file integrity monitoring tools, if available, to verify whether critical files (e.g., `/etc/sudoers`, `/etc/crontab`) have been modified without prior changes logged, which may indicate nefarious activities.

  - **Cross-reference timestamps:** Check timestamps of the process creation logs against user logs and system alterations to identify any deviation from regular administrative activity.

  - **Look for evasion patterns:** Investigate if the modification is followed by obfuscation techniques, such as masking legitimate commands or modifying file timestamps, which might indicate an attempt to evade detection.

  ### Prioritization

  This alert holds medium severity due to the potential impact on system integrity and the likelihood of malicious abuse. While these detection scenarios can be exploited by attackers, they may also stem from legitimate administrative actions, requiring careful contextual analysis before escalating.

  ### Blind Spots and Assumptions

  This detection is limited by its reliance on specific command patterns, which attackers may evade by using less common commands or scripts. It requires robust logging configurations to ensure full visibility, including filesystem audits and monitoring of process execution. Legitimate activities could involve scheduled tasks or administrative scripts that adhere to regular operational procedures. A companion detection around unauthorized access attempts (e.g., through SSH connection failures) can strengthen overall security visibility related to these file changes.

