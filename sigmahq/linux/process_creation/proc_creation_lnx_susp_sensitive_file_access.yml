title: Potential Suspicious Change To Sensitive/Critical Files
id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
status: test
description: Detects changes of sensitive and critical files. Monitors files that
  you don't expect to change without planning on Linux system.
references:
- https://learn.microsoft.com/en-us/azure/defender-for-cloud/file-integrity-monitoring-overview#which-files-should-i-monitor
author: '@d4ns4n_ (Wuerth-Phoenix)'
date: 2023-05-30
tags:
- attack.impact
- attack.t1565.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_img_1:
    Image|endswith:
    - '/cat'
    - '/echo'
    - '/grep'
    - '/head'
    - '/more'
    - '/tail'
    CommandLine|contains: '>'
  selection_img_2:
    Image|endswith:
    - '/emacs'
    - '/nano'
    - '/sed'
    - '/vi'
    - '/vim'
  selection_paths:
    CommandLine|contains:
    - '/bin/login'
    - '/bin/passwd'
    - '/boot/'
    - '/etc/*.conf'
    - '/etc/cron.'         # Covers different cron config files "daily", "hourly", etc.
    - '/etc/crontab'
    - '/etc/hosts'
    - '/etc/init.d'
    - '/etc/sudoers'
    - '/opt/bin/'
    - '/sbin'         # Covers: '/opt/sbin', '/usr/local/sbin/', '/usr/sbin/'
    - '/usr/bin/'
    - '/usr/local/bin/'
  condition: 1 of selection_img_* and selection_paths
falsepositives:
- Some false positives are to be expected on user or administrator machines. Apply
  additional filters as needed.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious changes to sensitive and critical files on Linux systems. By monitoring file modifications made using common command-line utilities, it aims to flag activities that may not align with planned changes, such as unauthorized file edits or manipulations that could compromise system integrity or security. Attackers may target critical system configurations, password files, or system scripts to elevate privileges, establish persistence, or disrupt services.

  In the context of the MITRE ATT&CK framework, this rule touches on the tactic of **Impact** and specifically on the technique **T1565.001 - Data Manipulation**. Attackers may manipulate configurations or sensitive files to achieve unauthorized objectives, which aligns with the overall goal of maintaining control or misusing resources within the environment.

  The primary data sources for this detection include process creation events on Linux systems, capturing the use of commands and their associated parameters, particularly those executed using tools like `cat`, `echo`, or text editors like `vi` and `nano`. Additionally, changes to files within critical system directories (e.g., `/etc`, `/usr/bin`) must be closely monitored.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for the execution of command-line tools listed in the rule (e.g., `cat`, `echo`) that indicate changes to critical files. Focus on any abnormal usage patterns or commands that deviate from established norms.
  - **Analyze Command Line Parameters:** Look for command line arguments that include redirection symbols (e.g., `>`). These may indicate attempts to write output to sensitive files, potentially leading to unauthorized modifications.
  - **Correlate File Change Events:** If available, correlate findings with file integrity monitoring (FIM) logs to confirm if changes to critical files were made as detected by the process creation events.
  - **Investigate User Context:** Determine the user context under which the suspicious commands were executed. Check for unusual patterns or escalated privileges associated with user accounts that may indicate compromised credentials.

  ### Prioritization
  The severity of this alert is medium because unauthorized changes to critical system files can lead to significant security breaches, data loss, or service disruptions. However, the likelihood of these events being genuine anomalies also warrants careful investigation to reduce false positives.

  ### Blind Spots and Assumptions
  This detection logic assumes that all relevant logs for process creation and command execution are enabled and properly configured. It may have blind spots related to file system activity that does not generate process creation events, such as direct modifications via other means. Additionally, the rule's effectiveness can be impacted by legitimate administrative tasks on user systems, which may introduce false positives where expected changes occur. Certain command-line tools and their arguments may also need to be further refined to filter out benign activities.

