title: Potential Suspicious Change To Sensitive/Critical Files
id: 86157017-c2b1-4d4a-8c33-93b8e67e4af4
status: test
description: Detects changes of sensitive and critical files. Monitors files 
  that you don't expect to change without planning on Linux system.
references:
- https://learn.microsoft.com/en-us/azure/defender-for-cloud/file-integrity-monitoring-overview#which-files-should-i-monitor
author: '@d4ns4n_ (Wuerth-Phoenix)'
date: 2023-05-30
tags:
- attack.impact
- attack.t1565.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_img_1:
    Image|endswith:
    - '/cat'
    - '/echo'
    - '/grep'
    - '/head'
    - '/more'
    - '/tail'
    CommandLine|contains: '>'
  selection_img_2:
    Image|endswith:
    - '/emacs'
    - '/nano'
    - '/sed'
    - '/vi'
    - '/vim'
  selection_paths:
    CommandLine|contains:
    - '/bin/login'
    - '/bin/passwd'
    - '/boot/'
    - '/etc/*.conf'
    - '/etc/cron.'         # Covers different cron config files "daily", "hourly", etc.
    - '/etc/crontab'
    - '/etc/hosts'
    - '/etc/init.d'
    - '/etc/sudoers'
    - '/opt/bin/'
    - '/sbin'         # Covers: '/opt/sbin', '/usr/local/sbin/', '/usr/sbin/'
    - '/usr/bin/'
    - '/usr/local/bin/'
  condition: 1 of selection_img_* and selection_paths
falsepositives:
- Some false positives are to be expected on user or administrator machines. 
  Apply additional filters as needed.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized or suspicious modifications to critical system files and configurations on Linux systems. The behavior typically signifies an adversary's attempt to alter configurations for persistent access, exfiltration, or privilege escalation. The relevant MITRE ATT&CK tactics are **Impact (TA0040)** and **Data Manipulation (T1565.001)**.

  Primary telemetry sources include Linux process creation logs, specifically focusing on command executions that interact with sensitive configuration files in paths such as `/etc`, `/boot`, and `/usr/bin`. If malicious, this activity could compromise system integrity, disrupt services, or allow unauthorized access. Importantly, this detection does NOT confirm malicious intent on its own and could be triggered by benign administrative actions.

  ### Investigation Steps

  - **Review command execution history:** Investigate `bash_history` or `audit logs` to evaluate the context in which the command was executed, looking for unusual or unexpected commands executed by non-administrative users.

  - **Examine process creation alerts:** Analyze **Syslog** or **Auditd logs** for **Event ID 228** and **Event ID 230** corresponding to process creation and modifications. Look for processes related to the selected images, particularly focusing on those executed by unrecognized or unsanctioned users.

  - **Identify suspicious file modifications:** Check for timestamps and file hashes of sensitive files (e.g., `/etc/passwd`, `/etc/sudoers`) in the **File Integrity Monitoring** logs. Look for recent changes that deviate from established baselines of approved changes.

  - **Validate legitimate admin activity:** Identify routine administrative tasks similar to the detected behavior (e.g., configuration updates by scheduled cron jobs). Investigate if the command line included tools commonly used for these purposes, like `update` or `install`.

  - **Use asset criticality information:** Process logs should be matched against asset criticality. For example, changes to files on a production server should be prioritized higher than those on a development server, indicating potential risk levels for response teams.

  - **Confirm logged user context:** Look into the **/var/log/auth.log** for context around who executed the commands. Ensure users have appropriate permissions and look for any deviations from typical user behavior.

  ### Prioritization

  This alert should be prioritized as medium severity. The impact could be significant if critical system files are altered, leading to potential unauthorized access or service disruption. However, the likelihood of malicious abuse depends on the context of the activity, as legitimate administrative changes commonly occur in these areas.

  ### Blind Spots and Assumptions

  Common evasion techniques include the use of scheduled tasks to overwrite files without direct observation, or altering logs to mask changes. Reliable detection requires comprehensive logging configurations, including detailed process creation and file integrity monitoring logs. Legitimate system updates or group policy adjustments may also trigger this alert. A complementary detection to consider is monitoring file hash integrity against known good baselines, which can strengthen visibility over critical files.

