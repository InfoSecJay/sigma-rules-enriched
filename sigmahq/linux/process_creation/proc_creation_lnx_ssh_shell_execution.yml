title: Shell Invocation Via Ssh - Linux
id: 8737b7f6-8df3-4bb7-b1da-06019b99b687
status: test
description: |
  Detects the use of the "ssh" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/ssh/
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg 
  L.P.)
date: 2024-08-29
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/ssh'
    CommandLine|contains:
    - 'ProxyCommand=;'
    - 'permitlocalcommand=yes'
    - 'localhost'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
    - 'sh 0<&2 1>&2'
    - 'sh 1>&2 0<&2'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a shell through the SSH utility, focusing on command-line arguments that indicate potential misuse of SSH for privilege escalation or unauthorized command execution. The likely attacker objective may include breaking out from restricted environments or executing malicious commands remotely. This detection aligns with MITRE ATT&CK technique T1059 (Command and Scripting Interpreter), specifically under the execution tactic.

  The primary telemetry sources include Linux process creation logs, particularly the use of the "ssh" command. Should this detection trigger maliciously, it could indicate elevated risk to the system and wider network, as an adversary might gain unauthorized access and potentially escalate privileges. Importantly, this detection does not confirm malicious intent solely on its own, as legitimate administrative activities may trigger similar command usages.

  ### Investigation Steps

  - **Review the command line arguments**: Analyze the "CommandLine" field in the process creation logs (Linux) for suspicious entries, specifically searching for keywords like `ProxyCommand=;`, `permitlocalcommand=yes`, or banned shell paths (e.g. `/bin/sh`, `/bin/bash`). Legitimate use of SSH typically does not involve these fields.

  - **Check the parent process**: Identify the parent process of the SSH invocation using `pgrep` or `pstree` to see if it correlates with legitimate admin tools or scheduled tasks. Anomalous parents might indicate potential malicious activity.

  - **Correlate SSH access logs**: Review `/var/log/auth.log` or equivalent for past SSH login attempts (Event IDs related to SSH - e.g., SSH logins, logouts). Analyze whether the timestamps of backups correspond with external connections or from unusual user accounts.

  - **Investigate host role and asset criticality**: Validate if the affected host is in a critical role (e.g., database server, web server). If so, escalate the investigation to higher tiers as it may pose significant impact to internal resources.

  - **Capture user sessions**: If possible, capture user session activity through a monitoring tool or audit logging and analyze for unexpected behaviors following SSH usage, which might include changes in user privileges or execution of sensitive commands.

  ### Prioritization

  Alerts generated from this detection should be prioritized as high severity due to the potential for significant system impact if exploited. The likelihood of malicious behavior is moderate to high, as the execution of shells through SSH is a common vector for attackers. Adversaries frequently weaponize this technique to escalate privileges and maintain persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by insider threats or legitimate administrative actions wherein authorized users perform shell invocations via SSH. It’s crucial to ensure comprehensive logging is enabled for SSH and process creation to capture all relevant data. One related detection that enhances coverage could include monitoring for unauthorized SSH key usage or modifications (e.g., changes in `~/.ssh/authorized_keys`).

