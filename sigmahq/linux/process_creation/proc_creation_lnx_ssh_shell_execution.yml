title: Shell Invocation Via Ssh - Linux
id: 8737b7f6-8df3-4bb7-b1da-06019b99b687
status: test
description: |
  Detects the use of the "ssh" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/ssh/
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-08-29
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/ssh'
    CommandLine|contains:
    - 'ProxyCommand=;'
    - 'permitlocalcommand=yes'
    - 'localhost'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
    - 'sh 0<&2 1>&2'
    - 'sh 1>&2 0<&2'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the invocation of a shell using the SSH utility on Linux systems. Such behavior can indicate malicious activity, such as an attacker attempting to escalate privileges, execute unauthorized commands, or escape from a restricted environment. The use of SSH as a command execution tool tends to obscure malicious activity, making it critical for security teams to monitor for these occurrences actively.

  The relevant tactics and techniques from the MITRE ATT&CK framework include **Execution (TA0002)** and **Command-Line Interface (T1059)**. Attackers may leverage SSH to maintain persistence, execute commands remotely, and facilitate lateral movement within the network. Therefore, capturing this activity is essential in understanding the actions of a potential intruder and mitigating the associated risks to system integrity and data confidentiality.

  Primary data sources that provide relevant evidence for this detection include process creation events, particularly logs that capture command-line arguments and the specifics of invoked binaries like SSH. Monitoring these logs allows for early detection of anomalous command executions that deviate from normal operational patterns.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs associated with SSH executions, particularly any instances where the command line includes unusual strings, such as `ProxyCommand=;` or configurations allowing local command execution.

  - **Correlate User Activity:** Identify the user account that initiated the SSH command. Investigate their typical behavior patterns and consider whether they should have used SSH in this manner.

  - **Monitor Network Activity:** Check for associated outbound connections or unusual internal network traffic during the period that SSH commands were executed. This helps determine if the command potentially facilitated lateral movement or data exfiltration.

  - **Evaluate Shell Usage:** Inspect for the invoked shell types (such as bash, dash, fish, etc.) in the command line. Look for patterns that might suggest an attacker is testing various shells to bypass restrictions or evaluate system capabilities.

  ### Prioritization
  The alert's severity is classified as high due to the potential for privilege escalation and unauthorized command execution, which can lead to significant compromises within the enterprise environment. The likelihood of encountering SSH misuse is notable, especially in environments where multiple users have SSH access.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of comprehensive process creation logging or configurations. If SSH activity is not logged appropriately, instances of misuse may go undetected. The detection logic assumes that an attacker will use recognizable command patterns; therefore, advanced evasion techniques or obscure commands may not be captured. It is essential to ensure that all Linux systems are configured to log process creation events thoroughly to enhance detection efficacy.

