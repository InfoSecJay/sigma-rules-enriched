logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/chmod'
    CommandLine|contains:
    - '/tmp/'
    - '/.Library/'
    - '/etc/'
    - '/opt/'
  condition: selection
falsepositives:
- Admin changing file permissions.
level: medium
note: |
  ### Technical Context
  This rule detects the use of the `chmod` command targeting files in directories that are typically not normal for legitimate operational activities, such as `/tmp/`, `/.Library/`, `/etc/`, or `/opt/`. These directory paths may indicate potential backdoor installations or misconfigured permission settings, commonly leveraged by attackers to escalate privileges or maintain persistence on compromised systems. By monitoring for such activity, defenders can identify irregular attempts to alter file permissions that could facilitate unauthorized access to sensitive files or enable malware execution.

  The likely threat scenarios involve attackers seeking to create backdoors, manipulate critical system files, or obscure their presence by changing file permissions. By using `chmod` in these locations, adversaries may aim to bypass security controls, make malicious scripts executable, or otherwise gain control over system behaviors. Relevant MITRE ATT&CK techniques include T1222.002 ("Permission Modification") under the Defense Evasion tactic, which reflects the attacker's objective to manipulate system permissions to their advantage.

  Primary data sources for this detection include process creation events from the Linux systems, recording the execution of commands, and the associated command line arguments that provide insight into the actions being performed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation events for instances of `chmod` and analyze the related command line arguments to identify any suspicious patterns or unexpected directory targets.

  - **Correlate with File Access Logs:** Cross-check the timestamps of the `chmod` command executions with file access logs to see if there were any concurrent file modifications or accesses that may indicate malicious activities.

  - **Assess User Account Behavior:** Investigate the user accounts responsible for executing `chmod` commands in abnormal paths. Check for anomalies, such as user accounts that typically don’t perform system-level operations or have elevated privileges that shouldn’t be exercised.

  - **Monitor for Repeated Patterns:** Set up alerts for repeated `chmod` commands targeting similar paths. This might indicate an ongoing attack or an attacker probing for system weaknesses that require further scrutiny.

  ### Prioritization
  This alert is assessed as medium severity due to the potential impact of unauthorized permission changes in sensitive directories, indicating possible malicious activity, and the frequency with which such commands can be executed unnoticed.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the absence of complete logging of all administrative commands or actions on systems. The detection logic assumes that malicious actors will target uncommon directory paths rather than utilizing legitimate directories. Necessary log configurations include ensuring that detailed process creation logging and command line parameter logging are enabled on the Linux systems being monitored to capture the relevant data.

