logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|endswith:
    - '/rsync'
    - '/rsyncd'
    Image|endswith:
    - '/ash'
    - '/bash'
    - '/csh'
    - '/dash'
    - '/ksh'
    - '/sh'
    - '/tcsh'
    - '/zsh'
  filter_main_expected:
    CommandLine|contains: ' -e '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of a shell (such as bash, sh, or zsh) as a subprocess of the `rsync` command without the use of the expected `-e` flag for remote shell execution. Such behavior may indicate a potential exploitation attempt leveraging CVE-2024-12084, which allows adversaries to execute arbitrary commands on a remote system. The likely attacker objective is privilege escalation or unauthorized access, enabling further system compromise or data exfiltration.

  This detection is associated with the MITRE ATT&CK techniques: Execution (T1059) and Exploitation for Client Execution (T1203). The primary telemetry sources include Linux process creation logs that provide information on executed commands and their parameters. If malicious, this behavior could lead to critical security breaches, given `rsync` is typically trusted for remote file transfers. However, this detection does NOT confirm exploitation or establish intent on its own without additional context.

  ### Investigation Steps

  - **Check process creation logs:** Review Linux process creation logs (e.g., `/var/log/auth.log`, `syslog`). Look for Event ID 1 on Sysmon for unexpected subprocesses related to `rsync` without the `-e` flag.

  - **Validate command context:** Examine the command line arguments used with `rsync` (process command line field). The absence of the `-e` flag while invoking a shell subprocess indicates a suspicious action.

  - **Identify high-confidence malicious indicator:** Look for user accounts or scripts frequently invoking `rsync` with shell subprocesses without valid `-e` usage. Unusual command line variations could indicate malicious activity.

  - **Alert on host role:** Determine the role of the affected host (e.g., backup server) and if it typically interacts with `rsync`. Instances on sensitive or critical systems warrant higher scrutiny.

  - **Document legitimate uses:** Note normal `rsync` commands in the environment. Review historical commands to establish a behavioral baseline, especially those employing `-e`.

  ### Prioritization

  This alert is considered high severity due to the potential impact on sensitive systems if exploitation occurs. The likelihood of malicious activity is significant, given the automated nature of exploitation techniques around known vulnerabilities like CVE-2024-12084. Such command execution attempts are often weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection limitations arise as legitimate administrative scripts may invoke `rsync` with shell subprocesses without the `-e` flag without malicious intent. Ensuring accurate logging configurations for process creation on all relevant Linux systems is crucial for reliable detection. Additionally, an alert may trigger in benign scenarios, such as misconfigured automation tools or script errors. A related detection to strengthen coverage is monitoring for known exploit patterns or unusual network traffic originating from the affected host.

