logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|endswith:
    - '/rsync'
    - '/rsyncd'
    Image|endswith:
    - '/ash'
    - '/bash'
    - '/csh'
    - '/dash'
    - '/ksh'
    - '/sh'
    - '/tcsh'
    - '/zsh'
  filter_main_expected:
    CommandLine|contains: ' -e '
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects suspicious behavior associated with the execution of a shell as a subprocess of "rsync," particularly when the expected command line flag `-e` is absent. Rsync is often used for transferring files efficiently but may be exploited (as noted in CVE-2024-12084) to execute arbitrary commands on a remote system. Attackers may utilize this capability to escalate privileges or gain unauthorized access to sensitive systems and data.

  The likely threat scenario involves an attacker leveraging a vulnerability to execute commands on a targeted Linux system, potentially leading to broader reconnaissance or lateral movements within the network. The rule specifically aligns with the following MITRE ATT&CK tactics and techniques:
  - Execution (T1203) through the exploitation of a remote code execution vulnerability.
  - Command-Line Interface (T1059) as the execution of shell commands can indicate further malicious activity.

  Primary data sources for evidence collection include process creation logs that capture command-line arguments, system processes, and the parent-child relationship of executing processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for any instances where "rsync" has spawned a shell process (like ash, bash, or zsh) without the `-e` flag. Look for unusual parent-child process relationships.
  - **Analyze Command Line Arguments**: Investigate the command line used for the shell invocation. Retrieve and scrutinize any arguments provided to determine if they align with expected rsync usage.
  - **Correlate with Network Traffic**: Check for any outbound network connections that coincide with the suspicious process creation. Look for unusual patterns or connections to unfamiliar external IP addresses.
  - **Evaluate Recent Changes**: Assess system and application logs to identify any unauthorized changes or updates to the rsync configuration that may facilitate exploitation.

  ### Prioritization
  The alerts generated by this detection rule warrant high priority due to the potential for widespread impact across the enterprise. Exploitation of the detected behavior could lead to significant breaches, unauthorized access to sensitive information, and further exploitation of internal systems.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage arises from environments where logging is incomplete or configured inconsistently, particularly in capturing all relevant process creation events. The detection logic assumes that the absence of the `-e` flag in a shell spawned by rsync indicates malicious intent, which may not always be valid in benign contexts. Additionally, for the alert to function effectively, comprehensive logging of process creation events must be enabled and properly configured, ensuring the command line arguments are captured accurately.

