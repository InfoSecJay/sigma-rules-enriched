title: User Added To Root/Sudoers Group Using Usermod
id: 6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
status: test
description: Detects usage of the "usermod" binary to add users add users to the root
  or suoders groups
references:
- https://pberba.github.io/security/2021/11/23/linux-threat-hunting-for-persistence-account-creation-manipulation/
- https://www.configserverfirewall.com/ubuntu-linux/ubuntu-add-user-to-root-group/
author: TuanLe (GTSC)
date: 2022-12-21
tags:
- attack.privilege-escalation
- attack.persistence
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/usermod'
    CommandLine|contains:
    - '-aG root'
    - '-aG sudoers'
  condition: selection
falsepositives:
- Legitimate administrator activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the `usermod` command is used to add users to the `root` or `sudoers` groups on Linux systems. This behavior can indicate a potential privilege escalation attempt, where an attacker seeks to gain elevated access to system resources. By acquiring root access, attackers can execute any command on the system, potentially leading to further breaches and data exfiltration.

  The likely scenario involves a malicious actor who has gained initial access to the system, such as through compromised credentials or exploitation of a vulnerability. Their objective would be to increase their privileges, thereby enabling them to control the system fully or perform lateral movement within the network. This tactic is aligned with the MITRE ATT&CK framework, specifically the **Privilege Escalation** tactic (TA-0004) and the **Abuse Elevation Control Mechanism** technique (T1548).

  Key evidence for this detection is often found in process creation logs, which capture the execution of commands on the system. Analyzing these logs for the `usermod` binary along with specific command-line arguments provides the best opportunity to detect unauthorized changes to user permissions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the logs for any recent executions of the `usermod` command, focusing on the specific command-line arguments `-aG root` or `-aG sudoers` that indicate a possible privilege escalation event.

  - **Identify Contextual User Information:** Cross-reference the user accounts affected by these commands with known administrators, legitimate users, and any recent suspicious account activity, such as failed login attempts or abnormal login times.

  - **Correlate with Authentication Events:** Look at authentication and authorization logs to determine if there are suspicious activities or access patterns surrounding the time of the `usermod` command executions, such as logins from unusual IP addresses or outside of normal business hours.

  - **Examine System Logs for Anomalous Behavior:** Investigate other system logs (e.g., `/var/log/auth.log` or `/var/log/secure`) for any accompanying suspicious activities or failed attempts to use sudo or access protected resources around the same time as the privilege escalation events.

  ### Prioritization
  This alert should be treated with medium priority due to the significant impact of unauthorized privilege escalation on the security posture of an enterprise environment. While not every instance may indicate malicious activity—legitimate administrative tasks can also result in similar logs—the potential for abuse warrants prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if log retention policies do not retain process creation logs for an adequate duration, leading to loss of insight into potential privilege escalation events. Additionally, the detection logic assumes that no legitimate administrative activities occur which could also utilize `usermod` but lack context on user roles. It requires properly configured logging on Linux systems to capture these command executions effectively, which includes ensuring process creation logs are enabled and monitored in a centralized log management system.

