detection:
  selection:
    Image|endswith: '/usermod'
    CommandLine|contains:
    - '-aG root'
    - '-aG sudoers'
  condition: selection
falsepositives:
- Legitimate administrator activities
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `usermod` command to add a user to the `root` or `sudoers` groups, which indicates a potential privilege escalation or persistence mechanism by an attacker. Attackers may aim to gain elevated permissions to execute unauthorized commands, modify system settings, or maintain access to systems. This behavior is associated with the MITRE ATT&CK technique for Privilege Escalation, specifically T1068 (Exploitation of Elevated Privileges) and Persistence, specifically T1136 (Create Account).

  The primary telemetry source for this detection is Linux process creation logs, particularly focused on entries related to the `usermod` command. The security impact of this behavior is significant since unauthorized access to the root privileges can lead to complete control over the system. However, this detection does NOT confirm malicious intent on its own, as legitimate administrator activities may also trigger similar alerts.

  ### Investigation Steps

  - **Check `usermod` command invocation:** Review the command execution details from `/var/log/auth.log` or `/var/log/secure` for process creation events including `usermod`, focusing on the command line used. Examine any usage of `-aG root` or `-aG sudoers`.

  - **Identify the user initiating the command:** Correlate the user account executing `usermod` with legitimate administrative responsibilities. Users with no administrative role executing these commands may indicate possible compromise.

  - **Review account group memberships:** Investigate the `/etc/group` file or use `getent group` for the updated users to confirm if they have been added to critical groups like `root` or `sudoers`. Document legitimate inclusions, e.g., recognized admins or necessary service accounts.

  - **Evaluate the context of command execution:** Analyze logs around the time of the command execution (e.g., timestamp, user context) to determine if the system was under legitimate administration (maintenance windows, previously scheduled tasks).

  - **Identify potential lateral movement:** Look at subsequent commands executed by the newly added users with increased privileges, checking monitoring tools or shell history (e.g., `.bash_history`) for signs of unauthorized access.

  - **Cross-reference with known indicators of compromise (IOCs):** Utilize threat intelligence feeds to validate if the user account or host is associated with previously known malicious behaviors or attacks.

  ### Prioritization

  The alert is rated medium severity due to the criticality of the affected system, especially if it involves servers or devices with sensitive data. The likelihood of malicious abuse is significant, as unauthorized modifications to user group memberships are often exploited in attacks. This behavior is not commonplace for legitimate activities, especially if executed by non-administrative users.

  ### Blind Spots and Assumptions

  Evasion techniques may include privileged users disguising malicious actions under legitimate administrative tasks, making proper role accountability critical. This detection assumes relevant logs for `usermod` command execution are present and configured to capture. Legitimate scenarios like system upgrades or service account adjustments may also trigger alerts. Companion detections could include monitoring for unauthorized logged user sessions or other privileged command executions (e.g., `sudo`, `chmod`).

