title: Linux Shell Pipe to Shell
id: 880973f3-9708-491c-a77b-2a35a1921158
status: test
description: Detects suspicious process command line that starts with a shell that
  executes something and finally gets piped into another shell
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2022-03-14
modified: 2022-07-26
tags:
- attack.defense-evasion
- attack.t1140
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|startswith:
    - 'sh -c '
    - 'bash -c '
  selection_exec:
  - CommandLine|contains:
    - '| bash '
    - '| sh '
    - '|bash '
    - '|sh '
  - CommandLine|endswith:
    - '| bash'
    - '| sh'
    - '|bash'
    - ' |sh'
  condition: all of selection*
falsepositives:
- Legitimate software that uses these patterns
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious command lines in Linux processes that begin with a shell execution command and use a pipe to invoke another shell. Such a structure may indicate malicious activity typically associated with command-and-control (C2) behavior, script-based attacks, or attempts to obfuscate malicious actions from security tools. By using pipes to chain commands, attackers can execute complex operations in a stealthy manner, leveraging shell features to manipulate data or execute payloads.

  The threat scenario often involves an attacker gaining access to a system and attempting to execute additional payloads or scripts in a covert fashion. The aim is to maintain persistence, exfiltrate data, or escalate privileges without detection. The relevant MITRE ATT&CK tactics include:
  - **Defense Evasion** (TA0005), which encompasses techniques to avoid detection by security mechanisms.
  - **Command-Line Interface** (T1059.003), representing the execution of commands through a shell.

  Primary data sources for identifying such behavior include process creation logs that capture command-line arguments when processes are initiated, which provide insight into what commands are being executed and how they may be chained together.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs to identify any instances where the command line begins with `sh -c` or `bash -c`, looking specifically for invoked processes that use a pipe to another shell.
  - **Analyze Parent-Child Process Relationships**: Investigate parent-child relationships of processes to determine if an initial benign process could be misused for further malicious actions via piping commands.
  - **Correlate with User Activity**: Check user logs and authentication data to identify legitimate user activity at the time these processes were initiated, which may indicate whether the actions were authorized or suspicious.
  - **Investigate Network Connections**: Look for any network activity or outbound connections initiated by suspicious processes that could indicate communication with a remote C2 server or data exfiltration.

  ### Prioritization
  This alert is classified as medium severity in an enterprise environment due to the potential for significant impact if an attacker successfully executes malicious commands via these methods. The likelihood of encountering such behavior is heightened in environments that have been previously targeted or are undergoing active exploitation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to legitimate use cases, as many administrative and development tasks might utilize similar command patterns for benign purposes. The detection logic assumes that all piped shell commands involving `bash` or `sh` are of interest, which may lead to false positives in valid scenarios. For this alert to function effectively, proper logging configurations must be enabled to capture detailed process creation events, including command-line arguments.

