title: Linux Shell Pipe to Shell
id: 880973f3-9708-491c-a77b-2a35a1921158
status: test
description: Detects suspicious process command line that starts with a shell 
  that executes something and finally gets piped into another shell
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2022-03-14
modified: 2022-07-26
tags:
- attack.defense-evasion
- attack.t1140
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|startswith:
    - 'sh -c '
    - 'bash -c '
  selection_exec:
  - CommandLine|contains:
    - '| bash '
    - '| sh '
    - '|bash '
    - '|sh '
  - CommandLine|endswith:
    - '| bash'
    - '| sh'
    - '|bash'
    - ' |sh'
  condition: all of selection*
falsepositives:
- Legitimate software that uses these patterns
level: medium
note: |
  ### Technical Context

  This rule detects the execution of commands in a Linux environment where a shell process (sh or bash) is used to pipe output to another shell instance. This behavior is often indicative of attempts to obfuscate command execution or evade detection mechanisms, a tactic aligned with MITRE ATT&CK's Defense Evasion (T1140). Attackers may use such command constructs to execute malicious scripts or commands in a more covert fashion.

  The primary telemetry sources for detecting this behavior are process creation logs from the Linux operating system, specifically focusing on command line executions of processes. If malicious, this behavior would enable an attacker to execute commands in a way that could compromise system integrity, collect sensitive information, or establish persistence.

  It is important to note that this detection does NOT confirm malicious activity on its own; further context is required to determine the intent behind the command invocation.

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID relevant to process creation on the Linux host. Search for command lines containing `sh -c` or `bash -c` along with pipes to another shell (`| bash` or `| sh`). Focus on identifying the parent process for context.

  - **Assess the command context:** Identify what command is being executed prior to the pipe and assess if it's known or expected behavior. Legitimate uses may include script execution in controlled environments (e.g., automated tasks, software installations).

  - **Correlate with user activity:** Match the time of the alert with user activity logs (e.g., `/var/log/auth.log`). Look for user logins and their command history to determine if the user had a legitimate reason to execute the command.

  - **Monitor for known bad indicators:** Identify if the command line contained any known malicious artifacts or patterns (e.g., encoded payloads, suspicious parameters). Particular attention should be given to recent vulnerabilities associated with any executed commands.

  - **Determine host role and criticality:** Assess whether the Linux system is in a sensitive role (e.g., a web server, database server). A process execution in critical roles poses higher risks and may require immediate escalation.

  - **Check for additional indicators of compromise (IoCs):** Investigate if there are any unusual outbound network connections or file modifications occurring around the same time as the alert, which may indicate malicious intent.

  ### Prioritization

  The alert is classified as medium severity. Given that it involves command execution patterns capable of evading detection, there is a reasonable likelihood of malicious abuse, particularly on critical systems. This behavior is likely weaponized in specific attack scenarios, making it imperative to investigate.

  ### Blind Spots and Assumptions

  Detection may be limited if command logging is not uniformly enabled or if the event logs are aggregated incorrectly. Legitimate software operations, such as automated deployment scripts, may trigger false positives. To strengthen coverage, consider companion detections for abnormal network activity or process injection patterns that may accompany this command execution behavior.

