logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|startswith:
    - 'sh -c '
    - 'bash -c '
  selection_exec:
  - CommandLine|contains:
    - '| bash '
    - '| sh '
    - '|bash '
    - '|sh '
  - CommandLine|endswith:
    - '| bash'
    - '| sh'
    - '|bash'
    - ' |sh'
  condition: all of selection*
falsepositives:
- Legitimate software that uses these patterns
level: medium
note: |
  ### Technical Context

  This rule detects processes on Linux systems where a shell command makes use of piping to execute another shell, specifically looking for command lines that start with "sh -c" or "bash -c" and contain a pipe to another shell instance. The likely attacker objective is to obfuscate malicious command execution or to chain multiple commands in a single execution context, which can aid in stealth and evasion from detection mechanisms. This behavior correlates with the MITRE ATT&CK technique for "Command and Scripting Interpreter: Shell Scripting" (T1140).

  The primary telemetry sources for this detection are Linux process creation logs, particularly focusing on fields that capture the command-line parameters used during process initialization (e.g., syslog or auditd logs). If malicious, this behavior could indicate an attempted compromise, data exfiltration, or executing payloads. However, this detection does NOT confirm that malicious activity is occurring solely based on the detection, as similar command structures can occur in legitimate use cases.

  ### Investigation Steps

  - **Review command line arguments:** Analyze process creation logs (e.g., `/var/log/audit/audit.log` or `/var/log/syslog`) for Event IDs related to process creation. Look for command lines starting with "sh -c" or "bash -c" and containing "| bash" or "| sh". Compare with known benign processes and scripts to establish legitimacy.

  - **Correlate with user activity:** Check last login timestamps and user activities around the time of the alert. Use `last` command or check user session logs to identify if the user had legitimate reasons to execute piping commands.

  - **Identify high-confidence malicious indicators:** Look for unusual user accounts or elevated privileges initiating these command lines. Check for multiple chained command executions that could suggest obfuscation attempts, especially if followed shortly by suspicious file creation or network connections.

  - **Compare with known benign software usage:** Investigate if any legitimate applications or scripts are utilizing shell pipelines. Reference corporate software inventories to identify expected behaviors versus the current alert.

  - **Check for concurrent network connections:** Review network logs (e.g., firewall logs or `netstat` output) to identify any unexpected outbound connections initiated post-process creation. Analyzing the source process IDs can correlate network activity directly back to the alerting process.

  ### Prioritization

  This alert holds medium severity due to the potential impact on critical Linux systems where command execution could lead to data compromise or lateral movement. The likelihood of abuse is moderate, as attackers often leverage shell scripts and pipelines for stealthy command execution. However, this behavior can also occur during legitimate software operations, which necessitates thorough investigation.

  ### Blind Spots and Assumptions

  Detection may miss encoded or obfuscated commands that can bypass simple pattern matching. Continuous logging and configurations for process monitoring are crucial for reliable detection, including retaining logs with command line arguments. Legitimate activities, such as administrative scripts or software updates, may trigger this alert. A complementary detection could involve monitoring for unauthorized access to sensitive files or auditing command execution as part of a broader analysis suite.

