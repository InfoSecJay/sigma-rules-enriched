note: |
  ### Technical Context

  This Sigma rule detects the use of the `--unsafe` option in the `bpftrace` command on Linux systems. This behavior is typically associated with an attacker attempting to leverage advanced tracing capabilities to gather data on system activity, potentially for reconnaissance or exploitation. The relevant MITRE ATT&CK tactic is **Execution** and the technique is **Command Line Interface** (T1059.004).

  The primary telemetry source is the process creation logs from Linux, specifically looking for instances where `bpftrace` is executed with the unsafe flag in the command line arguments. The security impact is significant as this may indicate an attempt to perform unauthorized monitoring or alter behaviors on the host. It is important to note that this detection does NOT confirm malicious activity on its own, as there may be legitimate use cases for the `--unsafe` flag.

  ### Investigation Steps

  - **Identify the process execution: ** Review **process creation logs** for Event ID 1 (Sysmon) or Linux audit logs that indicate the execution of `bpftrace` with the `--unsafe` flag. Determine the user context to assess whether it aligns with expected operations.

  - **Check for unusual command patterns:** Analyze the command line arguments of the identified `bpftrace` execution. Benign usage may include specific target processes or resources (e.g., `bpftrace -e 'tracepoint:syscalls:sys_enter_execve'`). Any additional or obfuscated parameters might indicate malicious intent.

  - **Review user and permission context:** Validate the account used to invoke `bpftrace`. Legitimate administrative users might have various safe uses of `bpftrace`, but unusual accounts or those with limited permissions running the command should be considered suspicious.

  - **Cross-reference file activity:** Check for file system traces related to actions taken by `bpftrace`, such as temporary files or logs generated during execution. Analyze the files’ creation times (using `stat` or equivalent) and contents to identify any indicators of compromise.

  - **Identify repeat offenders: ** If the `--unsafe` flag usage is observed repeatedly from the same host, elevate the incident for further investigation due to possible malicious action or prior compromise.

  ### Prioritization

  This alert should be treated with medium severity. The impact depends on the role of the affected system; if it acts as a production server or contains sensitive data, an attacker utilizing `bpftrace` could gather critical operational data. The likelihood of malicious use is moderate, as this technique is sometimes weaponized, particularly in targeted attacks.

  ### Blind Spots and Assumptions

  Limitations include that the detection might miss legitimate use cases by system administrators who require advanced tracing options. Reliable detection requires correct configuration of process creation auditing in Linux. Additionally, benign applications of `bpftrace` may occasionally trigger this alert, highlighting the need for context during investigation. A related detection could involve monitoring for unusual user behavior or access patterns, which may indicate further compromise or reconnaissance.

