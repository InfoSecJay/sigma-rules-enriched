note: |
  ### Technical Context
  This detection rule targets the usage of the unsafe option in `bpftrace`, a powerful tracing tool for Linux that is often exploited for reconnaissance and privilege escalation by attackers. By monitoring for command-line invocations of `bpftrace` that include the `--unsafe` flag, security teams can identify potentially malicious usage of this tool, which could allow an attacker to bypass security controls and gather sensitive information from the system.

  The likely attacker objective is to execute arbitrary code or gather sensitive data from the kernel and user space, leveraging `bpftrace` to facilitate post-exploitation tasks. This behavior can lead to further system compromise or lateral movement within the network. According to the MITRE ATT&CK framework, this detection aligns with the Execution tactic under the technique T1059.004 (Scripting - Shell Scripting), as attackers may use shell commands to execute `bpftrace` with the unsafe option as part of their attack strategy.

  Primary data sources for this detection are process creation events on Linux systems, which will capture the details of process launches including command-line arguments and the images being executed, enabling analysts to investigate any identified potentially malicious activity.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine recent process creation logs for instances of `bpftrace` being executed with the `--unsafe` option. Pay attention to the command-line arguments for context on how it was used.

  - **Correlate with User Activity:** Investigate the associated user accounts that executed `bpftrace` commands to determine if the actions were taken by authorized users or indicate potential compromised accounts.

  - **Analyze System Changes:** Check for any alterations to system files or configurations that coincide with the execution of `bpftrace` to identify possible exploitation or data exfiltration activities.

  - **Assess Network Traffic:** Monitor outbound network traffic for any anomalous connections or data exfiltration attempts that may be linked to the usage of `bpftrace`, as attackers may use it to facilitate communication with C2 servers.

  ### Prioritization
  This alert is considered medium severity due to the potential implications of `bpftrace` misuse. While legitimate users may use the tool for troubleshooting or monitoring purposes, its unsafe option indicates a risk for malicious exploitation that warrants immediate investigation, particularly in environments where strict security policies are in place.

  ### Blind Spots and Assumptions
  While this detection logic can identify potentially malicious uses of `bpftrace`, it may not cover all scenarios, particularly if unauthorized users utilize similar command-line tools under different names or flags. Additionally, it assumes that logging for process creation events is configured and sufficiently detailed to capture command-line arguments. Organizations must ensure comprehensive logging is enabled to support this detection, and analysts should be cautious of false positives stemming from legitimate use cases of `bpftrace`.

