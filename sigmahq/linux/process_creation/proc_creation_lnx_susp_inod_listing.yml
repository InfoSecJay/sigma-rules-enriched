title: Potential Container Discovery Via Inodes Listing
id: 43e26eb5-cd58-48d1-8ce9-a273f5d298d8
status: test
description: Detects listing of the inodes of the "/" directory to determine if the
  we are running inside of a container.
references:
- https://blog.skyplabs.net/posts/container-detection/
- https://stackoverflow.com/questions/20010199/how-to-determine-if-a-process-runs-inside-lxc-docker
tags:
- attack.discovery
- attack.t1082
author: Seth Hanford
date: 2023-08-23
modified: 2025-11-24
logsource:
  category: process_creation
  product: linux
detection:
  selection_ls_img:
    Image|endswith: '/ls'        # inode outside containers low, inside high
  selection_ls_cli:
  - CommandLine|endswith: ' /'
  - CommandLine|contains: ' / '
  selection_regex_inode:
    CommandLine|re: '(?:\s-[^-\s]{0,20}i|\s--inode\s)'          # -i finds inode number
  selection_regex_dir:
    CommandLine|re: '(?:\s-[^-\s]{0,20}d|\s--directory\s)'      # -d gets directory itself, not contents
  condition: all of selection_*
falsepositives:
- Legitimate system administrator usage of these commands
- Some container tools or deployments may use these techniques natively to determine
  how they proceed with execution, and will need to be filtered
level: low
note: |
  ### Technical Context
  This detection rule identifies attempts to discover the presence of a container environment by monitoring for specific command-line actions related to inodes in the root directory ("/") of a Linux system. Attackers may use these techniques to determine their operating environment, which can inform subsequent actions, such as privilege escalation or lateral movement. By understanding whether they are operating within a container, adversaries can adjust their tactics to exploit known vulnerabilities or misconfigurations specific to containerized environments.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Discovery (TA0007)**: Gaining information about a system's environment.
  - **File and Directory Discovery (T1082)**: Enumerating files and directories to locate sensitive resources or assess the operational context.

  The primary data sources to consider for detecting such behavior include process creation events on Linux systems, which log the commands executed, along with their arguments and associated metadata.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine process creation logs for any instances of the `ls` command being executed with inode-related options. Pay particular attention to any suspicious timing or user accounts associated with these logs.
  - **Analyze Command-Line Arguments**: Filter through command-line arguments for indicators of inode listing, specifically looking for patterns that match `-i` or `--inode`, as well as commands attempting to read directories in an unconventional manner.
  - **Correlate with User Behavior**: Investigate the user accounts executing these commands. Look for atypical user activity that may indicate malicious intent, such as commands executed by non-admin users that are usually indicative of container awareness.
  - **Identify Contextual Anomalies**: Look for combinations of commands and execution contexts that are abnormal for your environment. This may include unauthorized times of execution or commands that typically require heightened privileges.

  ### Prioritization
  This alert is prioritized as low severity due to its potential use as an information-gathering step by attackers. However, it is essential to consider that understanding their environment is a precursor to more severe exploitation tactics, which could impact organizational security.

  ### Blind Spots and Assumptions
  The detection coverage may be limited by environments that utilize legitimate container management tools that perform similar inode checks as part of their normal operation. The detection logic assumes that suspicious command-line arguments indicate nefarious activity, which may not always be the case. For effective detection, it is crucial that process creation logs are enabled and retain sufficient history to capture these events accurately. Without proper configuration, legitimate administrative actions may also trigger false positives, requiring careful tuning of the detection logic.

