title: Potential Container Discovery Via Inodes Listing
id: 43e26eb5-cd58-48d1-8ce9-a273f5d298d8
status: test
description: Detects listing of the inodes of the "/" directory to determine if 
  the we are running inside of a container.
references:
- https://blog.skyplabs.net/posts/container-detection/
- https://stackoverflow.com/questions/20010199/how-to-determine-if-a-process-runs-inside-lxc-docker
tags:
- attack.discovery
- attack.t1082
author: Seth Hanford
date: 2023-08-23
modified: 2025-11-24
logsource:
  category: process_creation
  product: linux
detection:
  selection_ls_img:
    Image|endswith: '/ls'        # inode outside containers low, inside high
  selection_ls_cli:
  - CommandLine|endswith: ' /'
  - CommandLine|contains: ' / '
  selection_regex_inode:
    CommandLine|re: '(?:\s-[^-\s]{0,20}i|\s--inode\s)'          # -i finds inode number
  selection_regex_dir:
    CommandLine|re: '(?:\s-[^-\s]{0,20}d|\s--directory\s)'      # -d gets directory itself, not contents
  condition: all of selection_*
falsepositives:
- Legitimate system administrator usage of these commands
- Some container tools or deployments may use these techniques natively to 
  determine how they proceed with execution, and will need to be filtered
level: low
note: |
  ### Technical Context

  This Sigma rule detects the listing of inodes on the root directory ("/") within Linux environments, which is often an indicator that an adversary is attempting to ascertain whether they are operating within a containerized environment. The likely attacker objective is to identify their environment's constraints to adapt their exploitation tactics accordingly. This behavior aligns with the MITRE ATT&CK tactic of Discovery (T1082). The primary telemetry source for this detection is process creation logs, specifically looking for command-line activity involving the `ls` command with specific parameters highlighting inode listing.

  If malicious, the security impact could range from gaining insights into the container's architecture to executing further attacks tailored to the containerized environment. However, this detection does NOT confirm that malicious activity is occurring by itself; legitimate administrative tasks may trigger similar command usage.

  ### Investigation Steps

  - **Check process execution history:** Review process creation logs (e.g., Linux Audit logs or `syslog`) for Event IDs related to command execution, focusing on any entries that include the command `ls` with flags indicating inode (`-i`) or directory (`-d`) listing activities.

  - **Identify high-confidence malicious indicators:** Look for `ls` processes executed with parameters showing inodes being specifically requested (e.g., `-i` or `--inode`). Pay particular attention to processes initiated by users who typically do not require container discovery information.

  - **Assess legitimate system administrator activity:** Confirm if system administrators or trusted roles are the ones executing the commands. Administrative tasks (e.g., checking filesystem structure) typically show more diverse command usage, while repetitive inode listings may imply malicious intent.

  - **Analyze command-line patterns:** Review command lines in the logs for the use of `ls` commands terminating with `/` or containing space and `/`. Frequent use during non-administrative hours could suggest suspicious behavior.

  - **Evaluate container orchestration logs:** Check deployment tools and container orchestration logs (e.g., Kubernetes, Docker) for records of commands run in containers. Legitimate deployments may trigger similar inode checks and should be corroborated with orchestration event logs.

  ### Prioritization

  In an enterprise context, this alert is of low severity due to its typical occurrence during legitimate administrative activities, yet it warrants attention because, if leveraged for malicious purposes, it can expose container configurations. The likelihood of abuse is moderate, particularly in environments where security misconfigurations are common and discovery tactics are weaponized.

  ### Blind Spots and Assumptions

  This detection may miss evasive techniques where attackers employ obfuscation or custom scripts to list inodes without triggering standard command detection. Additionally, without comprehensive logging from all potential processes, some legitimate container tooling practices may inadvertently trigger this alert. A companion detection could be tracking abnormal user behavior in conjunction with reviewing filesystem access logs to enhance the understanding of the context around the inode queries.

