note: |
  ### Technical Context
  This detection rule identifies attempts to enumerate local network configurations on Linux systems. The rule focuses on process creation events for specific commands and image paths that may indicate an attacker is attempting to gather information about network settings, routing tables, and firewall configurations. This behavior is often associated with reconnaissance activities where attackers seek to understand the network environment before launching further attacks, such as lateral movement or data exfiltration.

  The primary objectives of an attacker using network discovery techniques can include mapping the network to identify vulnerable systems, understanding the network infrastructure for privilege escalation opportunities, or identifying potential pivot points to other systems. Understanding the network layout can also help attackers avoid security measures in place.

  This rule aligns with the following MITRE ATT&CK tactics and techniques:
  - **Tactic:** Discovery
  - **Technique:** Network Service Discovery (T1016)

  The expected data sources for detecting this activity primarily include process creation events, monitored on Linux systems, which will capture the execution of commands associated with network enumeration.

  ### Investigation Steps
  - **Review Process Creation Events:** Analyze recent process creation logs for executions of suspected commands such as `ifconfig`, `netstat`, and `iptables` to identify unauthorized enumeration activities.
  - **Check Command Line Arguments:** Investigate command-line arguments associated with the detected processes for indicators of suspicious activity, particularly the inclusion of `/etc/resolv.conf`, which can reveal DNS configurations.
  - **Correlate with User Activity:** Cross-reference the identified processes against user and group membership activities, noting whether the commands were executed by users outside of standard operational roles.
  - **Examine System Logs:** Look into system logs for any entries that coincide with the execution of these commands, as they may provide context or additional indicators of malicious intent.

  ### Prioritization
  This alert holds informational severity due to its nature of detecting system-level network discovery, which may indicate preliminary reconnaissance activities by potential attackers. While it may not indicate immediate threat escalation, detecting this behavior can be crucial for identifying larger intrusion attempts.

  ### Blind Spots and Assumptions
  The detection logic may not account for legitimate administrative activities involving these commands, leading to potential false positives. It assumes that command execution is indicative of malicious intent without context from other telemetry sources. For this alert to function effectively, robust logging of process creation and command-line arguments on Linux systems is necessary, along with appropriate monitoring configurations established within the environment.

