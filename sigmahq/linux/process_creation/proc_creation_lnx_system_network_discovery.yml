note: |
  ### Technical Context

  This Sigma rule detects the enumeration of local network configuration via common command-line tools utilized in Linux environments. Attackers may use these commands to gather information about network interfaces and routing tables, potentially to identify targets, plan lateral movement, or establish persistence. The relevant MITRE ATT&CK technique is "Network Service Discovery" (T1016). Key telemetry sources include process creation logs from Linux systems that capture command executions. If malicious, such enumeration can facilitate further network exploitation or reconnaissance efforts. However, this detection alone does not confirm malicious intent, as legitimate system administration also involves network configuration checks.

  ### Investigation Steps

  - **Review process creation events:** Check for Linux process creation logs (e.g., audit logs or Syslog) identifying Event IDs associated with commands such as `netstat`, `ifconfig`, or `iptables`. For example, logs may include `/usr/bin/netstat` or `/sbin/ifconfig` specifically called.

  - **Analyze command-line arguments:** Look for the CommandLine field containing `/etc/resolv.conf` alongside process usage. Malicious activity may use this in the context of querying DNS configurations, which could indicate nefarious motives if combined with suspicious IP addresses.

  - **Determine host role and context:** Confirm whether the affected system is expected to run such commands regularly (e.g., managed servers or cloud instances). Interacting with network configurations is typical for system administrators but unexpected on user workstations.

  - **Identify alarming patterns:** Cross-reference any instances of process execution with known attacker tools or behaviors. A high-confidence indicator of compromise could include multiple invocations of network-related commands executed in rapid succession or on a host not typically associated with such activities.

  - **Evaluate historical activity:** Review logs for patterns of repeated network enumeration from the same user or system, especially if it is out of the ordinary based on expected operational behavior.

  ### Prioritization

  This alert should be prioritized as informational but warrants further investigation, especially if originating from critical assets or environments with sensitive information. Although network enumeration is a common technique for both legitimate administrative tasks and malicious reconnaissance, the context of the command execution may elevate the severity if linked to additional suspicious behavior.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as command obfuscation or the use of altered tools. Reliable detection requires comprehensive logging configurations that capture command-line details in exhaustive logs. Legitimate activities may include network configuration checks by system administrators or automated scripts. Companion detections, like monitoring for unexpected changes in firewall settings or network configurations, can strengthen overall assessment coverage.

