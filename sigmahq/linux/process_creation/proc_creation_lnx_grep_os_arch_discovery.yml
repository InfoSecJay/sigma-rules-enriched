note: |
  ### Technical Context
  This detection rule identifies the use of the `grep` command to extract information about the operating system architecture on Linux systems. This behavior is typically part of an attacker's reconnaissance phase, where the objective is to ascertain the underlying architecture of the target system. Such information can help attackers tailor their exploitation techniques or deploy malware that aligns with the system's architecture, enhancing their chances of a successful attack.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007), with the specific technique being **System Information Discovery** (T1082). Attackers often employ commands like `uname` or examine `/proc/cpuinfo` prior to using `grep` to refine their understanding of the system, making this detection critical in identifying potentially malicious reconnaissance activities.

  Primary data sources for this alert include **process creation logs**, specifically focused on Linux systems. These logs can provide insights into command executions, including arguments passed to `grep` that reference system architecture information.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances of the `grep` command executed in conjunction with architecture-specific keywords such as 'aarch64,' 'arm,' 'i386,' 'i686,' 'mips,' or 'x86_64.'
  - **Correlate with System Information Commands**: Check for preceding commands like `uname` or `cat /proc/cpuinfo` in the logs to establish a pattern of reconnaissance behavior aligned with the grep execution.
  - **Identify User and System Context**: Assess the user account that executed the commands and any associated processes to determine if the behavior is consistent with normal operational activity.
  - **Cross-reference with Network Activity**: If available, analyze network logs for connections initiated by the same user or processes around the time of the detected `grep` command execution to identify any potential C2 communications or further malicious activity.

  ### Prioritization
  Despite being classified as low severity, this alert signifies preparatory steps that could lead to more serious attacks. Detecting such reconnaissance activity promptly may prevent further exploitation attempts by adversaries.

  ### Blind Spots and Assumptions
  This detection rule may not capture all reconnaissance attempts, as attackers could employ alternative methods or obfuscate their commands. The effectiveness of this detection logic relies on the presence of accurate and comprehensive process creation logs. If these logs are overly filtered or historical data is limited, potential malicious activities could go unnoticed. Assumptions made include that the `grep` command usage is uncommon in regular administrative tasks on the monitored systems; if that is not the case, false positives may occur.

