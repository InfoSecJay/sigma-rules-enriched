note: |
  ### Technical Context

  This Sigma rule detects the execution of the `grep` command specifically used to extract information about the operating system architecture. Attackers may utilize this command to gather details that could aid in further exploitation, such as understanding the system's architecture for payload compatibility or determining the presence of specific vulnerabilities. The relevant MITRE ATT&CK tactic is Discovery, with the technique identified as System Information Discovery (T1082).

  The primary telemetry source is Linux process creation logs, which detail command execution. If this alert is triggered maliciously, it can indicate reconnaissance behaviors that precede exploitation attempts. However, this detection alone does NOT confirm malicious intent, as legitimate administrative tasks may involve similar commands.

  ### Investigation Steps

  - **Verify the command invocation context**: Check the full command line in process creation logs (e.g., /var/log/apt/history.log) for the `grep` command, noting if it was preceded by `uname` or `/proc/cpuinfo`, indicating potential malicious reconnaissance.

  - **Assess involved user accounts**: Identify the user associated with the process (e.g., by checking the `USER` field in `/var/log/auth.log`). Legitimate administrative accounts may run useful commands, while unexpected or service accounts might signal malicious intent.

  - **Analyze system architecture relevance**: Review the process output for architecture (e.g., `uname -m`) present in command history. Expected benign behavior typically includes system administrators running this command for documentation or troubleshooting purposes.

  - **Identify high-confidence malicious indicators**: Cross-check against known adversarial toolsets, such as GobRAT, by correlating timestamps and user accounts with identified malicious processes in your threat intelligence platform.

  - **Investigate for automated execution**: Look for patterns of repeated process executions within a short time frame, which may suggest scripted or automated reconnaissance, and check the cron jobs in `/etc/crontab` and user crontabs (`crontab -l` for all users).

  ### Prioritization

  This alert should be categorized as low severity due to the nature of the detected command. However, if triggered on critical systems or by unusual accounts, further investigation is warranted. The likelihood of abuse exists if used in conjunction with other reconnaissance techniques, but the command itself is not commonly weaponized by itself.

  ### Blind Spots and Assumptions

  This detection may be limited by the presence of legitimate administrative tasks that involve similar command usage. Additionally, if process logging is disabled or misconfigured, this rule may not trigger. Normal user behavior, such as system checks or development activities, may also generate similar commands. Related detections for suspicious command patterns or unusual process trees (e.g., Sysmon Event ID 1) can enhance coverage against these investigative efforts.

