title: OMIGOD SCX RunAsProvider ExecuteScript
id: 6eea1bf6-f8d2-488a-a742-e6ef6c1b67db
status: test
description: |
  Rule to detect the use of the SCX RunAsProvider ExecuteScript to execute any UNIX/Linux script using the /bin/sh shell.
  Script being executed gets created as a temp file in /tmp folder with a scx* prefix.
  Then it is invoked from the following directory /etc/opt/microsoft/scx/conf/tmpdir/.
  The file in that directory has the same prefix scx*. SCXcore, started as the Microsoft Operations Manager UNIX/Linux Agent, is now used in a host of products including
  Microsoft Operations Manager, Microsoft Azure, and Microsoft Operations Management Suite.
references:
- https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
- https://github.com/Azure/Azure-Sentinel/pull/3059
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2022-10-05
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.execution
- attack.t1068
- attack.t1190
- attack.t1203
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    User: root
    LogonId: 0
    CurrentDirectory: '/var/opt/microsoft/scx/tmp'
    CommandLine|contains: '/etc/opt/microsoft/scx/conf/tmpdir/scx'
  condition: selection
falsepositives:
- Legitimate use of SCX RunAsProvider ExecuteScript.
level: high
note: |
  ### Technical Context
  This detection rule identifies the execution of scripts on UNIX/Linux systems through the Microsoft SCX (System Center Cross Platform) RunAsProvider ExecuteScript. The SCX component is part of various Microsoft monitoring solutions, and its misuse can lead to unauthorized script execution, enabling potential attackers to exploit systems or escalate privileges. The threat scenario likely involves an attacker leveraging vulnerabilities within the SCX agent, possibly the OMIGOD vulnerability, to run malicious scripts in a compromised environment.

  The corresponding MITRE ATT&CK tactics include **Initial Access** (TA0001), specifically **Exploitation of Public-Facing Application** (T1190), and **Execution** (TA0002) through **Command-Line Interface** (T1059) or **Applicable Technique** (T1068). This may also be linked to **Privilege Escalation** (TA0004), given that the detected activity occurs under the root user context. The primary data sources for this detection include **process creation logs**, which provide insights into the commands executed and the users behind them.

  ### Investigation Steps
  - **Review Process Creation Events**: Investigate logs for process creation events matching the criteria of the detection rule. Focus on instances where the user is root and the command line contains references to `/etc/opt/microsoft/scx/conf/tmpdir/scx`.

  - **Analyze Script Execution**: Check the `/tmp` and `/etc/opt/microsoft/scx/conf/tmpdir/` directories for unusual files with the `scx*` prefix. Pay attention to timestamps and contents for signs of unauthorized access or malicious intent.

  - **Examine User Accounts**: Identify changes in user privileges or access logs related to the root user. Look for any anomalies, such as unusual login patterns or concurrent sessions from unexpected locations.

  - **Cross-Reference Vulnerability Intelligence**: Utilize vulnerability management tools to check if the systems in question are exposed to known vulnerabilities related to the SCX component, specifically those linked to the OMIGOD vulnerabilities.

  ### Prioritization
  This alert is rated high due to the critical nature of the OMIGOD vulnerabilities in enabling unauthorized script execution, which could lead to complete system compromise and severe operational impact in an enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage is limited to scenarios where the SCX agent is present and configured to execute scripts in the observed manner. Assumptions made by the detection logic include the reliance on the root user executing the scripts; lower-privileged accounts executing scripts may not be captured. This rule requires proper logging configuration to ensure that process creation events are generated and monitored effectively, as well as visibility into script execution paths.

