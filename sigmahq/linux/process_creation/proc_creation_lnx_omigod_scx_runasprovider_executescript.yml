title: OMIGOD SCX RunAsProvider ExecuteScript
id: 6eea1bf6-f8d2-488a-a742-e6ef6c1b67db
status: test
description: |
  Rule to detect the use of the SCX RunAsProvider ExecuteScript to execute any UNIX/Linux script using the /bin/sh shell.
  Script being executed gets created as a temp file in /tmp folder with a scx* prefix.
  Then it is invoked from the following directory /etc/opt/microsoft/scx/conf/tmpdir/.
  The file in that directory has the same prefix scx*. SCXcore, started as the Microsoft Operations Manager UNIX/Linux Agent, is now used in a host of products including
  Microsoft Operations Manager, Microsoft Azure, and Microsoft Operations Management Suite.
references:
- https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
- https://github.com/Azure/Azure-Sentinel/pull/3059
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2022-10-05
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.execution
- attack.t1068
- attack.t1190
- attack.t1203
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    User: root
    LogonId: 0
    CurrentDirectory: '/var/opt/microsoft/scx/tmp'
    CommandLine|contains: '/etc/opt/microsoft/scx/conf/tmpdir/scx'
  condition: selection
falsepositives:
- Legitimate use of SCX RunAsProvider ExecuteScript.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of scripts using the SCX RunAsProvider ExecuteScript in a UNIX/Linux environment, specifically when a script is invoked from the directory `/etc/opt/microsoft/scx/conf/tmpdir/`. The likely objective of an attacker employing this method is to exploit the OMIGOD vulnerability, allowing for unauthorized command execution and potential escalation of privileges. The relevant MITRE ATT&CK tactics include Initial Access (T1190) and Execution (T1203).

  The primary telemetry sources for this detection include process creation logs from Linux systems, specifically focusing on user activity from the root account (LogonId: 0). If malicious, this behavior can lead to significant security impacts, such as system compromise or lateral movement. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate uses of SCX RunAsProvider ExecuteScript can also trigger this alert.

  ### Investigation Steps

  - **Examine process creation details:** Review process creation logs (e.g., `syslog`, `/var/log/auth.log`). Look for Security Event IDs associated with script execution and note entries matching the command-line pattern indicating `/etc/opt/microsoft/scx/conf/tmpdir/scx`.

  - **Check file creation in /tmp directory:** Inspect `/tmp` for newly created files with the `scx*` prefix during the same timeframe. Legitimate executions should correspond with known maintenance or update schedules from SCX.

  - **Identify legitimate SCX usage:** Verify whether the script execution aligns with authorized maintenance activities and whether there are documented procedures for using SCX RunAsProvider in your environment.

  - **Correlate with SCX agent logs:** Review logs from the SCX (Microsoft Operations Manager UNIX/Linux Agent) to identify the context of the script execution and any associated management commands that may explain legitimate usage.

  - **Assess root account activity:** Investigate all root account interactions that occurred before and after the alert was triggered. Look for unusual command sequences, especially those attempting to download additional payloads or escalate privileges.

  - **Note the potential for lateral movement:** Analyze network logs for any suspicious outbound connections from the affected host, especially those that may indicate data exfiltration or attempts to connect to other internal systems following the execution of the script.

  ### Prioritization

  This alert is prioritized as high severity due to the critical implications of root account activity associated with script execution. The presence of an active SCX invocation within the context of system management could indicate an exploit of known vulnerabilities, making this a prime target for adversary exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative routines that use SCX for routine tasks, potentially leading to false positives. Reliable detection requires comprehensive logging of process creation events and monitoring of root account usage. Legitimate activity may include scheduled maintenance or updates performed using SCX, necessitating context around the alert. Complementary detection rules focusing on anomalous process behavior or network connections can enhance visibility and minimize blind spots.

