title: OMIGOD SCX RunAsProvider ExecuteScript
id: 6eea1bf6-f8d2-488a-a742-e6ef6c1b67db
status: test
description: |
  Rule to detect the use of the SCX RunAsProvider ExecuteScript to execute any UNIX/Linux script using the /bin/sh shell.
  Script being executed gets created as a temp file in /tmp folder with a scx* prefix.
  Then it is invoked from the following directory /etc/opt/microsoft/scx/conf/tmpdir/.
  The file in that directory has the same prefix scx*. SCXcore, started as the Microsoft Operations Manager UNIX/Linux Agent, is now used in a host of products including
  Microsoft Operations Manager, Microsoft Azure, and Microsoft Operations Management Suite.
references:
- https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
- https://github.com/Azure/Azure-Sentinel/pull/3059
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2022-10-05
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.execution
- attack.t1068
- attack.t1190
- attack.t1203
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    User: root
    LogonId: 0
    CurrentDirectory: '/var/opt/microsoft/scx/tmp'
    CommandLine|contains: '/etc/opt/microsoft/scx/conf/tmpdir/scx'
  condition: selection
falsepositives:
- Legitimate use of SCX RunAsProvider ExecuteScript.
level: high
note: |
  ---

  ### Technical Context

  This detection identifies the execution of scripts via the SCX RunAsProvider on UNIX/Linux systems, specifically noting the creation and invocation of temporary files prefixed with "scx" in designated directories. The likely attacker objective is to exploit vulnerabilities in the Microsoft Operations Management Infrastructure, facilitating privilege escalation or execution of unauthorized commands. This behavior aligns with MITRE ATT&CK techniques such as Execution (T1203) and Privilege Escalation (T1068). Primary telemetry sources include process creation logs, particularly focusing on fields indicating user, logon ID, current directory, and command line. If this behavior is malicious, it could lead to unauthorized access and system compromise. It is essential to note that this detection does NOT confirm malicious intentions on its own without additional context.

  ---

  ### Investigation Steps

  - **Verify the user and logon ID:** Check for processes created by user "root" with Logon ID "0". Focus on Event ID  Forks logged in your UNIX/Linux process creation logs to establish if the executing process is legitimate.

  - **Identify command line arguments:** Examine the CommandLine field for occurrences of the specific path `/etc/opt/microsoft/scx/conf/tmpdir/scx`. Document all arguments used, and determine whether they conform to known, benign script executions.

  - **Inspect file creation timestamps:** Look in `/tmp` for any files starting with "scx*" created recently. Confirm that such files match known operational patterns. Legitimate operations often involve specific timed intervals and processes.

  - **Correlate with configuration changes:** Review if any recent changes were made to the configuration of the Microsoft Operations Manager or related services that could justify the execution of such scripts.

  - **Check process parentage:** Verify the process parent ID to see if it was initiated by a legitimate process or an anomaly. Legitimate SCX scripts would typically be launched by scheduled or expected management services.

  - **Monitor for unusual outbound communication:** Investigate if the processes initiate connections externally. This could indicate an attempt to exfiltrate data or receive further payloads.

  ---

  ### Prioritization

  This alert is considered high severity due to the significant impact a compromised root user can have on an enterprise's infrastructure, including unauthorized changes or breaches. The likelihood of malicious exploitation is elevated given the context of known vulnerabilities associated with the OMI (Open Management Infrastructure). This behavior, particularly when associated with a privileged user, is consistent with widely weaponized attack techniques.

  ---

  ### Blind Spots and Assumptions

  Limitations of this detection include the potential for benign administrative activities by authorized personnel that would trigger the alert. Evasion techniques might include altering script names or using obfuscation to disguise legitimate commands. Required log sources must be configured to effectively capture process creation events and command lines. A companion detection could involve monitoring for unusual user behaviors or lateral movement attempts following the execution of the detected script.

