note: |
  ### Technical Context
  This rule detects the execution of Python scripts that leverage the `socket` and `pty` modules to create a reverse shell. A reverse shell is a type of shell where the target machine connects back to an attacking machine, allowing the attacker to execute commands remotely. This technique can be utilized by attackers to gain unauthorized access to a compromised system, bypassing network defenses and establishing persistent control.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) as attackers leverage scripting to execute malicious code and **Command and Control** (TA0011) as they establish communication with their infrastructure. Techniques that apply include **Command-Line Interface** (T1059.006), which encompasses the execution of commands through a command-line interface, and **Application Layer Protocol** (T1071), where attackers communicate over standard ports using common application protocols.

  Primary data sources for detecting this behavior are process creation events from Linux operating systems, particularly focusing on command-line arguments and the execution paths that indicate the use of Python with socket and pty functionality.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze Linux process creation logs to identify instance(s) of Python executing with command line arguments that include `-c`, `import pty`, `import socket`, and relevant spawn/connect commands.
  - **Correlate Network Traffic:** Check for outbound connections from the potentially compromised system to external IPs during or shortly after the suspect process execution. Look for unusual ports or protocols being used, especially those that could facilitate reverse shell communications.
  - **Inspect Parent Process Trees:** Investigate the parent process of the detected Python execution to determine how and why this process was initiated. Look for any legitimate applications or scripts that could have spawned the reverse shell.
  - **Identify Anomalous User Behavior:** Monitor user activity on the system where the reverse shell was detected. Look for prior legitimate uses of Python that have since deviated, indicating possible compromise or exploitation.

  ### Prioritization
  This alert has a high severity because the execution of a reverse shell poses an immediate risk of data exfiltration and system compromise. Quick detection and response are crucial in preventing further expansion of an attacker's foothold within the enterprise environment.

  ### Blind Spots and Assumptions
  Detecting this behavior relies heavily on accurate logging of process creation events, which may not be enabled consistently across all Linux systems. The detection logic assumes that Python will be used in a recognizable manner, but legitimate uses of socket and pty libraries by internal applications may generate false positives. Ensuring comprehensive logging and monitoring of command-line arguments will be critical for the effectiveness of this alert.

