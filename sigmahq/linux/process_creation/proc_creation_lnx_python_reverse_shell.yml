note: |
  ### Technical Context

  This Sigma rule detects the execution of Python scripts that utilize the `pty` and `socket` modules, which are commonly employed to create reverse shells. The primary objective of an attacker utilizing this technique is to establish remote command execution on a compromised system, providing them with control over the environment. This behavior is categorized under the MITRE ATT&CK framework: T1203 (Exploitation for Client Execution) and T1059.003 (Command and Scripting Interpreter: Python).

  The primary telemetry source for this detection is Linux process creation logs, specifically monitoring executables initiated through Python. If executed maliciously, the security impact could be severe, potentially leading to data exfiltration or further network compromise. Importantly, this detection does NOT confirm malicious intent on its own; legitimate administrative tasks may also use similar commands.

  ### Investigation Steps

  - **Check process details:** Review Linux process creation logs for Event ID 131 (or equivalent) to find the executing process details, focusing on any suspicious parent processes or unusual command line arguments. Legitimate Python scripts typically do not use both `pty` and `socket` concurrently in this manner.

  - **Examine command line arguments:** Analyze the CommandLine of the detected Python invocation for the presence of `-c`, `import`, `pty`, `socket`, and `.connect`. If all these keywords are present, correlate with known indicators of compromise (IOCs) related to reverse shell activities.

  - **Identify network connections:** Utilize network monitoring tools (e.g., `ss`, `netstat`) to identify any outbound connections initiated by the detected Python process. Malicious connections often target uncommon external IP addresses or ports that are not part of normal operational traffic.

  - **Review historical Python execution:** Check system logs for prior executions of Python with similar arguments or patterns. If legitimate scripts are typically documented (e.g., in change management systems), ensure that this instance aligns with expected operational behavior.

  - **Correlate with threat intelligence:** Cross-reference the detected behavior with threat intelligence feeds to identify any associated threat actors known to utilize Python reverse shells. Investigate if the execution correlates with recent alerts or phishing campaigns.

  - **Assess environment risk:** Consider the privileges of the user account executing the Python command. If the process is using a high-privilege account on critical infrastructure, escalate the investigation and involve incident response.

  ### Prioritization

  This alert should be considered high priority due to the potential for significant impact on compromised systems and the likelihood of malicious use, as reverse shell techniques are commonly weaponized by various threat actors in active exploit scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by obfuscation or modification of standard libraries, allowing adversaries to disguise their activities. Reliable detection requires comprehensive logging configurations that include process creation and command line invocation details. Legitimate applications or administrative scripts that interact with `pty` and `socket` could inadvertently trigger this alert, thus thorough context gathering is essential. A companion detection rule monitoring anomalous outbound connections could strengthen overall security posture against such threats.

