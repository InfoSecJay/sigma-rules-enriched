  ### Technical Context

  The Sigma rule detects instances where Python is executed with specific commands that leverage the `pty` and `socket` modules. This behavior is indicative of an adversary attempting to establish a reverse shell connection, allowing remote access to the compromised system. The attacker’s objective is often data exfiltration or lateral movement within the network.

  This detection aligns with the MITRE ATT&CK tactic of Execution (TA0002) and specifically targets the technique Remote Services (T1021). The primary telemetry source is Linux process creation logs, capturing command executions. If malicious, this behavior could lead to significant security impacts, including unauthorized access and control over affected assets. Importantly, this detection does NOT confirm that an attacker has successfully compromised a system; it only highlights suspicious activity warranting further investigation.

  ---

  ### Investigation Steps

  - **Examine the process details:** Review logs for Security Event IDs related to process creation (e.g., `syslog` or `auditd`) that capture commands involving Python. Look specifically for instances using `import pty` and `import socket` in the CommandLine.

  - **Identify command patterns indicating a reverse shell:** Search for logs with CommandLine parameters that include `-c`, `spawn`, and `.connect`. These are strong indicators of potential reverse shell activity, contrasted with typical benign usage of Python.

  - **Check for network connections initiated by the Python process:** Investigate network logs (e.g., `Netstat` or `iptables` logs) to identify any outbound connections made by the Python process (PID) to unusual external IP addresses. Verify if the connection is to known malicious domains or IPs.

  - **Validate legitimate usage scenarios:** Determine whether the user who executed the command is part of your development or sysadmin teams, and check for expected legitimate Python scripts or tasks. Legitimate usage often includes invoking Python for administrative scripts without socket/pty operations.

  - **Look for suspicious payloads:** If a reverse shell is suspected, examine for any file creations or temporary scripts created in `/tmp` or user home directories that could be related to the execution, including checking for file modifications within common web server directories.

  ---

  ### Prioritization

  This alert is categorized as high severity due to the criticality of Linux systems often being targeted in enterprise environments. The likelihood of malicious abuse is substantial because reverse shell tactics are well-documented and commonly weaponized by attackers for remote access.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques such as obfuscating the command line or using non-standard scripts that may not trigger this detection. Reliable detection relies on ensuring that detailed process creation logs are enabled, such as `auditd` or equivalent logging tools. Legitimate activities like administrative tasks or script executions that use Python may also trigger this alert. A companion detection to consider involves monitoring the creation of unusual network connections established by scripts or executables that follow this pattern.

