note: |
  ### Technical Context
  This detection rule identifies when the `esxcli` command is executed with the `vm` flag, specifically to list virtual machines on an ESXi hypervisor. This activity could indicate an adversary's attempt to map and gather information about the virtualized environment, which is a critical step in planning potential attacks, such as targeting specific virtual machines for further exploitation or lateral movement. The threat actor could be conducting reconnaissance or preparing for a more sophisticated attack, such as ransomware deployment or data exfiltration.

  Relevant MITRE ATT&CK tactics include Discovery (TA0007) with techniques such as System Information Discovery (T1007) and Remote System Discovery (T1033). The execution of `esxcli` commands helps an attacker identify the infrastructure's architecture, which is crucial for assessing weaknesses within the environment. Primary data sources for this detection include process creation logs that capture command execution on Linux systems, particularly for ESXi hosts.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for the execution of the `esxcli` command with the `vm` flag. Pay attention to the CommandLine field for potential indicators of suspicious activity.
  - **Check for Anomalous User Activity**: Investigate the user or service account launching the command. Cross-reference with user access logs to identify any unauthorized or unusual access patterns.
  - **Correlate with Other Logs**: Look at network traffic logs and any firewall logs for unusual outbound connections following the command execution, which may indicate further malicious actions or data exfiltration attempts.
  - **Audit VM Permissions and Roles**: Conduct a review of who has access to the ESXi hypervisor and the permission levels assigned to those users. Look for any roles or permissions that appear excessive or unnecessary.

  ### Prioritization
  This alert carries medium severity due to the potential risk of information gathering by an unauthorized actor within the environment. Given the sensitive nature of virtualized infrastructures, an alert stemming from this detection could precede significant threats, including lateral movement or data compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to non-standard command execution methods, such as scripts or aliases that mask the actual command being used. The detection logic assumes that the `esxcli` command will be executed directly and not through another process or service. It is also presupposed that process creation logging is enabled and captures all relevant command execution details, which is essential for this alert to function correctly. Without proper logging settings, detection may be incomplete or ineffective.

