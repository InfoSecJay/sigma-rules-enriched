note: |
  ### Technical Context

  This Sigma rule detects the execution of the `esxcli` command with the `vm` flag, specifically when querying the list of virtual machines (VMs) on an ESXi server. The likely attacker objective is to collect information about the deployed VMs, potentially for planning a further attack, such as targeting VMs for exploitation or ransomware deployment. This behavior aligns with the MITRE ATT&CK techniques T1033 (System Owner/User Discovery), T1007 (System Service Discovery), and T1059.012 (Command and Scripting Interpreter: Unix Shell).

  The primary telemetry source is the process creation logs from the ESXi server (located within the Linux logging subsystem). If the command execution is malicious, it signifies reconnaissance activities that could precede an attack or service disruption. However, it is important to note that the detection of this command execution does not confirm that any subsequent malicious action, such as exploitation or data exfiltration, has occurred on its own.

  ### Investigation Steps

  - **Review process creation logs:** Look for relevant entries from Linux process logs (e.g., `/var/log/audit/audit.log` or by using Syslog). Focus on Event IDs that indicate `esxcli` execution with flags containing `vm process list`.

  - **Cross-reference with user activity:** Identify the user executing the command by checking fields such as `USER` in logs. Verify whether this user typically performs legitimate administrative tasks. Unexpected usage by non-administrative accounts is a red flag.

  - **Check for simultaneous actions:** Investigate other process creations or network activity around the same time to identify if there were any other commands run that suggest malicious intent (e.g., unauthorized modifications to VMs or network exfiltration).

  - **Identify legitimate administrative usage:** Confirm whether the command was executed during regular maintenance windows. Scheduled administrative tasks or logged maintenance sessions could indicate benign activity.

  - **Analyze command arguments:** Examine the complete command line arguments for any additional flags or parameters that could indicate a further attack intention. For instance, a command that lists VMs but also includes flags for exporting or modifying configurations may suggest malicious behavior.

  - **Monitor for subsequent actions:** If this detection occurs, look for follow-on activities such as unusual user logins, unauthorized network connections, or other administrative command executions that are abnormal after the `esxcli` command's execution.

  ### Prioritization

  This alert is of medium severity due to the potential impact on critical ESXi servers. The likelihood of misuse is notable, as attackers commonly seek to gather information on VMs before executing further strategies. While this command can indicate reconnaissance, it is also frequently used in legitimate administrative contexts, necessitating careful analysis.

  ### Blind Spots and Assumptions

  One limitation of this detection is that legitimate maintenance or administrative actions may trigger this alert, leading to false positives. Additionally, the alerts depend heavily on accurate process creation logging settings on the ESXi server, which may not capture all actions if misconfigured. Related detections, such as File Creation events indicating modifications to VM configurations, can reinforce context around suspicious behavior linked to the `esxcli` execution.

