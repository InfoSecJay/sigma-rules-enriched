title: File and Directory Discovery - Linux
id: d3feb4ee-ff1d-4d3d-bd10-5b28a238cc72
status: test
description: |
  Detects usage of system utilities such as "find", "tree", "findmnt", etc, to discover files, directories and network shares.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1083/T1083.md
author: Daniil Yugoslavskiy, oscd.community, CheraghiMilad
date: 2020-10-19
modified: 2024-12-01
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_file_with_asterisk:
    Image|endswith: '/file'
    CommandLine|re: '(.){200,}'     # execution of the 'file */* *>> /tmp/output.txt' will produce huge commandline
  selection_recursive_ls:
    Image|endswith: '/ls'
    CommandLine|contains: '-R'
  selection_find_execution:
    Image|endswith: '/find'
  selection_tree_execution:
    Image|endswith: '/tree'
  selection_findmnt_execution:
    Image|endswith: '/findmnt'
  selection_locate_execution:
    Image|endswith: '/mlocate'
  condition: 1 of selection_*
falsepositives:
- Legitimate activities
level: informational
note: |
  ### Technical Context
  This rule detects the use of various system utilities on Linux systems that can be employed for file and directory discovery. The specific commands monitored include "find," "ls," "tree," "findmnt," and "locate," which attackers might leverage to enumerate file systems, uncover sensitive data, or explore system configurations. Identifying when these commands are used can provide insights into potential reconnaissance efforts by adversaries attempting to assess the environment for future exploitation.

  In the context of a threat scenario, an attacker may gain initial access to a Linux host and then use these utilities to map out files, directories, and network shares for sensitive data retrieval or lateral movement. This behavior aligns with the MITRE ATT&CK framework under the discovery tactic (ID: TA0007), specifically technique T1083, which deals with "File and Directory Discovery." Awareness of this activity is crucial for identifying possible malicious reconnaissance.

  The primary data sources for this detection rule are process creation events, which provide logs detailing the invocation of these commands. Monitoring these events can reveal unusual command-line arguments or the context in which discovery tools are run, aiding in the identification of potential threats.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine the process creation logs for instances of "find," "ls," "tree," "findmnt," or "locate" with uncommon command-line flags, particularly recursive searches (e.g., "ls -R") or output redirection to files (e.g., "find */* *>> output.txt").

  - **Analyze User Context:** Investigate the user account associated with the command execution. Verify whether the user has the necessary permissions for executing these discovery commands and check for unusual activity patterns.

  - **Correlate with Other Logs:** Check for supporting evidence in other log sources, such as authentication logs to identify the timing of potential lateral movement or data access activities, ensuring a thorough understanding of the actions taken by the user.

  - **Identify Potential Data Exposure:** Look for any files or directories interacted with during the discovery process, particularly those containing sensitive or confidential data, to assess whether the investigation necessitates remediation steps.

  ### Prioritization
  The severity of this alert is considered informational but should not be overlooked, as frequent or unusual use of directory discovery commands can indicate underlying reconnaissance activities that may lead to serious security incidents.

  ### Blind Spots and Assumptions
  This detection logic may have gaps in coverage, particularly if legitimate users are performing common administrative tasks that involve these utilities, potentially leading to false positives. Additionally, the detection relies on the availability and accuracy of process creation logs, assuming that such logs are properly configured and retained to capture necessary details. If certain logs are not available or are improperly configured, critical evidence could be missed, allowing malicious behavior to go undetected.

