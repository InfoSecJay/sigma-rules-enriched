logsource:
  category: process_creation
  product: linux
detection:
  selection_file_with_asterisk:
    Image|endswith: '/file'
    CommandLine|re: '(.){200,}'     # execution of the 'file */* *>> /tmp/output.txt' will produce huge commandline
  selection_recursive_ls:
    Image|endswith: '/ls'
    CommandLine|contains: '-R'
  selection_find_execution:
    Image|endswith: '/find'
  selection_tree_execution:
    Image|endswith: '/tree'
  selection_findmnt_execution:
    Image|endswith: '/findmnt'
  selection_locate_execution:
    Image|endswith: '/mlocate'
  condition: 1 of selection_*
falsepositives:
- Legitimate activities
level: informational
note: |
  ### Technical Context

  This rule detects the usage of system utilities such as `find`, `tree`, and `ls -R` on Linux systems, indicating potential file and directory discovery activities. The likely attacker objective is reconnaissance within a compromised environment to identify sensitive files, directories, or network shares for further exploitation. This behavior aligns primarily with the MITRE ATT&CK tactic of "Discovery" (TA0007), specifically technique T1083: "File and Directory Discovery."

  Primary telemetry sources include process creation logs, specifically from Syslog or audit logs, that capture command execution details, such as command lines and images executed. If malicious, the discovery of valuable files or system settings may lead to data exfiltration or further local privilege escalation attacks. Importantly, this detection does NOT confirm that malicious activity is guaranteed; legitimate administrative scripts or troubleshooting commands can trigger the same alerts.

  ### Investigation Steps

  - **Review process logs for command execution:** Filter Syslog entries for `execve` calls related to `/find`, `/tree`, or `/ls` (fields: `comm`, `args`). Identify if parameters like `-R` have been used; legitimate usage typically involves fewer filters or simpler commands.

  - **Analyze command line arguments:** Look for unusual command line patterns in Event IDs 228 and 250 from System Audit logs. Extended arguments (e.g., `find / -name *.conf > output.txt`) like executing commands with redirection often indicate abnormal usage, especially if run by non-administrative users.

  - **Identify high-confidence malicious indicators:** Check for processes executed by non-standard user accounts (e.g., `nobody`, `www-data`) that utilize these utilities, particularly if attempting to search sensitive directories like `/etc/`, `/var/`, or `/home/`.

  - **Verify timing and frequency of scans:** Ensure rapid execution of multiple discovery commands in a short time frame indicates potential scripted or automated attacks. Frequency beyond normal operations may suggest malicious intent.

  - **Assess any existing alerts for context:** Review related logs or alerts for prior suspicious activities in the environment, such as unauthorized access attempts or privilege escalation notifications, which may signal ongoing malicious reconnaissance operations.

  ### Prioritization

  The severity of this alert can be considered low to medium, as the presence of these commands alone does not indicate a definitive compromise but suggests potential reconnaissance. However, the likelihood of malicious abuse rises significantly if the context involves sensitive systems or if paired with other suspicious activities. Discovery behaviors are often precursors to more harmful actions, hence warranting careful examination.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false positives from legitimate system administration tasks, particularly if using automated scripts for maintenance. The required log sources for reliable detection include comprehensive Syslog configuration that captures process creation in detail. Legitimate activities such as system backup scripts or software inventory processes may trigger the alert. A related detection that strengthens coverage is monitoring for file manipulation commands (e.g., `cp`, `mv`) following the discovery activities, indicating potential exploitation attempts.

