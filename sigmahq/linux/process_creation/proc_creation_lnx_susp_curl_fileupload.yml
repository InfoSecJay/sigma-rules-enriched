detection:
  selection_img:
    Image|endswith: '/curl'
  selection_cli:
  - CommandLine|contains:
    - ' --form'           # Also covers the "--form-string"
    - ' --upload-file '
    - ' --data '
    - ' --data-'           # For flags like: "--data-ascii", "--data-binary", "--data-raw", "--data-urlencode"
  - CommandLine|re: '\s-[FTd]\s'       # We use regex to ensure a case sensitive argument detection
  filter_optional_localhost:
    CommandLine|contains:
    - '://localhost'
    - '://127.0.0.1'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Scripts created by developers and admins
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of `curl` commands that upload files to remote endpoints, an action that is often leveraged by attackers to exfiltrate data or command and control (C2) communications. The likely attacker objective is to upload sensitive files or interact with malicious infrastructure without triggering traditional security mechanisms. The relevant MITRE ATT&CK techniques associated with this behavior are Exfiltration Over Command and Control Channel (T1567) and Transfer Data to External System (T1105). Primary telemetry sources include Linux process creation logs, specifically focusing on command-line arguments associated with the execution of `curl`. The security impact if malicious is significant, as successful exfiltration can lead to data compromise. This detection does not confirm that a file upload is inherently malicious; it merely signals suspicious usage of the `curl` tool.

  ---

  ### Investigation Steps

  - **Analyze the command line arguments**: Review the process creation logs for Event ID 100 (Linux) or Sysmon equivalent to check if the `curl` command includes flags like `--upload-file`, `--form`, or similar. Note if the command is attempting to upload sensitive files.

  - **Identify benign use cases**: Check internal documentation or historical usage patterns for curl commands to establish a baseline. Legitimate usage often involves internal endpoints or testing on localhost (e.g., `curl --upload-file file.txt http://localhost`).

  - **Flag high-confidence malicious indicators**: Investigate any log entries where `curl` uploads a file to external IP addresses or domains not on an allowlist. Tools like `whois` can assist in determining whether those domains are known malicious entities.

  - **Correlate with network logs**: Cross-reference this behavior with network traffic logs, specifically looking for outbound connections from the source host listed in the process creation logs to potentially malicious IP addresses or unusual ports (e.g., 80 or 443).

  - **Check for application vulnerabilities**: In cases where Linux hosts are hosting web applications, examine if uploaded files may exploit application vulnerabilities. Look for anomalies in the web server access logs to detect unexpected uploads or application errors post-upload.

  - **Evaluate host criticality**: Consider the role of the affected host; if it's a server with sensitive data or access to critical applications, escalate accordingly.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive systems that could result from unauthorized file uploads. While legitimate users may employ `curl` for maintenance or troubleshooting, the command's capability for file exfiltration makes it a favored tool among adversaries. This behavior is often weaponized in targeted attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate users to employ `curl` for business purposes, resulting in false positives. The effective monitoring of this rule requires comprehensive logging configurations for process creation in Linux environments. Additionally, legitimate automated scripts executed by developers may trigger this alert. A companion detection to strengthen coverage could involve monitoring HTTP requests to external domains for unusual file upload activities.

