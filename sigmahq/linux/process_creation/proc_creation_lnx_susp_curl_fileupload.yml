detection:
  selection_img:
    Image|endswith: '/curl'
  selection_cli:
  - CommandLine|contains:
    - ' --form'           # Also covers the "--form-string"
    - ' --upload-file '
    - ' --data '
    - ' --data-'           # For flags like: "--data-ascii", "--data-binary", "--data-raw", "--data-urlencode"
  - CommandLine|re: '\s-[FTd]\s'       # We use regex to ensure a case sensitive argument detection
  filter_optional_localhost:
    CommandLine|contains:
    - '://localhost'
    - '://127.0.0.1'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Scripts created by developers and admins
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `curl` command-line tool to upload files in a Linux environment, which can signify an attempt to exfiltrate data or establish command-and-control communication. Attackers may use this technique to transfer sensitive files to unauthorized remote servers, circumventing traditional security measures. The relevant MITRE ATT&CK tactics and techniques include **Exfiltration (T1041)** and **Command and Control (T1071)**.

  Primary telemetry sources for this detection include process creation logs, specifically tracking command-line arguments associated with `curl`. If malicious, this activity can lead to significant data breaches or unauthorized access to sensitive information. Importantly, this detection does NOT confirm that the action is malicious on its own; additional investigation is necessary to determine intent and context.

  ### Investigation Steps

  - **Check process creation logs:**
    Review process creation events, looking specifically for **Linux Audit logs (auditd)**, which show Event ID 132 and focus on entries with Image ending in `/curl` and associated CommandLine arguments.

  - **Identify specific command-line flags:**
    Look for command-line usage of `--upload-file`, `--form`, or `--data` in the process creation logs. If these are present in conjunction with remoting IP addresses (other than localhost), it is a high-confidence indicator of a potentially malicious file upload.

  - **Cross-reference with known malicious indicators:**
    Investigate whether the target upload server (e.g., a URL found in the command) is on a threat intelligence feed. A match would indicate a higher likelihood of malicious activity and should be escalated.

  - **Examine for legitimate activity:**
    Validate if the command was executed by a user known for application development or maintenance work, as scripted file operations may be benign. Reference scripts created by known developers.

  - **Monitor for unusual outbound connection attempts:**
    Check network logs to assess if there have been any unusual outbound connections that correspond with the timing of the `curl` command execution. Look for external IP access attempts that do not fit normal operational patterns.

  - **Check file manipulations on the system:**
    Query file creation timestamps or log files from `/var/log/` to identify if any sensitive data appears to have been uploaded or created around the time of the suspicious `curl` activity.

  ### Prioritization

  This alert should be treated with medium-high priority, especially if it involves critical systems. The likelihood of malicious use is significant, as transferring data via `curl` is a common technique leveraged by adversaries. Given that this behavior is less commonly seen in daily operations, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative tasks that utilize `curl` for file uploads to internal system components or scripts employed by developers. It is essential to ensure that logging for process creation and network activity is comprehensively configured for reliability. Actual usage of `curl` for automated processes should be closely monitored as it may occasionally produce similar alerts. A related detection to consider is file download activities (`curl --output`) to provide better coverage of potential exfiltration or lateral movement methods.

