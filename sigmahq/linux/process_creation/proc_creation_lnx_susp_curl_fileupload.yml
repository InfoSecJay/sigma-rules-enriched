detection:
  selection_img:
    Image|endswith: '/curl'
  selection_cli:
  - CommandLine|contains:
    - ' --form'           # Also covers the "--form-string"
    - ' --upload-file '
    - ' --data '
    - ' --data-'           # For flags like: "--data-ascii", "--data-binary", "--data-raw", "--data-urlencode"
  - CommandLine|re: '\s-[FTd]\s'       # We use regex to ensure a case sensitive argument detection
  filter_optional_localhost:
    CommandLine|contains:
    - '://localhost'
    - '://127.0.0.1'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Scripts created by developers and admins
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious use of the `curl` command in Linux systems, specifically when it involves uploading a file through web requests. The behavior often signifies an attempt to exfiltrate data or deliver malicious payloads, as attackers may use `curl` to send sensitive information to an external server or to initiate remote access. By analyzing the command line for specific flags and arguments, this rule aims to pinpoint potentially harmful activity that is leveraging legitimate tools for malicious purposes.

  The likely threat scenario could involve an attacker using `curl` during a post-exploitation phase to upload files such as web shells or data dumps to a remote command-and-control (C2) server. The attacker’s objective may be to establish persistence, maintain access, or exfiltrate sensitive data without detection. As such, users should be vigilant about any files being uploaded to external locations, especially when not aligned with known application or operational activities.

  This rule is aligned with MITRE ATT&CK techniques related to exfiltration and command-and-control, particularly:
  - **Exfiltration Over Command and Control Channel (T1041)**
  - **Data Transfer Size Limits (T1567)**
  - **Application Layer Protocol (T1071)**

  Primary data sources for effective detection include process creation logs, particularly command line arguments associated with `curl`, which will provide insight into potentially suspicious file uploads.

  ### Investigation Steps
  - **Review Command Line Arguments:** Examine the command line created by the `curl` process for suspicious flags such as `--upload-file` or `--data`. Identify any unusual or unauthorized uploads to external domains or IP addresses.
  - **Analyze Process Creation Events:** Check the process creation logs to correlate the `curl` activity with other events around the same timeframe—look for potential misconfigurations, scripts, or automated tasks that may have spawned the command.
  - **Validate Destination URLs:** Investigate the remote URLs used in the `curl` command. Determine if these domains/IPs are known malicious or if they have been used for prior incidents within your organization.
  - **Check for Anomalous User Activity:** Look for signs of unusual login patterns or privilege escalations by users executing the suspicious `curl` command. Correlate with user behavior analytics for insights into attribution.

  ### Prioritization
  Given the potential for file uploads to exfiltrate sensitive data or introduce malicious payloads onto systems, alerts triggered by this detection should be treated with medium to high severity. Rapid response is crucial to containment and mitigation of possible data breaches.

  ### Blind Spots and Assumptions
  One significant blind spot in this detection logic is the potential for false positives stemming from routine administrative or development tasks, where `curl` may be used legitimately. The detection assumes that the triggering command lines are not standard operational practices within the environment. Additionally, proper logging configurations for process creation events are necessary to ensure comprehensive detection; environments lacking these logs may be vulnerable to undetected malicious activity.

