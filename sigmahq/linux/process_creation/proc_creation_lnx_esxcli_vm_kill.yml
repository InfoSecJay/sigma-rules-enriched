level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the `esxcli` command with parameters indicative of attempts to kill or shutdown a specific virtual machine (VM) on ESXi systems. This behavior can signify an unauthorized termination of critical services or resources, potentially leading to operational disruption or data loss. Attackers might leverage this technique in a scenario where they aim to disable services for extortion, enable lateral movement, or disrupt business continuity, especially in environments where virtualization infrastructure is key to operations.

  The relevant MITRE ATT&CK tactics included are **Execution (T1059.012)**, which pertains to command-line interface (CLI) execution of scripting or programming, and **Impact (T1529)**, which concerns the manipulation or disruption of systems, particularly in the context of virtual server environments.

  Primary data sources for this detection include **process creation logs** from the ESXi host, which should capture command execution details, including arguments passed to the `esxcli` command. Proper visibility into these logs is crucial for identifying potentially malicious activity and responding to incidents effectively.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs to identify instances where the `esxcli` command is executed. Focus on logs that include paths and arguments to ensure you capture the intended operations and context.

  - **Analyze Command Parameters**: Investigate the command line parameters used with `esxcli`. Look specifically for occurrences of 'vm process' and 'kill', which are direct indicators of possible malicious actions targeting VMs.

  - **Correlate with User Activity**: Check user activity logs to validate whether the users executing the command have legitimate reasons or permissions to manage VMs. This can help differentiate between authorized administrative action and potential malicious behavior.

  - **Assess VM Log Integrity**: Cross-reference VM logs for any unexpected shutdowns or terminations around the time of the detected command execution. This will help ascertain whether any VMs were indeed impacted.

  ### Prioritization
  This alert should be considered of medium severity due to the potential for service disruption in critical environments. While the command may be executed legitimately by an administrator, unauthorized use can indicate a serious compromise, warranting immediate investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the configuration of logging on ESXi servers, as proper process creation logs must be enabled to capture these events. The detection logic assumes that any invocation of the `esxcli` command with specified flags is anomalous unless confirmed as a legitimate administrative action. Furthermore, false positives may arise due to legitimate administrators executing this command during routine maintenance, necessitating thorough context analysis for each alert.

