note: |
  ### Technical Context

  This Sigma rule detects the execution of the "esxcli" command specifically using the "vm" and "kill" flags to terminate or shut down a virtual machine (VM) hosted on an ESXi hypervisor. The likely attacker objective behind this behavior is to disrupt operations, potentially enabling further exploitation of the virtual environment or facilitating lateral movement within the compromised infrastructure. This activity aligns with the MITRE ATT&CK technique for command and control indicated as **T1059.012 (Command and Scripting Interpreter: Unix Shell)** and **T1529 (Application Layer Protocol)**.

  The primary telemetry source is Linux process creation logs, particularly details captured during the execution of the esxcli command that include the command line used. If malicious, this behavior can result in significant disruptions to business operations, loss of data availability, and potential data exfiltration. Importantly, this detection does not confirm malicious intent on its own, as legitimate administration activities may also trigger the same alert.

  ### Investigation Steps

  - **Review process creation events:** Examine Linux process creation logs (e.g., Syslog, Audit logs) for Event IDs corresponding to `esxcli` execution. Look for entries indicating the command line includes 'vm process kill'.

  - **Check for privileged access:** Validate whether the user executing the command has administrative privileges necessary to kill VMs. Review the user’s role and permissions in the environment, focusing on the fields related to the user ID and access level.

  - **Look for related VM activity:** Investigate the VM's recent activity leading up to the command execution. Check VMware logs or system events for indications of VM performance issues or prior administrative commands (e.g., log events from the last 24 hours).

  - **Identify benign patterns:** Document and log legitimate administration activities, such as scheduled maintenance tasks that might pertain to VM shutdowns, to establish a baseline for expected behavior in your environment.

  - **Correlate with other alerts:** Cross-reference with other alerts that target the ESXi environment during the same timeframe to identify patterns or indicators of broader malicious behavior, such as unexpected access to critical infrastructure or privileged command execution.

  - **Verify log integrity and availability:** Ensure that the necessary logging configurations for process creation (and any other relevant telemetry) are properly set up and actively capturing data to prevent missing critical alerts in the future.

  ### Prioritization

  This alert has medium severity due to its potential to disrupt critical services within the enterprise's virtual environment. The likelihood of malicious abuse is moderate, especially considering recent trends of targeted attacks on hypervisors. This behavior has been weaponized by various threat actors to facilitate attacks on enterprise infrastructure.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of adequate logging for administrative actions or evasion techniques, such as attackers using alternative commands or scripting methods that may bypass standard logging practices. Legitimate maintenance tasks by system administrators can trigger this alert. A related detection to enhance coverage would be monitoring for suspicious patterns in VM lifecycle events, including unusual VM provisioning or unexpected VM migration events.

