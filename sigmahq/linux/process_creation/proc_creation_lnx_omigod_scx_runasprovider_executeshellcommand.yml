title: OMIGOD SCX RunAsProvider ExecuteShellCommand
id: 21541900-27a9-4454-9c4c-3f0a4240344a
status: test
description: |
  Rule to detect the use of the SCX RunAsProvider Invoke_ExecuteShellCommand to execute any UNIX/Linux command using the /bin/sh shell.
  SCXcore, started as the Microsoft Operations Manager UNIX/Linux Agent, is now used in a host of products including
  Microsoft Operations Manager, Microsoft Azure, and Microsoft Operations Management Suite.
references:
- https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
- https://github.com/Azure/Azure-Sentinel/pull/3059
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2022-10-05
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.execution
- attack.t1068
- attack.t1190
- attack.t1203
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    User: root
    LogonId: 0
    CurrentDirectory: '/var/opt/microsoft/scx/tmp'
    CommandLine|contains: '/bin/sh'
  condition: selection
falsepositives:
- Legitimate use of SCX RunAsProvider Invoke_ExecuteShellCommand.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of shell commands on UNIX/Linux systems via the SCX RunAsProvider's `Invoke_ExecuteShellCommand` function, specifically targeting scenarios where commands are run with the `/bin/sh` shell. The likely objective for an attacker could include privilege escalation, command execution for lateral movement, or deployment of malicious payloads in compromised environments using the SCX (Service Control Environment) agent present in various Microsoft cloud solutions. The relevant MITRE ATT&CK tactic is Execution (TA0002), with the technique being Command-Line Interface (T1059.004).

  Primary telemetry sources include Linux process creation logs, specifically looking for log entries that indicate root user activity with logon ID 0 in the `/var/opt/microsoft/scx/tmp` directory and command lines featuring `/bin/sh`. The security impact of this activity could be severe, as it indicates potential unauthorized command execution that could compromise the confidentiality, integrity, or availability of systems and data. However, this detection does NOT confirm malicious activity on its own, as legitimate uses of the SCX RunAsProvider may generate similar logs.

  ### Investigation Steps

  - **Examine process creation logs:** Check for Security Event IDs related to process creation, specifically on Linux systems, focusing on entries where the User is `root` and CommandLine contains `/bin/sh`. Compare against normal operational baselines to identify anomalies.

  - **Review command line arguments:** Analyze the CommandLine field for any suspicious or unexpected commands being executed. Look for benign commands typically run in your environment, such as `systemctl` or `service` commands, versus potentially malicious commands like downloading scripts.

  - **Investigate current directory context:** Validate if the current directory (`/var/opt/microsoft/scx/tmp`) is consistent with legitimate application behavior. It's crucial since this directory is specific to the SCX agent; unusual access patterns may suggest malicious use.

  - **Correlate with user access patterns:** Cross-reference the logon ID 0 (root) activities with user behavior analysis. Identify any other concurrent suspicious activities or mismatched access, which may suggest privilege escalation attempts.

  - **Assess asset criticality:** Determine the impact of the system affected; if it serves critical infrastructure or sensitive data, prioritize immediate containment and remediation efforts.

  - **Identify known benign uses:** Document known legitimate uses of SCX RunAsProvider within the environment to aid in differentiating between authorized and unauthorized operations.

  ### Prioritization

  This alert should be treated as high severity due to the potential for significant security impacts within cloud management contexts. The nature of executing commands as the root user is attractive to attackers for exploitation. While this behavior is not extremely common, the discovery of such activity may indicate a serious breach or compromise in the enterprise.

  ### Blind Spots and Assumptions

  Detection may be limited by variations in command invocation that do not match the specified patterns, allowing potential evasion. Additionally, if logging for the SCX agent is misconfigured or not enabled, detection will fail. Legitimate administrative tasks utilizing the SCX functionality could unintentionally trigger the alert, complicating the investigation. Complementary detections focusing on network activity or unusual user behavior surrounding SCX usage are recommended to strengthen overall security posture against potential exploit attempts.

