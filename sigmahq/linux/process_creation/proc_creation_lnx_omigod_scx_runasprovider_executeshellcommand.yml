title: OMIGOD SCX RunAsProvider ExecuteShellCommand
id: 21541900-27a9-4454-9c4c-3f0a4240344a
status: test
description: |
  Rule to detect the use of the SCX RunAsProvider Invoke_ExecuteShellCommand to execute any UNIX/Linux command using the /bin/sh shell.
  SCXcore, started as the Microsoft Operations Manager UNIX/Linux Agent, is now used in a host of products including
  Microsoft Operations Manager, Microsoft Azure, and Microsoft Operations Management Suite.
references:
- https://www.wiz.io/blog/omigod-critical-vulnerabilities-in-omi-azure
- https://github.com/Azure/Azure-Sentinel/pull/3059
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
date: 2021-10-15
modified: 2022-10-05
tags:
- attack.privilege-escalation
- attack.initial-access
- attack.execution
- attack.t1068
- attack.t1190
- attack.t1203
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    User: root
    LogonId: 0
    CurrentDirectory: '/var/opt/microsoft/scx/tmp'
    CommandLine|contains: '/bin/sh'
  condition: selection
falsepositives:
- Legitimate use of SCX RunAsProvider Invoke_ExecuteShellCommand.
level: high
note: |
  ### Technical Context
  This rule detects the execution of arbitrary UNIX/Linux shell commands through the SCX RunAsProvider, specifically by monitoring for the Invoke_ExecuteShellCommand execution involving the `/bin/sh` shell. This functionality can potentially be leveraged by threat actors exploiting vulnerabilities in the OMI (Open Management Infrastructure) component of Microsoft's cloud services, leading to unauthorized command execution and system compromise.

  In a threat scenario, an attacker may exploit known vulnerabilities within OMI to gain elevated privileges or execute malicious commands that could disrupt services, exfiltrate data, or achieve lateral movement within the network. Their objectives often include privilege escalation, persistence, or direct sabotage of the targeted environment.

  Relevant MITRE ATT&CK tactics include:
  - **Execution (TA0002)**: Execute commands on target systems.
  - **Privilege Escalation (TA0004)**: Gain elevated access to resources.
  - **Initial Access (TA0001)**: Access the system using exploitation of vulnerabilities.

  Primary data sources for this detection rule include:
  - Process creation events from Linux systems which provide insights into command executions by various users, particularly the root user.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze logs for the root user executing commands containing `/bin/sh` in the specified directory. Look for any unusual command invocations that may indicate malicious activity.
  - **Correlate with Network Traffic**: Check for outbound network connections initiated by the root user around the time of the command execution to identify any data exfiltration attempts or communication with external commands or control servers.
  - **Assess System Integrity**: Examine affected systems for unauthorized changes or anomalies in system files that may indicate compromise following the execution of the command. Pay particular attention to system binaries and configuration files.
  - **Check for Vulnerability Exposure**: Ensure that all known vulnerabilities associated with OMI and similar services are patched and review remediation steps taken in response to alerts related to this detection rule.

  ### Prioritization
  This alert is categorized as high severity due to the potential for attackers to execute arbitrary commands with root privileges, which can lead to complete system compromise, data loss, and further exploitation within the network.

  ### Blind Spots and Assumptions
  Some potential gaps in detection coverage include scenarios where the SCX RunAsProvider is used legitimately, which might result in false positives. The detection logic assumes that command execution will primarily originate from the root user in the specified directory context. Required logs for this alert to function include comprehensive process creation logs from Linux systems where the SCX RunAsProvider is operational, as these are essential for capturing the specific command line actions monitored by this rule.

