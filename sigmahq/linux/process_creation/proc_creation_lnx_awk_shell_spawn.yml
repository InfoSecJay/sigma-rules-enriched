title: Suspicious Invocation of Shell via AWK - Linux
id: 8c1a5675-cb85-452f-a298-b01b22a51856
status: test
description: |
  Detects the execution of "awk" or it's sibling commands, to invoke a shell using the system() function.
  This behavior is commonly associated with attempts to execute arbitrary commands or escalate privileges, potentially leading to unauthorized access or further exploitation.
references:
- https://gtfobins.github.io/gtfobins/awk/#shell
- https://gtfobins.github.io/gtfobins/gawk/#shell
- https://gtfobins.github.io/gtfobins/nawk/#shell
- https://gtfobins.github.io/gtfobins/mawk/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/awk'
    - '/gawk'
    - '/mawk'
    - '/nawk'
    CommandLine|contains: 'BEGIN {system'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious use of the AWK command-line tool in a Linux environment, particularly when it invokes a shell process using the system() function. Such behavior can indicate potential malicious intent, such as executing arbitrary commands or privilege escalation attempts, which attackers commonly utilize to gain unauthorized access or further propagate within a network. The attacker may leverage AWK or its variants (gawk, nawk, mawk) to manipulate input files, extract sensitive information, or execute shell commands indirectly, evading traditional security measures.

  This activity aligns with the MITRE ATT&CK framework under the Execution tactic, specifically focusing on the technique of **Command and Scripting Interpreter** (T1059). Attackers often employ scripting languages or interpreters to execute commands within available shells, making it crucial for defenders to monitor these execution patterns and the commands being run in order to detect potential breaches proactively. The main data source for this detection is **process creation events**, which log command-line executions and can reveal the use of AWK in conjunction with the spawning of shell processes.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze recent process creation logs on the affected Linux systems for instances where AWK or its variants were executed, particularly commands containing `BEGIN {system`.
  - **Correlate with Shell Execution**: Identify any command-line arguments that invoke shell interpreters (`/bin/bash`, `/bin/sh`, `/bin/zsh`, etc.) in conjunction with AWK execution to understand the potential escalation or command execution context.
  - **Identify Anomalous User Behavior**: Investigate the user context of the AWK invocations, looking for unusual user accounts or non-standard operational patterns that could indicate malicious activity.
  - **Check for Lateral Movement Indicators**: Review logs for attempts to access sensitive directories or files, and correlate with any known indicators of compromise to assess potential lateral movement or privilege escalation attempts.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact on system integrity and security. AWK's ability to invoke shells can facilitate unauthorized command execution, making it a critical red flag for enterprise environments.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of command execution using AWK or variations thereof, particularly if the invocations are obfuscated or if the execution context differs significantly from the monitored patterns. The detection logic assumes that proper logging is enabled and that the command-line arguments are being captured effectively in process creation events. If certain log sources are disabled or misconfigured, the detection rule could result in missed alerts, leading to potential gaps in monitoring efforts.

