title: Suspicious Invocation of Shell via AWK - Linux
id: 8c1a5675-cb85-452f-a298-b01b22a51856
status: test
description: |
  Detects the execution of "awk" or it's sibling commands, to invoke a shell using the system() function.
  This behavior is commonly associated with attempts to execute arbitrary commands or escalate privileges, potentially leading to unauthorized access or further exploitation.
references:
- https://gtfobins.github.io/gtfobins/awk/#shell
- https://gtfobins.github.io/gtfobins/gawk/#shell
- https://gtfobins.github.io/gtfobins/nawk/#shell
- https://gtfobins.github.io/gtfobins/mawk/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg 
  L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/awk'
    - '/gawk'
    - '/mawk'
    - '/nawk'
    CommandLine|contains: 'BEGIN {system'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `awk`, `gawk`, `mawk`, or `nawk` command with a command line argument indicating invocation of a shell (e.g., using `system()`). The primary objective of an attacker using this method is to execute arbitrary commands or escalate privileges, potentially leading to unauthorized access or further exploitation within the system. This behavior corresponds to the MITRE ATT&CK tactic of Execution (TA0002) and technique T1059 (Command and Scripting Interpreter).

  The main telemetry source for this detection is process creation logs captured from Linux systems, which usually include the command line arguments and the images being executed. If the detected behavior is malicious, it could allow attackers to execute unauthorized commands or scripts, leading to further compromise. Importantly, this detection does NOT confirm that the behavior observed is malicious, as legitimate users may execute similar commands for automation or maintenance tasks.

  ### Investigation Steps

  - **Review process execution details:** Check Linux process creation logs (e.g., `journalctl`, `/var/log/syslog`, or `/var/log/audit/audit.log`) for Event IDs related to `execve` calls. Look specifically for processes involving `/awk`, `/gawk`, `/mawk`, or `/nawk`.

  - **Inspect command line arguments:** Identify the command line used in the execution (fields to review: `CommandLine` in audit logs). Look for additional suspicious keywords beyond `BEGIN {system`, especially those that invoke a shell, such as `/bin/bash`, `/bin/sh`, or similar.

  - **Compare with known benign behavior:** Understand expected usage of `awk` on the system. For example, standard data processing tasks or piped inputs in scripts should not utilize the `system()` function directly.

  - **Identify high-confidence malicious indicators:** Look for any log entries indicating escalated privilege usage following the invocation, such as `sudo` or unauthorized access patterns (e.g., accessing sensitive files or executing known malware).

  - **Evaluate the asset’s role:** Determine if the affected host has a critical function (e.g., web server, database, etc.) that could amplify the impact of successful exploitation. Focus particularly on systems where `awk` usage is uncommon or unexpected.

  ### Prioritization

  This alert has a high severity due to the potential impact on critical systems that could be exploited by an attacker. The behavior of using `awk` to execute shells is a known tactic in exploiting misconfigurations or weaknesses, indicating a significant likelihood of malicious use.

  ### Blind Spots and Assumptions

  Detection is limited by environments where logging is not consistently configured or where command whitelisting is in effect. Legitimate administrative activities, such as scripting tasks or data manipulation, might trigger this alert if system commands are involved. Companion detections such as monitoring for unusual outbound connections or privilege escalation attempts can provide additional context to assess potential malicious activity.

