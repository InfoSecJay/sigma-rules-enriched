title: Suspicious Invocation of Shell via AWK - Linux
id: 8c1a5675-cb85-452f-a298-b01b22a51856
status: test
description: |
  Detects the execution of "awk" or it's sibling commands, to invoke a shell using the system() function.
  This behavior is commonly associated with attempts to execute arbitrary commands or escalate privileges, potentially leading to unauthorized access or further exploitation.
references:
- https://gtfobins.github.io/gtfobins/awk/#shell
- https://gtfobins.github.io/gtfobins/gawk/#shell
- https://gtfobins.github.io/gtfobins/nawk/#shell
- https://gtfobins.github.io/gtfobins/mawk/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/awk'
    - '/gawk'
    - '/mawk'
    - '/nawk'
    CommandLine|contains: 'BEGIN {system'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the invocation of shell commands by utilizing the AWK family of text processing utilities when they employ the `system()` function. Such behavior may be indicative of an attacker's intent to execute arbitrary code or escalate privileges within a Linux environment. This behavior is relevant to the MITRE ATT&CK framework, specifically under the Execution tactic (TA0040) and the scripting technique (T1059).

  The primary telemetry sources include process creation logs for Linux, specifically monitoring command-line arguments associated with AWK commands. If this detection indicates malicious activity, it may lead to unauthorized access or lateral movement within the network. However, this detection does NOT confirm malicious behavior on its own; legitimate use cases exist for AWK and similar tools in scripting and data manipulation.

  ---

  ### Investigation Steps

  - **Review command-line arguments:** Extract logs for process creation with Event IDs related to command execution (e.g., `syslog` or `auditd`). Pay particular attention to instances where `awk` is invoked with 'BEGIN {system' — this should raise suspicion.

  - **Identify high-confidence malicious indicators:** Look specifically for any execution of AWK commands that include shell invocations, such as `system('/bin/bash')`. The presence of this pattern alongside `awk` indicates a high likelihood of malicious intent.

  - **Validate legitimate usage scenarios:** Observe typical AWK command usage in benign operations such as data extraction or report generation. These usually include constructs that don't invoke shell commands, e.g., `awk '{print $1}'` without the `system` function.

  - **Check for escalation and persistence measures:** Investigate any related scripts or commands triggered by the initial AWK invocation that may indicate an escalation attempt. This includes unusual parent processes or unexpected script execution sequences.

  - **Assess affected system role and context:** Determine the role of the system where the alert triggered. A high-privileged system (e.g., database server) exhibiting this behavior requires immediate attention compared to a low-impact system.

  - **Correlate with other detections:** Review system logs for additional alerts that may indicate unauthorized access or lateral movements, such as abnormal SSH logins or connections from unexpected sources.

  ---

  ### Prioritization

  Given that the alert pertains to potential code execution on a Linux system, it carries a high severity rating- especially if the affected system hosts critical infrastructure or sensitive data. The likelihood of exploitation is significant due to the common weaponization of such commands in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded by attackers using legitimate commands in unexpected ways or employing obfuscation techniques. Additionally, environments that do not extensively log process creation may require enhanced logging configurations for capture. Legitimate usage includes system administrators utilizing AWK for scripting tasks, which may inadvertently trigger alerts. A related detection worth monitoring is unusual parent process relationships with AWK executions, as this may highlight suspicious escalations or lateral movements.

