  ### Technical Context

  This Sigma rule detects the execution of the `groupdel` command, a binary used in Linux systems to delete user groups. Attackers may leverage this functionality to eliminate evidence of unauthorized account access or malicious activities, thereby hindering forensic investigations. The corresponding MITRE ATT&CK technique is "Account Deletion" (T1531).

  The primary telemetry source is process creation logs on Linux systems. Specifically, auditd or syslog entries should reflect this command's invocation. If malicious, this action could indicate an attempt to cover tracks, significantly impacting the integrity of audit trails within the environment. Importantly, this detection does not confirm that the command was executed maliciously, as legitimate administrative tasks may also invoke `groupdel`.

  ### Investigation Steps

  - **Check the command invocation context**: Review the system's shell history to confirm whether `groupdel` was executed manually or through a script (e.g., `/var/log/auth.log` for sudo commands). Look for patterns indicating automation or privileged accounts with unusual activity.

  - **Verify group status post-deletion**: Run `getent group` or review the `/etc/group` file to assess which groups have been deleted. If critical groups (e.g., those associated with service accounts) are removed, it may indicate malicious activity.

  - **Assess user account modifications**: Examine `/var/log/auth.log` for other user account changes (e.g., adding or modifying users) that occurred around the same time as the `groupdel` command. Extensive changes by a single account could indicate compromise.

  - **Identify legitimate administrative activities**: Determine if the action aligns with documented admin tasks within your organization. Compare the time of execution with scheduled maintenance windows or user access requirements.

  - **Look for related command sequences**: Investigate logs for preceding commands like `userdel` or `usermod` to identify any correlation with group deletions that might suggest a systematic removal of access or cover-up.

  ### Prioritization

  This alert has medium severity as the affected systems could be mission-critical. The likelihood of malicious abuse is moderate, especially if there are indicators of unauthorized administration. While such behaviors can be legitimate, they are also commonly exploited by adversaries for obfuscation.

  ### Blind Spots and Assumptions

  Detection may be limited if the audit logging is improperly configured or disabled, allowing `groupdel` usage without logs. Potential legitimate activities include routine system maintenance or cleanup actions during user role changes. A related detection to strengthen coverage would be monitoring for execution of user management commands (e.g., `useradd`, `usermod`) as indicators of wider account manipulation.

