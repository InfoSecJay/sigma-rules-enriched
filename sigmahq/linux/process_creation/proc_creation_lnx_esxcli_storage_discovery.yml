title: ESXi Storage Information Discovery Via ESXCLI
id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
status: test
description: Detects execution of the "esxcli" command with the "storage" flag in
  order to retrieve information about the storage status and other related information.
  Seen used by malware such as DarkSide and LockBit.
references:
- https://www.trendmicro.com/en_us/research/21/e/darkside-linux-vms-targeted.html
- https://www.trendmicro.com/en_us/research/22/a/analysis-and-Impact-of-lockbit-ransomwares-first-linux-and-vmware-esxi-variant.html
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_storage.html
author: Nasreddine Bencherchali (Nextron Systems), Cedric Maurugeon
date: 2023-09-04
tags:
- attack.discovery
- attack.execution
- attack.t1033
- attack.t1007
- attack.t1059.012
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'storage'
  selection_cli:
    CommandLine|contains:
    - ' get'
    - ' list'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
# Note: level can be reduced to low in some envs
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances of the "esxcli" command being executed with the "storage" flag, indicating attempts to gather information on storage status and configuration within VMware ESXi environments. This behavior is often associated with malicious actors, particularly ransomware groups like DarkSide and LockBit, who exploit knowledge of storage infrastructure to facilitate their attacks, such as data encryption or exfiltration. The goal of an attacker might be to map the storage configuration to identify potential targets within the environment before launching further exploits.

  This rule ties into several relevant MITRE ATT&CK tactics and techniques:
  - **Discovery (TA0007)**: The command is employed to gather critical information about the environment.
  - **Command and Control (TA0011)**: The execution of esxcli with storage flags could be a precursor to establishing persistence or further exploitations.
  - Specific techniques include `T1033: System Owner/User Discovery`, `T1007: Domain Information Discovery`, and `T1059.012: Command and Scripting Interpreter: Unix Shell`.

  Key data sources for this detection include process creation logs from the ESXi host which detail command executions, along with logs that can provide context regarding user roles or authentication methods used during command execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs from the process creation data source for instances of "esxcli" being executed, specifically with "storage" in the command line to confirm legitimate usage versus potential unauthorized activity.
  - **Cross-reference User Accounts**: Identify the user or process executing the command; legitimate administrative commands may originate from known administrative accounts, while anomalies could indicate potential intruder activity.
  - **Check ESXi Host Activity**: Assess system logs and other relevant ESXi logs for multiple or unusual "esxcli" command executions that could imply automated scripts or malicious intent, rather than standard administration tasks.
  - **Investigate Network Traffic**: Analyze traffic to and from the ESXi host to look for any unexpected connections or data exfiltration activities correlated with the timing of the identified command executions.

  ### Prioritization
  This alert is flagged as medium severity due to the potential high impact of unauthorized access to ESXi systems and the gathering of sensitive storage information. Given the increasing trend of ransomware targeting virtual environments, timely investigation is crucial to mitigate the risk.

  ### Blind Spots and Assumptions
  The detection logic assumes that all instances of "esxcli" usage with storage queries are potentially malicious, which may lead to false positives in environments with legitimate administrative activities. Additionally, the completeness of log coverage is critical; if logging for process creation is disabled or incomplete, malicious activities may go undetected. It is essential to ensure that the ESXi environment is configured to capture and retain comprehensive logs for effective detection capabilities.

