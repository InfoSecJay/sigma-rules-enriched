title: ESXi Storage Information Discovery Via ESXCLI
id: f41dada5-3f56-4232-8503-3fb7f9cf2d60
status: test
description: Detects execution of the "esxcli" command with the "storage" flag 
  in order to retrieve information about the storage status and other related 
  information. Seen used by malware such as DarkSide and LockBit.
references:
- https://www.trendmicro.com/en_us/research/21/e/darkside-linux-vms-targeted.html
- https://www.trendmicro.com/en_us/research/22/a/analysis-and-Impact-of-lockbit-ransomwares-first-linux-and-vmware-esxi-variant.html
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_storage.html
author: Nasreddine Bencherchali (Nextron Systems), Cedric Maurugeon
date: 2023-09-04
tags:
- attack.discovery
- attack.execution
- attack.t1033
- attack.t1007
- attack.t1059.012
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'storage'
  selection_cli:
    CommandLine|contains:
    - ' get'
    - ' list'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
# Note: level can be reduced to low in some envs
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `esxcli` command with the `storage` flag, indicating attempts to retrieve storage-related information on VMware ESXi hosts. The likely objective for an attacker using this behavior is to gather critical system information, which may help in either furthering their attack or evaluating vulnerabilities for exploitation. This activity aligns with the MITRE ATT&CK tactics of "Discovery" (TA0007) and "Command and Control" (TA0011), specifically techniques T1033 (System Owner/User Discovery) and T1007 (System Service Discovery).

  The primary telemetry source is Linux process creation logs, specifically watching for events indicating the execution of `esxcli` commands. If malicious, the security impact could involve information leakage or preparation for additional attack vectors. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also invoke the `esxcli` storage command.

  ### Investigation Steps

  - **Validate the context of the command execution:** Check recent `process_creation` logs for `Event ID XXX` (where XXX is the specific ID for your Linux logs). Confirm if it's executed by known admin users or unfamiliar accounts.

  - **Correlate with other system activities:** Review related log entries around the same timestamp—check for suspicious activity or multiple commands being executed in quick succession from the same user or IP address.

  - **Examine command parameters:** Analyze the CommandLine parameters used in the execution (`CommandLine` field) for indicators like `get` or `list`. Legitimate commands typically include usage patterns consistent with regular administrative tasks, such as checking storage status.

  - **Identify high-confidence malicious indicators:** Look for anomalies such as the execution of `esxcli` in a context where it’s not normally run (e.g., on non-administrative VMs or by non-admin users). Cross-reference these with known threat indicators such as those related to DarkSide or LockBit.

  - **Check for file or data exfiltration artifacts:** Investigate if the execution of the command led to unexpected file creations or external communications that might signify data staging for exfiltration, focusing on network logs and file system activity.

  - **Consider host role and asset criticality:** Review the affected ESXi host’s role in your environment. High-priority assets like production servers warrant immediate escalation upon detection, while testing environments might allow some latitude depending on the context of the command.

  ### Prioritization

  This alert should be classified as medium severity due to the critical nature of the ESXi host and the potential for information gathering activities by an adversary. The behavior exhibited is uncommon in standard operations, raising concerns about malicious reconnaissance, especially when correlated with other suspicious activities.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where logs are not captured fully, such as logging configurations on ESXi being suboptimal. Adversaries might utilize legitimate administrative commands to mask their activities. Additionally, legitimate processes, such as routine storage checks by admin staff, could trigger this alert. A related detection that strengthens coverage is monitoring for unauthorized login attempts or failed command executions that precede or follow the use of `esxcli`.

