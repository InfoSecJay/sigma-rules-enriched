note: |
  ### Technical Context

  This Sigma rule detects the enumeration of local system groups in Linux environments, specifically targeting commands like `groups`, `cat /etc/group`, and other text utilities used to read the contents of group configuration files. The primary attacker objective is to gather information about user permissions, system access control, and sensitive group memberships, which can be exploited for lateral movement or privilege escalation.

  This activity aligns with the MITRE ATT&CK tactic of **Discovery**, specifically the technique **Account Discovery (T1069.001)**. The primary telemetry sources for this detection include process creation logs that capture command execution details. If this behavior is confirmed to be malicious, it could indicate a significant security risk, as attackers may utilize this information to plan further attacks. However, this detection alone does not confirm malicious intent since legitimate administrative activities can trigger it.

  ### Investigation Steps

  - **Review process creation logs**: Check for Linux process creation logs with `Event ID` for process creation (via `auditd` or Syslog) showing commands ending with `/groups`, along with the user who executed them. Legitimate users may frequently execute these commands for query purposes.

  - **Examine command line arguments**: Look for `CommandLine` fields in the logs that contain `/etc/group` and are executed by shell utilities like `cat`, `head`, or `less`. An unusually high number of runs by non-administrative users may indicate potential malicious activity.

  - **Verify user role and asset criticality**: Confirm the roles of users executing these commands. Events from administrative users or systems designated for management (like an admin workstation) are more likely to be benign compared to those from standard user accounts.

  - **Check for suspicious aggregation of commands**: Determine if the command executions are part of a pattern; for instance, multiple enumeration commands run in quick succession might indicate a reconnaissance effort by an attacker.

  - **Analyze historical execution data**: Compare these logs with historical data to identify any sudden spikes in group enumeration activity, especially on critical assets, which could suggest a preliminary phase of a larger attack.

  ### Prioritization

  This alert is classified as low severity as the activity could stem from benign administrative tasks. However, given the potential for malicious use in gathering sensitive access control information, it should not be ignored, especially in critical asset contexts. The likelihood of abuse is moderate due to common usage of these commands by attackers for reconnaissance phases.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as the use of command obfuscation or custom scripts to access group information. It is also important to ensure that complete log collection from relevant sources like `auditd` or Syslog is configured to capture all necessary data. Legitimate activities by system administrators may frequently trigger this alert, requiring careful contextual analysis to ascertain intent. Companion detections, such as monitoring for unexpected user escalation requests or unauthorized access to sensitive accounts, can strengthen overall coverage against broader reconnaissance initiatives.

