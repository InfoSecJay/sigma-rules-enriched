title: Local Groups Discovery Attempt - Linux
id: 676381a6-15ca-4d73-a9c8-6a22e970b90d
status: test
description: |
  Detects attempts to enumerate local groups and group membership via common Linux utilities and sensitive file access.
  Adversaries may read files such as /etc/group and /etc/gshadow, or use tools like getent and groups to identify
  group memberships and privilege assignments on a compromised system.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.001/T1069.001.md
- https://man7.org/linux/man-pages/man1/getent.1.html
author: Ömer Günal, Alejandro Ortuno, oscd.community
date: 2020-10-11
modified: 2026-11-03
tags:
- attack.discovery
- attack.t1069.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_groups:
    Image|endswith: '/groups'
  selection_read_utilities:
    Image|endswith:
    - '/cat'
    - '/ed'
    - '/emacs'
    - '/head'
    - '/less'
    - '/makemap'
    - '/more'
    - '/nano'
    - '/sqlite3'
    - '/tail'
    - '/vi'
    - '/vim'
    CommandLine|contains:
    - 'group'
    - 'gshadow'
  selection_getent:
    Image|endswith: '/getent'
    CommandLine|contains:
    - ' group'
    - ' gshadow'
  selection_ypcat:
    Image|endswith: '/ypcat'
    CommandLine|contains: 'group'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects attempts to enumerate local groups on Linux systems through commands like `getent` and file accesses to `/etc/group` and `/etc/gshadow`. The likely attacker objective is to gain insight into user privileges and group memberships to facilitate further exploitation or lateral movement within the network. This behavior correlates with the MITRE ATT&CK tactic of Discovery and specifically the technique T1069.001.

  Key telemetry sources include process creation logs with relevant information about commands executed and files accessed. If malicious, the impact could be significant, as attackers can exploit the information to escalate privileges or plan further attacks. This detection does NOT confirm actual compromise; it merely indicates that potentially suspicious enumeration behavior has occurred.

  ### Investigation Steps

  - **Verify process creation logs:** Inspect process creation logs, specifically Security Event ID 5010 for SystemD on Linux, and look for processes ending with `/groups`, `/getent`, and `/ypcat`, indicating potential enumeration attempts.

  - **Check command-line arguments:** Analyze the command-line inputs for the detected processes. Legitimate use of tools like `getent` may involve querying user or host information; however, indicators such as `group` or `gshadow` suggest potential misuse.

  - **Review file access history:** Look at the access logs for `/etc/group` and `/etc/gshadow` (e.g., using audit logs or syslog) to identify read attempts. Access to these files might be benign when performed by system administrators but indicates potential malicious intent when associated with unexpected user roles.

  - **Evaluate user roles and activity:** Profile the user who executed the commands. If the commands were run by non-administrative users or during unapproved activities, it raises the likelihood of malicious intent.

  - **Identify known bad actors:** Cross-reference the executing user and their associated privileges with threat intelligence databases to identify if they have been involved in previous incidents.

  ### Prioritization

  This alert may indicate a low-severity incident, as local group enumeration could be part of legitimate administrative activities in certain contexts. However, it could lead to significant security issues if exploited by an attacker gaining foothold within the environment. The risk is elevated on critical systems where privilege escalation poses a higher impact.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities that also utilize these commands, leading to false positives. It's essential to ensure that logging is appropriately configured to capture all relevant process creation and file access events, particularly on administrator workflows. The absence of related detection rules targeting suspicious file accesses or privilege elevation attempts could weaken coverage in these scenarios. Enabling finer-grained logging for critical servers may help bridge these gaps.

