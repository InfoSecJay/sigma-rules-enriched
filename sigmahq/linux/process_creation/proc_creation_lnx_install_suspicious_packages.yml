logsource:
  product: linux
  category: process_creation
detection:
  selection_tool_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains: 'install'
  selection_tool_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'localinstall'
    - 'install'
  selection_tool_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: '-i'
  selection_tool_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--install'
    - '-i'
  selection_keyword:
    CommandLine|contains:
            # Add more suspicious packages
    - 'nmap'
    - ' nc'
    - 'netcat'
    - 'wireshark'
    - 'tshark'
    - 'openconnect'
    - 'proxychains'
    - 'socat'
  condition: 1 of selection_tool_* and selection_keyword
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the installation of suspicious packages on Linux systems using common package management utilities such as apt, yum, rpm, and dpkg. The underlying behavior suggests that an attacker may be trying to set up tools for reconnaissance or to establish a foothold within the environment. This detection is associated with the MITRE ATT&CK tactic of Defense Evasion and the technique T1553.004 (Install Rootkit).

  The primary telemetry sources for this detection are process creation events from Linux systems, specifically monitoring the execution of package management commands. If malicious, the security impact could lead to persistent access or lateral movement, ultimately compromising the integrity of the system. Importantly, this detection does not confirm that an intrusion has occurred; legitimate system administration tasks can trigger similar alerts.

  ---

  ### Investigation Steps

  - **Verify command execution context:**
    Check the user identity associated with the process using Syslog or audit logs for Event ID relevant to command execution. Focus on unusual user accounts or privilege levels for execution (e.g., a non-admin user executing pkg commands).

  - **Review installed packages for legitimacy:**
    Cross-reference the list of installed packages against known legitimate applications. Use command `dpkg -l` or `rpm -qa` to list all packages and specifically search for those flagged in the rule (e.g., nmap, netcat).

  - **Analyze package install command arguments:**
    Inspect the command line arguments used for installation within the logs. Any command line containing multiple options or unusual parameters should be regarded suspiciously.

  - **Check for additional suspicious child processes:**
    Use Sysmon logs to identify any subsequent processes spawned from these installations. Specifically, look for newly created processes that are typically associated with the packages identified in the installations (e.g., `nmap`, `wireshark`).

  - **Monitor for network communications:**
    If any of the suspicious applications installed are network-facing tools, review network logs, such as firewall logs or `tcpdump` captures, to see if there are unusual outbound connections following the installations.

  - **Identify expected administrative activities:**
    Confirm that the installations align with authorized administrative actions based on change management records, or determine if they align with the scheduled maintenance windows for systems.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact of installed tools designed for network reconnaissance and manipulation. The likelihood of malicious abuse is tangible, especially in enterprise environments where such tools are often used to facilitate unauthorized access or data exfiltration. Additionally, these behaviors are routinely weaponized in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may utilize legitimate package installations to conceal malicious tools. Reliable detection requires accurate configuration and logging of process creation events across all Linux systems, as misconfigured logging may result in gaps in visibility. Legitimate administrative activities, such as system updates or authorized software installations, may inadvertently trigger alerts. Companion detections, such as those monitoring network traffic or abnormal user behaviors, provide enhanced context and improve detection fidelity.

