title: Suspicious Package Installed - Linux
id: 700fb7e8-2981-401c-8430-be58e189e741
status: test
description: Detects installation of suspicious packages using system 
  installation utilities
references:
- https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-03
modified: 2026-01-01
tags:
- attack.defense-impairment
- attack.t1553.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains: 'install'
  selection_tool_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'localinstall'
    - 'install'
  selection_tool_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: '-i'
  selection_tool_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--install'
    - '-i'
  selection_keyword:
    CommandLine|contains:
            # Add more suspicious packages
    - 'nmap'
    - ' nc'
    - 'netcat'
    - 'wireshark'
    - 'tshark'
    - 'openconnect'
    - 'proxychains'
    - 'socat'
  condition: 1 of selection_tool_* and selection_keyword
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This rule detects the installation of suspicious packages on Linux systems using common package management tools, such as `apt`, `yum`, `rpm`, and `dpkg`. These packages may be indicative of an attacker's objective to create covert network channels, conduct reconnaissance, or perform other malicious activities. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0022) and the technique is **Install Root Certificate** (T1553.004).

  The primary telemetry sources are process creation logs that capture command line arguments and associated images used during package installation. If this activity is malicious, it may facilitate unauthorized access or data exfiltration. This detection does not confirm that the identified packages are harmful on their own, as legitimate administrative activity may trigger the same alerts.

  ### Investigation Steps

  - **Validate command line parameters:** Review process creation logs (Sysmon Event ID 1) for command lines using `apt`, `yum`, `rpm`, or `dpkg` containing suspicious keywords such as 'nmap', 'wireshark', or 'netcat'. Benign examples include `apt install vim` or `yum install wget`.

  - **Check process origins:** Confirm the legitimacy of processes (PID, Image) associated with the suspicious command to ensure they come from trusted sources (e.g., `/usr/bin/apt` or `/usr/bin/yum`).

  - **Identify high-confidence malicious indicators:** Search for installations of multiple suspicious packages in a short timeframe from a user account that typically does not install software or from non-administrative accounts.

  - **Assess user roles and permissions:** Determine if the user executing the installation has the necessary administrative permissions (e.g., membership in the 'sudo' or 'wheel' groups) and whether their actions are consistent with their job role.

  - **Correlate with system change logs:** Examine `/var/log/yum.log`, `/var/log/dpkg.log`, or `/var/log/apt/history.log` for related package installation history to confirm if the package was intentionally deployed for legitimate administrative purposes.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact on the system if suspicious packages facilitate deceptive activities. The likelihood of malicious abuse is moderate, as tools like `nmap` and `wireshark` are commonly weaponized for spying or data exfiltration.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques, as attackers can use obfuscation or rename installation commands to avoid detection. Required log sources must include detailed process creation logs from Sysmon or native Linux audit logs to ensure reliable detection. Legitimate administrative activities, such as installing approved monitoring tools or network troubleshooting agents, might also trigger this alert. A related detection to strengthen coverage could involve monitoring for unusual outbound network connections from installed software.

