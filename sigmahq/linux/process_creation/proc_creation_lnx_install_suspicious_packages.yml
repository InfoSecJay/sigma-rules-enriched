title: Suspicious Package Installed - Linux
id: 700fb7e8-2981-401c-8430-be58e189e741
status: test
description: Detects installation of suspicious packages using system installation
  utilities
references:
- https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-03
modified: 2026-01-01
tags:
- attack.defense-evasion
- attack.t1553.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains: 'install'
  selection_tool_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'localinstall'
    - 'install'
  selection_tool_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: '-i'
  selection_tool_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--install'
    - '-i'
  selection_keyword:
    CommandLine|contains:
            # Add more suspicious packages
    - 'nmap'
    - ' nc'
    - 'netcat'
    - 'wireshark'
    - 'tshark'
    - 'openconnect'
    - 'proxychains'
    - 'socat'
  condition: 1 of selection_tool_* and selection_keyword
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of potentially malicious packages on Linux systems using common package management tools such as `apt`, `yum`, `rpm`, and `dpkg`. The rule targets scenarios where an attacker may attempt to compromise a system by deploying tools typically used for reconnaissance or network manipulation, such as `nmap`, `netcat`, `wireshark`, and others. The presence of these tools often indicates an intention to perform further exploitation, assess the network, or potentially exfiltrate sensitive information.

  The relevant MITRE ATT&CK techniques associated with this detection include *T1553.004: Install Application* (focused on the installation of specific software) and broader *Defense Evasion* tactics (as installing malicious software can be a means of avoiding detection). The primary data sources for this alert are process creation events generated by the system's logging mechanism, which can capture details about commands executed on the system and the resulting behaviors of package management tools.

  ### Investigation Steps
  - **Review Process Creation Logs**: Investigate logs for any process creation events associated with package management tools (`apt`, `yum`, `rpm`, `dpkg`). Pay special attention to any install commands executed that may correspond with the detected packages.

  - **Analyze Command Line Arguments**: Look at the command line arguments of the process creation events for suspicious keywords (e.g., 'nmap', 'nc', 'wireshark'). Determine if these relate to legitimate administrative needs or represent unauthorized activities.

  - **Correlate with System Activity**: Cross-reference the timing of the installation with other system logs or user activity logs to unearth any potentially related malicious actions, such as unusual network requests or unexpected user logins.

  - **Validate Package Integrity**: Verify the integrity and legitimacy of any packages installed on the system. This could involve checking against known good repositories or utilizing tools to ensure that the hashes of the installed packages match legitimate versions.

  ### Prioritization
  The severity of this alert is considered medium because the presence of suspicious packages can indicate preparatory steps for larger-scale attacks. While not always malicious, these installations can increase the attack surface and provide attackers with additional capabilities if left unchecked.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage may include environments where custom package managers or direct source installations (e.g., compiling from source) are used, as these would not be captured by the standard process creation events linked to common tools. The detection logic assumes that the specified tools and suspicious package names are accurate indicators of malicious intent; however, legitimate system administration may also trigger this alert. Additionally, for this alert to function effectively, logging for process creation events must be enabled and properly configured across Linux systems.

