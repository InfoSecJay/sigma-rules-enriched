title: Suspicious Package Installed - Linux
id: 700fb7e8-2981-401c-8430-be58e189e741
status: test
description: Detects installation of suspicious packages using system 
  installation utilities
references:
- https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-03
modified: 2026-01-01
tags:
- attack.defense-evasion
- attack.t1553.004
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool_apt:
    Image|endswith:
    - '/apt'
    - '/apt-get'
    CommandLine|contains: 'install'
  selection_tool_yum:
    Image|endswith: '/yum'
    CommandLine|contains:
    - 'localinstall'
    - 'install'
  selection_tool_rpm:
    Image|endswith: '/rpm'
    CommandLine|contains: '-i'
  selection_tool_dpkg:
    Image|endswith: '/dpkg'
    CommandLine|contains:
    - '--install'
    - '-i'
  selection_keyword:
    CommandLine|contains:
            # Add more suspicious packages
    - 'nmap'
    - ' nc'
    - 'netcat'
    - 'wireshark'
    - 'tshark'
    - 'openconnect'
    - 'proxychains'
    - 'socat'
  condition: 1 of selection_tool_* and selection_keyword
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the installation of suspicious packages on Linux systems using system installation utilities such as APT, YUM, RPM, or DPKG. The likely attacker objective is to establish a backdoor or facilitate reconnaissance and network manipulation through installed tools like nmap or netcat. This behavior corresponds to the MITRE ATT&CK technique T1553.004 (Install Malicious Software).

  The primary telemetry sources are process creation logs, typically found in Syslog or journalctl outputs, detailing command execution via `apt`, `yum`, `rpm`, or `dpkg`. If malicious, the security impact could include unauthorized access or enhanced capabilities for lateral movement within the network. It’s important to note that this detection does NOT confirm actual compromise on its own; it merely indicates an installation attempt that warrants further investigation.

  ### Investigation Steps

  - **Review process creation logs:** Check Syslog or journalctl for entries related to Event ID 1 where the command line includes installation keywords, such as `apt install nmap`. Confirm if the package was installed within the context of an administrator account or if it was unauthorized.

  - **Verify the installation of suspicious packages:** Look for the presence of malicious tools (e.g., nmap, netcat) using package management logs (e.g., `/var/log/apt/history.log` for APT or `/var/log/yum.log` for YUM) to distinguish between legitimate administrative actions and potential unauthorized installations.

  - **Assess user activity:** Investigate the user associated with the process creation. Legitimate server administrators might install tools like `nmap` for network diagnostics; analyze their last login time and context to set a baseline for expected behavior.

  - **Cross-reference system integrity**: Utilize tools like `rpm -q <package>` to confirm that installed packages are on the whitelist. If installations appear without prior logging of the changes, such as through unauthorized account access, it could indicate malicious activity.

  - **Check for additional indicators of compromise (IOCs):** Investigate network activity related to installed tools such as `nc`, monitoring for outgoing connections or port scanning attempts that may stem from this installation, indicating further malicious intent.

  - **Validate file changes or exfiltration attempts:** Check for unusual file behavior or configuration changes in `/etc/` related to installed tools. Look for log files generated by `nmap` or `wireshark` in user directories, which could indicate upstream reconnaissance activities post-installation.

  ### Prioritization

  This alert has a medium severity based on the criticality of the systems involved and the potential risk of tools being weaponized for further compromise. The likelihood of abuse is heightened given that these tools are often used in penetration tests and malicious scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through legitimate systems administrators installing tools for valid reasons. Reliable detection requires comprehensive logging from package management systems and audit logs for command execution. Legitimate activities may include scheduled maintenance or administrative diagnostic tasks. A related detection could be monitoring for unusual outbound network traffic associated with tools installed, enhancing overall detection capabilities against malicious usage.

