  ---

  ### Technical Context

  This rule detects the creation of a named pipe via the `mkfifo` utility, particularly in the `/tmp/` directory, which can indicate suspicious activity. An attacker may use named pipes for inter-process communication, potentially to facilitate data exfiltration or to establish a covert communication channel with a compromised process. Relevant MITRE ATT&CK tactics include Execution (TA0002) and potentially Resource Development (TA0042) if used for establishing command and control.

  Primary telemetry sources include Linux process creation logs, which capture system calls and command execution. Specifically, system calls related to named pipes and process creation will provide details on the command used, its arguments, and the executing user. If malicious, the presence of a named pipe in a potentially dangerous location could facilitate further exploitation or lateral movement. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may also create named pipes in similar locations.

  ---

  ### Investigation Steps

  - **Identify the invoking user and environment**: Check for user details in the process creation logs (e.g., `getent passwd <username>` or `/var/log/syslog` for entries correlating to Event IDs for `/mkfifo`). Determine if the user is an expected administrator or service account.

  - **Review command history and execution**: Analyze user command history (e.g., `~/.bash_history`) for `mkfifo` execution. Look for unusual command parameters or recent logins from non-standard sources or locations.

  - **Check for other suspicious processes**: Review the running processes using tools like `ps aux` or `top` to identify any unusual processes that may interact with the named pipe. Investigate processes with strange parent-child relationships, especially those created by system users.

  - **Validate file permissions and access**: Examine the permissions of the created named pipe using `ls -l /tmp/` to ensure they aren't overly permissive (e.g., world-writable). A permissions misconfiguration may indicate malicious use.

  - **Monitor for associated network activity**: Cross-reference any created named pipes with outbound network connections using tools like `netstat` or `lsof -i`. Unusual or unauthorized network connections following the named pipe creation should be flagged for further investigation.

  - **Characterize legitimate use cases**: Consider legitimate applications that may create named pipes (e.g., specific application services or installed software). Ensure these applications are operating within expected usage patterns to rule out false positives.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for significant security impacts if a named pipe is used for malicious purposes. The likelihood of abuse is moderate, as attackers commonly use such tactics for lateral movement or data exfiltration. While this behavior can be indicative of malicious activity, it isn't always weaponized in every incident.

  ---

  ### Blind Spots and Assumptions

  This detection may miss legitimate usages of `mkfifo` by benign applications, such as development tools or valid system processes. The reliability of detection depends on having access to sufficient logging and process monitoring configurations—absence of which can lead to gaps in visibility. Companion detections, such as monitoring for anomalous network connections or unexpected child processes, can enhance context and improve detection fidelity.

