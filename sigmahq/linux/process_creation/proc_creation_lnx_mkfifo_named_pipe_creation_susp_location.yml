  ### Technical Context
  This rule detects the potentially suspicious creation of a new named pipe using the "mkfifo" utility, particularly if executed in unconventional directories such as `/tmp/`. Named pipes in Linux are often used for inter-process communication, but their usage in unexpected locations may indicate malicious intent. Attackers could exploit named pipes to facilitate command and control communications or enable lateral movement within a network. This activity may also coincide with recon or execution phases of an attack, making it essential for defenders to be vigilant about such events.

  Relevant MITRE ATT&CK tactics/techniques include:
  - **Execution (T1203)**: The creation and use of named pipes can be part of a broader strategy to execute malicious payloads or commands.
  - **Command and Control (T1071)**: Named pipes might be utilized as a method for establishing a covert channel for command and control communications, especially when other channels are being monitored.

  Primary data sources for this detection include process creation logs from Linux systems, which provide detailed insights on executed commands, command arguments, and user context.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs related to process creation for instances where `mkfifo` was executed, focusing on the command line arguments and user context to identify whether the execution appears legitimate or suspicious.
  - **Analyze File System Changes**: Investigate the file system locations where named pipes were created, especially unusual directories such as `/tmp/`. Check for an unexpected creation time and whether the files exhibit any suspicious permissions.
  - **Correlate with Other Security Events**: Cross-reference the identified events with other security logs, such as EDR alerts or network traffic logs, to assess if they correlate with other malicious activities such as inbound or outbound communications from the affected system.
  - **Conduct User Behavior Analysis**: Assess the behavior and activity patterns of the users executing these commands to determine if they align with legitimate user activities or if there are indicators of compromised accounts.

  ### Prioritization
  The medium-level severity of this alert is warranted due to the potential for named pipes to facilitate malicious activities, such as unauthorized data exfiltration or the establishment of a covert communication channel. Given the commonality of certain commands being misused, incidents must be assessed in context, considering patterns and surrounding behaviors.

  ### Blind Spots and Assumptions
  This detection rule primarily relies on the presence of logs generated by process creation events in Linux environments. A gap exists where logs might not capture all usage scenarios or if `mkfifo` is masked by an alternative method. Additionally, the rule assumes that any invocation of `mkfifo` in `/tmp/` holds potential malicious intent, which may not consistently be valid, thus necessitating further context for accurate incident determination. Also, specific log retention and monitoring policies must be in place to ensure coverage for the detection rule to function effectively.

