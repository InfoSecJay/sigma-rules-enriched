logsource:
  product: linux
  category: process_creation
detection:
  selection_c2_frameworks:
    Image|endswith:
    - '/crackmapexec'
    - '/havoc'
    - '/merlin-agent'
    - '/merlinServer-Linux-x64'
    - '/msfconsole'
    - '/msfvenom'
    - '/ps-empire server'
    - '/ps-empire'
    - '/sliver-client'
    - '/sliver-server'
    - '/Villain.py'
  selection_c2_framework_cobaltstrike:
    Image|contains:
    - '/cobaltstrike'
    - '/teamserver'
  selection_scanners:
    Image|endswith:
    - '/autorecon'
    - '/httpx'
    - '/legion'
    - '/naabu'
    - '/netdiscover'
    - '/nuclei'
    - '/recon-ng'
  selection_scanners_sniper:
    Image|contains: '/sniper'
  selection_web_enum:
    Image|endswith:
    - '/dirb'
    - '/dirbuster'
    - '/eyewitness'
    - '/feroxbuster'
    - '/ffuf'
    - '/gobuster'
    - '/wfuzz'
    - '/whatweb'
  selection_web_vuln:
    Image|endswith:
    - '/joomscan'
    - '/nikto'
    - '/wpscan'
  selection_exploit_tools:
    Image|endswith:
    - '/aircrack-ng'
    - '/bloodhound-python'
    - '/bpfdos'
    - '/ebpfki'
    - '/evil-winrm'
    - '/hashcat'
    - '/hoaxshell.py'
    - '/hydra'
    - '/john'
    - '/ncrack'
            # default binary: https://github.com/Pennyw0rth/NetExec/releases/download/v1.0.0/nxc-ubuntu-latest
    - '/nxc-ubuntu-latest'
    - '/pidhide'
    - '/pspy32'
    - '/pspy32s'
    - '/pspy64'
    - '/pspy64s'
    - '/setoolkit'
    - '/sqlmap'
    - '/writeblocker'
  selection_linpeas:
        # covers: all linux versions listed here: https://github.com/carlospolop/PEASS-ng/releases
    Image|contains: '/linpeas'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects the execution of known Linux hack tools and frameworks that attackers frequently use during operations to exploit, scan, or maintain persistence on target systems. These tools can facilitate activities ranging from network scanning and exploitation to privilege escalation and command-and-control (C2) communication. The presence of these tools on systems could indicate unauthorized access or malicious intent by an attacker, targeting sensitive information or systems.

  Common attacker objectives when using these tools include gathering intelligence on the network, exploiting vulnerabilities, and establishing a foothold for further exploitation. The execution of frameworks like Metasploit and Cobalt Strike might specifically indicate attempts to deploy payloads or maintain access post-exploitation.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002)
    - Command and Scripting Interpreter (T1059)
    - Exploitation for Client Execution (T1203)
  - **Resource Development** (TA0042)
    - Tool Creation (T1587)

  Primary data sources for this detection are:
  - Process creation events, which log the execution of applications and their paths.
  - Audit logs from the Linux operating system or security monitoring tools that track command execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation logs for anomalies, focusing on entries that include the image names specified in the detection logic, particularly those related to known hack tools.
  - **Analyze Network Activity**: Investigate any unusual outbound connections initiated by the identified hack tools to detect potential command-and-control (C2) communication.
  - **Examine User Activity**: Assess the context of the user accounts that executed the detected tools, looking for signs of anomalous behavior or unauthorized access.
  - **Inspect Installed Binaries**: Perform an inventory of binaries and scripts present on the system to identify any unauthorized installations of known hack tools or exploitation frameworks.

  ### Prioritization
  The alert is high severity due to the significant impact of potential exploitation and persistence by unauthorized entities. The tools referenced are commonly associated with advanced threat actors, and their presence often correlates with critical security incidents that may compromise organizational assets.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include the possibility of attackers using obscure or custom variants of these tools that may not match the exact image names outlined in the detection logic. The detection assumes that the monitoring solutions are adequately logging process creation events across all relevant systems and that these logs are accessible for analysis. Additionally, if changes to the environment or toolsets occur without updating the detection rules, there is a risk of missing malicious activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
