note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of known hacktools and offensive security tools commonly used by attackers on Linux systems. The likely objective of the attacker is to perform reconnaissance, exploit vulnerabilities, or maintain access to compromised environments. This behavior is associated with the MITRE ATT&CK tactic of Execution (T1203) and Resource Development (T1587).

  Primary telemetry sources include Linux process creation logs, specifically monitoring for process execution with certain image names. If flagged as malicious, such behaviors may lead to unauthorized access, data breaches, or system compromise. Importantly, detection of these tool executions does not confirm actual exploitation or successful compromise without further context.

  ---

  ### Investigation Steps

  - **Review Process Creation Events:** Check for related Linux syslogs or logs from auditing tools where the following process creation entries (e.g., `/var/log/auth.log`, `/var/log/syslog`, or the `audit` log) indicate execution of detected hacktools. Look for Event IDs associated with process creation.

  - **Identify Suspicious Command Patterns:** Analyze the command line arguments of detected processes to identify flags or inputs indicative of reconnaissance or exploitation activity, such as network scanning or payload execution.

  - **Assess First Seen and Frequency:** Determine if the event is an isolated incident or part of recurring behavior. Frequent execution of tools like `/cobaltstrike` or `/msfconsole` could suggest ongoing malicious activities.

  - **Verify Legitimate Usage Context:** Investigate if the identified hacktools are used in accordance with organizational security policies, such as in authorized penetration testing or by a known administration account.

  - **Cross-reference with Threat Intelligence:** Consult threat intelligence feeds for new strains of tools and their indicators of compromise that may relate to the detected tools being executed, providing context to the severity of the alert.

  - **Check Network Activity Correlation:** Analyze associated outbound network traffic for attempts to connect to known malicious IPs or domains in relation to the identified tools, validating potential command and control (C2) communication.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical systems that may be compromised by unauthorized access or exploitation. The likelihood of malicious abuse is elevated since these tools are commonly leveraged for attacking and maintaining access to systems.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations related to custom or obfuscated tool names, potentially evading detection if tools are renamed or if malicious actors use legitimate systems for execution. Required log sources must be appropriately configured to capture comprehensive process execution data. Legitimate administrative tasks may trigger this alert if using similar tools for authorized purposes. A relevant companion detection to bolster coverage could involve monitoring for unusual user behavior following the execution of flagged tools, such as unauthorized data access attempts.

  ---

