note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of various known hack tools on Linux systems, including C2 frameworks, scanners, and exploit tools. The likely objective of an attacker is to perform reconnaissance, exploit vulnerabilities, or establish persistence within the target environment. This behavior fits within the MITRE ATT&CK framework under the tactics of Execution (T1203) and Resource Development (T1587). The primary telemetry source is process creation logs, specifically from Linux systems capturing the Image field.

  If an attacker successfully executes these tools, there is a high potential for data exfiltration or system compromise. However, this detection does NOT confirm malicious intent on its own; the context of execution and associated activity must also be assessed.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID related to process creation, specifically looking for entries containing known hack tool names from the detection list (e.g., `/crackmapexec`, `/msfconsole`, `/sqlmap`).

  - **Correlate with network activity:** Analyze network logs for outbound connections linked to the detected process executions (e.g., C2 communication attempts). Look for unusual patterns or IP addresses within firewall or IDS logs.

  - **Confirm legitimate scenarios:** Identify if the tool execution was triggered by a known, authorized user or during regular system maintenance activities. Legitimate examples might include automated scripts during system audits.

  - **Examine command-line arguments:** For detected processes, review the command-line arguments used (found in process logs) to identify unusual or suspicious configurations indicating malicious purposes.

  - **Look for escalated privileges:** Investigate any logs for unauthorized privilege escalations (e.g., sudo commands) preceding the hack tool execution, potentially indicating malicious intent to gain elevated access.

  - **Validate file artifacts:** Check for unusual file creations or modifications in directories commonly associated with exploitation tools (e.g., `/tmp/`, `/var/tmp/`) that coincide with the execution timestamp of the detected hack tools.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems and the likelihood of these tools being used for malicious purposes. These tools are commonly weaponized by adversaries to conduct attacks, making it critical to prioritize investigations promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if process creation logging is not appropriately configured or if the tools have been renamed or modified to evade detection. Legitimate development or penetration testing activities may trigger these alerts, requiring additional context. A related detection related to abnormal command execution (e.g., `unusual network connections from processes`) can strengthen coverage against malicious activity.

