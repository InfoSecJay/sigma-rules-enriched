note: |
  ### Technical Context

  This Sigma rule detects the execution of the Bash shell with the interactive flag `-i`, which indicates a potential attempt to establish an interactive shell session. An attacker may leverage this behavior to execute arbitrary commands on a compromised system, gaining control for further exploitation. This activity aligns with the MITRE ATT&CK tactic of Execution, specifically Technique T1203 (Exploitation for Client Execution).

  The primary telemetry sources for this detection are Linux process creation logs that capture command execution details. Security impact is significant if the shell is initiated by an unauthorized user or malicious actor since it allows remote command execution, potentially facilitating lateral movement or data exfiltration. However, this detection alone does not confirm malicious intent, as legitimate processes may also use `bash -i` for valid administrative tasks.

  ### Investigation Steps

  - **Review recent Bash execution logs:** Check for Bash executions with `-i` in the command line using process creation logs (e.g., `/var/log/auth.log` or `/var/log/syslog`). Compare timestamps against user activity to identify anomalies.

  - **Identify user context:** Note which user account executed the command. Legitimate usage typically involves system or administrator accounts during maintenance or scripting tasks, while unusual or unknown user accounts may indicate a security risk.

  - **Correlate with other logs:** Cross-reference with other telemetry such as SSH authentication logs (Event ID 14 in `/var/log/auth.log`) to determine if the user had recently established a session, indicating whether this is part of an authorized workflow.

  - **Check for subsequent commands:** Investigate logs for subsequent command execution following the interactive shell launch. Look for evidence of unusual command activity such as `curl`, `wget`, or changes to system files for signs of malicious behavior.

  - **Review process parentage:** Analyze the parent process of the Bash shell to identify how it was invoked. Common benign parent processes include typical user or administrative tools, while suspiciously invoked background jobs or system daemons may indicate compromise.

  - **Validate file creation events:** Check for unusual file creations or modifications post-execution, using tools like `find` to identify recent changes in home directories or temporary locations (`/tmp`). This can reveal if a malicious script or backdoor was established during the interactive session.

  ### Prioritization

  Given the potential to facilitate unauthorized command execution and lateral movement within the network, alerts for this behavior should be treated as high priority. Attackers often utilize such methods to maintain persistence and exploit systems, making it a notable risk in enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of scripts or commands that do not explicitly invoke the `-i` flag. Additionally, if logging is misconfigured or incomplete, this alert may fail to trigger. Legitimate administrative activities like system administration or troubleshooting can also trigger this alert. A related detection to consider is monitoring for the execution of reverse shells, which often follow this pattern, enhancing detection capabilities for remote command executions.

