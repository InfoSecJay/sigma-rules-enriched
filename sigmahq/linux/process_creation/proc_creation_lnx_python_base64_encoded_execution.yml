note: |
  ### Technical Context

  This Sigma rule detects the execution of Python one-liners that utilize base64 decoding functions on Linux systems. Attackers commonly use this technique to obfuscate malicious payloads, aiming to decode and execute hidden commands or scripts to compromise systems or exfiltrate data. The relevant MITRE ATT&CK tactics and techniques for this behavior include Execution (T1059.006) and Defense Evasion (T1027.010). Primary telemetry sources include process creation logs and command-line arguments associated with executed processes. If malicious, this behavior could indicate a serious compromise, potentially leading to unauthorized access or data leakage. Importantly, this detection does not confirm malicious intent by itself, as it may also capture legitimate data processing activities.

  ### Investigation Steps

  - **Check process creation events:** Review system logs for Linux process creation (e.g., Syslog or systemd logs) around the alert time, focusing on logs that reference `/python` as the executing image (Event ID or Sysmon equivalent: Process Creation).

  - **Analyze command line arguments:** Investigate command-line strings for Python processes containing 'import base64' and '-c' parameters, specifically looking for base64 decoding functions like '.decode', 'b64decode', etc. Correlate with the time of the alert.

  - **Review legitimate Python usage:** Establish a baseline of typical Python usage within the environment. Identify if any non-malicious scripts also use base64 decoding, particularly those related to development or data analysis tasks.

  - **Identify malicious indicators:** Look for suspicious command line patterns indicating malicious encoded payloads, such as unusual strings or commands executed immediately following the base64 decode operation. Focus on commands that could lead to destructive actions or data exfiltration.

  - **Assess asset criticality:** Consider the role of the impacted Linux system. Evaluate how critical it is within the organization (e.g., server vs. employee workstation) as this affects potential impact if exploited.

  ### Prioritization

  This alert is prioritized as high severity due to the significant risk associated with base64 decoding commands, which are often weaponized for obfuscation in malicious scripts. The likelihood of abuse in typically monitored environments is elevated, given that such command executions can indicate a breach or attempted compromise.

  ### Blind Spots and Assumptions

  Detection may miss obfuscated commands or variations that do not use well-known base64 decoding patterns. The rule relies on comprehensive logging of process creation and command line arguments; any missing log sources could reduce detection effectiveness. Legitimate data analysis and development activities using Python may also trigger this alert, which requires contextual investigation. A related detection to strengthen coverage may include monitoring for unusual outbound network connections following base64 decoding commands, which could indicate attempted data exfiltration.

