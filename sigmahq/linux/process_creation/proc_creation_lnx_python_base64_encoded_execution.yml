note: |
  ### Technical Context

  This Sigma rule detects command-line executions invoking Python's base64 decoding functions on Linux systems. The behavior typically aligns with adversarial practices where attackers use one-liners to decode and execute obfuscated payloads, which is a common tactic to avoid detection. This behavior corresponds to the MITRE ATT&CK technique “Command-Line Interface” (T1059.006) and “Obfuscated Files or Information” (T1027.010), focusing on the use of command-line tools to manipulate and execute files covertly.

  The primary telemetry source for this rule is process creation events on Linux systems, specifically monitoring command-line arguments for the Python interpreter invoking decoding functions. Malicious execution could lead to unauthorized access, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate uses of base64 decoding in Python exist, albeit rare in enterprise environments.

  ### Investigation Steps

  - **Examine the command line:**
    Review the process creation logs (e.g., `/var/log/auth.log`, Syslog) for Event ID 1, specifically looking for entries containing 'python' along with base64 decoding calls (e.g., `.decode`, `b64decode`). Focus on the complete command line for context.

  - **Identify high-confidence malicious indicators:**
    Correlate the detected command with known threat actor behaviors, such as using payloads from malicious repositories. An example of a malicious command might include a base64 string intended for execution.

  - **Assess for legitimate usage:**
    Determine if the user or service account executing the command typically utilizes Python for data processing or analysis. Review accounts that trigger this alert to distinguish legitimate security research or development activities from potential threats.

  - **Check parent process context:**
    Investigate the parent process linked to the command execution using `pstree` or equivalent. Malicious Python one-liners often stem from suspicious scripts or processes (e.g., web server scripts associated with known vulnerabilities).

  - **Review system changes:**
    Look for any file modifications or unusual network activity (using tools like `lsof` and `netstat`). Confirmation of obfuscated payload execution should include file creation, executable writes in `/tmp`, or any unusual outbound connections resembling data exfiltration.

  ### Prioritization

  This alert should be considered high severity. The use of base64 decoding in command-line executions typically indicates suspicious activity that may lead to execution of malicious code. Given its stealthy nature and potential for exploitation, it deserves immediate attention, particularly in sensitive environments. Attackers frequently weaponize this technique to evade detection.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for false positives from legitimate activities in isolated development environments. Required log sources must include comprehensive process creation logs to ensure complete visibility. Legitimate data analysis or development activities may trigger this alert when base64 decoding is employed. A related detection, such as monitoring for unusual outbound network connections post base64 decoding commands, can provide further context and assurance against false positives.

