title: Linux Base64 Encoded Shebang In CLI
id: fe2f9663-41cb-47e2-b954-8a228f3b9dff
status: test
description: Detects the presence of a base64 version of the shebang in the 
  commandline, which could indicate a malicious payload about to be decoded
references:
- https://www.trendmicro.com/pl_pl/research/20/i/the-evolution-of-malicious-shell-scripts.html
- https://github.com/carlospolop/PEASS-ng/tree/master/linPEAS
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-15
tags:
- attack.stealth
- attack.t1140
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - "IyEvYmluL2Jhc2"         # Note: #!/bin/bash"
    - "IyEvYmluL2Rhc2"         # Note: #!/bin/dash"
    - "IyEvYmluL3pza"         # Note: #!/bin/zsh"
    - "IyEvYmluL2Zpc2"         # Note: #!/bin/fish
    - "IyEvYmluL3No"         # Note: # !/bin/sh"
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the use of a Base64 encoded shebang in command line arguments, indicative of potential malicious activity such as encoded scripts or payloads being executed. Attackers may leverage this technique to obfuscate malicious scripts to evade detection, with the intent to execute harmful operations on compromised systems. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (ID: T1140).

  Primary telemetry sources include Linux process creation logs, specifically focused on command line arguments. If this behavior is confirmed malicious, it can lead to unauthorized code execution, data leakage, or complete system compromise. However, it is crucial to note that this detection does NOT confirm that the activity is malicious on its own, as legitimate administrative scripts may also use Base64 encoding.

  ### Investigation Steps

  - **Identify the command details**: Review the exact command line from the process creation logs using `auditd` or `syslog`, looking for Event IDs corresponding to `execve` in `/var/log/audit/audit.log` or relevant fields in `/var/log/syslog`. Investigate the full command for additional context.

  - **Check for suspicious parent processes**: Analyze the parent process ID (PID) related to the detected command line. Use `pstree` or `ps -ef` to identify if the parent is a known legitimate process or if it originates from an unusual or previously-unrelated PID. Malicious commands often spawn from suspicious parent processes or unexpected services.

  - **Cross-reference with known legitimate activity**: Review the system's scheduled tasks (crontab) or legitimate scripts in `/usr/local/bin`, `/usr/bin`, or other common directories for authorized Base64 encoded scripts or configuration. Legitimate administration activities may include scripts for automation tasks that are well-documented.

  - **Identify environment context**: Determine the asset criticality and role of the host generating this alert. Check if the host is part of sensitive systems or exposed public-facing services. Logs should be segmented based on the environment to prioritize responsive actions.

  - **Examine network activity**: Capture network traffic related to the execution context, especially outbound connections in response to the command's behavior. Look for connections to suspicious or untrusted domains that could indicate command and control (C2) communication. Utilize tools like `tcpdump` or network log analysis for this.

  - **Correlate with other detections**: Validate findings with companion rules that look for unusual process behaviors or network requests that may coincide with the Base64 shell execution, such as those detecting indicator hashes or unexpected port activity related to the same PID.

  ### Prioritization

  This alert carries medium severity due to its potential impact on systems that could be executing unauthorized code, particularly if involving critical or sensitive environments. The likelihood of malicious abuse is moderate, as Base64 shebangs are commonly associated with evasion tactics, though benign uses do exist. Given the commonality of this obfuscation method in attack chains, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of legitimate Base64 scripts for administrative tasks, which could trigger false positives. Ensure comprehensive logging is enabled for process creation, specifically in `auditd` and `syslog`, to capture relevant execution contexts. Administrators executing obfuscated scripts for legitimate purposes may inadvertently generate alerts, highlighting the need for contextual understanding. A related detection to enhance visibility could focus on unexpected network communications or file changes initiated by processes executing Base64 commands.

