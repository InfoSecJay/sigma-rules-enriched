title: Linux Base64 Encoded Shebang In CLI
id: fe2f9663-41cb-47e2-b954-8a228f3b9dff
status: test
description: Detects the presence of a base64 version of the shebang in the commandline,
  which could indicate a malicious payload about to be decoded
references:
- https://www.trendmicro.com/pl_pl/research/20/i/the-evolution-of-malicious-shell-scripts.html
- https://github.com/carlospolop/PEASS-ng/tree/master/linPEAS
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-15
tags:
- attack.defense-evasion
- attack.t1140
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - "IyEvYmluL2Jhc2"         # Note: #!/bin/bash"
    - "IyEvYmluL2Rhc2"         # Note: #!/bin/dash"
    - "IyEvYmluL3pza"         # Note: #!/bin/zsh"
    - "IyEvYmluL2Zpc2"         # Note: #!/bin/fish
    - "IyEvYmluL3No"         # Note: # !/bin/sh"
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the execution of commands that contain base64-encoded shebangs, such as those starting with `#!/bin/bash`, `#!/bin/dash`, etc. The presence of such encoded shebangs is often indicative of an attacker attempting to execute a malicious payload that has been obfuscated to bypass security controls. The likely objective of the attacker is to execute scripts stealthily without immediately raising alarms through traditional detection methods.

  This behavior aligns with MITRE ATT&CK technique **T1140: Deobfuscate/Decode Files or Information**, which falls under the tactic of **Defense Evasion**. The primary telemetry sources for this detection are Linux process creation logs that reflect command-line activity. If successfully executed, such a malicious script could lead to a range of security impacts, including malware deployment, data exfiltration, or lateral movement within an environment. Importantly, this detection does NOT confirm malicious intent on its own; it merely identifies suspicious command patterns that require further investigation.

  ---

  ### Investigation Steps

  - **Review command history or recent bash commands:** Check `/var/log/auth.log` or `/var/log/secure` for recent command executions. Look for base64-encoded shebangs in the context of user activity. Legitimate administration commands will typically not use such encoding.

  - **Inspect process creation logs for Event IDs:** Analyze process creation logs, focusing on fields like `pid`, `uid`, and `command_line` from `/var/log/syslog` or using `auditd`. Identify processes with command lines containing base64 strings, looking specifically for the patterns outlined in the detection rule.

  - **Correlate with known user behavior:** Identify the user associated with the suspicious command line. Compare against typical user activity for deviations, especially for administrative users. Legitimate activity would usually not exhibit base64 encoding in command-line arguments.

  - **Check for related persistent backdoors:** Review for known malicious processes or scripts running alongside this detection. Look for files created in `/tmp` or user home directories that may relate to this command line. Indicators of malicious intent include unusual file names or unexpected file permissions.

  - **Validate network activity:** Investigate any outbound network connections initiated by the suspicious processes. Inspect logs from tools like `tcpdump`, `iptables`, or relevant SIEM logs for unusual traffic corresponding to the execution time of the suspicious commands.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential impact on system integrity and the likelihood of being utilized in malicious campaigns. The use of obfuscation techniques, such as base64 encoding, indicates an intent to bypass standard security measures, increasing the risk of exploitation if not investigated promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not capture all command-line activity or lack complete logging of process executions. There is also potential for evasion via legitimate administrative scripts that may use base64 encoding for benign purposes. Related detections include monitoring for anomalous file creations or modifications in directories commonly used for script execution, enhancing overall coverage against possible threats.

