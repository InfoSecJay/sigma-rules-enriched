title: Linux Base64 Encoded Shebang In CLI
id: fe2f9663-41cb-47e2-b954-8a228f3b9dff
status: test
description: Detects the presence of a base64 version of the shebang in the commandline,
  which could indicate a malicious payload about to be decoded
references:
- https://www.trendmicro.com/pl_pl/research/20/i/the-evolution-of-malicious-shell-scripts.html
- https://github.com/carlospolop/PEASS-ng/tree/master/linPEAS
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-15
tags:
- attack.defense-evasion
- attack.t1140
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - "IyEvYmluL2Jhc2"         # Note: #!/bin/bash"
    - "IyEvYmluL2Rhc2"         # Note: #!/bin/dash"
    - "IyEvYmluL3pza"         # Note: #!/bin/zsh"
    - "IyEvYmluL2Zpc2"         # Note: #!/bin/fish
    - "IyEvYmluL3No"         # Note: # !/bin/sh"
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of command-line processes on Linux systems that utilize a Base64-encoded shebang (#!). Such a pattern is commonly employed by attackers to obfuscate malicious scripts or payloads, potentially allowing them to bypass security measures or evade detection mechanisms. The usual attacker objective in this scenario is to execute a disguised payload in an unsuspecting environment, which often leads to further compromise, such as data exfiltration or lateral movement within the network.

  The primary MITRE ATT&CK tactics relevant to this rule are **Defense Evasion** (TA0005) as the encoded shebang seeks to conceal the true nature of the executed command, and it specifically aligns with technique **Obfuscated Files or Information** (T1140). This technique focuses on hiding the execution of malicious code, making it harder for security monitoring tools to flag abnormal activity.

  The key data sources that provide high-quality evidence for this detection are **process creation logs** from Linux environments. These logs record command-line inputs used to launch processes, making them critical for identifying the execution of such encoded commands.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and review process creation logs from affected Linux systems to identify any commands involving Base64 shebangs. Focus on timestamp correlating with the alert trigger.
  - **Analyze Command Context**: Investigate the context of the detected command by checking other associated process activity, especially for parent-child relationships that may indicate a script execution or automation.
  - **Check for Suspicious Network Activity**: Monitor outbound connections and parent processes surrounding the execution to uncover any data exfiltration attempts or links to known malicious IPs.
  - **Conduct File Integrity Checks**: Assess any recently modified scripts or binaries within the system to determine if they contain suspicious code or were altered around the time of the alert.

  ### Prioritization
  The severity of this alert is medium, as the use of Base64-encoded shebangs in command-line execution may indicate an attempt to execute obfuscated malicious payloads, which can have significant implications for the security posture of an organization.

  ### Blind Spots and Assumptions
  This detection rule may not identify all instances of malicious activity, particularly if attackers use different methods for obfuscation or if legitimate administrative actions involve similar command line patterns. The logic assumes that process creation logs are properly configured and retained; absence of these logs, or misconfigured logging policies, may hinder the ability to detect such behavior effectively. Additionally, reliance on a specific set of known Base64 encodings means that novel variants or encodings by attackers may go undetected.

