title: Linux Base64 Encoded Shebang In CLI
id: fe2f9663-41cb-47e2-b954-8a228f3b9dff
status: test
description: Detects the presence of a base64 version of the shebang in the 
  commandline, which could indicate a malicious payload about to be decoded
references:
- https://www.trendmicro.com/pl_pl/research/20/i/the-evolution-of-malicious-shell-scripts.html
- https://github.com/carlospolop/PEASS-ng/tree/master/linPEAS
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-15
tags:
- attack.defense-evasion
- attack.t1140
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - "IyEvYmluL2Jhc2"         # Note: #!/bin/bash"
    - "IyEvYmluL2Rhc2"         # Note: #!/bin/dash"
    - "IyEvYmluL3pza"         # Note: #!/bin/zsh"
    - "IyEvYmluL2Zpc2"         # Note: #!/bin/fish
    - "IyEvYmluL3No"         # Note: # !/bin/sh"
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This rule detects the presence of a Base64-encoded shebang line in command-line arguments, indicative of potentially malicious payloads being executed on Linux systems. Attackers may use this technique to obfuscate scripts, making them harder to identify during static analysis. The likely attacker objective is to execute a malicious shell script that is encoded to avoid detection by standard security controls.

  Relevant MITRE ATT&CK tactics include Defense Evasion (ID: T1140) as adversaries attempt to hide their actions and facilitate payload execution without raising immediate suspicion. Primary telemetry source includes Linux process creation logs, specifically examining command-line arguments. The security impact of malicious use could lead to unauthorized system access or data compromise. This detection does NOT confirm malicious behavior on its own; it indicates potentially suspicious activity that requires further investigation.

  ### Investigation Steps

  - **Review Command-Line Arguments:** Check for command-line arguments containing encoded shebangs (e.g., "IyEvYmluL2Jhc2"). Refer to process creation logs (e.g., `/var/log/syslog` or `journalctl`) to match `pid`, `uid`, and `cmdline` fields.

  - **Identify User Context:** Determine the user or process owner (e.g., checking the `uid` from command-line logs). Legitimate administration scripts may include specific system users like 'root' or 'admin', while unexpected users require further scrutiny.

  - **Cross-Reference with Known Good Activities:** Compare the identified processes against logs of legitimate operations within the organization. Command executions initiated by scheduled tasks or known applications should be consistent with usual administrative behavior.

  - **Check for Process Parentage:** Analyze the parent process using the `ppid` in the logs. A process started by common system services (e.g., `init`, `cron`) is less suspicious than one executed directly by a user in an unusual context.

  - **Correlate with Other Indicators:** Look for associated malware indicators, such as unusual outbound network activity (referencing firewall logs or IDS alerts) or file creation/modification timestamps that coincide with the process execution.

  - **Identify Benign Misuse Potential:** Assess scheduled tasks or system automation scripts that may also utilize encoded elements for legitimate purposes. Queries against cron jobs (e.g., `/etc/crontab`) or automation tools should be considered before concluding malicious intent.

  ### Prioritization

  This alert is of medium severity due to the potential impact on Linux systems if exploited, particularly if sensitive data or services are accessible. Although not all occurrences indicate malicious activity, the use of encoded shebangs is a recognized method of evasion and could signal ongoing advanced persistent threats.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not configured to capture all process executions or if inappropriate log retention policies are in place. Legitimate operations, such as administrative script executions or system maintenance, may trigger this alert, necessitating careful analysis of context. A related detection could include monitoring for Base64-encoded payloads in any executed shell commands more broadly, enhancing overall coverage against obfuscation techniques.

