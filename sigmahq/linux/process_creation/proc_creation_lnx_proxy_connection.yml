  ### Technical Context

  This Sigma rule detects the modification of proxy settings on Linux systems through command-line arguments that include 'http_proxy=' or 'https_proxy='. The likely attacker objective is to redirect traffic through a malicious proxy, facilitating command and control (C2) communications or data exfiltration without drawing attention. This behavior fits within the MITRE ATT&CK framework under the tactic "Command and Control" (TA0011) and technique "Application Layer Protocol" (T1090).

  The primary telemetry source includes process creation logs from Linux systems. Specifically, implementing Syslog or system auditing can capture relevant log artifacts. If exploited, the security impact could include unauthorized data access or exfiltration through the compromised proxy. It’s important to note that this detection does NOT confirm malicious intent on its own, as it may also be triggered by legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Examine process creation logs:** Retrieve process creation events (e.g., Syslog or audit logs) for the affected system, specifically looking for entries with 'http_proxy=' or 'https_proxy=' in CommandLine fields to confirm if these commands were executed.

  - **Identify user context:** Determine the user who executed the command by checking the process's associated User ID (UID). Legitimate administration and configuration actions generally originate from a root user or a system administrator’s account.

  - **Review recent administrative changes:** Correlate the proxy settings change with recent administrative activities or maintenance windows to differentiate benign behavior from potential malicious actions.

  - **Enable logging monitoring:** Ensure that logging for changes made to system network configurations (network tools, system settings) is active, which can help identify unauthorized modifications in the future.

  - **Check for outbound traffic patterns:** Analyze firewall logs or network traffic to identify any suspicious outbound connections through the configured proxy that could indicate possible exploitation or communication with external C2 infrastructure.

  - **Look for additional suspicious configurations:** Investigate if there are any other unusual network configurations, such as modified resolvers or additional proxy settings that may indicate a more extensive compromise.

  ---

  ### Prioritization

  This alert is classified with a low severity level; while it indicates a potential misuse of proxy settings, its lower likelihood of being abused in isolation diminishes the immediate threat. However, if it occurs on critical assets or in conjunction with other suspicious activities, it may warrant more immediate attention.

  ---

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers utilize alternative methods to modify proxy settings or employ encrypted channels. Reliable detection requires proper logging configurations for process creation events on Linux hosts. Legitimate activities include approved server configuration changes by system admins, which may appear similar to this alert. Companion detections may include monitoring for unusual outbound connections through monitoring tools like IDS/IPS to strengthen overall coverage against C2 attempts.

