  ### Technical Context

  This Sigma rule detects the setting of proxy configuration on Linux systems through command line arguments that contain 'http_proxy=' or 'https_proxy='. The likely attacker objective is to redirect network traffic to an external adversary-controlled server, facilitating command and control (C2) communication or exfiltration of data. This behavior corresponds to the MITRE ATT&CK tactic of Command and Control (T1070). Telemetry sources include security event logs that capture command line execution, specifically from process creation events in Linux environments. If malicious, this could allow significant data leakage or unauthorized access to systems. However, this detection alone does NOT prove that the activity is inherently malicious, as legitimate administrative activities may also involve modifying proxy settings.

  ### Investigation Steps

  - **Verify command line execution: ** Check relevant process creation logs for CommandLine arguments containing 'http_proxy=' or 'https_proxy=' using Syslog or Auditd logs for Event ID 226.
  - **Identify the user context: ** Validate the user or script context running the command to see if it aligns with expected roles; a regular user making such changes may indicate potential compromise.
  - **Assess process behavior: ** Correlate with additional logs (e.g., `/var/log/auth.log` or audit logs) to check if this proxy configuration was followed by unexpected outgoing connections or further process creation indicative of data exfiltration.
  - **Review legitimate activities: ** Examine normal proxy configuration commands by authorized administrators, such as those executed within DevOps or IT maintenance scripts, ensuring they follow organizational policies.
  - **Look for related artifacts: ** Identify additional signs of compromise, such as unusual outbound connections logged in `netstat` or `ss` commands following the proxy configuration change.

  ### Prioritization

  This alert’s severity should be considered low in most enterprise contexts. However, its impact may escalate significantly if the affected system is critical or holds sensitive information. Given the ease and frequency of proxy usage by attackers for C2 purposes, there's a potential for malicious exploitation, though not all occurrences indicate compromise.

  ### Blind Spots and Assumptions

  This detection is limited by the potential for benign administrative activities to trigger the alert, as system administrators may legitimately alter proxy settings. Reliable detection necessitates comprehensive logging from process creation to network activity on Linux systems. Also, without complementary detections like unusual outbound network traffic or unexpected command executions, the context may remain incomplete. Companion detections may include monitoring for unauthorized outbound connection attempts (MITRE ID T1071).

