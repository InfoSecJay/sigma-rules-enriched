  ### Technical Context

  This Sigma rule detects the modification of proxy settings via command line arguments which include 'http_proxy=' or 'https_proxy='. This behavior is typically observed when an attacker aims to funnel network traffic through a malicious proxy, facilitating command and control (C2) operations. The relevant MITRE ATT&CK tactics and techniques are Defense Evasion (T1562) and Command and Control (T1090). The primary telemetry sources are Linux process creation logs, specifically monitoring command line arguments for proxy variables in execution commands.

  If these actions are malicious, the impact could include unauthorized exfiltration of data or remote control of the system. However, this detection does NOT confirm that the activity is malicious on its own, as it may also be triggered by legitimate administrative activity, such as configuring proxy settings for valid purposes.

  ---

  ### Investigation Steps

  **Review command line arguments for suspicious activity:** Examine Linux process creation logs (e.g., `/var/log/auth.log` or `/var/log/syslog`) for Event ID entries showing `http_proxy=` or `https_proxy=`. Look for unusual processes or user accounts associated with these modifications.

  **Identify high-risk asset roles:** Confirm whether the system originating the alert plays a critical role (e.g., database server, application server). Changes in settings on these systems warrant immediate attention given their sensitivity.

  **Validate user intent:** Check for recent legitimate administrative activities, such as user sessions that may have included valid proxy configuration changes, noted in user history or change management logs.

  **Monitor outgoing connections:** Inspect network logs (e.g., `tcpdump`, or firewall logs) for traffic directed through non-standard proxy addresses, especially if the connections are to suspicious or unexpected external hosts.

  **Check for companion detections:** Look at existing detections for outbound traffic anomalies or C2 traffic signatures that complement this proxy configuration rule, enhancing the likelihood of identifying potential attacks.

  ---

  ### Prioritization

  The alert severity is classified as low, as the immediate impact on system integrity may be minimal if the activity is legitimate. However, the likelihood of malicious use is significant, as modifying proxy settings is a common tactic in adversarial workflows, indicating potential nefarious intent.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers employing legitimate tools or scripts that modify proxy settings without detection. Reliable detection requires comprehensive logging of process creation events and command execution. Legitimate activities that may trigger this alert include network configuration changes by IT personnel or automated processes catering to system updates. A related detection to strengthen coverage is monitoring direct outbound traffic for irregular patterns consistent with proxy usage, which may indicate further command and control attempts.

