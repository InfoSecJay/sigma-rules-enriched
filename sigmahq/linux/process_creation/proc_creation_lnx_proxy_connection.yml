note: |
  ### Technical Context
  This detection rule identifies instances where a proxy server is configured on Linux systems through command line entries that include parameters like `http_proxy=` or `https_proxy=`. Attackers may use proxy configurations to obfuscate their network traffic and evade detection, facilitating malicious activities, including data exfiltration and command-and-control communications. By monitoring these configurations, the organization can identify potential compromise attempts where an attacker is trying to route network traffic through an external proxy to avoid detection by security controls.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Defense Evasion** (TA0005) - Techniques that adversaries use to avoid detection throughout their operations.
  - **Command and Control** (TA0011) - Methods used by threats to communicate with compromised systems. Specific technique T1090: "Connection Proxy" is particularly relevant as it describes the use of proxies to route traffic.

  The primary data sources for this detection rule are:
  - **Process creation logs** from Linux systems that capture command-line arguments and can highlight instances of proxy configuration changes.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze process creation logs on the affected Linux system to find instances of commands that include `http_proxy=` or `https_proxy=`. Focus on the context of these commands and any associated user accounts.

  - **Check Network Traffic:** Examine outgoing network traffic from the compromised system to identify any connections made to unknown or suspicious external IP addresses, which could indicate the use of a proxy for malicious purposes.

  - **Audit User Accounts:** Investigate the user accounts that executed the proxy configuration commands. Look for accounts with elevated privileges that are not typically associated with such changes, as this could suggest unauthorized access.

  - **Validate Legitimate Usage:** Cross-reference the detected proxy configurations with known legitimate applications and administrative activities. If legitimate, document these instances to refine alert thresholds and reduce false positives in the future.

  ### Prioritization
  Given the low severity level assigned to this rule, the likelihood of proxy configuration indicating malicious activity is relatively moderate, primarily based on the context of the change. However, in an enterprise environment where sensitive data and operations are at stake, even low-severity alerts can warrant investigation to ensure no malicious intent is present.

  ### Blind Spots and Assumptions
  This detection rule may not cover all methods of proxy configuration, such as those made through environment variables or configuration files. Additionally, the detection logic assumes that any command line including proxy settings inherently implies malicious activity; therefore, legitimate administrative actions may generate false positives. Required log sources must be enabled, and process creation logging should be configured to capture detailed command line parameters to ensure this rule functions as intended.

