title: Shell Execution via Flock - Linux
id: 4b09c71e-4269-4111-9cdd-107d8867f0cc
status: test
description: |
  Detects the use of the "flock" command to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/flock/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/flock'
    CommandLine|contains: ' -u '
  selection_cli:
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets the execution of shell commands through the use of the `flock` command in Linux environments. The `flock` command is typically used to manage and execute scripts or commands in a controlled manner, but its application for executing shells can indicate attempts at privilege escalation, unauthorized access, or escaping from a restricted environment. Attackers may leverage such tactics to gain additional access or control over systems, particularly in setups where users are expected to operate within a confined shell.

  The relevant MITRE ATT&CK tactics/techniques here include:
  - **Execution** (TA0002): Represents methods used by an adversary to run malicious code, with an emphasis on command-line execution.
  - **Command-Line Interface** (T1059): Specifically highlights the various ways in which command lines can be utilized for executing commands on a system.
  - **Permission Groups Discovery** (T1083): This technique may be indicated if attackers use privilege escalation to access sensitive information.

  The primary data sources for this detection include **process creation events**, where both the `Image` and `CommandLine` parameters pertain to the execution of the `flock` command. These logs provide insights into what processes are being initiated and the arguments associated with them, which is crucial for both identifying malicious activity and understanding the context of command execution.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect and analyze process creation logs to detect instances where the `flock` command is invoked, particularly focusing on the command line for any shell invocation patterns.
  - **Examine Command-Line Arguments**: Investigate the command-line arguments provided to the `flock` command. Look for unusual patterns, such as the presence of shell executables (`/bin/bash`, `/bin/sh`, etc.) that may indicate an attempt to escalate privileges or execute unauthorized commands.
  - **Correlate User Activities**: Determine if the user executing the `flock` command has the appropriate permissions. This includes checking recent access levels, roles, and privilege changes in the system to ensure they align with expected behavior.
  - **Check System and File Integrity**: Use monitoring to ensure that no unauthorized or unexpected changes to system files or configurations have occurred in conjunction with the detected `flock` execution. This can help affirm whether the command was part of legitimate activity or malicious intent.

  ### Prioritization
  The severity of this alert is classified as high due to the potential implications of unauthorized command execution and privilege escalation within an enterprise environment. If successful, such actions could allow attackers to gain elevated access, thereby compromising sensitive data and system integrity.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the use of `flock` is obfuscated or if attackers implement alternate methods to execute similar commands without triggering this rule. Additionally, the detection logic assumes that `flock` is employed in an uncommon context, necessitating careful monitoring of shell experiences and command executions in restricted environments. Logs for process creation must be properly configured and enabled, as the alert relies on comprehensive logging of system processes to function effectively.

