title: Inline Python Execution - Spawn Shell Via OS System Library
id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
status: test
description: |
  Detects execution of inline Python code via the "-c" in order to call the "system" function from the "os" library, and spawn a shell.
references:
- https://gtfobins.github.io/gtfobins/python/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
  - Image|endswith:
    - '/python'
    - '/python2'
    - '/python3'
  - Image|contains:
    - '/python2.'            # python image is always of the form ../python3.10; ../python is just a symlink
    - '/python3.'
  selection_cli:
    CommandLine|contains|all:
    - ' -c '
    - 'os.system('
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of inline Python code designed to spawn a shell through the `os.system` function. The behavior typically indicates an attempt to execute arbitrary shell commands, a common method for lateral movement or post-exploitation actions within a compromised environment. The relevant MITRE ATT&CK techniques are Execution (T1059) and Command and Scripting Interpreter (T1059.001).

  The primary telemetry sources include Linux process creation logs, specifically monitoring execution of the Python interpreter and command-line arguments. If malicious, this activity could lead to command execution and system compromise. However, this detection does NOT confirm malicious intent on its own, as there may be legitimate use cases for inline Python execution.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Look for Security Event ID related to process creation (e.g., `auditd` logs). Validate if Python processes (e.g., `/usr/bin/python`, `/usr/bin/python3`) are spawning with arguments `-c` and containing `os.system(`. Benign cases may include scheduled tasks or administrative scripts.

  - **Analyze command-line arguments:** Focus on the CommandLine field for any signs of shell invocation through `os.system()`, particularly checking for common shell paths like `/bin/bash`, `/bin/sh`, or `/bin/zsh`. Any unexpected parameters may indicate malicious activity.

  - **Cross-reference with user activity:** Investigate user context based on the Python process. Validate if the user is authorized or if the activity correlates with legitimate automation tasks. Unfamiliar users executing such commands should be treated with caution.

  - **Check for related processes:** Use process tree analysis to identify parent processes that spawned the Python execution. Malicious activity might have a parent associated with other suspicious actions or known exploit kits.

  - **Look for environment or config file tampering:** Review logs that capture changes in configuration files or environment variables that might assist in facilitating shell access. Any non-standard adjustments should raise flags.

  ---

  ### Prioritization

  This alert should be prioritized as high due to the potential for significant impact on affected systems, especially when administrative or sensitive accounts are involved. The likelihood of malicious abuse is high, considering that inline Python execution can facilitate command execution. Such behaviors are commonly weaponized in post-exploitation scenarios.

  ---

  ### Blind Spots and Assumptions

  Limitations include the potential for evasion through encoded commands or using alternate scripting methods that do not invoke Python directly. Reliable detection relies on proper Linux logging configurations for process creations and command-line arguments. Legitimate scenarios may involve system maintenance scripts or automated tasks using Python, which could trigger this alert. Companion detections, such as monitoring for unusual outbound connections post-shell execution, can enhance overall security visibility.

