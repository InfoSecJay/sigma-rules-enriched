title: Inline Python Execution - Spawn Shell Via OS System Library
id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
status: test
description: |
  Detects execution of inline Python code via the "-c" in order to call the "system" function from the "os" library, and spawn a shell.
references:
- https://gtfobins.github.io/gtfobins/python/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
  - Image|endswith:
    - '/python'
    - '/python2'
    - '/python3'
  - Image|contains:
    - '/python2.'            # python image is always of the form ../python3.10; ../python is just a symlink
    - '/python3.'
  selection_cli:
    CommandLine|contains|all:
    - ' -c '
    - 'os.system('
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of inline Python execution via the `-c` flag to invoke the `os.system` function, which is often employed by attackers to spawn a shell. This technique enables the execution of arbitrary shell commands within a running Python interpreter, increasing the likelihood of executing malicious scripts or commands to manipulate the system or exfiltrate data. Common scenarios include privilege escalation, lateral movement, or establishing persistence, especially within compromised systems. Attackers aim to leverage system resources while evading traditional security mechanisms.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Execution** (T1203) and **Command and Scripting Interpreter** (T1059), specifically focused on the execution of commands through embedded interpreters in non-standard ways. Identifying such behavior is crucial, as it may signal the early stages of a broader compromise or active exploitation of a vulnerability.

  Primary data sources for this detection include **process creation events**, providing visibility into the command-line arguments and the executables being invoked on Linux systems, which can also help in identifying any unusual process trees or suspicious command execution patterns.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine logs for processes that match the detected patterns, focusing on the command-line arguments used with Python executables, especially those invoking `os.system`.

  - **Correlate with User Context:** Analyze the user context under which the command was executed. Determine whether the account involved has legitimate access to perform such actions or shows anomalous behavior.

  - **Inspect Recent Changes:** Check for any recent changes or installations on the host machine that may have enabled or facilitated this suspicious Python execution. Look for newly added users, applications, or services.

  - **Assess Network Activity:** Investigate any corresponding network connections initiated from the host following the command's execution. Look for signs of data exfiltration or external command-and-control communications.

  ### Prioritization
  This alert is of **high severity** due to the potential for significant compromise on the affected system. The ability to spawn a shell through Python indicates an active attempt to execute commands that may lead to further exploitation, data theft, or lateral movement within the environment.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include sophisticated obfuscation techniques used by attackers to disguise command execution, such as encoding commands to hide malicious intent. It is assumed that standard logging practices are in place for process creation events; otherwise, this detection may not function effectively. Additionally, environments lacking robust Python installations or configurations may result in missed detections.

