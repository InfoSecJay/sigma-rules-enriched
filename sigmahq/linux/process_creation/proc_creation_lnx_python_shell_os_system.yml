title: Inline Python Execution - Spawn Shell Via OS System Library
id: 2d2f44ff-4611-4778-a8fc-323a0e9850cc
status: test
description: |
  Detects execution of inline Python code via the "-c" in order to call the "system" function from the "os" library, and spawn a shell.
references:
- https://gtfobins.github.io/gtfobins/python/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg 
  L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
  - Image|endswith:
    - '/python'
    - '/python2'
    - '/python3'
  - Image|contains:
    - '/python2.'            # python image is always of the form ../python3.10; ../python is just a symlink
    - '/python3.'
  selection_cli:
    CommandLine|contains|all:
    - ' -c '
    - 'os.system('
    CommandLine|contains:
    - '/bin/bash'
    - '/bin/dash'
    - '/bin/fish'
    - '/bin/sh'
    - '/bin/zsh'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of inline Python code that leverages the `os.system()` function to spawn a shell. This behavior is often associated with adversaries attempting to establish command execution capabilities on a compromised Linux system, allowing them to run arbitrary commands. The relevant MITRE ATT&CK tactic is **Execution**, specifically technique **T1059: Command-Line Interface**.

  The primary telemetry sources needed include **process creation logs**, specifically focusing on the command line arguments of Python processes. If malicious, the security impact is significant, as it may indicate an active compromise where an attacker can execute commands with the same permissions as the invoking user. It is important to note that this detection alone does not confirm malicious intent; it could also stem from legitimate automated scripts or system maintenance activity.

  ### Investigation Steps

  - **Review process creation logs**: Check for Linux process creation events (e.g., `syslog`, `auditd`) where the command line includes `-c` and `os.system(`. Focus on Event ID 1300 and related logs for command line inspection.

  - **Identify potential command targets**: Investigate if the execution is targeting `/bin/bash`, `/bin/sh`, or any other shell binaries. Presence of these terms in logs could indicate shell spawning, more likely to be nefarious than benign.

  - **Compare with scheduled tasks**: Look for correlations with legitimate activities, such as automated scripts or cron jobs, that may use Python for maintenance. Reviewing legitimate scripts and documented processes can help determine if the activity is expected.

  - **Validate the user context**: Identify the user account that executed the command. If it’s an administrative or highly privileged user account, note the context, as this can escalate the severity level of the incident.

  - **Check for unusual network activity**: If the spawned shell is succeeded by network connections, collect details from network logs (e.g., `iptables`, `TCP connections`) to determine if there was any data exfiltration or C2 communication.

  - **Monitor for prior alerts**: Cross-reference with other generated alerts in the past 24-48 hours to determine if there is a pattern correlating to unusual Python executions across your environment.

  ### Prioritization

  This alert should be treated as high severity due to the potential for the affected system, typically a server or development environment, to be compromised. The likelihood of malicious use is elevated given that shell spawning is a common tactic in exploitation scenarios. Such behaviors are often weaponized by attackers to gain footholds within a network.

  ### Blind Spots and Assumptions

  Detection limitations include adversarial attempts to obfuscate the command via base64 encoding or using alternative methods for shell execution. It is crucial to have comprehensive logging enabled, such as `auditd`, to reliably capture these events. Legitimate activities may include administrative scripts that perform system maintenance, which could trigger the alert. To strengthen threat coverage, consider integrating detections for suspicious file writes or unexpected user logins post-execution, enhancing context for analysis.

