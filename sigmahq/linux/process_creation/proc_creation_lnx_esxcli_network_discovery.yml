title: ESXi Network Configuration Discovery Via ESXCLI
id: 33e814e0-1f00-4e43-9c34-31fb7ae2b174
status: test
description: Detects execution of the "esxcli" command with the "network" flag in
  order to retrieve information about the network configuration.
references:
- https://www.crowdstrike.com/blog/hypervisor-jackpotting-ecrime-actors-increase-targeting-of-esxi-servers/
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_network.html
author: Cedric Maurugeon
date: 2023-09-04
tags:
- attack.discovery
- attack.execution
- attack.t1033
- attack.t1007
- attack.t1059.012
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'network'
  selection_cli:
    CommandLine|contains:
    - ' get'
    - ' list'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
# Note: level can be reduced to low in some envs
level: medium
note: |
  ### Technical Context
  This detection rule identifies the execution of the `esxcli` command with the `network` flag, which is indicative of an attacker querying network configurations on VMware ESXi servers. Attackers may leverage this command to gather sensitive information about network setups, potentially facilitating further attacks such as lateral movement or privilege escalation. The increased targeting of ESXi servers suggests that threat actors are seeking to exploit misconfigured virtualization environments, which can serve as gateways to critical infrastructure.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - Discovery (TA0007): The attacker is gathering information about the network environment.
  - Command and Scripting Interpreter (TA0101.001): Use of `esxcli` falls under command execution tactics; it can be perceived as automated or scripted activity.
  - System Information Discovery (T1082): Gathering network configurations provides context on how to navigate the infrastructure effectively.

  Primary data sources to investigate include process creation events on Linux systems where ESXi is deployed, as these logs will capture the execution of the `esxcli` command and the associated command-line parameters.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze process creation logs on the ESXi server, specifically for instances where the `esxcli` command has been executed with the `network` flag.
  - **Examine Command-Line Arguments**: Scrutinize the command-line parameters used with `esxcli` to identify unauthorized or unusual queries, particularly those involving networking configurations.
  - **Validate User Context**: Check the user context under which the `esxcli` command was run. Verify whether it originated from an admin account or an unexpected user profile.
  - **Correlate with Unusual Access Patterns**: Look for login patterns or access times that differ from typical operational behavior, particularly around the same time the `esxcli` command was issued.

  ### Prioritization
  The alert should be classified as medium severity due to the potential risk associated with network configuration discovery on ESXi servers, which can lead to escalated attacks if exploited. The likelihood of such events occurring within an enterprise environment justifies prompt investigation, as they may signal an attacker probing for vulnerabilities.

  ### Blind Spots and Assumptions
  One notable gap includes the inability to detect legitimate administrative activities that may also utilize the `esxcli` command, leading to potential false positive alerts. The detection logic assumes that any execution of the command with the `network` flag is malicious, which may not always hold true. For the detection to function correctly, comprehensive process creation logs must be enabled on the ESXi servers, ensuring that all command executions are accurately captured for review.

