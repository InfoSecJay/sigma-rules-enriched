logsource:
  product: linux
  category: process_creation
detection:
  selection_init:
    CommandLine|contains|all:
    - '-ufw-init'
    - 'force-stop'
  selection_ufw:
    CommandLine|contains|all:
    - 'ufw'
    - 'disable'
  condition: 1 of selection_*
falsepositives:
- Network administrators
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to force stop the Uncomplicated Firewall (UFW) service on Linux systems using the `ufw-init` command-line utility. The primary purpose of this action could be to disable firewall protections, allowing an adversary to carry out malicious activities with a reduced risk of detection. The threat scenario often involves attackers attempting to bypass security controls to facilitate further exploitation, lateral movement, or data exfiltration.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the specific technique **Indicator Removal on Host** (T1562.004), which highlights adversaries' efforts to manipulate or disable protective measures on endpoints. Primary data sources for detecting such behaviors are process creation events, where details of command-line executions can provide insights into potential unauthorized actions targeting the firewall configuration.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze recent process creation events for instances where `ufw-init` command-line arguments include `force-stop` or `disable`, indicating potential attempts to disable firewall protections.
  - **Correlate with User Activity:** Cross-reference the identified events with user account activities to determine if the actions were initiated by legitimate network administrators or unauthorized users.
  - **Check for Service Status Changes:** Investigate system logs for related changes in the UFW service status before and after the detected command executions to assess the full impact of the action.
  - **Audit Firewall Configuration:** Ensure that firewall settings conform to security policies, and verify that no unauthorized changes have been made to the firewall rules following the detection.

  ### Prioritization
  The alert is marked with medium severity due to the potential risk posed by disabling the firewall, which can lead to significant exposure for the system. Although this may sometimes be performed by legitimate administrators, the likelihood of unauthorized modifications necessitates prompt investigation.

  ### Blind Spots and Assumptions
  There may be detection gaps if logging is insufficient, such as if process creation logs are not enabled or retained for a sufficient duration. The detection logic assumes that UFW is actively managed on all monitored hosts and that no legitimate administrative actions are being misclassified as threats. For this rule to function effectively, it requires comprehensive logging of process creation events on Linux systems where UFW is deployed.

