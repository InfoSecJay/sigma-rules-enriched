logsource:
  product: linux
  category: process_creation
detection:
  selection_init:
    CommandLine|contains|all:
    - '-ufw-init'
    - 'force-stop'
  selection_ufw:
    CommandLine|contains|all:
    - 'ufw'
    - 'disable'
  condition: 1 of selection_*
falsepositives:
- Network administrators
level: medium
note: |
  ### Technical Context

  This rule detects attempts to forcefully stop the Uncomplicated Firewall (UFW) service on a Linux system using the `ufw-init` command. The likely objective of the attacker is to disable network security controls, allowing for unauthorized access to sensitive systems or data, thereby facilitating a subsequent attack. This behavior aligns with the MITRE ATT&CK techniques of Defense Evasion, specifically T1686 (Disable or Tamper with Security Tools).

  The primary telemetry source is Linux process creation logs, specifically capturing commands executed with associated arguments. If malicious, the security impact could be significant, as this action could leave the system vulnerable to external threats. It is crucial to note that this detection on its own does not confirm malicious intent, as legitimate network administrators may also execute this command.

  ### Investigation Steps

  - **Check recent process activity:** Review Syslog or audit logs (e.g., `/var/log/syslog`) for `ufw-init` commands within the last 24 hours, correlating them with the alert timestamp to identify the user and context.

  - **Identify the user context:** Investigate the user account executing the command by examining the `USER` field in event logs or using `who` command output. Legitimate administrative users may invoke this command for maintenance.

  - **Assess UFW service status:** Verify the UFW status by running `sudo ufw status` on the affected system. A disabled status immediately following the alert may indicate malicious behavior.

  - **Review command history:** Check the `.bash_history` for the executing user's profile to determine if the command `ufw-init force-stop` was part of a larger script or unusual command sequence.

  - **Validate host role:** Confirm the criticality of the affected host. If it is a production server or exposes sensitive data, the urgency of investigation increases significantly.

  - **Correlate with additional incidents:** Look for patterns by examining if other related alerts tied to security tampering or disabling occurred concurrently (e.g., alerts for command execution that disable other security services).

  ### Prioritization

  This alert is of medium severity, especially on critical infrastructure systems. The potential impact of disabling firewall services is high, and while this could be part of routine maintenance by administrators, it is also a technique frequently used by adversaries to set up for an intrusion.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative actions taken during maintenance or troubleshooting. Required log sources include Syslog or auditd logs that must be configured to capture detailed process execution. Additionally, benign situations, such as planned UFW reconfigurations by network admins, may trigger this alert. A related detection for UFW service status changes provides enhanced coverage against potential malicious activity.

