title: UFW Disable Attempt
id: 84c9e83c-599a-458a-a0cb-0ecce44e807a
status: test
description: |
  Detects attempts to disable the Uncomplicated Firewall (UFW) on Linux systems.
  UFW is a popular firewall management tool that provides an easy-to-use interface for configuring firewall rules.
  Disabling UFW can leave a system vulnerable to attacks, as it may allow unauthorized access to network services and resources.
references:
- https://twitter.com/Joseliyo_Jstnk/status/1620131033474822144
- https://manpages.debian.org/unstable/ufw/ufw-framework.8.en.html
- https://www.cyberciti.biz/faq/linux-disable-firewall-command/
author: Joseliyo Sanchez, @Joseliyo_Jstnk
date: 2023-01-18
modified: 2026-05-04
tags:
- attack.defense-impairment
- attack.t1686
logsource:
  product: linux
  category: process_creation
detection:
  selection_ufw_init:
    Image|endswith: '/ufw-init'
    CommandLine|contains:
    - ' force-stop'         # same as stop, except does not check if the firewall is already loaded
    - ' stop'         # unloads the firewall
    - ' flush'         # flushes the built-in chains, deletes all non-built-in chains and resets the policy to ACCEPT
  selection_ufw_disable:
    CommandLine|contains|all:
            # Covers both ufw disable and systemctl disable ufw
            # systemctl disable ufw -- prevents UFW starting at boot, but does not stop the currently running instance of UFW
            # ufw disable -- stops the currently running instance of UFW and prevents it from starting at boot
    - 'ufw '
    - 'disable'
  condition: 1 of selection_*
falsepositives:
- Legitimate actions by system administrators to disable UFW.
level: medium
note: |
  ### Technical Context

  This rule detects attempts to disable the Uncomplicated Firewall (UFW) on Linux systems, specifically through process creation events that invoke commands to stop, flush, or disable UFW. An attacker may aim to disable the firewall to allow unauthorized inbound access to the system, potentially leading to data exfiltration, repository modification, or unauthorized remote access. This behavior corresponds with the MITRE ATT&CK technique for Defense Evasion (T1686), as disabling UFW bypasses security controls.

  The primary telemetry sources include Linux process creation logs, particularly monitoring for specific command lines associated with UFW. If successful, the implications could range from a minor risk to severe vulnerability, depending on the exposed services. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also disable UFW for maintenance or troubleshooting purposes.

  ### Investigation Steps

  - **Check command history:** Review user command history (e.g., `.bash_history`) for the invoking user to see if they issued `ufw disable` or `systemctl disable ufw` commands intentionally. Legitimate admin actions are recorded in user history, likely paired with other maintenance commands.

  - **Review process creation logs:** Analyze Linux process creation logs (e.g., `auditd` logs or `/var/log/syslog`) for Event IDs tied to UFW operations, specifically looking for processes with command lines like `ufw force-stop` or `ufw disable`. Document the user and time for context.

  - **Validate UFW status post-command:** Execute `ufw status` on the system to verify if UFW is indeed disabled or remains active. A disabled firewall indicates potential malicious activity, especially if the command was not executed by a known admin.

  - **Identify related processes:** Investigate any subsequent processes spawned after the disabling command that may indicate further attempts to exploit the system, such as unauthorized script executions, by monitoring logs like `/var/log/auth.log`.

  - **Assess system roles and context:** Determine the role of the affected system (e.g., web server, database server) and its exposure to the internet. Higher criticality systems should be prioritized during the investigation.

  - **Monitor for unusual outbound connections:** Use network monitoring tools to check for new or unusual outbound traffic that could indicate data exfiltration or follow-on attacks following the rule violation.

  ### Prioritization

  The alert has medium severity. Disabling UFW poses a significant risk, particularly on internet-facing systems, as it can expose the system to various attacks. While not all disable attempts are malicious, the likelihood of perceived abuse is high in contexts where UFW is expected to provide baseline security.

  ### Blind Spots and Assumptions

  This detection could be evaded by attackers using privilege escalation to disable UFW without logs or purchasing time before any logging mechanism captures the command. Proper logging configurations, with a focus on privileged commands and user actions, are necessary for reliable detection. Legitimate activities, such as system maintenance by administrators, may also trigger this alert. A related detection that enhances coverage would be monitoring for unauthorized changes to firewall rules or toggling of other security services.

