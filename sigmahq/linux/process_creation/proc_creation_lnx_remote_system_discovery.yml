logsource:
  category: process_creation
  product: linux
detection:
  selection_1:
    Image|endswith: '/arp'
    CommandLine|contains: '-a'
  selection_2:
    Image|endswith: '/ping'
    CommandLine|contains:
    - ' 10.'         # 10.0.0.0/8
    - ' 192.168.'         # 192.168.0.0/16
    - ' 172.16.'         # 172.16.0.0/12
    - ' 172.17.'
    - ' 172.18.'
    - ' 172.19.'
    - ' 172.20.'
    - ' 172.21.'
    - ' 172.22.'
    - ' 172.23.'
    - ' 172.24.'
    - ' 172.25.'
    - ' 172.26.'
    - ' 172.27.'
    - ' 172.28.'
    - ' 172.29.'
    - ' 172.30.'
    - ' 172.31.'
    - ' 127.'         # 127.0.0.0/8
    - ' 169.254.'         # 169.254.0.0/16
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This detection rule identifies Linux-based processes that enumerate remote systems on the network. It specifically looks for commands executed with tools like `arp` and `ping`, which are commonly used for network discovery. The threat scenario revolves around an attacker conducting reconnaissance to identify active hosts within a target environment, potentially preparing for an exploit or lateral movement.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) and specifically the technique **Network Service Scanning** (T1018). Attackers may use these methods to gather information about alive hosts, IP addresses, and open services, laying the groundwork for further exploitation.

  Primary data sources include process creation events on Linux systems as they capture when commands are executed along with their respective arguments, offering valuable insights into potential reconnaissance activities that could signify malicious intent.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze the logs for the execution of commands such as `arp -a` or `ping` alongside the presence of unusual or unauthorized arguments targeting internal IP ranges.
  - **Evaluate Network Traffic Logs:** Check for network traffic patterns corresponding to the identified commands, which could indicate reconnaissance or excessive probing of the IP space.
  - **Correlate with User Context:** Investigate the user accounts executing these commands to determine whether they align with known administrative tasks or if they’re being executed by anomalous users.
  - **Inspect Historical Data:** Look into previous occurrences of similar command executions to establish a baseline and identify whether the detected behavior is part of a trend, potentially indicating coordinated scanning efforts.

  ### Prioritization
  The alert is categorized as low severity due to the likelihood of legitimate administrative activities triggering false positives. However, consistent or unusual patterns of system discovery may warrant further investigation as they could indicate potential reconnaissance by an unauthorized user.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on specific command flags, which may vary based on the environment or updates to tools. The detection logic assumes that process creation events will be logged correctly without modification by legitimate users or scripts. Additionally, configurations on some Linux systems may not log these events by default, affecting detection effectiveness. It is important to ensure proper logging settings are enabled to facilitate accurate detection.

