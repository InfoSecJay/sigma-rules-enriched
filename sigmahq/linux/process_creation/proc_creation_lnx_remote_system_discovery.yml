detection:
  selection_1:
    Image|endswith: '/arp'
    CommandLine|contains: '-a'
  selection_2:
    Image|endswith: '/ping'
    CommandLine|contains:
    - ' 10.'         # 10.0.0.0/8
    - ' 192.168.'         # 192.168.0.0/16
    - ' 172.16.'         # 172.16.0.0/12
    - ' 172.17.'
    - ' 172.18.'
    - ' 172.19.'
    - ' 172.20.'
    - ' 172.21.'
    - ' 172.22.'
    - ' 172.23.'
    - ' 172.24.'
    - ' 172.25.'
    - ' 172.26.'
    - ' 172.27.'
    - ' 172.28.'
    - ' 172.29.'
    - ' 172.30.'
    - ' 172.31.'
    - ' 127.'         # 127.0.0.0/8
    - ' 169.254.'         # 169.254.0.0/16
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects remote system enumeration on Linux systems, specifically through the execution of commands such as `arp -a` and `ping` with specific IP address ranges. The likely attacker objective is to map and discover other devices on the local network, which can be a precursor to lateral movement or targeted attacks. The relevant MITRE ATT&CK tactic is Discovery, with the technique being Network Service Discovery (T1018). Primary telemetry sources are process creation logs, specifically looking for Unix command invocations. If the behavior is malicious, it can lead to unauthorized access or an expanded attack surface. This detection does NOT confirm that any malicious activity has occurred, as legitimate administration activities can trigger these commands.

  ### Investigation Steps

  - **Review process creation logs:** Check for Event ID related to process creation (e.g., Sysmon Event ID 1 on Linux systems) for entries where the `Image` ends with `/arp` or `/ping`, examining command line parameters for flags indicating enumeration activities.

  - **Identify trigger conditions:** Specifically look for command lines that contain `-a` for the `arp` command or IP ranges associated with internal networks (e.g., `10.`, `192.168.`, `172.`) in `ping` command invocations. If these are present, proceed with further investigation.

  - **Assess host context:** Determine the role of the host initiating the discovery commands. If the host is a server with minimal expected network discovery activity (like a web server), this may elevate suspicion compared to a network administrator's workstation.

  - **Correlate with legitimate activities:** Document legitimate network discovery activities by admins, such as authorized scans during maintenance or troubleshooting. Compare timestamps and IP addresses to confirm or rule out malicious intent.

  - **Examine for high-confidence indicators:** Look for patterns indicating malicious behavior, such as repeated discovery commands executed in quick succession from the same host or attempts to enumerate unknown internal IPs that are outside standard administrative practices.

  ### Prioritization

  The alert severity is low as the behavior is typically associated with legitimate administration tasks. However, the likelihood of malicious abuse exists if the command is executed outside of expected contexts, particularly on critical assets. This behavior is also known to be weaponized in reconnaissance phases of an attack.

  ### Blind Spots and Assumptions

  Detection may miss variations in command syntax used for discovery or attempts to obscure command activity through obfuscation techniques. Required log sources include detailed process creation logging, which may need to be enabled on all endpoints for comprehensive coverage. Legitimate administrative scripts or tools that perform network discovery may trigger this alert. Related detections might include unauthorized SSH access attempts or unusual inbound traffic patterns that could complement the analysis of enumeration attempts.

