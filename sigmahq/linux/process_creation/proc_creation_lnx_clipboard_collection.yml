title: Clipboard Collection with Xclip Tool
id: ec127035-a636-4b9a-8555-0efd4e59f316
status: test
description: |
  Detects attempts to collect data stored in the clipboard from users with the usage of xclip tool. Xclip has to be installed.
  Highly recommended using rule on servers, due to high usage of clipboard utilities on user workstations.
references:
- https://www.packetlabs.net/posts/clipboard-data-security/
author: Pawel Mazur, Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research),
  MSTIC
date: 2021-10-15
modified: 2022-09-15
tags:
- attack.collection
- attack.t1115
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|contains: 'xclip'
    CommandLine|contains|all:
    - '-sel'
    - 'clip'
    - '-o'
  condition: selection
falsepositives:
- Legitimate usage of xclip tools.
level: low
note: |
  ### Technical Context
  This detection rule is designed to identify unauthorized use of the `xclip` tool, often employed to capture data from a user's clipboard on Linux systems. The clipboard can contain sensitive information such as passwords, authentication tokens, and intellectual property, making it a valuable target for attackers. When an adversary uses `xclip`, it typically indicates they may be attempting to extract this sensitive information for further exploitation or lateral movement within an organization.

  The threat scenario usually involves an attacker gaining access to a system and utilizing the `xclip` tool to siphon off confidential data, either as part of reconnaissance efforts or to facilitate a more significant attack, such as data exfiltration or privilege escalation. This behavior aligns with the MITRE ATT&CK technique **Collection (T1115)**, specifically highlighting the methodical attempts to gather sensitive information from system resources.

  The primary data sources for this detection are process creation events generated by the Linux operating system, which record command execution, including the use of tools like `xclip`. This information can be critical in revealing unauthorized actions on a potential target system.

  ### Investigation Steps
  - **Review Process Creation Events:** Examine the process creation logs for instances where `xclip` is initiated. Focus on the associated users and the timing of the events to identify any suspicious patterns or unexpected usage.

  - **Assess Command Line Arguments:** Investigate the command line arguments used with `xclip`, particularly those that include `-sel`, `clip`, and `-o`. Determine if these parameters correlate with legitimate user activities or indicate potential misuse.

  - **Cross-reference User Activities:** Identify the users who executed the `xclip` command and cross-reference their activities around the same time. Look for any unusual login patterns, such as logins from foreign IP addresses or connections at atypical hours.

  - **Analyze Clipboard Data:** If feasible, evaluate the contents of the clipboard during the identified time frame or if logs prevent access to sensitive information, ensure that data handling policies are enforced to mitigate damage from potential clipboard data leakages.

  ### Prioritization
  While this rule is flagged as low severity, it is still important to prioritize investigation due to the potential for unauthorized data exposure. Clipboard collection can serve as a preliminary step in larger attacks, making early detection critical in a proactive security posture.

  ### Blind Spots and Assumptions
  One blind spot in this detection logic includes the possibility of legitimate `xclip` tool use by authorized users, which can lead to false positives. Additionally, the detection assumes that all instances of `xclip` on monitored systems indicate malicious behavior, not accounting for benign activities. Finally, successful detection requires that process creation logs are enabled and properly configured on all Linux systems where the `xclip` tool may be present.

