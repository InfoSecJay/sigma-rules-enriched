title: Clipboard Collection with Xclip Tool
id: ec127035-a636-4b9a-8555-0efd4e59f316
status: test
description: |
  Detects attempts to collect data stored in the clipboard from users with the usage of xclip tool. Xclip has to be installed.
  Highly recommended using rule on servers, due to high usage of clipboard utilities on user workstations.
references:
- https://www.packetlabs.net/posts/clipboard-data-security/
author: Pawel Mazur, Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat 
  Research), MSTIC
date: 2021-10-15
modified: 2022-09-15
tags:
- attack.collection
- attack.t1115
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|contains: 'xclip'
    CommandLine|contains|all:
    - '-sel'
    - 'clip'
    - '-o'
  condition: selection
falsepositives:
- Legitimate usage of xclip tools.
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `xclip` tool, which is commonly used in Linux environments to interact with the clipboard. It identifies when `xclip` is invoked with specific command-line arguments that suggest an attempt to collect data from the clipboard. The likely attacker objective behind this behavior is to extract sensitive information, such as passwords or confidential documents, that may have been copied by a user.

  This detection is associated with the MITRE ATT&CK tactic of **Collection** (TA0009) and the technique **Clipboard Data Transfer** (T1115). Primary telemetry sources include process creation logs on Linux systems, specifically monitoring for process invocations that involve `xclip`. If malicious, this behavior could lead to unauthorized data exfiltration. Importantly, this detection does NOT confirm that data has been exfiltrated; it solely indicates an attempt to access the clipboard data.

  ### Investigation Steps

  - **Verify the process creation log:** Check for Linux process creation logs that contain `xclip`. Look for log entries such as **Sysmon Event ID 1** or any other relevant process creation logs to identify when this tool has been executed.

  - **Analyze command-line arguments:** Inspect the command-line fields for occurrences of `-sel`, `clip`, and `-o` in combination. This specific usage pattern is a high-confidence indicator of malicious intent.

  - **Assess user context:** Identify the user account associated with the `xclip` invocation. Investigate whether it is a legitimate user or an unexpected account, especially on critical servers where scripts might run.

  - **Review clipboard content:** If feasible, review clipboard contents or application-specific logs prior to the `xclip` execution, to determine if sensitive data was copied. This may include applications commonly used for handling confidential information, such as document editors.

  - **Identify legitimate use cases:** Cross-reference the execution of `xclip` with known benign workflows. Legitimate usage may stem from users employing clipboard functionalities in their day-to-day operations.

  - **Confirm installation of the tool:** Check if `xclip` is installed on the host where the detection triggered. If it is missing, this could indicate a potential anomaly or misconfiguration.

  ### Prioritization

  This alert is of **low severity** in a mature enterprise SOC environment due to the benign use cases of the `xclip` tool, but it requires attention on critical servers where sensitive data handling is prevalent. While the likelihood of malicious abuse exists, especially if executed by unauthorized users, the commonality of this command in legitimate scenarios mitigates the immediate risk.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where `xclip` is not logged correctly or completely. Users may employ legitimate clipboard use that could inadvertently trigger this rule, such as software developers or system administrators. Additionally, the presence of other clipboard utilities could complicate the detection landscape. A related detection to enhance coverage would be monitoring for other clipboard access tools (e.g., `xsel`), which could indicate similar behavior.

