title: Linux Crypto Mining Indicators
id: 9069ea3c-b213-4c52-be13-86506a227ab1
status: test
description: Detects command line parameters or strings often used by crypto 
  miners
references:
- https://www.poolwatch.io/coin/monero
author: Florian Roth (Nextron Systems)
date: 2021-10-26
modified: 2022-12-25
tags:
- attack.impact
- attack.t1496
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - ' --cpu-priority='
    - '--donate-level=0'
    - ' -o pool.'
    - ' --nicehash'
    - ' --algo=rx/0 '
    - 'stratum+tcp://'
    - 'stratum+udp://'
            # Sub process started by xmrig - the most popular Monero crypto miner - unknown if this causes any false positives
    - 'sh -c /sbin/modprobe msr allow_writes=on'
            # base64 encoded: --donate-level=
    - 'LS1kb25hdGUtbGV2ZWw9'
    - '0tZG9uYXRlLWxldmVsP'
    - 'tLWRvbmF0ZS1sZXZlbD'
            # base64 encoded: stratum+tcp:// and stratum+udp://
    - 'c3RyYXR1bSt0Y3A6Ly'
    - 'N0cmF0dW0rdGNwOi8v'
    - 'zdHJhdHVtK3RjcDovL'
    - 'c3RyYXR1bSt1ZHA6Ly'
    - 'N0cmF0dW0rdWRwOi8v'
    - 'zdHJhdHVtK3VkcDovL'
  condition: selection
falsepositives:
- Legitimate use of crypto miners
level: high
note: |
  ### Technical Context

  This Sigma rule detects command line parameters and strings frequently associated with cryptocurrency mining applications, particularly those targeting Monero such as XMRig. The primary objective of an attacker leveraging this rule is often to exploit system resources for unauthorized crypto mining, which can lead to performance degradation or increased operational costs. The relevant MITRE ATT&CK technique is Resource Hijacking (T1496).

  The primary telemetry source for this detection is Linux process creation logs, specifically monitoring the command-line arguments used during process initiation. If this activity is malicious, it can have significant security implications, including resource depletion and potential backdoor access. This detection does NOT confirm that crypto mining activity is malicious without further context, as legitimate uses may exist.

  ### Investigation Steps

  - **Review command line arguments:** Check for instances of command line entries related to crypto mining such as `--cpu-priority=`, `--donate-level=0`, or `stratum+tcp://`. Focus on processes identified with Event ID 280 in syslog (or equivalent logging) to determine their intent.

  - **Cross-reference running processes:** Identify the parent process of flagged command lines. Legitimate process hierarchies usually include known applications or system administrators’ authorized scripts. Look for common benign parent processes such as `bash` or `systemd`. An unexpected parent, like an unrecognized user or script, could indicate malicious intent.

  - **Evaluate system performance metrics:** Examine CPU and memory usage over time for affected systems. High resource consumption that correlates with detected command lines (e.g., spikes exceeding normal thresholds for expected workloads) can indicate unauthorized crypto mining activity.

  - **Check for persistence mechanisms:** Investigate system autorun configurations (e.g., `/etc/rc.local`, cron jobs) to identify how the process was launched. Legitimate mining activity might be initiated via user scripts, while persistence in root-owned scripts might suggest malicious intent.

  - **Collect network traffic data:** Look for outgoing connections to known mining pools (e.g., those receiving `stratum+tcp://` data). Use tools like `tcpdump` or `Wireshark` to identify unusual traffic patterns connecting to external IP addresses associated with mining.

  ### Prioritization

  This alert is of high severity due to the potential impact on the compromised system's performance and availability. The likelihood of exploitation is significant because resource hijacking is increasingly weaponized given the rise of cryptocurrency. Attackers often deploy mining tools to leverage compromised resources discreetly.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through obfuscation of command-line arguments or the use of less common mining software that may not be detected by the rule. Required log sources include comprehensive process creation logs and network flow data to fully corroborate mining activity. Legitimate activities may include authorized use of crypto miners by developers or operations for testing purposes, which could trigger the alert. A related detection rule for monitoring unusual process spawning behaviors can enhance coverage against this threat.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
