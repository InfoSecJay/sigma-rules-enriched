title: Linux Crypto Mining Indicators
id: 9069ea3c-b213-4c52-be13-86506a227ab1
status: test
description: Detects command line parameters or strings often used by crypto miners
references:
- https://www.poolwatch.io/coin/monero
author: Florian Roth (Nextron Systems)
date: 2021-10-26
modified: 2022-12-25
tags:
- attack.impact
- attack.t1496
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - ' --cpu-priority='
    - '--donate-level=0'
    - ' -o pool.'
    - ' --nicehash'
    - ' --algo=rx/0 '
    - 'stratum+tcp://'
    - 'stratum+udp://'
            # Sub process started by xmrig - the most popular Monero crypto miner - unknown if this causes any false positives
    - 'sh -c /sbin/modprobe msr allow_writes=on'
            # base64 encoded: --donate-level=
    - 'LS1kb25hdGUtbGV2ZWw9'
    - '0tZG9uYXRlLWxldmVsP'
    - 'tLWRvbmF0ZS1sZXZlbD'
            # base64 encoded: stratum+tcp:// and stratum+udp://
    - 'c3RyYXR1bSt0Y3A6Ly'
    - 'N0cmF0dW0rdGNwOi8v'
    - 'zdHJhdHVtK3RjcDovL'
    - 'c3RyYXR1bSt1ZHA6Ly'
    - 'N0cmF0dW0rdWRwOi8v'
    - 'zdHJhdHVtK3VkcDovL'
  condition: selection
falsepositives:
- Legitimate use of crypto miners
level: high
note: |
  ### Technical Context
  This rule detects command line parameters and keywords commonly used by cryptocurrency miners, particularly those associated with Monero mining. Attackers may deploy crypto mining software within enterprise environments to utilize organizational computing resources for personal financial gain, leading to degraded performance, increased costs, and potential security vulnerabilities. The unauthorized execution of mining software often happens silently in the background, making it important for security teams to monitor for these indicators of compromise.

  The relevant MITRE ATT&CK tactics include **Impact (TA0008)** and **Resource Hijacking (T1496)**. Attackers leveraging crypto mining seek to maximize profits by hijacking system resources, often taking advantage of unmonitored or poorly secured environments. The primary data source for this detection is **process creation logs** from Linux systems, which capture command line arguments used during process initiation.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for entries that contain the specified command line parameters associated with crypto mining activity. This includes keywords like `--cpu-priority`, `--donate-level`, and various `stratum` parameters.

  - **Analyze System Performance**: Monitor system performance metrics (CPU and memory usage) for unusual spikes that may indicate crypto mining activity. Legitimate applications typically do not maintain high CPU utilization for extended periods.

  - **Verify Installed Applications**: Conduct an audit of installed software on Linux systems for unauthorized crypto mining applications such as xmrig. Check for any unusual binary or script files that could indicate a miner is running.

  - **Investigate Network Connections**: Inspect outbound network connections for any traffic directed toward known mining pools. Look for connections initiated to `stratum` URLs, especially those indicative of mining operations.

  ### Prioritization
  This alert has a **high severity** due to the significant impact that unauthorized crypto mining can have on system resources, operational costs, and the potential for further security compromise. The likelihood of encountering this behavior is increased in environments with lax monitoring and controls.

  ### Blind Spots and Assumptions
  There are potential gaps in detection as legitimate use of crypto miners might generate false positives, especially in environments where such applications are permitted. The detection logic assumes that command line parameters associated with mining tools are consistent and identifiable within process creation logs. Effective detection requires comprehensive logging of process activities, and configurations should ensure that command line arguments are included in all process creation logs to function effectively.

