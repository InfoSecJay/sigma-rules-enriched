title: Access of Sudoers File Content
id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
status: test
description: Detects the execution of a text-based file access or inspection utilities
  to read the content of /etc/sudoers in order to potentially list all users that
  have sudo rights.
references:
- https://github.com/sleventyeleven/linuxprivchecker/
author: Florian Roth (Nextron Systems)
date: 2022-06-20
modified: 2025-06-04
tags:
- attack.reconnaissance
- attack.t1592.004
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
    - '/cat'
    - '/ed'
    - '/egrep'
    - '/emacs'
    - '/fgrep'
    - '/grep'
    - '/head'
    - '/less'
    - '/more'
    - '/nano'
    - '/tail'
    CommandLine|contains: ' /etc/sudoers'
  condition: selection
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This rule is designed to detect unauthorized access to the `/etc/sudoers` file on Linux systems through the execution of text-based file access utility commands. The probable intent behind such access is for attackers to enumerate users with escalated privileges (sudo rights), which can aid in lateral movement, privilege escalation, and overall system compromise. Attackers may leverage this information to execute targeted attacks against high-privilege accounts or to further their reconnaissance efforts within the environment.

  Relevant MITRE ATT&CK tactics include:
  - **Reconnaissance** (TA0043)
    - **Account Discovery** (T1087)
    - **Permission Group Discovery** (T1069)

  The primary data source for this detection rule is **process creation logs** that capture command executions on Linux systems, helping identify both the commands used and their arguments during suspicious activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for instances where commands such as `/cat`, `/grep`, or other specified utilities were executed, particularly when the command line includes `/etc/sudoers`.

  - **Correlate with User Activity**: Identify the user associated with the command execution and assess their role to determine if they have legitimate reasons to access the sudoers file.

  - **Analyze Command Line Parameters**: Look closely at the arguments provided to the commands; specific search patterns related to `/etc/sudoers` can indicate reconnaissance behavior.

  - **Check for Anomalous Patterns**: Investigate any patterns of repeated suspenseful access to critical system files, potentially correlating with other account or permission discovery activities within the timeframe.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of unauthorized access to privileged account information, which could allow attackers to elevate their own privileges or compromise other accounts. The likelihood is considered moderate, primarily depending on the security posture and usage patterns of the organization’s Linux infrastructure.

  ### Blind Spots and Assumptions
  This detection rule may not cover all scenarios of interest since it relies solely on the captured command execution logs, which may not account for all methods of file access (e.g., direct file system manipulation). The detection logic assumes that any legitimate administrative activity is not included in the analysis, hence the potential for false positives. Required logs include comprehensive process creation records with command line parameters enabled, ensuring all executions are captured for effective monitoring.

