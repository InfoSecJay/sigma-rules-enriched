title: Access of Sudoers File Content
id: 0f79c4d2-4e1f-4683-9c36-b5469a665e06
status: test
description: Detects the execution of a text-based file access or inspection 
  utilities to read the content of /etc/sudoers in order to potentially list all
  users that have sudo rights.
references:
