note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of text-based utilities that access the `/etc/sudoers` file, which could reveal users with elevated permissions. The likely attacker objective is to identify users who have sudo access to exploit their privileges or escalate their access within a system. This behavior aligns with the MITRE ATT&CK technique T1592.004: "Sudo and Sudo Caching." The primary telemetry source includes process creation logs from Linux systems, specifically events related to the execution of commands targeting `/etc/sudoers`. If malicious, it can indicate reconnaissance activity that precedes privilege escalation or lateral movement. This detection does NOT confirm actual exploitation or successful privilege escalation on its own.

  ---

  ### Investigation Steps

  - **Identify the command execution:** Review process creation logs (e.g., `syslog` or `auditd` logs) for relevant command execution events (e.g., `execve` calls) and look for the use of image names containing `/cat`, `/grep`, or similar utilities targeting `/etc/sudoers`.

  - **Check for legitimate usage patterns:** Determine if the command was run as part of a recognized administrative workflow by looking for logs that show typical usage of these commands for system maintenance (e.g., performed by system administrators during system audits).

  - **Correlate with user accounts:** Validate the user account that executed the command against your IAM policies. Any suspicious or unauthorized user account accessing `/etc/sudoers` should be investigated, particularly if it is a standard user.

  - **Analyze command line arguments:** Review the command line arguments (Event ID from `auditd`) for additional context (e.g., parameters used with `grep` that may imply a more targeted reconnaissance rather than a benign inspection).

  - **Review access patterns in context:** Evaluate recent access patterns to the sudoers file. Legitimate access should be logged regularly for administrators, while sporadic access may indicate malicious intent.

  - **Investigate system criticality and host role:** Assess the severity based on the criticality of the host involved. A command accessing `/etc/sudoers` on a domain controller or server running critical services should be prioritized higher than on a standard workstation.

  ---

  ### Prioritization

  This alert has a medium severity level. While accessing the sudoers file does not indicate immediate compromise, it reflects reconnaissance and potential privilege escalation intentions. The likelihood of abusive behavior is higher on critical systems where such information could enable further attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by logged command executions, which could be disabled or configured to suppress certain logs. Legitimate administrative activities, such as script executions or authorized audits, may trigger the alert. A related detection to consider is unauthorized changes to the `/etc/sudoers` file itself, which could further establish malicious intent and provide additional context for abnormal access patterns.

