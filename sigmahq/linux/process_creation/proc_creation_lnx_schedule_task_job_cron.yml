note: |
  ### Technical Context

  This Sigma rule detects the misuse of the cron utility on Linux systems, specifically targeting crontab jobs that execute scripts or commands originating from the `/tmp/` directory. The likely objective of an attacker would be to establish persistence by scheduling malicious code to run at specified intervals. This behavior aligns with the MITRE ATT&CK technique for scheduled tasks, specifically T1053.003 (Cron).

  The primary telemetry source is the Linux process creation logs, particularly focusing on the command line executed and the image path referencing `crontab`. If successfully exploited, malicious cron jobs could result in repeated execution of payloads, leading to potential data exfiltration, lateral movement, or other malicious activities. However, this detection does NOT confirm that a compromise has occurred without further corroborating evidence.

  ### Investigation Steps

  - **Review crontab entries**: Check the scheduled jobs with `crontab -l` for any entries pointing to scripts in `/tmp/`. Legitimate activity typically includes cron jobs for routine system maintenance or user-scheduled tasks reflecting expected operational behavior.

  - **Validate command line execution**: Look at the process creation logs (e.g., audit logs or Syslog) for Event ID 100 (or equivalent) where the command line contains `/tmp/`. Any occurrences of such entries should be closely scrutinized for unusual or unexpected commands.

  - **Inspect file metadata**: Use `ls -l /tmp/` and `stat /tmp/<filename>` to review recently created files. Any newly created executable scripts or binaries within `/tmp/` should raise suspicion if created outside of normal administrative activity.

  - **Check for run frequency**: Examine the timing and frequency of cron jobs using tools like `atq` or system crontab for unusual execution patterns. Confirm if the jobs exhibit timings that align with malicious behavior rather than typical scheduled operations.

  - **Correlate with authentication logs**: Review authentication logs (e.g., /var/log/auth.log) in conjunction with process execution to identify unusual or unauthorized user access that may correspond with the creation of malicious cron jobs.

  ### Prioritization

  This alert has a medium severity level. The impact is elevated if the affected system is critical to operations, as malicious cron jobs can persist undetected and facilitate ongoing exploitation. Additionally, attackers frequently weaponize this method for maintaining access in compromised environments.

  ### Blind Spots and Assumptions

  Detection efficacy may be limited if logging is incomplete or if an attacker uses legitimate scheduled tasks not detected by this rule. It's essential to ensure logging for cron job executions is enabled, as well as regular auditing of crontab activities. Legitimate administrative tasks, such as automated backups or maintenance scripts, could potentially trigger this alert. Companion detections, such as monitoring for unusual file creation in `/tmp/`, would enhance overall detection capabilities.

