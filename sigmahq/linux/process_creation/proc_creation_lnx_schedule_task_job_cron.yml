  ---

  ### Technical Context

  This rule detects the creation or modification of cron jobs that utilize the `crontab` command while referencing files from the `/tmp/` directory, which is often indicative of malicious activity. The likely attacker objective is to establish persistence on the compromised host by scheduling malicious scripts or commands for regular execution. This behavior relates to the MITRE ATT&CK tactic for Execution (T1203) and Persistence (T1053.003).

  The primary telemetry source is Linux process creation logs that capture `crontab` commands, particularly those that manipulate files from the `/tmp/` directory. If malicious, this can lead to the consistent execution of harmful payloads. However, this detection does NOT confirm that the scheduled job is malicious without further contextual investigation.

  ---

  ### Investigation Steps

  - **Review recent crontab modifications: ** Execute `sudo crontab -l` to examine current cron jobs. Look for entries that refer to `/tmp/` and have unusual or non-standard command syntax.

  - **Check process creation logs: ** Analyze `/var/log/syslog` or `auditd` logs for Event IDs related to crontab execution (e.g., Event ID 12294) around the time of suspicious modifications. Focus on parsing any command lines that indicate intent beyond standard administrative tasks.

  - **Identify the legitimacy of /tmp content: ** List files in `/tmp/` using `ls -la /tmp/`. Determine if there are any executable scripts or binaries that have suspicious names or unknown origins. Consider typical legitimate contents like temporary installation files.

  - **Correlate with user activity: ** Review user actions prior to the cron entry creation by checking `.bash_history` or similar shell history files. Identify whether the user was performing legitimate administration tasks or if there are deviations in behavior.

  - **Check for known malicious indicators:** Identify if `/tmp/` files are known malware or scripts associated with previous incidents by comparing hashes against threat intelligence sources or internal blocklists.

  - **Examine host user roles: ** Validate the host's role and assess criticality. For example, a web server may have legitimate cron jobs for routine tasks, whereas equivalent jobs on a database server could suggest unauthorized access attempts.

  ---

  ### Prioritization

  This alert should be treated with medium severity. The impact hinges on the role of the affected system—servers in production environments are at higher risk. The likelihood of malicious abuse is realistic, as attackers commonly leverage cron jobs for persistence. This behavior is well-known and frequently weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques like clearing crontab entries after execution or using non-standard scheduling methods. Ensuring comprehensive log collection from both `/var/log/syslog` and potential cron logging mechanisms is necessary for reliable detection. Legitimate activities, such as scheduled maintenance tasks, may trigger this alert if configured by administrators. Monitoring related detections, such as suspicious command executions from `/tmp/`, will strengthen overall threat coverage.

