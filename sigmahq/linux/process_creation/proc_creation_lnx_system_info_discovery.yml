note: |
  ### Technical Context
  This detection rule identifies system information discovery commands on Linux systems. These commands are often used by attackers to gather critical information about the system configuration, installed hardware, and other attributes that could aid in further exploitation or lateral movement within a network. The goal of the attacker is typically to enumerate system resources and configurations before executing a targeted attack or implanting further malicious tools.

  The relevant MITRE ATT&CK tactics include **Discovery** (TA0007) and the associated technique **System Information Discovery** (T1082). This detection can reveal potentially suspicious activities when commands related to system information are executed outside of regular administrative scope, raising concerns about reconnaissance efforts that may precede more damaging actions such as privilege escalation or data exfiltration.

  Primary data sources for this detection are **process creation events** on Linux systems, which log executed commands and can be used to analyze suspicious command usage patterns directly.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for the detection of commands like `/uname`, `/hostname`, `/uptime`, `/lspci`, `/dmidecode`, `/lscpu`, and `/lsmod`. Check for execution by unusual or unauthorized users.
  - **Assess User Context**: Identify the context in which these system information commands were run. Look for indicators of suspicious activity such as execution time, user accounts, and process parent-child relationships.
  - **Compare Against Baselines**: Compare logged command occurrences against established baselines of legitimate administrative activity to identify anomalies or deviations that may indicate unauthorized information gathering.
  - **Correlate with Other Log Sources**: Cross-reference findings with other log sources such as network traffic logs, authentication logs, or configuration changes to determine if these discovery commands are part of a broader attack strategy.

  ### Prioritization
  The severity of this alert is considered informational, as legitimate administrative tasks may generate similar logs. However, vigilance is required, as repeated and unexplained execution of these commands may indicate reconnaissance activities that precede more severe threats.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of system information command execution if appropriate logging mechanisms are not in place. Additionally, the logic assumes that such commands are executed without user interruption, meaning that interactive sessions executed by legitimate personnel could be misclassified. Proper log capturing configurations for process creation events on all relevant Linux systems are necessary for this detection to function effectively.

