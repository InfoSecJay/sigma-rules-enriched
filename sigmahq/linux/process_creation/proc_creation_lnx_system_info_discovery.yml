  ---

  ### Technical Context

  This Sigma rule detects commands typically associated with system information discovery on Linux systems, such as `/uname`, `/hostname`, `/uptime`, `/lspci`, `/dmidecode`, `/lscpu`, and `/lsmod`. Such behavior is often indicative of an attacker reconnoitering the system to gather information about hardware and software configurations, possibly to identify vulnerabilities or misconfigurations for further exploitation. The relevant MITRE ATT&CK framework tactic is Discovery, specifically the technique T1082 (System Information Discovery).

  The primary telemetry source for this detection is the process creation logs from the Linux operating system. These logs provide detailed information about executed commands, which can include the full command line. If such commands are executed with malicious intent, they can lead to significant security risks, such as preparing for a data exfiltration or lateral movement. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative activities may also generate similar log entries.

  ---

  ### Investigation Steps

  - **Review executed command details:** Check the command line arguments associated with process creation logs in `/var/log/auth.log` or use `journalctl` for Systemd-based systems. Look for commands specifically like `/uname` or `/lspci`. Typical benign usage might include calls from trusted administrative users (e.g., `admin` or `sysadmin`).

  - **Identify suspicious user context:** Validate the user account that issued the commands in the logs. Unrecognized users or service accounts executing discovery commands could indicate malicious activity.

  - **Correlate with lateral movement attempts:** Examine nearby logs for any other suspicious behaviors or process creation events in proximity (time-stamped) to the discovery commands. Check for unusual connections or access patterns that might suggest further reconnaissance or exploitation efforts.

  - **Analyze environment context:** Consider the host role or criticality by reviewing asset management records. Commands executed on critical infrastructure or sensitive assets require heightened scrutiny due to the potential impact of a successful attack.

  - **Cross-verify with known benign processes:** Identify common administrative tasks that may also call these commands, e.g., system health checks or inventory scripts executed by legitimate users. Compare timestamps and context to assess the legitimacy.

  ---

  ### Prioritization

  The alert should be treated as informational but warrant investigation, particularly if executed by non-administrative users or during unusual hours. The commands detected are common in reconnaissance activities and can signal a preparatory phase of a cyber attack, which necessitates prompt attention.

  ---

  ### Blind Spots and Assumptions

  This detection may miss command executions that do not leverage standard utilities for system discovery or if logging is disabled or misconfigured. Legitimate administrative tasks, such as system health checks or hardware assessments during maintenance windows, can generate similar alerts. Companion detections, such as monitoring for unusual login patterns or suspicious network traffic, can strengthen the overall detection coverage for discovery activities.

