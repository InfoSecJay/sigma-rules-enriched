note: |
  ### Technical Context

  This Sigma rule detects commands typically used for system information discovery on Linux systems, including `/uname`, `/hostname`, `/uptime`, `/lspci`, `/dmidecode`, `/lscpu`, and `/lsmod`. The likely objective of an attacker using these commands is to gather system details, which can aid in further exploitation or lateral movement within the network. This behavior is related to the MITRE ATT&CK technique T1082: System Information Discovery.

  The primary telemetry source for this detection is process creation logs from Linux systems. Specific log types include Syslog or audit logs that capture execution details of commands. If the activity is malicious, it could indicate reconnaissance prior to a more significant attack. However, it is important to note that this detection does NOT confirm malicious intent on its own, as many legitimate administrative activities would trigger these commands.

  ### Investigation Steps

  - **Assess the context of the commands executed:** Review the process creation logs (e.g., Syslog or `/var/log/audit/audit.log`) for the command invocations, focusing on Event IDs related to command execution. Look for unusual timing or execution by non-administrative users.

  - **Identify unauthorized command execution:** Cross-reference the user account that executed these commands against known administrative roles; deviations from expected user behavior could indicate malicious activity.

  - **Review similar activity from the same source:** Check for a cluster of system discovery commands from the same user or IP address within a short timeframe. Multiple commands executed in succession can suggest automated/scripted behavior rather than legitimate use.

  - **Compare against baseline activity:** Analyze normal operational activity within your environment to identify legitimate usage of these commands. For example, system administrators might use these commands during maintenance windows or scheduled updates.

  - **Verify command arguments:** Examine if any of the commands were executed with unusual arguments that could indicate adversarial intent or interest in specific system characteristics, thereby providing additional context to the investigation.

  ### Prioritization

  This alert carries low severity in a mature enterprise context, primarily due to the frequent benign use of these system information commands by administrators for routine tasks. However, if executed by unexpected users or in unusual combinations, it can elevate concerns regarding potential reconnaissance efforts.

  ### Blind Spots and Assumptions

  The primary detection limitation is the potential for legitimate administrative activities to trigger these alerts, such as routine system checks or troubleshooting. Reliable detection requires appropriate logging configurations from all Linux hosts, ensuring that process creation events are captured. Additionally, automated monitoring through tools like auditd can improve visibility. An associated detection to strengthen coverage is monitoring for abnormal privilege escalation attempts following system discovery commands, such as looking for elevated execution (e.g., via sudo) in conjunction with the command executions.

