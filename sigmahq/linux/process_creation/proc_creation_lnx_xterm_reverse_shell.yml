note: |
  ### Technical Context

  This Sigma rule detects the execution of the `xterm` command with specific parameters that suggest potential reverse shell activity, particularly through the use of the `-display` option, typical in scenarios where an attacker opens a remote X11 display. The likely objective of this behavior is to maintain remote access to a compromised system, allowing an adversary to execute commands or perform additional actions without direct interaction. This activity aligns with the MITRE ATT&CK technique "Command and Scripting Interpreter" (T1059).

  The primary telemetry sources for this detection include Linux audit logs and process creation events. The detection indicates a potential compromise, as misuse of `xterm` for reverse shells poses security risks including unauthorized data access and system control. Notably, this detection does NOT confirm an active compromise on its own—further context and investigation are necessary to ascertain the intent of the command execution.

  ### Investigation Steps

  - **Review process creation logs**: Check for Linux audit logs (e.g., `/var/log/audit/audit.log`) and specifically look for entries with `exe` containing `xterm` alongside `args` that include `-display` and `:1`. Verify if these logs correlate with user behavior or scheduled tasks.

  - **Correlate with user activity**: Investigate the user account that executed the `xterm` command. Check `/var/log/auth.log` for previous authenticated sessions by the user, focusing on timestamps and actions leading up to the event. Legitimate users may run X11 commands locally without reverse shell parameters.

  - **Identify network connections**: Use tools like `netstat` or `ss` to identify established connections from the host after the command execution. Look for connections on port 6001 (which corresponds to `:1`). An established connection in this range could indicate malicious activity.

  - **Search for suspicious child processes**: Analyze the process tree originating from `xterm` (use `pstree` or `ps -ef`). Look for unexpected or unauthorized processes spawned by `xterm`. Be cautious if suspicious binaries are executed that are not typically associated with legitimate use cases.

  - **Check for installed packages**: Review installed packages using `dpkg -l` or similar commands to identify non-standard or unauthorized software related to reverse shells or remote access tools. Validate against a baseline of legitimate system configurations.

  ### Prioritization

  This alert should be treated with medium priority due to the impact potential of affected Linux systems. The likelihood of abuse for reverse shells is significant, as many attackers utilize common utilities like `xterm` for persistent access. However, depending on organizational practices, legitimate administrative activities may also trigger this alert, necessitating careful review.

  ### Blind Spots and Assumptions

  Evasion techniques include renaming malicious binaries or using obfuscation to mask command-line arguments. The detection relies on having audit logs configured to capture process creation events in detail, which may not be enabled by default on all Linux distributions. Legitimate administrative actions, such as setting up X11 forwarding for remote support, could trigger false positives. Companion detections that could enhance coverage include monitoring for abnormal outbound network connections or presence of known reverse shell patterns in command-line arguments.

