  ---

  ### Technical Context

  This Sigma rule detects instances where the `xterm` application is executed with parameters indicative of a reverse shell, specifically looking for the inclusion of `-display` and parameters that end with `:1`. The likely attacker objective is to establish a remote terminal session that allows the adversary control over the compromised host. This behavior aligns with the MITRE ATT&CK tactic "Execution" and technique "Command and Scripting Interpreter" (ID: T1059).

  Primary telemetry sources include process creation logs from Linux systems, particularly examining fields that capture the executable image and command line arguments. If malicious, this activity could enable an attacker to execute arbitrary commands on the system, exfiltrate data, or further propagate within the network. Importantly, this detection does NOT confirm that an attack is taking place; it merely highlights a potentially suspicious use of `xterm`.

  ---

  ### Investigation Steps

  - **Verify process creation logs:** Check for Security Event ID 1 (Sysmon) or equivalent process creation logs that include `xterm` in the Image path and a CommandLine containing `-display` and ending with `:1`.

  - **Analyze command line arguments:** Review the command line details for this process. If benign usage is found, such as `xterm -display :0` for local uses, indicate possible legitimate activity.

  - **Investigate related network activity:** Look at outbound connections originating from the host running `xterm`. Identify connections directed to external IPs that could indicate a reverse shell setup, specifically for TCP connections on non-standard ports.

  - **Correlate with user behavior:** Check the user associated with this process creation. Ensure the user is authorized and typically engages in activity involving `xterm` for legitimate administrative tasks.

  - **Examine system logs for abnormal activity:** Search for any unusual system behavior or alerts in the logs, such as logins from unfamiliar users or elevated privileges granted around the time `xterm` was executed.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for system compromise via a reverse shell. The likelihood of malicious abuse is moderate, as the configuration can indicate common attack strategies. While not all instances of using `xterm` are adversarial, this use case is frequently weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include using other terminal applications or altering the command parameters to bypass detection. Reliable detection requires that `process_creation` logging is fully enabled on all Linux systems. Legitimate activities, such as using `xterm` for graphical applications or remote desktop management by authorized users, may trigger this alert. A related detection to consider is monitoring outbound connections from the same host for abnormal patterns indicative of active reverse shells.

