note: |
  ### Technical Context
  This rule detects the use of `xterm` as a potential reverse shell tunnel on Linux systems. A reverse shell allows an attacker to gain remote access to a compromised system, sending commands back to a listening server controlled by the attacker. The command line usage of `xterm` with specific flags can indicate that an attacker is trying to establish such a connection. The likely attacker objectives include exfiltrating sensitive data, establishing persistence, or lateral movement within the network.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution**: T1059 - Command and Scripting Interpreter
  - **Command-Line Interface**: T1059.001 - PowerShell
  - **Remote File Copy**: T1105

  Primary data sources for this detection are process creation events that capture command-line arguments associated with new processes being initiated.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the logs for processes related to `xterm`. Look for instances where the image path includes `xterm` and correlates with the presence of flags like `-display`.

  - **Analyze Command-Line Arguments**: Check for any command-line activity that includes `-display :1`. This indicates that the `xterm` session is being set up to connect to a different display server, commonly associated with reverse shells.

  - **Correlate with Network Traffic**: Investigate network logs for outbound connections that coincide with the timing of detected `xterm` processes. This includes traffic to unknown or suspicious IP addresses.

  - **Assess User Context**: Identify the user account running the `xterm` command. Check if it aligns with expected behavior for that user or if it appears suspicious based on role or location.

  ### Prioritization
  Given the potential for remote access and the implications of a reverse shell being established on internal systems, this alert is considered medium severity. The impact can range from sensitive data compromise to attacker foothold establishment, making prompt investigation necessary.

  ### Blind Spots and Assumptions
  The detection logic assumes that the `xterm` command will consistently be used for malicious purposes when paired with the specified arguments, which may not always be true. There is a possibility of legitimate use cases for `xterm` being misclassified as a threat, leading to false positives. Additionally, the detection relies on the availability of comprehensive process creation logs; any gaps in logging configurations may prevent accurate detection. If the environment lacks standard logging for these events, the alert may not function as intended.

