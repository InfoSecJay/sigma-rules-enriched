title: Shell Execution via Git - Linux
id: 47b3bbd4-1bf7-48cc-84ab-995362aaa75a
status: test
description: |
  Detects the use of the "git" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/git/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg 
  L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|endswith: '/git'
    ParentCommandLine|contains|all:
    - ' -p '
    - 'help'
    CommandLine|contains:
    - 'bash 0<&1'
    - 'dash 0<&1'
    - 'sh 0<&1'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of a shell via the `git` utility on Linux systems. Attackers may employ this technique for privilege escalation, unauthorized command execution, or to evade restrictions in a constrained environment. The relevant MITRE ATT&CK tactic is Execution (TA0002), with the technique ID T1059 (Command and Scripting Interpreter).

  The primary telemetry source is the process creation logs, specifically looking for process executions where `git` is the parent process and certain command line patterns are observed. If malicious, this behavior could enable attackers to execute arbitrary commands within the target system environment. However, this detection does NOT confirm malicious intent on its own, as it could also arise from legitimate administrative actions or scripted tasks.

  ### Investigation Steps

  - **Review process creation logs:**
    - Confirm applicable logs show Event ID 123 (Linux) for the `git` command execution with parameters indicating potential shell execution, particularly those that include `bash 0<&1`, `dash 0<&1`, or `sh 0<&1`.

  - **Identify benign use cases:**
    - Cross-reference legitimate admin activity from known trusted sources, which typically will not execute shells with `git` using the specified command line parameters. Look for established baseline behaviors in your environment.

  - **Check for unauthorized access:**
    - Investigate user accounts executing `git`, noting any atypical user context under which the command was run (e.g., non-administrative accounts triggering root-level shell executions).

  - **Correlate with system logs:**
    - Monitor syslog or security logs (e.g., `/var/log/auth.log`) for abnormal login attempts or unusual user activity before or after the `git` command execution.

  - **Assess vulnerability exposure:**
    - Determine if the system has known vulnerabilities that could allow for exploitation after shell access via `git`, enhancing the threat assessment.

  - **Collect file creation logs (if applicable):**
    - Review log entries for any unexpected file creations or modifications that occur post-execution of `git` commands, focusing on `/tmp` and `/var/tmp` directories as potential staging areas for malicious payloads.

  ### Prioritization

  This alert has high severity due to the impact of potential unauthorized command execution on Linux endpoints. The `git` command is commonly used, which increases the likelihood of malicious abuse if combined with shell execution techniques. Given the critical role of Linux servers in many organizations, this behavior should warrant immediate investigation.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where attackers leverage obfuscation techniques or use other programming environments to interact with `git` to execute commands without triggering this alert. Ensure that process creation logging is properly enabled across all Linux hosts for reliable detection. Legitimate use could include scripted automation for developers or DevOps tasks, which should be documented and monitored. To enhance detection coverage, consider implementing companion detections for unusual SSH activity or monitoring for atypical shell invocation patterns beyond `git`.

