title: Shell Execution via Git - Linux
id: 47b3bbd4-1bf7-48cc-84ab-995362aaa75a
status: test
description: |
  Detects the use of the "git" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/git/#shell
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.execution
- attack.t1059
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    ParentImage|endswith: '/git'
    ParentCommandLine|contains|all:
    - ' -p '
    - 'help'
    CommandLine|contains:
    - 'bash 0<&1'
    - 'dash 0<&1'
    - 'sh 0<&1'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects instances where the `git` utility is misused to execute a shell, which can indicate an attacker attempting to escalate privileges, execute unauthorized commands, or escape from a restricted environment. Git, primarily a version control system, has been leveraged as a means to launch interactive shells in various scenarios, especially when standard executable paths are restricted. By examining the process creation involving `git`, security teams can identify potential malicious activities that compromise system integrity.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002): This rule falls under the broader category of execution, where an attacker attempts to execute commands through the shell.
  - **Command and Scripting Interpreter** (T1059): The specific techniques utilized involve executing commands in a controlled scripting environment, allowing the attacker to gain unauthorized access.

  Primary data sources include:
  - Process creation logs, which will record the execution of processes along with their parent processes and command lines used, providing vital forensic insight into the ongoing activities.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine the process creation logs for entries where the parent image is `/git` and the command line includes indications of a shell being spawned. Look for unusual patterns or an excessive number of instances within a short timeframe.

  - **Analyze Command Line Arguments**: Investigate any command line arguments used with `git` that may suggest unauthorized actions, focusing on those that include `-p` or any shell redirection (e.g., `0<&1`). This can uncover attempts to redirect input/output streams.

  - **Check for Unauthorized User Activity**: Monitor the user accounts that executed the detected commands. Identify whether these actions correlate with known operational behavior or if they stem from potentially compromised or rogue accounts.

  - **Correlate with Additional Logs**: Consider reviewing logs from network traffic or endpoint detection and response (EDR) tools to support insights gained from process creation. Look for deviations in expected command usage and any outgoing connections or data transfers following the shell execution.

  ### Prioritization
  This alert is prioritized as high severity due to the potential for significant impact in an enterprise environment. Successful exploitation can lead to unauthorized access, privilege escalation, and further compromise of systems, making it essential for security teams to address promptly.

  ### Blind Spots and Assumptions
  The detection rule may not cover all potential misuse of the `git` command as it focuses on specific patterns of execution. It assumes that monitoring of process creation logs is properly configured and that the commands are executed in a typical command-line environment. Additionally, if certain logging levels are not enabled on the Linux systems, critical log information may be missed, leading to gaps in detection coverage.

