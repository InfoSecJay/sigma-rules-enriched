title: ESXi Admin Permission Assigned To Account Via ESXCLI
id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
status: test
description: Detects execution of the "esxcli" command with the "system" and "permission"
  flags in order to assign admin permissions to an account.
references:
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-04
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.t1059.012
- attack.t1098
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'system'
    CommandLine|contains|all:
    - ' permission '
    - ' set'
    - 'Admin'
  condition: selection
falsepositives:
- Legitimate administration activities
level: high
note: |
  ### Technical Context
  This rule is designed to detect the execution of the "esxcli" command with specific arguments that indicate the assignment of administrator permissions to an account in an ESXi environment. The detection logic monitors the CommandLine for the presence of "system" in combination with "permission" and "set Admin", signaling a potential elevation of privileges. This activity is often associated with attackers seeking to gain greater control over the virtual infrastructure, allowing them to pivot, establish persistence, or modify environments for malicious purposes.

  The relevant MITRE ATT&CK tactics and techniques that apply to this detection include:
  - **Persistence** (TA0003)
  - **Execution** (TA0002)
  - **Privilege Escalation** (TA0004)
  - **Command-Line Interface** (T1059.012)
  - **Account Manipulation** (T1098)

  Primary data sources for this detection include process creation logs from the ESXi host, which provide evidence of command executions and can help identify unauthorized privilege assignments.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check the process creation events on the ESXi server for any instances of the "esxcli" command executed with "system" and "permission" parameters indicating potential unauthorized permission modifications.

  - **Correlate User Accounts Involved**: Investigate the user account being modified; determine if it should have admin privileges. Look for any suspicious patterns in its login history and related activities.

  - **Analyze User Activity**: Examine any preceding command executions or sessions from the user account involved. This can help identify if this command was part of a series of malicious actions or if it's a legitimate administrative process.

  - **Validate Change Procedures**: Cross-check against approved administrative procedures for modifying account permissions to ensure the action aligns with your organization’s policies and hasn't been executed in an unauthorized manner.

  ### Prioritization
  The severity of this alert is high due to the significant risk that unauthorized elevation of privileges poses within the enterprise environment. Compromised administrative privileges can lead to extensive control over virtual systems and sensitive data, greatly increasing the attack surface and potential impact.

  ### Blind Spots and Assumptions
  While the rule effectively detects suspicious usage of the "esxcli" command for permission assignments, it assumes that all legitimate administrative activities are well-documented and follow a defined process. There may be gaps in detection if logs from less common administrative commands are not captured. Additionally, required log configurations include ensuring detailed process creation logs are enabled on the ESXi hosts to facilitate accurate detection of potentially malicious activity.

