title: ESXi Admin Permission Assigned To Account Via ESXCLI
id: 9691f58d-92c1-4416-8bf3-2edd753ec9cf
status: test
description: Detects execution of the "esxcli" command with the "system" and 
  "permission" flags in order to assign admin permissions to an account.
references:
- https://developer.broadcom.com/xapis/esxcli-command-reference/7.0.0/namespace/esxcli_system.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-04
tags:
- attack.persistence
- attack.execution
- attack.privilege-escalation
- attack.t1059.012
- attack.t1098
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'system'
    CommandLine|contains|all:
    - ' permission '
    - ' set'
    - 'Admin'
  condition: selection
falsepositives:
- Legitimate administration activities
level: high
note: |
  ### Technical Context

  This rule detects the execution of the `esxcli` command with specific flags targeting the assignment of admin permissions to a user account within an ESXi environment. The behavior suggests a privileged escalation or permission modification, potentially indicating that an attacker is trying to maintain persistence or gain elevated access. The relevant MITRE ATT&CK tactics and techniques are Persistence (T1098) and Execution (T1059.012).

  Primary telemetry sources include process creation logs on Linux systems (specifically for ESXi), such as Syslog or VMkernel logs. If malicious, this action could undermine security by granting unauthorized control over an ESXi host, enabling further exploitation. Importantly, this detection does NOT confirm that malicious activity has occurred without additional context, such as the account being modified or prior baseline permissions.

  ### Investigation Steps

  - **Check process creation logs**: Review Syslog or VMkernel logs for Security Events related to process creation, particularly those containing Event ID 100 (process execution) that show instances of `esxcli` being run with the specified parameters.

  - **Evaluate command legitimacy**: Assess the command line used during the execution. Legitimate administrative use of `esxcli` may include standard operational commands without permission modification flags (e.g., `esxcli network ip get`).

  - **Identify the executing user**: Cross-reference the username associated with the `esxcli` command against your user database. Look for administrative accounts that have unusual or unexpected permissions set within the past hour.

  - **Verify account modification activity**: Investigate logs for any prior or subsequent actions that correspond with the permission changes. Look for operations such as user logs or changes in the account’s attributes in the `User Inventory` (Event ID 200).

  - **Determine asset impact**: Ascertain the criticality of the affected ESXi host by checking asset management records. High-impact assets would warrant immediate escalation and response.

  - **Correlate with other detection mechanisms**: Review related detection rules that log failed permission or role changes within the environment, enhancing context around this particular alert (e.g., monitoring failed execution attempts of `esxcli`).

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical virtual infrastructure. Given the significance of ESXi hosts in environments, any unauthorized permission assignment could lead to broader system compromise. While admins often use `esxcli`, such command patterns specifically indicate a higher risk of abuse.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative actions taken by authorized users who routinely manage permissions. Evasion techniques may involve obfuscating command usage or executing commands from other legitimate scripts. Reliable detection relies on capturing comprehensive logging from VMware ESXi configurations. The absence of logging or improper configuration might lead to missed signals. Related detections for unusual account activity or unauthorized ESXi commands would enhance coverage against malicious intent.

