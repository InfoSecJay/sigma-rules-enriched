detection:
  selection:
    Image|endswith: '/esxcli'
    CommandLine|contains: 'system'
    CommandLine|contains|all:
    - ' permission '
    - ' set'
    - 'Admin'
  condition: selection
falsepositives:
- Legitimate administration activities
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of the `esxcli` command in a VMware ESXi environment specifically with flags related to system permissions, particularly when an account is assigned administrator access. This action typically indicates an attempt to escalate privileges, which may facilitate unauthorized access to sensitive resources on the virtual infrastructure.

  The relevant MITRE ATT&CK tactic is **Persistence** and **Execution**, specifically techniques **T1059.012** (Command and Scripting Interpreter: OS Command Injection) and **T1098** (Account Manipulation). The primary telemetry source is process creation logs from the ESXi environment, which capture details around the execution of the `esxcli` command. If executed maliciously, this could lead to unauthorized administrative control over the host and potentially the virtual machines hosted on it. Importantly, this detection does NOT confirm that the permission assignment was malicious; legitimate administrative activities may trigger this alert.

  ---

  ### Investigation Steps

  - **Examine process logs for suspicious `esxcli` commands**: Review process creation logs (e.g., logging source such as `/var/log/syslog`) for commands executed that include `/esxcli` with the arguments `system`, `permission`, and `set Admin`.

  - **Verify the user account executing the command**: Check the UID of the account that performed the command execution. Legitimate actions would typically be executed by recognized administrative accounts (e.g., `root` or other authorized users), while unexpected accounts indicate potential malicious intent.

  - **Cross-reference change logs for accounts and permissions**: Query the ESXi account management logs (especially `/var/run/log/hostd-*.log` or PowerCLI logs) to identify whether the account assignments have been properly documented and justified by admin activities.

  - **Check for additional privilege escalation activities**: Look for other related `esxcli` commands or scripts executing around the same timeframe that may indicate a broader attack pattern (e.g., logs revealing process creation Event ID related to privilege escalation or other unusual administrative actions).

  - **Validate legitimate administrative activity**: Review administrative protocol compliance; verify if recent changes to user permissions were pre-approved or aligned with established change management processes. Identifying discrepancies helps distinguish between authorized and suspicious actions.

  - **Assess the criticality of the affected host**: Understand the role of the ESXi host in your environment. If the host manages critical workloads, suspicious privilege escalations should be escalated quickly due to their potential for significant impact.

  ---

  ### Prioritization

  This alert carries a high severity due to the potential for significant impact on the ESXi host, which may control numerous critical virtual machines. The likelihood of adversaries exploiting administrative privileges to further compromise the environment is notable, especially as privilege escalation is a common tactic employed in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection could be circumvented if adversaries use administrative accounts or legitimate users inappropriately to impersonate authorized activities. Accurate detection requires that process creation logs are collected and retained properly. Benign administrative actions, like legitimate permission changes, can trigger this alert. Monitoring for related behaviors—such as unusual command sequences or multiple administrative commands in quick succession—can strengthen security coverage and response capability.

