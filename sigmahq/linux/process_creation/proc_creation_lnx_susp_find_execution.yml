note: |
  ### Technical Context

  This Sigma rule detects suspicious usage of the `find` command in a Linux environment that may indicate discovery activity by an adversary. The likely objective of the attacker is to identify files with specific permissions that might offer exploit opportunities, such as SUID or SGID binaries, which can escalate privileges. This behavior aligns with the MITRE ATT&CK technique for Discovery, specifically T1083 (File and Directory Discovery).

  The primary telemetry sources are Linux process creation logs, particularly focusing on the command line arguments associated with the execution of the `find` executable. If malicious, the discovery of sensitive files could lead to privilege escalation and further exploitation within the target environment. However, it is crucial to note that this detection does NOT confirm malicious intent or successful privilege escalation on its own; context must be established through additional investigation.

  ### Investigation Steps

  - **Review the Command Line Arguments**: Analyze the command line of the detected event (e.g., `CommandLine` field) for patterns indicating misuse of `find`, such as `-perm -4000` or `-perm -2000`, which target SUID and SGID files.

  - **Correlate with User Activity**: Check for unusual user accounts executing this command. Identify if the user typically performs file discovery or manipulation, and assess account privileges against the environment's norms.

  - **Validate Process Creation Event**: Locate Linux process creation logs for this execution, specifically targeting the logging products utilized (e.g., `auditd` logs or syslog entries that contain the command execution). Verify the execution time for any patterns indicating automated or scripted behavior.

  - **Identify Legitimate Use Cases**: Establish baseline behaviors for legitimate use of the `find` command in your environment. This could include searching for files with specific permissions for scheduled maintenance tasks. This may prevent misclassification of normal administrator activities.

  - **Review Historical Events**: Investigate any preceding or subsequent events related to this alert within the same timeline. This should reveal if this command usage correlates with other suspicious activities, such as unusual account logins or network connections.

  - **Assess System Criticality**: Consider the role of the affected host. If it is a server hosting sensitive applications or data, the risk and impact from this discovery behavior are escalated.

  ### Prioritization

  The alert has medium severity due to its potential impact on systems with critical data or permissions. The likelihood of this behavior being exploited for malicious intent is elevated, especially if paired with other suspicious activities. Discovery actions by adversaries are commonly weaponized as precursors to escalation tactics.

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative tasks aimed at system maintenance or audits that could trigger the rule. Evasion techniques might include using alternate methods to search for files or employing scheduled jobs that obfuscate the activity. Reliable detection requires appropriate configurations for process creation logging and maintaining comprehensive syslog or `auditd` records. A related detection could be the monitoring of privileged command executions (e.g., using sudo), which could provide context and support further analysis of user behavior patterns.

