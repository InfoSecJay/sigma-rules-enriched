note: |
  ### Technical Context
  This detection rule identifies potentially malicious usage of the `find` command on Linux systems. The `find` command is a standard utility that can be exploited by attackers to discover files with specific permissions, which may reveal sensitive data or vulnerable files that can be further leveraged for privilege escalation. Attackers conducting reconnaissance often use such commands to identify files that could grant them elevated access or sensitive information, aligning with discovery tactics typically employed during the early phases of an attack.

  The relevant MITRE ATT&CK tactics and techniques for this rule include:
  - **Tactic:** Discovery
  - **Technique:** File and Directory Discovery (T1083)

  To capture the necessary data for this detection, primary telemetry sources include process creation logs that detail command executions, particularly those capturing the command line arguments passed to processes. This will provide visibility into the types of queries made by the `find` command and can help correlate them with unusual behavior on the system.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for instances where the `find` command was executed. Focus on command lines containing suspicious permission flags like `-perm -4000` or `-perm -2000` which indicate searches for SUID/SGID files or files with wide permissions respectively.

  - **Check for Unusual Authorization Patterns:** Investigate the context of the execution. Determine whether the user executing the command has appropriate permissions and whether the command was run during irregular hours, which may indicate suspicious activity.

  - **Correlate with Other Logs:** Look for any additional logs from sources such as system audit logs or user activity logs that may indicate other reconnaissance efforts or privilege escalation attempts occurring around the same time.

  - **Threat Hunt for Privilege Escalation Activities:** Conduct proactive hunting for patterns related to privilege escalation that may correlate with the use of the `find` command, such as executions of known privilege escalation exploits or commands following the discovery activity.

  ### Prioritization
  This alert has medium severity due to the potential for a successful attacker to locate sensitive files that could lead to privilege escalation or further exploitation of the system. The likelihood of exploitation increases if such commands are executed by users with elevated privileges.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the exclusion of legitimate administrative activities where the `find` command might be used in typical system maintenance or audits, leading to false positives. The detection logic assumes that unusual command line parameters used with `find` correlate directly with malicious intent, which may not always be the case. Additionally, this detection requires comprehensive logging of process creation events, thus proper configurations of Linux audit logging are pivotal for the effectiveness of this alert.

