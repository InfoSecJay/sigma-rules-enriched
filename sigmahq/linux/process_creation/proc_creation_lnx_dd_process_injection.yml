note: |
  ### Technical Context

  This Sigma rule detects behavior consistent with code injection into a Linux process utilizing the `dd` command to manipulate the memory map of another process. The likely objective of an attacker employing this technique would be to escalate privileges or implant malicious code within a target process without standard debugging tools, potentially allowing them to maintain persistence or exfiltrate sensitive information. This activity aligns with the MITRE ATT&CK technique “Process Injection” (T1055.009).

  Primary telemetry sources include Linux process creation logs, particularly focusing on the `dd` utility invocation and associated command-line parameters. If successfully exploited, this technique can result in significant security incidents, including unauthorized access and data manipulation. It is essential to note this detection does NOT confirm exploitation on its own; it merely indicates suspicious usage patterns that warrant further investigation.

  ### Investigation Steps

  - **Check process creation logs**: Review logs for Event Type 241 from `auditd` or process accounting logs showing `dd` command execution. Examine timestamps indicating potential abnormal usage patterns.

  - **Validate command-line parameters**: Investigate the command-line arguments used with `dd`, specifically looking for the presence of `of=`, `/proc/`, and `/mem`. Legitimate uses of `dd` typically do not interact with `/proc` in this manner.

  - **Cross-reference parent processes**: Identify the parent process of the `dd` command execution using `ps` or `pstree`. Look for known benign processes or legitimate maintenance activities; suspicious parents may indicate malicious behavior.

  - **Identify high-confidence malicious indicators**: Search for additional evidence of process alterations or failed access attempts on `/proc/$PID/mem`, which could indicate an unauthorized interaction with another process's memory.

  - **Review system integrity logs**: Analyze `dmesg` or relevant system logs for kernel messages relating to memory access violations, which might indicate attempts to modify or examine memory regions of running processes.

  - **Assess asset criticality**: Confirm whether the executing host is a critical server or workstation in an environment handling sensitive data. High-value targets should prompt immediate escalation procedures.

  ### Prioritization

  This alert is medium severity due to the potential impact of code injection on critical Linux systems. While this technique may not be the most common attack vector, the ability to inject code stealthily poses a significant threat, especially if the host has sensitive applications or data.

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of proper logging configurations or if administrator-level actions using `dd` are common practice in the environment. Legitimate administrative tasks and maintenance could trigger this alert, necessitating a contextually aware review of occurrences. Companion detections, such as monitoring for anomalous interactions with `/proc/*/mem` or other file manipulation commands, can enhance overall detection efficacy.

