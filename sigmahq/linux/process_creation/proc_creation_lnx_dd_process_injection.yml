logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/dd'
    CommandLine|contains|all:
    - 'of='
    - '/proc/'
    - '/mem'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the potential misuse of the Linux `dd` utility to perform code injection by manipulating the memory map of an active process. Attackers may exploit this method to inject malicious code into a target process without using traditional debugging tools like `ptrace`. The objective is often to escalate privileges or achieve persistence through stealthy means.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Privilege Escalation** (TA0004) and **Defense Evasion** (TA0005), specifically the technique **Process Injection** (T1055.009). By utilizing `dd` to overwrite a process's memory, attackers can insert their own code and execute it, potentially evading detection mechanisms that monitor common injection methods.

  Primary data sources that provide the best evidence for this rule include process creation logs, which capture the execution of commands, and command line arguments used during process initiation. Logs generated by Linux's auditing mechanism (auditd) can also be beneficial, alongside any monitoring solutions in place that track filesystem changes or inter-process communications.

  ### Investigation Steps
  - **Review Process Creation Logs**: Analyze process creation logs for instances where `dd` was executed. Pay close attention to command line arguments that include `of=` and references to `/proc/` and `/mem`, as these patterns may indicate nefarious activity.

  - **Investigate Command Line Arguments**: Focus on the specific command line patterns that include memory manipulation paths, especially `/proc/[pid]/mem`. This detail can reveal attempts to access and modify other process memory.

  - **Correlate with System Behavior**: Look for unusual behavior in the target processes post-execution of the `dd` command, such as unexpected network connections, modified files, or other signs of compromise that could indicate successful code injection.

  - **Validate Against Known Indicators**: Cross-reference detected activity with known IOCs (Indicators of Compromise) associated with Linux process injection attacks and evaluate historical data to identify emerging patterns.

  ### Prioritization
  The alert's medium severity stems from the significant threat posed by successful code injection, which could lead to unauthorized access and further exploitation within the enterprise environment. Given that such tactics are often employed in advanced persistent threat (APT) scenarios, timely investigation is crucial to mitigate potential damage.

  ### Blind Spots and Assumptions
  Potential blind spots in detection coverage may include the use of alternative or hidden methods to achieve similar code injection results that do not utilize the `dd` command, thus bypassing the current rule. The detection logic assumes that sufficient logging is enabled and that access to relevant log sources is not restricted. Additionally, this alert may not function correctly in environments where command line argument logging is insufficient or missing altogether, limiting visibility into executed commands.

