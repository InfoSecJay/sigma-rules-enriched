note: |
  ### Technical Context

  This Sigma rule detects the potential injection of code into a running Linux process using the `dd` command to manipulate the memory map, specifically targeting UNIX-like systems. The likely attacker objective is to escalate privileges or execute arbitrary code within the context of a legitimate process. This behavior correlates with the MITRE ATT&CK technique of Process Injection (T1055.009), which enables adversaries to manipulate or hijack legitimate processes for malicious purposes.

  The primary telemetry sources include process creation logs, particularly from Linux systems capturing details about command execution. This rule indicates potential malicious activity; if exploited, it can allow attackers to gain unauthorized access or escalate their privileges. However, this detection does NOT confirm that malicious action has occurred on its own; it merely flags potentially suspicious behavior.

  ### Investigation Steps

  - **Investigate process creation events**: Review process creation logs (Linux `auditd` or `syslog`) for Event ID that includes `dd` execution, focusing on the command line arguments. Verify context—was `dd` used legitimately for disk copying or for injecting into a process memory space?

  - **Analyze command line parameters**: Look for logs (like `bash_history` or process accounting logs) showing the execution of `dd` with parameters like `of=/proc/[PID]/mem`. Validate if this specifies a legitimate process or a high-risk PID that could indicate an attack (e.g., running as root).

  - **Cross-reference with process attributes**: Utilize `ps` or similar commands to check the status of the target process being modified. Note any unexpected behavior, such as high CPU usage or connections, indicative of malicious intent.

  - **Identify innocuous use cases**: Determine whether legitimate maintenance tasks were conducted that would use `dd`, such as backups or system cloning, based on system logs and user activity records.

  - **Check for accompanying abnormal network activity**: Review logs (e.g., `iptables`, `netstat`, or `tcpdump`) for unusual outbound network connections from the affected process around the time of the alert. Malicious indicators can include connections to known C2 IPs or data exfiltration attempts.

  - **Monitor for potential persistence mechanisms**: Investigate if the `dd` command has been executed in scripts or as part of scheduled tasks (`cron`), which might suggest ongoing malicious activity beyond a one-time injection attempt.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on server integrity and confidentiality if malicious code injection occurs. Linux systems are commonly targeted for exploitation, making this behavior a plausible indicator of an attempted attack. Since process injection can be a repeated tactic by adversaries, rapid investigation and response are essential.

  ### Blind Spots and Assumptions

  Detection may be limited due to certain evasion techniques, such as adversaries using alternatives to `dd` or executing commands designed to avoid detection. Reliable detection requires comprehensive logging configurations across Linux processes, ensuring command lines and parental relationships are captured. False positives may arise from legitimate system maintenance or administrative actions. A related detection to enhance coverage includes monitoring for abnormal process memory reads/writes, which can provide an additional indicator of process manipulation attempts.

