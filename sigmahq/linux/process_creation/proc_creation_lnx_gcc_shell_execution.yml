title: Shell Execution GCC  - Linux
id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
status: test
description: |
  Detects the use of the "gcc" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/gcc/#shell
- https://gtfobins.github.io/gtfobins/c89/#shell
- https://gtfobins.github.io/gtfobins/c99/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/c89'
    - '/c99'
    - '/gcc'
    CommandLine|contains: '-wrapper'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash,-s'
    - '/bin/dash,-s'
    - '/bin/fish,-s'
    - '/bin/sh,-s'
    - '/bin/zsh,-s'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the invocation of the GNU Compiler Collection (GCC) utility to execute a shell. This behavior is often associated with attempts to escalate privileges, execute unauthorized commands, or escape from a restricted environment. Attackers may exploit the GCC tool to execute malicious code in environments where direct shell access is limited, which aligns with offensive strategies used in penetration testing or by threat actors looking to exploit vulnerabilities in Linux systems.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution** (TA0002): Executing custom shell commands through Germanium Compiler Collection (GCC).
  - **Discovery** (TA0007): Gaining insights about the system and its environment by using compilation tools.
  - **Privilege Escalation** (TA0004): Attempting to elevate privileges through unauthorized command execution via GCC.

  The primary data source for detecting this activity is the **process creation logs** from Linux systems, which will capture the execution commands and context of processes initiated by users or automated systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Collect logs related to process creation events for any instances involving GCC, C89, or C99. Pay special attention to command-line arguments that include shell wrappers or flags that enable script execution.

  - **Analyze Command Line Arguments**: Look for command lines that contain indicators of shell execution (e.g., `-s` flags with various shell binaries). This may illustrate attempts to execute potentially malicious commands or scripts.

  - **Investigate User Context**: Identify the user running the GCC command. Determine if the user has appropriate privileges or whether the command was executed under suspicious conditions or during unusual hours.

  - **Check for Anomalous Behavior**: Correlate the execution of GCC with other logs that may show signs of privilege escalation or unauthorized access attempts. Investigate related events to build a clearer picture of the context of the activity.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant threat impact associated with command execution and privilege escalation. GCC misuse in a Linux environment typically indicates an attempt to gain unauthorized control or execute malicious payloads, warranting immediate attention and investigation.

  ### Blind Spots and Assumptions
  There might be gaps in detection coverage regarding legitimate uses of GCC in development processes, which could lead to false positives. The detection logic assumes that the execution methods are using common UNIX shell interpreter invocations. The alert relies on accurate and comprehensive process creation logging being enabled, and any misconfigurations or log omissions may hinder effective detection.

