title: Shell Execution GCC  - Linux
id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
status: test
description: |
  Detects the use of the "gcc" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/gcc/#shell
- https://gtfobins.github.io/gtfobins/c89/#shell
- https://gtfobins.github.io/gtfobins/c99/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
date: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/c89'
    - '/c99'
    - '/gcc'
    CommandLine|contains: '-wrapper'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash,-s'
    - '/bin/dash,-s'
    - '/bin/fish,-s'
    - '/bin/sh,-s'
    - '/bin/zsh,-s'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the invocation of the `gcc` utility with a command-line parameter that suggests it is being used to execute a shell (e.g., using `-wrapper` or invoking a specific shell like `/bin/bash`). This behavior can be indicative of privilege escalation attempts, unauthorized command execution, or attempts to escape from a restricted environment, significantly heightening security risks.

  The tactic involved is **Execution** (TA0002), specifically leveraging the technique **Command and Scripting Interpreter** (T1059). Primary telemetry sources include process creation logs from Linux systems, particularly focusing on command invocations. If this detection proves malicious, it may result in unauthorized access to sensitive data or system control. Importantly, this detection does NOT confirm that any malicious activity has occurred on its own; further investigation is necessary to validate intent.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Check for Security Event ID  exec (Linux process creation) capturing the execution of gcc, focusing on fields like `Image` and `CommandLine` for patterns indicating potential abuse.

  - **Correlate with user activity:** Examine relevant user activity during the time of the alert, particularly checking for `sudo` or `su` commands from the same user to identify whether they had escalated privileges prior to the gcc execution.

  - **Assess for benign use cases:** Audit permissions and recent changes to environments where `gcc` is commonly utilized for legitimate development purposes, noting executables or scripts that may reference expected command lines without suspicious flags.

  - **Identify high-confidence malicious indicators:** Look for the invocation of shells through gcc where the command line contains flags like `-s` attached to various shells (e.g., `/bin/bash,-s`), especially run by users without development roles.

  - **Check for associated file changes:** Investigate creation or modification of script files (e.g., `/tmp/shellscript.sh`) which could indicate exploitation frameworks being executed post gcc invocation, validating unusual file paths and permissions.

  - **Validate host role and criticality:** Determine if gcc was executed on sensitive systems (e.g., production servers) where unauthorized shell access could lead to significant data breaches.

  ---

  ### Prioritization

  Given the potential to escalate privileges and execute arbitrary commands, alerts of this nature are critical, especially on production or sensitive systems. The likelihood of malicious abuse is high due to the common usage of `gcc` in both development and exploitation scenarios, making it a frequently weaponized tool.

  ---

  ### Blind Spots and Assumptions

  Detection may be circumvented by legitimate development activities that involve gcc usage, particularly if logged events are not retained or monitored closely. Dependencies on specific Linux distributions and their configurations are essential for accurate log collection. A relevant companion detection could include monitoring for script execution patterns that follow `gcc` usage, such as invoking typical shell commands that may indicate payload execution.

