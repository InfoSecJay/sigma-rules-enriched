title: Shell Execution GCC  - Linux
id: 9b5de532-a757-4d70-946c-1f3e44f48b4d
status: test
description: |
  Detects the use of the "gcc" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
- https://gtfobins.github.io/gtfobins/gcc/#shell
- https://gtfobins.github.io/gtfobins/c89/#shell
- https://gtfobins.github.io/gtfobins/c99/#shell
- https://www.elastic.co/guide/en/security/current/linux-restricted-shell-breakout-via-linux-binary-s.html
author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg 
  L.P.)
date: 2024-09-02
tags:
- attack.discovery
- attack.t1083
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image|endswith:
    - '/c89'
    - '/c99'
    - '/gcc'
    CommandLine|contains: '-wrapper'
  selection_cli:
    CommandLine|contains:
    - '/bin/bash,-s'
    - '/bin/dash,-s'
    - '/bin/fish,-s'
    - '/bin/sh,-s'
    - '/bin/zsh,-s'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the GCC compiler to execute shell commands, which may indicate attempts at privilege escalation or unauthorized command execution in a Linux environment. The likely objective of an attacker leveraging this behavior is to escape restricted shells or limited environments to gain broader command execution capabilities. This detection relates to the MITRE ATT&CK tactic "Discovery" (TA0007) and technique "Permission Groups Discovery" (T1083).

  The primary telemetry source is the process creation logs from Linux systems that capture command line execution. Log types should include `auditd` logs or `syslog` entries that detail process creation and command line arguments. If this behavior is malicious, it could compromise system integrity and potentially lead to unauthorized access to sensitive data or system-level operations. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; it merely identifies an anomalous use of GCC that requires further investigation.

  ### Investigation Steps

  - **Check command execution details:** Review process creation logs, specifically `auditd` entries (Event ID 32768) and `syslog`, filtering for entries where `Image` ends with `/gcc`, `/c89`, or `/c99`, and `CommandLine` contains `-wrapper` or shell commands. Look for command lines that invoke a shell with `-s` switching.

  - **Identify known benign usage:** Investigate historical usage of GCC on the affected system. If legitimate developers are using GCC to compile software, verify their command lines do not attempt to execute any shell with `-s`. Document typical valid processes for comparison.

  - **Correlate with user account activity:** Examine user account activity around the same time by extracting user login sessions or shell history (`~/.bash_history`) to establish context. Look for unusual users executing GCC or across multiple systems.

  - **Identify high-confidence malicious indicators:** Look for known bad command patterns in logs, specifically those that include sequences like `/bin/bash,-s` within the `CommandLine` field, indicating an attempt to spawn a shell directly.

  - **Decipher additional execution flags:** Cross-reference all commands that invoke GCC or its aliases to see if they utilize any flags indicative of shell access or redirect output, particularly `-o`, `-f`, or redirections to `/dev/null`.

  - **Check for follow-on activities:** Confirm if any further suspicious behavior followed the GCC execution. Investigate for any newly-created files or executables that could indicate a payload or additional persistence mechanisms on the system.

  ### Prioritization

  This alert should be treated with high severity due to the potential for system compromise if executed with malicious intent. The likelihood of malicious abuse is significant, particularly as enablement of shell access through GCC has been documented in various exploitation scenarios. Given its common usage in privilege escalation techniques, it is crucial to respond swiftly.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for skilled adversaries to spoof benign GCC usage or obfuscate shell access through alternate methods. Reliable detection may rely on enhanced logging configurations, including complete `auditd` rules capture for all processes and command line arguments. Be aware that legitimate developers may trigger this alert during software compilation tasks. Related detections that could strengthen coverage include monitoring for `.bash_history` modifications or additional subprocess creation patterns linked to unexpected user access.

