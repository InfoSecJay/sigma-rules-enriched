note: |
  ### Technical Context

  This Sigma rule detects the invocation of the "touch" command with parameters specifically aimed at modifying the timestamps of service files on Linux systems. Attackers may use this technique to alter timestamps of these files to obscure malicious activities, such as privilege escalation or service manipulation, thereby aiding in evasion from detection. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005) utilizing the **Indicator Removal on Host** technique (T1070.006).

  The primary telemetry sources are Linux process creation logs that contain information on executed commands. Specifically, this alert relies on process creation events that include the command utilized and its parameters. If executed by an unauthorized user or with unexpected arguments, this activity poses a security risk by potentially allowing attackers to mask their presence. It is important to note that this detection alone does not confirm malicious intent, as legitimate system administrators may use the "touch" command to update file timestamps legitimately.

  ### Investigation Steps

  - **Check Process Creation Events**: Review Linux process creation logs (e.g., `/var/log/syslog` or `/var/log/messages`) for processes with `Image` ending in `/touch` and `CommandLine` containing ' -t' and ending in '.service'. Look for Event IDs related to the execution of commands to identify baseline administrative activity.

  - **Verify User Context**: Identify the user account that executed the command. Legitimate administrators typically use service management commands or file timestamp adjustments. Abnormal accounts or users not associated with system maintenance should raise suspicion.

  - **Assess Related Files**: Examine the timestamp of the service file in question (`ls -l /path/to/.service`). If the timestamp has been modified recently and there’s no corresponding legitimate reason for the change, it could be indicative of malicious activity.

  - **Correlate with Other Logs**: Check for other related log artifacts, such as authentication logs (e.g., `/var/log/auth.log`) for any unauthorized access prior to the usage of the "touch" command. A pattern of suspicious logins followed by modifications could indicate a compromised account.

  - **Identify Evasion Patterns**: Look for patterns of multiple touch executions around the same time frame targeting different service files. This behavior can indicate an attempt to hide other malicious actions.

  ### Prioritization

  The severity of this alert is deemed medium given that it targets service files which are integral for system operation. While the likelihood of malicious abuse is significant, the presence of benign activity (such as legitimate timestamp updates by administrators) necessitates careful contextual analysis before escalation.

  ### Blind Spots and Assumptions

  Evasion techniques include legitimate administrative activity that may trigger this alert, such as system updates or service management tasks performed by authorized personnel. Ensuring comprehensive logging of all process creation events, including also auditing for unauthorized user activities, is essential for reliable detection. A companion detection, such as monitoring for changes in service configurations or creation of new service files, would enhance coverage and context for identifying potential compromise.

