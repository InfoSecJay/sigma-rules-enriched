note: |
  ### Technical Context

  This Sigma rule detects the invocation of the "touch" command with options that manipulate service files on Linux systems. This behavior often indicates an attempt to modify the timestamps of system or service files, potentially as part of an evasion tactic to hide file modifications or installation times. The likely attack objective is to obfuscate malicious activity related to service execution or maintenance. The relevant MITRE ATT&CK techniques include T1070.006 (Indicator Removal on Host: Clear Logs).

  Primary telemetry sources include system logs tracking process creation, specifically focusing on fields related to the command execution. If this behavior is malicious, the impact can range from unauthorized service manipulations to lateral movement in the network. Importantly, this detection alone does not confirm malicious intent as it could also be triggered by administrative actions.

  ### Investigation Steps

  - **Verify the command context:** Cross-reference the alert with System Process Creation logs (e.g., Syslog or auditd logs) for Event ID  execve, focusing on attributes such as parent process ID or user context to confirm the legitimacy of the action.
  - **Check user legitimacy:** Identify the user executing the command. If it is a system or application account (e.g., `root`, `systemd`), it might be benign, whereas execution by a non-privileged user could indicate malicious activity.
  - **Examine service file details:** Review the specific service file targeted by the "touch" command using `ls -l /path/to/.service` to assess last access and modification times, which may reveal suspicious timestamps indicative of tampering.
  - **Identify recent changes:** Look at the log entries in `journalctl` related to the affected service for unexpected stops or starts around the same time as the alert to correlate potential service manipulation with system behavior.
  - **Check for related indicators:** Investigate for additional signs of compromise, such as unauthorized service installations or changes (e.g., unexpected services listed via `systemctl list-units`), especially on critical assets.
  - **Assess normal administrative activities:** Consult change management records or known admin operations within the timeframe of the alert occurrence, noting typical commands that involve service modifications.

  ### Prioritization

  This alert is of medium severity due to the potential impact on system integrity and the likelihood of exploitation by advanced adversaries. The behavior is not commonly observed in legitimate use cases, elevating the risk of malicious activities associated with it.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of benign administrative actions that may inadvertently trigger the alert, such as scheduled maintenance tasks. Reliable detection requires proper logging configurations for process execution events and command tracking on Linux. The absence of context around a legitimate "touch" command execution may mask malicious intent, thus indicating a need for additional monitoring solutions like file integrity checks or change auditing mechanisms to strengthen coverage.

