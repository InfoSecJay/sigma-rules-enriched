  ### Technical Context

  This rule detects the execution of the "execve_hijack" payload commonly associated with the Triple Cross eBPF rootkit, a technique used by adversaries to elevate privileges covertly. The likely attacker objective is to gain unauthorized access to sensitive administrative functions by manipulating the Linux operating system's execution framework. This action aligns with the MITRE ATT&CK technique for privilege escalation (T1068) and defense evasion (T1203).

  The primary telemetry sources required for this detection include Linux process creation logs that capture command execution details, specifically focusing on events from the `sudo` command. The security impact of a successful exploitation could lead to full administrative access and control over compromised systems, enabling further malicious activities. Importantly, this detection does not confirm whether the execution resulted in a successful privilege escalation; it merely identifies that the potentially malicious command was invoked.

  ### Investigation Steps

  - **Verify process execution details:** Check Linux logs for `sudo` process creation events corresponding to Event ID 3600 (Linux Kernel process execution events). Specifically, look for a command line containing "execve_hijack" and note the parent process that initiated it.

  - **Identify parent process legitimacy:** Investigate the immediate parent process of the detected `sudo` execution to establish context. A legitimate parent process may indicate authorized activity (e.g., maintenance scripts), while an unusual or unexpected parent indicates potential malicious intent.

  - **Correlate timestamp with other events:** Evaluate system logs around the timestamp of the `execve_hijack` execution for related suspicious activities, such as unauthorized user logins or other unusual command executions.

  - **Check for eBPF artifacts:** Validate whether the expected eBPF traces or hooks are present on the system as a result of the rootkit’s operation, which may involve reviewing configurations under `/sys/kernel/debug/tracing/`.

  - **Collect additional forensic data:** Document any file creations or modifications associated with the invocation of the `execve_hijack`, looking for abnormal behavior or artifacts in `/tmp`, `/var/tmp`, or user home directories.

  ### Prioritization

  This alert is considered high severity due to the potential for significant impact on system integrity and administrative control when privilege escalation is exploited. The behavior detected is specific to advanced threats like rootkits, which are less frequent but highly impactful when successful.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if the rootkit employs evasion techniques such as process hiding. Legitimate administrative activities involving the `sudo` command may inadvertently trigger the alert, complicating investigations. Complementary detections focused on monitoring system calls or unusual eBPF activity can strengthen coverage against this type of threat.

