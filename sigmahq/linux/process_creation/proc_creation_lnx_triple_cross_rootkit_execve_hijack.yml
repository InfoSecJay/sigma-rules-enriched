  ### Technical Context

  This rule detects the execution of a file named "execve_hijack" invoked through the `sudo` command, indicating potential privilege escalation efforts by an attacker utilizing the Triple Cross eBPF rootkit. The likely objective is to elevate user privileges without detection, thus gaining unauthorized access to sensitive system resources. This activity maps to the MITRE ATT&CK framework under the tactic “Privilege Escalation” (TA0004) and technique “Exploitation for Client Execution” (T1203).

  Primary telemetry source involves Linux process creation logs, particularly focusing on command execution events tied to `sudo`. If malicious, such behavior could lead to compromised dependencies and the manipulation of system configurations or data. Importantly, this detection does NOT confirm that a successful privilege escalation or system compromise has occurred—further analysis is required to establish intent.

  ### Investigation Steps

  - **Inspect Process Creation Events:** Review process creation logs, specifically checking for Linux Event IDs associated with `sudo` execution (syslog, audit logs). Look for the command line containing 'execve_hijack'. This is indicative of suspicious behavior.

  - **Analyze Command-Line Arguments:** Check the command-line argument for the `sudo` command (fields like `command_line` or `args`). A typical benign use of `sudo` would not contain 'execve_hijack' and would be related to legitimate administrative tasks.

  - **Monitor for System Calls:** Review for related syscall logs that may indicate abnormal behavior linked to `execve`, particularly filtering for syscall events (e.g., `sys_enter_execve`). Look for deviations from normal execution patterns.

  - **Verify File Integrity:** Correlate with file integrity monitoring logs to confirm if 'execve_hijack' was newly created or modified (in auditd logs, look for relevant fields denoting file changes). Legitimate files shouldn’t unexpectedly change in critical directories.

  - **Check for Established Persistence:** Investigate if there's evidence of the rootkit maintaining persistence. Look for unusual startup scripts or services linked with 'execve_hijack' in system monitoring logs.

  - **Identify Malicious Indicators:** Establish high-confidence indicators such as presence of the `execve_hijack` binary in unexpected directories or unusual parent-child process relationships indicating potential chain of execution leading to privilege escalation.

  ### Prioritization

  This alert is high severity due to the potential impact on system integrity and security. The likelihood of malicious abuse is considerable; the behavior typically indicates an active attempt to escalate privileges, which is a common tactic used by attackers.

  ### Blind Spots and Assumptions

  Detection may be limited if the logs for process creation are not captured thoroughly or if logging configurations are incomplete. Adversaries may employ techniques to obfuscate execution (e.g., altered command structures). Additionally, legitimate activities such as administrative scripts or automated tasks could trigger this alert. A companion detection to consider includes monitoring for abnormal `sudo` command usage patterns elsewhere in the environment.

