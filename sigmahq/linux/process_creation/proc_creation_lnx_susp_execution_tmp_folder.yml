detection:
  selection:
    Image|startswith: '/tmp/'
  filter_optional_nextcloud:
    Image|endswith: '/usr/bin/nextcloud'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects execution of processes originating from the '/tmp/' directory on Linux systems, which could indicate potential malicious activity, including malware or unauthorized scripts being executed. Attackers commonly use the '/tmp/' folder to evade detection, as it is a writable directory accessible by many users and often less monitored. The likely attacker objective is to execute malicious payloads while avoiding scrutiny from security solutions.

  This behavior aligns with the MITRE ATT&CK technique T1036 (Masquerading). Primary telemetry sources include Linux process creation logs, specifically the `audit` logs, or Syslog entries capturing process creation events. If malicious, this activity may lead to data compromise, lateral movement, or persistence within the environment. It is crucial to note that this detection does NOT alone confirm malicious intent, as there could be legitimate use cases for executing processes from this directory.

  ### Investigation Steps

  - **Review process creation logs**: Examine Linux `audit` logs (Event ID placeholder: 2302) or Syslog messages for entries where `comm=` or `image=` starts with '/tmp/'. Look for unusual process names or unexpected execution times.

  - **Identify legitimate behavior**: Validate the execution of processes like `/usr/bin/nextcloud`. If the process is initiated by known users and corresponds to scheduled tasks or legitimate operations, it may be benign.

  - **Check parent process ID**: Investigate the parent process of any suspicious execution (PID from logs). Use `ps -p <PID>` to assess if it corresponds to legitimate applications or system activities.

  - **Correlate with user activity**: Verify the user account executing the process. A non-administrative user executing processes from '/tmp/' might indicate suspicious activity, especially if the user lacks appropriate permissions for those operations.

  - **Examine process command-line arguments**: Review command-line arguments from the creation logs. Malicious processes often contain obfuscation or suspicious parameters, unlike standard applications, which typically have clear and expected argument patterns.

  - **Investigate for persistence mechanisms**: Search for related artifacts, such as files created in `/etc/init.d/` or cron jobs referencing processes from '/tmp/'. Confirm whether these artifacts follow known configuration patterns or show signs of tampering.

  ### Prioritization

  This alert holds medium severity due to the potential impact on critical systems if an unauthorized execution originates from '/tmp/'. The likelihood of malicious abuse is moderately high, as this technique is commonly used in automated attacks. However, false positives may arise from legitimate applications using temporary files for expected functionality.

  ### Blind Spots and Assumptions

  Detection may be limited by lack of visibility into all processes, as some may evade logging through misconfiguration or custom solutions. Legitimate applications, particularly those that rely on temporary files (like installation scripts or data processing), may trigger this alert. Companion detections, such as monitoring for file changes in '/tmp/' or reviewing anomalies in audit log timestamps, can enhance overall coverage and context for threat analysis.

