logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|startswith: '/tmp/'
  filter_optional_nextcloud:
    Image|endswith: '/usr/bin/nextcloud'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the execution of processes originating from the '/tmp/' directory on Linux systems, which is often used by attackers for executing malicious scripts or binaries. The likely objective of the attacker is to bypass security safeguards by launching malicious code from a common temporary directory, which may indicate an attempt to establish persistence or execute further payloads. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1203) and the specific technique “Command-Line Interface” (T1059).

  The primary telemetry source for this detection is process creation logs on Linux, typically generated through system calls captured by tools like auditd or Syslog. If the detected execution is malicious, it could imply unauthorized access, data exfiltration, or lateral movement. It's crucial to note that this detection does NOT confirm whether the executed process is inherently malicious—it merely indicates a suspicious execution path.

  ### Investigation Steps

  - **Review process creation logs:** Examine the Syslog or auditd logs (e.g., syslog entries, AUDIT_EVENT_ID=EXECVE) for recent entries of processes executed from '/tmp/'. Look for unusual process names or commands, especially those not part of standard operations.

  - **Identify high-confidence malicious indicators:** Check for process executions from '/tmp/' that correspond to known malicious hashes or signatures, such as those linked to the GobRAT malware (referenced hashes can be checked against Threat Intelligence feeds).

  - **Validate legitimate usage:** Confirm expected application behaviors—such as legitimate installations that may temporarily use '/tmp/' for transient files (e.g., during updates). For instance, check if 'nextcloud' instances originate from a validated installation script rather than unauthorized executables.

  - **Inspect recent changes in the '/tmp/' folder:** Use file Integrity monitoring or listing commands (ls -la /tmp/) to identify files created or modified shortly before the alert. Analyze the timestamps for anomalies or frequent access.

  - **Correlate with user activity:** Examine user logs (e.g., bash history or login records) to understand if the process execution aligns with user logins or administrative actions. This can help identify whether a legitimate user or a potential compromise triggered the execution.

  - **Assess system role and context:** Determine if the host is critical or contains sensitive data (e.g., a web server) that could be attractive to attackers. This context can influence the urgency of the investigation.

  ### Prioritization

  Alerts of this nature have medium severity due to the potential impact if exploited in a critical system. The likelihood of malicious abuse is considered moderate, as processes originating from '/tmp/' can be indicative of both benign and malicious activity. However, given the frequent use of this technique by adversaries, prompt investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of alternate execution paths that evade this rule, such as legitimate processes running in truely temporary paths like '/var/tmp/' or hidden files. Ensure that all relevant process creation logging is correctly configured on Linux systems for effective detection. Moreover, legitimate applications that utilize temporary directories for legitimate purposes may trigger this alert, necessitating careful analysis of context. A companion detection to enhance coverage could involve monitoring for script executions that interact with files in '/tmp/' (e.g., via bash execution logs or script parser outputs).

