note: |
  ### Technical Context
  This detection rule identifies the execution of processes originating from the `/tmp/` directory on Linux systems, which can be indicative of suspicious or malicious activity. Attackers often utilize the `/tmp/` folder to execute malware, as it is commonly writable by all users and generally less monitored. Such behavior might be part of a broader tactic where attackers aim to establish persistence or execute payloads in a stealthy manner.

  An example of relevant threat activity is associated with malware like GobRAT, which has been documented to operate from temporary directories to avoid detection. The rule applies to the MITRE ATT&CK techniques such as **T1036 (Masquerading)**, where attackers disguise their malicious actions as legitimate processes, and it also falls under the **Defense Evasion** tactic, as the execution of files from `/tmp/` can sidestep typical security precautions.

  Primary data sources for this detection include Linux process creation logs, which provide insights into executed commands, their origins, and user contexts. Monitoring these logs will help to identify potentially harmful activities that may otherwise go unnoticed.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze logs for any processes starting in the `/tmp/` directory. Pay particular attention to command-line arguments for unusual patterns that may indicate malicious usage.
  - **Correlate with File Activity**: Check for file creation and modifications within the `/tmp/` directory leading up to the process creation, focusing on any compressed files or scripts that could be run as executables.
  - **Assess User Context**: Investigate the user who executed the process from `/tmp/`. Check for accounts that typically do not use this directory for execution or any unusual privilege escalation that may have occurred.
  - **Inspect Firewall Logs**: Review outbound traffic logs from affected hosts for communication attempts to external addresses that could correspond with known malicious IPs or command and control (C2) servers associated with malware like GobRAT.

  ### Prioritization
  This alert carries medium severity due to the potential risk associated with executing suspicious processes from temporary directories, which frequently serve as launch points for malware. The likelihood of encountering such tactics in a sophisticated attack is considerable, particularly in organizations lacking robust Linux monitoring solutions.

  ### Blind Spots and Assumptions
  The detection logic presumes that all malicious processes are executed from the `/tmp/` directory, potentially missing those utilizing other directories or methods of persistence. A gap exists in coverage for alerts involving processes executed from user-specific temporary directories or those masquerading under legitimate names within system directories. Proper logging configurations and permissions for process execution logs are required for this alert to generate actionable insights effectively.

