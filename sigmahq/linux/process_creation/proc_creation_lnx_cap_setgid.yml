- attack.t1548
- attack.t1554
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/setcap'
    CommandLine|contains: 'cap_setgid'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the 'setcap' utility to assign the 'setgid' capability to a binary file on Linux systems. The 'setgid' capability allows processes operated by non-privileged users to change their group ID to a value that would typically be restricted, potentially enabling malicious activity. Attackers could leverage this technique to manipulate binaries in ways that permit privilege escalation or unauthorized access, thereby compromising system security.

  In terms of MITRE ATT&CK framework, this behavior is associated with the tactics of **Privilege Escalation (TA0004)** and **Defense Evasion (TA0005)**. The specific techniques relevant to this detection include **T1548** (Abuse Elevation Control Mechanism) and **T1554** (Compromise Client Software Binary). This detection focuses primarily on monitoring process creation events that involve the 'setcap' utility, giving insight into potentially unauthorized alterations of file capabilities.

  The primary data sources vital for this detection include process creation logs, which will record instances of the 'setcap' utility being called. Additionally, examining filesystem changes to binaries can uncover unauthorized alterations that may indicate compromise.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs surrounding the execution of the 'setcap' command to identify the user context and timing of its execution for suspicious activities.
  - **Examine Command Line Arguments:** Inspect the command line parameters used with the 'setcap' command, focusing on any unusual group IDs (especially GID 0) being set that deviate from standard operational procedures.
  - **Audit Relevant Binaries:** Investigate the binaries that had 'setgid' capabilities set to ensure they have legitimate roles within the environment and check whether any known vulnerabilities could be exploited.
  - **Confirm User Privileges:** Validate the user accounts that invoked the 'setcap' command to ensure they possess the appropriate permissions. Look for anomalous user activity or accounts that should not have executed this command.

  ### Prioritization
  This alert is categorized as low severity due to the specific context required for the 'setcap' utility's misuse. However, while such activity on its own might not indicate an immediate threat, combined with other indicators of compromise, it could signify planning for privilege escalation or establishing persistence methods.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage regarding environments where logging for process creations may not be adequately configured, or where the 'setcap' utility is not commonly used. The detection logic assumes that adversarial use of the 'setcap' utility will not be masked by other legitimate processes or actions. This rule may also miss cases where attackers modify binaries directly rather than manipulating capability settings. It is essential to ensure that process creation logs are enabled and accurately configured to capture relevant actions for effective alerting.

