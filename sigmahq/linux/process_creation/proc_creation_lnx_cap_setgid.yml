note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of the `setcap` utility to assign the `setgid` capability (cap_setgid) to a binary file in a Linux environment. The primary attacker objective behind this behavior is to escalate privileges or establish persistence by enabling non-privileged processes to manipulate group IDs, potentially allowing access to sensitive actions normally restricted to privileged users. This detection is mapped to the MITRE ATT&CK technique "Setuid and Setgid" (T1548) and "Sudo and Sudo Caching" (T1554).

  The primary telemetry source is Linux process creation logs, specifically focusing on invocation events for the `setcap` command. If successful, this may lead to unauthorized privilege escalation, which could significantly impact the security posture of the affected system. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also involve setting capabilities on binaries.

  ---

  ### Investigation Steps

  - **Review process creation events:** Check for Security Event logs (Syslog) with the relevant command-line arguments. Look for Event IDs or logs that indicate the execution of `setcap`, especially with options that modify capabilities (e.g., `cap_setgid`).

  - **Identify the affected binaries:** Determine which binaries are being altered for capabilities by examining the logs for specific binary paths used with `setcap`. Analyze these binaries for unusual changes or unknown origins. Legitimate operation often includes common binaries located in `/usr/bin/` or `/usr/local/bin`.

  - **Assess known safe sources:** Validate that the modified binary comes from a trusted source and has an expected hash (e.g., using `sha256sum`) that matches known good baselines.

  - **Check for privilege escalation flags:** Focus on permissions and ownership of binaries that were modified. Specifically, investigate whether the GID set corresponds to root or sensitive groups, which would be a strong indicator of malicious intent.

  - **Correlate with other user actions:** Look for patterns of escalated privileges or suspicious commands executed by the user who performed the `setcap` action by examining logs for sudo or su usage (referencing `/var/log/auth.log` or `journalctl`).

  - **Document expected administrative actions:** Understand and outline legitimate usage scenarios for `setcap` in your environment, such as system-level configurations done by administrators, including attaching capabilities to system utilities for necessary reasons.

  ---

  ### Prioritization

  This alert should be treated as low severity under normal circumstances but requires context given its potential for exploitation. If the system affected is critical or contains sensitive functions, the threat level increases due to the possibility of privilege escalation by adversaries. The infrequent yet targeted use of `setcap` can signify planning for lateral movements or backdoors.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the configuration of logging on Linux systems; comprehensive process creation logs must be enabled for accurate detection. Adversaries may employ additional evasion techniques, such as clearing logs or modifying timestamps. It's essential to recognize that legitimate administrative actions like setting privileges on shared binaries or system utilities may trigger this alert. A related detection that could enhance coverage is monitoring for the execution of the command `getcap`, which could identify previously set capabilities.

