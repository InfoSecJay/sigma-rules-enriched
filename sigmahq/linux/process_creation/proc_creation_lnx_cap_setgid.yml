note: |
  ### Technical Context

  This rule detects the use of the 'setcap' utility to assign the 'setgid' capability to a binary file on Linux systems. This capability allows a non-privileged process to manipulate group IDs (GIDs), potentially elevating privileges, such as changing the GID to 0 (root group). The likely attacker objective is to backdoor a binary for future privilege escalation, which can facilitate further exploitation of the system.

  The relevant MITRE ATT&CK tactics include **Privilege Escalation** (TA0004) and **Persistence** (TA0003), particularly techniques **T1548** (Abuse Elevation Control Mechanism) and **T1554** (Compromised Account). Primary telemetry sources consist of Linux process creation logs where 'setcap' usage is recorded, specifically looking for entries that include Event IDs related to process creation. If malicious, this activity can lead to unauthorized elevated access and persistence. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate system administration activities may also utilize the 'setcap' utility.

  ### Investigation Steps

  - **Check process creation logs for 'setcap' usage:** Analyze logs for Event IDs related to process creation during the relevant timeframe. Look specifically for command lines containing 'cap_setgid' to identify any instances of 'setcap' execution.

  - **Verify the target binary for 'setgid' capabilities:** Use the command `getcap <binary_path>` to check if the affected binary has the 'setgid' capability set. A legitimate service may use this capability, so confirm whether this is expected for the application.

  - **Assess user context and permissions:** Review the effective user and group IDs of the process that invoked 'setcap'. If the user is non-privileged but setting the capability, this raises suspicion.

  - **Correlate with other activity logs for anomalies:** Cross-reference with other logs (e.g., sudo logs via `/var/log/auth.log` or syslog) to determine if any escalations or suspicious behavior occurred around the same time, indicating malicious intent.

  - **Investigate the history of the binary:** Use the command `ls -l <binary_path>` and check for modification timestamps and ownership. Look for unusual updates or ownership changes that do not correlate with standard maintenance windows.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of privilege escalation and the serious implications of unauthorized access. While not always indicative of malicious behavior, the use of 'setcap' in ways that deviate from standard operational procedures increases the likelihood of abuse in an enterprise context.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete process creation logs if logging is not correctly configured on Linux systems. Legitimate administrative actions might provoke alerts, so context is crucial in assessing true threats. Additionally, adversaries may attempt to evade detection by executing 'setcap' from a legitimate binary or through scripted processes. A companion detection to enhance coverage is monitoring for unexpected binary modifications or unrecognized binaries attempting to execute 'setcap'.

