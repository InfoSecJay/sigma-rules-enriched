logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/setcap'
    CommandLine|contains: 'cap_setgid'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  The rule detects the execution of the `setcap` utility to set the 'setgid' capability on a binary file. This behavior allows non-privileged processes to manipulate their group IDs (GIDs), potentially enabling privilege escalation for attackers who exploit it. The likely attacker objective is to backdoor binaries, allowing them future access as higher-privilege users without raising immediate alarms.

  This detection relates to the MITRE ATT&CK technique for Privilege Escalation (T1548) and Defense Evasion (T1554). The primary telemetry sources include process creation logs from Linux, specifically monitoring executions of the `setcap` command, along with command line arguments that include `cap_setgid`. If malicious, this could lead to unauthorized access or persistent threats. It is important to note that this detection does NOT confirm intent or success of privilege escalation on its own.

  ### Investigation Steps

  - **Verify the execution of the 'setcap' command:** Review Linux process creation logs, specifically looking for entries with Event ID 100 (process creation) that contain the command line with 'setcap' and 'cap_setgid'. This may indicate an attempt to modify group privileges.

  - **Check the target binary's permissions:** Correlate the identified command execution with the file permissions and capabilities on the affected binary using `getcap <binary_path>`. Confirm if the 'setgid' capability has been set, which can indicate a potential compromise.

  - **Determine the context of the binary:** Identify who owns the binary and its purpose. For critical binaries, such as system daemons or those with SUID/SGID attributes, any change in capabilities should be escalated and investigated thoroughly.

  - **Assess legitimate usage patterns:** Investigate any known and approved applications or scripts that utilize the `setcap` command for necessary operations, such as allowing limited capabilities to a trusted service. Document these exceptions.

  - **Identify known malicious indicators:** Look for unusual patterns or additional suspicious commands executed in conjunction with `setcap`, such as `chmod` on binaries concurrently or access to sensitive system files.

  - **Review system logs for related activities:** Search system logs (e.g., `/var/log/auth.log` or `/var/log/syslog`) for other activities around the same time as the detection, such as unauthorized access attempts or system calls originating from unexpected user accounts.

  ### Prioritization

  The alert is considered low severity in the enterprise context due to its potential for benign usage, but it should be treated as significant if detected against critical systems or binaries. While this behavior may not be common, it has a clear potential for abuse by malicious actors to escalate privileges when needed. Monitoring should maintain focus on high-risk assets.

  ### Blind Spots and Assumptions

  Detection may be limited by users who have legitimate administrative control and use `setcap` for valid work purposes, which could create false positives. Ensure that the audit for command executions and binary capability settings is configured correctly to capture necessary logs. Other potential benign activities include software installations that require capability adjustments. Further companion detections could include monitoring for the use of `getcap` commands immediately following the `setcap` execution to reveal attempts to verify capability modifications.

