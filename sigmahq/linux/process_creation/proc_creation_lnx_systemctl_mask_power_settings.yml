title: Mask System Power Settings Via Systemctl
id: c172b7b5-f3a1-4af2-90b7-822c63df86cb
status: experimental
description: |
  Detects the use of systemctl mask to disable system power management targets such as suspend, hibernate, or hybrid sleep.
  Adversaries may mask these targets to prevent a system from entering sleep or shutdown states, ensuring their malicious processes remain active and uninterrupted.
  This behavior can be associated with persistence or defense evasion, as it impairs normal system power operations to maintain long-term access or avoid termination of malicious activity.
author: Milad Cheraghi, Nasreddine Bencherchali
date: 2025-10-17
references:
- https://www.man7.org/linux/man-pages/man1/systemctl.1.html
- https://linux-audit.com/systemd/faq/what-is-the-difference-between-systemctl-disable-and-systemctl-mask/
tags:
- attack.persistence
- attack.impact
- attack.t1653
logsource:
  category: process_creation
  product: linux
detection:
  selection_systemctl:
    Image|endswith: '/systemctl'
    CommandLine|contains: ' mask'
  selection_power_options:
    CommandLine|contains:
    - 'suspend.target'
    - 'hibernate.target'
    - 'hybrid-sleep.target'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the use of the `systemctl mask` command to disable system power management targets, specifically targeting mechanisms that control system sleep states such as suspend, hibernate, or hybrid sleep. Adversaries aim to maintain persistent access and avoid disruptions in malicious activities by preventing the operating system from entering low-power states. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) through the technique T1653, which focuses on impairing normal operational processes.

  The primary telemetry source for this detection is the log of process creations on Linux systems that includes executed command lines. Logs from the system's audit framework should capture these events. If malicious, such actions can hinder system management and operational security, allowing malicious processes to run uninterrupted. However, this detection does NOT confirm active compromise or malicious intent by itself and should always be contextualized with other investigative findings.

  ### Investigation Steps

  - **Review recent command execution:** Check command history in `/var/log/auth.log` or user-specific shell history files for any instance of `systemctl mask`. Look for commands containing `mask` paired with power targets (`suspend.target`, `hibernate.target`, or `hybrid-sleep.target`).

  - **Validate command execution:** Cross-reference the command in process creation logs (e.g., Syslog or audit logs) using Syslog Event ID or relevant audit log types to ensure that the command had actually been executed. Confirm the user context and time of execution.

  - **Investigate affected services:** Verify the current status of power targets using `systemctl status suspend.target`, `systemctl status hibernate.target`, and `systemctl status hybrid-sleep.target`. These should typically show as "loaded" or "active" unless directed otherwise by malicious actions.

  - **Assess system stability:** Look for abnormal behavior of legitimate applications that rely on power management features over the last 24-48 hours. Review performance metrics and system logs (e.g., dmesg or journalctl) for anomalies or frequent wake-ups that should occur normally.

  - **Identify known malicious user actions:** Analyze user account activities for prior evidence of suspicious behavior, such as user privilege escalation or frequent access to sensitive resources. Malicious actors often exhibit behavioral patterns that differ from legitimate users.

  ### Prioritization

  This alert is high severity due to its potential impact on critical systems where uptime and operational stability are essential. The likelihood of malicious abuse is significant, as disabling power management directly undermines system security measures. This behavior is also commonly weaponized by adversaries seeking to maintain persistence on compromised systems.

  ### Blind Spots and Assumptions

  There are limitations to this detection as legitimate administrative actions may also result in similar command usage during maintenance or configuration. Continuous activities or specific legitimate applications that manage power settings may inadvertently trigger the alert. Reliable detection requires proper logging configurations, including enabling audit logs for process creation. Other related detections, such as monitoring unauthorized user privilege escalation attempts (e.g., using sudo), can provide additional context and coverage against these tactics.

