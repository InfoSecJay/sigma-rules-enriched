title: Mask System Power Settings Via Systemctl
id: c172b7b5-f3a1-4af2-90b7-822c63df86cb
status: experimental
description: |
  Detects the use of systemctl mask to disable system power management targets such as suspend, hibernate, or hybrid sleep.
  Adversaries may mask these targets to prevent a system from entering sleep or shutdown states, ensuring their malicious processes remain active and uninterrupted.
  This behavior can be associated with persistence or defense evasion, as it impairs normal system power operations to maintain long-term access or avoid termination of malicious activity.
author: Milad Cheraghi, Nasreddine Bencherchali
date: 2025-10-17
references:
- https://www.man7.org/linux/man-pages/man1/systemctl.1.html
- https://linux-audit.com/systemd/faq/what-is-the-difference-between-systemctl-disable-and-systemctl-mask/
tags:
- attack.persistence
- attack.impact
- attack.t1653
logsource:
  category: process_creation
  product: linux
detection:
  selection_systemctl:
    Image|endswith: '/systemctl'
    CommandLine|contains: ' mask'
  selection_power_options:
    CommandLine|contains:
    - 'suspend.target'
    - 'hibernate.target'
    - 'hybrid-sleep.target'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the `systemctl mask` command to disable system power management targets, such as suspend, hibernate, or hybrid sleep, on Linux systems. Malicious actors may employ this technique to prevent systems from entering low-power states, which could disrupt their ongoing activities or provide a stealthier operational environment. By masking these targets, attackers can ensure that their processes remain active and are less likely to be interrupted, thus gaining persistence or achieving defense evasion.

  This behavior aligns with the **MITRE ATT&CK framework**, specifically under the tactic of **Persistence (T1547)**, where adversaries seek to maintain their foothold in a system. The related technique **Masking (T1653)** is explicitly identified as it involves modifying system settings to avoid detection or termination. The primary data sources needed to effectively detect this activity include process creation logs that capture command-line arguments executed on the system, particularly those relevant to `systemctl`.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for entries that show the execution of `systemctl` with command line arguments that include ‘mask’. This helps identify when and how masking is applied to power management targets.
  - **Analyze Command Arguments:** Check for command lines that reference `suspend.target`, `hibernate.target`, or `hybrid-sleep.target`. This indicates specific actions taken that impact system power management.
  - **Correlate with User Activity:** Investigate the user context under which the command was executed. Unusual users or times may indicate malicious intent, and further analysis of user credentials will be essential.
  - **Investigate System Changes:** Look for any changes in the system state after the command execution. Validate whether power management functions are indeed disabled and correlate with any other reported suspicious behavior.

  ### Prioritization
  Given the potential impact of this alert, it is classified as high severity in an enterprise environment. The ability of an attacker to manipulate essential system functions such as power management poses a significant risk, as it can facilitate extended access and control over compromised systems.

  ### Blind Spots and Assumptions
  This detection relies primarily on process creation logs, meaning if an attacker utilizes alternative methods or tools for process implementation that do not generate similar logs, this rule may not trigger. There is an assumption that logging is appropriately configured to capture command-line arguments, which is essential for detecting this behavior. Additionally, environments with specific operational requirements that legitimately mask power targets may lead to false negatives if not addressed in the detection logic.

