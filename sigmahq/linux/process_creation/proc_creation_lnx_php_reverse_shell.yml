title: Potential PHP Reverse Shell
id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
status: test
description: |
  Detects usage of the PHP CLI with the "-r" flag which allows it to run inline PHP code. The rule looks for calls to the "fsockopen" function which allows the creation of sockets.
  Attackers often leverage this in combination with functions such as "exec" or "fopen" to initiate a reverse shell connection.
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: '@d4ns4n_'
date: 2023-04-07
tags:
- attack.execution
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|contains: '/php'
    CommandLine|contains|all:
    - ' -r '
    - 'fsockopen'
    CommandLine|contains:
    - 'ash'
    - 'bash'
    - 'bsh'
    - 'csh'
    - 'ksh'
    - 'pdksh'
    - 'sh'
    - 'tcsh'
    - 'zsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the PHP command-line interface (CLI) with the `-r` flag, which allows attackers to execute inline PHP code. The detection focuses on the call to the `fsockopen` function, commonly utilized by threat actors to establish a reverse shell connection to a remote server. The scenario indicates a potential compromise where an attacker seeks to maintain persistent access to the environment or exfiltrate data without being easily detected.

  The likely objective of an attacker using this method is to establish a remote shell to execute further commands, manipulate files, or exfiltrate sensitive data from the compromised system. Notable MITRE ATT&CK tactics and techniques associated with this detection include:
  - **Execution** (TA0002) – The overarching tactic when executing arbitrary commands or scripts in the environment.
  - **Command-Line Interface** (T1059.003) – Specifically for the execution of commands through scripting languages like PHP.

  Primary data sources for this detection include process creation logs, which will provide insights into command-line activities of processes launched in a Linux environment.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for any instances of PHP being executed with the `-r` flag along with the `fsockopen` function. Document the command-line parameters used and the user who initiated the process.
  - **Analyze Network Connections:** Investigate outgoing network connections established by the PHP process. Look for connections to unusual or unfamiliar IP addresses, especially those not associated with standard organizational resources.
  - **Correlate with User Activity Logs:** Check for any recent user logins or activity that coincide with the process creation logs. Pay attention to any privileged user accounts that may have been used during the timeframe of the detected activity.
  - **Inspect System File Integrity:** Assess the integrity of critical files and configurations on the host. Check for unauthorized modifications or the presence of unexpected PHP scripts that could be indicative of a compromised environment.

  ### Prioritization
  This alert is classified as high severity due to the significant risk associated with reverse shell activities, which can lead to complete system compromise, data exfiltration, and lateral movement within the network. The likelihood of this being used in active attacks necessitates prompt investigation.

  ### Blind Spots and Assumptions
  The detection coverage may be limited if PHP is not routinely used or monitored in the environment, resulting in potential missed detections for legitimate usage that can be mistaken for malicious activity. Additionally, this detection assumes that the process creation logs are fully and correctly captured; any gaps in logging can hinder the effectiveness of this rule. Proper logging configurations for process creation should be ensured to support the effective functioning of this detection.

