title: Potential PHP Reverse Shell
id: c6714a24-d7d5-4283-a36b-3ffd091d5f7e
status: test
description: |
  Detects usage of the PHP CLI with the "-r" flag which allows it to run inline PHP code. The rule looks for calls to the "fsockopen" function which allows the creation of sockets.
  Attackers often leverage this in combination with functions such as "exec" or "fopen" to initiate a reverse shell connection.
references:
- https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
- https://www.revshells.com/
author: '@d4ns4n_'
date: 2023-04-07
tags:
- attack.execution
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|contains: '/php'
    CommandLine|contains|all:
    - ' -r '
    - 'fsockopen'
    CommandLine|contains:
    - 'ash'
    - 'bash'
    - 'bsh'
    - 'csh'
    - 'ksh'
    - 'pdksh'
    - 'sh'
    - 'tcsh'
    - 'zsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the invocation of the PHP CLI with the `-r` flag to execute inline PHP code that includes calls to `fsockopen`, a function commonly used by attackers to establish outbound socket connections, potentially signaling the start of a reverse shell. The likely attacker objective is to gain unauthorized access to the system for exfiltration or lateral movement. This behavior is relevant to the MITRE ATT&CK technique T1203 (Exploitation for Client Execution).

  The primary telemetry source is process creation logs from Linux systems, specifically observing command-line arguments for any use of the PHP interpreter. If malicious, this activity can allow an attacker to remotely control the system. However, it is critical to note that this detection does NOT confirm that the reverse shell was successfully established or executed without additional context.

  ### Investigation Steps

  - **Review the command line details:** Examine the process creation logs for Security Event ID 1133 and look for the `CommandLine` field containing both `-r` and `fsockopen`. If present without legitimate context, this is a strong indicator of malicious intent.

  - **Validate the PHP execution context:** Check the `Image` field to confirm that the detected command is indeed related to `/usr/bin/php` alongside common shell invocations like `bash` or `sh`. Know that legitimate use (i.e., scheduled tasks/scripts) will typically not execute `fsockopen` in this manner.

  - **Correlate network activity:** Investigate outgoing connections on the host with `netstat` or `ss` commands. Look specifically for unusual outbound connections made by the PHP process to external IP addresses or domains that do not resolve to known entities.

  - **Identify process parentage:** Analyze the parent process ID (PPID) for the PHP execution. If it is a legitimate scheduled task or cron job, this may indicate benign behavior; suspicious parent processes deserve further review.

  - **Check for file artifacts:** Look for temporary files that may have been created or modified in `/tmp` or `/var/tmp`. These may contain the payload or scripts used by an attacker in conjunction with the reverse shell.

  - **Determine asset criticality:** If the PHP process executed on a server hosting sensitive data or a public-facing service (like a web server), prioritize this alert higher due to the potential impact of the compromise.

  ### Prioritization

  This alert is of high severity due to the potential for significant impact on critical systems, especially on publicly facing servers where the execution of a reverse shell could lead to data exfiltration or further compromise. The likelihood of malicious abuse is high, as attackers commonly employ reverse shells in their operations.

  ### Blind Spots and Assumptions

  The detection may be limited by instances of legitimate PHP usage for web applications or cron jobs that might legitimately use `fsockopen`. Ensuring thorough logging from process creation and outbound network connections is essential for reliable detection. Valid interactions that could trigger this alert include scheduled scripts that require network access. A related detection for additional coverage involves monitoring for unexpected network traffic patterns from the same host following the execution of PHP commands.

