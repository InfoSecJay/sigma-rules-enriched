note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of PHP scripts using the command line interface with the `-r` flag, particularly when it involves the `fsockopen` function. This behavior is often indicative of an attacker attempting to establish a reverse shell connection, allowing remote code execution on the target system. The relevant MITRE ATT&CK tactic is **Execution** (TA0002) and the technique of **Command-Line Interface** (T1059.004).

  Primary telemetry sources include process creation logs from Linux systems, specifically identifying processes running the PHP binary with indications of socket connection attempts. If this behavior is malicious, it could result in unauthorized access to the system and potential exfiltration of sensitive data. However, this detection alone does not confirm the presence of an active reverse shell or malicious intent, as legitimate use of PHP for scripting with the `-r` flag may exist.

  ---

  ### Investigation Steps

  - **Review process creation logs:** Investigate Linux process creation logs for Event IDs that show execution of PHP (e.g., `/usr/bin/php`), specifically focusing on entries containing `-r` and `fsockopen`. Key fields to confirm include `CommandLine` and `Image`.

  - **Cross-reference with user activity:** Check the context of the user executing the command to determine if the process execution aligns with authorized administrative tasks. Use `w` or `who` commands to confirm anticipated user activity.

  - **Analyze network connections:** Check for outbound connections originating from the PHP process, particularly to unusual or suspicious IP addresses or ports. Use netstat or similar commands to confirm connections.

  - **Identify malicious indicators:** Look for high-confidence indicators like the presence of known bad IP addresses in the destination field. Consult threat intelligence databases or relevant community resources for lists of IPs associated with reverse shell activities.

  - **Assess shell execution:** If commands like `exec`, `fopen`, or any variant shell invocation (like `bash` or `sh`) are logged in conjunction with the PHP command, this increases the likelihood of malicious activity. Document any high-risk shell behavior.

  - **Benchmark expected behavior:** Compare detected activity against legitimate PHP scripts executed via CLI for routine tasks, such as cron jobs or valid administrative functions. Long-running PHP processes with unusual arguments may necessitate deeper investigation.

  ---

  ### Prioritization

  This alert is of high severity due to the potential for remote code execution and the ability of the affected system to act as a launchpad for further attacks. The likelihood of malicious exploitation hinges on the presence of the `fsockopen` functions in conjunction with command flags commonly associated with reverse shells.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by adversarial evasion techniques, such as encoding PHP commands or altering the execution environment to disguise malicious intent. Reliable detection requires comprehensive logging configurations across all Linux systems, ensuring command-line inputs are captured fully. Legitimate administrative tasks, like scheduled PHP scripts for maintenance or monitoring, may trigger this alert. Additional coverage can be strengthened by monitoring for indicators of process creation anomalies or commands executed via cron jobs.

