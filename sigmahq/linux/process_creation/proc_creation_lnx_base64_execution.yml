logsource:
  product: linux
  category: process_creation
detection:
  selection_base64:
    CommandLine|contains: 'base64 '
  selection_exec:
  - CommandLine|contains:
    - '| bash '
    - '| sh '
    - '|bash '
    - '|sh '
  - CommandLine|endswith:
    - ' |sh'
    - '| bash'
    - '| sh'
    - '|bash'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context
  This rule is designed to detect suspicious activity involving Linux command execution where base64 encoded commands are piped to a shell (bash or sh). Attackers often use this technique to obfuscate malicious commands and evade detection mechanisms, as the command itself may not appear malicious until decoded. The detected scenario could indicate an attempted compromise, where an attacker is executing payloads or performing actions on a compromised system with the intention to escalate privileges, deploy malware, or exfiltrate data.

  The relevant MITRE ATT&CK techniques include **Defense Evasion (T1140)**, where attackers attempt to mask their actions to avoid detection, and **Command and Control (T1071)**, particularly for the manipulation of existing channels. These techniques indicate that the presence of such command patterns could signify nefarious activity, emphasizing the need for analysts to remain vigilant.

  Primary data sources for this detection include process creation logs from the Linux operating system, which provide insights into command line executions. Log sources should ensure they capture sufficient detail to include command line arguments, as these provide the context for the execution patterns being analyzed.

  ### Investigation Steps
  - **Review Process Creation Logs:** Gather and analyze logs for process creation events that show command lines containing 'base64' and associated piping to bash or sh. Look for suspicious timestamps and correlate with other activity.

  - **Examine Nearby Activity:** Investigate other processes spawned around the same time to identify patterns or related commands that might indicate wider attacker behavior, such as file modifications or network connections.

  - **Cross-Reference User Activity:** Identify the user and their usual behavior to discern whether the activity fits their profile. Investigate whether the command might be a legitimate administrative task or a result of a potential compromise.

  - **Check for Additional Indicators of Compromise (IoCs):** Look for other typical artifacts of compromise associated with this technique. This could include indicators related to specific threat actors or known malware patterns in the network traffic or system behaviors.

  ### Prioritization
  The alert has a medium severity level because utilizing base64 encoding in command execution is a common technique employed by attackers looking to evade detection. While this may sometimes be used in legitimate scenarios, the context surrounding its use and the potential damage of unauthorized command execution necessitates elevated attention from security teams.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage regarding legitimate administrative tasks that could also use similar command structures, leading to false positives. The detection logic assumes that base64 encoding will not be a routine part of benign command executions that are pertinent to system maintenance. This detection relies on process creation logs being adequately configured to capture detailed command line arguments, including extended logging capabilities within the Linux OS to ensure that commands can be accurately correlated with user and system behaviors.

