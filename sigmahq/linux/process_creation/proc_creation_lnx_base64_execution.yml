note: |
  ### Technical Context

  This Sigma rule detects the execution of processes in Linux that utilize base64 encoded input piped to shell commands like `bash` or `sh`. This behavior is often indicative of attempts to obfuscate malicious payloads, as attackers may use base64 encoding to disguise command execution. The likely objective of the attacker is to execute arbitrary commands or payloads, potentially leading to further system compromise or lateral movement.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002) and specifically the technique **Command and Scripting Interpreter: Unix Shell** (T1059.004). Primary telemetry sources include Linux process creation logs that display command line arguments, specifically those containing the `CommandLine` field. If exploited maliciously, this type of activity could lead to complete system takeover. However, it’s important to note that this detection does NOT confirm malicious intent on its own, as legitimate system administration tasks may utilize similar techniques for valid purposes.

  ### Investigation Steps

  - **Review process command line arguments:** Check for Event IDs related to process creation, specifically `auditd` logs or `/var/log/secure`. Look for any instances of `base64` together with `bash` or `sh`. Malicious examples will often contain suspicious domain names or scripts that are not standard operations.

  - **Verify the parent process:** Cross-reference the `ppid` (parent process ID) from the process creation logs. Legitimate commands are often spawned from known processes (e.g., admin user ID, `ssh`). Any unusual parent processes can indicate an attack.

  - **Assess user account activity:** Look at authentication logs (`/var/log/auth.log` or relevant `auditd` logs) for any suspicious user accounts executing these commands. Activities from non-administrative privilege accounts can indicate compromise.

  - **Identify base64 payload length and content:** Review the base64 encoded payload. Check for unusually long strings or strings that decode to known malicious commands or scripts. This can be done by decoding the input and analyzing the output.

  - **Check for scheduled tasks or persistence mechanisms:** Investigate if any cron jobs or systemd units have been modified to include malicious payloads. Look for entries in `/etc/crontab`, `/var/spool/cron/`, or systemd service definitions that reference shell commands with base64 content.

  ### Prioritization

  This alert should be considered of medium priority due to the potential impact on system integrity and the likelihood of being used by attackers for malicious objectives. While it does not confirm compromise on its own, the usage of obfuscated command execution patterns is commonly weaponized in real-world attacks and warrants swift investigation.

  ### Blind Spots and Assumptions

  This detection can be limited by evasion techniques such as the use of non-standard encoding methods or alternative shell execution methods that do not utilize piping. Reliable detection requires comprehensive logging configurations, such as enabling `auditd` for process creations. Legitimate administrative tasks may trigger this alert, especially during script execution. It is advisable to enhance coverage with additional detection for suspicious command-line activities or unusual network connections initiated from processes invoking base64 commands to strengthen context.

