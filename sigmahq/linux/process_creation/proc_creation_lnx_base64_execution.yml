detection:
  selection_base64:
    CommandLine|contains: 'base64 '
  selection_exec:
  - CommandLine|contains:
    - '| bash '
    - '| sh '
    - '|bash '
    - '|sh '
  - CommandLine|endswith:
    - ' |sh'
    - '| bash'
    - '| sh'
    - '|bash'
  condition: all of selection_*
falsepositives:
- Legitimate administration activities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of shell commands that use base64 encoded payloads piped to a shell interpreter, which is a common behavior associated with obfuscation techniques used by attackers to evade detection. The likely objective behind this behavior is to execute malicious scripts or commands while masking the actual content from security monitoring tools. This activity maps to the MITRE ATT&CK tactic for Defense Evasion, specifically Technique T1140 (Obfuscated Files or Information).

  The primary telemetry sources for this detection are Linux process creation logs, specifically monitoring the CommandLine fields in process creation events. The security impact of such activity could be significant, as code execution via obfuscated commands can lead to system compromises, data exfiltration, or lateral movement within the network. However, it is essential to note that this detection does not confirm that the command executed was malicious; it merely indicates that an obfuscated command was initiated.

  ### Investigation Steps

  - **Examine the process command line:** Refer to the `/proc/[PID]/cmdline` or search for matching processes via `ps -aux | grep [process name]`. Check for base64 encoded strings and how they are piped to `bash` or `sh`.

  - **Review historical process execution data:** Use Syslog or audit logs (e.g., `auditd` logs) for Event ID 121. Look for similar patterns of encoded command executions occurring around the same time to identify any repeat offenders or patterns.

  - **Identify legitimate usage patterns:** Investigate common administrative tasks on this system. If the command execution involves known scripts or administrative activities using base64 encoding for legitimate configurations, note this as benign.

  - **Corroborate with network activity:** Check for related outbound connections or suspicious payload delivery using network logs (e.g., `iptables` logs, `tcpdump`). Look for anomalies, such as unexpected external destinations following the detected command execution.

  - **Check for known indicators of compromise:** Compare hashes of the downloaded scripts (if available) against threat intelligence databases to identify known malicious signatures.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on the affected Linux system, where compromise could lead to data breaches or further malware propagation. The likelihood of malicious use is heightened as such techniques are common among adversaries focusing on evading detection while executing payloads.

  ### Blind Spots and Assumptions

  Detection may be limited by the encoding methods used (e.g., different encoding techniques may not be captured). Necessary log sources include comprehensive process creation logging and adequate auditing configurations across Linux systems for effective behavior detection. Legitimate system administration or automation routines, which might legitimately use base64 encoding, could falsely trigger this alert. A related detection to enhance coverage is monitoring for suspicious network activity associated with known command and control (C2) behavior.

