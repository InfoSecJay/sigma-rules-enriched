note: |
  ### Technical Context

  This Sigma rule detects the execution of the 'doas' command on Linux systems, a utility that allows users to perform tasks with elevated privileges similarly to 'sudo'. The likely attacker objective is privilege escalation, enabling unauthorized access to sensitive system resources or data. This behavior falls under the MITRE ATT&CK tactic of Privilege Escalation (TA0004), specifically the technique T1548 (Abuse Elevation Control Mechanism).

  Primary telemetry sources include process creation logs from Linux system events, with the essential log type being Syslog or audit logs capturing command execution. The security impact of successful privilege escalation could lead to unauthorized user actions and compromise of sensitive system components. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate users may execute 'doas' for valid administrative purposes.

  ### Investigation Steps

  - **Review process execution logs:** Examine Syslog or audit logs for Event ID showing 'doas' execution. Validate the command line arguments for unusual parameters or targets.
  - **Identify user context:** Check which user executed the 'doas' command and their role. Legitimate administrative tasks should stem from known administrative users or processes.
  - **Correlate with other elevation attempts:** Analyze for additional SYSLOG entries around the same timeframe for other privilege escalation methods used by the same user. Look for entries involving 'sudo' or man pages.
  - **Verify system activity:** Confirm if the elevated command initiated any critical system changes, such as modifying user accounts or altering system files (check for /etc/passwd or /etc/shadow modifications).
  - **Investigate recurring patterns:** If multiple 'doas' invocations are logged from the same user within a short period, scrutinize whether this behavior aligns with their past activity profiles.
  - **Monitor for external signals:** Check for any other processes spawned via 'doas' execution that may indicate lateral movement or further exploitation attempts on the host.

  ### Prioritization

  The alert is considered low severity; while it indicates a potential privilege escalation attempt, the impact is contingent upon the user context and command executed. This behavior may be weaponized in advanced persistent threat scenarios, but benign use cases by administrators are common, requiring careful analysis.

  ### Blind Spots and Assumptions

  Detection may miss 'doas' executions if logs are not properly configured to capture such events. Administrators executing 'doas' for legitimate purposes can trigger alerts, leading to potential false positives. A related detection like monitoring 'sudo' command usage could complement this coverage and provide a clearer picture of privilege escalation attempts on the system.

