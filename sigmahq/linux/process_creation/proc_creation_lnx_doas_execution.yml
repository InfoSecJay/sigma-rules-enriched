  ---

  ### Technical Context

  This Sigma rule detects the execution of the `doas` command, a utility that allows standard users to execute commands with root privileges in a manner similar to `sudo`. The likely attacker objective includes privilege escalation to obtain unauthorized access or control over system resources. This activity aligns with the MITRE ATT&CK tactic of "Privilege Escalation" (TA0004) using the technique of "Sudo and Doas" (T1548).

  The primary telemetry source for this detection is Linux process creation logs, specifically looking for instances where the executed image ends with `/doas`. If malicious, this behavior could lead to unauthorized system changes or access to sensitive data. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative tasks may also utilize `doas`.

  ---

  ### Investigation Steps

  - **Verify the user executing the command:** Check process creation logs (e.g., `/var/log/auth.log` or using `journalctl`) to identify the user account that executed `/doas`. Legitimate administrative activities would typically involve authorized accounts like `admin` or `sysadmin`.

  - **Check command executed with `doas`:** Look at arguments passed to the `doas` command in the logs (e.g., field `args` in `auditd` logs). Malicious indicators may include unexpected commands like installing software or modifying files in sensitive directories.

  - **Identify the parent process:** Investigate logs for the parent process of the `doas` execution (Event ID could be 116 from audit logs). Check for unusual parent processes indicating possible scripting or automation (e.g., shell script execution).

  - **Review frequency of `doas` executions:** Assess how often `doas` is being utilized on the host through logs over a specific time frame. Frequent or scheduled usage without a valid operational reason can indicate potential abuse.

  - **Correlate with user role or asset criticality:** Understand the context of the affected system based on its role (e.g., web server vs. database server). Higher criticality systems being accessed could heighten the potential impact of unauthorized privilege escalation.

  ---

  ### Prioritization

  The alert is rated low severity as it may represent standard user activity or legitimate system administration. However, vigilance is warranted due to the potential for privilege escalation, which could be weaponized by malicious actors seeking elevated access within the network.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for all invocations of `doas`, especially if misconfigurations prevent logs from being generated. Legitimate automation scripts or maintenance tasks could trigger this alert, but not all `doas` usage is suspicious. A companion detection, such as monitoring unauthorized changes to critical system files, would enhance coverage against privilege escalation attempts.

