  ### Technical Context
  This detection rule identifies the execution of the `doas` utility on Linux systems. The `doas` command allows users to run commands with elevated privileges, similar to `sudo`, and it is often utilized for privilege escalation. Attackers may exploit this tool to perform unauthorized actions by gaining unnecessary access to system resources, data, or administrative capabilities, thereby advancing their objectives. In scenarios where a legitimate user account is compromised, an attacker could use `doas` to circumvent security protocols and potentially gain complete control over the system.

  This detection aligns with various MITRE ATT&CK tactics and techniques, particularly in the areas of **Privilege Escalation** (TA0004) and **Defense Evasion** (TA0005). Specifically, the technique **T1548: Abuse Elevation Control Mechanism** is pertinent, as it encompasses methods used by adversaries to escalate privileges, which `doas` facilitates in a Linux environment. The primary data source for this detection is the **process creation logs**, which capture details about commands executed on the system, including the use of tools like `doas`.

  ### Investigation Steps
  - **Review Process Logs:** Analyze the process creation logs on the affected Linux host to identify any invocation of the `doas` command, paying attention to timestamps and originating user accounts.
  - **Correlate with User Behavior:** Examine user behavior around the time of the `doas` execution, including other commands run by the same user to determine if there is a pattern indicating suspicious activity.
  - **Inspect Sudo vs. Doas Context:** Compare instances of `doas` with any relevant `sudo` usage by the same users. Verify if elevated actions were necessary and legitimate given the context.
  - **Audit User Accounts:** Look into the user account that utilized `doas` to determine if it has been compromised. Check for unusual login activities, password changes, or access from abnormal locations.

  ### Prioritization
  The low severity of this alert suggests that while `doas` execution is noteworthy, it may not present an immediate threat unless combined with other indicators of compromise. However, its nature as a privilege escalation tool means that it should still be investigated to prevent potential exploitation in an enterprise environment.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may arise from environments where `doas` is not commonly used or configured. The detection logic assumes that `doas` usage is either malicious or requires further scrutiny; thus, it may not account for legitimate administrative tasks performed by authorized users. Additionally, the alert relies on consistent process creation logging; if logging is disabled or misconfigured, the detection will fail. Ensuring that comprehensive logging is enabled on Linux systems is crucial for accurate detection.

