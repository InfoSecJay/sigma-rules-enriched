  ### Technical Context

  This Sigma rule detects the execution of the `doas` tool on Linux systems. The `doas` utility allows standard users to run commands with elevated privileges, similar to `sudo`, and can be employed by attackers to gain unauthorized access to root-level permissions, potentially leading to further exploitation. This behavior fits within the MITRE ATT&CK framework under the Defense Evasion (TA0005) and Privilege Escalation tactics, specifically the technique "Setuid and Setgid" (T1548).

  The primary telemetry source for this detection is the Linux process creation logs, specifically monitoring the execution of `/doas`. If malicious, the security impact could range from unauthorized access to critical systems and data to complete system compromise. However, this detection alone does not confirm malicious intent; legitimate users may run `doas` for valid administrative purposes.

  ### Investigation Steps

  - **Check for `/doas` execution logs**: Look for process creation logs with Event IDs indicating command execution. Use `grep` on `/var/log/auth.log` or `journalctl` for entries containing `/doas` to track the command usage.

  - **Examine arguments passed to `doas`**: Review any command line arguments associated with the detected instance of `doas` execution. Malicious usage may involve suspicious command combinations, such as file manipulations or network commands.

  - **Identify the user executing `doas`**: Determine if the user running `/doas` is a standard user with limited permissions or an administrator. Check the `/etc/passwd` or relevant directory service logs (if applicable) to verify the user's role.

  - **Cross-reference with executed commands**: Investigate the previous commands executed by the user. Compare legitimate administrative tasks against the executed doas commands. Legitimate usage often involves system maintenance or permitted installations.

  - **Signal potential malicious intent**: Look for patterns of behavior, such as repeated `doas` calls in a short time, especially if they attempt to access sensitive or critical system areas, indicating possible privilege escalation attempts.

  - **Confirm altered system files**: Validate any changes to critical system files or configurations after the execution of `doas`. Log files should show if files in `/etc`, user home directories, or other sensitive areas were modified around the same timestamp.

  ### Prioritization

  The alert severity is low, as `doas` is a legitimate tool and may often be used by administrators for necessary tasks. However, the likelihood of malicious abuse exists when combined with odd usage patterns or sensitive commands, making it essential to discern legitimate from potentially harmful actions. While this behavior is not commonly weaponized, its ability to enable privilege escalation can pose a significant risk if used maliciously.

  ### Blind Spots and Assumptions

  Limitations of this detection may arise from users executing `doas` for legitimate reasons that coincide with administrative responsibilities. There's an assumption that logging is properly configured to capture all executions of `doas`, which may not be the case in all environments. Also, legitimate scripts and automation tools may call `doas`, which could create false positives. An associated detection to enhance coverage would involve monitoring for unusual or unauthorized command sequences executed post-`doas` invocation, increasing the confidence in detecting privilege escalation attempts.

