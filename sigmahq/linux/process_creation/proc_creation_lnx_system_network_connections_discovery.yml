note: |
  ### Technical Context

  This Sigma rule detects the execution of common Linux utilities such as `lsof`, `netstat`, `ss`, and `sockstat`, which adversaries may use to discover active network connections, open ports, and listening services on a compromised system. The likely objective for an attacker is to enumerate services for possible exploitation or lateral movement within the network. This behavior aligns with the MITRE ATT&CK technique for Network Connections Discovery (T1049).

  The primary telemetry source is the process creation logs from the Linux system, detailing command executions and process parameters. If malicious, this behavior could indicate reconnaissance activities prior to more severe attacks. Importantly, this detection does NOT confirm that an adversary has compromised the system; it merely indicates that network enumeration tools have been used.

  ### Investigation Steps

  - **Check the process creation logs**: Review Syslog or audit logs for Event ID related to process creation (e.g., using journald logs). Look for processes created with `lsof`, `netstat`, `ss`, or `sockstat` in fields such as `COMMAND` or `ARGS` to identify malicious execution patterns.

  - **Identify the user and environment context**: Investigate the `USER` field associated with the aforementioned commands. Increased privileges (e.g., execution by root or a high-privilege user account) may indicate malicious intent. Confirm user activity patterns against normal usage.

  - **Review recent administrator activities**: Assess if recent administrative tasks or configurations could explain the use of these commands. Legitimate activities may include system audits or troubleshooting that could involve running `netstat` or `lsof`.

  - **Cross-reference with known indicators of compromise (IoCs)**: Validate if the command execution occurred in conjunction with other known malicious behaviors (e.g., unusual outbound connections) which can indicate exploitation attempts.

  - **Analyze command arguments**: Dive into the command parameters used with these tools. For instance, `netstat -tulnp` provides detailed connection information that an adversary may exploit; review the output for unusual listening services.

  - **Establish a baseline of normal operations**: Document expected behaviors in your environment for the use of these utilities, such as scheduled tasks for monitoring or other benign usage profiles, to help distinguish between legitimate administrative activity and potential threats.

  ### Prioritization

  The alert severity is relatively low in most enterprise contexts, as legitimate administrative users frequently utilize these commands for system monitoring and management. However, the likelihood of malicious abuse exists, especially if combined with other suspicious activities indicative of reconnaissance or preparation for attack.

  ### Blind Spots and Assumptions

  The detection may miss cases where these utilities are executed with alternate parameterization that avoids logging standard command lines. Reliability requires that process creation logging is enabled and properly configured across all managed systems. Additionally, legitimate maintenance tasks or system health checks could trigger the alert, making it essential for analysts to contextualize findings. Companion detections around unauthorized network scans or unusual outbound traffic can enhance insight into potential threats.

