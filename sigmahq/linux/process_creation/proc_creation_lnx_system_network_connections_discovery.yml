detection:
  selection:
    Image|endswith:
    - '/who'
    - '/w'
    - '/last'
    - '/lsof'
    - '/netstat'
  filter_landscape_sysinfo:
    ParentCommandLine|contains: '/usr/bin/landscape-sysinfo'
    Image|endswith: '/who'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate activities
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of common system utilities on Linux operating environments that are employed by attackers to discover network connections. Specifically, commands like `/who`, `/w`, `/last`, `/lsof`, and `/netstat` can provide valuable information about active connections and logged-in users. An attacker may utilize these commands to gather reconnaissance data prior to executing further malicious actions, such as lateral movement or data exfiltration.

  The primary objective of detecting these commands is to identify unauthorized reconnaissance activities indicative of pre-attack preparation. Attackers might leverage these capabilities to enumerate active sessions, available network interfaces, and connected peers, thereby shaping their strategies for infiltration or privilege escalation. In terms of MITRE ATT&CK, the relevant tactics and techniques include **Discovery** (TA0007) and **Network Service Discovery** (T1049).

  The best telemetry sources for supporting this detection include process creation logs from the Linux operating system. These logs capture command usage, including the images executed and their corresponding parameters.

  ### Investigation Steps
  - **Review Process Creation Logs**: Gather process creation logs to identify instances of the specified commands. Focus on the command line arguments to understand the context of their use.

  - **Investigate Parent Processes**: Correlate the identified commands with their parent processes to detect any legitimate administrative tools, especially focusing on those invoked by `/usr/bin/landscape-sysinfo`, which could indicate more benign usage.

  - **Analyze User Activity**: Examine user accounts that executed the commands. Check for any unusual login patterns, such as logins from non-standard locations or times that could suggest compromised accounts.

  - **Cross-Reference Network Events**: Review network traffic logs to correlate the timing of identified commands with any suspicious outbound connections or data transfers that may indicate further malicious activity.

  ### Prioritization
  Alerts generated by this rule should be considered low severity in an enterprise environment, as legitimate administrative activities may trigger them. However, consistent detection patterns warrant further analysis to ensure that they are not part of an attack preparation phase.

  ### Blind Spots and Assumptions
  This detection rule may miss elevated privileges where an attacker uses other means to execute these discovery commands, such as through a privileged shell or containerized environment without logging. It assumes that process creation logs are properly configured and monitored; if these logs aren't generated or stored, detection will fail. Additionally, the detection logic operates under the assumption that commands will be executed directly without any obfuscation or modification, which could lead to missed detections if attackers employ such tactics.

