note: |
  ### Technical Context

  This Sigma rule detects the execution of native Linux utilities commonly used for network connection discovery, such as `who`, `w`, `last`, `lsof`, and `netstat`. The primary intent behind these commands in the hands of an attacker is to enumerate live connections and potentially identify active sessions or other sensitive information that can aid in lateral movement or reconnaissance.

  The relevant MITRE ATT&CK technique is "Network Connections Discovery" (T1049). Primary telemetry sources include process creation events from Sysmon or Linux auditing logs that generate records on command execution. If malicious, this behavior can indicate an attacker is mapping out the network environment for further exploitation. Importantly, this detection does not confirm that malicious activity is occurring, as these commands may also be used for benign administrative purposes.

  ### Investigation Steps

  - **Check command execution history**: Review process creation logs for Event ID 4688 (or Sysmon Event ID 1) to locate instances of the commands '/who', '/w', '/last', '/lsof', or '/netstat'. Validate the user context to determine if the action aligns with job functions for that user.

  - **Validate parent process**: Investigate the parent process tree to confirm if these commands were spawned by suspicious or unexpected parent processes, particularly focusing on any instances where `/usr/bin/landscape-sysinfo` is a parent process.

  - **Identify target systems**: Correlate affected hostnames/IP addresses with sensitive roles, such as servers holding confidential data or critical infrastructure, to prioritize the investigation based on potential impact.

  - **Review network logs**: Check network traffic logs (if available) for unusual outbound connections made following the execution of these commands. Look for indicators like unexpected hosts or abnormal port numbers.

  - **Establish baseline for legitimate use**: Identify typical user behavior and usage patterns for these commands within your environment. Command usage by system administrators during maintenance or monitoring should not trigger alarm when within expected baselines.

  ### Prioritization

  The severity of this alert is low, primarily due to the benign usage of network discovery commands in administrative contexts. However, there is potential for malicious intent if executed in critical environments where attackers seek to gain reconnaissance. While these commands can be weaponized, they are often part of regular operations, leading to a lower likelihood of immediate threat detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for adversaries to mask their activity through methods such as script obfuscation, modification of command parameters, or using other tools for network discovery. Reliable detection requires the appropriate logging configuration of process creation events within the Linux environment. Additionally, legitimate user activities, such as system monitoring and network diagnostics by admins, may trigger this alert. Companion detections including “Suspicious Process Creation” can enhance coverage by flagging unusual process behavior in conjunction with network discovery actions.

