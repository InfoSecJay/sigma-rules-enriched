title: Local System Accounts Discovery - Linux
id: b45e3d6f-42c6-47d8-a478-df6bd6cf534c
status: test
description: Detects enumeration of local system accounts. This information can help
  adversaries determine which local accounts exist on a system to aid in follow-on
  behavior.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.001/T1087.001.md
- https://my.f5.com/manage/s/article/K589
- https://man.freebsd.org/cgi/man.cgi?pwd_mkdb
author: Alejandro Ortuno, oscd.community, CheraghiMilad
date: 2020-10-08
modified: 2024-12-10
tags:
- attack.discovery
- attack.t1087.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_1:
    Image|endswith: '/lastlog'
  selection_2:
    CommandLine|contains: '''x:0:'''
  selection_3:
    Image|endswith:
    - '/cat'
    - '/ed'
    - '/head'
    - '/more'
    - '/nano'
    - '/tail'
    - '/vi'
    - '/vim'
    - '/less'
    - '/emacs'
    - '/sqlite3'
    - '/makemap'
    CommandLine|contains:
    - '/etc/passwd'
    - '/etc/shadow'
    - '/etc/sudoers'
    - '/etc/spwd.db'
    - '/etc/pwd.db'
    - '/etc/master.passwd'
  selection_4:
    Image|endswith: '/id'
  selection_5:
    Image|endswith: '/lsof'
    CommandLine|contains: '-u'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ---

  ### Technical Context

  This rule detects the enumeration of local system accounts on Linux, which involves querying files and commands that reveal user information and system configurations, such as `/etc/passwd` and `/etc/shadow`. The likely attacker objective is to gather intelligence on user accounts and privileges, paving the way for privilege escalation or lateral movement. The relevant MITRE ATT&CK tactic is Discovery, specifically the technique ID T1087.001 (Account Discovery).

  Primary telemetry sources include process creation logs from the Linux operating system, specifically capturing event data related to command-line execution. The security impact can be significant if this information is leveraged for further attacks. However, it is crucial to note that the detection of these commands does not confirm that attackers are actively exploiting the environment; legitimate administrative actions may trigger the same alerts.

  ---

  ### Investigation Steps

  - **Identify the executing process:** Review process creation logs (e.g., Syslog or journald logs) for Event ID 226 (Linux) to check which commands were executed and by whom.

  - **Verify command usage context:** Check the command-line arguments against expected administrative behavior, such as legitimate use of `cat`, `less`, or `head` for casual log review or maintenance tasks.

  - **Analyze user account status:** Look for unusual user account or group inquiries, such as `id` and `lsof -u`, focusing on whether these were run by service accounts or less common users. Compare with expected behavior for each role.

  - **Correlate timestamps with alerts:** Cross-reference alert timestamps with other logs (e.g., authentication logs) to determine if there is a pattern of reconnaissance followed by suspicious activities, indicating possible malicious intent.

  - **Investigate historical patterns:** Review the history of the `lastlog` command usage and other similar administrative actions in logs to identify if these occurrences are standard practice versus anomalies.

  ---

  ### Prioritization

  Alerts generated from this detection should be viewed as low severity due to the potential for frequent legitimate administrative activities triggering the rule. However, the likelihood of malicious abuse increases if such discovery commands are found in combination with further exploit attempts. The behavior is somewhat common among both benign administrative tasks and actual adversary reconnaissance.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of obfuscation or alternative commands that can provide similar information without triggering this specific rule. The rule relies heavily on proper logging configurations for process execution; without them, legitimate administrative actions may not be captured. Legitimate activities might include regular system maintenance by IT staff, which can inadvertently trigger the alert. Companion detections that strengthen coverage include monitoring for abnormal access patterns to sensitive files (like `/etc/shadow`), which could indicate exploit attempts following the discovery phase.

