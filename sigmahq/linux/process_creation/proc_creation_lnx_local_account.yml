title: Local System Accounts Discovery - Linux
id: b45e3d6f-42c6-47d8-a478-df6bd6cf534c
status: test
description: Detects enumeration of local system accounts. This information can help
  adversaries determine which local accounts exist on a system to aid in follow-on
  behavior.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.001/T1087.001.md
- https://my.f5.com/manage/s/article/K589
- https://man.freebsd.org/cgi/man.cgi?pwd_mkdb
author: Alejandro Ortuno, oscd.community, CheraghiMilad
date: 2020-10-08
modified: 2024-12-10
tags:
- attack.discovery
- attack.t1087.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_1:
    Image|endswith: '/lastlog'
  selection_2:
    CommandLine|contains: '''x:0:'''
  selection_3:
    Image|endswith:
    - '/cat'
    - '/ed'
    - '/head'
    - '/more'
    - '/nano'
    - '/tail'
    - '/vi'
    - '/vim'
    - '/less'
    - '/emacs'
    - '/sqlite3'
    - '/makemap'
    CommandLine|contains:
    - '/etc/passwd'
    - '/etc/shadow'
    - '/etc/sudoers'
    - '/etc/spwd.db'
    - '/etc/pwd.db'
    - '/etc/master.passwd'
  selection_4:
    Image|endswith: '/id'
  selection_5:
    Image|endswith: '/lsof'
    CommandLine|contains: '-u'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This rule detects the enumeration of local system accounts on Linux systems. Attackers often seek to collect information about user accounts to establish attack vectors, such as privilege escalation or lateral movement. When an adversary identifies local account names and their associated privileges, they can better plan their follow-on actions, including executing further reconnaissance or launching attacks with the gained information.

  Key MITRE ATT&CK tactics/techniques relevant to this detection include "Discovery" (T1087), specifically the sub-technique "Account Discovery" (T1087.001). This reflects actions where an adversary seeks to enumerate user or service accounts that exist within a targeted system.

  The primary data sources for effective detection will be process creation events, which log the execution of commands and scripts that may be used to list accounts or inspect system files containing account information (e.g., `/etc/passwd` or `/etc/shadow`).

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine process creation events logged to determine if there are any instances of commands associated with account enumeration. Look specifically for instances of commands that end with `/lastlog`, `/id`, or common text editors used to read system files such as `/etc/passwd`.

  - **Check CommandLine Arguments:** Analyze command-line arguments in the logs for suspicious patterns, particularly those that include typical account files like `/etc/shadow` or command-line options that suggest enumeration efforts, like `-u` with `/lsof`.

  - **Assess User Context:** Investigate the user context under which the commands were executed. Determine if the execution was performed by a legitimate user in a typical administrative role or if it appears suspicious for the given user account.

  - **Identify Anomalous Activity:** Look for multiple account enumeration attempts within a short time span or unusual account access patterns that might indicate an adversary's presence. Correlate this with other logs, such as authentication failures or unusual processes running on the system.

  ### Prioritization
  The severity of this alert should be considered low in a typical enterprise environment; however, it requires attention as it can indicate potential reconnaissance activities by an unauthorized user or malicious actor. The likelihood of exploitation and the possible escalation of privilege mean that while the immediate risk may be low, the implications of undiscovered enumeration could lead to significant potential threats.

  ### Blind Spots and Assumptions
  The detection logic could miss instances where legitimate administrative activities involve the same commands used for enumeration. Moreover, if the logs associated with command execution are not properly configured or are retained for insufficient durations, some enumeration activity may go undetected. It assumes that commands related to account discovery are logged faithfully and that the user executing them is not part of the legitimate administrative team. Proper logging configurations must be in place to ensure that process creation events capture the necessary details for effective detection.

