title: Local System Accounts Discovery Attempt - Linux
id: b45e3d6f-42c6-47d8-a478-df6bd6cf534c
status: test
description: |
  Detects attempts to enumerate local user accounts via common Linux utilities and sensitive file access.
  Adversaries may read files such as /etc/passwd, /etc/shadow, and /etc/sudoers, or use tools like getent,
  id, who, and finger to identify accounts and privilege levels on a compromised system.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.001/T1087.001.md
- https://my.f5.com/manage/s/article/K589
- https://man.freebsd.org/cgi/man.cgi?pwd_mkdb
- https://man7.org/linux/man-pages/man1/getent.1.html
- https://linux.die.net/man/1/finger
author: Alejandro Ortuno, oscd.community, CheraghiMilad
date: 2020-10-08
modified: 2026-11-03
tags:
- attack.discovery
- attack.t1087.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_lastlog:
    Image|endswith:
    - '/lastlog'
    - '/last'
    - '/lastb'
  selection_root_string:
    CommandLine|contains: 'x:0:'
  selection_read_utilities:
    Image|endswith:
    - '/cat'
    - '/ed'
    - '/emacs'
    - '/head'
    - '/less'
    - '/makemap'
    - '/more'
    - '/nano'
    - '/sqlite3'
    - '/tail'
    - '/vi'
    - '/vim'
    CommandLine|contains:
    - '/etc/passwd'
    - '/etc/shadow'
    - '/etc/sudoers'
    - 'master.passwd'
    - 'pwd.db'
  selection_id:
    Image|endswith: '/id'
  selection_lsof:
    Image|endswith: '/lsof'
    CommandLine|contains: '-u'
  selection_getent:
    Image|endswith: '/getent'
    CommandLine|contains:
    - ' passwd'
    - ' shadow'
  selection_who:
    Image|endswith:
    - '/finger'
    - '/users'
    - '/w'
    - '/who'
  selection_ypcat:
    Image|endswith: '/ypcat'
    CommandLine|contains: 'passwd'
  filter_optional_landscape_sysinfo:
    ParentCommandLine|contains: '/usr/bin/landscape-sysinfo'
    Image|endswith: '/who'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects attempts to enumerate local user accounts on Linux systems through common utilities such as `getent`, `last`, and reading sensitive files like `/etc/passwd`, `/etc/shadow`, and `/etc/sudoers`. The likely attacker objective is to gather information about user accounts and privileges, potentially for privilege escalation or lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of Discovery (ID: T1087) and technique Account Discovery (ID: T1087.001).

  The primary telemetry sources include process creation logs categorized under Linux, particularly focusing on utilities used to access user account information. The security risk of this behavior is significant, as it lays the groundwork for further attacks against users with high privileges. Importantly, this detection does NOT confirm malicious intent on its own; benign administrative activities may also utilize these commands.

  ### Investigation Steps

  - **Check for unauthorized processes: **Review process creation events (Linux `process_creation` logs) with common user enumeration utilities like `/getent`, `/id`, or `/lsof` and correlate Event ID 134 (process execution). Look for unexpected execution by non-administrative users, especially those that lack legitimate reasons for such inquiries.

  - **Review command-line arguments: **Scrutinize the command line arguments for processes running `cat` or `vi` against sensitive files, such as `/etc/passwd`, `/etc/shadow`, or `/etc/sudoers`. Malicious indicators include processes accessing these files without valid operational justification, particularly by users that shouldn't have this level of access.

  - **Identify legitimate administrative patterns: **Observe if expected behavior from system administrators executing account queries via commands like `who` or `w` corresponds with times of known maintenance activity. Confirm that the users executing these commands are in known administrator or operations groups and authorized for such tasks.

  - **Cross-reference user access levels: **Review user activity via `last`, `finger`, or `who` commands against documented user privileges and roles within the system. Discrepancies may signal reconnaissance efforts by an adversary, especially if executed by a user without administrative rights.

  - **Monitor for excessive access attempts: **Watch for repeated or excessive calls to `getent passwd` or `/etc/shadow`, especially from the same user or IP address within a short time frame, as this could indicate a scripted enumeration attempt rather than legitimate administrative reviews.

  ### Prioritization

  This alert has a low severity in the context of the enterprise since the involved systems are typically not critical infrastructure. However, the likelihood of malicious exploitation increases if the activity originates from non-administrative accounts attempting to gather user account information frequently. Adversaries commonly weaponize these techniques during initial access or lateral movement phases.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate administrative activities to trigger the alert, as system administrators often run similar commands. Required log sources for reliable detection involve ensuring full process accounting is enabled on Linux systems. Additionally, legitimate scripts or maintenance routines may utilize these commands without malicious intent. Related detections to strengthen coverage include monitoring for suspicious privilege escalation attempts (T1068) or command execution patterns indicative of automated probing behavior.

