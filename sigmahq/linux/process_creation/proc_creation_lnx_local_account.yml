title: Local System Accounts Discovery - Linux
id: b45e3d6f-42c6-47d8-a478-df6bd6cf534c
status: test
description: Detects enumeration of local system accounts. This information can 
  help adversaries determine which local accounts exist on a system to aid in 
  follow-on behavior.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1087.001/T1087.001.md
- https://my.f5.com/manage/s/article/K589
- https://man.freebsd.org/cgi/man.cgi?pwd_mkdb
author: Alejandro Ortuno, oscd.community, CheraghiMilad
date: 2020-10-08
modified: 2024-12-10
tags:
- attack.discovery
- attack.t1087.001
logsource:
  category: process_creation
  product: linux
detection:
  selection_1:
    Image|endswith: '/lastlog'
  selection_2:
    CommandLine|contains: '''x:0:'''
  selection_3:
    Image|endswith:
    - '/cat'
    - '/ed'
    - '/head'
    - '/more'
    - '/nano'
    - '/tail'
    - '/vi'
    - '/vim'
    - '/less'
    - '/emacs'
    - '/sqlite3'
    - '/makemap'
    CommandLine|contains:
    - '/etc/passwd'
    - '/etc/shadow'
    - '/etc/sudoers'
    - '/etc/spwd.db'
    - '/etc/pwd.db'
    - '/etc/master.passwd'
  selection_4:
    Image|endswith: '/id'
  selection_5:
    Image|endswith: '/lsof'
    CommandLine|contains: '-u'
  condition: 1 of selection*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects attempts to enumerate local system accounts on Linux systems through specific commands and tools. By gathering information such as user accounts and their privileges, an attacker aims to map the system's user landscape to facilitate later exploitation or privilege escalation. The relevant MITRE ATT&CK techniques include account discovery (T1087.001), specifically targeting local accounts. Primary telemetry sources include process creation logs with details on executed commands and command line arguments. If malicious, this behavior can lead to unauthorized access and potential compromise of the system. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative activities may exhibit similar patterns.

  ### Investigation Steps

  - **Check process execution details:** Review process creation logs for Event ID  fork/exec (e.g., `audit.log` on Linux) to identify recent executions of relevant commands (`/lastlog`, `/cat /etc/passwd`, etc.). Validate against expected process usage to identify anomalies.

  - **Analyze command line arguments:** Focus on `CommandLine` fields associated with the captured processes for patterns like `/etc/passwd`, `/etc/shadow`, or parameters indicating user enumeration (e.g., `-u` with `lsof`), to distinguish potential malicious use from standard administrative activity.

  - **Assess user roles:** Identify if the command execution is linked to a legitimate admin or if it comes from a low-privilege user context. Benign usage might involve common system administrator tools by expected users (e.g., root user).

  - **Monitor for common admin actions:** Document instances of legitimate account enumeration (e.g., using `getent passwd`, checking `/etc/passwd`), which typically do not accompany unusual process executions or unfamiliar user access patterns.

  - **Identify high-confidence indicators:** Confirm if rapid consecutive invocations of `lsof -u` or similar tools come from a single user indicating potential account discovery attempts rather than standard usage.

  ### Prioritization

  This alert is considered low severity as it does not indicate active exploitation but rather account enumeration, which can precede further attacks. However, frequent triggers by non-administrative users could suggest the beginnings of an unauthorized reconnaissance effort, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of extensive logging configurations, which are necessary to capture all process executions. Legitimate administration tasks, especially in multi-user environments, could trigger the alert without any malicious intent. A companion detection rule for monitoring unusual elevation of privileges (e.g., T1068) could provide additional context and strengthen overall visibility of potential threats.

