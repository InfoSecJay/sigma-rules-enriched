note: |
  ### Technical Context
  This detection rule identifies the use of the `chattr` utility in Linux systems to remove the immutable file attribute, which is often a sign of malicious intent. Adversaries may modify file attributes to bypass security controls, particularly when attempting to manipulate protected files that may contain sensitive information or critical configurations. The main objective of such actions is usually to gain persistence or hide malicious artifacts from security tools.

  Relevant MITRE ATT&CK tactics for this behavior include **Defense Evasion** (TA0005) and the specific technique **File and Directory Permissions Modification** (T1222.002). By removing the immutable attribute from files, attackers can facilitate unauthorized changes or deletions, which may lead to further control or exploitation of the system. The primary data sources for detecting this behavior include process creation logs that provide insights into command execution on Linux systems.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for activities related to the `chattr` utility, specifically focusing on any commands that include the `-i` flag, as these indicate attempts to alter file attributes.
  - **Correlate with Other Activities**: Look for other suspicious process creations around the same timestamp that may imply a broader attack, such as unauthorized file accesses or modifications.
  - **Check File Attribute Changes**: Investigate the file system for any recent changes in file attributes on critical files, particularly those that should remain immutable, to identify potential unauthorized alterations.
  - **Assess User Access and Permissions**: Analyze user accounts involved in the `chattr` command execution to determine if they have appropriate privileges, and check for any potential account compromises.

  ### Prioritization
  The severity of this alert is medium, as modifying file attributes can significantly impact system integrity and security; however, it may also trigger during legitimate administrative activities. Therefore, context must be established to determine intent.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of malicious activity, particularly if attackers use other methods to manipulate file attributes or apply alterations through other means beyond `chattr`. Additionally, the rule assumes that logs for process creation are enabled and adequately configured across Linux systems for the detection to be effective. If process logging is disabled or misconfigured, the detection will fail.

