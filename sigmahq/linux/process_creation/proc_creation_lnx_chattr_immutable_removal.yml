  ### Technical Context

  This Sigma rule detects the execution of the 'chattr' utility with a command option that removes the immutable file attribute from a file on Linux systems. Removing the immutable attribute may indicate an attacker’s attempt to modify or delete files that are meant to be protected from such changes, thereby aiding malicious objectives or facilitating further exploitation. The likely attacker objective is to alter the system's defenses and maintain persistence by preventing the detection of their activities.

  This detection aligns with the MITRE ATT&CK technique **Defense Evasion** (T1222.002). Primary telemetry sources include Linux process creation logs with the relevant log type being system process events. If malicious, this could lead to critical system files being tampered with, potentially resulting in a breach of confidentiality, integrity, or availability of sensitive data. However, it’s important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative tasks could also trigger this alert.

  ---

  ### Investigation Steps

  - **Check process creation**: Review Linux process creation logs (e.g., `/var/log/audit/audit.log`) for Event ID that indicates the execution of ‘chattr’. Focus on CommandLine containing ' -i ' to confirm context. Expect to see entries associated with elevated privileges (UID 0—root).

  - **Identify file changes**: Examine the filesystem for any files that had their immutable attribute removed recently. Use commands like `lsattr` to verify changes against known critical files (e.g., system binaries).

  - **Evaluate user context**: Investigate the user account that executed the command, especially if it is not a known administrator. Cross-reference usernames with system administration roles.

  - **Analyze legitimate use cases**: Determine if the command was executed as part of an expected administrative action, such as restoring backups or managing server configurations. Validate against ticketing systems or change logs to corroborate.

  - **Establish malicious indicators**: Identify aggressive behavior patterns, such as multiple rapid changes to immutable files or attempts to leverage other unfamiliar commands in conjunction with 'chattr'. Document unusual timing (e.g., during off-hours).

  - **Correlate with companion detections**: Check for other detections related to abnormal process behaviors or suspicious file manipulations within the same timeframe (e.g., alerts related to unauthorized changes to sensitive files).

  ---

  ### Prioritization

  This alert should be considered medium severity within the enterprise context due to the potential risk of unauthorized modifications to critical system files. The likelihood of malicious abuse is moderate, particularly in environments where preventive measures against file tampering are in place. This behavior aligns closely with patterns used by attackers to manipulate system integrity.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques may include the use of alternate commands or renaming the 'chattr' utility to avoid detection. Reliable detection requires comprehensive logging configurations across all monitored Linux systems. Legitimate administrative actions related to file management can trigger this alert, such as scheduled restoration processes or maintenance. A companion detection that strengthens coverage includes monitoring access patterns for sensitive configuration files or monitoring for usage of other Linux utilities commonly exploited in attack scenarios.

