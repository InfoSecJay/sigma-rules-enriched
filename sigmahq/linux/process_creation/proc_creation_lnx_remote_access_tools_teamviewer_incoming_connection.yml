  ---

  ### Technical Context

  This rule detects the execution of the TeamViewer application on a Linux host, specifically when an incoming remote session is initiated. The likely objective of an attacker using this behavior is to gain unauthorized access or control over a compromised system. This behavior corresponds to the MITRE ATT&CK tactic of **Persistence** (T1133). The primary telemetry source is the Linux process creation log, indicating the starting of TeamViewer processes. If malicious, this can lead to data exfiltration or system manipulation. This detection does NOT confirm that all TeamViewer usage is malicious; legitimate IT support activities may also utilize this tool.

  ---

  ### Investigation Steps

  - **Search for process creation events**: Investigate process creation logs for TeamViewer execution using Syslog or equivalent logging systems around the time of the alert, focusing on process IDs and parent-child relationships. Look for Event IDs related to process creation that include `/TeamViewer_Service` or `/TeamViewer_Desktop`.

  - **Review incoming connection logs**: Check the `incoming_connections.txt` file located in the TeamViewer directory on the affected host for details on the established session, including origin IP addresses and session timestamps.

  - **Permissions validation**: Confirm user permissions of the account starting the TeamViewer session. For legitimate usage, this typically should be a system administrator performing maintenance or support tasks.

  - **Cross-reference with known hosts**: Verify if the incoming connection's IP address is known and trusted within your organization. Record any unknown or suspicious IP addresses for further threat analysis.

  - **Identify malicious command line parameters**: Beyond the standard command line `/TeamViewer_Desktop --IPCport 5939 --Module 1`, look for unusual modifications or additional parameters indicating potential obfuscation or malicious intentions.

  - **Evaluate host role and criticality**: Consider the criticality of the Linux host involved. If it hosts sensitive data or services, prioritize this investigation higher due to potential impact.

  ---

  ### Prioritization

  This alert carries low severity due to the commonplace use of TeamViewer in many organizations. However, if detected in contexts involving sensitive systems or from untrusted sources, the likelihood of malicious intent increases, warranting thorough investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging for process creation is insufficient or if TeamViewer is configured to not generate expected log entries. Legitimate IT support activities could trigger this alert, leading to false positives. Additionally, companion detections such as incoming connection attempts on unusual ports or suspicious remote user logins could strengthen coverage and mitigate blind spots.

