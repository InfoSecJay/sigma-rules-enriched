note: |
  ### Technical Context

  This detection rule identifies the execution of TeamViewer when a remote session is initiated on a Linux host. The likely objective is to establish remote control or management of the system, which could be used for both legitimate support or malicious purposes. This behavior fits within the MITRE ATT&CK framework under the tactic of Remote Access (TA0002) and the technique of Remote Access Tools (T1133). The primary telemetry source for this detection is process creation logs from Linux systems. If malicious, it could allow an adversary persistent access to the environment. Importantly, this detection does not confirm malicious intent on its own, as TeamViewer is commonly used for legitimate remote support.

  ### Investigation Steps

  - **Check process creation logs:** Review Linux process creation logs (e.g., Syslog or audit logs) for Event ID correlating to TeamViewer initiation, specifically looking for entries with `Image` ending in `/TeamViewer_Desktop` and `CommandLine` containing `--IPCport 5939 --Module 1`.

  - **Verify incoming connections:** Examine the "incoming_connections.txt" file located in the TeamViewer directory to confirm connection details such as source IP addresses and timestamps to analyze the legitimacy of remote access.

  - **Evaluate known user activity:** Cross-reference logs with known legitimate users (such as IT support staff) to identify if the session aligns with standard operating procedures, focusing on historical usage patterns of TeamViewer.

  - **Identify high-confidence malicious indicators:** Investigate any sessions initiated from unauthorized or unusual external IP addresses, especially those outside standard business hours or originating from known malicious regions.

  - **Assess critical systems:** Determine if the host is part of critical infrastructure or sensitive environments; prioritize investigation on these hosts if any suspicious connections are identified.

  ### Prioritization

  This alert is low severity given the legitimate use of TeamViewer in many organizations. However, the likelihood of malicious abuse exists, particularly if unauthorized users are discovered accessing critical or sensitive systems. This behavior is commonly weaponized in persistence strategies by adversaries.

  ### Blind Spots and Assumptions

  This detection rule may not capture legitimate uses of TeamViewer in all scenarios, particularly when logs are insufficiently configured. Potential evasion techniques might include the use of alternate remote access tools or disguising malicious TeamViewer sessions under benign process names. Notify analysts to be aware of legitimate support activities that may trigger this alert. A companion detection related to direct command execution or abuse of other remote access tools (e.g., SSH connections) can provide additional context to assess the situation effectively.

