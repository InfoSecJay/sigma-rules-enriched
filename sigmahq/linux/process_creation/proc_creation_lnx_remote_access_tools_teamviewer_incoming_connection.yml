note: |
  ### Technical Context
  This Sigma rule detects the initiation of a remote support session on a Linux host through TeamViewer, a popular remote access tool. By monitoring process creation logs, the rule identifies when TeamViewer starts a session from a remote machine. The rule's activation indicates a potential unauthorized access or remote support session that could be exploited by attackers for various malicious activities, such as unauthorized data access or control over the compromised system.

  The threat scenario involves an attacker potentially using TeamViewer to gain unauthorized access to a Linux environment. Their objectives may include data exfiltration, system manipulation, or lateral movement within the network. Given the prevalence of remote support tools, misuse of applications like TeamViewer poses a risk, especially if security controls are not adequately enforced.

  Relevant MITRE ATT&CK techniques include **T1133: External Remote Services**, which describes the use of external services for remote access, and **TA0001: Initial Access**, focusing on the methods attackers use to access a target system. Primary data sources for this detection include process creation events, particularly monitoring for command line arguments indicating a TeamViewer session.

  ### Investigation Steps
  - **Review Process Creation Logs:** Look for any process creation events related to TeamViewer, specifically those that show the command line arguments, to determine if unauthorized sessions were started.
  - **Analyze Incoming Connections Log:** Check the "incoming_connections.txt" file within the TeamViewer directory for details on the originating IP address and the user accounts involved in establishing the session.
  - **Correlate with User Activity:** Investigate user activity during the detected session time to establish if the remote access was authorized or if any anomalous behavior was present.
  - **Check Network Traffic:** Utilize network monitoring tools to analyze any traffic originating from the TeamViewer service to identify potential data exfiltration or connections to known malicious IP addresses.

  ### Prioritization
  The alert's severity level is set to low due to the common legitimate use of TeamViewer for remote support within enterprises, which may lead to a high volume of false positives. Nonetheless, any unrecognized or unexpected instances warrant examination to rule out unauthorized access.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on the TeamViewer process name and command-line arguments, which may be easily spoofed by an attacker. The detection logic assumes that there is no legitimate business need for the remote session at the time of detection, which may not always hold true. Additionally, proper logging configurations and permissions must be in place for TeamViewer to capture incoming connection details adequately, which can vary based on the organization's implementation.

