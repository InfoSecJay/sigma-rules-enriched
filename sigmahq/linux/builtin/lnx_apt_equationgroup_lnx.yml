level: high
note: |
  ### Technical Context

  This Sigma rule detects execution of suspicious shell commands associated with known Equation Group tools and scripts, indicating potential malicious activity. The likely attacker objective is to achieve persistence or remote access on compromised systems. This behavior is associated with the MITRE ATT&CK tactic of **Execution** (TA0002) and the technique **Command and Scripting Interpreter: Unix Shell** (T1059.004).

  The primary telemetry sources include Linux shell command logs, specifically audit logs and syslog entries that capture command execution details. If exploited by an adversary, the security impact may involve unauthorized access, data exfiltration, or persistence mechanisms. It is crucial to note that detection of these commands does NOT confirm malicious intent on its own; they could originate from legitimate administrative activities or maintenance scripts.

  ### Investigation Steps

  - **Evaluate command context**: Review the command execution logs (such as `/var/log/auth.log` or audit logs for Event ID containing command execution) for timestamps and user context. Check if the user executing the commands has administrative privileges or a valid reason for executing them.

  - **Identify known Equation Group indicators**: Look for specific patterns like `chmod 4777 /tmp/.scsi/dev/bin/gsh` or `chown root:root /tmp/.scsi/dev/bin/`. Commands matching these patterns suggest potential Equation Group activity and help confirm malicious intent.

  - **Assess execution frequency**: Investigate the frequency of the commands executed over a short timeframe. Legitimate users should not routinely use commands like `chmod 4777` or copy binaries to sensitive directories, while repeated instances from the same user may indicate malicious behavior.

  - **Review running processes**: Utilize `ps aux` to identify running processes linked to these suspicious commands. For instance, processes named after tools like `ewok`, `ghost`, or any reverse shell indicators (e.g., `ncat`, `nc`) signify a higher risk of compromise.

  - **Correlate with network activity**: Inspect outbound connections or network activity (e.g., `/var/log/secure` for auth logs) around the same time as detected commands. Look for connections to unidentified or suspicious IP addresses that could indicate command and control communications.

  - **Verify incident response procedures**: Ensure that the incident response or IR teams are notified of any identified malicious indicators. High-risk assets or critical hosts should be quarantined for further examination.

  ### Prioritization

  Given the potential impact of these commands on privileged systems, the alert is considered high severity. The likelihood of malicious abuse is significant, especially since the behaviors align closely with known tactics used by advanced threat actors. This behavior has a history of being weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers might obfuscate commands or use alternate encodings to bypass detection. Log sources such as audit logs and shell histories must be configured to ensure comprehensive monitoring; missing logs could lead to undetected threats. Legitimate administrative activities, such as system maintenance or software upgrades, may trigger similar commands. A companion detection method involves monitoring for abnormal user behavior, which could provide additional context and strengthen overall detection coverage.

