note: |
  ### Technical Context
  This detection rule identifies suspicious shell commands that are characteristic of various tools and tactics associated with the Equation Group, a threat actor known for their sophisticated cyber espionage techniques. The commands exhibit behaviors such as privilege escalation (changing file permissions or ownership), establishing reverse shells, or performing reconnaissance via network utilities. Attackers employing these tactics typically aim to compromise systems, escalate privileges, exfiltrate sensitive data, or establish persistent access.

  Relevant MITRE ATT&CK tactics related to this detection include:
  - **Execution (T1203)**: The rule targets processes running unauthorized commands within the Linux environment.
  - **Command and Scripting Interpreter (T1059.004)**: Detected commands utilize shell scripting for execution of malicious payloads.
  - **Privilege Escalation (T1068)**: Commands indicating attempts to change ownership and privilege settings of files.

  Primary data sources for effective detection include:
  - **Linux process creation logs**: Capturing commands invoked by users and processes.
  - **Command line argument logging**: Recording the exact commands run, which can provide context for the behavior being analyzed.
  - **System audit logs**: To monitor changes in file ownership or permission settings.

  ### Investigation Steps
  - **Review Process Creation Events**: Analyze the command line arguments of running processes for any of the identified keywords related to Equation Group tools and scripts. Pay particular attention to commands that exhibit unusual privilege changes or create network connections.

  - **Check System Audit Logs**: Look for entries indicating changes to file ownership or permissions. Investigate any such changes on sensitive directories or files, especially those involving `chown` or `chmod` commands.

  - **Inspect Network Connections**: Identify any suspicious outbound connections, especially those involving reverse shells. Capture and analyze logs related to incoming and outgoing connections on the monitored systems.

  - **Evaluate Historical Data**: Utilize SIEM or log analysis tools to assess whether these commands have been previously executed in the environment, as recurrences might indicate persistent threat activities.

  ### Prioritization
  Given the high severity level, alerts generated by this rule should be prioritized due to the critical nature of potential privilege escalation and remote access activities. The Equation Group's reputation for advanced cyber capabilities implies a significant threat to enterprise systems if successful.

  ### Blind Spots and Assumptions
  There may be gaps in the detection coverage if logging mechanisms for process executions or command line arguments are not enabled on all endpoints. The detection logic assumes that known malicious keywords will be present in command executions; hence, stealthy, custom or obfuscated commands may evade detection. Proper configurations for command auditing must be ensured to facilitate this alert's function effectively, and it is also assumed that standard system access controls are in place to mitigate unauthorized command executions.

