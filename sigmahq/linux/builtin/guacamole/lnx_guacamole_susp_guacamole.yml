  ### Technical Context

  This Sigma rule detects anomalous sessions in Apache Guacamole where two users are concurrently present in the same session. Such behavior may indicate unauthorized sharing of session access, potentially enabling credential theft or unauthorized access to sensitive resources. The main attacker objective could be to leverage shared access for malicious activities such as data exfiltration or reconnaissance.

  This detection correlates with the MITRE ATT&CK tactic "Credential Access" (TA0006) and the technique "Interactive Logon" (T1212). Primary telemetry sources include logs from the Guacamole service on Linux systems, specifically looking for logs associated with user session management. If malicious, this activity can compromise the confidentiality and integrity of sensitive information. However, it is important to note that this detection does NOT confirm any specific malicious intent; it merely highlights the occurrence of dual user sessions.

  ### Investigation Steps

  - **Check active sessions in Guacamole:** Review Guacamole logs (typically found under `/var/log/guacamole/`) to identify session information. Look for entries that include user IDs and timestamps to determine the context of the concurrent session.

  - **Identify user roles and permissions:** Examine the user roles of the two individuals sharing the session. Cross-reference the User and Role tables in the Guacamole database to ensure both users should have access to the same resources, which can indicate benign activity if roles align appropriately.

  - **Analyze session start time and duration:** Look into the `session_start_time` and `session_end_time` fields in the session log. Malicious activity can often be inferred if the session duration is excessive without activity logs, indicating potential credential abuse.

  - **Correlate login events:** Review Security Event IDs in Linux logs (e.g., syslog or audit logs) for both users (User IDs) around the time of the session. Legitimate users may log in separately around the same timeframe, which provides context for the session behavior.

  - **Search for alert escalation patterns:** Look for repetitive occurrences of the session-sharing alert in logs over time. Multiple offenses could indicate a scripted brute-force attack or exploitation technique, which should trigger a higher level of scrutiny.

  ### Prioritization

  The high severity of this alert is due to the potential risk posed by shared sessions on critical systems, particularly if they involve privileged users. The likelihood of malicious abuse is significant, as many credential theft techniques exploit session sharing. This behavior is not common in normal operational practice, indicating a strong need for immediate investigation.

  ### Blind Spots and Assumptions

  This detection may miss instances where legitimate users are working collaboratively, potentially leading to false positives. Reliability requires that Guacamole logging is properly configured to capture all session events. Additionally, standard collaboration tools may trigger similar session-sharing alerts; thus, analyst judgment is necessary to discern context. Related detections on abnormal login attempts or unusual patterns in user activity can enhance coverage and provide additional context for investigation.

