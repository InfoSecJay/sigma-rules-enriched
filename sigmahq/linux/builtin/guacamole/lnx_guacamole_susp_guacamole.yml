  ### Technical Context

  This Sigma rule detects the presence of two users sharing a remote session in Apache Guacamole, which is indicative of potentially unauthorized credential sharing or co-opting of legitimate access. The likely objective of an attacker would be to bypass normal access controls by leveraging valid credentials from different users simultaneously. This behavior aligns with the MITRE ATT&CK framework under the tactic of Credential Access (TA0006), specifically technique T1212 (Exploitation of Credential Storage).

  The primary telemetry source is Apache Guacamole logs, particularly those detailing session activity and user access. If malicious, this scenario poses a significant security risk as it may enable unauthorized access to sensitive systems, leading to data compromise or further lateral movement. Importantly, this detection alone does not confirm malicious intent; it merely indicates unusual user behavior that requires further investigation.

  ---

  ### Investigation Steps

  - **Review session logs for user details**: Check Apache Guacamole logs (e.g., `/var/log/guacamole.log`) for the event indicating two users present in a session. Look for timestamps and user identifiers to establish context around the event.

  - **Correlate with account access history**: Investigate the account logs for both users involved (Event ID XX: User login logs). Determine whether they logged in from the same or different IP addresses—similar IP addresses may indicate credential sharing.

  - **Identify legitimate use cases**: Determine if there are known business processes requiring users to share sessions—consult with application owners or internal documentation. Legitimate multi-user sessions typically involve specific user roles and project-based collaboration.

  - **Examine contextual user behaviors**: Analyze the actions performed during the session (oplogs or relevant fields in the logs related to the commands executed) to discern between typical collaboration activities versus potentially malicious indicators, such as unauthorized data access or exfiltration attempts.

  - **Review training and user awareness**: Verify if both users have undergone training about the policies around sharing credentials. A lack of awareness or training may indicate a benign nature of this behavior.

  - **Flag anomalous access methods or potential abuse**: Look for other alerts or unusual patterns related to these users. Check for excessive privileges or anomalous access patterns that could signify further exploitation of access (Event ID XX for privilege escalation logs).

  ---

  ### Prioritization

  The alert carries a high severity due to the risk posed by unauthorized access in shared sessions, especially in an enterprise environment where sensitive data may be accessed. The potential for malicious abuse is significant, especially if the shared sessions facilitate credential theft or unauthorized actions. This behavior can be weaponized by attackers aiming to carry out lateral movements in a compromised environment.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging in Apache Guacamole, which may not capture all session activities or relevant user data. Evasion techniques may include legitimate user collaboration practices, making it challenging to differentiate between unauthorized use and benign activity. Additionally, consider companion detections for lateral movement, such as suspicious application activity or unusual user behavior in order to strengthen incident response capabilities.

