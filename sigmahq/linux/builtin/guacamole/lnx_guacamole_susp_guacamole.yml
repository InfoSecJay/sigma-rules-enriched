  ### Technical Context
  This detection rule identifies potentially suspicious activity in sessions using Apache Guacamole, specifically when two users are detected sharing a session simultaneously. Apache Guacamole is a remote desktop gateway that allows users to connect to remote servers and desktops through a web browser. The presence of two users in a single session could indicate a session hijacking attempt or unauthorized access where the second user may be trying to gain control or monitor the first user's actions.

  The likely attacker objective here could be to leverage stolen credentials or impersonate legitimate users, aligning with the MITRE ATT&CK techniques for credential access, specifically **T1212: Exploiting Application Layer Protocols**. This is particularly concerning in environments handling sensitive data, as the presence of multiple users could facilitate data exposure or manipulation.

  Primary data sources that will contain valuable evidence include Guacamole session logs and network activity logs, which can provide details about user sessions, timestamps, and IP addresses involved in these sessions.

  ### Investigation Steps
  - **Review Session Logs:** Examine the Guacamole logs to identify the timestamps and user accounts associated with the session in question. Look for patterns or repeated occurrences of shared sessions.
  - **Correlate User Activity:** Investigate any recent logins or session creations from the users involved. Cross-reference with Active Directory logs to ensure legitimacy based on user location and device.
  - **Analyze Network Traffic:** Capture and inspect network traffic to and from the Guacamole instance for unusual or suspicious activities that may indicate credential theft or man-in-the-middle attacks.
  - **Audit User Permissions:** Check the permissions and roles assigned to the users involved in the shared session. Ensure that they align with their job functions and that no unauthorized changes have occurred.

  ### Prioritization
  The alert is classified as high severity due to the potential risk of compromise associated with shared sessions in remote access tools. Given that attackers often target remote access solutions to gain footholds in environments, quick responses are crucial to mitigate possible data breaches.

  ### Blind Spots and Assumptions
  There may be gaps in detection if Guacamole session logs are not collected or stored adequately, which would prevent identification of legitimate or unauthorized shared sessions. The detection logic assumes that suspicious behavior can be detected solely through the session-sharing event, which may not consider contextual factors such as legitimate collaborations or troubleshooting scenarios. It is essential for organizations to ensure complete logging of Guacamole activity and network traffic to enable effective monitoring and detection capabilities.

