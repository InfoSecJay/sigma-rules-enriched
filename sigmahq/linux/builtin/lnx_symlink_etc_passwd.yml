  ---

  ### Technical Context

  This rule detects suspicious command usage that attempts to create symbolic links to the `/etc/passwd` file in Linux environments, which is a critical file containing user account information. The likely attacker objective is to manipulate or gain unauthorized access to sensitive user account details or to escalate privileges by altering system behavior. This behavior aligns with the MITRE ATT&CK technique "Command and Scripting Interpreter: Shell Command Execution" (T1204.001).

  Primary telemetry sources include Linux command line logs or process creation logs, specifically looking for commands involving the `ln -s` syntax that targets `/etc/passwd`. The security impact can be significant, as malicious creation of symbolic links can lead to unauthorized credential access or system compromise. However, this detection does NOT confirm successful exploitation or malicious intent on its own, as it may include benign use cases.

  ---

  ### Investigation Steps

  - **Review command line execution:** Check for process creation logs (e.g., `/var/log/auth.log`, `auditd` logs) for the presence of the command `ln -s /etc/passwd` or `ln -s -f /etc/passwd` indicating possible exploitation. Look for Event ID 235 in audit logs.

  - **Validate user context:** Examine which user executed the command. Legitimate activities may include root or administrative users performing system maintenance, but commands executed by non-privileged users should be treated with suspicion.

  - **Check for additional indicators of compromise:** Investigate any unexpected changes to `/etc/passwd` such as modifications or anomalous access patterns. Use `auditd` logs for changes to the file (Event ID 1105).

  - **Analyze recent file system events:** Review file system events (e.g., logs from `inotify` or similar tools) for any modifications involving `/etc/passwd`. Look for related actions, such as who executed command sequences leading to the suspicious link creation.

  - **Correlate with other alerts:** Check for related alerts from intrusion detection or prevention systems (IDS/IPS) indicating exploitation attempts or other suspicious activities on the host that may correlate with this alert.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the centrality of the `/etc/passwd` file in user authentication mechanisms. The likelihood of malicious abuse is elevated, especially in environments where targeted attacks are common, and this behavior can be indicative of attempts to exploit user credentials or privilege escalation tactics.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not log command executions or by the presence of legitimate scripts that utilize symlinks in a benign manner. Ensure that command logging is properly configured on all Linux systems. Additionally, benign maintenance activities by admins, such as creating symlinks for development purposes, might trigger the alert. A related detection to monitor is for unauthorized modifications to `/etc/passwd` using Linux audit logs, which would strengthen the investigation framework.

