note: |
  ### Technical Context

  This Sigma rule detects malicious attempts to create symbolic links to the `/etc/passwd` file, which is critical for user account management on Linux systems. An attacker might exploit this behavior to create a symlink to divert legitimate processes to read or modify the `/etc/passwd` file, potentially allowing them to manipulate or escalate privileges. This behavior corresponds to the MITRE ATT&CK technique **"User Execution" (T1204.001)**, indicative of initial access techniques leveraging user interaction to compromise the system.

  Primary telemetry sources for this detection include Linux shell command logs, specifically monitoring command execution history and relevant system logs like `bash_history`. The security impact could range from unauthorized access to privilege escalation if successful. However, this detection does NOT confirm malicious activity on its own, as creating symbolic links can occur for benign administrative reasons.

  ### Investigation Steps

  - **Review command execution logs:** Check `/var/log/auth.log` or `bash_history` for instances of `"ln -s -f /etc/passwd"` or `"ln -s /etc/passwd"`. Monitor for suspicious user accounts that do not normally perform these operations.

  - **Validate process ownership:** Investigate the user context in which the command was run. Legitimate commands are typically executed by root or authorized administrative accounts; unusual invocations by non-administrative users may indicate malicious intent.

  - **Check recent file modifications:** Look at `ls -l /etc/passwd` to see if the timestamp aligns with the command. If the link creation was a prelude to an access attempt, there might be an associated change in the `/etc/passwd` file or a symlink in the typical locations.

  - **Identify source process:** Utilize Sysmon or audit logs to trace the parent process of the command, checking for unusual hierarchies or relationships that could indicate exploitation (Event ID 4688 for process creation can be pertinent).

  - **Assess user behavior anomalies:** Review logs for unusual login patterns, such as logins from unfamiliar IP addresses or times that deviate from established user behavior, which could support an adversary's attempt to manipulate `/etc/passwd`.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of the affected system file and the likelihood of being exploited by adversaries. The behavior detected is not commonly associated with standard operational practices, increasing suspicion of malicious intent.

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete logging of command executions, particularly if shell history is not fully captured or archived. Evasion techniques may include using indirect methods to modify `/etc/passwd`, such as alternate method calls through scripts. Legitimate administrative tasks may inadvertently trigger this alert, especially in environments where symlinks are used for setup or maintenance purposes. A related detection, such as monitoring for unauthorized changes to `/etc/passwd` or the creation of other suspicious symlinks, can enhance coverage and validation of malicious activities.

