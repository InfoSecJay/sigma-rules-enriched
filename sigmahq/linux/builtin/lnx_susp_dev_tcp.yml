note: |
  ### Technical Context

  This Sigma rule detects the use of `/dev/tcp` in command execution, which is often utilized by attackers to initiate reverse shells or establish covert communication channels to command and control servers. The likely attacker objective is to execute remote commands on a compromised system or to transfer data out of the environment without raising suspicion. This behavior aligns with the MITRE ATT&CK tactic of "Command and Control" (TA0011), specifically the technique for "Application Layer Protocol" (T1071).

  The primary telemetry source for this detection is Linux shell command history logs or audit logs, with specific commands divulging abnormal network connections. If malicious, the impact could be significant, enabling an adversary to maintain persistent, undetected access. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative functions or scripting may exhibit similar behavior.

  ### Investigation Steps

  - **Review command history for `/dev/tcp` usage**: Check bash history located at `/home/<user>/.bash_history` for any commands using `/dev/tcp/`, `/dev/udp/`, or related patterns that indicate network communication setup.

  - **Inspect system logs for anomalous behavior**: Use `ausearch -m EXECVE -ts recent` to find executions related to suspicious commands. Look for sudden spikes in shell command executions from non-standard users or accounts.

  - **Validate network connections**: Run `netstat -tuln` or `ss -tuln` on the affected host to identify active TCP/UDP connections. Compare these with the expected state – legitimate connections will typically only involve known services and trusted clients.

  - **Identify legitimate usages of `/dev/tcp`**: Investigate whether there are business-critical scripts or applications that legitimately employ `/dev/tcp`. Check deployment documentation or speak with IT administrators regarding known scripts.

  - **Collect and analyze process activity**: Check for process execution events that correspond with `/dev/tcp`. Focus on Security Event ID 4688 showing command line arguments indicating reverse shell behavior.

  - **Determine user roles of detected commands**: Assess the context in which `/dev/tcp/` commands were run. Commands issued by users with non-administrative roles or in unusual timeframes may raise higher suspicion.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant security implications if the command is utilized maliciously. Given that such network features can be exploited easily for covert communications, the likelihood of abuse is high, especially within environments lacking strict monitoring protocols.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of benign usage by administrators for troubleshooting or testing. Additionally, tools that log user commands must be properly configured; without adequate logging, detection could be missed. Legitimate development activities or automated scripts invoking bash functionalities may trigger this alert. A related detection such as “Outbound connection attempts with unusual processes” could provide complementary coverage for this detection.

