note: |
  ### Technical Context

  This Sigma rule detects suspicious modifications to the crontab file on Linux systems. Such modifications may indicate an attacker’s attempt to establish persistent access by scheduling malicious tasks. The likely attacker objective is to execute arbitrary commands at regular intervals, aligning with the MITRE ATT&CK tactic of Persistence and the technique T1053.003 (Scheduled Task/Job - Cron Job). Primary telemetry sources include system logs associated with the cron service, particularly changes to the crontab files. If these changes are malicious, they could lead to unauthorized access, data exfiltration, or further compromise of the system. This detection does NOT confirm that the modification is malicious on its own—further investigation is required to contextualize the changes.

  ### Investigation Steps

  - **Verify crontab changes:** Review the cron daemon logs (usually found in `/var/log/cron`) for entries indicating additions, deletions, or modifications to the crontab within a relevant time frame. Check for entries that indicate the use of 'REPLACE'.

  - **Correlate with user activity:** Identify the user account making the changes by examining user login logs (e.g., `/var/log/auth.log` or `last command`). If the user is not typically associated with crontab modifications, this could indicate malicious activity.

  - **Check for unusual cron job patterns:** Look for cron jobs that execute scripts or commands not typically expected in the environment, such as calls to unusual binaries or external URLs. Cross-reference with known legitimate job patterns for the specific user.

  - **Audit for additional persistence mechanisms:** Review for any accompanying indicators of persistence, such as the presence of suspicious startup scripts (e.g., `/etc/init.d/`) or other scheduling mechanisms, which may indicate a broader compromise.

  - **Examine file integrity:** Verify the integrity of the crontab files located at `/var/spool/cron/crontabs/` by checking their timestamps and sizes against baseline values or expected configurations.

  ### Prioritization

  The alert severity is medium due to the potential impact on system integrity and its role in establishing persistence. While legitimate users may modify cron jobs for valid purposes, the likelihood of malicious abuse makes this a notable indicator. This behavior is weaponized by adversaries for establishing long-term access, thus warranting a timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of overly broad cron logging configurations or lack of monitoring on certain log repositories. Legitimate administrative activity can trigger this alert, especially during maintenance windows. A related detection, such as monitoring for abnormal user privilege escalation (e.g., sudo logs), can complement and strengthen coverage against potential threats.

