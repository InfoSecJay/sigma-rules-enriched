note: |
  ### Technical Context

  This Sigma rule detects commands commonly used to delete or clear the syslog on Linux systems. An attacker may aim to erase forensic evidence of their activities, impede detection, or disrupt logging services, especially after executing malicious code. The relevant MITRE ATT&CK tactics include Impact (TA0040) and Data Manipulation (T1565.001). The primary telemetry source for this detection is the command line or shell logs, capturing commands executed by users or processes.

  If this behavior is confirmed as malicious, it could lead to successful evasion of incident response measures and allow for undetected presence on the compromised system. However, it’s important to note that this detection does NOT confirm malicious intent by itself, as legitimate system administration tasks or log rotation processes can also trigger the rule.

  ### Investigation Steps

  - **Review shell command history:** Examine the user's command history (e.g., `history` command) to identify any commands related to syslog deletion or manipulation (e.g., `rm /var/log/syslog`). Look for commands executed by unusual user accounts or timeframes.

  - **Check syslog timestamps:** Confirm syslog modification or creation timestamps, specifically looking for significant time gaps or unexpected clearing times that diverge from normal activity patterns. This can be derived from log entries correlated with `syslog` file metadata.

  - **Evaluate user privileges:** Identify the user account or process that executed the detected commands. User ID (UID) and Group ID (GID) context should be analyzed, ensuring actions are consistent with normal administrative user behavior.

  - **Identify related log configurations:** Investigate any log rotation configurations or scripts scheduled in `cron` jobs or systemd timers. These should have clear timestamps indicating routine maintenance rather than suspicious activity; specifically check for last execution times of `logrotate`.

  - **Determine potential indicators of compromise:** Look for unfamiliar binaries or scripts in places like `/tmp` or `/var/tmp` that might indicate pre-active behavior before syslog manipulation. High-priority indicators include processes that reveal unusual user agents or abnormal network activity.

  ### Prioritization

  Given the potential impact on visibility and system integrity, alerts from this detection are high-priority. If the syslog is cleared by an adversary, it may indicate early stages of a compromise or ongoing malicious activity, making it essential to investigate promptly. This behavior is often weaponized in attack scenarios to hinder detection.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via alternate commands or custom scripts that accomplish similar log clearing without using recognized commands. It is essential that log sources for shell command execution are correctly configured to capture all user and system commands reliably. Additionally, legitimate activities, such as planning for log rotation or manual log cleanup by administrators, may falsely trigger this alert. Companion detections may include monitoring for unusual user behavior or file access patterns that strengthen identification of broader attack tactics.

