title: Suspicious Reverse Shell Command Line
id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
status: test
description: Detects suspicious shell commands or program code that may be 
  executed or used in command line to establish a reverse shell
references:
- https://alamot.github.io/reverse_shells/
author: Florian Roth (Nextron Systems)
date: 2019-04-02
modified: 2021-11-27
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
detection:
  keywords:
  - 'BEGIN {s = "/inet/tcp/0/'
  - 'bash -i >& /dev/tcp/'
  - 'bash -i >& /dev/udp/'
  - 'sh -i >$ /dev/udp/'
  - 'sh -i >$ /dev/tcp/'
  - '&& while read line 0<&5; do'
  - '/bin/bash -c exec 5<>/dev/tcp/'
  - '/bin/bash -c exec 5<>/dev/udp/'
  - 'nc -e /bin/sh '
  - '/bin/sh | nc'
  - 'rm -f backpipe; mknod /tmp/backpipe p && nc '
  - ';socket(S,PF_INET,SOCK_STREAM,getprotobyname("tcp"));if(connect(S,sockaddr_in($p,inet_aton($i))))'
  - ';STDIN->fdopen($c,r);$~->fdopen($c,w);system$_ while<>;'
  - '/bin/sh -i <&3 >&3 2>&3'
  - 'uname -a; w; id; /bin/bash -i'
  - '$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2); $stream.Write($sendbyte,0,$sendbyte.Length);
    $stream.Flush()};'
  - ';os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);os.putenv(''HISTFILE'',''/dev/null'');'
  - '.to_i;exec sprintf("/bin/sh -i <&%d >&%d 2>&%d",f,f,f)'
  - ';while(cmd=c.gets);IO.popen(cmd,"r"){|io|c.print'
  - 'socat exec:''bash -li'',pty,stderr,setsid,sigint,sane tcp:'
  - 'rm -f /tmp/p; mknod /tmp/p p &&'
  - ' | /bin/bash | telnet '
  - ',echo=0,raw tcp-listen:'
  - 'nc -lvvp '
  - 'xterm -display 1'
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects suspicious command line patterns typically associated with establishing reverse shells on Linux systems. Adversaries may leverage reverse shells to maintain access to compromised systems, facilitating command and control communication. This behavior aligns with the **Execution** tactic and the **Command-Line Interface** technique (T1059.004) within the MITRE ATT&CK framework. The primary telemetry source is Linux shell command logs, which may include Bash command histories or system logs capturing command execution. If malicious, this behavior can lead to unauthorized remote access and potential exploitation of other systems in the network. Importantly, this detection alone does NOT confirm successful reverse shell establishment, as additional context is needed to ascertain whether observed commands were executed successfully or were part of legitimate administrative tasks.

  ### Investigation Steps

  - **Review command execution logs:** Examine `/var/log/auth.log` or `/var/log/syslog` for Shell command history entries related to known reverse shell patterns (look for commands containing `bash -i >& /dev/tcp/`, `nc`, or `socat`).

  - **Identify user context:** Determine the user account associated with the suspicious command execution. Review `who` or `last` commands in the terminal or log files to assess if the user has legitimate access rights.

  - **Correlate with additional telemetry:** Check for related processes using Sysinternals tools or `ps aux | grep -E 'bash|nc|socat'` to see if they are running alongside normal services or were spawned by unusual parent processes.

  - **Compare against baseline activity:** Analyze historical command execution patterns for the affected system to identify deviations. Look for legitimate administrative commands that might explain similar outputs.

  - **Look for network connections:** Investigate network logs (using `netstat -tulnp` or external tools) to identify any active outbound connections to suspicious IP addresses or unusual ports that correspond with the usage of reverse shell commands.

  - **Evaluate system role and criticality:** If the system involved is a critical asset (e.g., a web server, database, or domain controller), prioritize investigations that could confirm or deny potential compromises due to the significant impact on overall security posture.

  ### Prioritization

  This alert has a high severity due to its potential impact; reverse shells provide adversaries with significant control over compromised systems. The likelihood of malicious abuse is notable, as this behavior is common in exploitation and lateral movement stages of attacks. Given the prevalence of this technique among threat actors, it warrants immediate attention.

  ### Blind Spots and Assumptions

  Detection may be limited by custom command-line obfuscation techniques that evade keyword searches. Ensure that systems are configured to capture detailed command logs for comprehensive monitoring. Legitimate activities that may trigger this alert include the execution of approved admin scripts, especially during system maintenance or development tasks. Companion detections, such as monitoring for anomalous inbound or outbound connections (e.g., unexpected use of `curl` or `wget`), can strengthen coverage to combat this type of attack.

