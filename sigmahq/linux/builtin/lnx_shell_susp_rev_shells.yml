title: Suspicious Reverse Shell Command Line
id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
status: test
description: Detects suspicious shell commands or program code that may be executed
  or used in command line to establish a reverse shell
references:
- https://alamot.github.io/reverse_shells/
author: Florian Roth (Nextron Systems)
date: 2019-04-02
modified: 2021-11-27
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
detection:
  keywords:
  - 'BEGIN {s = "/inet/tcp/0/'
  - 'bash -i >& /dev/tcp/'
  - 'bash -i >& /dev/udp/'
  - 'sh -i >$ /dev/udp/'
  - 'sh -i >$ /dev/tcp/'
  - '&& while read line 0<&5; do'
  - '/bin/bash -c exec 5<>/dev/tcp/'
  - '/bin/bash -c exec 5<>/dev/udp/'
  - 'nc -e /bin/sh '
  - '/bin/sh | nc'
  - 'rm -f backpipe; mknod /tmp/backpipe p && nc '
  - ';socket(S,PF_INET,SOCK_STREAM,getprotobyname("tcp"));if(connect(S,sockaddr_in($p,inet_aton($i))))'
  - ';STDIN->fdopen($c,r);$~->fdopen($c,w);system$_ while<>;'
  - '/bin/sh -i <&3 >&3 2>&3'
  - 'uname -a; w; id; /bin/bash -i'
  - '$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2); $stream.Write($sendbyte,0,$sendbyte.Length);
    $stream.Flush()};'
  - ';os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);os.putenv(''HISTFILE'',''/dev/null'');'
  - '.to_i;exec sprintf("/bin/sh -i <&%d >&%d 2>&%d",f,f,f)'
  - ';while(cmd=c.gets);IO.popen(cmd,"r"){|io|c.print'
  - 'socat exec:''bash -li'',pty,stderr,setsid,sigint,sane tcp:'
  - 'rm -f /tmp/p; mknod /tmp/p p &&'
  - ' | /bin/bash | telnet '
  - ',echo=0,raw tcp-listen:'
  - 'nc -lvvp '
  - 'xterm -display 1'
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious command line patterns associated with potential reverse shell activities on Linux systems. Attackers may use reverse shells to remotely control compromised machines, exfiltrate data, or further penetrate network defenses. Common scenarios include initial penetration by exploiting vulnerabilities in software or leveraging phishing attacks, followed by establishing command and control (C2) channels via reverse shells to maintain persistence and execute malicious payloads.

  The rule targets commands that employ commonly used techniques for setting up reverse shells, as outlined in the MITRE ATT&CK framework. The relevant tactics include **Execution** (TA0002) and the specific technique **Command and Scripting Interpreter: Unix Shell (T1059.004)**, emphasizing the significance of shell command interactions. These patterns are critical in identifying attempts to circumvent standard defenses and malicious actions that could lead to expanded compromise of the network.

  Primary data sources for detection include:
  - Process creation events capturing command line arguments,
  - Syslog messages that log user command executions,
  - Auditing logs that record user activity in shell environments.

  ### Investigation Steps
  - **Review Process Creation Logs:** Analyze logs for command line arguments that match the suspicious patterns specified in the detection rule. Look for unusual user accounts or processes initiated outside of typical operating hours.
  - **Investigate Network Connections:** Check for outbound connections to uncommon IP addresses or domains that correlate with identified reverse shell behavior. Pay attention to connection attempts on non-standard ports.
  - **Analyze Syslog Entries:** Examine relevant syslog entries for any shell access logs that coincide with the timing of the detected command executions. This can provide context about legitimate versus suspicious user activity.
  - **Inspect User Account Activity:** Review the access credentials and privilege levels associated with users who executed the suspicious commands. Look for unexpected elevation or unusual account behavior.

  ### Prioritization
  Given the potential impact of a successful reverse shell establishment, which can lead to further exploitation and data loss, this alert should be treated with high priority. The likelihood of exploitation through reverse shells is a significant concern within enterprise environments.

  ### Blind Spots and Assumptions
  The detection logic may miss some reverse shell techniques that employ obfuscation or encryption to disguise the commands executed. Additionally, if process creation logging is not enabled or properly configured, there may be gaps in visibility, leading to incomplete data for analysis. The detection primarily relies on the assumption that malicious actors will employ recognizable patterns and that all relevant logging mechanisms are operational and capturing the necessary telemetry to support detection.

