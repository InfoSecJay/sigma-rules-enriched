logsource:
  product: linux
  service: sshd
detection:
  keywords:
  - 'unexpected internal error'
  - 'unknown or unsupported key type'
  - 'invalid certificate signing key'
  - 'invalid elliptic curve value'
  - 'incorrect signature'
  - 'error in libcrypto'
  - 'unexpected bytes remain after decoding'
  - 'fatal: buffer_get_string: bad string'
  - 'Local: crc32 compensation attack'
  - 'bad client public DH value'
  - 'Corrupted MAC on input'
  condition: keywords
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors for specific error messages generated by the OpenSSH daemon (sshd) that may indicate potential exploitation attempts or misconfiguration issues. Errors such as "unknown or unsupported key type" and "invalid elliptic curve value" signal that an attacker might be attempting to use unsupported keys, potentially indicative of brute-force or key-based authentication attacks. Overall, the rule aims to catch abnormal behavior that deviates from standard SSH operations, enhancing the organization's defenses against unauthorized access.

  Attackers typically exploit vulnerabilities in SSH setups to gain unauthorized access to systems, leveraging methods to bypass authentication mechanisms. Such exploitation could lead to further lateral movement within the network or data exfiltration. The relevant MITRE ATT&CK tactics include **Initial Access (TA0001)** and techniques like **Exploitation of Public-Facing Application (T1190)**, which highlight the exploitation journey of an attacker.

  Primary data sources for this detection include logs generated by the SSH daemon (sshd) on Linux systems, as these will contain the relevant error messages that trigger this rule. Monitoring this log source is crucial for identifying malicious activities or misconfigurations that could pose security risks.

  ### Investigation Steps
  - **Review sshd Logs:** Investigate the SSH daemon logs for the detected error messages and associated timestamps. Look for patterns of repeated errors that may indicate brute-force attempts or other malicious behaviors.

  - **Analyze Connection Attempts:** Check for unusual or unauthorized SSH connection attempts leading to the logged errors. Identify the originating IP addresses and verify their legitimacy against your baseline of known hosts.

  - **Cross-reference User Activities:** Compare the failing SSH attempts with user account activities. Look for accounts that display abnormal behavior patterns, such as connections at unusual hours or multiple failed attempts in a short timeframe.

  - **Examine System and Network Configurations:** Assess the SSH daemon configurations for any weak settings that could increase vulnerability. Additionally, verify firewall and network configurations to ensure that only authorized IP ranges can access SSH.

  ### Prioritization
  The severity of this alert is medium due to the potential for initial access penetration attempts on critical systems. Given SSH's ubiquity in managing Linux environments, any abnormal SSH error messages warrant investigation to prevent unauthorized access.

  ### Blind Spots and Assumptions
  This detection rule may have coverage gaps regarding SSH connections that do not log errors or leverage alternative SSH implementations with different error messaging. The logic assumes that all legitimate and expected SSH connection attempts will be logged accurately, requiring comprehensive configuration and logging to ensure no critical events are missed. Without properly configured logging on the SSH service, this alert may fail to trigger or produce false negatives.

