title: Linux Command History Tampering
id: fdc88d25-96fb-4b7c-9633-c0e417fdbd4e
status: test
description: |
  Detects commands that try to clear or tamper with the Linux command history.
  This technique is used by threat actors in order to evade defenses and execute commands without them being recorded in files such as "bash_history" or "zsh_history".
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.003/T1070.003.md
- https://www.hackers-arise.com/post/2016/06/20/covering-your-bash-shell-tracks-antiforensics
- https://www.cadosecurity.com/spinning-yarn-a-new-linux-malware-campaign-targets-docker-apache-hadoop-redis-and-confluence/
author: Patrick Bareiss
date: 2019-03-24
modified: 2024-04-17
tags:
- attack.stealth
- attack.t1070.003
logsource:
  product: linux
detection:
  keywords:
  - 'cat /dev/null >*sh_history'
  - 'cat /dev/zero >*sh_history'
  - 'chattr +i*sh_history'
  - 'echo "" >*sh_history'
  - 'empty_bash_history'
  - 'export HISTFILESIZE=0'
  - 'history -c'
  - 'history -w'
  - 'ln -sf /dev/null *sh_history'
  - 'ln -sf /dev/zero *sh_history'
  - 'rm *sh_history'
  - 'shopt -ou history'
  - 'shopt -uo history'
  - 'shred *sh_history'
  - 'truncate -s0 *sh_history'
        # - 'unset HISTFILE'  # prone to false positives
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule flags suspicious commands executed in Linux that manipulate or clear command history files, targeting files like "bash_history" or "zsh_history." The primary goal of this behavior is to hinder forensic analysis or detection of malicious actions taken during a session. Such tactics are commonly employed in post-exploitation scenarios by attackers aiming to maintain access while avoiding detection. This activity maps to MITRE ATT&CK technique T1070.003 – "Timestomp" under the "Defense Evasion" tactic.

  The primary telemetry source is the Linux shell command execution log, which records commands run by users. This includes details on the invoked commands, the user initiating those commands, and the timestamp. If malicious, such behavior can indicate a compromised system with rogue activity. Importantly, this detection alone does not confirm malicious intent or compromise, as legitimate users may also execute these commands during routine administration.

  ### Investigation Steps

  - **Identify command history manipulations**: Search the shell command audit logs for evidence of commands involving history manipulation, especially focusing on keywords such as `history -c`, `echo "" >*sh_history`, or `rm *sh_history`. Check Event ID 4720 or similar for potential command history edits.

  - **Correlate with user privileges**: Validate the user context by checking the UID associated with the command history tampering. Administrative users executing these commands may suggest benign activity; however, unauthorized users doing so should raise concern.

  - **Review post-execution behavior**: Examine subsequent executed commands within the same session to assess if malicious activity occurred before the history was cleared. Focus on commands related to sensitive data access, privilege escalation, or lateral movement.

  - **Look for related logs and artifacts**: Check for system logs in `/var/log/auth.log` to see if there were any recent login attempts or escalations beside the history manipulations. Investigate timestamps closely around the history-clearing commands.

  - **Identify legitimate activity patterns**: Common administrative behaviors such as regular history truncation over time for maintenance or running scripts that automatically clear history should be noted. Compare these with the context of the user’s role or job function.

  - **Check for high-confidence malicious indicators**: Identify any commands executed after history clearing that relate to known attack patterns, such as downloading files or executing network connections using tools like `curl` or `wget`.

  ### Prioritization

  This alert should be treated with high severity, particularly on critical systems like servers or databases. The likelihood of malicious abuse is significant when unauthorized users attempt to hide their activities, especially if the environment is under active threat. Such behavior is characteristic of advanced adversaries and indicates a potential compromise, necessitating immediate investigation.

  ### Blind Spots and Assumptions

  Detection can be limited by users with legitimate reasons to clear history, such as system administrators conducting maintenance. Additionally, ineffective logging configurations may lead to missed events if command execution logs are not captured correctly. Other commands, such as `unset HISTFILE`, are frequent false positives and may not indicate malicious activity. Deploying companion detection methods, like monitoring for unusual login patterns or command executions outside expected hours, can provide stronger coverage.

