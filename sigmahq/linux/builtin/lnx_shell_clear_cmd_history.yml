title: Linux Command History Tampering
id: fdc88d25-96fb-4b7c-9633-c0e417fdbd4e
status: test
description: |
  Detects commands that try to clear or tamper with the Linux command history.
  This technique is used by threat actors in order to evade defenses and execute commands without them being recorded in files such as "bash_history" or "zsh_history".
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.003/T1070.003.md
- https://www.hackers-arise.com/post/2016/06/20/covering-your-bash-shell-tracks-antiforensics
- https://www.cadosecurity.com/spinning-yarn-a-new-linux-malware-campaign-targets-docker-apache-hadoop-redis-and-confluence/
author: Patrick Bareiss
date: 2019-03-24
modified: 2024-04-17
tags:
- attack.defense-evasion
- attack.t1070.003
# Example config for this one (place it in .bash_profile):
#  (is_empty=false; inotifywait -m .bash_history | while read file; do if [ $(wc -l <.bash_history) -lt 1  ]; then if  [ "$is_empty" = false ]; then logger -i -p local5.info -t empty_bash_history "$USER : ~/.bash_history is empty "; is_empty=true; fi; else is_empty=false;  fi;  done ) &
#  It monitors the size of .bash_history and log the words "empty_bash_history" whenever a previously not empty bash_history becomes empty
#  We define an empty file as a document with 0 or 1 lines (it can be a line with only one space character for example)
#  It has two advantages over the version suggested by Patrick Bareiss  :
#    - it is not relative to the exact command used to clear .bash_history : for instance Caldera uses "> .bash_history" to clear the history and this is not one the commands listed here. We can't be exhaustive for all the possibilities !
#    - the method suggested by Patrick Bareiss logs all the commands entered directly in a bash shell. therefore it may miss some events (for instance it doesn't log the commands launched from a Caldera agent). Here if .bash_history is cleared, it will always be detected
logsource:
  product: linux
detection:
  keywords:
  - 'cat /dev/null >*sh_history'
  - 'cat /dev/zero >*sh_history'
  - 'chattr +i*sh_history'
  - 'echo "" >*sh_history'
  - 'empty_bash_history'
  - 'export HISTFILESIZE=0'
  - 'history -c'
  - 'history -w'
  - 'ln -sf /dev/null *sh_history'
  - 'ln -sf /dev/zero *sh_history'
  - 'rm *sh_history'
  - 'shopt -ou history'
  - 'shopt -uo history'
  - 'shred *sh_history'
  - 'truncate -s0 *sh_history'
        # - 'unset HISTFILE'  # prone to false positives
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects anomalous behaviors associated with tampering Linux command history files, such as clearing or altering `.bash_history` and similar shell history files. Attackers often employ these techniques as part of their efforts to evade detection, concealing their activities after executing malicious commands. The detected actions align with the MITRE ATT&CK framework under the tactic of Defense Evasion (T1070.003).

  The primary telemetry source for this rule includes Linux log files where executed shell commands are recorded, particularly focusing on any alterations to the content of history files. If successfully executed by an adversary, such actions can lead to significant security risks, including unobserved malicious activities that compromise system integrity. It is critical to note that this detection rule only indicates the occurrence of suspect commands; it does not confirm that an intrusion has occurred without further context or supporting evidence.

  ### Investigation Steps

  - **Identify command history alterations**: Review logs for command executions that include keywords like `cat /dev/null >*sh_history`, `history -c`, or `rm *sh_history`. Focus on Syslog entries related to command execution within `/var/log/syslog` or similar where history modifications are logged.

  - **Correlate user activities**: Look for a sudden spike in `bash` or `sh` sessions leading up to the execution of suspicious commands. Cross-reference `bash` process events (e.g., Event ID 2003, syslog entry for `bash`) to establish user patterns and determine if this aligns with normal user behavior or indicates potential malfeasance.

  - **Analyze system logging configurations**: Ensure logging of suspicious commands is appropriately configured. Validate that relevant history and command execution logs (like `/var/log/auth.log` or `/root/.bash_history`) are being collected, as historical logs may provide context around unexpected behavior.

  - **Review legitimate command usage patterns**: Compare the detected command executions against known legitimate activities, such as system maintenance or troubleshooting efforts. Confirm if these commands match operational documentation of expected admin tasks that may use similar commands.

  - **Identify high-confidence malicious indicators**: Observe sequences of commands that follow the history tampering events. Look for unusual network connections or file manipulations that may indicate exploitation, particularly if commands are executed with `sudo` or as root, which raises the potential for malicious intent.

  ### Prioritization

  The alert severity is high because it entails potential manipulation of logging information by a user or process that could signify an active intrusion. Given the critical nature of command history for forensic investigations, the likelihood of malicious intent associated with these behaviors is elevated, as such techniques are often employed by threat actors to cover their tracks.

  ### Blind Spots and Assumptions

  Detection is limited by the need for comprehensive logging configurations, as insufficient logging can lead to missed instances of command history modifications. Legitimate maintenance scripts or backups may inadvertently trigger alerts, including those from automated processes. A companion detection rule that monitors for unauthorized root access (e.g., unexpected `sudo` usage) could enhance overall coverage and offer additional context during investigations.

