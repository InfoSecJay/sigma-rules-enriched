title: Linux Command History Tampering
id: fdc88d25-96fb-4b7c-9633-c0e417fdbd4e
status: test
description: |
  Detects commands that try to clear or tamper with the Linux command history.
  This technique is used by threat actors in order to evade defenses and execute commands without them being recorded in files such as "bash_history" or "zsh_history".
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.003/T1070.003.md
- https://www.hackers-arise.com/post/2016/06/20/covering-your-bash-shell-tracks-antiforensics
- https://www.cadosecurity.com/spinning-yarn-a-new-linux-malware-campaign-targets-docker-apache-hadoop-redis-and-confluence/
author: Patrick Bareiss
date: 2019-03-24
modified: 2024-04-17
tags:
- attack.defense-evasion
- attack.t1070.003
# Example config for this one (place it in .bash_profile):
#  (is_empty=false; inotifywait -m .bash_history | while read file; do if [ $(wc -l <.bash_history) -lt 1  ]; then if  [ "$is_empty" = false ]; then logger -i -p local5.info -t empty_bash_history "$USER : ~/.bash_history is empty "; is_empty=true; fi; else is_empty=false;  fi;  done ) &
#  It monitors the size of .bash_history and log the words "empty_bash_history" whenever a previously not empty bash_history becomes empty
#  We define an empty file as a document with 0 or 1 lines (it can be a line with only one space character for example)
#  It has two advantages over the version suggested by Patrick Bareiss  :
#    - it is not relative to the exact command used to clear .bash_history : for instance Caldera uses "> .bash_history" to clear the history and this is not one the commands listed here. We can't be exhaustive for all the possibilities !
#    - the method suggested by Patrick Bareiss logs all the commands entered directly in a bash shell. therefore it may miss some events (for instance it doesn't log the commands launched from a Caldera agent). Here if .bash_history is cleared, it will always be detected
logsource:
  product: linux
detection:
  keywords:
  - 'cat /dev/null >*sh_history'
  - 'cat /dev/zero >*sh_history'
  - 'chattr +i*sh_history'
  - 'echo "" >*sh_history'
  - 'empty_bash_history'
  - 'export HISTFILESIZE=0'
  - 'history -c'
  - 'history -w'
  - 'ln -sf /dev/null *sh_history'
  - 'ln -sf /dev/zero *sh_history'
  - 'rm *sh_history'
  - 'shopt -ou history'
  - 'shopt -uo history'
  - 'shred *sh_history'
  - 'truncate -s0 *sh_history'
        # - 'unset HISTFILE'  # prone to false positives
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects potential tampering with Linux command history files, specifically when commands are issued to clear or manipulate files like `.bash_history` or `.zsh_history`. The likely objective of an attacker is to obscure their activities and prevent forensic analysis of their terminal commands, thus enabling further malicious actions without detection. This behavior relates to the MITRE ATT&CK technique T1070.003, which focuses on indicator removal through file manipulation.

  Primary telemetry sources include Linux shell command logs and audit logs that capture user command execution. If malicious, this activity significantly reduces the organization's ability to audit user actions and track potential breaches. Importantly, this detection alone does not confirm that an unauthorized intrusion has occurred, but rather indicates suspicious activity that requires further investigation.

  ---

  ### Investigation Steps

  - **Review recent command history modifications:** Investigate `/home/*/.bash_history` and `/home/*/.zsh_history` for unexpected clearings or modifications. Use `less` or `cat` to view the contents and check for recent changes. Look for timestamps that are inconsistent with user activity.

  - **Check for suspicious command execution:** Identify the process history leading up to the command that cleared the history. Use `ps -ef`, `history`, or audit logs to look for commands (e.g., `history -c`, `rm *.sh_history`) that were executed by users around the time of the timestamped modifications.

  - **Look for indicators of compromise:** Search for the use of commands like `chattr +i ~/.bash_history`, `truncate -s0 ~/.bash_history`, or `shred ~/.bash_history` in the shell logs (e.g., Syslog or shell auditing). Such commands typically indicate malicious intent when not aligned with typical user behavior.

  - **Validate user roles and responsibilities:** Confirm whether the user executing these commands has the necessary privileges for such actions. This can include reviewing user groups (e.g., `groups <username>`) to compare against expected roles, especially on critical systems.

  - **Identify normal user behavior:** Establish a baseline of legitimate activity by comparing with the historical command logs of users. For example, regular system maintenance by administrators may include common commands in history that do not clear historical logs.

  ---

  ### Prioritization

  Given the potential impact of command history tampering on system security and the likelihood that such behavior is a method of evasion for malicious activities, this detection should be treated with high priority. The manipulation of command logs is frequently observed as a tactic by adversaries to obscure evidence of unauthorized actions.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of less common commands or custom scripts to alter history files without triggering this rule. Ensure that accurate logging configurations are in place for effective detection, such as enabling shell command auditing. Legitimate activities, like automated scripts or maintenance operations performed by system administrators, may occasionally trigger this alert. Additionally, consider related detections for other forms of command or log tampering (e.g., monitoring access to `/etc/profile` for unauthorized edits).

