title: Suspicious Activity in Shell Commands
id: 2aa1440c-9ae9-4d92-84a7-a9e5f5e31695
status: test
description: Detects suspicious shell commands used in various exploit codes (see
  references)
references:
- https://web.archive.org/web/20170319121015/http://www.threatgeek.com/2017/03/widespread-exploitation-attempts-using-cve-2017-5638.html
- https://github.com/rapid7/metasploit-framework/blob/eb6535009f5fdafa954525687f09294918b5398d/modules/exploits/multi/http/struts_code_exec_exception_delegator.rb
- http://pastebin.com/FtygZ1cg
- https://artkond.com/2017/03/23/pivoting-guide/
author: Florian Roth (Nextron Systems)
date: 2017-08-21
modified: 2021-11-27
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
detection:
  keywords:
        # Generic suspicious commands
  - 'wget * - http* | perl'
  - 'wget * - http* | sh'
  - 'wget * - http* | bash'
  - 'python -m SimpleHTTPServer'
  - '-m http.server'            # Python 3
  - 'import pty; pty.spawn*'
  - 'socat exec:*'
  - 'socat -O /tmp/*'
  - 'socat tcp-connect*'
  - '*echo binary >>*'
        # Malware
  - '*wget *; chmod +x*'
  - '*wget *; chmod 777 *'
  - '*cd /tmp || cd /var/run || cd /mnt*'
        # Apache Struts in-the-wild exploit codes
  - '*stop;service iptables stop;*'
  - '*stop;SuSEfirewall2 stop;*'
  - 'chmod 777 2020*'
  - '*>>/etc/rc.local'
        # Metasploit framework exploit codes
  - '*base64 -d /tmp/*'
  - '* | base64 -d *'
  - '*/chmod u+s *'
  - '*chmod +s /tmp/*'
  - '*chmod u+s /tmp/*'
  - '* /tmp/haxhax*'
  - '* /tmp/ns_sploit*'
  - 'nc -l -p *'
  - 'cp /bin/ksh *'
  - 'cp /bin/sh *'
  - '* /tmp/*.b64 *'
  - '*/tmp/ysocereal.jar*'
  - '*/tmp/x *'
  - '*; chmod +x /tmp/*'
  - '*;chmod +x /tmp/*'
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potentially malicious shell commands that may indicate exploitation attempts on Linux systems. It focuses on command patterns commonly seen in various exploit codes, particularly those associated with remote code execution (RCE) vulnerabilities. The presence of these commands may suggest that an attacker is leveraging specific vulnerabilities to gain unauthorized access or control of the system, while executing arbitrary commands, deploying shell scripts, or establishing reverse shells.

  The attacker’s objective is typically to compromise a target system to perform malicious activities such as data exfiltration, lateral movement, or deploying additional malware. Given the wide range of command inputs captured by this detection rule, it aligns with the MITRE ATT&CK framework's tactics for Execution and specifically targets technique T1059.004 (Command and Scripting Interpreter: Unix Shell).

  Primary data sources for detecting this activity include process creation events, shell command logs, system audit logs from Linux devices, and any security logs from endpoint detection and response solutions that monitor for process execution.

  ### Investigation Steps
  - **Review Shell Command Logs:** Look for entries matching the detection keywords in shell command logs or Bash history files that may indicate exploitation attempts or execution of suspicious commands.

  - **Analyze Process Creation Events:** Utilize EDR tool capabilities to identify the creation of processes that correspond with the detected shell command patterns, isolating instances where the commands were executed.

  - **Correlate with Network Activities:** Investigate network logs for outgoing connections or data transfers originating from compromised endpoints, particularly those utilizing the detected commands for downloading or executing payloads.

  - **Inspect System Audit Logs:** Check system and application logs (e.g., syslog, auditd logs) for unusual service modifications or commands such as `chmod` or `service iptables stop`, which may signify changes made by an attacker.

  ### Prioritization
  Given the high likelihood of a significant impact from successful exploitation, such as system compromise or unauthorized data access, this alert warrants priority investigation. The commands detected are associated with known exploitation techniques, thus flagging them as high severity in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection may miss attacks that employ benign-looking commands or custom-built scripts that do not match the specified patterns. The rule assumes that all relevant log sources are configured correctly to capture the necessary command execution logs, which may not be the case in all environments. Ensuring proper logging levels and conditions on syslog and EDR solutions is essential for this detection to function effectively.

