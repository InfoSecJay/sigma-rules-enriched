logsource:
  product: linux
detection:
  keywords:
        # Generic suspicious commands
  - 'wget * - http* | perl'
  - 'wget * - http* | sh'
  - 'wget * - http* | bash'
  - 'python -m SimpleHTTPServer'
  - '-m http.server'            # Python 3
  - 'import pty; pty.spawn*'
  - 'socat exec:*'
  - 'socat -O /tmp/*'
  - 'socat tcp-connect*'
  - '*echo binary >>*'
        # Malware
  - '*wget *; chmod +x*'
  - '*wget *; chmod 777 *'
  - '*cd /tmp || cd /var/run || cd /mnt*'
        # Apache Struts in-the-wild exploit codes
  - '*stop;service iptables stop;*'
  - '*stop;SuSEfirewall2 stop;*'
  - 'chmod 777 2020*'
  - '*>>/etc/rc.local'
        # Metasploit framework exploit codes
  - '*base64 -d /tmp/*'
  - '* | base64 -d *'
  - '*/chmod u+s *'
  - '*chmod +s /tmp/*'
  - '*chmod u+s /tmp/*'
  - '* /tmp/haxhax*'
  - '* /tmp/ns_sploit*'
  - 'nc -l -p *'
  - 'cp /bin/ksh *'
  - 'cp /bin/sh *'
  - '* /tmp/*.b64 *'
  - '*/tmp/ysocereal.jar*'
  - '*/tmp/x *'
  - '*; chmod +x /tmp/*'
  - '*;chmod +x /tmp/*'
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects suspicious shell commands that are commonly utilized in exploitation attempts and malicious activity on Linux systems. The behavior being flagged includes commands that attempt to download and execute malicious payloads or change file permissions inappropriately, usually to escalate privileges or establish persistence. The likely attacker objective is to deploy malware, create backdoors, or manipulate system processes to maintain access.

  This behavior aligns with the MITRE ATT&CK technique for Command and Scripting Interpreter - Unix (T1059.004). Primary telemetry sources include Linux shell logs, specifically audit logs and command history files, capturing user command execution. The security impact can be significant, as it may indicate that an attacker has gained control over the system, allowing for data exfiltration or further network compromise. Importantly, this log does NOT confirm malicious intent or successful exploitation on its own; it merely indicates the presence of potentially harmful commands.

  ---

  ### Investigation Steps

  - **Examine command history logs**: Review `/home/<user>/.bash_history` or `/var/log/audit/audit.log` for the executed commands that triggered the alert, specifically looking for patterns consistent with the keywords in the rule (e.g., `wget`, `chmod`).
  - **Evaluate suspicious commands against known exploit patterns**: Validate any detected commands against historical data of known exploit frameworks or techniques, such as those referenced in the Sigma rule (e.g., Apache Struts or Metasploit).
  - **Identify a high-confidence malicious indicator**: If any commands involve `chmod 777` or similar permission changes on sensitive files, flag these for immediate review as they typically indicate an attempt to escalate privileges or establish persistence.
  - **Confirm legitimate usage in context**: Look for documentation or guidelines within your organization indicating whether any of the flagged commands are part of legitimate administrative tasks, especially related to application deployment or system maintenance.
  - **Assess system role and criticality**: Determine if the affected host is critical (e.g., a web server or a database server) and ensure incident response is prioritized accordingly, potentially leading to immediate containment actions.
  - **Review file modification timestamps**: Check timestamps in `/tmp` or other directories for file creation or modification around the time of the command executions, which can indicate if any breadcrumb files were created or used for malicious purposes.

  ---

  ### Prioritization

  This alert has high severity because it indicates potentially malicious command execution on Linux systems, which can lead to significant security breaches. The likelihood of malicious abuse is high due to the common usage of these shell commands in exploitation attempts. The behavior detected is frequently weaponized, especially in environments that are vulnerable to automated attack tools and scripts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by systems with low logging verbosity or restricted access to shell history, which could miss critical commands. Legitimate administrative tasks, such as system maintenance scripts or application deployments, may also trigger false positives. Ensure that audit logging is correctly configured to capture all necessary command executions. A related detection could involve monitoring for unusual file access patterns in `/tmp`, which could complement the alert and provide additional context on malicious behavior.

