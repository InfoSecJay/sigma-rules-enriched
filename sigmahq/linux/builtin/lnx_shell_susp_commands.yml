author: Florian Roth (Nextron Systems)
date: 2017-08-21
modified: 2021-11-27
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
detection:
  keywords:
        # Generic suspicious commands
  - 'wget * - http* | perl'
  - 'wget * - http* | sh'
  - 'wget * - http* | bash'
  - 'python -m SimpleHTTPServer'
  - '-m http.server'            # Python 3
  - 'import pty; pty.spawn*'
  - 'socat exec:*'
  - 'socat -O /tmp/*'
  - 'socat tcp-connect*'
  - '*echo binary >>*'
        # Malware
  - '*wget *; chmod +x*'
  - '*wget *; chmod 777 *'
  - '*cd /tmp || cd /var/run || cd /mnt*'
        # Apache Struts in-the-wild exploit codes
  - '*stop;service iptables stop;*'
  - '*stop;SuSEfirewall2 stop;*'
  - 'chmod 777 2020*'
  - '*>>/etc/rc.local'
        # Metasploit framework exploit codes
  - '*base64 -d /tmp/*'
  - '* | base64 -d *'
  - '*/chmod u+s *'
  - '*chmod +s /tmp/*'
  - '*chmod u+s /tmp/*'
  - '* /tmp/haxhax*'
  - '* /tmp/ns_sploit*'
  - 'nc -l -p *'
  - 'cp /bin/ksh *'
  - 'cp /bin/sh *'
  - '* /tmp/*.b64 *'
  - '*/tmp/ysocereal.jar*'
  - '*/tmp/x *'
  - '*; chmod +x /tmp/*'
  - '*;chmod +x /tmp/*'
  condition: keywords
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects suspicious shell commands commonly used in various exploits, particularly those employing tools like `wget`, `socat`, and `python` to execute malicious actions. The likely attacker objective is to download and execute payloads or maintain persistence by modifying system binaries and configurations. Relevant MITRE ATT&CK tactic includes Execution (TA0002) and specifically the technique for Command-Line Interface (T1059.004). The primary telemetry source is Linux command history logs and Syslog, capturing Event IDs that reflect terminal command executions. If malicious, this behavior could lead to a compromised host, potential data exfiltration, and lateral movement within the network. This detection does NOT confirm that an attack is occurring; it only flags potentially suspicious command usage that may require further investigation.

  ### Investigation Steps

  - **Review command execution history:** Check the user's command history file (e.g., `.bash_history`) for the specific commands listed in the detection, focusing on any unusual usage of `wget` or `socat`. Correlate by checking timestamps against unusual login times or unauthorized access patterns.

  - **Analyze process tree related to detected commands:** Examine the process entries in `/proc` for spawned children of suspicious commands (e.g., `wget` or `nc`). Check for any alerting parent processes that are legitimate and may have invoked the malicious behavior.

  - **Verify file creation and permissions changes:** Look in `/tmp`, `/var/run`, or other common exploit locations for newly created files or scripts (e.g., `/tmp/*.b64`). Validate the permissions of files against typical expected settings, checking for any unusual settings like `chmod 777`.

  - **Identify legitimate activities linked to command use:** Monitor known maintenance tasks or scripts that require commands like `wget` or `nc` for legitimate purposes, like software updates or network diagnostics, comparing their execution context and such typical use patterns to those of flagged activities.

  - **Investigate for lateral movement:** Review authentication logs (/var/log/auth.log) to identify if any accounts executed the flagged commands and whether they exhibited unauthorized access to sensitive systems or resources.

  - **Check for misconfigurations or anomalies in firewall rules:** Review logs of any firewall management commands, specifically for entries constraining traffic from services like Apache. Look for any valid service stop commands related to `iptables` or `SuSEfirewall2`, focusing on irregular usage patterns.

  ### Prioritization

  This alert is high severity due to the critical security implications associated with detected commands that might indicate malicious exploitation attempts on Linux systems. The likelihood of malicious abuse is significant, with many of these command patterns being frequently weaponized in real-world attacks, suggesting an immediate need for investigation if triggered.

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques such as command obfuscation, which could alter recognizable command patterns. Reliable detection requires appropriately configured Syslog or auditing to capture full command histories. Legitimate activities, like software downloads or system configuration changes by admins, may inadvertently trigger alerts. Related detection includes monitoring for unusual outbound connections via egress filtering rules, which can highlight exfiltration attempts complementing this rule.

