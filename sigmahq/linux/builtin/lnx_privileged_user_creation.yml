  ---

  ### Technical Context

  This Sigma rule detects the creation of new privileged users in Linux environments, specifically targeting instances where new user accounts are added to groups such as "root," "sudo," or "wheel." The likely attacker objective is to escalate privileges in order to gain elevated permissions on the system, which can allow unauthorized access to sensitive resources and manipulation of existing system configurations. This aligns with the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and technique T1136.001 (Create a New User).

  The primary telemetry sources required for this detection are system log files located at `/var/log/secure` for Red Hat-based systems and `/var/log/auth.log` for Debian-based systems. If this behavior is malicious, it poses a significant security impact, potentially enabling an attacker to maintain persistence or access critical system functions. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may also trigger these alerts.

  ---

  ### Investigation Steps

  - **Review relevant logs for new user creation:** Check `/var/log/secure` or `/var/log/auth.log` for lines containing `useradd` and verify the user attributes such as `UID` and `GID`. Legitimate entries will generally have non-root UIDs (e.g., UID > 1000) and typical GIDs (e.g., GID of a standard group).

  - **Identify elevated GIDs or UIDs:** Focus on any logged entries with `GID=0`, `GID=10` (wheel), or `GID=27` (sudo), indicating potential malicious creation of high-privilege users. Pay attention to the creation timestamp to assess if it coincides with any unauthorized access or suspicious activity.

  - **Cross-reference with access logs:** Identify whether the new privileged user has subsequently accessed critical assets or executed sensitive commands by checking command history logs or `bash_history` files, and looking for any unusual commands run by this user.

  - **Check for other security events:** Assess if there are any associated security events near the time of user creation (Event ID 4768, 4769 for Windows if applicable, or corresponding syslog events for Linux), which may indicate a cohesive attack strategy leveraging multiple techniques.

  - **Review administrative activity:** Validate whether the creation of this user was initiated by an authorized administrator by correlating with internal change management records. Legitimate user accounts usually adhere to predictable naming conventions and are created during scheduled maintenance windows.

  - **Monitor for suspicious user behavior:** Set up alerts to watch for unusual login behavior or account misuse by the newly created users, such as logging in from unfamiliar IP addresses or executing sensitive commands that exceed typical user privileges.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential for unauthorized privilege escalation and risk to the integrity of the system. Given that creating high-privileged user accounts is often a precursor to more severe attacks, it is critical to investigate promptly. The likelihood of malicious exploitation is significant, particularly if the creation occurs outside of standard administrative operations.

  ---

  ### Blind Spots and Assumptions

  The detection has limitations, as it may not capture user creation performed through stealthy means or without logging enabled, such as through certain configuration changes or system manipulation. Ensure that logging is properly configured on all relevant Linux systems to achieve reliable detection. Legitimate administrative activities, particularly in a highly regulated environment, can also trigger the alert, necessitating contextual understanding. Additionally, companion detections, such as monitoring for user logins and command execution patterns, can enhance coverage and support the investigative process.

