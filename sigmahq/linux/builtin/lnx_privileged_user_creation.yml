title: Privileged User Has Been Created
id: 0ac15ec3-d24f-4246-aa2a-3077bb1cf90e
status: test
description: Detects the addition of a new user to a privileged group such as "root"
  or "sudo"
references:
- https://digital.nhs.uk/cyber-alerts/2018/cc-2825
- https://linux.die.net/man/8/useradd
- https://github.com/redcanaryco/atomic-red-team/blob/25acadc0b43a07125a8a5b599b28bbc1a91ffb06/atomics/T1136.001/T1136.001.md#atomic-test-5---create-a-new-user-in-linux-with-root-uid-and-gid
author: Pawel Mazur
date: 2022-12-21
modified: 2025-01-21
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1136.001
- attack.t1098
logsource:
  product: linux
  definition: '/var/log/secure on REHL systems or /var/log/auth.log on debian like
    Systems needs to be collected in order for this detection to work'
detection:
    # Example of the events that could be observed when matching these would be as follow
    #   Dec 21 16:42:19 testserver useradd[1337]: new user: name=butter1, UID=1000, GID=0, home=/root, shell=/bin/bash
    #   Dec 21 17:13:54 testserver useradd[1337]: new user: name=john, UID=0, GID=0, home=/home/john, shell=/bin/bash
    #   Dec 21 17:24:40 testserver useradd[1337]: new user: name=butter3, UID=1000, GID=10, home=/home/butter3, shell=/bin/bash
    #   Dec 21 17:30:22 testserver useradd[1337]: new user: name=butter4, UID=1000, GID=27, home=/home/butter4, shell=/bin/bash
  selection_new_user:
  - 'new user'
  selection_uids_gids:
  - 'GID=0,'       # root group
  - 'UID=0,'       # root UID
  - 'GID=10,'       # wheel group
  - 'GID=27,'       # sudo group
  condition: all of selection_*
falsepositives:
- Administrative activity
level: high
note: |
  ### Technical Context
  This rule detects the creation of a new user who is assigned to a privileged group, such as "root" or "sudo", on Linux systems. An attacker may leverage this capability to escalate privileges within the environment, which can lead to unauthorized access to sensitive information or resources. By adding themselves or a malicious account to a privileged group, an attacker can maintain persistent access and execute administrative commands undetected. This behavior can be indicative of a compromised user account or a malicious insider threat.

  The relevant MITRE ATT&CK tactics and techniques for this detection are:
  - **Persistence (T1136.001)**: Creating new accounts or modifying existing account privileges to maintain access.
  - **Privilege Escalation (T1098)**: Gaining higher-level permissions on a system or network.

  Primary data sources that will contain the best evidence for these activities include:
  - **Authentication Logs**: `/var/log/secure` on Red Hat-based systems or `/var/log/auth.log` on Debian-based systems. These logs will record the `useradd` events that signify the creation of privileged users.

  ### Investigation Steps
  - **Review Authentication Logs**: Check `/var/log/secure` or `/var/log/auth.log` for any `useradd` commands that indicate the creation of new users, particularly those with IDs or groups that grant elevated privileges.
  - **Correlate with System Changes**: Investigate any recent changes in system configurations or suspicious logins around the time the privileged user was created to determine if this was part of a larger attack.
  - **Verify User Activity**: Examine the command history for the newly created users to assess their actions and whether they exhibit any malicious intent or abnormal behavior.
  - **Check for Other Anomalous Events**: Implement queries on other telemetry sources, such as EDR or NDR logs, to identify any further unusual activities that may coincide with the addition of privileged users.

  ### Prioritization
  The alert has a high severity due to the critical impact that unauthorized privilege escalation can have on an enterprise environment. The likelihood of exploitation is increased if such activities are carried out by an attacker with existing access to the environment.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate administrative activity that might lead to false positives, such as systems administrators creating new users for operational purposes. The detection logic assumes that the system logs for user creation events are properly configured and collected; otherwise, the alert may miss crucial data. If logging is not enabled for these operations, the detection will not function as intended. Proper logging configurations, as stated in the log source section, are essential for accurate detection of these activities.

