title: Privileged User Has Been Created
id: 0ac15ec3-d24f-4246-aa2a-3077bb1cf90e
status: test
description: Detects the addition of a new user to a privileged group such as 
  "root" or "sudo"
references:
- https://digital.nhs.uk/cyber-alerts/2018/cc-2825
- https://linux.die.net/man/8/useradd
- https://github.com/redcanaryco/atomic-red-team/blob/25acadc0b43a07125a8a5b599b28bbc1a91ffb06/atomics/T1136.001/T1136.001.md#atomic-test-5---create-a-new-user-in-linux-with-root-uid-and-gid
author: Pawel Mazur
date: 2022-12-21
modified: 2025-01-21
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1136.001
- attack.t1098
logsource:
  product: linux
  definition: '/var/log/secure on REHL systems or /var/log/auth.log on debian like
    Systems needs to be collected in order for this detection to work'
detection:
    # Example of the events that could be observed when matching these would be as follow
    #   Dec 21 16:42:19 testserver useradd[1337]: new user: name=butter1, UID=1000, GID=0, home=/root, shell=/bin/bash
    #   Dec 21 17:13:54 testserver useradd[1337]: new user: name=john, UID=0, GID=0, home=/home/john, shell=/bin/bash
    #   Dec 21 17:24:40 testserver useradd[1337]: new user: name=butter3, UID=1000, GID=10, home=/home/butter3, shell=/bin/bash
    #   Dec 21 17:30:22 testserver useradd[1337]: new user: name=butter4, UID=1000, GID=27, home=/home/butter4, shell=/bin/bash
  selection_new_user:
  - 'new user'
  selection_uids_gids:
  - 'GID=0,'       # root group
  - 'UID=0,'       # root UID
  - 'GID=10,'       # wheel group
  - 'GID=27,'       # sudo group
  condition: all of selection_*
falsepositives:
- Administrative activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a new user assigned to privileged groups such as "root" or "sudo" on Linux systems. The likely attacker objective is to gain elevated privileges, maintain persistence, or facilitate lateral movement within a network. This activity aligns with the MITRE ATT&CK techniques for privilege escalation (T1136.001) and persistence (T1098). The primary telemetry sources for this detection are the authentication and security logs located at `/var/log/secure` on Red Hat-based systems and `/var/log/auth.log` on Debian-based systems. If malicious, this behavior could lead to unauthorized command execution with administrative privileges. However, this detection does NOT confirm malicious intent on its own; legitimate administrative activities may also trigger the alert.

  ### Investigation Steps

  - **Verify user creation details:** Review the entries in `/var/log/secure` or `/var/log/auth.log` for events matching "new user" containing GID=0 (root) or UID=0 (root). Identify the username and the originating command to ascertain context.

  - **Identify administrative representatives:** Check if the user creation was part of expected administrative activity—cross-reference the date and time against scheduled maintenance or access logs to verify legitimacy.

  - **Correlate with account activity:** Investigate subsequent login attempts by the created user using SSH logs (`/var/log/secure` or `auth.log`) for increased confidence. Focus on Event IDs reporting logins or authentication attempts after user creation.

  - **Analyze host role:** Determine the criticality of the host where the new user was created. Assess if the system hosts sensitive applications or data, which could elevate the impact of a compromised privileged user.

  - **Examine user permissions:** Check the new user's group memberships using commands like `id username` to determine if they possess elevated permissions beyond expected roles.

  ### Prioritization

  This alert is considered high priority due to the potential impact of unauthorized privilege escalation on critical systems. Elevated privileges can significantly increase an adversary's access and capability to execute malicious activities. This behavior is commonly weaponized in attacks aiming for persistence and lateral movement.

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not comprehensively collected or if legitimate processes create users without appropriate oversight. The rule may also generate false positives due to regular administrative activities like onboarding or role changes. A related detection for monitoring changes to existing user privileges or group memberships could strengthen coverage, ensuring that unauthorized alterations are identified promptly.

