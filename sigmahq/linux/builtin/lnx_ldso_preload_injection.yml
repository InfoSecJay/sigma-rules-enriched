note: |
  ### Technical Context

  This Sigma rule detects the presence of a `ld.so.preload` file, which can be used by attackers to inject malicious shared libraries into the execution environment of applications. The likely objective of an attacker utilizing this technique is to escalate privileges or persistently execute code without alerting typical defensive mechanisms. This behavior aligns with the MITRE ATT&CK tactic for Persistence and the technique T1574.006 (Loadable Kernel Module and Driver).

  The primary telemetry source for this detection is a Linux file system event log. Specifically, the presence or modification of the `/etc/ld.so.preload` file can indicate malicious intent. If exploited, this could allow an adversary to gain extensive control over the system or evade detection from security tools. It is important to note that this detection does NOT confirm malicious action on its own, as legitimate applications may temporarily create or modify this file for library configuration purposes.

  ### Investigation Steps

  - **Check the existence of `/etc/ld.so.preload`:** Use the command `ls -l /etc/ld.so.preload` to confirm the file's presence. A legitimate setup typically does not have this file, so its existence is suspicious.

  - **Review the file contents:** Execute `cat /etc/ld.so.preload` to inspect any loaded library paths. Look for unusual or unrecognized library names, which may indicate malicious injections.

  - **Observe system processes for injected libraries:** Use `lsof | grep -vE '^bash|^systemd'` to check for open files by processes. If certain processes are linked to libraries listed in `ld.so.preload`, it could indicate malicious activity.

  - **Identify recent modifications to the file:** Check modification timestamps using `stat /etc/ld.so.preload`. An anomalously recent change may indicate an unauthorized update.

  - **Correlate with security events:** Review Security Event ID 4720 (Linux file system changes) to track unauthorized changes to known executable files or libraries linked to the preload mechanism.

  - **Analyze host role and function:** If the affected host is a critical production server, escalate the investigation due to its potential impact on business operations.

  ### Prioritization

  This alert is considered high severity due to the potential impact on system integrity and confidentiality. If compromised, the affected system could serve as a foothold for broader exploitation across the network. The use of `ld.so.preload` for code injection is a known tactic among sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited if the file system logging is not enabled or if legitimate scripts erroneously create or modify the `/etc/ld.so.preload` file. Additionally, some processes might generate false positives if they genuinely rely on dynamic library configurations. Related detections include monitoring for the modification of other critical files, such as `/etc/ld.so.cache`, to strengthen coverage against similar attacks.

