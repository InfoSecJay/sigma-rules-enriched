  ### Technical Context
  This rule detects the use of remote file transfer tools such as `scp`, `rsync`, and `sftp`, which can be indicative of malicious activities including data exfiltration or lateral movement within a network. Attackers may employ these tools to transfer files between compromised systems, facilitate communication with command-and-control (C2) servers, or rapidly deploy malware across multiple hosts. The likely objective is to harvest sensitive data or maintain persistence on compromised systems.

  Relevant MITRE ATT&CK tactics include **Command and Control (TA0011)** and **Lateral Movement (TA0008)**, specifically technique **T1105 - Ingress Tool Transfer**. This technique is focused on the transfer of tools and files from one system to another, which is essential for executing follow-up activities in an attack chain. The primary data sources for detection include Linux system logs that capture process execution and the use of these specific file transfer commands.

  ### Investigation Steps
  - **Review Process Creation Logs**: Check system logs for instances of `scp`, `rsync`, or `sftp` being executed. Look for unusual patterns or high frequency of these commands, especially from unexpected user accounts or systems.
  - **Analyze Network Traffic**: Inspect network logs for outbound connections to unusual IP addresses or domains that correspond with the use of remote file transfer tools, focusing on traffic patterns that deviate from normal operational behavior.
  - **Examine User Accounts**: Identify the user accounts executing these commands. Look for accounts that should not require such file transfer capabilities or accounts that have recently been created or escalated privileges.
  - **Correlate with Incident Reports**: Cross-reference detected instances of remote file transfers with any reported incidents, alerts, or activity logs suggesting unauthorized access or behavioral anomalies.

  ### Prioritization
  The alert is categorized as low severity due to the potential for legitimate administrative activities that may trigger the detection logic. However, repeated or suspicious usage patterns could warrant further investigation to rule out malicious activity.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots in environments where file transfers occur legitimately and with high frequency, leading to potential false positives. It assumes that the monitored systems have logging enabled for process creation and that relevant logs are retained for analysis. Additionally, if local auditing is not configured correctly, the rule may miss covert file transfer activities using different tools or methods that do not register as `scp`, `rsync`, or `sftp`.

