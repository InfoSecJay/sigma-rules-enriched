  ### Technical Context

  This Sigma rule detects the usage of tools such as `scp`, `rsync`, and `sftp` for remote file copying, indicating potential lateral movement within the network or command-and-control (C2) activity. Attackers may use these tools to transfer malicious payloads or exfiltrate data from compromised systems. Relevant MITRE ATT&CK tactics include **Command and Control (TA0011)** and **Lateral Movement (TA0008)**, specifically technique **T1105 (Ingress Tool Transfer)**.

  Primary telemetry sources are Linux system logs, particularly those related to file transfer operations. If malicious, this behavior can facilitate further exploitation, data theft, or persistence. It is crucial to note that this detection does NOT confirm malicious intent; legitimate administrative activities can also utilize these tools for valid operational tasks.

  ### Investigation Steps

  - **Review file transfer logs:** Examine `/var/log/auth.log` or `/var/log/secure` for entries related to `scp`, `rsync`, or `sftp`. Look for uncommon user accounts or unusual timing of transfers that deviate from expected administrative operations.

  - **Identify source and destination:** Cross-reference the source and destination IP addresses or hostnames involved in the transfer. Compare against your organization's asset inventory to confirm if legitimate hosts are participating.

  - **Analyze command execution history:** Check for commands executed via the shell (e.g., `/bin/bash` or `/bin/sh`) – use `history` or process accounting (if enabled) to validate whether these tools were used by authorized personnel.

  - **Assess user behavior patterns:** Investigate if the user associated with the transfer has a history of administrative activities. Legitimate activities typically involve standard users or admins performing file transfers to known servers during maintenance windows.

  - **Look for correlating actions:** Verify if there were any subsequent actions that indicate persistence or data exfiltration, such as new user creations or connection to external IPs typically associated with C2.

  ### Prioritization

  This alert has a low severity due to the nature of remote file transfer tools often lining up with legitimate administrative tasks. However, it warrants attention since some attackers exploit these tools for lateral movement and data exfiltration. The likelihood of malicious abuse is present but dependent on the context of the activity.

  ### Blind Spots and Assumptions

  There may be limitations in detection if logging is not adequately configured, as legitimate activities can also trigger this alert (e.g., system backups, administrative tasks). Additionally, attackers might employ alternative methods for file transfer that evade detection. A companion detection to consider is monitoring for unusual SSH connections, which can provide further context to file transfer activities and enhance coverage.

