title: Suspicious VSFTPD Error Messages
id: 377f33a1-4b36-4ee1-acee-1dbe4b43cfbe
status: test
description: Detects suspicious VSFTPD error messages that indicate a fatal or suspicious
  error that could be caused by exploiting attempts
references:
- https://github.com/dagwieers/vsftpd/
author: Florian Roth (Nextron Systems)
date: 2017-07-05
modified: 2021-11-27
tags:
- attack.initial-access
- attack.t1190
logsource:
  product: linux
  service: vsftpd
detection:
  keywords:
  - 'Connection refused: too many sessions for this address.'
  - 'Connection refused: tcp_wrappers denial.'
  - 'Bad HTTP verb.'
  - 'port and pasv both active'
  - 'pasv and port both active'
  - 'Transfer done (but failed to open directory).'
  - 'Could not set file modification time.'
  - 'bug: pid active in ptrace_sandbox_free'
  - 'PTRACE_SETOPTIONS failure'
  - 'weird status:'
  - 'couldn''t handle sandbox event'
  - 'syscall * out of bounds'
  - 'syscall not permitted:'
  - 'syscall validate failed:'
  - 'Input line too long.'
  - 'poor buffer accounting in str_netfd_alloc'
  - 'vsf_sysutil_read_loop'
  condition: keywords
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This Sigma rule detects suspicious error messages generated by the VSFTPD (Very Secure FTP Daemon) service, which could indicate exploitation attempts. Attackers may exploit vulnerabilities in VSFTPD to gain unauthorized access, perform denial-of-service attacks, or execute arbitrary code on the system. The error messages highlighted by this detection rule can be indicative of various malicious activities, such as excessive connection attempts, sandbox evasion techniques, or attempts to manipulate syscall behaviors.

  The relevant MITRE ATT&CK tactics for this detection include:
  - **Initial Access** (TA0001): Specifically, through a potentially compromised FTP service.
  - **Exploitation for Client Execution** (T1190): As attackers may exploit known vulnerabilities in the FTP service to execute unauthorized code.

  Primary data sources for this detection include logs from the VSFTPD service itself that record error messages, connection attempts, and system calls made by the FTP daemon.

  ### Investigation Steps
  - **Review VSFTPD Logs**: Check the VSFTPD logs for the presence of the detected error messages. Pay attention to the context surrounding these errors to identify potential exploitation attempts.
  - **Analyze Connection Patterns**: Look for unusual connection patterns or high volumes of requests from specific IP addresses that may suggest a brute-force attack or DoS attempts.
  - **Evaluate System Call Logs**: If available, examine syscall logs to identify failed or unexpected system calls that can indicate attempts to bypass security mechanisms or gain elevated privileges.
  - **Correlate with Network Events**: Cross-reference the findings with network traffic data for any known malicious IP addresses or anomalous FTP-related connections that coincide with the suspicious error messages.

  ### Prioritization
  The alert's medium severity is justified due to the potential impact of exploitation on the FTP service, which can lead to data exfiltration or service disruption, alongside the high likelihood of such attacks being attempted on vulnerable systems.

  ### Blind Spots and Assumptions
  This detection logic assumes that the VSFTPD logging is enabled and configured to capture detailed error messages. A gap in detection coverage exists if the logs are not retained for a sufficient period, and the rule may not trigger if there are custom configurations that suppress these error messages. Analysts should ensure comprehensive logging is enabled and all pertinent security controls are in place for thorough monitoring of the FTP service environment.

