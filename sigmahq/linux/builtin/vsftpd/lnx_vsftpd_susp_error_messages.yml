logsource:
  product: linux
  service: vsftpd
detection:
  keywords:
  - 'Connection refused: too many sessions for this address.'
  - 'Connection refused: tcp_wrappers denial.'
  - 'Bad HTTP verb.'
  - 'port and pasv both active'
  - 'pasv and port both active'
  - 'Transfer done (but failed to open directory).'
  - 'Could not set file modification time.'
  - 'bug: pid active in ptrace_sandbox_free'
  - 'PTRACE_SETOPTIONS failure'
  - 'weird status:'
  - 'couldn''t handle sandbox event'
  - 'syscall * out of bounds'
  - 'syscall not permitted:'
  - 'syscall validate failed:'
  - 'Input line too long.'
  - 'poor buffer accounting in str_netfd_alloc'
  - 'vsf_sysutil_read_loop'
  condition: keywords
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects suspicious error messages generated by the VSFTPD (Very Secure FTP Daemon) service, which may indicate potential exploitation attempts or abnormal behavior. The likely attacker objective may include probing the FTP server for vulnerabilities, attempting unauthorized access, or exploiting misconfigurations. Relevant MITRE ATT&CK tactics and techniques include Initial Access (TA0001) and Exploit Public-Facing Application (T1190).

  The primary telemetry source is the VSFTPD log files on Linux systems, particularly those related to connection handling and error reporting. If malicious, this behavior could lead to unauthorized file access, data exfiltration, or server compromise. It is crucial to note that this detection does NOT confirm that an exploit was successful, merely that suspicious errors were recorded.

  ### Investigation Steps

  - **Identify suspicious VSFTPD error messages:** Review the VSFTPD logs for keyword matches indicating suspicious activity, such as 'Connection refused: too many sessions for this address' or 'syscall not permitted:' (likely found in /var/log/vsftpd.log or equivalent).

  - **Correlate with active sessions:** Check for the number of active sessions initiated by different IP addresses using `who` or `netstat -nap` command outputs to determine if the errors are related to excessive connections from a particular source.

  - **Examine recent configuration changes:** Investigate if any recent changes were made to the VSFTPD configuration (`/etc/vsftpd.conf`) that could lead to insecure states, such as enabling both 'pasv' and 'port' access modes.

  - **Analyze for high-confidence malicious indicators:** Look for any patterns indicating repeated error messages paired with a high volume of connection attempts. Anomalies such as a spike in connections from an uncommon IP address should be flagged.

  - **Note legitimate usage:** Understand expected behavior patterns for authorized users, such as typically authorized IP ranges, which should significantly reduce the number of connections leading to errors.

  - **Validate file modification attempts:** Check for entries indicative of file transfer operations that failed, particularly 'Transfer done (but failed to open directory).' This may signal attempts to access unauthorized directories.

  ### Prioritization

  This alert has medium severity because it targets a service critical to file transfer operations. While exploiting VSFTPD is not as common as other vulnerabilities, misconfiguration can lead to significant risk if procedures are not followed. The risk of malicious abuse is present, making it important to investigate further.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging or misconfigured log levels that fail to capture all relevant errors. Evasion techniques might involve utilizing legitimate user accounts or connections from trusted networks to mask unauthorized attempts. Legitimate activities like frequent connections from a batch process may trigger these alerts. It is advisable to combine this detection with monitoring for brute force attempts on the FTP service to enhance coverage.

