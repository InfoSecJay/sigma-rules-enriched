detection:
  keywords:
  - 'attempt to execute code on stack by'
  - '0bin0sh1'
        # - 'rpc.statd[\d+]: gethostbyname error for'  # it's an expensive regex and produces questionable results
  - 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'        # this can cause false positives in Base64 encoded data
  - 'stack smashing detected'
  condition: keywords
falsepositives:
- Base64 encoded data in log entries
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts at buffer overflow exploits by identifying specific log messages in Unix system logs. Attackers often leverage buffer overflows to execute arbitrary code or gain unauthorized access to systems, indicating a potential escalation of privileges or system compromise. The relevant MITRE ATT&CK techniques include Privilege Escalation (T1068) and exploitation of software vulnerabilities (specifically techniques exploiting memory corruption).

  Primary telemetry sources include Unix system logs where exploit attempts are logged, commonly found in `/var/log/syslog` or other application-specific logs depending on the service. The security impact can be severe, as successful buffer overflow attacks may lead to full system compromise. It is important to note that this detection does NOT confirm that a successful exploit occurred; it merely indicates an attempt.

  ### Investigation Steps

  - **Examine recent syslog entries:** Review `/var/log/syslog` for specific entries containing phrases such as "attempt to execute code on stack by" or "stack smashing detected". Validate anomalies near the timestamps of the alert.

  - **Filter for known attack patterns:** Use the command `grep -E "0bin0sh1|stack smashing detected" /var/log/syslog` to locate suspicious activities. Document surrounding log entries for context and potential indicators of compromise.

  - **Validate host role and application use:** Confirm that the affected machine is functioning in a production capacity and identify the applications running that may be vulnerable to buffer overflow threats, such as web servers or older daemon processes.

  - **Identify legitimate activity patterns:** Look for typical application behavior in logs. For instance, established patterns may show normal operational logs without indications of buffer overflow attempts, ensuring they do not interfere with alert evaluations.

  - **Check for extensive stack overflow attempts:** High-frequency or patterned log entries resembling "AAAAAAAAAAAA..." within buffer overflows can indicate automated attack attempts. Compare these with discovered anomalies to differentiate between benign and contentious traffic.

  - **Review system patch levels and configurations:** Cross-reference vulnerable software versions against internal vulnerability databases or patch management systems to identify whether the system is outdated or misconfigured. This context can clarify the severity of detected attempts.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of the systems potentially affected, the high likelihood that successful exploitation could lead to significant security incidents, and the common weaponization of buffer overflow vulnerabilities by adversaries. Continuous monitoring is essential in the context of environments hosting sensitive or mission-critical applications.

  ### Blind Spots and Assumptions

  Detection may be limited by improperly configured logging levels or missing logs, potentially allowing malicious activities to go unnoticed. Evasion techniques could involve using legitimate processes to execute buffer overflow exploits, masquerading under normal system activities. Be aware that legitimate users may trigger similar alerts, such as during software testing phases. Consider companion detections around recent privilege escalation or unusual user access patterns to strengthen oversight and context.

