note: |
  ### Technical Context
  This detection rule identifies unauthorized connections made by processes on Linux systems to known Monero crypto mining pools. The presence of these connections may indicate that a system has been compromised and is being used for illicit cryptocurrency mining, commonly referred to as "cryptojacking." Attackers typically exploit vulnerabilities or misconfigurations to install mining software on target machines, which can lead to performance degradation and increased operational costs for the organization.

  The primary objective of such attacks is financial gain through the use of the organization’s computing resources for mining cryptocurrencies without their consent. In this scenario, the attacker might aim to covertly mine Monero, a cryptocurrency known for its privacy features, which makes detecting such operations more challenging.

  Relevant MITRE ATT&CK techniques include:
  - **T1496: Resource Hijacking** – This acronym encompasses activities related to crypto mining that utilize victims' hardware resources without authorization.

  The best evidence for detecting this activity comes from network connection logs, specifically looking for outbound connections towards specific Monero mining pool domain names. This information can assist security teams in determining whether unauthorized mining activities are occurring within the enterprise environment.

  ### Investigation Steps
  - **Review Network Connections:** Examine network connection logs to identify any communications with known Monero mining pool domains. Look for repeated or unusual connections from internal IP addresses to the identified pools.
  - **Analyze Process Activity:** Correlate identified connections with process creation events on the affected hosts to determine which processes are initiating these connections. Investigate any suspicious processes further.
  - **Check System Resource Usage:** Monitor system resource loads (CPU and memory) on systems showing connections to mining pools. Anomalously high resource usage may indicate unauthorized mining.
  - **Inspect for Mining Software Presence:** Conduct a search on the endpoint for known crypto mining software binaries or installation scripts. This includes looking for files that are commonly associated with mining operations.

  ### Prioritization
  This alert should be treated with high severity due to the potential financial implications and the risk of performance degradation on affected systems. Unauthorized mining can lead to increased operational costs and might indicate a broader compromise of the environment.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection logic is the possibility of newly established mining pools that are not included in the detection list. The effectiveness of this rule relies on the assumption that monitoring is consistently applied across all Linux systems and that outbound network connections are logged comprehensively. Additionally, legitimate use of crypto miners that might be authorized for business purposes may result in false positives. It is important to ensure that network logging is properly configured to capture all relevant traffic, particularly outbound connections.

