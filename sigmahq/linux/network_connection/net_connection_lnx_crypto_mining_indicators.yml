  ---

  ### Technical Context

  This Sigma rule detects connections made from Linux systems to known Monero crypto mining pools. The behavior typically indicates an unauthorized crypto mining activity, where an adversary aims to utilize the organization's resources for personal gain without permission. Relevant MITRE ATT&CK tactics and techniques include **Impact (T1496)**, which refers to the misuse of system resources to mine cryptocurrency. The primary telemetry sources are network connection logs that capture destination hostnames and IP addresses of external servers involved in mining activities.

  If malicious, this behavior can contribute to performance degradation, increased electricity costs, and potential legal ramifications due to the unauthorized use of assets. However, it is essential to note that this detection does not confirm the intent or ownership of the activity; legitimate users may also connect to these mining pools for valid reasons.

  ---

  ### Investigation Steps

  - **Check for Current Active Connections:** Review network connection logs, filtering for Event IDs related to network activity (syslog entries or systemd journal logs) where `DestinationHostname` matches any of the known mining pool addresses.

  - **Identify Unapproved Software:** Investigate running processes using `ps aux` or similar commands to check for known crypto mining software (e.g., `xmrig`, `xmr-stak`) which can confirm unauthorized mining.

  - **Correlate with User Activity:** Analyze associated user activity in logs (e.g. SSH login times, sudo command usage) to identify whether the connections were made during a logged-in session. Legitimate activities may typically involve user-initiated commands without unauthorized software present.

  - **Examine System Resource Usage:** Investigate CPU and memory utilization metrics (e.g., using `top` or monitoring systems like Nagios) to determine if the system is under abnormal loads typical of crypto mining, an indicator for unauthorized usage.

  - **Review Change Management Logs:** Verify if there were recent changes (e.g. package installations) that could indicate the deployment of unauthorized mining tools—this can highlight scenarios where legitimate audit processes were bypassed.

  ---

  ### Prioritization

  This alert is high priority due to the potential impact on system performance and the likelihood of malicious abuse, especially in environments where resources are critical. Crypto mining activities are often methodically weaponized by adversaries, exploiting organizational systems for gains.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of benign crypto mining activities. Not all crypto miners are malicious, as some organizations may permit mining under specific conditions. Reliable detection requires comprehensive logging configurations for network connections. Additionally, false positives may arise from legitimate research or testing activities involving cryptocurrencies. A related detection that strengthens coverage includes monitoring of process execution patterns for known crypto mining applications to capture any stealthy installations.

