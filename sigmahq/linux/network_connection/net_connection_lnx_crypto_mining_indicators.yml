note: |
  ### Technical Context

  This Sigma rule detects outbound network connections from Linux systems to known Monero crypto mining pools. The behavior indicates potentially unauthorized cryptocurrency mining, which is often carried out by adversaries to exploit system resources for financial gain. The likely attacker objective is to covertly use compromised or misconfigured machines to mine Monero, taking advantage of the victim's computational resources.

  This detection corresponds to the MITRE ATT&CK technique "Cryptomining" (T1496). The primary telemetry source consists of Linux network connection logs, specifically monitoring attempts to connect to IP addresses or domains associated with Monero pools. If successful, this activity can lead to significant resource drain, potential system instability, or an increase in operational costs. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate users might also engage in crypto mining activities.

  ### Investigation Steps

  - **Check network connection logs:** Analyze the Linux network connection logs (e.g., `/var/log/syslog` or systemd-journald) for Event ID 5145 or relevant log entries indicating connections to Monero mining pools listed in the rule.

  - **Identify high-confidence malicious indicators:** Look for repeated connections to multiple Monero mining pool domains from the same host, especially if they occur rapidly (e.g., within seconds), indicating automated mining software behavior.

  - **Examine process execution:** Investigate running processes tied to mining activities by checking for unexpected processes using commands like `ps aux | grep -i 'mining'` or `top` to identify resource-intensive tasks that may indicate mining.

  - **Assess host role and asset criticality:** Determine if the alerting host is a critical server or high-value asset, which may heighten the urgency of the investigation and response actions.

  - **Validate legitimate behavior:** Verify if the asset's owner is authorized to perform crypto mining. Assess whether any user accounts related to this connection log are registered or if similar behavior has been documented in the past.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on system performance and resource depletion, especially for critical infrastructure. The likelihood of malicious activity is significant, as cryptomining is a common tactic for adversaries seeking to exploit company resources. This behavior is often weaponized in multi-layered attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers using encrypted connections to the mining pools or turning off logging to hide their activity. Adequate logging sources are essential for reliable detection, including deploying enhanced monitoring of outbound network traffic. Legitimate activities may include authorized crypto mining done by users if explicitly allowed by business policy. A relevant companion detection would include alerting on the execution of known mining daemon binaries or software, enhancing overall visibility into potential cryptomining activities.

