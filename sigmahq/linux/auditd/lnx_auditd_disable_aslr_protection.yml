title: ASLR Disabled Via Sysctl or Direct Syscall - Linux
id: e497a24e-9345-4a62-9803-b06d7d7cb132
status: experimental
description: |
  Detects actions that disable Address Space Layout Randomization (ASLR) in Linux, including:
    - Use of the `personality` syscall with the ADDR_NO_RANDOMIZE flag (0x0040000)
    - Modification of the /proc/sys/kernel/randomize_va_space file
    - Execution of the `sysctl` command to set `kernel.randomize_va_space=0`
  Disabling ASLR is often used by attackers during exploit development or to bypass memory protection mechanisms.
  A successful use of these methods can reduce the effectiveness of ASLR and make memory corruption attacks more reliable.
references:
- https://github.com/CheraghiMilad/bypass-Neo23x0-auditd-config/blob/f1c478a37911a5447d5ffcd580f22b167bf3df14/personality-syscall/README.md
- https://man7.org/linux/man-pages/man2/personality.2.html
- https://manual.cs50.io/2/personality
- https://linux-audit.com/linux-aslr-and-kernelrandomize_va_space-setting/
author: Milad Cheraghi
date: 2025-05-26
modified: 2025-12-05
tags:
- attack.privilege-escalation
- attack.stealth
- attack.defense-impairment
- attack.t1685
- attack.t1055.009
logsource:
  product: linux
  service: auditd
detection:
  selection_syscall:
    type: 'SYSCALL'
    SYSCALL: 'personality'
    a0: 40000
  selection_sysctl:
    type: 'EXECVE'
    a0: 'sysctl'
    a1: '-w'
    a2: 'kernel.randomize_va_space=0'     # 0 = disable
  condition: 1 of selection_*
falsepositives:
- Debugging or legitimate software testing
level: high
note: |
  ### Technical Context

  This rule detects attempts to disable Address Space Layout Randomization (ASLR) on Linux systems through specific system calls or configuration changes. Attackers often disable ASLR to make exploits more reliable by allowing predictable memory addresses for payloads. Relevant MITRE ATT&CK tactics include Defense Evasion (T1562) and Execution (T1055.009). Primary telemetry sources include Linux audit logs from auditd for syscall events and command execution logs for the sysctl command. If successful, the disabling of ASLR could greatly increase the risk of successful exploitation of vulnerable applications and systems. However, this detection does NOT confirm that an exploit has occurred; rather, it indicates potential preparation for such attacks.

  ### Investigation Steps

  - **Review syscall logs for ASLR disabling**: Check audit logs (Auditd) for Event ID 1300 where the syscall 'personality' with the ADDR_NO_RANDOMIZE flag is used. Look for the syscall arguments (a0 = 40000).

  - **Investigate sysctl command execution**: Identify any executions of the `sysctl` command with parameters `-w kernel.randomize_va_space=0` in logs. This may appear in the shell command history or system command logs (e.g., `/var/log/auth.log`).

  - **Confirm legitimate software behavior**: Validate if the changes correlate with legitimate actions such as debugging or software testing, especially if they are associated with known development processes or maintenance activities.

  - **Correlate with other security controls**: Check for prior alerts that indicate unsuccessful exploitation attempts or other suspicious behaviors leading up to the ASLR disabling. This could strengthen the case for malicious intent.

  - **Document host role and risk**: Determine the criticality of the affected host. Servers running sensitive applications or services have a higher risk if ASLR is disabled, warranting deeper investigation into user activity and system integrity.

  - **Assess for indicators of compromise (IOC)**: Look for known patterns of exploitation in the timeframe surrounding the ASLR modification, including unusual network traffic or file system changes that could indicate exploitation of vulnerabilities.

  ### Prioritization

  The alert severity is high due to the potential impact on systems with weakened memory protection. Disabling ASLR is a common practice among adversaries during exploit development, increasing the likelihood of malicious exploitation if the system is vulnerable. Given the context, swift investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited if auditd logs are misconfigured or insufficient logging levels are set, potentially missing critical events. Legitimate debugging scenarios or software testing may inadvertently trigger the alert. A related detection to consider would be monitoring for unusual process creation (Event ID 4688) that may coincide with ASLR modification attempts, enhancing visibility into potential exploitation attempts.

