logsource:
  product: linux
  service: auditd
detection:
  selection_syscall:
    type: 'SYSCALL'
    SYSCALL: 'personality'
    a0: 40000
  selection_sysctl:
    type: 'EXECVE'
    a0: 'sysctl'
    a1: '-w'
    a2: 'kernel.randomize_va_space=0'     # 0 = disable
  condition: 1 of selection_*
falsepositives:
- Debugging or legitimate software testing
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to disable Address Space Layout Randomization (ASLR) on Linux systems through the use of the `personality` syscall with the ADDR_NO_RANDOMIZE flag or by modifying the `/proc/sys/kernel/randomize_va_space` file or using the `sysctl` command. Attackers may seek to disable ASLR to facilitate the exploitation of vulnerabilities by increasing the reliability of memory corruption attacks. The relevant MITRE ATT&CK techniques include Defense Evasion (T1562.001) and Process Injection (T1055.009). Primary telemetry sources include audit logs generated by `auditd` for syscall events and execution logs capturing `sysctl` command invocations. If successfully executed, this behavior significantly reduces system security and makes the environment more vulnerable to memory exploitation. This detection does NOT confirm that an exploit is occurring — it merely indicates an alteration of security settings.

  ### Investigation Steps

  - **Check Audit Logs for ASLR Modification:** Review `/var/log/audit/audit.log` for entries related to the `personality` syscall (Event ID: `SYSCALL`) where `a0` equals `40000`. Determine if any processes are attempting to disable ASLR, looking for suspicious parent processes or relationships.

  - **Inspect Command Execution for `sysctl` Usage:** Analyze the command execution logs in the audit daemon to identify any instances of `sysctl` with arguments `-w kernel.randomize_va_space=0` (Event ID: `EXECVE`). Look for any unexpected or unauthorized users executing this command.

  - **Review Process Creation Events:** Search for related process creation events in Syslog or journald logs (e.g., `/var/log/syslog`, `/var/log/journal/`) around the time of ASLR modification scripts or commands. Legitimate behavior will often include system utilities like package managers or administrative scripts, whereas unexpected entries may indicate malicious alterations.

  - **Identify Legitimate Software Testing:** Determine if any debugging tools or legitimate software development activities were occurring around the time of detection that might explain the changes to ASLR. Review user roles, authorization, and software testing policies to differentiate between benign and malicious activity.

  - **Cross-Reference with Known Malicious Indicators:** Investigate any active alerts related to known exploits or malware campaigns that utilize memory corruption techniques. The presence of behavior typical for these threats alongside the ASLR modification will enhance the confidence of the malicious intent.

  - **Evaluate System Role and Criticality:** Assess the impact of ASLR modifications on the organization’s security posture, focusing on the asset's role (e.g., production servers vs. development systems) to prioritize response actions. If the system is part of the production environment, escalate the investigation for immediate remediation.

  ### Prioritization

  The alert should be considered high severity due to the potential impact on system integrity, especially on critical systems where exploits can lead to significant data breaches. The likelihood of abuse is increased, as disabling ASLR is a common tactic used by adversaries to lower defenses against memory corruption vulnerabilities.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where auditd is not properly configured to capture all relevant syscall events or command executions. Additionally, legitimate activities such as software debugging or testing can trigger this alert and should be validated during investigations. Related detections, such as unauthorized attempts to increase privileges (Process Injection), should be monitored concurrently to strengthen overall security posture.

