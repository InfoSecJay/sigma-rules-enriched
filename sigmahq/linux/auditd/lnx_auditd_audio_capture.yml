title: Audio Capture
id: a7af2487-9c2f-42e4-9bb9-ff961f0561d5
status: test
description: Detects attempts to record audio using the arecord and ecasound 
  utilities.
references:
- https://linux.die.net/man/1/arecord
- https://linuxconfig.org/how-to-test-microphone-with-audio-linux-sound-architecture-alsa
- https://manpages.debian.org/unstable/ecasound/ecasound.1.en.html
- https://ecasound.seul.org/ecasound/Documentation/examples.html#fconversions
author: Pawel Mazur, Milad Cheraghi
date: 2021-09-04
modified: 2025-12-05
tags:
- attack.collection
- attack.t1123
logsource:
  product: linux
  service: auditd
detection:
  selection_execve:
    type: EXECVE
    a0: arecord
    a1: '-vv'
    a2: '-fdat'
  selection_syscall_memfd_create:
    type: SYSCALL
    exe|endswith: "/ecasound"
    SYSCALL: 'memfd_create'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of audio recording utilities (`arecord` and `ecasound`) on Linux systems. The likely objective of an attacker executing these commands would be to capture audio input, potentially for espionage or data exfiltration purposes. This behavior relates to the MITRE ATT&CK tactic of **Collection** (T1123), which involves collecting sensitive information within a target environment.

  The primary telemetry source is Linux audit logs, specifically from `auditd`, which tracks command executions and system calls on the operating system. Malicious use of audio recording utilities poses significant privacy risks, especially in sensitive environments, as they might capture confidential conversations or secure information. However, this detection does not confirm malicious intent on its own since legitimate users may also use these tools for valid purposes, such as testing audio configurations.

  ### Investigation Steps

  - **Check command execution logs:** Review `auditd` logs for `EVENT_TYPE` logs with `exe` values for `arecord` or `ecasound` (Event ID: 232). Verify the command line used; legitimate usage typically includes directed audio tests or configurations.

  - **Review process creation history:** Investigate related events from `auditd` to locate process creation logs (Event ID: 233) indicating the execution of `arecord` or `ecasound`. Focus on the parent processes to identify if the command is spawned by a process with suspicious behavior.

  - **Investigate syscall activity:** Look for `SYSCALL` events indicating `memfd_create` related to `/ecasound` executions. This syscall may signal an attempt to allocate memory for audio recording, potentially aligning with malicious activity.

  - **Identify user context:** Analyze user privileges associated with the command executions. Commands run by non-administrative users in typical scenarios may be benign, while executions by admin or service accounts could indicate potential misuse.

  - **Correlate with known baselines:** Compare the observed activity against normal usage patterns in the environment. Legitimate audio-related tasks often occur under specific conditions, such as scheduled maintenance or user support calls.

  ### Prioritization

  The severity of this alert is low; however, the context remains crucial. If detected on critical systems or environments where sensitive information is handled, the likelihood of malicious abuse increases. The behavior detected, while not immediately indicative of compromise, can be exploited by attackers for subsequent steps in information gathering.

  ### Blind Spots and Assumptions

  This detection may miss variants where an attacker uses modified binaries or obfuscates execution. Logs need to be correctly configured and retained for consistent monitoring of these commands. Legitimate activities, such as troubleshooting audio issues by IT support, may also trigger this alert. A related detection would involve monitoring for exfiltration of audio recordings, enabling more robust identification of potential data leaks.

