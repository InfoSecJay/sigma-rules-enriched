title: Audio Capture
id: a7af2487-9c2f-42e4-9bb9-ff961f0561d5
status: test
description: Detects attempts to record audio using the arecord and ecasound utilities.
references:
- https://linux.die.net/man/1/arecord
- https://linuxconfig.org/how-to-test-microphone-with-audio-linux-sound-architecture-alsa
- https://manpages.debian.org/unstable/ecasound/ecasound.1.en.html
- https://ecasound.seul.org/ecasound/Documentation/examples.html#fconversions
author: Pawel Mazur, Milad Cheraghi
date: 2021-09-04
modified: 2025-12-05
tags:
- attack.collection
- attack.t1123
logsource:
  product: linux
  service: auditd
detection:
  selection_execve:
    type: EXECVE
    a0: arecord
    a1: '-vv'
    a2: '-fdat'
  selection_syscall_memfd_create:
    type: SYSCALL
    exe|endswith: "/ecasound"
    SYSCALL: 'memfd_create'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule is designed to identify attempts to capture audio on Linux systems using the utilities `arecord` and `ecasound`. Both applications can be exploited by threat actors to record conversations or sensitive information without the user's knowledge, thereby facilitating covert information gathering. The suspected threat scenario involves adversaries using these tools for strategic data collection in settings where audio surveillance may yield valuable intelligence.

  Relevant MITRE ATT&CK tactics include **Collection** (TA0009) and the specific technique **Audio Capture** (T1123). These tactics indicate that the threat actor's goal is to gather data from the environment potentially involving sensitive communications or operational discussions. The primary data sources for detecting this behavior encompass Linux audit logs through `auditd`, which provides critical visibility into executed commands and system calls.

  ### Investigation Steps
  - **Review Audit Logs:** Check `auditd` logs for entries involving the execution of `arecord` with the specific flags `-vv` and `-fdat`, which indicate settings often used for higher quality audio recording.
  - **Analyze System Calls:** Investigate logs for `memfd_create` system calls linked to `ecasound`, noting any unusual behavior or execution timelines that may correlate with user activity.
  - **Monitor User Activity:** Assess user login and activity logs around the time of the detected audio capture attempts to establish context and determine whether legitimate usage aligns with standard practices.
  - **Cross-Reference Context:** Identify any instances of compromised credentials or unauthorized devices that might be contributing to unauthorized audio recording activities.

  ### Prioritization
  The alert is considered low severity in an enterprise environment due to the niche nature of audio capture tools. However, if observed alongside indicators of compromise or unusual user behavior, it could signal a broader compromise or espionage effort, warranting increased scrutiny.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the use of alternative audio recording tools that may not be captured by this rule. Additionally, there is an assumption that logging is correctly configured for audit purposes on all relevant systems, particularly that `auditd` is active and logging appropriate events. If these utilities are executed in a manner that bypasses standard logging mechanisms, the detection may be ineffective. Ensuring that `auditd` is properly configured and that continuous monitoring of Linux environments is in place is essential for the effectiveness of this detection logic.

