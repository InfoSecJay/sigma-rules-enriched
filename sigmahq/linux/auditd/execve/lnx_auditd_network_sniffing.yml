logsource:
  product: linux
  service: auditd
detection:
  selection_1:
    type: 'execve'
    a0: 'tcpdump'
    a1: '-c'
    a3|contains: '-i'
  selection_2:
    type: 'execve'
    a0: 'tshark'
    a1: '-c'
    a3: '-i'
  condition: 1 of selection_*
falsepositives:
- Legitimate administrator or user uses network sniffing tool for legitimate reasons.
level: low
note: |
  ### Technical Context
  This Sigma rule detects instances where users execute network sniffing tools like `tcpdump` and `tshark` on Linux systems. Network sniffing involves placing a network interface in promiscuous mode to intercept and capture data packets traveling over a network. Attackers may employ this technique to eavesdrop on sensitive information, such as credentials or confidential communications, often aiming to perform reconnaissance or credential harvesting.

  This behavior aligns with the MITRE ATT&CK framework, specifically under the tactics of Credential Access (TA0006) and Discovery (TA0007). The relevant technique, T1040 (Network Sniffing), illustrates how adversaries exploit network monitoring tools for malicious purposes. Key evidence for this detection will be found in audit logs generated by the `auditd` service, particularly monitoring the execution of processes related to network sniffing.

  ### Investigation Steps
  - **Review Audit Logs**: Collect and analyze `auditd` logs to identify any executions of `tcpdump` or `tshark`. Pay attention to the parameters passed during execution to understand the scope of the monitoring.
  - **Monitor Network Interfaces**: Check the operating state of network interfaces on the affected system for changes to promiscuous mode. Tools like `ifconfig` or `ip a` can be utilized for this analysis.
  - **Identify Suspicious Network Activity**: Analyze network traffic logs to detect any unusual patterns that may correlate with the use of sniffing tools. Look for unexpected spikes in traffic or connections to suspicious external destinations.
  - **Correlate User Activity**: Investigate the user account that executed the sniffing tools. Determine if their actions were credentialed and whether they have a legitimate reason for using such tools, ensuring there are no unauthorized accounts involved.

  ### Prioritization
  This alert is assigned a low severity due to the possibility of legitimate use of network sniffing tools by administrators. However, given that such tools can also be exploited by attackers, any instance should be examined closely to verify intent.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments without `auditd` enabled or configurations that do not log certain process executions. The detection logic assumes that the execution of these sniffing tools is unusual for a given user account unless documented otherwise. Logs must be meticulously configured to capture all executions of suspicious commands to ensure comprehensive monitoring.

