title: Network Sniffing - Linux
id: f4d3748a-65d1-4806-bd23-e25728081d01
status: test
description: |
  Network sniffing refers to using the network interface on a system to monitor or capture information sent over a wired or wireless connection.
  An adversary may place a network interface into promiscuous mode to passively access data in transit over the network, or use span ports to capture a larger amount of data.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1040/T1040.md
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2022-12-18
tags:
- attack.credential-access
- attack.discovery
- attack.t1040
logsource:
  product: linux
  service: auditd
detection:
  selection_1:
    type: 'execve'
    a0: 'tcpdump'
    a1: '-c'
    a3|contains: '-i'
  selection_2:
    type: 'execve'
    a0: 'tshark'
    a1: '-c'
    a3: '-i'
  condition: 1 of selection_*
falsepositives:
- Legitimate administrator or user uses network sniffing tool for legitimate 
  reasons.
level: low
note: |
  ### Technical Context

  This rule detects the execution of network sniffing tools such as `tcpdump` and `tshark` with specific arguments that indicate an intention to capture network traffic. The likely attacker objective is to intercept sensitive data transmitted over the network, which may include credentials or proprietary information. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and the technique T1040 (Network Sniffing).

  The primary telemetry source is the Linux audit framework, capturing `execve` system calls that indicate the execution of these tools. If executed maliciously, this behavior could lead to data breaches and the exfiltration of sensitive information. However, this detection does NOT confirm that the user is malicious; it only identifies that a network sniffing command was invoked, which can also be part of legitimate administrative workflows.

  ### Investigation Steps

  - **Check recent command history**: Review the shell command history (e.g., `.bash_history`) for the user that executed `tcpdump` or `tshark` to determine if the command was invoked with legitimate parameters or for malicious purposes.

  - **Identify user context**: Verify the user account associated with the execution of the sniffing tools. Legitimate system administrators may use these tools for troubleshooting, while unknown or non-privileged users executing them could indicate malicious behavior.

  - **Review audit logs for executable parameters**: Analyze `/var/log/audit/audit.log` for Event IDs that reflect the execution of `tcpdump` or `tshark`, specifically filtering for 'execve' calls to confirm the parameters used (e.g., `tcpdump -c` and `-i <interface>`).

  - **Correlate network traffic captures**: Confirm whether captured traffic correlates with sensitive data exchanges. Check if any unauthorized traffic was observed during the timeframe of the sniffing tool execution, particularly if sensitive protocols were involved (e.g., HTTP, FTP).

  - **Identify legitimate sniffing scenarios**: Note that network sniffing could be valid during network assessments or troubleshooting sessions. Document the reason and scope of legitimate sniffing activities, such as monitoring a subnet after a network change.

  ### Prioritization

  This alert has low severity as the execution of network sniffing tools may be part of legitimate administrative processes. However, the likelihood of malicious use remains notable, especially if performed by unauthorized users. Given its potential for data interception, careful consideration is warranted during triage.

  ### Blind Spots and Assumptions

  The detection may miss advanced evasion techniques, such as modifications to existing sniffing tools to bypass detection. Reliable detection relies on proper auditd configuration and ensuring that logging is enabled for all relevant events. Furthermore, benign activities, such as network performance testing or troubleshooting, may trigger this alert. A companion detection to consider includes monitoring for unauthorized access to sensitive files containing credentials (MITRE ID T1213).

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
