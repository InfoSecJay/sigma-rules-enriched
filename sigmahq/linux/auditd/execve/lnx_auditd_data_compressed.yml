logsource:
  product: linux
  service: auditd
detection:
  selection1:
    type: 'execve'
    a0: 'zip'
  selection2:
    type: 'execve'
    a0: 'gzip'
    a1: '-k'
  selection3:
    type: 'execve'
    a0: 'tar'
    a1|contains: '-c'
  condition: 1 of selection*
falsepositives:
- Legitimate use of archiving tools by legitimate user.
level: low
note: |
  ### Technical Context
  This detection rule identifies potential data compression activities performed by adversaries prior to the exfiltration of sensitive information. Attackers often utilize compression tools, such as `zip`, `gzip`, or `tar`, to make large datasets smaller, more manageable, and more discrete for transfer over a network. The goal behind this behavior is typically to obscure the nature of the collected data, reducing the overhead during exfiltration and minimizing detection chances.

  The rule aligns with the MITRE ATT&CK framework, specifically under the tactics of Collection (TA0009) and Exfiltration (TA0010). Techniques referenced include Data Compression (T1560.001), which covers the use of compression utilities as a means of preparing data for exfiltration. Analysts should focus on audit logs from Linux environments that document execution events to effectively capture this behavior.

  The primary data sources for detection in this case are `auditd` logs on Linux systems, which record execution events and can provide insight into the usage of command-line tools. These logs will help to identify not only the commands being executed but also the arguments passed to these commands, adding context to the potential data exfiltration attempt.

  ### Investigation Steps
  - **Review Audit Logs:** Examine Linux `auditd` logs for execution events related to the compression tools identified (`zip`, `gzip`, `tar`). Pay close attention to the exact commands and parameters used, including any unusual paths or file names.

  - **Analyze Command Context:** Investigate the environment from which the commands were executed. Assess user accounts, previous activity logs, and whether the execution context matches legitimate use patterns for archiving tools.

  - **Correlate with Network Activity:** Monitor network logs to identify any subsequent outbound traffic that correlates with the execution of these compression commands. Look for unusual or large file uploads or connections to external IP addresses.

  - **Check for Patterns of Behavior:** Identify whether the user or system has a history of legitimate use of these archiving tools. If the actions are atypical, further investigation into the user’s other activities or privileges may be warranted.

  ### Prioritization
  The alert has been assigned a low severity due to the potential for legitimate users to employ compression tools for benign purposes. However, the ability to compress sensitive data before exfiltration poses a significant risk if utilized by an attacker, necessitating a careful review of false positives.

  ### Blind Spots and Assumptions
  This detection rule may miss cases where adversaries utilize alternative compression methods or custom scripts that do not invoke these standard utilities. It assumes that logging is adequately configured for `auditd` to capture all relevant execution events. If logs are not retained or comprehensive enough, this could result in overlooked indicators of compromise associated with data exfiltration efforts.

