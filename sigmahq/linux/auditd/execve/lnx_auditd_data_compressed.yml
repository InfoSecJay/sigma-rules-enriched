note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of data compression utilities (zip, gzip, and tar), which adversaries may use to package sensitive documents before exfiltration. The likely objective is to compress data for portability and to reduce the amount of data sent over the network during a data theft operation. This behavior aligns with the MITRE ATT&CK tactics of Exfiltration (TA0010) and Collection (TA0009) using the technique "Data from Information Repositories" (T1560.001).

  The primary telemetry sources are Linux audit logs monitored via auditd, capturing events related to the execution of specified commands. If these behaviors are confirmed to be malicious, they may indicate serious data leakage risks. However, this detection alone does not confirm that data was successfully exfiltrated; it merely indicates that compression tools were used, which can also be legitimate.

  ---

  ### Investigation Steps

  - **Verify execution context: **Check the command line arguments of the detected event using auditd logs (Event ID 2283) to identify if the commands were executed by a user/process tied to an authorized activity. Legitimate archiving (e.g., system backups, data storage) may include standard flags like `-r` or `-f`.

  - **Identify source and target files:** Review relevant audits for file paths accessed during the compression process to determine if sensitive files (e.g., `.docx`, `.xls`) are involved. Check if they are located in high-value directories (e.g., `/home/user/documents`).

  - **Correlate user identity:** Cross-reference the user associated with the execve events with a user activity log or identity management tool. Determine if the user has a history of legitimate use or if this behavior is anomalous.

  - **Assess the execution frequency:** Review the frequency of compression commands in the logs over the past week to identify suspicious patterns (e.g., multiple executes within short timeframes signifying bulk data preparation).

  - **Look for post-compression artifacts:** Check for additional indicators such as the presence of `.zip`, `.tar`, or `.gz` files in temp directories or unusual file creation timestamps in `/tmp` or user home directories, indicating potential staging for exfiltration.

  - **Document previous legitimate use:** If the user or system typically engages in legitimate archiving activities, note the observed history, which may include direct business functions or tasks that utilize compression tools.

  ---

  ### Prioritization

  While the alert is marked low severity, it should not be dismissed. The affected system's nature (e.g., a file server) can elevate risk. Although compression tools are commonly leveraged for benign purposes, this behavior may indicate a targeted attack, especially if occurring outside regular hours or by a non-administrative user.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by legitimate archiving activities that could trigger the alert, leading to false positives. The uniformity of arguments across standard use cases may mask malicious intent, particularly if the command is executed by an expected user. Ensuring comprehensive auditing configurations is critical, as incomplete logs may hinder visibility. Companion detections, such as monitoring for outbound network activity related to compressed files, can improve the overall context of exfiltration attempts.

