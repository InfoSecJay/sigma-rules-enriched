title: Service Reload or Start - Linux
id: 2625cc59-0634-40d0-821e-cb67382a3dd7
status: test
description: Detects the start, reload or restart of a service.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.002/T1543.002.md
author: Jakob Weinzettl, oscd.community, CheraghiMilad
date: 2019-09-23
modified: 2025-03-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.002
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'EXECVE'
    a0|contains:
    - 'systemctl'
    - 'service'
    a1|contains:
    - 'reload'
    - 'start'
  condition: selection
falsepositives:
- Installation of legitimate service.
- Legitimate reconfiguration of service.
- Command line contains daemon-reload.
level: low
note: |
  ### Technical Context

  This rule detects the execution of commands related to starting or reloading services on a Linux system, focusing on actions using `systemctl` or `service` commands. The likely attacker objective may involve gaining persistence on a compromised system or elevating privileges by manipulating essential services. Relevant MITRE ATT&CK techniques include Privilege Escalation (T1543.002) and Persistence (T1543.002).

  Primary telemetry sources are generated from `auditd`, specifically capturing events related to executed commands (EXECVE). If malicious, the security impact could be substantial, enabling adversaries to alter service behaviors or configurations, potentially leading to system compromise. Importantly, this detection alone does NOT confirm malicious intent, as legitimate service management is common in operational environments.

  ### Investigation Steps

  - **Review recent service actions:** Check `auditd` logs for Event IDs relevant to `EXECVE` actions involving `systemctl` or `service` commands. Look for entries in `/var/log/audit/audit.log` that contain commands with `reload` or `start` to identify potential unauthorized service manipulations.

  - **Identify context and users:** Determine the initiating user of the `systemctl` or `service` commands. Use the `ausearch` command to search with `-ua [user_ID]` to track service commands executed by specific users, confirming whether they align with expected operational roles.

  - **Establish expected behaviors:** Define what normal service management looks like in your environment. Review standard operating procedures (SOPs) to confirm if the detected behavior aligns with routine maintenance or legitimate configuration changes.

  - **Correlate with other logs:** Cross-reference any suspicious service commands with other logs, such as `syslog` or `kern.log`, to check for abnormal activity indicators around the same time, such as failed login attempts or unusual file access.

  - **Check for known malicious commands:** Identify any switches or flags used with the commands that might indicate malicious intent, particularly looking for options related to overriding service configurations or executing unauthorized scripts.

  - **Assess system criticality:** Understand the roles of affected hosts. If the manipulated service is critical to business operations (e.g., database services), the impact of unauthorized changes could be more severe, warranting immediate investigation and remediation responses.

  ### Prioritization

  This alert has low severity primarily due to the nature of the operations being often routine in Linux environments. However, due to the potential manipulation of critical system services, it warrants further investigation, particularly in sensitive or critical environments where such actions could indicate privilege escalation attempts or persistence mechanisms.

  ### Blind Spots and Assumptions

  Detection may be limited by users' ability to manipulate service commands without being logged, especially if `auditd` is misconfigured or disabled. Legitimate service management by administrators could trigger this alert frequently, making contextual awareness vital. Additionally, companion detections related to process creation (e.g., monitoring `auditd` alongside changes in system file integrity) can enhance security coverage by identifying potentially unauthorized service alterations.

