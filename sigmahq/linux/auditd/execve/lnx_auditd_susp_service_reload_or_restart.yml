title: Service Reload or Start - Linux
id: 2625cc59-0634-40d0-821e-cb67382a3dd7
status: test
description: Detects the start, reload or restart of a service.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.002/T1543.002.md
author: Jakob Weinzettl, oscd.community, CheraghiMilad
date: 2019-09-23
modified: 2025-03-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.002
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'EXECVE'
    a0|contains:
    - 'systemctl'
    - 'service'
    a1|contains:
    - 'reload'
    - 'start'
  condition: selection
falsepositives:
- Installation of legitimate service.
- Legitimate reconfiguration of service.
- Command line contains daemon-reload.
level: low
note: |
  ### Technical Context
  This rule detects instances where services on a Linux system are being started, reloaded, or restarted via commands like `systemctl` or `service`. Such actions can be indicative of both legitimate administrative activity as well as malicious intent, particularly in contexts like privilege escalation or persistence techniques in compromised environments. Attackers may seek to manipulate services as part of post-exploitation activity to maintain control, facilitate lateral movement, or disrupt operational functionality.

  The rule aligns with the MITRE ATT&CK framework, specifically targeting tactics related to **Privilege Escalation** (TA0004) and **Persistence** (TA0003). The relevant technique is **T1543.002 - Service Stop and Start**. By monitoring commands associated with starting or reloading services, security teams can detect potentially unauthorized changes that could further compromise the system’s integrity.

  Primary data sources for effective detection include **auditd logs**, which capture system calls including service management operations, as well as command history files that may show unauthorized administrative actions.

  ### Investigation Steps
  - **Review audit logs**: Examine audit logs for entries related to `systemctl` or `service` commands that trigger service start or reload events. Pay attention to timestamps and user context.
  - **Correlate with user activity**: Check the history of user commands for any unusual patterns or previously flagged accounts that may correlate with the service-related entries found in the audit logs.
  - **Identify affected services**: List services that have been started or reloaded and assess their legitimacy within your environment to see if they align with known operational procedures.
  - **Check for anomalies**: Look for deviations from normal service management behavior, such as unexpected services being manipulated or changes occurring outside of scheduled maintenance windows.

  ### Prioritization
  While the alert is categorized as low severity, it remains critical in an enterprise context because unauthorized service manipulation could hint at deeper security incidents such as privilege escalation or the establishment of persistence mechanisms by an adversary.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly for services that may be managed by other processes or systems not logged by auditd. The detection logic assumes that the commands captured are executed in the appropriate contexts; if logging is misconfigured or disabled, the detection will fail to capture relevant events. Furthermore, this rule may generate false positives during routine service maintenance activities, which is an assumption built into the logic regarding normal operational behavior. Proper logging configurations and context-based whitelisting are necessary to improve detection accuracy.

