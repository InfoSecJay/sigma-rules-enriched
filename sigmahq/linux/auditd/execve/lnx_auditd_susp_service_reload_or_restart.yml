logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'EXECVE'
    a0|contains:
    - 'systemctl'
    - 'service'
    a1|contains:
    - 'reload'
    - 'start'
  condition: selection
falsepositives:
- Installation of legitimate service.
- Legitimate reconfiguration of service.
- Command line contains daemon-reload.
level: low
note: |
  ---

  ### Technical Context

  This detection rule identifies instances where a service is started or reloaded on a Linux system, typically using commands like `systemctl` or `service`. The likely attacker objective is to either regain control over a compromised service or introduce a malicious service to gain persistence or escalate privileges. This behavior aligns with the MITRE ATT&CK techniques T1543.002 (Service Stop/Start) under the persistence and privilege escalation tactics.

  The primary telemetry sources are audit logs generated by `auditd`, particularly focusing on `EXECVE` system calls. If exploited, such behavior could lead to unauthorized service modification, potentially facilitating further attacks or system compromise. Importantly, this detection alone does not confirm malicious intent; legitimate administrative activities can produce similar log entries.

  ---

  ### Investigation Steps

  - **Review relevant log entries:** Inspect audit logs for `EXECVE` calls related to `systemctl` or `service` with `a1` containing 'reload' or 'start'. Look for Event IDs specifically from auditd, focusing on syscall parameters.

  - **Evaluate service impact:** Determine the service involved and its role within the environment. Critical services (e.g., web server, database) warrant higher scrutiny compared to non-essential ones.

  - **Identify legitimate activities:** Assess whether the service in question had a recent update or maintenance scheduled, corroborating system administrator activities against incident timeframes and change management logs.

  - **Spot high-confidence malicious indicators:** Look for unusual command-line arguments or unexpected service names in conjunction with service operations, which might hint at an attack (e.g., a service named similar to a benign service but with an unfamiliar path).

  - **Correlate with other behaviors:** Monitor for other related events around the same timeframe, such as unauthorized file modifications or unscheduled deployments that coincide with the service reload/start.

  - **Check for rapid successive entries:** If multiple reloads/restarts of the same service are logged within a short period, this could indicate a malicious actor attempting to modify the service behavior rapidly—escalate accordingly.

  ---

  ### Prioritization

  This alert carries a low severity in a mature enterprise context, as it can result from routine administration tasks. However, should this activity be observed on critical systems without documented change management, the likelihood of malicious activity cannot be dismissed, especially considering the potential for service manipulation in targeted environments.

  ---

  ### Blind Spots and Assumptions

  Potential evasion techniques include using custom scripts or tools that do not generate `EXECVE` calls while restarting services. Reliance on auditd without ensuring proper configuration or logging may hinder detection efficacy. Legitimate activities, such as scheduled service updates or configuration changes, may trigger the alert unexpectedly. Companion detections, such as filesystem changes or abnormal user behavior around the same time, would enhance context and response capabilities.

  ---

