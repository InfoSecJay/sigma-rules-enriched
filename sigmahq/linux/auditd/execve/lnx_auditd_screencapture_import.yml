title: Screen Capture with Import Tool
id: dbe4b9c5-c254-4258-9688-d6af0b7967fd
status: test
description: |
  Detects adversary creating screen capture of a desktop with Import Tool.
  Highly recommended using rule on servers, due to high usage of screenshot utilities on user workstations.
  ImageMagick must be installed.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1113/T1113.md
- https://linux.die.net/man/1/import
- https://imagemagick.org/
author: 'Pawel Mazur'
date: 2021-09-21
modified: 2022-10-09
tags:
- attack.collection
- attack.t1113
logsource:
  product: linux
  service: auditd
detection:
  import:
    type: EXECVE
    a0: import
  import_window_root:
    a1: '-window'
    a2: 'root'
    a3|endswith:
    - '.png'
    - '.jpg'
    - '.jpeg'
  import_no_window_root:
    a1|endswith:
    - '.png'
    - '.jpg'
    - '.jpeg'
  condition: import and (import_window_root or import_no_window_root)
falsepositives:
- Legitimate use of screenshot utility
level: low
note: |
  ### Technical Context

  This detection rule identifies the execution of the ImageMagick utility `import`, which is used to capture screenshots on a Linux system. Attackers may leverage this functionality to gather visual information from the desktop environment, potentially for credential harvesting, reconnaissance, or surveillance. The relevant MITRE ATT&CK tactic is **Collection** (T1113: Screen Capture).

  The primary telemetry source for this rule is auditd logs, specifically focusing on execution events related to `import`. If malicious, this behavior could indicate an elevated risk, particularly on servers where sensitive operations and data are visible. However, it is crucial to note that this detection alone does not confirm malicious intent, as legitimate users may frequently use screenshot utilities for various benign purposes, such as documentation or troubleshooting.

  ### Investigation Steps

  - **Check relevant auditd logs for execution details:** Review auditd logs (e.g., Event ID 226) for successful execution of the `import` command. Pay attention to the command line arguments (a1, a2, a3) used to identify the capture settings.

  - **Identify the context of `import` execution:** Determine the user account that executed the `import` command. Unusual execution by non-administrative accounts, especially on typically unmanaged servers, may indicate malicious behavior.

  - **Review captured imagery:** If accessible, check the output files generated by the `import` command (i.e., .png, .jpg) in the home directories of users. Ensure they align with legitimate documentation or troubleshooting efforts, noting the paths and timestamps.

  - **Analyze host role and critical assets:** Assess if the system where the screenshot utility was executed is sensitive or critical. Use asset inventory to identify the significance of the affected system in the enterprise context.

  - **Monitor for related malicious indicators:** Cross-reference with other alerting mechanisms for unauthorized software installations or access patterns unusual for legitimate users, such as connections to command and control (C2) servers or abnormal lateral movement.

  ### Prioritization

  The alert severity is low, given that the `import` utility may be used legitimately across many operational contexts. However, scrutiny is warranted on servers, where unauthorized screen capture can expose sensitive information. This behavior may be weaponized in targeted attacks but remains common among regular users for legitimate purposes.

  ### Blind Spots and Assumptions

  Detection may be limited if the auditd logs are misconfigured or not capturing all relevant execution events, as legitimate usage of screenshot utilities is prevalent. Assumptions might include that the presence of `import` signifies malicious intent, which is not always true; proper contextual analysis is essential. An additional companion detection to consider could include monitoring for the installation of ImageMagick or other screenshot utilities, which can preemptively identify potential abuse risks.

