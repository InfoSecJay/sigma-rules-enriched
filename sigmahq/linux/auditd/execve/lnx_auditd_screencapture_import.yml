title: Screen Capture with Import Tool
id: dbe4b9c5-c254-4258-9688-d6af0b7967fd
status: test
description: |
  Detects adversary creating screen capture of a desktop with Import Tool.
  Highly recommended using rule on servers, due to high usage of screenshot utilities on user workstations.
  ImageMagick must be installed.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1113/T1113.md
- https://linux.die.net/man/1/import
- https://imagemagick.org/
author: 'Pawel Mazur'
date: 2021-09-21
modified: 2022-10-09
tags:
- attack.collection
- attack.t1113
logsource:
  product: linux
  service: auditd
detection:
  import:
    type: EXECVE
    a0: import
  import_window_root:
    a1: '-window'
    a2: 'root'
    a3|endswith:
    - '.png'
    - '.jpg'
    - '.jpeg'
  import_no_window_root:
    a1|endswith:
    - '.png'
    - '.jpg'
    - '.jpeg'
  condition: import and (import_window_root or import_no_window_root)
falsepositives:
- Legitimate use of screenshot utility
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of the `import` command from the ImageMagick suite, particularly capturing desktop screenshots. Adversaries may leverage such tools to capture sensitive information displayed on the screen, including credentials, sensitive documents, or other critical data. The likelihood of this threat increases on servers where users may have higher privileges and access to confidential information, making the potential impact more significant.

  The rule aligns with the MITRE ATT&CK framework under the tactic of Collection (T1113: Screen Capture). This technique describes the methods by which attackers collect information displayed on a user's screen, often beneficial for further exploitation. The primary data source utilized here is Linux audit logs (auditd) which provide visibility into system calls, enabling the detection of specific commands executed by users.

  ### Investigation Steps
  - **Review Audit Logs**: Check `auditd` logs for instances of the `import` command, particularly focusing on any command arguments that capture the root window or specific image formats (.png, .jpg, .jpeg).

  - **Identify Unusual Usage Patterns**: Analyze historical baselines of screenshot utility usage in your environment. Look for unexpected frequency or timing of `import` command executions, especially from accounts not typically associated with such activities.

  - **Analyze User Context**: Investigate the user accounts executing the `import` command. Determine if these accounts have the necessary permissions for high-sensitivity areas, and assess whether their activity behavior aligns with normal operational patterns.

  - **Evaluate Contextual Evidence**: Correlate findings with additional telemetry, such as process creation events. Check for any associated processes that may indicate an abnormal sequence of actions leading up to the screenshot capture, including network connections that suggest data exfiltration.

  ### Prioritization
  While the severity of this alert is marked as low, it remains crucial for monitoring, especially in environments where sensitive information is processed. The potential for data exposure through unauthorized screen captures warrants a timely investigation.

  ### Blind Spots and Assumptions
  Detection logic relies on the installation of ImageMagick and the proper configuration of `auditd` to log relevant events. A gap exists in detecting legitimate uses of screenshot utilities, leading to potential false positives. Assumptions include that users typically do not execute the `import` command on production servers outside of specified tasks; hence any deviations should be scrutinized. Additionally, adequate logging configuration is essential for the alert's effectiveness, without which relevant evidence may be incomplete or missing.

