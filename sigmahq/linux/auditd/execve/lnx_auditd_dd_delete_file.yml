title: Overwriting the File with Dev Zero or Null
id: 37222991-11e9-4b6d-8bdf-60fbe48f753e
status: stable
description: Detects overwriting (effectively wiping/deleting) of a file.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1485/T1485.md
author: Jakob Weinzettl, oscd.community
date: 2019-10-23
tags:
- attack.impact
- attack.t1485
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'EXECVE'
    a0|contains: 'dd'
    a1|contains:
    - 'if=/dev/null'
    - 'if=/dev/zero'
  condition: selection
falsepositives:
- Appending null bytes to files.
- Legitimate overwrite of files.
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects instances where a file is being overwritten with data from `/dev/null` or `/dev/zero`, often indicative of attempts to erase or obscure file contents. Attackers may utilize this technique to hide their tracks after malicious activity, such as the deployment of malware or the exfiltration of sensitive data. The relevant MITRE ATT&CK tactic is **Impact** with the technique ID **T1485** (Data Destruction).

  Primary telemetry comes from Linux audit logs capturing `EXECVE` system calls, specifically when commands interacting with the `dd` utility are executed. If the behavior is malicious, it could lead to the loss of critical data or the permanent destruction of evidence associated with compromise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate use cases exist for overwriting files.

  ---

  ### Investigation Steps

  - **Check audit logs for execution:** Review Linux audit logs for `EXECVE` system calls where `a0` contains `dd` and `a1` references either `/dev/null` or `/dev/zero` (e.g., Audit Event ID 223). Assess the command history around these events for potential malicious activity.

  - **Identify file targets:** Determine which files were affected by the overwriting action by cross-referencing the timestamps and execution context with the system file integrity logs, verifying if critical configuration or log files were overwritten.

  - **Assess legitimate use cases:** Evaluate the context of the `dd` command's use to determine if it was part of a routine maintenance task. Common benign use cases may include system administrators overwriting log files or clearing temporary files.

  - **Look for signs of freedom of movement:** Investigate any patterns of the same user account performing multiple overwriting actions in a short time frame, which may indicate a malicious attempt to cover tracks.

  - **Validate against known remediation practices:** Confirm if any legitimate incident response or system maintenance actions coincide with the detected behavior, such as common scripts that utilize `dd` for clearing temporary files or logs.

  - **Monitor affected systems for further signs of compromise:** Check for subsequent alerts or unusual activity on the affected system, such as unexpected modification of security configurations or sudden changes in file access patterns.

  ---

  ### Prioritization

  The severity of this alert is moderate. While the immediate impact may seem limited to data overwriting, malicious actors often use such methods to obfuscate their activities, indicating a higher likelihood of an active compromise. Overwriting files with null bytes is a known tactic used to disrupt data integrity and conceal unauthorized changes.

  ---

  ### Blind Spots and Assumptions

  Detection may miss legitimate uses, such as system maintenance or debugging protocols that involve clearing files. Care should also be taken to ensure that Linux audit logs are configured to capture the required detail, as lack of comprehensive logging may lead to blind spots. A related detection to monitor for is the use of `rm` or other deletion commands in conjunction with file overwriting, which can provide further evidence of intent.

