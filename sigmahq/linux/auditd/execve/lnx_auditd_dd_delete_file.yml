title: Overwriting the File with Dev Zero or Null
id: 37222991-11e9-4b6d-8bdf-60fbe48f753e
status: stable
description: Detects overwriting (effectively wiping/deleting) of a file.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1485/T1485.md
author: Jakob Weinzettl, oscd.community
date: 2019-10-23
tags:
- attack.impact
- attack.t1485
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'EXECVE'
    a0|contains: 'dd'
    a1|contains:
    - 'if=/dev/null'
    - 'if=/dev/zero'
  condition: selection
falsepositives:
- Appending null bytes to files.
- Legitimate overwrite of files.
level: low
note: |
  ### Technical Context
  This detection rule identifies the overwriting of files using special device files such as `/dev/null` or `/dev/zero` in a Linux environment. When an attacker inserts null or zero bytes into a file, it can result in data destruction or alteration, supporting their objectives of obfuscation, data manipulation, or creating disruptive behavior on a targeted system. The primary threat scenario involves malicious actors executing commands that lead to the effective deletion or wiping of important data, thereby facilitating further exploitation or data loss.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Impact** (TA0040): The broader motivation for attackers.
  - **Data Manipulation** (T1485): Specifically focusing on the overwriting of files to manipulate or destroy data.

  Primary data sources for this detection include:
  - **Audit Logs**: Generated by the `auditd` service, which logs execution attempts in the system, allowing analysts to identify suspicious commands and file operations.

  ### Investigation Steps
  - **Review audit logs**: Check `auditd` logs for any executions of commands containing `dd` along with parameters involving `/dev/null` or `/dev/zero`. Pay special attention to the context in which these commands were run.
  - **Identify affected files**: Determine which files were targeted by these overwrite operations, and assess their importance. Look for potential data loss or alteration implications.
  - **Correlate with user activity**: Investigate the user account or process that initiated the overwrite command. This may lead to insights about the legitimacy of the operation and any associated user behaviors.
  - **Analyze system state**: Verify the overall system state and check for other anomalies around the same time frame, such as unusual process spawning or network activity, which could indicate broader malicious actions.

  ### Prioritization
  This alert is assigned a low severity in an enterprise environment due to the potential for false positives, as legitimate operations may also lead to file overwriting. However, if found in unusual context or frequency, it could signify an attempt to manipulate or destroy critical data, warranting further investigation.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage associated with legitimate operations that may cause similar logging events, such as routine maintenance tasks that involve overwriting files. The detection logic assumes that not all instances of overwriting via `dd` are malicious; therefore, context surrounding the command execution must be assessed. Additionally, proper configuration of `auditd` is required for effective monitoring, and any absence or misconfiguration of audit logs could inhibit the rule's functionality.

