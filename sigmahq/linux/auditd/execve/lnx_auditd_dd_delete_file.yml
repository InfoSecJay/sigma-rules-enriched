logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'EXECVE'
    a0|contains: 'dd'
    a1|contains:
    - 'if=/dev/null'
    - 'if=/dev/zero'
  condition: selection
falsepositives:
- Appending null bytes to files.
- Legitimate overwrite of files.
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects attempts to overwrite a file using the Linux `dd` command with either `/dev/null` or `/dev/zero` as input sources. The likely attacker objective is to erase sensitive data or previously stored content stealthily, which may indicate data destruction or attempted obfuscation of malicious activity. This behavior aligns with the MITRE ATT&CK tactic of Impact (TA0040) and the technique Data Destruction (T1485). The primary telemetry source is Linux audit logs, specifically focusing on `EXECVE` events where `dd` is invoked with these particular arguments. If malicious, such actions can lead to loss of critical data integrity and availability. Importantly, this detection does NOT confirm malicious intent on its own, as the `dd` command is also used in legitimate operations.

  ---

  ### Investigation Steps

  - **Review audit logs for EXECVE events**: Focus on audit log entries with Event ID 228 and filter for commands containing `dd` along with the arguments `if=/dev/null` or `if=/dev/zero`. Evaluate the execution time and context to discern potentially malicious uses.

  - **Identify and validate user accounts involved**: Check the user ID and command context for the EXECVE events. Legitimate system administrators may use this command, while unusual user accounts performing this action may warrant further investigation.

  - **Correlate with file modification timestamps**: Analyze the modification times of the target files before and after the `dd` command execution to cross-verify if the activity aligns with known maintenance schedules or user activities.

  - **Check logs for related commands**: Look for previous commands executed in conjunction with `dd`, such as file deletions or other `rm` commands, to identify potentially hostile workflows.

  - **Examine application logs**: Investigate application-specific logs for any instances of file modification or deletion related to the context of the `dd` command, especially if critical configuration files are involved.

  - **Look for unusual file paths**: Determine if the target files were previously used in critical processes and whether their modification is out of the ordinary. For instance, files in `/etc` or other sensitive directories being overwritten may indicate malicious activity.

  ---

  ### Prioritization

  This alert should be considered of low severity in a mature enterprise context due to the nature of the `dd` command being used in both benign and malicious ways. However, the impact can be significant if crucial files are tampered with permanently. Therefore, while the likelihood of malicious abuse is moderate, the context of the system and user conducting the operation will help assess the urgency of response.

  ---

  ### Blind Spots and Assumptions

  Detection may miss scenarios where the command is wrapped in a legitimate script or used by authorized personnel in normal operations. Failure to capture log entries due to incorrect audit settings can also lead to gaps. Activities related to legitimate database maintenance or log rotation may trigger this detection. A complementary detection that can enhance visibility is monitoring for unexpected file deletions or modifications within critical directories, ensuring a broader scope of potential data manipulation monitoring.

