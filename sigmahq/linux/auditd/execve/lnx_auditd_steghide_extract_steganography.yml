logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: steghide
    a1: extract
    a2: '-sf'
    a3|endswith:
    - '.jpg'
    - '.png'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the execution of the `steghide` binary used to extract files from images, a common technique for hiding data to evade detection. Attackers may utilize this method to conceal sensitive information or exfiltrate data without raising alarms, aligning with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and technique of Data Encrypted (T1027.003). The primary telemetry source is Linux audit logs, specifically monitoring events related to process execution. If successful, this behavior can lead to unauthorized data loss or leakage. Importantly, this detection does NOT confirm that malicious activity is occurring—it merely indicates that the `steghide` tool was used in a manner that could be benign or malicious.

  ### Investigation Steps

  - **Review the execution context:** Check Auditd logs for Event ID 223 using the command `ausearch -a EXE -i -m EXECVE | grep "steghide"` to ascertain the user who executed the command and the process's parent process. Look for execution by administrative users or unusual contexts; legitimate use is rare.

  - **Verify command parameters:** Ensure that parameters used in the command match expected patterns. Commands with `-sf <image_path>` should not be directed at sensitive images or large binary files that do not typically serve benign purposes, such as `*.jpg` or `*.png`.

  - **Examine system variables:** Collect the output of `env` or check logged environment variables in Auditd logs to identify suspicious user-defined variables before the execution command. Legitimate use often doesn’t have extra variables that could indicate an obfuscation attempt.

  - **Conduct file integrity checks:** Look for new file creations or modifications in directories containing the images used with `steghide` (e.g., `/tmp`, home directories). Use file system monitoring for file access patterns or unusual timestamps that suggest data extraction occurred.

  - **Cross-reference user activity:** Review user activity in `/var/log/auth.log` to investigate logins around the same timestamp as the `steghide` execution. Determine if there are any unusual access patterns, such as logins from unknown IP addresses or at odd hours.

  ### Prioritization

  This alert should be considered medium priority due to the potential impact of data exfiltration from critical systems, though it carries a relatively lower likelihood of abuse than more aggressive attacks. However, steganography techniques, like those using `steghide`, are often employed in targeted attacks, necessitating a focused response.

  ### Blind Spots and Assumptions

  Detection might be limited if `steghide` is executed with different command parameters that are not captured by this rule or if it runs through scripts with altered logging. Ensure that Auditd is properly configured to capture all relevant EXECVE events for comprehensive visibility. Legitimate activities include authorized data handling in research or data manipulation environments. A related detection to consider is monitoring for unusual file access patterns with other binary extractors or compression tools (e.g., `zip`, `tar`).

