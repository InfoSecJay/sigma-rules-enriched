level: low
note: |
  ### Technical Context
  This rule detects the execution of the `steghide` binary with arguments that indicate an extraction of files from images, specifically those that are in `.jpg` or `.png` formats. The steganography technique employed by `steghide` allows adversaries to conceal sensitive information within seemingly innocent image files, thus making it harder for detection mechanisms to identify exfiltration or unauthorized access to confidential data. The likely attacker objective behind employing such techniques is to evade detection and maintain persistence, possibly exfiltrating data without triggering standard security alerts.

  This detection falls under the MITRE ATT&CK tactic of **Defense Evasion**, specifically technique **T1027.003: Obfuscated Files or Information**, where adversaries use steganography as a method to obfuscate their malicious actions. Important telemetry sources include **Linux audit logs** generated by `auditd`, which capture command executions and can provide insight into suspicious activities performed by users or processes.

  ### Investigation Steps
  - **Review audit logs:** Examine the Linux audit logs (`/var/log/audit/audit.log`) for any entries that show the usage of `steghide` with the `extract` option and relevant file types, noting the user and process involved.
  - **Correlate with process activity:** Investigate any process creation events around the same time as the detected `steghide` execution to identify other potentially malicious activities or processes initiated by the same user.
  - **Analyze related file access:** Look for files accessed or modified around the time of `steghide` execution, especially image files that may be under suspicion, as this could provide context to the extraction attempt.
  - **Check for unusual user behavior:** Investigate user accounts that executed this command for abnormal patterns or prior related alerts to determine if they may be compromised or used for insider threat purposes.

  ### Prioritization
  The alert is categorized as low severity in an enterprise context due to the specialized use of steganography typically indicated by skilled adversaries. However, the potential impact can be substantial if sensitive information is being exfiltrated. Analysts should treat such alerts with caution given the implications of data leakage.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments that do not have `auditd` logs enabled or lack comprehensive auditing on all command executions. The detection logic assumes that `steghide` is used in its standard form, and that all image files processed will utilize the specified extensions. It also relies on the presence of adequate kernel auditing settings to capture relevant execution data. If these conditions are not met, this detection will not function as intended.

