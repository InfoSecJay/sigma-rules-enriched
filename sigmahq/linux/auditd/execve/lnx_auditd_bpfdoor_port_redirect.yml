title: Bpfdoor TCP Ports Redirect
id: 70b4156e-50fc-4523-aa50-c9dddf1993fc
status: test
description: |
  All TCP traffic on particular port from attacker is routed to different port. ex. '/sbin/iptables -t nat -D PREROUTING -p tcp -s 192.168.1.1 --dport 22 -j REDIRECT --to-ports 42392'
  The traffic looks like encrypted SSH communications going to TCP port 22, but in reality is being directed to the shell port once it hits the iptables rule for the attacker host only.
references:
- https://www.sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis/
- https://www.elastic.co/security-labs/a-peek-behind-the-bpfdoor
author: Rafal Piasecki
date: 2022-08-10
tags:
- attack.defense-evasion
- attack.t1562.004
logsource:
  product: linux
  service: auditd
detection:
  cmd:
    type: 'EXECVE'
    a0|endswith: 'iptables'
    a1: '-t'
    a2: 'nat'
  keywords:
  - '--to-ports 42'
  - '--to-ports 43'
  condition: cmd and keywords
falsepositives:
- Legitimate ports redirect
level: medium
note: |
  ### Technical Context

  This Sigma rule detects instances where an attacker manipulates TCP traffic on a Linux system using the `iptables` command to redirect traffic intended for common services like SSH (port 22) to a different port associated with a backdoor (e.g., 42392). The likely objective is to obfuscate malicious communication, allowing unauthorized access while evading detection. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (T1562.004).

  The primary telemetry source is Linux audit logs captured by `auditd`, specifically focusing on command execution events involving `iptables`. If malicious, such manipulation could enable persistent backdoor access or unauthorized data exfiltration. Notably, this detection does NOT confirm that a compromise has occurred by itself; it merely indicates an attempt to alter network traffic which may be legitimate in some configurations.

  ### Investigation Steps

  - **Review audit logs for command execution:** Check for entries with `Event ID` relevant to `auditd` commands where `cmd` matches `iptables` and contains `-t nat`. Focus specifically on commands that include `--to-ports 42392` or similar suspicious ports.

  - **Correlate with network traffic analysis:** Examine network traffic logs for unusual connections to the specified redirected ports. Look for indicators of SSH communications that have unusual patterns or encryption that does not conform to expected behavior.

  - **Identify legitimate use cases:** Validate the presence of documented and authorized uses of `iptables`, especially for port redirection. Compare against internal network architecture documentation to ensure no unexpected changes have been made.

  - **Search for backdoor signatures:** Validate the existence of processes listening on the redirected ports like 42392. Use process listing commands or `netstat` to confirm whether these processes are commonly known backdoors or binaries related to legitimate applications.

  - **Check for system integrity:** Review logs and file integrity monitoring alerts for changes made around the time of the `iptables` command execution. Look for unexpected modifications to the system or executables indicative of malicious actions.

  - **Evaluate asset criticality:** Prioritize alert analysis on critical systems (e.g., production servers or those accessible over the public internet) where unauthorized access could lead to severe breaches or data loss.

  ### Prioritization

  This alert should be considered medium severity due to the potential for leading to unauthorized access or data exfiltration. Given the ability of attackers to misuse legitimate commands to redirect traffic, the likelihood of exploitation is notable, making this behavior a known technique in advanced persistence scenarios.

  ### Blind Spots and Assumptions

  The main detection limitation lies in the possibility of legitimate administrative actions that may trigger this alert, such as authorized port redirection for maintenance. Reliable detection requires that `auditd` logging is properly configured and enabled on all relevant systems. Additionally, users with strong knowledge of `iptables` might modify system settings to avoid detection, making it valuable to pair this detection with peer log monitoring for unusual outbound traffic patterns or failed login attempts.

