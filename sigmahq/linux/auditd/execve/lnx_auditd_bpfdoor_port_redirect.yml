title: Bpfdoor TCP Ports Redirect
id: 70b4156e-50fc-4523-aa50-c9dddf1993fc
status: test
description: |
  All TCP traffic on particular port from attacker is routed to different port. ex. '/sbin/iptables -t nat -D PREROUTING -p tcp -s 192.168.1.1 --dport 22 -j REDIRECT --to-ports 42392'
  The traffic looks like encrypted SSH communications going to TCP port 22, but in reality is being directed to the shell port once it hits the iptables rule for the attacker host only.
references:
- https://www.sandflysecurity.com/blog/bpfdoor-an-evasive-linux-backdoor-technical-analysis/
- https://www.elastic.co/security-labs/a-peek-behind-the-bpfdoor
author: Rafal Piasecki
date: 2022-08-10
tags:
- attack.defense-impairment
- attack.t1686
logsource:
  product: linux
  service: auditd
detection:
  cmd:
    type: 'EXECVE'
    a0|endswith: 'iptables'
    a1: '-t'
    a2: 'nat'
  keywords:
  - '--to-ports 42'
  - '--to-ports 43'
  condition: cmd and keywords
falsepositives:
- Legitimate ports redirect
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to iptables configurations, specifically looking for traffic redirection on TCP ports typically used for services like SSH. The likely attacker objective is to obfuscate their command and control (C2) communication by routing it through ports that would normally appear legitimate to casual monitoring, effectively bypassing security controls. The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1203 - Exploitation for Client Execution) and Command and Control (T1043 - Commonly Used Port).

  The primary telemetry source is the Linux audit daemon (auditd), with the required log type being audit logs reflecting the execution of the `iptables` command. If malicious in nature, this behavior indicates an active compromise with potential backdoor access to the system. However, this detection does NOT confirm that the traffic is malicious on its own, as legitimate use of port redirection could also trigger this rule.

  ### Investigation Steps

  - **Review executed commands:** Check Audit logs (Audit Event ID 1304) for execution of `iptables` commands. Look for evidence of redirection using `--to-ports`. Valid commands should relate to expected networking practices and not redirect critical ports like 22 or others associated with common services.

  - **Identify associated network activity:** Analyze network traffic logs (e.g., NetFlow or Suricata logs) for suspicious outgoing connections on redirected ports detected in the `iptables` command. Look for unexpected communication patterns, particularly to external IPs not associated with legitimate company domains.

  - **Validate legitimate configurations:** Compare the current iptables configuration using `iptables -L -t nat` output against baseline configurations. Any unapproved changes should raise further investigations, especially if they involve commonly used services.

  - **Check for other signs of compromise:** Monitor system logs (e.g., /var/log/syslog) for related events or anomalies around the time of the detected iptables command. Look for previously unknown users or sessions that may correlate with the timing of the rule triggering.

  - **Correlate with host indication:** Verify the role and criticality of the affected system. If it's a server exposed to the internet (e.g., a web server), prioritize it higher over internal or less critical assets.

  ### Prioritization

  The alert severity is medium due to the potential impact on security if a critical server is compromised through backdoor access. The likelihood of malicious abuse is significant, as redirects on otherwise secure ports can typically indicate exploitation tactics used by advanced adversaries. The behavior is not uncommon in targeted environments where stealth and persistence are key strategies for attackers.

  ### Blind Spots and Assumptions

  Detection is limited by the effectiveness and configuration of auditd logging, meaning misconfigurations or lack of logging may lead to missed detections. Legitimate administration tasks, such as maintenance or troubleshooting, may create false positives if port redirection is validly applied. A related detection could include monitoring for unexpected outbound connections on ephemeral ports (like 42392) to strengthen coverage against potential misuse.

