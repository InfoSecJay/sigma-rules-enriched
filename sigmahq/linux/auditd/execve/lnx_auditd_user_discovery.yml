logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'EXECVE'
    a0:
    - 'hostname'
    - 'id'
    - 'last'
    - 'uname'
    - 'users'
    - 'w'
    - 'who'
    - 'whoami'
  condition: selection
falsepositives:
- Admin activity
level: low
note: |
  ### Technical Context

  This rule detects the execution of various Linux command-line utilities that are often used for system or user discovery, such as "whoami", "hostname", and "id". These commands can help an adversary gather information about the system and users, which may inform their subsequent actions, such as further exploitation or lateral movement. The relevant MITRE ATT&CK tactic for this behavior is Discovery, specifically technique T1033 (System Owner/User Discovery).

  Primary telemetry sources include Linux audit logs captured by Audit Daemon (auditd) that record commands executed on the system. If executed by a malicious actor, this activity can significantly compromise security, as the results may guide further attacks or tactical decisions. Importantly, the detection of these commands does NOT confirm malicious intent on its own, as they may also indicate legitimate administrative activities.

  ### Investigation Steps

  - **Review executed commands:** Check audit logs (e.g., `/var/log/audit/audit.log`) for Event IDs related to EXECVE. Look for command strings matching `hostname`, `id`, `whoami`, etc. Legitimate admin activity will likely display scheduled maintenance or legitimate user inquiries.

  - **Identify user context:** Determine which user executed the commands based on the audit logs. Look for the user ID (e.g., `a0=UID`, `a0=USER`) associated with the EXECVE events. Commands executed by unfamiliar or non-administrative users may indicate malicious intent.

  - **Assess timing and frequency:** Analyze the timestamps associated with the command executions. Frequent running of these discovery commands in quick succession may suggest automated scripts rather than manual execution, which is a suspicious indicator.

  - **Correlate with other alerts:** Cross-reference the findings with other security alerts, especially those related to authentication failures or unusual logins. Any simultaneous execution of discovery commands alongside login anomalies could elevate the suspicion of a targeted attack.

  - **Check for post-command behavior:** Investigate subsequent actions taken by the same user or session after running the discovery commands. If followed by changes in system configurations or attempts to access sensitive files (as captured in `/var/log/audit/audit.log` for specific WRITE operations), consider these as high-confidence malicious indicators.

  ### Prioritization

  This alert should be treated as low severity in a mature enterprise context, as it may reflect benign administrative tasks like system maintenance. However, if the execution context suggests a non-standard user or correlates with other suspicious activity, its risk level can escalate due to the potential for reconnaissance leading to further exploitation.

  ### Blind Spots and Assumptions

  Detection can be evaded through the use of obfuscation techniques or if an adversary employs less recognizable commands. Depending on the audit configuration, some logs might not capture all command executions. Legitimate activities such as routine checks by system administrators might trigger this alert. A related detection to enhance coverage could include monitoring for unauthorized changes to user accounts or privilege escalation attempts, which can indicate follow-on actions post-discovery gathering.

