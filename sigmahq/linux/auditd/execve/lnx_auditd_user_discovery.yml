    - 'who'
    - 'whoami'
  condition: selection
falsepositives:
- Admin activity
level: low
note: |
  ### Technical Context
  This detection rule identifies the execution of host or user discovery commands on Linux systems, such as `whoami`, `hostname`, `id`, and others. These commands are commonly used to obtain information about the system and users, which can be leveraged by adversaries during reconnaissance phases of an attack. By understanding the system environment and user context, attackers can determine potential targets for further exploitation, such as privilege escalation or lateral movement.

  The threat scenario typically involves an adversary conducting automated discovery to map out a network environment following an initial compromise. They may collect details to inform their decisions about whether to deploy additional malware, escalate privileges, or pivot to other systems within the network. The relevant MITRE ATT&CK tactics and techniques for this detection rule include **Discovery** (TA0007) and **System Owner or User Discovery** (T1033).

  Primary data sources for evidence include **audit logs** from the Linux `auditd` service, which can capture process execution events and related metadata regarding system commands executed on the system.

  ### Investigation Steps
  - **Review Audit Logs**: Examine audit logs from `auditd` to locate entries corresponding to the execution of discovery commands. Look for timestamps, user IDs, and command parameters to assess the context of these actions.
  - **Correlate User Behavior**: Validate whether the user executing these commands typically performs such actions or if it's anomalous behavior. Compare against normal operational profiles to identify potential insider threats or compromised accounts.
  - **Analyze Network Traffic**: If possible, analyze network traffic for outbound connections or unusual system communications following the command executions. This may reveal data exfiltration attempts or further reconnaissance activities.
  - **Identify Recent Changes**: Check for recent changes in user permissions or system configurations that may have enabled unauthorized access or discovery activities, indicating a potential compromise.

  ### Prioritization
  This alert is classified as low severity; however, it should not be dismissed in an enterprise context. While the command executions could stem from legitimate administrative activities, unusual patterns may signal reconnaissance efforts that precede more serious cyber threats. Prompt investigation is warranted to rule out malicious actions.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of discovery command usage, particularly in scenarios where users have legitimate reasons to execute these commands. The accuracy of detection relies on `auditd` being properly configured and enabled on all monitored Linux systems. Any gaps in log collection systems may lead to missed detections of potentially harmful activities.

