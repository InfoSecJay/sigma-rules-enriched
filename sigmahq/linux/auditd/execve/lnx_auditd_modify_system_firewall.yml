note: |
  ### Technical Context

  This rule detects modifications to Linux firewall configurations, particularly the deletion of firewall rules via common command utilities like `iptables`, `firewall-cmd`, `ufw`, and `nft`. The likely attacker objective is to circumvent established network security controls, allowing unauthorized access or data exfiltration. It aligns with the MITRE ATT&CK tactic of Defense Evasion (T1589) and the technique of Application Layer Protocol (T1686). The primary telemetry source is audit logs from Linux systems, specifically events generated by `auditd` for executed commands. If malicious, such behavior can significantly compromise the integrity of network defenses. Importantly, this detection does NOT confirm malicious intent; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Check executed commands in audit logs:** Review auditd logs for Event ID 2302 (command execution), focusing on actions involving `iptables`, `firewall-cmd`, `ufw`, or `nft` keywords. Compare the timestamp of execution with unusual network traffic patterns.

  - **Identify the user context of the command:** Investigate the user ID and process ID associated with the command execution. Systems leveraging default (non-root) user accounts for firewall changes may indicate potential compromise.

  - **Review recent firewall rule changes:** Execute a command such as `iptables -L` or `nft list ruleset` to identify current firewall rules. Compare these to historical baselines to identify unauthorized modifications.

  - **Verify legitimate activity:** Check for scheduled tasks or maintenance windows for expected firewall modifications. Common scripting or configuration management tools like Ansible or Puppet may indicate planned changes.

  - **Look for related suspicious activity:** Investigate related log files for processes around the same timeframe, such as `auth.log` or `/var/log/syslog`, to find corroborative detrimental actions or unauthorized access attempts.

  - **Cross-reference config changes with asset criticality:** Prioritize investigations on firewalls managing sensitive data or critical infrastructure. Document any potential matches against known threat actor behaviors associated with lateral movement.

  ### Prioritization

  This alert holds medium severity due to potential impact on network security. While firewalls can be commonly manipulated, the likelihood of malicious abuse increases in environments with rule changes that lack documented administrative justification or approval processes.

  ### Blind Spots and Assumptions

  Detection is limited by the lack of complete log coverage; malconfigurations in auditd settings may result in missed detections. Legitimate administrative actions, such as scheduled maintenance or dynamic configuration changes, can trigger the alert. Companion detections include monitoring for suspicious inbound/outbound connections in conjunction with firewall rule changes, reinforcing coverage against potential threats.

