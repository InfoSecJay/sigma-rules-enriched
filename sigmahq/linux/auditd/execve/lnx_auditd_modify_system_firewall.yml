note: |
  ### Technical Context
  This detection rule identifies actions that involve modifying or deleting firewall rules on Linux systems. Attackers may attempt to disable or remove firewall rules to evade network security controls that restrict unauthorized access or network traffic. The primary objective of such actions is often to create a pathway for malicious activity, such as data exfiltration or lateral movement within a network. By manipulating firewall configurations, adversaries can effectively hide their activities and avoid detection by security systems.

  Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1562)**, specifically focusing on **Modification of System Firewall Rules (T1562.004)**. These techniques are used to alter security settings to evade detection and maintain persistence within a compromised environment.

  The primary data sources for detecting these events include **audit logs from the Linux audit daemon (auditd)**, which records system calls that modify firewall settings. Monitoring these logs will provide insights into potentially malicious actions taken by users or processes interacting with firewall utilities.

  ### Investigation Steps
  - **Review Audit Logs**: Examine auditd logs for entries related to commands such as `iptables`, `firewall-cmd`, `ufw`, and `nft`, focusing particularly on actions that include terms like "remove," "delete," or "flush."

  - **Identify User Context**: Determine the user or process initiating the firewall modifications. Investigate whether the user is authorized to make such changes and if there are patterns of unusual behavior that could indicate malicious intent.

  - **Correlate with Network Traffic**: Analyze network traffic logs post-modification to identify any unusual outbound connections or blocked traffic that may indicate exploitation of the modified firewall rules.

  - **Check Configuration and Policy Compliance**: Review existing firewall configurations and security policies to ensure they are enforced. Investigate any deviations to ascertain whether the changes were authorized or part of a malicious strategy.

  ### Prioritization
  The alert is assigned a medium severity level due to the potential impact on network security, as unauthorized changes to firewall settings could create significant vulnerabilities. The likelihood of exploitation increases in environments where firewall rules are critical for protecting sensitive data and systems.

  ### Blind Spots and Assumptions
  This detection may have gaps for environments where the audit logs are not configured to capture specific EXECVE calls, or where alternative firewall management tools are used that do not align with the detection criteria. The detection logic assumes that any modification or deletion of firewall rules is malicious, excluding legitimate administrative actions, which may result in false positives. Proper logging configurations and auditing must be enabled for the alert to function effectively.

