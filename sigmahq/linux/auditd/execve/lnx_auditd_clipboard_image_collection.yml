title: Clipboard Collection of Image Data with Xclip Tool
id: f200dc3f-b219-425d-a17e-c38467364816
status: test
description: |
  Detects attempts to collect image data stored in the clipboard from users with the usage of xclip tool.
  Xclip has to be installed.
  Highly recommended using rule on servers, due to high usage of clipboard utilities on user workstations.
references:
- https://linux.die.net/man/1/xclip
author: 'Pawel Mazur'
date: 2021-10-01
modified: 2022-10-09
tags:
- attack.collection
- attack.t1115
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: xclip
    a1:
    - '-selection'
    - '-sel'
    a2:
    - clipboard
    - clip
    a3: '-t'
    a4|startswith: 'image/'
    a5: '-o'
  condition: selection
falsepositives:
- Legitimate usage of xclip tools
level: low
note: |
  ### Technical Context

  This rule detects the use of the `xclip` tool for collecting image data from the clipboard on Linux systems, which can indicate malicious data exfiltration or reconnaissance activities. The likely attacker objective is to harvest sensitive information temporarily stored in the clipboard, often in a targeted phishing or social engineering context. This behavior falls under the MITRE ATT&CK tactic "Collection" (TA012) and technique "Clipboard Data" (T1115).

  The primary telemetry source is Linux audit logs, specifically monitoring EXECVE calls tied to the execution of the `xclip` utility. If malicious, this could enable the attacker to capture sensitive images or screenshots, posing a risk to data confidentiality. However, this detection does NOT confirm that data exfiltration occurred on its own; legitimate clipboard usage can trigger the rule.

  ### Investigation Steps

  - **Verify the context of `xclip` usage**: Check `auditd` logs for Event ID 132 (EXECVE) that includes `xclip`. Pay attention to the command arguments: `-selection`, `-t image/*`, and `-o`. Compare these against known legitimate usage patterns to determine if a user is performing typical clipboard actions.

  - **Identify high-confidence malicious indicators**: Look for multiple calls to `xclip` in a short time frame, especially from non-user accounts or unexpected processes. Check for anomalies in the calling user's environment or if `xclip` is invoked more than once within a minute.

  - **Check the log for suspicious user activity**: Review user activity surrounding the alert, focusing on `auditd` logs for additional commands in the same session. Look at the user’s recent history (e.g., `~/.bash_history`) to find if they executed other potentially malicious commands.

  - **Review asset criticality**: Determine the criticality of the host executing `xclip`. If it's a server or a common workstation, assess the sensitivity of the data expected to be handled by that system and whether clipboard utilities are typical for its role.

  - **Assess potential for false positives**: Identify instances of legitimate `xclip` use by key personnel, noting if there's a scheduled process or routine usage in user documentation or communication that justifies clipboard image data collection.

  ### Prioritization

  The alert has a low severity due to the potential benign use of `xclip` for legitimate tasks, particularly on user workstations where clipboard utilities are often used. However, on servers, even low-risk activities could indicate attempted lateral movement or exfiltration, making it still worthy of investigation.

  ### Blind Spots and Assumptions

  This detection may not capture all clipboard-related activities, especially if other tools are used for similar purposes. The effectiveness of this rule is dependent on having auditd properly configured to log EXECVE calls. Legitimate users may trigger this alert when using `xclip` for normal operational tasks. A related detection could include monitoring for suspicious outputs from the `xclip` tool when combined with unusual network or file transfer activity, which can enhance coverage of potential data exfiltration attempts.

