title: Clipboard Collection of Image Data with Xclip Tool
id: f200dc3f-b219-425d-a17e-c38467364816
status: test
description: |
  Detects attempts to collect image data stored in the clipboard from users with the usage of xclip tool.
  Xclip has to be installed.
  Highly recommended using rule on servers, due to high usage of clipboard utilities on user workstations.
references:
- https://linux.die.net/man/1/xclip
author: 'Pawel Mazur'
date: 2021-10-01
modified: 2022-10-09
tags:
- attack.collection
- attack.t1115
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: xclip
    a1:
    - '-selection'
    - '-sel'
    a2:
    - clipboard
    - clip
    a3: '-t'
    a4|startswith: 'image/'
    a5: '-o'
  condition: selection
falsepositives:
- Legitimate usage of xclip tools
level: low
note: |
  ### Technical Context
  This detection rule identifies activity related to the `xclip` tool, which is used to manipulate clipboard data on Linux systems. Specifically, it targets scenarios where an attacker may attempt to collect image data from the clipboard, a method that can facilitate data exfiltration or reconnaissance. This behavior is typically indicative of an adversary's objective to gather sensitive information that may be unintentionally copied to the clipboard by users during their normal activities.

  The relevant MITRE ATT&CK tactics for this detection are **Collection** (TA0009) and **Clipboard Data Collection** (T1115). The focus of the rule is on tracking the execution of `xclip` with specific arguments that suggest clipboard image data is being accessed, which can be a precursor to data exfiltration attempts. The primary telemetry for effective detection comes from **audit logs** that capture process execution events on Linux systems, specifically via `auditd`.

  ### Investigation Steps
  - **Collect Audit Logs**: Gather `auditd` logs for system execution events to identify instances where `xclip` has been executed with parameters relevant to clipboard image data collection.
  - **Review User Activity**: Examine the context of the user accounts running the `xclip` command, including recent activities and permissions, to establish if there are any suspicious behavior patterns.
  - **Check for Misuse of Tools**: Investigate the presence of `xclip` on the system and correlate its usage with known legitimate operations; pay attention to workplace policies regarding clipboard management.
  - **Monitor Data Transfer**: Review network logs for unusual outbound connections or data transfers that may correspond with the times when `xclip` was used to gather clipboard data, which may indicate a data leakage attempt.

  ### Prioritization
  The low severity of this alert is based on the potential for legitimate usage in user workstations and the specific context of activity involving `xclip`. However, in high-security environments or on servers, any unexpected use of clipboard utilities should be taken seriously due to the associated risks of sensitive data exfiltration.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the potential use of alternative clipboard management tools apart from `xclip`, which may not be monitored by this rule. Additionally, the detection logic assumes that `xclip` will be utilized in a typical manner, disregarding potential evasion tactics that an attacker might deploy, such as renaming the tool or using alternate flags. For the alert to function correctly, `auditd` must be properly configured to log process execution events, and there should be a clear understanding of what constitutes benign use versus malicious activity in the environment.

