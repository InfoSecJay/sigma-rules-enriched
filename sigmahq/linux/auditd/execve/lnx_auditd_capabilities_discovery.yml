note: |
  ### Technical Context

  This Sigma rule detects the execution of the `getcap` command with specific parameters (`-r` and `/`), which attempts to list files with setuid/setgid capabilities across the entire filesystem. Such discovery is commonly performed by adversaries with the intent to escalate privileges, as it identifies executables that might allow unauthorized privilege escalation if exploited. This behavior is directly linked to the MITRE ATT&CK tactic of Discovery (ID: T1083) and Privilege Escalation (ID: T1548).

  The primary telemetry source for this detection is audit logs from Linux systems, specifically the `auditd` service. If exploited, the security impact could be significant, leading to unauthorized access or control over elevated privileges on critical systems. Importantly, this detection does NOT confirm that a privilege escalation has occurred; it only indicates an intention to explore potential attack vectors.

  ### Investigation Steps

  - **Review audit logs for execution events**: Check `auditd` logs (Event ID 132) for instances of the `getcap` command with `-r /`. Look for patterns like repeated execution or unusual command timing, which can indicate malicious activity.

  - **Correlate with user identities**: Determine the user context executing the command. Normal usage would typically involve system administrators or automation scripts. Unusual user accounts or sessions executing this command can indicate malicious intent.

  - **Identify legitimate usage patterns**: Document and compare against known administrative tasks that might require `getcap`. Legitimate users would usually only run this command occasionally, and primarily in targeted directory contexts, not recursively on `/`.

  - **Examine resulting find outputs**: If feasible, retrieve any subsequent logs or outputs from the `getcap` execution that showcase specific capabilities discovered. Look for unusual files, especially in sensitive directories (e.g., `/usr/bin`, `/usr/local/bin`).

  - **Analyze for prior privilege escalation attempts**: Check logs for any subsequent commands that suggest attempts to exploit the behavior of discovered files, such as executing these programs or changing their permissions (using `chmod`).

  - **Investigate potential evasion techniques**: Consider other commands like `find` combined with `getcap` that could go undetected. Monitor for such variations or patterns in command-line arguments that might indicate obfuscation attempts.

  ### Prioritization

  This alert should be treated with low to moderate severity in an enterprise context. While the impact of escalated privileges can be high, the low likelihood of malicious abuse and the fact that the behavior may represent legitimate admin-level tasks reduces the urgency for immediate response. However, this behavior can be a precursor to an attack and should be investigated for potential threats.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers utilizing other commands or techniques to achieve similar privileged discovery without triggering this rule, such as modified versions of `getcap`. Additionally, the correct configuration and logging via `auditd` are essential for this detection to be effective. Legitimate administrative activities, such as system audits or security assessments, could trigger this alert. Related detections, such as monitoring for unusual file permission changes (e.g., via `chmod`), can help strengthen overall coverage regarding potential privilege escalation activities.

