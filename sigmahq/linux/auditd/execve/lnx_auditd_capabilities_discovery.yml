note: |
  ### Technical Context

  This detection identifies attempts to run the `getcap` command with recursive parameters to discover files on a Linux system that have the setuid/setgid capabilities. The primary objective of an attacker utilizing this behavior is to enumerate potentially exploitable binaries that can escalate their privileges within the operating system. This behavior is relevant to the MITRE ATT&CK tactic of Discovery (ID: TA0007) and the technique of Privilege Escalation via Capability Discovery (ID: T1548).

  The primary telemetry source for this detection is `auditd`, specifically observing events generated by the execution of commands associated with capability discovery. If malicious, successful execution of this behavior could lead to unauthorized access or escalation of privileges. Importantly, this detection does NOT confirm that an escalation has occurred; it merely indicates an attempt to identify potential targets.

  ### Investigation Steps

  - **Check command execution history: ** Review command logs for the string `getcap -r /`. Verify the context of the command usage, specifically looking for user accounts and associated hostnames in relevant logs (e.g., `bash_history` or `auditd` logs).

  - **Examine audit logs: ** Look at `auditd` logs (e.g., Event ID 1300) for entries related to `execve` calls, specifically for the command `/sbin/getcap`. Focus on the timestamp and user initiating the command to assess the legitimacy.

  - **Assess user permissions: ** Identify the user or process executing the `getcap` command. Legitimate users typically should not execute this command. Check if the user belongs to any administrative or developer groups who may need this access for normal operations.

  - **Identify any high-confidence malicious indicators: ** If the command is executed by an unexpected user, particularly unauthenticated or low-privilege accounts, consider this a high-confidence indicator of potential malicious activity.

  - **Verify system file capabilities: ** Use the command `getcap -r /etc/` to manually check for any setuid/setgid binaries. Ensure that known benign binaries, such as `ping` or `passwd`, are accounted for, as these are frequently part of legitimate operations in a controlled environment.

  ### Prioritization

  This alert should be prioritized as low severity in a typical enterprise context due to the frequency of legitimate administrative tasks that might include running `getcap`. However, vigilance is necessary as this behavior may indicate preparation for privilege escalation, particularly if it is executed by non-administrative users or in unexpected contexts.

  ### Blind Spots and Assumptions

  Detection may be limited by the permissions set for `auditd`, where not all command executions are captured if the user executing the commands has elevated privileges that bypass standard logs. Additionally, the normal use of `getcap` by qualified system administrators can generate false positives. Companion detections, such as monitoring for unauthorized escalation attempts using `setcap` or setsuid executions following this detection, will enhance coverage against privilege escalation attempts.

