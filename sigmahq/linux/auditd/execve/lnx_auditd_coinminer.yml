note: |
  ---

  ### Technical Context

  This Sigma rule detects the use of the `--cpu-priority` command-line parameter, a common flag used by cryptocurrency miners aiming to control the CPU usage of their processes. Malicious adversaries often leverage this capability to minimize detection while utilizing system resources, potentially leading to performance degradation and unauthorized system usage. The relevant MITRE ATT&CK tactic is Privilege Escalation (T1068).

  The primary telemetry source for this detection is audit logging from Linux systems, particularly the audit daemon (auditd). If successful, the security impact includes CPU resource exhaustion, leading to service degradation or operational disruption. Importantly, this detection does not confirm that coin mining is currently occurring, as other legitimate applications may also utilize the `--cpu-priority` parameter.

  ---

  ### Investigation Steps

  - **Check audit logs for command usage:** Review audit.log for entries containing `--cpu-priority` (e.g., Event ID 1100 specific to auditd). Cross-reference process owner to determine legitimacy.

  - **Determine process origins:** Identify the parent process for any command using `--cpu-priority` via audit logs. Check if the parent process is a known mining tool or a benign application, which may indicate a false positive.

  - **Monitor CPU usage patterns:** Assess system performance metrics (using tools like `top` or `htop`) for elevated CPU usage trends correlating with the identified command-line usage. Legitimate processes typically show consistent usage patterns relative to expected workloads.

  - **Review scheduled tasks for anomalies:** Check for any cron jobs or systemd timers invoking processes with `--cpu-priority`. Look for unusual schedules or contexts that could signify malicious intent.

  - **Identify high-confidence malicious indicators:** Look for known miner processes such as `xmrig` or `minerd` shortly before or after the invocations of the parameter. Correlating these with the command hits increases the confidence in the detection.

  ---

  ### Prioritization

  This alert should be classified as critical due to its potential for performance impact on affected systems that may have been co-opted for cryptocurrency mining. The likelihood of malicious abuse is high, given the low overhead associated with mining operations, making this behavior frequently weaponized in compromised environments.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate applications that also utilize `--cpu-priority`, potentially leading to false positives. Reliable detection requires proper auditd configuration, including tracking of all command executions. Be aware that routine development or maintenance processes by system administrators might trigger this alert if they use the flag unintentionally. A companion detection to consider is monitoring for unexpected network connections from processes identified as employing this parameter, which could further confirm malicious activity.

