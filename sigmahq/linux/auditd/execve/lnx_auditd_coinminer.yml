title: Possible Coin Miner CPU Priority Param
id: 071d5e5a-9cef-47ec-bc4e-a42e34d8d0ed
status: test
description: Detects command line parameter very often used with coin miners
references:
- https://xmrig.com/docs/miner/command-line-options
author: Florian Roth (Nextron Systems)
date: 2021-10-09
modified: 2022-12-25
tags:
- attack.privilege-escalation
- attack.t1068
logsource:
  product: linux
  service: auditd
detection:
  cmd1:
    a1|startswith: '--cpu-priority'
  cmd2:
    a2|startswith: '--cpu-priority'
  cmd3:
    a3|startswith: '--cpu-priority'
  cmd4:
    a4|startswith: '--cpu-priority'
  cmd5:
    a5|startswith: '--cpu-priority'
  cmd6:
    a6|startswith: '--cpu-priority'
  cmd7:
    a7|startswith: '--cpu-priority'
  condition: 1 of cmd*
falsepositives:
- Other tools that use a --cpu-priority flag
level: critical
note: |
  ### Technical Context
  This rule detects the use of the command line parameter `--cpu-priority`, which is frequently associated with cryptocurrency miner activities. Attackers may execute such processes to gain unauthorized use of system resources for mining digital currencies, thereby impacting system performance and consuming electricity without the consent of the system owner. The likely objectives of the attackers include profit generation through cryptojacking, maintaining persistence on compromised systems, and potentially conducting further malicious operations under the guise of legitimate processes.

  Relevant MITRE ATT&CK tactics include **Privilege Escalation** and **Execution**. Specifically, the techniques involved are **T1068: Exploit Public-Facing Application** and potentially others focused on unauthorized use of system resources. The primary data sources for this detection are **auditd logs** from Linux systems, which provide detailed records of command execution and associated parameters, enabling analysts to identify potentially malicious activity.

  ### Investigation Steps
  - **Review Command-Line Arguments:** Examine the `auditd` logs for entries containing the `--cpu-priority` argument, paying close attention to the context in which this parameter is used (e.g., alongside other suspicious commands).
  - **Analyze Process Creation:** Investigate the parent and child processes associated with the detected command-line execution to identify any patterns or other unusual activities linked to known coin mining tools.
  - **Correlate Network Activity:** Explore outbound connections from the host running the command to identify interactions with known cryptocurrency pool IPs or domains that may indicate mining activity.
  - **Assess System Resource Utilization:** Monitor CPU and GPU usage metrics during the time window of the detected activity to evaluate if the resource usage aligns with typical application workloads or indicates anomalous behavior typical of mining operations.

  ### Prioritization
  Given the critical nature of the alert, the severity is heightened by the potential impact on system performance and resources, the likelihood of financial implications from unauthorized use, and the risk of further compromise. Quick action can prevent further exploitation and resource drain.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if the logs from `auditd` are not properly configured or if alternate command-line flags are employed without invoking `--cpu-priority`. Additionally, the detection logic assumes that coin mining tools provide a typical signature via this argument, which may not always hold true if attackers utilize non-standard tools or obfuscation techniques. Logs from other processes and system utilities that rely on CPU priority settings may lead to false positives, and thus careful consideration must be given when analyzing alerts.

