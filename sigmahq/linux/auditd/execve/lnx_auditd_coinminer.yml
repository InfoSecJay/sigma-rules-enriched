level: critical
note: |
  ### Technical Context

  This detection targets command line arguments containing the `--cpu-priority` flag, which is a common parameter associated with cryptocurrency mining software. Attackers often aim to conduct unauthorized resource consumption for profit, compromising system performance and impacting overall operational efficiency. This detection correlates with the MITRE ATT&CK tactic of Privilege Escalation (T1068) as attackers may exploit a system's resources to elevate their control over it.

  Primary telemetry sources include Linux audit logs generated by `auditd`, specifically logs reflecting command-line arguments executed by processes. If a coin miner is indeed executed, this can lead to increased CPU utilization, possible system instability, and unauthorized generation of cryptocurrency. It is important to note that the presence of this command-line parameter alone does not confirm malicious activity—it requires further investigation to ascertain the context of execution.

  ### Investigation Steps

  - **Check command execution details:** Review auditd logs (Event ID related to command execution, typically contains `execve` syscall) for entries showing `--cpu-priority`. Determine the processes initiated with this parameter including their execution time and originating user.

  - **Verify process ownership:** Identify the user account associated with the process executing the `--cpu-priority` flag. Legitimate system processes typically run under specific service accounts, while unusual user accounts may indicate potential misuse.

  - **Analyze CPU usage:** Monitor CPU metrics using tools like `top` or `htop`. Systems running legitimate applications should display expected usage patterns. Abnormal spikes in CPU usage could signal active mining applications.

  - **Examine process lineage:** Utilize `pstree` or check the `/proc/[pid]/cmdline` to examine parent processes of any identified processes using `--cpu-priority`. Identify any suspicious parent processes that may indicate malware deployment or exploitation.

  - **Check installed software:** Review software on the host with package management commands (e.g., `dpkg -l` for Debian-based systems) to see if any unauthorized mining software is installed. Compare against known good configurations.

  - **Assess log presence and integrity:** Ensure that audit logs are being recorded and not tampered with. Check for any log deletion or modification activities, which may indicate an attempt to obscure the installation of malware.

  ### Prioritization

  This alert is critical due to potential high impact on system performance and resources, with a significant likelihood of malicious exploitation given the prevalence of coin mining behavior in compromised environments. Coin mining is frequently weaponized in attacks leveraging prior access, making rapid response essential.

  ### Blind Spots and Assumptions

  Detection of `--cpu-priority` may be evaded if command line arguments are obscured by adversaries or if they use less common mining tools that do not utilize this argument. Reliable detection requires consistent logging of auditd and may be limited by improper audit configuration. Legitimate performance-tuning tools may trigger this alert. Companion detections include monitoring for unusual process creation patterns or high CPU consumption associated with unusual parent processes.

