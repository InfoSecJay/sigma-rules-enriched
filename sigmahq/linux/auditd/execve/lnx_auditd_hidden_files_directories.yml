title: Hidden Files and Directories
id: d08722cd-3d09-449a-80b4-83ea2d9d4616
status: test
description: Detects adversary creating hidden file or directory, by detecting directories
  or files with . as the first character
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.001/T1564.001.md
author: 'Pawel Mazur'
date: 2021-09-06
modified: 2025-06-16
tags:
- attack.defense-evasion
- attack.t1564.001
logsource:
  product: linux
  service: auditd
detection:
  selection_commands:
    type: 'EXECVE'
    a0:
    - 'mkdir'
    - 'nano'
    - 'touch'
    - 'vi'
    - 'vim'
  selection_arguments:
  - a1|re: '(^|\/)\.[^.\/]'
  - a2|re: '(^|\/)\.[^.\/]'
  condition: all of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the creation of hidden files or directories by monitoring the system for commands used to create such items, specifically where the names start with a dot (`.`). Attackers often use hidden files and directories to obfuscate malicious activities or to store tools and scripts that might be later leveraged for further attacks. This could be part of a broader attack strategy, such as establishing persistence or preparing tools for exfiltration or lateral movement.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005) and the specific technique **Hidden Files and Directories** (T1564.001). The intention behind this tactic is typically to avoid detection by system-level monitoring and security measures. Analysts should primarily reference audit logs from Linux auditd, which captures detailed information about file system changes, process executions, and related operations.

  ### Investigation Steps
  - **Review Audit Logs:** Examine auditd logs for entries related to the commands `mkdir`, `nano`, `touch`, `vi`, and `vim` with filenames starting with a period. Focus on any unusual timestamps or patterns.
  - **Identify Suspicious Context:** Look for patterns or trends in the file creation that might suggest automation or recurrent behavior indicative of malicious intent, such as rapid creation of multiple hidden files.
  - **Correlate with User Activity:** Cross-reference the executed commands with user activity logs to identify anomalies, including checks for unusual accounts or sessions executing the commands.
  - **Assess File Content:** If possible, analyze the contents of newly created hidden files or directories for malicious scripts or binaries, as well as their creation date and associations with other suspicious events.

  ### Prioritization
  Given the low-level classification of this alert, it is essential to cautiously assess its context within the enterprise environment. However, if correlated with other indicators of compromise, it may indicate a more significant threat, making it critical to investigate the circumstances surrounding such activities.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding non-standard file creation methods or in environments where auditd is disabled or improperly configured. The detection logic assumes that the system's auditing capabilities are enabled and that all relevant logs are retained for analysis. Additionally, this rule may be less effective in environments where legitimate processes utilize hidden files for valid reasons, potentially leading to false positives.

