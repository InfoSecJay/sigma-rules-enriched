note: |
  ### Technical Context

  This Sigma rule detects the creation of hidden files or directories on Linux systems, specifically those starting with a dot (.) character. This behavior is often employed by attackers to conceal malicious artifacts, thereby evading detection and making it harder for defenders to spot ongoing compromise. The likely attacker objective is to hide backdoors, scripts, or other malicious files that facilitate continued access or data exfiltration.

  The relevant MITRE ATT&CK tactic is **Defense Evasion**, with the technique identified as **T1564.001: Hiding Files and Directories**. The primary telemetry source for this detection is the Linux audit daemon (auditd), capturing EXECVE system calls that include commands like `mkdir`, `nano`, `touch`, `vi`, or `vim` that create hidden files or directories. If malicious, such behavior could indicate an active compromise, potentially leading to further exploitation or data loss. However, this detection does NOT confirm malicious intent on its own; it merely indicates that a hidden file or directory was created.

  ### Investigation Steps

  - **Review audit logs for suspicious creations:** Check auditd logs (typically `/var/log/audit/audit.log`) for Event IDs related to `EXECVE` involving commands like `mkdir` with `a1` or `a2` fields matching `(^|\/)\.[^.\/]`. Look for timestamps that correlate with known suspicious activities.

  - **Identify legitimate usage patterns:** Confirm if legitimate users or processes are executing commands that create hidden files, particularly system maintenance or development processes. For example, developers may create hidden configuration files on servers.

  - **Correlate with user behavior:** Examine the user context associated with the command by reviewing the `uid` and `pid` fields in the audit logs. Verify whether the user has a legitimate reason for creating these hidden files, such as a system administrator or application service account.

  - **Extract potential malicious indicators:** Investigate the paths where hidden files were created. High-confidence malicious indicators include names that resemble common system files or scripts, such as `.bash_profile`, `.ssh/authorized_keys`, or files with executable permissions in suspicious directories.

  - **Check for traces of lateral movement or persistence:** Look for any other suspicious commands executed around the same time as the creation of the hidden file or directory. Cross-reference this with logs from correlating services (e.g., SSH logs for unauthorized remote access attempts).

  ### Prioritization

  This alert carries a **low severity** rating in a mature enterprise context; however, it can escalate if it occurs on critical systems or is associated with known malicious behavior. The likelihood of malicious abuse is moderate, though the creation of hidden files is a common tactic in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection is limited by the configurational state of auditd, as improper setup could lead to missing events. Evasion techniques may involve using alternative methods to create hidden files, such as using scripts or non-standard tools. Legitimate activities like temporary file storage by applications can trigger the alert, underscoring the need for context around each event. Companion detections, such as monitoring for unusual EXECVE patterns or analyzing file access logs, would strengthen overall detection capabilities.

