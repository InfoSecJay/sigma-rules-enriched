title: Hidden Files and Directories
id: d08722cd-3d09-449a-80b4-83ea2d9d4616
status: test
description: Detects adversary creating hidden file or directory, by detecting 
  directories or files with . as the first character
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.001/T1564.001.md
author: 'Pawel Mazur'
date: 2021-09-06
modified: 2025-06-16
tags:
- attack.defense-evasion
- attack.t1564.001
logsource:
  product: linux
  service: auditd
detection:
  selection_commands:
    type: 'EXECVE'
    a0:
    - 'mkdir'
    - 'nano'
    - 'touch'
    - 'vi'
    - 'vim'
  selection_arguments:
  - a1|re: '(^|\/)\.[^.\/]'
  - a2|re: '(^|\/)\.[^.\/]'
  condition: all of selection_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects the creation of hidden files or directories on a Linux system by identifying file or directory names that begin with a dot (e.g., `.hiddenfile`). An attacker might use this technique to hide malicious files from users or security monitoring tools, aiming to maintain persistence or evade detection. The relevant MITRE ATT&CK tactic is Defense Evasion (T1564.001).

  The primary telemetry source is the Linux audit daemon (auditd), which logs activities related to system calls. The security impact of malicious activity, such as hidden malware, can be significant, as it facilitates ongoing exploitation while remaining undetected. However, this detection does NOT confirm the intent behind the file or directory creation, as legitimate applications may also create hidden files for valid purposes.

  ### Investigation Steps

  - **Check audit logs for hidden files:** Review auditd logs (e.g., at `/var/log/audit/audit.log`) for EXECVE events with `Event ID  execve` that include commands like `mkdir`, `nano`, or `touch` with matching arguments (a1 or a2) indicating a leading dot in the file or directory name.

  - **Identify the command context:** Assess the command context of the detected EXECVE. Review fields such as the `pid`, `user`, and `exe` to determine if the command was executed by a suspicious user or process (e.g., indicative of a high-privilege process creating hidden files unexpectedly).

  - **Review process lifecycle:** Cross-reference the logged process IDs with process monitoring tools (e.g., ps, top) to determine if the parent process exhibits malicious behavior or is tied to known legitimate applications that may create hidden files under normal circumstances (e.g., `.git` directories).

  - **Audit changes in the file system:** Validate any new hidden files/directories with filesystem monitoring (e.g., `ls -la` on the affected paths). Legitimate administrative activities, such as creating `.ssh` directories for user configuration, should be accounted for and distinguished from potential threats.

  - **Dismiss benign scenarios:** Document known legitimate scenarios, such as developers creating configuration files or hidden directories for version control systems. Ensure any team members create a baseline for expected hidden file creation in their workflows.

  ### Prioritization

  This alert has low severity due to the potential for both benign and malicious activity. While the impact can be significant if used for malicious purposes (e.g., evading detection), the likelihood of abuse is moderate since hidden files can also arise from routine system configuration or development processes.

  ### Blind Spots and Assumptions

  This rule may miss hidden file creations that do not invoke the specified commands, like using an alternative file manipulation method (e.g., Python scripts). Additionally, comprehensive logging via auditd is required for reliable detection. Legitimate user interactions with applications like editors or version control can trigger this alert, potentially leading to false positives. Cross-reference with similar detections, such as file permissions changes via Sysmon (Event ID 10), which may provide context on potentially hidden files or directories being altered.

