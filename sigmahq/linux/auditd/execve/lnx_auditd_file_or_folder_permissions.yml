note: |
  ### Technical Context
  This rule is designed to detect unauthorized changes to file and folder permissions on Linux systems, specifically through the use of commands such as `chmod` and `chown`. Such modifications can indicate an attacker’s objective to gain persistence, escalate privileges, or hide their activity by altering access rights to sensitive files and directories. By manipulating permissions, attackers may create opportunities for unauthorized data access or disruption of legitimate user activity.

  The relevant MITRE ATT&CK tactics involved include **Defense Evasion** (Tactic ID: TA0005) and **Permission Groups Discovery** (Tactic ID: T1222.002). Attackers often seek to evade detection and maintain control over compromised systems by altering file permissions to prevent legitimate users or security mechanisms from accessing malicious content.

  To gather evidence for this detection, the primary data source is **audit logs** generated by the `auditd` service. These logs record system calls and provide insights into file permission changes, making them crucial for identifying potentially malicious activities. A review of process execution events that include the use of file manipulation commands should also be conducted for comprehensive analysis.

  ### Investigation Steps
  - **Review Audit Logs**: Check auditd logs for any instances of the `chmod` or `chown` commands being executed, along with the corresponding user and timestamps to establish context around the time of the changes.
  - **Analyze User Behavior**: Determine if the user executing the commands is authorized to perform permission changes and if the actions align with their role or activities.
  - **Correlate with Other Events**: Look for any unusual pattern or sequence of events leading to the permission change, such as prior suspicious login attempts, process creations, or network activity.
  - **Verify Impacted Files**: Create a list of changed files and folders to ascertain their significance to the organization and perform investigations on access logs for those resources.

  ### Prioritization
  This alert carries a low severity level due to the potential for false positives. Users might legitimately change file permissions as part of their routine tasks. However, given that attackers often exploit permission changes for nefarious purposes, such alerts should still be investigated thoroughly to mitigate risks.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on audit logs, which must be appropriately configured and retained for effective monitoring. Additionally, the detection logic assumes that the execution of `chmod` and `chown` commands without context would always be suspicious, which may lead to false alerts if regular users are performing these actions. Required configurations include ensuring that the `auditd` service is running and that it is logging the appropriate syscall events for monitoring file permission changes.

