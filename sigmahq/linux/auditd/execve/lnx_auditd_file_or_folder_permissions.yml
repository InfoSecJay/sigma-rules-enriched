note: |
  ### Technical Context

  This Sigma rule detects changes to file or folder permissions on Linux systems, specifically through the use of `chmod` and `chown` commands, which can indicate an attempt by an attacker to manipulate access controls. The likely attacker objective is to weaken security by granting unauthorized access to sensitive files or directories, facilitating data exfiltration or system persistence. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" and technique "Modify File Permission" (T1222.002).

  The primary telemetry source for this detection is the Linux audit daemon (auditd), capturing event data about system calls, particularly EXECVE events related to permission changes. If malicious, this behavior can lead to significant security risks, such as unauthorized access to sensitive data or system configurations. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may also trigger this alert.

  ### Investigation Steps

  - **Identify the command executed:** Review audit logs for Event Type: EXECVE, focusing on commands using `chmod` or `chown` (e.g., auditd logs). Look for `a0` field values that contain `chmod` or `chown`. Determine if the command was executed by an authorized user or service.

  - **Check the target file or folder:** Cross-reference the target file or directory specified in the command with known sensitive directories or files (e.g., `/etc/passwd`, `/var/www/html`). Investigate if the modified object shows unexpected access changes.

  - **Review user context:** Analyze the effective user ID (euid) and the user that executed the command. If the euid indicates a system user or unexpected account (e.g., a service account during off-hours), mark it as suspicious.

  - **Analyze permissions set before and after the change:** Use file system monitoring tools or logs to inspect permissions of modified files or directories before and after the change. Legitimate permission modifications typically involve administrative users adjusting permissions during maintenance windows.

  - **Investigate prior activity:** Review user activity logs for related suspicious commands or elevated privilege actions (using audit logs or syslog). Identify patterns indicating potential compromise, such as repeated permission changes or access by a user with a history of irregular behavior.

  - **Validate unusual activity:** Search for unusual patterns such as frequent or bulk permission changes (within the same time frame) across different system areas. High-confidence malicious indicators may include multiple changes affecting sensitive directories by unexpected users or automated scripts.

  ### Prioritization

  The alert should be considered medium severity, as unauthorized permission changes can lead to potential exploitation of sensitive assets. The likelihood of malicious abuse is moderate given the frequency of these commands in administrative tasks, yet such behavior is commonly weaponized to facilitate further attacks or data breaches.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative actions taken under routine maintenance, which could trigger the same alert. Reliability of detection relies on proper configuration of auditd to capture EXECVE events accurately. False positives may occur from regular permission changes by system administrators during updates or restructuring. Companion detections include monitoring for unusual user activity or unauthorized access attempts immediately following permission changes to bolster threat context.

