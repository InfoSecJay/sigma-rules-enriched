note: |
  ### Technical Context

  This Sigma rule detects unauthorized file or folder permission changes on Linux systems. Such alterations may indicate an attacker attempting to escalate privileges or obscure their access within the system. The likely attacker objective is to gain control over sensitive files, prevent detection of malicious activities, or establish persistence. This behavior aligns with the MITRE ATT&CK technique T1222.002 (File and Folder Permissions Modification). The primary telemetry source is auditd logs that capture system calls, particularly monitoring the EXECVE type for commands such as `chmod` and `chown`. If malicious, these actions could compromise the integrity and confidentiality of important data. Importantly, this detection does NOT confirm malicious intent on its own; legitimate user actions may trigger the same alerts.

  ### Investigation Steps

  - **Verify recent permission changes**: Check audit logs for Event IDs related to `chmod` and `chown`. Look for timestamped entries in `/var/log/audit/audit.log` and the relevant fields (e.g., `exe`, `a0`, `uid`, `gid`) associated with the user making the change.

  - **Identify the user and their intent**: Investigate the user account involved in the permission change. Check for unusual activity or patterns in Bash history (e.g., `/home/user/.bash_history`) that may suggest malicious behavior.

  - **Determine if the file is sensitive**: Cross-reference the affected files against a list of critical directories or sensitive files. Look for changes in files within `/etc/`, home directories, or other sensitive locations that may indicate an evasion tactic.

  - **Assess the frequency of changes**: Look for multiple permission changes in a short time frame. Frequent use of `chmod` or `chown` commands can indicate suspicious activity, especially if used in common folders like `/tmp` or `/var/log`.

  - **Review legitimate activity context**: Consider the normal operational procedures in your environment. If the user account typically changes permissions as part of their role (e.g., system administrators), corroborate this with scheduled maintenance or documented processes.

  ### Prioritization

  The severity of this alert is low given the commonality of legitimate permission changes by users, especially administrators. However, the sensitivity of the affected system and the potential for malicious abuse necessitate timely review. This behavior can be weaponized by adversaries to obscure actions or maintain access, requiring attention but with caution used to weed out false positives.

  ### Blind Spots and Assumptions

  This detection may miss subtle privileges escalation attempts if they occur via less monitored methods or scripts that obfuscate command usage. Reliable detection requires auditd configuration to ensure comprehensive logging is enabled. Legitimate activities, such as routine maintenance by system admins, may frequently trigger this alert. A related detection to enhance coverage is monitoring unexpected file execution events (e.g., using Sysmon for file creation and changes in executable states).

