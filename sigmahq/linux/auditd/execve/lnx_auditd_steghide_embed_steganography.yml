note: |
  ### Technical Context

  This Sigma rule detects the execution of the `steghide` binary with commands to embed files, indicative of steganographic file concealment. Attackers use this technique to hide malicious payloads or exfiltrated data within legitimate files, minimizing detection during security audits or forensic investigations. The relevant MITRE ATT&CK technique is T1027.003 (Obfuscated Files or Information) under the tactic of Defense Evasion.

  The primary telemetry source for this detection is Linux's audit daemon (auditd), specifically monitoring EXECVE system calls. If malicious, the security impact includes undetected data exfiltration or stealthy malware deployment. However, this detection does NOT confirm that a compromise has occurred; it simply flags potential misuse of a legitimate tool.

  ### Investigation Steps

  - **Check command execution:** Review auditd logs for EXECVE events related to `steghide`, capturing Event ID and relevant fields (e.g., `exe`, `a0`, `a1`, `a2`). Legitimate use may include commands from trusted users for non-malicious purposes.

  - **Analyze the parent process:** Inspect logs to identify the parent process of the `steghide` execution (e.g., PID linking). A suspicious parent process like a script or tool known for exploitation should raise concerns.

  - **Examine process arguments:** Validate the parameters used with `steghide` (e.g., `-cf`, `-ef`) in logs. Abnormal combinations or settings may indicate malicious intent (e.g., embedding with unusual file formats).

  - **Correlate with file system changes:** Check `/var/log/audit/audit.log` for associated file activity post-steghide execution. Look for newly created files or modified existing files that could be indicators of data embedding.

  - **Identify user context:** Review the user context under which `steghide` was executed. Normal usage may stem from specific system users (e.g., a backup service), while anomalous or elevated user accounts may indicate abuse.

  ### Prioritization

  This alert should be treated as medium priority. While the direct impact may vary based on the host's role, the likelihood of steganography being weaponized for data exfiltration or hiding malware is increasing. The potential for legitimate misuse exists, but it warrants investigation due to its capability to aid in malicious activities.

  ### Blind Spots and Assumptions

  The detection may miss obfuscated or altered command-line patterns that achieve the same goal. Ensure auditd is properly configured to capture EXECVE events comprehensively. Legitimate activities might include the use of steganography for competitive intelligence or research. A companion detection focus could include monitoring for unauthorized file transfers or unusual network traffic to bolster visibility on potential data exfiltration.

