note: |
  ### Technical Context
  This detection rule identifies the execution of the `steghide` binary with specific arguments that indicate an attempt to hide files within other files, typically images. This technique is often used by adversaries to obfuscate the exfiltration of sensitive data or to conceal malware hidden within seemingly innocuous files. The typical attacker objectives include evading detection, maintaining persistence, and facilitating data loss or exfiltration.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1562) and specifically **Steganography** (T1027.003). By embedding files into other files, attackers aim to bypass traditional security measures and remain undetected while transferring sensitive information or malicious payloads.

  Primary data sources for detecting this behavior include **Linux audit logs**, specifically `auditd`, which can capture process execution events and their associated parameters. These logs will provide visibility into the command executions related to `steghide`, enabling security teams to respond to potential threats.

  ### Investigation Steps
  - **Review Audit Logs**: Examine the `auditd` logs for any instances of the `steghide` execution. Focus on the timestamps and user accounts associated with these activities.
  - **Analyze File and Network Activity**: Investigate any files that have been modified around the same time as the detected `steghide` activity. Check for unusual outbound network connections that may indicate data exfiltration.
  - **Identify Unusual User Behavior**: Determine whether the user executing `steghide` has a history of normal behavior or if this activity appears anomalous. Consider cross-referencing with user privilege levels and access to sensitive information.
  - **Correlate with External Threat Intelligence**: Check for known indicators of compromise (IOCs) or behavioral patterns tied to the use of steganography tools in your environment to assess the potential risk associated with the detection.

  ### Prioritization
  This alert is considered low to moderate severity due to the evasive nature of techniques like steganography, which can indicate advanced threats or data exfiltration. However, the specific use of `steghide` may require context to determine its intent, necessitating further investigation to assess the impact accurately.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the lack of comprehensive logging for all process executions on systems or instances where `auditd` is not fully configured. The rule assumes that `steghide` will not be used legitimately, which may not account for all potential benign uses of the tool. Required log configurations include appropriate audit settings on Linux systems to capture execution data, as well as potential logging of file system changes to assess modifications post-execution.

