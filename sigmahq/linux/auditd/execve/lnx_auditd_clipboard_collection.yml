title: Clipboard Collection with Xclip Tool - Auditd
id: 214e7e6c-f21b-47ff-bb6f-551b2d143fcf
status: test
description: |
  Detects attempts to collect data stored in the clipboard from users with the usage of xclip tool.
  Xclip has to be installed.
  Highly recommended using rule on servers, due to high usage of clipboard utilities on user workstations.
references:
- https://linux.die.net/man/1/xclip
- https://www.cyberciti.biz/faq/xclip-linux-insert-files-command-output-intoclipboard/
author: 'Pawel Mazur'
date: 2021-09-24
modified: 2022-11-26
tags:
- attack.collection
- attack.t1115
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: xclip
    a1:
    - '-selection'
    - '-sel'
    a2:
    - clipboard
    - clip
    a3: '-o'
  condition: selection
falsepositives:
- Legitimate usage of xclip tools
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `xclip` tool with arguments indicative of clipboard access, specifically targeting the system's clipboard contents. Attackers may leverage `xclip` to extract sensitive information from a user's clipboard, which could include passwords, tokens, or other sensitive data if compromised access occurs on a system. The relevant MITRE ATT&CK technique is `Data from Local System T1115`, which falls under the tactic of `Collection`.

  Primary telemetry sources for this detection come from Linux audit logs, specifically `auditd`, capturing executions of commands via system calls. If malicious, the impact can be severe, allowing unauthorized access to sensitive data without direct interaction. It is essential to note that this detection does NOT confirm any malicious intent by itself; legitimate uses of `xclip` for clipboard management exist.

  ### Investigation Steps

  - **Check audit logs for xclip execution:** Review auditd logs for Event ID  execve (type: EXECVE) that includes `xclip` as the executed command (a0) and verify the arguments used (i.e., '-selection', '-o'). Look for unusual patterns or usernames executing this command.

  - **Identify user context and asset criticality:** Correlate the user executing `xclip` with their role within the organization. Analyze if this user typically operates on sensitive systems or services where clipboard data could contain critical information.

  - **Assess clipboard content:** If accessible, monitor the content pulled from the clipboard (by reviewing prior commands) in connection with the execution of `xclip`. Malicious indicators include the retrieval of passwords or PII data, whereas benign usage usually involves file paths or non-sensitive data.

  - **Review legitimate usage patterns:** Document and compare baseline usage of `xclip` among users on systems where it is expected. If the execution aligns with typical usage patterns, it may not warrant further concern.

  - **Monitor for related command chains:** Investigate for the presence of other tools or scripts invoked around the same time as `xclip`, which may indicate data exfiltration attempts, particularly if seen in conjunction with network communications or file transfers.

  ### Prioritization

  The alert severity is low; while malicious use of `xclip` for clipboard collection can lead to sensitive data exposure, the likelihood of abuse highly depends on the user context and system criticality. This behavior is not widely weaponized, as it often stems from benign user actions in most enterprise environments.

  ### Blind Spots and Assumptions

  This detection may face limitations due to legitimate uses of `xclip`, particularly among developers or support personnel. Reliable detection requires proper configuration of Linux auditd logs to capture all necessary events, which might not be universally deployed. Legitimate clipboard management for workflow efficiency might trigger this alert often. A companion detection to strengthen this coverage would be monitoring for clipboard data access through other methods, enhancing detection capability across multiple access vectors.

