title: Clipboard Collection with Xclip Tool - Auditd
id: 214e7e6c-f21b-47ff-bb6f-551b2d143fcf
status: test
description: |
  Detects attempts to collect data stored in the clipboard from users with the usage of xclip tool.
  Xclip has to be installed.
  Highly recommended using rule on servers, due to high usage of clipboard utilities on user workstations.
references:
- https://linux.die.net/man/1/xclip
- https://www.cyberciti.biz/faq/xclip-linux-insert-files-command-output-intoclipboard/
author: 'Pawel Mazur'
date: 2021-09-24
modified: 2022-11-26
tags:
- attack.collection
- attack.t1115
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: xclip
    a1:
    - '-selection'
    - '-sel'
    a2:
    - clipboard
    - clip
    a3: '-o'
  condition: selection
falsepositives:
- Legitimate usage of xclip tools
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the `xclip` tool, which is commonly employed in Linux environments to manage data copied to the clipboard. Specifically, it aims to capture instances where an attacker may attempt to collect sensitive information from the clipboard without user consent, potentially compromising user data or credentials stored therein. Attackers often leverage clipboard utilities to harvest sensitive information, a technique reflected in MITRE ATT&CK technique T1115 – Clipboard Data.

  The main objective of an attacker utilizing `xclip` for clipboard collection would be to exfiltrate data such as passwords, account information, or other confidential data that may be temporarily stored in a user's clipboard. The detection is particularly relevant for server environments, where clipboard management tools might be exploited to gather data from user sessions or applications without direct interaction, leading to unauthorized data breaches.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactic:** Collection
  - **Technique:** T1115 - Clipboard Data

  The primary data sources for this detection rule are audit logs generated by the `auditd` service on Linux systems, specifically focusing on process execution (EXECVE) events.

  ### Investigation Steps
  - **Review Audit Logs:** Analyze the auditd logs for entries related to `xclip` execution, specifically looking for the arguments passed (e.g., `-selection`, `-o`, `clipboard`).
  - **Inspect User Activity:** Investigate the user activities leading up to the use of `xclip`, identifying if there were any suspicious or unauthorized actions taken that could indicate compromised credentials.
  - **Correlate with User Workstation Activity:** If detected on servers, validate whether the same activity is observed on user workstations to determine if the threat is localized or part of a broader attack.
  - **Cross-Reference with Other Logs:** Integrate findings with logs from other sources such as EDR or network monitoring to identify any suspicious patterns or lateral movement attempts associated with the usage of `xclip`.

  ### Prioritization
  The alert is categorized as low severity; however, in a sensitive enterprise environment, any unauthorized clipboard access could indicate potential data exfiltration, leading to a moderate impact if exploited. It is crucial to evaluate the context around this usage to determine whether further investigation is warranted.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for other methods of clipboard data exfiltration not utilizing `xclip`, such as alternative scripting tools or direct system access. The rule assumes that the `auditd` service is properly configured to capture all EXECVE events, which may not always be the case. Additionally, legitimate use of `xclip` by authorized users may lead to false positives, necessitating further context to consider the alert actionable. Audit logs need to be consistently reviewed and maintained for effective detection and accurate incident responses.

