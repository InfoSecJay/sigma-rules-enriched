note: |
  ### Technical Context

  This rule detects the use of the `chattr` command to remove the immutable attribute from files on Linux systems. The likely attacker objective is to manipulate or delete critical files that have been protected from modification, allowing for malicious activities such as backdoor implantations or data tampering. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion and specifically the technique T1222.002 (File and Directory Permissions Modification).

  Primary telemetry sources for this detection are Auditd logs, which record information related to system calls—specifically EXECVE events when the `chattr` command is invoked with the `-i` option. If malicious, this action signifies an attempt to compromise system integrity by altering file protection mechanisms. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also trigger the same event.

  ### Investigation Steps

  - **Identify the Command Execution:** Review Auditd logs for EXECVE events related to the `chattr -i` command. Look for Event ID 1300 in `/var/log/audit/audit.log`, focusing on fields such as `exe`, `a0`, and `a1` to confirm the command and its parameters.

  - **Determine the User Context:** Analyze the user (`uid`) in the Auditd logs that invoked the command. A non-administrative user executing this command on sensitive files could indicate malicious intent, whereas an administrator performing maintenance tasks is more likely benign.

  - **Review File Changes:** Check for subsequent modifications to files that had their immutable attributes removed. Use `lsattr` to verify file attributes post-command execution and compare timestamps of file changes with the event log for correlation.

  - **Assess System Role Implications:** Consider the role of the affected Linux system. If it's a high-value or sensitive asset (e.g., a web server or database), the risks of this command executing increase significantly, warranting further immediate investigation.

  - **Correlate with Other Alerts:** Look for related activities such as unusual login attempts or unauthorized access to directories containing sensitive files. This may suggest a broader compromise attempt.

  - **Legitimate Usage Patterns:** Document any prior legitimate use of the `chattr` command from the same user or system in the recent logs. Recognizing known scenarios (like restoring data or recovery actions) can refine your understanding of the context around the alert.

  ### Prioritization

  This alert is medium severity due to the potential impact on file integrity, especially on critical systems. The likelihood of malicious abuse is moderate; while removing immutable flags is a common administrative task, attackers often employ it to evade security measures. This behavior is indicative of a common exploitation technique.

  ### Blind Spots and Assumptions

  Detection may be limited if Auditd is not consistently configured or if relevant log retention policies are weak. Legitimate administrative tasks may trigger this alert, such as system backups or maintenance, which could lead to false positives. A related detection to consider is monitoring for the execution of other command-line tools or scripts that manipulate file permissions, enhancing overall coverage and context.

