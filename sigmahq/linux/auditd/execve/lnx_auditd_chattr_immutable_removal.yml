note: |
  ### Technical Context

  This rule detects the removal of the immutable file attribute on Linux systems using the `chattr` command. An attacker might aim to alter or delete files that are meant to be protected, thereby facilitating unauthorized access or modification of critical files. The relevant MITRE ATT&CK tactic is Defense Evasion (T1070), and the specific technique is T1222.002 (Remove Immutable File Attribute).

  The primary telemetry source is Linux Audit Daemon (`auditd`) logs with a focus on EXECVE events. If this behavior is malicious, it could lead to significant security impacts, such as unauthorized alterations of sensitive files or system configurations. Importantly, this detection does NOT confirm malicious intent solely; it requires context and further investigation to understand the reasons behind the attribute removal.

  ### Investigation Steps

  - **Check audit logs for context:**
    Review `auditd` logs (e.g., `/var/log/audit/audit.log`) for Event ID 132 (EXECVE) containing `chattr` and `-i`. Note the timestamp, user ID, and command output to assess the legitimacy of the action.

  - **Identify the user and their intentions:**
    Determine the user who executed the command. If it's a standard user or service account with limited permissions, investigate the account for potential compromise.

  - **Correlate with other events:**
    Look for any additional related activity around the same time, such as file modifications or deletions (check additional EXECVE or file access logs) that may indicate a more extensive malicious operation.

  - **Distinguish legitimate use cases:**
    Investigate any documented system administration practices involving the removal of immutable attributes for expected operations (e.g., system upgrades or standard maintenance) to establish benign context.

  - **Validate high-confidence malicious indicators:**
    An execution of `chattr -i <filename>` on critical files such as `/etc/passwd` or system binaries without valid administrative context can indicate potential compromise.

  - **Check for persistent malicious changes:**
    Review other files on the system for modifications or suspicious access patterns after the command execution, including unexpected changes to sensitive configuration files.

  ### Prioritization

  The alert is of medium severity. The impact could be significant if critical files are altered or deleted, leading to broader system vulnerabilities. The likelihood of malicious exploitation is moderate since attackers frequently disable file protections to facilitate deeper system compromise.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate `chattr` usage by administrators who may inadvertently trigger the alert. Reliable detection requires configured `auditd` properly logging EXECVE events. Additionally, other legitimate activities could involve modification of file attributes for system maintenance. A companion detection might be monitoring for direct file access or alterations (e.g., checking for inode changes or file hashes) to strengthen coverage on potential unauthorized changes.

