title: Data Exfiltration with Wget
id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
status: test
description: |
  Detects attempts to post the file with the usage of wget utility.
  The adversary can bypass the permission restriction with the misconfigured sudo permission for wget utility which could allow them to read files like /etc/shadow.
references:
- https://linux.die.net/man/1/wget
- https://gtfobins.github.io/gtfobins/wget/
author: 'Pawel Mazur'
date: 2021-11-18
modified: 2022-12-25
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: wget
    a1|startswith: '--post-file='
  condition: selection
falsepositives:
- Legitimate usage of wget utility to post a file
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `wget` utility with parameters indicating an attempt to post files, specifically through the use of the `--post-file=` option. An attacker leveraging misconfigured sudo permissions may exploit this to exfiltrate sensitive files such as `/etc/shadow`. This behavior corresponds to the MITRE ATT&CK technique "Exfiltration over Command and Control Channel" (T1048.003).

  The primary telemetry source is the audit logs generated by Linux's `auditd`, which captures the `EXECVE` syscall for process execution. If this activity is malicious, it can lead to unauthorized access to sensitive data, contributing to data leaks or credential theft. However, this detection does NOT confirm that an attacker is actively exfiltrating data; it only indicates that the `wget` utility was invoked with suspicious parameters.

  ### Investigation Steps

  - **Check executed commands: ** Review audit logs for `EXECVE` events (Event ID 2260) related to the `wget` command. Look specifically for the `--post-file=` parameter in the command line, as it indicates a potential exfiltration attempt.

  - **Identify user context: ** Track the user associated with the `wget` execution (logged in user ID and accounts). Legitimate user activity might involve posting files from recognized administrative users, such as support scripts, to known repositories.

  - **Examine file paths: ** Analyze the file paths submitted with `--post-file=` for sensitivity. Paths leading to `/etc/shadow`, `/var/log/auth.log`, or other sensitive files are high-confidence malicious indicators.

  - **Validate sudo permissions: ** Assess the `sudo` permissions configured for the user that executed `wget`. Any misconfiguration allowing unrestricted access to sensitive files through `wget` should be flagged for remediation.

  - **Cross-reference with network logs: ** Confirm if there are outbound connections to unknown or suspicious IPs or domains originating from the host executing `wget` (relevant logs: syslog, tcpdump). Legitimate use would likely target known endpoints.

  ### Prioritization

  This alert holds medium severity due to the potential exposure of sensitive files, particularly if misconfigured sudo permissions permit access. The likelihood of malicious abuse is moderate, as `wget` is frequently weaponized in exfiltration scenarios. The compromised host's role, especially if it has access to critical data, amplifies the risk.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited by the absence of `auditd` on some systems or misconfigured logging settings. Legitimate administrative use of `wget` for posting files can also trigger the alert. A complementary detection approach could include monitoring for unexpected outbound network connections associated with executed commands to enhance overall coverage.

