title: Data Exfiltration with Wget
id: cb39d16b-b3b6-4a7a-8222-1cf24b686ffc
status: test
description: |
  Detects attempts to post the file with the usage of wget utility.
  The adversary can bypass the permission restriction with the misconfigured sudo permission for wget utility which could allow them to read files like /etc/shadow.
references:
- https://linux.die.net/man/1/wget
- https://gtfobins.github.io/gtfobins/wget/
author: 'Pawel Mazur'
date: 2021-11-18
modified: 2022-12-25
tags:
- attack.exfiltration
- attack.t1048.003
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: wget
    a1|startswith: '--post-file='
  condition: selection
falsepositives:
- Legitimate usage of wget utility to post a file
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential data exfiltration attempts using the `wget` utility, specifically when attackers utilize the `--post-file` parameter to send sensitive files to external servers. In a threat scenario, an adversary with misconfigured `sudo` permissions could exploit the `wget` command to access and transmit critical files, such as `/etc/shadow`, to their controlled environment. This behavior aligns with the tactic of Exfiltration under the MITRE ATT&CK framework, particularly technique T1048.003 (Exfiltration Over Alternative Protocol: HTTP/HTTPS), highlighting how attackers can manipulate legitimate tools for malicious purposes.

  Relevant MITRE ATT&CK tactics include:
  - **Exfiltration** (TA0010)
    - **Exfiltration Over Alternative Protocol** (T1048.003)

  Primary data sources to monitor for this rule include:
  - **Linux audit logs** that record execution and parameter details of commands, particularly those associated with `wget`.

  ### Investigation Steps
  - **Review Audit Logs**: Investigate the Linux audit logs for `EXECVE` events related to the `wget` command, paying special attention to instances where it is invoked with the `--post-file` option.
  - **Correlate Network Activity**: Analyze outbound network connections initiated from the compromised host to identify any unusual destinations or data sizes, which might indicate data being exfiltrated.
  - **Monitor User Permissions**: Check for any misconfigured `sudo` permissions associated with users who can execute `wget`, and review recent privilege escalations that could facilitate unauthorized access.
  - **Inspect File Access Logs**: Forensic examination of file permissions and access history on sensitive files (e.g., `/etc/shadow`) to verify if there have been unauthorized read attempts prior to the `wget` execution.

  ### Prioritization
  The alert is deemed medium severity, owing to the potential impact on sensitive data exposure and the likelihood that adversaries may leverage `wget` for exfiltration if they gain escalated privileges. The ease of exploiting misconfigurations can escalate the risk of unauthorized data transfers.

  ### Blind Spots and Assumptions
  This detection may not cover all instances of data exfiltration, especially if attackers use other methods or tools not captured by this rule, like `curl` or custom scripts, which could similarly send data outside the network. The detection logic assumes that execution logs for `wget` are consistently collected and that proper audit logging is enabled on Linux systems. Therefore, it is necessary to ensure that auditd is correctly configured to capture all relevant events to maintain this visibility.

