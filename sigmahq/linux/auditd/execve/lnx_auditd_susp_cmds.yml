title: Suspicious Commands Linux
id: 1543ae20-cbdf-4ec1-8d12-7664d667a825
status: test
description: Detects relevant commands often related to malware or hacking activity
references:
- Internal Research - mostly derived from exploit code including code in MSF
author: Florian Roth (Nextron Systems)
date: 2017-12-12
modified: 2022-10-05
tags:
- attack.execution
- attack.t1059.004
logsource:
  product: linux
  service: auditd
detection:
  cmd1:
    type: 'EXECVE'
    a0: 'chmod'
    a1: 777
  cmd2:
    type: 'EXECVE'
    a0: 'chmod'
    a1: 'u+s'
  cmd3:
    type: 'EXECVE'
    a0: 'cp'
    a1: '/bin/ksh'
  cmd4:
    type: 'EXECVE'
    a0: 'cp'
    a1: '/bin/sh'
  condition: 1 of cmd*
falsepositives:
- Admin activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious commands executed on Linux systems, focusing on the use of the `chmod` and `cp` commands in ways that could indicate unauthorized privilege escalation or compromised system integrity. The threat scenario may involve an attacker attempting to manipulate file permissions to gain elevated privileges (e.g., setting the SUID bit) or copying system shells to execute arbitrary commands, thereby compromising the host. Such actions are typically associated with malware leveraging Linux systems or attackers trying to pivot within the network post-exploitation.

  Relevant MITRE ATT&CK tactics include:
  - **Execution** (TA0002): The adversary tries to gain control of the system.
  - Techniques such as **Command-Line Interface** (T1059.004) highlight the use of command-line tools for malicious purposes.

  Primary data sources for detection include:
  - Audit logs from `auditd`, which capture system calls such as `EXECVE` that execute the relevant commands indicated in the rule.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze the `auditd` logs for entries capturing the execution of the detected commands, focusing on any context or parameters that could highlight misuse.
  - **Correlate with User Activity**: Investigate whether the commands were executed by legitimate admin users or appear anomalous, considering the time, user permissions, and history of legitimate activity.
  - **Check System Configuration**: Assess file permissions and SUID executions to identify if these changes impact critical system binaries, which could signal an elevated privilege or compromise.
  - **Conduct a Threat Hunt**: Look for similar command patterns across systems, particularly on servers with heightened application access, to identify potential widespread exploitation tactics.

  ### Prioritization
  This alert carries a medium severity due to the potential for significant threat impact should these commands lead to unauthorized privilege escalation, particularly in environments where Linux servers handle sensitive data or services.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if `auditd` is not properly configured to log all relevant command executions, or if systems lack sufficient logging capabilities. The detection logic assumes that all instances of the specified commands are indicative of malicious intent, which may not hold true in cases of legitimate administrative activities. Administrators must ensure comprehensive logging is enabled to capture all executions, and exceptions should be continuously evaluated to refine the detection logic.

