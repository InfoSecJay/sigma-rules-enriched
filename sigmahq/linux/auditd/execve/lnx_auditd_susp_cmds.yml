note: |
  ### Technical Context

  This Sigma rule detects the execution of suspicious Linux commands, specifically those that may indicate privilege escalation or the copying of potentially malicious shells. An attacker may use these commands to change permissions (`chmod`) or create unauthorized shell instances (`cp`) for persistence or further exploitation. Relevant MITRE ATT&CK techniques include **Execution (T1059.004)**, specifically targeting command and scripting interpreters for gaining control over a compromised system.

  The primary telemetry sources for this detection are **auditd logs** that capture command executions (`EXECVE`). If successful, these activities can allow an attacker to gain deeper access to the system or escalate their privileges, potentially leading to significant risks such as data compromise or complete system control. It is essential to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may entail similar commands.

  ### Investigation Steps

  - **Check the command context**: Review `auditd` logs (`syscall: EXECVE`) for the suspicious commands, focusing on the execution time, user, and calling process. Investigate if the commands stem from a legitimate administrative account.

  - **Identify process origin**: For commands like `chmod 777`, utilize the `auditd` logs to identify the parent process (look for fields like `pid` and `ppid`). Determine if it is linked to a known legitimate process or system service.

  - **Assess command arguments**: Validate if `chmod u+s` or copying to `/bin/ksh`/`/bin/sh` is part of any non-standard application deployment or patching. Legitimate activity typically does not modify shell binaries or elevate permissions indiscriminately.

  - **Correlate with user activity**: Check user activity logs (e.g., `/var/log/auth.log`) for the account used. Confirm if the user is authorized to make permission changes or create shells, or if there are multiple suspicious commands executed in a short timeframe.

  - **Search for signs of persistence**: Investigate for any newly created or modified files in system directories, especially in `/bin` or `/usr/bin`, after these commands were executed. Confirm file integrity against expected baselines.

  ### Prioritization

  This alert's severity is medium as it indicates potentially risky behavior on a Linux system, particularly in sensitive environments. While actions like permission changes might align with administrative activities, their occurrence in isolation raises suspicions about malicious intent. Such command usage is frequently associated with exploitation attempts and should be prioritized for thorough review.

  ### Blind Spots and Assumptions

  Common evasion techniques include attackers using root privilege accounts or admins executing commands during normal system maintenance, which could trigger this detection. A critical log source is proper `auditd` configuration to ensure comprehensive logging of all executed commands. Legitimate activities that could trigger this alert include system updates or administrative scripting. Related detections include monitoring for unusual file creations in system directories following command execution, enhancing overall situational awareness.

