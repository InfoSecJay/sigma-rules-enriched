note: |
  ### Technical Context

  This Sigma rule detects the extraction of a zip file from an image file using the `unzip` command on Linux systems. The behavior signifies possible misuse of steganography techniques, where sensitive data is hidden within image files to evade detection. The likely attacker objective is to extract and utilize hidden malware or sensitive information without triggering traditional security mechanisms. This activity aligns with the MITRE ATT&CK technique "Data Obfuscation" (T1027.003).

  Primary telemetry sources for detection include `auditd` logs, specifically focusing on executed command events, with attention to the `execve` calls. If malicious, this behavior can facilitate data exfiltration or the execution of additional payloads. It is important to note that this detection does NOT confirm malicious intent or successful data extraction on its own, as legitimate use cases may also exist.

  ### Investigation Steps

  - **Monitor command execution:** Review `auditd` logs for `EXECVE` events (Event ID 2304) that show the command `unzip` being executed, particularly with image file extensions `.jpg` or `.png` in the argument fields.

  - **Validate command arguments:** Check the command line arguments used with `unzip` in logs—confirm that the targeted file is indeed an image file and assess if it contains legitimate content or unusual patterns.

  - **Check for related extraction activity:** Look for any follow-up `execve` events immediately after the `unzip` command that indicates subsequent actions were taken, such as execution of another script or process.

  - **Identify legitimate usage contexts:** Understand regular operational behavior by identifying normal usage of `unzip` in your environment, especially from trusted automation scripts, to distinguish between suspicious and acceptable cases.

  - **Cross-reference with file integrity:** Examine the integrity and contents of the images involved through file hash comparisons (e.g., SHA-256) to establish if any legit or known safe files were altered or replaced.

  - **Consider user and host context:** Assess the user account executing the command and the criticality of the host. Unusual activity from non-administrative roles on sensitive systems should heighten the severity of findings.

  ### Prioritization

  The alert severity is low, primarily due to the context of the affected system and the nature of the command used. However, given steganography's potential for abuse in data exfiltration and persistence mechanisms, continuous monitoring is warranted due to the likelihood that these tactics can be weaponized.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion via process renaming or alternative extraction methods that do not utilize `unzip`. Reliable detection requires proper configuration and logging of `auditd`, ensuring it captures all EXECVE events. Legitimate activities that may trigger the alert include file processing within authorized workflows. A related detection is monitoring for unusual outbound data transfers (e.g., large or encrypted packets) that may indicate data exfiltration following the extraction.

