title: Steganography Unzip Hidden Information From Picture File
id: edd595d7-7895-4fa7-acb3-85a18a8772ca
status: test
description: Detects extracting of zip file from image file
references:
- https://zerotoroot.me/steganography-hiding-a-zip-in-a-jpeg-file/
author: 'Pawel Mazur'
date: 2021-09-09
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1027.003
logsource:
  product: linux
  service: auditd
detection:
  commands:
    type: EXECVE
    a0: unzip
  a1:
    a1|endswith:
    - '.jpg'
    - '.png'
  condition: commands and a1
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies the process of extracting a ZIP file hidden within an image file, commonly referred to in the context of steganography. Attackers may leverage this technique to conceal malicious payloads or data exfiltration efforts. By manipulating file formats like JPEG or PNG, they can hide ZIP archives that could contain malware or sensitive information, facilitating covert attacks on systems.

  The primary MITRE ATT&CK tactics associated with this rule include **Defense Evasion (TA0005)**, as attackers aim to obfuscate their actions through steganography. The relevant technique in this scenario is **T1027.003: Obfuscated Files or Information**, which highlights the use of hidden files to evade detection and maintain stealth during an operation.

  To gather evidence of this behavior, analysts should focus on data from **Linux audit logs (auditd)**, which provide visibility into the execution of commands and file manipulations. With audit logs, security teams can track the invocation of the `unzip` command and the associated files, aiding in identifying potentially malicious activity.

  ### Investigation Steps
  - **Review audit logs**: Examine the Linux audit logs for execution records of the `unzip` command related to files ending with `.jpg` or `.png`. This will help identify any unauthorized or unusual extraction attempts.

  - **Analyze file integrity and origins**: Investigate the source of image files that were targeted for unzip operations. Look for any anomalies in how these files were acquired or transferred into the environment.

  - **Correlate with other logs**: Cross-reference findings with other log sources, such as file access logs or system event logs, to gather context on the user's activity prior to and following the `unzip` command execution.

  - **Check for known threats**: If suspicious activity is detected, use threat intelligence sources to determine if the identified ZIP files or the obfuscated image files are linked to known malicious campaigns or indicators of compromise.

  ### Prioritization
  This alert is assigned a low severity, primarily because steganography techniques, while sophisticated, may not directly indicate an immediate threat without additional context. However, the existence of such behaviors warrants attention, as they can lead to data breaches or malware deployment.

  ### Blind Spots and Assumptions
  Detection logic is limited in its ability to identify the contents of ZIP files or the intent behind their extraction, potentially missing broader malicious activity. The effectiveness of this alert relies on the active logging configuration of auditd and the proper correlation with file access events. Any absence of logs related to command executions or modifications of image files may result in a failure to capture significant threats. Additionally, the rule may produce false positives if legitimate use cases for extracting ZIP files from images are present in the environment.

