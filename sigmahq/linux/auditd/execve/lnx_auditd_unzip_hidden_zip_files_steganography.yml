note: |
  ### Technical Context

  This Sigma rule detects the execution of the `unzip` command on image files, specifically those with `.jpg` or `.png` extensions. This behavior is associated with steganography techniques where malicious actors hide compressed files (like zip files) within image files and later extract them for data exfiltration or to execute payloads. The relevant MITRE ATT&CK tactic is Defense Evasion, specifically Technique T1027.003 (Steganography).

  Primary telemetry sources include Linux audit logs from `auditd`, focusing on EXECVE syscall events. If confirmed malicious, the extraction of files indicates possible exfiltration of sensitive data or deployment of malware. Importantly, this detection does NOT confirm that malicious activity occurred without further context; benign use of image files may similarly trigger the alert.

  ### Investigation Steps

  - **Review executed commands: ** Check for `EXECVE` events in audit logs (Event ID 226) to verify if `unzip` is being run on image files. Note the complete command line for context.

  - **Identify file creation events: ** Look for indications of newly created files in the `/tmp` or `/var/tmp` directories after running `unzip`, as benign behavior typically involves extracting files to known directories rather than unusual paths.

  - **Analyze file types: ** Examine the extracted files from hidden zip files. Malicious indicators include unusual executable formats (e.g., `.sh`, `.bin`), particularly if they were created immediately after the unzip command was run.

  - **Verify file origin: ** Cross-reference the image files being unzipped with known sources. Legitimate images are often sourced from trusted repositories; anomalous sourcing could indicate malicious intent.

  - **Check user context: ** Determine if the user account executing the command has a history of executing potentially malicious commands. Investigate if the account has elevated privileges that may be misused.

  ### Prioritization

  The severity of this alert is moderate due to the potential impact on data confidentiality and system integrity. The likelihood of malicious abuse is moderate, as steganography is a known technique among adversaries for data exfiltration or malware deployment. This behavior is not commonly weaponized but serves as a precursor to more significant threats if confirmed.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of auditd logging configurations capturing all necessary syscalls. Evasion techniques may include altering the extraction process or using less common file types. Legitimate image processing workflows may trigger this alert, such as data compression tasks performed by graphic designers or developers. A related detection to consider is monitoring for known malicious file types created from zvipped content, to enhance coverage against embedded payloads.

