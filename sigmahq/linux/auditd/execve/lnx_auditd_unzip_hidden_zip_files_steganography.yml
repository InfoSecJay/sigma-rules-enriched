  ---

  ### Technical Context

  This Sigma rule detects the execution of the `unzip` command on image files such as `.jpg` or `.png` that may contain hidden data, particularly an archive like a ZIP file embedded in the image. The likely attacker objective could be to exfiltrate or conceal malicious payloads within images, utilizing steganography as a means of evasion from detection mechanisms. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (T1027.003).

  The primary telemetry sources are Linux audit logs, specifically monitoring for command execution via the `auditd` framework. If malicious, the security impact could include unauthorized data extraction or malware deployment without raising immediate awareness. However, this detection does NOT confirm that the extracted data is inherently malicious; it only indicates that an unzip action on an image file has occurred.

  ---

  ### Investigation Steps

  - **Identify the command execution:** Check audit logs for Event ID execve; look for commands that include `unzip` with fields indicating the executed image file (e.g., `a0 : unzip`, `a1 : *.jpg or *.png`).

  - **Verify the image files' content:** Analyze the suspected image file in question. Use tools to assess whether the file structure indicates the presence of a ZIP file (e.g., inspect with `file` command or `steghide`).

  - **Review historical activity:** Examine the command history for the user account that executed this command. Look for recurring use of `unzip` on image files, which could suggest a pattern of suspicious behavior, especially in unusual user accounts.

  - **Check for legitimate use cases:** Determine if legitimate applications (e.g., image processing tools) are expected to unzip data from image files. Review user documentation or operational procedures that involve the handling of embedded data.

  - **Look for high-confidence malicious indicators:** Check for any subsequent executions of commands that may indicate data exfiltration or malware deployment (e.g., `curl`, `wget`, or network connections to external IPs).

  - **Validate file artifact generation:** Verify if any additional files were created or modified in the same directory as the executed command. Look for new files that are ZIPs or executables, analyzing timestamps and user ownership.

  ---

  ### Prioritization

  This alert has low severity due to the potential for benign use cases associated with data extraction from image files. However, adapting steganographic techniques for hiding malicious payloads can pose an elevated risk, particularly if tied to other confirmed malicious behaviors or high-value targets.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include using legitimate-looking filenames to mask malicious files or executing the command with altered privileges. Reliable detection requires proper audit logging for execve activity. Legitimate activities may include developers unzipping compressed resources for application development. A related detection rule could monitor for unusual network connections from processes spawned by the identified unzip command, enhancing surveillance of potential data exfiltration.

