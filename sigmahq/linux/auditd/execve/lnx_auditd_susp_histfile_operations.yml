note: |
  ### Technical Context

  This detection identifies suspicious operations relating to shell history files in Linux environments, specifically examining command-line interactions involving history files like `.bash_history` and `.zsh_history`. The likely intention of an attacker is to either hide malicious activities by modifying or deleting history entries (to obfuscate command usage) or to leverage historical command data for credential theft and lateral movement. This behavior maps to the MITRE ATT&CK Technique T1552.003 (3rd Party Application Credential Access: History Sniping).

  The primary telemetry sources include audit logs from the auditd service, particularly focusing on system call events related to execve for executing commands that interact with these files. If detected, this behavior could indicate malicious intent as it undermines system integrity and could facilitate other forms of attack. It is crucial to note that while this detection raises an alert, it does not confirm a compromise on its own, as legitimate administrative activities could also trigger similar events.

  ### Investigation Steps

  - **Check command history access:** Review `/var/log/audit/audit.log` (Event ID 14 - EXECVE) for entries involving commands interacting with history files. Look for access to files like `.bash_history` or `.zsh_history` and correlate with user activities to identify any anomalies.

  - **Evaluate user role legitimacy:** Determine the role of the user executing these commands. If the user is a standard employee (non-privileged role), their access or alterations to history files should be treated with higher scrutiny than those from admin accounts.

  - **Look for deleted history files:** Investigate if history files have been deleted or modified around the time of suspicious commands. Examine `/var/log/messages` or `.bash_history` for timestamps and compare against user activities.

  - **Identify high-confidence malicious indicators:** Focus on unusual patterns in command-line arguments or execution of suspicious commands. For example, look for usage of base64 encoding or command chaining (via `&&` or `;`) in command lines that involve history file access.

  - **Review legitimate administrative activities:** Analyze instances where administrators might be cleaning history due to policy enforcement or security practices. Such activities should typically involve legitimate process execution like `history -c` or editing `.bash_history` in a way aligned with organizational policy.

  ### Prioritization

  This alert has medium severity due to the potential risk of credential exposure and system compromise it poses. The impact is significant if the affected system is a critical server or host, especially if the compromised user has elevated privileges. Although not every alteration of history files indicates malicious intent, the behavior is indicative of common techniques employed by attackers to obfuscate their actions and gain persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of auditd, which should be appropriately set up to capture execve syscall events. Evasive actors could employ techniques such as modifying history files in rapid succession or utilizing non-standard shells that are not monitored. Legitimate activities, such as administrators clearing history for compliance, may generate alerts, making context critical in triage. Related detections like monitoring `sudo` command execution (e.g., with Event ID 4112 - sudoreplay) can provide complementary context to user activities and strengthen overall security coverage.

