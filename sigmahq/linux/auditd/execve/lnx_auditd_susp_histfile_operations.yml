title: Suspicious History File Operations - Linux
id: eae8ce9f-bde9-47a6-8e79-f20d18419910
status: test
description: 'Detects commandline operations on shell history files'
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.003/T1552.003.md
author: 'Mikhail Larin, oscd.community'
date: 2020-10-17
modified: 2022-11-28
tags:
- attack.credential-access
- attack.t1552.003
logsource:
  product: linux
  service: auditd
detection:
  execve:
    type: EXECVE
  history:
  - '.bash_history'
  - '.zsh_history'
  - '.zhistory'
  - '.history'
  - '.sh_history'
  - 'fish_history'
  condition: execve and history
falsepositives:
- Legitimate administrative activity
- Legitimate software, cleaning hist file
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious command-line operations on shell history files such as `.bash_history`, `.zsh_history`, and others in a Linux environment. Effective detection of these operations typically indicates an attempt to cover tracks or an unauthorized access event, which may suggest that an attacker is trying to avoid detection after executing malicious commands. Attackers may modify or remove entries from history files to hide their activities, making it crucial to monitor such changes closely.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006), specifically technique **T1552.003** - "Application Layer Protocol." This technique highlights the risks of unauthorized access facilitated by tampering with command history, often employed during post-exploitation phases or in scenarios where an attacker aims to gain or maintain access to the system.

  Primary data sources for this detection include **Linux audit logs (auditd)**, which can provide detailed insights into file access and modification events, particularly those pertaining to history files across various shells.

  ### Investigation Steps
  - **Review Audit Logs:** Examine the Linux audit logs for `execve` system calls that involve accessing or modifying shell history files. Focus on timestamps and user accounts associated with these activities.
  - **Analyze Command History:** Investigate the content of the relevant history files for discrepancies, such as unexpected commands being executed by unauthorized users or user accounts having an unusual execution pattern.
  - **Check User Account Activity:** Identify the user accounts involved in accessing or modifying the history files. Assess their access levels and recent activity for any signs of suspicious behavior or unauthorized access.
  - **Correlate with Other Events:** Look for other anomalous activities around the same timestamps, such as unusual network connections or privilege escalation attempts, to construct a comprehensive view of potential compromise.

  ### Prioritization
  The medium-severity alert highlights the critical nature of command-line history manipulation, which indicates a potential compromise or abnormal use of administrative privileges. Given the risks associated with unauthorized access and the potential to further infiltrate systems, swift investigation is necessary.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage may arise from environments where audit logging is not adequately configured or where relevant logs are not being collected. The detection logic assumes that modifications to history files originate from malicious intent, potentially flagging legitimate administrative activities as false positives. For optimal functionality, environments must ensure that auditd is enabled and properly configured to monitor file access events, especially for shell history files of interest.

