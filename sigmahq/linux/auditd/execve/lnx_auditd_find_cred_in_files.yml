note: |
  ### Technical Context

  This Sigma rule detects the execution of the `grep` command in a Linux environment specifically targeting files or outputs that contain the term "password." The likely attacker's objective is to extract sensitive credentials, such as passwords stored in configuration files, log files, or any files where users may have inadvertently left plaintext credentials. This behavior falls under the MITRE ATT&CK framework, specifically the tactic of Credential Access and technique T1552.001 (Credentials from Password Stores).

  The primary telemetry sources for detecting this behavior are Linux audit logs generated by Audit Daemon (`auditd`). The relevant log types include system call events captured for process executions. If malicious, the security impact is severe, as exposed credentials can enable further exploitation of accounts and services. Notably, this detection does NOT confirm that credential access was successful; it only indicates an attempt to search for potential sensitive information.

  ### Investigation Steps

  - **Review executed commands:** Check `auditd` logs for Event ID 1307 entries that show the command line usage with `grep` and look for fields like `exe` containing `/bin/grep` and `args` field having 'password'. Malicious indicators include unauthorized users executing this command in critical directories.

  - **Identify user context:** Query user session information for the executing user during the time of the detected event using `/var/log/auth.log` or `journalctl`. Legitimate system administrators may execute this command for troubleshooting, but unusual user accounts or non-admin roles performing this could indicate malicious intent.

  - **Examine accessed file paths:** Investigate the file paths included in the command output. Look for sensitive files typically containing credentials, such as `/etc/passwd`, `.git/config`, or application configuration files. The presence of these files in the command execution context increases the likelihood of malicious activity.

  - **Check historical context and behaviors:** Correlate this alert with previous authorization logs to identify if there have been any unsuccessful or successful login attempts by the same user or from the same host. High-confidence malicious indicators include repeated unauthorized access attempts prior to the grep command being executed.

  - **Validate log retention settings:** Ensure that `auditd` is correctly configured to capture EXECVE events to mitigate missed detections. Confirm that configurations for log retention meet the organization’s policy to cover a sufficient time frame for historical analysis.

  ### Prioritization

  This alert is high priority due to the potential for significant impact if credentials are extracted, allowing unauthorized access to sensitive systems. The likelihood of malicious abuse is elevated, given the specificity of the command, which is often weaponized by attackers attempting to harvest credentials from compromised systems.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of `auditd` logging on systems where logging has been misconfigured or disabled. Additionally, legitimate administrative tasks, such as security audits or troubleshooting, may inadvertently trigger this alert. Related detections that improve coverage include monitoring for unauthorized access attempts (e.g., login failures in `/var/log/auth.log`), which may help identify broader malicious behavior patterns.

