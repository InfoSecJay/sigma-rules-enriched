note: |
  ### Technical Context
  This rule detects attempts to extract credentials from files on Linux systems using the command `grep` combined with the keyword `password`. Attackers may use this technique to locate sensitive information, such as user passwords or API keys, stored in configuration files or scripts. The objective of this behavior is typically to facilitate unauthorized access to systems or services, thereby compromising security and potentially leading to further infiltration or data exfiltration.

  The relevant MITRE ATT&CK techniques associated with this detection include **Credential Dumping** (T1552) and specifically **Extraction from Files** (T1552.001). Identifying malicious activity related to credential access is critical in a security context, particularly on Linux environments where sensitive information might be inadvertently stored or poorly managed.

  Primary data sources for detecting this activity include **auditd logs** on Linux systems, which can provide insight into process execution and command-line arguments. Additionally, OS-level logging can play a vital role in identifying misuse of standard tools.

  ### Investigation Steps
  - **Review auditd logs**: Investigate auditd logs for entries containing the `EXECVE` syscall that includes `grep` and `password`, noting the user and timestamp.
  - **Analyze command context**: Examine the commands that were executed before and after the suspicious `grep` command to identify any patterns or related activity that may indicate broader credential harvesting attempts.
  - **Check for unusual file permissions**: Look for files that contain sensitive information and have insecure permissions that could enable unauthorized access by regular users—especially in shared environments.
  - **Monitor user behavior**: Conduct a behavioral analysis of users who executed the detected commands, particularly focusing on whether they have the appropriate privileges or if they display abnormal usage patterns.

  ### Prioritization
  This alert is considered high severity as it indicates potential credential harvesting attempts, which pose significant risks to organizational security. Given the ease of extracting sensitive information using commonly available tools, the likelihood of exploitation is considerable.

  ### Blind Spots and Assumptions
  This detection rule may lack coverage for attempts to obfuscate the command (e.g., using aliases or encoded commands) or for other methods of credential extraction that do not involve `grep`. It assumes that audit logging is appropriately configured and that there are no log retention issues. To make this detection effective, proper logging configuration in `auditd` needs to be ensured to capture `EXECVE` events accurately.

