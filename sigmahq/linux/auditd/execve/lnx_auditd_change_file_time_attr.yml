note: |
  ### Technical Context
  This detection rule identifies unauthorized modifications to file timestamps on Linux systems, which can indicate an attempt by an attacker to hide their activities. By altering the timestamps of files, attackers may aim to cover their tracks, making it harder for defenders to detect malicious file changes, such as the introduction of malware or the modification of critical configuration files. The potential attacker objectives include evasion of detection during data exfiltration or persistence mechanisms.

  The relevant MITRE ATT&CK technique associated with this detection is T1070.006: "Timestomp," which falls under the "Defense Evasion" tactic. This technique specifically addresses the manipulation of file timestamps to obfuscate malicious activity. Primary data sources for this detection include audit logs generated by the `auditd` service, which can capture events related to file attribute changes, including timestamp modifications.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze `auditd` logs to identify events that show a file's timestamp has been changed, specifically looking for entries related to the `touch` command and the specific options `-t`, `-acmr`, `-d`, or `-r`.
  - **Correlate with File Access Events**: Cross-reference file access logs to determine if there is an unusual pattern of access or modification prior to the timestamp changes, which may indicate an attempt to cover malicious behavior.
  - **Identify Affected Files**: List the files whose timestamps were modified to assess if they are critical system files or files associated with sensitive applications, which could point to a higher-impact incident.
  - **Check for Known Artifacts**: Investigate if there are any known attacker tools or scripts part of the environment that commonly modify file timestamps, such as those used for evasion during red team exercises or by adversaries.

  ### Prioritization
  This alert should be treated as medium severity due to the potential risk associated with timestamp manipulation, which may indicate suspicious activity that could lead to data breaches or other compromise scenarios. The likelihood of encountering such behaviors increases, especially in environments targeted by advanced persistent threats (APTs).

  ### Blind Spots and Assumptions
  One gap in detection coverage includes environments where audit logs may not be properly configured to capture all relevant file modification events, potentially leading to missed detections. The detection logic assumes that all relevant file operations will be logged by `auditd` under expected configurations. Additionally, this rule relies on the presence of logs that are not altered or cleared by attackers, necessitating that logs are well-protected against tampering.

