note: |
  ### Technical Context

  This rule detects unauthorized modifications to file timestamps on Linux systems, which may indicate an attempt to conceal malicious activities, such as data exfiltration or unauthorized modifications to critical files. The likely attacker objective is to mislead forensic investigations by altering the timestamps of files to indicate they were created or modified at an earlier time, thus avoiding detection and analysis.

  This behavior aligns with the MITRE ATT&CK technique T1070.006 (Timestomp) under the tactic of Defense Evasion. The primary telemetry source for this detection is the Linux audit logs captured by `auditd`, specifically looking for `execve` syscall events related to the `touch` command with options that manipulate time attributes. If malicious, this activity could hinder incident response efforts significantly. However, this detection does NOT confirm that file tampering has occurred without further context or corroborating evidence.

  ### Investigation Steps

  - **Check audit logs for execve events**: Review Linux audit logs (typically found in `/var/log/audit/audit.log`) for `execve` events related to the `touch` command (Event ID: 132) executed with options `-t`, `-a`, `-c`, `-m`, `-r`, `-d`. Look for any suspicious timestamps or patterns of execution.

  - **Identify unexpected file modifications**: Cross-reference file modifications against a baseline of legitimate changes. Use tools to identify files modified with the `touch` command outside of established change windows. Legitimate operations would occur during standard business hours with proper documentation on changes.

  - **Correlate user activity**: Analyze user login records (e.g., `/var/log/auth.log`) to find the user who executed the `touch` command. Look for unusual activity or logins, especially from privileged accounts. Check for concurrent admin tasks or scheduled jobs that might justify legitimate timestamp changes.

  - **Investigate affected files**: Focus on critical system or application files that were timestamped. Use file integrity monitoring solutions to analyze the context of changes. Look for prior alerts or logs that indicate malicious access prior to timestamp changes.

  - **Verify against related detections**: Use companion detections, such as abnormal access or changes to file permissions (e.g., Event ID: 4 in auditd for `chmod`), to bolster the investigation. This can help indicate whether a pattern of malicious activity is present.

  ### Prioritization

  The alert should be considered of medium severity due to the potential impact on system integrity and the likelihood of malicious use to cover tracks during unauthorized access. Given the stealthy nature of timestamp manipulation, this behavior could be indicative of broader, more serious compromise tactics commonly employed by adversaries.

  ### Blind Spots and Assumptions

  This detection may have limitations, as legitimate administrative tasks could also trigger similar alerts, such as scheduled maintenance or system updates that involve timestamp changes. Reliable detection necessitates comprehensive `auditd` configurations to capture all relevant events and could potentially miss malicious activity if audit logging is improperly configured or disabled. A companion detection could include monitoring for unusual `chmod` operations alongside timestamp changes to provide additional context and strengthen alert veracity.

