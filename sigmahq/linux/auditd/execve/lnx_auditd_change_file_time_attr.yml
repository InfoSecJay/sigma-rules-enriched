note: |
  ### Technical Context

  This rule detects attempts to change file time attributes on Linux systems, specifically using the `touch` command with options that modify access and modification timestamps. The likely attacker objective is to obscure malicious file operations by altering timestamps, thereby evading detection during investigations or analysis. This behavior aligns with the MITRE ATT&CK technique T1070.006: "Timestamps." The primary telemetry source is Linux audit logs, specifically those generated by `auditd`. If malicious, this action can significantly hinder forensic investigations and incident response efforts. This detection, however, does NOT confirm that malicious activity has occurred; it merely indicates a potential attempt to hide changes.

  ### Investigation Steps

  - **Review audit logs for `touch` command usage:** Check `auditd` logs for entries where the `touch` command is executed with options such as `-t`, `-a`, `-c`, `-m`, `-r`, or `-d` (Event ID 1102). Compare against expected use cases where users might legitimately modify timestamps for necessary file operations.

  - **Correlation with file changes:** Cross-reference the detected `touch` command with changes in the file system, such as newly created or modified files. Review timestamps using filesystem commands (e.g., `ls -l`) to identify discrepancies that may signal malicious activity.

  - **Check user context for unusual usage:** Identify the user executing the `touch` command. Ensure that the command aligns with the user's normal behavior and job function. Review user privileges to confirm they are appropriate for executing file timestamp modifications.

  - **Identify potential evidence of obfuscation:** Look for recent files where both access and modification timestamps are changed in a suspicious timeframe. Use commands like `stat` to analyze these timestamps for signs of deliberate tampering.

  - **Investigate the context of critical file changes:** Pay special attention to timestamps on sensitive or system files (e.g., `/etc/passwd`, `/etc/shadow`). Any unexpected timestamp changes on these files may indicate an attempt to cover tracks.

  ### Prioritization

  This alert carries a medium severity level. The impact of affected systems can be high, especially if sensitive data is compromised or if critical files are altered to obscure malicious activity. While timestamp manipulation is not as commonly weaponized as other tactics, it frequently surfaces in sophisticated attacks to evade detection.

  ### Blind Spots and Assumptions

  This detection may be limited by the potential for legitimate administrative actions to invoke timestamp changes, such as system updates or configuration modifications. Missing or improperly configured audit logging can also lead to undetected manipulations. Be aware of benign activities such as backups or software installations that could trigger similar alerts. A related detection to consider is monitoring for excessive use of the `chmod` command, as it may indicate an effort to modify the permissions of files alongside timestamp alterations.

