title: Screen Capture with Xwd
id: e2f17c5d-b02a-442b-9052-6eb89c9fec9c
status: test
description: Detects adversary creating screen capture of a full with xwd. 
  Highly recommended using rule on servers, due high usage of screenshot 
  utilities on user workstations
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1113/T1113.md#atomic-test-3---x-windows-capture
- https://linux.die.net/man/1/xwd
author: 'Pawel Mazur'
date: 2021-09-13
modified: 2022-12-18
tags:
- attack.collection
- attack.t1113
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: xwd
  xwd_root_window:
    a1: '-root'
    a2: '-out'
    a3|endswith: '.xwd'
  xwd_no_root_window:
    a1: '-out'
    a2|endswith: '.xwd'
  condition: selection and 1 of xwd_*
falsepositives:
- Legitimate use of screenshot utility
level: low
note: |
  ### Technical Context

  This Sigma rule detects the execution of the `xwd` command, a utility for capturing screenshots on Linux systems. Attackers may use `xwd` to capture sensitive information displayed on the screen, potentially to steal credentials or other confidential data. This behavior aligns with the MITRE ATT&CK technique T1113 - Screen Capture, which falls under the Collection tactic. The primary telemetry source for this detection is the Linux audit framework (auditd), specifically monitoring events related to command execution.

  If executed within a malicious context, the impact could range from data theft to the compromise of user privacy. It's important to note that this detection does not confirm intent; legitimate users may also use the `xwd` command for benign purposes such as sharing screen captures for troubleshooting.

  ### Investigation Steps

  - **Review command execution logs:** Check auditd logs for Event ID 228 (EXECVE). Focus on records containing `xwd` and associated parameters, particularly those indicating `-root` or `-out` flags.

  - **Identify user context:** Determine if the command was executed by a privileged user (e.g., root or a system account). Legitimate use often involves standard users executing `xwd` with specific output filenames that do not indicate suspicious behavior.

  - **Correlation with desktop environments:** Assess if the execution coincides with remote access tools or graphical sessions. Monitoring for users accessing systems through VNC or SSH with X11 forwarding can provide context.

  - **Examine output file generation:** Search for `.xwd` output files in relevant directories (e.g., /tmp, user home directories). Malicious usage may involve suspicious timestamps or file paths, such as files being created without user interaction or those associated with known threat actors.

  - **Monitor process lineage:** Use tools like `pstree` or `ps` to examine the parent process of the `xwd` invocation. Look for conditions where `xwd` was executed without user intervention or as part of an unusual automation flow, which may signify malicious behavior.

  ### Prioritization

  The severity of this alert is considered low in an enterprise context due to the benign nature of screen capture tools. However, the alert warrants investigation, especially in servers where sensitive information is displayed, as this might suggest an adversary is attempting to collect data. The likelihood of malicious abuse exists, but the overall context of the execution must be evaluated.

  ### Blind Spots and Assumptions

  Evasion techniques include users renaming or obfuscating the `xwd` command, or utilizing alternative screenshot tools that may not generate similar audit logs. Reliable detection requires properly configured auditd logging settings to capture all EXECVE events. Benign triggers can stem from legitimate troubleshooting activities by support personnel. To enhance detection coverage, consider related detections for other screen capture utilities and file access logs.

