logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: xwd
  xwd_root_window:
    a1: '-root'
    a2: '-out'
    a3|endswith: '.xwd'
  xwd_no_root_window:
    a1: '-out'
    a2|endswith: '.xwd'
  condition: selection and 1 of xwd_*
falsepositives:
- Legitimate use of screenshot utility
level: low
note: |
  ---

  ### Technical Context

  This rule detects the execution of the `xwd` command, which is a utility for taking screen captures on Linux systems. The typical attacker objective is to capture sensitive information displayed on the screen, including credentials or proprietary data. This behavior aligns with the MITRE ATT&CK tactic of Collection, specifically technique T1113 (Screen Capture). The primary telemetry source for this detection is the auditd log within Linux environments, specifically monitoring the execution of commands. If malicious, this behavior poses a security risk as it may lead to the exfiltration of sensitive data. However, this detection does NOT confirm malicious intent on its own, as the `xwd` utility can be used legitimately for screen capture purposes.

  ---

  ### Investigation Steps

  - **Check the command execution details:** Review `auditd` logs for Event ID 1300 (execve) with the command `xwd`. Look for instances where arguments contain `-root` or `-out` elements ending with `.xwd`, signifying a screenshot capture.

  - **Identify benign use cases:** Confirm whether the execution of `xwd` is tied to legitimate user activities, such as support or documentation purposes. Review related log entries for business processes where screen captures are commonly used.

  - **Cross-reference user roles:** Investigate the user account executing the `xwd` command. If the command was executed by a high-privilege account (e.g., admin), it merits closer scrutiny compared to a regular user.

  - **Analyze file creation:** After identifying `xwd` executions, check for associated files in the user's home directory or designated directories. Specifically, validate file creations with `ls -l` where filenames end with `.xwd`, looking for excessive or anomalous capture patterns.

  - **Evaluate execution frequency:** Track the frequency of `xwd` executions over time. Multiple instances within a short timeframe, especially from the same user, may indicate malicious intent.

  - **Review user indication in alerts:** If there are alerts related to credential theft or data exfiltration within the same timeframe, correlate them with the xwd execution logs as potential indicators of a coordinated attack.

  ---

  ### Prioritization

  The severity of this alert is considered low in an enterprise context, as screen capture tools like `xwd` can be utilized for benign purposes. However, on critical systems, the likelihood of an attacker leveraging this method for data collection does exist, especially if combined with other malicious behaviors. The frequency of weaponization of such techniques is moderate, depending on the environment.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by configurations in `auditd`, requiring proper logging settings for command execution monitoring to ensure visibility. False positives can arise from legitimate users employing the utility for standard operations, such as support tasks. Additionally, adversaries may employ alternative screen capture tools that are not captured by this rule. Companion detections, such as monitoring for unusual file creations or data exfiltration patterns, can enhance overall visibility and context for potential malicious activities.

