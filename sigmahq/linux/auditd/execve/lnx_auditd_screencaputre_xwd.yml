title: Screen Capture with Xwd
id: e2f17c5d-b02a-442b-9052-6eb89c9fec9c
status: test
description: Detects adversary creating screen capture of a full with xwd. Highly
  recommended using rule on servers, due high usage of screenshot utilities on user
  workstations
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1113/T1113.md#atomic-test-3---x-windows-capture
- https://linux.die.net/man/1/xwd
author: 'Pawel Mazur'
date: 2021-09-13
modified: 2022-12-18
tags:
- attack.collection
- attack.t1113
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: xwd
  xwd_root_window:
    a1: '-root'
    a2: '-out'
    a3|endswith: '.xwd'
  xwd_no_root_window:
    a1: '-out'
    a2|endswith: '.xwd'
  condition: selection and 1 of xwd_*
falsepositives:
- Legitimate use of screenshot utility
level: low
note: |
  ### Technical Context
  This detection rule identifies the usage of the `xwd` command, a utility for capturing screen images on Linux systems. The primary goal of this rule is to flag potential malicious activities where an attacker may leverage the screen capture functionality to obtain sensitive information displayed on a server's screen. This type of behavior can indicate reconnaissance efforts aimed at extracting data or monitoring user activity, particularly in environments where servers handle critical information or operations.

  The detected activities relate to the MITRE ATT&CK technique for "Screen Capture" (T1113), which falls under the Collection tactic. Attackers may use tools like `xwd` to capture sensitive data unknowingly exposed on a screen, posing a risk to organizational confidentiality and potentially compromising sensitive personal or business information.

  Key data sources for this detection include audit logs generated by the `auditd` service on Linux systems, which track executed commands and associated parameters. Analysis of these logs can provide insights into the context of screen capture attempts and help security teams determine whether they stem from legitimate use or malicious intent.

  ### Investigation Steps
  - **Review Audit Logs:** Examine the audit logs for any `EXECVE` entries linked to the `xwd` command, paying particular attention to usage patterns and parameters that suggest potential misuse.
  - **Check Process Parentage:** Investigate the parent process of the `xwd` execution to identify if it was initiated by a legitimate system application or by an unknown/unauthorized process, which could indicate malicious intent.
  - **Correlate with User Activity:** Assess the context in which the screen capture occurred, looking at the user’s activity around the time of the command's execution to determine whether it aligns with known business operations or seems suspicious.
  - **Identify False Positives:** Consider the possibility of legitimate screenshot utility use. Engage with users or teams to verify intent, especially if the execution correlates with known job functions like system troubleshooting or educational demonstrations.

  ### Prioritization
  The alert is classified as low severity due to the possibility of benign use of `xwd` for legitimate purposes, such as system administration. However, monitoring is essential because unauthorized screen captures could expose sensitive data, warranting a careful investigation to assess possible threats.

  ### Blind Spots and Assumptions
  This detection rule relies primarily on the logging of command executions via the `auditd` service. Organizations not utilizing `auditd` or lacking proper configurations may miss critical events. Additionally, the detection assumes that all instances of `xwd` command use without proper context indicate potential malicious behavior, which may not always be the case. Gaps exist in distinguishing between legitimate and malicious activities, requiring further context to ensure accurate threat assessment.

