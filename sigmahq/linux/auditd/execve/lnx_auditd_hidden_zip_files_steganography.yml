title: Steganography Hide Zip Information in Picture File
id: 45810b50-7edc-42ca-813b-bdac02fb946b
status: test
description: Detects appending of zip file to image
references:
- https://zerotoroot.me/steganography-hiding-a-zip-in-a-jpeg-file/
author: 'Pawel Mazur'
date: 2021-09-09
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1027.003
logsource:
  product: linux
  service: auditd
detection:
  commands:
    type: EXECVE
    a0: cat
  a1:
    a1|endswith:
    - '.jpg'
    - '.png'
  a2:
    a2|endswith: '.zip'
  condition: commands and a1 and a2
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This rule detects the act of appending a ZIP file to an image file, a technique often employed to conceal data within seemingly innocuous files, known as steganography. Attackers may use this method to hide malicious payloads or sensitive data, enabling covert exfiltration or evasion of detection mechanisms. The primary objective of such techniques is to bypass security controls that may scan for hidden threats within standard file types.

  In this context, the relevant MITRE ATT&CK techniques include **Defense Evasion** (T1027.003), which relates to obfuscation techniques to avoid detection. The potential threat scenarios involve attackers targeting data confidentiality or integrity by hiding malicious content within common image formats, leading to undetected breaches or malicious activities within the network.

  The primary data sources for this detection rule are **Linux auditing logs** generated by auditd, which can capture significant events, including the execution of suspicious commands and operations related to file manipulations, specifically the appending of different file types.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze Linux auditd logs for the specific command execution that involves 'cat' and observations of files with '.jpg' or '.png' extensions being accessed or modified.
  - **Check File Integrity**: Inspect the integrity and size of image files that were modified to determine if they contain additional, unauthorized ZIP content, which may indicate malicious activity.
  - **Investigate User Activity**: Identify the user accounts that initiated these actions. It’s crucial to validate whether the user has legitimate reasons for executing these commands or if anomalous behavior is present.
  - **Correlate with Other Data Sources**: Cross-reference findings with other telemetry, such as network logs or alerts from endpoint protection solutions, to identify any additional suspicious activities associated with the same user or system.

  ### Prioritization
  The severity of this alert is low, primarily because the detection focuses on a relatively uncommon technique that may not consistently indicate an imminent threat. However, the presence of such behavior requires further investigation as it could signify attempts at data concealment or exploitation within the network.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, particularly if the environment includes other operating systems that do not log similar events or utilize different command patterns to achieve the same objectives. The logic assumes that the use of the 'cat' command in a specific context directly correlates with intent to hide data, which may not always be the case. Additionally, auditd must be correctly configured and enabled on target systems to capture all relevant file access and modification events for this alert to function effectively.

