title: Steganography Hide Zip Information in Picture File
id: 45810b50-7edc-42ca-813b-bdac02fb946b
status: test
description: Detects appending of zip file to image
references:
- https://zerotoroot.me/steganography-hiding-a-zip-in-a-jpeg-file/
author: 'Pawel Mazur'
date: 2021-09-09
modified: 2022-10-09
tags:
- attack.stealth
- attack.t1027.003
logsource:
  product: linux
  service: auditd
detection:
  commands:
    type: EXECVE
    a0: cat
  a1:
    a1|endswith:
    - '.jpg'
    - '.png'
  a2:
    a2|endswith: '.zip'
  condition: commands and a1 and a2
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects the practice of steganography, specifically the appending of a ZIP file to an image file (JPEG or PNG). The likely attacker objective is to conceal data within seemingly benign files to evade detection during data exfiltration or unauthorized copying of sensitive information. This behavior correlates with the MITRE ATT&CK technique "Data Encapsulation" (T1027.003).

  The primary telemetry source for this detection is the Linux audit daemon (auditd), which logs command executions including file manipulation. If malicious, this behavior could indicate an attempt to hide and exfiltrate sensitive data stealthily. It is important to note that this detection does NOT confirm that the ZIP file contains malicious content; it merely signifies that an attempt to conceal data has occurred.

  ### Investigation Steps

  - **Review the command execution history**: Query the auditd logs for Event ID related actions around the time of the alert (e.g., `ausearch -ts recent -c cat`). Focus on commands that involve ".jpg" or ".png" files followed by ZIP extensions.

  - **Identify the parent process**: Use commands like `ps aux` or `pstree` to trace the parent process of the executed command. Malicious indicators may include unexpected or unusual parent process IDs that aren't typically associated with image handling.

  - **Check for the file existence and content**: Verify if the altered image files contain appended ZIP data by using tools like `file` or `binwalk` to analyze the file structure (e.g., `file <filename>.jpg`). Legitimate image files should conform to expected output without indicative ZIP signatures.

  - **Audit usage patterns of the affected files**: Review access logs of the manipulated image files in `/var/log/auth.log` or equivalent to determine if there were any recent suspicious access attempts. Legitimate user routines are typically consistent and would not involve unusual file types.

  - **Correlate with expected behavior**: Compare findings against normal operational benchmarks within the environment. For example, legitimate graphics or media processing applications should not involve appending ZIP files to image formats during regular use.

  ### Prioritization

  This alert is of low severity; however, it should not be overlooked due to the potential for data exfiltration. Given that such behavior can be indicative of the use of steganography, it can be exploited by adversaries to hide payloads or sensitive data. The likelihood of malicious abuse is moderate in environments where sensitive data is handled.

  ### Blind Spots and Assumptions

  Detection may be limited by the effectiveness of the Linux audit daemon; if it is misconfigured or disabled, relevant logs may not be generated. Legitimate activities, such as file backup processes or image format conversions by authorized applications, may also trigger this alert. A companion detection to strengthen coverage would involve monitoring outbound network traffic for unusual file transfers, particularly to untrusted endpoints, which may indicate data exfiltration attempts.

