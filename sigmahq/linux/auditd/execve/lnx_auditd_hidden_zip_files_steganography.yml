title: Steganography Hide Zip Information in Picture File
id: 45810b50-7edc-42ca-813b-bdac02fb946b
status: test
description: Detects appending of zip file to image
references:
- https://zerotoroot.me/steganography-hiding-a-zip-in-a-jpeg-file/
author: 'Pawel Mazur'
date: 2021-09-09
modified: 2022-10-09
tags:
- attack.defense-evasion
- attack.t1027.003
logsource:
  product: linux
  service: auditd
detection:
  commands:
    type: EXECVE
    a0: cat
  a1:
    a1|endswith:
    - '.jpg'
    - '.png'
  a2:
    a2|endswith: '.zip'
  condition: commands and a1 and a2
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This detection rule identifies attempts to hide a ZIP file within an image file format, which is a method of steganography. Attackers may utilize this technique to exfiltrate sensitive data covertly, evade detection, or obfuscate malicious payloads. The relevant MITRE ATT&CK technique is "Data Obfuscation" (T1027.003), under the tactic of "Defense Evasion."

  The primary telemetry source for this detection comes from Linux audit logs, specifically capturing events related to the `execve` syscall. If this behavior is malicious, it could indicate an exfiltration attempt or the introduction of malicious payloads into a system. It is important to note that this detection does NOT confirm that a malicious activity is occurring; further investigation is required to establish intent.

  ### Investigation Steps

  - **Review audit logs for suspicious command usage**: Check for Linux auditd logs (Event ID 226) involving `execve` where the command includes `cat` (e.g., `cat image.jpg zipfile.zip`). Validate the input arguments and consider typical usage versus anomalies.

  - **Correlate contextual user activity**: Examine user behavior around the time of the alert (last login timestamps, typical file usage patterns, etc.). Determine if the user has prior legitimate reasons for altering image files.

  - **Check file details and metadata**: Analyze the image files involved for size anomalies or compressed format signatures. Legitimate images typically will not have significant size increases alongside unexpected file types with similar extensions.

  - **Identify common paths for steganographic activity**: Investigate directory structures where the activity occurred (e.g., `/home/user/images`). Assess if these are regular locations for benign image editing or common areas for data exfiltration.

  - **Establish high-confidence malicious indicators**: Look for known malicious user agents or IP addresses associated with steganography tools in network logs (e.g., captured HTTP requests showing unusual data payloads).

  ### Prioritization

  This alert should be prioritized moderately due to the low immediate impact; however, the likelihood of malicious activities leveraging this technique is notable, especially in contexts where sensitive data or files are commonly processed. While not commonly weaponized, the potential to aid in data exfiltration increases the need for careful assessment.

  ### Blind Spots and Assumptions

  This detection can be evaded by using encrypted or less common file types that may not trigger the alert. It requires robust auditd configuration to capture all necessary events reliably. Legitimate activities, such as graphic design instruction or file format conversion tasks, may unintentionally trigger this alert. Companion detections, such as unusual outbound network traffic to known file-sharing domains, can enhance the overall detection capability for potential exfiltration scenarios.

