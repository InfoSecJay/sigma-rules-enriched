  condition: selection
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to masquerade as the Linux cron daemon (crond) by using the `cp` command to execute a shell with a pathname ending in `crond`. The likely attacker objective is to evade detection mechanisms by mimicking legitimate system processes, potentially to schedule malicious tasks or execute malicious scripts. This behavior fits into the MITRE ATT&CK framework under the tactic "Defense Evasion" and the technique "Masquerading" (T1036.003).

  The primary telemetry source for this detection is Linux audit logs, specifically capturing `execve` syscall activity (Audit Event Type). If malicious, this behavior could lead to unauthorized task scheduling or script execution with elevated privileges, potentially compromising system integrity. This detection does NOT confirm that the process is indeed malicious on its own; further investigation is needed to understand the context and intent behind the activity.

  ### Investigation Steps

  - **Verify the command execution context:** Review `/var/log/audit/audit.log` for entries with `execve` syscall related to `cp`, noting timestamps and originating users. Look for user accounts that may indicate suspicious behavior (e.g., non-admin users executing system-level commands).

  - **Assess the file being accessed:** Check if the target `/bin/sh/crond` exists using `ls -la /bin/sh/crond`. If it does not exist, this is a strong indicator of malicious behavior, as legitimate processes should not reference this path.

  - **Evaluate expected cron behavior:** Review scheduled cron jobs for the user account in question using `crontab -l -u [username]`. Normalize this against known benign jobs to determine whether recent changes have been made that align with the alert.

  - **Identify high-confidence malicious indicators:** Cross-reference the timestamp of the event with creation/modification times of any scripts or binaries in `/tmp` or other temp directories, looking for unexpected file modifications or creations indicative of a malicious payload being introduced.

  - **Check for running processes:** Use `ps aux | grep crond` to verify whether any legitimate `crond` processes are currently running. Legitimate crond processes should have their usual paths and argument structures.

  - **Log source validation:** Ensure that audit logging is enabled and configured properly to capture `execve` calls. Lack of comprehensive audit coverage may lead to missed detections.

  ### Prioritization

  This alert has medium severity due to the potential impact on system functions, particularly if a compromised cron process schedules other malicious activities. The likelihood of malicious abuse is significant since attackers commonly exploit masquerading techniques to bypass defenses. This behavior is recognized as weaponized in threat actor tactics.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to employ variant command executions or obscure arguments, which may evade this specific rule. Reliable detection requires proper audit configurations that capture `execve` syscall data throughout the environment. Legitimate script executions or scheduled tasks may trigger this alert, particularly if they use similar naming conventions. Related detections include monitoring for unauthorized cron job modifications or added entries, enhancing overall coverage against malicious scheduling attempts.

