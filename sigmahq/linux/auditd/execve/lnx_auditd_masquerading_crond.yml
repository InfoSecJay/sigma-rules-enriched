logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'execve'
    a0: 'cp'
    a1: '/bin/sh'
    a2|endswith: '/crond'
  condition: selection
level: medium
note: |
  ### Technical Context

  This rule detects instances of executables being renamed or placed in locations that mimic legitimate system processes, specifically targeting the Linux `crond` service. The likely objective of an attacker employing this technique is to execute malicious commands while evading detection measures that focus on monitoring known execution patterns and locations. This behavior aligns with the MITRE ATT&CK technique for masquerading, identified as T1036.003.

  The primary telemetry source for this detection is the `auditd` logs capturing execution events through the `execve` syscall, specifically monitoring commands like `cp` executed in the context of `/bin/sh` that end in `/crond`. If confirmed malicious, such activity may facilitate unauthorized actions or persistence on the system. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate scripts may also replicate this behavior.

  ### Investigation Steps

  - **Review executed commands**: Check `auditd` logs for Event IDs related to `execve` focusing on log fields for `a0`, `a1`, and `a2` to verify command execution. Benign executions should show expected patterns, such as users invoking `crontab` commands without unusual file paths.

  - **Identify anomalies in paths**: Investigate for any anomalies wherein the executable's path of `crond` deviates from `/usr/sbin/crond` or `/usr/bin/crond`. Malicious attempts often involve paths like `/tmp/crond` or user directories.

  - **Correlate with process attributes**: Review associated Sysmon Event ID 1 (if Sysmon is deployed) for process creation events to analyze parent and child processes of `sh` executing `cp`. Legitimate usage will generally involve known administrative commands or scheduled jobs.

  - **Assess user context and permissions**: Assess the user account invoking the `cp` command to determine if they have legitimate permissions. Uncommon user accounts performing this operation may indicate potential compromise.

  - **Validate integrity of system binaries**: Use checksum verification against known-good versions for `crond` and other critical system binaries. Unauthorized modifications or unexpected file states put the system at higher risk.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on the Linux system, especially if it involves privileged processes like `crond`. While the activity itself is not commonly weaponized, it presents a clear risk for exploitation if left unchecked.

  ### Blind Spots and Assumptions

  Potential evasion techniques include an attacker renaming their malicious executable to blend in more effectively with legitimate processes. The detection relies heavily on the correct configuration of the `auditd` service for effective logging. Legitimate activities that could trigger this alert may include configurations by SysAdmins using scripts that manipulate cron jobs. A related detection rule for checking for process injection or child process matching could enhance overall coverage against this tactic.

