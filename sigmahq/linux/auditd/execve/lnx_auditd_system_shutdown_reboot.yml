note: |
  ### Technical Context

  This Sigma rule detects system shutdown or reboot commands executed on Linux systems. The behavior signifies that an adversary may be attempting to disrupt access to critical services or destroy evidence of their activities. The relevant MITRE ATT&CK tactic is **Impact (TA0040)**, specifically the technique **System Shutdown/Reboot (T1529)**. The primary telemetry source for this detection is the Linux audit daemon (auditd), focusing on logs concerning executable commands related to shutdown (`shutdown`, `reboot`, `halt`, `poweroff`) and system initialization commands (`init`, `telinit`).

  If malicious, such behavior could lead to service denial or the loss of critical data. However, this detection does NOT confirm malicious intent on its own, as it may result from legitimate administrative actions.

  ### Investigation Steps

  - **Investigate command execution:**
    Review auditd logs for `execve` events with matching command attributes (Event ID: Audit event 2304) for keywords `shutdown`, `reboot`, `halt`, or `poweroff`. Ensure that the issuing user has the appropriate administrative privileges.

  - **Check user activity:**
    Use the `last` command or relevant `/var/log/auth.log` entries to identify the user who executed the shutdown command. Legitimate administrative activities will show typical patterns, such as usage during maintenance windows by known administrators.

  - **Verify recent system changes:**
    Examine system logs (`/var/log/syslog` or `/var/log/messages`) for entries before the shutdown command to determine if there were any alerts, warnings, or scheduled maintenance that might explain the behavior.

  - **Validate environment impacts:**
    Assess the role of the affected host (e.g., server, critical application) and determine any potential service impacts due to the shutdown or reboot. If a critical application server is involved, prioritize the investigation.

  - **Correlate timestamps:**
    Compare shutdown timestamps with other security events (e.g., failed authentication attempts) to identify any potentially malicious patterns leading up to the shutdown.

  ### Prioritization

  This alert is categorized as informational but requires careful examination, especially on critical systems. The likelihood of malicious abuse may vary based on user roles and context of the incident. System shutdowns or reboots are commonly weaponized in attack scenarios to erase tracks or disrupt operations.

  ### Blind Spots and Assumptions

  Limitations exist in detecting this behavior as legitimate administrative activities may trigger the same alert. Successful detection relies on correctly configured auditd logging. Be aware that maintenance activities, automated scripts, or scheduled tasks may result in similar command execution. A related detection that strengthens coverage is monitoring for anomalous user account activities leading up to a shutdown event.

