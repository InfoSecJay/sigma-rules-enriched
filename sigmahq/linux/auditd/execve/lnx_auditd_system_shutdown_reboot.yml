title: System Shutdown/Reboot - Linux
id: 4cb57c2f-1f29-41f8-893d-8bed8e1c1d2f
status: test
description: Adversaries may shutdown/reboot systems to interrupt access to, or aid
  in the destruction of, those systems.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1529/T1529.md
author: 'Igor Fits, oscd.community'
date: 2020-10-15
modified: 2022-11-26
tags:
- attack.impact
- attack.t1529
logsource:
  product: linux
  service: auditd
detection:
  execve:
    type: 'EXECVE'
  shutdowncmd:
  - 'shutdown'
  - 'reboot'
  - 'halt'
  - 'poweroff'
  init:
  - 'init'
  - 'telinit'
  initselection:
  - 0
  - 6
  condition: execve and (shutdowncmd or (init and initselection))
falsepositives:
- Legitimate administrative activity
level: informational
note: |
  ### Technical Context
  This detection rule identifies instances where a Linux system is being shut down or rebooted, which could indicate potential malicious activity aimed at disrupting access to critical services or systems. Attackers may execute shutdown or reboot commands to hinder incident response efforts, destroy evidence, or temporarily disable security measures, thus facilitating further exploitation. Recognizing these actions swiftly is crucial for maintaining operational continuity and security posture.

  The rule leverages several relevant MITRE ATT&CK tactics and techniques, particularly **Impact (TA0040)** and **System Shutdown/Reboot (T1529)**. These techniques outline adversarial behaviors aimed at interrupting the operations of systems, further emphasizing the critical nature of detecting such events as part of a broader defensive strategy.

  Primary data sources for this detection rule are audit logs from the Linux `auditd` service. These logs capture attempts to execute commands like `shutdown`, `reboot`, and `halt`, which are vital for monitoring administrative actions and potential malicious activity on Linux systems.

  ### Investigation Steps
  - **Review Audit Logs**: Check `auditd` logs for any occurrences of shutdown or reboot command executions that may have triggered the rule. Look for timestamps and user accounts associated with these actions.
  - **Analyze User Context**: Validate whether the user initiating the shutdown or reboot has appropriate permissions. Investigate recent user activities to determine if any unusual actions preceded the event.
  - **Cross-Reference Context**: Correlate the shutdown or reboot events with other telemetry such as process creation logs and network logs to assess if the actions were part of a broader attack vector.
  - **Evaluate System Impact**: Assess the system impacted by the shutdown/reboot command, looking for any critical services that may have been affected and determining the potential impact on overall business operations.

  ### Prioritization
  The alert's severity is categorized as informational, reflecting the likelihood that shutdown and reboot commands can stem from legitimate administrative activity. However, given the impact these commands can have on system availability, they should be monitored closely in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection logic may not capture instances where malicious actors leverage non-standard methods to disable a system or utilize legitimate administrative privileges to perform shutdown commands unnoticed. It assumes that relevant logging is enabled on the Linux systems being monitored, specifically through `auditd`. Additionally, the presence of false positives may arise due to legitimate maintenance activities, which necessitates context-aware analysis to accurately determine the nature of the shutdown or reboot.

