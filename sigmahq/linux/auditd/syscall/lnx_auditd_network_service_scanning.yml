note: |
  ### Technical Context
  This rule detects the use of common network scanning tools on Linux systems. It focuses specifically on identifying activity related to network service enumeration, which may involve tools such as `nmap`, `telnet`, and `netcat`. Attackers often employ these tools early in the attack lifecycle to map out targets, identify open ports, and gather intelligence about the services running on a network, thereby facilitating subsequent attacks.

  The primary tactics associated with this behavior fall under the MITRE ATT&CK framework, specifically "Discovery" (Tactic ID: TA0007) and the technique "Network Service Discovery" (Technique ID: T1046). Attackers leveraging these techniques may aim to exploit vulnerable services, pivot within the network, or escalate privileges by discovering information about the environment.

  Relevant data sources for detecting this activity include `auditd` logs, which capture system call activities on Linux systems. When configured correctly, these logs will provide detailed records of the execution of commands related to network service enumeration, making them critical for identifying potential malicious behavior.

  ### Investigation Steps
  - **Review auditd logs for syscall activity**: Analyze the `auditd` logs for system calls corresponding to the execution of network scanning tools such as `/telnet`, `/nmap`, and `/netcat`. Look for patterns indicating unusual usage or timing.

  - **Correlate with user activity**: Investigate the user accounts associated with the detected commands. Determine if the accounts have legitimate reasons to execute network scans or if the activity appears anomalous.

  - **Check for recent changes in network topology**: Examine recent changes in the network environment that may correlate with the identified scanning activity. This includes changes in firewall rules, addition of new assets, or updates to network configurations.

  - **Inspect for follow-on activities**: After identifying network service scanning events, search for subsequent actions that may indicate improper access or exploitation attempts, such as new outbound connections or attempts to access services that were previously discovered.

  ### Prioritization
  This alert has a low-severity classification due to the relatively common and sometimes benign nature of network scanning in administrative contexts. However, frequent or unexpected occurrences should be investigated as they may indicate preparatory steps for a larger attack.

  ### Blind Spots and Assumptions
  This detection logic primarily focuses on specific tools and does not account for custom or less common scanning utilities that may be used by attackers. Additionally, it assumes that the `auditd` service is properly configured to capture all relevant syscall activity, which may not be the case if settings are misconfigured or logs are not retained long enough. There may also be legitimate administrative scanning activity that could generate false positives, which should be assessed in the context of normal operational routines.

