logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b32 -S execve -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b64 -S execve -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b32 -S execveat -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b64 -S execveat -F euid=33 -k detect_execve_www
    Change the number "33" to the ID of your WebServer user. Default: www-data:x:33:33
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL:
    - 'execve'
    - 'execveat'
    euid: 33
  condition: selection
falsepositives:
- Admin activity
- Crazy web applications
level: critical
note: |
  ---

  ### Technical Context

  This Sigma rule detects potential remote command execution through web shells or vulnerable web applications by monitoring syscall activity related to the execution of commands executed by the web server user (euid=33). The likely attacker objective is to gain unauthorized access or control over the web server environment, facilitating persistence, data exfiltration, or lateral movement. This activity correlates with the MITRE ATT&CK tactic of Persistence and technique T1505.003 (Web Shell).

  Primary telemetry sources include Linux audit logs generated by auditd, specifically capturing execve and execveat system calls. If malicious, the impact may involve data breaches or system compromise, with potential repercussions extending to the entire network if lateral movement occurs. It is crucial to note that this detection does NOT confirm malicious behavior on its own, as legitimate administrative actions may also trigger these alerts.

  ---

  ### Investigation Steps

  - **Review audit logs for execve calls:** Check audit logs (e.g., `/var/log/audit/audit.log`) for Event IDs related to syscall `execve` or `execveat` with euid=33. Look for unusual commands being executed that do not align with typical web application operations.

  - **Validate the context of command execution:** Identify the command and its arguments to determine if they appear legitimate or problematic. For example, typical web server activities involve starting scripts or binary applications, whereas commands like `curl` or `wget` from a web shell are suspicious indicators.

  - **Correlate with recent web application activity:** Review web application logs to identify recent changes or uploads (e.g., file uploads, configuration changes) that may have introduced a web shell. Look for potential exploitation events linked to the time of the command execution.

  - **Identify benign use cases:** Recognize that legitimate administrative tasks, such as updates or maintenance scripts executed by the web server user, may also trigger this alert, but should be identifiable by their predictable timing and command structure.

  - **Check for known malicious indicators:** Investigate for commonly exploited patterns, such as commands invoking system utilities for download, file manipulation, or accessing network resources. An example includes the presence of commands like `bash -c`, indicative of an attempt to execute a shell command.

  - **Document host and asset criticality:** Ensure an understanding of the criticality of the server involved. Web servers hosting sensitive data or services should be prioritized for immediate investigation compared to those serving non-essential applications.

  ---

  ### Prioritization

  This alert has a critical severity due to the potential impact on sensitive systems. The likelihood of malicious abuse is high, especially in environments known for being targeted for web vulnerabilities. Remote command execution is a commonly weaponized vector in attacks, making rapid detection and response essential.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist as sophisticated attackers may obfuscate their commands or use alternative execution methods that evade standard monitoring. Reliable detection requires correct auditd configuration for syscall logging and awareness of possible benign activity such as administrative scripts that could generate similar events. Companion detections might include monitoring for unusual outbound connections or file transfer operations initiated from suspected compromised web server processes, bolstering the context around potential breaches.

