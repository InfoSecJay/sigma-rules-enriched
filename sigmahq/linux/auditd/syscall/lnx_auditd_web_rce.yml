title: Webshell Remote Command Execution
id: c0d3734d-330f-4a03-aae2-65dacc6a8222
status: test
description: Detects possible command execution by web application/web shell
references:
- Personal Experience of the Author
- https://www.vaadata.com/blog/what-is-command-injection-exploitations-and-security-best-practices/
author: Ilyas Ochkov, Beyu Denis, oscd.community
date: 2019-10-12
modified: 2025-12-05
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b32 -S execve -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b64 -S execve -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b32 -S execveat -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b64 -S execveat -F euid=33 -k detect_execve_www
    Change the number "33" to the ID of your WebServer user. Default: www-data:x:33:33
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL:
    - 'execve'
    - 'execveat'
    euid: 33
  condition: selection
falsepositives:
- Admin activity
- Crazy web applications
level: critical
note: |
  ### Technical Context
  This detection rule is designed to identify potential command execution by a web application or web shell using the `execve` and `execveat` system calls. The threat scenario revolves around attackers gaining unauthorized access to a web server, typically through vulnerabilities such as code injection or misconfigurations, allowing them to execute arbitrary commands. The primary objective of such attacks is often to establish persistence, escalate privileges, or exfiltrate data from the target system.

  The relevant MITRE ATT&CK tactic associated with this rule is **Persistence** (T1499), specifically the technique **Command-Line Interface** (T1505.003), which denotes the execution of commands through a command shell. Effective detection relies on logs captured from Linux audit logs, particularly those generated by the `auditd` service, which monitors system calls related to command execution.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze the audit logs captured by `auditd` for entries related to `execve` and `execveat` system calls indicating potential web shell activity, specifically those executed by the web server user (commonly `www-data`).
  - **Identify Unusual Command Patterns**: Look for any abnormal commands being executed, especially those not typical for web applications, such as reverse shells, file transfers, or administrative commands.
  - **Correlate with Application Logs**: Cross-reference the identified command executions with web application logs to check for any underlying exploitation vectors, such as HTTP requests that may have resulted in command injections.
  - **Check Network Connections**: Investigate network traffic to identify any suspicious outbound connections or data exfiltration that may correlate with the command executions detected.

  ### Prioritization
  The alert is classified as critical due to the high impact and likelihood of exploitation associated with successful web shell deployments. If executed, such commands can lead to extensive data breaches, system compromise, and potential lateral movement within the network.

  ### Blind Spots and Assumptions
  One significant blind spot is the reliance on the correct configuration of `auditd` and the monitoring of specific system calls; if these are not adequately set up, potential web shell activity may go undetected. Additionally, the detection logic assumes that the web server runs under a specific user ID (commonly `www-data`), which may vary across different environments. Hence, it is crucial to tailor the audit rules accordingly. Without proper logging configurations, critical evidence of command execution can be missed, undermining the effectiveness of this detection rule.

