title: Webshell Remote Command Execution
id: c0d3734d-330f-4a03-aae2-65dacc6a8222
status: test
description: Detects possible command execution by web application/web shell
references:
- Personal Experience of the Author
- https://www.vaadata.com/blog/what-is-command-injection-exploitations-and-security-best-practices/
author: Ilyas Ochkov, Beyu Denis, oscd.community
date: 2019-10-12
modified: 2025-12-05
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b32 -S execve -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b64 -S execve -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b32 -S execveat -F euid=33 -k detect_execve_www
    -a always,exit -F arch=b64 -S execveat -F euid=33 -k detect_execve_www
    Change the number "33" to the ID of your WebServer user. Default: www-data:x:33:33
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL:
    - 'execve'
    - 'execveat'
    euid: 33
  condition: selection
falsepositives:
- Admin activity
- Crazy web applications
level: critical
note: |
  ### Technical Context

  This rule detects potential command execution via web shells on a Linux-based web server, focusing on the `execve` and `execveat` system calls initiated by a user with an effective user ID (UID) of 33, commonly associated with the `www-data` user. The objective of an attacker leveraging web shells is often to execute arbitrary commands, escalating privileges, or maintaining persistence within the compromised system. This behavior aligns with the MITRE ATT&CK technique "Web Shell" (T1505.003).

  The primary telemetry sources include `auditd` logs, specifically monitoring for the aforementioned system calls and their corresponding effective user IDs. If left unchecked, this could lead to system compromise, data exfiltration, or further exploitation of network resources. However, this detection does NOT confirm that the command execution is malicious on its own; legitimate web application behavior and administrative actions can also produce similar system calls.

  ### Investigation Steps

  - **Examine audit logs for `execve` events**: Query Linux `auditd` logs for events with `type` set to 'SYSCALL', `SYSCALL` indicating either `execve` or `execveat`, and `euid` of 33. Look for unusual command patterns or frequent executions within short time frames that might suggest misuse.

  - **Verify command legitimacy**: Identify the commands executed by referencing the `argv` field in the audit logs. Compare against expected web application activities. Legitimate commands may include PHP/CMS-related scripts or routine cron jobs.

  - **Cross-reference timestamps with activity logs**: Look for corresponding entries in web server logs (like `/var/log/apache2/access.log` or `/var/log/nginx/access.log`) to identify user-triggered web requests that might coincide with the `execve` system calls.

  - **Identify unusual processes spawning from web context**: Use process monitoring tools or query the `ps` command for processes spawned by the `www-data` user, checking for known malicious binaries or scripts, which may indicate active exploitation.

  - **Review File Creation and Modification**: Look for new or altered files in web directories (like `/var/www/html/`) using timestamps or checksum validation. Malicious web shells often create or modify hidden files, which can indicate compromise.

  ### Prioritization

  This alert is critical as it indicates potential unauthorized access and execution of commands on a web server, which could lead to data breaches or damage to services. The likelihood of malicious abuse is high, especially in systems exposed to the internet where web shells are commonly weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited if `auditd` is not properly configured to capture all necessary events or if the web server is using non-standard user IDs. Legitimate administrative actions or certain configurations of web applications may trigger this alert, adding noise to investigations. A companion detection to strengthen coverage would be monitoring for unusual outbound connections from the web server that align with command execution activity, such as suspicious network flows in firewall or proxy logs.

