title: System Info Discovery via Sysinfo Syscall
id: b207d563-a1d9-4275-b349-77d1eb55aa6d
status: experimental
description: |
  Detects use of the sysinfo system call in Linux, which provides a snapshot of key system statistics such as uptime, load averages, memory usage, and the number of running processes.
  Malware or reconnaissance tools might leverage sysinfo to fingerprint the system - gathering data to determine if it's a viable target.
references:
- https://github.com/CheraghiMilad/bypass-Neo23x0-auditd-config/blob/f1c478a37911a5447d5ffcd580f22b167bf3df14/sysinfo-syscall/README.md
- https://man7.org/linux/man-pages/man2/sysinfo.2.html
author: Milad Cheraghi
date: 2025-05-30
modified: 2025-12-05
tags:
- attack.discovery
- attack.t1057
- attack.t1082
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b64 -S sysinfo -k discovery_sysinfo_syscall
    -a always,exit -F arch=b32 -S sysinfo -k discovery_sysinfo_syscall
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL: 'sysinfo'
  filter_optional_splunk:
    exe|endswith: '/bin/splunkd'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate administrative activity
level: low
note: |
  ### Technical Context

  This rule detects the invocation of the `sysinfo` system call in Linux, which retrieves system statistics such as uptime, load averages, and memory usage. The likely attacker objective is to gather system information for reconnaissance to assess if the machine is a viable target for further exploitation. This behavior is categorized under the MITRE ATT&CK tactic of Discovery, specifically technique T1082 (System Information Discovery).

  The primary telemetry source is audit logs from `auditd`, capturing events where the `sysinfo` syscall is made. If this behavior is malicious, it could indicate an adversary gathering information about the target system to plan further actions. Notably, this detection does NOT confirm actual exploitation or further malicious activity; it only indicates a potential reconnaissance step.

  ### Investigation Steps

  - **Check audit logs for `sysinfo` usage**: Review audit logs with Event IDs for `sysinfo` syscall (`auditd` logs with key `discovery_sysinfo_syscall`) to identify the process invoking the command and its parent process.

  - **Identify the process context**: Examine the full command line of the process that triggered the `sysinfo` call. Look for suspicious or uncommon binaries (e.g., binaries not part of standard system operations).

  - **Determine legitimate activity**: Compare the execution context against typical administrative tasks or known system monitoring tools, which may use `sysinfo`. Tools like `top` or `htop` may invoke this call legitimately.

  - **Correlate time frames**: Check for the timing of the `sysinfo` invocation against other suspicious activities, such as unauthorized logins or unusual network connections, which could indicate a larger compromise.

  - **Validate output artifacts**: If applicable, look for config files and related logs that benchmark system performance expectations, ensuring they align with the detected `sysinfo` invocation to rule out benign monitoring activity.

  - **Inspect process lineage**: Use `ps` or similar commands to determine the ancestor processes of the calling process to identify if there's a compromise vector or other systematic behavior triggering the alert.

  ### Prioritization

  The alert is low severity. While the behavior indicates possible reconnaissance activity, which is often a precursor to attacks, the direct impact is minimal unless correlated with further malicious behavior. Because tools leveraging `sysinfo` are common in both legitimate and malicious contexts, the likelihood of abuse does increase, but it is not directly weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited by configurations that do not adequately audit system calls, especially in environments where `auditd` is misconfigured or absent. Legitimate administrative activities, such as system performance checks or specific monitoring tools, may inadvertently trigger this alert. A companion detection to consider is the invocation of other discovery-related syscalls, like `gethostname` or path probing calls, which together reinforce the analysis of potentially malicious reconnaissance efforts.

