title: System Info Discovery via Sysinfo Syscall
id: b207d563-a1d9-4275-b349-77d1eb55aa6d
status: experimental
description: |
  Detects use of the sysinfo system call in Linux, which provides a snapshot of key system statistics such as uptime, load averages, memory usage, and the number of running processes.
  Malware or reconnaissance tools might leverage sysinfo to fingerprint the system - gathering data to determine if it's a viable target.
references:
- https://github.com/CheraghiMilad/bypass-Neo23x0-auditd-config/blob/f1c478a37911a5447d5ffcd580f22b167bf3df14/sysinfo-syscall/README.md
- https://man7.org/linux/man-pages/man2/sysinfo.2.html
author: Milad Cheraghi
date: 2025-05-30
modified: 2025-12-05
tags:
- attack.discovery
- attack.t1057
- attack.t1082
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b64 -S sysinfo -k discovery_sysinfo_syscall
    -a always,exit -F arch=b32 -S sysinfo -k discovery_sysinfo_syscall
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL: 'sysinfo'
  filter_optional_splunk:
    exe|endswith: '/bin/splunkd'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate administrative activity
level: low
note: |
  ### Technical Context
  This detection rule identifies the use of the `sysinfo` system call in Linux operating systems. The `sysinfo` call can provide a variety of system metrics, including uptime, load averages, memory usage, and the number of processes currently executing. While the `sysinfo` call can be part of legitimate system administration tasks, its use may also signify that an attacker or malware is probing the system for key information to aid in further exploitation. Understanding system characteristics could help an adversary identify potential targets or weaknesses.

  The threat scenario typically involves an adversary gaining access to a compromised system and using the `sysinfo` syscall as a reconnaissance tactic. Their primary objective is to gather information relevant to planning subsequent stages of their attack, such as lateral movement or privilege escalation. The relevant MITRE ATT&CK tactics and techniques for this behavior include T1082 (System Information Discovery) and T1057 (Process Discovery). This rule leverages information from auditd logs, which are configured to monitor syscall events, providing crucial insights into potential malicious activity.

  Primary data sources for this detection include:
  - Auditd logs that record syscall activity.
  - System logs that may reflect unauthorized access attempts or user activity.

  ### Investigation Steps
  - **Review Audit Logs:** Examine the auditd logs for the `sysinfo` syscall entries. Look for any unauthorized or unexpected calls that could indicate reconnaissance activity.
  - **Identify User Context:** Determine the user or process that executed the `sysinfo` syscall. Check if it was initiated by a legitimate administrative user or by a process with unusual behavior.
  - **Correlate With Other Activities:** Cross-reference the `sysinfo` detections with other system discovery behaviors, such as unusual process listing commands (e.g., `ps`, `top`) or other suspicious system calls in the logs.
  - **Analyze System State:** If anomalous activity is detected, verify the state of the system, including active processes and any potential indicators of compromise (IoCs), to assess whether further intrusion has occurred.

  ### Prioritization
  The alert is rated as low severity due to the likelihood of false positives from legitimate administrative tasks. However, it should still be investigated as part of broader campaign detection since unexpected or unauthorized use of the syscall can indicate underlying compromise.

  ### Blind Spots and Assumptions
  One gap in detection coverage could be the reliance on auditd configurations, which may not be consistently implemented across all Linux systems. The detection logic assumes that if the `sysinfo` syscall is logged, it indicates reconnaissance activity; however, this could also stem from legitimate tools or scripts executed by authorized users. Required logs include comprehensive auditd configurations for both 32-bit and 64-bit architectures to ensure complete visibility into the syscall usage across the system.

