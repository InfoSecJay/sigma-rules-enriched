note: |
  ### Technical Context

  This Sigma rule detects the execution of the `split` command on Linux systems, a command commonly used to divide a file into smaller segments. While `split` can be a routine part of data processing or management tasks, it can also indicate suspicious activities such as data exfiltration or preparation for transfer, aligning with the adversary objective to illicitly steal data. This behavior correlates with the MITRE ATT&CK technique T1030 (Data Exfiltration Over Command and Control Channel), which describes methods adversaries might utilize to remove data from a compromised environment.

  The primary telemetry sources include Linux audit logs and system command execution logs capturing syscall events, particularly `SYSCALL` type logs from `auditd`. If this action is found to be malicious, it may indicate that sensitive data is being extracted from the network. However, detection of this command alone does NOT confirm exfiltration has occurred or that malicious intent is present, as legitimate administrative users might also employ the `split` command for benign purposes.

  ### Investigation Steps

  - **Query audit logs for command execution:** Review `auditd` logs for syscalls associated with the `split` command (Event Type: `SYSCALL`). Focus on the `comm` field where `comm: split`. Assess the context in which this command was executed, including the boundary of system user privileges.

  - **Analyze the originating user:** Evaluate the user ID and group (UID/GID) that triggered the `split` command. Legitimate activity typically involves system admin accounts or known scripts used for data management. Any anomalous or unauthorized users running this command should be flagged for further investigation.

  - **Check for subsequent data transfer actions:** Look for additional commands run post-execution of `split`, such as `scp`, `rsync`, or `curl` that may indicate potential data transfer actions. Identify files generated by the `split` process and monitor any related outbound connections.

  - **Validate the size and type of split files:** Inspect the file size and names created following the execution of the `split` command. Compressed or archives containing sensitive data may point to malicious intent, while files generated for regular processing (e.g., logs, archives) often do not pose a risk.

  - **Monitor for consistent patterns of behavior:** Cross-reference this behavior with historical logs for the user or system to identify any emerging patterns often associated with malicious actors, such as repetitive executions at odd hours or use by particular user accounts that do not typically employ the command.

  ### Prioritization

  The alert severity is considered low due to the wide range of benign uses for the `split` command by legitimate administrative activities. While the likelihood of malicious abuse exists, it is less common and is often dependent on the context and surrounding actions of the user.

  ### Blind Spots and Assumptions

  Detection may be limited if `auditd` is not properly configured to capture syscall events or if logging is disabled for certain processes. Legitimate administrative tasks like file processing or temporary data handling could trigger the alert without malicious intent. A related detection would involve monitoring for file access patterns or data transfers post `split` execution to better assess potential exfiltration attempts.

