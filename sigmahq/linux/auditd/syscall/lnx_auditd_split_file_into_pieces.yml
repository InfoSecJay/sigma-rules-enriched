note: |
  ### Technical Context
  This detection rule identifies the use of the `split` command in Linux, which is often employed to divide large files into smaller segments. Such actions can be indicative of exfiltration attempts, especially if conducted by malicious actors aiming to prepare data for unauthorized transfer or to evade detection mechanisms. By splitting files into smaller parts, attackers may attempt to bypass security controls that monitor file transfers and limit data sent over the network.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection include "Exfiltration" (T1041) and "Exfiltration Over Command and Control Channel" (T1041.001). This aligns with adversary behaviors where they seek to transfer sensitive information out of an organization’s environment to potentially exploit or leverage the data elsewhere.

  Key telemetry sources for this detection include Linux audit logs (auditd), which capture system calls, including the invocation of commands like `split`. Analyzing these logs can provide insights into the actions taken by users and potentially point towards unauthorized data activities.

  ### Investigation Steps
  - **Collect Audit Logs:** Gather audit logs from Linux systems where the `split` command was detected to analyze the context surrounding its execution, including user identity and timestamps.
  - **Review User Activity:** Investigate the user account associated with the `split` command. Look for patterns of unusual file access, particularly with sensitive files, or repeated use of the command that could indicate scripted or automated behavior.
  - **Analyze File Transfers:** Examine any subsequent network activity to identify whether the split files were transferred outside the network. Pay attention to unusual or unauthorized outbound connections that correspond with the timing of the command execution.
  - **Evaluate System Configurations:** Check system configurations and user privilege levels, ensuring that only authorized personnel have the ability to use commands that manipulate file structures. Identify any potentially suspicious user accounts that might indicate insider threats.

  ### Prioritization
  The alert's severity is considered low in an enterprise environment since the command itself can be used for legitimate administrative purposes. However, it merits investigation due to the potential for misuse in exfiltration scenarios, particularly if combined with other suspicious activities.

  ### Blind Spots and Assumptions
  Possible gaps in detection coverage could include environments where audit logging is disabled or misconfigured, limiting visibility into such command executions. The detection logic assumes the command is not part of benign administrative activity; therefore, any alerts could lead to false positives. Ensuring auditd is correctly configured and capturing all relevant system calls is critical for the effectiveness of this detection.

