title: Program Executions in Suspicious Folders
id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
status: test
description: Detects program executions in suspicious non-program folders related
  to malware or hacking activity
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2018-01-23
modified: 2021-11-27
tags:
- attack.t1587
- attack.t1584
- attack.resource-development
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'SYSCALL'
    exe|startswith:
            # Temporary folder
    - '/tmp/'
            # Web server
    - '/var/www/'                      # Standard
    - '/home/*/public_html/'           # Per-user
    - '/usr/local/apache2/'            # Classical Apache
    - '/usr/local/httpd/'              # Old SuSE Linux 6.* Apache
    - '/var/apache/'                   # Solaris Apache
    - '/srv/www/'                      # SuSE Linux 9.*
    - '/home/httpd/html/'              # Redhat 6 or older Apache
    - '/srv/http/'                     # ArchLinux standard
    - '/usr/share/nginx/html/'         # ArchLinux nginx
            # Data dirs of typically exploited services (incomplete list)
    - '/var/lib/pgsql/data/'
    - '/usr/local/mysql/data/'
    - '/var/lib/mysql/'
    - '/var/vsftpd/'
    - '/etc/bind/'
    - '/var/named/'
  condition: selection
falsepositives:
- Admin activity (especially in /tmp folders)
- Crazy web applications
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious program executions originating from commonly misused folders, often associated with malware or hacking activity on Linux systems. Attackers frequently exploit writable, public, or temporary directories to execute malicious payloads, obfuscate their actions, or establish persistence. By detecting these executions, the rule highlights potential compromise scenarios where adversaries may leverage vulnerabilities in web server configurations or other mismanaged services.

  The relevant MITRE ATT&CK tactics applicable in this context include **Resource Development** (ID: T1584), which covers the creation of resources to facilitate attacks, and **Exploitation for Client Execution** (ID: T1587), highlighting how attackers might exploit system components to run unauthorized code. By monitoring these activities, detection teams can respond to possible breaches of system integrity or unauthorized software installations.

  Primary data sources for this detection include audit logs from the Linux `auditd` service, which tracks system calls and can provide detailed insights into command execution within targeted directories.

  ### Investigation Steps
  - **Review Audit Logs:** Examine audit logs for syscall events involving executable files found in suspicious directories such as `/tmp/`, `/var/www/`, or database service directories. Look for patterns indicating unusual application execution.
  - **Analyze Directory Contents:** Investigate the contents of the affected directories to identify any unfamiliar or suspicious files. Cross-reference executed files with known indicators of compromise (IOCs) related to malware or exploit kits.
  - **Correlate with User Activity:** Check user access logs and credentials for any anomalies that might suggest unauthorized access. High-risk user activities preceding suspicious executions can indicate potential security incidents that require immediate attention.
  - **Validate System Configurations:** Evaluate permissions and configurations of web servers and databases. Ensure proper security practices are in place to prevent unauthorized file uploads or command executions in directories that should remain secure.

  ### Prioritization
  The medium severity of this alert is justified in an enterprise environment due to the potential for significant impact if malicious execution goes unnoticed. Given that executable content in these folders can facilitate successful intrusions or data breaches, prompt investigation is essential to mitigate risks.

  ### Blind Spots and Assumptions
  Potential gaps in detection may arise from legitimate administrative workflows, as system updates or expected application behavior could produce similar logs. Additionally, the detection logic assumes that suspicious program executions will indeed originate from the specific directories listed; therefore, if custom paths are used by attackers, those may not be detected. Properly configured audit logging on Linux systems is crucial for the alert to function effectively, necessitating that auditd is set up to monitor the relevant syscall events appropriately.

