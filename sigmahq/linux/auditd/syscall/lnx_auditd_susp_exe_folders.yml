title: Program Executions in Suspicious Folders
id: a39d7fa7-3fbd-4dc2-97e1-d87f546b1bbc
status: test
description: Detects program executions in suspicious non-program folders 
  related to malware or hacking activity
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2018-01-23
modified: 2021-11-27
tags:
- attack.t1587
- attack.t1584
- attack.resource-development
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'SYSCALL'
    exe|startswith:
            # Temporary folder
    - '/tmp/'
            # Web server
    - '/var/www/'                      # Standard
    - '/home/*/public_html/'           # Per-user
    - '/usr/local/apache2/'            # Classical Apache
    - '/usr/local/httpd/'              # Old SuSE Linux 6.* Apache
    - '/var/apache/'                   # Solaris Apache
    - '/srv/www/'                      # SuSE Linux 9.*
    - '/home/httpd/html/'              # Redhat 6 or older Apache
    - '/srv/http/'                     # ArchLinux standard
    - '/usr/share/nginx/html/'         # ArchLinux nginx
            # Data dirs of typically exploited services (incomplete list)
    - '/var/lib/pgsql/data/'
    - '/usr/local/mysql/data/'
    - '/var/lib/mysql/'
    - '/var/vsftpd/'
    - '/etc/bind/'
    - '/var/named/'
  condition: selection
falsepositives:
- Admin activity (especially in /tmp folders)
- Crazy web applications
level: medium
note: |
  ### Technical Context

  This Sigma rule detects program executions within specific non-program directories commonly associated with malicious activity, such as web server directories and temporary folders. Attackers often target these paths to execute unauthorized code or deploy web shells, aiming to maintain persistent access or exfiltrate data. Relevant MITRE ATT&CK tactics include "Resource Development" (T1587) and "Initial Access" or "Execution" (T1584).

  The primary telemetry source for this detection is Linux audit logs generated by `auditd`, specifically syscalls related to executable file launches. If malicious, such activity could lead to data breaches, manipulation of web services, or lateral movement within the network. Importantly, this detection alone does not confirm malicious intent; benign user behavior, particularly by system administrators or web developers, can also trigger these alerts.

  ### Investigation Steps

  - **Examining Auditd Logs**: Review `auditd` logs (Event ID auid=) for system calls matching the suspected execution paths, focusing on `exe` field values that start with `/tmp/`, `/var/www/`, or other specified folders.

  - **Identifying Malicious File Types**: Look for execution commands running scripts or binaries (e.g., `.php`, `.sh`, or executable files) from suspicious directories. File names like `eval.php` or `cmd.php` could indicate malicious activity.

  - **Searching for User Context**: Correlate the `auid` (audit user ID) field with legitimate users. If an execution is from an unexpected or service account, it may warrant further investigation for potential compromise.

  - **Reviewing Legitimate Activity**: Investigate typical administrative or web development tasks (like temporary file testing in `/tmp/`). If certain file executions are logged during known maintenance windows, they may be benign.

  - **Identifying High-Risk Assets**: Focus on servers hosting web applications or databases, like those under `/var/www/` or `/usr/local/mysql/data/`. These servers are critical for operations and could have significant impacts if compromised.

  - **Monitoring for Persistency Indicators**: Check for additional activity in conjunction with this alert, like web server logs indicating repeated access patterns to the same exploited directories or subsequent changes in code.

  ### Prioritization

  This alert has a medium severity due to the potential impact on critical web servers and databases, combined with the likelihood of adversary exploitation methods being focused on these paths. While the specific behavior is not uncommon among legitimate activities, the risk profile increases if linked to unauthorized command executions.

  ### Blind Spots and Assumptions

  Evasion techniques might include disguising malicious executables as legitimate processes or using common service accounts for execution. This detection relies on proper `auditd` configuration, and any lack of logging could lead to missed alerts. Legitimate web development activity could falsely trigger this rule, especially during deployment cycles. A companion detection to consider is monitoring for anomalous `cron` jobs or scheduled tasks executing from these folders, further enhancing threat visibility.

