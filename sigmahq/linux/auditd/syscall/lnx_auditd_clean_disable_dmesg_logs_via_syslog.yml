title: Clear or Disable Kernel Ring Buffer Logs via Syslog Syscall
id: eca5e022-d368-4043-98e5-9736fb01f72f
status: experimental
description: |
  Detects the use of the `syslog` syscall with action code 5 (SYSLOG_ACTION_CLEAR),
  (4 is SYSLOG_ACTION_READ_CLEAR and 6 is SYSLOG_ACTION_CONSOLE_OFF) which clears the kernel
  ring buffer (dmesg logs). This can be used by attackers to hide traces after exploitation
  or privilege escalation. A common technique is running `dmesg -c`, which triggers this syscall internally.
references:
- https://man7.org/linux/man-pages/man2/syslog.2.html
- https://man7.org/linux/man-pages/man1/dmesg.1.html
author: Milad Cheraghi
date: 2025-05-27
modified: 2025-12-05
tags:
- attack.defense-evasion
- attack.t1070.002
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b64 -S syslog -F a0=4 -k clear_dmesg_logs
    -a always,exit -F arch=b64 -S syslog -F a0=5 -k clear_dmesg_logs
    -a always,exit -F arch=b64 -S syslog -F a0=6 -k disable_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=4 -k clear_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=5 -k clear_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=6 -k disable_dmesg_logs
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL: 'syslog'
    a0:
    - 4         # SYSLOG_ACTION_READ_CLEAR : Read and clear log
    - 5         # SYSLOG_ACTION_CLEAR: Clear kernel ring buffer (without reading)
    - 6         # SYSLOG_ACTION_CONSOLE_OFF: Disable logging to console
  condition: selection
falsepositives:
- System administrators or scripts that intentionally clear logs
- Debugging scripts
level: medium
note: |
  ---

  ### Technical Context

  The Sigma rule detects the execution of the `syslog` syscall with action codes that clear or disable kernel ring buffer logs (dmesg logs) on Linux systems. This behavior is often adopted by attackers to hide their tracks after exploitation or privilege escalation, aiming to prevent detection of other malicious activities. The relevant MITRE ATT&CK tactics are "Defense Evasion" (T1070.002).

  Primary telemetry sources include audit logs generated by `auditd` on Linux systems, particularly looking for syscall events. If malicious, the clearing of these logs can significantly impede the ability to forensic analyze an incident and trace back attacker activity. This detection does **not** confirm that any malicious activity has occurred; it merely indicates that an attempt was made to hide information from the kernel log.

  ---

  ### Investigation Steps

  - **Identify the source of the log-clearing action:** Check `auditd` logs for relevant Event IDs (e.g., 132 – syscall events) at log location `/var/log/audit/audit.log`, specifically looking for action code 5 (SYSLOG_ACTION_CLEAR).

  - **Lookup timestamps and user context:** Correlate the timestamp of the syslog syscall with user login sessions in the `/var/log/secure` or `/var/log/auth.log` files to determine whether the action corresponds to legitimate administrative tasks or potentially malicious behavior.

  - **Compare with expected administrative behavior:** Determine if the machine is a critical asset (e.g., a server or a test system) and whether there are legitimate reasons documented for log clearing. Regular log maintenance workflows may involve such commands but should be verified with operational standards.

  - **Validate process origins:** Investigate if the log-clearing command is invoked by processes with unusual parent-child relationships or unexpected user accounts, particularly focusing on parent processes and command-line arguments.

  - **Review file integrity and changes:** Check for other actions around the same time that may indicate malicious behavior, such as unusual file creation or modification timestamps in `/var/log/`, especially files like `/var/log/syslog` or `/var/log/dmesg`.

  ---

  ### Prioritization

  This alert is of medium severity as it indicates a potential defense evasion technique that could undermine the integrity of forensic investigations. While log clearing can be part of legitimate maintenance, its occurrence on critical systems raises the likelihood of malicious intent, especially if it correlates with other suspicious activity.

  ---

  ### Blind Spots and Assumptions

  Detection accuracy relies on the effective configuration of `auditd` to ensure syscall logging is capturing all relevant activities; gaps in logging could allow malicious behavior to go undetected. Legitimate activities, such as routine system maintenance by admins or system application debug scripts, may also trigger this alert. Related detections include monitoring for abnormal syscall frequencies or patterns that may indicate broader malicious behavior, enhancing detection coverage for adversaries employing various evasion tactics.

