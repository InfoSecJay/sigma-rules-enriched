title: Clear or Disable Kernel Ring Buffer Logs via Syslog Syscall
id: eca5e022-d368-4043-98e5-9736fb01f72f
status: experimental
description: |
  Detects the use of the `syslog` syscall with action code 5 (SYSLOG_ACTION_CLEAR),
  (4 is SYSLOG_ACTION_READ_CLEAR and 6 is SYSLOG_ACTION_CONSOLE_OFF) which clears the kernel
  ring buffer (dmesg logs). This can be used by attackers to hide traces after exploitation
  or privilege escalation. A common technique is running `dmesg -c`, which triggers this syscall internally.
references:
- https://man7.org/linux/man-pages/man2/syslog.2.html
- https://man7.org/linux/man-pages/man1/dmesg.1.html
author: Milad Cheraghi
date: 2025-05-27
modified: 2025-12-05
tags:
- attack.defense-impairment
- attack.t1685.006
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b64 -S syslog -F a0=4 -k clear_dmesg_logs
    -a always,exit -F arch=b64 -S syslog -F a0=5 -k clear_dmesg_logs
    -a always,exit -F arch=b64 -S syslog -F a0=6 -k disable_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=4 -k clear_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=5 -k clear_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=6 -k disable_dmesg_logs
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL: 'syslog'
    a0:
    - 4         # SYSLOG_ACTION_READ_CLEAR : Read and clear log
    - 5         # SYSLOG_ACTION_CLEAR: Clear kernel ring buffer (without reading)
    - 6         # SYSLOG_ACTION_CONSOLE_OFF: Disable logging to console
  condition: selection
falsepositives:
- System administrators or scripts that intentionally clear logs
- Debugging scripts
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `syslog` syscall with action codes that clear or disable the kernel ring buffer logs (dmesg). The likely attacker objective is to erase digital footprints during or after exploitation or privilege escalation to hinder forensic investigations. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (ID: T1685.006). The primary telemetry source for this detection is the Linux audit logs, specifically through the `auditd` service capturing syscall events. If malicious, the security impact includes the potential for undetected exploitation, as clearing dmesg logs can obscure signs of compromise. It's essential to note that this detection does NOT confirm unauthorized access or malicious actions on its own; it indicates an attempt to manipulate log visibility.

  ### Investigation Steps

  - **Review syslog syscall usage:**
    Check Linux audit logs for Event IDs related to the `syslog` syscall, specifically looking for action codes 4 (SYSLOG_ACTION_READ_CLEAR), 5 (SYSLOG_ACTION_CLEAR), and 6 (SYSLOG_ACTION_CONSOLE_OFF). The presence of code 5 indicates an explicit attempt to clear logs.

  - **Correlate with user activity:**
    Identify the user or process associated with the syscall events using fields like `exe`, `uid`, and `pid` from the audit logs. Determine whether the user has administrative access or if this action was executed by a known process.

  - **Assess log clearing context:**
    Analyze the timing and frequency of log clearing actions in conjunction with other events around the same timeframe. Look for abnormal patterns that could suggest malicious activity, such as log clearing occurring soon after system compromises or privilege escalations.

  - **Identify benign vs malicious behavior:**
    Compare discovered `syslog` actions with expected activities from system administrators or scripts for legitimate maintenance of dmesg logs. Recognizing standard operational procedures is critical for differentiating between benign and suspicious actions.

  - **Look for companion malicious indicators:**
    Check for other alerting behaviors nearby, such as execution of known malicious binaries or unauthorized access attempts within the system processes. Look for compromised binaries that could indicate lateral movement or persistence mechanisms.

  ### Prioritization

  This alert should be treated with medium severity given the potential for significant impact if an attacker is leveraging this technique to cover their tracks. The likelihood of malicious abuse is concerning due to the common occurrence of log-clearing methods in attacks. This behavior can indicate a well-organized adversary trying to evade detection, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection is limited by the proper configuration of auditd for capturing syscall events; missing configurations will result in undetected log clearing activities. Legitimate activities such as maintenance by system administrators or debugging scripts can trigger this alert. A related detection to consider is monitoring for unusual process creations indicating persistent or abnormal behaviors to strengthen the overall detection framework.

