title: Clear or Disable Kernel Ring Buffer Logs via Syslog Syscall
id: eca5e022-d368-4043-98e5-9736fb01f72f
status: experimental
description: |
  Detects the use of the `syslog` syscall with action code 5 (SYSLOG_ACTION_CLEAR),
  (4 is SYSLOG_ACTION_READ_CLEAR and 6 is SYSLOG_ACTION_CONSOLE_OFF) which clears the kernel
  ring buffer (dmesg logs). This can be used by attackers to hide traces after exploitation
  or privilege escalation. A common technique is running `dmesg -c`, which triggers this syscall internally.
references:
- https://man7.org/linux/man-pages/man2/syslog.2.html
- https://man7.org/linux/man-pages/man1/dmesg.1.html
author: Milad Cheraghi
date: 2025-05-27
modified: 2025-12-05
tags:
- attack.defense-evasion
- attack.t1070.002
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -a always,exit -F arch=b64 -S syslog -F a0=4 -k clear_dmesg_logs
    -a always,exit -F arch=b64 -S syslog -F a0=5 -k clear_dmesg_logs
    -a always,exit -F arch=b64 -S syslog -F a0=6 -k disable_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=4 -k clear_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=5 -k clear_dmesg_logs
    -a always,exit -F arch=b32 -S syslog -F a0=6 -k disable_dmesg_logs
detection:
  selection:
    type: 'SYSCALL'
    SYSCALL: 'syslog'
    a0:
    - 4         # SYSLOG_ACTION_READ_CLEAR : Read and clear log
    - 5         # SYSLOG_ACTION_CLEAR: Clear kernel ring buffer (without reading)
    - 6         # SYSLOG_ACTION_CONSOLE_OFF: Disable logging to console
  condition: selection
falsepositives:
- System administrators or scripts that intentionally clear logs
- Debugging scripts
level: medium
note: |
  ### Technical Context

  This rule detects the use of the `syslog` syscall with action codes indicating an attempt to clear or disable kernel ring buffer logs on Linux systems. The likely attacker objective is to obfuscate their activities following exploitation or privilege escalation, thereby avoiding detection by security monitoring tools. The relevant MITRE ATT&CK technique for this behavior is Defense Evasion (T1070.002).

  Primary telemetry sources include audit logs from the `auditd` service and specifically the actions recorded when the `syslog` syscall is executed. If successful, this detection could indicate a significant security impact, as it could allow attackers to erase traces of their actions on the system. Importantly, it does NOT confirm malicious intent on its own, as legitimate system administrators might also invoke this syscall for maintenance or debugging purposes.

  ### Investigation Steps

  - **Check relevant audit logs:** Review Audit logs for syscall events (Audit Event ID 132) related to `syslog`, specifically action codes 4, 5, and 6. Look for timestamps and process identifiers to assess the context of the command execution.

  - **Identify the invoking process:** Correlate the `syslog` syscall events back to the parent process using Audit logs. Evaluate the command line arguments of the processes to ascertain if the action was performed by a legitimate administrator or an unauthorized user.

  - **Evaluate user permissions:** Verify the user account under which the `syslog` syscall was executed. Look for accounts with elevated privileges (UID 0 or members of the sudoers group) in the logs to ascertain if this aligns with known legitimate activity.

  - **Document normal behaviors:** Acknowledge that legitimate system maintenance may include log clearing activities. Review the history of regular scripts or cron jobs that employ log clearing commands, which can help distinguish between benign and malicious activity.

  - **Look for correlating anomalies:** Check if there were any other suspicious activities recorded around the time of the `syslog` calls, such as high usage of other logging utilities or unexpected privilege escalations (associated Event IDs 4688 for Windows processes or Sudo command executions).

  - **Identify suspicious patterns:** Note any rapid successive calls to `syslog` clear actions within a very short timeframe, which may indicate automated malicious behavior, contrasting with typical manual processes that usually exhibit longer execution intervals.

  ### Prioritization

  This alert has medium severity. Systems affected by this rule are typically production servers or critical infrastructure that, if compromised, can lead to extensive security incidents. The likelihood of malicious abuse is moderate because this behavior is indicative of attempts to conceal actions post-exploitation, which aligns with common attack methodologies.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative activities where clearing logs is a normal procedure for maintenance. It assumes proper configuration of `auditd`, as incomplete or misconfigured audit rules may miss these events. Additionally, certain debugging scripts may inadvertently trigger this alert. Related detections, such as monitoring for suspicious user behavior or a spike in privilege escalation attempts, can strengthen coverage of potentially malicious activity.

