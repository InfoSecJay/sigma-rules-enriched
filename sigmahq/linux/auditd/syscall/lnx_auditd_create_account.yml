title: Creation Of An User Account
id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
status: test
description: Detects the creation of a new user account. Such accounts may be used
  for persistence that do not require persistent remote access tools to be deployed
  on the system.
references:
- https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/7/html/security_guide/sec-understanding_audit_log_files
- https://access.redhat.com/articles/4409591#audit-record-types-2
- https://www.youtube.com/watch?v=VmvY5SQm5-Y&ab_channel=M45C07
author: Marie Euler, Pawel Mazur
date: 2020-05-18
modified: 2022-12-20
tags:
- attack.t1136.001
- attack.persistence
logsource:
  product: linux
  service: auditd
detection:
  selection_syscall_record_type:
    type: 'SYSCALL'
    exe|endswith: '/useradd'
  selection_add_user_record_type:
    type: 'ADD_USER'     # This is logged without having to configure audit rules on both Ubuntu and Centos
  condition: 1 of selection_*
falsepositives:
- Admin activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of new user accounts on Linux systems, which can signal possible persistence mechanisms employed by attackers. Such accounts may be utilized to maintain access to compromised systems without relying on traditional remote access tools. Attackers may create these accounts to establish footholds, facilitate future exploits, or exfiltrate sensitive data.

  The relevant MITRE ATT&CK tactics and techniques for this detection are **Persistence** (TA0003) and specifically **Account Creation** (T1136.001). Monitoring user account creation is crucial because it provides insight into unauthorized access or privilege escalation attempts within an environment.

  The primary data sources for this detection include audit logs generated by Linux systems, particularly logs from the `auditd` service that record system calls and user account management activities.

  ### Investigation Steps
  - **Review Audit Logs:** Examine `auditd` logs for any `useradd` or similar commands, focusing on timestamps and user identity to determine if the account creation was legitimate or malicious.
  - **Cross-Reference with User Activity:** Check the history of the accounts against established user and administrator roles. Pay attention to any accounts that were created by users not typically engaged in this activity.
  - **Investigate Privilege Escalation:** Assess the permissions assigned to the newly created accounts to understand their potential for misuse. Investigate if these accounts have been granted any elevated privileges that could facilitate further attacks.
  - **Correlate with Other Events:** Look for associated events in other logs, such as process execution logs or authentication attempts, which may indicate if the newly created account has been used for unauthorized access or lateral movement.

  ### Prioritization
  This alert is considered medium severity due to its potential implications for unauthorized access and persistence within the network. The likelihood of an attacker using account creation as a foothold is significant, particularly in environments where access controls may be lax.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may include environments where `auditd` is not enabled or configured correctly, potentially leading to missed account creation events. The detection logic assumes that any new account creation outside expected patterns warrants investigation. Proper `auditd` configuration and an understanding of the organization’s standard user account provisioning processes are required for the effectiveness of this alert.

