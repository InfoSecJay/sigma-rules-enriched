title: Creation Of An User Account
id: 759d0d51-bc99-4b5e-9add-8f5b2c8e7512
status: test
description: Detects the creation of a new user account. Such accounts may be 
  used for persistence that do not require persistent remote access tools to be 
  deployed on the system.
references:
- https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/7/html/security_guide/sec-understanding_audit_log_files
- https://access.redhat.com/articles/4409591#audit-record-types-2
- https://www.youtube.com/watch?v=VmvY5SQm5-Y&ab_channel=M45C07
author: Marie Euler, Pawel Mazur
date: 2020-05-18
modified: 2022-12-20
tags:
- attack.t1136.001
- attack.persistence
logsource:
  product: linux
  service: auditd
detection:
  selection_syscall_record_type:
    type: 'SYSCALL'
    exe|endswith: '/useradd'
  selection_add_user_record_type:
    type: 'ADD_USER'     # This is logged without having to configure audit rules on both Ubuntu and Centos
  condition: 1 of selection_*
falsepositives:
- Admin activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of a new user account on Linux systems through the `useradd` command. Attackers may create unauthorized user accounts to establish persistence within the system, allowing continued access even after other entry points are closed. The relevant MITRE ATT&CK tactic is Persistence, specifically technique T1136.001 (Create Account). Primary telemetry sources include audit logs generated by `auditd`, specifically tracking exec events related to the `useradd` syscall and direct user account additions. If malicious, this activity can significantly undermine system integrity and security. Importantly, this alert does NOT confirm malicious intent on its own, as legitimate administrative activities may trigger similar detections.

  ### Investigation Steps

  - **Review user creation log entries**: Check Audit logs for Event ID corresponding to user addition (`ADD_USER` type). Look specifically for the command `useradd`, noting any newly created usernames not recognized from standard administrative practice.

  - **Identify the creating user account**: Examine the `auditd` logs for the user who executed the `useradd` command (e.g., `auditd.log`). Determine if the account has legitimate administrative privileges or is an uncommon account behavior.

  - **Validate legitimate administrative actions**: Cross-reference the username with a list of known administrators. Confirm whether the action aligns with scheduled administrative tasks or policy-compliant user management activities.

  - **Analyze the timing and context of account creation**: Review the timestamps of the user creation alongside system changes or incidents within a short time frame. Assess if these align with other security events or network behavior indicative of ongoing exploitation, such as privilege escalation.

  - **Look for common evasion patterns**: Check if newly added users are part of a pattern of multiple accounts created in a short period, or if unusual command parameters, like non-standard shell configurations, were used to create the account.

  ### Prioritization

  This alert should be treated with medium severity in a mature enterprise context. If the affected system is critical for business operations or handles sensitive data, the impact could be severe. The likelihood of malicious abuse is moderate, especially in environments where unauthorized account creation can occur unnoticed during routine administrative operations.

  ### Blind Spots and Assumptions

  Limitations of this detection may include the potential for legitimate administrative activities, such as staff onboarding or automated account provisioning, to trigger alerts. Ensure `auditd` is properly configured to log all relevant syscall events and user record types; otherwise, detection may be incomplete. Related detections to strengthen coverage could include monitoring for suspicious user activity following account creation, such as failed login attempts or use of newly created accounts outside normal usage patterns.

