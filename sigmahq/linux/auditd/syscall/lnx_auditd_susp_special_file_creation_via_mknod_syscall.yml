note: |
  ### Technical Context
  This detection rule identifies the use of the `mknod` syscall in Linux systems, which is utilized to create special files, such as character or block devices. Attackers may exploit this syscall to create rogue device files that facilitate unauthorized access to kernel interfaces, establish covert communication channels, or manipulate the system's behavior without detection. Given that legitimate applications rarely utilize `mknod`, any activity that triggers this syscall warrants investigation, as it could indicate a potential compromise or an attempt at privilege escalation.

  The pertinent MITRE ATT&CK tactics tied to this detection include **Privilege Escalation (TA0004)** and **Persistence (TA0003)** through techniques like **Create or Modify System Process (T1543.003)**. These tactics are relevant as attackers may leverage the `mknod` syscall to maintain persistence on compromised systems or escalate permissions through unauthorized device file creation. The primary data source for detection is Linux audit logs generated by **auditd**, which provide visibility into system call activities and help spot anomalous behavior related to manipulation of device files.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze the audit logs generated by `auditd` to identify instances of the `mknod` syscall and correlate timestamps with user activities or other suspicious behaviors.
  - **Identify Contextual Usage**: Look for patterns or contexts around the syscall usage, such as the user accounts involved and the applications running at the time to determine if the calls came from legitimate processes or potential malware.
  - **Examine Suspicious Device Files**: Investigate any newly created special files to assess their characteristics, such as ownership, permissions, and access patterns, to identify potential backdoors or other malevolent activities.
  - **Correlate with Other Threat Indicators**: Check for other logs or alerts that might indicate concurrent malicious activities, such as unusual process executions or network connections that align with the time of the `mknod` syscall invocation.

  ### Prioritization
  The alert is classified as low severity because while the `mknod` syscall is rarely used by legitimate applications, its usage can sometimes be attributed to benign maintenance tasks, particularly in containerized environments. However, continued monitoring and investigation are necessary given the potential for malicious misuse.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the auditd service is not properly configured to capture all syscall activities or if the logs are not retained long enough for retrospective analysis. Additionally, the detection logic assumes that any invocation of the `mknod` syscall is abnormal, without accounting for specific contextual factors that may occur in legitimate scenarios, such as scripts for device initialization. Therefore, the correct configuration of auditd to ensure comprehensive syscall logging is essential for this detection to function effectively.

