note: |
  ### Technical Context

  This Sigma rule detects the use of the `mknod` syscall, which is typically employed to create special files such as character or block devices in Linux systems. An attacker may utilize this syscall to create fake devices, establish backdoors, or bypass file system restrictions to maintain persistence. This behavior aligns with MITRE ATT&CK Tactics such as Persistence (TA0003) and Privilege Escalation (TA0004), specifically under the technique of 'Create or Modify System Process' (T1543.003). The primary telemetry sources for this rule are Linux audit logs, specifically those generated by auditd, detailing syscall activities.

  If malicious, this activity can indicate advanced intrusion techniques due to the uncommon legitimate use of `mknod`. It is worth noting that this detection does NOT confirm an active breach on its own, as it may result from benign actions taken by legitimate scripts or system initialization processes.

  ### Investigation Steps

  - **Review audit logs for `mknod` syscall usage**: Check Linux audit logs (e.g., `/var/log/audit/audit.log`) for entries where the syscall type is 'SYSCALL' and specifically where `SYSCALL` is 'mknod'. Look for process IDs and user IDs to determine the context of the action.

  - **Correlate with process creation events**: Identify related process creation events (e.g., Audit Event ID 1102 for `execve` syscall) around the same timestamp to discern if the `mknod` activity was preceded by unknown or suspicious process initiation.

  - **Investigate user privileges**: Examine the user privilege level executing the `mknod` syscall. If a non-privileged user is invoking `mknod`, this could indicate malicious activity. Check entries in `/etc/passwd` for user role and permissions.

  - **Identify typical legitimate activities**: Legitimate usage may stem from system initialization or management scripts (e.g., interaction with udev or device management applications). Verify if logged `mknod` invocations correlate with recognized system services or scripts.

  - **Look for multiple `mknod` invocations**: A series of `mknod` syscalls within a short timeframe could indicate an automated attack script. Track the frequency and patterns in the audit logs for multiple instances by the same user or process.

  - **Review for backdoor indicators**: Examine the created files in `/dev/` for unusual naming conventions or properties. High-confidence malicious indicators include devices created with names resembling legitimate system files or with suspicious access permissions (e.g., 777).

  ### Prioritization

  This alert is of medium severity due to the potential for system compromise through unauthorized device creation. The likelihood of abuse is moderate, as the `mknod` syscall is rarely utilized in standard operations. It can also be weaponized, especially in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by environments where logs are not uniformly generated, or where `auditd` is misconfigured or disabled. Mixed usage in environments (such as development or specific containerized applications) might trigger legitimate alerts. A related detection to consider is the monitoring of suspicious modifications to the `/dev/` directory, which can provide additional context to the usage of `mknod`.

