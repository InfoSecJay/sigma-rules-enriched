level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the `insmod` command to load kernel modules, which can indicate potential malicious activity. Kernel modules are loadable pieces of code that run within the kernel space of an operating system. Adversaries may exploit this capability to gain persistence, escalate privileges, or execute malicious code at a high level of the operating system, which could be challenging to detect and mitigate.

  The primary goals of an attacker using kernel module loading involve maintaining control over compromised systems and evading detection by security solutions. For example, an attacker might use a malicious kernel module to monitor activities, capture keystrokes, or camouflage their presence on the system. This behavior corresponds to the MITRE ATT&CK tactics of **Persistence** (TA0003) and **Privilege Escalation** (TA0004), particularly under the technique of **Loadable Kernel Modules** (T1547.006).

  The main data sources useful for this detection include **auditd logs** on Linux systems, which capture syscall events and provide information on executed commands, including the parameters passed to them.

  ### Investigation Steps
  - **Review Audit Logs**: Examine auditd logs for `insmod` syscall events. Note the time, user, and process details to identify the context in which the kernel module was loaded.
  - **Inspect Loaded Kernel Modules**: Use commands such as `lsmod` to list currently loaded modules. Check for any new or suspicious modules that correlate with the timing of the alert.
  - **Analyze System Behavior**: Investigate any unusual behaviors or anomalies in system performance, network connections, or user activity that align with the period following the loading of the module.
  - **Validate Module Integrity**: Check the file signatures and source of the loaded kernel modules. Compare them against known good modules to identify any unauthorized or potentially harmful modules.

  ### Prioritization
  This alert is designated as high severity due to the potential impact of kernel module manipulation, which can enable attackers to maintain persistence and gain elevated privileges, leading to significant breaches within enterprise environments.

  ### Blind Spots and Assumptions
  This detection may not cover non-standard environments or scenarios where kernel modules are loaded through legitimate administrative activities, potentially leading to false positives. The detection logic assumes that auditd logging is configured correctly and effectively captures syscall events. If auditing is misconfigured or not enabled on the Linux systems, the capability to detect this behavior will be severely limited.

