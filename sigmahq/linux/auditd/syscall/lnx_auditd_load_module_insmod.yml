note: |
  ### Technical Context

  This Sigma rule detects the execution of the `insmod` command, which is used to load Kernel Modules (LKMs) in Linux environments. Adversaries may utilize this technique to gain persistence by loading malicious kernel-level code or to escalate privileges within the system. The relevant MITRE ATT&CK tactics are **Persistence** and **Privilege Escalation** (T1547.006).

  The primary telemetry source is the Audit daemon logs (`auditd`), specifically monitoring for syscall events related to the `insmod` command executed from `/usr/bin/kmod`. If used maliciously, this could lead to significant security impacts, such as unauthorized access to system resources and the potential for the attacker to maintain a foothold in the environment. It's important to note that this detection does NOT confirm that the loaded module is malicious on its own; further investigation is required.

  ### Investigation Steps

  - **Verify the command execution:** Check Audit logs for `SYSCALL` events related to `insmod`. Look for Event ID 287 (or equivalent) indicating `insmod` execution and capture the timestamp, user, and originating process.

  - **Identify the loaded module:** Examine `/proc/modules` or relevant logs to see which kernel module was loaded. Compare against a baseline of known good modules to detect anomalous entries that might suggest malicious activity.

  - **Assess user context:** Determine the user account that executed the `insmod` command. If it was invoked by a non-administrative user or through an automated script, this could indicate suspicious behavior. Check the user’s command history for context.

  - **Validate legitimate usage:** Review previous use cases for `insmod` in your environment. For legitimate purposes, such as hardware driver updates or system configurations, document the expected modules and user accounts accessing `insmod`.

  - **Check for additional artifacts:** Inspect potential artifacts related to recent kernel module loads, such as log entries in `/var/log/syslog` or `/var/log/audit/audit.log`, and confirm if any related system integrity checks or alerts were triggered around the same time.

  ### Prioritization

  Alerts triggered by this detection should be considered high severity due to the potential impact on critical systems and the likelihood that such behavior indicates an attempt to leverage the kernel for malicious purposes. Loading kernel modules is a method commonly weaponized by adversaries for persistence and privilege escalation.

  ### Blind Spots and Assumptions

  Detection may be limited if audit logging is not correctly configured to capture all necessary syscalls. Evasion techniques could include running the command from a script that is not tracked or using alternative methods to load modules without invoking `insmod`. Legitimate device driver installations or system tuning could inadvertently trigger this alert; thus, context is essential. Companion detections include monitoring for suspicious activity around module unloading (e.g., using `rmmod`), which, when paired with `insmod` detections, can provide comprehensive coverage of potential kernel manipulations.

