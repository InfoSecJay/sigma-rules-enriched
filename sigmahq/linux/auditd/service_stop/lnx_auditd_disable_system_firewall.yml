  ---

  ### Technical Context

  This detection identifies attempts to disable system firewalls, specifically targeting Linux environments using services like firewalld, iptables, or UFW. The underlying behavior may indicate an attacker’s objective to bypass network security controls, facilitating unauthorized access or lateral movement within the network. This aligns with the MITRE ATT&CK tactic of Defense Evasion (ID: T1562.004).

  The primary telemetry source for this detection comes from Linux audit logs, specifically monitoring events indicating the stopping of firewall services. If malicious, this action could allow for unrestricted access to the network, increasing the risk of data exfiltration or further compromise. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also result in the same logs.

  ---

  ### Investigation Steps

  - **Review audit logs for service stops**: Examine Linux audit logs (usually `/var/log/audit/audit.log`) for lines indicating `SERVICE_STOP` events for firewalld, iptables, or UFW. Look for Event ID  STOP_FIREWALL to identify who initiated the action.

  - **Identify the user triggering the action**: Determine the user associated with the firewall service stop event. Check the `uid` field in the audit logs and validate against known administrative users. Legitimate activity typically involves service stops by system administrators with appropriate user IDs.

  - **Correlate with other system events**: Cross-reference with Syslog or other relevant logs to identify any unusual or suspicious commands executed around the same timestamp. Malicious indicator may include commands leveraging `curl` or `wget` immediately after the firewall was disabled.

  - **Check for network activity post-shutdown**: Using network logs, analyze traffic immediately following the firewall service stop. High outbound connections to unusual external IP addresses may indicate potential exfiltration or command and control communication.

  - **Investigate historical patterns of firewall changes**: Determine if this action is part of a trend. Use configuration management tools or version control (if applicable) to assess if this is part of scheduled maintenance or if it follows other anomalous activities that could signify an attack.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the critical role firewalls play in protecting enterprise networks. The likelihood of malicious abuse is significant, as disabling these services is a common tactic used by adversaries to orchestrate attacks. This behavior is often exploited in targeted campaigns and should be investigated promptly.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of audit logs if auditing is not properly configured on all systems. Adversaries may employ techniques to obscure their identities, such as using legitimate administrative accounts. Similarly, actual administrative tasks may trigger this alert during routine maintenance. A companion detection to strengthen coverage could include monitoring for changes in firewall rules or configurations using tools like `iptables -L`, which may provide context to service stop events.

