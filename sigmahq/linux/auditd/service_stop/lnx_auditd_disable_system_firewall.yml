note: |
  ### Technical Context
  This detection rule identifies instances where system firewalls on Linux systems are disabled by monitoring service stop events related to firewalld, iptables, or UFW (Uncomplicated Firewall). Disabling a firewall can be a tactic employed by adversaries to bypass network access controls, facilitating unauthorized communications or exploitation of vulnerabilities. Attackers may rely on this behavior to establish a foothold or escalate privileges within a compromised environment.

  Relevant MITRE ATT&CK tactics associated with this activity include **Defense Evasion** (TA0005) with a focal technique of **Disable or Modify Tools** (T1562.004). The objective of an attacker performing such actions would typically involve creating an opportunity to execute malicious actions without triggering defenses. The primary telemetry for this detection includes logs from the **Linux audit framework** (auditd), which can capture various system-level events including those related to service management.

  ### Investigation Steps
  - **Review Audit Logs:** Examine audit logs for events indicating when the firewalld, iptables, or UFW services were stopped. Look for timestamps and correlating user IDs to determine who executed these actions.
  - **Identify Contextual Behavior:** Assess related activities around the time of the firewall service termination. Check for concurrent anomalous login attempts, privilege escalations, or other changes to system configurations.
  - **Check Related Network Logs:** Inspect firewall logs for any unusual or unexpected network traffic that occurred post-firewall shutdown. This includes connections to known malicious IPs or unexpected outbound connections.
  - **Examine User Activity:** Cross-reference the users who stopped the firewall service with previous authentication logs to ascertain whether they are legitimate administrators or potentially compromised accounts.

  ### Prioritization
  Given the potential critical impact of disabling system firewalls, particularly in sensitive environments, alerts generated by this detection rule should be treated with high priority. Firewall controls are essential for protecting network boundaries, and their tampering may lead to serious security incidents.

  ### Blind Spots and Assumptions
  This detection logic may miss scenarios where firewalls are reconfigured without being stopped entirely, or where alternative firewall solutions are employed that do not interface with the monitored services. It assumes that relevant logs from the Linux audit framework are configured correctly and actively collected in a central logging solution. Additionally, it presumes that stopping the firewall is not part of standard administrative or maintenance activities, which requires careful monitoring of user behavior to lessen false positive alerts.

