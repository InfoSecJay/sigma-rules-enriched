title: Password Policy Discovery - Linux
id: ca94a6db-8106-4737-9ed2-3e3bb826af0a
status: stable
description: Detects password policy discovery commands
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1201/T1201.md
- https://linux.die.net/man/1/chage
- https://man7.org/linux/man-pages/man1/passwd.1.html
- https://superuser.com/questions/150675/how-to-display-password-policy-information-for-a-user-ubuntu
author: Ömer Günal, oscd.community, Pawel Mazur
date: 2020-10-08
modified: 2024-12-01
tags:
- attack.discovery
- attack.t1201
logsource:
  product: linux
  service: auditd
detection:
  selection_files:
    type: 'PATH'
    name:
    - '/etc/login.defs'
    - '/etc/pam.d/auth'
    - '/etc/pam.d/common-account'
    - '/etc/pam.d/common-auth'
    - '/etc/pam.d/common-password'
    - '/etc/pam.d/system-auth'
    - '/etc/security/pwquality.conf'
  selection_chage:
    type: 'EXECVE'
    a0: 'chage'
    a1:
    - '--list'
    - '-l'
  selection_passwd:
    type: 'EXECVE'
    a0: 'passwd'
    a1:
    - '-S'
    - '--status'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context
  This rule detects attempts to discover password policies on Linux systems, which can be indicative of reconnaissance activities by potential attackers. The commands monitored include `chage` and `passwd` that reveal information about password expiration and status, which may be exploited to escalate privileges or compromise accounts. Since attackers may seek to understand the security posture of a target system before launching an attack or moving laterally within the environment, this type of discovery is a precursor to more malicious activities.

  In line with the MITRE ATT&CK framework, this detection relates to the tactic of **Discovery** (T1083) and the specific technique of **File and Directory Discovery** (T1201). By leveraging the audit logs of command execution and file access, this rule identifies potential precursors to credential dumping or privilege escalation maneuvers.

  The primary data sources for this detection include audit logs generated by `auditd`, which record command executions and access to critical system files such as `/etc/login.defs` and various PAM (Pluggable Authentication Module) configuration files. Anomalies in these logs can help identify unauthorized attempts to probe password policies.

  ### Investigation Steps
  - **Review Command Execution Logs:** Investigate logs from `auditd` for executions of the `chage` and `passwd` commands by unauthorized users or during unusual hours.
  - **Examine Configuration Files:** Check access logs for the files listed in the detection logic (e.g., `/etc/login.defs`). Look for unauthorized read access or modifications.
  - **Identify User Context:** Determine the user context under which these commands were executed to assess if the access was legitimate or indicative of a compromised account.
  - **Monitor for Lateral Movement:** Look for subsequent lateral movement activities following the discovery of password policies, which may warrant further investigation into potential exploitation attempts.

  ### Prioritization
  Given that unauthorized password policy discovery can indicate reconnaissance by threat actors, this alert should be considered of **low priority** in an enterprise environment. While the initial detection does not necessarily represent an immediate threat, it should be investigated in the context of other activities that may suggest escalated malicious intent.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, such as failure to detect password policy discoveries performed by users who already have elevated privileges, which could mask malicious activities. Additionally, the detection logic assumes that appropriate audit logging is enabled on the target systems. Without enabled `auditd` configurations capturing command executions and file access, the rule will not function as intended. Organizations should ensure logging and auditing mechanisms are fully configured to mitigate these blind spots.

