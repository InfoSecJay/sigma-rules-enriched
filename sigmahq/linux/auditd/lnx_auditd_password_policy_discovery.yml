title: Password Policy Discovery - Linux
id: ca94a6db-8106-4737-9ed2-3e3bb826af0a
status: stable
description: Detects password policy discovery commands
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1201/T1201.md
- https://linux.die.net/man/1/chage
- https://man7.org/linux/man-pages/man1/passwd.1.html
- https://superuser.com/questions/150675/how-to-display-password-policy-information-for-a-user-ubuntu
author: Ömer Günal, oscd.community, Pawel Mazur
date: 2020-10-08
modified: 2024-12-01
tags:
- attack.discovery
- attack.t1201
logsource:
  product: linux
  service: auditd
detection:
  selection_files:
    type: 'PATH'
    name:
    - '/etc/login.defs'
    - '/etc/pam.d/auth'
    - '/etc/pam.d/common-account'
    - '/etc/pam.d/common-auth'
    - '/etc/pam.d/common-password'
    - '/etc/pam.d/system-auth'
    - '/etc/security/pwquality.conf'
  selection_chage:
    type: 'EXECVE'
    a0: 'chage'
    a1:
    - '--list'
    - '-l'
  selection_passwd:
    type: 'EXECVE'
    a0: 'passwd'
    a1:
    - '-S'
    - '--status'
  condition: 1 of selection_*
falsepositives:
- Legitimate administration activities
level: low
note: |
  ### Technical Context

  This rule detects commands executed in Linux environments that are related to password policy discovery, specifically the use of `chage` and `passwd` utilities to query password-related settings. The likely attacker objective is to gather information about password policies, which could inform subsequent brute-force or credential stuffing attacks. This behavior aligns with the MITRE ATT&CK tactic of Discovery, specifically technique T1201 (Password Policy Discovery). The primary telemetry sources include audit logs captured by `auditd`, focused on `EXECVE` events for command executions. If the actions are malicious, they could lead to unauthorized access or exploitation of weak password policies. This detection does NOT confirm an active attack; it merely indicates an inquiry into the system's password policies.

  ### Investigation Steps

  - **Verify command usage**: Check for execution of `chage` or `passwd` commands with arguments `--list`, `-l`, or `-S`. Look for Audit logs, specifically Audit Event ID 2304 with fields `exe` and `a0` for command confirmation.

  - **Identify potential adversary behavior**: Investigate any anomalous account activity related to the detected command. Confirm if the executed commands are from non-administrator accounts, indicating a potential compromise or internal abuse.

  - **Review legitimate activities**: Determine if the command was run as part of standard system administration practices. Valid entries should be tied to user or admin accounts regularly managing password policies.

  - **Analyze system context**: Check the system role and importance of the affected host. Review asset criticality to assess the impact of potential malicious activity, especially if it's a domain controller or a key server.

  - **Correlate with other detection methods**: Look for companion alerts such as SSH logins or unusual logins preceding the discovery commands. This could strengthen the investigation into potential pre-attack behaviors or lateral movement.

  ### Prioritization

  The severity of this alert is considered low due to its discovery nature, although an affected system’s criticality may elevate attention. The likelihood of malicious abuse is moderate, as this technique can directly relate to the planning of further attacks. However, this behavior is not heavily weaponized and could be triggered during routine administrative tasks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as attackers using less common methods to query passwords or executing these commands from scripts that may not be logged. Required log sources include properly configured `auditd` settings to capture detailed command execution events. Legitimate activities, like administrative password audits, may inadvertently trigger alerts. Another detection that could enhance coverage is monitoring for unusual logins or session times correlating with the command executions.

