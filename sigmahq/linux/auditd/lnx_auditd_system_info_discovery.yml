- Likely
level: low
note: |
  ### Technical Context

  This rule detects commands related to system information discovery on Linux systems via the auditd log source. Possible attacker objectives include gathering information about the operating environment, installed kernel modules, and the overall system configuration, which aids in further exploitation or lateral movement. The relevant MITRE ATT&CK tactic is Discovery, with technique ID T1082.

  Primary telemetry sources include auditd logs, specifically focusing on event types related to PATH access and EXECVE commands. If malicious, this behavior can reveal crucial system information that enables an attacker to tailor their attack strategy. It is important to state that this detection does NOT confirm malicious intent by itself; legitimate administrative activities can also lead to these commands being executed.

  ### Investigation Steps

  - **Review auditd logs for execution events**: Examine audit logs (e.g., /var/log/audit/audit.log) for EXECVE commands matching `uname`, `uptime`, `lsmod`, `hostname`, or `env`, specifically noting Event Type 1305. Look for unusual patterns or unexpected users.

  - **Identify command execution context**: Check for the source user and process ID (PID) associated with the detected commands. In particular, administrative tasks run by users like root might be benign, whereas execution by low-privilege users could be suspicious.

  - **Analyze file access patterns**: Search for access to common system files like `/etc/lsb-release`, `/etc/redhat-release`, or `/etc/issue` in the audit logs. Legitimate system updates or configurations might access these files; note if they coincide with typical maintenance windows.

  - **Look for signs of system enumeration**: Investigate any usage of commands leading with 'grep' containing virtualization terms (vbox, vm, xen, etc.) in the logs. This could indicate attempts to enumerate running virtual environments, which is typically a precursor to privilege escalation.

  - **Correlate with lateral movement indicators**: Check for any unusual network activity or SSH connections initiated from the source system during the time these commands were executed, suggesting that the information gathered may be used for further exploitation.

  - **Validate expected behavior**: Reference historical logs to identify expected administrator usage patterns for the commands being flagged. For instance, regular uptime checks by monitoring tools or scripts would be legitimate; sudden spikes could indicate a potential threat.

  ### Prioritization

  Given that this detection pertains to system discovery, the alert is of low severity in an enterprise context. However, its potential malicious abuse for reconnaissance cannot be ignored. Affected systems, particularly those containing sensitive information or service roles, warrant closer scrutiny, especially if the behavior is not characteristic of normal operations.

  ### Blind Spots and Assumptions

  This rule may not detect all relevant actions due to its reliance on auditd logs, which may not capture all system interactions or could be configured improperly. Authorization-related benign activities, such as legitimate system checks by administrators, may trigger this rule. It is advisable to employ companion detections, such as monitoring for unusual network connections following these commands, to enhance threat coverage.

