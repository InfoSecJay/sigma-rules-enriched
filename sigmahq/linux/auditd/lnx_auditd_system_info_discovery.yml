title: System Information Discovery - Auditd
id: f34047d9-20d3-4e8b-8672-0a35cc50dc71
status: test
description: Detects System Information Discovery commands
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f296668303c29d3f4c07e42bdd2b28d8dd6625f9/atomics/T1082/T1082.md
author: Pawel Mazur
date: 2021-09-03
modified: 2023-03-06
tags:
- attack.discovery
- attack.t1082
logsource:
  product: linux
  service: auditd
detection:
  selection_1:
    type: PATH
    name:
    - /etc/lsb-release
    - /etc/redhat-release
    - /etc/issue
  selection_2:
    type: EXECVE
    a0:
    - uname
    - uptime
    - lsmod
    - hostname
    - env
  selection_3:
    type: EXECVE
    a0: grep
    a1|contains:
    - vbox
    - vm
    - xen
    - virtio
    - hv
  selection_4:
    type: EXECVE
    a0: kmod
    a1: list
  condition: 1 of selection_*
falsepositives:
- Likely
level: low
note: |
  ### Technical Context
  This detection rule identifies commands executed on Linux systems that are indicative of system information discovery. Threat actors may utilize these commands to gather details about the operating system, kernel modules, virtual environment, and other system attributes, which can assist them in shaping their attack strategies or uncovering useful information for further exploitation. The objectives of such activities generally involve reconnaissance to identify vulnerabilities or to plan privilege escalation paths.

  Relevant MITRE ATT&CK tactics associated with this behavior include **Discovery** (TA0007) and the specific technique **System Information Discovery** (T1082). System Information Discovery is a critical step in the attack lifecycle, as it allows attackers to understand the environment they are operating in, leading to more successful exploitation of the target.

  Primary telemetry sources for effective detection encompass **auditd logs**, which capture the execution of system commands, as well as **process creation events** that reveal details about command-line arguments and executed binaries. By monitoring these sources, security teams can gain insights into potential unauthorized activities within their Linux environments.

  ### Investigation Steps
  - **Review Audit Logs:** Examine auditd logs for entries related to the commands defined in the detection logic, including `uname`, `uptime`, and commands accessing `/etc/lsb-release` or `/etc/redhat-release`.

  - **Analyze Process Creation Events:** Investigate any suspicious process creation logs that might indicate the execution of reconnaissance commands, especially those executed with unusual user privileges or from atypical locations.

  - **Inspect User Activity:** Check the history of commands for user sessions from which the discovery commands were executed, ensuring that they align with expected patterns of administrative actions.

  - **Correlate with Known Tactics:** Cross-reference any identified activities with known Advanced Persistent Threat (APT) behaviors or other threat intelligence to determine if the discovery commands are indicative of a broader attack pattern.

  ### Prioritization
  The alert is assigned a low severity due to the nature of system information discovery, which can be a common administrative task but can also indicate initial reconnaissance by an adversary. While the likelihood of exploitation may be lower, repeated instances or patterns involving privilege escalation should be prioritized for further review.

  ### Blind Spots and Assumptions
  This detection rule may have coverage gaps, particularly in environments where auditd is not set up or where command execution is improperly logged. The detection logic assumes that system information discovery commands will be executed in detectable contexts and may miss commands executed in non-standard ways or by malicious actors exploiting other native commands. Additionally, proper auditd configurations and log retention policies must be in place to ensure effective monitoring and incident response capabilities.

