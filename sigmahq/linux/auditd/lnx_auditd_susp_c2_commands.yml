title: Suspicious C2 Activities
id: f7158a64-6204-4d6d-868a-6e6378b467e0
status: test
description: |
  Detects suspicious activities as declared by Florian Roth in its 'Best Practice Auditd Configuration'.
  This includes the detection of the following commands; wget, curl, base64, nc, netcat, ncat, ssh, socat, wireshark, rawshark, rdesktop, nmap.
  These commands match a few techniques from the tactics "Command and Control", including not exhaustively the following; Application Layer Protocol (T1071), Non-Application Layer Protocol (T1095), Data Encoding (T1132)
references:
- https://github.com/Neo23x0/auditd
author: Marie Euler
date: 2020-05-18
modified: 2021-11-27
tags:
- attack.command-and-control
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -w /usr/bin/wget -p x -k susp_activity
    -w /usr/bin/curl -p x -k susp_activity
    -w /usr/bin/base64 -p x -k susp_activity
    -w /bin/nc -p x -k susp_activity
    -w /bin/netcat -p x -k susp_activity
    -w /usr/bin/ncat -p x -k susp_activity
    -w /usr/bin/ss -p x -k susp_activity
    -w /usr/bin/netstat -p x -k susp_activity
    -w /usr/bin/ssh -p x -k susp_activity
    -w /usr/bin/scp -p x -k susp_activity
    -w /usr/bin/sftp -p x -k susp_activity
    -w /usr/bin/ftp -p x -k susp_activity
    -w /usr/bin/socat -p x -k susp_activity
    -w /usr/bin/wireshark -p x -k susp_activity
    -w /usr/bin/tshark -p x -k susp_activity
    -w /usr/bin/rawshark -p x -k susp_activity
    -w /usr/bin/rdesktop -p x -k susp_activity
    -w /usr/local/bin/rdesktop -p x -k susp_activity
    -w /usr/bin/wlfreerdp -p x -k susp_activity
    -w /usr/bin/xfreerdp -p x -k susp_activity
    -w /usr/local/bin/xfreerdp -p x -k susp_activity
    -w /usr/bin/nmap -p x -k susp_activity
    (via https://github.com/Neo23x0/auditd/blob/ddf2603dbc985f97538d102f13b4e4446b402bae/audit.rules#L336)
detection:
  selection:
    key: 'susp_activity'
  condition: selection
falsepositives:
- Admin or User activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious command and control (C2) activities through monitoring specific Linux commands commonly utilized by attackers. The commands in question include wget, curl, base64 encoding tools, network utilities such as netcat, and various other tools that can facilitate communication with external servers or exfiltrate data. The detection logic is rooted in the analysis outlined by Florian Roth in the 'Best Practice Auditd Configuration,' suggesting these commands are often leveraged during both the establishment and execution stages of a C2 framework.

  The threat scenario revolves around an attacker attempting to communicate with compromised systems or transfer malicious payloads using the identified commands, thus aiming to gain persistent control over the environment. The primary attacker objective includes data exfiltration, network reconnaissance, or further infiltration within the network using protocols that can bypass traditional defenses. This aligns with MITRE ATT&CK tactics such as **Command and Control** (TA0011), specifically techniques like **Application Layer Protocol** (T1071), **Non-Application Layer Protocol** (T1095), and **Data Encoding** (T1132).

  To facilitate this detection, the log source utilized is the Linux audit daemon (auditd), which captures the execution of the specified commands, providing critical evidence of abnormal behavior that requires further investigation.

  ### Investigation Steps
  - **Review Audit Logs**: Analyze the auditd logs for entries tagged with `susp_activity`. Focus on timestamps, user accounts, and specific commands executed to determine the context of the activity.

  - **Correlate with Network Traffic**: Examine network traffic logs for connections initiated by suspicious commands (e.g., outgoing HTTP/S requests from wget or curl). Look for abnormal outbound connections, especially to known malicious IP addresses or domains.

  - **Analyze Process Creation Events**: Investigate the process creation logs around the times of the suspicious command execution. Pay attention to parent-child relationships between processes that may indicate an escalation of privileges or lateral movement.

  - **Identify User Context**: Determine whether the commands were executed by legitimate users or service accounts. Cross-reference user activity with system role and privilege levels to identify any anomalies that may suggest unauthorized behavior.

  ### Prioritization
  This alert is deemed medium priority due to the potential impact of C2 activities on system integrity and data security. Given that the utilization of these commands may indicate a compromise, timely investigation is essential to mitigate the risk of data loss or further exploitation.

  ### Blind Spots and Assumptions
  The detection logic may not capture all malicious activities, as legitimate administrative tasks may invoke the same commands. Additionally, there is an assumption that all relevant auditd logging configurations are properly implemented and maintained. Should any logs be absent or misconfigured, the detection might fail to capture critical events, resulting in undetected suspicious activities. Comprehensive monitoring and logging capabilities are essential to fully utilize this detection rule effectively.

