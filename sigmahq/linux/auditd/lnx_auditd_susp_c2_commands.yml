title: Suspicious C2 Activities
id: f7158a64-6204-4d6d-868a-6e6378b467e0
status: test
description: |
  Detects suspicious activities as declared by Florian Roth in its 'Best Practice Auditd Configuration'.
  This includes the detection of the following commands; wget, curl, base64, nc, netcat, ncat, ssh, socat, wireshark, rawshark, rdesktop, nmap.
  These commands match a few techniques from the tactics "Command and Control", including not exhaustively the following; Application Layer Protocol (T1071), Non-Application Layer Protocol (T1095), Data Encoding (T1132)
references:
- https://github.com/Neo23x0/auditd
author: Marie Euler
date: 2020-05-18
modified: 2021-11-27
tags:
- attack.command-and-control
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -w /usr/bin/wget -p x -k susp_activity
    -w /usr/bin/curl -p x -k susp_activity
    -w /usr/bin/base64 -p x -k susp_activity
    -w /bin/nc -p x -k susp_activity
    -w /bin/netcat -p x -k susp_activity
    -w /usr/bin/ncat -p x -k susp_activity
    -w /usr/bin/ss -p x -k susp_activity
    -w /usr/bin/netstat -p x -k susp_activity
    -w /usr/bin/ssh -p x -k susp_activity
    -w /usr/bin/scp -p x -k susp_activity
    -w /usr/bin/sftp -p x -k susp_activity
    -w /usr/bin/ftp -p x -k susp_activity
    -w /usr/bin/socat -p x -k susp_activity
    -w /usr/bin/wireshark -p x -k susp_activity
    -w /usr/bin/tshark -p x -k susp_activity
    -w /usr/bin/rawshark -p x -k susp_activity
    -w /usr/bin/rdesktop -p x -k susp_activity
    -w /usr/local/bin/rdesktop -p x -k susp_activity
    -w /usr/bin/wlfreerdp -p x -k susp_activity
    -w /usr/bin/xfreerdp -p x -k susp_activity
    -w /usr/local/bin/xfreerdp -p x -k susp_activity
    -w /usr/bin/nmap -p x -k susp_activity
    (via https://github.com/Neo23x0/auditd/blob/ddf2603dbc985f97538d102f13b4e4446b402bae/audit.rules#L336)
detection:
  selection:
    key: 'susp_activity'
  condition: selection
falsepositives:
- Admin or User activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the execution of potentially suspicious commands often utilized in command-and-control (C2) operations, such as `wget`, `curl`, and `nc`. Attackers may aim to exfiltrate data or establish reverse shells, leveraging these tools to communicate with external servers. This behavior maps to the MITRE ATT&CK tactics of "Command and Control" (TA0011) with relevant techniques including Application Layer Protocol (T1071) and Non-Application Layer Protocol (T1095).

  The primary telemetry source is Linux auditd logs, specifically monitoring for the execution of pre-defined binaries that could indicate malicious C2 activities. The security impact can be significant, potentially leading to data exfiltration or persistent access by an attacker. However, this detection does NOT confirm malicious intent on its own; legitimate administrative tasks may trigger similar alerts.

  ### Investigation Steps

  - **Check for command execution**: Review auditd logs for Event ID of executed commands related to the following binaries: `wget`, `curl`, `nc`, `ssh`, `nmap`, etc. Look for entries with the keyword `susp_activity` in the `key` field.

  - **Validate context of execution**: Identify which user executed the command and the timing. Legitimate system or administrative tasks may involve these commands, particularly when run by known system administrators on schedule or during maintenance windows.

  - **Analyze network connections**: Cross-reference the executed commands with network logs (e.g., `tcpdump`, `netstat`, or firewall logs) to identify any outbound connections made by the processes. Look specifically for connections to IPs that are not part of the expected environment or are geolocated in high-risk regions.

  - **Identify unusual command parameters**: Review the command arguments in the audit logs for flags typically associated with malicious activity (e.g., `curl -O` to download potentially harmful payloads, or `nc -e` for reverse shells).

  - **Look for repeat occurrences**: Check if there are multiple instances of the suspicious commands executed in a short time frame. Frequent executions can indicate an automated or scripted attack stage.

  - **Correlate with incident reports**: Refer to any active incident reports detailing ongoing threats that may employ these tools. If the activity overlaps with current threat intelligence, it may elevate the suspicion.

  ### Prioritization

  This alert is medium severity due to the potential for significant impact from unauthorized data exfiltration or unauthorized access to critical systems. The likelihood of malicious abuse is moderate, particularly since these tools are commonly weaponized and used for legitimate maintenance purposes, necessitating careful validation during the investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential use of alternative or less common tools that achieve similar objectives but aren't covered in the monitored binaries. Some legitimate administrative activities, such as system backups or troubleshooting, may trigger this alert. Additionally, the alert could benefit from supplementary detections based on network traffic patterns or changes, such as unusual remote access attempts or connections to previously unseen domains, enhancing overall coverage.

