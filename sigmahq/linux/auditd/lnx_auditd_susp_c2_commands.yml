title: Suspicious C2 Activities
id: f7158a64-6204-4d6d-868a-6e6378b467e0
status: test
description: |
  Detects suspicious activities as declared by Florian Roth in its 'Best Practice Auditd Configuration'.
  This includes the detection of the following commands; wget, curl, base64, nc, netcat, ncat, ssh, socat, wireshark, rawshark, rdesktop, nmap.
  These commands match a few techniques from the tactics "Command and Control", including not exhaustively the following; Application Layer Protocol (T1071), Non-Application Layer Protocol (T1095), Data Encoding (T1132)
references:
- https://github.com/Neo23x0/auditd
author: Marie Euler
date: 2020-05-18
modified: 2021-11-27
tags:
- attack.command-and-control
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -w /usr/bin/wget -p x -k susp_activity
    -w /usr/bin/curl -p x -k susp_activity
    -w /usr/bin/base64 -p x -k susp_activity
    -w /bin/nc -p x -k susp_activity
    -w /bin/netcat -p x -k susp_activity
    -w /usr/bin/ncat -p x -k susp_activity
    -w /usr/bin/ss -p x -k susp_activity
    -w /usr/bin/netstat -p x -k susp_activity
    -w /usr/bin/ssh -p x -k susp_activity
    -w /usr/bin/scp -p x -k susp_activity
    -w /usr/bin/sftp -p x -k susp_activity
    -w /usr/bin/ftp -p x -k susp_activity
    -w /usr/bin/socat -p x -k susp_activity
    -w /usr/bin/wireshark -p x -k susp_activity
    -w /usr/bin/tshark -p x -k susp_activity
    -w /usr/bin/rawshark -p x -k susp_activity
    -w /usr/bin/rdesktop -p x -k susp_activity
    -w /usr/local/bin/rdesktop -p x -k susp_activity
    -w /usr/bin/wlfreerdp -p x -k susp_activity
    -w /usr/bin/xfreerdp -p x -k susp_activity
    -w /usr/local/bin/xfreerdp -p x -k susp_activity
    -w /usr/bin/nmap -p x -k susp_activity
    (via https://github.com/Neo23x0/auditd/blob/ddf2603dbc985f97538d102f13b4e4446b402bae/audit.rules#L336)
detection:
  selection:
    key: 'susp_activity'
  condition: selection
falsepositives:
- Admin or User activity
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the execution of several commands associated with potential Command and Control (C2) activities, such as `wget`, `curl`, `ssh`, and `nmap`, as defined in best practices for Linux audit configurations. The likely attacker objective behind these commands could involve establishing remote connections, exfiltrating data, or performing reconnaissance on the local network. The relevant MITRE ATT&CK techniques include Application Layer Protocol (T1071), Non-Application Layer Protocol (T1095), and Data Encoding (T1132).

  The primary telemetry source for this detection is the auditd logs from Linux systems, specifically monitoring executed command events related to these tools. If used maliciously, these actions could lead to unauthorized data access or system compromise. This detection does NOT confirm malicious intent on its own, as these commands can also be utilized for legitimate administrative tasks.

  ---

  ### Investigation Steps

  - **Check executed commands in audit logs**: Search for entries in `/var/log/audit/audit.log` corresponding to commands like `wget`, `curl`, `ssh`, etc. Investigate Event IDs 1300-1305 for specific audit events showing command execution.

  - **Identify user context and command origin**: Determine the user who executed the commands by reviewing the fields `uid`, `pid`, and `exe` in the audit logs. Compare this against legitimate admin user activities typical in your environment.

  - **Assess frequency and patterns of execution**: Analyze if the detected commands appear in rapid succession or in unusual combinations that deviate from normal operational patterns. Look for unusual flags or options used with these commands that may indicate suspicious use.

  - **Validate expected legitimate behavior**: Compare findings against established baselines for user activity. For example, the `curl` command used to fetch software updates is expected behavior, while its use in conjunction with `base64` might indicate an attempt to obfuscate data.

  - **Correlate with network activity**: Cross-reference the detected command executions with network logs to identify any external connections established during the execution, especially those involving non-standard ports. Utilize firewall logs or network intrusion detection system (NIDS) data for this analysis.

  - **Look for scheduled executions**: Investigate the presence of any cron jobs or scheduled tasks that could automate the execution of these commands, which could indicate persistence mechanisms used by an attacker.

  ---

  ### Prioritization

  This alert is classified as medium severity due to the potential impact of the commands on critical systems and the likelihood that they might be weaponized for C2 activities. While not all occurrences indicate malicious use, understanding context is essential for effective prioritization and incident response.

  ---

  ### Blind Spots and Assumptions

  This detection may miss commands that are aliased or executed through scripts that obfuscate the command name, reducing visibility into malicious activity. Reliable detection requires proper auditd configuration and comprehensive logging of user command execution. Legitimate administrative activity can trigger these alerts, such as authorized use of `ssh` for system management or `nmap` for network diagnostics. A related detection to help strengthen coverage could involve monitoring network connections initiated by these processes using netstat or similar logs.

