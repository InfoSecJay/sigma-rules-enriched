title: Linux Keylogging with Pam.d
id: 49aae26c-450e-448b-911d-b3c13d178dfc
status: test
description: Detect attempt to enable auditing of TTY input
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.001/T1056.001.md
- https://linux.die.net/man/8/pam_tty_audit
- https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/6/html/security_guide/sec-configuring_pam_for_auditing
- https://access.redhat.com/articles/4409591#audit-record-types-2
author: 'Pawel Mazur'
date: 2021-05-24
modified: 2022-12-18
tags:
- attack.collection
- attack.credential-access
- attack.t1003
- attack.t1056.001
logsource:
  product: linux
  service: auditd
detection:
  selection_path_events:
    type: PATH
    name:
    - '/etc/pam.d/system-auth'
    - '/etc/pam.d/password-auth'
  selection_tty_events:
    type:
    - 'TTY'
    - 'USER_TTY'
  condition: 1 of selection_*
falsepositives:
- Administrative work
level: high
note: |
  ### Technical Context
  This rule detects attempts to enable auditing of TTY (teletypewriter) input on Linux systems through modifications in the PAM (Pluggable Authentication Module) configuration files. When an attacker seeks to log user input, they may target these configurations to capture sensitive information like passwords or commands. By leveraging PAM to facilitate keylogging, the attacker can gather credentials without arousing immediate suspicion.

  The primary threat scenario involves an adversary attempting to collect user login information or sensitive commands by manipulating system auth settings, potentially for later misuse in credential theft or system compromise. These tactics align with the MITRE ATT&CK framework, specifically under the collections category (T1056.001: Input Capture - Keylogging) and credential access (T1003: Credential Dumping).

  The best data sources to investigate this behavior include auditd logs, which capture PAM-related events, as well as file integrity monitoring logs for alterations made to specific PAM configuration files—typically located in `/etc/pam.d/`. These logs provide visibility into unauthorized changes associated with TTY input auditing.

  ### Investigation Steps
  - **Review PAM Configuration Logs:** Examine logs from auditd for any changes made to `/etc/pam.d/system-auth` or `/etc/pam.d/password-auth` files, looking for suspicious modifications that may indicate an attempt to enable TTY input logging.
  - **Analyze User Activity on TTY:** Check for abnormal behavior on TTY by reviewing session logs for interactive user sessions during which the PAM configurations were modified. Look for unusual command usage or sessions initiated during odd hours.
  - **Correlate with Other Events:** Correlate the detection with other security events, such as failed login attempts or privilege escalations, to assess whether there’s a broader attack pattern at play.
  - **Verify with File Integrity Monitoring:** If available, utilize file integrity monitoring tools to validate unauthorized changes to configuration files, ensuring any modifications are legitimate and approved by administrative policies.

  ### Prioritization
  This alert is categorized as high severity because enabling TTY input logging may lead to the compromise of sensitive user credentials and commands. The likelihood of an attacker actively seeking to deploy such measures to gain an advantage in a compromised environment is a significant concern.

  ### Blind Spots and Assumptions
  The effectiveness of this detection rule may be limited by the absence of comprehensive audit logging configurations. If auditd is not properly set up to monitor PAM-related events or if PAM logging is disabled, potential attacks may go unnoticed. The detection logic presumes that modifications to PAM configurations will trigger events captured by auditd, relying on continuous logging of such activities to function correctly. Missing any necessary logging configurations or not monitoring the appropriate files could result in gaps in detection.

