logsource:
  product: linux
  service: auditd
detection:
  selection_path_events:
    type: PATH
    name:
    - '/etc/pam.d/system-auth'
    - '/etc/pam.d/password-auth'
  selection_tty_events:
    type:
    - 'TTY'
    - 'USER_TTY'
  condition: 1 of selection_*
falsepositives:
- Administrative work
level: high
note: |
  ### Technical Context

  This detection identifies attempts to enable auditing of TTY (teletypewriter) input on Linux systems via PAM (Pluggable Authentication Modules). An attacker may target this to log users' keystrokes, potentially capturing sensitive information like passwords. This behavior corresponds to the MITRE ATT&CK technique for credential access via keylogging (T1056.001) and falls under the tactics of Collection (TA0043) and Credential Access (TA0006). The primary telemetry source is the Linux audit log (auditd), specifically tracking changes to PAM configuration files such as `/etc/pam.d/system-auth` or `/etc/pam.d/password-auth`. If successful, it can compromise user accounts and sensitive data. Importantly, this detection does not confirm that keylogging is actively capturing data; it only indicates potential tampering with audit capabilities.

  ### Investigation Steps

  - **Review PAM configuration changes:** Check for any recent modifications in `/etc/pam.d/system-auth` and `/etc/pam.d/password-auth`. Use `auditd` logs (Event ID: 1103) to identify the timestamp, user, and process involved in the change. Benign changes may include authorized updates by system administrators.

  - **Analyze audit log for TTY events:** Query audit logs (`/var/log/audit/audit.log`) for events related to TTY input capturing, specifically looking for records indicating path alterations (type: PATH) and user TTY interactions (type: USER_TTY). Malicious attempts will show unusual modification patterns with unfamiliar user processes.

  - **Cross-reference with user activity:** Verify user login history from `/var/log/secure` or `/var/log/auth.log` for any suspicious login attempts or unauthorized access coinciding with TTY auditing configurations. Legitimate activity typically shows expected user logins without unusual patterns.

  - **Investigate existing keyloggers:** Search processes using `ps -ef` for any known keylogger binaries or scripts that may have been dropped post-configuration changes. Filter for unknown or unusual executables run by non-system users.

  - **Assess system permissions:** Review the permissions of PAM configuration files using `ls -l`. Tight permissions indicate expected administrator control, whereas weak permissions may suggest improper exposure to standard users, enabling potential tampering.

  ### Prioritization

  This alert warrants high priority due to its potential impact on any Linux server's security posture. If malicious, enabling TTY auditing can lead to credential theft and breach of confidential information. While such activities are not common across typical environments, they do reflect an evolving threat landscape and can signal more extensive campaigns in play.

  ### Blind Spots and Assumptions

  Detection may be evaded by disguising keylogging behaviors or modifying audit configurations in a non-obvious manner. Reliable detection requires that auditd be properly configured and logging appropriately. Legitimate administrative work, especially during system updates or configuration changes, may trigger the alert. The detection can be complemented by monitoring file integrity on PAM configuration files and searching for known keylogging artifacts or tools that could signify fully realized exploits.

