title: Potential Abuse of Linux Magic System Request Key
id: ea61bb82-a5e0-42e6-8537-91d29500f1b9
status: experimental
description: |
  Detects the potential abuse of the Linux Magic SysRq (System Request) key by adversaries with root or sufficient privileges
  to silently manipulate or destabilize a system. By writing to /proc/sysrq-trigger, they can crash the system, kill processes,
  or disrupt forensic analysis—all while bypassing standard logging. Though intended for recovery and debugging, SysRq can be
  misused as a stealthy post-exploitation tool. It is controlled via /proc/sys/kernel/sysrq or permanently through /etc/sysctl.conf.
references:
- https://www.kernel.org/doc/html/v4.10/_sources/admin-guide/sysrq.txt
- https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/4/html/reference_guide/s3-proc-sys-kernel
- https://www.splunk.com/en_us/blog/security/threat-update-awfulshred-script-wiper.html
author: Milad Cheraghi
date: 2025-05-23
tags:
- attack.execution
- attack.t1059.004
- attack.impact
- attack.t1529
- attack.t1489
- attack.t1499
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -w /proc/sysrq-trigger -p wa -k sysrq
    -w /proc/sys/kernel/sysrq -p wa -k sysrq
detection:
  selection:
    type: 'PATH'
    name|endswith:
            # Enable
    - '/sysrq'
    - '/sysctl.conf'
            # Execute
    - '/sysrq-trigger'
  condition: selection
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context
  This detection rule identifies the potential misuse of the Linux Magic System Request (SysRq) key by adversaries who have acquired root or elevated privileges. By writing to `/proc/sysrq-trigger`, attackers can perform dangerous operations such as crashing the system, terminating critical processes, or impeding forensic investigations. This abuse can be especially concerning, as it allows adversaries to execute harmful actions stealthily while avoiding detection through normal logging mechanisms. The SysRq key is generally intended for system recovery and debugging but can become a tool for post-exploitation activities when utilized maliciously.

  The relevant MITRE ATT&CK techniques include **System Information Discovery (T1082)**, as attackers may utilize this capability to gather data on the system’s state prior to or during an attack, and **Impact (T1489)** since they may aim to disrupt or disable services. By understanding these tactics and techniques, security analysts can better assess potential threats associated with unauthorized use of the SysRq functionality. The primary data sources for this detection rely on kernel audit logs produced by the `auditd` service, specifically monitoring access to files like `/proc/sysrq-trigger` and `/proc/sys/kernel/sysrq`.

  ### Investigation Steps
  - **Review Audit Logs:** Check the audit logs configured to monitor `/proc/sysrq-trigger` and `/proc/sys/kernel/sysrq` for any write actions related to the SysRq functionality, focusing on times that correlate with suspicious activity on the system.
  - **Analyze Process History:** Investigate the command history and processes executed by users with elevated privileges to identify any unauthorized commands that might indicate SysRq key misuse.
  - **Check for Unusual Activity:** Correlate the identified SysRq operations with other logs (e.g., system logs, application logs) to look for context about what was happening on the system at the time of usage, including any unusual or unauthorized account access.
  - **Validate User Privileges:** Verify the legitimacy of users who have executed SysRq commands. Ensure that those accounts should have been granted such access and investigate any discrepancies or anomalies in user permissions.

  ### Prioritization
  This alert is categorized with medium severity due to the potential impact of an escalated privilege misuse leading to system disruption or data loss, which can significantly affect enterprise operations. The likelihood is considered elevated, especially in environments where tight control over root privileges is not enforced.

  ### Blind Spots and Assumptions
  The detection logic assumes that all privilege escalation paths have been properly secured, and there may be gaps in coverage if audit logs are not adequately configured across all relevant systems. Additionally, legitimate administrative activities that interact with the SysRq functionality might trigger false positives, indicating that the context of each alert must be carefully evaluated. For this alert to function effectively, appropriate auditd configurations must be in place to monitor the relevant SysRq paths.

