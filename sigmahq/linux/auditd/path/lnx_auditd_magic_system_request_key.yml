title: Potential Abuse of Linux Magic System Request Key
id: ea61bb82-a5e0-42e6-8537-91d29500f1b9
status: experimental
description: |
  Detects the potential abuse of the Linux Magic SysRq (System Request) key by adversaries with root or sufficient privileges
  to silently manipulate or destabilize a system. By writing to /proc/sysrq-trigger, they can crash the system, kill processes,
  or disrupt forensic analysis—all while bypassing standard logging. Though intended for recovery and debugging, SysRq can be
  misused as a stealthy post-exploitation tool. It is controlled via /proc/sys/kernel/sysrq or permanently through /etc/sysctl.conf.
references:
- https://www.kernel.org/doc/html/v4.10/_sources/admin-guide/sysrq.txt
- https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/4/html/reference_guide/s3-proc-sys-kernel
- https://www.splunk.com/en_us/blog/security/threat-update-awfulshred-script-wiper.html
author: Milad Cheraghi
date: 2025-05-23
tags:
- attack.execution
- attack.t1059.004
- attack.impact
- attack.t1529
- attack.t1489
- attack.t1499
logsource:
  product: linux
  service: auditd
  definition: |
    Required auditd configuration:
    -w /proc/sysrq-trigger -p wa -k sysrq
    -w /proc/sys/kernel/sysrq -p wa -k sysrq
detection:
  selection:
    type: 'PATH'
    name|endswith:
            # Enable
    - '/sysrq'
    - '/sysctl.conf'
            # Execute
    - '/sysrq-trigger'
  condition: selection
falsepositives:
- Legitimate administrative activity
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to manipulate the Linux system using the Magic SysRq key functionality, which allows users with root or sufficient privileges to interact with kernel-level processes. An attacker may seek to crash the system or kill essential processes to erase traces of their activity, disrupt forensic analysis, or achieve denial of service. This behavior falls under the MITRE ATT&CK tactics of Execution (T1203) and Impact (T1499).

  The primary telemetry sources for this detection are audit logs generated by auditd, specifically monitoring for changes to the `/proc/sysrq-trigger` and `/proc/sys/kernel/sysrq` files. If this behavior is malicious, the impact could lead to system instability, data loss, or hindered investigation efforts. This detection does NOT confirm that malicious activity has occurred, as legitimate administrative tasks may also invoke these actions.

  ### Investigation Steps

  - **Verify the originating user context:** Check audit logs for Event ID related to `/proc/sysrq-trigger` and `/proc/sys/kernel/sysrq` alterations, ensuring the user has proper root access. Review fields such as user ID and user name to distinguish between expected administrative actions versus unauthorized activity.

  - **Review recent changes to configuration files:** Examine entries in the `/etc/sysctl.conf` and related configuration files for modifications. Look for suspicious changes, particularly recent or unexpected updates that could indicate malicious intent.

  - **Cross-reference with standard operational tasks:** Identify if the detected behavior aligns with legitimate use cases of the SysRq functionality, such as system recovery or debugging by authorized personnel. Compare timestamps and user actions to confirm if they correlate with scheduled maintenance windows or response actions.

  - **Analyze potential system impact:** Determine any system processes that may have been terminated or affected as a result of this action. Investigate logs for killed processes or unusual system reboots, particularly if they coincide with the SysRq triggers.

  - **Check for other indicators of compromise:** Look for related alerts or behaviors, such as unauthorized access attempts, unexpected reboots, or unusual load patterns on systems that could indicate broader exploitation efforts.

  ### Prioritization

  This alert has a medium severity level due to the potential for significant security impacts on critical systems running Linux, where manipulation of system requests can lead to service disruption or data loss. Although weaponized behavior using the SysRq key is less common, it's crucial to evaluate the likelihood of exposure based on the system's purpose and configuration.

  ### Blind Spots and Assumptions

  The detection relies on the proper configuration of auditd to ensure visibility into SysRq interactions. Adversaries might attempt to obfuscate their actions by clearing logs or altering configurations to hide their use of the SysRq functionality. Legitimate administrative activities, such as system maintenance or testing, may inadvertently trigger this alert. Companion detections like monitoring for unusual user or process behavior (e.g., Sysmon logs for unexpected command executions) can enhance detection coverage.

