logsource:
  product: linux
  service: auditd
detection:
  path:
    type: 'PATH'
    nametype: 'CREATE'
  name_1:
    name|startswith:
    - '/usr/lib/systemd/system/'
    - '/etc/systemd/system/'
  name_2:
    name|contains: '/.config/systemd/user/'
  condition: path and 1 of name_*
falsepositives:
- Admin work like legit service installs.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the creation of systemd service files, specifically those that reside in directories typically used for service management in Linux systems, such as `/usr/lib/systemd/system/` and `/etc/systemd/system/`. The likely attacker objective is to establish persistence by creating a service that executes malicious code whenever the system starts or the service is triggered. This behavior aligns with the MITRE ATT&CK technique T1543.002 (Create or Modify System Process: Systemd Service).

  The primary telemetry source for this detection is audit logs generated by `auditd`, which should specifically include events associated with the creation of files in these critical directories. If malicious, the presence of these service files can lead to unauthorized code execution and long-term compromise of the system. Notably, this detection does NOT confirm malicious activity by itself, as legitimate administrative tasks, such as system updates or application installations, may result in similar service file creations.

  ---

  ### Investigation Steps

  - **Identify the event of service creation:** Review auditd logs for Event ID 2740, noting any service file creation actions in `/usr/lib/systemd/system/`, `/etc/systemd/system/`, or `/.config/systemd/user/`. Malicious activity often shows unusual filenames not following organizational naming conventions.

  - **Examine the service content:** For any newly created service files, inspect their contents (`/usr/lib/systemd/system/<service>.service`) for suspicious commands or scripts that execute on startup. Look for executable paths that are unusual for your environment (e.g., `/tmp/malicious_script`).

  - **Determine ownership and permissions:** Check the ownership and permissions of created service files using `ls -l`. Legitimate service files should typically belong to root (`root:root`). Any files owned by unexpected users may indicate malicious intent.

  - **Review the systemd logs:** Analyze systemd logs (`journalctl -u <service>`) to confirm if the newly created service has been started or triggered. Frequent restart attempts or failures may suggest malicious activity attempting to maintain persistence.

  - **Correlate with recent system changes:** Review other `auditd` logs or system logs for recent changes or installations occurring around the same time as the service creation. Significant discrepancies between admin actions and service file creation timestamps may indicate suspicious behavior.

  - **Cross-reference with known compromise indicators:** Utilize threat intelligence feeds to check if any newly created services match indicators of compromise associated with known malware or attack scenarios.

  ---

  ### Prioritization

  This alert should be treated with medium priority as the impact of unauthorized service creation can lead to significant security risks, especially on critical systems. The likelihood of exploitation is moderate; while some benign cases exist, this behavior has a history of being weaponized in various attack campaigns.

  ---

  ### Blind Spots and Assumptions

  The detection may miss attempts to create services in non-standard directories or the manipulation of existing services without file creation (e.g., modifying existing service files). Ensuring that auditd is correctly configured to log all relevant actions is essential for reliable detection. Additionally, some legitimate administrative actions, such as system updates or configurations by DevOps personnel, may trigger this alert. A related detection to consider is monitoring for the execution of commands within these created services, as it provides stronger evidence of malicious activity.

