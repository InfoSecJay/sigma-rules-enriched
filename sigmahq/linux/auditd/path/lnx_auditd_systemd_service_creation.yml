title: Systemd Service Creation
id: 1bac86ba-41aa-4f62-9d6b-405eac99b485
status: test
description: Detects a creation of systemd services which could be used by 
  adversaries to execute malicious code.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.002/T1543.002.md
author: 'Pawel Mazur'
date: 2022-02-03
modified: 2022-02-06
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.002
logsource:
  product: linux
  service: auditd
detection:
  path:
    type: 'PATH'
    nametype: 'CREATE'
  name_1:
    name|startswith:
    - '/usr/lib/systemd/system/'
    - '/etc/systemd/system/'
  name_2:
    name|contains: '/.config/systemd/user/'
  condition: path and 1 of name_*
falsepositives:
- Admin work like legit service installs.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of systemd services, potentially signifying an attempt to establish persistence or elevate privileges by an attacker. The objective could include maintaining access or executing malicious payloads in a Linux environment. This behavior aligns with the MITRE ATT&CK technique for "Create or Modify System Process" (T1543.002) under the Persistence tactic.

  The primary telemetry sources for this detection include Linux audit logs collected by `auditd` which document file creation events, specifically under systemd service directories. If the creation of such services is malicious, it could allow the adversary to execute arbitrary code with system privileges. However, this detection alone does not confirm malicious intent; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Review audit logs for service creation:** Search audit logs (Auditd Event ID 132) for entries with the path `/usr/lib/systemd/system/`, `/etc/systemd/system/`, or `/.config/systemd/user/`. Look for entries indicating new service files have been created.

  - **Check service execution history:** Utilize `systemctl status` or `journalctl` to review recent status updates of created services. Legitimate services should be associated with recognized applications or components.

  - **Analyze fileowner and permissions:** Assess the ownership and permissions of created service files. Any service file created with abnormal ownership (not associated with a standard admin user) or insecure permissions (e.g., writable by unprivileged users) increases the likelihood of malicious use.

  - **Cross-reference with known service names:** Verify the naming convention of new service files against a list of known good services. Use conditions like "service names ending in .service" for benign services.

  - **Monitor for subsequent process execution:** Identify any processes spawned by newly created services using `ps` commands or `pgrep` on the service name. Malicious indicators include processes that run from non-standard directories or binaries.

  ### Prioritization

  The alert should be categorized as medium severity. The impact of the affected system is significant, as systemd services can be leveraged for long-term persistence. Given that such behaviors can often be weaponized by adversaries, further investigation is warranted.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of logs if `auditd` is not properly configured to capture all relevant events or if log rotation occurs before investigation. Legitimate system updates or administrative tasks might also trigger these alerts, leading to false positives. A related detection could involve monitoring for unusual or unexpected changes in service statuses after creation, which would lend additional context to investigate potential malicious intent.

