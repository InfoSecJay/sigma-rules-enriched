title: Systemd Service Creation
id: 1bac86ba-41aa-4f62-9d6b-405eac99b485
status: test
description: Detects a creation of systemd services which could be used by adversaries
  to execute malicious code.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.002/T1543.002.md
author: 'Pawel Mazur'
date: 2022-02-03
modified: 2022-02-06
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1543.002
logsource:
  product: linux
  service: auditd
detection:
  path:
    type: 'PATH'
    nametype: 'CREATE'
  name_1:
    name|startswith:
    - '/usr/lib/systemd/system/'
    - '/etc/systemd/system/'
  name_2:
    name|contains: '/.config/systemd/user/'
  condition: path and 1 of name_*
falsepositives:
- Admin work like legit service installs.
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the creation of systemd services on Linux systems, which could be indicative of malicious activities. Adversaries may leverage the creation of systemd services to establish persistent backdoors, execute harmful code on system startup, or elevate permissions within an environment. By installing malicious services, attackers aim to maintain their presence on a compromised system, which aligns with common tactics for achieving long-term access and control over targeted infrastructure.

  The relevant MITRE ATT&CK techniques for this detection rule include:
  - **T1543.002: Create or Modify System Service** – This technique encompasses the malicious creation or modification of a service to establish persistence.
  - Associated tactics include **Persistence** and **Privilege Escalation**, which highlight the attacker's goal of maintaining long-term control and potentially gaining higher-level permissions within the target environment.

  Primary data sources that contain relevant evidence for this rule include:
  - **auditd logs**, which capture detailed information about system call events, including file creations and modifications.
  - Additionally, system logs may provide insight into service management operations that indicate legitimate administrative actions versus potentially malicious intent.

  ### Investigation Steps
  - **Review audit logs:** Examine the auditd logs for entries related to the creation of files within `/usr/lib/systemd/system/`, `/etc/systemd/system/`, and the user directory `/.config/systemd/user/`. Look for anomalous timestamps or unexpected user accounts involved in these actions.

  - **Cross-reference features of services:** Investigate the newly created services for unusual configurations or references to files, scripts, or executables that are known to be associated with malicious activity. Compare these services with legitimate ones to assess their validity.

  - **Monitor service status:** Assess the status of the new services using commands like `systemctl status <service_name>`. Check for any that are active but unexpected or which use non-standard execution paths.

  - **Evaluate associated processes:** Determine if the created services trigger any processes upon startup and whether those processes exhibit suspicious behavior, such as creating outbound connections or connecting to known malicious IP addresses.

  ### Prioritization
  Given the potential for systemd services to be leveraged for persistence and privilege escalation, alerts generated by this detection rule should be considered medium to high priority. The risk lies in an attacker establishing a foothold within the environment, which could lead to greater compromise and data exfiltration.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage regarding legitimate administrative activities, as it might trigger for any service installations performed by system administrators. The logic assumes that newly created services are not part of routine updates or maintenance unless additional context indicates otherwise. It relies on the collection of auditd logs, necessitating correct configurations for auditd to capture the necessary syscall events associated with service creation on Linux systems. If logs are not properly collected or if auditing is disabled, detection efficacy could be significantly reduced.

