level: high
note: |
  ### Technical Context
  This rule is designed to detect changes made to the auditd configuration files on Linux hosts. The auditd service is critical for maintaining logging and auditing functionalities, and unauthorized alterations to its settings can indicate malicious intent by adversaries seeking to evade detection. Attackers may attempt to disable auditing or modify configurations to hide their activity during an intrusion.

  The underlying threat scenario involves an attacker adjusting audit rules to suppress logging of their actions, thereby evading detection mechanisms. This fits into the MITRE ATT&CK framework, specifically under the tactics of Defense Evasion (TA0005) and the technique T1562.006, which deals with disabling security tools and logs. By monitoring these configurations, organizations can gain insights into potential malicious behavior and respond accordingly.

  The primary data sources for this detection are logs generated by the Linux audit system, which include events related to changes in the auditd configuration files located in `/etc/audit/`, `/etc/libaudit.conf`, and `/etc/audisp/`. These logs can reveal when configuration changes are made, who made them, and the nature of the changes.

  ### Investigation Steps
  - **Review auditd Logs:** Examine audit logs from `/var/log/audit/audit.log` for any events corresponding to changes in the configuration files identified in the detection logic. Look for `syscall` events related to `open` or `write` operations on these files.

  - **Check User Activity:** Investigate the user accounts that performed the modifications to the configuration files. Determine if the actions were conducted by legitimate administrative users or if there are any indicators of compromised accounts.

  - **Analyze File Integrity:** Use file integrity monitoring tools to review historical changes to the auditd configuration files. Compare current configurations against baseline configurations to identify any unauthorized alterations.

  - **Conduct Endpoint Review:** Assess the Linux host for other indicators of compromise. This includes checking for unusual processes, network connections, or any other signs that might indicate the host is being used as a staging ground for further malicious activity.

  ### Prioritization
  This alert is classified as high severity due to its potential impact on the detection and response capabilities of the SOC. Alterations to auditd configurations can significantly hinder an organization's ability to monitor and log critical security events, enabling attackers to operate undetected.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the reliance on auditd being correctly configured and actively monitoring system changes. If the auditd service is turned off or misconfigured, these detection capabilities will not function. Additionally, the detection logic may assume that any unauthorized changes are malicious, though legitimate administrative actions can lead to false positives. Proper logging configurations and security policies must be in place to ensure accurate detection and response capabilities.

