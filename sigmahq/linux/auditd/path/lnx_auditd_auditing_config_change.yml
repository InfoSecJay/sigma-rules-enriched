  ---

  ### Technical Context

  This rule detects changes made to auditd configuration files on Linux hosts, specifically monitoring alterations in the directories and files within `/etc/audit/`, `/etc/libaudit.conf`, and `/etc/audisp/`. These behaviors may indicate an attacker's objective to evade detection by manipulating the auditing framework, which could allow malicious activities to go unnoticed. This aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.006).

  The primary telemetry sources for this detection are audit logs generated by the Linux audit daemon (auditd). If malicious, this could significantly impair the organization's ability to detect and respond to future attacks. The detection alone does NOT confirm malicious intent; it requires context to determine if the changes were legitimate administrative actions.

  ---

  ### Investigation Steps

  - **Review audit log for changes:** Check auditd logs for Event ID 1101 corresponding to the modification of `/etc/audit/audit.rules`, focusing on the `auid` and `pid` fields for user context.

  - **Identify the source of the change:** Investigate the change initiator by examining the `user_login` and `process_name` fields in the audit logs to determine if the change was made by an authorized administrator or an unexpected user.

  - **Validate legitimate administrative activity:** Confirm if the change aligns with scheduled maintenance or updates by checking change management records or looking for documented maintenance tasks during the timeframe in question.

  - **Check for subsequent auditd activity:** Look for any suspicious configurations in the same logs, like removal of rules (e.g., ‘-D’ commands) or reconfiguration that would suggest attempts to disable monitoring, indicating possible malicious intent.

  - **Cross-reference with system logs:** Correlate changes with system logs (e.g., `/var/log/messages`) and process details from Syslog or journald for abnormal behavior patterns or unauthorized access near the timestamp of the configuration change.

  ---

  ### Prioritization

  This alert is high-severity because the affected system plays a crucial role in security monitoring. Any malicious configuration change could undermine overall security posture and increase the risk of threats going undetected. The behavior is not commonly weaponized but could indicate preparation for a broader attack.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logging is not configured properly, or if legitimate administrative actions frequently alter configurations. There might be scenarios where authentic changes trigger this alert, such as routine updates or configuration tweaks by system admins. A related detection could be monitoring for unauthorized process creations (e.g., via Sysmon or process accounting) that may coincide with configuration changes, strengthening overall coverage.

