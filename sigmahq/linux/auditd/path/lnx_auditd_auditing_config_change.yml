note: |
  ### Technical Context

  This Sigma rule detects modifications to critical audit configuration files on Linux systems, specifically files located in `/etc/audit/`, `/etc/libaudit.conf`, and `/etc/audisp/`. The likely attacker objective is to alter audit settings to suppress logs or evade detection during post-exploitation actions. Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1562.006)**. The primary telemetry source is the Linux audit daemon (auditd), with the required log types focusing on audit logs that capture file changes. If malicious, this may indicate an attacker attempting to cover their tracks by altering logging behavior. Importantly, this detection does NOT confirm unauthorized access or compromises on its own; further investigation is required.

  ### Investigation Steps

  - **Check recent changes to audit configuration files**: Review audit logs (Event IDs: 1100) related to file access and modifications. Look for changes specifically in the mentioned paths. Frequent or unusual changes may indicate an active attacker.

  - **Verify the integrity of auditd configuration**: Assess the timing of changes against known administrative activities, such as planned maintenance schedules. Legitimate changes will often correlate with documented maintenance or configuration review activities.

  - **Identify who modified the files**: Investigate the user context by checking logs for commands (`auditctl`, `systemctl restart auditd`, etc.) executed around the time of the configuration file changes. Use `sudo` logs (/var/log/auth.log) or command history to identify administrative behavior.

  - **Cross-reference with system behavior**: Look for correlating anomalies in auditd logs post-modification that indicate suppressed logs (e.g., marked as 'untracked'), which could signify ongoing adversarial actions.

  - **Examine for evasion patterns**: Investigate file changes that deviate from typical operational norms. Patterns like repeated changes with no clear reasoning or excessive modifications to multiple files at once may indicate malicious intent.

  ### Prioritization

  This alert is high priority due to the potential impact on the integrity of the audit logging system, a critical control for detecting suspicious activities. The likelihood of malicious abuse is significant since attackers often manipulate such configurations to evade detection. Given that this behavior is commonly weaponized by threat actors seeking persistence and stealth, rapid investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if auditd is misconfigured. Certain legitimate administrative tasks, such as regular audits or compliance checks, can trigger this alert. A related detection that strengthens coverage could include monitoring for unauthorized changes to other security policies, like SELinux configurations.

