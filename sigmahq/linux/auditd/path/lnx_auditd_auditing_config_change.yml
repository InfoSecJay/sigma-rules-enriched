note: |
  ### Technical Context

  This Sigma rule detects changes in key auditd configuration files on Linux systems, specifically in `/etc/audit/*`, `/etc/libaudit.conf`, and `/etc/audisp/*`. Modifications to these files may indicate an attempt to disable or alter auditing configuration, with the objective of evading detection by security controls. This behavior aligns with the MITRE ATT&CK technique "Modify System Image" (T1685), which can be crucial for attackers seeking to impair defense mechanisms.

  The primary telemetry source for this detection is the auditd logs. Specifically, relevant log entries will indicate which configuration files were changed and the nature of those changes. If malicious, such modifications could lead to a significant security impact, effectively allowing an attacker to hide their actions. It's important to note that while this detection highlights changes in critical security configurations, it does NOT confirm malicious intent on its own, as legitimate administrative changes can occur.

  ### Investigation Steps

  - **Check auditd logs for changes:** Examine `/var/log/audit/audit.log` for entries related to the modified files (e.g., `path=/etc/audit/*`). Look for Event ID 1102 (audit configuration change) to confirm the nature of the modification.

  - **Identify administrator activity:** Review the user context associated with the file changes. Cross-reference the modifying user ID with expected administrative accounts to identify whether legitimate activity is being performed.

  - **Review system integrity:** Run `rpm -V audit` (or the equivalent for your package manager) to validate the integrity of auditd and associated packages, ensuring no unauthorized modifications have occurred beyond configuration files.

  - **Analyze baseline configurations:** Compare the modified configurations against a known good baseline. Inspect fields for common secure practices to see if any critical settings were altered.

  - **Look for recent system events:** Investigate any corresponding user session from `/var/log/secure` or `/var/log/auth.log` for unauthorized access attempts or suspicious administrative commands around the time of the configuration changes.

  - **Identify potential exfiltration:** Check if audit logs have been redirected or disabled, which could indicate an attempt to exfiltrate logs. Validate file creation or changes in `/var/log/audit` indicating file tampering.

  ### Prioritization

  This alert has high severity due to the critical role of auditd in maintaining system integrity and detection of malicious activities. The likelihood of malicious abuse is realistic, as attackers often manipulate configuration files to evade detection. Given the weaponization of this behavior, prompt investigation is essential.

  ### Blind Spots and Assumptions

  Detection may be limited if auditd is disabled or improperly configured, allowing changes to go unnoticed. Legitimate administrative activities, such as routine updates or configuration changes, can trigger this alert. A companion detection to strengthen coverage includes monitoring for unauthorized changes in system files with tools like AIDE or Tripwire.

