  ### Technical Context

  This detection identifies access to specific `.pid` and `.lock` files associated with the BPFDoor backdoor, which is highly evasive and commonly used in Linux environments. The likely attacker objective is to establish persistence or maintain control over compromised systems by manipulating these files. This behavior corresponds with MITRE ATT&CK tactics such as Execution (T1203) and Initial Access (T1059), particularly relevant for scripting languages used to exploit vulnerabilities.

  The primary telemetry source is Linux Audit logs, which capture file access events. Log types specifically include access to `/var/run/haldrund.pid`, `/var/run/xinetd.lock`, and `/var/run/kdevrund.pid`. If malicious, this behavior could indicate a serious compromise, leading to significant security impacts including data exfiltration and system control. This detection does NOT confirm successful exploitation or compromise on its own; rather, it indicates potential malicious activity that warrants further investigation.

  ---

  ### Investigation Steps

  - **Check Audit Logs for File Access:** Review Linux Audit logs (Event ID ausearch) for access events related to `/var/run/haldrund.pid`, `/var/run/xinetd.lock`, and `/var/run/kdevrund.pid`. Look for unusual read/write activity not consistent with normal operations.

  - **Analyze Process Creation:** Examine `ps` command outputs or Sysmon logs (if installed) for unusual processes running with the same user account as the one accessing the `.pid` or `.lock` files. Typical legitimate processes should not manipulate these files directly.

  - **Validate User Activities:** Cross-reference user activity logs for the account accessing these files. Legitimate administrative tasks often involve monitoring daemons, while access during odd hours or from unexpected locations may indicate malicious intent.

  - **Identify Network Connections:** Utilize netstat or similar command outputs to check for unusual network connections initiated by processes associated with the `.pid` and `.lock` file accesses. Malicious indicators include connections to known command-and-control IP addresses.

  - **Investigate System Changes:** Look for recent changes in system configurations or installations. Significant updates or changes in system behavior following file access could imply exploitation and should be correlated with further telemetry.

  ---

  ### Prioritization

  This alert is of high severity due to the critical nature of the assets potentially involved, as BPFDoor is often used to maintain access to sensitive systems. The likelihood of malicious abuse is significant given the known use of the method by attackers. Such behaviors are commonly weaponized, especially in environments lacking robust security controls.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by a lack of complete audit logging for all file access events, as only some distributions or configurations may capture detailed activities. Legitimate activities such as regular system maintenance by trusted processes could also trigger this alert—analysis must distinguish between normal operations and suspicious behavior. A companion detection for file creation or deletion within the same path would enhance overall coverage and provide context to the alerts.

