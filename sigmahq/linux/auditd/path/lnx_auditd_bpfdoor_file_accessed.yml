note: |
  ### Technical Context

  This Sigma rule detects unauthorized access to specific process ID (.pid) and lock files associated with the BPFDoor backdoor on Linux systems. The behavior indicates a potential compromise, as BPFDoor typically aims to maintain persistence and evade detection by modifying system files. This detection fits into the MITRE ATT&CK framework under the Execution tactic (T1106: Native API) and may be related to other techniques such as T1059 (Command and Scripting Interpreter). The primary telemetry source is the audit logs from the Linux audit daemon (auditd), specifically monitoring access to the targeted files in the '/var/run/' directory.

  If malicious, this behavior could compromise system integrity, facilitate unauthorized control, and potentially lead to further exploits or data exfiltration. However, this detection alone does not confirm the presence of the BPFDoor backdoor; it only indicates an abnormal access pattern to critical system files that may warrant further investigation.

  ### Investigation Steps

  - **Identify access events for specific files**: Review audit logs for access to the files '/var/run/*.pid' and '/var/run/*.lock'. Check for Event IDs related to file access (Linux audit log type) and look for unusual timestamps or user IDs that do not match expected operational patterns.

  - **Analyze user activity around the alert**: Examine command history for the user that accessed the files. Look for shell commands executed (`sudo` or `su`), especially around the time the alert was generated. Command history files typically reside in '/home/<username>/.bash_history'.

  - **Validate legitimate application behavior**: Confirm if any known applications commonly running on the host utilize or depend on the detected .pid or .lock files. For instance, database services or system daemons that might regularly write to these files can produce benign alerts.

  - **Correlate with network activity**: Look for outbound connections or suspicious network traffic from the affected host using tools such as netstat or packet capture logs. Particularly analyze connections on uncommon ports or patterns indicative of backdoor communication.

  - **Examine process list for anomalies**: Use `ps aux` or `top` commands to identify any suspicious processes running on the host at the time of the alert. Check if any of these processes have unusual parent-child relationships or are accessing non-standard directories.

  - **Identify the source of the activity**: Specifically check for high-confidence malicious indicators that align with known BPFDoor signatures or behaviors, such as attempts to spawn processes that involve the names of the detected lock or PID files.

  ### Prioritization

  This alert is considered high severity due to the critical function of the affected PID and lock files and the high likelihood of malicious exploitation when such access is detected. BPFDoor is a known evasive backdoor, commonly used by threat actors to maintain persistence or conduct further malicious operations.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of the audit daemon, resulting in missed events if file access logging is not properly set. Legitimate applications on the host may also generate similar alerts due to normal operations, potentially leading to false positives. Companion detections that enhance coverage could include monitoring changes or accesses to sensitive system configurations or executables related to system services.

