  ### Technical Context

  This Sigma rule detects access to specific lock and process ID (.lock and .pid) files commonly associated with the BPFDoor Linux backdoor. An attacker using BPFDoor aims to establish persistence and covert remote access to a compromised system. This activity aligns with the MITRE ATT&CK framework under the tactic “Execution” and technique “Command and Scripting Interpreter” (T1059) as well as “Command-Line Interface” (T1106). The primary telemetry sources required are audit logs from Linux systems, specifically focusing on auditd events that track file access. If malicious, this can indicate unauthorized access and potential persistence mechanisms being established. Importantly, this detection does NOT confirm an active compromise; it merely indicates file access behavior warranting further investigation.

  ### Investigation Steps

  - **Check access times of the .lock and .pid files**: Correlate access timestamps with other system events (Audit Event ID 1100) to establish a timeline of activity and assess if access coincides with unusual login times or patterns.

  - **Review process and user context**: Identify the process accessing these files via Audit Event ID 1102, including user identifiers. Look for abnormal or unauthorized users accessing these files that do not align with established operational practices.

  - **Assess the criticality of the host**: Determine if the accessed files are on critical infrastructure (e.g., web servers, databases). Prioritize investigation based on the asset’s role within the organization.

  - **Identify legitimate application access patterns**: Document expected behavior for applications utilizing these .lock or .pid files, assessing against known operational run times and access methods.

  - **Correlate with other security telemetry**: Analyze surrounding security events (e.g., failed logins, unusual outbound traffic) to identify potential command-and-control activity, using logs from network devices or SIEM alerts related to suspicious outbound connections.

  ### Prioritization

  This alert is of high severity due to potential threats involving critical Linux systems that may be exploited for unauthorized remote access and persistence. The likelihood of abuse is significant, as BPFDoor has been weaponized in targeted attacks, indicating a need for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if auditd is misconfigured or not collecting necessary events. Potential evasion techniques include attackers modifying access controls to avoid detection. Legitimate application updates or administrative activities could trigger the alert. Companion detections such as monitoring network connections to unusual external IPs would enhance overall security posture against these threats.

