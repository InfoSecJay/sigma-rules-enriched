note: |
  ### Technical Context

  This Sigma rule detects changes to critical configuration files for logging daemons such as `syslog`, `rsyslog`, and `syslog-ng` on Linux systems. Attackers may modify these configurations to redirect or suppress logs, enabling stealthy operation while maintaining persistence. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion (T1562.006)**. The primary telemetry sources for this detection include audit logs generated by `auditd`, specifically focusing on file change events. The security impact is significant, as malicious modifications can obscure attacks by disabling log collection, facilitating further compromise or data exfiltration. Importantly, this detection does not confirm an active attack or compromise on its own; legitimate administrative actions may also result in these changes.

  ### Investigation Steps

  - **Review audit logs for file changes:** Examine `auditd` logs for entries with Event ID 1100 indicating WRITE operations on `/etc/syslog.conf`, `/etc/rsyslog.conf`, or `/etc/syslog-ng/syslog-ng.conf`. Check for timestamps close to the alert generation time.

  - **Identify authorized administrators:** Cross-reference the change events with logged user activity to identify if changes were made by authorized personnel. Look for entries with user IDs or groups matching legitimate administrators.

  - **Validate recent changes:** Further investigate recent changes by retrieving the last modified timestamps of the configuration files using `stat /etc/syslog.conf` and similar commands. Compare these timestamps with known maintenance windows to assess legitimacy.

  - **Check for log suppression or redirection rules:** Inspect the modified configuration files for suspicious patterns, such as entries that redirect log entries to `/dev/null`, which would indicate attempts to suppress logging.

  - **Monitor for related lateral movements:** Track for Paralleling lateral movement activity targeting other critical systems using logs from SSH access (e.g., `/var/log/auth.log`) where the same user executes commands like `rsyslogd` restart or similar commands.

  ### Prioritization

  This alert carries a high severity due to its potential impact on logging integrity across crucial systems. The likelihood of malicious abuse is elevated, as suppressing log entries is a common strategy for evading detection during attacks. Such configuration changes are not only risky but also indicative of actors aiming for stealth in their operation.

  ### Blind Spots and Assumptions

  The detection may miss legitimate administrative changes if audit logging is not configured correctly or if personnel do not follow protocols. Adversaries may use legitimate accounts with elevated privileges to modify configurations, creating confusion during investigations. It is recommended to utilize supplementary detections, such as changes to user permissions on critical files or abnormal authentication patterns, to strengthen coverage on potential insider threats or compromised accounts.

