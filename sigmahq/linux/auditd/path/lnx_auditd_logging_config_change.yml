note: |
  ### Technical Context

  This Sigma rule detects unauthorized changes to configuration files for syslog daemons on Linux systems, specifically targeting files such as `/etc/syslog.conf`, `/etc/rsyslog.conf`, and `/etc/syslog-ng/syslog-ng.conf`. The likely attacker objective is to manipulate logging behavior to suppress evidence of malicious activities, thereby aiding in evasion and lateral movement. This behavior aligns with the MITRE ATT&CK technique T1685: Defacement, as altering logging configurations can help conceal ongoing attack vectors.

  The primary telemetry sources are the audit logs generated by the Audit Daemon (auditd), focusing on events related to file integrity and modifications. If this behavior is malicious, it could severely impact the organization by preventing detection of other indicators of compromise (IoCs). It’s important to note that while this detection indicates a change was made, it does NOT confirm the intent behind the change—legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Review audit logs for events related to configuration files**: Check `/var/log/audit/audit.log` for `auditd` event types around the relevant config files (e.g., `/etc/syslog.conf`, `/etc/rsyslog.conf`). Look for `syscall: open` or `syscall: write` to confirm if unauthorized modifications occurred.

  - **Evaluate owner and permission settings**: Use `ls -l /etc/syslog*.conf` to verify the ownership and permissions of the syslog configuration files. Legitimate config files should generally be owned by `root` with restricted permissions (e.g., `rw-r--r--`). Any unexpected user ownership could indicate compromise.

  - **Determine the context of the changes**: Look for command history in `/root/.bash_history` or appropriate user histories to find related commands executed around the time of the log changes. This may help establish whether the changes stemmed from legitimate system administration versus potential malicious activity.

  - **Cross-reference with baseline configurations**: Compare current configurations from the system with a known good baseline using tools like `diff` or configuration management systems (e.g., Ansible). Identify unauthorized deviations that might indicate an attacker footprint.

  - **Identify high-confidence malicious indicators**: Look for patterns such as rapid, repeated changes to config files from a non-administrative account. Changes made during odd hours (e.g., outside of regular maintenance windows) alongside elevated privileges raise suspicion for malicious intent.

  - **Assess related system logs for suspicious activity**: Review other associated logs, such as syslog logs (e.g., `/var/log/syslog` or the service specific logs) for any anomalies or missing entries around the time of the configuration change. Missing logs can signify an attempt to erase traces of malicious activity, which is a significant red flag.

  ### Prioritization

  This alert is high priority due to its potential to enable malicious activities by manipulating logging configurations. The high likelihood of this behavior being weaponized by an adversary increases its severity, especially in organizations with critical systems where logs are pivotal for incident detection and compliance.

  ### Blind Spots and Assumptions

  Detection can be limited by insufficient configurations of auditd or the absence of filesystem monitoring on critical files. Legitimate administrative tasks, such as system updates or service reconfigurations, may also trigger this alert without malicious intent. A relevant companion detection would be to monitor for abnormal access patterns to log files or unusual user activities, enhancing the overall visibility of both legitimate and illegitimate changes.

