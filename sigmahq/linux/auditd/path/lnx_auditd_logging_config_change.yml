title: Logging Configuration Changes on Linux Host
id: c830f15d-6f6e-430f-8074-6f73d6807841
status: test
description: Detect changes of syslog daemons configuration files
references:
- self experience
author: Mikhail Larin, oscd.community
date: 2019-10-25
modified: 2021-11-27
tags:
- attack.defense-evasion
- attack.t1562.006
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'PATH'
    name:
    - /etc/syslog.conf
    - /etc/rsyslog.conf
    - /etc/syslog-ng/syslog-ng.conf
  condition: selection
falsepositives:
- Legitimate administrative activity
level: high
note: |
  ### Technical Context
  This rule detects unauthorized changes to the configuration files of syslog daemons on Linux hosts. Malicious actors may target these files to manipulate system logging, allowing them to evade detection by suppressing or altering log entries. By changing syslog configurations, attackers can cover their tracks, making it difficult for security teams to investigate incidents or understand the full extent of a compromise.

  The relevant MITRE ATT&CK techniques for this activity include **T1562.006: Impair Process Control**. This technique involves tampering with system functionality to evade detection, which aligns with the behavior of modifying logging configurations. The primary data source for this rule is the audit logs generated by the `auditd` service on Linux systems, which can provide insights into file modifications and access attempts.

  ### Investigation Steps
  - **Review Audit Logs**: Collect and analyze the `auditd` logs for any entries that show modifications to the specified configuration files (`/etc/syslog.conf`, `/etc/rsyslog.conf`, `/etc/syslog-ng/syslog-ng.conf`). Look for unusual timestamps or user accounts that don't typically interact with these files.

  - **Check User Account Activity**: Investigate the actions leading up to the configuration change to determine if there was any unauthorized administrative activity or the use of compromised accounts. Search for other actions performed by the same user around the time of the modification.

  - **Verify Integrity of Configurations**: Cross-reference the current file states against a known-good baseline or previous configurations. Identify any unexpected changes or new entries that could indicate tampering.

  - **Correlate with Other Logs**: Look into system logs, such as authentication logs, to identify any anomalous login attempts or behaviors coinciding with the configuration changes. This may provide context on whether the changes were indicative of malicious intent or legitimate administrative actions.

  ### Prioritization
  The high severity of this alert is warranted due to the potential impact of maliciously altering logging configurations, which may hinder an organization’s ability to detect and respond to threats. Given the likelihood of such activities during a compromise, this alert should be treated with urgency.

  ### Blind Spots and Assumptions
  This detection logic may not cover scenarios where log changes occur outside the monitored configuration files, such as alterations to other logging mechanisms or custom solutions. Additionally, the detection assumes that the `auditd` service is properly configured and running on the host. In environments where logging configurations are frequently modified for legitimate purposes, there may also be increased false positives that require further investigation.

