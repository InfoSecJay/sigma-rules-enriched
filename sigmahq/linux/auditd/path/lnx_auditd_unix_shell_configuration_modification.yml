note: |
  ### Technical Context

  This rule detects modifications to Unix shell configuration files, which can be leveraged by threat actors to establish persistence. The likely attacker objective is to execute malicious commands upon opening a new shell. This behavior is linked to the MITRE ATT&CK tactic of Persistence (TA0003) and technique T1546.004: "System Shell Initiation." The primary telemetry source is Linux audit logs, specifically from auditing daemon (auditd) events capturing file modifications. Malicious modifications could allow unauthorized access or the execution of malicious scripts, significantly impacting system integrity and confidentiality. This detection does NOT confirm malicious activity alone, as benign administrative changes can also trigger this alert.

  ### Investigation Steps

  - **Verify file modification logs:** Check audit logs for Event ID 3200 related to modifications of shell configuration files (e.g., `/etc/profile`, user-specific `.bashrc` files). Look for unexpected paths or timestamps that deviate from typical admin activity.

  - **Identify recent changes by user:** Correlate modifications with user accounts through logs. Specific user accounts making changes to `/root/.bashrc` or user home directories (e.g., `/home/user/.bashrc`) within unusual time frames or patterns may indicate malicious activity.

  - **Examine for command insertion:** Inspect the contents of the modified configuration files for any suspicious command lines or scripts (e.g., reverse shells, credential dumps). Compare against normal setups and known-good baselines.

  - **Analyze baseline for legitimate changes:** Review normal operations related to system admins or legitimate user behaviors that typically modify shell configurations—such as routine updates or installations—that would not typically include malicious commands.

  - **Check for escalation patterns:** Look for indications of privilege escalation attempts, such as modifications to `/etc/sudoers` or creating cron jobs intended to activate modified shell logic. Log events showing sudo usage could be indicative of further exploitation attempts.

  ### Prioritization

  This alert should be classified with medium severity as modifications to shell configurations can lead to significant security risks if exploited. The likelihood of malicious abuse is plausible, especially in environments where attackers aim for persistence. This behavior is an established technique in many attacks, warranting timely investigation.

  ### Blind Spots and Assumptions

  Detection limitations may arise from the potential for legitimate administrative changes, which can generate false positives, particularly from system and user activity. Dependable detection requires comprehensive auditd configurations to ensure all modifications are logged. Consider companion detections for abnormal process creation (Sysmon Event ID 1) or network connections from modified shells to strengthen coverage and identify related malicious activity.

