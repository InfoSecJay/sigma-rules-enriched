note: |
  ### Technical Context
  This rule detects unauthorized modifications to Unix shell configuration files, which are commonly targeted by adversaries to establish persistence or execute malicious commands whenever a new shell session is initiated. Attackers might alter these configurations to launch malicious payloads or maintain access without detection. The primary objective is to gain ongoing control over the system or to deploy further attacks once they have established a foothold.

  The relevant MITRE ATT&CK techniques associated with this detection include **Persistence (T1546.004)**, where attackers modify startup scripts, and **Privilege Escalation (T1548)**, if the changes are made to gain higher privileges. This highlights the dual threat posed by such modifications: the potential for ongoing access through persistence and escalated privileges on compromised systems.

  Primary data sources for this detection include **audit logs** from the Linux `auditd` service, which track file access and modifications, as well as **filesystem monitoring logs** that provide insights into changes made to critical configuration files across the `/etc` and user directories.

  ### Investigation Steps
  - **Review Audit Logs**: Examine auditd logs for entries indicating access or modifications to shell configuration files listed in the detection rule. Pay attention to timestamps, user IDs, and commands executed.

  - **Check User Activity**: Cross-reference the modification logs with user activity logs around the same time to identify any user accounts that are behaving unusually or lack proper authorization.

  - **Inspect Bash/Zsh Sessions**: Investigate current and past shell sessions for any executed commands that might reflect malicious intent, such as unexpected or unusual command patterns through command history in `.bash_history` or equivalent files.

  - **Correlate with Related Alerts**: Look for other alerts from related security tools (EDR, SIEM) that may indicate complementary suspicious behavior, such as privilege escalation attempts or outbound connections from unexpected user accounts.

  ### Prioritization
  This alert has medium severity due to the potential impact of unauthorized persistence and privilege escalation on system security. The likelihood of such configurations being modified maliciously necessitates prompt investigation, as successful exploitation could lead to extensive data theft or system compromise.

  ### Blind Spots and Assumptions
  There are inherent blind spots in detecting these changes if filesystem auditing is not enabled or is misconfigured, which could lead to missed modifications. The detection logic assumes that all significant changes to shell configurations are malicious, which may not account for legitimate administrative or user actions, potentially resulting in false positives. Effective monitoring requires a properly configured `auditd` system with appropriate logging parameters and retention policies to capture necessary events for analysis.

