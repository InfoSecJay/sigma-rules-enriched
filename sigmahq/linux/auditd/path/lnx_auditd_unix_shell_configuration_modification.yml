  ---

  ### Technical Context

  This rule detects modifications to critical Unix shell configuration files such as `.bashrc` and `.profile` that can be leveraged by adversaries to establish persistence mechanisms. The likely objective is to execute malicious commands automatically when a user opens a new shell session, allowing the attacker to maintain access or execute further attacks. This behavior aligns with the MITRE ATT&CK technique T1546.004 (Code Signing or Shell Persistence).

  The primary telemetry source for this detection is `auditd` logs on Linux systems, specifically monitoring events associated with changes to the mentioned configuration files. If the detected modification is malicious, it can lead to significant security impacts, including persistent backdoor access for an attacker. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions can also trigger these modifications.

  ---

  ### Investigation Steps

  - **Check audit logs for file modification events:** Review `auditd` logs for events (Event ID 1100) indicating changes to critical shell configuration files like `/etc/bash.bashrc` and `~/.bashrc`. Look for unexpected changes outside of admin maintenance windows.

  - **Identify the user responsible for changes:** Examine the fields in the `auditd` logs, specifically the `auid` and `uid` fields, to determine which user made the modification. Verify if the user has appropriate permissions for such changes.

  - **Review change history of modified files:** Utilize `git` or file monitoring solutions to analyze the change history of the affected files. Identify any recent modifications that include obfuscation or suspicious commands, which could indicate malicious intent.

  - **Analyze for known malicious patterns:** Cross-reference the changes found in configuration files against known malicious payloads or commands. Look for specific indicators of compromise such as obfuscated scripts or unauthorized remote access commands.

  - **Validate legitimate administrative activities:** Confirm if any administrators or users were scheduled to modify shell configurations during the alert period. Look for scheduled maintenance or documented changes to understand the context.

  - **Investigate for additional indicators of persistence:** Look for additional signs of compromise such as cron jobs that correlate with the time of modification using `crontab -l` or by checking `/var/spool/cron/crontabs` for suspicious entries.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact on critical Unix-based systems. While modifications to shell configurations can indicate malicious activity, legitimate administrative actions may also trigger this detection, requiring careful analysis. However, the behavior aligns with tactics often exploited by adversaries, raising the likelihood of malicious misuse.

  ---

  ### Blind Spots and Assumptions

  Detection of shell configuration changes can be evaded by stealth techniques such as direct filesystem manipulation without using standard commands logged by `auditd`. Reliable detection also requires that `auditd` be correctly configured to monitor file changes. Legitimate user activity, such as routine maintenance by administrators, can generate false positives. Companion detections, such as monitoring for unusual cron job modifications, can strengthen overall coverage against persistence techniques.

