detection:
  selection:
    type: 'PATH'
    name|contains: '/.'
  filter:
    name|contains:
    - '/.cache/'
    - '/.config/'
    - '/.pyenv/'
    - '/.rustup/toolchains'
  condition: selection and not filter
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects attempts to access hidden files or directories in Unix-like systems, specifically targeting file paths that contain a dot prefix (e.g., "/.cache/", "/.config/"). This behavior is often associated with adversary objectives like maintaining persistence or executing malicious code while evading detection. According to MITRE ATT&CK, this corresponds with the tactic of *Persistence* (TA0003) and the technique *Hidden Files and Directories* (T1564.001).

  The primary telemetry source for this alert is the Linux audit daemon (auditd), specifically monitoring file access events. If malicious, this behavior could signify an attempt to manipulate stealthy configurations or execute threats without user awareness. However, this detection alone does not confirm malicious intent, as legitimate processes may also interact with these hidden files.

  ### Investigation Steps

  - **Review alert details:** Confirm the file path involved, looking for accesses to common hidden directories such as "/.cache/" and "/.config/". Note if any known benign applications use these paths.

  - **Check audit logs for Event IDs:** Inspect the relevant auditd logs for *syscall=open or syscall=read* events. Pay attention to the *path* field indicating hidden files. Legitimate access is typically tied to software dependencies or user profiles.

  - **Analyze process execution context:** Cross-reference the process IDs capturing the hidden file access with */proc/<PID>/cmdline* or */proc/<PID>/environ*. Legitimate process behavior involves predictable names linked to known services or user applications.

  - **Identify high-confidence malicious indicators:** Look for patterns or oddities in access times, such as anomalies in typical business hours or access attempts from non-standard user accounts. Unusual scripts or binaries in the command line arguments may indicate abuse.

  - **Validate file modifications or exfiltration:** If the suspicious access alters a file, ensure to check for changes in timestamps or file sizes in paths like "/.config/". Investigate if associated files are sent to external IPs or if any unauthorized scripts are created.

  - **Review for companion detections:** Look for related alerts involving process injection or unauthorized system configuration changes in similar timeline windows. Correlating these can highlight potential coordinated attacks.

  ### Prioritization

  This alert is categorized as low severity due to the potential impact on non-critical systems. The likelihood of malicious abuse exists, particularly in environments where persistence mechanisms are exploited. However, this behavior is not frequently weaponized, often presenting legitimate use cases in development environments or user configurations.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of malicious actors using evasion techniques, such as encoding file paths or using alternative methods of hiding interactions. The reliability of this detection is contingent upon correct auditd configuration to capture file access events. Legitimate application behavior, particularly from software development tools, may also trigger alerts. A related detection to consider is *Suspicious Process Creation* (T1059), which strengthens coverage of potentially malicious activities initiated after hidden file access.

