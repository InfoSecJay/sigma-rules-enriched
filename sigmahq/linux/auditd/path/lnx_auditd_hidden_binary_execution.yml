  ---

  ### Technical Context

  This rule detects attempts to access hidden files or directories in Unix-like systems (NIX) that are obscured using a leading dot in their names (e.g., `.cache`, `.config`). The primary attacker objective is to leverage these hidden paths for persistence, privilege escalation, or to evade detection by security monitoring systems while executing malicious payloads or scripts. The relevant MITRE ATT&CK tactic is "Defense Evasion" (T1564.001).

  The primary telemetry source required for this detection is the audit logs from `auditd` on Linux systems, specifically monitoring access to files or directories. If malicious, this behavior could indicate that an adversary is attempting to compromise the integrity of the system by manipulating or using hidden files for nefarious activities. It’s important to note that the detection of access to hidden files does NOT automatically confirm malicious intentions, as legitimate applications and users may also access these files.

  ---

  ### Investigation Steps

  - **Review `auditd` logs for suspicious file access attempts:** Check for Event ID 2302 with the `name` field containing paths like `/.hiddenfile` or `/.config/suspiciousfile`. Note any high-frequency accesses that a legitimate user would not typically engage in.

  - **Validate the legitimacy of hidden file access:** Confirm if the file access aligns with known processes or users. For example, legitimate configurations might be accessed by users executing common applications (e.g., configuration files for `git`, `python`, etc.).

  - **Identify malicious patterns in frequent access:** Look for unexpected access to files from unusual user accounts or service accounts typically not involved with file manipulations (e.g., system accounts running scheduled tasks).

  - **Analyze process execution linking to hidden file access:** Correlate the file access logs with process creation logs from `auditd` (Event ID 2304). Check for processes that access hidden files not typically executed in the environment.

  - **Check for high-risk asset activity:** Analyze if the access to hidden paths is occurring on critical systems (e.g., servers hosting sensitive applications). Note if any unusual commands or scripts are executed immediately after accessing hidden files.

  - **Document legitimate software interactions:** Understand that many legitimate services (like Docker or package managers) may access hidden paths frequently. Collect baseline interactions to differentiate between normal and suspicious activity.

  ---

  ### Prioritization

  This alert has a low severity level due to the nature of the detection being tied to hidden file access, which can involve both benign and malicious behavior. However, depending on the context of the affected systems—especially critical infrastructure—such access patterns may warrant further investigation to assess potential exploitation of vulnerabilities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by incomplete `auditd` configurations, potentially leaving gaps in visibility over file access. Additionally, malicious actors may use legitimate file access methods to obscure their activities. Normal tools and applications may trigger this rule, such as configuration management software or user scripts. A related detection to consider is monitoring for suspicious command execution (T1059), as adversaries may combine file access with known command injection techniques.

