logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'PATH'
    name|contains: '/.'
  filter:
    name|contains:
    - '/.cache/'
    - '/.config/'
    - '/.pyenv/'
    - '/.rustup/toolchains'
  condition: selection and not filter
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This rule detects unauthorized access attempts to hidden files or files located in hidden directories on UNIX/Linux systems. These locations, typically prefixed with a dot (e.g., `.cache`, `.config`), often contain configuration files or sensitive data that attackers might target to maintain persistence or evade detection. The primary intent of such activities is usually to escalate privileges or conceal their presence within the system, potentially indicating malicious behavior or lateral movement.

  The relevant MITRE ATT&CK tactics include **Persistence (TA0003)**, where attackers seek to establish and maintain access to systems, and **Defense Evasion (TA0005)**, involving methods to bypass detection mechanisms. Specific techniques applicable here are **T1564.001: Hidden Files and Directories**, as attackers might use such pathways to hide scripts or logs that facilitate their activities. The primary data source for this detection would be audit logs generated by `auditd` on the Linux systems, which can track file access and modifications effectively.

  ### Investigation Steps
  - **Review Audit Logs**: Examine `auditd` logs for access attempts to any files within hidden directories (e.g., `/.cache`, `/.config`, etc.). Focus on the timestamps and user IDs associated with these entries.
  - **Correlate User Activity**: Investigate the normal usage patterns of the users involved in the alerts, especially those with elevated privileges. Determine whether their access to these hidden directories is justified.
  - **Analyze File Changes**: Look for any unexpected modifications to the files accessed. This includes examining the contents or creation of suspicious files or directories within the hidden paths.
  - **Check for Known Artifacts**: Utilize threat intelligence sources to identify any tools or malware associated with accessing hidden files, and cross-check against your environments, such as any presence of known benign applications using these paths.

  ### Prioritization
  Despite the alert being categorized as low severity, it should not be ignored, as unauthorized access to hidden files could indicate an ongoing attack or compromise, especially if combined with other suspicious activities. Prompt investigation is crucial to prevent escalation.

  ### Blind Spots and Assumptions
  This detection rule may not cover all possible avenues, particularly if an attacker uses uncommon file paths or employs methods outside standard file access to manipulate hidden files. The detection logic assumes that all relevant audit logging configurations are enabled and functioning correctly; without comprehensive logging, detection may be incomplete or ineffective. In environments with configured access controls or SIEMs lacking visibility into `auditd` logs, this rule may yield false negatives.

