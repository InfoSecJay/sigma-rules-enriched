logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: 'PATH'
    name|contains: '/.'
  filter:
    name|contains:
    - '/.cache/'
    - '/.config/'
    - '/.pyenv/'
    - '/.rustup/toolchains'
  condition: selection and not filter
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This rule detects attempts to access hidden files or directories on Linux systems, particularly those hiding behind a leading dot (e.g., `.hiddenfile`). The likely attacker objective is to evades detection by utilizing hidden paths for data storage, malware execution, or configuration manipulation, falling under MITRE ATT&CK's privilege escalation (T1574.001) and defense evasion tactics.

  Primary telemetry sources include Linux audit logs provided by `auditd`, capturing events related to file access. If malicious, this behavior could indicate a compromised system or an attacker attempting to maintain persistence. However, this detection alone does NOT confirm malicious intent; legitimate system processes may also access hidden files.

  ### Investigation Steps

  - **Review auditd logs for relevant events**: Check for `EXE_CMD` and `SYSCALL` events in audit logs (e.g., `/var/log/audit/audit.log`) that indicate access to hidden files, looking for exact entries where `name` contains `/.`.

  - **Correlate with user behavior**: Validate if the access aligns with expected user activity. For example, developers may access hidden directories for configuration, such as `.config/`. Match accesses with user roles, ensuring legitimate use cases.

  - **Identify unusual access patterns**: Analyze for rapid successive access attempts to hidden files or directories, indicating automated scripts or tools, particularly if the user is not known to leverage these paths.

  - **Check for creation of hidden files**: Validate the presence of new hidden files (e.g., starting with `.`) by reviewing filesystem changes within `/home/<username>`. New hidden files not created by authorized users can be a high-confidence indicator of malicious behavior.

  - **Review system configurations**: Assess whether logging for hidden files or directories is appropriately configured in `auditd`. Ensure that filters do not exclude pertinent entries; such exclusions might lead to missed detection of malicious activity.

  ### Prioritization

  The alert is of low severity in an enterprise context, as access to hidden files can occur in benign scenarios, particularly among development teams or in automated processes. However, the presence of hidden file access attempts raises a flag for potential misuse, warranting further investigation especially if correlated with other suspicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions that prevent capturing all relevant access logs, particularly in environments with restrictive `auditd` configurations. Legitimate activities, such as software installations or configuration changes by authorized users, may trigger this alert. A related detection for regular access to system paths (e.g., non-hidden files) could help contextualize behavior and strengthen security posture.

