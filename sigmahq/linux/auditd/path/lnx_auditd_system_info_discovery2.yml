note: |
  ### Technical Context
  This detection rule identifies commands and activities aimed at gathering system and hardware information on Linux systems. It specifically monitors for attempts to access various files and directories that reveal critical hardware and system details, such as BIOS version and product name, which attackers could exploit to plan their movements within an environment or escalate privileges. The primary objective of such reconnaissance activities is for threat actors to understand the network topology and the systems within it to identify potential vulnerabilities. In many cases, this information is vital for executing further attacks, such as lateral movement or establishing persistence.

  Relevant MITRE ATT&CK tactics and techniques for this behavior include:
  - **T1071: Application Layer Protocol**: Thrust into the reconnaissance phase by gathering system configurations.
  - **T1082: System Information Discovery**: The core technique this rule targets, focusing on discovering the system's environment.

  Primary data sources for this detection include:
  - Linux audit logs, particularly those generated by `auditd`, which can provide insight into command execution and file access patterns.

  ### Investigation Steps
  - **Review audit logs**: Investigate auditd logs for commands targeting paths like `/proc/version` or `/sys/class/dmi/id/*`. Look for unusual access patterns that might indicate reconnaissance by unauthorized users.
  - **Analyze process creation events**: Examine system logs for unexpected processes or users executing system information discovery commands. Look for patterns that involve enumeration of system attributes.
  - **Validate user behavior**: Correlate the command executions with active user sessions. Determine if the actions were performed by legitimate admin users during regular maintenance or outside typical operational patterns.
  - **Inspect user access rights**: Check if the accounts executing these commands have a legitimate purpose for accessing system information. Identify any anomalous or elevated privilege usage potentially indicative of an adversary.

  ### Prioritization
  This alert is categorized as informational but should be monitored closely, as frequent system information discovery activities by non-administrative users may indicate pre-attack reconnaissance efforts that could lead to more severe incidents.

  ### Blind Spots and Assumptions
  The detection logic may not capture all reconnaissance activity if logs are not fully configured to audit all relevant command executions. There is an assumption that malicious actors will utilize well-known file paths to acquire system information; however, they may use non-standard methods or custom scripts that go undetected. Complete coverage requires robust auditing policies on all systems to log relevant commands and user activities effectively.

