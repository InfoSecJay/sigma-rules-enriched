  ---

  ### Technical Context

  This Sigma rule detects system information discovery commands on Linux systems, primarily focusing on attempts to access files that reveal system and hardware details such as BIOS version, product name, chassis vendor, and kernel version. An adversary's objective in executing these commands often includes gathering intelligence about the environment, which can assist in later stages of an attack, such as privilege escalation or lateral movement.

  The relevant MITRE ATT&CK tactic for this behavior is "Discovery," specifically technique T1082 (System Information Discovery). The primary telemetry sources involved are Linux audit logs from auditd that capture specific file access events. If malicious, this action can lead to further exploitation of system vulnerabilities. This detection alone does NOT confirm malicious intent, as legitimate administrative activities may also trigger it.

  ---

  ### Investigation Steps

  - **Review audit logs for accessed paths**: Check auditd logs (e.g., /var/log/audit/audit.log) for Event ID 1100 to identify access to files like `/sys/class/dmi/id/*`, `/proc/version`, and `/etc/*release`. Document access timestamps and user IDs associated with these events.

  - **Correlate with user behavior**: Identify the user performing these commands. Look for legitimate administrative job roles (e.g., system administrators). Confirm that the accessed paths align with expected behavior for those roles.

  - **Identify high-confidence malicious indicators**: Look for repeating access patterns to sensitive files from non-admin users or automated scripts. If the processes involve multiple file reads within a short time span, this may indicate discovery activity with malicious intent.

  - **Check for other concurrent suspicious activities**: Review for other suspicious actions in conjunction with system information discovery, such as unusual process creation (Event ID 4688) or logins from unfamiliar IP addresses (e.g., using last or auth logs).

  - **Validate with configuration changes**: If commands relate to configuration management (e.g., querying system versions), ensure these actions were initiated by an authorized configuration management tool rather than by an unauthorized user.

  - **Document known legitimate scenarios**: Consider maintenance tasks from IT staff that may trigger this detection—like system audits or software updates that involve reading these files, particularly post-maintenance hours.

  ---

  ### Prioritization

  This alert is classified as informational due to the potential for both benign and malicious activities. While the access of system information is typically not harmful, the context surrounding the behavior—such as the user role and timing—greatly impacts the likelihood of it being exploited.

  ---

  ### Blind Spots and Assumptions

  The detection may miss actions taken by users with root privileges or who disable audit logging, potentially masking illicit activity. Required log sources must be consistently configured for auditd to ensure full coverage. Common legitimate activities include system diagnostics and routine maintenance checks. A related detection would be monitoring for file modifications in critical system directories, which would strengthen overall coverage and context.

