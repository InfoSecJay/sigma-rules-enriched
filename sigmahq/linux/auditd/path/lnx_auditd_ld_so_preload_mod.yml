  ---

  ### Technical Context

  This Sigma rule detects modifications to the `/etc/ld.so.preload` file, which is commonly exploited by attackers to enable shared object injection, allowing arbitrary code to be loaded into processes. The likely attacker objective is to execute malicious code in the context of legitimate processes, thereby maintaining persistence or escalating privileges within a compromised system. The relevant MITRE ATT&CK tactics include Persistence (T1543.001) and Defense Evasion (T1574.006). Primary telemetry sources include audit logs analyzed via `auditd`, particularly focusing on file modification events.

  If malicious, the security impact is significant as it can lead to system compromise and unauthorized access to sensitive information. Importantly, this detection does not confirm that an attacker has successfully executed malicious code; it only indicates an attempt to manipulate the system's behavior.

  ---

  ### Investigation Steps

  - **Check Audit Logs for Modifications:** Review audit logs (`/var/log/audit/audit.log` or similar) for Event Type: `PATH` showing changes to `ld.so.preload`. Look for specific fields: `type`, `name`, and `success`, which indicate successful changes.

  - **Identify Source of Modification:** Determine the user or process that performed the modification by correlating audit logs with process execution logs (Sysmon Event ID 1). Look for processes that executed around the same timeframe that modified `ld.so.preload`.

  - **Examine for Malicious Indicators:** Search for unexpected binaries or shared objects linked in the same directory or loaded in memory (e.g., running `lsof` or reviewing `/proc/<PID>/maps`). Unfamiliar or unauthorized libraries suggest malicious activity.

  - **Determine Normal Operations:** Review expected changes to `/etc/ld.so.preload`, such as legitimate application updates or installation operations. Verify whether the file modification corresponds to legitimate software management activities by correlating with deployment scripts or known software updates.

  - **Assess Asset Criticality:** Identify host role (e.g., web server, database, etc.) and its importance in your environment. Changes on critical assets such as a web server are of higher concern and should be prioritized.

  - **Validate File Integrity:** Use a file integrity monitoring tool (e.g., Tripwire) to assess changes to other critical system files that may indicate broader compromise. Confirm if other monitored files exhibit similar suspicious modifications.

  ---

  ### Prioritization

  This alert is high severity due to the potential for significant adverse effects on system integrity and security. Given that shared object injection is a common technique employed by various malware and advanced persistent threats, timely remediation is critical.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of auditd logs if not properly configured, potentially allowing modifications to go unnoticed. Legitimate updates from trusted installers could trigger this alert, particularly during software deployments. Companion detections to consider include monitoring for unusual `execve` calls (Sysmon Event ID 10), which may indicate attempts to invoke malicious payloads after modifying `ld.so.preload`.

