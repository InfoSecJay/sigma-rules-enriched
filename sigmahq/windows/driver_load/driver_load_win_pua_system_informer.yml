  ### Technical Context

  This Sigma rule detects the loading of the System Informer driver, which is often associated with system monitoring and auditing tasks. The objective of an attacker utilizing this tool could be to leverage its functionalities for unauthorized system monitoring or to exfiltrate sensitive data without detection. This detection is relevant to the MITRE ATT&CK framework under the tactic "Persistence" (TA0003) and technique "Install Root Certificate" (T1543).

  The primary telemetry sources for this detection are Windows driver load events, specifically captured via Event ID 7045 (Driver service installation) or related Sysmon events pertaining to driver loading. If malicious, the impact may include unauthorized access to system information or monitoring capabilities, potentially leading to deeper system compromise. It’s important to note that while this detection highlights the presence of the System Informer driver, it does not confirm malicious intent or activity on its own. Legitimate use cases by system administrators may also trigger this alert.

  ### Investigation Steps

  - **Check driver loading details:** Review Windows Event ID 7045 logs for entries related to the driver loading process. Check for the presence of `SystemInformer.sys` and note the account that initiated the action.

  - **Analyze the hash values:** Confirm the loaded driver against known SHA256 hashes in the rule. If the hash matches one of the specified hashes and is not part of a legitimate system process or application, it indicates higher suspicion of malicious activity.

  - **Correlate with system activity:** Investigate recent changes to the system configuration or application installations through Event ID 4697. Look for unusual patterns that coincide with the driver load event, indicating potential malicious use.

  - **Assess expected behavior:** Determine if the affected system has a legitimate use-case for the System Informer tool. For example, if a known administrator's account has loaded the driver as part of audit functions, this may suggest benign activity.

  - **Identify suspicious user accounts:** Search the security logs for the user accounts associated with the driver load. Malicious actions often leverage compromised accounts with unusual system access patterns, particularly if privileges have recently changed (Event ID 4624).

  - **Inspect for persistence mechanisms:** Look for additional entries in the registry or scheduled tasks that may establish persistence via the System Informer tool, primarily under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\`.

  ### Prioritization

  This alert has medium severity as it indicates potential unauthorized monitoring on critical systems. Given that the System Informer tool can be used for legitimate administration, the likelihood of malicious abuse is moderate, especially if there’s detection of the tool in a sensitive environment where such monitoring should not occur.

  ### Blind Spots and Assumptions

  Detection limitations may include scenarios where System Informer is legitimately used by trusted personnel, which could lead to false positives. Reliable detection requires that driver loading events and associated log settings are properly configured for monitoring. Legitimate administrative tasks may trigger this alert, necessitating context-based evaluation. A related detection mechanism includes monitoring for unusual processes or services being set to autostart that may accompany the installation of this driver, solidifying the assessment of potential malicious activity.

