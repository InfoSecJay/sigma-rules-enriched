note: |
  ### Technical Context

  This rule detects the loading of the WinDivert driver, a tool often used for packet capture, modification, and injection in Windows environments. Attackers may utilize WinDivert to conduct network sniffing or manipulate traffic, which aligns with objectives like credential harvesting or lateral movement. Its related MITRE ATT&CK techniques include Credential Access (T1557), Collection (T1599.001), and Defense Evasion (T1557.001).

  The primary telemetry sources for this detection are driver load event logs, specifically targeting entries that indicate the loading of WinDivert or similar driver filenames. If the detection is confirmed malicious, it could indicate an advanced persistent threat aiming to bypass security measures. However, this detection does NOT confirm the malicious intent or ongoing exploitation simply by the presence of the driver, as it may also be in legitimate use.

  ### Investigation Steps

  - **Validate driver loading events:** Check the Windows Event ID 6 (Driver Load) logs for the presence of `\WinDivert.sys`, `\WinDivert64.sys`, or similar filenames, filtering by the associated timestamp of the alert.

  - **Check for known hashes:** Review the driver load events for specific IMHashes listed in the rule. For instance, an IMHash of `0604bb7cb4bb851e2168d5c7d9399087` strongly suggests a malicious configuration if found in non-authorized environments.

  - **Assess system role:** Determine the role of the affected host. For instance, if the driver is loaded on a sensitive system such as a Domain Controller, further escalate the investigation due to higher risk.

  - **Look for related processes:** Utilize Sysmon Event ID 10 (Process Access) and Event ID 1 (Process Creation) logs to identify any processes initiated around the same timeframe as the driver load. Check for suspicious command line arguments or parent-child relationships indicative of malicious behavior.

  - **Identify legitimate use cases:** Consider the context of typical applications using WinDivert, such as network debugging or development tools, to distinguish benign from malicious instances. Compare with documented operational procedures.

  - **Correlate with network traffic:** Analyze network traffic logs for abnormal patterns that match the capabilities of WinDivert, such as unusual or unauthorized data exfiltration activities observable in the proxy server logs (e.g., HTTP/S logs).

  ### Prioritization

  The alert severity is high due to the potential impact on sensitive systems and the likelihood of malicious misuse for data exfiltration or traffic manipulation. The behavior detected is not commonly benign and is often associated with advanced attacks leveraging network interception techniques.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of obfuscation techniques where adversaries may rename the drivers or alter metadata to avoid detection. Required log sources must include detailed driver load event logs and Sysmon events for comprehensive visibility. Additionally, common applications may trigger the alert, creating false positives that necessitate thorough context analysis. A companion detection to consider is monitoring for suspicious outbound network traffic that may correlate with the loading of potentially malicious drivers.

