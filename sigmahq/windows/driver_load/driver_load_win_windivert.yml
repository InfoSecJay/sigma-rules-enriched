note: |
  ### Technical Context

  This rule detects the loading of the WinDivert driver, a user-mode driver capable of packet capture, modification, and injection on Windows systems. Attackers may use WinDivert to enable man-in-the-middle (MITM) attacks, credential harvesting, or network traffic manipulation during post-exploitation phases. The relevant MITRE ATT&CK tactics include Credential Access (T1557) and Collection (T1599.001).

  Primary telemetry sources include Windows driver load events, potentially logged under Event ID  kernel-mode driver load (Event ID 200). The security impact of this activity is significant, as it may indicate that an attacker has gained the ability to intercept and manipulate network traffic, posing risks to data confidentiality and system integrity. Importantly, this detection alone does NOT confirm malicious intent, as legitimate software may also load these drivers.

  ### Investigation Steps

  - **Verify driver load event:** Check for Windows Event ID 200 to confirm the loading of `WinDivert.sys` or related files. Validate the context of the load and check timestamps against known good use cases in the environment.

  - **Examine process relationships:** Look for associated process creation events (Event ID 4688) that may have invoked the driver. Identify if these processes are known legitimate applications or suspected malicious ones.

  - **Check hash values:** Review log entries for the file hashes against known malicious hashes for `WinDivert.sys` or its variants. High-confidence malicious indicators include the presence of the hashes documented in the Sigma rule.

  - **Identify legitimate usage:** Confirm expected usage patterns of the driver. For example, check if approved applications (such as certain network monitoring tools) have loaded the driver around the same time to distinguish benign from suspect activity.

  - **Investigate network activity:** Analyze network logs (using tools like NetFlow or firewall logs) for unusual outbound traffic patterns or connections from the hosts where the driver was loaded, which may indicate malicious intent.

  - **Assess host context:** Review the asset’s role (e.g., server, workstation) and criticality in the environment. Servers should not typically load such drivers; thus, alerts from these machines warrant immediate attention.

  ### Prioritization

  This alert should be treated with high severity due to the potential for significant impact on compromised systems. The likelihood of malicious abuse is high, as WinDivert is frequently weaponized in various attack scenarios, especially those involving credential theft or traffic manipulation.

  ### Blind Spots and Assumptions

  Detection may be limited if the logging infrastructure does not capture driver load events adequately. Evasion techniques could include deleting the driver after use or utilizing legitimate tools that also load the driver. Legitimate activities that may trigger this alert could involve authorized security testing or monitoring tools. Companion detections, such as monitoring for abnormal network traffic originating from processes using WinDivert, could enhance coverage and provide a more holistic view of potential misuse.

