  ---

  ### Technical Context

  This Sigma rule detects the loading of the HackSys Extreme Vulnerable Driver (HEVD), a known intentionally vulnerable Windows driver that security researchers use for educational purposes in exploitation techniques. The primary objective for an adversary loading this driver would typically involve gaining elevated privileges or establishing persistence within a target system. The relevant MITRE ATT&CK tactics for this behavior include **Persistence (T1543.003)** and **Privilege Escalation (T1068)**.

  The primary telemetry source is Windows Driver Load events, specifically looking for logs where the image name ends with `\HEVD.sys` and where specific hash values of the driver are present. If malicious, loading this driver signals an attempt to exploit the vulnerabilities present in the driver, allowing attackers to execute arbitrary code in kernel mode. This detection does NOT confirm that the action is malicious without additional context; legitimate use in a test environment by researchers is also possible.

  ---

  ### Investigation Steps

  - **Verify the loading event:** Check Windows Security Event ID **103** or **Kernel-PnP Event ID 4102** for driver load events that mention `HEVD.sys`. Malicious: Instances with specific hash values matching those known for exploitation; Benign: Absence of unusual system activities following the load.

  - **Correlate with process execution:** Inspect Sysmon Event ID **1** for any associated process creation that occurs simultaneously with the driver load. Malicious: Unusual processes that invoke the driver or are known for exploitation; Benign: Known administrative or system processes.

  - **Analyze known hash values:** Validate the hash of the loaded driver against the documented hashes `f26d0b110873a1c7d8c4f08fbeab89c5` and `c46ea2e651fd5f7f716c8867c6d13594`. Malicious: If hashes are present and the driver is not from a trusted context; Benign: Verified presence in an approved testing environment.

  - **Review system behavior post-load:** Identify any subsequent suspicious behavior, such as unexpected outbound connections or creation of unusual files through Windows Event ID **4663** (accessing objects) or API calls that perform file creations. Malicious: Evidence of exploitation behavior following driver load; Benign: Standard application tasks or maintenance activities.

  - **Assess system criticality and role:** Consider the role of the affected host. Malicious intent is more significant on critical systems (e.g., domain controllers, financial systems). Benign use is more likely on dedicated testing environments.

  ---

  ### Prioritization

  This alert is high severity due to the potential impact of exploiting kernel-level vulnerabilities. The likelihood of malicious abuse is elevated as loading HEVD is often associated with testing exploit techniques; adversaries frequently target vulnerable drivers for privilege escalation.

  ---

  ### Blind Spots and Assumptions

  Limitations include potential evasion tactics where an adversary may rename or alter the driver to avoid detection. Reliable detection requires proper logging configuration, specifically ensuring Driver Load events are captured. Legitimate activities that may trigger this alert include testing by security researchers in controlled environments. A companion detection to strengthen coverage would involve monitoring for unusual kernel-mode activity or direct privilege escalation attempts through Sysmon logs (e.g., Event ID **10** for driver object access).

