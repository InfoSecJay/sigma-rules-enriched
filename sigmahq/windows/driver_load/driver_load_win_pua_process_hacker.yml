  ### Technical Context

  This Sigma rule detects the loading of the Process Hacker driver, which is commonly used for process manipulation and system monitoring. The likely attacker objective for utilizing Process Hacker is to gain elevated privileges or maintain persistence on a target system by injecting code or manipulating system processes. The relevant MITRE ATT&CK tactics include **Persistence (TA0003)** and **Privilege Escalation (TA0004)**, specifically the techniques **Valid Accounts (T1078)** and **System Service Discovery (T1482)**.

  The primary telemetry sources include Windows event logs related to driver loading, specifically focusing on system event log types like Event ID Loaded Driver events. If malicious, the impact could include unauthorized access to system processes or the manipulation of critical system functions. This detection does NOT confirm outright malicious activity without additional context, as legitimate uses by system administrators or developers may occur.

  ### Investigation Steps

  - **Check loaded drivers for kprocesshacker.sys:** Examine the Windows System Event Log for Event ID 20001 (loaded driver logs) to confirm if the kprocesshacker.sys driver was loaded. Ignore logs where this driver is part of acknowledged administrator tasks.

  - **Examine process creation events:** Look at Event ID 4688 for process creation, specifically focusing on processes that spawned around the same time as the driver load. Verify if these processes are associated with known legitimate applications versus unexpected ones.

  - **Analyze associated file hashes:** Validate the file hashes against known hashes provided in the detection. Use Sysinternals tools or Windows file properties to confirm if the loaded driver matches any of these suspicious hashes. The presence of these hashes increases the likelihood of malicious intent.

  - **Review system administrative activities:** Identify if any administrators or developers typically use Process Hacker legitimately in your environment. Collect data from staff to establish a baseline for expected activities versus anomalies.

  - **Investigate network activity around the driver load:** Check firewall logs for outbound connections after the kprocesshacker.sys load. Look for unusual connections to external IPs (especially those involved in malware distribution), using Microsoft Windows Firewall Event ID 5156 for outbound rules.

  ### Prioritization

  This alert should be treated as high severity due to the potential impact of a compromised system used for privilege escalation or persistence. The likelihood of malicious use is significant, as tools like Process Hacker are frequently weaponized by adversaries to facilitate unauthorized control over systems.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers employ alternative drivers or manipulate other processes without triggering this specific alert. Reliable detection requires complete driver load logs, which should be enabled for all critical systems. Legitimate administrative use of Process Hacker in maintenance scenarios may trigger the alert. A related detection could include monitoring for unusual parent process relationships during driver loading to identify more generalized process injection techniques.

