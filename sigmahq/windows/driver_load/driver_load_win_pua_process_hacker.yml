note: |
  ### Technical Context
  This detection rule identifies the loading of the Process Hacker driver (`kprocesshacker.sys`), which is associated with process manipulation in Windows environments. Process Hacker is a legitimate tool often used for monitoring system activity, but it can also be exploited by malicious actors to manipulate processes, elevate privileges, or establish persistence through driver loading. The attacker may utilize this tool to evade detection, gather sensitive information, or maintain unauthorized control over a compromised system.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence** (TA0003) and **Privilege Escalation** (TA0004), specifically techniques such as **Install Root Certificate** (T1590) and **Kernel-Mode Driver** (T1543). These associations indicate that while the tool itself has legitimate uses, its invocation in a suspicious context may indicate nefarious intent, such as an attempt to establish a foothold or escalate privileges on the system.

  Primary data sources for this detection include Windows driver load logs, which will contain information about driver activity and facilitate the identification of potentially malicious driver behaviors.

  ### Investigation Steps
  - **Review Driver Load Events:** Check the logs for any instances of `kprocesshacker.sys` being loaded. Pay special attention to the timing of these events and related user activity to determine if they correlate with suspicious behavior.
  - **Correlate with Process Creation Logs:** Investigate process creation events around the same time to identify what processes were running that may have invoked the driver load. Look for processes that exhibit unexpected parent-child relationships.
  - **Analyze File Hashes for Uniqueness:** Verify the hashes associated with the loading process against known malicious signatures. Use known benign scenarios (e.g., developer tools) to filter out false positives appropriately.
  - **Examine User Activity and Access Patterns:** Monitor user access logs to identify if the actions taken by the user correlate with legitimate administrative tasks or raise red flags regarding unauthorized access and usage of system tools.

  ### Prioritization
  This alert is of **high severity** due to the potential for significant impact if Process Hacker is used maliciously. Attackers can leverage it for privilege escalation, persistence, and evading detection, making it a serious concern in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if driver loading is not thoroughly logged or if additional legitimate uses of Process Hacker are common within the organization. The detection logic assumes that administrators have not configured exceptions for this driver load, potentially allowing for false negatives in cases of legitimate use. Moreover, the alert requires comprehensive driver load event logging to function effectively. Ensuring that logging settings are correctly configured is critical for the timely and accurate detection of this activity.

