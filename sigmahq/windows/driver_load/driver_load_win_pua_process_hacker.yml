  ---

  ### Technical Context

  This Sigma rule detects the loading of the Process Hacker driver (`kprocesshacker.sys`), a tool commonly used for process manipulation, debugging, and system monitoring. The likely attacker objective is to gain unauthorized control over system processes, elevate privileges, or maintain persistence in a compromised environment. This behavior aligns with the MITRE ATT&CK technique for Persistence (T1543) and Privilege Escalation.

  The primary telemetry source for this detection is Windows Driver Load events, specifically focusing on Event ID 10 from Windows Event Logs, which captures the loading of driver images. If the behavior is malicious, it indicates potential compromise and advanced evasion tactics in use. Importantly, this detection does NOT confirm malicious intent on its own; it must be correlated with additional context and indicators of compromise.

  ---

  ### Investigation Steps

  - **Review driver load events:** Investigate Windows Event ID 10 (Driver Load) logs for occurrences of `kprocesshacker.sys`. Look for the process initiator and timestamps to determine if it aligns with known malicious behavior.

  - **Check parent process information:** Assess the parent process ID associated with the driver load. Legitimate usage typically has a benign parent process such as `explorer.exe` or `powershell.exe` when initiated by admins. Malicious activity may show non-standard parent processes indicative of exploitation.

  - **Examine digital signatures:** Verify the digital signature of the loaded driver using the Windows Event logs. A legitimate signature from a known vendor is expected; however, if the signature is missing or from an untrusted source, raise alerts on potential malicious activity.

  - **Cross-reference with threat intelligence:** Use threat intelligence platforms to check if the MD5 or SHA256 hashes listed in the rule (`821D74031D3F625BCBD0DF08B70F1E77`, etc.) are associated with known malware or Toolkits. This provides high-confidence indicators of malicious activity.

  - **Monitor for lateral movement patterns:** Investigate if other systems in the environment feature similar driver load activity, which may indicate lateral movement or a broader compromise affecting multiple hosts.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential risk of malicious abuse, specifically for persistent access and privilege escalation scenarios. The likelihood of this behavior being weaponized is notable, as Process Hacker is frequently leveraged by attackers for sophisticated malicious activities.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through renaming the Process Hacker driver or misconfiguration of log sources that fail to capture driver load events properly. Legitimate administrative activities, such as system maintenance or debugging, may trigger this alert. A companion detection, such as monitoring for unusual process creation events (Event ID 4688), can strengthen coverage by identifying suspicious parent-child process relationships.

