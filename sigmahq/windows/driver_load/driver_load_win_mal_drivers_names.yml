falsepositives:
- False positives may occur if one of the vulnerable driver names mentioned 
  above didn't change its name between versions. So always make sure that the 
  driver being loaded is the legitimate one and the non vulnerable version.
- If you experience a lot of FP you could comment the driver name or its exact 
  known legitimate location (when possible)
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the loading of known malicious drivers based on their filenames. Attackers may aim to establish persistence, escalate privileges, or carry out malicious activities like keylogging or system manipulation. The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1543.003)** and **Privilege Escalation (T1068)**. The primary telemetry source for this detection is the Windows Driver Load events, specifically pertaining to system-level activities around driver installations. If malicious, the loading of these drivers could lead to the installation of rootkits or other malware, significantly undermining system integrity. Importantly, this detection does NOT confirm malicious behavior on its own; it merely indicates the presence of potentially harmful driver names and demands further investigation.

  ### Investigation Steps

  - **Check driver load events:**
    Review Windows Event Logs, specifically Security Event ID **4688** (Process Creation) and Event ID **4902** (Driver Loaded). Look for processes that load listed driver filenames.

  - **Validate the source path of drivers:**
    Cross-reference the file path of the loaded driver against verified sources. Legitimate drivers typically reside in `C:\Windows\System32\drivers\`. Any load from unusual or temporary directories may indicate malicious intent.

  - **Identify running processes:**
    Use Sysinternals tools like Process Explorer or PowerShell commands to identify running processes that may have loaded these drivers. Document any unusual behavior associated with those processes.

  - **Investigate previous driver versions:**
    Search for records of legitimate driver versions corresponding to the filenames detected. If legitimate but older versions of drivers are found, this can explain false positives.

  - **Assess host criticality:**
    Determine the role of the affected host within the network. Critical assets such as domain controllers or databases warrant immediate escalation and further investigation.

  - **Search for established patterns of use:**
    Review historical telemetry for the affected host for known good behavior associated with the driver functions. Frequent loading of these drivers without legitimate purpose or system updates may point to malicious actions.

  ### Prioritization

  This alert should be treated with medium severity. The presence of malicious drivers can critically compromise system security and provide elevated privileges for attackers. Given the existing threat landscape, the likelihood of such drivers being leveraged for exploitation remains high.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion if attackers rename malicious drivers or use less-known variants not included in the detection list. Reliable detection requires ensuring all relevant driver loading logs are collected and configured correctly; absence of certain Event IDs may result in missed detections. Legitimate updates or system maintenance could trigger this alert if associated with vendor-specific driver installation. A companion detection to consider is monitoring for elevated privileges associated with the processes that load these drivers, reinforcing the investigation of potential exploitation attempts.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
