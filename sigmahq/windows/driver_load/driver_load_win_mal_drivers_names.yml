falsepositives:
- False positives may occur if one of the vulnerable driver names mentioned above
  didn't change its name between versions. So always make sure that the driver being
  loaded is the legitimate one and the non vulnerable version.
- If you experience a lot of FP you could comment the driver name or its exact known
  legitimate location (when possible)
level: medium
note: |
  ### Technical Context
  This detection rule identifies the loading of known malicious drivers by their file names on Windows systems. Malicious drivers can be leveraged by attackers to maintain persistence, escalate privileges, or achieve a range of malicious objectives, such as evading security controls and maintaining backdoor access to compromised systems. The presence of these drivers could suggest an ongoing compromise or an attempt to gain kernel-level control of a system.

  The rule is particularly relevant for monitoring techniques within the MITRE ATT&CK framework regarding persistence (T1543.003) and privilege escalation (T1068). Attackers might utilize these malicious drivers to inject malicious code into kernel memory, thereby bypassing user-level protections and allowing for stealthy operation within the environment.

  Primary data sources for effective detection include system logs related to driver loading, particularly from Windows Event Logs, which capture driver loading events, along with EDR telemetry that offers insights into process behaviors and actions taken by loaded drivers.

  ### Investigation Steps
  - **Review Driver Load Events:** Check system event logs for any instances of the identified driver names being loaded. Pay attention to the context around these events to identify unusual or unauthorized actions.
  - **Correlate with EDR Alerts:** Validate any detected driver loads against Endpoint Detection and Response (EDR) alerts that may indicate other suspicious activities on the same device, such as unexpected process creation or network connections.
  - **Examine System Behavior:** Investigate changes in system behavior following the loading of these drivers. Look for signs of data exfiltration, unusual application performance, or other anomalies that might suggest malicious intentions.
  - **Conduct an Asset Assessment:** Conduct a review of the affected system to determine the legitimacy of the driver and assess any potential impacts or further compromise stemming from its use. Ensure that the system is adequately protected and patched against vulnerabilities.

  ### Prioritization
  The severity of this alert is medium due to the notable impact of driver-level malware on enterprise environments, coupled with the likelihood of operational disruption and data loss if such drivers are actively being used by malicious actors.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the prevalence of legitimate drivers that share similar filenames or by undetected modifications to driver file names by sophisticated attackers. The detection logic assumes that the telemetry from Windows Event Logs and EDR tools is functioning correctly and providing comprehensive data on driver loads. Furthermore, adequate logging configuration and retention settings must be in place to ensure that all relevant events are captured for investigation.

