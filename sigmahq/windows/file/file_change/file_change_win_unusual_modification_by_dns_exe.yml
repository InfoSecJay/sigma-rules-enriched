  ### Technical Context

  This rule detects unexpected modifications to files by the `dns.exe` process, particularly targeting the `dns.log` file. Such behavior may suggest attempts at remote code execution or exploitation, especially concerning vulnerabilities like CVE-2020-1350 (SigRed). The relevant MITRE ATT&CK techniques include **Persistence (T1133)** and **Initial Access (T1078)**. Primary telemetry sources include Windows file change logs, specifically looking for events where `dns.exe` is the modifying process. If this activity is malicious, it could lead to further compromise of network services. Importantly, this detection does NOT confirm that a compromise has occurred on its own; it indicates suspicious behavior requiring further investigation.

  ### Investigation Steps

  - **Check file modification timestamps**: Verify the last modified timestamp of `C:\Windows\System32\dns.log` against known legitimate activity timelines for `dns.exe`. Legitimate DNS logging occurs at regular intervals based on service activity.

  - **Review process creation events**: Look for Security Event ID 4688 for `dns.exe`. Confirm that `dns.exe` started with expected arguments and from a legitimate parent process (e.g., `svchost.exe` or the DNS service).

  - **Analyze file modification details**: Inspect Security Event ID 4663 for detailed logs on modifications to `dns.log`. Look for signs of unauthorized changes, such as unusual content changes or patterns consistent with payload delivery.

  - **Correlate with network activity**: Monitor network traffic associated with the host running `dns.exe` using tools such as Wireshark or relevant IDS logs for suspicious outgoing connections (e.g., unusual DNS queries or connections to known malicious IPs).

  - **Identify indicative patterns**: Be aware that legitimate administrative tasks may involve altering DNS configurations, which can lead to similar modification events. Validate the user context of such actions to distinguish between benign administrative activities and potential compromise.

  ### Prioritization

  The severity of this alert is high due to the critical role of DNS services in an enterprise environment. Malicious behaviors reflected by this detection are commonly abused by adversaries for lateral movement or initial access, especially exploiting DNS processes. Given the potential impact on network operations, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  The detection may miss legitimate applications of `dns.exe` to log or modify files if they occur under normal operating conditions. Required log sources must be accurately configured for file change tracking. Variations in file modification by legitimate management tools could trigger this alert, necessitating a clear understanding of normal operational baselines. A related detection to consider is monitoring for unusual outbound DNS queries to identify lateral movement or data exfiltration efforts.

