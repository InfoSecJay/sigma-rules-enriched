note: |
  ### Technical Context
  This detection rule identifies the creation of files with the ".sed" extension, which are used by the Windows utility "iexpress.exe" to create self-extracting packages. The concern arises from the misuse of this utility by attackers who package malicious payloads into standalone executables. These self-extracting files can be leveraged for various malicious purposes, such as delivering malware, deploying backdoors, or facilitating persistence mechanisms.

  Attackers typically aim to evade detection while executing their disruptor activities, making the usage of tools like IExpress particularly appealing for crafting legitimate-looking packages that bypass traditional security measures. The rule is particularly applicable to the MITRE ATT&CK framework's techniques, including **Defense Evasion (T1218)**, which covers the use of system tools like IExpress to avoid detection and facilitate adversarial actions. The primary data sources for this detection include Windows file creation logs that capture executable file events and details surrounding file creation within the operating system.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine the logs of file executions to identify timestamps and user accounts associated with the creation of ".sed" files.
  - **Analyze the Executable:** If applicable, upload the detected ".sed" file to a malware analysis service to examine its contents and behavior. Look for embedded scripts or references to malicious URLs.
  - **Monitor for IExpress Usage:** Investigate system logs for instances of "iexpress.exe" execution and correlate this with the timing of the ".sed" file creation to establish a direct connection.
  - **Check Network Connections:** Assess the network activity associated with the user account that created the ".sed" file for connections to known malicious IP addresses or domains.

  ### Prioritization
  Alerts generated by the creation of ".sed" files should be treated with medium severity due to their potential use in deploying malware and circumventing security controls. While the occurrence of such files alone does not confirm malicious intent, the context of their creation demands immediate review due to their association with persistence and defense evasion tactics.

  ### Blind Spots and Assumptions
  This detection may not capture all `.sed` file creations if logging levels are not appropriately configured to record file events. The rule assumes that the presence of a ".sed" file is indicative of malicious intentions; however, benign applications using IExpress may also create these files. Additionally, a reliance on local logs means remote execution might evade detection if those logs are not collected consistently across the environment.

