note: |
  ### Technical Context

  This rule detects the creation of files with a ".sed" extension, which are typically associated with Self Extraction Directives used by the IExpress utility. Attackers exploit IExpress to package malicious payloads in a seemingly benign format, enabling the execution of potentially harmful executables. This behavior falls under the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution), which highlights the use of trusted binaries to execute untrusted code.

  The primary telemetry source for this detection is the Windows file system logs, specifically focusing on executable file creation events. If malicious, this behavior can lead to unauthorized execution of code that compromises system integrity or facilitates further exploitation. However, the detection does NOT confirm that the file is malicious on its own; further investigation is necessary to assess the context and content of the file.

  ### Investigation Steps

  - **Check file creation details**: Verify the `TargetFilename` from the file execution logs, specifically Windows Event ID 4663. Look for timestamps and user context. Legitimate activity would typically involve known users or processes creating ".sed" files for legitimate packaging.

  - **Analyze the file contents**: If possible, extract and review the contents of the suspected ".sed" file for suspicious indicators or embedded executables. Compare against known benign ".sed" files to identify discrepancies.

  - **Correlate process execution**: Investigate associated process creation events (Event ID 4688 / Sysmon Event ID 1) during the same timeframe. Any suspicious processes stemming from the creation of the ".sed" file should be flagged, especially if they execute unexpected commands or are unknown services.

  - **Review user account behavior**: Validate the legitimacy of the user account that initiated the file creation. Unusual accounts or new users without prior history of creating executables should be escalated to Tier 2 or 3 analysts for deeper investigation.

  - **Confirm file distribution**: Check for any network activity or file transfers related to the created ".sed" files. Look for signs of transfer to external IP addresses or networks, which could indicate an attempt to exfiltrate sensitive information or deliver payloads.

  ### Prioritization

  This alert has medium severity due to the potential high impact of exploited self-extracting packages on workflows and system integrity. The likelihood of malicious abuse is considerable, as the use of IExpress for embedding malware in benign formats is a common tactic among adversaries. Given the prevalence of this technique, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  Possible evasion techniques include attackers renaming malicious files to non-standard extensions or creating ".sed" files in ways that evade traditional file monitoring systems. Reliable detection requires proper logging for executable creations and assessments of all user activity on critical hosts. Legitimate software deployment tools or administrative scripts may trigger the alert. Companion detections related to anomalous process execution or file changes can bolster the efficacy of this detection coverage.

