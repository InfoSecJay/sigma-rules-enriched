note: |
  ### Technical Context

  This Sigma rule detects the creation of a new Outlook form, which is an activity often indicative of an attempt to establish persistence within an environment. Adversaries may leverage custom forms to execute malicious code whenever the form is accessed, allowing for unauthorized actions or data exfiltration. This activity aligns with the MITRE ATT&CK framework under the tactic "Persistence" and technique "Create or Modify System Process: Windows Service" (T1137.003).

  The primary telemetry source is the Windows file event logs, specifically targeting the events generated when Outlook attempts to create files in the specified directories (`\AppData\Local\Microsoft\FORMS\IPM` or `\Local Settings\Application Data\Microsoft\Forms`). If this behavior is malicious, it may lead to unauthorized access within the targeted system. Importantly, this detection does NOT confirm that the form is malicious on its own; it indicates potential malicious behavior requiring further investigation.

  ### Investigation Steps

  - **Examine created Outlook forms:** Review the directory `C:\Users\<username>\AppData\Local\Microsoft\FORMS\IPM\` for any newly created .oft files. Check their creation timestamps against recent user activity to identify potential anomalies.

  - **Identify the process responsible for the event:** Locate Windows Security Event ID 4688 (Process Creation) entries related to `outlook.exe` to pinpoint which user account initiated the creation of the form. Confirm whether the user was expected to be using Outlook at that time.

  - **Analyze form contents for malicious intent:** If a new form is detected, open it in a safe environment to analyze its contents for any embedded macros or malicious scripts. This can help differentiate between legitimate forms and potentially harmful ones.

  - **Check against known legitimate activity:** Review whether users in the environment have legitimate business processes that involve creating custom Outlook forms, and compare any similar historical activity for context.

  - **Look for patterns of abuse:** Investigate whether the same user account or system has previously shown anomalies associated with creating custom forms, such as excessive creation of forms or suspicious file attributes.

  ### Prioritization

  This alert should be considered high priority due to the significant security implications tied to the potential for establishing persistence on the affected system. The likelihood of abuse is moderate, as custom forms can be weaponized effectively, though they may not always indicate malicious intention.

  ### Blind Spots and Assumptions

  Some limitations include the possibility of legitimate user activity triggering this detection, leading to false positives. Organizations need to ensure that they have enabled detailed file event logging to reliably capture this behavior. Additionally, be aware that legitimate automation or workflows within the organization might unavoidably trigger this alert. A related detection to consider is monitoring for abnormal Outlook macro execution, which can strengthen overall detection capabilities against this persistence vector.

