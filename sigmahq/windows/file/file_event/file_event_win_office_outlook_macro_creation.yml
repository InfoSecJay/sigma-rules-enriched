  ### Technical Context

  This Sigma rule detects the creation of a Visual Basic for Applications (VBA) macro file within Microsoft Outlook, specifically targeting the "VbaProject.OTM" file. The likely attacker objective is to establish persistence through macro-based techniques that can allow for automated malicious actions whenever Outlook is used. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Office Application Startup (T1137).

  The primary telemetry source is Windows file creation logs, particularly focused on event types involving Outlook executable (outlook.exe) and file system changes corresponding to macro files. If malicious, this behavior could allow an adversary to execute arbitrary code upon opening emails or interacting with Outlook. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate users may create macros for valid purposes.

  ### Investigation Steps

  - **Assess the workload of Outlook users:** Review user activity logs to establish if the user who created the macro typically engages in activities that require custom macros, like automation for reports or mass email campaigns.

  - **Analyze file creation events:** Examine Windows Security Event ID 4663 (Object Access) and check for "TargetFilename" ending with '\Microsoft\Outlook\VbaProject.OTM' and the associated "Image" value as '\outlook.exe'.

  - **Identify macro content if applicable:** If the macro file is traceable, extract and inspect the macro code within "VbaProject.OTM" for malicious commands or unusual patterns, referencing specifics such as 'Application.Run' for remote code execution.

  - **Check for associated outbound communications:** If the macro is likely to connect to a command-and-control server, monitor network logs for unusual traffic initiated by Outlook during the timeframe of macro creation, especially external HTTP(S) requests.

  - **Evaluate the presence of related detections:** Investigate companion alerts (e.g., suspicious execution of commands from Outlook) listed in the related detection ID (117d3d3a-755c-4a61-b23e-9171146d094c) for corroborating evidence pointing towards malicious activity.

  ### Prioritization

  The alert severity is medium due to the potential impact of automated malicious execution on user systems, particularly as Outlook is widely used across enterprises. However, there is a moderate likelihood of abuse, given that creating macros can serve legitimate purposes. This behavior is not uncommon in sophisticated attacks whereby trojanized documents utilize such techniques.

  ### Blind Spots and Assumptions

  This detection has limitations, as legitimate users can create macros for benign purposes, which may lead to false positives. Comprehensive logging of Windows file creations must be enabled for reliable detection. Furthermore, macro usage is often common, so benign activities in development or IT roles might trigger this alert. A related detection that strengthens coverage would include monitoring for later executions of these macros to catch potential malicious activity.

