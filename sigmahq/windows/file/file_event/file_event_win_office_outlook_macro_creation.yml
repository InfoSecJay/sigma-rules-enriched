  ---

  ### Technical Context

  This rule detects the creation of a macro file (`VbaProject.OTM`) within Microsoft Outlook, which is often leveraged by attackers to implement malicious scripts for persistence or command-and-control purposes. The likely attacker objective in creating such a macro is to execute arbitrary code when the victim opens their Outlook, which could lead to data exfiltration or further exploitation of the system. This activity aligns with the MITRE ATT&CK tactics of Persistence (T1546) and Command and Control (T1071), specifically under the techniques for Malicious Macro (T1137) and Trusted Relationship Abuse (T1008).

  The primary telemetry source is file events related to Microsoft Outlook running on Windows systems. Specifically, Event ID 4663 from Security logs can be used to monitor creation activities along with file events indicating the generation of the target filename. If malicious, the security impact may include data breaches, unauthorized access, or system compromise. This detection does NOT confirm malicious intent on its own; legitimate users may create macros for automation purposes.

  ---

  ### Investigation Steps

  - **Check file creation event for VbaProject.OTM:** Review Security Event ID 4663 logs for file creation events where the TargetFilename matches `\Microsoft\Outlook\VbaProject.OTM`. Identify the user account and timestamp for initial context.

  - **Analyze the user’s recent activity:** Investigate the user’s recent behavior in Exchange or Outlook logs for any unusual or suspicious email activity correlating with the macro creation event (e.g., Event ID 4002 for Outlook client logs).

  - **Validate legitimate macro use:** Determine if the user has a documented business need for creating macros. Review internal policy compliance regarding macro usage and assess whether any training or authorization was previously established.

  - **Monitor for subsequent execution attempts:** Look for subsequent execution of the macro or scripts in the Outlook VBA environment, checking for unusual API calls or command line invocations via Event ID 4688 pertaining to outlook.exe.

  - **Identify high-confidence malicious indicators:** Search for indicators of compromise by inspecting if the macro attempts to access network resources or initiate PowerShell commands indicative of a C2 communication (e.g., analyze any `powershell.exe` events occurring after the macro's creation).

  - **Evaluate affected asset's criticality:** Assess the role of the asset on which the macro was created. For example, if it is a system managing sensitive customer data, it requires immediate escalation and deeper investigation due to the elevated risk.

  ---

  ### Prioritization

  This alert warrants medium priority due to the potential risk of macro exploitation on Outlook, which is a common attack vector. The impact on information confidentiality and integrity can be significant, especially if macros facilitate unauthorized access to sensitive data. Although not all macros are malicious, the likelihood of abuse remains high, making rapid investigation critical.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited as adversaries can disguise malicious macros or utilize benign-looking names. Coverage relies on properly configured security logging and auditing for file creations (Event ID 4663). Legitimate user behavior, such as creating macros for routine tasks, may trigger false positives. A companion detection to strengthen coverage includes monitoring for unsanctioned PowerShell activity (T1059.001) associated with the created macro.

