  ---

  ### Technical Context

  This rule detects the creation of a malicious DLL file named "iphlpapi.dll" within the local Microsoft application directories associated with OneDrive or Teams. The likely objective of an attacker is to execute this compromised DLL via sideloading when users launch the targeted applications, enabling persistence and potentially escalating privileges. This behavior aligns with the MITRE ATT&CK technique for DLL sideloading (T1574.001).

  The primary telemetry source is Windows file event logs, capturing file creation events in user-specific directories. If successful, malicious side-loading can lead to unauthorized access and data exfiltration. It is crucial to note that this detection does not confirm that the DLL was executed or that other associated malicious actions have occurred.

  ---

  ### Investigation Steps

  - **Review Event Logs for Suspicious DLL Creation**: Check Windows Security Event ID 4663 (File Created) for records indicating the creation of "iphlpapi.dll" in `C:\Users\<User>\AppData\Local\Microsoft`. Confirm timestamps align with the alert.

  - **Check for Execution of Malicious DLL**: Investigate whether "iphlpapi.dll" was loaded by the Teams (`Teams.exe`) or OneDrive (`OneDrive.exe`) processes using Sysmon Event ID 7 (Image Loaded), which should contain references to any anomalous DLL loads.

  - **Identify Legitimate Usage Patterns**: Observe typical user processes associated with legitimate Teams or OneDrive operations, ensuring they align with the expected operational timestamps and source paths (usually involving user home directories).

  - **Assess User Context**: Evaluate the user context associated with the event, including their role within the organization. Focus on critical assets or sensitive data environments that could suffer from potential breaches if compromised.

  - **Correlate with Other Activity Logs**: Look for signs of lateral movement or commands executed via PowerShell (Event ID 4104) around the same time to identify if the DLL creation is part of a broader malicious campaign.

  - **Validate Artifacts or Exfiltration Files**: Check for any uncommon file types or suspicious .exe files created within the same directory or associated paths, as successful exploitation often leads to the creation of additional malicious artifacts for data exfiltration.

  ---

  ### Prioritization

  Given that the detection relates to the execution of a malicious DLL within critical collaboration applications, the alert should be considered high priority. The likelihood of malicious behavior is significant, as DLL sideloading is a technique commonly leveraged by attackers for persistence and privilege escalation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by configurations not capturing certain file events or obfuscated file pathways. Legitimate applications might trigger similar alerts during normal operation, such as updates or plugins being downloaded. A related detection that enhances coverage is monitoring PowerShell activity for unusual commands or behaviors indicative of DLL loading (e.g., using Tactic `Defense Evasion – T1562`).

