note: |
  ### Technical Context

  This Sigma rule detects the creation of a malicious DLL file named "iphlpapi.dll" within the OneDrive or Teams folder on Windows systems. The likely attacker objective is to utilize DLL sideloading techniques to execute malicious code when applications such as Teams or OneDrive are launched, achieving persistence and potentially escalating privileges. This behavior aligns with the MITRE ATT&CK technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources for this detection are file event logs for Windows, specifically looking for the presence of the specified DLL file in the folders associated with Microsoft Teams or OneDrive. If malicious, this activity could lead to unauthorized actions on the network or system compromise. It is important to note that this detection does not alone confirm malicious intent; further investigation is necessary to understand the context and impact.

  ### Investigation Steps

  - **Verify file creation timestamp:** Check the creation time of "iphlpapi.dll" in `C:\Users\<Username>\AppData\Local\Microsoft\Teams` or `C:\Users\<Username>\OneDrive` using File Event logs (Event ID 4663). Compare this timestamp with application usage logs to establish if the DLL was created during an operational window.

  - **Review process execution logs:** Inspect Security Event ID 4688 or Sysmon Event ID 1 for any instances of 'Teams.exe' or 'OneDrive.exe' executed in close temporal proximity to the creation of "iphlpapi.dll." Look for command line arguments that might hint at the loading of this DLL.

  - **Correlate with user activity:** Check user activity and authentication logs (e.g., Azure AD sign-ins) to validate if the user was legitimately accessing Teams or OneDrive when the DLL was created. Recognizing expected usage patterns can help identify benign cases.

  - **Identify high-confidence malicious indicators:** Look for the execution of "Teams.exe" or "OneDrive.exe" shortly after the creation of "iphlpapi.dll" with process parent-child relationships indicating forced execution or unusual parent processes (e.g., known malicious software).

  - **Evaluate for prior incidents:** Review for historical occurrences of similar file signatures (e.g., "iphlpapi.dll") within the environment that may have triggered the rule previously. Using Endpoint Detection and Response (EDR) tools may reveal patterns in this behavior across multiple endpoints.

  ### Prioritization

  This alert should be treated with high severity due to the potential security impact on critical enterprise collaboration tools. The likelihood of malicious abuse through DLL sideloading is significant, given its historical weaponization in targeted attacks. Prompt investigation is essential as this behavior could facilitate more significant malware infections or data breaches.

  ### Blind Spots and Assumptions

  Detection may be limited by systems with misconfigured logging that does not capture file event logs effectively. Adversaries could employ evasion techniques such as renaming the DLL or obfuscating it through encryption. Additionally, legitimate applications might trigger this alert during software updates or migrations related to Teams or OneDrive. Strengthening coverage could involve implementing companion detections for anomalous application behaviors in conjunction with monitoring for suspicious file modifications in application directories.

