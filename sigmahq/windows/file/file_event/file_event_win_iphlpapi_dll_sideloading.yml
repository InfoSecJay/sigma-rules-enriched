note: |
  ### Technical Context

  This Sigma rule detects the creation of a malicious DLL file named “iphlpapi.dll” specifically within the OneDrive or Teams application directories. The primary objective of this activity is to achieve persistence or privilege escalation through DLL sideloading, where the attacker manipulates a trusted application to load a malicious DLL instead of the legitimate one when executed. This technique aligns with MITRE ATT&CK's Tactic: Execution (TA0040), specifically Technique T1574.001 (DLL Side-Loading).

  The primary telemetry sources for this detection are Windows file event logs, specifically focusing on file creation events in user-specific application directories—namely, `AppData\Local\Microsoft`. If malicious, this behavior can lead to unauthorized actions being performed on the system, compromising data integrity and confidentiality. It is critical to note that detection alone does not confirm intent; legitimate applications might also create files in the same directory.

  ### Investigation Steps

  - **Check the file creation logs:** Review Event ID 4663 in Windows Security logs for access attempts to `iphlpapi.dll` in the `C:\Users\<username>\AppData\Local\Microsoft` directory.

  - **Review process activity:** Look for Sysmon Event ID 1 (Process Creation) that references the execution of a Teams or OneDrive process. Ensure it corresponds to a known legitimate user workflow.

  - **Validate DLL integrity:** Use a checksum tool to verify the hash of the detected `iphlpapi.dll`. Legitimate versions should match the expected hash values from Microsoft resources.

  - **Evaluate user behavior:** Assess user activities leading to the creation of this DLL. Identify the legitimate applications being executed prior to the file creation; for example, a sanctioned update of Teams or OneDrive in a corporate environment.

  - **Cross-reference with known bad signatures:** Use antivirus or endpoint detection tools to cross-check the created DLL against a threat intelligence database to identify if it matches previously documented malicious binaries.

  - **Determine persistence mechanisms:** Investigate for Registry modifications (e.g., entries in `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`) that indicate persistence strategies being employed by the detected DLL.

  ### Prioritization

  This alert is high severity due to the potential impact on critical systems where Teams or OneDrive is used, especially in collaborative environments. The likelihood of abuse is significant, as DLL sideloading is a commonly exploited technique in targeted attacks, often leading to broader system compromises.

  ### Blind Spots and Assumptions

  Detection may be limited by the variability in file names or locations used by attackers, as they could utilize different legitimate DLL names or paths. Reliable detection requires the logging of file creation events and potential execution logs from security monitoring tools. Additional legitimate processes, such as application updates, can trigger this alert without malicious intent. A companion detection worth considering is monitoring for abnormal usage patterns of Teams and OneDrive APIs, which could provide further context around suspicious behavior.

