detection:
  selection:
    TargetFilename|endswith:
    - ':\$Recycle.Bin.exe'
    - ':\Documents and Settings.exe'
    - ':\MSOCache.exe'
    - ':\PerfLogs.exe'
    - ':\Recovery.exe'
    - '.bat.exe'
    - '.sys.exe'
  condition: selection
