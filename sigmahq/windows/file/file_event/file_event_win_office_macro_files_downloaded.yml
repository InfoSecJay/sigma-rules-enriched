  condition: all of selection_*
falsepositives:
- Legitimate macro files downloaded from the internet
- Legitimate macro files sent as attachments via emails
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of macro-enabled Office files (e.g., .docm, .xlsm) via specific applications like email clients and web browsers. The likely attacker objective is to deliver malicious payloads through these documents, which may exploit vulnerabilities in Microsoft Office when macros are enabled. It falls under the MITRE ATT&CK tactic of Initial Access, specifically the technique T1566.001 (Phishing: Malicious File). The primary telemetry source is Windows file event logs, focusing on file creation events related to macro-enabled formats. If malicious, this activity could lead to system compromise or data exfiltration. Importantly, the detection does not confirm the execution of the macros or their malicious intent without further analysis.

  ---

  ### Investigation Steps

  - **Identify the process initiating the file creation:** Review file event logs (Event ID 4663) to determine the parent process responsible for creating the macro files. Look for known applications such as `RuntimeBroker.exe`, `outlook.exe`, or any browser listed.

  - **Examine file creation timestamps:** Cross-reference the creation time of detected macro files with the process logs to verify whether they were downloaded or executed during expected behavior timeframes for the identified applications.

  - **Check for digital signatures:** Investigate the file properties to see if the macro-enabled file has a valid digital signature. Legitimate files tend to have reputable publisher signatures, while malicious files may lack this or show suspicious signers.

  - **Review common download locations:** Validate the paths where the macro files were created. Legitimate downloads typically occur in `C:\Users\<username>\Downloads`, whereas unexpected folders may indicate malicious activity.

  - **Correlate with user activity:** Identify if the user intended to download the file by examining their recent email activity or browsing history. Look for patterns such as email attachments or URLs clicked that led to the file creation.

  - **Identify high-confidence malicious indicators:** Search for the presence of embedded macros within the created files (e.g., via VBA scripts or unusual file properties). Use tools like antivirus or macro-execution analysis for verification.

  ---

  ### Prioritization

  The alert severity is considered low but should be evaluated in context. The affected systems could include critical assets if enabling macros unwittingly. While macro attacks are commonly weaponized in phishing attempts, not all detected instances signify malicious payload delivery without further investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may overlook file downloads via other legitimate applications or hindered by user policies that do not log certain file events. Reliable detection requires proper configurations for file event logging and may produce false positives if legitimate macro files are frequently shared. A related detection, such as monitoring actual macro execution (e.g., via Sysmon Event ID 1), could provide additional insight into whether the macros are being executed, strengthening coverage against malicious activity.

