detection:
  selection_processes:
    Image|endswith:
            # Email clients
    - '\RuntimeBroker.exe'         # Windows Email clients uses RuntimeBroker to create the files
    - '\outlook.exe'
    - '\thunderbird.exe'
            # Browsers
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\iexplore.exe'
    - '\maxthon.exe'
    - '\MicrosoftEdge.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\opera.exe'
    - '\safari.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    - '\whale.exe'
  selection_ext:
  - TargetFilename|endswith:
    - '.docm'
    - '.dotm'
    - '.xlsm'
    - '.xltm'
    - '.potm'
    - '.pptm'
  - TargetFilename|contains:
    - '.docm:Zone'
    - '.dotm:Zone'
    - '.xlsm:Zone'
    - '.xltm:Zone'
    - '.potm:Zone'
