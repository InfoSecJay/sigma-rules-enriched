  type: similar
status: test
description: |
  Detects the creation of a new office macro files on the system via an application (browser, mail client).
  This can help identify potential malicious activity, such as the download of macro-enabled documents that could be used for exploitation.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1566.001/T1566.001.md
- https://learn.microsoft.com/en-us/deployoffice/compat/office-file-format-reference
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-23
modified: 2025-10-29
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  category: file_event
  product: windows
detection:
  selection_processes:
    Image|endswith:
            # Email clients
    - '\RuntimeBroker.exe'         # Windows Email clients uses RuntimeBroker to create the files
    - '\outlook.exe'
    - '\thunderbird.exe'
            # Browsers
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\iexplore.exe'
    - '\maxthon.exe'
    - '\MicrosoftEdge.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\opera.exe'
    - '\safari.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    - '\whale.exe'
  selection_ext:
  - TargetFilename|endswith:
    - '.docm'
    - '.dotm'
    - '.xlsm'
    - '.xltm'
    - '.potm'
    - '.pptm'
  - TargetFilename|contains:
    - '.docm:Zone'
    - '.dotm:Zone'
    - '.xlsm:Zone'
    - '.xltm:Zone'
    - '.potm:Zone'
    - '.pptm:Zone'
  condition: all of selection_*
falsepositives:
- Legitimate macro files downloaded from the internet
- Legitimate macro files sent as attachments via emails
level: low
note: |
  ### Technical Context

  This rule detects the creation of macro-enabled Office files (e.g., .docm, .xlsm) that may indicate the downloading of potentially malicious documents via email clients or web browsers. The attacker’s objective is likely to execute malicious macros that could compromise the victim’s system, potentially leading to data exfiltration or lateral movement within the network. This activity relates to the MITRE ATT&CK tactic of Initial Access, technique T1566.001 (Phishing: Spear Phishing Attachment). The primary telemetry sources for this detection are Windows file events generated by process activities in the system. If malicious, this behavior can lead to compromise of sensitive information and broader access to network resources. Importantly, this detection does NOT confirm that a malicious macro was executed—only that a macro-enabled file was created.

  ### Investigation Steps

  - **Check process origins:** Validate the Event IDs related to file creation (e.g., Windows Security Event ID 4663) to determine the processes (e.g., RuntimeBroker.exe, outlook.exe) initiating the macro file creation. Confirm if these processes are running from expected paths.

  - **Analyze the file's download context:** Review the telemetry for the specific files created by checking the CreationTime, TargetFilename, and Action fields. Look for any file names that include "Zone" to indicate downloaded files from potentially unsafe internet sources.

  - **Identify known malicious indicators:** Look for file paths or names that have previously been associated with malicious documents or are listed in threat intelligence feeds. Evaluate the download source to see if it matches any known phishing domains.

  - **Review legitimate user behavior:** Compare the created files against user behavior. For example, legitimate users may download such files from known vendors or educational resources, while alerts triggered from unrecognized or suspicious contexts should be flagged for further analysis.

  - **Assess system role impact:** Consider the importance of the affected system (e.g., if it's a high-privilege account or critical server). Investigate any subsequent activities that could indicate lateral movement or unauthorized access attempts stemming from this download.

  ### Prioritization

  This alert is regarded as low severity primarily due to the frequent occurrence of legitimate activities involving macro-enabled file downloads. However, the context of such downloads can increase risk, especially if occurring on sensitive or high-privilege assets that could be exploited in more sophisticated attacks.

  ### Blind Spots and Assumptions

  Detecting a macro file creation does not account for user behaviors that may be legitimate but could still trigger the alert, such as typical email use or trusted downloads. The detection may miss instances where users disable logging or where file logs are not captured effectively. Additionally, legitimate automation tools may generate similar files, so further correlation is required. A complementary detection method could be the monitoring of macro execution on host machines, such as analyzing Event ID 4688 for new process creation for Office apps after macro-enabled file creation.

