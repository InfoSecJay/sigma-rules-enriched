status: test
description: |
  Detects the creation of a new office macro files on the system via an application (browser, mail client).
  This can help identify potential malicious activity, such as the download of macro-enabled documents that could be used for exploitation.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1566.001/T1566.001.md
- https://learn.microsoft.com/en-us/deployoffice/compat/office-file-format-reference
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-23
modified: 2025-10-29
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  category: file_event
  product: windows
detection:
  selection_processes:
    Image|endswith:
            # Email clients
    - '\RuntimeBroker.exe'         # Windows Email clients uses RuntimeBroker to create the files
    - '\outlook.exe'
    - '\thunderbird.exe'
            # Browsers
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\iexplore.exe'
    - '\maxthon.exe'
    - '\MicrosoftEdge.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\opera.exe'
    - '\safari.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    - '\whale.exe'
  selection_ext:
  - TargetFilename|endswith:
    - '.docm'
    - '.dotm'
    - '.xlsm'
    - '.xltm'
    - '.potm'
    - '.pptm'
  - TargetFilename|contains:
    - '.docm:Zone'
    - '.dotm:Zone'
    - '.xlsm:Zone'
    - '.xltm:Zone'
    - '.potm:Zone'
    - '.pptm:Zone'
  condition: all of selection_*
falsepositives:
- Legitimate macro files downloaded from the internet
- Legitimate macro files sent as attachments via emails
level: low
note: |
  ### Technical Context
  This detection rule identifies the creation of new Office macro files on a Windows system, initiated by processes commonly associated with email clients and web browsers. Such macro files, which include extensions like `.docm` and `.xlsm`, can be exploited by attackers to execute malicious code, often as part of phishing campaigns that trick users into enabling macros. The primary attacker objective is typically to gain control over the victim's system or to exfiltrate sensitive data.

  The relevant tactics and techniques from the MITRE ATT&CK framework include **Initial Access** (TA0001) through **Phishing: Spear Phishing Attachment** (T1566.001). Attackers may use social engineering tactics to deliver macro-enabled documents to victims in hopes of executing embedded malicious code when macros are enabled. The primary data sources that will provide evidence for this detection include file creation events logged by the operating system, particularly those indicating the creation of files with macro-enabled extensions, along with associated process logs showing the applications responsible for the download.

  ### Investigation Steps
  - **Review File Creation Logs**: Check file event logs in Windows to identify any files created with macro-enabled extensions (`.docm`, `.xlsm`, etc.). Focus on the creation time and the user account responsible for the file creation.

  - **Correlate Process Logs**: Investigate process creation events to identify if the file was created by any suspicious or atypical applications, specifically looking for the listed email clients and browsers in the detection rule.

  - **Analyze Email and Web Traffic**: Examine logs from email clients and web browser activities to look for any emails or downloads that may have included macro-enabled attachments. Assess the sender and URL for any signs of phishing.

  - **Check for User Interaction**: If a macro-enabled file is found, determine whether the user interacted with it (such as enabling macros) to further assess potential compromise or exploitation.

  ### Prioritization
  The alert holds a low-severity rating in an enterprise environment due to the potential for legitimate use of macro-enabled files. However, monitoring is crucial, as adversaries frequently use such files as a means of delivery for malware, making them a common target in phishing attacks.

  ### Blind Spots and Assumptions
  This detection logic may miss instances where macro files are created through less common applications or legitimate macro files downloaded from trusted sources, leading to false positives. It assumes that file creation events and process logs are enabled and accessible on the monitored systems. If these logs are not properly aggregated or collected, the rule may not function effectively, potentially leaving the environment susceptible to exploitation through macro-enabled documents.

