note: |
  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) using an NTFS reparse point through the manipulation of a specific DLL file (`api-ms-win-core-kernel32-legacy-l1.DLL`). The likely attacker objective is to escalate privileges by leveraging the ability to execute malicious code with higher permissions on a compromised system. This activity aligns with the MITRE ATT&CK technique T1548.002 (Bypass User Access Control). The primary telemetry source for this rule is Windows file event logs, specifically monitoring file system activities in user directories. If malicious, this could allow an attacker to run unauthorized processes with elevated privileges, significantly impacting system integrity and security. However, this detection alone does not confirm that a successful privilege escalation has occurred; additional investigation is warranted.

  ### Investigation Steps

  - **Review file event logs:** Query Event ID 4663 and filter for `TargetFilename` that starts with `C:\Users\` and ends with `\AppData\Local\Temp\api-ms-win-core-kernel32-legacy-l1.DLL` to identify attempts to access or modify the targeted DLL file.

  - **Correlate with process creation events:** Check Security Event ID 4688 (Process Creation) logs around the same timestamp for suspicious process launches, particularly those involving `wusa.exe` or other known utility tools that could be misused (e.g., `cmd.exe`, `powershell.exe`).

  - **Identify legitimate usage patterns:** Validate whether the user associated with the alert regularly interacts with files in the `Temp` directory or runs system updates, as legitimate users may access similar files legitimately during routine operations.

  - **Examine permissions for targeting user directories:** Review NTFS permissions on the `C:\Users\<username>\AppData\Local\Temp` directory to identify unusual granting or modification and validate normal user access.

  - **Look for lateral movement indicators:** Correlate log entries with network activity (Windows Event ID 5156: Windows Filtering Platform) that may indicate connections to unusual or unauthorized remote threats during the same time frame as the elevated privilege attempts.

  ### Prioritization

  This alert holds high severity due to the potential for significant impact on critical systems through unauthorized privilege escalation. The nature of UAC bypass techniques suggests a high likelihood of malicious intent, as such behaviors are commonly exploited in targeted attacks to gain higher access privileges.

  ### Blind Spots and Assumptions

  The detection may miss similar UAC bypass attempts that do not utilize the specific DLL pattern identified in this rule. Consistent monitoring of file events and the inclusion of file integrity monitoring tools is necessary for robust coverage. Legitimate admin tasks, such as software installations or updates that may manipulate files in the temp directory, could trigger this alert. Enhancing coverage with companion detections for unusual command-line arguments or known persistence mechanisms may improve investigative context.

