  ### Technical Context

  This rule detects the use of NTFS reparse points to facilitate a User Account Control (UAC) bypass via DLL hijacking, specifically targeting the `wusa.exe` executable. The likely attacker objective is to escalate privileges on a Windows system by tricking the system into executing a malicious DLL while bypassing UAC protections. This behavior aligns with the MITRE ATT&CK tactic for Privilege Escalation, specifically technique T1548.002 (UAC Bypass, Reparse Point).

  The primary telemetry sources include Windows File Event logs that capture file access and modification events, with a focus on paths that indicate malicious activity, specifically within the user’s local Temp directory. If successful, this attack would allow an adversary to gain elevated permissions, significantly impacting the integrity and confidentiality of the system. It’s important to note that this detection does NOT confirm exploitation on its own; further investigation is necessary to determine if the UAC bypass was successful or if the action was benign.

  ### Investigation Steps

  - **Identify the suspicious DLL file creation:** Examine File Event logs for any entries indicating access to or the creation of `api-ms-win-core-kernel32-legacy-l1.DLL` in `C:\Users\<username>\AppData\Local\Temp\`. Look for Event ID 4663 (Access Attempt) and focus on actions involving this specific filename.

  - **Check for parent process correlation:** Look for any events indicating that `wusa.exe` initiated the `api-ms-win-core-kernel32-legacy-l1.DLL` file during execution. Cross-reference Event ID 4656 (Handle Access) for the parent process association, specifically `wusa.exe`.

  - **Review normal UAC behavior:** Verify legitimate usage patterns for `wusa.exe`. Common legitimate activity includes Windows Update installations, typically occurring in scheduled updates or system patches, which will not involve the creation of the aforementioned DLL.

  - **Investigate for additional payloads:** Search for any related reparse point activity within the Temp directory, especially if other DLL files were created or modified around the same timestamp. Cross-reference against known benign files to identify potential signs of multiple payloads.

  - **Monitor for ongoing suspicious activity:** If a suspected DLL hijack is identified, check the system for signs of persistence via other scheduled tasks or unusual registry modifications, specifically looking at Event IDs 4697 (Service Installation) or 4688 (Process Creation) to detect further attempts at privilege escalation.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on elevated privileges, which can lead to significant data breaches or system compromise. The likelihood of malicious abuse is high due to the known exploitation techniques utilizing UAC bypass methods. The behavior is recognized as a common tactic used by threat actors to escalate privileges on compromised machines.

  ### Blind Spots and Assumptions

  There may be limitations in detection based on log configurations; if Windows File Auditing is not enabled for the Temp directory, relevant activities may go unnoticed. Legitimate installer activities by trusted applications can trigger this alert, potentially leading to false positives. It is crucial to run companion detections focused on process creation and modification patterns, such as monitoring for unusual command line arguments in Event ID 4688, to enhance detection capabilities against UAC bypass methods.

