note: |
  ### Technical Context
  This detection rule is designed to identify potential bypass of User Account Control (UAC) mechanisms through the exploitation of NTFS reparse points and the hijacking of system DLLs using the `wusa.exe` executable. Attackers may employ this technique to escalate privileges and execute unauthorized actions on a compromised Windows system, making it a significant security concern for enterprises. The UAC bypass via NTFS reparse points is often associated with persistence mechanisms, allowing threat actors to maintain control over systems despite mitigation efforts.

  The primary objective of attackers leveraging this technique is to perform privilege escalation and evade detection by launching malicious payloads with elevated permissions without triggering standard security controls. Within the context of MITRE ATT&CK, this detection corresponds to the tactics of **Defense Evasion** and **Privilege Escalation**, specifically under technique **T1548.002: abuse elevation control mechanisms**.

  Key data sources for evidence collection include file event logs that track changes to NTFS file system objects, particularly DLL files in user-specific application data directories. Monitoring these logs can provide vital indicators of unauthorized file manipulation associated with UAC bypass attempts.

  ### Investigation Steps
  - **Review File Event Logs:** Examine logs for any recent modifications to files within `C:\Users\<username>\AppData\Local\Temp`. Focus on entries showing attempts to manipulate the identified DLL file (`api-ms-win-core-kernel32-legacy-l1.DLL`).

  - **Correlate Process Activity:** Assess process creation events around the time of the detected file event. Look for instances of `wusa.exe` or other unusual processes that may indicate exploitation attempts.

  - **Analyze User Behavior:** Investigate user account activities, specifically those showing unusual patterns of privilege escalation or access to sensitive resources post-event detection. This can help determine if an attacker executed a UAC bypass.

  - **Check for Reparse Points:** Use tools to analyze and identify any suspicious NTFS reparse points that may have been created or modified in the user directories; these could indicate attempts to redirect file operations maliciously.

  ### Prioritization
  Given the severe implications of privilege escalation and the potential for further exploitation of the environment, alerts generated by this detection rule should be treated with high priority. Any indication of UAC bypass methods directly threatens the security posture of the enterprise.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage arises if attackers employ less common DLL file names or techniques distinct from those outlined in this rule. Additionally, the detection relies heavily on the presence of comprehensive file event logging; systems configured not to log these events may miss crucial signs of compromise. Assumptions made include that the attacker will employ identifiable patterns related to `wusa.exe` and typical file manipulation behavior; variations may lead to false negatives. Proper logging configurations must be ensured for the alert to function effectively.

