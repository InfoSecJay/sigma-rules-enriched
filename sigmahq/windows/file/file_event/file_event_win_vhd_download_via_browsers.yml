title: VHD Image Download Via Browser
id: 8468111a-ef07-4654-903b-b863a80bbc95
status: test
description: |
  Detects creation of ".vhd"/".vhdx" files by browser processes.
  Malware can use mountable Virtual Hard Disk ".vhd" files to encapsulate payloads and evade security controls.
references:
- https://redcanary.com/blog/intelligence-insights-october-2021/
- https://www.kaspersky.com/blog/lazarus-vhd-ransomware/36559/
- https://securelist.com/lazarus-on-the-hunt-for-big-game/97757/
author: frack113, Christopher Peacock '@securepeacock', SCYTHE '@scythe_io'
date: 2021-10-25
modified: 2023-05-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\iexplore.exe'
    - '\maxthon.exe'
    - '\MicrosoftEdge.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\opera.exe'
    - '\safari.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    - '\whale.exe'
        # We don't use "endswith" to also match with ADS logs and ".vhdx". Example: "TargetFilename: C:\Users\xxx\Downloads\windows.vhd:Zone.Identifier"
    TargetFilename|contains: '.vhd'
  condition: selection
falsepositives:
- Legitimate downloads of ".vhd" files would also trigger this
level: medium
note: |
  ### Technical Context
  This rule detects the creation of Virtual Hard Disk (VHD) files, which can be utilized by malicious actors to encapsulate payloads and bypass security mechanisms. Attackers may download these files through common web browsers to avoid detection and subsequent analysis by security tools. VHD files provide a way to deliver malware with stealth, as they can appear as benign downloadable content while containing harmful payloads.

  The likely threat scenario involves attackers leveraging sophisticated tactics to deliver malware. Notably, groups like Lazarus have been known to use VHD files in their operations. This behavior may indicate an attempted compromise with the objective of deploying ransomware or other forms of malware. The relevant MITRE ATT&CK tactics and techniques include “Resource Development” (TA0042) and “Software from the Internet” (T1587.001).

  The primary data sources for this rule include file event logs on Windows systems, which track file creations and modifications, providing critical insights into potentially malicious activities involving file downloads.

  ### Investigation Steps
  - **Collect File Event Logs:** Gather file event logs from affected systems to examine the creation of any VHD or VHDX files associated with browser processes.
  - **Review User Activity:** Investigate the user accounts associated with the creation of these files to determine if there are any indicators of compromise or unusual behavior in their recent activities.
  - **Analyze Browser Downloads:** Look into the download history of the browsers specified in the detection logic for any downloaded VHD files and assess the legitimacy of source domains.
  - **Correlate with Other Alerts:** Cross-reference the findings with other alerts or security incidents to assess if the download is part of a larger attack pattern that may include lateral movement or privilege escalation.

  ### Prioritization
  This alert is of medium severity due to the potential risk posed by the use of VHD files to deliver malware, such as ransomware. The likelihood of exploitation is elevated because attackers actively utilize such methods to obfuscate their activities.

  ### Blind Spots and Assumptions
  One significant detection gap is the potential for legitimate downloads of VHD files to trigger the alert, which could lead to an increased number of false positives. The detection logic assumes that all relevant browsers will generate file creation events in a consistent manner. Required logs include accurate file event tracking, and configurations should ensure that browser download activities are logged correctly for analysis. Without this data, the efficacy of the rule may be diminished.

