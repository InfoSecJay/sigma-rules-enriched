title: VHD Image Download Via Browser
id: 8468111a-ef07-4654-903b-b863a80bbc95
status: test
description: |
  Detects creation of ".vhd"/".vhdx" files by browser processes.
  Malware can use mountable Virtual Hard Disk ".vhd" files to encapsulate payloads and evade security controls.
references:
- https://redcanary.com/blog/intelligence-insights-october-2021/
- https://www.kaspersky.com/blog/lazarus-vhd-ransomware/36559/
- https://securelist.com/lazarus-on-the-hunt-for-big-game/97757/
author: frack113, Christopher Peacock '@securepeacock', SCYTHE '@scythe_io'
date: 2021-10-25
modified: 2023-05-05
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\brave.exe'
    - '\chrome.exe'
    - '\firefox.exe'
    - '\iexplore.exe'
    - '\maxthon.exe'
    - '\MicrosoftEdge.exe'
    - '\msedge.exe'
    - '\msedgewebview2.exe'
    - '\opera.exe'
    - '\safari.exe'
    - '\seamonkey.exe'
    - '\vivaldi.exe'
    - '\whale.exe'
        # We don't use "endswith" to also match with ADS logs and ".vhdx". Example: "TargetFilename: C:\Users\xxx\Downloads\windows.vhd:Zone.Identifier"
    TargetFilename|contains: '.vhd'
  condition: selection
falsepositives:
- Legitimate downloads of ".vhd" files would also trigger this
level: medium
note: |
  ### Technical Context

  This rule detects the creation of `.vhd` or `.vhdx` files by common web browsers, indicating potential malicious behavior, as adversaries may use these files to encapsulate payloads and evade detection. The likely attacker objective is to deliver or execute malicious code while circumventing traditional security controls. This behavior is aligned with the MITRE ATT&CK technique "Resource Development" (T1587.001).

  The primary telemetry sources for detection include file event logs from Windows operating systems, specifically focusing on the creation of files by browser processes. The security impact is significant; successful exploitation could lead to a compromised environment, potentially allowing for further lateral movement or data exfiltration. However, this rule does NOT confirm malicious intent on its own, as legitimate downloads of `.vhd` files also generate similar alerts.

  ### Investigation Steps

  - **Check the process identity:** Review the process that created the `.vhd` file using Event ID 4663 (Access to an object). Look for processes originating from known legitimate paths (e.g., `C:\Program Files\BrowserName\`) versus unusual or unexpected paths indicating potential compromise.

  - **Examine browser activity logs:** Investigate browser history or download logs to understand user behavior. Look for a pattern of downloading `.vhd` files alongside suspicious URLs or in the context of known threat actor activities.

  - **Validate file characteristics:** Assess the properties of the created `.vhd` files (e.g., using PowerShell `Get-Item` command). Legitimate `.vhd` files will typically be benign (e.g., OS images or software), whereas files with unusual timestamps or initiated from unknown sources may indicate malicious intent.

  - **Monitor system criticality:** If the alert originated from a critical asset (e.g., a server or admin workstation), elevate the investigation due to higher risk. Gather additional logs around the creation time to detect any related anomalous user account behaviors.

  - **Look for other indicators:** Identify if additional layers of detection were triggered, such as suspicious API calls or nearby events indicating undesirable access patterns. Cross-reference with existing threat intelligence regarding known malware that utilizes `.vhd` files.

  ### Prioritization

  This alert should be considered medium severity in terms of enterprise risk. The impact depends on the asset affected, particularly important systems where malware could lead to significant damage. The likelihood of malicious abuse is moderate, as this behavior is not commonplace among legitimate users but is a tactic used by sophisticated adversaries.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming malicious files or using less common browsers that aren't monitored. Reliable detection requires comprehensive logging configurations for file events and monitoring of all browser activities. Legitimate users may download `.vhd` files for software installations or virtual environments, which could trigger this alert. Companion detections, such as monitoring for unusual file access patterns (e.g., via Sysmon Event ID 11), can strengthen overall coverage against multiple T1587.001 attack vectors.

