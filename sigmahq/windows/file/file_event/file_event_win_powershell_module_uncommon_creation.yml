title: PowerShell Module File Created By Non-PowerShell Process
id: e3845023-ca9a-4024-b2b2-5422156d5527
status: test
description: Detects the creation of a new PowerShell module ".psm1", ".psd1", ".dll",
  ".ps1", etc. by a non-PowerShell process
references:
- Internal Research
- https://learn.microsoft.com/en-us/powershell/scripting/developer/module/understanding-a-windows-powershell-module?view=powershell-7.3
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-09
modified: 2025-10-07
tags:
- attack.persistence
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
    - '\WindowsPowerShell\Modules\'
    - '\PowerShell\7\Modules\'
  filter_main_pwsh:
    Image|endswith:
    - ':\Program Files\PowerShell\7-preview\pwsh.exe'
    - ':\Program Files\PowerShell\7\pwsh.exe'
    - ':\Windows\System32\poqexec.exe'         # https://github.com/SigmaHQ/sigma/issues/4448
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - ':\Windows\SysWOW64\poqexec.exe'         # https://github.com/SigmaHQ/sigma/issues/4448
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_msiexec:
    Image:
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of PowerShell module files, such as `.psm1`, `.psd1`, or `.dll`, by processes that are not typical PowerShell executables. The intent behind detecting these suspicious file creations is to uncover potential signs of malicious behavior where attackers may leverage PowerShell for persistence, executing arbitrary scripts, or delivering malware through custom modules that can evade standard security measures.

  In a typical attack scenario, a malicious actor might use a non-PowerShell process, such as an installer or administrative tool, to spawn a PowerShell process and create malicious PowerShell modules. Their objectives could include maintaining access, exfiltrating data, or escalating privileges within the environment. This behavior aligns with the MITRE ATT&CK framework tactics of Persistence and Defense Evasion, specifically techniques such as "Create or Modify System Process" (T1543) and "Masquerading" (T1036).

  Primary data sources for this rule include file event logs from Windows systems, which capture file creations and modifications, alongside process creation logs to correlate actions with associated parent processes.

  ### Investigation Steps
  - **Review File Creation Logs:** Analyze file event logs specifically looking for recent creation events of PowerShell module files (`.psm1`, `.psd1`, `.dll`, etc.) that are generated by processes not originating from known PowerShell images.

  - **Examine Process Hierarchy:** Investigate the parent-child process relationships around the identified file creation events. Look for non-PowerShell executables that initiated a PowerShell process, potentially indicating obfuscation or evasion tactics.

  - **Correlate with Security Events:** Utilize alerts from endpoint detection solutions to check for any related security incidents or suspicious activities around the time of the PowerShell module creation, such as unusual command line arguments or execution paths.

  - **Assess System Integrity:** Conduct a broader review of the affected system for additional unauthorized module files or unusual activities, verifying whether other indicators of compromise exist and ensuring the overall integrity of the environment.

  ### Prioritization
  The alert's severity is elevated due to the potential implications of an attacker being able to create malicious PowerShell modules in the environment, which could lead to long-term persistence or lateral movement, increasing the likelihood of a significant security incident.

  ### Blind Spots and Assumptions
  The detection logic may not catch scenarios where legitimate processes are misconfigured or altered to create PowerShell modules, potentially leading to false positives. Additionally, if the telemetry from file creation events or process logs is not enabled on endpoints, this rule may not function. Analysts should ensure that proper logging configurations are set and that the system has comprehensive visibility into both file events and process creation activities to maintain detection effectiveness.

