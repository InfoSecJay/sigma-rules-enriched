title: PowerShell Module File Created By Non-PowerShell Process
id: e3845023-ca9a-4024-b2b2-5422156d5527
status: test
description: Detects the creation of a new PowerShell module ".psm1", ".psd1", 
  ".dll", ".ps1", etc. by a non-PowerShell process
references:
- Internal Research
- https://learn.microsoft.com/en-us/powershell/scripting/developer/module/understanding-a-windows-powershell-module?view=powershell-7.3
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-09
modified: 2025-10-07
tags:
- attack.persistence
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
    - '\WindowsPowerShell\Modules\'
    - '\PowerShell\7\Modules\'
  filter_main_pwsh:
    Image|endswith:
    - ':\Program Files\PowerShell\7-preview\pwsh.exe'
    - ':\Program Files\PowerShell\7\pwsh.exe'
    - ':\Windows\System32\poqexec.exe'         # https://github.com/SigmaHQ/sigma/issues/4448
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - ':\Windows\SysWOW64\poqexec.exe'         # https://github.com/SigmaHQ/sigma/issues/4448
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - ':\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_msiexec:
    Image:
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of PowerShell modules (e.g., .psm1, .psd1) by processes that are not legitimate PowerShell executables. This behavior can indicate an attacker creating a PowerShell module for persistence, remote execution, or evasion, typically aiming to establish malicious scripts that can be invoked later. This activity relates to the MITRE ATT&CK tactic of Persistence (TA0003) and the technique for PowerShell (T1059.001).

  The primary telemetry source is Windows file event logs, specifically monitoring the creation of files in PowerShell module directories. If the behavior is malicious, it can lead to unauthorized code execution on the target system. This detection does NOT confirm that the created file is malicious on its own; further analysis is required to determine the intent and execution of the module.

  ### Investigation Steps

  - **Review the creation log:** Check for Windows Security Event ID 4663 and the corresponding file creation events to confirm the specific time and process that created the module files in `C:\WindowsPowerShell\Modules` or `C:\PowerShell\7\Modules`.

  - **Identify the creating process:** Examine the process that created the PowerShell module by reviewing the process tree using Sysmon Event ID 4688. This can help establish context about how the PowerShell module was created and if it was initiated by a legitimate or suspicious process.

  - **Check for known malicious indicators:** Look for known hash values or filenames associated with malware that may have created the module. Compare the created file's hash against threat intelligence sources to identify if it is a recognized bad file.

  - **Investigate surrounding activity:** Correlate with other logs (e.g., Windows Event ID 4648) to see if there were any credential accesses or abnormal logins by users that may indicate a compromised account used to trigger this activity.

  - **Determine legitimate behavior:** Confirm if there were any scheduled tasks or automation processes that typically create valid PowerShell modules for business purposes. Examples might include updates to monitoring scripts or approved module configurations by administrators.

  - **Validate exfiltration potential:** Review network logs and file transfer activity for any outbound connections initiated by the process that created the module, focusing on unusual hosts or destinations that may indicate data exfiltration.

  ### Prioritization

  This alert is of medium severity in an enterprise context. The system being affected is likely critical if it hosts PowerShell scripts or automation. The likelihood of malicious abuse is realistic, as attackers often use PowerShell for persistence and lateral movement. However, it is essential to validate the power of the detected activity, as legitimate processes may also create PowerShell modules.

  ### Blind Spots and Assumptions

  Detection can be limited by processes that may evade monitoring, such as custom PowerShell environments or scripts; organizations should ensure full logging and monitoring are enabled. Necessary log sources include file system events, process creation events (such as via Sysmon), and Windows Security logs. Additionally, legitimate software installations (e.g., installers using msiexec) may trigger this alert unintentionally. A related detection, such as monitoring PowerShell script execution using Sysmon, can strengthen coverage against inappropriate use of PowerShell in general.

