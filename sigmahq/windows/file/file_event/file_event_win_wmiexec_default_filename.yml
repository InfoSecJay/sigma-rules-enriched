detection:
  selection:
  - TargetFilename|re: '\\Windows\\__1\d{9}\.\d{1,7}$'       # Admin$
  - TargetFilename|re: 'C:\\__1\d{9}\.\d{1,7}$'       # C$
  - TargetFilename|re: 'D:\\__1\d{9}\.\d{1,7}$'       # D$
  condition: selection
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with specific naming patterns associated with the WMIexec tool, as seen in the execution of lateral movement techniques by attackers. The likely attacker objective is to remotely execute commands on target machines and establish persistence through file creation using default output naming conventions. This behavior is relevant to the MITRE ATT&CK tactics for Lateral Movement (TA0008) and Execution (TA0002), specifically technique T1047 (Windows Management Instrumentation).

  The primary telemetry sources for this detection are Windows File System events, particularly file creation logs. Specifically, logs should capture events indicating the creation of files that match the naming pattern (`__1<timestamp>.<random>`) within admin shares and drive letters C and D. If malicious, this activity could indicate further compromise in execution of malicious code, potentially allowing attackers to establish footholds within the environment. It must be noted that this detection does NOT confirm malicious intent on its own, as legitimate administrative or maintenance activities may also create such files.

  ### Investigation Steps

  - **Review event logs for file creations**: Examine Windows Security Event ID 4663 for 'Create' operations in paths matching `\\Windows\\__1<timestamp>.<random>` or `C:\\__1<timestamp>.<random>` and verify the initiating process.

  - **Identify associated parent processes**: Check the process creation logs (Event ID 4688 or Sysmon Event ID 1) to see if a known WMIexec command (like `wmiexec.py`) initiated the file creation, confirming a lateral movement attempt.

  - **Analyze execution context**: Validate if the file was executed by tracking Windows Event ID 4688 for process creation; assess the user account that created the file to identify possible malicious activity.

  - **Assess host role implications**: Confirm the asset role; if this is a domain controller or a critical system, the potential impact is significantly higher and should be prioritized.

  - **Differentiate benign activity**: Look for legitimate scripts or administrative tools that might create files in the same pattern and confirm these are signed or tied to known internal processes.

  - **Search for post-compromise behavior**: Investigate whether subsequent actions were taken on the created file, like execution or network connections, to identify further malicious indicators.

  ### Prioritization

  This alert is considered critical as it indicates potential misuse of WMIexec, a common tool for lateral movement in Windows environments. The likelihood of abuse is high due to the tool’s association with attackers wanting to gain control over additional systems. Given its frequent weaponization in attacks, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may use alternative file naming or avoid creating files altogether after running commands directly. Reliable detection requires that file creation event logs for the relevant paths are properly configured and monitored. Legitimate activities, such as IT maintenance or scripted administrative tasks, may inadvertently trigger this alert. A related detection includes monitoring for atypical WMI queries (MITRE ATT&CK T1047) to capture other forms of lateral movement or execution attempts.

