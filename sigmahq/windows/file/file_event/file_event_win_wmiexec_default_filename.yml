detection:
  selection:
  - TargetFilename|re: '\\Windows\\__1\d{9}\.\d{1,7}$'       # Admin$
  - TargetFilename|re: 'C:\\__1\d{9}\.\d{1,7}$'       # C$
  - TargetFilename|re: 'D:\\__1\d{9}\.\d{1,7}$'       # D$
  condition: selection
falsepositives:
- Unlikely
level: critical
note: |
  ### Technical Context
  This rule detects the creation of output files with default naming conventions used by the **wmiexec** tool, which is part of the Impacket library. Wmiexec is commonly utilized in lateral movement attacks, allowing an attacker to execute commands on remote Windows systems via WMI (Windows Management Instrumentation). The tool can aid in credential harvesting or remote command execution, thus posing a significant threat to network security.

  In terms of MITRE ATT&CK, this detection aligns with the following tactics and techniques:
  - Lateral Movement (TA0008)
  - Execution (TA0002)
  - Windows Management Instrumentation (T1047)

  To identify potential misuse of wmiexec, the primary data sources include Windows file event logs, specifically focusing on file creation events that match the naming pattern for output files. By analyzing these logs, security analysts can pinpoint unauthorized command executions occurring within the network.

  ### Investigation Steps
  - **Review File Creation Logs:** Inspect Windows file event logs for the specified output filename patterns (`__1{9}.{1,7}`), paying close attention to timestamps and the processes that initiated these file creations.
  - **Correlate Process Execution:** Analyze the process creation logs to determine if wmiexec was invoked, and identify the originating command and user context. Look for unusual parent processes that may indicate a compromise.
  - **Check Network Traffic:** Monitor for any corresponding network connections to external IP addresses or unusual internal communication patterns that may suggest the use of wmiexec to facilitate lateral movement.
  - **User Behavior Analysis:** Assess user behavior to identify any accounts that regularly generate these filenames. Review for atypical activity such as unexpected login times or access to sensitive systems.

  ### Prioritization
  The severity of this alert is critical in an enterprise environment due to the significant risk associated with lateral movement and execution of commands on remote systems, which can potentially lead to data breaches or full compromise of internal infrastructure.

  ### Blind Spots and Assumptions
  There are some gaps in detection coverage, particularly if attackers rename output files or if wmiexec is executed in a non-standard manner. The detection logic assumes that the output filenames adhere to the specified pattern, and it may miss events where filenames are obfuscated. Additionally, the alert requires properly configured Windows file event logging to function effectively, which must be enabled in the organization's environment.

