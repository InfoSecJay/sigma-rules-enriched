title: Legitimate Application Writing Files In Uncommon Location
id: 1cf465a1-2609-4c15-9b66-c32dbe4bfd67
related:
- id: 2ddef153-167b-4e89-86b6-757a9e65dcac     # bitsadmin dedicated rule
  type: similar
status: experimental
description: |
  Detects legitimate applications writing any type of file to uncommon or suspicious locations that are not typical for application data storage or execution.
  Adversaries may leverage legitimate applications (Living off the Land Binaries - LOLBins) to drop or download malicious files to uncommon locations on the system to evade detection by security solutions.
references:
- https://lolbas-project.github.io/#/download
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-12-10
modified: 2026-10-14
tags:
- attack.stealth
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  product: windows
  category: file_event
detection:
  selection_img:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - '\eqnedt32.exe'
    - '\wordpad.exe'
    - '\wordview.exe'
            # LOLBINs that can be used to download executables
    - '\cmdl32.exe'
    - '\certutil.exe'
    - '\certoc.exe'
    - '\CertReq.exe'
    - '\bitsadmin.exe'
    - '\Desktopimgdownldr.exe'
    - '\esentutl.exe'
    - '\expand.exe'
    - '\extrac32.exe'
    - '\replace.exe'
    - '\mshta.exe'
    - '\ftp.exe'
    - '\Ldifde.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    - '\findstr.exe'
  selection_locations:
    TargetFilename|contains:
    - ':\Perflogs'
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\'
    - '\$Recycle.Bin\'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
  filter_optional_dell_techhub_repair:
        # Dell TechHub runs "esentutl /p" on its SRUDB copy; the repair scratch files land in the working directory (System32)
    Image|endswith: '\esentutl.exe'
    TargetFilename|startswith:
    - 'C:\Windows\System32\SRUDB_'
    - 'C:\Windows\System32\TEMPREPAIR'
    TargetFilename|endswith:
    - '.INTEG.RAW'
    - '.EDB'
  filter_optional_dell_techhub_copy:
    Image|endswith: '\esentutl.exe'
    TargetFilename|startswith: 'C:\ProgramData\Dell\DTP\DB\SRUDBData\'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_in_uncommon_location/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the use of legitimate applications writing files to uncommon or suspicious locations on a Windows system. Attackers often utilize Living off the Land Binaries (LOLBins) to execute malicious actions while blending in with normal operations, such as downloading or executing malicious files in atypical directories. The relevant MITRE ATT&CK tactics and techniques for this detection are Command and Control (TA0011) and Execution (TA0040) under the techniques T1105 (Ingress Tool Transfer) and T1218 (System Services Execution).

  Primary telemetry sources include Windows file event logs, specifically tracking file creation events by monitoring Event ID 4663, which denotes file access or modification. If the behavior is malicious, it can lead to unauthorized access, data exfiltration, or the execution of malware, posing significant security risks. Importantly, this detection does NOT confirm that the activity is malicious by itself; further investigation is required to ascertain the intent behind the file creation.

  ### Investigation Steps

  - **Review file creation events:** Check Security Event ID 4663 in the Windows Security log to identify the exact time, user, application, and target file path associated with the event. Validate whether the files are being created in listed uncommon locations.

  - **Identify the executing process:** Confirm the process identified in the file creation log matches one from the list of known LOLBins (e.g., `cmdl32.exe`, `mshta.exe`). Check for any parent process relationships that indicate unusual execution paths or invocation.

  - **Examine for unusual file names:** Investigate the created files in uncommon directories for suspicious naming conventions, such as executable files (.exe) in directories like `C:\Temp\` or `C:\Users\Public\`. Legitimate applications typically create files in their respective directories under `C:\Program Files\` or user-specific folders.

  - **Validate malicious indicators:** Look for any indications of lateral movement or command and control behavior, such as network connections from the identified process using TCP/UDP ports that are not standard (e.g., port numbers outside the range of known service ports).

  - **Assess host criticality:** Determine the role and criticality of the affected host. Production systems running critical business applications are more likely to be malicious targets compared to non-critical test systems.

  - **Collect additional contextual information:** If possible, retrieve information from endpoint protection platforms or EDR solutions for additional context on the behavior observed, including any prior alerts related to the same process.

  ### Prioritization

  This alert carries high severity due to the potential impact on the system's integrity and security, especially if the affected applications are typically trusted within the enterprise environment. Given the likelihood that attackers exploit benign applications for malicious purposes, this behavior is increasingly common and weaponized in the context of modern cyber threats.

  ### Blind Spots and Assumptions

  Detection may struggle to identify every instance of legitimate application misuse, especially if the applications are known to operate in defined behaviors or include whitelisted processes. A proper configuration of Windows file event logging is vital for reliable detection. Common legitimate activities such as software updates or configuration changes may trigger this alert, necessitating context to distinguish normal from abnormal behavior. A related detection for consideration is the use of `bitsadmin.exe`, which could indicate additional layers of file transfer or command execution that complement the evidence provided by this rule.

