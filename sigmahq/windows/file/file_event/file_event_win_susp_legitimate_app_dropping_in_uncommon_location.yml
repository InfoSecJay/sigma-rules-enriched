    - ':\Perflogs'
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\'
    - '\$Recycle.Bin\'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
  condition: all of selection_*
