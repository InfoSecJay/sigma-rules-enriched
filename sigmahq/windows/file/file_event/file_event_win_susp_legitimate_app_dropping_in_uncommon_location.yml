note: |
  ### Technical Context

  This Sigma rule detects the action of legitimate applications writing files to uncommon or suspicious directories on Windows systems. Attackers may exploit legitimate applications (often referred to as Living off the Land Binaries or LOLBins) to place malicious files in these non-standard locations, with the intent to evade detection by security solutions. The relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0068) and "Command and Control" (TA0011), specifically techniques T1218 (Signed Binary Proxy Execution) and T1105 (Ingress Tool Transfer).

  Primary telemetry sources for this detection are file event logs from Windows, particularly focusing on created or modified files within directories that are atypical for legitimate application behavior. If this activity is malicious, it could facilitate further compromise or data exfiltration. However, this detection alone does NOT provide confirmation that the file being created is malicious; further investigation is required to establish intent and legitimacy.

  ### Investigation Steps

  - **Identify the process responsible for the file write:** Review Windows Security Event ID 4688 (Process Creation) for associated process details. Look for entries involving applications in the list (like `cmdl32.exe`, `mshta.exe`, etc.) writing files to suspicious locations.

  - **Examine file paths for unusual patterns:** Analyze the TargetFilename field for file writes occurring in uncommon directories such as `C:\Users\Public\`, `C:\ProgramData\`, and `C:\Temp\`. Legitimate application writes typically occur in user-specific folders or designated program data directories.

  - **Check for concurrent suspicious activities:** Utilize Sysmon Event ID 1 (Process Creation) to correlate if the detected file write was preceded or followed by other suspicious behaviors, such as network activity leading to known malicious IP addresses or domains.

  - **Validate the file content or type:** Review the file type created in the unauthorized location. Malicious indicators may include executable files or scripts in areas like `$Recycle.Bin\` or `C:\Temp\`. Legitimate file types are often documents or configuration files specific to the application behavior.

  - **Assess the execution behavior of the involved applications:** Look for previously known benign usage of the applications noted in your review. For example, `certutil.exe` could legitimately download files when used by authorized administrators, but unusual file paths or execution flags may indicate abuse.

  - **Review user activity and credentials:** Investigate the user account associated with the file write action. Legitimate business operations can lead to files in shared directories, while suspicious user patterns may indicate an account is being exploited or has elevated privileges misused.

  ### Prioritization

  The alert severity is high, primarily due to the potential impact on all systems involved, especially if sensitive data or critical processes are compromised. The likelihood of malicious abuse is significant, considering adversaries commonly use LOLBins for obfuscation. This behavior is frequently leveraged in attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques, such as using non-standard executables or renaming legitimate processes to bypass detection. Reliable identification of this behavior requires complete logging for Windows file events and process creations. Legitimate activities like administrative tasks may also trigger this alert, especially in shared environments. Companion detections that reinforce coverage include alerts for anomalous outbound connections following file creations, enhancing the context of potential data exfiltration attempts.

