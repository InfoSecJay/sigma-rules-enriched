title: Legitimate Application Writing Files In Uncommon Location
id: 1cf465a1-2609-4c15-9b66-c32dbe4bfd67
related:
- id: 2ddef153-167b-4e89-86b6-757a9e65dcac     # bitsadmin dedicated rule
  type: similar
status: experimental
description: |
  Detects legitimate applications writing any type of file to uncommon or suspicious locations that are not typical for application data storage or execution.
  Adversaries may leverage legitimate applications (Living off the Land Binaries - LOLBins) to drop or download malicious files to uncommon locations on the system to evade detection by security solutions.
references:
- https://lolbas-project.github.io/#/download
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-12-10
tags:
- attack.defense-evasion
- attack.t1218
- attack.command-and-control
- attack.t1105
logsource:
  product: windows
  category: file_event
detection:
  selection_img:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - '\eqnedt32.exe'
    - '\wordpad.exe'
    - '\wordview.exe'
            # LOLBINs that can be used to download executables
    - '\cmdl32.exe'
    - '\certutil.exe'
    - '\certoc.exe'
    - '\CertReq.exe'
    - '\bitsadmin.exe'
    - '\Desktopimgdownldr.exe'
    - '\esentutl.exe'
    - '\expand.exe'
    - '\extrac32.exe'
    - '\replace.exe'
    - '\mshta.exe'
    - '\ftp.exe'
    - '\Ldifde.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    - '\findstr.exe'
  selection_locations:
    TargetFilename|contains:
    - ':\Perflogs'
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Users\Public\'
    - ':\Windows\'
    - '\$Recycle.Bin\'
    - '\AppData\Local\'
    - '\AppData\Roaming\'
    - '\Contacts\'
    - '\Desktop\'
    - '\Favorites\'
    - '\Favourites\'
    - '\inetpub\wwwroot\'
    - '\Music\'
    - '\Pictures\'
    - '\Start Menu\Programs\Startup\'
    - '\Users\Default\'
    - '\Videos\'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_in_uncommon_location/info.yml
note: |
  ### Technical Context
  This rule detects instances where legitimate applications write files to uncommon locations within a Windows environment. Adversaries often exploit Living off the Land Binaries (LOLBins), which are legitimate executables residing on an operating system, to carry out malicious activities, such as dropping or downloading malware files to evade traditional security detection. By using common applications like Microsoft Office tools or system utilities, attackers aim to blend in with normal operations, making it challenging for security teams to identify the malicious behavior.

  The MITRE ATT&CK framework identifies relevant tactics and techniques associated with this activity, including **Defense Evasion (T1218)**, where attackers attempt to conceal malicious activity, and **Command and Control (T1105)**, which involves downloading files from a remote server. Other techniques like **Execution (T1059)** may also be involved when executing commands through these legitimate applications.

  Primary data sources for this detection rule include file event logs that record file creation and modification actions, focusing on the processes that generate these actions. Specifically, logs of illegitimate file writes by known applications can yield significant insights into possible malicious activities.

  ### Investigation Steps
  - **Review File Event Logs**: Analyze file creation and modification events to identify any anomalies. Focus on events originating from common applications writing to atypical directories.

  - **Investigate Process Activity**: Correlate the file write events with process-related data to see if they stem from recognized LOLBins or legitimate applications. Investigate any suspicious command-line parameters passed to these processes.

  - **Check Network Activity**: Look at network logs for outbound connections from these applications that may indicate they are communicating with a remote command and control server or downloading additional payloads.

  - **Examine User Behavior**: Analyze the context of user activities surrounding the events, such as whether the user has administrative rights or if the timing of the file activities aligns with suspicious behavior patterns.

  ### Prioritization
  This alert is classified as high severity because the use of legitimate applications to write files in uncommon locations is indicative of sophisticated attack techniques. Given the potential for significant data breaches or system compromise, prompt investigation is essential to mitigate risks.

  ### Blind Spots and Assumptions
  One possible gap in detection coverage lies in environments where logging configurations may not capture all file write events, particularly if logging levels are insufficient. Additionally, the detection assumes that the listed executable files are indeed leveraged by threats in the environment, which may not always be the case. Organizations must ensure appropriate configurations for file event logging are enabled across all systems to effectively utilize this alert.

