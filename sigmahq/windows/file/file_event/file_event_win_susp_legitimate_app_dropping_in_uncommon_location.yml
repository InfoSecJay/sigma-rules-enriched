- attack.command-and-control
- attack.t1105
logsource:
  product: windows
  category: file_event
detection:
  selection_img:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - '\eqnedt32.exe'
    - '\wordpad.exe'
    - '\wordview.exe'
            # LOLBINs that can be used to download executables
    - '\cmdl32.exe'
    - '\certutil.exe'
    - '\certoc.exe'
    - '\CertReq.exe'
    - '\bitsadmin.exe'
    - '\Desktopimgdownldr.exe'
    - '\esentutl.exe'
    - '\expand.exe'
    - '\extrac32.exe'
    - '\replace.exe'
