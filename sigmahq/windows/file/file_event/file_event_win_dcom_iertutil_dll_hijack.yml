  ### Technical Context

  This Sigma rule detects potential DLL hijacking attempts targeting "iertutil.dll" through the DCOM InternetExplorer.Application Class. The primary goal of the attacker is likely to execute malicious code under the guise of a legitimate system process, enabling unauthorized access or code execution on the affected system. This behavior aligns with the MITRE ATT&CK techniques T1021.002 (Remote Services - Remote DCOM) and T1021.003 (Remote Services - Windows Remote Management).

  The primary telemetry source for this detection is Windows file event logs, specifically targeting events related to the loading of DLL files in the context of DCOM applications. The security impact of a successful exploitation could lead to remote code execution, compromising system integrity and confidentiality. Importantly, this detection alone does NOT confirm malicious intent; it requires further contextual analysis to determine the legitimacy of the behavior.

  ### Investigation Steps

  - **Check file event logs for suspicious activity**: Review Windows Security Event ID 4663 for file access and modifications related to "iertutil.dll." Look for access from non-standard processes or unusual user accounts.

  - **Identify the process context**: Validate the parent process of InternetExplorer.Application. Use Sysmon Event ID 10 to confirm if there are unexpected parent-child relationships, indicating potential evasion or malicious execution.

  - **Examine DCOM configurations**: Check DCOM settings for unauthorized modifications using Event ID 10016 from System logs. Ensure that only necessary accounts have permissions to invoke DCOM applications.

  - **Review recent changes to DLL paths**: Analyze file creation events using Sysmon Event ID 11 for signs of reputable DLLs being replaced or masked. Legitimate operations should not modify core system DLL locations.

  - **Validate network connections**: Monitor outbound connections from Internet Explorer using Firewall logs or Network Monitoring tools (e.g., Netstat commands) for any unusual IPs or domains during the time of the alert.

  - **Assess asset criticality**: If the affected host is a domain controller or interacts with sensitive data, escalate the alert for immediate investigation, as it could indicate a higher risk of data compromise or lateral movement.

  ### Prioritization

  This alert is critical due to the potential for remote code execution using a well-known process. The likelihood of exploitation is significant given that DLL hijacking is commonly weaponized in malware campaigns. The impact of such an attack could lead to widespread system compromise, making this behavior a high-severity concern.

  ### Blind Spots and Assumptions

  Detection may be limited by lack of comprehensive file logging or oversight of legitimate administrative activities that utilize DCOM. False positives could arise from routine system updates or management tasks involving Internet Explorer. Companion detection via user activity monitoring on high-risk systems could enhance coverage, identifying correlational patterns with the DCOM alerts.

