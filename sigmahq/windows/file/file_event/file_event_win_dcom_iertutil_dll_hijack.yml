  ### Technical Context
  This detection rule is designed to identify possible DLL hijacking attempts involving the `iertutil.dll` file, which is part of the Internet Explorer application. DLL hijacking is a technique where an attacker places a malicious DLL file in a location that is searched by a legitimate program, in this case, Internet Explorer, leading to the execution of unauthorized code when the application loads. The primary motivation for an attacker using this method is typically to execute remote commands, perform lateral movement within a network, or escalate privileges.

  The rule focuses specifically on DCOM (Distributed Component Object Model) interactions, indicating a communication process between software components on networked devices. Relevant MITRE ATT&CK tactics include **Lateral Movement** (TA0008) and techniques such as **Remote Services: DCOM/COM** (T1021.002) and **Remote Services: Windows Admin Shares** (T1021.003). The primary telemetry for this detection is file event logs from Windows, monitoring attempts to load DLLs associated with Internet Explorer.

  ### Investigation Steps
  - **Review File Event Logs:** Analyze file event logs to detect any unauthorized access or changes to the `iertutil.dll` file, focusing on timestamps and user accounts involved in the actions.
  - **Identify DCOM Communications:** Examine DCOM-related logs to identify unusual remote calls to the Internet Explorer application, especially those originating from non-standard or unexpected sources.
  - **Inspect Process Creation Events:** Look for process creation events involving Internet Explorer that coincide with file system activity for the `iertutil.dll`, which may indicate exploitation patterns.
  - **Audit System Configuration:** Ensure that security settings on the target systems are configured to prevent unauthorized DLL registrations and consider using application whitelisting solutions to avoid similar attacks.

  ### Prioritization
  Given the critical nature of this alert, the severity is justified by the potential impact on the enterprise environment. A successful DLL hijack could lead to data exfiltration, further compromise of systems, and exploitation of additional vulnerabilities, thereby posing a substantial threat to organizational security.

  ### Blind Spots and Assumptions
  The detection logic may overlook legitimate administrative actions that involve DCOM calls for maintaining Internet Explorer, as well as potentially disallowing benign third-party applications that interact with the browser. Assumptions include the accurate configuration of logging for file events and DCOM communications; if these logs are not fully captured or are improperly configured, the detection may fail. Additionally, there may be a lack of visibility into remote DCOM requests from external networks if proper network monitoring is not in place.

