title: SCR File Write Event
id: c048f047-7e2a-4888-b302-55f509d4a91d
status: test
description: Detects the creation of screensaver files (.scr) outside of system folders.
  Attackers may execute an application as an ".SCR" file using "rundll32.exe desk.cpl,InstallScreenSaver"
  for example.
references:
- https://lolbas-project.github.io/lolbas/Libraries/Desk/
author: 'Christopher Peacock @securepeacock, SCYTHE @scythe_io'
date: 2022-04-27
modified: 2023-08-23
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.scr'
  filter:
    TargetFilename|contains:
    - ':\$WINDOWS.~BT\NewOS\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
    - ':\WUDownloadCache\'         # Windows Update Download Cache
  condition: selection and not filter
falsepositives:
- The installation of new screen savers by third party software
level: medium
note: |
  ### Technical Context
  This rule detects the creation of screensaver files with the `.scr` extension outside of known system directories on Windows systems. Attackers may leverage screensaver files as a method of executing malicious payloads, commonly utilizing the `rundll32.exe` command to run the screensaver. By disguising malicious code within an `.scr` file, an attacker can execute arbitrary commands or load additional malware, potentially leading to unauthorized access or data exfiltration.

  The likely threat scenario involves an adversary who seeks to bypass traditional security mechanisms by using file types that are generally trusted and less scrutinized by security teams. This behavior aligns with the MITRE ATT&CK technique T1218.011: **Signed Binary Proxy Execution**, which emphasizes the use of trusted binaries to execute untrusted code. Such activities typically fall under the Defense Evasion tactic, where the attacker aims to evade detection while maintaining a foothold in the environment.

  Primary data sources that can provide the needed evidence include file event logs that capture file creation behaviors, specifically looking for `.scr` file types. Monitoring Windows event logs related to file access can help provide context around potentially malicious behavior.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine file creation events for `.scr` files, focusing on their full paths and timestamps to identify the context of the creation. Look for any unusual directories that deviate from standard system paths.

  - **Correlate with Process Execution Logs:** Check for associated process execution logs, especially for `rundll32.exe` calls that reference the screensaver files. This can indicate whether the .scr file was executed in a suspicious manner.

  - **Investigate User and System Activity:** Analyze user account behavior to determine if the file creation correlates with any user actions that seem unauthorized or unusual. Look for relationships with known adversarial behaviors, such as lateral movement.

  - **Assess File Properties and Digital Signatures:** Examine the properties of the `.scr` files, including digital signatures. Unsigned or suspiciously signed screensaver files may require immediate escalation.

  ### Prioritization
  The alert is classified as medium severity due to the potential impact of execution of unauthorized code, which can lead to further compromising the system and data. The likelihood of occurrence can be elevated in environments where attackers actively seek to bypass security measures.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage could be the potential for legitimate software installations to create `.scr` files in user directories, leading to false positives. The detection logic assumes that any `.scr` file creation outside common system directories is suspicious, but this may not account for benign third-party applications or legitimate user behavior. For the detection to function effectively, it is essential to ensure proper logging of file events is enabled and that historical logs are retained for enough time to facilitate thorough investigations.

