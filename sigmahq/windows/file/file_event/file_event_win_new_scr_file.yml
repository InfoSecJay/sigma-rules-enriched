title: SCR File Write Event
id: c048f047-7e2a-4888-b302-55f509d4a91d
status: test
description: Detects the creation of screensaver files (.scr) outside of system 
  folders. Attackers may execute an application as an ".SCR" file using 
  "rundll32.exe desk.cpl,InstallScreenSaver" for example.
references:
- https://lolbas-project.github.io/lolbas/Libraries/Desk/
author: 'Christopher Peacock @securepeacock, SCYTHE @scythe_io'
date: 2022-04-27
modified: 2023-08-23
tags:
- attack.defense-evasion
- attack.t1218.011
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.scr'
  filter:
    TargetFilename|contains:
    - ':\$WINDOWS.~BT\NewOS\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
    - ':\WUDownloadCache\'         # Windows Update Download Cache
  condition: selection and not filter
falsepositives:
- The installation of new screen savers by third party software
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the creation of screensaver files (.scr) outside of standard system folders, which can indicate malicious activity. Attackers may utilize these files to execute code using "rundll32.exe desk.cpl,InstallScreenSaver", leveraging legitimate functionality for malicious purposes. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1218.011).

  Primary telemetry sources include Windows file event logs that capture file creation actions. If this behavior is indeed malicious, it could lead to unauthorized code execution on the affected system, potentially compromising sensitive data or system integrity. Importantly, this detection does not confirm malicious intent on its own, as legitimate third-party software may also install new screensavers.

  ---

  ### Investigation Steps

  - **Identify file creation events:** Review Windows Security Event ID 4663 (File Access) to check for the creation of .scr files. Note the source process and user context. Legitimate screensaver installation typically originates from trusted administrative accounts and involves standard directories.

  - **Validate execution context:** Cross-reference the process creating the .scr file using Sysmon Event ID 1 (Process Creation). Look for rundll32.exe invoking 'desk.cpl'—this is a high-confidence malicious indicator.

  - **Examine file path:** Confirm that .scr files are not being created in expected system directories (e.g., C:\Windows\System32). Malicious activity will likely produce .scr files in user directories or other unexpected locations.

  - **Review system configurations:** Assess Group Policy settings to determine if screensaver installations are allowed from user profiles. Expected behavior often results from administrative policies controlling screensaver usage.

  - **Check for further persistence mechanisms:** Look for subsequent events surrounding the .scr file creation, particularly Execution Events (Event ID 4688) to see if there is a launch of the screensaver shortly after its creation, which may indicate an attempt to persist the malicious payload.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact of unauthorized code execution on user systems. While this specific behavior has a low likelihood of being benign, it is a less common technique for attackers, meaning careful analysis is warranted.

  ---

  ### Blind Spots and Assumptions

  The detection may miss cases where attackers use alternative file types or names to avoid detection, such as employing .exe files masquerading as .scr files. It requires complete logging of file events for reliable coverage. Legitimate applications, particularly those that allow customization of screensavers, may generate similar logs. Companion detections, such as monitoring for unexpected rundll32.exe executions, enhance security visibility against this tactic.

