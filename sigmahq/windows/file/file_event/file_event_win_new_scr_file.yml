title: SCR File Write Event
id: c048f047-7e2a-4888-b302-55f509d4a91d
status: test
description: Detects the creation of screensaver files (.scr) outside of system 
  folders. Attackers may execute an application as an ".SCR" file using 
  "rundll32.exe desk.cpl,InstallScreenSaver" for example.
references:
- https://lolbas-project.github.io/lolbas/Libraries/Desk/
author: 'Christopher Peacock @securepeacock, SCYTHE @scythe_io'
date: 2022-04-27
modified: 2023-08-23
tags:
- attack.stealth
- attack.t1218.011
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.scr'
  filter:
    TargetFilename|contains:
    - ':\$WINDOWS.~BT\NewOS\'
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
    - ':\Windows\WinSxS\'
    - ':\WUDownloadCache\'         # Windows Update Download Cache
  condition: selection and not filter
falsepositives:
- The installation of new screen savers by third party software
level: medium
note: |
  ### Technical Context

  This rule detects the creation of Windows screensaver files (.scr) outside of standard system directories. Attackers may utilize these files as a means to execute malicious code, leveraging tools like `rundll32.exe` with specific commands (e.g., "desk.cpl,InstallScreenSaver"). Such behavior indicates an attempt to disguise malicious payloads as legitimate screensaver files, possibly to evade detection.

  The relevant MITRE ATT&CK tactic is "Defense Evasion" (ID: T1218.011). The primary telemetry sources for this detection are Windows file event logs, particularly monitoring file creation events. The security impact of a successful malicious screensaver execution could include remote code execution or persistence mechanisms. This detection does NOT confirm that malicious activity has taken place, as legitimate screensaver installations might trigger the same logging event.

  ### Investigation Steps

  - **Verify file creation source**: Check for Event ID 4663 (File Access) and Event ID 5145 (File Share Access) logs related to the .scr file creation. Assess the user context and process responsible for creation. Malicious activity is often attributed to unusual accounts or non-system processes.

  - **Identify execution method**: Trace any associated Event ID 4688 (Process Creation) logs that show how the .scr file was executed. Look specifically for `rundll32.exe` calling `desk.cpl`. Legitimate installations usually do not involve execution from user directories.

  - **Analyze file metadata**: Assess the creation timestamp and file path of the .scr file. Legitimate screen savers typically come from standard installation directories. Anomalies in path or timestamps, such as those generated during out-of-hours activity, indicate possible malicious intent.

  - **Monitor for lateral movement**: Review network traffic logs (e.g., Windows Firewall logs, Event ID 5156) for any deniable outbound connections following the execution of the .scr file. High confidence in malicious activity is indicated by unexpected attempts to communicate with external IPs shortly after the file’s execution.

  - **Check for historical context**: Investigate past alerts or incidents involving `.scr` files or related malicious behavior in the environment. Recognizing patterns can assist in evaluating the seriousness of the current alert.

  ### Prioritization

  This alert has a medium severity level due to the potential impact of executing malicious code on the affected systems. The likelihood of abuse is moderate, as using screensaver files for malicious purposes is known and documented. However, successful exploitation often requires additional contextual awareness to indicate intent.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers employing legitimate applications to create these files. A comprehensive logging configuration is necessary, especially for file access and process creation events. Legitimate software installations, particularly third-party screensavers, may also trigger this alert. Related detections include unusual process creation patterns from `rundll32.exe`, which could enhance overall visibility into suspicious activities.

