title: Potential Binary Or Script Dropper Via PowerShell
id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
status: test
description: Detects PowerShell creating a binary executable or a script file.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-17
modified: 2025-07-04
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.com'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.jar'
    - '.js'
    - '.ocx'
    - '.scr'
    - '.sys'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  filter_main_user_temp:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_main_other_temp:
        # Example: C:\Windows\Temp\0DA9758B-4649-4969-9409-5CBDF193FB53\TransmogProvider.dll
    TargetFilename|startswith:
    - 'C:\Windows\Temp\'
    - 'C:\Windows\SystemTemp\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_main_powershell_module:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\WindowsPowerShell\Modules\'     # C:\Users\xxxx\Documents\WindowsPowerShell\Modules\powershell-yaml\0.4.12\lib\net47\PowerShellYamlSerializer.dll
    TargetFilename|endswith: '.dll'
  filter_main_nuget:
    TargetFilename|startswith: 'C:\Program Files\PackageManagement\ProviderAssemblies\nuget\'
    TargetFilename|endswith: '\Microsoft.PackageManagement.NuGetProvider.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives will differ depending on the environment and scripts used. Apply
  additional filters accordingly.
level: medium
note: |
  ### Technical Context
  This rule is designed to detect potentially malicious activities involving PowerShell where it creates binary executables or script files. Attackers often utilize PowerShell as a method for executing and delivering various payloads, particularly in scenarios involving persistence and system exploitation. The primary objective of such activities typically includes planting malware, establishing remote access, or creating backdoors, all while evading detection mechanisms.

  Relevant MITRE ATT&CK techniques include **T1059.001 - Command and Scripting Interpreter: PowerShell**, where PowerShell is utilized to execute commands; and **T1203 - Exploitation for Client Execution**, which can involve the execution of malicious scripts directly. The analysis of this behavior provides a route for understanding potential lateral movement and exploitation strategies employed by adversaries.

  Primary data sources for this rule include file event logs from Windows operating systems, which will capture the creation of files through PowerShell, as well as PowerShell event logs that track any command execution and script activity executed via the shell.

  ### Investigation Steps
  - **Review PowerShell Logs**: Check Windows PowerShell event logs (Event ID 4104) for command execution and script invocation that corresponds with the time of the file creation.
  - **Examine File Creation Events**: Analyze the file event logs specifically looking for entries related to the creation of suspicious files in user and system temp directories, as well as other executable formats indicated in the rule.
  - **Inspect File Metadata**: For any created files, gather and review metadata to determine the origin, modification history, and any associated user accounts that initiated the process.
  - **Assess User Activity**: Investigate the user activity logs to determine if the account associated with the PowerShell commands exhibited any suspicious or anomalous behavior leading up to the file creation.

  ### Prioritization
  Given the potential for attackers to deliver malware and establish persistence through PowerShell scripts or binaries, this alert holds a medium severity level in an enterprise environment. The likelihood of exploitation through such techniques is elevated, warranting prompt investigation.

  ### Blind Spots and Assumptions
  There may be blind spots in detection if PowerShell logging is disabled or misconfigured, which can lead to missed events during the analysis. The detection logic assumes that PowerShell is utilized for interactive command execution as opposed to scheduled tasks or other automated triggers that may also generate similar file creation events. For the alert to function optimally, comprehensive logging needs to be enabled for both file creation events and PowerShell command execution within the environment.

