title: Potential Binary Or Script Dropper Via PowerShell
id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
status: test
description: Detects PowerShell creating a binary executable or a script file.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-17
modified: 2025-07-04
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.com'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.jar'
    - '.js'
    - '.ocx'
    - '.scr'
    - '.sys'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  filter_main_user_temp:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_main_other_temp:
        # Example: C:\Windows\Temp\0DA9758B-4649-4969-9409-5CBDF193FB53\TransmogProvider.dll
    TargetFilename|startswith:
    - 'C:\Windows\Temp\'
    - 'C:\Windows\SystemTemp\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_main_powershell_module:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\WindowsPowerShell\Modules\'     # C:\Users\xxxx\Documents\WindowsPowerShell\Modules\powershell-yaml\0.4.12\lib\net47\PowerShellYamlSerializer.dll
    TargetFilename|endswith: '.dll'
  filter_main_nuget:
    TargetFilename|startswith: 'C:\Program Files\PackageManagement\ProviderAssemblies\nuget\'
    TargetFilename|endswith: '\Microsoft.PackageManagement.NuGetProvider.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives will differ depending on the environment and scripts used. 
  Apply additional filters accordingly.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_powershell_drop_binary_or_script/info.yml
note: |
  ### Technical Context

  This rule detects activities where PowerShell creates executable or script files in various directories, particularly focusing on temporary folders. The likely attacker objective is to drop malicious payloads or scripts that could lead to system compromise or lateral movement. This behavior relates to the MITRE ATT&CK tactic **Persistence** and the technique **PowerShell** (T1059.001). Primary telemetry sources for this detection include Windows Event Logs specifically focusing on file operations and PowerShell execution logs. If malicious, this activity could lead to elevated privileges, data exfiltration, or further exploitation of the system. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative tasks or automation scripts may also exhibit similar behaviors.

  ### Investigation Steps

  - **Identify PowerShell invocation details**: Review Security Event ID 4688 for PowerShell process creation and capture command-line arguments, checking for suspicious or obfuscated commands that could indicate malicious use.

  - **Examine created files in temp directories**: Check for any newly created files with the extensions (.exe, .dll, .vbs, etc.) in the directories `C:\Users\*\AppData\Local\Temp\` and `C:\Windows\Temp\`. Verify if these files are signed or have legitimate timestamps.

  - **Assess context of execution**: Investigate the user context under which PowerShell was executed. Legitimate usage often comes from system admin accounts during maintenance activities, rather than standard users.

  - **Look for indicators of compromise**: Investigate files created that match known malicious hashes using VirusTotal or other reputation services. Malicious indicators are typically associated with widely recognized malware families.

  - **Monitor for lateral movement**: If suspicious files are detected, examine subsequent network activity originating from the affected host, especially towards known C2 domains or unusual destinations.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact of an affected system. The likelihood of malicious abuse exists, particularly since dropping executable files is a common tactic in establishing persistence or executing payloads. While this behavior is not universally weaponized, it acts as a precursor to possible malicious actions.

  ### Blind Spots and Assumptions

  Limitations include potential evasion techniques such as using legitimate administrative scripts that create files without triggering the alert. Reliable detection requires logging configurations for PowerShell and file system events to be enabled. Legitimate activities may include user-initiated software installations or legitimate PowerShell scripts for automation. A companion detection rule for monitoring suspicious PowerShell commands would strengthen coverage against potential evasion tactics.

