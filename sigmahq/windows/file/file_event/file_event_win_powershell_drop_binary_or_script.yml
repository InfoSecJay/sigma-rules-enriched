title: Potential Binary Or Script Dropper Via PowerShell
id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
status: test
description: Detects PowerShell creating a binary executable or a script file.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2023-03-17
modified: 2025-07-04
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\powershell_ise.exe'
    - '\pwsh.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.com'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.jar'
    - '.js'
    - '.ocx'
    - '.scr'
    - '.sys'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  filter_main_user_temp:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_main_other_temp:
        # Example: C:\Windows\Temp\0DA9758B-4649-4969-9409-5CBDF193FB53\TransmogProvider.dll
    TargetFilename|startswith:
    - 'C:\Windows\Temp\'
    - 'C:\Windows\SystemTemp\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_main_powershell_module:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\WindowsPowerShell\Modules\'     # C:\Users\xxxx\Documents\WindowsPowerShell\Modules\powershell-yaml\0.4.12\lib\net47\PowerShellYamlSerializer.dll
    TargetFilename|endswith: '.dll'
  filter_main_nuget:
    TargetFilename|startswith: 'C:\Program Files\PackageManagement\ProviderAssemblies\nuget\'
    TargetFilename|endswith: '\Microsoft.PackageManagement.NuGetProvider.dll'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives will differ depending on the environment and scripts used. 
  Apply additional filters accordingly.
level: medium
note: |
  ### Technical Context

  This rule detects instances where PowerShell creates files that can potentially be malicious executables or scripts, such as `.exe`, `.dll`, and various script file formats. The behavior indicates possible adversary objectives such as malware persistence, payload delivery, or even lateral movement within the system. This activity aligns with the MITRE ATT&CK tactics of "Persistence" (TA0003) and techniques like "Malicious File Execution" (T1203) or "PowerShell" (T1059.001).

  The primary telemetry source for this detection is Windows file event logs, specifically capturing events related to file creation by PowerShell. If this behavior is malicious, it may enable attackers to deploy backdoors or exploit scripts that jeopardize network integrity. It is important to note that detection of this activity does not confirm an outright compromise; benign administrative activities could also trigger the rule.

  ### Investigation Steps

  - **Verify the PowerShell command:**
    Check the command-line arguments in Security Event ID 4688 for `powershell.exe`, `powershell_ise.exe`, or `pwsh.exe`. Look for suspicious commands or encoding that may indicate malicious activity, particularly any commands that download scripts or binaries from untrusted sources.

  - **Identify file creation context:**
    Review the file paths where creations were detected, especially `C:\Users\*\AppData\Local\Temp\`. Malicious files are often created in temp directories. Legitimate applications like software installers may also write files here but should be corroborated by known execution patterns.

  - **Assess file properties:**
    Look at Security Event ID 4663 for created files and examine the `Object Type`, `Object Name`, and `Access Mask`. High-risk files should show unusual access privileges, particularly those that require elevated permissions or unusual file ownership.

  - **Correlate with user activity:**
    Check the user account that executed PowerShell with Security Event ID 4624. Determine whether this account is legitimate (e.g., active admin or service account) or if it shows signs of compromise (e.g., unusual geographical access patterns).

  - **Monitor known indicators of compromise (IoCs):**
    Search for files matching the created file names against threat intelligence feeds or previous incident reports. Match any suspicious file hashes against known malware indicators.

  ### Prioritization

  This alert should be treated with medium severity; while it may indicate potential malicious activity, the context of the affected system and the user role is significant. Systems with critical functions or handling sensitive data warrant a higher investigation priority due to the risk of malware deployment. Malicious use of PowerShell for file creation is a common tactic among threat actors, further justifying the need for swift analysis.

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion techniques such as the use of alternate scripts or executables that do not trigger the indicative file extensions. Additionally, lack of comprehensive logging configurations might hinder the visibility of relevant telemetry. Legitimate system operations, such as software updates or administrative scripts running PowerShell, could result in false positives. A related detection that enhances coverage would be monitoring for script block logging in PowerShell (e.g., Event ID 4104), which can provide insight into the actual commands being executed.

