detection:
  selection:
    Image|endswith:
    - '\onenote.exe'
    - '\onenotem.exe'
    - '\onenoteim.exe'
    TargetFilename|contains: '\AppData\Local\Temp\OneNote\'
    TargetFilename|endswith:
            # TODO: Add more suspicious extensions
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.htm'
    - '.html'
    - '.js'
    - '.lnk'
    - '.ps1'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: selection
falsepositives:
- False positives should be very low with the extensions list cited. Especially 
  if you don't heavily utilize OneNote.
- Occasional FPs might occur if OneNote is used internally to share different 
  embedded documents
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious files via the OneNote application, specifically monitoring for executable or script file types (.exe, .bat, .vbs, etc.) that may have been delivered using OneNote. The likely attacker objective is to leverage OneNote as a vector for distributing malware, capitalizing on its legitimate use to obscure malicious activity. Relevant MITRE ATT&CK tactic includes **Defense Evasion** (T1213) as attackers seek to blend in with legitimate processes and file activity.

  The primary telemetry source includes file event logs from Windows, focusing on the creation of files in the `\AppData\Local\Temp\OneNote\` directory. The potential security impact is significant, as such files could lead to system compromise, data exfiltration, or lateral movement. This detection does NOT confirm that malicious activity is occurring without further investigation; legitimate usage of OneNote for document sharing can generate similar file events.

  ### Investigation Steps

  - **Review file creation events:** Check for File Event logs (Event ID 4663) in the `AppData\Local\Temp\OneNote\` directory for the creation of suspicious file types (.exe, .vbs). Identify timestamps and correlating user accounts to determine the context of file creation.

  - **Analyze file metadata:** For any detected files, inspect their metadata (creation date, file size) using PowerShell `Get-Item` or other file analysis tools. Legitimate OneNote activities may yield files related to benign content like meeting notes or shared documents.

  - **Cross-reference user activity:** Review the user's logon sessions in Security Event logs (Event ID 4624) to correlate OneNote usage with timeframes of abnormal file activity. Frequent interactions with OneNote outside standard office hours might indicate risk.

  - **Identify high-confidence malicious indicators:** If a file has been created with a known malicious hash (e.g., from threat intelligence sources), this should escalate the case to a higher priority. Utilize hash lookup tools to verify the file against known malware signatures.

  - **Assess OneNote usage frequency:** Review enterprise-level usage patterns of OneNote. If OneNote is infrequently utilized in your organization, the appearance of scripts or executable files could indicate a strong likelihood of malicious intent.

  ### Prioritization

  This alert should be considered high severity primarily because the creation of potentially malicious files in a commonly used application like OneNote suggests an attempt to exploit user trust. Given the method shows signs of trending in real-world attacks, its likelihood of being abused is significant.

  ### Blind Spots and Assumptions

  Detection may be limited by organizational usage patterns of OneNote, resulting in potential false positives from legitimate document sharing. The effectiveness of this detection relies on the availability of file event logging in environments where OneNote is used. Background activities, such as users legitimately saving content using embedded scripts or file types, can also inadvertently trigger alerts. Companion detections involving monitoring of email attachments or document sharing services could enhance overall coverage against similar threats.

