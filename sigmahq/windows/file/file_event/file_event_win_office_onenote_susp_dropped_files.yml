note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of potentially malicious files via the OneNote application, specifically targeting suspicious file types that could indicate malware delivery methods. The likely attacker objective is to exploit OneNote as a vector for malicious scripts or executables, taking advantage of social engineering tactics to trick users into opening harmful attachments. Relevant MITRE ATT&CK tactic includes **Defense Evasion (T1564)**, leveraging techniques such as **Masquerading (T1036)** by disguising harmful files with benign file extensions.

  Primary telemetry sources are Windows file event logs, focusing on the creation events linked to the OneNote application, specifically monitoring the directory path `\AppData\Local\Temp\OneNote\`. If malicious, these events could indicate an active infection or compromise leading to further network exploitation. This detection does NOT confirm the execution of the detected file; additional forensic analysis is required to understand the intent and impact fully.

  ---

  ### Investigation Steps

  - **Review file creation events**: Check Windows Security Event ID 4663 to confirm the creation of suspicious files under `\AppData\Local\Temp\OneNote\`. Compare timestamps with user activity to identify anomalous behavior.

  - **Check process activity**: Investigate Sysmon Event ID 1 for any parent process relationships involving `onenote.exe`, `onenotem.exe`, or `onenoteim.exe`. Look for unusual command line arguments indicative of potential misuse.

  - **Identify file types**: Look for specific file extensions like `.bat`, `.vbs`, or `.exe` included in the filename of created files within the OneNote temp directory. Legitimate OneNote usage should predominantly yield standard document types or text files.

  - **Analyze user context**: Determine the user account associated with the file creation event. Assess if this user typically uses OneNote and whether the usage aligns with expected behavior patterns (e.g., sharing notes vs. executing scripts).

  - **Corroborate with threat intelligence**: Refer to known malware variants heavily reported to utilize OneNote for delivery, such as AsyncRAT, and cross-reference file hashes or names against threat intelligence databases for any associated, known indicators of compromise.

  - **Examine follow-up actions**: Review subsequent events (like system calls or network connections) that may stem from the file creation. Use Sysmon logs to identify signs of execution or malicious activity originating from the created files.

  ---

  ### Prioritization

  Given the integration of OneNote within organizational workflows and its potential for abuse, this detection should be treated with high severity. The likelihood of exploitation through social engineering makes it a crucial focus for SOC teams. Since similar malware use cases have been weaponized recently, it warrants immediate attention to safeguard network integrity.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by the potential for file obfuscation or legitimate applications inadvertently generating similar files under the OneNote temp directory. It assumes that required logging for file creation is adequately configured on monitored endpoints. Legitimate activities include using OneNote for collaboration, which may generate false alarms. A companion detection, such as monitoring for suspicious command execution relating to file types used in these alerts, would enhance overall coverage.

