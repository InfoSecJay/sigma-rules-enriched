detection:
  selection:
    Image|endswith:
    - '\onenote.exe'
    - '\onenotem.exe'
    - '\onenoteim.exe'
    TargetFilename|contains: '\AppData\Local\Temp\OneNote\'
    TargetFilename|endswith:
            # TODO: Add more suspicious extensions
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.htm'
    - '.html'
    - '.js'
    - '.lnk'
    - '.ps1'
    - '.vbe'
