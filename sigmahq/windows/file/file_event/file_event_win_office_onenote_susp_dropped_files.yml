title: Suspicious File Created Via OneNote Application
id: fcc6d700-68d9-4241-9a1a-06874d621b06
status: test
description: Detects suspicious files created via the OneNote application. This 
  could indicate a potential malicious ".one"/".onepkg" file was executed as 
  seen being used in malware activity in the wild
references:
- https://www.bleepingcomputer.com/news/security/hackers-now-use-microsoft-onenote-attachments-to-spread-malware/
- https://blog.osarmor.com/319/onenote-attachment-delivers-asyncrat-malware/
- https://twitter.com/MaD_c4t/status/1623414582382567424
- https://labs.withsecure.com/publications/detecting-onenote-abuse
- https://www.trustedsec.com/blog/new-attacks-old-tricks-how-onenote-malware-is-evolving/
- https://app.any.run/tasks/17f2d378-6d11-4d6f-8340-954b04f35e83/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-09
modified: 2023-02-27
tags:
- attack.stealth
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\onenote.exe'
    - '\onenotem.exe'
    - '\onenoteim.exe'
    TargetFilename|contains: '\AppData\Local\Temp\OneNote\'
    TargetFilename|endswith:
            # TODO: Add more suspicious extensions
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.htm'
    - '.html'
    - '.js'
    - '.lnk'
    - '.ps1'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: selection
falsepositives:
- False positives should be very low with the extensions list cited. Especially 
  if you don't heavily utilize OneNote.
- Occasional FPs might occur if OneNote is used internally to share different 
  embedded documents
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious file types (.bat, .exe, .vbs, etc.) from OneNote, indicating potential malicious activity, such as the delivery of malware via OneNote attachments. The likely attacker objective is to exploit OneNote's functionality to execute files from a trusted context, distributing malware while bypassing standard security checks. Relevant MITRE ATT&CK tactics include **Execution** (TA0002), specifically focusing on **User Execution** (T1203). Primary telemetry comes from file event logs in Windows (e.g., Event ID 4663) that track file creation activities. If malicious, this behavior could lead to system compromise and lateral movement within the network. This detection does NOT confirm that a malicious file was executed without additional investigation into the file behavior and system impact.

  ### Investigation Steps

  - **Check the file activity logs:** Review Windows Security Event ID 4663 for details on the file creation event. Look for the creation of suspicious file types in the path `C:\Users\<username>\AppData\Local\Temp\OneNote\`. Ensure that the TargetFilename is one of the listed suspicious extensions.

  - **Validate the OneNote usage:** Confirm expected legitimate use of OneNote in your organization by identifying users who frequently utilize it. Check for file paths that typically differ from `Temp\OneNote`, as legitimate activities often involve saving files in documents or specific directories rather than temporary directories.

  - **Analyze the file characteristics:** Investigate the created file using tools like VirusTotal to check if it has been flagged as malicious. Particularly focus on legitimate applications generating .exe or .vbs files, which are uncommon in normal operational contexts.

  - **Correlate with other activity:** Look for recent email or messaging activity that may have included suspicious OneNote attachments. Use Exchange logs or messaging app logs corresponding to the same user or time frame to gather context.

  - **Assess the endpoint behavior post-event:** Review the endpoint for any subsequent execution actions via Process Monitor or Sysmon Event ID 1 to confirm if the created file was executed or interacted with. This will help distinguish between benign and malicious file creation activity.

  ### Prioritization

  This alert is high severity as it indicates a potential execution point for malware, especially when it involves sensitive systems or high-value assets. The likelihood of malicious abuse is significant, given the growing trend of malware distribution through trusted applications like OneNote, which may often be weaponized in social engineering attacks.

  ### Blind Spots and Assumptions

  Detection capabilities may be limited if file event logging is improperly configured, leading to missed detections of malicious file creations. Legitimate activities such as internal document sharing using OneNote may trigger this alert, particularly with embedded executables. A companion detection to consider would be monitoring for unusual outbound connections or file execution patterns from the .one or .onepkg files, enhancing insight into potential malicious activities spawned from OneNote.

