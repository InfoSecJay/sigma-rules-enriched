title: Suspicious File Created Via OneNote Application
id: fcc6d700-68d9-4241-9a1a-06874d621b06
status: test
description: Detects suspicious files created via the OneNote application. This could
  indicate a potential malicious ".one"/".onepkg" file was executed as seen being
  used in malware activity in the wild
references:
- https://www.bleepingcomputer.com/news/security/hackers-now-use-microsoft-onenote-attachments-to-spread-malware/
- https://blog.osarmor.com/319/onenote-attachment-delivers-asyncrat-malware/
- https://twitter.com/MaD_c4t/status/1623414582382567424
- https://labs.withsecure.com/publications/detecting-onenote-abuse
- https://www.trustedsec.com/blog/new-attacks-old-tricks-how-onenote-malware-is-evolving/
- https://app.any.run/tasks/17f2d378-6d11-4d6f-8340-954b04f35e83/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-09
modified: 2023-02-27
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\onenote.exe'
    - '\onenotem.exe'
    - '\onenoteim.exe'
    TargetFilename|contains: '\AppData\Local\Temp\OneNote\'
    TargetFilename|endswith:
            # TODO: Add more suspicious extensions
    - '.bat'
    - '.chm'
    - '.cmd'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.htm'
    - '.html'
    - '.js'
    - '.lnk'
    - '.ps1'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: selection
falsepositives:
- False positives should be very low with the extensions list cited. Especially if
  you don't heavily utilize OneNote.
- Occasional FPs might occur if OneNote is used internally to share different embedded
  documents
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious file creation events originating from the OneNote application. The primary threat scenario involves attackers leveraging Microsoft OneNote's features to deliver malicious payloads, primarily through specially crafted OneNote files (with ".one" or ".onepkg" extensions) that can execute harmful scripts or binaries. This method has been observed in various malware campaigns, where adversaries exploit the trust users have in familiar applications to bypass security measures and deliver malware payloads, such as AsyncRAT.

  Relevant MITRE ATT&CK tactics for this rule include:
  - **Initial Access (TA0043)**: Particularly through user execution via social engineering techniques.
  - **Defense Evasion (TA0005)**: Adversaries may utilize unexpected applications like OneNote to avoid detection by traditional security measures.

  The primary data sources for this detection include file creation logs from Windows systems, specifically those logging events related to the OneNote application, which can be found in the system's `AppData\Local\Temp\OneNote\` directory.

  ### Investigation Steps
  - **Review File Creation Logs**: Check the Windows file event logs for suspicious file creation in the specified OneNote temporary directory. Pay particular attention to file types known to be associated with malicious activity (e.g., .bat, .exe, .ps1).

  - **Analyze Process Activity**: Investigate the process tree for any instances of `onenote.exe` or its components (e.g., `onenotem.exe` and `onenoteim.exe`). Determine if these processes spawned any unexpected or suspicious child processes that could indicate an execution chain.

  - **Correlate with User Activity**: Look for recent user activity associated with the OneNote files. Review if the users intended to create or open these files and confirm their sources, especially those received via email or untrusted channels.

  - **Evaluate Network Connections**: Check for any outbound network connections initiated by the process corresponding to the suspicious files, which could indicate potential data exfiltration or communication with command and control (C2) servers.

  ### Prioritization
  This alert is classified with **high severity** due to the potential for significant business impact if malware is successfully delivered through OneNote files. The likelihood of exploitation increases given the common usage of OneNote and the increasing sophistication of attackers using familiar applications as vectors for delivery.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if OneNote usage is widespread within the organization, as legitimate use may generate false positives, especially when sharing internal documents. The detection assumes that file creation events for the specified extensions are logged correctly and available for monitoring. Any lack of logging or incorrect configurations of the OneNote application may hinder the rule's effectiveness. Additionally, if users frequently utilize OneNote without implementing proper security practices, the risk of overlooking malicious activities remains high.

