title: Suspicious File Created Via OneNote Application
id: fcc6d700-68d9-4241-9a1a-06874d621b06
status: test
description: Detects suspicious files created via the OneNote application. This 
  could indicate a potential malicious ".one"/".onepkg" file was executed as 
  seen being used in malware activity in the wild
