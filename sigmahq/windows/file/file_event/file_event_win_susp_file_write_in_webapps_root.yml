title: Suspicious File Write to Webapps Root Directory
id: 89c42960-f244-4dad-9151-ae9b1a3287a2
status: experimental
description: |
  Detects suspicious file writes to the root directory of web applications, particularly Apache web servers or Tomcat servers.
  This may indicate an attempt to deploy malicious files such as web shells or other unauthorized scripts.
references:
- https://labs.watchtowr.com/guess-who-would-be-stupid-enough-to-rob-the-same-vault-twice-pre-auth-rce-chains-in-commvault/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-20
tags:
- attack.persistence
- attack.t1505.003
- attack.initial-access
- attack.t1190
logsource:
  product: windows
  category: file_event
detection:
    # Add more suspicious processes or paths or extensions as needed
  selection_susp_img:
    Image|endswith:
    - '\dotnet.exe'
    - '\w3wp.exe'
    - '\java.exe'
  selection_servers:
    TargetFilename|contains:
    - '\apache'
    - '\tomcat'
  selection_path:
    TargetFilename|contains: '\webapps\ROOT\'
  selection_susp_extensions:
    TargetFilename|endswith: '.jsp'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potentially harmful file write operations to the root directory of web applications, specifically targeting Apache and Tomcat servers. Such activities often indicate an attacker's attempt to install malicious files, including web shells or unauthorized scripts, which could enable further exploitation of the server environment. The primary objective of such threats is to gain persistent access, maintain control over the affected environment, and potentially exfiltrate sensitive information or service disruption.

  This activity maps to several techniques identified within the MITRE ATT&CK framework, notably:
  - **T1071**: Application Layer Protocol - Attackers sometimes leverage commonly used protocols and applications to conceal their activities.
  - **T1505.003**: Server Side Request Forgery - Exploiting the web server’s capabilities to issue requests, often related to hosting dangerous content.

  Relevant telemetry for this detection would encompass file event logs that record changes to files in the web application directory, especially those handling sensitive functionality on the web server.

  ### Investigation Steps
  - **Review File Event Logs**: Investigate the logs for file creation, modification, or deletion events in the `/webapps/ROOT` directory, focusing on timestamps aligning with suspicious behavior or other alerts.
  - **Analyze Process Activity**: Check for the execution of suspicious processes such as `dotnet.exe`, `w3wp.exe` (IIS worker process for .NET applications), and `java.exe`, particularly those starting near the time of the detected file write.
  - **Examine Web Server Logs**: Collect and analyze Apache or Tomcat access and error logs to identify any unusual requests or errors linked to the time the file was written, which may provide insight into the attacker's actions.
  - **Assess Network Traffic**: Monitor outbound network connections, particularly any that may indicate data exfiltration attempts following file write actions. Anomalous or unexpected connections from the web server could signify a compromised environment.

  ### Prioritization
  This alert carries a medium severity level due to its potential impact on the integrity and availability of web applications. The likelihood of such activities being part of a significant security breach necessitates prompt investigation to prevent further exploitation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if file event logging is not enabled or if logs are insufficiently detailed. The rule assumes that any process writing to the web application directory could be malicious; however, legitimate administrative actions might also generate similar logs. The effectiveness of the detection relies on proper logging configurations to capture file writes in the targeted directories comprehensively.

