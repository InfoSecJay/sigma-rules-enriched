title: Suspicious File Write to Webapps Root Directory
id: 89c42960-f244-4dad-9151-ae9b1a3287a2
status: experimental
description: |
  Detects suspicious file writes to the root directory of web applications, particularly Apache web servers or Tomcat servers.
  This may indicate an attempt to deploy malicious files such as web shells or other unauthorized scripts.
references:
- https://labs.watchtowr.com/guess-who-would-be-stupid-enough-to-rob-the-same-vault-twice-pre-auth-rce-chains-in-commvault/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-10-20
tags:
- attack.persistence
- attack.t1505.003
- attack.initial-access
- attack.t1190
logsource:
  product: windows
  category: file_event
detection:
    # Add more suspicious processes or paths or extensions as needed
  selection_susp_img:
    Image|endswith:
    - '\dotnet.exe'
    - '\w3wp.exe'
    - '\java.exe'
  selection_servers:
    TargetFilename|contains:
    - '\apache'
    - '\tomcat'
  selection_path:
    TargetFilename|contains: '\webapps\ROOT\'
  selection_susp_extensions:
    TargetFilename|endswith: '.jsp'
  condition: all of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects file writes to the root directory of web applications, specifically targeting Apache and Tomcat servers. Such behavior is commonly associated with attempts to deploy malware, including web shells, which can grant attackers unauthorized access or control over a system. This activity aligns with the tactics of persistence (MITRE ATT&CK T1505.003) and initial access attempts (T1190), often aiming to establish foothold within the environment.

  The primary telemetry sources include Windows file event logs that capture file creation and modification actions. The presence of unauthorized file types, such as `.jsp` files, is particularly concerning. A malicious write operation could lead to significant security impacts, including data breaches or system compromise. However, this detection does not confirm exploitation or active compromise on its own; it serves as an indicator warranting further investigation.

  ### Investigation Steps

  - **Review file event logs for suspicious writes:** Check Windows Security Event ID 4663 and file event logs for writes to `\webapps\ROOT\*` targeting filenames containing `apache` or `tomcat`. Look for files ending in `.jsp` as potential indicators of web shell deployment.

  - **Examine process creation events:** Investigate Sysmon Event ID 1 for the process creation linked to `dotnet.exe`, `w3wp.exe`, or `java.exe`. Confirm if these processes were running at the same time as the file write events, as they may attempt to execute or serve the malicious file.

  - **Identify legitimate activity patterns:** Observe the typical file operations by legitimate applications running on the web server (such as normal deployment processes). Expected benign writes may include routine HTML, CSS, or JavaScript files, which do not generally include executable scripts or web shells.

  - **Check for previous alerts or incidents:** Cross-reference existing incident reports or alerts that may indicate a pattern of suspicious writes or known vulnerabilities in the affected system. Investigate targeting of the same server in past incidents to help contextualize the current alert.

  - **Validate with threat intelligence:** Utilize threat intelligence sources to see if any of the deployed filenames match known malicious indicators or if recent vulnerabilities have been associated with the web applications in use.

  ### Prioritization

  The severity of this alert is medium due to the direct impact on critical web application servers. The likelihood of being abused by attackers deploying web shells or scripts makes it a significant concern. While such behaviors may not be constantly weaponized, the potential for exploitation presents a serious risk.

  ### Blind Spots and Assumptions

  Detection may be limited in environments with misconfigured logging that do not capture all file activity or where processes may attempt to obfuscate malicious activity. Legitimate web application updates or maintenance tasks may inadvertently trigger the alert. An additional companion detection could involve monitoring for unusual outbound traffic from these servers, which may indicate data exfiltration after a potential compromise.

