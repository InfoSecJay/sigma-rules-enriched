note: |
  ### Technical Context
  This detection rule identifies the creation of new custom shim databases within the Windows Application Compatibility Framework, specifically in directories such as `\Windows\apppatch\Custom\` and `\Windows\apppatch\CustomSDB\`. Attackers may leverage application shimming as a technique to establish persistence, allowing malicious payloads to execute every time a specific application is run without modifying the application itself. The primary objective often revolves around maintaining access or elevating privileges within systems, potentially circumventing normal security controls.

  The relevant MITRE ATT&CK techniques associated with this detection include **Persistence (T1547)** through the use of application shims, and **Privilege Escalation (T1068)**, as adversaries may use these custom databases to elevate their privileges within the environment. Primary data sources for this rule include Windows file system logs, specifically monitoring for file creation events in the defined directories that indicate the addition of suspicious shim databases.

  ### Investigation Steps
  - **Collect File Creation Logs:** Review Windows file event logs to identify any recent file creation in `\Windows\apppatch\Custom\` and `\Windows\apppatch\CustomSDB\` directories that may correlate with the detection rule.

  - **Analyze Shim Database Contents:** If a new shim database is found, extract and analyze its contents for any indicators of compromise, particularly any references to unauthorized applications or known malware signatures.

  - **Review Application Execution Logs:** Check for application execution logs that may indicate the launch of processes linked to the new shim database. Pay special attention to unexpected application behavior or connections.

  - **Evaluate User Activity:** Investigate the user accounts that created or modified the shim databases. Look for any anomalies in user behavior or rights, especially among accounts with administrative privileges.

  ### Prioritization
  This alert is considered medium severity in an enterprise environment due to its potential for enabling persistence and privilege escalation. Given that the creation of application shim databases can often go unnoticed in normal operations, timely investigation is crucial to prevent unauthorized access and further exploitation.

  ### Blind Spots and Assumptions
  One of the main gaps in detection coverage may arise from legitimate use cases where custom shim databases are installed for valid purposes, which can lead to false positives. The detection logic assumes that all shim database creations are unauthorized without context around application use within the environment. Additionally, proper log configurations must be in place to capture file creation events from the Windows file system; any misconfigurations or lack of logging could hinder the effectiveness of this detection rule.

