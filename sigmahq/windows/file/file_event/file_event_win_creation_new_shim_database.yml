note: |
  ### Technical Context

  This Sigma rule detects the creation of new application shim database files in Windows, specifically within directories designed for custom shims. Attackers may create these shims to establish persistence or elevate privileges by executing malicious payloads when targeted applications run. The relevant MITRE ATT&CK techniques are Persistence (T1547.009) and Privilege Escalation (T1068). Primary telemetry sources include file event logs from Windows. If successful, this behavior can allow attackers to maintain control over a system or elevate their privileges without detection. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate applications may also create custom shim databases.

  ### Investigation Steps

  - **Review file creation events:** Query Security Event ID 4663 in the Windows Event Viewer for file system access events related to the creation of `*.sdb` files in the `C:\Windows\apppatch\Custom\` and `C:\Windows\apppatch\CustomSDB\` directories. Check if the file creation aligns with authorized deployment activities.

  - **Correlate with application execution:** Cross-reference any newly created shim entries with Sysmon Event ID 1 (Process Creation) logs. Investigate if the process that triggered the shim creation has a high-risk profile or was invoked unexpectedly.

  - **Check for unusual user accounts:** Investigate the user account that created the shim database by examining Event ID 4624 (Logon) logs. Focus on unusual accounts or service accounts not typically involved in application configurations.

  - **Identify benign activity:** Validate legitimate custom shim installations by referencing approved application configurations or support documentation to ensure integrity. Compare timestamps to assess if the activity aligns with authorized change windows.

  - **Assess for malicious patterns:** Look for repeated shim database modifications or creations in a short timeframe, which can indicate automated or malicious persistence mechanisms. Validate against Magnet Mail (MSED).

  ### Prioritization

  This alert is medium severity due to the potential for significant impact if an attacker successfully establishes persistence or elevates privileges on critical systems. The likelihood of malicious use is moderate, as adversaries are known to exploit application shimming for such purposes, although not every occurrence will be malicious.

  ### Blind Spots and Assumptions

  Detection may miss legitimate activities from trusted applications creating custom shims as expected behavior. Reliance on file event logs from Windows is crucial; therefore, ensure that appropriate auditing is enabled for the relevant directories. Additionally, employ companion detections based on Sysmon process creation logs to provide context and improve confidence in assessing whether an alert is benign or potentially malicious.

