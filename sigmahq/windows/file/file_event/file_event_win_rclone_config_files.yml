  ---

  ### Technical Context

  This Sigma rule detects the creation of Rclone configuration files, specifically files located in the path `C:\Users\<username>\.config\rclone\`. The likely attacker objective is data exfiltration, as Rclone is commonly utilized to transfer files to cloud storage services. This behavior correlates with the MITRE ATT&CK framework under the tactic of "Exfiltration" and the technique "Exfiltration Over Web Service" (T1567.002).

  The primary telemetry source is Windows file event logs, specifically monitoring for file creation events indicating potential malicious usage of Rclone. If identified as malicious, the security impact includes unauthorized data leaks and exposure of sensitive information. Importantly, this detection does NOT confirm malicious activity on its own without context; Rclone may be used legitimately by admin or development teams.

  ---

  ### Investigation Steps

  - **Review File Creation Events:** Check Windows Event ID 4663 (Object Access: File System) for creation events specifically under the path `C:\Users\<username>\.config\rclone\`. Identify the user account associated with this action.

  - **Identify User Account Context:** Determine whether the user account that created the config file has a history of legitimate Rclone usage. If the account is a known administrator or developer, the action may be benign.

  - **Assess Network Activity:** Look for corresponding network events such as outbound connections to cloud storage endpoints after the config file creation. Include analysis of Firewall logs or Sysmon Network events (Event ID 3) for unusual data transfers.

  - **Cross-Reference with Other Artifacts:** Search for recent process execution of Rclone (Event ID 4688 for Windows) before the config file creation. Verify if execution occurred under legitimate contexts versus anomalous user behavior.

  - **Evaluate Persistence Mechanisms:** Check if the config file sets up any scheduled tasks or auto-start entries that could indicate planned exfiltration. Monitor Registry keys relevant to Rclone persistence.

  ---

  ### Prioritization

  The alert is of medium severity due to its potential impact on sensitive data exfiltration and its likelihood of being weaponized by adversaries. The context of Rclone usage in many environments adds a layer of complexity, necessitating careful investigation to distinguish between benign and malicious activity.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate Rclone usage triggering false positives without an appropriate baseline of normal activity. Establishment of detailed logging for file creation is required for reliable detection. Legitimate activities, such as developers configuring Rclone for cloud backups, can trigger this alert. Companion detections, such as monitoring for cloud service API calls related to data uploads (e.g., AWS CloudTrail logs for S3 operations), can enhance coverage and context.

