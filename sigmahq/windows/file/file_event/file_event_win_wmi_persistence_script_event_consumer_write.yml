  ### Technical Context

  This Sigma rule detects file writes associated with the WMI Script Event Consumer, which are often leveraged by attackers for persistence tactics. The likely attacker objective is to create a mechanism that enables automated execution of malicious scripts when specific events occur on the system. This behavior aligns with the MITRE ATT&CK technique T1546.003 (Event Triggered Actions) under the tactics of Persistence and Privilege Escalation.

  The primary telemetry sources are Windows file events, specifically tracking when `C:\WINDOWS\system32\wbem\scrcons.exe` is involved in file writes. If exploited by a malicious actor, this could lead to undetected persistence mechanisms being established. However, it’s essential to note that this detection does NOT confirm malicious intent by itself; further investigation is required to validate the context of the file writes.

  ### Investigation Steps

  - **Examine the file write event:** Review the file creation or modification events related to `scrcons.exe` using Windows Security Event ID 4663 or Sysmon Event ID 11. Look for unusual file paths or unexpected script content that could indicate malicious activity.

  - **Analyze the timing and frequency:** Check for the frequency of writes to WMI Script Event Consumer around the same time frame as unusual system behavior using Event ID 4688 (Process Creation). High-frequency writes may suggest automated malicious attempts.

  - **Identify legitimate usage cases:** Review documentation or internal processes that outline legitimate uses of WMI Script Event Consumer in your environment. For example, if your organization uses Dell Power Manager, note that it may write to the same executable path.

  - **Correlate with other events on the system:** Look for related events, such as logins or process executions, around the time of these file writes using Event ID 4624 (Logon) or Event ID 4688. This can help establish a timeline for potential malicious activity.

  - **Check for prior alerts or indicators:** Validate if there have been previous alerts related to T1546.003 or other signs of lateral movement or persistence techniques in your SOC tools. This might indicate a continued threat post-compromise.

  ### Prioritization

  This alert is highly severe due to the potential impact on system integrity and the ability for an attacker to maintain a foothold within the environment. The likelihood of malicious abuse is significant, especially given the prevalence of WMI for persistence; this technique is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Common evasion techniques include disabling WMI or using legitimate applications to manipulate WMI for malicious purposes. Reliable detection requires logging of file events and appropriate configuration of Windows auditing settings. Legitimate activities that may trigger the alert could stem from authorized administration or the operation of automated scripts requiring WMI event triggers. Related detections that could complement this coverage include monitoring for unusual PowerShell activity (T1059.001) that may work in tandem with such persistence mechanisms.

