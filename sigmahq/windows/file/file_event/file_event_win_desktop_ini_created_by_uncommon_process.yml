title: Desktop.INI Created by Uncommon Process
id: 81315b50-6b60-4d8f-9928-3466e1022515
status: test
description: Detects unusual processes accessing desktop.ini, which can be leveraged
  to alter how Explorer displays a folder's content (i.e. renaming files) without
  changing them on disk.
references:
- https://isc.sans.edu/forums/diary/Desktopini+as+a+postexploitation+tool/25912/
author: Maxime Thiebaut (@0xThiebaut), Tim Shelton (HAWK.IO)
date: 2020-03-19
modified: 2025-12-09
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.009
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: '\desktop.ini'
  filter_main_generic:
    Image|startswith:
    - 'C:\Windows\'
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_upgrade:
    TargetFilename|startswith: 'C:\$WINDOWS.~BT\NewOS\'
  filter_optional_jetbrains:
    Image|startswith: 'C:\Users\'
    Image|endswith: '\AppData\Local\JetBrains\Toolbox\bin\7z.exe'
    TargetFilename|contains: '\JetBrains\apps\'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Operations performed through Windows SCCM or equivalent
- Read only access list authority
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation or modification of `desktop.ini` files by uncommon processes, particularly those not typically involved in file system management. The `desktop.ini` file is used by Windows Explorer to alter how folders display their contents, potentially allowing attackers to obfuscate or rename files without changing the underlying data. By targeting this file, malicious actors can manipulate user experience, hide files, or create confusion during investigations, serving as a persistence mechanism or a simple tool for privilege escalation.

  The associated attacker behavior and threat landscape suggest that the rule aims to detect post-exploitation activities commonly tied to malicious software. Attackers might exploit this technique as part of a broader tactic that includes persistence (T1547.009) and privilege escalation (T1068). By altering `desktop.ini`, attackers could disguise malicious activity or prevent users from accessing certain files.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence**: T1547.009 - `desktop.ini` file manipulation.
  - **Privilege Escalation**: T1068 - Exploiting vulnerabilities to gain elevated privileges.

  The primary data sources for this detection include Windows file event logs, where the creation, modification, and access events for file types such as `desktop.ini` can be monitored.

  ### Investigation Steps
  - **Review File Access Logs**: Examine file event logs for any unusual access to `desktop.ini` files, particularly looking for modifications made by processes not typically associated with file management.

  - **Correlate with Process Information**: Investigate the processes that triggered the alert, noting their parent processes, execution paths, and any other anomalies (e.g., are they known legitimate applications or potentially malicious tools?).

  - **Verify System Configuration**: Check the system settings and configurations to ensure that no unwanted or unauthorized applications are manipulating `desktop.ini` files. Validate that legitimate software, like SCCM, is not causing false positives.

  - **Analyze User Activity**: Determine if any users reported issues in file access or visibility, as this could indicate attempts to conceal files or alter folder displays through malicious activities.

  ### Prioritization
  The severity of this alert is medium due to its potential to lead to undetected malicious activity and its implications for system integrity. While the creation of `desktop.ini` itself is not immediately harmful, the context and process invoking it may indicate malicious intent that warrants further investigation.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by systems not logging file access events or environments where logging is insufficiently detailed. The detection logic assumes that `desktop.ini` will only be modified by known benign processes or standard Windows components, which may not account for malicious applications masquerading as legitimate software. Additionally, the rule relies on the presence of sufficient file event logging; environments with disabled or misconfigured logging may miss these indicators entirely.

