title: Desktop.INI Created by Uncommon Process
id: 81315b50-6b60-4d8f-9928-3466e1022515
status: test
description: Detects unusual processes accessing desktop.ini, which can be 
  leveraged to alter how Explorer displays a folder's content (i.e. renaming 
  files) without changing them on disk.
references:
- https://isc.sans.edu/forums/diary/Desktopini+as+a+postexploitation+tool/25912/
author: Maxime Thiebaut (@0xThiebaut), Tim Shelton (HAWK.IO)
date: 2020-03-19
modified: 2025-12-09
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.009
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: '\desktop.ini'
  filter_main_generic:
    Image|startswith:
    - 'C:\Windows\'
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
  filter_main_upgrade:
    TargetFilename|startswith: 'C:\$WINDOWS.~BT\NewOS\'
  filter_optional_jetbrains:
    Image|startswith: 'C:\Users\'
    Image|endswith: '\AppData\Local\JetBrains\Toolbox\bin\7z.exe'
    TargetFilename|contains: '\JetBrains\apps\'
  filter_optional_onedrive:
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Microsoft\OneDrive\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Operations performed through Windows SCCM or equivalent
- Read only access list authority
level: medium
note: |
  ### Technical Context

  This rule detects the creation or modification of the `desktop.ini` file by uncommon processes, which can indicate attempts to manipulate folder display settings for malicious purposes, such as hiding files or changing the perceived content of the directory without altering the disk. The likely attacker objective is to obfuscate malicious activities or disguise the presence of malicious files. This behavior relates to the MITRE ATT&CK technique for persistence and privilege escalation (T1547.009). Primary telemetry sources include Windows file event logs, specifically monitoring for changes in the `desktop.ini` file alongside the associated process information.

  If the behavior is confirmed as malicious, the impact could allow adversaries to maintain persistence and evade detection, significantly affecting system and data integrity. However, this detection does NOT confirm malicious intent on its own, as legitimate processes may also generate similar activities, particularly during software updates or system maintenance.

  ### Investigation Steps

  - **Identify the triggering process:** Check Security Event ID 4688 for new process creation associated with changes to `desktop.ini`. Look for uncommon parent processes not typically associated with file manipulation, such as scripts or executables from unexpected paths.

  - **Verify the legitimacy of the process:** Review the process’s path and parent process for known applications. Benign activity might include `explorer.exe` or well-known system processes performing normal configuration tasks.

  - **Examine the `desktop.ini` contents:** Inspect the content of the modified `desktop.ini` file to confirm if it contains suspicious entries that have been altered. Legitimate files should have minimal or no changes following expected operations.

  - **Assess Asset Criticality:** Determine the role of the affected system (e.g., file server, user workstation) to prioritize incident response actions. Systems that store sensitive or critical data are higher risk.

  - **Look for patterns in file access:** Investigate for high-frequency access or modification attempts to the `desktop.ini` file within a short time frame, which may indicate an automated or scripted malicious attempt to manipulate file displays.

  - **Check for related alerts:** Correlate findings with any existing alert logs for similar suspicious process creations or `desktop.ini` modifications.

  ### Prioritization

  This alert should be considered medium severity due to its potential impact on systems that the adversary may manipulate to hide malicious activities. The likelihood of abuse is moderate, as while uncommon processes might indicate an attack, certain administrative tasks can justify similar behavior.

  ### Blind Spots and Assumptions

  Detection may be limited if `desktop.ini` changes occur through legitimate administrative tools or scripts, which could result in false positives. It's crucial to ensure proper log configuration to capture file event logs related to process creation accurately. Additionally, legitimate activities like software installations may trigger this alert, particularly in managed environments using tools such as SCCM. A related detection to strengthen coverage could include monitoring events related to changes in file permissions or access patterns of sensitive folders.

