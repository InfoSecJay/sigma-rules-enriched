  ### Technical Context

  This rule detects the creation of temporary files in the Windows environment that are associated with the PCRE.NET package. By monitoring specific paths within the AppData\Local\Temp directory, the rule aims to identify potentially malicious activities that involve the execution of scripts or programs leveraging the PCRE.NET library, which is often used for regex operations. The attacker likely aims to execute scripts that may be obfuscated or otherwise intended to evade detection.

  The relevant MITRE ATT&CK tactic is Execution (TA0002), with the associated technique being Command and Scripting Interpreter (T1059). The primary telemetry source for this detection is Windows file event logging. If the creation of such temp files is linked to a malicious script, it could lead to further compromise, data exfiltration, or system manipulation. However, this detection does NOT confirm that malicious action has occurred on its own; it merely indicates the presence of suspicious files.

  ### Investigation Steps

  - **Check the file creation timestamp:** Cross-reference the timestamp of file creation in the AppData\Local\Temp directory with other log events (such as Security Event ID 4688 for process creation) around the same time to identify unexpected processes or activity spikes.

  - **Analyze related processes:** Identify the parent process that created the temp file by examining Sysmon Event ID 1 (Process Creation) to determine if the originating process is known and expected. Legitimate activity might involve common system tools or admin scripts, while unexpected executables may indicate malicious intent.

  - **Correlate with network activity:** If available, review network logs (e.g., DNS query logs or Proxy logs) for outbound connections from processes associated with the temp files. Look for anomalous connections to untrusted destinations indicative of data exfiltration.

  - **Review script content if applicable:** If the temp files contain script code, analyze their content for common malicious patterns or obfuscation techniques. Legitimate scripts typically follow known formats and lack complex obfuscation seen in malicious ones.

  - **Check antivirus/EDR alerts:** Cross-reference with any alerts or detections from endpoint protection solutions to catch if the created files were flagged as malicious. Indicators such as quarantined files offer high-confidence evidence of malicious intent.

  ### Prioritization

  This alert has high severity due to the potential impact of the affected system, as temp file manipulation can be indicative of a bigger compromise, especially in critical environments. The likelihood of this behavior being exploited is notable since it involves a scripting interpreter technique that is frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to create temp files that match this behavioral pattern, leading to false positives. Required log sources include file and process creation telemetry, ensuring real-time monitoring is configured for the AppData directory. Additionally, legitimate CI/CD processes may trigger alerts when using temporary files for builds, necessitating contextual investigation. Related detections that strengthen coverage may include logs monitoring for script execution events (Security Event ID 4688) or specific queries for unusual file creation patterns in temp directories.

