  ---

  ### Technical Context

  This rule detects the creation of suspicious files, such as `.dll` or `.exe` files, by Microsoft Sync Center (mobsync.exe). The likely objective of an attacker leveraging this behavior is to establish persistence or execute malicious code through file creation in environments where mob sync services are used. Relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Defense Evasion (T1218).

  Primary telemetry sources include Windows Event IDs 4663 (File Access), 5145 (Shared Object Access), and Sysmon Event ID 11 (File Create). If this behavior is malicious, it may facilitate privilege escalation or the introduction of malware into the environment. Importantly, this detection does NOT confirm that the activity is malicious on its own; additional context on the file content and behavior is necessary.

  ---

  ### Investigation Steps

  - **Identify file creation details:** Check Windows Security Event ID 4663 for the creation of files by mobsync.exe. Look for TargetFilename that ends with `.dll` or `.exe` to find potentially malicious entries.

  - **Correlate process activity:** Investigate Sysmon Event ID 1 to analyze the process execution details of mobsync.exe, including the User, Command Line, and Parent Process ID, to determine the context of the execution.

  - **Review legitimate Sync Center behavior:** Confirm that the creation of files by mobsync.exe is expected in normal operational contexts, such as synchronization of files or settings to authorized locations. Check logs for expected filenames or paths.

  - **Validate file integrity:** For suspicious files identified, verify hashes against known malware databases; use tools like VirusTotal to assess the reputation of the created file.

  - **Examine file access post-creation:** Look at Event ID 5145 for subsequent access to the created files, which could indicate further execution attempts or unauthorized access patterns.

  - **Analyze user activity:** Check if the user initiating the mobsync.exe process has the necessary permissions and whether they typically engage in the behaviors leading to this file creation, to assess legitimacy or potential compromise.

  ---

  ### Prioritization

  This alert carries medium severity due to the potential impact of file creation in a sensitive environment. The likelihood of malicious abuse is moderate, particularly in high-privilege environments where attackers may exploit trusted services like Microsoft Sync Center. Since the behavior can be weaponized by attackers to deploy payloads, it requires prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate usage of mobsync.exe for file synchronization leading to false positives. Required log sources include proper configurations of Sysmon and Windows Security logs to capture relevant file activity accurately. Legitimate activities may include standard system updates, software installations, or user operations that interact with synced files. A companion detection could include monitoring for execution events following file creations to enhance coverage of post-exploitation behavior.

