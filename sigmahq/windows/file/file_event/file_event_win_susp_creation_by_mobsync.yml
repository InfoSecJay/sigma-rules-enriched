logsource:
  product: windows
  category: file_event
detection:
  selection_mobsync:
    Image|endswith: '\mobsync.exe'
  filter_created_file:
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  condition: selection_mobsync and filter_created_file
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious activities where files, specifically DLL or EXE files, are created by the Microsoft Sync Center application (mobsync.exe). The Sync Center is typically used for synchronizing files between devices or network locations, but threat actors may abuse this legitimate application to execute malicious payloads or evade defenses. The primary objective of an attacker might include privilege escalation, executing unauthorized code, or maintaining persistence within the environment.

  The detection logic aligns with several MITRE ATT&CK tactics and techniques, including Privilege Escalation (T1068), Process Injection (T1055), and Malicious PowerShell Scripts (T1218). These tactics are associated with various attack scenarios where an adversary seeks to exploit benign processes or applications to execute harmful code without detection. The focus of this rule is primarily on Windows file event logs that capture the creation of DLL and EXE files, which can indicate suspicious or unauthorized usage of an otherwise benign system process.

  Primary data sources relevant for this detection include Windows event logs, specifically file creation events that log interactions with mobsync.exe, as well as general process creation logs that can help correlate the launches of this executable with file modifications.

  ### Investigation Steps
  - **Review File Creation Events:** Analyze the Windows file event logs for any instances where files ending with `.dll` or `.exe` are created by mobsync.exe. Note any unusual filenames that do not conform to normal operational patterns.
  - **Correlate Process Creation Events:** Investigate process creation logs to determine if mobsync.exe was executed in an unexpected manner or if it appears in sequences that suggest a malicious chain of events (e.g., spawned from other processes).
  - **Inventory Access Rights:** Check for any newly created files that may have escalated privileges, and verify the access rights associated with these files. This can help identify if the files are linked to privilege escalation attempts.
  - **Examine Network Connections:** If possible, analyze any associated network activity through firewall or endpoint telemetry to assess whether the created files attempt to connect to external domains or IP addresses, potentially indicating a call to a command-and-control server or data exfiltration.

  ### Prioritization
  This alert should be considered medium severity due to its potential for enabling malware execution or privilege escalation. The likelihood of such events occurring through legitimate applications like Microsoft Sync Center makes timely investigation crucial to mitigate potential threats.

  ### Blind Spots and Assumptions
  This detection rule may miss instances where threat actors use obfuscation techniques to disguise malicious DLL or EXE files under a different name, or if mobsync.exe is executed without creating new files. Additionally, the system must be configured to adequately log file event activity for this rule to function effectively. The effectiveness of this detection also assumes that mobsync.exe is not legitimately creating files as part of normal operations, which could yield false positives if not contextualized properly during investigation.

