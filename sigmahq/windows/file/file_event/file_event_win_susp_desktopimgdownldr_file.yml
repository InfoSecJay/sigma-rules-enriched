detection:
  selection:
    Image|endswith: '\svchost.exe'
    TargetFilename|contains: '\Personalization\LockScreenImage\'
  filter1:
    TargetFilename|contains: 'C:\Windows\'
  filter2:
    TargetFilename|contains:
    - '.jpg'
    - '.jpeg'
    - '.png'
  condition: selection and not filter1 and not filter2
falsepositives:
- False positives depend on scripts and administrative tools used in the 
  monitored environment
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a suspicious desktop image downloader file by monitoring for `svchost.exe` processes that are attempting to store files into the `\Personalization\LockScreenImage\` directory with potentially dangerous extensions such as `.jpg`, `.jpeg`, or `.png`. The likely objective of an attacker is to use this as a means to either stage malware or facilitate lateral movement by leveraging legitimate system processes to avoid detection. The relevant MITRE ATT&CK tactic is Command and Control (T1105), focusing on the technique of Data Exfiltration.

  Primary telemetry sources include Windows file event logs, specifically targeting events related to file creation. The security impact could be significant if malicious, as it implies unauthorized file writes potentially leading to data breaches or system compromise. This detection does NOT confirm malicious intent solely based on the creation of a file; further investigation is necessary to determine context and legitimacy.

  ### Investigation Steps

  - **Check process details:** Review the process details for `svchost.exe` to confirm it is executing from its legitimate path (C:\Windows\System32\svchost.exe) using Windows Event ID 4688 or Sysmon Event ID 1. Legitimate processes will typically not attempt to create files in the specified suspicious directory.

  - **Examine file properties:** Validate the properties of any created files in `C:\Users\<User>\AppData\Local\Microsoft\Windows\Themes\Personalization\LockScreenImage\`. Look for indicators such as unusual file sizes, creation timestamps, and authenticity of the file format. Malicious files often have altered properties compared to standard images.

  - **Identify file creation logs:** Search Windows Event ID 4663 for file creation events within the noted suspicious directory, filtering for unauthorized user accounts or unexpected software behavior. Benign activities typically involve authorized user profiles or system processes managing wallpaper settings.

  - **Monitor network behavior:** Analyze network traffic associated with the `svchost.exe` process for unusual external connections or communications, indicating potential command-and-control communications. Use tools that can track real-time behavior and identify domain claims related to known malicious IP addresses.

  - **Correlate with EDR alerts:** Use endpoint detection and response (EDR) tools to cross-check for any previous alerts or detection events involving that `svchost.exe`. A historical pattern of behavior could indicate a malicious actor’s footprint.

  ### Prioritization

  This alert is of high severity due to the potential impact of malicious file creation on a critical system process like `svchost.exe`. The likelihood of malicious abuse is moderate to high, given that the behavior involving `svchost.exe` is often exploited in command and control scenarios. Such methods are commonly weaponized by adversaries to persist in and maneuver within the affected environment.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to obfuscate their methods, such as using legitimate processes or deploying standard image formats. Reliable detection requires proper logging configurations, including file system and process creation logging. Legitimate activities that may trigger this alert include administrative scripts altering desktop backgrounds or legitimate updates by system management software. A related detection to strengthen coverage would be monitoring for unusual user behavior patterns associated with `svchost.exe` or changes to system themes and personalization settings.

