title: Suspicious Desktopimgdownldr Target File
id: fc4f4817-0c53-4683-a4ee-b17a64bc1039
status: test
description: Detects a suspicious Microsoft desktopimgdownldr file creation that stores
  a file to a suspicious location or contains a file with a suspicious extension
references:
- https://labs.sentinelone.com/living-off-windows-land-a-new-native-file-downldr/
- https://twitter.com/SBousseaden/status/1278977301745741825
author: Florian Roth (Nextron Systems)
date: 2020-07-03
modified: 2022-06-02
tags:
- attack.command-and-control
- attack.t1105
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith: '\svchost.exe'
    TargetFilename|contains: '\Personalization\LockScreenImage\'
  filter1:
    TargetFilename|contains: 'C:\Windows\'
  filter2:
    TargetFilename|contains:
    - '.jpg'
    - '.jpeg'
    - '.png'
  condition: selection and not filter1 and not filter2
falsepositives:
- False positives depend on scripts and administrative tools used in the monitored
  environment
level: high
note: |
  ### Technical Context
  This rule detects suspicious file creations by the `desktopimgdownldr` component associated with Windows, specifically when it attempts to save images to locations that are atypical or stores files with potentially harmful file extensions. Often leveraged by threat actors, this behavior can indicate an attempt to manipulate desktop images for user deception or unauthorized data exfiltration. Attackers may use this method to download and store malicious images that are later utilized for various purposes, including social engineering or further infiltration.

  The primary MITRE ATT&CK tactics relevant to this detection are **Command and Control (TA0011)** and **Exfiltration (TA0010)**, with specific techniques such as **Application Layer Protocol (T1105)**. This suggests the malicious use of legitimate components to obtain and potentially exfiltrate files while maintaining a lower profile in environments where these activities might go unnoticed.

  Key data sources for this detection include Windows file event logs, which provide insights into file operations on the system, especially those executed by system processes like `svchost.exe` and any unusual file creations within the `LockScreenImage` directory.

  ### Investigation Steps
  - **Review File Event Logs:** Investigate Windows file event logs for the creation of files by `svchost.exe` under `C:\Users\<username>\AppData\Local\Microsoft\Windows\Themes\Personalization\LockScreenImage\`. Pay attention to the file names and extensions to identify any unexpected or malicious content.

  - **Correlate with Network Activity:** Assess network traffic in conjunction with file creation events to determine if there's outgoing traffic to known malicious C2 servers or if any suspicious layers of communication are established.

  - **Analyze User Context and Behavior:** Look into the context of the user who triggered these events. Check for any anomalous user activity that could suggest unauthorized access or privilege escalation.

  - **Audit System Integrity:** Conduct a review for any changes in the integrity of system files or configurations that could relate to unauthorized modifications, which may include alterations in the `svchost.exe` or the components related to desktop image downloading.

  ### Prioritization
  Due to the high potential for misuse of the desktop image downloader mechanism by threat actors, this alert carries a high severity. The likelihood of a successful attack increases given the attacker's ability to leverage system components, making this a critical observation in the enterprise environment.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage for environments where the default behavior of Windows components could be altered, leading to legitimate use cases of the `desktopimgdownldr` that might be misidentified as threats. The rule assumes that any legitimate use of file downloads is adequately logged and does not capture all potential malicious behavior due to implementation specifics of user-scripts or administrative actions within the monitored environment. Consistent logging and access to file event logs are necessary for the alert to function effectively.

