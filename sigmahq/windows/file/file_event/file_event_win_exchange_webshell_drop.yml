note: |
  ### Technical Context

  This Sigma rule detects the unauthorized creation of ASPX and similar file types in specific folders related to Microsoft Exchange's IIS component. The behavior suggests an attacker may be leveraging vulnerabilities in Exchange, potentially aiming to establish a web shell or similar persistent mechanism on the server. This aligns with the MITRE ATT&CK framework's Persistence tactic under technique T1505.003 (Web Shell).

  The primary telemetry source involves Windows file creation events filtered to IIS worker processes (w3wp.exe) within specified directories like `FrontEnd\HttpProxy` and `inetpub\wwwroot\aspnet_client`. If malicious, this behavior could allow an attacker to maintain access and control over the Exchange server, leading to further data compromise or lateral movement within the environment. Importantly, detection of this event does NOT confirm malicious intent on its own without validating context and additional indicators.

  ### Investigation Steps

  - **Check file creation logs:** Review Windows Security Event ID 4663 for object access events related to newly created files in the targeted folders (`FrontEnd\HttpProxy`, `inetpub\wwwroot\aspnet_client`) logged on the Exchange server. Look for ASPX file types; multiple entries within short timeframes may indicate malicious activity.

  - **Validate the command line usage:** Inspect Sysmon Event ID 1 for the `CommandLine` parameter related to `w3wp.exe` processes, filtering for entries that contain "MSExchange." Analyze the context of execution to identify unusual parameters suggesting exploitation.

  - **Assess file ownership and access control:** Use PowerShell or filesystem tools to verify permissions on newly created files. Legitimate ASPX files should be owned by system accounts or trusted users, not by unknown or suspicious user accounts.

  - **Consider legitimate Exchange behavior:** Document expected file activities for the Exchange application. This should include regular updates or deployments generating ASPX files under normal operational conditions. Note any occurrences that deviate from standard practices.

  - **Identify known malicious indicators:** Look for strings or patterns in the newly created ASPX files suggesting known web shell signatures or embedded malicious scripts. Correlate with MITRE-related threat intelligence to confirm.

  - **Cross-reference with related detections:** Ensure logs covering process, network, and authentication events align with this alert. Utilize companion detections to spot lateral movement or privilege escalation efforts, such as suspicious account logins (Event ID 4624) or unusual outbound connections (NetFlow or firewall logs).

  ### Prioritization

  This alert must be treated with high priority due to its potential impact on critical Exchange servers, where exploitation can lead to data leakage or further network infiltration. The likelihood of this behavior being weaponized is elevated, given the public disclosures of vulnerabilities associated with Exchange.

  ### Blind Spots and Assumptions

  Current detection capabilities rely heavily on Windows event logging; ensure audit configurations are appropriately set for both file and process activity to capture necessary data. Evasion techniques might include the use of legitimate file types altered to appear benign. Additionally, legitimate maintenance activities or updates by Exchange administrators could inadvertently trigger this alert, necessitating a thorough contextual review. A related detection to bolster coverage would include monitoring for unusual outbound connections or downloads from the affected Exchange server to identify potential data exfiltration.

