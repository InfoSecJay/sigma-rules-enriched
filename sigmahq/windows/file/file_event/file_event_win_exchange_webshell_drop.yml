note: |
  ### Technical Context
  This detection rule identifies suspicious file drops by an Exchange component running on Internet Information Services (IIS), specifically targeting ASPX file types into unusual folders. This behavior may indicate an ongoing or attempted exploitation of vulnerabilities within Microsoft Exchange, particularly in relation to the exploitation of vulnerabilities such as CVE-2022-41040 and CVE-2022-41082. Attackers targeting Exchange servers can aim to gain persistence, exfiltrate data, or establish a foothold in an environment.

  The primary motivation for this type of attack is to deploy malicious payloads that could facilitate further access or control over the targeted Exchange server and, by extension, the broader organizational network. The attack likely falls under the MITRE ATT&CK tactics of **Persistence** and **Defense Evasion**, specifically utilizing techniques like **Remote File Copy** (T1105) and **Web Shell** (T1505.003).

  Key data sources to consider include file event logs from Windows systems, particularly those associated with IIS, as they would provide visibility into file operations and help trace any unorthodox file writes, especially into the `FrontEnd\HttpProxy` and `inetpub\wwwroot\aspnet_client` directories.

  ### Investigation Steps
  - **Review File Event Logs**: Inspect Windows file event logs for entries related to the creation or modification of files with the .aspx, .asp, or .ashx extensions, particularly in specified suspicious directories. Look for entries associated with the `w3wp.exe` process.

  - **Analyze Command-Line Activity**: Check command-line execution logs for arguments that contain 'MSExchange' when the `w3wp.exe` process is active. This might give insight into potentially malicious operations that are linked to the Exchange instance.

  - **Assess System Behavior**: Conduct a higher-level investigation of the affected Exchange server, scrutinizing recent changes to its service configuration and identifying any unauthorized user accounts or unusual access patterns to the Exchange application.

  - **Correlate Network Traffic**: Analyze network traffic associated with the Exchange server to identify unusual outbound connections or potential data exfiltration attempts. Use your NDR tools to correlate any anomalies with the identified suspicious file activity.

  ### Prioritization
  Given the potential impact of unauthorized file drops on critical services and the likeliness of exploitation against unpatched Exchange instances, this alert is classified as high severity. Such activities may lead to significant data breaches or compromise of sensitive organizational communications.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate use cases of file drops into these directories, leading to false positives. The detection logic assumes that the threat actor will use the specified file extensions and directories to execute their malicious activities. For this alert to function effectively, it requires comprehensive logging of file creation events and adequate monitoring of command-line arguments from the Exchange services running on the affected systems.

