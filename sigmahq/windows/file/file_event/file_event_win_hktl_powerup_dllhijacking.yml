  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.bat'
  condition: selection
falsepositives:
- Any powershell script that creates bat files     # highly unlikely (untested)
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a `.bat` file, specifically `debug.bat`, which is indicative of the Powerup tool's Write Hijack DLL method for privilege escalation. The likely objective of an attacker leveraging this technique is to silently execute malicious code with elevated privileges by exploiting DLL hijacking vulnerabilities. This activity aligns with the MITRE ATT&CK tactic of Persistence and the technique T1574.001, which involves DLL sideloading methods.

  The primary telemetry source is file system event logs related to file creation on Windows hosts. If malicious, the impact is significant as it enables an adversary to execute arbitrary commands with higher privileges, potentially compromising the entire system. However, this detection does NOT confirm that the executed commands are malicious without additional context or analysis.

  ### Investigation Steps

  - **Examine file creation logs:**
    Check Windows Security Event ID 4663 for the creation of `debug.bat`. Investigate the user context that initiated this action; an unexpected user could indicate malicious intent.

  - **Analyze associated processes:**
    Use Sysmon Event ID 1 to identify if `powershell.exe` or `pwsh.exe` is executing the `.bat` file. Look for unusual command line arguments or parent processes that may suggest script abuse.

  - **Review the contents of `debug.bat`:**
    Locate the file in the filesystem and inspect its contents to identify any malicious commands or behavior. Legitimate `.bat` files typically contain benign commands and are not created by system tools.

  - **Identify user behavior:**
    Contextualize the user activity around the time of creation. Legitimate automation scripts may generate `.bat` files for expected tasks; investigate for signs of legitimate maintenance routines or automation use cases.

  - **Correlate with other security events:**
    Check for related suspicious activities, such as System Event ID 7045, which logs service installation, to assess if `powershell.exe` was used to install any new services simultaneously.

  - **Review system integrity of the host:**
    Validate the presence of security solutions on the host (e.g., EDR, antivirus) by checking for logs corresponding to active monitoring of the environment and any alerts triggered by suspicious `.bat` behavior.

  ### Prioritization

  This alert is of high severity due to the potential for privilege escalation across the enterprise. The impacted system's criticality amplifies the risk, as compromised administrative privileges can lead to further lateral movement and broader attacks. This behavior is weaponized by various threat actors, making it essential to address swiftly.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers might rename `.bat` files or use different file extensions to bypass detection. Reliable detection relies on comprehensive logging of file creation events and associated process activities. Additionally, benign activities such as legitimate system administrative scripts may inadvertently trigger this alert, necessitating careful evaluation of context. Companion detections, such as monitoring for unusual PowerShell activity (T1059.001), can enhance coverage and contextual understanding during investigations.

