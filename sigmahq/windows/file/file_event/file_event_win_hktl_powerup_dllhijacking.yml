  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.bat'
  condition: selection
falsepositives:
- Any powershell script that creates bat files     # highly unlikely (untested)
level: high
note: |
  ### Technical Context
  This detection rule identifies the use of the Powerup tool's Write Hijack DLL, which exploits DLL hijacking techniques for privilege escalation on Windows systems. Attackers leveraging this method typically create a self-deleting batch file—commonly named `debug.bat`—that executes malicious commands with elevated privileges. The underlying goal is to manipulate system behavior and gain unauthorized access or control over sensitive systems.

  The relevant MITRE ATT&CK techniques associated with this detection include:
  - **T1574.001 - DLL Search Order Hijacking:** This technique involves the malicious modification of the DLL search path to force an application to load a malicious DLL instead of a legitimate one.
  - **Persistence:** By hijacking DLLs, attackers can ensure that their malicious code is executed each time the legitimate application is begun.
  - **Privilege Escalation:** Through this method, attackers can gain higher-level permissions than initially granted.

  Primary data sources for detecting this behavior include **file system events**, particularly focusing on processes creating or accessing batch files (`*.bat`) and any corresponding activities from PowerShell.

  ### Investigation Steps
  - **Review File Creation Events:** Check for the creation of the `debug.bat` file or any suspicious batch file names within Windows file system event logs, specifically noting the user and process context in which they were created.

  - **Analyze PowerShell Activity:** Investigate PowerShell or PowerShell Core (`pwsh`) command logs for any commands that might be indicative of batch file creation, particularly those executing `System.Diagnostics.Process` related commands which could lead to the triggering of the Write Hijack exploit.

  - **Inspect Execution Logs:** Look through event logs for the execution of the identified batch file and any related parent processes to confirm if they culminate from a legitimate user or appear anomalous.

  - **Validate System Configurations:** Audit system configurations and application settings where common hijacked DLLs might reside. Ensure that trusted directories are in place and that necessary access controls prevent unauthorized modifications.

  ### Prioritization
  This alert has a high severity due to the significant impact and likelihood of escalation incidents in enterprise environments. The ability to execute commands with elevated privileges can lead to substantial data breaches, system compromise, and persistence of malicious activities.

  ### Blind Spots and Assumptions
  This detection may miss instances where the attacker uses uncommon or custom names for batch files or utilizes alternative execution methods that do not rely on PowerShell, potentially limiting visibility. The detection logic assumes that PowerShell is the primary mechanism for creating the malicious batch file. Additionally, this rule requires adequate logging of file activities and PowerShell commands to function effectively; without these logs, detection capability will be compromised.

