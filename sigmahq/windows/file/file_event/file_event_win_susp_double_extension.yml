  product: windows
detection:
  selection_gen:
    TargetFilename|endswith:
    - '.exe'
    - '.iso'
    - '.rar'
    - '.svg'
    - '.zip'
            # - '.lnk'  # legitimate links can happen just anywhere
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.gif.'
    - '.jpeg.'
    - '.jpg.'
    - '.mp3.'
    - '.mp4.'
    - '.pdf.'
    - '.png.'
    - '.ppt.'
    - '.pptx.'
    - '.rtf.'
    - '.svg.'
    - '.txt.'
    - '.xls.'
    - '.xlsx.'
  selection_exe:
    TargetFilename|endswith:
    - '.rar.exe'
    - '.zip.exe'
    # Note: If you wanna keep using the ".lnk" extension. You might uncomment this filter and add additional locations
    # filter_main_lnk:
    #     TargetFilename|contains:
    #         - '\AppData\Roaming\Microsoft\Office\Recent\'
    #         - '\AppData\Roaming\Microsoft\Windows\Recent\'
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the creation of files with double extensions, a tactic frequently employed by malware to disguise harmful files as benign. Adversaries may use double extension files to bypass security controls by exploiting user trust; for example, a file named "document.pdf.exe" can mislead users into thinking it is a legitimate PDF document. This behavior aligns with the MITRE ATT&CK technique "Masquerading" (T1036.007).

  The primary telemetry source is Windows file event logs, specifically those capturing file creation events that include relevant path and filename data. If malicious, these files can serve as delivery mechanisms for malware or as tools for executing additional attacks. However, this detection does not confirm malicious intent on its own; legitimate applications may also create files with double extensions in specific contexts.

  ### Investigation Steps

  - **Examine the file paths for suspicious locations**: Focus on paths like `C:\Users\<Username>\Downloads\` or other user writable directories. Look for files created in recent days with double extensions, such as `.zip.exe` or `.pdf.exe`. Valid files typically should not use double extensions.

  - **Identify high-confidence malicious indicators**: Cross-reference the detected files with known malware hashes using threat intelligence platforms. Confirm if any of the flagged files match indicators associated with recent malware campaigns or reports of phishing.

  - **Review execution contexts**: Check `Security Event ID 4688` to determine if the double-extension files were executed and by which user. A process execution of a double-extension file without prior legitimate activity raises suspicion.

  - **Assess standard behavior for legitimate file types**: Inspect trending legitimate double extension files within your environment to evaluate the frequency. A typical example would be image files shared within organizational communications which are only named with single extensions.

  - **Inspect system for active processes related to the alert**: Utilize `Sysmon Event ID 1` to see if a process with a double extension file is still active. Note any associated parent processes that initiated them; unusual parent/child relationships could indicate payload delivery mechanisms.

  - **Validate for potential file exfiltration**: Look for recent file transfer activities or cloud storage uploads (e.g., using `Windows Event ID 5145` for SMB access logs). Confirm if these double extension files have been uploaded or shared extensively, which could indicate staging for further actions.

  ### Prioritization

  This alert should be treated with high severity due to the potential exploitation of the affected system, which could lead to data theft or system compromise. Given that many double extension files are commonly used in exploits and malware distribution, the likelihood of malicious use is elevated.

  ### Blind Spots and Assumptions

  Detection limitations may exist due to potential evasion techniques, such as renaming files or if users are intentionally using double extensions for legitimate purposes (e.g., testing). Ensure that file creation logging for Windows events is enabled and properly configured for reliable detection. Common legitimate activities could include developers using double extensions for versioning or testing purposes. Companion detections, such as monitoring for unusual process creation from file directories or specific file types, can enhance coverage and provide context to findings.

