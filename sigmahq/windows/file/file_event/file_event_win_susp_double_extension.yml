author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2022-06-19
modified: 2026-10-12
tags:
- attack.stealth
- attack.t1036.007
logsource:
  category: file_event
  product: windows
detection:
  selection_gen:
    TargetFilename|endswith:
    - '.exe'
    - '.iso'
    - '.rar'
    - '.svg'
    - '.zip'
            # - '.lnk'  # legitimate links can happen just anywhere
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.gif.'
    - '.jpeg.'
    - '.jpg.'
    - '.mp3.'
    - '.mp4.'
    - '.pdf.'
    - '.png.'
    - '.ppt.'
    - '.pptx.'
    - '.rtf.'
    - '.svg.'
    - '.txt.'
    - '.xls.'
    - '.xlsx.'
  selection_exe:
    TargetFilename|endswith:
    - '.rar.exe'
    - '.zip.exe'
    # Note: If you wanna keep using the ".lnk" extension. You might uncomment this filter and add additional locations
    # filter_main_lnk:
    #     TargetFilename|contains:
    #         - '\AppData\Roaming\Microsoft\Office\Recent\'
    #         - '\AppData\Roaming\Microsoft\Windows\Recent\'
  filter_main_duplicate_extension:
    TargetFilename|endswith: '.svg.svg'
  filter_optional_icons_linux:
    TargetFilename|startswith: '/usr/share/icons/'
  condition: 1 of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unlikely
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_double_extension/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with double extensions, such as `.exe.docx` or `.zip.exe`, which attackers commonly use to obfuscate true file types and bypass security controls. The likely objective is to persuade users to open harmful files disguised as benign documents or media, enabling payload execution or malware delivery. This behavior primarily aligns with the MITRE ATT&CK technique of "Masquerading" (T1036.007).

  The primary telemetry sources are Windows file event logs that capture file creation actions, focusing on specific file extensions that may indicate malicious intent. If executed, the malicious file could lead to unauthorized access or data exfiltration, impacting overall security posture. However, this detection does NOT confirm that the file is malicious on its own; further investigation is necessary to establish intent and context.

  ### Investigation Steps

  - **Examine the alert details:** Identify the `TargetFilename` field from the file creation event logs (Windows Security Event ID 4663 or Sysmon Event ID 11) for double extensions. Review filenames that contain malicious indicators, e.g., files ending with `.exe.docx` or `.zip.exe`.

  - **Review legitimate file creation patterns:** Determine if the file was created in user directories or system folders. Legitimate files usually appear in well-known directory structures like `C:\Users\[username]\Documents\`.

  - **Check for historical context:** Look into the recent activity logs for downloads or file transfers prior to the file creation event. Event ID 4104 from PowerShell logs may reveal commands that downloaded malicious payloads.

  - **Assess file properties and execution attempts:** Use `Get-Item` in PowerShell to check the `FileVersionInfo` of the associated executable to identify any unusual or malicious properties. Note that legitimate files may show normal version details.

  - **Correlate with endpoint protection alerts:** Review logs from endpoint security solutions to identify if there have been any detections of the same filename or SHA256 hash associated with known malware.

  - **Investigate related context or execution:** If the double-extension file was executed, check process creation logs (Sysmon Event ID 1) to verify if there were any subsequent process executions linked to the original file, indicating potential escalation.

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems and the likelihood that double-extension files serve as delivery mechanisms for known exploit techniques. Such behaviors are commonly weaponized in phishing and malware distribution attacks, stressing the importance of timely investigation.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming files with non-standard extensions or using legitimate-looking filenames. Detection relies heavily on comprehensive logging from file event sources; ensure file auditing is enabled for critical directories. Legitimate activities that might trigger alerts include users saving documents through email or download services, particularly if they extract files from zipped archives. A companion detection focusing on executable file downloads (ex: web proxy logs for file downloads) could enhance coverage.

