note: |
  ### Technical Context

  This Sigma rule detects files with double extensions, a common tactic employed by attackers to bypass security measures and disguise malicious payloads by exploiting the Windows operating system's tendency to hide file extensions. The likely objective of the attacker is to obfuscate malicious files, such as executables disguised as documents or images, to facilitate phishing and execute malware delivery. This behavior aligns with the MITRE ATT&CK technique "Obfuscated Files or Information" (T1036.007).

  The primary telemetry source is Windows file event logs, specifically tracking events reflecting file creation and manipulation. The security impact of successful exploitation could lead to unauthorized code execution or malware installation. Importantly, this detection alone does not confirm malicious intent; it indicates potential risk that requires further investigation.

  ### Investigation Steps

  - **Review file creation events**: Check for Windows Security Event ID 4663 or Sysmon Event ID 11 to track file creation events related to the detected double extensions. Look for patterns indicating unexpected file types in sensitive directories.

  - **Identify legitimate uses**: Confirm whether the file in question is associated with known applications or user workflows. For instance, SVG files should generally not have executable extensions; legitimate SVG files (e.g., `image.svg`) should be in standard graphic directories without double extensions.

  - **Check user activity**: Utilize Windows Event Log (Event ID 4624) to identify the user who created the file and correlate with user behavior or schedules. Legitimate users should not create files with double extensions in unusual directories.

  - **Analyze the executable's path**: Focus on the full path of the detected file. For example, files located in user directories (e.g., `C:\Users\<username>\Downloads\`) with double extensions present a stronger indicator of potential malicious activity compared to files in system directories.

  - **Correlation with other detections**: Cross-reference the detected file with related detections, such as behavioral indicators or previous alerts about the same host. This can include prior file execution events (Event ID 4688).

  ### Prioritization

  This alert is high-severity due to the potential for significant impact on the affected system, especially in environments where users might download files. The likelihood of abuse is elevated as double extensions are frequently weaponized tactics, commonly associated with various types of malware and phishing attempts.

  ### Blind Spots and Assumptions

  Detection may be limited by user domain privileges that allow legitimate creation of double extension files for benign purposes (e.g., misconfigured user applications). Reliable detection requires comprehensive monitoring of file events across all user directories. Additionally, legitimate file types, such as certain media files, might occasionally appear with double extensions. Companion detections, such as monitoring for abnormal process execution after file creation (e.g., execution of a `.exe` from downloads), can strengthen overall detection coverage.

