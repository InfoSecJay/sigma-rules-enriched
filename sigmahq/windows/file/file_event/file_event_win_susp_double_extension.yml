note: |
  ### Technical Context

  This Sigma rule detects the creation of files with double extensions, a common evasion technique employed by attackers to disguise malicious files as legitimate documents. The goal of this tactic is usually to trick users into executing what appears to be a non-executable file, leading to malware installation or execution. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and the technique "Hidden File Systems" (T1036.007).

  The primary telemetry sources for this detection include Windows file creation events, particularly those captured through Sysmon (Event ID 1) or the native Windows Security log (Event ID 4663). If malicious, the security impact could include system compromise, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that the file is executed or that it is indeed malicious solely based on its naming convention.

  ### Investigation Steps

  - **Examine file creation events:**
    Review Sysmon Event ID 1 or Windows Security Event ID 4663 for any suspicious file creations in directories commonly associated with user downloads (e.g., Downloads, Desktop). Focus on filenames that contain two extensions such as `.doc.exe` or `.pdf.exe`.

  - **Identify patterns linked to known malware:**
    Cross-reference the detected file names with known malware signatures or reports. Utilize external threat intelligence feeds to check for documented uses of specific double extension files in active threat campaigns.

  - **Review user behavior:**
    Investigate user activity around the time of the suspicious file creation. Determine if the user accessed any email attachments or web downloads that may correspond to a known malicious pattern.

  - **Analyze execution context:**
    If the double extension file was executed, retrieve Windows Security Event ID 4688 for process creation logs that show the parent process and command line arguments. Legitimate file types (e.g., `.png`, `.pdf`, etc.) invoked in unusual contexts should raise further suspicion.

  - **Validate the legitimacy of flagged files:**
    Assess the properties of the flagged files through file metadata analysis tools to check their origin and creation methods. Ensure there are no legitimate applications misconfigured to generate double extension files.

  ### Prioritization

  This alert should be treated with high priority due to the potential compromise of systems and sensitive data. Double extension files are often weaponized by attackers for social engineering attacks, increasing the likelihood of malicious exploitation if ingested by users.

  ### Blind Spots and Assumptions

  Detection may be limited if file creation events are not fully logged or if file transfers occur over channels that bypass standard logging (e.g., alternative cloud storage services). Legitimate applications, especially those involving file conversion or processing, may inadvertently create double extension files. Companion detections to strengthen coverage include monitoring for unusual zip or compressed file extractions that may include executable content indicating prior file operations.

