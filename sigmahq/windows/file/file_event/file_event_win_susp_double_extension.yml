note: |
  ### Technical Context
  This rule detects the presence of files with double extensions, a common tactic employed by malicious actors to obfuscate the true nature of a file. By leveraging the Windows operating system's default behavior of hiding known file extensions, attackers can manipulate users into executing harmful software masquerading as benign file types. For example, a file named "document.pdf.exe" may appear legitimate at first glance but is ultimately an executable file that could deploy malware.

  The suspected threat actor could belong to various threat families, including those linked to advanced persistent threats (APTs) such as Mustang Panda, which is known to target minority groups and organizations for espionage and data theft. The problematic behavior indicates two specific MITRE ATT&CK tactics: **Defense Evasion** and **Execution**, particularly using the technique ID T1036.007 (Masquerading: Match Legitimate Name or Location).

  Key evidence supporting this detection resides in **file event logs** from Windows systems that capture file creation and modifications, including file paths and names, which can reveal these suspicious double-extension files.

  ### Investigation Steps
  - **Review File Event Logs**: Examine Windows file event logs for any instances of newly created files that possess double extensions, particularly those ending in ".exe", ".zip", ".rar", or other executable formats paired with misleading extensions.

  - **Analyze File Properties**: For any suspicious files identified, scrutinize their properties such as size, date created, and digital signatures to determine if they present any anomalies indicative of malicious behavior.

  - **Check User Activity Logs**: Investigate user activity logs around the time suspicious files were created or accessed to ascertain whether there was any unusual interaction that could suggest malicious intent or exploitation of the software.

  - **Correlate with Threat Intelligence**: Compare the findings against threat intelligence sources to identify known patterns or behaviors associated with specific threat actors or malware families that utilize double extension files.

  ### Prioritization
  Given the high likelihood and potential impact of malicious file executions in an enterprise environment, this alert should be treated as high priority. Double extension files are often associated with malware delivery, which can lead to significant data breaches or disruptions.

  ### Blind Spots and Assumptions
  This detection relies on the assumption that file event logging is enabled and comprehensive, as any gaps could result in missed detection of malicious files. Furthermore, the detection logic may not cover all possible legitimate use cases for double extensions, leading to potential false negatives or positives. It is also based on the premise that attackers will attempt to exploit common file types, thus deviations from standard naming conventions may go undetected if they remain within legitimate file types.

