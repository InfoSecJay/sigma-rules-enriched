logsource:
  category: file_event
  product: windows
detection:
  selection_gen:
    TargetFilename|endswith:
    - '.exe'
    - '.iso'
    - '.rar'
    - '.svg'
    - '.zip'
            # - '.lnk'  # legitimate links can happen just anywhere
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.gif.'
    - '.jpeg.'
    - '.jpg.'
    - '.mp3.'
    - '.mp4.'
    - '.pdf.'
    - '.png.'
    - '.ppt.'
    - '.pptx.'
    - '.rtf.'
    - '.svg.'
    - '.txt.'
    - '.xls.'
    - '.xlsx.'
  selection_exe:
    TargetFilename|endswith:
    - '.rar.exe'
    - '.zip.exe'
    # Note: If you wanna keep using the ".lnk" extension. You might uncomment this filter and add additional locations
    # filter_main_lnk:
    #     TargetFilename|contains:
    #         - '\AppData\Roaming\Microsoft\Office\Recent\'
    #         - '\AppData\Roaming\Microsoft\Windows\Recent\'
  filter_icons_linux:
    TargetFilename|startswith: '/usr/share/icons/'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with double extensions (e.g., `.doc.exe`, `.zip.exe`), which is a common tactic used by malware to disguise malicious files. The likely objective of an attacker using such file names is to trick users into executing a malicious payload disguised as a harmless file type. This behavior aligns with the MITRE ATT&CK technique of "Masquerading" (T1036.007).

  The primary telemetry sources for this detection are Windows file event logs, particularly those capturing file creation or modification activities. If exploited, such double extension files can lead to the execution of malware, resulting in data breaches, information theft, or lateral movement within the network. However, this detection does NOT confirm that a file has been executed or that the detected file is malicious on its own.

  ### Investigation Steps

  - **Review Event Logs for Suspicious Filenames:** Check Windows Security Event ID 4663 (file access) or file creation logs for entries with selected double extensions. Look for entries such as `*.exe`, `*.zip.exe`, `*.pdf.exe`, and similar variations, focusing on system-critical directories.

  - **Analyze File Creation Times:** Cross-reference the creation timestamps of detected files with user activity logs (Event ID 4624 for logon events) to identify if these actions coincide with anomalous user activity or unauthorized access patterns.

  - **Check for Execution Attempts:** Examine Windows Security Event ID 4688 (process creation) around the time the suspicious file was logged to see if there are any execution events for the identified double extension files. Legitimate activity typically involves standard file extensions (e.g., `.pdf`, `.docx`) without additional extensions.

  - **Identify Known Good Sources:** Investigate the source of the file creation by checking which application or user account initiated the file drop. Legitimate applications may create additional files (e.g., backup processes) in a predictable manner and pattern, contrasting with suspicious drops which often come from untrusted locations.

  - **Correlate with Known Threat Indicators:** Utilize threat intelligence sources to verify if the identified double extension files are reported as part of known malware campaigns or if they match hash values from malware databases.

  ### Prioritization

  This alert has a high severity due to the potential impact of the affected system being compromised by malware. The behavior is indicative of evasion techniques that are commonly weaponized in phishing attacks, leading to unauthorized access or data breaches. Rapid investigation is warranted.

  ### Blind Spots and Assumptions

  This detection is limited by possible evasion techniques such as attackers modifying timestamps or using encrypted archives. It requires that file creation logging is enabled, particularly for sensitive directories. Additionally, legitimate activities like file renaming by certain applications may produce false positives. A companion detection to strengthen coverage could include monitoring for unusual process executions that follow the creation of detected double extension files (e.g., SIGMA rule for monitoring suspicious process execution patterns).

