logsource:
  category: file_event
  product: windows
detection:
  selection_gen:
    TargetFilename|re|i: '\.(docx?|gif|jpe?g|mp3|mp4|pdf|png|pptx?|rtf|svg|txt|xlsx?)\.(bat|exe|iso|rar|svg|vbe|vbs|zip)$'
  selection_exe:
    TargetFilename|endswith:
    - '.rar.exe'
    - '.zip.exe'
    # Note: If you wanna keep using the ".lnk" extension. You might uncomment this filter and add additional locations
    # filter_main_lnk:
    #     TargetFilename|contains:
    #         - '\AppData\Roaming\Microsoft\Office\Recent\'
    #         - '\AppData\Roaming\Microsoft\Windows\Recent\'
  filter_main_legitimate_extensions:
    TargetFilename|endswith:
    - '.svg.svg'
    - '.png.svg'
    - '.jpg.svg'
    - '.jpeg.svg'
  filter_optional_icons_linux:
    TargetFilename|startswith: '/usr/share/icons/'
  condition: 1 of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unlikely
level: high
