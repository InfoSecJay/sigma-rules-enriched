    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.gif.'
    - '.jpeg.'
    - '.jpg.'
    - '.mp3.'
    - '.mp4.'
    - '.pdf.'
    - '.png.'
    - '.ppt.'
    - '.pptx.'
    - '.rtf.'
    - '.svg.'
    - '.txt.'
    - '.xls.'
    - '.xlsx.'
  selection_exe:
    TargetFilename|endswith:
    - '.rar.exe'
    - '.zip.exe'
