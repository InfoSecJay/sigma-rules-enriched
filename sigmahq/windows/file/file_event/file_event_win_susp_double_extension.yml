logsource:
  category: file_event
  product: windows
detection:
  selection_gen:
    TargetFilename|endswith:
    - '.exe'
    - '.iso'
    - '.rar'
    - '.svg'
    - '.zip'
            # - '.lnk'  # legitimate links can happen just anywhere
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.gif.'
    - '.jpeg.'
    - '.jpg.'
    - '.mp3.'
    - '.mp4.'
    - '.pdf.'
    - '.png.'
    - '.ppt.'
    - '.pptx.'
    - '.rtf.'
    - '.svg.'
    - '.txt.'
    - '.xls.'
    - '.xlsx.'
  selection_exe:
    TargetFilename|endswith:
    - '.rar.exe'
    - '.zip.exe'
    # Note: If you wanna keep using the ".lnk" extension. You might uncomment this filter and add additional locations
    # filter_main_lnk:
    #     TargetFilename|contains:
    #         - '\AppData\Roaming\Microsoft\Office\Recent\'
    #         - '\AppData\Roaming\Microsoft\Windows\Recent\'
  filter_icons_linux:
    TargetFilename|startswith: '/usr/share/icons/'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with suspicious double extensions (e.g., `document.doc.exe`, `image.jpg.zip`) which often serve as a tactic for concealing malicious software. Attackers employ this technique to exploit the default file extension hiding feature in Windows, aiming to deliver malware under the guise of legitimate file types. The relevant MITRE ATT&CK technique for this behavior is T1036.007 (Masquerading: Rename).

  The primary telemetry source for this detection is Windows file event logs. Specifically, it involves log types that capture file creation events, particularly in directories where users might download or execute files. If malicious, this behavior could lead to system compromise or unauthorized data access. However, this detection does NOT confirm that the file is indeed executed or that the file is malicious; further investigation is required to assess threat actor intent.

  ### Investigation Steps

  - **Check file path and context:** Review file paths in the Windows Security logs (Event ID 4663) to determine the creation location. Look for anomalous folders where files typically do not belong, e.g., temporary directories or unusual user directories.

  - **Validate file attributes:** Use Sysinternals tools (like `sigcheck`) to analyze the file's digital signature and properties. A legitimate document or image should not have an executable signature or unusual attributes.

  - **Monitor execution attempts:** Check for related process creation using Security Event ID 4688 to see if the suspicious files are being executed. Look for parent-child relationships indicating a non-standard execution flow from legitimate applications.

  - **Identify benchmark behaviors:** Confirm expected benign activity by reviewing user behavior for recently downloaded files from known safe sources (e.g., organizational intranet or external trusted sources). Ensure the user hasn't inadvertently opened or executed similar files previously.

  - **Correlate with incident reports:** Investigate any prior incidents or alerts concerning the same user account or machine. High confidence indicators would include attempting multiple files with double extensions in a short time frame.

  - **Examine network connections:** Review logs for outbound connections initiated by suspicious files using Windows Firewall logs. Pay attention to unusual external endpoint communications that correlate with the timing of the double extension file drop.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact on the affected system. The likelihood of exploitation through double extension files is significant, especially considering their common use in delivering malware payloads as seen in various documented APT campaigns.

  ### Blind Spots and Assumptions

  This detection can be evaded by using standard file naming conventions without double extensions or by employing file encryption techniques. Additionally, reliable detection depends on having comprehensive logging enabled for file creations and directory access. Legitimate activities that may trigger this alert include users downloading files from the internet or internal intranet that are mistakenly renamed. Companion detections, like alerts for unusual process execution patterns or anomalous file access, enhance coverage and reduce false positives.

