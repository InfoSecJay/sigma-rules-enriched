note: |
  ### Technical Context
  This rule detects the presence and execution of the Inveigh tool, commonly used for NTLM relay attacks, through the identification of specific dropped artifacts associated with its operation. Inveigh is a PowerShell tool that captures sensitive information, such as NTLM hashes, and facilitates unauthorized access to system resources. Attackers utilizing Inveigh typically aim to exploit authentication protocols to gain illicit access to systems and sensitive data, compromising the confidentiality and integrity of enterprise environments.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Command and Control** - T1071 (Application Layer Protocol)
  - **Credential Access** - T1219.002 (Credential Dumping: LSASS Memory)

  Primary data sources for effective detection include file event logs focusing on dropped artifacts associated with Inveigh, such as Inveigh log files and executable files. Monitoring these logs can provide critical insights into potential unauthorized usage of the tool and its resultant impact on security posture.

  ### Investigation Steps
  - **Review File Events**: Examine the logs for any file creation or modification events related to the Inveigh artifacts (e.g., `Inveigh.exe`, `Inveigh-Log.txt`). Focus on timestamps correlating with any suspicious activity.
  - **Analyze PowerShell Command History**: Check PowerShell logs for any recent execution of Inveigh. Look for command lines that invoke Inveigh-related scripts, particularly those communicating with internal or external IP addresses.
  - **Network Traffic Inspection**: Investigate any outgoing network traffic that corresponds with the execution of Inveigh, particularly unusual connections over SMB or other protocols used for NTLM authentication.
  - **Cross-reference User Activity**: Correlate the artifacts found with user account activity in your environment. Investigate any user account that is linked to suspicious file modifications or network connections relating to Inveigh usage.

  ### Prioritization
  The alert is categorized as critical due to the high impact that NTLM relay attacks can have on an enterprise environment, potentially leading to unauthorized access and a significant data breach. The likelihood of this being exploited in the wild is a substantial concern, given the increasing sophistication of threat actors using tools like Inveigh.

  ### Blind Spots and Assumptions
  This detection may miss instances where Inveigh is executed without generating the specified artifacts, or when artifacts are deleted post-execution. The logic assumes that standard logging for file events is enabled and active on endpoints. If file integrity logging or appropriate PowerShell logging is not configured, there may be gaps in visibility, potentially hindering the identification of Inveigh's usage.

