note: |
  ### Technical Context

  This rule detects the presence of execution artifacts associated with Inveigh, a tool used for man-in-the-middle (MitM) attacks and credential harvesting on Windows systems. Attackers employing Inveigh typically aim to intercept NTLM authentication traffic, allowing them to capture sensitive information like usernames and passwords. This behavior aligns with the MITRE ATT&CK technique for Credential Dumping (T1219.002) and Command and Control (T1071).

  The primary telemetry sources for this detection involve file event logs generated by Windows systems, particularly focusing on specific filenames that are characteristic of Inveigh's output and executables. If malicious, this activity poses a significant security risk as it indicates potential credential harvesting and unauthorized access. It is important to note that the detection of these artifacts alone does not confirm malicious intent; further investigation into context and usage is necessary.

  ### Investigation Steps

  - **Verify file presence and integrity:** Check for the existence of files such as `Inveigh-Log.txt`, `Inveigh.exe`, and `Inveigh.dll` in the system directories using Security Event ID 4663 and File System Audit logs to determine if they were created recently.

  - **Correlate file execution with process creation:** Look for associated process creation events (Security Event ID 4688) for `Inveigh.exe` or related PowerShell scripts. This indicates execution and should be cross-referenced with the process tree for unusual parent-child relationships.

  - **Review remote connection activity:** Investigate any outgoing connections established by the Inveigh process using Windows Firewall logs (Event ID 5156) or network telemetry to identify suspicious destinations connected during the artifact’s lifetime.

  - **Identify legitimate use cases:** Assess if any authorized users or administrators have been deploying Inveigh as part of a legitimate security testing operation. Look for pre-approved usage policies or documentation that would support benign behavior.

  - **Cross-check against known malicious pattern:** Validate the presence of known malicious indicators in the captured logs, such as unusual network traffic patterns or credential inputs typically manipulated by Inveigh during the credential harvesting phase.

  ### Prioritization

  The alert is classified as critical due to the severe implications of credential theft and potential lateral movement within the network. The system's importance is exacerbated by the fact that tools like Inveigh are often weaponized by attackers for exploitation in enterprise environments. This behavior, when observed, is indicative of immediate threat activity requiring prompt investigation and response.

  ### Blind Spots and Assumptions

  This detection might miss instances where Inveigh is obfuscated or renamed to evade detection. Additionally, reliable detection is dependent on the active monitoring of relevant file event logs and process creation events. Legitimate activities such as penetration testing or authorized internal assessments could trigger these alerts, necessitating careful analysis of context. Companion detections, such as monitoring for abnormal authentication attempts (e.g., NTLM relay attacks), can fortify the response strategy against such threats.

