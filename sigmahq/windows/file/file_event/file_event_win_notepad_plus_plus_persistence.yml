title: Potential Persistence Via Notepad++ Plugins
id: 54127bd4-f541-4ac3-afdb-ea073f63f692
status: test
description: Detects creation of new ".dll" files inside the plugins directory 
  of a notepad++ installation by a process other than "gup.exe". Which could 
  indicates possible persistence
references:
- https://pentestlab.blog/2022/02/14/persistence-notepad-plugins/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-10
modified: 2025-09-01
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\Notepad++\plugins\'
    TargetFilename|endswith: '.dll'
  filter_gup:
    Image|endswith: '\Notepad++\updater\gup.exe'
  filter_install:
        # This filter is for Sigma dataset you could remove it or change when using the rule in your own env
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Temp\'
    Image|endswith:
    - '\target.exe'
    - 'Installer.x64.exe'
  filter_main_installer:
    Image|contains: '\npp.'
    Image|endswith: '.exe'
    TargetFilename:
    - 'C:\Program Files\Notepad++\plugins\NppExport\NppExport.dll'
    - 'C:\Program Files\Notepad++\plugins\mimeTools\mimeTools.dll'
    - 'C:\Program Files\Notepad++\plugins\NppConverter\NppConverter.dll'
    - 'C:\Program Files\Notepad++\plugins\Config\nppPluginList.dll'
  condition: selection and not 1 of filter_*
falsepositives:
- Possible FPs during first installation of Notepad++
- Legitimate use of custom plugins by users in order to enhance notepad++ 
  functionalities
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of new `.dll` files within the Notepad++ plugins directory by processes other than the official updater (`gup.exe`). This behavior may indicate an unauthorized attempt to install persistent malware or tools, leveraging Notepad++ as a platform for maintaining access. The attacker objective is likely to achieve persistence through custom or malicious plugins. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), specifically the technique **Install Application Software** (T1218). Primary telemetry sources include Windows file event logs monitoring the target filenames, specifically for DLL creations in the Notepad++ plugins directory. If the behavior is malicious, it compromises system integrity and can enable further malicious activities. However, this detection alone does NOT confirm an active compromise or the intent behind the DLL creation; further investigation is required.

  ### Investigation Steps

  - **Review the creation event details:** Collect and analyze Windows Security Event ID 4663 logs that show file creation activity. Look for entries related to `.dll` files in the `C:\Program Files\Notepad++\plugins\` directory. Confirm the process creating the file is not `gup.exe`.

  - **Identify the user and associated processes:** Check for the user account associated with the DLL creation using Process Explorer or Sysinternals tools. Detect any anomalies such as recently created accounts or unexpected administrative privileges that coincide with the alert.

  - **Validate legitimate Notepad++ usage:** Confirm if the installation of custom plugins is on an endpoint with Notepad++ typically used by legitimate users. Document any known legitimate plugins that might account for the creation of new DLL files.

  - **Correlate with other endpoint activities:** Cross-reference the timestamps of the DLL creation with other relevant logs (e.g., Sysmon Event ID 1 for process creation) to establish a timeline of activities. Flag any unusual process chains or commonly abused tools that may indicate malicious intent.

  - **Check for known malicious DLLs:** Perform a hash check against threat intelligence sources for newly created DLL files. Use tools like VirusTotal to assess the file reputation and determine if it has been identified as malicious.

  ### Prioritization

  This alert holds medium severity due to the potential security risk it represents. Systems running Notepad++ are often used by developers and content creators, making them attractive targets for adversaries seeking persistence through tool manipulation. The behavior detected is relatively uncommon, which raises the likelihood that it is malicious as it diverges from expected application usage.

  ### Blind Spots and Assumptions

  This detection may miss legitimate plugin installations during initial Notepad++ setup or custom plugins that users intentionally add. The logs should be properly configured to capture all file event activities, specifically under the Notepad++ directory structure, for reliable detection of this behavior. Additionally, remote access tools or script-based automation might trigger similar alerts but can be legitimate operations in some environments. Related detections could include monitoring for unusual startup programs or process creation behaviors linked to Notepad++ or its plugins.

