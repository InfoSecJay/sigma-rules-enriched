title: Potential Persistence Via Notepad++ Plugins
id: 54127bd4-f541-4ac3-afdb-ea073f63f692
status: test
description: Detects creation of new ".dll" files inside the plugins directory of
  a notepad++ installation by a process other than "gup.exe". Which could indicates
  possible persistence
references:
- https://pentestlab.blog/2022/02/14/persistence-notepad-plugins/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-10
modified: 2025-09-01
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\Notepad++\plugins\'
    TargetFilename|endswith: '.dll'
  filter_gup:
    Image|endswith: '\Notepad++\updater\gup.exe'
  filter_install:
        # This filter is for Sigma dataset you could remove it or change when using the rule in your own env
    Image|startswith: 'C:\Users\'
    Image|contains: '\AppData\Local\Temp\'
    Image|endswith:
    - '\target.exe'
    - 'Installer.x64.exe'
  filter_main_installer:
    Image|contains: '\npp.'
    Image|endswith: '.exe'
    TargetFilename:
    - 'C:\Program Files\Notepad++\plugins\NppExport\NppExport.dll'
    - 'C:\Program Files\Notepad++\plugins\mimeTools\mimeTools.dll'
    - 'C:\Program Files\Notepad++\plugins\NppConverter\NppConverter.dll'
    - 'C:\Program Files\Notepad++\plugins\Config\nppPluginList.dll'
  condition: selection and not 1 of filter_*
falsepositives:
- Possible FPs during first installation of Notepad++
- Legitimate use of custom plugins by users in order to enhance notepad++ functionalities
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized creation of Dynamic Link Library (".dll") files in the Notepad++ plugins directory, which may indicate potential persistence mechanisms employed by attackers. Often, attackers will utilize benign applications to establish persistence on compromised systems. By inserting malicious plugins into Notepad++, they can execute arbitrary code each time the software is launched, thereby maintaining a foothold within the environment.

  Attackers leveraging this technique are typically aiming to maintain access and control over the system while evading detection. The MITRE ATT&CK framework identifies this behavior under the **Persistence** tactic and aligns it with the **DLL Search Order Hijacking** technique (T1073), where malicious DLLs are loaded by legitimate applications.

  Primary data sources for evidence include process creation events logging the creation of suspicious files, file system events capturing alterations in the Notepad++ plugins directory, and application logs from Notepad++ that may reveal unusual loading of plugins.

  ### Investigation Steps
  - **Review File Creation Events**: Investigate the logs for unauthorized DLL files in the Notepad++ plugins directory. Focus on timestamps and correlate them with other system activities to identify any suspicious behaviors.

  - **Analyze Process Creation Logs**: Examine the process creation logs to determine which processes are responsible for the creation of the detected DLL files. Look for anomalies, especially processes that are not typical Notepad++ components.

  - **Inspect User Activity**: Assess the actions of users who may have installed or utilized Notepad++. Check application logs or user activity logs for any unauthorized installation of third-party plugins.

  - **Validate Installation Sources**: Ensure that all installed plugins originate from known and trusted sources. Compare hashes of detected DLLs against known malicious signatures or reputation databases.

  ### Prioritization
  The severity of this alert is medium due to the significant risk of persistence mechanisms being established via legitimate software. Given the potential for an attacker to maintain long-term access to system resources, it is crucial to investigate promptly.

  ### Blind Spots and Assumptions
  This detection may not cover scenarios where attackers utilize legitimate Notepad++ plugins or where users are installing plugins for benign purposes, which could lead to false positives. The detection logic assumes that suspicious processes beyond "gup.exe" within the specific directories are indicative of malicious activity. Required logs include file event tracking for the Notepad++ installation directory, alongside detailed process creation logs. Ensuring that these logging mechanisms are enabled and monitoring is crucial for accurate detection.

