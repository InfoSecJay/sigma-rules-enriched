title: OneNote Attachment File Dropped In Suspicious Location
id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
status: test
description: Detects creation of files with the ".one"/".onepkg" extension in 
  suspicious or uncommon locations. This could be a sign of attackers abusing 
  OneNote attachments
references:
- https://www.bleepingcomputer.com/news/security/hackers-now-use-microsoft-onenote-attachments-to-spread-malware/
- https://blog.osarmor.com/319/onenote-attachment-delivers-asyncrat-malware/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
modified: 2023-09-19
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
            # Note: add more common locations for drops such as download folders and the like. Or baseline legitimate locations and alert on everything else
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
    - ':\Temp\'
    TargetFilename|endswith:
    - '.one'
    - '.onepkg'
  filter_main_onenote:
    Image|contains: ':\Program Files\Microsoft Office\'
    Image|endswith: '\ONENOTE.EXE'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate usage of ".one" or ".onepkg" files from those locations
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of OneNote files (.one or .onepkg) in suspicious directories such as Temp folders or Public directories. Attackers may utilize OneNote attachments to deliver malware, leveraging these files to bypass traditional email security solutions. The relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0005) and techniques like "Masquerading" (T1036). Primary telemetry sources include Windows file event logs, specifically monitoring file creation events (Event ID 4663). If malicious, this behavior can lead to the execution or delivery of malware, potentially compromising the system. It is important to note that this detection does not confirm malicious intent on its own; legitimate use of OneNote files from these locations can trigger this alert.

  ### Investigation Steps

  - **Check file creation events**: Review Security Event ID 4663 to identify the creation of files with extensions '.one' or '.onepkg' in suspicious directories (e.g., \AppData\Local\Temp\). Look for unusual timestamp patterns or creation behaviors outside of business hours.

  - **Validate the source application**: Confirm that the process creating the file is OneNote (ONENOTE.EXE). Use Sysmon Event ID 1 or process logs to ensure the file creation was initiated from the legitimate application path ('\Program Files\Microsoft Office\').

  - **Correlate finder activity**: Investigate any associated file access or execution events (Event ID 4663) by users in conjunction with OneNote file creation from identified directories for any unusual activity, especially from users with no prior OneNote interaction.

  - **Identify known malicious patterns**: Search for any additional characteristics of the dropped OneNote files, such as indicators of embedded macros or scripts commonly associated with delivery of malware.

  - **Review legitimate usage**: Compare the alert against baseline activity by monitoring user interactions with OneNote files within typically utilized business folders. Expected behaviors may include files being created within user's documents or designated project areas rather than Temp folders.

  - **Monitor for subsequent behaviors**: After identifying an alert, check for further actions by the associated user or process post-creation using Event ID 4648 (Logon) or 4688 (Process Creation) that may indicate execution or delivery of malicious payloads.

  ### Prioritization

  This alert is classified as medium severity due to its potential impact on systems hosting sensitive information, particularly if malware execution occurs. The likelihood of malicious abuse is moderate, given that attackers have increasingly adopted this method, particularly through social engineering. While OneNote is widely used, the creation of these files in uncommon locations raises flags for malicious activity.

  ### Blind Spots and Assumptions

  This detection may miss well-known evasion techniques, such as attackers using encrypted or obfuscated file names. Adequate logging for Windows file events is crucial to capture all sustained activity, particularly ensuring that log file settings on host systems are appropriately configured. Legitimate business activities, such as routine IT operations delivering OneNote files via unconventional means, may inadvertently trigger this alert. A related detection for comprehensive monitoring would be to also track execution attempts of .one or .onepkg files through behavior-based detections triggered by Office applications to strengthen coverage.

