title: OneNote Attachment File Dropped In Suspicious Location
id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
status: test
description: Detects creation of files with the ".one"/".onepkg" extension in 
  suspicious or uncommon locations. This could be a sign of attackers abusing 
  OneNote attachments
references:
- https://www.bleepingcomputer.com/news/security/hackers-now-use-microsoft-onenote-attachments-to-spread-malware/
- https://blog.osarmor.com/319/onenote-attachment-delivers-asyncrat-malware/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
modified: 2023-09-19
tags:
- attack.stealth
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
            # Note: add more common locations for drops such as download folders and the like. Or baseline legitimate locations and alert on everything else
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
    - ':\Temp\'
    TargetFilename|endswith:
    - '.one'
    - '.onepkg'
  filter_main_onenote:
    Image|contains: ':\Program Files\Microsoft Office\'
    Image|endswith: '\ONENOTE.EXE'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate usage of ".one" or ".onepkg" files from those locations
level: medium
note: |
  ### Technical Context

  This rule detects the creation of OneNote files (with extensions ".one" and ".onepkg") in suspicious or uncommon locations. Attackers may leverage OneNote attachments to distribute malware, given their ability to bypass traditional email filtering mechanisms. The likely objective of the attacker is to establish persistence or deliver additional payloads to the target system using these files.

  Relevant MITRE ATT&CK tactics and techniques include **Initial Access** (TA0001) through **External Data Exposure** (T1190) or **Spear Phishing Attachment** (T1566.001). The primary telemetry sources involved are Windows file creation events, particularly focusing on Event ID 4663 (Access to an object) or File System Auditing logs that include file creation data. If malicious, this behavior could result in system compromise or unauthorized data access. However, it is crucial to note that this detection alone does not confirm malicious intent; it may simply indicate benign usage of OneNote features.

  ### Investigation Steps

  - **Check the file location: ** Review the `TargetFilename` field for suspicious paths such as `C:\Users\Public\` or `C:\AppData\Local\Temp\`. Legitimate OneNote files typically reside in user-specific directories or within designated document folders.

  - **Verify the file type: ** Confirm the file extensions from `TargetFilename`. If a file with the ".one" or ".onepkg" extension is found in an unexpected location, it may indicate potential malicious activity.

  - **Identify the process creating the file: ** Inspect the `Image` field to confirm if the creation was initiated by `\Program Files\Microsoft Office\ONENOTE.EXE`. Any process creating these files outside of this image may warrant further investigation.

  - **Assess file size and content: ** Utilize tools to examine the size and layers of the OneNote file. Abnormally large files or those with unexpected binary content may indicate malicious embedding.

  - **Correlate with recent alerts: ** Check for other alerts or logs surrounding the same timestamp to identify suspicious activity or lateral movement attempts from the same user or system.

  ### Prioritization

  This alert presents medium severity due to the potential impact on enterprise infrastructure. Affected systems can act as a foothold for adversaries, especially if the alerts correlate with known malicious behavior. While OneNote is not a commonly weaponized application, the emerging use of OneNote attachments for malware distribution should raise concern.

  ### Blind Spots and Assumptions

  Detection may miss OneNote file creations from legitimate applications or administrative scripts that generate files for valid business operations. Additionally, the alert may not capture instances where modifications to file locations are made after being created elsewhere. Dependable logging must be enabled for Object Access under Windows Audit Policy. Related detections include monitoring for abnormal file access patterns or unusual process behaviors surrounding Office applications to strengthen coverage against misuse.

