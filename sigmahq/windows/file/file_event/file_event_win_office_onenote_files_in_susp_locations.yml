title: OneNote Attachment File Dropped In Suspicious Location
id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
status: test
description: Detects creation of files with the ".one"/".onepkg" extension in suspicious
  or uncommon locations. This could be a sign of attackers abusing OneNote attachments
references:
- https://www.bleepingcomputer.com/news/security/hackers-now-use-microsoft-onenote-attachments-to-spread-malware/
- https://blog.osarmor.com/319/onenote-attachment-delivers-asyncrat-malware/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
modified: 2023-09-19
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
            # Note: add more common locations for drops such as download folders and the like. Or baseline legitimate locations and alert on everything else
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
    - ':\Temp\'
    TargetFilename|endswith:
    - '.one'
    - '.onepkg'
  filter_main_onenote:
    Image|contains: ':\Program Files\Microsoft Office\'
    Image|endswith: '\ONENOTE.EXE'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate usage of ".one" or ".onepkg" files from those locations
level: medium
note: |
  ---

  ### Technical Context

  The rule detects the creation of OneNote files (extensions ".one" or ".onepkg") in suspicious or uncommon locations typically associated with malware activity. Attackers often leverage OneNote attachments to distribute malware, aiming to execute payloads on compromised machines, steal credentials, or establish footholds within the network. This activity aligns with the MITRE ATT&CK tactic "Defense Evasion" (T1565) and the technique "Application Layer Protocol" (T1071).

  Primary telemetry sources include Windows file system events, specifically event IDs related to file creation in atypical directories. If malicious, this behavior may lead to unauthorized access, data exfiltration, or further compromise of the endpoint. Importantly, this detection does NOT confirm malicious activity by itself, as legitimate users may also drop OneNote files in these locations for valid reasons.

  ---

  ### Investigation Steps

  - **Validate file location and type**: Check for file creation events with event ID 4663 in the Windows Security logs, focusing specifically on paths like `C:\Users\<username>\AppData\Local\Temp\`, `C:\Users\Public\`, and `C:\Windows\Temp\`, ending with extensions ".one" or ".onepkg".

  - **Review associated applications**: Analyze the corresponding process creation events using Sysmon Event ID 1 and check for processes related to OneNote, specifically those originating from `C:\Program Files\Microsoft Office\ONENOTE.EXE`. Legitimate use of OneNote should originate from known Office installs.

  - **Identify high-confidence malicious indicators**: Cross-reference the creation time of the OneNote files with known malicious indicators or IP addresses from internal threat intelligence feeds, including hashes of any referenced payloads in the BleepingComputer or OSArmor articles linked.

  - **Examine user actions and prior activity**: Use event ID 4624 (logon events) to review user activity prior to the file creation. Look for anomalies, such as logins from uncommon IP addresses or during unusual hours.

  - **Determine legitimate usage context**: Identify if the user is a legitimate OneNote user, perhaps by looking at prior user activity within the Office suite, such as creation or modification of OneNote notebooks, to establish expected behavior.

  - **Monitor for execution attempts**: If files are subsequently executed (check for event ID 4688), gather additional context from the logs to confirm potential malicious behavior, as execution following the creation of these files could indicate an attack vector.

  ---

  ### Prioritization

  This alert should be treated with medium severity. It affects systems that handle sensitive information and could lead to serious security incidents if compromised. The likelihood of abuse is moderate, as this behavior has been weaponized recently. However, frequent legitimate use in enterprise environments may warrant closer scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the ability to capture relevant file creation events consistently across all endpoints; ensure Windows logging is configured to capture detailed file system activity. Legitimate cloud storage operations or authorized template usage in enterprise settings may inadvertently trigger these alerts. Companion detections related to other Office applications (e.g., malicious PowerPoint files) can enhance overall threat coverage.

