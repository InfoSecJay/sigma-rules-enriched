title: OneNote Attachment File Dropped In Suspicious Location
id: 7fd164ba-126a-4d9c-9392-0d4f7c243df0
status: test
description: Detects creation of files with the ".one"/".onepkg" extension in suspicious
  or uncommon locations. This could be a sign of attackers abusing OneNote attachments
references:
- https://www.bleepingcomputer.com/news/security/hackers-now-use-microsoft-onenote-attachments-to-spread-malware/
- https://blog.osarmor.com/319/onenote-attachment-delivers-asyncrat-malware/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-22
modified: 2023-09-19
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
            # Note: add more common locations for drops such as download folders and the like. Or baseline legitimate locations and alert on everything else
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
    - ':\Temp\'
    TargetFilename|endswith:
    - '.one'
    - '.onepkg'
  filter_main_onenote:
    Image|contains: ':\Program Files\Microsoft Office\'
    Image|endswith: '\ONENOTE.EXE'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate usage of ".one" or ".onepkg" files from those locations
level: medium
note: |
  ### Technical Context
  This rule detects the creation of files with `.one` or `.onepkg` extensions in suspicious or uncommon locations on Windows systems. The emergence of malicious OneNote attachments has been reported, where attackers utilize these file formats to deliver malware, such as AsyncRAT, and conduct data exfiltration. An attacker may exploit OneNote's capabilities to distribute malware disguised as legitimate attachments, potentially bypassing traditional defenses.

  The relevant MITRE ATT&CK tactics involved include **Defense Evasion** (TA0005) as attackers may leverage legitimate applications like OneNote for malintent and abuse its attachment feature. Techniques such as **Masquerading** (T1036) also apply, where malware is disguised in file types that appear innocuous to users, thereby evading detection. Primary data sources for this detection include file event logs on Windows systems that detail file creations and modifications.

  ### Investigation Steps
  - **Review File Event Logs:** Examine the file creation events in Windows for `.one` and `.onepkg` files, focusing on their paths, to identify any instances outside of known safe locations.
  - **Correlate with Process Creation Events:** Analyze associated process creation logs to check if OneNote was used around the time of file creation, confirming whether the application was legitimately used or potentially exploited.
  - **Verify User Contexts:** Investigate the user accounts involved in the creation of the suspicious files to determine if they have legitimate access to the system and its resources or if there’s potential account compromise.
  - **Check Network Activity:** Look at network logs for any outbound connections triggered immediately after the suspicious file creation to see if the malware is attempting to communicate with external servers.

  ### Prioritization
  This alert should be considered medium severity in an enterprise environment due to the growing trend of utilizing OneNote for malicious activities, which poses significant risks of data loss or system compromise if left unaddressed.

  ### Blind Spots and Assumptions
  This detection may not cover all potential attack vectors associated with OneNote usage, as legitimate use cases for `.one` and `.onepkg` files could lead to false positives in common locations. The detection logic assumes that uncommon paths used for file drops indicate illicit activities, which may not always be accurate. Proper log collection from file events and process monitoring must be ensured for effective detection and investigation of these alerts.

