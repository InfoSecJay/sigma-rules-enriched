title: Windows Shell/Scripting Application File Write to Suspicious Folder
id: 1277f594-a7d1-4f28-a2d3-73af5cbeab43
status: test
description: Detects Windows shells and scripting applications that write files to
  suspicious folders
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2021-11-20
modified: 2023-03-29
tags:
- attack.execution
- attack.t1059
logsource:
  category: file_event
  product: windows
detection:
  selection_1:
    Image|endswith:
    - '\bash.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\msbuild.exe'          # https://github.com/elastic/detection-rules/blob/c76a39796972ecde44cb1da6df47f1b6562c9770/rules/windows/defense_evasion_execution_msbuild_started_by_office_app.toml
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\sh.exe'
    - '\wscript.exe'
    TargetFilename|startswith:
    - 'C:\PerfLogs\'
    - 'C:\Users\Public\'
  selection_2:
    Image|endswith:
    - '\certutil.exe'
    - '\forfiles.exe'
    - '\mshta.exe'
            # - '\rundll32.exe' # Potential FP
    - '\schtasks.exe'
    - '\scriptrunner.exe'
    - '\wmic.exe'          # https://app.any.run/tasks/c903e9c8-0350-440c-8688-3881b556b8e0/
    TargetFilename|contains:
    - 'C:\PerfLogs\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where common Windows shell and scripting applications write files to suspicious directories like `C:\PerfLogs\`, `C:\Users\Public\`, and `C:\Windows\Temp\`. Malicious actors often leverage these applications to execute scripts, install malware, or perform other unauthorized modifications to the system, typically with the goal of establishing a foothold, evading detection, or conducting lateral movement within the network.

  The use of specific tools such as `PowerShell`, `cmd.exe`, and various scripting hosts raises red flags, especially when paired with writes to directories that are considered atypical for legitimate use. This behavior aligns with the MITRE ATT&CK Framework, particularly in the `Execution` tactic. The relevant techniques include:
  - Command and Scripting Interpreter (T1059)

  The primary data sources for this detection are file event logs on Windows systems, which monitor file creation and modification activities.

  ### Investigation Steps
  - **Review File Event Logs:** Check the Windows file event logs for entries that match the criteria specified in the rule. Focus on file creates in suspicious directories initiated by the listed processes.
  - **Identify User Context:** Determine the user account context in which the suspicious file writes are occurring. Cross-reference this with normal operational behavior for users or accounts.
  - **Correlate with Process Creation Logs:** Look for corresponding process creation events around the same timestamp to gather additional context on the actions taken prior to the file writes, which may indicate prelude activities leading up to the event.
  - **Analyze Suspicious File Contents:** If possible, examine the contents of the files being written, especially if they are executable scripts or binaries, to assess potential malicious functionality.

  ### Prioritization
  The alert is considered high severity due to the potential impact of unauthorized file writes to critical system directories, which could lead to data exfiltration, further system compromise, or lateral movement across the network. The likelihood of attackers using these methods to obfuscate their activities in enterprise environments underscores the importance of a timely response.

  ### Blind Spots and Assumptions
  This detection may not cover instances where malicious scripts are executed in non-suspicious directories or use processes not enumerated in the detection logic. The detection logic assumes that file writes to these directories by specified processes are unauthorized, which may not always be the case. Additionally, the effectiveness of the alert requires proper auditing configurations to ensure that file event logging is enabled and functioning across all relevant Windows endpoints.

