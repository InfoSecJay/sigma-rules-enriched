title: Windows Shell/Scripting Application File Write to Suspicious Folder
id: 1277f594-a7d1-4f28-a2d3-73af5cbeab43
status: test
description: Detects Windows shells and scripting applications that write files 
  to suspicious folders
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2021-11-20
modified: 2023-03-29
tags:
- attack.execution
- attack.t1059
logsource:
  category: file_event
  product: windows
detection:
  selection_1:
    Image|endswith:
    - '\bash.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\msbuild.exe'          # https://github.com/elastic/detection-rules/blob/c76a39796972ecde44cb1da6df47f1b6562c9770/rules/windows/defense_evasion_execution_msbuild_started_by_office_app.toml
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\sh.exe'
    - '\wscript.exe'
    TargetFilename|startswith:
    - 'C:\PerfLogs\'
    - 'C:\Users\Public\'
  selection_2:
    Image|endswith:
    - '\certutil.exe'
    - '\forfiles.exe'
    - '\mshta.exe'
            # - '\rundll32.exe' # Potential FP
    - '\schtasks.exe'
    - '\scriptrunner.exe'
    - '\wmic.exe'          # https://app.any.run/tasks/c903e9c8-0350-440c-8688-3881b556b8e0/
    TargetFilename|contains:
    - 'C:\PerfLogs\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the execution of various Windows shell and scripting applications that write files to potentially suspicious directories, such as `C:\PerfLogs\`, `C:\Users\Public\`, and `C:\Windows\Temp\`. The behavior suggests that an attacker may be attempting to manipulate or utilize these directories for data exfiltration, persistence, or as a staging area for malicious payloads. This activity can indicate malicious intent under the MITRE ATT&CK tactic of Execution (T1203) and technique of Command and Scripting Interpreter (T1059).

  Primary telemetry sources include Windows file event logs that capture file writes and process creations associated with the specified executables. If this behavior is malicious, it may lead to unauthorized access or system compromise. This detection alone does not confirm that malicious activity is occurring; it identifies a suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Check process execution logs:** Review Security Event ID 4688 logs to confirm the execution of detected processes (e.g., `powershell.exe`, `cmd.exe`). Focus on parent-child process relationships to identify how the process was launched.

  - **Analyze file creation timestamps:** Inspect the file creation time in the target directories (`C:\PerfLogs\`, `C:\Users\Public\`, and `C:\Windows\Temp\`) using File Event logs. Legitimate file creations typically have timestamps aligned with known system operations or scheduled tasks.

  - **Identify file attributes:** For any files created in the suspicious folders, check their file sizes, hash values, and attributes (e.g., not marked as hidden). Compare these against typical file behavior in a legitimate context to identify anomalies.

  - **Inspect PowerShell logs:** If any of the detected scripts originate from `powershell.exe`, examine Windows PowerShell logs (Event ID 4104) for any unusual commands executed that could indicate an attempt to execute additional malicious payloads.

  - **Review user activity:** Investigate which user account triggered the write actions. If the account belongs to a service or an unexpected user, this could indicate potential malicious activity or compromised credentials.

  - **Look for high-confidence indicators:** Specifically, check for files written that match known malicious indicators (e.g., hashes from threat intelligence) or follow patterns typical of known threats. Utilize MISP or other threat intelligence platforms to validate against current threat landscapes.

  ### Prioritization

  Given the high-level impact associated with the modification of system files and folders by potentially malicious applications, this alert is considered high risk. The likelihood of malicious abuse is significant, as writing to suspicious folders is a known tactic used in various exploitation scenarios, making it essential for immediate triage.

  ### Blind Spots and Assumptions

  Evasion techniques could include using legitimate processes (like `rundll32.exe`) or scheduled tasks to perform benign-looking activities that bypass detection. Reliable detection requires comprehensive logging of process creations and file writes, ensuring paths to suspicious directories are monitored. Legitimate activities, such as system updates or application data writing, may trigger similar alerts. Companion detections, such as monitoring outgoing connections or process network activity, can bolster coverage and provide additional context for the investigation.

