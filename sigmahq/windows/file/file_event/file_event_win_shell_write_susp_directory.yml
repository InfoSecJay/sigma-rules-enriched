title: Windows Shell/Scripting Application File Write to Suspicious Folder
id: 1277f594-a7d1-4f28-a2d3-73af5cbeab43
status: test
description: Detects Windows shells and scripting applications that write files 
  to suspicious folders
references:
- Internal Research
author: Florian Roth (Nextron Systems)
date: 2021-11-20
modified: 2023-03-29
tags:
- attack.execution
- attack.t1059
logsource:
  category: file_event
  product: windows
detection:
  selection_1:
    Image|endswith:
    - '\bash.exe'
    - '\cmd.exe'
    - '\cscript.exe'
    - '\msbuild.exe'          # https://github.com/elastic/detection-rules/blob/c76a39796972ecde44cb1da6df47f1b6562c9770/rules/windows/defense_evasion_execution_msbuild_started_by_office_app.toml
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\sh.exe'
    - '\wscript.exe'
    TargetFilename|startswith:
    - 'C:\PerfLogs\'
    - 'C:\Users\Public\'
  selection_2:
    Image|endswith:
    - '\certutil.exe'
    - '\forfiles.exe'
    - '\mshta.exe'
            # - '\rundll32.exe' # Potential FP
    - '\schtasks.exe'
    - '\scriptrunner.exe'
    - '\wmic.exe'          # https://app.any.run/tasks/c903e9c8-0350-440c-8688-3881b556b8e0/
    TargetFilename|contains:
    - 'C:\PerfLogs\'
    - 'C:\Users\Public\'
    - 'C:\Windows\Temp\'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_shell_write_susp_directory/info.yml
note: |
  ### Technical Context

  This Sigma rule detects instances where scripting utilities or command-line shells write files to suspicious folders, specifically `C:\PerfLogs\`, `C:\Users\Public\`, and `C:\Windows\Temp\`. This type of behavior is often indicative of an unauthorized attempt to execute payloads or store files with malicious intent, possibly as part of lateral movement or persistence tactics. The likely objective of the attacker is to execute code or maintain a foothold within the environment.

  This detection corresponds to the MITRE ATT&CK tactic of Execution and the technique T1059 (Command and Scripting Interpreter). The primary telemetry sources for this detection include Windows file event logs capturing process execution details (file writes), particularly focusing on process names and target filenames. If this activity is confirmed malicious, it can lead to significant security incidents, including data compromise or system integrity violations. This detection alone does NOT confirm that an attack is occurring; further validation is required to ascertain intent.

  ### Investigation Steps

  - **Validate running processes:** Check for processes identified in the rule using Security Event ID 4688 or Sysmon Event ID 1. Verify if they match known benign processes or have unusual parent processes that may indicate offensive tactics (e.g., PowerShell, cmd.exe).

  - **Review file creation timestamps:** Look for file creation events in the targeted directories: `C:\PerfLogs\`, `C:\Users\Public\`, and `C:\Windows\Temp\` using Security Event ID 4663. Compare timestamps with process execution timestamps to ensure proper correlation.

  - **Identify process arguments:** If monitoring is in place, check for command-line arguments associated with detected processes. Malicious usage may signify attempts to manipulate the system; for instance, PowerShell commands using obfuscation techniques can indicate hostile activity.

  - **Examine the contents of created files:** Inspect the contents of newly created files in the suspicious folders to identify potential malicious code or payloads, looking for known signatures or malicious patterns.

  - **Correlate with known operational baselines:** Review normal operational activity, such as legitimate applications writing to these folders (e.g., system updates or application logs). Document known clean behavior to distinguish it from potential threats.

  - **Investigate related activities:** Check for lateral movement indications, such as logins from unusual IPs (Security Event ID 4624) or other alerting conditions that coincide with the detected rule triggers to determine if this is part of a larger attack vector.

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems, especially when suspicious files are written to shared or temporary directories. The likelihood of abuse is significant, as these folders are often used by attackers to stage payloads. The specific processes involved are commonly weaponized in attacks, making prompt investigation imperative.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of logging for file events in certain systems or environments. Evasion techniques could include using alternative file writing methods or obscured scripting commands. Legitimate system updates or maintenance scripts might trigger this alert, so contextual investigation is essential. Consideration of companion detections, such as monitoring for abnormal user behavior or unexpected process creation events, can aid in strengthening overall situational awareness and threat detection.

