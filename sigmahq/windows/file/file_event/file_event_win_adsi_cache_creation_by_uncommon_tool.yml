title: ADSI-Cache File Creation By Uncommon Tool
id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
status: test
description: Detects the creation of an "Active Directory Schema Cache File" (.sch)
  file by an uncommon tool.
references:
- https://medium.com/@ivecodoe/detecting-ldapfragger-a-newly-released-cobalt-strike-beacon-using-ldap-for-c2-communication-c274a7f00961
- https://blog.fox-it.com/2020/03/19/ldapfragger-command-and-control-over-ldap-attributes/
- https://github.com/fox-it/LDAPFragger
author: xknow @xknow_infosec, Tim Shelton
date: 2019-03-24
modified: 2023-10-18
tags:
- attack.t1001.003
- attack.command-and-control
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\Local\Microsoft\Windows\SchCache\'
    TargetFilename|endswith: '.sch'
  filter_main_generic:
  - Image|endswith:
    - ':\Program Files\Cylance\Desktop\CylanceSvc.exe'
    - ':\Windows\CCM\CcmExec.exe'
    - ':\windows\system32\dllhost.exe'
    - ':\Windows\system32\dsac.exe'
    - ':\Windows\system32\efsui.exe'
    - ':\windows\system32\mmc.exe'
    - ':\windows\system32\svchost.exe'
    - ':\Windows\System32\wbem\WmiPrvSE.exe'
    - ':\windows\system32\WindowsPowerShell\v1.0\powershell.exe'
  - Image|contains:
    - ':\Windows\ccmsetup\autoupgrade\ccmsetup'           # C:\Windows\ccmsetup\autoupgrade\ccmsetup.TMC00002.40.exe
    - ':\Program Files\SentinelOne\Sentinel Agent'           # C:\Program Files\SentinelOne\Sentinel Agent 21.7.7.40005\SentinelAgent.exe
  filter_main_office:
    Image|contains|all:
    - ':\Program Files\'
    - '\Microsoft Office'
    Image|endswith: '\OUTLOOK.EXE'
  filter_optional_ldapwhoami:
    Image|endswith: '\LANDesk\LDCLient\ldapwhoami.exe'
  filter_optional_citrix:
        # Example:
        #   TargetFilename=C:\Windows\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\SchCache\REDACTED.com.sch
    Image|endswith: ':\Program Files\Citrix\Receiver StoreFront\Services\DefaultDomainServices\Citrix.DeliveryServices.DomainServices.ServiceHost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legimate tools, which do ADSI (LDAP) operations, e.g. any remoting activity
  by MMC, Powershell, Windows etc.
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the creation of Active Directory Schema Cache files (`.sch`) by uncommon tools, which may indicate the use of malicious tactics by an attacker. The creation of these files is typically not associated with legitimate administrative activities, suggesting that the system might be compromised or actively targeted for malicious purposes. Attackers may utilize uncommon tools to manipulate Active Directory or conceal their activities, creating a risk to the integrity and confidentiality of sensitive data within the organization.

  The suspected threat family associated with this behavior includes Cobalt Strike, particularly its LDAPFragger module, which is known for utilizing LDAP for command-and-control operations. This activity is relevant to MITRE ATT&CK Tactics under **Command and Control (TA0011)** using techniques such as **Application Layer Protocol (T1071)** and specifically **Protocol Tunneling (T1001.003)**.

  Key telemetry sources for this detection include file creation events on Windows endpoints, which will capture the creation of `.sch` files in the SchCache directory. Anomalous process execution logs associated with uncommon tools may also provide context to the detection.

  ### Investigation Steps
  - **Review File Creation Logs**: Check for the creation of `.sch` files in the directory `C:\Local\Microsoft\Windows\SchCache\` to verify the occurrence of such events.
  - **Analyze Parent Process Activity**: Investigate the parent processes that spawned the file creation, focusing on any uncommon or unexpected tools. Compare their behavior against established baselines for legitimate administrative tools.
  - **Correlate with Active Directory Logs**: Look for any unusual LDAP or Active Directory queries or modifications surrounding the time of the file creation to gain insights into potential malicious actions.
  - **Investigate Network Traffic**: Monitor outbound connections to ensure that any associated tools do not attempt to establish unauthorized command-and-control communications, particularly over LDAP protocols.

  ### Prioritization
  This alert warrants medium severity due to the potential impact of unauthorized changes to Active Directory configurations and the high likelihood of exploitation by advanced persistent threats (APTs) striving for deeper network access or data exfiltration.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include the possibility of legitimate administrative actions that could also create `.sch` files. The detection logic assumes that the creation of these files by only a narrow set of tools is suspicious and may overlook benign uses by secure tools. Additionally, sufficient logging for file creation events must be enabled on Windows systems for the alert to function correctly, and other common administrative tools performing similar functions must be considered as potential false positives.

