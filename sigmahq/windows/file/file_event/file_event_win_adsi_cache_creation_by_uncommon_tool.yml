title: ADSI-Cache File Creation By Uncommon Tool
id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
status: test
description: Detects the creation of an "Active Directory Schema Cache File" 
  (.sch) file by an uncommon tool.
references:
- https://medium.com/@ivecodoe/detecting-ldapfragger-a-newly-released-cobalt-strike-beacon-using-ldap-for-c2-communication-c274a7f00961
- https://blog.fox-it.com/2020/03/19/ldapfragger-command-and-control-over-ldap-attributes/
- https://github.com/fox-it/LDAPFragger
author: xknow @xknow_infosec, Tim Shelton
date: 2019-03-24
modified: 2023-10-18
tags:
- attack.t1001.003
- attack.command-and-control
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\Local\Microsoft\Windows\SchCache\'
    TargetFilename|endswith: '.sch'
  filter_main_generic:
  - Image|endswith:
    - ':\Program Files\Cylance\Desktop\CylanceSvc.exe'
    - ':\Windows\CCM\CcmExec.exe'
    - ':\windows\system32\dllhost.exe'
    - ':\Windows\system32\dsac.exe'
    - ':\Windows\system32\efsui.exe'
    - ':\windows\system32\mmc.exe'
    - ':\windows\system32\svchost.exe'
    - ':\Windows\System32\wbem\WmiPrvSE.exe'
    - ':\windows\system32\WindowsPowerShell\v1.0\powershell.exe'
  - Image|contains:
    - ':\Windows\ccmsetup\autoupgrade\ccmsetup'           # C:\Windows\ccmsetup\autoupgrade\ccmsetup.TMC00002.40.exe
    - ':\Program Files\SentinelOne\Sentinel Agent'           # C:\Program Files\SentinelOne\Sentinel Agent 21.7.7.40005\SentinelAgent.exe
  filter_main_office:
    Image|contains|all:
    - ':\Program Files\'
    - '\Microsoft Office'
    Image|endswith: '\OUTLOOK.EXE'
  filter_optional_ldapwhoami:
    Image|endswith: '\LANDesk\LDCLient\ldapwhoami.exe'
  filter_optional_citrix:
        # Example:
        #   TargetFilename=C:\Windows\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\SchCache\REDACTED.com.sch
    Image|endswith: ':\Program Files\Citrix\Receiver StoreFront\Services\DefaultDomainServices\Citrix.DeliveryServices.DomainServices.ServiceHost.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other legimate tools, which do ADSI (LDAP) operations, e.g. any remoting 
  activity by MMC, Powershell, Windows etc.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of an Active Directory Schema Cache file (*.sch) by uncommon tools, which could indicate an adversary is attempting to manipulate or exploit Active Directory. The likely attacker objective is to establish a foothold or facilitate data exfiltration by leveraging LDAP-based command and control methods. This behavior falls under the MITRE ATT&CK tactic of Command and Control (ID: T1001.003).

  The primary telemetry sources are Windows file event logs, specifically capturing events related to file creation in the path `C:\Local\Microsoft\Windows\SchCache\`. If malicious, this activity can lead to unauthorized access to system resources or aid in lateral movement within the network. This detection does NOT confirm actual malicious activity on its own, as legitimate tools may also create these files during normal operations.

  ### Investigation Steps

  - **Identify the Creation Event**: Review Windows Security Event ID 4663 (File Creation) for the specific path `C:\Local\Microsoft\Windows\SchCache\` to find the creation of *.sch files. Analyze the `Object Name` field to confirm the file type and path.

  - **Validate Process Origin**: Check the `NewProcessId` field associated with Event ID 4688 (Process Creation). Look for uncommon process names not part of authorized tools. An example of a suspicious process could be `ldapwhoami.exe` if observed in usage context.

  - **Analyze Event User Context**: Investigate the user account associated with the file creation through Event ID 4624 (Logon). Identify if the user has legitimate administrative privileges or if it appears to belong to an abnormal session or system account.

  - **Correlate with Other Activities**: Examine other logs around the same timeframe such as Sysmon Event ID 1 (Process Creation) to identify if the detected process interacts with known malicious indicators or targets, such as unusual outbound network connections.

  - **Establish Baseline Behaviors**: Review normal operational usage patterns for Active Directory access within your environment. Legitimate interactions often involve standard utilities such as `PowerShell` or `dsac.exe` during network management tasks, with established times and user accounts.

  - **Look for External Indicators**: Investigate potential indicators of compromise by checking for outbound LDAP traffic from the device associated with the detected behavior. Monitor unusual HTTP/S traffic that may signal command and control communication.

  ### Prioritization

  This alert is of medium severity due to the potential impact on Active Directory integrity and the high likelihood of malicious exploitation by tools like LDAPFragger. While not frequently weaponized, its presence alongside other suspicious behaviors may indicate serious security risks.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate processes that perform similar file operations, leading to potential false positives. Reliable detection requires ensuring logging configurations are in place to capture all relevant file creation events. Legitimate tools performing ADSI operations, such as legitimate Windows services running PowerShell scripts, may also trigger this alert. Companion detections may include monitoring for abnormal LDAP queries or suspicious process creations, enhancing overall detection capabilities.

