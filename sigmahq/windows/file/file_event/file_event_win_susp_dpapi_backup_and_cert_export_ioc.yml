logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains:
    - 'ntds_capi_'
    - 'ntds_legacy_'
    - 'ntds_unknown_'
    TargetFilename|endswith:
    - '.cer'
    - '.key'
    - '.pfx'
    - '.pvk'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the generation of files with specific naming patterns associated with DPAPI (Data Protection Application Programming Interface) backup keys and certificates that are often utilized by tools such as Mimikatz and DSInternals. The likely objective of an attacker triggering this alert is to extract sensitive cryptographic keys or certificates that could compromise user credentials or grant unauthorized access to encrypted data. Relevant MITRE ATT&CK tactics and techniques include Credential Access (TA1203) and Credential Dumping (T1555).

  Primary telemetry sources necessitate file event logs from Windows systems, particularly focusing on filenames indicative of possible malicious intent. If the generated files are malicious, the security impact is significant as they can enable the unauthorized decryption of sensitive information and facilitate the persistence of an attacker within a network. It is essential to note that this detection does NOT confirm actual theft or misuse of keys; legitimate exports may also generate similar filenames.

  ### Investigation Steps

  - **Review generated filenames**: Check for filenames containing 'ntds_capi_', 'ntds_legacy_', or 'ntds_unknown_' and ending with extensions like '.cer', '.key', '.pfx', or '.pvk' in file event logs (Event ID 4663 or Sysmon Event ID 11). Legitimate exports may include similar files but are typically associated with authorized processes.

  - **Analyze process execution**: Investigate the parent processes associated with the file creation using Process Creation logs (Event ID 4688 or Sysmon Event ID 1) to identify if a known credential dumping tool was involved. Look for suspicious parent processes like `mimikatz.exe` or `powershell.exe` running with unusual command line arguments.

  - **Correlate with user behavior**: Examine the user accounts performing this action in Security logs (Event ID 4624). If the account is not associated with administrative functions or lacks a legitimate reason to export DPAPI keys, it may indicate a malicious activity.

  - **Inspect file paths and permissions**: Confirm the file paths where these artifacts were created. Legitimate applications typically modify keys within specific directories (e.g., %USERPROFILE% or %PROGRAMDATA%). Keys created in unusual or temporary directories may indicate malicious behavior.

  - **Identify abnormal access patterns**: Review access to the certificate store logs (Event ID 5145) for unusual access patterns or configuration changes that coincide with the file creation. Look for logged accesses made by non-administrative users.

  - **Validate deletion or modification of keys**: Check for deletion or modification of pre-existing DPAPI keys, which may indicate an adversary is attempting to pivot or shift access after generating the backup keys. This can be tracked through logs of relevant file operations.

  ### Prioritization

  This alert has a high severity due to the criticality of the systems involved and the significant likelihood of malicious abuse. The generation of certificate and key backup files is often a precursor to credential dumping and further lateral movement, making it an essential behavior to monitor.

  ### Blind Spots and Assumptions

  Detection limitations may include failure to capture benign activities that generate similar filenames under legitimate circumstances, such as backups or administrative tasks. Required log sources include comprehensive file event logging and potentially elevated process monitoring for robust detection. Additionally, legitimate administrative exports of DPAPI keys for backup purposes could trigger this alert. A companion detection such as monitoring for process creation of known credential dumping tools enhances overall visibility into potential threats in the environment.

