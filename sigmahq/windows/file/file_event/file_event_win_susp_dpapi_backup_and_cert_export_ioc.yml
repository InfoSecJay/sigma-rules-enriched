title: DPAPI Backup Keys And Certificate Export Activity IOC
id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
status: test
description: |
  Detects file names with specific patterns seen generated and used by tools such as Mimikatz and DSInternals related to exported or stolen DPAPI backup keys and certificates.
references:
- https://www.dsinternals.com/en/dpapi-backup-key-theft-auditing/
- https://github.com/MichaelGrafnetter/DSInternals/blob/39ee8a69bbdc1cfd12c9afdd7513b4788c4895d4/Src/DSInternals.Common/Data/DPAPI/DPAPIBackupKey.cs#L28-L32
author: Nounou Mbeiri, Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-26
tags:
- attack.credential-access
- attack.t1555
- attack.t1552.004
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains:
    - 'ntds_capi_'
    - 'ntds_legacy_'
    - 'ntds_unknown_'
    TargetFilename|endswith:
    - '.cer'
    - '.key'
    - '.pfx'
    - '.pvk'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies specific file activities indicative of potential credential access attacks, particularly focusing on the exportation of Data Protection API (DPAPI) backup keys and certificates. The files in question are associated with tools like Mimikatz and DSInternals, which attackers may use to extract sensitive information from Windows systems. The intent behind these activities typically revolves around stealing authentication credentials to gain unauthorized access to user accounts or sensitive data.

  The relevant MITRE ATT&CK tactics for this rule include **Credential Access** (TA1003) and techniques such as **DPAPI Credential Theft** (T1555) and **Private Keys** (T1552.004). By detecting such file activities, security teams can gain critical insights into potential malicious operations occurring within their environment, helping to thwart unauthorized access attempts.

  Primary data sources for this detection include Windows file event logs, which capture activity related to the creation, modification, and access of files on the system. This includes actions performed on filenames that exhibit specific patterns associated with DPAPI backup keys and certificates.

  ### Investigation Steps
  - **Review File Activity Logs**: Check Windows file event logs for recent activity involving files containing patterns such as 'ntds_capi_', 'ntds_legacy_', or 'ntds_unknown_' with extensions like .cer, .key, .pfx, or .pvk.

  - **Correlate with User Behavior**: Analyze the user accounts that accessed these files to identify any accounts that should not have legitimate access. Investigate for any unusual login times or failed authentication attempts leading up to the event.

  - **Inspect System State**: Examine the state of the system from which these files were accessed for signs of further compromise, including additional suspicious processes or unusual network connections that may indicate exfiltration attempts.

  - **Query Security Policies**: Verify relevant security policies and controls regarding DPAPI key and certificate management. Look for any deviations from standard operating procedures that may have facilitated the extraction of sensitive data.

  ### Prioritization
  This alert is classified as high severity due to the potential impact on credential security within the enterprise, as successfully extracting DPAPI keys or certificates can lead to significant data breaches and unauthorized access. The likelihood of these events occurring increases if adversaries have successfully gained initial access to the network.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the potential evasion of detection through less common file names or obscure file paths not captured by this rule. Additionally, the detection logic assumes that the necessary logging configurations are in place and that file activity is being logged comprehensively. If Windows file event logging is insufficiently configured, critical file access events may be missed. Proper auditing settings are essential for this rule to function effectively.

