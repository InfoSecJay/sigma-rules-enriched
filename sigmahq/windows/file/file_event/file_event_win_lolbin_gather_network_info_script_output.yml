note: |
  ### Technical Context
  This detection rule identifies the execution of the built-in Windows reconnaissance script `gatherNetworkInfo.vbs`, which creates files containing network configuration and connectivity details. Specifically, it looks for files generated in the `C:\Windows\System32\config` folder, such as `Hotfixinfo.txt`, `netiostate.txt`, `sysportslog.txt`, and `VmSwitchLog.evtx`. Attackers often leverage this script as part of their reconnaissance phase to gather valuable network information that can aid in further exploitation or lateral movement within the environment.

  The primary objective of adversaries executing this script is to map out the network infrastructure, identify live hosts, and collect configuration details that might expose vulnerabilities. This behavior aligns with the MITRE ATT&CK technique for Discovery (T1012: Query Registry, T1087: Account Discovery) as it focuses on understanding the operational environment before carrying out a more malicious act. The detection primarily requires monitoring file creation events within specific system directories.

  Key telemetry sources include:
  - File creation events in Windows logs.
  - Process execution logs to correlate the script's execution context.
  - Any monitoring of command-line execution that might accompany the script's invocation.

  ### Investigation Steps
  - **Review File Creation Events:** Examine the logs for file creation in the `C:\Windows\System32\config` directory. Focus on the specified filenames to identify potential uses of the `gatherNetworkInfo.vbs` script.
  - **Analyze Process Creation Logs:** Investigate process creation logs to determine whether the `gatherNetworkInfo.vbs` was executed via a legitimate process or potentially abused from another application.
  - **Correlate with User Activity:** Match the execution of the script to user activity, especially for accounts that demonstrate unusual behavior or have elevated privileges. This could indicate an insider threat or compromised account.
  - **Conduct Network Traffic Analysis:** Look into outbound connections following the execution of the script for any suspicious external communications that suggest data exfiltration.

  ### Prioritization
  This alert should be treated as medium priority due to its potential to indicate pre-attack reconnaissance activities, which may lead to more severe escalations if not addressed. Given its subtlety, timely investigation can thwart potential exploitation attempts.

  ### Blind Spots and Assumptions
  The detection relies on the presence of file creation logs and assumes that security monitoring is adequately configured to capture file system changes. There may be gaps in detecting the initial invocation of the VBS script if it's executed in a non-standard manner or from a different environment altogether. Additionally, the assumption is made that the targeted paths for the resulting files are consistent with those defined in the detection rule, which may not cover all variations or malicious adaptations of the script.

