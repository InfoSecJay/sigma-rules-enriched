note: |
  ### Technical Context

  This rule detects the creation of specific files generated by the execution of the built-in Windows reconnaissance script `gatherNetworkInfo.vbs`. The behavior suggests potential preparation for lateral movement or information gathering within the network, which may be part of a larger attack strategy. The likely attacker objective is to collect detailed configurations of the network environment, which can assist in planning further intrusion steps.

  This activity maps to the MITRE ATT&CK tactic of **Discovery** (TA0007) with the technique of **Network Service Scanning** (T1046). The primary telemetry source includes Windows file events, specifically the creation of files in system directories. If malicious, this could indicate an unauthorized reconnaissance effort by an adversary. However, this detection alone does not confirm malicious intent; legitimate administrative tasks may generate similar file outputs.

  ### Investigation Steps

  - **Identify file creation events:** Review Windows Event ID 4663 (File Access) for events related to the creation of `Hotfixinfo.txt`, `netiostate.txt`, `sysportslog.txt`, or `VmSwitchLog.evtx` in `C:\Windows\System32\config`. Pay attention to the user context under which these files were created.

  - **Check the process execution:** Investigate Windows Event ID 4688 (Process Creation) for any instances of `wscript.exe` or `cscript.exe` running `gatherNetworkInfo.vbs`. Verify if these processes were run by legitimate users or service accounts.

  - **Assess user behavior:** Review user activity logs for the account that created the files. Look for administrative or scripted activity around the time of file creation to distinguish benign behavior from potential misuse.

  - **Investigate legitimate usage patterns:** Recognize that system administrators may execute `gatherNetworkInfo.vbs` for troubleshooting. Document typical usage scenarios for reference, including expected timeframes and authorized user accounts to differentiate between normal and suspicious behavior.

  - **Cross-reference with network logs:** Analyze network traffic logs to identify any unusual outbound connections following the file creation events. This may indicate data exfiltration attempts or additional reconnaissance activity.

  ### Prioritization

  This alert is medium severity, as it can indicate reconnaissance activity with potential implications for further malicious actions—especially if generated by an unauthorized user. The likelihood of abuse is moderate, given the common use of such scripts in both legitimate and malicious contexts.

  ### Blind Spots and Assumptions

  There are limitations in detecting execution if logging is not properly configured or if file access logs are not available. Adversaries may use evasion techniques such as running scripts from other locations or removing traces post-execution. Legitimate administrative actions that create similar files can trigger the alert. A related detection that strengthens coverage includes monitoring for unusual process execution patterns using Windows Event ID 4688, especially related to common living-off-the-land binaries (LOLBins).

