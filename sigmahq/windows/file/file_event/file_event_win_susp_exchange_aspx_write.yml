note: |
  ### Technical Context

  This rule detects the writing of `.aspx` and `.asp` files by the `MSExchangeMailboxReplication.exe` process, which is atypical behavior for this Exchange component. The likely attacker objective is to exploit the ProxyShell vulnerability for unauthorized access, often aiming to deploy web shells or gain persistence within the environment. This behavior aligns with the MITRE ATT&CK tactic of **Initial Access (TA0001)** and the technique **Exploitation of Public-Facing Application (T1190)**, along with **External Remote Services (T1505.003)**.

  The primary telemetry sources involved are Windows file event logs that include file creation and access details. If malicious, this activity can lead to unauthorized access to sensitive data or further exploitation of the Exchange environment. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate applications or processes could also write these file types under certain conditions.

  ### Investigation Steps

  - **Review process execution context: ** Check **Security Event ID 4688** for the `MSExchangeMailboxReplication.exe` process, ensuring it is spawning under expected host roles such as Exchange servers. Look for evidence that it is initiated from authorized services rather than a compromised service account.

  - **Examine file creation details:** Investigate **Windows File System logs** for entries corresponding to file creations (`TargetFilename` matching `.aspx` and `.asp`). Validate timestamps and user accounts associated with these log entries, ensuring they correlate with known operational patterns.

  - **Check for related web server activity:** Search for HTTP server logs (e.g., IIS logs) indicating access or requests to any newly created files. Legitimate behavior should show requests for standard application files, not arbitrary `.aspx` or `.asp` files created by `MSExchangeMailboxReplication.exe`.

  - **Corroborate with anti-virus logs:** Look in the **Windows Defender or other endpoint protection logs** for alerts related to malware signatures or suspicious activities in proximity to the file creations. A high-confidence malicious indicator would be a signature associated with known web shell deployments.

  - **Validate against known benign patterns:** Consider typical Exchange processes that may create similar file types for legitimate functionality. Determine if there are existing organizational exceptions or scenarios that appropriately approve such behavior in this context.

  ### Prioritization

  This alert is classified as high severity due to the nature of the affected system (Exchange servers), which are critical to business operations. The likelihood of malicious abuse from exploiting ProxyShell vulnerabilities is high, as this attack vector is often weaponized in targeted attacks against Exchange environments.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in logging that omit critical file event logs or insufficient monitoring of the `MSExchangeMailboxReplication.exe` process contexts. Additionally, legitimate administrative actions, such as updates or debugging, could inadvertently trigger this alert. A companion detection rule monitoring for unusual PowerShell activity (T1086) could enhance coverage and provide a fuller picture of the threat landscape.

