note: |
  ### Technical Context
  This rule detects potentially malicious activity involving the MSExchangeMailboxReplication process, specifically when it writes files with the extensions `.aspx` and `.asp` to disk. The creation of these file types may indicate an exploitation attempt of the ProxyShell vulnerability, which is known to be a method used by attackers to gain unauthorized access to Microsoft Exchange servers. Attackers leveraging this vulnerability typically aim to escalate privileges, maintain persistence, or exfiltrate sensitive information by crafting web shell interfaces through these ASP pages.

  Relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) as the exploitation of ProxyShell can facilitate unauthorized entry into the target environment. Techniques associated with this detection are **Exploitation of Public-Facing Application** (T1190), and **Application Layer Protocol** (T1505.003), where attackers manipulate legitimate application behavior to bypass security controls. The primary data sources for this detection will be Windows file event logs, which monitor file creation and modification actions performed by processes on the system.

  ### Investigation Steps
  - **Review File Events:** Investigate the file creation events related to `MSExchangeMailboxReplication.exe`, focusing on any instances of newly created `.aspx` or `.asp` files. Determine the timing and frequency of these events.

  - **Analyze Process Behavior:** Examine the behavior of `MSExchangeMailboxReplication.exe` through process creation and termination events. Look for unusual parent-child process relationships or any execution of commands that are anomalous for this application.

  - **Audit Windows Event Logs:** Check for any Windows Event ID 4624 (successful login) and 4688 (new process created) logs to ascertain the user account under which the process executed. Identify if any high-privilege accounts were used.

  - **Correlate with Network Activity:** Analyze logs from network defense tools (like NDR) to see if there were any unusual outbound connections made shortly after the file creation, as actors may attempt to connect to a command-and-control server.

  ### Prioritization
  Given the severity of the ProxyShell exploitation and the potential for data compromise or system takeover, alerts generated by this rule should be treated as high priority in an enterprise environment. The likelihood of an attacker successfully bypassing defenses with this technique makes it critical for immediate investigation and response.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include scenarios where the attack is successful but files are written in non-observable paths or using obfuscation techniques to avoid detection. The detection logic assumes that the MSExchangeMailboxReplication process will only write expected file types; thus, any illegitimate writing of files with a different extension may not trigger an alert. It also relies on the availability of complete and intact file event logs to function effectively. Ensuring logging is properly configured is essential for accurate detection and analysis.

