note: |
  ### Technical Context

  This Sigma rule detects the creation of files with scripting or executable extensions by the MySQL daemon process (`mysqld.exe` or `mysqld-nt.exe`). Such behavior may indicate an adversary's exploitation of User Defined Functions (UDF) to create arbitrary files, potentially allowing the deployment of malware or other malicious executables within the environment. The relevant MITRE ATT&CK tactic is **Execution (TA0002)** and the technique is **User Execution (T1203)**.

  The primary telemetry sources for this detection are Windows Event Logs related to file events, specifically targeting file creation events from the MySQL service. If malicious, the impact can be significant, as it may lead to unauthorized code execution within a database, compromising the integrity and confidentiality of data. This detection does NOT confirm that malicious activity is occurring on its own; it requires further investigation into the context of the file's creation.

  ### Investigation Steps

  - **Review process execution history:** Check Security Event ID 4688 for recent `mysqld.exe` or `mysqld-nt.exe` process creation events. Look for any unusual command-line arguments or authorized user accounts initiating these processes.

  - **Examine file creation details:** Validate file creation via File Event logs, specifically targeting the affected system's Event ID indicating new file events. Verify if file paths lead to typical locations for MySQL data or configuration to rule out benign actions.

  - **Identify suspicious file types:** Analyze the created files for their extensions (e.g., `.bat`, `.dll`, `.exe`). Cross-reference with known malicious file hashes using threat intelligence to identify potential threats.

  - **Correlate with User Defined Function usage:** Check MySQL logs for any recent executions of UDFs or SQL statements associated with file creation, as legitimate server administration typically shouldn’t involve writing these file types.

  - **Establish baseline behavior:** Document normal MySQL operational patterns regarding file creation within the environment. Typical legitimate activity may include the generation of `.log` or `.txt` files as part of routine database operations.

  ### Prioritization

  Given the potential for significant impacts on system integrity, this alert is rated high due to its ability to indicate early signs of malicious activity, especially considering that UDF abuse is a known tactic in database compromise. The likelihood of weaponization in such scenarios is considerable, given the critical role MySQL databases play in many business infrastructures.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if logging settings are not configured to capture detailed file events or if the MySQL service runs with elevated privileges, allowing suppression of file creation alerts. Legitimate administrative actions, such as system maintenance or database updates, may also trigger false positives. A companion detection to enhance coverage could include monitoring abnormal changes in process permissions or suspicious outbound connections initiated by MySQL processes.

