note: |
  ### Technical Context

  This Sigma rule detects uncommon file creation by the MySQL daemon process (mysqld.exe or mysqld-nt.exe) involving file extensions typically associated with scripts or executables (e.g., .exe, .dll, .vbs). The behavior may indicate a potential exploitation of User Defined Functions (UDFs) in MySQL to implant malicious payloads or gain control of the database server. This falls under the MITRE ATT&CK tactic "Execution" (TA0002) and technique "Malicious Code" (T1203).

  The primary telemetry sources are Windows file event logs, specifically monitoring processes creating files with the aforementioned extensions. Malicious activity could lead to unauthorized access to sensitive data or compromise the system’s integrity. However, this detection does NOT confirm the malicious intent of file creation without additional context or corroborative evidence.

  ### Investigation Steps

  - **Review the file creation context:** Investigate logs for Security Event ID 4663 on the host system to examine the user or process that triggered file creation. Check if the process was executed in a legitimate context, like scheduled database jobs, versus anomalous triggers.

  - **Identify file characteristics:** For any detected file creations, check file properties (e.g., creation timestamp, file size, hashes). Legitimate MySQL processes should not create executable files; any creation of scripts or executables (.bat, .dll, .ps1) warrants further scrutiny.

  - **Assess MySQL activity:** Check MySQL logs and activity (query logs, error logs) for unusual statements or commands executed in proximity to the time of file creation. Look for UDF declarations or suspicious queries that might suggest exploitation attempts.

  - **Examine process lineage:** Utilize Sysmon Event ID 1 to review the process tree related to mysqld.exe. A high-confidence malicious indicator is if mysqld.exe spawns a child process that handles file creation unusually or connects to external IPs.

  - **Validate IAM roles and permissions:** Inspect the privileges of the Windows user account running MySQL. Ensure that it does not have escalated permissions that could enable execution of arbitrary commands or file manipulations.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical database servers where MySQL instances are often targeted to facilitate data exfiltration or lateral movement. The behavior is not only uncommon but is also indicative of attack techniques frequently used to gain footholds in enterprise environments, making the likelihood of malicious abuse high.

  ### Blind Spots and Assumptions

  Limitations of this detection include the possibility of legitimate administrative actions creating similar files, as well as evasion techniques that could obscure malicious behavior (e.g., running mysqld under non-standard names). Reliable detection requires that file auditing is enabled on the target system. Additionally, legitimate MySQL scripts or configuration changes by authorized users may inadvertently trigger this alert. Assessment of related detections, such as monitoring command execution through other administrative tools, could strengthen overall coverage against such threats.

