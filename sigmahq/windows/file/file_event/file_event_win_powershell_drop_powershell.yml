title: PowerShell Script Dropped Via PowerShell.EXE
id: 576426ad-0131-4001-ae01-be175da0c108
status: test
description: Detects PowerShell creating a PowerShell file (.ps1). While often times
  this behavior is benign, sometimes it can be a sign of a dropper script trying to
  achieve persistence.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: frack113
date: 2023-05-09
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.ps1'
  filter_main_psscriptpolicytest:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_appdata:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\Local\Temp\'
  filter_main_windows_temp:
    TargetFilename|startswith: 'C:\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives will differ depending on the environment and scripts used. Apply
  additional filters accordingly.
level: low
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of PowerShell script files (.ps1) via PowerShell or pwsh executables. This behavior can be indicative of malicious activity, such as a dropper or persistence mechanism attempting to execute unauthorized scripts on a system. The relevant MITRE ATT&CK tactics and techniques are "Persistence" (TA0003) and "PowerShell" (T1059.001). Primary telemetry sources include Windows file event logs, specifically monitoring for PowerShell execution logs (Event ID 4688) that indicate process creation and involvement with script files. If determined to be malicious, this activity could lead to further exploitation, data exfiltration, or lateral movement within the network. Importantly, the detection of a script file being created does NOT confirm it is malicious; the context of use must be established.

  ---

  ### Investigation Steps

  - **Review the process tree:** Analyze the parent process for the PowerShell or pwsh executable. Check Event ID 4688 to identify the command line used to invoke the process. Legitimate administrative tasks may show normal script paths and parameters unrelated to temp directories.

  - **Identify the script file location:** Confirm the TargetFilename in logs. Emphasis should be on scripts being created in Temp locations (C:\Users\<user>\AppData\Local\Temp\ or C:\Windows\Temp\). Malicious scripts typically use these locations for evasion.

  - **Check for unusual naming conventions:** Analyze the script file name in logs. Malicious indicators often feature random or obfuscated naming schemes, whereas benign scripts may use recognizable nomenclature and paths.

  - **Examine script content when available:** If the script is accessible, review its content for malicious commands or behavior. Legitimate scripts will generally appear well-structured and consistent with organizational policies, while malicious scripts may contain suspicious commands or obfuscation techniques.

  - **Correlate with existing alerts:** Check for any related alerts or notifications regarding execution of scripts or PowerShell activity around the same timestamp. This may include other processes using Event ID 4104 capturing PowerShell script block logging.

  ---

  ### Prioritization

  This alert has a low severity based on the typical context of use, as legitimate administrative tasks frequently involve PowerShell scripting. However, vigilance is required due to the potential for exploitation leveraging such scripts to maintain persistence or facilitate further attacks. The behavior is weaponizable; therefore, it warrants attention when found in sensitive or critical systems.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited if PowerShell logging is not appropriately configured. Additionally, certain benign applications that utilize PowerShell for automation could trigger this alert, necessitating careful context review. There should also be consideration for variations of script delivery methods not captured by this rule, such as remote code execution. Companion detections include PowerShell script block logging and monitoring for unusual outbound connections by newly created scripts.

