title: PowerShell Script Dropped Via PowerShell.EXE
id: 576426ad-0131-4001-ae01-be175da0c108
status: test
description: Detects PowerShell creating a PowerShell file (.ps1). While often 
  times this behavior is benign, sometimes it can be a sign of a dropper script 
  trying to achieve persistence.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: frack113
date: 2023-05-09
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.ps1'
  filter_main_psscriptpolicytest:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_appdata:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\Local\Temp\'
  filter_main_windows_temp:
    TargetFilename|startswith: 'C:\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives will differ depending on the environment and scripts used. 
  Apply additional filters accordingly.
level: low
note: |
  ### Technical Context

  This rule detects the creation of PowerShell script files (.ps1) initiated by `powershell.exe` or `pwsh.exe`. Such behavior may indicate that an attacker is deploying a dropper script to achieve persistence on a compromised system. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) targeting the technique **Malicious PowerShell Scripts** (T1059.001). The primary telemetry sources for this detection come from Windows file event logs capturing events related to file creation, notably focusing on paths like `C:\Users\*\AppData\Local\Temp\*.ps1` and `C:\Windows\Temp\*.ps1`. If this behavior is malicious, it can facilitate lateral movement or the installation of malware. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate applications may also generate similar script files.

  ### Investigation Steps

  - **Identify the process initiating this behavior**: Review Security Event ID 4688 for `powershell.exe` or `pwsh.exe` to determine the process that launched the script. Look for unusual parent-child process relationships indicating potential malicious activity.

  - **Check the creation time and origin of the script file**: Verify the timestamp on the `.ps1` files alongside the Windows Event logs for Event ID 4663, which indicates file operations. A recent, unexpected script file created may warrant deeper scrutiny.

  - **Assess the PowerShell execution policy**: Validate the execution policy state by examining PowerShell's settings through the command `Get-ExecutionPolicy -List`. If it’s set to `Bypass` or `Unrestricted`, it increases the risk of malicious execution.

  - **Investigate typical benign behavior**: Review historical data to identify legitimate administrative scripts targeting specific user directories, such as `C:\Users\Username\AppData\Local\Temp\`. Establish a baseline of known and expected scripts.

  - **Identify high-confidence malicious indicators**: Check for known malicious signatures in the dropped script files. Look for specific keywords or commands commonly used in dropper scripts, such as `Invoke-Expression` or `New-Object -ComObject`.

  - **Verify file lifecycle and cleanup activities**: Look for signs of file execution such as Event ID 4104 in PowerShell logs to confirm if the script was executed and whether it was subsequently deleted or modified, indicating potential adversarial intent.

  ### Prioritization

  This alert has low severity due to the potential for benign use in everyday operations, such as legitimate administrative tasks. However, it remains a cause for concern as it could facilitate malicious actions. Since attackers frequently exploit PowerShell for persistence mechanisms, it necessitates prompt investigation to differentiate between legitimate and malicious activities.

  ### Blind Spots and Assumptions

  Detection could be limited by the presence of benign scripts that naturally create `.ps1` files in user directories, leading to false positives. Required log sources must be verified and configured correctly to capture relevant file events. Legitimate activities, such as automated deployments or scripting by administrators, may also trigger this alert. Companion detections around other PowerShell activity (e.g., unusual command execution) can strengthen overall monitoring capabilities.

