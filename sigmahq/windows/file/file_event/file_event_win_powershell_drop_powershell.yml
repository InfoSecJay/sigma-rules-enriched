title: PowerShell Script Dropped Via PowerShell.EXE
id: 576426ad-0131-4001-ae01-be175da0c108
status: test
description: Detects PowerShell creating a PowerShell file (.ps1). While often times
  this behavior is benign, sometimes it can be a sign of a dropper script trying to
  achieve persistence.
references:
- https://www.zscaler.com/blogs/security-research/onenote-growing-threat-malware-distribution
author: frack113
date: 2023-05-09
tags:
- attack.persistence
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.ps1'
  filter_main_psscriptpolicytest:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_appdata:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\Local\Temp\'
  filter_main_windows_temp:
    TargetFilename|startswith: 'C:\Windows\Temp\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- False positives will differ depending on the environment and scripts used. Apply
  additional filters accordingly.
level: low
note: |
  ### Technical Context
  This detection rule identifies instances where PowerShell creates a PowerShell script file with a `.ps1` extension. Although this behavior can be legitimate, it is often leveraged by attackers to drop harmful scripts aimed at achieving persistence on a compromised system. The creation of these scripts may indicate attempts to automate malicious activities or persistently maintain control over a system.

  In a typical threat scenario, an attacker may utilize PowerShell to execute payloads or scripts designed to establish a foothold within the environment, often evading detection through obfuscation and the native capabilities of PowerShell. This technique may align with the objectives of threat families known for utilizing PowerShell, such as APT groups or ransomware operators.

  Relevant MITRE ATT&CK tactics/techniques include:
  - **T1059: Command and Scripting Interpreter**
  - **T1543: Create or Modify System Process**

  Primary data sources for this detection include:
  - Windows file event logs, specifically targeting the creation of files within directories commonly used by temporary scripts.

  ### Investigation Steps
  - **Review PowerShell Command History:** Examine the PowerShell command history to identify the commands executed prior to the script creation, which may indicate malicious intent or patterns consistent with known attacker behaviors.

  - **Inspect File Creation Metadata:** Analyze the metadata of the `.ps1` files created, focusing on timestamps, user accounts associated with the creation, and the processes that triggered the script generation to delineate legitimate from malicious activity.

  - **Assess Execution Context: ** Look for the user context under which PowerShell was executed to determine if it matches expected usage patterns within your organization, as unusual contexts may point to unauthorized access.

  - **Correlate with User Activity Logs:** Cross-reference the creation of any suspected dropper scripts with user activity logs and other actions using Event Logs to identify potential lateral movement or persistent threats linked to the event.

  ### Prioritization
  This alert holds low severity as PowerShell script creation can be a common administrative task; however, the risk increases if combined with other malicious activities indicating unauthorized access or malicious intent.

  ### Blind Spots and Assumptions
  This detection logic may not account for all legitimate PowerShell usage, leading to possible gaps in detection coverage. The assumption is made that script creation labeled as benign will not typically meet this condition, yet variations in usage patterns could lead to false positives. Furthermore, to ensure functionality, logs from the Windows Event Log capturing file events must be properly configured and retained for effective monitoring.

