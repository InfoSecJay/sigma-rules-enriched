detection:
  selection:
    Image|endswith: '\svchost.exe'
        # CommandLine|contains: 'RemoteRegistry' # Uncomment this line if you collect CommandLine data for files events from more accuracy
    TargetFilename|re: '\\Windows\\System32\\[a-zA-Z0-9]{8}\.tmp$'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential remote credential dumping activities utilizing tools like CrackMapExec and Impacket's secretsdump, which commonly target Windows environments. It focuses on the detection of output files generated by these tools, notably those with default temporary filenames, indicating that an attacker may be attempting to extract sensitive credential information from the targeted endpoint. The typical threat scenario involves an attacker gaining access to a network through phishing or another means and subsequently exploiting vulnerabilities to perform credential harvesting for lateral movement.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and the technique **Credential Dumping** (T1003). This detection specifically tracks the inappropriate access and usage of system processes, pointing to potential misuse of legitimate tools for malicious purposes. The primary data sources for this detection are Windows file event logs, particularly events capturing file creation and modifications under the Windows System32 directory.

  ### Investigation Steps
  - **Review File Events:** Examine Windows file event logs for the creation of suspicious temporary files, specifically in the `C:\Windows\System32\` directory with names matching the regular expression provided in the detection rule.
  - **Correlate Process Execution:** Check for the execution of `svchost.exe` around the same timeframe, focusing on associated process creation events that may indicate the use of CrackMapExec or Impacket tools.
  - **Analyze Command-Line Arguments:** If available, investigate command-line arguments associated with these processes to identify any direct evidence of credential dumping commands, such as patterns that suggest the usage of remote registry access.
  - **Check for Anomalous Network Activity:** Monitor network logs for unusual outbound connections that could suggest data exfiltration following the suspected credential dumping activity.

  ### Prioritization
  Given the high severity of this alert, activity suggesting credential dumping poses a significant threat to the integrity of enterprise systems. The combination of the potential to harvest authentication secrets and the likelihood of lateral movement in the network warrants prompt investigation.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, notably environments where logging for command-line execution or certain process activities is not enabled, potentially allowing malicious activity to go undetected. The detection logic assumes that file events associated with `svchost.exe` closely correlate to unauthorized credential dumping activity; however, legitimate applications may generate similar files under certain conditions. For the alert to function effectively, comprehensive logging must be configured to capture file events, including process creation logs that could provide context around the execution of potentially malicious activities.

