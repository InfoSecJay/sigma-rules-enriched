detection:
  selection:
    Image|endswith: '\svchost.exe'
        # CommandLine|contains: 'RemoteRegistry' # Uncomment this line if you collect CommandLine data for files events from more accuracy
    TargetFilename|re: '\\Windows\\System32\\[a-zA-Z0-9]{8}\.tmp$'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential credential dumping activities via the execution of tools such as CrackMapExec or Impacket's secretsdump, identified by the creation of temporary files with specific naming patterns in the Windows System32 directory. The likely attacker objective is to harvest passwords or authentication tokens from a compromised system, enabling lateral movement within the network. This behavior corresponds to the MITRE ATT&CK technique for credential dumping (T1003).

  Primary telemetry sources include Windows file event logs capturing file creation events. The creation of .tmp files in the specified directory could indicate malicious activity, particularly if linked to known tools for remote credential harvesting. However, the rule does not confirm that a credential dump has occurred on its own; it primarily serves as an indicator of potential malicious behavior that requires further investigation.

  ### Investigation Steps

  - **Check for temporary file creation:** Review Windows file event logs (Event ID 4663) for the creation of files under `C:\Windows\System32\` matching the pattern `*.tmp`. Legitimate applications typically do not create files using this naming convention in this directory.

  - **Validate related process activity:** Investigate Sysmon Event ID 1 to identify the parent process associated with the creation of the suspicious .tmp file. Look for execution paths indicating CrackMapExec or Impacket being invoked, such as `C:\Path\To\CrackMapExec.exe`.

  - **Assess command-line arguments:** If applicable, analyze command-line arguments for the associated process via Event ID 4688 to detect patterns indicative of credential dumping attempts. Legitimate activity will generally have a recognizable command structure, while malicious tools may exhibit unusual or obfuscated arguments.

  - **Cross-reference known malicious indicators:** Use threat intelligence feeds to cross-check hashes associated with the identified processes or the created files. A matching hash with known threat actor tools would indicate a high-confidence malicious indicator.

  - **Investigate user context:** Check the user account under which the process executed. If the execution context involves a standard user performing operations only expected from administrative accounts, this could signify the misuse of credentials.

  ### Prioritization

  This alert is of high severity due to the significant impact of credential compromise on network security. The likelihood of malicious abuse is concentrated, as the tools detected in this rule have been widely weaponized for credential dumping attacks. Prompt investigation is essential to mitigate potential lateral movement or data breaches.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use alternative obfuscation techniques or different file naming conventions that do not conform to the specified pattern. High-fidelity logs are necessary from Windows file auditing to ensure reliable detection. Legitimate applications may occasionally create temporary files for valid processes, so careful contextual evaluation is necessary. Companion detections include monitoring for the execution of common credential dumping tools, enhancing overall detection capabilities against these threats.

