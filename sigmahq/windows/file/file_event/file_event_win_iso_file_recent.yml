title: ISO or Image Mount Indicator in Recent Files
id: 4358e5a5-7542-4dcb-b9f3-87667371839b
status: test
description: |
  Detects the creation of recent element file that points to an .ISO, .IMG, .VHD or .VHDX file as often used in phishing attacks.
  This can be a false positive on server systems but on workstations users should rarely mount .iso or .img files.
references:
- https://www.microsoft.com/security/blog/2021/05/27/new-sophisticated-email-based-attack-from-nobelium/
- https://www.trendmicro.com/vinfo/us/security/news/cybercrime-and-digital-threats/malicious-spam-campaign-uses-iso-image-files-to-deliver-lokibot-and-nanocore
- https://blog.emsisoft.com/en/32373/beware-new-wave-of-malware-spreads-via-iso-file-email-attachments/
- https://insights.sei.cmu.edu/blog/the-dangers-of-vhd-and-vhdx-files/
author: Florian Roth (Nextron Systems)
date: 2022-02-11
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - '.iso.lnk'
    - '.img.lnk'
    - '.vhd.lnk'
    - '.vhdx.lnk'
    TargetFilename|contains: '\Microsoft\Windows\Recent\'
  condition: selection
falsepositives:
- Cases in which a user mounts an image file for legitimate reasons
level: medium
note: |
  ### Technical Context
  This rule detects the malicious creation of recent files that link to disk image files such as `.ISO`, `.IMG`, `.VHD`, or `.VHDX`. Attackers often leverage these file types in phishing campaigns, embedding malware within them to exploit unsuspecting users who may inadvertently mount these images. The primary objective in this context is to facilitate an attack vector that can lead to unauthorized access, data theft, or system compromise.

  The relevant MITRE ATT&CK tactics associated with this detection include **Initial Access** (TA0001) through techniques like **Phishing (T1566.001)**. The use of malicious image files signifies a targeted effort to exploit users' trust or awareness, guiding them into executing harmful artifacts.

  The primary data sources for effective detection of this activity include Windows file event logs, specifically focusing on recent file access logs, which provide evidence of suspicious file creations and accesses that may indicate an ongoing phishing attempt or exploitation.

  ### Investigation Steps
  - **Review Recent Files:** Examine the contents of the Windows Recent Items folder to identify any newly created shortcuts pointing to disk image files. Look for any anomalies, especially in environments where these file types should not be commonly accessed.

  - **Analyze User Activity:** Investigate the user activity logs associated with the accounts that created the files. Confirm whether the users have a legitimate need to access or mount such image files or if this behavior aligns with their usual work patterns.

  - **Correlate with Email Logs:** Cross-reference any detected file creations with email logs to identify any corresponding phishing emails or malicious attachments that may have initiated this activity.

  - **Check Process Creation Logs:** Look into process creation logs to identify any processes that were triggered upon mounting the image files, paying close attention to suspicious executables or command-line arguments that may indicate exploitation.

  ### Prioritization
  This alert should be considered medium severity, as the presence of these file types can indicate an active phishing attack with the potential to lead to serious threats in the environment. While legitimate users may occasionally mount such files, frequency and context are crucial in discerning malicious intent.

  ### Blind Spots and Assumptions
  There may be gaps in detection when users have legitimate reasons to mount `.ISO`, `.IMG`, `.VHD`, or `.VHDX` files—potentially leading to false positives. The detection logic assumes that such activities are rare among workstation users, but this may not hold true in all environments. Furthermore, the effectiveness of this rule relies on the availability of Windows file event logs and proper configuration to log recent file accesses accurately.

