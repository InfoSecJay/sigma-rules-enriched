title: ISO or Image Mount Indicator in Recent Files
id: 4358e5a5-7542-4dcb-b9f3-87667371839b
status: test
description: |
  Detects the creation of recent element file that points to an .ISO, .IMG, .VHD or .VHDX file as often used in phishing attacks.
  This can be a false positive on server systems but on workstations users should rarely mount .iso or .img files.
references:
- https://www.microsoft.com/security/blog/2021/05/27/new-sophisticated-email-based-attack-from-nobelium/
- https://www.trendmicro.com/vinfo/us/security/news/cybercrime-and-digital-threats/malicious-spam-campaign-uses-iso-image-files-to-deliver-lokibot-and-nanocore
- https://blog.emsisoft.com/en/32373/beware-new-wave-of-malware-spreads-via-iso-file-email-attachments/
- https://insights.sei.cmu.edu/blog/the-dangers-of-vhd-and-vhdx-files/
author: Florian Roth (Nextron Systems)
date: 2022-02-11
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - '.iso.lnk'
    - '.img.lnk'
    - '.vhd.lnk'
    - '.vhdx.lnk'
    TargetFilename|contains: '\Microsoft\Windows\Recent\'
  condition: selection
falsepositives:
- Cases in which a user mounts an image file for legitimate reasons
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of shortcuts (.lnk files) within the Recent Files directory that point to image files (.ISO, .IMG, .VHD, .VHDX). This behavior is often associated with phishing attacks, where attackers deliver malicious payloads via these types of image files. The likely objective of the attacker is to execute malware by enticing the user to mount these images. The relevant MITRE ATT&CK technique is Phishing (ID: T1566.001), specifically targeting initial access.

  Primary telemetry sources include the Windows Event logs for file events, particularly focusing on the Event ID 4663, which reports file access and file creation events. The security impact is significant if the file contains malicious software designed to compromise the endpoint or network. However, detection of this activity does NOT confirm malicious intent, as users may create or access these files for legitimate reasons.

  ### Investigation Steps

  - **Verify the context of the file creation:** Search Event ID 4663 in Windows Security logs for the specific user account that created the shortcut. Check the time it occurred for correlation with user activity and identify any unusual patterns or unauthorized accounts.

  - **Examine the TargetFilename details:** Review the full path of the created .lnk files under `C:\Users\<username>\Microsoft\Windows\Recent\`. Assess the legitimacy of the targeted image files based on their names, hashes, and source locations.

  - **Check for system role relevance:** Confirm if the affected system is a workstation or server, as legitimate users should rarely mount image files on workstations. Logically assess user roles and responsibilities that might necessitate the use of image files.

  - **Identify known malicious indicators:** Compare the hashes of the ISO, IMG, VHD, or VHDX files against a threat intelligence database. If found in malware repositories or associated with known campaigns, flag the incident as malicious.

  - **Document and analyze user behavior:** Gather user activity logs to determine if there were prior interactions with suspicious emails or websites leading to the download of the target files.

  ### Prioritization

  The alert severity is medium due to the potential for significant impact on endpoints if a user inadvertently executes a malicious image file. The likelihood of malicious abuse is moderate, particularly in environments with lower awareness about phishing tactics. This behavior, although seen in specific phishing campaigns, is not universally weaponized across all attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives, particularly in server environments where mounting image files can be a legitimate operation. Reliable detection requires proper logging configurations that capture file creation events comprehensively. Legitimate users may trigger the alert when engaging in normal activities like accessing software installation media. As a companion detection, reviewing web activity logs for Phishing emails or suspicious websites can strengthen the overall detection capability against similar threats.

