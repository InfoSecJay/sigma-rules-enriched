note: |
  ### Technical Context

  This Sigma rule detects the creation of the LiveKD driver, specifically `LiveKdD.SYS`, which is utilized for live kernel debugging in a Windows environment. Attackers may leverage this functionality to conduct live analysis or tampering with the kernel, potentially aiming to evade detection by manipulating the operating system at a low level. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1203) and Privilege Escalation (T1068).

  The primary telemetry source for this alert is Windows file event logs, specifically monitoring for file creation events related to the LiveKD driver. A malicious context for this detection indicates an attempt to alter system integrity and evade security controls. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate debugging scenarios may trigger the rule.

  ### Investigation Steps

  - **Validate the source of the driver creation:** Check for Event ID 4663 in Security logs, which indicates file creation events. Look for `C:\Windows\System32\drivers\LiveKdD.SYS` and note the user account associated with the action; non-admin accounts creating this file are suspicious.

  - **Examine associated process activity:** Review Sysmon Event ID 1 to identify process creation for `livekd.exe` or `livek64.exe`. Analyze parent-child relationships to see if these processes originated from a legitimate source (such as Windows debugging tools) versus unauthorized or suspicious applications.

  - **Review system activity timeline:** Use the Windows Event Viewer to correlate the timestamps of the driver creation with any other suspicious activities logged around the same time, such as Event ID 4624 (successful logon) or 4688 (process creation events), especially if related to privileged accounts.

  - **Identify legitimate debugging instances:** Investigate known hosts or personnel utilizing LiveKD for debugging within your organization. Confirm if their activity aligns with documented maintenance schedules, reducing the likelihood of a false positive.

  - **Correlate with threat intelligence:** Check for any known malicious indicators of compromise (IOCs) associated with the use of LiveKD. High-confidence malicious activity could include the presence of tools commonly exploited to create the driver via unauthorized or reverse-engineered methods.

  ### Prioritization

  The alert severity is medium, as the creation of kernel-level drivers can have significant implications for system integrity. While this behavior may be leveraged by adversaries, it is also utilized in legitimate debugging scenarios, which highlights the need for contextual investigation before escalation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques such as signature-based detection bypass; attackers may modify the driver name or path. Reliable detection requires comprehensive logging configurations including file event logs and Sysmon for process tracking. Legitimate activities that may trigger this alert involve authorized kernel debugging sessions conducted by IT administrators. Companion detections, such as monitoring for unusual network behavior post driver creation, would enhance overall detection capability.

