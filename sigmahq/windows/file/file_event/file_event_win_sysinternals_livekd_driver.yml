  ### Technical Context

  This rule detects the creation of the LiveKD driver, specifically the `LiveKdD.SYS` file, which is utilized for live kernel debugging on Windows systems. Attackers may employ this driver to gain escalated privileges or to stealthily manipulate kernel-level processes, primarily aiming to maintain persistence or evade defenses. The relevant MITRE ATT&CK tactics are **Privilege Escalation (Tactics ID: TA0004)** and **Stealth (Tactics ID: TA0042)**.

  The primary telemetry sources for this detection include Windows file event logs that capture file creation activity, specifically monitoring for events related to the target filename. If the creation of this driver is malicious, it could lead to significant security impacts, including unauthorized access to sensitive data or system controls. Importantly, this detection does NOT confirm malicious intent on its own, as the driver may also be deployed in legitimate debugging scenarios.

  ### Investigation Steps

  - **Validate file creation event:** Check Windows Security Event ID 4663 for `C:\Windows\System32\drivers\LiveKdD.SYS`. It's important to also confirm the user account associated with this event. Legitimate debugging often involves administrator accounts.

  - **Analyze process execution details:** Review Sysmon Event ID 1 for `livekd.exe` or `livek64.exe`. Determine if these executables were run with elevated privileges and check for parent processes indicating expected usage (e.g., debugging tools).

  - **Correlate with system changes:** Investigate additional Windows Event Logs (Event IDs 7045 for service creation), to see if related services are being installed alongside the driver creation, which may suggest persistence mechanisms.

  - **Check for non-standard attributes:** Look for unusual file attributes or timestamps on `LiveKdD.SYS` using PowerShell or command-line queries that might indicate unexpected modifications outside of legitimate usage scenarios.

  - **Investigate host role:** If the affected system is a critical asset (e.g., domain controller, server hosting sensitive applications), escalate evaluation, as it may indicate a higher risk of privilege escalation or system compromise.

  ### Prioritization

  The severity of this alert is medium due to the impact associated with potential privilege escalation and system manipulation on critical hosts. Though the behavior could represent legitimate debugging activities, the likelihood of malicious usage is elevated in environments where kernel debugging should not occur, making it a relevant concern for swift investigation.

  ### Blind Spots and Assumptions

  Detection may be limited since legitimate debugging activities could generate similar alerts, leading to false positives. Reliable coverage necessitates proper logging configuration of Windows file and security event logs. Adversaries may use alternative methods for privilege escalation that do not utilize this driver at all, and existing detection solutions for abnormal service installations could strengthen overall monitoring effectiveness.

