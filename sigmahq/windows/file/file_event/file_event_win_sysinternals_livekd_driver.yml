  ### Technical Context
  This detection rule focuses on identifying the creation of the LiveKD driver, specifically the `LiveKdD.SYS` file, which is utilized for live kernel debugging in Windows environments. Attackers may exploit this legitimate tool to perform kernel-level debugging stealthily, thereby gaining an advantageous position while attempting to manipulate system processes or evade detection mechanisms. The primary objectives of such actions could include privilege escalation, enabling further access into the target environment, or maintaining persistence via kernel-level manipulation.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (T1203): Use of the LiveKD driver may indicate an attacker trying to evade traditional detection mechanisms by operating at a kernel level.
  - **Privilege Escalation** (T1068): Exploiting kernel debugging capabilities can enable attackers to elevate privileges and gain control over critical system functions.

  The primary data sources for detecting this behavior include process creation events to capture the running of `livekd.exe` or `livek64.exe`, along with file event logs to monitor the creation of the driver file `LiveKdD.SYS` in the specified directory.

  ### Investigation Steps
  - **Review File Creation Logs**: Investigate file event logs specifically for the creation of `C:\Windows\System32\drivers\LiveKdD.SYS`. Look for the exact timestamp and any associated processes.
  - **Analyze Process Creation Events**: Examine process creation logs for instances of `livekd.exe` or `livek64.exe`. Validate the context of execution to determine if it is legitimate or suspicious.
  - **Check for Unusual Kernel Activity**: Correlate the event with other indicators of kernel manipulation or unauthorized access, using endpoint detection tools to identify any abnormal behavior linked to the kernel.
  - **Assess User Account Activity**: Analyze the accounts that executed the driver creation. Look for unusual account activity or elevated privileges that stand out from normal operational patterns.

  ### Prioritization
  Given the potential for an attacker to leverage the LiveKD driver to manipulate kernel processes or gain higher privileges, the severity of this alert is medium. The alert should prompt immediate investigation due to the risk posed by such activity in an enterprise environment.

  ### Blind Spots and Assumptions
  There may be detection gaps concerning legitimate uses of LiveKD for debugging by administrators or developers, which can generate false positives in the alert. The detection logic assumes that all instances of `livekd.exe` and related driver creation are malicious without contextual evaluation. For this alert to function optimally, it is required to have comprehensive file event logging and process monitoring enabled, ensuring proper coverage across the Windows environment.

