note: |
  ### Technical Context
  This detection rule identifies the creation of temporary files by the ScreenConnect remote access tool (RAT) on Windows systems. ScreenConnect, part of the ConnectWise Control platform, facilitates remote access and support by allowing administrators to execute binaries on target machines. When executed, these binaries are typically stored temporarily in the "C:\Users\<username>\Documents\ConnectWiseControl\Temp\" directory before running. Attackers might exploit ScreenConnect for unauthorized access to systems, executing malicious payloads to maintain persistence or conduct further activities such as data exfiltration.

  The potential threat scenario involves an attacker using ScreenConnect to gain remote control of compromised systems, enabling them to manipulate processes or access sensitive data stealthily. This behavior aligns with the MITRE ATT&CK framework, particularly under the tactics of **Execution** and **Use of Remote Access Tools**. The relevant techniques include **T1059.003 - Command and Scripting Interpreter: Windows Command Shell**, as attackers might execute commands through remote access to achieve their objectives.

  Primary data sources for this detection include Windows file event logs, which can capture file creation activities, specifically targeting files and directories associated with ScreenConnect. Monitoring these logs is crucial to uncovering unauthorized usage of this tool.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine Windows file event logs for the creation of files in the "C:\Users\<username>\Documents\ConnectWiseControl\Temp\" directory. Look for suspicious timestamps and filenames associated with ScreenConnect.
  - **Analyze Process Execution Events:** Investigate process creation events related to `ScreenConnect.WindowsClient.exe` to identify any unauthorized execution patterns or unexpected command-line arguments used during the session.
  - **Monitor Network Connections:** Check for outbound connections initiated by ScreenConnect or related executables. Cross-reference these connections with known command-and-control server IPs to identify potential malicious activities.
  - **Evaluate User Behavior:** Assess user accounts that have executed ScreenConnect. Look for anomalies in user activity, such as access to sensitive files or systems they typically do not engage with.

  ### Prioritization
  This alert is marked low severity due to the legitimate use of ScreenConnect for remote support. However, the potential for misuse necessitates attention, especially if unusual patterns are detected in areas where this tool is not customarily employed.

  ### Blind Spots and Assumptions
  Detection coverage may be limited when ScreenConnect is not installed or utilized within the environment, leading to gaps in monitoring for unauthorized use of remote access tools. The detection logic assumes that any file creation by `ScreenConnect.WindowsClient.exe` in the specified directory is potentially malicious, which may generate false positives in organizations that use ScreenConnect legitimately. Effective monitoring requires ensuring that file event logging is enabled for Windows systems to capture the necessary artifacts for this detection to function properly.

