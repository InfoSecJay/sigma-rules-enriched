note: |
  ### Technical Context

  This Sigma rule detects the creation of temporary files associated with the ScreenConnect remote management tool, which is commonly used for remote desktop support. The most likely attacker objective is to execute unauthorized binaries on the target system, potentially taking control or exfiltrating data. This behavior aligns with MITRE ATT&CK's Execution tactic, specifically technique T1059.003 (Command and Scripting Interpreter: Windows Command Shell).

  The primary telemetry source is Windows file event logs, with particular focus on Event ID 4663 to capture file access, along with relevant fields indicating the process image and filename. If this detection indicates malicious activity, it could allow unauthorized access to sensitive data or systems. However, this detection does NOT confirm nefarious intent on its own, as ScreenConnect can be used legitimately by IT support teams.

  ### Investigation Steps

  - **Check for Event ID 4663:** Review logs for Windows Security Event ID 4663 indicating a file creation event targeting `:\Users\<username>\Documents\ConnectWiseControl\Temp\`. Ensure the `Image` field ends with `ScreenConnect.WindowsClient.exe`.

  - **Validate against known benign activity:** Confirm if the file creation aligns with legitimate ScreenConnect usage by checking for a corresponding help desk ticket or user request for remote support.

  - **Identify high-confidence malicious indicators:** Look for unusual file names or extensions during the temporary file creation, especially if the timestamp aligns with unexpected user activity or system changes.

  - **Monitor process execution:** Examine Sysmon Event ID 1 logs for process creation associated with `ScreenConnect.WindowsClient.exe` immediately following the file creation event to ensure expected execution behavior.

  - **Assess asset criticality:** Determine the role of the affected asset; if it is a critical server or sensitive workstation, elevate the investigation priority and initiate further forensics on the endpoint.

  - **Collect evidence of unauthorized access:** If evidence suggests malicious activity, check for potential file exfiltration by reviewing network traffic logs for unusual outbound connections originating from the affected machine during the identified timestamps.

  ### Prioritization

  This alert holds low severity in a mature enterprise context due to the dual-use nature of ScreenConnect. However, if indicated malicious use is confirmed, particularly on sensitive systems, the urgency would significantly increase, as tools like ScreenConnect are often weaponized by adversaries to maintain persistent access.

  ### Blind Spots and Assumptions

  Detection may miss scenarios where ScreenConnect has been disabled or improperly configured, leading to a lack of relevant file event logs. Legitimate administrative actions, such as remote support sessions, may trigger the alert. Additionally, a companion detection for lateral movement (e.g., T1071.001 - Application Layer Protocol: Web Protocols) should strengthen coverage against malicious use of remote access tools.

