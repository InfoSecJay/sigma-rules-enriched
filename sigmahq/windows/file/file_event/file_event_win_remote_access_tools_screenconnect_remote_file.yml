  ---

  ### Technical Context

  This rule detects the creation of files by the ScreenConnect remote access tool (RAT) within its temporary directory, specifically in `C:\Users\<username>\Documents\ConnectWiseControl\Temp\`. The behavior associated with this activity may suggest an adversary is remotely executing binaries, which is a typical method for deploying malware or establishing persistence on compromised systems.

  The likely attacker objective is to gain control over the target machine for exfiltration, reconnaissance, or lateral movement. This detection relates to the MITRE ATT&CK technique T1059.003 (Command and Scripting Interpreter: Windows Command Shell). The primary telemetry source is Windows file event logs capturing file creation activities.

  If malicious, the security impact could include unauthorized remote access and control of the targeted system. However, this detection alone does not confirm that the file activity is inherently malicious, as the legitimate use of ScreenConnect may trigger these alerts.

  ---

  ### Investigation Steps

  - **Review file creation events:** Examine Windows Event ID 4663 for file creation in `C:\Users\<username>\Documents\ConnectWiseControl\Temp\`; check the `Object Type`, `Object Name`, and `Access Mask` fields for unauthorized activity.

  - **Correlate with process execution:** Cross-reference with Sysmon Event ID 1, looking for `ScreenConnect.WindowsClient.exe` execution and ensure it originates from a known and trusted source.

  - **Identify expected legitimate use:** Confirm whether ScreenConnect is actively being used for remote support in your environment; check sign-in and session logs to validate expected activity patterns.

  - **Evaluate unusual patterns:** Investigate for multiple file creations or unusual file types in the temp directory, indicating possible malicious behavior. Filename patterns such as `*.exe` or scripts (e.g., `*.bat`, `*.ps1`) may indicate a higher risk.

  - **Check for persistence mechanisms:** Look for any registry modifications or scheduled tasks related to ScreenConnect, which may indicate that an attacker is attempting to maintain access.

  ---

  ### Prioritization

  The severity of this alert is low as legitimate usage of ScreenConnect may commonly produce these alerts. However, if the affected system has access to sensitive data or is critical for operations, it should be monitored closely. The likelihood of malicious use exists, as RATs are widely employed in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may not capture all instances of abuse due to potential evasion techniques, such as renaming malicious executables. Proper logging configurations are essential for reliable detection, specifically enabling file system auditing on Windows. Additionally, events can arise from legitimate system use, such as software updates or authorized remote support sessions. Companion detections, such as monitoring for unusual outbound connections (e.g., TAC, T1090), can enhance overall coverage against RAT-related threats.

