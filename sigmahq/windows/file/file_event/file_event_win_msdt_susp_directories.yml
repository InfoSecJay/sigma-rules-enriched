title: File Creation In Suspicious Directory By Msdt.EXE
id: 318557a5-150c-4c8d-b70e-a9910e199857
status: test
description: Detects msdt.exe creating files in suspicious directories which 
  could be a sign of exploitation of either Follina or Dogwalk vulnerabilities
references:
- https://irsl.medium.com/the-trouble-with-microsofts-troubleshooters-6e32fc80b8bd
- https://msrc-blog.microsoft.com/2022/05/30/guidance-for-cve-2022-30190-microsoft-support-diagnostic-tool-vulnerability/
author: Vadim Varganov, Florian Roth (Nextron Systems)
date: 2022-08-24
modified: 2023-02-23
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
- cve.2022-30190
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith: '\msdt.exe'
    TargetFilename|contains:
    - '\Desktop\'
    - '\Start Menu\Programs\Startup\'
    - 'C:\PerfLogs\'
    - 'C:\ProgramData\'
    - 'C:\Users\Public\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects activity where `msdt.exe`, a Microsoft Support Diagnostic Tool, is creating files in directories that are often misused by attackers for persistence or exploitation, such as the Startup directory. The likely adversary objective includes leveraging this tool combined with known vulnerabilities (specifically Follina or Dogwalk) to execute code or maintain access. This behavior directly correlates with the MITRE ATT&CK technique ATT&CK T1547.001: "Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder".

  Primary telemetry sources include Windows file event logs related to file creation and modification, specifically looking for Events indicating the creation of suspicious files. The potential security impact includes unauthorized persistence mechanisms or malware delivery. It is important to note that the detection does NOT confirm a successful compromise but indicates potentially suspicious file creation that warrants further investigation.

  ### Investigation Steps

  - **Check the Process Source:** Review Security Event ID 4688 to correlate the creation of files with `msdt.exe` processes. Validate the execution context—ensure the process is initiated from a legitimate source rather than a temp or user directory.

  - **Examine the Target Directory:** Look for created files in directories like `C:\Users\<username>\Start Menu\Programs\Startup\` or `C:\ProgramData\`. Legitimate activity may include user-driven installations that do not create new executables or scripts in these directories.

  - **Analyze Created Files:** Investigate newly created files, noting attributes such as timestamps and file hashes. Malicious indicators include files with anomalous names or unusual extensions (e.g., `.exe`, `.vbs`). Use tools like VirusTotal for hash analysis.

  - **Cross-Reference Execution Context:** Utilize Sysmon Event ID 1 to correlate the creation time of the suspicious file with any other identified anomalous activities, such as unusual network connections or unexpected process hierarchies.

  - **Identify High-Risk Assets:** Determine the role of the affected host based on its importance in your environment. Servers that run critical applications should be prioritized for immediate investigation.

  - **Review Previous Alerts:** Check for any related alerts regarding `msdt.exe` exploitation attempts or known vulnerabilities in your environment's threat intelligence feeds, enhancing context for potential malicious activity.

  ### Prioritization

  This alert is of high severity due to the potential for exploitation of critical vulnerabilities using the `msdt.exe` tool. Given the common exploitation pathways associated with this behavior, prompt analysis is crucial, especially on systems with sensitive data or critical processes.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming `msdt.exe` or using legitimate tools with unassociated filenames to obfuscate attacks. Reliable detection requires proper logging configurations, particularly for file events and process creations. Legitimate user activity, such as troubleshooting sessions or software installations, may cause similar file creations. A recommended companion detection includes monitoring for anomalous network connections initiated by `msdt.exe`, which may indicate active exploitation or command and control communications.

