title: File Creation In Suspicious Directory By Msdt.EXE
id: 318557a5-150c-4c8d-b70e-a9910e199857
status: test
description: Detects msdt.exe creating files in suspicious directories which could
  be a sign of exploitation of either Follina or Dogwalk vulnerabilities
references:
- https://irsl.medium.com/the-trouble-with-microsofts-troubleshooters-6e32fc80b8bd
- https://msrc-blog.microsoft.com/2022/05/30/guidance-for-cve-2022-30190-microsoft-support-diagnostic-tool-vulnerability/
author: Vadim Varganov, Florian Roth (Nextron Systems)
date: 2022-08-24
modified: 2023-02-23
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
- cve.2022-30190
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith: '\msdt.exe'
    TargetFilename|contains:
    - '\Desktop\'
    - '\Start Menu\Programs\Startup\'
    - 'C:\PerfLogs\'
    - 'C:\ProgramData\'
    - 'C:\Users\Public\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where the `msdt.exe` application creates files in directories that are often used for persistence and exploitation, particularly in relation to notable vulnerabilities known as Follina (CVE-2022-30190) and Dogwalk. The creation of such files in suspicious locations may indicate malicious activity, typically associated with attackers attempting to establish a foothold within a compromised system or escalate their privileges. The goal of these attackers is to exploit the debugger in Windows and leverage the critical vulnerabilities to execute arbitrary code.

  Relevant MITRE ATT&CK techniques include:
  - **T1547.001**: Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder
  - **T1068**: Exploitation for Client Execution
  - **T1086**: PowerShell

  The primary data sources for this detection are Windows file creation logs, which can be obtained from various logging mechanisms such as the Windows Event Log for file and process activities, as well as system monitoring solutions that track file system changes.

  ### Investigation Steps
  - **Collect File Creation Logs**: Retrieve Windows file event logs, focusing on creation events in the suspicious directories (e.g., Desktop, Startup, ProgramData) to identify any related artifacts generated by `msdt.exe`.
  - **Analyze Process Creation Events**: Look for a process tree initiated by `msdt.exe` to establish its lineage and identify any parent processes that may have executed it.
  - **Inspect User Activity**: Review the user accounts associated with the file creation, verifying if these accounts are operating under normal conditions and have elevated privileges without proper justification.
  - **Correlate with Known Vulnerabilities**: Check for any known attacks or exploitation attempts involving Follina or Dogwalk in the environment, referring to threat intelligence sources and internal incident reports.

  ### Prioritization
  Given the potential impact of the identified vulnerabilities, which may allow for arbitrary code execution and privilege escalation, this alert should be treated with high severity. The widespread use of `msdt.exe` in conjunction with suspicious file creation presents a significant risk to enterprise security.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on the presence of logs from `msdt.exe` create operations; if logging is not properly configured or if file creation obscures the activity, detection may be missed. Additionally, the detection logic assumes malicious intent based on file location alone, which might not account for legitimate administrative use cases. A robust logging configuration, including audit policies for file access and process creation, is necessary for effective monitoring and alerting.

