logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: ':\Users\Public\'
    TargetFilename|endswith:
    - '.bat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.js'
    - '.ps1'
    - '.vbe'
    - '.vbs'
  condition: selection
falsepositives:
- Administrators deploying legitimate binaries to public folders.
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_public_folder_extension/info.yml
note: |
  ### Technical Context
  This detection rule identifies the creation of suspicious files within the `C:\Users\Public\` directory, which commonly serves as a shared space for users on a Windows system. By monitoring for file extensions such as `.bat`, `.dll`, `.exe`, `.hta`, `.js`, `.ps1`, `.vbe`, and `.vbs`, the rule aims to flag potentially malicious activity. These file types are often associated with various forms of malware, including ransomware (such as LockBit), which can utilize legitimate-looking scripts and binaries to execute commands or deliver payloads.

  Attackers may target the public folder to evade detection, as it is a commonly accessible location. Activities such as placing malicious scripts here can facilitate lateral movement within a network or initiate a payload execution. Notably, this detection correlates with several MITRE ATT&CK techniques, particularly **Execution (T1204)**, which encompasses methods by which users unknowingly execute malicious code.

  Primary data sources for this detection include Windows file event logs that capture file creations and modifications. These logs can provide critical insights into file activities occurring within sensitive directories.

  ### Investigation Steps
  - **Review File Event Logs:** Examine file creation events in Windows logs, focusing on the public folder. Look for newly created files with suspicious extensions.
  - **Correlate with Command-Line Arguments:** Analyze command-line arguments associated with the creation of these files to identify if they were initiated by a legitimate application or process.
  - **Assess User Activity:** Determine the users who created the files and investigate their recent activities for any indication of compromise or unauthorized behavior.
  - **Check for Additional Artifacts:** Look for other indicators of compromise (IOCs) or unusual behavior on the host, including network connections made by the newly created scripts or binaries.

  ### Prioritization
  The alert's severity is high due to the potential for significant malicious activity, including the delivery of malware or exploitation of system vulnerabilities. The likelihood of encountering such threats is increased in enterprise environments, especially if users are not trained to recognize suspicious file types.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of malicious activity, particularly if legitimate binaries are frequently deployed or if attackers use more obscure file extensions not included in the rule. It assumes that all creating processes are monitored and that the public folder is not a common location for benign activity in the organization. Proper Windows file event logging configuration is critical for this rule to function effectively, and any misconfigurations could lead to missed detections.

