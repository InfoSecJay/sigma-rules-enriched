  type: derived
status: test
description: |
  Detects the creation of files with an "LNK" as a second extension. This is sometimes used by malware as a method to abuse the fact that Windows hides the "LNK" extension by default.
references:
- https://www.crowdstrike.com/blog/meet-crowdstrikes-adversary-of-the-month-for-june-mustang-panda/
- https://www.anomali.com/blog/china-based-apt-mustang-panda-targets-minority-groups-public-and-private-sector-organizations
- https://www.cybereason.com/blog/research/a-bazar-of-tricks-following-team9s-development-cycles
- https://twitter.com/malwrhunterteam/status/1235135745611960321
- https://twitter.com/luc4m/status/1073181154126254080
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2022-11-07
modified: 2023-10-18
tags:
- attack.defense-evasion
- attack.t1036.007
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.lnk'
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.jpg.'
    - '.pdf.'
    - '.ppt.'
    - '.pptx.'
    - '.xls.'
    - '.xlsx.'
  filter_main_recent:
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Windows\Recent\'
  filter_optional_office_recent:
    Image|endswith:
            # Note: Some additional office application might need to be added
    - '\excel.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Office\Recent\'
  filter_optional_office_excel:
    Image|endswith: '\excel.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Excel'
  filter_optional_office_powerpoint:
    Image|endswith: '\powerpnt.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\PowerPoint'
  filter_optional_office_word:
    Image|endswith: '\winword.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Word'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some tuning is required for other general purpose directories of third party 
  apps
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_lnk_double_extension/info.yml
note: |
  ### Technical Context

  This rule detects the creation of files with a "LNK" extension as a secondary extension, a behavior often utilized by adversaries to exploit Windows' default settings that hide file extensions. Attackers may use this technique to disguise malicious files, misrepresenting them as harmless documents or images to evade detection. Relevant MITRE ATT&CK tactics include **Defense Evasion (T1569)** and the specific technique **Obfuscated Files or Information (T1027)**. The primary telemetry sources are file event logs from Windows systems, specifically focusing on the creation of files within user directories like `AppData\Roaming\Microsoft\Windows\Recent` and `AppData\Roaming\Microsoft\Office\Recent`. If successfully executed, this behavior can facilitate malware execution and further compromise of the environment. However, this detection alone does not confirm that the file is malicious, as legitimate applications may also create files with similar naming conventions.

  ### Investigation Steps

  - **Check file creation event:** Review Windows Event ID **4663** for the file creation event. Look for entries indicating .lnk files with an unusual second extension in `C:\Users\<username>\AppData\Roaming\Microsoft\Windows\Recent\`.

  - **Identify recent file creation patterns:** Evaluate the behavior of the user in context. Compare the timestamp of the LNK file creation against the usage logs of applications like `winword.exe`, `excel.exe`, or `powerpnt.exe` within a safe timeframe.

  - **Validate file properties:** Use command-line tools or PowerShell to check file properties. Look for unusual file size and creation dates that differ from typical patterns for legitimate office files.

  - **Analyze shadow copies or backups:** Investigate any Windows Shadow Copies or backup artifacts for persistence mechanisms. Check for related malicious indicators, such as references to known malicious hashes or behavior flagged by threat intelligence sources.

  - **Assess user behavior context:** Determine if the user has any legitimate reason to access files in the recent directories. Abnormal access patterns or operations around file creation may indicate malicious intent.

  ### Prioritization

  This alert should be treated with moderate priority due to potential severe impacts if malware is present on critical systems. The likelihood of malicious behavior is increased given the specificity of file context, paired with known adversary techniques leveraging LNK files to bypass security controls. The use of file creation in this context is a recognized tactic among threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that also create LNK files with double extensions, necessitating careful analysis of the user context. Ensure logging for user directory access is enabled to capture adequate telemetry for reliable detection. Regular software updates or security controls not covering recent directory activities might lead to missed alerts. Companion detections for suspicious PowerShell activity or execution of known malicious scripts can enhance coverage against this threat vector.

