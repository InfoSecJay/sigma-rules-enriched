title: Suspicious LNK Double Extension File Created
id: 3215aa19-f060-4332-86d5-5602511f3ca8
related:
- id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
  type: derived
status: test
description: |
  Detects the creation of files with an "LNK" as a second extension. This is sometimes used by malware as a method to abuse the fact that Windows hides the "LNK" extension by default.
references:
- https://www.crowdstrike.com/blog/meet-crowdstrikes-adversary-of-the-month-for-june-mustang-panda/
- https://www.anomali.com/blog/china-based-apt-mustang-panda-targets-minority-groups-public-and-private-sector-organizations
- https://www.cybereason.com/blog/research/a-bazar-of-tricks-following-team9s-development-cycles
- https://twitter.com/malwrhunterteam/status/1235135745611960321
- https://twitter.com/luc4m/status/1073181154126254080
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2022-11-07
modified: 2023-10-18
tags:
- attack.stealth
- attack.t1036.007
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.lnk'
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.jpg.'
    - '.pdf.'
    - '.ppt.'
    - '.pptx.'
    - '.xls.'
    - '.xlsx.'
  filter_main_recent:
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Windows\Recent\'
  filter_optional_office_recent:
    Image|endswith:
            # Note: Some additional office application might need to be added
    - '\excel.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Office\Recent\'
  filter_optional_office_excel:
    Image|endswith: '\excel.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Excel'
  filter_optional_office_powerpoint:
    Image|endswith: '\powerpnt.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\PowerPoint'
  filter_optional_office_word:
    Image|endswith: '\winword.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Word'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some tuning is required for other general purpose directories of third party 
  apps
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_lnk_double_extension/info.yml
note: |
  ### Technical Context

  This rule detects the creation of files that have a second extension of ".lnk", commonly seen when attackers exploit Windows' default behavior of hiding LNK file extensions, potentially disguising malicious payloads. The likely objective of an attacker using this technique is to deliver malware or a malicious shortcut that executes unwarranted actions when the file is interacted with by unsuspecting users. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005) and the technique is "Rename System Utilities" (T1036.007).

  Primary telemetry sources include Windows File System Event logs, particularly focusing on file creation events (Event ID 4663). If malicious, these actions can lead to unauthorized access or execution of malicious code. However, this detection does NOT confirm that the file is malicious on its own; it only indicates that a suspicious double extension file was created.

  ### Investigation Steps

  - **Check File Details and Path:**
    Look for the created file in the directory `%appdata%\Microsoft\Windows\Recent\` and verify creation time (Event ID 4663). Benign files will typically not have a double extension or be placed in this location without user context.

  - **Examine Associated Process Execution:**
    Review the parent process ID linked to the creation (Event ID 4688 for new process creation) to identify whether it was executed by a known legitimate application such as `explorer.exe`, or if it comes from unusual or non-standard programs indicative of malware.

  - **Investigate for Known Extensions:**
    Review the target filename field for common documents like ".docx", ".pptx", or ".xlsx". Legitimate employee behavior may involve frequent usage of these formats without double extensions.

  - **Analyze File Properties and Hash:**
    Retrieve file properties and generate a hash (e.g., SHA256) of the suspicious file for comparison against known malware databases. High-confidence malicious indicators would include hashes that map directly to confirmed malware.

  - **Cross-Reference with User Activity:**
    Check for user activity leading to file creation in the context of legitimate business operations. An absence of recent document access or editing activity could indicate suspicious behavior.

  - **Monitor for Similar Patterns:**
    Use the related detection ID (b4926b47-a9d7-434c-b3a0-adc3fa0bd13e) to check for similar alert events that may provide a broader understanding of potential repeated attacks or related suspicious behavior in the environment.

  ### Prioritization

  This alert should be treated with medium severity within the enterprise context. The creation of LNK files with double extensions represents a likely attempt to obfuscate malicious activity, especially if associated with critical systems or valuable assets. The likelihood of malicious use is significant given the historical utility of this tactic in malware campaigns.

  ### Blind Spots and Assumptions

  This detection is limited by the possibility of legitimate applications using similar naming conventions, especially in specialized environments or user-customized settings. The reliance on specific log sources, such as Windows File System events, is critical for comprehensive detection. Additionally, common legitimate activities, like file sharing or downloads, could potentially trigger this alert. A related detection to consider is monitoring for the execution of suspicious files immediately following their creation, as this can provide additional context on whether the file is being actively used for attack purposes.

