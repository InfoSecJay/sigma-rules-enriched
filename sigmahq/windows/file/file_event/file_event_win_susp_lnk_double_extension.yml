title: Suspicious LNK Double Extension File Created
id: 3215aa19-f060-4332-86d5-5602511f3ca8
related:
- id: b4926b47-a9d7-434c-b3a0-adc3fa0bd13e
  type: derived
status: test
description: |
  Detects the creation of files with an "LNK" as a second extension. This is sometimes used by malware as a method to abuse the fact that Windows hides the "LNK" extension by default.
references:
- https://www.crowdstrike.com/blog/meet-crowdstrikes-adversary-of-the-month-for-june-mustang-panda/
- https://www.anomali.com/blog/china-based-apt-mustang-panda-targets-minority-groups-public-and-private-sector-organizations
- https://www.cybereason.com/blog/research/a-bazar-of-tricks-following-team9s-development-cycles
- https://twitter.com/malwrhunterteam/status/1235135745611960321
- https://twitter.com/luc4m/status/1073181154126254080
author: Nasreddine Bencherchali (Nextron Systems), frack113
date: 2022-11-07
modified: 2023-10-18
tags:
- attack.defense-evasion
- attack.t1036.007
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '.lnk'
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.jpg.'
    - '.pdf.'
    - '.ppt.'
    - '.pptx.'
    - '.xls.'
    - '.xlsx.'
  filter_main_recent:
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Windows\Recent\'
  filter_optional_office_recent:
    Image|endswith:
            # Note: Some additional office application might need to be added
    - '\excel.exe'
    - '\powerpnt.exe'
    - '\winword.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Office\Recent\'
  filter_optional_office_excel:
    Image|endswith: '\excel.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Excel'
  filter_optional_office_powerpoint:
    Image|endswith: '\powerpnt.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\PowerPoint'
  filter_optional_office_word:
    Image|endswith: '\winword.exe'
    TargetFilename|contains: '\AppData\Roaming\Microsoft\Word'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Some tuning is required for other general purpose directories of third party apps
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_lnk_double_extension/info.yml
note: |
  ### Technical Context
  This detection rule identifies the creation of files with the ".lnk" extension as a secondary extension on Windows systems. Malware actors often use this technique to exploit the default behavior of Windows, where the ".lnk" extension is hidden from view. The presence of such files can indicate malicious intent, particularly in the context of spear-phishing campaigns or other types of attack vectors where deception is a core strategy. The threat scenario typically revolves around attackers attempting to distribute malware disguised as legitimate files, which can lead to unauthorized access, data exfiltration, and compromise of targeted systems.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Defense Evasion** (T1203)
  - **User Execution** (T1204)
  - **File and Directory Permissions Modification** (T File and Directory Permissions Modification) (T1036.007).

  The primary data sources required for effective detection include Windows file event logs, specifically monitoring for file creations within user profile directories such as the "Recent" folders. This information is crucial for identifying potentially malicious activities based on the user's interaction with files.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine Windows file event logs for recent creations of files with a ".lnk" extension, particularly in directories associated with user profile and application recent files.

  - **Analyze Suspicious File Paths:** Investigate the context of the detected ".lnk" files. Pay close attention to files created in "Recent" directories, particularly if they are located within "AppData\Roaming\Microsoft" or "Office".

  - **Correlate with User Activity:** Cross-reference the timestamps of the file creations with user activity logs to determine if the user interacted with files that might lead to execution. Check for any unusual access patterns.

  - **Assess Associated Applications:** Identify the applications that were running at the time of file creation, particularly focusing on legitimate Microsoft Office applications (e.g., Excel, PowerPoint, Word). Look for anomalous behavior or unauthorized installations.

  ### Prioritization
  This alert should be considered a medium priority in an enterprise environment as the presence of double extension LNK files can indicate attempts at evasion or exploitation, which may lead to further malicious activities. Given the stealthy nature of such techniques, timely investigation can mitigate potential security breaches.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by system configurations that do not log file creation events adequately or by the default hiding of extensions on Windows. The detection logic assumes that the files are being created without legitimate user intent, which may not always be the case. Additionally, tuning may be necessary to account for legitimate applications that may create similar ".lnk" files in non-malicious contexts within those directories. Proper logging configurations, particularly for user file activity, are essential for this alert to function effectively.

