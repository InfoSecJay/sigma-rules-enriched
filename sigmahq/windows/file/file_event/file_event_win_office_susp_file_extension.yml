title: File With Uncommon Extension Created By An Office Application
id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
status: test
description: Detects the creation of files with an executable or script extension
  by an Office application.
references:
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
- https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/Threat%20Intelligence/The%20DFIR%20Report/20210329_Sodinokibi_(aka_REvil)_Ransomware.yaml
author: Vadim Khrykov (ThreatIntel), Cyb3rEng (Rule), Nasreddine Bencherchali (Nextron
  Systems)
date: 2021-08-23
modified: 2025-10-17
tags:
- attack.t1204.002
- attack.execution
logsource:
  product: windows
  category: file_event
detection:
    # Note: Please add more file extensions to the logic of your choice.
  selection1:
    Image|endswith:
    - '\excel.exe'
    - '\msaccess.exe'
    - '\mspub.exe'
    - '\powerpnt.exe'
    - '\visio.exe'
    - '\winword.exe'
  selection2:
    TargetFilename|endswith:
    - '.bat'
    - '.cmd'
    - '.com'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.ocx'
    - '.proj'
    - '.ps1'
    - '.scf'
    - '.scr'
    - '.sys'
    - '.vbe'
    - '.vbs'
    - '.wsf'
    - '.wsh'
  filter_main_localassembly:
    TargetFilename|contains: '\AppData\Local\assembly\tmp\'
    TargetFilename|endswith: '.dll'
  filter_optional_webservicecache:   # matches e.g. directory with name *.microsoft.com
    TargetFilename|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Microsoft\Office\'
    - '\WebServiceCache\AllUsers'
    TargetFilename|endswith: '.com'
  filter_optional_webex:
    Image|endswith: '\winword.exe'
    TargetFilename|contains: '\AppData\Local\Temp\webexdelta\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_optional_backstageinappnavcache:   # matches e.g. C:\Users\xxxxx\AppData\Local\Microsoft\Office\16.0\BackstageInAppNavCache\ODB-user@domain.com
    TargetFilename|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Microsoft\Office\'
    - '\BackstageInAppNavCache\'
    TargetFilename|endswith: '.com'
  condition: all of selection* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This detection rule identifies the creation of files with executable or script extensions (e.g., .bat, .exe, .vbs) by Microsoft Office applications such as Word or Excel. This behavior may suggest an attacker’s intention to execute malicious code or deliver payloads through familiar software, often to evade detection. Relevant MITRE ATT&CK tactics include Execution (TA0002) and particularly the technique for User Execution (T1204.002), where users inadvertently launch malicious files.

  The primary telemetry source for this detection is Windows file event logs, focusing on the creation of files with specified dangerous extensions through authorized Office applications. If harmful, this behavior could lead to system compromise, data exfiltration, or lateral movement within the network. However, this detection alone does not confirm malicious intent; it merely indicates suspicious file creation activity that warrants further investigation.

  ---

  ### Investigation Steps

  - **Check file creation events: **Review Windows Security Event ID 4663 identifying the creation events of files with unusual extensions. Look for Event ID 4663 associated with the executables listed in the rule (e.g., excel.exe, winword.exe).

  - **Assess file attributes:** Verify the properties of created files (e.g., timestamps, file paths). Malicious files are often located in non-standard directories (e.g., User\AppData\Local\Temp instead of official Document directories).

  - **Identify previous activity:** Investigate Windows Event ID 4688 to track the command line used for file creation. Legitimate file creations by Office apps will usually lack suspicious parameters or include harmless actions such as file saves with standard document formats.

  - **Search for malicious indicators:** Look for known malware behavior in the created files such as signatures or hashes that match current threat intelligence. Focus on executable file hashes and script files that belong to known malware families.

  - **Evaluate system impact:** Confirm if the affected system is critical (e.g., a server or admin machine) versus a user workstation. A high-impact system should escalate the investigation.

  - **Correlate with other alerts:** Review integration with any companion detections or alerts related to suspicious processes or office applications being targeted. Look for connections to ongoing incidents or behavioral anomalies in the environment.

  ---

  ### Prioritization

  This alert is of high severity due to the potential for severe impacts from the execution of malicious payloads on high-value targets, such as domain controllers or file servers. The likelihood of adversaries using this tactic is significant, as attackers often exploit trusted applications to execute their code while bypassing defenses.

  ---

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques where adversaries obfuscate their file types or utilize legitimate signed files that imitate unusual behavior. It also relies on comprehensive logging configurations, particularly for file creation events in Windows environments. Legitimate use cases, such as automated scripts saving valid documents, could trigger this alert. Pairing this detection with other logging around process execution (Event ID 4688) or suspicious file access patterns helps strengthen overall detection coverage.

