title: File With Uncommon Extension Created By An Office Application
id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
status: test
description: Detects the creation of files with an executable or script 
  extension by an Office application.
references:
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
- https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/Threat%20Intelligence/The%20DFIR%20Report/20210329_Sodinokibi_(aka_REvil)_Ransomware.yaml
author: Vadim Khrykov (ThreatIntel), Cyb3rEng (Rule), Nasreddine Bencherchali 
  (Nextron Systems)
date: 2021-08-23
modified: 2025-10-17
tags:
- attack.t1204.002
- attack.execution
logsource:
  product: windows
  category: file_event
detection:
    # Note: Please add more file extensions to the logic of your choice.
  selection1:
    Image|endswith:
    - '\excel.exe'
    - '\msaccess.exe'
    - '\mspub.exe'
    - '\powerpnt.exe'
    - '\visio.exe'
    - '\winword.exe'
  selection2:
    TargetFilename|endswith:
    - '.bat'
    - '.cmd'
    - '.com'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.ocx'
    - '.proj'
    - '.ps1'
    - '.scf'
    - '.scr'
    - '.sys'
    - '.vbe'
    - '.vbs'
    - '.wsf'
    - '.wsh'
  filter_main_localassembly:
    TargetFilename|contains: '\AppData\Local\assembly\tmp\'
    TargetFilename|endswith: '.dll'
  filter_optional_webservicecache:   # matches e.g. directory with name *.microsoft.com
    TargetFilename|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Microsoft\Office\'
    - '\WebServiceCache\AllUsers'
    TargetFilename|endswith: '.com'
  filter_optional_webex:
    Image|endswith: '\winword.exe'
    TargetFilename|contains: '\AppData\Local\Temp\webexdelta\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_optional_backstageinappnavcache:   # matches e.g. C:\Users\xxxxx\AppData\Local\Microsoft\Office\16.0\BackstageInAppNavCache\ODB-user@domain.com
    TargetFilename|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Microsoft\Office\'
    - '\BackstageInAppNavCache\'
    TargetFilename|endswith: '.com'
  condition: all of selection* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with executable or script extensions (e.g., `.exe`, `.bat`, `.vbs`) by Microsoft Office applications such as Excel or Word. The primary behavior being detected is atypical file output from applications expected to generate document files, indicating a potential misuse of Office applications to deploy malicious payloads or scripts. The likely attacker objective is to execute malicious code, often part of a larger malicious campaign, such as ransomware deployment, potentially aiming for lateral movement or persistence.

  This behavior aligns with the MITRE ATT&CK tactic of Execution (T1204.002). Primary telemetry sources include Windows file event logs (Event ID 4663) capturing file creation events. If malicious, this behavior can lead to unauthorized access, data exfiltration, or system compromise. It is important to note that this detection on its own does not confirm malicious intent; legitimate use of Office applications may lead to similar file creations.

  ### Investigation Steps

  - **Identify file creation event:** Query Windows Security Event ID 4663 logs for file creation operations in the %TEMP% or %APPDATA% directories. Look for instances where files with `.bat`, `.exe`, or `.vbs` extensions were created by `excel.exe`, `winword.exe`, etc.

  - **Analyze process execution:** Review Sysmon Event ID 1 (process creation) to correlate process execution with file creation events. Check for unexpected child processes spawned by Office applications that could indicate malicious behavior.

  - **Evaluate legitimate behaviors:** Review normal usage patterns for the Office applications in question. Documented use cases or user training may reveal benign reasons for file creation, such as automated report generation.

  - **Search for common malicious indicators:** Look for known hash values or file names associated with malicious payloads within the created files in endpoint protection solutions. A file created as `malicious_script.bat` would be a strong indicator of a compromise.

  - **Check for user context:** Verify the user account that executed the Office application against known roles. Iteration from a non-admin user should be common for legitimate use; any deviations might raise suspicion.

  - **Audit for file delivery mechanisms:** Investigate any recent phishing emails or file downloads that may have led to the use of Office applications for malicious purposes. Review email logs and any related attachments.

  ### Prioritization

  Given that the alert pertains to executable files being created by Office applications, its severity is high, especially when initiated from critical systems or accounts with elevated permissions. The likelihood of malicious abuse is considerable, as such behavior is increasingly weaponized in various attack vectors, particularly in organized ransomware attacks.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as file renaming or using trusted applications in unexpected manners. It is essential to ensure that endpoint logging is properly configured to capture file creations and process executions. Legitimate activities, like macros or user automation scripts, may inadvertently trigger this alert. A related rule that strengthens detection is file access events for common scripting or executable file extensions generated from legitimate applications (e.g., scripts from PowerShell).

