title: File With Uncommon Extension Created By An Office Application
id: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
status: test
description: Detects the creation of files with an executable or script extension
  by an Office application.
references:
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
- https://github.com/vadim-hunter/Detection-Ideas-Rules/blob/02bcbfc2bfb8b4da601bb30de0344ae453aa1afe/Threat%20Intelligence/The%20DFIR%20Report/20210329_Sodinokibi_(aka_REvil)_Ransomware.yaml
author: Vadim Khrykov (ThreatIntel), Cyb3rEng (Rule), Nasreddine Bencherchali (Nextron
  Systems)
date: 2021-08-23
modified: 2025-10-17
tags:
- attack.t1204.002
- attack.execution
logsource:
  product: windows
  category: file_event
detection:
    # Note: Please add more file extensions to the logic of your choice.
  selection1:
    Image|endswith:
    - '\excel.exe'
    - '\msaccess.exe'
    - '\mspub.exe'
    - '\powerpnt.exe'
    - '\visio.exe'
    - '\winword.exe'
  selection2:
    TargetFilename|endswith:
    - '.bat'
    - '.cmd'
    - '.com'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.ocx'
    - '.proj'
    - '.ps1'
    - '.scf'
    - '.scr'
    - '.sys'
    - '.vbe'
    - '.vbs'
    - '.wsf'
    - '.wsh'
  filter_main_localassembly:
    TargetFilename|contains: '\AppData\Local\assembly\tmp\'
    TargetFilename|endswith: '.dll'
  filter_optional_webservicecache:   # matches e.g. directory with name *.microsoft.com
    TargetFilename|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Microsoft\Office\'
    - '\WebServiceCache\AllUsers'
    TargetFilename|endswith: '.com'
  filter_optional_webex:
    Image|endswith: '\winword.exe'
    TargetFilename|contains: '\AppData\Local\Temp\webexdelta\'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_optional_backstageinappnavcache:   # matches e.g. C:\Users\xxxxx\AppData\Local\Microsoft\Office\16.0\BackstageInAppNavCache\ODB-user@domain.com
    TargetFilename|contains|all:
    - 'C:\Users\'
    - '\AppData\Local\Microsoft\Office\'
    - '\BackstageInAppNavCache\'
    TargetFilename|endswith: '.com'
  condition: all of selection* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of files with executable or script extensions by Microsoft Office applications. Such behavior may indicate malicious activities, such as ransomware or other types of malware attempting to leverage trusted applications for execution. Attackers often exploit trusted environments to evade detection, making this rule essential for spotting potentially harmful activities that take advantage of common utility functions provided by applications like Excel, Word, and PowerPoint.

  In a relevant threat scenario, an attacker could utilize Office applications to manipulate user trust and deliver malicious payloads through seemingly legitimate actions. This tactic aligns with the MITRE ATT&CK framework, specifically the **Execution** tactic (TA0002) and the technique **User Execution** (T1204.002), as malicious files are often executed by unwitting users opening documents.

  Primary data sources that can provide the needed telemetry include Windows file event logs, which track file creation activities, and process creation logs, which help correlate the Office application used to create these files with their subsequent execution.

  ### Investigation Steps
  - **Review File Events:** Check Windows file event logs for the creation of files with the listed executable or script extensions generated by Office application processes. Note any unusual patterns or frequencies.

  - **Correlate With Process Creation Logs:** Cross-reference the identified file creation events with process creation logs to confirm that these files were indeed created by legitimate instances of Office applications. Look for anomalies in process chains that may indicate abuse.

  - **Analyze User Behavior:** Investigate the users associated with these actions. Determine if they have legitimate reasons to create such files or if the activity is out of the norm for their role.

  - **Assess Command History:** For specific user accounts, analyze command history for any unusual commands that could indicate an attempt to execute the created malicious files, looking specifically for script execution attempts from the affected systems.

  ### Prioritization
  The high-severity classification of this alert stems from the potential for significant impact if executable files are created and executed within a trusted environment. The likelihood of exploitation is increased due to the frequent use of Office applications and their inherent trust by users, making this detection crucial in identifying early signs of ransomware or other malicious activities.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the reliance on specific file extensions; if malicious content is delivered using non-standard or less common extensions, it may go undetected. The rule operates under the assumption that all file creations by the listed Office applications are legitimate unless proven otherwise, which could result in false positives. It requires comprehensive logging of Windows file events and process creation logs to function effectively, including appropriate configurations to capture all required events.

