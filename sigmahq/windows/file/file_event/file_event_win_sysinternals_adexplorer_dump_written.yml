description: Detects the dual use tool ADExplorer writing a complete AD snapshot
  into a .dat file. This can be used by attackers to extract data for 
  Bloodhound, usernames for password spraying or use the meta data for social 
  engineering. The snapshot doesn't contain password hashes but there have been 
  cases, where administrators put passwords in the comment field.
