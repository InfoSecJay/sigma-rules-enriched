  ---

  ### Technical Context

  This rule detects the execution of the tool ADExplorer writing a complete Active Directory (AD) snapshot into a .dat file. Attackers may leverage this tool to extract sensitive AD data, such as usernames potentially useful for password spraying attacks or social engineering purposes. The relevant MITRE ATT&CK tactics and techniques include “Discovery” (TA0007) specifically under “Account Discovery” (T1087.002).

  Primary telemetry sources include Windows file event logs where the target filename ends with '.dat', indicating a potential data export. If malicious, this activity may indicate preparatory steps for further attacks, such as lateral movement or identity theft. However, it is important to note that this detection alone does not confirm malicious intent, as legitimate administrators may also utilize ADExplorer for authorized AD data extraction.

  ---

  ### Investigation Steps

  - **Check for recent ADExplorer execution:** Review file event logs (Event ID 4663) for ADExplorer execution. Look for `Image` paths ending with `ADExp.exe`, `ADExplorer.exe`, `ADExplorer64.exe`, or `ADExplorer64a.exe` on systems where AD management activities are uncommon.

  - **Identify the target .dat file:** Validate the specific .dat file created. Inspect fields within file event logs (e.g., `TargetFilename`) to confirm it is newly created and not expected (look for entries from admin roles creating known snapshots).

  - **Review context around the creation:** Correlate the time of the .dat file creation with other security logs (e.g., Security Event ID 4688) to identify any user activities or access patterns that align with potential unauthorized uses of ADExplorer.

  - **Evaluate user behavior and legitimacy:** Check user account permissions and role context. If executed by an administrator account, determine if the action is documented in policy or procedure. If an unexpected user executed this, further investigation is warranted.

  - **Search for suspicious metadata:** If possible, extract and analyze the created .dat file for unusual metadata (using PowerShell or similar tools) that may suggest it was used to gather user information or passwords, especially in comment fields.

  - **Leverage related detection mechanisms:** Monitor for lateral movement behaviors post Alerting (such as account discovery activity). Examine execution logs for related tools or commands indicative of malicious intentions, referencing the companion detection for similar alerting on unauthorized tools.

  ---

  ### Prioritization

  The alert should be treated with medium severity given that unauthorized AD data extraction can severely compromise an organization’s security posture. While the likelihood of malicious use is moderate, the widespread adoption of tools like ADExplorer by both attackers and administrators necessitates careful evaluation before concluding malicious intent.

  ---

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate administrative use of ADExplorer causing false positives. Ensuring complete coverage requires monitoring file event logs specifically for instances of `.dat` file creations in appropriate environments. Additionally, normal administrative activities may showcase elevated use of ADExplorer. A related detection may include monitoring for unusual PowerShell commands or the use of other directory enumeration tools as part of a broader assessment strategy.

