note: |
  ### Technical Context
  This detection rule identifies the use of the tool ADExplorer, which can be misused by attackers to create a complete snapshot of Active Directory (AD) data and write it to a `.dat` file. The ability to extract information such as usernames and other metadata allows adversaries to gather intelligence for further attacks like password spraying or social engineering. While the snapshot does not contain password hashes, there have been documented incidents where sensitive information was noted in the comment fields associated with user accounts.

  The primary threats associated with this activity fall under the MITRE ATT&CK framework, specifically focusing on tactics such as **Discovery** (TA0007) where potential techniques include **Account Discovery** (T1087.002) and **Active Directory Object Enumeration** (T1069.002). Attackers may leverage this data to map organizational structure or user roles within a target environment, aiding in the planning of further malicious activity.

  Key data sources for detecting this activity include file event logs from Windows systems, which can provide insights into file creation and modifications related to the ADExplorer tool.

  ### Investigation Steps
  - **Review File Event Logs:** Check Windows file event logs for instances where `ADExp.exe`, `ADExplorer.exe`, or similar executables write `.dat` files. Validate whether these activities are legitimate administrator actions or suspicious in nature.

  - **Analyze User Account Activity:** Investigate the usernames and objects captured within the `.dat` file to assess for any unfamiliar accounts that may indicate a targeted attack or unauthorized enumeration of sensitive accounts.

  - **Correlate with LDAP Query Logs:** Examine LDAP query logs for any unusual or excessive queries that coincide with the timing of the detected `.dat` file creations. This can help establish a timeline of activity and highlight potential abuse.

  - **Conduct a Threat Hunt:** Execute a proactive hunt for other instances of ADExplorer use across the network, considering the typical administrative usage patterns to differentiate between normal and suspicious activity.

  ### Prioritization
  The severity of this alert is medium, as while the presence of ADExplorer usage can indicate potential reconnaissance activities, the impact primarily resides in the extraction of user data rather than immediate system compromise. However, the information gathered could facilitate subsequent, more harmful attacks.

  ### Blind Spots and Assumptions
  This detection rule may miss cases where attackers employ native Windows tools to gather similar information without utilizing ADExplorer. Additionally, there is an assumption that logs for both file events and corresponding LDAP activities are adequately configured and retained. If the monitoring setup does not include logging specific interactions with Active Directory or is not configured to capture all relevant process execution events, detection efficacy could be adversely affected.

