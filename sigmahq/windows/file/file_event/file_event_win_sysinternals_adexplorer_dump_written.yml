note: |
  ### Technical Context

  This rule detects the use of the dual-purpose tool ADExplorer, specifically when it writes a complete Active Directory snapshot into a .dat file. Attackers may utilize this behavior to extract user data for tactics such as password spraying or to gather information for social engineering attacks. The relevant MITRE ATT&CK tactics and techniques include **Discovery (T1087.002)**, **Account Discovery (T1069.002)**, and **Data from Information Repositories (T1482)**. The primary telemetry sources for this detection are Windows file events related to process execution, specifically focusing on the creation of .dat files. If malicious, this behavior can lead to unauthorized exfiltration of sensitive user data; however, this detection does NOT confirm malicious intent on its own, as ADExplorer can also be legitimately used by administrators.

  ### Investigation Steps

  - **Check for ADExplorer execution:** Verify if the process was initiated by looking for Process Creation logs (Security Event ID 4688 or Sysmon Event ID 1) with the image names ending in `ADExp.exe`, `ADExplorer.exe`, `ADExplorer64.exe`, or `ADExplorer64a.exe`. Confirm that the process was executed in an expected administrative context.

  - **Identify the target file's creation:** Inspect Windows file events for the specific creation of a `.dat` file. Look for File Creation events (Event ID 4663) where the TargetFilename ends with `.dat`. Note the directory where the file is created for context (e.g., user profile directories may suggest benign activity).

  - **Determine the user context:** Analyze the User and Process ID associated with the ADExplorer process to identify who executed it (use fields like CallerUserID and ProcessID) and assess whether this user should be legitimately using such a tool based on their role.

  - **Assess file contents for sensitive information:** If possible, manually or programmatically review the contents of the created `.dat` file for sensitive data like usernames or comments that might include passwords. Analyze the metadata within the file for hints of malicious use.

  - **Look for legitimate usage patterns:** Compare logs against historical usage of ADExplorer by legitimate administrators to determine whether similar process creation and file writing are common practices. Document any patterns that justify benign behavior.

  - **Validate against related detections:** Cross-reference with alerts from companion detection rules that monitor related suspicious behavior within Active Directory or abnormal file access patterns to enrich your investigation context and confirm findings.

  ### Prioritization

  This alert is of medium severity due to the sensitive nature of Active Directory information that could potentially be exfiltrated. The likelihood of malicious abuse is moderate, as ADExplorer is a legitimate tool often misused by attackers for reconnaissance and data collection. Similar techniques have been weaponized in various campaigns, warranting prompt attention to investigate further.

  ### Blind Spots and Assumptions

  Detection may be limited by tool evasion techniques, such as misnaming valid executables or executing from temporary locations, which could bypass monitoring. Ensure that logging configurations capture necessary file event types for full visibility. Legitimate administrative practices, such as using ADExplorer for audits, may trigger this alert. Companion detections include monitoring for unusual access to sensitive AD object attributes or unauthorized changes in permissions, which reinforce coverage and improve response capabilities.

