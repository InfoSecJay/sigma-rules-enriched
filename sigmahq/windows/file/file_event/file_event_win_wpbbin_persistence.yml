  ### Technical Context

  This rule detects the creation of a file named "wpbbin" within the "%systemroot%\system32\" directory, which can signify an attempt to establish UEFI-based persistence on a Windows device. The likely attacker objective includes maintaining control over a compromised system, potentially allowing survival of malware across system reinstalls and other anti-malware measures. The relevant MITRE ATT&CK tactic is **Persistence**, and the technique is **UEFI Firmware Persistence (T1542.001)**.

  Primary telemetry sources include Windows file event logs indicating the creation of specific files. If this behavior is malicious, it could allow an adversary persistent access with escalated privileges. However, it's crucial to note that detection of this file creation does NOT confirm malicious intent on its own, as legitimate software from hardware manufacturers may also utilize this file.

  ### Investigation Steps

  - **Check creation time of "wpbbin.exe":** Validate the timestamp via Security Event ID 4663 logs. Malicious creations might occur during unusual hours or correlate with suspicious activity elsewhere in the logs.

  - **Review file ownership and attributes:** Examine the file properties to identify the owner and any unusual attributes (e.g., read-only). Legitimate files typically have known owners (e.g., system or hardware manufacturers) and may not be marked as executable.

  - **Analyze process lineage:** Investigate the creating process through Sysmon Event ID 1 logs to ascertain if a known benign process spawned the creation. Malicious indicators include anomalous parent processes not typically associated with standard system tasks.

  - **Correlate with known UEFI modification techniques:** Check for related changes in UEFI settings or configurations that may accompany this event, which may also be captured in firmware logs. Legitimate firmware updates from manufacturers will lack stealthy modifications.

  - **Audit for additional persistence indicators:** Check if unusual Scheduled Tasks, Registry modifications (especially under HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Run), or connections to malware command-and-control servers occurred concurrently. Collect and examine Event IDs 4698 or 4688 for scheduling activities.

  - **Examine environment context:** Validate the role of the affected host. For example, a workstation commonly used by admins is more susceptible to malicious persistence than a kiosk device, which less frequently interacts with external media.

  ### Prioritization

  This alert holds high severity as it potentially signifies a significant security risk through UEFI persistence, allowing threat actors to maintain control over a system effectively. The likelihood of malicious abuse is considerable given the persistence mechanism's complexity and stealth. This technique is increasingly weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate activity from hardware vendors may produce false positives. Without comprehensive logging configurations, such as enabling detailed file system audit logs, critical insights may be missed. Additional legitimate activities like firmware updates or installations from trusted vendors may also trigger this alert. Companion detections include monitoring for anomalous UEFI firmware modification events to bolster overall persistence strategy visibility.

