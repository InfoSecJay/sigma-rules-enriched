  ### Technical Context

  This Sigma rule detects the creation of a file named "wpbbin.exe" in the "%systemroot%\system32\" directory. This behavior is indicative of a potential UEFI-based persistence method often leveraged by sophisticated adversaries. The likely attacker objective is to maintain long-term access to a compromised system, even after reboots or OS reinstalls, which can be critical for stealthy operations.

  This detection aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique UEFI Firmware (T1542.001). The primary telemetry source is Windows file event logs, specifically monitoring file creation events. If this behavior is malicious, it could lead to undetected, prolonged access to sensitive information or system control. It is important to note that this detection does NOT confirm that malicious activity is taking place on its own; it requires further investigation to ascertain the intent.

  ### Investigation Steps

  - **Check file creation event details:** Investigate Windows Security Event ID 4663 to find details on the file creation of "C:\Windows\System32\wpbbin.exe" and capture the user and process that created it.

  - **Review process creation logs:** Look at Sysmon Event ID 1 to identify if the "wpbbin.exe" process has been spawned and to gather information on the parent process, command line arguments, and the user context.

  - **Identify legitimate usage:** Cross-reference the presence of "wpbbin.exe" with known hardware manufacturer usage (such as Lenovo) to rule out false positives, ensuring the file correlates with expected system behavior.

  - **Monitor for unusual executable behavior:** Review Event ID 4688 for any subsequent execution of "wpbbin.exe," and assess the command-line parameters for clustering with known malware behaviors or unauthorized tools.

  - **Check for UEFI firmware modifications:** Use tools or processes that examine the UEFI settings and firmware logs to see if there are any unauthorized changes that align with UEFI persistence techniques.

  - **Scan for additional persistence mechanisms:** Search for other artifacts typical of UEFI persistence (e.g., checks for device firmware modifications) by reviewing Windows Event Log IDs concerning firmware changes.

  ### Prioritization

  This alert carries high severity due to the potential impact on critical assets, as the affected system could be a server or endpoint holding sensitive information. The likelihood of malicious abuse is significant, as UEFI persistence methods are commonly weaponized by advanced threats to ensure stealthy access.

  ### Blind Spots and Assumptions

  Detection may miss file creations that utilize different naming conventions or locations, as adversaries might rename "wpbbin.exe" or use alternative persistence mechanisms. It is essential to ensure that Windows File Auditing is enabled to capture these events reliably. Legitimate actions, such as hardware manufacturer updates, may trigger this alert; thus, analysts should be aware of trusted vendors. A related detection for process manipulation (e.g., detecting unusual parent-child relationships in process creation) can complement this rule to enhance coverage.

