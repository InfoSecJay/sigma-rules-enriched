note: |
  ### Technical Context
  This rule detects instances where the Windows Error Reporting tool (`WerFault.exe`) creates a memory dump file with references to the Local Security Authority Subsystem Service (LSASS). LSASS is a critical Windows process responsible for enforcing security policies, including user authentication. When an attacker gains access to the LSASS process memory, they can extract sensitive information such as plaintext passwords and Kerberos tickets, potentially leading to credential theft and lateral movement within the network.

  The threat scenario typically involves a malicious actor leveraging `WerFault.exe` to covertly create a memory dump that reveals user credentials stored in LSASS, a technique aligned with the MITRE ATT&CK framework's Credential Access tactic (ID: TA-1003) and specifically technique T1003.001 (OS Credential Dumping: LSASS Memory). Attackers may use this method as part of a larger strategy to escalate privileges or maintain access to compromised systems.

  Primary data sources for detection include file event logs that capture the creation of files by processes, especially those associated with executable paths like `C:\WINDOWS\system32\WerFault.exe`. Monitoring these logs provides insights into unusual or unauthorized usage of system tools that are typically benign.

  ### Investigation Steps
  - **Review File Event Logs:** Check logs for `WerFault.exe` file creation events, particularly for files containing 'lsass' or 'lsass.exe' in their filenames. Look for anomalies or patterns that deviate from normal behavior.
  - **Analyze Process Creation Events:** Investigate parent-child relationships in your process creation logs to see if `WerFault.exe` was spawned in an unusual context or by an unauthorized application, indicating potential malicious intent.
  - **Correlate with User Behavior:** Determine if the users associated with the alerts had legitimate reasons to manipulate LSASS or if there were any prior suspicious activities involving privilege escalation or credential dumping.
  - **Inspect for Unauthorized Access:** Review access logs or event logs to identify any attempts to interact with LSASS memory, especially from accounts with low privileges or from suspicious locations.

  ### Prioritization
  The severity of this alert is high due to the potential for credential theft linked to LSASS access. If successful, this exploitation could lead to significant breaches of authentication mechanisms, granting attackers extensive control over enterprise assets.

  ### Blind Spots and Assumptions
  This detection logic may have gaps, particularly in environments with custom configurations or if logging of file events is not fully enabled, as it relies heavily on the availability of detailed file event logs. It assumes that `WerFault.exe` is not used legitimately in contexts where LSASS-related dump files may naturally occur. For optimal detection, ensure that file event logging is correctly configured on all endpoints handling sensitive data, and consider supplementing this detection with additional telemetry around process behavior and user actions.

