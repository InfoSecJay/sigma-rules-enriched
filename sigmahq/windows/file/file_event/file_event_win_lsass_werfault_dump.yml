note: |
  ### Technical Context

  This rule detects the creation of a memory dump file by `WerFault.exe` that includes 'lsass' in its filename, indicating a potential attempt to extract sensitive user credentials from the LSASS process memory. The likely attacker objective is to harvest credentials for lateral movement or privilege escalation within the network. This detection aligns with MITRE ATT&CK technique T1003.001 (Credential Dumping: LSASS Memory), which is commonly used by attackers to compromise user credentials.

  The primary telemetry sources for this alert are file creation events in the Windows environment, specifically monitoring for processes initiated by `WerFault.exe`. If this behavior is malicious, it can lead to unauthorized access and data breaches. It is important to note that this detection alone does not confirm malicious intent, as legitimate applications may also generate similar memory dump files under certain circumstances.

  ### Investigation Steps

  - **Identify process creation events: ** Review Security Event ID 4688 for instances of `WerFault.exe` spawning. Confirm the process creation time aligns with the alert timestamp. Investigate the parent process, aiming to identify if it was spawned by a legitimate application or script.

  - **Analyze dump file characteristics: ** Locate the dump file and examine its properties, including the creation timestamp and size. A legitimate dump file should typically not contain 'lsass' in the name unless explicitly required for debugging.

  - **Check for unauthorized file access: ** Review Windows Security Event ID 4663 for access to LSASS-related files or directories around the same time as the dump creation event. Malicious activity may correlate with unusual access patterns.

  - **Review user account activity: ** Investigate the user account under which `WerFault.exe` executed. Look for abnormal logon activity or privilege escalations in Security Event IDs 4624 and 4672 that might indicate an compromised account.

  - **Confirm registry modifications: ** Check for recent changes to Windows Registry keys related to memory dump configurations. Events can be sourced from Windows Event ID 4661 for any alterations that may imply auditor configurations being manipulated.

  ### Prioritization

  This alert should be treated with high severity due to the critical nature of LSASS process memory, which potentially contains sensitive user credentials. The likelihood of malicious abuse is elevated, as credential dumping techniques are commonly employed in real-world attacks and threat actor toolkits.

  ### Blind Spots and Assumptions

  Detection may be limited if relevant logging configurations are not enabled, particularly for file events and process creations. Attackers may deploy various evasion techniques, such as using alternate processes or obfuscating dump file names. Legitimate activities, such as troubleshooting or debugging processes for applications, could inadvertently trigger this alert. Related detections such as monitoring direct LSASS access attempts (e.g., via `procDump`) enhance overall detection coverage and context.

