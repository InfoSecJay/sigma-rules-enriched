note: |
  ### Technical Context

  This Sigma rule detects attempts to create scheduled tasks in the Windows System32\Tasks directory from processes originating in suspicious locations such as user profile folders or system configuration directories. The likely attacker objective is to establish persistence on a compromised system or execute malicious processes at startup, leveraging the Scheduled Task mechanism for privilege escalation. This behavior aligns with the MITRE ATT&CK techniques T1053 (Scheduled Task), T1035 (Service Registry Permissions Weakness), and any associated privilege escalation tactics.

  The primary telemetry sources for this detection are file event logs detailing the creation or modification of tasks within the System32 directory. If malicious, the impact includes unauthorized execution of scripts or executables at system startup, potentially compromising system integrity or exfiltrating sensitive information. Importantly, this detection does NOT confirm that a malicious action is occurring; legitimate scheduled tasks may also trigger this rule.

  ### Investigation Steps

  - **Verify the originating process location:** Examine the Process Creation logs (e.g., Security Event ID 4688 or Sysmon Event ID 1) to determine if the process creating the scheduled task originated from directories like `C:\Users\<username>\AppData\`. Legitimate tasks often originate from known programs in `C:\Windows\System32\` or other non-user-specific paths.

  - **Check task parameters:** Review the Task Scheduler logs (Event ID 106) for details on the parameters and command line used in the scheduled task creation. Look for parameters that contain obfuscated or unusual commands which are uncommon for standard applications.

  - **Correlate with user activity:** Investigate user activity related to the account responsible for the task creation, focusing on user authentication logs (Event ID 4624). If the user was inactive or logged off during the task creation, this is indicative of potential malicious behavior.

  - **Analyze for high-confidence malicious indicators:** Evaluate for signs of exploitation such as a command pointing to known malicious binaries, particularly in non-standard paths (e.g., `C:\PerfLogs\` or `\Windows\System32\config\systemprofile`). Cross-reference against threat intelligence for known malware signatures.

  - **Identify benign scheduled tasks:** Establish baselines for normal scheduled tasks in your environment by reviewing the Task Scheduler for expected applications and administrator-created tasks. Look for tasks created by trusted applications without unusual arguments or paths.

  - **Validate against additional logs:** Check for file creation events related to the task (`Event ID 4663`) that show a creation action on executable files, particularly in high-risk directories. This can help confirm if payloads are being introduced into the environment alongside scheduled task creation.

  ### Prioritization

  This alert is considered high severity due to the potential impact on critical systems if scheduled tasks are maliciously leveraged to execute unauthorized actions. The behavior detected is frequently used by threat actors to maintain persistence, making it a realistic indicator of compromise in a mature environment.

  ### Blind Spots and Assumptions

  One limitation of this detection is that it can be evaded through use of legitimate programs or directly modifying scheduled tasks without appropriate logging enabled. Effective log source requirements include ensuring comprehensive task logging with the Windows Task Scheduler and process creation logs through Sysmon. Legitimate administrative activities, such as routine updates or maintenance tasks, may trigger this alert. Companion detections could include monitoring for unexpected changes to Group Policy that may indicate abuse of scheduled tasks for wider attack strategies.

