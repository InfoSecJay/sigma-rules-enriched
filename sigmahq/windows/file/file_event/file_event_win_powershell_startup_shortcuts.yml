note: |
  ### Technical Context

  This Sigma rule detects the creation of startup shortcuts (.lnk files) by PowerShell (powershell.exe or pwsh.exe) in the Windows startup directory. This behavior is commonly associated with adversarial activities aimed at establishing persistence on compromised systems, as the created shortcuts facilitate automatic execution of malicious commands upon user logon. The relevant MITRE ATT&CK techniques include Persistence (T1547.001) under the tactic of Privilege Escalation.

  The primary telemetry source for this detection is Windows file event logs, specifically focusing on events related to file creation in directories associated with user startup. If exploited, this behavior can lead to continuous code execution, potentially impacting the confidentiality, integrity, and availability of the affected system. Importantly, the detection of this activity does not alone confirm malicious intent; legitimate applications may also create startup shortcuts under certain conditions.

  ### Investigation Steps

  - **Review file creation events:** Check Windows File Event logs (Event ID 4663) for entries related to the creation of .lnk files in the User Startup directory (C:\Users\<Username>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup). Compare timestamps with known logon events.

  - **Identify the invoking process:** Use Sysmon (Event ID 1) to track the parent-child process relationship. Validate whether the parent process is powershell.exe or pwsh.exe and verify that the command line arguments used align with typical PowerShell shortcuts.

  - **Evaluate command line details:** In Sysmon logs, analyze the command line flags used by the detected PowerShell processes for obfuscation patterns or suspicious arguments (e.g., Base64 encoding) that deviate from normal PowerShell operations.

  - **Determine legitimacy of the shortcut:** Validate the created .lnk files' properties by inspecting their target path for known malicious executables or scripts. Ensure that no legitimate applications are expected to have created a shortcut at the time.

  - **Correlate with user behavior:** Investigate user login patterns and activity around the time the suspicious shortcut was created to determine if it coincides with anomalous user behavior indicative of compromise.

  - **Examine the system for further artifacts:** Look for other persistence mechanisms, such as modified registry entries under HKCU\Software\Microsoft\Windows\CurrentVersion\Run, which may indicate further malicious persistence tactics employed alongside the .lnk file.

  ### Prioritization

  This alert is of high severity due to the potential impact on compromised systems, as shortcut persistence can enable continued unauthorized access. The likelihood of malicious abuse is significant, given the common exploitation of PowerShell to facilitate deceptive persistence mechanisms, making this a behavior often weaponized by adversaries.

  ### Blind Spots and Assumptions

  This detection may be limited if legitimate software uses PowerShell to create shortcuts for business processes, leading to potential false positives. Dependable detection requires enabling detailed file event logging and Sysmon integration for effective monitoring. Legitimate activities such as the installation of software might also trigger this alert, so context is crucial. A companion detection for registry modifications (e.g., keys under Startup) would enhance visibility into related persistence tactics.

