logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|contains: '\start menu\programs\startup\'
    TargetFilename|endswith: '.lnk'
  condition: selection
falsepositives:
- Depending on your environment accepted applications may leverage this at times.
  It is recommended to search for anomalies inidicative of malware.
level: high
note: |
  ### Technical Context
  This rule is designed to detect the creation of startup shortcuts via PowerShell, specifically looking for `.lnk` files being written to the startup directory. Adversaries often utilize this technique to establish persistence on compromised systems, ensuring that malicious scripts or payloads are executed each time a user logs in. In the case of the Yellow Cockatoo threat actor group, this behavior is part of a broader strategy where the execution of these shortcuts triggers a command-line script that subsequently installs a malicious DLL.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1547)**, specifically the technique **T1547.001: Boot or Logon Autostart Execution: Shortcut**. This technique describes the act of creating shortcut files in locations that execute automatically when a user logs onto their system. Effective monitoring of these activities can leverage logs to help identify potential malicious behavior and thwart persistent threats.

  Primary data sources to inform this detection include file event logs from Windows systems, particularly those detailing changes to files in the startup directory, as they will provide clear evidence of when `.lnk` files are created via PowerShell.

  ### Investigation Steps
  - **Search Log Source for Indicators:** Review file event logs for any instances of PowerShell (`powershell.exe` or `pwsh.exe`) writing `.lnk` files to the startup folder. Look for timestamps correlated with user logins to identify unusual behavior.
  - **Analyze PowerShell Command History:** Gather PowerShell command history from affected systems to determine the exact commands executed prior to the creation of the shortcut files. Focus on significant or suspicious commands that deviate from normal user activity.
  - **Review New Startup Entries:** Inspect the contents of the startup folder and examine the properties of any newly created shortcuts, including target file paths and execution parameters, to identify any anomalous entries.
  - **Identify User Context and Permissions:** Assess which user accounts have executed the PowerShell scripts, and verify whether they possess appropriate privileges. Look for any unauthorized accounts or elevation of privileges in relation to these activities.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of an attacker establishing persistence within a network environment. Given the likelihood of such techniques being employed by various threat actors, prompt investigation is critical to prevent further compromise and potential data loss.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if PowerShell logs are not configured properly or if file event logging does not encompass every action taken in critical directories. The detection logic assumes that all PowerShell instances writing to the startup folder are malicious unless demonstrated otherwise. Additionally, environments with legitimate applications creating shortcuts may lead to false positives if not adequately filtered, highlighting the need for contextual awareness regarding typical user behavior and application usage to ensure accurate detection.

