note: |
  ---

  ### Technical Context

  This detection rule identifies the creation of dynamic link library (DLL) assembly files by "aspnet_compiler.exe." This behavior may indicate exploitation or abuse of the ASP.NET compilation process, potentially allowing an attacker to proxy execution through a build provider. The primary attacker objective could involve executing arbitrary code or maintaining persistence on a compromised server.

  The relevant MITRE ATT&CK technique is **Execution: Exploitation of Vulnerabilities in Build Providers (T1216)**. The primary telemetry sources include Windows file event logs that capture the actions of processes creating files, with specific attention to the targeted directories that are common for ASP.NET temporary files. A malicious DLL creation suggests a high risk of code execution, potentially leading to system compromise.

  This detection does NOT confirm that the activity is malicious on its own; legitimate assembly compilation using a build provider may also trigger this alert.

  ---

  ### Investigation Steps

  - **Verify Event Logs:** Check Windows Security Event ID 4663 for file creation events by `aspnet_compiler.exe`. Look for entries where the recorded file path includes `\Temporary ASP.NET Files\` or `\assembly\tmp\` for DLL files.

  - **Assess File Properties:** Validate newly created DLL files in the directories mentioned. Confirm the creation timestamp, size, and file hashes against known benign assemblies. Legitimate assemblies generally connect to indexed .NET libraries and maintain consistent size and properties.

  - **Analyze Process Tree:** Review Sysmon Event ID 1 for process creation paths. Look for parent processes that spawn `aspnet_compiler.exe`, especially if invoked by unusual parent processes, indicating potential scripted automation or exploitation frameworks.

  - **Investigate Anomalous Web Requests:** Search IIS logs or other web logs for requests to ASP.NET endpoints that may coincide with the DLL creation timestamps. High access frequency or unusual endpoints may indicate exploitation attempts.

  - **Confirm Temporary File Deletion:** After the DLL creation, check for any corresponding cleanup in the `\Temporary ASP.NET Files\` directory. Legitimate processes generally leave behind trace files, while attackers may attempt to delete them to cover tracks.

  - **Identify High-Confidence Malicious Indicators:** Look for newly created DLL files with unusual names or those that do not correlate with established application structures. Files not affiliated with known applications are a strong indicator of malicious activity.

  ---

  ### Prioritization

  This alert has medium severity, as it involves potentially malicious DLL creation in a critical application environment. The likelihood of abuse is significant, especially if corresponding web application activity suggests exploitation. Similar patterns are frequently leveraged in attacks targeting web applications.

  ---

  ### Blind Spots and Assumptions

  This rule may miss DLL creations from non-ASP.NET processes or evasion techniques such as file renaming post-creation. Ensure that file system logging is enabled on all relevant hosts, as this detection relies on timely log data. Legitimate assembly compilations by developers can trigger this alert, leading to potential false positives. Consider companion detections related to unusual process trees or HTTP request patterns that may enhance overall incident response efforts.

