note: |
  ### Technical Context
  This detection rule identifies the creation of new Dynamic Link Library (DLL) assembly files by the `aspnet_compiler.exe`. This behavior may indicate misuse of the ASP.NET compilation process, where attackers could leverage the `aspnet_compiler` as a means to execute malicious code disguised within legitimate assembly files. Attackers might aim to achieve persistence, execute arbitrary code, or escalate privileges by exploiting the functionality of the ASP.NET compiler, potentially leading to the deployment of backdoors or other malicious payloads on a server.

  Relevant MITRE ATT&CK tactics include **Execution** (TA0002) and potential lateral movement or persistence through the deployed DLLs. Specific techniques involved are **Execution through API (T1203)**, considering the misuse of a well-known tool designed for legitimate operations. The primary data sources that provide the critical evidence for this detection are Windows file event logs, specifically monitoring the creation of files in directories associated with ASP.NET temporary files and assembly outputs.

  ### Investigation Steps
  - **Review File Creation Events:** Examine the logs for the creation of DLL files in the `\Temporary ASP.NET Files\assembly\tmp\` directory initiated by `aspnet_compiler.exe`, focusing on file names and timestamps for any suspicious patterns.
  - **Analyze Associated Processes:** Investigate processes spawned by `aspnet_compiler.exe` to determine if there are any child processes that indicate further exploitation, such as command-line arguments or execution paths that appear unusual.
  - **Validate Threat Intelligence:** Cross-reference any identified DLLs or file names against known malware signatures or threat intelligence feeds that might associate them with malicious actors.
  - **Check System for Other Indicators:** Utilize EDR or system logs to look for unusual activities surrounding the ASP.NET runtime, such as access attempts or changes to web.config files, which could signal an ongoing attack.

  ### Prioritization
  The alert is deemed medium severity due to the legitimate use cases of the `aspnet_compiler`, but suspicious DLL creation could indicate underlying malicious activities. Given the elevated access that the ASP.NET framework may grant, further investigation is warranted to ensure no exploitation has occurred.

  ### Blind Spots and Assumptions
  There may be gaps in coverage if logging and monitoring are not enabled for all relevant directories or if there is insufficient granularity in file event logs. The detection logic assumes that any creation of DLLs by `aspnet_compiler.exe` outside normal business operations is suspicious; however, this may overlook legitimate development processes. Additionally, the rule relies on the proper configuration of logging within the Windows environment to capture file creation events effectively.

