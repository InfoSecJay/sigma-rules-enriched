note: |
  ### Technical Context

  This Sigma rule detects the creation of new DLL files by "aspnet_compiler.exe" within the Temporary ASP.NET Files directory. This behavior may indicate that an attacker is abusing the ASP.NET compilation process to create and execute malicious assemblies without raising immediate flags, which can be part of an attempt to maintain persistence or execute payloads in a .NET environment.

  The likely attacker objective is to leverage legitimate tools to obfuscate malicious activity, fitting into the MITRE ATT&CK tactic of Execution (TA0002), specifically under the technique of Command-Line Interface (T1059.001) and potentially using Build Provider exploits (custom execution paths). The primary telemetry source for this rule is Windows file event logs, specifically focusing on events that indicate file creation (Event ID 4663 in combination with Event ID 5145 for file access).

  If the detected behavior is malicious, it could lead to unauthorized code execution, data exfiltration, or further compromise of other system components. However, it is crucial to understand that this detection alone does not confirm malicious intent, as legitimate assembly compilation activities may also trigger the alert.

  ### Investigation Steps

  - **Review recent file creations in the Temp ASP.NET directory:** Check Windows Security Event ID 4663 for entries where TargetFilename contains '\Temporary ASP.NET Files\' and '\assembly\tmp\', noting the process ID context and user account responsible.

  - **Identify the context of the aspnet_compiler.exe execution:** Use Sysmon Event ID 1 to track command line usage of aspnet_compiler.exe to see if it was initiated from a legitimate user context versus an unusual or system account context.

  - **Examine file attributes for created DLLs:** Look at the creation timestamps and file metadata of newly created DLLs to identify whether they appear suspicious or atypical compared to normal operation patterns.

  - **Review legitimate usage patterns:** Verify historical behavior of aspnet_compiler.exe in the environment to establish a baseline of normal activation and outputs, focusing on timing and associated user accounts during regular development or update cycles.

  - **Correlate with network activity:** Check for any outbound connections from the hosting system corresponding with the creation of the DLL files using Event ID 5156 (Windows Filtering Platform), which may indicate exfiltration attempts or command and control communications.

  - **Cross-reference with companion detections:** Investigate any alerts related to similar executable behavior (such as SuspChild or Susp Paths rules) to determine the broader context of suspicious activity, looking for correlation patterns across the environment.

  ### Prioritization

  This alert has medium severity due to the potential risks involved with the creation of executable code in a web server context. The likelihood of malicious abuse is moderate, particularly in environments with active web applications where adversaries might exploit legitimate user privileges to deliver payloads. While this behavior is not the most common weaponized technique, the use of compilation tools for obfuscation is a noted tactic among sophisticated threat actors.

  ### Blind Spots and Assumptions

  One limitation of this detection is that legitimate administrative activities, such as application updates and deployments, can trigger this alert, potentially leading to false positives. It requires comprehensive logging settings to capture the full context of file manipulations and executions accurately. Additionally, understanding expected development practices in the environment is crucial to separate benign activities from possible exploitation. A related detection that supports this alert is using detailed monitoring around file execution patterns and authority elevation, which can provide further insights into potential compromise scenarios.

