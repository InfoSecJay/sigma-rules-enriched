title: EVTX Created In Uncommon Location
id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
status: test
description: |
  Detects the creation of new files with the ".evtx" extension in non-common or non-standard location.
  This could indicate tampering with default EVTX locations in order to evade security controls or simply exfiltration of event log to search for sensitive information within.
  Note that backup software and legitimate administrator might perform similar actions during troubleshooting.
references:
- https://learn.microsoft.com/en-us/windows/win32/eventlog/eventlog-key
author: D3F7A5105
date: 2023-01-02
modified: 2026-10-13
tags:
- attack.defense-impairment
- attack.t1685.001
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: The ".evtx" extension should be monitored via a Sysmon
    configuration. Example: <TargetFilename condition="end with">.evtx<TargetFilename>'
detection:
  selection:
    TargetFilename|endswith: '.evtx'
  filter_main_path:
    TargetFilename|startswith: 'C:\Windows\System32\winevt\Logs\'
  filter_main_baseimage:
    TargetFilename|startswith: 'C:\ProgramData\Microsoft\Windows\Containers\BaseImages\'
    TargetFilename|contains: '\Windows\System32\winevt\Logs\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrator or backup activity
- An unknown bug seems to trigger the Windows "svchost" process to drop EVTX 
  files in the "C:\Windows\Temp" directory in the form 
  "<log_name">_<uuid>.evtx". See 
  https://superuser.com/questions/1371229/low-disk-space-after-filling-up-c-windows-temp-with-evtx-and-txt-files
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_create_evtx_non_common_locations/info.yml
note: |
  ### Technical Context

  This rule detects the creation of `.evtx` files in locations outside known and common storage paths, namely the default Event Log directory (`C:\Windows\System32\winevt\Logs\`). Such behavior may indicate an attacker attempting to hide their tracks by illegally creating or modifying log files, either for evasion of security controls or for the purpose of gathering sensitive information through log exfiltration. The relevant MITRE ATT&CK technique is **Defense Evasion: Indicator Removal on Host (T1561)** and more specifically **T1685: Evading Security Controls**.

  The primary telemetry sources are Windows File Creation events, specifically monitored via Sysmon (Event ID 11), which tracks file creation activities. If this behavior is malicious, it can compromise incident response efforts and conceal malicious activities. Importantly, this detection does not, on its own, confirm malicious actions; legitimate activities, such as administrative troubleshooting or backup software operations, can also create `.evtx` files.

  ### Investigation Steps

  - **Review file creation events:** Examine Sysmon Event ID 11 to identify the creation of `.evtx` files. Check the `TargetFilename` field to confirm the paths of newly created files and whether they are in non-standard directories (e.g., `C:\Windows\Temp`).

  - **Verify process origins:** Look at the `ProcessId` and `Image` fields in the Sysmon logs for Event ID 11. Determine if the creation was initiated by a suspicious or non-standard process. Legitimate actions often relate to known system processes (e.g., `svchost.exe`) not typically associated with log file operations.

  - **Cross-reference modification timestamps:** Confirm the timestamps on newly created `.evtx` files to see if they correspond with known incident times. Discrepancies may suggest malicious activity. Check for sudden spikes in creation near significant alerts in other security monitoring tools.

  - **Correlate user actions and scripts:** Review any concurrent user activity logs (Event ID 4624) around the times of suspicious file creation. Identify whether a legitimate administrator or user account was active during the timeline.

  - **Identify high-confidence malicious indicators:** Investigate the use of remote access tools or scripts that could initiate file creation in uncommon locations. Look for patterns of using remoting protocols like PowerShell (Event ID 4103) or any scripts executed soon before event creation that modify log locations.

  - **Review legitimate use cases:** Assess whether similar file creation activities were performed by backup processes or during scheduled maintenance windows, cross-referencing Event ID 106 for backup activity to establish context of expected benign behaviors.

  ### Prioritization

  The severity of this alert is medium due to the potential impact on security posture if malicious behavior is confirmed. The likelihood of a threat actor utilizing unconventional file locations to evade detection is notable, aligning with tactics used in advanced attacks. Since this behavior is less common and correlates with indicators of compromise, swift analysis is recommended.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon deployment or incorrect configuration for comprehensive file logging. Legitimate administrative tasks, such as troubleshooting or backup configurations, may trigger the alert and should be considered in analysis. Complementary detections, such as monitoring for unauthorized administrative actions via Event ID 4672, can help strengthen overall situational awareness and confirm potential threats.

