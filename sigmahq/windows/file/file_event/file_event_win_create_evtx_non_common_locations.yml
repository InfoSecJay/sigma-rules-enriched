title: EVTX Created In Uncommon Location
id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
status: test
description: |
  Detects the creation of new files with the ".evtx" extension in non-common or non-standard location.
  This could indicate tampering with default EVTX locations in order to evade security controls or simply exfiltration of event log to search for sensitive information within.
  Note that backup software and legitimate administrator might perform similar actions during troubleshooting.
references:
- https://learn.microsoft.com/en-us/windows/win32/eventlog/eventlog-key
author: D3F7A5105
date: 2023-01-02
modified: 2024-03-26
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: The ".evtx" extension should be monitored via a Sysmon
    configuration. Example: <TargetFilename condition="end with">.evtx<TargetFilename>'
detection:
  selection:
    TargetFilename|endswith: '.evtx'
  filter_main_path:
    TargetFilename|startswith: 'C:\Windows\System32\winevt\Logs\'
  filter_main_baseimage:
    TargetFilename|startswith: 'C:\ProgramData\Microsoft\Windows\Containers\BaseImages\'
    TargetFilename|endswith: '\Windows\System32\winevt\Logs\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrator or backup activity
- An unknown bug seems to trigger the Windows "svchost" process to drop EVTX files
  in the "C:\Windows\Temp" directory in the form "<log_name">_<uuid>.evtx". See 
  https://superuser.com/questions/1371229/low-disk-space-after-filling-up-c-windows-temp-with-evtx-and-txt-files
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_create_evtx_non_common_locations/info.yml
note: |
  ### Technical Context
  This detection rule identifies the creation of new files with the ".evtx" extension in locations that are considered non-standard for event log files in a Windows environment. The creation of EVTX files outside of the designated directories, such as `C:\Windows\System32\winevt\Logs\` and related backup locations, may indicate attempts by an attacker to manipulate or exfiltrate event logs. Such activities could be driven by the intent to evade detection mechanisms, conduct information gathering, or cover tracks after unauthorized access.

  The primary threat families associated with this behavior may include sophisticated attackers utilizing defense evasion techniques to undermine forensic capabilities. The relevant MITRE ATT&CK tactics that apply here are Defense Evasion (TA0005) and a specific technique for Indicator Removal on Host (T1562.002), both of which describe actions that target system logs to avoid detection. The most useful data sources for evidence of this behavior would be file event logs captured via Sysmon or Windows Event logs that monitor file creation activities.

  ### Investigation Steps
  - **Review File Creation Events:** Analyze file creation logs from Sysmon to identify when and where EVTX files are generated. Pay special attention to any unusual timestamps and user accounts associated with the events.
  - **Correlate with Other Activities:** Check for related anomalous activities in user behavior or system processes that could coincide with the EVTX file creation, such as unexpected logon events or process creations originating from elevated privileges.
  - **Examine Standard Directory Access:** Investigate access logs to the standard log locations (e.g., `C:\Windows\System32\winevt\Logs\`) to determine if there were any attempts to manipulate existing event logs prior to the creation of the non-standard EVTX files.
  - **Identify Potential False Positives:** Contextualize findings by identifying legitimate administrative activities or backup tasks that might trigger similar file creations. Validate if these activities align with scheduled maintenance or legitimate user actions.

  ### Prioritization
  The alert is of medium severity due to the potential for attackers to manipulate or exfiltrate event logs for malicious purposes, significantly impacting an organization's ability to detect, respond to incidents, and maintain compliance with logging and monitoring requirements.

  ### Blind Spots and Assumptions
  This detection may miss instances where attackers use more subtle methods to delete or modify existing logs rather than creating new ones. The detection relies on the presence of Sysmon configured to log file activity specifically for ".evtx" files, which may not be enabled on all systems. Additionally, this rule assumes a comprehensive understanding of typical system and user behaviors to differentiate between potentially malicious actions and legitimate administrative activities.

