title: EVTX Created In Uncommon Location
id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
status: test
description: |
  Detects the creation of new files with the ".evtx" extension in non-common or non-standard location.
  This could indicate tampering with default EVTX locations in order to evade security controls or simply exfiltration of event log to search for sensitive information within.
  Note that backup software and legitimate administrator might perform similar actions during troubleshooting.
references:
- https://learn.microsoft.com/en-us/windows/win32/eventlog/eventlog-key
author: D3F7A5105
date: 2023-01-02
modified: 2024-03-26
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: The ".evtx" extension should be monitored via a Sysmon
    configuration. Example: <TargetFilename condition="end with">.evtx<TargetFilename>'
detection:
  selection:
    TargetFilename|endswith: '.evtx'
  filter_main_path:
    TargetFilename|startswith: 'C:\Windows\System32\winevt\Logs\'
  filter_main_baseimage:
    TargetFilename|startswith: 'C:\ProgramData\Microsoft\Windows\Containers\BaseImages\'
    TargetFilename|endswith: '\Windows\System32\winevt\Logs\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrator or backup activity
- An unknown bug seems to trigger the Windows "svchost" process to drop EVTX 
  files in the "C:\Windows\Temp" directory in the form 
  "<log_name">_<uuid>.evtx". See 
  https://superuser.com/questions/1371229/low-disk-space-after-filling-up-c-windows-temp-with-evtx-and-txt-files
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_create_evtx_non_common_locations/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with the ".evtx" extension in uncommon locations, which may indicate malicious behavior such as tampering or exfiltration of Windows event logs. Attackers may aim to manipulate or extract log data to avoid detection or gather sensitive information. Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1562.002). The primary telemetry sources are Sysmon logs configured to monitor file creation events. If malicious, this behavior can lead to significant security impacts, including data exfiltration and evasion of forensic investigations. It's important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrator actions or backup processes can also create ".evtx" files in atypical locations.

  ### Investigation Steps

  - **Check Sysmon logs:** Review Sysmon Event ID 11 for file creation events. Focus on "TargetFilename" fields that end with ".evtx" and are located outside of typical paths such as `C:\Windows\System32\winevt\Logs\` or `C:\ProgramData\Microsoft\Windows\Containers\BaseImages\`.

  - **Identify unusual paths:** Look for ".evtx" files created in unexpected directories, like `C:\Windows\Temp\`. Confirm that these paths are not standard operational locations.

  - **Correlate timestamps:** Cross-reference the creation time of suspected ".evtx" files with known security events or legitimate administrative activities to determine if the behavior aligns with expected behavior.

  - **Validate against common tasks:** Determine if the file creation aligns with common administrative tasks, such as system backups or log exports, which could justify the presence of ".evtx" files in unusual locations.

  - **Examine file contents:** If possible, analyze the contents of any suspicious ".evtx" files for potentially sensitive information or signs of manipulation that could indicate malicious intent.

  - **Monitor for similar activity:** Look for other file creation events with non-standard extensions or those that coincide with the ".evtx" file creations for a more comprehensive understanding of the activity.

  ### Prioritization

  This alert is of medium severity in an enterprise context. The potential impact involves critical systems or sensitive log data being tampered with or exfiltrated, while the likelihood of malicious abuse is moderate given the commonality of benign administrative operations that may trigger this alert.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate backup software or administrative actions that create ".evtx" files in unusual locations, potentially leading to false positives. A reliable detection setup requires Sysmon properly configured to monitor file creation events. Additionally, legitimate activities may include system maintenance or troubleshooting, such as moving logs for analysis. A companion detection focus could include monitoring for deleted or modified log files, enhancing coverage against tampering attempts.

