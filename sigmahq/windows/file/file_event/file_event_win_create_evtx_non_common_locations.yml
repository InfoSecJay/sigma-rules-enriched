title: EVTX Created In Uncommon Location
id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
status: test
description: |
  Detects the creation of new files with the ".evtx" extension in non-common or non-standard location.
  This could indicate tampering with default EVTX locations in order to evade security controls or simply exfiltration of event log to search for sensitive information within.
  Note that backup software and legitimate administrator might perform similar actions during troubleshooting.
references:
- https://learn.microsoft.com/en-us/windows/win32/eventlog/eventlog-key
author: D3F7A5105
date: 2023-01-02
modified: 2024-03-26
tags:
- attack.defense-impairment
- attack.t1685.001
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: The ".evtx" extension should be monitored via a Sysmon
    configuration. Example: <TargetFilename condition="end with">.evtx<TargetFilename>'
detection:
  selection:
    TargetFilename|endswith: '.evtx'
  filter_main_path:
    TargetFilename|startswith: 'C:\Windows\System32\winevt\Logs\'
  filter_main_baseimage:
    TargetFilename|startswith: 'C:\ProgramData\Microsoft\Windows\Containers\BaseImages\'
    TargetFilename|endswith: '\Windows\System32\winevt\Logs\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Administrator or backup activity
- An unknown bug seems to trigger the Windows "svchost" process to drop EVTX 
  files in the "C:\Windows\Temp" directory in the form 
  "<log_name">_<uuid>.evtx". See 
  https://superuser.com/questions/1371229/low-disk-space-after-filling-up-c-windows-temp-with-evtx-and-txt-files
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_create_evtx_non_common_locations/info.yml
note: |
  ### Technical Context

  The rule detects the creation of files with a ".evtx" extension outside of standard locations, indicating potential tampering or exfiltration of Windows event logs. Attackers may aim to either evade security logging by modifying log storage or gather sensitive information for malicious intent, such as lateral movement or credential theft. This behavior relates to the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and the technique "Indicator Removal on Host" (T1583.001).

  The primary telemetry sources for this detection are Sysmon logs, specifically focusing on file creation events. Relevant log types include Sysmon Event ID 11, which documents the creation of files. If malicious, this behavior poses significant security risks, as it may allow attackers to remove traces of their actions. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative processes or backup operations could similarly generate this alert.

  ### Investigation Steps

  - **Review Sysmon Event ID 11 logs:** Check for file creation events where the `TargetFilename` ends with ".evtx". Specifically, look for events captured at suspicious timestamps or on infrequently accessed systems.

  - **Identify the file creation location:** Determine if the ".evtx" file was created in a common directory (e.g., `C:\Windows\System32\winevt\Logs\`) or a non-standard location (e.g., `C:\Windows\Temp`). Malicious activity typically involves unusual locations.

  - **Inspect the file attributes and creation process:** Analyze the event details for `FileName`, `ProcessName`, and `User`. Malicious indicators may be associated with processes like `powershell.exe` or `cmd.exe`, creating logs with unauthorized access.

  - **Assess legitimate administrative activity:** Compare the event against known administrative actions, such as routine backup operations or system diagnostics, which may generate similar events under expected conditions (e.g., standard backup directory).

  - **Cross-reference with existing incident reports:** Check if other alerts or incidents involve the same system or user account, providing additional context to assess the risk of malicious activity.

  - **Validate any persistence mechanisms:** Investigate if the ".evtx" file creation correlates with other abnormal activities, such as unusual scheduled tasks, which could indicate an attempt to maintain persistence on the host.

  ### Prioritization

  This alert has medium severity as it indicates a potential security violation in systems where compromised access could lead to significant impact. The likelihood of this behavior being abused for malicious purposes is moderate, particularly in environments where log integrity is critical. Similar activities have been weaponized by adversaries for asset persistence and data exfiltration.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging configurations; any system not running Sysmon or with inadequate logging may miss such creations. Legitimate actions, such as scheduled backups or administrative scripts, could generate similar alerts and obscure the signals. It’s advisable to correlate with companion detections, such as suspicious file access or unusual process creation in proximity to the ".evtx" file creation to strengthen overall coverage of potential threats.

