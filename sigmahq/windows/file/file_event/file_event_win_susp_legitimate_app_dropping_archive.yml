title: Legitimate Application Dropped Archive
id: 654fcc6d-840d-4844-9b07-2c3300e54a26
status: test
description: Detects programs on a Windows system that should not write an 
  archive to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth
date: 2022-08-21
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \msaccess.exe
    - \mspub.exe
    - \eqnedt32.exe
    - \visio.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - \finger.exe
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - \notepad.exe
    - \AcroRd32.exe
    - \RdrCEF.exe
    - \mshta.exe
    - \hh.exe
    TargetFilename|endswith:
    - '.zip'
    - '.rar'
    - '.7z'
    - '.diagcab'
    - '.appx'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the behavior of specific Windows applications, such as Microsoft Office programs and other common executables, that should not be creating archive files (e.g., .zip, .rar, .7z) on disk. Such behavior may indicate an attacker using these legitimate applications to obfuscate malicious file delivery or data exfiltration efforts. The relevant MITRE ATT&CK tactic is "Execution" (TA0002) and the technique is "Exploitation of Remote Services" (T1218).

  The primary telemetry sources include file event logs from Windows systems, capturing process creation and file write events. If malicious, this behavior poses significant risks including loss of sensitive data or propagation of malware. Importantly, this detection does not confirm malicious intent on its own; further investigation is necessary to establish context around the event.

  ### Investigation Steps

  - **Review process creation events:** Inspect Security Event ID 4688 for process creation events correlating with detected file writes. Look for executions of `winword.exe`, `excel.exe`, or other specified applications creating archive files, noting the parent processes and command line arguments for malicious indicators.

  - **Identify alerting filenames:** Examine the filenames being created for known indicators of compromise (IoCs) or suspicious naming patterns. Malicious archives often have names related to tax season, invoices, or legitimate business functions to lure users.

  - **Check file modifications:** Validate file creation using File System Auditing logs or Sysmon Event ID 11. Look for unusual file paths or locations (e.g., temporary directories versus user profile directories) that would indicate potentially malicious downloads.

  - **Review legitimate behavior:** Confirm if the detected applications are being used in their expected operational context (e.g., users exporting project files). Normal usage of Office files would not typically involve creating archives; legitimate activities may involve saving as document (e.g., .docx or .xlsx).

  - **Identify exclusion paths:** Check for known benign cases within your environment. There may be specific cases where these applications legitimately create archives due to user workflows or workflows specific to internal applications; document these exceptions to reduce noise.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive data systems within the enterprise. The likelihood of exploitation is moderate, as attackers commonly misuse trusted applications to mask their activities. While not every triggering event indicates malicious intent, the combination of context and behavior warrants urgent review.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate activities can inadvertently trigger this alert when end-users archive files for appropriate business purposes. The absence of required log sources—such as file system change logs—may affect the accuracy of detection. Additionally, performing analysis on files created by non-compliant applications could lead to false positives. A related detection involves monitoring for unusual outbound network connections after archive file creation, strengthening coverage on potential data exfiltration attempts.

