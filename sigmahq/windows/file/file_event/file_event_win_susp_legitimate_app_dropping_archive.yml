title: Legitimate Application Dropped Archive
id: 654fcc6d-840d-4844-9b07-2c3300e54a26
status: test
description: Detects programs on a Windows system that should not write an archive
  to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth
date: 2022-08-21
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \msaccess.exe
    - \mspub.exe
    - \eqnedt32.exe
    - \visio.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - \finger.exe
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - \notepad.exe
    - \AcroRd32.exe
    - \RdrCEF.exe
    - \mshta.exe
    - \hh.exe
    TargetFilename|endswith:
    - '.zip'
    - '.rar'
    - '.7z'
    - '.diagcab'
    - '.appx'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where certain legitimate applications, particularly Microsoft Office programs and other commonly used executables, attempt to write archive files (like `.zip`, `.rar`, and others) to disk. This behavior is unusual and can indicate possible evasion tactics employed by attackers, who may leverage legitimate tools to disguise malicious activity. For instance, an attacker might use an Office application to create an archive file containing a payload or to exfiltrate data under the guise of legitimate processes.

  The likely objectives of an attacker utilizing this method could range from evasion of security mechanisms to the delivery of malware or data exfiltration. Within the context of the MITRE ATT&CK framework, this detection aligns with the tactics of **Defense Evasion** (TA0005) and the techniques **Masquerading** (T1036) as well as **Execution** (T1218), where trusted applications are employed to avoid detection while executing malicious activities.

  Primary sources of telemetry for corroborating such incidents include file event logs from Windows systems, specifically monitoring the creation and modification events of files associated with the applications specified in the detection logic.

  ### Investigation Steps
  - **Review File Event Logs:**: Analyze file event logs to identify the timestamp, process name, and user context under which the archive file was created. Look for any anomalies associated with expected business processes.
  - **Examine Parent Process:**: Look at the parent processes that initiated the archive creation. Scrutinize the lineage of those processes to determine if any were spawned unexpectedly or by non-administrative accounts.
  - **Correlate with Execution Context:**: Check for the execution context to determine if there were any recent suspicions related to the applications listed. This may include other log sources such as EDR logs to capture process execution details.
  - **Investigate Associated Permissions:**: Review permissions and access controls for the accounts associated with the process in question. Look for insufficient or atypical permissions that could indicate compromised credentials or insider threats.

  ### Prioritization
  The severity of this alert is high due to the potential implications of a legitimate application being misused for malicious activities, which could lead to significant risks including data breaches, malware deployment, or overall system compromise.

  ### Blind Spots and Assumptions
  This detection logic assumes that the targeted applications should never legitimately create archive files. Therefore, any legitimate use cases for this behavior specific to certain environments may lead to false positives. Additionally, environments that do not log file creation events or have insufficient Sysmon configuration may result in a lack of detection. Proper logging and Sysmon configuration with relevant filters are essential for the efficacy of this detection rule to function effectively.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
