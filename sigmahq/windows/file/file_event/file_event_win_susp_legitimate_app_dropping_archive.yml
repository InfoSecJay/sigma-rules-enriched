title: Legitimate Application Dropped Archive
id: 654fcc6d-840d-4844-9b07-2c3300e54a26
status: test
description: Detects programs on a Windows system that should not write an archive
  to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth
date: 2022-08-21
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \msaccess.exe
    - \mspub.exe
    - \eqnedt32.exe
    - \visio.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - \finger.exe
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - \notepad.exe
    - \AcroRd32.exe
    - \RdrCEF.exe
    - \mshta.exe
    - \hh.exe
    TargetFilename|endswith:
    - '.zip'
    - '.rar'
    - '.7z'
    - '.diagcab'
    - '.appx'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the writing of archive files, specifically ZIP, RAR, 7z, diagcab, and appx formats, by certain Microsoft applications and commonly abused legitimate binaries on Windows systems. Attackers may leverage these applications to drop malicious payloads disguised as compressed files, aiming to evade detection and deliver ransomware or other malware. This is associated with the MITRE ATT&CK tactic "Defense Evasion" (TA0005) and the technique "Executable File" (T1218).

  Primary telemetry sources include file event logs generated by Sysmon or Windows Security Event logs, especially focusing on Event ID 4663, which identifies file creation activities. The potential security impact is significant, with the risk of introducing malware via seemingly benign applications. Importantly, the detection does NOT confirm that the behavior is malicious, as legitimate use cases exist for these applications.

  ---

  ### Investigation Steps

  - **Review process execution context**: Check Event ID 4688 (Process Creation) for the programs listed (e.g., winword.exe, excel.exe) around the time of the archive drop. Analyze the parent process to determine if it matches legitimate behavior (e.g., a user initiating a document creation).

  - **Identify suspicious file creation events**: Examine Event ID 4663 (File Access), focusing on the 'TargetFilename' field for any of the detected archive types. A legitimate usage would typically not involve Office applications creating these file types.

  - **Check for known indicators of compromise**: Use threat intelligence to see if the creating executables have previously been associated with malicious activity or if the dropped archives contain known malicious hashes.

  - **Assess environmental context**: Determine if the alert was triggered on a critical system (e.g., domain controller or file server) that could indicate a higher risk of significant damage if compromised, versus a non-critical user workstation.

  - **Determine frequency of alert activation**: Review the history of similar alerts for this host. If multiple alerts occur frequently for the same host with similar execution paths, it might indicate a pattern of abuse or misconfiguration.

  - **Analyze for legitimate activities**: Confirm whether any users or processes are known to use the applications mentioned for legitimate archiving tasks, noting normal file paths and expected archive outcomes (e.g., user-initiated document compressions).

  ---

  ### Prioritization

  The alert is considered high severity due to the potential for serious impacts on compromised systems, especially in environments where those applications are used widely. The likelihood of this behavior being weaponized is significant, as attackers frequently exploit trusted applications to carry out malicious activities.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques can include modifying the execution flow or using obfuscation tactics to avoid detection when creating archives. The rule assumes that appropriate logging configurations are enabled; without Sysmon or detailed event logging, detection may be ineffective. Legitimate activities, such as users creating archives of documents via Microsoft Office, can trigger this alert. Companion detections include monitoring for unusual process behaviors or outbound connections made by applications that previously triggered this alert.

