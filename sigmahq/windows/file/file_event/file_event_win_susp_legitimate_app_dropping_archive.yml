title: Legitimate Application Dropped Archive
id: 654fcc6d-840d-4844-9b07-2c3300e54a26
status: test
description: Detects programs on a Windows system that should not write an 
  archive to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth
date: 2022-08-21
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables
    - \winword.exe
    - \excel.exe
    - \powerpnt.exe
    - \msaccess.exe
    - \mspub.exe
    - \eqnedt32.exe
    - \visio.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - \finger.exe
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - \notepad.exe
    - \AcroRd32.exe
    - \RdrCEF.exe
    - \mshta.exe
    - \hh.exe
    TargetFilename|endswith:
    - '.zip'
    - '.rar'
    - '.7z'
    - '.diagcab'
    - '.appx'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of compressed archive files such as .zip, .rar, or .7z by legitimate applications (e.g., Microsoft Office suite, mshta.exe) that typically do not create such files under normal operation. The likely attacker objective could be to obfuscate the delivery of malware or exfiltrate data by enclosing it in an archive format. This behavior is associated with the MITRE ATT&CK technique "Application Layer Protocol" (T1218), primarily used for evasion.

  The primary telemetry sources for this detection come from Windows file event logs that detail file creation events. If malicious, this behavior could indicate an ongoing attack, such as a data exfiltration attempt or the execution of a malicious payload disguised as a legitimate file. However, this detection alone does NOT confirm that the activity is malicious; it shows anomalous behavior that requires further investigation.

  ### Investigation Steps

  - **Check Event IDs**: Review Security Event ID 4663 (File Access) and Sysmon Event ID 11 (File Create) for the specific processes involved in dropping the archive. Look for unusual parent-child process relationships where benign applications are spawning file creation events.

  - **Identify legitimate behavior**: Cross-reference the list of applications involved. Tools like Microsoft Word or Excel generating archive files could indicate misuse. Under normal circumstances, these applications should not be creating archives.

  - **Look for known malicious indicators**: Investigate any file creation events where the TargetFilename ends with .zip or .rar. Search for suspicious file paths that may execute outside of expected directories (e.g., C:\Users\Public\Downloads). Document unusual names or unexpected timestamps.

  - **Review potential data exfiltration**: If logs or network flows show an outbound connection following the creation of an archive file, assess for potential data exfiltration. Validate if the archive file was uploaded to external sites or received unexpected network activity.

  - **Analyze process lineage**: Use Sysinternals tools like Process Explorer to trace the parent processes. Confirm if processes like mshta.exe are being used to facilitate the archive creation and whether this aligns with known patterns of legitimate use.

  - **Validate against baseline behavior**: Compare the activity against normal operational profiles. Look for any spikes in archive file creation corresponding with user behavior or legitimate IT activities like backups or archiving.

  ### Prioritization

  The severity of this alert is high due to the potential for data loss or malicious activity using commonly trusted applications. System roles that typically do not create archives (e.g., servers or critical infrastructure endpoints) heighten the likelihood of malicious abuse when this rule is triggered. This behavior is often weaponized in social engineering attacks and malware delivery mechanisms.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false positives arising from benign use of approved applications that can create archives for legitimate reasons. Required log sources need to be configured correctly, ensuring Sysmon is capturing file creation events accurately. Legitimate activities that could trigger this alert include routine backups, software updates, or bulk document exports. For improved coverage, it is advisable to incorporate alerts for unusual network activity or external communications following the creation of archive files.

