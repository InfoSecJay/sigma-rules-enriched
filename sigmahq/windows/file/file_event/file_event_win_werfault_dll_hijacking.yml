title: Creation of WerFault.exe/Wer.dll in Unusual Folder
id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
status: test
description: Detects the creation of a file named "WerFault.exe" or "wer.dll" in
  an uncommon folder, which could be a sign of WerFault DLL hijacking.
references:
- https://www.bleepingcomputer.com/news/security/hackers-are-now-hiding-malware-in-windows-event-logs/
author: frack113
date: 2022-05-09
modified: 2026-05-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - '\WerFault.exe'
    - '\wer.dll'
  filter_main_known_locations:
    TargetFilename|startswith:
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\UUS\'         # covers both C:\Windows\UUS\arm64\ and C:\Windows\UUS\packages\
  filter_main_process:
    Image|endswith: '\wuaucltcore.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of "WerFault.exe" or "wer.dll" in non-standard directories on Windows systems. This behavior suggests potential DLL hijacking, where an attacker substitutes a legitimate DLL or executable with a malicious version to gain persistence or execute arbitrary code. The initial objective is often privilege escalation (T1068) or persistence (T1547.001) by exploiting system-related processes mishandled by the Windows Error Reporting service.

  Primary telemetry sources include security event logs capturing file creations (Event ID 4663), and potentially Sysmon logs (Event ID 10) that provide detailed file creation event information. If malicious, this behavior can lead to unauthorized access or take over of the affected system. This detection alone does not prove malicious intent; further context is necessary to assess the legitimacy of the file’s presence and its execution context.

  ### Investigation Steps

  - **Check file creation logs:** Review Security Event ID 4663 for the creation of "WerFault.exe" or "wer.dll" in unexpected directories. Confirm if the creation occurred outside typical locations such as `C:\Windows\SoftwareDistribution\`, `C:\Windows\System32\`, or others listed in the Sigma rule.

  - **Validate parent process:** Investigate Event ID 4688 to identify the parent process of the newly created “WerFault.exe” or “wer.dll.” Legitimate processes usually originate from `wuaucltcore.exe`, while unexpected parent processes may indicate suspicious behavior.

  - **Correlate with execution context:** Review Sysmon Event ID 10 entries to gather more details about the process execution. Look for command-line arguments or unusual execution paths that could hint at malicious use.

  - **Identify indicators of compromise:** Check for additional file artifacts created close to the same time, including temporary files or unusual registry changes, that may indicate malicious activities linked to the detected process.

  - **Review historical context:** If the file was previously present in the system, verify its original creation time and any legitimate software installations. Legitimate updates or applications might have used these files, differing from unexpected creation times.

  ### Prioritization

  This alert holds medium severity due to the potential impact on system integrity and the likelihood of malicious exploitation. The unusual creation of known files like "WerFault.exe" or "wer.dll" in atypical locations raises concerns regarding system compromise, though the behavior may also occur from legitimate software issues.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for evasion through name obfuscation or using alternative benign processes for hijacking. Reliable detection requires comprehensive logging configured for file creation events across all system directories, which may not always be present in all environments. Legitimate application updates or system diagnostics may trigger similar alerts. Companion detections should involve monitoring unusual file execution patterns, particularly on processes like `wuaucltcore.exe`, to strengthen alerting capability.

