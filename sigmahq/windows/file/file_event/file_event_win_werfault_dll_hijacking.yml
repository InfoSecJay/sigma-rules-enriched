title: Creation of WerFault.exe/Wer.dll in Unusual Folder
id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
status: test
description: Detects the creation of a file named "WerFault.exe" or "wer.dll" in
  an uncommon folder, which could be a sign of WerFault DLL hijacking.
references:
- https://www.bleepingcomputer.com/news/security/hackers-are-now-hiding-malware-in-windows-event-logs/
author: frack113
date: 2022-05-09
modified: 2025-12-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - '\WerFault.exe'
    - '\wer.dll'
  filter_main_known_locations:
    TargetFilename|startswith:
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\UUS\arm64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of files named "WerFault.exe" or "wer.dll" in locations that are not typical for Windows system files. This behavior may indicate that an attacker is attempting to hijack the native Windows Error Reporting tool (WerFault) for malicious purposes. Common attacker objectives include elevating privileges, maintaining persistence, or evading detection by obscuring malicious activity within legitimate processes.

  The relevant MITRE ATT&CK tactics and techniques are Privilege Escalation (T1068) and Defense Evasion (T1574.001), as the behavior directly aims to manipulate a system process to execute unauthorized actions. The primary telemetry sources are Windows file events, specifically monitoring the creation of files (Event ID 4663) in process execution contexts. If malicious, this detection could lead to unauthorized access or damage to the system integrity. Notably, this rule alone does not confirm malicious intent; legitimate applications may create these files in unconventional locations during specific conditions.

  ---

  ### Investigation Steps

  - **Verify the creation location:** Check for the full path of the newly created file using Security Event ID 4663. Legitimate instances of WerFault.exe and wer.dll should reside in `C:\Windows\System32` or other common directories. Uncommon folder paths warrant further investigation.

  - **Correlate file creation with process execution:** Review Sysmon Event ID 1 for process creation details around the same timestamp as the file creation. Look for unusual parent processes that created WerFault.exe or wer.dll, such as unexpected scripts or executables not typically associated with Windows Error Reporting.

  - **Assess file characteristics:** Examine the file properties using tools like PowerShell or Sysinternals’ AccessChk to confirm legitimate file signatures and attributes. Validate if the file has unusual metadata indicating manipulation or does not match hash signatures of legitimate files.

  - **Investigate system behavior at the time of creation:** Utilize Windows Event ID 4688 to track other process activity on the host at the time of the alert. Identify if there was a series of process creations or modifications that suggest a coordinated attack.

  - **Identify online threat intelligence:** Search for the hashed values of the detected files in threat intelligence services to determine if the created files match known malware signatures or campaigns.

  - **Review recent software installations or updates:** Analyze logs for any recent changes or installations that may explain the legitimate creation of these files. Confirm these updates are part of approved processes to rule out malware camouflage.

  ---

  ### Prioritization

  This alert should be treated with medium severity. The presence of these files in unusual locations can indicate potential privilege escalation or persistence mechanisms, causing significant risk if exploited. While such behavior may not be frequent, the range of tactics exploiting trusted system processes makes this a relevant concern for security teams.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by scenarios where legitimate applications may also create these files in unconventional locations, leading to potential false positives. Comprehensive logging must be enabled for file creation events (Event ID 4663) and process execution (Event ID 4688) to ensure reliable detection. Additionally, legitimate administrative tools or updates may trigger the alert, making context critical. Monitoring companion detections, such as suspicious process creation or uncommon file access patterns, can strengthen overall detection coverage.

