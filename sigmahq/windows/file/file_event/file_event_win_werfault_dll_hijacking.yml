title: Creation of WerFault.exe/Wer.dll in Unusual Folder
id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
status: test
description: Detects the creation of a file named "WerFault.exe" or "wer.dll" in
  an uncommon folder, which could be a sign of WerFault DLL hijacking.
references:
- https://www.bleepingcomputer.com/news/security/hackers-are-now-hiding-malware-in-windows-event-logs/
author: frack113
date: 2022-05-09
modified: 2025-12-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - '\WerFault.exe'
    - '\wer.dll'
  filter_main_known_locations:
    TargetFilename|startswith:
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\UUS\arm64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of the "WerFault.exe" or "wer.dll" files in folders other than their standard locations (e.g., System32, SoftwareDistribution). This behavior can indicate attempts to exploit DLL hijacking techniques, where an attacker places malicious versions of legitimate binaries in unexpected directories to facilitate privilege escalation or persistence. The relevant MITRE ATT&CK tactic is "Privilege Escalation" (TA0004) and the technique is "DLL Search Order Hijacking" (T1574.001). The primary telemetry sources are Windows file event logs, specifically monitoring for file creation events. If malicious, such activity could lead to unauthorized execution of arbitrary code with elevated privileges. However, detection of this activity alone does not confirm malicious intent, as it could stem from legitimate software updates or misconfigurations.

  ### Investigation Steps

  - **Review creation event details:** Check File Event logs (Windows Security Event ID 4663) to confirm the creation time, user context, and process ID associated with the creation of WerFault.exe or wer.dll.

  - **Investigate the directory context:** Examine the folder path where the file was created. Legitimate instances will typically occur in C:\Windows\SoftwareDistribution\ or C:\Windows\System32\. Anything outside these paths warrants further scrutiny.

  - **Correlate process parentage:** Use Sysmon Event ID 1 to analyze the parent process of the file creation. A legitimate Windows process (e.g., WerFault as an error reporting tool) should typically spawn these binaries, while anomalous parent processes indicate potential malicious activity.

  - **Examine user access patterns:** Look for patterns in the logon events (Windows Security Event ID 4624) to identify whether the user who triggered the creation of these files has a history of creating such executables or is associated with system administration roles.

  - **Check for unusual file attributes:** Validate created file attributes using PowerShell or Windows Explorer to assess timestamps, digital signatures, and version details. Authentic Microsoft files will have expected signatures from trusted Microsoft sources.

  ### Prioritization

  This alert is medium severity due to the potential for privilege escalation if exploited, particularly on critical systems where elevated control could lead to significant compromise. The likelihood of this behavior being malicious is moderately high as it employs stealthy techniques to hide malware. This type of DLL hijacking is a recognized method among adversaries for executing code without detection.

  ### Blind Spots and Assumptions

  Detection may be limited if file event logs are improperly configured or events are not being collected consistently from all endpoints. Evasion techniques could involve placing the executable in legitimate software update folders or using standard OS tools to create logs that appear benign. Legitimate activities such as software updates or application errors could also trigger this alert. A related detection is monitoring for anomalous PowerShell or Windows scripting activity that may accompany file creation events, helping to corroborate potential threats.

