title: Creation of WerFault.exe/Wer.dll in Unusual Folder
id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
status: test
description: Detects the creation of a file named "WerFault.exe" or "wer.dll" in an
  uncommon folder, which could be a sign of WerFault DLL hijacking.
references:
- https://www.bleepingcomputer.com/news/security/hackers-are-now-hiding-malware-in-windows-event-logs/
author: frack113
date: 2022-05-09
modified: 2025-12-03
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1574.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - '\WerFault.exe'
    - '\wer.dll'
  filter_main_known_locations:
    TargetFilename|startswith:
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\UUS\arm64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule monitors for the creation of potentially malicious instances of "WerFault.exe" or "wer.dll" in uncommon directories, which could indicate DLL hijacking. Attackers may exploit the Windows Error Reporting tool to execute their payload by placing a malicious version of these files in unusual locations. This behavior typically aims to achieve persistence on the system while evading detection, leading to potential privilege escalation or lateral movement within the network.

  The relevant MITRE ATT&CK techniques for this detection include:
  - **T1574.001 - DLL Search Order Hijacking**: Exploiting the way Windows searches for DLLs, attackers can place their malicious libraries in locations that are checked before the legitimate ones, thereby gaining control over legitimate processes.
  - **T1050 - New Service**: The potential creation of services that run the hijacked binaries could also fall under this category, as the attacker may want the hijacked file to execute upon startup.

  Primary data sources for substantiating alerts from this rule include:
  - Security event logs for file creation events in Windows environments.
  - File integrity monitoring tools that provide insights into file system changes.
  - Endpoint detection and response (EDR) data, which captures process activities and can help identify suspicious executions of WerFault.exe or wer.dll.

  ### Investigation Steps
  - **Review File Creation Logs**: Check file system event logs for the creation of WerFault.exe or wer.dll, particularly in locations that are not typical for these files. Look for timestamp anomalies or patterns indicating malicious activity.
  - **Analyze Process Creation Events**: Investigate any processes that spawn from these files, linking back to their parent processes to determine whether they were initiated by legitimate system services or potentially malicious commands.
  - **Audit Uncommon Directories**: Examine additional uncommon directories where similar file creation events have occurred, looking for other executable files that may signal further compromise or backdoor entry points.
  - **Validate Service Configurations**: Ensure that any associated service configurations utilizing these files are legitimate and haven’t been altered to point to malicious versions of those binaries.

  ### Prioritization
  This alert is considered medium severity due to the potential for significant impact on system integrity and the likelihood that the attack involves sophisticated evasion tactics. Unusual file placements can lead to further exploitation and persistence, making quick remediation essential.

  ### Blind Spots and Assumptions
  One gap in detection coverage could be environments where file system logs are not sufficiently detailed or monitored, leaving some malicious file creations undetected. The detection logic assumes that suspicious behaviors occur in atypical directories, so it may miss threats if an attacker uses a more conventional path. Ensuring that file creation logs are enabled and that EDR solutions are properly configured to monitor process executions is vital for this alert's reliability.

