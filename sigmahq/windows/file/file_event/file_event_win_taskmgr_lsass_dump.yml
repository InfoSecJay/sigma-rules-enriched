title: LSASS Process Memory Dump Creation Via Taskmgr.EXE
id: 69ca12af-119d-44ed-b50f-a47af0ebc364
status: test
description: Detects the creation of an "lsass.dmp" file by the taskmgr process. This
  indicates a manual dumping of the LSASS.exe process memory using Windows Task Manager.
author: Swachchhanda Shrawan Poudel
date: 2023-10-19
references:
- https://github.com/redcanaryco/atomic-red-team/blob/987e3ca988ae3cff4b9f6e388c139c05bf44bbb8/atomics/T1003.001/T1003.001.md#L1
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - ':\Windows\system32\taskmgr.exe'
    - ':\Windows\SysWOW64\taskmgr.exe'
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - '\lsass'
    - '.DMP'
  condition: selection
falsepositives:
- Rare case of troubleshooting by an administrator or support that has to be investigated
  regardless
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_taskmgr_lsass_dump/info.yml
note: |
  ### Technical Context
  This detection rule identifies the creation of a memory dump file named "lsass.dmp" by the Windows Task Manager process (taskmgr.exe). Such activity may signal an attacker attempting to exfiltrate sensitive information, particularly credentials, from the Local Security Authority Subsystem Service (LSASS), which manages authentication and security policies in Windows environments. The ability to access LSASS memory can enable a threat actor to capture plaintext credentials or Kerberos tickets, potentially leading to further unauthorized access within the network.

  The relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and the specific technique **Memory Dumping** (T1003.001). These tactics are commonly employed by adversaries to gather sensitive information. Primary data sources that will contain useful evidence include file event logs detailing file creation activities, specifically around dumps created in sensitive directories such as the user’s AppData local directory.

  ### Investigation Steps
  - **Review File Creation Events:** Examine file event logs for the creation of `lsass.dmp` around the time of the detected activity and check for the process `taskmgr.exe` associated with this event to confirm the context of the dump creation.
  - **Correlate with Process Execution Logs:** Look at process creation logs to determine if `taskmgr.exe` was executed by a known administrator or if it appears abnormal, linking the user or session to the suspicious activity.
  - **Examine User Activities:** Investigate the account that executed the Task Manager for unusual behavior patterns, failed login attempts, or anomalous access to sensitive systems leading up to the dump creation.
  - **Identify Other Recent Dumps:** Cross-reference with any recent memory dump creations in the environment to identify if this is part of a larger pattern indicative of potential attacks, noting timestamps and contexts.

  ### Prioritization
  This alert is classified as high severity in an enterprise environment due to the critical nature of LSASS and its role in credential storage. The likelihood of attack associated with the dumping of LSASS memory is significant, as it can facilitate further lateral movement and privilege escalation for attackers.

  ### Blind Spots and Assumptions
  The detection coverage may have gaps in environments where legitimate administrative actions include memory dumps for troubleshooting. The detection logic assumes that `taskmgr.exe` execution is not a normal occurrence for the user or process context involved and relies on proper logging configurations for windows file event monitoring to be effective. Additionally, if filesystem auditing is not configured to capture file events, this rule may miss crucial indicators of compromise.

