note: |
  ### Technical Context
  This detection rule identifies the creation of files that match specific patterns commonly associated with the exfiltration of NTDS.DIT, a critical file containing information about user accounts and credentials in Active Directory. The rule focuses on file names such as `All.cab` and `.ntds.cleartext`, which are utilized by various tools designed to extract and transfer sensitive data from Active Directory. The intent behind this behavior is typically to facilitate credential theft, enabling attackers to escalate privileges or maintain persistence within the target environment.

  The relevant MITRE ATT&CK tactics for this rule include **Credential Access** (TA0006), specifically the technique **Credential Dumping: NTDS** (T1003.003). Attackers may leverage tools such as Metasploit's NTDS Grabber or Impacket's secretsdump to obtain NTDS.DIT contents, which are often targeted when seeking to compromise user accounts or conduct lateral movement.

  Primary data sources that will provide critical evidence for this detection include Windows file event logs that capture file creation events, allowing security teams to identify potentially malicious file activities indicative of credential dumping operations.

  ### Investigation Steps
  - **Review File Creation Events:** Analyze file event logs for the creation of files matching the detected patterns (`All.cab`, `.ntds.cleartext`). Look for the context in which these files were created, including user accounts and the processes involved.

  - **Correlate With Process Execution:** Check for concurrent or recent process execution logs that may relate to known NTDS extraction tools (e.g., scripts or executables linked to Metasploit or Impacket). Identify any command lines associated with these processes for further investigation.

  - **Identify User Behavior:** Investigate the user or service account associated with the file creation. Determine if this behavior is consistent with normal usage patterns or if the account has recently been compromised or misused.

  - **Examine Endpoint Security Alerts:** Monitor alerts from endpoint detection and response (EDR) solutions that may indicate the use of tools known for NTDS extraction. This may help correlate suspicious file creations with known malicious behaviors.

  ### Prioritization
  Given the high criticality of the information contained within NTDS.DIT, the alert should be prioritized as high severity. Successful credential extraction can lead to significant security breaches, including unauthorized access to sensitive systems and data loss.

  ### Blind Spots and Assumptions
  This detection rule may not account for all potential methods of NTDS extraction, as new tools or techniques may emerge that do not use the specified filename patterns. The detection logic assumes that log collection includes detailed file event logging; without accurate logging configurations, alerts may be missed. Additionally, there may be false positives resulting from legitimate administrative activities that utilize similar filenames in benign contexts. Continuous tuning and monitoring of the environment are necessary to minimize these issues.

