note: |
  ### Technical Context

  This rule detects file creation events for specific filenames associated with NTDS.DIT exfiltration attempts, including 'All.cab' and '.ntds.cleartext'. This activity is indicative of an adversary trying to access and extract Active Directory secrets or authentication information. The likely attacker objective includes credential theft, enabling further access to sensitive resources within the environment.

  This behavior corresponds to the MITRE ATT&CK technique for Credential Access (T1003.003). The primary telemetry sources for this detection are Windows file system events, specifically file creation logs. The security impact if this activity is malicious could lead to unauthorized access to user credentials and domain administrative privileges. Importantly, this detection alone does not confirm a successful exfiltration or compromise without additional context around the alert.

  ### Investigation Steps

  - **Review file creation logs for the target names**: Check Windows Security Event ID 4663 for file creation events where `Object Name` ends with '\All.cab' or '.ntds.cleartext'. Query for the `TargetFilename` to confirm the activity.

  - **Identify the user or process responsible**: Use Windows Event ID 4624 (Logon) and Event ID 4688 (Process Creation) to correlate the initiating user account and the process creating these files. Ensure the user has legitimate access to sensitive directories.

  - **Assess the directory location**: Check if the file creation occurred in a directory normally associated with high privilege accounts, like `C:\Windows\System32\` or within user profiles of administrative accounts. Legitimate activity typically generates files in locations associated with app data rather than direct system folders.

  - **Investigate historical behavior of the user**: Analyze the user account's previous file creation patterns (Event ID 4663). A legitimate account may show consistent and expected behavior, while anomalies could indicate malicious actions.

  - **Check for process anomalies**: Look at recent file creation events in conjunction with Windows Sysmon Event ID 1 for any unusual command-line arguments or parent process relationships. High-confidence indicators include unusual PowerShell commands or remote tools (like Metasploit).

  - **Validate file integrity**: Verify if the created files are associated with legitimate applications or tools within your environment. Use file hashes and compare them against known benign sources or threat intelligence feeds.

  ### Prioritization

  The alert should be treated as high severity due to the critical security implications of NTDS.DIT exfiltration, which can lead to widespread credential theft. The likelihood of malicious use is high, given that the specified filename patterns are often utilized by adversaries in credential dumping attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations or the absence of appropriate logging settings for file system activities on Windows devices. Legitimate administrative tools or processes, especially during maintenance routines, might trigger this alert. A related detection to consider is monitoring for unusual PowerShell activity (T1086) that could signal an attack in progress during the same timeframe.

