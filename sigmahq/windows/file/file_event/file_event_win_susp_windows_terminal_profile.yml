note: |
  ### Technical Context

  This detection targets the modification or creation of the Windows Terminal settings file "settings.json" by uncommon processes, such as cmd.exe or powershell.exe. Modifying this file could indicate an attempt at persistent access, possibly setting up an environment for executing illegitimate commands or scripts. The likely attacker objective is to configure the terminal to execute malicious commands or scripts automatically, thereby ensuring persistence.

  The relevant MITRE ATT&CK technique for this detection is Persistence via Modify Existing Service (T1547.015). The primary telemetry source is Windows file event logs, specifically targeting file modifications to "settings.json" located in the Windows Terminal package directory. The security impact is significant; if the modification is malicious, it may allow unauthorized command execution in compromised environments. This detection does NOT confirm that the actor is definitively malicious without additional context or corroborative indicators.

  ### Investigation Steps

  - **Verify process origin and legitimacy:** Check the process creating or modifying "settings.json". For Event ID 4663 in Security logs, correlate the process name and path. Legitimate activity typically involves processes like "explorer.exe" or "Windows Terminal" itself, while names matching "cmd.exe" or "powershell.exe" from unexpected directories may indicate malicious activity.

  - **Review modification timestamps:** Analyze the timestamps of the last modification of "settings.json" against known maintenance windows. If the modification occurred outside of expected hours, flag this for further investigation as a potential indicator of compromise.

  - **Identify uncommon process behavior:** Investigate the specific command line invoked with uncommon processes (e.g., cscript.exe or powershell.exe) using Sysmon Event ID 10. Look for suspicious arguments or scripts that could indicate an attempt to manipulate terminal settings.

  - **Correlate with other logs:** Check Application and Services logs for any entries related to the Windows Terminal package. Learning that other security events occurred in conjunction can provide context for the modification (e.g., failed logins or execution of known malware).

  - **Confirm the presence of persistence indicators:** Look for additional persistence hooks, such as created scheduled tasks or autostart entries, recorded in Event ID 4697. Correlate with logins or logoffs (Event ID 4624 and 4625) to reveal patterns across sessions.

  ### Prioritization

  This alert holds a medium severity due to the potential risk of unauthorized command execution and persistence. As the modification of critical configuration files is a common tactic used by attackers, prompt investigation is warranted to determine if this is part of a larger attack scenario.

  ### Blind Spots and Assumptions

  Detection may falter if legitimate administrative scripts modify settings.json regularly; thus, context around such actions is essential. This rule requires proper Windows file event logging to function effectively. Users can also trigger the alert during administrative changes or updates to their terminal settings. Complementary detections for script execution or task creation (e.g., monitoring for Event ID 4698) can enhance coverage and reduce false negatives.

