logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Note: Add other potential common applications
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wscript.exe'
    TargetFilename|endswith: '\AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json'
  condition: selection
falsepositives:
- Some false positives may occur with admin scripts that set WT settings.
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the Windows Terminal Profile settings file, `settings.json`, is created or modified by processes that are not commonly associated with legitimate changes to this file. Attackers may exploit this capability to achieve persistence on a compromised system, by altering terminal configurations to conduct future activities, such as executing malicious scripts or accessing privileged resources without raising alarms. Such behavior typically aligns with objectives of configuring or maintaining control over an environment post-compromise.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Tactics:**
    - Persistence
    - Privilege Escalation
  - **Techniques:**
    - **T1547.015:** Boot or Logon Autostart Execution: Windows Terminal Profile

  Primary data sources for effective detection include file event logs capturing changes to `settings.json`, alongside process creation events that establish context around the origins of these changes. Monitoring for uncommon process executions is key, as legitimate alterations are typically performed by standard administrative tools or user actions.

  ### Investigation Steps
  - **Review Process Creation Logs:** Examine logs for process executions that lead to the modification of `settings.json`, focusing on the uncommon processes specified in the detection logic.
  - **Analyze File Event Logs:** Collect and analyze file event logs related to `AppData\Local\Packages\Microsoft.WindowsTerminal_8wekyb3d8bbwe\LocalState\settings.json` to determine specific changes made, including timestamps and user contexts.
  - **Correlate with User Activity:** Investigate user accounts and their associated activities around the time of modifications to identify if the actions align with normal user behavior or are indicative of compromise.
  - **Evaluate Environment for Additional Risks:** Look for other signs of persistence or behavior indicating that a resource has been compromised, such as unusual software installations or configurations.

  ### Prioritization
  Given the potential for this alert to indicate an attacker attempting to establish persistence or manipulate terminal access, it is considered medium severity. The likelihood of these events occurring in an enterprise environment enhances the alert's significance, making it essential for prompt investigation.

  ### Blind Spots and Assumptions
  This detection may miss attempts to modify `settings.json` by processes not included in the designated list, as well as scenarios where legitimate administrative tasks might lead to similar modifications. Assumptions include that the modification of the file is primarily due to nefarious actors and not common administrative scripts. Proper logging configurations for file events and process creation must be in place to ensure this detection functions effectively.

