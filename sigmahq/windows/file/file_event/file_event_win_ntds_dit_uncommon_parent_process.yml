  type: similar
status: test
description: Detects creation of a file named "ntds.dit" (Active Directory 
  Database) by an uncommon parent process or directory
references:
- https://www.ired.team/offensive-security/credential-access-and-credential-dumping/ntds.dit-enumeration
- https://www.n00py.io/2022/03/manipulating-user-passwords-without-mimikatz/
- https://pentestlab.blog/tag/ntds-dit/
- https://github.com/samratashok/nishang/blob/414ee1104526d7057f9adaeee196d91ae447283e/Gather/Copy-VSS.ps1
author: Florian Roth (Nextron Systems)
date: 2022-03-11
modified: 2023-01-05
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  product: windows
  category: file_event
  definition: 'Requirements: The "ParentImage" field is not available by default on
    EID 11 of Sysmon logs. To be able to use this rule to the full extent you need
    to enrich the log with additional ParentImage data'
detection:
  selection_file:
    TargetFilename|endswith: '\ntds.dit'
  selection_process_parent:
        # Note: ParentImage is a custom field and is not available by default on Sysmon EID 11
    ParentImage|endswith:
    - '\cscript.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\w3wp.exe'
    - '\wscript.exe'
  selection_process_parent_path:
        # Note: ParentImage is a custom field and is not available by default on Sysmon EID 11
    ParentImage|contains:
    - '\apache'
    - '\tomcat'
    - '\AppData\'
    - '\Temp\'
    - '\Public\'
    - '\PerfLogs\'
  condition: selection_file and 1 of selection_process_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a file named "ntds.dit," which is the Active Directory Database file, by atypical parent processes or directories. An attacker aiming to compromise credential information would utilize this tactic as part of credential access, specifically targeting the database that contains user credentials. This behavior falls under the MITRE ATT&CK tactic of Credential Access and the technique T1003.003.

  Primary telemetry sources include Windows Event ID 11 from Sysmon, which must be enriched to include the `ParentImage` field, providing context about the process initiating the file creation. The security impact of malicious use is significant, as it may indicate an attacker is attempting to harvest stored credentials for escalation of privileges or lateral movement. Note that this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also result in similar file creations.

  ### Investigation Steps

  - **Identify suspect processes**: Search for Event ID 11 from Sysmon where `TargetFilename` ends with `ntds.dit`. Review the `ParentImage` field to identify if it matches any high-confidence malicious parent processes (e.g., `cscript.exe`, `nginx.exe`).

  - **Verify parent process legitimacy**: Check for the typical execution paths of the parent processes. For instance, legitimate `powershell.exe` processes would typically reside in `C:\Windows\System32\`. Any deviations (e.g., running from `\Temp\` or `\AppData\`) could indicate malicious intent.

  - **Correlate with known attacker TTPs**: Cross-reference findings against known tactics or techniques in the MITRE ATT&CK framework to identify if the use of `ntds.dit` creation aligns with documented attack patterns. Investigate links to recent vulnerabilities or exploit scenarios.

  - **Assess file access duration and location**: Investigate timestamps and access patterns for the `ntds.dit` file. Frequent access or creation in unusual directories (`\Public\`, `\Temp\`) combined with elevated privileges could indicate a hostile action.

  - **Document legitimate use cases**: Analyze the history of any expected legitimate uses for `ntds.dit` within your environment, such as authorized admins performing maintenance or backup tasks. Compare these logs against the suspicion timeline.

  - **Monitor for additional artifacts**: Validate for any associated files or processes that could indicate a broader campaign, such as PowerShell scripts or unusual HTTP traffic to servers (e.g., `httpd.exe`, `nginx.exe`) that might interact with `ntds.dit`.

  ### Prioritization

  This alert is of high priority due to the potential impact of an Active Directory compromise and the common weaponization of such actions by adversaries. Given the sensitive nature of the information within `ntds.dit`, the likelihood of malicious abuse is significant, especially if the parent process is uncommon or dangerous.

  ### Blind Spots and Assumptions

  Detection may be limited if there are gaps in Sysmon logging configurations, particularly the enrichment of the `ParentImage` field. Legitimate administrative automation or maintenance scripts may inadvertently trigger this alert when accessing `ntds.dit`. A related detection to enhance coverage includes monitoring for abnormal network connections or API calls made by the parent processes, particularly if external communication is observed alongside the creation of `ntds.dit`.

