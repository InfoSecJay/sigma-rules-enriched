title: NTDS.DIT Creation By Uncommon Parent Process
id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
related:
- id: 11b1ed55-154d-4e82-8ad7-83739298f720
  type: similar
status: test
description: Detects creation of a file named "ntds.dit" (Active Directory Database)
  by an uncommon parent process or directory
references:
- https://www.ired.team/offensive-security/credential-access-and-credential-dumping/ntds.dit-enumeration
- https://www.n00py.io/2022/03/manipulating-user-passwords-without-mimikatz/
- https://pentestlab.blog/tag/ntds-dit/
- https://github.com/samratashok/nishang/blob/414ee1104526d7057f9adaeee196d91ae447283e/Gather/Copy-VSS.ps1
author: Florian Roth (Nextron Systems)
date: 2022-03-11
modified: 2023-01-05
tags:
- attack.credential-access
- attack.t1003.003
logsource:
  product: windows
  category: file_event
  definition: 'Requirements: The "ParentImage" field is not available by default on
    EID 11 of Sysmon logs. To be able to use this rule to the full extent you need
    to enrich the log with additional ParentImage data'
detection:
  selection_file:
    TargetFilename|endswith: '\ntds.dit'
  selection_process_parent:
        # Note: ParentImage is a custom field and is not available by default on Sysmon EID 11
    ParentImage|endswith:
    - '\cscript.exe'
    - '\httpd.exe'
    - '\nginx.exe'
    - '\php-cgi.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\w3wp.exe'
    - '\wscript.exe'
  selection_process_parent_path:
        # Note: ParentImage is a custom field and is not available by default on Sysmon EID 11
    ParentImage|contains:
    - '\apache'
    - '\tomcat'
    - '\AppData\'
    - '\Temp\'
    - '\Public\'
    - '\PerfLogs\'
  condition: selection_file and 1 of selection_process_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of a file named "ntds.dit," which is the Active Directory database, by processes that are not common or expected to generate such files. The creation of this file can indicate malicious activities such as credential dumping or exploitation of Active Directory services, often by attackers aiming to gain elevated privileges or access sensitive user credentials within a network. An attacker may leverage custom scripts or web services to create or manipulate the Active Directory database as part of a broader attack strategy, including lateral movement or persistence.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Credential Access** (TA0032)
  - **Credential Dumping** (T1003.003) - specifically targeting techniques for accessing and dumping passwords from the NTDS.dit file.

  Primary data sources for effective detection include Windows file events, specifically Sysmon logs that document file creation actions, along with relevant process creation events that can provide context about the parent processes involved.

  ### Investigation Steps
  - **Review File Creation Events**: Investigate the logs for any file creation events that indicate the generation of "ntds.dit". Pay attention to the timestamp and associated user context to assess legitimacy.

  - **Analyze Parent Process Context**: Examine the parent processes that initiated the creation of "ntds.dit." Look for uncommon or suspicious parent processes such as `cscript.exe`, `httpd.exe`, or `powershell.exe`, which can indicate malicious activity.

  - **Check for Unusual Path Locations**: Validate the directories from which the "ntds.dit" file was created. If the file was created in unexpected locations such as `\AppData\`, `\Temp\`, or common web application directories like `\apache\`, it warrants deeper investigation.

  - **Correlate with Other Alerts**: Contextualize this detection with other security alerts or incidents within the environment. Determine if there are other indicators of compromise or associated suspicious activities around the time "ntds.dit" was created.

  ### Prioritization
  Given the potential impact of credential dumping on enterprise security, this alert should be treated with high priority. The likelihood of an attacker using this technique to gain unauthorized access or escalate privileges increases the urgency of the investigation.

  ### Blind Spots and Assumptions
  This rule may not detect all instances of "ntds.dit" creation, particularly if the logging infrastructure does not capture the ParentImage field or if attackers employ techniques to bypass detection. Additionally, the rule assumes that the parent processes involved are indeed uncommon or suspicious; legitimate applications may sometimes generate this file under specific circumstances. Proper Sysmon configurations are essential for enabling complete visibility into file creation events and their contexts.

