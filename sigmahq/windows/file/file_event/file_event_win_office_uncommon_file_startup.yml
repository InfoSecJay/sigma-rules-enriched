title: Uncommon File Created In Office Startup Folder
id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
status: test
description: Detects the creation of a file with an uncommon extension in an 
  Office application startup folder
references:
- https://app.any.run/tasks/d6fe6624-6ef8-485d-aa75-3d1bdda2a08c/
- http://addbalance.com/word/startup.htm
- https://answers.microsoft.com/en-us/msoffice/forum/all/document-in-word-startup-folder-doesnt-open-when/44ab0932-2917-4150-8cdc-2f2cf39e86f3
- https://en.wikipedia.org/wiki/List_of_Microsoft_Office_filename_extensions
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-05
modified: 2023-12-13
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  product: windows
  category: file_event
detection:
  selection_word_paths:
  - TargetFilename|contains: '\Microsoft\Word\STARTUP'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\STARTUP'
  filter_exclude_word_ext:
    TargetFilename|endswith:
    - '.docb'         # Word binary document introduced in Microsoft Office 2007
    - '.docm'         # Word macro-enabled document; same as docx, but may contain macros and scripts
    - '.docx'         # Word document
    - '.dotm'         # Word macro-enabled template; same as dotx, but may contain macros and scripts
    - '.mdb'         # MS Access DB
    - '.mdw'         # MS Access DB
    - '.pdf'         # PDF documents
    - '.wll'         # Word add-in
    - '.wwl'         # Word add-in
  selection_excel_paths:
  - TargetFilename|contains: '\Microsoft\Excel\XLSTART'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\XLSTART'
  filter_exclude_excel_ext:
    TargetFilename|endswith:
    - '.xll'
    - '.xls'
    - '.xlsm'
    - '.xlsx'
    - '.xlt'
    - '.xltm'
    - '.xlw'
  filter_main_office_click_to_run:
    Image|contains: ':\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_office_apps:
    Image|contains:
    - ':\Program Files\Microsoft Office\'
    - ':\Program Files (x86)\Microsoft Office\'
    Image|endswith:
    - '\winword.exe'
    - '\excel.exe'
  condition: ((selection_word_paths and not filter_exclude_word_ext) or 
    (selection_excel_paths and not filter_exclude_excel_ext)) and not 1 of 
    filter_main_*
falsepositives:
- False positive might stem from rare extensions used by other Office utilities.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with uncommon extensions in Microsoft Office startup folders, specifically Word's `STARTUP` and Excel's `XLSTART`. Attackers may leverage these folders to persist malicious payloads, as files placed here can execute silently upon opening a corresponding Office application. This behavior fits into the MITRE ATT&CK tactic of *Resource Development* (ID: T1587.001). Primary telemetry sources include Windows file event logs, particularly monitoring for Event ID 4663, which captures file creation attempts. If malicious, this could lead to unauthorized code execution or persistent access. However, this detection does NOT confirm that the file being created is indeed malicious—further investigation is necessary to establish intent.

  ### Investigation Steps

  - **Check file creation events:** Review Windows Security Event ID 4663 for entries indicating file creation in the `\Microsoft\Word\STARTUP` or `\Microsoft\Excel\XLSTART` directories. Look specifically for unusual extensions that do not match known Office file types (e.g., `.exe`, `.scr`).

  - **Analyze file anomalies:** Verify the created file's extension against a baseline list of common and valid document extensions for Office files. Legitimate activity generally shows extensions like `.docx`, `.xlsx`, or `.dotm`. Anything outside of this should raise suspicion.

  - **Determine the associated process:** Investigate process creation events (Event ID 4688 or Sysmon Event ID 1) that coincide with the file creation to establish which application initiated the action. Ensure that the relevant image paths are from legitimate Office executables (e.g., `winword.exe` or `excel.exe`).

  - **Assess the file behavior:** If the file can be accessed, review its content for potential malicious scripts or macros. For Word or Excel files, macros could be embedded within and executed automatically upon opening the application, suggesting further investigation is needed.

  - **Cross-reference with user behavior:** Validate whether the file creation aligns with normal user behavior. Look for recent access or use patterns of the involved applications by checking recent file access logs (e.g., Event ID 4663 for access events) and typical user workflows.

  - **Investigate prior related activity:** Check for prior events leading up to the alert (e.g., unusual logins or administrative actions) using Windows Security Event logs. Anomalous access patterns may indicate a larger breach or an initial access vector.

  ### Prioritization

  This alert should be viewed with high severity due to the potential impact on user systems and the likelihood of these tactics being exploited for malicious purposes. The nature of placing malicious files in startup folders is commonly weaponized in various attack campaigns, especially for persistent access.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion through legitimate applications that utilize uncommon extensions in Office environments. Additionally, if logs for file events are not configured properly, some activity may go undetected. Legitimate activities, such as internal training or specialized business tools utilizing uncommon extensions, may also trigger this rule. A related detection such as monitoring for unusual Office process executions (e.g., launcher processes from unexpected directories) could enhance overall coverage.

