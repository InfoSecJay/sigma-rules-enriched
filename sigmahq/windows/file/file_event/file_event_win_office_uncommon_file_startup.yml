title: Uncommon File Created In Office Startup Folder
id: a10a2c40-2c4d-49f8-b557-1a946bc55d9d
status: test
description: Detects the creation of a file with an uncommon extension in an Office
  application startup folder
references:
- https://app.any.run/tasks/d6fe6624-6ef8-485d-aa75-3d1bdda2a08c/
- http://addbalance.com/word/startup.htm
- https://answers.microsoft.com/en-us/msoffice/forum/all/document-in-word-startup-folder-doesnt-open-when/44ab0932-2917-4150-8cdc-2f2cf39e86f3
- https://en.wikipedia.org/wiki/List_of_Microsoft_Office_filename_extensions
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-05
modified: 2023-12-13
tags:
- attack.resource-development
- attack.t1587.001
logsource:
  product: windows
  category: file_event
detection:
  selection_word_paths:
  - TargetFilename|contains: '\Microsoft\Word\STARTUP'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\STARTUP'
  filter_exclude_word_ext:
    TargetFilename|endswith:
    - '.docb'         # Word binary document introduced in Microsoft Office 2007
    - '.docm'         # Word macro-enabled document; same as docx, but may contain macros and scripts
    - '.docx'         # Word document
    - '.dotm'         # Word macro-enabled template; same as dotx, but may contain macros and scripts
    - '.mdb'         # MS Access DB
    - '.mdw'         # MS Access DB
    - '.pdf'         # PDF documents
    - '.wll'         # Word add-in
    - '.wwl'         # Word add-in
  selection_excel_paths:
  - TargetFilename|contains: '\Microsoft\Excel\XLSTART'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\XLSTART'
  filter_exclude_excel_ext:
    TargetFilename|endswith:
    - '.xll'
    - '.xls'
    - '.xlsm'
    - '.xlsx'
    - '.xlt'
    - '.xltm'
    - '.xlw'
  filter_main_office_click_to_run:
    Image|contains: ':\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_office_apps:
    Image|contains:
    - ':\Program Files\Microsoft Office\'
    - ':\Program Files (x86)\Microsoft Office\'
    Image|endswith:
    - '\winword.exe'
    - '\excel.exe'
  condition: ((selection_word_paths and not filter_exclude_word_ext) or (selection_excel_paths
    and not filter_exclude_excel_ext)) and not 1 of filter_main_*
falsepositives:
- False positive might stem from rare extensions used by other Office utilities.
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify the creation of files with uncommon extensions in the Microsoft Office startup folders, specifically for Word and Excel applications. An attacker might exploit these folders to execute malicious scripts or payloads each time the application starts, potentially leading to persistent compromises or the execution of malware. The threat scenario typically involves an attacker aiming to establish backdoor access or deliver malicious content using trusted applications to evade detection.

  Relevantly, this detection aligns with the MITRE ATT&CK tactics and techniques such as **Resource Development** (T1587) and specifically addresses the development of malicious resources in applications that users regularly interact with. Monitoring unusual file creations in startup folders can highlight attempts to misuse Office applications for nefarious purposes.

  The primary data sources for detecting these events include Windows file event logs tracking file creations in the specified startup directories, highlighting potentially malicious file patterns in trusted application locations (e.g., `C:\Program Files\Microsoft Office\...`).

  ### Investigation Steps
  - **Review File Creation Events**: Examine the file creation events from the Windows file event logs to identify specific file names and extensions created in the Office startup directories. Pay attention to extensions that are not typically associated with Word or Excel.

  - **Correlate with User Activity**: Analyze user activity logs to determine if there were any unusual logins or activity patterns at the times these files were created. This could include checking for anomalous user behaviors or unexpected application launches.

  - **Inspect Startup Folder Contents**: Investigate the contents of the Office startup folders and compare them against known safe file extensions. Identify any discrepancies or unfamiliar files, especially those that may carry unusual extensions.

  - **Evaluate Application Execution**: Monitor the execution of Microsoft Office applications (e.g., `winword.exe`, `excel.exe`) following the detection of unusual files. Check for any abnormal command-line arguments or suspicious behavior that could indicate exploitation or script running.

  ### Prioritization
  The alert warrants high severity due to the potential risk of persistent malware execution through trusted applications, which is a common tactic used by attackers to maintain a foothold in the environment. Given the prevalence of Office applications in business workflows, the likelihood of encountering such threats is significant.

  ### Blind Spots and Assumptions
  Detective coverage may be limited if not all relevant file event logs are configured to be captured, particularly in environments with restricted logging. The detection logic assumes that files with rare extensions in Office startup folders are malicious; however, this may lead to false positives if similar legitimate tools or rare extensions are used by corporate applications. Successful detection requires comprehensive logging settings for file creations and in-depth monitoring of the Office startup folder activities.

