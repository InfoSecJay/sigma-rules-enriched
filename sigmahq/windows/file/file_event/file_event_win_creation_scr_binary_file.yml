logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: '.scr'
  filter_generic:
    Image|endswith:
    - '\Kindle.exe'
    - '\Bin\ccSvcHst.exe'         # Symantec Endpoint Protection
  filter_tiworker:
        # ParentCommandLine: C:\WINDOWS\system32\svchost.exe -k DcomLaunch -p
    Image|endswith: '\TiWorker.exe'
    TargetFilename|endswith: '\uwfservicingscr.scr'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the creation of binary files with a .scr extension, which are screensavers that can be executed when a user is inactive. This behavior may indicate an adversary attempting to establish persistence on the system through malicious screensaver files that execute under the guise of legitimate processes. The likely objective is to maintain control of the compromised environment even after the user becomes active again.

  The relevant MITRE ATT&CK technique is "Screensaver" (T1546.002), which falls under the tactics of "Persistence" and "Privilege Escalation." The primary telemetry source for this detection is Windows file event logs capturing file creation activities. If malicious, this behavior could lead to unauthorised access or control over the system. However, this detection does NOT confirm actual execution of the malicious screensaver or the impact of its behavior without further contextual analysis.

  ---

  ### Investigation Steps

  - **Review file creation events:**
    Check for Windows File Creation Event ID 4663 for any .scr files, focusing on the `TargetFilename` field to identify potential malicious screensaver binary files.

  - **Identify source process:**
    Investigate the creation of the .scr files to determine the originating process. Look for Event ID 4688 (Process Creation) related to the creation of the suspicious .scr file and check the `ParentImage` and `ProcessCommandLine` fields.

  - **Analyze logs for benign behavior:**
    Confirm legitimate screensavers in use by reviewing company policy on screensaver settings. If common screensavers are found, validate with Event ID 4663 for authorized execution times.

  - **Cross-reference with related processes:**
    Look for Event ID 4688 indicating the execution of common legitimate processes (like `svchost.exe`) that could serve as a parent process before the screensaver creation. This can provide context on expected behavior.

  - **Check file attributes and integrity:**
    Inspect properties of the created .scr files via file system logs to detect anomalies—suspicious timestamps, unexpected file sizes, or digital signatures that do not match authorized screensavers.

  - **Evaluate environment-specific context:**
    Consider the role of the affected host (e.g., user workstation vs. server) and assess criticality. If the host is a domain controller or a sensitive system, treat this alert with higher priority for immediate investigation.

  ---

  ### Prioritization

  This alert has medium severity, as it indicates a potential persistence mechanism used by attackers. Given that screensavers are often benign, the likelihood of misuse, especially on critical systems, warrants prompt investigation, especially since this tactic is a recognized persistence method commonly utilized by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by potential evasion techniques where an adversary uses file renaming or changes file extensions to avoid detection. Also, reliable detection requires proper logging configurations, specifically enabling both file creation and process creation logs. Legitimate users may accidentally trigger this alert when using authorized screensavers, particularly customized ones. Companion detections may include alerts for unusual process executions related to screensaver triggering or elevated permissions being requested by screensaver files.

