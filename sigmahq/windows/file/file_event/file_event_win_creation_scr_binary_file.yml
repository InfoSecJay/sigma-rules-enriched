title: Suspicious Screensaver Binary File Creation
id: 97aa2e88-555c-450d-85a6-229bcd87efb8
status: test
description: |
  Adversaries may establish persistence by executing malicious content triggered by user inactivity.
  Screensavers are programs that execute after a configurable time of user inactivity and consist of Portable Executable (PE) files with a .scr file extension
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1546.002/T1546.002.md
author: frack113
date: 2021-12-29
modified: 2022-11-08
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.002
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: '.scr'
  filter_generic:
    Image|endswith:
    - '\Kindle.exe'
    - '\Bin\ccSvcHst.exe'         # Symantec Endpoint Protection
  filter_tiworker:
        # ParentCommandLine: C:\WINDOWS\system32\svchost.exe -k DcomLaunch -p
    Image|endswith: '\TiWorker.exe'
    TargetFilename|endswith: '\uwfservicingscr.scr'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of suspicious screensaver binary files with a `.scr` extension on Windows systems, which may indicate an adversary's attempt to establish persistence through malicious screensaver executables. In a typical scenario, an attacker may leverage this technique following initial access to the system, using screensavers to execute their payload when the user is inactive, thereby remaining undetected. The threat may target users who often leave their systems unattended, leading to potential data exfiltration or further compromise.

  The relevant MITRE ATT&CK tactics associated with this rule are **Persistence** (TA0003) and **Privilege Escalation** (TA0004), specifically technique **T1546.002 - Screensaver**. By deploying malicious `.scr` files, attackers not only ensure their code runs without user interaction but also potentially gain elevated privileges depending on how the screensaver is configured and launched.

  Primary data sources for this detection include file event logs that provide evidence of newly created files, notably looking for executables in the `.scr` format, system event logs that might capture information about process execution, and potentially user activity logs to correlate inactivity moments with screensaver initiations.

  ### Investigation Steps
  - **Review File Event Logs**: Collect logs pertaining to file creation events, specifically filtering for entries indicating newly created files with the `.scr` extension on Windows systems for unusual timestamps or unauthorized paths.
  - **Analyze Process Creation Events**: Examine process creation logs for any instances of typical screensaver files being initiated, especially focusing on parent processes that may indicate a malicious origin, such as unauthorized user-initiated commands or Windows services.
  - **Check User Activity Logs**: Correlate user activity logs to identify periods of inactivity to determine if a screensaver was triggered, and if so, identify the associated `.scr` file to assess its legitimacy.
  - **Validate File Signed Status**: For any detected `.scr` files, validate the file signatures against known-good lists to determine if the file is signed by a legitimate publisher or if it is unsigned or signed by a suspicious entity.

  ### Prioritization
  The severity of this alert is considered medium due to the potential for persistence and the associated risk of privilege escalation. In an enterprise environment, malicious screensaver files can provide attackers with a foothold, making timely investigation critical to prevent further compromises.

  ### Blind Spots and Assumptions
  Detection logic may not account for legitimate `.scr` files that are installed as part of authorized software packages, leading to potential false positives. Additionally, if file event logging is not adequately configured or if permissions for writing `.scr` files are restricted, this alert may not trigger as expected. The assumption is made that file event logging is enabled and monitoring for file creations on Windows systems is adequately captured for the alert to function effectively.

