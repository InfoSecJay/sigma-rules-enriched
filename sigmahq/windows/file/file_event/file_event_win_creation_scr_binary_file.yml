logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: '.scr'
  filter_generic:
    Image|endswith:
    - '\Kindle.exe'
    - '\Bin\ccSvcHst.exe'         # Symantec Endpoint Protection
  filter_tiworker:
        # ParentCommandLine: C:\WINDOWS\system32\svchost.exe -k DcomLaunch -p
    Image|endswith: '\TiWorker.exe'
    TargetFilename|endswith: '\uwfservicingscr.scr'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious screensaver (.scr) files on Windows systems, which adversaries may use to establish persistence through malicious processes triggered by user inactivity. The likely objective of this behavior is to execute payloads or scripts without user awareness. This detection is linked to the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Indicator of Compromise (T1546.002). The primary telemetry source is file event logs on Windows systems, specifically tracking the creation of executable screensaver files.

  If malicious, this behavior can allow an attacker to run arbitrary code with the privileges of a logged-in user, thereby compromising the system. However, this detection does NOT confirm that the detected screensaver file is malicious on its own; further analysis is necessary to establish intent and behavior.

  ### Investigation Steps

  - **Review file creation logs:** Investigate Windows file creation events (Security Event ID 4663 or Sysmon Event ID 11) focusing on the paths where .scr files were detected. Note timestamps and user context to determine if the creation coincided with user inactivity.

  - **Check process parent-child relationships:** Use Sysmon Event ID 1 to examine the process tree for the creation of the screensaver file. Identify if the parent process is legitimate (e.g., svchost.exe) or if it is unusual or potentially malicious.

  - **Analyze the content of the .scr file:** If possible, inspect the suspicious screensaver file in a sandbox environment to identify any malicious behavior or embedded payloads. Look for indicators of compromise such as network connections or malicious API calls.

  - **Determine expected behavior in the environment:** Verify if the observed screensaver files are part of an organized IT policy. For example, enterprise environments may have pre-approved screensaver configurations, while any unsanctioned .scr file should be treated with suspicion.

  - **Identify known benign .scr files:** Cross-reference the detected screensaver file against known benign files within the organization, such as those related to internal applications or software, to validate if it could be legitimate.

  - **Check for evasion techniques:** Be aware of potential evasion techniques such as altering the executable's signatures or using obfuscation methods, which may allow an otherwise benign process to be weaponized.

  ### Prioritization

  This alert should be treated with medium severity as it relates to persistence mechanisms commonly leveraged by attackers. The impact may vary depending on the system role; for instance, on critical systems, a malicious screensaver can lead to a severe compromise. Given the nature of persistence tactics, proactive investigation is essential.

  ### Blind Spots and Assumptions

  This detection may fail to capture legitimate screensaver setups if they are misconfigured or if custom scripts generated by internal tools inadvertently create .scr files. Reliable detection requires that Windows file event logging is properly enabled and configured. Additionally, this behavior might be triggered by legitimate administrative activities or third-party software with screensaver functionalities. Related detections might include monitoring for abnormal process creations linked to common persistence techniques (e.g., Task Scheduler events).

