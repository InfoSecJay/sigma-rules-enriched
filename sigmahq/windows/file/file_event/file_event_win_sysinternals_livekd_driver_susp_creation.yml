note: |
  ### Technical Context

  This Sigma rule detects the creation of the LiveKD driver (LiveKdD.SYS) by any process that does not originate from the expected executables, "livekd.exe" or "livek64.exe." This behavior suggests an attempt by an attacker to utilize or manipulate this driver for purposes such as evading detection or escalating privileges, as the LiveKD tool is commonly used for memory analysis and debugging in a live environment. Relevant MITRE ATT&CK tactics include Defense Evasion (T1562) and Privilege Escalation (T1068).

  The primary telemetry sources are Windows file event logs that capture driver creation activities, specifically Monitoring Event IDs related to file access or creation (e.g., Event ID 4663) in combination with details from Process Creation logs (Event ID 4688). If malicious, the impact could involve unauthorized access or control over system processes. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate system administrators may also utilize LiveKD under sanctioned conditions.

  ### Investigation Steps

  - **Verify process initiation:** Check for Event ID 4688 logs showing the creation of processes that lead to the creation of LiveKdD.SYS. Look for any suspicious parent processes that initiated these executions.

  - **Correlate with expected behavior:** Confirm if processes related to LiveKD are usually executed from paths containing "livekd.exe" or "livek64.exe." This can help in distinguishing legitimate usage from potential misuse.

  - **Check for anomalies:** Review the Event ID 4663 logs for the creation of 'C:\Windows\System32\drivers\LiveKdD.SYS' and verify if the parent process is anything other than expected LiveKD executables. Flag any unexpected parent process as a potential indicator of compromise.

  - **Assess modification history:** Analyze Security Event ID 5145 on object access logs, particularly for any modifications or creations that align with the timeline of the driver creation. This can reveal suspicious access patterns.

  - **Identify high-confidence indicators:** Look for processes that are launching 'LiveKdD.SYS' without signed LiveKD binaries. Monitoring for unusual signatures or hashes can indicate tampering and malicious intentions.

  ### Prioritization

  This alert should be prioritized as high severity due to the sensitive impact of the affected system—specifically, the potential for unauthorized privilege escalation. Given that the behavior is uncommon and could be weaponized by attackers, swift investigation and containment are critical.

  ### Blind Spots and Assumptions

  Detection may be limited by adversaries using techniques such as process masquerading or renaming the LiveKD executable. Reliable detection requires that adequate logging is configured to capture both file events and process creation meticulously. Be aware that legitimate administrative actions may also trigger this alert, particularly during system diagnostics or updates. Consider companion detections that track process creation alongside file changes for improved context and coverage.

