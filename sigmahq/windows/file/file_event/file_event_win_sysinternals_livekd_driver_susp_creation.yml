note: |
  ### Technical Context

  This rule detects the creation of the LiveKD driver (LiveKdD.SYS) by a process other than the expected legitimate executable files (livekd.exe or livek64.exe). Attackers may use LiveKD to escalate privileges stealthily, allowing them to access and manipulate the system memory without detection, which aligns with the MITRE ATT&CK tactic of Privilege Escalation (T1068) and the technique of Application Layer Protocol (T1071). The primary telemetry source is Windows file event logs, particularly those that capture changes in the driver directory. If this behavior is determined to be malicious, it could lead to significant compromise of system integrity and confidentiality. Importantly, this detection does not confirm malicious intent on its own, as legitimate administrative activities could also produce this alert.

  ### Investigation Steps

  - **Check process attribution:** Investigate the process creating LiveKdD.SYS using Security Event ID 4688 (Process Creation) or Sysmon Event ID 1. Identify if the creating process is a legitimate application or an unknown executable. Look for common process names associated with administrative tasks.

  - **Inspect the path of the creating process:** Verify the full file path of the process that initiated the driver creation. Legitimate processes should originate from `%SystemRoot%` or other authorized system directories, while any processes from unusual paths or temporary directories may indicate malicious activity.

  - **Determine file creation timestamps:** Review the creation time of LiveKdD.SYS in the Windows File System logs (Event ID 4663) to correlate with other suspicious activities (e.g., unusual user logins, privilege escalation attempts) occurring at that time.

  - **Review for known filters:** Check if there are additional filters from custom administrative processes or tools that could lead to this alert generation, especially variations of livekd.exe used by administrators. Document any such processes for tuning the rule as necessary.

  - **Assess user privileges:** Investigate the user context in Security Event ID 4624 (Logon) related to the process that created the driver. Note any administrative logins that coincide with the time of driver creation to assess legitimacy.

  ### Prioritization

  This alert is classified as high severity due to the potential impact of privilege escalation within the enterprise. The likelihood of misuse is elevated given that the LiveKD driver is commonly used in malicious activities to hide or manipulate processes. This specific behavior is not typical for legitimate administrative tasks, making it an important alert to investigate promptly.

  ### Blind Spots and Assumptions

  The detection may be limited in environments where administrators rename LiveKD to obscure its usage, leading to potential false negatives. Reliable detection requires active monitoring of file events in the drivers directory and a comprehensive understanding of all approved administrative tools in use. Legitimate administrative tasks, such as installing updates or system maintenance, may trigger this alert. Companion detections, such as monitoring for unusual process creation patterns or privilege elevation events, can enhance coverage and alert accuracy.

