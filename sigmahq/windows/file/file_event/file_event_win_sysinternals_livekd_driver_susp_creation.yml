note: |
  ### Technical Context
  This rule detects the creation of the LiveKD driver, specifically the file `LiveKdD.SYS`, initiated by processes that are not the legitimate `livekd.exe` or `livek64.exe`. LiveKD is a tool often used by attackers to run live kernel debugging and can be misused for malicious purposes, including evading detection by security solutions or gaining higher-level privileges. By monitoring the initiation of this driver by unconventional processes, this rule aims to identify potential misuse indicative of a malicious actor attempting to manipulate kernel-level operations or exploit the system.

  The primary threat scenario involves an attacker who has managed to gain access to a system and is attempting to escalate privileges or evade defenses through the use of kernel-mode drivers. This behavior aligns with the MITRE ATT&CK techniques for Defense Evasion (T1211) and Privilege Escalation (T1068). The investigation of such alerts could reveal efforts to establish persistence or gain control over sensitive operations on the affected machine.

  Primary data sources for this detection include Windows file event logs, which can capture the creation of files and their associated metadata. Assessing file creation events alongside process creation events will provide a comprehensive view of the actions taken when the driver is initiated.

  ### Investigation Steps
  - **Review File Creation Events:** Check Windows file event logs for the creation of `C:\Windows\System32\drivers\LiveKdD.SYS`, noting the associated process that initiated this event.
  - **Analyze Process Creation Logs:** Investigate process creation logs leading up to the file creation event to identify any unfamiliar processes that may have executed before `LiveKdD.SYS` was created.
  - **Correlate with User Activity:** Determine if the processes or associated user accounts exhibit any suspicious behavior or patterns that deviate from normal usage. Look for unusual login times or locations.
  - **Check for Known Renaming Practices:** Consider any legitimate use cases where administrators may rename `livekd.exe`. Review your environment's relevant documentation to ensure no false positives when the driver is invoked legitimately.

  ### Prioritization
  This alert is considered high priority due to the significant impact of potential kernel-level manipulation on an enterprise environment. The likelihood of misuse by attackers seeking to escalate privileges or evade detection increases the necessity for timely investigation and response.

  ### Blind Spots and Assumptions
  A potential blind spot in this detection is the possibility that legitimate processes may also create the driver under certain conditions, leading to false positives. The rule assumes that the initiator of the driver would not be a standard or recognized process, which may not account for all legitimate use cases in the organization. Moreover, the detection's efficacy relies on the availability of comprehensive file event logging; any inadequate logging configuration may hinder the rule's performance.

