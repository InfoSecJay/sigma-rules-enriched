note: |
  ### Technical Context
  This detection rule identifies the creation or modification of a Visual Studio Code (VSCode) Powershell profile (`Microsoft.VSCode_profile.ps1`), which can signify potential malicious activity. Attackers might leverage such profile modifications as a means of persistence, enabling them to execute their code or scripts automatically when Powershell is launched within the VSCode environment. By modifying the Powershell profile, an attacker can ensure their malicious commands run each time an authorized user starts a Powershell session, thus maintaining their foothold in the system.

  The relevant MITRE ATT&CK tactics include **Persistence (T1546)**, specifically **T1546.013: Windows Management Instrumentation (WMI) Event Subscription**, as attackers can utilize profile scripts to establish persistent mechanisms in the target environment. Additionally, such modifications can potentially relate to **Privilege Escalation (T1068)**, if the attacker gains elevated permissions through such configurations.

  Primary data sources for this detection will be file event logs from Windows systems that capture file creations and modifications, particularly within user profile directories associated with VSCode.

  ### Investigation Steps
  - **Review File Event Logs**: Examine file event logs for any newly created or modified entries for the `Microsoft.VSCode_profile.ps1` file, focusing on timestamps and user accounts involved.
  - **Correlate User Activity**: Investigate the user behavior prior to the file modification to understand the context of any legitimate activities and potential unauthorized access indicators.
  - **Examine Powershell History**: Check the Powershell command history (`Get-History`) to uncover any suspicious commands that may have been executed by the user prior to the profile modifications.
  - **Analyze VSCode Extensions**: Investigate installed extensions in VSCode, as malicious extensions can exploit the environment, resulting in unauthorized profile modifications or unwanted behavior.

  ### Prioritization
  The alert is classified as medium priority due to the potential impact that unauthorized persistence mechanisms can have on an enterprise environment. Although legitimate use cases exist, the likelihood of attackers targeting developers and system administrators for privilege escalation remains significant.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the reliance on file event logs, which may not capture deletions of the profile or modifications made outside of typical file transaction events. The detection logic assumes that an unauthorized modification indicates malicious intent, which may not account for legitimate development activities. For the alert to function effectively, all relevant logging levels must be configured to capture file events, especially within user directories for applications like VSCode.

