title: Potential Persistence Via Microsoft Office Add-In
id: 8e1cb247-6cf6-42fa-b440-3f27d57e9936
status: test
description: Detects potential persistence activity via startup add-ins that load
  when Microsoft Office starts (.wll/.xll are simply .dll fit for Word or Excel).
references:
- Internal Research
- https://labs.withsecure.com/publications/add-in-opportunities-for-office-persistence
- https://github.com/redcanaryco/atomic-red-team/blob/4ae9580a1a8772db87a1b6cdb0d03e5af231e966/atomics/T1137.006/T1137.006.md
author: NVISO
date: 2020-05-11
modified: 2023-02-08
tags:
- attack.persistence
- attack.t1137.006
logsource:
  category: file_event
  product: windows
detection:
  selection_wlldropped:
    TargetFilename|contains: '\Microsoft\Word\Startup\'
    TargetFilename|endswith: '.wll'
  selection_xlldropped:
    TargetFilename|contains: '\Microsoft\Excel\Startup\'
    TargetFilename|endswith: '.xll'
  selection_xladropped:
    TargetFilename|contains: 'Microsoft\Excel\XLSTART\'
    TargetFilename|endswith: '.xlam'
  selection_generic:
    TargetFilename|contains: '\Microsoft\Addins\'
    TargetFilename|endswith:
    - '.xlam'
    - '.xla'
    - '.ppam'
  condition: 1 of selection_*
falsepositives:
- Legitimate add-ins
level: high
note: |
  ### Technical Context
  This detection rule identifies persistent threat behaviors in Microsoft Office applications through the implementation of malicious or unauthorized add-ins. Attackers often leverage file types such as `.wll`, `.xll`, or `.xlam` to establish persistence on compromised systems. These add-ins can execute arbitrary code upon application startup, enabling attackers to maintain a presence in the environment, exfiltrate data, or perform other malicious activities without user knowledge.

  The primary objectives for attackers employing such tactics typically involve creating backdoors or implementing functionality to continuously access the system and enable further attacks. As they can operate without user initiation, these add-ins can evade traditional detection methods and provide a low-risk factor for the attacker. The relevant MITRE ATT&CK tactics and techniques involved here are **Persistence** (TA0003) and **Application Layer Protocol** (T1137.006).

  To effectively detect these activities, the primary log sources include file event logs on Windows systems, specifically monitoring for file creations or modifications within the Microsoft Office Startup directories.

  ### Investigation Steps
  - **Review File Creation Logs:** Analyze file event logs for suspicious creations, modifications, or deletions in the Microsoft Office Startup directories and within the Microsoft\Addins folder.
  - **Examine Add-In Types:** Focus on specific file extensions like `.wll`, `.xll`, `.xlam`, and `.ppam` to identify any unknown or unexpected add-ins that may signify malicious intent.
  - **Assess Application Behavior:** Investigate the behavior of the Office applications to check for any unusual activities after the loading of the add-ins, such as unexpected network connections or command executions.
  - **Correlate with User Activity:** Cross-reference identified suspicious add-ins with user activity logs to determine if the add-ins were authorized or if they were deployed without explicit user consent.

  ### Prioritization
  This alert carries a high severity level because the exploitation of add-ins for persistence can lead to significant risks, including unauthorized access to sensitive information, lateral movement within the network, and potential data exfiltration, which could have extensive organizational impacts.

  ### Blind Spots and Assumptions
  Detection coverage may be limited for environments where logging is not sufficiently enabled for file events or where users regularly utilize or install legitimate add-ins without oversight. The detection logic assumes proper logging configuration is in place for all relevant Microsoft Office directories, and it does not differentiate between legitimate and malicious add-ins, which could lead to false positives during normal operational usage. Required log configurations should include detailed file auditing to capture these events comprehensively.

