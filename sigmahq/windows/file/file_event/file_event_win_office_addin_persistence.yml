  ---

  ### Technical Context

  This Sigma rule detects the creation of potentially malicious Microsoft Office add-ins (.wll, .xll, .xlam) that can establish persistence by loading automatically when Word or Excel starts. Attackers may exploit this behavior to ensure their malicious code executes without user intervention, thereby maintaining access to the system. The relevant MITRE ATT&CK tactic is Persistence, specifically the technique ID T1137.006.

  The primary telemetry source for this detection is file event logs on Windows systems, with a focus on the creation of files in the Microsoft Office startup directories. If malicious, this activity can lead to unauthorized control over the system, data exfiltration, or further lateral movement within the network. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate add-ins also create files in these locations.

  ---

  ### Investigation Steps

  - **Review Event Log Entries:** Check Windows Security Event ID 4663 (Access to an object) for file creations in the directories associated with Microsoft Office startup: `\Microsoft\Word\Startup\`, `\Microsoft\Excel\Startup\`, and `\Microsoft\Addins\`. Compare against known legitimate add-ins.

  - **Validate File Properties:** Inspect recently created add-ins for unusual properties or digital signatures. Malicious add-ins often have absent or suspicious signatures. Look for unusual timestamps that could indicate anomalous activity.

  - **Identify Startup Executables:** Use Sysmon Event ID 1 (Process Creation) to trace the execution of the detected add-in files. Check if any suspicious executables were spawned from Word or Excel that correspond to the timestamps of the add-in creation.

  - **Analyze User Context:** Identify the user account that created or executed the add-in. Assess whether this account has a legitimate business need for using these add-ins. Check if the user has prior engagements that align with the add-ins in question.

  - **Benchmark Legitimate Behavior:** Document typical legitimate add-ins in the organization. This may include standardized templates or utility tools used for operations. Compare against the suspicious files for context.

  - **Assess Host Role and Environment Context:** Determine if the affected system hosts critical applications or sensitive data. Prioritize investigation on endpoints with high-impact roles like finance, HR, or R&D.

  ---

  ### Prioritization

  This alert should be classified as high severity due to the potential for establishing persistence on critical systems. The likelihood of abuse is high, particularly if the organization utilizes Microsoft Office applications extensively. Moreover, this method of maintaining access has been weaponized in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Limitations include the possibility of benign add-ins being flagged, particularly those that are internally developed or widely used. Reliable detection requires comprehensive logging configurations, including Windows file system auditing. Furthermore, legitimate software installations may create similar artifacts, necessitating a thorough review process. Companion detections, such as monitoring for unusual process executions from Office applications, can enhance the overall security posture.

