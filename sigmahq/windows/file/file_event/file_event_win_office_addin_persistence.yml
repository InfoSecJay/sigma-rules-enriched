note: |
  ### Technical Context

  This rule detects the presence of potentially malicious add-ins in Microsoft Office applications, specifically .wll, .xll, and .xlam files that are dropped in the Startup directories or Add-ins folder. Attackers may leverage these add-ins for persistence, allowing malicious code to execute automatically when an Office application is launched, which can facilitate long-term exploitation of a compromised system. The relevant MITRE ATT&CK tactic is **Persistence** and the technique is **T1137.006: Office Add-ins**.

  The primary telemetry sources involve file creation events, specifically monitoring file paths related to Microsoft Office Startup and Add-ins directories. If such files are malicious, they can lead to unauthorized access, data exfiltration, or further lateral movement within the network. It is essential to note that the detection of these file types does NOT confirm malicious intent without further context, as legitimate add-ins are common in organizational environments.

  ### Investigation Steps

  - **Identify the add-ins involved: ** Review file paths under `C:\Program Files\Microsoft Office\root\OfficeXX\STARTUP\` for .wll and .xll files, and `C:\Users\<Username>\AppData\Roaming\Microsoft\Word\STARTUP\` for .wll files. Verify if they match known benign add-ins listed in your organization’s inventory.

  - **Cross-reference with known malicious actors:** Check the file names and hashes against threat intelligence sources. Utilize additional logs or threat databases to determine if the detected files have been previously reported as malicious.

  - **Assess the execution context: ** Analyze the Windows Event ID 4688 (Process Creation) for Microsoft Office startup processes during the time when these files were created. Look for unusual parent processes, such as command line tools or scripts that are not typical for Office applications.

  - **Evaluate localized and expected behavior:** Confirm legitimate usage patterns. For example, if users report having installed add-ins, check if their behavior aligns with documented procedures for adding new functionality in Office apps.

  - **Review user activity logs:** Look for login activities (Event ID 4624) or abnormal application usage of Microsoft Office that correlates with the timeline of the add-in creation. This can help discern if the add-in activity occurred in a typical work context.

  - **Document file properties for digital forensics:** Gather details about the detected files including timestamps, file size, and digital signatures (if available). Use tools like Sysinternals' `sigcheck` to validate the authenticity of file creators.

  ### Prioritization

  This alert should be treated as high severity due to the potential security implications of unauthorized persistence mechanisms within popular office software. The likelihood of abuse is moderate to high, as adversaries are known to exploit Office add-ins for stealth and persistence, making it a common target.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate users adding secure add-ins; thus, exceptions for known software should be documented and verified. Ensuring comprehensive logging at all Office application initiation points is required for reliable detection. Activities like IT department sanctioned custom add-ins may also trigger this alert; thus, verification is critical. A related detection to consider is monitoring for abnormal Office macro execution (T1203), which may accompany malicious add-in activity, strengthening coverage against misuse.

