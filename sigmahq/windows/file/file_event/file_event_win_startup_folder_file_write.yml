logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\Microsoft\Windows\Start Menu\Programs\StartUp'
  filter_main_update:
  - Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\uus\ARM64\wuaucltcore.exe'
  - TargetFilename|startswith:
    - 'C:\$WINDOWS.~BT\NewOS\'
    - 'C:\$WinREAgent\Scratch\Mount\'
  filter_optional_onenote:
    Image|endswith: '\ONENOTE.EXE'
    TargetFilename|endswith: '\Send to OneNote.lnk'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- FP could be caused by legitimate application writing shortcuts for example. 
  This folder should always be inspected to make sure that all the files in 
  there are legitimate
level: medium
note: |
  ### Technical Context

  This Sigma rule detects file write activities in the Windows startup directory, specifically targeting the Microsoft Windows Start Menu Programs Startup path. This behavior is often associated with an adversary's objective to establish persistence on a compromised system, allowing them to execute malicious payloads during system boot. Relevant MITRE ATT&CK tactics include Persistence (TA0002) with the technique T1547.001 (Registry Run Keys / Startup Folder).

  Primary telemetry sources include file event logs, specifically targeting Windows filesystem events related to file creation in the startup folder. If the detected behavior is malicious, the security impact could range from unauthorized remote access to further exploits on the system. It is crucial to note that detection of file writes alone does not confirm malicious intent, as legitimate applications may also write to this directory.

  ### Investigation Steps

  - **Identify files written to the startup folder**: Check for new entries in the startup directory at `C:\Users\<USERNAME>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup` using File Event logs (Event ID 4663). Verify file names and creation timestamps to determine legitimacy.

  - **Analyze the process responsible for file writes**: Review the process event logs associated with the file creations, specifically looking for Event ID 4688 (Process Creation) to identify the Image (execution path). Confirm whether the process is known (e.g., legitimate executables like `ONENOTE.EXE` or `wuauclt.exe`) or malicious.

  - **Check for known malicious file signatures**: Cross-reference newly created files against threat intelligence databases or known malware file hashes. Use your Threat Intelligence Platform (TIP) for quick lookups.

  - **Review typical legitimate activity**: Confirm acceptable files that might be created by known software that legitimately uses the startup folder. Examples include shortcuts created by applications or installers.

  - **Assess system context**: Identify the role of the affected host (e.g., workstation vs. server). Evaluate potential impact based on systems that manage critical data or user access.

  ### Prioritization

  The alert severity is medium based on the potential impact of a successful persistence mechanism. The affected system being compromised could enable further attacks, increasing risk exposure. This behavior is common in many adversarial campaigns, especially those seeking long-term access.

  ### Blind Spots and Assumptions

  Detection may be limited by benign legitimate activities, such as legitimate applications writing to the startup folder. Ensure comprehensive logging of file events is enabled on all endpoints to maximize visibility. This rule could be complemented by monitoring execution of processes that have written files into this folder to enhance detection accuracy and context.

