logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\Microsoft\Windows\Start Menu\Programs\StartUp'
  filter_main_update:
  - Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\uus\ARM64\wuaucltcore.exe'
  - TargetFilename|startswith:
    - 'C:\$WINDOWS.~BT\NewOS\'
    - 'C:\$WinREAgent\Scratch\Mount\'
  filter_optional_onenote:
    Image|endswith: '\ONENOTE.EXE'
    TargetFilename|endswith: '\Send to OneNote.lnk'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- FP could be caused by legitimate application writing shortcuts for example. This
  folder should always be inspected to make sure that all the files in there are legitimate
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of files in the Windows startup directory, which is commonly associated with persistence mechanisms utilized by attackers. The presence of files in this directory may indicate that an attacker has established or attempted to establish persistence on a compromised system, allowing malicious code to run automatically upon system startup. This behavior could be part of a larger attack strategy aiming to maintain access to the compromised environment or reinstall malware after it's been removed.

  The likely attacker objectives in this scenario are to ensure that their payload is executed every time the device boots, thereby reinforcing their foothold within the targeted network. This detection aligns with the MITRE ATT&CK tactics of **Persistence (TA0003)** and **Privilege Escalation (TA0004)**, specifically leveraging the technique **T1547.001 - Registry Run Keys / Startup Folder**, which focuses on the creation of malicious entries in user startup folders.

  Primary data sources for this detection include **file event logs** that track file creation activities, providing direct evidence of any files written to the startup folder, as well as **process creation logs** that can help correlate any suspicious activity with specific applications that may be executing those actions.

  ### Investigation Steps
  - **Review File Event Logs:** Check the file event logs for entries indicating file creation in the `C:\Users\<Username>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup` directory. Look for anything that appears unusual or unexpected.

  - **Analyze Process Creation Events:** Investigate process creation events around the time files were written to the startup folder. Correlate process activity with the files created to identify any malicious applications or scripts that may be involved.

  - **Examine Related Artifacts:** Inspect any associated files in the startup folder for signatures or behaviors known to be malicious. Look for common file extension patterns that may signify executable payloads disguising themselves as benign files.

  - **Check for Network Activities:** If applicable, review network connection logs for any outbound communications associated with the processes writing to the startup folder. This may help to identify the intent behind the file writes.

  ### Prioritization
  Alerts generated by this rule should be treated with a medium severity due to their potential association with an attacker's efforts to establish persistence on compromised systems. The likelihood of such techniques being employed in real-world attacks makes these alerts significant but may not warrant immediate escalation.

  ### Blind Spots and Assumptions
  This detection logic may not cover all scenarios effectively, particularly if the attacker uses methods that do not result in file creations within the startup folder, such as modifying registry keys or utilizing different persistence techniques. Additionally, the presence of legitimate applications that write files to this directory, such as particular user-configured shortcuts or installations, may lead to false positives unless scraped for deeper context. Required logs include file event logs and process creation logs; without the proper configurations to capture these events thoroughly, detection may be hindered.

