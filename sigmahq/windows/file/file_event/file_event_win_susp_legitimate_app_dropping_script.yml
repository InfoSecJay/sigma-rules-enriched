title: Legitimate Application Dropped Script
id: 7d604714-e071-49ff-8726-edeb95a70679
status: test
description: |
  Detects LOLBINs and applications that should not legitimately drop script files to disk.
  This may indicate malware staging or abuse of a trusted binary for script-based code execution.
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
- https://dmpdump.github.io/posts/TelegramRat/
- https://www.virustotal.com/gui/file/a0d5b30578acd1df9139e7a8a4bfc659dc2cf48f4dc0c5804b70890adeb9fa21/behavior
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2026-05-11
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - \eqnedt32.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.chm'
    - '.csproj'
    - '.hta'
    - '.js'
    - '.jse'
    - '.proj'
    - '.ps1'
    - '.py'
    - '.scf'
    - '.vbe'
    - '.vbs'
    - '.wsf'
    - '.wsh'
  filter_main_mshta:
    Image|endswith: '\mshta.exe'
    TargetFilename|endswith: '.hta'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_script/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the execution of certain legitimate applications, often referred to as LOLBINs (Living Off the Land Binaries), that inappropriately create script files (e.g., .bat, .ps1, .vbs) on disk. The detection aims to highlight potential malware staging or the misuse of trusted applications to facilitate script-based code execution. The likely attacker objective is to persistently execute malicious scripts without raising alarms by leveraging trusted tools.

  The relevant MITRE ATT&CK tactics and techniques include Execution (T1203) and Abuse Elevation Control Mechanism (T1218). Primary telemetry sources include Windows File Event logs indicating process creation and file writes, specifically watching for Event ID 4663 (Access to an object) and Event ID 4688 (Process creation). If malicious, the impact could be significant, leading to unauthorized access, data exfiltration, or system compromise. However, this detection does NOT confirm malicious behavior on its own, as legitimate applications may perform similar actions under unusual circumstances.

  ### Investigation Steps

  - **Check process creation logs:** Review Windows Security Event ID 4688 to confirm the process that spawned the script file. Look for any of the specified LOLBINs, such as `mshta.exe` or `certutil.exe`, initiating file creation. Benign behavior might show typical applications handling script files, while malicious indicators would show unexpected LOLBIN usage.

  - **Review file creation details:** Examine Windows Security Event ID 4663 for logs involving file creation. Identify the process that dropped files with suspicious extensions (e.g., .ps1, .vbs) and look at the associated user account. Legitimate activity might include typical user scripts, while malicious activity often shows unusual file names or dropped files not commonly associated with standard operations.

  - **Correlate with user activity logs:** Investigate the user’s recent actions around the time of the alert using logs from Windows Event ID 4624 (Logon). Assess if users were engaged in legitimate tasks that require script file generation, such as automation, or if there’s a pattern of suspicious logins, such as unusual times or from unrecognized machines.

  - **Validate the type of initiated scripts:** Check the contents of created scripts, if accessible, by scanning their filesystem paths. Malicious scripts may contain obfuscated or suspicious content, while legitimate files should typically have recognizable commands or be well-structured.

  - **Identify associated network activity:** Look for outbound connections or DNS requests that follow the triggering event in firewall or proxy logs. Investigate whether the process communicates with external servers or performs large data transfers shortly after script creation, which may indicate exfiltration attempts or command and control (C2) activities.

  ### Prioritization

  Given that this alert involves sensitive applications that can enable script execution, its severity is high. The potential impact on critical system functions and the likelihood of misuse by adversaries makes it a serious concern. Additionally, the behavior of unexpected LOLBIN usage is becoming increasingly weaponized in the threat landscape.

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques where attackers use legitimate applications that aren't covered in the rule or alter file behavior to mimic benign activity. Reliable detection requires proper logging configurations in place for Windows File Events and may miss action when users employ such applications for legitimate automation tasks. A related detection would be monitoring Windows Event ID 4104 (PowerShell Script Block Logging) to complement visibility into script execution activity.

