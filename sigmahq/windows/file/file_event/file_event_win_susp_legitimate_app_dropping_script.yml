title: Legitimate Application Dropped Script
id: 7d604714-e071-49ff-8726-edeb95a70679
status: test
description: Detects programs on a Windows system that should not write scripts to
  disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2023-06-22
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - \eqnedt32.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.ps1'
    - '.bat'
    - '.vbs'
    - '.scf'
    - '.wsf'
    - '.wsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies Windows applications that, under normal operation, should not write script files to disk. Specifically, it targets legitimate binaries (often referred to as Living Off The Land Binaries or LOLBins) that are misused to save scripts, such as PowerShell (.ps1), batch (.bat), and Visual Basic (.vbs) files. Attackers may leverage these legitimate applications to execute malicious code, manipulate the system, or establish persistence on the network. Examples of such behavior could include dropping a malicious PowerShell script to enable further exploitation or obfuscation tactics.

  The relevant MITRE ATT&CK tactics include:
  - **Defense Evasion (T1562)**: The act of using commonly trusted applications to sidestep detection.
  - **Execution (T1203, T1218)**: The misuse of trusted executables to execute scripts without raising alarms, essentially abusing legitimate tools for harmful purposes.

  Primary data sources for this detection include Windows file event logs that capture write operations to the file system, specifically targeting events relating to both the process initiating the write and the resulting script files.

  ### Investigation Steps
  - **Review File Event Logs**: Examine the Windows file event logs for any entries that show the specified applications (e.g., `mshta.exe`, `wordpad.exe`) writing to disk, especially for script file extensions like `.ps1`, `.bat`, or `.vbs`.

  - **Correlate Process Activity**: Analyze the process creation logs around the time of the suspicious file write events to determine what other processes were active. Look for abnormal parent-child relationships and command-line arguments that could indicate malicious intent.

  - **Check for Known Indicators**: Utilize threat intelligence feeds to identify if the writing application has been associated with previous malicious activity or is on an internal watchlist for abuse.

  - **Investigate User Context**: Assess the account context under which the application performed the file write. Anomalous behavior related to administrative accounts or service accounts may indicate a compromise and should be prioritized for deeper investigation.

  ### Prioritization
  This alert is classified as high severity because the use of legitimate applications to drop scripts can signify an active intrusion or a preparatory phase for a larger attack. The likelihood of such activity correlates highly with advanced persistent threat (APT) tactics, where attackers often exploit trusted processes to evade detection and execute malicious payloads.

  ### Blind Spots and Assumptions
  One potential gap in the detection coverage is the reliance on specific application behavior, which may vary based on environmental configurations. There may be legitimate scenarios where these applications must write scripts; thus, an extensive review of known false positives is necessary to refine the detection. The detection logic assumes that the presence of these writing events, combined with the specified applications, indicates malicious intent, which may not always hold true. Required logs include fine-grained file event data and robust process creation logs to ensure comprehensive monitoring of the environment.

