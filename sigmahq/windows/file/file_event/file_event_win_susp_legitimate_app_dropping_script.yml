title: Legitimate Application Dropped Script
id: 7d604714-e071-49ff-8726-edeb95a70679
status: test
description: Detects programs on a Windows system that should not write scripts 
  to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2023-06-22
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - \eqnedt32.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.ps1'
    - '.bat'
    - '.vbs'
    - '.scf'
    - '.wsf'
    - '.wsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where legitimate applications on Windows systems drop scripting files (such as PowerShell scripts or batch files) to disk. Attackers often attempt to utilize trusted applications, also known as Living Off the Land Binaries (LOLBins), as vehicles to execute scripts that facilitate further malicious actions, such as payload execution or lateral movement. The likely attacker objective is to leverage trusted processes to evade detection while executing malicious code.

  This behavior aligns with the MITRE ATT&CK framework, specifically targeting the Defense Evasion tactic (TA0005) and the technique of **"Masquerading" (T1036)** by using trusted applications to execute or deliver malicious content. The primary telemetry sources include Windows file event logs that capture file creation (such as Security Event ID 4663 and Sysmon Event ID 11). If successful, this activity could lead to unauthorized execution of scripts and compromise of sensitive systems.

  It is essential to note that this detection does NOT confirm actual malicious activity on its own; it requires further investigation to distinguish between benign and malicious use of the flagged applications.

  ### Investigation Steps

  - **Review source and destination paths:** Check for the creation of scripts (e.g., *.ps1, *.bat) in unexpected directories such as C:\Users\Public\ or temporary folders; legitimate scripts are generally found in user scripts directories.

  - **Identify associated process relationships:** Use Sysmon Event ID 1 or Process Explorer to check the parent-child process relationship of the triggering applications; if a suspicious or uncommon application initiated the script creation (e.g., involving `mshta.exe`), this may indicate malicious activity.

  - **Cross-reference hash values:** Validate hash values of the dropping executables against known good baselines or threat intelligence feeds; unexpected values tied to applications like `AcroRd32.exe` might indicate potential misuse.

  - **Monitor user behavior:** Assess recent user actions or scheduled tasks that could legitimately utilize applications like `wordpad.exe` or `mshta.exe` for script writing; common benign use cases may include script generation for automation tasks executed by a trusted user.

  - **Log collection validation:** Ensure that the Security Event logs (Event IDs 4663, 4661) and Sysmon configuration are appropriately set to capture the necessary file creation events, as missing logs might result in undetected malicious activities.

  ### Prioritization

  This alert should be prioritized as **high severity** due to the potential impact of unauthorized execution of scripts. The likelihood of being weaponized is significant, as attackers often adopt tactics involving trusted applications to bypass security measures.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques, such as attackers renaming or modifying benign applications to mask their behavior. Additionally, required log sources like file event logs must be properly configured. Legitimate activities, such as automation scripts generated by system administrators, may also trigger the alert. Strengthening detection capabilities with companion alerts for abusive access patterns (e.g., unusual PowerShell usage) can enhance overall coverage against evasive tactics.

