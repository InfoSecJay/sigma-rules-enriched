title: Legitimate Application Dropped Script
id: 7d604714-e071-49ff-8726-edeb95a70679
status: test
description: Detects programs on a Windows system that should not write scripts 
  to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2023-06-22
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - \eqnedt32.exe
    - \wordpad.exe
    - \wordview.exe
            # LOLBINs that can be used to download executables
    - \certutil.exe
    - \certoc.exe
    - \CertReq.exe
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - \Desktopimgdownldr.exe
    - \esentutl.exe
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.ps1'
    - '.bat'
    - '.vbs'
    - '.scf'
    - '.wsf'
    - '.wsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where certain legitimate Windows applications (e.g., WordPad, AcroRd32.exe) are inappropriately creating script files on disk (.ps1, .bat, .vbs, etc.), which can indicate a malicious use case, such as script-based malware or lateral movement. The likely attacker objective is to drop scripts that could be used for post-exploitation activities, including data gathering or executing further payloads. This behavior aligns with the MITRE ATT&CK technique for “Script Execution” (T1218).

  Primary telemetry sources include Windows file event logs, with relevant log artifacts comprising Event IDs tied to file creation and modification activities. If this behavior is malicious, it can lead to unauthorized access, data exfiltration, or system compromise. Importantly, this detection does NOT confirm that the observed behavior is always malicious, as legitimate applications in some enterprise configurations may generate scripts for valid purposes.

  ### Investigation Steps

  - **Check file creation timestamps:**
    Review file creation timestamps for generated scripts in directories typically associated with legitimate applications. Look in C:\Users\<username>\AppData\Local\Temp and match timestamps with application usage patterns.

  - **Verify application context:**
    Confirm the process that generated the script file by examining Process Creation Events (Security Event ID 4688 or Sysmon Event ID 1). Check if the parent process is one of the listed applications (e.g., AcroRd32.exe). If the parent process is legitimate, this may indicate benign usage.

  - **Analyze script content:**
    Inspect the content of the created script files using a text editor. Look for suspicious commands or PowerShell scripts that exhibit signs of scripting for malicious purposes, such as network connections or file downloads.

  - **Identify high-confidence malicious indicators:**
    Compare the identified script files against known malicious script hashes or patterns. Use threat intelligence feeds to lookup any indicators of compromise (IOCs) correlated with script activity stemming from these applications.

  - **Review related file operations:**
    Investigate if further activities follow the script creation, such as execution events (Security Event ID 4688) for scripts running immediately after files were dropped. Identify whether this activity correlates with unusual outbound network connections.

  - **Assess legitimate activity:**
    Understand if there are known business processes or developer tools that might cause these applications to legitimately create scripts. Document any relevant business unit processes that might explain the behavior without malicious intent.

  ### Prioritization

  This alert should be treated with high priority due to the potential for an affected system's compromise and the likelihood of malicious activity within the enterprise. The tools detected are commonly weaponized in attacks, making timely investigations crucial for organizational security.

  ### Blind Spots and Assumptions

  Detection may be limited by variations in application behavior across different environments; specific applications may create scripts in legitimate contexts depending on usage. Ensure comprehensive logging is enabled for file events and process creation to support reliable detection. Beware of legitimate activities like software updates or user-driven processes that could result in similar alarms, which necessitate a thorough review of context. A related detection to consider is monitoring PowerShell execution history, which can provide complementary insights into script executions following dropped files.

