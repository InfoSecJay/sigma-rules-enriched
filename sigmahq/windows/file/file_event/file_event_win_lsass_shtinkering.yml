title: LSASS Process Dump Artefact In CrashDumps Folder
id: 6902955a-01b7-432c-b32a-6f5f81d8f625
status: test
description: Detects the presence of an LSASS dump file in the "CrashDumps" folder.
  This could be a sign of LSASS credential dumping. Techniques such as the LSASS Shtinkering
  have been seen abusing the Windows Error Reporting to dump said process.
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
author: '@pbssubhash'
date: 2022-12-08
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|startswith: 'C:\Windows\System32\config\systemprofile\AppData\Local\CrashDumps\'
    TargetFilename|contains: 'lsass.exe.'
    TargetFilename|endswith: '.dmp'
  condition: selection
falsepositives:
- Rare legitimate dump of the process by the operating system due to a crash of lsass
level: high
note: |
  ### Technical Context
  This rule detects the presence of LSASS (Local Security Authority Subsystem Service) dump files located in the "CrashDumps" folder, which may indicate attempts at credential dumping. In typical attack scenarios, threat actors may employ techniques such as LSASS Shtinkering, which exploits the Windows Error Reporting system to create memory dumps of the LSASS process. Successfully extracting credentials from LSASS allows attackers to gain unauthorized access to privileged accounts.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Credential Access** (TA0006)
  - **Credential Dumping** (T1003.001)

  The primary data sources necessary for effective detection are file system logs that capture events related to file creation and modification. Monitoring for file creation events in system directories can yield incidents of unauthorized credential extraction attempts.

  ### Investigation Steps
  - **Review File Creation Events**: Check for any recent file creations in the "CrashDumps" folder, specifically for files that match patterns indicating LSASS dumps (e.g., containing "lsass.exe" and ending with ".dmp").
  - **Analyze Process Execution**: Investigate process creation logs around the same timestamp to identify unusual activities related to the `lsass.exe` process, including any suspicious parent processes.
  - **Correlate with User Activity Logs**: Look for anomalous user or service account activity that coincides with the presence of the dump files, as this may indicate unauthorized access attempts or privilege escalation activities.
  - **Evaluate System Stability Events**: Assess Windows Event Logs for stability events leading to the creation of crash dumps, to distinguish between legitimate system crashes and potentially malicious activities.

  ### Prioritization
  The severity of this alert is classified as high due to the potential impact of unauthorized credential access, which could lead to further escalated privileges within an enterprise environment. The likelihood of exploitation makes it critical for timely investigative actions.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate system processes that can also generate LSASS dumps during unexpected crashes, which may lead to false positives. The detection logic assumes that the paths and file naming conventions remain consistent, and that the file system logs are correctly configured to capture these events. Required configurations include ensuring that file logging is enabled for sensitive directories where credential dumps may occur.

