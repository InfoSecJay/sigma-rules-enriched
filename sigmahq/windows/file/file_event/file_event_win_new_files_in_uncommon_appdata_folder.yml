title: Suspicious File Creation In Uncommon AppData Folder
id: d7b50671-d1ad-4871-aa60-5aa5b331fe04
status: test
description: Detects the creation of suspicious files and folders inside the 
  user's AppData folder but not inside any of the common and well known 
  directories (Local, Romaing, LocalLow). This method could be used as a method 
  to bypass detection who exclude the AppData folder in fear of FPs
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-05
modified: 2023-02-23
tags:
- attack.defense-evasion
- attack.execution
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\'
    TargetFilename|endswith:
            # Add more as needed
    - '.bat'
    - '.cmd'
    - '.cpl'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.lnk'
    - '.msi'
    - '.ps1'
    - '.psm1'
    - '.scr'
    - '.vbe'
    - '.vbs'
  filter_main:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains:
    - '\AppData\Local\'
    - '\AppData\LocalLow\'
    - '\AppData\Roaming\'
  condition: selection and not filter_main
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files in uncommon subdirectories of the AppData folder, which might signal malicious activities such as malware installation or persistence mechanisms that evade common detection methods. The likely attacker objective is to execute unauthorized scripts or binaries while circumventing security tools that may overlook these less common paths. Relevant MITRE ATT&CK tactics include Defense Evasion (T1203) and Execution (T1059). Primary telemetry sources comprise file system events captured through Windows Event Logs (specifically, Security Event ID 4663 for file creation) or Sysmon Event ID 11 for process creation.

  If the detected behavior is indeed malicious, it could lead to data exfiltration, system compromise, or lateral movement within the network. This detection does NOT confirm actual compromise on its own; it merely indicates possibility and requires further investigation to determine context and intent.

  ### Investigation Steps

  - **Check Event Logs for File Creation:** Review Windows Security Event ID 4663 and Sysmon Event ID 11 for file creation events around the detected timestamp, particularly focusing on entries that reference non-standard AppData paths.

  - **Identify Process Origin:** For any suspicious files created, trace back to their parent processes using the Process ID from Sysmon Event ID 11. A malicious file would likely originate from unexpected processes like `powershell.exe`, `cmd.exe`, or unknown executables not typically found within user space.

  - **Analyze File Details:** Inspect the created files, especially for extensions like `.vbs`, `.scr`, or `.exe`. Malicious indicators include unusual file names or hashes not recognized as legitimate applications. Utilize tools like VirusTotal for file hash reputation checks.

  - **Correlate with User Activity:** Determine the user context by checking logs for legitimate user actions around the same time (e.g., Event ID 4624 for user logon activities). A sudden file creation in an unusual location may indicate anomalous behavior if no corresponding legitimate activities are found.

  - **Validate Legitimate AppData Usage:** Confirm whether the observed behavior aligns with the known legitimate applications used by the affected user or department. Common legitimate applications may create files in standard AppData paths; unusual paths should raise flags.

  ### Prioritization

  This alert has a high severity level due to the potential risk to critical system integrity and confidentiality. The behavior can be indicative of exploitation techniques commonly weaponized in the wild for establishing footholds in enterprise environments. Additionally, the use of uncommon directories to create files could suggest an attempt to evade detection, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques employed by adversaries, such as using benign applications to create files in these locations or using legitimate administrative tools. Reliable detection requires proper configuration of logging for file system events as well as Sysmon setup on endpoints. Legitimate application updates or user actions could trigger this alert, particularly if they involve administrative tools or scripts. A companion detection could be monitoring for unusual or unauthorized process executions in tandem with file creation events to enhance detection coverage.

