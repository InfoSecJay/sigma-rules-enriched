title: Suspicious File Creation In Uncommon AppData Folder
id: d7b50671-d1ad-4871-aa60-5aa5b331fe04
status: test
description: Detects the creation of suspicious files and folders inside the user's
  AppData folder but not inside any of the common and well known directories (Local,
  Romaing, LocalLow). This method could be used as a method to bypass detection who
  exclude the AppData folder in fear of FPs
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-05
modified: 2023-02-23
tags:
- attack.defense-evasion
- attack.execution
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\'
    TargetFilename|endswith:
            # Add more as needed
    - '.bat'
    - '.cmd'
    - '.cpl'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.lnk'
    - '.msi'
    - '.ps1'
    - '.psm1'
    - '.scr'
    - '.vbe'
    - '.vbs'
  filter_main:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains:
    - '\AppData\Local\'
    - '\AppData\LocalLow\'
    - '\AppData\Roaming\'
  condition: selection and not filter_main
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of files within the user's AppData folder that are not located in the well-known subdirectories: Local, Roaming, and LocalLow. By monitoring for file creations in these uncommon areas, the rule aims to uncover potential evasion tactics employed by attackers who may leverage the AppData directory to store malicious payloads or tools, thereby avoiding detection solutions that disregard typical file locations.

  The primary threat scenario involves threat actors attempting to execute malicious scripts or payloads from atypical AppData locations, which may signify a compromise or post-exploitation activity. The intent is often to maintain persistence, evade detection, or facilitate lateral movement within the network. Relevant MITRE ATT&CK tactics and techniques include:

  - **Defense Evasion** (T1218): The creation of files in uncommon locations that are likely excluded from file monitoring rules.
  - **Execution** (T1203): Running arbitrary scripts or programs on a compromised system.

  Primary data sources for this detection include file event logs on Windows systems, which provide insights into file creations and modifications.

  ### Investigation Steps
  - **Review File Creation Events:** Analyze the file creation events for suspicious file types such as `.bat`, `.exe`, or `.vbs` originating from the AppData folder.
  - **Examine User Activity:** Investigate the user activity leading up to the file creation, focusing on recent logins, application usage, and any unusual behaviors observed in user sessions.
  - **Correlate with Threat Intelligence:** Check the identified files against known malicious hashes or behaviors using threat intelligence databases to determine if there is a known association with malware.
  - **Assess Endpoint Security Tools:** Ensure that endpoint detection and response (EDR) tools are effectively monitoring file system changes and enabling alerts for processes that launch unusual files.

  ### Prioritization
  This alert is considered high severity due to the potential direct impact on the organization's security posture, specifically indicating possible compromised systems that could lead to data breaches or further network exploitation.

  ### Blind Spots and Assumptions
  This detection rule may miss file creations in volatile locations or custom subdirectories created by adversaries outside the standard AppData structure. It assumes that file event logging is enabled and properly configured on monitored endpoints. Additionally, there could be legitimate applications that create suspicious files in these locations, potentially leading to false positives that could hinder effective investigations. The coverage of threat scenarios is limited to file creation events and does not capture the execution or behavior of any newly created files.

