title: Suspicious File Creation In Uncommon AppData Folder
id: d7b50671-d1ad-4871-aa60-5aa5b331fe04
status: test
description: Detects the creation of suspicious files and folders inside the 
  user's AppData folder but not inside any of the common and well known 
  directories (Local, Romaing, LocalLow). This method could be used as a method 
  to bypass detection who exclude the AppData folder in fear of FPs
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-05
modified: 2023-02-23
tags:
- attack.execution
- attack.stealth
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\'
    TargetFilename|endswith:
            # Add more as needed
    - '.bat'
    - '.cmd'
    - '.cpl'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.lnk'
    - '.msi'
    - '.ps1'
    - '.psm1'
    - '.scr'
    - '.vbe'
    - '.vbs'
  filter_main:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains:
    - '\AppData\Local\'
    - '\AppData\LocalLow\'
    - '\AppData\Roaming\'
  condition: selection and not filter_main
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files in rare subfolders of the user’s AppData directory, specifically targeting file extensions typically associated with potentially malicious scripts or payloads (e.g., .exe, .dll, .vbs). The likely attacker objective is to execute malicious code while evading detection, as many security solutions tend to focus on well-known AppData folders (Local, Roaming, LocalLow). This behavior aligns primarily with the MITRE ATT&CK tactic of Execution (T1203) and associated techniques such as Command and Scripting Interpreter (T1059).

  The primary telemetry sources for this detection include Windows file event logs, specifically targeting file creation events. If malicious, the creation of such files could lead to unauthorized code execution, data exfiltration, or system compromise. Importantly, this detection does not confirm that the file created is malicious; it merely indicates that suspicious file activity has occurred in uncommon directories.

  ### Investigation Steps

  - **Review file creation events:** Check Security Event ID 4663 for file creation events in the AppData directory to get details on the process that initiated the file creation, ensuring to note the process ID and user context.

  - **Correlate with parent processes:** Investigate the parent process of the file creation using Sysmon Event ID 1. Look for known benign processes (e.g., legitimate user applications) versus suspicious processes such as command shells or PowerShell, indicating possible malicious behavior.

  - **Examine file properties:** Look for executable file properties or unusual metadata in the created file; for example, created date, modified date, and the signer of digital certificates. Legitimate files often have proper signatures or standard timestamps.

  - **Identify known file types:** Filter for created files with uncommon extensions, especially '.exe', '.bat', or '.ps1'. These extensions are often used in scripts or executables that could execute malicious commands.

  - **Check user activity context:** Review user activity logs that are relevant to the time of file creation. Legitimate software installations or updates should correlate with the time of file creation; absence of such may indicate unauthorized activity.

  - **Assess host criticality:** If the affected system is a domain controller or a high-privilege endpoint, escalate the alert immediately to higher tiers due to increased risk associated with compromised accounts on these systems.

  ### Prioritization

  This alert should be prioritized as high severity, particularly if it is associated with critical assets such as endpoints used for administrative purposes. The likelihood of malicious abuse is significant given that attackers frequently use this method to deploy payloads stealthily. Furthermore, the presence of executable files in commodity user directories is a common behavior exploited by malware.

  ### Blind Spots and Assumptions

  Detection limitations may arise if the necessary logging is not enabled, particularly if file system auditing is not configured precisely for the AppData directory. Legitimate activities such as application updates or user-initiated script actions could potentially trigger this alert. It's important to consider companion detections related to suspicious process creations (e.g., monitoring for curious parent process chains) to enhance the context around any triggered alerts and prevent false positives.

