note: |
  ### Technical Context

  This Sigma rule detects the creation of non-existent or suspicious DLL files, typically located in the Windows System32 directory, which are not normally present on the system. The likely attacker objective is to execute malicious code via Phantom DLL hijacking, where attackers place rogue DLLs named after legitimate system binaries to exploit the DLL loading process of applications. Associated MITRE ATT&CK tactics include "Persistence" (TA0003) and "Privilege Escalation" (TA0004) with relevant techniques being DLL hijacking (T1574.001).

  The primary telemetry source for this detection is Windows file event logs, particularly focusing on log types that track file creation events. If such DLLs are indeed malicious, the impact could be significant, potentially leading to further exploitation or persistence in the environment. However, this detection does NOT confirm malicious intent on its own since there may be benign scenarios where these files are created, such as through legitimate third-party software.

  ### Investigation Steps

  - **Review recent file creation events:** Check Windows Security Event ID 4663 for any creation attempts of the detected DLLs. Focus on timestamps that correspond with the alert; legitimate DLLs typically do not exhibit this behavior.

  - **Correlate process activity:** Examine Sysmon Event ID 10 (Process Access) and Event ID 1 (Process Creation) for processes that accessed or created the suspicious DLL files. Investigate any unknown or unexpected processes associated with these actions.

  - **Identify legitimate software installations:** Look into installed applications (Control Panel > Programs) or check the application logs to establish a baseline of software on the host. Confirm if there’s legitimate software that can create such DLLs to rule out false positives.

  - **Check for existing system DLLs:** Validate whether the DLLs listed are indeed non-existent on the system by comparing them against the legitimate DLL directory contents. Presence of similar names without legitimate files indicates suspicious activity.

  - **Search for persistence mechanisms:** Investigate the Windows Task Scheduler (Event ID 4698) for any scheduled tasks that may reference the suspicious DLLs. Malicious actors often create tasks to maintain persistence through hijacked DLLs.

  - **Observe network activity:** Monitor network traffic for suspicious outbound connections made by processes tied to the newly created DLLs. Analyze for signs of data exfiltration or connection to C2 servers using logs from firewalls or EDR tools.

  ### Prioritization

  This alert has medium severity based on the criticality of affected systems, as manipulated DLL loading can significantly impact system integrity. The likelihood of malicious activities exploiting these DLLs is relatively high, given that such techniques are commonly utilized in evolving attacks like persistence and privilege escalation. Immediate investigation is recommended to mitigate potential threats.

  ### Blind Spots and Assumptions

  This detection may miss obfuscation techniques and variations of DLL names used by attackers to hide their malicious actions. Reliable detection hinges on correctly configured Windows file event logging, which must be enabled to capture these events effectively. Legitimate activities, such as software updates or installations, may trigger the alert if they create DLLs with similar names. Strengthening coverage can be achieved with companion detections for process creation activity or monitoring of scheduled tasks targeting similar DLLs, as seen in "ImageLoad" rules.

