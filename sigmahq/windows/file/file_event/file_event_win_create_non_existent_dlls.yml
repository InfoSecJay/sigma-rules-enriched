note: |
  ### Technical Context

  This Sigma rule detects the creation of specific non-existent system DLL files in Windows system directories, which are not typically present. Malicious actors may create these DLLs to employ DLL hijacking techniques, whereby the introduction of a malicious DLL with a name resembling a legitimate system component allows the attacker to execute arbitrary code when a legitimate application is launched.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion (T1562)** and **Persistence (T1574.001)**. The primary telemetry source for this rule is file event logs indicating the creation of DLLs (specifically monitoring system directories such as `C:\Windows\System32`). If malicious, this behavior can lead to code execution and persistent control of compromised systems. Notably, this detection alone does not confirm that the created DLL is being executed or that an actual attack is occurring—it only highlights an anomalous file creation event.

  ### Investigation Steps

  - **Review the created DLL path and filename**: Check for the specified DLL filenames (e.g., `axeonoffhelper.dll`, `cdpsgshims.dll`) in the `C:\Windows\System32\` directory. If found, this is a high-confidence indicator of potential malicious activity.

  - **Audit process creation logs**: Investigate Windows Security Event ID **4688**. Look for the parent process that spawned the legitimate applications (e.g., `explorer.exe`, `regsvr32.exe`) that could have loaded these DLLs. Identify any anomalies indicating the potential exploitation of a DLL hijacking technique.

  - **Identify recent system changes**: Review the system event log for any recent installations or modifications around the time of the DLL creation. This could indicate legitimate software updates versus potential malicious changes (Event ID **104** or **6005**).

  - **Check for related process activity**: Use Sysmon Event ID **1** to look for process creation that occurs around the same time as the DLL creation. Correlate any suspicious parent/child process relationships with known malicious behaviors.

  - **Assess host criticality and role**: Identify if the affected system is a critical server or endpoint within the organization. Systems with higher criticality may require immediate action to contain the potential threat.

  - **Examine file hashes**: Analyze the hashes of the created DLLs against known malware repositories using a service like VirusTotal. A match with known malicious DLLs strongly suggests an attack vector is in play.

  ### Prioritization

  This alert holds medium severity due to the potential impact of DLL hijacking as a method of executing arbitrary code on affected systems, which could result in significant damage or data exfiltration. The likelihood of malicious abuse is moderate, as this technique has established use cases in various exploitation strategies but may occasionally trigger due to benign applications misusing DLL names.

  ### Blind Spots and Assumptions

  Detection may be limited if offensive tools are specifically designed to evade detection or if proper logging configurations (like Sysmon) are not in place. Legitimate software updates or installations may inadvertently trigger this alert when introducing expected DLL files. Companion detections, such as monitoring for elevated process creation after suspicious DLL creation, could enhance investigative coverage.

