  ### Technical Context

  This rule detects the creation of specific temporary files associated with the RemoteKrbRelay SMB Relay attack module, particularly `sam.tmp`, `sec.tmp`, and `sys.tmp`, which are indicative of an attempt to exploit SMB for credential dumping or lateral movement. The likely attacker objective is to extract sensitive information from target systems, leveraging SMB relay techniques to gain unauthorized access to resources. This behavior corresponds to the MITRE ATT&CK tactic of **Command and Control (TA0011)** and the technique **Credential Dumping (T1219.002)**.

  Primary telemetry sources include Windows file event logs, specifically monitoring for file creation in the `C:\Windows\Temp` directory. If this detection triggers, the security impact could be significant, as it may indicate ongoing attacks aimed at credential harvesting or lateral movements. However, this detection does NOT confirm successful credential exfiltration or the execution of a broader attack chain on its own.

  ### Investigation Steps

  - **Verify the file creation time and source process**: Check Security Event ID 4663 and/or Sysmon Event ID 11 to identify the process responsible for creating the suspicious files. Ensure the creation time aligns with user activity or known scheduled tasks.

  - **Correlate user activity**: Review user logon events and system activity using Security Event ID 4624 to determine whether the user account associated with the file creation has a legitimate reason to access `C:\Windows\Temp`. Look for any mismatches indicating potential misuse.

  - **Identify parent processes**: Use Sysmon Event ID 1 to investigate the parent process that initiated the file creation. Ensure the process is a known and trusted application; unusual executables starting the process could indicate a malicious operation.

  - **Check for prior alerts**: Review previous alerts or incidents relating to SMB relay attacks or credential dumping to establish a timeline and context for the detected behavior, especially if this activity appears recurrent.

  - **Baseline typical behavior**: Document expected behavior for legitimate applications that may interact with the `C:\Windows\Temp` directory. For instance, applications performing temporary file operations intermittently should not trigger this alert.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and the likelihood of malicious use exploiting SMB protocols. The specific file creations detected are infrequently associated with benign applications, suggesting a strong potential for legitimate abuse and exploitation.

  ### Blind Spots and Assumptions

  Limitations exist in detection as attackers could potentially modify file names or locations to evade triggers. Reliable detection is contingent on comprehensive logging of Windows file events; without them, crucial activities could be overlooked. Legitimate software updates or maintenance processes may create similar temporary files and trigger alerts. Companion detections regarding SMB traffic anomalies or privileged actions (e.g., Security Event ID 4672) could enhance overall situational awareness.

