note: |
  ### Technical Context
  This detection rule identifies the creation of specific temporary files associated with the RemoteKrbRelay attack module, which is utilized in SMB relay attacks to steal credentials and perform lateral movement within Windows environments. The attacker typically aims to exploit vulnerable systems, gaining unauthorized access to sensitive resources, by relaying authentication requests to other systems in the network. The targeted file names (`sam.tmp`, `sec.tmp`, and `sys.tmp`) are indicative of the automated tools that leverage SMB relaying for extracting credential hashes and other security-related information.

  This activity relates primarily to the MITRE ATT&CK tactic of **Command and Control** (TA0011) and specifically targets the technique **Remote Credential Dumping (T1219.002)**. Attackers look to gather credentials for further exploitation, making it essential to detect this type of behavior quickly. Data sources that hold relevant telemetry for this detection include Windows file event logs, particularly those monitoring file creation events in system directories.

  ### Investigation Steps
  - **Review File Creation Logs:** Investigate file event logs for the creation of any instances of `sam.tmp`, `sec.tmp`, or `sys.tmp` within the `C:\Windows\Temp\` directory. Collect the timestamp and user context for these events.
  - **Correlate SMB Activity:** Analyze SMB logs for any unusual relay activity or suspicious connections to/from an external system around the time of file creation. Look for unusual IP addresses or failed authentication attempts.
  - **Examine Process Activity:** Check for processes initiated by the creation of these files. Investigate any suspicious or unexpected processes that may relate to credential dumping or remote exploitation tools.
  - **Audit User Accounts and Permissions:** Review user account activities and permissions that may have been elevated. Pay special attention to any accounts that have been granted administrative privileges around the same timeframe.

  ### Prioritization
  This alert is classified with high severity due to the potential impact of credential compromise within an enterprise environment, where attackers can gain access to sensitive resources and escalate privileges. The likelihood of legitimate users generating these specific files is extremely low, raising the urgency for investigation.

  ### Blind Spots and Assumptions
  This detection logic may miss instances where the attack is conducted using different naming conventions or methods that do not generate the specified file names. The assumption is that appropriate file monitoring is configured to track activities in the `C:\Windows\Temp\` directory. Additionally, an absence of file event logging might prevent detection of this attack vector altogether, necessitating proper configuration of Windows logging settings to ensure coverage.

