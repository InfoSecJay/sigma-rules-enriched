note: |
  ### Technical Context

  This Sigma rule detects an attempt to perform a User Account Control (UAC) bypass using the `IEInstal.exe` executable as part of a malicious payload execution on Windows systems. Attackers typically aim to elevate privileges to execute code with higher access rights than those available to the currently logged-in user. This activity correlates with the MITRE ATT&CK tactics of Privilege Escalation (TA0004) and the specific technique of UAC Bypass (T1548.002).

  The primary telemetry sources for this detection are file system events on endpoints, specifically monitoring the creation or modification of files within the `C:\Users\` directory, particularly where temporary files are involved. If successful, this behavior can lead to unauthorized access and control over critical systems. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate processes may also interact with the same files under normal circumstances.

  ### Investigation Steps

  - **Review file creation logs:** Check Windows Security Event ID 4663 for records of the creation of `consent.exe` in `C:\Users\<username>\AppData\Local\Temp\` to see if it was created using `IEInstal.exe`. Benign activity can include regular software installations by authorized users.

  - **Verify associated process execution:** Inspect Sysmon Event ID 1 for events where `IEInstal.exe` is executed, noting the parent process. Look for unusually timed entries or unexpected parent processes that may indicate malicious intent.

  - **Correlate access to sensitive resources:** Investigate whether any script or binary executed after the `consent.exe` creation accessed elevated privileges or sensitive system files. Indicators of compromise include attempts to access the System directory or sensitive registry entries.

  - **Cross-reference logged user activity:** Analyze Event ID 4624 (logon events) within the timeframe of the alert to determine if the user executing `IEInstal.exe` is authorized and expected for the environment. Unrecognized users or logon times may indicate malicious behavior.

  - **Examine file properties for anomalies:** Check the file properties of the created `C:\Users\<username>\AppData\Local\Temp\consent.exe`, focusing on the file owner, digital signatures, and creation timestamps. Legitimate files usually have valid signatures and coherent timestamps relative to application installations.

  ### Prioritization

  This alert is classified as high severity due to the potential for unauthorized privilege escalation on important systems, which could lead to further compromise or exploitation. The likelihood of this behavior being weaponized is significant, given that attackers often exploit UAC bypass methods in their attack workflows.

  ### Blind Spots and Assumptions

  This detection can be circumvented by attackers using techniques such as deleting the created files or employing alternative methods for privilege escalation that do not utilize `IEInstal.exe`. Effective detection requires that file system logging is enabled, specifically for executable file changes in user directories. Legitimate activities, such as software installations or updates, may also trigger this alert. A companion detection, such as monitoring for abnormal process trees or unauthorized service installations, enhances coverage against similar privilege escalation attempts.

