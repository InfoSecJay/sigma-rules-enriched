logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image: 'C:\Program Files\Internet Explorer\IEInstal.exe'
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: 'consent.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects instances of User Account Control (UAC) bypass attempts using the Internet Explorer Installer (IEInstal.exe). Specifically, it identifies when this technique is employed to manipulate the target filename to execute a process (consent.exe) within the user's Temp directory, which is often associated with exploitation attempts aimed at elevating privileges without user consent. Attackers may use this tactic to escalate their privileges within an environment, gaining unauthorized access to sensitive data or critical systems.

  The primary objective of the threat actor utilizing this technique is to circumvent security controls designed to prevent unauthorized elevation of privileges, as outlined in the MITRE ATT&CK framework. This detection relates to techniques under the "Defense Evasion" (T1212) and "Privilege Escalation" (T1548.002) tactics, highlighting an action that directly compromises the integrity of the operating system by subverting normal user permissions.

  Key telemetry for this detection includes file event logs that monitor executable file actions on Windows systems, alerting on specific instances when the Executable that's typically trusted is employed for potentially malicious activities.

  ### Investigation Steps
  - **Review File Event Logs:** Examine the relevant file event logs to identify occurrences of IEInstal.exe interacting with the Temp directory, especially focusing on any entries linked to the creation of consent.exe.
  - **Analyze Process Creation Events:** Check process creation logs for the execution of both IEInstal.exe and consent.exe. Investigate the parent-child relationships to determine if they align with typical user behavior or indicate suspicious activity.
  - **Examine User Context:** Verify the user accounts under which these processes were executed. Look for anomalous account usage patterns or deviations from expected behavior, especially for accounts that should not typically require privilege escalation.
  - **Correlate with Other Security Events:** Cross-reference the file event findings with other logs (e.g., EDR, SIEM) that could provide insight into the user's activity leading up to the UAC bypass, including failed access attempts, logins from unusual locations, or other red flags.

  ### Prioritization
  Given that UAC bypass techniques can lead to significant security incidents with potential data breaches, the severity of this alert is classified as high. Evaluating this in an enterprise context, it signifies a serious risk as it directly compromises user trust and integrity of the environment.

  ### Blind Spots and Assumptions
  This detection does not account for potentially authorized uses of IEInstal.exe, which may produce false positives if legitimate software installations utilize this executable. The detection logic assumes that the monitored environment maintains logging for file events and that the Temp directory follows standard operational patterns without significant customization. If logs are not properly configured or if file event monitoring is insufficient, this rule may fail to capture critical indicators of compromise effectively.

