note: |
  ### Technical Context

  This rule detects an attempt to bypass User Account Control (UAC) using the Internet Explorer Installer (IEInstal.exe). Attackers may leverage this technique to escalate privileges without triggering standard security controls. The likely objective is to gain elevated privileges on the system to execute malicious actions while evading detection. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** (TA0005) and technique **UAC Bypass** (T1548.002).

  The primary telemetry source is file event logging from Windows, specifically capturing interactions with `IEInstal.exe` and the creation of the elevated `consent.exe` file in the user's Temp directory. If malicious, this activity can lead to unauthorized access and control over critical systems. Importantly, this detection does NOT confirm whether the UAC bypass was successful or if any subsequent malicious actions occurred.

  ### Investigation Steps

  - **Check the process execution details:** Examine Security Event ID 4688 for the execution of `IEInstal.exe`. Look for unusual parent processes that may indicate the command was invoked in a malicious context (e.g., launched by a suspicious script or application).

  - **Identify File Creation:** Review the file creation logs (e.g., Windows Event ID 4663) for any `consent.exe` files in `C:\Users\<username>\AppData\Local\Temp\`. Validate the creation time and corroborate it with the process execution timestamps.

  - **Analyze User Context:** Determine the user context under which the attempt occurred. If the associated user has typical usage patterns or is an administrator, this may indicate a higher likelihood of malicious intent. Support with User Account privileges data.

  - **Correlate with Similar Alerts:** Check for other instances of UAC bypass attempts (similar alerts within a timeframe). Frequently, attackers will employ similar techniques in sequence or rely on their own scripts.

  - **Look for Legitimate Usage Patterns:** Assess regular user operations regarding `IEInstal.exe`. Legitimate software installations sometimes utilize this process. If the logs indicate standard application updates or installations executed by known software, mark them as benign.

  ### Prioritization

  This alert is high severity due to the potential impact of gaining elevated privileges on sensitive systems. The likelihood of malicious exploitation is considerable, as UAC bypass techniques are frequently utilized by adversaries to gain control. This behavior can indicate an advanced and targeted attack, warranting prompt investigation.

  ### Blind Spots and Assumptions

  This detection has limitations; users with administrative rights may legitimately execute UAC bypass techniques without malicious intent. The absence of detailed file creation logging in `AppData\Local\Temp\` could lead to missed alerts. Additionally, legitimate software updates from trusted sources may trigger similar behaviors. Consider implementing additional detections for common tools associated with UAC bypasses to enhance monitoring efficacy.

