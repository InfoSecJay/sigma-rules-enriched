title: Process Monitor Driver Creation By Non-Sysinternals Binary
id: a05baa88-e922-4001-bc4d-8738135f27de
status: test
description: Detects creation of the Process Monitor driver by processes other 
  than Process Monitor (procmon) itself.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
modified: 2026-06-29
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1068
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\procmon'
    TargetFilename|endswith: '.sys'
  filter_main_process_explorer:
    Image|endswith:
    - '\procmon.exe'
    - '\procmon64.exe'
    - '\procmon64a.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some false positives may occur with legitimate renamed process monitor 
  binaries
level: medium
note: |
  ### Technical Context

  This rule detects the creation of the Process Monitor driver (`procmon.sys`) by any process other than the official Process Monitor executable (e.g., `procmon.exe`). Malicious actors may attempt to create or manipulate this driver to gain persistence on a system or escalate privileges, as it allows them to monitor and log system activity covertly. The relevant MITRE ATT&CK tactic is Persistence, and the associated technique is T1068 (Exploitation for Client Execution).

  The primary telemetry sources include Windows file creation events, specifically focusing on logs that indicate file activity around system drivers. If a non-standard process creates this driver, it suggests potential malicious activity, indicating an attacker could gain significant control over the host. However, this detection does NOT confirm that the driver creation was malicious without further investigation into the process that triggered it.

  ### Investigation Steps

  - **Identify the process that created the driver:** Check the Event ID 4663 logs (File System) for activity related to `procmon.sys`. Look for the `Subject User Name` field to identify which process initiated the creation.

  - **Review the command line arguments of the process:** Obtain the command line used for the creating process from Security Event ID 4688 (Process Creation) logs. Legitimate `procmon.exe` execution typically includes specific arguments indicating monitoring, like `-ma` for "monitor all activity."

  - **Verify the hash of the creating process:** Cross-reference the hash of the process that created `procmon.sys` using a threat intelligence database. Legitimate instances will typically correspond to known vendor hashes; non-standard or altered binaries may indicate malicious intent.

  - **Assess the file path for legitimacy:** Most legitimate copies of Process Monitor reside in `%ProgramFiles%\Sysinternals Suite\` or are executed from this location. Any deviation may warrant further scrutiny.

  - **Check for known user behavior:** Review user behavior against historical logs to identify whether invoking `procmon` aligns with standard operational practices for the affected asset. Look for prior usage in Security Event ID 4688.

  ### Prioritization

  This alert is of medium severity as the affected system may contain sensitive information or perform critical functions. The likelihood of exploitation is moderate since creating or manipulating the Process Monitor driver is a method often utilized by adversaries to maintain stealth and persistence. This behavior is not commonplace and indicates a potentially high-risk scenario that should be investigated promptly.

  ### Blind Spots and Assumptions

  Detection efficacy is potentially limited by the use of alternative tools that may imitate or rename legitimate applications. Additionally, certain legitimate software could trigger similar alerts if they create drivers similarly. Comprehensive logging, including Driver Installation logs, is crucial for reliable detection. Companion detections, such as unusual persistence mechanisms or lateral movement attempts, can strengthen overall coverage against potential malicious activities.

