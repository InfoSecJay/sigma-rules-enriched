title: Process Monitor Driver Creation By Non-Sysinternals Binary
id: a05baa88-e922-4001-bc4d-8738135f27de
status: test
description: Detects creation of the Process Monitor driver by processes other 
  than Process Monitor (procmon) itself.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1068
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\procmon'
    TargetFilename|endswith: '.sys'
  filter_main_process_explorer:
    Image|endswith:
    - '\procmon.exe'
    - '\procmon64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some false positives may occur with legitimate renamed process monitor 
  binaries
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of the Process Monitor (ProcMon) driver (procmon.sys) by processes other than the legitimate ProcMon executable. The likely objective of an attacker using this technique is to establish persistence or escalate privileges by hooking the kernel for monitoring or controlling other processes without detection. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (T1547) and **Privilege Escalation** (T1068). The primary telemetry source for this detection includes Windows file event logs, specifically monitoring for attempts to create files in system directories that match the naming convention of ProcMon drivers. If the detection is confirmed to be malicious, it could indicate a significant security impact, as it suggests potential backdoor activities or attempts to circumvent security measures. However, this detection on its own does NOT confirm malice, as legitimate processes could also create these drivers if improperly configured or renamed.

  ### Investigation Steps

  - **Check process creation logs**: Review Windows Security Event ID 4688 to identify the parent process that initiated the creation of the procmon.sys file. Malicious behavior may exhibit unusual parent processes, such as uncommon system utilities or scripts, rather than operational tools like procmon.exe.

  - **Identify the creation source**: Look for Sysmon Event ID 11, which details file creation events, focusing on any processes that do not match the legitimate ProcMon binaries (procmon.exe or procmon64.exe). A match to other binaries could suggest evasion or an attempt to weaponize ProcMon.

  - **Review file attributes and paths**: Validate the creation path in relevant logs for known system directories (e.g., C:\Windows\System32\). Legitimate ProcMon operations typically occur during active monitoring sessions initiated by authorized users.

  - **Monitor for related network activity**: Investigate any outbound connections from processes involved in creating the procmon.sys file using Windows Event ID 5156 to detect any suspicious behavior that may indicate data exfiltration or command and control communications.

  - **Assess asset criticality**: Identify the system where the alert was generated, focusing on critical assets (e.g., domain controllers or servers holding sensitive data) and the implications of possible malicious activity on those systems.

  - **Verify legitimacy of renamed binaries**: Document any instances of processes that may have been renamed or are misconfigured versions of the legitimate ProcMon executable. This includes checking file hashes against known signatures to rule out benign activities.

  ### Prioritization

  This alert should be treated with medium severity in the enterprise context. The affected systems' criticality will escalate the response; non-compliance in monitoring may indicate a higher likelihood of malicious actions being attempted. While creating Process Monitor drivers is not a common attack vector, its potential for weaponization during privilege escalation or persistence mechanisms makes it concerning.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate processes intentionally renamed to mislead security systems. The alert requires accurate configuration of Windows file event logging to ensure all relevant actions are captured. Additionally, administrative tools or automated scripts may trigger this alert under normal operational conditions without malice. A related detection to support coverage includes monitoring for abnormal process injection techniques (T1055), which could further correlate with this activity and provide context on the potential threat landscape.

