title: Process Monitor Driver Creation By Non-Sysinternals Binary
id: a05baa88-e922-4001-bc4d-8738135f27de
status: test
description: Detects creation of the Process Monitor driver by processes other than
  Process Monitor (procmon) itself.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1068
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\procmon'
    TargetFilename|endswith: '.sys'
  filter_main_process_explorer:
    Image|endswith:
    - '\procmon.exe'
    - '\procmon64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some false positives may occur with legitimate renamed process monitor binaries
level: medium
note: |
  ### Technical Context
  This rule detects the creation of the Process Monitor (procmon) driver by processes other than the legitimate Process Monitor applications themselves. Process Monitor is a powerful tool typically used for system monitoring and debugging, but if an attacker is able to create the driver under a different process name, they may be attempting to bypass security mechanisms, evade detection, or engage in malicious behavior such as stealthy data collection. The ability for an unauthorized binary to create a low-level driver suggests an escalation of privileges and an intent to maintain persistence on compromised systems.

  The relevant MITRE ATT&CK tactics include **Persistence** (T1078), where attackers may install unauthorized software to maintain access, and **Privilege Escalation** (T1068), which refers to escalating privileges to execute malicious code. The tactics are particularly concerning because they highlight potential pathways for long-term adversarial control over a network environment.

  Primary data sources for this detection include file event logs from Windows systems, specifically monitoring creations of driver files within system directories. The logging should ideally capture all file creation events, especially in sensitive directories where drivers are typically stored.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine Windows file event logs for entries related to the creation of `.sys` files, specifically filtering for paths that contain `\procmon`. Pay attention to the process name associated with these events to identify any non-standard executables.

  - **Audit Process Creation Events:** Investigate process creation logs for any instances that show non-Process Monitor binaries attempting to create the Process Monitor driver. Look for any indicators of process anomalies or unusual parent-child relationships.

  - **Check for Suspicious Executables:** Conduct a search for any newly created or modified executables that do not match typical naming conventions for legitimate Process Monitor installations. Validate the integrity of the binaries to ensure they haven't been tampered with.

  - **Analyze System Behavior:** If any unauthorized driver creation is detected, assess the system's behavior to understand the extent of any potential compromise. Look for signs of persistence mechanisms or further attempts to escalate privileges.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of unauthorized driver creation, which can lead to undetected malware operating with high privileges. The likelihood is elevated in environments where security postures are lax or where unauthorized software may be prevalent.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage lies in legitimate use cases for renamed Process Monitor binaries that may still interact with driver creation, leading to false positives. The detection logic assumes that any process other than the legitimate Process Monitor executables is malicious; however, there could be scenarios where legitimate applications improperly named may generate similar events. For the alert to function effectively, comprehensive file creation logging must be enabled on Windows endpoints, ensuring monitoring of all relevant directories for driver creation events.

