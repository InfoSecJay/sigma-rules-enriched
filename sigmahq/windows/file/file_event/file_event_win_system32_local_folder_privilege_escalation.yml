detection:
  selection:
    TargetFilename|startswith:
    - 'C:\Windows\System32\logonUI.exe.local'
    - 'C:\Windows\System32\werFault.exe.local'
    - 'C:\Windows\System32\consent.exe.local'
    - 'C:\Windows\System32\narrator.exe.local'
    - 'C:\Windows\System32\wermgr.exe.local'
    TargetFilename|endswith: '\comctl32.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a folder with a ".Exe.Local" suffix within the "System32" directory, indicating a possible attempt at privilege escalation through DLL sideloading. The primary attacker objective is to gain unauthorized access or elevated permissions by placing a malicious `comctl32.dll` (Common Controls Library) that can be executed by legitimate processes, which are improperly handled due to Windows' DLL search order. This behavior is associated with MITRE ATT&CK tactic "Persistence" (TA0003) and technique "DLL Side-Loading" (T1073).

  The primary telemetry source is Windows file event logs capturing file creation activities, specifically looking for indications of DLL files created in conjunction with executable names commonly used by the system. A successful malicious activity could lead to significant security impacts, including unauthorized elevation of privileges and control over affected systems. However, this detection alone does not confirm a successful attack or compromise; further investigation into the context and surrounding activities is necessary.

  ### Investigation Steps

  - **Review their file creations for suspicious activity:** Check for occurrences of Event ID 4663 (File Access) and correlate to see if `*.Exe.Local` folders were created shortly before or after legitimate application executions, observing timestamps and associated user accounts.

  - **Validate the legitimacy of file paths:** Identify if the creation of `C:\Windows\System32\[specific_executable].exe.local` precedes any instances of `comctl32.dll` creation, confirming if these changes align with expected application behaviors or administrative tasks.

  - **Examine surrounding process activities:** Analyze Sysmon Event ID 10 (ProcessAccess) and Event ID 1 (Process Creation) to see if processes like `logonUI.exe`, `werFault.exe`, or `consent.exe` are invoking the suspicious `comctl32.dll`. This can signal attempts to execute potentially malicious actions.

  - **Check for known legitimate uses:** Investigate documentation or internal notes for any benign applications or tasks that may purposely create `.Exe.Local` folders, distinguishing them from unauthorized background processes trying to evade defenses.

  - **Correlate with endpoint security alerts:** Identify any other alerts triggered by endpoint detection and response (EDR) solutions around the same timeframe that could corroborate the malicious intent of the detected activity, enhancing contextual understanding.

  ### Prioritization

  This alert should be characterized as high severity due to the potential for significant impact on the system through privilege escalation, often exploited by attackers to gain persistent footholds in enterprise environments. The likelihood of this type of behavior being weaponized within sophisticated attacks makes it critical for timely investigation.

  ### Blind Spots and Assumptions

  The detection may be limited by the absence of logged events due to possible evasion techniques like direct filesystem modifications or turning off file logging. It requires adequate auditing settings to be effective, such as enabling file access auditing on the System32 directory. Additionally, legitimate software or misconfigured applications may create `.Exe.Local` folders, complicating the false positive landscape. Companion detections to consider include monitoring for abnormal process spawning behaviors (e.g., from Sysmon or traditional security products) that leverage those DLLs, enhancing coverage of this tactic.

