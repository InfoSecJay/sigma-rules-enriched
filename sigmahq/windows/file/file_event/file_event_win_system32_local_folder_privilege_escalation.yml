logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|startswith:
    - 'C:\Windows\System32\logonUI.exe.local'
    - 'C:\Windows\System32\werFault.exe.local'
    - 'C:\Windows\System32\consent.exe.local'
    - 'C:\Windows\System32\narrator.exe.local'
    - 'C:\Windows\System32\wermgr.exe.local'
    TargetFilename|endswith: '\comctl32.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of ".Exe.Local" files within the "C:\Windows\System32" directory, specifically targeting the filename patterns prefixed with certain legitimate Windows executables. The behavior suggests an attempt by an attacker to sideload the "comctl32.dll" library, potentially leading to privilege escalation. The likely attacker objective is to execute malicious code under the context of trusted system binaries, evading detection mechanisms. This manipulation aligns with the MITRE ATT&CK technique for "DLL Search Order Hijacking" (T1179) and "Execution through Module Load" (T1203).

  The primary telemetry sources for this rule are Windows file event logs, especially monitoring for file creations in sensitive directories. The implication of a malicious event is significant, as a successful privilege escalation could grant the attacker elevated access, compromising the integrity and confidentiality of the system and network. However, it is important to note that the detection alone does not confirm malicious activity; further investigation is required to ascertain intent and the context of file creation.

  ### Investigation Steps

  - **Validate the creation of suspicious files:** Check Windows Security Event ID 4663 to confirm attempts to create the ".Exe.Local" files within "C:\Windows\System32" by identifying the user and process responsible for the creation.

  - **Identify the parent process:** Review Sysmon Event ID 1 (Process Creation) to uncover the parent process that spawned the suspicious file creation. Legitimate processes typically would not create ".Exe.Local" files.

  - **Check for known good indicators:** Verify against a whitelist of expected application binaries to distinguish between benign file activity and potential malicious actions. Trusted system processes should not be invoking file creations in this manner.

  - **Review recent changes to these files:** Use PowerShell commands to list changes within the "C:\Windows\System32" directory, specifically checking for file timestamps, user accounts that performed actions, and any recent updates to "comctl32.dll".

  - **Correlate with user behavior:** Analyze user activity logs, particularly logon events (Security Event ID 4624) to determine if there is unusual account behavior coinciding with the file creations, indicating potential compromised accounts.

  ### Prioritization

  This alert should be considered high priority due to the criticality of the Windows System32 directory and the potential for privilege escalation. The nature of the file creation is closely associated with known tactics of sophisticated adversaries, making it a likely candidate for malicious abuse.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques where attackers leverage legitimate applications to manipulate file creation. Consistent logging of file events is essential for reliable detection, particularly ensuring file auditing is enabled on critical directories. Legitimate applications may create or modify files in the System32 directory, so context surrounding the creation must be thoroughly evaluated. Companion detections could include monitoring for unusual process creations by trusted executables (T1055 - Process Injection) as further indicators of potential compromise.

