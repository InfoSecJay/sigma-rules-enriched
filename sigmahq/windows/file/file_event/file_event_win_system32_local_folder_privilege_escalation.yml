logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|startswith:
    - 'C:\Windows\System32\logonUI.exe.local'
    - 'C:\Windows\System32\werFault.exe.local'
    - 'C:\Windows\System32\consent.exe.local'
    - 'C:\Windows\System32\narrator.exe.local'
    - 'C:\Windows\System32\wermgr.exe.local'
    TargetFilename|endswith: '\comctl32.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule is designed to detect potential privilege escalation attempts through the creation of ".Exe.Local" folders within the "System32" directory of Windows systems. Attackers may utilize this technique to sideload malicious versions of legitimate Windows DLLs, particularly targeting "comctl32.dll." By doing so, they can impersonate trusted processes and manipulate the system for escalated privileges, allowing them to execute arbitrary code with the same permissions as the built-in system processes.

  The relevant MITRE ATT&CK techniques associated with this rule include **Persistence (T1546)** and **Privilege Escalation (T1055)**. The primary objectives for attackers employing this tactic include maintaining persistence on the system and gaining elevated privileges to further their malicious activities, which can range from data exfiltration to complete system compromise.

  The most pertinent telemetry for detecting this behavior includes file event logs that capture the creation of files in the "System32" directory. Additionally, process creation events may also provide context on the legitimate applications involved and any related suspicious activity.

  ### Investigation Steps
  - **Review File Creation Events:** Look for recent file creation events in the "C:\Windows\System32\" directory, particularly those indicating the creation of "*.Exe.Local" files related to known system processes (e.g., logonUI.exe.local, werFault.exe.local).

  - **Analyze Associated Process Events:** Correlate the file creation events with process creation logs to identify abnormal executions or unusual parent-child process relationships that may indicate exploitation attempts.

  - **Investigate DLL Load Events:** Examine logs for DLL loading activities related to "comctl32.dll" to verify whether the file integrity has been compromised or if unexpected resources are being loaded during the execution of benign processes.

  - **Cross-Reference with User Activity Logs:** Assess user activity logs to identify any suspicious user behavior correlating with the detected events, such as high-privilege accounts creating the ".Exe.Local" files or logging in from anomaly locations.

  ### Prioritization
  Given the high potential impact associated with privilege escalation attempts, this alert is of high severity in an enterprise environment. Unauthorized access to elevated privileges can lead to significant data breaches, system manipulation, and prolonged malware persistence.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may exist if file event logging is not enabled or properly configured for critical directories like "System32." The detection logic assumes that file creation logs are adequately captured and retained, and that users or processes attempting to create these files should be contextually monitored. Furthermore, legitimate application updates may create similar artifacts, leading to potential false positives if not accurately contextualized with user activities and environmental baselines.

