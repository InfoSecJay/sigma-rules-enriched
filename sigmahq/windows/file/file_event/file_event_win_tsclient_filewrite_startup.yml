  ### Technical Context
  This detection rule identifies malicious activities involving Microsoft Remote Desktop Protocol (RDP) sessions, specifically targeting the use of the `tsclient` share to place a backdoor on a victim machine’s startup folder. The suspected threat actor seeks to gain unauthorized persistence on the machine, enabling them to execute malicious payloads at system startup. Through this method, attackers can maintain control over the system even after the original RDP session is terminated.

  The threat scenario typically involves attackers exploiting legitimate RDP access to create a foothold for future operations, such as lateral movement within a targeted network. In this context, the relevant MITRE ATT&CK tactics include "Command and Control" (Tactic ID: TA0011) and "Credential Access" (specifically T1219.002: `Remote Desktop Protocol`). The primary data source for detecting such activities includes file creation events in system directories, specifically targeting logs that capture file events related to the `Startup` folder on Windows systems.

  ### Investigation Steps
  - **Review File Creation Events:** Examine file event logs for new files created in the `C:\Users\<UserName>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\` directory around the time of the RDP session. Look for unusual filenames or file types.
  - **Analyze RDP Session Logs:** Check RDP connection logs for unusual session activities, especially if the session was established from non-standard or geographically diverse IP addresses. Cross-reference these with file creation times to establish links.
  - **Inspect tsclient Share Activity:** Investigate any file transfers or access events associated with the `tsclient` share during RDP sessions. Note any unexpected file writes or accesses to the startup folder.
  - **Conduct Process Auditing:** Validate any processes executed during the RDP session. Confirm whether legitimate processes (e.g., `mstsc.exe`) were used in conjunction with suspicious file drops. Look for anomalies in process trees originating from these RDP sessions.

  ### Prioritization
  This alert is categorized as high severity due to the potential for attackers to maintain persistent access to compromised systems, which facilitates further lateral movement and exploitation across the enterprise environment.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if certain logging configurations are not enabled on host systems, particularly for file system events. Assumptions made by the detection logic include the attacker’s reliance on standard RDP tools and behavior aligned with common persistence mechanisms. Furthermore, environments with legitimate usage of RDP and the `tsclient` share may present a higher risk of false negatives if these typical patterns are not closely monitored. Proper configuration of file event logging is essential for accurate detection of this behavior.

