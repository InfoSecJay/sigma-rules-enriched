  ---

  ### Technical Context

  This rule detects the creation or modification of files in the Startup folder of a Windows machine using `mstsc.exe`, the Microsoft Remote Desktop Connection client. This behavior is indicative of an attacker trying to establish persistence by placing a backdoor that executes automatically during the next login on the compromised system. The relevant MITRE ATT&CK tactic is "Persistence" and the technique is T1219.002 (Remote Desktop Protocol) which involves hijacking legitimate remote desktop sessions to execute further actions.

  The primary telemetry sources include Windows file event logs, specifically focusing on file creation and access within the Startup directory. If the detected activity is malicious, it may allow the attacker to maintain access to the target machine even after initial intrusion vectors are closed. Importantly, this detection does not confirm whether the file itself is malicious or if the activity is part of legitimate user behavior.

  ---

  ### Investigation Steps

  - **Analyze event logs for file creation**: Investigate Windows file event logs (Event ID 4663) for any file creation events in `C:\Users\<username>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\`. Check for files created by `mstsc.exe`.

  - **Check file properties of new items**: Review newly created files in the Startup folder, focusing on `FileName`, `FileSize`, and `CreationTime` attributes to determine if they have attributes typical of malware, such as obfuscation or unusual file extensions (e.g., `.exe`, `.bat`).

  - **Correlate with user activity**: Validate whether the user connected to the RDP session was performing legitimate remote access tasks. Review Event ID 4624 in Security logs for successful logons and correlate with timestamps of file modifications.

  - **Identify command and control indicators**: Look for additional lateral movement indicators by checking for outbound connections from the host to suspicious domains or IPs post-session using Windows Firewall logs (Event ID 5156) or Sysmon logs.

  - **Review for multiple instances of same behavior**: Track if there were multiple instances of file creations in the same hour or unusual patterns in multiple hosts, indicating mass deployment. Use Sysmon Event ID 1 to ascertain process creation stemming from the same RDP session.

  ---

  ### Prioritization

  This alert is of high severity due to its ability to establish persistence, which can facilitate further lateral movement and data exfiltration. The likelihood of malicious abuse is high, particularly in environments with sensitive data, as RDP hijacking is a known method employed by adversaries to sustain access.

  ---

  ### Blind Spots and Assumptions

  Detection depends on the correct configuration of Windows file event logging, as absence may leave exploitable gaps. Evasion techniques could involve attackers using legitimate administrative tools or scripting to modify Startup items without generating detection logs. High-frequency legitimate tasks such as software installations or maintenance scripts could trigger the alert, necessitating thorough contextual review. A companion detection might involve monitoring for unusual changes in file creation patterns across critical assets, which would further strengthen coverage against such activities.

