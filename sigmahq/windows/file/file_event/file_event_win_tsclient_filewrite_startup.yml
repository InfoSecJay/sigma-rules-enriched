  ---

  ### Technical Context

  This Sigma rule detects instances where a Remote Desktop Protocol (RDP) client (mstsc.exe) is used to place a file in the startup folder of the host machine. This behavior is commonly indicative of an attacker attempting to establish persistence on the compromised system by using a legitimate RDP session to drop malicious payloads. The manipulation of the startup folder aligns closely with MITRE ATT&CK tactics of Persistence (TA0003) and Lateral Movement (TA0008), specifically through the technique of Remote Service Session Hijacking (T1219.002).

  The primary telemetry for this detection comes from file system events, particularly focusing on the creation of files within the startup directory. If successful, an attacker could maintain access and control over the affected system, allowing further exploitation. Importantly, this detection alone does not confirm active malicious intent; benign uses of RDP may trigger similar alerts under specific conditions.

  ---

  ### Investigation Steps

  - **Review file creation events:** Check for **Windows Security Event ID 4663** to identify file creation in the Startup directory (`C:\Users\<username>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\`). Look for unusual file names or timestamps that do not align with normal user activity.

  - **Investigate the RDP session:** Examine **Event ID 4624** (An account was successfully logged on) to find details about RDP logins. Correlate timestamps with the file creation events. Check for non-standard users accessing critical hosts.

  - **Analyze parent-child process relationships:** Look at **Sysmon Event ID 1** (Process creation) to identify the launch context of `mstsc.exe`. Identify if any child processes originate from `mstsc.exe` that could indicate malicious activity.

  - **Evaluate legitimate usage patterns:** Confirm expected behavior of RDP usage by reviewing operational documentation or user activity logs. Authorized users may have legitimate reasons to modify startup applications.

  - **Identify malicious indicators:** Look for known executable hashes or unusual file types placed in the startup folder. Cross-reference any detected files against threat intelligence sources to identify potential backdoors.

  - **Check for lateral movement scenarios:** Review logs from additional hosts that were accessed after the potential compromise. Look for use of `mstsc.exe` as a remote tool and any associated file drops or script executions that may indicate a broader lateral movement pattern.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential for a backdoor on high-value assets and the likelihood of exploitation if unauthorized access is confirmed. The behavior is often weaponized in lateral movement scenarios, placing critical assets at risk.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use different methods to establish persistence, such as using scheduled tasks or registry modifications instead of the startup folder. Reliable detection requires consistent logging of file events and RDP sessions. Legitimate tasks, such as IT maintenance or automated scripts, could trigger this detection as well. A related detection might include monitoring for abnormal RDP session behavior or file modifications in the user's profile, complementing coverage of suspicious lateral movement activities.

