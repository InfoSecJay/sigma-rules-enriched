title: DLL Search Order Hijackig Via Additional Space in Path
id: b6f91281-20aa-446a-b986-38a92813a18f
status: test
description: |
  Detects when an attacker create a similar folder structure to windows system folders such as (Windows, Program Files...)
  but with a space in order to trick DLL load search order and perform a "DLL Search Order Hijacking" attack
references:
- https://twitter.com/cyb3rops/status/1552932770464292864
- https://www.wietzebeukema.nl/blog/hijacking-dlls-in-windows
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-30
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|startswith:
    - 'C:\Windows \'
    - 'C:\Program Files \'
    - 'C:\Program Files (x86) \'
    TargetFilename|endswith: '.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects attempts to carry out DLL Search Order Hijacking, a technique where attackers create directories mimicking legitimate Windows system paths, but with added spaces. This manipulation tricks the Windows loader into searching these paths first for Dynamic Link Libraries (DLLs), leading users to load malicious code instead of the legitimate system DLL. The primary objective for an attacker employing this tactic is privilege escalation or the execution of malicious payloads under the guise of trusted system processes, facilitating stealthy attacks and persistence within the environment.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Persistence (TA0003)**: Methods used to maintain access to systems over time.
  - **Privilege Escalation (TA0004)**: Gaining higher privileges within the system.
  - **Defense Evasion (TA0005)**: Techniques aimed at avoiding detection and evasion of defenses.
  - **DLL Search Order Hijacking (T1574.001)**: A specific technique under privilege escalation that involves manipulation of the DLL loading process.

  The primary data sources for this detection are file event logs, specifically monitoring for the creation and modification of file paths that resemble legitimate Windows directories, while containing anomalies such as spaces or other deviations.

  ### Investigation Steps
  - **Review File Events**: Examine file event logs for DLL files created in non-standard paths that simulate legitimate directories, particularly those with additional spaces in the names.
  - **Analyze Process Creation Events**: Check for processes that have accessed or loaded suspicious DLLs from the identified paths, which could indicate exploitation attempts using those hijacked DLLs.
  - **Inspect System Configuration**: Validate the integrity of system folders for unusual file structures and ensure no unauthorized changes have been made to system directory names.
  - **Query Device and User Behavior**: Investigate user and device behavior patterns around the time the suspicious DLLs were created to identify potential compromises and lateral movement.

  ### Prioritization
  The severity of this alert is high due to the potential impact of successfully executing a DLL hijacking attack, which can lead to unauthorized access and control over critical systems. Given that the likelihood of such tactics being employed by attackers is significant, timely responses are essential.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage for scenarios where legitimate applications or system updates also create similarly named folders with spaces, leading to potential false positives. Additionally, it assumes that file event logging is comprehensive and properly configured to capture all relevant changes within the Windows system directories. Ensuring complete visibility into file system events is crucial for this alert's effectiveness, including monitoring for file system permissions and access control changes that could indicate malicious activity.

