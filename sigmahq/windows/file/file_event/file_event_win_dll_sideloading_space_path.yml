title: DLL Search Order Hijackig Via Additional Space in Path
id: b6f91281-20aa-446a-b986-38a92813a18f
status: test
description: |
  Detects when an attacker create a similar folder structure to windows system folders such as (Windows, Program Files...)
  but with a space in order to trick DLL load search order and perform a "DLL Search Order Hijacking" attack
references:
- https://twitter.com/cyb3rops/status/1552932770464292864
- https://www.wietzebeukema.nl/blog/hijacking-dlls-in-windows
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-30
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|startswith:
    - 'C:\Windows \'
    - 'C:\Program Files \'
    - 'C:\Program Files (x86) \'
    TargetFilename|endswith: '.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts at DLL Search Order Hijacking via the creation of directories that resemble legitimate Windows system folders, but include an additional space in their names. The attacker's objective is to manipulate the DLL loading process to execute malicious code instead of the intended legitimate DLL. This behavior primarily maps to the MITRE ATT&CK technique for DLL Search Order Hijacking (T1574.001).

  The primary telemetry source for this detection involves file event logs that capture file creation actions on Windows systems. If successful, this attack can lead to privilege escalation or execution of arbitrary code. However, detection by this rule does not confirm malicious intent on its own; it requires further context to differentiate between benign and malicious usage.

  ### Investigation Steps

  - **Correlate file events against known valid paths**: Review file creation events (Windows Event ID 4663) for newly created folders under `C:\Windows \`, `C:\Program Files \`, and `C:\Program Files (x86)`. Validate legitimate processes and timings of creation. Legitimate folders will not usually have a space following the drive letter or the folder name.

  - **Inspect the TargetFilename for anomalies**: Analyze logs for `TargetFilename` with additional spaces that end with `.dll`. Look for unusual folder names mimicking system directories. Malicious examples might include `C:\Windows \maliciousfolder.dll`.

  - **Review process creation logs for related activity**: Check for associated process creation (Windows Event ID 4688 or Sysmon Event ID 1) that launched after the anomalous folder was created. Suspicious parent processes or command-line arguments may indicate exploitation attempts.

  - **Identify and analyze file access patterns**: Look for subsequent accesses to the DLLs in these suspicious folders in File (Windows Event ID 4663) and process logs. Frequent access followed by abnormal user account activity can indicate malicious exploitation.

  - **Assess user context and asset criticality**: Verify whether the account that created the suspicious paths is legitimate and analyze its associated privileges. Creation by a non-administrative user on highly critical assets (e.g., Domain Controllers) raises the alert severity.

  ### Prioritization

  This alert is high severity due to the potential impact on system integrity and the likelihood of malicious abuse. DLL Search Order Hijacking is a known exploitation method, commonly used by adversaries to achieve persistence and evade detection.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if file event logging is not properly configured or if low-fidelity logs exist for legitimate activities that mimic the alerting behavior. Users creating valid folder structures for application installations may inadvertently trigger this alert. A related detection for monitoring suspicious DLL loading events or system changes (such as monitor event logs for Event ID 1033) can provide complementary coverage and bolster investigation.

