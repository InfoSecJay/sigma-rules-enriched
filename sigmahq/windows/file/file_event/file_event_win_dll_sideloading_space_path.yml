title: DLL Search Order Hijackig Via Additional Space in Path
id: b6f91281-20aa-446a-b986-38a92813a18f
status: test
description: |
  Detects when an attacker create a similar folder structure to windows system folders such as (Windows, Program Files...)
  but with a space in order to trick DLL load search order and perform a "DLL Search Order Hijacking" attack
references:
- https://twitter.com/cyb3rops/status/1552932770464292864
- https://www.wietzebeukema.nl/blog/hijacking-dlls-in-windows
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-30
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1574.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|startswith:
    - 'C:\Windows \'
    - 'C:\Program Files \'
    - 'C:\Program Files (x86) \'
    TargetFilename|endswith: '.dll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects behaviors indicative of DLL search order hijacking, specifically when an attacker attempts to create folder structures resembling legitimate Windows directories but with added spaces (e.g., "C:\Windows \"). The likely attacker objective is to introduce malicious DLLs into the search path, allowing them to be loaded instead of the genuine Windows DLLs, enabling persistence or privilege escalation. This behavior aligns with the MITRE ATT&CK technique T1574.001 (DLL Search Order Hijacking).

  The primary telemetry source for this detection involves file event logs from Windows, particularly tracking file modifications in critical directories. If malicious, this technique could lead to exploits accessing sensitive data or executing unauthorized code. Importantly, this detection does NOT confirm that malicious activity has occurred; further investigation is needed to ascertain the intent behind the directory access.

  ### Investigation Steps

  - **Identify suspicious folders:** Check for newly created folders in `C:\Windows \`, `C:\Program Files \`, and `C:\Program Files (x86) \`. Use file event logs (Security Event ID 4663 or Sysmon Event ID 10) to find unusual paths or timestamps that may not align with legitimate application installations.

  - **Examine the DLL files:** For any detected folder leveraging a space (e.g., "C:\Windows \mydll.dll"), review the properties and digital signatures of any .dll files present. Legitimate DLLs typically have recognizable publisher signatures (e.g., Microsoft). Any unsigned or unusual DLLs may indicate malicious activity.

  - **Check user context:** Look at the user accounts that triggered the file creation events (Event ID 4663). If the creation was performed by service accounts or users with low activity levels, it can raise suspicion for potential abuse.

  - **Review related process activity:** Cross-reference with process execution logs (Security Event ID 4688 or Sysmon Event ID 1) to identify any unexpected processes that reference these directories or DLLs. Malicious processes will often attempt to execute from these hijacked paths.

  - **Identify legitimate administrative activity:** Investigate if there are any recent administrative tasks or software installations in the environment correlating with the detected folders. System administrators may create similar paths for testing purposes; distinguishing these from compromised activities is essential.

  - **Monitor for exfiltration attempts:** Validate if there is any associated network activity suggesting data exfiltration after folder creation (using firewall or proxy logs). Look for outbound connections corresponding to the suspicious DLL paths that were created.

  ### Prioritization

  This alert is high severity due to its potential impact on system integrity and security, particularly if the affected system is a server or domain controller. The likelihood of malicious abuse is elevated, as DLL hijacking techniques are frequently weaponized in advanced persistent threat (APT) activities.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate software installers inadvertently creating folders with spaces, as well as evasion techniques such as renaming or encoding folder names. Reliable detection requires comprehensive logging of file system activities, especially around sensitive directories, which may not be consistently configured across all environments. Finally, companion detections for file creation in critical paths (e.g., abnormal patterns of creation in `%TEMP%` or documented software installation activity) could strengthen overall coverage against this type of attack.

