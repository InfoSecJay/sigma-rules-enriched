title: PowerShell Module File Created
id: e36941d0-c0f0-443f-bc6f-cb2952eb69ea
status: test
description: Detects the creation of a new PowerShell module ".psm1", ".psd1", ".dll",
  ".ps1", etc.
references:
- Internal Research
- https://learn.microsoft.com/en-us/powershell/scripting/developer/module/understanding-a-windows-powershell-module?view=powershell-7.3
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-09
tags:
- attack.persistence
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|contains:
    - '\WindowsPowerShell\Modules\'
    - '\PowerShell\7\Modules\'
  condition: selection
falsepositives:
- Likely
level: low
note: |
  ### Technical Context
  This rule detects the creation of new PowerShell module files, specifically those with file extensions such as ".psm1", ".psd1", ".dll", and ".ps1". The creation of these files often indicates the installation of new modules or scripts, which can be used for legitimate automation purposes. However, in the hands of an attacker, the creation of these modules may be part of a broader strategy to establish persistence or automate tasks in a compromised environment.

  Attackers may use PowerShell extensively due to its powerful capabilities for scripting and system interaction. By creating malicious PowerShell modules, attackers can maintain persistent access, execute malicious payloads, or obfuscate their activity within a target system. As such, this behavior directly relates to the MITRE ATT&CK persistence tactic (TA0003) through techniques such as "PowerShell" (T1086) and "Scripting" (T1064).

  Relevant data sources for detecting this activity primarily include file event logs from Windows systems, which monitor the creation of files, alongside potentially useful information from PowerShell logs or security event logs that capture process creation and command executions.

  ### Investigation Steps
  - **Review File Creation Events:** Examine recent file creation logs for new PowerShell module files in the specified directories, particularly under `\WindowsPowerShell\Modules\` and `\PowerShell\7\Modules\`. Pay close attention to anomalous file names or unusual extensions.

  - **Analyze PowerShell Command History:** Look into the execution history of PowerShell commands to identify any recent command executions that correspond with the timing of the file creation. Commands that involved module installation or script execution should be prioritized.

  - **Correlate with User Activity:** Investigate the user account responsible for creating the files. Validate whether the user is authorized to perform such actions, check for any unusual access patterns, and cross-reference with authentication logs.

  - **Check Process Creation Logs:** Review process creation logs for any instances of `powershell.exe` or `pwsh.exe` executed close in time to the file creations. Identify if these processes were executed by uncommon users or from outside expected contexts.

  ### Prioritization
  The alert's severity is classified as low because while the creation of PowerShell modules may indicate malicious behavior, it can also stem from legitimate administrative actions. The context surrounding the creation, such as user behavior and system baseline, significantly influences its interpretation.

  ### Blind Spots and Assumptions
  This detection rule may not capture instances where the malicious modules are created through methods other than the direct invocation of PowerShell, such as scheduled tasks or via alternate runners. It assumes that PowerShell logging and file event logging are properly configured to capture the relevant events. Any lack of logging configurations or oversight in user privileges may result in missed detections.

