  ---

  ### Technical Context

  This rule detects the creation of PowerShell modules and related files, including ".psm1", ".psd1", ".dll", and ".ps1". The likely attacker objective is to establish persistence or introduce malicious functionality via custom scripts or modules. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003), specifically technique T1135: Access Token Manipulation.

  Primary telemetry sources include Windows file system monitoring logs, specifically tracking file events for PowerShell executable paths. If malicious, the security impact could range from unauthorized script execution to privilege escalation. It is important to note that this detection does NOT confirm that the PowerShell module is malicious; legitimate updates or configurations may also trigger this alert.

  ---

  ### Investigation Steps

  - **Check the creation timestamp of the file**: Review the file creation timestamp of any new files in `\WindowsPowerShell\Modules\`. Compare with other system activity around the same time to identify anomalies.

  - **Identify the user and system context**: Cross-reference Event ID 4663 in the Security Event Log to identify which user and process (Image) created the file. Ensure that the user has legitimate reasons to modify module files.

  - **Review PowerShell command history**: Examine `PowerShell` command history for commands executed prior to file creation. Review for suspicious commands like `New-Item` or `Invoke-WebRequest` that may indicate malicious file downloading or stitching.

  - **Validate the nature of the created module**: Assess the contents of the newly created module file (if permissible) to look for indicators of malicious intent, such as obfuscated code or calls to external IP addresses.

  - **Identify benign behaviors**: Consider legitimate scenarios like system updates or application installations that might cause similar file activity. Document common organizational practices around PowerShell usage for comparatives.

  - **Look for other related artifacts**: Investigate other file events, such as if associated DLLs were created alongside the module. This could indicate broader malicious activity or a direct follow-up on the alert.

  ---

  ### Prioritization

  This alert is of low severity in an enterprise context due to its common usage for legitimate software development and administrative tasks within PowerShell. However, the likelihood of malicious abuse exists, particularly in environments where PowerShell is heavily utilized, making vigilance necessary.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through file renaming or using alternative methods for execution that do not depend on module creation. Reliable detection requires comprehensive monitoring of PowerShell-related activities and file system events. Legitimate activities that might trigger this alert include authorized scripts being deployed by system administrators. Companion detections such as monitoring PowerShell command execution (Event ID 4104) can strengthen overall security coverage.

