note: |
  ### Technical Context

  This Sigma rule detects the creation of new PowerShell module files, such as `.psm1`, `.psd1`, `.dll`, and `.ps1`, within specific PowerShell module directories. The likely attacker objective is to establish persistence or enable further exploitation by deploying malicious or unauthorized modules that can evade detection. This activity relates to the MITRE ATT&CK tactic of persistence (TA0003), particularly employing custom code (T1059.001) or scripting (T1064).

  The primary telemetry sources include File Event logs from Windows, focusing specifically on paths that contain `\WindowsPowerShell\Modules\` or `\PowerShell\7\Modules\`. If malicious, the creation of these modules could allow the adversary to execute arbitrary commands or maintain persistent access. It is important to note that this detection alone does not confirm malicious intent, as legitimate administrative activities may involve creating or updating PowerShell modules.

  ### Investigation Steps

  - **Inspect recently created module files**: Review File Event logs (Security Event ID 4663 or Sysmon Event ID 11) for the creation of `.psm1`, `.psd1`, `.dll`, or `.ps1` files in the targeted directories. Check timestamps and file contents for signs of malicious activity, such as obfuscated code or execution of unauthorized scripts.

  - **Correlate with process activity**: Search for associated parent processes in Sysmon logs (Event ID 1) that invoked PowerShell, specifically `powershell.exe` or `pwsh.exe`, during the timeframe of module creation. If invoked by unusual or non-privileged user accounts, this raises suspicion.

  - **Verify installation of legitimate PowerShell modules**: Look for known legitimate modules under the same directory structure. Legitimate updates or installations typically include recognizable module names and should involve administrative users or scheduled tasks.

  - **Check for command history**: Investigate PowerShell command history (if available) for the executing user. Identify any unusual commands that correlate with module creation, such as those involving `Install-Module` or `New-Module` that may point to malicious intent.

  - **Review user account behavior**: Analyze user account activity in Security logs (Event ID 4624) to determine if accounts associated with the module creation have exhibited unusual access patterns, such as elevated privileges or access during non-business hours.

  ### Prioritization

  This alert has a low severity in a mature enterprise context, as it may indicate benign administrative tasks or module updates. However, if identified on critical assets, especially servers or high-value targets, there could be a higher potential for abuse. This specific behavior is not one of the most commonly weaponized actions, but could serve as a precursor to more serious attacks.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate administrative tasks, such as module updates or new tool installs by IT personnel, may trigger this alert without malicious intent. Accurate detections rely on properly configured log sources such as Audit File System (AFS) and Sysmon; any misconfigurations could lead to gaps in visibility. Commonly associated detections include searching for abnormal PowerShell script execution patterns (related to T1094 - PowerShell Profile).

