note: |
  ### Technical Context
  This rule detects potential homoglyph attacks by identifying filenames containing Unicode characters that visually resemble standard ASCII characters. Attackers may employ these homogeneous characters to obfuscate malicious files, disguising them as benign documents or executable files to trick users into executing or opening them. For instance, a file named "report.doc" could instead have a filename that uses similar-looking Unicode characters, making it easy for unsuspecting users to be deceived.

  The objective of such attacks is often to deliver malware or phishing attempts while evading basic security measures that may depend on keyword or name-based filtering. A successful homoglyph attack can lead to the execution of malicious code, information theft, or unauthorized access to systems. This detection falls under the MITRE ATT&CK techniques of "Obfuscated Files or Information" (T1027) and "Masquerading" (T1036), specifically focusing on "Masquerading by Using Homoglyphs" (T1036.003).

  Primary data sources for this detection include file event logs from endpoint systems, particularly those that capture file creation and modification events on Windows machines. These logs will provide visibility into changes to the filesystem, revealing potentially illegitimate filename patterns that warrant further investigation.

  ### Investigation Steps
  - **Review File Event Logs:** Analyze file event logs on endpoints for processes that create or modify files with homoglyph characters in their names, paying attention to any unusual patterns or behaviors.
  - **Correlate with Process Creation Events:** Cross-reference detected filenames with their associated process creation events to identify the applications responsible for creating these files, focusing on any unfamiliar or unauthorized programs.
  - **Analyze User Activity:** Examine the user or account that interacted with the suspicious files. Determine if there are any anomalies, such as patterns inconsistent with their typical behavior or access rights.
  - **Seek Additional Context from Anti-Malware Solutions:** Utilize endpoint protection or threat detection solutions to identify if the flagged files have been referenced in any known threat intelligence databases or have triggered any alerts.

  ### Prioritization
  The alert is categorized as medium severity due to its potential for significant impact if exploited. While homoglyph attacks may not be widely prevalent, their successful execution can effectively enable other malicious activities, such as data exfiltration or lateral movement within an enterprise environment.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the inherent reliance on file event logs, which may not capture every method used to create or rename files, particularly in environments where logging may be restricted or improperly configured. The detection logic assumes that the presence of homoglyph characters correlates to malicious intent; however, legitimate use cases, particularly in multilingual contexts or cultural settings, could lead to false positives. Comprehensive logging configurations are required to ensure only relevant file events are captured for analysis, necessitating a balance between usability and security in multilingual user scenarios.

