note: |
  ### Technical Context

  This Sigma rule detects the use of Unicode homoglyphs—characters that visually resemble ASCII letters but are actually different in encoding—in filenames. The behavior indicates potential obfuscation attempts by an attacker trying to disguise malicious files to evade detection and confuse users. The likely attacker objective is to execute or distribute malware by masquerading as legitimate files. Relevant MITRE ATT&CK tactic includes “Defense Evasion” (TA0005), with the technique being “Obfuscated Files or Information” (T1036) and specifically “Homoglyph Attacks” (T1036.003).

  Primary telemetry sources include Windows file event logs, especially monitoring changes to filenames. The logs to focus on are those generating Event IDs related to file creation or modification. If malicious, the impact could be significant as it may lead to successful malware execution, data compromise, or system manipulation. However, this detection does NOT confirm malicious intent; it merely identifies potentially suspicious filenames that require further investigation.

  ### Investigation Steps

  - **Check Event ID 4663 for file access:** Review Security Event ID 4663 that includes the "Object Name" field corresponding to the detected filenames. Look for unusual access patterns—such as executions by system services that typically wouldn't interact with user files, which can indicate malicious activity.

  - **Evaluate process creation history:** Analyze Sysmon Event ID 1 for processes created that reference the identified filenames. Check the "Image" field for known executable paths and correlating hashes with known threats.

  - **Correlate with file path information:** Investigate the full path of the identified files in the context of their location—files in user directories could be benign, while those in temporary or system directories may indicate malicious activity.

  - **Identify legitimate usages of Cyrillic text:** If the filenames appear to be in Cyrillic or other non-ASCII scripts but are in contextually appropriate directories (like localized versions of applications), assess whether this behavior aligns with expected language use in affected regions to rule out false positives.

  - **Review associated network communications:** Monitor for outbound connections via Windows Firewall logs or EDR tools correlating with processed filenames. Analyze any unusual communication patterns or suspicious IP addresses linked to identified files, which could indicate an exfiltration attempt.

  ### Prioritization

  This alert should be treated with medium severity in an enterprise context due to the potential for significant impact if a legitimate system is compromised using sophisticated file evasion techniques. The likelihood of malicious abuse is present, given that attackers frequently exploit obfuscation tactics, although legitimate usage of homoglyphs can occur in regions where non-ASCII scripts are common.

  ### Blind Spots and Assumptions

  Detection may miss variant homoglyphs outside the current list or be circumvented by attackers using different encoding schemes. Reliable detection requires comprehensive configuration of Windows file event logging. Legitimate activities, such as users saving files in their native languages, may trigger false positives. Companion detections to consider include monitoring for abnormal executable behavior (e.g., execution from temporary directories) that may further verify if the identified files are malicious.

