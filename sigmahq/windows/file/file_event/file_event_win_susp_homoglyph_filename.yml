level: medium
note: |
  ### Technical Context

  This Sigma rule detects file events where filenames contain unicode homoglyph characters—characters that appear visually identical to ASCII characters, commonly used in obfuscation and phishing attacks. The likely attacker objective is to masquerade malicious files as legitimate ones to evade detection and trick users. This aligns with the MITRE ATT&CK tactics of Defense Evasion (Tactics ID: TA0040) and specifically Technique T1036.003 (Masquerading: Rename).

  The primary telemetry source for this detection is Windows file event logs, specifically targeting filenames. If malicious, this behavior can facilitate the delivery of malware or the execution of malicious scripts disguised as benign files. Notably, this detection does NOT confirm the presence of a malicious file on its own; further analysis is essential to establish intent and context.

  ### Investigation Steps

  - **Examine the alert context for filename patterns:** Look for filenames that contain suspicious homoglyphs as defined by the rule (e.g., using characters like "Ѕ" or "А"). Cross-reference with known malicious file patterns to identify high-risk files.

  - **Validate the file's characteristic metadata:** Review the file's creation and modification timestamps through Security Event ID 4663 to establish whether the activity is atypical for the asset in question, focusing on timestamps inconsistent with the expected operational pattern of legitimate files.

  - **Check the file's execution history:** Investigate Security Event ID 4688 (Process Creation) for any processes associated with the flagged files. Record the parent process and user context to evaluate whether this execution could be indicative of malicious behavior.

  - **Correlate with user behavior:** Assess User Account logs (Event ID 4624) to understand if the account involved has a history of legitimate access patterns. Investigate anomalies where an account typically not interacting with file systems suddenly generates a file with homoglyphs.

  - **Identify possible benign use cases:** Determine if the flagged filename is related to legitimate applications or files of local cultural relevance, particularly if using Cyrillic or other potentially legitimate unicode characters, which may warrant additional investigation or tuning of the detection rule.

  ### Prioritization

  The alert severity is medium, as the presence of homoglyphs may indicate an attempt at evading detection or executing malicious intent. However, the actual impact is contingent on the context of the affected system and whether the file is executed. The likelihood of this behavior being weaponized in phishing attacks increases its urgency for review.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false positives from legitimate filenames containing Cyrillic or other unicode characters for local use, which may necessitate ongoing tuning of the rule. Reliable detection requires consistent logging from file and process creation events; a lack of these logs can hinder investigation. Legitimate user-generated files or automated processes might inadvertently trigger the alert, so contextual review is critical. A related detection that strengthens coverage is monitoring for file execution patterns in correlation with unusual user behavior, which may provide additional insights into potential malicious activity.

