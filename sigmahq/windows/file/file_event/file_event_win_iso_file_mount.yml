title: ISO File Created Within Temp Folders
id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
status: test
description: Detects the creation of a ISO file in the Outlook temp folder or in the
  Appdata temp folder. Typical of Qakbot TTP from end-July 2022.
references:
- https://twitter.com/Sam0x90/status/1552011547974696960
- https://securityaffairs.co/wordpress/133680/malware/dll-sideloading-spread-qakbot.html
- https://github.com/redcanaryco/atomic-red-team/blob/0f229c0e42bfe7ca736a14023836d65baa941ed2/atomics/T1553.005/T1553.005.md#atomic-test-1---mount-iso-image
author: '@sam0x90'
date: 2022-07-30
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  category: file_event
  product: windows
detection:
  selection_1:
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - '.zip\'
    TargetFilename|endswith: '.iso'
  selection_2:
    TargetFilename|contains: '\AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\'
    TargetFilename|endswith: '.iso'
  condition: 1 of selection*
falsepositives:
- Potential FP by sysadmin opening a zip file containing a legitimate ISO file
level: high
note: |
  ### Technical Context
  This rule detects the creation of ISO files specifically within temporary folders commonly used by Outlook and general application data on Windows systems. The generation of an ISO file in these locations may indicate suspicious activity, as it aligns with the tactics, techniques, and procedures (TTPs) used by the Qakbot malware family, which has been known to exploit vulnerabilities in email attachments and social engineering to gain initial access to targets. Attackers may use ISO files to deliver payloads, such as malicious binaries or scripts, that can compromise a system post-exploitation.

  Relevant MITRE ATT&CK tactics include **Initial Access (TA0001)**, particularly leveraging techniques such as **Phishing (T1566.001)**, which can involve embedding malicious content in emails that leads to the creation of such files on the victim’s machine. Additionally, this behavior correlates with **T1553.005: Compromise of Software Dependencies and Development Tools**, where malicious ISO files may serve as a side-loading mechanism for malware.

  Primary data sources for this detection include **file event logs** that capture the creation of files in directories like `AppData\Local\Temp\` and `AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\`, which can provide critical insight into abnormal file creation activities.

  ### Investigation Steps
  - **Review File Creation Logs:** Check logs for ISO file creation within the specified temporary folders. Look for anomalies such as unusual timestamps or file sizes that deviate from typical user behavior.
  - **Examine Related Email Activity:** Investigate email inboxes for phishing attempts or suspicious attachments that could have led to the drop of the ISO file. Look for identifiers such as sender email addresses or subject lines that are commonly associated with phishing.
  - **Analyze Process Activity:** Look at process creation logs around the time the ISO was created. Identify any processes that may have executed to interact with or extract content from the ISO, particularly any that are unusual or not typically seen in email clients or user activity.
  - **Identify Network Connections:** Review network traffic logs for any outbound connections initiated after the ISO was created, especially if those connections involve known malicious IPs or domains associated with Qakbot or related malware families.

  ### Prioritization
  This alert is assigned a high severity due to the potential for significant harm; the presence of Qakbot can lead to credential theft and lateral movement within the environment, making timely detection and response critical.

  ### Blind Spots and Assumptions
  Potential gaps in detection may arise from false positives, particularly when legitimate administrative activities involve the use of zip files containing ISO images. The detection logic assumes that logs of all file creations are being captured and stored correctly in the logging architecture, which may not always be the case due to policy configurations. Ensuring that file event logging is appropriately configured on all systems is crucial for this alert to function reliably.

