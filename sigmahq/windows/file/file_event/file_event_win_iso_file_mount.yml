detection:
  selection_1:
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - '.zip\'
    TargetFilename|endswith: '.iso'
  selection_2:
    TargetFilename|contains: '\AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\'
    TargetFilename|endswith: '.iso'
  condition: 1 of selection*
falsepositives:
- Potential FP by sysadmin opening a zip file containing a legitimate ISO file
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of ISO files located in temporary folders, specifically within Outlook's cache or Windows temp directories. The likely attacker objective is to deliver and execute malicious payloads, commonly associated with the Qakbot malware, which leverages ISO files to sideload DLLs for initial access. Relevant MITRE ATT&CK techniques are "Phishing" (T1566.001) and "Sideloading" (T1553.005). The primary telemetry sources are file creation events in Windows' AppData directories, particularly targeting files with an `.iso` extension.

  The security impact of a malicious ISO file can range from unauthorized access to sensitive data to the installation of further malware. It is essential to understand that this detection does NOT confirm that the ISO file is malicious—it merely indicates the specific activity of creating an ISO file in these folders.

  ### Investigation Steps

  - **Check file creation events:** Review Windows Security Event ID 4663 for file create actions, specifically for files ending in `.iso` in the paths: `C:\Users\<username>\AppData\Local\Temp\` and `C:\Users\<username>\AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\`.

  - **Validate user actions:** Confirm if the user interacted with any zip files shortly before the creation event. Legitimate user activity often involves extracting or accessing files, leading to ISO creation by trusted software.

  - **Identify suspicious file attributes:** Inspect the creation timestamp of the ISO file along with its size and attributes. Malicious ISO files may have an unusually large or small size that doesn't correlate with typical software distributions.

  - **Search for concurrent process activity:** Use Sysmon Event ID 1 to check for processes that ran around the same time the ISO file was created. Look for unexpected executables, particularly those related to file extraction utilities or untrusted applications.

  - **Correlate with known malware indicators:** Cross-reference the hash of the created ISO file against threat intelligence databases. If the file matches known Qakbot indicators or other malicious signatures, escalate the alert for immediate remediation.

  - **Review user role and asset criticality:** Consider the role of the user who created the ISO. If the user is a sysadmin and has a legitimate reason for handling ISO files, assess the context of the activity further before concluding malicious intent.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on sensitive systems and data. Given the usage of ISO files in known malicious TTPs, including Qakbot, the likelihood of abuse is significant. This behavior is not common in legitimate operations, elevating the need for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may face limitations through environmental noise, particularly if system administrators frequently interact with zip files that contain legitimate ISO files. As a result, configuring file creation monitoring and ensuring detailed logging in critical asset environments is crucial for reliable detection. Legitimate activities such as software updates or application installations can inadvertently trigger this alert. Companion detections related to suspicious process execution (e.g., DLL side-loading behavior) can enhance overall coverage against the threat.

