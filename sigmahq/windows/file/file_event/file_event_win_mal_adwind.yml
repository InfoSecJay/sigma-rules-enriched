  ---

  ### Technical Context

  This rule detects the execution of `javaw.exe` from the AppData directory, a behavior associated with the Adwind Remote Access Trojan (RAT) and JRAT. The primary objective of an adversary utilizing this technique is to gain unauthorized remote access to victim systems, exfiltrate information, or deploy additional malicious payloads. This behavior maps to the MITRE ATT&CK technique for executing malicious scripts (T1059.007) and the execution of interpreted commands (T1059.005).

  The primary telemetry sources include Windows File Event logs specifically monitoring executable files, particularly those located in `C:\Users\<User>\AppData\Roaming\Oracle\bin\`. If this activity is indeed malicious, attackers can gain full control over the targeted system, leading to data breaches or lateral movement within an organization. It is crucial to note that this detection alone does not confirm malicious intent; further investigation is necessary to contextualize the behavior.

  ---

  ### Investigation Steps

  - **Review process execution logs:** Check Windows Security Event ID 4688 for the execution of `javaw.exe` from the specific path `C:\Users\<User>\AppData\Roaming\Oracle\bin\java.exe`. Malicious instances will have timestamps correlating with suspicious user activity.

  - **Identify related scripts:** Investigate if there are any concurrent executions of VBScripts from expected paths, particularly those containing `Retrive` in the filename. Event ID 4688 can help correlate the execution of these related file types.

  - **Validate legitimate usage:** Determine if the identified execution was initiated by a known application that requires Java, such as development environments or corporate applications. Legitimate usage often records business hours, specific user accounts, or application IDs.

  - **Check for file modification timestamps:** Analyze the file attributes of `javaw.exe` in the `AppData` directory; recent alterations or unexpected copies may indicate malicious tampering. Investigate with File System event logs for any modifications (Event ID 4670).

  - **Examine network connections:** Use logs from Windows Firewall or network monitoring tools to verify if `javaw.exe` initiated any outbound connections upon execution. Malicious behavior often correlates with suspicious outbound traffic to known malicious IP addresses.

  - **Look for persistence mechanisms:** Investigate any registry keys or scheduled tasks created by the application for persistence indications. Use the Windows Event Viewer to look for Task Scheduler logs related to `javaw.exe`.

  ---

  ### Prioritization

  The alert severity is high due to the potential for data exfiltration and remote access that could lead to further network compromise. Given that Adwind is commonly weaponized due to its effectiveness in compromising systems, rapid investigation is warranted. The impact on a system compromised by a RAT can be significant, potentially allowing full control by an attacker.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded through obfuscation techniques or modification of the executable's name and location. Reliable detection requires enabling comprehensive file change monitoring and ensuring AppData folder activity is logged. Legitimate applications that utilize Java may inadvertently trigger the alert, particularly for enterprise software. A related detection focusing on the execution of VBScripts could provide additional context to strengthen coverage for this type of threat.

