  ### Technical Context

  This Sigma rule detects the presence of `javaw.exe` within the AppData directory, specifically in paths associated with Oracle’s Java installation, which could indicate the use of the Adwind RAT (Remote Access Trojan) or JRAT (Java Rat). The likely objective of an adversary using this malware is to gain unauthorized remote access to the compromised machine, enabling data theft, system manipulation, and further propagation within the network. This detection correlates to the MITRE ATT&CK tactic of Execution (TA0002) and the techniques T1059.005 (Java) and T1059.007 (Script).

  Primary telemetry sources include Windows file event logs that capture file creation and modification actions. Specifically, the relevant log types are Sysmon Event ID 11 (FileCreate) and Windows Security Event ID 4663 (Access to an Object). The security impact of successful execution of this payload is high, as it could lead to significant data breaches and further intrusions in the network. However, this detection does NOT confirm that malicious activity is occurring on its own; legitimate Java applications or scripts may reside in similar locations.

  ### Investigation Steps

  - **Verify File Creation:**
    - Check for new instances of `javaw.exe` in `C:\Users\<username>\AppData\Roaming\Oracle\bin\`. Look for Sysmon Event ID 11 where `EventRecordID` matches recent timestamps.

  - **Analyze Related Script Files:**
    - Investigate for the presence of associated VBS files, specifically those containing `Retrive` in their filename, as they may indicate malicious behavior, correlating with Event ID 4663.

  - **Review Process Usage:**
    - Examine the parent process of any instance of `javaw.exe` invoked, especially if spawned from abnormal or suspicious processes, using Sysmon Event ID 1 (Process Creation). Legitimate Java applications generally originate from known and expected software installations.

  - **Check for Network Connections:**
    - Look for outbound connections initiated by `javaw.exe` using Network Event Logs or Sysmon Event ID 3 (Network Connection). Any connection to suspicious domains or unusual ports may indicate malicious activity.

  - **Correlate with User Behavior:**
    - Pull user activity logs to determine if there are patterns of unexpected script execution or file modifications linked to privileged users, contrasting legitimate scripted workloads against anomalies.

  - **Evaluate System Criticality:**
    - Identify the asset’s role and criticality (e.g., production server vs. user workstation). Higher criticality assets require immediate attention in the event of alert triggering.

  ### Prioritization

  The alert severity is high due to the potential impact of remote access and the ability for adversaries to exfiltrate sensitive information or introduce additional payloads on affected systems. The behavior associated with `javaw.exe` is notably weaponized within malware frameworks, making this an actionable alert calling for immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as renaming the `javaw.exe` file or placing payloads in different locations on the filesystem. Reliable detection requires the correct configuration of specific Windows event logging, including Sysmon installation for comprehensive coverage. Legitimate applications, especially development environments using Java, may trigger this alert, necessitating the context of the environment. A related detection would involve monitoring unusual content or execution patterns around VBS file types to further strengthen coverage of script-based attacks.

