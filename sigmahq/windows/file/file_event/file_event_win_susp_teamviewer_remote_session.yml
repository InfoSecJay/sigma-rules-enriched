note: |
  ### Technical Context

  This Sigma rule detects the creation of specific log files related to TeamViewer remote sessions. This behavior may indicate unauthorized remote access or malicious activities where the adversary is attempting to manipulate or exfiltrate data via a remote connection. The likely attacker objective is to maintain persistence, gather information, or perform lateral movement within the network. This aligns with the MITRE ATT&CK tactic **Command and Control (TA0011)**, specifically technique **Remote Access Tools (T1219.002)**. The primary telemetry sources include Windows file event logs capturing the creation of files within TeamViewer's directory. If malicious, the security impact could include data exfiltration, unauthorized access to sensitive information, or manipulation of system integrity. This detection does NOT confirm that malicious activity is occurring, as legitimate TeamViewer use can trigger the alert.

  ### Investigation Steps

  - **Check for legitimate activity:** Review the timestamps of the TeamViewer log files against known remote access activities in your organization. Confirm that the TeamViewer usage aligns with business hours and established remote support processes.

  - **Identify suspicious log file creation:** Look for the creation of `tvprint.db` or `TVNetwork.log` files (File Event IDs related to file creation) in the directory `C:\Program Files (x86)\TeamViewer\RemotePrinting\` and `C:\Program Files (x86)\TeamViewer\`, focusing on timestamps that correspond with unauthorized access, or out-of-hours activities.

  - **Examine the context of TeamViewer use:** Correlate the creation of TeamViewer logs (Event ID 4663 for file access) with user logons (Event ID 4624) to identify if the initiating user account has a history of legitimate access or if it raises flags for being a new or lower-privileged account.

  - **Search for unusual IP connections:** Look into system TCP/UDP connections (Event ID 5156 in Windows Firewall logs) to determine if the TeamViewer instance is communicating with known malicious IP addresses or unrecognized foreign locations.

  - **Assess potential exfiltration attempts:** If files are created during the session, review file transfer logs to check for any unusual outbound file transfers that coincide with the log creation events, indicating potential data exfiltration.

  ### Prioritization

  This alert has a medium severity due to the potential impact on sensitive systems when unauthorized remote access is achieved. The likelihood of malicious abuse is moderate, especially in environments where TeamViewer is commonly permitted. Given that attacks utilizing remote access tools are increasingly weaponized, proactive investigation is warranted.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as legitimate use of TeamViewer by authorized personnel that can trigger alerts. Required log sources must be correctly configured to capture file activities and remote connection events. Legitimate administrative activities may inadvertently trigger this alert, especially in support environments. A related detection to strengthen coverage would be monitoring unusual authentication patterns to TeamViewer's services or processes (e.g., Event ID 4776).

