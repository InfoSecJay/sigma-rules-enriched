title: TeamViewer Remote Session
id: 162ab1e4-6874-4564-853c-53ec3ab8be01
status: test
description: Detects the creation of log files during a TeamViewer remote session
references:
- https://www.teamviewer.com/en-us/
author: Florian Roth (Nextron Systems)
date: 2022-01-30
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  category: file_event
detection:
  selection1:
    TargetFilename|endswith:
    - '\TeamViewer\RemotePrinting\tvprint.db'
    - '\TeamViewer\TVNetwork.log'
  selection2:
    TargetFilename|contains|all:
    - '\TeamViewer'
    - '_Logfile.log'
  condition: 1 of selection*
falsepositives:
- Legitimate uses of TeamViewer in an organisation
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify the creation of log files associated with TeamViewer remote sessions. TeamViewer is a popular remote access tool that can be exploited by threat actors for unauthorized access to systems and data exfiltration. When a TeamViewer session is initiated or terminated, the application generates log files that may contain sensitive information about system activities and user interactions. Monitoring these logs can help detect suspicious remote access activity that may signify an attacker establishing command and control over a victim machine.

  In a potential threat scenario, an attacker might leverage TeamViewer to gain unauthorized access to a corporate system, aiming to steal sensitive data or conduct further malicious activities while masking their presence. To accomplish this, the attacker may use legitimate tools like TeamViewer to avoid detection. The relevant MITRE ATT&CK tactics associated with this behavior include *Command and Control* (TA0011) and *Remote Access Tools* (T1219.002).

  Primary data sources for this detection include file system event logs, specifically those pertaining to log file creation within the TeamViewer directory. These events can provide insights into unauthorized remote sessions, especially when correlated with other telemetry indicators pointing to malicious activities.

  ### Investigation Steps
  - **Review File Creation Events**: Examine file system logs for the creation of TeamViewer log files, especially `tvprint.db` and any files ending with `_Logfile.log`. Look for timestamps that coincide with reports of suspicious activity or known breaches.

  - **Cross-Reference User Activity**: Investigate the account associated with the log file creation. Determine if the user has a legitimate need for TeamViewer access and check for any unusual access patterns or times.

  - **Analyze Network Connections**: Inspect network logs for outbound connections initiated from the affected device during the time of TeamViewer session log file creation. Identify any unknown or suspicious IP addresses connected through TeamViewer.

  - **Correlate with Other Signals**: Look for other indicators of compromise within the environment, such as unusual authentication attempts, lateral movements, or other command and control behaviors that may coincide with the detected TeamViewer sessions.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of unauthorized remote access, which could result in data breaches or system compromise if exploited. Given the legitimate use of TeamViewer within organizations, false positives may occur, hence the necessity for contextual investigation to validate alerts.

  ### Blind Spots and Assumptions
  This detection rule may miss unauthorized TeamViewer sessions where log file creation is disabled or if log files are stored in an alternate directory not monitored by the rule. There is an assumption that all installations of TeamViewer are configured similarly and generate logging in the expected paths. Furthermore, it relies on the collection of file event logs specific to the Windows operating system, and any missing or misconfigured logging settings could hinder the effectiveness of this detection strategy.

