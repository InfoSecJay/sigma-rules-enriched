detection:
  selection:
    TargetFilename|contains:
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Windows\System32\Tasks\'
    - ':\Windows\Tasks\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
    TargetFilename|endswith: '.sed'
  condition: selection
