note: |
  ### Technical Context

  This rule detects the creation of hidden directories or files leveraging the "::$INDEX_ALLOCATION" NTFS stream. Attackers might use this technique to conceal malicious files from standard file management tools, avoiding detection during forensic investigations or monitoring activities. The relevant MITRE ATT&CK technique for this behavior is **"Hidden Files and Directories" (T1564.004)**.

  The primary telemetry source involves file event logs from the Windows operating system that detect the creation of files or directories using this specific stream format. If exploited maliciously, this behavior can lead to unauthorized access or manipulation of sensitive data. Importantly, this detection alone does NOT confirm actionable malicious intent; further investigation is required to understand the context of the activity.

  ### Investigation Steps

  - **Verify file creation logs:** Check for file events using Event ID 4663 in the Windows Security logs where the `ObjectType` field indicates a directory or file using `::$INDEX_ALLOCATION`.

  - **Correlate with user activity:** Review command history or event logs (Sysmon Event ID 1 or command line history) around the time of the detected activity to check if known malicious commands or scripts were executed.

  - **Assess asset criticality:** Identify the host executing this operation. High-value assets (like domain controllers) warrant increased scrutiny compared to standard user workstations.

  - **Examine legitimate behavior:** Determine if recent administrative activity or system maintenance tasks correlate with the time of the alert. Legitimate users might create hidden streams for configuration or software installation.

  - **Identify high-confidence indicators:** Look for multiple instances of `::$INDEX_ALLOCATION` streams across various files on the affected host within a short timeframe, as this may indicate malicious intent.

  - **Collect additional context:** Review Windows Event ID 5145 logs for details about the file system access rights and any anomalous access attempts to the directory associated with `::$INDEX_ALLOCATION` streams.

  ### Prioritization

  This alert should be treated with medium priority. The involved file system manipulation can lead to serious security incidents, especially on critical systems. Given that this evasion technique is relatively uncommon but effective, its occurrence may indicate an advanced adversary, thus warranting prompt review.

  ### Blind Spots and Assumptions

  Detection limitations include the inability of standard logging to capture this stream in real-time, leading to potential stealthy activity. Enabling detailed file auditing and ensuring monitoring tools are properly configured are essential for reliable detection. Legitimate activities that may trigger this alert could include backups or specialized software configurations. A complementary detection to consider is monitoring for unusual process creation (e.g., Event ID 4688) to further validate the context surrounding file creation attempts.

