note: |
  ### Technical Context

  This Sigma rule detects the creation of hidden files or folders using the NTFS `::$index_allocation` stream, which is a method adversaries may use to conceal data from standard file browsing tools such as Explorer or PowerShell. The objective of an attacker using this technique is typically to hide malicious payloads, exfiltration data, or tools from forensic analysis and endpoint security solutions. This behavior aligns with the MITRE ATT&CK technique T1564.004 (Hide Artifacts).

  The primary telemetry source for this detection is generated from Windows file event logs, specifically monitoring changes related to file streams within NTFS. The presence of such hidden directories could signify a grave security incident, potentially involving data theft or covert persistence mechanisms. However, this detection does NOT confirm malicious intent on its own; legitimate administrative actions or specific applications may also utilize hidden streams for valid purposes.

  ### Investigation Steps

  - **Review event logs for index allocation creation:** Check Windows File Event logs (Event ID 4663) for entries indicating access to file streams containing `::$index_allocation` as part of TargetFilename.

  - **Analyze file creation times:** Cross-reference the timestamps of hidden folder or file creation with known user activities or scheduled tasks. Legitimate activity might show creation times correlating with administrative tasks or application installations.

  - **Identify associated process creation:** Look into the process responsible for creating the hidden file/folder by querying Sysmon Event ID 1 reports or Windows Security Event ID 4688 to trace back the command lines or parent processes involved.

  - **Correlate EDR logs for command history:** If utilizing an EDR like Crowdstrike, investigate the command-line history for legitimate users and sessions accessing `::$index_allocation` to determine if the access aligns with expected user behavior.

  - **Evaluate user roles and activity context:** Determine if the user account responsible for the creation has administrative privileges or is a non-privileged user. Suspicious behavior from a low-privileged user attempting to hide instances may indicate potential compromise.

  ### Prioritization

  Given the medium severity level of this alert, its impact can be significant, especially if it pertains to critical or sensitive systems. The likelihood of malicious abuse is high, as this evasion technique is commonly exploited by sophisticated adversaries trying to conceal their actions. The stealthy nature of this behavior heightens its urgency for investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion using legitimate user accounts and normal administrative processes that may inadvertently trigger this rule. Reliable detection requires comprehensive logging configurations for file event telemetry; some systems may lack visibility into hidden streams. Legitimate activities that could trigger this alert include IT operations managing backups or system updates. A related detection to bolster coverage would be monitoring for Process Creation and use of PowerShell commands that manipulate file streams, which can indicate an attempt to interact with hidden files.

