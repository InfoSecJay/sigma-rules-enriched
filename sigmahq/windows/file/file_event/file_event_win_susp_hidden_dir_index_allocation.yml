note: |
  ### Technical Context
  This detection rule is designed to identify the creation of hidden files or directories in Windows NTFS file systems by leveraging the special "::$index_allocation" stream. Attackers may use this technique as a stealth method to evade detection from traditional file listing tools such as Windows Explorer or PowerShell. Creating hidden directories could serve various malicious objectives, including hiding exfiltrated data, persistent malware, or concealing command and control (C2) infrastructure setup.

  Relevant MITRE ATT&CK Tactics and Techniques include:
  - **Defense Evasion** (TA0005)
    - **T1564.004 - Hidden Files and Directories:** This specific technique focuses on employing hidden file system features to avoid detection, making this rule particularly relevant to scenarios where attackers aim to secretly operate within a compromised environment.

  The primary data sources for this detection include file event logs from Windows systems, particularly focusing on changes that reveal the creation or modification of NTFS streams.

  ### Investigation Steps
  - **Review File Event Logs:** Check the Windows file event logs for any entries that indicate the creation of files or directories with the "::$index_allocation" stream. Pay close attention to the timestamps and user accounts associated with these events.

  - **Analyze Command History:** If available, analyze command line history from EDR solutions to identify any commands that might have been used to create the hidden streams. Look for patterns or commands that deviate from standard administrative behavior.

  - **Correlate with User Activity:** Assess the context of the user account and its activities around the time the hidden directory was created. Investigate any unusual user behavior or access to sensitive areas of the network that could correlate with this detection.

  - **Check For External Access:** Investigate any external connections (e.g., RDP sessions) or unusual network traffic around the time of the suspicious file creation. This will provide insight into whether the suspicious activity was part of a larger attack vector.

  ### Prioritization
  This alert should be treated with medium priority due to the potential implications of hidden directory creation, which could indicate an ongoing compromise or an effort to establish persistence within the network. The likelihood of detection is high, given the specific nature of the technique used.

  ### Blind Spots and Assumptions
  This detection rule may have blind spots, particularly in environments where EDR solutions do not log command histories effectively, or where file event logging is not properly configured. There may also be assumptions that users with legitimate administrative access would not commonly engage in such techniques, potentially overlooking insider threats. Therefore, ensuring that logs from file events and terminal sessions are actively collected and monitored is crucial for the effectiveness of this detection logic.

