logsource:
  product: windows
  category: file_event
detection:
  selection:
  - TargetFilename|endswith:
    - '\Temp\sam'
    - '\sam.sav'
    - '\Intel\sam'
    - '\sam.hive'
    - '\Perflogs\sam'
    - '\ProgramData\sam'
    - '\Users\Public\sam'
    - '\AppData\Local\sam'
    - '\AppData\Roaming\sam'
    - '_ShadowSteal.zip'                 # https://github.com/HuskyHacks/ShadowSteal
    - '\Documents\SAM.export'            # https://github.com/n3tsurge/CVE-2021-36934/
    - ':\sam'
  - TargetFilename|contains:
    - '\hive_sam_'                       # https://github.com/FireFart/hivenightmare
    - '\sam.save'
    - '\sam.export'
    - '\~reg_sam.save'
    - '\sam_backup'
    - '\sam.bck'
    - '\sam.backup'
  condition: selection
falsepositives:
- Rare cases of administrative activity
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files commonly associated with attempts to export or dump the local Security Account Manager (SAM) database. Such activities are indicative of credential theft, with attackers aiming to gain access to hashed passwords of local accounts, facilitating lateral movement within the environment. This behavior aligns with the MITRE ATT&CK framework under the tactic of Credential Access, specifically the technique T1003.002 (OS Credential Dumping: Security Account Manager).

  Key telemetry sources include Windows file system events related to the creation of specific file names associated with SAM dumps. If malicious, this activity poses a significant security risk as it may enable unauthorized access to user credentials. Importantly, this detection does NOT confirm that a credential dump was successfully extracted; it solely indicates an attempt to create files associated with such actions.

  ### Investigation Steps

  - **Check for suspicious file creation:** Review file creation events (Security Event ID 4663) for any of the following target filenames: `sam`, `sam.sav`, `SAM.export`, or variations indicating unauthorized SAM dumps. Note the timestamp and the user account responsible.

  - **Identify process origin:** Analyze process creation events (Security Event ID 4688 or Sysmon Event ID 1) linked to the file creation. Investigate if any process like `reg.exe` or scripts invoking SAM dumping commands were used, especially from non-administrative accounts.

  - **Correlate with administrative activity:** Compare timestamps with legitimate administrative tasks, such as user management or security audits. If the file creation coincides with verified administrative activities, this may indicate benign activity rather than a credential harvesting attempt.

  - **Assess network activity:** Review event logs for outbound connections (Security Event ID 5156) or unusual process network activity (Sysmon Event ID 3) that could indicate data exfiltration of credentials, particularly post file creation.

  - **Review for associated artifacts:** Confirm whether any files like `sam.hive`, `sam.backup`, or `_ShadowSteal.zip` were created in the environment, as their presence is a strong indicator of credential dumping efforts.

  - **Examine user account behavior:** Analyze the activity of the account associated with the file creation, looking for abnormal login patterns or access to sensitive areas, which can further classify the activation as benign or malicious.

  ### Prioritization

  This alert should be treated with high priority due to the sensitive nature of the SAM database. The impact of the affected system is critical, as compromised credentials can lead to greater access levels across the network. Additionally, credential extraction techniques are frequently weaponized by threat actors and considered a key step in many attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if file creation logs are not configured to capture all events, especially on systems with restrictive file logging policies. Legitimate administrative tasks might trigger this alert if administrators use similar file names during maintenance activities. Related detections, such as monitoring for suspicious registry access events (e.g., Event ID 4656), may enhance coverage against credential harvesting techniques, providing additional context for potential malicious activities.

