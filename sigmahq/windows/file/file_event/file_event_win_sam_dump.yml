title: Potential SAM Database Dump
id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
status: test
description: Detects the creation of files that look like exports of the local SAM
  (Security Account Manager)
references:
- https://github.com/search?q=CVE-2021-36934
- https://web.archive.org/web/20210725081645/https://github.com/cube0x0/CVE-2021-36934
- https://www.google.com/search?q=%22reg.exe+save%22+sam
- https://github.com/HuskyHacks/ShadowSteal
- https://github.com/FireFart/hivenightmare
author: Florian Roth (Nextron Systems)
date: 2022-02-11
modified: 2023-01-05
tags:
- attack.credential-access
- attack.t1003.002
logsource:
  product: windows
  category: file_event
detection:
  selection:
  - TargetFilename|endswith:
    - '\Temp\sam'
    - '\sam.sav'
    - '\Intel\sam'
    - '\sam.hive'
    - '\Perflogs\sam'
    - '\ProgramData\sam'
    - '\Users\Public\sam'
    - '\AppData\Local\sam'
    - '\AppData\Roaming\sam'
    - '_ShadowSteal.zip'                 # https://github.com/HuskyHacks/ShadowSteal
    - '\Documents\SAM.export'            # https://github.com/n3tsurge/CVE-2021-36934/
    - ':\sam'
  - TargetFilename|contains:
    - '\hive_sam_'                       # https://github.com/FireFart/hivenightmare
    - '\sam.save'
    - '\sam.export'
    - '\~reg_sam.save'
    - '\sam_backup'
    - '\sam.bck'
    - '\sam.backup'
  condition: selection
falsepositives:
- Rare cases of administrative activity
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of files that may indicate unauthorized exports of the Security Account Manager (SAM) database on Windows systems. The SAM database contains sensitive information about user accounts and security policies, making it a prime target for attackers aiming to escalate privileges or conduct lateral movement within a network. The presence of files specifically named or formatted as exports from the SAM could suggest that an adversary is utilizing known exploits, such as those described in CVE-2021-36934, or employing tools like ShadowSteal or Hivenightmare.

  The likely attacker objectives are to extract user credentials, perform privilege escalation, or maintain persistence in a compromised system. Detecting such activities is crucial, as unauthorized access to SAM data can lead to substantial breaches of sensitive information and control over accounts. The relevant MITRE ATT&CK tactics include Credential Access (TA0006) and more specifically, techniques like Credentials from Password Stores (T1003.002).

  Primary data sources for effective detection include file event logs that track the creation, modification, or deletion of files within critical directories, particularly those associated with system configuration and user accounts.

  ### Investigation Steps
  - **Review File Event Logs:** Examine logs for unusual file creations or modifications in paths associated with SAM exports, particularly those listed in the detection logic.
  - **Correlate with Process Activity:** Investigate related process creation events to determine if any administrative tools or commands (e.g., `reg.exe save`) were executed in conjunction with the file creations.
  - **Analyze User Activity:** Assess user accounts that performed the exports, focusing on anomalous access patterns that may indicate compromised or administrative accounts.
  - **Check Vulnerability Status:** Validate if any systems are vulnerable to CVE-2021-36934 or similar exploits, which may indicate the potential attack vector used.

  ### Prioritization
  The alert is rated as high severity due to the critical nature of the SAM database containing sensitive account credentials. Unauthorized access to this information poses a significant risk to the integrity and security of the entire organization, making early detection essential.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage may arise from file creations by legitimate administrative tasks where rare cases of expected activity might generate false positives. The detection logic assumes that any file creation resembling a SAM export is unauthorized, which may not always be accurate in large environments. Required logs include detailed file event logs, which must be configured to capture all file creations in the sensitive directory structures related to the SAM database.

