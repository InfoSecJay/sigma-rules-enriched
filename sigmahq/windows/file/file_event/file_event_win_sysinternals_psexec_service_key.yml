note: |
  ### Technical Context
  This detection rule identifies the creation of PSEXEC key files on Windows systems, which occurs whenever a PsExec command is executed. PsExec is a widely used tool for executing processes on remote systems, often leveraging administrative privileges. An attacker could misuse PsExec to execute malicious commands on compromised machines or within enterprise environments, facilitating lateral movement and potential privilege escalation. By detecting the presence of these key files—specifically those prefixed with 'C:\Windows\PSEXEC-' and suffixed with '.key'—security teams can identify unauthorized remote execution attempts.

  Relevant MITRE ATT&CK tactics for this behavior include **Lateral Movement** (TA0008) with the specific technique **T1136.002: Remote Services - PsExec**. Other techniques of interest are **Privilege Escalation** (TA0004) through the use of legitimate tools for malicious intent and **Execution** (TA0002), which encompasses running the PsExec command itself. Primary data sources that provide essential evidence include **file event logs** capturing file creations as well as **USN Journal logs** on Windows systems, which track changes to the file system.

  ### Investigation Steps
  - **Review File Event Logs**: Check the file event logs for creation events that match the defined pattern for PSEXEC key files. Pay particular attention to timestamps and the associated process IDs.

  - **Analyze USN Journal Entries**: Inspect the USN Journal for related operations leading to the creation of the PSEXEC key file. Look for preceding events that indicate unusual activity or commands executed via PsExec.

  - **Correlate With Process Creation Events**: Identify and analyze relevant process creation events around the time the PSEXEC key file was created. Look for processes initiated by unusual users or from unexpected locations.

  - **Investigate Lateral Movement**: If the detection is confirmed, expand the investigation to determine the target and source systems involved. Check for other signs of lateral movement or privilege escalation using tools like Active Directory logs and network traffic analysis.

  ### Prioritization
  This alert is categorized as high severity due to the potential risk of unauthorized remote execution of commands, which can lead to widespread compromise across systems. Given PsExec's legitimate use in administrative tasks, detecting its misuse is critical for maintaining network security.

  ### Blind Spots and Assumptions
  One significant blind spot in this detection logic is the potential for false negatives in environments where logging may not capture all file system activities comprehensively. Additionally, the detection relies on variables such as USN Journal availability and proper logging configurations to function effectively. If file event logging is not enabled or the USN Journal is disabled, this detection will not trigger as expected. It assumes that administrative privilege usage within the environment is unusual and may indicate malicious intent, which could overlook legitimate activity under certain operational contexts.

