note: |
  ### Technical Context

  This rule detects the creation of `.key` files associated with PsExec command execution on Windows systems. The presence of these files indicates potential lateral movement or remote execution scenarios, where an attacker might use PsExec to run commands on other systems within the network. The likely attacker objective could include executing malware, gaining sensitive access, or maintaining persistence.

  This behavior maps to the MITRE ATT&CK framework under the tactics of Lateral Movement (T1021), Execution (T1059), and Privilege Escalation (T1068). Primary telemetry comes from file event logs that capture file creation activities, specifically the USN Journal entries and security logs relating to file access on Windows systems. If these file creations are malicious, they may lead to unauthorized access or execution on targeted systems. Importantly, the creation of a `.key` file alone does NOT confirm that malicious activity has occurred, as legitimate users or administrators may also utilize PsExec for valid purposes.

  ### Investigation Steps

  - **Check target file creation:** Review file event logs for Event ID 4663 or Sysmon Event ID 11, filtering for `TargetFilename` that starts with `C:\Windows\PSEXEC-` and ends with `.key`. Confirm the file's creation time and legitimacy.

  - **Validate user context:** Investigate the account that triggered the file creation using relevant logs (e.g., Security Event ID 4624). Determine if the user has administrative privileges or a pattern of anomalous behavior leading up to the alert.

  - **Analyze command execution:** Look in PowerShell logs (Event ID 4104) or command-line logs for recent usage of PsExec by the same user. Draw a correlation between the alert and any command executed that matches unusual parameters or targets.

  - **Identify expected behavior:** Document what legitimate usage of PsExec looks like in your environment, including standard file paths, user accounts involved, and business processes that justify this tool's use.

  - **Investigate USN journal entries:** Check the USN Journal for creation and modification timestamps around the same time as the `.key` file's creation. Look for unusual patterns or other activity from the same process ID that could indicate malicious use.

  - **Report malicious indicators:** If the `.key` file was created by an unrecognized user or from a system that is not typically targeted, this could signal a high-confidence malicious indicator. Escalate to Tier 2 or 3 analysts for further investigation.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and the likelihood that PsExec is being abused for lateral movement within the enterprise. Given PsExec's documented use by various threat actors, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  The primary detection limitation is that administrative users may trigger this alert through legitimate means. Configuration or lack of logging for USN journal entries might lead to missed detections. Legitimate activities, such as internal IT maintenance or remote support sessions, could also generate this log. A companion detection to consider is monitoring for unusual PowerShell command execution patterns as they often coincide with legitimate PsExec usage.

