note: |
  ### Technical Context

  This Sigma rule detects the creation of PSEXEC key files, which occur when PsExec commands are executed on a Windows system. The likely attacker objective is to perform remote command execution, enabling lateral movement within the network to execute malicious actions or escalate privileges. This behavior corresponds primarily with the MITRE ATT&CK tactic of Lateral Movement (TA0008) and technique T1136.002 (Remote Services: PsExec).

  The primary telemetry source for this detection comes from Windows file event logs that specify file creation activities. The creation of a PSEXEC key file can indicate a malicious presence, compromising other systems in the environment. It is important to note that simply detecting a key file does NOT confirm malicious intent; legitimate administrative use of PsExec may also trigger the rule.

  ### Investigation Steps

  - **Check file creation events:** Investigate Windows file event logs (Event ID 4663) for entries indicating the creation of files starting with `C:\Windows\PSEXEC-` and ending with `.key`. Look for entries with a `FileName` field matching this pattern.

  - **Confirm execution source:** Identify the process that initiated the file creation by examining Windows Event ID 4688 (Process Creation). The process name should be `psexec.exe` or a related binary associated with the execution context.

  - **Assess user context:** Review the user account associated with the file creation events. A known administrative user account executing PsExec might be benign, while an unusual or non-administrative account could be malicious.

  - **Analyze USN Journal entries:** Inspect the USN Journal for additional context surrounding the file creation. This can provide insight into the timeline and frequency of usage, helping distinguish between benign administration and malicious actions.

  - **Identify known benign use cases:** Understand typical legitimate usage of PsExec in your environment, such as IT staff executing maintenance scripts, and consider correlating timestamps with scheduled maintenance windows.

  ### Prioritization

  This alert holds high severity due to its potential impact on critical systems, as PsExec is commonly employed by attackers for lateral movement and privilege escalation. The likelihood of malicious abuse is significant since many cyberattacks leverage this technique, making it a common vector in real-world compromises.

  ### Blind Spots and Assumptions

  Detection is limited by the potential legitimate use of PsExec by administrators, potentially leading to false positives. Comprehensive logging from Windows is essential for reliable detection; monitoring both file events and process creation is critical. Familiar administrative practices, such as software deployments or remote troubleshooting, might also trigger this alert, necessitating contextual investigation. Related detections, such as those for abnormal network traffic or execution of non-standard SMB shares, can further enhance detection efforts.

