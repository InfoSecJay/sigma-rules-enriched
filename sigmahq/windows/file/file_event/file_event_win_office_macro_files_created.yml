note: |
  ### Technical Context
  This rule detects the creation of new Office macro files, specifically targeting file extensions commonly associated with macro-enabled documents. Macro files can be used by attackers to deliver malicious code and execute payloads, often as part of phishing campaigns or initial access strategies. In a compromised environment, the use of macro files can signify an attempt to exploit security vulnerabilities or bypass security controls through social engineering or malformatted files.

  Relevant MITRE ATT&CK tactics include **Initial Access** and the technique of **Phishing: Malicious File (T1566.001)**. Attackers often utilize macro-enabled documents as a foothold within an organization, leading to further exploitation and lateral movement within the network.

  The primary data source for this detection is Windows file event logs, which will capture the creation and access of files with macro-enabled extensions. Monitoring these file events can provide insight into potentially malicious activity, especially in environments where the use of such files is uncommon.

  ### Investigation Steps
  - **Review File Creation Events:** Check Windows file event logs for entries indicating the creation of macro-enabled files, particularly looking for patterns or anomalies such as file names or locations that do not align with standard business processes.
  - **Analyze User Behavior:** Investigate the behavior of the user account associated with the file creation. Look for unusual access patterns or recent connections to unknown external domains that may indicate credential compromise or phishing.
  - **Examine for Execution of Payloads:** Cross-reference the detected file creation with subsequent execution logs to see if any macros were triggered and executed. If macros were run, analyze the command-line arguments or process chains for any suspicious activity.
  - **Perform a Threat Hunt:** Conduct a broader threat hunt for other indicators of compromise (IoCs), such as IP addresses or domains associated with known macro malware, throughout your environment.

  ### Prioritization
  The alert is categorized as low severity due to the prevalence of macro-enabled documents in many business environments. However, an increased number of detections, especially from unfamiliar sources, should be treated with greater urgency as they may signal an ongoing phishing campaign or deeper compromise.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where macro file creation is common and necessary for business activities, leading to potential false positives. The detection logic assumes that the file creation is anomalous and does not account for legitimate uses of macro-enabled documents. Additionally, Windows file event logging must be properly configured and enabled on endpoints for this alert to function effectively; otherwise, critical events may be missed.

