note: |
  ### Technical Context

  This Sigma rule detects the creation of new Office macro files (e.g., .docm, .xlsm) on Windows systems, which are often leveraged by attackers for initial access and execution of malicious code. The likely objective of the attacker is to deliver malware using social engineering tactics, exploiting users into executing malicious macros. This behavior is relevant to the MITRE ATT&CK technique T1566.001 (Phishing: Malicious Link). The primary telemetry source for this detection is file creation events on Windows systems, specifically focusing on file paths and event types that indicate new file creation.

  If malicious, the creation of these files can facilitate the distribution of ransomware, keyloggers, or backdoors within a network. However, this detection does NOT confirm malicious intent on its own, as legitimate Office macro file creation is common in environments that rely heavily on such documents.

  ### Investigation Steps

  - **Check recent file creations:** Review Windows Security Event ID 4663 for file creation events that include '.docm', '.xlsm', '.dotm', etc. Focus on timestamps and user accounts involved in these activities to assess if they align with known malicious behavior.

  - **Analyze file properties:** Verify the metadata of newly created macro files (e.g., via PowerShell cmdlets like `Get-ItemProperty`). Check for unusual attributes such as modified timestamps or author fields indicating potential tampering.

  - **Cross-reference with user activity:** Look through authentication logs (Event ID 4624) to correlate user login activity at the time of file creation. Validate that the user account responsible for the creation is known to use macro-enabled files legitimately.

  - **Identify known malicious indicators:** Search for files that trigger this rule originating from email attachments or untrusted web sources, particularly those reported as malicious in threat intelligence feeds.

  - **Check for related detections:** Compare findings with companion detection rules related to malicious email attachments or macro execution to see if there is a pattern of behavior that strengthens the case for malicious activity.

  - **Document legitimate macro use:** Record the legitimate business use cases within the environment. Understand common file creation patterns from trusted sources to provide context for investigations.

  ### Prioritization

  The alert severity is considered low due to the high prevalence of legitimate Office macro file creation in enterprise environments. However, it requires attention as malicious use of macros is a common tactic for initial access, making it a potential precursor to more serious threats if confirmed.

  ### Blind Spots and Assumptions

  Detection of macro file creation is limited by false positives from legitimate use, often found in organizations using Office documents extensively. It requires proper access to file creation telemetry, which might be constrained if logging isn’t configured for file events. Legitimate activities, such as regular office workflows or automated reports, may trigger this alert as well. A related detection for comprehensive coverage could involve monitoring for the execution of these macro files (e.g., via Event ID 4688 for process creation) to identify potentially malicious execution following their creation.

