detection:
  selection:
    TargetFilename|endswith:
    - '.docm'
    - '.dotm'
    - '.xlsm'
    - '.xltm'
    - '.potm'
    - '.pptm'
  filter_main_office:
    Image|startswith:
    - 'C:\Program Files\Microsoft Office\'
    - 'C:\Program Files (x86)\Microsoft Office\'
    Image|endswith:
    - '\WINWORD.EXE'
    - '\EXCEL.EXE'
    - '\POWERPNT.EXE'
    TargetFilename|contains: '\~$'     # Temporary files created by Office applications
  condition: selection and not 1 of filter_main_*
falsepositives:
- Very common in environments that rely heavily on macro documents
level: low
note: |
  ### Technical Context

  This Sigma rule detects the creation of new Microsoft Office macro-enabled files (e.g., `.docm`, `.xlsm`, `.pptm`) on Windows systems. The likely attacker objective is to create malicious documents that, when opened, can execute harmful macros to gain unauthorized access or deliver malware. This detection corresponds to the MITRE ATT&CK technique for Initial Access, specifically T1566.001 - "Phishing: Malicious Link."

  The primary telemetry sources are Windows file event logs, particularly those related to file creation. The relevant log types will capture information when files with the specified extensions are created, especially if they originate from Microsoft Office application paths. If the alert is valid, it poses a security risk as it may indicate an attempt to employ macro malware. Importantly, this detection does not confirm that the file is malicious on its own; it merely denotes the creation of an Office macro file.

  ### Investigation Steps

  - **Review the file creation context**: Check Windows File Event logs for Event ID 4663 that detail the creation of files ending with `.docm`, `.xlsm`, etc. Verify the user and process (e.g., WINWORD.EXE, EXCEL.EXE) involved in this file creation. Legitimate activity often involves users creating these documents intentionally during regular tasks.

  - **Identify suspicious creation paths**: Confirm that the file was created in unusual directories (e.g., user’s Desktop or Downloads instead of Work Documents) by checking the `TargetFilename` or `BaseFileName` fields in the event logs. Look for deviations from typical user behavior.

  - **Check for associated file attributes**: Look for temporary files created by Office (e.g., filenames that begin with `~$`) in Event ID 4663 logs. The presence of these temporary files may support malicious intent, especially if they accompany the creation of the final macro file.

  - **Correlate with user behavior**: Investigate the user’s recent activities using Windows Security Event logs for Event ID 4624 (Successful logon) and Event ID 4648 (Logon attempt using explicit credentials). Frequent document creation with macros following abnormal login behaviors could indicate malicious activity.

  - **Assess for known malicious indicators**: Search for established threat actor TTPs using Threat Intelligence databases to ascertain if the created Office files have been documented in previous incidents, particularly malware distribution campaigns targeting macro-enabled files.

  ### Prioritization

  The severity of this alert is low, as many users legitimately create macro-enabled documents for valid business purposes. However, this behavior can be weaponized by attackers to facilitate malware distribution. The overall impact may vary based on the criticality of the asset involved and the potential for misuse in targeted campaigns.

  ### Blind Spots and Assumptions

  This detection may miss attacks where macros are embedded in legitimate documents or if office file creation is masked by other activities (e.g., renaming existing files rather than creating new ones). Furthermore, there must be consistent logging from Windows file events, which may require specific configurations to ensure completeness. Legitimate activities such as shared document creation in collaboration tools might trigger the alert. Related detections for enhanced coverage include monitoring for execution of macros in Office applications (e.g., tracking Event ID 4688 for process creation related to macros).

