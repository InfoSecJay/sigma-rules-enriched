title: Potential Persistence Via Microsoft Office Startup Folder
id: 0e20c89d-2264-44ae-8238-aeeaba609ece
status: test
description: Detects creation of Microsoft Office files inside of one of the 
  default startup folders in order to achieve persistence.
references:
- https://insight-jp.nttsecurity.com/post/102hojk/operation-restylink-apt-campaign-targeting-japanese-companies
- https://learn.microsoft.com/en-us/office/troubleshoot/excel/use-startup-folders
author: Max Altgelt (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-02
modified: 2023-06-22
tags:
- attack.persistence
- attack.t1137
logsource:
  category: file_event
  product: windows
detection:
  selection_word_paths:
  - TargetFilename|contains: '\Microsoft\Word\STARTUP'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\STARTUP'
  selection_word_extension:
    TargetFilename|endswith:
    - '.doc'
    - '.docm'
    - '.docx'
    - '.dot'
    - '.dotm'
    - '.rtf'
  selection_excel_paths:
  - TargetFilename|contains: '\Microsoft\Excel\XLSTART'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\XLSTART'
  selection_excel_extension:
    TargetFilename|endswith:
    - '.xls'
    - '.xlsm'
    - '.xlsx'
    - '.xlt'
    - '.xltm'
  filter_main_office:
    Image|endswith:
    - '\WINWORD.exe'
    - '\EXCEL.exe'
  condition: (all of selection_word_* or all of selection_excel_*) and not 
    filter_main_office
falsepositives:
- Loading a user environment from a backup or a domain controller
- Synchronization of templates
level: high
note: |
  ### Technical Context

  This rule detects the creation of Microsoft Office files in specific startup folders, namely Word’s STARTUP and Excel’s XLSTART directories. This behavior typically aligns with an attacker’s objective to establish persistence on a compromised host by placing malicious documents that execute upon application launch. This detection is aligned with the MITRE ATT&CK technique for persistence, specifically T1137.

  The primary telemetry sources for this detection are Windows file events capturing the creation of relevant files. The security impact includes maintaining persistence that could lead to further compromise, data exfiltration, or lateral movement within the network. However, this detection does NOT confirm that the files are inherently malicious, as legitimate users may use these folders for benign purposes.

  ### Investigation Steps

  - **Verify the file creation location:** Check Windows Event ID 4663 (Access Attempt) for created files located in `C:\Program Files\Microsoft Office\Word\STARTUP` or `C:\Program Files\Microsoft Office\XLSTART`. Compare access times with the application launch times to assess if the timing indicates malicious intent.

  - **Review the file types:** Examine any new files that were created with extensions `.doc`, `.docm`, `.xls`, `.xlsm` in the detection path. Confirm if these files were modified following their creation, which may indicate malicious alteration.

  - **Check for known responses:** Look for previously identified malicious document hashes or known threat indicators. Cross-reference file hashes against threat intelligence or malware repositories for high-confidence malicious indicators.

  - **Assess user context:** Identify the user who executed the action by reviewing Event ID 4624 (Logon) in proximity to file creation events. Ensure that the action aligns with legitimate user activities, such as template updates or application configuration.

  - **Determine legitimate use cases:** Investigate any ongoing projects or legitimate activities that could justify the creation of files in these startup folders, such as user-specific templates aiding productivity, which typically do not appear frequently.

  ### Prioritization

  This alert is high severity due to the potential security risks associated with file-based persistence mechanisms. The presence of malicious Office files in startup locations can lead to significant breaches and is a common method used by attackers to maintain access to compromised systems.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative actions, such as updates or template synchronization. It relies on complete and accurate logging of file creation events; ensure that file auditing is correctly configured on target systems. Legitimate use can include standard user applications or document collaboration. One companion detection to consider is monitoring for abnormal application execution patterns, such as unusual command lines used to launch Word or Excel, which could further strengthen coverage against this persistence technique.

