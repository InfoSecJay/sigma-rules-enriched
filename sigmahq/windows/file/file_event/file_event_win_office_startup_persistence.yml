title: Potential Persistence Via Microsoft Office Startup Folder
id: 0e20c89d-2264-44ae-8238-aeeaba609ece
status: test
description: Detects creation of Microsoft Office files inside of one of the default
  startup folders in order to achieve persistence.
references:
- https://insight-jp.nttsecurity.com/post/102hojk/operation-restylink-apt-campaign-targeting-japanese-companies
- https://learn.microsoft.com/en-us/office/troubleshoot/excel/use-startup-folders
author: Max Altgelt (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
date: 2022-06-02
modified: 2023-06-22
tags:
- attack.persistence
- attack.t1137
logsource:
  category: file_event
  product: windows
detection:
  selection_word_paths:
  - TargetFilename|contains: '\Microsoft\Word\STARTUP'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\STARTUP'
  selection_word_extension:
    TargetFilename|endswith:
    - '.doc'
    - '.docm'
    - '.docx'
    - '.dot'
    - '.dotm'
    - '.rtf'
  selection_excel_paths:
  - TargetFilename|contains: '\Microsoft\Excel\XLSTART'
  - TargetFilename|contains|all:
    - '\Office'
    - '\Program Files'
    - '\XLSTART'
  selection_excel_extension:
    TargetFilename|endswith:
    - '.xls'
    - '.xlsm'
    - '.xlsx'
    - '.xlt'
    - '.xltm'
  filter_main_office:
    Image|endswith:
    - '\WINWORD.exe'
    - '\EXCEL.exe'
  condition: (all of selection_word_* or all of selection_excel_*) and not filter_main_office
falsepositives:
- Loading a user environment from a backup or a domain controller
- Synchronization of templates
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of Microsoft Office files in default startup folders, a common technique used by attackers to establish persistence on compromised systems. The malicious actor may utilize these files to execute scripts or load malware silently when a user opens an Office application, thereby ensuring that their presence remains even after a system restart. The typical objective behind such behavior is to maintain access to the system and potentially exfiltrate data or spread malware further within the network.

  Relevant MITRE ATT&CK tactics include **Persistence (TA0003)** and the specific technique **Create or Modify System Process (T1137)**. Detecting this behavior is crucial because it indicates that an attacker might be attempting to manipulate user sessions and maintain their foothold within the environment. The primary data sources that will provide useful insights include file event logs from the operating system that record file creation actions and the associated processes that triggered them.

  ### Investigation Steps
  - **Review File Creation Events:** Analyze file event logs to identify the creation of any Microsoft Office files in startup folders, such as "\Microsoft\Word\STARTUP" or "\Microsoft\Excel\XLSTART". Pay attention to the file names and extensions used.

  - **Examine Associated Processes:** Investigate the processes that created these Office files. Determine if they originated from legitimate applications or suspicious processes that could indicate malicious activity.

  - **Search for Other Indicators:** Look for other indicators of compromise, such as unusual network activity, file modifications, or suspicious scripts that may be executing alongside the detected Office files.

  - **Correlate with User Activity:** Review user activity logs to see if any users opened Office applications around the same time as the file creations. Investigate any unusual patterns, such as files created during non-working hours or by users with no legitimate reason to do so.

  ### Prioritization
  The severity of this alert is high given that the presence of persistence mechanisms can lead to prolonged undetected access, allowing attackers to exploit the environment further. The likelihood of threat activity increases as persistent malware can yield significant impacts, including data breaches and lateral movement across the network.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage include environments that do not log file creation events or if the logs are not properly configured to capture all relevant details. Assumptions made by the detection logic include that the created files will always have recognizable Microsoft Office extensions and reside in known startup directories. For the alert to function effectively, comprehensive logging from Windows file events must be enabled, specifically focusing on created file events in the target paths defined in the rule.

