  ### Technical Context

  This Sigma rule detects the creation of suspicious executable (EXE) and dynamic-link library (DLL) files in the default Group Policy Object (GPO) folder, indicative of potential unauthorized changes to group policy settings. The likely attacker objective is to maintain persistence or execute malicious software through GPOs, leveraging the legitimate administrative features of the Windows domain environment. This activity is associated with the MITRE ATT&CK technique **Masquerading (T1036.005)** and the tactic **Defense Evasion**.

  The primary telemetry source is the Windows file event logs, particularly focusing on file creation events. If malicious, this behavior could lead to significant security impacts, granting attackers backdoor access or altering system configurations. Importantly, this detection does NOT confirm malicious activity on its own, as benign administrative actions may also lead to creates in this directory.

  ### Investigation Steps

  - **Check for file creation events**: Review Windows Security Event ID 4688 for process creation related to file modifications. Look for processes that create files in the `\Policies\{31B2F340-016D-11D2-945F-00C04FB984F9}\` directory.

  - **Identify the file types created**: Verify that the created files end with `.exe` or `.dll`, specifically in the event logs categorized as `File event`. Alert on any file creation where `TargetFilename` matches these extensions.

  - **Review file ownership and timestamps**: Examine the owner of the suspicious files. Legitimate administrative actions would typically show system or known administrator accounts as the creator. Recent timestamps relative to unusual user activity may indicate malicious behavior.

  - **Correlate against legitimate GPO changes**: Check the Group Policy Management Console (GPMC) logs for any authorized GPO changes that align with or overwrite the suspicious file creations. Activity by known administrators should be expected rather than arbitrary user accounts.

  - **Analyze context of process initiation**: Look in Windows Sysmon Event ID 1 for processes that executed the suspected file creations. Pay special attention to command-line arguments and parent-process relationships that reveal the origin of the creation request.

  ### Prioritization

  This alert has medium severity due to the potential impact on the system's integrity and security. The likelihood of malicious abuse is heightened, particularly in environments with fragile defenses, as GPO manipulation is a common tactic employed by advanced adversaries. While the behavior may occur under legitimate circumstances, it is often weaponized by attackers.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for file creation to occur from legitimate administrative scripts or automated processes. Required log sources include comprehensive auditing of file modifications, which must be enabled for meaningful detection. Legitimate GPO changes, such as software deployments or updates initiated by IT administrators, may also trigger this alert. A related detection that strengthens coverage is monitoring for unusual changes in GPO settings themselves, as tracked by Group Policy event logs (Event ID 5136).

