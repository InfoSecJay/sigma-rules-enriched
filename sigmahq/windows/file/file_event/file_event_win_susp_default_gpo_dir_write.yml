note: |
  ### Technical Context

  This rule detects the creation of suspicious executable (.exe) or dynamic link library (.dll) files in the default Group Policy Object (GPO) folder, specifically under the GUID {31B2F340-016D-11D2-945F-00C04FB984F9}. The likely attacker objective is to leverage GPO for persistence or to schedule malicious executions via the GPO mechanism. This activity relates to the MITRE ATT&CK technique T1036.005 (Masquerading).

  The primary telemetry sources are Windows file event logs that capture file creation events, specifically focusing on those targeting the GPO folder path. If malicious, this behavior could facilitate unauthorized modifications to system policies or the initiation of malicious software across multiple systems in an organization. This detection does NOT confirm actual compromise; it merely flags potential suspicious file activity.

  ### Investigation Steps

  - **Verify the Alert Against Known Good Behavior:** Review the folder contents at `C:\Windows\SYSVOL\domain\Policies\{31B2F340-016D-11D2-945F-00C04FB984F9}\` for legitimate .exe or .dll files that should be present. Common files may include standard administrative templates or scripts used for GPO management.

  - **Check File Creation Events:** Investigate Windows Security Event ID 4663 to find the exact file creation events. Focus on the timestamp and the user account associated with the creation—legitimate administrative accounts should match organizational user behavior.

  - **Identify Malicious Patterns:** Look for file names or hashes that match known malware signatures, particularly those associated with backdoors or trojans. Specifically, monitor for files with unusual names or those sourced from non-standard directories.

  - **Assess the Parent Process:** For the file creation event, retrieve the associated process creation events (Security Event ID 4688) to understand the context of execution. Investigate if processes like `cmd.exe` or `powershell.exe` were used to create the files, suggesting potentially malicious intent.

  - **Cross-reference Account Activity:** Check for abnormal user access or permissions changes involving accounts that created files in this GPO path. Look for suspicious logins or account behavior leading up to the event, to determine if compromised credentials are in use.

  ### Prioritization

  This alert has medium severity due to the potential for malicious actors to gain persistence through GPOs, especially on systems crucial to domain operations. The likelihood of abuse is moderate as GPOs are often leveraged in various attacks to conceal executable malware; however, actual trades of this type may not be common.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers may delete or rename files immediately after creation to avoid detection. Reliable detection requires logging configurations that capture all file creation events effectively. Legitimate software or updates may trigger this alert if their files are incorrectly placed in the GPO folder. A companion detection such as monitoring for DNS queries or network traffic that correlates with the execution of files from this GPO can strengthen coverage against binary persistence methods.

