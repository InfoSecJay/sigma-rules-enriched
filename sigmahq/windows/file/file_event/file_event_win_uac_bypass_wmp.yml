  ### Technical Context

  This detection identifies unauthorized privilege escalation attempts using a tactic called UAC Bypass via the Windows Media Player component (osk.exe) by leveraging the osksupport.dll file. The likely objective of an attacker is to sidestep User Account Control (UAC) to gain higher privileges within the Windows operating environment. This behavior falls under the MITRE ATT&CK tactic of Privilege Escalation (Tactics ID: TA0004) and the technique of Bypass User Account Control (Technique ID: T1548.002).

  The primary telemetry source for this detection is Windows File Events, particularly focusing on file alterations in the local user directory and interactions with the DllHost.exe process. If malicious, an adversary could gain elevated privileges, compromising the system and possibly moving laterally within the network. It’s important to state that this detection alone does not confirm that the action was successful or that any damage was done; it merely indicates an attempt to bypass UAC.

  ### Investigation Steps

  - **Verify impacted workflows:**
    Check for legitimate activity regarding the osk.exe process being invoked, especially in line with media playback or accessibility use cases. For benign activity, legibly corresponding events may include the execution of osk.exe during a media service like Windows Media Player.

  - **Review event logs for unauthorized DLL manipulation:**
    Look for Windows Security Event ID 4688 (Process Creation) and filter for the creation or modification of `C:\Users\<User>\AppData\Local\Temp\OskSupport.dll`, which could indicate unauthorized use of the file.

  - **Correlate DllHost.exe execution:**
    Inspect for instances of DllHost.exe (likely Event ID 4688) that reference `C:\Program Files\Windows Media Player\osk.exe`. Confirm that the parent process and environment match expected user activities (e.g., media playback).

  - **Check for abnormal file timestamps:**
    Investigate the file creation and access timestamps of `OskSupport.dll` for any discrepancies. Malicious files may have unusual timestamps, indicating they were created or accessed during anomalous hours or following suspicious activity.

  - **Identify user account elevation pattern:**
    Examine for repeated and abnormal triggers of elevation requests from the user account that executed osk.exe. A series of such actions, particularly from standard user accounts, can imply malicious intent.

  - **Assess for persistence mechanisms:**
    Determine if the DLL file (OskSupport.dll) has been established for persistence by listening for repeated executions or creation events. Valid persistence actions may show typical application logs for media player sessions without abnormal DLL interactions.

  ### Prioritization

  This alert indicates a high-severity risk, especially if the affected system is critical infrastructure or contains sensitive information. The likelihood of malicious abuse is moderate, as UAC bypass techniques are commonly weaponized in privilege escalation attacks. Organizations should be vigilant given the potential for significant impact if this technique is successfully executed.

  ### Blind Spots and Assumptions

  Detection may be limited by variations in legitimate application use of Windows Media Player and associated files. Additionally, the absence of detailed logs for user account activities may lead to false negatives. It's essential to ensure that file event logs are comprehensively collected and properly configured for timely detection. A companion detection to consider is monitoring for unauthorized application installation or modification events that frequently accompany privilege escalation attempts.

