  ### Technical Context

  This rule detects the behavior associated with UAC bypass attempts using Windows Media Player through specific DLL abuse (osksupport.dll). The likely attacker objective is to execute malicious code with elevated privileges by exploiting the UAC (User Account Control) mechanism, thus facilitating unauthorized access or control over the system. The relevant MITRE ATT&CK technique is "Bypass User Account Control" (T1548.002).

  The primary telemetry sources for this detection include file event logs specific to Windows (e.g., File Event ID for file creation/modification). If a malicious UAC bypass is confirmed, the security impact could range from unauthorized system changes to full control of the victim machine. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation is necessary to determine context and intent.

  ### Investigation Steps

  - **Check for DLL activity:** Review Windows file event logs (Event ID 4663) for accesses to `C:\Users\<Username>\AppData\Local\Temp\OskSupport.dll`. Malicious access patterns may show creation or modification without user interaction.

  - **Analyze process creation:** Examine Sysmon Event ID 1 for process creation associated with `DllHost.exe`. Verify if it was executed by legitimate processes or initiated by suspicious actors (e.g., from unexpected parent processes).

  - **Correlate with known benign behavior:** Look for legitimate instances of Windows Media Player executing `osk.exe` from the expected path. Normal behavior should not invoke or create the OskSupport.dll DLL in the Temp directory.

  - **Identify high-confidence malicious indicators:** Focus on the creation of `C:\Users\<Username>\AppData\Local\Temp\OskSupport.dll` alongside `DllHost.exe`. If both files are found created in close temporal proximity, this is a strong indicator of a UAC bypass attempt.

  - **Inspect network activity related to execution:** Verify if the execution of `osk.exe` corresponds to outbound network communications using network logs or firewall logs. Check for unusual connections that may indicate command and control communication.

  - **Evaluate asset criticality:** Determine the role of the affected host. If the host is a server or contains sensitive data, elevate the investigation’s priority and escalate findings to senior analysts immediately.

  ### Prioritization

  This alert is considered high severity because it involves a potential UAC bypass, indicating a likely privilege escalation attempt. The impact on systems, particularly if they host sensitive data or critical services, can be significant. Such bypass techniques are common among threat actors looking to exploit vulnerabilities in Windows environments.

  ### Blind Spots and Assumptions

  Detection may be limited by users mistakenly executing legitimate applications that employ similar processes or DLLs. If file event logging is not properly configured, certain actions leading to the UAC bypass may go unnoticed. Additionally, legitimate activities such as software updates or user-initiated installs may trigger this alert. A related detection to strengthen coverage might involve monitoring for suspicious DLL injection attempts across other applications or general UAC bypass indicators.

