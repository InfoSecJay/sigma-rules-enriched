note: |
  ### Technical Context

  This Sigma rule detects the creation of a file with the ".pdf" extension by the `RegEdit.exe` process, which is atypical behavior as RegEdit is primarily used for editing the Windows registry. The likely attacker objective behind this behavior is to extract sensitive information from the registry under the guise of legitimate operations, possibly to exfiltrate credentials or configuration data in a format that can easily be shared or accessed. This activity is associated with the MITRE ATT&CK tactic of **Defense Evasion (TA0005)**, specifically the technique of **Obfuscated Files or Information (T1027)**.

  The primary telemetry sources for this detection are Windows file events, focusing on event data that logs file creation activities. If this behavior is malicious, it indicates an attempt to bypass system defenses and exfiltrate sensitive information covertly. However, this detection does not confirm malicious intent on its own; benign use cases might exist, albeit rarely.

  ### Investigation Steps

  - **Verify process legitimacy:**
    Check if `RegEdit.exe` is running from its expected location: `C:\Windows\regedit.exe`. If found in a different directory, escalate this as a potential indicator of compromise.

  - **Inspect created PDF file properties:**
    Investigate the PDF file created, focusing on attributes like the creation timestamp, owner, and size. Legitimate operations would typically involve files being created by user applications rather than system utilities.

  - **Review Windows Security Event IDs related to file creation:**
    Examine Event ID 4663 for file creation events specifying the PDF file, looking for the `Object Type` as "file" and `Access Mask` showing "Write Data". This indicates potential malicious activity as RegEdit should not engage in such file operations.

  - **Monitor recent registry access:**
    Use Event ID 4656 to review any recent registry key accesses or modifications that may relate to sensitive data (e.g., HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\). Matching actions to the time of the PDF creation can provide context.

  - **Identify potentially affected user accounts:**
    Review recent logins and actions taken by the user who executed `RegEdit.exe`, especially focusing on accounts with administrative privileges, as they have greater access to sensitive registry information.

  ### Prioritization

  Given this behavior's potential to indicate unauthorized extraction of sensitive data, the alert is classified as high severity. The likelihood of malicious abuse is significant since `RegEdit.exe` is not typically expected to create PDF files. This type of behavior is not common among legitimate users, making it a noteworthy event for further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for certain system activities, particularly if the environment lacks comprehensive logging configurations. Additionally, legitimate activities such as benign scripts that utilize registry data may inadvertently trigger this alert. A related detection to strengthen coverage would involve monitoring for unusual process behaviors, specifically execution of common administration tools (e.g., PowerShell) that could create similar artifacts.

