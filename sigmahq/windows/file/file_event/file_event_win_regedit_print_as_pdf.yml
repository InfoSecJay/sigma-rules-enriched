note: |
  ### Technical Context

  This Sigma rule detects the creation of a file with the ".pdf" extension by the "RegEdit.exe" process. This behavior suggests an attempt by an adversary to extract sensitive information from the Windows registry and save it in a portable format, potentially bypassing traditional defenses. The likely attacker objective is harvesting credentials or configuration data stored within the registry.

  This detection aligns with the MITRE ATT&CK technique **T1560.001: Archive Collected Data: PDF**. The primary telemetry sources are Windows file event logs, specifically related to file creation activities. If the detected behavior is malicious, it could lead to unauthorized access to compromised credentials, posing significant risks. Importantly, this detection does NOT confirm that a malicious action has occurred without further context.

  ### Investigation Steps

  - **Check Event Logs for File Creation:** Review Windows Event ID 4663 (File Create) to confirm that "RegEdit.exe" created a PDF file. Ensure it matches the time frame of the alert.

  - **Analyze File Metadata:** Inspect the created PDF file using forensic tools to examine the creation time and any embedded metadata that could reveal the contents or registry keys involved. Malicious PDFs may contain unexpected data entries.

  - **Review Registry Access Times:** Cross-reference registry access logs (Event ID 4656) for "RegEdit.exe" during the same period for any illegitimate or suspicious registry key access. Known benign access patterns should involve system configuration keys.

  - **Identify User Context:** Determine the user account associated with the execution of "RegEdit.exe". If the account is privileged, it raises the threat level. Users typically do not save registry snapshots as PDFs.

  - **Examine Security and Audit Policy Configurations:** Check the settings and configurations of your audit policies to ensure file create actions are appropriately logged. If the telemetry is lacking, adjust auditing settings as necessary.

  ### Prioritization

  The severity of this alert is high, as a successful extraction of sensitive information from the registry could lead to serious security incidents. The act of saving sensitive data to a PDF using privileged processes indicates a high likelihood of malicious intent, as this behavior is not typical in standard operations.

  ### Blind Spots and Assumptions

  This detection may not capture evasion techniques such as altering the executable name or using different processes to create or save files. It requires comprehensive file event logging configured correctly to ensure consistency. Legitimate activities may include system administrators exporting registry settings for backup, but these should be rare. A related detection could include tracking the use of "RegEdit.exe" when invoked alongside unusual command-line arguments, which increases the overall context for potential exploitation attempts.

