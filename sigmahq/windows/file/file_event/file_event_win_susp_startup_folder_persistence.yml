detection:
  selection:
    TargetFilename|contains: '\Windows\Start Menu\Programs\Startup\'
    TargetFilename|endswith:
            # Add or remove suspicious extensions according to your env needs
    - '.bat'
    - '.cmd'
    - '.dll'
    - '.hta'
    - '.jar'
    - '.js'
    - '.jse'
    - '.msi'
    - '.ps1'
    - '.psd1'
    - '.psm1'
    - '.scr'
    - '.url'
    - '.vba'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: selection
falsepositives:
- Rare legitimate usage of some of the extensions mentioned in the rule
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of potentially malicious script and executable files within Windows startup folders. Threat actors often leverage these folders to establish persistence on compromised systems, ensuring that their malware executes automatically upon user login. The creation of files with extensions such as .ps1, .vbs, .bat, and others signifies an attempt to embed malicious scripts or binaries that may facilitate ongoing control and monitoring of the targeted environment.

  The threat scenario typically involves attackers utilizing malvertising campaigns or malware distribution strategies that exploit the startup mechanism to maintain access post-compromise. Their primary objectives include data exfiltration, further lateral movement within the network, or implementing additional exploitative actions without detection. According to the MITRE ATT&CK framework, this behavior aligns with several tactics and techniques, notably **Persistence (T1547.001)** and **Execution (T1204.002)**.

  Relevant data sources for this detection include Windows file event logs, specifically targeting file creations and modifications within the `\Windows\Start Menu\Programs\Startup\` directory. Analysts should focus on anything that deviates from standard operational behavior regarding the creation of files in this directory.

  ### Investigation Steps
  - **Review File Event Logs:** Check Windows file event logs for any newly created files in the `\Windows\Start Menu\Programs\Startup\` directory, paying attention to their creation time and user context.
  - **Analyze File Extensions:** Focus on the file names and extensions that are uncommon in a standard environment, particularly .ps1, .vbs, .bat, and others specified in the rule.
  - **Correlate with User Activity:** Investigate user login events around the same time as file creation to determine if there's a pattern indicating unauthorized access or unusual user behavior.
  - **Check for Pre-existing Artefacts:** Look for any established links to known malicious tools or behaviors, such as connections to command and control servers or previously identified malware signatures associated with persistence techniques.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of persistent access on compromised systems, which can lead to data breaches, lateral movement, and extensive network vulnerabilities. The ease with which attackers can maintain persistence increases the likelihood of severe consequences.

  ### Blind Spots and Assumptions
  Detection coverage might be limited if the environment has legitimate administrative processes creating files in the Startup folder, which could lead to false positives. The detection logic assumes that the typical use of the specified file extensions is rare within user environments. For the alert to function effectively, complete logging of file events for Windows systems must be enabled, and consideration should be given to legitimate business processes that could trigger similar file creations.

