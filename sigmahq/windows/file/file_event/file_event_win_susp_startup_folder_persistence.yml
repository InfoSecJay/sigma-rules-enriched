detection:
  selection:
    TargetFilename|contains: '\Windows\Start Menu\Programs\Startup\'
    TargetFilename|endswith:
            # Add or remove suspicious extensions according to your env needs
    - '.bat'
    - '.cmd'
    - '.dll'
    - '.hta'
    - '.jar'
    - '.js'
    - '.jse'
    - '.msi'
    - '.ps1'
    - '.psd1'
    - '.psm1'
    - '.scr'
    - '.url'
    - '.vba'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: selection
falsepositives:
- Rare legitimate usage of some of the extensions mentioned in the rule
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of potentially malicious files, such as scripts and executables, in Windows startup folders. These files are designed to run automatically upon user login, aligning with attacker objectives to establish persistence on compromised systems. This behavior is mapped to the MITRE ATT&CK technique T1547.001 (Startup Items), under the tactics of Persistence and Execution. Primary telemetry sources include Windows file events, specifically monitoring for certain file extensions being created in the Startup folder (`C:\Users\<User>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup`). If these files are indeed part of a malicious campaign, they could enable long-term access and control over the affected machine. Importantly, this rule does not confirm malicious intent or activity on its own—it merely indicates that a file creation event matching the criteria has taken place.

  ### Investigation Steps

  - **Verify file creation details**: Check the `Event ID 4663` for file creation; review fields like `ObjectType`, `ObjectName`, and `ProcessName` to validate the context of the file creation event.

  - **Identify suspicious file types**: Look for newly created files in the Startup folder with the specified extensions like `.ps1`, `.vbs`, or `.js`. Compare this with normal operational usage; legitimate files will often have standard naming conventions that align with company policies.

  - **Investigate creation process**: Correlate the file creation event with `Event ID 4688` (Process Creation) to identify the parent process that triggered the creation. Legitimate tasks (e.g., system updates) may be accompanied by expected process names like `explorer.exe`.

  - **Assess user context**: Analyze the user account associated with the file creation; if it’s a service account or a user not typically associated with such behavior, further scrutiny is warranted.

  - **Check for additional persistence mechanisms**: Review `Task Scheduler (Event ID 106)`, as attackers often create scheduled tasks alongside startup item modifications to reinforce persistence.

  - **Monitor for unusual file activity**: If identified files execute, track their behaviors using Sysmon Event ID 1 or 5 to determine if they attempt to make network connections or access sensitive data.

  ### Prioritization

  The alert is considered high severity due to the critical function of the affected host—compromised systems can lead to unauthorized access, data exfiltration, and lateral movement across the network. The likelihood of malicious abuse is high, as this tactic is frequently employed in real-world attacks to maintain persistence.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain log sources, especially if file auditing is not enabled on critical directories. Legitimate software installations might trigger similar events, particularly when installers place autorun scripts in the Startup folder. A related detection to strengthen coverage could involve monitoring for unusual scheduled task creation, which often complements startup folder persistence techniques.

