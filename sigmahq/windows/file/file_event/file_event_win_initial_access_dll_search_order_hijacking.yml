title: Potential Initial Access via DLL Search Order Hijacking
id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
status: test
description: Detects attempts to create a DLL file to a known desktop 
  application dependencies folder such as Slack, Teams or OneDrive and by an 
  unusual process. This may indicate an attempt to load a malicious module via 
  DLL search order hijacking.
references:
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-5d46dd4ac6866b4337ec126be8cee0e115467b3e8703794ba6f6df6432c806bc
- https://posts.specterops.io/automating-dll-hijack-discovery-81c4295904b0
author: Tim Rauch (rule), Elastic (idea)
date: 2022-10-21
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1566
- attack.t1566.001
- attack.initial-access
- attack.t1574
- attack.t1574.001
- attack.defense-evasion
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # add more processes when you find them
    - '\winword.exe'
    - '\excel.exe'
    - '\powerpnt.exe'
    - '\MSACCESS.EXE'
    - '\MSPUB.EXE'
    - '\fltldr.exe'
    - '\cmd.exe'
    - '\certutil.exe'
    - '\mshta.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\curl.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.dll'
    TargetFilename|contains|all:
    - '\Users\'
    - '\AppData\'
    TargetFilename|contains:
            # add more suspicious paths when you find them
    - '\Microsoft\OneDrive\'
    - '\Microsoft OneDrive\'
    - '\Microsoft\Teams\'
    - '\Local\slack\app-'
    - '\Local\Programs\Microsoft VS Code\'
  filter:
    Image|endswith: '\cmd.exe'
    TargetFilename|contains|all:
    - '\Users\'
    - '\AppData\'
    - '\Microsoft\OneDrive\'
    - '\api-ms-win-core-'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects attempts to create DLL files in sensitive application dependency directories, such as Microsoft OneDrive, Slack, and Microsoft Teams. The likely attacker objective is to execute a malicious module through DLL search order hijacking, exploiting the common behavior of these applications to load dynamic-link libraries from specified locations. This behavior aligns with the MITRE ATT&CK techniques T1574.001 (DLL Search Order Hijacking) and T1566.001 (Phishing: Spearphishing Attachment).

  The primary telemetry sources involve Windows file event logs, specifically tracking file creation or modification events within targeted directories. If malicious, this activity may lead to privilege escalation or persistence on the compromised system, compromising user data and application integrity. Importantly, this rule does NOT confirm malicious intent on its own; further validation through context and additional investigations is necessary.

  ### Investigation Steps

  - **Check process details:**
    - Investigate the parent process of the detected cmd.exe instance using Security Event ID 4688 to identify how the command prompt was invoked. A legitimate invocation might originate from user activity, while suspicious activity could stem from automation or unusual applications.

  - **Verify DLL file creation:**
    - Confirm the creation of the DLL file in the target path by examining Windows Event ID 4663 (File Access) and checking for `CreateFile` operations in paths such as `C:\Users\<username>\AppData\Local\Microsoft\OneDrive\`. Look for a file being created with a suspicious name or hash.

  - **Assess application context:**
    - Review the execution context of the detected command to determine if it aligns with legitimate user activity. Validate if the user possesses authorization to create files in the respective application folders (e.g., OneDrive, Teams). Legitimate user activity should correlate with business operations.

  - **Identify malicious indicators:**
    - Analyze the properties of the DLL file created, including its hash and digital signature, to identify known malicious artifacts or deviations from expected application behavior. Any hash that matches a known threat should trigger further investigation.

  - **Review previous logs for anomalies:**
    - Query previous file event logs (Event IDs 4663 and 4660) leading up to the alert and check for any unusual deletions or modifications of DLL files. This may indicate prior reconnaissance or preparation for the hijacking attempt.

  ### Prioritization

  This alert carries medium severity due to the potential impact on sensitive applications and user data. The likelihood of malicious abuse is significant, as DLL hijacking is a known tactic utilized by attackers to execute payloads stealthily. Although the exploitation of this vector is not as commonly weaponized as others, the presence of identifiable patterns increases the importance of timely and thorough analysis.

  ### Blind Spots and Assumptions

  Detection limitations include evasion techniques such as altering file paths or using legitimate applications for DLL creation, potentially obfuscating malicious intent. Reliable detection requires comprehensive Windows file logging configurations, and the absence of certain log sources can lead to missed alerts. Legitimate activities like updates to application configurations or legitimate user scripts may trigger the alert. A related detection to consider is monitoring for unusual command line arguments or parent-child process relationships involving cmd.exe and other administrative tools, thereby enriching the analysis context.

