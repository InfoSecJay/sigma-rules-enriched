title: Potential Initial Access via DLL Search Order Hijacking
id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
status: test
description: Detects attempts to create a DLL file to a known desktop 
  application dependencies folder such as Slack, Teams or OneDrive and by an 
  unusual process. This may indicate an attempt to load a malicious module via 
  DLL search order hijacking.
references:
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-5d46dd4ac6866b4337ec126be8cee0e115467b3e8703794ba6f6df6432c806bc
- https://posts.specterops.io/automating-dll-hijack-discovery-81c4295904b0
author: Tim Rauch (rule), Elastic (idea)
date: 2022-10-21
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1566
- attack.t1566.001
- attack.initial-access
- attack.t1574
- attack.t1574.001
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # add more processes when you find them
    - '\winword.exe'
    - '\excel.exe'
    - '\powerpnt.exe'
    - '\MSACCESS.EXE'
    - '\MSPUB.EXE'
    - '\fltldr.exe'
    - '\cmd.exe'
    - '\certutil.exe'
    - '\mshta.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\curl.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.dll'
    TargetFilename|contains|all:
    - '\Users\'
    - '\AppData\'
    TargetFilename|contains:
            # add more suspicious paths when you find them
    - '\Microsoft\OneDrive\'
    - '\Microsoft OneDrive\'
    - '\Microsoft\Teams\'
    - '\Local\slack\app-'
    - '\Local\Programs\Microsoft VS Code\'
  filter:
    Image|endswith: '\cmd.exe'
    TargetFilename|contains|all:
    - '\Users\'
    - '\AppData\'
    - '\Microsoft\OneDrive\'
    - '\api-ms-win-core-'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a DLL file in known application dependency folders (e.g., Slack, Teams, OneDrive) triggered by unusual processes, indicating a potential DLL search order hijacking attack. This behavior may be employed by attackers looking to execute malicious code when a user opens a legitimate application. It aligns with the MITRE ATT&CK techniques T1574.001 (DLL Search Order Hijacking) and T1566 (Phishing), often confirmed by malicious tasks that leverage such hijacking for persistence or privilege escalation.

  Primary telemetry sources include Windows file event logs, particularly monitoring the creation of DLL files (Event IDs 4663/4660) in user directories. If successful, an attacker could gain unauthorized access to a user account or escalate privileges through the loaded malicious DLL. However, this detection does not confirm that the DLL is malicious or that the attack has succeeded; further investigation is needed.

  ### Investigation Steps

  - **Identify the triggering process:** Review the originating executable process by correlating event logs (Event ID 4688 or Sysmon Event ID 1) to check if it corresponds to benign applications (e.g., Word, Teams). Investigate the command-line arguments for atypical behavior.

  - **Check DLL creation logs:** Validate the creation of the DLL by searching for file event logs (Event ID 4663) focusing on the target paths. The presence of DLL files in user profile directories under suspicious applications should be noted.

  - **Correlate with parent process:** Cross-reference the PID of the created DLL with the parent (likely the suspicious executable) in Sysmon (Process creation log) to determine if it was initiated by a legitimate or known malicious process.

  - **Review installed applications:** Verify the legitimacy of the installed applications by checking relevant context in installed programs and their dependencies. Ensure that applications leading to DLL creation are authorized and expected in the enterprise environment.

  - **Analyze the DLL file:** If possible, retrieve the suspicious DLL file and conduct a static/dynamic analysis. Look for signatures known to be used by adversaries or indicators (e.g., checksum matches for known malicious files).

  - **Expected behavior verification:** Document expected behavior of triggering applications and their normal file creation patterns, comparing it to the created DLL for anomalies indicating a potential threat.

  ### Prioritization

  The alert is medium severity due to the potential impact on user systems, particularly if the involved applications are critical for business operations. The likelihood of malicious activity is notable, as DLL hijacking is a common technique used by attackers, making it crucial to address promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where legitimate applications perform actions mimicking this rule, for example, third-party updates or authorized scripts. Required logs such as file creation events must be actively monitored and configured correctly. There could be false positives triggered by legitimate user actions in development environments or software installations. A related detection to strengthen coverage could be monitoring for abnormal process behavior within these applications (e.g., Sysmon Process Creation Events) to identify additional suspicious activity.

