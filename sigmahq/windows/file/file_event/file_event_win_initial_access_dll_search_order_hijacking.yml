title: Potential Initial Access via DLL Search Order Hijacking
id: dbbd9f66-2ed3-4ca2-98a4-6ea985dd1a1c
status: test
description: Detects attempts to create a DLL file to a known desktop application
  dependencies folder such as Slack, Teams or OneDrive and by an unusual process.
  This may indicate an attempt to load a malicious module via DLL search order hijacking.
references:
- https://github.com/elastic/protections-artifacts/commit/746086721fd385d9f5c6647cada1788db4aea95f#diff-5d46dd4ac6866b4337ec126be8cee0e115467b3e8703794ba6f6df6432c806bc
- https://posts.specterops.io/automating-dll-hijack-discovery-81c4295904b0
author: Tim Rauch (rule), Elastic (idea)
date: 2022-10-21
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1566
- attack.t1566.001
- attack.initial-access
- attack.t1574
- attack.t1574.001
- attack.defense-evasion
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # add more processes when you find them
    - '\winword.exe'
    - '\excel.exe'
    - '\powerpnt.exe'
    - '\MSACCESS.EXE'
    - '\MSPUB.EXE'
    - '\fltldr.exe'
    - '\cmd.exe'
    - '\certutil.exe'
    - '\mshta.exe'
    - '\cscript.exe'
    - '\wscript.exe'
    - '\curl.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    TargetFilename|endswith: '.dll'
    TargetFilename|contains|all:
    - '\Users\'
    - '\AppData\'
    TargetFilename|contains:
            # add more suspicious paths when you find them
    - '\Microsoft\OneDrive\'
    - '\Microsoft OneDrive\'
    - '\Microsoft\Teams\'
    - '\Local\slack\app-'
    - '\Local\Programs\Microsoft VS Code\'
  filter:
    Image|endswith: '\cmd.exe'
    TargetFilename|contains|all:
    - '\Users\'
    - '\AppData\'
    - '\Microsoft\OneDrive\'
    - '\api-ms-win-core-'
  condition: selection and not filter
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to exploit DLL search order hijacking, a technique commonly used to gain initial access or escalate privileges within a Windows environment. Attackers may create malicious DLL files in directories associated with well-known applications, such as Slack, Teams, or OneDrive, often targeting user-specific locations like AppData. This technique allows unauthorized code execution by tricking an application into loading a rogue DLL instead of the legitimate one, potentially leading to further compromise of the host or lateral movement within the network.

  The suspected threat family could involve generic initial access techniques or known adversaries that utilize this methodology for lateral movement or persistence. Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access (TA0001)**
  - **Execution (TA0002): T1218 - Signed Binary Proxy Execution**
  - **Privilege Escalation (TA0004): T1574.001 - DLL Search Order Hijacking**

  Consequently, the best sources for evidence include file event logs and process creation events, particularly those detailing file modifications in user-specific directories or common application folders.

  ### Investigation Steps
  - **Review File Modification Logs:** Examine Windows file event logs focused on write operations to suspicious directories, such as AppData or application folders (e.g., OneDrive, Teams). Look for unexpected DLL files being created by uncommon processes.
  - **Analyze Process Creation Events:** Correlate process creation logs in conjunction with file modifications. Investigate whether known processes (like cmd.exe or powershell.exe) were used to create DLLs in the targeted directories, which could indicate a potential unauthorized action.
  - **Conduct a Threat Hunt for DLL Behavior:** Utilize your EDR solution to search for behaviors typically associated with DLL hijacking, such as uncommon DLL load sequences or unusual parent-child process relationships linked to Office applications.
  - **Scrutinize User Privilege Levels:** Assess the privilege levels of user accounts that triggered this detection. Investigating accounts with elevated permissions that should not be creating DLLs in user application directories will help identify potential compromises.

  ### Prioritization
  This alert should be treated with medium severity due to the potential for initial access or privilege escalation by a threat actor. The likelihood of exploitation in environments with sufficient protections (like application whitelisting) reduces, but the presence of this technique indicates a possible compromise pathway that warrants immediate investigation.

  ### Blind Spots and Assumptions
  The detection logic relies on identifying specific processes and file paths; thus, there may be instances where legitimate application behavior is incorrectly flagged as malicious, particularly in environments heavily utilizing these applications. Furthermore, if file event logging is not enabled for user directories or if unusual processes aren't captured, there could be gaps in detection coverage. The assumption is also made that no legitimate administrative tools are being misused to create DLL files, which could lead to false positives if not properly filtered. Ensuring comprehensive logging is enabled for relevant processes and directories is essential for the effective functioning of this detection.

