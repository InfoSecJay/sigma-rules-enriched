title: Process Explorer Driver Creation By Non-Sysinternals Binary
id: de46c52b-0bf8-4936-a327-aace94f94ac6
status: test
description: |
  Detects creation of the Process Explorer drivers by processes other than Process Explorer (procexp) itself.
  Hack tools or malware may use the Process Explorer driver to elevate privileges, drops it to disk for a few moments, runs a service using that driver and removes it afterwards.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/process-explorer
- https://github.com/Yaxser/Backstab
- https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks
- https://news.sophos.com/en-us/2023/04/19/aukill-edr-killer-malware-abuses-process-explorer-driver/
author: Florian Roth (Nextron Systems)
date: 2023-05-05
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1068
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\PROCEXP'
    TargetFilename|endswith: '.sys'
  filter_main_process_explorer:
    Image|endswith:
    - '\procexp.exe'
    - '\procexp64.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some false positives may occur with legitimate renamed process explorer 
  binaries
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of drivers associated with Process Explorer (`PROCEXP`) by processes that are not the legitimate `procexp` binary. Malicious actors often exploit Process Explorer's drivers to elevate privileges, executing payloads without permission, or perform other malicious tasks. The relevant MITRE ATT&CK techniques are Persistence (T1547) and Privilege Escalation (T1068). Primary telemetry sources include Windows file event logs, specifically looking for file creations with target filenames containing `PROCEXP` and ending with `.sys`. If the detection is confirmed malicious, it potentially indicates a security breach with elevated privileges. Importantly, this detection does NOT confirm that all non-Process Explorer executable creations of these drivers are malicious, as legitimate use cases could exist.

  ### Investigation Steps

  - **Check process origin:** Review the parent process of the detected event using Process ID and correlate it with Security Event ID 4688. Look for expected legitimate processes such as `procexp.exe` or system services creating drivers; suspicious origins could indicate malicious intent.

  - **Validate the driver instance:** Examine the created files via Windows Event ID 4663 (Standard Audit: Access File) for created `*.sys` drivers in system directories. Check for timestamps indicating brief existence, as malicious drivers are often dropped, used, and then deleted quickly.

  - **Identify high-confidence malicious indicators:** Cross-reference the event with known hashes of malicious drivers or malware (e.g., from threat intelligence platforms) that have been reported to use Process Explorer's driver.

  - **Review Windows Service creation events:** Inspect Service Control Manager logs (Event ID 7045 entries) post-detection for any new services tied to the created driver, which may suggest malicious persistence in system operations.

  - **Assess legitimate use scenarios:** Identify if `procexp.exe` or `procexp64.exe` were executed as part of IT operations. Review change management logs or request systems to contextualize the use case for the driver creation.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on the affected system from privilege escalation tactics utilized by attackers. The likelihood of malicious abuse is elevated, as the behavior directly aligns with known exploitation techniques tied to malware utilizing Process Explorer's components. Moreover, this behavior is commonly weaponized in various attack vectors, heightening the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the renaming of legitimate binaries to disguise malicious activity. Required log sources include comprehensive event logs from Windows, specifically file events related to timing and process behavior. Legitimate activities such as software testing or administrative scripts could inadvertently trigger the alert. Companion detections such as monitoring for unusual service creation (Event ID 7045) or abnormal privilege escalations would strengthen coverage against such lateral movements.

