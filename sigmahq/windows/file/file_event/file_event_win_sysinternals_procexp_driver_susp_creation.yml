title: Process Explorer Driver Creation By Non-Sysinternals Binary
id: de46c52b-0bf8-4936-a327-aace94f94ac6
status: test
description: |
  Detects creation of the Process Explorer drivers by processes other than Process Explorer (procexp) itself.
  Hack tools or malware may use the Process Explorer driver to elevate privileges, drops it to disk for a few moments, runs a service using that driver and removes it afterwards.
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/process-explorer
- https://github.com/Yaxser/Backstab
- https://www.elastic.co/security-labs/stopping-vulnerable-driver-attacks
- https://news.sophos.com/en-us/2023/04/19/aukill-edr-killer-malware-abuses-process-explorer-driver/
author: Florian Roth (Nextron Systems)
date: 2023-05-05
modified: 2026-06-29
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1068
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\PROCEXP'
    TargetFilename|endswith: '.sys'
  filter_main_process_explorer:
    Image|endswith:
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\procexp64a.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Some false positives may occur with legitimate renamed process explorer 
  binaries
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of drivers associated with Process Explorer by any process other than the legitimate executable versions of Process Explorer itself. Malicious actors may exploit these drivers to gain elevated privileges or perform unauthorized actions on a system, as the drivers allow low-level access to system operations. This behavior typically falls under the MITRE ATT&CK tactic of Persistence (T1547) and Privilege Escalation (T1068).

  The primary telemetry source includes Windows file event logs for driver creation, specifically monitoring for files that match the naming conventions for Process Explorer drivers (e.g., those containing '\PROCEXP' and ending with '.sys'). If exploited, the security impact could be severe, as attackers may leverage the driver to escalate privileges or maintain persistence on compromised systems. However, this detection does NOT confirm that malicious activity is occurring without further confirmation of intent and context.

  ### Investigation Steps

  - **Identify the creating process**: Cross-reference the Event ID related to the driver creation (e.g., Security Event ID 4663 or Sysmon Event ID 10) with the ParentProcessName field to see what process attempted the driver creation. Expected behavior typically shows 'procexp.exe' as the parent process.

  - **Inspect the target filename**: Check the TargetFilename field in file event logs for any recent creations of files matching the pattern '\PROCEXP*.sys'. Malicious indicators include non-'procexp' binaries attempting to create these drivers.

  - **Review process legitimacy**: Validate the legitimacy of the creating process against known good file hashes using VirusTotal or other reputation services. Confirm that any process listed has not been renamed or tampered with.

  - **Examine timing of events**: Look for timing correlations between the driver creation and other suspicious activities (e.g., multiple process creations within seconds) to establish potential malicious workflows.

  - **Analyze for service creation**: If a service referencing the malicious driver is observed (via Event Logs for service creation like Event ID 7045), it could suggest an attempt to maintain persistence. Immediate follow-up on these services is necessary.

  - **Look for driver deletion actions**: Investigate Events reflecting the deletion of the same driver files shortly after creation; this is a typical behavior for adversaries trying to cover their tracks once a privilege escalation has been executed.

  ### Prioritization

  The alert has high severity due to the potential impact of the affected system. The ability to create or manipulate System drivers indicates a strong likelihood of malicious intent, especially since this behavior is commonly leveraged in privilege escalation attacks. Given that Process Explorer is a legitimate system tool, its misuse represents a critical security concern.

  ### Blind Spots and Assumptions

  Detection is limited as legitimate instances may arise from renamed or modified versions of Process Explorer, leading to false positives. The absence of specific Event IDs or log configurations can hinder visibility; thus, ensuring that file event logs are enabled and correctly configured is essential. Other benign activities that might trigger the alert include legitimate developer testing or updates involving the tools used for system diagnostics and performance analysis. Companion detections such as monitoring for attempts to uninstall or disable security tools could enhance coverage against such attacks.

