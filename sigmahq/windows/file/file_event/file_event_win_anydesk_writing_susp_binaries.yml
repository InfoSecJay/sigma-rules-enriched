title: Suspicious Binary Writes Via AnyDesk
id: 2d367498-5112-4ae5-a06a-96e7bc33a211
status: test
description: |
  Detects AnyDesk writing binary files to disk other than "gcapi.dll".
  According to RedCanary research it is highly abnormal for AnyDesk to write executable files to disk besides gcapi.dll,
  which is a legitimate DLL that is part of the Google Chrome web browser used to interact with the Google Cloud API. (See reference section for more details)
references:
- https://redcanary.com/blog/misbehaving-rats/
- https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-28
modified: 2025-02-24
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\AnyDesk.exe'
    - '\AnyDeskMSI.exe'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_dlls:
    TargetFilename|endswith: '\gcapi.dll'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify instances where AnyDesk, a popular remote desktop tool, writes binary files to disk, specifically looking for file creations that are not the legitimate `gcapi.dll`. According to security research by Red Canary, such behavior is atypical and suggests potential malicious activity, such as a remote access Trojan (RAT) or other unauthorized remote access tools being used in a compromised environment. Attackers leveraging AnyDesk may aim to install malicious payloads on endpoints, thereby gaining persistent access and control over target systems.

  The applicable MITRE ATT&CK tactics include **Command and Control (T1071)** as the rule focuses on detecting abnormal behaviors associated with remote access tools, and **Execution (T1203)** due to the execution of malicious binaries on the system. The specific technique of interest, as tagged by MITRE, is **T1219.002: Remote Access Software**, which highlights the misuse of legitimate tools for malicious purposes.

  The primary data sources for this detection will be Windows file event logs, which capture the creation and modification of files on endpoints, allowing for the identification of suspicious binary write operations performed by AnyDesk.

  ### Investigation Steps
  - **Review File Write Events:** Analyze the file event logs to identify write operations initiated by AnyDesk. Look for binary files that are created, particularly any `.dll` or `.exe` files that do not match `gcapi.dll`.

  - **Correlate with Process Activity:** Check the process creation logs around the time of the file write events. This can help determine if AnyDesk was being executed legitimately or if there were suspicious command lines associated with its execution.

  - **Monitor Network Activity:** Inspect network traffic logs for AnyDesk connections, focusing on unusual or unauthorized IP addresses and data flows during the times when file writes were logged.

  - **Cross-Reference Installed Software:** Verify the installed software on the system to determine if AnyDesk is an authorized application. Ensure that basic principles of least privilege are being followed to prevent unauthorized application use.

  ### Prioritization
  The alert's severity is classified as high due to the inherent risks posed by remote access tools when misused, which can lead to data breaches and unauthorized access to sensitive systems. The likelihood of encountering such threats is elevated in environments where remote support tools are common.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage may arise if logs are not retained for sufficient durations or if file event logging is not consistently enabled across all endpoints. The detection logic assumes that AnyDesk installations are legitimate; unauthorized installations could generate false positives. Additionally, proper configurations must be in place to ensure file event logging captures all necessary write operations associated with AnyDesk, including any potential obfuscation or evasion tactics that malicious actors may employ.

