title: Suspicious Binary Writes Via AnyDesk
id: 2d367498-5112-4ae5-a06a-96e7bc33a211
status: test
description: |
  Detects AnyDesk writing binary files to disk other than "gcapi.dll".
  According to RedCanary research it is highly abnormal for AnyDesk to write executable files to disk besides gcapi.dll,
  which is a legitimate DLL that is part of the Google Chrome web browser used to interact with the Google Cloud API. (See reference section for more details)
references:
- https://redcanary.com/blog/misbehaving-rats/
- https://thedfirreport.com/2025/02/24/confluence-exploit-leads-to-lockbit-ransomware/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-09-28
modified: 2025-02-24
tags:
- attack.command-and-control
- attack.t1219.002
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\AnyDesk.exe'
    - '\AnyDeskMSI.exe'
    TargetFilename|endswith:
    - '.dll'
    - '.exe'
  filter_dlls:
    TargetFilename|endswith: '\gcapi.dll'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects anomalous behavior exhibited by AnyDesk, specifically when it writes executable binary files (.dll or .exe) to disk other than "gcapi.dll." The primary objective of an attacker using AnyDesk could be to facilitate remote access or to deploy malicious payloads on compromised systems. This behavior aligns with the MITRE ATT&CK tactics of Command and Control (T1071) and Remote Access Tools (T1219.002). The primary telemetry sources include Windows file event logs tracking process behavior, particularly File Creation/Modification logs. If confirmed malicious, this behavior could lead to unauthorized access, data exfiltration, or lateral movement within the environment. It's important to note that this detection does NOT confirm malicious activity by itself, as legitimate applications might misbehave or unintentionally write files.

  ---

  ### Investigation Steps

  - **Check recent AnyDesk activity**: Review Windows Security Event ID 4688 for AnyDesk process creation. Look for unexpected execution patterns or timestamps that vary from normal operational hours.

  - **Verify binary write locations**: Inspect File Creation logs (Event ID 4663) for AnyDesk writing binaries outside standard directories (e.g., System32, Program Files). Legitimate binaries typically reside in C:\Program Files\AnyDesk.

  - **Identify high-confidence malicious indicators**: Search for executable files (.exe or .dll) written to disk with suspicious names or paths using Event ID 4663. Focus on any files that were created unusually (last modified timestamps).

  - **Review gcapi.dll as a reference**: Validate that AnyDesk is only writing gcapi.dll files, which should accompany AnyDesk's operation. Any other binaries are considered suspicious and warrant deeper investigation.

  - **Assess host role**: Determine if the machine running AnyDesk is a sensitive asset (e.g., a domain controller, file server) or if it is associated with standard user activity. Malicious activity on critical assets warrants immediate attention.

  ---

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive systems and the likelihood of abuse by attackers who utilize tools like AnyDesk for remote control and lateral movement. The nature of the behavior is not commonly seen in legitimate configurations, making it a strong candidate for further investigation.

  ---

  ### Blind Spots and Assumptions

  There are limitations in distinguishing between legitimate and malicious usage of AnyDesk, particularly in environments where it may be approved software. Additionally, configurations that do not capture File Creation logs will hinder detection. Legitimate administrative activities can sometimes result in unexpected binary writes. Companion detections such as monitoring for unusual outbound network connections originating from AnyDesk could complement this rule and provide further context.

