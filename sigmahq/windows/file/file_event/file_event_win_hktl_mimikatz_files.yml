  ### Technical Context

  This Sigma rule detects the creation of files associated with Mimikatz, specifically looking for files with extensions like ".kirbi" (Kerberos ticket files) and "mimilsa.log" (MemSSP logging). The likely objective of an attacker employing Mimikatz is to extract or manipulate Kerberos tickets to gain unauthorized access to network resources, which can potentially lead to privilege escalation and lateral movement.

  The detection corresponds to the MITRE ATT&CK technique “Credential Dumping: Kerberoasting” (T1558). Primary telemetry sources include Windows file event logs indicating file creation (Event ID 4663), with a specific focus on paths that generate .kirbi and mimilsa.log files. The security impact of this detection is high; if malicious, it indicates a significant risk of credential theft and possible domain compromise. However, this detection does not confirm the execution of Mimikatz or any subsequent use of the credentials obtained.

  ---

  ### Investigation Steps

  - **Check recent file creation events:** Query Windows Security logs for Event ID 4663 and filter for file paths that end with ".kirbi" or "mimilsa.log." Look for unusual creation times or locations that differ from normal operational patterns.

  - **Review process creation logs:** Analyze Windows Event ID 4688 (Process Creation) for any instances where Mimikatz or associated binaries (e.g., "mimikatz.exe") were executed, particularly around the time of file creation.

  - **Identify related credential activities:** Investigate related credential access attempts through Windows Event ID 4624 (Logon) and ensure that there are no anomalous logons that coincide with the file creation timestamps. Specifically, legitimate service accounts should not be producing these artifacts.

  - **Document legitimate behavior patterns:** Recognize that legitimate administrative activities may involve Mimikatz for testing or legitimate security assessments. Record who performed these actions and any relevant ticketing system entries that justify the file creation.

  - **Identify high-confidence malicious indicators:** Look for concurrent usage of T1558 techniques with known command lines associated with Mimikatz, especially parameters commonly used for Kerberoasting attacks, which will help differentiate between benign and malicious usage.

  - **Validate exfiltration artifacts:** Check for any subsequent file operations such as network transfers or other unusual file access patterns, which may indicate an attempt to exfiltrate the created .kirbi files.

  ---

  ### Prioritization

  The alert is critical due to the high potential impact on security posture if a successful credential attack is occurring. The likelihood of malicious abuse is elevated given that Mimikatz is often used in real-world compromises, making this behavior highly concerning and worthy of immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logs are not retained long enough to provide context for the file creations or if file system auditing is not appropriately configured. Legitimate activities, such as internal security assessments, may also trigger this alert, complicating investigations. A companion detection that enhances coverage is the monitoring of processes and command lines related to Mimikatz execution as indicated by Event ID 4688, increasing confidence during investigation.

