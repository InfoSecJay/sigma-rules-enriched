  ### Technical Context

  This Sigma rule detects the creation of specific file types associated with the Mimikatz hacking tool, namely ".kirbi" files (Kerberos ticket files) and "mimilsa.log" (related to the MemSSP). The detection indicates potential credential access attempts, as attackers often use Mimikatz to extract and manipulate Kerberos ticket-granting tickets (TGTs) for lateral movement within a network. This behavior aligns with the MITRE ATT&CK technique "Credential Dumping" (T1558).

  The primary telemetry sources for this detection are Windows file event logs that capture file creation activities. If identified as malicious, the impact could be significant, allowing unauthorized access to network resources by impersonating legitimate users. However, this detection alone does not confirm malicious intent, as legitimate applications may produce similar file types under certain conditions.

  ---

  ### Investigation Steps

  - **Check Event Logs for File Creation:** Review Windows File Event logs (Event ID 4663) for file creation activities involving ".kirbi" or "mimilsa.log" to confirm detection context.

  - **Identify the File Creation User:** Correlate the file creation event with the user account involved. Investigate whether the user has legitimate access rights. If the account is non-admin and lacks Kerberos interaction, this raises a flag.

  - **Examine the Process Tree:** Analyze the process tree at the time of file creation (Sysmon Event ID 1). Look for instances of Mimikatz or suspicious scripts that might have executed the file creation.

  - **Review Kerberos Ticket Activity:** Check for related Kerberos ticket requests or replication events (Event ID 4769) near the time of file creation to see if the behavior correlates with legitimate access patterns.

  - **Determine Host Role:** Assess if the host where the .kirbi or log file was created is critical for operations (e.g., Domain Controllers, File Servers) and whether it should be generating such files.

  - **Observe Application Logs for Anomalous Usage:** Utilize application logs for authentication processes (Event IDs 4624 and 4625) to monitor for unusual patterns in logon attempts following the file creation.

  ---

  ### Prioritization

  The alert severity is critical due to the potential for significant security impact if an attacker successfully exploits credential access. The likelihood of malicious abuse is high, as Mimikatz is a well-known tool often used in active attacks, particularly against Windows environments. Credential dumping is a frequent precursor to further exploitation in established attack workflows.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited by the presence of file creations from legitimate administrative tools or activities. The required log sources for reliable detection include Windows Event logs, particularly those related to file system activity and Kerberos events. Legitimate activities, such as security assessments using Mimikatz by authorized personnel, may inadvertently trigger this alert. This detection rule should be paired with monitoring for abnormal authentication patterns (related detection: "Credential Dumping - Kerberos Tickets" T1558) to enhance overall detection coverage.

