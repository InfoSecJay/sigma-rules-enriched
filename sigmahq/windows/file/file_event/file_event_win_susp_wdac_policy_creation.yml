title: Potentially Suspicious WDAC Policy File Creation
id: 1d2de8a6-4803-4fde-b85b-f58f3aa7a705
status: experimental
description: |
  Detects suspicious Windows Defender Application Control (WDAC) policy file creation from abnormal processes that could be abused by attacker to block EDR/AV components while allowing their own malicious code to run on the system.
references:
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-using-group-policy
- https://beierle.win/2024-12-20-Weaponizing-WDAC-Killing-the-Dreams-of-EDR/
- https://github.com/logangoins/Krueger/tree/main
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/appcontrol-deployment-guide
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-script
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-memcm
author: X__Junior
date: 2025-02-07
modified: 2025-12-03
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection_target:
        # This is a default location but unfortunately it could be any path configured in Group Policy Management Editor.
        # No file extension needed because any extension would work, check first reference.
    TargetFilename|contains: '\Windows\System32\CodeIntegrity\'
  filter_main_images:
    Image|endswith:
    - '\Microsoft.ConfigurationManagement.exe'         # Replace with full path to avoid false negatives
    - '\WDAC Wizard.exe'         # Replace with full path to avoid false negatives
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\dllhost.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\dllhost.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_cli:
  - CommandLine|contains|all:
    - 'ConvertFrom-CIPolicy -XmlFilePath'
    - '-BinaryFilePath '
  - CommandLine|contains: 'CiTool --update-policy'
  - CommandLine|contains|all:
    - 'Copy-Item -Path'
    - '-Destination'
  filter_main_system:
    Image: 'System'
  filter_main_wuauclt:
    Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
  condition: selection_target and not 1 of filter_main_*
falsepositives:
- Administrators and security vendors could leverage WDAC, apply additional filters
  as needed.
level: medium
note: |
  ### Technical Context
  This rule detects the creation of potentially suspicious Windows Defender Application Control (WDAC) policy files from processes that are not typically expected to perform such actions. Attackers may exploit WDAC to manipulate application control policies on a target machine, enabling the execution of malicious code while disabling the functionality of endpoint detection and response (EDR) or antivirus (AV) solutions. This behavior is particularly concerning because it could facilitate the evasion of security measures and the sustained presence of malware.

  The relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion**: This rule primarily falls under the "Defense Evasion" tactic, specifically through the use of **Application Layer Protection (T1218)** by creating or modifying WDAC policies to hinder security tools.
  - **Execution**: By using legitimate tools and commands to alter policies, the attacker executes their code in a manner that avoids detection.

  Key data sources for this detection include:
  - **File event logs** from Windows, which capture the creation and modification of files, including policy documents associated with WDAC.

  ### Investigation Steps
  - **Review Generated Logs**: Examine Windows file event logs for entries indicating the creation of WDAC policy files, particularly those generated from processes not typically associated with this function.
  - **Analyze Process Activity**: Identify the parent and child processes involved in creating the policy files to determine if they originate from unusual or unauthorized sources.
  - **Verify Command Line Arguments**: Investigate the command line used during the creation of the WDAC policy files, looking for the use of specific key phrases such as "ConvertFrom-CIPolicy" or "CiTool --update-policy" that indicate potential misuse of legitimate tools.
  - **Cross-check with Whitelisted Applications**: Validate whether the processes involved in the policy file creation are part of the configured whitelisted applications. Any deviation may indicate malicious behavior.

  ### Prioritization
  This alert has a medium severity in an enterprise environment due to its potential impact; if attackers successfully manipulate WDAC policies, they can render EDR and AV solutions ineffective, significantly increasing the risk of malware infections and data breaches.

  ### Blind Spots and Assumptions
  The detection logic assumes that malicious actors will not use the primary processes (like `Microsoft.ConfigurationManagement.exe` or `wdac wizard.exe`) to create policy files, which may introduce false negatives if attackers employ these tools strategically. Additionally, if the system is not logging file events or if logging levels are insufficient, detection may fail entirely. Continuous monitoring and proper configurations of Windows logging settings are essential for the effectiveness of this alert.

