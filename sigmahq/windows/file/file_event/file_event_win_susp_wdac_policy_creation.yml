title: Potentially Suspicious WDAC Policy File Creation
id: 1d2de8a6-4803-4fde-b85b-f58f3aa7a705
status: experimental
description: |
  Detects suspicious Windows Defender Application Control (WDAC) policy file creation from abnormal processes that could be abused by attacker to block EDR/AV components while allowing their own malicious code to run on the system.
references:
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-using-group-policy
- https://beierle.win/2024-12-20-Weaponizing-WDAC-Killing-the-Dreams-of-EDR/
- https://github.com/logangoins/Krueger/tree/main
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/appcontrol-deployment-guide
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-script
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-memcm
author: X__Junior
date: 2025-02-07
modified: 2026-05-18
tags:
- attack.defense-impairment
logsource:
  category: file_event
  product: windows
detection:
  selection_target:
        # This is a default location but unfortunately it could be any path configured in Group Policy Management Editor.
        # No file extension needed because any extension would work, check first reference.
    TargetFilename|contains: '\Windows\System32\CodeIntegrity\'
  filter_main_images:
    Image|endswith:
    - '\Microsoft.ConfigurationManagement.exe'         # Replace with full path to avoid false negatives
    - '\WDAC Wizard.exe'         # Replace with full path to avoid false negatives
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\dllhost.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\dllhost.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_cli:
  - CommandLine|contains|all:
    - 'ConvertFrom-CIPolicy -XmlFilePath'
    - '-BinaryFilePath '
  - CommandLine|contains: 'CiTool --update-policy'
  - CommandLine|contains|all:
    - 'Copy-Item -Path'
    - '-Destination'
  filter_main_system:
    Image: 'System'
  filter_main_wuauclt:
    Image: 'C:\Windows\System32\wuauclt.exe'
  filter_main_wuaucltcore:
    Image:
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
    - 'C:\Windows\UUS\Packages\Preview\arm64\wuaucltcore.exe'
  condition: selection_target and not 1 of filter_main_*
falsepositives:
- Administrators and security vendors could leverage WDAC, apply additional 
  filters as needed.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of Windows Defender Application Control (WDAC) policy files from potentially harmful processes. Attackers may use this technique to create policies that disable security measures, such as EDR or antivirus software, while allowing their malware to execute unrestricted. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562) and related techniques like Application Layer Manipulation (T1573).

  The primary telemetry source for this detection is Windows file events, specifically tracking file creations in the `C:\Windows\System32\CodeIntegrity\` directory. If this behavior is confirmed to be malicious, it poses a significant risk, potentially allowing an adversary to fully compromise the system's defenses. However, it must be noted that this detection alone does not confirm the intent or success of an attack, as legitimate administrative activities can also generate similar file creations.

  ### Investigation Steps

  - **Identify the process creating the WDAC policy file:** Review Event IDs 4663 (File system access) and 4656 (Handle request) in Security logs to trace the origin of the process creating the file. Ensure the process is not among listed exempt processes from the Sigma rule.

  - **Examine the command-line arguments:** Check for command line entries related to `CiTool --update-policy` or `ConvertFrom-CIPolicy -XmlFilePath` in Event ID 4688 (Process Creation). Suspicious command lines that include terms for policy alteration warrant further scrutiny.

  - **Correlate with legitimate usage:** Confirm if any recent administrative actions involve the execution of `Microsoft.ConfigurationManagement.exe` or `powershell.exe`, typically indicating legitimate changes. If this activity is observed during unauthorized hours or by non-administrative users, its legitimacy may be questioned.

  - **Analyze associated file attributes:** Retrieve and evaluate details from the created policy files (e.g., hashes, creation time) to see if they correlate with known vulnerabilities or attack frameworks, focusing on properties from the file system event logs.

  - **Review system impact assessment:** Assess the system, if critical, to understand potential implications if malicious usage is confirmed; raise the severity of the alert's response protocol accordingly.

  - **Look for additional confirmations:** Check for other alerts or logs that indicate similar suspicious activities in proximity to the WDAC file creation, particularly instances of `PowerShell` or commands executed by `System` or `wuauclt.exe` that might show abuse pathways.

  ### Prioritization

  This alert should be treated as a medium severity due to its potential to impair application control defenses on a system. The risk escalates based on the criticality of the affected asset and the sophistication typically associated with similar evasion techniques. The likelihood of this behavior being weaponized in an attack is notable, making timely investigation essential.

  ### Blind Spots and Assumptions

  Detection may miss scenarios where attackers use alternative methods or legitimate tools not covered by this rule to interfere with WDAC policies. The completeness of logs must be ensured, as missing events could lead to oversight in detection. Administrative activities, such as legitimate policy updates via Group Policy, may generate similar alerts. Correlating this rule with companion detections focused on `PowerShell` activity (e.g., TTPs involving PowerShell scripting) will enhance overall security monitoring and incident response strategies.

