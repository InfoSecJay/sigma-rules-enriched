title: Potentially Suspicious WDAC Policy File Creation
id: 1d2de8a6-4803-4fde-b85b-f58f3aa7a705
status: experimental
description: |
  Detects suspicious Windows Defender Application Control (WDAC) policy file creation from abnormal processes that could be abused by attacker to block EDR/AV components while allowing their own malicious code to run on the system.
references:
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-using-group-policy
- https://beierle.win/2024-12-20-Weaponizing-WDAC-Killing-the-Dreams-of-EDR/
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/appcontrol-deployment-guide
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-script
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-memcm
author: X__Junior
date: 2025-02-07
modified: 2026-05-18
tags:
- attack.defense-impairment
logsource:
  category: file_event
  product: windows
detection:
  selection_target:
        # This is a default location but unfortunately it could be any path configured in Group Policy Management Editor.
        # No file extension needed because any extension would work, check first reference.
    TargetFilename|contains: '\Windows\System32\CodeIntegrity\'
  filter_main_images:
    Image|endswith:
    - '\Microsoft.ConfigurationManagement.exe'         # Replace with full path to avoid false negatives
    - '\WDAC Wizard.exe'         # Replace with full path to avoid false negatives
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\dllhost.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\dllhost.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_cli:
  - CommandLine|contains|all:
    - 'ConvertFrom-CIPolicy -XmlFilePath'
    - '-BinaryFilePath '
  - CommandLine|contains: 'CiTool --update-policy'
  - CommandLine|contains|all:
    - 'Copy-Item -Path'
    - '-Destination'
  filter_main_system:
    Image: 'System'
  filter_main_wuauclt:
    Image: 'C:\Windows\System32\wuauclt.exe'
  filter_main_wuaucltcore:
    Image:
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
    - 'C:\Windows\UUS\Packages\Preview\arm64\wuaucltcore.exe'
  condition: selection_target and not 1 of filter_main_*
falsepositives:
- Administrators and security vendors could leverage WDAC, apply additional 
  filters as needed.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of Windows Defender Application Control (WDAC) policy files from atypical processes, which may be indicative of an attacker attempting to manipulate application whitelisting features to disable endpoint detection tools, while allowing their own code to run. The attacker's objective is to gain execution privileges without arousing suspicion from traditional security mechanisms. This behavior maps to the MITRE ATT&CK tactic of Defense Evasion (T1203) and technique of Exploitation for Client Execution (T1203). The primary telemetry source includes Windows file event logs, specifically targeting file operations in the `C:\Windows\System32\CodeIntegrity\` directory. If malicious, this activity could significantly undermine system integrity and security controls, leading to potential data loss or unauthorized access. Importantly, this detection does NOT confirm malicious intent by itself, as legitimate activities by security administrators could resemble this behavior.

  ### Investigation Steps

  - **Check created file details**: Review the file creation event using Security Event ID 4663 for any entries in `C:\Windows\System32\CodeIntegrity\`. Focus on the `ObjectName` field for newly created policy files. Legitimate activity might show timestamps aligning with administrative tasks like scheduled policy updates.

  - **Review process parentage**: Analyze the parent process of the detected process that created the WDAC policy file. Check the Process ID (PID) chain using Sysmon Event ID 5 for unusual parent-child relationships, where unexpected or low-privileged processes spawn the creation.

  - **Evaluate command-line usage**: Investigate usage of specific command lines that triggered the detection, such as `ConvertFrom-CIPolicy -XmlFilePath`. Use Sysmon Event ID 1 to confirm the presence and arguments of these commands, and ensure they were run by expected administrative tools.

  - **Inspect recent administrative actions**: Check if any known administrative accounts have legitimately executed series of commands related to WDAC policy management. Review Event ID 4648 for credential access to confirm authorized administrator usage.

  - **Identify malicious indicators**: Look for signs of policy updates that indicate potential misuse. If new WDAC policies deny critical security files many known antivirus/antimalware binaries, this is a strong indicator of malicious activity. Log entries should match Event ID 4663 against expected legitimate paths.

  ### Prioritization

  The alert severity is medium, primarily because it suggests the potential for an attacker to undermine critical security controls on high-value systems. The likelihood of abuse is moderate, as this technique could directly impact endpoint protection effectiveness. Similar tactics are frequently observed in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  Limitations in detection could include obfuscation techniques where attackers use whitelisted administrative tools for policy creation, which may not be captured in standard logging. The effective deployment of this detection relies on comprehensive coverage of the Windows file system logs to include the `CodeIntegrity` directory. Legitimate activities that might trigger this alert include administrative updates or misconfigurations of security policies. A companion detection to consider is logging for Event ID 4104 from PowerShell to monitor for suspicious remote execution commands relevant to WDAC.

