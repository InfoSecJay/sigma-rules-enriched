title: Potentially Suspicious WDAC Policy File Creation
id: 1d2de8a6-4803-4fde-b85b-f58f3aa7a705
status: experimental
description: |
  Detects suspicious Windows Defender Application Control (WDAC) policy file creation from abnormal processes that could be abused by attacker to block EDR/AV components while allowing their own malicious code to run on the system.
references:
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-using-group-policy
- https://beierle.win/2024-12-20-Weaponizing-WDAC-Killing-the-Dreams-of-EDR/
- https://github.com/logangoins/Krueger/tree/main
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/appcontrol-deployment-guide
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-script
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-memcm
author: X__Junior
date: 2025-02-07
modified: 2025-12-03
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection_target:
        # This is a default location but unfortunately it could be any path configured in Group Policy Management Editor.
        # No file extension needed because any extension would work, check first reference.
    TargetFilename|contains: '\Windows\System32\CodeIntegrity\'
  filter_main_images:
    Image|endswith:
    - '\Microsoft.ConfigurationManagement.exe'         # Replace with full path to avoid false negatives
    - '\WDAC Wizard.exe'         # Replace with full path to avoid false negatives
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\dllhost.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\dllhost.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_cli:
  - CommandLine|contains|all:
    - 'ConvertFrom-CIPolicy -XmlFilePath'
    - '-BinaryFilePath '
  - CommandLine|contains: 'CiTool --update-policy'
  - CommandLine|contains|all:
    - 'Copy-Item -Path'
    - '-Destination'
  filter_main_system:
    Image: 'System'
  filter_main_wuauclt:
    Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
  condition: selection_target and not 1 of filter_main_*
falsepositives:
- Administrators and security vendors could leverage WDAC, apply additional 
  filters as needed.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of potentially suspicious Windows Defender Application Control (WDAC) policy files originating from abnormal processes. Attackers may exploit this functionality to undermine existing Endpoint Detection and Response (EDR) or antivirus solutions while executing their malicious payloads. The associated MITRE ATT&CK tactic is Defense Evasion (T1562), with techniques including Impair Defenses (T1562.001). The primary telemetry sources include Windows file system events, specifically targeting events related to file creation within the `C:\Windows\System32\CodeIntegrity\` directory. If malicious, the creation of these files could facilitate unauthorized software execution or shelter malware from detection. Importantly, this detection alone does NOT confirm malicious intent, as legitimate administrative tasks may also create similar files.

  ### Investigation Steps

  - **Verify process legitimacy:** Check if the process creating the WDAC policy file is a known and legitimate tool (e.g., `Microsoft.ConfigurationManagement.exe`, `wdac wizard.exe`). Security Event ID 4688 can provide process creation details.

  - **Examine the command line:** Review the command line arguments used during the policy file creation. Look for suspicious commands such as `ConvertFrom-CIPolicy -XmlFilePath` or `CiTool --update-policy`, indicating potential tampering attempts (Windows Event ID 4688).

  - **Check file creation details:** Investigate the file creation time and user context. Use Windows Security Event ID 4663 or Sysmon Event ID 11 to assess who created the file and when.

  - **Identify rare event patterns:** Look for unusual patterns such as multiple WDAC policy files being created in a short time frame, especially by processes not typically associated with system policy modification (Event ID 4688).

  - **Assess impacted systems:** Determine the criticality of the affected system. Systems with high exposure to sensitive data or that host critical applications should be prioritized for deeper investigation.

  - **Review legitimate WDAC usage:** Establish a baseline for expected WDAC policy creation within your organization. Document normal usage patterns to distinguish benign activity from potential malicious behavior.

  ### Prioritization

  This alert has medium severity, as it could indicate either a legitimate administrative action or a significant threat intending to undermine security controls. The likelihood of malicious abuse is concerning, given that this behavior may be weaponized to disable detection mechanisms frequently used in enterprise environments.

  ### Blind Spots and Assumptions

  The detection may miss instances where attackers modify existing WDAC policies without creating new files, potentially limiting visibility into ongoing compromises. Reliable log sources such as Sysmon must be configured to capture relevant events; otherwise, detection may fail. Legitimate administrative actions, such as routine updates, could trigger this alert, raising false positives. A companion detection worth considering is monitoring for unapproved changes to the registry in relation to application control policies, which may provide deeper insight into potential attacks.

