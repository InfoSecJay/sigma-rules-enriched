title: Potentially Suspicious WDAC Policy File Creation
id: 1d2de8a6-4803-4fde-b85b-f58f3aa7a705
status: experimental
description: |
  Detects suspicious Windows Defender Application Control (WDAC) policy file creation from abnormal processes that could be abused by attacker to block EDR/AV components while allowing their own malicious code to run on the system.
references:
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-using-group-policy
- https://beierle.win/2024-12-20-Weaponizing-WDAC-Killing-the-Dreams-of-EDR/
- https://github.com/logangoins/Krueger/tree/main
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/appcontrol-deployment-guide
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-script
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/app-control-for-business/deployment/deploy-appcontrol-policies-with-memcm
author: X__Junior
date: 2025-02-07
modified: 2025-12-03
tags:
- attack.defense-impairment
logsource:
  category: file_event
  product: windows
detection:
  selection_target:
        # This is a default location but unfortunately it could be any path configured in Group Policy Management Editor.
        # No file extension needed because any extension would work, check first reference.
    TargetFilename|contains: '\Windows\System32\CodeIntegrity\'
  filter_main_images:
    Image|endswith:
    - '\Microsoft.ConfigurationManagement.exe'         # Replace with full path to avoid false negatives
    - '\WDAC Wizard.exe'         # Replace with full path to avoid false negatives
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\dllhost.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\dllhost.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_cli:
  - CommandLine|contains|all:
    - 'ConvertFrom-CIPolicy -XmlFilePath'
    - '-BinaryFilePath '
  - CommandLine|contains: 'CiTool --update-policy'
  - CommandLine|contains|all:
    - 'Copy-Item -Path'
    - '-Destination'
  filter_main_system:
    Image: 'System'
  filter_main_wuauclt:
    Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
  condition: selection_target and not 1 of filter_main_*
falsepositives:
- Administrators and security vendors could leverage WDAC, apply additional 
  filters as needed.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of potentially malicious Windows Defender Application Control (WDAC) policy files, particularly when initiated from abnormal or unexpected processes. The primary aim of this behavior is to manipulate system controls to block security measures like Endpoint Detection and Response (EDR) or antivirus solutions while enabling the execution of unauthorized code by an attacker. Relevant MITRE ATT&CK techniques include "T1218 - Signed Binary Proxy Execution" and "T1562.001 - Impair Defenses: Disable or Modify Tools."

  The primary telemetry sources include File Creation Events from Windows with an emphasis on event types involving the manipulation of files in the `C:\Windows\System32\CodeIntegrity\` directory. If malicious, this behavior could allow attackers to evade security measures, making it critical for incident response. However, this detection alone does not confirm a successful compromise; it only indicates potential malicious activity requiring further investigation.

  ### Investigation Steps

  - **Examine file creation events**: Look for File Creation events (e.g., Windows Security Event ID 4663) specifically targeting `C:\Windows\System32\CodeIntegrity\`. Identify the process responsible for the file creation to determine if it’s an expected system process or an anomalous one.

  - **Verify command line usage**: Check CommandLine fields in the event logs for strings such as `ConvertFrom-CIPolicy -XmlFilePath` or `CiTool --update-policy`. These specific command usages in combination with unusual parent processes could indicate malicious intent.

  - **Identify legitimate activities**: Confirm if typical administrative tasks involving WDAC parameters are logged from trusted management tools, like SCCM or PowerShell scripts run by system administrators. Validate user accounts and timestamps for consistency with known management activities.

  - **Cross-reference legitimate software signatures**: Look for process images originating from trusted sources like `C:\Windows\System32\` or `C:\Program Files\PowerShell\`. Anomalies in known file paths or unexpected file signatures should be treated as malicious indicators.

  - **Assess process ancestry**: Investigate the parent processes of any suspicious file creations to identify unusual parent-child relationships. Legitimate WDAC management tools, such as `Microsoft.ConfigurationManagement.exe`, should remain the source of such file operations.

  - **Search for indicators of compromise (IoCs)**: Check for any previously established IoCs linked to malicious WDAC configurations or other execution artifacts. Look for unusual network traffic patterns or suspicious connections formed after the creation of these policy files.

  ### Prioritization

  This alert should be treated with medium priority given that the impacted system may utilize WDAC to enforce strict application control. There is a significant risk if this tactic is weaponized, as it directly targets the impairment of endpoint security tools. The likelihood of malicious abuse is concerning, particularly in environments where advanced evasion techniques are commonplace.

  ### Blind Spots and Assumptions

  This detection may be bypassed if attackers disable logging or use legitimate administrative tools to execute their plans in stealth. Required logs must be properly configured for file events related to WDAC; without them, detection will be incomplete. Additionally, legitimate administrative actions could trigger this alert, particularly during updates or configuration changes. Companion detections, such as monitoring for changes in Group Policy Objects (GPO) related to application control, can enhance overall coverage and reduce false positive rates.

