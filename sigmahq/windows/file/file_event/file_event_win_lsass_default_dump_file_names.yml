author: Florian Roth (Nextron Systems)
date: 2021-11-15
modified: 2024-10-08
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  product: windows
  category: file_event
detection:
  selection_1:
    TargetFilename|endswith:
    - '\Andrew.dmp'
    - '\Coredump.dmp'
    - '\lsass.dmp'
    - '\lsass.rar'
    - '\lsass.zip'
    - '\NotLSASS.zip'          # https://github.com/CCob/MirrorDump
    - '\PPLBlade.dmp'          # https://github.com/tastypepperoni/PPLBlade
    - '\rustive.dmp'         # https://github.com/safedv/RustiveDump/blob/main/src/main.rs#L35
  selection_2:
    TargetFilename|contains:
    - '\lsass_2'          # default format of procdump v9.0 is lsass_YYMMDD_HHmmss.dmp
    - '\lsassdmp'
    - '\lsassdump'
  selection_3:
    TargetFilename|contains|all:
    - '\lsass'
    - '.dmp'
  selection_4:
    TargetFilename|contains: 'SQLDmpr'
    TargetFilename|endswith: '.mdmp'
  selection_5:
    TargetFilename|contains:
    - '\nanodump'
    - '\proc_'         # NativeDump pattern https://github.com/ricardojoserf/NativeDump/blob/01d8cd17f31f51f5955a38e85cd3c83a17596175/NativeDump/Program.cs#L258
    TargetFilename|endswith: '.dmp'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule is designed to detect the creation of files that are indicative of memory dumps from the Local Security Authority Subsystem Service (LSASS) process. LSASS is a critical Windows process responsible for enforcing security policies and managing user logins. Attackers often target LSASS to extract sensitive information, including user credentials, by dumping its memory. Common tools used for this malicious activity include ProcDump, Nanodump, and MirrorDump. Detecting these file creations can be crucial in unveiling potential credential theft attempts or malicious access to sensitive data.

  The threat scenario typically involves an attacker gaining privileged access to a Windows system and executing tools to dump LSASS memory. This tactic aligns with the MITRE ATT&CK framework, particularly under the Credential Access tactic (ID: T1003) and the specific technique of Memory Dumping (ID: T1003.001). Understanding the techniques employed by the attacker can help prioritize incident response actions to mitigate further risks.

  The primary data sources for this detection include file event logs, particularly those related to the creation of files on Windows systems. Monitoring the file creation events for specific naming patterns associated with memory dump tools can provide early indicators of potential credential harvesting activities.

  ### Investigation Steps
  - **Review File Event Logs:** Collect and analyze file event logs from Windows endpoints to identify file creation events that match known LSASS memory dump file patterns.

  - **Cross-Reference Process Execution Logs:** Compare file creation events with process creation logs to determine if the memory dumping tools were executed by a previously unknown or suspicious process.

  - **Inspect User Activity Logs:** Investigate user and account activity logs for any recent authentication attempts that coincide with unusual file creation events, focusing on potential lateral movement.

  - **Correlate with Threat Intelligence:** Utilize threat intelligence feeds to assess whether the observed behavior corresponds with known attacks targeting LSASS memory, focusing on tactics commonly employed by advanced persistent threats (APTs).

  ### Prioritization
  This alert is considered high severity due to its association with credential theft and potential unauthorized access to sensitive systems. The likelihood of an attacker exploiting this vulnerability is significant, especially in organizations where privilege escalation and access to sensitive data are primary objectives.

  ### Blind Spots and Assumptions
  Detection capabilities may be limited if file event logging is not adequately configured on endpoints, potentially resulting in missed alerts. The logic assumes that memory dump tools will consistently generate recognizable file names, which an attacker might obfuscate or alter to avoid detection. Additionally, this rule may not account for less common memory dumping techniques that do not generate associated file events. Ensuring extensive logging configurations and monitoring for a wider range of artifacts will enhance detection efficacy.

