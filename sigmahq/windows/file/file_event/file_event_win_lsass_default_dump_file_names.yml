logsource:
  product: windows
  category: file_event
detection:
  selection_1:
    TargetFilename|endswith:
    - '\Andrew.dmp'
    - '\Coredump.dmp'
    - '\lsass.dmp'
    - '\lsass.rar'
    - '\lsass.zip'
    - '\NotLSASS.zip'          # https://github.com/CCob/MirrorDump
    - '\PPLBlade.dmp'          # https://github.com/tastypepperoni/PPLBlade
    - '\rustive.dmp'         # https://github.com/safedv/RustiveDump/blob/main/src/main.rs#L35
  selection_2:
    TargetFilename|contains:
    - '\lsass_2'          # default format of procdump v9.0 is lsass_YYMMDD_HHmmss.dmp
    - '\lsassdmp'
    - '\lsassdump'
  selection_3:
    TargetFilename|contains|all:
    - '\lsass'
    - '.dmp'
  selection_4:
    TargetFilename|contains: 'SQLDmpr'
    TargetFilename|endswith: '.mdmp'
  selection_5:
    TargetFilename|contains:
    - '\nanodump'
    - '\proc_'         # NativeDump pattern https://github.com/ricardojoserf/NativeDump/blob/01d8cd17f31f51f5955a38e85cd3c83a17596175/NativeDump/Program.cs#L258
    TargetFilename|endswith: '.dmp'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files commonly associated with memory dumps of the LSASS (Local Security Authority Subsystem Service) process, a critical Windows service that manages user authentication. Attackers aim to capture these memory dumps to extract sensitive information, such as user credentials, to facilitate later stages of an attack. The relevant MITRE ATT&CK tactic is **Credential Access** (TA0006) and the technique is **Memory Dumping** (T1003.001).

  The primary telemetry source for this detection is Windows file event logs, specifically monitoring for file creations with names or patterns identifiable as memory dumps. If successful, an attacker could gain access to privileged credentials. However, this detection alone does not confirm malicious intent; legitimate system maintenance or debugging activities may also result in similar file creations.

  ### Investigation Steps

  - **Identify the process creating the dump file**: Check Windows Event ID 4663 for detailed information on the file creation event. Review the `AccessMask` field for any anomalous account activity tied to high-privilege processes.

  - **Evaluate file metadata**: Analyze the creation timestamp and user context of the dump file (File Creation Time, User, Path). Legitimate dump files will typically have creation timestamps aligning with scheduled maintenance or troubleshooting events.

  - **Search for known malicious indicators**: Look for the presence of keywords in the file name, such as "procdump," "nanodump," or "rustive." These indicate a higher likelihood of malicious behavior. For example, files created matching patterns like `\lsass.dmp`, or `\Coredump.dmp` should be flagged as potential security incidents.

  - **Review system logs for previous actions**: Cross-reference Windows Sysmon Event ID 10 to look for processes that spawned the memory dump creation. Analyze command-line arguments for indications of malicious execution contexts, such as uncommon process parents.

  - **Correlate user activities**: Investigate the authenticated user at the time of file creation. Determine if their actions are typical for their role (e.g., a developer versus an administrator) vs. common patterns of credential theft operations.

  - **Validate against known benign activity**: Compare findings with recent legitimate activities like IT troubleshooting efforts. Check for standard file creation patterns that may not align with known threat behaviors or user profiles in role-based access contexts.

  ### Prioritization

  This alert should be considered high severity due to the critical role of LSASS in secure authentication processes. The likelihood of this behavior being weaponized is significant, as attackers frequently employ tools to capture stored credentials within LSASS for escalation and lateral movement.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming dump files or modifying their creation timestamps. It is essential that file creation monitoring is comprehensive, with audit logging enabled to capture relevant activities around file management. Legitimate activities that could trigger this alert include developers creating memory dumps for debugging purposes. Companion detection rules targeting unusual process creations or command-line execution patterns associated with LSASS can enhance overall detection efficacy.

