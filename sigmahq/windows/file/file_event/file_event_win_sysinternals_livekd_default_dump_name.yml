  ### Technical Context

  This rule detects the creation of a file named `C:\Windows\livekd.dmp`, which is associated with the LiveKD tool used for live kernel debugging and could indicate malicious activity. The likely attacker objective is to capture sensitive kernel memory to extract credentials or other sensitive information without leaving extensive traces. This behavior aligns with the MITRE ATT&CK technique for privilege escalation (T1068 - Exploitation of Elevation Control Mechanism) and defense evasion (T1561 - Indicator Suppression).

  The primary telemetry sources are Windows file event logs capturing file creation activities. The security impact of this behavior is significant, as a malicious actor could exploit kernel memory dumps to gather sensitive information from the system. It's important to note that the detection of this file creation alone does not confirm malicious activity; legitimate debugging by authorized personnel can also lead to this event.

  ---

  ### Investigation Steps

  - **Verify file creation event:** Check Windows Security Event ID 4663 for `C:\Windows\livekd.dmp`. Look for events with access type "Create" and navigating field "Object Name" to validate the exact creation timeframe.

  - **Cross-reference access source:** Investigate the origin of the file creation by reviewing Event ID 4688 (Process Creation) and determining if `livekd.exe` or another suspicious process initiated the dump. Check the command line parameters for unusual flags.

  - **Monitor user account context:** Identify the user account that created the file. Look for anomalous account behavior or any non-administrative users that might be associated with the creation event.

  - **Correlate with legitimate usage:** Understand expected legitimate use cases by confirming operational policies around LiveKD. Review your environment’s documentation to see if and when kernel debugging is permitted; document any known uses.

  - **Identify high-confidence malicious indicators:** Investigate for other file artifacts, such as evidence of the Sysinternals Suite usage or unexpected WinDbg process logs that may correlate with the creation of `livekd.dmp`.

  - **Check for evidence of data exfiltration:** Verify recent network activity for unusual outbound connections, especially from hosts creating `livekd.dmp`. Look for anomalies in outbound traffic logs that could suggest exfiltration attempts related to kernel memory access.

  ---

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on sensitive systems and its likelihood of malicious manipulation by adversaries trying to exploit kernel-level insights. This behavior is not commonly observed in benign operations, making it a key indicator of potential exploitation activities.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by environments where Windows file event logs are not fully captured or where logging levels are insufficiently robust. Adversaries might use tools or techniques to obfuscate their presence when creating such files. Legitimate administrative tasks or debugging processes may inadvertently trigger this alert, underscoring the need for thorough context review. A companion detection strategy could include monitoring for administrative command executions that align with live kernel debugging workflows for enhanced coverage.

