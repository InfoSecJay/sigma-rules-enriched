note: |
  ### Technical Context

  This rule detects the creation of a kernel memory dump file named `C:\Windows\livekd.dmp`, which is associated with the LiveKD tool used for live kernel debugging. This behavior could indicate a malicious actor attempting to collect sensitive system memory for further analysis or exploitation. The likely attacker objective is privilege escalation or reconnaissance within the compromised environment. This behavior maps to the MITRE ATT&CK technique T1064 (Scripting) and tactic TA0058 (Privilege Escalation).

  The primary telemetry sources are Windows File Event logs that capture file creation activities. If the file creation is malicious, it poses a significant security risk as it may allow for the extraction of sensitive information or rootkit installation. Importantly, this detection does not itself confirm intent; legitimate debugging by system administrators might produce similar events if LiveKD is misused or improperly authorized in production environments.

  ### Investigation Steps

  - **Review File Creation Event**: Check Windows Security Event ID 4663 and File Event logs to identify the creation of `C:\Windows\livekd.dmp`. Note the account that performed this action and ensure it is an expected administrator profile.

  - **Identify the Process that Created the File**: Investigate the associated process creation events (Security Event ID 4688 or Sysmon Event ID 1) around the time the dump was created. Confirm if the process aligns with expected administrative tools; unauthorized tools indicate malicious intent.

  - **Analyze User Behavior**: Assess the recent activities of the user account that created the dump file. Look for other anomalous behavior, such as unusual logon times or access to resources (e.g., Event ID 4624 for logons). Known administrative tasks may include periodic system checks or updates.

  - **Check for Additional Indicators**: Search for similar file creation events in proximity to the alert. For instance, if multiple `.dmp` files are created or if there are subsequent suspicious commands executed (e.g., SSH, PowerShell commands) using methodologies like Sysmon or command-line logs.

  - **Validate against Known Legitimate Uses**: Confirm whether the organization has a documented need for live kernel debugging and if proper controls exist for any authorized usage, noting that such actions should be rare and monitored closely.

  - **Investigate File Permissions and Network Activity**: Examine permissions of `livekd.dmp` and whether it has been accessed, modified, or transferred post-creation (e.g., using file transfer logs) to confirm potential exfiltration or unauthorized access.

  ### Prioritization

  Given the potential impact on sensitive system information and the likelihood that this behavior can be weaponized by attackers for privilege escalation, this alert should be treated as high severity. The ability to gain insights into memory contents can significantly facilitate further compromises.

  ### Blind Spots and Assumptions

  Detection may be limited if file logging is not adequately configured, or if file operations are misattributed to legitimate administrative actions. Additionally, the use of similar tools for legitimate maintenance could lead to false positives, particularly in environments without clear policy regarding kernel debugging. Related detections such as monitoring for unauthorized process creation (using Sysmon) or command execution could enhance detection capabilities.

