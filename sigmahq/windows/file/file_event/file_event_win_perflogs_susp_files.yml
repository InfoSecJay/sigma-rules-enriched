title: Suspicious File Created In PerfLogs
id: bbb7e38c-0b41-4a11-b306-d2a457b7ac2b
status: test
description: Detects suspicious file based on their extension being created in 
  "C:\PerfLogs\". Note that this directory mostly contains ".etl" files
references:
- Internal Research
- https://labs.withsecure.com/publications/fin7-target-veeam-servers
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-05
tags:
- attack.execution
- attack.t1059
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|startswith: 'C:\PerfLogs\'
    TargetFilename|endswith:
    - '.7z'
    - '.bat'
    - '.bin'
    - '.chm'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.lnk'
    - '.ps1'
    - '.psm1'
    - '.py'
    - '.scr'
    - '.sys'
    - '.vbe'
    - '.vbs'
    - '.zip'
  condition: selection
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This rule detects the creation of files with potentially malicious extensions in the "C:\PerfLogs\" directory, which is typically used for performance monitoring and should primarily contain ".etl" files. Attackers may utilize this directory to evade detection by introducing malicious payloads disguised as legitimate performance logs, with the objective of executing scripts or dropping unauthorized binaries for further exploitation. The relevant MITRE ATT&CK tactics are Execution (TA0002) and Script Execution (T1059).

  Primary telemetry sources include Windows file system events that capture file creation logs. The security impact of malicious activity could lead to system compromise, unauthorized data access, or lateral movement within the environment. It’s important to note that this detection does NOT confirm malicious intent on its own, as there may be legitimate use cases for file creation in this directory.

  ### Investigation Steps

  - **Verify file creation timestamp:** Check for the creation time of the suspicious file using Windows Event ID 4663 and verify against typical operational patterns. Legitimate files in "C:\PerfLogs\" generally follow a regular schedule and may not exhibit odd timestamps.

  - **Check file parent process:** Investigate the process that created the suspicious file by reviewing Sysmon Event ID 1 to identify if it was executed by a known system application or potentially malicious process such as a PowerShell script or a command line utility.

  - **Filter for specific extensions:** Examine the created file extensions listed in the rule, such as ".exe", ".vbs", and ".ps1". The appearance of these file types in "C:\PerfLogs\" should raise red flags, particularly if created by non-standard processes.

  - **Scan the file for malware:** Use a malware analysis tool or endpoint detection and response (EDR) solution to check the contents and behaviors of the suspicious file. High-confidence malicious indicators include known malware signatures or unusual network behavior when the file is executed.

  - **Review system role:** Determine whether the host creating the file is a critical server or employee workstation and assess the impact if compromised. Server hosts and sensitive workstations require immediate attention.

  ### Prioritization

  This alert has medium severity due to the potential impact on systems where perf logs may contain sensitive information and the likelihood of exploitation through the execution of embedded malicious payloads. The behavior indicates possible reconnaissance or post-exploitation activity, which is increasingly common among sophisticated threat actors.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming or using non-suspicious file types by attackers to avoid detection. The completeness of detections depends on the configuration of Windows auditing for file system events; insufficient logging could lead to missed events. Additionally, legitimate applications could create scripts or executables in "C:\PerfLogs\" during maintenance or monitoring processes. A related detection to consider is monitoring for unusual script execution (e.g., unauthorized PowerShell activities that would complement coverage of this rule).

