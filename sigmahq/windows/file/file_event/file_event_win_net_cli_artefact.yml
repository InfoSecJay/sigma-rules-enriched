logsource:
  category: file_event
  product: windows
  definition: 'Requirements: UsageLogs folder must be monitored by the sysmon configuration'
detection:
  selection:
    TargetFilename|endswith:
    - '\UsageLogs\cmstp.exe.log'
    - '\UsageLogs\cscript.exe.log'
    - '\UsageLogs\mshta.exe.log'
    - '\UsageLogs\msxsl.exe.log'
    - '\UsageLogs\regsvr32.exe.log'
    - '\UsageLogs\rundll32.exe.log'
    - '\UsageLogs\svchost.exe.log'
    - '\UsageLogs\wscript.exe.log'
    - '\UsageLogs\wmic.exe.log'
  filter_main_rundll32:
        # This filter requires the event to be enriched by additional information such as ParentImage and CommandLine activity
    ParentImage|endswith: '\MsiExec.exe'
    ParentCommandLine|contains: ' -Embedding'
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
    - 'Temp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rundll32.exe with zzzzInvokeManagedCustomActionOutOfProc in command line and msiexec.exe
  as parent process - https://twitter.com/SBousseaden/status/1388064061087260675
level: high
note: |
  ### Technical Context
  This detection rule identifies potential abuse of the .NET Common Language Runtime (CLR) usage logs, specifically focusing on the creation of log files at the end of the first execution of certain processes in a user session context. Attackers may manipulate these logs as part of an evasion technique to obscure their activities, especially when leveraging benign-looking tools such as `rundll32.exe`, `mshta.exe`, or script hosts. The primary objective is typically to execute arbitrary code under the guise of legitimate processes while evading detection mechanisms.

  This activity aligns with the MITRE ATT&CK technique "T1218 - Signed Binary Proxy Execution" and may fall under the tactics of "Defense Evasion." It indicates an attempt to obfuscate true malicious intentions while maintaining a non-intrusive appearance using standard Windows components—often a hallmark of advanced persistent threat (APT) actors or sophisticated malware campaigns.

  Key telemetry sources that provide the necessary evidence for this detection include file event logs from Sysmon configured to monitor the UsageLogs directory. Additional context—like parent process and command line executions—are critical for accurate detection and analysis of potential evasion tactics.

  ### Investigation Steps
  - **Review Sysmon Logs**: Check for Sysmon file creation events in the `UsageLogs` directory to identify any suspicious log file creations, focusing specifically on files named after known Windows processes like `cmstp.exe.log` or `wscript.exe.log`.

  - **Analyze Process Hierarchy**: Investigate the parent processes associated with the detected log files to understand the context of their execution. Specifically, look for instances where `MsiExec.exe` is a parent to `rundll32.exe` with the command line containing `-Embedding`.

  - **Correlate Command-Line Arguments**: Search for command line arguments associated with the execution of `rundll32.exe`. Pay careful attention to command lines that include keywords such as `Temp` and `zzzzInvokeManagedCustomActionOutOfProc`, indicating potential attempts to execute managed code or evade detection.

  - **Cross-reference with Threat Intelligence**: Utilize threat intelligence feeds or internal knowledge bases to correlate the detected behavior with known malicious tactics involving `.NET CLR` or specifically targeted utilities. This can help in validating the legitimacy of the detected activity.

  ### Prioritization
  Given the potential for serious implications if malicious activity remains undetected, this alert should be treated with a high severity level. The likelihood of these techniques being employed in enterprise environments is non-trivial, especially given their association with evasion tactics used by skilled attackers.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if Sysmon is not properly configured to monitor the UsageLogs directory or if logs are not retained for sufficient duration to allow for context-rich analysis. The detection logic assumes that attackers will use common tooling and tactics demonstrated in known attack patterns; however, deviations or unique methodologies may not be captured. Effective detection relies on continuity in logging, correct configurations, and the presence of supporting logs to provide context around parent processes and command lines tied to the observed events.

