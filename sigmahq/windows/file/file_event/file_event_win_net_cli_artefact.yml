logsource:
  category: file_event
  product: windows
  definition: 'Requirements: UsageLogs folder must be monitored by the sysmon configuration'
detection:
  selection:
    TargetFilename|endswith:
    - '\UsageLogs\cmstp.exe.log'
    - '\UsageLogs\cscript.exe.log'
    - '\UsageLogs\mshta.exe.log'
    - '\UsageLogs\msxsl.exe.log'
    - '\UsageLogs\regsvr32.exe.log'
    - '\UsageLogs\rundll32.exe.log'
    - '\UsageLogs\svchost.exe.log'
    - '\UsageLogs\wscript.exe.log'
    - '\UsageLogs\wmic.exe.log'
  filter_main_rundll32:
        # This filter requires the event to be enriched by additional information such as ParentImage and CommandLine activity
    ParentImage|endswith: '\MsiExec.exe'
    ParentCommandLine|contains: ' -Embedding'
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
    - 'Temp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rundll32.exe with zzzzInvokeManagedCustomActionOutOfProc in command line and 
  msiexec.exe as parent process - 
  https://twitter.com/SBousseaden/status/1388064061087260675
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of .NET Runtime Usage Log files by the `clr.dll`, specifically when these logs are generated by processes like `rundll32.exe`, `mshta.exe`, or other Windows scripting host executables. The behavior indicates potential misuse of .NET assemblies, often associated with malware trying to evade detection or manipulate system processes. The relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0005) and "Execution" (TA0002), specifically technique T1218 ("Signed Binary Proxy Execution").

  Primary telemetry sources include Windows Sysmon logs, specifically file event types capturing events where Usage Log files are created. The security impact is significant, as this behavior can indicate a compromised system or attempted exploitation. Importantly, this detection does NOT confirm malicious activity by itself; legitimate applications can also generate Usage Logs under certain conditions.

  ### Investigation Steps

  - **Identify log file creation:** Review Sysmon Event ID 11 for file creation, focusing on logs in the `UsageLogs` folder, especially those from `cmstp.exe`, `cscript.exe`, or `mshta.exe`. Check for unusual timestamps or prior related activity.

  - **Assess parent-child process relationships:** Analyze Sysmon Event ID 1 (Process Creation) for the parent process of the detected executable. Look for `msiexec.exe` as a parent with a command line containing `-Embedding` and matching Indicators of Compromise (IOCs).

  - **Determine expected behavior:** Validate legitimate executions of the identified binaries like `mshta.exe` or `rundll32.exe`. Normal behavior may include administrative scripts or in-house applications that use these binaries without generating unusual logs.

  - **Look for malicious indicators:** Focus on command lines containing `Temp` along with `zzzzInvokeManagedCustomActionOutOfProc` in conjunction with `rundll32.exe`. This combination is strongly indicative of malicious intent and should be treated with high confidence.

  - **Identify additional context:** Confirm the presence of logs that may correlate with the alert. Check for concurrent or related alerts associated with other suspicious activity, including file drops or other Sysmon event anomalies.

  ### Prioritization

  This alert is high priority due to its potential indication of evasion techniques used by an attacker in a compromised environment. The prevalence of the detected behavior within known exploitation campaigns elevates the urgency, especially if involving critical systems or sensitive data.

  ### Blind Spots and Assumptions

  Potential evasion techniques include log manipulation or deletion by the attacker to avoid detection. Reliable detection requires proper Sysmon configuration to monitor the `UsageLogs` folder. Common legitimate activities, such as software installation or system updates, may generate similar alerts, potentially leading to false positives. A related detection to consider is the creation of scheduled tasks by these same executables, which may indicate a more extensive compromise attempt.

