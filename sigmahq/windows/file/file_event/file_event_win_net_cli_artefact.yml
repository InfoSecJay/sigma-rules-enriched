logsource:
  category: file_event
  product: windows
  definition: 'Requirements: UsageLogs folder must be monitored by the sysmon configuration'
detection:
  selection:
    TargetFilename|endswith:
    - '\UsageLogs\cmstp.exe.log'
    - '\UsageLogs\cscript.exe.log'
    - '\UsageLogs\mshta.exe.log'
    - '\UsageLogs\msxsl.exe.log'
    - '\UsageLogs\regsvr32.exe.log'
    - '\UsageLogs\rundll32.exe.log'
    - '\UsageLogs\svchost.exe.log'
    - '\UsageLogs\wscript.exe.log'
    - '\UsageLogs\wmic.exe.log'
  filter_main_rundll32:
        # This filter requires the event to be enriched by additional information such as ParentImage and CommandLine activity
    ParentImage|endswith: '\MsiExec.exe'
    ParentCommandLine|contains: ' -Embedding'
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
    - 'Temp'
    - 'zzzzInvokeManagedCustomActionOutOfProc'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Rundll32.exe with zzzzInvokeManagedCustomActionOutOfProc in command line and 
  msiexec.exe as parent process - 
  https://twitter.com/SBousseaden/status/1388064061087260675
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of suspicious .NET CLR usage log files, specifically files named after the executing process (e.g., cmstp.exe.log, cscript.exe.log). This behavior is often associated with adversaries using .NET components to execute malicious payloads or evade detection through legitimate processes. The likely objective is to run arbitrary code without raising alarms or leveraging trusted system components for lateral movement or persistence.

  Relevant MITRE ATT&CK tactics include **Defense Evasion** (ID: T1218) due to the usage of trusted Windows executables (e.g., rundll32.exe). Primary telemetry sources include file event logs collected through Sysmon, specifically monitoring the `UsageLogs` directory. If malicious, it could indicate unauthorized execution and potential compromise of the system. This detection does NOT confirm that malicious activity is occurring on its own, as legitimate applications may generate similar logs under certain conditions.

  ### Investigation Steps

  - **Check recent file creations in UsageLogs folder:** Review Windows Security Event ID 4663 for the creation of files in the `C:\ProgramData\Microsoft\Windows\UsageLogs` directory. Look for new log files with recent timestamps that match the suspicious patterns.

  - **Analyze the command line of the parent process:** Review Sysmon Event ID 1 for the command lines executed by the parent process (e.g., MsiExec.exe). Look for command lines containing `-Embedding` that indicate potential abuse of Windows Installer.

  - **Correlate process relationship:** Identify the associated child process (e.g., rundll32.exe) using Sysmon Event IDs 1 and 10. Examine the ParentImage and Image fields; a malicious instance will have `MsiExec.exe` as the parent and be invoking `rundll32.exe`.

  - **Identify benign behavior:** Recognize legitimate instances of applications like msiexec.exe executing without the context of unknown or unauthorized scripts/tools running simultaneously, typically initiating standard installations or repairs.

  - **Highlight malicious indicators:** Look for indicators such as the presence of `zzzzInvokeManagedCustomActionOutOfProc` in the command line of `rundll32.exe`. This is a strong indicator of malicious activity when combined with its execution context.

  - **Verify file creation for persistence checks:** Look for unexpected file creation timestamps in Sysmon logs (Event ID 11). Check for signs of file tampering, such as modification times or creation by known, legitimate applications.

  ### Prioritization

  Given that this alert relates to the usage of well-known and trusted system utilities (like rundll32.exe and msiexec.exe), yet indicates possible malicious tampering, it warrants a high priority in an enterprise context. The likelihood of exploitation through these methods is significant, as many attackers weaponize .NET components to bypass traditional security measures.

  ### Blind Spots and Assumptions

  Detection limits may arise from benign software installations that could trigger these alerts, such as legitimate software updates or installations that generate logs. The reliability of this detection depends on monitoring the `UsageLogs` directory accurately; if Sysmon isn’t deployed or configured to capture these events, important logs may be missed. A related detection to consider is monitoring for suspicious command lines with common executables tied to the Windows installer, which can provide complementary coverage of similar evasion techniques.

