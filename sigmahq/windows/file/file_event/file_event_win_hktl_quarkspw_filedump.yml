note: |
  ### Technical Context

  This rule detects the creation of password dump files generated by the QuarksPwDump utility, specifically targeting files within a user's Temp directory that follow the naming pattern `SAM-*.dmp`. This behavior suggests that an attacker is attempting to gain unauthorized access to sensitive credentials stored in the SAM database, typically aiming to escalate privileges or access critical systems. The relevant MITRE ATT&CK tactic is "Credential Access" (Tactic ID: TA0006), with the technique being "Credential Dumping" (T1003.002).

  Primary telemetry sources include Windows file event logs, specifically File Creation events indicating the presence of dump files. Malicious activity could lead to the compromised integrity and confidentiality of user credentials, posing significant risks if exploited. Importantly, this rule does NOT confirm an active compromise on its own; further investigation is required to determine the intent and source of the dump file creation.

  ### Investigation Steps

  - **Examine file creation events:** Review Windows Security Event ID 4663 entries to identify the creation of files matching the `SAM-*.dmp` pattern within `C:\Users\<username>\AppData\Local\Temp\`. Look for events generated during suspicious time frames, especially when coupled with unusual user behavior.

  - **Identify associated process activities:** Check Sysmon Event ID 1 for process creation events that include QuarksPwDump or suspicious command line arguments. Investigate the parent process to find if it was initiated by a known application or user action.

  - **Monitor user sessions:** Analyze Windows Security Event ID 4624 for logon events of the user associated with the file creation. Look for unusual logon types or concurrent session activity that deviates from expected user behavior.

  - **Review file access pattern:** Validate whether the dump file has been written and accessed by any system process by checking Windows Event ID 4663 (File Access) logs, focusing on access that is rare or inconsistent with typical user activity.

  - **Cross-reference environment impact:** Assess the criticality of the asset involved (e.g., domain controllers, administrative workstations) to evaluate potential risks linked to the presence of a password dump. Any appearance of this dump file on high-value assets should raise immediate concern.

  - **Identify benign use cases:** Investigate if any legitimate system maintenance or security assessments commonly lead to the creation of similar dump files. Document cases where expected administrative tasks might accidentally trigger this alert.

  ### Prioritization

  This alert is of critical severity given that it potentially indicates a successful credential dump, which could lead to further lateral movement or privilege escalation within the environment. The likelihood of such dumps being weaponized by malicious actors is high, particularly if they target administrator accounts or sensitive systems.

  ### Blind Spots and Assumptions

  Detection is limited by the assumption that the logs from the relevant file events are consistently collected and monitored. Legitimate activities such as security audits or pen tests might trigger similar alerts if they involve password dump tools. A companion detection to consider is monitoring for unusual command line arguments via Sysmon, as this can provide additional context around the execution of QarksPwDump and related tools.

