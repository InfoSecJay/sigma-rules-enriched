  ---

  ### Technical Context

  This Sigma rule detects the creation of dump files generated by the QuarksPwDump password cracker, specifically targeting files located in the user's AppData\Local\Temp directory that match the naming convention of "SAM-*.dmp". The likely objective of an attacker using QuarksPwDump is to extract password hashes from the Security Account Manager (SAM) database, facilitating unauthorized access to user accounts. This activity aligns with the MITRE ATT&CK tactics of Credential Access (Tactic ID: TA0006) and the specific technique of Credential Dumping (Technique ID: T1003.002).

  The primary telemetry source required for this detection is file event logs from Windows environments, particularly looking for specific file creation events. The security impact of this detection is significant, as successful credential dumping can lead to account compromise and lateral movement within the network. Importantly, this detection does NOT confirm that malicious intent is present; legitimate applications may also create dump files in these locations.

  ---

  ### Investigation Steps

  - **Check file creation events:** Review Windows Security Event ID 4663 for file creation events associated with the path 'C:\Users\<Username>\AppData\Local\Temp\SAM-*.dmp', focusing on the process name that created the file for indications of malicious behavior.

  - **Assess user context:** Determine the user account associated with the creation of the dump file. Verify whether the account is a typical user or has administrative privileges, as admin accounts may pose a higher risk.

  - **Validate expected processes:** Identify the process that generated the ".dmp" file. Common benign processes might include system tools or applications run by legitimate users. Malicious indicators may include uncommon processes or those not typically associated with user activities.

  - **Monitor for access patterns:** If relevant, check for subsequent access to the created dump file, especially from processes that are flagged in the environment as suspicious or that have been reported as malicious.

  - **Examine for related registry keys:** Review Windows Registry for any suspicious entries under 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa' related to SAM dumping, which may indicate an attempt to modify security settings or persistently run unauthorized tools.

  - **Document legitimate usage:** Gather context on whether there are known administrative activities that may create similar dump files, such as legitimate security audits or password recovery mechanisms employed by IT teams.

  ---

  ### Prioritization

  Alerts generated by this detection rule should be prioritized as critical due to the high potential impact on sensitive data security and the likelihood of malicious intent behind the creation of a password dump file. The behavior of executing QuarksPwDump is typically weaponized by attackers seeking to exploit account credentials to initiate further attacks.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by processes that have legitimate reasons to create dump files but are non-malicious, leading to possible false positives. Reliable detection necessitates configuration of comprehensive file monitoring logs on Windows endpoints. Additionally, legitimate tools used by IT staff for diagnostics may trigger this alert, so context-aware investigation is essential. A companion detection rule monitoring access to sensitive registry keys related to LSA should be considered for enhanced coverage.

