note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of PowerShell profiles, specifically the files typically located in various system paths such as `C:\Users\<User>\Documents\WindowsPowerShell\Microsoft.PowerShell_profile.ps1`. These profiles can be leveraged by attackers for persistence, allowing them to execute malicious scripts every time a PowerShell session starts. The likely objective of an adversary is to maintain access to a compromised system by embedding malicious commands or scripts in the PowerShell profile.

  This detection aligns with the MITRE ATT&CK framework under the tactic of **Persistence** (T1546) and the technique of **Profile Modification** (T1546.013). The primary telemetry sources for this detection are Windows file event logs, specifically monitoring file creation and modification events. If malicious, these activities could lead to ongoing unauthorized actions within the environment. It is important to note that this detection does not confirm malicious intent on its own; legitimate administrative actions may also modify these profiles.

  ### Investigation Steps

  - **Identify profile modification events:** Query Windows Event ID 4663 for file modification events on `C:\Users\<User>\Documents\WindowsPowerShell\Microsoft.PowerShell_profile.ps1` and determine if the creator is an authorized user or a system administrator.

  - **Review the content of the profile:** Examine the contents of the modified PowerShell profile using Windows Event ID 4663 or PowerShell commands to identify any suspicious commands or scripts. Look for execution of unexpected commands or obfuscated code that doesn't align with common administrative tasks.

  - **Check for indicators of legitimate activity:** Look for known events such as administrator profiles being created or updated primarily by IT staff around scheduled maintenance windows. If modified by a user with no administrative privileges, this may indicate potential malicious activity.

  - **Correlate with other suspicious activities:** Investigate other related security events, such as unusual PowerShell execution (Event ID 4688) or logged commands that may include `Invoke-Expression`, `IEX`, or `DownloadString`. This could indicate exploitation and manipulation of the PowerShell environment.

  - **Evaluate host role and criticality:** Assess the role of the affected system (e.g., server vs. user workstation) to prioritize response actions. Systems with high sensitivity or critical business functionalities should be scrutinized more closely if they have their PowerShell profiles modified.

  - **Verify execution contexts and persistence:** Confirm if the user session where the profile was modified had previously executed PowerShell commands that could indicate a PowerShell execution context was misused for persistence.

  ### Prioritization

  This alert is medium in severity due to the potential for malicious persistence via PowerShell profiles, which may be frequently exploited in enterprise environments. Systems typically used for sensitive tasks, such as domain controllers or critical application servers, necessitate a higher priority response if their profiles are detected as modified.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for certain administrative tasks or if actions are masked by legitimate user activities. Events may not be reliable if appropriate file auditing settings are not enabled. Legitimate activities, such as system administrators updating their profiles for automation, can trigger this alert. Companion detections, such as monitoring for unusual PowerShell commands (Event ID 4688), would provide stronger coverage and context around the alert.

