note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation or modification of PowerShell profile scripts, which can be used by an attacker to establish persistence on a compromised system. By altering these scripts, an adversary can execute arbitrary commands upon the initialization of a PowerShell session. The likely attacker objective is to maintain a foothold within the environment, thereby allowing continuous access and control.

  The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), with the technique being **PowerShell Profile Modification** (T1546.013). Primary telemetry sources include Windows file event logs from file system interactions specifically targeting the PowerShell profile locations listed in the detection. If malicious, this behavior could allow undetected execution of commands, bypassing standard defenses. However, this detection alone does NOT confirm malicious intent, as legitimate system administrators may also create or modify PowerShell profiles.

  ---

  ### Investigation Steps

  - **Review recent file modifications**: Check Windows Event ID 4663 and File System event logs for changes to files named `profile.ps1` in the directories specified. Look for unexpected timestamps or user accounts that are not typically associated with changes to scripts.

  - **Identify user account context**: Determine the user account that triggered the event. Use Event ID 4624 (logon events) to review the login history of the user, and assess whether it aligns with typical administrative activities.

  - **Correlate with PowerShell command history**: Review the PowerShell command history (`Get-History` or `Get-Command` depending on the user’s shell context) of the user associated with the modification. Look for suspicious commands that relate to the modification or execution of profiles.

  - **Establish baseline for legitimate behavior**: Check if the affected system includes any regular administrative user accounts creating or modifying PowerShell profiles, which could be a normal operational procedure rather than malicious intent.

  - **Inspect for executing PowerShell sessions**: Examine Event ID 4103 (for sysmon setups) for instances of PowerShell being launched right after the file modification. Sudden command executions using the profile script may indicate malicious use.

  - **Look for supporting indicators of persistence**: Search through the system’s startup processes and scheduled tasks using Event ID 4697 and Event ID 4698 for any unusual configurations that may coincide with the profile modifications.

  ---

  ### Prioritization

  This alert should be treated with medium priority given that modifications to PowerShell profiles can indicate advanced persistence mechanisms by threat actors. If the affected system is critical to operations or holds sensitive data, the alert’s severity increases significantly. However, there is a reasonable chance that legitimate administrative activity may trigger this rule.

  ---

  ### Blind Spots and Assumptions

  There may be evasion techniques such as renaming or disguising profiles that are not captured by this detection. Reliable detection requires comprehensive logging for PowerShell execution and file modifications, and proper monitoring of user behavior is essential. Legitimate activities that might trigger this alert include routine changes by system administrators or automated scripts during maintenance. A related detection is monitoring for unusual PowerShell execution patterns (e.g., suspicious command line arguments) to enhance coverage of potential abuse scenarios.

