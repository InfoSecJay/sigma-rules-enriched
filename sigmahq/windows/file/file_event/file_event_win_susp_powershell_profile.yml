detection:
  selection:
    TargetFilename|endswith:
    - '\Microsoft.PowerShell_profile.ps1'
    - '\PowerShell\profile.ps1'
    - '\Program Files\PowerShell\7-preview\profile.ps1'
    - '\Program Files\PowerShell\7\profile.ps1'
    - '\Windows\System32\WindowsPowerShell\v1.0\profile.ps1'
    - '\WindowsPowerShell\profile.ps1'
  condition: selection
falsepositives:
- System administrator creating Powershell profile manually
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation or modification of PowerShell profile scripts, specifically files named `Microsoft.PowerShell_profile.ps1` or any equivalent PowerShell profile file. These profiles can be leveraged by adversaries to maintain persistence, as they allow for the automatic execution of code every time PowerShell starts. Malicious actors may modify these profiles to execute harmful scripts, such as data exfiltration or lateral movement commands, with the goal of evading detection and ensuring their foothold within a compromised environment.

  Adversaries typically use this technique to maintain access to a system after initial compromise, making it relevant to the MITRE ATT&CK framework, particularly under the tactics of **Persistence** (ID: TA0003) and **Privilege Escalation** (ID: TA0004). The specific technique involved is **PowerShell Profile Modification** (T1546.013), where a profile is altered to load malicious scripts upon execution of PowerShell. Key sources of telemetry to monitor include Windows file event logs for changes in the PowerShell profile file paths mentioned, which hold evidence of potential manipulation by threat actors.

  ### Investigation Steps
  - **Review PowerShell Event Logs**: Investigate PowerShell logs to identify any unusual commands or scripts executed around the time of the profile modification. Look for inconsistency in command execution and unexpected calls to external scripts.

  - **Analyze File Creation/Modification Events**: Check file event logs for details on when and by whom the profile files were created or modified. Pay attention to unusual accounts or timestamps that deviate from standard administrative operations.

  - **Examine Scheduled Tasks and Services**: Look for any scheduled tasks or services that may invoke PowerShell with the modified profiles. Verify whether these tasks are legitimate or if they correspond to suspicious activity.

  - **Correlate User Activity**: Cross-reference user activity logs to determine if the profile modifications correlate with known administrative actions or if they stem from unauthorized users. Look for patterns of behavior that indicate privilege escalation attempts.

  ### Prioritization
  The alert should be treated with medium severity due to the potential for an attacker to establish persistence through legitimate administrative processes. While not every profile modification is malicious, such activity warrants investigation as it could lead to more severe threats if left unchecked.

  ### Blind Spots and Assumptions
  This detection may miss legitimate administrative changes made by system administrators creating or modifying PowerShell profiles for practical reasons. The detection logic assumes that file creation/modification events are logged consistently; however, if logging is inadequate or improperly configured, this detection may fail. Additional configurations may be necessary to ensure comprehensive logging of file changes, specifically in the PowerShell execution environment.

