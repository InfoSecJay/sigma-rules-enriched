  ### Technical Context

  This rule detects the creation of a default dump file named `dumpert.dmp`, which is commonly associated with the Dumpert tool used for dumping the memory of the LSASS process. Attackers typically use this technique to extract sensitive information, such as credentials, for further unauthorized access to systems or networks. This activity primarily aligns with the MITRE ATT&CK technique "Process Dumping" (T1003.001) under the "Credential Access" tactic.

  The main telemetry sources for this detection include Windows file event logs, which capture file creation activities on the system. If this activity is determined to be malicious, it could lead to credential theft and subsequent lateral movement within an enterprise environment. Importantly, this detection does NOT confirm malicious intent on its own; further context and investigation are necessary to establish if this activity is indeed part of a compromise.

  ---

  ### Investigation Steps

  - **Verify file creation time and context:** Check Windows Security Event ID 4688 for process creation events leading to `dumpert.dmp`. Look for any suspicious parent process or command line arguments indicating potential misuse.

  - **Correlate with process execution:** Investigate Sysmon Event ID 10 (Process Access) for any suspicious access to the LSASS process before the dump file creation. Normal behavior would not involve frequent or unusual access to LSASS by non-admin processes.

  - **Identify user activity:** Review the user account associated with the file creation. Look for recent logins via Remote Desktop or unusual login times in the Security Event log (Event ID 4624). Legitimate users should typically originate from expected workstations during normal hours.

  - **Check for related artifacts:** Validate if the malicious tool was staged by looking for Dumpert-related files or logs created in the temporary directories, such as `C:\Users\<username>\AppData\Local\Temp\`. Legitimate software would not frequently create files in these directories directly.

  - **Assess network communications:** Review firewall logs for any outbound connections shortly after the dump file creation. Malicious indicators may include unexpected connections to external IPs or servers not related to normal business activity.

  - **Monitor for correlated threats:** Check for alerts from companion detections, such as any indicators of lateral movement or credential attempts following the creation of the dump file, which would suggest a more extensive compromise rather than a standalone incident.

  ---

  ### Prioritization

  This alert is critical due to the potential impact of an attacker compromising sensitive credentials through memory dumping techniques. The likelihood of malicious abuse is high, as tools like Dumpert are commonly employed in the wild by threat actors. This technique is frequently weaponized in credential theft scenarios, necessitating immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if file event logging is not configured correctly on Windows systems, and attackers may employ various evasion techniques such as using process hollowing or abusing trusted processes. Legitimate activities that could create similar dump files may occur during debugging or legitimate administrative tasks. A related detection might include alerts for abnormal access to LSASS (T1003), enhancing coverage against a broader range of credential access techniques.

