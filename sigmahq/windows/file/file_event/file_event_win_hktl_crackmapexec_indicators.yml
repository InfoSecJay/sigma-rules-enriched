logsource:
  product: windows
  category: file_event
detection:
  selection_path:
    TargetFilename|startswith: 'C:\Windows\Temp\'     # The disk extension is hardcoded in the tool.
  selection_names_str:
    TargetFilename|endswith:
    - '\temp.ps1'         # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/modules/keepass_trigger.py#L42C41-L42C68
    - '\msol.ps1'         # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/modules/msol.py#L48C98-L48C106
  selection_names_re:
  - TargetFilename|re: '\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$'       # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/protocols/wmi/wmiexec.py#L86
  - TargetFilename|re: '\\[a-zA-Z]{8}\.tmp$'       # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/protocols/smb/atexec.py#L145C19-L146
  condition: selection_path and 1 of selection_names_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies file creation events associated with the tool CrackMapExec, a popular post-exploitation framework often employed by attackers to facilitate lateral movement across networks. The rule specifically looks for filenames and paths commonly used by CrackMapExec's modules, such as ‘temp.ps1’, ‘msol.ps1’, and uniquely formatted text files. The objective of deploying CrackMapExec is usually to exploit network shares, access passwords, and execute commands on remote systems, all of which can significantly compromise network security.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Credential Access** (TA0006) and **Credential Dumping** (T1003.001). This indicates that the tool is utilized to harvest sensitive information, enabling subsequent unauthorized access to sensitive systems or data. The primary sources of evidence for this detection will be Windows file event logs that record file creations within critical directories, such as ‘C:\Windows\Temp\’, which is frequently used for storing temporary execution files by various tools.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine Windows file event logs focusing on the specified target path (C:\Windows\Temp) for any unauthorized file creation events that match the detection criteria for CrackMapExec.

  - **Analyze Filenames and Extensions:** Look for filenames and extensions that are indicative of malicious activity, specifically those ending with ‘temp.ps1’, ‘msol.ps1’, or those following the unique regex patterns denoting CrackMapExec usage.

  - **Correlate with User Activity:** Identify the user accounts associated with the file creation events to determine if they are legitimate system accounts or potentially compromised accounts performing lateral movement.

  - **Check for Unusual Process Activity:** Investigate associated process creation logs to identify if processes related to CrackMapExec or other suspicious activities are executed from the relevant directories during the same timeframe.

  ### Prioritization
  This alert is of high severity in an enterprise environment because CrackMapExec is directly associated with credential harvesting and lateral movement, which can lead to significant security breaches, potential data exfiltration, or prolonged unauthorized access to critical infrastructure.

  ### Blind Spots and Assumptions
  The detection logic may miss instances where CrackMapExec operates in less common directories or if the tool is executed without the expected filename patterns. It assumes that all applicable file creation events are logged and that logging is appropriately configured across all relevant endpoints. This alert's effectiveness relies on comprehensive Windows file event logging, which may need validation to ensure proper integration and coverage in the environment.

