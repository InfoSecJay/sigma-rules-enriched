detection:
  selection_path:
    TargetFilename|startswith: 'C:\Windows\Temp\'     # The disk extension is hardcoded in the tool.
  selection_names_str:
    TargetFilename|endswith:
    - '\temp.ps1'         # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/modules/keepass_trigger.py#L42C41-L42C68
    - '\msol.ps1'         # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/modules/msol.py#L48C98-L48C106
  selection_names_re:
  - TargetFilename|re: '\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$'       # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/protocols/wmi/wmiexec.py#L86
  - TargetFilename|re: '\\[a-zA-Z]{8}\.tmp$'       # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/protocols/smb/atexec.py#L145C19-L146
  condition: selection_path and 1 of selection_names_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This detection rule identifies file creation events related to CrackMapExec, a popular post-exploitation tool primarily utilized for credential access and lateral movement. The primary objectives of an attacker using CrackMapExec include exploiting vulnerabilities in network protocols and leveraging credentials to execute further malicious actions. This activity is associated with the MITRE ATT&CK technique T1003.001 (Credential Dumping: LSASS Memory) and can indicate attempts to escalate privileges or move laterally within the environment.

  The main telemetry sources needed for this detection are Windows file event logs, specifically monitoring for suspicious file creations in the `C:\Windows\Temp\` directory with specific file naming patterns indicative of CrackMapExec usage. If the detected file creations are part of an attack, they can lead to significant breaches resulting in unauthorized access or data exfiltration. However, this detection does NOT automatically confirm that an attack is occurring; legitimate files can have similar naming conventions.

  ---

  ### Investigation Steps

  - **Check the file creation events:** Review Windows Security Event ID 4663 to confirm file creation in `C:\Windows\Temp\` corresponding to monitored patterns (`temp.ps1`, `msol.ps1`), indicating potential malicious usage.

  - **Validate the context of the directory use:** Determine if the creation of files in `C:\Windows\Temp\` is typical for the asset based on the asset's role (e.g., if it’s a server running scheduled jobs or temporary processes).

  - **Analyze additional file attributes:** Investigate the properties using Sysmon Event ID 10 to check if the processes creating these files have unusual parent processes or if they are executed from untrusted locations.

  - **Identify high-confidence indicators:** Look for files with names conforming to regex patterns (e.g., `\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$`) alongside unusual execution paths for indicative malicious activity.

  - **Check the execution context:** Review recent command history or PowerShell logs (Windows Event ID 4104) to identify if `CrackMapExec` was executed, focusing on any commands that may have manipulated credentials or attempted lateral movement.

  - **Document deviations from normal activity:** Note expected legitimate activities that may create similar files, such as scheduled processes generating temporary files, to differentiate from the behavior typically associated with CrackMapExec.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential impact of an unauthorized access point on critical systems. The likelihood of attack exploitation through the use of CrackMapExec is significant, as it is regularly weaponized in different threat landscapes. Consequently, prompt investigation is imperative.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate activities mistakenly triggering the alert, such as system maintenance scripts or tools that generate similarly named temporary files. Essential log sources include enabling detailed file event logging and Sysmon for comprehensive monitoring. Additionally, be aware that some adversaries may use obfuscation tactics or alternate file naming to evade detection. A related detection rule focusing on execution of powershell scripts (e.g., triggered by suspicious PowerShell activity) can enhance coverage and further validate incidents linked to CrackMapExec.

