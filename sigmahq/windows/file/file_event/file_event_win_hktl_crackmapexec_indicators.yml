logsource:
  product: windows
  category: file_event
detection:
  selection_path:
    TargetFilename|startswith: 'C:\Windows\Temp\'     # The disk extension is hardcoded in the tool.
  selection_names_str:
    TargetFilename|endswith:
    - '\temp.ps1'         # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/modules/keepass_trigger.py#L42C41-L42C68
    - '\msol.ps1'         # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/modules/msol.py#L48C98-L48C106
  selection_names_re:
  - TargetFilename|re: '\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$'       # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/protocols/wmi/wmiexec.py#L86
  - TargetFilename|re: '\\[a-zA-Z]{8}\.tmp$'       # https://github.com/byt3bl33d3r/CrackMapExec/blob/3c3e412193cb6d3237abe90c543e5d995bfa4447/cme/protocols/smb/atexec.py#L145C19-L146
  condition: selection_path and 1 of selection_names_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects file creation events associated with CrackMapExec, specifically focusing on filenames commonly used by the tool such as `temp.ps1`, `msol.ps1`, and certain temporary and hexadecimal-named text files in the `C:\Windows\Temp\` directory. The likely objective of an attacker using CrackMapExec is to execute credential dumping techniques and lateral movement within a network environment, potentially leading to full domain compromise. This detection corresponds to the MITRE ATT&CK framework under the tactic of Credential Access (Tactic ID: TA0006) and the technique of Credential Dumping (Technique ID: T1003.001).

  Primary telemetry sources include Windows file event logs, specifically monitoring for Event ID 4663, which capture file creation activities. If these events indicate malicious use, there is a high risk of credentials being stolen or unauthorized access being facilitated. However, this detection does NOT confirm that an attack is occurring without additional context, as legitimate processes also may create files in these locations.

  ### Investigation Steps

  - **Review file creation logs**: Check Windows Security Event ID 4663 for file creation events targeting `C:\Windows\Temp\` and note timestamps and user accounts involved.

  - **Identify malicious indicators**: Look specifically for filenames `temp.ps1`, `msol.ps1`, or any files matching patterns such as `\\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$` and `\\[a-zA-Z]{8}\.tmp$`. These indicate potential use of the CrackMapExec tool.

  - **Validate user context**: Assess if the user account associated with these file creations typically has administrative privileges or has a legitimate business need for such actions. Unauthorized user accounts performing these actions may indicate compromise.

  - **Check recent permission changes**: Investigate if any recent modifications were made to ACLs or file permissions on sensitive directories. This may signify preparation for further attack actions.

  - **Review related processes**: Correlate with Process Creation events (Event ID 4688) around the same timeframe to identify if there are abnormal process executions that could be linked to the file creations.

  - **Examine expected activities**: Review legitimate activities that may occur within `C:\Windows\Temp\`, such as software installations or system updates, which may produce temporary files. Compare their patterns against the suspicious file patterns detected.

  ### Prioritization

  This alert indicates high severity due to the sensitive nature of the affected system, particularly if it involves domain controllers or other critical infrastructure. The likelihood of malicious exploitation is high, as CrackMapExec is commonly used in post-exploitation scenarios to facilitate unauthorized access. This behavior has been widely weaponized by various threat actors, indicating a significant risk of lateral movement and credential access.

  ### Blind Spots and Assumptions

  Detection may be limited by the disabling of log generation on endpoints, leading to blind spots in file activity. Legitimate administrative activities may also produce similar file creations in the `C:\Windows\Temp\` directory. Ensure proper configurations are in place for Log Level for file auditing to bolster detection capabilities. A related detection rule monitoring for unusual PowerShell activity could complement this rule and strengthen overall security oversight.

