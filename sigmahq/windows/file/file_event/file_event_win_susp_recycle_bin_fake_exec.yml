note: |
  ### Technical Context

  This rule detects file write activities targeting a folder masquerading as the Windows Recycle Bin (e.g., `C:\$RECYCLER.BIN`). Attackers often use this method to disguise malicious files or as a staging area for malware, making it challenging for security teams to spot suspicious activities. The likely attacker objective is to maintain persistence, evade detection, or exfiltrate sensitive data.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (T1547)
  - **Stealth** (T1480).

  The primary telemetry sources are Windows file event logs that track file creation and modification activities. If malicious, such activity may lead to system compromise, data leakage, or further intrusions. This detection does NOT confirm intent, as legitimate applications could access these paths for benign reasons.

  ### Investigation Steps

  - **Verify file creation details**: Check Windows Event ID 4663 (File Access) and Event ID 4656 (Handle Access) for the suspicious file creations. Look for the process name and user context associated with the events. Malicious indicators may include unusual users or processes not typically associated with file manipulation.

  - **Identify known malicious signatures**: Look for file hashes or process signatures that are tied to known malware families or suspicious tools. Use threat intelligence feeds to cross-reference any identified processes or files.

  - **Assess legitimate activity**: Check if any legitimate system processes or administrative actions have created or written to similar directories. Investigate any documented use of `C:\$RECYCLER.BIN` by trusted applications or users.

  - **Monitor for subsequent malicious activities**: Examine for additional indicators, such as subsequent network connections or scheduled tasks that leverage files from the `RECYCLER.BIN` directory. This could indicate further post-compromise activities.

  - **Evaluate host role impact**: Determine the criticality of the affected host by assessing its role within the network (e.g., domain controller, endpoint). Higher impact systems warrants immediate escalation and a more thorough investigation.

  ### Prioritization

  This alert should be considered high severity due to its association with potentially malicious activity on critical systems. The likelihood of abuse is significant, as attackers often utilize masqueraded file directories to obfuscate their actions. Given the nature of this technique, it is commonly weaponized.

  ### Blind Spots and Assumptions

  Detection may have limitations due to the potential for file renaming or obfuscation techniques. Depending on the log configuration, missing certain file event logs can hinder comprehensive monitoring. Legitimate applications may trigger this alert when using similar naming conventions for temporary file storage. Related detection rules, like monitoring for abnormal PowerShell activity (T1059.001), can strengthen coverage by identifying related tactical maneuvers.

