note: |
  ### Technical Context

  This Sigma rule detects file creation events targeting fake Recycle Bin directories, commonly named `C:\$RECYCLER.BIN` or similar. This behavior is often leveraged by attackers to store malware or exfiltrated data, disguising malicious activities as benign system operations. The tactic associated with this activity is "Persistence" (T1547) and "Defense Evasion" (T1070), both of which enable adversaries to maintain access while avoiding detection.

  The primary telemetry source is Windows File System events, specifically file event logs capturing modifications within the targeted directories. If exploited maliciously, this behavior can lead to data theft, system compromise, or the deployment of persistent malware. Importantly, this detection on its own does not confirm malicious activity; it only highlights suspicious file operations in potentially compromised folders.

  ### Investigation Steps

  - **Identify the event source:** Review Windows Security Event ID 4663 for access events related to the Recycle Bin directories (`C:\$RECYCLER.BIN`). Look for anomalous file writes, particularly from non-standard processes or users.

  - **Correlate timestamps:** Track the timeline of file creation against other events, such as logins (Event ID 4624) or PowerShell scripts (Event ID 4104), to identify whether they coincide with legitimate user activity or system maintenance.

  - **Analyze file attributes:** Inspect the attributes of the files created in the fake Recycle Bin directory. Look specifically for unusual file types or extensions that do not align with business use (e.g., `.exe`, `.cmd`), which can indicate malicious usage.

  - **Review legitimate use cases:** Confirm if any authorized applications or scripts perform actions in or near the Recycle Bin directories, typically seen during system cleanup by IT or automated maintenance tasks.

  - **Check immediate user context:** Examine the user executing the file creation. Check for user roles (administrative, standard) and whether they typically require access to the Recycle Bin (e.g., standard users should not have significant engagement with these directories).

  - **Deploy supplemental detections:** Investigate related detections such as the excessive creation of files within temporary or hidden directories (e.g., suspicious use of Event ID 4624 logging excessive logon events).

  ### Prioritization

  This alert should be considered high priority due to the potential impact on sensitive data and systems if exploited maliciously. The likelihood of abuse is significant, especially as attackers frequently use disguised directories for storing and operating malware. This behavior is a common tactic in various attack campaigns focusing on stealthy persistence mechanisms.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as renaming benign folders to match `RECYCLER.BIN` or using fileless malware that does not persist on disk. Reliable detection requires proper logging configurations, including enabling file auditing on key directories. Legitimate activities like backups or system maintenance may also trigger this alert, necessitating further context for accurate assessment. A related detection to consider is anomalous user behavior during file access, which strengthens overall security posture against insider threats and compromised accounts.

