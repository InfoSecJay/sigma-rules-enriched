  ### Technical Context

  This rule detects the creation of a file named "ntds.dit," which is the database file used by Active Directory to store directory data. Attackers may aim to extract sensitive data such as credentials or organizational structure information, as acquiring this file could facilitate further exploitation (e.g., lateral movement or domain compromise). This behavior aligns with the MITRE ATT&CK technique for Credential Dumping: NTDS.dit (T1003.003).

  The primary telemetry sources include Windows file event logs where file creation events, specifically `TargetFilename` with the value `ntds.dit`, can be identified. If an adversary successfully creates this file, it can have severe security implications, enabling unauthorized access and control over the Active Directory environment. It's important to note that the detection of this event does NOT confirm that an adversary has stolen credentials or maliciously accessed the directory; it only indicates that the file was created.

  ---

  ### Investigation Steps

  - **Verify the creation event for ntds.dit:** Inspect Windows Event ID 4663 to confirm the file was created and check the `Object Name`. Note any unusual user account associated with this action, which could indicate malicious activity.

  - **Check user account activity:** Review relevant Active Directory logs (e.g., Security Event ID 4720: User Creation or 4624: Logon) for suspicious user behavior leading up to the file creation to identify if privileged accounts were used.

  - **Identify legitimate use cases:** Document legitimate scenarios involving the creation of `ntds.dit`, such as administrative tasks during server maintenance or an upgrade of Active Directory services to rule out false positives.

  - **Analyze associated processes:** Utilize Sysmon Event ID 1 (Process Creation) to identify any processes that were involved in the file creation. Look for known benign administrative tools (e.g., `ntdsutil`) versus uncommon or suspicious executable paths.

  - **Audit change in file attributes:** Check file attributes using Windows Event ID 4656 to determine if there are any unauthorized modifications (e.g., attribute changes, access permissions) to the `ntds.dit` file that may suggest tampering.

  - **Correlate with lateral movement tools:** If `ntds.dit` creation is detected, look for known lateral movement tools or techniques being used within your environment (e.g., Mimikatz, PowerShell scripts) to correlate and confirm potential malicious intent.

  ---

  ### Prioritization

  Given the high value of the `ntds.dit` file for attackers, this alert should be treated with medium urgency. The likelihood of abuse can be high if an adversary gains privileged access to create this file, as it indicates potential credential dumping or exploitation of Active Directory configurations. While the event itself is somewhat rare under legitimate circumstances, potential malicious intent warrants closer scrutiny.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the need for accurate logging configurations for file events within Active Directory environments; if file auditing is not enabled, this event may not be logged. Additionally, legitimate administrative tasks, such as domain migrations or service updates, might trigger this alert. Correlation with other detections, such as monitoring for unusual account behavior or credential dumping attempts (e.g., Mimikatz usage), can help strengthen the detection capabilities against this threat.

