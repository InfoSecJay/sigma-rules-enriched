detection:
  selection_ntds:
    TargetFilename|endswith: '\ntds.dit'
  selection_process_img:
    Image|endswith:
            # Add more suspicious processes as you see fit
    - '\cmd.exe'
    - '\cscript.exe'
    - '\mshta.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
    - '\wsl.exe'
    - '\wt.exe'
  selection_process_paths:
    Image|contains:
    - '\AppData\'
    - '\Temp\'
    - '\Public\'
    - '\PerfLogs\'
  condition: selection_ntds and 1 of selection_process_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of the "ntds.dit" file, which is the Active Directory database, by processes that are uncommon or executed from suspicious directories. The likely attacker objective is to extract sensitive data, such as password hashes, from Active Directory. This behavior directly correlates with the MITRE ATT&CK techniques for credential access, specifically T1003.002 (Credential Dumping: NTDS) and T1003.003 (Credential Dumping: DCOM). The primary telemetry sources include Windows file event logs that detail file creation activities, particularly the event types concerning file actions.

  If this detection is confirmed as malicious, the potential impact could be severe, resulting in unauthorized access to user credentials and potentially compromising the entire Active Directory environment. However, this rule alone does not confirm malicious intent, as the creation of the ntds.dit file can occur through legitimate system processes during administrative tasks.

  ### Investigation Steps

  - **Identify the process initiating the creation**: Review the file creation event logs (Windows Event ID 4663) for the "ntds.dit" file in conjunction with the process ID (PID) linked to this event. Check if the PID belongs to a known legitimate application or user activity.

  - **Check process path for anomalies**: Verify the path of the process creating "ntds.dit" against known safe locations. If the process is running from directories like `\AppData\` or `\Temp\`, this may indicate suspicious activity. Refer to the `Image` field in the logs for filtering this information.

  - **Examine the user context**: Investigate the user account associated with the file creation (refer to Event ID 4624). Cross-reference with activities expected from administrative accounts. If the account is not associated with high-level administrative privileges, this could suggest malicious action.

  - **Review for legitimate activities**: Understand that legitimate system processes and administrative scripts can interact with Active Directory. Document any valid tasks performed by legitimate users that may have resulted in the ntds.dit file being created and correlate with the time of the alert.

  - **Identify high-confidence indicators**: Look for multiple events indicating the execution of suspicious processes like `cmd.exe`, `powershell.exe`, or `wscript.exe`, particularly in conjunction with file creation logs. A high correlation (e.g., multiple instances in a short timeframe) can indicate a credential harvesting attempt.

  - **Assess file integrity**: Use file integrity monitoring tools to validate if the "ntds.dit" file has been accessed or modified unexpectedly. Check for associated event logs (e.g., event ID 4663) detailing file accesses following its creation.

  ### Prioritization

  This alert holds high severity due to the critical nature of the Active Directory database and the likelihood of malicious exploitation by actors attempting to compromise enterprise credentials. Given that the processes involved are often utilized in attack scenarios, this behavior is of particular concern and should be prioritized for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be circumvented by attackers using legitimate administrative tools or scripting, potentially masking their malicious intent. Reliable detection requires comprehensive logging of file events and an understanding of normal operational behaviors to reduce false positives. Legitimate administrative tasks, such as Active Directory maintenance and backups, may inadvertently trigger this alert. Additionally, related detections that focus on process execution from unusual directories can strengthen overall coverage against potential credential dumping threats.

