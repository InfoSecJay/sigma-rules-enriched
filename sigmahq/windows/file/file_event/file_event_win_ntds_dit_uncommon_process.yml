level: high
note: |
  ### Technical Context
  This rule detects the creation of a file named "ntds.dit," which is the Active Directory database file, by processes that are uncommon or located in suspicious directories. The presence of this file in unexpected contexts could indicate malicious actors attempting to obtain user credentials or sensitive information from the Active Directory database. Such behavior is often associated with an attacker aiming to escalate privileges in a network or maintain persistence by extracting password hashes.

  The relevant MITRE ATT&CK tactics include **Credential Access** and specifically techniques such as **Credential Dumping** (T1003.002) and **OS Credential Dumping** (T1003.003). Attackers using tools like Mimikatz or custom scripts may exploit this technique to extract credentials from the NTDS.dit file, facilitating further unauthorized access to systems and data.

  Primary data sources for detecting this activity include Windows file event logs that capture file creation events. Additionally, process creation events can provide context about the programs that initiate this suspicious behavior, especially when they stem from uncommon directories such as AppData or Temp.

  ### Investigation Steps
  - **Review File Creation Logs:** Examine Windows file event logs for any instances of the "ntds.dit" file being created, noting the timestamp and the process that initiated the creation.

  - **Analyze Process Logs:** Identify any processes that created the "ntds.dit" file by querying process creation events. Pay close attention to unusual or uncommon processes, particularly those running from temporary or non-standard directories.

  - **Correlate with User Activity:** Investigate user activity during the time the file was created. Assess any potential legitimate reasons for the activity or anomalies that suggest unauthorized access or abuse.

  - **Check for Related Artifacts:** Look for other indicators of compromise such as the presence of suspicious scripts or tools (e.g., Mimikatz) in proximity to the file creation, as these could provide additional context about the potential attack.

  ### Prioritization
  This alert is marked as high severity due to the critical role of NTDS.dit in Active Directory operations and the significant risk posed by credential theft. If exploited, the attacker gains valuable access to sensitive data and control over user accounts, potentially leading to a broader compromise within the environment.

  ### Blind Spots and Assumptions
  There may be detection gaps regarding benign activities that legitimately create or alter the NTDS.dit file, such as maintenance tasks or regular Active Directory operations. The detection logic assumes that uncommon processes and suspicious directories are indicative of malicious behavior, which may not always be the case. Additionally, successful detection requires detailed logging settings for both file events and process creation events, which must be appropriately configured to capture all necessary data for effective analysis.

