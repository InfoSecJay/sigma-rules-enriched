note: |
  ### Technical Context

  This rule detects the creation of a macro file (`VbaProject.OTM`) in Microsoft Outlook, which can indicate a potential attempt to establish persistence in the environment. Attackers may use malicious macros to execute arbitrary code, leveraging Outlook's integration with other Office applications to deliver malware or exfiltrate data. This behavior corresponds to the MITRE ATT&CK techniques:
  - **T1137 - Office Application Startup**.
  - **T1008 - API Documentation**.
  - **T1546 - Event Triggered Execution**.

  Primary telemetry sources for this detection include file creation events within the Windows OS, specifically targeting events that indicate a file ending in `\Microsoft\Outlook\VbaProject.OTM`. If successful, an attack leveraging this method could allow adversaries to maintain a foothold within the network and execute further malicious actions. Importantly, this detection alone does NOT confirm that the macro is malicious, as legitimate macros could also trigger this alert.

  ### Investigation Steps

  - **Check for legitimate macro activity:** Review macros used within organizational Outlook, often found in VBAProject.OTM for known and authorized users, particularly those with documented requirements for automated tasks.

  - **Identify suspicious Outlook files:** Inspect the creation timestamp of `VbaProject.OTM` (File Event ID 4663) to see if it aligns with user activity or administrative changes; sudden timestamps may indicate malicious behavior.

  - **Examine Outlook process details:** Confirm that the process creating the macro originates from `outlook.exe` (Process ID) by correlating Event ID 4688 (Process Creation). Legitimate use should correlate with normal user hours and typical user activities.

  - **Look for recent credential access:** Search for any correlating attempts to access credentials or send internal emails (Event IDs 4624, 4625) around the same timeframe. High-risk indicators include failures or unusual login patterns.

  - **Correlate with known CVEs and Threat Intelligence:** Consult threat intelligence databases for known malicious Outlook macros or any active reports on similar behaviors. Cross-reference identified files with known hash databases for malicious indicators.

  - **Document user context and asset criticality:** Determine if the user is a high-privilege account or related to sensitive operational roles. Compromise of such accounts may increase the urgency for further investigation.

  ### Prioritization

  This alert is high severity due to the potential impact of macro-enabled malware, the significant risk of exploitation through established persistence mechanisms, and the increasing weaponization of macros in enterprise environments. The likelihood of misuse is elevated, especially in organizations that frequently use Microsoft Office applications.

  ### Blind Spots and Assumptions

  This detection may produce false positives during legitimate macro development or enhancement activities by authorized users. Evasion techniques may include using alternative file paths or obfuscating macro code. Reliable detection depends on appropriate logging configurations for file events. Companion detections that may strengthen coverage include monitoring for suspicious script execution in Office files (related to T1203 - Exploitation for Client Execution) or file integrity checks on automated script filing locations.

