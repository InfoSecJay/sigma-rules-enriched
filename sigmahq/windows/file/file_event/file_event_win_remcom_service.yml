  ### Technical Context

  The Sigma rule detects the creation of the default RemCom service filename, `RemComSvc.exe`, which indicates the installation or execution of the RemCom remote control application. Attackers leverage RemCom to maintain remote access to systems, often with the objective of conducting further malicious activities such as data exfiltration, lateral movement, or establishing persistence. This detection aligns with the MITRE ATT&CK technique **Remote Services: RemCom (T1569.002)** and **Command and Control: Remote Services (S0029)**.

  Primary telemetry sources for this detection include Windows file event logs, specifically events related to file creation. If malicious in nature, the presence of this executable could signify a compromise and unauthorized remote access. However, it's essential to note that this detection alone does not confirm malicious intent; legitimate administrative tasks may also result in the creation of this file.

  ### Investigation Steps

  - **Verify file creation event:** Check Windows Event ID 4656 (Handle created), Event ID 4663 (Attempted access) for the `RemComSvc.exe`. Look for the timestamp and user account associated with the event to assess context.

  - **Review process lineage:** Investigate the parent process of the `RemComSvc.exe` using Sysmon Event ID 1. A legitimate process might have been executed by an authorized administrator, while an unexpected parent process may indicate malicious execution.

  - **Correlate with user activities:** Examine user account activity logs, focusing on recent logons (Event ID 4624) and other service installations performed by this user. Frequent service modifications or unusual times may indicate suspicious behavior.

  - **Identify network connections:** Check for outbound network activity related to `RemComSvc.exe` using Windows Firewall logs or network monitoring tools. Legitimate connections should generally be to known, trusted destinations, while suspicious patterns may indicate potential C2 communication.

  - **Monitor for similar service behavior:** Investigate if other common remote access tools (e.g., PsExec or TeamViewer) have been installed or executed on the same host, as they are often used alongside RemCom in malicious operations.

  ### Prioritization

  This alert should be considered medium severity as it involves potentially unauthorized remote access that could compromise system integrity. The impact is heightened if the affected system is critical to operations. While not commonly weaponized in high-profile attacks, the use of RemCom by adversaries is documented and poses a significant risk.

  ### Blind Spots and Assumptions

  Detection may be limited if the creation of `RemComSvc.exe` occurs in a legitimate administrative context, potentially leading to false positives. Additionally, the absence of complete file monitoring or logging configurations may hinder reliable detection of similar malicious activities. Legitimate administrative scripts or maintenance tasks may also trigger this alert. Companion detections for other remote access tools (e.g., PsExec executions) can enhance coverage and context regarding potential abuse scenarios.

