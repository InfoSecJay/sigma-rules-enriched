title: Renamed VsCode Code Tunnel Execution - File Indicator
id: d102b8f5-61dc-4e68-bd83-9a3187c67377
status: test
description: |
  Detects the creation of a file with the name "code_tunnel.json" which indicate execution and usage of VsCode tunneling utility by an "Image" or "Process" other than VsCode.
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-10-25
tags:
- attack.command-and-control
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '\code_tunnel.json'
  filter_main_legit_name:
        # Note: There might be other legitimate names for VsCode. Please add them if found
    Image|endswith:
    - '\code-tunnel.exe'
    - '\code.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of a file named "code_tunnel.json," which is associated with the use of the Visual Studio Code tunneling utility. Attackers may use this utility to create a command-and-control (C2) channel for remote access to compromised environments. The relevant MITRE ATT&CK tactic is Command and Control (TA0011) along with the technique T1071.001 (Application Layer Protocol: Web). The primary telemetry source is Windows file event logs, specifically monitoring the creation of files on critical endpoints. If malicious, this behavior could lead to unauthorized access or data exfiltration. This detection does NOT confirm whether the file's usage is benign or indicative of an active compromise without further context.

  ### Investigation Steps

  - **Verify process origins:** Check the process that created "code_tunnel.json." Use Security Event ID 4688 to identify the parent process. Legitimate instances typically originate from known VSCode processes (e.g., `code.exe`).

  - **Review related file activities:** Monitor subsequent file creations or modifications related to "code_tunnel.json," particularly files with similar names or located in unusual directories. Inspect event logs for suspicious activity or unusual file access patterns.

  - **Assess user context:** Analyze the user account associated with the file creation through Security Event ID 4624 (Logon) logs. Confirm if the account is a standard user without legitimate access to create such C2 utilities.

  - **Identify execution attempts:** Search for any logged network activity by reviewing Windows Firewall logs or Sysmon Event ID 3 (Network Connection) to identify connections initiated by processes related to "code_tunnel.json." Compare with known IP addresses or geolocation for suspicious locations.

  - **Correlate against known benign behaviors:** Establish a baseline for legitimate behaviors in your environment. Instances of VSCode using tunneling should not frequently generate "code_tunnel.json" unless configured by authorized users for specific development purposes.

  ### Prioritization

  This alert is high-severity due to the potential impact of command and control activities, especially on critical systems. The likelihood of malicious behavior is elevated, as the use of such tunneling utilities often indicates an attempt to maintain persistence or control over a breached system. This behavior is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if processes are obfuscated or if legitimate tunneling is incorrectly configured, potentially generating false positives. The required Windows file event logs must be thoroughly configured to ensure comprehensive monitoring. Legitimate activities, such as development use of tunneling by trusted developers, may trigger this alert. Companion detections to consider include monitoring for other unusual file creation events associated with C2 frameworks or unexpected process launches in conjunction with this alert.

