title: Renamed VsCode Code Tunnel Execution - File Indicator
id: d102b8f5-61dc-4e68-bd83-9a3187c67377
status: test
description: |
  Detects the creation of a file with the name "code_tunnel.json" which indicate execution and usage of VsCode tunneling utility by an "Image" or "Process" other than VsCode.
references:
- https://ipfyx.fr/post/visual-studio-code-tunnel/
- https://badoption.eu/blog/2023/01/31/code_c2.html
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-10-25
tags:
- attack.command-and-control
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith: '\code_tunnel.json'
  filter_main_legit_name:
        # Note: There might be other legitimate names for VsCode. Please add them if found
    Image|endswith:
    - '\code-tunnel.exe'
    - '\code.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the creation of a specific file named "code_tunnel.json," which is an indicator of the usage of the Visual Studio Code (VsCode) tunneling utility. Attackers may utilize VsCode tunneling as a means to establish unauthorized command and control (C2) channels or to exfiltrate data from compromised systems. By creating this file under the context of processes that are not legitimate instances of VsCode, the detection indicates potential malicious activities aimed at bypassing security controls and gaining unauthorized remote access.

  The relevant MITRE ATT&CK tactics associated with this detection include *Command and Control* (TA0011) and potentially *Execution* (TA0002). Techniques that apply are *Application Layer Protocol* (T1071) and *Network Tunneling* (T1572), which detail the framework of how attackers may maneuver through communications without detection.

  Primary data sources for this detection will include file event logs on Windows systems that can monitor the creation of files, as well as process creation events to identify the execution context of applications that may otherwise be associated with legitimate use of VsCode.

  ### Investigation Steps
  - **Review File Creation Logs**: Investigate file creation logs to confirm the existence of "code_tunnel.json" and correlate the timestamp with other suspicious activities on the system.
  - **Analyze Process Creation Events**: Check process creation logs to identify the parent process that generated "code_tunnel.json," focusing on processes that are not recognized as legitimate instances of VsCode.
  - **Examine Network Connections**: Look for unusual outbound network connections from the process associated with "code_tunnel.json." Pay close attention to non-standard ports or endpoints that could signify unauthorized tunneling activities.
  - **Conduct a Contextual Investigation**: Assess user activity leading to the file creation and any other processes initiated around the same time. Verify against known good baselines to determine anomalous behavior.

  ### Prioritization
  This alert is classified as high severity due to the implications of unauthorized command and control activity. The likelihood of exploitation through tunneling techniques can significantly escalate the potential for data breaches or system compromise in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection may have gaps if legitimate use of the VsCode tunneling tool is prevalent within the organization, which could lead to false positives. The detection logic assumes that the file creation does not occur within known legitimate VsCode instances, which may not cover all use cases. Additionally, this alert requires proper configuration of file event logging to capture the pertinent activities effectively. Without adequate logs and monitoring in place, the detection could be compromised.

