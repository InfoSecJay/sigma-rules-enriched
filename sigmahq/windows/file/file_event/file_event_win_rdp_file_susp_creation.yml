note: |
  ### Technical Context
  This detection rule identifies the creation of files with the ".rdp" extension by applications that are not typically associated with such file types. RDP (Remote Desktop Protocol) files are commonly used for creating connections to remote systems via Microsoft's Remote Desktop services. The presence of these files being created by unexpected or uncommon applications may indicate suspicious or malicious activities, particularly as attackers may use RDP files as a method to facilitate unauthorized access to systems.

  The threat scenario suggests that an attacker, aiming for persistence or lateral movement within a target environment, may leverage uncommon applications to bypass traditional security controls. This can also indicate a potential initial access vector or post-exploitation activity aiming to establish remote access. Attackers might create RDP files to lead victims into opening unwarranted remote sessions to compromised machines.

  Relevant MITRE ATT&CK techniques include:
  - **T1071.001**: Application Layer Protocol: Web Protocols
  - **T1071.002**: Application Layer Protocol: Remote Desktop Protocol
  - **T1133**: External Remote Services

  The primary data sources for detection include:
  - Windows file creation event logs
  - Process creation logs to correlate application behavior
  - Security logs to monitor network connections and communications initiated by these applications

  ### Investigation Steps
  - **Review File Creation Logs**: Examine logs for the creation of ".rdp" files, focusing on the filename and the parent process that initiated the file creation.
  - **Analyze Process Activity**: Investigate the process that created the RDP file, checking for anomalies in the application's behavior or execution context, particularly for uncommon applications.
  - **Check Network Connections**: Assess any associated outbound connections made by the application that generated the RDP file; look for unusual remote destinations or ports commonly associated with RDP.
  - **Correlate with User Behavior**: Cross-reference the RDP file creation events with user account activity to determine if the user or system executing the application is operating within expected behavior levels.

  ### Prioritization
  Given the potential for attackers to misuse uncommon applications for establishing unauthorized remote connections, this alert should be treated with high severity. The presence of an RDP file generated by an unexpected application indicates a significant risk, warranting immediate investigation.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from legitimate applications that might also create ".rdp" files for valid reasons, leading to potential false positives. The detection logic assumes that unusual applications will not typically create these files; therefore, any alterations in user behavior or application normalcy might not be captured. This alert relies on having detailed logging enabled for file events and process creation, which must be configured correctly across Windows systems to ensure comprehensive coverage.

