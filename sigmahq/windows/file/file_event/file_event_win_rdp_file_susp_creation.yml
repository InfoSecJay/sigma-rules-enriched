note: |
  ### Technical Context

  This Sigma rule detects the creation of files with a ".rdp" extension by applications that typically do not generate such files, indicating potential misuse of Remote Desktop Protocol (RDP). Attackers may leverage this behavior to set up unauthorized remote access to a compromised system, which could be part of lateral movement or persistent threat strategies. This activity corresponds with the MITRE ATT&CK tactics of **Defense Evasion** (T1560) as it attempts to establish unauthorized connections.

  The primary telemetry sources are Windows file event logs, specifically focusing on the creation events of RDP files (Event ID 4663). If the detected behavior is malicious, it could allow an adversary persistent access to the environment, potentially leading to data exfiltration or further exploitation. Importantly, this detection alone does not confirm malicious intent; legitimate applications may also generate RDP files under certain conditions.

  ### Investigation Steps

  - **Check process origin for file creation:** Review Event ID 4663 in Security logs to verify the Image and Process ID associated with the RDP file creation. Malicious indicators may include uncommon applications, such as browsers generating RDP files, while legitimate behavior would involve standard administrative tools like Remote Desktop Connection (mstsc.exe).

  - **Identify related network activity:** Correlate the time of the RDP file creation with any outbound traffic logs (NetFlow, firewall logs). Look for connections to foreign IP addresses or non-standard ports which may suggest remote access attempts from non-trusted locations.

  - **Analyze directory location:** Determine the directory where the ".rdp" file was created. Files located in unusual user directories, such as a temporary folder (e.g., C:\Users\Public\AppData\Local\Temp), may indicate malicious actions, as legitimate RDP files are typically stored in user-specific folders or administrative locations.

  - **Review legitimate application behavior:** Evaluate common scenarios where RDP files may be created, such as system updates or authorized remote access setups involving known IT management tools. This context can help discern benign activities from potentially malicious instantiations.

  - **Examine user account activity:** Investigate any account associated with the RDP file creation through Event ID 4624 (logon events) to confirm whether it aligns with standard operating behavior. Sudden increases in account activity, especially outside business hours, could indicate compromised credentials.

  - **Explore related logs for past actions:** Validate whether the application that created the RDP file (e.g., a web browser) exhibited accessing an unusual URL or downloading suspicious files prior to file creation. This behavior could implicate a more significant initial access vector.

  ### Prioritization

  This alert is categorized as high severity due to the potential for immediate exploitation of a system hosting an RDP file. Given that RDP is a common attack vector, any unusual behavior around RDP file creation should be treated with urgency, especially in high-asset environments.

  ### Blind Spots and Assumptions

  Detection may miss legitimate instances where trusted applications, configured to create RDP files (e.g., remote management software), are employed in a standard manner. The rule necessitates accurate logging settings in Windows to ensure comprehensive monitoring of file events. Additionally, user-initiated RDP file generation during legitimate support sessions may inadvertently trigger alerts, leading to false positives. Companion detections, such as monitoring for outbound RDP connection attempts (e.g., Event ID 4624), can enhance overall threat visibility.

