    - '\chromium.exe'
    - '\firefox.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\iexplore.exe'
    - '\microsoftedge.exe'
    - '\msedge.exe'
    - '\Opera.exe'
    - '\Vivaldi.exe'
    - '\Whale.exe'
