detection:
  selection:
    TargetFilename|endswith: '.rdp'
    Image|endswith:
            # Covers browsers
    - '\brave.exe'
    - '\CCleaner Browser\Application\CCleanerBrowser.exe'
    - '\chromium.exe'
    - '\firefox.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\iexplore.exe'
    - '\microsoftedge.exe'
    - '\msedge.exe'
    - '\Opera.exe'
    - '\Vivaldi.exe'
    - '\Whale.exe'
            # Covers email clients
    - '\olk.exe'         # Outlook
    - '\Outlook.exe'
    - '\RuntimeBroker.exe'         # If the windows mail client is used
    - '\Thunderbird.exe'
            # Covers chat applications
    - '\Discord.exe'         # Should open the browser for download, but just in case.
    - '\Keybase.exe'
    - '\msteams.exe'
    - '\Slack.exe'
    - '\teams.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of Remote Desktop Protocol (RDP) files with an ".rdp" extension by applications not typically associated with generating such files. This behavior may indicate an adversary attempting to establish unauthorized remote access to systems or to lateral movement within the network, potentially leading to data exfiltration or system compromise. Relevant MITRE ATT&CK tactics and techniques include "Initial Access" (TA0043) and "Remote Services" (T1133). The primary telemetry source is Windows file event logs that capture file creation activities.

  If this detection is confirmed malicious, it poses a significant risk as it may facilitate unauthorized remote access to the affected system. However, this detection alone does not confirm that a successful breach or subsequent malicious activity has occurred; further investigation is necessary to determine the true intent behind the file creation.

  ---

  ### Investigation Steps

  - **Check event logs for RDP file creation:** Query for Security Event ID 4663 targeting the creation of files with the ".rdp" extension. Review fields like `ObjectType` and `ObjectName` to confirm the RDP file path and creation context.

  - **Identify the creating application:** Investigate the `Image` field associated with the file creation event. Verify if the application is indeed a suspect (e.g., browsers or chat applications) as listed in the Sigma rule. Legitimate behavior typically involves RDP files being created by default RDP client applications, not uncommon or unexpected applications.

  - **Cross-reference with application usage events:** Check for recent application activity and process creation logs (e.g., Sysmon Event ID 1), especially around the time the RDP file was created. Look for anomalous or unusual command line arguments that suggest attempts to invoke RDP file downloads.

  - **Inspect network traffic associated with the host:** Review firewall and proxy logs for outbound connections originating from hosts associated with the RDP file creation. Observe for connections to known malicious IP addresses or unauthorized hosts.

  - **Examine for file transfer or manipulation:** Validate file creation logs in the directory where the RDP file was generated, looking for unusual file timestamps or copies to shared/common directories which may indicate an attempt to distribute or share the RDP file.

  - **Evaluate asset criticality for exposed systems:** Identify if the affected system is deemed critical and assess the potential security impact of unauthorized remote access. Prioritize investigations on servers or high-value targets within the network.

  ---

  ### Prioritization

  This alert is high priority due to the potential impact on critical assets and the likelihood that this behavior is part of a larger malicious campaign. The creation of RDP files by uncommon applications is a tactic often observed in initial access attempts and can facilitate rapid exploitation if overlooked.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques such as the adversary creating RDP files in legitimate contexts that are less scrutinized. Comprehensive logging must be enabled on endpoints to capture file events effectively. Furthermore, certain legitimate user actions, such as benign software downloads, could trigger this rule. Companion detections such as abnormal network connections post-RDP file creation should be implemented to bolster coverage and confirm potential malicious activity.

