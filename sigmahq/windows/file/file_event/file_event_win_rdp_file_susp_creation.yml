logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: '.rdp'
    Image|endswith:
            # Covers browsers
    - '\brave.exe'
    - '\CCleaner Browser\Application\CCleanerBrowser.exe'
    - '\chromium.exe'
    - '\firefox.exe'
    - '\Google\Chrome\Application\chrome.exe'
    - '\iexplore.exe'
    - '\microsoftedge.exe'
    - '\msedge.exe'
    - '\Opera.exe'
    - '\Vivaldi.exe'
    - '\Whale.exe'
            # Covers email clients
    - '\olk.exe'         # Outlook
    - '\Outlook.exe'
    - '\RuntimeBroker.exe'         # If the windows mail client is used
    - '\Thunderbird.exe'
            # Covers chat applications
    - '\Discord.exe'         # Should open the browser for download, but just in case.
    - '\Keybase.exe'
    - '\msteams.exe'
    - '\Slack.exe'
    - '\teams.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of a file with a ".rdp" extension by applications not typically associated with Remote Desktop Protocol (RDP) file generation. The likely attacker objective is to exploit RDP for unauthorized remote access, potentially leading to lateral movement within the network. This behavior aligns with the MITRE ATT&CK tactic of "Initial Access" (TA0001) and technique "Exploitation of Remote Services" (T1210).

  The primary sources of telemetry are file creation events on Windows endpoints, specifically requiring logs that record file operations. If this behavior is malicious, it can lead to compromise of system integrity and unauthorized access to sensitive environments. It is important to note that the detection of this alert does NOT confirm malicious intent on its own; additional context is needed to assess the legitimacy of the file creation.

  ### Investigation Steps

  - **Check event logs for RDP file creation:** Search for Windows Event ID 4663, which logs file operations, to identify the creation of ".rdp" files. Specifically, look for events where the Object Name ends with ".rdp".

  - **Identify the initiating application:** Cross-reference the Event ID 4688 (Process Creation) to find which application initiated the RDP file creation. Check if the Image field corresponds to any applications specified in the detection rule (e.g., browsers, email clients).

  - **Verify authorized user activity:** Compare the user account with normal operational behavior—admins frequently use RDP, but any unusual account creating an .rdp file should be scrutinized.

  - **Look for other file types in the same directory:** Check for a pattern of suspicious behavior by listing other files created in the same directory around the same time (using the Windows Security Event ID 4663). Legitimate applications would typically create related RDP files in designated user profiles or specific application folders.

  - **Confirm file characteristics:** Investigate the properties of the created RDP files for anomalies—specifically, check for unusual configurations within the file that does not line up with expected settings, such as unusual IP addresses or domains.

  ### Prioritization

  This alert has high severity due to the risk of unauthorized access to sensitive systems via RDP, a commonly weaponized tactic by adversaries. Given the applications specified in the detection, there's a heightened likelihood of malicious exploitation, especially if RDP use is not standard within the environment.

  ### Blind Spots and Assumptions

  This detection may miss scenarios where legitimate applications or scripts use unusual methods to create ".rdp" files. The effectiveness of the detection relies on comprehensive logging configurations to capture file creation events. Legitimate activities, such as IT admins creating RDP files for support, may trigger the alert. A companion detection, such as monitoring for failed RDP login attempts (MITRE ID T1203), can help contextualize this behavior.

