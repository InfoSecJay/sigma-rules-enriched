title: Uncommon File Created by Notepad++ Updater Gup.EXE
id: 3b8f4c92-6a51-4d7e-9c3a-8e2d1f5a7b09
status: experimental
description: |
  Detects when the Notepad++ updater (gup.exe) creates files in suspicious or uncommon locations.
  This could indicate potential exploitation of the updater component to deliver unwanted malware or unwarranted files.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-03
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
  filter_main_legit_paths:
    TargetFilename|startswith:
    - 'C:\Program Files\Notepad++\'
    - 'C:\Program Files (x86)\Notepad++\'
  filter_main_temp_update_installer:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - 'npp.'
    - '.Installer.'
    - '.exe'
  filter_main_temp_generic_zip:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - '.zip'
  filter_main_recycle_bin:
    TargetFilename|startswith: 'C:\$Recycle.Bin\S-1-5-21'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Custom or portable Notepad++ installations in non-standard directories.
- Legitimate update processes creating temporary files in unexpected locations.
level: high
note: |
  ### Technical Context
  This detection rule focuses on identifying when the Notepad++ updater (gup.exe) creates files in unusual or suspicious locations on a Windows system. The underlying threat scenario suggests that an attacker may exploit the updater component as a vector for delivering malicious payloads or unwanted files, often indicative of supply chain attacks or malware installation. By monitoring these file creation activities, security teams can uncover potentially harmful manipulations of legitimate software functionalities.

  Relevant MITRE ATT&CK tactics for this rule include:
  - **Initial Access (TA0001)**: Attackers may use this technique to compromise systems through faulty software updates.
  - **Execution (TA0002)**: Creating executable files that may be executed as part of the attack.
  - **Defense Evasion (TA1203)**: Utilizing legitimate software tools and their update mechanisms to bypass detection mechanisms.

  The primary data sources for effective monitoring are Windows file event logs, particularly those capturing file creation and modification events within user directories, especially under `AppData\Local\Temp\` and `Recycle Bin` locations.

  ### Investigation Steps
  - **Review Suspicious File Locations**: Examine file creation events in `C:\Users\<username>\AppData\Local\Temp\` for any gup.exe related activities, particularly files that do not conform to normal naming conventions or exhibit unusual extensions.
  - **Analyze File Properties**: Investigate the properties and hash values of newly created files to determine if they match known signatures of malware or are associated with suspicious activity.
  - **Check Process Hierarchy**: Determine if gup.exe was spawned by a legitimate process or invoked by other suspicious applications, which may indicate process injection or exploitation.
  - **Correlate with Additional Logs**: Cross-reference findings with other security logs, such as EDR telemetry, to identify any associated malicious behavior or known indicators of compromise related to Notepad++.

  ### Prioritization
  This alert carries a **high severity** because any deviation in behavior from a trusted updater could indicate a serious attack vector being exploited, potentially leading to broader compromise and malicious activities within the enterprise structure.

  ### Blind Spots and Assumptions
  There may be detection gaps for custom or portable installations of Notepad++ that do not follow standard installation paths or update mechanisms, which could bypass this rule. The detection logic assumes that gup.exe is the legitimate updater and not a malicious counterpart, leading to potential false positives. For optimal alert functionality, it is crucial to have comprehensive logging on file operations enabled and to monitor user and system activity thoroughly, ensuring the correct context for investigative outcomes.

