title: Uncommon File Created by Notepad++ Updater Gup.EXE
id: 3b8f4c92-6a51-4d7e-9c3a-8e2d1f5a7b09
status: experimental
description: |
  Detects when the Notepad++ updater (gup.exe) creates files in suspicious or uncommon locations.
  This could indicate potential exploitation of the updater component to deliver unwanted malware or unwarranted files.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-03
modified: 2026-03-16
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
  filter_main_legit_paths:
    TargetFilename|startswith:
    - 'C:\Program Files\Notepad++\'
    - 'C:\Program Files (x86)\Notepad++\'
  filter_main_temp_update_installer:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - 'npp.'
    - '.Installer.'
    - '.exe'
  filter_main_temp_generic_zip:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - '.zip'
  filter_main_recycle_bin:
    TargetFilename|startswith: 'C:\$Recycle.Bin\S-1-5-21'
  filter_main_plugins:
  - TargetFilename|contains:
    - '\plugins\JsonTools\testfiles\'
    - '\Notepad++\plugins\ComparePlugin\'
  - TargetFilename|contains|all:
    - 'npp.'
    - '.portable.'
    - '\plugins\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Custom or portable Notepad++ installations in non-standard directories.
- Legitimate update processes creating temporary files in unexpected locations.
level: high
note: |
  ### Technical Context

  This rule detects the creation of files by the Notepad++ updater (gup.exe) in uncommon or suspicious locations, which is a behavior potentially indicative of exploitation or misuse. Adversaries may leverage the updater to deploy malicious files or malware, particularly if the original application itself is trusted. The relevant MITRE ATT&CK tactics and techniques are **Initial Access (T1195.002)** and **Collection (T1557)**. Primary telemetry sources include file event logs from Windows, specifically targeting log types that document file creation and modification events.

  If malicious, the impact could be significant, potentially allowing attackers to introduce unwanted software or persist in a compromised environment. This detection does not confirm that the detected behavior is definitely malicious; legitimate applications may also trigger these alerts in atypical environments or configurations.

  ### Investigation Steps

  - **Verify the file path of created files:** Check the `TargetFilename` field in Windows Security Event ID 4663 or Sysmon Event ID 11 for the specific file path. Legitimate paths typically include `C:\Program Files\Notepad++\` or `C:\Program Files (x86)\Notepad++\`. Paths outside these directories are suspicious.

  - **Identify the parent process:** In conjunction with the detected file creation, query Event ID 4688 for the process creation details. Confirm if `gup.exe` is a child process of a known application. Legitimate processes will usually originate from a trusted Notepad++ instance.

  - **Correlate with user activity logs:** Reference audit logs for user actions around the time of the alert, such as `Logon` events (Event ID 4624). Cross-reference to see if the user commonly runs Notepad++ and its installer paths, to differentiate malicious behavior from typical usage.

  - **Analyze for associated malicious indicators:** Check for recent suspicious network activity correlated with the process by reviewing Windows Firewall logs (Event ID 5156) or proxy logs. Look for unusual outbound connections made by `gup.exe`.

  - **Validate presence of known malware signatures:** Utilize an endpoint protection tool to scan the files created by `gup.exe`, particularly those detected in locations like `C:\Users\*\AppData\Local\Temp\`. This may reveal known malware if it has been deployed.

  - **Review benign installation scenarios:** Understand configurations where Notepad++ was legitimately installed in custom locations. Document any instances where these atypical paths are considered acceptable for operational purposes.

  ### Prioritization

  This alert is classified as high severity due to its potential impact on compromised systems and the likelihood of exploitation through trusted software components. The use of common applications like Notepad++ makes this behavior a plausible target for adversaries, aligning it with known methods of compromise.

  ### Blind Spots and Assumptions

  This detection may miss diverse evasion techniques, such as renaming malicious executables or using other benign applications for similar file creation purposes. Reliable detection requires comprehensive logging configurations, including file system monitoring and sufficient granularity in the path logs. Legitimate updates from custom installations may also falsely trigger the alert. A related detection could include monitoring for unusual file modifications in other benign applications, enhancing the context around potential exploitation.

