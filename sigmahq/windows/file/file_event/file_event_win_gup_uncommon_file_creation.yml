title: Uncommon File Created by Notepad++ Updater Gup.EXE
id: 3b8f4c92-6a51-4d7e-9c3a-8e2d1f5a7b09
status: experimental
description: |
  Detects when the Notepad++ updater (gup.exe) creates files in suspicious or uncommon locations.
  This could indicate potential exploitation of the updater component to deliver unwanted malware or unwarranted files.
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-02-03
tags:
- attack.collection
- attack.credential-access
- attack.t1195.002
- attack.initial-access
- attack.t1557
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith: '\gup.exe'
  filter_main_legit_paths:
    TargetFilename|startswith:
    - 'C:\Program Files\Notepad++\'
    - 'C:\Program Files (x86)\Notepad++\'
  filter_main_temp_update_installer:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - 'npp.'
    - '.Installer.'
    - '.exe'
  filter_main_temp_generic_zip:
    TargetFilename|startswith: 'C:\Users\'
    TargetFilename|contains|all:
    - '\AppData\Local\Temp\'
    - '.zip'
  filter_main_recycle_bin:
    TargetFilename|startswith: 'C:\$Recycle.Bin\S-1-5-21'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Custom or portable Notepad++ installations in non-standard directories.
- Legitimate update processes creating temporary files in unexpected locations.
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files by the Notepad++ updater (gup.exe) in locations that are unusual or potentially malicious. The likely objective of an adversary triggering this behavior could be to exploit the updater as a delivery mechanism for malware. The relevant MITRE ATT&CK tactics and techniques associated with this alert include Initial Access (TA0001), particularly through Supply Chain Compromise (T1195.002) and Collection (TA0009).

  The primary telemetry source is the Windows file event logs, specifically targeting actions related to file creation and modification. If malicious, this activity could indicate a backdoor or unwanted software being installed that could compromise system integrity and user data. Importantly, this detection does NOT confirm malicious intent or activity on its own, as benign processes may trigger this rule, particularly legitimate uses of Notepad++ update functionality.

  ### Investigation Steps

  - **Review Event ID 4663 or Sysmon Event ID 11:** Check for `ObjectType` that is generating the creation event, specifically involving `gup.exe`. Look for signs of unusual file names or extensions that deviate from normal update files.

  - **Correlate file paths against known environments:** Validate file creation locations against standard installation paths for Notepad++. Legitimate updates should primarily occur under `C:\Program Files\Notepad++\` or `C:\Program Files (x86)\Notepad++\`.

  - **Identify files created in temporary paths:** Focus on files created in `C:\Users\<username>\AppData\Local\Temp\`. Look for unexpected `npp..Installer.exe` or `.zip` files. Genuine installers may appear here, but unusual naming patterns may indicate malicious activity.

  - **Confirm file creation in user profile Recycle Bin:** Check for file creation events under `C:\$Recycle.Bin\S-1-5-21\`. Files stored in this location can suggest an attempt to hide malicious activity. Validate the context of these files against normal cleanup behavior by Notepad++.

  - **Assess system roles and asset criticality:** Determine if the affected system is part of a critical infrastructure or high-value target. Notepad++ typically operates on user workstations; unusual activity on a less secure system is of higher concern.

  - **Examine security software alerts:** Cross-reference with any alerts or logs from endpoint protection solutions regarding `gup.exe`. Legitimate updater processes should not trigger multiple alerts in a short time frame, which may indicate abuse or exploitation.

  ### Prioritization

  This alert is considered high severity due to the potential impact of compromised systems executing malicious software through seemingly benign applications. The likelihood of exploitation using legitimate software like Notepad++ is elevated, especially in cases of supply chain attacks where such tools may be weaponized.

  ### Blind Spots and Assumptions

  Detection may be limited if the gup.exe has been improperly configured or if file monitoring on low-tier systems is inadequate. Legitimate software updates or portable installations of Notepad++ could trigger this alert. A related detection rule for monitoring unusual Powershell commands interacting with the updater could further strengthen coverage against potential file creation abuse.

