note: |
  ### Technical Context

  This Sigma rule detects the installation of ScreenConnect, a legitimate remote access tool that can be exploited by adversaries to establish command and control (C2) channels. Attackers may use tools like ScreenConnect for unauthorized remote access, often disguising their malicious intent within legitimate applications. This behavior corresponds to the MITRE ATT&CK technique T1219.002 (Remote Access Tools: ScreenConnect).

  The primary telemetry source is Windows file events, specifically monitoring for the presence of certain file paths related to ScreenConnect installations. If this behavior is malicious, an adversary could gain control over the target system, potentially leading to data exfiltration or lateral movement. This detection does not confirm malicious intent on its own and could be triggered by legitimate administrative activities.

  ### Investigation Steps

  - **Check installation logs:** Review Windows Event ID  Installer (Event ID 1033) for installation logs related to ScreenConnect. Look for unusual timestamp patterns or installations on systems where it’s not part of the standard imaging process.

  - **Review file creation events:** Examine file event logs, specifically Event ID 4663, to confirm the creation of ScreenConnect binary files in the path `C:\Program Files\ScreenConnect\Bin\`. Look for unauthorized or unexpected timestamps indicating installation by non-administrative users.

  - **Assess user activity:** Analyze user behavior associated with the installation. Review the last logon sessions for accounts that initiated the installation using Event ID 4624. Determine if these accounts have a legitimate business need for remote access tools.

  - **Identify concurrent network connection attempts:** Check network traffic logs for TCP connections to remote hosts on typical ScreenConnect ports (default is 8040). High volumes of outbound connections immediately following the installation of ScreenConnect can indicate malicious intent.

  - **Confirm legitimate software use:** Recognize that legitimate services and support teams may use ScreenConnect. Validate with IT or the helpdesk that the installation was authorized; if not, it is likely malicious.

  ### Prioritization

  The alert severity is medium due to the potential for significant impact on the affected system if the installation is malicious. The use of remote access tools is commonly weaponized by attackers to maintain persistence, making early detection crucial. The likelihood of abuse increases as these tools can often bypass traditional security measures.

  ### Blind Spots and Assumptions

  Evasion techniques may include renaming the ScreenConnect executable or running it from a different location. Detection relies on proper logging of file events on endpoint devices, which must be enabled for effective monitoring. Legitimate desktop support sessions may also trigger this alert, such as from IT helpdesk personnel. A related detection could include monitoring for unusual network traffic patterns associated with remote access tools.

