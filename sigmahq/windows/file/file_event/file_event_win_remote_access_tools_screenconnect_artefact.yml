note: |
  ### Technical Context
  This detection rule identifies the installation of ScreenConnect, a legitimate remote access tool, which could be misused by adversaries to establish command and control (C2) channels within a target environment. Attackers may utilize such tools to gain unauthorized access to systems while masquerading as legitimate technical support, enabling them to execute commands or exfiltrate data. The presence of ScreenConnect may indicate an attempt to leverage trusted software for malicious activities, especially if its usage falls outside the typical operational parameters for the organization.

  The relevant MITRE ATT&CK tactics and techniques implicated in this rule are:
  - **Command and Control (TA0011)**
  - **Application Layer Protocol (T1071)**

  Primary data sources that will provide evidence for this activity include file creation events on Windows systems, which can record the downloading and installation of applications, alongside any associated process execution events that might reveal further context on how the tool is utilized.

  ### Investigation Steps
  - **Review File Events:** Examine recent file event logs for any instances of ScreenConnect being downloaded or executed, particularly focusing on paths containing `\Bin\ScreenConnect.`

  - **Analyze Process Activity:** Check process creation logs to identify any suspicious processes that execute ScreenConnect and correlate them with the corresponding user account and time of installation.

  - **Inspect Network Traffic:** If possible, analyze outbound network traffic for connections made by the ScreenConnect application to identify any unusual C2 activity patterns or communications with known malicious IP addresses.

  - **Query User Behavior:** Investigate the user behavior of accounts that installed or executed ScreenConnect. Look for deviations from normal usage patterns, such as access to critical assets or times when legitimate users typically do not request remote support.

  ### Prioritization
  Given the potential for ScreenConnect to facilitate unauthorized access and control over target systems, this alert is classified as medium severity. Rapid identification and response may be necessary to mitigate risks associated with potential data exfiltration or lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection rule may not cover legitimate uses of ScreenConnect that are sanctioned within the organization, leading to potential false positives. Moreover, the detection logic assumes that installation files are named in a standard format. Environments lacking file event logging or those with restricted configurations for logging remote access tools could lead to gaps in detection capabilities. Additional logging, such as user account activity and network connection details, may be required to enhance context and reduce ambiguity surrounding the alert.

