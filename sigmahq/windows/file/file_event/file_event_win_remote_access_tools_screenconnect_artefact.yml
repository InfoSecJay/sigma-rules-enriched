  ### Technical Context

  This rule detects the installation artifacts associated with ScreenConnect, a remote access tool that adversaries may use to establish command and control channels on targeted systems. The likely attacker objective is to gain unauthorized access for data exfiltration or network manipulation while using a tool that may appear legitimate. This behavior is categorized under the MITRE ATT&CK framework, specifically the Command and Control tactic (TA0011) and the Use of Remote Access Tools technique (T1219.002).

  The primary telemetry sources are file system events on Windows, specifically logs that capture file creation, modification, or access. If malicious, this behavior could significantly impact the security posture by allowing unauthorized control over sensitive systems. Importantly, this detection does NOT confirm malicious intent on its own; legitimate users may also install and use remote access tools.

  ---

  ### Investigation Steps

  - **Identify installation activity:** Check for Windows file event logs (Event ID 4663) and verify FileName for entries containing "\Bin\ScreenConnect." Examine timeframes and user accounts associated with the file activity to determine if they align with expected user behavior.

  - **Assess legitimate usage:** Review installation logs or records (if any) to confirm if ScreenConnect is explicitly authorized within your organization’s remote support protocols. Legitimate installations usually come from known IT support groups and are documented.

  - **Correlate account activity:** Review authentication logs (Event ID 4624) to identify accounts initiating the installation of ScreenConnect. Look for any anomalies like privileged accounts performing unauthorized actions or unknown accounts exhibiting unexpected behavior.

  - **Look for additional indicators:** Cross-check with Windows Sysmon logs (Event ID 1) to trace process creation involving java or .NET runtime, specifically looking for unusual parent-child process relationships within the timeframe of the ScreenConnect installation.

  - **Evaluate network traffic logs:** Examine firewall logs for outbound connections to known ScreenConnect IP addresses or domains. Look for unusual traffic patterns originating from the affected host indicating potential command and control communication.

  - **Check for known malicious indicators:** Use threat intelligence feeds to verify if the ScreenConnect binaries match known hashes associated with malicious usage. A high-confidence malicious indicator would involve hashes absent from your organization’s legitimate software library.

  ---

  ### Prioritization

  This alert severity is considered medium due to the potential impact on systems that use ScreenConnect for remote support. The likelihood of adversarial abuse is moderate, as remote access tools are frequently weaponized in attacks. It is crucial to assess system criticality and the context of the installation to determine response priorities effectively.

  ---

  ### Blind Spots and Assumptions

  Detection limitations exist since the use of ScreenConnect may also signal legitimate administrative activity, leading to false positives. Required log sources include comprehensive file event logs and Sysmon configurations for proper visibility on process activity. Legitimate uses of similar remote access tools by IT departments or service vendors may trigger this alert. A complementary detection approach could involve monitoring for other remote access tools (e.g., TeamViewer or AnyDesk installations), which would enhance overall threat coverage.

