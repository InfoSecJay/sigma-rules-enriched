- attack.t1036.002
logsource:
  category: file_event
  product: windows
detection:
  selection_rtlo_unicode:
    TargetFilename|contains:
    - '\u202e'          # Unicode RTLO character
    - '[U+202E]'
            # Real char U+202E copied/pasted below
    - '‮'
  selection_extensions:
    TargetFilename|contains:
    - '3pm.'          # Reversed `.mp3`
    - '4pm.'          # Reversed `.mp4`
    - 'cod.'          # Reversed `.doc`
    - 'fdp.'          # Reversed `.pdf`
    - 'ftr.'          # Reversed `.rtf`
    - 'gepj.'          # Reversed `.jpeg`
    - 'gnp.'          # Reversed `.png`
    - 'gpj.'          # Reversed `.jpg`
    - 'ism.'          # Reversed `.msi`
    - 'lmth.'          # Reversed `.html`
    - 'nls.'         # Reversed `.sln`
    - 'piz.'          # Reversed `.zip`
    - 'slx.'          # Reversed `.xls`
    - 'tdo.'          # Reversed `.odt`
    - 'vsc.'          # Reversed `.csv`
    - 'vwm.'          # Reversed `.wmv`
    - 'xcod.'          # Reversed `.docx`
    - 'xslx.'          # Reversed `.xlsx`
    - 'xtpp.'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Filenames that contains scriptures such as arabic or hebrew might make use of 
  this character
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_right_to_left_override_extension_spoofing/info.yml
note: |
  ### Technical Context

  This rule detects the use of right-to-left override (RTLO) characters within filenames that may attempt to spoof file extensions, such as disguising a malicious file as a legitimate document or media file (e.g., `.mp4` or `.pdf`). The likely attacker objective is to trick users or automated systems into executing malicious files by obscuring their true nature. This behavior aligns with the MITRE ATT&CK technique T1036.002 - "Masquerading: Match Legitimate Name or Location".

  The primary telemetry source is Windows file event logs, specifically targeting file creation/modification events. Malicious activity could involve running a disguised executable that appears harmless, posing a significant risk to the organization. It's important to note that this detection does NOT confirm actual execution of a malicious file; it only identifies suspicious filename patterns.

  ### Investigation Steps

  - **Review alert details**: Check for occurrences of the RTLO character (`\u202e`) in the `TargetFilename` field of the event logs (Event ID 4663 or Sysmon Event ID 10), and identify any reversed extensions that are flagged.

  - **Check file origin**: Investigate the file creation paths and user accounts associated with the alert. Look for entries in the `Security` event logs (Event ID 4663) to determine if the file was created in temporary directories or downloaded from suspicious sources.

  - **Validate expected behavior**: Examine baseline activities pertaining to legitimate file handling on affected systems. Review any known applications that might create files in a specific format and check for their associated directory placements and naming conventions.

  - **Identify high-confidence malicious indicators**: Correlate the filename's presence with any prior alerts or documented malicious activity linked to the same user or system. Check for execution of suspicious processes (Sysmon Event ID 1) triggered by user actions related to these files.

  - **Analyze additional metadata**: Review file attributes (using File Explorer or PowerShell) for these flagged files, noting unusual last modified timestamps or sizes that deviate significantly from expected values for sanctioned file types.

  ### Prioritization

  Given the impact that potentially malicious files can have, particularly in environments with critical data or user operations, this alert should be treated as high severity. The likelihood of malicious abuse is significant, as RTLO techniques are commonly weaponized to facilitate the delivery of malware. Organizations should respond promptly to mitigate the risk of infection.

  ### Blind Spots and Assumptions

  Evasion techniques could include the legitimate use of RTLO characters in files, particularly in scripts or applications with multi-language support, potentially generating false positives. This detection also relies on consistent logging practices for file events, which must be correctly configured in the environment. Common benign activities include legitimate applications creating files with similar naming schemes. Moreover, companion detections related to unusual executable file activities or email attachments should be considered to enhance coverage against such spoofing attempts.

