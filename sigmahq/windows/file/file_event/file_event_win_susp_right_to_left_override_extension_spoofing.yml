logsource:
  category: file_event
  product: windows
detection:
  selection_rtlo_unicode:
    TargetFilename|contains:
    - '\u202e'          # Unicode RTLO character
    - '[U+202E]'
  selection_extensions:
    TargetFilename|contains:
    - '3pm.'          # Reversed `.mp3`
    - '4pm.'          # Reversed `.mp4`
    - 'cod.'          # Reversed `.doc`
    - 'fdp.'          # Reversed `.pdf`
    - 'ftr.'          # Reversed `.rtf`
    - 'gepj.'          # Reversed `.jpeg`
    - 'gnp.'          # Reversed `.png`
    - 'gpj.'          # Reversed `.jpg`
    - 'ism.'          # Reversed `.msi`
    - 'lmth.'          # Reversed `.html`
    - 'nls.'         # Reversed `.sln`
    - 'piz.'          # Reversed `.zip`
    - 'slx.'          # Reversed `.xls`
    - 'tdo.'          # Reversed `.odt`
    - 'vsc.'          # Reversed `.csv`
    - 'vwm.'          # Reversed `.wmv`
    - 'xcod.'          # Reversed `.docx`
    - 'xslx.'          # Reversed `.xlsx`
    - 'xtpp.'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Filenames that contains scriptures such as arabic or hebrew might make use of this
  character
level: high
note: |
  ---

  ### Technical Context

  This rule detects file names that utilize the Unicode Right-to-Left Override (RTLO) character to potentially spoof file extensions. The primary objective for an attacker is to deceive users into executing malicious files by masking their true nature, for instance, presenting a malicious executable as a benign document. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002), specifically the technique of Masquerading (T1036.002). The primary telemetry sources are Windows file event logs, particularly focusing on file creations or modifications that exhibit suspicious naming conventions containing the RTLO character or reversed file extensions. If exploited, this can lead to malware execution and unauthorized access within the system. Importantly, this detection does NOT confirm that the file is malicious on its own, as legitimate applications may occasionally use similar naming conventions.

  ---

  ### Investigation Steps

  - **Review the file name structure:** Analyze the `TargetFilename` field in the file event log (Windows Event ID 4663). Look for the presence of the RTLO character (`\u202e`) combined with reversed extensions (e.g., `.mp3` appearing as `3pm.`). Legitimate files typically do not use such naming conventions.

  - **Check the creation source:** Identify the process or application that created or modified the suspicious file by reviewing the `ProcessId` and `ProcessName` in conjunction with Event ID 4663 logs. Trace back to common applications such as word processors or media players that may have generated legit files without RTLO.

  - **Investigate file creation timestamps:** Cross-reference `Event ID 4663` timestamps with other logs (e.g., Security Event ID 4688 or Sysmon Event ID 1) to identify unusual activity patterns. Look for matches with known compromised user accounts or outside business hours anomalies.

  - **Identify known malicious indicators:** If the file path or name aligns with previously identified malicious samples (as per threat intelligence feeds), increase the urgency. Use hashes for further validation—look for `SHA256` or `MD5` in antivirus logs.

  - **Document any benign counterparts:** Look for similar file names that do not invoke the RTLO character for legitimate applications (e.g., observable filenames from standard imports of document templates), as this may indicate non-malicious usage.

  ---

  ### Prioritization

  This alert should be considered high priority due to the potential impact of executed malware on the system. The likelihood of malicious abuse is significant as RTLO is a commonly employed technique for disguising file types. Attackers regularly exploit this method to bypass user scrutiny, making quick detection essential.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through modifications to the file name, using non-RTLO techniques that achieve similar deception. Reliable detection requires that Windows file event logging is correctly configured, capturing file creation/modification events. Legitimate activities, such as the use of RTL characters in language-specific applications, may trigger this alert without malicious intent. A related detection to consider is monitoring for unusual executable file creations via web download logs, enhancing visibility of potentially malicious downloads.

