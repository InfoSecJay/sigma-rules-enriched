logsource:
  category: file_event
  product: windows
detection:
  selection_rtlo_unicode:
    TargetFilename|contains:
    - '\u202e'          # Unicode RTLO character
    - '[U+202E]'
  selection_extensions:
    TargetFilename|contains:
    - '3pm.'          # Reversed `.mp3`
    - '4pm.'          # Reversed `.mp4`
    - 'cod.'          # Reversed `.doc`
    - 'fdp.'          # Reversed `.pdf`
    - 'ftr.'          # Reversed `.rtf`
    - 'gepj.'          # Reversed `.jpeg`
    - 'gnp.'          # Reversed `.png`
    - 'gpj.'          # Reversed `.jpg`
    - 'ism.'          # Reversed `.msi`
    - 'lmth.'          # Reversed `.html`
    - 'nls.'         # Reversed `.sln`
    - 'piz.'          # Reversed `.zip`
    - 'slx.'          # Reversed `.xls`
    - 'tdo.'          # Reversed `.odt`
    - 'vsc.'          # Reversed `.csv`
    - 'vwm.'          # Reversed `.wmv`
    - 'xcod.'          # Reversed `.docx`
    - 'xslx.'          # Reversed `.xlsx`
    - 'xtpp.'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Filenames that contains scriptures such as arabic or hebrew might make use of 
  this character
level: high
note: |
  ### Technical Context

  This Sigma rule detects filenames that contain a right-to-left override (RTLO) character, which is often used by attackers to spoof file extensions and mislead users into executing malicious files disguised as benign ones. The likely objective of an adversary employing this strategy is to bypass user scrutiny and security measures, enabling the delivery of malware or phishing attempts. This behavior aligns with the MITRE ATT&CK tactic of Execution (TA0002), specifically the technique of T1036.002: Masquerading — Application Layer.

  The primary telemetry sources are file event logs on Windows systems, particularly those corresponding to the creation or modification of files. Malicious activity, if confirmed, could lead to the execution of harmful payloads, unauthorized data access, or a security compromise. It is crucial to note that the presence of RTLO characters and reversed file extensions does NOT definitively confirm malicious activity, as certain legitimate applications might also utilize similar naming conventions.

  ### Investigation Steps

  - **Check Event Logs for Suspicious Filenames:** Review Windows Security Event ID 4663 (File Access) and Sysmon Event ID 11 (FileCreate) for any newly created files with the RTLO character (U+202E) and check the `TargetFilename` field for reversed extensions.

  - **Analyze the Context of File Creation:** Determine if the file was created by a legitimate or unexpected process by examining the `ProcessName` and `ParentProcessName` fields in the Sysmon Event ID 11 logs. A system process or expected application indicates benign behavior.

  - **Inspect for Commonly Spoofed Extensions:** Specifically look for files with extensions like `.mp3`, `.jpg`, or `.exe`, reversed as `3pm.`, `gpj.`, `exe.`, etc. Use filter queries to highlight these within your logs.

  - **Validate User Activity:** Cross-reference any detected file creation with user behavior logs (e.g., Azure AD sign-ins, local logons) to understand if a user was actively interacting with the machine at the time of file creation, which could indicate legitimate use.

  - **Identify High-Confidence Malicious Indicators:** Look for discrepancies such as unexpected file locations (e.g., user temp folders or desktop) combined with RTLO characters from trusted processes like `powershell.exe` or `cmd.exe`, indicating potential exploitation.

  - **Consider Legitimate Use Cases:** Be aware that files created as part of multi-language applications or certain localization processes may contain RTLO characters legitimately. Document any such instances to refine context in future investigations.

  ### Prioritization

  This alert warrants high priority due to the potential security impact of executing spoofed files, especially if they are downloaded or executed by users trusting file appearances. Given that this technique is commonly weaponized in social engineering attacks, a proactive investigation is crucial.

  ### Blind Spots and Assumptions

  Detection may not distinguish between malicious and benign use of RTLO characters, particularly in multilingual contexts. Additionally, if file logging is disabled or misconfigured, the alert may not trigger reliably. Legitimate applications handling files from diverse languages may invoke similar patterns. It is recommended to combine this detection with behavioral analytics for file access or execution to strengthen coverage against evasive tactics.

