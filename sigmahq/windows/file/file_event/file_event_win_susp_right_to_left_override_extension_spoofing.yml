title: Potential File Extension Spoofing Using Right-to-Left Override
id: 979baf41-ca44-4540-9d0c-4fcef3b5a3a4
related:
- id: ad691d92-15f2-4181-9aa4-723c74f9ddc3
  type: derived
status: test
description: |
  Detects suspicious filenames that contain a right-to-left override character and a potentially spoofed file extensions.
references:
- https://redcanary.com/blog/right-to-left-override/
- https://www.malwarebytes.com/blog/news/2014/01/the-rtlo-method
- https://tria.ge/241015-l98snsyeje/behavioral2
- https://www.unicode.org/versions/Unicode5.2.0/ch02.pdf
author: Jonathan Peters (Nextron Systems), Florian Roth (Nextron Systems), Swachchhanda
  Shrawan Poudel (Nextron Systems)
date: 2024-11-17
modified: 2025-02-06
tags:
- attack.execution
- attack.defense-evasion
- attack.t1036.002
logsource:
  category: file_event
  product: windows
detection:
  selection_rtlo_unicode:
    TargetFilename|contains:
    - '\u202e'          # Unicode RTLO character
    - '[U+202E]'
  selection_extensions:
    TargetFilename|contains:
    - '3pm.'          # Reversed `.mp3`
    - '4pm.'          # Reversed `.mp4`
    - 'cod.'          # Reversed `.doc`
    - 'fdp.'          # Reversed `.pdf`
    - 'ftr.'          # Reversed `.rtf`
    - 'gepj.'          # Reversed `.jpeg`
    - 'gnp.'          # Reversed `.png`
    - 'gpj.'          # Reversed `.jpg`
    - 'ism.'          # Reversed `.msi`
    - 'lmth.'          # Reversed `.html`
    - 'nls.'         # Reversed `.sln`
    - 'piz.'          # Reversed `.zip`
    - 'slx.'          # Reversed `.xls`
    - 'tdo.'          # Reversed `.odt`
    - 'vsc.'          # Reversed `.csv`
    - 'vwm.'          # Reversed `.wmv`
    - 'xcod.'          # Reversed `.docx`
    - 'xslx.'          # Reversed `.xlsx`
    - 'xtpp.'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Filenames that contains scriptures such as arabic or hebrew might make use of this
  character
level: high
note: |
  ### Technical Context
  This detection rule identifies potential file extension spoofing attacks that exploit the Right-to-Left Override (RTLO) character, which can trick users and security systems into misidentifying malicious files as benign. By using the RTLO character, attackers can create filenames that appear to have familiar extensions (such as `.mp3`, `.pdf`, or `.doc`), but in actuality, they may be executable scripts or malicious files designed to deliver malware or perform other harmful activities. The likely objective for attackers using this technique is to evade detection and successfully execute their payload on the victim's system.

  The relevant MITRE ATT&CK tactics for this behavior include **Execution (T1203)**, as it focuses on enabling the execution of malicious code, and **Defense Evasion (T1036.002)**, given that it is aimed at avoiding detection by disguising the true nature of files through deceptive naming conventions. In enterprise environments, primary data sources that can provide visibility into this activity include file event logs from endpoints (such as Windows logs that track file creation and modification), as these logs will capture the details of filenames containing suspicious characters.

  ### Investigation Steps
  - **Review File Event Logs**: Collect and analyze file event logs from targeted endpoints for any suspicious filenames that include the RTLO character combined with reversed file extensions, as documented in the detection logic.
  - **Identify User Activity**: Examine user activity around the time these files were created to ascertain if there were any abnormal behaviors, such as downloads from unusual sources or the execution of unfamiliar applications.
  - **Analyze Suspicious Processes**: Investigate any processes that were initiated around the time of the detected file creation or modification to determine if they correlate with known malicious behavior or tools.
  - **Check for Related Indicators**: Cross-reference the filenames and timestamps against threat intelligence databases to see if they match any known malicious patterns, especially those linked to file extension spoofing.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant impact if a user mistakenly executes a disguised malicious file, which could lead to data breaches or compromises of sensitive systems. The likelihood of such incidents occurring is elevated, especially in environments where users frequently download files from the internet or use removable media.

  ### Blind Spots and Assumptions
  A potential blind spot in this rule includes environments where logging for file events is not configured rigorously or where file activities frequently involve legitimate applications that use ambiguous naming conventions. The detection logic assumes that the RTLO character will be present in conjunction with reversed extensions; if the attacker employs different strategies for obfuscation, this rule may not trigger. Additionally, it relies on comprehensive logging of file events, which must be enabled and properly configured for the rule to function effectively.

