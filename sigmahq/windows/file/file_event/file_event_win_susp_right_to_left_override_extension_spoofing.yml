modified: 2026-03-20
tags:
- attack.execution
- attack.defense-evasion
- attack.t1036.002
logsource:
  category: file_event
  product: windows
detection:
  selection_rtlo_unicode:
    TargetFilename|contains:
    - '\u202e'          # Unicode RTLO character
    - '[U+202E]'
            # Real char U+202E copied/pasted below
    - '‮'
  selection_extensions:
    TargetFilename|contains:
    - '3pm.'          # Reversed `.mp3`
    - '4pm.'          # Reversed `.mp4`
    - 'cod.'          # Reversed `.doc`
    - 'fdp.'          # Reversed `.pdf`
    - 'ftr.'          # Reversed `.rtf`
    - 'gepj.'          # Reversed `.jpeg`
    - 'gnp.'          # Reversed `.png`
    - 'gpj.'          # Reversed `.jpg`
    - 'ism.'          # Reversed `.msi`
    - 'lmth.'          # Reversed `.html`
    - 'nls.'         # Reversed `.sln`
    - 'piz.'          # Reversed `.zip`
    - 'slx.'          # Reversed `.xls`
    - 'tdo.'          # Reversed `.odt`
    - 'vsc.'          # Reversed `.csv`
    - 'vwm.'          # Reversed `.wmv`
    - 'xcod.'          # Reversed `.docx`
    - 'xslx.'          # Reversed `.xlsx`
    - 'xtpp.'          # Reversed `.pptx`
  condition: all of selection_*
falsepositives:
- Filenames that contains scriptures such as arabic or hebrew might make use of 
  this character
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_right_to_left_override_extension_spoofing/info.yml
note: |
  ### Technical Context

  This rule detects potential file extension spoofing by identifying filenames that incorporate the right-to-left override (RTLO) Unicode character. Attackers may use this technique to deceive users into believing that a malicious file is benign by disguising its true extension (e.g., showing a .mp3 or .pdf file while underlining it as a .exe file). This behavior fits into the MITRE ATT&CK framework under the tactic "Execution" and the technique "Masquerading" (T1036.002).

  Primary telemetry sources include Windows Security Event logs (Event ID 4663 for file access) and file system-level events. If malicious, the impact includes executing unauthorized code, leading to data breach or system compromise. This detection, however, does not confirm that the file is malicious on its own; it only identifies potentially deceptive filename characteristics.

  ### Investigation Steps

  - **Identify file access events:** Review File Auditing events (Event ID 4663) for any access to suspicions files containing the RTLO character or reversed extensions. Focus on UserName and ProcessID fields to pinpoint suspicious users or processes.

  - **Analyze the filename composition:** Inspect the TargetFilename field for the presence of the RTLO character (U+202E) in conjunction with reversed extensions (e.g., `3pm.` indicating a potential .mp3 file). Confirm if the file is named distinctly differently than its displayed extension.

  - **Contextualize with legitimate activity:** Investigate files accessed on endpoints primarily used for media or document handling (like workstations or user directories). True media files may include standard naming conventions without unexpected characters.

  - **Check for associated file modifications or creations:** Look for Event ID 5145 in the Security logs indicating shared object or file access related to the suspicious filenames. This could signal attempts to execute the file from network shares, increasing the risk of spreading payloads.

  - **Evaluate endpoint alert history:** Cross-check endpoint detection alerts against the user or system involved. Malicious behavior might correlate with other anomalies, such as unauthorized software installs or suspicious system modifications.

  ### Prioritization

  This alert is of high severity given that it targets potentially high-impact end-user systems and applications where users might disable security controls for various reasons. The likelihood of abuse is high as successful deception can lead to the execution of payloads that compromise sensitive data or inject malware. Malicious use of file extension spoofing is frequently seen in various email phishing campaigns and malware distribution vectors.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging for all file creation events, particularly in environments with underconfigured audit policies. Legitimate activity could trigger alerts, particularly with non-Latin scripts or formatted filenames for localized content. A related detection could include monitoring for unusual process creation linked to identified suspicious files via Event ID 4688, providing broader context to potential attack scenarios.

