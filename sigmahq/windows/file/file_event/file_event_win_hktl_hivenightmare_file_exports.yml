title: HackTool - Typical HiveNightmare SAM File Export
id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
status: test
description: Detects files written by the different tools that exploit HiveNightmare
references:
- https://github.com/GossiTheDog/HiveNightmare
- https://github.com/FireFart/hivenightmare/
- https://github.com/WiredPulse/Invoke-HiveNightmare
- https://twitter.com/cube0x0/status/1418920190759378944
author: Florian Roth (Nextron Systems)
date: 2021-07-23
modified: 2024-06-27
tags:
- attack.credential-access
- attack.t1552.001
- cve.2021-36934
logsource:
  product: windows
  category: file_event
detection:
  selection:
  - TargetFilename|contains:
    - '\hive_sam_'            # Go version
    - '\SAM-2021-'            # C++ version
    - '\SAM-2022-'            # C++ version
    - '\SAM-2023-'            # C++ version
    - '\SAM-haxx'             # Early C++ versions
    - '\Sam.save'             # PowerShell version
  - TargetFilename: 'C:\windows\temp\sam'        # C# version of HiveNightmare
  condition: selection
falsepositives:
- Files that accidentally contain these strings
level: high
note: |
  ### Technical Context
  This rule detects the creation of files associated with the exploitation of the HiveNightmare vulnerability (CVE-2021-36934), which allows unauthorized access to the Windows Security Accounts Manager (SAM) database. Attackers leveraging this vulnerability can potentially extract sensitive account information, effectively performing credential access or account enumeration. The objective of these attacks typically includes post-exploitation activities such as privilege escalation, lateral movement, and exfiltration of critical information.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Credential Access** and specifically the technique **T1552.001 - Unsecured Credentials**. This behavior is representative of threat actors using tools identified in the HiveNightmare exploit toolkit to exfiltrate sensitive data from a compromised system, targeting Windows environments.

  The primary data sources relevant for this detection are **Windows file event logs**, which will capture file creation activities and modifications in the filesystem, particularly in locations where these tools are known to write their output (e.g., C:\windows\temp\).

  ### Investigation Steps
  - **Review Suspicious File Creations:** Analyze recent file creation events in the `C:\windows\temp` and any paths matching `\hive_sam_`, `\SAM-2021-`, `\SAM-2022-`, and others specified in the detection logic to identify potential exploitation attempts.

  - **Examine User Context:** Investigate which user account executed actions leading to the creation of these files to ascertain whether it was a legitimate user or if it indicates misuse by an unauthorized actor.

  - **Correlate with Process Activity:** Look for associated process creation events preceding the file activities. Pay attention to any instances of known HiveNightmare execution commands or scripts being run, especially involving PowerShell or executable formats.

  - **Inspect System Logs for Anomalies:** Review security logs for unusual account activities, such as unexpected logins or access to sensitive resources, which may further indicate credential theft or escalation attempts stemming from HiveNightmare exploitation.

  ### Prioritization
  Given the high severity assigned to this alert, the potential impact of an attacker gaining access to credential databases is significant. The exploitation of vulnerabilities that expose security credentials facilitates wide-ranging access throughout an enterprise, increasing the likelihood of credential theft and subsequent breaches.

  ### Blind Spots and Assumptions
  This detection is limited by the presence of file creation events in Windows logs and may not identify all instances of exploit use if logging is insufficient or disabled. The rule assumes that the detection environment has proper logging configurations enabled for file events. Additionally, false positives may occur from legitimate applications or user actions that coincidentally generate file names similar to the patterns specified. Regular reviews of whitelisted file actions may be necessary to minimize noise in alerts.

