logsource:
  product: windows
  category: file_event
detection:
  selection:
  - TargetFilename|contains:
    - '\hive_sam_'            # Go version
    - '\SAM-2021-'            # C++ version
    - '\SAM-2022-'            # C++ version
    - '\SAM-2023-'            # C++ version
    - '\SAM-haxx'             # Early C++ versions
    - '\Sam.save'             # PowerShell version
  - TargetFilename: 'C:\windows\temp\sam'        # C# version of HiveNightmare
  condition: selection
falsepositives:
- Files that accidentally contain these strings
level: high
note: |
  ### Technical Context

  This rule detects the unauthorized creation of files indicative of the exploit known as HiveNightmare, a vulnerability affecting Windows systems that allows unauthorized access to the Security Account Manager (SAM) database. Attackers leveraging this vulnerability typically aim to extract sensitive credential data for lateral movement or privilege escalation. Relevant MITRE ATT&CK tactics and techniques include Credential Access (T1552.001). The primary telemetry sources required are Windows file event logs that document file creation activities.

  If malicious, the impact could be significant due to the exposure of high-privilege accounts and credentials, potentially enabling further exploitation within the network. This detection does NOT confirm actual data exfiltration or successful credential compromise on its own.

  ### Investigation Steps

  - **Identify suspicious file creations**: Review Windows File Event logs (Event ID 4663) for file creation events. Look for TargetFilename paths containing keywords such as `\hive_sam_`, `\SAM-2021-`, and `C:\windows\temp\sam`. If these paths are present, it warrants deeper investigation.

  - **Correlate with user activity**: Check Security Event Logs (Event ID 4624) to correlate with the user account activity at the time of suspicious file creation. Legitimate activities would typically not involve the creation of files in the temp directory containing these keywords.

  - **Assess file properties**: Examine files identified in the previous step using Windows Explorer or a PowerShell command (Get-Item). Look for creation timestamps that coincide with unusual user behavior or administrative tasks.

  - **Review application and process behavior**: Inspect Sysmon logs (Event ID 1) for unusual process creation associated with HiveNightmare tools at the same time as file creations. Look for known process names or command line arguments that indicate exploitation attempts.

  - **Check system state and ownership**: Determine if the file's owning process is legitimate or related to a known exploit tool. Suspicious ownership or unexpected cmdlets or tooling can indicate malicious activity.

  - **Confirm absence of benign triggers**: Validate that there are no other legitimate applications or administrative scripts running on the system that could create similarly named files; document if any are found to explain the alert.

  ### Prioritization

  This alert is considered high priority due to the potential for significant impact on network security, with the likelihood of exploitation given the known nature of HiveNightmare. The technique is commonly weaponized by adversaries aiming for credential access, which could lead to severe compromise.

  ### Blind Spots and Assumptions

  Detection may be bypassed if file names are obfuscated or renamed. It requires proper logging settings to ensure Windows file events are captured comprehensively. Legitimate overhead activities, such as system or application updates, may inadvertently trigger this alert. A companion detection could involve monitoring for unusual access attempts to the SAM database or elevated command executions to enhance coverage.

