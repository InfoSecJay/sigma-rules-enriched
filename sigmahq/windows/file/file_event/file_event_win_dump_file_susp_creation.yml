note: |
  ### Technical Context

  This Sigma rule detects the creation of memory dump files with extensions such as `.dmp`, `.dump`, or `.hdmp` by shell or scripting applications like `cmd.exe`, `PowerShell`, or similar. Attackers may utilize this behavior to deliberately capture memory from running processes or exploit a system vulnerability to exfiltrate sensitive data, such as credentials or tokens. This aligns with the MITRE ATT&CK tactic for Credential Access (TA-0006) using techniques such as Credential Dumping (T1003).

  The primary telemetry source for this detection is file system event logs, particularly monitoring file creation events on Windows systems. If malicious, the security impact could be severe, leading to unauthorized access to sensitive information or lateral movement within the environment. However, it’s critical to note that this detection does NOT confirm malicious intent on its own, as memory dumps may also be legitimately created by administrative or troubleshooting processes.

  ### Investigation Steps

  - **Check event logs for file creation:** Review Windows Security Event ID 4663 for file creation events, specifically filtering for the `.dmp` or `.hdmp` extensions and processes like `cmd.exe` or `powershell.exe`.

  - **Identify the source process:** Analyze Sysmon Event ID 1 for process creation logs correlated with the file creation time to identify what triggered the dump and confirm if it was a legitimate administrative action.

  - **Look for unusual execution patterns:** Investigate the parent-child process relationships in Sysmon logs to find potentially suspicious command lines or execution origins related to the dump file creation.

  - **Audit legitimate administrative practices:** Assess whether documented administrative scripts or processes require memory dumps, noting that typical administrative actions should be logged and adhere to procedural guidelines to distinguish between benign and anomalous behavior.

  - **Correlate with subsequent behaviors:** Examine for any follow-up actions post dump file creation such as use of tools or scripts that access the created files, indicating a potential malicious intent to exfiltrate or analyze sensitive data.

  ### Prioritization

  This alert carries a medium severity level based on the potential impact of compromised systems through credential access or sensitive data leakage. The likelihood of malicious abuse is significant, especially in advanced persistent threat scenarios, as tools for credential dumping commonly include memory analysis following crash events.

  ### Blind Spots and Assumptions

  Detection may be evaded if the attacker clears or obfuscates logs before generating the dump file. The accuracy of detection relies on properly configured logging for file creation events and the use of Sysmon for capturing process integrity. Legitimate administrative tasks, such as debugging or performance monitoring, could trigger this alert, necessitating careful context evaluation. A related detection to strengthen coverage would be monitoring for executable file activity that indicates post-exploitation behavior, such as remote access or credential access tools.

