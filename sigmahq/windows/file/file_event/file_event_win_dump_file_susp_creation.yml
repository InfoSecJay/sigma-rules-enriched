note: |
  ### Technical Context

  This Sigma rule detects the creation of files with the ".dmp" or ".hdmp" extensions via scripting or shell applications such as PowerShell or cmd.exe. Attackers may create memory dumps as part of information gathering in an attempt to exfiltrate sensitive data, including credentials or system information. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), and the technique is "Abuse Elevation Control Mechanism" (T1548).

  Primary telemetry sources for this detection include Windows file event logs (Event ID 4663) and potentially Sysmon logs (Event ID 11) if Sysmon is deployed. If malicious, these dumps can facilitate further exploitation or credential theft. This detection does NOT confirm malicious intent on its own, as legitimate applications may also create these files during troubleshooting or system error processes.

  ### Investigation Steps

  - **Verify the process creation context:** Check for Event ID 4688 to confirm which process initiated the dump file creation. Look for cmd.exe, PowerShell, or other scripting applications. Legitimate contexts usually involve authorized administrative actions.

  - **Correlate with specific file creations:** Review Security Event ID 4663 for the file creation events, filtering by ".dmp" or ".hdmp" extensions. Identify if these were created in unusual directories, such as user home directories or non-standard system paths, which may indicate malicious activity.

  - **Examine associated processes and parent-child relationships:** Use Sysmon Event ID 5 to review network connections or other files accessed by the same process that created the dump file. Unusual outbound connections or further suspicious file accesses following the dump creation can highlight malicious behavior.

  - **Check for patterns of legitimate activity:** Identify known administrative scripts or applications that may legitimately create memory dump files. Document typical file creation locations and conditions to differentiate between benign and potentially malicious events.

  - **Identify any scheduled tasks or rogue scripts:** Investigate running tasks (Task Scheduler logs or Event ID 4698) that may trigger script executions leading to dump file creations. Look for irregular task schedules or unknown sources initiating these scripts.

  ### Prioritization

  This alert has medium severity due to the potential impact of system compromise and the likelihood of malicious use, particularly in environments handling sensitive data. Memory dumps are often targeted by adversaries for credential extraction and system reconnaissance, making this behavior worth investigating thoroughly.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of necessary logging configurations; ensure that file events are captured consistently. Legitimate administrative actions, such as troubleshooting, may also generate these alerts. Related detections could include monitoring for abnormal PowerShell activity (e.g., suspicious cmdlets or encoded commands) to strengthen coverage against multi-faceted attacks that utilize memory dumps.

