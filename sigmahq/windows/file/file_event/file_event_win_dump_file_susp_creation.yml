note: |
  ### Technical Context
  This rule detects the creation of files with the ".dmp" or ".hdmp" extensions by shell or scripting applications such as `cmd.exe`, `powershell.exe`, `cscript.exe`, and `mshta.exe`. Memory dumps are generally created when a program crashes, capturing the state of the program's memory at that point in time. However, these dumps can contain sensitive information, such as user credentials or system configuration data, making their unauthorized creation a potential threat. Attackers may exploit legitimate software functionality to create memory dumps as part of their exploitation techniques or during the exfiltration of valuable information.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion** (TA0005) and potentially **Credential Access** (TA1203), as attackers may be attempting to retrieve credentials or other sensitive information through these dump files. The primary telemetry sources useful for detecting these events include file event logs, which can provide visibility into files being created by processes and can help correlate which executables are responsible for this behavior.

  ### Investigation Steps
  - **Review File Event Logs**: Analyze the file event logs for instances of newly created ".dmp" or ".hdmp" files. Identify the parent process that initiated the file creation to understand the context and intention behind the action.

  - **Correlate with Process Execution Logs**: Check process execution logs to confirm whether the processes (`cmd.exe`, `powershell.exe`, etc.) were invoked normally or from suspicious locations. Look for unusual command-line arguments that can indicate potential misuse.

  - **Examine Memory Dumps**: If possible, analyze the contents of any generated memory dumps in a controlled environment to determine if sensitive information, such as credentials, is present, suggesting malicious intent.

  - **Investigate Crash Sources**: Look into software crash reports and logs to see why the associated application generated a dump. Confirm whether this behavior is expected due to legitimate crashes or if it points to exploitation by threat actors.

  ### Prioritization
  This alert is considered medium severity due to the potential for sensitive information exposure, which could lead to credential theft or lateral movement within the environment. The likelihood of abuse, especially in environments with critical and sensitive operations, underscores the necessity for timely investigation.

  ### Blind Spots and Assumptions
  There may be detection gaps for legitimate administrative scripts or applications that may create memory dumps as part of their normal functionality, leading to potential false positives. The detection logic assumes that the processes involved in file creation are unauthorized; however, in certain environments, legitimate actions might also trigger this alert. Proper logging configurations for file events and process creation are required to ensure the detection functions as intended.

