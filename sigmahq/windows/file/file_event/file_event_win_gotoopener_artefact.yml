note: |
  ### Technical Context

  This Sigma rule detects the presence of temporary installation artifacts related to GoToAssist, a remote access tool that can be exploited by adversaries for Command and Control (C2) purposes. The likely attacker objective is to establish unauthorized remote access to a compromised system under the guise of legitimate technical support activities. This behavior aligns with the MITRE ATT&CK framework under the tactic **Command and Control** and technique **Application Layer Protocol - T1219.002**.

  The primary telemetry sources include file event logs from Windows systems, specifically targeting paths related to GoToAssist installations in user profile temporary directories. A successful exploitation could lead to unauthorized access, data exfiltration, or further lateral movement. Importantly, the detection of these files does not confirm active exploitation; legitimate uses may also create similar artifacts.

  ### Investigation Steps

  - **Check for GoToAssist file artifacts**: Review file event logs for entries matching `TargetFilename` containing `\AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\`. Examine timestamps and associated user accounts for anomalies.

  - **Identify user account behavior**: Assess the user activity around the time the GoToAssist files were created by reviewing `Security Event ID 4624` (successful logins) to determine if any unusual or unauthorized accounts are involved.

  - **Correlate with remote access activity**: Look for ongoing remote connections to the machine in `Windows Event ID 5140` (file share access) or any active sessions listed in connection logs to determine if GoToAssist is in use for legitimate support.

  - **Verify alerts from application control lists**: Cross-check entries against application whitelisting or blacklisting systems to ensure no unauthorized GoToAssist usage is present; a legitimate operational context may have documented approval for its use.

  - **Assess for additional C2 indicators**: Analyze network traffic logs (e.g., IDS/IPS) for unusual outbound connections on ports commonly used by GoToAssist, which might indicate unauthorized use or modification of user sessions.

  - **Review expected legitimate usage**: Confirm whether known IT support personnel utilized GoToAssist during the flagged period by consulting helpdesk tickets or user communications, as legitimate support activities often generate documentation or workflows outlining access scenarios.

  ### Prioritization

  This alert carries medium severity. While the presence of GoToAssist could indicate potential misuse, its legitimate usage in technical support makes prior context critical for assessment. The affected system's impact relates to its role in the organization and the associated sensitivity of the data it accesses or manages.

  ### Blind Spots and Assumptions

  Detection is limited by the reliance on file creation logs, which can be easily deleted or modified by an adversary to mask activity. Organizations must ensure that file event logging is configured correctly and that volumes are retained adequately for investigation. Benign triggers include legitimate support functions by IT departments when remote access tools are used as part of their workflow. Companion detections, such as monitoring for associated command and control traffic or lateral movement attempts via other tools, would enhance coverage against sophisticated threats.

