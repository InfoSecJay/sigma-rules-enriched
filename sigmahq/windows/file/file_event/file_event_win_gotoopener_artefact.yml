note: |
  ### Technical Context

  This Sigma rule detects the creation of temporary installation artifacts associated with GoToAssist remote support software in specific user directories. An attacker may exploit this software to establish unauthorized remote access and control over compromised systems. The typical goal for the adversary is to maintain persistence and facilitate lateral movement within the network using legitimate tools to avoid detection. This behavior aligns with the MITRE ATT&CK framework's Command and Control tactic (T1219.002). The primary telemetry source for this detection includes Windows file event logs, specifically looking for entries that track the creation of files in the user’s Temp directory. If exploited, this can enable unauthorized access to sensitive systems and data. Notably, this detection alone does not confirm malicious intent or activity without corroborating evidence of compromise or unauthorized access.

  ### Investigation Steps

  - **Check for the presence of the GoToAssist artifacts:** Review Windows file event logs, specifically Event ID 4663, for file creations in `C:\Users\<User>\AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\`. Look for timestamps correlating with the alert.

  - **Identify user activity during the time of file creation:** Cross-reference the times of suspicious file creations with User Activity logs (e.g., Event ID 4624). Look for legitimate user interactions or remote support sessions for context.

  - **Correlate with application whitelisting policies:** Evaluate if GoToAssist is an authorized application in your environment. Generating an exception for legitimate use may indicate benign activity, especially in support environments.

  - **Investigate process execution linked to GoToAssist files:** Search Process Creation logs (Event ID 4688) for any processes spawned from the detected GoToAssist executable with evidence of user interaction or command execution indicative of remote access.

  - **Determine potential exfiltration activities:** Check for recent outbound network connections or data transfer activities (e.g., using Windows Firewall logs or EDR tool outputs) coinciding with the GoToAssist installation, indicating potential data exfiltration.

  ### Prioritization

  This alert requires medium priority due to its indication of potential unauthorized remote access on critical systems. If malicious, it could lead to significant data breaches, especially within sensitive environments. Adversaries often misuse such software to blend in with legitimate traffic, heightening the risk of exploit.

  ### Blind Spots and Assumptions

  The detection may be bypassed if the adversary uses alternative installation paths or other remote access tools not monitored by the current ruleset. It requires complete and correctly configured file event logging to ensure comprehensive coverage. Legitimate technical support activities could trigger similar alerts, necessitating contextual review. Related detections might include anomalous remote access connection logs, which can further validate potential illicit activity linked to remote access tools.

