  ---

  ### Technical Context

  This Sigma rule detects the creation of temporary installation files for GoToAssist in the user's local Temp directory, which may indicate the use of remote access tools for unauthorized access or control. The likely attacker objective is to establish a covert command and control channel, leveraging commonly accepted remote desktop applications to bypass security measures. This behavior aligns with the MITRE ATT&CK technique "Remote Access Software" (T1219.002).

  The primary telemetry sources are Windows file event logs that capture file system changes, specifically focusing on paths leading to temporary installation artifacts. If malicious, the impact can range from unauthorized access to sensitive data disclosure. It is important to note that this detection does NOT confirm malicious intent on its own, as GoToAssist is often used legitimately in enterprise environments.

  ---

  ### Investigation Steps

  - **Check for legitimate usage:** Review user activity to confirm if any support requests were made requiring GoToAssist. Validate logged events for file creation at `C:\Users\<Username>\AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\*`.

  - **Identify file artifacts:** Investigate event logs for Event ID 4656 (Handle opened) and 4663 (File access) related to suspicious file accesses or modifications in the GoToAssist directory, noting Timestamps, Usernames, and Actions taken.

  - **Correlate with remote access events:** Search for other remote access tool events within the same timeframe, particularly related to known remote access applications (e.g., TeamViewer, VNC) via Event IDs 4688 (Process Creation) to identify if other remote sessions coincide with the GoToAssist file creation.

  - **Review for irregular patterns:** Look for multiple instances of the GoToAssist tool being initiated in a short period or abnormal user logon patterns (Event ID 4624) suggesting unauthorized access, specifically under unexpected user accounts.

  - **Assess asset criticality:** If the affected system is deemed critical (e.g., data servers, admin workstations), escalate the investigation promptly. High-value assets are often primary targets for unauthorized remote access.

  - **Document user communications:** Check for any emails or ticketing system notifications that could provide context around the use of GoToAssist, clarifying if it was authorized administrative activity or indicative of a potentially disguised compromise.

  ---

  ### Prioritization

  This alert has medium severity due to the possibility of a compromised remote access tool being utilized within the enterprise. The risk is heightened based on the asset's criticality and if there are signs of unauthorized access, which could lead to significant data breaches or escalation of privileges.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate use cases of GoToAssist, where users frequently summon support. Relaying this alert will require accurate logging for the relevant applications and their respective file accesses. Benign usage could easily trigger the alert—particularly in environments where support tools are regularly employed. A companion detection to consider is monitoring for subsequent created processes (e.g., Event ID 4688) that reference remote access tools, as they help confirm the context of the alert.

