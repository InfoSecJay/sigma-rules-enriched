note: |
  ### Technical Context
  This rule detects the presence of artifacts related to the installation of GoToAssist, a remote access tool that adversaries may abuse to establish a command and control (C2) channel. Since GoToAssist and similar applications (e.g., TeamViewer, LogMeIn) are often permitted within enterprise environments, this detection is critical in identifying potential misuse. Attackers may leverage such tools to gain unauthorized access to systems, conduct espionage, or enable lateral movement within the network.

  The likely scenario involves an attacker using legitimate remote access software to interact with compromised systems undetected. The interplay of these tools makes the detection of their installation and execution vital for maintaining the integrity of enterprise networks. This relates to the MITRE ATT&CK techniques T1219 (Remote Access Software), specifically T1219.002, which focuses on the abuse of desktop support and remote access software. The primary data source for this detection strategy will include file event logs that can provide insights into the installation and operational footprint of these tools.

  ### Investigation Steps
  - **Collect File Event Logs:** Review the file event logs for any instances of the target filename associated with GoToAssist installations in the specified directory (`C:\Users\<User>\AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\`). Identify any unusual timestamps or execution patterns.

  - **Analyze Application Usage:** Look into the usage logs of remote access tools within the environment. Check for access requests that deviate from normal operational patterns, such as unexpected initiations by non-administrative users or during off-hours.

  - **Review Network Traffic:** Examine network traffic logs for connections to known GoToAssist IP addresses. Analyze the origins of these connections to determine if they align with legitimate use cases within the organization.

  - **Investigate User Behavior:** Inspect user account activity to see if there were any unauthorized or unusual attempts to access sensitive systems using remote support tools. Look for changes in privilege levels or access patterns that could indicate potential misuse.

  ### Prioritization
  The severity of this alert is classified as medium due to the potential risk posed by unauthorized remote access within the enterprise. While the legitimate use of such tools is common, the likelihood of exploitation by adversaries to access sensitive data or systems necessitates prompt investigation and response.

  ### Blind Spots and Assumptions
  Current detection coverage may miss instances where remote access tools are installed in less common directories or through alternative methods not captured by the specified log source. The detection logic assumes that the installation of the GoToAssist software is indicative of malicious activity; however, legitimate administrative uses may lead to false positives. Proper log configurations, encompassing detailed file event logs, are essential for this alert to function effectively, along with ensuring that monitoring policies include potentially unauthorized installations of remote access tools.

