title: Suspicious File Write to SharePoint Layouts Directory
id: 1f0489be-b496-4ddf-b3a9-5900f2044e9c
status: experimental
description: |
  Detects suspicious file writes to SharePoint layouts directory which could indicate webshell activity or post-exploitation.
  This behavior has been observed in the exploitation of SharePoint vulnerabilities such as CVE-2025-49704, CVE-2025-49706 or CVE-2025-53770.
references:
- https://unit42.paloaltonetworks.com/microsoft-sharepoint-cve-2025-49704-cve-2025-49706-cve-2025-53770/
- https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-24
tags:
- attack.initial-access
- attack.t1190
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\w3wp.exe'
    TargetFilename|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\Web Server Extensions\'
    - 'C:\Program Files (x86)\Common Files\Microsoft Shared\Web Server Extensions\'
    TargetFilename|contains:
    - '\15\TEMPLATE\LAYOUTS\'
    - '\16\TEMPLATE\LAYOUTS\'
    TargetFilename|endswith:
    - '.asax'
    - '.ascx'
    - '.ashx'
    - '.asmx'
    - '.asp'
    - '.aspx'
    - '.bat'
    - '.cmd'
    - '.cer'
    - '.config'
    - '.hta'
    - '.js'
    - '.jsp'
    - '.jspx'
    - '.php'
    - '.ps1'
    - '.vbs'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects suspicious file write activities targeting the SharePoint layouts directory, which could indicate potential web shell installations or post-exploitation activities by attackers. The SharePoint layouts directory is a critical aspect of SharePoint that may be leveraged by threat actors to execute malicious scripts or manage unauthorized access to the server. Attackers often exploit vulnerabilities in SharePoint, like CVE-2025-49704, CVE-2025-49706, or CVE-2025-53770, providing them a pathway to perform these malicious actions.

  The relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) through exploitation of software vulnerabilities (T1190), which allows attackers to gain a foothold within the environment. Additionally, the techniques for **Persistence** (TA0003) and *Web Shell* (T1505.003) highlight the potential for web shells being written to persist in the environment. The primary data sources for detecting this activity are Windows file event logs, which will capture the file write actions to critical directories such as SharePoint's layouts directory.

  ### Investigation Steps
  - **Review File Write Events:** Investigate the Windows file event logs for writes to the SharePoint layouts directory. Focus on events logged by processes like `cmd.exe`, `powershell.exe`, and `w3wp.exe`.
  - **Correlate with User Accounts:** Analyze user account activity associated with the file writes. Look for unusual or unauthorized user accounts that may suggest intrusion attempts or compromised credentials.
  - **Examine Process Execution:** Look into the parent-child process relationships in process creation logs to identify if suspicious scripts or commands preceded the file write events, indicating post-exploitation activity.
  - **Analyze SharePoint Access Logs:** Check SharePoint access logs for any unauthorized attempts to access the layouts directory, which could provide context for the file write activity.

  ### Prioritization
  This alert has a high severity level due to the potential impact of malicious file writes in SharePoint. They can lead to unauthorized data access, system compromise, and significant reputational damage if exploited effectively by an attacker.

  ### Blind Spots and Assumptions
  One limitation in detection coverage is the reliance on specific file name patterns and directory paths; attackers may alter their techniques to evade detection, potentially not matching these alerts. The detection logic assumes that appropriate logging levels are configured within the Windows environment to capture detailed file activity in real-time. Additionally, if file auditing is disabled for the SharePoint directories, the necessary log data will be absent, preventing accurate detection of this suspicious activity.

