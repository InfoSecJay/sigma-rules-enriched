title: Suspicious File Write to SharePoint Layouts Directory
id: 1f0489be-b496-4ddf-b3a9-5900f2044e9c
status: experimental
description: |
  Detects suspicious file writes to SharePoint layouts directory which could indicate webshell activity or post-exploitation.
  This behavior has been observed in the exploitation of SharePoint vulnerabilities such as CVE-2025-49704, CVE-2025-49706 or CVE-2025-53770.
references:
- https://unit42.paloaltonetworks.com/microsoft-sharepoint-cve-2025-49704-cve-2025-49706-cve-2025-53770/
- https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-24
tags:
- attack.initial-access
- attack.t1190
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell_ise.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\w3wp.exe'
    TargetFilename|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\Web Server Extensions\'
    - 'C:\Program Files (x86)\Common Files\Microsoft Shared\Web Server Extensions\'
    TargetFilename|contains:
    - '\15\TEMPLATE\LAYOUTS\'
    - '\16\TEMPLATE\LAYOUTS\'
    TargetFilename|endswith:
    - '.asax'
    - '.ascx'
    - '.ashx'
    - '.asmx'
    - '.asp'
    - '.aspx'
    - '.bat'
    - '.cmd'
    - '.cer'
    - '.config'
    - '.hta'
    - '.js'
    - '.jsp'
    - '.jspx'
    - '.php'
    - '.ps1'
    - '.vbs'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of potentially malicious files in SharePoint's layouts directory, specifically targeting webshell file types such as `.aspx`, `.php`, and `.ps1`. The likely attacker objective is to establish persistence or remote command execution capabilities post-exploitation, often leveraging known vulnerabilities within SharePoint as outlined in the references (e.g., CVE-2025-49704). This behavior correlates with the MITRE ATT&CK tactic for Initial Access (T1190) and Persistence (T1505.003).

  The primary telemetry source is Windows file event logs, particularly concerning processes associated with PowerShell (e.g., `powershell.exe`, `cmd.exe`, `w3wp.exe`). If malicious, these actions could lead to severe data breaches or system takeovers. Importantly, this detection does NOT confirm that an attack has occurred; further context and analysis are required to ascertain intent.

  ### Investigation Steps

  - **Identify the Process Initiator**: Check the Parent Process ID (PID) associated with the detected file write. Look for processes such as `w3wp.exe` (IIS Worker Process) or `powershell.exe` (Event ID 4688 or Sysmon Event ID 1) that indicate potential exploitation. A legitimate `w3wp.exe` action should only write expected web files.

  - **Review File Details**: Examine the `TargetFilename` for suspicious extensions (e.g., `.php`, `.aspx`) in directory paths like `C:\Program Files\Common Files\Microsoft Shared\Web Server Extensions\15\TEMPLATE\LAYOUTS\`. Legitimate files typically include standard SharePoint layouts without unusual extensions.

  - **Cross-reference Event Log Context**: Investigate recent security events (e.g., Event IDs 4624/4625 for logon attempts) that may show related access patterns, including unsuccessful logins or access from unknown accounts, suggesting potential reconnaissance prior to file modification.

  - **Check File Metadata**: Inspect the creation timestamps and modification history for the suspicious file. Files created outside of normal operational hours or with invalid user privileges (e.g., `SYSTEM` instead of normal user) can serve as high-confidence indicators of malicious activity.

  - **Validate Network Connections**: Correlate with firewall or proxy logs (e.g., from a network device) for unusual outgoing connections from the affected server to external IPs, especially networks known for hosting command-and-control (C2) servers. Malicious webshells often initiate outbound connections to communicate with attackers.

  - **Monitor User Activity**: Review user account behaviors for abnormal file accesses (with Event IDs 4663 or 5145 for file access events) that could indicate data exfiltration attempts linked to the identified file modification.

  ### Prioritization

  This alert is of **high severity** due to the critical nature of SharePoint within the enterprise, where exploited vulnerabilities can lead to significant data loss, operational disruption, or broader network compromise. The likelihood of malicious abuse is elevated, especially given the weaponization of known SharePoint vulnerabilities.

  ### Blind Spots and Assumptions

  This detection may be evaded through file obfuscation or altered process names that don't match the specified criteria. Reliable detection requires fully enabled Windows file auditing and appropriate logging configurations for PowerShell and IIS. Legitimate administrative activities may also trigger this alert when updating site templates. Companion detections for unauthorized changes in SharePoint site's permissions could complement this rule for more robust coverage.

