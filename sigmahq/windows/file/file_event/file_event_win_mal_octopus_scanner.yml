note: |
  ### Technical Context
  This rule detects the presence of Octopus Scanner Malware, which is primarily used to exploit vulnerabilities within software supply chains. The malware seeks to identify sensitive information that may be leaked through application caches and database files. Attackers leveraging this type of malware often aim to gain unauthorized access to systems, exfiltrate confidential data, and potentially facilitate further lateral movement within the network.

  The relevant MITRE ATT&CK tactics and techniques involved in this scenario include **Initial Access (TA0001)**, specifically **Supply Chain Compromise (T1195)** and **Supply Chain Compromise - Targeting Third-Party Software (T1195.001)**. Analysts should be particularly vigilant for suspicious file activity in user profile directories, as this often indicates malicious intent, especially in environments where sensitive applications are in use.

  Primary data sources that contain the best evidence for detecting Octopus Scanner Malware include Windows file event logs, which can help identify unusual file access patterns or the creation of caches and databases linked to malicious activity.

  ### Investigation Steps
  - **Review File Events:** Check Windows file event logs for access to files ending with `Cache134.dat` or `ExplorerSync.db`, which are commonly targeted by the Octopus Scanner Malware.
  - **Analyze User Activity:** Investigate the context around the user sessions that modified or accessed these files to determine if any anomalous behaviors are present, such as unusual login times or locations.
  - **Correlate with Network Activity:** Examine EDR logs for any associated network activity that may indicate a command and control communication or data exfiltration attempts related to the detected files.
  - **Inspect for Known Indicators of Compromise:** Check for known threat indicators associated with Octopus Scanner or similar malware, including suspicious registry modifications or process creation linked to these files.

  ### Prioritization
  The severity of this alert is high due to the potential impact of supply chain compromise malware in an enterprise environment. Given the likelihood of data theft and subsequent exploitation, timely detection is crucial to mitigating risks.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage regarding custom malware variants that may not utilize the same file names or paths identified by this rule. This detection logic assumes that the malware will exhibit typical file access patterns associated with Octopus Scanner. Additionally, it requires logging of file events in Windows to function effectively, making it necessary to ensure that file auditing is enabled throughout the enterprise.

