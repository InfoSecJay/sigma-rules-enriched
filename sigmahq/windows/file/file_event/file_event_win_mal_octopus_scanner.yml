  ### Technical Context

  This Sigma rule detects the creation of files specific to the Octopus Scanner malware, particularly targeting `Cache134.dat` and `ExplorerSync.db` locations. The typical objective of such malware is to conduct reconnaissance and potentially facilitate subsequent attacks within an organization by leveraging misconfigurations and vulnerabilities. The relevant MITRE ATT&CK tactics include Initial Access (T1078 - Valid Accounts) and Supply Chain Compromise (T1195).

  The primary telemetry source for this detection is Windows file events, specifically monitoring for new file creations or modifications in the user profile's AppData directory. If confirmed malicious, the presence of these files indicates a probable attempt to scout the environment or retrieve sensitive information. However, this detection does NOT confirm the presence of other malware or malicious activity without further corroborative evidence.

  ### Investigation Steps

  - **Verify file creation locations:** Check for file creation in `C:\Users\<Username>\AppData\Local\Microsoft\`. Look for `Cache134.dat` and `ExplorerSync.db`. Legitimate applications do not typically create these files in this context; their presence is suspicious.

  - **Inspect file attributes:** Examine file properties, including timestamps and file signatures. Malicious files may exhibit unusual creation or modification timestamps aligned with user inactivity.

  - **Cross-reference user activity:** Identify the user associated with the file creations. Use Security Event ID 4624 (Logon) to determine whether the user was actively logged in during the timeframe of file creation, which may indicate benign behavior.

  - **Check for additional indicators:** Investigate other common artifacts or behaviors associated with Octopus Scanner, such as outbound connections to suspicious IP addresses or domain names from the device's network activity. Look at DNS query logs for known bad domains.

  - **Document recent software installations:** Review software installation logs (Event ID 1034 from Windows Installer logs) for relevant timing. Unfamiliar or unauthorized applications may correlate with the file being created.

  ### Prioritization

  This alert should be treated as high severity given the potential compromise of systems and sensitive data. The presence of Octopus Scanner indicates a strong likelihood of malicious intent, as these files are not associated with legitimate applications. The risk of exploitation through this malware is significant, especially in environments dependent on third-party software.

  ### Blind Spots and Assumptions

  There may be evasion techniques such as obfuscation or spoofing legitimate files that can complicate detection. The effectiveness of this detection relies on the capture of Windows file event logs, which should be configured to monitor user profile directories continuously. Legitimate applications may sometimes interact with these files, so context is essential. A companion detection could include monitoring for unusual outbound network connections or unexpected processes that could indicate further malicious activity related to this malware.

