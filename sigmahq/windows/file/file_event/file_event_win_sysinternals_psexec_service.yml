  ---

  ### Technical Context

  This rule detects the creation of a service file associated with PsExec, specifically targeting the filename `PSEXESVC.exe`. PsExec is a tool often used by administrators for remote execution but is also favored by adversaries to deploy malware or execute commands on remote systems without user interaction. The likely objective of an attacker utilizing PsExec is to establish persistence or to execute payloads remotely.

  This behavior maps to the MITRE ATT&CK tactic of Execution, specifically Technique T1569.002 (Service Execution). Primary telemetry sources include Windows file event logs, particularly monitoring file creation events. If the activity is malicious, it could enable unauthorized remote control of affected systems, leading to broader network compromise. However, the detection of this file creation does not confirm that malicious activity occurred on its own; legitimate administrative use cases for PsExec also exist.

  ---

  ### Investigation Steps

  - **Check for recent service creation:** Review Windows Event ID 7045 logged during service creation to identify when `PSEXESVC.exe` was installed and by which user. Compare timestamp with other suspicious activities.

  - **Analyze process execution logs:** Validate if there are related process creation events (Security Event ID 4688 and/or Sysmon Event ID 1) showing `PSEXESVC.exe` being executed. Legitimate processes will typically be invoked by known and authorized administrators.

  - **Identify parent process:** For `PSEXESVC.exe`, check its parent process in the logs to determine the source of initiation. A parent process such as `cmd.exe` or `powershell.exe` initiated by unusual users can indicate malicious use.

  - **Correlate network activity:** Inspect firewall logs for unexpected outbound traffic to external IP addresses immediately following the file creation. This could indicate potential data exfiltration or command and control communication.

  - **Audit installed services:** Utilize `Get-Service` command to list all services on the host. Confirm that `PSEXESVC` is among the expected services for administrative tools and not part of a broader compromise.

  - **Review related alerts:** Examine presence of companion detections related to remote execution tools or unauthorized file modification events. Alerts such as suspicious PowerShell execution may indicate coordinated activity.

  ---

  ### Prioritization

  This alert is of low severity given the common use of PsExec in administrative tasks. However, the impact of any unauthorized execution on critical systems can be significant, and its frequent utilization by malicious actors for lateral movement raises concern. It's essential to investigate to discern legitimate from potentially harmful usage.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the fact that legitimate administrative use can trigger this alert, leading to false positives. Ensure all Windows event logs are appropriately configured to capture service creation events. Be aware that well-configured adversaries may alter PsExec or use different filenames to evade detection. Companion detections, such as alerts for unusual user behavior or process tree analysis, can strengthen overall monitoring capabilities and provide better context for this detection.

