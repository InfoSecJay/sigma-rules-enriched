note: |
  ### Technical Context

  This rule detects the creation of the PsExec service file, specifically targeting the default filename `PSEXESVC.exe`. The presence of this file is indicative of an executable running with higher privileges, often used by attackers to achieve remote execution or lateral movement within the network. This behavior fits within the MITRE ATT&CK framework under the technique "Remote Services: PsExec" (T1569.002).

  Primary telemetry sources for this detection include file event logs from Windows systems. If this detection turns out to be malicious, it poses significant security risks, as it suggests that an attacker may have utilized PsExec to establish a foothold on the network or execute commands remotely. It is critical to note that the detection of this file's creation does not confirm that a malicious action took place, as legitimate administrative use of PsExec exists.

  ### Investigation Steps

  - **Check file creation details:** Review Windows Security Event ID 4663 for access to `C:\Windows\PsExec.exe` or Sysmon Event ID 11 for the creation of `C:\Windows\System32\PSEXESVC.exe`. Look for timestamps and user accounts associated with creation; suspicious accounts or unexpected timestamps suggest malicious use.

  - **Correlate with other processes:** Investigate the parent process that triggered the file creation using Sysmon Event ID 1. A parent process such as `cmd.exe` or `powershell.exe` from a non-administrative user context can indicate possible malicious intent.

  - **Examine execution context:** Validate the context in which the PsExec service is utilized using Security Event ID 4688 (Process Creation). Expect the user account running PsExec to be a system administrator. Any execution by low-privileged accounts may signify misuse.

  - **Review service status:** Use PowerShell to query the installed service (`Get-Service PSEXESVC`) for its status. A running service with an unexpected user or operational context should raise an alarm.

  - **Contextualize behavior with known good:** Compare identified file creation activities against documented organizational use cases for PsExec. Many IT environments deploy this tool for legitimate use; thus, confirming it aligns with known administrative tasks mitigates risk.

  ### Prioritization

  The alert severity is low in a mature enterprise SOC context. While the compromised system can have critical implications, the likelihood of malicious abuse heavily depends on the user account executing the PsExec file. This behavior is not inherently malicious as it is commonly used in administrative tasks, but it can be weaponized by threat actors.

  ### Blind Spots and Assumptions

  The detection may miss instances where an attacker modifies the PsExec filename or brushes over alternate execution methods. Ensuring consistent logging configuration is critical for accurate detection, especially file access logs. Legitimate IT usage by system administrators may trigger this alert, requiring careful distinction from malicious behavior. A related detection, such as monitoring for unusual process creation from typically admin-only accounts (Event ID 4688), can strengthen overall detection coverage.

