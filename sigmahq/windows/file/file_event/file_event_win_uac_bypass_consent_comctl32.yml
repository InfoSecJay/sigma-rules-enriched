  ---

  ### Technical Context

  This rule detects the use of User Account Control (UAC) bypass methods via `consent.exe` and `comctl32.dll`, indicating an attempt to escalate privileges and execute processes with higher permissions than those granted to the original user. Attackers may aim to gain control over critical system resources, enabling them to deploy malware, manipulate system configurations, or exfiltrate data.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** and the technique is **UAC Bypass (T1548.002)**. The primary telemetry sources include Windows file event logs, particularly focusing on file modification events. If this behavior is malicious, it can lead to unauthorized access and compromise the integrity and confidentiality of systems.

  This detection does NOT confirm that the action is malicious on its own, as benign processes may trigger the same file accesses under certain circumstances.

  ---

  ### Investigation Steps

  - **Verify the file creation event:** Check for Event ID 4663 in the Security logs for any modifications to `C:\Windows\System32\consent.exe.@` and `comctl32.dll` alongside their parent process IDs to ensure it’s not a normal system operation.

  - **Assess the execution context:** Look for Sysmon Event ID 1 to verify if the process invocation is being initiated by a legitimate user process or from automated scripts/tools, which may indicate potential abuse.

  - **Review command-line parameters:** Inspect any command-line arguments associated with the creation of `consent.exe` in Event ID 4688. Legitimate usage should show expected parameters, whereas suspicious or obfuscated arguments may indicate malicious intent.

  - **Look for unusual parent processes:** Determine the parent process of `consent.exe` using Sysmon Event ID 1. Common benign parent processes include `explorer.exe`, with any other parent process potentially warranting further scrutiny.

  - **Validate file permissions:** Check file permissions on the involved files using the `icacls` command or via PowerShell. Legitimate modifications should align with system administrator activities, while unusual permissions indicating unauthorized access should raise red flags.

  ---

  ### Prioritization

  This alert has high severity due to the potential for privilege escalation, which directly impacts critical systems and can lead to lateral movement in the network. The likelihood of exploitation is significant, as UAC bypass techniques are commonly weaponized in attacks targeting Windows environments.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of file event logs if logging configurations are inadequate. Legitimate activities, such as software updates or administrative tool usage, might also trigger the alert. A related detection to strengthen coverage would be monitoring access to `C:\Windows\System32\` for any unusual or unauthorized file operations.

