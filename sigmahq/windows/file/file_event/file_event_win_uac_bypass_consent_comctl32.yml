  ---

  ### Technical Context

  This Sigma rule detects the unauthorized use of `consent.exe`, a Windows User Account Control (UAC) component, in combination with `comctl32.dll`, indicating an attempt to bypass UAC and escalate privileges. The likely attacker objective is to execute malicious code with elevated permissions, potentially leading to a full compromise of the system. This behavior is relevant to the MITRE ATT&CK tactic of **Defense Evasion** (ID: T1548.002) as well as **Privilege Escalation**.

  The primary telemetry source is Windows file event logs that can capture file manipulation activities. Required log types include security event logs (Event ID 4663 for file access) or Sysmon log events (Event ID 10 for file create events). If successful, this tactic can lead to significant security impacts, including unauthorized access and control over sensitive systems. It is crucial to note that this detection does NOT confirm an attack on its own; further investigation is required to determine intent and impact.

  ---

  ### Investigation Steps

  - **Review file access logs for `consent.exe` usage:** Check for Event ID 4663 in Windows Security logs, focusing on TargetFilename attributes that start with `C:\Windows\System32\consent.exe.@` and end with `\comctl32.dll`. Malicious indications include unusual access times or unknown user accounts accessing these files.

  - **Analyze process creation events:** Examine Sysmon Event ID 1 for process creation involving `consent.exe`. Look for any command-line arguments that could indicate misuse, such as unexpected parameters or a parent process that does not belong to known, benign applications.

  - **Identify legitimate usage patterns:** Confirm baseline behavior by referencing normal application installations or updates that may legitimately invoke UAC. Typically, known admin tools will interact with `consent.exe` legitimately, exhibiting typical user behavior patterns.

  - **Investigate related network activity:** Use network telemetry, such as firewall logs or EDR investigation tools, to check for outbound connections created by processes calling `consent.exe`. Look for suspicious IP addresses or domains that align with known malicious activity.

  - **Conduct file integrity checks:** Validate file hashes for `comctl32.dll` and `consent.exe` using a tool like Windows Defender or Sysinternals' sigcheck. Any mismatches with known good hash values could indicate tampering or malicious alterations.

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems, especially if it involves administrative or sensitive operational accounts. The likelihood of misuse is considerable given the ease of executing privilege escalation techniques. Additionally, UAC bypass techniques are frequently weaponized in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the proper configuration of Windows auditing logs; without the necessary logging enabled, these activities could go unnoticed. Legitimate software installations or updates that necessitate elevated privileges may trigger similar alerts, thus requiring careful contextual analysis. A related detection might include alerts on file modifications to `C:\Windows\System32\` that could help assess broader system integrity.

