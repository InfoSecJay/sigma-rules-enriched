note: |
  ### Technical Context

  This rule detects a UAC bypass technique that uses `consent.exe`, specifically targeting `comctl32.dll`. The likely objective of an attacker utilizing this method is to escalate privileges without user consent, thereby gaining elevated rights for malicious actions. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation, technique T1548.002 (Bypass User Account Control).

  Primary telemetry sources include Windows file event logs monitoring access patterns and modifications to the specified system files. The security impact if malicious could be significant, enabling unauthorized actions on a host, including installation of malware or data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own; it indicates a suspicious file access pattern that requires further investigation.

  ### Investigation Steps

  - **Review file access logs:** Check Windows file event logs (Event ID 4663) for direct access to `C:\Windows\System32\consent.exe` and `comctl32.dll`. Look for unusual access times or processes associated with the access.

  - **Identify parent processes:** Utilize Sysmon Event ID 1 to check the process creation timeline. Correlate the parent process of `consent.exe` – look for known benign applications (e.g., system processes) versus potentially malicious processes.

  - **Check for associated network activity:** Examine network logs for any outbound connections from the host to suspicious domains or IP addresses around the time of the UAC bypass attempt. Look for unusual HTTP or DNS requests in the logs.

  - **Assess legitimate usage:** Determine if legitimate applications or scripts could have called `consent.exe` in this manner. Consider known software installations or updates that may necessitate elevated permissions.

  - **Review recent changes to system files:** Investigate the Windows Event Log for changes to system files (Event ID 4660) prior to the alert. Legitimate software updates can trigger this, but also consider discrepancies with known whitelisted applications.

  - **Examine user activity around the event:** Review user activity (e.g., logon sessions, command line usage) in Active Directory logs and Event ID 4624 to correlate if any administrative account is implicated in the bypass action.

  ### Prioritization

  This alert carries a high severity due to the potential impact of privilege escalation on critical systems. The likelihood of this behavior being exploited by adversaries is significant, as UAC bypass techniques are often weaponized in attacks. Any detection of this pattern necessitates immediate analysis and potential containment.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative operations that might trigger this rule, especially during maintenance or scheduled updates. Required log sources for reliable detection include consistent monitoring of file event logs and Sysmon logs to ensure comprehensive coverage. Additionally, an associated detection for unusual process injections or privilege escalation attempts using tools like Mimikatz would enhance coverage against similar tactics.

