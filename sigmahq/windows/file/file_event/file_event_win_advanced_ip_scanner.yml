  ---

  ### Technical Context

  This Sigma rule detects the execution of the Advanced IP Scanner tool, which is frequently used by attackers for network reconnaissance. The likely attacker objective is to identify active devices and assess their vulnerabilities in preparation for further attacks, such as ransomware deployment. This behavior aligns with the MITRE ATT&CK framework under the tactic "Discovery" and technique "Network Service Scanning" (T1046).

  Primary telemetry sources include Windows file event logs, specifically looking for file creation or access in the path indicative of Advanced IP Scanner's installation. If used maliciously, this activity can lead to further compromises within the network. However, it is important to note that the detection of this tool does NOT confirm malicious activity on its own; it requires context and corroborating evidence.

  ---

  ### Investigation Steps

  - **Check file events**: Review Windows Security Event Logs (Event IDs 4663, 4660) for accesses to `C:\Users\<User>\AppData\Local\Temp\Advanced IP Scanner 2\*` to see if the tool is being used, and identify the user context.

  - **Identify the execution context**: Determine the process creation events related to this file in Sysmon Event ID 1, focusing on ParentProcessName and CommandLine parameters for suspicious execution patterns.

  - **Conduct process lineage trace**: Use Sysmon Event ID 5 (ProcessTerminate) to examine the lifecycle of the Advanced IP Scanner process for any unusual parent-child relationships indicating potential evasion or chaining with malicious software.

  - **Baseline legitimate usage**: Compare this alert against typical administrative tasks in your environment, noting that legitimate administrators may access similar tools under controlled circumstances, which should not trigger alerts if used normally.

  - **Check for network activity**: Verify network logs (such as firewall or IDS logs) for any scans initiated by the Advanced IP Scanner tool, looking for patterns consistent with data exfiltration or unauthorized probing of internal services.

  - **Correlate with threat intelligence**: Cross-reference detected usage with reports or indicators from sources such as the FBI or various threat research articles regarding known ransomware tools to assess possible threat actor tactics.

  ---

  ### Prioritization

  This alert has a medium severity due to its potential to indicate reconnaissance activities, which are often a precursor to more harmful actions like ransomware deployment. The affected system's role in the network can increase the likelihood of malicious use, especially in sensitive environments.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions triggering the alert, requiring careful context evaluation. Ensuring detailed logging for user and application behavior is essential for reliable detection. Additionally, similar network scanning tools may produce false positives; hence, companion detections for other reconnaissance tools should be deployed for enhanced visibility and better correlation of potential threats.

