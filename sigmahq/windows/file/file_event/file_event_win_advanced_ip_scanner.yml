  ---

  ### Technical Context

  This rule detects the execution of Advanced IP Scanner, a legitimate network scanning tool that can be misused by attackers, particularly in the context of reconnaissance or preparation for further malicious actions. The likely attacker objective is to identify hosts and services in a network, which could assist in targeting systems for lateral movement or exploitation, aligning with the MITRE ATT&CK tactic of Discovery (TA0007) and technique of Network Sniffing (T1046).

  The primary telemetry source comes from Windows file event logs that capture actions related to file creation and modification. If Advanced IP Scanner is executed maliciously, it may facilitate compromise by revealing vulnerable systems or services. Importantly, this detection does not confirm malicious intent on its own, as Advanced IP Scanner may be used legitimately for network management.

  ---

  ### Investigation Steps

  - **Verify executing user context**: Check the `SubjectUserName` field in Security Event ID 4688 or Sysmon Event ID 1 to determine who launched Advanced IP Scanner. Confirm whether this user has a legitimate reason to utilize such tools (e.g., IT or network admin role).

  - **Analyze the target file path**: Look for file creation events in the file logs specifically targeting `C:\Users\<Username>\AppData\Local\Temp\Advanced IP Scanner 2`. Unusual access patterns from non-admin users might indicate potential malware use.

  - **Check for processes spawned**: Review Sysmon Event ID 1 for parent-child process relationships to confirm if Advanced IP Scanner was initiated by a known benign process, such as `cmd.exe` or `powershell.exe`. Execution from suspicious or unexpected parents (e.g., `explorer.exe` unrelated to user actions) is a red flag.

  - **Correlate with known malicious indicators**: Search for related activity logs and alerts referencing the execution of other known malware or reconnaissance tools. Look for connections or IP addresses in `netstat` or firewall logs that correlate with scanning activities.

  - **Identify patterns of execution frequency**: Analyze how often Advanced IP Scanner is running—frequent executions, especially from non-IT staff, could signify an intruder's presence. Capture timestamps and assess against baseline usage metrics for anomalies.

  - **Validate file behavior and artifacts**: Look for the creation of logs or temporary files at `C:\Users\<Username>\AppData\Local\Temp\` that correspond to Advanced IP Scanner. Malicious iterations may attempt to delete or obscure these artifacts as part of their evasion tactics.

  ---

  ### Prioritization

  This alert should be considered medium severity since it could indicate preparatory steps taken by potential adversaries within the network environment. The likelihood of malicious use is credible given the tool's association with ransomware groups and the common occurrence of such scans in pre-attack phases.

  ---

  ### Blind Spots and Assumptions

  There is a potential for legitimate administrative activities to trigger this alert, particularly among proactive network management teams. Detection limitations include the possibility of users employed in legitimate roles using the tool; hence, further verification is necessary. Additionally, if logs are not adequately configured to capture file activities, detection may fail. A related detection to consider is monitoring for network reconnaissance activities through unsolicited network scans that may complement the analysis of identified behavior from the Advanced IP Scanner executions.

