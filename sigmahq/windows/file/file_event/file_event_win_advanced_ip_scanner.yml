note: |
  ### Technical Context
  This detection rule identifies the use of Advanced IP Scanner, a network scanning tool that is often employed by threat actors, particularly in ransomware operations. The existence of this tool's process on endpoints may indicate a pre-attack recon stage, where an attacker is mapping a target's network environment to identify vulnerable systems for exploitation. Advanced IP Scanner enables users to discover devices on a network, assess their IP and MAC addresses, and gather information about open ports and services, potentially paving the way for deeper infiltration.

  The relevant MITRE ATT&CK tactics and techniques associated with this rule include:
  - **Discovery (TA0007)**: This tactic involves methods that adversaries use to gather information about the target environment.
  - **Network Service Scanning (T1046)**: This technique signifies a scanning activity aiming to identify services on machines in the network, which is critical for the attackers planning ransomware deployment or lateral movement.

  Primary data sources for this detection include Windows file event logs, which can provide insights into process execution. Monitoring events related to file creation or modification actions in directories such as `\AppData\Local\Temp` can yield valuable evidence of Advanced IP Scanner's usage.

  ### Investigation Steps
  - **Review File Event Logs**: Examine the Windows file event logs for any occurrences of files related to ‘Advanced IP Scanner’ being executed. Focus on timestamps correlating with abnormal activities.

  - **Analyze Process Creation Events**: Check the process creation events linked to Advanced IP Scanner in the system logs. Look for unusual parent-child process relationships that might indicate malicious use.

  - **Investigate Network Activity**: Correlate any file activity with network traffic logs. Analyze connections to unknown or unexpected external IP addresses that might have been scanned using Advanced IP Scanner.

  - **Conduct a Tool Inventory Review**: Confirm if Advanced IP Scanner is a tool that is authorized for use within your organization. If it is not documented, treat this finding as suspicious and escalate for further investigation.

  ### Prioritization
  The alert generated by this rule is considered medium severity because the use of Advanced IP Scanner may indicate the initial phase of a potential ransomware attack. Given that this tool is associated with malicious activities, timely investigation is crucial to determine the legitimacy and intent of its usage.

  ### Blind Spots and Assumptions
  This detection logic assumes that file events related to Advanced IP Scanner will be logged successfully within the Windows file event system. There may be gaps in detection if logging is not appropriately configured or if the tool is executed from a location not covered by the current logging policies, such as portable or unauthorized execution environments. Additionally, false positives may arise from legitimate administrative use that the detection logic does not account for, necessitating careful analysis to differentiate between benign and malicious activity.

