title: Suspicious File Created by ArcSOC.exe
id: e890acee-d488-420e-8f20-d9b19b3c3d43
status: experimental
description: |
  Detects instances where the ArcGIS Server process ArcSOC.exe, which hosts REST services running on an ArcGIS
  server, creates a file with suspicious file type, indicating that it may be an executable, script file,
  or otherwise unusual.
references:
- https://reliaquest.com/blog/threat-spotlight-inside-flax-typhoons-arcgis-compromise/
- https://enterprise.arcgis.com/en/server/12.0/administer/windows/inside-an-arcgis-server-site.htm
author: Micah Babinski
date: 2025-11-25
tags:
- attack.defense-evasion
- attack.command-and-control
- attack.persistence
- attack.initial-access
- attack.t1127
- attack.t1105
- attack.t1133
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith: '\ArcSOC.exe'
    TargetFilename|endswith:
    - '.ahk'
    - '.aspx'
    - '.au3'
    - '.bat'
    - '.cmd'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.js'
    - '.ps1'
    - '.py'
    - '.vbe'
    - '.vbs'
    - '.wsf'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with suspicious extensions by the ArcGIS Server process, ArcSOC.exe. Attackers may exploit this legitimate service to execute malicious scripts or binaries, attempting to persist in the environment or establish command and control. The relevant MITRE ATT&CK techniques are Defense Evasion (T1127), Command and Control (T1105), and Persistence (T1133). The primary telemetry source for this detection is Windows file event logs, which must capture file creation activities related to the ArcSOC.exe process.

  If malicious, the security impact could include data exfiltration, system compromise, or lateral movement. Importantly, this detection does not confirm that the file created is malicious; it only indicates unusual activity that warrants further investigation.

  ### Investigation Steps

  - **Verify the process behavior:** Check for ArcSOC.exe activity via Windows Security Event ID 4688 (Process Creation) and validate that it corresponds to legitimate ArcGIS services by reviewing scheduled tasks or service configurations.

  - **Examine file creation logs:** Review file event logs for Windows where the TargetFilename indicates execution types (e.g., .exe, .bat, .ps1); Event ID 4663 (Access to an Object) could reveal details of the created files.

  - **Identify active scripts or binaries:** Look for high-confidence malicious indicators such as newly created files with suspicious extensions (particularly .exe, .cmd, and .bat) in system or user directories, which should not typically be created by ArcSOC.exe.

  - **Correlate user activity:** Investigate the user account under which ArcSOC.exe is running. Unusual account activity, such as administrative execution during off-hours, can indicate potential compromise.

  - **Document legitimate operational behavior:** Confirm expected file creations in the context of ArcGIS operations, such as automatically generated logs or support scripts. Compare timestamps and types against known usage patterns.

  - **Validate against security policies:** Check for policy compliance and ensure that ArcGIS server processes adhere to organizational standards, mitigating the risk of unwarranted file executions.

  ### Prioritization

  This alert should be considered high severity due to the potential for data exfiltration or system compromise via a legitimate process. The likelihood of malicious abuse is significant as attackers often seek to camouflage their activities within trusted applications. The behavior described is known to be weaponized in various attack campaigns.

  ### Blind Spots and Assumptions

  Detection could be limited by log sources not capturing all file creation activities if Windows auditing is not properly configured. Known evasion techniques include renaming malicious scripts to blend in with legitimate processes. Legitimate activities might include the generation of configuration files or updates by ArcGIS that could trigger this alert. A related detection rule for monitoring ArcGIS service access could enhance overall security oversight and detection coverage.

