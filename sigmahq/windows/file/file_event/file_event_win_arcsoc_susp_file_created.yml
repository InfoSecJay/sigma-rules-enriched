note: |
  ### Technical Context

  This rule detects the creation of files with potentially malicious extensions by the `ArcSOC.exe` process, which hosts REST services for ArcGIS Server. The likely objective of an attacker is to introduce malicious payloads, such as scripts or executables, that can facilitate further compromise or persistent access within the network environment. This behavior aligns with the MITRE ATT&CK techniques of Command and Control (T1071) and Persistence (T1127).

  The primary telemetry sources include Windows event logs related to file events, particularly focusing on log types that document file creation activities. If detected behavior is malicious, it poses significant security risks, including unauthorized code execution, data exfiltration, or lateral movement. It is important to note that this detection does NOT confirm that the file created is definitively malicious; it requires further investigation to establish intent and context.

  ### Investigation Steps

  - **Review Event Logs for File Creation:** Investigate Windows Security Event ID 4663 for `ArcSOC.exe` that indicates file creation with specific target filenames ending in extensions such as `.exe`, `.vbs`, or `.ps1`.

  - **Analyze Process Creation Events:** Check Sysmon Event ID 1 for any process creation involving `ArcSOC.exe`. Look for unusual parent-child relationships indicating unexpected execution patterns.

  - **Correlate with Network Activity:** Examine Network logs for any outbound connections initiated shortly after the file creation, particularly to known command and control IPs or domains. This can indicate malicious behavior.

  - **Identify Legitimate Usage Patterns:** Document expected file types created by `ArcSOC.exe` in normal operation. For ArcGIS environments, .aspx files may be typical; however, .exe or .bat extensions are anomalies that warrant further scrutiny.

  - **Inspect Files for Indicators of Compromise:** If possible, retrieve and analyze the created files for signatures of known malware or suspicious content using antivirus or malware analysis tools.

  - **Evaluate Asset Criticality:** Analyze the role of the host system running `ArcSOC.exe`. Assess its criticality based on its function within the enterprise. A compromised server could lead to heightened risks due to its potential access to sensitive data.

  ### Prioritization

  This alert is of high severity due to the critical role of ArcGIS servers in handling geographic information and the likelihood that this behavior is exploited for establishing backdoors or executing further attacks. Given that the creation of executables or scripts is a common tactic used in attacks, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection relies heavily on the collection of accurate Windows event logs to capture file creation events. There’s a potential for evasion if the attacker uses obfuscation techniques to disguise file types or employs legitimate processes to create known scripts. Legitimate automated tasks or updates may trigger similar alerts. To strengthen detection coverage, consider companion detections on file modifications or suspicious behavior from other legitimate processes within the same environment.

