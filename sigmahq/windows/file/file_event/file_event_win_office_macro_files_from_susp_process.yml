title: Office Macro File Creation From Suspicious Process
id: b1c50487-1967-4315-a026-6491686d860e
status: test
description: Detects the creation of a office macro file from a a suspicious 
  process
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1566.001/T1566.001.md
- https://learn.microsoft.com/en-us/deployoffice/compat/office-file-format-reference
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-23
modified: 2023-02-22
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: The "ParentImage" field is not available by default on
    EID 11 of Sysmon logs. To be able to use this rule to the full extent you need
    to enriche the log with additional ParentImage data'
detection:
  selection_cmd:
  - Image|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
        # Note: ParentImage is a custom field and is not available by default on Sysmon EID 11
  - ParentImage|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_ext:
    TargetFilename|endswith:
    - '.docm'
    - '.dotm'
    - '.xlsm'
    - '.xltm'
    - '.potm'
    - '.pptm'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of Office macro files (e.g., .docm, .xlsm) initiated by potentially suspicious Windows processes (e.g., cscript.exe, mshta.exe). The likely attacker objective is to leverage malicious macros within Office documents to execute arbitrary code, which can facilitate further compromise or data exfiltration. This behavior aligns with the MITRE ATT&CK technique for Phishing (T1566.001).

  Primary telemetry sources include Windows file event logs, specifically Sysmon Event ID 11, which captures file creation events, provided that the ParentImage field is enriched for context. If malicious, this activity may result in immediate system compromise or lateral movement. Importantly, this detection alone does not confirm malicious intent, as legitimate programs may also generate Office macro files.

  ### Investigation Steps

  - **Check file creation logs:** Review Sysmon Event ID 11 for file creation, focusing on the `TargetFilename` field for extensions like .docm and .xlsm. Confirm `ParentImage` is one of the monitored executables (e.g., cscript.exe), indicating potential malicious behavior.

  - **Assess process origin:** Verify the source of the initiating process (`ParentImage`). If it is not a typical administrative task associated with Office applications, this raises the likelihood of malicious intent. Use Sysmon logs and endpoint security alerts for further context.

  - **Analyze related events:** Look for correlated activity in Security Event ID 4688 (process creation) that shows how the suspicious process was executed. Legitimate operations will likely exhibit typical execution paths and command-line arguments.

  - **Identify legitimate file creation:** Research the context of known good applications that might trigger similar alerts, such as automated scripts. Log entries from trusted sources doing routine updates might rely on legitimate tools.

  - **Inspect contents of created files:** Examine the contents of the .docm and .xlsm files created in this alert. Look for suspicious embedded macros or indications of obfuscation, which are common in malicious files.

  ### Prioritization

  This alert is deemed high severity due to its potential impact on sensitive systems, as malicious Office files can lead to credential theft or further infections. The likelihood of exploitation is significant, considering the common use of macro-based attacks in targeted campaigns. As this behavior is frequently weaponized, it warrants immediate analysis.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion through the use of alternate benign processes or scripts mimicking macro behavior. Effective detection requires proper Sysmon configuration to enrich logs with the `ParentImage` field. Legitimate activities, such as automated report generation or file updates by trusted applications, can trigger this alert. A related detection to consider is monitoring for unusual or anomalous command-line parameters being used by known legitimate macro execution processes, enhancing overall visibility of potential threats.

