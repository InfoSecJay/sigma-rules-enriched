title: Office Macro File Creation From Suspicious Process
id: b1c50487-1967-4315-a026-6491686d860e
status: test
description: Detects the creation of a office macro file from a a suspicious process
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1566.001/T1566.001.md
- https://learn.microsoft.com/en-us/deployoffice/compat/office-file-format-reference
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-23
modified: 2023-02-22
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: The "ParentImage" field is not available by default on
    EID 11 of Sysmon logs. To be able to use this rule to the full extent you need
    to enriche the log with additional ParentImage data'
detection:
  selection_cmd:
  - Image|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
        # Note: ParentImage is a custom field and is not available by default on Sysmon EID 11
  - ParentImage|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_ext:
    TargetFilename|endswith:
    - '.docm'
    - '.dotm'
    - '.xlsm'
    - '.xltm'
    - '.potm'
    - '.pptm'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the creation of Office macro-enabled files (e.g., .docm, .xlsm) initiated by potentially suspicious processes like `cscript.exe`, `mshta.exe`, and `regsvr32.exe`. Attackers often use these processes to execute malicious scripts that generate macro files as part of an initial access strategy, typically for phishing campaigns or to deploy malware payloads.

  Relevant MITRE ATT&CK tactics include Initial Access (TA0001) and phishing via malicious file attachment (T1566.001). The primary telemetry sources required for detection are Sysmon logs that capture file creation events (Event ID 11). If malicious, this behavior can lead to unauthorized access, data exfiltration, or lateral movement. However, this detection does NOT confirm malicious intent on its own, as legitimate software installation or administrative tasks may create similar files.

  ---

  ### Investigation Steps

  - **Investigate creating process:**
    Examine Sysmon Event ID 11 logs for `ParentImage` field to establish the origin of the Office macro file. Look for known executable paths such as `cscript.exe`, `mshta.exe`, or other suspicious processes.

  - **Validate macro file purpose:**
    Review the contents of the generated macro files (e.g., `.docm`, `.xlsm`). Benign files often contain legitimate automation or user customization code, while malicious files may include obfuscated code or calls to external URLs.

  - **Cross-reference file creation times:**
    Check system event logs (Event ID 4663) and file system activity to correlate the timestamps of the created macro files with user activity logs to identify any unusual access patterns.

  - **Identify user account and access behavior:**
    Determine the user account associated with the process. If the account is non-administrative and the file creation is out of norm (e.g., a user not typically handling Office macros), further investigation is warranted.

  - **Monitor for associated network traffic:**
    Investigate outgoing connections in firewall or proxy logs that occurred after the macro file creation. Look for suspicious DNS queries or HTTP requests tied to known malicious indicators of compromise.

  - **Identify historical trends of similar alerts:**
    Review historical logs to check if similar macro file creation alerts have been triggered previously by the same process or user account, to identify potential repetitive malicious behavior.

  ---

  ### Prioritization

  This alert is high-severity due to the critical role of Office macros in many malware distribution campaigns. The systems affected are often crucial for business operations, making them attractive targets for adversaries leveraging macros to gain initial access. The behavior detected is commonly weaponized in phishing attacks, heightening the urgency for investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if Sysmon is not correctly configured to include `ParentImage` data, as this field is not default. Legitimate operations, such as automated report generation or software deployment, can trigger this alert. It is advisable to have companion detections focusing on macro execution (e.g., execution of Office scripts) and external access patterns to strengthen overall alert coverage.

