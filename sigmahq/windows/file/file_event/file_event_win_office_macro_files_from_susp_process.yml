title: Office Macro File Creation From Suspicious Process
id: b1c50487-1967-4315-a026-6491686d860e
status: test
description: Detects the creation of a office macro file from a a suspicious process
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1566.001/T1566.001.md
- https://learn.microsoft.com/en-us/deployoffice/compat/office-file-format-reference
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-01-23
modified: 2023-02-22
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  category: file_event
  product: windows
  definition: 'Requirements: The "ParentImage" field is not available by default on
    EID 11 of Sysmon logs. To be able to use this rule to the full extent you need
    to enriche the log with additional ParentImage data'
detection:
  selection_cmd:
  - Image|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
        # Note: ParentImage is a custom field and is not available by default on Sysmon EID 11
  - ParentImage|endswith:
    - '\cscript.exe'
    - '\mshta.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\wscript.exe'
  selection_ext:
    TargetFilename|endswith:
    - '.docm'
    - '.dotm'
    - '.xlsm'
    - '.xltm'
    - '.potm'
    - '.pptm'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the creation of Office macro files (with extensions such as .docm, .xlsm, etc.) initiated from suspicious processes typically associated with script execution utilities (like `cscript.exe`, `mshta.exe`, `wscript.exe`, etc.). The behavior signaled by this rule is indicative of potential malicious activity, where an attacker may leverage macros to execute code, perform data exfiltration, or deliver additional payloads. This technique aligns with phishing attacks and exploitation tactics, as attackers often target users with seemingly legitimate documents containing embedded macros.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Initial Access** (T1071): Gaining entry through email attachments that exploit user trust.
  - **Phishing** (T1566.001): Using malicious macro files as part of phishing campaigns that compel users to enable macros.

  Primary data sources for this alert include file creation events from the Windows event logs, specifically focusing on events related to file operations such as new or modified files, which are crucial for identifying macro file creation.

  ### Investigation Steps
  - **Review File Creation Events**: Check for the creation of Office macro files (.docm, .xlsm, etc.) in relevant file system locations to assess the context of the file and the user interaction that may have triggered it.
  - **Analyze Parent Process Data**: Investigate the parent process responsible for initiating the file creation to confirm whether it is one of the suspicious executables (e.g., `cscript.exe`, `mshta.exe`). This can highlight potential script execution attempts leading to macro file creation.
  - **Correlate with User Activity**: Look for patterns in user behavior, such as any email open activity or other interactions with documents around the time of the macro file creation to identify potential phishing success.
  - **Examine Associated Logs**: Cross-reference with other logs from security tools like SIEM or EDR, focusing on any signs of lateral movement or further execution attempts related to the created macro files.

  ### Prioritization
  This alert carries a high severity due to the potential impact of macro-enabled documents, which can execute malicious code leading to data breaches, ransomware attacks, and overall compromise of corporate networks. Given the often unsuspecting nature of users being tricked into enabling macros, the likelihood of such incidents is significant.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, particularly if the logging of ParentImage data is not enabled as it is not available by default in Sysmon logs. This can lead to missed context regarding the process that initiated the macro file creation. Additionally, this detection assumes that users have not disabled macro security settings, which may allow macro execution without proper alerts. It is crucial to ensure that comprehensive logging configurations are in place to capture the necessary information for this detection rule to function effectively.

