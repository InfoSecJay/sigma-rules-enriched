detection:
  selection:
    TargetFilename:
    - 'C:\Windows\System32\config\systemprofile\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt'
    - 'C:\Windows\System32\config\systemprofile\AppData\Local\Microsoft\Windows\PowerShell\StartupProfileData-Interactive'
  condition: selection
falsepositives:
- Administrative activity
- PowerShell scripts running as SYSTEM user
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of interactive PowerShell session artifacts within the SYSTEM user context, specifically targeting the ConsoleHost history file and the StartupProfileData-Interactive. These files may indicate that an unauthorized user or attacker is leveraging PowerShell—often a tool for administrative and potentially malicious activity. Attackers might be attempting to establish a foothold in the environment, escalate privileges, or execute further commands with elevated privileges.

  The relevant MITRE ATT&CK tactics for this detection encompass **Execution** (TA0002), specifically technique **Command-Line Interface** (T1059.001). This reflects behaviors where attackers utilize PowerShell for command execution to gather information, move laterally, or execute payloads. The primary data source for monitoring this activity is Windows file event logs, which can provide insights into unusual file creations or modifications indicative of unauthorized access.

  ### Investigation Steps
  - **Review PowerShell Execution History:** Examine the ConsoleHost_history.txt file for any unexpected commands or scripts executed during the suspicious PowerShell session, particularly those not aligned with typical administrative tasks.
  - **Analyze User Context:** Confirm that the SYSTEM user context is legitimate by correlating the detected activity with normal operational behavior. Check for any other concurrent SYSTEM user actions that could indicate a larger compromise.
  - **Check System Logs for Anomalies:** Investigate Windows Event Logs (especially Event ID 4688 for process creation) to identify if there are additional instances of PowerShell being invoked with administrative privileges or unusual command-line parameters that could indicate malicious behavior.
  - **Evaluate Processes and Connections:** Inspect running processes and network connections at the time of the suspicious activity. Look for known malicious PowerShell modules or related tools (e.g., Mimikatz) that may have been executed in conjunction.

  ### Prioritization
  This alert is marked as high severity due to the elevated privileges associated with the SYSTEM user context, which poses a significant risk if exploited. Unauthorized PowerShell access at this level can lead to severe consequences, including data exfiltration, lateral movement, and the potential for ransomware deployment.

  ### Blind Spots and Assumptions
  There may be gaps in detection if PowerShell logging is not enabled or if file event logging is improperly configured. The detection logic assumes that non-administrative users should not typically execute PowerShell in the SYSTEM context, which may not account for legitimate administrative activities. It is essential that logging for both PowerShell execution and file changes is correctly set up to ensure this alert functions as intended.

