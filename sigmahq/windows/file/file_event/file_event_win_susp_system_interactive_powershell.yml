note: |
  ### Technical Context

  This Sigma rule detects the creation of specific files that indicate interactive use of PowerShell in the SYSTEM user context. This behavior is often associated with post-exploitation activities where an attacker, having compromised a system, utilizes PowerShell to execute commands interactively or to maintain persistence. The relevant MITRE ATT&CK tactic is **Execution** (TA0002), specifically technique **PowerShell** (T1059.001). The primary telemetry sources are file system events related to the creation of specific PowerShell-related files.

  If malicious, this behavior can indicate an attempted or ongoing compromise of the system, potentially allowing attackers complete administrative control. However, it is important to note that this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may trigger the same alerts.

  ### Investigation Steps

  - **Review file creation events:** Check for `File Creation` events for the files `C:\Windows\System32\config\systemprofile\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt` and `C:\Windows\System32\config\systemprofile\AppData\Local\Microsoft\Windows\PowerShell\StartupProfileData-Interactive`, focusing on Event ID 4663 and Sysmon Event ID 11.

  - **Correlate with process execution:** Analyze any events (Event ID 4688 or Sysmon Event ID 1) to find PowerShell processes that created the above files. Look for parameters that may suggest suspicious activity, such as unusual script paths or command arguments.

  - **Identify legitimate administrative activity:** Validate whether an approved administrator or scheduled task is executing PowerShell commands in the SYSTEM context, which may explain the file creation. Consult any pertinent change management or task scheduling logs.

  - **Check for high-confidence malicious indicators:** Look for the presence of known malicious artifacts or patterns in the PowerShell execution context, such as command lines that invoke `Invoke-Mimikatz`, which may be visible in Event ID 4688. Compare against threat intelligence indicators.

  - **Assess the affected host's role:** Determine if the system is critical to operations (e.g., a domain controller or server) and validate their security posture through history of recent administrative changes or vulnerability assessments.

  - **Verify file integrity and potential exfiltration:** Check for additional file changes in the PowerShell directories (`C:\Windows\System32\config\systemprofile\AppData\Roaming\Microsoft\Windows\PowerShell\`) that could indicate further malicious activity, including logs or scripts potentially used for data exfiltration.

  ### Prioritization

  This alert is considered high severity due to the potential impact of system compromise and extensive administrative privileges the SYSTEM user possesses. The likelihood of abuse is significant, as interactive PowerShell sessions are commonly leveraged in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative actions or automated tasks running PowerShell, which could generate false positives. Reliable detection requires proper configuration and monitoring of relevant Windows file creation logs. Common legitimate activities include system administrators performing maintenance tasks. A related detection to strengthen coverage would be monitoring for unusual PowerShell command-line patterns or suspicious module imports.

