  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) by modifying the token of a launched process, specifically targeting the `pkgmgr.exe` located in the user's temporary application data folder. This behavior often correlates with an attacker attempting to gain elevated privileges without user consent, using tactics such as spoofing higher privilege applications. The relevant MITRE ATT&CK tactic is "Privilege Escalation" (T1068) and the technique is "Bypass User Account Control" (T1548.002).

  The primary telemetry source is Windows file event logs that capture file system activity, particularly events involving modifications to `pkgmgr.exe`. If successful, this could allow attackers to run malicious code with elevated privileges, leading to a compromise of system integrity and confidentiality. Importantly, this detection does not confirm that the action was malicious in isolation; it may occur in legitimate scenarios, particularly if applications manage user processes without foreknowledge of such modifications.

  ### Investigation Steps

  - **Examine specific file event logs:** Review Windows file event logs for Event ID 4663 targeting `C:\Users\<username>\AppData\Local\Temp\pkgmgr.exe`. Look for unusual access or modifications in the last 48 hours.

  - **Identify the process hierarchy:** Use Sysmon Event ID 5 (Process Creation) to trace the parent process of `pkgmgr.exe`. Legitimate instances typically arise from trusted administrative tasks; any unexpected parent processes may indicate malicious behavior.

  - **Check command line parameters:** Validate the execution path and parameters of `pkgmgr.exe` via Sysmon Event ID 1. Malicious invocations will often contain unusual arguments or no arguments compared to legitimate use cases.

  - **Review user account controls:** Confirm the UAC configuration in use on the host. If UAC is disabled or set to a low level, this could prompt circumvention attempts, also impacting the severity of the alert.

  - **Correlate with known malware signatures:** Check the recently created or modified files in the Temp folder using `Get-ChildItem` with a focus on suspicious PE files or known indicators of compromise (IoCs), tying them back to system integrity assessments.

  ### Prioritization

  This alert is of high severity due to its implications for privilege escalation on critical systems often used in enterprise environments. The likelihood of malicious abuse is high, as UAC bypass methods are commonly weaponized tactics by attackers aiming to escalate their privileges and gain further control over the network.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications that modify temporary files or trigger similar behavior for valid purposes, potentially leading to false positives. Reliable detection relies on comprehensive file event log configurations and the inclusion of Sysmon for detailed process tracking. A related detection that enhances coverage is monitoring for changes in registry keys associated with UAC settings, adding context to UAC modification attempts.

