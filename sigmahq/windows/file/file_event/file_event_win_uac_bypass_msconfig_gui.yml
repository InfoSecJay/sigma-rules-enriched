  ### Technical Context
  This detection rule identifies potential UAC (User Account Control) bypass attempts utilizing the msconfig GUI hack, a technique associated with the UACMe tool. The primary behavior observed is the modification of the `pkgmgr.exe` file located in the Windows Temp directory, which is often employed by attackers to circumvent UAC and gain elevated privileges without explicit user consent. The likely objectives of the attacker include silently executing malicious code with higher privileges and avoiding detection from standard monitoring tools.

  Relevant MITRE ATT&CK tactics include **Defense Evasion (T1561)**, as the attacker seeks to evade UAC mechanisms that protect against unauthorized privilege escalation. The technique identified by this rule is **Privilege Escalation through Token Manipulation (T1548.002)**, demonstrating a direct attempt to increase access rights illicitly. The primary data sources required for effective detection include file event logs that capture modifications in user directories, particularly Windows system files, ensuring insights into potentially malicious file activities.

  ### Investigation Steps
  - **Review File Events:** Examine file event logs focusing on changes to `C:\Users\<username>\AppData\Local\Temp\pkgmgr.exe` to identify any unauthorized file modifications and access patterns.
  - **Analyze Process Creation Events:** Correlate process creation records for `pkgmgr.exe` to confirm if it was executed without legitimate user interaction, which could indicate a UAC bypass scenario.
  - **Inspect User Account Activities:** Go through user account activities to identify any recent changes in privilege levels, especially for accounts that are not typically involved in system modifications.
  - **Evaluate Security Logs:** Check Windows security logs for any related event IDs that indicate privilege escalation attempts, ensuring to audit corresponding user actions leading to the anomaly.

  ### Prioritization
  The alert’s severity is classified as high due to the potential impact of a successful UAC bypass, which can lead to unauthorized access and system compromise. Given the likelihood of attacker interest in exploiting such vulnerabilities, timely response to these alerts is crucial for maintaining system integrity.

  ### Blind Spots and Assumptions
  This detection logic may not cover scenarios where the msconfig GUI hack is conducted through other, less obvious file paths or with different executables not captured by the specified `TargetFilename` criteria. It assumes the presence of standard logging configurations in Windows to capture file events effectively. Additionally, if endpoint protection solutions manage or restrict access to Temp directories, it could affect the visibility of abnormal activities, leading to potential blind spots in detection.

