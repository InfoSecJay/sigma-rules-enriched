  regression_data/rules/windows/file/file_event/file_event_win_creation_system_file/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of Windows executable files that share names with well-known system processes in directories that are not typically associated with legitimate system operation, such as `C:\Windows\System32` or `C:\Windows\SysWOW64`. This behavior is indicative of a potential attempt by an adversary to evade detection by masquerading malicious executables as legitimate system processes. The likely attacker objective is to establish persistence or to execute malicious payloads without raising suspicion.

  The relevant MITRE ATT&CK tactic for this detection is **Stealth** (TA0005), with the specific technique being **Masquerading: Executable Filename** (T1036.005). The primary telemetry sources are Windows file event logs, particularly those capturing file creation, along with process creation events indicating attempts to run these executables. If malicious, this behavior can lead to unauthorized access, data exfiltration, or system compromise. It is important to note that the detection of this behavior does not confirm an attack on its own; further investigation is necessary to determine the intent and context behind the executable creation.

  ### Investigation Steps

  - **Analyze the target filename:** Review the alert details for the `TargetFilename` field to determine the exact location and name of the created executable. Malicious instances often show process names like `explorer.exe` in unexpected locations outside standard directories.

  - **Check process creation events:** Validate the creation of the executable against Security Event ID 4688 logs for any corresponding process creation (e.g., the name of the creating process and any command line arguments, focusing specifically on unusual parent processes for context).

  - **Review parent-child process relationships:** Use Sysmon Event ID 1 to examine the full parent-child process tree associated with the executable creation. Legitimate activity will typically show system processes spawning executables only from their designated directories.

  - **Assess file properties:** Investigate the file properties of the created executable, using Windows properties or hash verification against known legitimate files to identify anomaly signatures (e.g., hash values not matching known good files).

  - **Cross-check with baseline data:** Compare the findings with established baselines of legitimate application behavior or known benign applications that may have similar names but exist in authorized locations to validate if the activity is expected.

  - **Identify other artifacts:** Look for associated artifacts, such as file creation timestamps in `C:\Windows\Temp`, indicating possible short-lived or temporary executions of malicious scripts, further supporting suspicious behavior.

  ### Prioritization

  This alert is of **medium severity** as the presence of executables named after system processes in unexpected locations can indicate a stealthy attack. The likelihood of malicious abuse is significant, as adversaries often utilize this technique to mask their actions. While not all instances are harmful, it requires immediate triage due to the potential implications for system security.

  ### Blind Spots and Assumptions

  Detection limitations may arise from the possibility of legitimate software incorrectly using system process names. The rule's performance depends heavily on comprehensive file creation logging; any misconfiguration could yield false negatives. Additionally, standard administrative or IT operations, such as software installs, updates, or system migrations, may inadvertently trigger the alert. A related detection that enhances coverage would be the monitoring of command-line parameters for process creation events, which can provide context to distinguish between benign and malicious activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
