note: |
  ### Technical Context

  This Sigma rule detects the creation of executable files with names associated with legitimate system processes located outside of their expected directories (e.g., System32, SysWOW64). The likely attacker objective here is to disguise malicious executables as legitimate system processes to evade detection and execute payloads undetected. This behavior fits within the MITRE ATT&CK framework under the Defense Evasion tactic (TA0005), specifically using the technique "Masquerading" (T1036.005).

  The primary telemetry sources for this rule are Windows file event logs, specifically targeting log types related to file creation. The security impact of this behavior could be significant, as it may indicate the presence of malware or other unauthorized software that can compromise system integrity. However, this detection alone does not confirm malicious intent or activity; legitimate administrative activity may also trigger this alert.

  ### Investigation Steps

  - **Check creation timestamps:** Review Event ID 4663 (File Access) logs for the creation of files at unusual times (e.g., after hours or during maintenance windows). Compare against normal business operations to assess legitimacy.

  - **Identify file location:** Verify the file creation path in the relevant logs. Maliciously created files in directories such as `C:\Windows\Temp\` or `C:\Users\[username]\AppData\Local\` may indicate suspicious activity. Legitimate system processes should be located in `C:\Windows\System32\` or similar standard directories.

  - **Correlate with process tree:** Analyze the process tree at the time of the alert using Sysmon Event ID 1 (Process Creation). Look for suspicious parent processes that spawn an executable with a system process name, especially from unexpected locations.

  - **Review file signatures and hashes:** Use tools to analyze the SHA256 hash of the detected files against malware databases (e.g., VirusTotal). A high confidence malicious indicator would be a file with a known malicious hash or signatures indicating tampering.

  - **Corroborate against known software:** Validate if the file name is associated with known legitimate software within the environment. Instances of legitimate software (e.g., remote management tools) should be documented in asset inventories.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on critical systems, especially if the affected machine is a server or workstations with administrative access. The likelihood of malicious abuse is elevated, as attackers often utilize masqueraded filenames and paths to upscale their attack stealth. This behavior is commonly weaponized in various attack vectors, especially in advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Limitations in detection can arise from legitimate administrative actions that may create executable files with system process names in unexpected locations, perhaps for testing or configuration purposes. Accurate detection requires appropriate logging configurations to capture all relevant file events. Additionally, benign software might use similar naming conventions leading to false positives. A related detection that can strengthen coverage would involve monitoring for abnormal command line parameters or parent processes spawning these executables to further investigate intent.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
