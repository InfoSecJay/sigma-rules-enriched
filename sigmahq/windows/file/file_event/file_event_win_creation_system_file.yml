title: Files With System Process Name In Unsuspected Locations
id: d5866ddf-ce8f-4aea-b28e-d96485a20d3d
status: test
description: |
  Detects the creation of an executable with a system process name in folders other than the system ones (System32, SysWOW64, etc.).
  It is highly recommended to perform an initial baseline before using this rule in production.
references:
- Internal Research
author: Sander Wiebing, Tim Shelton, Nasreddine Bencherchali (Nextron Systems)
date: 2020-05-26
modified: 2026-02-04
tags:
- attack.stealth
- attack.t1036.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
    - '\AtBroker.exe'
    - '\audiodg.exe'
    - '\backgroundTaskHost.exe'
    - '\bcdedit.exe'
    - '\bitsadmin.exe'
    - '\cmdl32.exe'
    - '\cmstp.exe'
    - '\conhost.exe'
    - '\csrss.exe'
    - '\dasHost.exe'
    - '\dfrgui.exe'
    - '\dllhost.exe'
    - '\dwm.exe'
    - '\eventcreate.exe'
    - '\eventvwr.exe'
    - '\explorer.exe'
    - '\extrac32.exe'
    - '\fontdrvhost.exe'
    - '\fsquirt.exe'         # was seen used by sidewinder APT - https://securelist.com/sidewinder-apt/114089/
    - '\ipconfig.exe'
    - '\iscsicli.exe'
    - '\iscsicpl.exe'
    - '\logman.exe'
    - '\LogonUI.exe'
    - '\LsaIso.exe'
    - '\lsass.exe'
    - '\lsm.exe'
    - '\msiexec.exe'
    - '\msinfo32.exe'
    - '\mstsc.exe'
    - '\nbtstat.exe'
    - '\odbcconf.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regini.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\RuntimeBroker.exe'
    - '\schtasks.exe'
    - '\SearchFilterHost.exe'
    - '\SearchIndexer.exe'
    - '\SearchProtocolHost.exe'
    - '\SecurityHealthService.exe'
    - '\SecurityHealthSystray.exe'
    - '\services.exe'
    - '\ShellAppRuntime.exe'
    - '\sihost.exe'
    - '\smartscreen.exe'
    - '\smss.exe'
    - '\spoolsv.exe'
    - '\svchost.exe'
    - '\SystemSettingsBroker.exe'
    - '\taskhost.exe'
    - '\taskhostw.exe'
    - '\Taskmgr.exe'
    - '\TiWorker.exe'
    - '\vssadmin.exe'
    - '\w32tm.exe'
    - '\WerFault.exe'
    - '\WerFaultSecure.exe'
    - '\wermgr.exe'
    - '\wevtutil.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    - '\winrshost.exe'
    - '\WinRTNetMUAHostServer.exe'
    - '\wlanext.exe'
    - '\wlrmdr.exe'
    - '\WmiPrvSE.exe'
    - '\wslhost.exe'
    - '\WSReset.exe'
    - '\WUDFHost.exe'
    - '\WWAHost.exe'
  filter_main_generic:
        # Note: It is recommended to use a more robust filter instead of this generic one, to avoid false negatives.
    TargetFilename|contains:
            # - '\SystemRoot\System32\'
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\uus\'
  filter_main_tiworker:
    Image|endswith:
    - '\TiWorker.exe'
    - '\wuaucltcore.exe'
    TargetFilename|startswith: 'C:\Windows\Temp\'
  filter_main_svchost:
    Image|endswith:
    - 'C:\Windows\system32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
    TargetFilename|contains:
    - 'C:\Program Files\WindowsApps\'
    - 'C:\Program Files (x86)\WindowsApps\'
    - '\AppData\Local\Microsoft\WindowsApps\'
  filter_main_wuauclt:
    Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\SysWOW64\wuauclt.exe'
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
  filter_main_explorer:
    TargetFilename|endswith: 'C:\Windows\explorer.exe'
  filter_main_msiexec:
        # This filter handles system processes who are updated/installed using misexec.
    Image|endswith:
    - 'C:\WINDOWS\system32\msiexec.exe'
    - 'C:\WINDOWS\SysWOW64\msiexec.exe'
        # Add more processes if you find them or simply filter msiexec on its own. If the list grows big
    TargetFilename|startswith:
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview\'
  filter_main_healtray:
    TargetFilename|contains: 'C:\Windows\System32\SecurityHealth\'
    TargetFilename|endswith: '\SecurityHealthSystray.exe'
    Image|endswith: '\SecurityHealthSetup.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- System processes copied outside their default folders for testing purposes
- Third party software naming their software with the same names as the 
  processes mentioned here
# Note: Upgrade to high after an initial baseline to your environement.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_creation_system_file/info.yml
note: |
  ### Technical Context

  This rule detects the creation of executable files that share names with legitimate system processes but are located in non-standard directories, such as user profiles or temporary folders, rather than the expected system directories (e.g., System32). The likely goal of an attacker triggering this behavior is to blend in with legitimate system processes, potentially creating a backdoor or executing malicious commands while bypassing security solutions.

  The relevant MITRE ATT&CK tactic is **Defense Evasion**, specifically technique **Masquerading (T1036.005)**. The primary telemetry source for this detection is file creation events in Windows, specifically focusing on executable file types in user- or temp-specific directories. If malicious, this behavior poses significant risks, including unauthorized execution of malicious payloads with elevated privileges. However, this detection does NOT confirm that the identified executable is malicious, as it could be a legitimate software behavior dependent on the context.

  ### Investigation Steps

  - **Check for recent file creation events:** Look for **File Creation Events (Sysmon Event ID 11 or Windows Event ID 4663)** concerning the flagged executable, noting the **creation time** and **user context**. Malicious activity typically shows rapid execution following creation.

  - **Validate the file location:** Verify the path of the detected executable. Legitimate system processes should reside in **C:\Windows\System32\** or **C:\Windows\SysWOW64\**. Files created in **C:\Users\<username>\AppData\Local\Temp** or other unexpected directories are suspicious.

  - **Identify abnormal parent process relationships:** Review the parent process of the executable creation using **Event ID 4688 (Process Creation)** to determine if it originated from a legitimate source or a suspicious process (e.g., cmd.exe, powershell.exe, or other system utilities).

  - **Examine user permissions and attributes:** Investigate if the user account associated with the executable creation has unnecessary administrative privileges. Malicious actors often utilize accounts with elevated rights for their actions.

  - **Review file signature and hash values:** Use file properties to check the hash (SHA1/SHA256) of the executable. Genuine system files will usually have known hash values that you can validate against known databases (e.g., VirusTotal).

  - **Check for related artifacts of execution:** Look for other indicators of compromise related to the execution of this application, such as **Windows Event ID 7045** (Service Installation) or evidence of network activity in **Firewall logs** or **Proxy logs** related to that executable's activity.

  ### Prioritization

  This alert has medium severity as it indicates potential evasion techniques being used by an adversary. Given the nature of the affected executables, if confirmed as malicious, this behavior could allow attackers to maintain persistence or escalate privileges. While rare, similar techniques have been weaponized in active attacks against enterprises.

  ### Blind Spots and Assumptions

  Detection may miss instances where an attacker successfully names their malicious executable after a benign application yet places it in an expected directory. Additionally, required log sources such as Sysmon and Windows Event Logs must be correctly configured to capture these file creation events reliably. Legititimate system management tasks like software updates may trigger the alert, which requires close scrutiny of the associated context. A companion detection might involve monitoring for unusual parent-child process relationships that indicate potentially malicious activity preceding or following the detected file creation.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
