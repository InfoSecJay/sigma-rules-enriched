title: Files With System Process Name In Unsuspected Locations
id: d5866ddf-ce8f-4aea-b28e-d96485a20d3d
status: test
description: |
  Detects the creation of an executable with a system process name in folders other than the system ones (System32, SysWOW64, etc.).
  It is highly recommended to perform an initial baseline before using this rule in production.
references:
- Internal Research
author: Sander Wiebing, Tim Shelton, Nasreddine Bencherchali (Nextron Systems)
date: 2020-05-26
modified: 2025-12-03
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
    - '\AtBroker.exe'
    - '\audiodg.exe'
    - '\backgroundTaskHost.exe'
    - '\bcdedit.exe'
    - '\bitsadmin.exe'
    - '\cmdl32.exe'
    - '\cmstp.exe'
    - '\conhost.exe'
    - '\csrss.exe'
    - '\dasHost.exe'
    - '\dfrgui.exe'
    - '\dllhost.exe'
    - '\dwm.exe'
    - '\eventcreate.exe'
    - '\eventvwr.exe'
    - '\explorer.exe'
    - '\extrac32.exe'
    - '\fontdrvhost.exe'
    - '\ipconfig.exe'
    - '\iscsicli.exe'
    - '\iscsicpl.exe'
    - '\logman.exe'
    - '\LogonUI.exe'
    - '\LsaIso.exe'
    - '\lsass.exe'
    - '\lsm.exe'
    - '\msiexec.exe'
    - '\msinfo32.exe'
    - '\mstsc.exe'
    - '\nbtstat.exe'
    - '\odbcconf.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regini.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\RuntimeBroker.exe'
    - '\schtasks.exe'
    - '\SearchFilterHost.exe'
    - '\SearchIndexer.exe'
    - '\SearchProtocolHost.exe'
    - '\SecurityHealthService.exe'
    - '\SecurityHealthSystray.exe'
    - '\services.exe'
    - '\ShellAppRuntime.exe'
    - '\sihost.exe'
    - '\smartscreen.exe'
    - '\smss.exe'
    - '\spoolsv.exe'
    - '\svchost.exe'
    - '\SystemSettingsBroker.exe'
    - '\taskhost.exe'
    - '\taskhostw.exe'
    - '\Taskmgr.exe'
    - '\TiWorker.exe'
    - '\vssadmin.exe'
    - '\w32tm.exe'
    - '\WerFault.exe'
    - '\WerFaultSecure.exe'
    - '\wermgr.exe'
    - '\wevtutil.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    - '\winrshost.exe'
    - '\WinRTNetMUAHostServer.exe'
    - '\wlanext.exe'
    - '\wlrmdr.exe'
    - '\WmiPrvSE.exe'
    - '\wslhost.exe'
    - '\WSReset.exe'
    - '\WUDFHost.exe'
    - '\WWAHost.exe'
  filter_main_generic:
        # Note: It is recommended to use a more robust filter instead of this generic one, to avoid false negatives.
    TargetFilename|contains:
            # - '\SystemRoot\System32\'
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\uus\'
  filter_main_tiworker:
    Image|endswith:
    - '\TiWorker.exe'
    - '\wuaucltcore.exe'
    TargetFilename|startswith: 'C:\Windows\Temp\'
  filter_main_svchost:
    Image|endswith:
    - 'C:\Windows\system32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
    TargetFilename|contains:
    - 'C:\Program Files\WindowsApps\'
    - 'C:\Program Files (x86)\WindowsApps\'
    - '\AppData\Local\Microsoft\WindowsApps\'
  filter_main_wuauclt:
    Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\SysWOW64\wuauclt.exe'
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
  filter_main_explorer:
    TargetFilename|endswith: 'C:\Windows\explorer.exe'
  filter_main_msiexec:
        # This filter handles system processes who are updated/installed using misexec.
    Image|endswith:
    - 'C:\WINDOWS\system32\msiexec.exe'
    - 'C:\WINDOWS\SysWOW64\msiexec.exe'
        # Add more processes if you find them or simply filter msiexec on its own. If the list grows big
    TargetFilename|startswith:
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview\'
  filter_main_healtray:
    TargetFilename|contains: 'C:\Windows\System32\SecurityHealth\'
    TargetFilename|endswith: '\SecurityHealthSystray.exe'
    Image|endswith: '\SecurityHealthSetup.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- System processes copied outside their default folders for testing purposes
- Third party software naming their software with the same names as the 
  processes mentioned here
# Note: Upgrade to high after an initial baseline to your environement.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_creation_system_file/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of executable files with names traditionally associated with system processes (e.g., `explorer.exe`, `powershell.exe`) in non-standard locations outside of typical directories like System32 or SysWOW64. The likely objective of an attacker using this method is to hide malicious activity by mimicking legitimate system processes, which can help evade detection by security solutions. This behavior relates to the MITRE ATT&CK tactic of Defense Evasion (TA0005), specifically technique T1036.005, which revolves around masquerading as legitimate system applications.

  The primary telemetry sources for this detection include Windows file event logs that capture file creation events. These logs should include details such as `TargetFilename`, file paths, and creation timestamps. If malicious, this activity potentially indicates a compromise in the environment and could facilitate further exploitation or lateral movement. However, it is crucial to note that the detection of such file creations does not confirm malicious intent on its own, as legitimate applications can sometimes exhibit similar behaviors.

  ### Investigation Steps

  - **Review the Alert Context:** Investigate the `TargetFilename` field for newly created executable files in atypical directories. Some examples are `C:\Program Files\`, `C:\Users\<username>\AppData\`, and any other user directories. Legitimate files should reside in their default locations.

  - **Identify Malicious Indicators:** Look for `Event ID 4663` (An attempt was made to access an object) associated with the identified executable. If the access request originates from unusual or suspicious user accounts or services, this is a strong indicator of malicious activity.

  - **Cross-reference Process Creation:** Check for `Event ID 4688` (A new process has been created) to see if the executable corresponds with known system processes. If the `Image` field shows `C:\Windows\System32\` or `C:\Windows\SysWOW64\` but is flagged in a user directory, this is a strong indicator of evasion tactics.

  - **Evaluate System Integrity:** Utilize `Sysmon` logs with Event ID 1 (Process creation) to analyze the command-line parameters. Unusual command-line arguments or associations, particularly for system process names in unexpected locations, should be flagged for further analysis.

  - **Examine User Context:** Investigate the `SubjectUserName` and `SubjectDomainName` fields to determine the user or process that initiated the executable creation. High-privilege user accounts executing these operations need closer scrutiny, especially if they are not expected to perform such actions.

  - **Correlate with Threat Intelligence:** Check for reported malware samples or techniques similar to those identified in the `TargetFilename` that have been documented in threat intelligence platforms that highlight how adversaries exploit these legitimate process names.

  ### Prioritization

  This alert is of medium severity given that it targets system processes saved in unexpected directories, which can indicate attempts at evasion or persistence mechanisms by an attacker. The likelihood of malicious abuse is moderate, especially in environments where endpoints are regularly exposed to threats. However, it is critical to weigh the context, as legitimate application deployments might cause similar behaviors if misconfigured.

  ### Blind Spots and Assumptions

  Detection may be limited as sophisticated adversaries can use file obfuscation or compile executables with similar naming conventions to legitimate system processes to evade detection. It requires consistent monitoring of system and application logs across endpoints, and failing to do so may result in missing genuine attacks. Legitimate software testing or third-party applications may also trigger alerts if they mirror the names of system processes. A companion detection rule targeting suspicious process creations in common startup paths would enhance coverage against potential adversaries.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
