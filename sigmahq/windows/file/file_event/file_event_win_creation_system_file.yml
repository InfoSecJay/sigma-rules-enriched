title: Files With System Process Name In Unsuspected Locations
id: d5866ddf-ce8f-4aea-b28e-d96485a20d3d
status: test
description: |
  Detects the creation of an executable with a system process name in folders other than the system ones (System32, SysWOW64, etc.).
  It is highly recommended to perform an initial baseline before using this rule in production.
references:
- Internal Research
author: Sander Wiebing, Tim Shelton, Nasreddine Bencherchali (Nextron Systems)
date: 2020-05-26
modified: 2025-12-03
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
    - '\AtBroker.exe'
    - '\audiodg.exe'
    - '\backgroundTaskHost.exe'
    - '\bcdedit.exe'
    - '\bitsadmin.exe'
    - '\cmdl32.exe'
    - '\cmstp.exe'
    - '\conhost.exe'
    - '\csrss.exe'
    - '\dasHost.exe'
    - '\dfrgui.exe'
    - '\dllhost.exe'
    - '\dwm.exe'
    - '\eventcreate.exe'
    - '\eventvwr.exe'
    - '\explorer.exe'
    - '\extrac32.exe'
    - '\fontdrvhost.exe'
    - '\ipconfig.exe'
    - '\iscsicli.exe'
    - '\iscsicpl.exe'
    - '\logman.exe'
    - '\LogonUI.exe'
    - '\LsaIso.exe'
    - '\lsass.exe'
    - '\lsm.exe'
    - '\msiexec.exe'
    - '\msinfo32.exe'
    - '\mstsc.exe'
    - '\nbtstat.exe'
    - '\odbcconf.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\regini.exe'
    - '\regsvr32.exe'
    - '\rundll32.exe'
    - '\RuntimeBroker.exe'
    - '\schtasks.exe'
    - '\SearchFilterHost.exe'
    - '\SearchIndexer.exe'
    - '\SearchProtocolHost.exe'
    - '\SecurityHealthService.exe'
    - '\SecurityHealthSystray.exe'
    - '\services.exe'
    - '\ShellAppRuntime.exe'
    - '\sihost.exe'
    - '\smartscreen.exe'
    - '\smss.exe'
    - '\spoolsv.exe'
    - '\svchost.exe'
    - '\SystemSettingsBroker.exe'
    - '\taskhost.exe'
    - '\taskhostw.exe'
    - '\Taskmgr.exe'
    - '\TiWorker.exe'
    - '\vssadmin.exe'
    - '\w32tm.exe'
    - '\WerFault.exe'
    - '\WerFaultSecure.exe'
    - '\wermgr.exe'
    - '\wevtutil.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    - '\winrshost.exe'
    - '\WinRTNetMUAHostServer.exe'
    - '\wlanext.exe'
    - '\wlrmdr.exe'
    - '\WmiPrvSE.exe'
    - '\wslhost.exe'
    - '\WSReset.exe'
    - '\WUDFHost.exe'
    - '\WWAHost.exe'
  filter_main_generic:
        # Note: It is recommended to use a more robust filter instead of this generic one, to avoid false negatives.
    TargetFilename|contains:
            # - '\SystemRoot\System32\'
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\uus\'
  filter_main_tiworker:
    Image|endswith:
    - '\TiWorker.exe'
    - '\wuaucltcore.exe'
    TargetFilename|startswith: 'C:\Windows\Temp\'
  filter_main_svchost:
    Image|endswith:
    - 'C:\Windows\system32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
    TargetFilename|contains:
    - 'C:\Program Files\WindowsApps\'
    - 'C:\Program Files (x86)\WindowsApps\'
    - '\AppData\Local\Microsoft\WindowsApps\'
  filter_main_wuauclt:
    Image:
    - 'C:\Windows\System32\wuauclt.exe'
    - 'C:\Windows\SysWOW64\wuauclt.exe'
    - 'C:\Windows\UUS\arm64\wuaucltcore.exe'
  filter_main_explorer:
    TargetFilename|endswith: 'C:\Windows\explorer.exe'
  filter_main_msiexec:
        # This filter handles system processes who are updated/installed using misexec.
    Image|endswith:
    - 'C:\WINDOWS\system32\msiexec.exe'
    - 'C:\WINDOWS\SysWOW64\msiexec.exe'
        # Add more processes if you find them or simply filter msiexec on its own. If the list grows big
    TargetFilename|startswith:
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview\'
  filter_main_healtray:
    TargetFilename|contains: 'C:\Windows\System32\SecurityHealth\'
    TargetFilename|endswith: '\SecurityHealthSystray.exe'
    Image|endswith: '\SecurityHealthSetup.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- System processes copied outside their default folders for testing purposes
- Third party software naming their software with the same names as the processes
  mentioned here
# Note: Upgrade to high after an initial baseline to your environement.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_creation_system_file/info.yml
note: |
  ### Technical Context
  This detection rule identifies the creation of executable files that have names associated with system processes, such as `lsass.exe` and `cmd.exe`, in directories that are not typical for legitimate system files, specifically those outside of `C:\Windows\System32`, `C:\Windows\SysWOW64`, and similar system directories. This behavior is often associated with unauthorized attempts to execute code that mimics or masquerades as important system processes. Attackers may use this technique to bypass detection and gain elevated privileges, persist on a system, or disguise malicious operations.

  The relevant tactics and techniques under the MITRE ATT&CK framework include **Defense Evasion** (T1218), as attackers attempt to mislead security tools by placing binaries in unexpected locations. By creating known system process names outside accepted directories, malicious actors aim to blend their actions with legitimate processes, making it harder for detection systems to identify malicious activity.

  Primary data sources for this detection include file creation events from endpoint detection and response (EDR) tools, which can capture the paths and names of new executable files. Alerts can also leverage logging from Windows file systems to provide context about where and when these files were executed.

  ### Investigation Steps
  - **Review File Creation Logs**: Check recent file creation events to identify instances where the flagged system process names were created outside of expected directories.

  - **Analyze Parent Processes**: Investigate the parent processes associated with the suspicious executables to understand how they were initiated. Look for anomalies suggesting execution from non-standard applications or scripts.

  - **Cross-Reference with Known Baselines**: Verify the presence of detected files by comparing against a baseline of legitimate system file locations and creation patterns to identify any outliers or inconsistencies.

  - **Correlate with Other Security Alerts**: Look for related alerts or unusual activity in logs from other security tools (e.g., AV, NGFW) that might indicate further malicious actions or attempts to communicate externally.

  ### Prioritization
  This alert should be treated with medium severity due to its potential implication of malicious activity masquerading as legitimate system operations, which could lead to unauthorized access or data breaches. In an enterprise environment, where sensitive data and infrastructure are at risk, the likelihood of impact is significant.

  ### Blind Spots and Assumptions
  The detection logic may miss legitimate scenarios where system processes are intentionally copied or executed for administrative purposes, particularly in testing environments. There may be additional gaps in detection if certain directories or file naming conventions are not accounted for, allowing malicious activity to go unnoticed. Continuous tuning of alert parameters and log sources may be necessary to ensure effective detection coverage, as the rule relies on robust logging configurations from Windows file event sources.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
