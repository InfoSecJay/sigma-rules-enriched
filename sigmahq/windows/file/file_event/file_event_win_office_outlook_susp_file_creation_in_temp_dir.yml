title: Suspicious File Created in Outlook Temporary Directory
id: fabb0e80-030c-4e3e-a104-d09676991ac3
related:
- id: f748c45a-f8d3-4e6f-b617-fe176f695b8f
  type: obsolete
status: experimental
description: |
  Detects the creation of files with suspicious file extensions in the temporary directory that Outlook uses when opening attachments.
  This can be used to detect spear-phishing campaigns that use suspicious files as attachments, which may contain malicious code.
references:
- https://vipre.com/blog/svg-phishing-attacks-the-new-trick-in-the-cybercriminals-playbook/
- https://thecyberexpress.com/rogue-rdp-files-used-in-ukraine-cyberattacks/
- https://www.microsoft.com/en-us/security/blog/2024/10/29/midnight-blizzard-conducts-large-scale-spear-phishing-campaign-using-rdp-files/
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-22
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: windows
  category: file_event
detection:
  selection_extension:
    TargetFilename|endswith:
    - '.cpl'
    - '.hta'
    - '.iso'
    - '.rdp'
    - '.svg'
    - '.vba'
    - '.vbe'
    - '.vbs'
  selection_location:
  - TargetFilename|contains:
    - '\AppData\Local\Packages\Microsoft.Outlook_'
    - '\AppData\Local\Microsoft\Olk\Attachments\'
  - TargetFilename|contains|all:
    - '\AppData\Local\Microsoft\Windows\'
    - '\Content.Outlook\'
  condition: all of selection_*
falsepositives:
- Opening of headers or footers in email signatures that include SVG images or legitimate
  SVG attachments
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of files with suspicious extensions within the temporary directory used by Outlook for handling attachments. Attackers often leverage spear-phishing tactics, sending emails with attachments that contain malicious files to compromise user systems. When users interact with these attachments, especially those created in Outlook's temporary directories, it can lead to the execution of harmful payloads. The objective is typically data exfiltration or system compromise, aiming for initial access to a network.

  The relevant MITRE ATT&CK tactics include **Initial Access** and the technique **T1566.001: Spear Phishing via Attachment**, which specifically focuses on malicious content delivered through emails aimed at trusted users. The security telemetry that holds the most pertinent evidence for this detection rule includes file creation logs from endpoints, particularly logs detailing file activity within Windows user directories.

  ### Investigation Steps
  - **Review File Creation Events:** Examine Windows file creation logs for new files with suspicious extensions (e.g., .cpl, .hta, .rdp, .svg) within the Outlook temporary directory paths mentioned in the rule.

  - **Analyze Email Attachments:** Investigate the emails received by users whose systems have triggered this alert, focusing on attachments that could correlate with the suspicious files detected. Look for patterns of phishing activity.

  - **Check User Behavior:** Assess the behavior of the users who triggered the alert. Determine if they were engaged in activities such as downloading or executing suspicious attachments in a short timeframe.

  - **Correlate with Threat Intelligence:** Cross-reference the identified file types and methods used in detected suspicious file creations with known threat intelligence related to phishing and malware distribution to ascertain possible attacker motives and tactics.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact through data compromise or the installation of persistent malware via spear-phishing campaigns. Given the likelihood of an attacker targeting user systems through crafted emails, prompt investigation is essential.

  ### Blind Spots and Assumptions
  This detection may not capture legitimate activities such as file creation when handling benign attachments that might use the same extensions, leading to false positives. The detection relies on the assumption that relevant logs are properly configured and collected from Windows event sources. If file creation logs are missing or incorrectly filtered, valid threats may go undetected, resulting in gaps in coverage. Additionally, the detection logic assumes attackers use specific known file types and extensions which may evolve over time, necessitating regular updates to the detection conditions.

