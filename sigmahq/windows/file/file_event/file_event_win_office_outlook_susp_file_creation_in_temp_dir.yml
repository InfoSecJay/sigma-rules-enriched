description: |
  Detects the creation of files with suspicious file extensions in the temporary directory that Outlook uses when opening attachments.
  This can be used to detect spear-phishing campaigns that use suspicious files as attachments, which may contain malicious code.
references:
- https://vipre.com/blog/svg-phishing-attacks-the-new-trick-in-the-cybercriminals-playbook/
- https://thecyberexpress.com/rogue-rdp-files-used-in-ukraine-cyberattacks/
- https://www.microsoft.com/en-us/security/blog/2024/10/29/midnight-blizzard-conducts-large-scale-spear-phishing-campaign-using-rdp-files/
author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron 
  Systems)
date: 2025-07-22
tags:
- attack.initial-access
- attack.t1566.001
logsource:
  product: windows
  category: file_event
detection:
  selection_extension:
    TargetFilename|endswith:
    - '.cpl'
    - '.hta'
    - '.iso'
    - '.rdp'
    - '.svg'
    - '.vba'
    - '.vbe'
    - '.vbs'
  selection_location:
  - TargetFilename|contains:
    - '\AppData\Local\Packages\Microsoft.Outlook_'
    - '\AppData\Local\Microsoft\Olk\Attachments\'
  - TargetFilename|contains|all:
    - '\AppData\Local\Microsoft\Windows\'
    - '\Content.Outlook\'
  condition: all of selection_*
falsepositives:
- Opening of headers or footers in email signatures that include SVG images or 
  legitimate SVG attachments
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with suspicious extensions in the temporary directory used by Microsoft Outlook for processing email attachments. Attackers often utilize spear-phishing campaigns that exploit file attachments, making this detection valuable for identifying potentially malicious file drops in a user environment. The relevant MITRE ATT&CK tactic is Initial Access, specifically technique T1566.001, which focuses on email spear-phishing.

  Primary telemetry sources include Windows file event logs (e.g., Event ID 4663) that capture file creations, particularly in directories like `\AppData\Local\Microsoft\Olk\Attachments\`. If the detection is confirmed malicious, it could lead to a data breach or unauthorized system access. Importantly, this detection alone does not confirm that the file is malicious; further analysis of the file contents and behavior is necessary.

  ### Investigation Steps

  - **Verify file creation event:** Check Windows Event ID 4663 within logs for the process creating the suspicious file (e.g., `.cpl`, `.hta`, `.iso`, `.rdp`, `.svg`, etc.) in the path `\AppData\Local\Microsoft\Olk\Attachments\` to confirm the timeline of the event.

  - **Identify file details:** Look for the newly created file's metadata such as size, creation time, and hash value to determine if it matches known malicious signatures. Cross-reference with tools like VirusTotal for any known threats.

  - **Evaluate user behavior:** Review the user activity leading up to the file creation in the Outlook application. Contextualize this against legitimate workflows, such as common file types used by the user or the frequency of attachment opens.

  - **Assess propagation methods:** Investigate any recent email communications received by the user for potential spear-phishing indicators, particularly focusing on messages that prompted opening attachments. Check for known sender addresses associated with phishing campaigns.

  - **Monitor for related activity:** Look for subsequent processes spawned from the created file. Security Event ID 4688 should be analyzed for any unusual process creations triggered by the suspicious file, confirming if it executed scripts or any commands.

  - **Track legitimate usage patterns:** Compare alerts to user installation scenarios. For instance, the creation of legitimate `.vba` files could occur during user-specific actions like Excel macro work, thus expecting normal activity patterns is crucial for context.

  ### Prioritization

  The alert severity is high due to the potential impact on the security posture if malicious behavior is confirmed. The likelihood of abuse is considerable, as spear-phishing is a common attack vector. With malicious file extensions frequently weaponized, timely analysis is critical to mitigate further risks.

  ### Blind Spots and Assumptions

  This detection may miss file creation events that have been steganographically concealed or files created in non-typical locations. Ensuring that all relevant log sources, such as file access logs, are configured and available is essential for reliable detection. Legitimate activities, such as opening specially crafted SVG files for benign purposes, can also trigger this alert. Companion detections related to email activity (e.g., failed logins from specific routing patterns) can enhance overall detection capabilities for related threats.

