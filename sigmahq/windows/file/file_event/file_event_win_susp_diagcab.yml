  ### Technical Context

  This rule detects the creation of `.diagcab` files within a Windows environment. Such files are typically associated with Microsoft’s diagnostic and support tools but may also indicate an attacker attempting to exploit vulnerabilities by leveraging legitimate-looking file formats to deploy malicious payloads. The primary MITRE ATT&CK tactic relevant here is **"Resource Development" (TA0042)**, specifically the technique **"Compromise Software Supply Chain" (T1195)**.

  The primary telemetry source includes Windows file event logs that capture the creation of files in the system. If this alert is triggered, it indicates potentially unauthorized file creation, which could be harmful if used to execute malicious scripts. However, it's critical to note that the creation of a `.diagcab` file does NOT confirm malicious activity outright without additional contextual evidence since it could also be a result of legitimate software or system maintenance processes.

  ### Investigation Steps

  - **Check the file path and name:** Investigate the creation path of the `.diagcab` file. Legitimate files are typically created within `C:\Users\<Username>\AppData\Local\Temp\` or `C:\Program Files\`. Files created in unusual directories (e.g., `C:\Windows\System32\`) warrant further scrutiny.

  - **Fetch relevant file/system events:** Examine Security Event ID **4663** (Access to an Object) for the `.diagcab` file to identify the process that created it, including timestamps, user context, and other associated Activity IDs.

  - **Analyze recent file activities:** Review Sysmon Event ID **11** (FileCreateStreamHash) for additional context on the `.diagcab`. Look for unusual file sizes and hashes that may indicate tampering or unexpected behavior.

  - **Correlate with Windows Installer Events:** Check Event ID **1033** (MSI Installer) to see if legitimate installer activity corresponds with the creation of the `.diagcab` file, helping to identify benign occurrences of file creation.

  - **Identify unauthorized executables:** Look for processes like `msiexec.exe` or scripts that could spawn the creation of the `.diagcab` file. If these are not recognized legitimate installations, categorize them as high-confidence indicators of potential malicious activity.

  ### Prioritization

  This alert should be treated as medium severity due to the potential for malicious exploitation using common file types. While the likelihood of abuse is moderate, the impact could be significant depending on the context of the affected system, particularly if it involves critical infrastructure or sensitive data processing.

  ### Blind Spots and Assumptions

  Detection may be limited if file creation logs are not properly captured on endpoints. Attackers may evades detection by using similar file types or disguising their activities under legitimate processes. Activities such as legitimate application installs may also trigger this alert. Additional detections in place, such as monitoring for suspicious PowerShell activities (`T1059.001`), could provide enhanced coverage against exploitation attempts associated with `.diagcab` files.

