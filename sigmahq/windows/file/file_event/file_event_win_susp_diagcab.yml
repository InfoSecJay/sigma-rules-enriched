  ---

  ### Technical Context

  This rule detects the creation of files with the `.diagcab` extension, which can be indicative of both legitimate software installation processes and potential malicious activity, such as exploitation attempts. Attackers may use `.diagcab` files to package malicious payloads or scripts disguised as legitimate diagnostics. The relevant MITRE ATT&CK tactic for this behavior is **Resource Development (TA0042)** and the technique is **Create or Modify System Process (T1203)**.

  Primary telemetry sources for this detection include Windows file system events, specifically monitoring file creations within systems where the presence of diagcab files is atypical. If the activity is determined to be malicious, it could lead to system compromise, data loss, or the establishment of persistent threats. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate applications may also generate diagcab files during updates or diagnostics.

  ---

  ### Investigation Steps

  - **Review file creation context: ** Check the creation time and user account associated with the `.diagcab` file under **Windows Security Event ID 4663**. Look for anomalies in user behavior, such as unusual account types or unexpected times.

  - **Examine the file location: ** Validate the directory where the diagcab file is located by checking the **Windows Security Event ID 4663**. Legitimate diagcab files are often found in system paths like `C:\Program Files\Microsoft\` or `C:\Windows\Temp\.` Paths outside of these may warrant further scrutiny.

  - **Identify associated processes: ** Cross-reference the creation event with process execution logs, such as **Sysmon Event ID 1** and **Windows Security Event ID 4688**, to find any suspicious parent processes, particularly those not aligned with standard software installations.

  - **Investigate file contents: ** If possible, obtain the diagcab file for analysis, focusing on unexpected scripts or executables within it. Malicious diagcab files may contain contents unrelated to typical system diagnostics.

  - **Validate historical presence: ** Check if the file or similar diagcab files have been created previously using **File History logs** or **Windows Event Viewer logs**. Frequent or recent appearance of diagcab files can indicate potential misuse.

  ---

  ### Prioritization

  The alert should be treated with medium severity. The impact depends on the asset involved; if it's a critical server or domain controller, the risk escalates significantly. While some diagcab files are legitimate, the behavior is not commonly weaponized, making context critical for evaluation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers using legitimate diagcab files disguised as something else or altering timestamps. Reliable detection requires logging configurations to be active for file creation events. Legitimate activities, such as new software installations, might trigger the alert. A related detection to enhance monitoring coverage includes tracking **PowerShell executions** (e.g., through PowerShell Transcription logs) to identify potentially suspicious PowerShell scripts that could accompany a diagcab file.

