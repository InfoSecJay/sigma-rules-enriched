logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Removed the start just in case the logging backend doesn't expand ENV variables when they're used
    - '\Microsoft\Event Viewer\RecentViews'
    - '\Microsoft\EventV~1\RecentViews'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects behaviors indicative of a User Account Control (UAC) bypass utilizing Windows Event Viewer. Attackers often aim to elevate privileges and execute harmful payloads without triggering security mechanisms. This behavior maps to the MITRE ATT&CK tactic of "Privilege Escalation" (TA0004) by leveraging the technique "Bypass User Account Control" (T1088).

  The primary telemetry sources include Windows file event logs targeting the Event Viewer recent views directory. If exploited, it could allow an adversary to execute processes with escalated privileges, significantly impacting system integrity. However, this detection does NOT confirm that a compromise has occurred on its own; additional context is necessary to substantiate malicious intent.

  ### Investigation Steps

  - **Check for Event Viewer activity**: Review security logs for Event ID 4688 to confirm process creation related to Event Viewer, specifically searching for events that reference the recent views directory in their command line.

  - **Examine file modification timestamps**: Analyze timestamps of files in `C:\Users\<Username>\AppData\Local\Microsoft\Event Viewer\RecentViews` to determine if they align with suspicious activity or if they were recently accessed in an unusual pattern.

  - **Identify the invoking user**: Review event logs to identify the user account that initiated the Event Viewer access, focusing on anomalies such as administrative accounts without any legitimate recent activity.

  - **Assess legitimate use cases**: Determine if there are any scheduled tasks or legitimate applications within your environment that frequently invoke Event Viewer, referencing `Event ID 4624` (Account logon events) for users in typical roles.

  - **Spot high-confidence malicious patterns**: Look for known malicious process paths, especially if the initiating command contains suspicious flags or parameters, particularly those designed to bypass UAC mechanisms.

  ### Prioritization

  The alert severity is high due to potential privilege escalation on critical systems. The likelihood that this behavior may be weaponized is significant, as adversaries frequently employ UAC bypass techniques in real-world attacks. Timely investigation is essential to mitigate potential security incidents.

  ### Blind Spots and Assumptions

  Detection limitations may arise from administrative users legitimately accessing Event Viewer for system monitoring, which could trigger false positives. Ensure that file event logs for user activities are correctly configured to capture relevant events during investigations. Another companion detection is monitoring for unusual command line activities related to elevated processes, which could further clarify the context around the detected behavior.

