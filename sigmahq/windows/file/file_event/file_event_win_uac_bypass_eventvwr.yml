logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Removed the start just in case the logging backend doesn't expand ENV variables when they're used
    - '\Microsoft\Event Viewer\RecentViews'
    - '\Microsoft\EventV~1\RecentViews'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) via manipulation of the Windows Event Viewer. Attackers typically seek to escalate privileges on compromised systems without raising alarms, allowing for the execution of malicious activities with elevated permissions. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and the technique of Bypass User Account Control (T1088).

  The primary telemetry source for this detection is Windows file event logs, specifically focusing on file operations targeting paths associated with the Event Viewer. If successful, an adversary can modify critical system behaviors or install persistent malware, significantly increasing the scope of a compromise. It is essential to note that this detection does NOT on its own confirm malicious intent; it may also capture legitimate administrative activities.

  ### Investigation Steps

  - **Review relevant event logs for UAC bypass attempts:** Check Windows File Event Logs for Event ID 4663 that capture access to the `C:\Microsoft\Event Viewer\RecentViews` or `C:\Microsoft\EventV~1\RecentViews` paths. Compare against known benign activities in these directories.

  - **Validate process origins:** Investigate the parent process associated with the event using Sysmon Event ID 1 logs. Look for processes spawned from `C:\Windows\System32\` or `C:\Windows\SysWOW64\`, noting any suspicious execution patterns suggesting malicious intent.

  - **Correlate with additional UAC logs:** Gather Windows Security Event ID 4672 (Special privileges assigned to new logon) and check for elevated logon events around the same timeframe to assess if a privilege escalation occurred after the detected access.

  - **Identify expected user behavior:** Baseline what legitimate user behavior looks like within the Event Viewer configuration for your organization. Typical activity should not involve continuous accesses to `RecentViews` or similar files without operational context.

  - **Monitor for competing alerts**: Cross-check with other detection rules focused on privilege escalation or anomalous process creation, such as attempts to execute commands with high privileges (e.g., Event ID 4688 for process creation events).

  ### Prioritization

  This alert is of high severity due to its potential impact on critical systems where UAC bypass could lead to full administrative privileges being granted to an attacker. The likelihood of malicious abuse is significant, as this technique is commonly weaponized in various attack vectors, particularly in targeted intrusions and ransomware campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging for all relevant security events; thus, proper log collection and retention are essential. Legitimate administrative tasks, especially by privileged accounts, may inadvertently trigger this alert. Strengthening detection coverage could involve utilizing companion detections that monitor for anomalous activity in high-privilege accounts or other lateral movement tactics, such as those involving PowerShell execution.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
