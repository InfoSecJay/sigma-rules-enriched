logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Removed the start just in case the logging backend doesn't expand ENV variables when they're used
    - '\Microsoft\Event Viewer\RecentViews'
    - '\Microsoft\EventV~1\RecentViews'
  filter:
    Image|startswith:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potential Unauthorized Access Control (UAC) bypass attempts on Windows systems through the misuse of the Event Viewer. UAC is a security feature designed to prevent unauthorized changes to the operating system, and attackers may exploit it to execute malicious code with elevated privileges. By crafting a mechanism that allows them to manipulate the Event Viewer, threat actors can circumvent these protections and perform actions that should be restricted.

  The primary objective of such attacks is often to escalate privileges on compromised systems, allowing attackers to gain further control over the environment, install malware, or exfiltrate sensitive data. This behavior typically aligns with the MITRE ATT&CK tactics of **Defense Evasion** (TA0005) and **Privilege Escalation** (TA0004), with relevant techniques including **Bypass User Account Control** (T1548) and **Exploitation for Client Execution** (T1203).

  The most relevant sources of telemetry to support the detection of this activity include **file event logs** that detail access to specific files and folders, particularly those associated with the Windows Event Viewer. Additionally, process creation events can provide insight into the execution of unusual binaries in the system directory.

  ### Investigation Steps
  - **Review File Access Logs:** Examine file event logs, specifically targeting accesses to `C:\Microsoft\Event Viewer\RecentViews` or its equivalent paths to identify suspicious interactions that could imply a UAC bypass.
  - **Check Process Creation Events:** Look for process creation logs that correspond with the detected file access. Investigate any unexpected processes initiated from `C:\Windows\System32\` or `C:\Windows\SysWOW64\`.
  - **Analyze User Context:** Assess whether the user context used for file access is elevated. Verify if this aligns with normal operational behaviors—any deviations might suggest malicious exploitation.
  - **Correlate with User Behavior:** Investigate the timeline and user activity preceding the event. Check for unusual patterns or previous alerts that may inform whether this behavior is part of a larger campaign or standalone incident.

  ### Prioritization
  Given that UAC bypass techniques can enable attackers to escalate privileges and execute further malicious actions, alerts generated by this rule are considered high severity. The potential impact on sensitive data and system integrity warrants prompt investigation to mitigate risks.

  ### Blind Spots and Assumptions
  This detection logic may lack coverage for scenarios where attackers utilize obfuscated methods or non-standard execution paths that do not interact with the targeted Event Viewer files. Additionally, the assumptions made include the proper logging of specific file access events by the system, which depends on appropriate audit configurations being enabled. If logging settings are misconfigured or not applied, this detection may fail to capture crucial malicious activities.

