title: Files With System DLL Name In Unsuspected Locations
id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
status: test
description: |
  Detects the creation of a file with the ".dll" extension that has the name of a System DLL in uncommon or unsuspected locations. (Outisde of "System32", "SysWOW64", etc.).
  It is highly recommended to perform an initial baseline before using this rule in production.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-24
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Note: Add more System DLL that can be abused for DLL sideloading to increase coverage
    - '\secur32.dll'
    - '\tdh.dll'
  filter_main_generic:
        # Note: It is recommended to use a more robust filter instead of this generic one, to avoid false negatives.
    TargetFilename|contains:
            # - '\SystemRoot\System32\'
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\uus\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Third party software might bundle specific versions of system DLLs.
# Note: Upgrade to high after an initial baseline to your environement.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_creation_system_dll_files/info.yml
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of files with a ".dll" extension that have names matching known system DLLs in unusual or unexpected locations. The behavior typically indicates attempts at DLL sideloading, often used by attackers to execute malicious code while bypassing standard security measures. The likely attacker objective is to execute malicious payloads under the guise of legitimate system processes.

  The relevant MITRE ATT&CK tactics and techniques are Defense Evasion (TA0005) and Masquerading (T1036.005). Primary telemetry sources include Windows file creation events (Event ID 4663) and potentially Sysmon logs for detailed file activity (Event ID 11). If malicious, this behavior poses significant risks, such as compromise of system integrity or escalated privileges. However, this detection does NOT confirm active exploitation or successful execution of malicious code solely based on file creation.

  ---

  ### Investigation Steps

  - **Review file creation events:** Check Windows Security Event ID 4663 for detailed logs on the created DLL file. Look for uncommon paths outside standard Windows directories like `C:\Windows\System32\`.

  - **Examine Sysmon logs for anomalies:** Use Sysmon Event ID 11 to analyze file creation and access patterns. Verify if the file creation correlates with other suspicious activities on the host.

  - **Validate the legitimacy of the file location:** Confirm whether the DLL file resides in expected directories. Legitimate system DLLs should only be found in `C:\Windows\System32\`, `C:\Windows\SysWOW64\`, or `C:\Windows\WinSxS\`.

  - **Identify high-confidence malicious indicators:** Investigate whether the file creation was followed by execution events (Event ID 4688 or Sysmon Event ID 1) that indicate an unusual child process was spawned from a legitimate parent process.

  - **Assess the asset's criticality:** Determine the role of the affected host (e.g., server, endpoint) and its importance to the organization to prioritize further actions.

  - **Investigate file behavior post-creation:** Check for unusual process activity that may indicate attempted execution of the newly created DLL, especially if it corresponds with known attack patterns or behaviors.

  ---

  ### Prioritization

  This alert should be treated as medium severity due to the potential impact of malware executing in an enterprise environment. While the likelihood of DLL sideloading being abused is moderate, it is a recognized and weaponized technique in various attack vectors, making timely investigation essential.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate applications that bundle system DLLs into unexpected locations, creating false positives. Ensure appropriate logging, such as enabling detailed file system auditing or Sysmon, is in place for accurate detection. Be aware that legitimate software updates or installations may also trigger this alert. Additional detections, such as monitoring for process execution from unusual DLL locations, can further strengthen coverage against this tactic.

