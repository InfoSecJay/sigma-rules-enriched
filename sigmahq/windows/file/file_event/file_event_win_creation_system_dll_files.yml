title: Files With System DLL Name In Unsuspected Locations
id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
status: test
description: |
  Detects the creation of a file with the ".dll" extension that has the name of a System DLL in uncommon or unsuspected locations. (Outisde of "System32", "SysWOW64", etc.).
  It is highly recommended to perform an initial baseline before using this rule in production.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-24
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Note: Add more System DLL that can be abused for DLL sideloading to increase coverage
    - '\secur32.dll'
    - '\tdh.dll'
  filter_main_generic:
        # Note: It is recommended to use a more robust filter instead of this generic one, to avoid false negatives.
    TargetFilename|contains:
            # - '\SystemRoot\System32\'
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\uus\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Third party software might bundle specific versions of system DLLs.
# Note: Upgrade to high after an initial baseline to your environement.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_creation_system_dll_files/info.yml
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of files with a ".dll" extension that use the names of system DLLs but are located in unexpected directories outside the standard system locations (e.g., "System32" or "SysWOW64"). The primary objective of an attacker in this context is likely to execute malicious code through DLL sideloading, attempting to evade detection by placing these files in less scrutinized locations.

  This behavior maps to the MITRE ATT&CK tactic "Defense Evasion" and the technique T1036.005 (Masquerading: Duration). The primary telemetry source for this detection is Windows file event logs that capture file creation activities (Event ID 4663 or Sysmon Event ID 10). If malicious, such activities can lead to system compromise, unauthorized access, or persistence strategies.

  It is important to note that this detection does NOT confirm malicious intent on its own; legitimate applications may also create these files in unusual locations for non-malicious reasons.

  ---

  ### Investigation Steps

  - **Review the creation path of the DLL:**
    Verify the `TargetFilename` field in Event ID 4663 logs to ensure the DLL is created in a suspicious directory. Legitimate DLLs typically reside in "C:\Windows\System32\" or "C:\Windows\SysWOW64\".

  - **Correlate with process creation logs:**
    Check Sysmon Event ID 1 logs around the same time to identify the parent process that created the suspicious DLL. A process like `powershell.exe` or `cmd.exe` may indicate malicious intent.

  - **Identify file size and hash:**
    Calculate and analyze the hash (e.g., SHA256) of the suspicious DLL file. Compare it against known malicious DLL hashes from threat intelligence sources and local baselines.

  - **Examine user context:**
    Investigate the user context that created the DLL using Event ID 4688 (process creation log). Unusual user accounts, especially those with limited access rights, can indicate potential misuse.

  - **Assess recent software installations or updates:**
    Review logs from Windows Installer events (Event ID 1033) or any recent installations. Third-party software might bundle versioned system DLLs in their own directories, leading to legitimate file creation.

  - **Check for execution or access attempts:**
    Confirm if there have been attempts to execute or access the affected DLL file using Windows Security Event ID 4688 or Sysmon Event ID 11. Legitimate files may not have been executed or frequently accessed.

  ---

  ### Prioritization

  In an enterprise context, this alert is of medium severity. The likelihood of malicious abuse is moderate since attackers commonly leverage DLL sideloading techniques to execute payloads. However, the impact is elevated on critical systems where malicious DLLs could lead to significant breaches or system failures.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers mask their activities by using obscure directory names that aren't commonly monitored. The necessity of correct and comprehensive logging is essential; without capturing file events adequately, detection could fail. Additionally, legitimate software updates or installations may trigger these alerts. A related detection rule for monitoring process injection (T1055) would complement this coverage and enhance overall forensic insight into malicious activities.

