title: Files With System DLL Name In Unsuspected Locations
id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
status: test
description: |
  Detects the creation of a file with the ".dll" extension that has the name of a System DLL in uncommon or unsuspected locations. (Outisde of "System32", "SysWOW64", etc.).
  It is highly recommended to perform an initial baseline before using this rule in production.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-24
tags:
- attack.defense-evasion
- attack.t1036.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Note: Add more System DLL that can be abused for DLL sideloading to increase coverage
    - '\secur32.dll'
    - '\tdh.dll'
  filter_main_generic:
        # Note: It is recommended to use a more robust filter instead of this generic one, to avoid false negatives.
    TargetFilename|contains:
            # - '\SystemRoot\System32\'
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\uus\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Third party software might bundle specific versions of system DLLs.
# Note: Upgrade to high after an initial baseline to your environement.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_creation_system_dll_files/info.yml
note: |
  ### Technical Context
  This rule detects the creation of files with a `.dll` extension that have names corresponding to known system DLLs, specifically when these files are found in atypical locations outside recognized directories such as `System32` and `SysWOW64`. The primary focus is on identifying potential obfuscation tactics employed by threat actors to sideload malicious DLL files; by placing them in unexpected locations, adversaries may evade detection by security solutions expecting legitimate DLLs to reside in standard directories.

  The underlying threat scenario typically involves attackers seeking to achieve persistence or to execute arbitrary code within the context of trusted applications. By leveraging system DLL names, they can trick processes into loading malicious code through DLL sideloading methods. This tactic aligns with the MITRE ATT&CK techniques of Defense Evasion (T1036.005), highlighting the importance of monitoring atypical file creation behavior on Windows systems.

  Relevant telemetry for this rule includes file creation events from Windows endpoints, particularly logs that track changes in file systems, ensuring evidence of unusual file activities is captured comprehensively.

  ### Investigation Steps
  - **Capture File Creation Logs:** Review logs from the file event source to identify the creation timestamps and paths of new `.dll` files, particularly focusing on any that are not located in standard directories.

  - **Analyze Process Activity:** Investigate associated process creation events occurring shortly before or after the creation of suspicious DLL files to determine if legitimate applications are attempting to load them.

  - **Check for Known DLLs:** Cross-reference the detected DLL names against a list of legitimate system DLLs to assess whether any are being misused or associated with malicious activities.

  - **Inspect Environment Configuration:** Ensure that necessary logging configurations are in place to capture detailed file activity, which may involve validating Windows auditing policies to enhance visibility into file creation events.

  ### Prioritization
  The alert's severity is designated as medium due to the potential for significant impact associated with malicious DLL injection and sideloading. Unusual DLL creation in unexpected directories is a strong indicator of possible compromise, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of DLL sideloading or obfuscation, particularly if adversaries are leveraging alternative methods to hide their activities or are using non-standard naming conventions for their malicious files. Additionally, reliance on file event logs presumes adequate logging policies are enabled and that the logging scope is comprehensive; without proper configurations, critical events may be missed, thus limiting detection efficacy.

