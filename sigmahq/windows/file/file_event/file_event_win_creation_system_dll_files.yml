title: Files With System DLL Name In Unsuspected Locations
id: 13c02350-4177-4e45-ac17-cf7ca628ff5e
status: test
description: |
  Detects the creation of a file with the ".dll" extension that has the name of a System DLL in uncommon or unsuspected locations. (Outisde of "System32", "SysWOW64", etc.).
  It is highly recommended to perform an initial baseline before using this rule in production.
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-06-24
tags:
- attack.stealth
- attack.t1036.005
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Note: Add more System DLL that can be abused for DLL sideloading to increase coverage
    - '\secur32.dll'
    - '\tdh.dll'
  filter_main_generic:
        # Note: It is recommended to use a more robust filter instead of this generic one, to avoid false negatives.
    TargetFilename|contains:
            # - '\SystemRoot\System32\'
    - 'C:\$WINDOWS.~BT\'
    - 'C:\$WinREAgent\'
    - 'C:\Windows\SoftwareDistribution\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    - 'C:\Windows\WinSxS\'
    - 'C:\Windows\uus\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Third party software might bundle specific versions of system DLLs.
# Note: Upgrade to high after an initial baseline to your environement.
level: medium
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_creation_system_dll_files/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with a ".dll" extension that have names identical to known system DLLs but are located in unusual or unexpected directories (e.g., outside of "System32" and "SysWOW64"). Such behavior suggests an adversary attempting to execute malicious code by sideloading DLLs, which is often targeted for stealth and evasion purposes. The primary MITRE ATT&CK tactic relevant here is "Defense Evasion" (ID: TA0005), specifically the technique of "DLL Sideloading" (ID: T1036.005). The primary telemetry sources are Windows file event logs indicating file creations, particularly focusing on directories that are atypical for legitimate system DLLs. The security impact of this behavior is significant; if malicious, it could allow an attacker to execute unauthorized code within the context of a trusted system process. However, this detection does NOT confirm that the detected file is being executed or utilized maliciously; further investigation is required.

  ### Investigation Steps

  - **Check event logs for DLL creations:** Examine Windows Security Event ID 4663 and File System event logs for file creation events, specifically filtering for ".dll" files in unexpected locations such as "C:\Users," "C:\Temp," or any user profile directory.

  - **Validate against known good:** Compare the detected filenames against a hash database of legitimate system DLLs to determine if it registers as malicious or benign. Known hashes for legitimate versions can be cross-referenced using tools like VirusTotal or internal threat repositories.

  - **Identify execution context of the file:** Investigate any related process creation logs (Event ID 4688) to see if the newly created DLL file is loaded by any executable. Pay close attention to processes with abnormal parents or command-line arguments.

  - **Assess asset vulnerabilities:** If detected on critical hosts (e.g., domain controllers or financial servers), prioritize analysis due to the high risk and potential impact of any malicious files created on these systems.

  - **Review installation or update software behaviors:** Document and evaluate if third-party software installations recently occurred that could explain the file creation legitimately; review installation event logs (Event ID 11707) for installations that may generate such DLLs.

  ### Prioritization

  The alert's severity is medium. While the behavior can indicate malicious activity, it may also reflect benign actions by legitimate software installations. The likelihood of abuse is moderate as DLL side-loading techniques are commonplace among advanced threat actors, but initial baseline data is necessary to filter false positives effectively.

  ### Blind Spots and Assumptions

  Detection may miss instances where an attacker invokes legitimate processes to load the DLL. Ensuring all relevant file system monitoring is in place is crucial; some environments may lack comprehensive logging configurations. Legitimate applications may occasionally trigger this rule when updating or creating required components, such as by third-party installations from trusted vendors. A related detection to consider involves monitoring for process injections or unusual command lines in Event ID 4688 to supplement DLL detection efforts.

