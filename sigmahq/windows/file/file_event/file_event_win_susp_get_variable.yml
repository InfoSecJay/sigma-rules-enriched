logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: 'Local\Microsoft\WindowsApps\Get-Variable.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the creation of a file named `Get-Variable.exe` in the `Local\Microsoft\WindowsApps\` directory, which is indicative of an adversary mimicking a legitimate PowerShell cmdlet to execute malicious payloads. The likely attacker objective is to gain persistence on the system by leveraging a common command, thereby circumventing standard security controls. The relevant MITRE ATT&CK tactic is **Persistence** (T1546) and the technique is **Masquerading - Match Legitimate Software** (T1027).

  Primary telemetry sources include Windows file event logs, specifically looking for file creation events. If this behavior is malicious, it can result in unauthorized system access, privilege escalation, and exploitation of sensitive data. Importantly, this detection does NOT confirm malicious intent on its own; further context is required to establish whether `Get-Variable.exe` is a legitimate application or a decoy for a malicious payload.

  ---

  ### Investigation Steps

  - **Review file creation details:** Check for Event ID 4663 in Security logs to identify creation of `Get-Variable.exe`, including the user who executed the action. Compare timestamps with user activity logs to identify any anomalous timing.

  - **Correlate with PowerShell log activity:** Look for PowerShell logs (Event ID 4103) to see if there were any suspicious `Get-Variable` calls within 5 minutes before and after file creation. Legitimate usage generally coincides with known administrative tasks.

  - **Examine process execution history:** Use Sysmon Event ID 1 to investigate if `Get-Variable.exe` was executed and if it spawned any child processes. Legitimate executions will typically not exhibit unusual behavior or additional command-line arguments.

  - **Identify parent process:** Check if the creation of `Get-Variable.exe` is initiated by any benign parent process (e.g., PowerShell or a legitimate system task) or if it is part of a chain from known malicious tools (e.g., Cobalt Strike).

  - **Check for persistence mechanisms:** Inspect the Task Scheduler for any tasks created around the same time that may point to a persistence mechanism utilizing `Get-Variable.exe`. Typical legitimate tasks will have recognizable names and descriptions.

  - **Validate file integrity and reputation:** Use tools like Windows Defender or other threat intelligence services to analyze the file and assess if `Get-Variable.exe` has a known signature or reputation, flagging any low-trust characteristics indicating potential malicious intent.

  ---

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on system compromise and persistence mechanisms. The likelihood of unauthorized use is elevated, especially since it exploits legitimate command structure. This behavior is not frequently seen in benign contexts, making further investigation critical.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited due to potential evasion techniques such as renaming or obfuscation of the executable. Reliable detection requires logging configurations for both file events and PowerShell command execution. Legitimate activities that may trigger this rule include non-malicious scripted automation processes that erroneously create similarly named files. A related detection to strengthen coverage could involve monitoring for abnormal PowerShell utilization patterns associated with potentially malicious activities (e.g., suspicious cmdlet usage).

