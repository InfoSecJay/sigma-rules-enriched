logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: 'Local\Microsoft\WindowsApps\Get-Variable.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of a suspicious executable file named `Get-Variable.exe` within the `C:\Local\Microsoft\WindowsApps\` directory, which is a known technique associated with various forms of attack, particularly by threat actors utilizing persistence methods. In this scenario, attackers may exploit the name of a legitimate PowerShell cmdlet to disguise their malicious intent, tricking the operating system into executing the harmful file instead of the intended PowerShell command. This can lead to privilege escalation, malware execution, or data exfiltration.

  The relevant MITRE ATT&CK tactics include **Persistence** (TA0003), as this technique can be leveraged to maintain an attacker's presence across system reboots, and **Defense Evasion** (TA0005), where the attacker avoids detection by mimicking a legitimate command. Additional techniques that apply include **Indicator Removal on Host** (T1070) if the malicious executable is subsequently hidden or manipulated after creation, and **Exploitation of Remote Services** (T1210) if the malware seeks to connect to external environments.

  Primary data sources for this detection include **file creation events** from Windows file systems, which can provide insights into when and where suspicious files were created.

  ### Investigation Steps
  - **Review File Events:** Check Windows file event logs for the creation of `Get-Variable.exe`, noting the exact time and user context under which it was created.
  - **Analyze PowerShell Command History:** Examine PowerShell command logs (if available) for commands issued prior to the creation of `Get-Variable.exe`, focusing on any unusual or suspicious activity that may indicate malicious use.
  - **Correlate with Process Execution Logs:** Investigate process creation events to see if any instance of PowerShell invoked `Get-Variable.exe` shortly after its creation, as this may indicate execution of the malicious binary under the guise of the legitimate cmdlet.
  - **Verify User Context:** Check user accounts associated with the creation and execution of the file. Look for service accounts or users with unusual privileges, as attackers often employ compromised or unauthorized accounts.

  ### Prioritization
  This alert is classified as high severity due to the potential for attackers to establish persistence using legitimate names for their malicious files, which poses a significant risk to the organization's IT infrastructure and security posture.

  ### Blind Spots and Assumptions
  The detection logic assumes that the malicious executable will be named exactly as specified (`Get-Variable.exe`) and will appear in the defined directory. Gaps in detection coverage may include scenarios where the file is executed from alternate, non-standard paths or renamed to avoid detection. Additionally, if PowerShell command logging is disabled, there may be insufficient visibility into the context and intent behind the file's creation. Effective detection requires proper logging configurations at both the system and application levels to ensure comprehensive visibility into file and command activity.

