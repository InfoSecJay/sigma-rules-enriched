title: Suspicious Get-Variable.exe Creation
id: 0c3fac91-5627-46e8-a6a8-a0d7b9b8ae1b
status: test
description: |
  Get-Variable is a valid PowerShell cmdlet
  WindowsApps is by default in the path where PowerShell is executed.
  So when the Get-Variable command is issued on PowerShell execution, the system first looks for the Get-Variable executable in the path and executes the malicious binary instead of looking for the PowerShell cmdlet.
references:
- https://blog.malwarebytes.com/threat-intelligence/2022/04/colibri-loader-combines-task-scheduler-and-powershell-in-clever-persistence-technique/
- https://www.joesandbox.com/analysis/465533/0/html
author: frack113
date: 2022-04-23
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546
- attack.defense-evasion
- attack.t1027
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith: 'Local\Microsoft\WindowsApps\Get-Variable.exe'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a file named `Get-Variable.exe` in the `Local\Microsoft\WindowsApps` directory, where PowerShell is executed. This filename is typically associated with legitimate PowerShell functionality, but adversaries may use it to evade detection by masquerading malicious binaries as valid commands. The likely attacker objective is to achieve persistence or elevate privileges by leveraging a trusted environment (PowerShell) while executing malicious code under the guise of a legitimate cmdlet.

  The relevant MITRE ATT&CK tactics and techniques include T1546 (Event Triggered Execution) and T1027 (Obfuscated Files or Information). The primary telemetry sources required for this detection are Windows file event logs. The security impact is significant, as a malicious binary executed in this way can lead to further exploitation or data compromise. However, this detection does NOT confirm that the binary is malicious; further investigation is required to determine intent.

  ### Investigation Steps

  - **Check file attributes:** Review the file creation time and metadata for `Get-Variable.exe` in `Local\Microsoft\WindowsApps` (e.g., using PowerShell `Get-Item` or File Explorer). Legitimate files in this location should be time-correlated with system updates, not abnormal timestamps.

  - **Analyze process activity:** Investigate process creation events (Security Event ID 4688 or Sysmon Event ID 1) related to `Get-Variable.exe`. Look for parent processes that indicate a potentially suspicious command line execution, such as PowerShell commands that invoke `Get-Variable`.

  - **Cross-reference with known malicious hashes:** Verify the hash of `Get-Variable.exe` against threat intelligence feeds or internal blacklist databases. Specific hashes associated with known malware should raise a high-confidence alert.

  - **Identify PowerShell command usage:** Check PowerShell command invocation logs (e.g., PowerShell transcription logs or Event ID 4104). Legitimate use cases include typical administrative scripts and user activity; deviations may suggest exploitation attempts.

  - **Review security solutions alerts:** Collect alerts from endpoint protection solutions for additional context on this file's behavior or any detections related to `Get-Variable.exe`. Malware detection efforts may have triggered alerts that assist in determining malice.

  ### Prioritization

  This alert should be treated as high severity due to the likelihood of privilege escalation and the potential for unauthorized persistence mechanisms via a commonly used administrative tool (PowerShell). The behavior is indicative of advanced threats that often utilize obfuscation and evasion techniques, heightening the risk.

  ### Blind Spots and Assumptions

  Detection is limited by the possibility of file renaming or hiding malicious actions that do not involve file creation. Additionally, if the logging level is inadequate, events may not be captured. Legitimate software installations or updates may create similar files that could trigger this rule without malicious intent. A related detection to consider is monitoring for suspicious PowerShell command execution patterns that could align with `Get-Variable.exe` usage, enhancing overall coverage against exploitation attempts.

