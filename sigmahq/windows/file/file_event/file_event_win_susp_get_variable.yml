note: |
  ### Technical Context

  This rule detects the creation of a malicious binary named `Get-Variable.exe`, which is executed by PowerShell. Attackers may use this technique to circumvent PowerShell's inherent security mechanisms by deploying a file that masquerades as a legitimate PowerShell cmdlet, fulfilling an objective of establishing persistence or executing commands stealthily. This behavior aligns with MITRE ATT&CK tactic "Persistence" (TA0003) and technique "Masquerading" (T1036).

  The primary telemetry source is Windows file event logs that capture file creation events. Specifically, the detection relies on monitoring local Microsoft Windows application directories where the malicious executable might reside. If malicious, this behavior indicates an elevated risk of unauthorized access and potentially further malware deployment. However, this detection does NOT confirm actual execution of the binary or any specific malicious activity beyond its creation.

  ### Investigation Steps

  - **Verify file creation event:** Check Windows Security Event ID 4663 for 'Get-Variable.exe' creation within 'Local\Microsoft\WindowsApps'. Confirm timestamps aligning with the alert.

  - **Analyze file properties:** Inspect the file properties of `Get-Variable.exe` for irregularities such as an atypical author or manipulation dates using a command like `Get-Item "C:\Users\<Username>\AppData\Local\Microsoft\WindowsApps\Get-Variable.exe"` in PowerShell.

  - **Determine PowerShell invocation context:** Examine PowerShell command history or logs, focusing on suspicious command execution around the time the file was created (Event ID 4104, where you can check for any commands that resemble an obfuscation pattern).

  - **Assess legitimate usage patterns:** Confirm if legitimate applications or services commonly use `Get-Variable.exe`, and document typical behavior. For instance, legitimate PowerShell users typically access defined cmdlets without creating binaries.

  - **Identify malicious indicators:** Look for anomaly patterns indicating malicious behavior, such as a subsequent execution of the `Get-Variable.exe` file using a command like `Get-Process | Where-Object { $_.Path -like "*Get-Variable.exe*" }`.

  - **Monitor for persistence mechanisms:** Investigate if `Get-Variable.exe` is involved in task scheduling (via Event ID 4698), which may indicate attempts to maintain persistence and affect system integrity.

  ### Prioritization

  This alert carries high severity due to the potential impact on the affected system, particularly if it’s a critical endpoint. The likelihood of malicious abuse is significant, given the tactical use of masquerading techniques for exploitation and lateral movement. This behavior is often used in real-world attacks, making timely investigation crucial.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging for file system activities; if file auditing is not enabled, creation events may not be captured effectively. Legitimate activities, such as software installations or updates, may also create executables with similar patterns. A related detection for improved coverage would be monitoring scheduled tasks for suspicious entries that could leverage the presence of `Get-Variable.exe` in known application paths.

