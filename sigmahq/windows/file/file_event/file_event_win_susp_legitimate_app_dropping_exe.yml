title: Legitimate Application Dropped Executable
id: f0540f7e-2db3-4432-b9e0-3965486744bc
status: test
description: Detects programs on a Windows system that should not write executables
  to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2023-06-22
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - '\eqnedt32.exe'
    - '\wordpad.exe'
    - '\wordview.exe'
            # LOLBINs that can be used to download executables
    - '\certutil.exe'
    - '\certoc.exe'
    - '\CertReq.exe'
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - '\Desktopimgdownldr.exe'
    - '\esentutl.exe'
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.exe'
    - '.dll'
    - '.ocx'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  The detection rule titled "Legitimate Application Dropped Executable" identifies instances where certain legitimate applications on a Windows system write executable files to disk. This behavior is atypical for these applications, which typically do not create or download executables. Attackers may exploit legitimate software to evade detection, leveraging tools such as Office applications or system utilities to drop malicious executables. The primary goal here is to maintain a foothold in the environment or facilitate further malicious actions while remaining undetected.

  This detection aligns with several MITRE ATT&CK tactics and techniques, notably **Defense Evasion** (T1203) and **Command and Scripting Interpreter** (T1218). By leveraging trusted processes, an adversary can generate a false sense of normalcy, masking their malicious activities under legitimate software behaviors.

  Key telemetry and log sources for this detection include **Windows file event logs** from the operating system, which track file creation and modification events. Focusing on these logs allows for the identification of unusual executable writing events initiated by known benign processes.

  ### Investigation Steps
  - **Review File Event Logs**: Check Windows file event logs for entries indicating that specified legitimate applications are creating or dropping executable files (e.g., .exe, .dll, .ocx).
  - **Analyze Parent-Child Process Relationships**: Investigate the process tree to determine the parent processes that initiated the suspicious behavior, as legitimate applications should not be responsible for dropping executables.
  - **Correlate with Security Alerts**: Cross-reference alerts from EDR or antivirus solutions that may signify other suspicious activities in tandem with executable drops.
  - **Use File Integrity Monitoring**: If in place, review any changes made to the file system, especially the creation of unexpected executables, alongside timestamps of known legitimate application activity.

  ### Prioritization
  The severity of this alert is high due to the potential risk of malware deployment in the enterprise environment, which could lead to data exfiltration, system compromise, or lateral movement within the network. The likelihood of encountering this activity necessitates immediate attention and thorough investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage concerning non-standard applications that are not included in the rule but may exhibit similar behaviors. The detection logic assumes that these specified applications will not legitimately drop executables; however, environmental policies or updates may alter this scenario. Additionally, the rule requires proper SIEM configurations to ensure visibility into file event logging and integration with security tools to provide comprehensive monitoring and alerting capabilities.

