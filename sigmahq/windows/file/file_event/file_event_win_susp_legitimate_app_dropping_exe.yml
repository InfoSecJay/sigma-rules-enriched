title: Legitimate Application Dropped Executable
id: f0540f7e-2db3-4432-b9e0-3965486744bc
status: test
description: Detects programs on a Windows system that should not write 
  executables to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2023-06-22
tags:
- attack.defense-evasion
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - '\eqnedt32.exe'
    - '\wordpad.exe'
    - '\wordview.exe'
            # LOLBINs that can be used to download executables
    - '\certutil.exe'
    - '\certoc.exe'
    - '\CertReq.exe'
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - '\Desktopimgdownldr.exe'
    - '\esentutl.exe'
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.exe'
    - '.dll'
    - '.ocx'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects processes on Windows systems that are typically not designed to drop executable files to disk, such as Microsoft Office applications and other well-known legitimate applications. The likely attacker objective is to use these trusted processes (often referred to as LOLBins or Living Off The Land Binaries) to evade detection and facilitate malicious activities, such as downloading or executing malware. Relevant MITRE ATT&CK tactics include Defense Evasion (T1562) and the use of LOLBins (T1218).

  The primary telemetry source is Windows file event logs, capturing process activity that includes the creation of executable files (Event ID 4663 or Sysmon Event ID 11). If malicious, this behavior can lead to malware execution, system compromise, or further exploitation within the environment. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications can behave in ways that trigger this rule.

  ### Investigation Steps

  - **Review process creation logs:**
    Examine Security Event ID 4688 or Sysmon Event ID 1 for the processes mentioned in the rule. Look for unexpected instances of Microsoft Office applications or LOLBins attempting to drop executable files to disk.

  - **Verify dropped file locations:**
    Check for Event ID 4663 or Sysmon Event ID 11 focusing on file creation in critical directories (e.g., C:\Windows\Temp, C:\Users\{username}\Downloads). Legitimate applications rarely create executables in these locations.

  - **Analyze command line activity:**
    Investigate the command line arguments for the detected parent processes (using Sysmon Process Create Events) to identify any suspicious flags or URLs that indicate the downloading or execution of additional payloads.

  - **Assess file types and permissions:**
    Check the dropped file's properties to confirm the file extensions are as reported (.exe, .dll, .ocx) and evaluate their digital signatures. Legitimate software should have valid publisher signatures.

  - **Determine historical behavior:**
    Investigate the history of the applications involved by checking Windows Event Logs for previous instances of these applications dropping files. Frequent triggers could indicate benign internal usage versus unusual behavior.

  - **Identify additional indicators of compromise (IoCs):**
    Look for other alerts in SIEM correlating to the same host or user account, especially any prior suspicious network connections or abnormal behavior linked to the reported process.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems where unauthorized executables could lead to data breaches or network compromise. The likelihood of malicious abuse is elevated given the use of trusted binaries to execute malicious actions. This behavior is common in sophisticated attacks designed to blend in and avoid detection.

  ### Blind Spots and Assumptions

  This detection may be limited by the legitimate use of software that can also invoke these behaviors, leading to false positives. Additionally, without endpoint monitoring in place, crucial logs (like file creation events) might not be captured reliably. Legitimate applications, such as Microsoft Office or utilities like CertUtil, can trigger this rule under specific conditions. A related detection may include monitoring for anomalous network activity from the same process, which strengthens detection coverage of potential exfiltration or command-and-control communication.

