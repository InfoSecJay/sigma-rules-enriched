title: Legitimate Application Dropped Executable
id: f0540f7e-2db3-4432-b9e0-3965486744bc
status: test
description: |
  Detects LOLBINs and applications that should not legitimately drop executable or executable-equivalent files to disk.
  This may indicate malware staging, process injection, or abuse of a trusted binary for payload delivery.
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
- https://dmpdump.github.io/posts/TelegramRat/
- https://www.virustotal.com/gui/file/a0d5b30578acd1df9139e7a8a4bfc659dc2cf48f4dc0c5804b70890adeb9fa21/behavior
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2026-05-11
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - '\eqnedt32.exe'
    - '\wordpad.exe'
    - '\wordview.exe'
            # LOLBINs that can be used to download executables
    - '\certutil.exe'
    - '\certoc.exe'
    - '\CertReq.exe'
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - '\Desktopimgdownldr.exe'
    - '\esentutl.exe'
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.com'
    - '.dll'
    - '.exe'
    - '.jar'
    - '.ocx'
    - '.pyc'
  condition: selection
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_exe/info.yml
note: |
  ### Technical Context

  This rule detects when certain legitimate applications, including commonly-used administration tools and Microsoft Office programs, drop executable files (including .exe, .dll, etc.) to disk. Such behavior is atypical for these applications and may indicate an attacker is using them as a means to stage malware or execute malicious code by leveraging trusted binaries. This activity would likely correspond to the MITRE ATT&CK technique T1218 (Signed Binary Proxy Execution) as it employs legitimate tools for malicious purposes.

  The primary telemetry sources are Windows file event logs, specifically monitoring for events where trusted applications create executable file types. If malicious, this behavior could facilitate a myriad of attack scenarios, including lateral movement or payload delivery. However, this detection alone does not confirm an ongoing attack, as legitimate administrative activities might inadvertently generate similar alerts.

  ### Investigation Steps

  - **Review Security Event Logs for File Creation Events:** Check for Windows Event ID 4663 or Sysmon Event ID 11 that log the creation of files. Focus on the creation timestamps for alignment with alert triggers.

  - **Identify the Parent Process:** Correlate the detected executable drop with preceding process creation events (Event ID 4688 or Sysmon Event ID 1) to identify the origins. Legitimate application behavior should not show unusual or unexpected parent processes associated with these events.

  - **Examine Process Command-Line Arguments:** Review the command line of the parent process to identify unusual flags or behaviors indicative of malicious activity. Legitimate command-line arguments will typically match known patterns for the application being executed.

  - **Check for Known Legitimate Patterns:** Determine if the identified applications are being used in a standard operational context. For example, typical use of `certutil.exe` may not involve dropping executable files unless coupled with specific administrative scripts or file transfers.

  - **Investigate the File Characteristics:** Validate the dropped executable by checking its hash against known threat databases (e.g., VirusTotal). A high-confidence malicious indicator is a low-reputation hash associated with malware behavior.

  - **Assess Asset Importance and Impact:** Consider the role of the host where the event occurred (e.g., a domain controller may require a higher scrutiny level compared to a standard user workstation). Document any context that enhances understanding of the potential impact.

  ### Prioritization

  This alert carries a high severity due to the potential compromise of trusted applications for malicious purposes. Systems exhibiting this behavior could serve as a foothold for an attacker within the network, leading to further exploitation. Such manipulation of legitimate binaries is a recognized tactic used in various malicious campaigns.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of alternate file extensions or benign-looking filenames that may bypass detection. Also, certain legitimate use cases could trigger this alert, such as administrative scripts that legitimately drop executables. To ensure reliable detection, confirm that all relevant Windows file event logging is enabled, including adequate retention policies for historical analysis. Companion detections, such as anomalous network activity following the executable drop, could enhance overall coverage and context for investigations.

