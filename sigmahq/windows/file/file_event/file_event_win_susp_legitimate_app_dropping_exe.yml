title: Legitimate Application Dropped Executable
id: f0540f7e-2db3-4432-b9e0-3965486744bc
status: test
description: Detects programs on a Windows system that should not write 
  executables to disk
references:
- https://github.com/Neo23x0/sysmon-config/blob/3f808d9c022c507aae21a9346afba4a59dd533b9/sysmonconfig-export-block.xml#L1326
author: frack113, Florian Roth (Nextron Systems)
date: 2022-08-21
modified: 2023-06-22
tags:
- attack.stealth
- attack.t1218
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith:
            # Microsoft Office Programs Dropping Executables / Rest of the apps are covered in: c7a74c80-ba5a-486e-9974-ab9e682bc5e4
    - '\eqnedt32.exe'
    - '\wordpad.exe'
    - '\wordview.exe'
            # LOLBINs that can be used to download executables
    - '\certutil.exe'
    - '\certoc.exe'
    - '\CertReq.exe'
            # - \bitsadmin.exe (depends on the environment; comment in if you're sure that bitsadmin doesn't do that in your env)
    - '\Desktopimgdownldr.exe'
    - '\esentutl.exe'
            # - \expand.exe
    - '\mshta.exe'
            # Executables that should never drop an executable to disk (but may after a previous process injection or if it's malware that uses a legitimate name)
    - '\AcroRd32.exe'
    - '\RdrCEF.exe'
    - '\hh.exe'
    - '\finger.exe'
    TargetFilename|endswith:
    - '.exe'
    - '.dll'
    - '.ocx'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of executable files on Windows systems by applications known for not typically generating such files. The behavior can indicate attempts to download or deploy malware using legitimate applications such as Microsoft Office or other commonly installed tools, potentially serving as a staging mechanism for further compromise. The behavior aligns with the MITRE ATT&CK technique **T1218: Signed Binary Proxy Execution**.

  The primary telemetry sources for this detection are file event logs from Windows, specifically focusing on executable file creation activities. If the detection is confirmed as malicious, the security impact can be significant, possibly resulting in a successful malware infection, data exfiltration, or system compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate applications may trigger the rule under specific circumstances.

  ### Investigation Steps

  - **Review the source application launching the executable creation**: Cross-reference the Application name (Image field) in the logs with known benign processes. Look for Event ID 4663 or Sysmon Event ID 11, especially when the source is from a legitimate office application like `wordpad.exe` or `mshta.exe`.

  - **Analyze the created executable file attributes**: Check the file creation logs (TargetFilename) for any additional contextual data indicating the file's origin, like Event ID 4663 for file creation, confirming if it is a new `.exe`, `.dll`, or `.ocx` file that corresponds to suspicious activity.

  - **Identify parental process details**: Extract details of the parent process from Sysmon Event ID 1 to assess if the behavior is initiated by a known benign process or an unexpected source that could indicate compromise.

  - **Check for network activity related to the executable**: Validate if there were any outbound connection attempts associated with the timestamp of file creation using Event ID 5156 from Windows Filtering Platform logs, which could show if the executable is trying to communicate externally.

  - **Establish legitimate behavior benchmarks**: Document normal scenarios where applications such as `wordpad.exe` legitimately create temporary files during operations. Compare the findings against the executed commands or dropped files linked to the alert.

  - **Investigate for known associated indicators of compromise (IoCs)**: Conduct a search for established IOCs related to malicious use of the flagged executables, including MD5 hashes of known trojanized versions or links to malware campaigns leveraging them.

  ### Prioritization

  This alert has a high severity due to the risk of malware installation through common applications, potentially exposing sensitive enterprise data. The likelihood of abuse is significant given that attackers often exploit trusted applications to bypass security controls. This method is a known tactic in the adversary's playbook, making immediate investigation essential.

  ### Blind Spots and Assumptions

  The detection may generate false positives due to legitimate application behavior, particularly in environments where the flagged executables are used for legitimate purposes (e.g., file conversion). Reliable detection depends on comprehensive log configurations for Windows file events as well as Sysmon instrumentation. Additionally, legitimate updates and patches may trigger similar behaviors, while companion detections for malware downloads from anomalous URLs would strengthen overall coverage and context.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
