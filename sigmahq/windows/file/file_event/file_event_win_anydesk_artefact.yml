note: |
  ### Technical Context

  This Sigma rule detects the presence of configuration files generated by the AnyDesk remote access tool on a Windows system, specifically `user.conf` and `system.conf`. Attackers may utilize AnyDesk to establish a command and control (C2) channel, leveraging its legitimate functions to mask their activities and facilitate unauthorized access to systems. This detection correlates with the MITRE ATT&CK tactic of Command and Control (TA0011) and technique Remote Access Software (T1219.002).

  The primary telemetry sources include Windows File Event logs indicating file creation or modifications in the AppData folder. If malicious, the security impact could be significant, as it may signal unauthorized access to sensitive data or systems. It’s important to note that this detection does NOT confirm malicious activity on its own; it merely suggests that the software in question is present, which may also occur during legitimate technical support.

  ### Investigation Steps

  - **Check file creation timestamps:** Examine Windows File Event logs for Event ID 4663 or relevant Sysmon logs to identify when `user.conf` or `system.conf` files were created or modified. Look for timestamps coinciding with user activity; discrepancies may indicate malicious usage.

  - **Identify associated processes:** Use Sysmon Event ID 1 to check for AnyDesk process creation around the time the configuration files were detected. Legitimate usage often aligns with system admin roles or authorized remote support tasks.

  - **Correlate user accounts:** Review Windows Security Event ID 4624 for user logon events preceding the creation of AnyDesk configuration files. The presence of administrative account logons may correlate with legitimate support activities, while unexpected accounts may raise suspicion.

  - **Audit Interaction Logs:** Analyze AnyDesk logs for session recordings or connection history within its management interface, if available. Legitimate support sessions should reflect expected internal support interactions.

  - **Evaluate network connections:** Review network logs for any outbound connections made by AnyDesk during the timeframe of the alert. Suspicious IP addresses or frequent connections outside of business hours can indicate potential abuse.

  ### Prioritization

  This alert is of medium severity, considering the potential for significant impact if an administrative account is compromised. The likelihood of adversaries weaponizing remote access tools is high, as these tools are often used for stealthy access and lateral movement within networks. Organizations must maintain vigilance due to the plausible benign usage scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate support activities may trigger the alert, such as authorized administrative tasks or IT support actions. This detection relies on the proper configuration of Windows File Event logging, which must be enabled in environments for reliable results. Additionally, companion detections related to network behavior of commonly exploited remote access tools (e.g., monitoring for traffic to known AnyDesk domains) can strengthen overall coverage and facilitate more effective triage.

