logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - 'BloodHound.zip'
    - '_computers.json'
    - '_containers.json'
    - '_domains.json'
    - '_gpos.json'
    - '_groups.json'
    - '_ous.json'
    - '_users.json'
  filter_optional_ms_winapps:
    Image|endswith: '\svchost.exe'
    TargetFilename|startswith: 'C:\Program Files\WindowsApps\Microsoft.'
    TargetFilename|endswith: '\pocket_containers.json'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some false positives may arise in some environment and this may require some 
  tuning. Add additional filters or reduce level depending on the level of noise
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of specific files associated with the BloodHound collection tool, particularly those generated by SharpHound. BloodHound is used to enumerate Active Directory (AD) environments, often with the goal of identifying attack paths and lateral movement opportunities. The primary MITRE ATT&CK tactics and techniques relevant here include Discovery (TA0007), specifically Active Directory Enumeration (T1087.001) and Collection (TA0009), specifically Data from Information Repositories (T1482).

  The primary telemetry source is Windows file event logs (e.g., Event ID 4663), tracking file creations with associated filenames: *BloodHound.zip*, *_computers.json*, *_users.json*, etc. If exploited maliciously, this detection could indicate an intruder mapping the network for further exploitation. Importantly, the detection of these file names does NOT confirm malicious activity by itself, as legitimate administrative activities may also produce these logs.

  ### Investigation Steps

  - **Check recent file creations:** Review Windows file event logs (Event ID 4663) for the creation of files that match the specified BloodHound file names. Investigate the user context to determine if it relates to known admin activities or automated tasks.

  - **Correlate with process execution:** Investigate Sysmon Event ID 1 for process creation tied to the same timestamps. Look for the execution of SharpHound or related scripts in conjunction with the file generation to confirm possible malicious activity.

  - **Assess user privileges:** Verify the user account that initiated the file creation against the organization's user privilege model. Legitimate users such as domain admins should be reviewed for expected behaviors. Compare against administrative account privileges and roles.

  - **Identify anomalous patterns:** Look for unusual patterns, such as multiple file creations in a short period or unexpected user accounts accessing sensitive areas of the Active Directory. These could indicate a scripted attack gathering information.

  - **Confirm legitimate administrative activities:** Gather context from your organization's normal administrative practices regarding BloodHound usage. If these files are created during a legitimate auditing procedure or red team activity with prior notification, document the details to close the alert.

  ### Prioritization

  This alert is of high severity due to its potential impact on the enterprise's Active Directory environment. The likelihood of malicious abuse is significant, as the detection aligns with common tactics employed during reconnaissance phases and lateral movement. BloodHound usage is frequently seen in adversarial environments where stealth and privilege escalation are primary objectives.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive file logging across all systems; without necessary log configurations, not all instances of file creation will be captured. Legitimate administrative operations may trigger this alert, such as authorized security assessments using BloodHound. Additionally, companion detections around Active Directory enumeration activities, such as unusual PowerShell executions (T1059.001) or AD group modifications (T1069.002), can complement this detection to enhance situational awareness.

