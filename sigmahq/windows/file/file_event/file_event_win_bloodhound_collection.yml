logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - 'BloodHound.zip'
    - '_computers.json'
    - '_containers.json'
    - '_domains.json'
    - '_gpos.json'
    - '_groups.json'
    - '_ous.json'
    - '_users.json'
  filter_optional_ms_winapps:
    Image|endswith: '\svchost.exe'
    TargetFilename|startswith: 'C:\Program Files\WindowsApps\Microsoft.'
    TargetFilename|endswith: '\pocket_containers.json'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some false positives may arise in some environment and this may require some tuning.
  Add additional filters or reduce level depending on the level of noise
level: high
note: |
  ### Technical Context
  This detection rule identifies files created by the BloodHound collection tool, specifically focusing on the typical output filenames associated with its data collection processes, such as various JSON files and BloodHound.zip. BloodHound is frequently employed by threat actors to gather detailed information about Active Directory environments, enabling the mapping of user and group permissions, which can facilitate later exploitation phases, such as lateral movement or privilege escalation.

  The primary objective of an attacker using BloodHound is to enumerate Active Directory assets systematically, gather intelligence about user privileges and relationships, and ultimately create a path for further attacks or data access. Relevant MITRE ATT&CK tactics include "Discovery" (TA0007) and "Execution" (TA0002), with specific techniques such as Active Directory Enumeration (T1087.001), Account Discovery (T1087.002), and data collection methods (T1482).

  Primary data sources that will provide evidence of this activity include Windows file event logs, which will indicate the creation of files with specific BloodHound naming conventions. Monitoring these logs can be essential for identifying potential reconnaissance efforts in an enterprise environment.

  ### Investigation Steps
  - **Review File Event Logs:** Examine Windows file event logs for the creation of files specifically named as identified in the detection rule, such as *.zip* or *_computers.json* filenames.
  - **Check Process Creation Events:** Look for process creation events that may correlate with the launch of BloodHound or its components, especially those initiated by commonly exploited processes like `svchost.exe`.
  - **Examine Recent User Activity:** Investigate user account activity around the time of file creation to identify any unauthorized accesses or unusual behavior that may indicate malicious intent.
  - **Correlate with Active Directory Events:** Gather and analyze LDAP query logs and Active Directory events to see if there’s a spike in enumeration commands or queries that align with the use of BloodHound.

  ### Prioritization
  The severity of this alert is high due to the potential impact of BloodHound in an enterprise environment. Its use may signal a sophisticated reconnaissance effort that could lead to significant privilege escalation and unauthorized access if not detected and mitigated promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for environments with strict contest rules around file naming or for those that utilize custom structures that don't conform to BloodHound's output. The detection logic assumes that the identified file names will not be incidental to regular operations or generated by legitimate tools. To effectively trigger this alert, proper logging configurations for file events in Windows must be ensured, as well as continuous monitoring for behavioral anomalies surrounding these detections.

