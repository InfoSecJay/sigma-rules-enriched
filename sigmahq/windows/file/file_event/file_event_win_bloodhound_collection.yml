logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|endswith:
    - 'BloodHound.zip'
    - '_computers.json'
    - '_containers.json'
            # - '_domains.json'  # prone to false positives with ProbabilisticRevealTokenRegistry function in Google Chrome
    - '_gpos.json'
    - '_groups.json'
    - '_ous.json'
    - '_users.json'
  filter_optional_ms_winapps:
    Image|endswith: '\svchost.exe'
    TargetFilename|startswith: 'C:\Program Files\WindowsApps\Microsoft.'
    TargetFilename|endswith: '\pocket_containers.json'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Some false positives may arise in some environment and this may require some 
  tuning. Add additional filters or reduce level depending on the level of noise
level: high
note: |
  ### Technical Context

  This rule detects the creation of specific files typically associated with the BloodHound collection tool, particularly those ending with default extensions like `BloodHound.zip`, `_computers.json`, and `_users.json`. The likely objective of an attacker using BloodHound is to perform reconnaissance on Active Directory (AD) environments, identifying relationships and permissions among users and groups to facilitate privilege escalation and lateral movement. This corresponds to multiple MITRE ATT&CK tactics, notably “Discovery” (TA0007), and techniques such as “Account Discovery” (T1087.001) and “Active Directory Enumeration” (T1069.002).

  The primary telemetry sources include file system event logs indicating file creation actions, specifically Windows event logs regarding file events. If malicious, the successful extraction of data related to AD structure could lead to unauthorized access or compromise of sensitive systems. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate administrative tasks or tools may also produce these file outputs.

  ### Investigation Steps

  - **Review file creation events:** Check Windows Event ID 4663 (Permission on an object) or Sysmon Event ID 11 (File creation time) for creation of `BloodHound.zip`, `_computers.json`, or other specified filenames in the file system.

  - **Verify the process lineage:** Trace back process creation via Event ID 4688 (Process creation) to identify the parent process that spawned the file. Focus on any process that isn't a recognized administrative tool or has a suspicious path.

  - **Assess asset criticality:** Determine if the alert triggered on critical servers, such as domain controllers or admin workstations, which increases the severity of the investigation given their role in managing AD.

  - **Check for legitimate activity context:** Identify any scheduled scripts or legitimate applications that may use BloodHound for authorized audits. Confirm expected files that are generated during those processes to differentiate benign from malicious alerts.

  - **Correlate with additional telemetry:** Look for related activity within Active Directory logs (e.g., Event ID 4624 for successful logins) during the timeframe of file creation. High concentrations of login events from unusual user accounts can indicate malicious intent.

  - **Identify known bad behaviors:** Flag any instances where SharpHound was downloaded or executed from unusual or unapproved directories, specifically looking for binaries that aren't commonly present in your environment.

  ### Prioritization

  This alert holds a high severity in enterprise operations due to the potential for information gathering on sensitive AD environments, which is often a precursor to privilege escalation attacks. The likelihood of malicious use is significant as BloodHound is frequently weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by configuration settings that exclude relevant files or by environments where legitimate tools overlap in function with BloodHound. Systems must have appropriate logging enabled to capture file events for accurate detection. Be aware that legitimate audits or security assessments using BloodHound may trigger this alert, creating a need for tuning. A related detection could involve monitoring for suspicious process execution patterns that correspond with the use of BloodHound or similar tools, reinforcing coverage against reconnaissance activities.

