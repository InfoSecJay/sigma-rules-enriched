note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of specific files often generated by the BloodHound collection tool, such as 'BloodHound.zip' and JSON outputs representing various Active Directory objects. The likely objective of an attacker utilizing BloodHound is to gather information about user and group relationships, computer objects, and other domain elements to facilitate a lateral movement strategy within an environment. The relevant MITRE ATT&CK tactics and techniques include Discovery (T1087) and Execution (T1059.001).

  The primary telemetry source for this detection is file events on Windows systems, specifically monitoring file creation and modifications. Malicious activity can compromise Active Directory security, leading to unauthorized access or privilege escalation within an organization. This detection does NOT confirm that an attacker is present; it only indicates that files associated with BloodHound were created, which may include legitimate administrative functions.

  ---

  ### Investigation Steps

  - **Verify the file creation events**: Check file creation logs for Event ID 4663 or Sysmon Event ID 11 targeting the following file names: 'BloodHound.zip', '_computers.json', '_containers.json', '_domains.json', '_gpos.json', '_groups.json', '_ous.json', '_users.json'. If present, these indicate potential BloodHound activity.

  - **Identify the process generating the files**: Review Event ID 4688 (process creation) for the image path associated with the file creation. Look for unexpected instances of 'svchost.exe' in combination with the target filenames. Malicious indicators include processes spawned in unusual directories or by unexpected users.

  - **Examine previous user actions**: Check the recent logon attempts and user activity (Event ID 4624) related to the user account that created the BloodHound files. Review legitimate administrative or penetration testing activities that may warrant the use of BloodHound.

  - **Assess host role and criticality**: Determine if the affected system is a domain controller, an administrator workstation, or an endpoint. Investigate based on the context of the asset; unauthorized BloodHound operation on a domain controller is more critical.

  - **Monitor for known legitimate behaviors**: Identify scheduled tasks or legitimate administrative scripts that may run BloodHound as part of routine audits. Such contexts are typically expected within regular IT operations.

  - **Check for additional artifacts**: Look for associated network activity or communication logs indicating data exfiltration or sharing of the generated JSON files to external systems. Validate communications against normal operational patterns to confirm legitimacy.

  ---

  ### Prioritization

  Given the sensitivity of Active Directory data and the potential impact of lateral movement exploitation, this alert should be treated with high concern. The likelihood of malicious abuse is significant since BloodHound is a tool notably used in offensive operations, and its detection aligns with common attack methodologies.

  ---

  ### Blind Spots and Assumptions

  This detection may face limitations due to legitimate administrative use of BloodHound, which could result in false positives. Ensure that comprehensive logging (including file creation events and process activity) is enabled to capture relevant data reliably. Additionally, other tools used for similar purposes may not be detected by this specific rule, requiring broader surveillance strategies. Consider utilizing companion detections such as monitoring for unusual command line arguments with Process Command Line Logging (Event ID 4688) to strengthen overall visibility.

