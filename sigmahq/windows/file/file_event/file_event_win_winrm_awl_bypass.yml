  ---

  ### Technical Context

  This Sigma rule detects the execution of potentially malicious XSL files, specifically `WsmPty.xsl` or `WsmTxt.xsl`, through the `winrm.vbs` script in a Windows environment. The likely objective of an attacker using this technique is to bypass application whitelisting controls and execute arbitrary commands without being detected, leveraging legitimate Windows functionality. This behavior correlates with the MITRE ATT&CK tactic of Defense Evasion (ID: TA0042) and the specific technique of Credential Dumping (ID: T1216).

  The primary telemetry sources for this rule are Windows file event logs, particularly focusing on file creations or modifications in system directories. If malicious, this behavior may indicate a successful bypass of security controls, leading to unauthorized command execution or data exfiltration. However, this detection does NOT confirm malicious intent on its own; further context is needed to establish whether the execution is part of a benign administrative task or indicative of an intrusion.

  ---

  ### Investigation Steps

  - **Verify file path and name:** Check whether the detected files `WsmPty.xsl` or `WsmTxt.xsl` are located in a non-system folder. Use Windows Security Event ID 4663 for access to file details to evaluate the file's origin and integrity.

  - **Investigate process lineage:** Analyze process creation events (Security Event ID 4688 or Sysmon Event ID 1) for associated processes that spawned `winrm.vbs`. Determine if a legitimate administrative tool invoked the script or if there is a non-standard execution path.

  - **Check file execution behavior:** Utilize Sysinternals tools such as Process Explorer or Autoruns to confirm if `cscript.exe` running `winrm.vbs` has unusual command-line arguments or execution from unexpected directories, indicating potential tampering.

  - **Validate system roles:** Confirm if the system running the alert is designated for administrative or management tasks that may utilize `winrm.vbs` legitimately. For example, servers managed through Windows remote management may see this activity under normal conditions.

  - **Identify original file creation:** Review logs for the creation of `WsmPty.xsl` and `WsmTxt.xsl` to assess if they were placed recently or outside typical deployment procedures. Actions must be inspected through File Creation events in Windows Event ID 4663.

  - **Document benign versus malicious indicators:** Note that legitimate uses may include updates or maintenance scripts run by system administrators. Malicious indicators typically involve mechanisms to mask file names, unexpected execution environments, or integration with other suspicious activities.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact on entire systems, especially if they hold sensitive data or critical applications. Given that defense evasion techniques are commonly exploited by adversaries, a successful detection may indicate an ongoing attack or a breach, necessitating immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection efficacy can be limited by changes in legitimate use cases of `winrm.vbs`, such as administrative activities that could also trigger this alert. Additional log sources, such as PowerShell logs or Windows Management Instrumentation (WMI) logs, may be required for comprehensive monitoring of remote execution scenarios. Common legitimate activities might involve updates to system management frameworks that trigger similar alerts. A related detection, such as unauthorized remote execution through PowerShell (T1059.001), can enhance overall threat coverage.

