note: |
  ### Technical Context
  This rule detects the execution of potentially malicious files named WsmPty.xsl or WsmTxt.xsl in contexts where they should not typically be found, specifically through the execution of winrm.vbs. These files are leveraged by attackers to bypass application whitelisting controls, facilitating unauthorized code execution on targeted systems. The likely attacker objective is to achieve remote code execution or maintain persistence on compromised systems without triggering existing security mechanisms.

  The technique is aligned with the MITRE ATT&CK framework under the tactics of **Defense Evasion** (TA0005) and the technique **T1216: Code Signing Bypass**. Attackers often manipulate existing, trusted scripts or files to execute their payloads, making detection particularly challenging. Primary data sources for this detection include file event logs from Windows that capture creation and execution events, particularly in system directories.

  ### Investigation Steps
  - **Review File Event Logs**: Collect and analyze file event logs to identify instances of WsmPty.xsl or WsmTxt.xsl being executed from unusual locations, especially if they were not found in the legitimate system folders.
  - **Examine WinRM Configuration**: Check the configuration and usage of WinRM on affected machines to understand how the execution of winrm.vbs occurred and whether it was initiated through legitimate administrative actions.
  - **Correlate with Process Creation Events**: Look for process creation events related to cscript.exe that are tied to the suspicious execution of the detected XSL files, especially if these processes exhibit unusual parent-child relationships.
  - **Investigate Recent Changes**: Analyze system changes leading up to the detection to identify any unauthorized file transfers or modifications, which may indicate pre-existing compromises or lateral movement to deploy the malicious scripts.

  ### Prioritization
  This alert has a medium severity due to the potential risk of unauthorized code execution and persistence, which, if exploited successfully, could lead to significant impacts on system integrity and data confidentiality within the enterprise.

  ### Blind Spots and Assumptions
  There may be gaps in detecting variations of malicious XSL files that attackers could use, particularly if they change their names or execution methods. The detection logic assumes that the WsmPty.xsl or WsmTxt.xsl files are not expected to be executed from locations other than the typical system folders. To ensure the alert functions effectively, comprehensive file event logging and monitoring of WinRM configurations should be enabled across the environment.

