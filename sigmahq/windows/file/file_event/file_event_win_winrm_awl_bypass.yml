note: |
  ### Technical Context

  This rule detects the execution of attacker-controlled XSL files (WsmPty.xsl or WsmTxt.xsl) through winrm.vbs, which can enable unauthorized code execution on a Windows system. The likely objective of the attackers is to bypass application whitelisting and execute arbitrary scripts remotely, potentially giving them further access or control over the system. This activity aligns with the MITRE ATT&CK framework's technique for "Software Deployment Tools" (T1216).

  Primary telemetry sources include Windows file event logs, specifically monitoring for events related to execution from system folders. If this behavior is malicious, the impact could be significant, potentially allowing adversaries to execute remote commands undetected. Importantly, this detection does not confirm exploitation without further context, as legitimate uses of winrm.vbs could exist.

  ### Investigation Steps

  - **Correlate event IDs for execution:** Review Windows Event ID 4688 for process creation logs to trace the execution chain of winrm.vbs. Look for the command line that includes the execution of WsmPty.xsl or WsmTxt.xsl.

  - **Verify file creation timestamp:** Check file path C:\Windows\System32\ or C:\Windows\SysWOW64\ regarding the presence and timestamp of WsmPty.xsl and WsmTxt.xsl files to determine if they were created/modified recently, indicating potential malicious activity.

  - **Inspect process parent-child relationships:** Analyze Sysmon Event ID 10 logs to confirm if the process creating WsmPty.xsl is a child of winrm.vbs. Atypical relationships can indicate malicious processes engaged in exploitation.

  - **Identify known benign uses:** Investigate if winrm.vbs has been executed in a legitimate context, such as for administrative remote tasks within a known schedule or from expected operational hosts (e.g., management servers).

  - **Search for deviations in command-line arguments:** Investigate the full command line used during execution of winrm.vbs. Legitimate uses will typically have recognizable parameters, while anomalous or complex arguments indicate malicious intent.

  ### Prioritization

  This alert has medium severity. The affected systems are typically critical for administrative tasks that, if compromised, could allow adversaries to gain significant control over the environment. The technique employed to execute scripts remotely is commonly weaponized in advanced adversary campaigns to leverage existing Windows functionality.

  ### Blind Spots and Assumptions

  Detection may be limited by missing telemetry from systems lacking proper logging configurations for file events. Some legitimate administrative tasks could trigger this alert, especially those that involve automated script execution. Additionally, related detections that strengthen coverage include monitoring for unusual use of the Windows Remote Management (WinRM) service itself, which can indicate broader exploitation attempts.

