note: |
  ### Technical Context

  This Sigma rule detects the execution of attacker-controlled XSL files (WsmPty.xsl and WsmTxt.xsl) via the Windows Remote Management (WinRM) utility, specifically through a script named winrm.vbs that is paired with a potentially renamed cscript.exe. The behavior is indicative of an evasion technique aimed at bypassing application whitelisting controls to execute unsigned code on a compromised system.

  The relevant MITRE ATT&CK tactics and techniques associated with this detection are Defense Evasion (TA0005) and the specific technique of Signed Binary Proxy Execution (T1216). Primary telemetry sources include Windows file event logs focusing on file creation and modification activities, particularly logs that capture system file events and process execution events. If this activity is malicious, it could lead to unauthorized access or control over system resources, evading detection mechanisms.

  This detection does NOT confirm that the execution is malicious by itself; it only indicates suspicious behavior involving potentially compromised scripts and files.

  ### Investigation Steps

  - **Verify execution context:** Review Windows Event ID 4688 (Process Creation) logs for the execution of winrm.vbs with cscript.exe to identify the parent process hierarchy and check command line parameters for anomalies related to administrative tasks.

  - **Check file integrity:** Examine the properties of WsmPty.xsl and WsmTxt.xsl files created in the system directories using Windows Event ID 4663 (Access Attempt) to confirm they are not legitimate files. Legitimate files in these locations should conform to standard naming conventions and timestamps consistent with OS updates.

  - **Determine execution frequency:** Analyze the frequency of this activity by correlating file event logs for WsmPty.xsl and WsmTxt.xsl over time to identify patterns that deviate from normal operations, such as sudden spikes in file executions.

  - **Identify malicious indicators:** Look for the presence of known bad hashes associated with winrm.vbs or commands running it with unusual parameters, particularly if sourced from non-standard directories. Validate potentially flagged files with threat intelligence feeds.

  - **Review system roles:** Assess the roles of affected systems; systems running WinRM enabled should be closely monitored, and activities typically initiated should correspond to remote management tasks rather than unexpected script executions.

  - **Correlation with logged network events:** Check network logs for outbound connections made by the affected processes during the timeframe of the alert to identify potential command-and-control (C2) communications. This can involve analyzing network traffic logs for suspicious HTTP(S) requests.

  ### Prioritization

  This alert is of medium severity, particularly if triggered on critical servers where remote management is utilized. The likelihood of exploitation is moderate given that the observed behavior is often weaponized in targeted attacks to bypass security controls, thus warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if proper Windows event log configurations are not enabled, particularly for process creation and file access logging. Legitimate administrative activities, such as system updates or remote management scripts, may produce similar alerts and need contextual analysis. Companion detections such as monitoring for unusual script execution in conjunction with PowerShell command logging can further strengthen coverage against related threats.

