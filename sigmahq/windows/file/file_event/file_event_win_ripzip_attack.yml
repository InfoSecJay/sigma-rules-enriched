  selection:   # %APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup\target.lnk.{0AFACED1-E828-11D1-9187-B532F1E9575D}\target.lnk
    TargetFilename|contains|all:
    - '\Microsoft\Windows\Start Menu\Programs\Startup'
