note: |
  ### Technical Context
  This detection rule identifies a potential RipZip attack, which is a specific phishing technique that drops a malicious shortcut in the Startup folder of a compromised Windows system. When a user extracts a ZIP file via the Windows Explorer process, it may execute a malicious shortcut that, when activated, connects to a backdoor. The use of a specific GUID-like filename `{0AFACED1-E828-11D1-9187-B532F1E9575D}` is indicative of this attack pattern, as adversaries often leverage such tactics to maintain persistence in the environment.

  The likely attacker objective is to establish a persistent foothold within the victim's environment, enabling ongoing access to sensitive data or further malicious actions. The relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence (T1547)**: The threat actor is using the system's Startup folder to maintain persistent access.
  - **Privilege Escalation (T1547)**: By utilizing manipulation of system shortcuts, the attacker may attempt to escalate privileges or maintain control over the exploited environment.

  Primary telemetry sources for this rule include file event logs that capture the creation and modification of files in the Windows Startup directory.

  ### Investigation Steps
  - **Review Startup Folder Entries**: Inspect the contents of the `%APPDATA%\Microsoft\Windows\Start Menu\Programs\Startup` directory for any suspicious shortcuts, particularly those containing `{0AFACED1-E828-11D1-9187-B532F1E9575D}` in their filename.
  - **Analyze Process Activity**: Look into the execution logs of `explorer.exe` around the time the malicious shortcut was created to ascertain whether the process initiated the extraction of the ZIP file.
  - **Examine Associated Network Connections**: Investigate outbound connections correlating with the time the malicious shortcut was activated to identify any potential command and control (C2) communications.
  - **Conduct a Memory Analysis**: If feasible, perform a memory dump analysis on affected systems to capture any artifacts associated with the backdoor, including any in-memory processes initiated by the shortcut.

  ### Prioritization
  This alert should be considered high-severity due to the potential for persistent access established by the threat actor. The likelihood of a successful attack could lead to significant data breaches or further compromise within the enterprise environment.

  ### Blind Spots and Assumptions
  One possible gap in detection is the reliance on users extracting ZIP files and not the source or integrity of those ZIP files, which may not be monitored comprehensively. The detection logic assumes that the shortcut follows the specified naming convention and is executed via `explorer.exe`, which may not always be the case if attackers employ different tactics or rename the shortcut. Additionally, proper logging configurations must be in place to ensure file event logs capture the necessary activities for this alert to function effectively.

