logsource:
  category: file_event
  product: windows
detection:
  selection_generic:
    Image|endswith:
    - '\csrss.exe'
    - '\lsass.exe'
    - '\RuntimeBroker.exe'
    - '\sihost.exe'
    - '\smss.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.ps1'
    - '.txt'
    - '.vbe'
    - '.vbs'
  selection_special:
    Image|endswith:
    - '\dllhost.exe'
    - '\rundll32.exe'
    - '\svchost.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.hta'
    - '.iso'
    - '.ps1'
    - '.vbe'
    - '.vbs'
  filter_main_AppLockerPolicyTest:
    Image: 'C:\Windows\System32\dllhost.exe'
    TargetFilename|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\__PSScriptPolicyTest_'
    TargetFilename|endswith: '.ps1'
  filter_main_script_gpo_machine:
    Image: 'C:\Windows\system32\svchost.exe'
    TargetFilename|contains|all:
    - 'C:\Windows\System32\GroupPolicy\DataStore\'
    - '\sysvol\'
    - '\Policies\'
    - '\Machine\Scripts\Startup\'
    TargetFilename|endswith:
    - '.ps1'
    - '.bat'
  filter_main_clipchamp:
    Image: 'C:\Windows\system32\svchost.exe'
    TargetFilename|contains|all:
    - 'C:\Program Files\WindowsApps\Clipchamp'
    - '.ps1'
  filter_main_powershell_preview:
    Image:
    - 'C:\Windows\system32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
    TargetFilename|startswith:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - 'C:\Program Files (x86)\WindowsApps\Microsoft.PowerShellPreview'
    TargetFilename|endswith: '.ps1'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule targets suspicious behavior where Windows executables write files with potentially harmful extensions. Specifically, it monitors processes like `csrss.exe`, `lsass.exe`, and `svchost.exe`, known to be commonly exploited by attackers to perform malicious actions, such as executing scripts or payloads disguised as legitimate files. The primary objectives of such attacks often include executing malicious code, establishing persistence, data exfiltration, or lateral movement within the enterprise network.

  The relevant MITRE ATT&CK techniques associated with this detection include **T1036 - Masquerading**. This encompasses tactics where attackers might try to evade detection by employing familiar processes or writing harmful scripts that appear benign. Other tactics at play may involve **Defense Evasion**, where attackers utilize common Windows components to perform actions that could lead to security breaches.

  Primary data sources for this detection are file event logs from the Windows operating system, specifically monitoring executable processes that are attempting to create or modify files with extensions such as `.bat`, `.ps1`, and `.vbs`, which are typically associated with script execution and automation tasks.

  ### Investigation Steps
  - **Review Recent Process Creation Events**: Investigate the process creation logs for instances of monitoring processes (`csrss.exe`, `lsass.exe`, `svchost.exe`) accompanied by suspicious file creations, particularly focusing on file paths that indicate possible abuse, such as `C:\Users\` or `C:\Windows\System32\GroupPolicy\`.

  - **Analyze File Extensions**: Cross-reference any created or modified files with the listed suspicious extensions (.bat, .ps1, .vbe, etc.) in the logs to determine if they align with known patterns of abuse, such as remote script execution or payload delivery.

  - **Check AppLocker and GPO Logs**: If applicable, examine AppLocker and Group Policy Object (GPO) logs to assess whether any executed scripts are compliant with organizational policies or if they indicate circumvented protections, especially in locations like `C:\Windows\System32\GroupPolicy\DataStore\`.

  - **Investigate Network Connections**: Monitor the network traffic and connections initiated by the suspicious processes to identify abnormal communication patterns which may suggest data exfiltration or command-and-control activities.

  ### Prioritization
  The high severity of this alert stems from the significant risk associated with executable processes writing files with suspicious extensions, which could indicate the presence of malware or other unauthorized activities. Given the likelihood of these behaviors leading to significant breaches, immediate attention is warranted in an enterprise environment.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage regarding custom or less-known processes that may also exhibit similar behavior without being flagged by this rule. The detection logic assumes that events are logged for all relevant processes and actions, meaning any interruptions in logging or oversight could lead to missed detections. Required logs must be correctly configured and should contain detailed file event and process creation logs for the alert to function as intended.

