logsource:
  category: file_event
  product: windows
detection:
  selection_generic:
    Image|endswith:
    - '\csrss.exe'
    - '\lsass.exe'
    - '\RuntimeBroker.exe'
    - '\sihost.exe'
    - '\smss.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.ps1'
    - '.txt'
    - '.vbe'
    - '.vbs'
  selection_special:
    Image|endswith:
    - '\dllhost.exe'
    - '\rundll32.exe'
    - '\svchost.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.hta'
    - '.iso'
    - '.ps1'
    - '.vbe'
    - '.vbs'
  filter_main_AppLockerPolicyTest:
    Image: 'C:\Windows\System32\dllhost.exe'
    TargetFilename|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\__PSScriptPolicyTest_'
    TargetFilename|endswith: '.ps1'
  filter_main_script_gpo_machine:
    Image: 'C:\Windows\system32\svchost.exe'
    TargetFilename|contains|all:
    - 'C:\Windows\System32\GroupPolicy\DataStore\'
    - '\sysvol\'
    - '\Policies\'
    - '\Machine\Scripts\Startup\'
    TargetFilename|endswith:
    - '.ps1'
    - '.bat'
  filter_main_clipchamp:
    Image: 'C:\Windows\system32\svchost.exe'
    TargetFilename|contains|all:
    - 'C:\Program Files\WindowsApps\Clipchamp'
    - '.ps1'
  filter_main_powershell_preview:
    Image:
    - 'C:\Windows\system32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
    TargetFilename|startswith:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - 'C:\Program Files (x86)\WindowsApps\Microsoft.PowerShellPreview'
    TargetFilename|endswith: '.ps1'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the behavior of Windows executables (like `csrss.exe`, `lsass.exe`, `svchost.exe`) creating files with suspicious extensions (such as `.ps1`, `.bat`, `.dll`). Attackers often aim to execute malicious scripts or payloads via these extensions, potentially exploiting system processes to bypass security controls.

  Relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (T1036). Primary telemetry sources are Windows File Event logs, specifically targeting write actions to file paths. If malicious, this activity may facilitate unauthorized code execution or lead to persistence mechanisms. Notably, this detection does NOT confirm that all file creations by the specified executables are malicious; legitimate software behavior may also trigger this alert.

  ### Investigation Steps

  - **Examine the process responsible for file creation:** Review Event ID 4688 (Process Creation) for any instances of `csrss.exe`, `lsass.exe`, `svchost.exe`, or other reported executables. Track the command line arguments used at execution to uncover any suspicious patterns.

  - **Identify suspicious file writes:** Check for created files using Event ID 4663 (File Creation). Focus on filenames and paths that end with extensions like `.ps1`, `.bat`, or `.dll`, particularly in non-standard locations (e.g., `C:\Users\<username>\AppData\Local\Temp\`).

  - **Validate legitimate behaviors:** Cross-reference the write activity against known benign applications. For instance, `svchost.exe` might legitimately create `.bat` or `.ps1` files as part of system tasks or scheduled scripts in the `C:\Windows\System32\GroupPolicy\` structure.

  - **Highlight high-confidence malicious indicators:** Pay close attention to any file creation events where the creating process is `svchost.exe` targeting script execution in `C:\Program Files (x86)\WindowsApps\Microsoft.PowerShellPreview` or any use of `rundll32.exe` to execute scripts, as these scenarios are often linked to malware activities.

  - **Monitor for repeat occurrences:** Analyze if the process on an identified machine consistently creates suspicious files, particularly examining for patterns concerning execution times, user accounts involved, and whether the same user is creating multiple files within a short timeframe.

  ### Prioritization

  This alert carries a **high severity** given its potential impact on critical systems and the likelihood of malicious exploitation, especially as the behavior detected can be indicative of attempted script-based attacks or persistence mechanisms, which are commonly weaponized techniques.

  ### Blind Spots and Assumptions

  The detection may miss instances where attackers use alternative processes or modify extensions. Reliable detection requires comprehensive logging settings to capture File Access events and may be obstructed by legitimate administrative behaviors, such as configuration scripts run via system-managed process accounts. Companion detections based on abnormal PowerShell usage or unauthorized access to AppData locations can strengthen overall coverage.

