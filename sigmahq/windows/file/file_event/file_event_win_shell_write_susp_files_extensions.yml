description: Detects Windows executables that write files with suspicious 
  extensions
references:
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-12
modified: 2025-10-07
tags:
- attack.stealth
- attack.t1036
logsource:
  category: file_event
  product: windows
detection:
  selection_generic:
    Image|endswith:
    - '\csrss.exe'
    - '\lsass.exe'
    - '\RuntimeBroker.exe'
    - '\sihost.exe'
    - '\smss.exe'
    - '\wininit.exe'
    - '\winlogon.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.iso'
    - '.ps1'
    - '.txt'
    - '.vbe'
    - '.vbs'
  selection_special:
    Image|endswith:
    - '\dllhost.exe'
    - '\rundll32.exe'
    - '\svchost.exe'
    TargetFilename|endswith:
    - '.bat'
    - '.hta'
    - '.iso'
    - '.ps1'
    - '.vbe'
    - '.vbs'
  filter_main_AppLockerPolicyTest:
    Image: 'C:\Windows\System32\dllhost.exe'
    TargetFilename|contains|all:
    - ':\Users\'
    - '\AppData\Local\Temp\__PSScriptPolicyTest_'
    TargetFilename|endswith: '.ps1'
  filter_main_script_gpo_machine:
    Image: 'C:\Windows\system32\svchost.exe'
    TargetFilename|contains|all:
    - 'C:\Windows\System32\GroupPolicy\DataStore\'
    - '\sysvol\'
    - '\Policies\'
    - '\Machine\Scripts\Startup\'
    TargetFilename|endswith:
    - '.ps1'
    - '.bat'
  filter_main_clipchamp:
    Image: 'C:\Windows\system32\svchost.exe'
    TargetFilename|contains|all:
    - 'C:\Program Files\WindowsApps\Clipchamp'
    - '.ps1'
  filter_main_powershell_preview:
    Image:
    - 'C:\Windows\system32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
    TargetFilename|startswith:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - 'C:\Program Files (x86)\WindowsApps\Microsoft.PowerShellPreview'
    TargetFilename|endswith: '.ps1'
  condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects Windows executable processes that create or write files with extensions commonly associated with scripting or executable content, such as `.bat`, `.dll`, `.exe`, and `.ps1`. The likely objective of the attacker is to use seemingly benign processes (e.g., `csrss.exe`, `lsass.exe`) to execute scripts or payloads as part of lateral movement, reconnaissance, or initial compromise efforts. This behavior relates to the MITRE ATT&CK tactic of “Defense Evasion” (ID: T1036) where attackers may disguise their malicious activity to evade defenses.

  The primary telemetry sources are Windows filesystem event logs that capture file events, specifically Process Creation events (Security Event ID 4688 and Sysmon Event ID 1). If malicious, this activity could lead to significant security incidents, including data breaches or escalation of privileges. However, this detection does NOT confirm malicious activity on its own; legitimate applications may also create files with these extensions.

  ### Investigation Steps

  - **Review Process Creation:** Check for Security Event ID 4688 or Sysmon Event ID 1 to verify the full command line and parent processes of the detected executables. Look for unusual or obfuscated command line arguments that might indicate malicious intent.

  - **Identify Suspicious File Creation:** Search Windows Event logs or Sysmon logs for Event ID 11 (file creation) where the `TargetFilename` matches any of the specified extensions identified in the Sigma rule. Pay close attention to files being written in unusual directories, like temporary or user folders.

  - **Assess Context of Process Behavior:** Examine the behavior of the initiating processes (`csrss.exe`, `lsass.exe` etc.) and determine if they were executing legitimate tasks. Typical behavior may involve standard operations consistent with system functions and known applications.

  - **Correlate with User Activity:** Look at user activity logs associated with the timestamps of file creation to identify whether the activity correlates with any authorized actions or scripts being executed by users or administrators.

  - **Forensic Check on Suspicious Files:** If suspicious files are created, gather additional information from their properties (timestamps, file hashes). Query Antivirus or EDR solutions to see if these files are known to be malicious.

  - **Cross-reference with AppLocker Policies:** If AppLocker policies are in place, check for any violation logs to determine if the detected behavior is consistent with allowed application behavior, especially for PowerShell scripts being executed in restricted contexts.

  ### Prioritization

  This alert is of high severity as it indicates potentially malicious behavior from critical system processes that, if compromised, could lead to escalated privileges or deployment of malware. The likelihood of abuse is significant, given that scripting extensions are commonly weaponized in attacks for executing payloads or performing lateral movements within the environment.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate administrative scripts to trigger this alert inadvertently, especially in complex environments using automation tools. The alert relies heavily on filesystem event logging, meaning any misconfigurations or absence of these logs could hinder detection. Additionally, processes such as `PowerShell` or `cmd.exe` executed via legitimate tasks may overlap with the conditional paths leading to false positives. A companion detection to consider is monitoring for unusual command line arguments in PowerShell scripts (related detection ID: 1277f594-a7d1-4f28-a2d3-73af5cbeab43) to enhance overall detection capabilities.

