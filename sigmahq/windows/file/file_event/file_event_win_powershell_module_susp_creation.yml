title: Potential Suspicious PowerShell Module File Created
id: e8a52bbd-bced-459f-bd93-64db45ce7657
status: test
description: Detects the creation of a new PowerShell module in the first folder
  of the module directory structure 
  "\WindowsPowerShell\Modules\malware\malware.psm1". This is somewhat an 
  uncommon practice as legitimate modules often includes a version folder.
references:
- Internal Research
- https://learn.microsoft.com/en-us/powershell/scripting/developer/module/understanding-a-windows-powershell-module?view=powershell-7.3
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-09
tags:
- attack.persistence
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Note: Don't include PowerShell 7 as it has default modules that don't follow this logic
    - '\\WindowsPowerShell\\Modules\\*\.ps'
    - '\\WindowsPowerShell\\Modules\\*\.dll'
  condition: selection
falsepositives:
- False positive rate will vary depending on the environments. Additional 
  filters might be required to make this logic usable in production.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a new PowerShell module file within the uncommon location of `\WindowsPowerShell\Modules\malware\malware.psm1`. Such behavior often indicates an attempt to establish persistence or evade detection through the creation of malicious modules. The likely attacker objective is to utilize legitimate PowerShell functionalities to execute malicious scripts without triggering security alarms. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Create or Modify System Process (T1055).

  The primary telemetry sources necessary for detection are file event logs from Windows, particularly focusing on file creation events in the mentioned directory. The security impact can be significant if the module is leveraged to execute malware or maintain access within the environment. Importantly, this detection does NOT confirm that the file is malicious on its own; further investigation is necessary to establish the intent behind the file creation.

  ### Investigation Steps

  - **Review file creation events:** Check for Event ID 4663 or Sysmon Event ID 11 in the Security or Sysmon logs to find records of the file creation. Look specifically for files in the path `\WindowsPowerShell\Modules\malware\malware.psm1`.

  - **Analyze the file properties:** Use PowerShell commands like `Get-Item` or `Get-Module` to check the created file's properties. Verify if the file has standard module metadata or unusual attributes that deviate from normal module structure.

  - **Check for recent PowerShell activity:** Examine Event ID 4103 in PowerShell logs to see if there were any recent commands executed from the newly created module. Malicious threats often use PowerShell immediately after module creation.

  - **Identify expected legitimate behavior:** Identify systems or users that typically create custom modules legitimately. This could include internal development environments. Cross-reference with `Get-Module` output for known signed modules.

  - **Evaluate high-confidence malicious indicators:** Look for signs of automated, scripted file creation that lacks corresponding human input (e.g., creation times outside regular work hours, or in conjunction with observed malware behaviors).

  ### Prioritization

  This alert should be treated with medium to high severity, particularly on high-value systems or servers that are integral to the organization’s operations. The likelihood of malicious activity is concerning since such methods for establishing persistence are commonly weaponized by adversaries. Immediate investigation is recommended to prevent the risk of further exploitation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate PowerShell module creations that could generate similar alerts, due to varying organizational practices. Required log sources include both file event logs and PowerShell operational logs for comprehensive visibility. Legitimate development environments or automation scripts may trigger the alert. A related detection to consider is monitoring for unusual PowerShell command executions, which can further corroborate the threat landscape and bolster overall coverage.

