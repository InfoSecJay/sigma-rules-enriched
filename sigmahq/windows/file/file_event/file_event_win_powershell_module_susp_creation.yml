title: Potential Suspicious PowerShell Module File Created
id: e8a52bbd-bced-459f-bd93-64db45ce7657
status: test
description: Detects the creation of a new PowerShell module in the first folder of
  the module directory structure "\WindowsPowerShell\Modules\malware\malware.psm1".
  This is somewhat an uncommon practice as legitimate modules often includes a version
  folder.
references:
- Internal Research
- https://learn.microsoft.com/en-us/powershell/scripting/developer/module/understanding-a-windows-powershell-module?view=powershell-7.3
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-09
tags:
- attack.persistence
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|endswith:
            # Note: Don't include PowerShell 7 as it has default modules that don't follow this logic
    - '\\WindowsPowerShell\\Modules\\*\.ps'
    - '\\WindowsPowerShell\\Modules\\*\.dll'
  condition: selection
falsepositives:
- False positive rate will vary depending on the environments. Additional filters
  might be required to make this logic usable in production.
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify the creation of suspicious PowerShell modules, specifically those found directly in the "\WindowsPowerShell\Modules\malware\" directory structure without traditional subdirectory organization for versioning. This behavior often indicates malicious activity, as legitimate PowerShell modules are typically well-structured with version numbers inhabiting their own directories. Attackers might create such modules to maintain persistence on compromised systems, execute malicious scripts, or evade detection.

  The primary goal for an attacker in this scenario could be to establish a foothold within the environment or to manipulate PowerShell's capabilities for malicious purposes. The ability to run arbitrary code through PowerShell presents numerous opportunities for escalation or lateral movement within a network. Relevant MITRE ATT&CK tactics applicable to this detection include **Persistence (T1547)** and **Command and Scripting Interpreter (T1059)**.

  The primary data sources for effective detection in this instance are file event logs from Windows systems, specifically tracking the creation and modification of PowerShell module files. Successful detection relies heavily on comprehensive monitoring of the file system to capture these events promptly and effectively.

  ### Investigation Steps
  - **Review File Event Logs:** Analyze file creation events related to PowerShell modules in the specified directory, focusing on the presence of `.psm1` and `.dll` files created in the `\WindowsPowerShell\Modules\malware\` path.

  - **Validate Module Structure:** Examine the directory structure of any newly created PowerShell modules to confirm the absence of version folders, which is atypical for legitimate modules. Focus on files labeled as 'malware'.

  - **Assess User Context:** Investigate the user account associated with the file creation. Check for any user account with unusual permissions or lack of history in creating PowerShell modules.

  - **Correlate with PowerShell Logs:** Cross-reference the detected file events with PowerShell execution logs to identify any commands executed around the same time, which may provide insight into potential malicious activity linked to the module.

  ### Prioritization
  The alert is classified as medium severity due to its potential association with malware persistence mechanisms. While the occurrence of such file creations might be low in legitimate environments, their existence can indicate a broader compromise, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  This detection logic may not cover all variations of module creation, particularly if the attacker uses alternative evasion techniques or targets non-standard module directories. It assumes that the logging configuration captures all relevant file event creations without filtering out legitimate activity inadvertently. Moreover, if certain log sources or file auditing functionalities are not configured correctly, the detection may yield false negatives.

