  ### Technical Context

  This detection identifies the creation of a file by **dllhost.exe** within the **System32** directory, specifically targeting DLL files associated with an **IDiagnosticProfileUAC** bypass technique. This behavior typically indicates an attempt by an attacker to escalate privileges by manipulating User Account Control (UAC) settings, leveraging legitimate Windows processes to evade detection. The relevant MITRE ATT&CK tactics and techniques includes **Execution** (TA0002) and **Privilege Escalation** (TA0004) via **T1548.002: Abuse Elevation Control Mechanism**.

  The primary telemetry sources are Windows file event logs that capture file creation activities in critical system directories. If malicious, this behavior could facilitate unauthorized access to elevated privileges, potentially leading to further exploitation of the system. It’s important to note that while this detection indicates suspicious behavior, it does NOT confirm malicious intent without additional context or corroborating evidence.

  ### Investigation Steps

  - **Check Event IDs for file creation**: Review Windows Security Event IDs 4663 and 5145 to confirm the creation of the DLL file by **dllhost.exe**. Look for unusual paths or filenames that are not typically seen in a standard environment.

  - **Analyze process tree for parent processes**: Use Sysmon Event ID 1 to investigate the parent-child relationship of processes initiated by **dllhost.exe**. Malicious processes usually show anomalous parent processes or unusual arguments passed to **dllhost.exe**.

  - **Investigate file attributes and timestamp**: Examine the created DLL file's attributes in the filesystem. Legitimate files will typically have standard timestamps and will appear in context with system updates or installs. Anomalous timestamps, particularly recent or non-standard modification dates, warrant further inspection.

  - **Cross-reference modified files with installed applications**: Utilize a tool to scan for installed applications and verify that the DLL being created correlates with known and legitimate application installations. Any discrepancy may indicate malicious intent.

  - **Assess network activity associated with the process**: Investigate outbound connections using Windows Firewall logs or Sysmon Event ID 3 that correlate with the timing of the DLL file creation. Legitimate **dllhost.exe** activity typically does not involve unusual external communications.

  ### Prioritization

  This alert is considered high priority due to the potential for privilege escalation on critical systems. Given that **dllhost.exe** is a legitimate Windows process, its misuse in this context suggests a high likelihood of malicious activity, especially since UAC bypass techniques are often weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques, such as renaming malicious payloads or using other legitimate processes for file creation. Proper logging configuration for Windows file events is essential for reliable detection. Legitimate tools for software deployment or application updates may sometimes trigger this rule, adding complexity to triage. Companion detections, like monitoring for unusual Windows service creation events, can reinforce the effectiveness of this detection.

