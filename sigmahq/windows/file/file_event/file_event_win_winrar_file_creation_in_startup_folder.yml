title: WinRAR Creating Files in Startup Locations
id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
status: experimental
description: |
  Detects WinRAR creating files in Windows startup locations, which may indicate an attempt to establish persistence by adding malicious files to the Startup folder.
  This kind of behaviour has been associated with exploitation of WinRAR path traversal vulnerability CVE-2025-6218 or CVE-2025-8088.
references:
- https://github.com/mulwareX/CVE-2025-6218-POC
- https://x.com/0x534c/status/1944694507787710685
- https://www.welivesecurity.com/en/eset-research/update-winrar-tools-now-romcom-and-others-exploiting-zero-day-vulnerability/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\WinRAR.exe'
    - '\Rar.exe'
    TargetFilename|contains: '\Start Menu\Programs\Startup\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances where WinRAR (specifically `WinRAR.exe` or `Rar.exe`) creates files in startup locations on Windows systems. Such behavior is often indicative of an attempt by an attacker to establish persistence on a compromised system by placing malicious executables in the Startup folder, ensuring they execute whenever the user logs in. These activities may relate to exploitation attempts leveraging vulnerabilities in WinRAR, particularly the path traversal vulnerabilities identified as CVE-2025-6218 and CVE-2025-8088.

  The rule aligns with several MITRE ATT&CK tactics and techniques, particularly:
  - **Persistence (T1547.001)**: This technique involves mechanisms by which adversaries maintain their access to systems, such as modifying startup folder entries.
  - **Privilege Escalation**: Attackers may use this method to gain higher privileges within a system by manipulating commonly used applications for malicious purposes.

  The most relevant data sources for detecting this activity include file event logs from Windows, which can reveal when and where files are created, as well as process creation logs that may indicate the execution of WinRAR in conjunction with these file creation events.

  ### Investigation Steps
  - **Review File Event Logs**: Examine logs to identify any instances of `WinRAR.exe` or `Rar.exe` creating files in the `Startup` folder. Pay close attention to the time and path of these creations.
  - **Analyze Process Creation Events**: Look for any processes initiated by WinRAR that coincide with file creations in the `Startup` directory, as these can indicate the origin of the malicious files.
  - **Investigate User Context**: Assess which user account triggered the activity, including checking for anomalous user behavior or accounts with inadequate permissions creating startup files.
  - **Cross-Reference Known Indicators**: Check against known IOCs related to CVE-2025-6218 and CVE-2025-8088, including any suspicious hashes or filenames associated with reported exploitation attempts.

  ### Prioritization
  The severity of this alert is high due to the potential for attackers to establish persistence on a victim's machine, allowing for continued access and manipulation of the environment. The exploit-related context heightens the likelihood and impact of such an incident, warranting immediate attention.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if file event logging is not properly configured on endpoints or if security monitoring tools do not adequately collect these events. An assumption of the detection logic is that WinRAR is typically used in the environment; if it is not commonly present, then false positives may occur. Required logs for the alert to function effectively include detailed file event logs and process creation logs, which should be configured to capture these activities comprehensively.

