title: WinRAR Creating Files in Startup Locations
id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
status: experimental
description: |
  Detects WinRAR creating files in Windows startup locations, which may indicate an attempt to establish persistence by adding malicious files to the Startup folder.
  This kind of behaviour has been associated with exploitation of WinRAR path traversal vulnerability CVE-2025-6218 or CVE-2025-8088.
references:
- https://github.com/mulwareX/CVE-2025-6218-POC
- https://x.com/0x534c/status/1944694507787710685
- https://www.welivesecurity.com/en/eset-research/update-winrar-tools-now-romcom-and-others-exploiting-zero-day-vulnerability/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2025-07-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: file_event
  product: windows
detection:
  selection:
    Image|endswith:
    - '\WinRAR.exe'
    - '\Rar.exe'
    TargetFilename|contains: '\Start Menu\Programs\Startup\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the behavior of WinRAR creating files in Windows startup locations, which is indicative of an attacker attempting to establish persistence using malicious payloads. The likely objective for the attacker is to ensure that the malware is executed upon system startup, ensuring ongoing access to the compromised environment. This behavior is associated with the MITRE ATT&CK tactic for Persistence (TA0003) and the technique for Startup Items (T1547.001).

  The primary telemetry source is file event logs from Windows, specifically monitoring actions related to executable file creation in startup directories, including “Startup” under the “Start Menu” (e.g., `C:\Users\<User>\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\`). If confirmed malicious, this activity could give an adversary persistent access to a system that could lead to further compromise or data theft. Importantly, this detection does NOT confirm that the creation of the file is inherently malicious; it may require further context to validate intent and impact.

  ### Investigation Steps

  - **Check for related WinRAR processes:** Review Security Event ID 4688 or Sysmon Event ID 1 for any instances of WinRAR executed from unusual directories, looking for flags such as `cmd.exe /C` or unusual arguments suggesting non-standard actions.

  - **Validate target file contents:** For any newly created files in the Startup folder, examine their contents (e.g., using PowerShell or a file inspection tool) for signs of malicious code or obfuscation, distinguishing between benign scripts (like legitimate applications) and suspicious payloads.

  - **Identify timestamps and user activity:** Correlate the creation time of the startup file with user activity logs (e.g., Security Event IDs 4624 for logon) to determine if the system was actively used at that time or if it corresponds with abnormal user behavior or inactivity.

  - **Investigate legitimate WinRAR uses:** Consider producing a baseline of legitimate WinRAR usage within the environment. A common valid use case might include regular backup and compression operations by authorized users, typically occurring outside the Startup directory.

  - **Identify high-confidence malicious indicators:** Look for known malicious signatures or hashes of files that resemble the newly created items, such as those shared in cybersecurity threat intelligence feeds.

  ### Prioritization

  This alert carries high severity due to the potential impact on system integrity and confidentiality; a successful persistence mechanism can allow an attacker re-entry and maintain control over the system. The likelihood of this behavior being used in a malicious context is significant, particularly given the increasing exploitation of WinRAR vulnerabilities. Establishing persistence through startup files is a common and weaponized tactic among adversaries.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete file event logging or if file creation is disabled via group policy. Legitimate activities such as automated backup scripts or administrative tools may inadvertently trigger the alert if they utilize WinRAR. Companion detections, such as monitoring for unusual WinRAR command-line arguments or suspicious scheduled task creations, can strengthen overall coverage and context for this type of activity.

