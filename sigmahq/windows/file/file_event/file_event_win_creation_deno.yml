title: Suspicious Deno File Written from Remote Source
id: 6c0ce3b6-85e2-49d4-9c3f-6e008ce9796e
status: experimental
description: |
  Detects Deno writing a file from a direct HTTP(s) call and writing to the appdata folder or bringing it's own malicious DLL.
  This behavior may indicate an attempt to execute remotely hosted, potentially malicious files through deno.
references:
- https://taggart-tech.com/evildeno/
author: Josh Nickels, Michael Taggart
date: 2025-05-22
tags:
- attack.execution
- attack.t1204
- attack.t1059.007
- attack.command-and-control
- attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_path:
    TargetFilename|contains:
    - '\deno\gen\'
    - '\deno\remote\https\'
    TargetFilename|contains|all:
    - ':\Users\'
    - '\AppData\'
  condition: selection_path
falsepositives:
- Legitimate usage of deno to request a file or bring a DLL to a host
level: low
note: |
  ### Technical Context
  This detection rule monitors for the activity where Deno, a modern JavaScript and TypeScript runtime, writes a file to the appdata folder after receiving it via a direct HTTP(s) call. Such behavior may indicate that an attacker is utilizing Deno to execute remotely hosted malicious payloads, which could lead to unauthorized access or data exfiltration. The primary threat scenario involves an adversary attempting to leverage the Deno environment to introduce potentially harmful binaries or libraries into a target system.

  This action aligns with several MITRE ATT&CK tactics and techniques. Notably, it encompasses **Execution** (T1204) and **Command and Control** (T1059.007), where attackers might use a trusted environment like Deno to obscure their activities. The technique also relates to **Command-Line Interface** (T1105), as attackers may use command-line operations to orchestrate file manipulations that enable remote payload execution.

  To collect the best evidence for this detection, primary data sources include **file event logs** from Windows systems that capture file operations, particularly in user directory paths such as `\AppData\`. Additionally, scrutiny of network logs that detail HTTP(s) traffic, especially requests emanating from or directed towards known malicious URLs, could enhance investigative leads.

  ### Investigation Steps
  - **Review File Event Logs:** Check Windows file event logs for writes to `\Users\*` or `\AppData\` directories that originated from `deno\gen` or `deno\remote\https` paths. Look for timestamps and user accounts involved in the file writing.

  - **Analyze Network Traffic:** Inspect the outbound and inbound HTTP(s) traffic to identify any suspicious requests associated with the timestamp of the file write. Evaluate the domains contacted for any known malicious activity.

  - **Correlate with User Activity:** Investigate the user activity surrounding the time of the file write. Determine if the user has legitimate access and authorization for the Deno application and scrutinize other actions taken after the file was written.

  - **Evaluate Process Creation Events:** Examine process creation logs that may indicate when Deno was executed and whether any unusual arguments were passed, particularly those related to file operations or network requests.

  ### Prioritization
  This alert is categorized as low severity due to the possibility of legitimate Deno usage; however, any unexpected activity or unauthorized access can present notable risks in an enterprise environment, especially if malicious payloads are involved. It is essential to correlate with user behavior to assess the likelihood of a genuine threat.

  ### Blind Spots and Assumptions
  Potential blind spots in this detection mechanism include legitimate development activities involving Deno that may result in similar behavior, which could lead to false positives. The rule assumes that any use of Deno in appdata areas is suspicious, potentially overlooking benign applications. Additionally, this detection relies heavily on the availability of comprehensive file event logs and appropriate configurations to capture the necessary telemetry; any gaps in logging or misconfiguration could hinder detection capabilities.

