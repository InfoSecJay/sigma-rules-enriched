title: Suspicious Deno File Written from Remote Source
id: 6c0ce3b6-85e2-49d4-9c3f-6e008ce9796e
status: experimental
description: |
  Detects Deno writing a file from a direct HTTP(s) call and writing to the appdata folder or bringing it's own malicious DLL.
  This behavior may indicate an attempt to execute remotely hosted, potentially malicious files through deno.
references:
- https://taggart-tech.com/evildeno/
author: Josh Nickels, Michael Taggart
date: 2025-05-22
tags:
- attack.execution
- attack.t1204
- attack.t1059.007
- attack.command-and-control
- attack.t1105
logsource:
  category: file_event
  product: windows
detection:
  selection_path:
    TargetFilename|contains:
    - '\deno\gen\'
    - '\deno\remote\https\'
    TargetFilename|contains|all:
    - ':\Users\'
    - '\AppData\'
  condition: selection_path
falsepositives:
- Legitimate usage of deno to request a file or bring a DLL to a host
level: low
note: |
  ### Technical Context

  This Sigma rule detects instances where Deno writes files to the appdata folder from a remote source via direct HTTP(S) calls. The behavior may indicate an attacker attempting to execute remotely hosted malicious files or incorporate potentially harmful DLLs into the host environment. The likely objective is to establish persistence or backdoor access through malicious code execution.

  This detection aligns with the MITRE ATT&CK framework, specifically the following tactics and techniques: Execution (T1204) and Command and Control (T1105). The primary telemetry source involved is Windows file event logs indicating activity in certain directories associated with Deno operations. If malicious, such actions could allow the execution of unverified and harmful code. It is crucial to note that this detection alone does not confirm malicious intent as legitimate Deno behavior can also trigger the rule.

  ### Investigation Steps

  - **Identify recent Deno file activities:** Check Windows Event ID 4663 for file operations in the `C:\Users\<username>\AppData\Local\deno\gen\` or `C:\Users\<username>\AppData\Local\deno\remote\https\` directories to see if files were written from unusual sources.

  - **Verify the legitimacy of the HTTP source:** Review related network logs (e.g., DNS queries or Web proxy logs) to trace the HTTP(S) source from which the file was downloaded. Look for known malicious indicators or suspicious domains.

  - **Review the file attributes:** Analyze file creation timestamps and hashes for these newly created files. Compare against threat intelligence to check if they are known malicious DLLs or executables.

  - **Assess benign uses of Deno:** Understand how Deno is commonly used within your environment. Document any legitimate workloads or applications in use to help distinguish between normal operations and potential threats.

  - **Determine user behavior context:** Review user activity leading up to the file creation (Event ID 4624 for logon events). Investigate any anomalies in user roles or actions that could suggest compromised credentials or misuse.

  ### Prioritization

  The impact of this alert is low due to the potential for legitimate Deno use in the enterprise. However, there is a moderate likelihood of malicious intent if the source is identified as suspicious since downloading files from external sources is a common tactic for exploiting systems. This behavior can be weaponized by adversaries; thus, it warrants further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the legitimate uses of Deno that can trigger this alert, which may result in false positives. Adequate logging configurations for file activity in the appdata folder are essential for reliable detection. Additionally, other legitimate applications may also download and execute files, which could confuse detection efforts. Companion detections, such as monitoring for suspicious network traffic associated with Deno, would enhance incident response efforts.

