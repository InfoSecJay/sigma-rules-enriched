title: Potential Webshell Creation On Static Website
id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
status: test
description: Detects the creation of files with certain extensions on a static web
  site. This can be indicative of potential uploads of a web shell.
references:
- PT ESC rule and personal experience
- https://github.com/swisskyrepo/PayloadsAllTheThings/blob/c95a0a1a2855dc0cd7f7327614545fe30482a636/Upload%20Insecure%20Files/README.md
author: Beyu Denis, oscd.community, Tim Shelton, Thurein Oo
date: 2019-10-22
modified: 2023-10-15
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: file_event
detection:
  selection_wwwroot_path:
    TargetFilename|contains: '\inetpub\wwwroot\'
  selection_wwwroot_ext:
    TargetFilename|contains:
    - '.ashx'
    - '.asp'
    - '.ph'
    - '.soap'
  selection_htdocs_path:
    TargetFilename|contains:
    - '\www\'
    - '\htdocs\'
    - '\html\'
  selection_htdocs_ext:
    TargetFilename|contains: '.ph'
    # selection_tomcat_path:
    #     TargetFilename|contains: '\webapps\ROOT'
    # selection_tomcat_ext:
    #     TargetFilename|contains:
    #         - '.jsp' # .jspx, .jspf
    #         - '.jsv'
    #         - '.jsw'
  filter_main_temp:    # FP when unpacking some executables in $TEMP
    TargetFilename|contains:
    - '\AppData\Local\Temp\'
    - '\Windows\Temp\'
  filter_main_system:
    Image: 'System'     # FP when backup/restore from drivers
  filter_main_legitimate:
    TargetFilename|contains: '\xampp'
  condition: (all of selection_wwwroot_* or all of selection_htdocs_*) and not 1 of
    filter_main_*
falsepositives:
- Legitimate administrator or developer creating legitimate executable files in a
  web application folder
level: medium
note: |
  ### Technical Context
  This rule detects the potential creation of web shell files on static websites, specifically targeting file uploads of certain extensions that are commonly associated with web shells, like `.ashx`, `.asp`, and `.ph`. Attackers often use web shells to gain persistent access to compromised web servers, which can facilitate further exploitation such as data exfiltration, command execution, and lateral movement within a network. By monitoring for the creation of specific file types in designated website directories, the detection aims to identify suspicious activities typical of web application attacks.

  The relevant MITRE ATT&CK techniques linked to this detection include **Persistence** (TA0003) and **Web Shell** (T1505.003). The attack scenario typically involves adversaries exploiting vulnerabilities in web applications or utilizing insecure file upload mechanisms to introduce malicious files onto a server. This behavior could signal the establishment of a foothold in the target environment, enabling attackers to conduct additional malicious activities undetected.

  Primary data sources for this detection would primarily include file event logs from web servers, specifically those detailing actions in the `inetpub\wwwroot` and similar directories where web applications usually store their executable files.

  ### Investigation Steps
  - **Review File Upload Events:** Check logs for file creation events in the identified web directories, focusing on files with suspicious extensions like `.ashx`, `.asp`, and `.ph`.
  - **Analyze Access Logs:** Investigate web server access logs for unusual patterns of file uploads or access to application endpoints that may facilitate insecure file uploads.
  - **Correlate with User Activity:** Determine if the file creation was performed by a legitimate user or a potential intruder by examining the associated user accounts' normal activity patterns in web management.
  - **Evaluate Contextual Metadata:** Collect and analyze metadata of the created files, such as timestamps, file sizes, and the source IP address of the file upload, to identify any anomalies or malicious intent.

  ### Prioritization
  This alert holds medium severity due to the potential threat posed by web shell installations, which can lead to significant security breaches if exploited. The likelihood of such an attack is increasingly common as attackers leverage web application vulnerabilities, making timely detection and response crucial.

  ### Blind Spots and Assumptions
  Detection coverage may not catch all variants of web shell uploads, particularly if attackers obfuscate file extensions or utilize alternative upload directories. The detection logic assumes that the configured file path patterns and extensions are comprehensively indicative of web shell activity. Additionally, to ensure the alert functions effectively, logging must be configured to capture detailed file system events on web servers, with appropriate exclusions for legitimate administrative activities to reduce false positives.

