title: Potential Webshell Creation On Static Website
id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
status: test
description: Detects the creation of files with certain extensions on a static 
  web site. This can be indicative of potential uploads of a web shell.
references:
- PT ESC rule and personal experience
- https://github.com/swisskyrepo/PayloadsAllTheThings/blob/c95a0a1a2855dc0cd7f7327614545fe30482a636/Upload%20Insecure%20Files/README.md
author: Beyu Denis, oscd.community, Tim Shelton, Thurein Oo
date: 2019-10-22
modified: 2023-10-15
tags:
- attack.persistence
- attack.t1505.003
logsource:
  product: windows
  category: file_event
detection:
  selection_wwwroot_path:
    TargetFilename|contains: '\inetpub\wwwroot\'
  selection_wwwroot_ext:
    TargetFilename|contains:
    - '.ashx'
    - '.asp'
    - '.ph'
    - '.soap'
  selection_htdocs_path:
    TargetFilename|contains:
    - '\www\'
    - '\htdocs\'
    - '\html\'
  selection_htdocs_ext:
    TargetFilename|contains: '.ph'
    # selection_tomcat_path:
    #     TargetFilename|contains: '\webapps\ROOT'
    # selection_tomcat_ext:
    #     TargetFilename|contains:
    #         - '.jsp' # .jspx, .jspf
    #         - '.jsv'
    #         - '.jsw'
  filter_main_temp:    # FP when unpacking some executables in $TEMP
    TargetFilename|contains:
    - '\AppData\Local\Temp\'
    - '\Windows\Temp\'
  filter_main_system:
    Image: 'System'     # FP when backup/restore from drivers
  filter_main_legitimate:
    TargetFilename|contains: '\xampp'
  condition: (all of selection_wwwroot_* or all of selection_htdocs_*) and not 1
    of filter_main_*
falsepositives:
- Legitimate administrator or developer creating legitimate executable files in 
  a web application folder
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of files with specific extensions (e.g., .ashx, .asp, .ph) within web server directories, particularly in static web environments like IIS (`\inetpub\wwwroot\`) and Apache (`\www\`, `\htdocs\`). This behavior typically indicates an attempt to upload a web shell, which adversaries may utilize for remote control and persistence within a compromised environment.

  Relevant MITRE ATT&CK techniques include Persistence (T1505.003) and, potentially, Web Shells (T1505). Primary telemetry sources involve file event logs from Windows, specifically targeting the creation of files in web server directories. If malicious, successful web shell deployment could allow attackers to execute commands, steal data, or pivot within the network. However, this detection does NOT confirm that the uploaded file is malicious or actively being used; it merely indicates file creation potentially associated with web shell uploads.

  ### Investigation Steps

  - **Review file creation events: Security Event ID 4663**: Examine Event ID 4663 to identify the file creation events. Look for file paths indicating `\inetpub\wwwroot\` or `\www\` directories and extensions like .ashx, .asp, or .ph.

  - **Validate legitimate admin activity: Check for expected file types**: Determine if authorized personnel have created legitimate file types consistent with the applications being used. File names not associated with common web applications may indicate suspicious activity.

  - **Identify high-confidence malicious indicators: Cross-reference known hashes**: Use a threat intelligence platform to cross-reference the hashes of newly created files against known malicious hashes. Ensure the newly created files are not present in a reputable hash set.

  - **Correlate with application logs: Review web server access logs**: Analyze web server access logs for abnormal requests correlating with the file creation time. Look for unusual HTTP methods (PUT, POST) indicative of file uploads.

  - **Evaluate user account activity: Audit account permissions and logins**: Check for any administrative accounts that may have high privileges associated with the alert timeframe. Identify any unfamiliar logins or discrepancies in expected user behavior.

  - **Check for coincidental activity: Analyze related processes in Sysmon logs**: Use Sysmon Event ID 1 to confirm the execution of processes related to web server management tools or unusual file creation tools that match the timing of the alert, highlighting potential misuse.

  ### Prioritization

  This alert should be prioritized as medium severity due to its potential impact on the application server hosting sensitive web content. The likelihood of malicious abuse is significant, as web shells are frequent tactics for maintaining persistence. Additionally, the behavior is weaponized in various attacks involving exploitation of vulnerabilities in web applications.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate use cases where developers or administrators upload necessary application files, leading to false positives. The reliability of this detection depends on having complete file event logging for all relevant web server directories. Legitimate activities that may trigger this alert include development and testing of web applications. A companion detection could involve monitoring specific process creations related to web server management, which could reinforce alert validation by capturing file manipulations initiated by administrative tools.

