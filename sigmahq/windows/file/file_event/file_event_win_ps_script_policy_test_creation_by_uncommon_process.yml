title: PSScriptPolicyTest Creation By Uncommon Process
id: 1027d292-dd87-4a1a-8701-2abe04d7783c
status: test
description: Detects the creation of the "PSScriptPolicyTest" PowerShell script by
  an uncommon process. This file is usually generated by Microsoft Powershell to test
  against Applocker.
references:
- https://www.paloaltonetworks.com/blog/security-operations/stopping-powershell-without-powershell/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_powershell:
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_pwsh_preview:
    Image|contains:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    Image|endswith: '\pwsh.exe'
  filter_main_generic:
    Image:
    - 'C:\Windows\System32\dsac.exe'
    - 'C:\Windows\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\ServerManager.exe'
    - 'C:\Windows\System32\wsmprovhost.exe'
    - 'C:\Windows\SysWOW64\sdiagnhost.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of a specific PowerShell script file named "PSScriptPolicyTest" by an uncommon or unexpected process. This script is typically generated by PowerShell itself as part of Microsoft’s testing process against AppLocker policies. Attackers may exploit this legitimate functionality to execute scripts for malicious purposes, such as evading detection or ensuring their payloads successfully pass policy restrictions.

  The threat scenario involves an adversary leveraging PowerShell, a common administrative tool within Windows environments, to run unauthorized scripts. The likely objectives of such actions could include establishing persistence, conducting reconnaissance, or executing a larger attack plan, while attempting to blend in with legitimate administrative activities. This behavior aligns with the MITRE ATT&CK framework, particularly the tactics of **Defense Evasion** (TA0005) and the technique **Run Command-Line Interface** (T1059).

  The primary data source for this rule is sysmon or native Windows event logs capturing file creation events, specifically targeting script files under the file event category. Additional insights can be gleaned from process creation events to identify the parent process that initiated the script creation.

  ### Investigation Steps
  - **Review PowerShell Logs**: Analyze PowerShell execution logs to identify if any commands were executed prior to the creation of the script file. Look for unusual execution contexts or scripts run from unexpected locations.

  - **Examine Parent Process Hierarchies**: Investigate the parent-child process relationship around the time of the script creation. Uncommon parent processes can indicate suspicious activity that warrants deeper investigation.

  - **Validate File Integrity**: Check the properties and integrity of the "PSScriptPolicyTest" file. Look for any discrepancies such as modified timestamps or file size changes that could indicate tampering.

  - **Check for Anomalous Behavior**: Utilize behavioral analysis tools to assess any unusual API calls made by processes that are involved in the script's creation, focusing on potential evasion techniques or unauthorized access attempts.

  ### Prioritization
  The alert is classified as medium severity due to its potential to reveal attempts by attackers to circumvent security measures in the environment. While the probability of this specific event occurring in standard operations may be low, the presence of such behavior can indicate advanced tactics being employed by threat actors.

  ### Blind Spots and Assumptions
  This detection may not capture all script creation events if logging is misconfigured or if the uncommon process does not generate a file creation event. The detection logic assumes that all legitimate uses of this script name are captured accurately; therefore, it's crucial to validate the common processes in your environment. Furthermore, event logging must retain adequate detail to support this detection, including file creation events and process-related activities across Windows systems.

