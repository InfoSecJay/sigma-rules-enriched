title: PSScriptPolicyTest Creation By Uncommon Process
id: 1027d292-dd87-4a1a-8701-2abe04d7783c
status: test
description: Detects the creation of the "PSScriptPolicyTest" PowerShell script 
  by an uncommon process. This file is usually generated by Microsoft Powershell
  to test against Applocker.
references:
- https://www.paloaltonetworks.com/blog/security-operations/stopping-powershell-without-powershell/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
modified: 2025-10-07
tags:
- attack.stealth
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_powershell:
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_pwsh_preview:
    Image|contains:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    Image|endswith: '\pwsh.exe'
  filter_main_generic:
    Image:
    - 'C:\Windows\System32\dsac.exe'
    - 'C:\Windows\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\ServerManager.exe'
    - 'C:\Windows\System32\wsmprovhost.exe'
    - 'C:\Windows\SysWOW64\sdiagnhost.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of the "PSScriptPolicyTest" script, which is typically generated by legitimate instances of PowerShell as part of testing against Application Control policies like AppLocker. However, if generated by an uncommon or unexpected process, it may indicate an attacker’s attempt to leverage PowerShell for malicious purposes, such as fitting into stealthy execution methods or bypassing security measures. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), specifically through the technique **Signed Binary Proxy Execution** (T1218). The primary telemetry sources are Windows file event logs related to script creation, particularly focusing on Event IDs relevant to file system changes. If this activity is malicious, it could result in unauthorized execution of scripts, potentially leading to further compromise or data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate processes may also generate similar files.

  ### Investigation Steps

  - **Check the process lineage**: Investigate the parent process of the uncommon executables creating the PSScriptPolicyTest file. Use Windows Event ID 4688 (Process Creation) to track the process tree for unusual execution paths or unknown parent processes, which may indicate malicious activity.

  - **Review file creation details**: Examine Windows Security Event ID 4663 (File Access) and look for the creation event associated with the PSScriptPolicyTest file. Pay attention to the creation time, file path, and any associated user accounts involved in this activity.

  - **Determine normal behavior**: Analyze logs for known good instances of PowerShell processes creating this file type. Typically, these should relate to administrative or operational scripts from managed PowerShell sessions, often originating from authorized user accounts like `Administrator` or domain service accounts.

  - **Identify suspicious user accounts**: Cross-reference the user account that initiated the creation against your organization’s user inventory. Uncommon or unauthorized accounts should raise suspicion. Validate this against logs in Security Event ID 4732 (Member added to a group) for any recent privilege escalation or role changes.

  - **Check other related log events**: Investigate if there's concurrent or recent PowerShell command execution logs in the Windows PowerShell logs (Event ID 4103) around the same time as the file creation. Look for any PowerShell commands that are often associated with malicious activity such as file downloads or script obfuscation.

  ### Prioritization

  This alert should be treated as medium priority given that it can indicate a low-volume but potentially harmful behavior detected on sensitive systems. The impact could be significant, especially if executed on privileged assets. However, it is less likely to be a common occurrence in a controlled enterprise environment, as legitimate use of this file is typically limited to administrative scenarios.

  ### Blind Spots and Assumptions

  This detection may be bypassed by attackers using fileless techniques or executing scripts in memory without creating any direct artifacts on the disk. Ensure that file event logs are properly configured to capture all potentially relevant activities. Additionally, legitimate automation tools, or administrative users running scripts may consistently trigger these alerts. A companion detection such as monitoring for abnormal PowerShell command usage through Event IDs 4103 or 4104 can enhance visibility into PowerShell activity in conjunction with this alert.

