title: PSScriptPolicyTest Creation By Uncommon Process
id: 1027d292-dd87-4a1a-8701-2abe04d7783c
status: test
description: Detects the creation of the "PSScriptPolicyTest" PowerShell script 
  by an uncommon process. This file is usually generated by Microsoft Powershell
  to test against Applocker.
references:
- https://www.paloaltonetworks.com/blog/security-operations/stopping-powershell-without-powershell/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
modified: 2026-07-28
tags:
- attack.stealth
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_powershell:
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_pwsh_preview:
    Image|contains:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    Image|endswith: '\pwsh.exe'
  filter_main_generic:
    Image:
    - 'C:\Windows\System32\dsac.exe'
    - 'C:\Windows\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\ServerManager.exe'
    - 'C:\Windows\System32\wsmprovhost.exe'
    - 'C:\Windows\SysWOW64\sdiagnhost.exe'
  filter_optional_gethelp:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.GetHelp_'
    Image|endswith: '\GetHelp.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects the creation of a file named "PSScriptPolicyTest," which is commonly associated with PowerShell scripting used to test against AppLocker policies. The likely attacker objective may involve bypassing application whitelisting or running unauthorized PowerShell scripts. This detection aligns with the MITRE ATT&CK technique for "PowerShell" (T1059.001) under the "Execution" tactic.

  Primary telemetry sources include file creation events on Windows systems, specifically targeting the paths associated with the `pwsh.exe` and other PowerShell instances. If the behavior is malicious, it poses a significant threat by enabling attackers to execute arbitrary scripts or commands under the guise of a legitimate process. This detection alone does NOT confirm malicious intent, as the legitimate creation of this script may occur in response to policy testing or debugging.

  ### Investigation Steps

  - **Identify process source:** Check Event ID 4663 (File Access) for the creation event of "PSScriptPolicyTest" and note the `SubjectUserName` and `ProcessId`. A common benign source will likely be `powershell.exe` or `pwsh.exe`.

  - **Review process legitimacy:** Validate the parent process of `pwsh.exe` using Sysmon Event ID 1. A legitimate invocation often appears under management scripts or software deployment, while uncommon tools or user contexts may indicate malicious intent.

  - **Correlate with known baselines:** Reference recent PowerShell execution logs (e.g., Event ID 4104 for PowerShell, containing script block logging). Compare against expected scripts executed by IT management, distinguishing between legitimate administrative actions versus suspicious behavior patterns.

  - **Examine user context and asset role:** Determine the account executing the process. Elevated privileges through administrative accounts executing the script creation may suggest nefarious intent, especially if the behavior is outside their typical role.

  - **Check for unusual file paths:** Inspect file creation paths against established asset baselines. Legitimate activity would typically occur within designated locations (like `C:\Temp`). Paths that deviate from the norm could signify malicious activity.

  - **Look for related indicators:** Cross-reference logs for potential follow-up commands or script executions linked to the created file, such as subsequent PowerShell commands or unexpected file modifications.

  ### Prioritization

  This alert has a medium-severity rating due to the potential for abuse in environments where PowerShell is a common execution platform. The creation of this script file may be exploited to facilitate application-whitelisting avoidance, making it relevant for further inspection, especially in critical systems.

  ### Blind Spots and Assumptions

  Detection effectiveness is limited by the use of obfuscation techniques by adversaries, who may invoke PowerShell scripts in more legitimate-looking contexts to avoid alerting. Comprehensive logging of PowerShell activity (including script block logs) is crucial for reliable detection. Legitimate administrative users executing policy tests may trigger this alert, thus requiring contextual user analysis. Companion detections involving script execution (e.g., T1059.001) or file access anomalies can augment the investigation process.

