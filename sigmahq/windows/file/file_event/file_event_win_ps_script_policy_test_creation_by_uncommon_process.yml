title: PSScriptPolicyTest Creation By Uncommon Process
id: 1027d292-dd87-4a1a-8701-2abe04d7783c
status: test
description: Detects the creation of the "PSScriptPolicyTest" PowerShell script 
  by an uncommon process. This file is usually generated by Microsoft Powershell
  to test against Applocker.
references:
- https://www.paloaltonetworks.com/blog/security-operations/stopping-powershell-without-powershell/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_powershell:
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_pwsh_preview:
    Image|contains:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    Image|endswith: '\pwsh.exe'
  filter_main_generic:
    Image:
    - 'C:\Windows\System32\dsac.exe'
    - 'C:\Windows\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\ServerManager.exe'
    - 'C:\Windows\System32\wsmprovhost.exe'
    - 'C:\Windows\SysWOW64\sdiagnhost.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of a file named "PSScriptPolicyTest," commonly associated with PowerShell runtime behavior, particularly when generated by uncommon processes not typically seen executing PowerShell. The likely attacker objective could be to test defense mechanisms or create an environment conducive to executing further malicious actions, such as bypassing security measures like AppLocker. This behavior correlates with the MITRE ATT&CK tactic of Defense Evasion (TA0005), specifically technique T1211, which focuses on exploiting legitimate application features.

  The primary telemetry sources for this detection include Windows file event logs, specifically those capturing file creation events. If this behavior is malicious, it could indicate an attempt to execute shell commands unnoticed by security mechanisms, potentially allowing an attacker to manipulate or exfiltrate sensitive data. However, this detection does NOT inherently prove malicious intent, as legitimate administrative scripts may also generate this file.

  ### Investigation Steps

  - **Verify the process origin:** Check Event ID 4688 (Process Creation) logs for the parent process creating "PSScriptPolicyTest" to determine if it is a recognized or legitimate application. Legitimate process generation typically includes common admin tools such as "powershell.exe" or "powershell_ise.exe."

  - **Review file metadata:** Examine the attributes and creation timestamps of the "__PSScriptPolicyTest_" file. Any discrepancies (e.g., timestamps inconsistent with legitimate administrative tasks) may indicate malicious activity.

  - **Assess execution context:** Analyze related PowerShell command execution in Event ID 4104 (PowerShell Script Block Logging). Identify the preceding script blocks executed and ensure they align with expected administrative tasks, distinguishing between typical administrative commands and possible malicious payloads.

  - **Look for related behavior:** Search for potentially malicious indicators by reviewing Event ID 4688 for other recent processes that could relate to the uncommon execution context. Look for known indicators of compromise like uncommon paths or names concatenated with PowerShell commands.

  - **Investigate persistence methods:** If leveraging uncommon processes like "dsac.exe," validate their normal operational behavior. This may involve cross-referencing with known application usage patterns or expected system activity.

  ### Prioritization

  This alert is of medium severity due to its implication that uncommon processes may be trying to evade security measures within the environment. The risk increases in critical asset contexts, where an attacker could exploit PowerShell capabilities to manipulate system behavior or extract sensitive information, although this behavior could also result from benign administrative actions.

  ### Blind Spots and Assumptions

  Detection is limited by the ability to capture all process creation events accurately; an attacker could use processes that are less monitored or employ evasion techniques like process hollowing to disguise their activity. Effective detection relies on enabled logging for PowerShell and file creation events. Additionally, legitimate PowerShell scripts or administrative tasks that involve file creation may trigger this alert, thus necessitating contextual analysis. A complementary detection for further visibility might involve monitoring unusual PowerShell command execution patterns, such as those referenced in TTPs for bypassing application whitelisting.

