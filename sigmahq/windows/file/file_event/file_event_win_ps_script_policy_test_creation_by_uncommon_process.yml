title: PSScriptPolicyTest Creation By Uncommon Process
id: 1027d292-dd87-4a1a-8701-2abe04d7783c
status: test
description: Detects the creation of the "PSScriptPolicyTest" PowerShell script 
  by an uncommon process. This file is usually generated by Microsoft Powershell
  to test against Applocker.
references:
- https://www.paloaltonetworks.com/blog/security-operations/stopping-powershell-without-powershell/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-06-01
modified: 2026-10-19
tags:
- attack.stealth
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  filter_main_powershell:
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_main_pwsh_preview:
    Image|contains:
    - 'C:\Program Files\WindowsApps\Microsoft.PowerShellPreview'
    - '\AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview'
    Image|endswith: '\pwsh.exe'
  filter_main_generic:
    Image:
    - 'C:\Windows\System32\dsac.exe'
    - 'C:\Windows\System32\sdiagnhost.exe'
    - 'C:\Windows\System32\ServerManager.exe'
    - 'C:\Windows\System32\wsmprovhost.exe'
    - 'C:\Windows\SysWOW64\sdiagnhost.exe'
  filter_optional_gethelp:
    Image|startswith: 'C:\Program Files\WindowsApps\Microsoft.GetHelp_'
    Image|endswith: '\GetHelp.exe'
  filter_optional_citrix:
    Image|startswith:
    - 'C:\Program Files\Citrix\ConfigSync\'
    - 'C:\Program Files (x86)\Citrix\ConfigSync\'
    Image|endswith: '\ConfigSyncRun.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of a file named "PSScriptPolicyTest" by uncommon processes, which is commonly indicative of PowerShell being misused to test against AppLocker bypass configurations. The likely attacker objective is to evaluate potential misconfigurations in security controls to execute malicious scripts without detection. This behavior aligns with the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and the technique "Bait and Switch" (T1079).

  The primary telemetry sources for this detection are Windows File Event logs, specifically tracking file creations where the filename contains "__PSScriptPolicyTest_". If malicious, this behavior could lead to allowing unauthorized scripts, facilitating further malware execution or data exfiltration. It is essential to note that this detection does NOT confirm the intent; legitimate processes might trigger this alert during testing or benign administrative tasks.

  ### Investigation Steps

  - **Examine the process creation event:** Review Security Event ID 4688 to identify the process that created the "PSScriptPolicyTest" file. Focus on unusual parent processes indicating possible misuse, such as those not typically associated with file creation.

  - **Verify the source of the PowerShell invocation:** Check for PowerShell script execution logs (Event ID 4103 for PowerShell) to confirm if the invocation was executed through legitimate PowerShell channels. Compare scripts' actual content against known benign patterns.

  - **Identify execution context:** Investigate the user account associated with the process creation (via Event ID 4688). Check if the user had legitimate administrative tasks, like testing AppLocker configurations, or if its context appears suspicious or unfamiliar in the current enterprise usage.

  - **Analyze file metadata:** Inspect the file's creation time, size, and other metadata through file system attributes (using commands like `Get-ChildItem` in PowerShell) to rule out anomalies or common renaming tactics associated with evasion.

  - **Look for additional indicators of compromise:** Cross-reference with other detection alerts for unusual behaviors in the environment (e.g., suspicious script executions or command-line arguments). Identify any external file activity during the same timeframe that could suggest an attempted breach.

  - **Recognize expected legitimate activity:** Typical administrative functions might involve PowerShell scripts related to AppLocker configurations using common administrative tools and processes. Historical log review may demonstrate typical administrative patterns that do not involve creating this file.

  ### Prioritization

  This alert should be considered medium priority since the affected system can have significant security implications if compromised. The likelihood of malicious exploitation exists due to the potential for attackers to leverage PowerShell for stealthy operations. While the behavior is uncommon, it could indicate preliminary phases of an attack, particularly targeting defenses like AppLocker.

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques, such as attackers utilizing other processes or renaming techniques to avoid detection. It relies on accurate file event logging; without comprehensive logging configurations, detection may be unreliable. Legitimate administrative activities may trigger this alert, particularly in environments where PowerShell is extensively used for testing and configuration. A related detection to strengthen coverage includes monitoring for unusual Process Creation events that may indicate other phases of malicious PowerShell executions (TA0005).

