title: HackTool - NetExec File Indicators
id: efc21479-9e83-41da-8cf1-122e06ba8db3
status: experimental
description: |
  Detects file creation events indicating NetExec (nxc.exe) execution on the local machine.
  NetExec is a PyInstaller-bundled binary that extracts its embedded data files to a "_MEI<random>" directory
  under the Temp folder upon execution. Files dropped under the "\nxc\" sub-directory of that
  extraction path are unique to NetExec and serve as reliable on-disk indicators of execution.
  NetExec (formerly CrackMapExec) is a widely used post-exploitation and lateral movement tool used for
  Active Directory enumeration, credential harvesting, and remote code execution.
references:
- https://github.com/Pennyw0rth/NetExec
- https://www.netexec.wiki/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-04-08
tags:
- attack.execution
- attack.lateral-movement
- attack.discovery
- attack.t1021.002
- attack.t1059.005
logsource:
  product: windows
  category: file_event
detection:
  selection:
  - Image|contains: '\nxc-windows-latest\'
  - TargetFilename|contains|all:
    - '\Temp\_MEI'
    - '\nxc\data\'
  condition: selection
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/file/file_event/file_event_win_hktl_netexec_file_indicators/info.yml
note: |
  ### Technical Context

  This rule detects the execution of NetExec (nxc.exe) on Windows systems, specifically by monitoring file creation events related to this post-exploitation tool. NetExec is often leveraged by attackers for lateral movement, Active Directory enumeration, and credential harvesting, indicating a potentially serious intrusion scenario.

  The relevant MITRE ATT&CK tactics and techniques are "Execution" (TA0002) and "Lateral Movement" (TA121002), which reflects the use of this tool in malicious activities. Primary telemetry sources include Windows file event logs capturing file creation events, specifically those indicating the presence of NetExec's unique directory structure within the Temp folder. If malicious, the impacts could be severe, including unauthorized access and control over affected systems.

  This detection does NOT confirm whether the action was authorized, as legitimate applications may also create files in the Temp directory.

  ### Investigation Steps

  - **Verify the specific file indicators:** Review file creation events with **Security Event ID 4663** that show file write actions to paths containing `\Temp\_MEI` and `\nxc\data\`. Look for unusual file names or timestamps that do not correlate with normal operational patterns.

  - **Check for atypical processes:** Review **Sysmon Event ID 1** (process creation) for instances where `nxc.exe` or related processes are executed. Compare parent process IDs with recognized legitimate applications to identify suspicious origins.

  - **Identify expected legitimate behavior:** Assess applications or services that typically use Temp directories for file storage. Confirm whether legitimate processes on the affected system would trigger similar event patterns.

  - **Correlate with active sessions:** Examine remote session logs through **Event ID 4648** for successful logon attempts that precede the file creation events. An unusual account access pattern may indicate compromised credentials.

  - **Analyze potential exfiltration attempts:** Review network logs for data exfiltration using **Event ID 5156** (Windows Filtering Platform) to check if communications to unfamiliar IPs or suspicious ports are present following the NetExec execution.

  - **Investigate system criticality:** Determine the role of the affected host—servers handling sensitive data warrant immediate escalation, while workstations may require focused but less urgent investigation.

  ### Prioritization

  This alert is high severity due to the significant risk posed by unauthorized access and control over sensitive data. Given that NetExec is a recognized tool for malicious actors, the likelihood of abuse is substantial, particularly in environments with Active Directory.

  ### Blind Spots and Assumptions

  Limitations include evasion techniques where legitimate administrative tools may mimic NetExec behavior, leading to false positives. Reliable detection requires enabled file auditing on the Temp directory. Legitimate software installations or updates may create similar Temp files, potentially triggering alerts. Related detections include monitoring for unauthorized administrative activity (e.g., PowerShell usage), which can complement the coverage for unusual tool execution patterns.

