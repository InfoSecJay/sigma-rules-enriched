  ### Technical Context

  This Sigma rule detects the use of a .NET code profiler for UAC (User Account Control) bypass by monitoring for DLL hijacking behavior related to `mmc.exe`. Attackers may exploit this technique to escalate their privileges from a standard user to an administrator by manipulating the runtime environment of Windows Management Console (MMC) applications. The relevant MITRE ATT&CK technique associated with this detection is Privilege Escalation via "Bypass User Account Control" (T1548.002).

  The primary telemetry source is Windows file event logs, specifically monitoring changes to DLL files, with a focus on files located in the user’s temporary directory. If malicious, this behavior could lead to an unauthorized elevation of privileges, potentially enabling further exploitation or system takeover. It is important to note that this detection does NOT automatically confirm malicious activity, as similar behaviors may occur during legitimate software development and testing.

  ---

  ### Investigation Steps

  - **Identify suspicious file creation:** Check for file creation events related to `pe386.dll` in the `C:\Users\<username>\AppData\Local\Temp\` directory. Focus on Security Event ID 4663 or Sysmon Event ID 11 logs that track file creation.

  - **Validate process creation with DLL manipulation:** Examine Security Event ID 4688 for process creation of `mmc.exe`. Look for command line arguments or parent processes that are atypical for user-initiated actions, such as execution context from a non-administrator user account.

  - **Review the user context:** Determine the user context in which `pe386.dll` was created and subsequently executed. Legitimate activities typically involve background processes without abnormal DLL paths or unusual parent-child process relationships.

  - **Check for known malicious indicators:** Cross-reference `pe386.dll` against threat intelligence databases or known malware repositories. If associated with other reported malicious activities, it increases the likelihood of an attack.

  - **Capture file execution paths:** Investigate processes that used `pe386.dll` via Sysmon Event ID 1. Alert on processes executing from the Temp directory where `mmc.exe` and the hijacked DLL are involved, as normal operations generally do not originate from this path.

  ---

  ### Prioritization

  This alert should be considered high severity due to its potential to escalate privileges, rich attack impact on critical systems, and common usage among adversaries for malicious exploitation. Given that UAC bypass techniques are frequently weaponized, the alert warrants prompt investigation.

  ---

  ### Blind Spots and Assumptions

  This detection could be evaded if the suspect DLL is executed through alternative means not captured by monitored file events. Appropriate logging must be ensured, which includes capturing file creation and process execution events. Legitimate activities such as software installations or debugging sessions may also trigger this alert. A related detection worth monitoring includes the execution of PowerShell scripts that leverage similar privilege escalation tactics.

