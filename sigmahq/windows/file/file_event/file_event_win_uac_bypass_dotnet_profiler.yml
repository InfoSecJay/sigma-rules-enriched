note: |
  ### Technical Context

  This rule detects the use of .NET Code Profiler for User Account Control (UAC) bypass specifically through the hijacking of the `mmc.exe` process. The likely attacker objective is privilege escalation to execute code with elevated permissions. This technique fits within the MITRE ATT&CK framework under Tactic: Privilege Escalation and Technique: Bypass User Account Control (T1548.002). The primary telemetry sources are file events related to the execution of potentially malicious `.dll` files in the user’s Temp folder. If malicious, this behavior can lead to unauthorized access and escalation of privileges. Importantly, this detection does NOT confirm that an actual compromise has occurred without additional context.

  ### Investigation Steps

  - **Identify the anomalous file creation**: Search for `Event ID 4663` (Access to an Object) focusing on the `C:\Users\<username>\AppData\Local\Temp\pe386.dll` file to check for unusual modify/create actions.

  - **Check parent process context**: Investigate `Event ID 4688` (Process Creation) where `mmc.exe` is the parent process. Analyze the command line to confirm if there is an unusual invocation or unexpected parameters.

  - **Review user account privileges**: Validate the user account that executed the action; check if the user typically has administrative privileges and whether such access is authorized based on the host’s intended use.

  - **Correlate with known benign activity**: Compare the execution of `mmc.exe` from users that actively use the console versus unusual users or at unusual times. Legitimate use typically involves IT administrators managing system settings or active directory objects.

  - **Look for extra elevated privileges**: Analyze System Event Logs for Event IDs related to privilege elevation (like 4672—Special privileges assigned to new logon) within the timeframe of the alert to confirm an escalation attempt.

  - **Assess overall system relevance**: Consider the criticality of the affected system in relation to business operations. Actions originating from a domain controller or critical infrastructure should prompt higher scrutiny.

  ### Prioritization

  This alert carries high severity due to the potential impact of privilege escalation. Systems affected by UAC bypass techniques are prime targets for adversaries seeking deeper access, and this method is frequently weaponized in attacks to elevate privileges unnoticed.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of robust logging or if UAC settings vary across user accounts, affecting visibility into expected legitimate actions. Similar legitimate system maintenance tasks may trigger false positives. Companion detections should include monitoring for lateral movement attempts (e.g., Windows Remote Management or RDP sessions) that could follow a successful escalation.

