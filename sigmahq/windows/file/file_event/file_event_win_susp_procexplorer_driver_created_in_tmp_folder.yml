title: Suspicious PROCEXP152.sys File Created In TMP
id: 3da70954-0f2c-4103-adff-b7440368f50e
status: test
description: |
  Detects the creation of the PROCEXP152.sys file in the application-data local temporary folder.
  This driver is used by Sysinternals Process Explorer but also by KDU (https://github.com/hfiref0x/KDU) or Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2026-06-29
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: 'PROCEXP152.sys'
  filter:
    Image|contains:
    - '\procexp64.exe'
    - '\procexp64a.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon64a.exe'
    - '\procmon.exe'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this driver and filename (like Sysinternals). Note 
  - Clever attackers may easily bypass this detection by just renaming the 
  driver filename. Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of the **PROCEXP152.sys** file within the local temporary folder, typically associated with malicious activities like privilege escalation and process manipulation using tools such as the KDU (Kernel Development Utility) or Ghost-In-The-Logs. The primary attacker objective is often to manipulate system processes or gain elevated privileges without detection.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1562), with an applicable technique being **Impair Defenses** (T1685). The primary telemetry sources are Windows file event logs, specifically monitoring for the creation of files in the **C:\Users\[User]\AppData\Local\Temp** directory. If this file is malicious, it poses a risk of system compromise or lateral movement. This detection does NOT confirm malicious activity on its own, as other legitimate tools can create this file.

  ### Investigation Steps

  - **Check file creation events**: Review Windows Security Event ID 4663 to confirm the creation of **PROCEXP152.sys** in the **AppData\Local\Temp** directory. Look for **SubjectUserName** and **ObjectName** fields to identify the user and full path.

  - **Correlate process activity**: Analyze Sysmon Event ID 1 for process creation events around the same timeframe. Look specifically for **Image** values containing the suspected tool binaries (e.g., **procexp64.exe**). Legitimate activity should show known system tools rather than suspicious ones.

  - **Evaluate process parent-child relationships**: Use Sysmon Event ID 10 to check the parent-child relationship of the processes that spawned **PROCEXP152.sys**. Legitimate behavior often involves trusted system processes as parents, rather than potentially malicious ones.

  - **Identify unusual user behavior**: Check for anomalous user activity in Windows Security logs, specifically Event IDs 4624 and 4672. Increased logon events (e.g., service accounts or admin users logging in to multiple machines) may indicate an elevated privilege attempt.

  - **Assess host sensitivity**: Determine whether the affected host is classified as critical (e.g., servers, admins' workstations) to prioritize incident response appropriately. Sensitive assets warrant more immediate investigation and response.

  ### Prioritization

  This alert is of medium severity due to the potential security impact if the process manipulation is indeed malicious. The event reflects behavior often associated with known exploitation techniques and tools; however, its detection via this specific file can also indicate legitimate security operations or administrative tasks.

  ### Blind Spots and Assumptions

  Detection relies on specific log configurations (Sysmon enabled) and may miss other evasion techniques, such as renaming the drivers or not using the standard paths. Legitimate security tools, like Sysinternals' Process Explorer, may trigger false positives if used inappropriately. A related detection to consider is alerting on the execution of known file analysis tools (e.g., **procexp.exe**, **procmon.exe**) to build context around this alert.

