title: Suspicious PROCEXP152.sys File Created In TMP
id: 3da70954-0f2c-4103-adff-b7440368f50e
status: test
description: |
  Detects the creation of the PROCEXP152.sys file in the application-data local temporary folder.
  This driver is used by Sysinternals Process Explorer but also by KDU (https://github.com/hfiref0x/KDU) or Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2022-11-22
tags:
- attack.t1562.001
- attack.defense-evasion
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: 'PROCEXP152.sys'
  filter:
    Image|contains:
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this driver and filename (like Sysinternals). Note -
  Clever attackers may easily bypass this detection by just renaming the driver filename.
  Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects the creation of the file `PROCEXP152.sys` located in a temporary directory on Windows systems. This driver is typically associated with Sysinternals Process Explorer; however, it can also be utilized by malicious tools such as KDU or Ghost-In-The-Logs for purposes such as process manipulation or persistence.

  The relevant MITRE ATT&CK technique is Defense Evasion (T1562.001). The primary telemetry sources include Windows file system events, particularly monitoring file creations in the user's Local Temp folder. Malicious creation of this file may indicate an attempt to evade detection through the use of legitimate tools adapted for exploitation. This detection does NOT confirm malicious intent on its own, as the usage of this driver by authorized Sysinternals tools can produce similar alerts.

  ---

  ### Investigation Steps

  - **Correlate process execution details:** Check for the execution of `procexp64.exe`, `procexp.exe`, `procmon64.exe`, or `procmon.exe` (Security Event ID 4688 or Sysmon Event ID 1). Confirm if these processes initiate around the same timestamp as the file creation. Legitimate usage would reveal known tools running without suspicious command-line parameters.

  - **Review file creation metadata:** Inspect file creation events for `PROCEXP152.sys` (Windows Event ID 4663) in the Local Temp directory. Analyze fields such as `ObjectType` and `AccessMask` to determine if the context suggests normal tool behavior or unexpected file modifications.

  - **Identify alteration attempts in Legitimate Process Explorer usage:** If a process from the Sysinternals suite runs shortly before the file creation, look for unusual command-line arguments or additional loaded drivers that diverge from typical usage patterns, indicating possible abuse.

  - **Investigate network connections:** Monitor outbound network activity (like Security Event ID 5156) from any processes associated with `PROCEXP152.sys`. Suspicious patterns, such as unexpected connections or large volumes of data being sent to unknown destinations, could indicate malicious intent.

  - **Assess asset criticality and context:** Evaluate the role of the host where the alert triggered. If it’s a critical server, further scrutiny is warranted. Compare against baseline behaviors for that asset to distinguish benign from malicious activity.

  - **Document high-confidence malicious indicators:** If the file exhibits behaviors such as unauthorized replication, changes in service configuration (Windows Event ID 7045), or leads to processes with known malicious hashes, mark these as high-confidence indicators of compromise.

  ---

  ### Prioritization

  This alert has medium severity due to the potential implications of malicious actors using legitimate tools for persistence and lateral movement. The likelihood of abuse is medium since the use of the detected driver is occasionally legitimate, but when associated with other suspicious behaviors, it necessitates further investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded through the renaming of the driver file by attackers. Reliable detection requires full logging for file events, particularly access to the Local Temp directory. Legitimate software updates or temporary usage of Sysinternals tools may trigger this alert, complicating clear interpretation of context. A related detection worth considering is monitoring for unusual process injection techniques (T1055) that may accompany the use of TEMP directory files, enhancing overall coverage.

