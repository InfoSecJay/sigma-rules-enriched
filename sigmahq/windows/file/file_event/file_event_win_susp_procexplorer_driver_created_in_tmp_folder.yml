title: Suspicious PROCEXP152.sys File Created In TMP
id: 3da70954-0f2c-4103-adff-b7440368f50e
status: test
description: |
  Detects the creation of the PROCEXP152.sys file in the application-data local temporary folder.
  This driver is used by Sysinternals Process Explorer but also by KDU (https://github.com/hfiref0x/KDU) or Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2022-11-22
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: 'PROCEXP152.sys'
  filter:
    Image|contains:
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this driver and filename (like Sysinternals). Note 
  - Clever attackers may easily bypass this detection by just renaming the 
  driver filename. Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of the file `PROCEXP152.sys` in the user’s local temporary folder, which is commonly used by Sysinternals Process Explorer. However, it is also utilized by malicious tools like KDU and Ghost-In-The-Logs, which exploit similar functionalities for credential dumping or privilege escalation. This activity fits within the MITRE ATT&CK framework under the tactic of Defense Evasion (T1562) and the technique of Impair Process Control (T1685). The primary telemetry sources for this detection are Windows file event logs that contain information about file creation events, specifically targeting Event ID 4663.

  If `PROCEXP152.sys` is indeed a malicious tool, its execution can have severe security implications, allowing an attacker to manipulate or spy on other processes. It is crucial to note that this detection alone does not confirm malicious activity; legitimate tools may also create this driver, necessitating further investigation to validate context and intent.

  ### Investigation Steps

  - **Check file creation details:** Review the file creation event with Event ID 4663 in the Security log to confirm the Timestamp, User, and Process Name fields. Look for unusually active users or processes not typically present in your environment.

  - **Verify parent process lineage:** Analyze the creation context by querying Process ID (PID) from the creation event. Validate using Sysmon Event ID 5 or Windows Event ID 4688 to trace the parent process and identify any anomalies, such as unexpected executions of `procexp.exe` or `procmon.exe`.

  - **Investigate process behavior:** Utilize Sysmon Event ID 1 to examine whether `procmon.exe` or similar tools have spawned processes alongside the `PROCEXP152.sys` creation. Look for legitimate usage patterns with admin tools; abnormal behaviors like multiple simultaneous instances could indicate malicious use.

  - **Identify high-confidence malicious indicators:** Search for the presence of `PROCEXP152.sys` alongside process memory manipulation actions or unusual network traffic from the host where the file was created. Unique network signatures or connections (if any detected) can indicate post-exploitation actions.

  - **Assess legitimate usage patterns:** Determine if `PROCEXP152.sys` corresponds to known legitimate processes in your environment. Document application usage history for `procexp.exe` or `procmon.exe` to identify regular operational contexts.

  ### Prioritization

  This alert should be prioritized as medium severity. While the detection of `PROCEXP152.sys` is not inherently malicious, its use in known exploit tools indicates a heightened risk, especially in sensitive environments. Furthermore, tools capable of bypassing detection strategies can increase the likelihood of abuse.

  ### Blind Spots and Assumptions

  Detecting the creation of `PROCEXP152.sys` has limitations; legitimate applications may trigger this alert, which can lead to false positives. Reliable detection requires configured logs from both file event and process creation telemetry sources. Additionally, the alert might miss renamed variants of the driver, hence depending solely on its name could result in undetected malicious activity. A related detection to consider is monitoring for command line parameters of known tools utilizing `PROCEXP152.sys`, which can provide further context around the legitimacy of the actions observed.

