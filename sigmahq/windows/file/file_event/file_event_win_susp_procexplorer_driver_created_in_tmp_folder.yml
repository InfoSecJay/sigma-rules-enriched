title: Suspicious PROCEXP152.sys File Created In TMP
id: 3da70954-0f2c-4103-adff-b7440368f50e
status: test
description: |
  Detects the creation of the PROCEXP152.sys file in the application-data local temporary folder.
  This driver is used by Sysinternals Process Explorer but also by KDU (https://github.com/hfiref0x/KDU) or Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2022-11-22
tags:
- attack.t1562.001
- attack.defense-evasion
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: 'PROCEXP152.sys'
  filter:
    Image|contains:
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this driver and filename (like Sysinternals). Note 
  - Clever attackers may easily bypass this detection by just renaming the 
  driver filename. Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ### Technical Context

  This rule detects the creation of the file `PROCEXP152.sys` in the local temporary folder, which is associated with legitimate tools like Sysinternals Process Explorer and process monitoring utilities. However, the presence of this file can also indicate misuse by adversarial techniques such as those employed by KDU or Ghost-In-The-Logs, where the objective is to evade detection while monitoring or manipulating system processes. This aligns with the MITRE ATT&CK technique for **Defense Evasion** (ID: T1562.001).

  Primary telemetry sources include Windows file event logs that capture creation events for the specified file in the defined directory. If malicious, this behavior poses a significant risk as it could facilitate process manipulation or escalation. Importantly, this detection does NOT confirm malicious activity on its own, as benign applications may also create this file.

  ### Investigation Steps

  - **Check the creation timestamp:** Review the `File Creation Time` associated with the `PROCEXP152.sys` file (Log Type: Windows file events). Cross-reference with other logs to determine if this coincides with anomalous user activity.

  - **Identify the parent process:** Validate the parent process of `PROCEXP152.sys` by checking Windows Event ID 4688. Look for identified process names (`procexp64.exe`, `procmon.exe`) versus unknown executables, which may indicate misconduct.

  - **Review recent commands and actions:** Cross-check for `cmd.exe` or PowerShell events in Event ID 4688 that executed right before the file creation. Compare legitimate administrative usage versus unexpected execution to gauge intent.

  - **Examine the local user context:** Check Windows groups or accounts that have created or modified the file (Log Type: Security with Event ID 4672). Verify if the account has improper privileges indicating potential compromise.

  - **Corroborate legitimate tool usage:** Investigate whether an administrator used `PROCEXP152.sys` as part of their operational duties. Validate whether the file has a legitimate operational need as part of tool usage, reducing the likelihood of malicious intent.

  - **Look for related artifacts or behaviors:** Check for existence of other KDU or Ghost-In-The-Logs files or tools. Investigate based on known paths and file names used by these tools to look for indicators of additional malicious activity.

  ### Prioritization

  This alert should be prioritized as medium severity given that the affected system may play a critical role in the environment, such as a server. The likelihood of exploitation is moderate; the file is often used in both benign and malicious contexts, making it a common target for weaponization by adversaries.

  ### Blind Spots and Assumptions

  This detection might miss cases where attackers rename the driver file to bypass the alert. Reliable detection requires proper logging configuration to monitor file system events fully. Additionally, legitimate tools utilizing this driver may trigger false positives, complicating the investigation. Strengthening coverage can involve monitoring for additional behaviors associated with KDU and Ghost-In-The-Logs through detection of their typical command line arguments and system impact.

