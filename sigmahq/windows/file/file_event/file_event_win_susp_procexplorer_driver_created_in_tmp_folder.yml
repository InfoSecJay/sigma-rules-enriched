title: Suspicious PROCEXP152.sys File Created In TMP
id: 3da70954-0f2c-4103-adff-b7440368f50e
status: test
description: |
  Detects the creation of the PROCEXP152.sys file in the application-data local temporary folder.
  This driver is used by Sysinternals Process Explorer but also by KDU (https://github.com/hfiref0x/KDU) or Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU.
references:
- https://web.archive.org/web/20230331181619/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2022-11-22
tags:
- attack.t1562.001
- attack.defense-evasion
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: 'PROCEXP152.sys'
  filter:
    Image|contains:
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this driver and filename (like Sysinternals). Note -
  Clever attackers may easily bypass this detection by just renaming the driver filename.
  Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ### Technical Context
  This detection rule targets the creation of the file `PROCEXP152.sys` within the local temporary folder, which is a common behavior associated with the usage of certain process monitoring tools, such as Sysinternals Process Explorer. While this legitimate driver is primarily used for process analysis and monitoring, its presence in unusual contexts can signify potential misuse by attackers leveraging it for malicious purposes. Specifically, tools like KDU (Kernel Debugger Utility) and Ghost-In-The-Logs utilize this driver to evade traditional security measures, indicating that an attacker may be trying to manipulate or hide their activities within the system.

  The likely attacker objectives could involve gaining unauthorized insight into processes running on the system or evading detection while conducting further malicious activities. This behavior falls under the MITRE ATT&CK tactics of `Defense Evasion` (TA0062) and specifically the technique `Impair Defenses` (T1562.001) as attackers may aim to disable alerts or monitoring via the use of specialized drivers like `PROCEXP152.sys`. The primary data sources for identifying this activity include Windows file event logs to track file creation within user or system directories.

  ### Investigation Steps
  - **Review File Creation Logs**: Examine Windows file event logs, focusing on the creation of `PROCEXP152.sys` within the `C:\Users\<USERNAME>\AppData\Local\Temp\` directory. Look for patterns or unusual activity surrounding the timing of this file creation.

  - **Analyze Process Execution**: Investigate process creation events linked to the execution of `procexp.exe`, `procmon.exe`, or similar tools. Determine if they correlate with the creation of the PROEXP152.sys file and check their command-line arguments for potential red flags.

  - **Correlate with Other Security Alerts**: Cross-reference the file creation with other security logs (e.g., EDR alerts) to identify if the same host has exhibited other suspicious behaviors that could indicate a broader compromise.

  - **Investigate System Anomalies**: Check for any system changes or anomalies that occurred around the same time as the file creation. This may include new user accounts, unexpected privilege escalations, or modifications to system files or configurations.

  ### Prioritization
  Given that the detection of `PROCEXP152.sys` can indicate potential defensive evasion behavior by attackers, the alert holds medium severity in an enterprise environment. Attackers using such techniques can lead to increased attack persistence and may compromise sensitive information or systems.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, as clever attackers might bypass this rule by renaming the driver or using different file paths entirely. The detection logic assumes that the creation of `PROCEXP152.sys` necessarily indicates malicious intent, which may not always be the case due to legitimate use by system administrators or security personnel. For this alert to function effectively, proper logging of file events must be enabled across all systems, and the analysis should account for legitimate variances in tool usage within the environment.

