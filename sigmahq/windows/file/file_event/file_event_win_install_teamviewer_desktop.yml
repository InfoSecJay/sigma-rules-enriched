  ---

  ### Technical Context

  This rule detects the creation of the file `TeamViewer_Desktop.exe`, which is associated with the installation of the TeamViewer remote access software. Attackers may use this software to establish remote control over compromised systems, facilitating further exploitation or data exfiltration. The relevant MITRE ATT&CK tactic is Command and Control (TA0011), specifically technique T1219. Primary telemetry sources include file creation events logged by the Windows operating system, particularly via Security Event ID 4663 and Sysmon Event ID 11. If malicious, this behavior could enable an attacker to remotely access sensitive systems. However, the detection does NOT confirm that the installation is unauthorized, as TeamViewer may be legitimately used in the environment.

  ---

  ### Investigation Steps

  - **Verify file creation details:** Check for Security Event ID 4663 or Sysmon Event ID 11 in the logs to confirm the creation of `TeamViewer_Desktop.exe`. Look for `Object Name: C:\Program Files (x86)\TeamViewer\TeamViewer_Desktop.exe` to validate the legitimate installation path.

  - **Assess user behavior:** Identify the user account that initiated the installation. Review user activity in conjunction with the Windows Event Log (Event ID 4624 - Logon) to ensure that the account has a known business purpose for using remote access software.

  - **Check for concurrent suspicious activity:** Examine processes or network connections that occur within a close timeframe of the file creation event. Look for related Sysmon Event ID 3 (Network connection), which could indicate unusual outgoing connections typically made after installation.

  - **Review authorized software policies:** Determine if TeamViewer is authorized within the organization. Consult internal documentation or software asset inventory to compare against the installed software list to establish legitimacy.

  - **Investigate persistence mechanisms:** If `TeamViewer_Desktop.exe` has been executed, identify persistence methods like startup folder entries or Windows registry changes (Event ID 4657) that could indicate an established foothold after installation.

  ---

  ### Prioritization

  The alert's severity is medium due to the potential for sensitive data exposure and the likelihood of malicious use of TeamViewer for unauthorized remote access. While many organizations use TeamViewer legitimately, its presence could indicate a compromise if not aligned with established software policies.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using alternate remote access methods or legitimate accounts to install software without triggering alerts. Reliable detection requires monitoring file creation logs from Windows with adequate retention. Legitimate users may install TeamViewer for support purposes, which could trigger the alert. Consider correlating this detection with other alerts related to remote access tools for enhanced monitoring coverage.

