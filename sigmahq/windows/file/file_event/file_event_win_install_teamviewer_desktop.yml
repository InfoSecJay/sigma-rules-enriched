  ### Technical Context

  This Sigma rule detects the file creation of `TeamViewer_Desktop.exe`, which is associated with the installation of TeamViewer—a remote access and remote control software. The likely attacker objective is to establish remote control over a compromised system, enabling further exploitation or data exfiltration. This behavior falls under the MITRE ATT&CK tactic of Command and Control (T1071) and the technique of Application Layer Protocol (T1219.002).

  The primary telemetry source is Windows file event logs tracking processes creating or modifying files. If this event is determined to be malicious, it could indicate a serious security breach, allowing unauthorized access to sensitive systems. However, mere detection of this executable does NOT confirm malicious intent on its own, as legitimate installations occur in many environments.

  ### Investigation Steps

  - **Check process creation logs:** Review Security Event ID 4688 for `TeamViewer_Desktop.exe` creation along with parent process information to identify whether it was spawned directly by a legitimate user action.

  - **Identify user context:** Verify the user account that ran the installation. Legitimate installations often occur under user accounts with IT permissions or as part of authorized software deployment, indicated by account names coinciding with helpdesk or IT staff.

  - **Examine installation time:** Cross-reference the timestamp of the executable creation against typical operating hours for your organization. Installations outside normal hours could signify malicious activity.

  - **Analyze file attributes:** Review file properties (e.g., digitally signed, version info) for `TeamViewer_Desktop.exe`. Legitimate files will typically have valid digital signatures from TeamViewer GmbH and are expected to be recent versions.

  - **Look for unusual network activity:** Monitor network connections established by `TeamViewer_Desktop.exe` using Windows Event ID 5156 or firewall logs. Unusual outbound connections, particularly to known malicious IPs, raise suspicion.

  - **Investigate related activity:** Look for other artifacts associated with remote access tools such as registry keys or additional executables that might indicate prior or ongoing compromises.

  ### Prioritization

  This alert is assessed as medium severity because the impact depends on the criticality of the affected system. Given TeamViewer’s ability to facilitate command and control operations, any unauthorized installation poses a significant risk. While remote access tools can be weaponized, many organizations legitimately use TeamViewer, which necessitates careful investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded if adversaries use methods such as file renaming, obfuscation, or deploying TeamViewer via trusted update mechanisms. Reliable detection requires complete file event logging configurations in Windows. Legitimate software updates or tool installations by IT teams may trigger this alert, underscoring the need for context in response. Consideration of companion detections, such as unusual outbound traffic patterns or verification of trusted software lists, can enhance security posture.

