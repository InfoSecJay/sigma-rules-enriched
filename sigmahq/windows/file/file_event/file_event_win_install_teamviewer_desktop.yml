note: |
  ### Technical Context

  This Sigma rule detects the creation of the `TeamViewer_Desktop.exe` executable, which typically occurs during the installation of TeamViewer, a remote access tool. The likely objective of this activity by an adversary could be to establish remote control or persistence on a compromised system. This behavior corresponds to the MITRE ATT&CK tactic of Command and Control (T1219), specifically under Tool: Software Deployment Tools (T1219.002).

  The primary telemetry sources include Windows File Creation Events, specifically focusing on logs indicating the generation of new executable files. If an unauthorized installation is confirmed, this could lead to significant security impacts, enabling unauthorized access to corporate systems and data. Importantly, this detection does NOT confirm that the installation was sanctioned or malicious on its own, as installations of legitimate software may trigger this event.

  ### Investigation Steps

  - **Verify process creation:** Check Security Event ID 4688 to confirm if `TeamViewer_Desktop.exe` was launched immediately after creation, indicating potential automated execution.

  - **Review application logs:** Inspect system logs for any existing TeamViewer session records. Look for `TeamViewer` entries in Event Viewer under Applications and Services Logs, and gather session IDs to establish legitimacy.

  - **Check installation logs:** Look for Windows Installer logs (`msiexec` logs) in Event ID 1033 to confirm if TeamViewer was installed by a known user or SYSTEM account, and validate expected installation behavior.

  - **Identify suspicious users:** Determine if the installation was executed by non-admin users or during unusual hours. Check User Account controls and corresponding process ownership in telemetry for signs of misuse.

  - **Examine known good baseline:** Compare against recent installation reports in your organization's software inventory. Verify TeamViewer installations against a list of authorized remote tools to distinguish between benign and potentially malicious activity.

  ### Prioritization

  This alert should be treated with medium severity; while the installation of TeamViewer could indicate legitimate remote support, its capability for remote control elevates its risk. Given that adversaries often use remote access tools for lateral movement or command and control, it's important to ascertain the context of the installation quickly.

  ### Blind Spots and Assumptions

  The detection may be limited by the presence of legitimate TeamViewer installations that could trigger false positives. Proper log configurations must be ensured to capture events related to file creations and process executions accurately. Also, administrative tasks performed during remote support sessions could inadvertently trigger this alert without indicating malicious intent. A related detection mechanism would be monitoring network connections associated with TeamViewer to establish if any unauthorized access attempts occur post-installation.

