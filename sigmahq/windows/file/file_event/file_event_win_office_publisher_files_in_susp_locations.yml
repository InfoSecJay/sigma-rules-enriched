title: Publisher Attachment File Dropped In Suspicious Location
id: 3d2a2d59-929c-4b78-8c1a-145dfe9e07b1
status: test
description: Detects creation of files with the ".pub" extension in suspicious 
  or uncommon locations. This could be a sign of attackers abusing Publisher 
  documents
references:
- https://twitter.com/EmericNasi/status/1623224526220804098
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-08
tags:
- attack.stealth
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
    - 'C:\Temp\'
    TargetFilename|endswith: '.pub'
  condition: selection
falsepositives:
- Legitimate usage of ".pub" files from those locations
level: medium
note: |
  ### Technical Context

  This rule detects the creation of files with a ".pub" extension in uncommon directories, specifically targeting known temporary or public folders on Windows systems. Attackers may leverage Microsoft Publisher files to embed malicious macros or remote code execution payloads. The relevant MITRE ATT&CK tactic is Execution (TA0002), with the technique being "User Execution" (T1203). Key telemetry sources include Windows file event logs that capture file creation events, particularly focusing on Event ID 4663. The security impact of this activity is high, as it could facilitate further exploitation or lateral movement within the network. However, this detection alone does NOT confirm malicious intent, as legitimate usage of Microsoft Publisher files can occur in these locations.

  ### Investigation Steps

  - **Check file creation details: ** Review Windows Security Event ID 4663 to ascertain `ObjectType`, `ObjectName`, `AccessMask`, and `ProcessId` fields related to the dropped ".pub" file. Correlate the timestamp with user activity.

  - **Examine file contents: ** If possible, analyze the contents of the ".pub" file to identify any embedded macros or suspicious code that could indicate malicious usage.

  - **Evaluate user behavior: ** Investigate the user associated with the file creation. Determine whether this user normally creates files in the identified paths or uses Publisher. Cross-reference with saved user activity logs or direct user inquiries.

  - **Monitor network connections: ** Check for outbound connections made shortly after file creation using Windows Defender Firewall or other IDS logs to identify any unusual patterns that could suggest external communication by the dropped file.

  - **Identify known benign usage: ** Reference past incidents or legitimate business processes that involved the use of ".pub" files in identified directories, particularly by the same user or department, to establish context for the alert.

  - **Document atypical file locations: ** Look beyond standard directories and search for the ".pub" extension in other non-standard file paths which might indicate targeted abuse rather than legitimate activity.

  ### Prioritization

  This alert is considered medium severity due to the potential for exploitation through a file type often associated with macro-based attacks. The risk stems from its use in unusual directories, raising concerns about possible malicious intent. While the abuse of such file types is documented, the occurrence in benign contexts may reduce the overall urgency of investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions that prevent full visibility into file content or by missing telemetry if logging is not configured to capture all relevant file event types. Legitimate usage by data analysts or administrators creating documentation may trigger the alert. No additional companion detections are suggested, although combining with alerts for unusual process creations associated with the file could strengthen overall security posture.

