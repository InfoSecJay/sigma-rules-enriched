title: Publisher Attachment File Dropped In Suspicious Location
id: 3d2a2d59-929c-4b78-8c1a-145dfe9e07b1
status: test
description: Detects creation of files with the ".pub" extension in suspicious 
  or uncommon locations. This could be a sign of attackers abusing Publisher 
  documents
references:
- https://twitter.com/EmericNasi/status/1623224526220804098
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-08
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
    - 'C:\Temp\'
    TargetFilename|endswith: '.pub'
  condition: selection
falsepositives:
- Legitimate usage of ".pub" files from those locations
level: medium
note: |
  ### Technical Context

  This rule detects the creation of files with the ".pub" extension in suspicious or uncommon locations, such as the Temp folders or Public directories, often leveraged by attackers for malicious purposes, including delivering payloads or enabling persistence mechanisms. The likely objective of such behavior could be to drop malicious Publisher documents that execute harmful scripts or retrieve further exploits. The relevant MITRE ATT&CK technique is "Defense Evasion - Create or Modify System Process" (T1543).

  The primary telemetry source for this detection is Windows file event logs, specifically monitoring file creation events. If malicious, the presence of these files could indicate an attempt to evade detection through the use of seemingly innocuous file types. It's important to note that this detection does NOT confirm malicious intent by itself; it simply points to suspicious file placement.

  ### Investigation Steps

  - **Validate file creation events:** Review Windows Security Event ID 4663 for File Creation events targeting paths such as `%TEMP%`, `C:\Users\Public\`, or `C:\Windows\Temp\` and note the file name and process creating it.

  - **Check process lineage:** Investigate the parent process of any suspicious file creations by querying Sysmon Event ID 1 to determine if the process creating the ".pub" file originated from a known benign application, such as Microsoft Publisher.

  - **Review user activity:** Examine the user account associated with the file creation. If the file was created by a standard user during work hours, it may point to benign usage, unlike if created by an account with unusual login times or from remote locations.

  - **Assess file characteristics:** For newly created ".pub" files, inspect their properties (metadata) for attributes like Author or created date; malicious files may exhibit discrepancies or metadata indicative of automated creation rather than manual.

  - **Correlate with other alerts:** Look for related alerts within the network related to script execution or unusual network calls made by processes that might interact with the newly created file, as this could indicate broader compromise.

  ### Prioritization

  This alert carries a medium severity rating due to the fact that it arises from potentially harmful behavior in widely accessible directories, which are often utilized for exploitation by adversaries. The likelihood of malicious abuse is moderate, as while the ".pub" file type can be benign, its deployment in these specific locations strongly suggests the possibility of weaponization.

  ### Blind Spots and Assumptions

  This detection may be limited by users legitimately using ".pub" files in these directories, thereby generating false positives. Furthermore, environments with misconfigured logging may lack adequate visibility into these file events. Additionally, frequent benign activities, such as software updates or batch processes that handle Publisher files, could trigger this alert. A companion detection to consider is monitoring for execution of any scripts or files created within the detected paths to establish a fuller picture of potential exploitation attempts.

