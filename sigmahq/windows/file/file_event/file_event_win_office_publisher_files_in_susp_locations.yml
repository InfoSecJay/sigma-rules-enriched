title: Publisher Attachment File Dropped In Suspicious Location
id: 3d2a2d59-929c-4b78-8c1a-145dfe9e07b1
status: test
description: Detects creation of files with the ".pub" extension in suspicious or
  uncommon locations. This could be a sign of attackers abusing Publisher documents
references:
- https://twitter.com/EmericNasi/status/1623224526220804098
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-08
tags:
- attack.defense-evasion
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains:
    - '\AppData\Local\Temp\'
    - '\Users\Public\'
    - '\Windows\Temp\'
    - 'C:\Temp\'
    TargetFilename|endswith: '.pub'
  condition: selection
falsepositives:
- Legitimate usage of ".pub" files from those locations
level: medium
note: |
  ### Technical Context
  This detection rule identifies the creation of files with the ".pub" extension in suspicious locations, specifically within temporary directories that are often targeted by malicious actors. The ".pub" file type is associated with Microsoft Publisher, and its presence in uncommon paths may indicate attempts by attackers to leverage these files for malicious purposes, such as delivering payloads, exfiltrating data, or as part of a larger attack vector (e.g., phishing campaigns).

  The likely attacker objectives in this scenario include evading detection by placing malicious Publisher documents in places less monitored or considered secure. This usage aligns with tactics such as "Defense Evasion" (MITRE ATT&CK Tactic: T1562) where adversaries aim to bypass security measures. Techniques such as "Indicator Removal on Host" (T1070) may also be relevant if the attacker attempts to conceal the malicious files.

  The primary data sources for this detection are Windows file event logs, specifically focusing on file creation events to monitor the placement of ".pub" files in these high-risk locations.

  ### Investigation Steps
  - **Review File Creation Logs:** Analyze the Windows file event logs for entries that show the creation of ".pub" files in the identified suspicious directories, such as `C:\Users\Public\` and `C:\Temp\`.

  - **Correlate with User Activity:** Investigate the user accounts associated with these file creations. Look for any anomalous behavior from the users, such as those not typically associated with the creation of ".pub" files.

  - **Examine File Contents:** If safe to do so, inspect the content of any identified ".pub" files for potential malicious scripts or embedded links that could indicate a phishing attempt or malware delivery.

  - **Check for Other Indicators:** Look for other files created around the same time in these directories, or unusual process executions that could indicate that an attacker is leveraging these files as part of a larger strategy (e.g., downloading additional components).

  ### Prioritization
  The alert carries a medium-level severity due to the potential impact of malware delivery or data exfiltration through malicious Publisher files, which are often effective in bypassing traditional security mechanisms. While the likelihood may vary based on the specific environment, these types of file manipulations generally warrant immediate attention.

  ### Blind Spots and Assumptions
  This detection approach may not capture all malicious activity, notably if attackers use legitimate software or processes to create or modify ".pub" files in typical locations without drawing attention. It assumes that the standard placements of ".pub" files are known to be uncommon in the enterprise, which may not be the case in all environments. Furthermore, adequate logging configurations must be in place to capture detailed file event logs for this detection to be effective.

