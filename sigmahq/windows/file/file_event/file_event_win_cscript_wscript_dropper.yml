note: |
  ### Technical Context
  This rule detects the creation of potentially malicious script files, specifically those ending in `.jse`, `.vbe`, `.js`, `.vba`, or `.vbs`, through the use of `cscript.exe` or `wscript.exe`. These scripting engines are commonly exploited by attackers to drop and execute malicious payloads, facilitating further stages of an attack, such as data exfiltration or lateral movement within a network. The threat scenario typically involves an attacker attempting to deliver a script that may perform malicious actions without user oversight, making it crucial for detection.

  The relevant MITRE ATT&CK tactics include **Execution** (TA0002), with specific techniques such as **Command and Scripting Interpreter: Windows Script Host** (T1059.005) and **Command and Scripting Interpreter: JavaScript** (T1059.007). In enterprise environments, leveraging these scripting languages often indicates an attempt to automate tasks that may bypass traditional defenses, especially on Windows systems.

  Primary data sources for detection include file event logs on Windows machines, particularly those capturing events related to script file creation and execution. Analyzing these logs will provide vital insights into the potential execution of unauthorized scripts, sparking investigations into their source and intention.

  ### Investigation Steps
  - **Review File Event Logs**: Examine file event logs for any recent entries indicating the creation of script files (`.jse`, `.vbe`, `.js`, `.vba`, `.vbs`) initiated by `cscript.exe` or `wscript.exe`.

  - **Analyze Parent Processes**: Investigate the parent processes of `cscript.exe` and `wscript.exe` to determine if they were executed in a suspicious manner or by unexpected users, which could indicate malicious intent.

  - **Correlate with User Activity**: Cross-reference the time of script execution with user activity logs. Look for any anomalies or patterns of behavior that suggest unauthorized access or privilege escalation.

  - **Monitor Network Connections**: If possible, analyze network traffic for connections originating shortly after the script file creation. This may reveal command-and-control communications attempting to exfiltrate data or download additional payloads.

  ### Prioritization
  This alert is considered high severity due to the potential impact of successful script execution in an enterprise environment, including data compromise and the facilitation of advanced persistent threats. The likelihood of these scripts being used maliciously is significant, particularly in scenarios where users may inadvertently execute them through phishing or social engineering tactics.

  ### Blind Spots and Assumptions
  While this detection rule focuses on specific file types and parent processes, it may not account for other methods attackers could use to deliver malicious scripts, such as direct execution without dropping files or through alternative scripting tools. The detection logic assumes that the use of `cscript.exe` or `wscript.exe` is unauthorized; however, legitimate administrative tasks may also generate similar events. Comprehensive logging of file events and scripting activity is essential for this alert to function accurately, which may require specific configurations on Windows machines to ensure complete coverage.

