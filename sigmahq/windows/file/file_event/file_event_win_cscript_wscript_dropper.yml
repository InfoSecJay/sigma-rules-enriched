note: |
  ### Technical Context

  This Sigma rule detects the creation of potentially malicious files with extensions such as .jse, .vbe, .js, .vba, and .vbs initiated by WScript or CScript (Windows scripting engines) on Windows systems. The likely objective of the attacker is to execute scripts that may perform unwanted actions like downloading malware, exfiltrating data, or establishing persistence. This behavior relates to the MITRE ATT&CK technique T1059.005 (JavaScript) and T1059.007 (Visual Basic Script).

  The primary telemetry sources involve Windows file events, specifically tracking writes made by the `wscript.exe` and `cscript.exe` processes in user directories or ProgramData. If malicious, this activity poses a significant risk, potentially leading to execution of harmful scripts on the system. However, it's important to note that this detection alone does not confirm that the scripts are malicious without further analysis of their content and context.

  ### Investigation Steps

  - **Review file creation events:** Check for file creation events corresponding to Event ID 4663 in security logs. Focus on file paths starting with `C:\Users\` or `C:\ProgramData` to identify newly created scripts.

  - **Examine process execution details:** Investigate the command-line parameters used by processes `wscript.exe` and `cscript.exe` via Sysmon Event ID 1. Identify unusual or obfuscated command-line strings that suggest malicious intent.

  - **Identify recently created files:** Look for the timestamps of the detected files. If they are created shortly after a user logged in or during unusual hours, this may indicate suspicious activity.

  - **Validate known benign scripts:** Refer to an inventory of approved scripts (if available) to cross-check with detected file paths. Legitimate scripts typically belong to known applications and should follow naming conventions (avoid odd characters or unfamiliar patterns).

  - **Correlate user behavior:** Investigate the activity leading to file creation by examining logs for unusual user behavior or elevated privileges on the account associated with the file creation, such as Event ID 4624 (Logon) in security logs.

  - **Check network activity:** Monitor network connections initiated by the newly created script files for outbound requests, focusing on unusual destinations or protocols. Validate against known safe external addresses.

  ### Prioritization

  This alert carries a high severity level as it targets potential script-based malware execution, which is a commonly weaponized technique. The presence of such scripts typically indicates a strong likelihood of malicious activity, especially if the affected systems are critical to business operations or handle sensitive data.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain logging configurations, such as auditing file and process creation events. Adversaries may use obfuscation or legitimate scripts to evade detection. Additionally, legitimate administrative activities or scheduled task executions might trigger the alert. A related detection to consider strengthening coverage includes monitoring for script execution attempts via Event ID 4688 to capture the full context of these scripting activities.

