note: |
  ### Technical Context

  This Sigma rule detects the creation of script files (e.g., `.js`, `.vbs`, `.vbe`, `.jse`, `.wsf`, `.wsh`, `.vba`) by Windows Script Host executables (e.g., `wscript.exe`, `cscript.exe`) in common directories associated with temporary and application data. The attacker objective may include establishing persistence, deploying malware, or executing arbitrary scripts for execution on target systems. This behavior relates to MITRE ATT&CK technique **T1059.005: Command and Scripting Interpreter: Windows Commands** and **T1059.007: Command and Scripting Interpreter: Visual Basic**.

  Key telemetry sources include Windows file event logs capturing file creations (e.g., Security Event ID 4663 or NTFS change journal entries). If malicious, these actions may indicate an attempt to execute a script as a payload. However, this detection does NOT confirm the execution or efficacy of the scripts—only their creation.

  ### Investigation Steps

  - **Review file creation events**: Check Security Event ID 4663 for file creation events matching extensions listed in the detection rule. Look for entries indicating a path that leads to either user or system directories, which may indicate malicious script activity.

  - **Verify parent process**: Validate the parent process of the script file creation using Event ID 4688 to ensure it is initiated by `wscript.exe` or `cscript.exe`. Legitimate processes should be applications like Microsoft Office or legitimate administrative scripts rather than unexpected executables.

  - **Identify script content**: If possible, analyze the actual content of the created script files for malicious indicators such as encoded strings, obfuscated code, or known malicious commands. Legitimate scripts typically contain benign automation tasks.

  - **Correlate with other endpoint behavior**: Check for related alerts or behaviors, including exclusive network connections (use Firewall logs or Proxy logs for unusual outbound connections) that may coincide with the timing of script creation. Look for connections to known malicious infrastructure.

  - **Examine artifact paths**: Legitimate activities may include system updates, user-initiated tasks, or application downloads; ensure that file paths (like `:\Temp\` or `:\ProgramData\`) align with expected behavior for active user applications or scheduled tasks.

  - **Assess the asset role**: Determine if the affected asset is a server, workstation, or critical system. Higher-risk machines (like domain controllers or customer-facing platforms) should escalate the response and investigation efforts.

  ### Prioritization

  The alert severity is high due to the potential impact on enterprise systems if malicious scripts are executed. The likelihood of abuse is significant, as these script-based payloads are commonly weaponized in various attack vectors like phishing campaigns or remote access Trojans.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive file auditing configurations or if script execution policies are overly permissive. Legitimate activities such as software installations or automated updates might trigger this alert under specific conditions. Companion detections for script execution or modifications to system startup items would enhance coverage against potentially malicious scripts.

