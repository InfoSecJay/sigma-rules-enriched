title: Access To Crypto Currency Wallets By Uncommon Applications
id: f41b0311-44f9-44f0-816d-dd45e39d4bc8
status: test
description: |
  Detects file access requests to crypto currency files by uncommon processes.
  Could indicate potential attempt of crypto currency wallet stealing.
references:
- Internal Research
author: X__Junior (Nextron Systems)
date: 2024-07-29
tags:
- attack.t1003
- attack.credential-access
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
  - FileName|contains:
    - '\AppData\Roaming\Ethereum\keystore\'
    - '\AppData\Roaming\EthereumClassic\keystore\'
    - '\AppData\Roaming\monero\wallets\'
  - FileName|endswith:
    - '\AppData\Roaming\Bitcoin\wallet.dat'
    - '\AppData\Roaming\BitcoinABC\wallet.dat'
    - '\AppData\Roaming\BitcoinSV\wallet.dat'
    - '\AppData\Roaming\DashCore\wallet.dat'
    - '\AppData\Roaming\DogeCoin\wallet.dat'
    - '\AppData\Roaming\Litecoin\wallet.dat'
    - '\AppData\Roaming\Ripple\wallet.dat'
    - '\AppData\Roaming\Zcash\wallet.dat'
  filter_main_system:
    Image: System
  filter_main_generic:
        # This filter is added to avoid large amount of FP with 3rd party software. You should remove this in favour of specific filter per-application
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_optional_defender:
    Image|startswith: 'C:\ProgramData\Microsoft\Windows Defender\'
    Image|endswith:
    - '\MpCopyAccelerator.exe'
    - '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Antivirus, Anti-Spyware, Anti-Malware Software
- Backup software
- Legitimate software installed on partitions other than "C:\"
- Searching software such as "everything.exe"
level: medium
note: |
  ### Technical Context
  This detection rule identifies access attempts to cryptocurrency wallet files by unusual or uncommon processes on Windows systems. The rule is particularly focused on monitoring file access requests in directories associated with various cryptocurrency applications, such as Ethereum, Bitcoin, Monero, and others. The presence of uncommon applications attempting to read these sensitive files may indicate an attacker attempting to exfiltrate cryptocurrency wallets as part of a broader credential theft or financial crime strategy.

  The likely objectives of an attacker could include stealing cryptocurrency accounts to facilitate unauthorized transactions or to hold them for ransom. This behavior is particularly concerning due to the increasing popularity of cryptocurrencies and the high value of assets stored within such wallets. Relevant MITRE ATT&CK tactics include **Credential Access** (TA0006) and the specific technique of accessing credential stores (T1003), since accessing wallet files can yield sensitive information that can be exploited further.

  Primary data sources for this detection include file access logs generated by the Microsoft-Windows-Kernel-File ETW provider, which can provide insight into file access patterns and help assess whether the activity corresponds with known legitimate applications or behaviors.

  ### Investigation Steps
  - **Review File Access Logs:** Assess the file access logs for events related to the specified cryptocurrency wallet files. Determine which process initiated the access and whether it is recognized as a legitimate application.

  - **Analyze Process Behavior:** Investigate the parent processes of the uncommon applications to identify any suspicious behaviors, such as unusual command-line options or parent-child relationships that indicate malicious activity.

  - **Correlate with Other Alerts:** Check for correlation with other security alerts, particularly those related to credential access or suspicious account behavior within your SIEM. Look for connections between the detected access and known threat actors or campaigns.

  - **Identify and Investigate User Account Activity:** Explore user account activities around the time of the detected access. Review logs for any unusual login patterns, suspicious use of administrative privileges, or accounts accessing sensitive systems not typically associated with them.

  ### Prioritization
  The severity of this alert is medium, as unauthorized access to cryptocurrency wallets can lead to significant financial loss, particularly in highly capitalized environments. Additionally, the likelihood of encountering such events increases with the rise of cryptocurrency usage in cybercrime.

  ### Blind Spots and Assumptions
  This detection rule may not cover all instances of cryptocurrency wallet file access, particularly if legitimate applications or processes not well known to the organization are accessing these files. Assumptions in the detection logic include that uncommon applications are indicative of malicious activity, which might not always be the case, especially in diverse environments with various legitimate tools. The proper logging configuration and access to ETW logs are required for this rule to function effectively; gaps in logging or misconfiguration could result in missed detections.

