title: Access To Crypto Currency Wallets By Uncommon Applications
id: f41b0311-44f9-44f0-816d-dd45e39d4bc8
status: test
description: |
  Detects file access requests to crypto currency files by uncommon processes.
  Could indicate potential attempt of crypto currency wallet stealing.
references:
- Internal Research
author: X__Junior (Nextron Systems)
date: 2024-07-29
tags:
- attack.t1003
- attack.credential-access
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
  - FileName|contains:
    - '\AppData\Roaming\Ethereum\keystore\'
    - '\AppData\Roaming\EthereumClassic\keystore\'
    - '\AppData\Roaming\monero\wallets\'
  - FileName|endswith:
    - '\AppData\Roaming\Bitcoin\wallet.dat'
    - '\AppData\Roaming\BitcoinABC\wallet.dat'
    - '\AppData\Roaming\BitcoinSV\wallet.dat'
    - '\AppData\Roaming\DashCore\wallet.dat'
    - '\AppData\Roaming\DogeCoin\wallet.dat'
    - '\AppData\Roaming\Litecoin\wallet.dat'
    - '\AppData\Roaming\Ripple\wallet.dat'
    - '\AppData\Roaming\Zcash\wallet.dat'
  filter_main_system:
    Image: System
  filter_main_generic:
        # This filter is added to avoid large amount of FP with 3rd party software. You should remove this in favour of specific filter per-application
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_optional_defender:
    Image|startswith: 'C:\ProgramData\Microsoft\Windows Defender\'
    Image|endswith:
    - '\MpCopyAccelerator.exe'
    - '\MsMpEng.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Antivirus, Anti-Spyware, Anti-Malware Software
- Backup software
- Legitimate software installed on partitions other than "C:\"
- Searching software such as "everything.exe"
level: medium
note: |
  ### Technical Context

  This rule detects instances where uncommon processes attempt to access cryptocurrency wallet files, such as those used by Bitcoin, Ethereum, and others, typically located in user directories. The likely attacker objective is to steal cryptocurrency by targeting wallet files, which contain sensitive private keys and transaction information. This behavior aligns with the MITRE ATT&CK tactic of Credential Access (TA0006), specifically technique T1003: Credential Dumping.

  The primary telemetry sources include the Microsoft Windows file access logs, requiring monitoring of File Access events through the ETW provider. A successful exploitation could lead to significant financial loss or theft. It is critical to note that this detection does NOT confirm a malicious actor is at work; it may simply reflect benign actions by legitimate applications or maintenance software.

  ---

  ### Investigation Steps

  - **Review accessing process details**: Investigate the process name and path in the event logs. Check if it is an uncommon application (not found under 'C:\Program Files', 'C:\Windows\system32'). Legitimate applications like backups or antivirus may also access these files but should originate from expected directories.

  - **Examine file access timestamps**: Analyze the timestamps of access attempts to determine if they align with known activity or high-risk periods (e.g., after hours). Frequent access by an uncommon process could indicate malicious intent.

  - **Correlate with user account activity**: Cross-reference user account logs (Event ID 4624 for logon) with the timeframe of file access events. Unexpected access patterns that do not match user logins should raise further investigation.

  - **Identify high-confidence indicators**: Look for specific uncommon processes accessing wallet files or paths such as "C:\Users\<username>\AppData\Roaming\Ethereum\keystore\". Uncommon tools like a terminal or scripts may indicate potential compromises.

  - **Monitor for backup task execution**: Determine if any known backup software (like Veeam or Acronis) executed around the same time these alerts triggered, as those will typically access wallet files for legitimate purposes.

  - **Evaluate for known malicious signatures**: Review uploaded hashes or process signatures against threat intelligence feeds to identify if the accessing application has been previously flagged for malicious activity.

  ---

  ### Prioritization

  The alert has a medium severity level, considering the potential high impact of the affected systems that manage cryptocurrency. The likelihood of malicious abuse is notable given the prevalence of attacks targeting cryptocurrency. This behavior is not uncommon among sophisticated adversaries aiming to gain unauthorized access to digital assets.

  ---

  ### Blind Spots and Assumptions

  This detection may miss access attempts by legitimate applications that are not configured properly in the filter criteria, allowing undesirable behaviors to slip through undetected. Additionally, if generating logs is not properly enabled for specific processes, critical information could be missed. Legitimate operations such as application updates or legitimate backup actions may erroneously trigger this alert. A companion detection focusing on credential dumping activities (like T1003) could enhance overall monitoring and defense capabilities against crypto theft.

