logsource:
  product: windows
  category: file_access
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\Microsoft\Teams\Cookies'
    - '\Microsoft\Teams\Local Storage\leveldb'
  filter_main_legit_location:
        # Note: its best to filter the full path to avoid false negatives
    Image|endswith: '\Microsoft\Teams\current\Teams.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify unauthorized access to sensitive files associated with Microsoft Teams, specifically targeting files such as cookies and leveldb storage that could contain sensitive authentication tokens. The rule aims to catch instances where uncommon or unexpected applications are interacting with these files, which can indicate a potential threat scenario where an attacker is attempting to exploit or extract sensitive data stored within Microsoft Teams.

  The likely attacker objective here is to undermine the authentication mechanisms of Microsoft Teams, leveraging token data to gain unauthorized access to users' session information or impersonate users within the platform. This type of behavior aligns with the MITRE ATT&CK framework under the credential access tactic, particularly the technique T1528: "Steal Application Access Token." It emphasizes the importance of monitoring file access patterns within collaborative platforms and recognizing tools that diverge from typical user behavior.

  Primary data sources for this detection include Windows file access logs, especially those related to Microsoft Teams file interactions, and Windows security logs capturing process operations. Capturing these events effectively requires using the Microsoft-Windows-Kernel-File ETW provider to provide visibility over file access events.

  ### Investigation Steps
  - **Review Access Logs:** Analyze Windows file access logs to identify the specific instances of file access to `Cookies` and `leveldb` directories associated with Microsoft Teams.
  - **Identify Uncommon Processes:** Check for any processes that accessed these sensitive Microsoft Teams files that are not recognized as legitimate (e.g., processes other than `Teams.exe`).
  - **Examine User Behavior:** Investigate the context of the access, including the user account associated with the file operation, to understand if the behavior falls outside normal patterns of use.
  - **Cross-Reference Application Activity:** Correlate the file access attempts with other logs, such as process creation events, to identify any unusual application behavior that could indicate a compromised endpoint or misuse of native applications.

  ### Prioritization
  This alert is of medium severity as unauthorized access to sensitive files within Microsoft Teams could expose user credentials and enable further exploitation within the organization, especially if the attacks are automated and systematic.

  ### Blind Spots and Assumptions
  One potential blind spot is that the rule may miss truly novel phishing or insider threats that do not use traditional applications, relying instead on uncommon binaries that are not yet identified as malicious. The detection logic assumes that any access by processes other than the legitimate `Teams.exe` is suspicious, which may lead to false positives if legitimate applications inadvertently access these files. Additionally, the alert requires the configuration of the Microsoft-Windows-Kernel-File ETW provider to ensure comprehensive visibility over file access events.

