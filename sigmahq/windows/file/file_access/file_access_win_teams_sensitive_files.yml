title: Microsoft Teams Sensitive File Access By Uncommon Applications
id: 65744385-8541-44a6-8630-ffc824d7d4cc
status: test
description: |
  Detects file access attempts to sensitive Microsoft teams files (leveldb, cookies) by an uncommon process.
references:
- https://www.bleepingcomputer.com/news/security/microsoft-teams-stores-auth-tokens-as-cleartext-in-windows-linux-macs/
- https://www.vectra.ai/blog/undermining-microsoft-teams-security-by-mining-tokens
author: '@SerkinValery'
date: 2024-07-22
tags:
- attack.credential-access
- attack.t1528
logsource:
  product: windows
  category: file_access
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\Microsoft\Teams\Cookies'
    - '\Microsoft\Teams\Local Storage\leveldb'
  filter_main_legit_location:
        # Note: its best to filter the full path to avoid false negatives
    Image|endswith: '\Microsoft\Teams\current\Teams.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects access to sensitive files related to Microsoft Teams, specifically Cookies and leveldb files, by processes that are not the legitimate Teams application (`Teams.exe`). The likely objective of an attacker is to extract authentication tokens or other sensitive information stored in these files, potentially leading to unauthorized access to user accounts or sensitive data within Teams. This activity aligns with the MITRE ATT&CK technique for Credential Access via Credential Dumping (T1528).

  The primary telemetry source is Windows file access logs, specifically from the Microsoft-Windows-Kernel-File ETW provider, to monitor actions involving certain file types and locations. If malicious, this behavior could severely compromise user credentials and corporate communication. Importantly, this detection does not confirm the presence of malicious intent on its own; further contextual investigation is required.

  ### Investigation Steps

  - **Verify File Access Originator:** Check the process accessing the sensitive files. Use Security Event ID 4663 or Sysmon Event ID 23 to identify the Image Name. Malicious activity is indicated if this is not `Teams.exe`; legitimate behavior should be coming from the expected Teams process.

  - **Check Access Patterns:** Review the timestamps and frequency of access to `\Microsoft\Teams\Cookies` and `\Microsoft\Teams\Local Storage\leveldb`. Frequent access by non-standard applications may indicate credential extraction attempts. Validate against normal usage patterns for your organization.

  - **Cross-reference User Activity:** Use user activity logs (from Active Directory or Microsoft 365 logs) to correlate the time of file access with legitimate user activities, such as scheduled tasks or known applications in use. Identify accounts and associated roles to ascertain context.

  - **Search for Additional Indicators:** Look for any `cmd.exe` or `powershell.exe` execution that might be associated with the unusual process. Check for their Event IDs (4688 for process creation). Identify whether commands are executed in the context of accessing Teams data, which could suggest automation or scripting attempts.

  - **Inspect Application Behavior:** Analyze the behavior of the uncommon application accessing the Teams files. Use process monitoring tools to assess its network activity, file modifications, or memory scraping behaviors—malicious applications often attempt to exfiltrate cached credentials or tokens.

  ### Prioritization

  The alert is deemed medium severity due to the potential high impact on credential compromise within enterprise environments where Microsoft Teams is extensively utilized. The likelihood of malicious abuse is significant given the clear utility of accessing authentication tokens and other sensitive information. While less common, this behavior has been recognized as an emerging attack vector.

  ### Blind Spots and Assumptions

  Detection may be limited by applications that obscure their true intentions or use legitimate software to mask their activities. The requirement for logging configurations to ensure comprehensive visibility is critical; if necessary ETW providers are not enabled, detection may fail. Legitimate applications such as backup solutions or third-party integrations may inadvertently trigger this alert. A related detection to consider is monitoring for unusual process creation events in conjunction to file access, which can further validate the intent behind these actions.

