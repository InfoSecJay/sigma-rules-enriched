title: Access To Windows Credential History File By Uncommon Applications
id: 7a2a22ea-a203-4cd3-9abf-20eb1c5c6cd2
status: test
description: |
  Detects file access requests to the Windows Credential History File by an uncommon application.
  This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::credhist" function
references:
- https://tools.thehacker.recipes/mimikatz/modules/dpapi/credhist
- https://www.passcape.com/windows_password_recovery_dpapi_credhist
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
modified: 2024-07-29
tags:
- attack.credential-access
- attack.t1555.004
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|endswith: '\Microsoft\Protect\CREDHIST'
  filter_main_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
# Increase level after false positives filters are good enough
level: medium
note: |
  ### Technical Context

  This Sigma rule detects file access requests to the Windows Credential History File, specifically the `CREDHIST` file. This behavior may indicate an attacker attempting to steal credentials using uncommon applications, such as tools like Mimikatz that target sensitive data stored by the Windows Data Protection API. The relevant MITRE ATT&CK tactic is Credential Access (TA0006), with specific focus on technique T1555.004 (Credentials from Credential History).

  The primary telemetry source is the Microsoft-Windows-Kernel-File ETW provider, which logs file access events on Windows systems. If malicious, accessing the `CREDHIST` file can lead to credential theft, enabling an adversary to gain unauthorized access to systems and accounts. However, this detection alone does not confirm that credential theft has occurred, as legitimate applications could mistakenly access the file.

  ### Investigation Steps

  - **Check the accessing application:** Review the `Image` field in the file access log. Look for uncommon or unauthorized applications attempting to access `CREDHIST`, which can indicate malicious intent. Legitimate applications typically include `explorer.exe` or standard system processes.

  - **Identify file access logs:** Collect logs from the ETW provider by filtering for File Access events that show access to `CREDHIST` at Event ID 4663 and include fields such as `AccessMask` and `ObjectName` to determine the type of access requested.

  - **Correlate with application behavior:** Examine other recent activities of the accessing application. Confirm whether it has a history of suspicious behavior or if it normally runs trusted processes on critical assets.

  - **Review system role and criticality:** Assess the importance of the affected system. If it is a critical server accessing `CREDHIST`, prioritize this investigation due to the potential impact of credential theft on sensitive operations.

  - **Validate expected legitimate behavior:** Check baseline behavior of known applications to see if they access `CREDHIST`; for instance, `C:\Windows\explorer.exe` accessing this path is common, while others are not.

  - **Search for Mimikatz indicators:** Look for known indicators of compromise linked with Mimikatz usage, including other log entries or anomalous processes in proximity to the CREDHIST access event.

  ### Prioritization

  This alert should be treated with medium priority due to the potential impact of credential theft on the enterprise. The likelihood of malicious abuse is elevated, especially if accessed by uncommon applications known for credential stealing. While not all accesses will be malicious, the context of this behavior warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be bypassed if an adversary uses legitimate tools that do not trigger unusual application flags when accessing the `CREDHIST`. Ensure the ETW provider is properly configured to capture relevant file access logs for reliable detection. Legitimate applications may occasionally access the credential history in specific contexts, creating potential for false positives. A companion detection, such as monitoring for unusual network behavior from the accessing application, can enhance threat detection capabilities.

