title: Access To Windows Credential History File By Uncommon Applications
id: 7a2a22ea-a203-4cd3-9abf-20eb1c5c6cd2
status: test
description: |
  Detects file access requests to the Windows Credential History File by an uncommon application.
  This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::credhist" function
references:
- https://tools.thehacker.recipes/mimikatz/modules/dpapi/credhist
- https://www.passcape.com/windows_password_recovery_dpapi_credhist
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
modified: 2024-07-29
tags:
- attack.credential-access
- attack.t1555.004
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|endswith: '\Microsoft\Protect\CREDHIST'
  filter_main_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
# Increase level after false positives filters are good enough
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts to access the Windows Credential History File, specifically targeting the file located at `C:\Microsoft\Protect\CREDHIST` by uncommon applications. Accessing this sensitive file can indicate a malicious intent, often related to attempts at credential theft. Attackers may use tools like Mimikatz, particularly the `dpapi::credhist` command, to extract stored credentials and leverage them for further lateral movement or privilege escalation.

  The primary concerns revolve around insider threats or advanced persistent threats (APTs) that use atypical programs to conceal their activities and evade detection. Successful access to the credential history could enable an attacker to harvest user credentials without detection, which is critical for executing further nefarious objectives such as unauthorized access or data exfiltration.

  Relevant MITRE ATT&CK techniques include:
  - Credential Access: Credential Dumping (T1555.004)

  Primary data sources for effective detection include File Access logs, particularly those generated by the Microsoft-Windows-Kernel-File ETW provider, which will document attempts to read or write to the Credential History File.

  ### Investigation Steps
  - **Review File Access Logs**: Analyze the logs for access attempts to the `C:\Microsoft\Protect\CREDHIST` file. Focus on timestamp, source application, and user context to identify unusual patterns or behaviors.

  - **Identify Uncommon Applications**: Cross-reference the list of applications accessing the credential history file against your organization's approved software inventory to identify any unauthorized or uncommon applications.

  - **Examine Process Creation Events**: Check for associated process creation events around the time of the file access. Look for any suspicious parent-child process relationships that may indicate exploitation attempts.

  - **Correlate with User Activity**: Investigate user account activity during the same timeframe as the file access. Pay attention to unusual login times, access locations, or other indicators of potential compromise.

  ### Prioritization
  The alert's medium severity stems from the potential for significant risk associated with credential theft, especially if the access comes from a non-standard application or overlooked user context. While not every access attempt indicates malicious intent, the possibility of credential compromise warrants prompt investigation.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage for legitimate applications that may also access the Credential History File without necessarily indicating malicious behavior. The detection logic assumes that a common application does not trigger the alert; however, benign applications could mistakenly be flagged as uncommon. Proper logging configurations, specifically enabling the Microsoft-Windows-Kernel-File ETW provider for file access, are critical for ensuring alert efficacy. Without this configuration, detection may yield incomplete or inaccurate results.

