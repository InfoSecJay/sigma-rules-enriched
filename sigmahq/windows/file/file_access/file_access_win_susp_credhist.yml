title: Access To Windows Credential History File By Uncommon Applications
id: 7a2a22ea-a203-4cd3-9abf-20eb1c5c6cd2
status: test
description: |
  Detects file access requests to the Windows Credential History File by an uncommon application.
  This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::credhist" function
references:
- https://tools.thehacker.recipes/mimikatz/modules/dpapi/credhist
- https://www.passcape.com/windows_password_recovery_dpapi_credhist
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
modified: 2024-07-29
tags:
- attack.credential-access
- attack.t1555.004
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|endswith: '\Microsoft\Protect\CREDHIST'
  filter_main_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
# Increase level after false positives filters are good enough
level: medium
note: |
  ---

  ### Technical Context

  This rule detects unauthorized access to the Windows Credential History File (`CREDHIST`) by applications that are not typically associated with legitimate system operations, indicating potential credential theft. An attacker may target this file to harvest sensitive user credentials stored by Windows. This behavior maps to the MITRE ATT&CK tactic of Credential Access (TA1203) and technique DPAPI Credential Theft (T1555.004).

  The primary telemetry sources required for this detection include event logs from the Windows Kernel File ETW provider, specifically tracking file access events. If malicious, this behavior can facilitate unauthorized access to user accounts and sensitive data, leading to a potential compromise of system integrity. Importantly, this detection does NOT confirm malicious intent on its own; it merely flags unusual access patterns to a sensitive file.

  ---

  ### Investigation Steps

  - **Verify the application performing the access**: Check the `Image` field for the process name. If it is an uncommon application (not typically seen in the environment), this may indicate malicious intent.

  - **Examine event details for context**: Review File Access Event IDs (e.g., 4663 for file access in security logs) associated with the interaction with `CREDHIST`. Observe the `AccessMask` for potentially unauthorized file access types.

  - **Identify legitimate process behavior**: Access to `CREDHIST` by usual Windows system tasks (like `C:\Windows\explorer.exe`) can often be benign; cross-reference these entries to assess context.

  - **Monitor for known malicious patterns**: Confirm if the detection correlates with known tools like Mimikatz using the `dpapi::credhist` function by checking for associated network activity or other intrusion artifacts.

  - **Review the incident history on the asset**: Investigate whether the affected system has previous security events or alerts related to credential theft or suspicious applications to establish a pattern of potential compromise.

  - **Check for file system artifacts post-access**: Validate if any files were created or modified, such as indicators of lateral movement or credential dumping.

  ---

  ### Prioritization

  This alert holds medium severity as accessing sensitive credential files can indicate a serious security incident. The likelihood of malicious abuse is high given that this type of behavior is often associated with advanced persistent threats. However, due to potential benign contexts, further investigation is necessary before escalation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by configurations or security policies that do not log all process accesses adequately. Legitimate administrative tools may trigger this alert if they access the `CREDHIST`, potentially leading to false positives. Additionally, ensure that the Windows Kernel File ETW provider is properly configured to capture the necessary file access logs. A companion detection rule that identifies known credential dumping tools would strengthen overall detection capabilities.

