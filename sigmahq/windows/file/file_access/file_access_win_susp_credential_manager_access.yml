title: Credential Manager Access By Uncommon Applications
id: 407aecb1-e762-4acf-8c7b-d087bcff3bb6
status: test
description: |
  Detects suspicious processes based on name and location that access the windows credential manager and vault.
  Which can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::cred" function
references:
- https://hunter2.gitbook.io/darthsidious/privilege-escalation/mimikatz
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-11
modified: 2024-07-29
tags:
- attack.t1003
- attack.credential-access
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\AppData\Local\Microsoft\Credentials\'
    - '\AppData\Roaming\Microsoft\Credentials\'
    - '\AppData\Local\Microsoft\Vault\'
    - '\ProgramData\Microsoft\Vault\'
  filter_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate software installed by the users for example in the "AppData" 
  directory may access these files (for any reason).
# Increase level after false positives filters are good enough
level: medium
note: |
  ---

  ### Technical Context

  This rule detects attempts by uncommon applications to access Windows Credential Manager and associated vault files, such as the ones found in the user directories. This behavior is often associated with credential theft, particularly using tools like Mimikatz, which exploit sensitive credential storage for unauthorized access. The relevant MITRE ATT&CK tactic is "Credential Access" (TA0006) and the technique is "Credential Dumping" (T1003).

  The primary telemetry source is Windows file access monitoring, specifically requiring logs generated by the Microsoft-Windows-Kernel-File ETW provider. If malicious, such activity could lead directly to unauthorized access to sensitive accounts or lateral movement within the network. Importantly, this detection does NOT confirm that legitimate authentication or access controls are compromised; it merely indicates an access attempt by an unusual process.

  ---

  ### Investigation Steps

  - **Check for unusual process names and locations:** Review events related to file access (Event ID 4663) for suspicious processes accessing paths such as `C:\Users\<username>\AppData\Local\Microsoft\Credentials\` or `C:\ProgramData\Microsoft\Vault\`. Compare the process names against known benign applications.

  - **Correlate with previous activity:** Look for related logs (Event ID 4688) to determine the command line arguments and parent processes of the suspicious applications. Confirm if these processes are executing from their expected locations or if they are instead manipulated copies.

  - **Verify any administrative access:** Investigate any recent user account activities, particularly those with administrative privileges that might allow for legitimate credential manager access. Ensure that these users and their access patterns have been validated.

  - **Identify signs of credential dumping:** Examine logs for instances of known credential dumping tools or libraries, such as Mimikatz, appearing in process creation events (Event ID 4688) with command-line arguments like `dpapi::cred`. Look specifically for any relevant child processes spawned from these detections.

  - **Review system folders for benign uses:** Ensure that legitimate applications, such as backup software or security tools, have necessary access to these credential files. Understand their normal operational behavior to differentiate benign access from potentially malicious attempts.

  - **Validate potential data exfiltration attempts:** If files are accessed and copied, check for associated network activity (Windows Event ID 5156 for filtering outbound connections) or unusual file creation timestamps in the destination paths that might indicate exfiltration (e.g., uploads to cloud services or internal transfers).

  ---

  ### Prioritization

  This alert is considered medium severity due to the potential impact of unauthorized credential access on critical systems. The likelihood of malicious abuse is high, given the common use of tools like Mimikatz in various attack scenarios. While not every access event to these files indicates an attack, the unusual process context warrants immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of logging for certain legitimate applications that interact with Credential Manager. Not all services or user actions will trigger this alert, leading to blind spots in detection coverage. Additionally, legitimate administrative activities may result in similar log patterns; thus, context is critical. Related detections, such as monitoring for known bizarre process behaviors (T1059 for command and scripting interpreter execution), can strengthen overall coverage and context around suspicious file access incidents.

