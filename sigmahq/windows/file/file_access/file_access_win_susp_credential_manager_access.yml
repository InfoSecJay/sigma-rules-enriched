title: Credential Manager Access By Uncommon Applications
id: 407aecb1-e762-4acf-8c7b-d087bcff3bb6
status: test
description: |
  Detects suspicious processes based on name and location that access the windows credential manager and vault.
  Which can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::cred" function
references:
- https://hunter2.gitbook.io/darthsidious/privilege-escalation/mimikatz
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-11
modified: 2026-07-28
tags:
- attack.t1003
- attack.credential-access
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\AppData\Local\Microsoft\Credentials\'
    - '\AppData\Roaming\Microsoft\Credentials\'
    - '\AppData\Local\Microsoft\Vault\'
    - '\ProgramData\Microsoft\Vault\'
  filter_main_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate software installed by the users for example in the "AppData" 
  directory may access these files (for any reason).
# Increase level after false positives filters are good enough
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unusual access attempts to Windows Credential Manager files by processes not typically associated with such access, indicating potential credential theft or unauthorized credential manipulation. Attackers may aim to harvest stored credentials for lateral movement or privilege escalation, often using tools like Mimikatz to perform these actions. This activity aligns with the MITRE ATT&CK technique for credential access (T1003).

  The primary telemetry source for this detection includes file access logs generated by the Microsoft-Windows-Kernel-File ETW provider, capturing events related to file reads from specified paths associated with the Credential Manager. If the behavior is confirmed malicious, it poses a significant security risk, potentially leading to unauthorized access to sensitive systems and data. However, this detection alone does not confirm that the access was malicious, as legitimate applications may also access these files.

  ### Investigation Steps

  - **Examine the process details**: Check the process name and path of the accessing application using Security Event ID 4672 or Process Creation events (Event ID 4688). Focus on any unexpected or uncommon applications listed in the process tree.

  - **Correlate file access timestamps**: Review logs for access attempts to `C:\Users\[UserName]\AppData\Local\Microsoft\Credentials\` and other specified paths around the same time as any suspected malicious activity. Access related to `explorer.exe` or well-known applications is often benign.

  - **Identify frequent file access patterns**: Analyze file access frequency and type of actions on Credential Manager files. Rapid, repeated reads from unknown executables may indicate nefarious activity.

  - **Verify user permissions**: Check the user account context under which the suspicious process runs. Legitimate access often comes from users with standard operational roles, whereas elevated privileges for accessing credential files can be a red flag.

  - **Validate anomalies with a reputation database**: Use a threat intelligence service to assess the reputation of the accessing process and path. Any process with a low reputation score or known association with credential dumping tools should be flagged for further investigation.

  ### Prioritization

  The alert severity is medium due to the potential impact on sensitive credential data, which can enable further attacks if compromised. The likelihood of malicious abuse is noteworthy, given that credential theft is a common tactic in various attack scenarios. While not every triggering event is malicious, the context of unusual access raises significant concern.

  ### Blind Spots and Assumptions

  The detection may miss legitimate software accessing these credential files for valid purposes, leading to potential false positives. An adversary might employ evasion techniques such as using commonly trusted applications to access the Credential Manager. A related detection to reinforce coverage is monitoring for Command-Line Invocation of common credential dumping tools, which could precede or coincide with access attempts to Windows Credential Manager files.

