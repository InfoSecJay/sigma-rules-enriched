title: Credential Manager Access By Uncommon Applications
id: 407aecb1-e762-4acf-8c7b-d087bcff3bb6
status: test
description: |
  Detects suspicious processes based on name and location that access the windows credential manager and vault.
  Which can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::cred" function
references:
- https://hunter2.gitbook.io/darthsidious/privilege-escalation/mimikatz
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-11
modified: 2024-07-29
tags:
- attack.t1003
- attack.credential-access
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\AppData\Local\Microsoft\Credentials\'
    - '\AppData\Roaming\Microsoft\Credentials\'
    - '\AppData\Local\Microsoft\Vault\'
    - '\ProgramData\Microsoft\Vault\'
  filter_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate software installed by the users for example in the "AppData" directory
  may access these files (for any reason).
# Increase level after false positives filters are good enough
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects unauthorized access to the Windows Credential Manager and vault by uncommon applications. Such behavior often indicates an attacker’s intent to exfiltrate credentials or gain unauthorized access to sensitive resources. The relevant MITRE ATT&CK tactic is Credential Access (TA0006), with the specific techniques being Credential Dumping (T1003). The primary telemetry sources include Windows kernel file access logs generated from Microsoft-Windows-Kernel-File ETW provider events. If malicious, the impact could be significant, allowing an attacker to compromise multiple accounts or systems. It is crucial to understand that this detection alone does not confirm malicious intent; legitimate applications may also access these files.

  ---

  ### Investigation Steps

  - **Identify the process accessing the credentials:** Review the Windows kernel file access logs (Event IDs related to ETW) for the specific process name and path that triggered the alert. Note the file paths accessed, particularly those indicating unusual or unexpected processes.

  - **Correlate with known software:** Check the legitimacy of the accessing application. Contrast the process name against a known whitelist of software that legitimately needs access to these credentials, such as IT management tools or security software.

  - **Examine for credential dumping behavior:** Look for common indicators of credential dumping mechanisms, especially the usage of known tools like Mimikatz. Search logs for references to "dpapi::cred" or similar calls that indicate credential retrieval attempts.

  - **Identify recent changes:** Assess the timeline of recent software installations or updates on the affected system for any applications that may access credential stores unusually. Especially focus on abnormal installations performed in the AppData folder.

  - **Establish baseline activity:** Review regular activity against the Credential Manager from the host in question. Determine what legitimate applications or processes are typically used to access the Credential Manager and establish a baseline for comparison.

  ---

  ### Prioritization

  The alert severity is medium due to the potential for attackers to exploit credential access for lateral movement or further compromise within the network. Given the behavior is often weaponized in targeted attacks, prompt investigation is warranted, especially if the affected system belongs to critical infrastructure or sensitive data access.

  ---

  ### Blind Spots and Assumptions

  One major limitation is that legitimate applications might frequently access the Credential Manager, leading to false positives. Reliable detection requires proper configuration of the ETW logging sources. Be aware that legitimate user actions or software installations might trigger this alert. To bolster detection capabilities, consider monitoring for lateral movement activities or changes to user access controls, which can indicate broader exploitation attempts.

