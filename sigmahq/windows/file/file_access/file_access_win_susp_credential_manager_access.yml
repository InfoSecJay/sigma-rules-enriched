title: Credential Manager Access By Uncommon Applications
id: 407aecb1-e762-4acf-8c7b-d087bcff3bb6
status: test
description: |
  Detects suspicious processes based on name and location that access the windows credential manager and vault.
  Which can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::cred" function
references:
- https://hunter2.gitbook.io/darthsidious/privilege-escalation/mimikatz
- https://www.absolomb.com/2018-01-26-Windows-Privilege-Escalation-Guide/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-11
modified: 2024-07-29
tags:
- attack.t1003
- attack.credential-access
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\AppData\Local\Microsoft\Credentials\'
    - '\AppData\Roaming\Microsoft\Credentials\'
    - '\AppData\Local\Microsoft\Vault\'
    - '\ProgramData\Microsoft\Vault\'
  filter_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate software installed by the users for example in the "AppData" directory
  may access these files (for any reason).
# Increase level after false positives filters are good enough
level: medium
note: |
  ### Technical Context
  This detection rule identifies unusual applications accessing the Windows Credential Manager, specifically targeting file paths associated with credential storage. Malicious actors may exploit this behavior to extract sensitive information, such as user credentials, using tools like Mimikatz, which is known for its ability to retrieve plaintext passwords and other sensitive data from memory and stored credentials. The suspicious behavior is particularly concerning because it can facilitate credential theft, privilege escalation, and lateral movement within an environment.

  The relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Credential Access (T1003)**: This encompasses various methods used by adversaries to access account credentials.
  - **Account Manipulation (T1098)**: By gaining access to credentials, attackers can manipulate accounts for unauthorized access.

  Primary data sources for validating this detection include event logs from Windows that capture file access activity, particularly the ETW (Event Tracing for Windows) provider for file access, which can provide detailed insights into applications interacting with sensitive credential files.

  ### Investigation Steps
  - **Review Process Creation Logs**: Examine logs for unusual processes initiated from common user directories like AppData. Note any processes that access Credential Manager files that typically do not require such access.
  - **Analyze File Access Events**: Collect file access logs that show which applications accessed credential storage locations. Focus on the file paths associated with Credential Manager as indicated in the rule.
  - **Verify Application Legitimacy**: Cross-reference the applications identified in the alerts against a known good list to determine if they are legitimate or commonly used tools that could explain access.
  - **Conduct Memory Analysis**: If suspected tools like Mimikatz are involved, analyze memory dumps for artifacts typical of credential stealing tools, including checking for traces of past credential dumping techniques.

  ### Prioritization
  This alert should be regarded with medium severity due to the potential for credential theft and subsequent unauthorized access to sensitive systems, which poses a significant threat if exploited.

  ### Blind Spots and Assumptions
  There may be gaps in detection if legitimate applications installed by users access these credentials for valid reasons, leading to potential false positives. The detection logic assumes that malicious applications will not reside in common Windows system folders, which may overlook sophisticated threats that masquerade as legitimate software. Required configurations include ensuring that the ETW provider for file access is correctly enabled and that logs are comprehensive enough to capture all relevant access events.

