title: Access To Potentially Sensitive Sysvol Files By Uncommon Applications
id: d51694fe-484a-46ac-92d6-969e76d60d10
related:
- id: 8344c19f-a023-45ff-ad63-a01c5396aea0
  type: derived
status: test
description: Detects file access requests to potentially sensitive files hosted 
  on the Windows Sysvol share.
references:
- https://github.com/vletoux/pingcastle
author: frack113
date: 2023-12-21
modified: 2024-07-29
tags:
- attack.credential-access
- attack.t1552.006
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|startswith: '\\'
    FileName|contains|all:
    - '\sysvol\'
    - '\Policies\'
    FileName|endswith:
    - 'audit.csv'
    - 'Files.xml'
    - 'GptTmpl.inf'
    - 'groups.xml'
    - 'Registry.pol'
    - 'Registry.xml'
    - 'scheduledtasks.xml'
    - 'scripts.ini'
    - 'services.xml'
  filter_main_generic:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This detection rule identifies file access requests to sensitive files within the Windows Sysvol share by uncommon applications that do not typically operate in this environment. Attackers often target Sysvol to access Group Policy Objects (GPOs) and other sensitive configurations for credential access, which may facilitate lateral movement or privilege escalation within a domain. This behavior relates to the MITRE ATT&CK framework under the "Credential Access" tactic (TA-1552) and the specific technique "Access Token Manipulation" (T1552.006).

  The primary telemetry source for this rule is the Microsoft Windows Kernel File ETW provider, which logs detailed file access events. If these access requests are malicious, they can severely compromise the security posture of a domain environment, leaking sensitive information or leading to unauthorized access. It is important to note that this detection does NOT confirm that the file access is malicious; legitimate administrative tools may also trigger this alert when accessing these files.

  ### Investigation Steps

  - **Verify the process making the request**: Check the `Image` field in logs for known legitimate applications (such as `C:\Windows\explorer.exe`) against unfamiliar processes. Uncommon or unexpected executables accessing Sysvol can indicate malicious intent.

  - **Review the accessed file names**: Identify which files were accessed based on the `FileName` field. Review for critical files like `Registry.pol` or `GptTmpl.inf`, as these are sensitive and commonly targeted; accesses from unexpected applications are concerning.

  - **Cross-reference with file access history**: Investigate the `event ID 4663` of the Security event log for additional context on the file access event, which logs the specifics of who accessed which file and when.

  - **Identify legitimate administrative access**: Look for baseline behavior by confirming normal administrative access patterns in your environment. Review personnel likely to access these files for tasks related to policy changes or updates.

  - **Analyze access patterns over time**: Use a log analytics platform to visualize access requests targeting Sysvol over a selected timeframe, pinpointing anomalies or sudden spikes in access attempts from uncommon applications.

  - **Check for high-confidence indicators of compromise**: If recognized malicious tools (e.g., `Mimikatz` or `BloodHound`) are present in the `Image` field of the logs alongside suspicious file accesses, prioritize further investigation for potential credential theft activities.

  ### Prioritization

  The severity of this alert is medium due to the potential access to sensitive configuration files, which can facilitate further attacks in the environment. Malicious exploitation of this rule can lead to significant security breaches, given that accessing these files is sometimes associated with tactics for privilege escalation. While this behavior is actionable, it is not commonly weaponized outside of specific adversary campaigns focusing on domain attacks.

  ### Blind Spots and Assumptions

  This detection may have limitations if legitimate administrative tools commonly access sensitive Sysvol files, leading to potential false positives. Ensure that logging for file access events is fully configured to capture all relevant actions. Legitimate activities, such as regular policy edits, may trigger alerts, complicating detection. A related detection, such as user activity surrounding Group Policy updates, can enhance coverage and provide context to reduce false positive rates on this rule.

