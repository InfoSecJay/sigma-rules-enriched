logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|startswith: '\\'
    FileName|contains|all:
    - '\sysvol\'
    - '\Policies\'
    FileName|endswith:
    - 'audit.csv'
    - 'Files.xml'
    - 'GptTmpl.inf'
    - 'groups.xml'
    - 'Registry.pol'
    - 'Registry.xml'
    - 'scheduledtasks.xml'
    - 'scripts.ini'
    - 'services.xml'
  filter_main_generic:
    Image|startswith:
    - 'C:\Program Files (x86)\'
    - 'C:\Program Files\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule is designed to detect access requests to potentially sensitive files located on the Windows Sysvol share, specifically targeting file access requests made by applications that are uncommon in legitimate operations. The Sysvol directory is a critical component of Active Directory, containing public files that must be accessible to all domain controllers in the domain, including Group Policy Objects (GPOs). Attackers might exploit these files to modify group policies, allowing them to execute unauthorized actions or maintain persistence within the network.

  The likely objectives of an attacker utilizing uncommon applications to access Sysvol files could be to extract sensitive information, manipulate group policy settings, or perform lateral movement within the domain. Understanding the contents of files like `GptTmpl.inf` or `Registry.pol` could provide insights into the security posture of the organization or expose credentials and privileged access paths.

  Relevant MITRE ATT&CK tactics include:
  - **Credential Access (T1552.006)**: Accessing sensitive files for the purpose of obtaining authentication credentials or elevated privileges.

  The primary data sources for this detection include:
  - File access logs that capture requests to the Sysvol share, particularly focusing on file paths that contain `\Policies\` or similar directories.

  ### Investigation Steps
  - **Review File Access Logs**: Collect logs related to file access on the Windows Sysvol share. Pay close attention to the specific filenames or patterns highlighted in the detection rule.
  - **Identify Uncommon Applications**: Investigate the processes initiating the access requests. Determine if these applications are standard enterprise software or indicative of suspicious behavior.
  - **Check Event Logs**: Examine Windows security event logs to correlate file access attempts with user activity and determine if there were failed access attempts, indicating potential reconnaissance.
  - **Analyze Group Policy Changes**: After confirming unauthorized access, look for any changes made to Group Policies and assess their implications on security and operations.

  ### Prioritization
  The alert should be considered of medium severity in an enterprise environment due to the potential risk associated with unauthorized access to sensitive configuration files. While the likelihood of misuse by common applications is low, the use of uncommon tools may indicate a security incident requiring immediate investigation.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage, especially if file access logging is not comprehensive or if the Windows Sysvol share is improperly configured to omit certain activities. The detection logic assumes that unusual applications will not typically access Sysvol files regularly, which may not hold true in every enterprise environment. Lastly, adequate logging configurations must be in place, particularly enabling the Microsoft-Windows-Kernel-File ETW provider, for this rule to function effectively.

