note: |
  ### Technical Context

  This Sigma rule detects unauthorized file access attempts to browser credentials storage locations by non-browser processes. The primary attacker objective is credential theft, targeting sensitive information such as usernames, passwords, and cookies stored by web browsers. This behavior represents tactics within the MITRE ATT&CK framework, specifically under **Credential Access** (TA-1555) and **Credential Storage** (T1555.003).

  The primary telemetry sources for this detection will be file access logs indicating accesses to browser credential storage paths (e.g., `Login Data`, `cookies.sqlite`). If successful, such actions could lead to significant security impacts, manifesting as unauthorized access to accounts or data breaches. It is crucial to note that this detection does NOT confirm malicious intent on its own; legitimate applications may also access these files for benign purposes.

  ### Investigation Steps

  - **Review File Access Events:** Check file access events in Windows Event ID 4663 for paths matching browser credential storage (e.g., `C:\Users\<User>\AppData\Local\Google\Chrome\User Data\Default\Login Data`). Compare against the timestamp of the alert.

  - **Identify the Process Making Access Attempts:** Investigate the `Image` field associated with the event. Look for known malicious or suspicious applications not typically associated with browsers. Process exhibiting abnormal behavior may denote a malicious intent.

  - **Correlate with User Context:** Check for expected user activity around the alert timestamp. Review user login events (Event ID 4624) and application usage logs (Event IDs 4688 for process creation) to ensure it aligns with legitimate usage patterns.

  - **Analyze Parent Process Relationships:** Identify the parent process using the `ParentImage` field in the event log. Malicious attempts typically lack a browser as the parent process. Verify if the parent process is legitimate or related to known malware (e.g., `msiexec.exe`, etc.).

  - **Check for High-Confidence Malicious Indicators:** Cross-reference the `Image` field of the process accessing the credential files against a list of known malicious software and tools associated with credential theft, consulting threat intelligence feeds or internal logs.

  - **Validate Legitimate Access Patterns:** Note that authorized applications may access browser data for synchronization purposes, particularly anti-virus or backup applications. Ensure the process is categorized and documented against these legitimate behaviors.

  ### Prioritization

  This alert has a **low** severity in typical enterprise contexts, as while credential accessing behavior can indicate compromise, many benign applications may also perform similar actions. However, systems at high risk for credential theft (e.g., admin accounts, sensitive user roles) may warrant increased scrutiny.

  ### Blind Spots and Assumptions

  Detection capabilities are limited against sophisticated evasion techniques, such as malware disguising itself as legitimate browser processes or user-initiated synchronization tools. Required log sources include accurate file access logging and the telemetry of application execution for effective detection. Legitimate activities that may trigger the alert include synchronization tasks from legitimate security or cloud applications. A related detection rule to strengthen coverage could involve monitoring suspicious process creations or unusual file access patterns in association with credential databases.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
