note: |
  ---

  ### Technical Context

  This rule detects unauthorized access attempts to browser credential storage files by non-browser processes, indicating possible credential theft through malware. The attacker's objective may be to extract sensitive user information such as usernames, passwords, or cookies from these secure storage locations. This behavior aligns with the MITRE ATT&CK framework under the tactic of Credential Access (T1555.003).

  The primary telemetry source for this detection is Windows file access logs, specifically capturing filesystem activity on browsers and their credential storage locations. If malicious, the security impact could involve unauthorized credential exposure, leading to account compromises and additional security breaches. Importantly, this rule does NOT prove malicious intent on its own; legitimate applications may also access these files correctly.

  ---

  ### Investigation Steps

  - **Review the process initiating the access:** Check Event ID 4663 and Event ID 4656 in the Security logs for file access. Identify the process attempting the access. Legitimate browser processes (e.g., `chrome.exe`, `firefox.exe`) should be expected here.

  - **Analyze the file access paths:** Examine file path details captured in the logs; access attempts to browser credential files (e.g., `Login Data`, `cookies.sqlite`) from processes not in the expected browser path (e.g., `C:\Program Files\Google\Chrome\`) may indicate an issue.

  - **Identify non-standard processes:** Cross-reference the logged process with known malicious software/credentials dumping tools that may target browser storage, such as suspicious executables not linked to legitimate browsers (e.g., `BreachGrabber.exe`, `CredentialDump.exe`).

  - **Assess frequency and volume of access attempts:** Investigate if there are multiple accesses to the same credential files over short timescales, which could indicate brute force or automated extraction attempts.

  - **Verify user and system context:** Check the user account associated with the activity. Access attempts that do not match the user's typical behavior or asset roles may warrant further investigation.

  - **Cross-reference with Defender ATP alerts:** If enabled, check Microsoft Defender ATP or EDR logs for alerts related to credential access or suspicious file activity that may corroborate or raise concerns regarding the same process or user.

  ---

  ### Prioritization

  This alert is of low severity, as the likelihood of malicious abuse is moderate. While credential theft is a serious threat, this specific behavior does not reflect commonly weaponized techniques. The context of the affected system and user actions should drive investigation prioritization.

  ---

  ### Blind Spots and Assumptions

  Detection may have limitations if legitimate applications are incorrectly accessing credential storage, leading to false positives. Environments that do not log file access events or lack telemetry from browser applications reduce detection reliability. Furthermore, legitimate maintenance tasks (e.g., backups or synchronizations) could trigger this alert. Companion detections focusing on known credential dumping tools or attacks targeting browser processes can enhance coverage.

  ---

