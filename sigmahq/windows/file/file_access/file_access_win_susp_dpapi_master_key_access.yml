title: Access To Windows DPAPI Master Keys By Uncommon Applications
id: 46612ae6-86be-4802-bc07-39b59feb1309
status: test
description: |
  Detects file access requests to the the Windows Data Protection API Master keys by an uncommon application.
  This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::masterkey" function
references:
- http://blog.harmj0y.net/redteaming/operational-guidance-for-offensive-user-dpapi-abuse/
- https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation/dpapi-extracting-passwords
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
modified: 2026-07-28
tags:
- attack.credential-access
- attack.t1555.004
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\Microsoft\Protect\S-1-5-18\'         # For System32
    - '\Microsoft\Protect\S-1-5-21-'         # For Users
  filter_main_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
# Increase level after false positives filters are good enough
level: medium
note: |
  ### Technical Context

  This Sigma rule detects file access requests to the Windows Data Protection API (DPAPI) master keys by uncommon applications, which may indicate credential theft behavior. The likely objective of an attacker is to extract sensitive information, such as passwords, by accessing DPAPI-protected data. This aligns with the MITRE ATT&CK tactic of Credential Access (TA0006) and the specific technique: Credentials from Password Managers (T1555.004). The primary telemetry sources include Windows kernel file access events, specifically through the Microsoft-Windows-Kernel-File ETW provider, with log types indicating access to files located in the DPAPI master key directories.

  If malicious, such behavior can lead to unauthorized access to sensitive credentials stored on the device, significantly compromising security. However, this detection does NOT confirm that credential theft has succeeded or that the accessing application is inherently malicious without further context.

  ### Investigation Steps

  - **Verify the accessing application:** Review the process triggering the file access using event logs (Sysmon Event ID 1). Identify if it's a known application or an uncommon one. Attempting to access DPAPI keys by common applications (e.g., `explorer.exe`) is expected.

  - **Check for specific file access events:** Look for Security Event ID 4663 related to file access in `C:\ProgramData\Microsoft\Crypto\RSA\` or the corresponding DPAPI directories. Uncommon applications accessing these files warrant further investigation.

  - **Correlate with other malicious indicators:** Cross-reference process access with known malicious samples in threat intelligence databases. Check if the accessing application matches patterns associated with tools like Mimikatz.

  - **Assess user behavior context:** Examine the user account that triggered the file access. Review account history and permission levels in Active Directory to identify any suspicious activity or privilege escalations.

  - **Identify competing legitimate activity:** Review whether backup or administrative scripts run by IT operations may legitimately access DPAPI keys. Such scripts will typically operate under specific service accounts rather than under arbitrary user accounts.

  - **Document high-risk processes:** Flag any instances where the file access was executed by applications known for credential extraction techniques, such as Mimikatz, identified through process command lines and paths logged in Event ID 4688.

  ### Prioritization

  The severity of this alert is medium due to the potential for serious security impacts if credentials are accessed. The likelihood of malicious misuse is moderate, as uncommon applications accessing sensitive credential stores generally indicate an attempt to exploit the system. This pattern aligns with behaviors commonly weaponized in credential theft scenarios.

  ### Blind Spots and Assumptions

  Detection can be limited by the unique application behavior that might not generate an alert. Legitimate administrative tools or backup scripts may trigger the alert, resulting in false positives. Comprehensive logging from the Microsoft-Windows-Kernel-File ETW provider is essential for reliable detection. A companion detection to enhance coverage could involve monitoring for unused or rarely seen applications executing processes linked to backups or credential management tasks.

