title: Access To Windows DPAPI Master Keys By Uncommon Applications
id: 46612ae6-86be-4802-bc07-39b59feb1309
status: test
description: |
  Detects file access requests to the the Windows Data Protection API Master keys by an uncommon application.
  This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::masterkey" function
references:
- http://blog.harmj0y.net/redteaming/operational-guidance-for-offensive-user-dpapi-abuse/
- https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation/dpapi-extracting-passwords
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
modified: 2024-07-29
tags:
- attack.credential-access
- attack.t1555.004
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\Microsoft\Protect\S-1-5-18\'         # For System32
    - '\Microsoft\Protect\S-1-5-21-'         # For Users
  filter_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
# Increase level after false positives filters are good enough
level: medium
note: |
  ### Technical Context

  This Sigma rule detects access requests to Windows Data Protection API (DPAPI) master keys by uncommon applications. The behavior indicates a possible credential theft attempt, particularly through tools like Mimikatz that exploit DPAPI for retrieving sensitive information. The relevant MITRE ATT&CK tactic is Credential Access, specifically technique T1555.004: "Credentials from Password Managers." The primary telemetry sources include Windows Event Logs capturing file access events, especially through the Microsoft-Windows-Kernel-File ETW provider.

  If these actions are malicious, they could lead to unauthorized access to sensitive credentials or data, posing a severe risk to organizational security. It's critical to note that this detection does NOT confirm malicious intent on its own—further investigation is necessary to contextualize the behavior and establish intent.

  ### Investigation Steps

  - **Identify the requesting application**: Check the `Image` field for the process name and path that triggered the access. Common legitimate applications include `explorer.exe` or `powershell.exe`, while uncommon applications could indicate suspicious activity.

  - **Review file access events**: Examine Windows Security Event ID 4663 for file access details, specifically focusing on attempts to access files under `C:\Microsoft\Protect\`. Look for access by uncommon processes.

  - **Correlate with process creation logs**: Validate against Sysmon Event ID 1 to see if the process that accessed the DPAPI master key was indeed spawned by an unexpected source, which might suggest an anomaly.

  - **Identify patterns of abuse**: Check for repeated access attempts by the same process or across different uncommon processes within a short time frame. This could indicate automated tooling.

  - **Look for legitimate DPAPI use**: Verify expected legitimate usage scenarios by inspecting trusted applications that commonly interact with DPAPI, such as Windows Credential Manager or Microsoft Edge.

  - **Check for tools**: Confirm if known credential dumping tools (e.g., Mimikatz) are present on the system by reviewing file paths for unusual binaries or scripts that could be linked to credential theft attempts.

  ### Prioritization

  This alert has medium severity in an enterprise context due to the potential for high-impact credential theft if malicious. Uncommon applications making requests to DPAPI master keys are often indicative of weaponized tools used in attacks. The likelihood of abuse is moderate, given that this behavior is associated with known tactics used by adversaries.

  ### Blind Spots and Assumptions

  Detection could be limited by the absence of comprehensive telemetry, such as file access logging not being enabled for all critical folders containing sensitive information. Legitimate applications, especially system agents or maintenance tools, might trigger this alert without malicious intent. Additionally, companion detections for abnormal process execution (e.g., Sysmon EID 1 for process creation) can enhance visibility into the threat landscape, providing context to the file access event.

