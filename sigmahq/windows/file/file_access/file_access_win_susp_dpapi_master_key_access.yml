title: Access To Windows DPAPI Master Keys By Uncommon Applications
id: 46612ae6-86be-4802-bc07-39b59feb1309
status: test
description: |
  Detects file access requests to the the Windows Data Protection API Master keys by an uncommon application.
  This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::masterkey" function
references:
- http://blog.harmj0y.net/redteaming/operational-guidance-for-offensive-user-dpapi-abuse/
- https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation/dpapi-extracting-passwords
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
modified: 2024-07-29
tags:
- attack.credential-access
- attack.t1555.004
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\Microsoft\Protect\S-1-5-18\'         # For System32
    - '\Microsoft\Protect\S-1-5-21-'         # For Users
  filter_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
# Increase level after false positives filters are good enough
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects file access requests to the Windows Data Protection API (DPAPI) master keys that originate from uncommon applications, which could indicate credential theft attempts. Attackers typically aim to exploit the DPAPI to access sensitive information such as stored credentials. This behavior aligns with the MITRE ATT&CK technique for Credential Dumping, specifically T1555.004 (Credential Dumping: DPAPI). The primary telemetry sources include ETW logs from the Microsoft-Windows-Kernel-File provider. If malicious, the impact could be significant, leading to unauthorized access to systems and data. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate applications may occasionally trigger it under certain conditions.

  ---

  ### Investigation Steps

  - **Review Process Executions:** Check for common applications executing file access. Look for Event ID 4688 (Process Creation) that shows processes launching uncommon applications around the timestamp of the alert.

  - **Examine DPAPI Access Requests:** Analyze ETW logs for file access attempts to `C:\ProgramData\Microsoft\Protect\` and `C:\Users\<username>\AppData\Roaming\Microsoft\Protect\` with unusual applications; legitimate activity will typically originate from system processes like `lsass.exe`.

  - **Identify Malicious Indicators:** Look for known malicious processes or tools, such as `mimikatz.exe`, accessing DPAPI master keys in the ETW logs. Focus on any instances where the Image field does not correspond to legitimate signed applications.

  - **Correlate Network Activity:** Cross-reference with network logs (e.g., Firewall logs or Proxy logs) to identify any unusual outbound connections from the originating device, which could indicate data exfiltration.

  - **Review User Access Patterns:** Investigate whether the user associated with the alert has login behavior that matches typical usage patterns, identifying possible unauthorized account access or privilege elevation.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to its potential impact on credential security. The likelihood of malicious abuse is moderate, given the specialized nature of the tools that trigger the detection. While DPAPI exploitation is not commonplace, it is a known method used by sophisticated adversaries in credential theft campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete logging for all user actions or settings that do not capture file access events adequately. Legitimate applications that utilize DPAPI for their operations could trigger this alert, making context important for interpretation. Companion detections for process execution (e.g., detecting known credential dumping tools) can enhance coverage and accuracy in identifying actual threats.

