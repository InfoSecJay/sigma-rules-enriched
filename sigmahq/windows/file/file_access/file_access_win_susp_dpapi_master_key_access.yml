title: Access To Windows DPAPI Master Keys By Uncommon Applications
id: 46612ae6-86be-4802-bc07-39b59feb1309
status: test
description: |
  Detects file access requests to the the Windows Data Protection API Master keys by an uncommon application.
  This can be a sign of credential stealing. Example case would be usage of mimikatz "dpapi::masterkey" function
references:
- http://blog.harmj0y.net/redteaming/operational-guidance-for-offensive-user-dpapi-abuse/
- https://book.hacktricks.xyz/windows-hardening/windows-local-privilege-escalation/dpapi-extracting-passwords
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-10-17
modified: 2024-07-29
tags:
- attack.credential-access
- attack.t1555.004
logsource:
  category: file_access
  product: windows
  definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
  selection:
    FileName|contains:
    - '\Microsoft\Protect\S-1-5-18\'         # For System32
    - '\Microsoft\Protect\S-1-5-21-'         # For Users
  filter_system_folders:
    Image|startswith:
    - 'C:\Program Files\'
    - 'C:\Program Files (x86)\'
    - 'C:\Windows\system32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
# Increase level after false positives filters are good enough
level: medium
note: |
  ### Technical Context
  This detection rule is designed to identify access attempts to Windows Data Protection API (DPAPI) master keys by applications that are not commonly associated with such operations. DPAPI is a Windows feature used to secure sensitive data like passwords or cryptographic keys. When uncommon applications attempt to access these master keys, it can indicate the presence of malicious activity, such as credential theft using tools like Mimikatz that exploit this API. The attacker’s objective in such scenarios is typically to extract sensitive information to elevate privileges or facilitate further exploitation within the network.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Credential Access** (TA0006) and specifically **Credential Dumping: DPAPI** (T1555.004). This highlights that detection is aimed at preventing unauthorized access to user credentials or sensitive data stored in encrypted formats by threat actors.

  Primary data sources for this detection include file access logs specifically associated with the Windows operating system's ETW (Event Tracing for Windows) provider for file operations. Monitoring these logs can reveal suspicious activity when uncommon processes attempt to access protected directories containing master keys.

  ### Investigation Steps
  - **Review File Access Logs:** Examine file access events related to the Windows DPAPI master keys located in the folders `C:\Microsoft\Protect\S-1-5-18\` and `C:\Microsoft\Protect\S-1-5-21-` for any unusual application activity.
  - **Identify Uncommon Applications:** Cross-reference the identified applications against a known list of standard applications accessing DPAPI keys. Determine if the accessing application is legitimate or potentially malicious.
  - **Correlate with Process Creation Events:** Investigate correlated process creation logs around the same time as access attempts to identify if these uncommon applications were executed without proper context or authorization.
  - **Analyze System Behavior:** Look for signs of privilege escalation or unusual user behavior that may coincide with DPAPI access, such as failed login attempts by the user associated with the process.

  ### Prioritization
  This alert is of medium severity in an enterprise environment due to the potential for significant impact if credential theft is successful. The likelihood of such behavior occurring from uncommon applications raises the need for prompt investigation, especially in sensitive areas of the network.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may occur if the system is configured to allow certain trusted applications to access the DPAPI keys without triggering alerts. The detection assumes all uncommon applications attempting to access these keys are suspicious, which may not always be the case. For the alert to function correctly, it requires proper configuration of the Microsoft-Windows-Kernel-File ETW provider to ensure comprehensive file access logging is in place. Additionally, any exclusions or exceptions configured for trusted applications may lead to gaps in detection.

