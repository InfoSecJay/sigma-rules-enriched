note: |
  ### Technical Context
  This detection rule identifies instances where a process deletes its own executable file. This behavior is rare under normal operations and often signifies malicious activity, as malware may use this technique to eliminate traces of its presence and hinder forensic analysis. By deleting its executable, the malware can evade detection tools that might rely on existing files for analysis and subsequent mitigation efforts.

  In a threat scenario, an attacker leveraging this behavior is likely attempting to cover their tracks after deploying a malicious payload on a target system. The primary goal is to maintain persistence or access while avoiding detection by security measures. This activity correlates to the MITRE ATT&CK technique for Defense Evasion, specifically **T1070.004: File Deletion**.

  The primary data sources for this rule will include Windows file delete logs, which capture events related to the deletion of files, including the executable files of running processes. Additional telemetry from process creation events may provide context for identifying the state of the involved processes before and after the deletion occurs.

  ### Investigation Steps
  - **Review File Delete Logs:** Analyze the logs related to file deletion events on the endpoint for suspicious activity, focusing on entries where the executable file matches the process ID present in the deletion event.

  - **Correlate Process Creation Events:** Check the process creation logs leading up to the file deletion. Determine if the process was newly spawned or exhibited unusual behavior prior to deleting its executable.

  - **Examine System and Security Event Logs:** Look for any unusual activities in the system and security logs around the time of the self-deletion. This includes tracking user login times and access to administrative functions.

  - **Evaluate Recent Software Installations or Changes:** Investigate if the system has had software installed or modified recently that could use self-deletion as part of its operation, ruling out legitimate uninstallers or application behavior.

  ### Prioritization
  The severity of this alert is rated as medium due to the potential impact on the environment if the indicator is indeed associated with malware. While self-deletion could also occur through legitimate processes, its occurrence in conjunction with other suspicious system activity warrants attention.

  ### Blind Spots and Assumptions
  One significant blind spot in this detection is the potential for benign false positives from legitimate uninstallers or system maintenance activities that may perform self-deletion. The detection logic assumes that any self-deletion of an executable by a running process is suspicious, which may not always hold true. This rule requires proper logging of file delete events and associated process activity to function effectively, underscoring the necessity for comprehensive logging configurations across endpoints.

