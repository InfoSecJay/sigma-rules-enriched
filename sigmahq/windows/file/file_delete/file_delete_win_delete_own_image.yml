  ---

  ### Technical Context

  This Sigma rule detects instances where a process deletes its own executable file, a behavior typically associated with malware that seeks to eliminate traces of its presence. The primary objective of this behavior is to evade detection and maintain persistence by removing executable files after execution. Relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0005) and the technique "File Deletion" (T1070.004). The rule primarily involves Windows file deletion logs, particularly focusing on the specific telemetry indicating deletions executed by processes themselves. If malicious, this behavior can significantly compromise system integrity, potentially enabling further exploitation or lateral movement within the network. However, this detection does NOT confirm malicious intent on its own, as legitimate uninstaller applications may also exhibit similar behavior.

  ---

  ### Investigation Steps

  - **Review deletion events:** Check Windows Event ID 4663 for file delete operations by processes, looking specifically for events where the `Object Type` is an executable file and the `Process ID` matches the `Process` reporting the deletion.

  - **Determine context of deletion:** Investigate the process that initiated the deletion. Use Sysmon Event ID 1 (Process Creation) to identify the command line used, checking for suspicious arguments, such as "delete," or unusual behavior in parent-child process relationships.

  - **Identify benign software interactions:** Look for known uninstaller signatures or legitimate software behavior. Note if processes like "msiexec.exe" or "setup.exe" correlate with the deletion event, indicating a standard software uninstall process rather than potential malicious activity.

  - **Correlate with file integrity monitoring:** Validate whether the executable was previously observed for malicious behavior or listed in threat intelligence feeds. Review any associated hashes against known malware databases to assess risk.

  - **Check for other related artifacts:** Look for potential persistence mechanisms or additional file manipulations. Investigate if new executables appear immediately after deletion, such as through monitoring file creation events (e.g., Event ID 1001 for file creation).

  - **Assess endpoint protection status:** Review EDR logs and any existing alerts to determine if existing security controls flagged the process during execution, establishing a baseline of expected activity versus anomalous deletions.

  ---

  ### Prioritization

  This alert is rated as medium severity due to the potential impact on system integrity and the likelihood of malicious abuse via self-deleting malware techniques. While the behavior is not exceedingly rare, it typically suggests an evasion tactic commonly weaponized by sophisticated threats in targeted environments.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of false positives from legitimate uninstallation processes that may trigger the same alerts. Reliable detection relies on comprehensive logging of file deletions and process activities, specifically from EDR tools or Sysmon configurations. Legitimate applications such as uninstallers or cleanup utilities can trigger this alert, necessitating careful review of the context surrounding the action. A related detection to strengthen coverage includes monitoring for unusual process creation patterns leading to file deletions, assisting in differentiating between legitimate and questionable behavior.

