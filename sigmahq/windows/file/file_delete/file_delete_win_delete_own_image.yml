note: |
  ### Technical Context

  This Sigma rule detects the deletion of a process's executable file by the process itself. This behavior is atypical and generally indicates an attempt to conceal malicious activity, possibly to avoid detection during or after executing a payload. Common attacker objectives include maintaining persistence while evading detection and securely removing traces of malicious actions. This activity maps to the MITRE ATT&CK technique **T1036: Masquerading** and **T1070: Indicator Removal on Host**.

  The primary telemetry sources for this detection include Windows file deletion events logged as Security Event ID 4663, which indicate file deletions, and potentially Sysmon Event ID 23, which logs delete operations with process linkage. If malicious, the security impact can be significant, as this behavior may reflect an active compromise. Importantly, this detection does NOT confirm that the process was malicious on its own; it merely indicates anomalous behavior that warrants further investigation.

  ### Investigation Steps

  - **Review Event Logs for Deletion Events**: Check for Security Event ID 4663 and Sysmon Event ID 23 for the target executable to confirm the deletion action. Look for unusual process owners or parent processes associated with these events.

  - **Correlate Process Activity**: Identify the process ID (PID) of the executable before deletion by analyzing prior Sysmon Event ID 1 (Process Creation). Compare the PIDs against known processes to establish a baseline for expected behavior.

  - **Validate Legitimate Uninstallation**: Investigate whether the deletion is linked to a legitimate uninstaller process (e.g., MSI installations). Check associated application logs for evidence of uninstallations or updates.

  - **Check for Known Malicious Indicators**: Use threat intelligence to verify if the process involved in the deletion is associated with known malware. Cross-reference the filename or hash with recent threat reports for any hits.

  - **Examine File Permissions and Ownership**: Analyze file permissions and ownership of the deleted executable prior to deletion. Legitimate applications usually follow standard permission patterns; deviations may indicate evasion tactics.

  - **Monitor Related Artifacts**: Validate any new file creation associated with the same PID shortly after the deletion, which might indicate creation of an alternate payload or attempt to re-establish persistence.

  ### Prioritization

  This alert should be treated with medium severity due to its correlation with potential evasive malware behavior. The affected systems' criticality should also factor in, as compromised hosts may lead to further network-wide impacts. This behavior, while uncommon, can be weaponized, particularly in sophisticated attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of complete log sources—specifically, Sysmon needs to be deployed and configured correctly to capture detailed process-related telemetry. Additionally, legitimate uninstallation processes may erroneously trigger this alert. Companion detections, such as monitoring for abnormal process creation or using heuristics on command-line arguments, can enhance coverage and improve context during investigations.

