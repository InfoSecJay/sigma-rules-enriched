logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|endswith: ':Zone.Identifier'
  filter_main_generic:
        # Note: in some envs this activity might be performed by other software. Apply additional filters as necessary
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\explorer.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_optional_browsers_chrome:
    Image:
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_browsers_firefox:
    Image:
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_browsers_msedge:
    Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other third party applications not listed.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects the deletion of the "Zone.Identifier" Alternate Data Stream (ADS) by a process that is not commonly associated with this action, such as those listed in the Sigma rule. The potential attacker objective is to bypass security controls that leverage Zone.Identifier to restrict the execution of files downloaded from the internet, thus facilitating the execution of malicious payloads. Relevant MITRE ATT&CK techniques include "Indicator Removal on Host" (T1070.004).

  The primary telemetry source is Windows file deletion logs, specifically looking for events associated with the deletion of files with the Zone.Identifier ADS. If malicious, this behavior can allow attackers to execute downloaded content without appropriate security checks. It is important to note that this detection does NOT confirm that malicious activity has occurred, as legitimate applications may also delete these streams.

  ---

  ### Investigation Steps

  - **Check for the process name and path**: Investigate if the deletion originated from an uncommon application outside standard file management (e.g., PowerShell) by checking logs for Event ID 4663 or Sysmon Event ID 23, filtering for processes not listed in the Sigma rule.

  - **Validate associated file activity**: Review file system logs around the deletion time for additional actions by the detected process, such as unusual file creations or modifications in the same directory, particularly for executables or scripts.

  - **Identify legitimate behavior**: Confirm if known applications like browsers or Microsoft Office are running around the same timeframe. Browser telemetry should include URLs accessed that may provide context to the potential file handling.

  - **Assess network activity**: Examine network logs (Firewall or Proxy logs) for connections to known malicious URLs or domains around the same time as the Zone.Identifier deletion to establish a possible correlation with threat actor activity.

  - **Cross-check with existing alerts**: Review alerts for other suspicious activities against the same endpoint that might indicate broader compromise, such as unusual user logins or unauthorized access attempts, as indicated by Security Event ID 4624.

  - **Support with file integrity checks**: If available, review logs for file integrity monitoring systems that track changes to files in sensitive directories to corroborate or refute the legitimacy of the deletion action.

  ---

  ### Prioritization

  This alert carries a medium severity due to the potential for significant impact if an important system or sensitive data is compromised. The likelihood of malicious use is moderate, as the deletion of Zone.Identifier ADS is a known technique for evading detection mechanisms, making it an avenue commonly weaponized by adversaries.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate applications not tracked in the rule, leading to false positives. Reliable detection requires comprehensive auditing of file deletion events (i.e., enabling Object Access auditing). Additionally, legitimate user activity, such as running scripts or file management tasks in PowerShell, may also trigger this alert. Companion detections, such as those focused on unusual PowerShell activity or other ADS manipulations, can strengthen overall coverage against adversarial actions.

