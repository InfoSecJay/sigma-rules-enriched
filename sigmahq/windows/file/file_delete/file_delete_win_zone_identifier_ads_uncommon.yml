logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|endswith: ':Zone.Identifier'
  filter_main_generic:
        # Note: in some envs this activity might be performed by other software. Apply additional filters as necessary
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\explorer.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_optional_browsers_chrome:
    Image:
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_browsers_firefox:
    Image:
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_browsers_msedge:
    Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other third party applications not listed.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the deletion of the "Zone.Identifier" Alternate Data Stream (ADS) by processes that are not commonly associated with this behavior. Such deletion is typically performed by attackers to evade security mechanisms that rely on ADS to flag potentially malicious files originating from untrusted sources, particularly when these files are opened in programs like Microsoft Office. The relevant MITRE ATT&CK techniques are Defense Evasion (T1070.004).

  The primary telemetry sources needed for this detection are Windows file deletion logs. Specifically, we are looking for logs indicating when an ADS is removed. If flagged as malicious, this action could allow an attacker to execute malicious content or drop payloads without appropriate security warnings, thereby increasing the risk of compromise. Importantly, this detection does NOT confirm malicious intent by itself—legitimate applications can also delete Zone.Identifier ADS under certain circumstances.

  ### Investigation Steps

  - **Review file deletion events: ** Check for Windows Event ID 4663 (Object Access) and Security Event ID 4660 (Object Deleted). Verify the TargetFilename for any entries ending with ':Zone.Identifier'.

  - **Identify the initiating process: ** Assess the Image field of the deletion event to identify the executing application. Look for processes not listed in the legitimate applications such as PowerShell, Google Chrome, or Firefox, as these are flagged when uncommon processes perform the deletion.

  - **Consider legitimate behavior: ** Determine if any of the known browsers or PowerShell instances are part of an expected workflow that would explain the deletion of the ADS, such as user-initiated interactions with untrusted files downloaded during normal business operations.

  - **Correlate with other activities: ** Look for associated suspicious activities from the same source process, such as unusual downloads, outbound connections, or file modifications in process logs, particularly with Event IDs 4104 (PowerShell), or HTTP request logs from proxies.

  - **Flag malicious indicators: ** If the deletion is triggered by processes such as UncommonApp.exe (an uncommon name suggesting a potentially malicious application), this warrants a high-confidence assessment of malicious intent, particularly if corroborated by other suspicious behavior.

  ### Prioritization

  This alert has medium severity due to its potential to indicate an evasion technique commonly used by attackers. While not all instances of this behavior are malicious, the risk associated with the affected systems and users' roles in the organization warrant immediate investigation.

  ### Blind Spots and Assumptions

  The detection may be limited by processes that do not log file deletions or by users with high privileges who might bypass standard logging. Third-party applications not listed in the rule could trigger false positives. Legitimate actions, such as manual file cleanup, could also activate this alert. A related detection could be alerts for unusual file modifications or access to a malicious file type that reinforces the need for strong monitoring of file activities.

