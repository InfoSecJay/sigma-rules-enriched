logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|endswith: ':Zone.Identifier'
  filter_main_generic:
        # Note: in some envs this activity might be performed by other software. Apply additional filters as necessary
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\explorer.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_optional_browsers_chrome:
    Image:
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_browsers_firefox:
    Image:
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_browsers_msedge:
    Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other third party applications not listed.
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where the Alternate Data Stream (ADS) named "Zone.Identifier" is deleted by uncommon applications. The presence of a Zone.Identifier indicates that a file has been downloaded from the internet and is subject to security warnings in Windows, which could be used by attackers to bypass these security restrictions. By deleting this stream, an attacker may attempt to evade detection mechanisms employed by antivirus solutions and to favor execution of potentially malicious files without raising alarms.

  The threat scenario often involves attackers using common tools, such as scripting languages or file manipulation applications, to delete the Zone.Identifier in order to facilitate the execution of malicious payloads or to introduce persistence mechanisms within the environment. This behavior falls under the MITRE ATT&CK tactic of **Defense Evasion** (ID: TA0005), specifically the technique of **Indicator Removal on Host** (ID: T1070.004). The relevant data source for this detection includes file deletion logs captured from Windows operating systems.

  ### Investigation Steps
  - **Review File Deletion Logs**: Collect and analyze logs that track file deletion events in Windows. Focus on entries associated with the deletion of Zone.Identifier ADS for suspicious processes.

  - **Identify Uncommon Processes**: Correlate the deletion events with the associated process name and path. Pay particular attention to instances where non-standard applications or processes are responsible for the deletion.

  - **Examine Context of Execution**: Inspect the command line arguments of the processes involved, as they may provide insights into whether the actions were legitimate or indicative of an attack.

  - **Correlate With Threat Intelligence**: Leverage threat intelligence sources to understand if the identified processes are known to be associated with bypass techniques utilized in other incidents or malware campaigns.

  ### Prioritization
  This alert should be treated as medium severity due to the potential for malicious activity associated with the deletion of security-related metadata. Given the likelihood of its use in a broader attack context, prompt investigation is essential to prevent potential breaches.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in environments where legitimate applications use Alternate Data Streams for valid purposes, leading to potential false positives. The detection logic assumes that only uncommon processes will trigger alerts for Zone.Identifier deletions, which may not account for all legitimate scenarios. Moreover, the functionality of this rule relies on comprehensive file deletion logs, which must be configured correctly in Windows environments to ensure accurate detection.

