  type: similar
status: test
description: Detects the deletion of the "Zone.Identifier" ADS by an uncommon 
  process. Attackers can leverage this in order to bypass security restrictions 
  that make use of the ADS such as Microsoft Office apps.
references:
- https://securityliterate.com/how-malware-abuses-the-zone-identifier-to-circumvent-detection-and-analysis/
- Internal Research
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-04
modified: 2025-07-04
tags:
- attack.defense-evasion
