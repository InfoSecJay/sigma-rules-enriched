logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|endswith: ':Zone.Identifier'
  filter_main_generic:
        # Note: in some envs this activity might be performed by other software. Apply additional filters as necessary
    Image:
    - 'C:\Program Files\PowerShell\7-preview\pwsh.exe'
    - 'C:\Program Files\PowerShell\7\pwsh.exe'
    - 'C:\Windows\explorer.exe'
    - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
    - 'C:\Windows\SysWOW64\explorer.exe'
    - 'C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe'
  filter_optional_browsers_chrome:
    Image:
    - 'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
    - 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  filter_optional_browsers_firefox:
    Image:
    - 'C:\Program Files (x86)\Mozilla Firefox\firefox.exe'
    - 'C:\Program Files\Mozilla Firefox\firefox.exe'
  filter_optional_browsers_msedge:
    Image:
    - 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    - 'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Other third party applications not listed.
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of the "Zone.Identifier" Alternate Data Stream (ADS) by processes that are not commonly associated with such activity. This behavior is leveraged by attackers to bypass security measures that rely on ADS, especially in the context of downloaded files, such as those processed by Microsoft Office applications. The likely attacker objective is to hide the origin and potentially malicious nature of a file, facilitating execution without further scrutiny.

  The related MITRE ATT&CK tactic is **Defense Evasion** under technique **T1070.004: Indicator Removal on Host**. The primary telemetry sources for this detection are Windows File Delete events, specifically looking for Windows Security Event ID 4663, which indicates an attempt to delete an object (in this case, the Zone.Identifier ADS). If this behavior is confirmed to be malicious, it can result in undetected execution of malware or exploitation of vulnerabilities through compromised files.

  However, simply detecting the deletion of the Zone.Identifier does NOT confirm malicious intent, as legitimate applications might perform similar actions under certain conditions.

  ### Investigation Steps

  - **Identify the process involved:** Check Security Event ID 4688 (Process Creation) for the `Image` field to determine which application initiated the deletion. Look for process names outside typical Windows applications, such as PowerShell or uncommon software.

  - **Review the source file properties:** Validate the original file's properties (e.g., via `Get-Item` in PowerShell) to see if it has a Zone.Identifier ADS. Files downloaded from the internet should have this ADS which indicates the file's origin.

  - **Correlate with recent suspicious activities:** Examine logs for recent process executions related to the detected process. Check Event ID 4688 for entries that occurred prior to the deletion to identify potential malicious workflows.

  - **Evaluate file access patterns:** Look for unusual file access or deletion patterns in `C:\Users\<username>\Downloads\` or temporary directories. Legitimate behavior typically involves common browsers and tools, not uncommon applications for handling file deletions.

  - **Check for alerts on similar detections:** Review for related alerts from companion detection rules such as T1070.001 (File and Directory Permissions Modification) which could indicate broader attempts to manipulate file properties and permissions.

  - **Assess potential bypass attempts:** Investigate the use of tools commonly associated with file manipulation like `PowerShell`, observing for unusual commands or execution flags indicating potential abuse (e.g., `-E` for encoded scripts).

  ### Prioritization

  Alerts generated by this detection should be treated with a medium priority due to the potential impact of hidden malicious file execution. The likelihood of this behavior being exploited by an adversary is significant, especially in environments with high reliance on downloaded content. This technique is commonly weaponized in malware distributions, intensifying the need for thorough investigation.

  ### Blind Spots and Assumptions

  This detection may miss cases where legitimate software performs similar deletions without triggering alerts, leading to false negatives. Depending on the environment, specific log sources such as detailed File System Auditing must be enabled for accurate detection. Additionally, unexpected software behaviors (like script execution from third-party applications) may trigger this alert. A companion detection for extensive behavior analysis such as T1047 (Windows Management Instrumentation) can enhance coverage and context.

