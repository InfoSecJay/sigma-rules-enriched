note: |
  ### Technical Context

  This Sigma rule detects the deletion of Tomcat web server log files, which may indicate an adversary's attempt to cover their tracks by destroying forensic evidence. Attackers may exploit this action to hide their activities after successfully gaining unauthorized access or conducting malicious operations on the server. The relevant MITRE ATT&CK tactic is "Obfuscation" (TA0005), specifically technique T1070 ("Indicator Removal on Host"). Primary telemetry sources include Windows file deletion logs and Sysmon logs detailing file system activity (Event ID 23). If the deletion is malicious, it can severely compromise the organization's ability to investigate security incidents. This detection does NOT confirm malicious intent on its own, as legitimate operations such as log rotation or uninstallation could account for the deletion.

  ### Investigation Steps

  - **Review file deletion logs:** Check for Event ID 23 in Sysmon logs, focusing on entries where `TargetFilename` contains `\Tomcat\logs\` and includes filenames such as `catalina.*` or `_access_log.*` to identify log deletions.

  - **Analyze the user context:** Verify the security principal (user or process) that executed the file deletion. Legitimate deletions may originate from service accounts during log rotation (e.g., running `logrotate`), whereas unauthorized deletions may be performed by unexpected users or processes.

  - **Identify associated process activity:** Correlate the file deletion events with preceding Sysmon Event ID 1 (process creation) to find any suspicious processes that might have deleted the logs, noting any potential use of tools like `PowerShell` or `cmd`.

  - **Cross-reference with other log sources:** Consult application logs (e.g., Tomcat’s own logging inside any other retained files) to find indications of suspicious access patterns prior to log deletion events, which may reveal malicious intent.

  - **Determine server role and environment impact:** Evaluate the criticality of the affected Tomcat server. If it hosts sensitive applications, prioritize this incident due to potential significant impacts on confidentiality and integrity.

  - **Confirm or rule out benign activities:** Identify if the Tomcat server is due for maintenance or log rotation. These activities typically occur on a schedule and may explain the deletions as part of system administration, contrasting the patterns seen with malicious actions.

  ### Prioritization

  The severity of this alert is medium, given that the deletion of logs from a Tomcat web server can indicate a malicious actor trying to hide illicit activity. The likelihood of malicious abuse increases if other suspicious behaviors are detected in conjunction with log deletions. This behavior is a known technique used in attacks aiming to prevent detection by security monitoring.

  ### Blind Spots and Assumptions

  Limitations include potential evasion by attackers using legitimate administrative functions to delete logs, which may trigger this alert. Reliable detection requires ensuring that logging for all relevant file system operations is properly configured (Sysmon and general Windows event logs). Legitimate activities such as regular maintenance and log rotation may also trigger this alert. Another complementary detection to consider is monitoring for the execution of command-line arguments (Sysmon Event ID 22) that could indicate direct file manipulation or unauthorized access attempts related to log files.

