detection:
  selection:
    TargetFilename|contains|all:
    - '\Tomcat'
    - '\logs\'
    TargetFilename|contains:
    - 'catalina.'
    - '_access_log.'
    - 'localhost.'
  condition: selection
falsepositives:
- During uninstallation of the tomcat server
- During log rotation
