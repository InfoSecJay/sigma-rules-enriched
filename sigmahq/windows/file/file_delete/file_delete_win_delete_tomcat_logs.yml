logsource:
  category: file_delete
  product: windows
detection:
  selection:
    TargetFilename|contains|all:
    - '\Tomcat'
    - '\logs\'
    TargetFilename|contains:
    - 'catalina.'
    - '_access_log.'
    - 'localhost.'
  condition: selection
falsepositives:
- During uninstallation of the tomcat server
- During log rotation
level: medium
note: |
  ### Technical Context
  This rule detects the deletion of Tomcat WebServer log files, which may indicate malicious attempts to eliminate forensic evidence of an attack or other unauthorized activities. Attackers often target logs in order to obscure their tracks after compromising a system, thereby hindering incident response efforts. The presence of log deletion activities could be part of a broader effort to evade detection and maintain persistence within a network.

  The threat scenario often involves an attacker gaining access to the application server and executing commands to delete log files, creating a significant barrier for security teams trying to investigate a breach. The relevant MITRE ATT&CK tactics include **Defense Evasion (T1560)**, highlighting how attackers may seek to delete logs to avoid detection. Additionally, the technique **Indicator Removal on Host (T1070)** relates directly to the deletion of logs or indicators of compromise.

  Primary data sources that will provide the best evidence for this detection include Windows file delete logs, specifically tracking file modifications and deletions under the Tomcat directories, which should be monitored for suspicious activity involving log file names like `catalina.*`, `_access_log.*`, and `localhost.*`.

  ### Investigation Steps
  - **Review File Deletion Logs**: Check the Windows Event Logs for any file deletions in the specified Tomcat directories. Look for deletions of specific log files, noting the timestamps and user accounts that executed the actions.
  - **Correlate with User Activity**: Assess the user activity logs around the same time as the file deletions. Determine if unusual user behavior or processes were occurring prior to the deletion event that could indicate an account compromise or unauthorized access.
  - **Check for Other Indicators**: Investigate any related suspicious activity on the server, such as unexpected processes running or unauthorized access attempts. Look out for changes in application configuration that may suggest tampering.
  - **Analyze System Events**: Review other relevant logs, including application logs, security logs, and any other storage related to the Tomcat application, to gather context on actions leading up to the deletion.

  ### Prioritization
  This alert is assigned a medium severity level due to the critical role that log files play in incident investigation and forensic analysis. Deleting logs can significantly hinder an organization’s ability to understand potential breaches and respond effectively, making such behavior a high-priority investigation.

  ### Blind Spots and Assumptions
  One notable gap in detection coverage is the potential for legitimate activities, such as log rotation or server uninstallation, to trigger false positives. The detection logic assumes that the log deletion is indicative of malicious intent; however, periodic maintenance could account for these actions. Additionally, there must be proper auditing and logging configurations in place on the Windows system to ensure accurate capture of file deletion events, including appropriate permissions to monitor deletions in the Tomcat directories.

