detection:
  selection:
    TargetFilename|contains|all:
    - '\Tomcat'
    - '\logs\'
    TargetFilename|contains:
    - 'catalina.'
    - '_access_log.'
    - 'localhost.'
  condition: selection
falsepositives:
- During uninstallation of the tomcat server
- During log rotation
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of Tomcat web server log files, which may indicate an attempt to erase traces of activities on the server, a common tactic used by adversaries to destroy forensic evidence after malicious actions. The likely attacker objective is to hinder detection efforts by removing logs that could provide insights into unauthorized activities. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005) with the technique being **Indicator Removal on Host** (T1070).

  The primary telemetry sources for this detection are Windows file system events, specifically focusing on file deletion actions where the log filenames include critical identifiers such as 'catalina.' or '_access_log.'. The security impact of malicious deletion of these logs can lead to reduced visibility and hinder investigations into unauthorized access or exploitation attempts. This detection does NOT confirm that a compromise has occurred; legitimate system operations such as routine log rotation or server uninstallation could also trigger this alert.

  ### Investigation Steps

  - **Identify relevant deletion events:** Review Windows Security Event ID 4663 to identify file deletion actions. Look for specific targets like `\Tomcat\logs\catalina.*` or `_access_log.*` to confirm the deletion of pertinent log files.

  - **Correlate with other log sources:** Check the Windows event logs for applications or prior security events, specifically Event ID 4004 (Tomcat error events) that may indicate unusual behavior leading up to the deletion, providing context to the alert.

  - **Review system change logs:** Examine the event log for administrative actions, particularly Event ID 4702, which tracks changes to system settings or configurations. Confirm whether there were scheduled maintenance actions or legitimate log rotations leading to log deletions.

  - **Assess the system's role:** Understand the context of the affected system (e.g., if it belongs to a critical application stack). Identify whether this Tomcat instance is critical to business operations and under what circumstances log deletion could be deemed acceptable.

  - **Check for other indicators of compromise:** Look for signs of unauthorized access, such as unusual access patterns in other logs, like Windows Security Event ID 4624 (logon events), around the same timeframe as the log deletions.

  ### Prioritization

  The alert severity is medium, as while the impacted system—which may host critical applications—is important, the likelihood of malicious abuse through log deletion can vary based on operational context. Deletion of such logs is often weaponized in post-exploitation phases, underscoring the need for careful investigation.

  ### Blind Spots and Assumptions

  There are limitations, including the potential for legitimate activities, such as server upgrades or log rotation, to trigger this alert. This detection relies heavily on the availability of accurate file deletion logs; thus, configurations for logging should be verified to ensure comprehensive coverage. Related detections might include monitoring for changes in file permissions (T1212) or suspicious process creation (T1059), which can further strengthen the investigation and context around potential log deletions.

