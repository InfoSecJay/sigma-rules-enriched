  ### Technical Context

  This Sigma rule detects the deletion of IIS WebServer access logs, which may indicate attempts by adversaries to erase forensic evidence of their activity on a web server. The likely attacker objective is to evade detection following malicious activities, such as web application exploitation or unauthorized access to sensitive data. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1070).

  The primary telemetry source is Windows file deletion logs, typically captured through the "file_delete" event category. The relevant log type includes the Windows Security Event ID 4663, which provides details about the file deletion events, such as the file path and user who performed the action. If malicious, the deletion of these logs can severely impact an organization's ability to investigate breaches or unauthorized access. However, this detection does not confirm malicious intent on its own, as legitimate activities like log rotation or service uninstallation can also trigger the same alert.

  ### Investigation Steps

  - **Check Event ID 4663 for deletions**: Investigate Windows Security Event ID 4663 to identify log deletions, focusing on the `TargetFilename` field for evidence of the deletion of files within `C:\inetpub\logs\LogFiles\`. Note the username in the `SubjectUserName` field to determine if a legitimate administrative user was involved.

  - **Review timestamp and frequency of deletions**: Analyze the timestamps of the deletion events to find anomalous activity patterns. Frequent deletions at odd hours or by non-administrative users can indicate malicious actions.

  - **Correlate with existing user roles**: Confirm whether the user performing the deletion has appropriate permissions and roles within the web server context. For example, a regular user deleting access logs is suspicious, whereas a system admin performing routine log rotation may be legitimate.

  - **Check for accompanying suspicious actions**: Look for any prior security events, such as unusual logins (Event ID 4624) or failed login attempts (Event ID 4625) leading up to the deletions. A succession of failed access followed by log deletion can signify an attempted cover-up of unauthorized access.

  - **Identify non-standard interactions with log files**: Monitor for unusual application behaviors or scripts accessing log directories. Any unexpected encrypted transfers or modifications can indicate malicious data manipulation or exfiltration.

  ### Prioritization

  This alert has medium severity as it indicates potential malicious activity, particularly in critical web environments where IIS is deployed. The likelihood of abuse is moderate, especially in scenarios involving sensitive customer data or financial transactions, as adversaries often seek to erase traces of their activities. Deleting access logs is a common technique used by attackers to maintain persistence or cover their tracks.

  ### Blind Spots and Assumptions

  Possible detection limitations include evasion techniques such as legitimate users deleting logs during troubleshooting or log management processes. It is crucial to ensure that logging levels for file deletions are adequately configured to capture this activity. Legitimate activities that might trigger this alert include regular log maintenance or the uninstallation of the IIS service. A related detection that could strengthen coverage is monitoring for anomalous access to the IIS configuration settings, which may indicate attempts to change security configurations (MITRE ATT&CK T1070.001).

