note: |
  ### Technical Context
  This detection rule is designed to identify the deletion of access logs generated by IIS WebServer, which could signal an attempt to eliminate forensic evidence related to malicious activities. Attackers may manipulate web server logs to obscure their tracks, hinder investigation efforts, or create a false narrative about their actions. Deletion of these logs commonly aligns with tactics employed during data exfiltration, lateral movement, or post-exploitation scenarios, as adversaries seek to cover their tracks following potentially malicious access to systems.

  Relevant MITRE ATT&CK tactics associated with this behavior include "Defense Evasion" (TA0005) and "Indicator Removal on Host" (T1070). The primary data sources for detecting this activity would be file system logs that track file deletion events, especially targeting the IIS log directory, typically located at `\inetpub\logs\LogFiles\`.

  ### Investigation Steps
  - **Review Deletion Logs**: Check file deletion logs for records indicating which access logs were deleted, including the timestamp and responsible user account.
  - **Correlate with Other Events**: Investigate other security events occurring around the time of log deletion, such as unusual web server access or privilege escalation attempts by the user account responsible.
  - **Examine User Activity**: Analyze the activity of the user account that deleted the logs to ensure it aligns with normal operational behavior and does not show signs of compromised credentials.
  - **Inspect Backup Availability**: Verify the presence of backups for the deleted logs to assess the potential forensic impact and facilitate further investigation into the deleted evidence.

  ### Prioritization
  The alert is assessed as medium severity due to the potential risk associated with log deletions in an enterprise environment. This behavior could indicate preparatory steps prior to malicious actions or cover-up efforts following a breach, necessitating prompt investigation.

  ### Blind Spots and Assumptions
  This detection may not cover every scenario where log deletions occur, such as legitimate administrative activities like log rotation or service uninstallation, which can lead to false positives. The detection logic assumes that log deletions are inappropriate in the operational context of the organization. Adequate auditing and logging configurations for file system activities must be enabled to ensure this alert functions correctly.

