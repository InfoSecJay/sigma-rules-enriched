  ### Technical Context

  This Sigma rule detects the deletion of IIS WebServer access logs, indicating a potential attempt to eradicate digital footprints related to web server activity. The likely attacker objective is to prevent detection of unauthorized access or malicious actions performed through the web server. This activity aligns with the MITRE ATT&CK technique under the tactic "Defense Evasion," specifically T1070 (Indicator Removal on Host).

  The primary telemetry source for this detection is file deletion events on Windows servers, particularly focusing on files located in the IIS log directory (\inetpub\logs\LogFiles\). If malicious, the impact could be severe as it obstructs forensic investigations, potentially allowing unauthorized actions to remain undetected. It’s important to note that this detection does NOT confirm malicious intent without additional context or supporting evidence.

  ### Investigation Steps

  - **Review recent file deletion events**: Check Windows Security Event ID 4663 for deletions targeting `*C:\inetpub\logs\LogFiles\*.log` to confirm the specific log deletion request details, such as the process owner and time of deletion.

  - **Correlate with access patterns**: Utilize IIS logs (if available) to identify unusual access patterns prior to the deletion, such as multiple failed login attempts or access from suspicious IP addresses. Look for significant changes in `client-ip` fields.

  - **Identify benign deletion scenarios**: Determine if the deleted logs coincide with legitimate events like system maintenance or log rotation, which may be indicated by previous scheduled tasks or administrative alerts.

  - **Validate deletion timestamps against security incidents**: Cross-reference the timestamp of log deletions with known incidents or alerts in your SIEM to identify any correlation with malicious activity, focusing on related incident IDs.

  - **Check for other indicators of manipulation**: Search for other activity logged within the same timeframe using Windows Event log (Event ID 5145) to identify any suspicious file operations executed by uncommon user accounts or elevated privileges.

  - **Investigate scheduled tasks or scripts**: Search for any scheduled tasks or administrative logs that may show automated deletion of files under the context of legitimate log management, indicating potential misuse of administrative capabilities.

  ### Prioritization

  This alert is medium severity due to the critical role of IIS WebServer logs in forensic analysis. The deletion of these logs poses a high risk of malicious activity being hidden, as attackers typically aim to remove traces of their actions. The relatively common use of this technique by adversaries elevates its importance during triage.

  ### Blind Spots and Assumptions

  The detection may be limited by events not logged if file auditing or detailed logging is disabled. Evasion techniques include benign log deletions during legitimate administrative activities, such as log rotation or IIS service uninstallation, which can trigger similar alerts. Ensure that file system auditing is enabled to capture comprehensive delete events and consider related detections like unauthorized access attempts to bolster coverage.

