  ---

  ### Technical Context

  This rule detects the deletion of PowerShell console history logs, specifically the file named `ConsoleHost_history.txt`. The primary behavior being monitored indicates a potential attempt by an adversary to eliminate trace evidence of executed commands, thereby hindering forensic investigation efforts. The likely attacker objective is to cover their tracks after executing malicious PowerShell commands that could alert security analysts.

  This behavior correlates with the MITRE ATT&CK technique T1070 - "Indicator Removal on Host." The primary telemetry source for this detection is the Windows file deletion events logged through the Security event ID 4663. If malicious, this action could impede incident response and recovery processes, significantly increasing the risk of successful data breaches or prolonged compromise. However, this detection alone does not confirm malicious intent without corroborating evidence of previous suspicious PowerShell activity or unauthorized access.

  ---

  ### Investigation Steps

  - **Confirm deletion event: ** Check Windows Security logs for Event ID 4663 entries indicating a delete operation targeting `C:\Users\<username>\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt`. The `Access Mask` should include DELETE permissions.

  - **Identify recent PowerShell activity: ** Review Event ID 4104 (PowerShell script block logging) or Event ID 4688 (process creation) for PowerShell usage by the same user or processes, looking for suspicious script executions or command patterns prior to the deletion.

  - **Assess user account context: ** Evaluate the context of the user who deleted the history logs. If it is a service account or a user who typically doesn't perform PowerShell activities, this could be a red flag.

  - **Review legitimate use cases: ** Consider expected behavior by cross-referencing with typical user activities. If the user is part of an administrative role conducting maintenance, check for expected PowerShell commands that would justify the deletion.

  - **Cross-check related logs for pattern anomalies: ** Look for multiple deletions of similar log files or attempts to clear logs within the same timeframe. Use Windows Event ID 1102 (Audit log cleared) as an indicator of potentially suspicious cleanup activity.

  - **Investigate endpoint security logs: ** If EDR or endpoint agents are deployed, look for alerts related to PowerShell command execution and process injections that could indicate an exploit chain linking to the deletion event.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact of the affected system, particularly if the user with deletion rights is in a critical role (e.g., system administrator). The likelihood of malicious abuse is concerning since similar deletion techniques are commonly weaponized by adversaries seeking to obscure their activity.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited in environments where audit policies do not cover file deletions comprehensively. Legitimate system maintenance or administrative practices (e.g., clearing logs for privacy) may also trigger this alert. Partners with additional detections like monitoring of PowerShell activity would enhance visibility and context, especially logs related to Event ID 4104 for forensic analysis.

