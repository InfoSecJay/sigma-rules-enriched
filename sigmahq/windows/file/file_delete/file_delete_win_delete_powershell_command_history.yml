note: |
  ### Technical Context
  This detection rule identifies instances where the PowerShell console history file, specifically `ConsoleHost_history.txt`, is deleted. The deletion of this file may indicate that an attacker is attempting to destroy or invalidate forensic evidence that could reveal their actions during a compromise. Attackers often seek to cover their tracks to prolong their access to compromised systems or extract sensitive data without detection.

  In many scenarios, the objective behind deleting such logs is to hinder incident response efforts and avoid leaving traces of malicious actions, such as executing unauthorized scripts or accessing sensitive resources. The relevant MITRE ATT&CK tactics for this type of activity include **Defense Evasion** (TA0005), particularly the technique **Indicator Removal on Host** (T1070), which encompasses behaviors designed to mask the presence of malicious activities on a system.

  The primary data sources that will provide the necessary evidence for this detection are Windows File Deletion logs, specifically relating to the deletion of files within the PowerShell history context. Additional context can be gathered from Windows Event Logs that monitor file system activities, providing actionable insights into suspicious deletions and related user actions.

  ### Investigation Steps
  - **Review Windows File Deletion Logs**: Check for events related to the deletion of `ConsoleHost_history.txt`. Note the user account responsible for this action and the time of the deletion.

  - **Correlate with User Activity**: Investigate PowerShell command execution logs for the account that deleted the history file. Look for any unusual or unauthorized commands executed prior to the deletion.

  - **Analyze System Event Logs**: Collect Windows Event Logs around the time of the deletion to identify any other relevant activities that could signify malicious intent, such as logon events or abnormal script executions.

  - **Conduct User Behavior Analysis**: Evaluate historical behavior patterns of the user account associated with the deletion. Look for deviations from normal behavior that may suggest compromise or insider threats.

  ### Prioritization
  This alert should be treated with medium severity due to the potential impact of successful concealment of malicious activities. The likelihood of evidence tampering is significant in environments dealing with sensitive data or critical infrastructure, warranting prompt investigation.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if file deletion logging is not properly configured on all endpoints or if auditing policies do not capture file deletions adequately. The detection logic assumes that the deletion of `ConsoleHost_history.txt` is intentional and indicative of malicious intent, rather than legitimate user activity. For this alert to function correctly, Windows File Auditing must be enabled, specifically tracking deletions and modifications of files, along with proper retention of event logs.

