note: |
  ### Technical Context

  The alert detects the deletion of PowerShell's console history file (`ConsoleHost_history.txt`), which records commands executed in PowerShell sessions. An attacker may aim to erase traces of their activity to hinder forensic investigations or to obscure evidence of attempted compromise. This behavior fits within the MITRE ATT&CK framework under the tactic of "Obfuscation" (T1070), specifically the technique of "Indicator Removal on Host" (T1070.01).

  Primary telemetry sources include Windows file deletion events, specifically targeting File Delete events in security logs (Event ID 4663). If malicious, the deletion of this file implies potential compromise and attempts to evade detection. It's important to note that this detection does NOT confirm an attack on its own, as legitimate users may also delete this file.

  ### Investigation Steps

  - **Verify deletion event:** Check Windows Security Event ID 4663 for a deletion event related to `ConsoleHost_history.txt`. Look for the `Object Name` field to confirm the exact file deleted.

  - **Review user context:** Analyze the `Subject User Name` field in the same Event ID 4663 log. Determine if the user has a legitimate reason for deleting the file, particularly if the account is sensitive or has administrative privileges.

  - **Identify recent PowerShell activity:** Examine PowerShell logs (if logging is enabled) for unusual commands or patterns executed by the user prior to the deletion event. Look for System Event ID 4104 or equivalent logs.

  - **Correlate with other security events:** Cross-reference other logs around the time of the deletion (e.g., Event ID 4688 for process creation). Look for suspicious PowerShell commands or instances where PowerShell was invoked by a non-standard process.

  - **Observe legitimate usage:** Note that legitimate administrators may occasionally clear their console history for privacy; therefore check their usage context—logged sessions, environment, etc.

  - **Investigate for file exfiltration:** If applicable, inspect recent file access logs for any suspicious activity or abnormal patterns concerning sensitive files moved or exported to an external source, indicating further compromise.

  ### Prioritization

  This alert has medium severity due to the potential risk of evidence tampering in environments where PowerShell is frequently used. The likelihood of malicious use is moderate, especially if paired with other suspicious behaviors. Deletion of console history files is a known technique among threat actors attempting to obscure their activities, making this behavior noteworthy.

  ### Blind Spots and Assumptions

  Detection is limited because legitimate users may delete history files for privacy reasons, thereby causing false positives. It requires proper logging configurations to capture all necessary telemetry, especially if PowerShell script block logging is not enabled. Common administrative functions, such as routine maintenance scripts occasionally running in PowerShell, may trigger this alert. Companion detections could include monitoring for suspicious command patterns in PowerShell or unusual access to sensitive system areas.

