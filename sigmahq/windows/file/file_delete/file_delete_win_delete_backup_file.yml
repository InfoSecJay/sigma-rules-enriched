detection:
  selection:
    Image|endswith:
    - '\cmd.exe'
    - '\powershell.exe'
    - '\pwsh.exe'
    - '\wt.exe'
    - '\rundll32.exe'
    - '\regsvr32.exe'
    TargetFilename|endswith:
    - '.VHD'
    - '.bac'
    - '.bak'
    - '.wbcat'
    - '.bkf'
    - '.set'
    - '.win'
    - '.dsk'
  condition: selection
falsepositives:
- Legitimate usage
level: medium
note: |
  ### Technical Context
  This detection rule monitors for the deletion of files typically associated with backup operations, such as those with extensions like `.bak`, `.VHD`, and `.wbcat`. Attackers may leverage this behavior to permanently remove backup files, thereby hindering recovery efforts in the event of a system compromise or data loss scenario. This tactic is frequently seen in ransomware attacks or other malicious operations where adversaries aim to eliminate recovery options and increase leverage over victims, facilitating demands for payment or enabling further unauthorized access.

  The related MITRE ATT&CK techniques include **Impact** (T1490) which focuses on data destruction and hindering recovery efforts. In such scenarios, the attacker’s objective is to disrupt the operational capacity of the organization and make data irretrievable.

  The primary data sources that will provide valuable context and evidence for this detection are logs from Windows file deletion events, particularly those that capture command-line activities through PowerShell or cmd.exe, as these tools are likely to be used by attackers for executing such file deletion commands.

  ### Investigation Steps
  - **Review File Deletion Logs:** Examine logs related to file deletions on the impacted systems, specifically looking for deletion of files with backup extensions like `.bak` and `.VHD`.
  - **Analyze Command Line Activity:** Investigate the command line arguments associated with processes such as `cmd.exe`, `powershell.exe`, and others listed in the detection rule to identify any suspicious usage patterns indicative of malicious actions.
  - **Check for Related System Changes:** Look for other system modifications or service alterations that may accompany the file deletions, as these could signal a broader attack vector or operational impact.
  - **Correlate with Threat Intelligence:** Validate any detections against known threat actor tactics and techniques, linking activity to broader incident trends if similar deletion patterns are observed across the environment.

  ### Prioritization
  This alert has a medium severity due to the potential impact of data loss and the likelihood of being associated with malicious activity, particularly when backup files are involved. The deletion of critical backup files can significantly impair recovery strategies and contribute to business disruption.

  ### Blind Spots and Assumptions
  While this detection rule targets specific file deletions, gaps may exist in the coverage of other potential deletion methods or tools that do not match the specified process names. The detection logic assumes that the logs for file deletions and process execution are enabled and retrievable. If such logs are not configured in the environment, the effectiveness of this detection will be compromised. Analysts should ensure relevant logging settings are appropriately configured to capture necessary evidence for effective investigations.

