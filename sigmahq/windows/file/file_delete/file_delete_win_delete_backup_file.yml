note: |
  ### Technical Context

  This Sigma rule detects the deletion of files with extensions typical for backup files (e.g., .bak, .VHD) using common Windows executables (e.g., cmd.exe, powershell.exe). The likely attacker objective is to disrupt recovery efforts by removing backup data, aligning with objectives such as data destruction or evasion from forensic recovery mechanisms. This behavior fits within the MITRE ATT&CK framework under the tactic "Impact" (TA0040) and technique "Impact on Availability" (T1490). The primary telemetry source is Windows file deletion logs, specifically event types related to file operations. If this action is confirmed malicious, it could significantly hinder data recovery functions and compromise system integrity. However, it must be emphasized that this detection alone does not confirm malicious intent; legitimate administrative activities may also produce similar actions.

  ### Investigation Steps

  - **Review file deletion events:** Check Windows Security Event ID 4663 logs associated with target filenames. Look for deletions of .bak, .VHD, or other designated backup file types. Confirm whether the user context and source process are appropriate for normal administrative tasks.

  - **Identify command usage:** Examine logs for process execution via PowerShell (Event ID 4104) or command line tools (Sysmon Event ID 1). Look for unusual patterns or execution flags (such as -NoProfile) indicative of potentially malicious activity.

  - **Correlate with access logs:** Review Windows Event ID 4663 for the creation and subsequent deletion sequence of backup files. Legitimate operations would often show a create followed by a delete, typically by known administrators or system services.

  - **Check for elevated privileges:** Assess if the account performing deletions has elevated privileges (e.g., Local Administrator, Domain Admin). Elevated actions performed by non-admin users should raise flags for further scrutiny.

  - **Scan for anomalies in system activities:** Utilize Sysmon logs (Event ID 1) to identify additional suspicious activities on the same host—such as unexpected network connections or processes spawning from cmd.exe or powershell.exe. High-confidence malicious indicators may include unusual command line arguments or unfamiliar executables.

  ### Prioritization

  This alert carries medium severity due to the potential high impact on system recoverability and integrity. The likelihood of malicious abuse is significant, particularly in the context of ransomware or other forms of cyberattacks that aim to incapacitate system recovery efforts. Given the nature of the behavior, it’s often weaponized in targeted intrusions.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of consistent logging practices or potential evasion techniques employed by sophisticated adversaries, such as using approved tools in unusual contexts. Legitimate activities like routine maintenance or misconfigured backup strategies could trigger this alert. A related detection, such as monitoring for unusual file access patterns (using Event ID 5145 for file share access), could provide supplementary context to identify potential malicious activities.

