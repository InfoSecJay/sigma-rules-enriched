note: |
  ### Technical Context

  This rule detects the deletion of Exchange PowerShell cmdlet history logs, which could indicate an attacker’s effort to erase forensic evidence of their actions within an Exchange environment. The objective of such an activity is typically to hinder incident response capabilities and eliminate traces of unauthorized or malicious operations performed via PowerShell. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), specifically technique **Indicator Removal on Host** (T1070).

  The primary telemetry source is Windows file deletion events related to Exchange Server logs, particularly focusing on log files located in the `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\` directory. If this deletion is malicious, it can significantly impede the ability to understand the nature of compromised accounts or systems. This detection alone does not confirm that malicious activity has taken place; it indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Review recent log deletions**: Check Windows Security Event ID 4663 or Sysmon Event ID 11 for deletion events. Look for deletions of files corresponding to the cmdlet history path. Compare timestamps with known user activity to establish context.

  - **Analyze user activity logs**: Investigate PowerShell logs (Event ID 4104) and Command Line logs (Event ID 4688) to check for any suspicious cmdlet execution patterns or abnormal user behavior preceding the deletion. Legitimate administrative user actions typically correlate with scheduled tasks or expected maintenance windows.

  - **Identify user permissions**: Determine if the account that executed the deletion has appropriate permissions. Cross-reference the account with typical roles; Azure AD sign-ins or on-premises Active Directory logs can provide insights into user roles and responsibilities.

  - **Check for concurrent suspicious activities**: Correlate the deletion timestamp with other logs, such as Windows Event ID 4740 (account lockout) or Event ID 4672 (special privileges assigned), that may suggest unauthorized access or elevated permissions usage.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on forensic investigations and incident response efforts. The likelihood of malicious abuse is considerable, as erasing cmdlet history is a common tactic employed by adversaries to cover their tracks. This behavior is often weaponized in contexts of compromise, especially within environments managing critical communications.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate file rotation or cleanup processes that occur regularly on Exchange servers, which can generate false positives. Proper configuration of log files must be ensured for reliable detection, particularly monitoring the cmdlet log directory. It’s also important to note that administrative users may legitimately delete cmdlet histories during maintenance. Companion detections, such as monitoring for unusual PowerShell execution (e.g., use of encoded commands or harmful cmdlets), can provide stronger coverage and context around suspicious activities.

