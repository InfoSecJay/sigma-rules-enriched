logsource:
  category: file_delete
  product: windows
detection:
  selection:
    TargetFilename|startswith: '\Logging\CmdletInfra\LocalPowerShell\Cmdlet\'
    TargetFilename|contains: '_Cmdlet_'
  condition: selection
falsepositives:
- Possible FP during log rotation
level: high
note: |
  ### Technical Context
  This detection rule identifies when deletion events occur for the Exchange PowerShell cmdlet history logs. These logs are critical for auditing PowerShell activity within an Exchange environment; thus, their deletion can suggest that an attacker is attempting to remove traces of their potentially malicious actions, such as lateral movement or exploitation of vulnerabilities. The primary objective for an attacker in this scenario is to obliterate forensic evidence of unauthorized activities, making it challenging for defenders to investigate and respond to incidents effectively.

  Relevant MITRE ATT&CK tactics and techniques associated with this detection include **Defense Evasion (TA0005)** and **Indicator Removal on Host (T1070)**. The former focuses on techniques that attackers use to evade detection and avoid triggering alerts, while the latter highlights efforts to erase or manipulate files that may contain indicators of compromise.

  Key telemetry sources that can provide useful insights include file system logs that capture deletions on critical directories, specifically targeting the location where these cmdlet history logs are stored.

  ### Investigation Steps
  - **Review File Deletion Logs:** Examine file system log entries for any recent deletions in the Exchange PowerShell cmdlet history location. Focus particularly on deletions that are unusual or not aligned with normal operational patterns.

  - **Correlate with User Activity:** Cross-reference the file deletion events with user and administrative account activity logs. Determine who executed the deletion and whether their behavior is consistent with their role and responsibilities.

  - **Inspect PowerShell Usage Logs:** Investigate PowerShell usage and command execution logs around the time of the deletions. Look for suspicious commands, particularly those indicative of reconnaissance or attempts to modify settings.

  - **Analyze Event Logs for Anomalies:** Check Windows Event Logs, particularly Security and Application logs, to identify any irregularities, failed logins, or privilege escalations that may correlate with the deletion of cmdlet history.

  ### Prioritization
  Given that the deletion of PowerShell cmdlet history logs is a strong indicator of a potential security breach aimed at covering tracks, this alert is classified as high severity. The impact of successfully hiding malicious actions can lead to significant security incidents, thus requiring immediate attention in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection rule may have gaps in coverage, particularly if file deletion logs are not configured to be sufficiently verbose or if log rotation occurs frequently, which could inadvertently lead to false positives. Additionally, it assumes that logging for the specified cmdlet history folders is enabled and being retained as expected. Environments lacking appropriate logging configurations may fail to capture relevant actions, rendering the detection ineffective.

