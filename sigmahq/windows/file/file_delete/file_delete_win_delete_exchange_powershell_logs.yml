  ---

  ### Technical Context

  This Sigma rule detects the deletion of Exchange PowerShell cmdlet history logs, specifically those located in the CmdletInfra directory. Attackers may perform this action to erase evidence of their activities, particularly in environments where PowerShell is commonly used for malicious actions, such as lateral movement or reconnaissance. Relevant MITRE ATT&CK tactics include Defense Evasion (T1070). The primary telemetry source for this detection is Windows event logs that detail file deletions, focusing on events related to target filenames beginning with `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\`.

  If malicious, this behavior could significantly hinder incident response efforts by obscuring traces of potentially harmful commands executed on the server. It’s crucial to note that this detection does NOT confirm malicious intent by itself, as legitimate log rotations could also lead to similar file deletions.

  ---

  ### Investigation Steps

  - **Verify event logs for suspicious deletions:** Check Windows Security Event ID 4663, which indicates a deletion event. Focus on logs detailing deletions with the TargetFilename starting with `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\`. Target IDs or user accounts involved can help determine malicious activity.

  - **Cross-reference cmdlet usage:** Analyze Windows PowerShell command history logs (Event ID 4104) prior to the deletion event. Look for unusual or unauthorized cmdlet execution that could explain the need for deletion, such as scripts that indicate exploitation attempts (e.g., `Invoke-Expression`, `Invoke-WebRequest`).

  - **Identify authorized personnel:** Review user access and permissions to the Exchange server. Look for any user accounts, particularly non-admin accounts, that accessed or deleted cmdlet history. Legitimate users should have routine access consistent with their roles.

  - **Search for log file restoration events:** Validate if historical cmdlet logs have been recreated or recovered recently, utilizing Event ID 5145 for network share access that may indicate unauthorized restoration efforts. Successful restoration could signify an attempt to cover tracks.

  - **Review server role and criticality:** Ensure the affected Exchange server is assessed for its critical role in the environment. A compromised Exchange server can disrupt organizational email systems and communication, elevating the urgency of the investigation.

  - **Identify known evasion techniques:** Investigate Windows Management Instrumentation (WMI) or Remote PowerShell session activity during the timeframe. Ensure that the environment monitors for typical attack patterns seen in recent cybersecurity incidents, where log deletion is preceded by unusual WMI activity (Event ID 5858).

  ---

  ### Prioritization

  This alert is of high severity due to its potential impact on the Exchange server, which is critical for business operations. The likelihood of malicious abuse is elevated, particularly given the common use of PowerShell for post-exploitation activities. Deletion of cmdlet history is a well-documented technique used by attackers to cover their tracks, underscoring the need for immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the file system configuration or log retention policies that do not capture all deletion events consistently. Legitimate activities such as manual log rotations or maintenance tasks may trigger this alert, necessitating careful evaluation of the context. Related detections may include monitoring for abnormal PowerShell usage (Techniques like T1059.001) which can complement coverage by identifying anomalous behavior prior to evidence deletion.

