note: |
  ### Technical Context

  This rule detects the deletion of PowerShell cmdlet history logs on Microsoft Exchange servers, specifically targeting files located in the `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\` directory. Attackers may delete these logs to erase traces of their activities, thus achieving stealth and hindering forensic investigations. The primary MITRE ATT&CK technique associated with this behavior is Data Destruction (T1070).

  Primary telemetry sources include Windows file deletion logs, specifically those reporting on successful deletions within the specified directory. If malicious, this action could prevent the detection of unauthorized administrative activities or lateral movements within the Exchange environment. This detection does NOT confirm that malicious activity has occurred, as legitimate log rotation processes could trigger similarly.

  ### Investigation Steps

  - **Review file deletion events:** Check Windows Security Event ID 4660 for records of file deletions, focusing on events originating from the `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\` directory. Assess if the deleted files correlate with scheduled log maintenance.

  - **Correlate to administrative actions:** Analyze Security Event IDs 4688 (process creation) and 4104 (PowerShell script block logging) for any PowerShell processes executed by administrative accounts immediately before the deletions. Compare timestamps to establish a potential timeline of malicious activity.

  - **Identify anomalous access times:** Examine the access logs for the Exchange server to determine if log deletions occurred during unusual hours or when no regular administrative activities are expected, signaling potential malicious behavior.

  - **Check for legitimate log maintenance patterns:** Confirm whether log rotation or cleanup is regularly scheduled in the environment. Identify expected log deletion patterns to differentiate benign actions from suspicious ones.

  - **Verify system and user role:** Assess the role of the server (such as Domain Controller or Exchange server) and the privileges of the user account executing the deletion. High-privileged accounts conducting deletions may warrant closer scrutiny.

  - **Cross-reference with PowerShell history:** Check for any anomalies in PowerShell session logs or command history, specifically looking for executed commands that might relate to the recent file deletions, which could indicate an attempt to obscure evidence of exploitation.

  ### Prioritization

  This alert is high priority due to the critical nature of Exchange servers within the enterprise environment. The likelihood of malicious use is elevated, especially in targeted attacks aiming to manipulate or destroy log evidence. The potential impact of such threats is significant, as they can facilitate further malicious actions unnoticed.

  ### Blind Spots and Assumptions

  Detection may be limited if log retention policies or configurations are not adequately set to capture all file deletions in critical directories. Attackers might also employ log rotation processes as a cover for their actions, complicating forensic investigations. Legitimate administrative tasks can inadvertently trigger this alert, emphasizing the need for context. Companion detections, such as suspicious PowerShell command execution, can enhance coverage and provide additional signals of potential compromise.

