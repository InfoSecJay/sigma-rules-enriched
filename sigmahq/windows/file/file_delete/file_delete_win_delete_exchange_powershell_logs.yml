level: high
note: |
  ### Technical Context

  This rule detects the deletion of Exchange PowerShell cmdlet history logs, specifically targeting filenames within the `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\` path. The behavior indicates an attempt to erase command execution history, likely to hinder forensic analysis or obfuscate malicious activities. The attacker’s objective is to eliminate traces of illicit actions taken on the Exchange server. This aligns with the MITRE ATT&CK tactic of Defense Evasion (T1070).

  The primary telemetry source is the Windows file deletion logs, particularly focusing on file paths associated with PowerShell cmdlets. If malicious, this action could significantly impede incident response and forensic investigation by erasing valuable context related to the actions taken on the server. Importantly, this detection does NOT confirm that the deletion is malicious on its own; it could include benign actions like routine log management and rotation.

  ### Investigation Steps

  - **Investigate the deletion event**: Review **Windows Security Event ID 4663** to confirm details on the file deletion. Look for the **Object Name** field referencing `\Logging\CmdletInfra\LocalPowerShell\Cmdlet\*_Cmdlet_*` and check the **Process ID** associated with the deletion.

  - **Analyze user context**: Check the **Subject User Name** in the Windows logs to validate whether a legitimate administrator executed the deletion. Confirm expected user roles, correlating against administrative access policies.

  - **Assess scheduled tasks or automated processes**: Validate if any legitimate scheduled tasks (via **Task Scheduler log Event ID 106**) could be associated with regular log management that might result in deletions of cmdlet history.

  - **Look for multiple deletions in a short timeframe**: Identify patterns in deletion using **Sysmon Event ID 23**. Multiple deletions within a quick succession could indicate malicious intent, especially if they coincide with other suspicious activities on the server.

  - **Check for evidence of log manipulation**: Review system events and **PowerShell logs (Event ID 4104)** for any commands or scripts that could suggest systematic attempts to clear logs during the timeframe surrounding the deletion activity.

  - **Validate event processing configurations**: Ensure that log retention settings and event forwarding configurations are appropriate for capture. Look for any gaps in logging of the cmdlet infrastructure that would prevent regular monitoring.

  ### Prioritization

  Alerts of this nature are high-priority because they can signal a critical attempt to eliminate evidence of malicious behavior on systems that handle sensitive data. The likelihood of malicious abuse is high, as the deletion of cmdlet history is not a common administrative action and may relate to ongoing attacks on the Exchange server.

  ### Blind Spots and Assumptions

  Detection may be limited by benign log rotation processes that can also trigger this alert. It is crucial to have complete logging configurations for file operations and administrative actions in place. Legitimate administrative tasks that may lead to similar alerts include routine log clean-up processes, making context an essential factor. Companion detections for recent PowerShell command executions should be implemented to enhance the overall security posture and provide additional context for analysis.

