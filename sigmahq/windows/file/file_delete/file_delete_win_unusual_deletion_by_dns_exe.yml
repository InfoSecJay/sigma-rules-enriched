  ### Technical Context

  This Sigma rule detects the deletion of an unexpected file, specifically a `dns.log` file, by the `dns.exe` process. The likely objective of an attacker executing this behavior would be to erase traces of malicious activity or compromise of system functionality, particularly linked to exploits such as CVE-2020-1350 (SigRed). This behavior correlates with the MITRE ATT&CK tactics of Persistence and Initial Access, specifically technique ID T1133 (External Remote Services).

  The primary telemetry source for this detection is file deletion logs from Windows systems, capturing actions taken by processes on the filesystem. If malicious, the security impact could include confounding incident response efforts by obfuscating evidence of a breach. It is crucial to note that this detection does NOT confirm an active compromise on its own, as legitimate applications might also delete log files.

  ### Investigation Steps

  - **Verify event details:** Check Windows Security Event ID 4663 for logs reflecting file deletion actions, particularly targeting `dns.log`. Look for process IDs related to `dns.exe` to establish context.

  - **Analyze process behavior:** Investigate Sysmon Event ID 1 for `dns.exe` to assess its command-line arguments and parent processes. Compare against known benign activity and check for unusual patterns that deviate from normal operation.

  - **Identify legitimate usage:** Ensure that `dns.log` deletions coincide with scheduled maintenance or software updates related to DNS service operations, which may occur in specific timeframes.

  - **Establish a baseline for normal activity:** Review historical logs for typical deletion records of `dns.log` by legitimate processes. If this event occurs frequently under standard operations, it may indicate a benign condition.

  - **Check for high-confidence malicious indicators:** Focus on identifying whether `dns.exe` was invoked outside of expected service contexts or by non-administrative users, suggesting potential misuse or a compromised state.

  - **Review system-wide implications:** Consider the asset criticality of the host involved. If the system is a DNS server, alert escalations should align with the importance of maintaining its integrity for enterprise operations.

  ### Prioritization

  This alert should be prioritized as high severity due to its potential impact on critical DNS infrastructure. The likelihood of malicious exploitation for persistence or initial access in a compromised state is significant, as this behavior can facilitate further attacks. Attackers commonly exploit DNS services, making this activity particularly concerning.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging on Windows systems; if file auditing is not enabled, key events may be missed. Legitimate maintenance activities or system updates could trigger this alert if they involve log file handling. Additionally, consider related detections, such as monitoring for unusual command execution patterns via `dns.exe` (Sysmon Event ID 1), which can provide a stronger coverage against malicious activity.

