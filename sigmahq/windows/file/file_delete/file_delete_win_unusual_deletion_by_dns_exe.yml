note: |
  ### Technical Context
  This rule detects instances where the Windows DNS service (`dns.exe`) is responsible for deleting a file, specifically targeting `dns.log`. Such behavior is unusual and often indicative of malicious activity, potentially related to remote code execution or exploitation methods, including those leveraging vulnerabilities like CVE-2020-1350 (SigRed). Attackers may exploit this vulnerability to execute arbitrary commands on a Windows DNS server, deleting logs to cover their tracks or modifying configurations for lateral movement.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence** (TA0003) and **Initial Access** (TA0001), particularly focusing on technique **T1133: External Remote Services**. The telemetry best suited to provide evidence includes file deletion logs from Windows Event Logs and any alerts generated by Endpoint Detection and Response (EDR) solutions that monitor process activities on Windows machines.

  ### Investigation Steps
  - **Review File Deletion Logs**: Query Windows event logs to identify the deletion event associated with `dns.log` and any related process activities that lend context to this action.

  - **Analyze Related Processes**: Investigate the behavioral patterns of `dns.exe` around the time of the file deletion. Check if there were any unusual command line arguments or process parent-child relationships that may indicate the genesis of suspicious activities.

  - **Check for Indicators of Compromise**: Look for other indicators of entry around the same time frame, such as unusual network connections or traffic patterns associated with the DNS server that could suggest exploitation attempts.

  - **Assess EDR Alerts and Context**: Utilize your EDR solution to pull deeper insights into the behavior of `dns.exe`, looking for any alerts that correlate with the file deletion and providing additional context about potential unauthorized actions or changes.

  ### Prioritization
  The severity of this alert is high due to the critical nature of the DNS service within enterprise networks and the potential impact of a successful exploitation, which could lead to unauthorized access, data exfiltration, or significant disruption of services.

  ### Blind Spots and Assumptions
  This detection may have gaps, such as environments where logging is not enabled for file deletions, which could prevent capturing this activity. The detection logic assumes that any file deletion by `dns.exe` is suspicious, which may produce false positives in cases where legitimate operations occur, such as regular cleanup or maintenance of log files. Ensure that Windows file auditing is enabled, and that logs are appropriately configured to capture detailed file operation events to ensure efficacy of this detection rule.

