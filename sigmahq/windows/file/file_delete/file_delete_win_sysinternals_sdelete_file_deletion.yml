logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|endswith:
    - '.AAA'
    - '.ZZZ'
  filter_wireshark:
    TargetFilename|endswith: '\Wireshark\radius\dictionary.alcatel-lucent.aaa'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate usage
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the deletion of files using the Sysinternals SDelete utility, specifically targeting filenames that end with common patterns such as `.AAA` and `.ZZZ`. The likely objective of an attacker using SDelete is to remove traces of malicious activity or to cover their tracks after exfiltration or compromise. This behavior aligns with the MITRE ATT&CK tactic of 'Defense Evasion' (TA0005) and the technique of 'Indicator Removal on Host' (T1070.004).

  The primary telemetry source is the Windows File Delete event, typically captured in Security Event ID 4663 and other dedicated file system logs. If malicious, this behavior can severely impact data integrity, allowing adversaries to destroy evidence of breaches. However, it is crucial to note that this detection does NOT confirm that malicious activity has occurred without further context or supporting evidence.

  ### Investigation Steps

  - **Review Security Event ID 4663:** Check for deletion events of files with `.AAA` or `.ZZZ` extensions. Note the account initiating the deletion and the time of the event. Legitimate actions may include maintenance scripts or system cleanup, especially from user accounts with expected administrative privileges.

  - **Correlate with Sysinternals SDelete usage:** Look for event logs or command line artifacts showing SDelete usage. Check command line arguments and parent process chains (via Sysmon Event ID 1) to ascertain if SDelete is being executed in a suspicious context.

  - **Examine Target Filenames:** Focus on the specific filenames targeted; typical deletion might involve known application-specific files, while malicious activity may target sensitive or log files. Check if recently accessed files correlate with deleted filenames.

  - **Identify High-Confidence Indicators:** Look for accounts that do not typically execute SDelete or unusual access patterns immediately prior to file deletion. For instance, check if deleted files are associated with accounts that lack required permissions for such an action.

  - **Assess for Benign Activity:** Identify routine or administrative usage of SDelete within your environment via configuration management databases. Verify if any triggered deletions are part of documented maintenance activities.

  - **Monitor for Evasion Techniques:** Be aware that attackers may attempt to disable logging to avoid detection. Review systems for unusual logging configurations or the absence of relevant log data during the incident timeframe (check for log clearing events or related Sysmon logs).

  ### Prioritization

  This alert should be treated with medium severity, as the deletion of files, particularly by administrative tools like SDelete, could indicate an active threat but may also arise from benign administrative processes in a mature enterprise environment. The likelihood of malicious abuse exists, especially in contexts where the system hosts sensitive data or logs.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers disable file auditing or clear logs to evade detection. It requires proper log configuration; ensure that file deletion events are enabled and monitored consistently. Furthermore, legitimate processes, such as system maintenance tasks or script executions by trusted administrators, may trigger the alert and should be assessed accordingly. A related detection to consider is the monitoring of process creation events for SDelete to further capture its usage patterns or intent.

