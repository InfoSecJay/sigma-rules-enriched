title: File Deleted Via Sysinternals SDelete
id: 6ddab845-b1b8-49c2-bbf7-1a11967f64bc
status: test
description: Detects the deletion of files by the Sysinternals SDelete utility. It
  looks for the common name pattern used to rename files.
references:
- https://github.com/OTRF/detection-hackathon-apt29/issues/9
- https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/4.B.4_83D62033-105A-4A02-8B75-DAB52D8D51EC.md
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-05-02
modified: 2023-02-15
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|endswith:
    - '.AAA'
    - '.ZZZ'
  filter_wireshark:
    TargetFilename|endswith: '\Wireshark\radius\dictionary.alcatel-lucent.aaa'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate usage
level: medium
note: |
  ### Technical Context
  This rule detects file deletions performed by the Sysinternals SDelete utility, which is commonly used to securely delete files without leaving recoverable remnants. An attacker might leverage SDelete to remove sensitive or incriminating evidence of malicious activity on a compromised system, which can facilitate maintaining persistence or hiding traces of their presence. The underlying objective is to manipulate the environment to evade detection by security analysts and tools.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion** (T1560): Using tools like SDelete assists in hiding or removing artifacts that could indicate compromise.
  - **File and Directory Permissions Modification** (T1070.004): The act of deleting files relates to manipulating file system artifacts that may otherwise reveal an attacker’s actions.

  Primary data sources that will contain the best evidence include:
  - **Windows File Delete Events**: Logs indicating when files are deleted, along with the process that initiated the deletion.
  - **Process Creation Events**: Details about the execution of SDelete, which can include the command line arguments and the user context.

  ### Investigation Steps
  - **Review File Delete Logs**: Examine the Windows file delete logs for any entries corresponding to deletions performed by the Sysinternals SDelete command, specifically looking for deletions of files with extensions like `.AAA` or `.ZZZ`.

  - **Analyze Process Creation Events**: Check the logs for process creation events that show the execution of SDelete. Pay close attention to the command-line arguments used, which may provide insights into the target files and the context of the deletion.

  - **Inspect User Account Activity**: Investigate the user account that initiated the file deletions. Determine if the account has unusual activity or if it matches expected patterns for legitimate users.

  - **Examine Correlated Security Events**: Look for other related suspicious activity within the timeline surrounding the deletion events, such as lateral movement, privilege escalation attempts, or unauthorized access to sensitive directories.

  ### Prioritization
  The alert has a medium severity level due to the potential threat impact of an attacker hiding evidence of previous malicious activities, which could lead to undetected breaches. While the likelihood of misuse is moderate, the presence of SDelete may indicate attempted evasion tactics often employed by advanced threat actors.

  ### Blind Spots and Assumptions
  This detection logic may not cover all instances of file deletions if SDelete is executed with custom or obfuscated command-line arguments. The detection assumes that file delete logging is enabled and that the environment captures detailed process execution metadata. Gaps may exist in environments where Sysinternals tools are commonly used for legitimate purposes, leading to potential false positives. Additionally, if logs are not centralized or if log retention is insufficient, key evidence may be lost.

