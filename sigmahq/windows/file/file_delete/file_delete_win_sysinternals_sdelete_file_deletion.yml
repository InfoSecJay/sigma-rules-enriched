title: File Deleted Via Sysinternals SDelete
id: 6ddab845-b1b8-49c2-bbf7-1a11967f64bc
status: test
description: Detects the deletion of files by the Sysinternals SDelete utility. 
  It looks for the common name pattern used to rename files.
references:
- https://github.com/OTRF/detection-hackathon-apt29/issues/9
- https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/4.B.4_83D62033-105A-4A02-8B75-DAB52D8D51EC.md
author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
date: 2020-05-02
modified: 2023-02-15
tags:
- attack.defense-evasion
- attack.t1070.004
logsource:
  product: windows
  category: file_delete
detection:
  selection:
    TargetFilename|endswith:
    - '.AAA'
    - '.ZZZ'
  filter_wireshark:
    TargetFilename|endswith: '\Wireshark\radius\dictionary.alcatel-lucent.aaa'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate usage
level: medium
note: |
  ### Technical Context

  This rule detects the deletion of files using the Sysinternals SDelete tool, which is often employed by attackers to securely wipe sensitive data. The primary objective of this behavior is typically to conceal evidence of malicious activities such as data exfiltration or system compromise. Relevant MITRE ATT&CK tactics include "Defense Evasion" (TA0022) and the technique "Indicator Removal on Host" (T1070.004).

  The primary telemetry sources include Windows file system logs, specifically focusing on file deletion events (Event ID 4660). If malicious, this could indicate an ongoing attempt to remove traces of unauthorized access or data manipulation. Importantly, this detection does NOT confirm malicious intent on its own; it merely indicates that SDelete was executed to delete files, which could also be legitimate.

  ### Investigation Steps

  - **Review deletion event details:** Check Windows Security Event ID 4660 for the file deletion event, specifically noting the `TargetFilename` field for indicators like '.AAA' or '.ZZZ'. Look for unusual file names that may indicate suspicious activity.

  - **Identify user context:** Examine the `SubjectUserName` and `SubjectDomainName` fields from Event ID 4660 logs to determine if the user executing SDelete is recognized and has an appropriate administrative role. Legitimate users typically should not be performing this action without clear justification.

  - **Check for legitimate utilities usage:** Analyze the execution logs for the Sysinternals suite (e.g., Sysmon Event ID 1) detailing SDelete's command line parameters. Understanding expected use cases can help identify benign behavior, such as legitimate data management.

  - **Validate file system activity:** Confirm if any suspicious files were being deleted by cross-referencing with the file system audit logs. Look for unusual file paths where deletions are occurring, indicating a potential cleanup of malicious artifacts that were previously created.

  - **Investigate recurrence of deletions:** If multiple SDelete executions are observed in a short time frame from the same user account, treat this as a potential high-confidence indicator of malicious intent, especially if combined with preceding abnormal events.

  - **Assess for other concurrent actions:** Correlate this detection with other logs like Sysmon Event ID 10 (process creation) or 11 (file creation) to identify if the same user executed other potentially malicious commands prior to file deletions. Look for patterns consistent with adversarial behavior.

  ### Prioritization

  This alert has medium severity due to its potential impact on data integrity and system audit trails. While utilizing SDelete may not be commonplace, its use indicates possible malicious network activity. If the file patterns align with past incidents, immediate investigation is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by user access rights or stealthy execution methods, where legitimate applications may trigger false positives. Reliable detection requires comprehensive Windows audit log configurations, including both file deletions and execution events. Legitimate activities may include administrative tasks by authorized personnel managing file systems. A related detection to consider is monitoring for unexpected system changes or file creations in the aftermath of deletions, to enhance threat coverage.

