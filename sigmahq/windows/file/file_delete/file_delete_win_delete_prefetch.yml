detection:
  selection:
    TargetFilename|contains: ':\Windows\Prefetch\'
    TargetFilename|endswith: '.pf'
  filter_main_svchost:
    Image|endswith: ':\windows\system32\svchost.exe'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the deletion of prefetch files on Windows systems, which can indicate malicious activity aimed at erasing traces of executed processes. The presence of prefetch files is crucial for forensic investigations, as they contain metadata about application execution, thereby assisting in identifying what programs were run on a system. When an attacker executes code with the intention of obfuscating their actions, they may attempt to delete these files to hinder post-incident analysis.

  The threat scenario involves an attacker seeking to evade detection by removing forensic artifacts that could reveal their presence or actions on the affected system. This aligns with the MITRE ATT&CK techniques under the Defense Evasion tactic (ID: T1070.004 - Indicator Removal on Host), where an adversary systematically deletes logs or modification records to hide evidence of their activities.

  Primary data sources that could provide valuable evidence include file deletion logs from the Windows operating system, allowing security analysts to trace any suspicious deletions of prefetch files.

  ### Investigation Steps
  - **Review File Deletion Events**: Collect logs of file deletions from target Windows machines to identify instances involving prefetch files in the `:\Windows\Prefetch\` directory.
  - **Analyze Process Creation Logs**: Look for recent process creation events around the time of the prefetch file deletion to investigate any abnormal activity that may have necessitated the file's removal.
  - **Check User Activity Logs**: Examine user interactions on the system to determine if there are any unfamiliar or unauthorized users who may have executed commands leading to the deletion of prefetch files.
  - **Correlate with Other Security Events**: Cross-reference the deletion event with other telemetry collected from sources such as EDR or SIEM solutions to identify a pattern consistent with hostile activity, focusing on alerting for related defense evasion techniques.

  ### Prioritization
  The alert has a high severity level due to the critical nature of the prefetch files in forensic investigations. The likelihood of deletion as a tactic used by attackers to obscure their activities increases the alert's relevance in an enterprise environment, particularly in scenarios involving advanced persistent threats (APTs).

  ### Blind Spots and Assumptions
  One potential blind spot in this detection logic is the possibility that legitimate system maintenance operations could result in the deletion of prefetch files, potentially leading to false positives. The rule assumes that user and system behavior will remain within expected norms; thus, any abnormal activity might not be captured if the system is misconfigured or lacks proper logging of file deletion events. It is essential to ensure that file deletion logging is enabled on all Windows endpoints for accurate detection and alerting.

