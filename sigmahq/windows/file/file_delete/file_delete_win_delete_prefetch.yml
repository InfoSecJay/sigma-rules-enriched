detection:
  selection:
    TargetFilename|contains: ':\Windows\Prefetch\'
    TargetFilename|endswith: '.pf'
  filter_main_svchost:
    Image|endswith: ':\windows\system32\svchost.exe'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the deletion of prefetch files, which could indicate an attacker attempting to erase traces of their activities on a Windows system. The likely objective of this behavior is to hinder forensic analysis by deleting evidence of executed applications and processes, thereby obscuring their methods of entry and persistence. This activity aligns with the MITRE ATT&CK tactic "Defense Evasion" (ID: T1070.004).

  The primary telemetry sources for this rule are Windows file deletion logs that specifically relate to the prefetch directory, identified typically through file system monitoring or event logs. The security impact of this action is significant, as it may represent active efforts to cover tracks after malicious activities, posing greater risk if a critical asset is affected. This detection does NOT confirm that a system compromise has occurred but indicates suspicious behavior that warrants further investigation.

  ### Investigation Steps

  - **Review file deletion logs**: Check Windows Security Event ID 4663 for deletions related to `*.pf` files in `C:\Windows\Prefetch\`. Analyze the `Access Mask` field to confirm deletion operations.

  - **Identify the user responsible**: Look at the `Subject\User Name` field in the logs related to the deletion. Determine if the user has legitimate reasons for file deletions or if the username appears in other suspicious contexts (e.g., abnormal login times).

  - **Check process execution patterns**: Review Sysmon Event ID 1 for any recent process creation involving `svchost.exe`. If a legitimate service is executing, confirm the associated command line parameters for expected usage.

  - **Establish a timeline of events**: Correlate the deletion timestamps with other security events (e.g., logins, process creations). Look for increased activity before the deletion that might indicate prior malicious behavior.

  - **Identify benign use cases**: Understand that software updates or administrative maintenance may result in legitimate prefetch deletions. Validate the user’s role; for instance, if the action comes from a system admin during maintenance hours, it may be benign.

  - **Seek exfiltration evidence**: If no legitimate explanation exists, investigate for file exfiltration indicators, such as unusually large file transfers corresponding with the deletion events. Check for anything flagged in Windows Firewall logs or network traffic monitors.

  ### Prioritization

  This alert is high-severity due to the potential for malicious intent, particularly in critical systems where forensic evidence deletion can severely hinder incident response. The likelihood of abuse is elevated, given that prefetch file management is not typical user behavior and is often weaponized to evade detection.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers use other means to delete prefetch files or employ techniques such as clearing logs and user activity histories. Reliably detecting this behavior requires that file creation and deletion logs are correctly configured and monitored. Legitimate maintenance processes, such as application updates or user-initiated cleanups, may also trigger this alert. A related detection, such as monitoring for related critical process terminations (e.g., suspicious termination of `explorer.exe`), can help strengthen overall coverage.

