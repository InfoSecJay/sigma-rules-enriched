  ### Technical Context

  This rule detects the deletion of Windows Event Log (.evtx) files, which is a common tactic employed by attackers to cover their tracks after malicious activity. The primary objective of this action is to erase evidence of unauthorized access or system compromise, thereby hindering incident response efforts. This aligns with the MITRE ATT&CK technique "Indicator Removal on Host" (T1070).

  The primary telemetry source for this detection is the Windows file deletion logs, specifically targeting deletions within the directories where Event Log files are stored. If this behavior is confirmed as malicious, the impact could be severe, leading to a significant gap in forensic data. Importantly, this detection does NOT confirm that the files were maliciously deleted, as legitimate system maintenance or administrative actions may also result in deletions.

  ### Investigation Steps

  - **Review deletion timestamps:** Check for file deletion timestamps in Security Event ID 4663. Look for recent deletions correlating with times of known suspicious activity. Any rapid deletion of multiple .evtx files shortly after unusual logins could indicate malicious intent.

  - **Check user account activity:** Investigate the user accounts associated with the deletion event. Compare their login activity against normal behavior patterns using Security Event ID 4624. Legitimate administrators may have a history of accessing Event Logs; anomalous users should raise suspicion.

  - **Analyze specific deletion events:** Inspect the log of deleted files for evidence of multiple Event Logs being deleted in a short timeframe. If multiple .evtx files are deleted from the directory "C:\Windows\System32\winevt\Logs", this may indicate an attempt to eliminate forensic evidence.

  - **Identify any correlating processes:** Utilize Sysmon Event ID 1 to identify any process execution around the time of event log deletion. If a non-standard or suspicious process precedes the deletion event, it may indicate a malicious actor is attempting to cover their tracks.

  - **Confirm legitimate maintenance activity:** Determine if any scheduled maintenance or cleanup tasks were executed during the timeframe of the deletions. Expected activity might include routine log management through tools like Windows Task Scheduler with identifying descriptions.

  - **Assess changes in permissions or ownership:** Look for changes in file system permissions or ownership related to the log directory using Security Event ID 4670. Unauthorized changes could indicate premeditated attempts to delete logs without proper access controls.

  ### Prioritization

  This alert is classified as medium severity due to the potential impact on forensic investigations and incident response capabilities. Given the likelihood of this behavior being exploited by adversaries seeking to hide malicious actions, it demands prompt investigation. Such deletions are relatively common in post-compromise scenarios, thereby increasing the urgency for the affected systems.

  ### Blind Spots and Assumptions

  Detecting the deletion of event logs may be evaded if the attacker uses native tools to manipulate logs rather than direct file deletions. Additionally, this detection presumes that the necessary logging configuration is enabled for file deletions. Legitimate activity such as routine system cleaning or log management could trigger this alert. A related detection to complement coverage is monitoring for event log modifications using Security Event ID 1102, which could indicate attempts to alter log integrity prior to deletion.

