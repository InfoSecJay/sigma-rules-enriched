note: |
  ### Technical Context
  This detection rule identifies the deletion of Windows Event Log files, specifically those with an `.evtx` extension, which are crucial for maintaining a detailed record of system activities. The deletion of such files may indicate an adversarial attempt to erase forensic evidence following a security incident. Attackers may aim to cover their tracks after executing a malicious operation, potentially facilitating their persistence within the environment without detection.

  The relevant MITRE ATT&CK techniques associated with this behavior include **T1070 - Indicator Removal on Host**, which covers various methods attackers use to erase traces of their activity. By targeting event logs, threat actors hope to hinder incident response efforts and diminish the likelihood of detection.

  Primary data sources for detecting this behavior include Windows file deletion logs, which should capture any actions that result in the elimination of `.evtx` files, along with relevant audit logs that track file system changes.

  ### Investigation Steps
  - **Review Deletion Logs:** Examine file deletion logs to identify if specific `.evtx` files have been deleted and from which user account or process these actions originated.
  - **Correlate User Activity:** Analyze user activity and authentication logs leading up to the deletion event to uncover any anomalous behavior or escalation of privileges.
  - **Collect Memory Snapshots:** If available, capture memory snapshots to investigate any running processes at the time of log deletion, which could provide context on the actions being performed.
  - **Assess Related Events:** Look for other indicators of compromise (IoCs) that occurred around the same time as the log deletion, such as unusual access to system configurations or other modification events.

  ### Prioritization
  This alert is rated as medium severity due to the significant impact of log deletion on forensic investigations and the high likelihood of being associated with malicious intent in the enterprise environment.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding other log deletion activity that occurs outside the specified path or for different file types. The detection logic assumes that file deletion events are adequately logged, and relevant logging policies such as file auditing are enabled. Additionally, user account credentials and privileges must be closely monitored to fully leverage this detection rule’s effectiveness.

