  ### Technical Context

  This rule detects the deletion of Windows Event Log files, specifically those with the `.evtx` extension located in the `C:\Windows\System32\winevt\Logs\` directory. This behavior is commonly associated with adversaries attempting to cover their tracks or destroy forensic evidence after executing malicious activity. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), with the technique ID **T1070 (Indicator Removal on Host)**.

  The primary telemetry source involves file deletion events on Windows systems captured through Security logs (Event ID 4660) or similar file activity logs. This detection signifies a potential compromise, as the malicious deletion of event logs can impede incident response efforts and eliminate critical audit trails. It’s important to note that this detection does not confirm malicious activity on its own; legitimate administrative actions can also lead to the deletion of event logs.

  ---

  ### Investigation Steps

  - **Check Event ID 4660 for file deletions**: Review Security Event logs for Event ID 4660 entries detailing deleted files, specifically looking for target files within `C:\Windows\System32\winevt\Logs\`. Confirm the timestamp correlates with reported alerts.

  - **Correlate with system activity**: Investigate recent high-risk activities logged around the same timeframe, such as unusual process creations (Event ID 4688) and account logins (Event ID 4624). Look for outlier patterns indicating potential insider threat behaviors.

  - **Identify known legitimate maintenance activities**: Compare log file deletions against scheduled maintenance windows or administrators performing log management tasks. Review the logs of typical administrators for authorizations or approvals for event log deletions.

  - **Search for high-confidence malicious indicators**: Look for concurrent suspicious events such as file creations in the event log directory or other unusual access patterns (e.g., PowerShell commands or command prompt activity). Event IDs 4104 (PowerShell) can indicate use of scripts that might delete logs.

  - **Evaluate system role and criticality**: Determine if the affected system plays a critical role (e.g., Domain Controller, File Server) and prioritize response actions accordingly if the deletion deviates from established procedures.

  - **Check backup integrity**: Confirm if event logs were backed up prior to deletion by reviewing backup logs and verifying backup configurations. This could assist in restoring logs useful for forensic investigation.

  ---

  ### Prioritization

  The alert has medium severity due to the potential impact of deleted logs on critical systems. The likelihood of malicious abuse is high, especially given the common practice of threat actors to erase tracks. This behavior is weaponized frequently when attackers aim to prevent detection after executing their illicit activities.

  ---

  ### Blind Spots and Assumptions

  This detection can be evaded by attackers using techniques to disable logging or manipulate timestamps. Maintenance tasks by IT can also generate false positives, as certain legitimate users may delete logs as part of routine maintenance. Reliable detection requires proper SIEM configuration to capture and analyze file deletion events comprehensively. A related detection includes monitoring for failed attempts to access event logs (Event ID 4663), which can indicate unauthorized probing by malicious actors.

