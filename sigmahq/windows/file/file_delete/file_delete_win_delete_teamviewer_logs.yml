note: |
  ### Technical Context

  This Sigma rule detects the deletion of TeamViewer log files, which may indicate an attempt by an adversary to erase evidence of remote access activity on a system. The likely objective of this behavior is to cover tracks after unauthorized access or to obstruct forensic investigations during an exfiltration or compromise response. This aligns with the MITRE ATT&CK technique T1070.004: Indicator Removal on Host.

  Primary telemetry sources include Windows file system change logs, specifically focusing on file deletion events related to TeamViewer logs. The security impact is significant if malicious, as it can indicate active measures taken by an attacker to hide malicious activity. However, this detection on its own does NOT confirm that the deletion was done maliciously without context; it may occur due to legitimate administrative operations or software updates.

  ---

  ### Investigation Steps

  - **Review Events for File Deletion:** Examine Windows Security Event ID 4663 to identify file delete operations. Focus on events with TargetFilename containing “\TeamViewer_” and ending with “.log”. Look for unusual user accounts or service accounts performing the delete operation.

  - **Check TeamViewer Usage History:** Investigate TeamViewer activity within the environment (e.g., logs, accounts) to determine recent legitimate uses or authorized access. Compare timestamps of deletions against recorded connections or legitimate administrative actions.

  - **Identify Associated Processes:** Analyze Windows Security Event ID 4688 for process creation events around the time of deletion. Focus on instances of svchost.exe, ensuring that it aligns with expected service behavior rather than unusual execution patterns.

  - **Correlate with Other Forensic Artifacts:** Validate if any other related files, such as other application logs or configuration files for TeamViewer, have been concurrently deleted or modified using Windows File System metadata. This could suggest broader evidence tampering.

  - **Consult Asset Ownership and Role:** Confirm the device owner and system role of the affected machine. Higher-risk assets may warrant further scrutiny compared to standard user machines, depending on current risk assessments or data access levels.

  - **Evaluate for Remote Management Use:** Check if the deletion coincides with legitimate remote management practices. If IT admins routinely delete logs for compliance purposes, this could account for misleading alerts; context from prior approvals is crucial.

  ---

  ### Prioritization

  This alert should be considered moderate in severity. The deletion of TeamViewer logs on endpoints with high access privileges could indicate serious compromise. Given that remote access tools can be easily weaponized in attacks, it is crucial for analysts to determine the legitimacy of such deletions.

  ---

  ### Blind Spots and Assumptions

  There may be evasion techniques at play, such as legitimate users deleting logs for authorized reasons. Reliable detection requires enabling detailed auditing for file deletions, which not all environments may have configured. Additionally, other remote administration tools could trigger similar deletions, like AnyDesk or LogMeIn, which can compromise forensic integrity. Implementing companion detections around other log file alterations could strengthen overall coverage.

