note: |
  ### Technical Context

  This rule detects the deletion of TeamViewer log files on Windows systems, specifically targeting filenames that contain “TeamViewer” and end with “.log”. The behavior suggests an effort to cover tracks or destroy forensic evidence, typically associated with malicious activities such as remote access or illicit file transfers. The primary MITRE ATT&CK tactic relevant here is "Defense Evasion," specifically technique T1070.004: "File Deletion." The rule primarily relies on Windows file deletion logs, looking for deletions executed by processes such as `svchost.exe`. If this activity is malicious, it could indicate a significant security threat by allowing an adversary to hide their tracks. However, this detection alone does not confirm that any malicious activity occurred, as legitimate user behavior may also result in similar log deletions.

  ### Investigation Steps

  - **Verify event logs for deletions**: Check, specifically Windows Event ID 4663 (File Deleted) in the Security logs for entries where `TargetFilename` contains "TeamViewer" and ends with ".log".

  - **Assess deletion context**: Analyze the `Object Type` and `Access Mask` fields in Event ID 4663 to distinguish between legitimate deletions and possible malicious activities. Look for access on critical systems or unusual usage patterns.

  - **Identify the invoking process**: Cross-reference the deletion events with Sysmon Event ID 1 (Process Creation) to evaluate the command line used by `svchost.exe`, ensuring it aligns with expected system operations.

  - **Review usage history of TeamViewer**: Investigate any previous or expected legitimate usage of TeamViewer on the system, correlating Event IDs 4624 (Logon) and 4634 (Logoff), to establish a baseline of normal operations.

  - **Document legitimate behavior**: Confirm if the host regularly utilizes TeamViewer for maintenance or support functions; benign deletions may typically occur during application updates or troubleshooting.

  - **Look for other suspicious activities**: Check for additional related activities, like file modifications or additional log deletions in the same timeframe, particularly those targeting sensitive or security-related logs, as they could indicate broader malicious goals.

  ### Prioritization

  This alert carries low severity in an enterprise context, primarily due to its potential for false positives stemming from legitimate administrative actions. However, the presence of this behavior on critical assets or in conjunction with other suspicious activities raises concern about potential malicious intent as this behavior can be indicative of attempts to erase forensic data.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate users deleting log files as part of routine maintenance, which can mask malicious activity. Accurate detection requires correct configuration of log sources to capture all relevant file deletions. Additionally, consider legitimate user actions, such as software updates. A related detection could involve monitoring for unusual access patterns via technique T1070.001: "File and Directory Permissions Modification," which may reveal further evasion attempts by the attacker.

