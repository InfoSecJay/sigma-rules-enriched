note: |
  ### Technical Context
  This detection rule identifies instances where TeamViewer log files are deleted from a Windows system. The deletion of these log files may suggest that an attacker is attempting to remove forensic evidence of their activities, thereby hindering incident response and investigation processes. Attackers often target logs as a part of their tactics to cover their tracks following unauthorized access or malicious activity. The key objective behind such actions is to obscure traces of their presence and any potential malicious actions taken within the environment.

  The relevant MITRE ATT&CK tactics for this activity include **Defense Evasion** (TA0005) and the technique of **Indicator Removal on Host** (T1070.004). By removing these log files, attackers aim to evade detection by security operations teams who may be monitoring for unusual activity or potential breaches, especially pertaining to remote access software like TeamViewer.

  The primary data sources for detecting this activity include Windows event logs related to file deletions, specifically monitoring for the deletion of files containing "TeamViewer_" in their names and ending with the ".log" extension.

  ### Investigation Steps
  - **Review File Deletion Logs:** Examine Windows file deletion logs to identify instances where TeamViewer log files have been deleted. Check for patterns or unusual timings surrounding the deletion events.
  - **Correlate with Process Activity:** Investigate the process activity around the times of deletion to confirm whether legitimate processes accessed or executed during the log deletion potentially indicate malicious behavior behind the action.
  - **Analyze User Accounts Involved:** Identify the user account responsible for the deletion. Verify whether this account has legitimate access to the TeamViewer application and investigate any unusual behaviors or access patterns.
  - **Check for Related Events:** Look for other security events that may indicate malicious activity, such as unexpected TeamViewer connections or usage patterns, to establish contextual evidence around the log file deletions.

  ### Prioritization
  The alert is classified as low severity; however, the potential impact can escalate if the deletion of these logs coincides with other suspicious activities, indicating that an established remote access connection may be malicious. Therefore, while isolated instances may be typical, the combination with other events should raise concern.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is that not all deletions are logged if log retention policies or local event log configurations are insufficient. The detection logic assumes that the deletion of these log files is unauthorized without context or supporting evidence of malicious intent. Required logs include file system monitoring to track deletions and adequate logging configuration to capture relevant file system events, specifically surrounding TeamViewer operations.

