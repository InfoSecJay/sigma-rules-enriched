title: Suspicious Appended Extension
id: e3f673b3-65d1-4d80-9146-466f8b63fa99
status: test
description: Detects file renames where the target filename uses an uncommon 
  double extension. Could indicate potential ransomware activity renaming files 
  and adding a custom extension to the encrypted files, such as ".jpg.crypted", 
  ".docx.locky", etc.
references:
- https://app.any.run/tasks/d66ead5a-faf4-4437-93aa-65785afaf9e5/
- https://blog.cyble.com/2022/08/10/onyx-ransomware-renames-its-leak-site-to-vsop/
author: frack113
date: 2022-07-16
modified: 2023-11-11
tags:
- attack.impact
- attack.t1486
logsource:
  product: windows
  category: file_rename
  definition: 'Requirements: Microsoft-Windows-Kernel-File Provider with at least
    the KERNEL_FILE_KEYWORD_RENAME_SETLINK_PATH keyword'
detection:
  selection:
    SourceFilename|endswith:
    - '.doc'
    - '.docx'
    - '.jpeg'
    - '.jpg'
    - '.lnk'
    - '.pdf'
    - '.png'
    - '.pst'
    - '.rtf'
    - '.xls'
    - '.xlsx'
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.jpeg.'
    - '.jpg.'
    - '.lnk.'
    - '.pdf.'
    - '.png.'
    - '.pst.'
    - '.rtf.'
    - '.xls.'
    - '.xlsx.'
  filter_main_generic:
    TargetFilename|endswith:
            # Note: Please add more used extensions by backup or recovery software
    - '.backup'
    - '.bak'
    - '.old'
    - '.orig'
    - '.temp'
    - '.tmp'
  filter_optional_anaconda:
    TargetFilename|contains: ':\ProgramData\Anaconda3\'
    TargetFilename|endswith: '.c~'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Backup software
level: medium
note: |
  ### Technical Context

  This Sigma rule detects file rename operations where the target filename incorporates an uncommon double extension, often characteristic of ransomware behavior aimed at encrypting files. The typical attacker objective is to obfuscate the true file type post-encryption (e.g., renaming files to ".jpg.crypted" or ".docx.locky") to confuse users and deter recovery efforts. The relevant MITRE ATT&CK technique is Ransomware (T1486), which describes data encryption for extortion purposes.

  The primary telemetry source for this detection is file rename events logged by the Microsoft Windows Kernel File Provider, specifically targeting the KERNEL_FILE_KEYWORD_RENAME_SETLINK_PATH keyword. If malicious, this behavior poses a significant security risk, potentially leading to data loss, operational disruptions, and financial extortion. However, this detection alone does not confirm that the naming convention is malicious, as legitimate applications (like backup software) can also perform similar actions.

  ### Investigation Steps

  - **Review rename event details:** Check Event IDs related to file renames (e.g., Security Event ID 4663) for any suspicious activities, focusing on source and target filenames. Look for extensions being renamed to unusual formats, such as ".docx.locky".

  - **Cross-reference known benign processes:** Identify any legitimate applications involved in the rename process by checking against a list of approved software (e.g., backup solutions). They may rename files using common extensions safely, without the uncommon double extensions.

  - **Analyze file access patterns:** Examine file access logs (e.g., Sysmon Event ID 10) for unusual patterns preceding the rename event, specifically looking for high-volume file accesses or modifications by non-standard user accounts.

  - **Check for file creation or modification timestamps:** Investigate the timestamps of the renamed files. Ransomware typically alters many files in a short time frame—look for overlapping modifications in the logs for multiple files across a short duration.

  - **Examine affected file paths:** Validate if the files undergoing renaming are located in sensitive or critical directories, such as user data folders or shared network drives typically targeted by ransomware.

  ### Prioritization

  The severity of this alert should be considered medium. If targeted files are critical for operations or contain sensitive data, the impact of ransomware could be significant. Moreover, this behavior is characteristic of ransomware attacks, making it a high-priority signal that warrants immediate investigation.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion tactics employed by attackers, who might use standard extensions or avoid renaming files altogether. Reliable detection depends on the configuration of Windows logging to ensure rename events are captured properly. Legitimate backup or recovery software may erroneously trigger the rule. Companion detections, such as monitoring abnormal file system behaviors or other ransomware indicators like unusual network connections or high CPU usage, can provide stronger evidence of malicious activity.

