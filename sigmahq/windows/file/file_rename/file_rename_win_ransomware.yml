title: Suspicious Appended Extension
id: e3f673b3-65d1-4d80-9146-466f8b63fa99
status: test
description: Detects file renames where the target filename uses an uncommon double
  extension. Could indicate potential ransomware activity renaming files and adding
  a custom extension to the encrypted files, such as ".jpg.crypted", ".docx.locky",
  etc.
references:
- https://app.any.run/tasks/d66ead5a-faf4-4437-93aa-65785afaf9e5/
- https://blog.cyble.com/2022/08/10/onyx-ransomware-renames-its-leak-site-to-vsop/
author: frack113
date: 2022-07-16
modified: 2023-11-11
tags:
- attack.impact
- attack.t1486
logsource:
  product: windows
  category: file_rename
  definition: 'Requirements: Microsoft-Windows-Kernel-File Provider with at least
    the KERNEL_FILE_KEYWORD_RENAME_SETLINK_PATH keyword'
detection:
  selection:
    SourceFilename|endswith:
    - '.doc'
    - '.docx'
    - '.jpeg'
    - '.jpg'
    - '.lnk'
    - '.pdf'
    - '.png'
    - '.pst'
    - '.rtf'
    - '.xls'
    - '.xlsx'
    TargetFilename|contains:
    - '.doc.'
    - '.docx.'
    - '.jpeg.'
    - '.jpg.'
    - '.lnk.'
    - '.pdf.'
    - '.png.'
    - '.pst.'
    - '.rtf.'
    - '.xls.'
    - '.xlsx.'
  filter_main_generic:
    TargetFilename|endswith:
            # Note: Please add more used extensions by backup or recovery software
    - '.backup'
    - '.bak'
    - '.old'
    - '.orig'
    - '.temp'
    - '.tmp'
  filter_optional_anaconda:
    TargetFilename|contains: ':\ProgramData\Anaconda3\'
    TargetFilename|endswith: '.c~'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Backup software
level: medium
note: |
  ### Technical Context
  This detection rule identifies suspicious file renames where the target filename utilizes a double extension. This behavior is often associated with ransomware activity, wherein malicious actors encrypt files and subsequently rename them to obscure their true nature, often appending unique extensions like ".jpg.crypted" or ".docx.locky". The primary objective of such tactics is to impede access to important files, potentially extorting victims for recovery.

  According to the MITRE ATT&CK framework, this behavior can be mapped to the tactic of **Impact (TA0040)** and the technique **Data Encrypted for Impact (T1486)**. Ransomware operators commonly employ these techniques to manipulate files and secure ransom payments from affected users. The primary data sources that will contain the necessary evidence for this detection include file rename logs from Windows systems, specifically monitored by the Microsoft-Windows-Kernel-File Provider.

  ### Investigation Steps
  - **Review File Rename Logs:** Examine Windows file rename logs to identify events where target filenames end with uncommon double extensions. Look for patterns linking these renames to files previously established in the source list.
  - **Analyze Recent File Activity:** Investigate the files that received the new extensions, including their modification dates and sizes, to assess whether they align with ransomware behavior.
  - **Identify Contextual Enrichment:** Cross-reference the file rename events with user or process activity logs to determine the legitimacy of the actions performed, marking any unusual user behavior for deeper examination.
  - **Monitor Network Traffic:** Inspect outbound network connections initiated by the involved processes to identify any connections to known malicious IPs or C2 servers linked with ransomware campaigns.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of ransomware, which can lead to significant data loss and operational disruptions. However, the likelihood of false positives, particularly from legitimate backup or recovery software, must be taken into consideration.

  ### Blind Spots and Assumptions
  Detection coverage may be limited by the specific logging configuration of the Windows systems, as the rule relies on the Microsoft-Windows-Kernel-File Provider. The assumption underlying this detection logic is that the renaming action is indeed malicious, which may not account for legitimate file operations performed by authentic applications or users. Furthermore, organizations must ensure they have comprehensive logging for file operations and that the appropriate event keywords are enabled to capture relevant events effectively.

