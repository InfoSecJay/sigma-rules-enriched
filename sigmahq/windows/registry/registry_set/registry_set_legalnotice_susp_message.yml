note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry keys for Legal Notice captions and texts that contain keywords frequently associated with ransomware demands. The primary attacker objective is to intimidate victims into paying ransoms by communicating threats about encryption of their files. This behavior aligns with the MITRE ATT&CK technique T1491.001: "Ransomware".

  The primary telemetry sources for this detection are Windows Registry change logs indicating modifications to `LegalNoticeCaption` and `LegalNoticeText`. If successfully executed, this could disrupt operations and cause data loss across the enterprise. While this detection indicates modification of the registry for ransom demands, it does NOT confirm an actual infection or encryption of files on its own—further investigation is necessary.

  ### Investigation Steps

  - **Review registry changes:** Check for Registry Event ID 4657 (registry value changed) focusing on the following paths:
    `\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeCaption` and
    `\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeText`. Look for recent changes made just before the alert was triggered.

  - **Identify the content of the Legal Notice:** Inspect the updated values in `LegalNoticeCaption` and `LegalNoticeText`. Any presence of terms such as "encrypted", "Unlock-Password", or "paying" indicates a potentially malicious activity.

  - **Correlate with other telemetry:** Review Security Event ID 4688 (Process Creation) for any processes initiated around the same time as the registry modification. Look for unusual processes that match known ransomware behaviors—particularly any invocation of command-line utilities typically used during ransomware attacks (e.g., `cmd.exe` or `powershell.exe` with unusual parameters).

  - **Investigate system access logs:** Check user access logs for any account activity around the time of the registry modification. If administrative accounts or service accounts accessed the system unexpectedly, that could signify a compromise or misuse.

  - **Establish baseline behavior for legal notices:** Determine if legal notices are routinely modified within the environment. Review historical changes to these registry keys to identify any legitimate purposes or patterns, indicating whether the modification is part of standard operating processes.

  - **Look for impacted files:** Validate the presence of known file extensions commonly targeted by ransomware (e.g., `.locked`, `.encrypted`). Any file creation or exfiltration associated with these extensions may support the malicious nature of the alert.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems and operational continuity if ransomware is deployed. The likelihood of malicious abuse is significant, as ransomware typically aims to lock users out of data and demands payment. This behavior is a known tactic in ransomware attacks.

  ### Blind Spots and Assumptions

  Detection is limited by potential registry modification evasion techniques, such as malware that directly interacts with system processes to bypass standard logging. Reliable detection requires comprehensive logging for Windows Registry modifications. Legitimate administrative activities may also trigger this alert when legal notices are modified for acceptable use cases. It is advisable to supplement this detection with alerts for file-encryption behaviors or anomalous process execution patterns that can corroborate ransomware activity.

