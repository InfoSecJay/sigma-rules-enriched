note: |
  ### Technical Context

  This Sigma rule detects registry changes to the `LegalNoticeCaption` and `LegalNoticeText` values in Windows systems, specifically when the text contains keywords commonly used in ransomware messages, such as "encrypted," "Unlock-Password," and "paying." The detection is primarily aimed at identifying potential ransomware activity, wherein an attacker modifies legal notice settings to inform victims about encryption and ransom demands.

  The likely attacker objective is to intimidate users into complying with ransom demands by making the system appear compromised and presenting instructions for payment. This activity aligns with the MITRE ATT&CK tactic **Impact** (TA2019) and technique **Data Encrypted for Impact** (T1491.001). The primary telemetry sources are Windows registry change events, typically sourced from the event logs that capture registry modifications.

  If this behavior is confirmed as malicious, it indicates a potentially severe security impact, as it suggests an active ransomware infection on the system. However, it is crucial to note that this detection does NOT confirm a ransomware infection on its own; further investigation is required.

  ### Investigation Steps

  - **Check the registry for changes:** Use `regedit` or PowerShell to verify recent modifications to `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeCaption` and `LegalNoticeText`. Look for the presence of ransom-related keywords in the values.

  - **Review relevant Windows Security Event IDs:** Analyze Security Event ID 4657 to identify registry value changes. Correlate timestamps of changes with other suspicious activities around the same timeframe.

  - **Identify legitimate system behavior:** Check if `LegalNoticeCaption` or `LegalNoticeText` were modified as part of a standard organizational practice, such as an IT policy update or scheduled maintenance. Expect these values to contain non-threatening organizational or legal information.

  - **Look for high-confidence malicious indicators:** Investigate concurrent events tied to known ransomware activity, such as continuous file encryption failures indicated by Event ID 5145 (File Share Access Denied) or increased process creation events (Event ID 4688) with strange parent-child relationships (e.g., `cmd.exe` or PowerShell running from unusual parent processes).

  - **Cross-reference with threat intelligence:** Use threat intelligence sources to check for recent ransomware campaigns that utilize similar keywords in ransom messages and correlate with the observed telemetry from the affected systems.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on affected systems and data if ransomware is confirmed. The likelihood of malicious abuse is significant, as ransomware campaigns are increasingly common, and the specific registry changes are indicative of potential victimization.

  ### Blind Spots and Assumptions

  Detection may be limited if the necessary event logging for registry changes is not enabled or if log retention policies are too short. Legitimate activities such as IT policy updates or legal notices may trigger this alert, requiring context to differentiate between benign and malicious behavior. A related detection would include monitoring for unusual process creation events (Event ID 4688) that frequently accompany ransomware activity, enhancing overall coverage.

