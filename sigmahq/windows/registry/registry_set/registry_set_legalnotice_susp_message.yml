logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeCaption'
    - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LegalNoticeText'
    Details|contains:
    - 'encrypted'
    - 'Unlock-Password'
    - 'paying'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potential ransomware activity by monitoring for changes to the "LegalNoticeCaption" and "LegalNoticeText" registry values, which are frequently manipulated by ransomware to display messages to victims. Such messages often contain keywords associated with ransom demands, such as "encrypted," "Unlock-Password," and "paying." Attackers aim to extort money from victims by encrypting their files and then instructing them on how to pay for decryption.

  The relevant MITRE ATT&CK tactics and techniques for this detection include **Defense Evasion (T1491.001)**, which involves modifying system settings in order to execute malicious payloads and conceal their activities. The manipulation of these registry values can indicate lateral movement within a network or leverage of user machines to execute ransom demands, making the detection of these changes crucial for mitigating potential ransomware incidents.

  The primary data sources that would provide the best evidence for this detection include **Windows registry change logs** and **system event logs** that monitor registry modifications. These logs help track changes in critical system parameters and provide insights into possible malicious behavior.

  ### Investigation Steps
  - **Review Registry Change Logs:** Examine the Windows registry logs specifically for changes to the `LegalNoticeCaption` and `LegalNoticeText` keys. Look for timestamps and user accounts associated with these modifications to identify any unauthorized access.

  - **Analyze System Event Logs:** Inspect the related system event logs for entries that may indicate the execution of unusual or suspicious processes that correlate with the timing of the registry changes.

  - **Correlate with Malware Indicators:** Cross-reference the keywords found in the registry values with known ransomware families and their specific indicators of compromise to assess the potential threat level.

  - **Monitor for Subsequent Encryption Activity:** Look for file system changes or unusual file access patterns that may suggest further ransomware activity, such as bulk encryption of user files or attempts to communicate with known C2 servers for further instructions.

  ### Prioritization
  This alert has a high severity due to the significant potential impact of ransomware incidents on enterprise environments. The likelihood of ransomware attacks is increasing, making timely detection and response critical to minimizing damage and data loss.

  ### Blind Spots and Assumptions
  This detection may not account for all ransomware variants, particularly those that do not modify the LegalNotice registry values or use non-standard methods of message delivery. It also assumes that registry logging is available and correctly configured in the environment. If the logging of registry writes is not enabled, critical detection capabilities will be compromised, leading to potential blind spots in identifying ransomware behavior.

