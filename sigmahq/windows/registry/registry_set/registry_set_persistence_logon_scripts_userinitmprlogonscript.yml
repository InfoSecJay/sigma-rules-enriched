note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of the "UserInitMprLogonScript" registry value, which is commonly utilized by attackers to establish persistence on a compromised Windows system. The objective of the adversary may include ensuring their malicious script runs at each user logon, facilitating continued access and execution of malicious activities. This behavior is correlated with the MITRE ATT&CK tactic of Persistence and the technique ID T1037.001.

  Primary telemetry sources for this detection include the Windows Registry logs focusing on registry modifications. In particular, the creation of the "UserInitMprLogonScript" value may signify a malicious tampering attempt impacting system integrity. However, merely detecting this registry change does not confirm that the script is indeed malicious – legitimate scripts may also trigger this alert.

  ### Investigation Steps

  - **Review registry change event:** Check Windows Security Event ID 4663 or Sysmon Event ID 13 for the specific "UserInitMprLogonScript" registry modification event to identify which user or process made the change.
  - **Analyze script contents:** Inspect the "UserInitMprLogonScript" value in the registry for suspicious commands or indicators of malicious behavior, looking for encoded scripts or unusual PowerShell commands.
  - **Compare against known good:** Validate the legitimacy of the script by comparing it with standard logon scripts used within your organization; unusual scripts not matching typical enterprise patterns may indicate compromise.
  - **Check for lateral movement:** Assess any related logs (e.g., authentication logs) to trace if this registry key change is associated with unusual login attempts or lateral movement (Event IDs 4624, 4648) from unauthorized accounts.
  - **Identify expected behavior:** Review the environment for known legitimate usage of “UserInitMprLogonScript” within enterprise processes; document any systems that have authorized scripts to better filter alerts.
  - **Correlate with user behavior:** Analyze the user account associated with the modification for anomalous behavior, like failed logins or unusual access patterns, which could indicate compromised credentials.

  ### Prioritization

  This alert should be treated with medium priority. While the modification of the "UserInitMprLogonScript" registry key can indicate potential persistence mechanisms employed by malicious actors, the risk is contingent on the criticality of the affected system and the likelihood of exploitation within the environment. Persistence vectors are often weaponized, necessitating prompt investigative action.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative actions or automated scripts that update this registry value without malicious intent, potentially leading to false positives. Reliable detection requires comprehensive logging of registry changes and well-defined baselines for legitimate scripts in the organization. Additionally, actions such as remote administration tools or software installs could inadvertently create this registry key. A related detection rule monitoring for changes to other persistence mechanisms (e.g., Task Scheduler) would enhance coverage and context.

