note: |
  ### Technical Context
  This rule detects the creation of the "UserInitMprLogonScript" registry value, which may indicate an attempt to establish persistence by malicious actors. Attackers often utilize registry manipulation to execute scripts at user logon, allowing them to maintain access to the system across reboots or user sessions. The potential for misuse of this registry value highlights the importance of monitoring modifications that could enable unauthorized scripts to run during the logon process.

  The relevant MITRE ATT&CK tactics include **Persistence** (Tactics: TA0003) and **Privilege Escalation** (Tactics: TA0004), particularly focusing on the technique **Logon Scripts** (T1037.001). This method enables attackers to execute arbitrary commands or scripts in the context of a legitimate user, facilitating further lateral movement and compromise of additional systems within the network.

  Primary data sources necessary for effective detection include Windows registry change logs, which can reveal unauthorized modifications, and process creation events that capture which scripts are being executed at logon time. Monitoring these sources helps identify not just the attempt at establishing persistence but also its operational outcomes.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate the Windows registry for recent modifications to the "UserInitMprLogonScript" value. Determine when the change occurred and whether it aligns with any known user activity.
  - **Analyze Execution Context**: Check process creation logs around the time when the registry change was made. Validate which process executed the logon script and determine if it’s a legitimate application or process.
  - **Inspect Script Contents**: If the registry value points to a script, analyze the contents of the script to identify any malicious commands or indicators of compromise (IOCs). Look for unusual or unauthorized commands that could indicate malicious intent.
  - **Cross-reference User Activity**: Match the timestamp of the registry changes with user access logs, authentication attempts, and remote access records to identify any suspicious behavior concurrent with the registry event.

  ### Prioritization
  This alert should be treated with medium severity due to its association with persistence tactics, which can lead to long-term compromise of systems if not addressed. The likelihood of encountering this behavior in enterprise environments is moderate, particularly in scenarios involving targeted attacks or insider threats.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage regarding legitimate administrative activities that also modify registry values. The detection logic assumes that all registry changes are suspicious, potentially leading to false positives. Required logs for this alert to function effectively include detailed registry change audits and comprehensive process creation logs to capture the execution context of scripts triggered by the logon process. Without these logs, detecting the use of the "UserInitMprLogonScript" for malicious purposes may be compromised.

