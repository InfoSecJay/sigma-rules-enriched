note: |
  ### Technical Context

  This Sigma rule detects the setting of a new registry value for BgInfo configuration that allows the execution of custom WMI queries via BgInfo.exe. The likely attacker objective is to persistently execute malicious code or retrieve system information without direct user awareness. This behavior falls under the MITRE ATT&CK tactic of Persistence and the technique T1112 (Modification of Registry).

  The primary telemetry sources are Windows Registry logs, specifically monitoring changes to the registry path `\Software\Winternals\BGInfo\UserFields\`. If an attacker exploits this mechanism, it can lead to data exfiltration or unauthorized access to sensitive information. This detection does NOT confirm that the behavior is malicious on its own; it must be correlated with additional context and activity indicators.

  ### Investigation Steps

  - **Check registry changes**: Review Windows Registry logs for Event ID 4657, focusing on the `\Software\Winternals\BGInfo\UserFields\` key to validate which values were modified and the associated user context.

  - **Assess WMI query execution**: Analyze WMI logs, specifically those related to Event ID 5858, to identify any unusual queries initiated by BgInfo.exe. Malicious queries will often include parameters or fields not typically used by legitimate BgInfo configurations.

  - **Examine scheduled tasks**: Look for any new scheduled tasks or services (Event ID 4697) that may have been created to execute BgInfo.exe upon startup, which points to persistence mechanisms. Regular BgInfo usage would not typically include task creation.

  - **Review user context**: Validate the legitimacy of the user making changes by cross-referencing against usual operational users. Changes made by non-admin accounts or unfamiliar service accounts should raise an alert.

  - **Identify related file activity**: Confirm file creation events for BgInfo.exe using Sysmon Event ID 11 to see if the executable has been altered or repurposed. Legitimate instances of BgInfo will exhibit typical file paths and signatures.

  ### Prioritization

  This alert has medium severity due to the potential for significant impact from malicious use of registry edit capabilities on critical systems. The likelihood of malicious abuse is high since this method is often weaponized by attackers for persistence and evasion tactics.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that an attacker may use legitimate tools in subtle ways, making identification challenging. Proper log sources, including Registry and WMI logs, must be configured to ensure reliable detection. Legitimate WMI queries performed via BgInfo may occasionally trigger this rule, necessitating contextual analysis. A companion detection could involve monitoring for unusual WMI query patterns or specific command-line arguments used with BgInfo to reinforce anomaly detection.

