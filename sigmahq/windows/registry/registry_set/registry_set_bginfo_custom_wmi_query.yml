note: |
  ### Technical Context

  This Sigma rule detects the configuration of a new registry value associated with the BgInfo application, particularly targeting custom WMI queries. Attackers may exploit this feature to run malicious WMI commands under the guise of legitimate processes, achieving persistence or executing remote commands. Relevant MITRE ATT&CK tactics are "Persistence" (TA0003) and "Defense Evasion" (TA0005), with the specific technique being "WMI Event Subscription" (T1112). The primary telemetry source is Windows registry logs, specifically tracking changes to registry paths associated with BgInfo. If malicious, this behavior could allow attackers ongoing access and command over affected systems. This detection does NOT confirm that malicious activity is occurring; it merely highlights a potentially abnormal registry change.

  ### Investigation Steps

  - **Inspect registry change details**: Review logs for Registry Event ID 4657 to analyze modifications to `HKEY_CURRENT_USER\Software\Winternals\BGInfo\UserFields\`. Malicious changes often contain unusual values differing from expected configurations.

  - **Compare against known-good configurations**: Validate any other instances of BgInfo in use by identifying normal registry paths and values being used in a healthy environment. Legitimate environments should have consistent, predefined BgInfo user fields.

  - **Review execution history**: Check for event logs indicating execution of BgInfo.exe (Security Event ID 4688 or Sysmon Event ID 1) around the time of the registry change. Sudden, unexplained instances of BgInfo execution may indicate a potential compromise.

  - **Correlate with additional telemetry**: Look for associated WMI queries in the event logs (e.g., Security Event ID 4688 for process creation) initiated by BgInfo.exe. Unusual or complex queries could indicate malicious usage.

  - **Identify persistence mechanisms**: Verify if other persistence mechanisms are in play by checking for other registry entries or scheduled tasks that could show signs of adversary activities beyond just BgInfo.

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on system integrity and the likelihood of malicious abuse of WMI capabilities. While such configurations can be weaponized, they may also be legitimate administrative functions.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques like legitimate software utilizing similar registry changes for benign purposes. Reliable detection requires proper logging of registry modifications and potentially all processes invoking WMI. Legitimate administrative tasks may also trigger this alert, particularly in environments where BgInfo is widely used for system information display. A related detection to strengthen coverage would be monitoring for unusual WMI activity (T1047), which can indicate misusing WMI capabilities beyond the scope of BgInfo.

