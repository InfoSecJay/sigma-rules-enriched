note: |
  ### Technical Context

  This Sigma rule detects the modification of a registry value that configures the BgInfo tool to use a custom database path for storing command execution results. Attackers may leverage BgInfo, a legitimate tool, for persistence and defense evasion by saving sensitive data within an altered database location. This behavior is associated with the MITRE ATT&CK tactic of **Persistence** (TA0003) and the technique of **Registry Run Keys / Startup Folder** (T1112).

  The primary telemetry source for detection includes Windows registry logs that document changes to registry keys. If malicious, this behavior can facilitate unauthorized information exfiltration while evading conventional security measures. Importantly, this detection does NOT confirm malicious intent on its own; legitimate configurations can be made by authorized users.

  ### Investigation Steps

  - **Verify registry modifications:** Check for changes to the registry key at `HKEY_CURRENT_USER\Software\Winternals\BGInfo\Database` or `HKEY_LOCAL_MACHINE\Software\Winternals\BGInfo\Database`. Use tools like regedit or PowerShell (Get-ItemProperty).

  - **Correlate with BgInfo execution logs:** Review logs from BgInfo execution (if available) around the time of the registry change. Verify if the application executed additional potentially malicious commands timestamped in your telemetry log sources.

  - **Identify benign configurations:** Confirm if there are legitimate entries for external databases being used for deployment support tasks. Look for comments or documentation in implemented configurations.

  - **Search for common malicious indicators:** Look for concurrent use of BgInfo with abnormal command patterns (e.g., specific PowerShell commands that align with data exfiltration efforts). Review Windows Event IDs 4688 (process creation) and 7045 (service creation) for suspicious activity that matches this timeframe.

  - **Assess host role:** Determine the function of the affected system. If it’s a server hosting sensitive data or functions, elevate the urgency of the investigation. Cross-reference its critical role with known background applications.

  - **Monitor for data exfiltration:** If applicable, check for any data being written to cloud storage or external systems immediately after the registry adjustment. Validate any file conceptualizing database contents with network logs (such as firewall or proxy logs) to ascertain traffic patterns.

  ### Prioritization

  This alert is medium severity due to the potential for information theft and prolonged root access facilitated by modifying BgInfo settings. While not frequent in many enterprises, misuse of this tool for persistence is feasible and can pose significant risks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for attackers to revert changes post-detection, which could evade monitoring. The alert may also trigger from legitimate usage, such as administrators configuring BgInfo for operational needs. Ensure that registry logging is enabled to avoid missing relevant changes. A related detection, monitoring for unusual PowerShell commands (especially related to data exfiltration), can strengthen defenses against this technique.

