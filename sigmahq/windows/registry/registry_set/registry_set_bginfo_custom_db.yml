note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Registry where a new configuration path for BgInfo.EXE's database is set. This behavior is often exploited by attackers to manipulate BgInfo to exfiltrate command results by redirecting output to a user-defined database in the registry. The likely attacker objective is to persistently collect sensitive information from the compromised system. This activity relates to the MITRE ATT&CK tactics of Persistence (TA0003) and Defense Evasion (TA0005), specifically technique T1112 (Modify Registry).

  The primary telemetry source for this detection is Windows Registry logs, specifically monitoring for changes to the registry key `HKEY_CURRENT_USER\Software\Winternals\BGInfo\Database`. If this modification is initiated by an attacker, the security impact could be significant, exposing sensitive system and user data. Importantly, this detection does NOT confirm that an attack is in progress or that BgInfo is maliciously used, as legitimate updates can occur in benign scenarios.

  ### Investigation Steps

  - **Review registry modification logs:** Check the Windows Registry logs (Event ID 4657) for changes to the key `HKEY_CURRENT_USER\Software\Winternals\BGInfo\Database`. Look for unexpected modifications made during unusual times or by suspicious user accounts.

  - **Identify process initiation:** Investigate associated process creation logs (Event ID 4688 or Sysmon Event ID 1) for BgInfo.EXE. Legitimate BgInfo activity is typically triggered during user logon or system startup by known, trusted applications.

  - **Correlate user behavior:** Assess historical user activity and logon events (Event ID 4624). If the modification was made by a user account that hasn't recently engaged with BgInfo operations, this may indicate malicious intent.

  - **Check for data exfiltration artifacts:** Evaluate any outbound network traffic logs (firewall or proxy logs) for evidence of data being sent from the modified database location, specifically concerning unexpected connections to external IPs or domains.

  - **Look for additional persistence mechanisms:** Review startup items and scheduled tasks (Event ID 4698 for new scheduled tasks) to identify any other modifications that may indicate an attempt to maintain persistence alongside the BgInfo modification.

  ### Prioritization

  This alert should be regarded with medium severity. Changes to BgInfo configuration can indicate attempts at persistence or information exfiltration, especially on critical systems like domain controllers or endpoints with sensitive data. While not common, exploitation of BgInfo by adversaries has been documented, which heightens the urgency for investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded if the attacker uses legitimate administrative privileges or benign applications to make registry changes without logging. Reliable detection relies upon proper monitoring of Windows Registry logs, which must be correctly enabled and configured. Also, legitimate updates by system administrators or authorized users applying new configurations may trigger this alert. A related detection to strengthen coverage would involve monitoring for other suspicious modifications under the same user profile or related to the execution of BgInfo.EXE itself.

