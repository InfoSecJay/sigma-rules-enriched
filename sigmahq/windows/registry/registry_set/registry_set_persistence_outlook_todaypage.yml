logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains|all:
    - 'Software\Microsoft\Office\'
    - '\Outlook\Today\'
  selection_value_stamp:
    TargetObject|endswith: '\Stamp'
    Details: 'DWORD (0x00000001)'
  selection_value_url:
    TargetObject|endswith:
    - '\URL'
    - '\UserDefinedUrl'
  filter_main_office:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  condition: selection_main and 1 of selection_value_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects modifications to the Windows registry that could indicate the establishment of persistence through modified Outlook Today pages. Attackers may link arbitrary code execution by changing the "UserDefinedUrl" or "URL" values within the Outlook registry keys. The likely objective of this behavior is to maintain access and control over compromised systems, facilitating further attacks. Relevant MITRE ATT&CK tactics include Persistence (T1135) and Defense Evasion (T1112). Primary telemetry sources are Windows Registry logs, particularly focusing on keys associated with Outlook. If malicious, this behavior could allow attackers to run commands or load malware during user sessions. It is essential to note that this detection alone does not confirm malicious intent, as legitimate users may also modify these settings for valid purposes.

  ---

  ### Investigation Steps

  - **Check registry modifications:** Review Windows Registry logs for changes to `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\Today\URL` and `UserDefinedUrl`. Look for alterations that coincide with unusual user activity or system behavior.

  - **Validate expected user behavior:** Confirm whether the affected user had legitimate reasons for altering their Outlook settings. Users often customize their Outlook Today page, affecting the registry settings; validate against known user documentation or training.

  - **Analyze process origins:** Investigate running processes using Process Monitoring logs (Sysmon Event ID 1). Ensure that `OfficeClickToRun.exe` is the legitimate signer and originates from the expected paths: `C:\Program Files\Common Files\Microsoft Shared\ClickToRun\`.

  - **Identify high-confidence malicious indicators:** Look for known malicious URLs or unusual user-defined URLs containing executable scripts or links to untrusted domains. Correlate with threat intelligence sources for flagged indicators.

  - **Assess for legitimate Administration activities:** Examine logs for legitimate administrative actions that may alter registry keys. There may be maintenance activities scheduled aligning with the timestamps of the detected changes, indicating benign changes.

  - **Cross-reference similar detections:** Use the related detection (ID: ddd171b5-2cc6-4975-9e78-f0eccd08cc76) to evaluate if additional abnormal activities or patterns exist that could indicate broader compromise.

  ---

  ### Prioritization

  This alert is high severity, as modifying registry entries for Outlook can render significant impact, potentially allowing unauthorized persistence and control. The likelihood of malicious abuse is high given the targeted nature of persistence techniques, which are often weaponized by attackers.

  ---

  ### Blind Spots and Assumptions

  Detection may be bypassed by legitimate software updates or user customizations. Reliable detection requires proper configuration of registry logging. Routine modifications for legitimate purposes, such as user training sessions or corporate onboarding processes, might trigger this alert. A related detection for unusual Outlook behavior, such as unexpected network activity from Outlook (ID: ddd171b5-2cc6-4975-9e78-f0eccd08cc76), can enhance coverage.

