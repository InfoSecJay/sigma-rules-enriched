logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains|all:
    - 'Software\Microsoft\Office\'
    - '\Outlook\Today\'
  selection_value_stamp:
    TargetObject|endswith: '\Stamp'
    Details: 'DWORD (0x00000001)'
  selection_value_url:
    TargetObject|endswith:
    - '\URL'
    - '\UserDefinedUrl'
  filter_main_office:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  condition: selection_main and 1 of selection_value_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects potential persistence mechanisms leveraged through the Outlook Today page by monitoring specific registry changes. Attackers may use this tactic to define a custom webpage that could execute arbitrary code, thereby establishing persistence within the environment. The primary attacker objective is to maintain access to compromised systems while potentially gathering sensitive information or executing further malicious actions.

  Relevant MITRE ATT&CK tactic: Persistence (T1112 - Modify Registry). The primary telemetry sources for this detection are Windows Registry change events, particularly focusing on registry key modifications related to Outlook. If malicious, this behavior poses significant security risks as it may facilitate unauthorized access or control over user machines. It is crucial to note that this detection does NOT confirm active exploitation; it merely indicates suspicious registry changes that could be an indicator of compromise.

  ### Investigation Steps

  - **Review registry changes in relevant keys:** Access the registry and examine the keys under `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\Today\`. Look for modifications indicating the presence of `URL` or `UserDefinedUrl` values with non-default URLs.

  - **Extract and analyze associated attributes:** Check the `TargetObject` field from registry logs (typically Sysmon Event ID 13 or Security Event ID 4657) for suspicious entry modifications, especially those that do not correspond to legitimate applications or URLs.

  - **Validate process correlation with registry events:** Confirm if any changes to the registry coincide with the launch of `OfficeClickToRun.exe` (Image path: `C:\Program Files\Common Files\Microsoft Shared\ClickToRun\`). This process is legitimate and should not be altering registry values unexpectedly as part of normal operations.

  - **Identify benign configurations:** Document legitimate use cases of Outlook's Today page settings, particularly in your organization (e.g., standard URLs set by default for user environments), and compare against detected changes to surface anomalies.

  - **Check for additional indicators of compromise:** Investigate other persistence mechanisms or suspicious behaviors such as modifications under the `Run` or `RunOnce` registry keys that could signal broader malicious intentions from the same actor.

  ### Prioritization

  This alert should be classified as high severity within an enterprise context. The negative impact on the affected system can be severe if exploited, with a significant likelihood of abuse given the commonality of the technique in maintaining persistence. Such behaviors are not only indicative of advanced persistent threats (APTs) but are also frequently weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion techniques where attackers may use legitimate applications as decoys for persistence that would not trigger this rule. Dependency on accurate registry logging is essential for reliable detection. Legitimate actions may include personalized Outlook configurations by users that could inadvertently trigger alerts. A related detection that could enhance coverage would involve monitoring general modifications to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`, which also highlights mechanisms for persistence.

