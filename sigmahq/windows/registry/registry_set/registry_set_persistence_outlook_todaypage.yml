logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains|all:
    - 'Software\Microsoft\Office\'
    - '\Outlook\Today\'
  selection_value_stamp:
    TargetObject|endswith: '\Stamp'
    Details: 'DWORD (0x00000001)'
  selection_value_url:
    TargetObject|endswith:
    - '\URL'
    - '\UserDefinedUrl'
  filter_main_office:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  condition: selection_main and 1 of selection_value_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential persistence mechanisms employed by attackers via the "Outlook Today" page within Microsoft Outlook. By manipulating registry values, such as "URL" and "UserDefinedUrl," an adversary can set custom pages that execute arbitrary code each time Outlook is launched. This threat scenario is particularly concerning as it allows for the execution of malicious content seamlessly integrated into a common productivity tool, making detection and response more challenging for defenders.

  The relevant MITRE ATT&CK tactics involved in this scenario include **Persistence** (TA0003) through techniques such as **Registry Run Keys / Startup Folder** (T1112). An attacker leveraging this method may aim to maintain access in an environment while evading detection efforts by blending their activity with user-initiated processes. The primary data source for detecting this family of attacks includes registry set logs, where modifications to Outlook-related registry keys can be observed and analyzed.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the registry logs for any modifications to `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\Today\` and look for unusual entries under "URL" and "UserDefinedUrl" keys that do not match expected values.

  - **Validate Office Executables:** Confirm that any processes triggering suspicious registry changes originate from legitimate Outlook executables, particularly focusing on `OfficeClickToRun.exe` to rule out workaround techniques.

  - **Check for Custom Page Content:** If persistent URLs are identified, investigate the destination sites linked in these registry values. Look for any signs of malicious content or abnormal behavior associated with the URLs set by the attacker.

  - **Correlate User Activity:** Cross-reference user activity logs and process creation events during the times when registry changes were made to track whether these modifications align with typical user behavior or indicate potential unauthorized access.

  ### Prioritization
  Given the potential for establishing sustained access to compromised environments via this technique, the alert has a high severity rating. The likelihood of exploitation through outlook persistence methods can significantly affect the organization’s overall security posture if left unaddressed.

  ### Blind Spots and Assumptions
  Detections are limited to the ability to capture registry modifications; therefore, any environment lacking comprehensive logging of registry activities may miss such persistence attempts. The logic assumes that legitimate user activity does not involve modification of critical Outlook registry keys, which may not hold true for all environments and use cases. Proper logging configuration for capturing registry set events is essential for this alert to function effectively.

