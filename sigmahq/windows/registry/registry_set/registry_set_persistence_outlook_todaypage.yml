logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains|all:
    - 'Software\Microsoft\Office\'
    - '\Outlook\Today\'
  selection_value_stamp:
    TargetObject|endswith: '\Stamp'
    Details: 'DWORD (0x00000001)'
  selection_value_url:
    TargetObject|endswith:
    - '\URL'
    - '\UserDefinedUrl'
  filter_main_office:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  condition: selection_main and 1 of selection_value_* and not 1 of 
    filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects registry modifications indicative of persistence mechanisms via the Outlook Today page. An attacker may leverage the ability to set a custom page for Outlook to execute unauthorized code, allowing for persistence on a compromised system. This behavior correlates with the MITRE ATT&CK techniques for Persistence (T1112) and Defense Evasion.

  The primary telemetry sources for this detection are Windows registry logs documenting changes made to Outlook settings, particularly any alterations to the `UserDefinedUrl` or `URL` keys. If malicious in nature, this could introduce remote command and control (C2) capabilities. It is crucial to understand that this detection does NOT confirm that the code executed is malicious; it only highlights the potential setup for persistence.

  ### Investigation Steps

  - **Review affected registry keys:** Inspect the registry for changes under `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\Today\`. Look for entries with `URL` or `UserDefinedUrl` indicating suspicious values, particularly if these URLs are unfamiliar or point to external domains.

  - **Check the process responsible for the change:** Verify the process that modified the registry using Security Event ID 4670 (permissions on an object were changed) or Sysmon Event ID 13 (registry modification). Confirm if it is associated with known Outlook components (e.g., `OfficeClickToRun.exe`).

  - **Identify recent Outlook activity:** Utilize Windows Event ID 1000 from Application logs to find recent starting events for Outlook. Compare timestamps to correlate with the registry modifications detected.

  - **Assess network connections associated with modified URLs:** Check for outbound connections to the URLs defined in the registry values using firewall logs or network monitoring solutions. Look for unusual domains or IPs that do not match expected patterns from legitimate users.

  - **Evaluate legitimate user settings:** Understand expected behavior by identifying the common settings and URLs used in your environment for Outlook Today. Document any known legitimate entries to distinguish them from potential malicious indicators.

  - **Review for associated alerts:** Look for companion detections or previous alerts related to unusual Outlook behavior or registry modifications. An example might include alerts for suspicious network traffic serving data related to the identified URLs.

  ### Prioritization

  This alert is considered high severity due to the potential for persistent access and command execution on targeted systems. The likelihood of an adversary using this method for malicious activities is increased by its established exploitation techniques within enterprise environments. Such modifications are actionable and commonly weaponized by threat actors.

  ### Blind Spots and Assumptions

  Detection limitations may arise due to the reliance on registry logging, which could be disabled or improperly configured in some environments. Legitimate user modifications to Outlook settings may trigger false positives. An important related detection to consider is monitoring for new scheduled tasks or services that could indicate further persistence mechanisms in conjunction with the registry changes.

