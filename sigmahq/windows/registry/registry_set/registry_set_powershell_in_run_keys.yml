logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Software\Microsoft\Windows\CurrentVersion\Run'         # Also covers "RunOnce" and "RunOnceEx"
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
    Details|contains:
    - 'powershell'
    - 'pwsh '
    - 'FromBase64String'
    - '.DownloadFile('
    - '.DownloadString('
    - ' -w hidden '
    - ' -w 1 '
    - '-windowstyle hidden'
    - '-window hidden'
    - ' -nop '
    - ' -encodedcommand '
    - '-ExecutionPolicy Bypass'
    - 'Invoke-Expression'
    - 'IEX ('
    - 'Invoke-Command'
    - 'ICM -'
    - 'Invoke-WebRequest'
    - 'IWR '
    - 'Invoke-RestMethod'
    - 'IRM '
    - ' -noni '
    - ' -noninteractive '
  condition: selection
falsepositives:
- Legitimate admin or third party scripts. Baseline according to your 
  environment
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the presence of PowerShell commands stored within common Windows registry run keys, which are often exploited by adversaries for persistence. An attacker may aim to establish long-term access or execute malicious scripts automatically upon system startup. Relevant MITRE ATT&CK tactics include Persistence (TA0003) and Privilege Escalation (TA0004), specifically under the technique for “Run Keys / Startup Folder” (T1547.001). Primary telemetry sources include Windows Registry logs, particularly tracking changes to keys such as `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` and its equivalents.

  If these commands are malicious, they may lead to unauthorized data access or control over the system. However, it is important to note that the detection of these entries does not confirm malicious intent on its own, as legitimate administrative or third-party scripts could also create similar entries.

  ### Investigation Steps

  - **Review Registry Modifications**: Check for recent changes to the following registry keys: `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run`, `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run`. Focus on entries containing "powershell" or related commands as specified in the rule.

  - **Identify Malicious Indicators**: Look for high-confidence indicators of compromise (IoCs) such as entries containing `-ExecutionPolicy Bypass`, `Invoke-Expression`, or `DownloadFile(`, as these are commonly associated with malicious PowerShell usage.

  - **Analyze Process Creation Events**: Review Security Event ID 4688 to correlate any newly created processes triggered by the suspicious registry entries. Focus on processes that are initiated by `powershell.exe` or `pwsh.exe`, especially with command-line arguments indicating evasion tactics (e.g., `-window hidden`).

  - **Establish Baseline for Legitimate Activity**: Benchmark typical user and administrative behavior in your environment to distinguish benign from malicious entries. Legitimate entries may include those used for scheduled maintenance scripts or administrative tools approved by your organization.

  - **Check for File System Changes**: Inspect for file creation or modification events related to PowerShell scripts in directories commonly used for script execution (e.g., `C:\Scripts`, `C:\Windows\Temp`). Use Sysmon Event ID 11 for file creation timestamps that coincide with registry modifications.

  - **Evaluate System Criticality**: Assess the role of the affected host within the organization’s infrastructure. If it is a critical system (e.g., domain controller or financial system), escalate appropriate findings for further investigation.

  ### Prioritization

  This alert is medium severity due to the potential for a malicious actor establishing persistence on a compromised system, for example, in an enterprise environment with critical assets. The likelihood of such techniques being exploited is relatively high, as they are commonly observed in various attacks, particularly ransomware incidents.

  ### Blind Spots and Assumptions

  There are limitations with this detection as legitimate administrative use of PowerShell may lead to false positives if not properly contextualized. Ensure that Windows Registry logs are enabled to ensure reliable detection of modifications. Additionally, legitimate applications or scheduled tasks may trigger similar registry entries, complicating the accuracy of alerts. A companion detection worth considering is monitoring for unusual PowerShell activity via Sysmon Event ID 1, which can provide further insight into nefarious command execution.

