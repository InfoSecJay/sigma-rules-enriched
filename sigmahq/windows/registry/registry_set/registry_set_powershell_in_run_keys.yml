note: |
  ### Technical Context

  This Sigma rule detects suspicious PowerShell commands or scripts written into Windows registry run keys, which are commonly exploited for persistence by malicious actors. The likely attacker objective is to establish a foothold on a system, enabling the execution of arbitrary code whenever the system starts or the user logs in, ensuring ongoing control. Relevant MITRE ATT&CK tactics and techniques include Persistence (T1547.001) and Privilege Escalation (due to potential misuse of elevated privileges for execution).

  The primary telemetry source is Windows registry change logs, specifically focused on the key paths that facilitate autostarting applications. The security impact can be significant; if a malicious payload is executed, it could lead to data theft, system compromise, or further lateral movement within the network. This detection does not confirm an active compromise on its own; legitimate PowerShell usage by administrators or third-party applications may also create similar registry entries.

  ### Investigation Steps

  - **Verify registry changes:** Review registry modifications under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run`, `HKLM\Software\Microsoft\Windows\CurrentVersion\Run`, and `HKLM\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run`. Look for entries involving "powershell" or associated commands (i.e., using Sysinternals Autoruns or PowerShell `Get-Item`).

  - **Correlate with execution activity:** Cross-reference with Security Event ID 4688 to find process creations that match the registry entries. Specifically, check for any new PowerShell processes initiated with `-ExecutionPolicy Bypass` or `-nop` flags.

  - **Identify legitimate behavior:** Establish a list of known good binaries and PowerShell scripts within the organization that may legitimately set these registry keys. Monitor their behaviors and dig into the Context for any discrepancies with observed data.

  - **Look for high-confidence malicious indicators:** Specifically search for usage of encoded PowerShell commands (e.g., `-encodedcommand` or `FromBase64String`) and script downloads indicated within the registry keys. This may be indicative of a standard attack pattern.

  - **Check for lateral movement connections:** If the system is critical (e.g., a server), inspect for outbound network connections made by PowerShell processes, such as those using `Invoke-WebRequest` or `Invoke-RestMethod`, for potential data exfiltration.

  - **Review related security event logs:** Look into Windows Event logs (specifically Event ID 4104 for PowerShell logging) to trace any executed scripts that correlate with the malicious PowerShell commands found in the registry entries for further contextual analysis.

  ### Prioritization

  This alert should be prioritized as medium severity. The affected systems may often house critical applications, and the likelihood of abuse for persistence is high given the prevalence of these techniques in attacker toolkits. The behavior is commonly weaponized for gaining persistence on compromised environments.

  ### Blind Spots and Assumptions

  This detection may have limitations in environments that utilize legitimate administrative scripts or tools that interact with registry run keys and PowerShell. Required log sources for reliable detection include active monitoring of Windows registry changes and comprehensive PowerShell logging configurations. Legitimate activities may include software management scripts or task automation by admins. A related detection might include monitoring for PowerShell script execution (`Event ID 4104`) and registry modifications in higher risk contexts for improved coverage.

