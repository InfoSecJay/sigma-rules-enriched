title: Suspicious PowerShell In Registry Run Keys
id: 8d85cf08-bf97-4260-ba49-986a2a65129c
status: test
description: Detects potential PowerShell commands or code within registry run keys
references:
- https://github.com/frack113/atomic-red-team/blob/a9051c38de8a5320b31c7039efcbd3b56cf2d65a/atomics/T1547.001/T1547.001.md#atomic-test-9---systembc-malware-as-a-service-registry
- https://www.trendmicro.com/en_us/research/22/j/lv-ransomware-exploits-proxyshell-in-attack.html
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: frack113, Florian Roth (Nextron Systems)
date: 2022-03-17
modified: 2025-07-18
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Software\Microsoft\Windows\CurrentVersion\Run'         # Also covers "RunOnce" and "RunOnceEx"
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
    Details|contains:
    - 'powershell'
    - 'pwsh '
    - 'FromBase64String'
    - '.DownloadFile('
    - '.DownloadString('
    - ' -w hidden '
    - ' -w 1 '
    - '-windowstyle hidden'
    - '-window hidden'
    - ' -nop '
    - ' -encodedcommand '
    - '-ExecutionPolicy Bypass'
    - 'Invoke-Expression'
    - 'IEX ('
    - 'Invoke-Command'
    - 'ICM -'
    - 'Invoke-WebRequest'
    - 'IWR '
    - 'Invoke-RestMethod'
    - 'IRM '
    - ' -noni '
    - ' -noninteractive '
  condition: selection
falsepositives:
- Legitimate admin or third party scripts. Baseline according to your environment
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially malicious PowerShell commands or scripts that are set to execute via Windows registry run keys. Attackers often utilize these registry entries to maintain persistence on compromised systems, ensuring their malicious code executes during startup or session initiation. By monitoring for uncommon PowerShell patterns in these keys, security teams can uncover efforts to execute harmful scripts or commands, typically associated with advanced persistent threats (APTs) and other malicious actors.

  The likely attacker objectives include maintaining access, elevating privileges, and executing additional payloads without user knowledge. The detection aligns with the MITRE ATT&CK techniques T1547.001 (Windows: Registry Run Keys / Startup Folder), which details methods for executing malicious code at system start-up or user login.

  Primary data sources for this detection include Windows registry change logs, specifically monitoring the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` and `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run` keys, as well as other related paths where persistence mechanisms can be established.

  ### Investigation Steps
  - **Review Registry Entries**: Begin by extracting and analyzing the contents of the specified registry keys. Focus on any PowerShell-related commands or suspicious strings, particularly those identified in the detection logic.

  - **Analyze Process Creation Events**: Investigate associated process creation logs within your EDR or logging solution. Look for instances where PowerShell is executed or other processes that spawn as a result of these registry entries.

  - **Check for Anomalous Network Activity**: Examine the network logs for any outbound connections initiated by PowerShell processes. Look for unusual IP addresses or domains that diverge from normal behavior.

  - **Assess the Context of Actions**: Determine if these registry modifications were made by known administrative actions or unauthorized processes. Validate against your baseline of legitimate administrative usage to identify potential false positives.

  ### Prioritization
  The alert's medium severity arises from the potential impact of discovered persistence mechanisms that could lead to significant breaches if left unaddressed. Given that attackers frequently leverage such techniques for maintaining access, prompt investigation is critical to mitigating risk.

  ### Blind Spots and Assumptions
  There are gaps in detection coverage for legitimate administrative scripts and tools that may use similar PowerShell command patterns, which could lead to false positives. The detection logic assumes that all PowerShell commands in these registry keys are malicious, without accounting for benign administrative use cases. Accurate detection requires that appropriate logging levels are configured for registry changes, and comprehensive visibility into PowerShell command execution across endpoints is maintained.

