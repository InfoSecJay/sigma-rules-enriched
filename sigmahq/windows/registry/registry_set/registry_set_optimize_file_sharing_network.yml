note: |
  ### Technical Context

  This rule detects changes to the "MaxMpxCt" registry value, which specifies the maximum number of outstanding network requests per client in the SMB protocol. Increasing this value can be indicative of an attacker’s intent to support higher traffic volumes, particularly during ransomware attacks, such as with the BlackCat group, who may modify this setting to facilitate data exfiltration or lateral movement.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1070) and specifically technique **Indicator Removal on Host** (ID: T1070.005). The primary telemetry sources include Windows Registry set operations, notably the registry key under service configuration for SMB. A change to this value can have a significant security impact as it may enable attackers to maintain unauthorized access and control over a host system. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative changes may also result in modifications to this key.

  ### Investigation Steps

  - **Verify the change event and time frame**: Review Windows Registry logs for Event ID 4657, which records changes to the registry, noting the value changed, user context, and timestamps of the event to assess whether it aligns with normal operational activity.

  - **Identify user context**: Investigate the user or process responsible for the change. Legitimate changes should typically be made by administrative accounts or system processes during known maintenance windows. Cross-reference with Event ID 4672 to identify if a special privilege session was involved.

  - **Check for related SMB traffic**: Analyze network traffic logs (such as NetFlow, pcap, or firewall logs) during the same time frame, focusing on requests that show an increased volume of SMB traffic from clients. Review for unusual connections or spikes in traffic volume.

  - **Examine for concurrent account activities**: Look for suspicious login activities or account behavior (Event ID 4624) around the same time as the registry change. Multiple failed or unusual logins may suggest the presence of a compromise.

  - **Analyze for known malicious indicators**: Search for additional indicators related to known ransomware operations, such as file encryption behaviors or attempts to disable security solutions. This can be corroborated using Sysmon logs (Event ID 11 for file creation) showing newly created encrypted files or processes that suggest malicious activity.

  ### Prioritization

  This alert should be classified as low severity in an enterprise context, primarily due to the systemic role of the MaxMpxCt setting in SMB operations. However, given its use in targeted attacks, especially ransomware incidents, analysts should consider the likelihood of abuse based on system criticality and ongoing active investigations relating to known threats.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative changes may lead to similar registry modifications, triggering false positives. Continuous logging of registry changes and other telemetry sources such as Sysmon for process activity are crucial for reliable detection. Additionally, scheduled maintenance or compliance activities could involve legitimate increases in MaxMpxCt. Companion detections, such as monitoring for file change events by ransomware (e.g., rapid file encryption processes), can enhance the accuracy and context of these alerts.

