note: |
  ### Technical Context

  This Sigma rule detects changes to the "MaxMpxCt" registry value, which governs the maximum number of outstanding network requests for SMB connections. Attackers, notably ransomware groups like BlackCat, may modify this value to increase their handling capacity for incoming connections, potentially facilitating lateral movement or data exfiltration. This behavior relates to the MITRE ATT&CK tactic for Defense Evasion (T1070.005) focusing on the modification of system configurations.

  The primary telemetry source for this detection is Windows Registry logs, specifically monitoring the registry path `\Services\LanmanServer\Parameters\MaxMpxCt`. If malicious, such changes can enable attackers to overwhelm systems with requests, leading to denial of service or improved data extraction capabilities. However, this detection does NOT confirm that malicious activity is actively occurring; it merely flags a configuration change.

  ---

  ### Investigation Steps

  - **Review Registry Changes**: Check the Windows Registry for recent modifications to the value `MaxMpxCt`. Use RegEdit or PowerShell (`Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'`) to retrieve the current value and modification timestamp.

  - **Identify Previous Values**: Compare the new value of `MaxMpxCt` against historical baselines derived from monitoring logs (e.g., using Sysmon Event ID 13 for registry value changes) to assess if the adjustment is anomalous relative to typical settings.

  - **Analyze SMB Connection Logs**: Examine SMB traffic to and from the affected system (Event ID 5140 — Network share object accessed) for unusual patterns, such as a spike in traffic or connections from unrecognized clients, indicating potential exploitation.

  - **Establish Baseline Behavior**: Document the normal operational value of `MaxMpxCt` for legitimate applications within the enterprise. In many cases, the default will be around 50 or 125 in various environments, with values higher than these requiring further inquiry.

  - **Correlate with Ransomware Indicators**: Look for other signs of potential ransomware activity on the system and network, such as unusual file creation patterns or processes invoking PowerShell commands (e.g., Event ID 4688 for process creation).

  - **Confirm Host Integrity**: Assess the criticality of the affected host using asset management tools. Investigate if the host is part of a sensitive operational environment that could indicate higher risk from unauthorized changes.

  ---

  ### Prioritization

  This alert should be considered low severity due to the nature of the registry change and the specific context of the affected system. However, given the historical use of this technique by ransomware actors, the likelihood of malicious intent increases, warranting investigation, particularly on critical systems.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers who revert or obfuscate changes to the registry following modification. It relies on accurate logging configurations for the Windows Registry and may miss changes if the registry is accessed by methods that do not generate logs. Legitimate administrative activity may trigger this alert during maintenance, requiring context around the administrative account’s action. Companion detections, such as monitoring SMB traffic patterns or looking for anomalous executable launches (Sysmon Event ID 1), would bolster the investigation’s reliability.

