logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Services\LanmanServer\Parameters\MaxMpxCt'
  condition: selection
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  This detection rule identifies changes made to the "MaxMpxCt" registry value, which specifies the maximum number of outstanding network requests a Windows server can handle per client during Server Message Block (SMB) connections. Threat actors, particularly those associated with ransomware variants like BlackCat, may modify this registry value to accommodate increased traffic demands during their operations, such as data exfiltration or lateral movement within compromised networks.

  The primary attacker objective in this scenario is to optimize the network disruption they can cause, potentially allowing for more payload delivery or data theft without raising immediate alarms from administrators. The modifications may indicate preparation for a ransomware attack, thus attracting attention from security operations teams.

  This rule correlates with the MITRE ATT&CK tactics of Defense Evasion, specifically technique **T1070.005: Indicator Removal on Host**. Evidence of such behavior typically arises from Windows registry modifications, particularly within the context of detecting unauthorized changes that could signal malicious intent.

  Primary data sources for this detection will be Windows registry set logs that capture the modifications made to registry keys, particularly those related to SMB service parameters.

  ### Investigation Steps
  - **Review Registry Logs**: Check the logs from the Windows registry to identify when and by whom the "MaxMpxCt" value was modified. Look for timestamps and user account details to assess the legitimacy of the change.
  - **Analyze SMB Traffic**: Examine related SMB traffic for increased volume or unusual patterns that may indicate attempted lateral movements or data exfiltration that align with the timing of the registry modifications.
  - **Check for Ransomware Indicators**: Conduct a thorough investigation of system processes and network connections active during the time of the registry change, looking for known indicators of ransomware activity, especially signatures associated with BlackCat.
  - **Correlate with Other Logs**: Look for other related security logs and alerts from EDR, firewall, and NDR solutions around the same timeframe to contextualize the change and identify any associated compromised accounts or systems.

  ### Prioritization
  Although the alert is classified as low severity, it warrants attention due to the potential risk of ransomware activities. Changes to the MaxMpxCt value can indicate preparation for larger scale attacks, elevating the need for investigation based on historical contexts of threat actors leveraging such configurations.

  ### Blind Spots and Assumptions
  This detection logic may not account for legitimate administrative changes made in the environment, leading to potential false positives. Additionally, if the necessary logging of registry changes is not enabled or properly configured, such alterations may go undetected. Specific configurations ensuring comprehensive logging and alerting for registry modifications are essential for the effectiveness of this alert.

