title: Sysmon Driver Altitude Change
id: 4916a35e-bfc4-47d0-8e25-a003d7067061
status: test
description: |
  Detects changes in Sysmon driver altitude value.
  If the Sysmon driver is configured to load at an altitude of another registered service, it will fail to load at boot.
references:
- https://posts.specterops.io/shhmon-silencing-sysmon-via-driver-unload-682b5be57650
- https://youtu.be/zSihR3lTf7g
author: B.Talebi
date: 2022-07-28
modified: 2024-03-25
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Services\'
    TargetObject|endswith: '\Instances\Sysmon Instance\Altitude'
  condition: selection
falsepositives:
- Legitimate driver altitude change to hide sysmon
level: high
note: |
  ### Technical Context
  This detection rule identifies changes made to the altitude value of Sysmon drivers. An alteration in the altitude can indicate attempts by attackers to modify how Sysmon – a critical monitoring tool for capturing detailed and potentially malicious actions on Windows systems – interacts with other services. Attackers may be manipulating the altitude setting to prevent Sysmon from loading at boot, thereby eliminating a key obstacle to their operations. This tactic can facilitate undetected persistence and evasion of endpoint monitoring, which is a common strategy for maintaining a foothold in a compromised environment.

  In terms of the MITRE ATT&CK framework, this rule addresses techniques related to *Defense Evasion*, particularly T1562.001: “Disable or Modify Tools.” By altering Sysmon's configuration, an attacker seeks to undermine the integrity of the monitoring solution and evade detection. Key telemetry sources for this detection include registry change logs, specifically focused on entries relating to service configurations in the Windows registry.

  ### Investigation Steps
  - **Review Registry Change Logs:** Check for modifications to registry entries under `\Services\` related to Sysmon instances, particularly changes to the `Altitude` value. This will help identify unauthorized changes contributing to Sysmon evasion.
  - **Cross-Reference with Service Load Events:** Confirm if the documented altitude changes align with legitimate service load events during system boot. Look for instances where Sysmon fails to load due to altitude conflicts.
  - **Analyze Sysmon and EDR Logs:** Investigate complementary logs from Sysmon and any endpoint detection tools for evidence of potentially malicious activity linked to the timeline of the altitude modification.
  - **Investigate User and System Activity:** Scrutinize the activities of users and system processes around the time of the altitude change to identify potentially suspicious behavior, such as privileged access by unauthorized accounts.

  ### Prioritization
  Given the critical role Sysmon plays in maintaining visibility over endpoint activities, any unauthorized changes to its configuration should be treated as high-severity alerts. This could indicate a proactive effort by an attacker to bypass detection mechanisms, thus posing a significant threat to the security posture of the enterprise.

  ### Blind Spots and Assumptions
  This detection rule may miss legitimate altitude changes from authorized administrators who modify Sysmon settings for operational purposes. Additionally, if the Sysmon service is not deployed or configured properly, this rule will not trigger, leading to potential blindness in detecting manipulations aimed at evading detection mechanisms. Organizations must ensure that all relevant process and service monitoring practices are in place, the Sysmon configuration is correctly applied, and that logging of registry changes and service events is enabled.

