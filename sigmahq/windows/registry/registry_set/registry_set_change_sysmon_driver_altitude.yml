  ---

  ### Technical Context

  This rule detects changes to the Sysmon driver altitude value in the Windows registry, which can indicate an attempt by an adversary to interfere with the Sysmon service to avoid detection. The likely objective of such behavior is to evade security monitoring by adjusting the altitude at which Sysmon loads, potentially allowing malicious drivers to load first and bypass detection mechanisms. This activity relates to the MITRE ATT&CK technique "Process Injection" (T1562.001) and "Defense Evasion" tactic.

  The primary telemetry sources include Windows Registry logs, specifically targeting `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\` where Sysmon driver altitude settings are located. If malicious, this action could significantly impair an organization’s ability to monitor system events and identify threats. It is important to note that this detection does NOT confirm malicious intent on its own; legitimate altitude changes can occur as part of system administration practices.

  ---

  ### Investigation Steps

  - **Check recent registry changes:** Review Windows Security Event ID 4657 for registry modifications around the Sysmon driver, focusing on the `TargetObject: '\Services\'` and confirming altitude changes to `Altitude` values.

  - **Identify legitimate changes:** Search for the expected range of Sysmon altitude values, typically between 1000–2000. Changes to these values outside this range, particularly to align with other critical or high-priority drivers, may indicate an attempt to evade Sysmon monitoring.

  - **Evaluate driver load order:** Inspect Sysmon’s configuration through Sysinternals' `Sysmon.exe -c` command output, confirming that the altitude is appropriately set and has not been altered maliciously, ideally aligning with predefined security baselines.

  - **Cross-reference event logs:** Review Windows Sysmon Event ID 13 (Driver Loaded) for typical driver load patterns, checking timestamps and comparing them with the timestamp of the detected altitude change. Any unusual loading patterns may indicate evasion tactics.

  - **Analyze related system activity:** Look for processes associated with the Sysmon driver change through Security Event ID 4688, particularly those exhibiting unusual behavior (e.g., high privilege escalation or non-standard execution paths).

  - **Examine the chain of events:** Check for related correlations in Security Event ID 4648 (Logon attempt) leading to the registry change to determine if the action correlates with user account compromise or administrative privileges misuse.

  ---

  ### Prioritization

  This alert is of high severity due to the critical nature of Sysmon in an SOC environment for monitoring system activities. The likelihood of malicious abuse is significant, especially since attackers often seek methods to evade detection. This behavior is known to be weaponized in advanced persistent threat (APT) scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of visibility into all registry changes if logging is not appropriately enabled. Adversaries may employ techniques such as legitimate tools or scripts to change driver altitudes, making detection challenging. Also, changes by system administrators adjusting configuration for valid reasons can trigger this alert. Related detections include Windows Event IDs 4663 (Access to an Object) to monitor access patterns to the registry related to sensitive driver configurations.

