logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Services\'
    TargetObject|endswith: '\Instances\Sysmon Instance\Altitude'
  condition: selection
falsepositives:
- Legitimate driver altitude change to hide sysmon
level: high
note: |
  ---

  ### Technical Context

  This rule detects changes in the altitude value of the Sysmon service, which may indicate an attempt to disable or manipulate Sysmon's logging capabilities. An attacker may alter the Sysmon altitude to ensure that a malicious payload or driver loads before Sysmon, which could prevent visibility into nefarious activities. This behavior aligns with the MITRE ATT&CK technique T1562.001 - "Impair Defenses: Disable or Modify Tools."

  The primary telemetry source for this detection is the Windows Registry events related to system services (`registry_set` log type). The security impact of a malicious altitude change is significant, as it may lead to reduced visibility for security monitoring tools and allow for persistent malicious activity. This detection does NOT confirm actual exploitation or compromise on its own; further investigation is required to ascertain the overall context and impact.

  ---

  ### Investigation Steps

  - **Query Sysmon Configuration: ** Use Sysmon logs (Event ID 1) to identify the current service configuration for Sysmon, including its loading altitude, to benchmark against any changes indicated by the alert.

  - **Review Registry Changes: ** Check Windows Registry logs (Event ID 4657 or event logs filtering for `registry_set`) for specific delta changes on the altitude setting (`\Services\Instances\Sysmon Instance\Altitude`) around the timestamp of the alert.

  - **Identify Malicious Indicators: ** Look for unusual driver names or previously unknown services that could be associated with unauthorized altitude manipulations by cross-referencing the loaded drivers (Use Sysinternals "drivers" command or equivalent).

  - **Benchmark Legitimate Changes: ** Compare the altitude change against legitimate administrative activities, such as scheduled maintenance or changes made by authorized security personnel. Document known legitimate changes to contextualize alerts.

  - **Check for Evasion Techniques: ** Investigate common techniques used to manipulate service load order (e.g., event logs showing abnormal load orders across services) and ensure that standard detection mechanisms are in place and functioning.

  ---

  ### Prioritization

  This alert should be prioritized high due to the sensitivity of Sysmon as a critical defense tool on the endpoint. The likelihood of malicious behavior is substantial as attackers often target such tools to evade detection. The practice of manipulating service altitudes is well-known in advanced persistent threat (APT) strategies.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the need for comprehensive Sysmon logging setup; thus, if Sysmon is improperly configured or disabled, visibility is reduced. Legitimate administrative changes, especially during system updates or maintenance, may trigger this alert, leading to false positives. A related detection rule monitoring changes to service startup types could complement visibility into potential defenses being planned or executed against Sysmon.

