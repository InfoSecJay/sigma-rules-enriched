title: Sysmon Driver Altitude Change
id: 4916a35e-bfc4-47d0-8e25-a003d7067061
status: test
description: |
  Detects changes in Sysmon driver altitude value.
  If the Sysmon driver is configured to load at an altitude of another registered service, it will fail to load at boot.
references:
- https://posts.specterops.io/shhmon-silencing-sysmon-via-driver-unload-682b5be57650
- https://youtu.be/zSihR3lTf7g
author: B.Talebi
date: 2022-07-28
modified: 2024-03-25
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Services\'
    TargetObject|endswith: '\Instances\Sysmon Instance\Altitude'
  condition: selection
falsepositives:
- Legitimate driver altitude change to hide sysmon
level: high
note: |
  ### Technical Context

  This rule detects changes to the altitude value of the Sysmon driver, which is crucial for its loading sequence during boot. An attacker may alter this setting to prevent Sysmon from properly initializing, facilitating undetected malicious activity. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), specifically technique "Driver Manipulation" (T1685). The primary telemetry source is Windows Registry logs, specifically targeting the alteration events related to the path `\Services\` and the specific Sysmon instance altitude settings. If malicious, this behavior can severely impact an organization's visibility into system activities, hindering incident response efforts. However, this detection rule does NOT confirm that a malicious actor is responsible for the change; legitimate software or system administrators might also adjust driver altitudes.

  ### Investigation Steps

  - **Check Registry Change Logs:**
    Investigate registry change events (Event ID 4657) associated with `\Services\Instances\Sysmon Instance\Altitude`. Verify if the altitude was altered by unauthorized users or recently installed applications.

  - **Correlate with User Activity:**
    Review Security Event ID 4624 to determine the account that made the registry change. Check for anomalous logins or unusual activities around the time of the registry modification.

  - **Analyze Sysmon Configuration:**
    Validate the current Sysmon configuration (using Sysmon Event ID 1) to ensure the driver is set at the expected altitude. Compare against baseline configurations to spot unauthorized changes.

  - **Identify Legitimate Activities:**
    Assess recent changes in other system services that could justify the altitude adjustment (e.g., driver updates or system configuration changes). Common service loading behaviors should align with expected operational practices.

  - **Review for Known Exploits:**
    Search for high-confidence malicious indicators linked to known exploits or malware that target Sysmon or similar drivers. This includes reviewing threat intelligence feeds for references to T1685 activity.

  - **Assess Impact on Critical Assets:**
    Identify the host roles of affected systems, particularly if they are critical servers or endpoints that rely heavily on Sysmon for logging. An elevated risk may warrant immediate remediation efforts.

  ### Prioritization

  This alert is high severity as it directly impacts the integrity of logging and monitoring capabilities. The likelihood of malicious abuse is significant, given that altering Sysmon's altitude is a recognized evasion tactic commonly seen in advanced threat scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited if there are gaps in registry auditing configurations, potentially allowing legitimate changes to go unnoticed. System maintenance tasks may unintentionally trigger this alert, as legitimate administrative actions can involve modifications to driver configurations. A companion detection to strengthen coverage could include monitoring for unauthorized driver installations or removals, which often occur alongside altitude modifications.

