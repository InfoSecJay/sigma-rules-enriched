title: Potential Credential Dumping Attempt Using New NetworkProvider - REG
id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
related:
- id: baef1ec6-2ca9-47a3-97cc-4cf2bda10b77
  type: similar
status: test
description: Detects when an attacker tries to add a new network provider in order
  to dump clear text credentials, similar to how the NPPSpy tool does it
references:
- https://learn.microsoft.com/en-us/troubleshoot/windows-client/setup-upgrade-and-drivers/network-provider-settings-removed-in-place-upgrade
- https://github.com/gtworek/PSBits/tree/master/PasswordStealing/NPPSpy
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-23
modified: 2023-08-17
tags:
- attack.credential-access
- attack.t1003
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\System\CurrentControlSet\Services\'
    - '\NetworkProvider'
  filter:
    TargetObject|contains:
    - '\System\CurrentControlSet\Services\WebClient\NetworkProvider'
    - '\System\CurrentControlSet\Services\LanmanWorkstation\NetworkProvider'
    - '\System\CurrentControlSet\Services\RDPNP\NetworkProvider'
            # - '\System\CurrentControlSet\Services\P9NP\NetworkProvider' # Related to WSL remove the comment if you use WSL in your ENV
  filter_valid_procs:
    Image: C:\Windows\System32\poqexec.exe
  condition: selection and not 1 of filter*
falsepositives:
- Other legitimate network providers used and not filtred in this rule
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts by an attacker to add a new network provider as a means to dump clear-text credentials. This behavior mimics the functionality of the NPPSpy tool, which is known for credential harvesting. Attackers may attempt to utilize new network providers to intercept credentials during the authentication process, thereby gaining unauthorized access to sensitive accounts and resources.

  The potential threat scenario involves an advanced persistent threat (APT) or other malicious actors utilizing credential dumping techniques to obtain user credentials without raising red flags. The attacker’s objective is often to escalate privileges for lateral movement within the network or execute further attacks on targeted systems.

  Relevant MITRE ATT&CK tactics include:
  - **Credential Access** (TA0006)
    - **Credential Dumping** (T1003)

  Primary data sources for detecting these actions include registry change logs, specifically those capturing modifications to network provider settings in Windows. Additionally, visibility into process creation events that involve the `poqexec.exe` executable can aid in corroborating the detection, as this process is flagged by the rule.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent changes in the Windows registry under the key `\System\CurrentControlSet\Services\NetworkProvider` for any unauthorized additions or modifications.
  - **Analyze Process Creation Logs:** Investigate process creation logs for instances of `poqexec.exe`. Check if this executable was invoked without legitimate context.
  - **Correlate with User Activities:** Cross-reference the timings of the registry changes with user activities to determine if the changes align with legitimate operational patterns or if they denote potential malicious intent.
  - **Investigate Network Provider Activity:** Explore related service settings for `WebClient`, `LanmanWorkstation`, and `RDPNP`, especially for unusual configurations or anomalies following any registry changes.

  ### Prioritization
  The alert is deemed medium severity due to the potential for credential exposure, which could lead to significant compromise within the network. While not every entry into the network provider registry indicates malicious activity, the nature of the behaviors this rule detects suggests a targeted effort to expose sensitive information.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is the possibility of legitimate software modifying network providers, which might lead to false positives. The detection logic assumes that non-filtered network provider modifications are potentially harmful, which may not hold true in every case. Additionally, for the alert to function as intended, the appropriate logging configurations must be in place to capture registry changes and process creation events effectively. If these configurations are missing or incomplete, crucial evidence may be overlooked.

