logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\System\CurrentControlSet\Services\'
    - '\NetworkProvider'
  filter:
    TargetObject|contains:
    - '\System\CurrentControlSet\Services\WebClient\NetworkProvider'
    - '\System\CurrentControlSet\Services\LanmanWorkstation\NetworkProvider'
    - '\System\CurrentControlSet\Services\RDPNP\NetworkProvider'
            # - '\System\CurrentControlSet\Services\P9NP\NetworkProvider' # Related to WSL remove the comment if you use WSL in your ENV
  filter_valid_procs:
    Image: C:\Windows\System32\poqexec.exe
  condition: selection and not 1 of filter*
falsepositives:
- Other legitimate network providers used and not filtred in this rule
level: medium
note: |
  ---

  ### Technical Context

  This rule detects attempts by an attacker to register a new network provider in the Windows Registry, which is often a precursor to credential dumping attacks, such as those executed by tools like NPPSpy. The likely objective of this behavior is to capture clear text credentials during network operations. This activity maps to the MITRE ATT&CK framework under the tactic "Credential Access" (TA0006) and technique "Credential Dumping" (T1003). The primary telemetry source is Windows Registry changes, specifically looking for modifications under `\System\CurrentControlSet\Services\NetworkProvider`. If successful, this malicious behavior could lead to unauthorized access to sensitive credentials, increasing the risk of further network compromise. However, this detection does NOT confirm that credential dumping has occurred; it merely highlights a suspicious modification in the Registry.

  ---

  ### Investigation Steps

  - **Review Registry Changes:** Examine Registry Event IDs related to the `TargetObject` path for changes in `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NetworkProvider`. Look for any user context changes (Event ID 4657) indicating inappropriate alterations.

  - **Correlate with Process Execution:** Check for execution of known malicious tools like `poqexec.exe` (Event ID 4688). Look for parent processes that indicate suspicious command-line activity, especially from non-standard user accounts.

  - **Evaluate Impacted Services:** Determine if the changes affect critical services like `WebClient`, `LanmanWorkstation`, or `RDPNP`. Consider asset criticality and dependencies on these services when assessing the impact.

  - **Identify Legitimate Configurations:** Validate if the modified network providers are operationally necessary (e.g., enterprise policies using specific providers). Document any legitimate configurations that align with business needs.

  - **Highlight Malicious Indicators:** Focus on the registration of new network providers not typically used in your environment. Example artifacts include unusual `TargetObject` paths or values and logs showing multiple rapid modifications (indicative of scripting behavior).

  - **Cross-reference Companion Alerts:** Check for related alerts on credential dumping from other detection mechanisms, such as those targeting LSASS memory dumps or unauthorized access logs for high-value resources.

  ---

  ### Prioritization

  This alert should be prioritized as medium severity due to the potential for significant security impact if successful. While registering a new network provider is not inherently malicious, this behavior is commonly exploited in credential dumping attacks, warranting immediate investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate registry modifications for network provider configurations, potentially leading to false positives. Accurate logging sources must be configured, including Windows Security Event logs and appropriate registry monitoring. Furthermore, standard operational changes or application updates could trigger the alert and should be considered during the investigation. A related detection for monitoring LSASS process access (T1003.001) could strengthen coverage against credential dumping attempts.

