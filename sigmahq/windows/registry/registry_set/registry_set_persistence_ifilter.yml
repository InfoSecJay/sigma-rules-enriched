    - 'C:\Program Files\'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
- Legitimate registration of IFilters by the OS or software
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the registration of new IFilters, which are components used by Windows Search to index the content of files with various extensions. Attackers may register IFilters to maintain persistence, possibly establishing a method for retrieving and exfiltrating sensitive information without raising suspicion. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and specifically the technique of IFilter Persistence (T1547.002). The primary telemetry source is Windows Registry logs related to registry key modifications, particularly entries under `SOFTWARE\Classes\.`, `PersistentHandler`, and `CLSID`. If malicious, this could lead to data leakage, unauthorized access to information, and long-term system compromise. Importantly, this detection alone does not confirm malicious activity; legitimate software updates or installations may also register new IFilters.

  ### Investigation Steps

  - **Review recent registry changes:** Check Windows Registry Event ID 4657 for modifications to registry keys concerning IFilters, particularly under `SOFTWARE\Classes` and `PersistentHandler`. Look for abnormal or unexpected changes not associated with known software installations.

  - **Identify suspicious CLSIDs:** Examine modifications to registry keys containing CLISDs related to IFilters. Focus specifically on entries that do not correspond to legitimate or known software handlers (e.g., handlers not documented by Microsoft). Compare against trusted sources, ensuring they match expected software profiles.

  - **Validate known benign entries:** Authenticate legitimate IFilters by cross-referencing detected CLSIDs with trusted documentation. For instance, entries like `1AA9BF05-9A97-48c1-BA28-D9DCE795E93C` (PDF Persistent Handler) and `88B4C82D-8D5D-47C9-B041-87A0D2D5DE7A` should be verified against predefined security protocols.

  - **Assess asset criticality:** Determine if the affected host is critical for operations (e.g., domain controllers or databases). Prioritize immediate investigation on assets with higher criticality to minimize potential impacts on business functions.

  - **Investigate user behavior during registration:** Analyze user activity logs, including Event ID 4624 (logon events), to identify the user account responsible for the registry changes. Compare against normal usage patterns to detect anomalies or unauthorized access attempts.

  ### Prioritization

  Given its potential to establish underlying persistence mechanisms on critical systems, this alert warrants a medium severity rating. The likelihood of exploitation is notable since IFilters can facilitate stealthy data handling. Additionally, while their genuine registration is possible, the risk of malicious exploitation makes this behavior worthy of prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be evaded using legitimate-looking IFilters, as attackers can manipulate known entries or use benign applications to disguise malicious activity. Moreover, proper logging configuration, including registry auditing, is necessary to ensure reliable detection. Legitimate IFilter registrations typically arise during software updates from known vendors. For broader coverage, correlate this detection with alerts for unauthorized changes to Startup entries or Task Scheduler to strengthen detection capabilities.

