  ### Technical Context

  This Sigma rule detects attempts to enable the Outlook security setting "EnableUnsafeClientMailRules", which permits Outlook to run external applications or execute potentially dangerous macros. The likely objective of an attacker is to gain persistence or execute unauthorized actions by modifying user settings, which could facilitate malicious activities such as phishing or data exfiltration.

  This behavior aligns with the MITRE ATT&CK framework under the tactic of Persistence (TA0003) and the technique of Enable Unsafe Client Mail Rules (T1112). The primary telemetry sources include Windows Registry logs, specifically tracking modifications to the registry key related to Outlook security settings. If left unchecked, this change could significantly compromise the security posture of the enterprise, enabling further exploitation or unauthorized access to sensitive information.

  It is important to note that this detection does not confirm malicious intent on its own; legitimate administrative changes or user actions may also lead to this registry modification.

  ### Investigation Steps

  - **Identify the registry modification:** Review Windows Registry logs for changes to `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Outlook\Security\EnableUnsafeClientMailRules` (Event ID 4657) and verify the value is set to `1` (DWORD).

  - **Check recent user activities:** Investigate the user account associated with this change, noting recent logins or actions that may indicate potential malicious behavior, such as unusual cmdlets in Exchange or suspicious access patterns in user activity logs.

  - **Assess legitimate behavior:** Determine if the change aligns with expected IT operations, which might include updates or configuration scripts run by authorized personnel. Typical values for secure configurations should ensure that `EnableUnsafeClientMailRules` is `0` (DWORD).

  - **Correlate with other telemetry:** Look for concurrent suspicious activities in Outlook or Exchange logs (e.g., unusual macro execution attempts, unauthorized rule creation) to identify potential phishing or malicious campaigns using tools like Microsoft Defender for Endpoint.

  - **Verify user agent data:** Check for application access logs documenting Outlook client usage and note if there are any unusual IP addresses or timestamps associated with the activity, suggesting potential compromise.

  - **Evaluate high-confidence malicious indicators:** Identify if the change is linked to known compromised accounts or devices, and check for any signatures from security software alerts correlating to the unusual behavior associated with enabling unsafe mail rules.

  ### Prioritization

  This alert should be treated with high severity due to the potential for severe impacts on system security and the likelihood of malicious abuse in environments where Outlook is prevalent. The ability to enable unsafe mail rules is commonly weaponized by attackers seeking to escalate privileges or perform illicit operations within a network.

  ### Blind Spots and Assumptions

  Detection may be limited by insufficient logging configurations or lack of monitoring for registry changes. Compromised administrative accounts might legitimately change this setting, leading to false positives. Additionally, benign administrative scripts could trigger the alert. Companion detections that strengthen coverage include monitoring for macro execution in Outlook (for example, tracking through Office Application logs or monitoring for scripts leveraging Outlook macros).

