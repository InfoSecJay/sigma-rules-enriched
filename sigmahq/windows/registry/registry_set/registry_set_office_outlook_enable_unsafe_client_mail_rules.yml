note: |
  ### Technical Context

  This rule detects changes to the Windows Registry setting for Microsoft Outlook that enables the "EnableUnsafeClientMailRules" option. This option allows Outlook to execute macros or run applications at the user's direction, which can be exploited by attackers to execute unauthorized scripts or malware. The likely attacker objective is to establish persistence or control over the Outlook client to perpetrate phishing attacks or to facilitate data exfiltration.

  This detection relates to the MITRE ATT&CK technique "User Execution" (T1203) and "Registry Run Keys / Start Folder" (T1112). The primary telemetry source is the Windows Registry, specifically monitoring keys related to Outlook Security settings, particularly the value of `EnableUnsafeClientMailRules`. The security impact of a malicious configuration is significant as it opens pathways for attackers to abuse user trust and execute potentially harmful actions without direct user intervention. Notably, this detection does NOT confirm malicious intent or activity without additional contextual information.

  ### Investigation Steps

  - **Check for recent registry modifications:** Review Security/Event ID 4657 that may indicate changes made to `HKCU\Software\Microsoft\Office\<version>\Outlook\Security\EnableUnsafeClientMailRules`. Note any changes that coincide with the alert.

  - **Identify user activity preceding the registry change:** Investigate Security/Event ID 4624 logs for user logins and any unusual login patterns (e.g., after hours) that may indicate an account compromise.

  - **Review Outlook Client configuration:** Validate if the affected Outlook client actively uses `EnableUnsafeClientMailRules` by examining Group Policy settings (use `gpresult` command). If legitimate, the setting might be managed by an administrator for business use.

  - **Look for associated macro execution:** Check Security/Event ID 4688 for process creation indicating Outlook running applications or macros following the registry modification. Evidence of a process like `powershell.exe` or `cmd.exe` executed from Outlook can be a strong malicious indicator.

  - **Correlate with other detection sources:** Be aware of companion alerts, like the one identified by ID `c3cefdf4-6703-4e1c-bad8-bf422fc5015a`, to verify if there are related policy changes or behaviors indicating broader attack patterns within the organization.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical enterprise communication infrastructures and the likelihood of malicious abuse. The ability to execute arbitrary commands through Outlook is commonly weaponized in phishing and targeted attacks.

  ### Blind Spots and Assumptions

  The detection may miss legitimate activity if an administrator intentionally enables the setting for business purposes. Some evasion techniques may include disabling auditing or modifying the registry through scripts that do not trigger logging. Ensure that Registry Auditing is configured to capture access to this key accurately. A related detection to strengthen coverage could include monitoring endpoint behavior for suspicious macro execution across Outlook environments.

