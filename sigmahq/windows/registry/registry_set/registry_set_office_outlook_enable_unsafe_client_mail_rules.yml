note: |
  ### Technical Context
  This rule detects attempts by an attacker to enable the Outlook security setting "EnableUnsafeClientMailRules" through registry modification. This setting allows Outlook to execute macros or other applications automatically, which can be exploited to establish persistence or facilitate other malicious behaviors. The common use case for this configuration change involves establishing macro-enabled malware, allowing unauthorized actions—potentially leading to data exfiltration, credential harvesting, or lateral movement within the network.

  The relevant MITRE ATT&CK techniques associated with this detection are **Persistence (T1112)**, which describes how attackers install items that will execute upon startup or during user interaction, and **Defense Evasion (T1112)**, where attackers might modify registry settings to circumvent security controls.

  Primary data sources for effective detection include Windows registry modification logs, as they will provide insights into any unauthorized changes to the Outlook settings, as well as process creation events that may reveal unusual activity surrounding Outlook or its execution of macros.

  ### Investigation Steps
  - **Review Registry Logs**: Examine registry set event logs for changes to the `\Outlook\Security\EnableUnsafeClientMailRules` setting, focusing on the `DWORD (0x00000001)` value being set.
  - **Check Process Creation Events**: Analyze process creation events around the time of the registry modification to identify any abnormal Outlook executions or interactions with macro-related processes.
  - **Analyze User Activity Logs**: Investigate user activity logs for any suspicious Outlook usage patterns, such as unusual email forwarding or responses that coincide with the timing of the registry change.
  - **Scrutinize Network Traffic**: Monitor network connections made by Outlook to detect any outbound communications that align with suspicious behavior, especially following the registry change.

  ### Prioritization
  The severity of this alert is high due to the potential for enabling malicious macros, which can lead to further compromise of user credentials and unauthorized access to sensitive data. Enabling unsafe mail rules is a significant indicator of potential compromise that warrants immediate investigation.

  ### Blind Spots and Assumptions
  This detection logic assumes that registry changes are logged and accessible. Gaps in detection coverage may arise if logging is not properly configured on systems, or if other methods for modifying Outlook settings are employed that do not involve registry changes. Additionally, false positives may occur if legitimate administrative tasks inadvertently modify these settings. Therefore, proper logging and monitoring configurations must be ensured to enable effective detection.

