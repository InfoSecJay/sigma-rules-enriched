title: Office Autorun Keys Modification
id: baecf8fb-edbf-429f-9ade-31fc3f22b970
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: |
  Detects modification of autostart extensibility point (ASEP) in registry. Adversaries may modify these keys to execute malicious code when Office files are opened.
  There are various legitimate add-ins that also use these keys and this filter list might not be exhaustive.
  Thus, it is recommended to review and tune filters for your environment to reduce false positives before deploying to production.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur 
  Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2026-08-28
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_office_root:
    TargetObject|contains:
    - '\Software\Wow6432Node\Microsoft\Office'
    - '\Software\Microsoft\Office'
  selection_office_details:
    TargetObject|contains:
    - '\Word\Addins'
    - '\PowerPoint\Addins'
    - '\Outlook\Addins'
    - '\Onenote\Addins'
    - '\Excel\Addins'
    - '\Access\Addins'
    - 'test\Special\Perf'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_known_addins:
    Image|startswith:
    - 'C:\Program Files\Microsoft Office\'
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\PROGRA~2\MICROS~2\Office'
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    - 'C:\Windows\SysWOW64\regsvr32.exe'
    TargetObject|contains:
            # Remove any unused addins in your environment from the filter
            # Known addins for excel
    - '\Excel\Addins\AdHocReportingExcelClientLib.AdHocReportingExcelClientAddIn.1\'
    - '\Excel\Addins\ExcelPlugInShell.PowerMapConnect\'
    - '\Excel\Addins\NativeShim\'
    - '\Excel\Addins\NativeShim.InquireConnector.1\'
    - '\Excel\Addins\PowerPivotExcelClientAddIn.NativeEntry.1\'
            # Known addins for outlook
    - '\Outlook\AddIns\AccessAddin.DC\'
    - '\Outlook\AddIns\ColleagueImport.ColleagueImportAddin\'
    - '\Outlook\AddIns\EvernoteCC.EvernoteContactConnector\'
    - '\Outlook\AddIns\EvernoteOLRD.Connect\'
            # - '\Outlook\Addins\GrammarlyAddIn.Connect' # Uncomment if you use Grammarly
    - '\Outlook\Addins\OneNote.OutlookAddin'
    - '\Outlook\Addins\DriveFSExtensionLib.Connect\'         # An Outlook Add-in to talk with Google Drive
    - '\Outlook\Addins\GoogleAppsSync.Connect\'         # Google Apps Sync for Microsoft Outlook
    - '\Outlook\Addins\Microsoft.VbaAddinForOutlook.1\'
    - '\Outlook\Addins\OcOffice.OcForms\'
    - '\Outlook\Addins\OscAddin.Connect\'
    - '\Outlook\Addins\OutlookChangeNotifier.Connect\'
    - '\Outlook\Addins\UCAddin.LyncAddin.1'
    - '\Outlook\Addins\UCAddin.UCAddin.1'
    - '\Outlook\Addins\UmOutlookAddin.FormRegionAddin\'
    - 'AddinTakeNotesService\FriendlyName'
  filter_main_officeclicktorun:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_vsto:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\VSTO\'
    - 'C:\Program Files (x86)\Microsoft Shared\VSTO\'
    Image|endswith: '\VSTOInstaller.exe'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files\AVG\Antivirus\x86\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Antivirus.AsOutExt\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files\Avast Software\Avast\x86\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Avast.AsOutExt\'
    # These filters are not exhaustive, filter can be expanded based on environment
  condition: all of selection_office_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software or add-in installations and administrative configurations
- Automatic registry modifications during legitimate software installations
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized modifications to autostart extensibility points (ASEP) within Microsoft Office related registry keys. Attackers may exploit these keys to execute malicious payloads upon opening Office documents, facilitating persistence within the environment. The likely attacker objective is to enable malware execution without user knowledge when a user interacts with Office applications.

  The relevant MITRE ATT&CK technique for this behavior is "Create or Modify System Process: Windows Service" (T1547.001). The primary telemetry source is Windows Registry logs, specifically focusing on modifications within the registry paths related to Office add-ins. If the observed modification is malicious, it can lead to unauthorized access to sensitive data, lateral movement within the network, or further exploitation of the system.

  This detection does NOT confirm that malicious activity has occurred on its own; it only indicates that registry modifications have taken place, warranting further investigation to establish intent and context.

  ### Investigation Steps

  - **Check Registry Modifications**: Review Windows Registry changes recorded using Event ID 4657 for modifications to `HKEY_CURRENT_USER\Software\Microsoft\Office` and `HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\Office`. Look for unexpected keys or entries that differ from the expected add-ins in your environment.

  - **Validate Add-in Legitimacy**: Verify whether the modified add-in paths (e.g., `\Word\Addins`, `\Outlook\Addins`) contain known or expected legitimate add-ins, as outlined in the Sigma rule. If the path does not match known legitimate add-ins, flag as suspicious.

  - **Cross-check with Process Creation Events**: Examine Sysmon Event ID 1 for process creation events linked to the registry modification. Identify if any associated processes such as `OfficeClickToRun.exe` or `VSTOInstaller.exe` initiated unexpectedly post-registry changes.

  - **Identify Malicious Indicators**: Look for the image paths used in the modifications, specifically those not associated with legitimate Microsoft Office components. Any registry modifications resulting in the execution of processes from `C:\Program Files\Common Files\Microsoft Shared\ClickToRun\`, or unexpected executables can indicate malicious behavior.

  - **Analyze User Context**: Investigate the user context associated with the registry changes. Rapid or unusual modifications by low-privilege users or during off-hours may indicate malicious intent. Validate user roles against the changes made.

  - **Review Known False Positives**: Be aware of legitimate sources of registry modification such as automated software updates or legitimate Office add-ins installation that could trigger the alert. Document these findings to reduce the potential for future false positives.

  ### Prioritization

  The alert severity is medium due to the potential impact of modifications to Office add-ins, which can enable malware execution. The likelihood of abuse is significant since attackers often leverage Office applications for delivery of payloads, making this behavior a common vector for attacks. Regular scrutiny of these alerts is essential given the frequent weaponization of similar techniques.

  ### Blind Spots and Assumptions

  Detection limitations include potential false positives generated by legitimate software installations or administrative actions that may alter registry keys. Accurate detection requires consistent logging and monitoring of Windows Registry changes, which necessitates proper configuration within the environment. Additionally, legitimate dynamics such as third-party add-in management may inadvertently trigger alerts. A companion detection rule monitoring for unexpected outbound network connections initiated by Office applications can enhance overall coverage and context.

