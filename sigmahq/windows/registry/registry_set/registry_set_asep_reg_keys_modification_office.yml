title: Office Autorun Keys Modification
id: baecf8fb-edbf-429f-9ade-31fc3f22b970
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: Detects modification of autostart extensibility point (ASEP) in 
  registry.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur 
  Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2025-10-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_office_root:
    TargetObject|contains:
    - '\Software\Wow6432Node\Microsoft\Office'
    - '\Software\Microsoft\Office'
  selection_office_details:
    TargetObject|contains:
    - '\Word\Addins'
    - '\PowerPoint\Addins'
    - '\Outlook\Addins'
    - '\Onenote\Addins'
    - '\Excel\Addins'
    - '\Access\Addins'
    - 'test\Special\Perf'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_known_addins:
    Image|startswith:
    - 'C:\Program Files\Microsoft Office\'
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    TargetObject|contains:
            # Remove any unused addins in your environment from the filter
            # Known addins for excel
    - '\Excel\Addins\AdHocReportingExcelClientLib.AdHocReportingExcelClientAddIn.1\'
    - '\Excel\Addins\ExcelPlugInShell.PowerMapConnect\'
    - '\Excel\Addins\NativeShim\'
    - '\Excel\Addins\NativeShim.InquireConnector.1\'
    - '\Excel\Addins\PowerPivotExcelClientAddIn.NativeEntry.1\'
            # Known addins for outlook
    - '\Outlook\AddIns\AccessAddin.DC\'
    - '\Outlook\AddIns\ColleagueImport.ColleagueImportAddin\'
    - '\Outlook\AddIns\EvernoteCC.EvernoteContactConnector\'
    - '\Outlook\AddIns\EvernoteOLRD.Connect\'
            # - '\Outlook\Addins\GrammarlyAddIn.Connect' # Uncomment if you use Grammarly
    - '\Outlook\Addins\Microsoft.VbaAddinForOutlook.1\'
    - '\Outlook\Addins\OcOffice.OcForms\'
    - '\Outlook\Addins\\OneNote.OutlookAddin'
    - '\Outlook\Addins\OscAddin.Connect\'
    - '\Outlook\Addins\OutlookChangeNotifier.Connect\'
    - '\Outlook\Addins\UCAddin.LyncAddin.1'
    - '\Outlook\Addins\UCAddin.UCAddin.1'
    - '\Outlook\Addins\UmOutlookAddin.FormRegionAddin\'
    - 'AddinTakeNotesService\FriendlyName'
  filter_main_officeclicktorun:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files\AVG\Antivirus\x86\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Antivirus.AsOutExt\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files\Avast Software\Avast\x86\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Avast.AsOutExt\'
  condition: all of selection_office_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to autostart extensibility points (ASEPs) in the Windows registry specifically for Microsoft Office applications. Such modifications may indicate an attacker’s attempt to maintain persistence by establishing or altering Office add-ins to execute malicious code when an Office application launches. This behavior aligns with the MITRE ATT&CK techniques for persistence, particularly T1547.001 (Registry Run Keys / Startup Folder).

  The primary telemetry sources are Windows registry logs, focusing on the registry paths associated with Office add-ins. If malicious, the impact can be significant as these alterations may allow for code execution upon opening a legitimate Office document, facilitating further exploitation or data exfiltration. However, this detection alone does not confirm the malicious intent behind the changes; legitimate software installations or administrator actions can also trigger similar modifications.

  ### Investigation Steps

  - **Check registry modification timestamp:** Review the Event ID 4657 (Registry value modified) to identify the timestamp of the change. Compare it with user login times to assess if it aligns with legitimate user activity or if it may be indicative of a compromised system.

  - **Identify the altering user or process:** Look into Event ID 4688 (New Process Created) to determine which process initiated the registry modification. Focus on processes not typically associated with legitimate Office automation. High-risk indicators would include unfamiliar executables or scripts that initiate registry changes.

  - **Examine the modified keys:** Investigate the specific registry keys altered under `HKEY_CURRENT_USER\Software\Microsoft\Office\` or `HKEY_LOCAL_MACHINE\Software\Microsoft\Office\`. Look for unusual or unfamiliar add-ins that are not part of standard installations.

  - **Find legitimate add-ins:** Query known good add-ins present in the registry keys compared to documented companies' implementations within the environment. For example, entries such as `\Excel\Addins\ExcelPlugInShell.PowerMapConnect\` are legitimate, while non-standard references might indicate potential threats.

  - **Review relevant application logs:** Look into application event logs specific to Office applications (like `Microsoft Office Excel` or `Microsoft Office Word`) for any unusual error messages or warnings related to add-in loading (Event IDs 1000 or 1001).

  - **Assess endpoint security logs:** Examine logs from endpoint protection solutions for alerts concerning the execution of potentially harmful processes (such as unauthorized scripts) or for unusual behavior involving `msiexec.exe` or `regsvr32.exe`, which should typically be associated with legitimate installations.

  ### Prioritization

  This alert is ranked medium severity due to potential high impact on systems that process sensitive data within Office applications. The likelihood of malicious abuse exists as the modification of autorun keys is a common tactic used by adversaries for persistence. Additionally, this type of behavior is frequently observed in advanced persistent threat (APT) scenarios where access to user credentials and environments is sought.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive audit logging, which could mask legitimate modifications made by administrators or privileged users. False positives can occur from benign software installations or legitimate administrative actions when setting up automation. Companion detections such as monitoring process creations (Event ID 4688) can enhance visibility across related activities, providing context for the modifications in the context of the user and system behavior.

