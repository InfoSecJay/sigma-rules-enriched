title: Office Autorun Keys Modification
id: baecf8fb-edbf-429f-9ade-31fc3f22b970
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: |
  Detects modification of autostart extensibility point (ASEP) in registry. Adversaries may modify these keys to execute malicious code when Office files are opened.
  There are various legitimate add-ins that also use these keys and this filter list might not be exhaustive.
  Thus, it is recommended to review and tune filters for your environment to reduce false positives before deploying to production.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur 
  Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2026-01-09
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_office_root:
    TargetObject|contains:
    - '\Software\Wow6432Node\Microsoft\Office'
    - '\Software\Microsoft\Office'
  selection_office_details:
    TargetObject|contains:
    - '\Word\Addins'
    - '\PowerPoint\Addins'
    - '\Outlook\Addins'
    - '\Onenote\Addins'
    - '\Excel\Addins'
    - '\Access\Addins'
    - 'test\Special\Perf'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_known_addins:
    Image|startswith:
    - 'C:\Program Files\Microsoft Office\'
    - 'C:\Program Files (x86)\Microsoft Office\'
    - 'C:\PROGRA~2\MICROS~2\Office'
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    - 'C:\Windows\SysWOW64\regsvr32.exe '
    TargetObject|contains:
            # Remove any unused addins in your environment from the filter
            # Known addins for excel
    - '\Excel\Addins\AdHocReportingExcelClientLib.AdHocReportingExcelClientAddIn.1\'
    - '\Excel\Addins\ExcelPlugInShell.PowerMapConnect\'
    - '\Excel\Addins\NativeShim\'
    - '\Excel\Addins\NativeShim.InquireConnector.1\'
    - '\Excel\Addins\PowerPivotExcelClientAddIn.NativeEntry.1\'
            # Known addins for outlook
    - '\Outlook\AddIns\AccessAddin.DC\'
    - '\Outlook\AddIns\ColleagueImport.ColleagueImportAddin\'
    - '\Outlook\AddIns\EvernoteCC.EvernoteContactConnector\'
    - '\Outlook\AddIns\EvernoteOLRD.Connect\'
            # - '\Outlook\Addins\GrammarlyAddIn.Connect' # Uncomment if you use Grammarly
    - '\Outlook\Addins\\OneNote.OutlookAddin'
    - '\Outlook\Addins\DriveFSExtensionLib.Connect\'         # An Outlook Add-in to talk with Google Drive
    - '\Outlook\Addins\GoogleAppsSync.Connect\'         # Google Apps Sync for Microsoft Outlook
    - '\Outlook\Addins\Microsoft.VbaAddinForOutlook.1\'
    - '\Outlook\Addins\OcOffice.OcForms\'
    - '\Outlook\Addins\OscAddin.Connect\'
    - '\Outlook\Addins\OutlookChangeNotifier.Connect\'
    - '\Outlook\Addins\UCAddin.LyncAddin.1'
    - '\Outlook\Addins\UCAddin.UCAddin.1'
    - '\Outlook\Addins\UmOutlookAddin.FormRegionAddin\'
    - 'AddinTakeNotesService\FriendlyName'
  filter_main_officeclicktorun:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_vsto:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\VSTO\'
    - 'C:\Program Files (x86)\Microsoft Shared\VSTO\'
    Image|endswith: '\VSTOInstaller.exe'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files\AVG\Antivirus\x86\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Antivirus.AsOutExt\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files\Avast Software\Avast\x86\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Avast.AsOutExt\'
    # These filters are not exhaustive, filter can be expanded based on environment
  condition: all of selection_office_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software or add-in installations and administrative configurations
- Automatic registry modifications during legitimate software installations
level: medium
note: |
  ### Technical Context

  This detection rule identifies modifications to the autostart extensibility point (ASEP) in the Windows registry for Microsoft Office applications. Specifically, it flags changes within registry keys that could be leveraged by adversaries to execute malicious scripts or code when Office files are opened. The likely attacker objective is to persist malicious behavior by introducing unauthorized add-ins that execute without user consent or knowledge.

  This corresponds to the MITRE ATT&CK tactic of **Persistence** (TA0003) and specifically the technique **Office Application Startup** (T1547.001). The primary telemetry source is Windows Registry logs targeting registry set events related to Office applications, specifically related to locations such as `\Software\Microsoft\Office\<Application>\Addins`. If malicious, this activity could lead to code execution and potential data exfiltration. However, this detection does NOT confirm malicious intent on its own, as legitimate software configurations or updates can trigger similar registry changes.

  ### Investigation Steps

  - **Review the triggering registry events:** Examine Windows Registry logs for Event ID 4657, focusing on the `TargetObject` field to confirm any modifications to keys under `Software\Microsoft\Office\<Application>\Addins`.

  - **Identify known add-ins:** Cross-reference the modifications against a list of legitimate Office add-ins hosted in the organization. Focus on unique COM add-in identifiers located in `\Software\Microsoft\Office\<Application>\Addins`.

  - **Authenticate the modifying process:** Inspect the process that performed the registry modification using Sysmon Event ID 10 or Windows Event ID 4688. Pay attention to the `Image` field to determine if the process is a known legitimate Office application path.

  - **Check for empty or null values:** Look for registry modifications where `Details` in Windows Registry logs show as `(Empty)` or `null`, as these are indicative of potentially malicious operations that are not associated with legitimate add-ins.

  - **Validate against false positive scenarios:** Assess if the modifications align with known software or add-in installations, including registry entries that modify typical Office behavior. Document any legitimate installations occurring around the time of the report.

  - **Monitor for related anomalies:** Keep an eye out for any unusual process creation (Event ID 4688) or script execution (Process ID 1 in Sysmon) following the registry change, as this might indicate exploitation following the modification.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on systems that play critical roles in business functions, such as document processing and email communications. The likelihood of malicious actors leveraging such vulnerabilities is moderate, as techniques to modify Office autorun features for persistent access are well documented and frequently exploited.

  ### Blind Spots and Assumptions

  Potential evasion techniques include the use of benign add-ins or automated scripts that generate legitimate registry modifications, often obscuring true malicious activity. The detection relies heavily on the accurate configuration of Windows Registry logs. Legitimate software installations might trigger similar alerts, necessitating close scrutiny of the surrounding activity. Companion detections, such as monitoring for unusual network connections from modified Office applications, would complement coverage and enhance the ability to detect and respond to potential threats.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
