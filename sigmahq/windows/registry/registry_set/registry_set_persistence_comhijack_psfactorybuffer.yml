  ---

  ### Technical Context

  This Sigma rule detects modifications to the InProcServer32 registry key for a specific COM object (CLSID {c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6}), which is often targeted to achieve persistence through the deployment of malicious DLLs. The primary objective of an attacker utilizing this behavior involves establishing a backdoor within the target environment, allowing for unauthorized access and control. This detection mainly aligns with the MITRE ATT&CK technique for "COM Hijacking" (T1546.015).

  The primary telemetry sources for this detection encompass Windows registry logs, specifically monitoring changes to the `HKEY_CLASSES_ROOT\CLSID` and related paths. If exploited, this malicious behavior can lead to significant security impacts, such as unauthorized remote access or data exfiltration. However, this detection does NOT confirm malicious intent in isolation; further investigation is needed to corroborate context and intent surrounding the registry change.

  ---

  ### Investigation Steps

  - **Check registry change logs:** Review Windows Event Log Security Event ID 4658 and System Event ID 12 for any recent modifications to the registry key `HKEY_CLASSES_ROOT\CLSID\{c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6}\InProcServer32\(Default)`. Document the date, time, and user account responsible for the change.

  - **Verify loaded DLL paths:** Cross-check the paths against documented legitimate DLLs. Refer to file system logs or Sysmon Event ID 10 to identify processes that have loaded `ActXPrxy.dll` from the `C:\Windows\System32\` directory. This DLL should NOT be present in a compromised state.

  - **Identify high-confidence malicious indicators:** Look for additional registry keys associated with known malicious behavior, focusing on any connections to the RomCom backdoor. Query for associated processes or commands executed within a short time frame post registry change, using Event ID 4688 (Process Creation).

  - **Assess for benign activity:** Investigate known applications or authorized scripts that might legitimately change the COM settings for the specified CLSID. Include software installation logs or application-onboarding activity from asset management solutions.

  - **Examine related processes:** Use Sysmon Event ID 1 to identify any parent-child process relationships that align with the time of change to the registry key. Documentation of legitimate application activity patterns may help distinguish benign from malicious actions.

  - **Confirm asset criticality:** Evaluate the role of the affected system within the organization. High-risk systems, such as domain controllers or systems handling sensitive data, necessitate immediate attention and deeper investigation.

  ---

  ### Prioritization

  This alert is classified as high severity due to the potential impact on system integrity and the likelihood of malicious exploitation of the COM hijacking behavior. This technique is weaponized in various attacks and poses significant risks to enterprise security if exploited.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of thorough registry logging configurations; ensure that all relevant logs are correctly set up to capture such registry changes. Legitimate installations or software updates may mistakenly trigger this alert, particularly in environments with frequent operational changes. Enhancing visibility with companion detections for process execution or monitoring similar registry modifications will strengthen overall security posture.

