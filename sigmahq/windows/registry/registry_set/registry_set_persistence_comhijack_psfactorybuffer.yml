note: |
  ### Technical Context
  This detection rule focuses on identifying potential COM hijacking attempts by monitoring changes to the InProcServer32 registry key related to a specific CLSID associated with the RomCom malware. Attackers may utilize this technique to maintain persistence within a target environment by redirecting COM object calls to malicious DLLs, enabling them to execute arbitrary code when legitimate applications invoke these objects. The primary objective of such threats is to evade detection while establishing long-term footholds within compromised systems, potentially leading to data exfiltration or further exploitation.

  This detection aligns with the MITRE ATT&CK framework, particularly under the tactics of **Persistence** (TA0003) and **Privilege Escalation** (TA0004). The relevant technique is **"Event Triggered Execution"** (T1546.015), which involves executing malicious code in response to certain system events through the manipulation of system registries.

  Primary data sources for this detection include Windows registry logs, specifically tracking modifications to COM object registry keys, as well as any corresponding logs from antivirus or endpoint detection solutions that might capture the execution of unauthorized DLLs.

  ### Investigation Steps
  - **Review Registry Changes**: Check the Windows registry logs for modifications to the InProcServer32 key linked to the specified CLSID. Look for any unauthorized or unexpected changes that may indicate malicious activity.

  - **Analyze Process Creation Events**: Investigate process creation logs to identify any new or unusual Windows processes that could be linked to the execution of a malicious DLL, specifically those interacting with COM objects.

  - **Check for Suspicious DLLs**: Examine the contents of the `%windir%\System32\` directory for any DLLs that match those detected in the registry changes. Specifically, focus on any instances of `ActXPrxy.dll` and verify their origin and legitimacy.

  - **Monitor Application Behavior**: Observe applications that utilize the targeted COM object for any anomalous behavior, including unexpected crashes or unauthorized access attempts, which might suggest exploitation of the persistence method.

  ### Prioritization
  This alert is rated high severity due to the potential for significant impact within an enterprise environment. COM hijacking can lead to prolonged access by threat actors, allowing them to maintain control over compromised systems and potentially escalate privileges or exfiltrate sensitive data.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if registry logging is not properly configured on all systems, potentially allowing some malicious changes to go unnoticed. Additionally, the detection logic assumes that the paths and file names associated with the malicious DLLs are consistent with known indicators; if attackers modify their tactics or use different names, these changes could evade detection. It's crucial to ensure that the necessary audit policies for registry modifications are enabled and that the SIEM or EDR solutions are configured to capture relevant events for effective monitoring.

