note: |
  ### Technical Context

  This rule detects modifications to the PSFactory COM registry settings, specifically targeting the `InProcServer32` key associated with a known CLSID that can store a malicious DLL. The likely attacker objective is to create persistence on a compromised system, enabling repeated access or control through the malicious ActXPrxy.dll, which could facilitate further exploitation. This behavior is associated with the MITRE ATT&CK technique T1546.015: **Event Triggered Execution - COM Hijacking**.

  The primary telemetry sources needed include Windows Registry logs focusing on changes to the `HKEY_CLASSES_ROOT\CLSID\{c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6}` path. If malicious, the presence of a file pointer to an unauthorized DLL can lead to increased access by an adversary, potentially compromising sensitive system functions. However, this detection does NOT confirm that the detected registry modification is indeed malicious, as it may also be the result of legitimate software installation or configuration changes.

  ### Investigation Steps

  - **Confirm registry modifications**: Review Windows Registry logs for changes to `HKEY_CLASSES_ROOT\CLSID\{c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6}\InProcServer32`. Use tools or scripts to compare current values against known good states.

  - **Identify the DLL tied to the registry modification**: Check the value of `(Default)` key under `InProcServer32` for paths leading to suspicious DLLs. Malicious indicators may include non-standard file locations or if the path matches the known malicious `ActXPrxy.dll`.

  - **Validate file existence and checksums**: Determine if `ActXPrxy.dll` exists in `C:\Windows\System32\` or in any unexpected locations. Utilize file integrity monitoring to check for changes in file hashes, looking for indicators of tampering.

  - **Analyze execution context**: Review process creation logs (Security Event ID 4688) to identify any recent processes spawned that reference `ActXPrxy.dll`. Track down the parent processes to evaluate legitimate user activity versus potential malware execution.

  - **Assess host roles and criticality**: For any affected hosts, consider their role in the infrastructure (e.g., domain controller, file server). Prioritize deeper investigation on critical systems that may amplify the impact of a successful compromise.

  - **Correlate with other detections**: Look for related logs indicating exploitation attempts, such as unusual network activity related to the affected host (e.g., outbound connections to known malicious IPs) and correlate those with the registry modification timing.

  ### Prioritization

  This alert should be treated as high priority due to the potential for severe impact on the system integrity and data security if a COM hijack is successful. The likelihood of malicious abuse is significant given the documented use of the technique by known threat actors, making it crucial for analysts to respond promptly.

  ### Blind Spots and Assumptions

  Detection can be limited by the absence of adequate Windows Registry logging configurations, as challenges arise in identifying legitimate application behavior that may modify COM objects. This rule may trigger on benign activities, such as legitimate software updates or installations that modify `InProcServer32`. Companion detections to consider include monitoring for unexpected new process creation from DLLs modified through COM hijacking, enhancing coverage regarding malicious activities linked to this behavior.

