title: Classes Autorun Keys Modification
id: 9df5f547-c86a-433e-b533-f2794357e242
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: |
  Detects modification of Windows Registry Classes keys used for persistence.
  Adversaries modify these autostart extensibility points (ASEP) to execute malicious code when file types are opened or actions are performed.
  Various legitimate software also uses these keys. Currently, this rule only filters out known legitimate software paths,
  thus it is recommended to review and tune filters for your environment to reduce false positives before deploying to production.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur 
  Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2025-10-22
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_classes_base:
    TargetObject|contains: '\Software\Classes'
  selection_classes_target:
    TargetObject|contains:
    - '\Folder\ShellEx\ExtShellFolderViews'
    - '\Folder\ShellEx\DragDropHandlers'
    - '\Folder\Shellex\ColumnHandlers'
    - '\Filter'
    - '\Exefile\Shell\Open\Command\(Default)'
    - '\Directory\Shellex\DragDropHandlers'
    - '\Directory\Shellex\CopyHookHandlers'
    - '\CLSID\{AC757296-3522-4E11-9862-C17BE5A1767E}\Instance'
    - '\CLSID\{ABE3B9A4-257D-4B97-BD1A-294AF496222E}\Instance'
    - '\CLSID\{7ED96837-96F0-4812-B211-F13C24117ED3}\Instance'
    - '\CLSID\{083863F1-70DE-11d0-BD40-00A0C911CE86}\Instance'
    - '\Classes\AllFileSystemObjects\ShellEx\DragDropHandlers'
    - '\.exe'
    - '\.cmd'
    - '\ShellEx\PropertySheetHandlers'
    - '\ShellEx\ContextMenuHandlers'
  filter_main_drivers:
    Image: 'C:\Windows\System32\drvinst.exe'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_svchost:
    Image: 'C:\Windows\System32\svchost.exe'
        # If more targets are found from "svchost". Please exclude the whole image
    TargetObject|contains: '\lnkfile\shellex\ContextMenuHandlers\'
  filter_optional_msoffice:
    Details: '{807583E5-5146-11D5-A672-00B0D022E945}'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows Registry Classes keys that are often exploited by adversaries for persistence through autostart configuration (specifically, multiple autostart extensibility points). The primary goal of this behavior is to enable malicious code execution whenever specific file types are interacted with, ensuring that even after reboots or user logins, the malicious payload remains active. The relevant MITRE ATT&CK tactics and techniques for this behavior include Persistence (TA0003) and Registry Run Keys / Startup Folder (T1547.001).

  The primary telemetry sources for this detection are Windows Registry logs that specifically log registry modifications. Event data includes the path of the registry keys being altered (TargetObject) and can reveal indicators of compromise when suspicious modifications are noted. If these modifications are indeed malicious, the impact can range from data exfiltration to full system compromise. However, this detection does NOT confirm malicious activity on its own; legitimate software and administrative actions often create similar registry changes, necessitating thorough analysis.

  ### Investigation Steps

  - **Review registry modification details**: Check `TargetObject` field in logs for any changes made to `\Software\Classes`. Look for uncommon keys that are not part of standard software installations (Event ID 13 in Security logs).

  - **Identify high-confidence malicious indicators**: Cross-reference `TargetObject` against a known list of malicious keys (e.g., direct modifications to `\CLSID\{AC757296...}` entries that are not part of expected installations).

  - **Correlate with known applications**: Verify if the application modifying keys is a known software that usually manipulates these classes, for example, legitimate installers or drivers (e.g., Event ID 4688 for process creation).

  - **Validate expected administrator behavior**: Confirm if the modification was initiated by an authorized administrative tool, which could indicate routine maintenance. Check the user context under which the modification occurred and compare with typical admin activity logs.

  - **Check for anomalies in process execution**: Look for unusual execution patterns by running processes associated with registry modifications (e.g., `drvinst.exe`, `svchost.exe`). Use Sysmon logs (Event ID 1) for detailed command line parameters.

  - **Run a comprehensive host inventory**: If persistence changes are detected, survey the affected system for additional indicators of compromise, such as scheduled tasks or startup items related to the modified registry keys that could indicate a larger infection.

  ### Prioritization

  Given that the detected behavior concerns critical registry modifications associated with persistence, the alert should be considered medium to high severity. The potential for exploitation is significant since adversaries commonly leverage these registry paths for malware persistence. However, the likelihood of benign administrative modifications means that context is crucial before escalating.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives due to the prevalence of legitimate software installations that modify these registry keys. It's essential to maintain comprehensive logging from both Windows Registry and process creation events to ensure reliable detection. Legitimate administrative actions may often trigger this alert, such as software updates. Companion detections, such as monitoring for associated process spawns or monitoring tools that can identify unusual DLL injections, can enhance coverage against related persistence mechanisms.

