note: |
  ### Technical Context

  This Sigma rule detects when the User Account Control (UAC) secure desktop prompt setting is disabled by modifying the registry value `PromptOnSecureDesktop` to 0. This behavior indicates an attempt to reduce UAC's protective features, potentially allowing an attacker to manipulate elevation prompts for malicious purposes. The likely objective is to facilitate privilege escalation by making it easier for malicious software to compromise the system. This action aligns with the MITRE ATT&CK technique T1548.002 (Abuse Elevation Control Mechanism: UAC-Different Execution Level).

  The primary telemetry sources for this detection are Windows Registry logs, specifically monitoring changes in the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System` registry path. The security impact, if malicious, includes heightened vulnerability to privilege escalation attacks. Notably, this detection does NOT confirm that an actual exploit has occurred; it only indicates a change that reduces security.

  ### Investigation Steps

  - **Check registry value change:** Examine Windows Registry logs for `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop` (Event ID 4657) to verify changes to the value. A legitimate setting should hold a value of 1.
  - **Review administrative account usage:** Look for corresponding security logs (Event ID 4768 and Event ID 4688) around the time of the registry change to determine if an administrative account made the change. Suspicious usage patterns by non-administrators could indicate potential compromise.
  - **Identify suspicious applications:** Review installed application logs (Windows Event ID 1033 for application install) before and after the registry change to correlate any new or unknown applications that may have installed around the same time.
  - **Analyze UAC interaction logs:** Check for modifications in UAC prompting behaviors documented in system logs. Events related to UAC prompt generation and suppression provide context on potential misuse.
  - **Review user activity patterns:** Analyze user account activity around the time of the registry alteration, focusing on abnormal behaviors (e.g., unusual login times or failed elevation attempts) that deviate from standard operations.
  - **Correlate with related alerts:** Review alerts related to privilege escalation or other suspicious activities from companion detections, such as attempts to execute arbitrary code or changes to other security controls (see related rule ID c5f6a85d-b647-40f7-bbad-c10b66bab038).

  ### Prioritization

  This alert should be considered medium severity, as disabling UAC secure desktop functionality can significantly lower a system's defense against privilege escalation. The likelihood of malicious use is concerning, given that this action is frequently associated with exploitation efforts by adversaries.

  ### Blind Spots and Assumptions

  Legitimate changes made by system administrators for testing purposes may trigger this alert, emphasizing the need for contextual analysis. This detection may be evaded if attackers utilize advanced techniques to avoid registry logging, or if logging configurations are inadequate. Required logs include comprehensive registry monitoring, and related detections should involve tracking changes to Windows security policies to enhance visibility into potential threats.

