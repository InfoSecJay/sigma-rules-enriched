note: |
  ### Technical Context

  This rule detects modifications to the User Account Control (UAC) settings, specifically identifying when the "PromptOnSecureDesktop" registry value is set to 0. This alteration indicates an attempt to weaken UAC security measures, allowing prompts to be displayed on the current user desktop where they can be more easily manipulated by Malware. The likely attacker objective is to facilitate privilege escalation by bypassing the secure desktop feature that isolates UAC prompts. This behavior aligns with the MITRE ATT&CK technique for privilege escalation (T1548.002 - Abuse Elevation Control Mechanism), indicating a targeting of defense mechanisms.

  The primary telemetry source for this alert is Windows Registry change logs, specifically monitoring the keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System`. If malicious, this behavior can lead to escalated permissions for attackers, compromising the integrity of the affected system. Importantly, this detection does not confirm unauthorized access or compromise by itself; it only indicates a change that could facilitate such actions.

  ### Investigation Steps

  - **Check registry change history**: Investigate Registry change logs for Event ID 4657 (a registry value has been changed). Look for modifications related to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop`. Identify the user and the process associated with the change.

  - **Validate user and process context**: Determine the identity of the user and the associated process that performed the registry modification. Use Event ID 4688 (Process Creation) to correlate processes that may have executed around the time of the registry change. Legitimate system processes like `winlogon.exe` or `services.exe` generally should not change this setting.

  - **Cross-check against security baselines**: Compare the current UAC settings stored at `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System` against organizational baseline security standards. Legitimate changes should trace back to IT policy enforcement.

  - **Look for simultaneous privilege escalation attempts**: Review for any Activity associated with Event ID 4672 (Special Privileges Assigned to New Logon) that occurred around the same timeframe. Cross-reference this with the registry change to identify potential attempts at privilege escalation that align with the registry modification.

  - **Identify known malicious indicators**: Evaluate running services and scheduled tasks using Event ID 4697 (A service was installed in the system). Check for services associated with known malware or questionable vendors that align with the timing of the registry change.

  - **Monitor for lateral movement signs**: If this system role is critical, investigate for any unusual outbound connections or credential dumps on the host. Check logs for Windows Event ID 5140 (A network share object was accessed) that may indicate lateral movement efforts post modification.

  ### Prioritization

  The alert has medium severity due to the potential risk of privilege escalation impacting critical systems. The likelihood of malicious abuse is high, given that reducing UAC security is a common tactic employed by adversaries to facilitate further system compromises. Such behavior is often weaponized in various attack vectors, making timely detection and response essential.

  ### Blind Spots and Assumptions

  Detection may be limited if registry auditing is not properly configured or if log retention policies are insufficient to capture historical changes. Attackers may use valid credentials or tools to perform this registry modification, thereby masking their activities. Legitimate administrative actions could also trigger this alert, such as group policy changes. A related detection for continuous monitoring would involve tracing the initiation of processes for UAC bypass techniques linked to direct command invocation (T1548.001).

