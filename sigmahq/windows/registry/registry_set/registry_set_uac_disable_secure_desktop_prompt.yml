  ### Technical Context

  This rule detects modifications to the Windows User Account Control (UAC) settings, specifically when the "PromptOnSecureDesktop" registry value is set to 0. This adjustment indicates a potential attempt by an attacker to disable security features designed to protect users from unauthorized elevation of privileges and manipulation of UAC prompts. The likely attacker objective is to elevate their privileges without detection, thus gaining additional access to system functionalities.

  The relevant MITRE ATT&CK tactic is **Privilege Escalation**, specifically technique **T1548.002** (Ambiguous Administration). Primary telemetry sources include Windows Registry logs, specifically changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System`. If this modification is malicious, it may allow malware to effectively bypass UAC prompts. However, this detection alone does not confirm malicious intent; it merely indicates that a configuration change could decrease system security.

  ---

  ### Investigation Steps

  - **Identify the registry change:** Inspect Windows Registry logs for Event ID 4657 (a registry value was modified) to confirm when and by whom the `PromptOnSecureDesktop` value modified to DWORD (0x00000000).

  - **Assess user context:** Verify the user account that made this change. Look for Event ID 4624 (successful login) to ensure the account has appropriate privileges. Legitimate administrative users may perform this action during maintenance; investigate the expected roles.

  - **Analyze Event Logs:** Review Event ID 4703 (Modification of user rights assignment) to correlate other account changes or additional privilege escalations around the same time as the UAC setting modification.

  - **Check for connected processes:** Access Sysmon Event ID 1 (Process Creation) to foreground processes running at the time of the registry change for indicators of suspicious activity. Compare known benign processes with newly introduced or anomalous ones.

  - **Confirm baseline configuration:** Review previous `PromptOnSecureDesktop` settings to establish a baseline by checking Windows Registry logs from the past month for previous values, confirming if this change deviates from standard configurations.

  - **Monitor for subsequent actions:** Look for signs of privilege escalation or lateral movement, like Event ID 4672 (Special privileges assigned) or other suspicious account activity post-change, indicating potential exploitation of the less secure UAC prompt.

  ---

  ### Prioritization

  This alert should be considered medium priority due to the potential impact on system security if malicious activity is confirmed. The likelihood of abuse is realistic, as attackers often target UAC settings to facilitate privilege escalation. This behavior is part of a known attack methodology, making it essential to investigate promptly.

  ---

  ### Blind Spots and Assumptions

  This detection may miss scenarios where legitimate administrators alter UAC settings for valid purposes, resulting in false positives. Additionally, environments without auditing configured for registry changes might not generate the required logs for reliable detection. When analyzing the incident, consider other alerts related to privilege escalation or unauthorized access attempts, particularly those related to registry manipulations.

