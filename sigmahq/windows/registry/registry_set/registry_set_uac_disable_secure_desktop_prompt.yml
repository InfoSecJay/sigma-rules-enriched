note: |
  ### Technical Context
  This detection rule targets a critical change to the User Account Control (UAC) settings on Windows systems, specifically when the "PromptOnSecureDesktop" value is modified to disable secure desktop prompts. UAC is a vital security feature designed to prevent unauthorized changes to the operating system by requiring elevated permissions for tasks that could affect system integrity. By altering this setting, an attacker can potentially expose UAC prompts to tampering, allowing them to intercept and manipulate the request for administrative access. This action is often associated with privilege escalation tactics.

  The primary objectives for attackers using this technique include bypassing security mechanisms that protect against unauthorized privilege elevation and enabling malicious software to gain higher access levels within the system. According to the MITRE ATT&CK framework, this behavior maps to the **T1548.002 - Abuse Elevation Control Mechanism: UAC Request Filtering** technique. It exemplifies the method in which attackers aim to compromise the integrity of the operating system for malicious purposes.

  To effectively analyze this detection, the most relevant data sources would be the registry logs, specifically focusing on registry modification events related to UAC configurations. These logs can provide crucial evidence of unauthorized changes reflecting potential malicious behaviors.

  ### Investigation Steps
  - **Review Registry Change Events**: Check the registry logs for any modifications to the "PromptOnSecureDesktop" value within `\Microsoft\Windows\CurrentVersion\Policies\System` that were set to a DWORD of 0. Confirm if there were any suspicious activities leading up to this change.

  - **Analyze Process Creation Logs**: Investigate process creation events around the time of the registry change to identify any unusual or unauthorized applications that may have initiated or executed processes that could modify UAC settings.

  - **Check Security and Event Logs**: Examine Windows security and event logs for any failed or successful UAC elevation attempts that coincide with the timing of the registry modification. This may provide context to the attacker's intent and methodology.

  - **Review User Activity and Behavior**: Assess user activity logs to determine if any legitimate users had administrative access and check their actions leading up to the registry change for potential signs of compromise or misuse.

  ### Prioritization
  The severity of this alert is medium due to the significant implications of disabling UAC secure desktop prompts. Although this behavior alone may not confirm an active attack, it acts as a precursor for potential privilege escalation, indicating a higher likelihood of unauthorized access if paired with other suspicious activities.

  ### Blind Spots and Assumptions
  This detection logic may not capture legitimate administrative changes made during system maintenance or configuration updates. Furthermore, it assumes that all necessary logging configurations are enabled to capture registry changes in real-time. If registry auditing is not enabled, the detection will be ineffective. Additionally, transient or stealthy malware may further obfuscate these changes, thereby limiting the detection's efficacy. Careful adjustment and regular reviews of the detection logic should be performed to ensure it adapts to changing threat landscapes.

