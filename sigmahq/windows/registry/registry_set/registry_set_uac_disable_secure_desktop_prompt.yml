note: |
  ### Technical Context

  This rule detects attempts to disable User Account Control (UAC) secure desktop prompts by modifying the "PromptOnSecureDesktop" registry value to 0 in Windows systems. The likely objective of an attacker is to weaken the UAC mechanism, allowing potentially malicious software to manipulate elevation prompts, facilitating privilege escalation. This behavior falls under the MITRE ATT&CK tactic of Privilege Escalation, specifically the technique T1548.002: Abuse Elevation Control Mechanism.

  The primary telemetry source for this detection is Windows Registry changes, specifically monitoring registry keys in `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System`. If successful, this compromise allows an attacker to perform malicious actions with higher privileges without being challenged by UAC prompts. It is important to note that detection of this behavior does NOT confirm successful exploitation or that a compromise has occurred; it only indicates a configuration change that lowers system defenses.

  ### Investigation Steps

  - **Review the registry change detail**: Check for the presence of the registry key `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop` showing a value of 0 (DWORD). If this change was made shortly after a known malicious activity, it could be a high-confidence indicator of compromise.

  - **Assess the timing of the change**: Correlate the registry modification timestamp with other security events. Look for Event ID 4688 (Process Creation) in Security logs to identify processes that may have executed commands related to UAC modification shortly before or after the registry change.

  - **Identify legitimate user behavior**: Determine if the change aligns with standard operational behavior within the organization. Review user permissions and roles to assess if a system administrator or trusted user account made a legitimate change versus an unauthorized account.

  - **Cross-reference with related detections**: Validate if there are simultaneous alerts from related detection rules such as T1548 (elevation controls) or use of a remote access tool, which may indicate coordinated malicious activity.

  - **Analyze source of registry change**: Identify the originating process responsible for the registry change by examining process trees (Sysmon Event ID 1) and correlating running processes at the time of the modification. Process names like `reg.exe` or PowerShell usage might indicate a scripted change, while legitimate software installers may result in benign alterations.

  ### Prioritization

  This alert is of medium severity. It could indicate an ongoing attempt to bypass UAC defenses on critical systems, making it relevant for immediate investigation. The likelihood of malicious abuse is moderate, especially in environments where privilege escalation is targeted by adversaries. Such configuration changes are a common step in attack workflows involving privilege escalation.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive auditing of registry changes if auditing isn’t enabled. Legitimate activities, such as software installations or administrative changes, could trigger this alert, necessitating careful context analysis. Ensuring Windows Event Logging is configured to capture all registry modifications is essential for reliable detection. A related detection to strengthen monitoring of privilege escalation attempts could be the tracking of changes to the UAC `ConsentPromptBehaviorAdmin` registry value, which should be assessed alongside this alert.

