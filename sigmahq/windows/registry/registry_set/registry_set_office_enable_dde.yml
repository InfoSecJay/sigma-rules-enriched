note: |
  ### Technical Context
  This detection rule identifies the enabling of the Dynamic Data Exchange (DDE) protocol within Microsoft Word or Excel applications. DDE is a legacy inter-process communication method that can be exploited to execute malicious scripts or commands without direct user interaction, often leveraging social engineering tactics to encourage users to open infected documents. Attackers may utilize DDE to deliver payloads or facilitate lateral movement within a network while evading traditional security measures.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior fall under **Execution (TA0002)**, specifically **Application Layer Protocol (T1559.002)**, where attackers exploit application-layer protocols to execute malicious code. Effective detection necessitates monitoring specific registry settings that control DDE functionality, as changes here imply a potential risk.

  Primary data sources for this detection include Windows registry logs, where changes to the DDE settings can be observed. Monitoring these settings can provide early indicators of malicious intent, allowing security teams to respond proactively.

  ### Investigation Steps
  - **Review Registry Changes**: Analyze the Windows registry for recent alterations in DDE settings, specifically under the paths related to Word and Excel security configurations. Look for values set to allow DDE functionality.

  - **Analyze Application Behavior**: Investigate any related process creation events or network activity generated by Word or Excel after the DDE protocol was enabled, focusing on commands or scripts executed initiated by these applications.

  - **Inspect User Activity**: Correlate changes in DDE settings with user activity logs to identify any unusual document openings or application behaviors that may signify exploitation attempts.

  - **Identify Potential Alerts**: Monitor for alerts from EDR or AV solutions related to process execution patterns commonly linked with DDE exploits or other associated macro-based attacks.

  ### Prioritization
  The severity of this alert is considered medium because enabling DDE can facilitate harmful actions within the enterprise environment, contributing to broader exploitation strategies. However, it is essential to balance this risk with the likelihood of legitimate use cases for DDE in organizational applications.

  ### Blind Spots and Assumptions
  This detection rule may be limited by a lack of visibility into non-Windows platforms that may also use DDE or alternative methods for executing similar attacks. Assumptions include that DDE is primarily being enabled for malicious purposes, which may not always be the case; some users may require this functionality for legitimate reasons. Effective monitoring assumes that the relevant registry logs are being collected and that the logging levels are appropriately configured to capture changes to the DDE settings.

