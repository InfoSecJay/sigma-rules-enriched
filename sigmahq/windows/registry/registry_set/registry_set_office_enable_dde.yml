  ---

  ### Technical Context

  This Sigma rule detects enabling the Dynamic Data Exchange (DDE) protocol in Microsoft Word or Excel through registry modifications. The likely attacker objective is to facilitate remote code execution by allowing malicious documents to communicate with other applications. Relevant MITRE ATT&CK tactics include Execution (T1203) and Specific Execution through DDE (T1559.002). The primary telemetry sources are Windows registry logs focusing on changes to security settings for Word and Excel. If successful, this attack could lead to unauthorized code execution and potential data exfiltration. It is important to note that this detection does NOT confirm that an attack has occurred; it simply indicates that the environment has been configured to allow DDE, which can be leveraged for malicious purposes.

  ---

  ### Investigation Steps

  - **Check registry changes: ** Review Windows registry logs for Event ID 4657 or via Sysmon Event ID 13 to confirm modifications at `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Word\Security\AllowDDE` or `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Excel\Security\` with values of `0x00000001` for Word and `0x00000000` for Excel. Malicious changes reflect an intention to enable DDE for exploitation.

  - **Identify recent document activity:** Inspect the last accessed documents in user profiles to look for any recently opened suspicious Office documents, especially those from untrusted sources. Legitimate documents typically stem from known users or trusted repositories.

  - **Determine user permissions:** Review user permissions and access on the affected systems to assess the risk profile. Users with administrative privileges could exploit this configuration more easily.

  - **Analyze process creation:** Check for process creation events (Security Event ID 4688 or Sysmon Event ID 1) related to `WINWORD.EXE` or `EXCEL.EXE` around the time of registry modifications. Look for any suspicious command line arguments that indicate potential exploitation, such as loaded malicious DLLs.

  - **Review audit logs for policy changes:** Examine Group Policy audit logs to verify if DDE settings were altered through an elevated privilege context, indicating potential insider threats or advanced adversary activity.

  ---

  ### Prioritization

  This alert carries a medium severity due to the vulnerability of enabling DDE, which is a known attack vector for executing malicious scripts in documents. The likelihood of malicious abuse is significant, as adversaries frequently weaponize Office documents. Additionally, environments with high-value data (e.g., finance, healthcare) are at greater risk if exploited.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the failure to log certain registry operations or if logging is not properly configured for auditing changes. Legitimate activities, such as automated administrative scripts or applications that rely on DDE for inter-application communication, may trigger this alert. Related detections to strengthen coverage could include monitoring for unusual processes spawned with `WINWORD.EXE` or `EXCEL.EXE` that exhibit anomalous behavior following DDE activation.

