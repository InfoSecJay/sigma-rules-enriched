status: test
description: |
  Detects potential persistence behavior using the windows telemetry registry key.
  Windows telemetry makes use of the binary CompatTelRunner.exe to run a variety of commands and perform the actual telemetry collections.
  This binary was created to be easily extensible, and to that end, it relies on the registry to instruct on which commands to run.
  The problem is, it will run any arbitrary command without restriction of location or type.
references:
- https://www.trustedsec.com/blog/abusing-windows-telemetry-for-persistence/
author: Lednyov Alexey, oscd.community, Sreeman
date: 2020-10-16
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053.005
logsource:
  category: registry_set
  product: windows
  definition: 'Requirements: Sysmon config that monitors \SOFTWARE\Microsoft\Windows
    NT\CurrentVersion\AppCompatFlags\TelemetryController subkey of the HKLM hives'
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TelemetryController\'
    TargetObject|endswith: '\Command'
    Details|contains:
    - '.bat'
    - '.bin'
    - '.cmd'
    - '.dat'
    - '.dll'
    - '.exe'
    - '.hta'
    - '.jar'
    - '.js'
    - '.msi'
    - '.ps'
    - '.sh'
    - '.vb'
  filter_main_generic:
    Details|contains:
    - '\system32\CompatTelRunner.exe'
    - '\system32\DeviceCensus.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects modifications to the Windows registry at the TelemetryController subkey, specifically targeting the inclusion of potentially malicious command executions via the binary **CompatTelRunner.exe**. The attacker likely aims to achieve system persistence by scheduling arbitrary code execution through legitimate Windows telemetry services. This behavior aligns with the MITRE ATT&CK tactic **Persistence** and technique **T1053.005: Scheduled Task/Job**.

  Primary telemetry sources include Windows registry changes monitored via Sysmon, particularly the **HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TelemetryController** path. If malicious, this could allow extensive unauthorized access or control over the system. However, this detection alone does not confirm malicious activity as legitimate applications may also modify these registry keys.

  ### Investigation Steps

  - **Verify registry modification details:** Check Sysmon Event ID 13 logs. Look for changes to **TargetObject** containing `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TelemetryController\` with **Details** indicating a command that includes file extensions like `.bat`, `.exe`, or `.cmd`. Legitimate activity will typically show benign commands related to system maintenance or updates.

  - **Identify process attributes:** Cross-reference Sysmon Event ID 1 for process creation logs associated with **CompatTelRunner.exe**. Look for the command line parameters used. Malicious indicators include uncommon parameters or suspicious command execution paths.

  - **Assess system role and criticality:** Confirm the affected system's role within the enterprise. Systems that are critical (e.g., domain controllers or servers) warrant immediate escalation, particularly if the execution commands are suspicious.

  - **Investigate related scheduled tasks:** Review the Task Scheduler (using the `schtasks` command) for any recent tasks that utilize **CompatTelRunner.exe** or have been altered. Malicious tasks may have atypical execution times or origins.

  - **Check for other associated artifacts:** Validate any file creation or network connection activities initiated by commands listed in the logs. Look through Event ID 4688 and network traffic logs for abnormal behavior indicating potential data exfiltration or lateral movement.

  ### Prioritization

  This alert should be considered high severity due to its potential impact on system integrity and the likelihood that it could be abused for malicious persistence strategies. The use of legitimate Windows processes makes this behavior particularly concerning as it may bypass traditional security mechanisms.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using fileless techniques or modifying existing legitimate tasks to execute malicious commands. It relies on Sysmon configuration to reliably monitor the specific registry paths, which must be properly set up in advance. Legitimate system updates or telemetry adjustments by administrators may trigger this alert, potentially leading to false positives. A related detection to consider is monitoring API calls to **CompatTelRunner.exe** for abnormal patterns, enhancing overall coverage of potential threats.

