logsource:
  product: windows
  category: registry_set
detection:
  selection_path:
    TargetObject|contains|all:
    - '\SOFTWARE\Microsoft\Office\'
    - '\Security\ProtectedView\'
  selection_values_1:
    Details: 'DWORD (0x00000001)'
    TargetObject|endswith:
    - '\DisableAttachementsInPV'         # Turn off Protected View for attachments opened from Outlook
    - '\DisableInternetFilesInPV'         # Turn off Protected View for files downloaded from Internet zone
    - '\DisableIntranetCheck'         # Turn off Protected View for file located in UNC paths
    - '\DisableUnsafeLocationsInPV'         # Turn off Protected View for unsafe locations
  selection_values_0:
    Details: 'DWORD (0x00000000)'
    TargetObject|endswith:
    - '\enabledatabasefileprotectedview'
    - '\enableforeigntextfileprotectedview'
  condition: selection_path and 1 of selection_values_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies changes made to the Microsoft Office Protected View registry settings. Protected View is a security feature designed to safeguard users from potentially malicious documents, particularly those obtained from untrusted sources. By changing the registry keys associated with Protected View, an attacker may attempt to disable this safeguard, facilitating the execution of malicious code embedded in Office documents. This behavior is indicative of potential defense evasion tactics, where adversaries aim to lower their chances of detection while executing their malicious activities.

  The primary threat scenario involves a potential attacker manipulating these settings to conduct malware delivery or data exfiltration via Office documents, thereby exploiting the decreased security posture. The relevant MITRE ATT&CK techniques include **T1562.001: Disable or Modify Tools** as attackers may disable protective features to execute malicious codes seamlessly without alerting defenses.

  To effectively detect this behavior, the best telemetry sources are Windows registry change logs, particularly those monitoring modifications in the `/SOFTWARE/Microsoft/Office/` path and its associated sub-keys such as the `ProtectedView` settings related to disabling protections for attachments and internet files.

  ### Investigation Steps
  - **Review Registry Logs:** Check Windows registry logs for changes under the `\SOFTWARE\Microsoft\Office\Security\ProtectedView` path. Pay particular attention to entries changing values from `0` (enabled) to `1` (disabled) for keys that control Protected View settings.

  - **Analyze Process Creation Events:** Look for suspicious instances of Microsoft Office applications being executed, especially during times correlating with registry changes. Note any unexpected command-line arguments that may indicate the opening of potentially harmful documents.

  - **Correlate with User Activity:** Cross-reference the timing of registry changes with the activities of the user accounts involved (e.g., login times, document access). Identify any unusual user behavior that might be associated with known threat actors or compromised accounts.

  - **Investigate File Sources:** Analyze the paths from which documents are being opened. Check if there are any unusual SMB shares, internet URLs, or other non-standard locations suggesting potential malicious file deliveries.

  ### Prioritization
  This alert has a **high** severity as disabling Microsoft Office's Protected View not only increases the risk of malware execution but also indicates potential active targeting of users to facilitate further compromise and data theft within the enterprise environment.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if registry auditing is not enabled or if logs are not retained for sufficient duration. The detection logic assumes that all crucial registry paths are monitored reliably, and access rights to modify these registry settings are appropriately restricted. If users have legitimate reasons to modify these values, this may lead to false negatives. The alert relies on the presence of registry logs and the configuration of Windows security auditing to effectively function.

