note: |
  ### Technical Context

  This detection identifies modifications to the Microsoft Office registry settings that disable the Protected View feature. Attackers often aim to bypass security measures to execute malicious documents without raising alerts, thus facilitating malware execution or data exfiltration. The relevant MITRE ATT&CK tactic is Defense Evasion, specifically the technique ID T1685 (Disable Security Features).

  The primary telemetry source is Windows registry modification logs, with the focal point being changes to specific Protected View keys. If malicious, disabling Protected View increases the risk of successful malware delivery via Office documents. This detection does NOT confirm that malicious activity has occurred on its own; it simply highlights a potential security configuration issue that warrants further investigation.

  ### Investigation Steps

  - **Check registry modification logs:** Review Windows Registry logs for Event ID 13 (Registry Key Change) that show modifications to `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Office\*\Security\ProtectedView`.

  - **Identify the specific changes:** Look for entries where `DisableAttachmentsInPV`, `DisableInternetFilesInPV`, or similar keys are set to '1' (DWORD: 0x00000001). Confirm against the expected value of '0' for these keys in a secure environment.

  - **Examine user context:** Analyze who made the registry change. Check the Security Event ID 4624 (Logon) to verify if the user has a legitimate reason for disabling Protected View or if it coincides with suspicious behavior.

  - **Assess recent document activity:** Look at Office application logs or File access logs (e.g., Event ID 4663) to identify any recent file actions that correspond with the timing of the registry change, particularly focusing on files from email attachments or untrusted sources.

  - **Review security policies:** Confirm that organizational security policies require Protected View to remain enabled. Compare the current registry settings with a baseline configuration.

  - **Correlate to known threat actor tactics:** Investigate any recent alerts related to T1562.001 (Disable Security Features) or compare the behavior against known actor patterns that utilize Office files for malware delivery, to enhance context on the malicious intent.

  ### Prioritization

  This alert should be treated with high severity due to the impact of possible malware execution on affected systems, particularly if they handle sensitive data. The likelihood of malicious abuse is significant, as disabling Protected View is a common tactic used by threat actors to facilitate exploitation through documents. This behavior is weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of adequate auditing on registry changes or by legitimate administrative actions on the systems. Changes could also be implemented by third-party software not controlled by the enterprise. Legitimate scenarios that may trigger this alert include endpoint management tools making updates. Companion detections include monitoring changes to document handling policies or alerts triggered by the opening of documents with macros enabled.

