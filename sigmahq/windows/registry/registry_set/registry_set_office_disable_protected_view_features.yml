logsource:
  product: windows
  category: registry_set
detection:
  selection_path:
    TargetObject|contains|all:
    - '\SOFTWARE\Microsoft\Office\'
    - '\Security\ProtectedView\'
  selection_values_1:
    Details: 'DWORD (0x00000001)'
    TargetObject|endswith:
    - '\DisableAttachementsInPV'         # Turn off Protected View for attachments opened from Outlook
    - '\DisableInternetFilesInPV'         # Turn off Protected View for files downloaded from Internet zone
    - '\DisableIntranetCheck'         # Turn off Protected View for file located in UNC paths
    - '\DisableUnsafeLocationsInPV'         # Turn off Protected View for unsafe locations
  selection_values_0:
    Details: 'DWORD (0x00000000)'
    TargetObject|endswith:
    - '\enabledatabasefileprotectedview'
    - '\enableforeigntextfileprotectedview'
  condition: selection_path and 1 of selection_values_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects changes to the Windows registry settings that control Microsoft Office's Protected View feature, specifically when an attacker disables protections designed to prevent malicious documents from executing harmful code. An adversary might aim to exploit document-based vulnerabilities by bypassing these safeguards to allow potentially malicious content to execute. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (ID: T1562.001). The primary telemetry source is the Windows Registry, particularly observations of registry modifications relevant to Microsoft Office. If malicious, this behavior can lead to the execution of malware embedded in Office documents, significantly increasing the risk to the enterprise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate configuration changes may occur.

  ### Investigation Steps

  - **Check for registry changes:** Examine the registry for the following events:
    - Path: `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Office\16.0\Security\ProtectedView`
    - Look for DWORD values being set to `0x00000001` for keys like `DisableAttachmentsInPV`, indicating that Protected View has been turned off.

  - **Corroborate change source:** Identify the process that made the registry changes by collecting Process Creation events (Event ID 4688). Check for known Office applications, particularly Word or Excel, as their processes being responsible indicates potential benign activity.

  - **Review recent documents opened:** Investigate the user's recent document access patterns (e.g., Event ID 4663 or file access logs) to find any dubious documents accessed. Unusual file types or sources (especially documents from unknown external emails) could indicate malicious intent.

  - **Verify historical settings:** Check for previous registry settings by looking into change logs or system restore points (if applicable) to identify whether this is a recent change or part of a legitimate configuration in place for a longer duration.

  - **Identify endpoints at risk:** Assess asset criticality by reviewing whether the affected system has elevated privileges or is part of a sensitive environment. An endpoint with access to sensitive data is inherently more vulnerable if Protected View is disabled.

  ### Prioritization

  This alert should be treated with high severity given the potential impact on sensitive information and the likelihood of abuse. Disabling Protected View is a common tactic leveraged by adversaries to facilitate malware deployment through manipulated documents, making it a noteworthy indicator of possible compromise.

  ### Blind Spots and Assumptions

  Evasion techniques such as direct registry manipulation via legitimate software can mask malicious activity. Detection relies on having detailed logging enabled for the Windows Registry, as well as appropriate rights to monitor these changes effectively. Legitimate IT changes, such as updates from system administrators to adjust Office configurations, may trigger this alert. A related detection to monitor is any unusual process creation (Event ID 4688) involving Microsoft Office applications, further bolstering the ability to identify compromises related to document processing.

