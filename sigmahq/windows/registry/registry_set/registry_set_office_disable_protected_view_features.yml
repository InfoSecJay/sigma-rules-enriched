logsource:
  product: windows
  category: registry_set
detection:
  selection_path:
    TargetObject|contains|all:
    - '\SOFTWARE\Microsoft\Office\'
    - '\Security\ProtectedView\'
  selection_values_1:
    Details: 'DWORD (0x00000001)'
    TargetObject|endswith:
    - '\DisableAttachementsInPV'         # Turn off Protected View for attachments opened from Outlook
    - '\DisableInternetFilesInPV'         # Turn off Protected View for files downloaded from Internet zone
    - '\DisableIntranetCheck'         # Turn off Protected View for file located in UNC paths
    - '\DisableUnsafeLocationsInPV'         # Turn off Protected View for unsafe locations
  selection_values_0:
    Details: 'DWORD (0x00000000)'
    TargetObject|endswith:
    - '\enabledatabasefileprotectedview'
    - '\enableforeigntextfileprotectedview'
  condition: selection_path and 1 of selection_values_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects changes to registry keys associated with Microsoft Office’s Protected View feature, which is designed to protect users from potentially harmful content in documents. By disabling these security settings, an attacker may be attempting to manipulate Office applications to execute malicious payloads, thereby affecting the integrity and confidentiality of the targeted system. This behavior is typically indicative of an initial access or execution stage in the attack lifecycle.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1562), specifically under the technique **Disable or Modify Security Features** (T1562.001). The primary telemetry source for this detection is Windows registry activity, monitored through registry logs and events. If malicious, altering these registry keys can lead to increased susceptibility to malware exploitation and data compromise. This detection does NOT confirm that an attack is successful; it merely indicates a potential action taken to weaken security controls.

  ### Investigation Steps

  - **Review the registry modification events:** Check Windows Security Event ID 4657 to identify specific changes to the registry keys under `HKCU\Software\Microsoft\Office\` related to Protected View settings.

  - **Identify known malicious indicators:** Look for the presence of `DWORD (0x00000001)` for keys such as `DisableAttachmentsInPV` and `DisableInternetFilesInPV` in recent registry changes. If these values are found, it may indicate an adversarial action intending to bypass security features.

  - **Correlate with user activity:** Analyze user behavior around the time the change was detected by reviewing logon events (Security Event ID 4624) and Office document access logs (Event ID 4624 for logon followed by document interactions). Legitimate users may enable these settings to work with trusted documents; document names can aid in contextual analysis.

  - **Check for other concurrent registry modifications:** Assess Windows Event ID 4657 for any other suspicious registry changes during that timeframe; this could highlight a broader attempt to disable security mechanisms.

  - **Assess endpoint protection status:** Verify that endpoint security solutions (like antivirus or EDR) are operational on the affected system. An absence may indicate tampering, creating additional risk.

  - **Investigate associated alerts or incidents:** Analyze prior activity logs for related alerts, such as unexpected collections of Office documents, which could indicate an ongoing compromise. Companion detection rules focusing on macro executions or abnormal document access behavior may provide further insights.

  ### Prioritization

  This alert should be prioritized as high severity due to the potential impact on Office applications, which may directly facilitate malware execution or data exfiltration. The likelihood of exploitation is significant since disabling Protected View is commonly weaponized by attackers to facilitate access to malicious content in documents.

  ### Blind Spots and Assumptions

  Limitations in detection may arise from the ability of adversaries to revert registry changes or use legitimate privileges to modify these settings undetected. Required log sources include comprehensive registry monitoring to catch all changes effectively. Additionally, legitimate scenarios—like software updates or corporate policy changes—may also trigger the alert. Related detections, such as monitoring for changes to macros in Office documents, can enhance overall security coverage against similar threats.

