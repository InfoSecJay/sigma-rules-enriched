logsource:
  category: registry_set
  product: windows
detection:
  selection_wow_current_version_base:
    TargetObject|contains: '\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion'
  selection_wow_current_version_keys:
    TargetObject|contains:
    - '\ShellServiceObjectDelayLoad'
    - '\Run\'
    - '\RunOnce\'
    - '\RunOnceEx\'
    - '\RunServices\'
    - '\RunServicesOnce\'
    - '\Explorer\ShellServiceObjects'
    - '\Explorer\ShellIconOverlayIdentifiers'
    - '\Explorer\ShellExecuteHooks'
    - '\Explorer\SharedTaskScheduler'
    - '\Explorer\Browser Helper Objects'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_ms_win_desktop_runtime:
    Details|startswith: '"C:\ProgramData\Package Cache\{d21a4f20-968a-4b0c-bf04-a38da5f06e41}\windowsdesktop-runtime-'
  filter_main_vcredist:
    Image|endswith: '\VC_redist.x64.exe'
    Details|endswith: '}\VC_redist.x64.exe" /burn.runonce'
  filter_main_upgrades:
    Image|startswith:
    - 'C:\ProgramData\Package Cache'
    - 'C:\Windows\Temp\'
    Image|contains:
    - '\winsdksetup.exe'
    - '\windowsdesktop-runtime-'          # C:\WINDOWS\Temp\{751E2E78-46DC-4376-9205-99219CDC34AE}\.be\windowsdesktop-runtime-6.0.12-win-x86.exe
    - '\AspNetCoreSharedFrameworkBundle-'          # "C:\ProgramData\Package Cache\{b52191c1-a9c0-4b34-9a4e-930c2dd8a540}\AspNetCoreSharedFrameworkBundle-x86.exe" /burn.runonce
    Details|endswith: ' /burn.runonce'
  filter_main_uninstallers:
        # This image path is linked with different uninstallers when running as admin unfortunately
    Image|startswith: 'C:\Windows\Installer\MSI'
    TargetObject|contains: '\Explorer\Browser Helper Objects'
  filter_main_msiexec:
    Image: 'C:\WINDOWS\system32\msiexec.exe'
    TargetObject|contains: '\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
  filter_main_edge:
    Image|contains|all:
    - 'C:\Program Files (x86)\Microsoft\EdgeUpdate\Install\{'
    - '\setup.exe'
  filter_optional_msoffice1:
    Image: 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\OfficeClickToRun.exe'
    TargetObject|contains: '\Office\ClickToRun\REGISTRY\MACHINE\Software\Wow6432Node\'
  filter_optional_msoffice2:
    Image:
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    TargetObject|contains: '\Explorer\Browser Helper Objects\{31D09BA0-12F5-4CCE-BE8A-2923E76605DA}\'
  filter_optional_dropbox:
  - Details|endswith: '-A251-47B7-93E1-CDD82E34AF8B}'
  - Details: 'grpconv -o'
  - Details|contains|all:
    - 'C:\Program Files'
    - '\Dropbox\Client\Dropbox.exe'
    - ' /systemstartup'
  filter_optional_evernote:
    TargetObject|endswith: '\Explorer\Browser Helper Objects\{92EF2EAD-A7CE-4424-B0DB-499CF856608E}\NoExplorer'
  filter_optional_dotnet:
    Image|contains: '\windowsdesktop-runtime-'
    TargetObject|endswith:
    - '\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce\{e2d1ae32-dd1d-4ad7-a298-10e42e7840fc}'
    - '\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce\{7037b699-7382-448c-89a7-4765961d2537}'
    Details|startswith: '"C:\ProgramData\Package Cache\'
    Details|endswith: '.exe" /burn.runonce'
  filter_optional_office:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_optional_discord:
    TargetObject|endswith: '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run\Discord'
    Details|endswith: 'Discord.exe --checkInstall'
  filter_optional_avira:
    Details|endswith: '\Avira.OE.Setup.Bundle.exe" /burn.runonce'
    Image|endswith: '\Avira.OE.Setup.Bundle.exe'
  filter_optional_avg_1:
    Image|endswith: '\instup.exe'
    TargetObject|endswith: '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce\AvRepair'
    Details|endswith: 'instup.exe" /instop:repair /wait'
  filter_optional_avg_2:
    Image|endswith: '\instup.exe'
    TargetObject|endswith:
    - '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers\00avg\(Default)'
    - '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers\00asw\(Default)'
    Details:
    - '{472083B1-C522-11CF-8763-00608CC02F24}'
    - '{472083B0-C522-11CF-8763-00608CC02F24}'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects modifications to Windows registry autorun keys within the Wow6432Node directory, which is often used by malicious actors for persistence. The likely attacker objective is to establish a foothold on the system by ensuring that a malicious payload executes automatically upon user login. This behavior aligns with the MITRE ATT&CK technique for persistence: **Registry Run Keys / Startup Folder (T1547.001)**.

  The primary telemetry sources for this detection are Windows Registry logs capturing changes (generated through tools like Sysmon or directly monitoring registry set events). If malicious, the modification of these keys can facilitate the automatic execution of malware, thereby maintaining long-term access. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; benign modifications can occur from legitimate software installations or administrative actions.

  ---

  ### Investigation Steps

  - **Review registry changes**: Check for `Event ID 4657` (Audit Registry) focusing on modifications to `HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\`. Malicious changes often involve new or altered executables that are not recognized or present in established software inventories.

  - **Cross-reference with running processes**: Match the modified autorun entries with current processes using `Event ID 4688` (Process Creation). Validate if any suspicious processes correspond to the autorun keys. Legitimate software installations may include entries from known software vendors.

  - **Analyze details of modification**: Scrutinize the `Details` field associated with the registry change. Look for indicative strings such as `"/burn.runonce"` that can suggest a potentially malicious change prompted by an installer or updater process.

  - **Verify for common benign entries**: Identify modifications made by legitimate applications like Microsoft Office or system updates. For example, check if the change was triggered by `C:\Program Files\Common Files\Microsoft Shared\ClickToRun\OfficeClickToRun.exe`, which is expected behavior during Office installations.

  - **Check for other indicators of compromise (IOCs)**: Look for unusual behavior in conjunction with the registry modification, such as unusual network traffic or additional file creations in `%TEMP%` or `%APPDATA%` that would indicate potential malware presence.

  - **Examine for evasion techniques**: Investigate if the changes relate to known products that are susceptible to abuse, such as editing keys to hide malicious executables or using unmonitored MSI execution paths (`C:\Windows\Installer\MSI`). Confirm no legitimate upgrade routines are implicated.

  ---

  ### Prioritization

  This alert should be classified as medium severity due to its potential impact on system integrity, given that persistence mechanisms are commonly targeted by adversaries. The likelihood of malicious exploitation is heightened since changes to autorun keys are a known tactic for maintaining presence on compromised hosts.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if registry auditing is not properly configured; the absence of real-time logging can result in missed modifications. Legitimate software installations or administrative tasks may trigger similar alerts, complicating the analysis. A companion detection to consider is monitoring process execution patterns alongside registry changes to provide a more comprehensive picture of potential threats occurring within the environment.

