logsource:
  category: registry_set
  product: windows
detection:
  selection_wow_current_version_base:
    TargetObject|contains: '\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion'
  selection_wow_current_version_keys:
    TargetObject|contains:
    - '\ShellServiceObjectDelayLoad'
    - '\Run\'
    - '\RunOnce\'
    - '\RunOnceEx\'
    - '\RunServices\'
    - '\RunServicesOnce\'
    - '\Explorer\ShellServiceObjects'
    - '\Explorer\ShellIconOverlayIdentifiers'
    - '\Explorer\ShellExecuteHooks'
    - '\Explorer\SharedTaskScheduler'
    - '\Explorer\Browser Helper Objects'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_ms_win_desktop_runtime:
    Details|startswith: '"C:\ProgramData\Package Cache\{d21a4f20-968a-4b0c-bf04-a38da5f06e41}\windowsdesktop-runtime-'
  filter_main_vcredist:
    Image|endswith: '\VC_redist.x64.exe'
    Details|endswith: '}\VC_redist.x64.exe" /burn.runonce'
  filter_main_upgrades:
    Image|startswith:
    - 'C:\ProgramData\Package Cache'
    - 'C:\Windows\Temp\'
    Image|contains:
    - '\winsdksetup.exe'
    - '\windowsdesktop-runtime-'          # C:\WINDOWS\Temp\{751E2E78-46DC-4376-9205-99219CDC34AE}\.be\windowsdesktop-runtime-6.0.12-win-x86.exe
    - '\AspNetCoreSharedFrameworkBundle-'          # "C:\ProgramData\Package Cache\{b52191c1-a9c0-4b34-9a4e-930c2dd8a540}\AspNetCoreSharedFrameworkBundle-x86.exe" /burn.runonce
    Details|endswith: ' /burn.runonce'
  filter_main_uninstallers:
        # This image path is linked with different uninstallers when running as admin unfortunately
    Image|startswith: 'C:\Windows\Installer\MSI'
    TargetObject|contains: '\Explorer\Browser Helper Objects'
  filter_main_msiexec:
    Image: 'C:\WINDOWS\system32\msiexec.exe'
    TargetObject|contains: '\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
  filter_main_edge:
    Image|contains|all:
    - 'C:\Program Files (x86)\Microsoft\EdgeUpdate\Install\{'
    - '\setup.exe'
  filter_optional_msoffice1:
    Image: 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\OfficeClickToRun.exe'
    TargetObject|contains: '\Office\ClickToRun\REGISTRY\MACHINE\Software\Wow6432Node\'
  filter_optional_msoffice2:
    Image:
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    TargetObject|contains: '\Explorer\Browser Helper Objects\{31D09BA0-12F5-4CCE-BE8A-2923E76605DA}\'
  filter_optional_dropbox:
  - Details|endswith: '-A251-47B7-93E1-CDD82E34AF8B}'
  - Details: 'grpconv -o'
  - Details|contains|all:
    - 'C:\Program Files'
    - '\Dropbox\Client\Dropbox.exe'
    - ' /systemstartup'
  filter_optional_evernote:
    TargetObject|endswith: '\Explorer\Browser Helper Objects\{92EF2EAD-A7CE-4424-B0DB-499CF856608E}\NoExplorer'
  filter_optional_dotnet:
    Image|contains: '\windowsdesktop-runtime-'
    TargetObject|endswith:
    - '\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce\{e2d1ae32-dd1d-4ad7-a298-10e42e7840fc}'
    - '\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce\{7037b699-7382-448c-89a7-4765961d2537}'
    Details|startswith: '"C:\ProgramData\Package Cache\'
    Details|endswith: '.exe" /burn.runonce'
  filter_optional_office:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_optional_discord:
    TargetObject|endswith: '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Run\Discord'
    Details|endswith: 'Discord.exe --checkInstall'
  filter_optional_avira:
    Details|endswith: '\Avira.OE.Setup.Bundle.exe" /burn.runonce'
    Image|endswith: '\Avira.OE.Setup.Bundle.exe'
  filter_optional_avg_1:
    Image|endswith: '\instup.exe'
    TargetObject|endswith: '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\RunOnce\AvRepair'
    Details|endswith: 'instup.exe" /instop:repair /wait'
  filter_optional_avg_2:
    Image|endswith: '\instup.exe'
    TargetObject|endswith:
    - '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers\00avg\(Default)'
    - '\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Explorer\ShellIconOverlayIdentifiers\00asw\(Default)'
    Details:
    - '{472083B1-C522-11CF-8763-00608CC02F24}'
    - '{472083B0-C522-11CF-8763-00608CC02F24}'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects modifications to autorun registry keys in the Windows Wow6432Node that may indicate persistence mechanisms employed by attackers, specifically the alteration of autostart extensibility points (ASEP) in the Windows registry. The likely objective of such behavior is to ensure that malicious payloads are executed on system startup, providing adversaries with persistent access. This activity maps to the MITRE ATT&CK technique for persistence via Registry Run Keys/Startup Folder (T1547.001).

  The primary telemetry source includes Windows Registry logs, specifically focusing on modifications to keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\[Run, RunOnce, etc.]`. The security impact of this behavior can be significant, as it may allow malware to re-establish itself or maintain control over a compromised system. However, this detection does NOT confirm malicious intent on its own, as legitimate software installations or administrative tasks may trigger similar modifications.

  ---

  ### Investigation Steps

  - **Check registry modification details:** Review the Windows Registry Event ID 4657, focusing on changes to keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\` for any unauthorized changes, especially in `Run` or `RunOnce`.

  - **Identify malicious indicators:** Look for any PowerShell or command-line activity (Event ID 4688) that involves the execution of unusual or unknown executables linked to the registry keys that were modified, such as commands containing `"%temp%"` or references to suspicious file paths.

  - **Review recent software installations:** Inspect for legitimate software that may have modified these autorun keys, focusing on known applications such as Microsoft Office (`OfficeClickToRun.exe`) or security software (e.g., `Avira`, `AVG`). Cross-reference the changes against approved software lists.

  - **Assess system impact:** Determine if the affected system has critical roles (e.g., domain controllers, databases) or contains sensitive data that might escalate the urgency of the alert.

  - **Baseline expected behavior:** Collect and compare against historical registry access patterns to identify normal behavior in the environment, aiming to establish a baseline of what legitimate registry modifications look like.

  ---

  ### Prioritization

  This alert carries a medium severity, as the modification of autorun keys can indicate potential persistence mechanisms that are often weaponized by malicious actors. Systems in critical roles, like servers or endpoints storing sensitive data, heighten the potential impact of such alterations. While not always indicative of actual compromise, the likelihood of misuse warrants prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may miss scenarios where legitimate software modifications occur due to automated installations or admin actions, potentially leading to false positives. Additionally, if logging is not properly configured for registry modifications, this detection may not capture all relevant activity. Certain software (like system updates or security tools) may also trigger the rule without malicious intent. It is advisable to have companion detections focused on process execution and network connections to further enhance visibility into potential malicious behavior.

  ---

