title: Persistence Via New SIP Provider
id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
status: test
description: Detects when an attacker register a new SIP provider for persistence
  and defense evasion
references:
- https://persistence-info.github.io/Data/codesigning.html
- https://github.com/gtworek/PSBits/tree/master/SIP
- https://specterops.io/assets/resources/SpecterOps_Subverting_Trust_in_Windows.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1553.003
logsource:
  category: registry_set
  product: windows
detection:
  selection_root:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Cryptography\Providers\'
    - '\SOFTWARE\Microsoft\Cryptography\OID\EncodingType'
    - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers\'
    - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\OID\EncodingType'
  selection_dll:
    TargetObject|contains:
    - '\Dll'
    - '\$DLL'
  filter:
    Details:
            # Add more legitimate SIP providers according to your env
    - WINTRUST.DLL
    - mso.dll
  filter_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
    TargetObject|contains: '\CryptSIPDll'
    Details: 'C:\Windows\System32\PsfSip.dll'
  condition: all of selection_* and not 1 of filter*
falsepositives:
- Legitimate SIP being registered by the OS or different software.
level: medium
note: |
  ### Technical Context
  This rule is designed to detect activities that indicate an attacker has registered a new SIP (Software-initiated Installation Protocol) provider as a persistence mechanism within a Windows environment. SIP providers can facilitate various functions, including cryptographic processing, and by registering a malicious SIP, an attacker can maintain persistent access and evade detection. The objective of such an action typically includes establishing a foothold in the environment, allowing for later exploitation, lateral movement, or data exfiltration.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1553.003)**, which focuses on techniques that allow adversaries to maintain a presence on systems despite restarts or other interruptions. In addition, **Defense Evasion (T1565.001)** could apply, as attackers may exploit SIP registration to obscure their activities from security monitoring.

  The primary data source for this detection rule is the Windows registry, particularly registry modification events related to SIP providers. Monitoring changes to specific registry paths associated with SIP registrations will yield critical evidence of potentially malicious activities.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent modifications to the specified registry keys related to SIP providers. Pay special attention to any additions or changes that are not part of the known legitimate SIP providers list.

  - **Analyze Process Logs:** Investigate process creation logs for `poqexec.exe` activations, particularly those related to suspicious DLLs (e.g., `PsfSip.dll`). This may indicate an attempt to register a new SIP provider.

  - **Monitor Security Events:** Check for unusual logins or other events that might correlate with the time a new SIP provider was registered, indicating possible lateral movement or exploitation techniques being employed simultaneously.

  - **Validate SIP Providers:** Compile a list of known legitimate SIP providers within your organization. Compare this against the registry entries to identify unauthorized SIP registrations.

  ### Prioritization
  This alert carries a medium-level severity due to the potential high impact of persistent threats in an enterprise environment. The likelihood of attackers employing such techniques increases as organizations become more targeted, making rapid response critical to mitigate any potential breaches.

  ### Blind Spots and Assumptions
  Gaps in detection coverage may arise from environments where legitimate SIP registrations occur frequently, which could lead to false positives if the detection logic isn't finely tuned. Additionally, this rule assumes that the logging of registry modifications is enabled and properly configured on monitored systems; without comprehensive logging, this detection may miss critical events. It also presupposes that analysts know which SIP providers are legitimate within their unique context to accurately assess the detection results.

