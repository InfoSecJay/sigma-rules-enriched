title: Persistence Via New SIP Provider
id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
status: test
description: Detects when an attacker register a new SIP provider for 
  persistence and defense evasion
references:
- https://persistence-info.github.io/Data/codesigning.html
- https://github.com/gtworek/PSBits/tree/master/SIP
- https://specterops.io/assets/resources/SpecterOps_Subverting_Trust_in_Windows.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1553.003
logsource:
  category: registry_set
  product: windows
detection:
  selection_root:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Cryptography\Providers\'
    - '\SOFTWARE\Microsoft\Cryptography\OID\EncodingType'
    - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers\'
    - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\OID\EncodingType'
  selection_dll:
    TargetObject|contains:
    - '\Dll'
    - '\$DLL'
  filter:
    Details:
            # Add more legitimate SIP providers according to your env
    - WINTRUST.DLL
    - mso.dll
  filter_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
    TargetObject|contains: '\CryptSIPDll'
    Details: 'C:\Windows\System32\PsfSip.dll'
  condition: all of selection_* and not 1 of filter*
falsepositives:
- Legitimate SIP being registered by the OS or different software.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the registration of new SIP (Software Installation and Protection) providers in Windows, which is a technique commonly used by attackers to establish persistence and evade detection. The likely objective of an attacker utilizing this method is to execute malicious code with legitimate-sounding library names, allowing them to bypass security measures. This behavior aligns with the MITRE ATT&CK technique for Persistence via “Software Installation/Protection (SIP) Provider” (T1553.003).

  Primary telemetry sources include Windows Registry events, particularly focusing on changes under paths associated with SIP Providers, such as `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Providers`. If malicious, the implant could allow an adversary to maintain control over compromised assets. However, this detection does NOT confirm active exploitation or malicious intent without further context and corroborative evidence.

  ### Investigation Steps

  - **Review Registry Changes for Anomalies:** Check Windows Registry logs (Event ID 4657, Security Log) for recent changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Cryptography\Providers`. Look for any unusual DLL names registered that are not part of standard operations.

  - **Assess SIP Provider DLLs:** Examine the DLLs being registered in the registry (Event ID 4657). Confirm that registered DLLs do not match known legitimate providers (e.g., WINTRUST.DLL, mso.dll). Malicious indicators may include unfamiliar or suspicious file names.

  - **Identify the Initial Actor:** Investigate the process that initiated the SIP registration using Sysmon Event ID 1 for process creation. Check if it correlates with `poqexec.exe`, which can be indicative of a compromise, especially if the originating process is not part of legitimate software deployment.

  - **Analyze Asset Role and Permissions:** Determine if the device registering the SIP provider has elevated privileges or if it plays a critical role in your environment (e.g., Domain Controllers, file servers). If anomalous behavior originates from these assets, prioritize the investigation.

  - **Validate Legitimate Usage:** Identify whether known legitimate applications on your network might register SIP providers under expected conditions. Compare against your baseline behavior to ascertain if recent activities seem consistent with that.

  ### Prioritization

  This alert has a medium severity level. The impact is heightened if the affected system is critical, such as domain controllers or servers hosting sensitive operations. The detection of new SIP providers is a known tactic for malicious actors, making it imperative to investigate swiftly.

  ### Blind Spots and Assumptions

  Potential evasion techniques include attackers using legitimate software to register SIP providers, making detection more challenging. Ensure that Windows Registry auditing is enabled to capture necessary changes comprehensively. Legitimate software installation may trigger similar alerts. Consider companion detections for unusual process execution patterns that could indicate broader exploitation, such as Sysmon alerts for unintended network connections during SIP registration events.

