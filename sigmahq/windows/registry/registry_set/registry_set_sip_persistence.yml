title: Persistence Via New SIP Provider
id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
status: test
description: Detects when an attacker register a new SIP provider for 
  persistence and defense evasion
references:
- https://persistence-info.github.io/Data/codesigning.html
- https://github.com/gtworek/PSBits/tree/master/SIP
- https://specterops.io/assets/resources/SpecterOps_Subverting_Trust_in_Windows.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1553.003
logsource:
  category: registry_set
  product: windows
detection:
  selection_root:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Cryptography\Providers\'
    - '\SOFTWARE\Microsoft\Cryptography\OID\EncodingType'
    - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers\'
    - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\OID\EncodingType'
  selection_dll:
    TargetObject|contains:
    - '\Dll'
    - '\$DLL'
  filter:
    Details:
            # Add more legitimate SIP providers according to your env
    - WINTRUST.DLL
    - mso.dll
  filter_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
    TargetObject|contains: '\CryptSIPDll'
    Details: 'C:\Windows\System32\PsfSip.dll'
  condition: all of selection_* and not 1 of filter*
falsepositives:
- Legitimate SIP being registered by the OS or different software.
level: medium
note: |
  ### Technical Context

  This rule detects attempts to register a new SIP (Software Publisher Identification) provider in the Windows registry, a common technique employed by attackers to establish persistence and evade defense mechanisms. The likely objective is to manipulate code-signing processes through malicious DLL files, allowing the execution of unauthorized code while masking its presence. This behavior is mapped to the MITRE ATT&CK technique T1553.003: "Software Dependencies." Primary telemetry sources include Windows Registry logs, specifically events related to changes in the `HKEY_LOCAL_MACHINE` or `HKEY_CURRENT_USER` registry hives, focusing on paths related to cryptographic providers. If malicious, this can lead to unauthorized code execution and persistence within the environment. However, it is crucial to note that this detection does NOT confirm malicious intent on its own; further investigation is necessary to assess the context and legitimacy of the activity.

  ### Investigation Steps

  - **Check for suspicious registry modifications:** Review Windows Registry Event ID 4657 for any changes made to the sensitive paths `\SOFTWARE\Microsoft\Cryptography\Providers\` or `\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers\`. Look for entries that were added around the same time as the alert and verify their legitimacy against known software.

  - **Identify malicious DLL indicators:** Review the DLLs registered within the SIP context, particularly those containing `\Dll` or `\$DLL`. Cross-check any unfamiliar entries against internal whitelists or known malicious DLL hashes.

  - **Validate legitimate SIP activity:** Investigate processes updating SIP providers by reviewing Event ID 4688 related to process creation. Look for entries involving legitimate SIP DLLs, such as `WINTRUST.DLL` or `mso.dll`. Legitimate updates typically originate from trusted system processes.

  - **Analyze execution context of associated processes:** Examine the execution path of `poqexec.exe` (Event ID 4688), checking for abnormal command-line arguments or unusual parent processes, which can indicate malicious activity.

  - **Review file creation for indicators of compromise:** Check for file creation events associated with `PsfSip.dll` (Sysmon Event ID 11) to see if this file was created in unusual locations or at irregular times, which could indicate a malicious registration attempt.

  ### Prioritization

  This alert is of medium severity as it may indicate a technique frequently utilized in targeted attacks to achieve persistence on critical systems. The likelihood of malicious abuse is considerable, given that this behavior is weaponized by sophisticated adversaries to gain long-lasting footholds within environments.

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate software inadvertently triggering the rule when registering SIP providers. The detection relies on consistent registry logging, thus ensuring relevant categories are enabled in the Windows security policies is crucial for reliable detection. Legitimate activities may include software updates or installations that register SIP providers. A related detection to consider for coverage is monitoring for unauthorized changes to system binaries or DLLs (e.g., T1203 - Exploitation for Client Execution).

