title: Suspicious Service Installed
id: f2485272-a156-4773-82d7-1d178bc4905b
status: test
description: |
  Detects installation of NalDrv or PROCEXP152 services via registry-keys to non-system32 folders.
  Both services are used in the tool Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU (https://github.com/hfiref0x/KDU)
references:
- https://web.archive.org/web/20200419024230/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2023-08-17
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject:
    - 'HKLM\System\CurrentControlSet\Services\NalDrv\ImagePath'
    - 'HKLM\System\CurrentControlSet\Services\PROCEXP152\ImagePath'
  filter:
    Image|endswith:
            # Please add the full paths that you use in your environment to tighten the rule
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
    - '\handle.exe'
    - '\handle64.exe'
    Details|contains: '\WINDOWS\system32\Drivers\PROCEXP152.SYS'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this service names and drivers. Note - clever 
  attackers may easily bypass this detection by just renaming the services. 
  Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ### Technical Context

  This rule detects the installation of two suspicious services, NalDrv and PROCEXP152, through registry modifications to non-system32 directories, indicating the deployment of potentially malicious tools associated with Ghost-In-The-Logs. The likely objective of the attacker is to establish control over the system through stealthy backdoor access via a kernel driver, enabling further exploitation. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion, specifically T1685: Driver Load.

  The primary telemetry source is Windows Registry activity, specifically monitoring changes to HKLM\System\CurrentControlSet\Services\. If malicious, the impact could range from privilege escalation to full system compromise. It should be noted that this detection does not confirm active exploitation but rather the presence of potentially malicious software components.

  ### Investigation Steps

  - **Check registry paths for service modifications**: Examine the Windows Registry for entries under HKLM\System\CurrentControlSet\Services\. Look for NalDrv and PROCEXP152 entries with non-standard ImagePath values (e.g., not pointing to system32).

  - **Review recent process creation events**: Analyze Security Event ID 4688 and Sysmon Event ID 1 for any process creation that includes procexp64.exe or procmon.exe. Benign activity typically shows these processes running from C:\Windows\System32 or legitimate paths.

  - **Validate user and process owner**: For the detected services, review account names and process owners. Legitimate processes are typically run by system or administrative accounts, while suspicious ones may show unusual or non-standard accounts.

  - **Analyze driver signatures**: Investigate properties of the loaded driver PROCEXP152.SYS using the DriverQuery command or checking for its digital signature. Legitimate drivers will have valid certificates and should not be listed as unsigned.

  - **Audit file history for tampering**: Cross-check recent file modifications or creations in the suspected directories using Sysmon Event ID 11 or Windows File Audit logs. Legitimate administrative tasks should correlate with authorized user actions.

  - **Look for known indicators of compromise (IOCs)**: Search for known hash values associated with Ghost-In-The-Logs tools or related malicious binaries in threat intelligence platforms. High-confidence indicators include hashes of procexp64.exe or procmon.exe if they differ from expected values.

  ### Prioritization

  This alert is of medium severity. While the presence of NalDrv and PROCEXP152 services can indicate potential malware installation, their nature and the context in which they appear will influence the response. The likelihood of malicious use is moderate, as these tools are often weaponized for stealth operations.

  ### Blind Spots and Assumptions

  Evasion techniques such as renaming services or altering the registry path can bypass this detection. Reliable detection requires properly configured Windows Registry monitoring; without full coverage, malicious actors may avoid capture. Legitimate software installations or administrative tools that utilize similar service names may trigger the alert. A complementary detection could include monitoring for unusual driver signatures (e.g., unsigned drivers or those not typically found in enterprise environments) to bolster visibility.

