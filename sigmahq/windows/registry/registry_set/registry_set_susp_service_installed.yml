title: Suspicious Service Installed
id: f2485272-a156-4773-82d7-1d178bc4905b
status: test
description: |
  Detects installation of NalDrv or PROCEXP152 services via registry-keys to non-system32 folders.
  Both services are used in the tool Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU (https://github.com/hfiref0x/KDU)
references:
- https://web.archive.org/web/20200419024230/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2026-06-29
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject:
    - 'HKLM\System\CurrentControlSet\Services\NalDrv\ImagePath'
    - 'HKLM\System\CurrentControlSet\Services\PROCEXP152\ImagePath'
  filter:
    Image|endswith:
            # Please add the full paths that you use in your environment to tighten the rule
    - '\procexp64.exe'
    - '\procexp64a.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon64a.exe'
    - '\procmon.exe'
    - '\handle.exe'
    - '\handle64.exe'
    - '\handle64a.exe'
    Details|contains: '\WINDOWS\system32\Drivers\PROCEXP152.SYS'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this service names and drivers. Note - clever 
  attackers may easily bypass this detection by just renaming the services. 
  Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ### Technical Context

  This rule detects the installation of registry services related to the Ghost-In-The-Logs tool, specifically the NalDrv and PROCEXP152 services, which are commonly used to facilitate unauthorized system access and evasion during malicious activities. The likely attacker objective is to establish persistence on a compromised system while hiding their activity from standard monitoring tools. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005), specifically technique T1685: Credential Dumping - Credential Dumping from Credential Store.

  The primary telemetry sources are Windows registry logs, specifically focusing on changes to service configurations under the `HKLM\System\CurrentControlSet\Services` path. The security impact is significant; if malicious, it can lead to unauthorized access, data exfiltration, or further compromise of systems. Importantly, this detection does NOT confirm a successful compromise on its own; it only indicates the installation of potentially malicious services.

  ### Investigation Steps

  - **Verify the registry changes:** Check for recent entries associated with `HKLM\System\CurrentControlSet\Services\NalDrv` and `HKLM\System\CurrentControlSet\Services\PROCEXP152`. Look for the `ImagePath` field designating non-system32 directories, which may indicate potential malicious activity.

  - **Cross-reference installed services:** Use `sc query` to list the running services on the host. Confirm that no instances of `NalDrv` or `PROCEXP152` are present in legitimate Windows paths (e.g., `C:\Windows\System32`). Instances outside of this could indicate malicious tampering.

  - **Identify process execution logs:** Inspect Security Event ID 4688 (Process Creation) for the execution of any listed processes (e.g., `procexp.exe`, `procmon.exe`). Ensure the paths match known and legitimate installations located within `C:\Windows\System32`.

  - **Look for associated artifacts:** Check for file presence on the disk (using file system monitoring solutions) to confirm the installation of executables like `procexp64.exe` or `handle.exe`. Assess their properties for any anomalous creation timestamps or unusual authors.

  - **Assess user account activity:** Review Security Event ID 4624 (Logon Events) to investigate the context in which these services were installed. Look for unusual user account activity or logons from atypical systems that might correlate with the service installation time.

  ### Prioritization

  The alert severity is medium, as the detection indicates a higher risk of compromise but requires further investigation to confirm malicious intent. The presence of these services, particularly in non-standard directories, raises flags about potential misuse. While it reflects a technique that can be weaponized, it is not universally indicative of actual exploitation.

  ### Blind Spots and Assumptions

  This detection is limited by evasion techniques such as renaming the service or using legitimate service names to disguise malicious activity. Proper logging sources and configurations need to be enabled to ensure coverage, particularly for detailed registry changes. Legitimate software installations may occasionally trigger this alert, especially for correctly configured administrative tools that operate outside of standard directories. A complementary detection could involve monitoring for unexpected process execution associated with known credential dumping tools or suspicious file modifications in sensitive directories.

