title: Suspicious Service Installed
id: f2485272-a156-4773-82d7-1d178bc4905b
status: test
description: |
  Detects installation of NalDrv or PROCEXP152 services via registry-keys to non-system32 folders.
  Both services are used in the tool Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU (https://github.com/hfiref0x/KDU)
references:
- https://web.archive.org/web/20200419024230/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2023-08-17
tags:
- attack.t1562.001
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject:
    - 'HKLM\System\CurrentControlSet\Services\NalDrv\ImagePath'
    - 'HKLM\System\CurrentControlSet\Services\PROCEXP152\ImagePath'
  filter:
    Image|endswith:
            # Please add the full paths that you use in your environment to tighten the rule
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
    - '\handle.exe'
    - '\handle64.exe'
    Details|contains: '\WINDOWS\system32\Drivers\PROCEXP152.SYS'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this service names and drivers. Note - clever 
  attackers may easily bypass this detection by just renaming the services. 
  Therefore just Medium-level and don't rely on it.
level: medium
note: |
  ### Technical Context

  This detection rule identifies the installation of suspicious services, specifically `NalDrv` and `PROCEXP152`, via registry entries pointing to non-system32 directories. These services are associated with the `Ghost-In-The-Logs` exploitation tool, which is often used for persistence and evasion techniques in Windows environments. The relevant MITRE ATT&CK tactics include Defense Evasion (T1562.001) as attackers often try to hide their activities by using unconventional service paths.

  Primary telemetry sources include Windows Registry logs focusing on service installations, particularly the paths where service binaries are executed. If malicious, these installations can lead to persistent and undetected access by an adversary. Importantly, this detection does **not** confirm that the activity is malicious; legitimate tools may also install services with the same names, potentially leading to false positives.

  ### Investigation Steps

  - **Verify registry entries for service installations:** Check Forensic Registry Logs (Event ID 4657) for modifications to `HKLM\System\CurrentControlSet\Services\` for `NalDrv` and `PROCEXP152`. Look for non-standard paths that deviate from `C:\Windows\System32`.

  - **Inspect service image paths:** Validate the ImagePath values by checking for entries that do not point to the expected service directory. Malicious entries often indicate that the executable is located in a non-standard folder that is atypical for legitimate applications.

  - **Identify high-confidence malicious indicators:** Confirm whether the service binaries (`procexp64.exe`, etc.) were executed from non-standard paths using Sysmon logs (Event ID 1) that capture process creations. If they originate from directories like `C:\Users\` or `C:\Temp\`, treat this as a strong indicator of compromise.

  - **Review legitimate activity:** Legitimate software typically installs services into `C:\Windows\System32\`. Cross-reference any findings with known legitimate software deployments in your environment to rule out false positives.

  - **Correlate with endpoint behavior:** Assess recent behavioral analytics and security events around the time of detection to understand if any suspicious actions (e.g., unauthorized access attempts) correlate with the service installation.

  - **Check for evasion attempts:** Investigate if suspicious service installations coincide with other indicators of evasion or lateral movement, such as low-level network traffic patterns or unauthorized access to administrative tools.

  ### Prioritization

  Given the nature of the services involved, the alert carries medium severity due to the high potential for exploitation. The likelihood of misuse is significant as both services are known to facilitate persistent access or evasion tactics. This behavior is typically weaponized by attackers attempting to maintain covert access to compromised systems.

  ### Blind Spots and Assumptions

  This detection may be circumvented by clever adversaries renaming service executables. It requires properly configured logging of registry modifications to detect such activities reliably. Legitimate software may legitimately use similar service names and paths, potentially generating false positives. A related detection to enhance coverage would examine Sysmon logs for process creations associated with well-known tools in threat intelligence databases, bolstering the confidence level in identifying malicious activity.

