title: Suspicious Service Installed
id: f2485272-a156-4773-82d7-1d178bc4905b
status: test
description: |
  Detects installation of NalDrv or PROCEXP152 services via registry-keys to non-system32 folders.
  Both services are used in the tool Ghost-In-The-Logs (https://github.com/bats3c/Ghost-In-The-Logs), which uses KDU (https://github.com/hfiref0x/KDU)
references:
- https://web.archive.org/web/20200419024230/https://blog.dylan.codes/evading-sysmon-and-windows-event-logging/
author: xknow (@xknow_infosec), xorxes (@xor_xes)
date: 2019-04-08
modified: 2023-08-17
tags:
- attack.t1562.001
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject:
    - 'HKLM\System\CurrentControlSet\Services\NalDrv\ImagePath'
    - 'HKLM\System\CurrentControlSet\Services\PROCEXP152\ImagePath'
  filter:
    Image|endswith:
            # Please add the full paths that you use in your environment to tighten the rule
    - '\procexp64.exe'
    - '\procexp.exe'
    - '\procmon64.exe'
    - '\procmon.exe'
    - '\handle.exe'
    - '\handle64.exe'
    Details|contains: '\WINDOWS\system32\Drivers\PROCEXP152.SYS'
  condition: selection and not filter
falsepositives:
- Other legimate tools using this service names and drivers. Note - clever attackers
  may easily bypass this detection by just renaming the services. Therefore just Medium-level
  and don't rely on it.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the installation of suspicious services `NalDrv` and `PROCEXP152` in non-standard directories, which may signal malicious activity. These services are part of the tool Ghost-In-The-Logs, which is designed to aid attackers in stealthily monitoring and manipulating processes on compromised systems. The primary objective of such an attacker is to gain persistent access and maintain control over the target machine while avoiding detection.

  Relevant MITRE ATT&CK tactics and techniques associated with this rule include Defense Evasion (T1562.001), as attackers often employ techniques to hide their activities and maintain covert operations on the victim's system. The installations of these services can facilitate further exploitation or reconnaissance, making it critical for defenders to monitor for their presence.

  The primary data sources for this detection are Windows Registry logs, specifically focusing on registry keys associated with service installations. Analyzing these logs can help security teams uncover indicators of compromise tied to unauthorized service use.

  ### Investigation Steps
  - **Review Registry Keys**: Examine `HKLM\System\CurrentControlSet\Services\` for the presence of `NalDrv` and `PROCEXP152` services and verify their installation paths.
  - **Analyze Process Creation Events**: Investigate any process creation events related to `procexp.exe`, `procmon.exe`, or other associated utilities to see if they were executed from unexpected directories.
  - **Correlate with System Logs**: Check for any unusual activity or changes made to the system that coincide with the installation of these services, including unexpected reboots or service start events.
  - **Assess Persistence Mechanisms**: Investigate other potential persistence mechanisms in place, such as scheduled tasks or startup folder entries that may be linked to these services.

  ### Prioritization
  This alert carries medium severity due to the potential for significant impact if the services are indeed part of an attack framework. The likelihood of such installations indicating malicious intent is plausible, especially in environments where strict service management policies are enforced.

  ### Blind Spots and Assumptions
  There may be gaps in covering other known or unknown service names used by similarly malicious tools, as attackers can easily rename services to evade detection. The detection logic assumes that the specific service names and paths are consistently used; variations might not trigger alerts. Proper configuration and logging of registry changes must be in place for the detection to function effectively.

