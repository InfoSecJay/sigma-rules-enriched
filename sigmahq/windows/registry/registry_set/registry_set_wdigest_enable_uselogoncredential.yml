  ---

  ### Technical Context

  This rule detects modifications to the WDigest registry setting, specifically enabling the UseLogonCredential flag, which allows credentials to be stored in clear text. This behavior may be exploited by an attacker to capture plaintext credentials for authentication, leading to potential lateral movement or privilege escalation within the network. The relevant MITRE ATT&CK technique associated with this behavior is “Registry Run Keys / Startup Folder” (T1112).

  The primary telemetry source for this detection is Windows Registry changes, specifically logs related to registry modifications. If this behavior is initiated maliciously, it can allow attackers to harvest sensitive credentials directly from the system. However, this detection does NOT confirm that an attacker has successfully exploited credentials; it only indicates a configuration change that may be queried for malicious intent.

  ---

  ### Investigation Steps

  - **Examine recent registry changes:** Review Windows Registry logs for Event ID 13 (Registry Key Change) focusing on modifications to `HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential`. Note any timestamps, source users, or machine names associated with the changes.

  - **Identify user context for changes:** Determine the user account that modified the registry setting. Look for indications of administrative access by reviewing Event ID 4624 (Successful Logon) to see if these changes coincided with a service account or administrator.

  - **Verify potential malicious intent:** If the modification occurred without legitimate windows of maintenance and during odd hours, correlate this with local logs (Event ID 4697 - Service Installation) and examine for any new or suspicious services that were created or modified concurrently.

  - **Check for legitimate system behaviors:** Valid configurations typically involve a clean environment without direct registry modifications. Assess if this is a standard deployment or part of a legitimate application setup, exploring Event ID 4672 (Special Privileges Assigned to New Logon) to validate administrative actions.

  - **Review for indicators of compromise:** Search for connections made to external hosts or lateral movement activities corresponding with these registry changes, utilizing logs from the Windows Firewall (Event ID 5156) or network monitoring solutions.

  - **Analyze related alerts or processes:** Check for other detections or alerts that indicate suspicious behavior nearby, such as credential dumping tools or abnormal process spawnings like `lsass.exe`, which could relate to previous exploitation attempts.

  ---

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on credential security and lateral movement opportunities in the network. The likelihood of malicious use is significant, as attackers commonly modify this registry setting to facilitate credential harvesting during an ongoing breach.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate administrative actions or tools that modify registry settings without sufficient logging. It’s crucial to have robust auditing enabled on registry changes for accurate detection. Genuine administrative changes, such as software installations or updates, can trigger this alert; thus, historical context is vital. A related detection to strengthen coverage would be monitoring for events indicating unusual authentication methods or failed authentication attempts (T1075 - Pass the Hash).

