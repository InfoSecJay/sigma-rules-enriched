note: |
  ### Technical Context

  This Sigma rule detects modifications to the `UseLogonCredential` registry setting under the WDigest security provider, which allows for the storage of credentials in clear text. Attackers often aim to enable this setting to facilitate credential theft for lateral movement within a network. The relevant MITRE ATT&CK tactics and techniques include **Persistence** and **Defense Evasion** (T1112).

  Primary telemetry sources for this detection include Windows Registry logs, particularly targeting registry set operations. The security impact of enabling this setting is significant, as it exposes user credentials to potential interception. It is essential to note that this detection does NOT confirm that an attack is currently in progress; it only indicates a change in a security-sensitive registry key.

  ### Investigation Steps

  - **Review recent registry changes:** Examine Windows Security Event ID 4657 for changes to `HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest` and confirm the value of `UseLogonCredential` was set to `1` (DWORD) on affected systems.

  - **Analyze system for related indicators:** Check Sysmon Event ID 10 for any process creating or modifying registry keys associated with WDigest. Look for processes such as `reg.exe` or PowerShell commands indicating suspicious activity.

  - **Assess the asset role and criticality:** Determine if the affected system is a user workstation or a critical server. Workstations are typically less concerning, whereas changes on domain controllers or sensitive servers could indicate a higher risk.

  - **Identify legitimate use cases:** Confirm if legitimate applications are known to modify the WDigest setting for purposes such as compatibility with multi-factor authentication systems. Document such cases as benign.

  - **Correlate with known attack patterns:** Investigate logs for any previous signs of lateral movement or credential harvesting methods, such as **Pass-the-Hash** or **Mimikatz**, that directly leverage the existence of clear-text credentials.

  - **Validate potential lateral movement:** Check for unusual authentication patterns in Windows Event ID 4624, particularly remote logins from anomalous accounts after the registry change, indicating possible exploitation of the credential storage.

  ### Prioritization

  This alert is considered high severity due to its potential impact on credential security and the likelihood of malicious exploitation. Given the nature of enabling clear-text passwords, this behavior is often weaponized in credential dumping attacks, necessitating immediate attention.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive registry monitoring or event log retention policies that capture such changes. Legitimate applications could trigger this alert, particularly during system updates or configurations. Companion detections such as monitoring for credential dumps (Sysmon Event ID 10) can help bolster incident investigation and response.

