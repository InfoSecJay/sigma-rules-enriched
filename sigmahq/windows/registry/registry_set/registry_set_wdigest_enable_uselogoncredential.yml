note: |
  ### Technical Context

  This Sigma rule detects modifications made to the Windows registry key `HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest`, specifically changing the value of `UseLogonCredential` to `1`, which enables the transmission of credentials in plaintext. The likely attacker objective is to capture user credentials for lateral movement or unauthorized access within the network, as plaintext credentials can be easily intercepted. This behavior aligns with the MITRE ATT&CK technique T1112 (Modify Registry), under the tactics of Persistence and Defense Evasion.

  The primary telemetry source is the Windows Registry, particularly focusing on registry modification events that may be logged by endpoint detection or monitoring solutions. If this change is initiated by an attacker, the security impact is significant, as it exposes sensitive credentials, risking further compromise within the environment. It is important to clarify that this detection does NOT confirm malicious activity by itself; legitimate changes made by authorized software or system administrators may also trigger this alert.

  ### Investigation Steps

  - **Check the modifying user account:** Examine Security Event ID 4663 to identify the user account responsible for the registry change. Look for anomalies, such as changes made by accounts with no administrative purposes or unusual login times.

  - **Assess the originating process:** Review Sysmon Event ID 10 (ProcessAccess) to determine the process that altered the registry key. Identify whether this process is a known legitimate application or an unexpected executable.

  - **Identify past legitimate modifications:** Consult operational procedures and documentation to identify any scheduled tasks or maintenance scripts that may have modified this value legitimately. This can help establish a baseline for expected behavior.

  - **Review for other registry modifications:** Investigate other related registry keys in the Security Providers subkey to identify a pattern of compromise, specifically changes to WDigest or similar keys that suggest further elevation of privileges (e.g., reviewing Event ID 4657 for registry modification events).

  - **Analyze for credential harvesting artifacts:** Inspect for the presence of unusual artifacts related to credential dumping tools, such as `Mimikatz`, or other evidence of credential harvesting on the affected host. Monitor for related network traffic that may suggest exfiltration attempts (e.g., Event ID 5156).

  - **Validate host role and risk:** Identify if the affected host has enterprise-critical roles, such as domain controllers or management servers, which would increase the severity of this finding based on their function in the environment.

  ### Prioritization

  This alert carries a high severity due to the direct impact on credential security and the potential for extensive lateral movement by an adversary. The likelihood of malicious use is significant, as enabling clear-text credential usage is a known tactic among attackers. Given its relevance in credential theft scenarios, this behavior is commonly weaponized.

  ### Blind Spots and Assumptions

  Detection limitations exist; legitimate software installations or updates may modify this registry value for valid reasons and can trigger false positives. Effective detection requires ensuring that registry auditing is properly configured and enabled across all endpoints. Additionally, legitimate administrative actions, such as system configuration scripts or group policy changes, may also lead to similar alerts. Consider monitoring for related detections, such as T1027 (Obfuscated Files or Information), which may strengthen coverage regarding credential-related threats.

