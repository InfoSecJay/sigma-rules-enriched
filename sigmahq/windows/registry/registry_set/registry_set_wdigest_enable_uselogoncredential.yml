note: |
  ### Technical Context
  This detection rule identifies potential malicious modifications to the Windows registry concerning the WDigest security provider. Specifically, it focuses on the change of the `UseLogonCredential` value to enable the storage of logon credentials in clear text. Attackers may exploit this configuration to capture plaintext credentials during authentication processes, significantly increasing the risk of credential theft and subsequent unauthorized access to systems and resources within the environment.

  Attackers might leverage this approach to facilitate lateral movement, persistence, or privilege escalation, particularly in environments where passwords are reused or compromised. The ability to retrieve clear-text credentials can allow attackers to impersonate legitimate users and access sensitive systems or data.

  Relevant MITRE ATT&CK tactics/techniques include:
  - **Persistence (T1050)**: By enabling the use of clear-text credentials, attackers may maintain continued access to compromised systems.
  - **Defense Evasion (T1112)**: Modifying registry settings to weaken the security posture falls under this technique, representing an evasion tactic to hinder detection efforts.

  Primary data sources for identifying these changes include:
  - **Registry modification logs**: Capturing entries related to changes made to the Windows registry, particularly focusing on security-related configurations.

  ### Investigation Steps
  - **Review Registry Logs**: Check logs for any unauthorized changes made to the `HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest` path and specifically monitor for the `UseLogonCredential` key being set to `1`.
  - **Correlate Event Logs**: Investigate related Windows Event Logs, especially Security logs, around the time of the registry change to identify any suspicious login activity or credential usage.
  - **Analyze User Accounts**: Look for unusual patterns in account usage, such as accounts logging in with elevated privileges that do not typically do so or suspicious sessions from atypical geographic locations.
  - **Review Recent Changes**: Determine if any recent system or administrative changes coincide with the timing of the registry modification, which may help identify the actor or method used to implement the change.

  ### Prioritization
  This alert warrants a high severity rating due to the critical nature of credential management within enterprise environments. The ability to capture and utilize clear-text credentials directly compromises user accounts and can lead to substantial breaches of confidential information.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if adequate logging of registry modifications is not enabled or if there are insufficient privileges set for monitoring these changes. Additionally, the detection logic presumes that any modification to the `UseLogonCredential` setting is malicious, which might not account for legitimate administrative actions or configurations. Ensuring that security logging is appropriately configured and that changes to the registry are monitored are essential for this alert to function correctly.

