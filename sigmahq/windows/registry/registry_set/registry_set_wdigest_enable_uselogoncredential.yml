note: |
  ### Technical Context

  This rule detects modifications to the Windows registry key `HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest` that enable the storage of user credentials in clear text, via the `UseLogonCredential` value being set to `1`. An attacker may exploit this by changing the registry setting to capture plaintext credentials, facilitating unauthorized access while evading further authentication checks. This behavior fits within the MITRE ATT&CK tactic of **Persistence** and technique of **Registry Run Keys / Startup Folder (T1112)**.

  Primary telemetry sources include Windows registry modification logs, which do not typically generate specific Event IDs but can be monitored through advanced logging and SIEM solutions that track registry changes. If successful, the malicious changes can lead to credential abuse, significantly affecting system integrity and security. This detection alone does NOT confirm that an attacker has successfully captured credentials or accessed the system.

  ### Investigation Steps

  - **Review registry modification logs:** Analyze registry change telemetry for any entries related to `WDigest\UseLogonCredential`. Focus on tracking the time and user account responsible for the change using tools like Sysmon (Event ID 13: Registry Key Modified).

  - **Correlate with user activity:** Check for concurrent user logon events (Security Event ID 4624) within a short timeframe of the registry modification to identify if legitimate user activity aligns with the registry change.

  - **Identify known good settings:** Confirm that the value of `UseLogonCredential` is set to `0` in environments that do not require credential storage in plaintext. In most enterprise scenarios, this should remain as such.

  - **Check for multiple changes across devices:** Use endpoint management tools to verify if similar modifications to the `UseLogonCredential` setting have been made across multiple hosts, indicating a potential automated attack or lateral movement.

  - **Review associated events for credential leak indicators:** Look for instances of authentication attempts or failed logins (Event ID 4625) from the same user account linked to the registry change, as these may signify attempts to use compromised credentials.

  ### Prioritization

  This alert is considered **high severity** due to its potential impact on security, as plaintext credentials can lead to unauthorized access to sensitive systems. Given that this attack vector has been weaponized in various campaigns, it is important to prioritize for immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by environments lacking proper registry logging settings. Legitimate software installations, configuration changes, or certain system updates might trigger similar modifications. Additionally, users with administrative privileges can modify the registry legitimately, further complicating the detection. Companion detections could include monitoring for credential dumping activities such as `T1003.001 (LSASS Dumping)` or suspicious user behavior post registry changes.

