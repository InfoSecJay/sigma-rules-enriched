detection:
  selection_key:
    TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\url1'
    Details|contains: '#'
  selection_space_variation:
    Details|contains:
    - '            '         # En Quad (U+2000)
    - '            '         # Em Quad (U+2001)
    - '            '         # En Space (U+2002)
    - '            '         # Em Space (U+2003)
    - '            '         # Three-Per-Em Space (U+2004)
    - '            '         # Four-Per-Em Space (U+2005)
    - '            '         # Six-Per-Em Space (U+2006)
    - '            '         # Figure Space (U+2007)
    - '            '         # Punctuation Space (U+2008)
    - '            '         # Thin Space (U+2009)
    - '            '         # Hair Space (U+200A)
    - '            '         # No-Break Space (U+00A0)
    - '            '         # Normal space
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious registry paths within the Windows environment, particularly focusing on the presence of numerous space characters in the TypedPaths registry key. Such patterns can suggest an attacker utilizing file-fix techniques to obfuscate malicious commands, potentially indicating a phishing attack or other forms of social engineering. Malicious actors may leverage these tactics to hide their activities behind deceptive registry entries, complicating the detection and response processes.

  The relevant MITRE ATT&CK tactics that apply to this detection include **Execution (T1204.004)**, as attackers seek to run malicious programs through user interaction, and **Defense Evasion (T1027.010)**, where they obscure their actions to avoid detection. By crafting registry paths with excessive space characters, attackers may evade traditional security monitoring, making this detection crucial for maintaining an organization's security posture.

  Primary data sources that will illuminate this behavior include **Windows Registry logs**, specifically monitoring for changes to TypedPaths. Analyzing these logs can reveal unusual patterns that may indicate misuse or malicious intent.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the Windows Registry log entries for modifications to the `TypedPaths` key, focusing on any new entries that contain numerous space characters.

  - **Collect Artifacts:** Gather related artifacts, such as recent process creation events that correspond to timestamped registry changes, which could provide context about when and how the suspicious entries were created.

  - **Correlate with User Activity:** Investigate user sessions and associated activities around the time of the registry changes to determine if there were any phishing attempts or suspicious downloads leading to this behavior.

  - **Identify Phishing Indicators:** Look for indicators of compromise (IoCs) that relate to phishing lures, such as unusual email patterns or attachments, which may have led to the malicious registry modifications.

  ### Prioritization
  The severity of this alert is high due to the potential impact on the enterprise environment; successful execution of phishing techniques can lead to malware deployment, data breaches, or further exploitation of network resources. The likelihood of impact is increased in environments with employees vulnerable to social engineering attacks.

  ### Blind Spots and Assumptions
  Potential gaps in detection arise from the possibility of legitimate applications or user behaviors that may also generate similar patterns in the registry; thus, false positives could occur. The detection logic assumes that the presence of excessive space characters in the TypedPaths registry signifies malicious intent rather than benign usage. For the alert to function effectively, it's crucial to have logging enabled for Windows Registry modifications and to ensure comprehensive monitoring of anomalies within user behavior in the environment.

