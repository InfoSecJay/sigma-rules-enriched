note: |
  ### Technical Context

  This rule detects the use of an unusual number of space characters in specific registry paths related to TypedPaths in Windows. Such behavior may suggest an adversary employing "file-fix" techniques, manipulating these paths to execute commands that appear benign or obfuscated, potentially associated with phishing lures. The alert maps to the MITRE ATT&CK Tactic "Execution" (TA0002), specifically Technique "User Execution" (T1204.004) and "Obfuscated Files or Information" (T1027.010). The primary telemetry source is registry changes, notably focusing on the registry path `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\`. If malicious, this activity may lead to unauthorized command execution, data exfiltration, or system compromise.

  This detection does NOT confirm malicious activity on its own, as benign applications or user behavior could also manipulate registry paths with unusual spacing without malevolent intent.

  ---

  ### Investigation Steps

  - **Check registry path modification**: Examine the registry at `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\` for recent changes, focusing on value names that end with 'url1'. Look for Event ID 4657 (Registry value modified) related to this path.

  - **Identify suspicious spacing**: Review the `Details` field for the presence of unusual space characters (e.g., En Quad or Em Space) that are not typical in standard registry path formats. Malicious changes will likely exhibit a higher frequency of these characters.

  - **Correlate with process creation events**: Cross-reference any suspicious registry modifications with recent process creation logs (Security Event ID 4688 or Sysmon Event ID 1). Look for any processes initiated by unusual user contexts or suspicious commands.

  - **Assess system roles and criticality**: Verify the host's role. If it's a critical server (e.g., domain controller), prioritize this investigation. Non-critical workstations may have more benign uses of registry paths.

  - **Review user behavior**: Identify recent user actions preceding the alert, especially those downloading files or accessing external links, as legitimate usage may involve modified TypedPaths.

  - **Identify command execution indicators**: Check for execution of commands or scripts that utilize the modified TypedPaths. Look for indicators such as command-line arguments from Event ID 4688 matching suspicious patterns.

  ---

  ### Prioritization

  This alert should be considered high priority due to the potential impact on system integrity and security. The likelihood of malicious abuse is notable, given that the exploitation of such techniques aligns with common attack vectors. While not frequently weaponized, the methods involved are increasingly used in phishing attacks.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate applications that might use modified TypedPaths for benign reasons, leading to false positives. Reliable detection hinges on the proper logging of registry modifications, so ensure sysmon or equivalent is correctly configured. Be aware that similar registry manipulation may occur during legitimate software installations. Companion detections for abnormal process executions from the same user context could enhance the detection capability against these types of attacks.

