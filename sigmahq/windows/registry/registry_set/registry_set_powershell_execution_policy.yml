detection:
  selection:
    TargetObject|endswith:
            # Note for future readers: For PowerShell 7+ the ExecutionPolicy is handled via a setting file due to the fact that PWSH7 is available for mac and linux
            # Attackers can create a per-user setting file (powershell.config.json) and set the execution policy there
            # Learn more here: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_config?view=powershell-7.3
    - '\ShellIds\Microsoft.PowerShell\ExecutionPolicy'
    - '\Policies\Microsoft\Windows\PowerShell\ExecutionPolicy'
    Details|contains:
    - 'Bypass'
    - 'Unrestricted'
  filter_main_svchost:
        # Note: We filter out "svchost" to avoid FP with changes using "gpedit" for example.
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects changes to the PowerShell execution policy, specifically when set to "Bypass" or "Unrestricted". Attackers may modify the execution policy to enable the execution of unsigned scripts, circumventing security mechanisms designed to prevent the execution of potentially harmful code. This behavior aligns with the MITRE ATT&CK framework under the tactic "Defense Evasion" (ID: T1562) and technique "Impair Defenses" (ID: T1574). The primary telemetry source is the Windows Registry, with relevant log types being registry change logs that track modifications to specific execution policy keys. If malicious, this behavior could allow for the execution of arbitrary code or malware. However, detection of this rule does NOT confirm that malicious PowerShell scripts have been executed, only that the execution policy has been altered.

  ### Investigation Steps

  - **Check registry modification details:** Review logs from the Windows Registry (Event ID 4657) for changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell\ExecutionPolicy` and `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ExecutionPolicy`. Confirm that the new value is "Bypass" or "Unrestricted".

  - **Identify the modifying process:** Correlate the event with its source process by examining the `Image` field in the registry change logs. Look for unexpected applications modifying these keys; legitimate changes are typically made by system administrators using Group Policy.

  - **Review PowerShell activity:** Check for recent PowerShell script executions (Event ID 400 from Windows PowerShell logs) that may align with the timing of the policy change. Look for cmdlets like `Set-ExecutionPolicy` being invoked with "Bypass" or "Unrestricted".

  - **Evaluate system role and criticality:** Assess whether the system where the change occurred is critical to operations, such as domain controllers or servers handling sensitive information. Malicious changes here pose a higher risk.

  - **Investigate related logs for malicious indicators:** Search for logs indicating potentially dangerous PowerShell scripts being executed after the policy change. Look for any signs of encoded command parameters or suspicious downloads from `Sysmon Event ID 10` related to PowerShell.

  - **Observe legitimate activity patterns:** Confirm if the execution policy was altered for legitimate administrative purposes. Changes made by established processes such as `gpedit.msc` or authorized software deployment tools can often signify benign activity.

  ### Prioritization

  This alert is of medium severity as it identifies a potential defense evasion technique that could enable further malicious activity on sensitive systems. Given the frequency of PowerShell abuse in attacks, especially via script execution, it's essential to treat alerts in this category with appropriate caution.

  ### Blind Spots and Assumptions

  Detection can be limited by improper logging configurations or lack of visibility into registry changes. Attackers may evade detection by making rapid changes through legitimate administrative tools. Additionally, legitimate administrative tasks or Group Policy modifications may inadvertently trigger this alert. A related detection to strengthen coverage is monitoring for unauthorized PowerShell events across the environment (e.g., `Base Event ID 400` for script execution).

