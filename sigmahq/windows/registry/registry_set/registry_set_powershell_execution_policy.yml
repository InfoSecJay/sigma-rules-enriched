detection:
  selection:
    TargetObject|endswith:
            # Note for future readers: For PowerShell 7+ the ExecutionPolicy is handled via a setting file due to the fact that PWSH7 is available for mac and linux
            # Attackers can create a per-user setting file (powershell.config.json) and set the execution policy there
            # Learn more here: https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_config?view=powershell-7.3
    - '\ShellIds\Microsoft.PowerShell\ExecutionPolicy'
    - '\Policies\Microsoft\Windows\PowerShell\ExecutionPolicy'
    Details|contains:
    - 'Bypass'
    - 'Unrestricted'
  filter_main_svchost:
        # Note: We filter out "svchost" to avoid FP with changes using "gpedit" for example.
    Image|contains:
    - ':\Windows\System32\'
    - ':\Windows\SysWOW64\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes to the PowerShell execution policy, specifically if it is set to "Bypass" or "Unrestricted." This behavior often signals an attempt by an attacker to disable security measures on script execution, thereby enabling the execution of malicious scripts. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0060), with the technique being **Modify Authentication Data** (T1550).

  The primary telemetry sources for this detection are Windows Registry changes related to PowerShell execution policies, specifically targeting keys under `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\PowerShell` and `HKEY_CURRENT_USER\Software\Microsoft\PowerShell`. If malicious, this change could facilitate the execution of harmful scripts, leading to data breaches or system compromises. Importantly, this detection alone does not confirm malicious intent, as legitimate administrative actions can also modify the execution policy.

  ### Investigation Steps

  - **Examine Registry Changes:** Review changes to the `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\PowerShell\ExecutionPolicy` and `HKEY_CURRENT_USER\Software\Microsoft\PowerShell` for values set to "Bypass" or "Unrestricted". Use Registry Event ID 4902 for auditing these changes.

  - **Identify User Accounts Involved:** Cross-reference the user account making the changes with the organization's policies to determine if the user has legitimate administrative privileges. Look at the `CallerUser` field in the registry event logs.

  - **Verify Recent PowerShell Activity:** Check for recent PowerShell command execution (Event ID 4104) to determine if the environment has processed potentially malicious scripts following the policy change. Look for commands that could leverage the new execution policy.

  - **Assess Historical Execution Policy Settings:** Retrieve and review past execution policy settings from event log records to identify any prior alterations. This can help understand whether current changes follow a pattern of suspicious activity.

  - **Determine System Role and Sensitivity:** Identify the criticality of the affected system (e.g., domain controller vs. user workstation) to assess the urgency and potential impact of the policy change.

  - **Look for Known Malicious Indicators:** Investigate for presence of abnormal PowerShell modules or scripts that are commonly associated with post-exploitation activities, as indicated in historical threat reports.

  ### Prioritization

  This alert should be treated with medium severity. Changes to the execution policy can have significant security consequences, especially on critical systems. While modifying these policies can be legitimate, the potential for misuse by actors aiming to bypass defenses is high, making it a common tactic in post-exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection is limited as attackers may obscure their actions by executing from various scripts or using legitimate administrative tools that do not change the execution policy. Reliable detection requires proper log configurations for the Windows Registry and PowerShell events. Legitimate administrative tasks, such as policy changes for service upkeep, can trigger this alert. A related detection to consider is registry access for PowerShell-related logs to provide deeper visibility into script execution patterns.

