note: |
  ### Technical Context
  This detection rule identifies potential tampering with the PowerShell execution policy, which can allow malicious actors to bypass script signing requirements. Attackers frequently leverage this capability to execute unauthorized scripts that may be designed for various purposes, including data exfiltration, lateral movement, or privilege escalation. By altering the execution policy to "Bypass" or "Unrestricted," the attacker may execute their scripts without restrictions, making detection and prevention significantly more difficult.

  The relevant MITRE ATT&CK tactics associated with this behavior include **Defense Evasion** (TA0060), as the attempt to change the execution policy is a direct effort to escape detection. The associated techniques include **Application Layer Protocol** (T1071) and **Software Deployment Tools** (T1073), as unauthorized scripts may use legitimate tools and processes to execute malicious commands.

  Primary data sources that can confirm this activity include **Windows Registry logs**, which record changes to execution policies, as well as **Event Logs** that track process creation events related to PowerShell.

  ### Investigation Steps
  - **Review Registry Logs**: Check for any modifications to the PowerShell execution policy registry keys located at `\ShellIds\Microsoft.PowerShell\ExecutionPolicy` and `\Policies\Microsoft\Windows\PowerShell\ExecutionPolicy` to identify unauthorized changes.
  - **Analyze PowerShell Activity**: Investigate PowerShell logs for executions where the execution policy was set to "Bypass" or "Unrestricted." Pay special attention to any unusual or unexpected command sequences.
  - **Inspect Process Creation Events**: Examine logs from the process creation events to see if the changes correlate with the launching of suspicious PowerShell processes (e.g., those originating from non-standard locations).
  - **Correlate with User Behavior**: Assess user actions surrounding the time of the registry change to determine if legitimate administrative actions occurred, or whether there’s evidence of abnormal user behavior suggesting an attack.

  ### Prioritization
  Alerts for this detection rule should be considered medium priority due to the potential for significant impact. A successful bypass of script signing would allow an attacker to execute malicious scripts undetected, raising the urgency for immediate investigation, especially within environments where PowerShell is frequently utilized for automation and administrative tasks.

  ### Blind Spots and Assumptions
  There are inherent gaps in detection coverage, as this rule may not catch execution policy changes that occur without direct registry interaction, such as through Group Policy or in environments using PowerShell 7+ where configurations are managed via `powershell.config.json`. The detection logic assumes that logs are enabled for registry access and process creation and requires them to be retained for sufficient periods to capture potential tampering incidents. Without these logs, the rule may miss legitimate administrative changes conducted through authorized methods.

