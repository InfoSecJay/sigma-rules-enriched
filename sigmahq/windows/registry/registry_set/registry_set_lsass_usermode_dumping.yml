title: Lsass Full Dump Request Via DumpType Registry Settings
id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
status: test
description: Detects the setting of the "DumpType" registry value to "2" which stands
  for a "Full Dump". Technique such as LSASS Shtinkering requires this value to be
  "2" in order to dump LSASS.
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
author: '@pbssubhash'
date: 2022-12-08
modified: 2023-08-17
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\DumpType'
    - '\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\lsass.exe\DumpType'
    Details: 'DWORD (0x00000002)'     # Full Dump
  condition: selection
falsepositives:
- Legitimate application that needs to do a full dump of their process
level: high
note: |
  ### Technical Context
  This detection rule identifies when the "DumpType" registry value is set to "2", indicating an instruction to perform a full memory dump of the LSASS (Local Security Authority Subsystem Service) process. This behavior is often exploited in credential theft scenarios, particularly through techniques like LSASS Shtinkering, wherein attackers aim to extract sensitive information such as credentials stored in memory. By performing an LSASS dump, adversaries can obtain credential hashes or plaintext passwords, facilitating lateral movement and further exploitation within the targeted environment.

  The relevant MITRE ATT&CK tactics and techniques applicable here include **Credential Access** (TA1203) and specifically **Credential Dumping: LSASS Memory** (T1003.001). Understanding these methodologies enables security analysts to prioritize their detection efforts and responses effectively.

  Primary logging sources for this detection rule include registry change logs, particularly those monitoring HKEY_LOCAL_MACHINE paths related to Windows Error Reporting. This provides crucial visibility into any unauthorized or suspicious modifications to LSASS-related registry settings.

  ### Investigation Steps
  - **Review Registry Changes**: Examine records of modifications to the `DumpType` key within the Windows registry, specifically for lsass.exe and the Windows Error Reporting LocalDumps path, to confirm if suspicious changes were made.

  - **Analyze Process Activity**: Investigate the process creation logs around the time the registry change occurred, looking for unusual or unauthorized processes trying to interact with or dump LSASS memory.

  - **Correlate with User Activity**: Check user account activity logs to see if the changes coincided with privileged account activity, especially those with administrative rights that could manipulate LSASS settings.

  - **Check for Additional Indicators**: Look for any accompanying behaviors or patterns that typically accompany LSASS dumping activities, such as unusual authentication attempts, credential usage anomalies, and other lateral movement indicators.

  ### Prioritization
  This alert is marked as high-severity due to the significant impact of credential dumping on an organization’s security posture. The likelihood of successful exploitation increases when attackers leverage this technique, as it can lead directly to unauthorized access and control over critical systems.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage includes environments where logging of registry changes may not be sufficiently configured or enabled, which could lead to missed detections. Additionally, the detection logic assumes that attackers will modify the DumpType specifically, without using other evasion techniques. It requires proper logging configurations on Windows registry changes to function effectively, which is not always in place, especially in less secure or poorly configured environments.

