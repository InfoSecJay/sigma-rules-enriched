title: Lsass Full Dump Request Via DumpType Registry Settings
id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
status: test
description: Detects the setting of the "DumpType" registry value to "2" which 
  stands for a "Full Dump". Technique such as LSASS Shtinkering requires this 
  value to be "2" in order to dump LSASS.
references:
- https://github.com/deepinstinct/Lsass-Shtinkering
- https://learn.microsoft.com/en-us/windows/win32/wer/collecting-user-mode-dumps
- https://media.defcon.org/DEF%20CON%2030/DEF%20CON%2030%20presentations/Asaf%20Gilboa%20-%20LSASS%20Shtinkering%20Abusing%20Windows%20Error%20Reporting%20to%20Dump%20LSASS.pdf
author: '@pbssubhash'
date: 2022-12-08
modified: 2023-08-17
tags:
- attack.credential-access
- attack.t1003.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\DumpType'
    - '\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\lsass.exe\DumpType'
    Details: 'DWORD (0x00000002)'     # Full Dump
  condition: selection
falsepositives:
- Legitimate application that needs to do a full dump of their process
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry that set the "DumpType" value to "2," indicating a configuration for a full memory dump of the LSASS process. Attackers may implement this change to enable the extraction of sensitive credentials from LSASS memory, facilitating credential theft and lateral movement within the network. Relevant MITRE ATT&CK tactic is Credential Access (TA0006), with technique ID T1003.001 (LSASS Memory). Primary telemetry sources for this detection include Windows Registry logs, specifically looking for changes in the registry paths that pertain to Windows Error Reporting's LocalDumps for the lsass.exe process. If this activity is malicious, it could lead to unauthorized access to user credentials or domain credentials. However, this detection alone does not confirm that an actual LSASS dump has occurred, merely that the system has been configured to allow it.

  ### Investigation Steps

  - **Check registry value modification:** Review Windows Registry for the key `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\DumpType`. Event ID 4657 (registry value modified) should show recent changes. A legitimate application may use a different DumpType (such as "0" or "1").

  - **Identify high-risk hosts:** Determine if the modification occurred on systems like domain controllers or critical application servers where LSASS access could lead to significant privilege escalation or data compromise.

  - **Correlate with process creation:** Use Sysmon Event ID 1 to find any processes spawned immediately after the registry change occurs, specifically searching for `lsass.exe` using the command line arguments. This indicates potential credential dumping activity.

  - **Review user permissions:** Investigate the user accounts (Event ID 4672 - Special Privileges assigned) making the registry changes to ensure they have legitimate reasons for modifying DumpType settings.

  - **Assess application context:** Identify any legitimate applications or scheduled tasks that may require a full process dump under normal operations and verify against expected behavior or documented configurations.

  ### Prioritization

  This alert holds a high severity because it indicates a potential prelude to credential theft, particularly if it occurs on sensitive systems. The configuration change can be indicative of advanced adversary tactics, as modifying the LSASS dumping mechanism is commonly weaponized in attacks targeting credential harvesting.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of monitoring on all relevant registry keys if the logging levels are not configured correctly. Evasion techniques may include attackers using legitimate applications to set the registry keys without raising suspicion. Legitimate applications that require full dumps can unintentionally trigger alerts, so understanding contextual behavior is essential. Companion detections, such as monitoring for LSASS process memory access or unusual command-line arguments used while accessing sensitive processes, can enhance coverage.

