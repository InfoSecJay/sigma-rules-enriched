note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry that facilitate bypassing User Account Control (UAC) via Event Viewer. The likely attacker objective is to escalate privileges by tampering with registry entries to execute commands without triggering UAC prompts. This behavior correlates with the MITRE ATT&CK tactics for privilege escalation (T1068) and persistence (T1548.002).

  The primary telemetry sources include Windows Registry logs, specifically events related to registry changes (Event ID 4657). If successfully malicious, this action can enable unauthorized access to sensitive system functions or data. Notably, this detection does NOT confirm that a successful privilege escalation occurred; it merely indicates that an attempt to modify critical registry keys was made.

  ### Investigation Steps

  - **Review registry modifications:** Check Windows Security Event ID 4657 for detailed logs on registry changes, focusing on modifications targeting `'_Classes\mscfile\shell\open\command\(Default)'`. Validate whether these changes align with established baselines for legitimate app behavior.

  - **Analyze command execution:** Assess logs for associated process creation events (Event ID 4688) to verify if `mmc.exe` or other privileged processes were executed following the registry modification. Track for standard paths of execution to differentiate between benign and unauthorized usage.

  - **Identify infrastructure context:** Assess asset roles and criticality. High-value assets, such as domain controllers or servers with administrative roles, should receive heightened scrutiny if this alert is triggered.

  - **Validate event logging configurations:** Ensure that Windows registry auditing is enabled correctly to produce reliable logs for Event ID 4657. This is crucial for reviewing past actions and can help identify previous unauthorized access attempts.

  - **Correlate with known attack frameworks:** Cross-reference this behavior with recent threat intelligence reports and previous alerts. This step can identify known malicious actors leveraging UAC bypass techniques related to registry modifications.

  ### Prioritization

  This alert is of high severity as it pertains to critical system modifications that may lead to unauthorized privilege escalation. The likelihood of adversarial exploitation is significant, given that UAC bypasses are commonly weaponized in various attack scenarios targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigured registry auditing settings, which could skip important events. Legitimate applications performing registry modifications could inadvertently trigger this alert if not properly recognized. Additionally, related detections such as unusual `mmc.exe` execution without accompanying user prompts can provide valuable context, enhancing overall threat visibility.

