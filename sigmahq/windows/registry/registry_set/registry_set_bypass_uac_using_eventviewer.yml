note: |
  ### Technical Context
  This detection rule identifies attempts to bypass User Account Control (UAC) leveraging the Windows Event Viewer and specific modifications to the Windows Registry. Attackers who employ this technique typically aim to gain elevated privileges without explicit user consent. By exploiting registry alterations, they can trigger processes with higher permissions, which could enable them to maintain persistence or further infiltrate the network.

  The relevant MITRE ATT&CK tactics associated with this detection are **Privilege Escalation** (TA0004) and **Persistence** (TA0003). The specific technique targeted is **T1548.002 - Abuse Elevation Control Mechanism: Bypass User Account Control**. This method can be utilized in various attack scenarios, particularly when adversaries aim to escalate privileges and execute malicious code with elevated rights.

  To capture evidence of this activity, telemetry from the **Windows Registry** is crucial, specifically `registry_set` logs. These logs will provide insights into any unauthorized changes within the registry that are indicative of UAC bypass attempts.

  ### Investigation Steps
  - **Review Registry Logs**: Analyze `registry_set` logs for alterations to `'_Classes\mscfile\shell\open\command\(Default)'` that match the defined criteria of this alert.
  - **Validate Command Structure**: Confirm that the Registry modifications reference a command starting with `%SystemRoot%\system32\mmc.exe "%1" %`, which indicates an attempt to leverage Event Viewer.
  - **Correlate with Process Creation Events**: Investigate any associated process creation events that may indicate execution of the altered commands, focusing on elevated processes initiated around the same timestamp.
  - **Assess User Behavior**: Examine user behavioral analytics or recent account activities to determine if any unauthorized or suspicious account has performed the changes that triggered this alert.

  ### Prioritization
  This alert is categorized as high severity due to the potential for significant impact. UAC bypasses can lead to unauthorized access at elevated privilege levels, allowing attackers to execute arbitrary code or further compromise enterprise assets.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the environment lacks adequate logging for registry changes, particularly `registry_set` events. The detection logic assumes the presence of the specific registry path and command structure delineated in the rule, which could change in future Windows updates or be modified by legitimate applications. Organizations should ensure that registry auditing is enabled to facilitate effective monitoring and detection for this alert.

