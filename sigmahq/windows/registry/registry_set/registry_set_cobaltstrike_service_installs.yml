detection:
  selection_key:
  - TargetObject|contains: '\System\CurrentControlSet\Services'
  - TargetObject|contains|all:
    - '\System\ControlSet'
    - '\Services'
  selection_details:
  - Details|contains|all:
    - 'ADMIN$'
    - '.exe'
  - Details|contains|all:
    - '%COMSPEC%'
    - 'start'
    - 'powershell'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule is designed to detect attempts to install malicious services associated with the execution of Cobalt Strike beacons, which are often employed for privilege escalation and lateral movement within compromised networks. Attackers may leverage such techniques to establish persistence and maintain access to targeted systems over an extended duration. By monitoring for specific registry key alterations indicative of service installation, this detection rule aims to alert security teams to potential Cobalt Strike activities that significantly threaten the network environment.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence (T1543.003)**: Installing malicious services to maintain a foothold within the system.
  - **Execution (T1569.002)**: Utilizing services to execute malicious commands.
  - **Privilege Escalation (T1068)**: Gaining elevated privileges through service exploits.
  - **Lateral Movement (T1021.002)**: Utilizing established services for lateral movement across the network.

  The primary data source pertinent to this detection is the Windows registry, specifically the logs that record changes made in the `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services` path, which relates to service configurations.

  ### Investigation Steps
  - **Review Registry Logs**: Examine the Windows registry logs for any changes to service installations within `\System\CurrentControlSet\Services`, focusing on unusual entries or modifications not aligned with standard operational practices.
  - **Analyze Process Creation Events**: Investigate any corresponding process creation events that follow the service installations, especially those involving `powershell.exe` or any executables launched from administrative shares like `ADMIN$`.
  - **Check for Service Execution Commands**: Identify potential execution commands related to the service installations, ensuring to look for those that include parameters pointing to `COMSPEC` or commands that might invoke PowerShell.
  - **Correlate with Network Traffic**: Cross-reference the timeframe of the detected service installations with network logs to identify any anomalous connections indicative of attempted lateral movement or command-and-control (C2) communication.

  ### Prioritization
  This alert is categorized as high severity due to the critical nature of Cobalt Strike, which is widely known to be used by advanced attackers for persistently compromising systems and executing further malicious actions. The presence of such service installations likely indicates ongoing or planned malicious activities that warrant immediate investigation.

  ### Blind Spots and Assumptions
  Detection logic assumes that all relevant logs are adequately monitored and that changes to the Windows registry are logged in a comprehensive manner. There may be gaps in detection coverage concerning customized or obfuscated service installations that don't conform to known patterns. Additionally, this detection relies on the availability of registry auditing configurations; without proper logging enabled, these activities may go unnoticed.

