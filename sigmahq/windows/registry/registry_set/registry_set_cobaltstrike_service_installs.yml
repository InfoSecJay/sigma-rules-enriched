logsource:
  category: registry_set
  product: windows
detection:
  selection_key:
  - TargetObject|contains: '\System\CurrentControlSet\Services'
  - TargetObject|contains|all:
    - '\System\ControlSet'
    - '\Services'
  selection_details:
  - Details|contains|all:
    - 'ADMIN$'
    - '.exe'
  - Details|contains|all:
    - '%COMSPEC%'
    - 'start'
    - 'powershell'
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the creation or modification of Windows services that are commonly associated with Cobalt Strike installations. Malicious actors use Cobalt Strike for privilege escalation and lateral movement within networks. The relevant MITRE ATT&CK tactics and techniques for this behavior include Persistence (T1543.003) and Execution (T1569.002). The primary telemetry sources are Windows Registry logs, particularly the registry paths under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services`, which would reflect new or altered services.

  If an installation is indeed malicious, it could enable persistent access for an adversary, allowing them to maintain footholds on compromised systems. However, this detection alone does NOT confirm malicious intent without further context and analysis of the behavior surrounding the service creation.

  ### Investigation Steps

  - **Review related service creation events:** Check Windows Event ID 7045 in the System logs for the creation of services tied to identified registry changes to understand the context and timing of the actions.

  - **Correlate with process creation logs:** Validate against Sysmon Event ID 1 and Security Event ID 4688 to identify if any unusual processes (e.g., `powershell.exe` or related commands from authorized users) initiated around the same time as the service installation.

  - **Assess registry modifications:** Use the built-in Registry Editor or scripts to query the registry for the specific keys (`\System\CurrentControlSet\Services`) modified, inspecting values for indicators such as paths that point to unusual executables or scripts.

  - **Identify legitimate application behaviors:** Check for known company applications that might legitimately create similar services, especially focusing on internal software that runs elevated permissions.

  - **Evaluate recent account activity:** Review logs for administrative accounts that may have made the changes. Look for unusual logins or account behavior in Security Event IDs 4624 and 4672 that precede the registry event.

  - **Confirm additional persistence mechanisms:** Investigate any related scheduled tasks (Event ID 4698) that may have been created alongside the detected service installation, as Cobalt Strike typically employs multiple methods for persistence.

  ### Prioritization

  This alert is of high severity due to the potential for enabling continued access and control over compromised systems. Given the sophistication of Cobalt Strike, regular occurrences of its deployment in real-world attacks amplify the likelihood that this behavior is malicious, warranting immediate investigation.

  ### Blind Spots and Assumptions

  Detection may be limited if appropriate logging is not enabled or if registry changes are masked or obfuscated by the adversary. Legitimate activities, such as software installations by internal administrators, could trigger this alert, leading to false positives. A related detection to reinforce coverage would be monitoring for the use of Cobalt Strike network artifacts or domain generation algorithms, which could signal ongoing command and control activities.

