  ### Technical Context

  This Sigma rule detects the modification of the Windows registry key `TurnOffCheck`, which indicates that an adversary is attempting to bypass security mechanisms related to the MSDT Follina vulnerability, facilitating the execution of potentially malicious scripts. The likely attacker objective is to disable checks that could prevent or flag the exploitation of this vulnerability, allowing for remote code execution or other malicious activities. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.001).

  The primary telemetry source is Windows registry changes, particularly monitoring the `registry_set` events corresponding to specific key alterations. If exploited, this behavior can introduce significant security risks, such as unauthorized code execution or information theft. Importantly, while this detection highlights a potentially unsafe change, it does NOT confirm actual exploitation or successful compromise without additional context.

  ### Investigation Steps

  - **Identify registry modification details:** Review Windows Security Event ID 4657 (Registry Value Modified) for changes to `Policies\Microsoft\Windows\ScriptedDiagnostics\TurnOffCheck`, ensuring the Details field shows a value of `DWORD (0x00000001)`.

  - **Search for legitimate administrative actions:** Confirm if there are any recent administrative changes logged in the event logs (Event ID 4624 for logon events) around the same time. Look for entries that indicate normal maintenance or troubleshooting activities.

  - **Correlate with known exploitation techniques:** Investigate any recent execution of PowerShell commands (Event ID 4104 for PowerShell) that may indicate script execution attempts; particularly look for commands involving `.diagcab` file types or other potentially exploitative input.

  - **Examine other changes in registry settings:** Check for additional related registry modifications that may indicate further attempts to manipulate security settings (Event ID 4657), particularly under `Policies\Microsoft\Windows\ScriptedDiagnostics`.

  - **Identify anomalous process creation:** Look for associated processes created immediately after the registry change (Sysmon Event ID 1) that may indicate malicious activity, including unfamiliar or non-standard executables.

  - **Assess host criticality:** Determine if the affected system is a critical asset, such as a domain controller or privileged system, which would escalate the urgency of investigation and response efforts.

  ### Prioritization

  This alert is of medium severity due to the potential for abuse of the system's defenses, especially if the affected host has critical functions. While the likelihood of this specific registry modification being weaponized is moderate, successful exploitation of the Follina vulnerability can have severe consequences across enterprise networks.

  ### Blind Spots and Assumptions

  Detection may be limited by improper logging configurations or lack of visibility into administrative activities. Administrators may legitimately modify the `TurnOffCheck` setting for troubleshooting, which can trigger this alert. Additionally, monitoring corresponding registry accesses related to lifecycle management can strengthen overall detection capabilities, such as detecting unauthorized access to other sensitive registry keys.

