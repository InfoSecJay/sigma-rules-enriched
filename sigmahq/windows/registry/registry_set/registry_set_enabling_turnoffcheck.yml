note: |
  ### Technical Context

  This rule detects modifications to the registry setting `TurnOffCheck` under the `ScriptedDiagnostics` group, which can be manipulated to bypass defenses against the MSDT Follina vulnerability. The likely attacker objective is to weaken security protocols on a target system, enabling the execution of malicious scripts through Microsoft Support Diagnostic Tool (MSDT) exploitation techniques. The relevant MITRE ATT&CK tactics and techniques are Defense Evasion (TACTIC: Defense Evasion, TECHNIQUE: T1685).

  The primary telemetry sources involved are Windows Registry change logs, specifically monitoring for events relating to registry edits (Event ID 4657). If this registry key is enabled maliciously, it could allow an attacker to execute arbitrary scripts, posing a significant risk to system integrity and data confidentiality. However, this detection does NOT confirm that an attack is in progress or that malicious activity has occurred without further corroborating evidence.

  ### Investigation Steps

  - **Check recent registry changes:** Query the Security event logs for Event ID 4657 and filter for changes to `TurnOffCheck` in the path `Policies\Microsoft\Windows\ScriptedDiagnostics`. Look for a change to `DWORD (0x00000001)`.

  - **Identify administrator actions:** Investigate the account that made the registry change. Legitimate administrative actions or configurations may include `DWORD (0x00000000)`, indicating a secure setting. Compare timestamps of changes with scheduled maintenance or legitimate administrative work.

  - **Review related application activity:** Correlate timestamps of the registry modification with application logs for the Microsoft Support Diagnostic Tool. Identify abnormal script executions or process launches post-modification to confirm potential exploitation.

  - **Analyze related security events:** Search for recent alerts indicated in Windows Defender logs or similar endpoint security solutions that relate to Follina exploitation. This can provide additional context to the intent behind registry modification.

  - **Validate host role:** Confirm whether the system where the change occurred is a critical server or endpoint that handles sensitive data. Higher criticality assets should prioritize immediate remediation actions if malicious intent is suggested.

  ### Prioritization

  This alert should be treated with medium severity. The impact on the affected system is potentially high, especially if the system is exposed or handles sensitive data. Given the targeted nature of this modification and its association with known vulnerabilities, there is a moderate likelihood of malicious exploitation if detected.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging settings that capture all registry modifications. Some legitimate administrative changes may inadvertently trigger this alert, particularly during patch management or configuration updates. Companion detections include monitoring for unusual process creations (Event ID 4688) following the registry change, which may reinforce the malicious activity hypothesis.

