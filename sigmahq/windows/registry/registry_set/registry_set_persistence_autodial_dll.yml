  ### Technical Context

  This Sigma rule detects changes made to the "AutodialDLL" registry key, specifically under the path `\Services\WinSock2\Parameters\AutodialDLL`. Attackers often manipulate this registry value to achieve persistence by loading custom Dynamic Link Libraries (DLLs) through the Windows Socket 2 API (ws2_32), which can facilitate various malicious activities, including command and control or data exfiltration.

  The relevant MITRE ATT&CK tactic is **Persistence (T1547)**, with the specific technique being **Infectious Link (T1547.001)**. The primary telemetry source is Windows Registry change logs, particularly those capturing registry set events. If malicious, this behavior can lead to long-term access and control over a compromised system, presenting significant security risks. Importantly, this detection does not confirm malicious actions on its own, as legitimate applications may also modify this key.

  ### Investigation Steps

  - **Check registry change history:** Query Windows Registry event logs for Event ID 4657 or Sysmon Event ID 13 to track modifications to `HKLM\SYSTEM\CurrentControlSet\Services\WinSock2\Parameters\AutodialDLL`. Look for unusual non-standard DLL paths that do not match legitimate applications.

  - **Validate legitimate usage:** Confirm if any applications or services on the host are known to interact with the AutodialDLL setting by reviewing documented software installations or recent application logs, ensuring that they correlate with expected operational behavior.

  - **Analyze associated processes:** Investigate parent processes associated with this registry modification through Sysmon Event ID 1, identifying if any suspicious processes are related to the modification in the registry. Look for anomalies like processes running from temporary folders or unknown locations.

  - **Review network activity:** Examine inbound and outbound connections initiated by any processes associated with modifications to the AutodialDLL registry key using Firewall logs (Event ID 5154). Investigate connections to suspicious IPs or domains that do not align with the organization's network usage patterns.

  - **Correlate user behavior:** Check for unusual user behavior or administrative actions (Event ID 4672) around the time of the registry modification, particularly focusing on service account or admin accounts that might be misused to alter registry settings.

  ### Prioritization

  This alert is high severity in a mature enterprise context due to the potential for long-term persistence and control over the affected system. The likelihood of malicious actors exploiting this registry entry for nefarious purposes is significant, as it offers an avenue for stealthy re-entry and further exploits. Additionally, this persistence mechanism is commonly weaponized by sophisticated adversaries.

  ### Blind Spots and Assumptions

  Detection effectiveness may be reduced if Windows Registry auditing is not correctly configured or enabled for sensitive paths. Attackers can employ evasion techniques, such as reverting their changes immediately after execution. Legitimate software updates or configuration changes could also trigger this alert, particularly during automated provisioning of network components. A related detection to consider is monitoring for unexpected DLL files being loaded via `ws2_32`, which could provide additional context regarding malicious activity.

