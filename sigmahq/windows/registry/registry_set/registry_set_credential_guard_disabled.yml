note: |
  ### Technical Context

  This rule detects the disabling of Windows Credential Guard by setting specific registry values (such as `EnableVirtualizationBasedSecurity` and `LsaCfgFlags`) to 0. The likely objective of an attacker enabling this behavior is to bypass virtualization-based security protections to access sensitive credentials, including NTLM hashes and Kerberos tickets, facilitating lateral movement and privilege escalation. This behavior aligns with the MITRE ATT&CK technique: **T1562.001 - Disable or Modify Security Tools**.

  The primary telemetry source is Windows Registry logs, specifically monitoring registry set events associated with the relevant keys. If successfully executed by an adversary, the impact is significant as it can lead to credential exposure and compromises across the network. However, this detection does NOT confirm malicious intent on its own; legitimate administrative actions could also disable Credential Guard.

  ### Investigation Steps

  - **Examine registry changes: **Review the Windows Registry logs for Security Event ID 4657, focusing on changes to keys: `\DeviceGuard\EnableVirtualizationBasedSecurity`, `\DeviceGuard\LsaCfgFlags`, and `\Lsa\LsaCfgFlags` for a DWORD value of 0. Identify who made the change and when.

  - **Identify recent administrative activities: **Check for legitimate administrative actions that require disabling Credential Guard, such as software installations or configurations. Look for Event ID 4688 to see related process creation activities that could justify this behavior.

  - **Correlate timestamps and user accounts: **Cross-reference the time of the registry change with user logon events (Event ID 4624) to verify if the change was initiated by a system administrator or an unauthorized user.

  - **Check for lateral movement tools: **Look for additional indicators of potential lateral movement, such as unusual authentication attempts or the use of tools like Mimikatz, within Windows Security Event IDs (4697, 4625).

  - **Validate host roles: **Consider the criticality of the affected host. If the host is a domain controller or a sensitive system, the detection should be prioritized for immediate investigation due to its potential impact.

  ### Prioritization

  This alert is of high severity due to the potential impact on sensitive credential storage and the likelihood of malicious abuse by adversaries. Disabling Credential Guard is a known tactic to facilitate lateral movement and privilege escalation, making it a behavior that is commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if the necessary logging configurations are not enabled or if event IDs 4657 and 4688 are not consistently monitored. Legitimate administrative actions or configuration management processes may inadvertently trigger this detection. A related detection may include monitoring for unauthorized changes to security settings, as outlined in **T1553 - Subvert Trust Controls**, to strengthen detection capability across security vulnerabilities.

