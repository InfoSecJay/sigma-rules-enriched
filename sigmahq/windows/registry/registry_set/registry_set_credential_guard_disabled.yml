note: |
  ### Technical Context
  This detection rule identifies attempts to disable Windows Credential Guard by observing modifications to critical registry values associated with it. Windows Credential Guard employs virtualization-based security to protect sensitive data such as NTLM hashes and Kerberos tickets, which are crucial for authenticating users and services within an enterprise environment. An attacker may seek to disable Credential Guard to gain unauthorized access to these credentials, thereby enabling lateral movement within the network and escalating privileges.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include:
  - **Defense Evasion** (TA0005)
  - **Disable or modify tools** (T1562.001)

  Primary data sources for this detection include Windows registry logs. Monitoring changes to specific registry keys that control the status of Credential Guard provides vital insights into potential malicious activities aimed at degrading security measures on hosts.

  ### Investigation Steps
  - **Review Registry Changes:** Inspect the Windows registry for values modified at the indicated registry paths: `\DeviceGuard\EnableVirtualizationBasedSecurity` and `\DeviceGuard\LsaCfgFlags`. Determine if recent changes correspond to an unauthorized attempt to disable Credential Guard.

  - **Analyze Access Logs:** Investigate security logs to track user and system accounts that initiated changes to the registry keys. Look for any service accounts or privileged user interactions that appear suspicious.

  - **Correlate with Other Data Sources:** Cross-reference the timing of registry modifications with other telemetry sources, such as EDR alerts for anomalous behavior, to identify potential compromise indicators or patterns.

  - **Identify Lateral Movement Attempts:** Monitor network traffic for unusual or unauthorized access attempts to systems that utilize Credential Guard, as this could signal an attacker exploiting disabled protections to move laterally within the environment.

  ### Prioritization
  The alert is classified as high severity due to the significant risk it poses. Disabling Windows Credential Guard can expose sensitive credentials to attackers, allowing for lateral movement and privilege escalation, which can lead to a full-scale compromise of systems within the organization.

  ### Blind Spots and Assumptions
  This detection may not cover scenarios where an attacker uses advanced techniques to disable Credential Guard without directly modifying the registry values detectable by this rule. Additionally, the alert assumes that proper logging of registry changes is enabled and that no legitimate administrative changes are made to the specified registry keys without proper oversight. Ensuring that all relevant Windows logging and monitoring configurations are in place is critical for effective detection.

