note: |
  ### Technical Context

  This rule detects modifications to specific Windows registry keys that disable Windows Credential Guard. Credential Guard is designed to protect sensitive credentials by using virtualization-based security. Attackers may disable this feature to access encrypted credentials, enabling lateral movement or privilege escalation within the network. This detection aligns with the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and technique "Disable Security Tools" (T1685).

  The primary telemetry sources include Windows registry set events, specifically related to keys that control Credential Guard functionality. If malicious, the impact could be significant, as it may allow adversaries to extract NTLM hashes and Kerberos tickets. However, this detection alone does not prove that a successful compromise has occurred; it indicates only an attempt to weaken security measures.

  ### Investigation Steps

  - **Review registry change events**: Check for Security Event ID 4663 or Sysmon Event ID 13, focusing on changes to `\DeviceGuard\EnableVirtualizationBasedSecurity`, `\DeviceGuard\LsaCfgFlags`, and `\Lsa\LsaCfgFlags`. Confirm if the value has been set to `0`.

  - **Verify the origin of changes**: Examine the event logs for the user account and process that modified the registry keys. Look for suspicious process activity around Windows Credential Guard modifications, focusing on unusual user contexts or privileged accounts.

  - **Identify legitimate behavior**: Ensure that expected administrative tasks, such as software installations or configuration updates, do not correspond with registry disablement. Regular system maintenance should not trigger a change in these specific registry values.

  - **Check for related security alerts**: Look for other alerts around the time of this registry change that may indicate a broader attack pattern, such as unusual logins or privilege escalations, which can be cross-referenced against the detected event.

  - **Correlate with user access logs**: Assess recent access events for the system in question, particularly focusing on remote access logs (Event ID 4624) or administrative access logs, to identify if any unauthorized access occurred prior to the registry changes.

  ### Prioritization

  This alert is high severity due to the critical nature of Credential Guard in protecting sensitive authentication material. The likelihood of exploitation is moderate, as disabling security features is a common tactic used by adversaries to facilitate further attacks. This behavior is typically weaponized in the context of advanced persistent threats.

  ### Blind Spots and Assumptions

  Detection may be limited by user account control policies that permit legitimate changes to these registry settings. Proper logging configurations for Windows registry modifications are essential for reliable detection. Legitimate administrative actions, such as system upgrades or GPO changes, may also trigger this rule. A related detection to consider is monitoring for unusual PowerShell commands or script executions that indicate attempts to manipulate system security settings.

