note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Subsystem for Linux (WSL) InstallLocation registry key. Attackers may alter this key to redirect legitimate WSL tools (e.g., wsl.exe or bash.exe) to execute malicious payloads, effectively bypassing security measures. This behavior primarily aligns with MITRE ATT&CK tactic "Defense Evasion" (ID: T1218) and the technique "System Binary Proxy Execution" (ID: T1112). The primary telemetry source for this detection includes Windows Registry set logs.

  If the modification is malicious, it could allow the adversary persistence and stealthier execution of payloads within the WSL environment, potentially leading to further compromise. However, it is essential to note that this detection does NOT confirm malicious activity by itself, as legitimate application updates or administrative changes may also trigger registry modifications.

  ### Investigation Steps

  - **Check registry modification details:** Review Registry Event Logs (Event ID 4657) for changes to the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Lxss\MSI\InstallLocation` key. Confirm the details match known benign paths (e.g., `C:\Program Files\WSL`).

  - **Identify the modifying process:** Investigate the involved process using Event ID 4688 (process creation) or Sysmon Event ID 1. Look for process logging that indicates modifications carried out by `msiexec.exe`, particularly confirming legitimate paths.

  - **Examine recent WSL activity:** Review WSL command execution logs to correlate any recent usage of WSL binaries (like `wsl.exe` or `bash.exe`) against the timeline of the registry modification.

  - **Validate against known behaviors:** Cross-reference with expected WSL registry behavior, such as legitimate updates to the InstallLocation key occurring during Windows Updates or WSL installations, using `%ProgramFiles%\WindowsApps\...` paths.

  - **Assess for high-confidence malicious indicators:** Look for modifications pointing to uncommon paths (e.g., `C:\Program Files\WindowsApps\MicrosoftCorporationII.WindowsSubsystemForLinux_`) that do not match typical installations and correlate with suspicious execution.

  ### Prioritization

  This alert should be treated as medium severity due to potential impacts on system integrity and security, specifically if the affected system plays a critical role in the enterprise environment. The likelihood of misuse is notable as the WSL environment has been exploited by adversaries for stealth attacks. Such modifications can be weaponized by malicious actors to execute payloads undetected.

  ### Blind Spots and Assumptions

  Detection relies heavily on appropriate logging configurations of the Windows registry, particularly ensuring that modifications to relevant keys are logged accurately. Legitimate application activity or administrative changes may produce similar alerts, potentially leading to false positives. Companion detections worth considering include monitoring for unexpected WSL process behaviors (e.g., unusual execution of shell commands via WSL) to reinforce confidence in the findings.

