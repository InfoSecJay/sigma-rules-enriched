  ### Technical Context

  This Sigma rule detects the modification of the registry key associated with `scrobj.dll`, which is commonly used for COM hijacking in Windows. Attackers may exploit this technique to execute malicious scripts by redirecting legitimate code execution paths to their payloads. The relevant MITRE ATT&CK tactic is Persistence, specifically technique T1546.015 (Component Object Model Hijacking).

  The primary telemetry source for this detection is Windows registry logs that capture changes, especially related to COM object registration. If malicious, this activity can lead to ongoing access to systems, exfiltration of data, or lateral movement. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also modify this registry key.

  ### Investigation Steps

  - **Review registry changes:** Examine the Windows registry for modifications to `InprocServer32\[Default]` under `HKEY_CLASSES_ROOT\CLSID{...}` using Event ID 4657 or Sysmon Event ID 13. Look for changes indicating a path to `C:\WINDOWS\system32\scrobj.dll`.

  - **Verify the legitimacy of the process:** Check the parent process of the application or script triggering the registry change by using Sysmon Event ID 1 (process creation). Legitimate changes typically originate from well-known system processes (e.g., `explorer.exe`, `svchost.exe`).

  - **Identify and analyze running scripts:** Search for associated script executions that leverage `scrobj.dll`. For this, review Windows Script Host logs or use PowerShell to monitor for `cscript.exe` or `wscript.exe` commands invoking scripts targeting COM objects.

  - **Validate against known bad signatures:** Use threat intelligence feeds to cross-reference the identified paths or script names against known malicious indicators related to COM hijacking.

  - **Investigate any unusual execution patterns:** Locate any recent changes to executable paths in Event ID 4688 (Process Creation) to determine if the modified registry entry is being exploited. Look for anomalies such as uncommon script execution times or descriptions.

  ### Prioritization

  This alert has a medium severity level. While the affected system's potential impact varies, the likelihood of malicious use is significant due to the nature of COM hijacking as a common persistence mechanism in attacks. This behavior is weaponized by various threat actors, and a close investigation is warranted.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to modify the registry without malicious intent. It is crucial to ensure that Windows registry auditing is enabled to capture critical changes. Also, benign applications may occasionally trigger this alert during updates. Companion detections, such as monitoring for unusual process creation events related to scripting engines (like `cscript.exe` or `wscript.exe`), would enhance coverage against this technique.

