note: |
  ### Technical Context

  This rule detects registry modifications related to Office's trust records, specifically targeting changes that may allow macro execution from unexpected or suspicious file paths. An attacker might leverage this behavior to enable malicious macros within documents, which can lead to code execution and lateral movement within the network. This activity aligns with the MITRE ATT&CK tactics of Persistence (T1112) and Defense Evasion, indicating an attempt to bypass security controls by establishing a foothold using macro-enabled documents.

  The primary telemetry sources are Windows registry logs, specifically monitoring for changes in the `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Security\Trusted Documents\TrustRecords` path. If malicious, this behavior may enable the execution of harmful payloads whenever a user opens a document from those flagged paths. It is crucial to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also modify trust settings.

  ### Investigation Steps

  - **Check registry modifications:** Review Windows registry logs for changes at `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Security\Trusted Documents\TrustRecords` (Event ID 4657). Look for unusual user accounts that do not typically modify these settings.

  - **Identify the path of modification:** Examine the values in `TargetObject` to determine if the path can be linked to known good locations versus suspicious locations such as `/AppData/Local/Microsoft/Windows/INetCache/` or `/AppData/Local/Temp/`.

  - **Analyze recent document activity:** Cross-reference document access logs (Office 365 logs or File Access logs) to identify if any macro-enabled document was accessed from these paths within a recent timeframe.

  - **Assess user behavior:** Review user activity within the environment to ascertain whether the affected user normally interacts with documents from expected safe locations, like their personal or configured work folders.

  - **Look for known malicious indicators:** Verify if the identified registry change coincided with known malicious file hashes or behaviors (e.g., associated with previously identified malware families).

  - **Validate document content:** If documents were accessed from persistent suspicious locations, verify if they contain macros (e.g., check via file analysis tools or scanning for `Word.Document` indicators in the document metadata).

  ### Prioritization

  This alert carries a high severity level due to its potential impact on enterprise systems. If successfully exploited, attackers can execute malicious code, leading to data breaches and further network compromise. The likelihood of malicious abuse is high as macro exploits are a common initial access vector in attacks.

  ### Blind Spots and Assumptions

  This detection may have limitations, such as false negatives if attackers use unsigned or benign macros. It relies heavily on proper Windows logging configuration (Audit Registry changes) to ensure comprehensive coverage. Legitimate file access patterns could also trigger this alert, especially in environments where users frequently interact with various document types. A related detection concerns unusual macro execution (e.g., monitoring for script execution behaviors via Event ID 4688) for enhanced coverage of potential malicious activities.

