note: |
  ### Technical Context

  This rule detects registry changes related to Microsoft Office's trust records that occur in suspicious locations, indicating that a macro-enabled document may have been executed. The likely attacker objective is to achieve persistence via malicious macros embedded in documents, often used to deliver malware or facilitate further exploitation. Relevant MITRE ATT&CK tactics and techniques include Persistence (TA0003) and User Execution (T1203). The primary telemetry sources are Windows registry logs, particularly those reflecting changes in the `\Security\Trusted Documents\TrustRecords` path.

  If this behavior is confirmed malicious, it can lead to unauthorized access, data theft, or further compromise of systems. However, this detection alone does not confirm the execution of malicious code; additional investigation and context are required to establish intent and impact.

  ### Investigation Steps

  - **Identify registry changes: **Investigate Windows Event Log Security Event ID 4657, specifically changes to the `\Security\Trusted Documents\TrustRecords` key. Look for recent modifications alongside timestamps corresponding to document handling.

  - **Examine document locations: **Verify the paths involved in the registry change. Paths such as `/AppData/Local/Microsoft/Windows/INetCache/` and `/AppData/Local/Temp/` are concerning, while directories like user home folders or documents are typically benign.

  - **Assess legitimate behavior: **Establish a baseline for macro-enabled document usage in your environment. Often, legitimate users accessing trusted documents do so from known project directories or network shares, not suspicious paths.

  - **Identify high-confidence malicious indicators: **Look for additional artifacts such as parent processes of suspicious apps (e.g., `WINWORD.EXE`) launching in rapid succession after registry changes, typically associated with macro execution attempts.

  - **Review user privileges: **Assess the user account involved in the registry change. High-privilege accounts modifying trust records in non-standard locations indicate a higher risk of malicious activity.

  - **Correlate with threat intelligence: **Compare identified behaviors and registry modifications with known threat actors and tactics for documentation-based exploits. Use data across your endpoint detection and response (EDR) solutions to gain a comprehensive view of the activity in relation to previous incidents.

  ### Prioritization

  This alert is high severity due to its potential impact on critical systems, particularly if macro-enabled documents can lead to malware deployment or unauthorized data access. The likelihood of abuse is significant, given that macro exploitation is a common initial access technique used by attackers.

  ### Blind Spots and Assumptions

  Detection may miss legitimate Office updates or internal processes if registry changes are expected. If security logging is not enabled or not set to capture registry modifications, this rule will be ineffective. Additionally, benign activities related to internal document review or policy changes might trigger alerts. Companion detections include monitoring for unusual Office process behavior (e.g., multiple instances of `WINWORD.EXE`), which can enhance overall detection coverage for macro exploitation scenarios.

