note: |
  ### Technical Context
  This detection rule identifies changes to Office trust records in the Windows Registry that occur in suspicious paths often associated with malicious document activity. Specifically, it targets modifications to the `\Security\Trusted Documents\TrustRecords` registry key, which is a common method for attackers to enable execution of macros in documents that could be potentially harmful. Attackers often use macro-enabled documents as entry points for malware delivery and to exploit Trust Relationships in a targeted environment.

  The likely attacker goal is to gain persistence through macro execution in documents that appear benign but may contain malicious payloads designed to exploit vulnerabilities, steal credentials, or deploy additional malware. This aligns with the **MITRE ATT&CK** tactics of **Persistence (T1112)** and **Defense Evasion**, where attackers seek to maintain access and evade detection while using malicious macros.

  Primary data sources for detecting such activities include Windows Registry logs, file access or modification logs, and potentially EDR data that captures process-level activity related to Microsoft Office applications. Monitoring these sources can provide insights into both the execution of suspicious documents and the resultant registry modifications.

  ### Investigation Steps
  - **Review Registry Changes**: Analyze recent modifications to the `\Security\Trusted Documents\TrustRecords` registry key. Identify the user context under which these changes occurred and the associated timestamps.

  - **Examine Document Locations**: Investigate the specific file paths listed in the detection logic (e.g., AppData, Temp folders) for the presence of macro-enabled documents. Look for unusual file types or names that could indicate malicious intent.

  - **Correlate with EDR Data**: Check for any related process creation events from EDR solutions that show Microsoft Office applications being launched unexpectedly, especially from the identified paths associated with macro activity.

  - **Assess User Behavior**: Conduct a review of the user's recent activities and access patterns. Determine whether the user frequently interacts with these paths or if this behavior is anomalous, potentially indicating a compromise.

  ### Prioritization
  This alert is marked as high severity due to the significant risk associated with macro-enabled documents, which are often utilized in phishing campaigns and malware distribution. The likelihood of exposure is elevated in enterprise environments where users frequently handle documents from various sources, making it critical to identify and respond to such threats promptly.

  ### Blind Spots and Assumptions
  This detection rule may not capture all malicious activity, particularly if attackers use less common paths or techniques to manipulate trust records or evade detection by using legitimate documents. The detection logic assumes that the registry changes will occur in paths that are generally inappropriate for user-generated documents, which may not always hold true in all environments. Effective monitoring of this rule requires appropriate logging settings for Windows Registry operations, ensuring that modifications are tracked and logged correctly for analysis.

