title: Potential Persistence Via DLLPathOverride
id: a1b1fd53-9c4a-444c-bae0-34a330fc7aa8
status: test
description: Detects when an attacker adds a new "DLLPathOverride" value to the "Natural
  Language" key in order to achieve persistence which will get invoked by "SearchIndexer.exe"
  process
references:
- https://persistence-info.github.io/Data/naturallanguage6.html
- https://www.hexacorn.com/blog/2018/12/30/beyond-good-ol-run-key-part-98/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection_root:
        # The path can be for multiple languages
        # Example:  HKLM\System\CurrentControlSet\Control\ContentIndex\Language\English_UK
        #           HKLM\System\CurrentControlSet\Control\ContentIndex\Language\English_US
        #           HKLM\System\CurrentControlSet\Control\ContentIndex\Language\Neutral
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Control\ContentIndex\Language\'
  selection_values:
    TargetObject|contains:
    - '\StemmerDLLPathOverride'
    - '\WBDLLPathOverride'
    - '\StemmerClass'
    - '\WBreakerClass'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects attempts by attackers to establish persistence on Windows systems through the manipulation of registry keys associated with the SearchIndexer.exe process. Specifically, it identifies when new "DLLPathOverride" values are added to the "Natural Language" key in the Windows registry. This behavior can enable an attacker to load malicious DLLs whenever the SearchIndexer.exe is invoked, potentially allowing them to execute arbitrary code with the privileges of that process.

  In a typical threat scenario, an attacker aims to maintain access to a compromised environment after initial exploitation. By placing malicious code in the registry to be triggered on a legitimate process, they can ensure their payload runs repeatedly. This aligns with the MITRE ATT&CK technique for persistence called "Registry Run Keys/Startup Folder" (T1547) and "Service Registry Permissions Weakness" (T1543). The primary data source for detecting this behavior is Windows registry logs, particularly the logs that track changes to key registry paths associated with Content Indexing.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the registry keys under `HKLM\System\CurrentControlSet\Control\ContentIndex\Language\` for any recent additions or modifications to the "DLLPathOverride" entries. Look for unusual values that reference unexpected or malicious DLLs.

  - **Analyze Process Activity:** Check the execution history of SearchIndexer.exe. Look for anomalies in the process creation logs, especially signs of execution outside typical operational patterns, such as running at odd hours or from unexpected user accounts.

  - **Inspect File System:** Investigate the file system for suspicious DLL files referenced by the overridden paths. Verify the file properties (e.g., digital signatures, file size, creation date) and conduct a malware analysis if the files are deemed suspicious.

  - **Query Endpoint Protection Logs:** If available, review alerts or logs from EDR solutions that may indicate suspicious behavior related to attempts to manipulate registry keys or unusual process execution involving SearchIndexer.exe.

  ### Prioritization
  This alert is considered high severity due to its potential to enable attackers to achieve persistence on a compromised system. The likelihood of these registry modifications being tied to malicious activity is elevated, especially in environments with high-value targets.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the logging levels for Windows registry changes are not adequately configured, potentially leading to missed modifications. The detection logic assumes that no legitimate applications are using these specific registry keys for benign purposes. Sufficient logging of registry changes is required for this alert to function effectively, including comprehensive monitoring of all registry modifications in the specified paths.

