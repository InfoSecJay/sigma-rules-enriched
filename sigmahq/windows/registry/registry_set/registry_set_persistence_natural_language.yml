title: Potential Persistence Via DLLPathOverride
id: a1b1fd53-9c4a-444c-bae0-34a330fc7aa8
status: test
description: Detects when an attacker adds a new "DLLPathOverride" value to the 
  "Natural Language" key in order to achieve persistence which will get invoked 
  by "SearchIndexer.exe" process
references:
- https://persistence-info.github.io/Data/naturallanguage6.html
- https://www.hexacorn.com/blog/2018/12/30/beyond-good-ol-run-key-part-98/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection_root:
        # The path can be for multiple languages
        # Example:  HKLM\System\CurrentControlSet\Control\ContentIndex\Language\English_UK
        #           HKLM\System\CurrentControlSet\Control\ContentIndex\Language\English_US
        #           HKLM\System\CurrentControlSet\Control\ContentIndex\Language\Neutral
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Control\ContentIndex\Language\'
  selection_values:
    TargetObject|contains:
    - '\StemmerDLLPathOverride'
    - '\WBDLLPathOverride'
    - '\StemmerClass'
    - '\WBreakerClass'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the addition of the "DLLPathOverride" value under the "Natural Language" registry keys in the Windows Registry. The likely objective of this behavior is to maintain persistence for a malicious payload, executed by the `SearchIndexer.exe` process, which could enable unauthorized execution of arbitrary code during searches. This activity corresponds to the MITRE ATT&CK technique "Registry Run Keys / Start Folder" (T1547.001), indicating persistence manipulations. The primary telemetry sources are Windows Registry change events, specifically focusing on the `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\ContentIndex\Language\` path. If malicious, this could allow an attacker to execute malware every time the search indexer runs. Importantly, this detection does NOT confirm malicious activity on its own; further context is required.

  ### Investigation Steps

  - **Review Registry Modifications:** Examine Windows Registry logs for Event ID 4657 indicating changes to the keys under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\ContentIndex\Language\`. Look for newly added keys, particularly those containing 'StemmerDLLPathOverride' or 'WBDLLPathOverride'.

  - **Assess Process Behavior:** Identify if `SearchIndexer.exe` (Event ID 4688) is launching with suspicious command-line arguments that might indicate misuse, or if it's invoking unexpected DLLs from paths related to this rule.

  - **Capture Recent Activity:** Validate the timeline of changes by reviewing security event logs (Event ID 1102) to track any unusual or unauthorized access to the registry, noting the user context involved.

  - **Identify Legitimate SearchIndexer Usage:** Confirm expected behavior by identifying instances of `SearchIndexer.exe` connecting with standard file paths and DLLs in case the registry modifications are legitimate to search indexing.

  - **Investigate User Context:** Determine if the modifications were made by an authorized user and correlating these actions with other insider activities, checking for any previously known accounts involved in malicious behavior.

  - **Correlate with Related Alerts:** Check for other alerts related to persistence mechanisms (e.g., Event ID 4663 for CreateFile access) around the same timeframe to establish a broader context of the activity.

  ### Prioritization

  The alert should be considered high priority due to its potential for enabling persistent access on critical systems. If exploited, attackers could maintain access and further compromise the environment. This behavior is not only uncommon in typical operations but is also frequently leveraged in various malicious attacks.

  ### Blind Spots and Assumptions

  Detection may miss events if the log source for registry changes is not enabled or configured properly. Attackers could leverage common evasion techniques such as using legitimate administrative activities to create these entries. Additionally, benign software installations might inadvertently trigger the alert, particularly from legitimate applications that modify the search index. Monitoring for other persistence-related detections, such as modifications to the task scheduler or startup folders, will enhance coverage.

