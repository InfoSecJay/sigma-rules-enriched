note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry key "PythonFunctionWarnings," which governs the display of security warnings when executing Python functions in Microsoft Excel. A likely objective of an attacker is to disable these warnings to execute malicious Python scripts in Excel without user awareness, potentially leading to data theft or system compromise. The relevant MITRE ATT&CK tactic is **Defense Evasion (TA0005)**, specifically the technique **Disable or Modify Tools (T1685)**.

  The primary telemetry source for this detection includes Windows registry change logs, specifically targeting modifications to the key located at `HKEY_CURRENT_USER\Software\Microsoft\Office\Excel\Security`. If malicious, the security impact could range from running arbitrary code to manipulating sensitive data without the user’s knowledge. This detection does NOT confirm malicious intent on its own; modifications to this registry key could occur for legitimate reasons, such as user preference changes.

  ### Investigation Steps

  - **Check for recent registry changes: ** Investigate the Windows registry under `HKEY_CURRENT_USER\Software\Microsoft\Office\Excel\Security` for `PythonFunctionWarnings`. Look for a DWORD value set to `1`, which indicates that security warnings have been disabled. Assess the timeframe relative to the alert.

  - **Review Excel process activity:** Correlate this registry modification with Excel process creation events (Security Event ID 4688 or Sysmon Event ID 1). Identify whether Excel instances are executing Python scripts around the same time as the registry change.

  - **Identify benign user behavior:** Establish baseline behavior by identifying any known user activity that may legitimately modify this key. For example, check if the user recently configured Excel for data analysis involving trusted Python libraries that require these settings.

  - **Analyze for suspicious Python activity:** Search for potentially malicious Python execution logs associated with Excel, such as unusual file or script access in Excel (File Access Event IDs) or checks for common attack payloads in Python script executions.

  - **Verify asset criticality:** Assess the importance of the affected host in the organization. If the affected machine holds sensitive data or operates critical applications, prioritize the investigation accordingly to mitigate potential risks.

  ### Prioritization

  The alert is rated high due to the potential for significant impact. Disabling warnings in Excel can enable attackers to execute harmful code covertly, especially since the feature is relatively new and may be leveraged in targeted campaigns. This behavior could be weaponized to bypass security controls, heightening its severity.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate software updates or user-configured settings disabling these warnings, which might lead to false positives. Reliable detection requires that Windows registry auditing is enabled to capture changes accurately. Additionally, software integrations that leverage Python could trigger this alert, such as legitimate script executions for data manipulation in Excel. A related detection to strengthen coverage would be monitoring for unauthorized Python executions or abnormal script file creations in conjunction with this registry change.

