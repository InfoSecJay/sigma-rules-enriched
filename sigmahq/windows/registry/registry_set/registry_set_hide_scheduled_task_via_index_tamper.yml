note: |
  ### Technical Context

  This Sigma rule detects modifications to the "index" value of a scheduled task in the Windows registry, a tactic commonly used by adversaries to hide task details from system administrators and security tools like "schtasks /query." The primary objective of this behavior is to obscure malicious activities from detection, allowing for persistence on the system. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (ID: T1562) and specifically utilizes the technique of Modify Registry (ID: T1543).

  The primary telemetry sources for this detection are Windows Registry modification logs, specifically logs related to registry key changes under the path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. If malicious, this behavior can indicate an ongoing evasion technique to hide unauthorized scheduled tasks on critical systems. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; further context is needed to assess the legitimacy of the changes.

  ### Investigation Steps

  - **Check recent scheduled tasks:** Review the latest scheduled tasks with `schtasks /query` to ensure they appear as expected. Legitimate tasks should be visible without any discrepancies in the task index values.

  - **Identify registry changes:** Query Windows Registry logs to locate Event ID 4657, focusing on changes to the `Index` DWORD value under the path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\`. Document abnormal changes that diverge from baseline behavior.

  - **Correlate user activities:** Examine account activity logs (e.g., Security Event ID 4624) to determine if the user associated with the index modification had normal administrative privileges or if unusual access patterns were present, which could indicate malicious behavior.

  - **Review historical tasks:** Utilize tools like PowerShell to enumerate previous scheduled tasks and their statuses, comparing this baseline against the current state to identify any new or altered tasks that are now hidden.

  - **Examine system security context:** Assess if the changes have been made by system processes or by users; anomalous modifications made outside of expected administrative roles should be flagged as suspicious.

  - **Validate intended configuration changes:** If the changes were made by known scheduled maintenance or updates (such as by a patch management system), ensure that there is proper documentation or approval for the changes made to the registry settings.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on critical systems when malicious actors hide their persistence mechanisms. The likelihood of exploitation is significant because altering the index of scheduled tasks is a known evasion tactic that can be weaponized in targeted attacks against enterprise environments.

  ### Blind Spots and Assumptions

  Detection may be limited if logging settings for registry modifications are improperly configured or if event monitoring does not encompass all necessary registries. There is a risk that legitimate administrative processes or maintenance scripts could inadvertently trigger this alert. Companion detections, such as unauthorized modifications to services or executable launches associated with the task (like Windows Event IDs for process creation), can strengthen overall threat posture against similar evasion techniques.

