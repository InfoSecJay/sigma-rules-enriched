note: |
  ### Technical Context

  This Sigma rule detects modifications to the “index” value of scheduled tasks in the Windows registry, which conceals tasks from standard query tools like "schtasks /query." The likely objective of an attacker using this technique is to maintain persistence and evade detection while running malicious tasks unnoticed. This behavior aligns with the MITRE ATT&CK technique T1685: "Hide Scheduled Task."

  The primary telemetry source for this detection is Windows Registry logs, specifically monitoring changes in the registry path related to scheduled tasks. If malicious, the impact could include unauthorized execution of processes or scripts, leading to system compromise. However, this detection alone does not confirm that malicious activity occurred, as legitimate applications may also modify scheduled tasks under certain conditions.

  ### Investigation Steps

  - **Check Registry Changes: Review the specific registry key**: Verify changes to "\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\" for any task modifications. Look specifically for entries that have had their “Index” value set to DWORD (0x00000000) as this indicates tampering.

  - **Analyze Task Scheduler Events: Investigate Event ID 4698**: This event is generated when a scheduled task is created. Cross-reference the timestamp and details of tasks that were scheduled versus the registry changes identified to assess if there is a malicious indicator or inconsistency.

  - **Identify Legitimate Scheduled Task Modifications**: Determine if any legitimate applications have modified scheduled tasks around the same timeframe by observing Event IDs 4698 and 4702. Consider asset criticality and if vital operational tasks may require such changes.

  - **Review for Malicious Processes:** Look in the process creation logs, specifically Security Event ID 4688 and Sysmon Event ID 1, that correlate with the time the index was changed. High-confidence malicious indicators include unknown executables using unusual paths linked to scheduled tasks that were modified.

  - **Examine Run History and Task Actions:** Validate task execution history by assessing the logs found in Event ID 106. This will provide insight into whether the altered tasks were executed and their impact.

  - **Cross-Reference with Similar Detections:** Review alerts captured by related detections like T1053.005 (Scheduled Task/Job) to see if there are associated behaviors indicating a coordinated attack, such as modifications in multiple tasks across the environment.

  ### Prioritization

  This alert holds high severity due to the potential for critical systems to be compromised through disguised scheduled tasks. The likelihood of malicious abuse is increased because hiding tasks is a common technique used by attackers for persistence, indicating a need for immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be bypassed if an attacker employs non-traditional methods for task management, such as leveraging third-party tools that do not trigger standard Windows audit logs. Additionally, if registry logging is not adequately configured, there may be gaps in visibility. Legitimate administrative tasks, such as software updates that modify scheduled tasks, might also trigger the alert. Companion detections like T1053.003 (Scheduled Task/Job Creation) enhance coverage but may require overarching monitoring for context.

