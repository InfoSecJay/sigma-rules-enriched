note: |
  ### Technical Context
  This detection rule identifies attempts to modify the "index" value of scheduled tasks in the Windows registry. By altering this value, an attacker can effectively conceal a scheduled task from standard query tools like `schtasks`, potentially hiding malicious activity that could be used for persistence, lateral movement, or maintaining access in a compromised environment. Attackers leveraging this technique may aim to evade security monitoring and create a backdoor for re-entry into the system.

  The relevant MITRE ATT&CK tactics and techniques for this behavior include **Defense Evasion** (T1562) which encompasses various methods an adversary may use to avoid detection, including modifying registry values associated with system processes. The primary data sources for detecting this modification are Windows registry set logs, specifically monitoring changes to keys associated with scheduled tasks.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows registry logs focusing on the keys: `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\` for any modifications to the "Index" value, specifically looking for changes that indicate a DWORD value set to `0x00000000`.

  - **Analyze Scheduled Tasks**: Utilize tools such as PowerShell or command-line utilities to enumerate all scheduled tasks, looking for discrepancies between expected tasks and those modified or hidden as indicated by the registry changes.

  - **Audit User Activities**: Investigate account activity that correlates with the time of the registry modification, checking for unusual administrative access or the creation of tasks that do not match organizational patterns.

  - **Cross-reference with EDR Data**: Leverage EDR data to correlate process execution logs with the time of registry modifications to identify any potentially malicious behaviors or commands being executed that relate to the scheduled tasks.

  ### Prioritization
  This alert is classified as high severity due to the potential for significant impact, as hidden scheduled tasks often indicate malicious intent and can be used for evading detection, persistence, and executing further attacks within the enterprise environment.

  ### Blind Spots and Assumptions
  The primary blind spot in this detection rule is that it only captures modifications within a specific registry path without accounting for other potential evasion techniques or changes elsewhere. The detection assumes that relevant logging for registry changes is suitably configured and being monitored. It also depends on the absence of benign activities that may alter the same keys, leading to potential false positives; thus, context is required when investigating alerts. Additionally, logs from security software may not uniformly capture all registry access events, necessitating comprehensive logging configurations to ensure full coverage.

