note: |
  ### Technical Context

  This Sigma rule detects changes to the "HVCIDisallowedImages" registry value, which is used to prevent specific drivers from loading in a Hypervisor-Protected Code Integrity (HVCI) environment. An attacker may attempt to add a malicious driver to this list to bypass security controls and maintain persistence. This behavior aligns with the MITRE ATT&CK technique for Driver Manipulation (T1136) under the Defensive Tactic: Persistence. The primary telemetry source comes from Windows registry logs, specifically monitoring registry changes related to HVCI.

  If the change is malicious, it could compromise the integrity of the system by allowing unauthorized driver execution, posing significant risk to sensitive data and system security. However, this detection does NOT confirm malicious intent on its own; legitimate administrative actions may also trigger this alert.

  ### Investigation Steps

  - **Verify the registry change**: Inspect the registry key at `HKEY_LOCAL_MACHINE\Control\CI\HVCIDisallowedImages` to identify the specific driver added. Legitimate changes typically involve known and trusted drivers that are part of system administration.

  - **Look for system event logs**: Review Windows Event ID 4657 (Registry Value Changed) or correlate with Event ID 4663 (Object Access) to find related activities around the time of the registry change. This can provide context about the source of the modification.

  - **Check for abnormal driver behavior**: Investigate system driver behavior via Sysinternals tools like `Sysmon`. Look for unexpected driver loads using Sysmon Event ID 6 or unexpected process creations (Event ID 4688) associated with the driver.

  - **Assess the driver added**: Conduct a reputation check on the driver added to the HVCI disallowed list. Use a threat intelligence service to determine if the driver is known for malicious activity.

  - **Review administrative actions**: Check if there were recent administrative activities (like software installations) that correlate with the timing of the registry modification, thus helping distinguish between malicious and legitimate actions.

  ### Prioritization

  This alert is considered high severity due to its potential impact on system integrity and security. The modification of HVCI settings is not common for benign activities, increasing the likelihood of malicious intent, especially in environments with stringent security policies.

  ### Blind Spots and Assumptions

  Detection may be limited if registry logging is not properly configured or enabled on the monitored systems. Malicious actors may obfuscate registry changes, using legitimate tools or scripts to modify HVCI settings. Legitimate administrative tasks or system updates could also trigger this alert. A companion detection to consider is monitoring for unauthorized driver load attempts (potentially through Sysmon logs), which can provide further validation of potentially malicious behavior.

