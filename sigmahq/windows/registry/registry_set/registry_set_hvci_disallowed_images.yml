  ---

  ### Technical Context

  This rule detects modifications to the Windows registry key associated with HVCI (Hypervisor-Protected Code Integrity), specifically changes to the "HVCIDisallowedImages" registry value. Such modifications typically indicate an attempt by an attacker to bypass kernel-level protection mechanisms by injecting unauthorized drivers. The likely adversary objective is to load malicious drivers or tools that could help maintain persistence or escalate privileges on a compromised machine.

  This activity maps to the MITRE ATT&CK tactic of **Defense Evasion** (TA0005), particularly technique **T1213: Caveat Emptor**. Primary telemetry sources include Windows Registry logs that capture registry key modifications. If malicious, this behavior poses severe risks as it could enable unauthorized driver execution, undermining system integrity. However, it is important to note that this detection alone does not confirm malicious intent without additional context regarding the driver being added.

  ---

  ### Investigation Steps

  - **Check the registry modification source: ** Investigate Event ID 4657 in Security logs to identify the user or process that modified the "HVCIDisallowedImages" key. Look for unusual accounts or system processes typically not associated with such changes.

  - **Identify the modified driver: ** Confirm the driver being added to the "HVCIDisallowedImages" list by examining the registry key value. Cross-reference this against known malicious drivers or previously authorized drivers for legitimate applications.

  - **Examine the context of intended driver usage: ** Verify if the driver is part of a legitimate application update or installation process by checking recent installation logs (Event ID 1033 in the Windows Installer logs) and its digital signature.

  - **Monitor for additional registry modifications: ** Look for other changes in kernel-related registry paths (e.g., under `\Control\Session Manager\`) that could indicate further malicious activity (Event ID 4657).

  - **Assess system and network behavior: ** Analyze network connections or created processes associated with the registered driver using Sysmon Event ID 1 (process creation) and Event ID 3 (network connections) to correlate additional malicious indicators.

  - **Review for similar alerts: ** Cross-reference this alert with related detections (e.g., similar registry modifications detected with the ID 44cee399-f6b1-45cc-a87c-ea14c6064d6b) to evaluate if this is part of a broader attack.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on system integrity and the likelihood of being exploited by attackers for privilege escalation or persistence. Given that registry manipulation in this context is not a common legitimate operation, the likelihood of malicious abuse is high.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by evasion techniques such as attackers using legitimate applications to alter registry keys unnoticed. Reliable detection requires proper logging configurations for registry changes, which need to be enabled through Group Policy. Legitimate software updates can trigger alerts if they modify the "HVCIDisallowedImages" key. Companion detections, such as monitoring changes to other key security settings or tracking unusual driver loads (Sysmon Event ID 6), can strengthen coverage and context for a comprehensive assessment.

