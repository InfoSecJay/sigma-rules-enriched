note: |
  ### Technical Context
  This detection rule identifies attempts to modify the "HVCIDisallowedImages" registry value on Windows systems, which is a security feature of Hypervisor Code Integrity (HVCI). The modification of this registry entry is indicative of an attempt to prevent specific drivers from loading, potentially to allow a malicious driver or to bypass security measures in place. Attackers may leverage this technique as part of efforts to evade defensive mechanisms, particularly to ensure persistence or achieve privilege escalation.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), particularly the technique **Modifying Registry** (T1112). Attackers modifying HVCI settings might aim to persist within the network undetected by disabling or evading protections aimed at preventing the execution of unauthorized or malicious code.

  To detect such modifications, primary data sources include Windows registry event logs related to changes in system registry entries, particularly those concerning driver integrity settings. These logs provide essential evidence of unauthorized alterations that could indicate malicious intentions.

  ### Investigation Steps
  - **Review Registry Change Logs:** Access and analyze the Windows registry logs to identify the specific driver that was added to the "HVCIDisallowedImages" key. Look for timestamps and correlating events to determine if the modification corresponds to any suspicious activity.

  - **Investigate Driver Behavior:** Once the driver in question is identified, check its reputation and behavior using threat intelligence platforms. Investigate if it has known associations with malware or has been flagged in similar environments.

  - **Correlate with Other Security Events:** Check for related security events around the same timeframe in EDR and SIEM systems, such as process creations, network connections, or other registry modifications, to identify potential precursor activities or related threats.

  - **Assess System Integrity and Configuration:** Evaluate the system's integrity and configuration settings to ensure that no other security measures have been compromised. This may include reviewing HVCI settings and verifying the operational state of other security controls.

  ### Prioritization
  This alert is considered high severity due to the potential impact of malicious modifications to critical security settings in a Windows environment. If successful, such evasive actions can significantly increase the risk of system compromise and unauthorized access.

  ### Blind Spots and Assumptions
  Detection may not cover all scenarios where legitimate users modify the registry for valid purposes, raising the possibility of false positives. The detection logic assumes that any change to the HVCIDisallowedImages key is suspicious; however, it lacks context on the legitimacy of the driver modifications. Furthermore, complete logging of registry changes and appropriate permissions must be configured on endpoints for this alert to trigger effectively.

