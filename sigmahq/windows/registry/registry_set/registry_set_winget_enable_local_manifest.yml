note: |
  ### Technical Context
  This rule detects changes to the Windows AppInstaller (winget) policy, specifically focusing on the activation of local manifest installation capabilities. By allowing users to install software packages via custom manifests, an attacker could exploit this feature to bypass standard application controls and introduce potentially malicious software into an enterprise environment. The likely objective of such an activity would be to install unauthorized applications or tools which could facilitate further exploitation, persistence, or lateral movement within the network.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (T1203)**, as an attacker could use local manifest installation to evade detection by circumventing traditional software installation mechanisms. Additionally, this activity can relate to **Persistence (T1546)**, where custom applications are installed to retain access to the environment.

  The primary data sources for evidence include registry change logs specifically related to the AppInstaller settings, enabling analysts to see the alterations made to the local manifest installation policy.

  ### Investigation Steps
  - **Review Registry Logs:** Examine Windows registry change logs for modifications to the `EnableLocalManifestFiles` value in the `AppInstaller` key to determine who made the change and when.
  - **Analyze Installed Applications:** Check for newly installed applications or software packages that were installed following the activation of local manifest installation, which could indicate unauthorized software deployment.
  - **Correlate User Activity:** Investigate the user account associated with the registry change for any unusual activity, including logins from atypical locations or times, which might suggest a compromise.
  - **Monitor for Additional Changes:** Looking for subsequent modifications to registry keys related to `AppInstaller` settings could help identify any further adjustments made to installation policies, which may indicate ongoing malicious intent.

  ### Prioritization
  This alert has a medium severity as unauthorized use of local manifest installations can lead to the introduction of malicious software, posing a significant risk to enterprise integrity and data security. Given the potential impact on the environment and the relatively low likelihood of legitimate use, it warrants prompt investigation.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection rule is its reliance on explicit changes to the registry; if attackers use other methods to install software that do not trigger this registry change, those activities may go undetected. The detection logic assumes that the local manifest installation is not commonly enabled by legitimate users, though false positives may arise from administrators or developers testing configurations or running internal scripts. Sufficient logging of registry changes must be enabled to ensure this alert is functional, and such configurations should be regularly validated to maintain effectiveness.

