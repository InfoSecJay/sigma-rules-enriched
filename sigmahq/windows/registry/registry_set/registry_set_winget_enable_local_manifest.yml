note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows registry setting related to the AppInstaller (winget) policy, specifically the activation of local manifest installations. By enabling this setting, an attacker can potentially install unauthorized packages via custom manifests, bypassing typical security controls. The likely attacker objective may include gaining persistence on the system or deploying malicious software stealthily.

  This behavior aligns with the MITRE ATT&CK tactic of Persistence (T1547) and the technique of Install Util (T1218.011). The primary telemetry source for this detection is Windows Registry changes, specifically monitoring actions related to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppInstaller\EnableLocalManifestFiles`. If this change is malicious, it can lead to unauthorized software installation and potential system compromise. Importantly, this detection does not confirm that an installation occurred or that the package in use is inherently malicious without additional context.

  ### Investigation Steps

  - **Examine registry changes:** Review Windows Registry Event log (Event ID 4657) to confirm that the `EnableLocalManifestFiles` entry has been set to `1`. Note the timestamp and the account that made the change.

  - **Verify legitimate usage:** Check for historical registry state by using a trusted image or baseline to identify if this setting was previously disabled (`0`). Normal environments typically have this setting deactivated for security.

  - **Identify running packages:** Look at the logs under Windows Event ID 4100 related to AppInstaller activity to track recent package installations initiated post-registry change. Correlate these with known good software signatures to determine legitimacy.

  - **Evaluate user permissions:** Investigate the account making the registry change. Look for accounts with administrative privileges (check the membership of local admin groups) to assess if the action aligns with expected user behavior.

  - **Review installed applications:** Use PowerShell or similar tools to list currently installed applications (`Get-Package` cmdlet) post-registry change. Identify any newly added packages that correspond to suspicious activity or are not typically used in your environment.

  - **Investigate system and security events:** Cross-check Windows Security Event logs (Event ID 4688) for any process creations related to the installation tools used (e.g., winget.exe or msiexec.exe) around the time of the registry change for unauthorized installation attempts.

  ### Prioritization

  This alert has medium severity due to the potential for unauthorized installations if the setting is maliciously enabled. The likelihood of abuse is high, as enabling local manifest installations can easily be leveraged for delivering unapproved software. This behavior is not typically weaponized, but may still facilitate other attack vectors if exploited.

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion techniques such as direct registry modifications by privileged users without logging. Reliable detection requires that auditing for registry changes be enabled on the target systems. Legitimate activities, such as a developer enabling this capability for internal application testing, may also trigger the alert. A related detection would include monitoring for unusual software installation events, which can provide additional context around the registry change.

