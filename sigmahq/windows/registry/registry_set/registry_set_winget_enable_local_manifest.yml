note: |
  ### Technical Context

  This rule detects modifications to the Windows AppInstaller policy that enable local manifest installations using the `winget` tool. The behavior being tracked is the activation of a setting that allows users to install software via custom manifests, potentially altering approved software installation processes. The likely attacker objective is to inject malicious software through these custom manifests, leading to unauthorized persistence or execution of harmful payloads.

  This detection maps to the MITRE ATT&CK technique of "Software Deployment Tools" (T1203) and "Local File Inclusion" (LFI) (T1189). The primary telemetry source is Windows Registry logs, specifically focusing on registry changes related to the AppInstaller service. If exploited maliciously, this capability could compromise system integrity and enable further persistence mechanisms. However, this detection does NOT confirm that a malicious action has occurred without further context, as legitimate administrative actions commonly trigger it.

  ### Investigation Steps

  - **Review Registry Changes: ** Check for registry modifications under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppInstaller` with a focus on the `EnableLocalManifestFiles` value. This should be a DWORD set to `1` to trigger the alert.

  - **Identify Recent Activity: ** Correlate the timing of the registry change with user activity logs (Security Event ID 4624 for logon events). This helps determine if the modification was done by an authorized administrator or potentially malicious actor.

  - **Examine Installed Packages: ** Use `winget list` and check for any recent installations that were initiated using local manifests. Look for unusual or unexpected packages that align with the timing of the registry change.

  - **Validate Legitimate Use Cases: ** Determine if any known administrators or developers initiated the enablement of local manifest files for testing or development purposes. Ensure proper documentation supports the legitimacy of their actions.

  - **Detect Anomalous Patterns: ** Review the application of `winget` commands in conjunction with the change. Look for execution logs in `Event ID 4688` for process creation that indicates installation of software immediately following the registry change.

  ### Prioritization

  The alert is medium severity due to the potential for critical impact if an untrusted user gains the ability to install malicious software via local manifests. The likelihood of malicious abuse is moderate, particularly if a threat actor seeks to exploit trusted installation vectors. While this behavior is technically weaponizable, it requires specific circumstances and additional maneuvers to be effectively exploited.

  ### Blind Spots and Assumptions

  This detection relies on accurate monitoring of registry changes; if logging is not configured to capture these events, crucial data may be missing. Evasion techniques might include disabling logging or delegating permissions to trusted users who are unaware of unsafe practices. The alert can also be triggered by legitimate administrative actions, such as installations for internal applications or testing. A related detection could focus on `Event ID 4688` to monitor for suspicious process creation involving `winget`, enhancing visibility into potential exploitation attempts through this tool.

