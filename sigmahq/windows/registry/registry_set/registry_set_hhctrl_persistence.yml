note: |
  ### Technical Context
  This rule detects attempts by attackers to establish persistent access on a Windows system by modifying the registry entry for `hhctrl.ocx`. The hhctrl.ocx file is a legitimate Windows component associated with HTML Help and can be abused by adversaries to point to a malicious binary, allowing them to regain control of the system after reboots or user logins. The attacker’s objective typically centers around maintaining access while evading detection, which is crucial for conducting further malicious activities undetected.

  The threat scenario aligns with the MITRE ATT&CK framework, specifically under the techniques of Persistence (T1547), particularly file or registry permissions modifications, as attackers often manipulate registry keys to alter execution paths for malicious payloads. The primary data source for evidence collection includes Windows registry logs, where changes to specific keys, such as the one targeting `hhctrl.ocx`, can be monitored to identify suspicious modifications.

  ### Investigation Steps
  - **Review Registry Logs:** Analyze Windows registry logs for any modifications to the key `HKEY_CLASSES_ROOT\CLSID\{52A2AAAE-085D-4187-97EA-8C30DB990436}\InprocServer32`. Look specifically for entries that have been altered to direct to non-standard or malicious binaries.

  - **Check Process Creation Events:** Inspect process creation events to identify any executions of `hhctrl.ocx`. Correlate these with timestamps of recent registry changes to determine if execution aligns with a suspicious modification.

  - **Examine Startup Entries:** Look for additional persistence mechanisms in startup folders or other registry locations such as Run keys that may indicate further attempts to maintain access beyond `hhctrl.ocx`.

  - **Conduct System Scans:** Utilize EDR tools to perform a full system scan for known indicators of compromise (IoCs) related to malware that might leverage hhctrl.ocx for persistence.

  ### Prioritization
  The alert is classified as high severity due to the significant risk presented by persistent access mechanisms. An attacker achieving persistent foothold could lead to extended data exfiltration, lateral movement, or complete system compromise, making this an urgent response scenario.

  ### Blind Spots and Assumptions
  One gap in detection coverage is the potential for legitimate software and processes to modify the registry without triggering alerts, leading to false negatives. Furthermore, the detection logic assumes that administrators have not altered the default behavior of the `hhctrl.ocx`, which may not always hold true. The effectiveness of this alert relies on having comprehensive logs of registry changes enabled, which might not be configured across all enterprises.

