note: |
  ### Technical Context

  This rule detects modifications made to the registry key for `hhctrl.ocx`, a component associated with the Windows Help system, to point to a custom binary established by an attacker. The likely objective of this behavior is to maintain persistence on an infected system, enabling the adversary to execute malicious payloads even after system reboots. This detection aligns with the MITRE ATT&CK tactic of “Persistence” and technique “Modify Existing Service” (T1543.003).

  The primary telemetry source for this detection is Windows registry modification logs, specifically regarding the `HKEY_CLASSES_ROOT\CLSID\{52A2AAAE-085D-4187-97EA-8C30DB990436}\InprocServer32\(Default)` registry path. If the modification is malicious, it can lead to significant impacts such as unauthorized remote access or data exfiltration. It is important to note that this detection does not automatically confirm malicious activity; it merely indicates a registry change that warrants further investigation.

  ### Investigation Steps

  - **Verify the registry modification:**
    Check the Windows Registry for changes to the key `HKEY_CLASSES_ROOT\CLSID\{52A2AAAE-085D-4187-97EA-8C30DB990436}\InprocServer32\(Default)` using tools such as `regedit` or `reg query` to confirm if it points to a non-standard binary.

  - **Inspect the binary location:**
    If the value points to a binary, assess the path. Legitimate usage typically remains in `C:\Windows\System32\hhctrl.ocx`. Any deviation, such as a newly created binary in a user or temp directory, is suspicious.

  - **Monitor process creations:**
    Review Security Event ID 4688 to track processes related to the modified hhctrl.ocx. Investigate if any processes spawned from unusual paths or if executable paths point to non-standard binaries linked to persistence methods.

  - **Check for associated services:**
    Examine Service Control Manager logs for any newly created services that reference `hhctrl.ocx` or the altered path, using Event ID 7045. Legitimate services do not commonly use this component for execution.

  - **Analyze user activity:**
    Look for recent user logins or elevated permissions (Event ID 4624 with Logon Type 3 and 5) that coincide with the change timestamp. This can help differentiate between potentially malicious and legitimate administrative activity.

  ### Prioritization

  The alert severity is high due to the potential impact of unauthorized access to a critical system. The ability of an attacker to make such a modification indicates a high likelihood of malicious intent, as this method of persistence is known to be weaponized by various threat actors.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques, such as a legitimate user modifying the registry, which could trigger a false positive. Reliable detection requires full visibility into registry changes, necessitating configured logging for registry access events. Legitimate updates to system components or software installations may also trigger these alerts. Companion detections could include monitoring system startup events or analyzing file creation timestamps for new binaries executing from unusual locations.

