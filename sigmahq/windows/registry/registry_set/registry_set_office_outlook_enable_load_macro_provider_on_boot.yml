note: |
  ### Technical Context

  This rule detects modifications to the Outlook registry setting "LoadMacroProviderOnBoot," which, when enabled (set to 1), allows the automatic loading of Visual Basic for Applications (VBA) projects at Outlook startup. Attackers may leverage this functionality for persistence by loading malicious macros when Outlook is launched. This behavior aligns with the MITRE ATT&CK tactics of Persistence (T1546) and Privilege Escalation (T1137). The primary telemetry source for this rule is Windows Registry modifications, specifically tracking registry operations associated with Outlook settings. If malicious, this could allow an adversary to maintain a foothold in the environment by executing their code each time a user interacts with Outlook. It is important to note that the detection of this registry change does not confirm that the macro is malicious or has been executed, as it could be a legitimate modification.

  ### Investigation Steps

  - **Check the registry value for LoadMacroProviderOnBoot:** Review the registry key at `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Outlook\Security\` to confirm if `LoadMacroProviderOnBoot` is set to `1`. Legitimate settings usually keep this value at `0`.

  - **Correlate the change event with user activity:** Look for Security Event ID 4663 in the Windows Security logs corresponding to registry write attempts. Analyze the user account making the change – verify if it belongs to an admin or a known user performing updates.

  - **Review Outlook VBA Project Components:** If the registry value is modified, check for existing VBA projects by looking in the `VBA->Project Explorer` in Outlook to see if unauthorized projects are present.

  - **Inspect for command-and-control traffic:** Analyze network telemetry (e.g., firewall logs for outbound connections) for suspicious communication that could correlate with payload delivery or command execution once Outlook starts. Commonly observed indicators include unusual DNS queries to known malicious domains.

  - **Identify legitimate modification use cases:** Understand common business processes that may lead to the modification of this registry setting (e.g., use of organizational VBA scripts). Document expected baseline behavior against abnormal changes.

  - **Confirm autorun behaviors via OSINT:** Research and compile a list of known malicious actors who employ similar persistence techniques with Outlook. This can guide your escalation by establishing a contextual history of such activity.

  ### Prioritization

  This alert is high priority due to the potential for malicious persistence via a widely used application, Outlook, which may indicate advanced threat behavior. The modification of this setting can often facilitate macro-based attacks, which are commonly weaponized in various phishing campaigns.

  ### Blind Spots and Assumptions

  Detection may overlook legitimate use cases where trusted organizational macros are employed or administrators configuring systems. Ensure that Windows Registry auditing is enabled to detect changes effectively. The alert might also not capture all instances of malicious persistence if adversaries employ obfuscation or custom scripts. Related detections could include monitoring Outlook VBA execution logs to strengthen overall coverage.

