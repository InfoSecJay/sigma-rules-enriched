note: |
  ### Technical Context
  This detection rule is designed to identify changes to the "NoLMHash" registry setting on Windows systems. Specifically, it alerts when this registry value is modified to allow the storage of LAN Manager (LM) hashes, which can lead to severe vulnerabilities in an organization's security posture. Instructing the system to store LM hashes, particularly by setting the value to '0', may indicate a malicious actor's intent to gain unauthorized access or escalate privileges within a network.

  The likely attacker objectives behind enabling LM Hash storage typically center on compromising user credentials, facilitating lateral movement across systems, or executing privilege escalation. Storing LM hashes can lead to weaker password hashing, making it easier for attackers to capture and crack passwords. This behavior aligns with the MITRE ATT&CK technique T1112, which concerns altering the security configuration of systems to support persistence or evasion.

  To effectively capture evidence of this behavior, primary telemetry sources include registry change logs, process creation events that might indicate the execution of scripts or tools modifying these settings, and any relevant security event logs that monitor changes to authentication mechanisms.

  ### Investigation Steps
  - **Review Registry Change Logs:** Collect and analyze logs showing modifications to the registry, specifically looking at changes to the "NoLMHash" setting in `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa`.

  - **Correlate Process Creation Events:** Look for any process creation events around the time the registry change occurred, especially focusing on scripts or binaries that may interact with the Windows registry or network authentication protocols.

  - **Inspect Authentication Logins:** Check security logs for authentication attempts or logins from accounts that may have been impacted by the LM hash storage modification. This includes failed login attempts and unusual patterns of account usage.

  - **Assess Impact on User Accounts:** Analyze user accounts that may be at risk due to LM hash storage, identifying any accounts with excessive privileges that could have been targeted by an attacker.

  ### Prioritization
  This alert has a high severity level because enabling LM hash storage can expose an enterprise to significant security risks, including credential theft and unauthorized access to sensitive systems, especially if attackers leverage weak password hashes.

  ### Blind Spots and Assumptions
  One potential blind spot is the detection of registry changes performed by non-standard applications or custom scripts that might not leave typical footprints in logs. The detection logic assumes that the modification to "NoLMHash" will be captured in registry change logs; however, if these logs are not enabled or are misconfigured, detection may fail. Proper logging of registry modifications and monitoring tools must be adequately configured to ensure alert effectiveness.

