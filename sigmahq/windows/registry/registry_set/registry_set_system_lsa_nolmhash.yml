note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry, specifically changes to the "NoLMHash" value, enabling the storage of LAN Manager (LM) hashes. Attackers may exploit this to facilitate credential harvesting or lateral movement by allowing weak password hashes to be stored, thus weakening the environment's security posture. This behavior fits within the MITRE ATT&CK framework under the Persistence tactic (TA0003) and Defense Evasion technique (T1112).

  Primary telemetry sources include Windows Registry logs, specifically monitoring registry modifications targeting `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\NoLMHash`. If an attacker modifies this setting, they may compromise the integrity of hashed credentials, increasing the risk of credential-based attacks. Importantly, this detection does not confirm malicious intent on its own; legitimate administrative actions could also trigger this alert.

  ### Investigation Steps

  - **Check registry modification details:**
    Inspect the Windows Registry Event logs for Event ID 4663, focusing on changes made to the `NoLMHash` registry value. Check who made the change (SubjectUserName) and when (ObjectTime). Legitimate changes are often performed by system administrators or through system-level updates.

  - **Review user account activity:**
    Analyze security logs, especially Event ID 4624, to identify logon attempts by accounts around the time of the registry change. Look for suspicious accounts (e.g., service accounts with unusual logon times) that may correlate with the modification.

  - **Correlate with process creation events:**
    Use Sysmon logs (Event ID 1) to analyze processes that executed around the same time as the registry modification. Identify if any unusual command-line arguments or parent-child process relationships indicate a potentially malicious workflow.

  - **Assess asset criticality:**
    Determine affected system roles by reviewing asset classification and criticality. Systems storing sensitive or administrative credentials are high-risk if this setting is modified.

  - **Identify high-confidence indicators of compromise:**
    Check for entries in Event ID 5145 that correspond to unauthorized access to sensitive files immediately following the registry change. Look for access patterns from unusual accounts (e.g., unexpected domain users).

  - **Validate against known legitimate behavior:**
    Review documentation or change management records alongside telemetry to confirm expected changes by authorized personnel. Legitimate activity typically involves documented administrative tasks performed by known IT staff.

  ### Prioritization

  This alert is high severity due to the potential to compromise passwords and credential data on critical systems. Given the high likelihood of exploitation, especially in an enterprise context where LM hashes can be cracked, it presents a clear avenue for attackers to increase foothold or pivot across the network. This modification of the NoLMHash value is known to be weaponized in various attacks.

  ### Blind Spots and Assumptions

  Detection relies entirely on capturing registry modifications; if logging configurations are inadequate, this event may remain undetected. Adversaries might suppress logging or use legitimate administrative accounts to modify this registry setting without raising alerts. Additionally, legitimate software installations or updates can alter the `NoLMHash` value. Related detections, such as monitoring for the use of weak passwords via the credential dumping technique (T1003), can strengthen overall security posture and detection coverage.

