  ---

  ### Technical Context

  This rule detects modifications to the "NoLMHash" registry key, specifically when it is set to "0" (DWORD), allowing Windows to store LAN Manager (LM) password hashes. Attackers may target this setting to leverage weaker hash storage for credential harvesting or lateral movement within a network. This behavior directly relates to the MITRE ATT&CK technique T1112 - Modify Registry.

  The primary telemetry source for this detection is the Windows Registry, specifically tracking changes under the registry path: `System\CurrentControlSet\Control\Lsa\NoLMHash`. If a malicious actor successfully alters this setting, they may exploit the weak LM hashes, leading to unauthorized access or credential theft. It is crucial to note that this detection alone does not confirm malicious intent; legitimate system administrators could modify this registry key under specific contexts.

  ---

  ### Investigation Steps

  - **Review registry changes:** Examine Windows Registry logs to confirm changes to the key at `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\NoLMHash` (Event ID 4657 for registry modifications). Confirm the value was set to "0" and check timestamps against administrative activity logs.

  - **Identify administrative actions:** Cross-reference changes to the NoLMHash value with user activity in the Security Event Log (Event ID 4672 for special privileges assigned to new logon). Determine if the action was taken by an authorized admin account or an unexpected user.

  - **Validate credential storage practices:** Check if LM hashes are being utilized by running `nltest /domain_trusts` to ensure that best practices for password storage are being enforced. LM hashes should ideally not be present in a secure AD environment.

  - **Look for related suspicious activity:** Investigate for other potential indicators of compromise, such as unusual account lockouts or failed login attempts (Security Event ID 4625). Patterns of account abuse may indicate malicious intent.

  - **Assess asset criticality:** Note the role and sensitivity of the affected system. Changes to this registry key on domain controllers or sensitive servers should be treated with heightened scrutiny due to their critical function in the environment.

  ---

  ### Prioritization

  This alert carries a high severity due to the potential security implications associated with allowing LM hash storage. Given the high likelihood of this behavior being exploited by adversaries targeting credential weaknesses, this rule demands prompt attention. LM hash storage is a known vulnerability often weaponized in lateral movement attacks.

  ---

  ### Blind Spots and Assumptions

  This detection may be evaded by using administrative privileges to modify the registry key without generating sufficient logs for detection or by employing malware that directly manipulates Windows security settings. Consistent logging of registry changes is essential, and without it, this detection may miss potentially malicious activities. Legitimate administrative actions can trigger this alert as well, such as configuring password policies. As a companion detection, monitoring for related registry modifications like the "EnableLMM" setting can enhance overall coverage and contextual understanding.

