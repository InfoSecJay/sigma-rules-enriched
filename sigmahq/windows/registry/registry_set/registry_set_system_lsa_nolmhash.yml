note: |
  ### Technical Context

  This Sigma rule detects changes to the "NoLMHash" registry value, specifically targeting modifications that allow Windows to store LAN Manager (LM) hashes for user passwords. The likely attacker objective is to exploit weaker password hashing mechanisms to compromise user accounts, facilitating unauthorized access. This behavior aligns with the MITRE ATT&CK framework under the tactic of Persistence (TA0003) and the technique of Credential Dumping (T1112).

  The primary telemetry sources are Windows registry changes, specifically events related to registry modifications (Event ID 4657). These detections are critical because allowing LM hashes poses a high security risk, potentially enabling attackers to crack weak passwords using brute-force methods. Importantly, this detection does NOT confirm the existence of a security breach on its own; further investigation is needed to establish intent and impact.

  ### Investigation Steps

  - **Identify registry modification details:** Review Windows Security Event ID 4657 for changes to the target registry key `System\CurrentControlSet\Control\Lsa\NoLMHash`. Look for a change that sets this value to `0`. A legitimate environment will typically have this value set to `1`.

  - **Assess the context of the change:** Identify the user account associated with the registry change using the Event ID 4657. If the user is a standard account with no administrative privileges, this could indicate unauthorized privilege escalation attempts.

  - **Review process creation logs:** Check for related process creation events (Security Event ID 4688) around the time of the registry change to see if any suspicious processes, particularly those associated with credential dumping tools (e.g., Mimikatz), were executed.

  - **Examine local group policies:** Use Windows Group Policy logs (Event ID 4905) to verify if any policies were altered that may influence password storage settings. Legitimate administrators would not typically change these settings without organizational approval.

  - **Correlate with lateral movement:** Investigate other agents or systems for simultaneous NoLMHash changes as this may indicate malicious lateral movement or a coordinated attack targeting multiple systems.

  ### Prioritization

  The alert severity is high due to the potential impact on sensitive systems and users if LM hashing is enabled. This behavior can significantly increase the risk of credential theft, particularly in environments with weak password policies. Furthermore, such modifications are often indicative of malicious activity, as they leverage known vulnerabilities in Windows authentication mechanisms that are frequently exploited by attackers.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers modify this registry value via legitimate administrative tools that do not generate alerts. Reliable detection requires that auditing is enabled for registry changes, and the environment must maintain continuous monitoring of privileged accounts. Legitimate activities that could trigger this alert include administrative tasks performed during system hardening or configuration changes. A related detection to strengthen coverage would be monitoring for suspicious user account activity correlated with registry changes.

