note: |
  ### Technical Context

  This Sigma rule detects the execution of a new application on a Windows endpoint by monitoring changes to the AppCompatFlags registry key, specifically within the Compatibility Assistant Store. The likely objective of an attacker executing an unknown application could be to maintain persistence, deliver additional payloads, or perform reconnaissance against the system. This behavior aligns with the MITRE ATT&CK technique for "User Execution" (T1204.002), suggesting that the user may inadvertently execute malicious software.

  Primary telemetry sources include Windows Registry logs capturing modifications to registry keys, particularly those related to application compatibility. If malicious, this activity could indicate an attempted infiltrate or persistence mechanism by an attacker. However, it's important to note that this detection does NOT confirm malicious intent on its own, as it can result from legitimate installations or new software setup in the enterprise environment.

  ### Investigation Steps

  - **Verify registry modification details:** Check for Event ID 4657 in Security logs to confirm which registry key was altered (e.g., `HKLM\Software\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Compatibility Assistant\Store\`). Compare the `NewValueName` and `OldValueName` for unexpected additions.

  - **Identify the application executable:** Locate the application related to the registry modification by checking the `Image Path` in Process Creation events (Security Event ID 4688 or Sysmon Event ID 1). Validate if this application is recognized and approved for use in your environment.

  - **Assess application installation frequency:** Review system logs to determine if this is a one-time installation or if multiple instances were recorded within a short time frame. Frequent installations of similar unknown applications can signal potential malicious activity.

  - **Document any legitimate applications:** Cross-reference the executed applications against your organization's software inventory to identify if this installation corresponds to a newly approved application or a system being set up. Moving forward, establish what is considered typical behavior for new application installations.

  - **Monitor related network activity:** Inspect network logs (e.g., firewall and proxy logs) to check for any outgoing connections by the newly installed application, focusing on traffic patterns or connections to suspicious domains.

  - **Look for known malicious indicators:** Use threat intelligence feeds to identify if the application in question has been flagged as malicious in known databases. A previously reported connection or activity could indicate an adversary’s operational method.

  ### Prioritization

  This alert should be treated as moderate severity. While the immediate impact on the affected system could be low if it’s benign, the nature of the detection necessitates caution as unknown applications can be indicative of adversarial behavior. Given that the execution of unrecognized software is a common tactic used by attackers, it warrants further examination.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate software installations to produce similar alerts, leading to false positives. The alert also assumes that appropriate logging is enabled and that the integrity of the registry is being monitored effectively. Legitimate activities, such as a user installing new software or an IT team provisioning systems, may trigger the alert. A companion detection could include monitoring software installation events via Windows Event IDs 11724 and 11726 to provide more context on newly installed applications.

