  ---

  ### Technical Context

  This rule detects changes to the Windows registry that configure Microsoft Office to allow the execution of all macros, whether they are signed or unsigned. Attackers often use this behavior to enable malicious macros as part of their exploitation strategy, aiming to deliver malware or perform unauthorized actions on the system. The relevant MITRE ATT&CK tactics and techniques include **Persistence** (T1547) and **Defense Evasion** (T1112).

  The primary telemetry source for this detection is the Windows Registry, specifically monitoring registry key changes under `HKEY_CURRENT_USER\Software\Microsoft\Office\[version]\Common\Security\VBAWarnings`. The potential security impact includes unauthorized code execution, leading to malware deployment or system compromise. Importantly, this detection does NOT confirm malicious activity on its own; legitimate administrative changes could trigger the alert.

  ---

  ### Investigation Steps

  - **Analyze registry changes:** Review registry access logs for Event ID 4657 or 4663 for changes to `HKEY_CURRENT_USER\Software\Microsoft\Office\[version]\Common\Security\VBAWarnings`. Note if the value has changed to `1`, indicating macro execution is enabled.

  - **Inspect user activity:** Check the User Account Control (UAC) logs for unusual or unauthorized activity around the time of the registry change. Authoritative logs can usually be found in the Security event log (Event ID 4624) or the Application log pertaining to Office.

  - **Validate Office macro settings:** Confirm the trust settings within Microsoft Office. Check settings that may indicate legitimate configurations reflecting macro policies such as enabling macros for certain users or groups.

  - **Identify evidence of macro executions:** Use Office application logs or process creation logs (Event ID 4688) to check for any Excel, Word, or other Office processes that were spawned immediately after the registry modification. Look for suspicious command-line arguments or document names.

  - **Scan for known indicators:** Cross-reference any documents or files executed post-registry change against known IOCs related to macro-based malware delivery, such as the Zloader malware.

  ---

  ### Prioritization

  This alert is of high severity due to its potential to enable extensive malicious activity on impacted systems. The likelihood of abuse is significant, as enabling all macros can facilitate various attack vectors commonly seen in the wild. Furthermore, the behavior is frequently weaponized in phishing campaigns and targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative tasks could cause this registry change without malicious intent. Required log sources like comprehensive registry monitoring and user activity monitoring are essential for reliable detection. Furthermore, common software updates or organizational policy changes could lead to similar registry modifications. A related detection to consider is monitoring for unexpected Office document executions that correlate with registry changes to increase context and coverage.

