note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows registry specifically targeting the `VBAWarnings` setting in Microsoft Office. When this value is set to "1," it allows all macros to execute without restrictions, potentially facilitating the execution of malicious macros. The likely attacker objective is to bypass built-in security measures in Microsoft Office applications to enable the execution of potentially harmful VBA scripts. This behavior is relevant to the MITRE ATT&CK technique "Modify Registry" (T1112).

  Primary telemetry sources include Windows Registry Change Logs detailing modifications to the registry settings that govern macro execution. If this change is triggered by a malicious actor, it significantly increases the risk of macro-based malware executing in the environment. Importantly, while this detection indicates an enablement of macro execution, it does NOT confirm that malicious activity is occurring—merely that a change allowing for potential abuse has taken place.

  ### Investigation Steps

  - **Check Registry Key Modification:** Investigate the modification to the registry at `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Common\Security\VBAWarnings` to see if it has been set to `1` (DWORD). Acquisition of this log should rely on tools like Sysmon Event ID 13.

  - **Identify User Activity Prior to Change:** Review the Security Event IDs 4624 (Logon) logs for the account that modified the registry key. Validate if this account is associated with any expected Office document usage or legitimate macro activity.

  - **Monitor for Macro Executions:** Analyze relevant telemetry such as Microsoft Office application execution logs following the registry change to identify any unsanctioned macro executions (Event ID 4688 for process creation of `WINWORD.EXE` or `EXCEL.EXE`).

  - **Assess Compromise Indicators:** Look for Known Indicators of Compromise (IoCs), including suspicious Office macro files recently created or downloaded on the affected machine, using Windows Event ID 4663 (File Access) to track file creation or modification.

  - **Review Organizational Context:** Evaluate if the asset relates to a sensitive role (e.g., finance or HR department) that utilizes VBA macros for everyday tasks. Legitimate business functions might typically justify macro usage, but should come with additional scrutiny if triggering this rule.

  ### Prioritization

  This alert is considered high severity due to the potential exposure of critical systems to macro-based malware after changing the registry key to allow unrestricted macro execution. The likelihood of malicious actors exploiting this behavior is significant, as it often precedes subsequent malicious actions associated with macro delivery.

  ### Blind Spots and Assumptions

  Detection may be bypassed if adversaries alter registry keys through non-standard methods or if the changes are made using system-level accounts that do not trigger conventional logging. Reliable detection relies on consistent log collection of registry changes. Legitimate software installations or updates may also modify this registry setting without malicious intent. As a companion detection, monitoring for suspicious macro activity following registry modifications can provide enhanced visibility into potential misuse.

