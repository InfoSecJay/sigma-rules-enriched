note: |
  ### Technical Context

  This Sigma rule detects unauthorized changes to sensitive Remote Desktop Protocol (RDP) settings in Windows systems, specifically the modifications of registry keys that control RDP connections. The likely objective of an attacker is to gain unauthorized access or to enable remote access capabilities to a system by modifying settings such as `fDenyTSConnections`, which when set to zero, allows RDP connections; or `fSingleSessionPerUser`, which can allow multiple active sessions from a single user, potentially facilitating session hijacking.

  Relevant MITRE ATT&CK tactics include Persistence (TA0003) and Defense Evasion (TA0005), specifically technique T1112 (Modify Registry). The primary telemetry sources for this detection are Windows Registry change logs. If malicious, such changes could lead to compromised systems or unauthorized remote access. However, this detection does NOT confirm malicious intent, as legitimate administrative actions may also lead to these changes, necessitating further investigation.

  ### Investigation Steps

  - **Check recent registry changes:** Review System Event Logs (Event ID 4657) to identify who made the changes to the following keys: `fDenyTSConnections`, `fSingleSessionPerUser`, and `UserAuthentication`. Look for changes from unexpected user accounts or non-administrative accounts.

  - **Verify user access patterns:** Analyze RDP connection logs (Event ID 4624 for logon events) to confirm if there are new logins or connections from unusual sources or times. Legitimate access would typically be from known administrative accounts and during expected hours.

  - **Inspect group policy modifications:** Review Group Policy Object (GPO) modifications related to RDP configurations. Check for Event IDs 40961 or 40962 in the Microsoft-Windows-GroupPolicy/Operational logs to see if a GPO updated these settings legitimately or if they were altered outside of routine policy application.

  - **Identify high-risk changes:** Look specifically for any changes where the `fDenyTSConnections` key has been set to `0`. This is a high-confidence indicator of potentially malicious intent, particularly if the change corresponds with an escalation in user access or a recent security incident.

  - **Examine remote session activity:** Review sessions established via RDP (Event ID 21 for disconnected sessions and 24 for active sessions) to confirm if unauthorized users are connecting post-modification or if there are any indications of multiple simultaneous logins by the same user.

  - **Cross-reference with threat intelligence:** Use threat intelligence feeds to correlate any detected changes against known malicious patterns or indicators of compromise related to RDP hijacking or abuse.

  ### Prioritization

  This alert is of medium severity due to the risk of exposure or compromise of sensitive systems via unauthorized RDP access. The likelihood of malicious abuse is moderate, especially in environments where RDP is heavily used. However, legitimate administrative changes may also trigger this alert, necessitating careful analysis.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion techniques such as using legitimate administrative credentials to make registry changes or employing time-based tactics to modify registry entries and obscure timing of unauthorized access attempts. Reliable detection requires appropriate logging configurations for registry changes. Legitimate activities, such as an administrator adjusting settings for maintenance, may trigger this alert. Related detections, such as identifying unusual RDP connection attempts (e.g., receiving alerts for Event ID 4625 for failed logon attempts) can reinforce visibility and strengthen overall security posture regarding RDP misuse.

