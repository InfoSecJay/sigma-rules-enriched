detection:
  selection:
    TargetObject|endswith:
    - '\fDenyTSConnections'         # Specifies whether Remote Desktop connections are enabled - When set to zero RDP is enabled
    - '\fSingleSessionPerUser'         # When changed to 0 it allows multiple RDP sessions
    - '\UserAuthentication'         # Specifies that Network-Level user authentication is not required before the remote desktop connection is established
    Details: 'DWORD (0x00000000)'
  condition: selection
falsepositives:
- Some of the keys mentioned here could be modified by an administrator while 
  setting group policy (it should be investigated either way)
level: medium
note: |
  ### Technical Context

  The rule detects modifications to sensitive RDP settings in the Windows registry that permit unauthorized access or weaken security. The likely attacker objective is to enable remote access or allow multiple sessions, making it easier to maintain persistence or establish malicious control over a system. This detection relates to the MITRE ATT&CK tactics of Persistence (T1112) and Defense Evasion. Primary telemetry sources include Windows Registry logs, specifically monitoring changes to keys like `HKLM\SOFTWARE\Microsoft\Windows NT\Terminal Services`. If malicious, this could allow adversaries unauthorized RDP access, posing a significant security risk. Importantly, this detection does NOT confirm an active compromise on its own; it simply indicates a potentially insecure condition that may require further investigation.

  ### Investigation Steps

  - **Review recent registry changes:**
    Check Windows Security Event ID 4663 for registry modifications related to RDP settings. Look for changes to keys: `fDenyTSConnections`, `fSingleSessionPerUser`, and `UserAuthentication`.

  - **Validate the context of the change:**
    Identify who made the registry modification and when. Cross-reference this with user activity logs to determine if the change aligns with expected administrative behavior versus unauthorized actions.

  - **Identify high-confidence malicious indicators:**
    If the registry values for `fDenyTSConnections` or `fSingleSessionPerUser` are set to `0` without proper administrative context, flag this as suspicious, especially if no scheduled administrative tasks coincide.

  - **Review legitimate RDP configurations:**
    Confirm appropriate settings for `fDenyTSConnections` typically remain `1` for heightened security. Assess whether legitimate administrative processes are documented when RDP settings are altered, such as for support or maintenance.

  - **Correlate with other telemetry:**
    Check for unusual user login patterns or concurrent sessions that coincide with the registry change. Review Remote Desktop Services log files for Event ID 4624 (successful logons) and look for anomalies.

  - **Monitor for subsequent malicious activity:**
    Look for RDP session establishment following the registry change via Event ID 5140 (a network share object was accessed) and any usage patterns indicating unauthorized access.

  ### Prioritization

  This alert should be treated with medium severity, as it indicates potential weakness in RDP settings that can be exploited by attackers. Its context of registry modifications suggests reasonable likelihood for malicious intent, particularly as settings allowing multiple or unrestricted RDP sessions are often weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activity that modifies these settings, possibly resulting in false positives. Ensure full Windows Registry logging is enabled to cover all necessary changes. Additionally, benign administrative routines that might alter these keys can lead to alerts. A related detection to consider would be monitoring for RDP login attempts (Event IDs 4624 and 4625) following any suspicious registry modifications to strengthen analysis coverage.

