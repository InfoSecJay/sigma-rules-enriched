detection:
  selection:
    TargetObject|endswith:
    - '\fDenyTSConnections'         # Specifies whether Remote Desktop connections are enabled - When set to zero RDP is enabled
    - '\fSingleSessionPerUser'         # When changed to 0 it allows multiple RDP sessions
    - '\UserAuthentication'         # Specifies that Network-Level user authentication is not required before the remote desktop connection is established
    Details: 'DWORD (0x00000000)'
  condition: selection
falsepositives:
- Some of the keys mentioned here could be modified by an administrator while setting
  group policy (it should be investigated either way)
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized modifications to critical registry settings that govern Remote Desktop Protocol (RDP) configurations on Windows systems. Specifically, it monitors for changes to keys that enable RDP access, allow multiple sessions per user, and disable Network-Level Authentication (NLA). Attackers may exploit these vulnerabilities to establish unauthorized access to systems, facilitate lateral movement, and potentially gain persistence through RDP hijacking techniques. The likely attacker objective is to take control of a remote system, thereby circumventing typical access controls.

  Relevant MITRE ATT&CK tactics include **Persistence (TA0003)**, as adjusting these registry values can provide a means for persistent entry into systems. Additionally, the technique **Modify Registry (T1112)** is applicable here, highlighting the ability of attackers to manipulate system settings for malicious purposes.

  Primary data sources for this detection include **registry change events** and **Windows Security logs**. These sources provide the necessary telemetry to track unauthorized modifications to the RDP configuration, enabling security teams to identify potential intrusions or misconfigurations.

  ### Investigation Steps
  - **Review Windows Registry Logs**: Examine the registry change logs to identify recent modifications to the `fDenyTSConnections`, `fSingleSessionPerUser`, and `UserAuthentication` keys. Pay special attention to the timing and source of these changes.

  - **Correlate with User Activity Logs**: Check user activity logs around the time of registry modifications to detect any anomalous connections or RDP sessions that could indicate unauthorized access.

  - **Analyze System Event Logs**: Look in the Windows Event Viewer for related security events, especially those pertaining to RDP session initiation and user authentications, to determine if these changes were exploited.

  - **Cross-reference Group Policy Modifications**: Identify if the changes were part of legitimate group policy updates by reviewing group policy audit logs. If an administrator modified these settings, document the change request and ensure it aligns with expected configurations.

  ### Prioritization
  This alert carries medium severity due to the potential impact of unauthorized RDP access, which can lead to significant compromises of sensitive systems and data. The likelihood is elevated, as attackers often target RDP for remote access.

  ### Blind Spots and Assumptions
  Detection coverage may be limited when registry modifications occur without logging settings enabled, potentially allowing subtle changes to go unnoticed. An assumption made by the detection logic is that any configuration changes will raise alerts; however, legitimate administrative tasks might lead to false positives. Additionally, proper Windows logging configurations must be in place to ensure sufficient data is collected for analysis and effective detection of these registry changes.

