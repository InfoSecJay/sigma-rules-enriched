detection:
  selection:
    TargetObject|endswith:
    - '\fDenyTSConnections'         # Specifies whether Remote Desktop connections are enabled - When set to zero RDP is enabled
    - '\fSingleSessionPerUser'         # When changed to 0 it allows multiple RDP sessions
    - '\UserAuthentication'         # Specifies that Network-Level user authentication is not required before the remote desktop connection is established
    Details: 'DWORD (0x00000000)'
  condition: selection
falsepositives:
- Some of the keys mentioned here could be modified by an administrator while 
  setting group policy (it should be investigated either way)
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized changes to critical Remote Desktop Protocol (RDP) settings within the Windows Registry. Specifically, it monitors settings that may enable unapproved access to systems, such as allowing unsolicited connections, enabling multiple sessions per user, or relaxing authentication requirements. The likely attacker objective is to gain unauthorized remote access to systems, facilitating lateral movement or data exfiltration.

  Relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)** and **Persistence (T1112)**, as these changes can conceal unauthorized activity or maintain access in a compromised environment. The primary telemetry source is Windows Registry change logs, specifically monitoring alterations to values under Terminal Services. If malicious, these changes significantly increase the risk of unauthorized system access. However, this detection does not confirm malicious activity without additional context, as legitimate administrative actions could modify these settings.

  ### Investigation Steps

  - **Review the changed registry values:** Check the Windows Registry for changes to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Terminal Server` for values `fDenyTSConnections`, `fSingleSessionPerUser`, and `UserAuthentication`. If these values are set to zero, note the change time and the user responsible for the modification.

  - **Correlate with user activity logs:** Analyze Security Event ID 4732 (A member was added to a security-enabled local group) or Event ID 4769 (A Kerberos service ticket was requested) to determine if an unauthorized account correlates with the registry change timeline, indicating potential malicious intent.

  - **Identify legitimate administrative activity:** Investigate if the registry changes align with scheduled maintenance windows or documented administrator actions. Check group policy application logs (Event ID 4616) for expected configurations originating from system administrators, which could demonstrate legitimate activity.

  - **Assess associated logins and RDP sessions:** Review Event ID 4624 (An account was successfully logged on) and Event ID 4625 (An account failed to log on) to establish if there were abnormal login attempts or unexpected RDP connections around the time of the registry change, which helps in identifying malicious access patterns.

  - **Evaluate asset criticality:** Determine the criticality of the affected system based on its role within the organization (e.g., domain controller vs. workstation). Higher criticality systems require immediate escalation due to the severity of potential impacts from unauthorized RDP access.

  ### Prioritization

  This alert should be prioritized as medium severity due to its potential impact on critical systems allowing remote access. The likelihood of malicious exploitation is moderate, particularly in environments where RDP settings are controlled and closely monitored. Weaponization of this behavior is commonly observed among attackers aiming to gain persistent access to systems.

  ### Blind Spots and Assumptions

  This detection may be limited by the ability of attackers to avoid detection by deploying administrative actions that appear legitimate. Additionally, trustworthy administrative modifications during group policy updates can trigger false positives. It is crucial to ensure that Windows Registry change auditing is enabled and effectively capturing all relevant modifications. Related detections include monitoring for unusual user account activities (e.g., anomalous logins) that can enhance the understanding of potential intrusions and misuse in conjunction with this alert.

