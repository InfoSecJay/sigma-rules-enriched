  ---

  ### Technical Context

  This Sigma rule detects the enabling of the Windows Recall feature via registry manipulation. Specifically, it identifies when the registry value "DisableAIDataAnalysis" is set to "0", which activates the Recall feature. An attacker may enable this feature to facilitate post-exploitation activities such as the discovery of sensitive data or extracting previously collected artifacts, aligning with the MITRE ATT&CK tactics and techniques related to Collection (T1113 - Screen Capture). Primary telemetry sources required are Windows registry logs, particularly for modifications under the paths: `HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI` and `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsAI`. If malicious, this behavior poses a risk of unauthorized data access and exfiltration from compromised hosts. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions may result in similar registry changes.

  ---

  ### Investigation Steps

  - **Check the registry change details**: Review Windows registry logs for modifications to `DisableAIDataAnalysis` at both `HKEY_CURRENT_USER` and `HKEY_LOCAL_MACHINE`. Search for Event IDs related to registry changes (e.g., Event ID 4657) to confirm the modification to `DWORD` set to "0".

  - **Identify the actor or process initiating the change**: Investigate the process responsible for modifying the registry value. Cross-reference with Sysmon Event ID 10 (ProcessAccess) to identify if a known or trusted process initiated the change, indicating potential benign activity.

  - **Review recent system activity**: Examine Windows Event Logs (Event ID 4663 - Object Access) to find other system actions performed by the user or process that enabled the Recall feature. Look for unusual patterns or times that may suggest malicious behavior.

  - **Assess the legitimacy of the enabling action**: Determine if the change to the Recall feature corresponds with any recent software installations or updates. Consult change management records or internal documentation to validate user or administrative actions related to Windows Recall.

  - **Look for associated data collection**: Investigate if the enabling of Windows Recall correlates with other suspicious data collection activities, such as unusual access to personal user folders or extraction of sensitive files. Check for any related transfer logs to identify potential exfiltration.

  - **Check for related detection rules**: Monitor for alerts generated by companion detections, such as those related to unusual file access (e.g., Event ID 4660 - Object Deleted), which may further support or contradict the findings of the Recall feature enablement.

  ---

  ### Prioritization

  This alert is of medium severity in an enterprise context due to the potential exposure of sensitive information if the system is compromised. Given that the Recall feature can be used by adversaries to streamline data collection, it's essential to investigate alerts as they may signify an active post-exploitation scenario. While enabling this feature is not a common tactic, it poses a serious risk if exploited by an adversary.

  ---

  ### Blind Spots and Assumptions

  The detection relies on changes to specific registry values, which can be evaded by using other means to activate the Recall feature, such as remote registry manipulation or bypassing security controls relying on administrative privileges. Additionally, the necessary log sources must be correctly configured to ensure ongoing visibility for such changes. Legitimate activities, such as IT administrative configurations or updates, may trigger this alert, requiring contextual analysis. A related detection to strengthen coverage may include monitoring for abnormal user behavior post-registry modification (e.g., significant data access or file modifications).

