  ---

  ### Technical Context

  This detection rule monitors for changes to the Windows registry indicating the enabling of the Windows Recall feature, specifically by setting the "DisableAIDataAnalysis" value to "0". This behavior suggests that an adversary aims to utilize the Recall feature for post-exploitation activities such as data collection and discovery. This action falls under the MITRE ATT&CK framework's collection tactic (TA0011), particularly technique T1113 (Screen Capture).

  The primary telemetry source is the Windows Registry change logs, focusing on modifications to the specified registry keys. If malicious, enabling the Recall feature can allow adversaries to capture potentially sensitive information from the system. However, it is crucial to note that this detection does not confirm malicious intent without further investigation, as it could result from legitimate administrative or user actions.

  ---

  ### Investigation Steps

  - **Review registry changes:** Check for entries in the registry at paths `HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\WindowsAI\` and `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsAI\`. Confirm if the "DisableAIDataAnalysis" key is set to `0`. Any deviation from previously known good configurations should be treated with suspicion.

  - **Correlate with user activity:** Analyze the related user activity logs (Event ID 4624 for logon events) to determine if the account that made the registry change has a legitimate operational context. Investigate if this change aligns with authorized administrative tasks or if it appears anomalous.

  - **Identify systemic impact:** Consider the role of the affected system. Is it a sensitive endpoint, such as a server housing confidential data? Elevated importance merits a higher scrutiny level.

  - **Look for simultaneous alerts:** Cross-reference with other security alerts, such as suspicious process creation (Event ID 4688) within a short time frame post-registry change, which could indicate an exploit attempt leveraging Recall.

  - **Document legitimate usage cases:** Gather records of organizational activity where Windows Recall being enabled is expected, such as planned administrative updates or training sessions. This contextual information can clarify whether the registry modification is justifiable.

  - **Validate data collection behavior:** Check for related artifacts such as created or modified files in user profile folders or temporary directories that could indicate data collection activities (e.g., modified timestamps on documents that coincide with the registry change).

  ---

  ### Prioritization

  This alert should be treated with medium severity. If the impacted system is critical, the potential for malicious abuse increases. Enabling Windows Recall is not commonly weaponized on its own, but as part of a broader post-exploitation methodology, it warrants further investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may miss evasions such as direct registry edits by sophisticated threats or batch scripts that modify settings without logging. Additionally, proper logging configurations for registry modifications must be ensured to capture these events consistently. Legitimate administrative activities, such as system onboarding or updates, may trigger this alert. Companion detections, such as monitoring for unusual outbound network behaviors (e.g., unusual exfiltration traffic), would enhance overall threat visibility.

