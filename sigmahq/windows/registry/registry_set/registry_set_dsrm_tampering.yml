note: |
  ---

  ### Technical Context

  This Sigma rule detects modifications to the "DsrmAdminLogonBehavior" registry value, which controls access to the Directory Services Restore Mode (DSRM) administrator account on Windows Domain Controllers. Malicious actors may change this setting to ‘2’ to allow easier access to the DSRM account, enabling unauthorized persistence and access to Active Directory environments. This behavior relates to the MITRE ATT&CK technique "Credential Dumping" (T1556) and "Defense Evasion" (T1556).

  Key telemetry includes Windows registry changes tracked by WMI or Registry event logs. The potential security impact is severe, as it could facilitate an attacker’s ability to manipulate Active Directory or execute unauthorized actions. This detection does NOT confirm that an attack is occurring but indicates a potentially unauthorized configuration change.

  ---

  ### Investigation Steps

  - **Review registry value modifications:** Check for changes to the registry key `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Lsa\DsrmAdminLogonBehavior` using Security Event ID 4657 (Registry Value Modified). Look for a change to `DWORD (0x00000002)` indicating unrestricted access.

  - **Correlate with user activity:** Cross-reference the timing of the registry change with Windows Security Event ID 4624 (Successful Logon) to identify any logons using the DSRM account immediately before or after the change. A DSRM logon without a corresponding legitimate administrative need may indicate malicious activity.

  - **Identify legitimate configurations:** Understand typical configurations in your environment where `DsrmAdminLogonBehavior` is set to `0` (restricted use) or `1` (service stopped). Any changes from these standards should be flagged for further investigation.

  - **Analyze access logs:** Review Windows Event ID 4768 (Kerberos Authentication Ticket (TGT)) to see if there are any unusual authentications related to the DSRM account following the registry change. Look for unexpected access patterns following the change.

  - **Assess affected system's criticality:** Consider the role of the Domain Controller(s) involved. Any detected tampering on critical infrastructure warrants immediate escalation.

  - **Determine previous states:** Use forensic tools or backups to determine if a previously known good state exists for the `DsrmAdminLogonBehavior` value. This might help establish a timeline for unauthorized changes.

  ---

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on Domain Controllers, which are critical to the security and operation of Active Directory. Given that such a configuration change could easily facilitate unauthorized access, it suggests a high likelihood of malicious activity, especially if further corroborated by additional suspicious events.

  ---

  ### Blind Spots and Assumptions

  Detection is limited if registry logging is not fully enabled; thus, ensure that audit policies capture registry modifications effectively. Legitimate changes may occur during standard maintenance or troubleshooting, such as during legitimate recovery operations. A related detection may include monitoring for unusual Kerberos ticket requests (ID 4769), which could indicate abuse of the DSRM account after its configuration change.

