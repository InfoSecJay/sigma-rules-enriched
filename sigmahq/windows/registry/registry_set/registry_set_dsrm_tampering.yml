detection:
  selection:
    TargetObject|endswith: '\Control\Lsa\DsrmAdminLogonBehavior'
  filter_main_default_value:
    Details: 'DWORD (0x00000000)'     # Default value
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects unauthorized changes to the "DsrmAdminLogonBehavior" registry value on a Windows Domain Controller. Such modifications may indicate malicious activity aimed at gaining persistent access to the organization's Active Directory through the Directory Services Restore Mode (DSRM) account. The likely attacker objective is to manipulate DSRM behavior to enable unfettered access to Domain Controller functionalities, facilitating data exfiltration or lateral movement in the network. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **Application Layer Protocol** (T1556).

  The primary telemetry source for this detection is Windows Registry change monitoring. Specifically, the required log type is from the registry set category, capturing modifications to the specified registry path. If the detected behavior is malicious, it could lead to significant security impacts such as unauthorized access to sensitive accounts, potential data breaches, or complete administrative control over Active Directory. Importantly, this detection does NOT confirm malicious intent on its own; it only indicates that a change was made to a critical registry value.

  ### Investigation Steps

  - **Check the registry value change timestamp:** Review the System Event Log (Event ID 4663) to correlate the registry modification timestamp with other system activity to identify potentially anomalous behavior or an associated login event.

  - **Validate the registry path and content:** Query the registry for the "DsrmAdminLogonBehavior" value under `HKEY_LOCAL_MACHINE\Control\Lsa\` to confirm its current value. If it was changed to "2", this is a high-confidence malicious indicator as it enables unrestricted access to the DSRM account.

  - **Review account activity for the DSRM account:** Inspect the Security Event Log (Event ID 4624) for any login attempts using the DSRM account to detect unexpected or unauthorized use, particularly from non-administrator users or atypical locations.

  - **Identify benign configuration changes:** Understand the typical operational behavior of the DSRM account within your organization. If authorized personnel routinely adjust this value for maintenance purposes, document these occurrences to differentiate between benign and suspicious activity.

  - **Correlate with related alerts or logs:** Cross-reference this detection with similar Sigma rules that monitor for changes in administrative accounts or privilege escalation, such as Event ID 4672, which indicates special privileges assigned to a new logon.

  ### Prioritization

  This alert is considered high severity due to the critical nature of the affected system, namely the Domain Controller, which can lead to enterprise-wide impacts if compromised. Given that the behavior is a tactic often employed by attackers for persistence, there is a significant likelihood of malicious exploitation.

  ### Blind Spots and Assumptions

  Detection limitations exist considering potential evasion techniques like direct registry manipulation using PowerShell or third-party tools that may not generate logs. Reliable detection requires that Windows Event Logging is properly configured to capture registry changes. Additionally, legitimate maintenance activities by system administrators may trigger this alert, which must be reviewed against specific organizational practices. A relevant companion detection would be monitoring for privilege escalation events on Domain Controllers to enhance visibility into possible abuse of modified access paths.

