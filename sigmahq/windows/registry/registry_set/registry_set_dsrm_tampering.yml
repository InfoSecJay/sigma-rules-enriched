detection:
  selection:
    TargetObject|endswith: '\Control\Lsa\DsrmAdminLogonBehavior'
  filter_main_default_value:
    Details: 'DWORD (0x00000000)'     # Default value
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects unauthorized changes to the "DsrmAdminLogonBehavior" registry value on Windows Domain Controllers, which can be indicative of malicious activity targeting Active Directory environments. Specifically, the DSRM account is a critical administrative account utilized for emergency access to Active Directory, and changes to its behavior settings can allow an attacker to maintain persistent access or escalate privileges within the system.

  Attackers leveraging this vulnerability may aim to ensure that they can use the DSRM account at any time (by setting the value to "2") regardless of the state of the Active Directory services. By controlling access to the DSRM account, attackers could effectively bypass normal security protocols and maintain a foothold within the organization.

  Relevant MITRE ATT&CK techniques include:
  - **T1556: Credential Dumping** - The act of extracting credentials from the system.
  - **T1078: Valid Accounts** - Utilizing stolen or default credentials to gain access.
  - **T1487: Data Encrypted for Impact** - Changing access mechanisms to facilitate further attacks.

  Primary data sources for this detection include Windows registry logs, which will capture changes made to the DSRM settings.

  ### Investigation Steps
  - **Review Registry Change Logs:** Look for any logs related to changes made to the "DsrmAdminLogonBehavior" registry path, especially around critical dates or after known security incidents.
  - **Validate Account Usage:** Investigate any recent logins or access attempts using the DSRM account, especially if they occur outside of regular maintenance windows or from unusual IP addresses.
  - **Analyze Active Directory Logs:** Monitor for unusual AD queries or the use of DSRM in conjunction with other administrative functions that could indicate an abuse of privileges.
  - **Inspect Recent Security Events:** Cross-reference recent security events, alerts, or anomaly reports that may correlate with the timing of changes made to the DSRM registry setting.

  ### Prioritization
  The alert's severity is high due to the critical role of DSRM in maintaining Active Directory availability. Any unauthorized alterations could enable an attacker to regain access even if other defenses are intact, heightening the risk of privilege escalation or lateral movement within the network.

  ### Blind Spots and Assumptions
  Potential gaps in detection coverage might include environments where registry logs are not enabled, or in scenarios where attackers may employ stealthy techniques to modify registry values without generating logs. The detection logic assumes that any change to the DSRM behavior setting is unauthorized, which may not always be the case, as legitimate administrative changes can occur. Successful detection requires that the audit logging of registry changes is correctly configured and enabled on all Domain Controllers to ensure comprehensive visibility.

