detection:
  selection:
    TargetObject|endswith: '\Control\Lsa\DsrmAdminLogonBehavior'
  filter_main_default_value:
    Details: 'DWORD (0x00000000)'     # Default value
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects modifications to the `DsrmAdminLogonBehavior` registry value on Windows Domain Controllers, which can indicate potential attempts to undermine security controls or establish persistence within Active Directory. Specifically, attackers may alter this value to facilitate unauthorized access to the Directory Services Restore Mode (DSRM) environment, enabling them to bypass standard authentication mechanisms.

  The relevant MITRE ATT&CK techniques impacted are:

  - **Tactic:** Credential Access
  - **Technique:** T1556 - Compromise Credentials

  Primary telemetry sources include Windows Registry logs, specifically monitoring changes to the registry key located at `\Control\Lsa\DsrmAdminLogonBehavior`. If malicious, altering this registry value can significantly increase the risk of unauthorized access to Active Directory environments, impacting the integrity of critical systems.

  This detection does NOT confirm actual exploitation; it merely identifies a change that could be indicative of malicious intent.

  ### Investigation Steps

  - **Check Registry Value: ** Review the `DsrmAdminLogonBehavior` value in the Windows Registry to determine if it's been set to `2`, which allows DSRM access under any circumstance. Look for this value at `HKEY_LOCAL_MACHINE\ControlSet001\Services\Lsa\` in Security Event ID 4657 logs.

  - **Examine System Context: ** Identify if this change occurred on a Domain Controller by verifying the hostname and role. Use Event ID 4104 from PowerShell logs, focusing on if the change coincides with expected maintenance activities.

  - **Investigate User Account Activity: ** Query Security Event logs (Event ID 4624) to review logon activities related to the DSRM account since the registry change. Look for any anomalous logons, especially from unexpected IP addresses or high-risk time periods.

  - **Cross-Validate Previous Logon Behavior: ** Compare current values with historical data. Collect registry snapshots (if available) to confirm if the `DsrmAdminLogonBehavior` has been altered during incident window.

  - **Review for Expected Maintenance Activities: ** Determine if legitimate system maintenance or backup actions coincided with the modification. Assessment of the schedule and authorization for such changes can indicate benign intent.

  - **Identify Malicious Indicators: ** Look for indications of lateral movement or privilege escalation attempts by checking for failed logon attempts (Event ID 4625) by non-administrative accounts around the same timeframe as the registry alteration.

  ### Prioritization

  This alert is of high severity as it pertains to changes that can weaken the security posture of Domain Controllers. The likelihood of abuse is significant given that such alterations are often employed by threat actors to gain persistent access to critical systems. Moreover, this behavior is commonly weaponized in targeted attacks against Active Directory.

  ### Blind Spots and Assumptions

  Evasion techniques may include restoring the registry value post-attack, which can hide malicious activity. Log sources must be properly configured to ensure Registry Auditing is enabled, as it is crucial for capturing relevant events accurately. Legitimate administrative activity, particularly during system maintenance or upgrades, may trigger this alert. A related detection to enhance coverage would be monitoring for unusual logon patterns associated with the DSRM account, which could indicate misuse.

