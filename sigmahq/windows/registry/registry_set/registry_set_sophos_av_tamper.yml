  ### Technical Context

  This Sigma rule detects modifications to specific Sophos Antivirus (AV) registry keys related to tamper protection settings. The behavior indicates an attempt to disable critical security features, potentially leading to a successful compromise or malware execution. The likely attacker objective is to circumvent endpoint defenses, facilitating further actions such as data exfiltration or lateral movement. This detection correlates with MITRE ATT&CK Tactic: Defense Evasion and Technique: T1562.001, specifically targeting tamper protection mechanisms.

  The primary telemetry sources include Windows Registry change logs, specifically focusing on registry keys related to Sophos AV functionality. If malicious, the security impact could be significant, as attackers may gain unauthorized access or increased control over the environment. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions or automated processes could also trigger similar modifications.

  ### Investigation Steps

  - **Verify Registry Key Modifications:**
    Examine the Windows Registry for alterations to the keys `\Sophos Endpoint Defense\TamperProtection\Config\SAVEnabled`, `\Sophos Endpoint Defense\TamperProtection\Config\SEDEnabled`, and `\Sophos\SAVService\TamperProtection\Enabled` (Event ID not applicable). Look for values being set to `DWORD (0x00000000)`.

  - **Check User and Process Context:**
    Identify the user and process that initiated the registry key modification. Investigate corresponding Security Event ID 4688 for process creation events that could distinguish legitimate administrative actions from potential malicious activity.

  - **Evaluate System Criticality:**
    Assess the criticality of the affected endpoint. If it's a key server or has sensitive information, prioritize the investigation due to the higher impact risk.

  - **Look for Other Indicators of Compromise:**
    Review other security logs for concurrent activities (e.g., Event ID 5145 for file share access) that could indicate additional suspicious behavior around the same timestamp. High-confidence malicious indicators include multiple registry tampering attempts within a short timeframe.

  - **Identify Legitimate Activity:**
    Confirm whether scheduled maintenance or software updates are occurring that may involve legitimate modifications to the tamper protection settings. Check for associated update logs or admin notifications.

  ### Prioritization

  This alert is high severity due to the critical nature of the Sophos AV functionality being compromised, which directly protects against malware. The likelihood of malicious abuse is significant, as disabling tamper protection is commonly weaponized by attackers to facilitate further exploitation of the environment.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques where attackers may utilize tools or scripts that mimic legitimate administrative actions. Ensure that the necessary logging configurations for registry modifications are enabled to detect these activities accurately. Legitimate processes, such as routine antivirus updates or user-initiated changes, may also trigger this alert. A relevant companion detection would include snapshots of the AV status or logs from Sophos indicating recent changes, enhancing coverage against false positives.

