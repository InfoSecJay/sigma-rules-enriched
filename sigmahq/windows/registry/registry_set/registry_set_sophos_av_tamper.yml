note: |
  ### Technical Context

  This Sigma rule detects attempts to modify registry keys associated with Sophos antivirus tamper protection settings. The behavior typically indicates an attacker objective of disabling or bypassing security controls to facilitate malicious activities such as malware installation or persistence mechanisms. This detection relates to the MATIRE ATT&CK technique "Modify Existing Service" (T1685) under the "Defense Evasion" tactic.

  The primary telemetry source involved in this detection is Windows Registry logs, specifically targeting registry modifications. If successful, the malicious activity could lead to system compromise, allowing threat actors to execute further exploits undetected. It is important to note that this detection does NOT confirm malicious activity on its own, as legitimate software updates or administrative actions may also trigger changes to these registry keys.

  ### Investigation Steps

  - **Verify the registry modification event:** Review Windows Security Event ID 4657 (Registry Value Set) during the alert timeframe to confirm the modification of keys related to Sophos tamper protection.

  - **Identify legitimate software updates:** Check for recent updates or maintenance operations initiated by IT or security teams that correlate with the registry change. Look for recorded tasks in Windows Event Log or relevant change logs.

  - **Check Sophos logs for alerts:** Examine Sophos Endpoint Protection logs to see if there were any alerts related to tampering or unsuccessful protection engagements during the timeframe of the detected registry change.

  - **Correlate with other system logs:** Look for any other suspicious activities within the system using Sysmon Event ID 10 (ProcessAccess) and Event ID 1 (Process Create) for processes trying to access Sophos components around the same time as the registry modification.

  - **Evaluate the impact on the affected system:** Consider the criticality of the asset where the tamper attempt occurred. Systems with higher privilege or pivotal roles (like domain controllers) should be prioritized as potential high-impact incidents.

  ### Prioritization

  This alert should be regarded with high severity due to the critical role of antivirus control in protecting endpoints. The likelihood of exploitation for a system marked by tampered security settings is substantial, given that attackers often attempt to disable such protections. This behavior is frequently weaponized, especially in targeted ransomware attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques, such as attackers using legitimate administrative permissions to modify tamper protection settings without raising alerts. Ensure that relevant Windows Registry logging is enabled to maintain visibility. Legitimate activities, such as corporate security policy updates or automated AV disablement for maintenance, could also trigger this alert. A related detection to monitor would be any unauthorized access attempts to Sophos resources, potentially providing context for malicious intent.

