logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Sophos Endpoint Defense\TamperProtection\Config\SAVEnabled'
    - '\Sophos Endpoint Defense\TamperProtection\Config\SEDEnabled'
    - '\Sophos\SAVService\TamperProtection\Enabled'
    Details: DWORD (0x00000000)
  condition: selection
falsepositives:
- Some FP may occur when the feature is disabled by the AV itself, you should always
  investigate if the action was legitimate
level: high
note: |
  ### Technical Context
  This detection rule is designed to identify unauthorized modifications to critical registry keys associated with the protection settings of Sophos Antivirus (AV). Specifically, it monitors changes to keys that manage tamper protection, an important security mechanism preventing malicious actors from disabling or bypassing AV protections. The rule aims to alert security teams to potential tampering attempts that may indicate an active compromise or prelude to lateral movement and data exfiltration.

  In a threat scenario, an attacker aims to weaken the organization's defenses by altering AV settings, allowing them to deploy malware or ransomware without hindrance. The tampering with AV registry keys, particularly those pertaining to Tamper Protection, can facilitate malicious activities like disabling the antivirus functionality, enabling greater persistence, and triggering the exploitation of other vulnerable systems. This activity correlates with the MITRE ATT&CK tactic of "Defense Evasion" (TA0005) and specifically with the technique "Indicator Removal on Host" (T1562.001).

  The primary data sources for this detection are Windows registry change logs that detail modifications to the registry. Analyzing these logs enables the identification of any unauthorized tampering attempts involving the Sophos AV settings.

  ### Investigation Steps
  - **Review Registry Change Logs:** Investigate the relevant Windows registry change logs to confirm the modification of the specified Sophos AV keys. Identify the process or user account that initiated the change and the time of the event.
  - **Correlate with Endpoint Security Events:** Examine logs from the Sophos Endpoint Defense solution for concurrent security events that could indicate the tampering was part of an attack vector, such as threats being blocked or flagged.
  - **Monitor for Known Indicators of Compromise:** Cross-reference any suspicious modifications with known indicators of compromise associated with recent malware or ransomware campaigns, especially those targeting AV solutions.
  - **Assess Privilege Escalation Paths:** Evaluate the accounts and processes involved in the registry modifications to determine if there are signs of privilege escalation or other anomalous user behavior that might suggest a breach.

  ### Prioritization
  This alert is classified as high severity due to its potential impact on the organization's security posture. Unchecked tampering with AV settings can allow malware to run undetected, leading to data loss, operational disruption, or significant financial repercussions.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the endpoint solution is not configured to log all registry changes or if legitimate changes are made by the AV software itself in a way that does not trigger an alert. This detection logic assumes that tampering activity will always involve modifications to the specified registry keys, which may not capture all malicious attempts if attackers utilize other methods or tools. Ensuring comprehensive logging and monitoring configurations is essential for the effectiveness of this alert.

