title: Change Winevt Channel Access Permission Via Registry
id: 7d9263bd-dc47-4a58-bc92-5474abab390c
status: test
description: Detects tampering with the "ChannelAccess" registry key in order to change
  access to Windows event channel.
references:
- https://app.any.run/tasks/77b2e328-8f36-46b2-b2e2-8a80398217ab/
- https://learn.microsoft.com/en-us/windows/win32/api/winevt/
- https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
author: frack113
date: 2022-09-17
modified: 2024-03-25
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\'
    TargetObject|endswith: '\ChannelAccess'
        # Add more interesting combinations if you found them
    Details|contains:
    - '(A;;0x1;;;LA)'         # Local administrator having GENERIC ALL
    - '(A;;0x1;;;SY)'         # Local System having GENERIC ALL
    - '(A;;0x5;;;BA)'         # Built-in administrators having GENERIC ALL and  GENERIC WRITE
  filter_main_trustedinstaller:
    Image: 'C:\Windows\servicing\TrustedInstaller.exe'
  filter_main_tiworker:
    Image|startswith: 'C:\Windows\WinSxS\'
    Image|endswith: '\TiWorker.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies attempts to modify the "ChannelAccess" registry key under Windows Event Channel configurations, which is a part of the Windows Event Log system. Attackers may alter this key to restrict access to crucial system event logs, potentially limiting visibility into malicious activities. By tampering with this registry setting, adversaries can evade detection mechanisms, making it difficult for security teams to monitor system events that could indicate a compromise.

  The likely attacker objectives behind this behavior include covering their tracks, preventing logging of certain activities they perform, and slowing down forensic investigations. Techniques associated with this behavior include the Windows Registry manipulation tactic, particularly under the umbrella of defense evasion, as outlined in the MITRE ATT&CK framework. Specific techniques applicable here are **T1562.002: Impair Defenses** related to the modification of logging capabilities to hinder detection.

  Primary data sources for validating alerts from this detection rule include Registry Set events that capture changes to Windows registry keys, specifically focusing on those pertaining to event channels and access controls.

  ### Investigation Steps
  - **Review Registry Change Events:** Examine registry change logs to find entries indicating modifications to the `ChannelAccess` registry key, focusing on any persistent changes made outside of normal operational procedures.

  - **Investigate User Context:** Identify the user account or process that made the modification. Pay particular attention to changes initiated by non-administrative or unusual accounts to discern potential unauthorized access.

  - **Analyze Related Security Logs:** Scrutinize Windows Security logs for associated events that may indicate privilege escalation or unauthorized access attempts, especially those surrounding the timestamps of the registry changes.

  - **Correlate with Other Telemetry:** Cross-reference findings with event log data from EDR, SIEM, or other monitoring tools to identify any suspicious activities occurring in tandem with the registry change, such as process creations or network requests.

  ### Prioritization
  Given that unauthorized changes to registry settings for event log access can significantly hinder detection and monitoring efforts, this finding is considered high severity. The potential impact on an organization’s security posture is profound, as it directly relates to an attacker's ability to conceal malicious activities.

  ### Blind Spots and Assumptions
  Detection coverage may be limited in scenarios where log retention policies are strict or if logging is not appropriately configured to capture all registry modifications. The detection logic assumes that administrative processes are legitimate and that only non-standard applications should raise alarms. Additionally, the alert requires logging for registry changes to be enabled and adequately configured to capture relevant modification events, which might not be the case in all environments.

