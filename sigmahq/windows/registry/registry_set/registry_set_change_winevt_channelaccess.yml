title: Change Winevt Channel Access Permission Via Registry
id: 7d9263bd-dc47-4a58-bc92-5474abab390c
status: test
description: Detects tampering with the "ChannelAccess" registry key in order to
  change access to Windows event channel.
references:
- https://app.any.run/tasks/77b2e328-8f36-46b2-b2e2-8a80398217ab/
- https://learn.microsoft.com/en-us/windows/win32/api/winevt/
- https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
author: frack113
date: 2022-09-17
modified: 2024-03-25
tags:
- attack.defense-impairment
- attack.t1685.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\'
    TargetObject|endswith: '\ChannelAccess'
        # Add more interesting combinations if you found them
    Details|contains:
    - '(A;;0x1;;;LA)'         # Local administrator having GENERIC ALL
    - '(A;;0x1;;;SY)'         # Local System having GENERIC ALL
    - '(A;;0x5;;;BA)'         # Built-in administrators having GENERIC ALL and  GENERIC WRITE
  filter_main_trustedinstaller:
    Image: 'C:\Windows\servicing\TrustedInstaller.exe'
  filter_main_tiworker:
    Image|startswith: 'C:\Windows\WinSxS\'
    Image|endswith: '\TiWorker.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the "ChannelAccess" registry key, which governs access permissions for Windows event channels. A likely attacker objective is to obscure or manipulate event logging capabilities to evade detection during malicious activity, such as malware deployment or lateral movement. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1203) and the specific technique of Modifying Registry (T1112). The primary telemetry sources for this alert include Windows Registry modifications, particularly focusing on registry changes in Event Channels located at `HKEY_LOCAL_MACHINE\Microsoft\Windows\CurrentVersion\WINEVT\Channels`. The security impact could be significant, as it allows malicious users to effectively disable logging, facilitating further malicious operations without detection. This alert does NOT confirm on its own that malicious activity has occurred, as benign applications may also modify these registry entries.

  ### Investigation Steps

  - **Inspect registry access events:** Check for changes to `HKEY_LOCAL_MACHINE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\ChannelAccess` using Windows Security Event ID 4657, which indicates modifications to registry values. Review changes for unexpected entries or permissions.

  - **Identify malicious access patterns:** Look for the presence of access control entries such as `(A;;0x1;;;LA)`, which grants Local Administrators GENERIC ALL permissions. This is deemed a high-confidence malicious indicator.

  - **Review legitimate software behavior:** Validate that trusted applications are not frequently modifying this registry path. Changes from recognized administrative tools like `Group Policy Editor` or `PowerShell` should ordinarily produce documented changes that do not interfere with logging permissions.

  - **Correlate with process monitoring data:** Use Sysmon Event ID 10 to check if any processes (especially `explorer.exe` or unauthorized executables) initiated writes to the Event Channels, as anomalous writes from unexpected sources can indicate compromise.

  - **Analyze system role and criticality:** Determine the role of the affected system (e.g., domain controller, file server) and prioritize investigation accordingly. Changes on more sensitive roles warrant a higher level of scrutiny.

  - **Validate changes against audit logs:** Verify changes against a secured event log baseline. Check for discrepancies in the Event Logs using Event ID 1102 indicating that the audit log was cleared, which may correlate to the timing of registry modifications.

  ### Prioritization

  This alert is of high severity due to its potential to disable critical logging mechanisms on Windows systems. Malicious actors commonly employ such tactics to bypass security controls and evade detection, raising the urgency to investigate promptly.

  ### Blind Spots and Assumptions

  This detection may be limited by the absence of complete registry logging, which can impede the attribution of malicious activity. Evasion techniques may include legitimate administrative tools that also modify registry settings or the use of scripts to enact these changes silently. Monitoring for additional indicators, such as process creations from uncommon sources or lateral movement activity, can provide strengthened coverage against this and related malicious acts.

