title: Change Winevt Channel Access Permission Via Registry
id: 7d9263bd-dc47-4a58-bc92-5474abab390c
status: test
description: Detects tampering with the "ChannelAccess" registry key in order to
  change access to Windows event channel.
references:
- https://app.any.run/tasks/77b2e328-8f36-46b2-b2e2-8a80398217ab/
- https://learn.microsoft.com/en-us/windows/win32/api/winevt/
- https://itconnect.uw.edu/tools-services-support/it-systems-infrastructure/msinf/other-help/understanding-sddl-syntax/
author: frack113
date: 2022-09-17
modified: 2024-03-25
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\'
    TargetObject|endswith: '\ChannelAccess'
        # Add more interesting combinations if you found them
    Details|contains:
    - '(A;;0x1;;;LA)'         # Local administrator having GENERIC ALL
    - '(A;;0x1;;;SY)'         # Local System having GENERIC ALL
    - '(A;;0x5;;;BA)'         # Built-in administrators having GENERIC ALL and  GENERIC WRITE
  filter_main_trustedinstaller:
    Image: 'C:\Windows\servicing\TrustedInstaller.exe'
  filter_main_tiworker:
    Image|startswith: 'C:\Windows\WinSxS\'
    Image|endswith: '\TiWorker.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the "ChannelAccess" registry key for Windows event channels, specifically targeting access permissions that could restrict auditing and logging visibility. The likely objective of an attacker is to conceal malicious activities from event logs by manipulating permissions, thereby enhancing their stealth within the environment. This behavior aligns with the MITRE ATT&CK technique of "Modify Registry" (T1543.003), under the "Defense Evasion" tactic.

  The primary telemetry source is Windows Registry changes, specifically monitoring with logs capturing registry modifications (e.g., Event ID 4663). If malicious, modifying these permissions could prevent security tools and administrators from detecting critical events, thereby allowing attackers to operate undetected. Importantly, this detection on its own does NOT confirm an active compromise; it merely signals a potential manipulation of logging behavior.

  ### Investigation Steps

  - **Review Registry Changes:** Check for modifications under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\`. Look for changes to the `ChannelAccess` key and note any newly granted permissions, specifically for Local Administrators (LA) or System (SY).

  - **Examine Event ID 4663:** Filter security logs for Event ID 4663 which indicates object access. Focus on the specific registry key and look for descriptions indicating permissions being changed. Any modification to grant excessive rights warrants further investigation.

  - **Identify Legitimate Access Patterns:** Compare current registry access permissions to a baseline proper configuration. Systems should have strict access levels; deviations could indicate tampering. Identify systems regularly listing appropriate administrators such as (A;;0x5;;;BA) for Built-in Administrators.

  - **Analyze Process Behavior:** Look for processes related to TrustedInstaller.exe (C:\Windows\servicing\) or TiWorker.exe (C:\Windows\WinSxS\). Determine if these processes are associated with volatile manipulation of registry permissions or if they are operating within usual update/maintenance contexts.

  - **Correlate with Other Alerts:** Check for previous alerts related to defense evasion attempts (e.g., suspicious log clearing actions). This correlation can indicate a pattern in potential malicious behavior.

  ### Prioritization

  The severity of this alert is high due to the potential security impact on monitoring capabilities and system integrity. Manipulating event logging mechanisms is a common tactic in evasive techniques, making it crucial that incidents are addressed promptly. The likelihood of exploitation by adversaries is significant, given that this behavior is a known method for concealing malicious activity.

  ### Blind Spots and Assumptions

  Detection may be limited if registry auditing is not properly configured, as missing logs could hinder retrospective analysis. Legitimate operations such as system updates or adjustments by system administrators can trigger this alert, leading to false positives. A companion detection could involve monitoring the creation or deletion of relevant event channel logs, strengthening the overall coverage against potential evasion methods.

