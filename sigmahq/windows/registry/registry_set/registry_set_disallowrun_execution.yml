  ### Technical Context

  This Sigma rule detects modifications to the Windows registry that enable the DisallowRun feature, specifically the setting of the value to `1` under the path `Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun`. This behavior is commonly associated with attempts to limit user capabilities regarding which programs can be executed, potentially to obfuscate malicious activities or to restrict access to security products. The likely attacker objective is to compromise user systems through persistence mechanisms while avoiding detection by limiting user program execution.

  The relevant MITRE ATT&CK tactics include Persistence (TA0003) and Defense Evasion (TA0005), specifically the technique T1112 which pertains to ‘Modification of Registry.’ The primary telemetry source is Windows registry logs, with required log types being registry modification entries. If malicious, this action could lead to unauthorized restriction of software capabilities, impeding legitimate processes and applications. It's important to note that this detection does NOT confirm that an adversary has successfully executed a malicious payload; it simply indicates a change that may warrant further investigation.

  ### Investigation Steps

  - **Review registry modification logs for DisallowRun setting:**
    Check Windows registry logs (Event ID 4657 or equivalent) for modifications at `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun` to identify the time and user account involved.

  - **Examine process creation logs for unusual activity:**
    Evaluate Windows Security logs (Event ID 4688 and Sysmon Event ID 1) for any spawned processes around the time of the registry change. Look for unusual executables being run by the same user that modified the registry.

  - **Identify legitimate use cases of DisallowRun:**
    Consider if the registry change correlates with known application deployments or system policies. Check for legitimate enterprise software management or system hardening operations that set this flag to understand benign activities.

  - **Correlate changes with other system activities:**
    Investigate if the registry modification correlates with other suspicious indicators, such as unexpected USB device connections, file creation (using Event ID 4663), or script execution (using Event ID 4104 for PowerShell).

  - **Determine user account context:**
    Assess the user context (Service account vs. Administrator vs. Standard user) that made the registry change. Less privileged users making such changes may indicate malicious intent, while confirmed administrative actions may be for legitimate purposes.

  ### Prioritization

  This alert should be considered medium severity owing to its potential impact on user system capabilities. An unauthorized change to DisallowRun may suggest a malicious attempt to restrict user program execution, which is a technique often weaponized by attackers. However, because legitimate configurations may also trigger this alert, it requires contextual investigation before elevating the incident.

  ### Blind Spots and Assumptions

  Potential detection limitations include the possibility of manual or batch operations that could evade logging if not properly configured. Reliable detection depends on consistent logging of registry changes, which may be disabled in certain environments. Legitimate administrative actions, such as system lockdowns or software deployments, may also trigger this alert. A companion detection that strengthens coverage could include monitoring for unusual process execution patterns following registry modifications.

