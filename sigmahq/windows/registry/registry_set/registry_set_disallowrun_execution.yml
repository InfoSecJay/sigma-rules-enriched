  ### Technical Context

  This rule detects changes to the Windows registry that set the `DisallowRun` policy to `1`. This behavior prevents users from executing specific programs on the system, which can be utilized by attackers to restrict access to critical tools or to manipulate user experience. The likely attacker objective is to enhance control over a compromised system, leading to persistence in a user session without detection. This detection is associated with the MITRE ATT&CK technique T1112 (Modify Registry).

  The primary telemetry source is Windows Registry logs. The specific log type includes registry modification events that indicate changes to the DisallowRun value. If this action is initiated by an unauthorized user, it can prevent users from executing critical software, potentially leading to a denial-of-service situation for legitimate users. It’s important to note that this detection does not confirm that a compromise has occurred; instead, it raises awareness of registry modifications that warrant further examination.

  ### Investigation Steps

  - **Check registry modification timestamp:** Validate when the DisallowRun policy was last modified by examining the registry key at `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun`. Specific Event IDs (e.g., Event ID 4663) can help identify changes to this key.

  - **Identify user context of the modification:** Check who made the registry change by correlating it with logins around the modification time using Windows Security Log Event ID 4624 (Successful Logon) to see if it was a legitimate user or an attacker’s process.

  - **Review Group Policy refresh events:** Examine the system for Group Policy application logs (Event ID 4741, 4742) around the time of the change to see if the registry modification was initiated by a legitimate Group Policy update, indicating normal administrative activity.

  - **Look for known malicious indicators:** Search for additional registry changes in conjunction with the DisallowRun modification, such as unusual paths under the same `Policies\Explorer` key or concurrent execution of processes indicative of lateral movement (e.g., PowerShell processes).

  - **Verify legitimate application behavior:** Investigate if programs listed in the `DisallowRun` policy are critical business applications for the users—confirming if this restriction would affect operations.

  ### Prioritization

  This alert has medium severity due to the potential impact on user operations and the likelihood of abuse by an attacker looking to limit user capabilities on an infected system. While restricting application execution is common in some administrative contexts, such behavior can also indicate malicious activity if originating from an unauthorized or unexpected user.

  ### Blind Spots and Assumptions

  The detection relies on accurate logging of registry changes; if registry auditing isn’t enabled, legitimate modifications may go unnoticed. Evasion techniques may include modifying the registry from a legitimate process that has higher privileges. Additionally, legitimate software may change the DisallowRun setting under certain configurations, such as security suite updates. A related detection to strengthen coverage would be monitoring for unusual account behavior or privilege escalation patterns, as well as capturing suspicious PowerShell activity (T1059.001) that could manipulate the registry.

