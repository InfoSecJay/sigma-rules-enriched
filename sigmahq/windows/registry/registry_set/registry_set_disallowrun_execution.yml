note: |
  ### Technical Context
  This rule detects changes made to the Windows registry that set the `DisallowRun` value to `1`, effectively preventing users from executing specific applications. This can indicate an attempt by an attacker to restrict user access to critical utilities or programs in order to maintain control over a compromised system. Attackers may utilize this technique to hinder forensic analysis or to ensure that legitimate users cannot run security tools that would disrupt their activities.

  In terms of MITRE ATT&CK, this scenario encompasses the tactics of **Persistence** and **Defense Evasion**, specifically linked to the technique **T1112: Modify Registry**. By manipulating registry settings, adversaries aim to establish footholds or hinder system recovery processes. The primary data source for detecting this activity is Windows registry logs, specifically targeting any alterations under the registry path `Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun`.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows registry logs for any recent modifications to the `DisallowRun` key. Focus on entries marked with a timestamp that aligns with the alert.

  - **Verify User Permissions**: Check the user permissions for accounts that made changes to the registry. Look for any unauthorized or unexpected accounts that may have altered the `DisallowRun` setting.

  - **Analyze Process Execution**: Investigate process creation logs around the time of the registry change. Pay close attention to any applications that may have been blocked or unexpectedly terminated after the DisallowRun setting was applied.

  - **Cross-Reference Security Tools**: Confirm whether critical security tools are being affected by the applied DisallowRun settings. Identify, through application logs, any impacts on system monitoring or protection technologies.

  ### Prioritization
  This alert carries a medium severity due to its potential impact on security operations. An attacker leveraging this technique poses a significant threat to the integrity and availability of the system, especially if the targeted applications include security measures or monitoring tools.

  ### Blind Spots and Assumptions
  There may be blind spots if the necessary logging for registry changes is not fully enabled, as detection relies heavily on the presence of complete and accurate registry log entries. The detection logic assumes that modifications to the registry can only be made by users with explicit permissions, which may not account for privilege escalation or usage of disguised administrative tools. It is essential to ensure thorough logging of registry activities is configured to allow effective detection of such changes.

