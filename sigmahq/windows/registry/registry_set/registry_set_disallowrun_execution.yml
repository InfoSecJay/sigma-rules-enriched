note: |
  ### Technical Context

  This Sigma rule detects changes made to the Windows Registry, specifically the configuration of the `DisallowRun` setting under `Policies\Explorer`, which, when set to 1, restricts users from running specific applications. The likely attacker objective is to impair system functionality, potentially preventing users from executing certain software, thereby maintaining persistence or executing a defensive strategy against detection. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (ID T1112).

  The primary telemetry source for this detection is Registry changes, specifically targeting Windows Registry event logs. Security impacts include the ability of an attacker to restrict legitimate user activity or to enforce dormant malware by preventing endpoint protection agents from executing. Importantly, this detection does NOT confirm whether the registry change was performed by an authorized administrator or potentially malicious actor without further context.

  ### Investigation Steps

  - **Review registry alterations:** Check Registry Event ID 4657 for any modifications to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun` to confirm if the setting was changed to 1.

  - **Identify recent changes:** Correlate the timestamp of the registry change with user activity. Review Security Event ID 4624 for logon events around the same time to determine if an administrative account was used.

  - **Evaluate process execution history:** Examine Sysmon Event ID 1 and correlate with Process Creation Events to observe if any applications listed in `DisallowRun` are being blocked from launching by users, indicating potential malicious intent.

  - **Investigate system functionality:** Assess affected systems for the expected behavior of restricted applications. Legitimate user activity should show no errors related to program execution for allowed software on the system.

  - **Check for other key indicators:** Monitor for any other registry keys related to application restrictions, such as `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\RestrictRun`, to identify comprehensive changes reflecting possible malicious activity.

  ### Prioritization

  This alert should be treated with medium severity due to its direct impact on user and system functionality, highlighting potential malicious use aimed at obfuscation and persistence. Although not commonly weaponized alone, its presence can indicate an attempt to create a hostile or unsupported environment for end-users.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging around legitimate administrative actions, which could trigger this alert. Some legitimate activities, such as organizational policy updates by IT teams, may also result in this registry change. Related detections to enhance coverage include monitoring other registry modifications that affect application execution permissions or policies to reduce false positives and improve context.

