note: |
  ### Technical Context

  This Sigma rule detects the modification of system firewall settings in Windows through registry changes, specifically targeting additions to the Authorized Applications list under the FirewallPolicy. This behavior typically indicates an attempt to grant unauthorized network access to applications, which could be exploited by malicious actors to circumvent security controls or enable lateral movement.

  The relevant MITRE ATT&CK tactic and technique for this activity is Defense Evasion (T1203). Primary telemetry sources include Windows Registry Logs focusing on registry write events (Event ID 4657). If exploited, an attacker could leverage this to allow malicious software persistent access to network resources.

  It is crucial to note that this detection does not confirm malicious activity on its own, as legitimate applications may also require such firewall configurations.

  ### Investigation Steps

  - **Identify recent registry modifications:** Review Windows Security Event ID 4657 logs for modifications to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Firewall\Firewall Policy\Authorized Applications\List`. Confirm if the changes were initiated from a trusted device or user account.

  - **Correlate user activities:** Investigate user activities around the time of the change using Event ID 4624 (Logon) and Event ID 4688 (Process Creation). Look for unusual accounts or processes tied to the registry changes that are not part of regular operational behavior.

  - **Validate application access history:** Check logs from the Windows Firewall (via `Windows Event Logs/Applications and Services Logs/Microsoft/Windows/Firewall/Operational`) for any recent application access events that correspond to entries in the Authorized Applications list. Legitimate applications will typically have a consistent behavior pattern.

  - **Look for known malicious indicators:** Utilize threat intelligence to see if the executables added to the Authorized Applications list are recognized as malicious or associated with known threats like `Trojan.Win32.Zbot` or similar.

  - **Assess the criticality of the affected host:** Read registry changes against the asset classification within the organization. A modification on a server hosting sensitive data warrants immediate escalation.

  - **Document expected behaviors:** Reference baseline configurations for known legitimate applications in use within your organization for context. If entries correspond to legitimate business applications, this could indicate benign intent rather than malicious activity.

  ### Prioritization

  The alert has medium severity as it relates to changes in firewall settings that can directly impact the security posture of the enterprise. The potential for abuse by malicious actors is moderate, particularly in a compromised environment. However, legitimate administrative actions could also result in this alert, necessitating careful investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations for registry changes. Evasion techniques could include legitimate applications re-enabling their own access after being temporarily blocked. Additionally, system maintenance by administrators may trigger this alert unnecessarily. A companion detection would include logs from endpoint detection tools that monitor firewall changes and system process behaviors, providing layered visibility.

