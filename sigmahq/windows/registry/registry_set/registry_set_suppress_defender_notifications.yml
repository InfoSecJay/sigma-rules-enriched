note: |
  ### Technical Context

  This rule detects changes to the Windows Registry that suppress notifications from the Windows Security Center, which could indicate an attempt to disable critical security alerts. The likely objective of an attacker is to reduce visibility into their malicious activities by preventing security warnings from being displayed. This behavior corresponds to the MITRE ATT&CK tactic of **Persistence** (TA0003) and the technique **Modify Application Settings** (T1112).

  The primary telemetry source is Windows Registry changes, specifically monitoring `SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration\Notification_Suppress`. If this change is malicious, it may lead to prolonged system compromise by evading detection. Importantly, this detection does NOT confirm that an attack is occurring; the settings may be altered for legitimate administrative purposes as well.

  ### Investigation Steps

  - **Review the Registry Change:** Check for Event ID 4663 in the Security log for access to the registry, focusing on the `TargetObject` path for changes made to `Notification_Suppress`. Look for elevated privileges associated with the change that could indicate malicious intent.

  - **Verify Change Context:** Examine the user context under which the registry modification was made. Legitimate administrative users should typically make changes; unusual accounts or service accounts could indicate compromise.

  - **Check Related Security Events:** Investigate Security Event ID 5145 to identify file and folder access events immediately before and after the registry modification. Look for access to known binaries associated with malware or security tooling.

  - **Cross-reference with Defender Alerts:** Review any concurrent Microsoft Defender alerts or logs related to potential threats on the host. Resolve discrepancies between active threats and the suppression of notifications.

  - **Assess Historical Behavior:** Use Sysmon Event ID 1 to analyze creation and modification of process events leading up to the registry change, looking for anomalous behavior or processes not typical to the environment.

  ### Prioritization

  This alert is of medium severity, as it targets the Windows Security Center, a crucial security feature. While the likelihood of being abused by an attacker is moderate, it can indicate a step towards broader compromise. Disabling notifications is a common tactic used to conceal malicious activities, warranting timely investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate administrative changes, especially during legitimate updates or configuration tasks. Ensure that Sysmon logging is enabled for comprehensive process monitoring. Be aware that user-initiated actions for software deployment can trigger this alert, potentially leading to false positives. A related detection to strengthen coverage is monitoring for unusual service creations or modifications via Event ID 7045.

