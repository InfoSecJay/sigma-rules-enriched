  ### Technical Context

  The Sigma rule detects changes to the Windows Registry where the `Notification_Suppress` value is set to 1, which suppresses warnings from the Windows Security Center. This behavior is commonly associated with attackers seeking to disable crucial security notifications that could alert users or administrators to malicious activity. The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1112). The primary telemetry source is Windows Registry logs, specifically targeting the `SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration` path. If utilized maliciously, this could enable further compromise by cloaking the actions of malware. It is important to note that this detection does NOT confirm that an attack is occurring on its own; legitimate applications may also modify these settings.

  ### Investigation Steps

  - **Examine Registry Changes**: Query Registry Event logs for Event ID 4657 to confirm changes to the `Notification_Suppress` value in `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration`. Look specifically for DWORD values set to 1.

  - **Identify User Context**: Review logins on the affected system (Security Event ID 4624) to establish the user context around the time the registry change occurred. Determine if the change was made by a legitimate administrator or a potentially unauthorized account.

  - **Assess Running Processes**: Check for any suspicious running processes via Sysmon Event ID 1 (Process Creation) that may correlate with the registry change. Legitimate system services or processes rarely modify this setting.

  - **Review Scheduled Tasks**: Investigate any created or modified scheduled tasks (Task Scheduler event logs) that may have been configured to run malicious scripts post-registry change; these could indicate a higher degree of persistence.

  - **Cross-Check Software Installation**: Utilize Windows Event Logs for application installs (Event ID 1033 for Setup) around the same timeframe to identify installations of potentially unwanted programs or known malware that could manipulate Windows Security settings.

  ### Prioritization

  This alert should be considered medium severity. The impact can be significant if the affected system serves a critical role in the infrastructure, as disabling security notifications can lead to unobserved malicious activities. Attackers frequently weaponize registry modifications for persistence and evasion, making it a relevant risk factor.

  ### Blind Spots and Assumptions

  Evasion techniques include direct modification of the registry through methods that do not generate observable events. The detection relies critically on having Windows Registry auditing enabled to capture these events reliably. Legitimate system management tools or administrative scripts could trigger this alert during normal operations. A related detection to consider is monitoring for network connections from processes that change this registry value, assisting in identifying potential exfiltration or command/control communications.

