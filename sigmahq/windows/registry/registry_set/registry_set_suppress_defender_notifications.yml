  ### Technical Context

  This rule detects an alteration of the Windows Registry that suppresses notifications from the Windows Security Center by setting the `Notification_Suppress` value to 1. The likely attacker objective behind this behavior is to evade detection and manipulation of security alerts which could indicate malicious activity, thereby prolonging their presence within the environment. This behavior corresponds to the MITRE ATT&CK tactic "Defense Evasion" (T1562) and is relevant to technique "Indicator Removal on Host" (T1112).

  The primary telemetry source is the Windows registry, specifically monitoring `registry_set` events. The impactful security implications could include a compromised environment where the user receives no alerts about critical system changes or security incidents. Importantly, this detection does NOT confirm that an attack is occurring; it only indicates that registry settings were modified, which can be benign as well.

  ### Investigation Steps

  - **Check registry changes:** Review Windows Security logs for Event ID 4657 to confirm registry keys modified, specifically targeting `SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration\Notification_Suppress`.

  - **Identify associated processes:** Utilize Sysmon logs (Event ID 1) to track process creation around the time of registered modifications to see if there are unusual processes tied to the registry change.

  - **Look for other indicators of lateral movement:** Assess logs for unusual user behavior, such as recent logins from external sources, or using tools like Process Explorer to identify if any unexpected processes (e.g., PowerShell for silent execution) were executed.

  - **Confirm benign software or policies:** Validate whether legitimate applications or organizational policies are intended to suppress notifications. Review management or network policies for any known benign configurations reflecting such behavior.

  - **Investigate system impact:** Examine other Security Center alerts or notifications that were generated (or lack thereof) after the modification to understand the broader implications on system security.

  - **Cross-reference with known threat actors:** Check threat intelligence sources for any reported use of registry modifications to suppress alerts by malicious actors, focusing on correlation with active campaigns.

  ### Prioritization

  This alert is of medium severity due to the potential risk it poses to system integrity and visibility over security issues. The ability of an adversary to disable critical notifications increases the likelihood of malicious activities going undetected, which is a technique frequently weaponized in exploitation scenarios.

  ### Blind Spots and Assumptions

  Detection limitations include situations where legitimate administrative changes occur, which can result in false positives. Required log sources include comprehensive Windows registry logging to catch all changes reliably. Legitimate activities that may trigger the alert include IT maintenance tasks or pre-approved system updates that modify notification settings. A related detection could involve monitoring for unauthorized access to administrative tools or Windows management tools that interact with system settings.

