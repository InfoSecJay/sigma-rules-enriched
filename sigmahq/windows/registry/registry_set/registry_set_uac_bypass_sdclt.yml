- Unknown
level: high
note: |
  ### Technical Context

  This rule detects unauthorized modifications to specific registry keys associated with User Account Control (UAC) bypass techniques using `sdclt.exe`. The likely attacker objective is to escalate privileges while avoiding detection by manipulating how processes are executed. The relevant MITRE ATT&CK techniques are "Bypass User Account Control" (T1548.002) and "Defense Evasion." Primary telemetry sources include Windows Registry logs related to registry modifications, specifically targeting the command execution paths for applications. If the behavior is malicious, it could lead to elevated privileges and unauthorized access to sensitive information or systems. This detection does NOT confirm that a compromise has occurred; it merely indicates a potential attempt at privilege escalation through registry manipulation.

  ### Investigation Steps

  - **Identify registry modifications:** Examine Windows Registry event logs (Event ID 4657) for changes to `Software\Classes\exefile\shell\runas\command\isolatedCommand` and `Software\Classes\Folder\shell\open\command\SymbolicLinkValue`. Look for unexpected or suspicious modifications indicative of potential abuse.

  - **Check process execution context:** Look for any instances of `sdclt.exe` execution in the System event logs (Event ID 4688) after the registry change to identify whether it was executed without a user context or suspicious parameters.

  - **Review related command line arguments:** For any identified instances of `sdclt.exe`, inspect the command line arguments used. Legitimate usage typically follows the form of system file restoration, whereas any inclusion of unexpected flags may indicate malicious intent.

  - **Cross-reference with known good behavior:** Validate legitimate applications registered under similar paths to ensure they exhibit expected command execution patterns. Authorized admin tasks in a non-malicious context should show predictable behavior and command parameters.

  - **Identify pre-existing anomalies:** Check for prior logs of user behavior around the time of the registry change, particularly any accounts with recent access patterns that exhibit privilege escalation attempts or anomalies in logon behavior (Event ID 4624).

  ### Prioritization

  This alert is of high severity given that it targets a critical phase of the attack lifecycle — privilege escalation. The likelihood of malicious abuse is elevated, as bypassing UAC is a common technique used by attackers to gain higher privileges unobtrusively. The ability of attackers to exploit this technique for lateral movement or access restricted information necessitates immediate investigation.

  ### Blind Spots and Assumptions

  Detection could be limited by attackers using alternative methods to modify the registry without generating logs, or by misconfigurations that prevent the capture of relevant registry changes. Legitimate software installations or updates may also lead to similar registry modifications, triggering false positives. To enhance coverage, companion detection on process creation using Sysmon (Event ID 1) may reveal additional context that could be critical in understanding the threat landscape.

