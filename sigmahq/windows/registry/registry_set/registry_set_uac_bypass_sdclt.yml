note: |
  ### Technical Context

  The Sigma rule detects attempts to bypass User Account Control (UAC) by manipulating specific registry keys associated with the Windows executable sdclt.exe. The likely goal of this behavior is to escalate privileges without user consent, allowing adversaries to execute malicious code with elevated rights. This behavior aligns with the MITRE ATT&CK tactic "Privilege Escalation" (ID: T1548.002), specifically focusing on techniques to bypass UAC prompts.

  The primary telemetry sources are Windows registry set events, particularly targeting changes in specific paths related to executable commands. If malicious, a UAC bypass can lead to unauthorized access to sensitive system resources and data. This detection does not confirm that a successful privilege escalation has occurred; it only indicates that a potentially malicious attempt at bypassing UAC has been made.

  ### Investigation Steps

  - **Check registry modifications:** Review registry changes at the paths 'Software\Classes\exefile\shell\runas\command\isolatedCommand' and 'Software\Classes\Folder\shell\open\command\SymbolicLinkValue' by querying Windows Event ID 4657 for changes made to the registry.

  - **Identify elevated processes:** Investigate running processes with Event ID 4688 and check if sdclt.exe is executing with elevated (SYSTEM/Administrator) privileges. Legitimate sdclt.exe instances should be run by standard users with no UAC bypass attempts.

  - **Correlate with user activity:** Cross-reference the timestamps of the detected registry modification with recent user logons (Security Event ID 4624) to determine if this behavior correlates with anomalous user activity or valid administrative actions.

  - **Look for command-line arguments:** Examine the command line used when sdclt.exe was executed (Sysmon Event ID 1). Look for unusual arguments that do not align with legitimate usage; legitimate executions of sdclt.exe should not involve attempts to manipulate UAC settings.

  - **Validate namespace and isolatedCommand values:** Check for the presence of suspicious or unknown values in the registry keys being modified, specifically those ending with '-1[0-9]{3}\\Software\\Classes\\', indicating an attempt to change execution behavior intended by adversaries.

  ### Prioritization

  This alert has a high severity due to its potential impact on critical systems if an attacker successfully bypasses UAC and escalates privileges. The likelihood of malicious abuse is significant, as UAC bypass is a common technique used by attackers to gain greater control over an environment.

  ### Blind Spots and Assumptions

  This detection may miss cases where attackers use alternate methods for UAC bypass that do not involve these specific registry modifications. Reliable detection requires consistent logging of all registry changes, especially in the specified paths. Legitimate administrative applications may trigger the rule, especially during software installation or system configuration tasks. A companion detection to consider is monitoring Event ID 744 for software installation events that could provide context for legitimate UAC bypass scenarios.

