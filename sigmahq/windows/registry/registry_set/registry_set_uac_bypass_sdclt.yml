note: |
  ### Technical Context
  This detection rule identifies potential User Account Control (UAC) bypass attempts through manipulation of the Windows Registry using `sdclt.exe`. UAC bypass is a common tactic employed by attackers to escalate privileges and execute malicious code without triggering standard protections. In this scenario, an adversary seeks to gain higher-level privileges on a compromised system, allowing them to install malware, access sensitive data, or establish persistence.

  The relevant MITRE ATT&CK tactics involved in this particular attack are **Defense Evasion** (T1562) and **Privilege Escalation** (T1548.002). By exploiting vulnerabilities in UAC, attackers can circumvent security measures that typically restrict unauthorized changes to the system. The primary data sources for this detection will be Windows Registry logs that track changes to key registry paths associated with executable command execution options.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows Registry for modifications to the paths specified in the rule, focusing on `Software\Classes\exefile\shell\runas\command\isolatedCommand` and `Software\Classes\Folder\shell\open\command\SymbolicLinkValue`. Identify any suspicious keys or values that deviate from normal configuration.
  - **Analyze Process Creation Events**: Look for process creation events that reference `sdclt.exe` or related files. Scrutinize the command-line arguments associated with these processes to determine if there are any anomalous patterns indicating UAC bypass attempts.
  - **Correlate with Security Alerts**: Cross-reference with other security alerts from EDR or AV solutions. Check for simultaneous alerts related to privilege escalation or suspicious application behavior that could indicate a larger attack campaign.
  - **Investigate User Context and Activity**: Determine the user accounts involved in the registry modifications and process creations. Assess their legitimacy and whether they have the appropriate permissions, paying close attention to any accounts with elevated privileges acting strangely.

  ### Prioritization
  This alert has a high severity rating due to the potential impact of a successful UAC bypass attack, which can lead to significant compromises within an enterprise environment. The likelihood of exploitation is also elevated, given the prevalence of such techniques in modern attack vectors.

  ### Blind Spots and Assumptions
  One blind spot in detection coverage may be environments where registry logging is not fully enabled. Additionally, if an attacker has pre-existing elevated privileges, the logic may not capture their actions effectively. The detection assumes that any manipulation of the specified registry keys for UAC bypass is malicious; however, it may also capture benign administrative changes, leading to possible false positives. Proper logging configurations must be in place to ensure that registry modifications are recorded adequately for this alert to function.

