note: |
  ### Technical Context

  This Sigma rule detects changes to the Internet Explorer ZoneMap settings, specifically downgrading the security level for HTTP and HTTPS protocols to the "My Computer" zone. Such alterations can enable malicious actors to manipulate security settings, thereby allowing files downloaded from the internet to be treated with the same trust as local files, potentially leading to unauthorized code execution or malware installation.

  The relevant MITRE ATT&CK tactics and techniques include **Defense Evasion** (TA0005) and **Modify Registry** (T1112). Primary telemetry sources for detection include Windows registry logs, specifically monitoring changes under `HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults`. If malicious, this behavior poses a significant risk, as it greatly weakens the security posture of affected systems. However, this detection alone does not confirm that an attack has taken place; it merely indicates a potential misconfiguration or unauthorized change that warrants further investigation.

  ---

  ### Investigation Steps

  - **Check Registry Change Details:** Review Windows Registry logs for Event ID 4657 or PowerShell history logs for changes made to `HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults`. Look for alterations to values related to `http` and `https` and confirm if they have been downgraded to `DWORD (0x00000000)`.

  - **Identify User Account Activity:** Examine user activity within the previous session (Event ID 4624). Determine if a specific user account made the changes and whether it is tied to administrative activity or unusual behavior, such as access from a different location not typical for the user.

  - **Analyze Application Execution Logs:** Review AppLocker or Windows Event logs (Event IDs 8000-8015) for any executable files launched after the registry change. Pay special attention to any file launches that correspond to downloads or installs that originated from external URLs.

  - **Correlate with Network Traffic:** Inspect network logs (e.g., Firewall or Proxy logs) for downloads or connections from recognized malicious domains or unusual outgoing traffic patterns following the registry change. Validate alerts against known bad indicators.

  - **Review Legitimate Use Cases:** Consider any legitimate business processes that may require similar registry modifications, such as specific enterprise applications that manipulate browser settings. Document the reasoning or process behind these changes if applicable.

  - **Cross-reference with Companion Alerts:** Check for related alerts tied to malware execution or exploitation attempts (use alert ID 10344bb3-7f65-46c2-b915-2d00d47be5b0). Correlate findings to identify patterns revealing broader malicious tactics at play.

  ---

  ### Prioritization

  This alert indicates a high severity due to the potential decrease in security for downloading files, which could lead to malware infections. The likelihood of malicious abuse is notable, as adversaries often exploit trusted settings to facilitate unauthorized activities. The behavior represents a commonly weaponized tactic for evading detection in the initial stages of an attack.

  ---

  ### Blind Spots and Assumptions

  The detection is limited by potential evasion techniques, such as attackers reverting settings back to default or utilizing scripts that mask their changes. Reliable detection requires consistent logging of registry modifications and ensuring necessary levels of auditing are enabled. Legitimate applications may attempt similar settings changes for internal functionality, which necessitates awareness of business-specific applications. A related detection for unauthorized executable file execution (e.g., malicious payloads post-registry modification) would enhance overall visibility and response capability.

