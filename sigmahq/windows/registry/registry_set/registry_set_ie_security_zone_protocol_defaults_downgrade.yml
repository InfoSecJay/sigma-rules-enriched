note: |
  ### Technical Context

  This Sigma rule detects modifications to the Internet Explorer ZoneMap settings, specifically changes that downgrade the trust level for `HTTP` and `HTTPS` protocols to the "My Computer" zone. This behavior allows files downloaded from the internet to be treated as local files, potentially bypassing security measures and allowing malicious content to execute with elevated permissions. The likely attacker objective is to facilitate malicious file execution by exploiting the trusted status of local files.

  Relevant MITRE ATT&CK techniques include "Privilege Escalation" (T1068) and "User Execution" (T1203). The primary telemetry sources are the Windows Registry modifications tracked under the `registry_set` log category. If malicious, this activity could lead to a significant compromise, enabling attackers to execute harmful code with fewer constraints. This detection does **not** confirm that a malicious action has occurred; it merely indicates a potential security configuration change that could be exploited.

  ### Investigation Steps

  - **Verify Registry Change**: Check the Windows Registry under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults` for any records of changes to `HTTP` or `HTTPS` settings. Look for a `DWORD` value of `0x00000000`.

  - **Correlate with Process Creation Events**: Review Security Event ID 4688 for any newly created processes that may have been spawned following the registry change. Look for unexpected executable names or parent processes commonly associated with malware.

  - **Investigate Recent Downloads**: Check for recent file downloads in the user’s profile directory, especially in folders like `Downloads` or `Desktop`. Compare against a baseline of expected file types, e.g., `.exe`, `.scr`, `.bat`, suggesting potential malicious behavior.

  - **Review Internet Explorer Usage Logs**: Look for entries in browser logs indicating accessed sites, particularly those serving files or potential malware. Analyze the frequency and nature of visited URLs; repeated access to suspicious domains raises concern.

  - **Identify Legitimate Use Cases**: Determine if any recent trainings or software installations warrant this registry change; legitimate applications (like certain enterprise tools) may intentionally alter IE settings for functionality. Document such cases.

  - **Prioritize High-Confidence Indicators**: Establish frequency or patterns of registry changes across multiple user accounts. If multiple changes occur within a short timeframe or in conjunction with known malicious domains, treat this as a high-confidence malicious indicator.

  ### Prioritization

  This alert is high-severity due to its potential for significant impact on system integrity and security. Downgrading trust levels poses a high likelihood of malicious exploitation, especially since such changes are often weaponized by attackers to facilitate lateral movement or code execution.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations, specifically if audit policies for registry changes are not adequately set up. Additionally, legitimate applications might modify these settings for valid reasons, potentially causing false positives. Further detection mechanisms could include monitoring for specific file execution trends or leveraging behavioral analysis tools to correlate abnormal user activities with registry changes. A related detection could involve monitoring for suspicious `LaunchApp` or other executable invocations consequent to registry alterations.

