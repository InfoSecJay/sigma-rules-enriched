note: |
  ### Technical Context
  This detection rule identifies changes to Internet Explorer's ZoneMap configuration for the "HTTP" and "HTTPS" protocols where settings are modified to associate these protocols with the "My Computer" zone. This association effectively lowers security restrictions, allowing downloaded files from the Internet to be treated with the same level of trust as local files, potentially facilitating malicious activities such as the execution of payloads that were previously restricted.

  The suspected threat scenario involves attackers who may manipulate these settings to bypass security controls. By granting Internet-derived files local trust levels, attackers can exploit vulnerabilities in browser handling of downloaded content for malicious purposes, such as executing malware or phishing tools. In this context, it aligns with the MITRE ATT&CK frameworks, particularly the techniques of **Defense Evasion (T1211)** as it enables attackers to bypass security measures designed to prevent malicious execution.

  Primary data sources for this detection include **Windows registry logs**, specifically changes to the ZoneMap settings found under the registry key related to Internet Explorer security configurations. Monitoring registry modifications provides an essential insight into whether unauthorized changes are made, particularly in an enterprise environment.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate the Windows registry logs for changes to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults` to understand the specific alterations made to HTTP and HTTPS settings.
  - **Assess User Context**: Determine which user made the changes. Analyze the user activity leading up to the modification for any signs of compromise or malicious behavior.
  - **Analyze Downloaded Contents**: Check for recently downloaded files, particularly those executed from an Internet source. Investigate their origin and hash values against threat intelligence databases for any known malicious indicators.
  - **Verify Software and Policy Compliance**: Ensure that local security policies and software restrictions are in place to prevent unauthorized access and modifications to browser security settings.

  ### Prioritization
  The potential impact of this alert is high due to the likelihood of exploitation by malicious actors to run untrusted executables that could compromise sensitive data or systems within the enterprise. The ease with which such configurations can be altered increases the urgency to investigate promptly.

  ### Blind Spots and Assumptions
  This detection may not cover instances where attackers employ alternative methods to change security settings or utilize non-IE browsers for their attacks. Additionally, it assumes that registry auditing is enabled and set to capture all relevant changes; thus, if auditing is not appropriately configured, such modifications might go undetected. Maintaining consistent logging for registry modifications is crucial for the successful operation of this alert.

