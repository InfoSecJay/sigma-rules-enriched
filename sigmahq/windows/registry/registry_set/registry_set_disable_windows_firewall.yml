note: |
  ### Technical Context

  This rule detects changes in the Windows registry where the Firewall setting is disabled by setting the "EnableFirewall" DWORD value to 0. Disabling the Windows Firewall can enable attackers to bypass security controls, allowing them to execute further malicious actions on the system. This behavior generally indicates an attempt to facilitate lateral movement or establish persistence, which aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562.004). Key telemetry sources include Windows Registry logs, specifically monitoring for changes under `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsFirewall\` for both StandardProfile and DomainProfile. If malicious, this action could lead to increased system vulnerability and broader network exposure. Notably, this detection alone does not confirm malicious intent or activity without additional context.

  ### Investigation Steps

  - **Check registry modification details:** Inspect Windows Registry logs for Event ID 4663, specifically targeting `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\WindowsFirewall\StandardProfile\EnableFirewall` and `DomainProfile\EnableFirewall`. Look for timestamp discrepancies or other unusual values that may indicate external tampering.

  - **Identify user account activity:** Review Security logs (Event ID 4624 for logon events) to correlate the timing of the registry change with user logon sessions. Verify whether the account making the changes matches expected administrative roles or patterns.

  - **Compare against normal baseline behavior:** Establish what a legitimate Windows environment looks like, focusing on expected firewall configurations. Confirm that the configured profiles (StandardProfile and DomainProfile) are set to "1" to indicate the firewall is enabled.

  - **Trace related processes:** Utilize Sysmon logs (Event ID 1) to correlate process creation events around the time of the registry modification. Look for commands executed via `reg.exe` or PowerShell scripts that may indicate automation or scripted attacks.

  - **Look for additional indicators of compromise (IoCs):** Search for known malicious hash values or file signatures in file creation events (Sysmon Event ID 11) that correlate to any binaries executed post-registry modification, particularly those related to known Threat Actor Tactics.

  ### Prioritization

  The severity of this alert is medium due to the essential role of the Windows Firewall in protecting network integrity and the potential for malicious users to exploit this change. While the likelihood of abuse is moderate, as the action is a common method employed by attackers, it is not frequently seen in legitimate administrative actions, which requires further investigation.

  ### Blind Spots and Assumptions

  The detection may miss changes made through other legitimate administrative tools that may not trigger logging for registry modifications. It requires thorough logging settings to include and retain detailed Registry logs effectively. Common legitimate activities may include network policy updates or administrative tasks, which could inadvertently disable the firewall. Companion detections include monitoring for changes in other system security policies (e.g., Local Security Policy modifications) to provide enhanced visibility into potential policy manipulation attempts.

