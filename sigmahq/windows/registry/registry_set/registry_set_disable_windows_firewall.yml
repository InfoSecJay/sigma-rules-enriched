note: |
  ### Technical Context

  This rule detects attempts to disable the Windows Firewall by modifying registry keys associated with the firewall settings. Specifically, it observes changes where the `EnableFirewall` value is set to 0 (disabled) within both the Standard and Domain profiles of Windows Firewall settings. The likely attacker objective is to impair the system's defenses, facilitating further malicious activity such as lateral movement or unauthorized access.

  This behavior falls under the MITRE ATT&CK tactic of Defense Evasion and specifically relates to Technique T1562.004 (Disable or Modify Tools). The primary telemetry sources for this detection are Windows Registry logs, particularly focusing on the specific registry paths associated with firewall configurations. If malicious, this action can expose the system to greater risk from network-based threats. It is important to note that this alert does NOT confirm malicious activity on its own, as legitimate administrative actions may also trigger it.

  ### Investigation Steps

  - **Review Registry Changes**: Check Windows Registry logs for Event ID 4657 where the registry key path matches `\SOFTWARE\Policies\Microsoft\WindowsFirewall\StandardProfile\EnableFirewall` or `\SOFTWARE\Policies\Microsoft\WindowsFirewall\DomainProfile\EnableFirewall`, focusing on changes to the DWORD value, specifically for entries set to 0.

  - **Correlate with User Activity**: Identify associated user actions by reviewing Event ID 4624 (logon events) preceding the registry change. Look for logon types that correspond to administrative accounts performing legitimate configuration changes.

  - **Inspect for Other Security Controls Alterations**: Examine additional related logs (Event ID 4902 for Security Policy changes) that may indicate multiple modifications to security settings, which could strengthen the case for malicious intent.

  - **Analyze Network Firewall Logs**: If available, cross-check any changes against network firewall logs to determine if there is a pattern of suspicious outbound connections following the registry change, which would signify malicious use of a disabled firewall.

  - **Identify Historical Changes**: Review the history of the specific registry key to determine if there are multiple or unexplained changes over a short period, a potential indicator of compromise.

  - **Assess Impacted Host’s Role**: Confirm the role of the affected system (e.g., domain controller, file server), as changes on critical systems are of higher concern. Analyzing the broader context of firewall settings and other security posture indicators may reveal intentional misconfigurations.

  ### Prioritization

  This alert holds medium severity due to the critical role of the Windows Firewall in protecting systems from unauthorized access. The likelihood of malicious actors exploiting this by disabling firewalls, especially in enterprise environments, is significant because disabling such defenses often aligns with common infiltration tactics.

  ### Blind Spots and Assumptions

  Detection of this activity can be evaded by modified user permissions or malicious software that alters registry values without generating standard audit logs. Ensure that registry auditing is enabled for comprehensive coverage. Legitimate administrative tasks, such as network maintenance or troubleshooting, may inadvertently trigger this alert. A companion detection rule monitoring Event ID 4672 (Special privileges assigned to new logon) can help contextualize potentially malicious activity around privilege escalation.

