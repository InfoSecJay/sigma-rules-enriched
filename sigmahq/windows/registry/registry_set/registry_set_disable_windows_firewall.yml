  ### Technical Context

  This Sigma rule detects attempts to disable the Windows Firewall by identifying changes in registry settings, specifically the DWORD value of `EnableFirewall` set to 0 under both StandardProfile and DomainProfile paths. The likely attacker objective is to lower the defenses of a system to facilitate further exploitation or to evade detection from security controls. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562.004, which involves disabling security features.

  The primary telemetry source consists of Windows Registry modification events. The relevant log types include Windows Event logs specifically tailored to registry changes. If malicious, disabling the firewall can expose the system to a variety of network attacks, making it critical to monitor such behavior. Importantly, this detection does NOT confirm that malicious activity has occurred on its own; it identifies potential configurations that might facilitate such activity.

  ### Investigation Steps

  - **Review Registry Change Events**: Inspect Windows Security Event ID 4657 to confirm modification of registry values for `SOFTWARE\Policies\Microsoft\WindowsFirewall\*`. Verify that `EnableFirewall` changes to 0 correspond to user actions or known policy updates.

  - **Correlate User Actions**: Check for Event ID 4688 (Process Creation) to identify any related processes that might have run before the registry change. Elevation requests or scripts (e.g., PowerShell or batch files) could indicate unauthorized attempts to disable defenses.

  - **Identify Unauthorized Change Patterns**: Look for multiple instances of registry changes around a similar timestamp in Windows Event ID 4657. Frequent changes may indicate a scripted or automated effort to alter settings maliciously.

  - **Determine Expected Behavior**: Compare the registry values of affected systems against organizational baselines. Systems should ideally retain `EnableFirewall` set to 1. Any deviations should trigger further inquiry into recent administrative activities.

  - **Check for Malicious Indicators**: Validate the process creating the registry modification against known indicators of compromise (IOCs). Use endpoint detection tools to match process hashes against threat intelligence databases.

  ### Prioritization

  The alert's severity is medium due to the potential impact on system security, especially if the affected asset is critical to network operations. The likelihood of malicious abuse is moderate, as attackers frequently exploit disabled defenses during exploitation phases. This technique is common in various attacks, emphasizing the need for vigilance.

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion techniques, such as attackers using legitimate tools or administrative privileges to alter the registry without triggering alerts. Reliable detection requires monitoring of registry changes and ensuring full logging of relevant event IDs. Legitimate administrative actions, including policy updates or system configuration changes by IT staff, might also trigger this alert. A companion rule to consider is monitoring for registry modifications associated with remediation or malicious intent, such as sudden changes in software security settings, enhancing overall detection coverage.

