note: |
  ### Technical Context

  This rule detects changes to the "TracingDisabled" registry key, specifically when it is set to enable ETW (Event Tracing for Windows) logging for the Service Control Manager (SCM) process. Attackers may aim to disable this logging as part of their persistence strategy, allowing them to evade detection while conducting malicious activities or maintaining access. This behavior aligns with MITRE ATT&CK technique T1112 (Modify Registry) and T1685 (Disable or Modify System Logs). The primary telemetry sources for this detection are Windows registry change logs, specifically targeting the registry path associated with SCM.

  If malicious, the modification of this key could significantly impair the ability to monitor and respond to unauthorized activity on the target system. It's crucial to note that this detection alone does not confirm malicious intent; legitimate administrative actions, such as system configuration changes, may also trigger alerts.

  ### Investigation Steps

  - **Verify the registry change time:** Check the timestamp of the registry modification in the Windows Registry (Registry Event ID: 4657). Compare it against known user activity and system events to assess if the timing aligns with legitimate administrative actions or if it appears anomalous.

  - **Examine user account activity:** Review the Security Event logs (Event ID: 4624) to identify the user account responsible for the registry change. Look for accounts with elevated permissions and see if this aligns with typical administrative access patterns.

  - **Investigate service behavior:** Check the status and behavior of SCM and its related services using Services management (get-service). Ensure that these services are running normally and have not been stopped or altered unexpectedly.

  - **Check for related registry changes:** Look for other registry modifications around the same time, particularly in the Tracing or logging keys. This may indicate a broader intent to evade detection across multiple services and processes.

  - **Review recent administrative actions:** Compile a list of recent administrative logins and actions taken on the system to evaluate if changes to registry keys correlate with expected management tasks or if they are indicative of malicious activity.

  - **Identify known benign modifications:** Document legitimate scenarios that involve changes to the "TracingDisabled" key from compliance or security-related updates. Cross-reference recent changes against this list to highlight potential false positives.

  ### Prioritization

  Given the potential impact on monitoring and the likelihood for attackers to leverage registry modifications as an evasion technique, this alert should be prioritized as low to moderate severity. Given that disabling ETW logging is a known tactic for reducing the ability to audit events, it warrants timely investigation, especially in sensitive environments.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive logging configurations or if event logging is disabled on the host system. Legitimate activities such as system updates or maintenance tasks might trigger this alert, leading to false positives. A related detection that complements this coverage is monitoring for suspicious service status changes or unexpected registry access patterns to enhance context around the potential malicious modification.

