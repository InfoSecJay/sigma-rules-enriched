detection:
  selection:
    TargetObject|contains:
    - '\PsExec'
    - '\ProcDump'
    - '\Handle'
    - '\LiveKd'
    - '\Process Explorer'
    - '\PsLoglist'
    - '\PsPasswd'
    - '\Active Directory Explorer'
    TargetObject|endswith: '\EulaAccepted'
  filter_main_image_names:
    Image|endswith:
    - '\PsExec.exe'
    - '\PsExec64.exe'
    - '\PsExec64a.exe'
    - '\procdump.exe'
    - '\procdump64.exe'
    - '\procdump64a.exe'
    - '\handle.exe'
    - '\handle64.exe'
    - '\handle64a.exe'
    - '\livekd.exe'
    - '\livekd64.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\procexp64a.exe'
    - '\psloglist.exe'
    - '\psloglist64.exe'
    - '\psloglist64a.exe'
    - '\pspasswd.exe'
    - '\pspasswd64.exe'
    - '\pspasswd64a.exe'
    - '\ADExplorer.exe'
    - '\ADExplorer64.exe'
    - '\ADExplorer64a.exe'
