logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains:
    - '\PsExec'
    - '\ProcDump'
    - '\Handle'
    - '\LiveKd'
    - '\Process Explorer'
    - '\PsLoglist'
    - '\PsPasswd'
    - '\Active Directory Explorer'
    TargetObject|endswith: '\EulaAccepted'
  filter_main_image_names:
    Image|endswith:
    - '\PsExec.exe'
    - '\PsExec64.exe'
    - '\procdump.exe'
    - '\procdump64.exe'
    - '\handle.exe'
    - '\handle64.exe'
    - '\livekd.exe'
    - '\livekd64.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\psloglist.exe'
    - '\psloglist64.exe'
    - '\pspasswd.exe'
    - '\pspasswd64.exe'
    - '\ADExplorer.exe'
    - '\ADExplorer64.exe'
  filter_optional_null:
    Image:          # Race condition with some logging tools
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies activity related to the use of renamed Sysinternals tools, specifically focusing on instances where non-Sysinternals tools are setting the "accepteula" registry key that is typically set during the execution of legitimate Sysinternals utilities. Attackers may utilize these tools, such as PsExec, ProcDump, and others, to perform malicious actions while attempting to obfuscate their behavior by renaming these utilities. The primary objective of such tactics includes establishing persistence, executing remote commands, or exfiltrating sensitive information.

  The rule aligns with the MITRE ATT&CK framework under the following tactics and techniques:
  - **Resource Development (TA0042)**: The act of creating or renaming tools to avoid detection falls under this tactic, specifically technique **T1588.002** (Tools: Legitimate Tools).

  Primary data sources that provide evidence relevant to this detection include:
  - Windows Registry logs, particularly monitoring changes to the registry keys indicating acceptance of EULAs.
  - Process creation logs to track the execution of potentially renamed Sysinternals tools.

  ### Investigation Steps
  - **Review Registry Changes**: Examine Windows Registry logs for modifications to the "EulaAccepted" keys linked to Sysinternals tools. Identify the associated application names and user accounts involved in these changes.
  - **Analyze Process Creation Events**: Correlate registry modifications with process creation events to verify if there are instances where non-Sysinternals tools were executed alongside these registry changes.
  - **Investigate Network Activity**: Check for any unusual outbound network connections from systems where these tools were used. Analyze traffic patterns that may indicate data exfiltration or remote command execution.
  - **Conduct User Behavior Analysis**: Evaluate the context of user account activity surrounding the behaviors observed. Look for abnormal access patterns or unusual privilege levels that may suggest malicious intent.

  ### Prioritization
  The alert's severity is classified as high due to the potential impact on enterprise environments, as the misuse of tools like PsExec could facilitate lateral movement, data compromise, or other nefarious activities. The likelihood of this occurring is substantial, especially in environments where administrative tools are commonly employed.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if the tools are heavily obfuscated or if logs are not sufficiently retained for historical analysis. The detection logic assumes the presence of proper logging configurations to capture registry modifications and process creation events effectively. Without such settings, the rule may lead to false negatives or inability to trace the malicious activity effectively. Additional configurations may be needed to capture thorough details around registry events, specifically related to user actions and application execution patterns.

