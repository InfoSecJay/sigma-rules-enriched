logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|contains:
    - '\PsExec'
    - '\ProcDump'
    - '\Handle'
    - '\LiveKd'
    - '\Process Explorer'
    - '\PsLoglist'
    - '\PsPasswd'
    - '\Active Directory Explorer'
    TargetObject|endswith: '\EulaAccepted'
  filter_main_image_names:
    Image|endswith:
    - '\PsExec.exe'
    - '\PsExec64.exe'
    - '\procdump.exe'
    - '\procdump64.exe'
    - '\handle.exe'
    - '\handle64.exe'
    - '\livekd.exe'
    - '\livekd64.exe'
    - '\procexp.exe'
    - '\procexp64.exe'
    - '\psloglist.exe'
    - '\psloglist64.exe'
    - '\pspasswd.exe'
    - '\pspasswd64.exe'
    - '\ADExplorer.exe'
    - '\ADExplorer64.exe'
  filter_optional_null:
    Image:          # Race condition with some logging tools
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects the modification of the "EulaAccepted" registry key by non-Sysinternals tools, which typically indicates that Sysinternals utilities are being used to execute tasks requiring elevated privileges. The intent behind this behavior is often malicious, as attackers frequently leverage Sysinternals tools like PsExec to facilitate lateral movement or privilege escalation in a compromised environment. Relevant MITRE ATT&CK tactics and techniques include "Resource Development" (TA0042) and "Malware" (T1588.002).

  Primary telemetry sources include Windows Registry event logs related to registry modifications specifically, the Registry Set logs. If this behavior is malicious, it can signify an unauthorized tool being used to execute code on target systems, increasing the risk of further exploitation or compromise. However, it is important to note that this detection does NOT confirm malicious activity on its own, as it could also represent legitimate administrative usage in controlled environments.

  ### Investigation Steps

  - **Check the source of the registry modification:** Review Security Event ID 4657 (Registry Value Modified) or Windows Event Log for Registry Set events to identify the process making the change. Look for process names that are unexpected compared to legitimate Sysinternals tools.

  - **Identify related processes:** Analyze Security Event ID 4688 (Process Created) logs to correlate the execution of any detected processes (e.g., PsExec.exe) around the time of the registry change. Verify if any high-risk processes or scripts were executed concurrently.

  - **Assess user context:** Examine the user accounts involved in the actions. Check for anomalous or service accounts executing these tools outside of standard administrative workflows.

  - **Understand legitimate usage:** Review internal documentation on the sanctioned usage of Sysinternals tools, detailing what typical operational usage looks like and identifying authorized personnel who might be registered to utilize these tools.

  - **Correlate with common attack patterns:** Reference the historical usage of Sysinternals tools in your environment, correlating any recorded malicious behavior with similar registry key modifications observed in this alert.

  - **Look for additional indicators of compromise:** Search for related behavioral patterns such as data exfiltration activity, specifically any evidence captured via file creation or network activity tied to the execution of these processes.

  ### Prioritization

  This alert is of high severity due to the potential for elevated privileges associated with Sysinternals tools, which are commonly exploited by attackers for lateral movement and post-exploitation tasks. The likelihood of malicious abuse is significant, as many instances of targeted attacks have made use of these utilities as a mechanism to execute commands remotely.

  ### Blind Spots and Assumptions

  Detection may be limited by oversight of legitimate administrative activities, where authorized personnel use these tools for standard operations. It depends on having proper logging configurations for registry modifications enabled. Legitimate activities that might trigger the alert include sanctioned troubleshooting or system maintenance tasks performed by IT staff. A related detection that strengthens coverage could involve tracking direct network connections initiated by tools like PsExec, thereby linking the registry modifications to network intrusion.

