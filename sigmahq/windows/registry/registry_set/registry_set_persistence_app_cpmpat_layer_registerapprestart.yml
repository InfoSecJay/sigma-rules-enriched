title: Potential Persistence Via AppCompat RegisterAppRestart Layer
id: b86852fb-4c77-48f9-8519-eb1b2c308b59
status: test
description: |
  Detects the setting of the REGISTERAPPRESTART compatibility layer on an application.
  This compatibility layer allows an application to register for restart using the "RegisterApplicationRestart" API.
  This can be potentially abused as a persistence mechanism.
references:
- https://github.com/nasbench/Misc-Research/blob/d114d6a5e0a437d3818e492ef9864367152543e7/Other/Persistence-Via-RegisterAppRestart-Shim.md
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-01-01
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.011
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\'
    Details|contains: 'REGISTERAPPRESTART'
  condition: selection
falsepositives:
- Legitimate applications making use of this feature for compatibility reasons
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the modification of the Windows registry to set the `REGISTERAPPRESTART` compatibility layer for applications. This behavior can be indicative of an attacker establishing persistence on a compromised system by registering their malicious application to restart automatically, thus maintaining access even after reboots. The relevant MITRE ATT&CK techniques are Persistence via Application Layer Restart (T1546.011) and Privilege Escalation from this mechanism. Primary telemetry sources include Windows registry event logs and the specific registry path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\`. If malicious, this could allow adversaries to bypass security controls and re-establish their presence on a targeted machine. This detection does NOT confirm that unauthorized access is currently occurring or that the application in question is inherently malicious.

  ### Investigation Steps

  - **Check recent registry changes:** Review Registry Event ID 4657 for modifications to `TargetObject` containing `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\` with `Details` indicating `REGISTERAPPRESTART`. Identify the user account responsible for the change and assess if it was legitimate.

  - **Correlate application behavior:** Determine if the application linked to the registry modification is known to utilize `REGISTERAPPRESTART` legitimately. Valid applications may include common software like browsers or productivity tools, especially if there are no unusual permissions assigned.

  - **Identify unauthorized applications:** Look for application names or paths that deviate from standard system applications. Malicious entries may have unique or obfuscated names, and you should investigate unusual directory paths, particularly those outside of `C:\Program Files` or `C:\Windows`.

  - **Assess scheduled tasks or startup impacts:** Examine Windows Task Scheduler (Event ID 4698) for any new tasks created around the same time as the registry change, as this can indicate malicious persistence mechanisms being established.

  - **Review event logs for execution:** Check Sysmon Event ID 1 for process creation related to the application modifying the registry. Focus on command-line arguments that may indicate malicious behavior.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact on system integrity if an adversary establishes persistence. While not a common exploitation vector, the use of application restart registration can be weaponized by advanced threat actors for long-term access.

  ### Blind Spots and Assumptions

  Detections may be limited by the absence of logging configurations that capture all registry modifications comprehensively; systems must have sufficient logging enabled. Legitimate software may trigger this detection when employing the feature for compatibility, but frequent use by uncommon applications can raise suspicion. Companion detections, such as monitoring for unusual service installations (e.g., Service Creation - T1050), can enhance visibility and coverage against persistence attempts.

