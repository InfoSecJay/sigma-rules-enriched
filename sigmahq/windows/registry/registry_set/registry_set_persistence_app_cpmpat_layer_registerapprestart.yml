  ### Technical Context

  This Sigma rule detects the manipulation of Windows registry settings related to application compatibility, specifically the activation of the "REGISTERAPPRESTART" setting. This behavior may indicate that an attacker is attempting to establish persistence within a compromised system by ensuring that an application can automatically restart after being terminated. The relevant MITRE ATT&CK tactics include Persistence (TA0003) and Privilege Escalation (TA0004), specifically under technique T1546.011, which targets application compatibility features to maintain an adversary's access.

  The primary telemetry sources are Windows registry changes, specifically targeting the registry path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\`. If malicious, such unauthorized modifications could lead to sustained access to the system, enabling attackers to launch their tools or payloads upon system or user session reboots. However, it is critical to note that this detection alone does NOT confirm malicious intent, as legitimate applications may also employ this mechanism for valid compatibility purposes.

  ---

  ### Investigation Steps

  - **Review registry modifications: ** Check for entries at `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\`. Focus on new or unusual entries related to sensitive applications; reference Event ID 4657 for registry modifications.

  - **Correlate application execution history: ** Use Sysmon logs (Event ID 1) to determine if the application associated with the registry entry started without user interaction. Confirm the command line used and check for unexpected execution patterns.

  - **Analyze application behavior: ** Validate if the modified application is registered for restart without user actions by searching for Windows Event Log (Event ID 1074) that indicates application shutdowns followed by restarts. Compare expected behavior of legitimate applications that use this feature.

  - **Identify potentially malicious entries: ** Look for registry keys associated with known malicious applications or scripts. Use threat intelligence or a reputable hash database to verify if the application is suspicious or has been used in prior attacks.

  - **Cross-reference against installed software: ** Ensure the application linked to "REGISTERAPPRESTART" is legitimate and installed on the system using the installed programs list (`Get-WmiObject -Class Win32_Product` in PowerShell).

  - **Monitor for suspicious behavior in the affected app: ** Create a baseline of normal application usage and watch for any anomalies like repeated restarts or error logs in the Application Log indicating issues originating from this application.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential for establishing persistent footholds on systems, impacting critical assets. The likelihood of exploitation is moderate as the technique can be weaponized, but it often depends on other factors, such as the context of the application involved and its known behavior.

  ---

  ### Blind Spots and Assumptions

  The detection may miss scenarios where attackers use similar techniques without invoking the "REGISTERAPPRESTART" setting or where more sophisticated evasion tactics are employed, such as modifying other compatibility settings. It is also critical to ensure the necessary logging for registry changes are enabled for comprehensive monitoring. Legitimate software, particularly older distributions or those needing frequent restarts, may trigger the rule, leading to potential false positives. A related detection would be monitoring for suspicious application executions tied to the "AppCompatFlags" modifications, which can enhance understanding and context around potential malicious actions.

