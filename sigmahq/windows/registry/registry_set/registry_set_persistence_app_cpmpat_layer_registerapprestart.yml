title: Potential Persistence Via AppCompat RegisterAppRestart Layer
id: b86852fb-4c77-48f9-8519-eb1b2c308b59
status: test
description: |
  Detects the setting of the REGISTERAPPRESTART compatibility layer on an application.
  This compatibility layer allows an application to register for restart using the "RegisterApplicationRestart" API.
  This can be potentially abused as a persistence mechanism.
references:
- https://github.com/nasbench/Misc-Research/blob/d114d6a5e0a437d3818e492ef9864367152543e7/Other/Persistence-Via-RegisterAppRestart-Shim.md
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-01-01
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.011
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\'
    Details|contains: 'REGISTERAPPRESTART'
  condition: selection
falsepositives:
- Legitimate applications making use of this feature for compatibility reasons
level: medium
note: |
  ### Technical Context
  This rule is designed to detect modifications to the Windows Registry that enable the AppCompat "RegisterApplicationRestart" feature for applications. The ability for applications to register for restart can be exploited by attackers to establish persistence on compromised systems. By leveraging this feature, an attacker may ensure their malicious application restarts upon system reboots or application terminations, making it a potential persistence mechanism.

  The likely attacker objective is to maintain continued access to a compromised system, ultimately enabling further exploitation or data exfiltration. This activity is relevant to the MITRE ATT&CK framework under the tactics of Persistence (T1546) and Privilege Escalation (T1546.011), where attackers manipulate legitimate functionality in Windows to achieve their goals.

  The primary data sources relevant to this detection include Windows Registry logs, particularly those capturing changes or accesses to the specific registry path "/SOFTWARE/Microsoft/Windows NT/CurrentVersion/AppCompatFlags/Layers/". Additionally, process creation events may provide context on the applications utilizing this registry modification.

  ### Investigation Steps
  - **Review Registry Changes:** Investigate the Windows Registry to identify recent modifications to the key "\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers\". Look for entries that involve "REGISTERAPPRESTART" to determine the applications affected.

  - **Analyze Process Creation Events:** Check for any process creation events around the same time as the registry modification. Pay attention to any new or unexpected applications that may be leveraging the AppCompat flag for unauthorized persistence.

  - **Correlate with Other Logs:** Cross-reference the findings with EDR logs or other system telemetry for additional indicators of compromise, such as unusual application behavior or connections initiated by the affected applications following registration.

  - **Assess Legitimate Use Cases:** Determine if the applications affected by this registry entry are legitimate software in use within the environment. Document any business justification for their application restart registration to assess the potential risk accurately.

  ### Prioritization
  The alert is marked as medium severity due to the potential impact of persistence mechanisms being employed by attackers. Given the likelihood of exploitation in enterprise environments, especially if the applications involved are sensitive or critical, timely investigation is crucial.

  ### Blind Spots and Assumptions
  This detection may miss scenarios where attackers utilize alternate methods for persistence or where legitimate applications validly use the "RegisterApplicationRestart" feature without affecting security. The detection logic assumes that relevant registry access is logged and that alerts for such changes are properly configured. If registry auditing is not enabled or comprehensively implemented, detection may fail, leading to security gaps.

