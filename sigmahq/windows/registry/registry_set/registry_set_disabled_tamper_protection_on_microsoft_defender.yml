logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows Defender\Features\TamperProtection'
    Details: DWORD (0x00000000)
  filter_msmpeng_client:   # only disabled temporarily during updates
    Image|startswith: 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    Image|endswith: '\MsMpEng.exe'
  filter_msmpeng_domain_controller:   # only disabled temporarily during updates
    Image: 'C:\Program Files\Windows Defender\MsMpEng.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the disabling of Tamper Protection in Windows Defender, a security feature designed to prevent unauthorized modification of antivirus settings. By disabling this function, attackers may attempt to weaken the defenses of a system to facilitate malicious activities, such as deploying malware without detection. The likely objective of an attacker disabling Tamper Protection would be to establish persistence or to install additional tools that could compromise the integrity of the system.

  The rule correlates with the MITRE ATT&CK framework, specifically under the tactics of Defense Evasion and the technique T1562.001: Disable or Modify Tools. This technique encompasses actions where an adversary may attempt to disable security mechanisms to evade detection and maintain control over the system. The primary data sources for this detection rule are registry modifications, specifically related to the Windows Defender settings.

  ### Investigation Steps
  - **Review Registry Changes**: Inspect the Windows registry for changes to the Tamper Protection settings, particularly under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Features\TamperProtection`.
  - **Assess Process Activity**: Analyze the process creation logs to verify if `MsMpEng.exe` was running during the time the Tamper Protection was disabled, confirming whether it aligns with expected behavior or indicates malicious activity.
  - **Correlate with User Activity**: Examine user activity logs or account login events around the time of the Tamper Protection modification to determine if unauthorized access occurred.
  - **Inspect for Additional Indicators**: Look for other signs of potential compromise or tools that may have been installed post-disablement, such as unusual file modifications or network connections.

  ### Prioritization
  This alert should be viewed with medium severity due to the potential impact of disabling a critical security feature like Tamper Protection. In an enterprise environment, an unauthorized modification can significantly increase the risk of malware infection and compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for scenarios where Tamper Protection is disabled through legitimate means, such as during updates or administrative changes approved by IT. The detection logic assumes that the disabling of Tamper Protection should not occur outside of these authorized contexts. Required logs include detailed registry modification events, and configurations must ensure that Windows Defender is properly logging these changes for the detection rule to be effective.

