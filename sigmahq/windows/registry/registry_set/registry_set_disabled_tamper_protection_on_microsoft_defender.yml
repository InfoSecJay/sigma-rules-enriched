note: |
  ### Technical Context

  This rule detects the disabling of Tamper Protection in Windows Defender, specifically targeting registry changes that set Tamper Protection to DWORD (0x00000000). The likely objective of an attacker triggering this behavior is to disable a critical security feature, allowing for the undetected execution of malicious activities such as installing malware or changing security policies. Relevant MITRE ATT&CK tactics include defense evasion (T1562.001) due to the disabling of security measures. The primary telemetry source is Windows registry changes, particularly under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Features\TamperProtection`. If Malicious, this action significantly increases the organization's vulnerability to attack. However, it is crucial to note that this detection alone does not confirm that an adversary is present or actively exploiting the system.

  ### Investigation Steps

  - **Check Registry Key Change:** Review the registry path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Features\TamperProtection` for a value of `DWORD: 0x00000000`. If present, assess when the change occurred and if it aligns with unauthorized changes.

  - **Verify Process Execution:** Investigate recent processes in the Windows Security Event Log (Event ID 4688) for any executions of `MsMpEng.exe` around the same timestamp as the registry change, particularly for non-standard execution paths which can indicate malicious behavior.

  - **Identify Recurring Patterns:** Examine the frequency of this registry modification through Event ID 4657 (Registry Value Modified). Legitimate maintenance tasks or updates often have periodic modifications; a continuous or abnormal pattern may indicate malicious intent.

  - **Compare Against Known Good Configurations:** For baseline assessment, compare current registry settings against known good configurations for the environment. This helps differentiate between legitimate security policy updates and potential tampering.

  - **Monitor for Follow-On Malicious Activity:** Check logs for subsequent security events, especially related to malware detection or system integrity failures, as they may signify exploitation attempts following tamper protection being disabled.

  - **Assess Asset Role and Importance:** Review the impacted system’s role and criticality. If the system is part of a sensitive infrastructure or critical service, prioritize investigation and response actions accordingly.

  ### Prioritization

  This alert is medium severity due to the potential impact on the security posture of the organization. The disabling of Tamper Protection can significantly increase the chance of successful malware installation and system compromise. Given that this behavior is frequently associated with exploitation attempts, it warrants prompt investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate system maintenance or updates may trigger this alert, leading to false positives. Required log sources for reliable detection include a combination of registry audit logs and Windows Event Logs for process creation. Additionally, legitimate administrative actions, such as software updates or installations, could inadvertently disable this feature. A related detection might involve monitoring for unusual process execution associated with known threat actors, which can strengthen overall detection capability against exploitation attempts.

