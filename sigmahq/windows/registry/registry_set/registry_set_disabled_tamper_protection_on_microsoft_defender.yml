note: |
  ### Technical Context

  This Sigma rule detects instances where Windows Defender's Tamper Protection feature is disabled. Tamper Protection is a security measure designed to prevent unauthorized changes to security settings by malware or attackers. The likely attacker objective is to disable endpoint protection mechanisms to facilitate further exploitation, such as deploying malware or performing lateral movement within a network. This activity correlates with the MITRE ATT&CK techniques for defense evasion, specifically T1562.001 (Disable or Modify Tools).

  The primary telemetry sources for this detection are Windows Registry changes, specifically targeting the path related to Tamper Protection settings. If malicious, disabling this feature can leave systems vulnerable to malware infections or unauthorized access. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate administrative actions or maintenance tasks may trigger the same event.

  ### Investigation Steps

  - **Review Registry Changes:** Check Windows Registry for Event ID 4657 to confirm changes to the key: `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows Defender\Features\TamperProtection`. Look for a `DWORD` value of `0` indicating Tamper Protection is disabled.

  - **Validate Process Context:** Identify if the disabling process was initiated by `MsMpEng.exe`. Check the command line and parent process for unusual activity using Sysmon Event ID 1 and correlate with Event ID 4688 to ensure it originates from a legitimate source.

  - **Examine User and System Context:** Analyze log-in details at the time of change via Windows Security Event IDs 4624 (Logon) to ensure that only authorized users had access to modify the setting. Look for any unusual account activity.

  - **Identify Legitimate Administrative Actions:** Compare recent administrative tasks or updates from IT on endpoint protection relevance within change request logs to confirm if any authorized tasks coincide with the disabling of Tamper Protection.

  - **Cross-Reference Threat Intelligence:** Utilize threat intelligence sources to check for known malware families that target Windows Defender. For instance, if a recent strain of malware is reported to disable Tamper Protection, link any observed patterns.

  ### Prioritization

  The alert is of medium severity, given that the disabling of Tamper Protection directly impacts endpoint security. Although not necessarily indicative of immediate malicious activity, it demonstrates a potential foothold for adversaries, particularly if coupled with further evidence of exploitation. This behavior is known to be weaponized by various attack vectors, necessitating quick verification.

  ### Blind Spots and Assumptions

  The detection may be circumvented by attackers who use scripts or tools to change registry settings without triggering alerts. Continuous monitoring of registry changes across all endpoints is required for reliable detection. Legitimate administrative tasks, such as system updates or maintenance, may also trigger this alert. A related detection is monitoring for sudden spikes in registry changes that may indicate widespread tampering across multiple systems, strengthening overall coverage against similar threats.

