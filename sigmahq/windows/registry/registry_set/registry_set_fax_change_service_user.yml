note: |
  ### Technical Context

  This Sigma rule detects unauthorized changes to the user account associated with the FAX service, specifically targeting modifications to the registry setting `HKLM\System\CurrentControlSet\Services\Fax\ObjectName`. This behavior may be indicative of an attacker attempting to escalate privileges or perform lateral movement by leveraging the FAX service for malicious purposes. The detected activity aligns with the MITRE ATT&CK technique for Invalid Account (T1112), where an adversary seeks to manipulate service accounts for unauthorized access or control.

  Primary telemetry sources include Windows Registry logs capturing changes to service configurations. If successful, this behavior can lead to system compromise and enable attackers to execute further malicious actions without raising alarms. It is essential to note that this detection does NOT confirm malicious intent on its own; legitimate administrative changes may also trigger this alert.

  ### Investigation Steps

  - **Review recent registry changes**: Investigate Event ID 4657 (Registry value modified) for entries matching `HKLM\System\CurrentControlSet\Services\Fax\ObjectName`. Look for a change that was made along with timestamps and user accounts involved for indication of legitimacy.

  - **Identify expected behavior for the FAX service**: The FAX service typically runs under the `NetworkService` account. Any changes to this setting that assign it to a different user can be a red flag.

  - **Correlate with logon events**: Check for Security Event ID 4624 (An account was successfully logged on) around the same timestamp to see if other logon events correlate with the change. Unusual logins from non-administrative accounts could indicate malicious activity.

  - **Audit for additional service changes**: Examine Windows Service Control Manager logs (Event ID 7045) for any concurrent or recent modifications to the FAX service or other related services which may suggest an attempt to alter service behaviors collectively.

  - **Examine user permission changes**: Verify if there have been any changes to user permissions or group memberships (Event ID 4728/4729) that correlate with the alteration of the FAX service account, which may hint at wider privilege escalation.

  ### Prioritization

  This alert is considered high severity due to the potential impact of unauthorized changes to service accounts, which can facilitate lateral movement and privilege escalation within the enterprise environment. The risk of such behavior being weaponized is significant, as vulnerable services are common targets for adversaries seeking to exploit system weaknesses.

  ### Blind Spots and Assumptions

  Detection may be limited by the logging configuration on endpoints. If relevant logs are not retained or are filtered, this detection could be missed. Legitimate administrative activities, such as routine service reconfigurations, can generate false positives. A related detection to bolster coverage would be monitoring for service account modifications across multiple services or correlating with abnormal Windows Event Log patterns to strengthen identification of potential threats.

