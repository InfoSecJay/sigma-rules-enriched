note: |
  ### Technical Context
  This detection rule identifies changes made to the user account associated with the Fax service in Windows systems. More specifically, it targets alterations in the registry that link the Fax service to the "NetworkService" account, typically used for service accounts in Windows environments. Attackers may exploit this service to elevate privileges or execute lateral movement techniques within the network, potentially compromising sensitive information sent via fax or pivoting to more critical systems.

  The likely attacker objective is to gain unauthorized access or maintain persistence by leveraging a service account that may not be closely monitored. This activity can fall under the MITRE ATT&CK tactics of persistence (T1050) and defense evasion (T1112: Modify Registry). These techniques are often employed by threat actors to maintain control over systems while evading detection mechanisms.

  Primary data sources for evidence collection include Windows Registry logs, specifically targeting the registry path `HKLM\System\CurrentControlSet\Services\Fax\ObjectName`. Monitoring these changes can reveal potentially malicious alterations that could indicate an ongoing attack or compromise.

  ### Investigation Steps
  - **Review Registry Changes:** Analyze the Windows Registry for any modifications to the `HKLM\System\CurrentControlSet\Services\Fax\ObjectName` path. Look for unexpected user accounts replacing the default service account.

  - **Audit Service Account Usage:** Investigate the usage of the Fax service, including monitoring event logs to trace the history of service account authentications and connections.

  - **Check Related Processes:** Examine process creation events to identify any suspicious processes that may have been initiated by changes made to the Fax service's associated user account.

  - **Correlation with Other Logs:** Cross-reference findings with Windows Security logs, focusing on events related to user account changes and any elevation of privileges that may coincide with the detection.

  ### Prioritization
  This alert is considered high severity due to its implications for privilege escalation and potential lateral movement. Unauthorized modifications to service accounts can lead to significant risks, including unauthorized access to sensitive data and broader network compromise.

  ### Blind Spots and Assumptions
  This detection logic may miss changes made directly through other means, such as scripting or direct registry manipulation not captured by standard logging practices. It assumes that logs capturing registry changes are enabled and retained. Additionally, the alert may have false positives associated with legitimate administrative activities, particularly in dynamic environments where service configurations are frequently adjusted. Regular audits and consistent logging configurations are required for effective detection.

