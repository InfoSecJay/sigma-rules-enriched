  ---

  ### Technical Context

  This rule detects changes to the user account associated with the FAX service from the default value to a potentially unauthorized account. Attackers may leverage such changes to escalate privileges or establish persistence on a compromised system. The relevant MITRE ATT&CK tactic is Persistence, and the technique is T1112 (Modification of Registry). The primary telemetry source for this detection is Windows Registry auditing, specifically monitoring changes to `HKLM\System\CurrentControlSet\Services\Fax\ObjectName`. If malicious, this could lead to unauthorized access or control over the FAX service, enabling further exploitation. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative actions may also result in similar registry modifications.

  ---

  ### Investigation Steps

  - **Check for changes to the FAX service account:** Review Windows Registry logs for Event ID 4608 or System log for modifications to `HKLM\System\CurrentControlSet\Services\Fax\ObjectName`, noting prior values and timestamps to assess the legitimacy of the change.

  - **Assess the user account involved:** Verify the user account set for the FAX service by cross-referencing with the Active Directory (AD) users (use ADSI or PowerShell cmdlets). Look for known administrative accounts versus common user accounts that shouldn't have service privileges.

  - **Identify recent logon activity:** Analyze Security Event Log for Event ID 4624 (logon events) and look for logins associated with the new account. Legitimacy indicators include logons during normal business hours and access from recognized IP addresses or devices.

  - **Evaluate the FAX service role:** Determine if the FAX server is critical to business operations. If so, elevated scrutiny is required on any configuration changes to understand potential impact on business continuity.

  - **Correlate with lateral movement:** Review for lateral movement indicators such as Event ID 4688 (process creation) or Event ID 4657 (registry value modified) to see if the account change occurred alongside suspicious commands that may illustrate an attacker's lateral movement tactics.

  - **Validate service file interactions:** Check for any recent activity with the FAX service executable or associated files, which may indicate that the service has been manipulated or used for malicious purposes. Look for file creation and access logs in `%SystemRoot%\System32`.

  ---

  ### Prioritization

  The alert has a high severity due to the critical functionality of the FAX service and its manipulation within an enterprise environment. Unauthorized changes could indicate malicious behavior aimed at gaining persistence or control within the network. This behavior is not commonly benign and can be part of known lateral movement techniques.

  ---

  ### Blind Spots and Assumptions

  This detection may be bypassed if attackers utilize legitimate administrative actions or scheduled tasks to change service configurations without raising flags. The appropriate Windows Registry auditing must be enabled to capture changes effectively. Legitimate administrative actions, such as service reconfiguration by IT staff, may also trigger this alert. A related detection includes monitoring for unusual service configurations or interactions as a companion alert to enrich context and mitigate false positives.

