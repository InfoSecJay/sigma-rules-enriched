  ### Technical Context

  This Sigma rule detects changes to the user account associated with the FAX service in Windows, specifically when it is set to an unauthorized account instead of the default "NetworkService." The likely attacker objective is to escalate privileges or establish persistence by altering service credentials, which could facilitate lateral movement or the execution of malicious payloads under a higher-privileged context. This behavior corresponds with the MITRE ATT&CK technique "Service Registry Permissions Weakness" (T1112).

  Primary telemetry sources include Windows Registry change logs, specifically focusing on Event ID 4657 (Registry value modified) for the path `HKLM\System\CurrentControlSet\Services\Fax\ObjectName`. If an unauthorized account is detected as associated with this service, it poses a significant security risk, potentially enabling attackers to exploit the FAX service for data exfiltration or further compromise. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative changes could also trigger this alert.

  ### Investigation Steps

  - **Check recent registry modifications**: Review Security Event ID 4657 for changes to `HKLM\System\CurrentControlSet\Services\Fax\ObjectName`. Look for entries where values point to accounts other than "NetworkService."

  - **Identify account changes**: Compare the detected account against known service accounts within your environment. If the account is unfamiliar or lacks expected permissions, it may indicate malicious activity.

  - **Examine service status and configurations**: Use the command `Get-Service Fax` in PowerShell to verify the current service user account and its startup type. Legitimate configurations should typically use "NetworkService" for the FAX service.

  - **Investigate login and user activity**: Cross-reference user login timestamps with Windows Security Event IDs 4624 (successful logon) to validate if the account change coincides with unusual login patterns or timeframes.

  - **Validate host role**: Determine if the host running the FAX service has critical functionalities in the enterprise—such as handling sensitive documents—as this can elevate the severity of the incident.

  - **Review historical changes**: Analyze the registry change history for `HKLM\System\CurrentControlSet\Services\Fax\ObjectName` using System Events or relevant Windows Auditing configurations for patterns or repeated changes that might indicate a campaign of persistence attempts.

  ### Prioritization

  This alert should be treated with high severity due to its potential impact on critical services that could be exploited for privilege escalation and lateral movement. The likelihood of malicious exploitation is significant, as changing service accounts is a common tactic employed by attackers to gain control of services for further actions.

  ### Blind Spots and Assumptions

  Detection accuracy is limited by the completeness of registry auditing configuration; without proper logging, these changes might go unnoticed. Legitimate administrative actions, such as maintenance by IT personnel, could also trigger this alert. Companion detection rules focusing on unusually high usage of the FAX service or correlated authentication patterns (like multiple logins from the modified account) will strengthen coverage and provide context for the investigation.

