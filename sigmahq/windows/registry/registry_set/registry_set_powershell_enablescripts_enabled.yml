note: |
  ### Technical Context

  This rule detects the enabling of the PowerShell script execution policy on Windows systems by monitoring for specific changes in the Windows registry. Attackers may enable this policy to execute malicious PowerShell scripts, which can be used for post-exploitation activities such as deploying malware, exfiltrating data, or maintaining persistence. This behavior is associated with the MITRE ATT&CK technique T1064 (Scripting).

  The primary telemetry source for this detection is Windows Registry logs, specifically monitoring changes to the registry path `Policies\Microsoft\Windows\PowerShell\EnableScripts`. If this setting is modified to enable script execution (DWORD value of `1`), it signifies a significant security risk, as it allows potentially malicious scripts to run unchecked. However, this detection does NOT confirm malicious intent on its own, as enabling script execution may be part of legitimate administrative activity.

  ### Investigation Steps

  - **Verify registry changes:** Access the Windows Registry and check for changes to the path `HKEY_LOCAL_MACHINE\Policies\Microsoft\Windows\PowerShell\EnableScripts`. Confirm if the value is set to `1`.
  - **Review recent PowerShell command logs:** Check Windows Event Log (Event ID 4104) for PowerShell script block logging to see if any suspicious scripts have been executed following the change.
  - **Investigate the source of the change:** Use Event ID 4663 from Security logs to identify the user or process that modified the registry key. Benign indicators may involve known administrative accounts.
  - **Check for subsequent execution of scripts:** Look for specific PowerShell command execution history (PowerShell Event IDs 400, 403, and 600) to identify any scripts executed shortly after the policy was enabled.
  - **Identify system role and criticality:** Assess if the affected system is critical (e.g., domain controllers or web servers), as modifications on such systems may expose the organization to more significant risks.
  - **Cross-check with adjacent detections:** Correlate findings with companion detection rules (e.g., detecting unusual PowerShell activity) to strengthen confidence in identifying malicious behavior.

  ### Prioritization

  This alert is considered low severity for most enterprise environments unless the affected system is critical. Although the enabling of script execution can be abused by adversaries, it might also reflect legitimate administrative actions. The likelihood of being weaponized increases if followed by any execution of suspicious scripts.

  ### Blind Spots and Assumptions

  The detection may be limited by insufficient logging configurations, as PowerShell command logs might not be enabled by default. Legitimate administrative activities, such as scheduled task updates, might trigger this alert as well. Companion detections, such as unauthorized PowerShell command executions or remote script execution logs, can enhance overall monitoring effectiveness and help mitigate false positives.

