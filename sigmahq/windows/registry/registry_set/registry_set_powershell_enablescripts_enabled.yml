note: |
  ### Technical Context
  This detection rule identifies changes to the PowerShell script execution policy within a Windows environment, specifically when the policy is enabled to allow script execution. When an attacker successfully enables this policy, they can run malicious scripts, potentially leading to a range of harmful activities such as data exfiltration, lateral movement, or the deployment of malware. Attackers often leverage PowerShell for executing payloads since it is a powerful and commonly available tool on Windows systems.

  The relevant MITRE ATT&CK tactics/techniques linked with this detection include Execution (TA0002) as it directly relates to the execution of malicious PowerShell scripts that could be used for various attacker objectives. The technique specifically applicable here is PowerShell (T1059.001), which is frequently used by threat actors to execute code remotely or local scripts. By monitoring registry changes related to PowerShell execution policies, security teams can gain insights into potentially unauthorized execution of scripts in their environment.

  Primary data sources for this detection include Windows Registry logs, which can show when and how the script execution policy was modified, and any related logs from security tools that monitor system changes within the enterprise.

  ### Investigation Steps
  - **Review Registry Changes:** Investigate the Windows Registry logs to determine when the execution policy was modified and by which user account. Look for patterns of changes that might indicate unexpected behavior.
  - **Analyze Process Creation Events:** Examine process creation events involving PowerShell executions to identify any scripts that were run after the execution policy was changed. Pay particular attention to unusual script names or paths.
  - **Correlate with User Activity Logs:** Check user activity logs to see if the account that enabled the script execution policy experienced any suspicious activities, such as logins from unusual locations or at odd times.
  - **Assess Security Alerts:** Look into other security alerts from EDR or SIEM that could correlate with the time of the policy change. This can help identify if this change is part of a larger security incident.

  ### Prioritization
  This alert is classified with low severity due to its potential for false positives, as enabling PowerShell script execution policies can occur for legitimate administrative purposes. However, in a well-guarded enterprise environment, any changes to execution policies should be scrutinized as they may indicate a precursor to more significant malicious activity.

  ### Blind Spots and Assumptions
  One of the main gaps in detection coverage is that legitimate administrative activities could trigger this alert, leading to potential false positives without a clear context. The detection logic assumes monitoring includes comprehensive registry changes and does not account for users with necessary privileges who may enable this policy for benign reasons. Furthermore, effective monitoring of this detection relies on proper logging configurations to ensure registry modifications are tracked consistently.

