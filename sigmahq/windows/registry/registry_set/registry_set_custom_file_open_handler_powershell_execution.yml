  ### Technical Context
  This detection rule identifies the execution of PowerShell commands via custom file open handlers in the Windows Registry. By monitoring the registry for creations or modifications that include the path `shell\open\command\` and an invocation of `powershell` with the `-command` parameter, the rule aims to pinpoint potential misuse by attackers, particularly those leveraging established persistence mechanisms linked to file types or extensions on compromised systems.

  The relevant threat scenario could involve an attacker using a custom file extension to manipulate the behavior of Windows file opening mechanisms, effectively turning benign file interactions into avenues for executing malicious scripts. This behavior is especially concerning as it may be indicative of techniques employed by threat actors as part of a broader campaign, such as those observed in the SolarMarker campaign. The primary MITRE ATT&CK tactics implicated here include **Defense Evasion** (TA0005) and the technique **Custom Command Line Interface** (T1202).

  For this detection, the primary data sources are Windows registry logs, which record changes to registry keys and values. This log source will provide the necessary insight into any modifications made to file open commands that may point to suspicious activity.

  ### Investigation Steps
  - **Review Registry Changes**: Check the Windows registry for new or altered entries under `HKEY_CLASSES_ROOT\*`, particularly those that relate to the `shell\open\command\` path to identify any anomalies.
  - **Analyze PowerShell Activity**: Investigate process creation logs for PowerShell instances that may correlate with the registry modification timestamps to correlate user activity with the detected behavior.
  - **Correlate with User Context**: Examine user activity logs leading up to the registry modifications to understand if the changes align with normal user behavior or if they exhibit signs of privilege escalation or unauthorized access patterns.
  - **Conduct Malware Scans**: Run a comprehensive scan with an updated antivirus solution to check for known malware that could leverage registry-based persistence or exhibit PowerShell abuse patterns.

  ### Prioritization
  The alert's severity is high due to the potential for attackers to establish persistent backdoors and execute arbitrary commands on compromised systems. Given that such behaviors can lead to extensive data breaches or ransomware deployment, timely detection and investigation are crucial.

  ### Blind Spots and Assumptions
  This detection logic may have blind spots concerning legitimate administrative activities that could result in similar registry changes, potentially leading to false positives. Additionally, the detection assumes that all relevant Windows registry logs are being properly collected and stored for analysis. For effective operation, the environment must ensure that logging for registry changes is enabled and retained. If logging configurations aren't set up correctly, the detection may miss critical artifacts necessary for thorough investigations.

