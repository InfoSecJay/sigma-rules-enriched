  ### Technical Context

  The rule detects the execution of PowerShell from a custom file open handler by monitoring for specific registry changes, particularly in the `shell\open\command` key. This behavior often signifies an adversary's attempt to establish persistence or execute malicious commands in a stealthy manner, possibly taking advantage of file association misconfigurations. The relevant MITRE ATT&CK tactic is **Defense Evasion** (ID: T1202).

  Primary telemetry sources include Windows Registry events with log types detailing changes in the registry. If malicious, this behavior can lead to unauthorized access or control over systems. However, this detection alone does not confirm malicious intent as legitimate applications may also modify the registry in a similar manner.

  ---

  ### Investigation Steps

  - **Verify registry changes:** Review Windows Registry logs (Event ID 4657) for changes to `HKEY_CLASSES_ROOT\shell\open\command`. Look for unusual entries that execute PowerShell commands.

  - **Check PowerShell activity:** Examine PowerShell logs (Event ID 4104) for any command execution that follows the custom handler being modified. Focus on commands that look suspicious or originate from unusual processes.

  - **Identify legitimate use cases:** Analyze registry keys with a similar structure to assess normal business use (e.g., associated apps). Common applications like Microsoft Office may modify the registry but typically target specific file types.

  - **Investigate parent process:** Look at process trees in Sysmon (Event ID 4688) to determine the parent process of the PowerShell execution. Legitimate processes may launch PowerShell but are often associated with known application paths.

  - **Document user and asset context:** Check asset inventory for the affected host and user who triggered the alert. Critical systems or users with elevated privileges that show suspicious registry modifications should be escalated.

  - **Look for persistence indicators:** Assess for other persistence mechanisms tied to malicious registry entries, such as newly created Scheduled Tasks (Event ID 4698) that might be set in conjunction with registry modifications.

  ---

  ### Prioritization

  This alert should be considered high severity as it involves potential manipulation of critical system configurations that can be abused for unauthorized access. The likelihood of malicious actions is significant given that this method is frequently weaponized to execute payloads without user knowledge, particularly in sophisticated attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by users who have legitimate reasons to modify file associations. If registry log sources are misconfigured or incomplete, detection may fail. Additionally, benign applications can trigger similar alerts by utilizing PowerShell for automation tasks. Companion detections, such as monitoring for unusual PowerShell script execution patterns (T1059.001), can strengthen coverage against evasion tactics.

