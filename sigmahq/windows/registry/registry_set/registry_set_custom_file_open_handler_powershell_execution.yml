  ### Technical Context

  This Sigma rule detects the execution of PowerShell script commands via a custom file open handler in the Windows registry, indicated by specific registry changes. The likely attacker objective is to establish persistence on the system while executing malicious scripts whenever a user interacts with specific file types associated with the crafted registry entries. This behavior aligns with the MITRE ATT&CK technique T1202 (Atomic Hint and Command Execution) within the Execution tactic.

  The primary telemetry sources relevant to this detection include Windows Registry logs, specifically monitoring for registry key modifications under `HKEY_CLASSES_ROOT\` related to file associations. If malicious, such a behavior could allow an attacker to run malicious scripts without user awareness, effectively enabling covert operations. Importantly, this detection does NOT confirm a confirmed compromise by itself but signals a potentially suspicious activity that requires further investigation.

  ### Investigation Steps

  - **Check Registry Modifications:** Review the Windows Registry for changes to `HKEY_CLASSES_ROOT\*\shell\open\command\` for modifications. Use `reg query` to output the current state and review the command associated with file types that should not execute PowerShell.

  - **Validate PowerShell Command:** Identify the PowerShell command being executed. Extract and analyze the command arguments in events. Look for common flags like `-command` that indicate execution. Additionally, ensure the presence of benign PowerShell executions for valid scripts.

  - **Search for Recent Execution Events:** Investigate Security Event ID 4688 for process creation events related to PowerShell (`powershell.exe`). Filter for occurrences triggered by the registry modifications and note unusual parent processes indicating potential malicious usage.

  - **Alert on Known Malicious Payloads:** Cross-reference any executed PowerShell scripts with threat intelligence sources or existing indicators of compromise (IOCs). Look for known malicious hashes or patterns in the command output that correspond with past incidents.

  - **Review User Activity Context:** Analyze user activity around the time of the execution. If the registry key was modified shortly before unexpected PowerShell execution, assess user roles and whether they should have interacted with files of that type.

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on compromised systems, which could lead to unauthorized access or data exfiltration. Given the nature of PowerShell being commonly weaponized in attacks, the likelihood of malicious abuse is significant. Quick response is necessary to prevent further exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by evasion techniques such as overlapping legitimate application usage that modifies registry settings or the use of obfuscated PowerShell commands. Ensure that Registry Auditing is enabled to capture relevant modifications accurately. Legitimate software installations may lead to similar registry changes and should be assessed carefully. A companion detection rule monitoring for suspicious PowerShell commands (e.g., T1059.001 - Powershell) would strengthen overall detection capabilities against potential misuse.

