  ### Technical Context

  This rule detects the execution of PowerShell scripts through malicious changes to custom file open handlers in the Windows registry. Attackers typically alter registry keys to establish persistence or execution vectors for their payloads, indicating an effort to execute malicious commands. This behavior often aligns with the MITRE ATT&CK tactic of Defense Evasion (T1202).

  The primary telemetry sources for this detection are Windows Registry events captured through the registry set logging. If malicious, successful execution could enable the attacker to execute arbitrary code, potentially leading to data exfiltration or system compromise. Importantly, this detection does NOT confirm actual malicious execution without additional context, as legitimate applications may also manipulate registry entries for valid reasons.

  ### Investigation Steps

  - **Review relevant registry modifications:** Check Windows Registry for changes made to `HKEY_CLASSES_ROOT\*\shell\open\command\`. Look for references to PowerShell commands, focusing on Event ID 4657 (registry value modified) and confirm if paths point to legitimate locations.

  - **Analyze parent process lineage:** Use Sysmon Event ID 1 to examine the process tree. Identify if processes initiating PowerShell have suspicious parent processes (e.g., cmd.exe or wscript.exe). Legitimate PowerShell executions often have processes like `explorer.exe` as parent.

  - **Evaluate script content and arguments:** If PowerShell is invoked with `-command`, retrieve the full command using PowerShell logs or the command line field in Sysmon Event ID 1. Confirm if the command is obfuscated or invokes suspicious scripts or commands.

  - **Check for signs of persistence mechanisms:** Look for additional registry keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` or similar locations, as further persistence may also indicate malicious intent if associated with non-solicited PowerShell executions.

  - **Validate host role for unusual activity:** Cross-reference the behavior against the roles of the affected asset. For instance, PowerShell execution from a server with no legitimate administrative function could flag malicious behavior.

  ### Prioritization

  This alert is high severity due to the potential impact of arbitrary code execution on critical systems. The likelihood of abuse is significant, as attackers often target environments where they can establish persistence via registry manipulation. This behavior has been documented in high-profile attack campaigns, making it a common vector for exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of appropriate logging configurations, as registry modifications must be adequately monitored. Evasion techniques such as using encoded PowerShell commands or legitimate applications scripting interfaces may trigger false positives. Additionally, certain benign applications may create or modify registry keys that could inadvertently trigger this alert. For broader coverage, integrate monitoring for other PowerShell execution methods and corroborate findings with network traffic analysis for outbound connections.

