title: Enabling COR Profiler Environment Variables
id: ad89044a-8f49-4673-9a55-cbd88a1b374f
status: test
description: Detects .NET Framework CLR and .NET Core CLR "cor_enable_profiling" and
  "cor_profiler" variables being set and configured.
references:
- https://twitter.com/jamieantisocial/status/1304520651248668673
- https://www.slideshare.net/JamieWilliams130/started-from-the-bottom-exploiting-data-sources-to-uncover-attck-behaviors
- https://www.sans.org/cyber-security-summit/archives
- https://learn.microsoft.com/en-us/dotnet/core/runtime-config/debugging-profiling
author: Jose Rodriguez (@Cyb3rPandaH), OTR (Open Threat Research), Jimmy Bayne (@bohops)
date: 2020-09-10
modified: 2023-11-24
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1574.012
logsource:
  category: registry_set
  product: windows
detection:
  selection_1:
    TargetObject|endswith:
    - '\COR_ENABLE_PROFILING'
    - '\COR_PROFILER'
    - '\CORECLR_ENABLE_PROFILING'
  selection_2:
    TargetObject|contains: '\CORECLR_PROFILER_PATH'
  condition: 1 of selection_*
level: medium
note: |
  ### Technical Context
  This rule detects the configuration of environment variables related to .NET profiling, specifically the setting of `COR_ENABLE_PROFILING`, `COR_PROFILER`, and `CORECLR_ENABLE_PROFILING`. These variables are typically used by .NET applications to enable profiling features that can be leveraged for monitoring application performance. However, attackers may exploit such features to execute malicious code, maintain persistence within the environment, or evade detection by using external profiling tools.

  The primary threat scenario involves an attacker who utilizes these profiling mechanisms to inject malicious payloads or monitor system behavior stealthily. For instance, once these variables are configured, they could allow the execution of unauthorized or malicious profiling libraries, enabling techniques such as process injection or command execution. This behavior corresponds to multiple MITRE ATT&CK phases, particularly “Persistence” (T1547) and “Privilege Escalation” (T1068), as attackers might manipulate application profiling settings to maintain their presence on a system or gain elevated privileges.

  The primary data sources for this detection will be Windows registry logs, specifically focusing on changes made to the registry keys associated with these environment variables, which can indicate malicious activity or misconfigurations.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the Windows registry for recent modifications to keys related to `COR_ENABLE_PROFILING`, `COR_PROFILER`, and `CORECLR_ENABLE_PROFILING`. Look for unexpected changes or entries created by unfamiliar user accounts.
  - **Identify Running Processes:** List all currently running .NET applications and their associated processes. Investigate any applications that appear to have unusual command-line arguments or loaded profiling libraries.
  - **Analyze Application Behavior:** Monitor application behavior and network connections for anomalies. Check if any unexpected data is sent to external servers that could indicate data exfiltration or command and control activity.
  - **Correlate with EDR Alerts:** Cross-reference any alerts generated by EDR solutions regarding suspicious activity involving .NET processes or profiling libraries. Look for previous alerts that may relate to the use of these environment variables.

  ### Prioritization
  The alert severity is rated as medium due to the potential for significant impact through persistence or privilege escalation, balanced against the likelihood that legitimate applications may also utilize these profiling features in benign ways.

  ### Blind Spots and Assumptions
  This detection may not cover scenarios where profiling configurations are made via application-specific settings rather than direct registry changes. Furthermore, the detection logic assumes that changes to the registry are indicative of malicious intent; however, legitimate profiling might also trigger this rule. It's crucial that registry auditing is enabled and properly configured for the detection to function effectively. Without thorough logging and analysis capabilities surrounding application behavior, the effectiveness of this rule may be limited.

