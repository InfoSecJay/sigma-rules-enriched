note: |
  ---

  ### Technical Context

  This rule detects the manipulation of environment variables related to the .NET Framework and .NET Core, specifically "cor_enable_profiling" and "cor_profiler", which are utilized to enable profiling for CLR applications. Attackers likely aim to utilize these settings to inject malicious profiling code and gain further insights or control over the execution of .NET applications. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** and the technique **T1574.012: DLL Search Order Hijacking**.

  The primary telemetry source is the Windows registry changes logged via the Registry Set operation. Specific log artifacts include those targeting the registry paths associated with the profiling capabilities of .NET, which could signify attempts to maintain access or escalate privileges using injected profiling code. This detection does NOT confirm that malicious activity has occurred; it merely indicates that potentially risky changes to environment variables have been made.

  ---

  ### Investigation Steps

  - **Review the registry changes:** Examine logs for Registry Set operations (Event ID 4657) targeting `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Class\{your-class-id}\` for `COR_ENABLE_PROFILING`, `COR_PROFILER`, or `CORECLR_ENABLE_PROFILING` values. Legitimate applications typically do not modify these settings without specific profiling needs.

  - **Analyze process creation events:** Check for process creation logs (Security Event ID 4688 or Sysmon Event ID 1) immediately after the registry change. Look for unexpected .NET applications or processes spawned. High-confidence malicious indicators would include processes running with suspicious command-line parameters referencing profiling DLLs.

  - **Validate the COR_PROFILER_PATH entries:** Ensure that any registry values under `CORECLR_PROFILER_PATH` point to known, legitimate profiling assemblies. Compare against a list of approved and known profiling assemblies to distinguish between benign configurations and potentially malicious injections.

  - **Examine application logs:** Review application-specific logs (such as logs from ASP.NET applications) to check for abnormal behavior or errors related to profiling, which could indicate exploitation attempts or misuse of profiling features.

  - **Check user and device risk factors:** Identify the user account making the registry changes (use Event ID 4657). Malicious changes made by high-privilege accounts (e.g., SYSTEM or Admin) warrant immediate attention, especially if occurring on critical servers that host sensitive applications.

  ---

  ### Prioritization

  This alert has a medium severity level due to the potential for significant impact on application security. The manipulation of environment variables for profiling is commonly exploited in the wild, but context around the changes and their timing is crucial for assessing malicious intent.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques such as attackers using legitimate user credentials to make changes, which can hide their malicious activities among normal operations. Logs must be properly configured to capture all relevant registry changes; failure to collect these logs could result in undetected malicious activity. Additionally, legitimate application profiling or debugging routines may trigger this alert, necessitating further context to avoid false positives. Companion detections could include monitoring for suspicious process executions or parent-child process relationships involving known profiling activities.

