title: Enabling COR Profiler Environment Variables
id: ad89044a-8f49-4673-9a55-cbd88a1b374f
status: test
description: Detects .NET Framework CLR and .NET Core CLR "cor_enable_profiling"
  and "cor_profiler" variables being set and configured.
references:
- https://twitter.com/jamieantisocial/status/1304520651248668673
- https://www.slideshare.net/JamieWilliams130/started-from-the-bottom-exploiting-data-sources-to-uncover-attck-behaviors
- https://www.sans.org/cyber-security-summit/archives
- https://learn.microsoft.com/en-us/dotnet/core/runtime-config/debugging-profiling
author: Jose Rodriguez (@Cyb3rPandaH), OTR (Open Threat Research), Jimmy Bayne 
  (@bohops)
date: 2020-09-10
modified: 2023-11-24
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574.012
logsource:
  category: registry_set
  product: windows
detection:
  selection_1:
    TargetObject|endswith:
    - '\COR_ENABLE_PROFILING'
    - '\COR_PROFILER'
    - '\CORECLR_ENABLE_PROFILING'
  selection_2:
    TargetObject|contains: '\CORECLR_PROFILER_PATH'
  condition: 1 of selection_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the configuration of environment variables related to .NET profiling, specifically `COR_ENABLE_PROFILING`, `COR_PROFILER`, and `CORECLR_ENABLE_PROFILING`. Setting these variables can indicate an attempt to use the .NET profiling API for performance monitoring or, in an adversarial context, to manipulate application behavior for nefarious purposes. The attacker may seek to gain persistence or escalate privileges by injecting malicious code into trusted applications.

  This behavior correlates with the following MITRE ATT&CK tactics and techniques: **Persistence (T1547)**, **Privilege Escalation (T1548)**, and **Execution (T1203)** for unauthorized code execution. The primary telemetry sources include Windows Registry logs that monitor modifications to specific environment variables. If malicious, this could lead to unauthorized code execution and further exploitation on the affected system. It is crucial to note that this detection alone does not confirm malicious intent; legitimate applications may also set these variables for profiling purposes.

  ### Investigation Steps

  - **Check Registry Modifications for Suspicious Activity:** Review Windows Registry logs for changes at paths such as `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework` or `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion`. Look specifically for Event ID 4657, which logs changes to registry keys.

  - **Identify Baseline Application Behavior:** Determine if applications on the affected system are known to legitimately use profiling. For example, development tools and monitoring solutions often modify these variables. Cross-reference installed applications against the activity seen in the logs.

  - **Correlate User Actions with the Changes:** Analyze user activity around the time of the modification using Security Event ID 4624 (Logon) to identify any unusual logins or privileged access that could suggest malicious intent.

  - **Validate Process and Thread Creation:** Investigate any processes spawned that reference the profiling environment variables. Capture Sysmon Event ID 1 or Security Event ID 4688 to analyze command line arguments for signs of exploitation or misuse.

  - **Look for Known Malicious Indicators:** Compare any identified processes against threat intelligence sources. Specific hashes or process names known for malicious profiling or code injection (e.g., unusual .NET executables) would warrant deeper scrutiny.

  ### Prioritization

  This alert has medium severity as it could indicate potential exploitation of trusted software. The impact could be significant if an attacker gains control over applications leveraging .NET, particularly in enterprise environments with sensitive data. While such behavior could also be benign, the risk of its misuse in privilege escalation or persistence scenarios makes it crucial for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate applications that also configure these variables, leading to potential false positives. The rule depends on robust logging configurations for registry changes; without these, detection efficacy wanes. Additionally, common tools like profilers utilized for application development might generate similar alerts. Implementing companion detections focusing on abnormal process behavior related to these variables could enhance visibility into potential compromise.

