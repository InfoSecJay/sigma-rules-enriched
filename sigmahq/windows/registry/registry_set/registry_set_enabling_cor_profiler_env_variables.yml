logsource:
  category: registry_set
  product: windows
detection:
  selection_1:
    TargetObject|endswith:
    - '\COR_ENABLE_PROFILING'
    - '\COR_PROFILER'
    - '\CORECLR_ENABLE_PROFILING'
  selection_2:
    TargetObject|contains: '\CORECLR_PROFILER_PATH'
  condition: 1 of selection_*
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the modification of environment variables associated with .NET profiling, specifically the "COR_ENABLE_PROFILING" and "COR_PROFILER" variables. These environment variables, when set or modified, signal an attempt by an attacker to configure the .NET runtime for malicious purposes, such as executing arbitrary code or performing privilege escalation through profiling APIs. The relevant MITRE ATT&CK techniques include **Persistence** (T1547), **Privilege Escalation** (T1068), and **Defense Evasion** (T1574.012).

  Primary telemetry sources include Windows registry modifications within the registry path indicating profiling configuration. Specifically, monitoring for changes to the registry keys related to the .NET runtime is essential. If exploited, the impact could range from unauthorized code execution to system compromise, posing significant risks to confidentiality and integrity. Notably, this detection alone does NOT confirm malicious intent, as legitimate applications may use these variables for debugging or profiling.

  ### Investigation Steps

  - **Verify registry modifications:** Investigate changes to the Windows Registry using **Event ID 4657** (Registry Value Changed). Check for modifications to the following paths: `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall` or `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework\` for suspicious environmental variables.

  - **Cross-reference process activity:** Analyze process creation events using **Sysmon Event ID 1**. Look for processes that have been spawned with the profiling variables set, especially for .NET applications, to identify any unusual or unexpected execution paths.

  - **Identify legitimate use cases:** Review the impacted system for known applications that may require these profiling settings, particularly during development or testing phases. Common legitimate applications may explicitly set these profiling variables; hence, confirm if this behavior aligns with organizational policies.

  - **Search for high-confidence malicious indicators:** Check for additional indicators of compromise (IoCs) by leveraging **Security Event ID 4688** (Process Creation) specifically looking for new or unexpected instances of `mscorlib.dll`, which might indicate nefarious profiling attempts.

  - **Assess related files:** Investigate the presence of any unusual `.NET` assemblies within the application's directory or temporary folders that could be associated with profiling tools. Note down any anomalies, particularly those with timestamps concurrent with the registry changes noted in previous checks.

  ### Prioritization

  The severity of this alert is moderate. The potential for exploitation via profiling variables poses a significant risk if an attacker takes control, particularly on critical systems hosting sensitive applications. The likelihood of malicious abuse is high, as such behavior is often weaponized in targeted attacks against .NET applications.

  ### Blind Spots and Assumptions

  Detection may be limited as legitimate administrative actions could modify these registry settings during application debugging or development cycles. Ensure that logging for both process creation and registry changes is enabled and adequately configured to capture all relevant activities. Monitoring for abnormal usage patterns and correlating alerts with companion detections, such as **anomalous network connections** associated with .NET applications, can provide broader context and enhance detection capabilities.

