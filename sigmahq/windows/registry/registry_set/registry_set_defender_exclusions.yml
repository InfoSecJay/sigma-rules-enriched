note: |
  ### Technical Context

  This rule detects the addition of exclusions to Windows Defender through registry changes. An attacker may aim to evade detection by adding exclusions for malicious files or processes, allowing them to operate without interference from security measures. This behavior is associated with the MITRE ATT&CK tactic: Defense Evasion (T1562.001). The primary telemetry source is Windows Registry logs, specifically focusing on modifications under the path '\Microsoft\Windows Defender\Exclusions'. If malicious, this behavior can significantly reduce the efficacy of endpoint protection and allow persistent access to the system. However, this detection does NOT confirm compromise on its own, as legitimate administrative actions might trigger similar alerts.

  ### Investigation Steps

  - **Check recent registry modifications:** Review Windows Registry logs for Security Event ID 4657 to identify recent changes to the '\Microsoft\Windows Defender\Exclusions' key, noting the user account associated with the change.

  - **Evaluate user privileges:** If the modification was made by a user account with administrative privileges, determine if this account is known to perform legitimate maintenance tasks, which might indicate benign activity.

  - **Identify exclusion details:** Confirm specifics of the exclusions added, including file paths or processes. Malicious indicators include exclusions for known malware signatures or encoders, while benign exclusions typically involve legitimate applications or system processes such as antivirus software updates.

  - **Review supporting logs for suspicious activity:** Correlate registry changes with other logs (e.g., Sysmon Event ID 10) to identify related process creations or network connections made just before the modification, indicating potential malicious intent.

  - **Assess system impact:** Identify the criticality of the affected system. High-value hosts (e.g., domain controllers or sensitive servers) require immediate escalation for further investigation.

  ### Prioritization

  This alert should be considered medium severity. The impact of a compromised system with modified defender settings can be significant, and the likelihood of malicious actors using such evasion techniques is high. While this behavior can be seen in legitimate administrative tasks, it is essential to assess it within the context and history of user behavior.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of attackers using alternate methods to modify exclusions, such as direct access to the registry without logging actions. The necessary log sources must include detailed registry audit policies to ensure accurate detection of modifications. Legitimate activities, such as IT maintenance or updates, can trigger this alert. A related detection rule that strengthens coverage is the monitoring of unauthorized installer or script execution that may follow these registry changes to further validate intention.

