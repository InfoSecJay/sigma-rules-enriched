  ---

  ### Technical Context

  This Sigma rule detects the addition of exclusions in Windows Defender through Registry modifications. Attackers may set these exclusions to evade detection by security tools, facilitating the execution of malware without being caught by antivirus solutions. This behavior aligns with the MITRE ATT&CK technique T1562.001 - "Disable or Modify Tools," representing a defense evasion tactic.

  The primary telemetry sources are Windows Registry logs, specifically targeting the key "\Microsoft\Windows Defender\Exclusions." If the modification is performed maliciously, it may allow threats to persist undetected, leading to data theft, lateral movement, or further intrusions. This detection does not confirm malicious intent on its own, as legitimate administrative actions may also lead to similar registry changes.

  ---

  ### Investigation Steps

  - **Review the Registry Change:** Examine Registry Event log (Event ID 4657) to identify the specific value changes under "\Microsoft\Windows Defender\Exclusions." Look for recent modifications that could indicate unauthorized actions.

  - **Correlate with User Accounts:** Check the Security Event log (Event ID 4624) for logon events from user accounts that modified the exclusions. Ensure they correspond to legitimate administrative accounts. Abnormal account usage could indicate malicious behavior.

  - **Identify Malicious Artifacts:** Look for associated processes or services created after the exclusion was added. Focus on Event ID 4688 (Process Creation) and cross-reference these against known malware behavior.

  - **Evaluate Expected Administrator Actions:** Confirm if the actions match known administrative tasks such as managing defending configurations. Legitimate exclusions might be documented for software that requires them, like specific enterprise applications.

  - **Check for Evasion Techniques:** Investigate if the exclusions correspond with other defense evasion tactics seen in the environment, such as disabling security settings or modifying security policies.

  - **Assess Companion Alerts:** Investigate related alerts regarding unusual file activity in conjunction with the modifications. Alerts identifying rare process activities or connections to uncommon IP addresses may indicate malicious intent alongside the exclusion changes.

  ---

  ### Prioritization

  This alert has medium severity due to the potential impact on system integrity and security. While not all registry changes indicate malice, the likelihood of abuse is significant, especially in environments with historically low administrative changes. The tactic of modifying security tools is commonly weaponized in attacks.

  ---

  ### Blind Spots and Assumptions

  Detection relies on accurate logging of Registry modifications. Log sources must be enabled and properly configured to ensure visibility. Legitimate activities, like routine administration tasks, may trigger the alert, leading to potential false positives. A related detection to consider is monitoring for abnormal process executions (Event ID 4688) following registry changes, strengthening the response to possible exploitative behavior.

