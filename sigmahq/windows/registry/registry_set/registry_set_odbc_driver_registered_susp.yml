note: |
  ### Technical Context
  This rule detects the registration of potentially suspicious ODBC drivers located in non-standard directories on Windows systems. ODBC drivers can be exploited by attackers for various purposes, including establishing persistence mechanisms or facilitating credential access through malicious applications. The detection of these registrations in unusual paths, such as public or system directories, indicates possible attempts to compromise the integrity of the system or extract sensitive information.

  Attackers may utilize these malicious ODBC drivers to create lateral movement opportunities or maintain long-term access to environments by manipulating database interactions or targeting applications that rely on ODBC for data access. This activity aligns with the MITRE ATT&CK techniques T1003 (Credential Dumping) and potentially T1547 (Boot or Logon Autostart Execution) as it could lead to unchecked persistence on the system.

  Primary data sources for this detection include registry set logs, which provide visibility into alterations in the Windows registry—specifically in sections related to ODBC driver installations and configurations.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the registry changes at `HKEY_LOCAL_MACHINE\SOFTWARE\ODBC\ODBCINST.INI\` for any new entries, and confirm the legitimacy of the drivers being registered.
  - **Analyze Installation Paths:** Investigate the paths where new ODBC drivers are registered, focusing on any located in directories such as `C:\ProgramData\`, `C:\Temp\`, or `C:\Users\Public\`, which are atypical for legitimate ODBC installations.
  - **Cross-Reference Known Binaries:** Compare detected driver names against reputable sources or white lists to ascertain if they are known legitimate drivers or potential LOLBins (Living Off The Land Binaries).
  - **Audit Related Application Logs:** Look at application logs for any errors or unusual behavior related to database applications that might leverage ODBC drivers, particularly around the time of the registration event.

  ### Prioritization
  The alert is assigned high severity due to the potential impact of unauthorized data access and persistence that can stem from malicious ODBC driver registrations. Given the common use of ODBC by enterprise applications, an attacker leveraging this technique could gain significant foothold in the environment.

  ### Blind Spots and Assumptions
  This detection rule may miss situations where attackers use legitimate drivers stored in standard locations or employ obfuscation techniques to hide their activities. The detection logic assumes that any new ODBC driver registration outside of predefined legitimate paths may indicate malicious intent. Proper configuration and logging of registry changes must be enabled for this detection to function effectively, highlighting potential gaps when such logging is not sufficiently granular or when security policies do not enforce oversight of registry modifications.

