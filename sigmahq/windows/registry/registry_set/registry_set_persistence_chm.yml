level: high
note: |
  ### Technical Context
  This detection rule identifies modifications made to the Windows Registry key related to the HtmlHelp Author, which can be a method used by attackers to establish persistence on a compromised system. Attackers may manipulate this registry entry to load malicious DLLs with the intent of maintaining access even after a system reboot or logoff. The manipulation of registry keys for persistence is a common technique used to ensure that malware can re-establish itself and remain effective against countermeasures.

  Potential threats associated with this behavior could include malicious actors utilizing custom or off-the-shelf malware that exploits the HtmlHelp Author feature as part of their persistence mechanism. The objective is likely to maintain a foothold within an environment for prolonged periods, facilitating further exploitation or data exfiltration efforts.

  Relevant MITRE ATT&CK tactics and techniques that apply include:
  - **Persistence** (T1547)
  - **Registry Run Keys / Startup Folder** (T1060)

  Primary data sources that would contain evidence of this behavior include:
  - Windows Registry logs, specifically focusing on modifications in registry paths related to software execution.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate recent changes to the specified registry keys, particularly any additions or modifications to the `HtmlHelp Author` location. Utilize tools or scripts capable of monitoring registry modifications to trace back the changes to their source.

  - **Identify Executable Path**: Analyze the contents of the `Location` key to determine if it points to any suspicious executables or DLL files. Cross-reference these files with known indicators of compromise (IOCs) to assess their legitimacy.

  - **Correlate with System Events**: Examine system event logs around the time of the modification to assess user activity, application behavior, or any unauthorized access attempts that may correlate with the registry change.

  - **Conduct Endpoint Review**: Perform a thorough investigation on the affected endpoint for any associated artifacts, such as scheduled tasks, service configurations, or related running processes that may suggest the presence of malicious persistence mechanisms.

  ### Prioritization
  This alert should be prioritized as high severity due to the potential impact of persistence mechanisms on the integrity and security of the enterprise environment. The likelihood of successful exploitation through such persistence methods is moderate to high, especially in scenarios where endpoint protections may be bypassed.

  ### Blind Spots and Assumptions
  This detection may not fully capture all persistence techniques employed by attackers, as they may utilize non-standard registry locations or other persistence methods that do not trigger this rule. The detection logic assumes that modifications to the specified registry keys are malicious and does not account for legitimate application behavior, potentially leading to false positives. Required logs include comprehensive registry monitoring, and configurations must ensure that registry activity is appropriately logged and retained for effective analysis.

