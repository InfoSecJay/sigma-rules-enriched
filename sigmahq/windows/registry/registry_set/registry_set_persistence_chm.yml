  ### Technical Context

  This rule detects modifications to the Windows Registry specifically targeting the "HtmlHelp Author" key, which can be leveraged by adversaries to establish persistence on a compromised system. The likely attacker objective is to ensure that malicious payloads are executed whenever the affected system interacts with CHM (Compiled HTML Help) files, allowing for continued access and control. The relevant MITRE ATT&CK tactic is Persistence (TA0003), and the technique is "Registry Run Keys / Startup Folder" (T1547).

  The primary telemetry source is Windows Registry change events associated with application usage. Required log types include registry change logs and system event logs. If the detected behavior is malicious, it may facilitate ongoing access or execution of unauthorized scripts. This detection, on its own, does NOT confirm malicious intent; it only indicates that a registry key associated with potential persistence has been altered.

  ---

  ### Investigation Steps

  - **Identify the registry modification:** Use RegQuery and look for changes in the registry paths `\Software\Microsoft\HtmlHelp Author\Location` and `\Software\WOW6432Node\Microsoft\HtmlHelp Author\Location`. Check for additions or modifications in these keys.

  - **Review process execution history:** Examine security logs for any associated process creation events (Event ID 4688 or Sysmon Event ID 1) that occurred around the time of the registry change. Look specifically for any executables that may have been launched from CHM files.

  - **Assess the legitimacy of the modified values:** Verify if the `Location` value points to recognized software or scripts installed on the system. Legitimate software may include documentation or help tools that utilize CHM; any unfamiliar executables or suspicious script paths may indicate malicious usage.

  - **Check for additional persists indicators:** Investigate for other persistence mechanisms such as entries in Startup folders (e.g., `%UserProfile%\Startup`) or Task Scheduler tasks that could correlate with the registry modifications. Review Event ID 4697 (Service Installation) for related entries.

  - **Inspect user activity related to CHM files:** Cross-reference user activities and logs that show interaction with CHM files in the last few days prior to the alert. Look at file access logs or application logs that indicate the use of help files.

  ---

  ### Prioritization

  This alert should be categorized as high severity due to the potential for ongoing system compromise if the modification is indeed malicious. The alteration of registry keys for persistence is a technique commonly utilized by adversaries, potentially leading to significant impact if successful.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate software updates that modify registry keys, which could trigger this alert in benign contexts. Reliable detection requires appropriate monitoring of registry changes, and Windows Event Log configurations need to be verified for consistency. Additionally, other families of persistence methods, such as browser helper objects or scheduled tasks, should be monitored as companion detections to enhance coverage.

