  ### Technical Context

  This Sigma rule detects the modification of the registry key associated with the Windows Input Method Editor (IME) feature, specifically when an uncommon file extension (e.g., .ime) is registered. Such behavior is often indicative of an adversary attempting to exploit IMEs to load a malicious DLL into a process after triggering a specific Windows message (WM_INPUTLANGCHANGEREQUEST). The likely attacker objective is to manipulate keyboard events or execute code within the context of the user’s session.

  The relevant MITRE ATT&CK tactic is **Defense Evasion**, with technique ID **T1562.001**. The primary telemetry sources for this detection are Windows Registry logs that capture changes to the registry, specifically entries under `\Control\Keyboard Layouts\`. If malicious, this behavior could enable an attacker to obfuscate their actions and execute code without arousing suspicion. This detection does NOT confirm that the loaded DLL is malicious; it only highlights that a potentially suspicious IME was registered.

  ---

  ### Investigation Steps

  - **Check the Registry Modification: ** Review the registry path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Language EL\Control\Keyboard Layouts\` for recent modifications (Event ID 4657). Confirm if the key `Ime File` is being set with an uncommon `.ime` extension that is not recognized or documented within your environment.

  - **Identify Active Input Language:** Inspect the current keyboard layout settings for the user using `Get-WinUserLanguageList` or similar commands. Verify if the active input language matches legitimate configurations and requires the IME feature.

  - **Verify DLL Path and Content:** Look for the DLL path configured within the `Ime File` registry value. If it points to a non-standard location (e.g., user directories, temp folders), it could indicate malicious intent. Try to access the DLL file directly and check its digital signature or hash against known good values.

  - **Monitor Process Creation:** Cross-reference recent process creation events (Event ID 4688) for any processes spawned with a command line referencing the registered IME DLL. Malicious processes could include unusual parent-child relationships or unexpected applications.

  - **Establish Baselines:** Note what legitimate IME behavior typically looks like in your environment—common extensions installed or registry values associated with authorized applications. Document any benign activity that aligns with recognizable and safe configurations.

  ---

  ### Prioritization

  This alert should be considered high severity as it pertains to changes in system configurations that could facilitate payload execution or other malicious actions. The likelihood of malicious abuse is moderate, given that the IME feature is often manipulated in advanced attacks. While uncommon, this technique has been weaponized by certain adversaries in targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if IME modifications are performed by legitimate applications or benign users within the environment, potentially leading to false positives. Comprehensive monitoring of all registry changes, particularly under `\Control\Keyboard Layouts\`, is necessary for reliable detection. Additionally, legitimate software installations may trigger this alert, particularly from applications that utilize enhanced IME support. A related detection to consider is monitoring for unusual user behavior around process creation and DLL execution to strengthen coverage.

