note: |
  ### Technical Context

  This Sigma rule detects potential COM object hijacking through modifications of default values in system CLSIDs (Class Identifiers) in the Windows Registry. An attacker may leverage this technique to alter the behavior of legitimate COM objects, allowing them to execute malicious code or gain unauthorized control over processes that rely on these objects. The likely objective of this behavior aligns with the MITRE ATT&CK tactic of Persistence and Privilege Escalation, specifically under technique T1546.015 (COM Hijacking).

  The primary telemetry sources are Windows Registry modifications, specifically monitoring registry keys associated with CLSIDs, such as `HKEY_CLASSES_ROOT\CLSID`. The potential security impact of this activity is significant, as it may lead to malicious code execution with the privileges of legitimate user processes. This detection does NOT confirm an active compromise on its own; further investigation is necessary to ascertain the context and intent behind the registry changes.

  ### Investigation Steps

  - **Review registry change events for modification:** Check Security Event ID 4657 for changes to registry keys specifically around `HKEY_CLASSES_ROOT\CLSID` and cross-reference with Sysmon Event ID 13 to identify potential malicious activity.

  - **Identify known malicious CLSIDs:** Validate modifications against established red flags, such as known malicious CLSIDs listed in public threat intelligence reports. Changes involving CLSIDs such as `\{1f486a52-3cb1-48fd-8f50-b8dc300d9f9d}` should be flagged for deeper investigation.

  - **Examine the modification paths:** Monitor for registry changes originating from suspicious paths. For instance, entries modified from `C:\Users\<username>\AppData\Local\` or `C:\Windows\Temp\` that involve CLSIDs are indicative of potential abuse.

  - **Document legitimate behavior benchmarks:** Review typical registry changes by trusted software installations. Installations through official MSI packages or Windows Update should generate entries that are well-documented and predictable, contrasting sharply with irregular changes.

  - **Look for unusual application behavior:** Correlate the registry modification with application logs (e.g., Application Event logs) for instances where applications may fail to execute or exhibit unexpected behavior due to tampered CLSID references.

  - **Check for persistence via startup locations:** Review startup items located in user profiles or common paths (`C:\Users\Public\`, `C:\ProgramData\`, etc.) for unusual entries linking to newly modified CLSIDs that may indicate an attempt to maintain persistence.

  ### Prioritization

  Given the potential for privilege escalation and the manipulation of critical system processes, this alert is of high severity in an enterprise context. The likelihood of exploitation is moderate, particularly in systems where users may have elevated privileges or access to sensitive data. This behavior is prevalent among emerging malware tactics, necessitating quick response actions.

  ### Blind Spots and Assumptions

  Detection may be limited by the specific logging configurations in place; registry change notifications must be enabled to capture the relevant events effectively. While legitimate software installations may trigger similar registry changes, they typically do so from known installation paths and authenticated sources. For enhanced coverage, companion detections related to abnormal process creation (e.g., Sysmon Event ID 1) can strengthen the investigation context for potential hijacking scenarios.

