  ---

  ### Technical Context

  This Sigma rule detects when the Windows Defender service (WinDefend) is disabled via changes in the Windows registry. The likely objective of such an action is to evade detection by security software, facilitating the deployment of malware or other malicious activity. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562.001 - Disable or Modify Tools. The primary telemetry source for this detection is Windows Registry change logs, especially monitoring for modifications to the Startup value of the WinDefend service. If malicious, the impact can be severe as it could allow for unrestricted system access by an adversary while inhibiting malware detection. However, this detection does not confirm malicious intent on its own, as legitimate administrator actions can lead to similar registry modifications.

  ---

  ### Investigation Steps

  - **Verify registry change details:** Examine Windows Registry logs for Event ID 4657 or use Sysmon Event ID 13 to find modifications to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\WinDefend`, specifically checking for a Startup value change to `DWORD (0x00000004)`.

  - **Assess the context of the change:** Determine the user account that initiated the registry modification. Benign changes will often originate from known administrative accounts or during approved maintenance windows.

  - **Check for related service changes:** Investigate any concurrent changes to other security services or processes, such as logging changes in Event ID 7036 indicating transitions in Windows Defender's operational state.

  - **Identify potential malicious indicators:** Look for other events around the same timeframe, such as suspicious process creation (Event ID 4688) that could indicate an attempt to deliver or execute malware after disabling the antivirus.

  - **Review past incidents:** Investigate the alert within the context of historical alert data to identify if there has been a pattern of similar changes without legitimate reason. This may indicate ongoing malicious activity.

  - **Monitor for file and program executions:** Confirm if there are any file creations or executions that correlate with the timing of the registry change, especially involving known malicious hashes or signatures.

  ---

  ### Prioritization

  The alert should be considered high priority due to the critical role Windows Defender plays in endpoint security. The likelihood of malicious abuse is high, as disabling antivirus software is a common tactic employed by attackers to facilitate further intrusions. This behavior is frequently seen in ransomware and malware deployment scenarios.

  ---

  ### Blind Spots and Assumptions

  Challenges include potential evasion techniques such as using legitimate administrative privileges to alter security settings without triggering alerts. Reliable detection of this rule relies on accurate and comprehensive logging of registry changes, which may require additional configurations. Common administrator actions, such as routine maintenance or troubleshooting, might falsely trigger this alert. A related detection to consider is monitoring for anomalous PowerShell activities (T1059.001) that may leverage remote commands to disable security services.

