note: |
  ### Technical Context
  This detection rule monitors modifications to the Windows Registry that disable System Restore. Specifically, it focuses on changes to registry keys that control the system's ability to create restoration points, which is a critical feature for recovering from system failures or malware infections. Malicious actors may disable System Restore to prevent users from reverting their systems after a compromise, thereby ensuring persistence or facilitating other malicious activities without detection.

  The relevant MITRE ATT&CK techniques for this detection include **Impact (TA0040)** and specifically **T1490: Inhibit System Recovery**. By disabling System Restore, attackers aim to disrupt the victim's ability to recover from malware infections or other system issues, thus achieving their objectives of maintaining control over the compromised system.

  The primary data sources for this rule are registry set logs that capture changes to the Windows Registry. These modifications are often logged by Windows security monitoring tools that track registry activity, making it essential to have adequate logging configured on endpoints.

  ### Investigation Steps
  - **Review Registry Change Logs**: Examine registry logs for changes to `\Policies\Microsoft\Windows NT\SystemRestore` or `\Microsoft\Windows NT\CurrentVersion\SystemRestore` related to the `DisableConfig` or `DisableSR` DWORD values being set to `1`.

  - **Correlate with User Activity**: Investigate user activity around the time of the registry modification to determine if there were any unusual behaviors, software installations, or other events that could indicate a compromise.

  - **Analyze Process Creation Events**: Check for process creation events that might have launched programs or scripts capable of modifying the registry, particularly during the timeframe when the registry change was made.

  - **Check for Other System Modifications**: Look for additional system changes or behavior that aligns with malicious activity, such as unexpected service creations or alterations in security policies that could indicate an attacker’s maneuvering.

  ### Prioritization
  This alert is considered high severity because disabling System Restore can severely impact the victim's ability to recover from malware infections or system issues, making it a critical action often associated with sophisticated threats. The likelihood of this activity being legitimate is low, particularly if it occurs in environments where System Restore is routinely utilized by users.

  ### Blind Spots and Assumptions
  The detection logic assumes that the required logging for registry changes is properly configured and that no legitimate administrative changes are taking place that might trigger false positives. Gaps in detection may include systems where registry changes are not regularly logged or monitored. Adapting detection settings may be necessary for environments with custom configurations or extensive permissions.

