note: |
  ### Technical Context

  This rule detects modifications in the Windows registry that disable System Restore functionality. Attackers often seek to disable System Restore to hinder recovery efforts and persistence mechanisms, making it harder for defenders to restore systems after malicious actions. The behavior aligns with the MITRE ATT&CK tactic of Impact (T1490), specifically targeting disabling or destruction of system functionalities.

  The primary telemetry source includes Windows registry change logs, specifically focusing on modifications under the registry paths related to System Restore settings. If the behavior is malicious, it can significantly impede incident response efforts and system restoration after a compromise. Importantly, this detection does NOT confirm unauthorized access or malicious intent on its own, as there are legitimate reasons to alter System Restore settings.

  ### Investigation Steps

  - **Identify registry modifications**: Review Windows Security Event ID 4657 to find recent changes to the registry paths: `\Policies\Microsoft\Windows NT\SystemRestore` and `\Microsoft\Windows NT\CurrentVersion\SystemRestore`. Look for `TargetObject` values that include `DisableConfig` or `DisableSR`.

  - **Validate the change’s value**: Ensure the `NewValue` field shows `DWORD (0x00000001)`, indicating that System Restore has been disabled. Values of `0` or missing entries indicate it remains enabled, which is typical for benign use.

  - **Check for recent high-risk activities**: Cross-reference with other logs such as Event ID 4688 (process creation) to identify if processes like `powershell.exe` or `cmd.exe` were executed around the same time, which could indicate a larger malicious operation.

  - **Assess host role and criticality**: Determine if the affected system is a critical server (e.g., Domain Controller or Web Server). Such systems being targeted raises the severity of the alert.

  - **Investigate user activity**: Identify the user or process that made the registry change. Check user logins and actions around the same time in Security Event ID 4624 to see if suspicious behavior accompanies the modification.

  - **Review recent system activities**: Evaluate if any recent system restore points were deleted or if system snapshots were removed through event logs, indicating potential preparation for further malicious actions.

  ### Prioritization

  This alert is classified as high severity due to its potential impact on system recoverability and the likelihood of being weaponized by threat actors to avoid detection and increase persistence. Targeted systems with critical roles elevate the alert's urgency for investigation.

  ### Blind Spots and Assumptions

  The detection may be evaded through direct registry manipulation using kernel-level techniques or by altering permissions to prevent log creation. It is essential to ensure that Windows Event Forwarding or equivalent logging for registry changes is configured to capture these events accurately. Legitimate system maintenance or configuration changes by IT personnel may trigger this alert. A related detection could involve alerting on deletions or modifications of System Restore points, adding an extra layer of visibility.

