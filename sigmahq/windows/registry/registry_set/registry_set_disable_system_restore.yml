note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry that disable the System Restore feature, which can remove a critical layer of recovery and backup for system files. Attackers may aim to disable System Restore to prevent users or system administrators from reverting to a previous functional state following malicious activities, such as malware installations or system changes. This behavior is associated with the MITRE ATT&CK technique T1490: Inhibit System Recovery.

  Primary telemetry sources include Windows Registry logs, particularly for changes to keys under `HKEY_LOCAL_MACHINE\Policies\Microsoft\Windows NT\SystemRestore` and `HKEY_LOCAL_MACHINE\Microsoft\Windows NT\CurrentVersion\SystemRestore`. If malicious, disabling System Restore can significantly impact an organization’s ability to recover from cyber incidents. This detection does not confirm whether the activity is indeed malicious without additional context and analysis.

  ### Investigation Steps

  - **Check Registry Changes:** Review Windows Registry change logs for modifications to `HKEY_LOCAL_MACHINE\Policies\Microsoft\Windows NT\SystemRestore\DisableConfig` or `DisableSR`. Use Event ID 4657 (Registry value modified) to confirm the context of the change.

  - **Identify Timestamp of Change:** Check the timestamps of the registry modifications against user activity logs (Event ID 4624 - Successful logon) to see if they align with administrative access or unauthorized access attempts.

  - **Query for System Restore Status:** Validate the current status of System Restore using PowerShell command `Get-ComputerRestorePoint`. If it shows that system restore points have been disabled, this could indicate a malicious intent.

  - **Assess Asset Criticality:** Determine the role of the affected host—if it’s a critical server with sensitive operations, prioritize further investigation over non-critical endpoints.

  - **Flag for Behavioral Anomalies:** Look for patterns of other registry modifications or system behaviors (such as disabling security tools or inconsistent user account activities) around the same timeline that may indicate a broader attack.

  ### Prioritization

  This alert is of high severity due to the potential impact of disabling system recovery mechanisms on critical systems. Given that this behavior is often used by adversaries attempting to cover their tracks or persist, the likelihood of malicious abuse is significant.

  ### Blind Spots and Assumptions

  Detection may be limited by system policies that could inherently alter Registry settings for legitimate maintenance purposes. Legitimate activities, such as updates or administrative maintenance, might trigger this alert. Ensure logging is configured to capture all registry changes comprehensively. Companion detections for monitoring other attributes of potential attacks include tracking changes to Windows Defender settings or unusual user account command executions.

