  ### Technical Context

  This detection rule identifies modifications to the Windows registry aimed at disabling system restore points, specifically targeting registry keys related to System Restore configurations. The likely attacker objective is to prevent recovery options, thereby hindering incident response and remediation efforts in case of system compromise or malware infections. This behavior corresponds with the MITRE ATT&CK tactic: **Impact (T1490)**, Technique: **Inability to Recover (T1490)**.

  The primary telemetry source for this detection is the Windows registry, captured through security event logs pertaining to registry changes. If malicious, this behavior can severely impact the organization’s ability to recover from incidents by removing critical recovery points. Importantly, while this detection alerts on a registry change, it does NOT confirm malicious intent without further context or corroborating evidence.

  ---

  ### Investigation Steps

  - **Analyze registry changes:** Examine Windows Security Event ID **4657**, focusing on changes to the keys under `\Policies\Microsoft\Windows NT\SystemRestore` and `\Microsoft\Windows NT\CurrentVersion\SystemRestore`. Look for values set to **DWORD (0x00000001)** indicating System Restore is disabled.

  - **Identify recent activity:** Review the command history for administrative or related software activity on the affected system. Use Sysmon Event ID **22** to correlate process creation events that resulted in these registry modifications.

  - **Check for recovery configuration:** Determine the current status of System Restore on the affected machine via the Control Panel or PowerShell cmdlet `Get-ComputerRestorePoint`. The presence of existing restore points or enabled configuration is a benign indicator.

  - **Verify file system integrity:** Watch for signs of additional malicious activity, such as unexpected **file deletions or modifications** in directories typically involved in system restore, like `C:\System Volume Information`. Use File System Auditing logs for evidence.

  - **Correlate with network activity:** Examine Windows Event ID **5156** to check for outbound connections that may signal data exfiltration attempts. High volumes of network activity post-registry change may indicate malicious intentions.

  ---

  ### Prioritization

  This alert should be prioritized as **high severity** due to its potential impact on critical enterprise systems. The disabling of system restore is a commonly weaponized tactic used to facilitate further malicious actions without the possibility of easy recovery.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the ability of users with administrative privileges to modify registry settings legitimately, leading to potential false positives. Continuous monitoring of registry changes require proper logging configurations to capture the relevant events. Legitimate system maintenance activities, such as software updates or configuration changes by IT personnel, may trigger this alert. A related detection includes monitoring access to APIs involved in system recovery processes, which could enhance coverage and mitigate false positives.

