title: Potential AutoLogger Sessions Tampering
id: f37b4bce-49d0-4087-9f5b-58bffda77316
status: test
description: Detects tampering with autologger trace sessions which is a 
  technique used by attackers to disable logging
references:
- https://twitter.com/MichalKoczwara/status/1553634816016498688
- https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
- https://i.blackhat.com/EU-21/Wednesday/EU-21-Teodorescu-Veni-No-Vidi-No-Vici-Attacks-On-ETW-Blind-EDRs.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2025-10-07
tags:
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\System\CurrentControlSet\Control\WMI\Autologger\'
  selection_values:
    TargetObject|contains:     # We only care about some autologger to avoid FP. Add more if you need
    - '\EventLog-'
    - '\Defender'
    TargetObject|endswith:
    - '\Enable'
    - '\Start'
    Details: DWORD (0x00000000)
  filter_main_wevtutil:
    Image: 'C:\Windows\system32\wevtutil.exe'
  filter_main_defender:
    Image|startswith:
    - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
    - 'C:\Program Files\Windows Defender\'
    - 'C:\Program Files (x86)\Windows Defender\'
    Image|endswith: '\MsMpEng.exe'
    TargetObject|contains:
    - '\DefenderApiLogger\'
    - '\DefenderAuditLogger\'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects modifications to Windows Autologger sessions, specifically targeting entries related to event logging and Windows Defender. Such tampering is indicative of an attacker’s objective to disable or manipulate logging mechanisms, thereby obscuring malware operations or activity footprints. The relevant MITRE ATT&CK tactic is Defense Evasion (TA0005), with the technique identified as WMI Event Subscription (T1546.004). The primary telemetry source is the Windows Registry, particularly focusing on WMI Autologger session configurations identified under `\System\CurrentControlSet\Control\WMI\Autologger\`.

  If tampering is confirmed, it poses a significant security risk as it may enable malicious actors to operate undetected within the environment. However, this detection does NOT confirm that malicious activity has occurred on its own; it only indicates potential tampering of protective logging features.

  ### Investigation Steps

  - **Review Registry Modifications: ** Investigate registry changes in `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\WMI\Autologger\` for `Enable` or `Start` values set to `0` (DWORD). This indicates potential disabling of critical logging functionalities.

  - **Check Event Logs for Consistency:** Review Security Event ID 4656 and Windows Event log IDs 1102 or 104 for recent changes indicating clearing of logs. Compare timestamps of log clears against registry modifications to determine correlation.

  - **Identify Legitimate Configurations: ** Validate if registry values changed correspond to known legitimate processes or applications. For instance, a properly configured entry should have `Enable` value set to `1` for active logging.

  - **Analyze Process Execution:** Investigate runs of `wevtutil.exe` via Process Monitor or similar tools to determine if there were inadvertent or malicious usages, looking for arguments related to disabling logs.

  - **Correlate with Threat Intelligence:** Cross-reference behavior against threat reports or intelligence feeds regarding recent attacks using techniques like disabling Windows Defender logging. Look for known threat actors adopting this method.

  ### Prioritization

  This alert is classified as high severity due to its potential impact on critical systems that rely on event logging for security monitoring. The likelihood of malicious exploitation is significant, given the common adversary tactic of manipulating logging systems to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by missing or incomplete log configurations; if log sources are not capturing registry changes effectively, potential attacks may go unnoticed. Legitimate administrative actions, such as system updates or configuration changes, might inadvertently trigger this rule. A companion detection mechanism could include monitoring command-line arguments and processing behavior of `wevtutil.exe` to strengthen logging integrity checks.

