note: |
  ### Technical Context

  This Sigma rule detects tampering with AutoLogger trace sessions, which are critical for capturing system events during the early boot phase of Windows. Attackers may aim to disable these sessions to evade detection and manipulate the system's logging capabilities, ensuring their activities remain hidden. This behavior aligns with the MITRE ATT&CK technique T1562.001 (Impair Defenses: Disable Security Tools).

  Primary telemetry sources are Windows registry modifications related to AutoLogger sessions, specifically focusing on changes under `\Control\WMI\Autologger\`. If malicious, this activity can lead to a significant security impact by allowing adversaries to operate undetected during system initialization. It should be noted that this detection does NOT confirm malicious intent on its own since legitimate maintenance or configuration changes can also modify these registry settings.

  ### Investigation Steps

  - **Check registry modifications**: Analyze Windows registry events (Event ID 4657) for any changes made to `\Control\WMI\Autologger\`, especially looking for `\EventLog-` and `\Defender` entries being set to DWORD 0 (disabled).

  - **Correlate with process activity**: Review process creation events (Security Event ID 4688) around the time of the registry change to identify if `wevtutil.exe` or other relevant processes were executed. Look for command-line parameters that might indicate tampering attempts.

  - **Identify expected behavior**: Legitimate operations should generally not disable AutoLogger sessions. Typically, a normal state shows `\EventLog-` sessions enabled (DWORD 1) and tracked by the ETW-related tools during and after boot.

  - **Detect other security tool modifications**: Assess for changes or temporary disabling of Windows Defender or other EDR/AV solutions by querying logs related to processes (Event ID 4688) associated with `MsMpEng.exe` disabling any logged activity.

  - **Validate file integrity**: Examine system directories for anomalies by looking for unexpected file deletions or movements related to event logs using File Integrity Monitoring (FIM) logs.

  ### Prioritization

  This alert is of high severity as it indicates a potential compromise of logging capabilities, which might allow an attacker to conduct malicious activities without detection. The potential impact on critical systems is significant, given the common exploitation of logging impairment techniques in advanced attacks.

  ### Blind Spots and Assumptions

  Detection may be limited if logging for specific registry changes isn’t enabled or erroneously configured, leaving gaps in visibility. Legitimate system maintenance practices, especially by system administrators, could trigger these alerts. A companion detection to monitor for abnormal registry access patterns or changes to other security configurations (e.g., Event ID 4656) will enhance coverage and mitigate false positives.

