detection:
  selection:
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Winlogon\AllowMultipleTSSessions'
    Details|endswith: DWORD (0x00000001)
  condition: selection
falsepositives:
- Legitimate use of the multi session functionality
level: medium
note: |
  ### Technical Context

  This Sigma rule detects when the registry key 'AllowMultipleTSSessions' is enabled in Windows environments, allowing multiple Remote Desktop Protocol (RDP) sessions to be active simultaneously. Attackers may exploit this to maintain access to a compromised system without disrupting existing legitimate sessions. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and technique of Remote Services: RDP (T1112).

  The primary telemetry source for this detection is Windows registry event logs, specifically monitoring changes to registry keys. If exploited, this could facilitate unauthorized access to critical systems, increasing the risk of data exfiltration or lateral movement. However, enabling this registry value does not, on its own, confirm malicious intent, as there are legitimate use cases for multiple RDP sessions.

  ### Investigation Steps

  - **Check the enabling event:** Review registry set events in the Security event log (Event ID 4657) to confirm when 'AllowMultipleTSSessions' was changed. Look for Event ID 4657 with TargetObject set to '\Microsoft\Windows NT\CurrentVersion\Winlogon\AllowMultipleTSSessions' and Details showing DWORD value (0x00000001).

  - **Identify the user account making changes:** Correlate the enabling event with the user account involved. If detected on non-administrative accounts, it may indicate a threat actor's misuse. Confirm the account's last logon activity (Event ID 4624) within the same timeframe for context.

  - **Evaluate system roles and configurations:** Review system roles (e.g., Terminal Server) to validate if enabling multiple RDP sessions is expected behavior. Assess whether these settings align with normal operational policies and practices for the asset in question.

  - **Monitor for other suspicious activities:** Look for concurrent RDP sessions using Event ID 4624 and Event ID 4672. Multiple sessions initiated by unusual or unexpected accounts, especially if timestamps align with the registry change event, could indicate malicious activity.

  - **Cross-reference with threat intelligence:** Investigate if the enabling of this setting correlates with known threat actor activity (such as those outlined in Talos Intelligence reports on Lazarus Group) to assess potential TTPs (tactics, techniques, and procedures).

  ### Prioritization

  This alert is medium severity, as the enabling of multiple RDP sessions poses a potential risk for unauthorized access and persistence. While misconfiguration can occur, the likelihood of adversaries utilizing this capability to maintain footholds or abuse compromised accounts causes concern. This behavior is indeed common in sophisticated threats targeting remote access.

  ### Blind Spots and Assumptions

  Detection may miss instances where attackers employ evasion techniques to modify this setting through malicious scripts or remote management tools. Reliable detection relies on comprehensive auditing of Windows registry changes and maintaining the integrity of registry logging. Legitimate administrative tasks may enable this setting, especially in environments requiring flexible remote access. Companion detections include monitoring for unusual RDP session logs to establish a more complete security posture.

