note: |
  ### Technical Context

  This Sigma rule detects when the 'AllowMultipleTSSessions' registry key is set to enable multiple Remote Desktop Protocol (RDP) sessions. This behavior is typically associated with potential adversarial activity, as it allows an attacker to establish an RDP session without disrupting existing connections. The likely objective is to maintain access and persistence while avoiding detection. This detection aligns with the MITRE ATT&CK persistence tactic, specifically technique T1112, which pertains to altering system configurations.

  The primary telemetry source for this detection is Windows Registry activity, specifically monitoring the registry path `\Microsoft\Windows NT\CurrentVersion\Winlogon\` for changes to the 'AllowMultipleTSSessions' value. If malicious, this could lead to unauthorized access and data exfiltration through multiple active sessions. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate system administrators may adjust this setting for business continuity.

  ---

  ### Investigation Steps

  - **Review registry changes:** Check the Windows Registry for any modifications to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\AllowMultipleTSSessions`. An enabled value (DWORD 1) indicates potential misuse.

  - **Analyze user session activity:** Investigate logins using `Event ID 4624` (Login) from Windows Security logs. Look for multiple concurrent RDP sessions tied to the same user account. Legitimate IT activities may involve a single user accessing their session from different devices or locations.

  - **Check for uncommon RDP user accounts:** Use Windows logs (Event ID 4778) to identify user accounts that connect via RDP. Compare against known user accounts to spot any unauthorized or unexpected users connecting simultaneously.

  - **Validate endpoint security:** Examine security solutions (e.g., EDR/AV logs) for additional alerts on related processes triggered around the same timeframe. This may include abnormal process executions alongside the registry change.

  - **Assess system role and criticality:** Consider the asset specifics and role of the affected system. An RDP server should be secured and monitored more closely than standard user workstations, increasing the likelihood of critical incidents if exploited.

  ---

  ### Prioritization

  This alert is of medium severity due to the potential for significant system compromise through multiple RDP sessions, increasing the attack surface. While enabling this registry setting is not uncommon for admins, it can be weaponized by attackers to maintain persistence and evade detection. The risk escalates with exposure on high-value systems.

  ---

  ### Blind Spots and Assumptions

  This detection may miss cases where adversaries revert the registry change shortly after modification to avoid detection. The reliability of detection requires that registry monitoring is properly configured across all endpoints. Legitimate use cases include IT personnel enabling multi-session access for administrative purposes. Companion detections, such as monitoring for anomalous user behavior during RDP sessions, can provide stronger context and increase confidence in the detection of malicious activity.

