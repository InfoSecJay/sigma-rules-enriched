logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Winlogon\AllowMultipleTSSessions'
    Details|endswith: DWORD (0x00000001)
  condition: selection
falsepositives:
- Legitimate use of the multi session functionality
level: medium
note: |
  ### Technical Context
  This detection rule identifies the enabling of the `AllowMultipleTSSessions` registry key on Windows systems. This setting allows multiple Remote Desktop Protocol (RDP) sessions to be open simultaneously. Attackers may exploit this functionality to gain persistent access to a system while avoiding the disconnection of legitimate user sessions, facilitating covert activities or lateral movement within a network.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1547)**, where an attacker establishes persistence through malicious configurations, and **Defense Evasion (T1112)**, which pertains to disabling or altering security measures to avoid detection by security tools. The primary data source for this rule is the Windows registry, particularly monitoring changes to registry keys associated with RDP configurations.

  ### Investigation Steps
  - **Examine Registry Changes:** Review the Windows registry for modifications to the `AllowMultipleTSSessions` value, specifically looking for instances where this value is set to `1`. Verify if the change corresponds with user activities or other system changes.
  - **Monitor RDP Connections:** Investigate the RDP session logs and look for unusual connection patterns, such as multiple concurrent sessions initiated from the same or different accounts, which may indicate unauthorized access attempts.
  - **Check User Behavior:** Analyze user activity logs for abnormal behavior relating to RDP use, including logon times that do not correlate with standard user patterns, to identify potential malicious internal users or compromised accounts.
  - **Review Security Events:** Collect and analyze Windows security event logs related to RDP logins, focusing on Event IDs 4624 (successful logon) and 4625 (failed logon) to determine if there are unrecognized users or failed login attempts indicative of a broader attack.

  ### Prioritization
  This alert carries medium severity due to the potential for considerable impact if attackers leverage this setting for undetected access. The likelihood of exploitation increases in environments where remote access is common, particularly if strong authentication controls are not enforced.

  ### Blind Spots and Assumptions
  The detection logic assumes that changes to the registry are monitored consistently and that the environment does not have legitimate use cases for enabling multiple RDP sessions. One gap in detection coverage could arise if the registry change is made via legitimate administrative tasks, which may lead to false positives. To effectively utilize this rule, registry auditing must be enabled, and full logs of registry changes should be retained for analysis. If the necessary logging settings are not in place, the alert may not function as intended.

