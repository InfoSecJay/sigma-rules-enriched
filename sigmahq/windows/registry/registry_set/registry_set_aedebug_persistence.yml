title: Add Debugger Entry To AeDebug For Persistence
id: 092af964-4233-4373-b4ba-d86ea2890288
status: test
description: Detects when an attacker adds a new "Debugger" value to the "AeDebug"
  key in order to achieve persistence which will get invoked when an application crashes
references:
- https://persistence-info.github.io/Data/aedebug.html
- https://learn.microsoft.com/en-us/windows/win32/debug/configuring-automatic-debugging
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug\Debugger'
    Details|endswith: '.dll'
  filter:
    Details: '"C:\WINDOWS\system32\vsjitdebugger.exe" -p %ld -e %ld -j 0x%p'
  condition: selection and not filter
falsepositives:
- Legitimate use of the key to setup a debugger. Which is often the case on developers
  machines
level: medium
note: |
  ### Technical Context
  This detection rule identifies attempts by an attacker to modify the "AeDebug" registry key on Windows systems. The "AeDebug" key is associated with automatic debugging of applications, and attackers often manipulate this key to establish persistence. By adding a debugger value that points to a malicious executable, an attacker can ensure that if the targeted application crashes, their code is executed, achieving a stealthy foothold in the environment.

  In this context, the likely attacker objective is to maintain long-term access to compromised systems or to execute malicious payloads under the guise of legitimate application behavior. This aligns with MITRE ATT&CK’s persistence tactics, specifically the technique **Registry Run Keys / Startup Folder (T1547.001)**.

  The primary data sources to examine for this detection include Windows registry change logs which monitor modifications to registry keys. Monitoring registry changes is critical as it captures unauthorized changes made by both malware and authenticated users.

  ### Investigation Steps
  - **Review Registry Change Logs:** Examine logs related to modifications in the `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug\Debugger` registry path for any recent changes. Look for unexpected or non-standard entries.
  - **Analyze Process Creation Events:** Investigate any new process creations tied to the presence of `vsjitdebugger.exe` in the command line arguments, which could indicate the execution of a malicious debugger.
  - **Identify User Accounts Involved:** Cross-reference changes with user activities and account permissions to determine whether the modification was made by a legitimate user or if an adversary has gained unauthorized access.
  - **Correlate with Known Threat Actors:** Utilize threat intelligence sources to correlate the identified registry changes with known behaviors of threat actors who leverage persistence mechanisms similar to this technique.

  ### Prioritization
  The alert is of medium severity due to the potential for long-term persistence in an enterprise environment. Attackers utilizing this method can remain undetected for extended periods, making it a valuable foothold for further exploitation.

  ### Blind Spots and Assumptions
  The detection rule may not capture legitimate use cases where developers modify the AeDebug key to test applications. Additionally, the reliance on registry logging means that if log retention policies are not configured correctly, older changes may not be available for investigation. The effectiveness of this detection is also contingent on the timely and accurate logging of registry modifications.

