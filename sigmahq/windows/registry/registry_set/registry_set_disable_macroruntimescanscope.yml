note: |
  ### Technical Context

  This Sigma rule detects modifications to the `MacroRuntimeScanScope` registry key in Windows, which is a configuration setting that controls the runtime scanning of macros within Microsoft Office applications. The likely attacker objective is to disable protections against malicious macros, allowing them to run without triggering alerts from Microsoft’s Antimalware Scan Interface (AMSI). This behavior corresponds to the MITRE ATT&CK technique **T1203 - Exploitation for Client Execution** under the tactic of **Defense Evasion**.

  The primary telemetry source for this detection is Windows registry changes tracked through event logs. Specifically, it targets the registry path `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Office\Common\Security` and looks for a DWORD value change indicating runtime scanning has been disabled (value set to `0`). If left unaddressed, such modifications could enable the execution of malicious macros, which can lead to data breaches or system compromises. This detection does NOT confirm that malicious macros have executed, only that a disabling action has taken place.

  ### Investigation Steps

  - **Check for Registry Modification:** Review Windows Event Logs for registry changes, specifically **Security Event ID 4657**. Identify the target object `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Office\Common\Security\MacroRuntimeScanScope` being set to `0`.

  - **Correlate User and Host Context:** Validate the user account making the change. If the account does not have a legitimate need to modify these settings (e.g., an administrative account performing updates), this raises a flag for further investigation.

  - **Identify Recent Macro Activity:** Search for recent Microsoft Office macro executions using **Microsoft Office Application logs**. Look for logs indicating macro execution, especially those that were executed shortly after the registry change.

  - **Baseline Legitimate Behavior:** Determine baseline configurations for the organization's Office installations by verifying the expected `MacroRuntimeScanScope` values. Normally, this value should be `1` for enabled scanning. Compare against known environments to highlight anomalies.

  - **Review System Integrity:** Check for the presence of known malicious macros or VBA scripts in `C:\Users\<username>\AppData\Roaming\Microsoft\Word\` or similar folders. Utilize investigation tools to analyze any files marked for execution.

  - **Investigate Companion Detectors:** Look for alerts related to **T1059.001 - Command and Scripting Interpreter: PowerShell** or any other alerts indicating suspicious PowerShell command execution that may accompany macro exploitation.

  ### Prioritization

  This alert is classified as high severity due to the potential impact on critical systems that rely on Microsoft Office, where disabling security controls can lead to widespread malware infection. The likelihood of malicious abuse is significant, as attackers often leverage this technique to escalate privileges and achieve persistence through malicious macros, a method commonly weaponized in phishing campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by the potential for legitimate administrative changes made in a routine maintenance context, which could trigger false positives. Reliable detection requires comprehensive logging of registry changes, particularly across user sessions. This alert could also be triggered legitimately by software installations or updates that alter security settings. Related detections include monitoring for abnormal Office macro execution patterns, which can help strengthen overall security visibility.

