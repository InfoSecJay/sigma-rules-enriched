  ---

  ### Technical Context

  This rule detects unauthorized modifications to the `MacroRuntimeScanScope` registry key, which disables runtime scanning for enabled macros in Microsoft Office applications. Attackers may alter this registry key to evade detection by security controls, facilitating the execution of malicious macros. The likely attacker objective is to execute arbitrary code through macros without triggering security alerts.

  This detection is aligned with the MITRE ATT&CK technique: **Defense Evasion (T1562)**. Primary telemetry sources include Windows registry change logs with a focus on `registry_set` events. If the alteration is malicious, it may enable malware delivery via Office documents, compromising the system and potentially the broader environment. Importantly, this detection does NOT confirm that malicious macros are executed; it simply indicates an attempt to disable security features.

  ---

  ### Investigation Steps

  - **Review registry changes:** Check for the modification of `HKEY_CURRENT_USER\Software\Microsoft\Office\Common\Security\MacroRuntimeScanScope`, looking for a DWORD value of `0` in the most recent Windows Event ID 4657.

  - **Identify affected hosts:** Cross-reference the User and Hostnames logged during the registry change with your asset inventory to determine criticality and potential business impact.

  - **Examine user activity logs:** Check for unusual user activity in Office applications around the time of the registry modification, specifically monitoring Event ID 4688 for process creation related to `WINWORD.EXE` or `EXCEL.EXE`.

  - **Verify legitimate behavior:** Ensure that legitimate users with macro needs have explicit permission for macro usage, as indicated by their activity logs or approved document workflows, which should coincide with registry settings.

  - **Look for related artifacts:** Assess file creation timestamps and directory access for unusual files created in Office document locations that could belong to unintended macro executions, especially `*.docm` files that may have been opened after the registry change.

  ---

  ### Prioritization

  The severity of this alert is high due to the potential impact on critical systems where Microsoft Office is frequently used. The likelihood of malicious abuse through macro-based attacks is well-documented, making this behavior a commonly weaponized tactic among attackers.

  ---

  ### Blind Spots and Assumptions

  Possible evasion techniques include legitimate users disabling runtime scanning for valid purposes, thus leading to false positives. It’s crucial to ensure Windows Event Log settings are configured to capture registry changes comprehensively. Additionally, legitimate macro use for valid business processes may trigger this alert. A related detection is the monitoring of macro activity using **Office Macro Execution (T1203)**, which provides further coverage of macro-based threats.

