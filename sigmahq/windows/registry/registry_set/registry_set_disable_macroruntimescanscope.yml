note: |
  ### Technical Context
  This detection rule monitors changes to the `MacroRuntimeScanScope` registry key, which is associated with Microsoft Office applications. When an attacker modifies this key to set it to `0`, it disables the runtime scanning of Active Content and potentially allows malicious macros to execute without triggering alerts from security mechanisms such as the Antimalware Scan Interface (AMSI). The primary objective of this tactic is to evade detection and execute malicious payloads via embedded macros in documents, which can lead to a compromise through initial access or lateral movement within an enterprise environment.

  The relevant MITRE ATT&CK tactics include:
  - **Defense Evasion** (T1562): The attacker seeks to evade detection and protection mechanisms within the organizational infrastructure by disabling security features.

  Primary data sources that would provide evidence of this action include:
  - **Windows Registry Logs**: Specifically, monitoring for changes to the `HKEY_CURRENT_USER\Software\Microsoft\Office\Common\Security` registry path to observe modifications to the `MacroRuntimeScanScope` key.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows Registry for modifications to the `MacroRuntimeScanScope` key under `HKEY_CURRENT_USER\Software\Microsoft\Office\Common\Security`. Check for records indicating it has been set to `0`.

  - **Correlate with User Activity**: Identify any user activities that coincide with the changes to the registry key. Investigate recent document downloads, email attachments, or execution of macros to understand potential malicious intent.

  - **Analyze Process Activity**: Collect and analyze process creation events around the timestamp of the registry modification. Look for instances of Microsoft Office applications running with unusual parameters or executing suspicious scripts.

  - **Examine EDR Alerts**: If available, check Endpoint Detection and Response (EDR) systems for any alerts related to macro execution or suspicious process behavior around the time of the registry change. This could reveal additional layers of exploitation or lateral movement.

  ### Prioritization
  This alert is classified as high severity because disabling macro scan capabilities poses a significant risk to the organization, enabling attackers to execute potentially harmful macros without triggering protective measures. The likelihood of exploitation is also rated high, given the prevalence of macro-based attacks in phishing campaigns.

  ### Blind Spots and Assumptions
  There may be gaps in detection if the organization does not consistently monitor registry changes or lacks comprehensive logging policies that capture such events. The rule assumes that all changes to the `MacroRuntimeScanScope` key are malicious, which may not always be the case, especially in environments with legitimate administrative use. Additionally, the infrastructure must have appropriate logging enabled to capture registry key modifications effectively for this alert to function correctly.

