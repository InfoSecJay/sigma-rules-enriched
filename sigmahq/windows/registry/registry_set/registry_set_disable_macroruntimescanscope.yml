note: |
  ### Technical Context

  This Sigma rule detects attempts to disable the Macro Runtime Scan Scope registry key, which is used by Microsoft Office applications to enable runtime scanning of macros for malicious content. By modifying this key, an attacker seeks to bypass security mechanisms, increasing the likelihood of executing malicious macros that could download and execute further payloads or malware. This behavior is aligned with the MITRE ATT&CK framework, specifically under the tactic "Defense Evasion" (T1562) and technique "Modify Registry" (T1112).

  Primary telemetry sources include Windows registry modifications, particularly those tracked in Event ID 4657 (Registry Value modified) or relevant Sysmon Event ID 13 (Registry modification). If successful, this behavior can significantly impact security, allowing the execution of potentially harmful macro code undetected. Importantly, the detection of this registry change does NOT confirm that malicious macros are currently being executed; it only suggests an attempt to disable a protective measure.

  ### Investigation Steps

  - **Verify the Registry Key Change:** Check for Event ID 4657 indicating the modification of the registry key at `HKEY_CURRENT_USER\Software\Microsoft\Office\Common\Security\MacroRuntimeScanScope` to a DWORD value of 0. Confirm if the change was made without proper administrative authorization.

  - **Identify User Context:** Look for the user account making the registry change. Check if the account has legitimate business needs involving macros or if it’s a non-admin/user account with unusual activity patterns.

  - **Review Recent Office Activity:** Analyze user activity logs related to Microsoft Office around the time of the registry change. Look for Event ID 4688 (Process Creation) to identify if Office applications like Word or Excel were recently launched, especially in conjunction with macro execution contexts.

  - **Document Expected Business Use Cases:** Note common instances where macro functionality is typically enabled and evaluate if the registry modification aligns with legitimate macro use cases in your environment, such as automated reports or internal tools.

  - **Investigate for High-Confidence Malicious Indicators:** Use endpoint monitoring tools to check for known malicious macro scripts executed in conjunction with the registry modification. Look for file paths leading to temporary or AppData folders where malicious scripts may be stored (e.g., check for indicators relating to VBA scripting in Excel files).

  ### Prioritization

  This alert should be treated with high priority due to the potential for widespread impact. Modifying this registry key significantly enhances an attacker’s ability to deliver and execute malware through macros, an act commonly exploited in environments where Office applications are prevalent. The likelihood of malicious exploitation is high given the commonality of weaponized macros in attacks.

  ### Blind Spots and Assumptions

  This detection may be evaded by more sophisticated actors employing alternate registry paths or by utilizing tools designed to alter registry settings stealthily. Reliable detection relies on comprehensive logging for registry modifications, which must be correctly configured across all endpoints using Microsoft Office. Legitimate administrative changes for macro settings or user-initiated adjustments may trigger similar alerts. Companion detections, such as identifying unusual PowerShell or command line script execution (T1059.001), would provide additional context for confirming potential adverse activities.

