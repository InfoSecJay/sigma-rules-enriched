logsource:
  product: windows
  category: registry_set
detection:
  selection_edge:
    TargetObject|endswith: '\SOFTWARE\Policies\Microsoft\Edge\BuiltInDnsClientEnabled'
    Details: DWORD (0x00000001)
  selection_chrome:
    TargetObject|endswith: '\SOFTWARE\Google\Chrome\DnsOverHttpsMode'
    Details: 'secure'
  selection_firefox:
    TargetObject|endswith: '\SOFTWARE\Policies\Mozilla\Firefox\DNSOverHTTPS\Enabled'
    Details: DWORD (0x00000001)
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the enabling of DNS-over-HTTPS (DoH) across major web browsers: Microsoft Edge, Google Chrome, and Mozilla Firefox. The likely motivation for an attacker enabling DoH is to mask internet activities from security monitoring, thereby facilitating malicious actions such as data exfiltration without detection. The relevant MITRE ATT&CK techniques impacted are `Data Encrypted for Impact (T1140)` and `Application Layer Protocol Encapsulation (T1112)`.

  The primary telemetry sources are Windows Registry events that record modifications to specific DoH-related configurations under the relevant software keys for Edge, Chrome, and Firefox. If malicious, enabling DoH can significantly impair an organization's visibility into user internet traffic, making the detection of potentially harmful activities more difficult. However, this detection does NOT confirm malicious intent on its own, as legitimate users may enable DoH for privacy or performance reasons.

  ### Investigation Steps

  - **Check relevant registry keys:** Review Windows Registry changes for Event ID 4657 or Sysmon Event ID 13 to see if the `BuiltInDnsClientEnabled` (Edge), `DnsOverHttpsMode` (Chrome as 'secure'), or `DNSOverHTTPS\Enabled` (Firefox) values have changed. Look for values set to DWORD 1 or 'secure' as indicators of configuration enabling DoH.

  - **Validate user context:** Examine the user account that made the registry change. Check if the account has a history of suspicious behavior or if it is associated with legitimate business operations, as a known compromised account lessens the chances of benign intent.

  - **Analyze network traffic:** Use network telemetry to monitor outgoing DNS requests. Check if there are an unusual number of DoH-related connections or if DNS queries show patterns of obfuscation typical of malicious activity. Look for signatures of known exfiltration techniques using DoH.

  - **Review security policy exceptions:** Evaluate whether enabling DoH was formally approved as part of security policy exceptions. Documentation that confirms leadership approval points towards legitimate activity, whereas a lack of documentation raises suspicion.

  - **Identify registry changes during key events:** Cross-reference the registry change timestamp with system or application logs for potential related activities, such as the execution of other processes that may indicate exploitation attempts or lateral movement.

  ### Prioritization

  This alert should be treated with medium priority. Enabling DNS-over-HTTPS can grant an adversary the capability to mask malicious activities, representing a potential security risk. While the action itself is not inherently harmful, it can indicate preparatory steps by an adversary or be a sign of misconfigured or user-driven changes that could lead to exploitative outcomes.

  ### Blind Spots and Assumptions

  Detection is limited by the absence of monitoring on legitimate user activity with a justified basis for enabling DoH, which can lead to false positives. Required log sources include real-time registry change monitoring to ensure rapid detection of relevant modifications. Legitimate activities that may trigger this alert include users enabling DoH for privacy reasons. A related detection to strengthen coverage is monitoring for data exfiltration patterns over HTTPS connections, which may be used in conjunction with DoH to further obfuscate malicious traffic.

