title: DNS-over-HTTPS Enabled by Registry
id: 04b45a8a-d11d-49e4-9acc-4a1b524407a5
status: test
description: |
  Detects when a user enables DNS-over-HTTPS.
  This can be used to hide internet activity or be used to hide the process of exfiltrating data.
  With this enabled organization will lose visibility into data such as query type, response and originating IP that are used to determine bad actors.
references:
- https://www.tenforums.com/tutorials/151318-how-enable-disable-dns-over-https-doh-microsoft-edge.html
- https://github.com/elastic/detection-rules/issues/1371
- https://chromeenterprise.google/policies/?policy=DnsOverHttpsMode
- https://admx.help/HKLM/Software/Policies/Mozilla/Firefox/DNSOverHTTPS
author: Austin Songer
date: 2021-07-22
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1140
- attack.t1112
logsource:
  product: windows
  category: registry_set
detection:
  selection_edge:
    TargetObject|endswith: '\SOFTWARE\Policies\Microsoft\Edge\BuiltInDnsClientEnabled'
    Details: DWORD (0x00000001)
  selection_chrome:
    TargetObject|endswith: '\SOFTWARE\Google\Chrome\DnsOverHttpsMode'
    Details: 'secure'
  selection_firefox:
    TargetObject|endswith: '\SOFTWARE\Policies\Mozilla\Firefox\DNSOverHTTPS\Enabled'
    Details: DWORD (0x00000001)
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context
  This rule detects the enabling of DNS-over-HTTPS (DoH) within Windows-based systems by monitoring specific registry keys associated with popular web browsers such as Microsoft Edge, Google Chrome, and Mozilla Firefox. Enabling DoH can pose a significant risk to organizations by obscuring DNS queries, which could facilitate malicious activities, including data exfiltration and evasion of network security measures. Attackers may leverage this feature to avoid detection of their internet activity, limiting the ability for security teams to monitor and investigate suspicious behavior.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (TA0003)**, where attackers establish a foothold, and **Defense Evasion (TA0005)**, which encompasses techniques used to conceal their operations. Specifically, the technique **T1140: Deobfuscate/Decode Files or Information** may be relevant as enabling DoH could hide indicators of compromise typically visible in DNS query logs. Primary data sources for this detection include Windows registry changes, which can be captured through centralized logging solutions.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the registry keys for Edge, Chrome, and Firefox mentioned in the detection logic to confirm whether the settings have indeed changed to enable DNS-over-HTTPS.
  - **Correlate User Activity:** Look into the user activity logs around the time of the registry change to identify any correlating actions, such as unusual or unauthorized installations, particularly from admin-level accounts.
  - **Analyze Network Traffic:** Inspect network logs for DNS queries to verify if DNS traffic is being encrypted and if there's a lack of visibility regarding DNS resolution, which could indicate potential obfuscation of malicious traffic.
  - **Audit Endpoint Security Policies:** Check existing security policies and configurations for exceptions or misconfigurations that may have allowed the enabling of DoH without appropriate scrutiny.

  ### Prioritization
  This alert carries a medium severity due to the potential risk of masking malicious activities within the network. The likelihood of exploitation is high, especially in environments where sensitive data is handled, as attackers may leverage this feature to bypass monitoring mechanisms.

  ### Blind Spots and Assumptions
  This detection may not capture instances where DoH is enabled by legitimate user actions or group policies without malicious intent. The assumption is that any enabling of DoH in an enterprise environment is suspicious, as it hinders visibility. Additionally, the functionality of this alert relies on comprehensive logging of Windows registry changes, which must be adequately configured across all endpoints for effective detection.

