logsource:
  product: windows
  category: registry_set
detection:
  selection_edge:
    TargetObject|endswith: '\SOFTWARE\Policies\Microsoft\Edge\BuiltInDnsClientEnabled'
    Details: DWORD (0x00000001)
  selection_chrome:
    TargetObject|endswith: '\SOFTWARE\Google\Chrome\DnsOverHttpsMode'
    Details: 'secure'
  selection_firefox:
    TargetObject|endswith: '\SOFTWARE\Policies\Mozilla\Firefox\DNSOverHTTPS\Enabled'
    Details: DWORD (0x00000001)
  condition: 1 of selection_*
falsepositives:
- Unlikely
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the enabling of DNS-over-HTTPS (DoH) through specific registry modifications in Windows. Malicious actors may leverage DoH to obscure their internet activity, which can facilitate data exfiltration by masking the domains they communicate with. Relevant MITRE ATT&CK tactics and techniques include Persistence (T1547) and Defense Evasion (T1140). Primary telemetry sources are Windows Registry changes, primarily focusing on specific registry keys associated with major browsers (Edge, Chrome, and Firefox). The security impact is significant, as enabling DoH can compromise organizational visibility into network traffic, potentially allowing malicious actions to go undetected. Importantly, this detection does NOT confirm malicious intent or activity without further investigation.

  ### Investigation Steps

  - **Verify registry changes:** Check for modifications in the registry under `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Edge\BuiltInDnsClientEnabled` (DWORD value = 1), `HKEY_LOCAL_MACHINE\SOFTWARE\Google\Chrome\DnsOverHttpsMode` (value = 'secure'), or `HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Mozilla\Firefox\DNSOverHTTPS\Enabled` (DWORD value = 1). Legitimacy can be indicated if these changes were part of an approved organizational policy update.

  - **Cross-reference user permissions:** Investigate the user account that modified these registry keys by reviewing Security Event ID 4634 (logon) and Event ID 4624 (logon attempts). Look for accounts with administrative capabilities that may indicate a higher risk profile.

  - **Assess impacted systems' roles:** Determine the primary function of affected hosts, using asset management databases or Network Inventory reports. Workstations that have not been designated for testing DoH might indicate unauthorized changes.

  - **Analyze browser configurations:** Check the user’s browser settings or group policies for usage of DoH. In Chrome, check `chrome://settings/security` and in Edge, review `edge://settings/privacy`. Supported configurations may highlight legitimate use cases for DoH.

  - **Identify network traffic impact:** Review recent DNS query telemetry (if available) to confirm if there’s an absence of typical DNS traffic patterns that might correlate with the enabled DoH. Investigate for unusual spikes in encrypted DNS requests or sudden drops in expected DNS traffic patterns.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of affected systems, especially if they are used for sensitive processes. The lack of visibility into DNS queries increases the likelihood of malicious abuse, particularly from threat actors attempting to operate undetected. Though DoH can be used legitimately, its presence in sensitive environments is concerning.

  ### Blind Spots and Assumptions

  The detection relies heavily on registry changes that can be reverted or altered by users with sufficient privileges, which serves as a limitation. It does not capture benign activities such as the organization-wide policy enforcement for DoH. Appropriate registry auditing must be enabled for reliable detection. Additionally, alerts from companion detections regarding unusual outbound traffic may help correlate potential misuse of DoH capabilities.

