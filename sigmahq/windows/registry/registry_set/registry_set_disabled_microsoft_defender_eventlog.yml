  ---

  ### Technical Context

  This rule detects the modification of Windows Defender's event log settings, specifically when the event log for Windows Defender is disabled, as indicated by a registry change. The likely attacker objective is to evade detection of malicious activities by disabling a key security feature, facilitating the execution of malware such as Lockbit 3.0. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion, specifically technique T1562.001 (Disable or Modify Tools).

  The primary telemetry source is the Windows Registry, specifically changes to the registry path `\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational\Enabled` with a value of `0x00000000`. The security impact is significant, as disabling Windows Defender event logging can allow an attacker to carry out their operations unnoticed. Importantly, this detection does NOT inherently confirm malicious activity, as legitimate actions such as third-party antivirus installations may trigger similar registry changes.

  ---

  ### Investigation Steps

  - **Verify Registry Change: ** Inspect the Windows Registry on the affected host: Look for changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational\Enabled` with a value of `0x00000000`. Document any legitimate software installations that coincide with this change.

  - **Identify Recent Activity: ** Review Security Event ID 4688 (process creation) logs in conjunction with Sysmon Event ID 1 on the affected host for any unusual process launches around the time of the registry change. Look for processes that are commonly associated with ransomware or other malware activity.

  - **Analyze Associated Logs: ** Check Windows Event logs for any entries that reference the disabling of Windows Defender, specifically Event ID 5008 (Windows Defender operational log events). Compare timestamps to the registry modification time for correlation.

  - **Correlate with Other Indicators: ** Utilize EDR (Endpoint Detection and Response) tools to search for any behaviors indicative of malware such as unusual outbound network connections or file modifications on critical directories (e.g., C:\ProgramData).

  - **Assess Host Role and Criticality: ** Determine the role of the affected host (e.g., Domain Controller, File Server). High-value assets being impacted warrant more immediate investigation due to potential data compromise.

  - **Document Legitimate Software Presence: ** Confirm if there are legitimate applications (e.g., other antivirus solutions) installed on the host that could warrant the registry change. Collect installation logs or details to support findings.

  ---

  ### Prioritization

  The alert is of high severity due to the direct impact on security monitoring capabilities if Windows Defender event logging is disabled. The likelihood of malicious abuse is elevated as this technique is commonly utilized by adversaries to facilitate malware deployments and maintain persistence undetected.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate activities, such as the installation of third-party security software, which could also modify the Defender event log settings. This rule relies on targeted registry monitoring, and failure to capture registry changes may lead to undetected alterations. Related detections include monitoring for unusual process behaviors (e.g., T1059 for command-line interfaces) that may complement this alert, increasing overall investigative coverage.

