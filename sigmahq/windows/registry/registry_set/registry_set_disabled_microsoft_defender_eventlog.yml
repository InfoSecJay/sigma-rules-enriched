note: |
  ### Technical Context

  This rule detects changes to the Windows Registry that disable the Windows Defender event log, specifically by altering the corresponding DWORD value to '0'. This behavior is typically associated with attackers attempting to evade detection mechanisms during a compromise. The likely objective of the attacker is to hinder forensic analysis and reduce audit capabilities, especially during ransomware attacks like LockBit 3.0. This behavior is mapped to the MITRE ATT&CK framework under the tactic of Defense Evasion (ID: T1562.001).

  The primary telemetry source for this detection is Windows Registry logs, specifically monitoring changes to the registry path: `\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational`. The security impact can be severe, as disabling this log may prevent security teams from identifying malicious activities. Importantly, this detection does not confirm an active compromise by itself; it merely indicates a potential evasion technique requiring further investigation.

  ### Investigation Steps

  - **Check event log status before the change:** Review the registry key for previous values at `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational`, indicating it was previously enabled (DWORD value of ‘1’).

  - **Identify recent changes to the registry:** Look for Registry Event ID 4657 which indicates changes to the registry. Pay close attention to the `TargetObject` and `NewValue` fields indicating a registry modification to the Windows Defender event log.

  - **Examine the process that made the changes:** Look up Security Event ID 4688 to identify the process that executed any registry modification command. A legitimate process (e.g., `reg.exe`, `PowerShell.exe`) should raise less suspicion than unknown or suspicious executables.

  - **Assess for other indicators of compromise (IOC):** Review Windows Defender and Security Event logs for any concurrent threats detected around the time the log was disabled. Look for indications of known malware signatures or alerts.

  - **Determine the context of the host:** Check if the affected system serves a critical role in the network (e.g., domain controller or file server) and evaluate if there are existing legitimate processes that might cause temporary disablement during maintenance.

  ### Prioritization

  The alert is high-severity due to the significant risk of detection evasion, particularly on critical systems. The likelihood of malicious abuse is heightened, especially in coordination with known ransomware activities. Disabling Windows Defender event logging is a common tactic to mask further malicious behavior.

  ### Blind Spots and Assumptions

  Detection may be limited if other security solutions could trigger similar registry changes without raising alerts. It assumes proper monitoring of Windows Registry changes is enabled and that valid configurations support logging for event ID 4657. Legitimate activities (such as the installation of alternative antivirus solutions) may also result in similar alerts. A related detection to consider is monitoring for unauthorized installation attempts or changes to other essential security settings.

