note: |
  ### Technical Context

  This rule detects the disabling of the Windows Defender event log by monitoring specific registry changes that set the operational log to disabled (DWORD = 0). This behavior is often associated with malware infections, particularly ransomware like Lockbit 3.0, which aims to evade detection by compromised systems. The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005), and the associated technique is "Indicator Removal on Host" (T1685). The primary telemetry sources include Windows Registry changes, specifically monitoring for event log settings under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational`. If exploited maliciously, this action can significantly reduce the system's security posture, making it difficult to detect ongoing threats. Importantly, this detection does NOT confirm a successful compromise by itself but highlights a potential vulnerability.

  ### Investigation Steps

  - **Check registry modifications:** Query registry entries for changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Windows Defender/Operational\Enabled` (REG_DWORD) to confirm if it has been set to 0. Look for Event ID 4657: "Registry value modified."

  - **Validate system processes:** Review processes running on the system around the time of the registry change. Look for suspicious processes by analyzing Process Creation events (Sysmon Event ID 1) that may correlate with known exploitation patterns.

  - **Identify legitimate activity:** Search for scheduled tasks or legitimate software installations (like security software). Check if associated processes spike around the same timestamps using Event ID 4697: "A service was installed in the system."

  - **Detect malicious user activity:** Investigate user activity on the affected host for unusual account behavior or logins around the registry modification. Look for failed logins or privileged account use in Security Event IDs 4624 and 4625.

  - **Correlate with threat intelligence:** Cross-reference IP addresses, hashes, or domains involved with any recent registry changes with threat intelligence feeds to identify any links to ransomware or other known threats.

  ### Prioritization

  This alert is assigned high severity due to the critical role of Windows Defender in endpoint protection. The likelihood of malicious abuse is elevated, especially considering its association with ransomware operations. Disabling security features is a common tactic among adversaries to facilitate further malicious actions.

  ### Blind Spots and Assumptions

  Detection may be limited by the inactivity of registry logging or other third-party antivirus software that also modifies these settings, potentially causing false positives. Ensure Windows Event Log and Registry Auditing are enabled for reliable detection. Legitimate activities like updates or security software installations may trigger this alert. A related detection to consider includes monitoring for unusual user account creation events (Event ID 4720) as an adjunct for comprehensive threat hunting.

