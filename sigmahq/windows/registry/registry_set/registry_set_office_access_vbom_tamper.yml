note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry specifically targeting the `AccessVBOM` value within Microsoft Office, setting it to `1`. This change disables trust access to Visual Basic for Applications (VBA) projects in Microsoft Office applications, potentially facilitating the execution of malicious macros without user warnings or prompts. The likely objective of a threat actor modifying this registry key is to leverage automated scripting in Office documents for malicious tasks, such as retrieving or exfiltrating data.

  Relevant MITRE ATT&CK techniques include T1112 - Modify Registry, which corresponds to the "Defense Impairment" tactic. The primary telemetry source includes Windows Registry logs, specifically looking for events related to registry modifications. If malicious, this detection can lead to significant impacts, including increased risk of unauthorized access and potential data exfiltration via malicious macros. Importantly, this detection alone does not confirm malicious intentions or activity without further contextual investigation.

  ### Investigation Steps

  - **Check registry value modifications:** Review the registry at `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Security\AccessVBOM` for the value being set to `1`. Note the timestamp and the user account associated with the change.

  - **Correlate user activity:** Look for unusual activity from the user account associated with the registry change. Investigate Windows Security Event ID 4624 (logon events) to determine if the account was recently used or if it has a history of suspicious behavior.

  - **Review the document file system for VBA projects:** Examine recent document file activity via Windows Event ID 4663 (file access) in the directory containing Office files. This can indicate if a document was opened that may contain macros, especially by the affected user.

  - **Identify macro execution logs:** Check the Office Application logs for any macro executions around the time of the registry change. Look for records of macros being run (these will be efficiently captured in the user’s Office application logs, such as Word or Excel logs).

  - **Assess for high-confidence malicious indicators:** Search for any associated alerts or indicators from antivirus or EDR solutions that may have flagged recent macro activity as malicious. This could be corroborated by seeing references to known malware (e.g., Zloader) in those alerts.

  - **Understand legitimate usage scenarios:** Determine if there are known instances where the `AccessVBOM` registry value might be legitimately modified—such as administrative deployments or user requests for macro usage in controlled environments—to better distinguish between benign and malicious activity.

  ### Prioritization

  This alert holds a high severity due to its potential impact on the integrity of Office documents and the likelihood of abuse by adversaries to execute unwanted code. The modification of trust access to VBA presents a commonly weaponized technique that attackers leverage to bypass security warnings.

  ### Blind Spots and Assumptions

  Detection may be limited if the necessary logging for registry changes is not consistently enabled across the enterprise environment. Legitimate administrative tasks may prompt similar registry modifications, introducing noise to the alert. It's crucial to verify that detailed logging is capturing registry changes reliably. A related detection that strengthens coverage would include monitoring for unusual macro execution and scripting activity (e.g., T1059 - Command and Scripting Interpreter) to provide context for the registry modifications.

