  ### Technical Context

  This Sigma rule detects changes to the Windows registry key for Microsoft Office's "AccessVBOM," specifically when its value is set to "1." This modification disables trust access to the Visual Basic for Applications (VBA) environment, allowing attackers to run malicious macros without prompting the user. The likely objective of an attacker exploiting this configuration is to execute malicious VBA code seamlessly, facilitating persistence and data exfiltration. Relevant MITRE ATT&CK tactics and techniques include Persistence (T1547) and Defense Evasion (T1112).

  The primary telemetry sources for this detection are Windows Registry logs capturing changes to the registry keys. If the rule is triggered by malicious activity, the associated impact could allow malware to operate without user consent, leading to potential data breaches. It is important to note that this detection alone does not confirm malicious intent, as legitimate users or system administrators may also modify registry settings for valid purposes.

  ### Investigation Steps

  - **Examine the registry change event:** Check Windows Security Event ID 4657 for registry modifications related to `\Security\AccessVBOM`. Identify the user account and create time to discern if the activity is tied to a non-standard user.

  - **Determine the asset's role:** Verify if the affected system is used for development or testing where VBA macros are commonly utilized, which may make changes to this registry key legitimate.

  - **Correlate with Office application activity:** Review application logs for Microsoft Office (e.g., Event ID 3542 for Office Application events) to identify if any macros were executed post-change, helping establish the context of the modification.

  - **Identify high-confidence malicious indicators:** Look for related event logs showing the execution of VBA macros (e.g., Event ID 4688 for process creation) following the registry change. This could indicate potential malicious use of macros.

  - **Validate associated artifacts:** Check if malicious files or scripts (e.g., `.vbs` or Office macro-enabled documents) were created or executed around the time of the registry modification, indicating potential exfiltration or lateral movement activities.

  ### Prioritization

  This alert should be treated with high severity due to the potential for widespread impact if an attacker can leverage unmonitored macros on a system. The ability to disable warnings around VBA allows for easily weaponizable payload delivery, posing a serious risk to data integrity and confidentiality.

  ### Blind Spots and Assumptions

  This detection relies on specific registry change events, so any obfuscation methods that do not trigger standard logging may go unnoticed. Organizations must ensure that adequate logging is in place for registry changes. Legitimate activities, such as software testing or administration tasks, could also trigger this alert. Companion detections for macro execution (e.g., monitoring Office process creation) can strengthen coverage against potential exploitation by malicious actors.

