note: |
  ### Technical Context
  This rule detects registry modifications to the Microsoft Office setting known as "AccessVBOM", specifically looking for changes that set the value to "1". When this setting is enabled, it disables trust access for Visual Basic for Applications (VBA) macros, allowing potential attackers to execute malicious macros without standard security warnings. This behavior is often exploited in threats such as the Zloader malware, which can use social engineering tactics to trick users into executing malicious documents.

  The likely attacker objectives are to bypass standard Microsoft Office protections, enabling the use of malicious macros to execute arbitrary code or to gain persistence on the target machine. This detection aligns with the MITRE ATT&CK framework, particularly with the following tactics and techniques:
  - **Persistence (T1547)**: The setting allows the persistence of malicious macros.
  - **Defense Evasion (T1112)**: By disabling the security warning for macros, attackers can evade standard defenses.

  Primary data sources useful for this detection include:
  - Windows Registry logs that capture changes to the target registry key.
  - Event logs related to Microsoft Office activity, which may provide context on the execution of VBA scripts.

  ### Investigation Steps
  - **Review Registry Changes**: Examine Windows Registry logs, focusing on the `\Security\AccessVBOM` path to confirm any recent changes that set this value to "1".
  - **Monitor Office Application Activity**: Check event logs for application events related to Microsoft Office, particularly for unusual macro executions following the registry change.
  - **Analyze User Activity**: Look for any user actions that might correlate with the time of the registry change, such as the opening of documents containing VBA macros or the download of suspicious files.
  - **Cross-Reference Threat Intelligence**: Use threat intelligence feeds to validate if the detected behavior correlates with known malware campaigns, such as any recent incidents involving Zloader or similar threats.

  ### Prioritization
  This alert is of high severity in an enterprise environment due to its direct implications for the integrity of systems and potential data breaches. Malicious use of VBA macros can lead to unauthorized execution of code and compromise sensitive information or access within the network.

  ### Blind Spots and Assumptions
  Current detection may overlook scenarios where the registry change is made via legitimate administrative actions or other benign processes, leading to potential false positives. The logic assumes that any modification to the AccessVBOM value to "1" is malicious, which may not always hold true. It requires access to complete registry logs and sufficient logging of administrative actions to capture such changes reliably for effective detection.

