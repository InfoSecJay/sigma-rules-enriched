logsource:
  category: registry_set
  product: windows
detection:
  selection_service_start:
    TargetObject|startswith: 'HKLM\System\CurrentControlSet\Services\'
    TargetObject|endswith: '\Start'
    Image|contains:
    - '\Users\Public\'
    - '\Perflogs\'
    - '\ADMIN$\'
    - '\Temp\'
    Details:
    - 'DWORD (0x00000000)'          # boot
    - 'DWORD (0x00000001)'          # System
    - 'DWORD (0x00000002)'          # Automatic
            # 3 - Manual , 4 - Disabled
  selection_service_imagepath:
    TargetObject|startswith: 'HKLM\System\CurrentControlSet\Services\'
    TargetObject|endswith: '\ImagePath'
    Details|contains:
    - '\Users\Public\'
    - '\Perflogs\'
    - '\ADMIN$\'
    - '\Temp\'
  filter_optional_avast:
    Image|contains|all:     # Filter FP with Avast software
    - '\Common Files\'
    - '\Temp\'
  filter_optional_mbamservice:
    TargetObject|endswith: '\CurrentControlSet\Services\MBAMInstallerService\ImagePath'
    Details|endswith: '\AppData\Local\Temp\MBAMInstallerService.exe"'
    Image: 'C:\Windows\system32\services.exe'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the creation of a Windows service that utilizes a binary located in directories commonly associated with suspicious activity, such as `\Users\Public\`, `\Perflogs\`, `\ADMIN$\`, or `\Temp\`. The likely objective of an attacker is to establish persistence or execute malicious payloads stealthily. This behavior aligns with the MITRE ATT&CK tactic for Persistence (TA0003) and specifically the technique that involves creating or modifying services (T1112). The primary telemetry sources are Windows Registry logs that monitor changes to the `HKLM\System\CurrentControlSet\Services\` path, especially Service Start and Image Path keys.

  If malicious, this detection can lead to unauthorized access, data exfiltration, or system control ramifications, potentially impacting overall enterprise security significantly. However, this detection does NOT confirm malicious intent on its own; further analysis is required to establish whether the service is indeed harmful or benign.

  ### Investigation Steps

  - **Review service creation details:** Check Windows Registry Event ID 4657 for changes to `HKLM\System\CurrentControlSet\Services\`. Focus on any corresponding Image Path entries pointing to suspicious directories.

  - **Validate service configuration:** Cross-reference Event ID 7045, which logs service installation, to identify if the service is legitimate. Verify the service name against trusted services to differentiate between expected and likely malicious indicators.

  - **Check for high-confidence malicious indicators:** Look at Event ID 4688 for process creation logs to identify if the service executable executed from a suspicious directory. Pay special attention to processes spawning from `C:\Windows\system32\services.exe` as this indicates service interaction.

  - **Identify expected behavior of legitimate services:** Review known service entries, especially those tied to security software and OS components. Characteristics like installation paths for legitimate services are typically found in `C:\Program Files` or `C:\Windows\`.

  - **Correlate with monitoring tools:** Validate telemetry from SIEM or other monitoring tools for files being created or modified in the suspicious directories mentioned. Include examination of file creations and modifications in `C:\Temp\` and `C:\Users\Public\`.

  - **Consider host role:** Assess the role of the affected host; if it’s a domain controller or critical infrastructure, escalate the investigation. Unusual service changes on these systems could indicate serious compromise.

  ### Prioritization

  This alert should be treated with high severity, as a service running from a suspicious location can indicate active persistence mechanisms employed by adversaries. The potential impact is significant if critical systems are affected, and while service creation is a common technique, its misuse is increasingly weaponized in attacks.

  ### Blind Spots and Assumptions

  This detection may miss services that evade scrutiny by using corporate software installation paths or services created in legitimate directories that are later manipulated. Reliable detection requires comprehensive logging frameworks like Audit Policy to include registry access. Legitimate activities that may trigger this alert include software installations or updates. A related detection rule monitoring unauthorized network connections or privileged user creation could strengthen overall security visibility.

