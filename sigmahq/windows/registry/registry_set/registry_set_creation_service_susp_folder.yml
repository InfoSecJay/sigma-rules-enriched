logsource:
  category: registry_set
  product: windows
detection:
  selection_service_start:
    TargetObject|startswith: 'HKLM\System\CurrentControlSet\Services\'
    TargetObject|endswith: '\Start'
    Image|contains:
    - '\Users\Public\'
    - '\Perflogs\'
    - '\ADMIN$\'
    - '\Temp\'
    Details:
    - 'DWORD (0x00000000)'          # boot
    - 'DWORD (0x00000001)'          # System
    - 'DWORD (0x00000002)'          # Automatic
            # 3 - Manual , 4 - Disabled
  selection_service_imagepath:
    TargetObject|startswith: 'HKLM\System\CurrentControlSet\Services\'
    TargetObject|endswith: '\ImagePath'
    Details|contains:
    - '\Users\Public\'
    - '\Perflogs\'
    - '\ADMIN$\'
    - '\Temp\'
  filter_optional_avast:
    Image|contains|all:     # Filter FP with Avast software
    - '\Common Files\'
    - '\Temp\'
  filter_optional_mbamservice:
    TargetObject|endswith: '\CurrentControlSet\Services\MBAMInstallerService\ImagePath'
    Details|endswith: '\AppData\Local\Temp\MBAMInstallerService.exe"'
    Image: 'C:\Windows\system32\services.exe'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a Windows service with its executable binary located in suspicious directories, such as `\Users\Public\`, `\Perflogs\`, `\ADMIN$\`, or `\Temp\`. The likely objective of an attacker would be to establish persistence on a compromised system by placing a service in a directory that is less scrutinized and commonly overlooked during routine auditing. This behavior is associated with the MITRE ATT&CK technique for Persistence, specifically T1112.

  The primary telemetry source for this detection is Windows Registry logs, specifically under the path `HKLM\System\CurrentControlSet\Services\`. If these services are malicious, they could lead to unauthorized access or control over the system. It is important to note that the creation of a service in these directories does NOT automatically prove malicious intent; legitimate software may also utilize similar paths.

  ### Investigation Steps

  - **Examine service creation logs**: Investigate Registry Event IDs related to service creation from `HKLM\System\CurrentControlSet\Services\`. Look for log entries that indicate services were created with binaries located in suspicious directories such as `\Users\Public\` and `\Temp\`.

  - **Assess service configuration details**: Review the service properties, particularly the `ImagePath` values related to new services. Legitimate services typically reference `C:\Program Files\` or other standard locations; anything pointing to `\Temp\` or similar suspicious paths should be flagged.

  - **Identify high-confidence indicators of compromise**: Look for services created with `DWORD (0x00000001)` (Automatic start type) or `DWORD (0x00000002)` (Manual start type) along with an `ImagePath` value that indicates execution from a suspicious directory. This combination is a strong indicator of potentially malicious activity.

  - **Check installed software for false positives**: Cross-reference the affected service with known software that may legitimately utilize `\Common Files\` or `\Temp\`. Validate the context of the service being created to rule out benign activity—especially focusing on software like endpoint protection that may legitimately install services.

  - **Perform process-related investigations**: Investigate any instances of `services.exe` (System Process) that execute with paths indicating potential compromise. Look for unusual command-line arguments or parent processes that do not align with typical service launches.

  ### Prioritization

  The alert should be treated as high severity, particularly if the affected system is critical within the enterprise network (e.g., domain controllers, file servers). The likelihood of malicious abuse is elevated because attackers frequently exploit overlooked directories to maintain persistence. This behavior is often weaponized in attack scenarios to instigate further compromises within a network.

  ### Blind Spots and Assumptions

  The detection may miss sophisticated evasion techniques, such as attackers using standard service paths or cascading service installations that obscure the malicious activity within legitimate-looking processes. Reliable detection also depends on comprehensive auditing of Windows Registry changes; if logging is insufficiently configured or disabled, this could result in missed detections. Be aware that legitimate administrative tools may trigger this alert when they create services for proper functionality. A related detection rule monitoring service configurations across all systems can enhance overall visibility and response capabilities.

