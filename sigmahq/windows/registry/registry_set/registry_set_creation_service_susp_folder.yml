logsource:
  category: registry_set
  product: windows
detection:
  selection_service_start:
    TargetObject|startswith: 'HKLM\System\CurrentControlSet\Services\'
    TargetObject|endswith: '\Start'
    Image|contains:
    - '\Users\Public\'
    - '\Perflogs\'
    - '\ADMIN$\'
    - '\Temp\'
    Details:
    - 'DWORD (0x00000000)'          # boot
    - 'DWORD (0x00000001)'          # System
    - 'DWORD (0x00000002)'          # Automatic
            # 3 - Manual , 4 - Disabled
  selection_service_imagepath:
    TargetObject|startswith: 'HKLM\System\CurrentControlSet\Services\'
    TargetObject|endswith: '\ImagePath'
    Details|contains:
    - '\Users\Public\'
    - '\Perflogs\'
    - '\ADMIN$\'
    - '\Temp\'
  filter_optional_avast:
    Image|contains|all:     # Filter FP with Avast software
    - '\Common Files\'
    - '\Temp\'
  filter_optional_mbamservice:
    TargetObject|endswith: '\CurrentControlSet\Services\MBAMInstallerService\ImagePath'
    Details|endswith: '\AppData\Local\Temp\MBAMInstallerService.exe"'
    Image: 'C:\Windows\system32\services.exe'
  condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_creation_service_susp_folder/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of Windows services that point to binaries stored in suspicious directories such as `\Users\Public\`, `\Perflogs\`, `\ADMIN$`, and `\Temp`. These directories are commonly used by adversaries to obfuscate their activities, potentially intending to establish persistence or to run malicious payloads. The likely attacker objective is to leverage a service for remote access, execution of malware, or to maintain persistence on the compromised system.

  This detection relates to MITRE ATT&CK tactics for Persistence (T1547) as well as Defense Evasion (T1112). The primary telemetry sources include Windows Registry logs, specifically targeting service creation attempts (e.g., `HKLM\System\CurrentControlSet\Services\`). If malicious, the establishment of such a service could allow an attacker to execute arbitrary code with system-level privileges. Importantly, this detection does NOT confirm that malicious activity is occurring on its own; further investigation is required to establish intent.

  ### Investigation Steps

  - **Verify Service Creation Events:** Check for Registry Event IDs related to the creation of services (Event ID 7045) to confirm if the suspicious directories were used for `ImagePath` or `Start` entries.

  - **Inspect the Service Properties:** For any identified service, evaluate the `ImagePath` (Registry Key: `HKLM\System\CurrentControlSet\Services\<ServiceName>\ImagePath`) for known legitimate binaries and any command-line arguments associated with it.

  - **Determine Execution Context:** Analyze the parent process (using Sysmon Event ID 1) that spawned the service. Look for unusual parent processes such as `cmd.exe` or `powershell.exe` that may indicate malicious intent.

  - **Identify Legitimate Behavior:** Compare against baseline configurations; many enterprise systems will have known services running from standard directories like `C:\Program Files\`. Document expected service paths and configurations for average deployed applications.

  - **Correlate with Other Alerts:** Review for any accompanying suspicious activity, such as increased network traffic from the service or previous alerts related to lateral movement (e.g., RDP access from unusual locations, Event ID 4624).

  - **Evaluate for Malicious Indicators:** Identify if the service is launching executables from the `\Temp\` directory, especially those with non-standard naming or newly created executables (using file creation timestamps and hashes).

  ### Prioritization

  This alert should be prioritized as high due to the potential impact on system integrity and the likelihood of malicious abuse, as services are often leveraged by adversaries to execute persistent malware. Additionally, the behavior described is commonly weaponized for establishing persistence in compromised environments.

  ### Blind Spots and Assumptions

  Detection may have limitations, as attackers can place binaries in less common directories or may clear Registry entries after execution. Reliability depends on having proper logging enabled for Windows Registry activity and ensuring that the environment logs service creation events consistently. Legitimate applications may create or modify services in these directories during updates or system maintenance, such as system management software. Companion detections such as monitoring for unusual outbound connections from these services can enhance the overall detection capability.

