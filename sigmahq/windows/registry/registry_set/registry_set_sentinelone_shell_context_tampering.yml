title: Potential SentinelOne Shell Context Menu Scan Command Tampering
id: 6c304b02-06e6-402d-8be4-d5833cdf8198
status: test
description: Detects potentially suspicious changes to the SentinelOne context 
  menu scan command by a process other than SentinelOne.
references:
- https://mrd0x.com/sentinelone-persistence-via-menu-context/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-03-06
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\shell\SentinelOneScan\command\'
  filter_main_sentinelone_default_scan_binary:
    Details|startswith:
    - 'C:\Program Files\SentinelOne\Sentinel Agent'
    - 'C:\Program Files (x86)\SentinelOne\Sentinel Agent'
    Details|contains: '\SentinelScanFromContextMenu.exe'
  filter_main_sentinelone_binary:
    Image|endswith:
    - 'C:\Program Files\SentinelOne\'
    - 'C:\Program Files (x86)\SentinelOne\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the SentinelOne context menu scan command in the Windows Registry, indicating potential tampering by a process not associated with SentinelOne. Such alterations could enable an attacker to execute malicious commands or alter security settings stealthily. This behavior aligns with the MITRE ATT&CK tactic of **Persistence** (TA0003) and the technique of **Modify Existing Service** (T1559). The primary telemetry source comes from Windows Registry log entries, specifically targeting changes under the path containing `\shell\SentinelOneScan\command\`. If malicious, these modifications expose the system to unauthorized scanning or execution of harmful payloads. Importantly, this detection does NOT confirm that the behavior is inherently malicious; further analysis is needed to assess intent.

  ### Investigation Steps

  - **Identify Registry Changes**: Examine Windows Registry for Event ID or tool-specific logs reflecting changes at `HKEY_CLASSES_ROOT\*\shell\SentinelOneScan\command\`. Look for unexpected modifications not made by SentinelOne processes, particularly if the `Details` field shows commands that deviate from expected settings.

  - **Correlate Process Execution**: Investigate process creation logs (Event ID 4688) to identify any processes that changed the SentinelOne context menu command. Focus on those not originating from `C:\Program Files\SentinelOne\` or `C:\Program Files (x86)\SentinelOne\`, which could point to suspicious activity.

  - **Review Legitimate Context Menu Behavior**: Validate normal SentinelOne context menu operations by identifying processes using the registered command (e.g., `SentinelScanFromContextMenu.exe`) expected to trigger legitimate scans. Analyze whether these match typical usage patterns.

  - **Analyze Parent-Child Process Relationships**: Use Sysmon Event ID 1 to investigate parent-child process relationships for the detected command modifications. Look for relationships involving anomalous or known malicious executables that initiated tampering.

  - **Check for File Artifacts**: Look for the creation or modification of any unusual temporary files related to the SentinelOne executable or context menu command at the file system level (e.g., log files or application data folders). Validate timestamps and compare them against user activity.

  - **Review for Evasion Techniques**: Consider potential legitimate scenarios that might trigger the alert, such as software updates or administrative changes. However, be aware of techniques such as direct Registry access by malware to modify the command without proper logging.

  ### Prioritization

  This alert signifies medium severity due to its potential impact on security posture. Unauthorized changes to security software commands implicate high-risk scenarios that could be weaponized by attackers for persistence. The likelihood of abuse is moderate, given the specific context of tampering and the critical role of continuous endpoint protection.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by advanced threats which may manipulate the Registry without leaving clear logs or indicators. Reliable detection requires consistent monitoring of Registry changes from both the Windows event log and SentinelOne logs. Various administrative activities, such as legitimate software updates, may unintentionally trigger the alert. Complementary detections like monitoring for known malicious executions in the context of SentinelOne or enhancements for endpoint detection can reinforce overall security coverage.

