title: Potential SentinelOne Shell Context Menu Scan Command Tampering
id: 6c304b02-06e6-402d-8be4-d5833cdf8198
status: test
description: Detects potentially suspicious changes to the SentinelOne context menu
  scan command by a process other than SentinelOne.
references:
- https://mrd0x.com/sentinelone-persistence-via-menu-context/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-03-06
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\shell\SentinelOneScan\command\'
  filter_main_sentinelone_default_scan_binary:
    Details|startswith:
    - 'C:\Program Files\SentinelOne\Sentinel Agent'
    - 'C:\Program Files (x86)\SentinelOne\Sentinel Agent'
    Details|contains: '\SentinelScanFromContextMenu.exe'
  filter_main_sentinelone_binary:
    Image|endswith:
    - 'C:\Program Files\SentinelOne\'
    - 'C:\Program Files (x86)\SentinelOne\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized modifications to the SentinelOne context menu scan command, which may indicate attempts by an attacker to persist their malicious code. The scenario entails an adversary gaining access to a Windows system and tampering with the context menu to redirect the legitimate SentinelOne scan action to potentially malicious payloads, thereby evading detection. The likely attacker objectives include maintaining persistence and evading security controls while executing malicious actions disguised as legitimate processes.

  Relevant MITRE ATT&CK tactics include **Persistence (TA0003)** and **Privilege Escalation (TA0004)**, as modifying system behavior can allow an attacker to maintain access without raising alarms. Techniques like **Registry Run Keys/Startup Folder (T1060)** may apply due to the involvement of registry changes related to program execution context. The primary data sources that provide the best evidence for this detection include registry modification logs, particularly those detailing changes in the context menu commands associated with SentinelOne.

  ### Investigation Steps
  - **Review Registry Changes:** Examine registry set logs that reference `\shell\SentinelOneScan\command\` for any unauthorized modifications or anomalies made by non-SentinelOne processes.
  - **Analyze Process Creation Events:** Correlate timestamps of registry changes with process creation events to identify unusual processes or commands executed that coincide with the detected tampering.
  - **Assess File Integrity:** Investigate the integrity of `SentinelScanFromContextMenu.exe` and its parent directory to ensure no malicious executable has replaced or modified the legitimate one.
  - **Check for Persistence Mechanisms:** Look for other indicators of persistence in the Windows environment that may accompany the context menu changes, such as additional registry keys, scheduled tasks, or startup items being modified.

  ### Prioritization
  The alert is rated medium severity due to the potential for undetected malicious activity that threatens the integrity of security solutions like SentinelOne. As these modifications could lead to persistent malware on affected systems, prompt investigation is warranted to mitigate risks.

  ### Blind Spots and Assumptions
  This detection logic may miss tampering originating from processes that have valid signatures or authorized access. It assumes that all relevant logs for registry modifications are being captured correctly and that the appropriate monitoring of the Windows registry is underway. Required configurations include enabling detailed auditing on sensitive registry keys to ensure comprehensive visibility into any unauthorized changes.

