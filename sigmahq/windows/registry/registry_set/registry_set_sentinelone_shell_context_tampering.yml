title: Potential SentinelOne Shell Context Menu Scan Command Tampering
id: 6c304b02-06e6-402d-8be4-d5833cdf8198
status: test
description: Detects potentially suspicious changes to the SentinelOne context 
  menu scan command by a process other than SentinelOne.
references:
- https://mrd0x.com/sentinelone-persistence-via-menu-context/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-03-06
modified: 2026-11-01
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\shell\SentinelOneScan\command\'
  filter_main_sentinelone_default_scan_binary:
    Details|startswith:
    - 'C:\Program Files\SentinelOne\Sentinel Agent'
    - 'C:\Program Files (x86)\SentinelOne\Sentinel Agent'
    Details|contains: '\SentinelScanFromContextMenu.exe'
  filter_main_sentinelone_binary:
    Image|startswith:
    - 'C:\Program Files\SentinelOne\'
    - 'C:\Program Files (x86)\SentinelOne\'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the SentinelOne context menu scan command. Such changes typically suggest that an adversary is attempting to establish persistence or evade detection by altering how malware interacts with SentinelOne’s protective features. The likely attacker objective is to compromise endpoint defenses while maintaining control over the system.

  The relevant MITRE ATT&CK tactic is **Persistence** (T1547) and the technique is **Registry Run Keys / Startup Folder** (T1060). The primary telemetry source is Windows Registry changes, specifically targeting the context menu commands under the SentinelOne installation paths. If malicious, this activity can lead to compromised endpoint security, enabling adversaries to deploy malware that operates with reduced oversight. This detection does NOT confirm malicious intent on its own; benign actors may also modify registry keys for legitimate purposes.

  ### Investigation Steps

  - **Check Registry Changes:** Review registry key changes at `HKEY_CLASSES_ROOT\*\shell\SentinelOneScan\command\` using Event ID 4657. Verify if an unexpected process modified this key. Look for legitimate SentinelOne process IDs (e.g., `SentinelAgent.exe`) engaging in the change versus anomalous processes like PowerShell or cmd.exe.

  - **Validate Process Ownership:** For any suspicious modifications, cross-reference the modifying process’s owner. Use Sysmon Event ID 1 to confirm that the ownership aligns with SentinelOne (e.g., `C:\Program Files\SentinelOne\Sentinel Agent\SentinelScanFromContextMenu.exe`). If the owner deviates, escalate for further analysis.

  - **Assess Context Menu Behavior:** Review expected usage metrics for the SentinelOne context menu. Document legitimate access logs (e.g., timestamps and user accounts) for context and identify deviations in typical usage patterns.

  - **Examine Image Execution Policies:** For binaries involved in the registry modifications, review the Path and Image fields against known good signatures or hashes. Use VirusTotal or an internal hash repository to assess the legitimacy of any non-SentinelOne paths identified.

  - **Analyze Associated Logs:** Check for recent activity logs that correlate with the timestamp of the registry changes. Look at Security Event ID 4624 (account logon) and Event ID 4688 (process creation) to identify potentially malicious behavior preceding the modification, such as remote access or shell spawning.

  ### Prioritization

  This alert is categorized as medium severity due to the potential impact on the integrity of endpoint security controls. Given that malicious actors frequently attempt to exploit or bypass established security solutions, the likelihood of successful abuse is high, particularly when dealing with sophisticated threats.

  ### Blind Spots and Assumptions

  Detection capabilities are limited by the potential for evasion techniques, such as direct registry edits that do not generate logs or the use of legitimate administrative tools by authorized users. Reliable detection requires comprehensive audit logging of registry modifications. Also, legitimate software installations or updates may trigger this alert; an associated detection of unauthorized file changes in SentinelOne directories can enhance overall monitoring accuracy.

