  ---

  ### Technical Context

  This Sigma rule detects changes to the ETW (Event Tracing for Windows) configuration for .NET applications by monitoring registry alterations, specifically when ETW logging is disabled. The likely objective of an attacker using this technique is to evade detection by disabling telemetry that could provide insights into malicious behavior or application performance. This activity correlates with MITRE ATT&CK technique T1112 (Modification of Registry).

  The primary telemetry source for this detection is Windows registry logs, specifically the registry changes logged as Event ID 4657 (Registry value modified) or similar logs capturing registry write operations. If malicious, disabling ETW could severely impact the organization's ability to monitor and respond to attacks effectively. This detection does NOT confirm that malicious activity has occurred; it merely indicates that ETW logging has been disabled, which can be a legitimate administrative action as well.

  ---

  ### Investigation Steps

  - **Check registry modifications:** Review registry changes using Security Event ID 4657 for the path `SOFTWARE\Microsoft\.NETFramework\ETWEnabled` to identify if the value has been set to `0` (DWORD). This can indicate an attempt to suppress logging.

  - **Identify COMPlus changes:** Verify modifications to the `COMPlus_ETWEnabled` and `COMPlus_ETWFlags` keys in similar registry logs. Legitimate operations usually maintain these keys set to `1` (enabled) or proper configuration values, while malicious changes typically show `0`.

  - **Analyze the application context:** Look for changes in the context of .NET applications running on the affected system. Review the Microsoft .NET runtime logs and detect if recent deployments or configuration changes are associated with the modifications.

  - **Correlate with other telemetry:** Cross-reference logs against Sysmon Event ID 12 (Registry object accessed) for the same timeframe to identify any suspicious activity around the time of the registry modification.

  - **Assess host role and criticality:** Determine if the affected system runs critical business applications. If so, escalate the alert for further analysis due to the potential impact on enterprise operations.

  - **Document legitimate administrative actions:** Identify any scheduled maintenance activities or administrative logs that indicate planned changes to ETW settings. This could serve as evidence that the registry changes were authorized and not malicious.

  ---

  ### Prioritization

  This alert should be considered high severity due to the potential impact on monitoring capabilities in critical systems. The disabling of ETW logging significantly increases an attacker's likelihood of successfully executing actions without detection. While disabling ETW is sometimes part of legitimate maintenance, it is frequently weaponized by adversaries to evade security measures.

  ---

  ### Blind Spots and Assumptions

  This detection may be bypassed if an adversary uses custom scripts or tools to alter the registry outside the standard logging channels. ETW disabling could also be part of legitimate administrative procedures, such as application performance tuning, which may trigger the alert. Ensure you have comprehensive logging enabled for all registry modifications and consider companion detections related to malicious process creation (T1543) or modifications to EDR settings to strengthen overall coverage.

