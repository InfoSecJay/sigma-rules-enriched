detection:
  selection_etw_enabled:
    TargetObject|endswith: 'SOFTWARE\Microsoft\.NETFramework\ETWEnabled'
    Details: 'DWORD (0x00000000)'
  selection_complus:
    TargetObject|endswith:
    - '\COMPlus_ETWEnabled'
    - '\COMPlus_ETWFlags'
    Details:
    - 0         # For REG_SZ type
    - 'DWORD (0x00000000)'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential attempts by adversaries to disable Event Tracing for Windows (ETW) logging for .NET processes. By stopping ETW providers from recording actions, attackers can obscure their activity, making it difficult for security teams to perform forensic analysis or conduct real-time detection of malicious behavior. Typically, this action aligns with operational objectives such as evading detection, sustaining persistence, or setting up for post-compromise actions.

  The relevant MITRE ATT&CK tactics impacted by this behavior include **Defense Evasion** (TA0005), specifically the technique **Indicator Removal on Host** (T1112). Additionally, since disabling ETW could aid in maintaining presence and stealth within a network, this behavior correlates to **Persistence** (TA0003) and may involve related actions that compromise the integrity of security monitoring.

  Primary data sources to monitor for this kind of activity include **Windows registry logs** that capture changes to ETW settings. These logs can reveal attempts to modify ETW configurations that, if observed, could indicate that an adversary is taking steps to hide their tracks.

  ### Investigation Steps
  - **Review Registry Changes**: Examine Windows registry logs, specifically changes to `SOFTWARE\Microsoft\.NETFramework\ETWEnabled` and `COMPlus` settings, to determine if any records show values set to `0`, indicating possible disabling of ETW logging.

  - **Correlate with Process Activity**: Analyze process creation events around the same timestamp as the registry changes. Look for .NET processes that exhibit abnormal behavior or patterns consistent with exploitation or evasion techniques.

  - **Check for Known Tools**: Investigate any usage of tools or scripts known to target .NET processes and manipulate ETW settings, noting any associated network traffic or file drops that may correlate.

  - **Assess ETW Provider Activity**: Utilize monitoring tools to verify if ETW providers for .NET processes are active or reporting events as expected. If certain providers are disabled, correlate this with known malicious activities or suspicious user behavior.

  ### Prioritization
  Given the high potential for an attacker to remain undetected within enterprise environments, this alert is of significant concern. The ability to disable ETW logging can enable continued unauthorized access and activity, warranting immediate attention and investigation.

  ### Blind Spots and Assumptions
  This detection may not capture all instances of ETW manipulation due to reliance on registry monitoring, which could be bypassed or avoided by skilled attackers. There is an assumption that registry logging and monitoring is properly configured and enabled across all hosts. Furthermore, environments without proper logging retention policies may lose critical information related to these types of modifications. Additional configurations or access to real-time monitoring tools may be required for more comprehensive detection capabilities.

