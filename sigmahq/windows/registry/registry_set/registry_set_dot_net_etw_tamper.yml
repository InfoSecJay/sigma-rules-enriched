detection:
  selection_etw_enabled:
    TargetObject|endswith: 'SOFTWARE\Microsoft\.NETFramework\ETWEnabled'
    Details: 'DWORD (0x00000000)'
  selection_complus:
    TargetObject|endswith:
    - '\COMPlus_ETWEnabled'
    - '\COMPlus_ETWFlags'
    Details:
    - 0         # For REG_SZ type
    - 'DWORD (0x00000000)'
  condition: 1 of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection identifies attempts by adversaries to disable Event Tracing for Windows (ETW) logging within .NET processes by modifying registry keys related to ETW functionality. The likely attacker objective is to evade detection mechanisms by stopping logging of events, which can be crucial for forensic analysis and incident investigation. This behavior correlates with the MITRE ATT&CK tactics of Defense Evasion (T1562) and Persistence (T1112). The primary telemetry sources required for this rule include Windows registry change logs, specifically related to modifications in the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework` and `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\COMPlus` registry paths. If malicious, disabling ETW could significantly impair the organization's ability to monitor and respond to intrusions. It's important to note that this detection alone does not confirm a successful intrusion; it only indicates a potential attempt to disable a logging mechanism.

  ### Investigation Steps

  - **Verify registry changes:** Check for modifications in the registry by referencing Security Event ID 4656 for `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework\ETWEnabled` and `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\COMPlus`. Look for values set to `0`, indicating ETW logging has been disabled.

  - **Assess process integrity:** Review Sysmon Event ID 13 to identify any suspicious process creations or modifications that coincide with the registry change timestamp. Confirm whether the related .NET assemblies are known or legitimate.

  - **Identify potential root cause:** Review logs from event sources relevant to application logging (e.g., .NET runtime logs or application logs) to determine if legitimate applications are performing expected functionality that may require changes to ETW settings.

  - **Look for associated malicious indicators:** Investigate if any known malicious processes, files, or behaviors have occurred around the same time the registry change was made. Use threat intelligence feeds or internal data to determine potential links.

  - **Establish baseline activity:** Determine what normal ETW logging behavior looks like for critical .NET applications within your environment to establish a benchmark. For instance, regular updates to the `ETWEnabled` key should be observed when legitimate software is installed or modified.

  - **Alternate detection techniques:** Review companion detections related to ETW manipulations, such as identification of any Softwares used to exploit and enumerate the .NET framework's capabilities for nefarious purposes, particularly those aligned with known attack techniques around T1112 and T1562.

  ### Prioritization

  This alert should be treated with high priority due to its potential to significantly impact security monitoring capabilities on critical systems. The likelihood of malicious abuse is considerable, especially since disabling logging directly inhibits detection of subsequent malicious activities. This technique is commonly weaponized by advanced persistent threats (APTs) and other skilled adversaries.

  ### Blind Spots and Assumptions

  Possible evasion techniques include adversaries using legitimate processes to disable logging without raising immediate alarms. Reliable detection requires proper configuration of registry auditing to capture these changes effectively. Legitimate software updates and configurations may also trigger this alert, particularly during application deployments. Companion detection involving abnormal process creation patterns or unusual application behaviors can enhance visibility and coverage against evasion attempts.

