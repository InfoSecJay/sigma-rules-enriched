  ---

  ### Technical Context

  This Sigma rule detects the presence of numerous space characters in the RunMRU registry path, a potential indicator of malign activity using techniques to obfuscate command execution via the Windows Run dialog. An attacker might employ such evasion strategies to execute arbitrary commands by disguising them among spaces, challenging detection efforts by the SOC. This behavior aligns with the MITRE ATT&CK framework's Execution tactic (T1204.004) as well as Defense Evasion (T1027.010).

  The primary telemetry source for this detection is Windows Registry monitoring, particularly changes to the RunMRU (Most Recently Used) registry key, which logs commands that have been run on the system. If confirmed malicious, this behavior can lead to unauthorized execution of code or payloads, posing a significant security risk. However, detection of this activity does NOT confirm an active compromise on its own; further investigation is required to correlate with other indicators.

  ---

  ### Investigation Steps

  - **Check registry changes:** Review Windows Registry logs, specifically Security Event ID 4657 (a registry value was modified) for alterations in the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU` path. Look for unusual space characters in the `Details` field.

  - **Identify suspicious entries:** Examine the `Details` field and flag any entries containing multiple occurrences of space characters (e.g., En Quad, Em Quad) which do not conform to legitimate use patterns, such as administrative commands or commonly used applications.

  - **Correlate with process creation:** Review Security Event ID 4688 (a new process has been created) and Sysmon Event ID 1 for any processes that correspond to suspicious registry entries identified earlier. Investigate the command lines for obfuscated patterns indicative of phishing or command-and-control activity.

  - **Assess legitimate usage:** Look for known legitimate programs that access the RunMRU registry path, such as standard administrative tools or user activities (e.g., common applications with long command strings). This will help distinguish normal from malicious actions.

  - **Examine user behavior:** Validate if the user associated with the detected entries has a history of unusual behavior on the asset. This can be assessed via user activity logs (e.g., login events) or via Endpoint Detection and Response (EDR) tools for context.

  - **File creation and exfiltration artifacts:** Investigate if any files were created or modified during the same timeframe as the registry changes, focusing on any output indicative of phishing lures. Review Event ID 4663 (an attempt was made to access an object) for file accesses related to the identified suspicious processes.

  ---

  ### Prioritization

  Given the high level of privilege typically required to modify the RunMRU registry, alerts generated by this rule indicate a potentially serious threat, especially if associated with known attacker techniques. The likelihood of abuse is high, as phishing lures are commonly weaponized to exploit user trust and exploit indirect execution options.

  ---

  ### Blind Spots and Assumptions

  This detection may be limited by evasion techniques, such as altering the RunMRU string without identifiable patterns, or legitimate automated scripts that may create benign entries with unusual spacing. Reliable detection necessitates comprehensive registry monitoring setup, alongside configurations to ensure logging of registry changes. Common scenarios like legitimate administrative tasks, use of automation tools, or application batch jobs can trigger false positives. A related detection to consider strengthening coverage is monitoring for execution of newly created processes, particularly from script engines or uncommon executables.

