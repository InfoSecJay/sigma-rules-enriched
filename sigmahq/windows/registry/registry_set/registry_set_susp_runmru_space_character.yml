note: |
  ### Technical Context

  This detection rule identifies instances where numerous space characters are present in the `RunMRU` (Most Recently Used) registry keys, specifically using various Unicode space characters. This behavior might indicate that an adversary is employing phishing techniques, particularly through the use of "clickfix," to obfuscate malicious commands designed to be executed in the Windows Run dialog. The primary associated MITRE ATT&CK tactic is **Execution** (TA0040), with the specific technique identified as **User Execution** (T1204.004) and **Obfuscated Files or Information** (T1027.010). Key telemetry sources include Windows Registry logs, which can be monitored using tools like Sysmon or native Windows auditing of the registry.

  If this behavior is indeed malicious, it may lead to unauthorized execution of commands or malware deployment. It's crucial to note that this detection does NOT confirm that all occurrences of such patterns are malicious; legitimate applications may also use spaces in various contexts.

  ### Investigation Steps

  - **Check the registry key for suspicious entries:** Review the Windows Registry for the path `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`. Look for unusual or unexpected values that contain multiple space characters (Event ID 4657 can assist in tracking registry changes).

  - **Validate or identify known benign values:** Compare the observed values against a list of standard applications or expected entries in the RunMRU to distinguish between potential misused space sequences and legitimate entries.

  - **Analyze associated process execution:** Correlate the registry modifications with processes initiated around the same timeframe (Sysmon Event ID 1 – Process Creation or Security Event ID 4688 for Windows process creation). Look for any processes that may correspond to unusual parent-child relationships associated with the party responsible for modifying the registry.

  - **Investigate user activity context:** Review audit logs for user behavior around the time the registry key was modified (Windows Security Event ID 4624 for logon events) to confirm whether the user who made these changes is authorized to do so.

  - **Assess for exfiltration artifacts:** If malicious behavior is confirmed, check for any unusual files created, modified, or exfiltrated (e.g., peaks in network traffic or transfers logged via Windows Event IDs 5156 or 5158 for firewall activity).

  ### Prioritization

  This alert carries a **high severity** due to its potential impact on systems typically used by end-users, where an executed payload could lead to a complete compromise. The likelihood of this behavior being exploited is elevated due to the effectiveness of phishing techniques in modern cyberattacks.

  ### Blind Spots and Assumptions

  Detection may miss variations in encoding or alternative obfuscation techniques outside of the specified space characters. The accuracy of detections relies heavily on proper logging configurations, specifically for registry modifications. Legitimate administrative tools or scripts may trigger this alert when they use Unicode characters for formatting. Companion detections, such as monitoring for unusual PowerShell activity (T1059.001), can help enhance coverage and confirm contextual usage.

