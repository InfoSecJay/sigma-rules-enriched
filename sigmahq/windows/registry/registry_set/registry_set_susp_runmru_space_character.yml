note: |
  ### Technical Context

  This rule detects suspicious activity related to the manipulation of the Windows RunMRU (Most Recently Used) registry key, primarily by identifying multiple space characters in its entries. This behavior is indicative of an attacker attempting to obfuscate malicious command execution through techniques like phishing lures, thereby evading detection. The likely objective is to execute malicious scripts or commands without clear visibility to the user or security defenses.

  The relevant MITRE ATT&CK tactics for this detection are as follows:
  - Execution: T1204.004 (User Execution)
  - Defense Evasion: T1027.010 (Obfuscated Files or Information)

  The primary telemetry source is Windows Registry logs, specifically monitoring entries related to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`. A successful exploitation could lead to arbitrary command execution on the affected system, posing a significant threat. However, this detection does NOT confirm that malicious execution has occurred on its own; it only highlights potential suspicious behavior that requires further investigation.

  ### Investigation Steps

  - **Check recent RunMRU entries:** Review Windows Registry logs for recent additions or modifications to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU`. Look for entries containing multiple space characters, particularly any that include the string ‘#’.

  - **Analyze the command executed:** If suspicious entries are found, examine the corresponding execution events (Security Event ID 4688 or Sysmon Event ID 1) to understand which commands were executed. Confirm whether these commands are expected operational activities (e.g., legitimate application launches) versus potentially malicious ones.

  - **Validate legitimate user behavior:** Compare the RunMRU entries against the user’s typical behavior. Legitimate entries often contain well-known application paths or system commands, while suspicious entries may feature obscure or unexpected applications.

  - **Identify user context:** Determine the user account associated with the suspicious registry modifications. Elevated privileges or accounts with administrative access in the event of malicious commands could indicate a higher level of risk.

  - **Look for similar command patterns:** Investigate other logs related to command execution or script processing (e.g., PowerShell logs or command shell logs) for further corroborating evidence. Pay special attention to any other anomalies that may align with the suspicious RunMRU entries.

  - **Correlate with external indicators:** Cross-reference the detected behavior against threat intelligence reports for known malicious commands or obfuscation techniques linked to phishing campaigns or other attack vectors to assess the threat level.

  ### Prioritization

  The severity of this alert is high due to the potential impact on system integrity and user security. The likelihood of malicious abuse is significant because techniques like this are frequently weaponized in phishing attacks. Systems involved in user execution tasks are critical as they often serve as endpoints for initial compromise.

  ### Blind Spots and Assumptions

  The detection may be limited by user privileges and potential registry access controls that can obscure malicious alterations. Additionally, legitimate activities, such as users intentionally creating obfuscated entries for benign purposes, may falsely trigger alerts. Required log sources for reliable detection include comprehensive auditing of the Windows Registry with proper configurations to capture detailed changes. Companion detections include monitoring for unusual command-line activity or connecting logs from PowerShell executions to enhance contextual understanding of the alert.

