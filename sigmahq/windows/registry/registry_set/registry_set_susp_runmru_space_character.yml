detection:
  selection_key:
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU\'
    Details|contains: '#'
  selection_space_variation:
    Details|contains:
    - '            '         # En Quad (U+2000)
    - '            '         # Em Quad (U+2001)
    - '            '         # En Space (U+2002)
    - '            '         # Em Space (U+2003)
    - '            '         # Three-Per-Em Space (U+2004)
    - '            '         # Four-Per-Em Space (U+2005)
    - '            '         # Six-Per-Em Space (U+2006)
    - '            '         # Figure Space (U+2007)
    - '            '         # Punctuation Space (U+2008)
    - '            '         # Thin Space (U+2009)
    - '            '         # Hair Space (U+200A)
    - '            '         # No-Break Space (U+00A0)
    - '            '         # Normal space
  condition: all of selection_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies the presence of numerous space characters within the RunMRU (Most Recently Used) registry paths in Windows. The RunMRU registry is a location that stores the commands executed via the Run dialog, and suspicious spacing may indicate an attempt to use 'ClickFix' techniques to obscure malicious commands in phishing attacks. Attackers often employ such obfuscation techniques to evade detection while executing harmful payloads, thereby achieving their objectives of unauthorized access or data exfiltration.

  The relevant MITRE ATT&CK tactics include **Execution** (ID: T1204.004), which involves executing code that is unintentionally received by the target; and **Defense Evasion** (ID: T1027.010), where attackers attempt to mask their activities or hide malicious commands to avoid detection. Detecting these obfuscated commands in the RunMRU can help in identifying potential attempts by adversaries to gain foothold in the environment or perpetrate further attacks.

  Primary data sources for this detection are Windows registry logs capturing changes to the RunMRU path, which provide insight into commands recently executed on a machine.

  ### Investigation Steps
  - **Review RunMRU Entries**: Investigate the entries in the RunMRU registry path for unusual command strings or patterns, specifically looking for space characters that may conceal malicious intent.
  - **Collect Registry Logs**: Gather logs from registry changes to trace when and how these suspicious entries were created, along with information on the user account that executed them.
  - **Analyze User Behavior**: Monitor the behavior of the account linked to the suspicious RunMRU entries. Look for other unusual activity or known malicious behavior patterns that correlate with phishing activity.
  - **Correlate with Other Security Events**: Check for other security alerts from EDR, NDR, or SIEM systems to identify additional signs of compromise or related attacks that use the same entry points.

  ### Prioritization
  The high severity of this alert stems from the potential impact of an attacker successfully executing commands via the Run dialog, which could lead to broader system compromise, data exfiltration, or lateral movement within the network.

  ### Blind Spots and Assumptions
  This detection may have gaps in identifying more sophisticated evasion techniques that do not use standard space characters. The detection logic assumes that obfuscation will always employ recognizable forms of spacing, and it relies heavily on having comprehensive logging of registry changes in place. If relevant log retention policies or settings are misconfigured or absent, this alert may not function effectively.

