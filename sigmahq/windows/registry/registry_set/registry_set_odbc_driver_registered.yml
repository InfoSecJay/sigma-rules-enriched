title: New ODBC Driver Registered
id: 3390fbef-c98d-4bdd-a863-d65ed7c610dd
status: test
description: Detects the registration of a new ODBC driver.
references:
- https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-23
modified: 2023-08-17
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\ODBC\ODBCINST.INI\'
    TargetObject|endswith: '\Driver'
  filter_main_sqlserver:
    TargetObject|contains: '\SQL Server\'
    Details: '%WINDIR%\System32\SQLSRV32.dll'
  filter_optional_office_access:
    TargetObject|contains: '\Microsoft Access '
    Details|startswith: 'C:\Progra'
    Details|endswith: '\ACEODBC.DLL'
  filter_optional_office_excel:
    TargetObject|contains: '\Microsoft Excel Driver'
    Details|startswith: 'C:\Progra'
    Details|endswith: '\ACEODBC.DLL'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely
level: low
note: |
  ### Technical Context

  This rule detects the registration of a new ODBC (Open Database Connectivity) driver on Windows systems. The behavior is notable as it could indicate an attempt by an adversary to establish persistence through new data connection pathways, potentially to covertly access and manipulate databases. The likely attacker objective is to leverage ODBC drivers to execute unauthorized database queries or actions, either to exfiltrate data or maintain a foothold within the environment.

  The relevant MITRE ATT&CK tactic is Persistence, with the technique ID T1547.002 (Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder). Primary telemetry sources include Windows Registry logs, particularly Windows Registry Event IDs related to modifications, such as Event ID 4657 (Registry value modified). If malicious, this activity can compromise sensitive data integrity and confidentiality. Importantly, this detection does NOT confirm malicious intent on its own, as ODBC driver registration can be legitimate.

  ### Investigation Steps

  - **Check Registry Modifications**: Investigate Windows Registry Event ID 4657 for changes in the path `\SOFTWARE\ODBC\ODBCINST.INI\`. Look for unexpected driver entries not commonly registered in your environment.

  - **Identify Legitimate Applications**: Confirm if the new ODBC driver corresponds to known applications such as SQL Server, Microsoft Access, or Microsoft Excel. Document the associated application paths and their legitimacy within your organization.

  - **Correlate with Process Creation**: Cross-reference the timestamp of the registry event with Security Event ID 4688 to identify any associated process creation at the same time, especially those invoking database commands. Look for suspicious command lines.

  - **Review Driver File Locations**: Verify the presence of driver files, such as `SQLSRV32.dll` or `ACEODBC.DLL`, in expected directories (e.g., `C:\Windows\System32\`). Unexpected locations may indicate malicious intent.

  - **Assess User Accounts**: Check which user account performed the registration using Event ID 4624 (Logon). A service or system account performing the registration may warrant further scrutiny.

  - **Monitor Related Network Activity**: Investigate any outbound network connections made shortly after the ODBC driver registration. Use network logs to identify connections to unusual IPs or domains consistent with data exfiltration.

  ### Prioritization

  This alert is of low severity due to the potential for benign usage in regular applications that interact with databases. However, the likelihood of malicious exploitation exists, particularly if combined with unusual patterns of activity that follow the registration, such as unexpected database queries or network connections.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate applications using custom ODBC drivers or direct manipulation of the registry without logging. Reliable detection requires proper logging configurations for Windows Registry modifications. Legitimate activities that may trigger this alert include software updates or application installations by trusted users. A related detection that strengthens coverage is monitoring for unusual application installations (e.g., established via Event ID 11724 - Application Install).

