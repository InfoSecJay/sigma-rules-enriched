title: New ODBC Driver Registered
id: 3390fbef-c98d-4bdd-a863-d65ed7c610dd
status: test
description: Detects the registration of a new ODBC driver.
references:
- https://www.hexacorn.com/blog/2020/08/23/odbcconf-lolbin-trifecta/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-05-23
modified: 2023-08-17
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\ODBC\ODBCINST.INI\'
    TargetObject|endswith: '\Driver'
  filter_main_sqlserver:
    TargetObject|contains: '\SQL Server\'
    Details: '%WINDIR%\System32\SQLSRV32.dll'
  filter_optional_office_access:
    TargetObject|contains: '\Microsoft Access '
    Details|startswith: 'C:\Progra'
    Details|endswith: '\ACEODBC.DLL'
  filter_optional_office_excel:
    TargetObject|contains: '\Microsoft Excel Driver'
    Details|startswith: 'C:\Progra'
    Details|endswith: '\ACEODBC.DLL'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Likely
level: low
note: |
  ### Technical Context
  This detection rule identifies the registration of new ODBC (Open Database Connectivity) drivers on Windows systems. This behavior can indicate potential misuse of legitimate tools for malicious purposes, particularly in scenarios where an attacker aims to establish persistence or exfiltrate data. Attackers may register malicious ODBC drivers to facilitate unauthorized database connections, allowing them to interact with sensitive data or resources in a covert manner.

  The likely scenarios involve attackers leveraging ODBC drivers to connect to databases that store critical information, thus aligning with the MITRE ATT&CK tactic of Persistence (T1547). Specific techniques that apply include the use of New Service (T1050) and Valid Accounts (T1078). The primary data sources that will provide the necessary evidence include registry change logs, specifically monitoring the Windows registry for changes in the ODBC section, which would indicate new driver registrations.

  ### Investigation Steps
  - **Review Registry Logs:** Check the Windows registry logs for any entries under `\SOFTWARE\ODBC\ODBCINST.INI\` that indicate a new driver has been registered. Look for entries that may not match known legitimate drivers.
  - **Analyze Driver Details:** Investigate the details of any new drivers found in the registry, paying attention to file paths and filenames. Focus on entries that involve suspicious names or locations like those associated with SQL Server or Microsoft Office access.
  - **Examine Process Creation Logs:** Look for process creation events related to any newly registered ODBC drivers. This can help identify whether these drivers are being called as part of potentially malicious activities.
  - **Correlate with User Activity:** Cross-reference the timing of the new driver registration with user activities and logins to see if there is any correlation with unusual or unauthorized access.

  ### Prioritization
  The alert has a low severity level due to the potential for false positives from legitimate software installations. However, the presence of new ODBC drivers should still be investigated to mitigate risks of unauthorized data access or persistence mechanisms being deployed.

  ### Blind Spots and Assumptions
  This detection logic may miss instances of new drivers installed through non-standard methods or those that do not modify the registry in the expected manner. It assumes that legitimate software updates or user-installed applications are not misused as a cover for malicious activity. For the alert to function effectively, registry auditing must be enabled and adequately configured to capture changes to the ODBC-related registry paths.

