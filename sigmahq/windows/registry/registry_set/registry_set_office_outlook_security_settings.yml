note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Registry settings related to Outlook security. Such modifications may indicate an attacker attempting to weaken email security configurations to facilitate phishing, malware delivery, or other malicious activities targeting email communications. The relevant MITRE ATT&CK tactic is Persistence, specifically technique T1137 - "Office Application Startup".

  The primary telemetry source for this detection includes Windows Registry change logs, specifically focusing on `SOFTWARE\Microsoft\Office\Outlook\Security`. If malicious, this behavior could potentially allow unauthorized manipulation of email security settings, leading to data breaches or account compromise. This detection does NOT confirm that malicious activity occurred; it merely highlights configuration changes that warrant further investigation.

  ### Investigation Steps

  - **Verify the source of registry changes**: Review Security Event ID 4657 to identify which user or process initiated the registry update. Look for changes made by unexpected users or non-standard processes.

  - **Identify legitimate administrative activity**: Check for recent legitimate administrative tasks, such as software updates or security audits, occurring around the same time. This can be cross-referenced with Event ID 4624 (Logon) to match user actions to administrative accounts.

  - **Examine specific Registry keys**: Investigate the following Registry path for changes: `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Office\Outlook\Security\`. Look for values that might lower security settings, such as `AllowUnsafeClientMailRules`.

  - **Cross-reference process origin**: Identify the origin of the Outlook process using Sysmon Event ID 1 (Process Creation). Look for instances where `OUTLOOK.EXE` has a suspicious path or parameters which could indicate manipulation by a non-standard application.

  - **Monitor for subsequent malicious activity**: Check for any related malicious indicators following the registry change, such as outbound network connections initiated by Outlook that may indicate data exfiltration or command and control (C2) communications. Related Event IDs include 5156 for Windows Filtering Platform and 5158 for successful connection events.

  ### Prioritization

  This alert should be treated with medium priority based on the potential impact of altered security settings in an enterprise environment. The likelihood of malicious abuse is moderate, as attackers often target email systems; however, administrative activities could similarly trigger this rule. Identifying confirmed malicious changes would warrant immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be limited by legitimate administrative activities that could also trigger registry changes. Required log sources include complete Windows Event logs and audit policies specifically configured to monitor registry access. Additionally, legitimate users could modify these settings during routine updates or due diligence. A related detection to consider is monitoring for unusual PowerShell commands (via Event IDs 4103 and 4104) that might further indicate exploitation attempts post-registry manipulation.

