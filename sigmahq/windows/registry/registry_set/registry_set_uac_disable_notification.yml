note: |
  ### Technical Context

  This rule detects modifications to the User Account Control (UAC) notification settings by monitoring changes to the "UACDisableNotify" registry value in Windows. Attackers may attempt to disable UAC prompts to bypass security barriers, facilitating unauthorized actions or privilege escalation. The relevant MITRE ATT&CK technique is Privilege Escalation, specifically T1548.002 - "Abuse Elevation Control Mechanism".

  Primary telemetry sources include Windows registry modification logs. The specific log type required is the registry event that captures changes made to the UACDisableNotify key. If malicious, this behavior could significantly increase the risk of malware or unauthorized changes permanently affecting the system's security posture. It is crucial to note that this detection does not prove that a compromise occurred; it merely indicates a potential avenue of attack has been attempted.

  ### Investigation Steps

  - **Identify the registry change event**: Analyze Windows Security logs for Event ID 4663 where the `Object Name` refers to `\Microsoft\Security Center\UACDisableNotify`. Confirm that the change value is set to `1`, indicating UAC notification has been disabled.

  - **Review recent account activity**: Check for suspicious account logins in Security Event ID 4624 (Logon). Look for accounts that typically should not be performing administrative tasks or have a high number of logon events in a short time frame, which could indicate account compromise.

  - **Validate legitimate UAC behavior**: Determine if UAC notifications were previously enabled by checking the last known value of the `UACDisableNotify` key (should be `0`). This will help differentiate between malicious activity and legitimate administrative changes.

  - **Correlate with other indicators**: Look for Malicious Indicators of Compromise (IOCs) such as associated Event ID 4688 (process creation) for any command-line executions that precede the registry change, specifically focusing on unusual PowerShell or cmd.exe commands around the time of change.

  - **Examine affected systems' criticality**: Assess the roles of systems showing this rule firing. High-value assets or domain controllers exhibiting this behavior are more critical and warrant immediate investigation.

  ### Prioritization

  This alert has medium severity. Systems with altered UAC settings could be at heightened risk for malicious exploitation. While disabling UAC is a known tactic, it is not exclusive to malevolent activities, hence the need for further context in investigations.

  ### Blind Spots and Assumptions

  Evasion techniques include attackers using alternative methods to disable UAC outside standard registry modifications, thereby bypassing detection. The configuration of registry audit policies may be required to ensure detection reliability. Normal administrative tasks can also trigger this alert, especially if legitimate users need to adjust UAC for application compatibility. A related detection to monitor is the use of PowerShell commands (T1086), which might also show attempts to modify system settings in conjunction with UAC disablement.

