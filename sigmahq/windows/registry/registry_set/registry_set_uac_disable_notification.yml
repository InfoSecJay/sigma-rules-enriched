note: |
  ### Technical Context
  This detection rule identifies attempts by an attacker to disable User Account Control (UAC) notifications in Windows by altering the registry key "UACDisableNotify". UAC is a critical component of Windows security that helps prevent unauthorized changes to the operating system by prompting users for consent before allowing actions that may impact system integrity. By setting the "UACDisableNotify" value to 1, attackers can suppress these prompts, enabling them to execute unauthorized changes without alerting the user.

  The threat scenario often involves attackers leveraging privilege escalation techniques to gain higher-level access to systems, enabling further malicious activities such as installing malware, exfiltrating data, or altering system configurations. The associated MITRE ATT&CK tactics and techniques relevant to this rule include **Privilege Escalation** (TA-002) and specifically **T1548.002: Abuse Elevation Control Mechanism: UAC Bypass**. The manipulation of UAC settings exemplifies an attacker's attempt to bypass user permissions and maintain persistent access to the compromised system.

  Primary data sources for this detection will include registry change logs, specifically monitoring entries in the Windows registry that pertain to User Account Control. This involves tracking modifications to key registry paths, which can provide insight into attempts to alter security settings.

  ### Investigation Steps
  - **Check Registry Logs**: Review the Windows registry logs focusing on entries related to `\Microsoft\Security Center\UACDisableNotify` to confirm recent modifications and correlate timestamps with suspicious activity.
  - **Analyze User Activity**: Investigate the account activity around the time of the UAC modification to assess if it involves legitimate user behavior or patterns consistent with unauthorized access.
  - **Review Process Creation Events**: Look for any process creation events that coincide with the change in the UAC setting, especially those that may indicate malicious tools or scripts being executed.
  - **Correlate with Endpoint Detection Data**: Utilize EDR data to check for any anomalous behavior or alerts that may indicate an ongoing exploitation attempt or additional privilege escalation actions associated with the UAC modification.

  ### Prioritization
  The alert's severity is medium due to the significant risk that disabling UAC poses to system integrity and security. Although this action may be initiated by legitimate user activity in some cases, the likelihood of its exploitation for malicious purposes makes it critical for swift investigation.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage includes environments where registry logging is not enabled or configured appropriately, potentially leading to missed modifications. The detection logic assumes that attackers will modify the UAC setting directly, which may not account for other indirect methods of bypassing UAC. Additionally, this alert relies on access to specific Windows registry logs, and if those logs are incomplete or unavailable, the detection will not function as intended.

