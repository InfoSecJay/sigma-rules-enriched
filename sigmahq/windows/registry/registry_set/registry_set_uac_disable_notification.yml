note: |
  ### Technical Context

  This detection identifies attempts to disable User Account Control (UAC) notifications on Windows systems by modifying the registry key `UACDisableNotify` to a value of `1`. An attacker may disable UAC notifications to bypass security prompts, allowing for malicious actions without user awareness. The likely attacker objective is to gain easier access to execute unauthorized changes or install malware with elevated privileges.

  This behavior falls under the MITRE ATT&CK framework under the Privilege Escalation tactic, specifically technique T1548.002 (Bypass User Account Control). The primary telemetry source is the Windows registry, particularly registry modification logs related to security settings. If successful, this demonstration of privilege escalation could lead to significant security impacts, including unauthorized access to sensitive data or system functions. This detection does NOT confirm that malicious activity has occurred; it merely indicates a potential compromise of the UAC settings.

  ### Investigation Steps

  - **Check registry modification logs**: Review the registry logs or forensic images for changes to the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Security Center\UACDisableNotify` value. Look for entries showing this value set to `1`, indicating potential tampering.

  - **Validate UAC configuration**: Use PowerShell command `Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Reliability\UACDisableNotify'` to confirm the current state of the UACDisableNotify setting. It should be `0` in a secure configuration.

  - **Identify recent administrative activities**: Check the Security Event ID 4672 logs for privileged account activity. Look for successful logons from administrative accounts that may correlate with the timing of the registry modification.

  - **Assess legitimate configuration changes**: Determine if there are clear and documented cases of UAC being disabled in response to specific, expected administrative tasks or system configurations, such as system updates or application installations.

  - **Review unusual process creations**: Analyze Windows Process Creation events (Security Event ID 4688) that may correlate with the timing of UAC disablement. Pay special attention to processes that reflect common exploitation tools or malware like known command-line executables.

  ### Prioritization

  This alert should be considered medium severity. The impact can be significant as it indicates a potential compromise of core security settings on critical systems. The likelihood of malicious abuse is high, especially in environments where privilege escalation techniques are commonly weaponized.

  ### Blind Spots and Assumptions

  This detection may miss other methods of tampering with UAC settings that do not involve the specified registry key. Additionally, its effectiveness is contingent upon complete registry auditing being enabled. Users with administrative privileges may legitimately change UAC settings, so context is essential. Related detections, such as monitoring administrative privilege escalation activities, could provide stronger overall security coverage.

