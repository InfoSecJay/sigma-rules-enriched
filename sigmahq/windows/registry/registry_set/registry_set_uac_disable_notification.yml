note: |
  ### Technical Context

  This rule detects attempts to disable User Account Control (UAC) notifications on Windows systems by modifying the `UACDisableNotify` registry value to `1`. This behavior is indicative of an attacker attempting to suppress critical security alerts that could thwart unauthorized actions on the system. The likely objective is to perform privilege escalation or execute malicious actions without user intervention, which falls under the MITRE ATT&CK tactic of "Privilege Escalation" (TA0004) and the specific technique "UAC Bypass - UAC Disable" (T1548.002).

  The primary telemetry source for this detection is the Windows Registry, specifically monitoring changes to the registry path `\Microsoft\Security Center\UACDisableNotify`. If this change is executed maliciously, it could allow an attacker to escalate privileges without being prompted for necessary permissions, significantly reducing the system's defense posture. It’s important to note that this detection alone does not confirm malicious intent; legitimate administrative actions could also modify this registry setting under certain circumstances.

  ### Investigation Steps

  - **Check the registry value change:** Monitor for changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Security Center\UACDisableNotify`. Specifically, look for entries with a value of `1` using Windows Registry logs (Event ID 4657) to confirm the modification date and time.

  - **Verify system role and context:** Identify the host role of the system where the alert was triggered (e.g., is it a critical server or workstation?). Review the event context to understand if the change aligns with expected administrative behavior. In environments with strong policy enforcement, the registry change may be unusual.

  - **Cross-check user activities:** Correlate the time of registry modification with user logon events (Security Event ID 4624) to identify which user account made the change. Ensure this account has the necessary administrative rights.

  - **Analyze recent process creations:** Investigate for any suspicious process executions around the same timeframe using Security Event ID 4688 or Sysmon Event ID 1 that could be indicative of malicious activity related to disabling UAC.

  - **Review for common evasion behaviors:** Identify if there have been any other techniques employed that commonly accompany UAC bypass attempts, such as execution of known payloads (e.g., PowerShell scripts or BAT files). Look for specific parent-child process relationships in process creation logs.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact of suppressing UAC features on a critical system. The likelihood of malicious abuse is moderate, as attackers commonly disable UAC to avoid detection. Given that UAC is a frequently targeted mechanism for privilege escalation, such alerts should be triaged promptly.

  ### Blind Spots and Assumptions

  Detection may be limited if logging settings are not properly configured to capture registry changes, as not all organizations monitor registry modifications consistently. Legitimate administrative tasks might unintentionally trigger this alert, especially during software installations or system configurations. A related detection worth implementing is monitoring for unauthorized changes to other critical registry keys like `\Microsoft\Windows\CurrentVersion\Policies\System` as additional context for security evaluation.

