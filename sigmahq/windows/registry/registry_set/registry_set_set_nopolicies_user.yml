logsource:
  category: registry_set
  product: windows
detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoLogOff'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoDesktop'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoRun'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoFind'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoControlPanel'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoFileMenu'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoClose'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoSetTaskbar'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoPropertiesMyDocuments'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoTrayContextMenu'
    Details: 'DWORD (0x00000001)'
  condition: selection_set_1
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context
  This rule detects unauthorized modifications to critical registry keys that control Explorer's policies in the Windows operating system. Such modifications can disable essential functionalities, such as logging off or accessing the desktop, which are tactics employed by malware like Agent Tesla to maintain persistence and evade detection. By altering these settings, attackers aim to restrict user actions and further entrench their access, making it easier to execute additional malicious activities without detection.

  The relevant MITRE ATT&CK tactics for this detection are **Persistence** and **Defense Evasion**, specifically technique **T1112 - Modify Registry**. Attackers may leverage these tactics to gain persistent access to systems while impeding administrators from identifying or removing their malware. The primary data source that will provide evidence of these alterations is the Windows registry set logs, specifically those targeting the `Policies\Explorer` path.

  ### Investigation Steps
  - **Review Registry Logs:** Examine registry modification logs for changes to the specified Explorer policy keys. Look for new entries that alter DWORD values to `0x00000001`, indicating suspicious activity.

  - **Correlate with User Activity:** Assess user account activity around the time of the registry modification. Identify if any administrative actions or scripts coincide with the timing of these changes, as legitimate scripts may trigger similar logs.

  - **Analyze System Behavior:** Check for any related unusual system behavior, such as degraded performance, restriction of user tasks, or appearance of unauthorized applications that may indicate active malware.

  - **Monitor Network Connections:** Investigate any outbound network connections or traffic patterns that occur following the registry modifications, which may indicate data exfiltration or further command and control activities from the affected system.

  ### Prioritization
  This alert is considered medium severity due to its indication of potential malware activity that affects user functionality and system administration. The impact of an identified threat could escalate quickly if not addressed, as it could lead to data loss or further compromises.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate administrative scripts that also modify these registry keys for valid purposes. The detection logic assumes that any modification to the specified keys without corresponding legitimate user activity is potentially malicious. For this alert to function effectively, it requires comprehensive logging of registry modifications within the Windows environment, as well as the appropriate monitoring configurations for these logs to be captured and analyzed promptly.

