note: |
  ### Technical Context

  This rule detects registry modifications that disable essential functionalities of Windows Explorer via specific policy settings. The likely attacker objective is to hinder user interaction with the system, thereby facilitating a prolonged presence or further malicious activities without user detection. Relevant MITRE ATT&CK techniques include "Modify Registry" (T1112) under the tactics of Persistence and Defense Evasion. The primary telemetry sources are Windows Registry Event logs and related event IDs capturing these changes. If the modifications are malicious, they can enable attackers to prevent user activity, potentially leading to data exfiltration or lateral movement. However, this detection does NOT confirm that an action was malicious on its own; further investigation is required.

  ### Investigation Steps

  - **Review registry keys affected:** Check for changes in the Registry under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer` specifically looking for values `NoLogOff`, `NoDesktop`, `NoRun`, etc. Confirm legitimate values should typically be set to `0`.

  - **Identify the source of modification:** Retrieve the Security Event ID 4657 (Registry Value Modified) to determine what process or user made changes. Look for unusual accounts or processes modifying these keys.

  - **Cross-reference with recent changes:** Use Sysmon Event ID 13 (Registry Key Held Open) to find any recent handles that correspond to the modified keys, which can indicate persistence mechanisms or unusual application behavior.

  - **Examine process creation logs:** Review Security Event ID 4688 to identify the parent processes that initiated the registry changes. Legitimate administrative actions should correlate with expected task patterns, and any anomalies can indicate suspicion.

  - **Assess system role and user activity:** Confirm the role of the affected system (e.g., server or workstation) and legitimate user activity at the time of modification. Actions by service accounts or admin scripts that match normal operational behavior should be logged.

  - **Look for related artifacts:** Search for created or modified scheduled tasks or services (Event ID 4697) in proximity to the registry changes to identify potential follow-on behaviors common in persistent malware.

  ### Prioritization

  The alert severity is medium as it indicates a potential attempt to undermine user controls at the system level. The likelihood of malicious abuse is moderately high given that these registry entries are often targeted in evasion techniques, particularly by malware. This behavior is not commonly seen in legitimate administrative actions unless explicitly scripted for policy enforcement.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging for certain registry activities if Windows auditing is not properly configured. Evasion techniques include legitimate administrative tools modifying registry settings without triggering alerts if not closely monitored. Additionally, custom management tools or scripts could trigger this alert as benign activity. A companion detection to strengthen coverage would be monitoring for unusual process executions following such registry modifications, particularly using Sysmon for detailed process insights.

