detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoLogOff'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoDesktop'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoRun'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoFind'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoControlPanel'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoFileMenu'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoClose'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoSetTaskbar'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoPropertiesMyDocuments'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\NoTrayContextMenu'
    Details: 'DWORD (0x00000001)'
  condition: selection_set_1
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects registry modifications that disable specific Windows Explorer functionalities, such as the ability to close the application or use the control panel. These behaviors are commonly associated with stealthy malware, such as Agent Tesla, aiming to restrict users from properly managing their systems. The relevant MITRE ATT&CK tactics are **Persistence** and **Defense Evasion** (T1112). The primary telemetry source is the Windows Registry modification logs for keys related to Explorer policies. If these modifications are malicious, they can severely impact system usability and user operations. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative scripts may also make similar changes.

  ### Investigation Steps

  - **Check registry modifications**: Review the Security Event ID 4657 logs for changes to the registry keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer`. Identify any recent changes that match the detection criteria, focusing on unauthorized modifications.

  - **Evaluate user accounts**: Investigate the user account that made the registry modification by looking at Security Event ID 4688 (Process Creation) logs. Compare the account's privileges against expected roles; administrative accounts making these changes may warrant further scrutiny.

  - **Look for associated processes**: Analyze Sysmon Event ID 1 for unusual process creation around the time of the registry modification. Specifically, look for processes that may interact with `reg.exe` or PowerShell commands that could indicate an automated change.

  - **Identify expected behavior**: Establish a baseline of normal organizational behavior regarding registry modifications. For example, authorized changes may originate from designated admin accounts using approved scripts. Ensure to validate recent script execution logs against expected changes.

  - **Correlate with antivirus logs**: Check antivirus or endpoint detection logs for any alerts triggered around the same timestamps as the registry modification. Malicious changes frequently coincide with other suspicious activities that may validate the threat.

  - **Conduct a holistic risk assessment**: Review related security incidents or alerts that have occurred within a certain time frame, as similar registry changes might indicate a wider attack pattern or technique being employed against the enterprise.

  ### Prioritization

  This alert should be considered medium priority due to its potential impact on user operations and the likelihood of malicious abuse. Given that this behavior is a common tactic for malware authors to maintain persistence, it warrants timely investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative scripts that alter the same registry keys. A consistent logging setup for all system changes, specifically for registry modifications, is crucial for reliable detection. Legitimate activities that may trigger this alert include routine IT tasks performed by administrative personnel. Related detections, such as process execution anomalies (e.g., unusual PowerShell commands), can provide additional context and strengthen overall incident response efforts.

