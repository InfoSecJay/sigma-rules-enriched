modified: 2025-10-22
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Wow6432Node\Microsoft\Windows CE Services\AutoStart'
    - '\Software\Wow6432Node\Microsoft\Command Processor\Autorun'
    - '\SOFTWARE\Wow6432Node\Microsoft\Active Setup\Installed Components'
    - '\SOFTWARE\Microsoft\Windows CE Services\AutoStartOnDisconnect'
    - '\SOFTWARE\Microsoft\Windows CE Services\AutoStartOnConnect'
    - '\SYSTEM\Setup\CmdLine'
    - '\Software\Microsoft\Ctf\LangBarAddin'
    - '\Software\Microsoft\Command Processor\Autorun'
    - '\SOFTWARE\Microsoft\Active Setup\Installed Components'
    - '\SOFTWARE\Classes\Protocols\Handler'
    - '\SOFTWARE\Classes\Protocols\Filter'
    - '\SOFTWARE\Classes\Htmlfile\Shell\Open\Command\(Default)'
    - '\Environment\UserInitMprLogonScript'
    - '\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop\Scrnsave.exe'
    - '\Software\Microsoft\Internet Explorer\UrlSearchHooks'
    - '\SOFTWARE\Microsoft\Internet Explorer\Desktop\Components'
    - '\Software\Classes\Clsid\{AB8902B4-09CA-4bb6-B78D-A8F59079A8D5}\Inprocserver32'
    - '\Control Panel\Desktop\Scrnsave.exe'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
  filter_optional_msoffice:
  - TargetObject|contains:
    - '\Office\ClickToRun\REGISTRY\MACHINE\Software\Classes\PROTOCOLS\Handler\'
    - '\ClickToRunStore\HKMU\SOFTWARE\Classes\PROTOCOLS\Handler\'
  - Details:
    - '{314111c7-a502-11d2-bbca-00c04f8ec294}'
    - '{3459B272-CC19-4448-86C9-DDC3B4B2FAD3}'
    - '{42089D2D-912D-4018-9087-2B87803E93FB}'
    - '{5504BE45-A83B-4808-900A-3A5C36E7F77A}'
    - '{807583E5-5146-11D5-A672-00B0D022E945}'
  filter_optional_chrome:
    TargetObject|contains: '\SOFTWARE\Microsoft\Active Setup\Installed Components\{8A69D345-D564-463c-AFF1-A69D9E530F96}'
  filter_optional_edge:
    TargetObject|contains: '\SOFTWARE\Microsoft\Active Setup\Installed Components\{9459C573-B17A-45AE-9F64-1857B5D58CEE}'
  filter_optional_IE:
    TargetObject|contains: '\Software\Microsoft\Active Setup\Installed Components\{89820200-ECBD-11cf-8B85-00AA005B4383}'
  filter_optional_integrator:
    Image:
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
  filter_optional_office:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to autostart extensibility points (ASEPs) within the Windows registry. Attackers often manipulate these registry keys as part of persistence mechanisms to ensure that malicious code executes automatically upon user login or system boot. The suspected threat scenario involves adversaries seeking to establish long-term footholds in compromised systems, often to facilitate lateral movement or data exfiltration. Modifying ASEPs can lead to stealthy re-infections, especially when the system reboots or a user logs in.

  Relevant MITRE ATT&CK techniques that apply include:
  - **T1547.001 - Registry Run Keys / Startup Folder**: This technique covers modifications to registry entries that allow executables to run automatically when the user logs in.

  The primary data sources that will provide evidential support for this detection include:
  - **Windows Registry Logs**: Specific areas of the registry related to autorun functionality must be monitored to identify unauthorized changes.
  - **System Event Logs**: To correlate any registry modifications with user logins or system events, which may assist in confirming malicious behavior.

  ### Investigation Steps
  - **Review Registry Changes**: Examine Windows registry logs focusing on the keys defined in the detection logic. Look for recent modifications that are atypical or originate from unauthorized processes.
  - **Analyze Event Logs**: Look into system event logs around the time of the registry change to identify any associated events, such as user logins or application executions that may provide context to the modification.
  - **Correlate with User Activity**: Identify the user account responsible for the modification. Assess whether this action aligns with typical user behavior or roles within the enterprise to rule out legitimate administrative updates.
  - **Check for Additional Persistence Mechanisms**: Investigate other persistence-related techniques in use on the affected system, such as scheduled tasks or services, to determine if the modification is part of a broader attack strategy.

  ### Prioritization
  Alerts generated by this rule should be considered medium severity due to the potential impact of unauthorized persistent access on enterprise systems. The likelihood of such an event indicates heightened risk of future malicious activities that could compromise sensitive data.

  ### Blind Spots and Assumptions
  The detection logic assumes that all modifications to the specified registry keys are suspicious, which may lead to false positives, especially when legitimate applications or administrators make necessary changes. Coverage may be lacking if there are additional persistence techniques the rule does not capture. Additionally, proper Windows registry logging must be enabled, and the necessary security configurations in the SIEM or EDR must be implemented for this alert to function effectively.

