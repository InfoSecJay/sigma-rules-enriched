falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to specific autostart registry keys known as Autostart Extensibility Points (ASEP) in Windows. Such modifications can be indicative of persistence mechanisms employed by malicious actors, often aimed at maintaining access to compromised systems or escalating their privileges. This behavior aligns with the MITRE ATT&CK framework under the tactic of Persistence and the technique T1547.001.

  Primary telemetry sources include Windows Registry logs, specifically monitoring registry modification events across the listed registry paths. If the behavior is confirmed malicious, it could lead to a successful compromise that allows arbitrary code execution on startup, facilitating further malicious activity. However, this detection does not confirm that the modification is malicious or part of an overall attack on its own, as legitimate software or administrative actions may cause similar changes.

  ### Investigation Steps

  - **Examine registry modification details:** Query registry event logs (Event ID 4657) for alterations to paths including `\SOFTWARE\Microsoft\Command Processor\Autorun` or `\SOFTWARE\Microsoft\Windows CE Services\AutoStart`. Assess the `New Value Name` and `New Value Data` fields for suspicious data, especially if linked to unknown executables.

  - **Identify known good configurations:** Cross-reference the modifications against a baseline of legitimate autorun configurations used in your environment. Acceptable alterations might include software installations by IT personnel or during approved updates.

  - **Correlate executables with registry changes:** Check for the execution of related processes around the time of the registry modification. Use process creation logs (Event ID 4688) to identify new instances of `cmd.exe`, `poqexec.exe`, or other suspicious executables that may indicate a malicious workflow.

  - **Analyze user accounts making changes:** Review the `Security Event ID 4624` logs to identify which user account performed the registry modification. Legitimate modifications often come from administrative accounts, while changes by standard users or unexpected accounts warrant further scrutiny.

  - **Look for historical patterns in registry modifications:** Use historical registry analysis tools or scripts to evaluate past changes to these autostart keys. Frequent modifications from the same account or similar timestamps could suggest a malicious activity pattern.

  - **Cross-check against known malware signatures:** Utilize an endpoint protection or threat intelligence tool to assess the modified registry keys against known malware signatures associated with persistent access, such as Cobalt Strike or Metasploit frameworks.

  ### Prioritization

  This alert could signify a medium severity level based on the potential for unauthorized access to critical systems. Changes to autorun keys are a common technique in many persistence scenarios, making the likelihood of malicious abuse plausible. Affected systems, particularly critical servers or administrative workstations, amplify the impact of these modifications.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as legitimate applications modifying these keys, making benign changes that appear malicious. Reliable detection requires comprehensive monitoring of Windows Registry changes, including ensuring logging is correctly configured. Legitimate software installations or administrative configurations typically trigger similar alerts, necessitating careful context consideration. A related detection, such as monitoring for unusual process creations (Event ID 4688), would enhance the coverage and help differentiate between benign and malicious activities.

