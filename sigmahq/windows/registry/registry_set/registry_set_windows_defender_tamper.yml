author: AlertIQ, Ján Trenčanský, frack113, Nasreddine Bencherchali, Swachchhanda
  Shrawan Poudel
date: 2022-08-01
modified: 2024-10-07
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows Defender\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_1:
    TargetObject|endswith:
    - '\DisableAntiSpyware'
    - '\DisableAntiVirus'
    - '\DisableBehaviorMonitoring'
    - '\DisableBlockAtFirstSeen'
    - '\DisableEnhancedNotifications'
    - '\DisableIntrusionPreventionSystem'
    - '\DisableIOAVProtection'
    - '\DisableOnAccessProtection'
    - '\DisableRealtimeMonitoring'
    - '\DisableScanOnRealtimeEnable'
    - '\DisableScriptScanning'
    Details: 'DWORD (0x00000001)'
  selection_dword_0:
    TargetObject|endswith:
    - '\DisallowExploitProtectionOverride'
    - '\Features\TamperProtection'
    - '\MpEngine\MpEnablePus'
    - '\PUAProtection'
    - '\Signature Update\ForceUpdateFromMU'
    - '\SpyNet\SpynetReporting'
    - '\SpyNet\SubmitSamplesConsent'
    - '\Windows Defender Exploit Guard\Controlled Folder Access\EnableControlledFolderAccess'
    Details: 'DWORD (0x00000000)'
  filter_optional_symantec:
    Image|startswith: 'C:\Program Files\Symantec\Symantec Endpoint Protection\'
    Image|endswith: '\sepWscSvc64.exe'
  condition: selection_main and 1 of selection_dword_* and not 1 of 
    filter_optional_*
falsepositives:
- Administrator actions via the Windows Defender interface
- Third party Antivirus
level: high
note: |
  ### Technical Context

  This rule detects changes to Windows registry settings that disable essential functionalities of Windows Defender, indicating potential attempts by attackers to evade detection. The likely objective of such actions is to create an environment favorable for executing malicious activities, such as malware deployment or data exfiltration. This behavior falls under the MITRE ATT&CK tactic of Defense Evasion (T1562), specifically related to the technique of Disable or Modify Tools (T1685).

  The primary telemetry sources are Windows registry events logged through registry access monitoring, specifically focusing on actions captured in the registry_set category. If these registry settings are altered maliciously, it could expose the system to various attacks, increasing security risks. Importantly, this detection does NOT confirm that an attack is currently underway; legitimate administrative actions or configurations by third-party antivirus software may trigger similar alerts.

  ### Investigation Steps

  - **Examine registry change history:** Review Windows Event ID 4657 to identify which user account made changes to the registry keys associated with Windows Defender. Look for unusual user accounts performing administrative changes.

  - **Correlate with other security events:** Analyze recent Security Event ID 4624 (Logon) and 4688 (Process Creation) events for the same timeframe to determine if there are other suspicious activities or processes initiated by the same user account.

  - **Identify legitimate configuration changes:** Check if the registry change correlates with scheduled maintenance or updates typically performed by IT staff, as documented in internal change logs or in systems like ServiceNow.

  - **Investigate high-confidence indicators:** Look for DWORD values set to '1' in Event ID 4657 changes for keys ending in 'DisableRealtimeMonitoring', 'DisableAntiVirus' and others listed in the detection section. These indicate an active effort to disable core functionalities of Windows Defender.

  - **Assess third-party solutions:** Validate if third-party security software (e.g., Symantec Endpoint Protection) is present on the system and check for Event ID 7036 (Service State Change) showing that the service was stopped around the same time the registry changes were made.

  ### Prioritization

  This alert has a high severity due to the potential impact on critical systems protected by Windows Defender and the likelihood that malicious actors would exploit these weaknesses. The disabling of security functions is a commonly weaponized technique, often indicating a precursor to a larger attack.

  ### Blind Spots and Assumptions

  Possible evasion techniques include attackers using legitimate administrative permissions to alter settings, which can mask their activities. Reliable detection requires proper logging configurations, specifically enabling registry and process creation monitoring. Legitimate application updates or administrative actions by IT staff may also trigger this alert. Companion detections that strengthen coverage include monitoring for abnormal process creations that typically accompany registry changes to disable security features (e.g., Task Scheduler alterations or unusual binaries executed).

