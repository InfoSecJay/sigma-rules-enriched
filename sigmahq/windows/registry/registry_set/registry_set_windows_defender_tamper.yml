detection:
  selection_main:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows Defender\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_1:
    TargetObject|endswith:
    - '\DisableAntiSpyware'
    - '\DisableAntiVirus'
    - '\DisableBehaviorMonitoring'
    - '\DisableBlockAtFirstSeen'
    - '\DisableEnhancedNotifications'
    - '\DisableIntrusionPreventionSystem'
    - '\DisableIOAVProtection'
    - '\DisableOnAccessProtection'
    - '\DisableRealtimeMonitoring'
    - '\DisableScanOnRealtimeEnable'
    - '\DisableScriptScanning'
    Details: 'DWORD (0x00000001)'
  selection_dword_0:
    TargetObject|endswith:
    - '\DisallowExploitProtectionOverride'
    - '\Features\TamperProtection'
    - '\MpEngine\MpEnablePus'
    - '\PUAProtection'
    - '\Signature Update\ForceUpdateFromMU'
    - '\SpyNet\SpynetReporting'
    - '\SpyNet\SubmitSamplesConsent'
    - '\Windows Defender Exploit Guard\Controlled Folder Access\EnableControlledFolderAccess'
    Details: 'DWORD (0x00000000)'
  filter_optional_symantec:
    Image|startswith: 'C:\Program Files\Symantec\Symantec Endpoint Protection\'
    Image|endswith: '\sepWscSvc64.exe'
  condition: selection_main and 1 of selection_dword_* and not 1 of filter_optional_*
falsepositives:
- Administrator actions via the Windows Defender interface
- Third party Antivirus
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry that disable critical Windows Defender functionalities, such as real-time monitoring and anti-spyware protection. The likely attacker objective is to evade detection and facilitate malicious activities, such as deploying malware or ransomware without interference from security measures. This behavior fits into the MITRE ATT&CK framework under the tactic "Defense Evasion" (ID: T1562.001) due to the manipulation of security settings.

  The primary telemetry sources are Windows Registry logs with specific attention to events indicating changes to key registry paths related to Windows Defender configurations. If malicious, this can lead to heightened risk of system compromise by enabling malware to operate undetected. Note that this detection alone does not confirm malicious intent; legitimate administrative actions can also result in similar registry modifications.

  ---

  ### Investigation Steps

  - **Check registry modifications:**
    Review Windows Registry logs, specifically Event ID 4657 (Value modified), and examine changes in paths containing `\SOFTWARE\Microsoft\Windows Defender\` for any recent additions or modifications that involve disabling protection features.

  - **Analyze process creation:**
    Investigate recent process creation logs using Sysmon Event ID 1 to identify any suspicious processes that may have initiated the registry change, especially those not typically associated with legitimate administrative tasks.

  - **Identify known benign actions:**
    Cross-reference recorded actions against legitimate administrative activities related to software updates or maintenance that might have disabled specific Windows Defender functionalities, such as patch installations or third-party antivirus configurations.

  - **Review registry value details:**
    Ensure registry values being modified are set to `DWORD (0x00000001)` for disabling functions and `DWORD (0x00000000)` for enabling protective measures. This will assist in distinguishing between benign configurations and potential malicious changes.

  - **Look for associated events:**
    Cross-validate the timing of registry modifications with other event logs (e.g., Windows Security Event IDs 4688 for process creation or 4689 for process termination) to establish a timeline and context around how these changes occurred.

  - **Validate against high-confidence indicators:**
    Flag any changes related to disabling `DisableRealtimeMonitoring` or `DisableAntiVirus` directly, as these features are crucial for endpoint protection and are commonly targeted by malicious actors.

  ---

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on the enterprise's security posture. The likelihood of malicious intent is substantial, given that disabling such key security features is a common tactic used by attackers to facilitate further exploits. Furthermore, the behavior is frequently weaponized in ransomware campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of third-party software or legitimate administrative tasks that also modify registry settings, resulting in false positives. Reliable detection requires proper logging of registry changes, and Windows Defender must be configured to log such activities. Additionally, actions taken by system administrators or legitimate processes like Symantec Endpoint Protection might trigger this alert without malicious intent. A related detection that can enhance coverage is monitoring for unusual process creations or executions after registry changes, which may indicate further malicious activity.

