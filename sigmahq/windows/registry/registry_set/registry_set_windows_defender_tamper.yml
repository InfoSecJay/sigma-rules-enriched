logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows Defender\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_1:
    TargetObject|endswith:
    - '\DisableAntiSpyware'
    - '\DisableAntiVirus'
    - '\DisableBehaviorMonitoring'
    - '\DisableBlockAtFirstSeen'
    - '\DisableEnhancedNotifications'
    - '\DisableIntrusionPreventionSystem'
    - '\DisableIOAVProtection'
    - '\DisableOnAccessProtection'
    - '\DisableRealtimeMonitoring'
    - '\DisableScanOnRealtimeEnable'
    - '\DisableScriptScanning'
    Details: 'DWORD (0x00000001)'
  selection_dword_0:
    TargetObject|endswith:
    - '\DisallowExploitProtectionOverride'
    - '\Features\TamperProtection'
    - '\MpEngine\MpEnablePus'
    - '\PUAProtection'
    - '\Signature Update\ForceUpdateFromMU'
    - '\SpyNet\SpynetReporting'
    - '\SpyNet\SubmitSamplesConsent'
    - '\Windows Defender Exploit Guard\Controlled Folder Access\EnableControlledFolderAccess'
    Details: 'DWORD (0x00000000)'
  filter_optional_symantec:
    Image|startswith: 'C:\Program Files\Symantec\Symantec Endpoint Protection\'
    Image|endswith: '\sepWscSvc64.exe'
  condition: selection_main and 1 of selection_dword_* and not 1 of filter_optional_*
falsepositives:
- Administrator actions via the Windows Defender interface
- Third party Antivirus
level: high
note: |
  ### Technical Context
  This rule detects attempts by attackers or malicious software to disable Windows Defender functionalities through modifications to the Windows Registry. In a typical attack scenario, a threat actor may disable critical protections to facilitate subsequent malicious activities, such as deploying ransomware or other malware. By circumventing Windows Defender, they aim to evade detection and maintain persistence within the compromised environment. The control of antivirus and security settings is crucial for an attacker's success, particularly in scenarios involving ransom demands or data breaches.

  Relevant MITRE ATT&CK tactics include:
  - **Defense Evasion** (TA0005): The primary objective of disabling Windows Defender is to evade detection by security controls.
  - **Disable Security Tools** (T1562.001): Specifically targets functionalities of security software, highlighting the importance of maintaining operational integrity of defensive controls in a network environment.

  Primary data sources for this detection include:
  - Windows Registry logs that capture changes made to security settings and functionalities of Windows Defender.
  - Process creation events that can indicate when and how registry modifications are being made.

  ### Investigation Steps
  - **Review Registry Changes**: Analyze Windows registry change logs focusing on entries related to `\SOFTWARE\Microsoft\Windows Defender\` and any modifications to the values indicating disabled functionalities.
  - **Investigate Process Activities**: Check for any suspicious process creation events that coincide with the registry modifications. Look for unusual executables or scripts that may have emerged around the same timeframe.
  - **Collect Endpoint Logs**: Gather logs from endpoint detection solutions to identify any alerts that may have triggered around the same time as the registry changes. This could provide context on behavior leading to such modifications.
  - **Examine User and Account Activity**: Look for anomalous user activities or account logins, especially administrative actions that may align with the timing of the registry changes.

  ### Prioritization
  This alert is marked as high severity due to the significant impact that disabling antivirus functionalities can have on an organization's security posture. The likelihood of exploitation is also elevated, as this behavior is often linked to active attacks by threat actors seeking to bypass defenses.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if registry key modifications are not logged properly, or if other legitimate administrative actions are misidentified as potential threats, such as updates or configurations made through the standard Windows Defender interface. The detection logic assumes the presence of logging configurations that track detailed changes in registry values. Additionally, it may not account for scenarios where third-party antivirus solutions could also affect these Windows Defender settings, possibly leading to false positives if those products are in use.

