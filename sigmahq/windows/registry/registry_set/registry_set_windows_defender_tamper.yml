author: AlertIQ, Ján Trenčanský, frack113, Nasreddine Bencherchali, Swachchhanda
  Shrawan Poudel
date: 2022-08-01
modified: 2024-10-07
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows Defender\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender Security Center\'
    - '\SOFTWARE\Policies\Microsoft\Windows Defender\'
  selection_dword_1:
    TargetObject|endswith:
    - '\DisableAntiSpyware'
    - '\DisableAntiVirus'
    - '\DisableBehaviorMonitoring'
    - '\DisableBlockAtFirstSeen'
    - '\DisableEnhancedNotifications'
    - '\DisableIntrusionPreventionSystem'
    - '\DisableIOAVProtection'
    - '\DisableOnAccessProtection'
    - '\DisableRealtimeMonitoring'
    - '\DisableScanOnRealtimeEnable'
    - '\DisableScriptScanning'
    Details: 'DWORD (0x00000001)'
  selection_dword_0:
    TargetObject|endswith:
    - '\DisallowExploitProtectionOverride'
    - '\Features\TamperProtection'
    - '\MpEngine\MpEnablePus'
    - '\PUAProtection'
    - '\Signature Update\ForceUpdateFromMU'
    - '\SpyNet\SpynetReporting'
    - '\SpyNet\SubmitSamplesConsent'
    - '\Windows Defender Exploit Guard\Controlled Folder Access\EnableControlledFolderAccess'
    Details: 'DWORD (0x00000000)'
  filter_optional_symantec:
    Image|startswith: 'C:\Program Files\Symantec\Symantec Endpoint Protection\'
    Image|endswith: '\sepWscSvc64.exe'
  condition: selection_main and 1 of selection_dword_* and not 1 of 
    filter_optional_*
falsepositives:
- Administrator actions via the Windows Defender interface
- Third party Antivirus
level: high
note: |
  ### Technical Context

  This rule detects registry modifications that disable various functionalities of Windows Defender, indicating potential adversary behavior aimed at reducing host defenses. Attackers may aim to compromise systems or evade detection by altering protections offered by Windows Defender, with objectives often linked to malware deployment or further system exploitation. The relevant MITRE ATT&CK techniques include **Defense Evasion (T1562.001)**, where the goal is to disable security mechanisms.

  The primary telemetry source is the Windows Registry, specifically changes made to the keys associated with Windows Defender settings. If this behavior is confirmed to be malicious, it significantly increases the risk of malware execution, data exfiltration, or lateral movement within the network. Importantly, this detection does NOT confirm malicious activity on its own; it indicates a potential threat but requires context for further investigation.

  ### Investigation Steps

  - **Check recent registry changes:** Review Windows Registry logs for Event ID 4657, focusing on the keys specified in the rule. Look for suspicious access times or unfamiliar user accounts making changes.

  - **Identify user account involved:** Investigate the user account making the registry modifications by correlating with Event ID 4672 (Special privileges assigned to new logon) or use Sysmon Event ID 4624 for logon events. Legitimate administrators typically manage such settings, but unexpected user activity may indicate compromise.

  - **Correlate with process execution:** Examine Sysmon Event ID 1 (Process creation) for processes that may be associated with modification actions. Look for unusual executables or non-standard paths that coincide with registry changes.

  - **Review prior security alerts:** Cross-reference any previous alerts that may indicate compromised accounts or related malicious activity, particularly focusing on any commonly associated malware families that may disable security software.

  - **Analyze endpoint protection logs:** If using third-party antivirus solutions, verify through their logs that those were not the source of legitimate changes. Review console logs or API call logs to confirm expected behavior versus detected modifications.

  ### Prioritization

  This alert is severe due to the potential impact on critical business systems, as disabling Windows Defender can facilitate malware infections or unauthorized access. The likelihood of malicious abuse is high, given that this technique is often weaponized by adversaries against enterprises to bypass defense mechanisms.

  ### Blind Spots and Assumptions

  There are limitations in detection if the log retention policies do not retain registry events or if the registry monitoring is not properly configured. Legitimate activities, such as system administrators changing settings for maintenance or configuration purposes, can lead to false positives. A companion detection to consider is monitoring for **Windows Defender events** (Event ID 5007) to correlate defensive action attempts consistent with registry alterations.

