title: Persistence Via Disk Cleanup Handler - Autorun
id: d4e2745c-f0c6-4bde-a3ab-b553b3f693cc
status: test
description: |
  Detects when an attacker modifies values of the Disk Cleanup Handler in the registry to achieve persistence via autorun.
  The disk cleanup manager is part of the operating system.
  It displays the dialog box […] The user has the option of enabling or disabling individual handlers by selecting or clearing their check box in the disk cleanup manager's UI.
  Although Windows comes with a number of disk cleanup handlers, they aren't designed to handle files produced by other applications.
  Instead, the disk cleanup manager is designed to be flexible and extensible by enabling any developer to implement and register their own disk cleanup handler.
  Any developer can extend the available disk cleanup services by implementing and registering a disk cleanup handler.
references:
- https://persistence-info.github.io/Data/diskcleanuphandler.html
- https://www.hexacorn.com/blog/2018/09/02/beyond-good-ol-run-key-part-86/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  root:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\'
  selection_autorun:
        # Launching PreCleanupString / CleanupString programs w/o gui, i.e. while using e.g. /autoclean
    TargetObject|contains: '\Autorun'
    Details: 'DWORD (0x00000001)'
  selection_pre_after:
    TargetObject|contains:
    - '\CleanupString'
    - '\PreCleanupString'
    Details|contains:
            # Add more as you see fit
    - 'cmd'
    - 'powershell'
    - 'rundll32'
    - 'mshta'
    - 'cscript'
    - 'wscript'
    - 'wsl'
    - '\Users\Public\'
    - '\Windows\TEMP\'
    - '\Microsoft\Windows\Start Menu\Programs\Startup\'
  condition: root and 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications made to the registry values of the Disk Cleanup Handler, which is often exploited by attackers to establish persistence on Windows systems. By altering these registry settings, a malicious actor can ensure that their payload is executed whenever the Disk Cleanup utility is initiated, effectively operating without the user's knowledge. The likely objective here is maintaining access to the compromised system over time while avoiding detection from conventional security measures.

  The relevant MITRE ATT&CK tactics for this behavior include **Persistence** (TA0003) through techniques such as **Registry Run Keys/Startup Folder** (T1218), as this method allows attackers to set their code to run automatically. The primary data sources for detecting this kind of behavior are Windows registry logs, specifically monitoring changes in the registry paths associated with the Disk Cleanup Handler.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate the Windows registry specifically under `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\`. Look for suspicious modifications to values that indicate potential exploitation.

  - **Examine Execution Context**: Analyze execution events associated with `CleanupString` or `PreCleanupString`. Focus on logs that may show unusual command line arguments or the launch of unfamiliar scripts.

  - **Correlate with User Activity**: Cross-reference detected registry modifications with user activity logs to confirm whether legitimate users executed the Disk Cleanup utility or if there is evidence of unauthorized manipulation.

  - **Monitor Scheduled Tasks and Startup Entries**: Check for any related tasks or entries included under typical startup paths, such as `\Users\Public\`, `\Windows\TEMP\`, and `Startup` folders, which could suggest attempts at persistence beyond the initial registry alteration.

  ### Prioritization
  The severity of this alert is medium due to the potential for long-term system compromise. While the immediate risk may not be as pronounced as other exploit methods, the ability of an attacker to persistently execute unauthorized code significantly increases the overall attack surface and potential impact.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage related to similar persistence methods that do not utilize the Disk Cleanup Handler directly or that occur outside the Windows registry. The detection logic assumes that the registry is being actively monitored and that any changes to the relevant keys are logged properly. Required logs include comprehensive auditing of registry changes, specifically those to security-related registry paths and their values, to ensure effective detection.

