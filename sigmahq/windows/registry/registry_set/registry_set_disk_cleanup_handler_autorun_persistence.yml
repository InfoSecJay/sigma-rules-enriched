title: Persistence Via Disk Cleanup Handler - Autorun
id: d4e2745c-f0c6-4bde-a3ab-b553b3f693cc
status: test
description: |
  Detects when an attacker modifies values of the Disk Cleanup Handler in the registry to achieve persistence via autorun.
  The disk cleanup manager is part of the operating system.
  It displays the dialog box […] The user has the option of enabling or disabling individual handlers by selecting or clearing their check box in the disk cleanup manager's UI.
  Although Windows comes with a number of disk cleanup handlers, they aren't designed to handle files produced by other applications.
  Instead, the disk cleanup manager is designed to be flexible and extensible by enabling any developer to implement and register their own disk cleanup handler.
  Any developer can extend the available disk cleanup services by implementing and registering a disk cleanup handler.
references:
- https://persistence-info.github.io/Data/diskcleanuphandler.html
- https://www.hexacorn.com/blog/2018/09/02/beyond-good-ol-run-key-part-86/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2023-08-17
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  root:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\'
  selection_autorun:
        # Launching PreCleanupString / CleanupString programs w/o gui, i.e. while using e.g. /autoclean
    TargetObject|contains: '\Autorun'
    Details: 'DWORD (0x00000001)'
  selection_pre_after:
    TargetObject|contains:
    - '\CleanupString'
    - '\PreCleanupString'
    Details|contains:
            # Add more as you see fit
    - 'cmd'
    - 'powershell'
    - 'rundll32'
    - 'mshta'
    - 'cscript'
    - 'wscript'
    - 'wsl'
    - '\Users\Public\'
    - '\Windows\TEMP\'
    - '\Microsoft\Windows\Start Menu\Programs\Startup\'
  condition: root and 1 of selection_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry related to the Disk Cleanup Handler, which can enable persistence for malware by setting autorun options. The likely attacker objective includes maintaining access to compromised systems by ensuring that malicious payloads execute during regular system maintenance tasks without user interaction. Relevant MITRE ATT&CK techniques include "Registry Run Keys / Startup Folder" (T1547.001). The primary telemetry source is registry modification logs with specific attention to keys under `\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\`. If malicious, this could provide an attacker with ongoing access despite system reboots. However, this detection does not confirm malicious intent on its own, as legitimate software may also modify these registry keys.

  ### Investigation Steps

  - **Check the registry keys**: Review `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\` for any non-standard entries or those created recently that may relate to unauthorized programs running at startup.

  - **Identify recent modification events**: Look for registry modification events (Event ID 4657 or Sysmon Event ID 13) and cross-reference the timestamps with the alert to understand when the change was made.

  - **Validate expected behavior**: Legitimate Disk Cleanup Handler modifications should primarily touch default cleanup settings. Check for expected values within the following paths and expected handler applications: `\CleanupString` and `\PreCleanupString`.

  - **Assess autorun entries**: Examine the autorun key located at `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Run` for any recently added or unusual programs that could signify persistence beyond the normal cleanup handler.

  - **Identify high-confidence malicious indicators**: Look for the presence of common scripting engines in the `CleanupString` or `PreCleanupString` values, such as `cmd`, `powershell`, or `wscript`, which are often used by attackers to execute arbitrary commands.

  - **Cross-check with baseline behavior**: Compare the current registry configuration against a known good baseline for this system to ascertain any anomalous entries indicative of compromise.

  ### Prioritization

  This alert is of medium severity due to its potential to enable persistent access for attackers, significantly impacting any critical system affected. The likelihood of being abused maliciously is moderate, as the described technique is a known evasion tactic employed by various threat actors.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications modifying these registry settings as part of normal operations or maintenance. Reliable detection hinges on proper logging of registry changes, requiring specific Windows auditing configurations. One common legitimate activity that may trigger this alert includes system updates or third-party cleanup tools adjusting registry settings. A related detection to enhance coverage would involve monitoring for changes to the Startup folder (T1547.001) to catch additional persistence mechanisms.

