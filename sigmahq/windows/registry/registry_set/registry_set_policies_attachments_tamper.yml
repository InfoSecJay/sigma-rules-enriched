logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\'
  selection_value_hide_zone_info:
    TargetObject|endswith: '\HideZoneInfoOnProperties'
    Details: 'DWORD (0x00000001)'     # On
  selection_value_save_zone_info:
    TargetObject|endswith: '\SaveZoneInformation'
    Details: 'DWORD (0x00000002)'     # Off
  selection_value_scan_with_av:
    TargetObject|endswith: '\ScanWithAntiVirus'
    Details: 'DWORD (0x00000001)'     # Disabled
  condition: selection_main and 1 of selection_value_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Attachment Manager settings, specifically changes that could disable security features intended to protect users from potentially unsafe file attachments. Such modifications can facilitate the execution of malicious files that would otherwise be blocked by standard security checks. The likely attacker objective is to disable defenses against file-based threats, allowing harmful attachments to run without warnings, thus aiding malware deployment or data exfiltration.

  Relevant MITRE ATT&CK tactics and techniques include Defense Evasion (T1203: Exploitation for Client Execution). The primary telemetry source involves Windows Registry event logs, particularly focusing on the alterations made under the path `\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\`. If successful, these tampering actions can lead to significant security breaches by allowing malicious files to bypass protective measures. However, this detection alone does not confirm an active compromise, as legitimate administrative changes could occur in a controlled environment.

  ### Investigation Steps

  - **Inspect registry changes for suspicious values**: Review Windows Registry for alterations under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\`. Focus on entries for `HideZoneInfoOnProperties`, `SaveZoneInformation`, and `ScanWithAntiVirus`. Values of `0x00000001` for hiding zone info or `0x0000002` for saving zone information may indicate malicious behavior when done unexpectedly.

  - **Correlate with recent file activity**: Check the System or Security Event Logs (Event ID 4688) for recent process creations that coincide with the time of registry modification. This can help identify if processes related to unauthorized or unknown software have been instantiated.

  - **Determine legitimate administrative actions**: Validate if any recent changes align with known operational maintenance activities, which could include software updates or controlled configurations. Note that legitimate changes are usually performed by system administrators and followed by appropriate documentation.

  - **Identify high-confidence malicious indicators**: Look for specific processes that are commonly associated with malware, like unrecognized executables in `C:\Program Files` or `C:\Users\Public\Downloads` that match temporal registry changes. Use VirusTotal for hashes related to modified attachment manager settings to gauge risk.

  - **Monitor for additional indicators of compromise (IoCs)**: Look for following behaviors related to email gateways, such as unusual attachment types that may bypass these regulatory settings. Cross-reference detected domains or IPs against threat intelligence sources.

  ### Prioritization

  The alert severity is high due to the potential impact on security if critical attachment manager settings are altered. The likelihood of malicious abuse is significant, as attackers frequently manipulate such settings to exploit vulnerable users or systems, making this activity commonly weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions that may trigger this alert, especially in larger environments where changes may be common. Reliable detection requires comprehensive Windows Registry logging to capture modifications accurately. Additionally, benign scenarios, such as software installs or updates, could potentially trigger this alert. A related detection could include monitoring application logs for subsequent behavior following registry changes that show file execution, which helps to confirm if any changes are indeed malicious.

