logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\'
  selection_value_hide_zone_info:
    TargetObject|endswith: '\HideZoneInfoOnProperties'
    Details: 'DWORD (0x00000001)'     # On
  selection_value_save_zone_info:
    TargetObject|endswith: '\SaveZoneInformation'
    Details: 'DWORD (0x00000002)'     # Off
  selection_value_scan_with_av:
    TargetObject|endswith: '\ScanWithAntiVirus'
    Details: 'DWORD (0x00000001)'     # Disabled
  condition: selection_main and 1 of selection_value_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects changes to Windows Attachment Manager settings, specifically tampering with policies that manage the handling of attachments from potentially unsafe sources. An attacker may target these settings to bypass security measures, enabling the execution of malicious attachments without proper warnings or scans. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique "Modify Registry" (T1112).

  The primary telemetry source is Windows Registry logs, specifically tracking alterations to keys in the path `\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\`. If malicious, altering these settings can allow malicious files to execute without security warnings, significantly increasing the risk of compromise. Notably, this detection does NOT confirm malicious activity on its own, as there may be legitimate reasons for configuration changes.

  ### Investigation Steps

  - **Review Registry Changes:** Examine Registry modifications using Security Event ID 4663 and look for changes in the path `\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\`. Determine if the changes correspond to known benign configurations or approved security practices.

  - **Identify Malicious Indicators:** Look for the specific values being set in the registry:
    - `HideZoneInfoOnProperties` set to `0x00000001` (enabled) indicates attempts to suppress warnings.
    - `SaveZoneInformation` set to `0x00000002` (disabled) suggests malicious intent to ignore zone information.
    - `ScanWithAntiVirus` set to `0x00000001` (disabled) indicates deactivation of antivirus scans for attachments.

  - **Correlate with User Activity:** Review user activity logs, particularly those related to file downloads or email attachments, to identify any context for the registry changes. Security Event ID 4688 (Process Creation) can help correlate launched processes with payloads downloaded from untrusted sources.

  - **Consult Host Role and Asset Criticality:** If changes are observed on critical systems, escalate the investigation. Systems handling sensitive data are more likely targets for this type of tampering.

  - **Document Legitimate Changes:** Consider administrative routines or legitimate security policy updates that may also lead to similar registry changes. Cross-reference with change management records.

  ### Prioritization

  This alert is of high severity due to the potential impact on system security if malicious changes are confirmed. The likelihood of abuse is significant as attackers often disable security features to further compromise systems. This behavior can be weaponized in targeted attacks leveraging document-based malware.

  ### Blind Spots and Assumptions

  Detection may be limited by the completeness of Registry logging; settings changes could occur without appropriate audit policies enabled. Legitimate process installations or administrative changes may also trigger this alert. A related detection of interest would be monitoring for signs of malware infection, such as unusual process creation patterns associated with downloads, enhancing overall threat visibility.

