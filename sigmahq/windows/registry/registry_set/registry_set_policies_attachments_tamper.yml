title: Potential Attachment Manager Settings Attachments Tamper
id: ee77a5db-b0f3-4be2-bfd4-b58be1c6b15a
status: test
description: Detects tampering with attachment manager settings policies attachments
  (See reference for more information)
references:
- https://support.microsoft.com/en-us/topic/information-about-the-attachment-manager-in-microsoft-windows-c48a4dcd-8de5-2af5-ee9b-cd795ae42738
- https://www.virustotal.com/gui/file/2bcd5702a7565952c44075ac6fb946c7780526640d1264f692c7664c02c68465
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-08-17
tags:
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\'
  selection_value_hide_zone_info:
    TargetObject|endswith: '\HideZoneInfoOnProperties'
    Details: 'DWORD (0x00000001)'     # On
  selection_value_save_zone_info:
    TargetObject|endswith: '\SaveZoneInformation'
    Details: 'DWORD (0x00000002)'     # Off
  selection_value_scan_with_av:
    TargetObject|endswith: '\ScanWithAntiVirus'
    Details: 'DWORD (0x00000001)'     # Disabled
  condition: selection_main and 1 of selection_value_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies changes to the Attachment Manager policies in Windows, specifically focusing on the tampering of settings that affect how downloaded attachments are handled. Attackers often manipulate these settings to bypass security warnings or prevent antivirus scans, facilitating the delivery of malicious files. Such modifications may be indicative of an attempt to evade detection, aligning with the behavior seen in threat actors who utilize social engineering techniques or deliver ransomware and other malware via attachments.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (T1562), as altering Attachment Manager settings can help attackers hide hostile activities by suppressing warnings and preventing protective mechanisms from being triggered. This type of activity can often be linked to various threat families that employ scripting or social engineering to deliver malicious payloads.

  Primary data sources for this detection include **Windows Registry logs**, especially those pertaining to the Attachment Manager settings. Monitoring these changes can provide critical insight into potential security incidents before they escalate into broader breaches.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows Registry to identify the specific alterations made to `\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments\`. Look for any unauthorized modifications to the `HideZoneInfoOnProperties`, `SaveZoneInformation`, or `ScanWithAntiVirus` values.

  - **Collect Related Logs**: Gather relevant security logs from EDR solutions and system event logs that capture the timeline of changes made to the Attachment Manager settings. This will help establish context and identify any other associated suspicious behaviors.

  - **Analyze Process Activity**: Investigate any recent process creation events around the time of the changes. Focus on processes that are known to handle file downloads or that may execute scripts, which could provide context to the tampering.

  - **Cross-Check User Access**: Verify the user accounts that made the registry changes. Look for anomalies, such as non-administrative accounts making elevated changes or changes occurring outside normal business hours.

  ### Prioritization
  This alert is of high severity due to its direct implications for the organization's security posture. Tampering with Attachment Manager settings can significantly increase the risk of malware infections, as it suggests that an attacker is actively seeking to bypass protective mechanisms.

  ### Blind Spots and Assumptions
  This detection relies heavily on the availability of comprehensive registry logs and monitoring configurations. Gaps may exist if changes are made via direct command-line interfaces or scripts that do not trigger standard logging. An assumption is made that any legitimate administrative changes have proper logging; however, if administrative permission abuse occurs, it could lead to false negatives. For optimal functionality, ensure that registry auditing is properly configured and that logs are retained for a suitable duration to capture relevant events.

