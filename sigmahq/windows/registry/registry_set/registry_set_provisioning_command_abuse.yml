note: |
  ### Technical Context

  This Sigma rule detects potentially malicious modifications to the provisioning registry key (`\SOFTWARE\Microsoft\Provisioning\Commands\`), which can be abused for binary proxy execution via `Provlaunch.exe`. The likely attacker objective is to execute commands indirectly or evade detection mechanisms by launching malicious payloads through legitimate system processes. This activity corresponds with the MITRE ATT&CK technique T1218 (System Binary Proxy Execution).

  Primary telemetry sources include Windows Registry logs, specifically monitoring changes to the provisioning registry key. The security impact of this behavior is significant; successful exploitation can lead to unauthorized command execution with escalated privileges. However, this detection does NOT confirm malicious intent on its own, as legitimate administrative activities may trigger similar registry modifications.

  ### Investigation Steps

  - **Validate the registry changes:** Review the Windows Registry logs (Event ID 4657) for entries reflecting modifications to `\SOFTWARE\Microsoft\Provisioning\Commands\`. Look for unexpected values or commands that appear non-standard for your environment.

  - **Identify the user and process context:** Examine the user account and process linked to the registry modification. Use Sysmon Event ID 10 to find process creation details for `Provlaunch.exe`. Investigate if the user has legitimate administrative privileges.

  - **Correlate with process execution logs:** Cross-reference with Windows Security Event ID 4688 to identify correlating process creation events around the time of the registry change. Unexpected execution of commands through `Provlaunch.exe` indicates malicious activity.

  - **Spot legitimate usage patterns:** Identify expected administrative activities that may involve the provisioning registry key, such as IT management scripts or automated provisioning processes. Document any benign patterns observed in the system to guide future investigations.

  - **Collect file execution artifacts:** Check for created or modified files in directories typically associated with provisioning operations (e.g., `%windir%\system32\`). Timestamps and file hashes can indicate whether these modifications align with legitimate system updates or potential malware activity.

  ### Prioritization

  This alert should be considered high severity due to the critical nature of changes to the provisioning registry key, which if exploited, can lead to significant system compromise. The likelihood of malicious abuse is high, as the behavior is aligned with known exploitation techniques. Additionally, binary proxy execution is a commonly weaponized method in sophisticated attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by the logging configuration; if registry auditing is not enabled, legitimate modifications may go undetected. False positives may stem from administrative tasks performed by IT personnel or automated scripts. To enhance coverage, correlate with companion detections related to direct command execution methods or abnormal activity in processes and services invoked from provisioning commands.

