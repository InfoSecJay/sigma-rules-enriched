note: |
  ### Technical Context

  This rule detects modifications to registry keys related to PowerShell logging capabilities, specifically disabling module logging, script block logging, and transcription. The likely attacker objective is to evade detection of malicious PowerShell scripts or commands by turning off logging mechanisms that would capture their execution details. This behavior aligns with the MITRE ATT&CK tactics of Defense Evasion (ID: T1564.001) and Persistence (ID: T1112). The primary telemetry source is Windows registry changes, specifically targeting the `HKEY_CURRENT_USER\Software\Microsoft\Windows\PowerShell` and `HKEY_CURRENT_USER\Software\Microsoft\PowerShellCore` registry paths to monitor for the specific key modifications noted.

  If these changes are malicious, they could severely compromise the organization’s security posture by enabling malicious actors to run undetected PowerShell commands. However, this detection does NOT confirm that any malicious activity has occurred; it only indicates an attempt to disable critical logging functionalities that can affect overall monitoring and detection efforts.

  ### Investigation Steps

  - **Verify registry changes:** Check the relevant registry paths for changes using the `reg query HKEY_CURRENT_USER\Software\Microsoft\Windows\PowerShell` and `reg query HKEY_CURRENT_USER\Software\Microsoft\PowerShellCore`. Look specifically for the listed DWORD values set to '0', indicating logging has been disabled.

  - **Identify user context:** Review User Account logs (Event ID 4624) to determine the user account making the changes. If this is an administrative account without a legitimate reason for disabling logging, it may indicate malicious activity.

  - **Assess PowerShell activity:** Analyze PowerShell command execution logs (Event ID 4104 for PowerShell) prior to the registry modification for any potentially harmful commands, scripts, or invocation of modules that could correlate with the logging changes.

  - **Review legitimate use cases:** Assess if the observed modification aligns with expected operations. For instance, system administrators may occasionally modify these settings temporarily during maintenance. Document legitimate administrative actions as necessary for future reference.

  - **Monitor persistence indicators:** Check for additional persistence methods in context with the registry modification, such as scheduled tasks or startup programs that leverage PowerShell without logging (e.g., Event ID 4698 or Event ID 7030).

  - **Correlate with other alerts:** Review correlated alerts or rules that may relate to PowerShell script activity or registry modifications, which further indicate potential evasion tactics or behavior consistent with malicious actors.

  ### Prioritization

  This alert should be considered high severity due to the critical nature of PowerShell in Windows environments and its frequent use by attackers to execute commands and manipulate systems. The disabling of logging significantly increases the risk of undetected malicious activity and payload delivery.

  ### Blind Spots and Assumptions

  Possible evasion techniques include legitimate users modifying these settings for benign purposes, such as during software updates or troubleshooting. Reliable detection requires proper monitoring of registry activity and may need specific logging configurations enabled on Windows systems. Additionally, legitimate automation scripts or administrative tasks can inadvertently trigger this rule, emphasizing the importance of contextual analysis. A related detection to strengthen coverage may involve monitoring PowerShell command execution logs for anomalies (Event ID 4104).

