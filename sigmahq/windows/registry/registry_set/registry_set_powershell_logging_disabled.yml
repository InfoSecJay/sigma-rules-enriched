note: |
  ### Technical Context

  This rule detects changes to specific registry keys associated with PowerShell logging for the currently logged-in user. By disabling PowerShell module logging, script block logging, or transcription, an attacker may aim to conceal their activities during a malicious PowerShell session. The relevant MITRE ATT&CK tactics are Defense Evasion (T1564.001) and Collection (T1112). The primary telemetry source is Windows registry changes, specifically monitoring `HKEY_CURRENT_USER\Software\Microsoft\Windows\PowerShell` and `HKEY_CURRENT_USER\Software\Microsoft\PowerShellCore`. If an attacker successfully disables these logs, they hinder detection capabilities, potentially allowing further malicious activities undetected. This detection does NOT confirm that malicious activity has taken place; it simply indicates a change that may be indicative of malicious intent.

  ### Investigation Steps

  - **Review registry changes**: Check for modifications to `HKEY_CURRENT_USER\Software\Microsoft\Windows\PowerShell` and `HKEY_CURRENT_USER\Software\Microsoft\PowerShellCore`. Specifically, look for changes on the keys: `EnableModuleLogging`, `EnableScriptBlockLogging`, `EnableTranscripting` with a value of `0` (DWORD). Absence of prior values may indicate tampering.

  - **Correlate with PowerShell activity**: Investigate recent PowerShell commands executed by the logged-in user. Look for Event ID 4104 (PowerShell Script Block Logging) or Event ID 4688 (Process Creation) to assess if logging was actively utilized before the registry modification. Look for highly suspicious command patterns or encoded commands.

  - **Identify legitimate use cases**: Validate if the user is known to perform maintenance or development tasks that would typically involve disabling logging (e.g., application testing). This may provide context for the registry modifications.

  - **Evaluate the impact of affected accounts**: Determine the role of the affected user account. If it's associated with administrative privileges or critical systems, the severity of registry changes increases. This may necessitate escalation.

  - **Examine related logging settings**: Investigate whether other security settings, like audit policies and advanced event logging, are also disabled. This could indicate broader evasion tactics unrelated to PowerShell.

  - **Establish a baseline for expected behavior**: Document any standard operating procedures your organization follows for PowerShell logging. Collect data on the average frequency of registry changes, and use this to identify anomalies indicating potential tampering.

  ### Prioritization

  The severity of this alert is high due to the sensitive nature of PowerShell and its extensive use in both legitimate administrative tasks and malicious activities. The likelihood of abuse is significant, as disabling logging is a common step for threat actors aiming to evade detection. This behavior is frequently weaponized in advanced persistent threat (APT) scenarios.

  ### Blind Spots and Assumptions

  The detection may not fully capture scenarios where attackers use legitimate accounts to modify logging settings or if the changes are executed via scripts that are themselves obfuscated. Accurate detection requires enabling detailed registry auditing on Windows systems. Additionally, legitimate administrative tasks such as updating scripts or working in test environments may trigger this alert. Companion detections, such as monitoring for unusual PowerShell execution patterns or command-line arguments, can strengthen coverage against evasion efforts.

