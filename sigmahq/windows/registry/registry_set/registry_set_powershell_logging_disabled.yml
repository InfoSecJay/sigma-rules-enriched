note: |
  ### Technical Context
  This detection rule identifies alterations in the Windows Registry that disable logging features for PowerShell. Specifically, it focuses on changes made by attackers to disable module logging, script block logging, transcription logging, and general script execution logging. These logging features are crucial for monitoring and auditing PowerShell activities, which are commonly exploited by threat actors to execute malicious commands while evading detection.

  The primary threat scenario involves an attacker aiming to establish persistent access or execute lateral movement techniques while minimizing their visibility. Disabling logging makes it significantly harder for IT and security teams to trace malicious actions back to their origin, allowing attackers to operate stealthily within a network. Relevant MITRE ATT&CK tactics include Defense Evasion (T1564.001) and Persistence (T1112), as disabling logging supports evasion strategies and can be part of broader persistence mechanisms.

  The primary data sources for this detection include Windows Registry Change Logs, specifically monitoring modifications to registry keys related to PowerShell logging. These logs will provide evidence of any tampering with critical settings that could indicate malicious intent.

  ### Investigation Steps
  - **Review Registry Change Logs:** Analyze recent entries in the Windows Registry that show modifications to the PowerShell logging settings. Focus on the specific keys related to module logging, script block logging, and transcription.

  - **Analyze System Events:** Examine system event logs for unusual behavior related to PowerShell execution. Look for event IDs associated with PowerShell usage and changes to related security settings, which may indicate malicious activity.

  - **Correlate with User Activity:** Cross-reference the timing of registry changes with user logins and recent PowerShell command executions. Investigate whether these actions align with known user behavior or seem anomalous, suggesting potential account compromise.

  - **Query for Recent PowerShell Activity:** Utilize telemetry from endpoint detection tools to generate reports on recent PowerShell activity. Look for patterns such as script execution and command histories that might reveal attempts to conduct unauthorized actions.

  ### Prioritization
  The alert's severity is high due to the critical role PowerShell plays in modern Windows environments. Attackers often exploit this functionality to execute harmful scripts, and disabling logging significantly increases their chances of evading detection, potentially leading to data breaches or prolonged unauthorized access.

  ### Blind Spots and Assumptions
  One gap in detection coverage may arise from the reliance on registry-based logging, as some attackers may employ tactics that do not involve modifications to these registry keys. The detection logic assumes that modifications to registry settings will correlate with malicious behavior; however, legitimate administrative activities may also trigger similar changes. Finally, to ensure the effectiveness of this alert, organizations must have proper logging configurations enabled for registry changes and ensure that the necessary monitoring tools are in place to detect these modifications.

