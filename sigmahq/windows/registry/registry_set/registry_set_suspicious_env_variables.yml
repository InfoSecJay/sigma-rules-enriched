title: Suspicious Environment Variable Has Been Registered
id: 966315ef-c5e1-4767-ba25-fce9c8de3660
status: test
description: Detects the creation of user-specific or system-wide environment variables
  via the registry. Which contains suspicious commands and strings
references:
- https://infosec.exchange/@sbousseaden/109542254124022664
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-20
modified: 2023-08-17
tags:
- attack.defense-evasion
- attack.persistence
logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains: '\Environment\'
  selection_details:
  - Details:
    - 'powershell'
    - 'pwsh'
  - Details|contains:
              # Add more suspicious strings in env variables below
    - '\AppData\Local\Temp\'
    - 'C:\Users\Public\'
              # Base64 MZ Header
    - 'TVqQAAMAAAAEAAAA'           # MZ..........
    - 'TVpQAAIAAAAEAA8A'
    - 'TVqAAAEAAAAEABAA'
    - 'TVoAAAAAAAAAAAAA'
    - 'TVpTAQEAAAAEAAAA'
              # Base64 Invoke- (UTF-8)
    - 'SW52b2tlL'
    - 'ludm9rZS'
    - 'JbnZva2Ut'
              # Base64 Invoke- (UTF-16LE)
    - 'SQBuAHYAbwBrAGUALQ'
    - 'kAbgB2AG8AawBlAC0A'
    - 'JAG4AdgBvAGsAZQAtA'
  - Details|startswith:        # https://gist.github.com/Neo23x0/6af876ee72b51676c82a2db8d2cd3639
    - 'SUVY'
    - 'SQBFAF'
    - 'SQBuAH'
    - 'cwBhA'
    - 'aWV4'
    - 'aQBlA'
    - 'R2V0'
    - 'dmFy'
    - 'dgBhA'
    - 'dXNpbm'
    - 'H4sIA'
    - 'Y21k'
    - 'cABhAH'
    - 'Qzpc'
    - 'Yzpc'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the registration of suspicious user-specific or system-wide environment variables in the Windows registry. Attackers often manipulate environment variables to execute malicious scripts or commands, enabling them to maintain persistence or evade detection. The presence of certain keywords or patterns, such as references to PowerShell, encoded commands, or unusual file paths, raises red flags about potential malicious activity in the environment.

  The likely scenario involves threat actors using environment variables to orchestrate follow-up attacks or automate malicious operations, such as downloading and executing malware on compromised systems. Notably, these tactics are indicative of advanced persistent threats (APTs), where attackers aim to establish a foothold within the targeted environment.

  This rule is relevant to the following MITRE ATT&CK tactics and techniques:
  - **Defense Evasion** (T1203): Manipulating environment variables can help attackers avoid detection systems.
  - **Persistence** (T1053): Creating persistent entries in environment variables allows attackers to maintain access across system reboots.

  The primary data source for this detection includes Windows registry logs, specifically monitoring modifications made to the environment variable keys.

  ### Investigation Steps
  - **Review Registry Changes**: Examine Windows registry logs that reflect modifications to user-specific or system-wide environment variables, focusing on newly created or altered values under the `\Environment\` path.
  - **Analyze Suspicious Strings**: Pay close attention to any environment variables containing strings or commands related to PowerShell or locations such as `C:\Users\Public\` or `\AppData\Local\Temp\`, which are commonly associated with malware behavior.
  - **Check Execution Context**: Investigate the context when these environment variables were created, including the user account and any associated executables, to assess whether they align with legitimate user activity or indicate malicious intent.
  - **Correlate with Event Data**: Cross-reference the findings with process creation events and other relevant telemetry (e.g., EDR logs) to confirm if the suspicious environment variables have been leveraged to launch malicious processes.

  ### Prioritization
  This alert is considered high severity due to the potential for significant impact on the enterprise environment. Manipulated environment variables can be used for executing automated or malicious commands that compromise system integrity and data confidentiality, making quick identification and remediation essential.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage concerning legitimate applications or administrative activities that modify environment variables in normal operations, leading to potential false positives. The detection logic assumes that all suspicious keywords or patterns are indicative of malicious behavior, which may not always be true. Additionally, for the alert to function properly, comprehensive logging of Windows registry modifications must be enabled to ensure accurate detection of changes to environment variables.

