title: Suspicious Environment Variable Has Been Registered
id: 966315ef-c5e1-4767-ba25-fce9c8de3660
status: test
description: Detects the creation of user-specific or system-wide environment 
  variables via the registry. Which contains suspicious commands and strings
references:
- https://infosec.exchange/@sbousseaden/109542254124022664
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-20
modified: 2023-08-17
tags:
- attack.persistence
- attack.stealth
logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains: '\Environment\'
  selection_details:
  - Details:
    - 'powershell'
    - 'pwsh'
  - Details|contains:
              # Add more suspicious strings in env variables below
    - '\AppData\Local\Temp\'
    - 'C:\Users\Public\'
              # Base64 MZ Header
    - 'TVqQAAMAAAAEAAAA'           # MZ..........
    - 'TVpQAAIAAAAEAA8A'
    - 'TVqAAAEAAAAEABAA'
    - 'TVoAAAAAAAAAAAAA'
    - 'TVpTAQEAAAAEAAAA'
              # Base64 Invoke- (UTF-8)
    - 'SW52b2tlL'
    - 'ludm9rZS'
    - 'JbnZva2Ut'
              # Base64 Invoke- (UTF-16LE)
    - 'SQBuAHYAbwBrAGUALQ'
    - 'kAbgB2AG8AawBlAC0A'
    - 'JAG4AdgBvAGsAZQAtA'
  - Details|startswith:        # https://gist.github.com/Neo23x0/6af876ee72b51676c82a2db8d2cd3639
    - 'SUVY'
    - 'SQBFAF'
    - 'SQBuAH'
    - 'cwBhA'
    - 'aWV4'
    - 'aQBlA'
    - 'R2V0'
    - 'dmFy'
    - 'dgBhA'
    - 'dXNpbm'
    - 'H4sIA'
    - 'Y21k'
    - 'cABhAH'
    - 'Qzpc'
    - 'Yzpc'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_suspicious_env_variables/info.yml
note: |
  ### Technical Context

  The detection rule identifies the creation of suspicious environment variables within the Windows registry that may include malicious commands or strings. Attackers often use this tactic to establish persistence or obfuscate their activities across sessions. This behavior aligns with the MITRE ATT&CK framework, specifically under the Persistence tactic (T1547) and the technique of Registry Run Keys / Startup Folder (T1547.001).

  Primary telemetry source includes Windows Registry events, specifically focusing on registry modifications tied to environment variables. If associated with malicious activity, these variables may be used to execute payloads upon system startup. It is critical to note that while this detection indicates the presence of suspicious activity, it does NOT confirm that a compromise has occurred on its own; further investigation is required.

  ### Investigation Steps

  - **Examine the Event Logs:** Review Windows Security Event ID 4657 (Registry value set) for alterations to registry keys under `HKEY_CURRENT_USER\Environment\` and `HKEY_LOCAL_MACHINE\Environment\`. Look for unusual strings, particularly those matching the specified suspicious commands.

  - **Identify Indicators of Compromise:** Focus on identifying high-confidence malicious indicators such as environment variables containing obfuscated PowerShell commands (e.g., those starting with 'SW52b2tlL'). Cross-reference with known threat intelligence to ascertain legitimacy.

  - **Review Legitimate Behavior:** Confirm normal applications that modify environment variables for user-specific applications. For example, legitimate changes may include entries for software like Java or Python. Document expected changes to differentiate from suspicious ones.

  - **Analyze User Context:** Investigate the user account that initiated the registry modification. If the account lacks administrative privileges or is associated with atypical processes, it raises suspicion. Use logins tracked in Windows Event ID 4624 (Logon).

  - **Correlate with Other Insights:** Check for any related suspicious PowerShell command usage (via Windows Event ID 4104) in close temporal proximity to the registry changes to establish context or sequence of actions.

  - **Investigate Temporary File References:** Review the creation of files in `C:\Users\Public\` or `C:\Users\<username>\AppData\Local\Temp\` directory that may correspond with added environment variables, as this may indicate further malicious activity.

  ### Prioritization

  This alert carries a high severity due to its potential impact on critical systems, especially if the affected user has administrative privileges. The likelihood of malicious abuse is increased since environment variables often participate in exploitation and persistence methods, a commonly weaponized behavior in various attack campaigns.

  ### Blind Spots and Assumptions

  Detection may be limited by possible evasion techniques, such as an attacker modifying the registry in a way that doesn't trigger alerts by using legitimate system tools. Reliance on appropriate logging configurations for registry modifications is critical for robust detection. Legitimate activities, such as software installations or configurations, may inadvertently trigger this alert. A companion detection rule focused on suspicious PowerShell command executions (with the relevant Event ID 4104) can reinforce coverage and context surrounding these alerts.

