title: Suspicious Environment Variable Has Been Registered
id: 966315ef-c5e1-4767-ba25-fce9c8de3660
status: test
description: Detects the creation of user-specific or system-wide environment 
  variables via the registry. Which contains suspicious commands and strings
references:
- https://infosec.exchange/@sbousseaden/109542254124022664
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-12-20
modified: 2023-08-17
tags:
- attack.persistence
- attack.stealth
logsource:
  product: windows
  category: registry_set
detection:
  selection_main:
    TargetObject|contains: '\Environment\'
  selection_details:
  - Details:
    - 'powershell'
    - 'pwsh'
  - Details|contains:
              # Add more suspicious strings in env variables below
    - '\AppData\Local\Temp\'
    - 'C:\Users\Public\'
              # Base64 MZ Header
    - 'TVqQAAMAAAAEAAAA'           # MZ..........
    - 'TVpQAAIAAAAEAA8A'
    - 'TVqAAAEAAAAEABAA'
    - 'TVoAAAAAAAAAAAAA'
    - 'TVpTAQEAAAAEAAAA'
              # Base64 Invoke- (UTF-8)
    - 'SW52b2tlL'
    - 'ludm9rZS'
    - 'JbnZva2Ut'
              # Base64 Invoke- (UTF-16LE)
    - 'SQBuAHYAbwBrAGUALQ'
    - 'kAbgB2AG8AawBlAC0A'
    - 'JAG4AdgBvAGsAZQAtA'
  - Details|startswith:        # https://gist.github.com/Neo23x0/6af876ee72b51676c82a2db8d2cd3639
    - 'SUVY'
    - 'SQBFAF'
    - 'SQBuAH'
    - 'cwBhA'
    - 'aWV4'
    - 'aQBlA'
    - 'R2V0'
    - 'dmFy'
    - 'dgBhA'
    - 'dXNpbm'
    - 'H4sIA'
    - 'Y21k'
    - 'cABhAH'
    - 'Qzpc'
    - 'Yzpc'
  condition: all of selection_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies the creation of suspicious environment variables, particularly those containing potential commands or indicators of malicious behavior, by monitoring registry changes in Windows. The attacker’s likely objective is to establish persistence or execute payloads through environment settings, potentially enabling further exploitation on the system. This behavior corresponds to the MITRE ATT&CK tactics of Persistence (T1547) and Defense Evasion (T1070).

  The primary telemetry source for this detection is the Windows Registry, particularly through registry set events, which can be captured using Sysmon or native Windows Event Logs. If malicious, this could lead to elevated privileges or running malicious scripts without user consent. However, the creation of these environment variables does NOT confirm malicious activity on its own, as benign applications may also modify environment settings.

  ### Investigation Steps

  - **Review registry changes:** Examine Registry Event IDs Key (reg_set) for alterations under the `HKEY_CURRENT_USER\Environment\` or `HKEY_LOCAL_MACHINE\Environment\` paths, specifically for keys containing the strings listed in the detection criteria.

  - **Analyze command strings:** Look for the presence of suspicious strings in the environment variable values, notably any Base64 encoded content (e.g., `TVqQAAMAAAAEAAAA`) or references to PowerShell, like `powershell` or `pwsh`, in the `Data` field of the registry event logs.

  - **Identify legitimate environment variable usage:** Check for standard, known environment variables typically used by applications in the organization, such as `TEMP` and `PATH`, and verify the legitimacy of any associated values.

  - **Check execution context:** Monitor for processes spawned from environment variables containing suspicious commands by correlating Windows Event ID 4688 (Process Creation) with registry changes. Identify if the command line contains any known malicious patterns.

  - **Assess host role and asset criticality:** Determine the role of the affected host within the environment. A workstation may exhibit different behavioral patterns than a server, with a higher risk associated with critical assets such as domain controllers.

  - **Validate logging configuration:** Ensure Sysmon or Windows event logging is fully configured to capture registry modifications and process creation. If these logs are missing, this could lead to gaps in detection capabilities.

  ### Prioritization

  The severity of this alert is high due to the potential for malicious persistence mechanisms to be established, especially in critical environments. The likelihood of abuse is elevated given that such manipulations are well-documented in threats using sophisticated techniques like living-off-the-land.

  ### Blind Spots and Assumptions

  Detection effectiveness may be limited if logging configurations are not correctly set up to capture all relevant registry changes or if Sysmon is not deployed. Legitimate applications, particularly in software development and scripting environments, may frequently modify environment variables, potentially triggering this alert. Companion detections such as monitoring for abnormal process executions from changes in environment variables can provide stronger validation of malicious intent.

