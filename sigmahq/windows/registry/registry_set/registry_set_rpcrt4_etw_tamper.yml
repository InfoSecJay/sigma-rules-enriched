note: |
  ### Technical Context

  This rule detects modifications to the "ExtErrorInformation" registry key associated with `rpcrt4.dll`, specifically when these changes are made to disable Event Tracing for Windows (ETW) logging. Such behavior could indicate an attacker attempting to evade detection during a persistence mechanism or other malicious activity. The likely attacker objective is to suppress logging capabilities that could reveal their actions, fitting within the MITRE ATT&CK framework under the tactic of Defense Evasion (TA0005) and technique T1112 (Modify Registry).

  The primary telemetry sources for identifying this behavior include Windows registry logs and audit logs for changes to registry values. If successfully exploited, the impact includes potential undetected malicious persistence or lateral movement within the network. This detection does NOT conclusively indicate malicious activity but highlights a change that warrants further investigation.

  ### Investigation Steps

  - **Check Registry Change Details:** Review Security Event ID 4657 for the 'ExtErrorInformation' key under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\Rpc`. Confirm modifications and note the user or process that initiated the change.

  - **Identify User and Process Context:** Correlate the registry change time with Security Event ID 4688 to identify the process creating the change. Check for any abnormal process names or timestamps that don’t match established baselines.

  - **Review System Role and Expected Behavior:** For systems that typically utilize RPC (e.g., domain controllers), verify normal operations. Legitimate use of `rpcrt4.dll` should include common services such as remote procedure calls for Active Directory or DCOM. Any unauthorized changes in non-administrative accounts should be scrutinized.

  - **Evaluate Recent Software Installations or Updates:** Check application logs or Event ID 1033 in the Windows Installer logs to see if any legitimate software updates could explain the change. Pay attention to updates that might modify persistence mechanisms.

  - **Assess for Additional Evasion Techniques:** Search for the presence of any other modifications in the registry that could indicate evasion, such as settings that alter Event Log settings (Event IDs 1102 & 1104).

  - **Identify High-Confidence Indicators of Compromise:** Look for prior alerts or patterns linked to known malicious tools that interact with `rpcrt4.dll`, such as Cobalt Strike or mimikatz, against the same system or user account.

  ### Prioritization

  This alert is of low severity, primarily due to the nature of the system change and the context in which it occurs. However, if the affected host is critical (like a domain controller) and particularly if it has a history of similar behavior, the likelihood of malicious exploitation increases. Disabling ETW logging is a common tactic among sophisticated adversaries to hide their activities.

  ### Blind Spots and Assumptions

  Detection may be limited as attackers can mimic legitimate behavior or use other registry modifications to suppress logging further. Enterprise environments require comprehensive auditing of registry changes and proper log retention for effective detection. Legitimate activities, such as software installations or system configuration changes, could trigger this alert. Companion detections, such as monitoring for abnormal process creations (Event ID 4688) or network traffic anomalies, can strengthen overall coverage against potential adversaries.

