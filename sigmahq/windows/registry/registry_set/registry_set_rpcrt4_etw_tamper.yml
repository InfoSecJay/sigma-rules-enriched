note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry key "ExtErrorInformation" associated with `rpcrt4.dll`, indicating an attempt to disable ETW (Event Tracing for Windows) logging. An adversary might pursue this objective to evade detection by eliminating the logging of crucial events related to RPC (Remote Procedure Call) processes, thereby obscuring their actions and maintaining persistence. The relevant MITRE ATT&CK techniques are Defense Evasion (T1562) and Persistence (T1112). The primary telemetry source for this detection is Windows registry events, specifically monitoring the registry change event types. If malicious, disabling ETW logging can significantly impair forensic investigations and alert capabilities. Importantly, this detection does NOT confirm that an actual exploit or malicious activity has occurred; it merely indicates a potential evasion tactic.

  ### Investigation Steps

  - **Review registry modification events:** Query Security Event ID 5145 to confirm changes to the registry key at `HKEY_LOCAL_MACHINE\Microsoft\Windows NT\Rpc\ExtErrorInformation`. Look for unauthorized modifications or unexpected DWORD values indicating logging has been disabled.

  - **Identify the context of the change:** Determine the user account and process responsible for the registry change by extracting `Security ID` and `Process ID` from the event logs. This can help identify if the change was made by an unauthorized user or suspicious process.

  - **Assess the host's role:** Cross-reference the affected system with its role within the network. For example, check if the system is a server critical for RPC communications (e.g., domain controllers or application servers) which could be targeted more frequently.

  - **Look for concurrent suspicious activities:** Examine associated logs for unusual behavior or high-risk activities occurring around the time of the registry change, such as suspicious logins or process creations (Event ID 4688 or Sysmon Event ID 1).

  - **Validate ETW logging status:** Investigate the current state of ETW logging for `rpcrt4.dll` via PowerShell using `Get-WinEvent` and confirm if logging is indeed disabled as indicated by the registry change.

  ### Prioritization

  The alert's severity is low because while it indicates a change to registry settings, its impact depends on the context of the affected system. The likelihood of malicious abuse increases in high-value targets or systems with significant RPC activity, where the disabling of ETW may mask further malicious actions. However, this behavior is less commonly weaponized compared to more direct execution or exploitation techniques.

  ### Blind Spots and Assumptions

  One limitation of this detection is that legitimate applications or configurations might also modify ETW settings for valid reasons, leading to potential false positives. Furthermore, a comprehensive monitoring strategy should ensure that extensive logging is enabled on all critical systems to detect similar evasion techniques. Related detection that strengthens coverage could include monitoring for unusual process behaviors or the execution of scripts that modify registry settings (e.g., via Sysmon Event ID 10 which logs registry value changes).

