  ---

  ### Technical Context

  This Sigma rule detects modifications to the "ExtErrorInformation" registry key, which can disable Event Tracing for Windows (ETW) logging for the rpcrt4.dll library. Attackers may aim to disable ETW to evade detection, particularly when executing malicious activity that involves remote procedure calls (RPC), as this can limit visibility into the actions being logged. The relevant MITRE ATT&CK techniques include Defense Evasion (T1562) and Persistence (T1112).

  Primary telemetry sources include Windows event logs related to registry changes (Security Event ID 4657 for registry modifications) and direct analysis of the registry itself. If malicious, this behavior could allow attackers to manipulate or hide their traces during an operation. Notably, this detection does NOT confirm that malicious activity is occurring; it only highlights a change that warrants further investigation.

  ---

  ### Investigation Steps

  - **Check the registry modification event:** Review Security Event ID 4657 in the Windows Security logs to confirm the creation or modification of the "ExtErrorInformation" key, identifying the user and process involved. Legitimate applications should not modify this key without clear context.

  - **Assess the process context:** Identify the parent process generating the registry modification by cross-referencing with Sysmon Event ID 1 (process creation) logs. Look for commonly used system processes that should not alter this key, as events from unusual or unauthorized processes are suspicious.

  - **Correlate with RPC activities:** Investigate any recent RPC-related calls or communications in the System logs, focusing on Event ID 7045 (service installation) and Event ID 7036 (service state change), as legitimate usage will often involve normal service behavior without attempts to disable logging.

  - **Validate ETW-related activity:** Check if there are abnormal patterns or missing ETW logs related to the rpc-related processes in the System and Application event logs, which can reveal potential evasion if logging appears inconsistent or absent.

  - **Evaluate affected system criticality:** Determine the role of the affected system (e.g., domain controller, file server) and assess its risk to the organization, prioritizing investigation on more critical assets where unexpected changes raise alarms.

  ---

  ### Prioritization

  This alert is of low severity in general but should be investigated based on the affected system’s importance, as changes to logging mechanisms can obscure malicious activities. The likelihood of this behavior being weaponized is moderate, particularly in high-value targets or during advanced attacks seeking persistence without detection.

  ---

  ### Blind Spots and Assumptions

  Detection may be evaded by legitimate software changes or policy configurations that modify registry keys without clear intent. Ensure that comprehensive registry monitoring is enabled to capture all changes reliably. Additionally, common administrative actions (like software installations or updates) might trigger this alert; a companion detection focusing on abnormal processes modifying security settings or RPC communications can enhance coverage.

