title: Suspicious Keyboard Layout Load
id: 34aa0252-6039-40ff-951f-939fd6ce47d8
status: test
description: Detects the keyboard preload installation with a suspicious keyboard
  layout, e.g. Chinese, Iranian or Vietnamese layout load in user session on systems
  maintained by US staff only
references:
- https://renenyffenegger.ch/notes/Windows/registry/tree/HKEY_CURRENT_USER/Keyboard-Layout/Preload/index
- https://github.com/SwiftOnSecurity/sysmon-config/pull/92/files
author: Florian Roth (Nextron Systems)
date: 2019-10-12
modified: 2023-08-17
tags:
- attack.resource-development
- attack.t1588.002
logsource:
  category: registry_set
  product: windows
  definition: 'Requirements: Sysmon config that monitors \Keyboard Layout\Preload
    subkey of the HKLU hives - see https://github.com/SwiftOnSecurity/sysmon-config/pull/92/files'
detection:
  selection_registry:
    TargetObject|contains:
    - '\Keyboard Layout\Preload\'
    - '\Keyboard Layout\Substitutes\'
    Details|contains:
    - 00000429          # Persian (Iran)
    - 00050429          # Persian (Iran)
    - 0000042a          # Vietnamese
  condition: selection_registry
falsepositives:
- Administrators or users that actually use the selected keyboard layouts (heavily
  depends on the organisation's user base)
level: medium
note: |
  ### Technical Context
  This detection rule identifies instances where malicious actors may install suspicious keyboard layouts on systems maintained by U.S. staff, particularly layouts that correspond to regions associated with state-sponsored cyber operations, such as those from China, Iran, or Vietnam. By loading these keyboard layouts, attackers could facilitate data exfiltration, enable keystroke logging, or prepare the environment for further exploitation, such as inputting deceptive or malicious commands undetected by local monitoring systems.

  Relevant MITRE ATT&CK tactics include **Initial Access** (TA0001) and **Resource Development** (TA0042). The specific technique implicated here is **Resource Development: Compromise Infrastructure [T1588.002]**, as attackers might use these layouts for enhancing their tools or obfuscating their activities.

  The primary data source necessary for effective detection is Windows registry event logs, specifically the monitoring of changes within the `HKEY_CURRENT_USER\Keyboard Layout\Preload` registry key. Additionally, Sysmon configurations must be in place to effectively capture this data during user sessions, ensuring visibility into registry activity.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate the `HKEY_CURRENT_USER\Keyboard Layout\Preload` key for recent changes. Look for entries that indicate suspicious layouts, such as those associated with Iran or Vietnam.
  - **Analyze User Context**: Determine if the affected user is a U.S. staff member and whether they have legitimate reasons for using the specified keyboard layouts. Check user roles and responsibilities against the observed activities.
  - **Correlate with Additional Logs**: Examine Sysmon logs and correlate findings with other sources, such as Windows Security logs or EDR telemetry, to identify if there are patterns indicating malicious intent (e.g., additional registry modifications or process anomalies).
  - **Monitor for Further Anomalies**: Set up alerts for any subsequent registry modifications related to keyboard layouts, and track any unusual user behavior, such as unexpected command line input or application usage.

  ### Prioritization
  The medium severity of this alert is justified by the potential for these keyboard layouts to indicate a precursor to more significant malicious actions, such as data exfiltration or environment manipulation, given the context of its use by U.S. staff.

  ### Blind Spots and Assumptions
  This detection relies heavily on the assumption that the Sysmon configuration is correctly set to monitor the specified registry keys. A potential gap exists if legitimate users are utilizing the detected keyboard layouts, leading to possible false positives. Furthermore, environments that do not have comprehensive registry auditing configured may miss crucial activities that this rule aims to capture. It is essential to ensure that registry monitoring is enabled and that employees' legitimate keyboard layout usage is well understood within the operational context of the organization.

