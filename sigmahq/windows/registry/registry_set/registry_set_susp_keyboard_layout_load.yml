title: Suspicious Keyboard Layout Load
id: 34aa0252-6039-40ff-951f-939fd6ce47d8
status: test
description: Detects the keyboard preload installation with a suspicious 
  keyboard layout, e.g. Chinese, Iranian or Vietnamese layout load in user 
  session on systems maintained by US staff only
references:
- https://renenyffenegger.ch/notes/Windows/registry/tree/HKEY_CURRENT_USER/Keyboard-Layout/Preload/index
- https://github.com/SwiftOnSecurity/sysmon-config/pull/92/files
author: Florian Roth (Nextron Systems)
date: 2019-10-12
modified: 2023-08-17
tags:
- attack.resource-development
- attack.t1588.002
logsource:
  category: registry_set
  product: windows
  definition: 'Requirements: Sysmon config that monitors \Keyboard Layout\Preload
    subkey of the HKLU hives - see https://github.com/SwiftOnSecurity/sysmon-config/pull/92/files'
detection:
  selection_registry:
    TargetObject|contains:
    - '\Keyboard Layout\Preload\'
    - '\Keyboard Layout\Substitutes\'
    Details|contains:
    - 00000429          # Persian (Iran)
    - 00050429          # Persian (Iran)
    - 0000042a          # Vietnamese
  condition: selection_registry
falsepositives:
- Administrators or users that actually use the selected keyboard layouts 
  (heavily depends on the organisation's user base)
level: medium
note: |
  ### Technical Context

  This rule detects the loading of suspicious keyboard layouts (e.g., Persian, Vietnamese) within user sessions on systems primarily managed by US staff. The behavior indicates a potential attempt by an attacker to cover their tracks or manipulate input data, indicating an objective of resource development (MITRE ATT&CK tactic: Initial Access, technique: T1588.002). The primary telemetry sources include Windows Registry logs, specifically changes to `HKEY_CURRENT_USER\Keyboard-Layout\Preload` and `Substitutes`. If malicious, this could lead to unauthorized access or control. It is critical to note that this detection does NOT confirm malicious activity on its own, as legitimate users may require these keyboard layouts for their work.

  ### Investigation Steps

  - **Review Registry Evidence:** Examine the changes to the `HKEY_CURRENT_USER\Keyboard Layout\Preload` and `Substitutes` keys. Check for details fields containing `00000429`, `00050429`, or `0000042a` as potential malicious indicators.

  - **Identify User Context:** Determine the user account associated with the keyboard layout change. Verify if this user is known to regularly use these layouts or is based within regions that commonly utilize them.

  - **Assess System Role:** Identify the role of the device (e.g., employee workstation, critical server). This information can provide insight into the potential impact of the activity.

  - **Validate Legitimate Use Cases:** Document legitimate scenarios where users may require these keyboard layouts. Cross-reference with user roles to understand potential exceptions to the alert.

  - **Correlate with Other Activity:** Look for concurrent suspicious behaviors (e.g., unusual login times or command execution) in the same user session, using Security Event ID 4624 for logon events, to build a higher confidence of malicious intent.

  ### Prioritization

  This alert warrants medium severity due to its detection of potentially malicious behavior on systems critical for enterprise operations. Although the likelihood of malicious abuse exists, the context surrounding the user base may moderate the impact.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of Sysmon logging configurations for registry changes, potentially allowing malicious activity to go unnoticed. Legitimate activities, such as users switching to required language-specific layouts, may trigger the alert. Companion detections could include monitoring for rogue processes or commands initiated by the same user, which can indicate further malicious activity.

