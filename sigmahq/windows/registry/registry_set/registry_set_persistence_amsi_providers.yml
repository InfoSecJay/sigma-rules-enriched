title: Potential Persistence Via New AMSI Providers - Registry
id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f705
status: test
description: |
  Detects when an attacker adds a new AMSI provider via the Windows Registry to bypass AMSI (Antimalware Scan Interface) protections.
  Attackers may add custom AMSI providers to persist on the system and evade detection by security software that relies on AMSI for scanning scripts and other content.
  This technique is often used in conjunction with fileless malware and script-based attacks to maintain persistence while avoiding detection.
references:
- https://persistence-info.github.io/Data/amsi.html
- https://github.com/gtworek/PSBits/blob/8d767892f3b17eefa4d0668f5d2df78e844f01d8/FakeAMSI/FakeAMSI.c
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2025-10-26
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\AMSI\Providers\'
    - '\SOFTWARE\WOW6432Node\Microsoft\AMSI\Providers\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files\Avast Software\Avast\x86\RegSvr.exe'
    TargetObject|contains: '\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1}'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files\AVG\Antivirus\x86\RegSvr.exe'
    TargetObject|contains: '\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1}'
  filter_optional_avira:
    Image: 'C:\Program Files\Avira\Endpoint Protection SDK\endpointprotection.exe'
    TargetObject|contains: '\{00000001-3DCC-4B48-A82E-E2071FE58E05}'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate security products adding their own AMSI providers. Filter these 
  according to your environment.
level: medium
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_persistence_amsi_providers/info.yml
note: |
  ### Technical Context

  This rule detects changes made to the Windows Registry where a new AMSI (Antimalware Scan Interface) provider is added. Attackers may implement this technique to bypass AMSI protections, allowing them to run malicious scripts undetected, often using fileless malware tactics. The relevant MITRE ATT&CK tactic is Persistence, specifically technique T1218.011 (AMSI Bypass). Primary telemetry sources include the Windows Registry logs, particularly the `registry_set` category, and relevant Event IDs that capture registry modifications. If malicious, such actions can lead to sustained access and evasion of detection mechanisms by security software. Importantly, this detection does not confirm malicious intent on its own, as legitimate security solutions may also add AMSI providers.

  ### Investigation Steps

  - **Verify Registry Change:** Check the Windows Registry for new entries under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\AMSI\Providers\` or `HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\AMSI\Providers\`. Look for entries created by unusual executables which are not part of known security products.

  - **Identify Executable Origins:** Review the process creation logs (Event ID 4688) around the time of the registry modification to identify the executing process. Look for any unusual parent-child execution relationships that could signify malicious activity.

  - **Flag High-Risk GUIDs:** Investigate newly created AMSI provider GUIDs (e.g., `\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1}`) for known malicious or suspicious activity using threat intelligence. Cross-reference these with community-sourced data.

  - **Review Log Collections:** Ensure that the Windows Registry is being monitored effectively by your logging solution. Validate that changes to the registry are captured, especially focusing on `registry_set` logs.

  - **Assess Legitimate Provider Activity:** Confirm if legitimate security tools (e.g., Avast, AVG, Avira) are responsible for the new AMSI provider entries. This can involve checking historical registry changes and coordination with operational teams for expected behavior.

  - **Examine Command-Line Activity:** Review command-line arguments associated with the processes that modified the registry. Investigate any indicative command-line patterns typical in malware execution, especially related to script execution.

  ### Prioritization

  The severity of this alert is medium due to its potential to enable attackers to maintain persistence on critical systems while avoiding detection. Given that AMSI bypass techniques are commonly weaponized in modern threats, timely investigation is imperative to mitigate risk.

  ### Blind Spots and Assumptions

  This detection may be evaded through the use of legitimate AMSI providers, which can obscure malicious activities. Ensure proper logging configurations are enabled for registry modifications to capture such changes reliably. Legitimate behavior may involve routine updates by security software vendors, which can trigger alerts. Complement this detection with logs from security application updates and process monitoring for comprehensive coverage.

