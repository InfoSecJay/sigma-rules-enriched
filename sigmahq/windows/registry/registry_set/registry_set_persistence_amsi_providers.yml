title: Potential Persistence Via New AMSI Providers - Registry
id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f705
status: test
description: |
  Detects when an attacker adds a new AMSI provider via the Windows Registry to bypass AMSI (Antimalware Scan Interface) protections.
  Attackers may add custom AMSI providers to persist on the system and evade detection by security software that relies on AMSI for scanning scripts and other content.
  This technique is often used in conjunction with fileless malware and script-based attacks to maintain persistence while avoiding detection.
references:
- https://persistence-info.github.io/Data/amsi.html
- https://github.com/gtworek/PSBits/blob/8d767892f3b17eefa4d0668f5d2df78e844f01d8/FakeAMSI/FakeAMSI.c
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2025-10-26
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\AMSI\Providers\'
    - '\SOFTWARE\WOW6432Node\Microsoft\AMSI\Providers\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files\Avast Software\Avast\x86\RegSvr.exe'
    TargetObject|contains: '\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1}'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files\AVG\Antivirus\x86\RegSvr.exe'
    TargetObject|contains: '\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1}'
  filter_optional_avira:
    Image: 'C:\Program Files\Avira\Endpoint Protection SDK\endpointprotection.exe'
    TargetObject|contains: '\{00000001-3DCC-4B48-A82E-E2071FE58E05}'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate security products adding their own AMSI providers. Filter these according
  to your environment.
level: medium
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_persistence_amsi_providers/info.yml
note: |
  ---

  ### Technical Context

  This Sigma rule detects the addition of new AMSI (Antimalware Scan Interface) providers in the Windows Registry. Attackers may utilize this technique to inject custom providers that can interfere with or bypass AMSI's malware detection capabilities, often in conjunction with fileless malware or script-based attacks for persistence. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **Create/Modify System Process** (T1543).

  Primary telemetry sources include Windows Registry logs, specifically monitoring changes to the paths `\SOFTWARE\Microsoft\AMSI\Providers\` and `\SOFTWARE\WOW6432Node\Microsoft\AMSI\Providers\`. The security impact is significant as it allows an attacker to execute malicious code without being detected by established security software. However, this detection rule alone does NOT confirm that malicious activity is present; legitimate security solutions may also modify AMSI providers.

  ---

  ### Investigation Steps

  - **Review Registry Changes**: Examine Windows Registry Event Logs for Event ID 4657, indicating a registry value change at `\SOFTWARE\Microsoft\AMSI\Providers\`. Look for unusual values or GUIDs that are not associated with known legitimate applications.

  - **Identify Malicious Indicator**: Check for the creation of new AMSI providers with GUID `\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1\}` or `\{00000001-3DCC-4B48-A82E-E2071FE58E05\}`. These are commonly used by malicious actors.

  - **Cross-Reference Processes**: Validate the associated process that made the registry change by correlating Event ID 4688 (Process Creation) with specific parent-child relationships. Focus on `RegSvr.exe` processes that do not belong to legitimate vendors like Avast, AVG, or Avira.

  - **Monitor Expected behavior**: Determine if any legitimate security product is indeed modifying the AMSI providers. Record the file paths and GUIDs used, ensuring they match those known to be safe in your environment.

  - **Assess Asset Criticality**: Identify the impact of the affected host. If critical infrastructure or sensitive data is at risk, escalate the investigation and response appropriately.

  - **Check for Additional Artefacts**: Look for any file creation or script execution indicators (Event ID 4104 for PowerShell logs) that may correlate with the registry changes. Investigate Powershell commands that reference downloaded content or abnormal execution patterns.

  ---

  ### Prioritization

  This alert has medium severity due to the potential for significant impact if an attacker gains persistence on a critical system. Given that this technique is part of a broader threat landscape involving evasion tactics, there is a moderate likelihood of malicious use. The behavior, while possible for legitimate applications, is frequently exploited by adversaries, warranting prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate processes adding AMSI providers, leading to potential false positives. Ensure that logging for changes to the registry is adequately configured and that telemetry adequately tracks the relevant events. It's also essential to recognize that legitimate security solutions might trigger this alert based on their operational behavior. A companion detection could involve monitoring PowerShell activities (T1059.001) or tracking application control logs for unauthorized modifications in combination with this registry change.

