title: Potential Persistence Via New AMSI Providers - Registry
id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f705
status: test
description: |
  Detects when an attacker adds a new AMSI provider via the Windows Registry to bypass AMSI (Antimalware Scan Interface) protections.
  Attackers may add custom AMSI providers to persist on the system and evade detection by security software that relies on AMSI for scanning scripts and other content.
  This technique is often used in conjunction with fileless malware and script-based attacks to maintain persistence while avoiding detection.
references:
- https://persistence-info.github.io/Data/amsi.html
- https://github.com/gtworek/PSBits/blob/8d767892f3b17eefa4d0668f5d2df78e844f01d8/FakeAMSI/FakeAMSI.c
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-21
modified: 2025-10-26
tags:
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\AMSI\Providers\'
    - '\SOFTWARE\WOW6432Node\Microsoft\AMSI\Providers\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files\Avast Software\Avast\x86\RegSvr.exe'
    TargetObject|contains: '\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1}'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files\AVG\Antivirus\x86\RegSvr.exe'
    TargetObject|contains: '\{FB904E4E-D2C7-4C8D-8492-B620BB9896B1}'
  filter_optional_avira:
    Image: 'C:\Program Files\Avira\Endpoint Protection SDK\endpointprotection.exe'
    TargetObject|contains: '\{00000001-3DCC-4B48-A82E-E2071FE58E05}'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate security products adding their own AMSI providers. Filter these according
  to your environment.
level: medium
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_persistence_amsi_providers/info.yml
note: |
  ### Technical Context
  This Sigma rule detects the addition of a new AMSI (Antimalware Scan Interface) provider in the Windows Registry, which is a method commonly employed by attackers to evade antimalware defenses. By adding custom AMSI providers, attackers can persist on compromised systems while circumventing security management solutions that rely on AMSI for scanning executable scripts and other potentially malicious content. This technique is particularly relevant in fileless malware campaigns, where scripts are run in-memory to execute attacks without leaving traditional artifacts on the filesystem.

  The relevant MITRE ATT&CK techniques include **Persistence** (T1547), specifically through the **AMSI Provider** (T1562.001) technique. Attackers leveraging this method typically aim to maintain access and control over a victim's system discreetly while evading detection mechanisms. The primary data sources for this detection include Windows Registry logs, focusing on changes to the AMSI provider keys.

  ### Investigation Steps
  - **Review Registry Logs**: Investigate recent changes to the Windows Registry, specifically under the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\AMSI\Providers` and `HKEY_LOCAL_MACHINE\SOFTWARE\WOW6432Node\Microsoft\AMSI\Providers` keys for unauthorized additions.

  - **Correlate with Process Creation Events**: Analyze any process creation events around the same time the registry entry was added to identify potentially malicious activity, especially looking for scripts or what may have triggered the registry change.

  - **Examine Security Product Logs**: Check logs from legitimate security products that might also create AMSI providers. Be aware of any false positives signaled by the detection rule and contextualize them based on your environment to verify legitimacy.

  - **Investigate Historical Data**: Look at historical changes to the AMSI provider registry entries and correlate them with other incident investigations to find patterns consistent with known attacker behaviors.

  ### Prioritization
  This alert is rated as medium severity due to its indication of potential persistence mechanisms, which could lead to prolonged access for attackers. Given that methods to evade detection are crucial in maintaining threats, it poses a significant risk that high-priority investigations should address.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage as the rule primarily focuses on specific registry paths and does not account for alternative persistence methods that attackers might employ. The rule assumes that legitimate applications will not add unauthorized AMSI providers in typical operations, which, if true, could lead to false negatives. Additionally, the detection relies on appropriate logging configurations within the environment, ensuring registry changes are captured effectively.

