  ---

  ### Technical Context

  This rule detects modifications to the Windows registry keys responsible for displaying hidden files. Specifically, it identifies changes to the `Hidden` and `ShowSuperHidden` values, setting them to `DWORD (0x00000000)`, which effectively hides files from normal user view. Such behavior is often exploited by malware to conceal its presence, with the attacker aiming to evade detection and maintain persistence.

  The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1564.001). The primary telemetry source comes from Windows registry change logs (Registry Set Logs). If malicious, the impact lies in enabling malware to operate undetected by users and security tools. Importantly, this detection does not confirm actual malicious activity on its own; it merely indicates a potential evasion tactic.

  ---

  ### Investigation Steps

  - **Check recent registry changes**: Review Windows Registry logs focusing on the key path `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced`. Look for Event IDs related to registry changes (e.g., Event ID 4657).

  - **Review process creation events**: Investigate Security Event ID 4688 for any newly created processes around the time of the registry modification. Look for unusual executable names or paths that suggest malicious activity.

  - **Identify user accounts involved**: Check who has the right permissions to modify registry values by querying Event ID 4657 and correlating with user account activity. Legitimate corporate user accounts typically should not modify these settings without prior authorization.

  - **Validate against baseline configurations**: Compare current registry settings against known good configurations. Expected behavior in a default environment should maintain default values for both the `Hidden` and `ShowSuperHidden` keys set to `DWORD (0x00000001)`.

  - **Search for hidden files**: Utilize commands such as `dir /A:H` or other file enumeration methods to validate if any hidden files (e.g., recent changes in directories) are present on the system, which may confirm abusive behavior.

  ---

  ### Prioritization

  The alert severity is medium due to the moderate impact potential on compromised systems. The likelihood of this behavior being malicious is high, as it is commonly used by various malware families to evade detection. The manipulation of visibility settings for critical system files poses a security risk by enabling attackers to hide their malicious artifacts.

  ---

  ### Blind Spots and Assumptions

  This detection may miss legitimate administrative behavior or software configurations requiring hidden files to be set, leading to potential false positives. Dependence on correct logging settings and the visibility of registry changes is a limitation; ensuring auditing is enabled is essential for reliable detection. Related detections, such as those monitoring for unauthorized software installations or file activity in hidden directories, can strengthen overall security posture.

