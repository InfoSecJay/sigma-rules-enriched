note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows registry keys that control the visibility of hidden and system files in File Explorer. Attackers often adjust these settings to conceal malicious files from users and security tools, thereby avoiding detection. The likely attacker objective is to maintain persistence or to obfuscate their activities by hiding their tools and files. This behavior correlates with the MITRE ATT&CK technique for hiding files using registry modifications (T1564.001).

  Primary telemetry sources include registry change logs specifically for the Windows operating environment, with a focus on the registry keys `ShowSuperHidden` and `Hidden`. If an attacker modifies these keys, it could indicate active malicious behavior that allows them to conceal artifacts or tools necessary for further exploitation. However, this detection does NOT confirm an active compromise by itself; it merely indicates a change in system settings that warrants further investigation.

  ### Investigation Steps

  - **Check registry modifications:** Review the registry changes specifically at the keys `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowSuperHidden` and `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden`. Look for a DWORD value of `0 (0x00000000)`, which indicates files are set to be hidden.

  - **Identify recent processes:** Examine recent process creation events to determine if any processes were spawned shortly before the registry changes. Look for Event ID 4688 and Sysmon Event ID 1 focusing on parent processes, especially those commonly associated with file manipulation or execution.

  - **Assess legitimate behavior:** Confirm whether a known user or system administrator initiated these changes. Legitimate users may alter these settings when troubleshooting or configuring file displays. Document the rationale behind changes if communicated.

  - **Look for associated file activity:** Investigate if any files were created or modified in directories that typically hold hidden files, like `C:\ProgramData\` or `C:\Windows\System32\`. Check for file creation events (e.g., Sysmon Event ID 11) to find hidden or system files that may now be obscured.

  - **Cross-reference recent alerts:** Review other security alerts within the last 30 minutes that might indicate suspicious behavior in conjunction with the registry modification, like unusual network activity or authentication failures.

  ### Prioritization

  This alert should be considered medium severity due to the potential for malicious actors to hide their presence on critical systems. The affected systems are generally endpoints that could be targeted for various attacks, and the manipulation of these registry settings is a common tactic utilized by malware and other malicious actors.

  ### Blind Spots and Assumptions

  Possible detection limitations include users modifying these keys for legitimate reasons, such as troubleshooting. Additionally, not all environments log registry changes by default; ensure appropriate audit policies are enabled for reliable detection. Common legitimate activities that may trigger this alert include system maintenance or administrative adjustments. Related detections could include monitoring for file creations or modifications in high-value directories, providing a contextual overview of potentially hidden threats.

