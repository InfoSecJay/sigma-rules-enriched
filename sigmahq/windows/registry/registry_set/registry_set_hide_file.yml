note: |
  ### Technical Context
  This detection rule is designed to identify modifications to Windows registry settings that control the visibility of hidden files and system files. Specifically, the rule observes changes to the "Hidden" and "ShowSuperHidden" registry values, which are set to `DWORD (0x00000000)` to disable the display of hidden and system files. Attackers often exploit this feature to conceal malicious files from users and security tools, thereby aiding in persistence and obfuscation during their operations.

  The threat scenario commonly involves malware or a persistent threat actor attempting to hide their presence on a compromised system. By disabling the visibility of hidden files, malicious activities can continue without detection from the end-user or security teams. This behavior aligns with MITRE ATT&CK techniques such as **T1564.001: Hide Files** under the **Defense Evasion** tactic, which outlines methods employed by adversaries to keep their files and tools out of sight.

  Primary data sources for this detection include Windows registry change logs and monitoring solutions that log modifications to registry keys. These logs can reveal unauthorized attempts to change file visibility settings and provide valuable context for incident responders.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the Windows registry change logs for entries related to the "ShowSuperHidden" and "Hidden" values. Confirm any unauthorized modification, particularly focusing on entries marked with `DWORD (0x00000000)`.

  - **Correlate with User Activity:** Cross-reference the detected registry changes with user activity logs to establish whether legitimate user actions may account for the modification. Look for unusual patterns or coinciding events.

  - **Analyze File System Changes:** Check the file system for any recently created or modified files that are typically hidden. Investigate the file paths to determine if they lead to known malware or suspicious applications.

  - **Conduct a Threat Search:** Utilize threat intelligence to search for any known malware signatures or file hashes associated with the detected behavior. Look into previously documented attacks utilizing similar tactics to assess potential impact.

  ### Prioritization
  Given the medium severity level, alerts generated by this rule should be prioritized due to the potential for malicious actors to evade detection and maintain persistence on compromised endpoints. The likelihood of encountering malware using this tactic is moderate, making it imperative to address potential threats promptly.

  ### Blind Spots and Assumptions
  This detection logic may have gaps in coverage if registry changes are not captured reliably due to logging configurations or if users with appropriate permissions make legitimate modifications. The effectiveness of this detection relies on the proper configuration of Windows registry auditing and the ability to capture and analyze registry changes in real time. Additionally, the rule assumes that the registry is being monitored continuously and that no legitimate workflow alters the visibility settings as part of normal operations.

