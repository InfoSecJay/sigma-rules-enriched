note: |
  ### Technical Context

  This rule detects modifications to Windows registry values that configure the visibility of hidden and system files. Specifically, it identifies changes to the `ShowSuperHidden` and `Hidden` values, which are set to zero to prevent users from viewing hidden files, a tactic often used by malware to conceal malicious executables. This behavior is associated with the MITRE ATT&CK Tactic: Defense Evasion, Technique: Hide Files (T1564.001).

  The primary telemetry sources required for this detection are Windows registry change logs, specifically targeting the registry keys under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced`. If this behavior is malicious, it can facilitate additional attack actions by allowing threat actors to operate undetected on a system. This detection does NOT confirm malicious activity on its own; legitimate software and administrative tasks may also modify these registry settings.

  ### Investigation Steps

  - **Check registry modifications:** Review Event ID 4657 (Registry value modification) for changes made to the following paths: `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowSuperHidden` and `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden`. Confirm that the new values are set to 0.

  - **Identify recent file activity:** Investigate event logs for recent file creation or modification (Event ID 4663) in directories typically containing hidden files (e.g., `C:\Program Files` or `C:\Windows`). Look for activity from recently modified or suspicious executables that could indicate malware trying to hide from the user.

  - **Correlate user behavior with alerts:** Analyze user activity and computer role (e.g., domain admin vs. standard user) around the time of the registry modification. Legitimate system administrators or users may adjust these settings for specific applications or troubleshooting.

  - **Review antivirus logs:** Check antivirus or endpoint protection logs to identify blocked activities or alerts that might indicate the presence of malware attempting to hide itself. Look for signatures or behaviors commonly associated with file-hiding malware.

  - **Analyze persistence mechanisms:** Investigate if any persistence mechanisms are employed by programs modified to hide files. Check if there are new entries in the `Run` registry key or startup folders that correlate with the time of the registry change.

  ### Prioritization

  This alert is of medium severity due to its potential risk on systems with high-value data or administrative privileges. The likelihood of malicious abuse is significant, as many malware variants utilize this tactic. Hiding malicious files is a common practice among adversaries to evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited if the registry monitoring is incomplete or if logs are not properly configured to capture all relevant registry changes. Legitimate administrative tasks and software updates can trigger this alert, potentially leading to false positives. Related detections, such as unusual process creation (Event ID 4688) or changes to startup configurations, can help correlate efforts to identify potential threats and improve the accuracy of triage.

