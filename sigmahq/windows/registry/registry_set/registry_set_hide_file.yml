note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry that disable the visibility of hidden files and system files by setting specific registry values ("ShowSuperHidden" and "Hidden") to 0. This tactic is commonly employed by malware to prevent detection of their files from users and security tools alike. The likely attacker objective is to conceal malicious payloads or activities from the user and detection mechanisms. The detection pertains to the MITRE ATT&CK technique "Hide files through registry" (T1564.001).

  Primary telemetry sources include Windows Registry logs specifically tracking changes to the Advanced settings under the Explorer key. If malicious, this behavior could severely impact system visibility and integrity, enabling persistent threats. Importantly, this detection does NOT confirm malicious intent on its own; it merely indicates that these specific settings have been altered.

  ### Investigation Steps

  - **Review registry change details**: Check Security Event ID 4663 for Registry Key modifications. Focus on access to \Microsoft\Windows\CurrentVersion\Explorer\Advanced to confirm changes were made to "ShowSuperHidden" or "Hidden".

  - **Identify high-confidence malicious indicators**: Look for indicators such as the presence of known bad file hashes or processes running from directories typically associated with malware (e.g., AppData or Temp folders) alongside the registry changes.

  - **Assess the context of the modification**: Verify the user account making the registry change (Event ID 4624). Changes made by administrative accounts during routine maintenance may be benign versus those made by low-privileged accounts.

  - **Determine expected legitimate behavior**: Check for other user actions or applications that may modify these registry entries, such as file management software or system optimization tools. Document any associated Event IDs from these tools for validation.

  - **Check for additional signs of compromise**: Investigate recent file creations or modifications (Sysmon Event ID 11) in conjunction with the registry changes. Look for any executable files created in system folders that could indicate malicious activity.

  ### Prioritization

  This alert has medium severity due to its potential impact on system visibility and the likelihood of misuse by malicious actors aiming to hide their activities. While it may not be the direct indicator of a compromise, similar behaviors are commonly seen in advanced persistent threats (APTs) and malware activity.

  ### Blind Spots and Assumptions

  Detection may be limited if registry logging is not enabled on the targeted systems, and legitimate applications or users modifying these settings may trigger false positives. Consider implementing additional detections for abnormal behaviors, such as file accesses around the modification time. Companion detections may include scanning for suspicious processes that usually operate alongside such registry modifications, enhancing overall threat detection capabilities.

