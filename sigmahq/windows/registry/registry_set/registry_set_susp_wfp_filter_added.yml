logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\BFE\Parameters\Policy\Persistent\Filter\'
  filter_main_svchost:
    Image:
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects registry modifications that add Windows Filtering Platform (WFP) filters, a behavior typically indicative of an adversary attempting to obstruct security tools such as Endpoint Detection and Response (EDR) agents from reporting system activities. The likely objective is to manipulate network traffic monitoring to avoid detection during malicious activity, enhancing persistence and operational security for the attacker. This detection aligns with the MITRE ATT&CK tactics of Defense Evasion (T1562) and Execution (T1569.002).

  The primary telemetry sources are Windows Registry logs specifically targeting changes under the path `\BFE\Parameters\Policy\Persistent\Filter\`. If successful, such modifications could allow malicious actors to prevent security alerts, potentially leading to data breaches or system compromise. Importantly, this detection does NOT confirm an active compromise; it only indicates the modification of WFP filters, which could also arise from legitimate system configurations or security tool adjustments.

  ### Investigation Steps

  - **Review the registry modification event**: Check Windows Security Event ID 4657 for any changes to keys under the path `\BFE\Parameters\Policy\Persistent\Filter\`. Look for unexpected entries or foreign entries not aligned with organizational policies.

  - **Correlate with legitimate EDR configurations**: Compare against known configurations for security tools in use. Legitimate modifications may be traced back to scheduled maintenance or admin-preapproved updates applied to the WFP settings.

  - **Examine process activity**: Investigate Sysmon Event ID 1 for any instance of `svchost.exe` modifying the registry. Identify if this process is associated with valid Windows services or if it deviates from normal behavior.

  - **Identify high-confidence malicious indicators**: Look for timestamps of registry modifications close to suspicious activity logs such as unusual outbound connections or service failures. Correlate with user activity logs to verify who was logged into the workstation or server at the time of modification.

  - **Assess host criticality and asset roles**: Prioritize investigation on systems classified as critical infrastructure or sensitive data repositories. Implement deeper checks on how modifications to WFP filters might impact these systems' security posture.

  - **Validate any file modification or exfiltration artifacts**: Examine Windows Event ID 4663 or related logs for any file operations occurring around the same time as the registry changes, specifically looking for file creations or deletions that could indicate malicious data handling.

  ### Prioritization

  This alert should be considered medium severity due to the potential risk associated with affecting critical security processes. The likelihood of malicious use is moderate, as this behavior can be utilized effectively to evade detection by multiple security solutions. Registry changes like this are often employed by skilled adversaries, making it crucial to act on these alerts promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by monitoring configurations that fail to capture specific registry paths or user interactions that could lead to benign false positives. Legitimate activities such as authorized system updates or policy changes could also trigger the alert, complicating the investigation. Related detections, such as monitoring direct modifications to EDR or security tool configurations, should be in place to bolster overall detection efficacy.

