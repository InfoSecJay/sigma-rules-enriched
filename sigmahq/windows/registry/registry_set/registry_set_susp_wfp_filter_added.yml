detection:
  selection:
    TargetObject|contains: '\BFE\Parameters\Policy\Persistent\Filter\'
  filter_main_svchost:
    Image:
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects modifications made to the Windows Registry that configure Windows Filtering Platform (WFP) filters. These filters can be maliciously used to alter network traffic rules, potentially blocking security tools or endpoint detection and response (EDR) agents from properly reporting events. The likely objective is to suppress alerting and obstacle detection capabilities to facilitate further malicious actions without detection.

  This behavior aligns with the MITRE ATT&CK technique T1569.002 (Component Object Model Hijacking) and T1685 (Adversary-in-the-Middle), suggesting an attack focused on defense evasion and disruption of security measures. Primary telemetry sources for this detection include Windows Registry logs, specifically targeting the modification of keys within the path `\BFE\Parameters\Policy\Persistent\Filter\`. If successful, a malicious actor could significantly compromise an organization's security posture. It's important to note that this detection does NOT confirm the presence of malicious activity on its own, as legitimate software behavior might also modify these registry keys.

  ### Investigation Steps

  - **Check for the registry change event:** Look for Event ID 4657 in the Security logs, which captures changes to the Windows Registry, focusing on the registry path '\BFE\Parameters\Policy\Persistent\Filter\'.

  - **Validate the source of the modification:** Identify if the change came from a legitimate process, such as `svchost.exe` or user-initiated actions. Review details around Process ID (PID) in Event ID 4688 (Process Creation) to see if it matches known system processes.

  - **Investigate for signs of malicious intent:** Analyze for unusual or unknown user accounts that may have permissions to modify the registry. Look for log entries indicating account modifications, particularly focusing on Event IDs 4624 (Successful Logon) and 4648 (Logon Attempt Using Explicit Credentials).

  - **Identify benign activity:** Review recent changes and correlate with legitimate software installations or updates, ensuring they align with known recent activities on the affected asset.

  - **Monitor for EDR interference:** Identify any logs or alerts from EDR or security solutions that indicate they have been disabled or are not functioning properly, including communication errors from these agents.

  ### Prioritization

  This alert is of medium severity due to moderate impact on security compliance and the high likelihood of malicious abuse. The behavior of adding WFP filters is known in the context of evasion tactics employed by adversaries to bypass detection, making it critical to assess the risk promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate software that modifies registry keys for valid reasons. Additionally, if audit logging is not configured properly, key changes might go undetected. There may be legitimate administrative tasks that trigger this alert, so context is critical. Companion detections, such as monitoring for abnormal behavior through EDR telemetry or detecting other registry modifications indicating tampering, can enhance overall coverage and threat detection.

