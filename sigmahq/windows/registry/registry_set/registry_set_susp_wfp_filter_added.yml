title: WFP Filter Added via Registry
id: 1f1d8209-636e-4c6c-a137-781cca8b82f9
status: experimental
description: |
  Detects registry modifications that add Windows Filtering Platform (WFP) filters, which may be used to block security tools and EDR agents from reporting events.
references:
- https://github.com/netero1010/EDRSilencer/blob/0e73a7037ec65c52894d8208e6f605a7da0a34a6/EDRSilencer.c
- https://www.huntress.com/blog/silencing-the-edr-silencers
- https://www.trendmicro.com/en_us/research/24/j/edrsilencer-disrupting-endpoint-security-solutions.html
author: Frack113
date: 2025-10-23
tags:
- attack.defense-evasion
- attack.execution
- attack.t1562
- attack.t1569.002
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\BFE\Parameters\Policy\Persistent\Filter\'
  filter_main_svchost:
    Image:
    - 'C:\Windows\System32\svchost.exe'
    - 'C:\Windows\SysWOW64\svchost.exe'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects modifications to the Windows registry that introduce new filters to the Windows Filtering Platform (WFP). Such changes often indicate attempts by malicious actors to obstruct security tools, including endpoint detection and response (EDR) agents, from monitoring system activities or reporting events. The primary objective of this behavior is to create an environment conducive to undetected malicious activities by suppressing security alerts, potentially leading to data exfiltration or lateral movement within the network.

  The rule aligns with the MITRE ATT&CK framework, specifically targeting tactics and techniques for evading defenses (Defense Evasion) and executing malicious commands (Execution). Notably, it addresses the techniques T1562 (Impair Defenses) and T1569.002 (Service Execution), which pertain to disabling or modifying security controls to facilitate malicious operations. The key data sources relevant for capturing this activity are Windows registry logs that track changes to relevant keys and values.

  ### Investigation Steps
  - **Review Registry Logs:** Examine Windows registry logs to identify any recent modifications to the `\BFE\Parameters\Policy\Persistent\Filter\` path, focusing on any entries that may indicate unauthorized changes by non-system processes.

  - **Analyze Process Activity:** Investigate process creation logs around the time of detected registry modifications, especially any instances involving `svchost.exe`, to determine if they correlate with suspicious activities or commands.

  - **Correlate with Security Tool Logs:** Cross-reference detected changes with logs from EDR and other security solutions to assess if they reported any anomalies or were silenced due to the applied filters.

  - **Identify Unusual Network Activity:** Analyze network traffic logs for outbound connections or other unusual patterns that may suggest ongoing malicious behavior that could have benefited from the evasion of security controls.

  ### Prioritization
  The alert has medium severity in an enterprise environment due to its implications on endpoint security. A successful modification to WFP filters can significantly reduce the effectiveness of security measures, increasing the likelihood of data breaches and complicating incident response efforts.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage exists if the registry logging is not configured or if modifications are made through alternative methods that may not trigger this specific rule. The detection logic assumes the existence of filtering changes that involve unauthorized processes and relies on active logging of registry modifications by Windows. If certain registry keys are not monitored, this detection may be bypassed, underscoring the need for thorough logging configurations and monitoring practices.

