  ---

  ### Technical Context

  The Sigma rule detects modifications to the Windows registry that add filters to the Windows Filtering Platform (WFP). This behavior is often associated with adversaries attempting to prevent security tools, such as endpoint detection and response (EDR) agents, from functioning correctly, thereby evading detection. The likely attacker objective is to maintain persistence and stealth by obstructing the visibility of malicious actions on compromised systems.

  The relevant MITRE ATT&CK tactics and techniques include Defense Evasion (TA0005) and the specific techniques of T1562: Impair Defense Tools and T1569.002: Command and Control through WFP. The primary telemetry sources are Windows registry logs specifically focusing on changes under the path `\BFE\Parameters\Policy\Persistent\Filter\`. If malicious, this could lead to significant security impacts, including undetected data exfiltration or system compromise. Importantly, this detection does NOT confirm the intent of the modification on its own; legitimate applications may also make similar registry changes.

  ---

  ### Investigation Steps

  - **Review registry changes:** Inspect Windows registry logs for Event ID 2040, focusing on the path `\BFE\Parameters\Policy\Persistent\Filter\`. Look specifically for changes made by non-system processes, which could indicate malicious edits.

  - **Correlate process activity:** Check for associated process creation logs (Sysmon Event ID 1 or Security Event ID 4688) around the time of the registry modification. Look for unusual or non-standard applications creating processes, especially svchost.exe, that may relate to the registry change.

  - **Identify benign behavior:** Determine baseline activities on the affected asset. For instance, examine logs for expected WFP filter changes typically stemming from legitimate applications or IT maintenance, and confirm if recent changes fit normal operations.

  - **Analyze network activity:** Look for network connections from processes that may have used WFP at the time of the registry change using Security Event ID 5156. Investigate if these connections are to unusual external IPs or domains indicative of command and control activity.

  - **Verify EDR functionality:** Confirm whether endpoint detection and response solutions on the system have been altered post-registry change. Review EDR logs for alerts that may correlate with recent changes (for example, lack of alerts after the modification).

  - **Assess host role significance:** Consider the criticality of the affected asset. High-value targets, such as domain controllers or sensitive data servers, escalated the need for thorough investigations given their potential impact.

  ---

  ### Prioritization

  The alert’s medium severity reflects the potential risk posed by registry modifications on critical systems that could interfere with security tooling. Given the likelihood of malicious abuse, particularly in environments with high-value or sensitive data, this activity warrants prompt investigation. Such behavior is known to be weaponized in various attacks, particularly those focused on evading monitoring solutions.

  ---

  ### Blind Spots and Assumptions

  Limitations of this detection include potential evasion tactics, such as adversaries utilizing trusted system processes to make registry changes. The effectiveness of detection relies on comprehensive logging configurations enabled for the Windows registry, and if these are not in place, malicious activity could go unnoticed. Legitimate software installations or configurations may trigger similar alerts, necessitating careful analysis. A companion detection, such as monitoring for suspicious network activity (e.g., unusual DNS queries), can enhance visibility into potential exploitation attempts.

