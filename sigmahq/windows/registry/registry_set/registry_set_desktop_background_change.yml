logsource:
  product: windows
  category: registry_set
detection:
  selection_keys:
    TargetObject|contains:
    - 'Control Panel\Desktop'
    - 'CurrentVersion\Policies\ActiveDesktop'
    - 'CurrentVersion\Policies\System'
  selection_values_1:
    TargetObject|endswith: 'NoChangingWallpaper'
    Details: 'DWORD (0x00000001)'     # Prevent changing desktop background
  selection_values_2:
    TargetObject|endswith: '\Wallpaper'
  selection_values_3:
    TargetObject|endswith: '\WallpaperStyle'
    Details: '2'     # Stretch
  filter_main_svchost:
        # Note: Excluding GPO changes
    Image|endswith: '\svchost.exe'
  filter_main_empty:
    TargetObject|endswith: '\Control Panel\Desktop\Wallpaper'
    Details: '(Empty)'
  filter_main_explorer:
        # Normally Explorer.exe is the process that changes the desktop background
    Image|endswith: 'C:\Windows\Explorer.EXE'
  filter_optional_ec2launch:
    Image:
    - 'C:\Program Files\Amazon\EC2Launch\EC2Launch.exe'
    - 'C:\Program Files (x86)\Amazon\EC2Launch\EC2Launch.exe'
    TargetObject|endswith: '\Control Panel\Desktop\Wallpaper'
  condition: selection_keys and 1 of selection_values_* and not 1 of 
    filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative scripts that change the desktop background to a company logo or
  other image.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes to desktop background settings in the Windows Registry, specifically targeting values that alter the wallpaper or related policies. Attackers often leverage this technique as part of a disruptive action, such as setting a ransom note as the desktop background to communicate demands. This aligns with the MITRE ATT&CK techniques T1112 (Modify Registry) and T1491.001 (Defacement of Web Content).

  The primary telemetry source is Windows Registry events, specifically registry set operations that modify paths related to desktop background settings. If malicious, this behavior can severely impact user experience and lead to further exploitation, such as ransomware deployment. Notably, this detection alone does NOT confirm malicious intent; it merely highlights a change in registry values that may require further investigation.

  ### Investigation Steps

  - **Check related registry changes:** Review Registry logs (Event ID 4657) for any recent modifications to values under `HKEY_CURRENT_USER\Control Panel\Desktop` or `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies`. Look for the `Wallpaper`, `WallpaperStyle`, and `NoChangingWallpaper` keys.

  - **Verify process origin:** Identify the process responsible for the registry change by examining Event ID 4688 (Process Creation). Look for `svchost.exe` or `explorer.exe`, and ensure it originates from expected file paths (C:\Windows\).

  - **Assess historical changes:** Analyze historical registry value states to determine if the wallpaper settings have recently been altered unexpectedly. Compare previous values against the current states to identify unauthorized changes.

  - **Determine baseline wallpaper activity:** Identify legitimate changes such as company branding or user-initiated changes. This might involve checking the asset owner's role or department for expected behavior regarding desktop wallpaper modifications.

  - **Identify high-confidence indicators:** Look for registry modifications triggered by abnormal processes or unusual user accounts. Alerts involving changes made by non-standard user accounts (e.g., service accounts) can indicate malicious activity.

  - **Look for artifacts of exfiltration:** If there is a pattern of background changes coinciding with file creation (Event ID 4663) or network activity (e.g., outbound connections via Event ID 5156), investigate for potential data exfiltration or malicious payload deployment.

  ### Prioritization

  This alert carries medium severity due to the potential impact on user systems and the likelihood of being leveraged for malicious objectives, such as displaying ransom notes. While it may reflect benign changes in certain environments, background modifications are often weaponized techniques in ransomware attacks, necessitating prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be bypassed through legitimate administrative scripts that change background settings for branding purposes. Successful detection relies on having appropriate logging enabled for registry modifications. Be aware that benign activities, such as user-initiated changes to desktop wallpapers or administrative rebranding efforts, may trigger this alert. Related detections that reinforce coverage include events capturing Process Creation (Event ID 4688) and file access/manipulation (Event ID 4663).

