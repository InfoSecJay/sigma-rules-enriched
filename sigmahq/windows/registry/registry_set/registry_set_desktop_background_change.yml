logsource:
  product: windows
  category: registry_set
detection:
  selection_keys:
    TargetObject|contains:
    - 'Control Panel\Desktop'
    - 'CurrentVersion\Policies\ActiveDesktop'
    - 'CurrentVersion\Policies\System'
  selection_values_1:
    TargetObject|endswith: 'NoChangingWallpaper'
    Details: 'DWORD (0x00000001)'     # Prevent changing desktop background
  selection_values_2:
    TargetObject|endswith: '\Wallpaper'
  selection_values_3:
    TargetObject|endswith: '\WallpaperStyle'
    Details: '2'     # Stretch
  filter_main_svchost:
        # Note: Excluding GPO changes
    Image|endswith: '\svchost.exe'
  filter_main_empty:
    TargetObject|endswith: '\Control Panel\Desktop\Wallpaper'
    Details: '(Empty)'
  filter_main_explorer:
        # Normally Explorer.exe is the process that changes the desktop background
    Image|endswith: 'C:\Windows\Explorer.EXE'
  filter_optional_ec2launch:
    Image:
    - 'C:\Program Files\Amazon\EC2Launch\EC2Launch.exe'
    - 'C:\Program Files (x86)\Amazon\EC2Launch\EC2Launch.exe'
    TargetObject|endswith: '\Control Panel\Desktop\Wallpaper'
  condition: selection_keys and 1 of selection_values_* and not 1 of filter_main_*
    and not 1 of filter_optional_*
falsepositives:
- Administrative scripts that change the desktop background to a company logo or other
  image.
level: medium
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious changes to a user's desktop background via modifications in the Windows Registry. Such changes are often indicative of malicious activity, particularly ransomware operations like the Rhysida ransomware, which may seek to display ransom notes or other alarming images as a form of coercion. Attackers typically aim to disrupt user experience and instill panic, thereby accelerating ransom payments.

  The relevant MITRE ATT&CK tactics include **Persistence (T1112)**, where techniques are employed to maintain access to compromised systems, and **Defense Evasion (T1491.001)**, which covers methods to bypass or evade security defenses. The technique of changing desktop backgrounds for malicious purposes can directly affect user perception of system integrity and drive them toward the attacker's objectives. Primary data sources for this detection include Windows Registry logs, particularly focusing on user modifications in specific paths related to desktop settings.

  ### Investigation Steps
  - **Review Registry Logs:** Examine registry change logs specifically for modifications in `Control Panel\Desktop`, `CurrentVersion\Policies\ActiveDesktop`, and `CurrentVersion\Policies\System` for unauthorized background changes.
  - **Analyze Process Execution Logs:** Investigate process creation events to identify any unusual invocations of `svchost.exe` or `explorer.exe` at times close to the detected registry changes which may indicate scripted or automated alterations.
  - **Verify User Activity:** Check for unusual user activities prior to the registry changes, such as multiple login attempts or other suspicious behavior that may indicate a compromised account.
  - **Assess Endpoint Security Alerts:** Look for alerts or logs generated by endpoint security solutions (like EDR) that might provide insights into potential malware behaviors or unauthorized changes made to system settings.

  ### Prioritization
  This alert is of **medium severity** due to its potential association with ransomware activity and widespread impact on user experience. While the likelihood of false positives exists (e.g., administrative changes), timely investigation is crucial to mitigate the risk of a significant security incident.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection rule is the inability to capture changes made by legitimate administrative scripts that modify desktop backgrounds for business purposes. The detection logic assumes that changes invoking system processes like `svchost.exe` or `explorer.exe` are malicious unless excluded by filters, which may overlook legitimate modifications during maintenance. Furthermore, having adequate logging enabled for Windows Registry is essential for this alert to function effectively; without it, detection may be incomplete or ineffective.

