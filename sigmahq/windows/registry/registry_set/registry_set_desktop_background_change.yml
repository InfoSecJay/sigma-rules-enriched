logsource:
  product: windows
  category: registry_set
detection:
  selection_keys:
    TargetObject|contains:
    - 'Control Panel\Desktop'
    - 'CurrentVersion\Policies\ActiveDesktop'
    - 'CurrentVersion\Policies\System'
  selection_values_1:
    TargetObject|endswith: 'NoChangingWallpaper'
    Details: 'DWORD (0x00000001)'     # Prevent changing desktop background
  selection_values_2:
    TargetObject|endswith: '\Wallpaper'
  selection_values_3:
    TargetObject|endswith: '\WallpaperStyle'
    Details: '2'     # Stretch
  filter_main_svchost:
        # Note: Excluding GPO changes
    Image|endswith: '\svchost.exe'
  filter_main_empty:
    TargetObject|endswith: '\Control Panel\Desktop\Wallpaper'
    Details: '(Empty)'
  filter_main_explorer:
        # Normally Explorer.exe is the process that changes the desktop background
    Image|endswith: 'C:\Windows\Explorer.EXE'
  filter_optional_ec2launch:
    Image:
    - 'C:\Program Files\Amazon\EC2Launch\EC2Launch.exe'
    - 'C:\Program Files (x86)\Amazon\EC2Launch\EC2Launch.exe'
    TargetObject|endswith: '\Control Panel\Desktop\Wallpaper'
  condition: selection_keys and 1 of selection_values_* and not 1 of 
    filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative scripts that change the desktop background to a company logo or
  other image.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Registry that could alter a user's desktop wallpaper settings. Specifically, it identifies when the `Control Panel\Desktop` key or other relevant registry paths are modified to either set a wallpaper or prevent users from changing it, which is a behavior often associated with ransomware like Rhysida. The likely attacker objective is to replace the wallpaper with a ransom note or distract the user during an attack.

  This behavior fits within the MITRE ATT&CK framework under the tactics of Persistence (T1547) and Defense Evasion (T1112). The primary telemetry source for this detection is the Windows Registry, particularly the logs that capture registry modifications (Event IDs associated with registry changes). The security impact may be significant if malicious, such as aiding in the delivery of a ransom note or furthering exploitation. However, this detection does NOT confirm that all wallpaper changes are malicious, as administrative processes can legitimately change desktop backgrounds.

  ### Investigation Steps

  - **Review registry changes:**
    Examine Windows Registry Event IDs 4657 and 4663 for details on the specific changes made to `Control Panel\Desktop`, `CurrentVersion\Policies\ActiveDesktop`, or related paths. Compare against known benign changes, like company logos.

  - **Confirm process legitimacy:**
    Verify the process responsible for the registry change. Launch Event IDs 4688 and 592, focusing on whether the process `C:\Windows\Explorer.EXE` (legitimate) or `svchost.exe` (potentially malicious) was responsible for the modification.

  - **Identify wallpaper settings:**
    Check for `Wallpaper` values under the `Control Panel\Desktop` key to see what image was set. Document if it matches known ransom images or other suspicious content. For benign cases, look for corporate logos.

  - **Search for related activities:**
    Analyze system and application logs for associated activities around the same time, such as Event ID 4104 (for PowerShell) or suspicious login events (Event ID 4624) that may indicate a broader compromise.

  - **Investigate user impact:**
    Identify the account with the changed wallpaper by reviewing the user session logs (Event ID 4634). Consider asset criticality—changes on a sensitive business unit or administrator machine raise the risk level.

  ### Prioritization

  This alert should be treated as medium severity within an enterprise context, as it indicates a potential malicious behavior that commonly leads to further exploitation or user distraction. The likelihood of malicious use is moderate due to its association with known ransomware tactics that aim to disrupt and extort victims.

  ### Blind Spots and Assumptions

  Detection limitations exist, as legitimate administrative scripts may trigger this alert when changing wallpapers for branding purposes. The requirement for thorough logging of registry access is crucial for reliable detection; without it, the changes may go unnoticed. Furthermore, legitimate user activities, such as IT department background updates, could produce similar registry modifications. A related detection could include monitoring for Windows task scheduling changes (T1053) that often accompany malicious wallpaper changes or other persistence mechanisms.

