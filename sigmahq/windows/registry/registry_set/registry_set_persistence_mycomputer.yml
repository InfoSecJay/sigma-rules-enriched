  ---

  ### Technical Context

  This Sigma rule detects unauthorized modifications to the "MyComputer" registry key, specifically changes to the "Default" value that redirect to a custom binary. Attackers may aim to achieve persistence on a compromised system by ensuring that their payload executes whenever the "MyComputer" link is engaged. This behavior falls under the MITRE ATT&CK tactic of Persistence (TA0003) and technique Registry Run Keys / Startup Folder (T1060). The primary telemetry source for this detection is Windows Registry activity, specifically registry set events.

  If successful, this tactic allows the adversary to regain access to the system after it's been restarted or logged out, potentially leading to further exploitation. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate applications may also modify these registry keys under certain circumstances.

  ---

  ### Investigation Steps

  - **Review registry modifications for unusual binaries:** Investigate Registry Set Events (Windows Event ID 4657) to identify any new or unexpected binary paths associated with the "MyComputer" key. Look for paths that do not correspond to legitimate applications.

  - **Identify recent changes to the registry key:** Check the Event ID 4657 logs for any changes made to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\MyComputer`. Look for the timestamp of the modification and correlate it with user activity.

  - **Correlate logged user activity:** Review Security Event ID 4624 (logon events) around the time of the registry change to establish context. Confirm if the user or process associated with the modification is known or expected.

  - **Check for known benign applications:** Validate if the modification aligns with any known software that legitimately modifies the "MyComputer" registry key. Document examples of legitimate behaviors to compare against findings.

  - **Assess execution of the modified binary:** If a custom binary is identified, confirm if it was executed after the registry modification by checking for relevant Application Logs or Process Creation Events (Sysmon Event ID 1). Look for indicators of malicious behavior, such as unusual file names or execution paths.

  ---

  ### Prioritization

  This alert is considered high severity because it indicates a potential persistence mechanism that can allow an attacker to regain access to critical systems. The likelihood of abuse is high if the modifications are tied to known attackers or are atypical in your environment. Such behavior is not only uncommon but also directly weaponized in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate software modifying registry entries without standard logging practices. Ensuring that all relevant registry activity is logged is critical for reliable detection. Additionally, users triggering this alert may be performing legitimate administrative tasks, such as configuring applications. Companion detections, such as monitoring for unusual process creation events or monitoring for abnormal file executions in conjunction with registry changes, enhance visibility into potential threats.

