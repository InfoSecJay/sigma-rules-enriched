note: |
  ### Technical Context
  This detection rule aims to identify unauthorized modifications to the "Default" value of the "MyComputer" registry key and its subkeys on Windows systems. Such modifications can serve as a technique for maintaining persistence in an environment, as attackers can alter these registry values to execute custom binaries whenever certain system actions occur, ensuring that their malicious payloads run on system startup or during specific user actions.

  In a typical attack scenario, a threat actor may gain initial access to a system and then seek to establish persistence by modifying system configurations, such as registry values. The attacker’s objective is to retain access to the compromised system even after reboots or other system changes, which is critical for conducting subsequent activities like data exfiltration or lateral movement.

  Relevant MITRE ATT&CK tactics include **Persistence (T1547)**, specifically under the technique **Startup Items (T1547.001)**. Primary data sources that provide critical evidence for this detection include Windows registry change logs and event logs monitoring registry modifications.

  ### Investigation Steps
  - **Review Registry Change Logs:** Examine logs for modifications to the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\MyComputer` registry key to identify any unauthorized changes to the "Default" value.
  - **Analyze Process Creation Events:** Investigate process creation events around the time of the registry modification to determine if any suspicious or unknown binaries were executed as a result of the change.
  - **Check for Known Persistence Mechanisms:** Look for other known persistence mechanisms that may be employed alongside or in lieu of registry modifications, such as startup folder entries or scheduled tasks.
  - **Gather Contextual User Activity Logs:** Collect user activity logs to identify any suspicious user behavior leading up to the modifications, including any remote access attempts, account logins, or unusual commands executed.

  ### Prioritization
  The high severity of this alert is based on the potential impact it signifies; unauthorized persistence mechanisms can lead to prolonged unauthorized access within an enterprise environment, increasing the likelihood of data compromise and system integrity violations.

  ### Blind Spots and Assumptions
  This detection may have gaps in coverage if monitoring of Windows registry modifications is not configured properly or if there are other persistence mechanisms that go unnoticed, such as entrance through different registry locations. The logic assumes that all relevant changes to the MyComputer key are malicious, which may not always be the case; thus, a thorough context-check against whitelisted processes is necessary. For effective detection, comprehensive logging of registry changes should be enabled throughout the enterprise systems.

