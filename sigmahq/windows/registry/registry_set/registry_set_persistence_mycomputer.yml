  ### Technical Context

  This Sigma rule detects modifications to the "Default" registry value of the "MyComputer" key in Windows, which may redirect legitimate actions to malicious binaries. The likely attacker objective is to establish persistence by ensuring that their payload is executed within the context of user actions, such as accessing "My Computer." This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique Registry Run Keys / Startup Folder (T1547.001).

  The primary telemetry sources for detection include Windows Registry change logs, specifically targeting registry events related to modifications of the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer` path. The security impact of malicious modifications can lead to remote code execution and unauthorized access to system functions. Importantly, this detection does not confirm malicious intent on its own, as legitimate applications may also alter the registry.

  ### Investigation Steps

  - **Review registry modifications:** Check Windows Security Event ID 4657 for any changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\MyComputer` to determine the source of the modification.

  - **Validate the binary path:** Examine the modified registry value using Windows Sysmon Event ID 13 to identify the path set in the registry, confirming if it points to a known or suspicious executable.

  - **Identify legitimate behavior:** Ensure that modifications are not stemming from legitimate management tools or updates which may also alter default registry settings for MyComputer.

  - **Correlate with user actions:** Cross-reference the timestamp of the registry modification against user logins and activities using Windows Security Event ID 4634 to confirm legitimate user actions coinciding with the changes.

  - **Monitor for persistence indicators:** Investigate associated binaries or scripts for file creations or executions using Sysmon Event ID 1, validating any unusual running processes that correspond to the modified registry key.

  - **Evaluate system role impact:** Assess the criticality of the affected system, particularly if it serves essential functions within the enterprise, to prioritize investigation based on the system's role within the network.

  ### Prioritization

  This alert should be treated with high severity due to its potential to allow adversarial persistence in critical systems. The likelihood of malicious abuse is significant, as modifications to registry keys have been commonly weaponized by attackers to execute payloads seamlessly. Prompt investigation is necessary to mitigate any risks posed by such activities.

  ### Blind Spots and Assumptions

  The detection of registry modifications may be limited by user permissions, as privileged accounts are more likely to make such changes unnoticed. Evasion techniques might include temporary disabling of logging mechanisms or using legitimate installer behavior to obscure the modification. Legitimate activities could include routine system updates or software installations that modify registry keys. Companion detections such as monitoring for unusual process execution based on registry changes can strengthen overall security coverage.

