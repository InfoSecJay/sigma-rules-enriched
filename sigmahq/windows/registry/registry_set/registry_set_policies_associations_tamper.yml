title: Potential Attachment Manager Settings Associations Tamper
id: a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47
status: test
description: Detects tampering with attachment manager settings policies associations
  to lower the default file type risks (See reference for more information)
references:
- https://support.microsoft.com/en-us/topic/information-about-the-attachment-manager-in-microsoft-windows-c48a4dcd-8de5-2af5-ee9b-cd795ae42738
- https://www.virustotal.com/gui/file/2bcd5702a7565952c44075ac6fb946c7780526640d1264f692c7664c02c68465
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-08-17
tags:
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\'
  selection_value_default_file_type_rsik:
    TargetObject|endswith: '\DefaultFileTypeRisk'
    Details: 'DWORD (0x00006152)'
  selection_value_low_risk_filetypes:
    TargetObject|endswith: '\LowRiskFileTypes'
    Details|contains:     # Add more as you see fit
    - '.zip;'
    - '.rar;'
    - '.exe;'
    - '.bat;'
    - '.com;'
    - '.cmd;'
    - '.reg;'
    - '.msi;'
    - '.htm;'
    - '.html;'
  condition: selection_main and 1 of selection_value_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects unauthorized modifications to the Windows Attachment Manager settings, which could indicate an attempt to bypass security controls that evaluate the safety of file types. Attackers may tamper with these settings to lower the risk associated with potentially dangerous file types, allowing malicious files to be executed with fewer warnings. This behavior is often seen in the context of phishing attacks or malware campaigns, where an attacker seeks to manipulate system settings to facilitate their malicious actions.

  The relevant MITRE ATT&CK tactics include **Defense Evasion (T1203)**, as the attacker attempts to evade security measures by altering system policies. The specific techniques potentially employed include setting low risk for certain file types to hide malicious payloads and ensure their smooth delivery into the target environment.

  Primary data sources that will provide the best evidence for this rule include registry change logs or alerts, specifically those that monitor any changes to the Windows registry paths associated with the Attachment Manager settings.

  ### Investigation Steps
  - **Review Registry Changes**: Examine logs for modifications to the Windows registry keys under `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\`. Focus on changes to `DefaultFileTypeRisk` and `LowRiskFileTypes`.

  - **Assess User Activity**: Look into the user accounts that performed the registry modifications. Investigate their recent activity for any suspicious behavior, including unusual logon times or access to high-risk areas.

  - **Check for Related Alerts**: Correlate findings with other security alerts that may indicate broader compromise, such as unexpected process executions, unusual network traffic, or flagged attachments.

  - **Evaluate File Types**: Analyze the list of file types flagged as low risk. Research any entries that are not standard for your organization's security policies, as these may signal attempts to legitimize malicious file executions.

  ### Prioritization
  This alert carries a high severity level due to the potential for serious damage that could result from allowing malicious files to bypass security measures. The likelihood of impact increases if combined with other observations of suspicious activity or social engineering attempts.

  ### Blind Spots and Assumptions
  One significant gap in detection coverage is that not all security solutions might log registry changes effectively, potentially leading to missed detections. The detection logic assumes that modifications to Attachment Manager settings are malicious by nature, which may not account for legitimate administrative activities. Furthermore, configurations in the monitoring tools must be properly set up to capture registry changes accurately, ensuring all relevant logs are being collected and analyzed.

