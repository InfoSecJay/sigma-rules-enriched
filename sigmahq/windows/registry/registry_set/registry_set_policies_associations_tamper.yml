detection:
  selection_main:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\'
  selection_value_default_file_type_rsik:
    TargetObject|endswith: '\DefaultFileTypeRisk'
    Details: 'DWORD (0x00006152)'
  selection_value_low_risk_filetypes:
    TargetObject|endswith: '\LowRiskFileTypes'
    Details|contains:     # Add more as you see fit
    - '.zip;'
    - '.rar;'
    - '.exe;'
    - '.bat;'
    - '.com;'
    - '.cmd;'
    - '.reg;'
    - '.msi;'
    - '.htm;'
    - '.html;'
  condition: selection_main and 1 of selection_value_*
falsepositives:
- Unlikely
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects changes to Windows Attachment Manager policy settings that may lower file type risks. Attackers may exploit this behavior to bypass security controls that prevent the execution of malicious file types. Relevant MITRE ATT&CK tactics include **Defense Evasion (T1562)**. The primary telemetry sources are Windows Registry logs, specifically targeting changes in the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations` path. Malicious changes could enable the execution of potentially harmful files, increasing an organization's exposure to malware threats. However, this detection does not confirm the presence of malware or an active compromise, as changes can occur due to legitimate administrative actions.

  ---

  ### Investigation Steps

  - **Verify registry changes:** Review Windows Registry Event Logs (Event ID 4657) for modifications at `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations`. Look for entries regarding `DefaultFileTypeRisk` and `LowRiskFileTypes`. Legitimate administrators may change settings, but unusual modifications in a short timeframe by non-admin users should raise concern.

  - **Assess the modified file types:** Check if `LowRiskFileTypes` includes suspicious file extensions such as `.exe`, `.bat`, or `.cmd`. Extract this information from the Registry key to see if unexpected or high-risk file types were introduced.

  - **Identify user context:** Determine which user account made the registry changes to assess legitimacy. Use Security Event ID 4672 to identify if the change was made by a local administrator or a service account, as administrative changes can indicate a security risk.

  - **Cross-reference file execution logs:** Validate if changes correspond with subsequent execution of previously risky file types using Windows Security Event ID 4688 (Process Creation). Track execution timing and context to discover if a newly marked low-risk file type was executed shortly after the registry change.

  - **Monitor for automated scripts:** Check for the presence of scripts or policies that may enable these registry modifications. Review command-line arguments in Security Event ID 4688 to determine if the changes were made through automation via PowerShell or command scripts.

  - **Review asset criticality:** Assess the criticality of the affected system. Changes made on high-value servers (e.g., financial systems, critical infrastructure) should trigger immediate escalations due to potential risks involved.

  ---

  ### Prioritization

  This alert should be treated as high severity due to the potential for an attacker to manipulate file type risk settings and execute malicious payloads. Systems with modified attachment settings could present a pathway for effective phishing or malware attacks, especially if weaponized file types are allowed.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the adequacy of log collection for registry changes; ensure Windows Auditing for Registry modifications is enabled. Legitimate changes for software updates or administrative tasks could trigger this alert. Related detections such as monitoring for process creations from modified low-risk file types can further enhance coverage and strengthen incident response.

