title: Potential Attachment Manager Settings Associations Tamper
id: a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47
status: test
description: Detects tampering with attachment manager settings policies 
  associations to lower the default file type risks (See reference for more 
  information)
references:
- https://support.microsoft.com/en-us/topic/information-about-the-attachment-manager-in-microsoft-windows-c48a4dcd-8de5-2af5-ee9b-cd795ae42738
- https://www.virustotal.com/gui/file/2bcd5702a7565952c44075ac6fb946c7780526640d1264f692c7664c02c68465
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-08-17
tags:
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\'
  selection_value_default_file_type_rsik:
    TargetObject|endswith: '\DefaultFileTypeRisk'
    Details: 'DWORD (0x00006152)'
  selection_value_low_risk_filetypes:
    TargetObject|endswith: '\LowRiskFileTypes'
    Details|contains:     # Add more as you see fit
    - '.zip;'
    - '.rar;'
    - '.exe;'
    - '.bat;'
    - '.com;'
    - '.cmd;'
    - '.reg;'
    - '.msi;'
    - '.htm;'
    - '.html;'
  condition: selection_main and 1 of selection_value_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects attempts to tamper with Windows Attachment Manager settings, specifically modifications to policies associated with file type risks. The objective of the attacker could be to reduce security restrictions on potentially dangerous file types (e.g., executables, scripts), facilitating the execution of malware. This behavior corresponds to the MITRE ATT&CK technique for **Defense Evasion** (T1203).

  Primary telemetry sources include Windows Registry changes, specifically monitoring `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\`. If malicious, altering these settings could permit the execution of harmful file types without appropriate warnings or blocks. Importantly, this detection does NOT confirm that any malicious file or action has occurred; it merely indicates a potential intent or preparatory action to lower defenses.

  ### Investigation Steps

  - **Inspect Registry Changes:** Check for modifications to the registry key `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\`. Investigate any entries related to `DefaultFileTypeRisk` and `LowRiskFileTypes`. Look for values indicating untrusted file types, such as `'.exe;'`, `'.bat;'`, or `'.msi;'`.

  - **Review Change Source:** Identify the user or process responsible for making the registry changes. Use Windows Security Event ID 4663 to track access to the registry key and correlate it with the event's Subject's username and process ID.

  - **Assess the Context of Changes:** Compare the timing and origin of the changes to known scheduled tasks or policies within your organization. Legitimate changes might come from IT management tools or authorized scripts, while unexpected changes from non-privileged accounts could indicate malicious intent.

  - **Check for Associated Malware:** Utilize antivirus or EDR solutions to scan the host for signs of malware execution that may have exploited lowered file type restrictions. Focus on suspicious processes that correlate with the registry modification time.

  - **Analyze System Logs for Activity Patterns:** Review Windows Event Logs (Event ID 4688 for process creation) during the timeframe of registry changes to detect potentially malicious behaviors, including the launching of unusual scripts or executables.

  - **Evaluate Host Role and Criticality:** Determine if the affected system is critical (e.g., domain controller, sensitive endpoint). Increased scrutiny is warranted for systems that typically handle sensitive data or perform administrative functions.

  ### Prioritization

  The alert has high severity due to its potential impact on security posture, especially if an endpoint with elevated privileges is compromised. The likelihood of leveraging tampered attachment settings for malicious purposes is high, as these are commonly weaponized in phishing attacks and payload delivery mechanisms.

  ### Blind Spots and Assumptions

  Detection may miss cases where advanced adversaries utilize direct memory access or system-level code injection to evade registry monitoring. Reliable detection requires appropriate logging configurations; if Windows Registry auditing is not enabled, the detection may fail. Legitimate administrative activities, like system updates or security configuration changes, may inadvertently trigger this alert. A related detection could include monitoring for process creation events that involve suspicious file types post-registry modification.

