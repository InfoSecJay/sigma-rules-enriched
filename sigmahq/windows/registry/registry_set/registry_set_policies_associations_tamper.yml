title: Potential Attachment Manager Settings Associations Tamper
id: a9b6c011-ab69-4ddb-bc0a-c4f21c80ec47
status: test
description: Detects tampering with attachment manager settings policies 
  associations to lower the default file type risks (See reference for more 
  information)
references:
- https://support.microsoft.com/en-us/topic/information-about-the-attachment-manager-in-microsoft-windows-c48a4dcd-8de5-2af5-ee9b-cd795ae42738
- https://www.virustotal.com/gui/file/2bcd5702a7565952c44075ac6fb946c7780526640d1264f692c7664c02c68465
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-01
modified: 2023-08-17
tags:
- attack.defense-impairment
logsource:
  category: registry_set
  product: windows
detection:
  selection_main:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\'
  selection_value_default_file_type_rsik:
    TargetObject|endswith: '\DefaultFileTypeRisk'
    Details: 'DWORD (0x00006152)'
  selection_value_low_risk_filetypes:
    TargetObject|endswith: '\LowRiskFileTypes'
    Details|contains:     # Add more as you see fit
    - '.zip;'
    - '.rar;'
    - '.exe;'
    - '.bat;'
    - '.com;'
    - '.cmd;'
    - '.reg;'
    - '.msi;'
    - '.htm;'
    - '.html;'
  condition: selection_main and 1 of selection_value_*
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects alterations to Windows Attachment Manager policy settings, specifically targeting modifications to the DefaultFileTypeRisk and LowRiskFileTypes registry keys. Such changes are typically aimed at lowering the risk associated with specific file types that could be potentially malicious when downloaded; for example, enabling the execution of .exe or .bat files which are generally considered risky. The likely adversary objective would be to bypass security mechanisms that prevent the execution of potentially harmful files.

  This behavior correlates with the MITRE ATT&CK technique **Defense Evasion (T1211)**, where attackers modify security configurations to evade detection and mitigation strategies. The primary telemetry source is the Windows Registry, specifically through registry set events that indicate changes to the associated policy keys. If malicious, these changes could allow the execution of harmful files that the organization intends to block. However, this detection does NOT confirm an active attack or an execution of malicious payloads without further corroborative evidence of file execution or successful exploit activity.

  ### Investigation Steps

  - **Review system events in registry changes:** Monitor Registry Event Logs (Event ID 4657) for modifications on the key path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Associations\`. Look for unexpected changes regarding DefaultFileTypeRisk and LowRiskFileTypes.

  - **Document expected behavior:** For regular operations, review any legitimate updates applied by system administrators or policy changes from enterprise software. Changes should be documented in change management logs.

  - **Correlate with threat intelligence:** Look for indicators of compromise (IOCs) linked to known malicious activities that involve file types associated with risk; cross-reference these with the system and application logs.

  - **Identify recent software deployments or updates:** Check installation logs (Event ID 11707 from MSI) to identify if any deployments coincided with registry changes. Malicious changes would not typically align with documented updates.

  - **Investigate execution of risky file types:** Review execution logs for file types listed (Event ID 4688 for process creation). Look for any unexpected activities involving low-risk file types under review to establish a link between the changes and actual exploit attempts.

  - **Analyze related security alerts:** Investigate for any simultaneous alerts related to malicious file downloads or suspicious process creations. Companion detections from file integrity monitoring tools or EDR solutions can strengthen the assessment context.

  ### Prioritization

  This alert carries a high severity due to the potential for significant risk if an attacker exploits altered attachment manager settings to execute malicious files. The likelihood of abuse is elevated, particularly in environments lacking robust application control measures. This type of behavior is commonly weaponized in attacks that intend to leverage benign-looking files to deliver malware.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative changes that may trigger the alert, leading to false positives. Reliable detection requires comprehensive Windows registry logging to capture all modifications. Additionally, typical business operations—such as software development or system updates—might include legitimate changes to these settings. Companion detection for this rule could include monitoring for suspicious activity in security logs when file types associated with regulatory policy changes are executed.

