  ### Technical Context

  This Sigma rule detects the modification of the "DisableHypervisorEnforcedPagingTranslation" registry value on Windows systems, specifically when it is set to "1" to disable Hypervisor Enforced Paging Translation (HEPT). This behavior is indicative of attempts by attackers to bypass kernel exploit mitigations, enhancing their ability to execute code at a high privilege level. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0005), specifically technique **Disable Hypervisor Enforced Paging Translation** (T1562.001).

  Primary telemetry sources include Windows registry change logs. Required log types encompass registry event logs that document modifications to critical registry values. The security impact includes potential elevated privilege exploits, as disabling HEPT can allow attackers to bypass memory protection mechanisms. Importantly, this detection does NOT confirm that an attack has occurred; it merely indicates a change likely intended to facilitate such an action.

  ---

  ### Investigation Steps

  - **Identify registry changes:** Review Windows registry logs for Key: `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\DeviceGuard`, looking for the `DisableHypervisorEnforcedPagingTranslation` value change. Expected benign values are `0` or `2`, with `1` indicating a possible config change.

  - **Assess user accounts involved:** Check for the user account that made the registry modification using Event ID 4663 (Access to an object) and correlate with Process ID (PID) logs in Event ID 4688 (Process creation) for the associated application making the change.

  - **Validate system roles:** Verify if the affected system is a Hyper-V host or a VM. Use Hyper-V Management logs to assess potential misuse since protecting hypervisors is critical in enterprises utilizing virtualization.

  - **Determine recent installation or updates:** Review the system logs for recently installed software or updates around the time of the detected registry change. Use Event ID 1074 (System Shutdown) or 6005 (Event log service started) to correlate system changes with timestamps of the detected alert.

  - **Identify potential exploitation tools:** Look for known exploit tools or frameworks that may have been executed prior to the registry change by examining security logs for any executable named similarly to exploitation tools (like Mimikatz) using Event ID 4688.

  ---

  ### Prioritization

  This alert carries a **high** severity due to the potential for significant system compromise following the disabling of critical security features. The likelihood of malicious behavior is elevated, as such modifications are less common in standard administrative activities, making it an attractive target for adversarial actions.

  ---

  ### Blind Spots and Assumptions

  This detection may have limitations based on the potential for legitimate system administrator actions that could also trigger similar registry modifications. It's essential to ensure comprehensive logging of registry changes is enabled to maintain detection reliability. Additionally, attacks may utilize evasive strategies, such as obfuscating their module names or utilizing signed binaries. Companion detections for Event ID 4688 (Process Creation) can strengthen the analysis by correlating process executions leading to registry modifications.

