  ### Technical Context

  This Sigma rule detects changes to the "DisableHypervisorEnforcedPagingTranslation" registry value, specifically when it is set to "1." This change disables a security feature that helps protect against kernel exploits by controlling the translation of memory addresses in hypervisors, allowing attackers to launch more sophisticated exploits against the system's memory.

  The likely objective of an attacker modifying this setting is to evade detection, gain higher control over the host system, and facilitate exploitation of vulnerabilities in the kernel through non-data-driven methods. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (T1562) and specifically the sub-technique of "Disable or Modify Tooling" (T1562.001).

  The primary telemetry source for this alert is Windows Registry logs, specifically actions tracking changes to the registry keys. If this rule triggers, the potential security impact could be significant, as disabling this setting can expose sensitive kernel memory and increase the risk of successful kernel-level exploits. It is crucial to note that this detection alone does not confirm malicious activity; further context and corroboration are required.

  ---

  ### Investigation Steps

  - **Check registry value history: **Query the Windows Registry for the value of `DisableHypervisorEnforcedPagingTranslation` located at `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\DeviceGuard`. Record any modifications and correlate timestamps with other significant events.

  - **Validate security logs: **Review Windows Security Event ID 4663 (An attempt was made to access an object) for actions related to modifications of the registry key. Look for alterations performed by unusual or unauthorized accounts, indicating potential malicious intent.

  - **Monitor for related process activity: **Investigate Sysmon Event ID 1 (Process Creation) for processes spawned around the same time as the registry change. Specifically, look for processes with unusual names, non-standard locations, or those previously flagged in security incidents.

  - **Identify expected configurations: **Document the organization's baseline configuration regarding hypervisor settings. Verify that legitimate administrative changes by authorized personnel were made for valid reasons (for instance, system maintenance or testing).

  - **Correlate with known threats: **Cross-check with threat intelligence sources for any known exploits or attacks that involve disabling hypervisor security features. Verify if the environment has seen attempts of such attacks recently.

  ---

  ### Prioritization

  This alert carries a high severity level due to the critical role of hypervisor-enhanced security in protecting against kernel exploits. The likelihood of malicious abuse is elevated, especially as the technique is commonly weaponized in targeted attacks that seek to compromise system integrity.

  ---

  ### Blind Spots and Assumptions

  Detection of this registry change could be evaded by methods that disguise or revert changes without logging activities. It also relies on the availability of accurate registry logging configurations to ensure reliability. Common benign activities, such as legitimate system updates or administrative actions involving hypervisor tests, may trigger this alert. Companion detections, such as monitoring for changes in Hyper-V settings or system vulnerabilities (e.g., CVE-2021-31955), can provide additional context and enhance detection coverage.

