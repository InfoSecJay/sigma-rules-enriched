note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows registry key "DisableHypervisorEnforcedPagingTranslation", specifically when it is set to "1", effectively disabling the Hypervisor Enforced Paging Translation feature. The primary behavior detected indicates an attacker’s effort to bypass security mechanisms aimed at preventing kernel-mode exploits. The likely attacker objective is to facilitate unauthorized execution of code at a higher privilege level by disabling safeguards that could thwart exploitation attempts.

  The relevant MITRE ATT&CK tactic is "Defense Evasion" (TA0005) and the technique is "Disabling Security Tools" (T1685). The primary telemetry source is Windows registry modifications, requiring logs that reflect changes to system settings. If malicious, disabling this setting can significantly impact system integrity and exploitability. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative actions could also trigger this alert.

  ### Investigation Steps

  - **Check the registry value directly:** Examine the registry key path `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Power\` for the value `DisableHypervisorEnforcedPagingTranslation`, verifying its setting. Legitimate settings should typically be `0`.

  - **Review Event ID 4657:** Look for Event ID 4657 in Security logs indicating a value change in the registry; confirm if the change corresponds with known maintenance or administrative windows.

  - **Analyze system roles:** Assess if the alert originates from critical systems (e.g., domain controllers or sensitive application servers). Changes to this setting on these roles are more concerning due to their potential impact.

  - **Investigate account activity:** Examine the account associated with the registry change (found in Event ID 4657). Cross-reference against your organization’s change management records to identify whether it was an authorized change.

  - **Correlate with other detections:** Look for prior alerts related to kernel exploitation or abnormal process activity (e.g., Event ID 4688 for process creation) that might indicate a coordinated attack.

  - **Document any legitimate administrative actions:** If changes occurred during a scheduled maintenance period, record this in your incident log to avoid misinterpretation of the alert.

  ### Prioritization

  This alert is considered high severity due to its potential to significantly impact system defenses. The likelihood of malicious abuse is moderate, as disabling this feature is a known tactic among advanced adversaries seeking to execute kernel-level exploits. This behavior is concerning due to its association with escalated risks in security contexts.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where threat actors may employ alternate methods to alter or hide this registry setting. Reliability is contingent on proper logging configurations for Windows registry changes; ensure Windows Auditing is enabled for registry key alterations. Legitimate system updates or software installations may trigger this alert. A related detection to enhance coverage is monitoring for abnormal kernel-mode activity (e.g., Sysmon Event ID 10, which logs process duplicates that can indicate exploitation attempts).

