title: New RUN Key Pointing to Suspicious Folder
id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
status: experimental
description: Detects suspicious new RUN key element pointing to an executable in
  a suspicious folder
references:
- https://www.fireeye.com/blog/threat-research/2018/08/fin7-pursuing-an-enigmatic-and-evasive-global-criminal-operation.html
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: Florian Roth (Nextron Systems), Markus Neis, Sander Wiebing, 
  Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2018-08-25
modified: 2025-10-06
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_target:
    TargetObject|contains:
    - '\Software\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
  selection_suspicious_paths_1:
    Details|contains:
    - ':\Perflogs'
    - :\ProgramData'
    - ':\Windows\Temp'
    - ':\Temp'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming'
    - ':\$Recycle.bin'
    - ':\Users\Default'
    - ':\Users\public'
    - '%temp%'
    - '%tmp%'
    - '%Public%'
    - '%AppData%'
  selection_suspicious_paths_user_1:
    Details|contains: ':\Users\'
  selection_suspicious_paths_user_2:
    Details|contains:
    - '\Favorites'
    - '\Favourites'
    - '\Contacts'
    - '\Music'
    - '\Pictures'
    - '\Documents'
    - '\Photos'
  filter_main_windows_update:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\RunOnce\'
    Image|startswith: 'C:\Windows\SoftwareDistribution\Download\'
    Details|contains|all:
    - 'rundll32.exe '
    - 'C:\WINDOWS\system32\advpack.dll,DelNodeRunDLL32'
    Details|contains:
    - '\AppData\Local\Temp\'
    - 'C:\Windows\Temp\'
  filter_optional_spotify:
    Image|endswith:
    - 'C:\Program Files\Spotify\Spotify.exe'
    - 'C:\Program Files (x86)\Spotify\Spotify.exe'
    - '\AppData\Roaming\Spotify\Spotify.exe'
    TargetObject|endswith: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Run\Spotify'
    Details|endswith: 'Spotify.exe --autostart --minimized'
  condition: selection_target and (selection_suspicious_paths_1 or (all of 
    selection_suspicious_paths_user_* )) and not 1 of filter_main_* and not 1 of
    filter_optional_*
falsepositives:
- Software using weird folders for updates
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a new RUN key in the Windows Registry that points to executables located in paths typically associated with suspicious activity. These paths, such as temporary directories or default user directories, may indicate persistence mechanisms used by threat actors to maintain control over compromised systems. The likely attacker objective is to establish persistent malware execution. The relevant MITRE ATT&CK techniques for this behavior include Persistence (T1547.001).

  Primary telemetry sources include Windows Registry logs for changes to `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` and similar paths. The security impact of such activity is significant, as it can facilitate unauthorized code execution every time the user logs into the system. It is crucial to note that this detection does not confirm malicious intent on its own, as there may be legitimate applications that install in similar locations.

  ### Investigation Steps

  - **Identify the new RUN key creation:** Check Windows Registry logs for Event ID 4657 (a registry value was set) or Sysmon Event ID 13 (registry key and value). Focus on entries pointing to paths listed in suspicious paths.

  - **Verify the executable’s origin:** Investigate the file path indicated by the RUN key’s value. Legitimate software usually originates from trusted directories (e.g., `C:\Program Files`). Suspicious paths can include `C:\Users\Public\`, `C:\AppData\Local\Temp\`, and similar.

  - **Cross-reference with known software:** Compare the identified executable against a list of installed software using Event ID 4688 (process creation). Confirm if the executable is known/benign (check against reputable sources or internal whitelists).

  - **Evaluate the execution context:** For any newly created process, reference Sysmon Event ID 1 to analyze command-line parameters and parent processes. Look for unusual parent processes (e.g., `explorer.exe` launching a temp executable) which are indicative of an attack.

  - **Assess impact based on asset criticality:** Determine the role of the affected endpoint (e.g., server vs endpoint) and its access level. Higher criticality assets require immediate attention due to potential for greater damage.

  - **Review system for additional persistence mechanisms:** Check for other persistence methods (e.g., Scheduled Tasks, WMI persistence) on the system, which could indicate a broader compromise.

  ### Prioritization

  This alert should be considered high severity due to the potential for malicious persistence mechanisms across endpoints, particularly in critical systems where an attacker could maintain ongoing access. The likelihood of malicious abuses of RUN keys in suspicious directories is elevated, and similar techniques are frequently weaponized in various attack frameworks.

  ### Blind Spots and Assumptions

  Detection may be limited if the relevant logging is not enabled, particularly for registry changes. Various legitimate applications may also trigger this alert when installed to user-specific directories, leading to false positives. Companion detections could include monitoring for unusual Scheduled Task creations or WMI events (T1053, T1047) that might indicate additional persistence strategies employed by adversaries.

