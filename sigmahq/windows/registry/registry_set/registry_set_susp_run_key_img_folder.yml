title: New RUN Key Pointing to Suspicious Folder
id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
status: experimental
description: Detects suspicious new RUN key element pointing to an executable in
  a suspicious folder
references:
- https://www.fireeye.com/blog/threat-research/2018/08/fin7-pursuing-an-enigmatic-and-evasive-global-criminal-operation.html
- https://github.com/HackTricks-wiki/hacktricks/blob/e4c7b21b8f36c97c35b7c622732b38a189ce18f7/src/windows-hardening/windows-local-privilege-escalation/privilege-escalation-with-autorun-binaries.md
author: Florian Roth (Nextron Systems), Markus Neis, Sander Wiebing, 
  Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2018-08-25
modified: 2025-10-06
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_target:
    TargetObject|contains:
    - '\Software\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
    - '\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
  selection_suspicious_paths_1:
    Details|contains:
    - ':\Perflogs'
    - :\ProgramData'
    - ':\Windows\Temp'
    - ':\Temp'
    - '\AppData\Local\Temp'
    - '\AppData\Roaming'
    - ':\$Recycle.bin'
    - ':\Users\Default'
    - ':\Users\public'
    - '%temp%'
    - '%tmp%'
    - '%Public%'
    - '%AppData%'
  selection_suspicious_paths_user_1:
    Details|contains: ':\Users\'
  selection_suspicious_paths_user_2:
    Details|contains:
    - '\Favorites'
    - '\Favourites'
    - '\Contacts'
    - '\Music'
    - '\Pictures'
    - '\Documents'
    - '\Photos'
  filter_main_windows_update:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\RunOnce\'
    Image|startswith: 'C:\Windows\SoftwareDistribution\Download\'
    Details|contains|all:
    - 'rundll32.exe '
    - 'C:\WINDOWS\system32\advpack.dll,DelNodeRunDLL32'
    Details|contains:
    - '\AppData\Local\Temp\'
    - 'C:\Windows\Temp\'
  filter_optional_spotify:
    Image|endswith:
    - 'C:\Program Files\Spotify\Spotify.exe'
    - 'C:\Program Files (x86)\Spotify\Spotify.exe'
    - '\AppData\Roaming\Spotify\Spotify.exe'
    TargetObject|endswith: 'SOFTWARE\Microsoft\Windows\CurrentVersion\Run\Spotify'
    Details|endswith: 'Spotify.exe --autostart --minimized'
  condition: selection_target and (selection_suspicious_paths_1 or (all of 
    selection_suspicious_paths_user_* )) and not 1 of filter_main_* and not 1 of
    filter_optional_*
falsepositives:
- Software using weird folders for updates
level: high
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_susp_run_key_img_folder/info.yml
note: |
  ### Technical Context

  This Sigma rule detects the creation of a new RUN registry key in Windows that points to executables stored in suspicious directories. This behavior is typically indicative of an attacker attempting to establish persistence on a compromised system by ensuring their malicious software runs at startup. The relevant MITRE ATT&CK tactic is **Persistence**, specifically technique **T1547.001** (Registry Run Keys / Startup Folder).

  The primary telemetry source is Windows Registry logs, particularly those observing changes under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` or similar locations. If malicious, the presence of executables within folders like `C:\Temp` or `C:\ProgramData` can lead to unauthorized execution and control of the affected system. It is important to note that this detection does NOT confirm whether the executable is malicious; it only indicates that a potentially suspicious path has been used.

  ### Investigation Steps

  - **Review registry event IDs**: Check for Windows Security Event ID **4657** (A registry value was modified) and **Audit Registry** logs to confirm the addition of the RUN key at the specified path.

  - **Correlate paths with known indicators**: Analyze the `Details` field for any execution paths pointing to suspicious directories (e.g., `C:\Temp`, `C:\ProgramData`, or `C:\$Recycle.bin`). Legitimate software typically uses standard paths, so findings here may indicate potential malicious activity.

  - **Examine originating process details**: If possible, determine the parent process that created the RUN registry entry, focusing on Sysmon Event ID **1** (Process creation) for potential parent process anomalies or known malicious artifacts.

  - **Verify correct folder usage**: Cross-reference with recent software installations or updates. Legitimate applications may use unusual folders for temporary files; ensure these events are documented and aligned with expected operational behavior.

  - **Look for repeated behavior**: If multiple RUN keys are created within a short time frame or point to varying suspicious paths, this may signify automated or scripted activity by an attacker.

  - **Check for evasion signatures**: Be aware of evasion approaches where malicious executables may use seemingly benign or common file names or paths that mimic legitimate applications. Match against known whitelisted applications and ensure these flags are documented.

  ### Prioritization

  The alert severity is high due to the impact of any affected system being compromised and used as a foothold for further attacks. Such behavior is often leveraged by adversaries for persistence and is commonly weaponized in various attacks, increasing the likelihood of malicious abuse.

  ### Blind Spots and Assumptions

  Evasion techniques may include encoding or using legitimate software that is misconfigured to point to unusual paths, thereby triggering the alert. Detection relies on proper logging settings across registry modifications; ensure that registry auditing is enabled comprehensively. A legitimate scenario that could trigger this alert is the installation of software that uses non-standard paths for its execution, such as during software updates. Related detections may include monitoring for unauthorized process injections or monitoring file changes in directory paths that typically house legitimate applications.

