logsource:
  product: windows
  category: registry_set
detection:
  selection:
    Image|endswith: '\rundll32.exe'
  registry:
    TargetObject|contains: '\Control Panel\Desktop\SCRNSAVE.EXE'
    Details|endswith: '.scr'
  filter:
    Details|contains:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and registry and not filter
falsepositives:
- Legitimate use of screen saver
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of a registry key that configures a screensaver after the execution of a potentially malicious .scr file using `rundll32.exe`. Attackers may use this technique to establish persistence on a system, often following the execution of a trojanized screensaver for credential harvesting or remote access. The relevant MITRE ATT&CK tactic is **Persistence**, and the technique is **T1218.011** (Signed Binary Proxy Execution).

  The primary telemetry source is Windows registry logs relating to `registry_set` actions with specific focus on `TargetObject` and `Details` fields. The security impact of this behavior is significant as it may indicate an adversary gaining persistent foothold on a system. However, it is important to note that the detection does not confirm actual malicious intent, as legitimate screensaver configurations could trigger the same alert.

  ### Investigation Steps

  - **Review recent process executions:** Check for Event ID 4688 (Process Creation) or Sysmon Event ID 1 to identify `rundll32.exe` invocations. Look for instances where scripts or applications run .scr file from directories like `C:\Windows\System32\` or `C:\Windows\SysWOW64\`.

  - **Analyze registry changes:** Examine Windows registry logs for Event ID related to registry key changes. Focus on keys under `HKEY_CURRENT_USER\Control Panel\Desktop\SCRNSAVE.EXE`. Confirm whether the path listed in the `Details` field ends with a known malicious `.scr` file.

  - **Identify known-good behavior:** Validate normal user activity by checking for legitimate user configurations around screen savers, such as screensaver execution configurations commonly set in corporate environments. If the associated screensaver executable is one that is widely used (e.g., `C:\Windows\System32\scrnsave.scr`), then it may indicate benign behavior.

  - **Correlate with user context:** Review the user account associated with the registry modification. If the account has low privilege or was not expected to modify screensaver settings, raise the alert priority.

  - **Investigate runtime behavior:** If available, analyze Sysmon Event ID 11 (File Create) to identify if a malicious .scr file was created or executed in unusual contexts. Determine if this creation aligns with other indicators of compromise on the system.

  - **Cross-reference with threat intelligence:** Look for any reports on detected .scr files used in past attacks. This can help confirm if the executed screensaver file is related to known threats or campaigns.

  ### Prioritization

  This alert is of **medium severity**, primarily due to the potential for establishing persistence. The risk increases when the affected system is critical or hosts sensitive data. While masquerading behind screensaver executions is not common, recent attacks have enabled adversaries to use such techniques, warranting prompt investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of filtering rules that could exclude legitimate configurations. Legitimate activity (e.g., policy-configured screensavers) can trigger this rule, necessitating careful analysis. Ensure that registry logging is enabled to capture all relevant changes. Additionally, consider companion detections around scheduled tasks or abnormal file creations that might indicate broader persistence attempts. Implementing broader endpoint detection measures may enhance the effectiveness of identifying related malicious behavior.

