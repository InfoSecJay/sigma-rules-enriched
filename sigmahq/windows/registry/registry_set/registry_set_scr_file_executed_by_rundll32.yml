note: |
  ### Technical Context
  This rule detects the establishment of a registry key associated with the screen saver settings (SCRNSAVE.EXE) that may indicate the execution of a malicious screen saver file (.scr) via the Rundll32 utility. Attackers may utilize this technique as a means to execute arbitrary code while disguising the malicious activity as a legitimate screen saver installation. The likely objectives of such an attack include persistence on compromised systems or enabling further malicious actions under the guise of an innocuous task.

  Relevant MITRE ATT&CK tactics and techniques for this detection include:
  - **Tactic:** Defense Evasion
  - **Technique:** `T1218.011 - System Script Proxy Execution`

  The types of telemetry/log sources that will contain the best evidence include Windows registry set logs, which track modifications to registry keys, especially under the \Control Panel\Desktop path where screen saver settings are configured. Additionally, process creation events related to `rundll32.exe` can provide critical context to the execution of this potentially malicious behavior.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the Windows registry for modifications to the SCRNSAVE.EXE key under `HKEY_CURRENT_USER\Control Panel\Desktop` or similar paths to identify recent changes that coincide with the suspected execution of a .scr file.
  - **Analyze Process Creation Logs:** Investigate process creation events for `rundll32.exe` to determine the parameters and execution context, ensuring that the command did not invoke unexpected scripts or executable files.
  - **Correlate Event Timestamps:** Cross-reference the timestamps from the registry changes with other system logs to seek nonce events that could indicate lateral movement or further exploitation attempts around the same timeframe.
  - **Identify Related Services:** Look for new or modified services that may have been created to support the .scr file execution, which could indicate attempts to maintain persistence or escalate privileges.

  ### Prioritization
  The severity of this alert is medium due to the potential for evasive malware deployment and persistence through the manipulation of legitimate system behavior. The likelihood of exploitation using this technique is notable, particularly in environments where user-initiated downloads are common.

  ### Blind Spots and Assumptions
  This detection may not cover all instances of malicious activity, as it primarily focuses on specific registry modifications that could be triggered by legitimate behaviors, such as standard screen saver installations. The detection logic assumes that any legitimate usage of the screensaver feature uses common pathways and does not involve the manipulation of the registry under suspicious conditions. Proper logging configurations for Windows registry changes and process creation are essential for this alert to function effectively, and potential scenarios where users may legitimately change screensaver settings could lead to false positives.

