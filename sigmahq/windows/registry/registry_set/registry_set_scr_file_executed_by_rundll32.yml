detection:
  selection:
    Image|endswith: '\rundll32.exe'
  registry:
    TargetObject|contains: '\Control Panel\Desktop\SCRNSAVE.EXE'
    Details|endswith: '.scr'
  filter:
    Details|contains:
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
  condition: selection and registry and not filter
falsepositives:
- Legitimate use of screen saver
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the creation of a registry key that modifies screensaver settings, specifically when linked to the execution of a .scr file via `rundll32.exe`. This behavior suggests that an attacker may be attempting to install a malicious screensaver executable that could serve as a persistence mechanism or hide malicious activity. The relevant MITRE ATT&CK tactics include Defense Evasion (T1218.011).

  Primary telemetry sources include Windows registry logs, specifically looking for Event ID 4657, which indicates registry value modifications. If the activity is malicious, it may indicate an attempt to leverage a legitimate system functionality for deceptive purposes. However, this detection does NOT confirm that the screensaver is malicious on its own, as legitimate applications can also create similar registry entries.

  ### Investigation Steps

  - **Check for recent registry modifications: ** Review Windows Security Event ID 4657 for changes to key path `HKEY_CURRENT_USER\Control Panel\Desktop\SCRNSAVE.EXE`. Investigate any newly set values by unauthorized users or during odd hours.

  - **Correlate with process creation: ** Validate associated process creation using Windows Event ID 4688 for `rundll32.exe`. Investigate any command lines that include `.scr` file paths, particularly from suspicious or unexpected locations.

  - **Review legitimate use cases:** If detected on corporate systems, confirm if a legitimate screen saver is configured, particularly in environments where such settings are controlled by Group Policy. Identify systems with recent policy application relevant to screensaver settings.

  - **Analyze file execution paths:** Investigate the existence and properties of the .scr file in `C:\Windows\System32\` or `C:\Windows\SysWOW64\`. Validate file signatures and creation dates to ensure they align with expected software deployment.

  - **Monitor for repeated alerts:** Track if the same registry modification occurs frequently or from multiple endpoints, which may indicate a wider campaign or automated script execution rather than a singular legitimate change.

  - **Identify high-confidence malicious indicators:** Look for execution of `rundll32.exe` with arguments that include paths to known malicious .scr files or unusual parent processes that may indicate exploitation attempts (e.g., initiated from an email attachment or drive-by download).

  ### Prioritization

  This alert should be treated with medium urgency due to the potential security impact of a compromised system, particularly in enterprise environments where screensavers may be manipulated for malicious persistence. The technique of using a screen saver as a disguise for underlying malware is not uncommon, making it necessary to investigate further.

  ### Blind Spots and Assumptions

  Detection may be limited if proper registry log settings are not enabled, as not all endpoints may collect the necessary logs for comprehensive insight. Known evasion techniques could include legitimate user behavior triggering this alert, such as authorized screensaver installations or changes made by system administrators. A related detection could include monitoring unusual file creation associated with .scr files in system directories, strengthening overall detection capabilities.

