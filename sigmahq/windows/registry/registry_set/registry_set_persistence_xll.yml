note: |
  ### Technical Context

  This Sigma rule detects the creation of Excel Add-ins (XLL files) in the Windows registry, specifically monitoring for modifications that would cause these files to execute automatically upon launching Microsoft Excel. The likely objective of an attacker using this method is to establish persistence on the compromised system, allowing for repeated access or execution of malicious code whenever Excel is initiated. This behavior is associated with the MITRE ATT&CK tactic of Persistence, specifically technique T1137.006 (Office Add-ins).

  The primary telemetry sources involved in this detection are Windows Registry logs, particularly focusing on modifications to the path `Software\Microsoft\Office\Excel\Options`. If successful, this form of persistence can enable attackers to execute their payloads stealthily, significantly increasing the potential for a long-term foothold in the environment. Importantly, this detection does NOT confirm malicious activity on its own; additional context and investigation are required to determine the intent behind the registry changes.

  ### Investigation Steps

  - **Review registry modifications: ** Examine Windows Registry Event Logs for Event ID 4657 (Registry Value Modification) that note changes to `Software\Microsoft\Office\Excel\Options`. Look for entries where `TargetObject` includes the path mentioned in the rule.

  - **Identify legitimate use cases:** Determine whether there is a legitimate business reason for the modification. A common benign scenario could involve authorized IT staff making standard updates for organizational add-ins, which might involve `Details` entries indicating an XLL file used for legitimate business applications.

  - **Correlate file artifacts:** Check for the presence of the Excel Add-in file in the file system (XLL files). Confirm its existence in typical paths such as `C:\Program Files\Microsoft Office\root\OfficeXX\` or `C:\Users\<username>\AppData\Local\Microsoft\Excel\XLSTART\` that may not be associated with known business functions.

  - **Analyze the execution history:** Utilize Process Monitor or Sysmon logs to investigate if any processes (Event ID 1) are spawning Excel immediately after the registry modification. This can help identify malicious usage patterns prompted by these changes.

  - **Examine the source of modification:** Determine the user or process that triggered the registry change. Identify if it was a known administrator or if it correlates with unusual user activity, such as small script automation or exploitation of vulnerabilities.

  ### Prioritization

  The alert should be considered high severity as it targets a critical Microsoft Office application known for its widespread use and potential for exploitation. Given the ability of XLL files to execute code without user consent, the likelihood of abuse is significant, raising concerns over persistence mechanisms commonly deployed in attacks.

  ### Blind Spots and Assumptions

  The primary detection limitation is the reliance on registry modifications, which can be spoofed or cleared by attackers. Without comprehensive visibility into the entire environment, especially around user behavior, legitimate applications may occasionally trigger this alert, such as routine updates or the installation of new software. A related detection to bolster coverage would include monitoring for unusual file creation events, such as the creation of new XLL files in common directories via FileSystem logs (e.g., Sysmon Event ID 11).

