detection:
  selection:
    TargetObject|contains: 'Software\Microsoft\Office\'
    TargetObject|endswith: '\Excel\Options'
    Details|startswith: '/R '
    Details|endswith: '.xll'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of an Excel add-in (XLL) file aimed at establishing persistence on a Windows-based system. This behavior is often leveraged by threat actors to ensure their malicious code executes automatically whenever Excel is started, providing them a foothold within the environment. Attackers may utilize such methods to maintain access, execute arbitrary code, or manipulate Excel functionalities for further exploitation.

  The associated MITRE ATT&CK techniques for this persistence mechanism are found under **T1137.006 - Office Application Startup Folder**. This technique encompasses various ways an attacker can leverage Microsoft Office applications to achieve persistence, and the creation of an XLL file is a common tactic within this framework. Primary data sources for this detection include Windows registry logs that capture changes to the software-related entries, especially those pertaining to Microsoft Office applications.

  ### Investigation Steps
  - **Review Registry Logs**: Examine the Windows registry for the creation of entries under `Software\Microsoft\Office\Excel\Options` that contain the `TargetObject` specified in the detection rule.

  - **Assess Startup Configurations**: Check for the existence of XLL files and their configurations to ensure that they are authorized and legitimate. Validate the paths and execution details against known safe applications.

  - **Analyze Process Creation Events**: Investigate associated process creation logs to track any instances of Excel launching with unusual parameters or XLL files that were not previously observed in normal operations.

  - **Cross-reference with Threat Intelligence**: Use threat intelligence databases to validate the identified XLL files against known malware signatures or malicious actor tactics to determine if the behavior indicates an advanced persistent threat.

  ### Prioritization
  The severity of this alert is high due to the potential for significant impact if threat actors successfully establish persistence through the manipulation of legitimate applications like Excel. Given the commonality of Excel usage in enterprise environments, detecting such behavior is critical for early intervention and mitigation of further compromise.

  ### Blind Spots and Assumptions
  This detection logic is reliant on the assumption that registry logs are adequately captured and stored within the environment, specifically the entries surrounding Microsoft Office installations. Blind spots may exist if log retention policies are insufficient, resulting in the loss of relevant data. Additionally, the alert may not account for legitimate use cases of XLL files, which could lead to false positives if such files are part of an authorized business process. Proper logging configuration and oversight are necessary to ensure complete visibility and effective detection.

