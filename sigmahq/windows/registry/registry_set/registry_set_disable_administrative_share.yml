note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to system registry settings that disable the creation of administrative shares on Windows systems. These shares, such as C$ and ADMIN$, typically allow remote access and management, making them a target for attackers seeking to maintain persistence or escalate privileges. The likely objective of an adversary triggering this rule is to prevent legitimate administrative access while permitting their own remote exploitation. This behavior relates to the MITRE ATT&CK technique for "Indicator Removal on Host" (T1070.005).

  Primary telemetry sources include Windows Registry logs, specifically focusing on changes under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters`. The security impact could be significant, limiting the detection and response capabilities of administrative users and potentially allowing for extended unauthorized access. It is crucial to note this detection does NOT confirm that a compromise has occurred; rather, it indicates a change that requires further investigation.

  ### Investigation Steps

  - **Check the Registry Path for Modifications:** Review Windows Registry logs for changes under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters` (Event ID for Registry modifications). Look specifically for `AutoShareWks` and `AutoShareServer` settings showing a value of `0`, indicating shares are disabled.

  - **Identify the Account Responsible for Changes:** Cross-reference the change event with the Windows Security logs (Event ID 4663). Look for the user account that made the registry change, identifying if it is an administrative account or a potentially compromised account.

  - **Validate with Baseline Configurations:** Compare the current registry value against standard system configurations established for your environment. Legitimate systems typically have these shares enabled for administrative purposes.

  - **Analyze the Timing of Changes:** Review Event ID 5140 (Object Access) logs to understand when these registry changes occurred. Look for unusual access patterns or correlating events (such as logins from unfamiliar accounts or locations) preceding the registry changes.

  - **Correlate with Endpoint Behavior:** Examine processes running at the time of the registry modification using Sysmon Event ID 1 (Process Creation) to identify potential malicious executables associated with the change.

  - **Determine Potential for Evasion Techniques:** Note that malware could have automation to disable administrative share creation preemptively. Investigate any scripts or automation tools that could have inadvertently made these changes.

  ### Prioritization

  This alert has a medium severity level due to the potential impact on administrative functionalities and the high likelihood of exploitation in scenarios where adversaries seek to cover their tracks. The behavior is not commonly seen in benign administrative tasks, suggesting a need for further investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist as advanced adversaries might implement stealth techniques to modify registry settings without triggering alerts. Ensure that logging for Registry modifications is enabled enterprise-wide to avoid gaps in visibility. Legitimate software or maintenance tasks may also disable shares during updates or migrations. As a companion detection, consider monitoring for lateral movement activity alongside this rule to enhance situational awareness of potential compromise.

