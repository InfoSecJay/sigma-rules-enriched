note: |
  ### Technical Context
  This rule detects attempts to disable the creation of administrative shares on Windows systems. Administrative shares, such as C$ and ADMIN$, provide system administrators with remote access to disk volumes across the enterprise network. Attackers may leverage these shares to move laterally across a network, transfer tools, or exfiltrate data. Disabling these shares may indicate an attempt to hinder administrative activities or to conceal malicious actions from network defenders.

  The relevant MITRE ATT&CK tactic associated with this detection is **Defense Evasion** (TA0005), specifically the technique **Indicator Removal on Host** (T1070.005). Attackers may manipulate registry settings to remove or disable these shares to evade detection and control visibility over the system’s shared resources.

  Primary data sources for gathering evidence related to this detection include **Windows registry change logs** and **system event logs**. These logs can provide insight into modifications made to critical registry keys that control administrative share settings.

  ### Investigation Steps
  - **Review Registry Logs:** Analyze logs for changes to registry keys under `\Services\LanmanServer\Parameters\`, specifically looking for entries where `AutoShareWks` or `AutoShareServer` are set to `0`.
  - **Examine System Events:** Check Windows Event Logs for system events that correspond to changes in the share configuration, particularly events involving registry modifications.
  - **Monitor for Unusual Network Activity:** Investigate network traffic to identify any anomalous behavior indicative of lateral movement attempts or unexpected access to administrative shares.
  - **Conduct Audit of Shares:** Run a systematic audit of existing shares on critical systems to verify their current status and ensure compliance with enterprise security policies.

  ### Prioritization
  The alert is assigned medium severity due to its potential impact on maintaining secure administrative access within the enterprise. While disabling administrative shares can be a legitimate administrative action, it may also suggest an attempt to facilitate malicious activities by an insider or external threat actor.

  ### Blind Spots and Assumptions
  This detection rule assumes that the registry settings for administrative shares are not modified through legitimate administrative processes, which could generate false positives. Furthermore, detection coverage may be limited if logging for registry modifications is not enabled or if there are gaps in monitoring registry activity across all endpoints. It is necessary to ensure that logging is appropriately configured to capture these events for effective detection.

