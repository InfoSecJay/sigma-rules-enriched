  ### Technical Context

  This Sigma rule detects changes to Windows registry settings that disable administrative shares, specifically the settings located under `\Services\LanmanServer\Parameters\`. The behavior suggests an attacker is attempting to obscure their presence by preventing the creation of these default administrative share points, thereby limiting administrative remote access. The attacker likely aims to maintain persistence or cover their tracks after gaining access to a system.

  The relevant MITRE ATT&CK tactic is **Defense Evasion**, and the technique is **T1070.005: Indicator Removal on Host**. The primary telemetry sources include Windows Registry logs indicating changes to specific keys, particularly those related to administrative shares. If malicious, this action could significantly impact security, as it may render critical monitoring efforts ineffective, allowing continued unauthorized access.

  This detection does NOT confirm malicious activity on its own, as there are legitimate scenarios where an administrator might disable these shares for security hardening.

  ---

  ### Investigation Steps

  - **Review the registry changes:** Check for registry modifications under `HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services\LanmanServer\Parameters\`. Look specifically for the `AutoShareWks` and `AutoShareServer` keys being set to `0`. Legitimate activity may involve documented administrative changes for security purposes.

  - **Correlate timestamps with user activity:** Analyze the logs around the time of the change for actual user logins (Security Event ID 4624) to identify if this registry change corresponds with known administration tasks or unexpected behavior.

  - **Inspect for additional suspicious changes:** Look for other registry keys related to security and administrative access, such as `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System` for settings like `EnableLUA`.

  - **Validate system roles:** Verify host roles; if the impacted system plays a critical role (e.g., Domain Controller or File Server), any unauthorized disabling of administrative shares should escalate to a high priority.

  - **Identify abnormal remote access patterns:** Analyze network logs for unusual access patterns or failed connection attempts to administrative shares from unexpected IP addresses or accounts (e.g., check for anomalous SMB traffic).

  - **Document legitimate administrative behaviors:** Ensure that all registry changes are backed by proper documentation. Regular administrative activities should follow established protocols; any deviations or undocumented changes should be flagged for further investigation.

  ---

  ### Prioritization

  The severity of this alert is medium due to the potential impact on system management and monitoring. Disabling administrative shares is a common tactic employed by attackers to evade detection and maintain access. However, it can also occur in legitimate remediation efforts, requiring context for accurate prioritization.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative actions may trigger this alert, leading to false positives. Reliable detection hinges on consistent Registry logging configuration; ensure audit policy settings are in place. Additionally, similar behavior might be seen during legitimate system hardening efforts. To strengthen detection coverage, consider implementing alerts for failed administrative actions or unauthorized changes to User Access Control policies (MITRE ATT&CK technique T1088: Bypass User Account Control).

