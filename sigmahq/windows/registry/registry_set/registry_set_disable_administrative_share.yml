note: |
  ### Technical Context

  This Sigma rule detects the modification of registry keys associated with administrative shares, specifically the disabling of `AutoShareWks` and `AutoShareServer` at system startup. This behavior typically indicates an attempt by an attacker to hide their actions or reduce risk of exposure by disabling administrative network shares that could allow remote access. The relevant MITRE ATT&CK tactic is **Defense Evasion** (T1070.005).

  The primary telemetry source for this detection is Windows registry change logs, specifically targeting the registry path `\Services\LanmanServer\Parameters\`. If successful, this modification could significantly impact security by limiting legitimate administrative access, thereby enabling persistent and covert malicious activities. Importantly, this detection does not, on its own, confirm malicious intent; disabling administrative shares can also be a part of standard operating procedure or security hardening.

  ### Investigation Steps

  - **Review registry modification logs:** Check for Event ID 4657 in Security logs to identify changes made to the registry keys `\Services\LanmanServer\Parameters\AutoShareWks` or `AutoShareServer`. Legitimate changes may include re-enabling these shares for system management.

  - **Correlate with recent user activity:** Investigate the user account performing the registry modification by looking at Event ID 4660 (object deletion) and 4663 (access to an object) in Security logs. Any unexpected accounts, particularly non-administrative users, raise suspicion.

  - **Validate system roles and configurations:** Ensure the system is intended to have administrative shares. On a workgroup machine or in isolated environments, these shares might be disabled for compliance or isolation, indicating benign behavior.

  - **Identify concurrent suspicious actions:** Check for related behaviors, such as unusual service installations or account creations, using Sysmon Event ID 1 (Process Creation). Look for processes that could indicate lateral movement or backdoor establishment.

  - **Look for evidence of lateral movement:** Investigate the presence of remote access tools (RATs) or anomalous SMB connections initiated after the registry change. Review System logs for unexpected inbound connections.

  ### Prioritization

  This alert should be treated with medium severity given the critical nature of administrative shares in an enterprise environment. The likelihood of abuse is moderate, as disabling these shares may be part of tactics used by adversaries to establish persistence or evade detection during an attack.

  ### Blind Spots and Assumptions

  Limitations of this detection include evasion techniques like using legitimate administrative tools to modify settings without triggering alerts. It relies heavily on accurate log collection from the Windows registry; if these logs are not preserved or monitored, detection may fail. Common legitimate activities might involve system administrators disabling shares to tighten security in response to specific threats. A related detection to strengthen coverage would be monitoring for changes in Group Policies affecting administrative shares, which could provide further insight into the environment's security posture.

