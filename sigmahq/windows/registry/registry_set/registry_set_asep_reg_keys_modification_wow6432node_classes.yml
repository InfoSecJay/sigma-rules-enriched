  type: obsolete
status: test
description: Detects modification of autostart extensibility point (ASEP) in registry.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin,
  oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  wow_classes_base:
    TargetObject|contains: '\Software\Wow6432Node\Classes'
  wow_classes:
    TargetObject|contains:
    - '\Folder\ShellEx\ExtShellFolderViews'
    - '\Folder\ShellEx\DragDropHandlers'
    - '\Folder\ShellEx\ColumnHandlers'
    - '\Directory\Shellex\DragDropHandlers'
    - '\Directory\Shellex\CopyHookHandlers'
    - '\CLSID\{AC757296-3522-4E11-9862-C17BE5A1767E}\Instance'
    - '\CLSID\{ABE3B9A4-257D-4B97-BD1A-294AF496222E}\Instance'
    - '\CLSID\{7ED96837-96F0-4812-B211-F13C24117ED3}\Instance'
    - '\CLSID\{083863F1-70DE-11d0-BD40-00A0C911CE86}\Instance'
    - '\AllFileSystemObjects\ShellEx\DragDropHandlers'
    - '\ShellEx\PropertySheetHandlers'
    - '\ShellEx\ContextMenuHandlers'
  filter:
    Details: '(Empty)'
  condition: wow_classes_base and wow_classes and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This rule detects modifications to the autostart extensibility point (ASEP) in the Windows registry, particularly within the `Wow6432Node` section. These modifications may indicate attempts by malware to establish persistence or execute malicious payloads each time a user runs a certain application or logs into the system. Attackers often target the registry to maintain control over compromised systems, thus achieving their objective of long-term access or to execute malicious activities automatically.

  The relevant MITRE ATT&CK techniques associated with this detection include **T1547.001: Registry Run Keys / Startup Folder**, which focuses on the methods an attacker might use to persist across reboots and facilitate their activities without user intervention. This technique is part of the broader tactics of **Persistence** and **Privilege Escalation**, reflecting how adversaries aim to retain access and control over a system.

  The primary data source for detecting these events includes **Windows registry logs** that monitor changes in the registry's autostart locations. Additionally, monitoring processes that commonly interact with these registry keys can be valuable for corroborating the identified modifications as potential indicators of compromise (IoCs).

  ### Investigation Steps
  - **Collect Registry Event Logs**: Gather Windows registry change logs focusing on the `\Software\Wow6432Node\Classes` area to check for any recent modifications in the relevant autorun keys.
  - **Review Recent Process Activities**: Analyze the process creation events around the time of the registry key modification to identify any potentially malicious executions or unusual behavior.
  - **Examine User and Administrator Actions**: Investigate user accounts that made these registry changes, assessing whether these actions were taken by legitimate administrators or potentially compromised accounts.
  - **Cross-reference with Known Good Entries**: Compare the modified registry entries against documented legitimate entries to help determine if any suspicious modifications align with known malware signatures or behaviors.

  ### Prioritization
  The severity of this alert is medium due to the potential for both persistence and privilege escalation. While legitimate software can modify autorun keys during installation, unauthorized changes could indicate an active compromise, making prompt investigation critical.

  ### Blind Spots and Assumptions
  There may be gaps in detection if registry modification logs are not being collected or if sufficient monitoring of process creation events is absent. The detection logic assumes that malicious modifications will not be accompanied by useful details, thus filtering out empty changes. Additionally, effective logging configurations of the Windows registry are essential for this alert to function, and if such logs are not enabled, the detection will fail to capture relevant activities effectively.

