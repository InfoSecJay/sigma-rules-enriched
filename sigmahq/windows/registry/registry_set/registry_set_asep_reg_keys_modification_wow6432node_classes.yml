logsource:
  category: registry_set
  product: windows
detection:
  wow_classes_base:
    TargetObject|contains: '\Software\Wow6432Node\Classes'
  wow_classes:
    TargetObject|contains:
    - '\Folder\ShellEx\ExtShellFolderViews'
    - '\Folder\ShellEx\DragDropHandlers'
    - '\Folder\ShellEx\ColumnHandlers'
    - '\Directory\Shellex\DragDropHandlers'
    - '\Directory\Shellex\CopyHookHandlers'
    - '\CLSID\{AC757296-3522-4E11-9862-C17BE5A1767E}\Instance'
    - '\CLSID\{ABE3B9A4-257D-4B97-BD1A-294AF496222E}\Instance'
    - '\CLSID\{7ED96837-96F0-4812-B211-F13C24117ED3}\Instance'
    - '\CLSID\{083863F1-70DE-11d0-BD40-00A0C911CE86}\Instance'
    - '\AllFileSystemObjects\ShellEx\DragDropHandlers'
    - '\ShellEx\PropertySheetHandlers'
    - '\ShellEx\ContextMenuHandlers'
  filter:
    Details: '(Empty)'
  condition: wow_classes_base and wow_classes and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the Windows registry under the `Wow6432Node\Classes` path, which is commonly used for establishing Autorun settings for various applications. Attackers may exploit this to maintain persistence on compromised systems or escalate privileges by registering malicious shell extensions or handlers. The relevant MITRE ATT&CK techniques are Persistence (T1547.001) and Privilege Escalation (T1068). Primary telemetry sources include Windows Registry logs and Sysmon events capturing registry changes. If malicious, alterations to these keys can allow for unauthorized access and execution of malicious code. However, this detection does NOT confirm that the changes are malicious or provide context on how they were executed.

  ### Investigation Steps

  - **Review the registry entries modified:** Examine Windows Registry logs for the exact keys changed. Look for Event ID 4657 in Security logs or Sysmon Event ID 10 for registry key modifications, focusing on the paths stated in the Sigma rule. Malicious modifications will typically involve shell extension handlers not associated with known, legitimate applications.

  - **Identify the source of modifications:** Check for the process or user account that made the registry change. Use Sysmon Event ID 10 to correlate changes with parent processes. Legitimate installations will often occur during standard application setups by known vendors.

  - **Search for unusual parent process origins:** Evaluate the parent process of any suspicious creation or modification. Use Sysmon Event ID 4656/10 combined with Event ID 4688 for process creation to verify if changes originated from unusual or non-administrative accounts.

  - **Validate installation context:** Determine whether these changes coincide with legitimate software installations or updates. Use installation logs or recent software deployments to cross-reference legitimate activity, which may include benign modifications of autorun keys by recognized applications.

  - **Check for multiple modifications:** Look for a series of modifications to related keys at similar timestamps, indicative of a potential attack. If modified keys (e.g., for context menu handlers) also reference unfamiliar CLSIDs (e.g., `{AC757296-3522-4E11-9862-C17BE5A1767E}`), this is a high-confidence indicator of malicious intent.

  - **Assess recent system changes:** Examine the system for other indicators of compromise, including unusual startup programs or persistent processes suggested by automation tools like Autoruns. Refer to logs for any preload or startup entries that are not normally seen in standard configurations.

  ### Prioritization

  This alert has medium severity as it may indicate an attempt to achieve persistence or escalate privileges, impacting critical systems. The likelihood of malicious abuse is moderate, given that modifications to such registry paths are common in malicious activities, though not limited to them. Variability in legitimate activities may obscure detection.

  ### Blind Spots and Assumptions

  Detection limitations exist as legitimate software installations can trigger this alert by modifying autorun keys. Logs from Windows Registry must be configured correctly to capture relevant modifications effectively. Also, benign administrative actions, such as software installations or updates, may lead to similar alerts. A related detection for credential dumping (T1003) could strengthen coverage on persistence mechanisms by providing additional context on user credential usage related to modifications.

