logsource:
  category: registry_set
  product: windows
detection:
  wow_classes_base:
    TargetObject|contains: '\Software\Wow6432Node\Classes'
  wow_classes:
    TargetObject|contains:
    - '\Folder\ShellEx\ExtShellFolderViews'
    - '\Folder\ShellEx\DragDropHandlers'
    - '\Folder\ShellEx\ColumnHandlers'
    - '\Directory\Shellex\DragDropHandlers'
    - '\Directory\Shellex\CopyHookHandlers'
    - '\CLSID\{AC757296-3522-4E11-9862-C17BE5A1767E}\Instance'
    - '\CLSID\{ABE3B9A4-257D-4B97-BD1A-294AF496222E}\Instance'
    - '\CLSID\{7ED96837-96F0-4812-B211-F13C24117ED3}\Instance'
    - '\CLSID\{083863F1-70DE-11d0-BD40-00A0C911CE86}\Instance'
    - '\AllFileSystemObjects\ShellEx\DragDropHandlers'
    - '\ShellEx\PropertySheetHandlers'
    - '\ShellEx\ContextMenuHandlers'
  filter:
    Details: '(Empty)'
  condition: wow_classes_base and wow_classes and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ---

  ### Technical Context

  This detection identifies modifications to Windows registry keys associated with autostart extensibility points (ASEPs), specifically within the `Wow6432Node` path. Attackers often manipulate these keys to ensure persistence or establish malicious behavior during system startup or user login. Relevant MITRE ATT&CK tactics include "Persistence" (TA0003) and "Privilege Escalation" (TA0004), with the specific technique being "Windows Registry Run Keys / Startup Folder" (T1547.001). The primary telemetry sources are Windows Registry Set logs, which record changes made to registry entries, specifically under the `HKLM\SOFTWARE\Wow6432Node\Classes`.

  A successful modification could enable an attacker to execute arbitrary code every time the system starts, compromising security. However, this detection does not confirm that the modification is inherently malicious, as legitimate applications or administrative actions can also trigger the same registry changes.

  ---

  ### Investigation Steps

  - **Review the specific keys modified:** Check for changes in registry keys under `HKLM\SOFTWARE\Wow6432Node\Classes` using Security Event ID 4663 (Audit Registry) to verify the modification details and timestamps. Look for unusual entries or modifications related to non-standard applications.

  - **Compare against known legitimate software:** Research the modified keys to determine if they are associated with legitimate software installations or updates, particularly searching for recent software installations or updates that would explain these autorun changes.

  - **Identify high-confidence malicious indicators:** Look for known malicious CLSIDs (e.g., `{7ED96837-96F0-4812-B211-F13C24117ED3}`) or modifications made by processes with suspicious parent processes, using Sysmon Event ID 1 (Process Creation) to cross-reference with the registry changes.

  - **Cross-check user and system impact:** Analyze user behavior and access logs such as Windows Event ID 4624 (Logon) to identify who made the changes and if the account should have made such modifications. Indications of unauthorized access (like new or unusual logins) should be flagged.

  - **Evaluate system role and criticality:** Consider the system’s role within the enterprise (e.g., server vs. client machine) to assess the impact of these registry changes. Changes on high-value assets may necessitate immediate incident response.

  - **Validate file creation or execution artifacts:** Monitor for the execution of newly created programs linked to modified autorun keys, particularly within the specific paths linked to the changes, utilizing Windows Event ID 4688 (Process Creation) to spot any new or modified binaries.

  ---

  ### Prioritization

  This alert should be considered medium severity due to the potential for persistence and privilege escalation through unauthorized registry modifications. Given the common target nature of registry autorun keys, there is a reasonable likelihood of malicious exploitation, warranting timely investigation.

  ---

  ### Blind Spots and Assumptions

  This detection may miss obfuscation or legitimate administrative actions that also modify these registry settings, possibly leading to false positives. Rich logging at the system level must be enabled to ensure reliable detection, including auditing on registry access. Legitimate software installations, especially those executed via third-party installers, can trigger this alert. Companion detections, such as monitoring unusual process creations (Sysmon Event ID 1) that correlate with autorun key modifications, enhance the overall detection capability.

