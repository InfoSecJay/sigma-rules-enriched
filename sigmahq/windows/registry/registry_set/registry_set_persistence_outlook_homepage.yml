  ### Technical Context

  This Sigma rule detects registry modifications that set a malicious home page for Microsoft Outlook by altering the WebView keys within the Windows registry. Attackers may exploit this behavior to establish persistence by executing unauthorized scripts or redirecting user sessions, ultimately aiming to exfiltrate data or facilitate further attacks.

  The relevant MITRE ATT&CK techniques include "Component Object Model Hijacking" (T1112) and "Persistence" (T1547). The primary telemetry source comes from Windows registry changes, specifically capturing any modifications involving the `HKEY_CURRENT_USER\Software\Microsoft\Office` and `HKEY_CURRENT_USER\Outlook\WebView` paths to detect unauthorized home page settings. If malicious, this behavior can compromise user environments, potentially leading to data theft or credential harvesting.

  However, the detection does NOT confirm that the activity is malicious on its own, as legitimate users may modify these registry keys for valid purposes, such as organizational policy updates or user preferences.

  ### Investigation Steps

  - **Identify the registry change:** Review the Windows Security Event ID 4657 for the registry key changes related to `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\WebView\URL`. Look for anomalous entries or modifications that deviate from expected values based on organizational policies.

  - **Correlate with usage patterns:** Validate against legitimate user behavior by checking prior registry settings and usage patterns. Confirm if the affected Outlook accounts have recently been modified or accessed significantly by users.

  - **Monitor user sessions:** Look at the Outlook session logs and correlate them with any recent suspicious login attempts or unusual access patterns. Review logs from `Event ID 4624` (successful login) and `Event ID 4625` (failed login) for the affected user.

  - **Check for URL links:** Examine the actual URLs mapped in the registry changes. Cross-reference them with known malicious domains or external sites that are unusual for legitimate Outlook usage.

  - **Consider valid modifications:** Investigate if the user or administrator has made authorized changes to functionalities. Compare the impacted registry settings against documentation for legitimate enterprise configurations that involve Outlook home page settings.

  - **Review companion detections:** Look for related detections, such as unusual script executions (e.g., via Event ID 4688) that might indicate malicious payloads triggered by altered registry settings. Investigate if any other similar registry keys were changed that indicate a broader persistence technique being used.

  ### Prioritization

  This alert should be treated with high priority as it involves potential persistence mechanisms that can grant attackers continued access and control over affected systems. The likelihood of malicious exploitation is significant, especially given the common practice for attackers to manipulate email clients for phishing or credential theft.

  ### Blind Spots and Assumptions

  Limitations of the detection may include legitimate software updates or configurations that inadvertently modify these registry keys, which may lead to false positives. Required log sources include comprehensive registry monitoring configurations to ensure consistent visibility. Additionally, be aware that similar legitimate administration activity, like configuring centralized settings for Outlook, may trigger this alert. A related detection to improve coverage would include monitoring for unusual modifications in `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall`, which may also indicate persistence attempts.

