note: |
  ### Technical Context

  This Sigma rule detects modifications to the Outlook home page settings through changes to specific registry keys related to the WebView. Attackers may use this method to achieve persistence by configuring a malicious webpage to execute code when a user accesses their Outlook application. The likely objective of the attacker is to maintain a foothold in the environment, delivering malware or exfiltrating data. This behavior aligns with the MITRE ATT&CK technique of Persistence (T1112).

  Primary telemetry sources include Windows registry event logs, specifically focusing on registry key changes under `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\WebView`. If an attacker successfully modifies these settings, it could lead to unauthorized remote code execution or data exfiltration, significantly compromising the affected system's integrity. However, this detection does NOT confirm malicious intent on its own, as legitimate changes may also take place.

  ### Investigation Steps

  - **Review registry modification logs:** Check for Event ID 4657 in Security logs to identify when the registry key `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\WebView\URL` was changed. Malicious changes often contain unusual or suspicious URLs that do not align with organizational use.

  - **Identify the user account involved:** Analyze Event ID 4624 for successful logins to determine which user account made the registry modification. If the account is a service or administrative account making unexpected changes, it may indicate compromise.

  - **Validate legitimate usage patterns:** Understand the normal usage of Outlook within your organization. For instance, if multiple users frequently set their home page to a corporate URL for Outlook plugins, this behavior may not be malicious. Compare with the organization's approved settings.

  - **Correlate with other suspicious activity:** Cross-reference with any other alerts, especially those related to persistence or command-and-control activities. For example, if you see associated events with suspicious outbound connections, it strengthens the case for malicious intent.

  - **Check for related detections or alerts:** Look for other detections like `Registry Modification` under suspicious context or alerts pertaining to web traffic to the modified URL that can indicate malicious actions.

  ### Prioritization

  This alert should be considered high severity, particularly if it involves make changes to systems containing sensitive data or if it affects users with administrative privileges. The likelihood of malicious abuse is elevated due to the ease with which attackers can set up persistent access through these modifications, which are a known tactic in various attack campaigns.

  ### Blind Spots and Assumptions

  The detection may be circumvented if the attacker employs alternate methods that do not involve the registry or utilizes encryption for remote communications, resulting in more stealthy persistence. Reliable detection requires proactive logging of registry changes, which may not be enabled on all systems. Legitimate users may modify these settings for valid reasons, like setting a common homepage for organizational productivity. Companion detections such as those monitoring network traffic or file creation events can provide additional context to assess the broader scope of potential malicious activity.

