note: |
  ### Technical Context

  This rule detects modifications to the registry keys associated with Outlook's home page functionality, specifically targeting the WebView URL settings. By altering these keys, an attacker can achieve persistence, enabling the execution of malicious code each time Outlook is launched. The likely objective is to establish a covert Command and Control (C2) channel or execute payloads that could be used for further exploitation or data exfiltration. This detection corresponds to the MITRE ATT&CK technique T1112 - "Modify Registry" within the persistence tactic.

  The primary telemetry source for this detection is Windows Registry modifications, specifically monitoring changes categorized under `registry_set` logs. If malicious, this persistence mechanism poses a significant security risk as it can allow attackers to maintain access even after a system reboot. It is crucial to note that this detection does not confirm malicious intent on its own; legitimate administrative activities may occasionally involve similarly modifying registry keys.

  ### Investigation Steps

  - **Review registry change logs:**
    Check Windows Event ID 4657 (Registry Value Modified) for any entries that match the `TargetObject` filter, specifically those containing `\Microsoft\Office\` and `\Outlook\WebView\URL`. Look for values that point to unusual or suspicious URLs.

  - **Identify legitimate Outlook configurations:**
    Analyze historical registry entries for Outlook (particularly the same registry path) to determine baseline configurations. Compare against current settings to identify anomalies. Common legitimate URLs often point to internal documentation or corporate sites.

  - **Correlate with user behavior:**
    Validate user access and modification history. Review relevant User Account and Activity logs to see if the modifications were made during legitimate user sessions or correspond with anomalous account activities.

  - **Flag high-confidence malicious indicators:**
    Look for URLs in the modified registry keys that are known to be associated with known malware C2 infrastructures or malicious payload delivery services. Use threat intelligence feeds to match these patterns.

  - **Check for other obfuscation techniques:**
    Look for signs that the attacker may be using additional persistence methods, such as setting HTTP/S proxies or other unconventional registry modifications in the same path. Identify logs for Event ID 7045 (Service Installed) that may suggest coinciding malicious activity.

  ### Prioritization

  This alert is of high severity due to the potential impact of the affected systems, often critical business applications like Outlook. The likelihood of exploitation is considerable, as the behavior is a well-documented technique used by various threat actors to establish persistence. Similar registry modifications are frequently weaponized in attacks.

  ### Blind Spots and Assumptions

  Detection limitations may arise from obfuscation or indirect modifications that do not trigger this rule. For instance, attackers may use scripts to interact with the registry in ways that evade standard detection methods. Ensure that registry audit policies are correctly configured to capture all relevant modifications to the targeted keys. Additionally, legitimate administrative tasks by IT could prompt this alert, so context is critical. A companion detection to strengthen coverage could involve monitoring changes to the overall `Software\Microsoft\Windows\CurrentVersion\Run` key, as this can further highlight persistence strategies used alongside Outlook customization.

