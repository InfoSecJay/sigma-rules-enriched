  ---

  ### Technical Context

  This Sigma rule detects potential persistence mechanisms where an attacker alters the Outlook home page settings by modifying specific WebView registry keys. This behavior is linked to gaining long-term access to resources by embedding malicious URLs in Outlook, allowing unauthorized code execution when the application is launched. The relevant MITRE ATT&CK tactic is Persistence (TA0003), specifically targeting the Registry Modification technique (T1112).

  The primary telemetry source for this detection includes Windows Registry change logs focusing on the manipulation of keys under `\Software\Microsoft\Office\Outlook\WebView\`. If malicious, this could allow attackers to execute persistent payloads whenever Outlook is accessed by a victim. Importantly, this detection does NOT confirm that an attack is in progress; it indicates suspicious activity that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review Registry Changes**: Investigate Registry Event logs (Event ID 4657) focusing on changes to `\Software\Microsoft\Office\Outlook\WebView\URL`. Check for unusual or unknown URLs that deviate from legitimate enterprise practices.

  - **Check User Accounts**: Validate the account that initiated the registry change. If it’s an unexpected or administrative account, that may warrant further scrutiny. Focus on Event ID 4624 to track logon activities.

  - **Identify Legitimate Usage**: Determine normal user activity for the affected Outlook instance. Evaluate whether users typically set a home page and cross-reference with Event ID 4648 to see if there are authorized administrative actions that correspond to changes in registry keys.

  - **Analyze Outlook Behavior**: Look at Outlook processes in Task Manager for any unexpected execution patterns that may correlate with the registry change. Monitor for unusual command-line arguments or processes with Event ID 4688.

  - **Correlate with Other Alerts**: Identify any other concurrent alerts, such as those related to suspicious PowerShell commands or known Remote Access tools. Analyzing these can provide a broader context for the suspected registry change.

  ---

  ### Prioritization

  This alert should be treated as high severity due to its potential impact on compromised systems and the likelihood that such persistence mechanisms are part of larger malicious campaigns. The behavior described in the rule is weaponized in targeted attacks to maintain access to victim environments.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the proper configuration and retention of Windows Registry logs. Evasion techniques may include legitimate user settings changes made by non-malicious users. Also, organizational policies may allow modifications that could trigger this alert. Companion detections such as monitoring for outbound connections initiated by Outlook or suspicious URL patterns would strengthen the overall detection strategy.

