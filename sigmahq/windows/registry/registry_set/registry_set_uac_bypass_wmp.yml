  ### Technical Context

  This Sigma rule detects attempts to bypass User Account Control (UAC) via manipulation of the Windows Media Player application, specifically through the modification of registry keys related to the osksupport.dll. The likely attacker objective is to achieve privilege escalation, allowing unauthorized actions at a higher privilege level. This behavior aligns with the MITRE ATT&CK technique: "Bypass User Account Control" (T1548.002).

  The primary telemetry sources for this detection are Windows registry event logs, specifically monitoring changes to the key located at `SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Compatibility Assistant\Store`. If this activity is malicious, it could allow an attacker to gain elevated privileges and execute malicious commands undetected. However, this detection does NOT confirm the execution of a malicious payload by itself—it solely indicates potential preparations for a UAC bypass.

  ### Investigation Steps

  - **Examine Registry Modifications:** Review registry changes targeting the path `SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Compatibility Assistant\Store` for Event ID 4657. Look for the specific value `C:\Program Files\Windows Media Player\osk.exe`. Changes to this key by non-administrative users are suspicious.

  - **Identify Recent Process Creations:** Check for recent execution of `osk.exe` by investigating Security Event ID 4688 (Process Creation) and correlate this with the registry change. Look for parent-child relationships—if `osk.exe` was executed by an unexpected parent process, this may indicate malicious intent.

  - **Search for Known Malicious Indicators:** Investigate for the presence of UAC bypass tools or frameworks commonly associated with this technique, such as `UACMe`, on the system. Use file integrity monitoring for changes to `osk.dll` or other related binary data.

  - **Assess Legitimate User Behavior:** Identify legitimate usages of Windows Media Player on affected systems. Check user and asset roles to validate normal operation, and look for patterns that align with common media usage (i.e., playback or updates).

  - **Cross-reference Elevated Actions:** Investigate any elevated actions (Event ID 4672) coinciding with the time of the registry modification. These elevated permissions can help confirm if the system was compromised.

  ### Prioritization

  This alert is high priority due to the potential impact on system integrity if UAC is bypassed. The likelihood of malicious exploitation is significant as this technique is commonly weaponized by attackers for privilege escalation during intrusions.

  ### Blind Spots and Assumptions

  Detection may not capture all instances of legitimate application usage that modify registry keys, leading to false positives. Ensure that registry audit settings are properly configured for comprehensive monitoring. Additionally, user actions involving legitimate system modifications may trigger this alert, such as application updates. A companion detection such as monitoring for unusual parent-child process relationships can strengthen overall coverage against this attack vector.

