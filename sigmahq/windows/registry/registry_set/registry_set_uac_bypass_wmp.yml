  ### Technical Context

  This rule detects modification to a specific Windows registry key associated with the bypass of User Account Control (UAC) using Windows Media Player's `osk.exe`. An attacker leveraging this technique typically aims to escalate privileges or execute arbitrary code without triggering the user's consent, gaining higher access than previously granted. This detection corresponds to MITRE ATT&CK technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control).

  The primary telemetry source for this detection is the Windows registry logs, specifically looking for entries indicating changes to the App Compatibility flags related to `osk.exe`. If this behavior is malicious, it potentially allows an attacker to run malicious software with elevated privileges, compromising the integrity and confidentiality of the system. However, this detection does NOT confirm that an attack is occurring; it merely indicates that a potentially suspicious change has been made to the registry.

  ### Investigation Steps

  - **Review Registry Changes:** Check the registry value for `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Compatibility Assistant\Store\C:\Program Files\Windows Media Player\osk.exe` in Windows Event Logs (Event ID 4657) to see details of the modification, including the user account that made the change.

  - **Evaluate User Activity:** Examine user activity logs, especially focusing on Event ID 4624 (Logon) for the account that made the registry change. Validate whether this account has a history of administrative tasks or unexpected login patterns, indicating potential misuse.

  - **Analyze Running Processes:** Check active processes to find instances of `osk.exe` and their parent processes using Sysmon Event ID 1. A legitimate `osk.exe` process usually originates from user-initiated actions, whereas unexpected parent-child process relationships may indicate malicious behavior.

  - **Identify Related File Creation:** Search for related files created around the time of the registry change by checking Process Creation logs (Event ID 4688) to understand what processes were spawned. Look for any unknown or suspicious executables that may indicate exploit.

  - **Investigate Legitimate Use Cases:** Determine if Windows Media Player was recently opened by the user, or if there are known legitimate uses for UAC bypass techniques in your environment, such as administrative tasks that may have triggered this legitimate action.

  ### Prioritization

  The high severity of this alert is justified as this behavior can indicate a serious threat to system integrity and security. The affected systems, particularly those with administrative privileges or sensitive data, could be exploited, making this a critical alert. UAC bypass techniques are frequently weaponized in attacks, emphasizing the need for swift investigation.

  ### Blind Spots and Assumptions

  This detection may have limitations due to user behavior that legitimately modifies registry keys for software compatibility. Success in detecting this behavior relies on consistent and complete logging of registry changes. Situations where legitimate applications attempt similar registry modifications may lead to false positives. A related detection to consider is monitoring for privilege escalation activities using Sysmon (Event ID 10), which can provide further context when combined with this alert.

