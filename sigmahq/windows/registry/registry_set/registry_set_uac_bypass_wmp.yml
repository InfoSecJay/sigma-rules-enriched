note: |
  ### Technical Context
  This detection rule identifies potential User Account Control (UAC) bypass attempts utilizing the `osksupport.dll` from Windows Media Player, which is associated with the UACMe exploit framework. Attackers may employ UAC bypass techniques to escalate privileges on Windows systems, potentially leading to unauthorized administrative access and execution of malicious payloads. By manipulating registry settings, particularly focusing on the compatibility flags for legitimate applications, an attacker can disable the security functionality that UAC provides.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Defense Evasion (T1560)**: Exploiting UAC to bypass security controls
  - **Privilege Escalation (T1548.002)**: Utilizing an exploit against UAC mechanisms for elevated rights

  The primary data sources for this detection are registry change logs, specifically those capturing modifications to the `HKEY_LOCAL_MACHINE` hive related to application compatibility settings. Additional relevant sources might include process creation events to correlate with unexpected launches of `osk.exe`.

  ### Investigation Steps
  - **Review Registry Logs**: Examine logs for changes to the `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Compatibility Assistant\Store` path, especially entries involving `osk.exe`.

  - **Analyze Process Creation Events**: Look for unusual or unexpected execution of `osk.exe` or any process that has `osksupport.dll` loaded that correlates with the timing of the registry change.

  - **Correlate with User Activity**: Investigate the user context in which the changes were made; verifying whether the actions align with a legitimate user workflow or if they appear anomalous.

  - **Cross-Reference with Security Events**: Check for other security events surrounding the time of detection, such as any failed logons or access attempts that may indicate a runtime exploitation scenario.

  ### Prioritization
  The severity of this alert is high because bypassing UAC can lead to full administrative privileges on a system, making it a critical concern in enterprise environments where security controls must be upheld to prevent unauthorized access and potential data breaches.

  ### Blind Spots and Assumptions
  This detection may not capture all intended UAC bypass scenarios, particularly if attackers utilize different applications or employ methods that do not manipulate the registry in the specified manner. The detection logic assumes that the presence of `osksupport.dll` changes in the registry is an indicator of compromise. Additionally, the alert requires registry auditing to be enabled; without this logging, potential malicious behavior could go undetected.

