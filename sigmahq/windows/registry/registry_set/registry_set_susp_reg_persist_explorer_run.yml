detection:
  selection:
    TargetObject|endswith: '\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
    Details|contains:
    - ':\$Recycle.bin\'
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry, specifically targeting the Explorer "Run" key, which is commonly used for persistence mechanisms by malicious actors. The objective of an attacker utilizing this tactic is to establish a method for their malware or backdoor to execute automatically upon user login, often targeting legitimate system directories like Temp or the Recycle Bin to obfuscate their presence.

  This behavior relates to the MITRE ATT&CK tactics of Persistence (T1547.001), specifically focusing on abuse of the Registry for establishing execution on startup. The primary telemetry source comes from Windows Registry changes, with the relevant log types being registry set events. Malicious activity in this context could lead to elevated privileges and persistence of an attacker’s malicious payload. However, this detection does NOT confirm an active compromise on its own; further investigation is necessary to correlate with additional telemetry and context.

  ### Investigation Steps

  - **Review Registry Modifications:** Examine Registry Event ID 2050 (Windows Registry Set) for the key `HKCU\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run`. Validate the `TargetObject` for expected malicious paths (e.g., `$Recycle.bin`, `ProgramData`, etc.) against known benign entries.

  - **Cross-check File System Artifacts:** Investigate file existence in suspicious directories noted in the Registry modification. Use file system logs to verify if executables or scripts were created or modified around the time of the registry change, specifically looking for unusual file size or modification timestamps in `C:\ProgramData\`, `C:\Temp\`, and similar paths.

  - **Identify User Context:** Determine which user account made the Registry change using `Security Event ID 4688` (Process Creation) to track the process that triggered the modification. Assess if the user context aligns with legitimate administrative tasks or if it indicates unauthorized access.

  - **Monitor Logins and Executions:** Check for repeated logins to the affected machine following the Registry modification using `Security Event ID 4624`. This can indicate if the persistence mechanism is being exploited actively, especially with failed login attempts (Event ID 4625) hinting at unauthorized access attempts.

  - **Validate Application Whitelisting:** Review the application control or endpoint protection logs for any blocks or alerts related to processes executing from the suspicious paths identified in the Registry. This can provide insight into attempts to launch compromised binaries.

  - **Analyze EDR Alerts:** If available, correlate with Endpoint Detection and Response (EDR) alerts linked to the identified Registry changes or any associated suspicious behaviors captured by the endpoint agents.

  ### Prioritization

  This alert holds high severity due to its implication of potential malware persistence mechanisms, which can lead to elevated privilege gains on crucial systems. The likelihood of malicious intent is substantial, given the common exploit patterns associated with these Registry modifications. This behavior is frequently weaponized in various attack vectors, making rapid response imperative.

  ### Blind Spots and Assumptions

  Detection may be limited by advanced evasion techniques where malware utilizes legitimate processes or names in less obvious locations to circumvent monitoring. Furthermore, the alert may be triggered by legitimate system administration tasks or software that modifies the Registry in expected operational contexts. A related detection mechanism could include monitoring for abnormal script executions that utilize similar persistence techniques, thus strengthening overall endpoint security coverage.

