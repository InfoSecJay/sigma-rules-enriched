logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run'
    Details|contains:
    - ':\$Recycle.bin\'
    - ':\ProgramData\'
    - ':\Temp\'
    - ':\Users\Default\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects potential persistence mechanisms being established on Windows systems via the Registry Run key, particularly focusing on entries that may lead to execution of malware or other undesirable software. Attackers often employ the Registry Run key to ensure malicious payloads execute upon user login, thereby maintaining persistence even after system reboots. The presence of entries that point to common temporary locations, such as `$Recycle.bin` or `C:\Temp`, raises suspicion as they are often utilized by malware to obscure their presence and evade detection.

  The suspected threat family associated with this detection includes various malware variants that leverage Windows Registry for persistence. The likely attacker objective here is to establish a foothold within the environment, allowing for further exploitation, data exfiltration, or lateral movement. Relevant MITRE ATT&CK tactics/techniques include:
  - Persistence (T1547.001): Registry Run Keys / Startup Folder
  - Privilege Escalation (T1548): Abuse Elevation Control Mechanism

  The primary data sources for this detection are Windows registry set logs, which can provide critical insights into changes made to the system's configuration settings, especially under keys that control startup behavior.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the registry set logs for alterations to the `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run` key, noting any entries that deviate from the norm, especially those pointing to suspicious folders or temp directories.
  - **Analyze Process Creation Events:** Collect and analyze process creation events from endpoint detection tools to identify any processes spawned from suspicious registry entries. Pay particular attention to execution times that correlate with user logins.
  - **Investigate User Activity:** Check user account activity around the time of the registry modification. Look for signs of unusual logins, especially those from non-administrative accounts, which could indicate privilege escalation attempts.
  - **Correlate with Threat Intelligence:** Utilize threat intelligence feeds to correlate identified artifacts with known malicious activities or indicators of compromise that target the registry for persistence.

  ### Prioritization
  The alert is considered high severity due to the potential for malware persistence within the environment. Persistence mechanisms increase the likelihood of successful attacks and complicate incident response efforts, thereby amplifying the threat impact.

  ### Blind Spots and Assumptions
  There may be blind spots related to environments where comprehensive logging of registry changes is not enabled. The detection logic assumes that suspicious entries will be created or modified in the specified registry path, which may not capture all avenues of persistence. Additionally, certain legitimate applications may use similar paths for valid purposes, leading to potential false positives. Sufficient logging and meticulous monitoring of registry activities are required for this alert to function effectively.

