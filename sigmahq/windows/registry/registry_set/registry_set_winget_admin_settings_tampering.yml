note: |
  ### Technical Context

  This Sigma rule detects modifications to the AppInstaller (winget) admin settings, including enabling local manifest installations or disabling installer hash checks. These changes suggest an attempt by an adversary to execute untrusted applications or to bypass security controls during the software installation process. This behavior could fit into the MITRE ATT&CK framework under the tactics of Persistence (T1543.002) and Defense Evasion (T1212).

  The primary telemetry source for this detection is Windows registry changes related to the winget settings, specifically under `HKEY_CURRENT_USER\Software\Microsoft\WindowsApps\LocalState\admin_settings`. If malicious, such modifications could allow the installation of unauthorized or harmful software, potentially leading to further compromise. It is essential to note that this detection does not confirm malicious intent on its own, as legitimate administrative changes can also trigger it.

  ### Investigation Steps

  - **Check registry change details**: Review Windows Event ID 4657 for the specific registry key alterations related to `HKEY_CURRENT_USER\Software\Microsoft\WindowsApps\LocalState\admin_settings`. Look for settings changed to allow local manifests or disable hash checks, which are indicative of potential malicious configurations.

  - **Identify user context and privileges**: Analyze the user account that made the changes. Legitimate administrative users (e.g., system admins or IT staff) may modify these settings, while unexpected or non-privileged users making these changes could be suspicious.

  - **Monitor for related process executions**: Investigate for subsequent process creation events (Windows Event ID 4688) involving `winget.exe` around the same timestamp. Unusual invocation of winget following the registry change could indicate exploitation.

  - **Validate benign usage patterns**: Review previous changes to the winget admin settings to establish a baseline for normal behavior. Repeated legitimate modifications by known administrative users are expected, while anomalies may suggest nefarious intent.

  - **Cross-reference with incident activity**: Look for additional security alerts or incidents related to the affected asset. These could strengthen the assessment of whether the change is part of a more extensive attack, especially if combined with other suspicious indicators.

  ### Prioritization

  This alert is considered low severity in the enterprise context. While modifications to application installation settings can be weaponized by attackers for privilege escalation or software exploitation, it is also relatively common for administrators to adjust these settings for legitimate reasons, such as testing or software deployment.

  ### Blind Spots and Assumptions

  Detection may have limitations in identifying whether the change was executed through legitimate administrative action or malicious means. Variances in logging configurations, especially if registry change logging is not consistent, may affect visibility. Legitimate activities like administrative deployments or maintenance operations may also trigger this alert. A related detection of abnormal PowerShell commands involving `Invoke-WebRequest` could provide additional context around potential malicious behavior regarding software installation.

