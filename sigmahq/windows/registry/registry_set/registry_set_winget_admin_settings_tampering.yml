note: |
  ### Technical Context

  This rule detects modifications to the AppInstaller's (winget) admin settings, particularly changes that enable local manifest installations or disable installer hash checks. The likely objective of an attacker leveraging these changes would be to bypass security measures that prevent the installation of potentially malicious software. This behavior aligns with the MITRE ATT&CK framework, specifically under the tactic of "Defense Evasion" (ID: T1203) and "Persistence" (ID: T1037). The primary telemetry source for this detection is Windows Registry events, specifically those related to winget configurations in the registry paths.

  If modifications are made maliciously, the impact could be significant, as it allows for the installation of unverified software, increasing the risk of compromise or data loss. However, it is crucial to note that this detection does not confirm malicious activity on its own without further context regarding the motivations behind the changes or the results of subsequent actions.

  ### Investigation Steps

  - **Verify admin settings change log:** Check Windows Security Event ID 4657 for changes to registry keys associated with `\REGISTRY\A\LocalState\admin_settings` for further context on what specific changes were made.

  - **Analyze the context of modifications:** Review the user account that made the change, looking at Event ID 4624 (Logon) to confirm if it was a legitimate admin user or potentially a compromised account.

  - **Check for previous legitimate behavior:** Identify if there are documented business processes or applications that require changes to winget settings, looking for standard operating procedures that justify modifications to admin settings.

  - **Identify potentially malicious artifacts:** Look for related installation events from winget (e.g., Event ID 4688 showing `winget.exe` spawning), particularly those that occur immediately following the registry change, indicating possible unauthorized installations.

  - **Review configuration for logging comprehensiveness:** Confirm that auditing for registry changes is enabled thoroughly in the Windows environment, ensuring events are logged for all relevant modifications to improve detection reliability.

  ### Prioritization

  This alert is considered low severity due to the potential for legitimate use cases associated with admin settings modifications. However, its presence indicates an opportunity for malicious abuse, given that attackers often look to exploit similar settings for persistence or to bypass security controls. The frequency of weaponization around winget actions necessitates a cautious approach.

  ### Blind Spots and Assumptions

  The detection may miss cases where attackers utilize alternate methods to achieve similar effects without modifying the registry. Continuous monitoring of winget-related alterations requires ensuring that sufficient logging configurations are in place. Legitimate software deployments or administrative actions could trigger this alert, leading to false positives. A companion detection focusing on the installation of untrusted applications via winget would strengthen overall coverage against potential exploitation.

