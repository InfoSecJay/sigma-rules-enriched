  ### Technical Context

  This Sigma rule detects the Registry modification associated with the Bypass UAC using DelegateExecute technique, which allows attackers to escalate privileges without triggering User Account Control (UAC). The likely attacker objective is to gain elevated permissions to execute malicious payloads, access sensitive data, or perform unauthorized administrative actions on Windows systems. This activity aligns with the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and the specific technique T1548.002 (Bypass UAC: DelegateExecute).

  The primary telemetry sources for this detection include Windows Registry logs, particularly changes to the `HKEY_CLASSES_ROOT\CLSID` registry path. If this behavior is malicious, it can lead to a significant security incident within the organization, as it allows unauthorized users to gain control over systems. It's important to note that this detection does NOT confirm that a compromise has occurred; it merely indicates a potentially suspicious activity that warrants further investigation.

  ### Investigation Steps

  - **Check Registry Modification History:** Review Windows Registry changes, specifically for `HKEY_CLASSES_ROOT\CLSID\{GUID}\open\command\DelegateExecute`. Look for any recent entries that may seem out of the ordinary or were modified without a legitimate application installation.

  - **Correlate with Event ID 4663:** Examine Security Event ID 4663 to identify access attempts on the `DelegateExecute` object. This log captures file system access events that can help establish context around the registry modification.

  - **Identify Legitimate Usage:** Determine if the modification aligns with known software installations or updates that utilize the `DelegateExecute` command, such as Backup and Restore (sdclt). Compare the timestamp and user account involved with these processes.

  - **Analyze Potential Malicious Indicators:** Look for high-confidence indicators associated with Privilege Escalation attacks, such as abnormal user activity or access patterns from non-administrative accounts attempting to modify critical registry keys.

  - **Review Associated Processes:** Investigate active processes around the modification time using Process Explorer or Sysmon Event ID 1. Look for unusual parent-child relationships indicating a process trying to elevate privileges after a `DelegateExecute` registry modification.

  - **Network Behavior Review:** Check for outbound connections from unexpected processes post-modification. Use network logs to identify any anomalous traffic patterns or connections to known malicious domains that can be associated with privilege escalation attempts.

  ### Prioritization

  This alert is considered high severity due to a potentially serious impact on system integrity and confidentiality if an attacker successfully bypasses UAC. The likelihood of malicious abuse is significant, as bypassing UAC is a common tactic among attackers to escalate privileges and gain unauthorized access to sensitive resources.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications using `DelegateExecute` for valid purposes, which could generate false positives. The accuracy of this detection relies on proper logging of Windows Registry changes. Users with legitimate administrative privileges may trigger this alert during routine activities, complicating assessments. A related detection to consider is monitoring for additional changes in the `HKEY_CLASSES_ROOT\CLSID` registry path, which could indicate broader misuse of registry manipulation techniques.

