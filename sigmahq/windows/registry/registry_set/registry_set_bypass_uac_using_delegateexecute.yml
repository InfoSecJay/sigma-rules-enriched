  ### Technical Context
  This detection rule identifies attempts to bypass User Account Control (UAC) through a specific registry modification related to the `DelegateExecute` command. UAC bypasses are commonly leveraged by attackers to escalate privileges without raising immediate alarms. They may seek to execute malicious code with elevated privileges, enabling them to perform actions such as installing malware, exfiltrating data, or disabling security controls.

  The relevant MITRE ATT&CK tactic for this behavior is **Privilege Escalation**, specifically the technique **T1548.002 - Abuse Elevation Control Mechanism: Bypass User Account Control**. Attackers exploiting this vector might utilize methods that allow actions that typically require elevated privileges without proper authorization.

  The primary data sources that will yield evidence include Windows registry logs, particularly those monitoring changes to keys associated with security and program execution, as well as process creation events that may reveal unauthorized or unexpected command execution tied to UAC bypass techniques.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the Windows registry for modifications to the `DelegateExecute` key under the `open\command` registry path, focusing on any entries that are empty or foreign to normal configurations.
  - **Analyze Process Creation Events:** Investigate recent process creation events that correspond to commands executed via the `sdclt.exe` process or any other relevant applications known to utilize UAC, noting any irregularities or signs of misuse.
  - **Monitor for Suspicious Execution:** Look for anomalous command-line arguments or execution patterns in logs, especially around the time of modification to the registry settings detected by this rule, indicating attempted privilege escalation.
  - **Correlate with User Activities:** Check user activities around the time of the detected event for any irregular login patterns or permissions changes that may suggest unauthorized access or privilege escalation attempts.

  ### Prioritization
  The alert's severity is high due to the critical nature of privilege escalation vulnerabilities; an attacker gaining elevated access could significantly compromise enterprise security, making rapid detection and response essential.

  ### Blind Spots and Assumptions
  This detection may not capture all UAC bypass attempts, particularly if attackers employ techniques not related to the `DelegateExecute` command or if they are operating from legitimate applications. The detection logic assumes that logging for registry changes and process executions is properly configured and enabled, which may not always be the case in environments with varied policies and practices. Awareness of potential log retention limits is also necessary for effective remediation, as older entries may be purged or unavailable.

