  ### Technical Context

  This rule detects attempts to bypass User Account Control (UAC) using the DelegateExecute method in Windows. The likely attacker objective is to escalate privileges without triggering UAC prompts, allowing unauthorized actions with elevated permissions. This behavior aligns with the MITRE ATT&CK technique T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control).

  The primary telemetry source is the Windows Registry, specifically monitoring changes to the key related to DelegateExecute commands. If malicious, this tactic can enable an adversary to execute unauthorized actions with escalated privileges, potentially compromising a system or network further. Importantly, this detection does not confirm that a successful privilege escalation has occurred, as it only indicates a potential tactic being employed.

  ### Investigation Steps

  - **Review affected Registry keys:** Investigate the Registry path `HKEY_CURRENT_USER\Software\Classes\ms-settings\open\command\DelegateExecute`. Look for any recent changes to confirm if the DelegateExecute value is empty or has been modified unexpectedly.

  - **Check for supporting Event IDs:** Correlate with Windows Event ID 4698 (scheduled task created) or Event ID 4688 (process creation) to determine if there are new scheduled tasks or processes that may indicate privilege escalation tied to the UAC bypass attempt.

  - **Identify legitimate uses of DelegateExecute:** Understand that legitimate applications may also modify this key. Verify whether the modification corresponds with known application behaviors or expected user activity to evaluate legitimacy.

  - **Look for common indicators of compromise:** Detect other unusual behaviors, such as the presence of newly created processes, particularly if they are created by non-administrative users, which could correlate with attempts to achieve privilege escalation.

  - **Assess asset criticality and host role:** Determine if the affected system has elevated privileges or is critical within the enterprise environment. Focus on Windows servers or workstations that handle sensitive data or execute administrative tasks.

  ### Prioritization

  Given the potential for significant impact on systems and the likelihood of malicious exploitation of UAC bypass techniques, this alert should be treated with high urgency. Privilege escalation tactics, particularly when they bypass security controls like UAC, are frequently weaponized in real-world attacks.

  ### Blind Spots and Assumptions

  The detection may miss specific evasion techniques, such as modifications made by trusted or signed applications, which could also alter the relevant Registry keys without malicious intent. Comprehensive logging configurations are required, particularly around Registry changes and process creation events, to ensure reliable detection. Legitimate administrator activities may also trigger this alert, particularly during system configuration changes. Another relevant detection to strengthen coverage is monitoring for suspicious changes to scheduled tasks, as they often accompany privilege escalation attempts.

