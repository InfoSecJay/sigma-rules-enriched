title: Potentially Suspicious Command Executed Via Run Dialog Box - Registry
id: a7df0e9e-91a5-459a-a003-4cde67c2ff5d
related:
- id: f9d091f6-f1c7-4873-a24f-050b4a02b4dd
  type: derived
status: test
description: |
  Detects execution of commands via the run dialog box on Windows by checking values of the "RunMRU" registry key.
  This technique was seen being abused by threat actors to deceive users into pasting and executing malicious commands, often disguised as CAPTCHA verification steps.
references:
- https://medium.com/@ahmed.moh.farou2/fake-captcha-campaign-on-arabic-pirated-movie-sites-delivers-lumma-stealer-4f203f7adabf
- https://medium.com/@shaherzakaria8/downloading-trojan-lumma-infostealer-through-capatcha-1f25255a0e71
- https://www.forensafe.com/blogs/runmrukey.html
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-october-2024/
author: Ahmed Farouk, Nasreddine Bencherchali
date: 2024-11-01
tags:
- attack.execution
- attack.t1059.001
logsource:
  product: windows
  category: registry_set
detection:
  selection_key:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\Explorer\RunMRU'
  selection_powershell_command:
    Details|contains:
    - 'powershell'
    - 'pwsh'
  selection_powershell_susp_keywords:
    Details|contains:
    - ' -e '
    - ' -ec '
    - ' -en '
    - ' -enc '
    - ' -enco'
    - 'ftp'
    - 'Hidden'
    - 'http'
    - 'iex'
    - 'Invoke-'
  selection_wmic_command:
    Details|contains: 'wmic'
  selection_wmic_susp_keywords:
    Details|contains:
    - 'shadowcopy'
    - 'process call create'
  condition: selection_key and (all of selection_powershell_* or all of selection_wmic_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potentially suspicious commands executed through the Windows Run dialog box by monitoring the "RunMRU" registry key. Attackers have been known to exploit this feature by tricking users into executing harmful commands that are often disguised as legitimate activities, such as CAPTCHA verifications. The analysis of this key can reveal commands that align with phishing or malware delivery tactics.

  The primary objective of attackers using this technique is to execute malicious commands without raising suspicion, thus facilitating further stages of an attack such as data exfiltration or system compromise. The rule is particularly relevant in cases where commands originate from potentially obfuscated PowerShell or WMIC commands, which may be employed to bypass traditional security measures.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Execution (TA0002)**: The overall tactic under which these activities fall.
  - **Command and Scripting Interpreter: Windows Command Shell (T1059.001)**: This specific technique encompasses the use of the command shell through various means, including Run dialog execution.

  Primary data sources for this detection include:
  - Registry logs that provide insights into RunMRU key modifications.
  - Process creation events that would capture the execution of commands via the Run dialog.

  ### Investigation Steps
  - **Review Registry Logs**: Examine the "RunMRU" registry key entries to identify any recently executed commands that appear suspicious or unusual.
  - **Analyze Process Creation Events**: Look for entries in process creation logs that correlate with the commands found in the RunMRU key, particularly those invoking PowerShell or WMIC.
  - **Correlate with Command Patterns**: Identify any commands that contain malicious keywords or obfuscation techniques commonly associated with scripting threats (e.g., 'Invoke-', 'ftp', or encoded PowerShell commands).
  - **Conduct Behavioral Analysis**: Investigate the broader context of any suspicious command execution, including user activity and system changes that coincide with the observed registry modifications.

  ### Prioritization
  This alert is classified as high severity due to its potential to indicate an ongoing attack where legitimate users may inadvertently execute commands carried out by an attacker, leading to data compromise or system integrity loss.

  ### Blind Spots and Assumptions
  The detection logic may miss cases where attackers manipulate the registry without executing commands through the Run dialog, or they may use legitimate commands that do not trigger the alert. Additionally, reliance on PowerShell and WMIC commands implies that any actions taken through other methods (e.g., direct executables) might not be detected. Furthermore, complete registry auditing and logging must be enabled for this detection rule to function effectively. If logging is not enabled or incomplete, critical artifacts may be missing, compromising the integrity of the analysis.

