logsource:
  product: windows
  category: registry_set
detection:
  selection_key:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\Explorer\RunMRU'
  selection_powershell_command:
    Details|contains:
    - 'powershell'
    - 'pwsh'
  selection_powershell_susp_keywords:
    Details|contains:
    - ' -e '
    - ' -ec '
    - ' -en '
    - ' -enc '
    - ' -enco'
    - 'ftp'
    - 'Hidden'
    - 'http'
    - 'iex'
    - 'Invoke-'
  selection_wmic_command:
    Details|contains: 'wmic'
  selection_wmic_susp_keywords:
    Details|contains:
    - 'shadowcopy'
    - 'process call create'
  condition: selection_key and (all of selection_powershell_* or all of 
    selection_wmic_*)
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects the execution of potentially suspicious commands via the Windows Run dialog, by monitoring changes to the "RunMRU" registry key. Such behavior often indicates that an attacker is attempting to execute commands that could lead to command and control (C2) communication, data exfiltration, or lateral movement. The likely objective is to execute malicious payloads disguised as legitimate commands, commonly seen in attacks leveraging social engineering tactics, such as fake CAPTCHA verifications. The relevant MITRE ATT&CK technique is **Execution via Command-Line Interface (T1059.001)**.

  Primary telemetry sources include Windows registry changes, specifically Registry Set logs, with a focus on Event IDs related to registry modifications. If malicious, this behavior could allow an attacker to execute arbitrary commands on the target system, significantly increasing risk. However, this detection does NOT confirm that malicious activity has occurred; it merely indicates that suspicious commands have been executed.

  ### Investigation Steps

  - **Check registry modification details:** Review Registry Set logs for changes to `\Microsoft\Windows\CurrentVersion\Explorer\RunMRU` (Event ID 4657), focusing on the `TargetObject` and `Details` fields for suspicious command patterns.

  - **Analyze command context:** Look for execution of commands using `powershell` or `wmic` in the `Details` field. Malicious indicators include usage of encoded PowerShell commands (e.g., containing `-enc`) or key terms like `Invoke-` and `shadowcopy`.

  - **Identify legitimate usage:** Determine if the commands executed through the Run dialog align with approved organizational processes. For instance, legitimate users may invoke system tools like `cmd` or `control` that are consistent with normal operational tasks.

  - **Correlate with other security events:** Investigate any recent User Account Control (UAC) prompts or unusual user behavior leading up to the command execution. Look for signs of other alerts such as anomalous logins (Event ID 4624) or unexpected process creations (Sysmon Event ID 1).

  - **Cross-reference timeline:** Check if the timing of this registry modification corresponds with known phishing campaigns or other relevant threat intelligence (e.g., alerts around fake CAPTCHA campaigns mentioned in related references).

  - **Validate network activity:** Use network logs to confirm if commands led to outbound connections, which can be captured using tools like Windows Firewall logs (Event ID 5156) or proxy logs that show connections made following the suspicious command execution.

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on the affected system and the likelihood of malicious exploitation. The ability to execute commands via the Run dialog is often weaponized by adversaries seeking to perform further malicious actions post-compromise.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that legitimate administrative tools or applications may trigger this alert, especially if they perform registry writes. Proper logging configurations (e.g., ensuring auditing for registry modifications is enabled) are crucial for reliable detection. Additionally, users performing legitimate script execution or automation may inadvertently trigger this rule, which can lead to false positives. Supplemental alerts, such as those detecting suspicious network connections or abnormal process execution, can provide better context and assist in confirming or denying the malicious nature of the observed behavior.

