title: ClickOnce Trust Prompt Tampering
id: ac9159cc-c364-4304-8f0a-d63fc1a0aabb
status: test
description: Detects changes to the ClickOnce trust prompt registry key in order
  to enable an installation from different locations such as the Internet.
references:
- https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
- https://learn.microsoft.com/en-us/visualstudio/deployment/how-to-configure-the-clickonce-trust-prompt-behavior
author: '@SerkinValery, Nasreddine Bencherchali (Nextron Systems)'
date: 2023-06-12
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\'
    TargetObject|endswith:
    - '\Internet'
    - '\LocalIntranet'
    - '\MyComputer'
    - '\TrustedSites'
    - '\UntrustedSites'
    Details: 'Enabled'
  condition: selection
falsepositives:
- Legitimate internal requirements.
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the ClickOnce trust prompt registry key, which may indicate an attempt to tamper with security settings. The likely attacker objective is to bypass security measures and enable the execution of code from untrusted sources, facilitating malware installation or other malicious tasks. The relevant MITRE ATT&CK tactics are *Persistence* and *Defense Evasion*, specifically technique T1112 (Modify Registry).

  Primary telemetry sources include Windows Registry event logs capturing registry key modifications, focusing on the path `\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\`. If malicious, such behavior could allow the deployment of unauthorized applications or malware, undermining system security. However, this detection does NOT confirm actual malicious execution; it only indicates a potential change in behavior.

  ### Investigation Steps

  - **Review registry changes:** Examine Windows Security Event ID 4657 or Sysmon Event ID 13 for modifications to `\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\`. Check for timeline and source of modification.

  - **Validate expected settings:** Cross-check the current permissions and settings within `PromptingLevel` against company policy. Legitimate settings typically remain set to values ensuring user prompts for untrusted code.

  - **Correlate with user behavior:** Investigate user actions associated with the time of modification, reviewing recent application installations via Security Event ID 4688 for process creation events linked to ClickOnce applications.

  - **Check for malware indicators:** Look for unusual registry values enabling installations from `Internet`, `LocalIntranet`, or `UntrustedSites`. Malicious configurations may include unexpected values and sources not typically used by the organization.

  - **Assess asset criticality:** Prioritize analysis on high-value targets, such as critical infrastructure or sensitive information systems, which, if compromised via ClickOnce, may lead to significant data breaches.

  - **Verify file creation events:** Review for file activity related to ClickOnce applications using Sysmon Event ID 11. Validate creation or modification of executable files in unusual directories post-registry modification.

  ### Prioritization

  This alert should be treated with medium severity due to the potential for significant impact on critical systems if malicious. The likelihood of malicious abuse is moderate since tampering with trust prompts is a recognized method for executing unapproved applications. However, such behavior may not be frequently weaponized in every context.

  ### Blind Spots and Assumptions

  Detection can be limited by the absence of Windows Registry auditing and may not capture all legitimate changes related to internal processes. Legitimate software updates might trigger this alert if registry keys are altered during the process. A related detection that enhances coverage is monitoring installation logs for suspicious ClickOnce application executions, which can provide context to registry changes.

