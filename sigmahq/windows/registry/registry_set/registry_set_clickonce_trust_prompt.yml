logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\'
    TargetObject|endswith:
    - '\Internet'
    - '\LocalIntranet'
    - '\MyComputer'
    - '\TrustedSites'
    - '\UntrustedSites'
    Details: 'Enabled'
  condition: selection
falsepositives:
- Legitimate internal requirements.
level: medium
note: |
  ---

  ### Technical Context

  This rule detects changes to the ClickOnce trust prompt registry settings, particularly adjustments that enable installations from varied locations such as the Internet, Local Intranet, and Trusted Sites. The likely attacker objective is to circumvent security settings to facilitate the execution of potentially malicious code that utilizes ClickOnce technology. The detection aligns with MITRE ATT&CK technique T1112 (Modify Registry).

  Primary telemetry sources include registry modifications (Windows Registry) with a focus on entries under `SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\`. If leveraged maliciously, this activity could result in unauthorized code execution and potential system compromise. Importantly, this detection does NOT confirm malicious intent on its own; legitimate software installs may require similar registry changes under specific internal policies.

  ---

  ### Investigation Steps

  - **Verify the registry modification details:** Check for changes in the registry path `SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\` (Event ID 4657) to understand which values were altered and their previous states.

  - **Assess timing and user context:** Identify the user who made the modification and the time stamp of the change. Look for patterns of unusual activity surrounding the modification, such as previous failed installations or system updates.

  - **Cross-reference with common software behavior:** Determine if any approved internal applications require similar registry changes for legitimate operation. Note that trusted internal software might alter ClickOnce settings without indicating malicious activity.

  - **Identify additional registry keys modified:** Investigate if other related registry keys have been altered simultaneously. Changes to neighboring keys could indicate further malicious intent, such as installing potentially unwanted programs or malware.

  - **Check for related application execution:** Review application logs or telemetry that correlate with ClickOnce installations (e.g., `Event ID 4103`, for ClickOnce application initialization) to see if an installation consistent with the new settings was performed subsequently.

  - **Document any anomalies:** Note any discrepancies between the registry modifications and expected business operations, including non-standard applications attempting installations from newly permitted locations.

  ---

  ### Prioritization

  This alert is of medium severity given that the affected system may have a significant role in executing code, such as application servers or user endpoints in a critical environment. The likelihood of malicious abuse is moderate, as altering ClickOnce settings is a known tactic for bypassing security mechanisms, and this method has been weaponized in various campaigns.

  ---

  ### Blind Spots and Assumptions

  Detection reliability can be limited by insufficient logging configurations, as not all systems may log detailed registry changes effectively. Legitimate activities, such as internal policy changes to accommodate new software deployments, could trigger this alert. A related detection that strengthens coverage is monitoring for unusual code execution from ClickOnce applications (T1203), as these two behaviors might commonly occur together in a malicious scenario.

