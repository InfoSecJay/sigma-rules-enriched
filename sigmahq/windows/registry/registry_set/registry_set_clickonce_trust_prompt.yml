logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\'
    TargetObject|endswith:
    - '\Internet'
    - '\LocalIntranet'
    - '\MyComputer'
    - '\TrustedSites'
    - '\UntrustedSites'
    Details: 'Enabled'
  condition: selection
falsepositives:
- Legitimate internal requirements.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the ClickOnce trust prompt registry key, which could indicate an attempt to enable the installation of applications from potentially untrusted locations, such as the Internet. The likely attacker objective is to bypass security measures that restrict the execution of unverified code, facilitating the installation of malicious software. The relevant MITRE ATT&CK tactic and technique are Defense Evasion, T1112 (Modify Registry).

  Primary telemetry sources include Windows Registry logs specifically targeting changes to the Key: `SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\`. If malicious, such changes could enable the execution of harmful payloads with elevated privileges. This detection does NOT confirm that an installation is actually occurring; it merely indicates that the registry key enabling such behavior has been modified.

  ### Investigation Steps

  - **Verify registry modification locations:** Check changes to the registry key at `HKEY_CURRENT_USER\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\` using `Registry Event ID 4657` to identify unauthorized changes.

  - **Assess the impact of registry modifications:** Review `Event ID 4663` for any file accesses to the applications intended for execution post-modification, correlating file paths with known good software.

  - **Identify benign contextual changes:** Document any known internal changes to the ClickOnce settings, especially by trusted administrative accounts or during authorized software deployments.

  - **Check for suspicious installation behavior:** Look at installation logs (`Windows Installer Event ID 1035`, `Event ID 11707`) following the registry modification; any unrecognized application installations are a strong indicator of malicious intent.

  - **Correlate alerts with User Account Activity:** Identify the user accounts responsible for the registry modification and determine if they had a legitimate purpose or were operating from an unexpected machine.

  - **Validate host criticality:** Ensure that the machine with modified registry entries is not a critical asset; compromise here can lead to a wider security breach if exploited.

  ### Prioritization

  This alert should be prioritized as medium severity due to its indication of potential privilege escalation tactics via registry modification. Given that such behavior could involve the installation of unverified code, the likelihood of malicious use is significant, though the context must be thoroughly evaluated.

  ### Blind Spots and Assumptions

  There is a risk of false positives from legitimate changes for internal software installations, which may also trigger this alert. The detection relies on appropriate logging from the Windows Registry, and there may be other legitimate activities, such as application testing, that can modify the ClickOnce trust settings. A related detection to enhance coverage includes monitoring for unexpected application installations through logs capturing MSI or ClickOnce activity to provide broader context on user actions following this registry modification.

