title: ClickOnce Trust Prompt Tampering
id: ac9159cc-c364-4304-8f0a-d63fc1a0aabb
status: test
description: Detects changes to the ClickOnce trust prompt registry key in order to
  enable an installation from different locations such as the Internet.
references:
- https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
- https://learn.microsoft.com/en-us/visualstudio/deployment/how-to-configure-the-clickonce-trust-prompt-behavior
author: '@SerkinValery, Nasreddine Bencherchali (Nextron Systems)'
date: 2023-06-12
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel\'
    TargetObject|endswith:
    - '\Internet'
    - '\LocalIntranet'
    - '\MyComputer'
    - '\TrustedSites'
    - '\UntrustedSites'
    Details: 'Enabled'
  condition: selection
falsepositives:
- Legitimate internal requirements.
level: medium
note: |
  ### Technical Context
  This detection rule identifies unauthorized changes to the ClickOnce trust prompt configuration within the Windows registry, specifically focusing on the `PromptingLevel` key associated with .NET Framework security settings. Modifying this registry key may allow applications to bypass standard user prompts for trust decisions when installing software from various sources such as the Internet, potentially leading to the execution of untrusted or malicious code.

  The primary attacker objective in this scenario pertains to gaining persistence and executing unverified code on targeted systems. If an attacker can manipulate the ClickOnce trust settings, they can facilitate the execution of malicious applications that otherwise would be blocked due to security settings. This tactic falls under MITRE ATT&CK’s **Persistence (T1112)** and **Defense Evasion**, with techniques aimed at enabling unauthorized software installations which could compromise system integrity or data.

  Key telemetry for effective detection of this behavior includes Windows registry change logs, specifically focusing on operations against the `HKEY_LOCAL_MACHINE\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel` path. Monitoring these changes can reveal both legitimate and potentially malicious attempts to alter trust settings.

  ### Investigation Steps
  - **Review Registry Changes:** Investigate recent modifications to the registry path `HKEY_LOCAL_MACHINE\SOFTWARE\MICROSOFT\.NETFramework\Security\TrustManager\PromptingLevel`, focusing on entries related to `PromptingLevel` values that may indicate an attempt to allow installations from untrusted sources.

  - **Analyze System Event Logs:** Collect and examine system event logs for events related to registry changes and application installations, particularly those that coincide with modifications to ClickOnce configurations.

  - **Correlate with User Activity:** Assess user activity logs to identify any suspicious login behaviors or corresponding application installations that align with the timing of the registry changes, particularly from accounts with elevated privileges.

  - **Check for Known Malicious Applications:** Use threat intelligence to verify if the changes correlate with the execution of known malicious applications or attempts to initiate ClickOnce installations from non-standard or risky locations.

  ### Prioritization
  This alert is considered medium severity due to the potential impact of allowing untrusted applications to execute within the enterprise environment. While the likelihood of exploitation increases with modifications to the ClickOnce registry, the context of such changes must be carefully assessed to distinguish between legitimate adjustments and possible compromise.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of threat actor activity, particularly advanced persistent threats that could utilize custom techniques to modify registry settings without triggering alerts. The accuracy of this rule assumes that the required logging mechanisms for Windows registry changes are enabled and that no benign applications or internal processes are regularly adjusting these ClickOnce settings for valid purposes. Without comprehensive monitoring of user behavior and contextual correlation, there remains a risk of false positives from legitimate internal adjustments.

