note: |
  ### Technical Context

  This rule detects registry modifications that hide file extensions on Windows systems. Hiding file extensions is a tactic employed by adversaries to disguise malicious files, making it easier to execute them without user awareness. This behavior aligns with the MITRE ATT&CK technique T1137 - "Modify Registry," under the tactic of Persistence. The primary telemetry source is Windows registry change logs, specifically focusing on changes made to registry keys that control the visibility of file extensions and hidden files. If malicious, these modifications can enable significantly increased risk by facilitating the execution of disguised malware. This detection does NOT confirm any particular threat actor activity by itself, as legitimate administrative actions can also modify similar registry settings.

  ### Investigation Steps

  - **Check registry modification logs**: Review Windows Event ID 4657 (Registry Value Deleted) and Event ID 4656 (Registry Value Set) to confirm any recent changes to `SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\HideFileExt` or `Hidden` values. Look for `DWORD` changes to 1 or 2, which indicate malicious intent.

  - **Validate recent administrative actions**: Investigate if any known administrative scripts or user accounts have legitimate reasons for modifying the aforementioned registry keys. Compare against a baseline of registry settings for expected configurations.

  - **Review process creation logs**: Cross-reference Sysmon Event ID 1 (Process Creation) around the same time as the registry change to identify any newly spawned processes that may be related to file manipulation or may appear suspicious.

  - **Identify potential persistence mechanisms**: Search for any other registry keys associated with persistence techniques. Look specifically for entries under `HKCU\Software\Microsoft\Windows\CurrentVersion\Run` as attackers might set malware to execute persistently.

  - **Document evidence of obfuscation**: Look for files in the system that lack visible extensions, especially those in user directories, and log relevant file activity. High confidence indicators include executable files with double extensions (e.g., `file.txt.exe`) that would typically be hidden due to the registry setting.

  - **Review prior and subsequent behavior**: Observe for any associated network activity or file modifications that follow the registry change. Malicious activity could include unusually named executables launching or unexpected network connections that may indicate data exfiltration.

  ### Prioritization

  The alert is categorized as medium severity, as modifying registry keys to hide file extensions poses a potential risk to system security by facilitating malware execution. The likelihood of malicious abuse is notable due to the common use of this technique by threat actors, particularly in ransomware and trojan operations.

  ### Blind Spots and Assumptions

  Limitations of the detection include the potential for administrative scripts to trigger false positives when modifying registry settings. Additionally, the necessary registry monitoring must be properly configured to ensure comprehensive visibility of such changes. Legitimate behaviors, such as IT maintenance or user preferences being altered, could inadvertently trigger the alert. Companion detections involving file creation or unauthorized executable launches could strengthen overall coverage and provide clearer threat context.

