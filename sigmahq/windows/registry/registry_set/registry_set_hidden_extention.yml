  ### Technical Context

  This Sigma rule detects registry modifications intended to hide file extensions (T1137) or to set files as hidden on a Windows system. Such behavior may indicate an attacker’s intention to disguise malicious files to evade user detection or security protections. The potential attacker objective could include preparing for further malware execution or ensuring persistence by making malicious payloads unobtrusive.

  The relevant MITRE ATT&CK techniques are **T1112 - Modify Registry** under the tactic of **Persistence**. The primary telemetry source for this detection is Windows registry log activity, with a focus on modifications to specific registry paths. If malicious, this behavior poses significant security risks, as it can obscure the presence of malware and facilitate further exploitation of the affected system. However, this detection does NOT confirm actual malicious activity; legitimate administrative tasks might also modify these registry keys.

  ### Investigation Steps

  - **Check registry modification history:** Examine the Windows registry key at `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced` for values of `"HideFileExt"` and `"Hidden"`. Use tools like `regedit` or PowerShell commands to track the modification timestamp, looking for recent changes not aligned with administrative activity.

  - **Correlate with user activity:** Investigate user behavior around the time of the registry change by reviewing the event logs for Event ID 4648 (a logon attempt using explicit credentials) and Event ID 4624 (logon events). Determine if the user was executing potentially malicious actions, such as downloading or executing files.

  - **Identify benign administrative actions:** Review logs showing periodic maintenance scripts or similar scheduled tasks that might legitimately modify the registry settings related to file visibility. Ensure these modifications align within expected operational behavior timelines.

  - **Look for other indicators of compromise:** Cross-reference this detection with file creation events in your endpoint logs, focusing on known malware file hashes and suspicious file execution events in Security Event ID 4688 (process creation).

  - **Inspect for lateral movement:** Review network logs for unusual communication patterns or file access (such as SMB, Event ID 5140 in Security logs), which may correlate with attempts to exfiltrate hidden files or leveraging backdoors through the modified registry settings.

  - **Validate against threat intelligence:** Check organizational threat intelligence feeds for indicators related to ransomware or APT groups known to employ registry modifications to obscure malicious files. High-confidence indicators could include file names or extensions consistent with those identified in reports linked to T1137.

  ### Prioritization

  This alert should be considered medium severity due to the potential impact on system visibility and the likelihood of malicious use to hide malicious payloads. Such tactics are commonly weaponized in both ransomware campaigns and broader attack vectors, making prompt investigation essential to mitigate risks.

  ### Blind Spots and Assumptions

  Detection limitations include evasion by knowledgeable attackers who may create temporary scripts that modify registry keys and revert them quickly. This alert relies on the correct configuration of Windows logging to ensure registry changes are properly captured. Legitimate activities that could trigger this alert include administrative scripts run by IT staff for user experience enhancements. A related detection to complement this rule would be alerting on the creation of executable files in the user’s download or application directories, strengthening the detection of potentially malicious activity.

