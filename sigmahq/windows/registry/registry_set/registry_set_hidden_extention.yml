note: |
  ### Technical Context
  This rule detects modifications to the Windows Registry that hide file extensions, a common tactic used by attackers to obfuscate malicious files and evade detection. By changing this registry setting, an attacker can make it difficult for users and security systems to identify potentially harmful files, as the file extensions that signify file types (like .exe for executables) are concealed. The scenario often involves malware execution, where the attacker aims to execute malicious payloads without immediate detection, thereby ensuring persistence within the compromised environment.

  Relevant MITRE ATT&CK tactics and techniques include:
  - **Persistence** (TA0003)
    - **Registry Run Keys / Startup Folder** (T1137)

  Primary data sources for detecting this activity include Windows Registry event logs and settings modification logs, which will capture changes made to the specific registry keys that control file extension visibility.

  ### Investigation Steps
  - **Review Registry Logs**: Check Windows Registry event logs for any modifications to the registry key `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\HideFileExt` and `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden`. Determine if there are any recent changes.

  - **Correlate User Actions**: Investigate the user or system accounts that made the registry changes. Analyze their access patterns to identify if they have a history of legitimate use or if they seem suspicious in other activities.

  - **Assess File Behavior**: Analyze recent created or modified files in user directories, especially those that do not display their extensions. Look for unusual file names or behaviors, particularly files with executable attributes and no displayed extensions.

  - **Monitor for Further Malware Artifacts**: Collect and analyze related artifacts such as process creation logs, suspicious network connections, or indicators of lateral movement to confirm whether this modification is part of a broader compromise or associated with specific malware activity.

  ### Prioritization
  This alert is categorized as medium severity due to the potential impact on visibility into malicious file types and the likelihood that such changes are indicative of an ongoing attack, specifically related to persistence mechanisms employed by malicious actors.

  ### Blind Spots and Assumptions
  There may be blind spots in the detection coverage if administrative scripts frequently modify the registry settings, potentially generating false positives. This rule assumes that normal operational behavior does not involve hiding file extensions. Required logs for detection include comprehensive auditing of Windows Registry modifications, which must be enabled to capture such events effectively.

