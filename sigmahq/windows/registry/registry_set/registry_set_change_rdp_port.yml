note: |
  ### Technical Context

  This Sigma rule detects modifications to the default RDP port on Windows systems, indicating potential unauthorized attempts to obscure RDP access. Attackers may change the RDP port as an evasion technique to reduce the chances of detection and to facilitate remote access for malicious activities. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) and the technique is **Modify Existing Service** (T1547.010).

  The primary telemetry source is Windows Registry logs, specifically monitoring changes to the registry key `\Control\Terminal Server\WinStations\RDP-Tcp\PortNumber`. If this change is made maliciously, it could lead to unauthorized remote access or enable lateral movement within the network. This detection does NOT, on its own, confirm malicious activity, as legitimate system administrators may also modify the RDP port for security best practices.

  ### Investigation Steps

  - **Check the RDP Registry Setting:** Query the registry for changes made to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Terminal Server\WinStations\RDP-Tcp\PortNumber`. Validate if the port is set to a value other than the default `3389` (Event ID, Change Detection).

  - **Review User Access Logs:** Analyze Security Event ID 4624 (Logon) to identify the account(s) associated with logons to the affected system around the time of the registry modification. Look for suspicious accounts or unusual login times as indicators of malicious activity.

  - **Identify Recent Configuration Changes:** Review the System event logs (Event ID 5145) for any administrative actions that may have occurred prior to the port change. This can help establish if the port change was part of a legitimate process or an indicator of compromise.

  - **Audit Legitimate Administrative Actions:** Verify if the change was performed by a known administrator or service account during regular maintenance hours. Legitimate administrative changes usually correlate with planned maintenance or typical management activities.

  - **Monitor for Additional Indicators of Compromise:** Use Sysmon logged data (Event ID 1) to detect process creation events around the registry change time, especially those involving PowerShell or cmd.exe, which are commonly exploited for making such modifications.

  ### Prioritization

  This alert indicates high severity due to the impact on remote access capabilities and the potential risk of exploitation by threat actors. Changing the default RDP port is a common tactic employed by attackers, heightening the likelihood of malicious intent behind the event.

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses alternative methods to change the RDP settings, such as direct modification via low-level APIs that bypass logging. Required log sources include both Windows Registry monitoring and System Event logs for comprehensive visibility. Legitimate activities like administrative port changes or server configurations may trigger this alert. A related detection for monitoring failed RDP login attempts can strengthen the overall security posture by identifying possible brute force attempts alongside successful port changes.

