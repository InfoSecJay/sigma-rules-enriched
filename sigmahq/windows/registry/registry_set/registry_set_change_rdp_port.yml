note: |
  ---

  ### Technical Context

  This rule detects changes to the default Remote Desktop Protocol (RDP) port, which is typically set to TCP port 3389. Attackers may modify this setting to obscure their remote access and avoid detection by security monitoring tools. This behavior is relevant to the MITRE ATT&CK technique T1021.001 (Remote Services: Remote Desktop Protocol) and aligns with tactics for persistence and privilege escalation.

  The primary telemetry source for this detection is the Windows Registry, specifically monitoring registry changes under `\Control\Terminal Server\WinStations\RDP-Tcp\PortNumber`. If malicious, this behavior can indicate an attempt to establish stealthy remote access to a system. However, this detection does NOT confirm that the change was unauthorized or malicious on its own, as legitimate administrators might also modify this setting for valid operational reasons.

  ---

  ### Investigation Steps

  - **Verify registry change details**: Review Windows Registry for `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Terminal Server\WinStations\RDP-Tcp\PortNumber`. Look for a DWORD value that is not `0x00000d3d` (3389). Record the previous value for context.

  - **Cross-check with user management logs**: Check Windows Security Event ID 4624 (Logon) to identify recent successful logins. Determine if any logins were performed from unusual sources or at odd times that correlate with the port change.

  - **Assess system role and criticality**: Evaluate the host where the change was detected. Systems with administrative or critical roles (e.g., servers hosting sensitive applications) may warrant immediate attention if a non-standard RDP port is detected.

  - **Identify legitimate change requests**: Consult change management records for any planned maintenance or security upgrades that may have justified the modification to the RDP port to ensure no unauthorized changes were overlooked.

  - **Monitor for associated processes**: Analyze Sysmon Event ID 1 (Process Creation) for any suspicious executables launching around the time of the port change, particularly looking for PowerShell or command prompt activity indicative of scripted changes.

  - **Review firewall and access logs**: Examine firewall logs for any inbound connection attempts directed at the new RDP port. Use log types such as Windows Firewall with Advanced Security, focusing on any anomalies or unauthorized access attempts.

  ---

  ### Prioritization

  This alert should be prioritized as high severity, particularly if the affected system is a critical server. The likelihood of malicious use is significant, as attackers often employ port modifications to obfuscate their presence. Non-standard ports are a common tactic for evasion that can facilitate unauthorized access.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited if logs do not capture changes immediately or if logging configurations are insufficient for registry changes. Attackers might also revert the port back to 3389 after exploitation, thus obscuring their actions. Common administrative tasks, such as legitimate RDP configuration changes for legitimate users or system updates, may inadvertently trigger this alert. Consider companion detections, such as monitoring for unexpected RDP session initiations or unusual remote access tools that can provide further context.

