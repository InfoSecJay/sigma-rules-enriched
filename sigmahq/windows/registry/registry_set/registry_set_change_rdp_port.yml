note: |
  ### Technical Context
  This detection rule identifies changes to the default Remote Desktop Protocol (RDP) port on Windows systems, which is typically set to 3389. Attackers may alter this configuration as part of their efforts to evade detection or to facilitate unauthorized access to a compromised system. By shifting the RDP service to a non-standard port, malicious actors can minimize the likelihood of detection by automated scanning tools or opportunistic attackers, while maintaining access to the system.

  The MITRE ATT&CK framework highlights relevant tactics and techniques, specifically **Persistence** (T1547) and **Remote Services** (T1021.001). These tactics involve establishing a foothold within an environment through the manipulation of remote access capabilities. The ability to maintain remote access via RDP while obscuring typical indicators of compromise is a common objective for attackers.

  Key data sources for this alert include Windows registry change logs, particularly those that document modifications to `\Control\Terminal Server\WinStations\RDP-Tcp\PortNumber`. This registry path is critical for understanding changes made to RDP configurations and can provide insight into unauthorized modifications.

  ### Investigation Steps
  - **Review Registry Logs**: Examine the Windows registry logs to identify any instances where the `PortNumber` for RDP has been altered from the default value of 3389 to a different port. Pay attention to timestamps and the user account that made the change.

  - **Analyze Process Activity**: Investigate the process creation logs around the time of the change to determine if any suspicious processes (e.g., PowerShell or Command Prompt) were initiated that may have been used to modify the port settings.

  - **Check for Unauthorized Access Attempts**: Look at firewall or network traffic logs to identify any unusual access attempts to non-standard RDP ports, particularly from external IP addresses, as these may indicate probing or exploitation attempts.

  - **Monitor User Accounts**: Review any recent changes to user accounts with administrative privileges. Verify if any unauthorized accounts have been created or if existing accounts have been granted elevated access, as this could facilitate unauthorized changes to RDP settings.

  ### Prioritization
  The alert's severity is high due to the potential for significant impact on the organization’s security posture. Changes to the default RDP port can indicate an attempt to maintain unauthorized access, and the likelihood of this being associated with malicious activity is heightened in enterprise environments where RDP is widely utilized.

  ### Blind Spots and Assumptions
  This detection rule may not account for legitimate administrative changes made to RDP configurations during routine maintenance or system upgrades, which could result in false positives. The detection logic assumes access to registry logs is properly configured and that monitoring of user permissions is part of the organization's security posture. Additionally, failure to log or monitor attempts to access non-standard ports can create gaps in detection coverage, allowing attackers to bypass scrutiny.

