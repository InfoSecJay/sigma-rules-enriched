detection:
  selection:
    TargetObject|endswith: 'TreatAs\(Default)'
  filter_office:
    Image|startswith: 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_office2:
    Image:
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
  filter_svchost:
        # Example of target object by svchost
        # TargetObject: HKLM\SOFTWARE\Microsoft\MsixRegistryCompatibility\Package\Microsoft.Paint_11.2208.6.0_x64__8wekyb3d8bbwe\User\SOFTWARE\Classes\CLSID\{0003000A-0000-0000-C000-000000000046}\TreatAs\(Default)
        # TargetObject: HKU\S-1-5-21-1000000000-000000000-000000000-0000_Classes\CLSID\{0003000A-0000-0000-C000-000000000046}\TreatAs\(Default)
    Image: 'C:\Windows\system32\svchost.exe'
  filter_misexec:
        # This FP has been seen during installation/updates
    Image:
    - 'C:\Windows\system32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
  condition: selection and not 1 of filter_*
falsepositives:
- Legitimate use
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the "TreatAs" registry key, a technique often used in COM hijacking attacks to redirect legitimate executable calls to malicious payloads. The likely attacker objective is to achieve persistence and privilege escalation by substituting a trusted application with malicious code that can be executed under the guise of the legitimate application. This behavior corresponds to MITRE ATT&CK Tactic: Persistence, Technique: COM Hijacking (T1546.015).

  The primary telemetry sources for this detection are Windows Registry event logs, specifically capturing changes to the registry keys associated with COM objects. If malicious, the impact could range from data breaches to complete system compromise. This detection does NOT confirm actual execution or payload delivery; it merely identifies an attempt to tamper with the registry.

  ---

  ### Investigation Steps

  - **Check the registry modification details**: Review the Windows Registry logs for changes to the `HKLM\SOFTWARE\Microsoft\MsixRegistryCompatibility\Package` or `HKU\S-1-5-21-*` paths for entries modified regarding the `TreatAs` key. Look for unusual or non-standard entries.

  - **Validate calling process**: Examine the process ID and parent process of the modification. Use Event ID 4688 (Process Creation) to track which executable initiated the registry change. Legitimate modifications are typically made by `OfficeClickToRun.exe` or `msiexec.exe` during updates.

  - **Extract command line arguments**: Review the command line arguments used in the process creation events for `svchost.exe` or other involved executables. Look specifically for `rundll32.exe -sta` entries, as this is indicative of malicious intent.

  - **Identify related artifacts**: Check for file creations in paths associated with the modified COM objects. Look for unusual DLL files or executables in the `C:\Users\*\AppData\Local\Temp\` directory and use Sysmon Event ID 10 for file creation detection.

  - **Validate asset criticality**: If the modifications are found on high-value assets, such as domain controllers or systems containing sensitive data, prioritize the investigation accordingly.

  ---

  ### Prioritization

  This alert warrants medium priority due to the potential impact of a successful COM hijacking attack on critical systems. While the likelihood of malicious abuse exists, benign modifications can occur as part of legitimate software updates or installations, hence further analysis is required before escalating.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion through direct DLL injection or modifications made before logging is enabled. Ensure that registry auditing is properly configured and that relevant log sources, such as Windows Event Logs for Registry and Process Creation, are enabled for accurate detection. Legitimate activities like software installations may trigger this alert; therefore, context around the time of modification is essential. A related detection to consider is monitoring for unusual process spawning patterns from `svchost.exe`, which often serves as a cover in these attacks.

