  ---

  ### Technical Context

  This Sigma rule detects modifications to the TreatAs registry key, which can enable the execution of malicious commands through legitimate processes such as `rundll32.exe`. The likely attacker objective is to achieve persistence and escalate privileges by evading standard authorization mechanisms. This activity falls under the MITRE ATT&CK tactic of "Privilege Escalation" (TA0004) and the technique "Application Layer Protocol" (T1546.015). The primary telemetry sources are Windows registry logs, specifically targeting registry changes related to the TreatAs key. If the behavior is malicious, it could lead to further exploitation of vulnerabilities to gain sustained access. Importantly, this detection does not confirm that the modification is solely malicious without further context.

  ---

  ### Investigation Steps

  - **Verify the registry change: ** Check for modifications to the TreatAs key at `HKLM\SOFTWARE\Microsoft\MsixRegistryCompatibility\Package\...` using registry event logs. Look for Event ID 4657 which indicates registry value changes.

  - **Analyze the triggering process:** Review the Windows process creation logs (Security Event ID 4688 / Sysmon Event ID 1) to identify the parent process that triggered the registry change. Malicious activity may originate from unusual parent processes rather than typical Windows applications.

  - **Identify legitimate activity:** Confirm expected behavior by cross-referencing `C:\Program Files\Common Files\Microsoft Shared\ClickToRun\OfficeClickToRun.exe` and `C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe` command executions. These can frequently interact with registry keys legitimately during updates.

  - **Look for high-confidence malicious indicators:** Ensure that the registry modification was performed by untrusted applications not whitelisted in your environment. For example, changes initiated by `C:\Windows\system32\svchost.exe` can warrant deeper investigation as they may indicate impersonation of legitimate services.

  - **Check for concurrent abnormal activities:** Review other security logs and EDR solutions for patterns of behavior that may correlate with this modification, such as unwanted persistence mechanisms, unusual network calls, or file modifications in the user profile or system directories.

  ---

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on system integrity if an attacker is able to maintain persistence through the registry change. While this behavior is not extremely common, the potential for abuse exists, as it allows malicious actors to leverage legitimate processes to execute code without detection.

  ---

  ### Blind Spots and Assumptions

  Evasion techniques include monitoring or reverting the registry changes and leveraging signed binaries to avoid detection. Reliable detection relies on having comprehensive logging for both registry access and process creations. Legitimate software installations and updates may trigger this alert, leading to false positives if not assessed properly. Companion detections to consider include alerts for unusual command-line arguments passed to `rundll32.exe` or monitoring for other privilege escalation techniques (T1548).

