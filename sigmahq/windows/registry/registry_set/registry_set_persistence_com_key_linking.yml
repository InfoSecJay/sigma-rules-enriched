note: |
  ### Technical Context

  This rule detects attempts at COM object hijacking via the TreatAs subkey in the Windows registry. Attackers may manipulate this registry key to redirect component object model (COM) calls to malicious executables, allowing them to achieve persistence or escalate privileges. The relevant MITRE ATT&CK tactics/techniques are Persistence (T1546.015) and Privilege Escalation.

  Primary telemetry comes from Windows registry modifications, specifically monitoring changes to the "HKU\" and "Classes\CLSID\" paths. If this behavior is malicious, it could lead to unauthorized execution of malicious payloads or persistent malware installed in the system. However, this detection does not confirm malicious intent on its own, as legitimate system utilities may also interact with registry keys for valid reasons.

  ### Investigation Steps

  - **Examine the affected registry key**: Query the registry for changes to `HKU\<User SID>\Classes\CLSID\<Class ID>\TreatAs` using PowerShell command `Get-ItemProperty -Path HKU:\<User SID>\Classes\CLSID\<Class ID>\TreatAs`. Look for unusual values pointing to non-standard paths or executables.

  - **Verify the parent COM object**: Cross-reference the COM object being hijacked with known legitimate applications. Use `Get-Item -Path HKU:\<User SID>\Classes\CLSID\<Class ID>` to check the underlying application legitimacy based on GUID information.

  - **Check for unexpected svchost.exe usage**: Analyze event logs identifying that `svchost.exe` is modifying these registry keys (Security Event ID 4657). Look for instances where its image path does not match common legitimate svchost usage.

  - **Identify recent system activity**: Review Windows Event Log Security (Event ID 4688) for recent process creations associated with the given user account, especially for processes that may interact with COM objects or modify registry keys.

  - **Look for common legitimate uses**: Legitimate applications may modify the TreatAs subkey for compatibility reasons. However, these instances are often limited and should not appear frequently. Investigate the context around benign activity for background processes.

  - **Search for other indicators of compromise**: Validate file creation or modification artifacts correlated with the suspicious registry entries by checking for uncommon or hidden files created in typical executable paths (C:\Program Files\ or C:\Windows\Temp\), combined with file timestamps.

  ### Prioritization

  This alert is considered medium severity due to the potential for privilege escalation and persistence on critical systems. The likelihood of malicious exploitation is notable, given the specific behavior of registry tampering for COM hijacking is a recognized technique often employed by adversaries to gain control or maintain footholds.

  ### Blind Spots and Assumptions

  Detection may miss sophisticated evasion techniques where attackers could manipulate the registry without apparent changes (e.g., employing legitimate-looking values). Reliable detection requires that registry auditing is enabled. Furthermore, some legitimate applications or system updates could trigger this alert without malicious intent, such as updating COM components for compatibility. Related detections include monitoring for unusual administrative access to the Windows registry itself or unexpected process creation events associated with COM objects.

