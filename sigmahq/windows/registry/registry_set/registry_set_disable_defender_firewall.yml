note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Registry that disable Microsoft Defender Firewall. By setting the registry value corresponding to firewall profiles (Domain, Public, or Standard) to `0`, an attacker can circumvent security controls, allowing unauthorized network activity. The primary tactic involved is Defense Evasion, specifically the technique T1562.004. The relevant telemetry source for this detection includes Windows Registry events, specifically the `registry_set` logs, which capture changes to registry keys. If malicious, this behavior could expose the system to external threats and facilitate lateral movement within the network. Importantly, this detection alone does NOT confirm malicious intent; legitimate administrative actions may trigger similar registry changes.

  ### Investigation Steps

  - **Check the registry value changes:** Identify Event IDs related to Registry modifications (e.g., Event ID 4657) and query for changes to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\*` where `EnableFirewall` is set to `0`.

  - **Review recent administrative actions:** Look for any legitimate administrative activities around the same time as the registry change in Windows Event Logs (Event ID 4688 for process creation), focusing on processes or users typically associated with security management tasks.

  - **Analyze endpoints for further compromises:** Check for any additional suspicious behavior or alerts on the affected host, such as unusual outbound network connections. This can be done by examining logs from firewalls or IDS/IPS solutions for anomalies.

  - **Profile normal operational behavior:** Document expected behavior for typical system configurations, ensuring that legitimate operations such as maintenance or updates infrequently change firewall settings. Look for common asset roles that should have firewalls enabled.

  - **Identify high-confidence malicious indicators:** Look for specific user accounts or automated tasks forming a pattern of disabling the firewall that aligns with known attack signatures or adversary tactics.

  ### Prioritization

  This alert warrants medium severity due to its potential impact on network security. The likelihood of malicious use is high, as disabling firewalls is a common tactic among adversaries. However, benign administrative actions can also trigger this rule, necessitating further investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive monitoring on all endpoints, particularly if certain registry changes are not logged due to configurations. Legitimate activities, such as IT maintenance or security configuration changes, may inadvertently trigger the alert. Companion detections like monitoring changes to other security settings (e.g., UAC or AV settings) could strengthen overall visibility into potential abuse.

