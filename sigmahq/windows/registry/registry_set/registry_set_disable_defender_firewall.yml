note: |
  ### Technical Context

  This Sigma rule detects any attempts to disable Microsoft Defender Firewall by modifying registry settings associated with the firewall policies. The likely objective of an attacker is to create a more favorable environment for subsequent malicious activities, such as data exfiltration or remote access, by bypassing critical host-based protections. This activity fits into MITRE ATT&CK’s Defense Evasion tactic (T1562.004), focused on bypassing security controls.

  Primary telemetry sources include Windows Registry Event logs, specifically monitoring changes to the keys related to firewall settings at `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy`. If successful, this modification can significantly reduce the security posture of the affected system. It is important to note that this detection does NOT confirm that malicious activity has occurred; it merely indicates that an important security control has been disabled.

  ### Investigation Steps

  - **Check registry changes**: Look for modifications to registry keys at `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy` specifically for `EnableFirewall`. Use Event ID 4657 (Registry Value Changed) to identify these changes.

  - **Review timestamps of changes**: Cross-reference the timestamps of the registry modifications with other security logs (e.g., Windows Security Event ID 4624 for successful logins) to establish context. Look for patterns that indicate suspicious timing or activity.

  - **Validate user accounts involved**: Investigate the user account that executed the changes. Security Event ID 4672 (Special Privileges Assigned to New Logon) can shed light on elevated account privileges that may have been exploited.

  - **Identify legitimate activity**: Determine the normal operational baseline by identifying processes that typically modify firewall settings (such as software updates or legitimate administrative tasks), as these account for benign changes and should not trigger alerts.

  - **Assess for high-confidence malicious indicators**: Look for processes such as PowerShell (Event ID 4104) executing commands that alter firewall settings or leverage tools like Mimikatz. These indicators can bolster the case for malicious activity.

  - **Validate application logs**: Check application logs (e.g., Windows Event Logs related to system configuration) for any recorded issues or alerts that coincide with the time of the registry changes.

  ### Prioritization

  The severity of this alert is medium due to the critical role firewall settings play in network security. There is a substantial likelihood that this behavior is used by adversaries to facilitate malicious activities, making it important for further investigation. Though not commonly weaponized directly, disabling firewalls often precedes or accompanies more harmful actions.

  ### Blind Spots and Assumptions

  This detection may miss evasion techniques where attackers utilize non-standard methods to modify firewall settings undetected, such as using malware or other system tools. Reliable detection requires properly configured logging to ensure that registry changes are captured. Benign scenarios such as system updates or legitimate administrative actions may also trigger this alert. A companion detection of overall firewall policy changes (such as monitoring creation or deletion) may provide better coverage and context.

