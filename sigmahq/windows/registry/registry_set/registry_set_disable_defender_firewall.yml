  ### Technical Context

  This Sigma rule detects modifications to the Windows registry that disable the Microsoft Defender Firewall, specifically changes to the values associated with the EnableFirewall key across different network profiles (Domain, Public, Standard). The likely attacker objective is to disable network traffic filtering, thereby facilitating further malicious activity without being detected. This behavior aligns with the MITRE ATT&CK tactic of **Defense Evasion** and the technique of **Disable or Modify System Firewall** (T1562.004).

  The primary telemetry source is Windows Registry change logs, specifically capturing events tied to the modification of the paths under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy`. If malicious, the impact could be significant as it exposes the system to network-based attacks and potential data exfiltration. Importantly, this detection does NOT confirm malicious intent on its own; it only indicates that the firewall has been disabled.

  ---

  ### Investigation Steps

  - **Check registry modification date and user context:** Use PowerShell to query the registry (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\*"). Compare the modification timestamp against user activity logs to determine if it aligns with expected changes.

  - **Review user and process activity:** Investigate the user account making the change by checking Security Event ID 4624 (Logon) for logon types and associated processes. Look for unusual accounts or processes that executed registry modifications.

  - **Determine legitimate usage patterns:** Identify any scheduled tasks or maintenance scripts that may routinely modify firewall settings, ensuring that expected operational procedures are documented and do not trigger false alerts.

  - **Identify high-confidence malicious indicators:** Check System Event Log (Event ID 7045) for any unauthorized service installations that may correlate with the timing of the registry modification. Malicious indicators may include entries related to malware installation.

  - **Validate network traffic before and after modification:** Review Windows Filtering Platform logs or network monitoring tools for any unusual inbound/outbound connections following the firewall disable event, looking for excessive traffic or connections to known bad IPs.

  - **Assess impact on critical assets:** Focus analysis on critical assets that require robust firewall policies. Adjust investigations accordingly if the affected endpoint is a server or domain controller.

  ---

  ### Prioritization

  Alerts related to the disabling of the Microsoft Defender Firewall should be prioritized as medium severity. Such actions pose a notable risk to the enterprise, particularly on critical systems, as they can enable lateral movement or data exfiltration by removing essential network safeguards. Although this behavior is sometimes employed by legitimate administrative processes, it is also commonly weaponized by adversaries.

  ---

  ### Blind Spots and Assumptions

  Potential detection limitations include the possibility of skilled adversaries restoring the firewall settings post-modification, evading immediate detection. The efficacy of this rule relies on active monitoring of Windows registry changes, and failures in capturing this telemetry may lead to missed detections. Legitimate activities, such as system updates or security audits, can also trigger these alerts. Companion detections that strengthen coverage include monitoring for anomalous process creations (Event ID 4688) immediately after registry modifications to identify patterns of malicious behavior.

