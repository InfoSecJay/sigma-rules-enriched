note: |
  ### Technical Context
  This detection rule identifies instances where adversaries disable Microsoft Defender Firewall via modifications to the Windows registry. Such actions may be indicative of an attacker’s efforts to bypass security controls that restrict unauthorized network communications. The disabling of firewalls is a common tactic used by threats to facilitate further malicious activities, such as data exfiltration, lateral movement, or the deployment of additional payloads without interference from built-in security measures.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), specifically the technique **Disable or Modify Tools** (T1562.004). Adversaries may execute this tactic to modify the firewall settings, making the system more vulnerable to subsequent attacks. Telemetry logs from registry modifications will provide the best evidence for detecting this behavior, especially focusing on changes to the `EnableFirewall` DWORD value located in the relevant profiles of the Windows firewall settings.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent modifications in the registry, specifically targeting values under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\` for changes to the `EnableFirewall` DWORD across all profiles.

  - **Correlate with User Activity:** Analyze user account activity around the time of the registry change to identify any unusual or unauthorized logins, especially those associated with administrative privileges.

  - **Inspect Network Flow Data:** Investigate network logs and flows for unusual outbound traffic patterns that could indicate evasion of the firewall, such as communication on non-standard ports or to unrecognized external IP addresses.

  - **Check for Related Events:** Look for other potentially related events preceding or following the registry modification, such as suspicious process executions or use of remote command execution tools that may coincide with the firewall changes.

  ### Prioritization
  The alert should be classified with medium severity due to the significant risk posed by the disabling of firewall protections can expose the network to further malicious activity. Since attackers often exploit this technique as a precursor to deeper system compromises, any such alert warrants immediate investigation.

  ### Blind Spots and Assumptions
  Potential blind spots include environments where custom configurations or third-party firewalls are in use, which may not be covered by this specific detection logic. The rule assumes that the logs for registry modifications are properly collected and monitored; inadequate logging settings could hinder effective detection. It also could miss legitimate administrative actions, depending on the organization's operational protocols regarding firewall management.

