note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry that are associated with persistence techniques using GlobalFlags and SilentProcessExit keys. The likely attacker objective is to create stealthy persistence mechanisms that remain undetected by traditional security tools, allowing continued access or control over compromised systems. The relevant MITRE ATT&CK techniques for this behavior include **Persistence via Image File Execution Options (T1546.012)** and **Privilege Escalation via Access Token Manipulation (T1075)**.

  The primary telemetry sources for this alert are Windows Registry logs, specifically changes to the TargetObject fields relevant to the GlobalFlag and SilentProcessExit keys. If malicious, these behaviors could enable attackers to maintain a foothold within the environment, bypassing security controls and potentially leading to further exploitation or data exfiltration. It is important to note that this detection does NOT confirm malicious activity on its own; further investigation into the context and impact of these changes is required.

  ### Investigation Steps

  - **Identify recent registry modifications:** Query Windows Security Event ID **4657** for changes related to `GlobalFlag` and `SilentProcessExit`. Look for entries with unusually short timestamps that indicate rapid changes made by non-standard users.

  - **Review key user activity:** Check for non-administrative user accounts altering the registry paths `\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\GlobalFlag` and `SilentProcessExit`. Legitimate modifications typically originate from administrative accounts or system processes.

  - **Analyze process activity:** Use Sysmon Event ID **1** to correlate processes that may have triggered registry changes. Identify any suspicious or unauthorized processes accessing the modified registry keys within a narrow time window.

  - **Search for persistence indicators:** Inspect all user profiles for hidden or scheduled tasks that reference `GlobalFlag` or `SilentProcessExit`. Review Scheduled Task logs (Event ID **4698**) for unusual configurations that may indicate persistence methods.

  - **Validate file activity:** Monitor for file creations or modifications in sensitive directories (e.g., `C:\Windows\System32`) that coincide with the registry changes. Check for unusual timestamps, especially near the registries' alteration times.

  - **Cross-reference attack patterns:** Compare the identified registry changes with known APT patterns or exploitation techniques listed in the MITRE ATT&CK database to establish context and assess the relevance of the findings.

  ### Prioritization

  This alert should be considered high severity due to the potential impact of persistence mechanisms in an enterprise environment. The ability for an attacker to establish a foothold can lead to extensive data breaches, lateral movement, or control over critical systems. Additionally, the use of these techniques is commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations may arise from attackers utilizing tampering techniques to modify logs or employ alternative methods for persistence that do not involve these registry keys. It is essential to ensure comprehensive logging for registry modifications (Audit Registry Subkeys under Local Security Policy). Legitimate activities that may trigger this alert include software updates or system maintenance tasks executed by authorized users. Companion detections, such as monitoring for Task Scheduler modifications (Event ID **4698**) or abnormal user behavior patterns, can strengthen detection coverage and provide a clearer security posture.

