note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows Registry keys that indicate potential persistence mechanisms employed by attackers. The behavior observed includes the manipulation of the GlobalFlags and SilentProcessExit keys within the Image File Execution Options. The likely attacker objective is to hide malicious processes or establish persistence to ensure that harmful actions are retained across system reboots.

  This detection is associated with the MITRE ATT&CK tactic of Persistence (T1546.012) and Privilege Escalation. The primary telemetry source involves Windows registry changes logged as registry_set events. If successful, this activity can allow an adversary to maintain control over a compromised system, significantly increasing its security impact. However, this detection does NOT confirm that malicious activity occurred on its own; further scrutiny is essential to distinguish between benign and potentially harmful configurations.

  ### Investigation Steps

  - **Examine recent registry changes:** Query registry activity using Windows Event ID 4657 or Sysmon Event ID 13 for the keys '\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\GlobalFlag' and '\SilentProcessExit'. Look for unusual user accounts making these changes.

  - **Identify the responsible application:** Cross-reference the creation or modification timestamps of the registry keys with corresponding process creation logs (Event ID 4688), paying attention to the parent-child relationship. Malicious processes often show unexpected parent processes.

  - **Review for benign usage:** Check if legitimate applications (e.g., debuggers) are configured to use GlobalFlags. Note that legitimate usage might include known developer tools or authorized system processes.

  - **Detect a high-confidence malicious indicator:** Investigate if any processes linked to the registry changes are unusual or have been flagged by security tools. Look for executable paths that do not match known software installations (e.g., paths containing temp folders).

  - **Validate file creation artifacts:** Assess the system for evidence of malicious file creation or exfiltration that corresponds with the registry alterations. This may include reviewing Windows Event IDs 4663 (file access) and 5145 (failed access attempts) to identify abnormal file operations.

  ### Prioritization

  This alert is of high severity due to the potential impact on critical systems, particularly if the affected asset holds sensitive data or administrative access. The likelihood of malicious abuse is significant, as the GlobalFlags and SilentProcessExit manipulations are frequently leveraged in sophisticated attacks to maintain persistence and evade detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the lack of comprehensive logging configurations or if certain registry modifications are not logged across all environments. Legitimate activities such as software debugging or development tasks can trigger this alert, necessitating context-aware triage. A related detection to enhance coverage includes monitoring for suspicious process executions that match known malicious patterns (e.g., via Sysmon Event ID 1 for process creation).

