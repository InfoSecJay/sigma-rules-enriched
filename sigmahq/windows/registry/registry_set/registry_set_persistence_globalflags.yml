note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows registry keys related to GlobalFlags and SilentProcessExit, which are commonly used to achieve persistence by malicious actors. The likely attacker objective is to maintain control over a system even after reboots or defenses are implemented. This behavior is associated with the MITRE ATT&CK tactic of **Persistence** and the technique **T1546.012: Event Triggered Execution**. Primary telemetry sources include Windows registry change logs, specifically monitoring the registry set category for the paths related to GlobalFlags and SilentProcessExit. A successful malicious alteration may allow an adversary to stealthily execute code while circumventing standard monitoring tools. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate applications may also modify these keys.

  ### Investigation Steps

  - **Identify registry changes: ** Query Windows Registry logs (Event ID 4657) focusing on modifications to the paths `\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\GlobalFlag` and `\Microsoft\Windows NT\CurrentVersion\SilentProcessExit`. Look for suspicious timeframes or user accounts associated with the modifications.

  - **Correlate with known binaries: ** Validate the modification history against known processes. Benign modifications typically involve system processes (e.g., `svchost.exe`), while unexpected alterations could indicate malicious activity.

  - **Check for additional flags: ** Review the registry for other flags and settings in the `Image File Execution Options` that may have been altered (Event ID 4657). Specific keys, like `Debugger` entries, can indicate attempts to hide or manipulate legitimate executables.

  - **Assess process behavior: ** Look for running processes that correspond to the modified keys using Sysinternals Process Monitor or Security Event ID 4688. Legitimate entries will often correspond to system processes; look for irregular or newly introduced executable names.

  - **Confirm file system changes:** Review recently created or modified files in system directories (Event ID 4616) that may indicate malware deployment connected with registry modifications. Investigate alterations in directories like `C:\Program Files` or `C:\Windows`.

  - **Investigate account activity:** Analyze user activity logs to identify unauthorized access or changes made by unusual accounts, particularly those with administrative privileges (Event ID 4624).

  ### Prioritization

  This alert is high severity due to its potential impact on system integrity and user data. The likelihood of malicious abuse is significant, as persistence mechanisms utilizing registry modifications are frequently weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Possible evasion techniques include attackers reverting changes immediately after their actions to blend in. Detection may also depend on specific Windows log types being enabled and collected, particularly around registry modifications. Legitimate activities, such as software installations or debugging by developers, may unintentionally trigger this alert. A related detection could include monitoring modifications to the `Run` or `RunOnce` keys in the registry, which are also common for persistence techniques.

