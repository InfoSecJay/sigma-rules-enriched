title: Session Manager Autorun Keys Modification
id: 046218bd-e0d8-4113-a3c3-895a12b2b298
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: Detects modification of autostart extensibility point (ASEP) in registry.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin,
  oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
- attack.t1546.009
logsource:
  category: registry_set
  product: windows
detection:
  session_manager_base:
    TargetObject|contains: '\System\CurrentControlSet\Control\Session Manager'
  session_manager:
    TargetObject|contains:
    - '\SetupExecute'
    - '\S0InitialCommand'
    - '\KnownDlls'
    - '\Execute'
    - '\BootExecute'
    - '\AppCertDlls'
  filter:
    Details: '(Empty)'
  condition: session_manager_base and session_manager and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This rule detects modifications to autostart extensibility points (ASEPs) within the Windows registry, specifically targeting the Session Manager. Such modifications can indicate an attempt by an attacker to maintain persistence on a compromised system or escalate privileges. By changing registry keys that control autostart processes, an attacker can ensure that malicious applications are executed automatically when the system boots or sessions start, potentially allowing for ongoing remote access or control.

  The threat scenario often involves advanced persistent threats (APTs) or other sophisticated attackers aiming to persistently control the environment post-compromise. Modifications to keys such as `\SetupExecute`, `\BootExecute`, and `\AppCertDlls` are typically associated with techniques for establishing persistence as identified in the MITRE ATT&CK framework. Specifically, this rule relates to the following tactics and techniques: **Persistence (T1547.001)** and **Privilege Escalation (T1546.009)**.

  Primary data sources for effective detection include registry change logs, which can reveal unauthorized modifications, as well as process creation events to correlate any executed commands associated with changes to these keys. Monitoring these aspects can help identify potential alarming behavior indicative of a security incident.

  ### Investigation Steps
  - **Review Registry Logs**: Check logs pertaining to registry modifications for entries related to the Session Manager and specifically the keys identified in the detection logic (`\SetupExecute`, `\BootExecute`, etc.) to find unauthorized changes.
  - **Analyze Process Creation Logs**: Cross-reference any registry modifications with process creation events around the same time to identify potentially malicious processes that may have been facilitated by the changes made.
  - **Inspect User Accounts**: Investigate which user account performed the modifications. Look for unusual accounts or those that should not have the required permissions to alter these registry settings.
  - **Assess System Behavior**: Monitor the system for any unusual behavior following the registry modifications, such as unexpected application launches or network connections that could indicate an active piece of malware.

  ### Prioritization
  This alert is of medium severity due to its potential implications for enterprise security. The ability to maintain persistence indicates ongoing threat actor presence, which poses significant risks regarding data exfiltration or further compromise.

  ### Blind Spots and Assumptions
  There may be gaps in detection if legitimate software installations or administrative actions modify these keys without logging them properly. The detection logic assumes that accurate and comprehensive registry change logs are available in the environment. Additionally, some legitimate activity may trigger false positives, such as authorized installations or administrative updates, which may obscure actual malicious attempts if not properly analyzed.

