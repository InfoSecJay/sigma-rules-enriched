logsource:
  category: registry_set
  product: windows
detection:
  session_manager_base:
    TargetObject|contains: '\System\CurrentControlSet\Control\Session Manager'
  session_manager:
    TargetObject|contains:
    - '\SetupExecute'
    - '\S0InitialCommand'
    - '\KnownDlls'
    - '\Execute'
    - '\BootExecute'
    - '\AppCertDlls'
  filter:
    Details: '(Empty)'
  condition: session_manager_base and session_manager and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Session Manager Autorun Keys, which are critical registry settings in Windows that specify commands to run automatically at system startup. The likely attacker objective is to achieve persistence on a compromised system by manipulating these keys, enabling malicious code to execute every time the system starts.

  The relevant MITRE ATT&CK tactics and techniques include **Persistence** (T1547) and **Privilege Escalation** (T1546.009). Primary telemetry sources are Windows Registry logs, especially focusing on changes to keys such as `\SetupExecute`, `\BootExecute`, and others under `\System\CurrentControlSet\Control\Session Manager`. If malicious, these modifications can lead to persistent malware execution, creating a significant security risk. However, this detection does NOT confirm malicious intent on its own; it merely indicates that changes were made to the registry that could be suspicious.

  ### Investigation Steps

  - **Verify the registry modification: ** Check registry keys: Query `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Session Manager` for recent changes and note the values of `SetupExecute`, `BootExecute`, and `AppCertDlls`. Document any key names and their associated values that are not part of the standard configurations.

  - **Cross-ref against known software signatures: ** Review any recent software installations or updates, checking if legitimate programs often modify these autorun keys—refer to documentation or community lists for benign software behaviors.

  - **Look for malware signatures: ** Examine the modified key values for known malicious file paths or signatures. Use a threat intelligence platform to identify any associated malware with these registry changes, especially looking for behavior consistent with T1547.

  - **Identify user actions: ** Correlate the timing of the registry modification with user account activities across the Security Event Log (Event ID 4624). Legitimate administrator actions should align with modifications; determine whether appropriate users were logged in at the time.

  - **Check for normal session management tasks: ** Query for routine system operations around the time of the modification within System Event Logs (Event ID 7045) to differentiate expected activity from potential exploits, ensuring this context is in line with standard IT maintenance.

  - **Document potential persistence methods: ** Assess if the changes align with known persistence techniques outside of legitimate software behavior. Capture any entries that do not map to standard procedures or are argued as suspicious due to the timing or context of their creation.

  ### Prioritization

  This alert holds a medium severity level due to the potential for significant impact on system security from compromised autorun configurations. The likelihood of malicious abuse is notable, as modifying these keys is a commonly weaponized technique among threat actors for establishing persistence.

  ### Blind Spots and Assumptions

  Detection may miss evasion techniques where legitimate software settings are manipulated to disguise malicious changes to the autorun keys. Ensure that full registry logging is enabled for comprehensive monitoring. Legitimate activities such as admin-initiated software installations or system maintenance may trigger this alert. A related detection of interest includes monitoring for suspicious process creations (Event ID 4688) after the registry changes, as it may indicate whether the modifications lead to malicious code execution.

