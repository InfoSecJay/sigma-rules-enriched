note: |
  ### Technical Context

  This Sigma rule detects modifications in the Windows registry specifically targeting the 'DisablePrivacyExperience' setting, which, when disabled, alters user privacy settings, potentially facilitating unauthorized data collection or information disclosure. The likely attacker objective is to impair user privacy controls and enact further malicious activities unnoticed. This behavior corresponds to the MITRE ATT&CK technique T1685 (Defensive Evasion).

  The primary telemetry sources for detection include Windows registry change logs. Specifically, the registry events detailing modifications to the TargetObject at the path `\SOFTWARE\Policies\Microsoft\Windows\OOBE\DisablePrivacyExperience`. If malicious, such modifications could enable an attacker to collect sensitive information from the system. It's crucial to note that this detection alone does NOT confirm malicious intent; legitimate administrative actions may also alter this registry key.

  ### Investigation Steps

  - **Examine recent registry changes:** Review Windows Security Event ID 4657 (Registry value modified) for alterations to `\SOFTWARE\Policies\Microsoft\Windows\OOBE\DisablePrivacyExperience`. Note timestamp and user context to identify potential unauthorized changes.

  - **Identify administrative scripts or policies:** Check for any recent application of group policies or administrative scripts that may have legitimately modified this registry key. Verify log files in `C:\Windows\System32\GroupPolicy\Machine\Registry.pol` for updates indicating legitimate actions.

  - **Assess user accounts involved in changes:** Look for anomalous user activity by analyzing Security Event ID 4624 (Logon) logs around the time of the registry change to determine if an unauthorized or unexpected account performed the action.

  - **Review unauthorized configuration attempts:** Search for associated Windows Event ID 7045 (Service Installation) or Event ID 4697 (Service Principal Name modified), which could indicate attempts to create or modify services in conjunction with disabling privacy features, signifying potential malicious intent.

  - **Analyze installed software for known exploits:** Utilize tools like `PowerShell Get-WmiObject` to enumerate recently modified software or executables on the host that may be known exploit targets. Malicious actors could attempt to exploit privacy settings via compromised applications.

  ### Prioritization

  This alert has medium severity due to the potential impact on user privacy and the likelihood of exploitation by adversaries. While disabling privacy settings can be leveraged by malicious actors to further their objectives, many legitimate administrative actions may trigger this alert, necessitating careful assessment.

  ### Blind Spots and Assumptions

  Detection is limited by the potential for legitimate administrative actions to trigger this alert, presenting a risk of false positives. Analysis requires thorough logging at the registry level; without comprehensive logging policies, critical modifications could go unnoticed. Legitimate activities that may trigger this alert include specific administrative scripts intended to modify privacy settings for legitimate use cases. Companion detections could include monitoring for unusual account activity or changes in Windows policies that may indicate broader malicious behavior.

