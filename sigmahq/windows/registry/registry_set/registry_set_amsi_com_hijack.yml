logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32\(Default)'
  filter:
    Details: '%windir%\system32\amsi.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects changes to the AMSI COM server registry key, specifically targeting the modification of the COM component that should point to the legitimate AMSI DLL (`amsi.dll`). The likely attacker objective is to bypass AMSI protections, which are essential for detecting malicious scripts and executables, effectively disabling key security mechanisms. This behavior fits within the MITRE ATT&CK framework under the tactic "Defense Evasion" and technique "AMSI Bypass" (T1685). The primary telemetry source is Windows Registry changes, specifically monitoring keys related to COM server configurations. If successful, an adversary may execute undetected malware, leading to significant security impacts, including data breaches or system compromise. It is important to note that this detection alone does not confirm an active attack; it indicates a potential preparation phase for one.

  ### Investigation Steps

  - **Check registry changes:** Review Registry Event Logs (Event ID 4657) for modifications to the path `HKEY_CLASSES_ROOT\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32`. Look for alterations unrelated to known applications or legitimate software installations.

  - **Validate registry values:** Verify the `(Default)` value under the specified CLSID key; it should point to `%windir%\system32\amsi.dll`. Any deviation may indicate malicious activity.

  - **Identify behavior of legitimate applications:** Look for any known legitimate applications that might modify the AMSI registry key during updates or installations. This could include software installations or updates that explicitly mention COM component modifications.

  - **Correlate with process activity:** Analyze Security Event ID 4688 for process creation events around the same timestamp as the registry change. Look for processes associated with known benign software versus unexpected executables that might suggest exploitation.

  - **Search for lateral movement:** Investigate network logins (Event ID 4624) or account activity that could correlate with this alert. High-risk accounts accessing the registry remotely may indicate potential malicious intent.

  - **Conduct endpoint analysis:** Use endpoint detection and response (EDR) tools to look for associated artifact creation (e.g., files, executables, temp files) at the same time the registry change occurred, indicating possible command-and-control activity.

  ### Prioritization

  This alert is classified as high severity due to the critical nature of AMSI in Windows security. The likelihood of abuse is high, as techniques to bypass AMSI are commonly weaponized by adversaries for malware delivery. Systems impacted by this change may face severe consequences, including compromised defenses against various threats.

  ### Blind Spots and Assumptions

  This detection may not account for sophisticated bypass techniques that utilize legitimate framework updates or benign software modifications to alter the registry subtly. Proper log sources, including detailed registry auditing, must be enabled for reliable detection. Legitimate activities could include software updates from trusted vendors that require temporary registry changes. A companion detection to consider is monitoring for suspicious PowerShell commands indicating attempts to execute scripts that would normally trigger AMSI checks.

