title: Potential AMSI COM Server Hijacking
id: 160d2780-31f7-4922-8b3a-efce30e63e96
status: test
description: Detects changes to the AMSI come server registry key in order 
  disable AMSI scanning functionalities. When AMSI attempts to starts its COM 
  component, it will query its registered CLSID and return a non-existent COM 
  server. This causes a load failure and prevents any scanning methods from 
  being accessed, ultimately rendering AMSI useless
references:
- https://enigma0x3.net/2017/07/19/bypassing-amsi-via-com-server-hijacking/
- https://github.com/r00t-3xp10it/hacking-material-books/blob/43cb1e1932c16ff1f58b755bc9ab6b096046853f/obfuscation/simple_obfuscation.md#amsi-comreg-bypass
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-01-04
modified: 2023-08-17
tags:
- attack.defense-evasion
- attack.t1562.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32\(Default)'
  filter:
    Details: '%windir%\system32\amsi.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects modifications to the Windows Registry key associated with the Anti-Malware Scan Interface (AMSI) COM server, specifically targeting the CLSID that points to the AMSI DLL. An attacker may seek to hijack this registry setting to disable AMSI, effectively bypassing security controls designed to detect and block malicious activities. This behavior fits into the MITRE ATT&CK framework under the tactic of Defense Evasion (T1562.001).

  The primary telemetry source is Windows Registry event logs regarding changes to `HKEY_CLASSES_ROOT\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32\(Default)`. If successful, such modifications could allow malware to execute without detection, significantly impacting the organization's security posture. It should be noted that this alert alone does not confirm an active attack; rather, it indicates a potential bypass of built-in security mechanisms.

  ### Investigation Steps

  - **Verify the registry change**: Check `HKEY_CLASSES_ROOT\CLSID` for the modification to the key `{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32\(Default)`. Compare the current value against known good states or standard configurations for legitimate AMSI deployment.

  - **Identify the user context of the change**: Retrieve the user and process that made the registry change using Security Event ID 4688 (process creation) to track any suspicious activity. Pay close attention to processes initiated by unexpected users or from unusual locations.

  - **Monitor for related process execution**: Look for recent executions of AMSI-invoking executables or scripts (e.g., PowerShell) by correlating Sysmon Event ID 1 (process creation) with telemetry indicating attempts to call AMSI functions following the registry change.

  - **Investigate system and application logs**: Review Windows Event Logs (Application and Security logs) for relevant activity within the timeframe of the registry change. Look for events indicating script execution or application behavior that may correlate with the registry modification.

  - **Assess the asset criticality**: Determine the role of the affected system. If it’s a critical asset within the environment (e.g., domain controllers, endpoints with sensitive data), prioritize the investigation.

  - **Establish baseline behavior**: Document expected legitimate configurations and application behavior that would typically invoke AMSI functions, such as standard software installations or updates. Compare these against the current telemetry to identify discrepancies.

  ### Prioritization

  This alert carries a high severity due to its potential impact on security controls, specifically the disabling of AMIS functionalities, which is critical for malware detection and prevention. The likelihood of abuse is significant, as disabling AMSI is a tactic frequently employed by sophisticated attackers, especially in environments where AMSI offers a primary layer of defense.

  ### Blind Spots and Assumptions

  Evasion techniques may include legitimate software installations altering the registry without malicious intent, potentially generating false positives. Effective detection requires registry monitoring and System Internals tools (like Sysmon) configured to capture process execution events accurately. Legitimate activities such as software updates may trigger this alert and should be carefully considered in the investigation. Companion detections, such as monitoring for unexpected PowerShell activity, can enhance coverage against this kind of evasion technique.

