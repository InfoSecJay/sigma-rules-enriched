  ---

  ### Technical Context

  This Sigma rule detects modifications to the AMSI COM server registry key, specifically targeting the loading of the AMSI scanning functions by manipulating its COM object registration. The likely attacker objective is to disable AMSI functionality, which is a defense mechanism against script-based malware, thereby allowing malicious scripts to execute undetected. This behavior falls under the MITRE ATT&CK tactic of **Defense Evasion** (T1562.001).

  The primary telemetry source for this detection is the Windows Registry, specifically monitoring registry set actions that alter the key located at `\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32\(Default)`. If successful, this modification could disable AMSI, enabling script-based attacks without triggering defenses. Importantly, this detection does NOT confirm malicious intent on its own—legitimate software could also modify this registry key.

  ---

  ### Investigation Steps

  - **Review the registry key modification: **Check for changes to the registry key at `HKEY_CLASSES_ROOT\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32\(Default)`:** Correlate with security event logs (Event ID 4663) that document which user or process made the change. A legitimate application’s path should not point to anything unusual or non-standard.

  - **Correlate with recent process activity: **Examine associated process creation logs (Event ID 4688 or Sysmon Event ID 1) to identify any processes that executed around the same time as the registry change:** Look for unexpected script execution (such as PowerShell or command scripts) that could indicate malicious activity.

  - **Check for existing AMSI.dll presence: **Ensure that `amsi.dll` exists at `%windir%\system32\`:** If absent, it’s a strong indication that something is trying to disable AMSI, and you should escalate the incident.

  - **Identify known malicious indicators: **Search for event logs that include execution of known Meterpreter or malicious PowerShell commands:** The presence of such commands would indicate a higher confidence in malicious activity correlating with the registry key modification.

  - **Analyze Windows event logs for anomalies: **Investigate other Event IDs such as 4672 (Special Logon) and 4648 (Logon Attempt) that coincide with the modification:** This can help identify if an elevated privilege was used inappropriately during the change to the registry settings.

  ---

  ### Prioritization

  This alert has a **high** severity due to the potential impact on endpoint security; disabling AMSI could allow significant script-based attacks. The likelihood of malicious abuse is elevated as the behavior is commonly weaponized by threat actors seeking to evade detection mechanisms.

  ---

  ### Blind Spots and Assumptions

  The detection may be evaded if the attacker employs techniques to revert changes or create multiple layers of software obscuring the modification. Reliable detection is contingent upon logging policy ensuring that registry modifications (Event ID 4663) are captured. Additionally, legitimate applications using non-standard scripts may trigger this alert, necessitating thorough investigation into executive behavior. A related detection rule to consider is one that alerts on unusual PowerShell execution, providing additional context to script activity.

