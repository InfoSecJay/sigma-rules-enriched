logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32\(Default)'
  filter:
    Details: '%windir%\system32\amsi.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential attempts to hijack the Application Memory Snapshot Interface (AMSI) COM server by monitoring changes to critical registry keys. The AMSI is designed to help applications detect and report malicious code, particularly in PowerShell and other scripting environments. Attackers seeking to disable AMSI may alter the registry to redirect calls to a non-existent COM server, thereby disabling the scanning functionality. This method is typically employed in the context of avoiding detection by security tools, allowing malicious payloads to execute without triggering alarms.

  The primary objective of the attacker in this scenario is to evade detection during the execution of their payloads, which may include malicious scripts or binaries. The likely threat family associated with this technique includes known evasion techniques utilized by various malware strains as part of broader operations to maintain persistence and avoid detection. Relevant MITRE ATT&CK tactics/techniques include:
  - Defense Evasion (TA0005)
  - Impair Defenses (T1562.001)

  The data sources most pertinent to this detection rule are Windows registry logs, focusing particularly on registry modifications that indicate changes to the AMSI COM server entry.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the Windows registry logs for any changes made to the `HKEY_CLASSES_ROOT\CLSID\{fdb00e52-a214-4aa1-8fba-4357bb0072ec}\InProcServer32` key. Look for modifications that might indicate redirection or tampering.

  - **Validate AMSI Functionality:** Confirm if AMSI is functioning correctly on the affected machine by attempting to invoke AMSI-related functionalities and checking for expected behaviors.

  - **Analyze Execution Logs:** Check application logs for recent executions of scripts or binaries around the time of the registry modification. Investigate any scripts that might have been executed, looking for potentially malicious content.

  - **Monitor for Related Activities:** Look for other indicators of compromise, including unusual process creations, particularly those that involve PowerShell or other scripting engines, as these commonly leverage AMSI.

  ### Prioritization
  Given the potential for significant impact on the security posture of the organization, particularly in environments where scripting is prevalent, this alert is marked with high severity. The likelihood of successful exploitation to evade detection further amplifies the urgency of this detection.

  ### Blind Spots and Assumptions
  This detection rule may not capture all potential methods for disabling AMSI, such as those that do not modify the registry or utilize other legitimate mechanisms to evade detection. The detection logic assumes that the registry keys relevant to AMSI are accessible and that modifications will trigger logging. For optimal functionality, comprehensive logging must be ensured, including changes in the Windows registry, so that any tampering can be adequately captured.

