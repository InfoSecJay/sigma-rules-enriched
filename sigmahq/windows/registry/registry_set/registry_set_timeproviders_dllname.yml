title: New TimeProviders Registered With Uncommon DLL Name
id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
status: test
description: |
  Detects processes setting a new DLL in DllName in under HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider.
  Adversaries may abuse time providers to execute DLLs when the system boots.
  The Windows Time service (W32Time) enables time synchronization across and within domains.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.003/T1547.003.md
author: frack113
date: 2022-06-19
modified: 2024-03-26
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1547.003
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Services\W32Time\TimeProviders'
    TargetObject|endswith: '\DllName'
  filter_main_w32time:
    Details:
    - '%SystemRoot%\System32\vmictimeprovider.dll'
    - '%systemroot%\system32\w32time.dll'
    - 'C:\Windows\SYSTEM32\w32time.DLL'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the registration of new Time Providers under the Windows Time service (W32Time) with uncommon DLL names. Adversaries might exploit this mechanism to gain persistence on a compromised system, as any DLL specified in the DllName registry key will execute when the system boots. By injecting malicious DLLs into the W32Time service, attackers can ensure their payloads run with system-level privileges, potentially leading to a foothold in the environment or even lateral movement.

  The relevant MITRE ATT&CK techniques this rule addresses are:
  - **T1547.003: Boot or Logon Autostart Execution: Windows Service** – using Windows services to maintain persistence.
  This technique highlights the adversary's intent to maintain access and control over systems by manipulating Windows services, thereby achieving persistence through non-traditional methods.

  Primary data sources for detecting this activity include:
  - **Registry logs** – specifically monitoring changes to the registry path under HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider.
  - **Event logs** – Windows Security Event Logs that track service creation or modification events could provide insight into any unauthorized access or changes.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the registry under HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProviders for any unauthorized or unfamiliar DLL names that differ from standard time provider DLLs.
  - **Analyze Event Logs**: Investigate Windows Event Logs, specifically focusing on events associated with service creation or modification, to determine the timing and source of registry changes.
  - **Correlate with EDR Data**: Use Endpoint Detection and Response (EDR) tools to analyze process creation events linked to the identified DLLs, looking for any unusual behaviors or process trees that may indicate malicious activity.
  - **Validate DLL Signatures**: Check the digital signatures of the DLLs associated with the time providers to ensure they are from legitimate sources and not previously unknown or unsigned binaries.

  ### Prioritization
  This alert is high severity due to the significant risk it poses; unauthorized DLLs in the Windows Time service can lead to persistent malicious presence that could compromise entire networks, especially in enterprise environments where centralized time synchronization is critical for security event logging and operational functionality.

  ### Blind Spots and Assumptions
  Detection logic may miss signs of access through alternative persistence mechanisms or if DLLs are modified in less common ways that do not trigger observable registry changes. It assumes that logs for registry modifications are correctly configured and retained in a sufficient time frame for investigations. Additionally, environments that do not enforce file integrity monitoring on sensitive directories might overlook indicators of compromise associated with malicious DLLs.

