title: New TimeProviders Registered With Uncommon DLL Name
id: e88a6ddc-74f7-463b-9b26-f69fc0d2ce85
status: test
description: |
  Detects processes setting a new DLL in DllName in under HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider.
  Adversaries may abuse time providers to execute DLLs when the system boots.
  The Windows Time service (W32Time) enables time synchronization across and within domains.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.003/T1547.003.md
author: frack113
date: 2022-06-19
modified: 2024-03-26
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1547.003
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Services\W32Time\TimeProviders'
    TargetObject|endswith: '\DllName'
  filter_main_w32time:
    Details:
    - '%SystemRoot%\System32\vmictimeprovider.dll'
    - '%systemroot%\system32\w32time.dll'
    - 'C:\Windows\SYSTEM32\w32time.DLL'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects the registration of new Dynamic Link Libraries (DLLs) within the Windows Time Service's time provider configuration, specifically targeting modifications to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider`. Attackers may exploit this registry setting to execute custom DLLs during system startup, potentially enabling persistence mechanisms and allowing unauthorized control over the system time, which may facilitate further malicious activities such as timestamp manipulation for evasion purposes.

  The relevant MITRE ATT&CK tactic is **Persistence** (TA0003) with the technique **Registry Run Keys / Startup Folder** (T1547.003). The primary telemetry source is Windows registry changes, specifically monitoring registry set events.

  If detected, this behavior can pose a significant security risk as it indicates potential malicious configurations allowing untrusted code execution at startup. However, this detection does NOT confirm that the DLL is indeed malicious without further context.

  ---

  ### Investigation Steps

  - **Review the registry modification details:** Access the registry change logs for Event ID 4657 and confirm the `TargetObject` path for alterations under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\W32Time\TimeProvider`. Look for unusual or unexpected DLL names that do not align with known system processes.

  - **Identify high-confidence malicious indicators:** Check the registry modification record for entries that contain suspicious or uncommon DLL names (e.g., anything not recognized as part of the base Windows installation). This includes filenames that appear obfuscated or non-standard for system DLLs.

  - **Validate legitimate activity:** Confirm whether any authorized applications or services that your organization uses intentionally modify Windows Time Service settings. Review any documented maintenance activities or scheduled tasks that could justify legitimate changes to the W32Time provider.

  - **Cross-verify with system processes:** Using Sysmon Event ID 1, compare running processes during the time of the registry change to verify whether any processes are executing from the newly registered DLL path. Look for unusual parent-child relationships or command line arguments.

  - **Assess the context of system impact:** Determine the role of the affected system (e.g., domain controller, file server) to evaluate the security implications of a compromised time service, especially focusing on systems critical to Active Directory functions or security event logging.

  - **Check for existing alerts or related detections:** Review alerts related to time manipulation anomalies or suspicious process behaviors to identify any ongoing incidents that may correlate with the detected registry change.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the security implications surrounding unauthorized DLL registration in a critical system service. The potential for malicious abuse is significant, as attackers often leverage such techniques for persistence when targeting high-value assets, particularly those involved in domain management.

  ---

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers utilize common or legitimate DLLs, making it easier to evade detection. It relies on complete and accurate logging of registry modifications; any misconfigurations in log retention could hinder detection quality. Legitimate software updates or configurations may also trigger this alert. Companion detections, such as abnormal child processes spawned by the time service or suspicious loading of DLLs in other critical services, can enhance overall coverage and context for investigations.

