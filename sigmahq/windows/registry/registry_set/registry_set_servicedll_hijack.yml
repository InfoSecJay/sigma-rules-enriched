logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\System\'
    - 'ControlSet'
    - '\Services\'
    TargetObject|endswith: '\Parameters\ServiceDll'
  filter_main_printextensionmanger:
    Details: 'C:\Windows\system32\spool\drivers\x64\3\PrintConfig.dll'
  filter_main_domain_controller:
    Image: 'C:\Windows\system32\lsass.exe'
    TargetObject|endswith: '\Services\NTDS\Parameters\ServiceDll'
    Details: '%%systemroot%%\system32\ntdsa.dll'
  filter_main_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
  filter_optional_safetica:
    Image|endswith: '\regsvr32.exe'
    Details: 'C:\Windows\System32\STAgent.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative scripts
- Installation of a service
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects modifications to the "ServiceDll" registry value associated with Windows services, which are often leveraged by attackers for persistence on compromised systems. The primary objective of altering this registry entry is to execute malicious payloads that persist across reboots while masquerading as legitimate services. The relevant MITRE ATT&CK tactics are persistence (T1543.003) and privilege escalation.

  The primary telemetry source for this detection is Windows registry changes, specifically focusing on `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\<ServiceName>\Parameters\ServiceDll`. If the modification is malicious, it could result in an undetected backdoor or malware execution when the service is invoked. However, it is critical to note that this detection does NOT confirm a system compromise by itself; legitimate activities, such as administrative configurations and service installations, can trigger similar logs.

  ---

  ### Investigation Steps

  - **Review the registry changes:**
    Examine the registry path `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\<ServiceName>\Parameters\ServiceDll` for unusual or unauthorized entries related to known services.

  - **Analyze Event ID 4657 logs:**
    Check Security Event ID 4657 for any changes made to the registry's ServiceDll values. Look for entries with `TargetObject` indicating suspicious service names and `NewValue` containing potential malware DLL paths.

  - **Identify high-risk service modifications:**
    Focus on specific services with a recent change to their ServiceDll value. Verify if the new DLL file path corresponds to known malicious binaries or behaviors, such as `C:\Windows\System32\PrintConfig.dll`.

  - **Correlate with existing activity:**
    Validate the logs for legitimate administrative scripts or installations that might explain the change. Review the processes involved (Event ID 4688) to ensure they are from trusted sources during the time of registry modification.

  - **Check for known rogue services:**
    Cross-reference the modified service names against threat intelligence feeds for any known malicious services that might leverage these registry paths.

  ---

  ### Prioritization

  This alert has medium severity, as the detection of a change to ServiceDll values often indicates attempts at persistence that can lead to further exploitation. The affected systems' criticality amplifies this risk; services running with elevated privileges are prime targets for adversaries. Such behavior is commonly weaponized in advanced persistent threats (APTs).

  ---

  ### Blind Spots and Assumptions

  Evasion techniques such as using legitimate administrative scripts to modify the ServiceDll value could result in false positives. Comprehensive logging of registry changes and ensuring that Windows Event Logs are fully enabled will enhance detection reliability. Additionally, legitimate application updates or service reconfigurations may trigger this alert. A related detection to enhance overall coverage would be monitoring for unexpected service installations (Event ID 7045).

