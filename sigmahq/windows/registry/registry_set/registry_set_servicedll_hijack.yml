title: ServiceDll Hijack
id: 612e47e9-8a59-43a6-b404-f48683f45bd6
status: test
description: |
  Detects changes to the "ServiceDLL" value related to a service in the registry.
  This is often used as a method of persistence.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md#atomic-test-4---tinyturla-backdoor-service-w64time
- https://www.hexacorn.com/blog/2013/09/19/beyond-good-ol-run-key-part-4/
author: frack113
date: 2022-02-04
modified: 2024-04-03
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\System\'
    - 'ControlSet'
    - '\Services\'
    TargetObject|endswith: '\Parameters\ServiceDll'
  filter_main_printextensionmanger:
    Details: 'C:\Windows\system32\spool\drivers\x64\3\PrintConfig.dll'
  filter_main_domain_controller:
    Image: 'C:\Windows\system32\lsass.exe'
    TargetObject|endswith: '\Services\NTDS\Parameters\ServiceDll'
    Details: '%%systemroot%%\system32\ntdsa.dll'
  filter_main_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
  filter_optional_safetica:
    Image|endswith: '\regsvr32.exe'
    Details: 'C:\Windows\System32\STAgent.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative scripts
- Installation of a service
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to the "ServiceDll" registry value for Windows services, which is a common technique used by attackers for establishing persistence on compromised systems. By altering this registry entry, an attacker can ensure that their malicious DLL is executed whenever the service starts, thereby maintaining access to the system and evading detection. Understanding this tactic is critical for incident responders, as it can point to ongoing threats such as the installation of backdoors or other persistent malware.

  The relevant MITRE ATT&CK tactics associated with this detection include **Persistence** (TA0003), as it highlights techniques employed by adversaries to maintain their presence in a system across reboots or service failures. Specifically, this detection maps to **Service Permissions** (T1543.003), which is a sub-technique where attackers manipulate service-related configurations to achieve their objectives. Primary data sources for this information include Windows registry change logs, particularly around the keys related to service configurations.

  ### Investigation Steps
  - **Review Registry Changes**: Examine recent changes to the registry, focusing on the `\Services\` path and specifically the `ServiceDll` entries. Note any unexpected modifications, especially involving dubious DLLs.
  - **Correlate Service Activity**: Analyze service start and stop events around the time of the registry changes. Look for correlations with unusual service behavior or unexpected service names that may indicate malicious activity.
  - **Inspect Running Processes**: Check for processes associated with the service that may be leveraging the modified `ServiceDll`. Pay particular attention to any processes with known suspicious paths or unusual parent-child relationships.
  - **Run Antivirus and EDR Queries**: Utilize endpoint detection and response (EDR) tools to run queries for known malicious DLLs or suspicious activity that could indicate exploitation of the service DLL mechanism.

  ### Prioritization
  The severity of this alert is medium due to the potential impact of unauthorized persistence mechanisms within an enterprise environment. While changes to service DLLs can lead to significant security breaches, the likelihood of trigger from benign administrative tasks means that careful investigation is necessary.

  ### Blind Spots and Assumptions
  This detection rule may miss configurations that are altered outside of standard registry change logs if logging isn't adequately implemented. Furthermore, it assumes that the attacker will use non-standard or known malicious DLLs, rather than using legitimate system files to remain stealthy. The effectiveness of this rule relies on the presence and proper configuration of registry logging capabilities; without this, legitimate administrative changes (such as service installations) may generate false positives.

