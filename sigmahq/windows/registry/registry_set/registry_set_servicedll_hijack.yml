note: |
  ### Technical Context

  This rule detects unauthorized changes to the `ServiceDll` registry key, indicating potential service DLL hijacking, a technique often used by attackers to maintain persistence on a compromised system. The likely objective of the attacker is to execute malicious code whenever the affected service starts, facilitating ongoing control of the system without detection. This behavior corresponds to the MITRE ATT&CK tactics of Persistence (T1543.003) and Privilege Escalation.

  The primary telemetry source is Windows registry modifications, specifically targeting registry paths under `\System\ControlSet\Services\`, with a focus on the `ServiceDll` value. If malicious, this behavior can enable an attacker to execute malicious payloads under the guise of legitimate services, compromising system integrity. However, this detection alone does not confirm malicious intent, as legitimate administrative actions or service installations may also cause similar changes.

  ### Investigation Steps

  - **Check registry modifications on affected services:** Review registry changes specific to `\System\ControlSet\Services\<ServiceName>\Parameters\ServiceDll` using Sysinternals tools or PowerShell. Look for unexpected DLL paths that are non-standard or unfamiliar.

  - **Identify service owners:** Confirm the owner of the modified service. Use `Get-Service` in PowerShell to match the service to its expected executable path, ensuring it matches legitimate sources. High-risk mismatches may indicate malicious activity.

  - **Review recent process creation events:** Analyze Security Event ID 4688 or Sysmon Event ID 1 for the creation of processes like `regsvr32.exe`, `lsass.exe`, or any unusual executables that modified the registry. Benign scenarios typically do not initiate changes to service DLLs via these processes.

  - **Correlate with behavioral telemetry:** Examine application logs for any service restarts associated with suspicious DLLs. For instance, logs indicating `Service started successfully` should not correlate to any unauthorized DLL modifications.

  - **Assess endpoint role and criticality:** Identify if the affected service is on a critical endpoint like a domain controller or a server handling sensitive data. The impact of a betrayal in such environments may significantly escalate.

  - **Investigate for further lateral movement:** Check if there are any known indicators of compromise associated with the DLLs detected. Look at Threat Intelligence feeds for the specific DLL path to validate whether associated malware is documented.

  ### Prioritization

  This alert is of medium severity due to its potential impact on critical systems or services, especially if they are compromised for persistence. While service DLL hijacking is a common tactic leveraged by advanced persistent threats (APTs) and malware, benign administrative actions can trigger similar alerts, making contextual review essential.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative scripts modifying the registry without malicious intent. Ensuring that the Windows registry change logs are adequately captured is crucial for effective detection; otherwise, the context may be lost. Additionally, benign installations of new services or updates may trigger this alert, making it important to differentiate between expected and suspicious activity. A related detection, such as monitoring which processes load DLLs at startup, can strengthen overall detection capabilities and provide further context.

