title: ServiceDll Hijack
id: 612e47e9-8a59-43a6-b404-f48683f45bd6
status: test
description: |
  Detects changes to the "ServiceDLL" value related to a service in the registry.
  This is often used as a method of persistence.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1543.003/T1543.003.md#atomic-test-4---tinyturla-backdoor-service-w64time
- https://www.hexacorn.com/blog/2013/09/19/beyond-good-ol-run-key-part-4/
author: frack113
date: 2022-02-04
modified: 2024-04-03
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1543.003
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\System\'
    - 'ControlSet'
    - '\Services\'
    TargetObject|endswith: '\Parameters\ServiceDll'
  filter_main_printextensionmanger:
    Details: 'C:\Windows\system32\spool\drivers\x64\3\PrintConfig.dll'
  filter_main_domain_controller:
    Image: 'C:\Windows\system32\lsass.exe'
    TargetObject|endswith: '\Services\NTDS\Parameters\ServiceDll'
    Details: '%%systemroot%%\system32\ntdsa.dll'
  filter_main_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
  filter_optional_safetica:
    Image|endswith: '\regsvr32.exe'
    Details: 'C:\Windows\System32\STAgent.dll'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative scripts
- Installation of a service
level: medium
note: |
  ### Technical Context

  This rule detects modifications to the "ServiceDll" value in the Windows registry for services. Adversaries often implement these changes to maintain persistence on compromised systems while potentially executing malicious DLLs when a service is started. The relevant MITRE ATT&CK tactic is Persistence, specifically technique T1543.003 (Service DLL Hijacking). Primary telemetry sources include Windows Registry event logs (Event ID 4663) that capture attempts to change registry keys, particularly those related to services. Malicious changes could result in executing arbitrary code or a backdoor, severely impacting system integrity. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative changes can trigger the alert.

  ### Investigation Steps

  - **Verify the context of the registry change:** Cross-reference the registry modification with the Service name and the User SID making the change (Event ID 4663). Ensure it is from a known administrative session and that the timing aligns with legitimate operations, such as service installations or updates.

  - **Check for unusual DLL files:** Analyze the "Details" field for malicious file names or paths indicating a non-standard ServiceDll. For example, "PrintConfig.dll" in unexpected locations might indicate compromise. Review the hash of referenced DLL files against threat intelligence to identify known malware.

  - **Review service statuses:** Use PowerShell or the Services MMC to confirm the status of services mentioning the altered "ServiceDll" and identify any unusual or unexpected services that are not relevant to standard operations, indicating potential abuse.

  - **Monitor for related event IDs:** Investigate other related security events (Event ID 4697 for service creation, Event ID 7045 for service installation updates) occurring around the same timestamp as the registry change to identify patterns of suspicious activity.

  - **Determine expected administrative activity:** Document any recent legitimate changes or updates made by IT admin processes on the system regarding service management to establish a baseline for comparison with logged activity.

  ### Prioritization

  This alert carries a medium severity level due to the potential impact of a compromised service on system functionality and security. Although service DLL hijacking is a common technique used by adversaries, legitimate software installations can also trigger similar registry modifications, necessitating careful analysis.

  ### Blind Spots and Assumptions

  Evasion techniques such as using benign file names or scheduled legitimate tasks may avoid detection while still facilitating malicious actions. Reliable detection requires proper configuration of Windows security auditing for the registry. Legitimate administrative activities, such as installing or configuring services, may lead to false positives. A companion detection for unusual or unauthorized service executions (e.g., logging service start events) can provide more context for assessment.

