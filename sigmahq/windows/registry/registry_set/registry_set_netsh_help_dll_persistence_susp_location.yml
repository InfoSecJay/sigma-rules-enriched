note: |
  ### Technical Context

  This rule detects changes to the Windows Registry, specifically the addition of a new DLL under the Netsh helper section, pointing to suspicious paths indicative of potential persistence mechanisms. The main objective of this behavior is to achieve persistence by allowing an attacker to execute malicious commands using `netsh` through a helper DLL, thereby maintaining access even after reboots or user logoffs. This aligns with the MITRE ATT&CK technique for Privilege Escalation and Persistence identified as **T1546.007 (Netsh Helper DLL)**.

  The primary telemetry source for this detection is Windows Registry changes, specifically looking for modifications in the registry keys associated with Netsh (located at `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\NetSh`). Malicious activity may lead to unauthorized or malicious network configurations, potentially allowing data exfiltration or lateral movement within the network. It's important to note that this detection does NOT confirm malicious activity on its own; further investigation is required to establish intent.

  ### Investigation Steps

  - **Identify the registry change details:** Review the registry changes captured in the Event Log (Event ID 4657) to confirm alterations to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\NetSh`. Document the previous and new values.

  - **Correlate DLL location with threat intelligence:** Check the source path of the DLL against known malicious indicators. Paths such as `C:\Users\Public\`, `C:\Windows\Temp\`, or `C:\Users\<username>\AppData\Local\Temp\` are red flags. Public or temporary folders are often used by adversaries to store malicious payloads.

  - **Examine process execution history:** Look for associated process creation events (Security Event ID 4688) that might indicate the execution of the netsh command after the DLL was registered. Focus on unusual command line arguments or suspicious parent processes that initiated these commands.

  - **Assess legitimate behavior:** Validate if the detected registry change aligns with known, legitimate applications or services that might require similar configurations and document typical paths for benign `netsh` DLLs often placed in system folders (e.g., `C:\Windows\System32`).

  - **Monitor for lateral movement indications:** Cross-reference with security logs for any network changes or connections initiated shortly after the registry modification, specifically focusing on users that normally do not execute `netsh` commands regularly.

  - **Review the full Registry Set log details:** Look for any other suspicious modifications within the same registry hive or associated paths that can indicate other persistence mechanisms being employed alongside this DLL installation.

  ### Prioritization

  This alert should be considered high severity due to the potential impact on critical systems if maliciously exploited. The likelihood of abuse is significant, especially in context with various attacker strategies leveraging persistence methods like DLL hijacking. This technique is commonly weaponized by adversaries, prompting immediate response efforts.

  ### Blind Spots and Assumptions

  Detection may face limitations if proper logging is not configured; some legacy systems might not log all registry changes exhaustively. Legitimate applications can also modify Netsh registry settings during updates or configurations, potentially triggering false positives. A companion detection that strengthens coverage includes monitoring `netsh` command execution logs to correlate with registry modifications and evaluate patterns of misuse effectively.

