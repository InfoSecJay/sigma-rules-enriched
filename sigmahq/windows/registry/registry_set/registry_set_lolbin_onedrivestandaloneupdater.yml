note: |
  ### Technical Context

  This rule detects the modification of the OneDriveStandaloneUpdater.exe configuration to include a custom URL for downloading files, specifically targeting the registry key that stores the update URL. The likely attacker objective is to control the behavior of OneDrive to facilitate the download of malicious payloads or data exfiltration, leveraging OneDrive’s trusted processes. The relevant MITRE ATT&CK tactic is Command and Control, specifically technique T1105 (Ingress Tool Transfer). The primary telemetry sources are Windows Registry logs, particularly those related to registry modifications under the key `SOFTWARE\Microsoft\OneDrive\UpdateOfficeConfig`. If malicious, this could allow an adversary to bypass traditional security controls for executing arbitrary code through a trusted process. Notably, this detection does NOT confirm that the downloaded file is malicious; it only indicates an unusual registry modification.

  ### Investigation Steps

  - **Confirm the registry modification:** Check Windows Registry logs for Event ID 4657, focusing on modifications to the `SOFTWARE\Microsoft\OneDrive\UpdateOfficeConfig` key. Search for `UpdateRingSettingURLFromOC` to verify if an unauthorized URL has been set.

  - **Analyze the downloaded file:** Locate and inspect the file `C:\Users\<username>\AppData\Local\Microsoft\OneDrive\StandaloneUpdaterreSignInSettingsConfig.json`. Verify if the file contains suspicious content or executable commands that could indicate malicious intent.

  - **Review legitimate OneDrive behavior:** Typically, OneDrive updates are managed internally without custom URLs. Examine recent updates or configurations in similar environments to establish a baseline of normal OneDrive functionality and expected registry states.

  - **Identify high-confidence malicious indicators:** Investigate any accompanying commands associated with `OneDriveStandaloneUpdater.exe`. Look for abnormal execution patterns, unusual parent processes, or connections to known malicious domains in Event ID 4688 (Process Creation) logs.

  - **Cross-reference with user activity:** Check user activity surrounding the time of modification (e.g., logins and application usage). Verify if the user account associated with the registry change has the necessary permissions or if there's unlikely activity indicative of account compromise.

  ### Prioritization

  This alert is of high severity in an enterprise context because it involves a trusted application being leveraged in a potentially malicious manner. The likelihood of abuse is significant, as adversaries commonly use trusted processes for command and control, making this behavior a potential precursor to further exploitation or data loss.

  ### Blind Spots and Assumptions

  Detection may be limited if registry logging is not consistently enabled, and attackers could evade detection by reverting changes quickly. Legitimate activities that may trigger this alert include authorized software updates initiated by IT personnel or configuration changes associated with business needs. A related detection that enhances coverage is monitoring for unexpected outbound connections from OneDrive processes, as they may indicate data exfiltration attempts.

