detection:
  selection_wow_nt_current_version_base:
    TargetObject|contains: '\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion'
  selection_wow_nt_current_version:
    TargetObject|contains:
    - '\Windows\Appinit_Dlls'
    - '\Image File Execution Options'
    - '\Drivers32'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_file_exec_options:
    Details|endswith: '\Microsoft\Windows NT\CurrentVersion\Image File Execution Options'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows registry keys in the Wow6432Node under the CurrentVersion path, specifically targeting autostart extensibility points (ASEPs). Attackers may attempt to establish persistence or escalate privileges by modifying these keys to execute malicious code at startup. Relevant MITRE ATT&CK tactics and techniques include Persistence (TA0003) and Registry Run Keys/Startup Folder (T1547.001). Primary telemetry sources include the Windows Registry, specifically focusing on changes to Event ID 13 (Registry Value Set) and registry paths related to autorun entries. If these modifications are malicious, they can lead to unauthorized code execution when the system starts. This detection does NOT confirm malicious intent on its own, as legitimate software installations and administrative actions may also trigger these modifications.

  ### Investigation Steps

  - **Review Event ID 13 for suspicious modifications**: Check for Registry Value Set events from the Windows Security log. Look specifically for changes to keys under `\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion` to identify any unauthorized tweaks to autorun settings.

  - **Identify the user account associated with modifications**: Cross-reference the modifying user account in the Event ID 13 log with active administrative accounts and determine if the modification aligns with known administrative activities or legitimate software installations.

  - **Check for high-confidence malicious indicators**: Search for common registry values associated with malware, such as suspicious DLLs or executables listed under keys like `Appinit_Dlls` or `Image File Execution Options`. These entries typically contain paths to malicious binaries.

  - **Establish expected behavior**: Confirm any recent software installations or updates that could systemically modify registry autorun keys. Review installation logs or application behavior to ensure that the changes are part of normal operations.

  - **Validate file creation or network activity**: Monitor related host behavior, such as connections to external IP addresses or attempts to execute a payload, particularly from paths listed in the modified keys. Check for file creation in temp directories or unusual parent processes that would indicate exploitation.

  ### Prioritization

  This alert is of medium severity as it directly impacts systems where persistence mechanisms may allow attackers to regain access after initial exploitation. The likelihood of malicious abuse is moderate, particularly in environments targeted by advanced persistent threats (APTs). However, legitimate system operations may also trigger similar alerts frequently, necessitating careful investigation.

  ### Blind Spots and Assumptions

  This detection may miss legitimate modifications made by software installations or automated processes and is susceptible to evasion techniques such as timestamp spoofing. Reliable detection requires comprehensive audit logging of registry changes. Additionally, legitimate enterprise maintenance activities (e.g., software updates) may trigger these alerts. Companion detections focusing on process creation or execution patterns (e.g., tracking Process Creation Event ID 4688) might reinforce detection of malicious activity resulting from these modifications.

