logsource:
  category: registry_set
  product: windows
detection:
  selection_wow_nt_current_version_base:
    TargetObject|contains: '\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion'
  selection_wow_nt_current_version:
    TargetObject|contains:
    - '\Windows\Appinit_Dlls'
    - '\Image File Execution Options'
    - '\Drivers32'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_file_exec_options:
    Details|endswith: '\Microsoft\Windows NT\CurrentVersion\Image File Execution Options'
  condition: all of selection_* and not 1 of filter_main_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This rule detects modifications to autorun configuration settings in the Windows Registry, specifically under the `Wow6432Node` keys for Windows NT. Attackers may exploit these registry entries to establish persistence mechanisms, allowing malicious code to execute automatically at system startup or when specific conditions are met. The presence of unauthorized modifications to these keys can indicate attempts to enable persistence or escalate privileges within the system.

  The likely objectives of an attacker manipulating these autorun settings include maintaining access to a compromised host, deploying additional payloads, or evading detection by hiding their malicious activities. This behavior resonates with tactics outlined in the MITRE ATT&CK framework, particularly under the tactics of **Persistence** (TA0003) and **Privilege Escalation** (TA0004). The applicable techniques are **T1547.001: Boot or Logon Autostart Execution: Registry Run Keys/Startup Folder**.

  Primary data sources for detection include Windows Registry change logs, which provide insights into modifications made to autostart extensibility points (ASEP). Further enrichment with process creation logs may assist in establishing a timeline of the system’s startup behavior and associated activities during the execution lifecycle.

  ### Investigation Steps
  - **Review Registry Modifications**: Examine the Windows Registry logs for changes to the `Wow6432Node` paths, particularly any newly created or modified autorun keys related to `Appinit_Dlls`, `Image File Execution Options`, and `Drivers32`.

  - **Cross-Reference with Process Logs**: Analyze process creation event logs to identify any processes spawned as a result of the modifications, focusing on whether any unusual or suspicious processes are initiated during system boot or user logon.

  - **Check for Empty or Null Values**: Investigate any instances where registry details related to autoruns are left empty or have been set to null, as these can indicate potential tampering.

  - **Validate with Threat Intelligence**: Correlate findings with threat intelligence to determine if the observed modifications align with known malicious activity or software behaviors, especially if they correspond to recent threats or exploits.

  ### Prioritization
  This alert is a medium severity due to the potential impact associated with unauthorized persistence mechanisms which can lead to prolonged compromise, data exfiltration, or ransomware deployment. The likelihood of an attacker utilizing these tactics is moderate, particularly in environments where endpoints are frequently targeted for compromise.

  ### Blind Spots and Assumptions
  This detection logic assumes that registry audits are enabled and capturing relevant changes, including those from built-in Windows processes or legitimate applications. There may be gaps in detection if the attacker is capable of reverting modifications or if legitimate administrative actions lead to similar registry changes, which could generate false positives. Also, the rule relies on the presence of key logs without which the effectiveness of detection could be compromised. Continuous monitoring and adjustments to filtering criteria may be necessary for optimal accuracy.

