title: Modification of IE Registry Settings
id: d88d0ab2-e696-4d40-a2ed-9790064e66b3
status: test
description: Detects modification of the registry settings used for Internet 
  Explorer and other Windows components that use these settings. An attacker can
  abuse this registry key to add a domain to the trusted sites Zone or insert 
  JavaScript for persistence
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-5---javascript-in-registry
author: frack113
date: 2022-01-22
modified: 2025-10-22
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection_domains:
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
  filter_main_dword:
    Details|startswith: 'DWORD'
  filter_main_null:
    Details:
  filter_main_office:
    Details:
    - 'Cookie:'
    - 'Visited:'
    - '(Empty)'
  filter_main_path:
    TargetObject|contains:
    - '\Cache'
    - '\ZoneMap'
    - '\WpadDecision'
  filter_main_binary:
    Details: 'Binary Data'
  filter_optional_accepted_documents:
        # Spotted during Office installations
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings\Accepted
      Documents'
  condition: selection_domains and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the Windows Registry settings used by Internet Explorer, specifically focusing on changes that could indicate an attacker is trying to manipulate trusted sites or leverage scripting for persistence. The likely attacker objective is to enable or enhance their ability to execute malicious content through the browser, which aids in persistence or further exploitation. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique Registry Run Keys / Startup Folder (T1112).

  The primary telemetry source for this detection is Windows Registry changes, specifically those logged as registry modifications. If malicious, these changes could facilitate unauthorized access to sensitive data or execution of malicious scripts. It is crucial to note that this detection does NOT confirm actual exploitation or successful compromise without corroborating evidence.

  ### Investigation Steps

  - **Review registry changes: ** Examine Windows Registry Event ID 4657 for modifications to `\Software\Microsoft\Windows\CurrentVersion\Internet Settings`. Look for unexpected entries indicating added domains in the trusted sites zone.

  - **Check for user context: ** Validate the user context under which the registry changes were made using Event ID 4688 to see if it aligns with known administrators or service accounts. Changes made by non-privileged users during regular operation should be assessed for authenticity.

  - **Analyze impacted domains: ** Investigate any added domain names against known malicious indicators. Use threat intelligence feeds to correlate the domains with previous incidents or known malicious activity.

  - **Identify legitimate behavior: ** Cross-reference changes to the `Accepted Documents` registry settings with expected application behaviors during software installations or updates. These changes typically originate from software like Office during benign use.

  - **Search for script indications: ** Look for modifications indicating insertion of JavaScript or other scripts in the registry. Check for binary data changes that could indicate an attacker plant persistence scripts, which should not occur under normal conditions.

  ### Prioritization

  Given that this alert involves changes to critical browser settings that could allow for the execution of malicious scripts, it is of moderate severity in an enterprise context. The likelihood of malicious abuse is considerable, as attacks often seek to modify trusted settings to facilitate further compromise. However, the low level assigned indicates that these changes alone may not signify an immediate threat without further context.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as legitimate administrative changes or misconfigured logging that can mask malicious behavior. Reliable detection requires ensuring Registry Auditing is enabled and correctly configured, especially for the relevant registry paths. Legitimate software installations or updates may trigger this alert due to changes made in `Accepted Documents`. Additionally, companion detections for suspicious web traffic (e.g., utilizing proxy logs) can strengthen overall security posture by correlating registry changes with outbound requests.

