title: Modification of IE Registry Settings
id: d88d0ab2-e696-4d40-a2ed-9790064e66b3
status: test
description: Detects modification of the registry settings used for Internet 
  Explorer and other Windows components that use these settings. An attacker can
  abuse this registry key to add a domain to the trusted sites Zone or insert 
  JavaScript for persistence
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-5---javascript-in-registry
author: frack113
date: 2022-01-22
modified: 2025-10-22
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection_domains:
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
  filter_main_dword:
    Details|startswith: 'DWORD'
  filter_main_null:
    Details:
  filter_main_office:
    Details:
    - 'Cookie:'
    - 'Visited:'
    - '(Empty)'
  filter_main_path:
    TargetObject|contains:
    - '\Cache'
    - '\ZoneMap'
    - '\WpadDecision'
  filter_main_binary:
    Details: 'Binary Data'
  filter_optional_accepted_documents:
        # Spotted during Office installations
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings\Accepted
      Documents'
  condition: selection_domains and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context

  This Sigma rule detects modifications to specific Internet Explorer registry settings on Windows systems. Attackers may alter these settings with the objective of adding malicious domains to the trusted sites zone or injecting JavaScript payloads to maintain persistence within the system. This behavior fits within the MITRE ATT&CK framework under the tactic of “Persistence” (T1132) and “Defense Evasion” (T1112).

  The primary telemetry source for this detection is Windows registry change logs, which include the key being modified. If malicious, the impact can lead to compromised web sessions, unauthorized access to sensitive data, or further system exploitation. It is important to note that this detection does not confirm malicious intent on its own; it merely highlights a change in registry settings that could be exploited by adversaries.

  ### Investigation Steps

  - **Review registry changes:** Check Windows registry for modifications at `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Internet Settings`. Investigate changes to `Trusted Sites` and `ZoneMap` entries. Use Sysinternals tools or PowerShell to validate recent timestamp and the user account responsible for the changes.

  - **Analyze Event IDs:** Look for related security logs such as Event ID 4657 (a registry value was modified) to capture the details of modifications, including old and new values. Pay attention to any recently added domains, especially those not commonly found in enterprise environments.

  - **Identify known benign activity:** Verify if the registry changes coincide with legitimate software installations or updates, such as Microsoft Office or enterprise-approved policies managing browser settings. Compare these changes with documented changes from trusted software providers.

  - **Correlate with user activity:** Identify user activity around the time of the modification using Event ID 4624 (Logon) and assess if the account was active. Look for abnormal login times or off-hour activity that could indicate a compromised account.

  - **Check for presence of script payloads:** Validate for known malicious JavaScript entries in registry settings or any other suspicious binary or script embedded in the modified entries by examining the values in the `Internet Settings`.

  - **Validate critical asset impact:** Determine if the affected system holds sensitive data or has elevated user permissions. Focus on critical assets such as domain controllers or servers that could be leveraged for lateral movement within the infrastructure.

  ### Prioritization

  This alert carries low severity but requires prompt investigation depending on the criticality of affected systems. While modifications to registry keys are not uncommon, their exploitation often leads to wider compromise if left unchecked. Since this activity can be weaponized for persistence, quick triage is essential for higher-value assets.

  ### Blind Spots and Assumptions

  The detection may be evaded by attackers using techniques such as legitimate software installation masking or utilizing Group Policy Objects (GPOs) to revert changes. Reliable detection requires continuous monitoring of registry changes, with proper logging configured to capture registry modifications. Legitimate enterprise changes via system management software or user policy enforcement can trigger false positives. A related detection could include monitoring for unusual processes accessing web content, which may complement the visibility into registry modifications.

