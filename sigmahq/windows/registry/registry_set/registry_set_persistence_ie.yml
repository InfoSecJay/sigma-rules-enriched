title: Modification of IE Registry Settings
id: d88d0ab2-e696-4d40-a2ed-9790064e66b3
status: test
description: Detects modification of the registry settings used for Internet Explorer
  and other Windows components that use these settings. An attacker can abuse this
  registry key to add a domain to the trusted sites Zone or insert JavaScript for
  persistence
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-4---add-domain-to-trusted-sites-zone
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1112/T1112.md#atomic-test-5---javascript-in-registry
author: frack113
date: 2022-01-22
modified: 2025-10-22
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection_domains:
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
  filter_main_dword:
    Details|startswith: 'DWORD'
  filter_main_null:
    Details:
  filter_main_office:
    Details:
    - 'Cookie:'
    - 'Visited:'
    - '(Empty)'
  filter_main_path:
    TargetObject|contains:
    - '\Cache'
    - '\ZoneMap'
    - '\WpadDecision'
  filter_main_binary:
    Details: 'Binary Data'
  filter_optional_accepted_documents:
        # Spotted during Office installations
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings\Accepted
      Documents'
  condition: selection_domains and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: low
note: |
  ### Technical Context
  The detection rule identifies modifications to specific registry keys associated with Internet Explorer configuration settings within Windows systems. These registry entries are critical as they dictate how Internet Explorer operates, including trusted sites and security configurations. Attackers may exploit these settings to establish persistence, potentially by adding domains to the trusted sites zone or injecting JavaScript for malicious purposes. The manipulation of these registry keys can lead to unauthorized changes in browsing behavior, which may facilitate further attacks or data exfiltration.

  This rule is particularly relevant in scenarios where an attacker, aiming for persistence or evasion, modifies registry settings to lower security or propagate malicious content. The primary MITRE ATT&CK tactics involved are **Persistence** (T1112), as attackers may want to ensure their methods remain active across reboots, and **Defense Evasion** (T1112) by modifying system settings to bypass user warnings or security protections. The most pertinent data sources for this detection include **Windows registry logs**, where such modifications are recorded, offering insight into potentially nefarious activities.

  ### Investigation Steps
  - **Review Registry Set Logs:** Analyze logs for changes to the registry keys at `\Software\Microsoft\Windows\CurrentVersion\Internet Settings`, especially modifications that don't align with typical user behavior or application installations.
  - **Correlate with User Activity:** Investigate the timing of registry changes in conjunction with user activity. Look for anomalies such as alterations made during off-hours or without corresponding user actions.
  - **Check for Known Bad Domains:** Identify any domains added to the trusted sites zone and cross-reference these against threat intelligence feeds for potential associations with known malicious actors or campaigns.
  - **Audit System Configuration Post-Change:** After identifying changes, audit system configurations to assess other possible vulnerabilities introduced by these registry modifications, including potential impacts on system security posture.

  ### Prioritization
  The alert should be considered of **low severity** due to its potential for abuse but is contingent on complementary malicious activity. Although registry modifications can lead to significant risks, the impact largely depends on further exploitation stages that may arise from such changes.

  ### Blind Spots and Assumptions
  The detection logic may not capture every malicious registry modification, particularly if an attacker alters logging practices or employs stealthier methods. Assumptions include that all changes to the specified registry paths are indicative of malicious intent, which may not account for legitimate administrative actions or software configurations. The accuracy and comprehensiveness of this alert depend on the organization's logging configuration to ensure registry set activities are fully recorded.

