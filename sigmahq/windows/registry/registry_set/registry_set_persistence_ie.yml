note: |
  ### Technical Context

  This rule detects modifications to the Windows registry settings associated with Internet Explorer and other components, specifically targeting `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Internet Settings`. Attackers may manipulate these settings to add malicious sites to the trusted zones or inject JavaScript for persistence purposes. The expected attacker objective is to gain persistent access or hijack browser behavior for further exploitation.

  The relevant MITRE ATT&CK tactic is **Persistence (T1136)** and the technique is **Modify Existing Service (T1112)**. Primary telemetry sources include Windows registry changes, which can be monitored through logs associated with registry modifications. The potential security impact includes the execution of untrusted code and further lateral movement within the organization. Importantly, this detection does not confirm that a malicious activity was executed or that any resulting impacts actually occurred.

  ### Investigation Steps

  - **Review registry modification logs:** Check for Event IDs 4657 and 4663 in Windows Security logs to identify recent changes to the registry paths under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Internet Settings`. Look for unusual timestamps or user accounts associated with these changes.

  - **Cross-reference with user activity:** Investigate user activities around the time of the registry modification. Verify legitimate actions such as installations or updates, typically visible in logs for other applications or Windows events like Event ID 1033 (Windows Installer).

  - **Identify malicious indicators:** Look for registry entries with suspicious strings or domains, particularly those not recognized within the enterprise. For example, modifications involving domains that are known for malicious activity or those targeting unusual paths like `\ZoneMap`.

  - **Validate against expected behavior:** Legitimate configurations may include standard domain entries. Confirm that any modifications correspond with expected corporate settings and do not include unauthorized URLs or script injections.

  - **Conduct a follow-up on related artifacts:** If the modification involves adding domains to trusted sites, check for possibly related artifacts, such as downloaded files or scripts executed on the affected system, which can be indicated by Sysmon Event ID 1 (Process Creation) involving browser processes.

  ### Prioritization

  This alert should be considered low to medium severity given that it represents potential malicious behavior in altering browser security settings. The likelihood of abuse exists, especially in environments where browsers are used extensively for user activity. While manipulation of these registry keys is not uncommon, a persistent change may suggest further malicious exploitation is possible.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of appropriate logging around registry changes or the potential for evasion through legitimate software installation processes. There may also be benign activities, such as policy updates or user-initiated configurations that could trigger this alert. It is advisable to couple this detection with monitoring for anomalous process creation (Sysmon Event ID 1) as a complementary check to strengthen coverage against script execution or further attacks.

