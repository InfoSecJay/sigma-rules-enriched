  ### Technical Context

  This rule detects the modification of a specific Windows registry key associated with WerFault, specifically the "ReflectDebugger" key, which is often abused for persistence techniques by attackers. The likely objective of an attacker manipulating this registry value is to ensure that their malicious payload can be executed in response to application crashes, effectively establishing a foothold in the compromised system. This aligns with the MITRE ATT&CK framework under the tactic "Defense Evasion" and technique "Modify Registry" (ID: T1036.003).

  The primary telemetry sources for this detection involve Windows Registry event logs, specifically focusing on registry set actions. The security impact of such behavior is significant; if malicious, it could lead to persistent malware execution even after system reboots. However, this detection does NOT confirm active malicious behavior on its own, as legitimate applications or services may also modify this registry key.

  ### Investigation Steps

  - **Check for registry changes:** Query Windows Security Event ID 4657 for changes to `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\Windows Error Reporting\Hangs\ReflectDebugger`. Examine the `NewValueName` field to identify modifications.

  - **Identify user context for changes:** Confirm the `SubjectUserName` field in Event ID 4657 to determine which user/context performed the registry modification. Look for administrative accounts or suspicious/non-typical users.

  - **Review expected application behavior:** Cross-reference the registry modification with legitimate Windows application crash handling behavior, often tied to application-specific processes normally not impacting the ReflectDebugger setting.

  - **High-confidence malicious indicators:** Look for corresponding execution artifacts in the Application event logs (Event ID 1000), specifically examining faulting application names for known malicious executables that may have linked to the registry change.

  - **Correlate with existing security incidents:** If the behavior is observed on critical servers or workstations, refer to historical alerts or associated detection rules to check for prior suspicions or patterns linked to the affected asset.

  ### Prioritization

  This alert is classified as high severity due to the significant impact such modifications could have on sensitive systems within an enterprise. The likelihood of malicious abuse is elevated, as this technique is well-known among threat actors for establishing persistence. Additionally, the weaponization of registry modifications is a common tactic seen in various malware campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where attackers might reset or obscure their modifications. Reliable detection requires proper logging of Windows registry changes, specifically ensuring that Event ID 4657 is enabled. Legitimate activities, such as application updates or legitimate debugging configurations, could trigger this alert. A related detection that strengthens coverage is monitoring for program launches that coincide with these registry modifications, such as looking for execution events in PowerShell (Event ID 4104) or through Sysmon for other process creation events.

