title: Suspicious Printer Driver Empty Manufacturer
id: e0813366-0407-449a-9869-a2db1119dc41
status: test
description: Detects a suspicious printer driver installation with an empty 
  Manufacturer value
references:
- https://twitter.com/SBousseaden/status/1410545674773467140
author: Florian Roth (Nextron Systems)
date: 2020-07-01
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574
- cve.2021-1675
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\Control\Print\Environments\Windows x64\Drivers'
    - '\Manufacturer'
    Details: '(Empty)'
  filter_cutepdf:
    TargetObject|contains: '\CutePDF Writer v4.0\'
  filter_vnc:
    TargetObject|contains:
    - '\VNC Printer (PS)\'
    - '\VNC Printer (UD)\'
  filter_pdf24:
    TargetObject|contains: '\Version-3\PDF24\'
  condition: selection and not 1 of filter_*
falsepositives:
- Alerts on legitimate printer drivers that do not set any more details in the 
  Manufacturer value
level: high
note: |
  ### Technical Context

  This rule detects the installation of a suspicious printer driver that has an empty Manufacturer value, which can indicate potential malicious activity, such as an adversary attempting to establish persistence or evade detection via a driver that masquerades as standard printer software. The likely attacker objective may include privilege escalation or establishing a foothold within the environment. This behavior aligns with the MITRE ATT&CK technique T1574: Hijack Execution Flow.

  Primary telemetry sources include Windows registry logs, specifically observing modifications under `\Control\Print\Environments\Windows x64\Drivers`. If malicious, this behavior could allow an attacker to execute arbitrary code with elevated privileges. Importantly, this detection does NOT confirm that malicious activity has occurred, as legitimate printer drivers may also lack a Manufacturer value.

  ### Investigation Steps

  - **Review registry modifications for suspicious values:** Examine Windows registry logs for Event ID 4657, focusing on changes to `TargetObject` paths containing `\Control\Print\Environments\Windows x64\Drivers`. Look for instances where the `Manufacturer` field is empty.

  - **Validate existence of known benign drivers:** Cross-reference the detected installation against a known list of trusted printer drivers. Legitimate drivers may have a missing Manufacturer value but commonly mentioned in trusted lists, such as CutePDF or PDF24.

  - **Identify high-priority related services:** Investigate whether a newly installed driver is linked to any services that are set to start automatically. Check for service creation logs (Event ID 7045) directly after the registry change.

  - **Check for execution of known malicious software:** Look in security logs for any process creation (Event ID 4688) immediately following the driver installation. Identify if processes like `cmd.exe`, `powershell.exe`, or specific known malicious executables originate from the printer driver paths.

  - **Assess potential exfiltration attempts:** Look at network telemetry for unusual outbound traffic that coincides with the driver installation time frame. Focus on unusual protocols or connections, especially if the driver is linked to user sessions or applications.

  ### Prioritization

  The alert is high-severity given its potential impact on systems, particularly those with elevated privileges or administrative functions. The likelihood of malicious abuse is raised due to the empty Manufacturer value being a common evasion technique. While this behavior is not frequently weaponized, it can support broader malicious objectives, such as persistence or privilege escalation.

  ### Blind Spots and Assumptions

  There are limitations in detection as sophisticated adversaries may craft drivers that mimic legitimate installations more closely. Reliable detection requires comprehensive logging of Windows registry modifications; ensure registry auditing is enabled. Legitimate activities, such as legitimate printer installations or software updates, may trigger this alert. A related detection to consider is monitoring for unusual Service Control Manager (SCM) events that might correlate with unexpected driver behavior or installations.

