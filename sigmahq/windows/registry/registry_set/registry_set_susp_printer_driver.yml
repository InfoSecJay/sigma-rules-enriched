title: Suspicious Printer Driver Empty Manufacturer
id: e0813366-0407-449a-9869-a2db1119dc41
status: test
description: Detects a suspicious printer driver installation with an empty Manufacturer
  value
references:
- https://twitter.com/SBousseaden/status/1410545674773467140
author: Florian Roth (Nextron Systems)
date: 2020-07-01
modified: 2023-08-17
tags:
- attack.persistence
- attack.defense-evasion
- attack.privilege-escalation
- attack.t1574
- cve.2021-1675
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\Control\Print\Environments\Windows x64\Drivers'
    - '\Manufacturer'
    Details: '(Empty)'
  filter_cutepdf:
    TargetObject|contains: '\CutePDF Writer v4.0\'
  filter_vnc:
    TargetObject|contains:
    - '\VNC Printer (PS)\'
    - '\VNC Printer (UD)\'
  filter_pdf24:
    TargetObject|contains: '\Version-3\PDF24\'
  condition: selection and not 1 of filter_*
falsepositives:
- Alerts on legitimate printer drivers that do not set any more details in the Manufacturer
  value
level: high
note: |
  ### Technical Context
  This detection rule identifies the installation of suspicious printer drivers in a Windows environment, specifically targeting drivers with an empty Manufacturer value. Malware authors may exploit printer driver installations as a vector for persistence or privilege escalation, recognizing that these drivers often operate with elevated permissions. Attackers could use this method to install malicious software disguised as legitimate printer drivers, subsequently leveraging the driver for covert operations or to enable other attacks.

  The relevant MITRE ATT&CK tactics associated with this detection include:
  - **Persistence** (TA0003): Install malicious printer drivers to maintain a foothold in the environment.
  - **Defense Evasion** (TA0005): Malware may attempt to blend in with legitimate software installations to avoid detection.
  - **Privilege Escalation** (TA0004): Compromised printer drivers can often operate with elevated privileges, potentially allowing for further exploits.

  The primary data source for this detection is Windows registry logs that record events related to changes in the print subsystem. Specifically, the rule monitors registry key modifications that can indicate potentially malicious printer driver installations.

  ### Investigation Steps
  - **Review Registry Logs:** Check the Windows registry logs for entries under `\Control\Print\Environments\Windows x64\Drivers` that have an empty Manufacturer value. Note any additional details related to the driver that may indicate malicious intent.

  - **Analyze Driver Behavior:** Investigate the behavior of the detected printer driver by examining process creation events associated with the print spooler service, looking for unusual activity or execution of unexpected commands.

  - **Check for Known Bad Drivers:** Cross-reference the identified drivers with threat intelligence reports or repositories of known malicious drivers to determine if the detected driver has been linked to previous attacks, including those associated with the CVE-2021-1675 vulnerability.

  - **Inspect System for Malicious Artifacts:** Look for other indicators of compromise on the system that may correlate with the suspicious driver installation, such as unauthorized software or unusual network activity potentially originating from compromised printer installations.

  ### Prioritization
  This alert is classified as high severity due to the potential impact of a compromised printer driver, which could allow attackers persistent access and elevated privileges on affected systems. Given the accessibility of printers on networks and their common integrations into enterprise environments, the likelihood of exploitation is a significant concern.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the alerting mechanism's dependency on the correct configuration of registry logging; if logging is not enabled or is inadequate, this detection may be missed. The detection logic assumes that all legitimate printer drivers will have a Manufacturer value populated, which may not always be the case in some environments. Ensuring comprehensive logging of registry changes related to printer drivers is essential for the efficacy of this alert and for reducing false positives related to legitimate printers that fail to set a Manufacturer value.

