title: Suspicious Printer Driver Empty Manufacturer
id: e0813366-0407-449a-9869-a2db1119dc41
status: test
description: Detects a suspicious printer driver installation with an empty 
  Manufacturer value
references:
- https://twitter.com/SBousseaden/status/1410545674773467140
author: Florian Roth (Nextron Systems)
date: 2020-07-01
modified: 2023-08-17
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.t1574
- cve.2021-1675
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\Control\Print\Environments\Windows x64\Drivers'
    - '\Manufacturer'
    Details: '(Empty)'
  filter_cutepdf:
    TargetObject|contains: '\CutePDF Writer v4.0\'
  filter_vnc:
    TargetObject|contains:
    - '\VNC Printer (PS)\'
    - '\VNC Printer (UD)\'
  filter_pdf24:
    TargetObject|contains: '\Version-3\PDF24\'
  condition: selection and not 1 of filter_*
falsepositives:
- Alerts on legitimate printer drivers that do not set any more details in the 
  Manufacturer value
level: high
note: |
  ### Technical Context

  This rule detects the installation of suspicious printer drivers that have an empty Manufacturer value, which may indicate a stealthy persistence mechanism or an attempt at privilege escalation. The likely attacker objective is to introduce malicious components into the environment while evading detection. This behavior aligns with the MITRE ATT&CK tactics of Persistence (TA0003), Privilege Escalation (TA0004), and Execution (TA0005), specifically technique T1574 (Hijack Execution Flow).

  The primary telemetry source for this detection comes from Windows Registry changes, specifically monitoring the 'HKLM\Control\Print\Environments\Windows x64\Drivers\Manufacturer' registry key. If malicious, the security impact could include the installation of a backdoor or unauthorized access to systems. This detection does NOT confirm that a printer driver installation is inherently malicious without further context.

  ### Investigation Steps

  - **Check registry values:** Review the registry key `HKLM\Control\Print\Environments\Windows x64\Drivers` for the Manufacturer field and confirm that it is empty. This is an indicator of potential malicious activity, especially if the driver is not recognized or associated with a legitimate vendor.

  - **Identify installed printer drivers:** Run a command like `Get-PrinterDriver` in PowerShell to list installed printer drivers. Compare the names against known legitimate manufacturers. Drivers linked to unknown or malicious vendors (e.g. those lacking a verified Manufacturer field) should be treated with suspicion.

  - **Correlate with system behavior:** Monitor for any recent processes created by the suspicious printer driver installation using Event ID 4688 (Process Creation). If related processes show unusual network activity or access to sensitive files, this increases the risk profile.

  - **Review system logs for contextual events:** Examine the Windows Event Logs (particularly the Application and System logs) around the time of the registry change. Look for related events that might indicate abnormal behavior, such as Event ID 7045 (Service Installation) which could suggest further persistence mechanisms being deployed.

  - **Analyze related file activities:** Check for file creation or modification events using Sysmon Event ID 10 (File Creation) and ensure to investigate any files created in association with the suspicious driver installation. Legitimate printer drivers should not create multitude of unexpected files or folders.

  ### Prioritization

  The alert holds a high severity due to the potential impact on sensitive systems, particularly if the printer drivers can facilitate unauthorized access or data exfiltration. The likelihood of malicious abuse is substantial, as the installation of drivers with empty Manufacturer fields is known to be weaponized by attackers for stealthy tactics.

  ### Blind Spots and Assumptions

  The detection may be limited by legitimate printer installations that do not specify a Manufacturer, which can result in false positives. Reliable detection requires complete logging of registry changes and may depend on appropriate monitoring configurations. Legitimate activities, such as the installation of certain third-party printers, can trigger this alert. A related detection could involve monitoring registry changes for unusual executable creations or modifications, helping to bolster overall detection coverage.

