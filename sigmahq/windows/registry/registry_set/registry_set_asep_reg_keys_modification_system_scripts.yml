logsource:
  category: registry_set
  product: windows
detection:
  scripts_base:
    TargetObject|contains: '\Software\Policies\Microsoft\Windows\System\Scripts'
  scripts:
    TargetObject|contains:
    - '\Startup'
    - '\Shutdown'
    - '\Logon'
    - '\Logoff'
  filter:
    Details: '(Empty)'
  condition: scripts_base and scripts and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This rule detects modifications made to autostart extensibility points (ASEP) within the Windows Registry, specifically targeting keys that relate to system scripts associated with startup, shutdown, logon, and logoff processes. Attackers often manipulate these registry keys to achieve persistence on compromised systems, enabling them to execute malicious scripts automatically during system events. Common objectives include maintaining access to the system, executing payloads, or facilitating further malicious actions by ensuring their presence within the system startup processes.

  The relevant MITRE ATT&CK tactics for this detection include **Persistence (T1547)** and **Privilege Escalation (T1068)**. Technique T1547.001 specifically pertains to modifications made to the autorun functionality in the Windows operating environment, making it a focal point for detecting potential malicious behavior. The primary data sources for this detection include **registry modification events** that capture changes to the Windows Registry, allowing SOC analysts to monitor and respond to unauthorized alterations in critical areas of the operating system.

  ### Investigation Steps
  - **Review Registry Changes:** Investigate recent modifications to the registry keys related to system scripts located under `\Software\Policies\Microsoft\Windows\System\Scripts`, as well as those linked to `\Startup`, `\Shutdown`, `\Logon`, and `\Logoff`, to identify unauthorized changes.
  - **Analyze Event Logs:** Examine Windows security and application event logs for any entries that correlate with the timing of registry modifications, looking for signs of unauthorized access or execution of potentially harmful scripts.
  - **Identify Installed Software:** Determine if legitimate applications were installed or updated around the same time as the registry changes, as this could explain some modifications without indicating malicious intent.
  - **Inspect Running Processes:** Cross-reference the identified modifications with the currently running processes and scheduled tasks to detect any anomalous scripts that may be set for execution during system events.

  ### Prioritization
  This alert is classified with medium severity due to its potential impact on system integrity through malware persistence mechanisms. The likelihood of exploitation is significant, given that manipulations of autorun keys are common tactics employed by attackers following system compromise.

  ### Blind Spots and Assumptions
  The detection may not cover all forms of persistence, particularly if attackers use alternative methods to achieve similar objectives without modifying these specific registry keys. Additionally, the logic assumes that any modifications made to these keys are malicious unless they appear empty or are part of legitimate software installations or administrative actions. The effective function of this alert relies on the comprehensive logging of registry changes; if such logging is not enabled, critical detection capabilities might be compromised.

