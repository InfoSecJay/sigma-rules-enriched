logsource:
  category: registry_set
  product: windows
detection:
  scripts_base:
    TargetObject|contains: '\Software\Policies\Microsoft\Windows\System\Scripts'
  scripts:
    TargetObject|contains:
    - '\Startup'
    - '\Shutdown'
    - '\Logon'
    - '\Logoff'
  filter:
    Details: '(Empty)'
  condition: scripts_base and scripts and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This rule detects modifications to autorun keys in the Windows registry associated with autostart extensibility points (ASEP), specifically targeting the Scripts registry path. Such behavior is commonly associated with malware persistence mechanisms, enabling an attacker to run scripts during system events like startup or logon. The likely objective of an attacker is to establish a foothold on the system, ensuring that malicious scripts execute consistently upon specific triggers.

  This behavior correlates with the MITRE ATT&CK tactics of Persistence (T1547.001) and Privilege Escalation. Primary telemetry sources include Windows registry logs detailing modifications (Registry Set category) and relevant Event IDs related to registry changes. If malicious, the security impact could be significant, leading to unauthorized access or execution of harmful scripts. However, it is important to note that this detection alone does NOT confirm malicious intent, as legitimate administrative activities can lead to similar registry modifications.

  ### Investigation Steps

  - **Verify registry modifications: ** Examine Windows registry logs for modifications to keys under `HKEY_CURRENT_USER\Software\Policies\Microsoft\Windows\System\Scripts` for Event ID 4657. Look for entries that invoke scripts during startup, shutdown, logon, or logoff.

  - **Identify malicious scripts: ** Inspect any scripts referenced in the modified autorun keys for signs of malicious content. Look for unexpected paths, file hashes, and commands that are commonly associated with malware.

  - **Check for legitimate use cases: ** Determine if recent changes were made by legitimate administrators or management software. Review logon events (Event ID 4624) and task creation logs (Event ID 4688) to see if expected administrative activities coincided with registry modifications.

  - **Review related events: ** Correlate changes with other telemetry such as Sysmon Event ID 1 (process creation) to see if any scripts executed in conjunction with the registry modifications. Identify if known malicious processes are associated with the changes.

  - **Assess system impact: ** Evaluate the criticality of the host where the changes occurred. If the system has elevated privileges, the potential impact of a compromise is higher, necessitating prompt escalation.

  ### Prioritization

  This alert is of medium severity, as modifying autorun keys can indicate potential persistence tactics often utilized by advanced adversaries. The likelihood of malicious abuse is significant given that these actions directly relate to malware operations. Although this behavior can stem from legitimate activities, the potential for abuse makes it a key focus for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the configuration of logging policies or missing telemetry for all relevant registry modifications. Legitimate activities such as software installations or updates may trigger alerts if they modify autorun keys. Companion detections, such as monitoring for suspicious process creation (Event ID 4688) or changes to task scheduling, can enhance visibility into potential malicious activities. Additionally, evasion techniques, such as using PowerShell or non-standard scripts, can bypass standard detection methods.

