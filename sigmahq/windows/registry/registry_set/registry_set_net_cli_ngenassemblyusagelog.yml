logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|endswith: 'SOFTWARE\Microsoft\.NETFramework\NGenAssemblyUsageLog'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects modifications made to the NGenAssemblyUsageLog registry key within the Windows operating system, which is associated with the .NET framework's native image generation. Attackers may target this key to erase logging details or mislead security monitoring, aiming to evade detection while executing .NET applications or deploying malicious code. The relevant MITRE ATT&CK techniques include "Indicator Removal on Host" (T1112) and "Persistence" tactics, as manipulating the registry can provide persistence capabilities for malicious software.

  The primary telemetry source for this detection is Windows registry change logs, specifically focusing on registry events that indicate alterations to the NGenAssemblyUsageLog key. If malicious, this behavior can severely impair the ability to track legitimate .NET application usage, facilitating long-term exploitation or concealment of malware activities. Importantly, this detection does NOT confirm that malicious activity has occurred; it merely indicates that a registry modification has taken place, which could also be legitimate behavior.

  ### Investigation Steps

  - **Check the registry change time:** Verify the timestamp of the registry modification (Event Type: Registry Set). Cross-reference with other event logs (e.g., Security Event ID 5145 for registry access) to identify unusual patterns of access or modifications.

  - **Review recent .NET applications executed:** Analyze the process creation logs (Sysmon Event ID 1 and Windows Security Event ID 4688) for processes associated with .NET that run around the same time as the registry change. Expected behavior includes typical applications, such as business software or development tools.

  - **Identify multiple registry changes:** Look for multiple registry changes targeting .NET framework keys around the same time. A series of changes to keys under `SOFTWARE\Microsoft\.NETFramework\` may indicate malicious intent rather than benign administrative tasks.

  - **Check for known indicators of compromise (IOCs):** Validate against threat intelligence sources for indicators related to recent malicious activities specifically utilizing .NET evasion techniques. High-confidence malicious activity includes attempts to alter registry keys recognized in established attack patterns.

  - **Assess asset criticality and role:** Understand the function of the affected asset. A server hosting critical applications with known .NET dependencies should be prioritized for immediate investigation compared to a non-essential workstation.

  - **Inspect application logging for anomalies:** Review logs of applications which leverage .NET for unusual behavior or errors that coincide with the timeline of the registry changes. Look for modifications in application configuration settings that could relate to the tampering of the NGenAssemblyUsageLog.

  ### Prioritization

  The alert severity is high due to the potential impact on critical systems that rely on the .NET framework and the likelihood of malicious actors exploiting this technique for evasion purposes. Modifying registry settings related to .NET logging is often weaponized in attacks, making this behavior critical to investigate promptly.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of evasion techniques, such as legitimate software using similar methods for troubleshooting or testing purposes. Reliable detection requires proper auditing configurations and logging of registry changes. Additionally, administrative actions by IT staff may inadvertently trigger this alert. Related detections, such as abnormal process creation patterns involving .NET applications, can enhance the overall coverage and context for investigations.

