logsource:
  product: windows
  category: registry_set
detection:
  selection:
    TargetObject|endswith: 'SOFTWARE\Microsoft\.NETFramework\NGenAssemblyUsageLog'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies unauthorized modifications to the NGenAssemblyUsageLog registry key, which is instrumental in controlling the output location of the .NET Native Image Generation (NGen) logs. Attackers may attempt to tamper with this registry setting to evade detection by disabling logging, thereby obfuscating their actions while executing .NET applications. This tampering could indicate attempts at persistence or evasion of security controls, particularly in environments that heavily rely on .NET applications.

  The relevant MITRE ATT&CK tactics applicable to this behavior include **Persistence (T1547)**, where the attacker seeks to maintain a foothold in the environment, and **Defense Evasion (T1112)**, which involves techniques to avoid detection. A primary data source for this detection is Windows Registry change logs that indicate any unauthorized modifications to system configurations.

  ### Investigation Steps
  - **Review Registry Change Logs**: Investigate Windows Registry change logs for any entries related to the NGenAssemblyUsageLog key to identify the user or process responsible for the modification.
  - **Analyze Recent Process Activity**: Examine the EDR logs for recent execution of .NET processes around the time of the registry change to identify any suspicious activities or known malicious executables.
  - **Correlate with User Activity**: Check for anomalous user activity that may correlate with the registry key tampering, including elevated privileges or unusual login patterns, which may suggest compromised accounts or insider threats.
  - **Verify Security Tool Efficacy**: Ensure that your EDR and other security monitoring tools are configured to monitor and alert on changes to critical system registry keys to improve detection capabilities in the future.

  ### Prioritization
  Given the potential for this tampering to enable further malicious actions, including evasion of security measures and the establishment of persistence mechanisms, this alert should be treated with high priority in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection relies on the availability and monitoring of Windows Registry changes, which may not be uniform across all endpoints or might be disabled in certain environments. Assumptions include that legitimate administrative activities do not frequently modify this registry key, and that sufficient logging is enabled to capture relevant changes. Environments without adequate monitoring of registry modifications may miss such tampering attempts.

