note: |
  ### Technical Context

  This rule detects unauthorized changes to the `NGenAssemblyUsageLog` registry key, which is used for tracking .NET framework assemblies' Native Image generation usage. Attackers may modify this registry key to evade detection and hide their malicious activities by preventing logging related to .NET applications. The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1547)** and **Defense Evasion (T1112)**. Primary telemetry sources include Windows Registry change logs, specifically monitoring alterations to registry keys. If malicious, this behavior can lead to significant security impacts, such as undetected execution of harmful processes hiding within legitimate .NET applications. This detection does NOT confirm that misuse or malicious intent is present; it merely indicates that the registry key has been altered.

  ### Investigation Steps

  - **Review recent registry changes:** Examine the Windows Registry logs for Event ID 4657 which captures modifications to sensitive keys. Look for log entries that indicate changes to `SOFTWARE\Microsoft\.NETFramework\NGenAssemblyUsageLog`, specifically the new values set.

  - **Identify user context of changes:** Check the Security Event log (Event ID 4672) to identify the user account that performed the registry modification. Focus on accounts with administrative privileges, as these may indicate an elevated privilege attack vector.

  - **Validate legitimate software activity:** Understand the normal behavior of software reliant on the .NET framework in your environment. Applications should regularly log usage under the `NGenAssemblyUsageLog` key. Any key tampering without expected application updates indicates potential malicious intent.

  - **Cross-reference with process creation events:** Forensic analysis of Sysmon logs (Event ID 1) should be conducted to associate system process creation with the timing of registry changes. Look for processes relating to .NET applications occurring immediately after or before registry modification.

  - **Inspect for evasion techniques:** Check for any environmental variable configurations that may influence logging behavior. The environment variable for `.NET` usage logging should not be pointing to unintended or fictitious paths post-modification.

  - **Collect incident artifacts:** If a change was made to suppress logging, verify the absence of usage log files at expected locations. Monitor for files indicating activity in a known malicious directory or the absence of files where legitimate data should exist.

  ### Prioritization

  This alert should be considered high severity as it targets a critical area of registry configuration that can facilitate persistence and malicious actions within a .NET execution context. The likelihood of malicious abuse is significant, considering the registry key is often weaponized for evasion purposes.

  ### Blind Spots and Assumptions

  This detection may miss modifications made through legitimate administrative or software functions. Evasion techniques such as reverting registry settings after malicious activity can evade this rule. Ensure Registry Auditing is enabled for comprehensive monitoring. Additionally, looking for complementary detections on `.NET` process anomalies or behavior can provide a more holistic view.

