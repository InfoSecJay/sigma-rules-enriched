  ---

  ### Technical Context

  This rule detects the creation of new file associations for executable files (.exe) through changes to the Windows Registry. Attackers may attempt to register a malicious executable to evade detection or mimic legitimate applications, thereby facilitating malicious execution without user awareness. The relevant MITRE ATT&CK tactic is Defense Evasion (T1562) and the technique is Application Layer Protocol (T1071).

  Primary telemetry sources include Windows Registry monitoring logs, specifically focusing on Registry Event IDs related to the modification of file associations. If successful, this behavior can allow an adversary to execute malicious payloads disguised as legitimate applications or files. This detection does NOT confirm that a system is compromised on its own but indicates suspicious activity that warrants further investigation.

  ---

  ### Investigation Steps

  - **Review Registry Change Events:** Check for Registry Event ID 4657 (Registry Value Modified) with TargetObject containing "Classes.\" and Details as "exefile." A benign indicator could be legitimate software installation or user-initiated changes to file associations.

  - **Correlate with Recent Process Creation:** Investigate Security Event ID 4688 (A process has been created) to see if a process linked to the modified file association was executed shortly after the registry change. Unusual executables or ones with obfuscated paths should raise alarms.

  - **Identify Frequency of Changes:** Look for multiple changes to file associations in a short timeframe. Legitimate software installations should result in a limited number of changes. A rapid sequence might indicate an automated or scripted attack, requiring further scrutiny.

  - **Check for Signature or Behavior Discrepancies:** Validate against known good software signatures or compare file creation times noted in Event ID 4663 (An attempt was made to access an object) for the target registry key. Malicious indicators include access times inconsistent with legitimate use.

  - **Monitor User Account Activity:** Review user account logs for unusual activity that corresponds to the time of the registry modification. Suspicious user accounts, especially those with elevated privileges making these changes, should be investigated.

  - **Assess the Impact of System Role:** Evaluate criticality of the affected system or endpoint. For example, changes affecting a domain controller or critical infrastructure system have higher stakes than a standard user workstation.

  ---

  ### Prioritization

  This alert should be treated with high severity due to the potential impact on system integrity and the likelihood of exploitation by threat actors. New executable associations are commonly weaponized for persistence and evasion, representing a significant risk in an enterprise environment.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive Registry monitoring, allowing some evasion techniques to bypass alerting. Legitimate software installers can trigger these alerts, so context from application whitelisting or Software Distribution tools is essential. Related detections could include alterations to known file system or application logging, which provide additional context for assessment.

