  ### Technical Context

  This rule detects when a new file association is created for executable files (exefile), which can indicate attempts to bypass security measures by mapping potentially malicious file types to executable actions. The likely attacker objective is to enable the execution of malicious payloads under the guise of benign file types, helping to facilitate persistence or malware execution. This behavior maps to the MITRE ATT&CK tactic of "Defense Evasion" (TA1211) and the technique "Modify Registry" (T1112).

  The primary telemetry sources are Windows Registry logs, specifically tracking modifications to HKEY_CLASSES_ROOT (HKCR). If malicious, the security impact includes possible unauthorized execution of malware disguised as normal files. It's important to note that this detection does NOT confirm that malicious activity has occurred on its own; further investigation is required to understand the context and intent behind the registry modification.

  ### Investigation Steps

  - **Verify registry changes:** Identify the Event IDs from the Windows Security log (Event ID 4657) or the Sysmon log (Event ID 13) that detail registry modifications, specifically targeting `HKEY_CLASSES_ROOT` and looking for new values associated with `exefile`.

  - **Assess the nature of the new association:** Check the `Data` field of the registry modification to identify what file extension is now associated with the `exefile` class. For benign behavior, look for typical associations (like `.txt`, `.docx`) rather than suspicious extensions (like `.vbs`, `.scr`).

  - **Determine the user context:** Identify which user account initiated the registry change by checking the `SubjectUserName` field. Investigate whether this user has administrative privileges or is performing actions outside of expected behavior for their role.

  - **Check for related suspicious activity:** Cross-reference with Windows Event ID 4688 (process creation) to identify if there were any executable processes initiated immediately following the registry change that may indicate malicious intent.

  - **Review system and user behaviors:** Examine the System event logs (Event ID 5145) for file access events that may indicate the execution of new extensions associated with `exefile`, especially identifying any recent execution of scripts or executables that are atypical for the organization.

  - **Identify evasion patterns:** Look for patterns of users attempting to create file associations shortly after recon or initial access activities. This can reveal a suspected campaign aimed at maintaining persistence.

  ### Prioritization

  This alert is categorized as high priority due to the impact of executable file associations on endpoint security and the likelihood of such tactics being weaponized by adversaries to circumvent security solutions. Given the direct ability of an attacker to execute code through the associated file types, this signifies a critical risk that requires immediate attention.

  ### Blind Spots and Assumptions

  Detection limitations include potential bypasses via alternative methods of modifying file types that do not log through traditional registry access. Reliable detection requires logging settings that ensure comprehensive auditing of registry access and modifications. Additionally, legitimate software installations might trigger this alert, particularly during updates. A companion detection to strengthen coverage includes monitoring for unusual spikes in process creation events (Event ID 4688) following registry changes related to executable handlers.

