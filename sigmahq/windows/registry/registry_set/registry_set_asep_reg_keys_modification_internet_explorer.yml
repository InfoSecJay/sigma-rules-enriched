logsource:
  category: registry_set
  product: windows
detection:
  ie:
    TargetObject|contains:
    - '\Software\Wow6432Node\Microsoft\Internet Explorer'
    - '\Software\Microsoft\Internet Explorer'
  ie_details:
    TargetObject|contains:
    - '\Toolbar'
    - '\Extensions'
    - '\Explorer Bars'
  filter_empty:
    Details: '(Empty)'
  filter_extensions:
    TargetObject|contains:
    - '\Extensions\{2670000A-7350-4f3c-8081-5663EE0C6C49}'
    - '\Extensions\{31D09BA0-12F5-4CCE-BE8A-2923E76605DA}'
    - '\Extensions\{789FE86F-6FC4-46A1-9849-EDE0DB0C95CA}'
    - '\Extensions\{A95fe080-8f5d-11d2-a20b-00aa003c157a}'
  filter_toolbar:
    TargetObject|endswith:
    - '\Toolbar\ShellBrowser\ITBar7Layout'
    - '\Toolbar\ShowDiscussionButton'
    - '\Toolbar\Locked'
  condition: ie and ie_details and not 1 of filter_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to the autostart extensibility points (ASEP) in the Windows registry specifically related to Internet Explorer. Such changes often indicate potentially malicious activities where an attacker may attempt to achieve persistence on a compromised system. By altering these registry keys, adversaries can ensure that their malicious payloads or tools are automatically executed whenever Internet Explorer is launched, thus maintaining access and potentially exfiltrating data or performing further actions without user awareness.

  The threat scenario involves an attacker leveraging these changes for initial persistence, potentially following successful exploitation of a target. The aim could include maintaining access to the environment, executing additional malicious operations, or enabling lateral movement within a network. The related MITRE ATT&CK techniques include T1547.001 (Registry Run Keys / Startup Folder), focusing on the persistence mechanism through registry modifications, and managing privilege escalation tactics.

  Primary data sources that will yield the best evidence for this detection include:
  - Windows Registry set event logs which record changes to registry keys.
  - Process creation events to track the launching of Internet Explorer after modifications to ASEPs.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent changes to the registry, specifically targeting keys in the paths `\Software\Microsoft\Internet Explorer` and `\Software\Wow6432Node\Microsoft\Internet Explorer`. This can provide insight into unauthorized modifications that may indicate malicious activity.

  - **Analyze Event Correlation:** Cross-reference registry modifications with process creation logs for Internet Explorer to establish if any suspicious executables launched as a result of these changes, indicating potential exploitation.

  - **Inspect Installed Extensions:** Investigate any newly installed or modified Internet Explorer extensions by querying related registry keys. Focus on known malicious or suspicious extensions as indicated by threat intelligence feeds.

  - **Validate User Intent:** Assess the context of the registry changes by determining if they were performed by legitimate users or processes. This includes checking administrative access logs for changes made during normal operations versus those under anomalous circumstances.

  ### Prioritization
  The alert's severity is medium due to the potential for persistent malicious activity on a compromised system, indicating an evolving threat landscape where attackers seek to maintain their presence undetected. Timely response to such alerts can prevent further exploitation and data exfiltration.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage regarding legitimate administrative actions that may modify autorun keys for valid purposes, as these can lead to false positives. The detection logic assumes that any modification to the specified keys is potentially suspicious, which might not always be accurate if proper context is not considered. For the alert to function effectively, access to Windows Registry change logs must be correctly configured and actively monitored within the environment.

