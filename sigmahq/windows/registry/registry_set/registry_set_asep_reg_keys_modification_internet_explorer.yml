logsource:
  category: registry_set
  product: windows
detection:
  ie:
    TargetObject|contains:
    - '\Software\Wow6432Node\Microsoft\Internet Explorer'
    - '\Software\Microsoft\Internet Explorer'
  ie_details:
    TargetObject|contains:
    - '\Toolbar'
    - '\Extensions'
    - '\Explorer Bars'
  filter_empty:
    Details: '(Empty)'
  filter_extensions:
    TargetObject|contains:
    - '\Extensions\{2670000A-7350-4f3c-8081-5663EE0C6C49}'
    - '\Extensions\{31D09BA0-12F5-4CCE-BE8A-2923E76605DA}'
    - '\Extensions\{789FE86F-6FC4-46A1-9849-EDE0DB0C95CA}'
    - '\Extensions\{A95fe080-8f5d-11d2-a20b-00aa003c157a}'
  filter_toolbar:
    TargetObject|endswith:
    - '\Toolbar\ShellBrowser\ITBar7Layout'
    - '\Toolbar\ShowDiscussionButton'
    - '\Toolbar\Locked'
  condition: ie and ie_details and not 1 of filter_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the autostart extensibility points (ASEP) in the Windows registry related to Internet Explorer. These modifications can allow an attacker to execute malicious code during system startup or user login, often leveraging browser functionalities for persistence or privilege escalation. The relevant MITRE ATT&CK tactic is "Persistence" (ID: TA0003), specifically technique T1547.001 which pertains to registry run keys and startup folder modifications. Primary telemetry sources include Windows registry logs, specifically monitoring changes within `Software\Wow6432Node\Microsoft\Internet Explorer` and related keys. If detected, this activity could allow an attacker to maintain control over the compromised system undetected. It is important to note that this detection does NOT confirm malicious intent on its own, as legitimate software installations may also modify these registry keys.

  ### Investigation Steps

  - **Review registry modification logs:** Check for changes to registry paths (`Software\Wow6432Node\Microsoft\Internet Explorer` and `Software\Microsoft\Internet Explorer`) using Event ID 4657 or Sysmon Event ID 13 for more context on what was altered.

  - **Identify recent changes in user activity:** Look at the User SID associated with the registry modification. Legitimate modifications often follow a set of administrative user activities, review actions by admin accounts, and timestamps (e.g., Event ID 4624 for successful logon).

  - **Investigate specific autostart keys for malicious indicators:** Check for suspicious or known malicious extensions within the target object, especially looking for keys beyond legitimate Default or Microsoft references, such as those outlined in malicious software research.

  - **Assess installed software:** Confirm if any new or unusual software installations coincide with registry modification timestamps by reviewing the Application event logs for Event ID 11707, which indicates application install events.

  - **Determine benign behavior:** Acknowledge that certain enterprise-level software installations or updates may legitimately alter these keys; hence, consult organization's software deployment records to correlate recent legitimate actions.

  - **Check for indications of persistence:** Investigate other success indicators of persistence, such as related detections for scheduled tasks or services that may correspond to the identified registry changes.

  ### Prioritization

  This alert is categorized as medium severity. While the modification of autorun keys can indicate malicious behavior, this is a common technique used by both attackers and legitimate administrative processes. High impact is associated with systems in critical server roles where compromise could lead to widespread access and lateral movement within the network.

  ### Blind Spots and Assumptions

  Detection may be limited by false positives from benign administrative actions or legitimate software installations. Ensure that all necessary logging for registry modifications is enabled for comprehensive coverage. Legitimate browser updates may also trigger this alert, so context must be carefully reviewed. Related detections include monitoring for changes in scheduled tasks (T1053) or startup folder entries (T1218.008), which would provide broader visibility into persistence mechanisms.

