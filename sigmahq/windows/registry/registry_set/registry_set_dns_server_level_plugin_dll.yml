note: |
  ### Technical Context

  This detection identifies modifications made to the Windows Registry that specify a DNS Server Level Plugin DLL through the `ServerLevelPluginDll` parameter. Such installations can enable attackers to execute arbitrary code in the context of the DNS server, potentially allowing for privilege escalation and persistence within the environment. The attacker typically aims to gain control over DNS queries, leading to data exfiltration or infrastructure manipulation.

  Relevant MITRE ATT&CK tactics include "Privilege Escalation" and "Persistence," specifically techniques T1574.001 (DLL Side-Loading) and T1112 (Modification of Registry). The primary telemetry sources are Windows Registry changes, specifically identified by monitoring registry set events. If malicious, this could lead to severe security impacts, such as unauthorized access to sensitive systems or complete takeover of the DNS server's functionalities. Importantly, this detection does NOT confirm that malicious activity is occurring; further investigation is necessary.

  ### Investigation Steps

  - **Review Registry Changes:** Examine Windows Registry Event logs (Security Event ID 4663) for changes to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DNS\Parameters\ServerLevelPluginDll`. Note legitimate updates that may occur during authorized DNS software updates.

  - **Check DLL Integrity:** Verify the hash of the installed DLL against known safe hashes using file monitoring solutions (e.g., Sysmon Event ID 10). Legitimate DNS plugin DLLs should have recognized vendors; unknown or suspicious hashes warrant further scrutiny.

  - **Correlate with Other Activities:** Look for other related events in the Security logs, such as suspicious process creation (Windows Event ID 4688) that may coincide with the DLL installation, indicating potential malicious behavior.

  - **Identify Runtime Context:** Investigate the service account context under which the DNS service operates (Service SID). Any unexpected service accounts or permission escalations detected during this process could indicate malicious intent.

  - **Examine Network Activity:** Review network flow logs to identify unusual outbound DNS traffic linked to the altered DNS settings. Look for signs of data exfiltration or communication with known malicious domains using DNS logs.

  - **Consult Peer Activities:** Check for similar registry modifications in other DNS servers across the organization to identify potential widespread exploitation. Validate legitimate maintenance activities that may align with the suspicious changes.

  ### Prioritization

  This alert is of high severity due to the critical role of DNS services in an enterprise environment. The likelihood of malicious abuse is significant, considering the functionality that such a DLL could provide to an attacker. The behavior detected is commonly weaponized in targeted attacks, making it essential for quick response.

  ### Blind Spots and Assumptions

  Potential evasion methods include attackers using obfuscated names for DLLs or changing the registry keys to mask their activities. Reliable detection requires comprehensive monitoring of Windows Registry changes and maintaining an updated list of legitimate DLLs. Legitimate activities might occur during software upgrades or administrative changes to DNS settings. Companion detections such as monitoring for unusual process creation linked to the DNS service could further enhance security posture.

