note: |
  ### Technical Context

  This rule detects the installation of a DNS Server Level Plugin DLL via modifications to the registry specifically targeting the `ServerLevelPluginDll` parameter. Such changes can allow an attacker to execute code within the context of the DNS server, potentially enabling privilege escalation, persistence, or evasion of detection mechanisms. The likely objective of the attacker is to compromise the DNS service, leveraging it as a vector for further attacks or data exfiltration. This behavior aligns with the MITRE ATT&CK techniques T1574.001 (DLL Side-Loading) and T1112 (Modify Registry).

  Primary telemetry sources include Windows Registry modifications (eventually captured by registry auditing or SIEM solutions). If this change is malicious, it could allow attackers to manipulate DNS queries or responses, leading to unauthorized access or data breaches. It is critical to note that the detection of this registry modification does NOT confirm that any malicious activity has occurred without context, as legitimate plugins may also use this registry key.

  ### Investigation Steps

  - **Verify the registry modification:** Check for changes in the Windows registry at `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DNS\Parameters` for the `ServerLevelPluginDll` key. Document any unusual or unexpected DLL names.

  - **Collect event logs:** Review Windows Security Event ID 4663 for object access and changes related to the DNS service. Ensure to look for unauthorized users or non-standard access times.

  - **Identify legitimate behavior:** Understand and document the typical DLLs associated with DNS server operations in your environment. For example, note any authorized plugins that are standard for your organization's DNS configuration.

  - **Check for process anomalies:** Utilize Sysmon Event ID 1 to check for the execution of any processes initiated by the newly registered DLL. Look for unusual parent-child relationships or unexpected command-line arguments.

  - **Correlate with user behavior:** Inspect account logins and actions (Windows Event ID 4624) for any accounts that could have installed or modified the registry entry, particularly focusing on administrative accounts.

  - **Assess the impact of the affected system:** Evaluate the criticality of the DNS server within your network infrastructure and potential risks posed by a compromised DNS service, including possible lateral movement or data exfiltration.

  ### Prioritization

  This alert is of high severity due to the potential impact on system integrity and security; a compromised DNS service is a significant risk to the entire network. The likelihood of malicious abuse is high, as attackers routinely exploit vulnerabilities in DNS services to execute further attacks. This behavior is commonly weaponized in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection is limited by the requirement for robust registry auditing, and potential evasion techniques include legitimate changes made by authorized software or administrators. False positives may arise from valid updates or installations of DNS plugins. Related detections that could enhance monitoring effectiveness include alerts for unusual process creation from DNS service processes (Sysmon Event ID 1) or monitoring for suspicious user account activity tied to DNS administrative changes.

