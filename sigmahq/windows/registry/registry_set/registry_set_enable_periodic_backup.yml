title: Periodic Backup For System Registry Hives Enabled
id: 973ef012-8f1a-4c40-93b4-7e659a5cd17f
status: test
description: |
  Detects the enabling of the "EnablePeriodicBackup" registry value. Once enabled, The OS will backup System registry hives on restarts to the "C:\Windows\System32\config\RegBack" folder. Windows creates a "RegIdleBackup" task to manage subsequent backups.
  Registry backup was a default behavior on Windows and was disabled as of "Windows 10, version 1803".
references:
- https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/system-registry-no-backed-up-regback-folder
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-07-01
tags:
- attack.collection
- attack.t1113
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control\Session Manager\Configuration Manager\EnablePeriodicBackup'
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
- Legitimate need for RegBack feature by administrators.
level: medium
note: |
  ### Technical Context
  This detection rule identifies the enabling of the "EnablePeriodicBackup" registry value, which is responsible for triggering periodic backups of system registry hives to the "C:\Windows\System32\config\RegBack" directory. Enabling this feature can give attackers an opportunity to manipulate or restore previous registry states, thereby covering tracks or ensuring persistence after a compromise. While registry backups were a default feature in earlier versions of Windows, they were disabled in Windows 10 version 1803 onward, which means that their reactivation could signify suspicious or malicious behavior.

  Potential threat actors may leverage this functionality to reinstate hidden malware or tools that have been previously purged from a compromised system, aiding in their persistence. This behavior aligns with MITRE ATT&CK techniques, specifically under the tactic of Collection, with the relevant technique being "Data from Information Repositories" (T1113). The primary data source for monitoring this behavior is the Windows registry logs, focusing on changes made to registry values tied to system and configuration management.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the Windows registry logs to confirm recent changes to the "EnablePeriodicBackup" value and identify the timestamp and initiator of the change.
  - **Analyze Scheduled Tasks**: Investigate scheduled tasks related to "RegIdleBackup" to determine if any unauthorized modifications or executions have taken place since this may indicate malintent.
  - **Assess System Behavior**: Look for unusual activities or processes initiated around the same time the registry value was changed, including any impacts on system performance or network activity.
  - **Consult User Activity Logs**: Gather telemetry from authentication and user activity logs to identify if any suspicious accounts executed the changes and correlate those activities with other potential threats.

  ### Prioritization
  This alert carries medium severity as the enabling of the "EnablePeriodicBackup" registry value can expose systems to vector attacks for regaining access or achieving persistence. The likelihood that this is an unauthorized configuration change should be high, especially in environments where default settings are expected to remain unchanged post-deployment.

  ### Blind Spots and Assumptions
  This detection rule is limited in scope by assuming that only nefarious alterations will trigger an alert. It may overlook legitimate administrative actions performed by system administrators who expressly need the Registry Backup feature. Furthermore, if logging for registry modifications is not configured correctly, the detection might not capture all relevant events. Therefore, it is crucial that the Windows registry logging is enabled and appropriately configured to ensure the reliability of this alert.

