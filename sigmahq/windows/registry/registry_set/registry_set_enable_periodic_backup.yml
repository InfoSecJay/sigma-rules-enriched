title: Periodic Backup For System Registry Hives Enabled
id: 973ef012-8f1a-4c40-93b4-7e659a5cd17f
status: test
description: |
  Detects the enabling of the "EnablePeriodicBackup" registry value. Once enabled, The OS will backup System registry hives on restarts to the "C:\Windows\System32\config\RegBack" folder. Windows creates a "RegIdleBackup" task to manage subsequent backups.
  Registry backup was a default behavior on Windows and was disabled as of "Windows 10, version 1803".
references:
- https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/system-registry-no-backed-up-regback-folder
author: Nasreddine Bencherchali (Nextron Systems)
date: 2024-07-01
tags:
- attack.collection
- attack.t1113
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control\Session Manager\Configuration Manager\EnablePeriodicBackup'
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
- Legitimate need for RegBack feature by administrators.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the enabling of the "EnablePeriodicBackup" registry value within Windows operating systems, specifically targeting the registry key that governs the backup of system registry hives. The likely attacker objective here could be to establish persistence and maintain a backup of critical registry data, facilitating further system manipulation or recovery after exploitation. The relevant MITRE ATT&CK tactic is **Collection** (TA0009) with the technique being **Data from Information Repositories** (T1113).

  The primary telemetry sources for this detection are registry change logs that can be captured through advanced monitoring tools or Windows auditing features. If malicious, enabling this feature can allow attackers to maintain access to control settings, thereby enhancing their persistence mechanisms. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate administrative functions may also trigger the alert, such as IT personnel re-enabling the RegBack feature.

  ### Investigation Steps

  - **Check registry value change:** Review Windows Security Event ID 4657 for changes to registry values, specifically searching for modifications to `\Control\Session Manager\Configuration Manager\EnablePeriodicBackup` with a `Details` value of `DWORD (0x00000001)`.

  - **Identify recent administrative actions:** Query the Security Event Log for Event ID 4624 (Logon) to verify recent logins by administrators, focusing on the times surrounding the registry change (considering user names and IP addresses).

  - **Review task scheduler for anomalies:** Inspect Task Scheduler (task name: `RegIdleBackup`) via Event ID 4697 (New Service) to determine if the task has been created or modified unexpectedly, indicating a possible malicious configuration.

  - **Validate typical use cases:** Confirm expected behavior by checking for documentation or queries regarding administrative procedures that legitimize the enabling of the Periodic Backup feature, especially for specific assets in use (like servers under maintenance).

  - **Assess system impact:** Review the importance of the affected system regarding asset criticality—if major, assess potential exploitation impact and consider isolating it until further analysis is completed.

  ### Prioritization

  The alert should be regarded with medium severity, as enabling this feature on critical systems enhances the risk of adversaries maintaining persistence and recovering settings after unauthorized changes. While there are legitimate use cases, the potential for abuse remains, especially in systems where attackers may already have footholds.

  ### Blind Spots and Assumptions

  Detection limitations include possible evasion by attackers who may disable or modify logging settings to conceal registry changes. Required log sources include enforced auditing on registry changes to ensure comprehensive visibility. Legitimate administrative activities, such as routine maintenance by IT staff, can also lead to this alert being triggered. A companion detection would be monitoring for changes to other system configurations or critical service manipulations (e.g., unauthorized creation of system services) to strengthen coverage against potential adversary behaviors.

