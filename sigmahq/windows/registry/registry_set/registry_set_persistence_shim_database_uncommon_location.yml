title: Potential Persistence Via Shim Database In Uncommon Location
id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
status: test
description: Detects the installation of a new shim database where the file is located
  in a non-default location
references:
- https://www.fireeye.com/blog/threat-research/2017/05/fin7-shim-databases-persistence.html
- https://andreafortuna.org/2018/11/12/process-injection-and-persistence-using-application-shimming/
- https://www.blackhat.com/docs/asia-14/materials/Erickson/Asia-14-Erickson-Persist-It-Using-And-Abusing-Microsofts-Fix-It-Patches.pdf
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-08-01
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.011
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\'
    - '\DatabasePath'
  filter_main_known_locations:
    Details|contains: ':\Windows\AppPatch\Custom'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies the creation of a new shim database located outside of standard directories, potentially signifying an attempt to establish persistence by attackers. Attackers may leverage shim databases to inject malicious code into legitimate applications, allowing them to maintain a foothold in the system or execute arbitrary code with elevated privileges. The presence of a shim database in a non-default location raises red flags as it deviates from expected behavior and may indicate obfuscation techniques used by threat actors.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Persistence (T1546.011)**, where attackers exploit application shimming to persist through reboots, and **Privilege Escalation (T1068)**, as successful exploitation can grant unauthorized access to higher privileges within the system. The primary data sources to investigate for evidence include Windows registry logs, particularly focused on AppCompatFlags, and file system activity that might capture the creation and modification of shim databases.

  ### Investigation Steps
  - **Review Registry Logs**: Inspect the Windows registry logs for keys indicating the presence of new shim databases, especially in the `InstalledSDB` path outside of normal locations (e.g., `C:\Windows\AppPatch\Custom`).

  - **Analyze Process Creation Events**: Check for recent process creation events that coincide with the installation of the shim database, focusing on abnormal command-line arguments or unusually high levels of file access permissions.

  - **Correlate with EDR Alerts**: Utilize EDR tools to detect any related execution events that may indicate process injection or other abnormal behaviors related to the applications using the shim database. Look for any anomalies like unexpected parent-child relationships in processes.

  - **Investigate File System Changes**: Look for changes in relevant directories and files during the period leading up to the detection of the new shim database. Consider running file integrity monitoring or comparing current states against baseline measurements.

  ### Prioritization
  The alert's severity is rated high due to the potential for significant impact resulting from persistent access and privilege escalation capabilities. Given that shim databases can facilitate undetected modifications to legitimate applications, the likelihood of exploitation warrants immediate attention.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage is the possibility of legitimate administrative actions that involve creating shim databases for troubleshooting or compatibility reasons, which could lead to false positives. The detection logic assumes that activity outside of standard directory paths is malicious; therefore, a review of organizational policies regarding application maintenance is essential. Required logs include comprehensive windows registry auditing and file change monitoring to ensure that the alert activates based on actual malicious behavior.

