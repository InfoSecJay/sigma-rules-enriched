logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains|all:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\'
    - '\DatabasePath'
  filter_main_known_locations:
    Details|contains: ':\Windows\AppPatch\Custom'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the installation of a shim database in a non-standard location on Windows systems. Attackers often utilize shim databases for persistence, allowing them to execute code without altering the original application files, thus evading detection. The likely attacker objective is to achieve persistence via application shimming, facilitating future reconnections to the compromised system or execution of malicious payloads.

  This behavior aligns with the MITRE ATT&CK technique T1546.011 (Event Triggered Execution: Application Layer). The primary telemetry sources include Windows Registry logs, particularly focusing on the `registry_set` category. If malicious, such activity could lead to prolonged unauthorized access and system manipulation. Importantly, this detection alone does not confirm malicious intent; legitimate applications can also create shim databases in non-default locations.

  ### Investigation Steps

  - **Review Registry Changes:** Check for Registry Event ID 4657 to identify any modifications in the target object path `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\` and ensure they are not located in `C:\Windows\AppPatch\Custom`.

  - **Cross-Reference File Locations:** Verify the shim database file paths against known legitimate application directories. Any unexpected locations (e.g., user profile directories) could indicate potential malicious behavior.

  - **Identify Installed SDBs:** Use PowerShell to list installed shim databases with `Get-WmiObject -Namespace root\Microsoft\Windows\WMI -Class MSSQL_SDB` and correlate them with any recent changes in the registry for irregularities.

  - **Examine Process Creation Logs:** Check Security Event ID 4688 or Sysmon Event ID 1 for any processes that were spawned in conjunction with the shim database installations, specifically focusing on unexpected parent process relationships.

  - **Assess for High-Confidence Indicators:** Look for evidence of known malicious indicators, such as hashes of identified malware, within the created shim database files. Utilize threat intelligence platforms to validate findings.

  - **Determine Legitimate Usage Patterns:** Consider any scheduled tasks or application updates that may require legitimate shim database creation and verify the timestamps and associated user accounts.

  ### Prioritization

  This alert is categorized as high severity due to the potential impact on critical systems if exploited for persistence. The likelihood of malicious abuse is heightened, as attackers consistently leverage similar techniques to establish footholds in compromised environments. The behavior detected is recognized as a common tactic among threat actors.

  ### Blind Spots and Assumptions

  Detection may be limited by scenarios where legitimate applications cause similar registry changes, potentially leading to false positives. Effective monitoring requires ensuring that Windows Registry logging is configured correctly and that necessary log sources are enabled. Additionally, application updates or legitimate software installations can trigger similar alerts. Establishing companion detections, such as monitoring for unusual process creations or network connections tied to modified shim databases, can improve overall detection coverage.

