note: |
  ### Technical Context
  This rule detects attempts to disable the Anti-Malware Scan Interface (AMSI) by monitoring changes to the `AmsiEnable` registry setting in Windows. The AMSI is an important defense mechanism that enables applications to interact with anti-malware products to scan for potentially harmful content. Attackers often disable AMSI to facilitate the execution of malicious scripts or code without being detected by security solutions, effectively allowing them to evade defenses and carry out their objectives, such as deploying malware or exfiltrating data.

  The relevant MITRE ATT&CK tactics include **Defense Evasion** (TA0005), and specifically techniques **T1562.001** (Disable or Tamper with Security Tools) and **T1562.006** (Disable or Tamper with Security Audit). By monitoring registry changes indicative of AMSI disabling, security teams can identify possible malicious behavior early in an attack campaign, particularly in post-exploitation scenarios where active persistence and privilege escalation tactics may be employed.

  Primary data sources for this detection include Windows registry logs which track changes to system settings, particularly under the `HKEY_LOCAL_MACHINE` or `HKEY_CURRENT_USER` registry hives.

  ### Investigation Steps
  - **Review Registry Changes:** Examine registry modification logs specifically for changes to the `AmsiEnable` key located in `Software\Microsoft\Windows Script\Settings`. Look for entries indicating a change to `DWORD (0x00000000)`.

  - **Correlate User Activity:** Investigate the user account or service that executed the registry modification. Cross-reference logs from user authentication sources to identify any suspicious or anomalous login patterns.

  - **Analyze Execution Context:** Check for recent process creation events around the time of the registry change. Look for executables or scripts that may relate to known malware or unauthorized tools that have been reported for AMSI bypass techniques.

  - **Collect Endpoint Data:** Use EDR tools to gather additional context from endpoints where changes were detected, including memory analysis, process trees, and command-line arguments that could indicate the execution of malicious payloads.

  ### Prioritization
  The severity of this alert is high, as disabling AMSI is commonly associated with sophisticated attack methods and can lead to significant security breaches, allowing adversaries to execute malicious code undetected.

  ### Blind Spots and Assumptions
  This detection logic may not capture all instances of AMSI being disabled, especially if attackers use alternative methods or tools to achieve the same objectives without altering the registry. The assumption is that all relevant logs from registry modifications are collected and stored adequately by the security infrastructure. Required configurations include enabling audit policies for registry changes and ensuring continuous monitoring of the Windows registry to detect such modifications promptly.

