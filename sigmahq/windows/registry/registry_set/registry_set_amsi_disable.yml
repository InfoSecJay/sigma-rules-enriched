note: |
  ### Technical Context

  This Sigma rule detects attempts to disable the Anti-Malware Scan Interface (AMSI) by modifying the AmsiEnable registry value to a DWORD value of 0. Attackers often target AMSI to circumvent security measures, thereby facilitating the execution of potentially malicious scripts without detection by antivirus solutions. This behavior fits within the MITRE ATT&CK framework under the tactic of Defense Evasion, specifically technique T1562.001 (Disable or Evade Anti-Malware Software).

  Key telemetry sources for detection include Windows Registry logs, particularly focused on modifications to the key located at `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows Script\Settings\AmsiEnable`. If this rule triggers, it indicates a potential security risk as it could allow malware to operate undetected. However, it is crucial to clarify that this detection alone does not confirm that malicious activity is occurring, only that an attempt to disable a security feature has been made.

  ### Investigation Steps

  - **Check the registry modification:** Inspect the Windows Registry for changes to the `AmsiEnable` key with value set to `0` (DWORD). Utilize a tool such as RegEdit or PowerShell to query `Get-ItemProperty -Path 'HKLM:\Software\Microsoft\Windows Script\Settings' -Name 'AmsiEnable'`.

  - **Review recent process execution:** Examine Security Event ID 4688 logs for any suspicious process creation events immediately before or after the registry change, specifically looking for PowerShell (PID 0) or script execution indicating potentially malicious intent.

  - **Cross-reference against known applications:** Verify if the application or service that performed the registry change is authorized and expected within the environment. Trusted and legitimate tools should not deactivate AMSI.

  - **Identify common legitimate behaviors:** Confirm that commonly used applications (e.g., management scripts, internal tools) that modify this registry key have a valid use case or specific need for AMSI to be disabled, tracking user impact or system maintenance documentation.

  - **Determine the presence of malware indicators:** Search for presence of artifacts associated with known malware behaviors or usage of scripts commonly weaponized to exploit AMSI, such as downloading or executing scripts from untrusted sources.

  - **Check for other detection signals:** Correlate this event with other detections or logs indicating exploitation attempts or evasion techniques, such as incompatible Actions documented in similar detections (e.g., Registry Tampering) to enhance the overall incident context.

  ### Prioritization

  Given the potential impact on system integrity and security, disabling AMSI is considered a significant threat, especially if observed on critical systems or where user access indicates likelihood of exploitation. The technique exploited is prevalent among advanced persistent threats (APTs) and malware campaigns, warranting a high-severity classification.

  ### Blind Spots and Assumptions

  This detection may be evaded using alternative methods or through custom script behaviors that do not engage with the AMSI registry settings directly. Ensure relevant Windows Registry auditing is enabled to capture these changes reliably, as logging may need configuration for full coverage. Legitimate administrative tasks, such as setting specific environmental configurations in development environments, may trigger this rule. Consider companion detections within the AMSI bypass scope, such as `Windows AMSI Related Registry Tampering Via CommandLine`, to bolster coverage.

