note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry that disable the Anti-Malware Scan Interface (AMSI) by setting the `AmsiEnable` registry value to `0`. Attackers often accomplish this to circumvent security measures, enabling them to execute malicious code without detection during the initial execution phase. This behavior pertains to the MITRE ATT&CK tactic of Defense Evasion (TA0005), specifically the technique T1562.001 (Disable or Evade Security Tools).

  The primary telemetry source for this detection is the Windows Registry, specifically monitoring for registry set events related to `AmsiEnable`. The security impact of this behavior is significant, as it allows for the unimpeded execution of potentially harmful scripts or executable code. However, this detection does NOT confirm that malicious activity has occurred; it merely indicates an attempt to disable a security feature.

  ### Investigation Steps

  - **Check the registry modification details:** Review Event ID 4657 (Registry Value Modified) for changes to `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows Script\Settings\AmsiEnable`. Look for the `Value` field set to `0`. This is a strong indicator of potential malicious intent.

  - **Assess execution context:** Cross-reference with process creation events (Security Event ID 4688 or Sysmon Event ID 1) around the time of the registry change. Look for suspicious command lines or processes related to PowerShell or other scripting engines that may indicate exploitation.

  - **Investigate legitimate activities:** Identify if any maintenance or configuration changes occurred around the same timestamps, such as updates or admin tasks that typically involve registry modifications. Document any associated user accounts and corroborating actions.

  - **Confirm malicious indicators:** Look for previous logged actions or scripts executed by users or services that might commonly attempt to disable AMSI, e.g., specific PowerShell commands or tools known for bypassing security measures.

  - **Review alert history and context:** Analyze if this alert corresponds with previous similar alerts and the overall behavior of high-risk accounts within the organization. Consider asset criticality, especially for servers or machines holding sensitive data.

  ### Prioritization

  This alert is of high severity due to the potential for significant compromise across the enterprise. The risk of malicious abuse is elevated since disabling AMSI is a common tactic employed by many threats. It is important to investigate promptly, as this behavior can facilitate deeper infiltration if ignored.

  ### Blind Spots and Assumptions

  Detection can be circumvented if an attacker uses alternative means to disable AMSI or modifies the registry in a non-detectable fashion. Reliable detection requires proper auditing configurations and monitoring of critical registry paths. Legitimate activities such as administrative maintenance or scripted deployments may inadvertently trigger this alert. A related companion detection to consider is monitoring for unusual PowerShell executions (e.g., via Sysmon Event ID 4104) that may indicate attempts to run scripts post-registry modification.

