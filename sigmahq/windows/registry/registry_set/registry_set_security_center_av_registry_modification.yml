title: Potential HackTool - Defendnot Security Center AV Registry Modification
id: 9991c683-05aa-47b7-a865-df14dc4b9dc4
status: experimental
description: |
  Detects modification of the Microsoft Security Center AV registry keys, particularly those related with DisplayName, ProductEXE, or ReportingExe.
  These keys typically store information about antivirus products installed on the system, which is Windows Defender or third-party antivirus software.
  But, if these keys holds unexpected values or are modified in a suspicious manner, it could indicate an attempt to tamper with the security settings of the system.
references:
- https://www.huntress.com/blog/defendnot-detecting-malicious-security-product-bypass-techniques
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-10-18
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Software\Microsoft\Security Center\Provider\Av\'
    TargetObject|endswith:
    - '\ProductEXE'
    - '\DisplayName'
    - '\ReportingExe'
  filter_optional_antivirus:
    Image: 'C:\Windows\System32\svchost.exe'
    Details|contains:
    - 'Avira'
    - 'Windows Defender'
    - 'Microsoft Defender'
    - 'Sophos'
    - 'Kaspersky'
    - 'ESET'
    - 'Bitdefender'
    - 'Trend Micro'
    - 'McAfee'
    - 'Symantec'
    - 'CrowdStrike'
    - 'SentinelOne'
    - 'Carbon Black'
    - 'Elastic'
    - 'Cortex'
    - 'AVG'
    - 'Avast'
    - 'Malwarebytes'
  condition: selection and not 1 of filter_optional_*
falsepositives:
- Legitimate changes by antivirus software missing in the filter list
level: medium # Update to high after baselining the rule and trimming false positives
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Security Center's antivirus registry keys, specifically those related to DisplayName, ProductEXE, and ReportingExe. These keys contain identifiers for installed antivirus software and changes to them could indicate attempts to disable or bypass security measures, a common tactic for adversaries seeking to exploit vulnerable systems without detection. The relevant MITRE ATT&CK tactic is **Defense Evasion** (TA0040), with technique **T1685: Manipulation of Security Software**.

  The primary telemetry sources include Windows Registry change events, specifically focusing on modifications to keys under `HKEY_LOCAL_MACHINE\Software\Microsoft\Security Center\Provider\Av\`. The security impact of malicious registry modifications can include reduced detection and protection capabilities, potentially allowing attackers to deploy malware or conduct further exploits unnoticed. This detection alone does not confirm that a malicious activity is occurring; it may also indicate legitimate changes by antivirus software that are unrecognized by the filter.

  ### Investigation Steps

  - **Review registry changes:** Check for modifications under the key `HKEY_LOCAL_MACHINE\Software\Microsoft\Security Center\Provider\Av\` for Event ID 4657 (Registry Value Changed). Look for unexpected or suspicious changes to the `DisplayName`, `ProductEXE`, and `ReportingExe` values.

  - **Identify modification source:** Investigate the `Image` value associated with the registry change. If `Image` is `C:\Windows\System32\svchost.exe`, analyze the legitimacy of this process. High confidence indicators of malicious activity exist if the editing service or executable is associated with known malicious behavior rather than legitimate antivirus products.

  - **Analyze behavioral patterns:** Look for common patterns in the modifications, such as any case where the `DisplayName` key changes from a legitimate antivirus to a non-existing or suspicious application. Document occurrences where third-party antivirus agents are involved.

  - **Examine other telemetry:** Correlate with endpoint security logs (e.g., EDR solutions) to confirm if other activities, such as process creation or network connections by the service modifying the registry, align with normal behavior or indicate malicious intent.

  - **Validate benign activity:** Identify instances of legitimate changes made during antivirus updates that correspond with expected timestamps or maintenance schedules. Normal update behavior typically involves no unexpected modifications to the registry keys listed.

  - **Check surrounding events:** Review Security Event ID 4688 for new process creations linked to the same timeframe as the registry changes. Persistent instances of `svchost.exe` modifying these keys without accompanying antivirus update events might signal potential threats.

  ### Prioritization

  This alert should be treated with medium to high severity. The impact on the affected system can be significant, especially if the antivirus software is rendered ineffective or bypassed. The likelihood of malicious abuse is moderate, as attackers often manipulate security software settings to facilitate further exploitation. Such behavior can lead to the widespread compromise of systems if not quickly addressed.

  ### Blind Spots and Assumptions

  Detection limitations may arise from legitimate antivirus software introducing changes that are not included in the filter list. False positives can occur, particularly during standard software updates or changes in product configuration. Reliable detection requires the comprehensive logging of registry changes, including detailed process information on registry modifications. A related detection to enhance coverage could involve tracking abnormal process behavior associated with `svchost.exe` in the context of unauthorized registry modifications.

