note: |
  ### Technical Context

  This rule detects attempts to disable Potentially Unwanted Application (PUA) protection in Windows Defender by identifying changes to the registry setting that governs this feature. The likely attacker objective is to reduce endpoint security measures to allow the installation and execution of potentially malicious or undesired software. This behavior aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and the technique "Modify Registry" (T1112).

  The primary telemetry source for this detection is the Windows registry, specifically the event that logs registry modifications. If this action is malicious, it could facilitate unauthorized installations of software that may be used for further exploitation or persistence on the system. This detection does not confirm that a malicious actor has successfully compromised the system, but rather indicates a potential prelude to further malicious actions.

  ### Investigation Steps

  - **Check Registry Modification Events:** Review Windows Security Event ID 4657 or Sysmon Event ID 13 for details of the registry change at `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows Defender\PUAProtection`. Look for the value changing to `DWORD (0x00000000)`, which indicates PUA protection has been disabled.

  - **Correlate with User Activity:** Identify which user performed the action by reviewing Security Event ID 4672 (Special Privileges Assigned to New Logon) around the same timeframe. Legitimate administrative tasks may include enabling/disabling security features per policy changes.

  - **Examine System Integrity:** Inspect endpoint logs for other changes around the same time, such as installing new software or modifications to security products. Look for Sysmon Event ID 1 to identify process creation events that happen post-registry modification.

  - **Assess Endpoint Role:** Determine if the affected system is critical to operations or hosts sensitive data by consulting asset management logs. Disabling security measures on endpoints with high-value data increases risk.

  - **Develop an Incident Response Plan:** If correlating logs suggest malicious intent, initiate an investigation based on endpoint and network behavior in relation to the registry change.

  ### Prioritization

  The severity of this alert is high due to the potential impact on endpoint security and the likelihood that disabling PUA protection could be exploited by malicious actors to facilitate harmful software installation. This behavior is commonly associated with adversaries looking to bypass protections in order to execute further attacks.

  ### Blind Spots and Assumptions

  Limitations include the possibility of legitimate administrative actions triggering the alert, particularly in environments where security configurations frequently change. Reliable detection requires that registry auditing is enabled across all endpoints. Legitimate software installations or configurations may unintentionally prompt this alert. A related detection to strengthen coverage is monitoring for abnormal software installs or process creations that follow the disabling of security measures, helping to validate the context of the action.

