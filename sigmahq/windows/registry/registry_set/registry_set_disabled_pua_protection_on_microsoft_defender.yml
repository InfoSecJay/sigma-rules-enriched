note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows registry that disable Potentially Unwanted Application (PUA) protection within Windows Defender, specifically by setting the PUAProtection value to zero (0). This action may allow unauthorized software to install or execute with reduced scrutiny, ultimately facilitating malicious activities such as the deployment of adware or spyware. The relevant MITRE ATT&CK tactic is Defense Evasion (T1562.001).

  The primary telemetry source for this detection includes Windows registry modifications, specifically under the path `\Policies\Microsoft\Windows Defender\PUAProtection`. If implemented maliciously, disabling this protection can significantly increase the security risk by permitting harmful applications to avoid detection. However, this detection does not confirm an active compromise on its own; it may simply indicate an administrative change or a benign software modification.

  ### Investigation Steps

  - **Check registry settings:** Review the registry key at `HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows Defender\PUAProtection` for a value of DWORD (0x00000000). A value of 1 (DWORD) should indicate PUA protection is enabled and expected.
  - **Audit user account changes:** Review Security Event ID 4672 (Special privileges assigned to new logon) for any administrative account activity around the time of registry modification. Look for unexpected admin logins or changes to user roles.
  - **Correlate with security alerts:** Investigate prior endpoint security alerts in the last 30 days to observe patterns of activity that might suggest preparations for further malicious behavior; see Windows Defender logs or SIEM logs for pertinent alerts.
  - **Identify legitimate application behavior:** Assess installed applications on the affected endpoint; legitimate application updates may adjust PUA settings. Document any known software installations or updates performed near the time of registry change to differentiate from suspicious activity.
  - **Review history of system modifications:** Use Sysmon Event ID 13 (Registry mod) to gather context on processes that triggered the registry modification, noting legitimate applications that have modified this key in the past.
  - **Evaluate related registry changes:** Look for other related registry modifications around the same timestamp that might indicate malicious intent, such as those targeting other Windows Defender settings or security policies.

  ### Prioritization

  Given the potential for substantial security risks associated with disabling PUA protection on endpoints, the alert poses a high severity level. The likelihood of malicious abuse is significant, especially in environments where unwanted applications can bypass security measures, potentially leading to a breach if exploited.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate administrative actions or common software behaviors that may trigger the alert without malicious intent. Ensuring logging is enabled for registry modifications is crucial for reliable detection. This rule may also capture benign activities such as software updates or configuration changes by legitimate administrators. Companion detections to consider include monitoring for new software installations or attempted executions of newly installed applications that may relate to the PUA principle.

