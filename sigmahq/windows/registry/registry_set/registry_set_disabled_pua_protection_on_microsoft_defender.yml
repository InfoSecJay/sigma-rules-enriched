  ---

  ### Technical Context

  This Sigma rule detects alterations to the Windows registry that disable Potentially Unwanted Application (PUA) protection within Microsoft Defender. Attackers may disable PUA protection to facilitate the installation of unwanted or malicious software while evading detection by security products. This behavior aligns with the MITRE ATT&CK tactic "Defense Evasion" (ID: T1562.001), indicating an attempt to weaken endpoint security measures.

  The primary telemetry source is registry change logs, particularly those capturing modifications to the path `\Policies\Microsoft\Windows Defender\PUAProtection`, where a setting of `DWORD (0x00000000)` signifies disabled PUA protection. The security impact is significant; if exploited, this allows malware to install without being flagged by Microsoft Defender. This detection does NOT confirm malicious intent without further context such as identification of subsequent software installations or behavior.

  ---

  ### Investigation Steps

  - **Review registry change logs:** Check for Event ID 13 from the Windows Security log to identify registry modifications related to `\Policies\Microsoft\Windows Defender\PUAProtection`. Focus on changes where `Details` indicates a value of `0`.

  - **Correlate user activity:** Analyze logs from Event ID 4688 (Process Creation) to identify any suspicious processes initiated shortly after the PUA protection was disabled. Look for uncommon command-line arguments that may indicate malicious activities.

  - **Identify legitimate changes:** Determine if there have been recent applications or processes that necessitate disabling PUA protection by checking the log for standard, expected administrative activities with legitimate reasons for the modification.

  - **Analyze application install logs:** Review application logs (Event ID 11707 or logs from tools like MSI) following the registry change for any installations of software typically classified under PUA, such as adware or toolbars.

  - **Perform endpoint verification:** On critical assets, verify if any potentially unwanted applications are now present, using tools like PowerShell to list installed software and checking for known PUA signatures.

  ---

  ### Prioritization

  This alert warrants high severity due to its potential impact on endpoint security. The disabling of PUA protection significantly increases an organization’s risk to malware exploitation and indicates an attempt that is often weaponized in various attack scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection is limited by the necessity of reliable registry monitoring; if logging isn’t enabled for registry changes, this activity may remain undetected. Legitimate administrative actions, such as troubleshooting or software testing, may also trigger this alert. A related detection to consider is monitoring for application installations (Event ID 11705 and ID 11707) to establish context around unauthorized application changes.

