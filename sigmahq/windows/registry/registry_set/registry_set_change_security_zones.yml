note: |
  ### Technical Context

  This rule detects modifications to the Windows registry that indicate a change to Internet Explorer's security zones, specifically the unauthorized addition of domains to the Trusted Sites zone. The likely objective of an attacker is to manipulate browser security settings to enable phishing, malware delivery, or unauthorized access to web applications by lowering the security measures for specific domains. This behavior maps to the MITRE ATT&CK tactic of **Persistence** (TA0003) and technique **T1137: Office Application Startup Programs**.

  Primary telemetry sources include registry modification logs, specifically Event ID 4657 (Registry value modified) or Sysmon Event ID 13. If the changes originate from a malicious actor, it could allow for subsequent exploitation, such as bypassing security measures designed to protect users. It is essential to note that this detection alone does not confirm malicious intent; legitimate administrative actions or scripts could also trigger this alert.

  ### Investigation Steps

  - **Verify registry change:**
    Check for modifications to the registry key located at `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains\`. Look for any domains added that are not typically required in your organization's browser settings.

  - **Analyze Event ID 4657:**
    Examine Windows Security logs for Event ID 4657, focusing on the `ObjectType` and `ObjectName` fields. Determine if the `TargetObject` indicates the addition of trusted domains; if the domain is unknown or suspicious, it may indicate malicious intent.

  - **Check for authorized changes:**
    Cross-reference the registry changes against records of administrative activities. Determine if the changes align with known administrative tasks or scripts, which are less likely to introduce new domains without oversight.

  - **Identify correlated malicious indicators:**
    Review recent alerts or suspicious activities associated with user accounts that might have triggered this change. Look for patterns in logs, such as repeated attempts to access newly added domains or escalated privileges tied to specific users.

  - **Assess asset criticality:**
    If the registry modification occurs on critical assets or systems with sensitive data, prioritize this investigation, as exploitation could significantly impact the overall security posture.

  - **Log for filesystem artifacts:**
    Confirm the presence of any newly created files or changes to existing executable files in web directories. Investigate known malicious file behaviors or patterns that correspond with the domain added to the Trusted Sites zone.

  ### Prioritization

  This alert is medium severity due to the potential risk of exploitation through manipulated browser settings, which can lead to significant compromises, especially on sensitive systems. The likelihood of malicious abuse is moderate, as this technique is recognizable in various attack vectors, particularly in targeted attacks using social engineering mechanisms.

  ### Blind Spots and Assumptions

  Detection may be bypassed if malicious actors utilize legitimate administrative scripts or tools to make similar registry changes, leading to false negatives. Ensure logging is enabled for all registry modifications to capture evidence accurately; otherwise, this alert may miss critical activity. Legitimate operations, such as IT department audits or security testing, could generate similar logs. A companion detection relevant here could be monitoring for unusual URL access patterns post-change to understand the impact of the newly added domains.

