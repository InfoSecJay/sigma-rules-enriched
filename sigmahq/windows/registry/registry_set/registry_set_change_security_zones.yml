note: |
  ### Technical Context
  This detection rule identifies unauthorized changes to the Windows registry that modify the Internet Explorer (IE) security zones, specifically adding domains to the Trusted Sites zone. This behavior may indicate an attempt by an attacker to facilitate malicious activities such as phishing attacks or malware downloads by allowing untrusted websites to bypass security protections in the browser. By altering the registry settings, attackers can exploit users' trust in certain domains, potentially leading to data exfiltration or system compromise.

  The relevant MITRE ATT&CK tactics for this rule include **Persistence (T1546)**, as the changes can be leveraged to ensure continued access to a compromised system by enabling the use of trusted attack infrastructure. The associated technique **T1137: Change System Configurations** is specifically applicable since it involves modifying registry keys that dictate system behavior.

  The primary sources of data for this detection are Windows registry logs, particularly those capturing changes to the specified registry paths related to Internet Explorer security zones.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the specific registry paths for any recent modifications, particularly under `\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\Domains\`. Look for any unexpected entries that could indicate malicious activity.

  - **Correlate with User Activity:** Investigate user activity around the time of the detected registry change. Analyze login logs and application usage to determine if the change correlates with any suspicious user behavior or activity.

  - **Check for Related Artifacts:** Look for associated artifacts such as web access logs, especially focusing on connections made to the newly added domain in the Trusted Sites zone. Analyze whether any external communications or unauthorized access patterns are present.

  - **Evaluate Endpoint Security Alerts:** Review alerts from endpoint detection and response (EDR) solutions for any indications of malicious software or behaviors, such as unusual processes or scripts being executed from the affected systems shortly after the registry change.

  ### Prioritization
  This alert should be treated with medium severity in an enterprise environment due to the potential for significant impacts if trusted sites are weaponized by attackers. Given the ease with which legitimate administrative tasks can unintentionally trigger this rule, the context and additional verification steps are essential for determining the true nature of the alert.

  ### Blind Spots and Assumptions
  Potential detection gaps may arise if log collection is not comprehensive or if registry changes are made through methods that do not generate logs, such as direct API calls. The detection logic assumes that changes to the registry are only indicative of malicious behavior when made without an established legitimate context. Additionally, for this alert to function effectively, security logging for registry changes must be enabled, and appropriate monitoring practices must be in place to capture these modifications consistently across all endpoints.

