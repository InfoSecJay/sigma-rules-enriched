title: Registry Modification for OCI DLL Redirection
id: c0e0bdec-3e3d-47aa-9974-05539c999c89
status: experimental
description: |
  Detects registry modifications related to 'OracleOciLib' and 'OracleOciLibPath' under 'MSDTC' settings.
  Threat actors may modify these registry keys to redirect the loading of 'oci.dll' to a malicious DLL, facilitating phantom DLL hijacking via the MSDTC service.
references:
- https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
tags:
- attack.persistence
- attack.privilege-escalation
- attack.execution
- attack.stealth
- attack.defense-impairment
- attack.t1112
- attack.t1574.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_ocilib:
    TargetObject|endswith: '\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLib'
  filter_main_ocilib_file:
        # it is looking when oci.dll name is changed to something else like evil.dll
    Details|contains: 'oci.dll'
  selection_ocilibpath:
    TargetObject|endswith: '\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLibPath'
  filter_main_ocilibpath:
        # it is looking when oci.dll path is changed to something else like 'C:\Windows\Temp\'
    Details|contains: '%SystemRoot%\System32\'
  condition: (selection_ocilib and not filter_main_ocilib_file) or 
    (selection_ocilibpath and not filter_main_ocilibpath)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects registry modifications involving the 'OracleOciLib' and 'OracleOciLibPath' keys under the MSDTC settings, specifically changes intended to redirect the loading of 'oci.dll' to a potentially malicious DLL. The likely attacker objective is to execute malicious code under the guise of a legitimate process, thereby facilitating persistence and evasion from detection. This behavior is associated with the MITRE ATT&CK techniques: Persistence (T1547) and DLL Side-Loading (T1574.001).

  The primary telemetry sources are registry change events on Windows systems, specifically targeting registry paths related to MSDTC. If exploited, such modification could enable an attacker to execute arbitrary code with the permissions of the MSDTC service. Importantly, this detection alone does not confirm that a successful exploit has occurred; further investigation is necessary to ascertain the intent and impact of the change.

  ### Investigation Steps

  - **Check registry modification details:** Review the registry change events (Windows Event ID 4657) for the specific entries under `SOFTWARE\Microsoft\MSDTC\MTxOCI\` to identify the original and modified values of 'OracleOciLib' and 'OracleOciLibPath'.

  - **Validate file existence and path:** Confirm the presence of the file at the modified 'OracleOciLibPath'. A file located in a non-standard directory, such as `C:\Windows\Temp\evil.dll`, would indicate malicious activity.

  - **Correlate with process creation logs:** Look for any new process creation events through Security Event ID 4688 or Sysmon Event ID 1 that reference 'oci.dll' or any suspicious DLLs. High-risk activities (e.g., spawning processes under MSDTC) should be noted as potential indicators of a compromise.

  - **Assess legitimate activity patterns:** Determine if any legitimate applications or services are expected to modify these keys for valid reasons, such as updates or patches from Oracle. Verify with change management documents or application change logs.

  - **Review historical comparisons:** Examine logging history for any previous changes to these specific registry keys using "reg query" or similar commands in PowerShell. A sudden change can indicate nefarious activity.

  - **Analyze account activity:** Investigate the user/account that made the registry change, especially if it originates from a non-admin account or a user with abnormal activity patterns around the time of the registry modification.

  ### Prioritization

  This alert should be considered high-severity due to its potential impact on the system's security posture and the likelihood that it could be exploited for further malicious activity. DLL hijacking is a well-known technique that adversaries can employ, making it a critical focus for detection and remediation.

  ### Blind Spots and Assumptions

  This detection may have limitations such as evasion techniques using alternate registry keys or further obfuscation of loaded DLLs. Reliable detection is contingent upon monitoring the relevant registry change logs and ensuring that auditing is appropriately configured. Additionally, legitimate application updates or changes could trigger this alert. A related detection, such as monitoring for unusual process creation or DLL loading activity (e.g., using Sysmon), may enhance visibility into potential exploits.

