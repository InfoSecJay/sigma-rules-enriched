title: Registry Modification for OCI DLL Redirection
id: c0e0bdec-3e3d-47aa-9974-05539c999c89
status: experimental
description: |
  Detects registry modifications related to 'OracleOciLib' and 'OracleOciLibPath' under 'MSDTC' settings.
  Threat actors may modify these registry keys to redirect the loading of 'oci.dll' to a malicious DLL, facilitating phantom DLL hijacking via the MSDTC service.
references:
- https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1112
- attack.t1574.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_ocilib:
    TargetObject|endswith: '\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLib'
  filter_main_ocilib_file:
        # it is looking when oci.dll name is changed to something else like evil.dll
    Details|contains: 'oci.dll'
  selection_ocilibpath:
    TargetObject|endswith: '\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLibPath'
  filter_main_ocilibpath:
        # it is looking when oci.dll path is changed to something else like 'C:\Windows\Temp\'
    Details|contains: '%SystemRoot%\System32\'
  condition: (selection_ocilib and not filter_main_ocilib_file) or 
    (selection_ocilibpath and not filter_main_ocilibpath)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects modifications to specific registry keys related to Oracle's OCI (Oracle Call Interface) DLL settings under the MSDTC (Microsoft Distributed Transaction Coordinator) service. Such modifications could signify an attempt by an attacker to redirect legitimate `oci.dll` calls to a malicious DLL, enabling DLL hijacking and allowing malicious code execution. Attackers may aim to leverage this technique for persistence or privilege escalation, targeting the execution of trusted applications.

  The relevant MITRE ATT&CK tactics and techniques include: Persistence (T1547), Privilege Escalation (T1068), and Defense Evasion (T1112). Primary telemetry sources for this detection are Windows registry change logs captured through security monitoring solutions. If successful, these attacks could lead to unauthorized access or control over affected systems.

  It's important to note that while this detection suggests suspicious registry changes, it does not confirm malicious intent without further investigation, as legitimate applications may also modify these registry keys.

  ### Investigation Steps

  - **Identify the specific registry changes**: Review Windows Registry logs for `SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLib` and `SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLibPath`. Check for unexpected values in these keys, especially any pointing to non-standard paths or DLL names.

  - **Confirm the details of the modification**: Look for Event ID 4657 in the Security log to examine Modified Registry Value Details for the keys mentioned earlier. Identify if the value contains benign entries (for example, legitimate system paths like `%SystemRoot%\System32\`) versus potentially malicious paths (e.g., pointing to `%TEMP%`).

  - **Review associated process activity**: Check Sysmon logs (Event ID 1) for any recent unusual process creation that may correlate with the time of the registry modification. Look for processes attempting to load `oci.dll` and verify their parent processes for legitimacy.

  - **Assess recent system changes**: Analyze Windows Event logs for administrative changes around the time of the registry modification, focusing on Event ID 4732 for group membership changes or Event ID 4616 for system time changes that could indicate potential timestamp manipulation.

  - **Establish a baseline for legitimate activity**: Identify and document normal registry modification behavior related to Oracle software installations or updates, noting how and when these legit modifications typically occur.

  - **Caution against false positives**: Be aware of legitimate software updates or configuration changes that might trigger this alert. Engage with application teams to validate if there were any recent legitimate changes to Oracle configurations.

  ### Prioritization

  This alert should be considered high-priority due to the potential for significant security impacts, including unauthorized access and control over critical enterprise applications. The likelihood of malicious abuse is high, as DLL hijacking is a commonly leveraged technique within exploit frameworks.

  ### Blind Spots and Assumptions

  Evasion techniques may include the modification of registry keys by legitimate applications or the use of system utilities that inadvertently trigger this alert. Reliable detection hinges upon adequate logging from the Windows Registry and appropriate monitoring configurations. Legitimate software updates or changes, particularly from Oracle DB installations and configurations, may also trigger this alert. A related detection to enhance coverage could involve monitoring for unauthorized DLL or EXE loading events, such as those tracked through Sysmon Event ID 7 (Image loaded).

