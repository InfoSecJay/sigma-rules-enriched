title: Registry Modification for OCI DLL Redirection
id: c0e0bdec-3e3d-47aa-9974-05539c999c89
status: experimental
description: |
  Detects registry modifications related to 'OracleOciLib' and 'OracleOciLibPath' under 'MSDTC' settings.
  Threat actors may modify these registry keys to redirect the loading of 'oci.dll' to a malicious DLL, facilitating phantom DLL hijacking via the MSDTC service.
references:
- https://www.crowdstrike.com/en-us/blog/4-ways-adversaries-hijack-dlls/
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
tags:
- attack.persistence
- attack.privilege-escalation
- attack.defense-evasion
- attack.t1112
- attack.t1574.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_ocilib:
    TargetObject|endswith: '\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLib'
  filter_main_ocilib_file:
        # it is looking when oci.dll name is changed to something else like evil.dll
    Details|contains: 'oci.dll'
  selection_ocilibpath:
    TargetObject|endswith: '\SOFTWARE\Microsoft\MSDTC\MTxOCI\OracleOciLibPath'
  filter_main_ocilibpath:
        # it is looking when oci.dll path is changed to something else like 'C:\Windows\Temp\'
    Details|contains: '%SystemRoot%\System32\'
  condition: (selection_ocilib and not filter_main_ocilib_file) or (selection_ocilibpath
    and not filter_main_ocilibpath)
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This detection rule identifies modifications in the Windows Registry related to the `OracleOciLib` and `OracleOciLibPath` keys under the MSDTC (Microsoft Distributed Transaction Coordinator) settings. Attackers may alter these registry entries to redirect legitimate calls to `oci.dll`, a core Oracle database interface library, to a malicious DLL. This technique could enable DLL hijacking, wherein adversaries execute unauthorized code while exploiting legitimate processes, aiming for persistence or privilege escalation.

  The likely attacker objectives include maintaining a foothold in the environment, evading detection by blending in with legitimate processes, and ultimately compromising sensitive data or gaining elevated privileges. Relevant MITRE ATT&CK techniques include:
  - **T1112**: Modify Registry
  - **T1574.001**: DLL Side-Loading

  The primary data sources for effective detection lie within Windows Registry logs, specifically tracking settings alterations in `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\MSDTC\MTxOCI`. This registry monitoring can provide critical evidence of potential malicious activity.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate recent modifications to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\MSDTC\MTxOCI` for entries related to `OracleOciLib` and `OracleOciLibPath`, looking for suspicious or unexpected values.
  - **Analyze Process Activities**: Inspect running processes for `oci.dll` being replaced or called from non-standard locations. Check if any loaded DLLs are suspiciously named or located within transient directories (e.g., `%TEMP%`).
  - **Cross-check with Known Good Values**: Compare the current registry settings against documented standard configurations for Oracle installations to identify anomalies in the expected library paths.
  - **Correlate with User Activity**: Examine the user accounts that performed the registry modifications. Look for anomalous behaviors or access patterns that deviate from normal operational activities.

  ### Prioritization
  The severity of this alert is high due to the significant risk that DLL hijacking poses in an enterprise environment, potentially facilitating unauthorized access, data breaches, and system compromise. The likelihood of such attacks occurring is elevated, considering that they leverage known vulnerabilities in commonly used software.

  ### Blind Spots and Assumptions
  This detection mechanism may not cover alterations made directly through direct binary manipulation or if malicious code bypasses standard registry monitoring approaches. The assumption is that effective monitoring capabilities for registry changes are enabled in the environment. It is also essential to ensure logging is sufficiently detailed to capture all relevant modifications, including both successful and failed access attempts to these keys.

