title: Potential Persistence Via Visual Studio Tools for Office
id: 9d15044a-7cfe-4d23-8085-6ebc11df7685
status: test
description: Detects persistence via Visual Studio Tools for Office (VSTO) 
  add-ins in Office applications.
references:
- https://twitter.com/_vivami/status/1347925307643355138
- https://vanmieghem.io/stealth-outlook-persistence/
author: Bhabesh Raj
date: 2021-01-10
modified: 2025-10-07
tags:
- attack.t1137.006
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Software\Microsoft\Office\Outlook\Addins\'
    - '\Software\Microsoft\Office\Word\Addins\'
    - '\Software\Microsoft\Office\Excel\Addins\'
    - '\Software\Microsoft\Office\Powerpoint\Addins\'
    - '\Software\Microsoft\VSTO\Security\Inclusion\'
  filter_main_system:
    Image:
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    - 'C:\Windows\SysWOW64\regsvr32.exe'         # e.g. default Evernote installation
  filter_main_office_click_to_run:
    Image|startswith:
    - 'C:\Program Files\Common Files (x86)\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_integrator:
    Image:
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
  filter_main_office_apps:
    Image|startswith:
    - 'C:\Program Files\Microsoft Office\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\OFFICE'
    - 'C:\Program Files\Microsoft Office\Root\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\Root\OFFICE'
    Image|endswith:
    - '\excel.exe'
    - '\Integrator.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\Teams.exe'
    - '\visio.exe'
    - '\winword.exe'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files (x86)\AVG\Antivirus\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Antivirus.AsOutExt\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files (x86)\Avast Software\Avast\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Avast.AsOutExt\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate Addin Installation
level: medium
note: |
  ### Technical Context

  This rule detects the creation of registry keys related to Visual Studio Tools for Office (VSTO) add-ins in Microsoft Office applications, such as Outlook, Word, Excel, and PowerPoint. Attackers may leverage VSTO add-ins for persistence, allowing them to maintain control over a compromised system without detection. The relevant MITRE ATT&CK tactic is Persistence (TA0003), with the technique being VSTO Add-in (T1137.006). The primary telemetry source is Windows Registry activity, specifically changes to keys under `HKEY_CURRENT_USER\Software\Microsoft\Office\<App>\Addins\`. If the detection indicates malicious behavior, there could be serious security implications, including ongoing unauthorized access or data exfiltration. However, this detection alone does not confirm malicious intent as it can also be triggered by legitimate VSTO add-in installations.

  ### Investigation Steps

  - **Identify the registry keys created or modified:** Check the Windows Registry for changes under `HKEY_CURRENT_USER\Software\Microsoft\Office\Outlook\Addins\` (Event IDs 4657, 4663) and evaluate the entry names for known malicious or suspicious add-ins.

  - **Check the execution context:** Determine the process that initiated the registry change. Look for registry modification events tied to `msiexec.exe` or `regsvr32.exe` (Event ID 4688) and verify if it aligns with expected behaviors, such as legitimate software installations.

  - **Review installed add-ins:** Open the Office application and navigate to the Add-ins management section to confirm whether the detected add-ins correspond to known and legitimate functionality expected within your organization.

  - **Validate against known AV exceptions:** Investigate any filtering entries such as those for AVG or Avast in the logs, ensuring these correspond to legitimate antivirus installations. This can help rule out benign behavior from recognized software.

  - **Search for execution artifacts:** Check for any associated files created in `%temp%`, specifically looking for VSTO-related files or usage from the integration runtime, which may not typically reside in the user's profile.

  ### Prioritization

  This alert should be treated with medium severity. The impact can be significant, especially if the affected system holds sensitive data or functions in a high-privilege context. While persistence via VSTO adds a layer of stealth to adversaries' objectives, it is also a method that can be used in legitimate scenarios, thus warranting careful analysis before escalating.

  ### Blind Spots and Assumptions

  Detection may be limited in environments where legitimate uses of VSTO add-ins are prevalent, potentially leading to false positives. The requirement for logging registry changes must be enabled to ensure coverage. Additionally, legitimate software installs or updates may trigger these alerts, making it crucial to review context and user actions. Related detections, such as execution of `msiexec.exe` or `regsvr32.exe` without known legitimate context (potentially indicating other persistence techniques), should be monitored for comprehensive understanding.

