title: Potential Persistence Via Visual Studio Tools for Office
id: 9d15044a-7cfe-4d23-8085-6ebc11df7685
status: test
description: Detects persistence via Visual Studio Tools for Office (VSTO) 
  add-ins in Office applications.
references:
- https://twitter.com/_vivami/status/1347925307643355138
- https://vanmieghem.io/stealth-outlook-persistence/
author: Bhabesh Raj
date: 2021-01-10
modified: 2026-01-09
tags:
- attack.t1137.006
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Software\Microsoft\Office\Outlook\Addins\'
    - '\Software\Microsoft\Office\Word\Addins\'
    - '\Software\Microsoft\Office\Excel\Addins\'
    - '\Software\Microsoft\Office\Powerpoint\Addins\'
    - '\Software\Microsoft\VSTO\Security\Inclusion\'
  filter_main_system:
    Image:
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    - 'C:\Windows\SysWOW64\regsvr32.exe'         # e.g. default Evernote installation
  filter_main_office_click_to_run:
    Image|startswith:
    - 'C:\Program Files\Common Files (x86)\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_integrator:
    Image:
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
  filter_main_office_apps:
    Image|startswith:
    - 'C:\Program Files\Microsoft Office\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\OFFICE'
    - 'C:\Program Files\Microsoft Office\Root\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\Root\OFFICE'
    - 'C:\PROGRA~2\MICROS~2\Office'
    Image|endswith:
    - '\excel.exe'
    - '\Integrator.exe'
    - '\OneNote.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\Teams.exe'
    - '\visio.exe'
    - '\winword.exe'
  filter_main_vsto:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\VSTO\'
    - 'C:\Program Files (x86)\Microsoft Shared\VSTO\'
    Image|endswith: '\VSTOInstaller.exe'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files (x86)\AVG\Antivirus\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Antivirus.AsOutExt\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files (x86)\Avast Software\Avast\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Avast.AsOutExt\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate Addin Installation
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized persistence mechanisms via Visual Studio Tools for Office (VSTO) add-ins in Microsoft Office applications. Attackers may install malicious add-ins to maintain access to a user's system or to facilitate further exploitation, often with the objective of data exfiltration or lateral movement within the network. This behavior is categorized under MITRE ATT&CK Tactic: Persistence (ID: TA0003) and Technique: VSTO Add-ins (ID: T1137.006).

  The primary telemetry sources for this detection are Windows Registry changes, specifically targeting paths associated with Office add-ins. The security impact of this behavior can be significant, as it allows attackers to maintain persistence and potentially execute code whenever the affected Office application is launched. However, this detection rule should not be interpreted as confirmation of a breach; it only indicates that suspicious registry modifications have occurred.

  ### Investigation Steps

  - **Examine Registry Modifications:** Query the Windows Registry for changes to keys under `HKEY_CURRENT_USER\Software\Microsoft\Office\` related to add-ins, specifically any entries created or modified along paths that include "Addins". Focus on Event ID 4657 for registry modifications.

  - **Validate Known Good Add-ins:** Compare detected additions in the registry against a trusted baseline of known add-ins. Legitimate add-in installations will typically involve entries that are well-documented and commonly used, while unknown or untracked entries should be flagged as suspicious.

  - **Monitor Executable Behavior:** Review the running processes associated with suspicious registry keys. Look for any abnormal execution of `msiexec.exe`, `regsvr32.exe`, or `VSTOInstaller.exe`, notably through Sysmon Event ID 1 or Windows Event ID 4688, which may indicate the installation of unwanted software.

  - **Correlate with User Activity:** Investigate user activity logs (Windows Event ID 4624) to determine if unusual logins occurred around the time of the registry change, indicating potential unauthorized access to accounts and further validate if the action is benign or malicious.

  - **Identify High-Confidence Indicators:** Look for abnormal command line arguments associated with any of the flagged processes (like `regsvr32.exe`) from Sysmon Event ID 4688. For instance, using unexpected or obfuscated DLLs within the command line may signal malicious intent.

  - **Check for Related Persistence Mechanisms:** Investigate other common persistence techniques that could be leveraged alongside VSTO add-ins, such as changes made in `C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\`, which could show additional malicious persistence.

  ### Prioritization

  This alert carries a medium severity due to the potential for significant impact if malicious; an attacker could use VSTO add-ins not only for persistent access but also to execute code when Office applications are used. The likelihood of abuse is heightened given that these techniques are commonly weaponized in targeted attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility that benign VSTO add-in installations may trigger this alert, leading to false positives. It is also assumed that logging for registry modifications is enabled and configured correctly on endpoints for reliable detection. Legitimate activities, such as deploying new trusted VSTO add-ins by IT, may trigger the alert. A related detection to consider is monitoring for script execution via `powershell.exe` through the MITRE technique (T1059.001), which can further enhance visibility into potential attack patterns.

