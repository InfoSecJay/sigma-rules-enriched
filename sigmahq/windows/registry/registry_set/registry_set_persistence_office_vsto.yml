title: Potential Persistence Via Visual Studio Tools for Office
id: 9d15044a-7cfe-4d23-8085-6ebc11df7685
status: test
description: Detects persistence via Visual Studio Tools for Office (VSTO) add-ins
  in Office applications.
references:
- https://twitter.com/_vivami/status/1347925307643355138
- https://vanmieghem.io/stealth-outlook-persistence/
author: Bhabesh Raj
date: 2021-01-10
modified: 2025-10-07
tags:
- attack.t1137.006
- attack.persistence
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Software\Microsoft\Office\Outlook\Addins\'
    - '\Software\Microsoft\Office\Word\Addins\'
    - '\Software\Microsoft\Office\Excel\Addins\'
    - '\Software\Microsoft\Office\Powerpoint\Addins\'
    - '\Software\Microsoft\VSTO\Security\Inclusion\'
  filter_main_system:
    Image:
    - 'C:\Windows\System32\msiexec.exe'
    - 'C:\Windows\SysWOW64\msiexec.exe'
    - 'C:\Windows\System32\regsvr32.exe'
    - 'C:\Windows\SysWOW64\regsvr32.exe'         # e.g. default Evernote installation
  filter_main_office_click_to_run:
    Image|startswith:
    - 'C:\Program Files\Common Files (x86)\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_main_integrator:
    Image:
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
  filter_main_office_apps:
    Image|startswith:
    - 'C:\Program Files\Microsoft Office\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\OFFICE'
    - 'C:\Program Files\Microsoft Office\Root\OFFICE'
    - 'C:\Program Files (x86)\Microsoft Office\Root\OFFICE'
    Image|endswith:
    - '\excel.exe'
    - '\Integrator.exe'
    - '\outlook.exe'
    - '\powerpnt.exe'
    - '\Teams.exe'
    - '\visio.exe'
    - '\winword.exe'
  filter_optional_avg:
    Image:
    - 'C:\Program Files\AVG\Antivirus\RegSvr.exe'
    - 'C:\Program Files (x86)\AVG\Antivirus\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Antivirus.AsOutExt\'
  filter_optional_avast:
    Image:
    - 'C:\Program Files\Avast Software\Avast\RegSvr.exe'
    - 'C:\Program Files (x86)\Avast Software\Avast\RegSvr.exe'
    TargetObject|contains: '\Microsoft\Office\Outlook\Addins\Avast.AsOutExt\'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Legitimate Addin Installation
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify potential persistence mechanisms leveraged by attackers through Visual Studio Tools for Office (VSTO) add-ins in Microsoft Office applications. These add-ins can be exploited to maintain persistency on systems, allowing attackers to execute malicious code while the user interacts with seemingly legitimate Office applications like Outlook, Word, and Excel. Adversaries may use this technique to facilitate ongoing access or control, especially after an initial compromise.

  The relevant MITRE ATT&CK tactics/techniques for this scenario include **Persistence (T1137.006)**, where attackers may create or modify add-ins to re-run their code whenever the user opens the associated Office application, thus evading standard security measures. The primary data sources for this detection are system registry logs, specifically those associated with add-in installations for Microsoft Office applications, which may indicate unauthorized changes made by malicious actors.

  ### Investigation Steps
  - **Review Registry Logs**: Analyze registry logs for entries related to `\Software\Microsoft\Office\*Addins\` to identify any suspicious or unauthorized VSTO add-ins installed on the system.
  - **Examine Process Creation Events**: Look into process creation logs to detect if processes related to `msiexec.exe`, `regsvr32.exe`, or Office executables are triggered around the same time as the registry modifications.
  - **Assess Recent Installations**: Validate the legitimacy of newly installed add-ins and correlate the installation dates with any recent incidents or user activities that may appear unusual.
  - **Check for Known Indicators**: Cross-reference detected VSTO add-ins against threat intelligence sources or known malicious add-ins that have been documented in external references.

  ### Prioritization
  The severity of this alert is medium due to the potential impact that unauthorized persistence mechanisms can have on the environment, especially if exploited by advanced persistent threats (APTs). Attackers leveraging VSTO add-ins can maintain stealthy footholds within networks, making early detection vital.

  ### Blind Spots and Assumptions
  This detection may miss instances where add-ins are installed through legitimate channels like authorized software updates or user-initiated installations. The logic assumes that registry modifications are indicative of malicious activity, which may not always be the case due to legitimate IT practices or user behavior. The necessary logs should include detailed access to registry changes for Microsoft Office applications to ensure comprehensive coverage and accurate detection.

