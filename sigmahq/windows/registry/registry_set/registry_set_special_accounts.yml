note: |
  ### Technical Context

  This rule detects modifications made to the registry key at `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist`, specifically when the value is set to "0". This behavior is typically associated with attempting to hide user accounts from appearing on the logon screen, which may allow an attacker to evade detection of their presence on a system. The likely attacker objective is to maintain access to a compromised account without being easily noticed by operational staff.

  The relevant MITRE ATT&CK tactic for this behavior is "Defense Evasion," specifically technique T1564.002 ("Hide User Account"). The primary telemetry source for this detection is Windows Registry logs that capture modifications (`registry_set` event data). If this detection is confirmed as malicious, it indicates potential compromise or at least a strong indication of an attempt to conceal unauthorized access. However, this detection does NOT confirm the presence of other malicious actions or guarantee that an attack has occurred.

  ### Investigation Steps

  - **Identify the Registry Change:** Review Windows Registry logs for modifications to `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist`. Specifically, look for entries with a value set to "0" (`Event Type: registry_set`).

  - **Correlate with Account Behavior:** Check user account activity logs (`Security Event ID 4624` for successful logons). Look for unusual logon times or patterns for any accounts likely hidden from the logon screen.

  - **Verify Expected Configuration:** Assess the normal configuration for local user accounts. Typically, administrative or service accounts may not be hidden. Ensure that no legitimate service or application accounts use similar registry modifications for valid reasons.

  - **Examine Additional Context:** Investigate surrounding events that correlate with the registry change, such as user actions or scheduled tasks that originate from the same host (`Event ID 4688` for process creation). Look for unexpected command line arguments that might indicate malicious activity.

  - **Validate Host Integrity:** Conduct a full security assessment of the host that made the registry change. Check for persistence mechanisms or malicious executables running (`Sysmon Event ID 1` for process creation) that could indicate ongoing malicious exploitation.

  ### Prioritization

  The alert is high-severity due to the potential for significant impact on the security of the affected system, particularly if the hidden user account has administrative privileges. The likelihood of malicious exploitation is elevated, given that this technique is often used by adversaries to obfuscate their presence. Such behavior is not uncommon in targeted attacks and can indicate an active compromise.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers utilizing legitimate administrative processes to modify registry entries or who configure system settings that mask their activity. Consistent monitoring of registry changes and ensuring comprehensive logging configurations are critical for reliable detection. Legitimate activities, such as managing service accounts or system updates, may also trigger this alert. A companion detection to reinforce coverage includes monitoring for changes to other sensitive registry keys that may relate to hidden user configurations.

