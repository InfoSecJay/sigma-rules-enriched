note: |
  ### Technical Context
  This detection rule identifies modifications to the Windows registry key "HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist", specifically when the value is set to "0". This manipulation hides user accounts from being displayed on the logon screen, which can be a tactic employed by attackers to obscure unauthorized access or presence on a system. By hiding user accounts, an attacker aims to evade detection while maintaining access to sensitive resources within the environment.

  The relevant MITRE ATT&CK tactic associated with this activity is **Defense Evasion** (TA0005), specifically technique **T1564.002**: Hide User Accounts. This technique allows attackers to manipulate system configurations to avoid detection by security monitoring tools, making it a critical behavior to detect and investigate.

  Primary data sources that will provide valuable evidence for this detection include **Windows registry logs**, which capture changes to the registry; **Windows event logs**, particularly those related to security and system events; and potentially **endpoint detection and response (EDR) logs**, which can help confirm suspicious modifications and the context in which they occurred.

  ### Investigation Steps
  - **Review Registry Logs**: Collect and analyze Windows registry set logs to identify when the "SpecialAccounts\UserList" registry key was modified and track the user or process responsible for this change.

  - **Examine Event Logs**: Analyze related Windows event logs, specifically focusing on events associated with the system and security logs (e.g., event ID 4663) to correlate activities leading up to the registry modification.

  - **Check for Unusual User Activity**: Investigate user accounts that could be associated with the modification. Look for unusual login attempts or account behavior, especially from service accounts or accounts with administrative privileges.

  - **Assess EDR Alerts**: If EDR tools are deployed, review alerts and telemetry data corresponding to the time of the registry modification for any related suspicious activities that could provide context to the change.

  ### Prioritization
  This alert is rated as high severity due to its implications for security. Hiding user accounts can signify an attempt by an attacker to maintain stealthy, unauthorized access to a system. The likelihood of this behavior occurring by malicious actors seeking to evade detection underscores its critical nature in an enterprise environment.

  ### Blind Spots and Assumptions
  The detection logic assumes that proper logging of registry changes is configured and enabled on the endpoints, which might not always be the case. Additionally, if an attacker is aware of this detection mechanism, they may avoid making changes to the registry in ways that trigger alerts, introducing a gap in detection coverage. Analysts should ensure that all necessary Windows logging configurations are active to capture the required telemetry for effective monitoring and investigation.

