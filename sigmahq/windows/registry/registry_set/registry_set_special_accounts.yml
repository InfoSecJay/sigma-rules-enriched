note: |
  ### Technical Context

  This detection identifies when a modification is made to the Windows registry, specifically to the key `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist`, where the value is set to `0`. This behavior typically indicates an attempt to hide a user account from the logon screen, a tactic often employed by attackers to obscure their presence or maintain access to a compromised system.

  The likely attacker objective is to evade detection by concealing their user account, which could be part of a larger compromise strategy aimed at maintaining persistence within the environment. This activity aligns with the MITRE ATT&CK framework tactic of Defense Evasion (TA0005), specifically technique T1564.002 (Hide User Account).

  Primary telemetry sources for this detection include Windows Registry event logs capturing modifications to registry keys. The security impact of a successful hide action is significant, as it enables stealthy access to the system. Importantly, this detection does NOT confirm malicious intent on its own; it only indicates that a registry modification has occurred that matches the criteria specified.

  ### Investigation Steps

  - **Review recent registry changes:** Check for Security Event ID 4657 or the Windows Registry logs for modifications to `HKLM\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\Userlist`. Analyze the user and timestamp to establish if it correlates with other suspicious activity.

  - **Identify the user making the changes:** Cross-reference the modification event with logs from Event ID 4624 (Logon) to determine what user account was used to make the registry change. Look for accounts with unusual access patterns or privileges.

  - **Confirm the value set is zero:** Verify the newly set value of the Userlist key. A value of `0` indicates the account is hidden. Check for additional contexts like nearby registry modifications or patterns that indicate malicious behavior (e.g., stealthy account configurations).

  - **Assess legitimate scenarios:** Be aware that some applications or administrative processes might also modify this key during configuration. Documentation or knowledge of applications that run within your environment can help distinguish benign changes from malicious intent.

  - **Collect additional logs:** If available, gather logs from Sysmon (Event ID 10) for process creations around the time of the registry change. Look for any unusual or unauthorized commands run, particularly those involving user account management.

  - **Evaluate previous alerts:** Review the alert history linked to related detections, like T1564.002 visibility checks, to understand if similar attempts have been documented previously. Note context on persistent indicators or patterns around this registry modification.

  ### Prioritization

  This alert is of high severity mainly because it indicates potential malicious behavior associated with user account management. Systems affected by this modification often hold significant value in an enterprise environment, making them attractive targets for persistence techniques. Furthermore, the act of hiding a user account is a recognized method employed by adversaries for stealth and evasion.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of logging on registry accesses if the auditing level is not properly configured, potentially allowing evasion through normal user activities. Legitimate activities that may trigger this alert could include system administrators adjusting user accounts for policy compliance. Monitoring for related detections, such as user account lockouts or failed login attempts, can enhance situational awareness and assist in identifying compromised accounts.

