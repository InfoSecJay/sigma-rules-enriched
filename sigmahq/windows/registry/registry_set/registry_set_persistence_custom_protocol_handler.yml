title: Potential Persistence Via Custom Protocol Handler
id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
status: test
description: Detects potential persistence activity via the registering of a new
  custom protocole handlers. While legitimate applications register protocole 
  handlers often times during installation. And attacker can abuse this by 
  setting a custom handler to be used as a persistence mechanism.
references:
- https://ladydebug.com/blog/2019/06/21/custom-protocol-handler-cph/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-30
modified: 2023-05-12
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|startswith: 'HKCR\'
    Details|startswith: 'URL:'
  filter_main_ms_trusted:
    Details|startswith: 'URL:ms-'     # Microsoft Protocols usually start with "ms-"
  filter_main_generic_locations:
    Image|startswith:     # Add more folders to avoid FP
    - 'C:\Program Files (x86)'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    # Uncomment This section to add specific Protocol Handler names that are know
    # filter_specific:
    #     Details: 'URL:'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Many legitimate applications can register a new custom protocol handler. 
  Additional filters needs to applied according to your environment.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the registration of new custom protocol handlers within the Windows Registry, particularly those starting with 'URL:' in the HKCR hive. The primary goal of this behavior from an adversary standpoint is to establish persistence mechanisms, allowing unwanted applications to execute whenever a specific URL scheme is invoked. This activity relates to the MITRE ATT&CK technique "Application Layer Protocol" (T1112), underscoring an established method for maintaining access. The primary telemetry source includes Windows Registry changes, specifically focusing on Event ID 4657 (Registry Value Changed) for log artifacts detailing created or modified protocol handlers. If malicious, this could enable the execution of arbitrary code whenever the custom protocol is accessed. Importantly, this detection alone does not confirm malicious intent, as legitimate software installations may also register custom protocol handlers.

  ### Investigation Steps

  - **Check Registry Change Details**: Review Event ID 4657 logs for changes in HKCR pertaining to protocol handlers. Look for changes with Details fields starting with 'URL:'. Confirm if the changes correlate with known application installations or legitimate user activity.

  - **Verify Application Legitimacy**: Investigate the process or source that made the registry change. Use Sysmon Event ID 10 (Process Access) to trace back the initiating process. Look for processes originating from trusted paths like 'C:\Program Files\' or 'C:\Windows\System32\' for benign activity.

  - **Identify Suspicious Protocol Naming**: Focus on protocol handlers that do not match commonly known applications or those outside of general usage. Any handler registered with unique or uncommon naming may indicate malicious intent.

  - **Monitor for Executions**: Validate whether any processes or scripts are triggered by the newly registered protocol handlers. This can be confirmed through Process Creation logs (Event ID 4688) to see if unexpected actions occur when the protocol is invoked.

  - **Assess for Repeated Patterns**: Determine if multiple unauthorized protocol handlers have been registered in a short timeframe, which may indicate a high-confidence malicious indicator of an ongoing attack or exploitation attempt.

  ### Prioritization

  This alert should be treated with medium priority due to the potential for malicious persistence mechanisms on critical systems. Given the nature of custom protocol handlers, the likelihood of exploitation is moderate, particularly in environments where users frequently engage with various applications that may register such protocols.

  ### Blind Spots and Assumptions

  Detection is limited by the variety of legitimate applications that can register similar handlers, potentially leading to false positives. Reliable detection requires complete logging of the Windows Registry modifications, specifically enabling auditing for Registry changes. Additionally, common activities such as application installations or software updates might trigger similar alerts. Companion detections for unauthorized software installation events (e.g., MSI execution events) can further enhance coverage against this behavior.

