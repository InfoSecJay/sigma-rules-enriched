title: Potential Persistence Via Custom Protocol Handler
id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
status: test
description: Detects potential persistence activity via the registering of a new custom
  protocole handlers. While legitimate applications register protocole handlers often
  times during installation. And attacker can abuse this by setting a custom handler
  to be used as a persistence mechanism.
references:
- https://ladydebug.com/blog/2019/06/21/custom-protocol-handler-cph/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-30
modified: 2023-05-12
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|startswith: 'HKCR\'
    Details|startswith: 'URL:'
  filter_main_ms_trusted:
    Details|startswith: 'URL:ms-'     # Microsoft Protocols usually start with "ms-"
  filter_main_generic_locations:
    Image|startswith:     # Add more folders to avoid FP
    - 'C:\Program Files (x86)'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    # Uncomment This section to add specific Protocol Handler names that are know
    # filter_specific:
    #     Details: 'URL:'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Many legitimate applications can register a new custom protocol handler. Additional
  filters needs to applied according to your environment.
level: medium
note: |
  ### Technical Context
  This rule detects potential persistence mechanisms used by attackers through the registration of new custom protocol handlers in the Windows registry. Attackers can leverage this technique to modify or create protocol handlers in a way that allows them to execute malicious payloads or maintain access to compromised environments even after sessions are terminated. While legitimate software often registers such handlers (commonly prefixed with standard identifiers), malicious actors can do so in a deceptive manner to ensure continued access.

  The primary MITRE ATT&CK tactics involved here are **Persistence** (TA0003) and **Defense Evasion** (TA0005), particularly the technique **Registry Run Keys / Startup Folder** (T1112). By registering a custom protocol handler, attackers create an avenue for launching malicious code with elevated privileges, thereby circumventing typical security measures designed to prevent unauthorized software execution.

  Key data sources for this detection include **Windows Registry logs**, particularly under the `HKCR` (HKEY_CLASSES_ROOT) hive. Monitoring for changes in this area can provide insights into unauthorized registrations that warrant further investigation.

  ### Investigation Steps
  - **Review Windows Registry Changes:** Examine the registry keys impacted by the alert, particularly under `HKCR`, to verify any newly registered protocol handlers. Look for anomalous entries not associated with known trusted applications.

  - **Analyze Process Creation Logs:** Check process creation events that correspond to the timing of the registry changes detected. Investigate any suspicious executables that might have triggered the new protocol handler.

  - **Correlate with Software Installation Logs:** Validate whether the custom protocol handler was registered in conjunction with legitimate software installations. Look for discrepancies or installations involving unrecognized or unexpected software.

  - **Assess Network and Command-Line Activity:** Investigate any outbound network connections or command-line executions initiated by the newly registered handlers. Look for commands or URLs associated with known malicious actors or patterns.

  ### Prioritization
  The alert is of medium severity due to the potential for an attacker to establish a persistent foothold within the environment through seemingly benign registry modifications. While not all changes indicate malicious activity, the context of new custom protocol handlers is a critical area for vigilance.

  ### Blind Spots and Assumptions
  This detection rule may miss custom protocol registrations that utilize less common prefixes that are not filtered out by the current logic. Additionally, the rule assumes that all legitimate application registrations are accurately accounted for, which may not hold true across diverse enterprise environments. For effective execution, robust logging of registry changes must be enabled and properly configured to ensure comprehensive visibility into modifications.

