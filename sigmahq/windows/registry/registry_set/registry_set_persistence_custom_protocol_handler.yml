title: Potential Persistence Via Custom Protocol Handler
id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
status: test
description: Detects potential persistence activity via the registering of a new
  custom protocole handlers. While legitimate applications register protocole 
  handlers often times during installation. And attacker can abuse this by 
  setting a custom handler to be used as a persistence mechanism.
references:
- https://ladydebug.com/blog/2019/06/21/custom-protocol-handler-cph/
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-05-30
modified: 2023-05-12
tags:
- attack.persistence
- attack.defense-evasion
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|startswith: 'HKCR\'
    Details|startswith: 'URL:'
  filter_main_ms_trusted:
    Details|startswith: 'URL:ms-'     # Microsoft Protocols usually start with "ms-"
  filter_main_generic_locations:
    Image|startswith:     # Add more folders to avoid FP
    - 'C:\Program Files (x86)'
    - 'C:\Program Files\'
    - 'C:\Windows\System32\'
    - 'C:\Windows\SysWOW64\'
    # Uncomment This section to add specific Protocol Handler names that are know
    # filter_specific:
    #     Details: 'URL:'
  condition: selection and not 1 of filter_main_*
falsepositives:
- Many legitimate applications can register a new custom protocol handler. 
  Additional filters needs to applied according to your environment.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the registration of new custom protocol handlers in the Windows registry, particularly under the `HKCR\` key. Attackers may exploit this mechanism to establish persistence—by creating a protocol that triggers malicious payloads when invoked. The relevant MITRE ATT&CK tactic is Persistence (TA0003) and the technique is Custom Protocol Handler (T1112).

  The primary telemetry source for this detection is the Windows registry, particularly changes in the `HKCR\` (HKEY_CLASSES_ROOT) section. The security impact could be significant if a malicious custom protocol is registered, potentially allowing an attacker to execute code whenever the protocol is called. This detection does NOT confirm that a registered protocol handler is definitively malicious, as legitimate applications also register custom handlers.

  ### Investigation Steps

  - **Review registry changes:** Examine registry modifications using Event ID 4663 (Registry Object Access). Look for any new keys under `HKCR\` that start with "URL:". Note that legitimate applications often do this during installation.

  - **Identify suspicious details:** Check the `Details` field of the log entries for any newly registered protocols not associated with known, trusted applications. Protocols starting with `URL:ms-` are typical for Microsoft applications and may be benign.

  - **Correlate with other telemetry:** Investigate running processes or scheduled tasks (Event ID 4697 or Sysmon Event ID 1) initiated by newly created handlers. If a custom protocol is linked to unusual or high-risk processes, it's a strong indicator of malicious behavior.

  - **Assess asset criticality:** Determine if the affected system is critical to business operations or contains sensitive data. If so, prioritize the investigation and potential remediation more urgently.

  - **Document legitimate applications:** Maintain a whitelist of known applications in your environment that commonly register custom protocol handlers to help filter out false positives.

  ### Prioritization

  This alert should be treated with medium severity. The risk increases if the affected system is critical, as custom protocol handlers can enable persistent access. Although the registration of custom protocols can happen legitimately, the potential for abuse in a targeted attack makes this a noteworthy behavior.

  ### Blind Spots and Assumptions

  Detection may miss legitimate custom protocol registrations from trusted applications, leading to false positives. Additional log sources, such as detailed application installation logs, should be reviewed to confirm context. Related detections include monitoring for unusual HTTP or HTTPS traffic that may trigger the custom protocol, providing a stronger understanding of potentially malicious activity.

