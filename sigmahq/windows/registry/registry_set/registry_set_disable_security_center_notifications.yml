  ### Technical Context

  This Sigma rule detects the modification of Windows registry settings to disable the Windows Security Center notifications by setting `UseActionCenterExperience` to `0`. The likely attacker objective is to obscure malicious activity by suppressing alerts about system security, such as antivirus status or firewall settings. This behavior aligns with the MITRE ATT&CK tactics of Persistence (TA0003) and Defense Evasion (TA0005), specifically the technique T1112, which involves modifying registry values to disable security features.

  The primary telemetry source for this detection is Windows Registry log entries, specifically looking for changes in the registry involving `Windows\CurrentVersion\ImmersiveShell`. If malicious, disabling these notifications can lead to a lack of visibility into potential compromises or attacks on the system. However, this detection does NOT confirm that malicious activity has occurred on its own, as legitimate administrative actions may also modify this setting.

  ---

  ### Investigation Steps

  - **Check for registry change history:** Review Registry Event logs (Security Event ID 4657) for recent changes related to `Windows\CurrentVersion\ImmersiveShell` from the affected host. Look specifically for any changes made by unauthorized users or at unusual times.

  - **Identify suspicious user activity:** Query Sysmon logs (Event ID 1) to track process creation events, paying particular attention to any processes originating from unusual locations or executed with atypical command-line arguments around the time of the registry change.

  - **Determine legitimate configurations:** Validate expected behavior by checking the `UseActionCenterExperience` setting across other endpoints in the environment. Legitimate configurations should have this value set to `1`.

  - **Look for related malicious indicators:** Investigate if there are any logs indicating the use of persistence mechanisms, such as malicious scripts or scheduled tasks that might use this registry modification as part of their operation. Focus on Event IDs for tasks created or modified (Security Event ID 4698/4699).

  - **Examine system alerts:** Check Windows Event logs (Application and Services Logs > Microsoft > Windows > Security Health) for any other significant alerts that may correlate with the disabling of notifications, such as antivirus alerts or strange security health events.

  ---

  ### Prioritization

  The alert severity is medium due to the potential impact on endpoint security management and monitoring. While disabling security center notifications is not an immediately destructive action, it significantly increases the risk of undetected compromises, making this behavior a common tactic among adversaries seeking to evade defenses.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed registry change auditing on hosts, allowing evasion through legitimate administrative updates. This alert could also be triggered by common administrative tasks that involve modifying user notification settings or system tweaks. To strengthen detection, monitor for companion events, such as those related to process creation or network activity that can denote hostile intent.

