  ### Technical Context

  This Sigma rule detects attempts to disable Windows Security Center notifications by setting the registry key `UseActionCenterExperience` to 0. This behavior indicates that an adversary is likely trying to conceal malicious activities by suppressing security alerts, which could be part of a larger objective to maintain persistence on the system without detection. The relevant MITRE ATT&CK tactics and techniques are **Persistence (T1135)** and **Defense Evasion (T1211)**.

  The primary telemetry source for this detection is Windows Registry modification logs, specifically targeting registry access events that detail changes to the key related to Windows Security Center. If malicious, this action can lead to reduced visibility of security events, allowing further malicious actions without alerting defenders. It is crucial to note that this detection does NOT confirm active compromise by itself; legitimate administrative actions might also alter registry settings.

  ### Investigation Steps

  - **Check Registry Modification:** Verify the registry change using Registry Event IDs (e.g., Event ID 4657). Look for modifications to `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\ImmersiveShell\UseActionCenterExperience` with a value of 0. Legitimate users typically leave this value at 1.

  - **Correlate with User Actions:** Review the Security Event Logs (Event ID 4624) for login events around the same timestamp to determine if there was an authorized user activity that coincided with the registry modification. Unexpected logins or remote access may indicate a malicious actor.

  - **Look for Related Processes:** Investigate recent process creation events (Security Event ID 4688) that occurred in proximity to the registry change. Malicious modifications are often accompanied by unusual executable actions, such as PowerShell scripts or other administrative tools.

  - **Check Registry Access Logs:** Examine Windows Management Event Logs for any suspicious administrative commands (Event ID 40961) that could signify an attacker manipulating system configurations as part of their operations.

  - **Identify Anomalies in Security Policies:** Look at Group Policy Object (GPO) settings applied to the host to ensure there has been no unauthorized policy to disable notifications or security measures, which might indicate broader systemic issues.

  ### Prioritization

  This alert should be deemed medium severity due to the potential for a broad security impact, particularly if the affected system is critical. The likelihood of malicious abuse is reasonably high, given that disabling security notifications aligns with known adversarial behavior. While it is not the most commonly weaponized tactic, its usage does frequently indicate preparatory steps for further exploitation.

  ### Blind Spots and Assumptions

  Detection may be limited if registry access logging is not enabled, resulting in missed visibility into legitimate administrative actions that could trigger this alert. Adversaries may employ methods to further evade detection, such as modifying legitimate user settings or using scripts to automate registry changes. Additionally, legitimate administrative activities, such as user training or configuration changes for testing purposes, could trigger this alert. A related detection to strengthen coverage would be monitoring for changes in Windows Defender settings, which aligns with general adversarial objectives to circumvent security measures.

