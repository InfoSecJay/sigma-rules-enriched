note: |
  ### Technical Context

  This Sigma rule detects when the Windows registry setting `UseActionCenterExperience` is modified to `0`, which effectively disables notifications from the Windows Security Center. The likely objective of an attacker is to reduce the visibility of security alerts, facilitating persistence and the execution of malicious activities without alerts being generated. This behavior aligns with the MITRE ATT&CK technique for Defense Evasion (T1112 - Modify Registry).

  The primary telemetry sources for this detection include the Windows registry change logs, specifically looking for modifications under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\ImmersiveShell`. If successful, this action could allow malware to operate without detection, potentially leading to data compromise. However, it is important to clarify that this detection does NOT confirm malicious intent on its own; benign applications or user actions may also make this registry change.

  ### Investigation Steps

  - **Check registry setting modification time:** Review Windows Event Log (Event ID 4657 - Registry value modified) around the time of alert to confirm if and when the `UseActionCenterExperience` was changed. Match this against the user's activity logs to assess legitimacy.

  - **Identify executing processes:** Look at the parent process of the registry change. Use Sysmon Event ID 1 to determine if a known malicious process initiated the registry modification, indicating potential exploitation.

  - **Review account activity:** Validate the user account that made the registry change using Event ID 4624 (Logon). Confirm if the user had sufficient permissions and if their login patterns align with normal behavior.

  - **Correlate with other alerts:** Cross-reference any other security alerts generated around the same timeframe, such as Event ID 4688 (Process Creation), to uncover suspicious behaviors that may hint at a broader compromise.

  - **Investigate legitimate software behavior:** Identify if any legitimate software the organization uses commonly disables the Action Center for usability or operational reasons, potentially triggering this alert without malicious intent.

  ### Prioritization

  This alert should be classified as medium severity. While the modification of this registry key is indicative of potential defense evasion tactics, the severity is context-dependent, based on the importance of the affected system and the likelihood of exploitation in the environment.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of certain registry monitoring configurations if not applied across all endpoints. Evasion techniques include the potential for legitimate administrative actions to trigger this alert or the use of malicious scripts that also modify registry settings unobtrusively. As a companion detection, monitoring for common post-exploitation behaviors, such as network connections made by unusual processes, could strengthen overall detection capabilities for this activity.

