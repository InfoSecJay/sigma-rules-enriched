modified: 2025-10-22
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection_nt_current_version_base:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
  selection_nt_current_version:
    TargetObject|contains:
    - '\Winlogon\VmApplet'
    - '\Winlogon\Userinit'
    - '\Winlogon\Taskman'
    - '\Winlogon\Shell'
    - '\Winlogon\GpExtensions'
    - '\Winlogon\AppSetup'
    - '\Winlogon\AlternateShells\AvailableShells'
    - '\Windows\IconServiceLib'
    - '\Windows\Appinit_Dlls'
    - '\Image File Execution Options'         # Covered in better details in 36803969-5421-41ec-b92f-8500f79c23b0
    - '\Font Drivers'
    - '\Drivers32'
    - '\Windows\Run'
    - '\Windows\Load'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
  filter_main_legitimate_subkey:    # Legitimately used subkeys of \Image File Execution Options, which are not used for persistence (see https://pentestlab.blog/2020/01/13/persistence-image-file-execution-options-injection/)
    TargetObject|contains: '\Image File Execution Options\'
    TargetObject|endswith:
    - '\DisableExceptionChainValidation'
    - '\MitigationOptions'
  filter_main_security_extension_dc:
    Image: 'C:\Windows\system32\svchost.exe'
    TargetObject|contains:
    - '\Winlogon\GPExtensions\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}\PreviousPolicyAreas'
    - '\Winlogon\GPExtensions\{827D319E-6EAC-11D2-A4EA-00C04F79F83A}\MaxNoGPOListChangesInterval'
    Details:
    - 'DWORD (0x00000001)'
    - 'DWORD (0x00000009)'
    - 'DWORD (0x000003c0)'
  filter_main_runtimebroker:
    Image: 'C:\Windows\System32\RuntimeBroker.exe'
    TargetObject|contains: '\runtimebroker.exe\Microsoft.Windows.ShellExperienceHost'
  filter_optional_edge:
    Image|startswith: 'C:\Program Files (x86)\Microsoft\Temp\'
    Image|endswith: '\MicrosoftEdgeUpdate.exe'
  filter_optional_avguard:
    Image|startswith:
    - 'C:\Program Files (x86)\Avira\Antivirus\avguard.exe'
    - 'C:\Program Files\Avira\Antivirus\avguard.exe'
    TargetObject|contains: 'SOFTWARE\WOW6432Node\Avira\Antivirus\Overwrite_Keys\HKEY_LOCAL_MACHINE\Software\Microsoft\Windows
      NT\CurrentVersion\Winlogon\'
    TargetObject|endswith:
    - '\userinit\UseAsDefault'
    - '\shell\UseAsDefault'
    Details:
    - 'explorer.exe'
    - 'C:\Windows\system32\userinit.exe,'
  filter_optional_msoffice:
  - TargetObject|contains:
    - '\ClickToRunStore\HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\'
    - '\ClickToRun\REGISTRY\MACHINE\Software\Microsoft\Windows NT\CurrentVersion\'
  - Image:
    - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
  filter_optional_officeclicktorun:
    Image|startswith:
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\Updates\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_optional_ngen:
    Image|startswith: 'C:\Windows\Microsoft.NET\Framework'
    Image|endswith: '\ngen.exe'
  filter_optional_onedrive:
    Image|endswith: '\AppData\Local\Microsoft\OneDrive\StandaloneUpdater\OneDriveSetup.exe'
    TargetObject|endswith: '\Microsoft\Windows\CurrentVersion\RunOnce\Delete Cached
      Update Binary'
    Details|startswith: 'C:\Windows\system32\cmd.exe /q /c del /q "C:\Users\'
    Details|endswith: '\AppData\Local\Microsoft\OneDrive\Update\OneDriveSetup.exe"'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_currentversion_nt/info.yml
note: |
  ### Technical Context

  This Sigma rule detects modifications to autostart extensibility points (ASEPs) in the Windows registry, specifically targeting keys under `\SOFTWARE\Microsoft\Windows NT\CurrentVersion`. This behavior is commonly associated with persistence mechanisms utilized by attackers seeking to maintain access to a compromised system. The likely attacker objective is to execute malicious payloads each time the system boots or a user logs on.

  The relevant MITRE ATT&CK techniques are Persistence (T1547.001) and Privilege Escalation. Primary telemetry sources include Windows Registry logs, specifically tracking modifications to registry keys. If malicious, this could allow an adversary to execute arbitrary code at startup or during a user session. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate software and administrators may also modify these keys for valid reasons.

  ### Investigation Steps

  - **Review recent registry modifications:**
    Check for changes in registry keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion`. Refer to Windows Security Event ID 4657 for evidence of modifications. Look closely for unusual or unauthorized entries, particularly if they involve executables that aren’t recognized.

  - **Identify malicious executables:**
    Look for entries that point to atypical executables or scripts in keys like `Userinit` or `Taskman`. High-confidence indicators include any executables originating from untrusted or unexpected paths, such as `C:\Users\[username]\Downloads\malware.exe`.

  - **Correlate with process creation logs:**
    Use Security Event ID 4688 to review the command lines of processes that executed shortly after registry modifications occurred. Look for suspicious command line patterns or discrepancies between command line arguments and legitimate executables in the registry.

  - **Understand legitimate software behavior:**
    Check for known legitimate entries in the registry, such as `C:\Windows\system32\userinit.exe,` and confirm they point to expected paths and legitimate software. This can help establish a baseline of acceptable configurations for your environment.

  - **Inspect related telemetry:**
    Validate any associated application logs or telemetry from tools like Sysmon (Event ID 1) to identify any abnormal behavior consistent with registry modifications. Pay special attention to processes that may be manipulating these autorun keys to gain persistence.

  ### Prioritization

  This alert is of medium severity due to the potential for significant impact, especially if critical infrastructure is affected or if the changes allow persistent presence for malware. The likelihood of malicious abuse is moderate, as attackers often utilize this tactic to ensure their code runs on system startup. The techniques employed are common among a range of adversaries in active campaigns.

  ### Blind Spots and Assumptions

  Potential evasion techniques may include using legitimate software to modify registry keys or leveraging system tools that could mask malicious behavior. Detection relies on proper logging configurations for registry activity; without them, vital changes may go unnoticed. Legitimate software installations often modify these keys, which could trigger alerts unnecessarily. Additionally, monitoring related detections for unexpected process executions linked to known persistence techniques (e.g., Event ID 4688) would enhance detection capabilities and reduce false positives.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
