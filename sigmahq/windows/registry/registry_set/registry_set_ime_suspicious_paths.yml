logsource:
  product: windows
  category: registry_set
detection:
  selection_registry:
    TargetObject|contains|all:
    - '\Control\Keyboard Layouts\'
    - 'Ime File'
  selection_folders_1:
    Details|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\Temporary Internet'
  selection_folders_2:
  - Details|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - Details|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - Details|contains|all:
    - ':\Users\'
    - '\Contacts\'
  condition: selection_registry and 1 of selection_folders_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects the modification of a specific registry key associated with the Windows Input Method Editor (IME), particularly the "Ime File" value, which can indicate malicious behavior. Attackers may manipulate this registry setting to load a malicious Dynamic Link Library (DLL) into a process by sending a `WM_INPUTLANGCHANGEREQUEST` message, potentially leading to the execution of unauthorized code or the establishment of persistent malware on a system. The use of IMEs is especially relevant in environments that support languages with extensive character sets such as Chinese, Japanese, and Korean.

  The primary threat scenario involves an attacker attempting to exploit the IME functionality to execute malicious payloads without raising detection flags. Such tactics align with the MITRE ATT&CK framework, specifically under the **Defense Evasion** tactic, where techniques like **Indicator Removal on Host (T1562.001)** may be employed to obscure malicious activities. Detection here is crucial, as loading unsigned or unverified DLLs can lead to severe compromise of system integrity and confidentiality.

  Key data sources for detecting suspicious activity related to this rule will primarily include registry change logs, which can reveal unauthorized modifications. In addition, examining process creation events in conjunction with the registry changes may provide further insights into the execution of potentially malicious DLLs.

  ### Investigation Steps
  - **Review Registry Changes:** Look into the registry for modifications under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Control\Keyboard Layouts\` focusing on the "Ime File" values that have been recently added or changed.
  - **Analyze Process Creation Logs:** Check for any process creation events that coincide with the timing of the registry changes, specifically looking for processes that are loading DLLs from suspicious paths.
  - **Monitor File System Activity:** Conduct an analysis of file system changes for DLLs located in temp directories, `AppData`, and other user-specific folders to identify potentially malicious files created or modified around the same time.
  - **Investigate Network Connections:** If applicable, examine any outgoing network connections initiated by processes related to the suspicious registry modifications to detect potential command and control (C2) activity.

  ### Prioritization
  The alert's severity level is marked as high due to the critical nature of registry manipulations associated with the execution of remote or unauthorized code, potentially leading to system compromise. In enterprise environments, timely detection and response are essential to mitigate the risk of exploitation via malicious DLLs.

  ### Blind Spots and Assumptions
  This detection rule may not effectively capture all instances of legitimate IME DLL usage, leading to potential false positives. The detection logic assumes that attackers will target common user directories and not use bespoke paths to evade detection. Successful detection relies on the availability of comprehensive logs that track registry changes and process executions, necessitating proper configuration of logging on Windows systems to ensure all relevant events are captured.

