note: |
  ### Technical Context

  This Sigma rule detects the registration of a suspicious Input Method Editor (IME) file path in the Windows registry. Specifically, it identifies cases where an attacker may register a malicious DLL to execute malicious payloads when the IME keyboard layout is invoked. The likely attacker objective is to leverage the IME to inject malicious code into the user session or to facilitate command-and-control communication. This behavior corresponds to the MITRE ATT&CK tactic of Defense Evasion (T1562.001) by manipulating input methods to disguise malicious activities.

  The primary telemetry source is the Windows registry, particularly for registry modifications involving keyboard layouts (specifically targeting `\Control\Keyboard Layouts\`). The security impact is significant as it may lead to unauthorized execution of code, data exfiltration, or system compromise. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate applications may also modify IME settings.

  ### Investigation Steps

  - **Review registry changes**: Query the registry for modifications to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Controls Folder\Keyboard Layouts\`. Check for values named "Ime File" pointing to non-standard DLLs or directories that may indicate malicious intent.

  - **Compare against known good paths**: Ensure that paths leading to the registered DLLs do not match typical, legitimate software locations (e.g., `C:\Windows\System32\` or standard applications in `C:\Program Files\`). Malicious indicators often lead to unusual directories or temporary locations (e.g., `C:\Users\Public\Temp\`).

  - **Audit DLL properties**: If a suspicious path is found, investigate the properties of the DLL file referenced (use `Get-FileHash` command or similar). Assess file creation dates and digital signatures to determine legitimacy; malicious DLLs may lack valid digital signatures.

  - **Monitor for user interaction**: Check for the legitimacy of user actions that may trigger this IME (e.g., language switching). Review Windows Event ID 164 and 4688 for user activity involving language changes around the same time as the registry change.

  - **Identify lateral movement or persistence attempts**: Check for unusual networking behaviors or logins (Event ID 4624) from the user/system executing the IME command. Correlate with any known indicators of compromise (IoCs) or alerts from other detection systems.

  ### Prioritization

  This alert is considered high severity due to the potential impact of the affected system, which may be critical to business operations. The likelihood of malicious activity is elevated as the registry modification is a technique often used in advanced attacks to evade detection and maintain persistence. This behavior is also not uncommon among threat actors targeting Windows environments.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to trigger this alert mistakenly, such as language input systems that modify IME settings for user convenience. Reliable detection requires complete registry logging and real-time monitoring of system modifications. Other legitimate processes could also utilize similar registry paths. A related detection that strengthens coverage includes monitoring for unusual process creation events (Windows Event ID 4688) that occur after modification of the IME registry key, indicating potential execution of malicious payloads.

