logsource:
  product: windows
  category: registry_set
detection:
  selection_registry:
    TargetObject|contains|all:
    - '\Control\Keyboard Layouts\'
    - 'Ime File'
  selection_folders_1:
    Details|contains:
    - ':\Perflogs\'
    - ':\Users\Public\'
    - ':\Windows\Temp\'
    - '\AppData\Local\Temp\'
    - '\AppData\Roaming\'
    - '\Temporary Internet'
  selection_folders_2:
  - Details|contains|all:
    - ':\Users\'
    - '\Favorites\'
  - Details|contains|all:
    - ':\Users\'
    - '\Favourites\'
  - Details|contains|all:
    - ':\Users\'
    - '\Contacts\'
  condition: selection_registry and 1 of selection_folders_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This detection rule identifies suspicious modifications to the Windows registry related to Input Method Editor (IME) settings, specifically focusing on the "Ime File" registry value, which can allow an attacker to load a malicious DLL during input language transitions. The likely attacker objective is to execute arbitrary code by exploiting the keyboard layout switching mechanism, facilitating the installation of malware or a persistent backdoor. This behavior corresponds to the MITRE ATT&CK technique T1685: *Keyboard Layout Injection*.

  Primary telemetry sources include Windows Registry logs that capture changes to the specified registry paths. If this behavior is malicious, it can lead to unauthorized code execution with potential data theft or system compromise. Importantly, this detection does NOT confirm that a malicious DLL was executed since legitimate modifications to this registry key can occur, particularly for localized systems.

  ### Investigation Steps

  - **Validate the registry change:** Query the Windows Registry for modifications at the path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Keyboard Layouts\` for the "Ime File" value. Check Event ID 4657 from Security logs to confirm the nature of the change.

  - **Check the registry value details:** Identify the path specified in the "Ime File" registry entry. If it points to non-standard directories (e.g., `C:\Users\<User>\AppData\Local\Temp\`), this could indicate malicious intent.

  - **Review associated process creation logs:** Analyze Security Event ID 4688 for process creation related to the IME interaction time frame, looking for unusual or unauthorized executable paths that correspond with the registry change.

  - **Assess expected behaviors:** Confirm if the "Ime File" registry value was modified during legitimate user activities, such as language installations or scheduled updates. Note typical paths for legitimate IME DLLs, which should reside in `C:\Windows\` or localized language folders.

  - **Identify known malicious indicators:** Check for the presence of DLL files in the specified folders that have been flagged in threat intelligence feeds or match known BadHash signatures associated with malware.

  ### Prioritization

  The alert severity is high due to the potential impact on systems where this behavior is detected, such as critical servers or administrative workstations. Malicious use of the IME feature is likely, given that this attack vector is known and weaponized in various advanced persistent threats (APTs).

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion by security-conscious attackers who may use legitimate IME operations or obscure their DLL paths. An assumed logging configuration is crucial; ensure registry auditing is enabled for full visibility. Legitimate activities that may trigger this alert include authorized changes to IME settings for language support. A related detection rule for monitoring unusual process injection attempts could enhance overall coverage and threat detection.

