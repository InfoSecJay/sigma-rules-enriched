logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Services\'
    TargetObject|endswith: '\ImagePath'
    Details|contains:
    - 'powershell'
    - 'pwsh'
  condition: selection
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This rule detects instances where PowerShell code is written to the Windows registry as a service, which may indicate malicious intent by an attacker to establish a persistent presence on the system. The typical threat scenario involves an adversary utilizing PowerShell for nefarious activities, including the execution of malicious scripts, data exfiltration, or lateral movement within the network. By embedding PowerShell commands in the registry, attackers can re-execute these commands on system startup or service restart, enhancing their capability to maintain persistence even after the initial compromise.

  The relevant MITRE ATT&CK tactics for this detection include **Execution (TA0002)**, specifically the technique **Windows Services (T1569.002)**. This technique highlights how attackers can use Windows services as a method for executing malicious code. The primary data sources for timely and effective detection include **Windows Registry logs**, specifically focusing on service creation and modification events that indicate potentially malicious behavior.

  ### Investigation Steps
  - **Review Registry Logs**: Check Windows Registry logs for any recent entries under the `\Services\` path that include 'ImagePath' pointing to PowerShell or pwsh executable paths. Look for anomalies or unexpected service creations that might not align with normal operational activity.

  - **Analyze Process Creation Events**: Inspect process creation logs around the time of the registry modification for instances where PowerShell was executed. Correlate these with any service creation events to determine if the registry changes correspond with potentially malicious PowerShell commands.

  - **Check Service Configuration**: Examine the configuration of any newly created services that utilize PowerShell. Determine if these services have unusual names or configurations, including automatic startup types that may indicate persistence mechanisms used by attackers.

  - **Investigate Related Network Traffic**: Utilize EDR or NDR solutions to monitor for unusual network behavior associated with the identified services. Identify any connections to known malicious IP addresses or command-and-control (C2) traffic originating from the system in question.

  ### Prioritization
  This alert is classified as high severity due to its potential implications for system compromise and attacker persistence. The ability to execute PowerShell commands from the registry can enable an adversary to perform a variety of malicious activities with a high probability of success.

  ### Blind Spots and Assumptions
  Detection coverage may be limited if the registry logging is not properly configured, or if logs are not being actively monitored or archived. The detection logic assumes that any legitimate use of PowerShell in registry modifications will be distinct and should trigger an investigation. Additionally, this rule relies on the existence of detailed logging for the Windows Registry, which might require enabling additional logging configurations not present in all environments.

