note: |
  ### Technical Context

  This rule detects instances where PowerShell code is written to the registry as a service. This behavior often indicates that an attacker is attempting to establish persistence through a malicious service, enabling them to execute PowerShell scripts without user interaction. The relevant MITRE ATT&CK tactic is **Execution**, specifically the technique **T1569.002 - PowerShell as a Service**.

  The primary telemetry sources for this detection are Windows registry changes, specifically those involving service configurations under the `\Services\` path. If malicious, this behavior can lead to unauthorized command execution and control over the compromised system. However, it is important to note that this detection does NOT confirm that the service is malicious on its own; further contextual analysis is required.

  ### Investigation Steps

  - **Review the Service Registry Path**: Check for any unusual entries under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\`. Legitimate services will typically have expected application names and related paths (e.g., `\ImagePath` pointing to known executables).

  - **Examine ImagePath Details**: Focus on the `ImagePath` value for identified entries. Look for `powershell.exe` or `pwsh.exe` referenced here, which is highly indicative of malicious behavior.

  - **Analyze Event Logs for Service Creation**: Cross-reference with Windows Security Event ID 7045 to identify system service creation logs. This can help confirm whether the PowerShell service was newly created or modified.

  - **Identify Parent Process Relationships**: Use Sysmon Event ID 1 to examine the parent process of the PowerShell invocation. Malicious sets often originate from unusual parent processes like `svchost.exe` or `explorer.exe`.

  - **Check for Alternate Data Streams**: Verify if there are any alternate data streams associated with the service entries, which may indicate further obfuscation or persistence techniques.

  - **Review Other Alerts on the Host**: Investigate any related alerts from other detections that involve execution or modification of PowerShell (e.g., script execution logs or file integrity monitoring alerts). This will help establish a broader context of possible malicious activity.

  ### Prioritization

  This alert should be treated with high severity given the potential for significant impact if a malicious service is established. The likelihood of malicious abuse is high, as attackers commonly leverage PowerShell for persistence within Windows environments. The technique is widely weaponized in both targeted and opportunistic attacks.

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications to use PowerShell as a service, which may trigger false positives. Dependency on comprehensive registry monitoring is essential for reliable detection; any gaps in logging configurations could lead to missing indicators of compromise. Additionally, legitimate administrative scripts may create similar registry entries, underscoring the need for contextual analysis. Companion detections, such as monitoring for abnormal PowerShell command executions (e.g., based on execution policy or command line parameters), can enhance detection coverage and accuracy.

