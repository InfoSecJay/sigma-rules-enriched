title: Potential Persistence Via App Paths Default Property
id: 707e097c-e20f-4f67-8807-1f72ff4500d6
status: test
description: |
  Detects changes to the "Default" property for keys located in the \Software\Microsoft\Windows\CurrentVersion\App Paths\ registry. Which might be used as a method of persistence
  The entries found under App Paths are used primarily for the following purposes.
  First, to map an application's executable file name to that file's fully qualified path.
  Second, to prepend information to the PATH environment variable on a per-application, per-process basis.
references:
- https://www.hexacorn.com/blog/2013/01/19/beyond-good-ol-run-key-part-3/
- https://learn.microsoft.com/en-us/windows/win32/shell/app-registration
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-10
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.012
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths'
    TargetObject|endswith:
    - '(Default)'
    - 'Path'
    Details|contains:
            # Add more suspicious paths or binaries as you see fit.
    - '\Users\Public'
    - '\AppData\Local\Temp\'
    - '\Windows\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '%temp%'
    - '%tmp%'
    - 'iex'
    - 'Invoke-'
    - 'rundll32'
    - 'regsvr32'
    - 'mshta'
    - 'cscript'
    - 'wscript'
    - '.bat'
    - '.hta'
    - '.dll'
    - '.ps1'
  condition: selection
falsepositives:
- Legitimate applications registering their binary from on of the suspicious 
  locations mentioned above (tune it)
level: high
note: |
  ### Technical Context

  This rule detects modifications to the "Default" property within registry keys located at `\Software\Microsoft\Windows\CurrentVersion\App Paths`, which attackers may exploit as a persistence mechanism. The behavior observed in these alterations often indicates an attempt to establish execution continuity for malicious code following system reboots or user logins. The relevant MITRE ATT&CK technique associated with this behavior is Persistence via Application Paths (T1546.012).

  Key telemetry sources require monitoring Windows Registry events, specifically for changes to registry paths relating to application paths. If exploited maliciously, this can allow an adversary to execute their payload seamlessly alongside legitimate applications. Importantly, while this detection highlights potentially nefarious activity, it alone does not confirm malicious intent without further context or corroborating evidence.

  ### Investigation Steps

  - **Review Registry Changes:** Examine registry modification events (Security Event ID 4657 or Sysmon Event ID 13) for keys under `\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths`. Filter for entries modified with the default property and note their previous values.

  - **Identify Malicious Indicators:** Look for alterations in the Default values that reference known malicious executables or command-line tools (e.g., `Invoke-`, `cscript`, `mshta`, `.ps1`, or `rundll32`). Such values may signify exploitation attempts.

  - **Contrast with Expected Behavior:** Assess whether legitimate applications are responsible for these changes. Common benign activities include software installations or updates that register their executables. Review software installation logs or MSI event logs for entries corresponding with the timing of the registry modifications.

  - **Collect Additional Context:** Query process creation events (Sysmon Event ID 1 or Security Event ID 4688) to track any created processes that are spawned following the registry modification. Note whether these processes run from suspicious directories like `\AppData\Local\Temp\`.

  - **Check for Related Suspicious Activities:** Investigate for any associated file creations or modifications in temporary directories (e.g., `%temp%` or `\Windows\Temp\`). Use file system monitoring logs to identify any recent additions of potentially malicious scripts or binaries.

  - **Document Affected Systems:** Catalog the host or asset roles affected by the modification. Determine the criticality of the impacted systems and any further dependencies related to the applications involved.

  ### Prioritization

  This alert should be treated as high-severity due to the potential for persistence mechanisms employed by adversaries. The impact on essential systems could allow an attacker to maintain access post-intrusion. The likelihood of adversaries exploiting this technique is significant, as it has been commonly weaponized in various attacks.

  ### Blind Spots and Assumptions

  Limitations in detection may include legitimate applications that modify the App Paths registry in expected ways, potentially generating false positives. Ensure comprehensive logging for registry changes is enabled; otherwise, detection can be incomplete. Similar legitimate modifications from upstanding applications may trigger the alert without malice. To enhance coverage, correlate with other detections such as suspicious PowerShell activity or execution traces to identify potential exploitation patterns.

