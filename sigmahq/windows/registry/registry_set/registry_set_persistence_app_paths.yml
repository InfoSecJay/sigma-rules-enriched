title: Potential Persistence Via App Paths Default Property
id: 707e097c-e20f-4f67-8807-1f72ff4500d6
status: test
description: |
  Detects changes to the "Default" property for keys located in the \Software\Microsoft\Windows\CurrentVersion\App Paths\ registry. Which might be used as a method of persistence
  The entries found under App Paths are used primarily for the following purposes.
  First, to map an application's executable file name to that file's fully qualified path.
  Second, to prepend information to the PATH environment variable on a per-application, per-process basis.
references:
- https://www.hexacorn.com/blog/2013/01/19/beyond-good-ol-run-key-part-3/
- https://learn.microsoft.com/en-us/windows/win32/shell/app-registration
author: Nasreddine Bencherchali (Nextron Systems)
date: 2022-08-10
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1546.012
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths'
    TargetObject|endswith:
    - '(Default)'
    - 'Path'
    Details|contains:
            # Add more suspicious paths or binaries as you see fit.
    - '\Users\Public'
    - '\AppData\Local\Temp\'
    - '\Windows\Temp\'
    - '\Desktop\'
    - '\Downloads\'
    - '%temp%'
    - '%tmp%'
    - 'iex'
    - 'Invoke-'
    - 'rundll32'
    - 'regsvr32'
    - 'mshta'
    - 'cscript'
    - 'wscript'
    - '.bat'
    - '.hta'
    - '.dll'
    - '.ps1'
  condition: selection
falsepositives:
- Legitimate applications registering their binary from on of the suspicious locations
  mentioned above (tune it)
level: high
note: |
  ### Technical Context
  This detection rule identifies changes to the "Default" property of registry keys located under the `\Software\Microsoft\Windows\CurrentVersion\App Paths\` path. Attackers may manipulate these registry entries to establish persistence mechanisms on compromised systems by associating their malicious executables with legitimate application names—allowing them to execute their payloads when the application is run. This behavior typically forms part of an attacker’s strategy to maintain access to a system while evading detection.

  The relevant MITRE ATT&CK tactics for this rule include **Persistence (T1546.012)**, which covers methods of maintaining a foothold within an environment, and **Privilege Escalation (T1546)**, where attackers gain higher privileges than they initially possess. Changes to App Paths can be indicative of malware attempting to execute via common applications, thereby hiding its true nature and making it harder to detect.

  Primary data sources for this detection include **Windows registry logs** capturing changes to the App Paths keys, allowing security analysts to identify suspicious modifications.

  ### Investigation Steps
  - **Review Registry Change Logs**: Inspect logs for modifications made to `\Software\Microsoft\Windows\CurrentVersion\App Paths\`. Pay special attention to entries with suspicious paths or commands.
  - **Analyze Process Creation Events**: Look for process creation events that are initiated by applications mentioned in the suspicious registry entries (e.g., `mshta`, `rundll32`). Correlate these with anomaly detection to identify unusual activity.
  - **Check Installed Software and Startup Items**: Assess the physical presence of applications associated with the modified App Paths and verify their integrity. Investigate whether any unexpected or fishy applications are present.
  - **Monitor Network Connections**: Observe outbound connections initiated by the applications defined in the modified registry keys, particularly those that may connect to known malicious IP addresses or domains.

  ### Prioritization
  This alert should be treated with high severity due to the potential for persistent access that can lead to further compromise within the enterprise environment. Malicious actors utilizing persistence techniques pose a significant threat as they can exploit other vulnerabilities, escalate privileges, and exfiltrate sensitive data.

  ### Blind Spots and Assumptions
  There may be some gaps in detection coverage, particularly when legitimate software performs similar registry modifications—resulting in false positives. The detection logic assumes that suspicious paths correspond strongly to malicious behavior; however, legitimate applications could also use similar registry keys. Comprehensive logging of all registry changes is required, along with tuning of the detection to minimize false positives and ensure effective monitoring. Analysts should ensure that logging of registry changes is enabled and detailed enough to capture all relevant events.

