title: Old TLS1.0/TLS1.1 Protocol Version Enabled
id: 439957a7-ad86-4a8f-9705-a28131c6821b
status: test
description: Detects applications or users re-enabling old TLS versions by setting
  the "Enabled" value to "1" for the "Protocols" registry key.
references:
- https://techcommunity.microsoft.com/t5/windows-it-pro-blog/tls-1-0-and-tls-1-1-soon-to-be-disabled-in-windows/ba-p/3887947
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-05
tags:
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\'
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
- Legitimate enabling of the old tls versions due to incompatibility
level: medium
note: |
  ---

  ### Technical Context

  This rule detects modifications to the Windows registry indicating that old TLS 1.0 or TLS 1.1 protocols have been re-enabled. Attackers may exploit these outdated protocols to perform man-in-the-middle attacks or downgrade security for encrypted communications, potentially intercepting sensitive data. Relevant MITRE ATT&CK techniques include **Defense Evasion (T1562)**, specifically related to re-enabling deprecated security protocols to evade detection and secure communications.

  The primary telemetry sources are Windows Registry logs for changes to the specified `Control\SecurityProviders\SCHANNEL\Protocols` keys, particularly around the `Enabled` value being set to `1`. If this behavior is malicious, it can compromise the security integrity of communications. However, this detection does not confirm malicious intent on its own, as legitimate users may enable these protocols due to application compatibility issues.

  ---

  ### Investigation Steps

  - **Check registry value change: ** Review the Windows Registry for the path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Enabled` or `TLS 1.1\Enabled`, ensuring the value is set to `1`. Document the `LastModified` timestamp and compare it against logins or application changes.

  - **Identify affected applications: ** Look for any applications that might require these old protocols by reviewing installed software and their configuration logs (Event ID 7036 - Service State Change). Confirm if any affected application is a critical business function or a legacy system.

  - **Investigate user activity: ** Examine user account events related to registry edits using Security Event ID 4670 (permissions on an object). Verify if the modifying user has a legitimate need or background that justifies this change.

  - **Review environmental context: ** Validate connectivity requirements and recent changes. If these protocols were enabled after a critical service or application update, this may indicate benign behavior and the need for adjustments rather than malicious intent.

  - **Identify common malicious patterns: ** Search the network traffic logs, such as Firewall or proxy logs, for connections using TLS 1.0 or TLS 1.1 to suspect IP addresses or domains known for hosting malware. Investigate user-agent strings for legitimate versus potentially obfuscated traffic patterns.

  ---

  ### Prioritization

  The alert is of medium severity as it could indicate an attempt by an adversary to downgrade encryption standards for malicious intent. The risk is heightened if the affected systems are critical infrastructure or process sensitive data since these protocols are commonly targeted for exploits.

  ---

  ### Blind Spots and Assumptions

  Detection could be limited by systems not logging registry changes or capable of further filtering false positives, such as legitimate application requirements. Identifying expected legitimate behaviors, like temporary re-enabling for specific application compatibility, is crucial. A related detection to consider is monitoring for abnormal network traffic patterns utilizing these deprecated protocols, which enhances overall visibility into potential exploit attempts.

