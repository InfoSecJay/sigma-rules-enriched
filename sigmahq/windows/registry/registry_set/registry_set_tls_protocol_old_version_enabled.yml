title: Old TLS1.0/TLS1.1 Protocol Version Enabled
id: 439957a7-ad86-4a8f-9705-a28131c6821b
status: test
description: Detects applications or users re-enabling old TLS versions by setting
  the "Enabled" value to "1" for the "Protocols" registry key.
references:
- https://techcommunity.microsoft.com/t5/windows-it-pro-blog/tls-1-0-and-tls-1-1-soon-to-be-disabled-in-windows/ba-p/3887947
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-05
tags:
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\'
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
- Legitimate enabling of the old tls versions due to incompatibility
level: medium
note: |
  ### Technical Context
  This detection rule identifies situations where applications or users have re-enabled deprecated TLS versions (1.0 and 1.1) on a Windows system by altering the registry settings. The primary objective of this behavior is likely to maintain compatibility with legacy systems or software that do not support newer TLS versions (1.2 and above). However, enabling these older protocols significantly increases the risk of various types of attacks, such as Man-in-the-Middle (MitM) attacks and encryption downgrade attacks, potentially allowing adversaries to exploit vulnerabilities associated with these outdated protocols.

  The pertinent MITRE ATT&CK tactics are **Defense Evasion** (TA0005), as re-enabling older TLS versions may be part of a strategy to bypass security mechanisms that enforce modern encryption standards. The specific techniques include **TLS/SSL Downgrade Attack** (T1578) and could further relate to other activities that involve manipulating secure communications. The primary data sources for this detection are Windows Registry logs, specifically monitoring changes to the `SCHANNEL` protocol settings within the registry.

  ### Investigation Steps
  - **Review Registry Changes:** Investigate the Windows Registry logs to confirm alterations in the `\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\` and `\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\` paths, paying close attention to whether the `Enabled` key has been set to `1`.

  - **Correlate with Application Logs:** Analyze application logs and network traffic to identify any communications that are using TLS 1.0 or TLS 1.1, which could indicate active connections being established under outdated protocols.

  - **Check for Legacy Dependencies:** Assess which applications or systems might require these older TLS versions for functionality and evaluate the risks involved, ensuring no unnecessary exposure occurs by weighing compatibility against security.

  - **Monitor for Anomalous Behavior:** Look for other signs of potential malicious activity around the same time as the registry changes, such as unexpected application behavior, increased error rates in secure communications, or signs of potential exploitation attempts.

  ### Prioritization
  This alert should be considered of **medium severity** due to the increased likelihood of exploitation against deprecated TLS versions, particularly in environments with sensitive data or regulatory requirements mandating strong encryption standards. The impact of successful exploitation can lead to significant breaches or data leaks.

  ### Blind Spots and Assumptions
  There may be blind spots in this detection regarding environments that do not properly log registry changes or where older TLS versions are intentionally enabled for compatibility reasons without malicious intent. The detection logic assumes that the presence of `DWORD (0x00000001)` in the relevant registry keys is indicative of a security risk; however, this does not account for legitimate business needs in every case. Required logs to ensure functionality include comprehensive Windows Registry auditing and potentially active monitoring of application security settings across the enterprise.

