title: Old TLS1.0/TLS1.1 Protocol Version Enabled
id: 439957a7-ad86-4a8f-9705-a28131c6821b
status: test
description: Detects applications or users re-enabling old TLS versions by 
  setting the "Enabled" value to "1" for the "Protocols" registry key.
references:
- https://techcommunity.microsoft.com/t5/windows-it-pro-blog/tls-1-0-and-tls-1-1-soon-to-be-disabled-in-windows/ba-p/3887947
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-05
tags:
- attack.stealth
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\'
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
- Legitimate enabling of the old tls versions due to incompatibility
level: medium
note: |
  ### Technical Context

  This rule detects instances where old TLS 1.0 or TLS 1.1 protocol versions are re-enabled in Windows systems through registry modifications. The likely attacker objective is to exploit vulnerabilities in these outdated TLS versions to intercept or manipulate sensitive data, as they are known to have numerous security flaws. This behavior is related to the MITRE ATT&CK tactic of **Defense Evasion (T1218)**, specifically invoking outdated security protocols. The primary telemetry source is Windows registry modifications, particularly monitoring changes to the `HKLM\SYSTEM\CurrentControlSet\Services\TLS\Control\SecurityProviders\SCHANNEL\Protocols\` path. If malicious, this behavior facilitates unauthorized communication and potential data breaches. This detection does NOT confirm malicious intent on its own, as legitimate applications may require the re-enabling of these protocols for compatibility purposes.

  ### Investigation Steps

  - **Check registry modifications: ** Access Event ID 4657, focusing on changes to `TargetObject` values indicating re-enabling of TLS 1.0 or TLS 1.1. Validate if `Enabled` is set to `1` in the corresponding protocol registry paths. Look for events closely followed by network connection attempts on port 443.

  - **Review change agent: ** Identify the user or process that modified the registry settings by correlating Event ID 4663 for any 'Write' access to the TLS registry keys. Look for any discrepancies between administrative access and normal user actions.

  - **Examine outbound network traffic: ** Analyze firewall and network logs for anomalies, specifically monitoring connections to external IP addresses over HTTPS that occur shortly after the registry changes. An absence of legitimate traffic could indicate malicious intent.

  - **Correlate with application logs: ** Check application logs (e.g., IIS, SQL Server) for any services that rely on TLS and their corresponding usage logs before and after the registry modification. Look for irregular traffic patterns that may relate to the timelines of registry changes.

  - **Identify legitimate use cases: ** Understand the environment's dependencies. Confirm whether any business-critical applications require older TLS versions and if those applications were scheduled for maintenance or configuration changes around the time of the alert.

  ### Prioritization

  This alert holds medium severity due to the potential risk of exploitation in environments where outdated TLS protocols facilitate secure communication. The likelihood of abuse exists, especially for sensitive systems, as attackers frequently leverage known vulnerabilities in these older TLS versions. However, the context of specific organizational needs must be considered.

  ### Blind Spots and Assumptions

  This detection may miss instances where attackers use less noticeable registry manipulation techniques to re-enable TLS protocols. It assumes logging for registry modifications is enabled and properly configured. Legitimate business needs may occasionally involve re-enabling older TLS versions for specific software compatibility. Companion detections, such as monitoring for unusual network traffic and configuration changes (Suricata or other IDS alerts), can enhance coverage against exploitation attempts.

