title: Old TLS1.0/TLS1.1 Protocol Version Enabled
id: 439957a7-ad86-4a8f-9705-a28131c6821b
status: test
description: Detects applications or users re-enabling old TLS versions by 
  setting the "Enabled" value to "1" for the "Protocols" registry key.
references:
- https://techcommunity.microsoft.com/t5/windows-it-pro-blog/tls-1-0-and-tls-1-1-soon-to-be-disabled-in-windows/ba-p/3887947
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-09-05
tags:
- attack.defense-evasion
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\'
    - '\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.1\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000001)'
  condition: selection
falsepositives:
- Legitimate enabling of the old tls versions due to incompatibility
level: medium
note: |
  ### Technical Context

  This rule detects the re-enabling of deprecated TLS 1.0 and TLS 1.1 protocols in Windows environments by monitoring changes to specific registry keys, specifically when the “Enabled” value is set to "1". The likely attacker objective behind enabling these protocols may include evasion of modern security measures, as these older protocols have known vulnerabilities that could be exploited by an adversary to intercept or manipulate secure communications.

  Relevant MITRE ATT&CK tactics include **Defense Evasion (TA0005)**, with the technique being **Protocol Tunneling (T1572)**. The primary telemetry source is the Windows registry, particularly focusing on changes to the registry paths associated with SCHANNEL protocols. The potential security impact of malicious activity could lead to exposure of sensitive data through insecure transport protocols. It’s crucial to note what this detection does NOT confirm; while it indicates the enabling of older TLS protocols, it does not confirm actual malicious exploitation or ongoing attacks.

  ### Investigation Steps

  - **Check registry change details: ** Review the registry change at `HKEY_LOCAL_MACHINE\Control\SecurityProviders\SCHANNEL\Protocols\TLS 1.0\Enabled` and `TLS 1.1\Enabled` for a value of "1". Look for recent timestamps and identify the user or application that made this change.

  - **Identify legitimate use cases: ** Verify if the enabling is part of authorized compatibility changes for legacy systems. Document details of current systems requiring TLS 1.0 or 1.1, including the purpose and application involved in re-enabling this setting.

  - **Look for related logs in the Security Event Log:** Review Security Event ID 4657 for registry key modifications. Identify system accounts that triggered these changes, correlating against your list of known administrators and whitelisted applications.

  - **Evaluate system impact assessment: ** Analyze the affected assets' role in your environment. Consider their exposure level and compatibility with current security protocols. High-value assets should be prioritized for further review and remediation.

  - **Detect network traffic anomalies:** Use network traffic analysis tools to check for HTTPS connections using older TLS versions on affected hosts. Monitor for weak ciphers in use or connections that show TLS 1.0/1.1 being used.

  ### Prioritization

  This alert is considered medium severity as enabling outdated TLS versions on systems that handle sensitive data increases the risk of a successful attack. While not inherently malicious, such configurations are often exploited in the wild, making it important to address any such instances urgently, especially on critical systems.

  ### Blind Spots and Assumptions

  The detection may be limited by lack of visibility into all potential registry changes without comprehensive logging enabled. Legitimate activities, such as system compatibility configurations by IT staff or application updates requiring older protocols, may trigger this alert. A related detection that strengthens coverage is monitoring for outbound network traffic to detect the use of deprecated TLS versions, which can provide insights into potential exploitation attempts.

