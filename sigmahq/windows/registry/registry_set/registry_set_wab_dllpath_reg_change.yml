logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Software\Microsoft\WAB\DLLPath'
  filter:
    Details: '%CommonProgramFiles%\System\wab32.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects instances where the `WAB.EXE` process attempts to load a DLL from a registry path that deviates from the expected default path. The likely attacker objective here is to leverage `WAB.EXE` as a living-off-the-land binary (LOLBin) to execute malicious code through a non-standard DLL. This behavior correlates with the MITRE ATT&CK tactic "Defense Evasion" (ID: T1218) and the technique of "Signed Binary Proxy Execution" (ID: T1218.004).

  The primary telemetry sources include Windows Registry logs, specifically monitoring changes to the `HKEY_CURRENT_USER\Software\Microsoft\WAB\` path. Unauthorized DLL loading using `WAB.EXE` can result in significant security risks, as it may bypass traditional security methods. Notably, this detection does not confirm malicious activity on its own, as it could also be indicative of benign misconfigurations or legitimate administrative actions.

  ### Investigation Steps

  - **Review the registry key in question:** Examine `HKEY_CURRENT_USER\Software\Microsoft\WAB\DLLPath` for values differing from `'%CommonProgramFiles%\System\wab32.dll'` and document current values.

  - **Analyze the process creation log:** Check Security Event ID 4688 for `WAB.EXE` execution events around the same timestamp as the registry change. Note the command line arguments used to determine if there is suspicious usage.

  - **Identify DLL file path:** Validate the path of the DLL specified in the registry entry and confirm whether it resides on the file system by checking for its existence via a file search (on endpoint telemetry or file system snapshots).

  - **Verify historical changes to the registry:** Use Event ID 4657 or Sysmon Event ID 13 to track previous states of the registry key, looking for recent changes that could indicate unauthorized manipulation along with the user context that performed these actions.

  - **Compare against known good behavior:** Confirm standard practices for `WAB.EXE` use in your environment, such as legitimate administrative scripts or authorized applications, by referencing application inventory or change logs.

  - **Correlate with other security alerts:** Investigate for any additional alerts associated with the same user or system context, particularly those linked to unusual process execution or network connections, to build a comprehensive view of the activity.

  ### Prioritization

  This alert should be considered high severity due to the potential for critical systems being compromised through the misuse of a trusted application. The deviation from the standard DLL path indicates a higher likelihood of being weaponized by an adversary, especially in environments where `WAB.EXE` is common for legitimate operations.

  ### Blind Spots and Assumptions

  This detection is limited by potential evasion techniques such as modifying legitimate applications or DLL files, which could mask malicious intent. Reliable detection requires complete logging of registry changes and process execution, particularly with detailed command line arguments. Legitimate use cases may include software updates or configurations that modify the DLL path for `WAB.EXE` for business purposes. A related detection could include monitoring for event correlations involving other LOLBins, such as `powershell.exe`, to enhance detection capabilities.

