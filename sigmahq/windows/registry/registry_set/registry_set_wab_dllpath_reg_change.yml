logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Software\Microsoft\WAB\DLLPath'
  filter:
    Details: '%CommonProgramFiles%\System\wab32.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies suspicious behavior associated with the executable WAB.EXE, which is utilized for accessing Windows Address Book functions. Specifically, it focuses on scenarios where the path to a DLL, defined in the Windows registry for WAB.EXE, diverges from the expected default path. Malicious actors may exploit WAB.EXE as a Living off the Land Binary ( LOLBin) to load arbitrary DLLs, facilitating stealthy code execution while evading detection by security measures.

  In such scenarios, attackers aim to leverage legitimate applications to execute malicious payloads, often leading to unauthorized access or further compromise of the system. By manipulating the registry settings related to WAB.EXE, adversaries can execute payloads without raising immediate alarms, targeting Windows environments to maintain persistence or conduct lateral movement.

  This detection aligns with the MITRE ATT&CK framework, particularly under the tactics of **Defense Evasion** (T1203) and **Execution** (T1218). The primary data source for this detection is Windows registry logs, which reveal alterations to software settings that could indicate malicious intent.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the Windows registry for modifications to the `HKEY_CURRENT_USER\Software\Microsoft\WAB\DLLPath` value, paying close attention to any deviations from the expected path of `%CommonProgramFiles%\System\wab32.dll`.
  - **Analyze Process Creation Events:** Investigate process creation logs for instances where WAB.EXE was executed alongside unusual parent processes, or in conjunction with suspicious command lines that may indicate malicious activity.
  - **Correlate with EDR Data:** Leverage Endpoint Detection and Response (EDR) telemetry to track the lifecycle of the WAB.EXE process, identifying any associated network connections or file system changes that could suggest further malicious behavior.
  - **Examine User Activity Logs:** Investigate user activity logs around the time of execution for any anomalous behavior, such as logins at unusual hours or connections from unexpected geographic locations.

  ### Prioritization
  This alert is categorized as high severity due to the potential for significant impact on system integrity, given that the use of a legitimate Windows utility to execute arbitrary code can often lead to broader compromise and data exfiltration within an enterprise environment.

  ### Blind Spots and Assumptions
  There are potential gaps in detection coverage, particularly if robust logging of registry changes is not configured or if the environment lacks comprehensive monitoring for Windows execution artifacts. The detection logic assumes that the expected DLL path will remain static and that any changes will trigger alerts; if the default path is altered maliciously but unnoticed beforehand, it may be overlooked. Proper configuration of Windows registry auditing is essential for this alert to function effectively.

