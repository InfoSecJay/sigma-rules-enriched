logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Software\Microsoft\WAB\DLLPath'
  filter:
    Details: '%CommonProgramFiles%\System\wab32.dll'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This rule detects attempts to load a non-standard dynamic link library (DLL) through the Windows Address Book (WAB.EXE) by monitoring changes to the registry that specify an alternative DLL path instead of the default. The likely attacker objective is to leverage WAB.EXE as a legitimate process to execute malicious code, utilizing DLL sideloading techniques. This behavior fits the MITRE ATT&CK framework under the tactic "Defense Evasion" and the technique "Malicious DLL Search Order Hijacking" (T1218).

  The primary telemetry sources required for detection are Windows Registry changes, specifically targeting the registry path `HKEY_CURRENT_USER\Software\Microsoft\WAB\DLLPath`. The security impact of malicious activity could lead to unauthorized code execution under a trusted process, resulting in potential data exfiltration or system compromise. It is important to note that this detection alone does not confirm malicious activity, as legitimate applications can also modify the DLL path if properly authorized.

  ### Investigation Steps

  - **Check the registry value path:** Review the registry entry located at `HKEY_CURRENT_USER\Software\Microsoft\WAB\DLLPath` for anomalies. Malicious modifications typically involve paths that do not correspond to known good DLLs.

  - **Verify DLL path legitimacy:** Compare the loaded DLL path to expected legitimate DLLs, such as `%CommonProgramFiles%\System\wab32.dll`. Any differences that point to unrecognized or suspicious DLLs should raise concerns.

  - **Analyze WAB.EXE parent processes:** Use Process Explorer or equivalent to examine the parent process that initiated WAB.EXE. Execute `Get-Process -Id [ProcessID]` to determine if a suspicious process (like an unexpected calling application) launched it.

  - **Identify execution context:** Look for related Event ID 4688 logs for process creation events associated with WAB.EXE. Check the `NewProcessName` and `CommandLine` fields for any unconventional arguments or paths.

  - **Monitor for related behaviors:** Facilitate broader detection by checking if similar patterns are logged, such as unexpected entries in the same registry key or execution of other LOLBins (Living Off The Land Binaries) which may indicate a more extensive compromise.

  ### Prioritization

  This alert should be treated as high priority due to the potential impact on critical systems where WAB.EXE could be misused. The malfeasance is likely to be weaponized, as attackers often utilize trusted binaries to bypass security measures.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of registry logging or changes not being captured if Windows auditing is not enabled. Legitimate software updates or application configurations could also lead to similar registry modifications. A companion detection worth noting is the monitoring of behavior involving other known LOLBins, like `rundll32.exe`, to strengthen detection coverage and provide context around possible attack vectors.

