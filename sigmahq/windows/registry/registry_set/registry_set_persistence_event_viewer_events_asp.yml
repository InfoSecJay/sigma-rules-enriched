logsource:
  category: registry_set
  product: windows
detection:
  selection:
        # Covers both "\Policies\" and "\Software\" paths for both "Machine" and "User" level configs
        # Also "MicrosoftRedirectionProgramCommandLineParameters" key
    TargetObject|contains:
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionURL'
  filter_default_redirect_program:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    Details: '%%SystemRoot%%\PCHealth\HelpCtr\Binaries\HelpCtr.exe'
  filter_default_redirect_program_cli:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgramCommandLineParameters'
    Details: '-url hcp://services/centers/support?topic=%%s'
  filter_url:
    Details: 'http://go.microsoft.com/fwlink/events.asp'
  filter_cleaner:
    Details: '(Empty)'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects potential persistence mechanisms that leverage the Event Viewer configuration in Windows operating systems, specifically targeting registry keys related to the Event Viewer redirection program. Attackers may modify these registry settings to facilitate persistence on compromised hosts. The likely objective is to maintain access or to redirect legitimate user actions towards malicious resources, effectively bypassing security controls.

  This behavior relates to the MITRE ATT&CK framework under the **Persistence** tactic (TA0003) using the technique called **Registry Run Keys / Startup Folder** (T1112). By modifying registry keys such as `MicrosoftRedirectionProgram` and `MicrosoftRedirectionURL`, attackers can obfuscate their persistence mechanisms, making it more challenging for defenders to detect malicious activities.

  The primary data sources for this detection are Windows registry logs, specifically those capturing modification events on `HKEY_LOCAL_MACHINE` and `HKEY_CURRENT_USER` registry paths. Additionally, process creation events may shed light on suspicious executions of processes like `svchost.exe` that could be claimed by malicious actors through these registry modifications.

  ### Investigation Steps
  - **Review Registry Modifications**: Check the logs for changes made to the registry keys specified in the detection logic. Focus on the inclusion of the registry paths related to the Event Viewer that may indicate an attempt to establish persistence.

  - **Correlate Process Activity**: Examine process creation and termination events that correspond with the modifications in the registry. Look for `svchost.exe` operations to identify any unusual command line parameters or behavior that could relate to the persistence technique.

  - **Assess User Actions and Triggered Events**: Analyze user activity logs for any associated actions with the modification of the Event Viewer settings, particularly any anomalous interactions that could suggest misuse of the Event Viewer for redirection purposes.

  - **Investigate Network Connections**: Investigate outbound network connections, especially to URLs associated with the Event Viewer events redirection. Validate whether these connections correspond to legitimate traffic or are an indication of redirection to malicious servers.

  ### Prioritization
  The severity of this alert is medium due to the potential for an attacker to regain access to a compromised system and maintain a foothold within the environment. Given that this technique can lead to further exploitation, prompt investigation is crucial.

  ### Blind Spots and Assumptions
  There may be gaps in detecting all variations of persistence methods associated with the Event Viewer, particularly if attackers employ other less-obvious registry keys or methods to maintain persistence. The detection logic assumes the standard configuration of Windows systems, where the registry keys mentioned are present and monitored. Additionally, appropriate logging configurations must be in place to capture registry modifications comprehensively for this detection to function effectively.

