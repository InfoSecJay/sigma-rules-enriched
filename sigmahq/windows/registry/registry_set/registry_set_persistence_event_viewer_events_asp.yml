title: Potential Persistence Via Event Viewer Events.asp
id: a1e11042-a74a-46e6-b07c-c4ce8ecc239b
status: test
description: Detects potential registry persistence technique using the Event 
  Viewer "Events.asp" technique
references:
- https://twitter.com/nas_bench/status/1626648985824788480
- https://admx.help/?Category=Windows_7_2008R2&Policy=Microsoft.Policies.InternetCommunicationManagement::EventViewer_DisableLinks
- https://www.hexacorn.com/blog/2019/02/15/beyond-good-ol-run-key-part-103/
- https://github.com/redcanaryco/atomic-red-team/blob/f296668303c29d3f4c07e42bdd2b28d8dd6625f9/atomics/T1112/T1112.md
author: Nasreddine Bencherchali (Nextron Systems)
date: 2023-02-17
modified: 2023-03-05
tags:
- attack.persistence
- attack.defense-impairment
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
  selection:
        # Covers both "\Policies\" and "\Software\" paths for both "Machine" and "User" level configs
        # Also "MicrosoftRedirectionProgramCommandLineParameters" key
    TargetObject|contains:
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionURL'
  filter_default_redirect_program:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    Details: '%%SystemRoot%%\PCHealth\HelpCtr\Binaries\HelpCtr.exe'
  filter_default_redirect_program_cli:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgramCommandLineParameters'
    Details: '-url hcp://services/centers/support?topic=%%s'
  filter_url:
    Details: 'http://go.microsoft.com/fwlink/events.asp'
  filter_cleaner:
    Details: '(Empty)'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This rule detects modifications to specific Windows registry keys associated with the Event Viewer which can indicate an attempt to establish persistence via redirection to malicious Event Viewer URLs. Such behavior may signal an attacker aiming to impair defense mechanisms or evade detection. The relevant MITRE ATT&CK tactics and techniques include Persistence (T1112) and Defense Evasion (T1203). The primary telemetry sources are Windows registry logs that capture changes to the specified keys. If malicious, this behavior can allow an adversary to conceal their actions or mislead incident responders. It is important to note that this detection does NOT confirm that the endpoint has been compromised; it only indicates potential misuse of registry settings.

  ### Investigation Steps

  - **Check registry modifications:** Validate changes to the registry keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Event Viewer\` and `HKEY_CURRENT_USER\Software\Microsoft\Windows NT\CurrentVersion\Event Viewer\`. Use Event ID 4657 (Registry value modified) for detailed insights.

  - **Review the modification context:** Gather information regarding the user account that made the registry change. Look for unusual accounts or non-administrative users modifying keys typically restricted to administrators, which can indicate potential malicious activity.

  - **Look for malicious indicators:** Analyze the `Details` field for values like `http://go.microsoft.com/fwlink/events.asp` or unexpected URLs that do not conform to legitimate Event Viewer behavior, suggesting potential redirection to harmful sites.

  - **Identify expected legitimate activity:** Confirm standard usage patterns where the original Event Viewer keys are modified by Group Policy updates or system administrators performing necessary maintenance. True administrative changes should correspond with standard operational timelines and be logged in internal documentation.

  - **Examine related process activity:** Review Security Event ID 4688 (Process Created) for processes spawning `svchost.exe` involved in the registry change, ensuring they correlate with legitimate services. Look for flags that indicate abnormal parent-child relationships.

  ### Prioritization

  This alert carries medium severity given that it can signify potentially malicious activity targeting persistence mechanisms on a system. Its impact is higher on critical infrastructure, especially if linked to administrative tools or sensitive data. While the behavior observed can be part of legitimate operational tasks, it is commonly exploited by adversaries demonstrating notable persistence objectives.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of comprehensive Windows registry auditing configurations, which could prevent capturing all necessary modifications. Legitimate activities that may trigger this alert include standard administrative updates or configuration changes via Group Policy Object (GPO). Close monitoring of persistent mechanism alerts can enhance detection capabilities, such as leveraging alerts for other persistence techniques (e.g., T1112 - Modify Registry).

