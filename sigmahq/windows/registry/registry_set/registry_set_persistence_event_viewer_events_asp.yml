note: |
  ### Technical Context

  This Sigma rule detects potential persistence mechanisms by monitoring registry modifications related to the Windows Event Viewer, specifically alterations to the Microsoft Redirection Program and URL. Attackers may aim to redirect event logs or create malicious links that could execute code, thereby establishing persistence or targeting user systems for further exploitation. This behavior is commonly linked to MITRE ATT&CK technique T1112 (Create Registry Run Keys / Startup Folder) under the persistence tactic.

  The primary telemetry source for this detection is registry changes monitored through Windows Event Logs. Relevant log types include Windows Registry set events, focusing on specific TargetObject paths that indicate potential manipulation of the Event Viewer. If these modifications are confirmed malicious, they can undermine system integrity and hinder incident response. This detection does NOT, on its own, confirm the execution of malicious code or unauthorized access.

  ### Investigation Steps

  - **Review modified registry keys:** Investigate the registry keys at `HKEY_LOCAL_MACHINE\Microsoft\Windows NT\CurrentVersion\Event Viewer` and `HKEY_CURRENT_USER\Microsoft\Windows NT\CurrentVersion\Event Viewer`. Look for suspicious values related to Microsoft Redirection Program settings as per Event ID 4657 (Value Set) logs.

  - **Analyze event log redirection:** Check for the presence of the URL `http://go.microsoft.com/fwlink/events.asp` in the registry logs. Confirm if this redirection could lead to known malicious sites or payloads.

  - **Assess legitimate behavior:** Verify typical configurations in the targeted registry paths. Legitimate environments often have default values that do not redirect to external web resources. Document any discrepancies.

  - **Check service host invocation:** Confirm the `Image` path in logs tied to any actions initiated by `C:\WINDOWS\system32\svchost.exe`. Legitimate processes that should not modify these keys may indicate further investigation is required.

  - **Cross-reference known threats:** Query Threat Intelligence databases for any reputational information pertaining to the modified target values, especially if they match known malicious activity patterns.

  - **Examine system behavior change:** Review historical logs to identify when the changes were made and correlate with user or system activity to gauge whether the modifications align with normal operational behavior or unusual access patterns.

  ### Prioritization

  This alert should be treated with medium to high priority, depending on the criticality of the affected endpoint. Given that the behavior often leads to persistence and potential code execution, the likelihood of malicious abuse is significant. Additionally, this technique is commonly weaponized by adversaries to ensure continued access even after initial detection.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of detailed logging configurations or if registry auditing is not enabled, increasing the chances of missing malicious activity. Legitimate software installation or updates could inadvertently trigger the alert, resulting in false positives. Related detections, such as monitoring for unusual modifications in other startup locations (e.g., Scheduled Tasks or Startup Folder), could enhance visibility and strengthen overall security posture.

