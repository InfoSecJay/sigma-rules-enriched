logsource:
  category: registry_set
  product: windows
detection:
  selection:
        # Covers both "\Policies\" and "\Software\" paths for both "Machine" and "User" level configs
        # Also "MicrosoftRedirectionProgramCommandLineParameters" key
    TargetObject|contains:
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionURL'
  filter_default_redirect_program:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    Details: '%%SystemRoot%%\PCHealth\HelpCtr\Binaries\HelpCtr.exe'
  filter_default_redirect_program_cli:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgramCommandLineParameters'
    Details: '-url hcp://services/centers/support?topic=%%s'
  filter_url:
    Details: 'http://go.microsoft.com/fwlink/events.asp'
  filter_cleaner:
    Details: '(Empty)'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects potential persistence mechanisms through the manipulation of Event Viewer settings in Windows, specifically targeting registry keys related to Microsoft Redirection in Event Viewer. Attackers may exploit these settings to hide malicious activities or redirect legitimate processes to controlled URLs, ultimately aiming to maintain access upon system reboot or user logon. This behavior aligns with the MITRE ATT&CK tactic of Persistence (T1112) and Defense Evasion (T1070.004).

  The primary telemetry sources include Windows Registry changes, particularly logs related to registry writes (Event IDs 4657 and 4663). If the behavior is malicious, it could compromise system integrity and lead to unauthorized data access or manipulation. However, this detection does NOT confirm that malicious behavior is occurring on its own; it merely identifies changes that warrant further investigation.

  ### Investigation Steps

  - **Review registry changes:** Examine registry keys at `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Event Viewer\` and `HKCU\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Event Viewer\`. Look for unexpected values in the `MicrosoftRedirectionProgram` and `MicrosoftRedirectionURL` keys. Legitimate values generally point to system directories or standard paths.

  - **Check for unusual processes:** Use Sysmon Event ID 1 to identify the creation of the svchost.exe process. Investigate the command line parameters, especially any that include URLs similar to `http://go.microsoft.com/fwlink/events.asp`, which would suggest potentially malicious redirection.

  - **Correlate with user activity logs:** Cross-reference the timestamps of the registry changes with user activity logs (e.g., Windows Security Event ID 4624 for logon events) to identify whether these changes occurred during legitimate administrative actions or anomalous times.

  - **Identify associated malware behavior:** Check for signs of malware activity linked to this technique, such as callbacks to known bad hostnames or IP addresses in network activity logs (e.g., firewall logs or proxy logs).

  - **Validate file creation and potential exfiltration:** Investigate temporary file folders, such as `%TEMP%`, for unusual executable files or scripts created around the same time as the registry changes. The presence of unexpected files could indicate exploitation.

  ### Prioritization

  This alert should be considered medium severity due to its potential for significant impact, such as establishing persistence or obscuring malicious operations. The likelihood of malicious abuse is moderate since attacker techniques for persistence and evasion commonly target registry manipulations. However, this behavior can also result from legitimate administrative changes, necessitating careful review before escalating it as a major threat.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate administrative changes that modify registry settings, leading to potential false positives. It is essential to ensure that logging for registry modifications is enabled and configured properly to capture necessary events. Legitimate tools or scripts that modify Event Viewer settings may also trigger this alert. Companion detections, such as monitoring for unusual processes using Sysmon or detecting unexpected outbound connections, can enhance coverage for this behavior.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
