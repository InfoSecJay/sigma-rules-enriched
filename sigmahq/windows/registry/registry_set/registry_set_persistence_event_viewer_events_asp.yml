logsource:
  category: registry_set
  product: windows
detection:
  selection:
        # Covers both "\Policies\" and "\Software\" paths for both "Machine" and "User" level configs
        # Also "MicrosoftRedirectionProgramCommandLineParameters" key
    TargetObject|contains:
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    - '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionURL'
  filter_default_redirect_program:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram'
    Details: '%%SystemRoot%%\PCHealth\HelpCtr\Binaries\HelpCtr.exe'
  filter_default_redirect_program_cli:
    Image|endswith: 'C:\WINDOWS\system32\svchost.exe'     # Set via GPO
    TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgramCommandLineParameters'
    Details: '-url hcp://services/centers/support?topic=%%s'
  filter_url:
    Details: 'http://go.microsoft.com/fwlink/events.asp'
  filter_cleaner:
    Details: '(Empty)'
  condition: selection and not 1 of filter_*
falsepositives:
- Unknown
level: medium
note: |
  ---

  ### Technical Context

  This Sigma rule detects a potential registry persistence technique involving the Event Viewer’s "Events.asp" setup. Attackers may aim to manipulate registry keys associated with Event Viewer to maintain persistence or redirect legitimate functionalities to malicious URLs. The relevant MITRE ATT&CK tactic is Persistence and the technique is T1112 (Modify Registry). The primary telemetry sources are Windows registry change logs, specifically focusing on Event IDs associated with registry modifications (e.g., Event ID 4657 - Registry value modified). If malicious, this activity could allow an attacker to run unauthorized commands or execute code persistently on a compromised system. Importantly, while this detection identifies suspicious changes, it does not confirm active exploitation or immediate malicious intent without further corroborating evidence.

  ---

  ### Investigation Steps

  - **Review the registry change event:**
    Check Windows Event ID 4657 to identify modified registry values in the following paths:
    - `\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionProgram`
    - `\Microsoft\Windows NT\CurrentVersion\Event Viewer\MicrosoftRedirectionURL`

  - **Analyze the value and command-line parameters:**
    Inspect the `Details` field for changed values, particularly those containing:
    - `http://go.microsoft.com/fwlink/events.asp`
    - Look for entries associated with `svchost.exe` which may indicate exploitation.

  - **Identify legitimate configuration settings:**
    Validate that the identified registry paths conform to organizational GPO policies for Event Viewer configurations. For example, ensure that intended command line parameters do not end with `-url hcp://services/centers/support?topic=%%s`.

  - **Correlate with recent user activity:**
    Leverage the security event logs around the time of detection (e.g., Event IDs 4624, 4625) to correlate user logon activity that might shed light on whether an insider could have made the changes.

  - **Check for inline URLs in related artifacts:**
    Review for any linked malicious URLs in network logs or proxy logs to see if these changes are being used to communicate externally.

  - **Assess response and remediation steps:**
    If malicious activity is confirmed, document the process for revoking unauthorized registry changes and implement integrity monitoring on the affected registry paths.

  ---

  ### Prioritization

  The severity of this alert is medium, as it signals potentially malicious behavior in a critical system component (Event Viewer). While the likelihood of such registry modifications being weaponized is moderate, it indicates behavior often associated with persistence mechanisms used by sophisticated adversaries.

  ---

  ### Blind Spots and Assumptions

  This detection may miss actions that irregularly alter registry values without clear indicators, particularly those that utilize encrypted or obfuscated command parameters. Reliable detection requires the logging of all registry modifications and adequate monitoring configurations. Legitimate administrative changes could trigger the alert, especially during patching or system maintenance. Companion detections, such as monitoring for script execution (T1064 - Scripting), may provide additional context for this behavior.

