note: |
  ### Technical Context

  This detection rule identifies the alteration of Outlook's security settings to permit the execution of macros without user prompts. An attacker might utilize this change to execute malicious macros embedded in email attachments seamlessly, potentially leading to code execution and further exploitation of the system.

  The relevant MITRE ATT&CK tactics and techniques include **Persistence (T1137)** and **Command and Control (T1008)**, as this modification allows malware to establish persistence and covertly receive commands. The primary telemetry source for this detection is Windows Registry changes, specifically focusing on the registry key for Outlook's macro security settings under `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Outlook\Security\Level`.

  If malicious, this behavior can lead to severe security impacts such as data theft, lateral movement, or complete system compromise. However, this detection alone does not confirm that the macro was executed or that it resulted in successful execution of malicious code.

  ### Investigation Steps

  - **Check registry modification timeline:** Review Windows Registry changes for `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Outlook\Security\Level` using Event ID 4657 to correlate when the setting was changed. A recent change could indicate potential malicious activity.

  - **Review Macro Activity:** Utilize the Office Application logs or Excel/Word logs to look for instances of macro execution (Office Event ID 1085) related to the time of the registry change. Legitimate usage typically involves explicit user prompts to allow macro execution.

  - **Identify unusual user behavior:** Analyze user account activity logs (Event ID 4624) for logins or suspicious actions immediately following the registry change. Look for abnormal patterns, such as usage of Outlook or Office applications outside of normal business hours or in unexpected locations.

  - **Cross-reference with threat intelligence:** Look up the user context against known APT actors or publicly reported campaigns that leverage macro-enabled attacks. If the user has been previously flagged or is part of high-risk groups, it increases the likelihood of malicious intent.

  - **Verify file creation or access logs:** Search for file types commonly associated with macro-enabled documents (.docm, .xlsm) accessed around the time of the registry change using Windows File Access logs (Event ID 4663). A sudden spike in access to these file types could indicate malicious activity.

  ### Prioritization

  The severity of this alert is high based on the potential impact on the affected user’s workstation and the access that an attacker could gain through macro execution. Additionally, attackers often exploit macro vulnerabilities actively, making this behavior a common technique in targeted attacks.

  ### Blind Spots and Assumptions

  Detection may be limited by user administrative privileges; an adversary with sufficient permissions can bypass controls. Log source requirements include the monitoring of registry changes, common Event IDs, and security logs. Legitimate users may modify these settings for valid purposes, such as development work. Companion detections include monitoring for macro execution events (e.g., Office Event ID 1085) to validate whether a macro was run after the registry change was made.

