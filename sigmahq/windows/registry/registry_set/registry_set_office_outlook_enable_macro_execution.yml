  ---

  ### Technical Context

  This rule detects changes to the Outlook security settings that permit the execution of macros without user prompts. Attackers may modify this setting to enable malicious macros, facilitating persistence and command-and-control operations through phishing emails. This behavior maps to the MITRE ATT&CK tactic of Persistence (T1137) and the technique of Script-Based Payloads (T1546). The primary telemetry source for this detection is the Windows Registry, specifically monitoring changes to the key that controls macro settings in Outlook. If exploited, this behavior could lead to unauthorized execution of macro-based malware, posing a significant risk to the organization. Note that this detection alone does not confirm that malicious activity is occurring; it only indicates that a configuration change has been made.

  ---

  ### Investigation Steps

  - **Verify the registry change:** Check for modifications to `HKEY_CURRENT_USER\Software\Microsoft\Office\<version>\Outlook\Security\Level`. Look for a value of '0' indicating 'Enable all Macros' is set, which is unlikely for a secure environment.

  - **Review user activity logs:** Correlate Event ID 4657 (Registry value modified) to identify who made the change and when. Determine if this action aligns with known administrative tasks or if it appears suspicious.

  - **Identify user roles and permissions:** Assess the account permissions involved in the registry change. Legitimate changes are typically executed by IT admins and confirmed through documented processes.

  - **Investigate recent email activity:** Explore recent emails received by the user (e.g., using Mailbox Audit logs in Exchange) for phishing content or attachments that could suggest a past macro execution attempt.

  - **Cross-reference related detections:** Verify if there are any alerts for execution of macros in the user's recent events, especially regarding Event ID 4688 (Process Creation) showing the execution of `winword.exe` or `outlook.exe` with suspicious parameters.

  - **Implement a risk assessment for affected hosts:** Examine if the changes occur on critical systems, especially those handling sensitive data or operations, to prioritize investigation efforts.

  ---

  ### Prioritization

  This alert carries a high severity level due to the potential for compromising user systems, enabling unauthorized macro execution. The likelihood of exploitation is heightened, particularly in environments targeted by phishing attacks, as unprompted macro execution is commonly weaponized in such scenarios.

  ---

  ### Blind Spots and Assumptions

  Detection effectiveness can be limited if appropriate logging of registry changes is not enabled. Attackers may also use evasion techniques, such as temporarily reversing the setting post-execution. Additionally, legitimate users may alter the setting during routine administrative tasks, especially in environments where macros are regularly utilized. Companion detections involving macro executions or related Registry modifications (T1546.001 - Office Application Startup) enhance coverage and improve context for investigations.

