  ### Technical Context

  This rule detects changes to the Windows Event Log service file location by monitoring registry modifications at `\SYSTEM\CurrentControlSet\Services\EventLog\`. The primary behavior being tracked is the tampering of the registry key associated with the event log file, which could indicate an attempt to obscure or misroute log data, hindering forensic analysis and detection capabilities. The likely objective of an attacker is to evade detection by altering log file locations, thereby impairing incident response efforts.

  This detection aligns with the MITRE ATT&CK tactic of Defense Evasion (TA0005) and technique T1685.001 (Event Log Tampering). The primary telemetry source is the Windows registry, with required log types focusing on registry modifications. If malicious, this behavior can severely impact an organization's ability to monitor and respond to security incidents. It is important to note that this detection does NOT confirm malicious intent on its own, as there may be legitimate scenarios for log path modifications.

  ### Investigation Steps

  - **Review the specific registry changes:** Look for registry modifications under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\EventLog\File` using Event ID 4657 for registry key modifications. Verify if changes are to expected paths (e.g., `C:\Windows\System32\winevt\Logs\`). Legitimate changes may occur during system migrations or updates.

  - **Identify context of the change:** Use Event ID 4656 to view what user account made the change and if it aligns with administrative activity. Unauthorized changes made by non-admin accounts are a high-confidence indicator of malicious activity.

  - **Correlate with other security events:** Check for simultaneous security-related events, such as Event ID 5156 (Windows Filtering Platform), to assess if this change correlates with other anomalous behavior (e.g., suspicious outbound connections).

  - **Check task scheduler for suspicious tasks:** Review the Task Scheduler for any new tasks that could correlate with the timeline of the registry modification. Monitor for unusual scheduled tasks that were created or modified, as these could indicate persistence mechanisms.

  - **Assess host role and criticality:** Determine if the affected system has critical roles (e.g., domain controllers) that may attract targeted attacks and prioritize accordingly.

  - **Monitor for exfiltration artifacts:** Validate the existence of logs in the new file location specified post-modification, ensuring that no legitimate log artifacts are being created or exfiltrated, especially in cases of suspicious file I/O operations.

  ### Prioritization

  This alert is of high severity due to the potential impact on the integrity of log data, which is a vital component of incident detection and response. The likelihood of malicious abuse is considerable, as this technique is commonly weaponized by attackers looking to cover their tracks and impede forensic investigations. The critical role of affected systems, particularly if they are involved in security logging, further elevates the urgency of the alert.

  ### Blind Spots and Assumptions

  Detection is limited by potential evasion techniques, such as using legitimate administrative tools or scripts for registry modifications. Reliable detection requires proper logging configurations for registry changes; absence may lead to missed alerts. Legitimate system updates, administrative changes, or software deployments can also trigger this alert, complicating triage. Companion detections, such as monitoring for unusual Windows Service modifications or parent process trees associated with these registry changes, would strengthen coverage and increase confidence in investigations.

