logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Services\EventLog\'
    TargetObject|endswith: '\File'
  filter:
    Details|contains: '\System32\Winevt\Logs\'
  condition: selection and not filter
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies potential tampering with the Windows EventLog service's configuration files, specifically targeting the "file" key within the registry. Such modifications could indicate an attacker’s attempts to manipulate event log settings to obscure their activity, thereby evading detection. By altering the default location of Evtx files, attackers can make it substantially harder for security teams to gather and analyze log data pertinent to their intrusions. This behavior is often seen in advanced persistent threats (APTs) and insider threats aiming to maintain stealth during their operations.

  The relevant MITRE ATT&CK techniques for this detection include Defense Evasion (TA0005) and specifically the technique T1562.002, which relates to Impairing System Logs. Attackers leveraging this technique typically aim to erase or hide their activities from security solutions, making it crucial for defenders to monitor for unauthorized changes in registry keys associated with event logs.

  Primary data sources for effective detection of such tampering include Windows registry change logs, process creation events, and audit logs for any administrative activities that might pertain to the EventLog service or registry modifications.

  ### Investigation Steps
  - **Review Registry Modifications:** Check Windows registry logs, focusing on changes to `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\EventLog\` to identify unauthorized access or modification events.
  - **Analyze Event Logs:** Investigate existing EventLogs for signs of manipulation or deletion, particularly around the time of the detected changes to determine if any relevant entries are missing or appear altered.
  - **Monitor Administrative Activities:** Examine accounts with administrative privileges that made changes to the EventLog service, validating their legitimacy and whether they follow the organization's change management protocols.
  - **Correlate with User Behavior:** Conduct a behavioral analysis of user and system activity leading up to the changes, looking for any unusual patterns that may suggest malicious intent.

  ### Prioritization
  This alert is categorized as high severity due to the significant impact of event log tampering, which directly undermines an organization’s ability to detect and respond to insider threats and external attacks. The likelihood of such activity indicates a sophisticated threat actor is attempting to erase their tracks, necessitating immediate investigation.

  ### Blind Spots and Assumptions
  The detection may have gaps in coverage concerning changes made through legitimate processes such as system updates or software installations that also modify EventLog settings. The detection logic assumes that the targeted registry keys will only be changed by legitimate administrative actions and does not account for potential privileged misuse. Effective alerting relies on ensuring that registry auditing is enabled and functional in the environment, and that logs are retained long enough to capture transient activities related to this threat vector.

