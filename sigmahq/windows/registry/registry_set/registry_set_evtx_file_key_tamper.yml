note: |
  ### Technical Context

  This rule detects attempts to modify the "file" registry key associated with the Windows EventLog service, specifically targeting locations in the registry that change where Event Log files are stored. This behavior is often executed by adversaries to tamper with log integrity, preventing detection of malicious activities by relocating log files to non-default locations or disabling logging entirely. The likely attacker objective is to evade detection by covering their tracks after executing attacks.

  This detection aligns with the MITRE ATT&CK technique "Impair Defenses" (T1562.002), as it seeks to subvert monitoring capabilities. The primary telemetry source for this detection is Windows Registry activity, specifically focused on Logon Events or Registry Event ID 4657 entries that indicate modification of the registry keys for Event Logs. If malicious, such tampering significantly undermines an organization's ability to audit and respond to security events. This rule alone does not confirm that malicious activity occurred; it only signals a potential modification of log storage paths, necessitating further investigation.

  ### Investigation Steps

  - **Examine the registry changes**: Query for registry modifications using Security Event ID 4657 to see if the EventLog "File" path was altered (TargetObject path: `\SYSTEM\CurrentControlSet\Services\EventLog\`). Be on the lookout for paths that deviate from the default location.

  - **Correlate recent activity**: Review the system's audit logs for any unusual processes (Event ID 4688 or Sysmon Event ID 1) that may have executed prior to the registry change, especially any process with escalation of privileges or suspicious timestamps.

  - **Identify legitimate configuration changes**: Check for recent administrative actions or IT operations within the organization that may justify changes to Event Log file locations, ensuring these actions are documented and broadly communicated.

  - **Look for persistence mechanisms**: Investigate for any newly created services or scheduled tasks (Event ID 4697 for service creation) within the timeframe of the registry changes indicating potential malicious intent to maintain access.

  - **Validate log integrity**: Confirm the current status of Event Log files and their accessibility. Check for any anomalies in the number of events recorded or altered timestamps in Event Viewer.

  ### Prioritization

  The severity of this alert is high, given that the affected system is likely critical for logging security-related activities. The likelihood of malicious abuse is substantial, as modifying Event Log file locations is a common technique utilized by adversaries to evade detection. This behavior is frequently weaponized during post-exploitation phases of an attack.

  ### Blind Spots and Assumptions

  Potential limitations stem from the possibility that legitimate changes are made during system maintenance, which could trigger the alert. Ensuring comprehensive logging configurations, particularly for registry activities, is crucial for reliable detection. Additionally, related detections, such as monitoring for abnormal process creation or suspicious service registrations, can bolster defense against tampering attempts.

