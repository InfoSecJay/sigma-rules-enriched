note: |
  ### Technical Context

  This Sigma rule detects changes to the Windows Registry specifically targeting new configurations for BgInfo.EXE. The behavior indicates potential persistence mechanisms, as an attacker may modify registry values to execute malicious VBScript whenever BgInfo runs. This is aligned with the MITRE ATT&CK technique "Modify Registry" (T1112) under the persistence and defense evasion tactics.

  The primary telemetry sources for this detection are Windows registry change logs, focusing on operations that create or modify keys in the specified path. If malicious, this activity could lead to unauthorized code execution or script-based attacks. However, this detection does NOT confirm that the change is inherently malicious, as legitimate administrative actions or configuration changes may also trigger the alert.

  ### Investigation Steps

  - **Identify the registry change:** Check Windows Registry under `HKEY_CURRENT_USER\Software\Winternals\BGInfo\UserFields\` for the newly created or modified entries. Note the timestamp and the user account that made the modification for contextual clues.

  - **Review associated processes:** Look for any new process creations linked to BgInfo.EXE by analyzing Security Event ID 4688 or Sysmon Event ID 1. Ensure the related timestamps align with the registry change.

  - **Validate script execution:** Investigate for any VBScript execution associated with the registry modification by checking for events such as WMI executions (Event ID 4688) or VBScript logs indicating unexpected or malicious script runs.

  - **Assess legitimate usage patterns:** Confirm if the modification was performed by a known system administrator or any approved software deployment. Compare the modification to baseline configurations.

  - **Identify malicious indicators:** Look for unusual WMI activity or network requests made right after the registry change, which could indicate an attempt to execute malicious payloads via the modified BgInfo.EXE configuration.

  - **Check for related detections:** Correlate findings with similar detections (e.g., event ID from the companion detection) to identify patterns that could indicate coordinated malicious behavior.

  ### Prioritization

  This alert should be treated with medium severity. The potential impact is significant if the target system has administrative access or critical business functions. The likelihood of malicious abuse is moderate, as techniques involving BgInfo for persistence have been weaponized in the past.

  ### Blind Spots and Assumptions

  One limitation is that legitimate updates to BgInfo can lead to false positives, especially in environments where system configurations are frequently changed. Reliable detection requires configured logs from registry changes and appropriate auditing settings. Additionally, benign activities like routine updates may also trigger this alert. A related detection to consider is monitoring for unusual process creations (event ID 4688) following registry changes, which strengthens the assessment of this potential threat.

