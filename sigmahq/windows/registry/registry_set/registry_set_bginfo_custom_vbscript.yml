note: |
  ### Technical Context

  This rule detects the creation or modification of registry keys under the `\Software\Winternals\BGInfo\UserFields\` path, which can lead to executing a custom VBScript through BgInfo.exe. Attackers may utilize this technique to establish persistence on compromised systems, enabling them to execute malicious scripts whenever BgInfo runs, typically at user logon or when command prompts are opened. This aligns with the MITRE ATT&CK tactic for Persistence (T1112) and Defense Evasion.

  Primary telemetry sources include Windows Registry changes, specifically monitoring the Registry event logs. If this behavior is malicious, it could lead to unauthorized script execution, data exfiltration, or further exploitation of system vulnerabilities. It is important to note that this detection does NOT confirm the execution of malicious code on its own.

  ### Investigation Steps

  - **Check Registry Changes**: Review Windows Registry logs (Event ID 4657) for recent modifications to the key `\Software\Winternals\BGInfo\UserFields\`. Look for suspicious entries or unusual strings in the `Details` field.

  - **Identify Recent BgInfo Executions**: Investigate Windows Process Creation logs (Event ID 4688) for any instances of `BgInfo.exe` recently executed. Confirm the execution path and check the command-line arguments for signs of scripted activities.

  - **Analyze Script Content**: If a custom VBScript is found or referenced, analyze its contents for obfuscated code or commands indicative of malicious activity, such as file downloads, system modifications, or remote communication attempts.

  - **Look for Benign Usage**: Determine if there are legitimate uses of BgInfo by comparing against known good baselines in the environment. Document normal registry entries or VBScript usage patterns that align with organizational practices.

  - **Check User Context**: If the modification was made by a non-administrative user account, consider this a higher risk. Review the user behavior for anomalous actions or elevated access rights that could indicate compromise.

  ### Prioritization

  This alert holds medium severity in an enterprise environment due to the potential security implications of unauthorized script execution and persistence methods. The likelihood of malicious abuse is moderate, as this technique can be aligned with post-exploitation activities. However, similar benign usage in some environments may result in false positives.

  ### Blind Spots and Assumptions

  Detection is limited by the ability to correctly log and monitor all Registry modifications; some logging configurations may not capture scripted changes effectively. Legitimate activity may occur with custom scripts utilized by IT departments or for system monitoring, leading to potential false positives. A related detection to strengthen coverage could monitor for established connections from BgInfo.exe processes, indicating possible exfiltration or command and control communications.

