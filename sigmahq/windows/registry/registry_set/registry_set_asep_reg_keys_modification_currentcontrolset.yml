title: CurrentControlSet Autorun Keys Modification
id: f674e36a-4b91-431e-8aef-f8a96c2aca35
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: Detects modification of autostart extensibility point (ASEP) in 
  registry.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur 
  Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  system_control_base:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Control'
  system_control_keys:
    TargetObject|contains:
    - '\Terminal Server\WinStations\RDP-Tcp\InitialProgram'
    - '\Terminal Server\Wds\rdpwd\StartupPrograms'
    - '\SecurityProviders\SecurityProviders'
    - '\SafeBoot\AlternateShell'
    - '\Print\Providers'
    - '\Print\Monitors'
    - '\NetworkProvider\Order'
    - '\Lsa\Notification Packages'
    - '\Lsa\Authentication Packages'
    - '\BootVerificationProgram\ImagePath'
  filter_empty:
    Details: '(Empty)'
  filter_cutepdf:
    Image: 'C:\Windows\System32\spoolsv.exe'
    TargetObject|contains: '\Print\Monitors\CutePDF Writer Monitor'
    Details:
    - 'cpwmon64_v40.dll'
    - 'CutePDF Writer'
  filter_onenote:
    Image: C:\Windows\System32\spoolsv.exe
    TargetObject|contains: 'Print\Monitors\Appmon\Ports\Microsoft.Office.OneNote_'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
    TargetObject|endswith: '\NetworkProvider\Order\ProviderOrder'
  filter_realvnc:
    Image: 'C:\Windows\System32\spoolsv.exe'
    TargetObject|endswith: '\Print\Monitors\MONVNC\Driver'
    Details: 'VNCpm.dll'
  condition: all of system_control_* and not 1 of filter_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to autostart extensibility points (ASEPs) in the Windows registry, specifically targeting the CurrentControlSet. Such modifications can indicate an attempt by an attacker to establish persistence by manipulating autorun entries, which relates directly to lateral movement tactics. The likely attacker objective is to maintain access to a system after initial exploitation, often done through malware or scripts that execute upon system startup. This behavior aligns with the MITRE ATT&CK tactic of Persistence (TA0003) and the technique of Boot or Logon Autostart Execution (T1547.001).

  Primary telemetry sources for this detection include Windows registry modifications, specifically logs indicating changes at the path `\SYSTEM\CurrentControlSet\Control`. If an attacker is successful, there could be significant security implications, including unauthorized execution of malicious code upon system boot or user login. Importantly, this detection alone does not confirm malicious intent as legitimate software installations and administrative configurations also modify these registry keys.

  ### Investigation Steps

  - **Review registry changes for suspicious paths:** Check Windows Security Event ID 4657 for any modifications under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control` that do not correlate with known software packages or expected administrative behavior.

  - **Validate autostart programs with context:** Compare detected registry modifications with legitimate autorun keys established during software installations. Use Sysinternals Autoruns tool to identify what is autostarting and ensure none of these programs are unfamiliar.

  - **Identify specific high-risk alterations:** Look for manipulations around terminal services and print services, specifically keys like `\Terminal Server\WinStations\RDP-Tcp\InitialProgram`, which could indicate preparation for remote access tools.

  - **Check for associated user activity:** Examine Event ID 4663 logs for file accesses that comprise the modified keys, correlating timestamps to determine if suspicious or anomalous accounts are involved in these actions.

  - **Correlate malware hashes with detected alterations:** If registry changes specify DLLs or executables, cross-reference these with threat intelligence feeds to assess if they are linked to known malware (e.g., `VNCpm.dll` for remote access).

  - **Document legitimate changes for risk assessment:** Log entries made by trusted administrative accounts that set up known software needs to be clearly distinguished from unauthorized changes listed in registry modification logs to mitigate false positives.

  ### Prioritization

  This alert is considered medium severity due to its potential to facilitate persistent threats within critical systems. Given the high likelihood that such behaviors are weaponized in exploits, especially when targeting systems with elevated privileges, strong investigative action is warranted.

  ### Blind Spots and Assumptions

  Detection may be limited by the presence of legitimate software that alters autorun settings, potentially resulting in false positives. It's crucial to ensure full auditing of registry modifications is enabled and active to capture all relevant changes effectively. Additionally, administrators performing legitimate updates or maintenance may trigger this alert. A companion detection to strengthen coverage could involve monitoring for suspicious process creation linked to changes (Sysmon Event ID 1 for new process creation potentially related to the modified keys).

