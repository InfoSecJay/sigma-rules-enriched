title: CurrentControlSet Autorun Keys Modification
id: f674e36a-4b91-431e-8aef-f8a96c2aca35
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: Detects modification of autostart extensibility point (ASEP) in registry.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin,
  oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  system_control_base:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Control'
  system_control_keys:
    TargetObject|contains:
    - '\Terminal Server\WinStations\RDP-Tcp\InitialProgram'
    - '\Terminal Server\Wds\rdpwd\StartupPrograms'
    - '\SecurityProviders\SecurityProviders'
    - '\SafeBoot\AlternateShell'
    - '\Print\Providers'
    - '\Print\Monitors'
    - '\NetworkProvider\Order'
    - '\Lsa\Notification Packages'
    - '\Lsa\Authentication Packages'
    - '\BootVerificationProgram\ImagePath'
  filter_empty:
    Details: '(Empty)'
  filter_cutepdf:
    Image: 'C:\Windows\System32\spoolsv.exe'
    TargetObject|contains: '\Print\Monitors\CutePDF Writer Monitor'
    Details:
    - 'cpwmon64_v40.dll'
    - 'CutePDF Writer'
  filter_onenote:
    Image: C:\Windows\System32\spoolsv.exe
    TargetObject|contains: 'Print\Monitors\Appmon\Ports\Microsoft.Office.OneNote_'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
    TargetObject|endswith: '\NetworkProvider\Order\ProviderOrder'
  filter_realvnc:
    Image: 'C:\Windows\System32\spoolsv.exe'
    TargetObject|endswith: '\Print\Monitors\MONVNC\Driver'
    Details: 'VNCpm.dll'
  condition: all of system_control_* and not 1 of filter_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to the autostart extensibility points (ASEPs) within the Windows registry, particularly focusing on the `CurrentControlSet`. Changes in these keys can indicate attempts to establish persistence mechanisms by malicious actors. In a typical attack scenario, an adversary might utilize techniques to persist malware or tools across system reboots, enabling continued access to the compromised system. These actions align with privilege escalation and persistence tactics, as defined in the MITRE ATT&CK framework.

  Relevant MITRE ATT&CK techniques include:
  - **T1547.001**: Boot or Logon Autostart Execution: Registry Run Keys/Startup Folder
  - **T1060**: Registry Run Keys / Startup Folder

  Primary data sources for this detection include Windows registry set logs, which capture when registry modifications occur. Monitoring these changes is essential in identifying unauthorized adjustments that could signify an integrity breach.

  ### Investigation Steps
  - **Review Registry Changes**: Examine the registry activities specifically around the keys mentioned in the rule to identify any unauthorized modifications. Pay special attention to entries related to persistence techniques.
  - **Analyze Process Creation Events**: Correlate the identified registry changes with process creation events to determine if suspicious executables were triggered as a result of the new autorun configuration.
  - **Check for Anomalies in User Activity**: Investigate recent user actions on the affected system for unusual behavior that could indicate exploitation or misconfiguration related to autorun keys.
  - **Identify Legitimate vs. Malicious Software**: Differentiate between known legitimate software modifications and suspicious changes. This may require cross-referencing with a list of known trustworthy applications commonly found in the environment.

  ### Prioritization
  This alert should be considered medium priority due to the potential for significant impact if an attacker successfully establishes persistence on compromised systems, while also acknowledging that there may be benign explanations for certain autorun changes.

  ### Blind Spots and Assumptions
  This detection logic may not cover all potential persistence mechanisms, particularly if they utilize less common registry locations or alternative methods outside the scoped keys. The alert assumes that all legitimate software installations adhere to standard practices and do not typically modify the specified keys for nefarious purposes. Required log collection includes detailed auditing of Windows registry modifications and sufficient retention settings to allow for historical analysis.

