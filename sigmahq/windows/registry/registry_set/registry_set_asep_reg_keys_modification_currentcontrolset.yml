title: CurrentControlSet Autorun Keys Modification
id: f674e36a-4b91-431e-8aef-f8a96c2aca35
related:
- id: 17f878b8-9968-4578-b814-c4217fc5768c
  type: obsolete
status: test
description: Detects modification of autostart extensibility point (ASEP) in 
  registry.
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
- https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
- https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d     # a list with registry keys
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur 
  Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
date: 2019-10-25
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  system_control_base:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Control'
  system_control_keys:
    TargetObject|contains:
    - '\Terminal Server\WinStations\RDP-Tcp\InitialProgram'
    - '\Terminal Server\Wds\rdpwd\StartupPrograms'
    - '\SecurityProviders\SecurityProviders'
    - '\SafeBoot\AlternateShell'
    - '\Print\Providers'
    - '\Print\Monitors'
    - '\NetworkProvider\Order'
    - '\Lsa\Notification Packages'
    - '\Lsa\Authentication Packages'
    - '\BootVerificationProgram\ImagePath'
  filter_empty:
    Details: '(Empty)'
  filter_cutepdf:
    Image: 'C:\Windows\System32\spoolsv.exe'
    TargetObject|contains: '\Print\Monitors\CutePDF Writer Monitor'
    Details:
    - 'cpwmon64_v40.dll'
    - 'CutePDF Writer'
  filter_onenote:
    Image: C:\Windows\System32\spoolsv.exe
    TargetObject|contains: 'Print\Monitors\Appmon\Ports\Microsoft.Office.OneNote_'
    User|contains:     # covers many language settings
    - 'AUTHORI'
    - 'AUTORI'
  filter_poqexec:
    Image: 'C:\Windows\System32\poqexec.exe'
    TargetObject|endswith: '\NetworkProvider\Order\ProviderOrder'
  filter_realvnc:
    Image: 'C:\Windows\System32\spoolsv.exe'
    TargetObject|endswith: '\Print\Monitors\MONVNC\Driver'
    Details: 'VNCpm.dll'
  condition: all of system_control_* and not 1 of filter_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
regression_tests_path: 
  regression_data/rules/windows/registry/registry_set/registry_set_asep_reg_keys_modification_currentcontrolset/info.yml
note: |
  ### Technical Context

  This Sigma rule detects modifications to auto-start registry keys within the Windows registry, specifically targeting the `CurrentControlSet` section. Such behavior typically indicates that an attacker is attempting to maintain persistence on the compromised host by manipulating registry settings to ensure malicious software executes at system startup. The relevant MITRE ATT&CK techniques include "Registry Run Keys / Startup Folder" (T1547.001).

  The primary telemetry source for this detection is Windows Registry access logs, particularly monitoring changes in specific registry paths indicating execution settings. If malicious, the changes can lead to unauthorized software running on the system upon boot, facilitating further exploitation or data exfiltration. It is crucial to understand that this detection alone does not confirm compromise; benign modifications may also trigger the rule.

  ### Investigation Steps

  - **Review specific registry modification events:** Check for Windows Security Event ID 4657 to identify the modified registry keys. Focus on entries correlating to autorun keys within paths like `\SYSTEM\CurrentControlSet\Control\` and verify if changes match the criteria outlined in the detection.

  - **Correlate logs with process creation events:** Monitor Sysmon Event ID 1 to identify processes that were spawned after registry changes. Look for unexpected binaries starting up, specifically those that are not part of the base image.

  - **Identify legitimate behavior:** Validate administrator changes in customer configurations. For instance, check for known tools, like “Microsoft.Office.OneNote,” legally appearing within registry settings if changes coincide with expected administrative activity.

  - **Examine user context details:** Investigate which user account made the changes through logged Event ID 4657 or similar logs. Determine if the activity comes from a recognized user or a privileged account acting under unusual circumstances.

  - **Look for high-confidence malicious indicators:** Check if any modifications reference suspicious executables or known malicious DLLs (e.g., 'cpwmon64_v40.dll') related to unauthorized software like CutePDF, flagged in the detection filters.

  - **Assess for potential lateral movement tools:** Review any changes to the keys associated with VNC or other remote access software. Determine whether their presence is justified or if it indicates unauthorized access into the environment.

  ### Prioritization

  This alert should be considered medium priority due to the potential for persistence mechanisms being established within the affected host, which could be exploited for further attacks. The likelihood of malicious use is significant, as attackers commonly employ this technique to maintain access, making it a targeted area for investigation.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate applications modifying autorun keys without nefarious intent. High-confidence log sources, such as detailed SYSLOG or Event Logs must be consistently collected to ensure oversight. Legitimate software installations and administrator configurations may inadvertently trigger this alert, complicating investigations. Related detections, like monitoring for unusual process behaviors or file signatures (e.g., Sysmon events), can provide complementary data and improve overall visibility into potentially malicious activity.

