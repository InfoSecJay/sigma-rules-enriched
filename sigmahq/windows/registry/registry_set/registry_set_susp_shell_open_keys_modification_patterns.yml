title: Suspicious Shell Open Command Registry Modification
id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
status: experimental
description: |
  Detects modifications to shell open registry keys that point to suspicious locations typically used by malware for persistence.
  Generally, modifications to the `*\shell\open\command` registry key can indicate an attempt to change the default action for opening files,
  and various UAC bypass or persistence techniques involve modifying these keys to execute malicious scripts or binaries.
references:
- https://www.trendmicro.com/en_us/research/25/f/water-curse.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.persistence
- attack.t1548.002
- attack.t1546.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\shell\open\command\'
    Details|contains:
    - '\$Recycle.Bin\'
    - '\AppData\Local\Temp\'
    - '\Contacts\'
    - '\Music\'
    - '\PerfLogs\'
    - '\Photos\'
    - '\Pictures\'
    - '\Users\Public\'
    - '\Videos\'
    - '\Windows\Temp\'
    - '%AppData%'
    - '%LocalAppData%'
    - '%Temp%'
    - '%tmp%'
  condition: selection
falsepositives:
- Legitimate software installations or updates that modify the shell open command
  registry keys to these locations.
level: medium
note: |
  ### Technical Context
  This rule detects modifications to the Windows registry keys associated with the open command for file types, specifically those pointing to suspicious directories commonly exploited by malware for persistence. Attackers aiming to maintain a foothold on a compromised machine often modify these keys in order to redirect legitimate file opening processes to malicious scripts or executables. Therefore, any unauthorized changes to the `*\shell\open\command` registry path are red flags that warrant immediate investigation.

  The threat scenario typically involves an adversary utilizing techniques associated with persistence (T1548.002) or defense evasion (T1546.001), wherein they manipulate registry settings to create a backdoor. This modification can lead to unauthorized privilege escalation and sustained access to sensitive systems. By understanding the potential modifications these keys may undergo, defenders can better identify attempts by attackers to manipulate legitimate system functions for malicious purposes.

  Relevant MITRE ATT&CK tactics include:
  - **Persistence** (T1548.002): Unauthorized changes to registry keys to ensure malware execution upon file access.
  - **Defense Evasion** (T1546.001): Altering the normal behavior of file opening commands to execute malicious actions without detection.

  Primary data sources that will provide evidence supporting this detection include Windows registry modification logs, specifically looking at the `registry_set` logs within the Windows Operating System.

  ### Investigation Steps
  - **Review Registry Modification Logs:** Check `registry_set` logs to identify any recent modifications to the `*\shell\open\command` registry keys. Pay attention to entries that point to unusual file paths.

  - **Analyze Suspicious Paths:** Investigate changes that direct execution to common user directories like `%AppData%`, `\$Recycle.Bin`, or temporary directories. These paths are often indicative of malicious persistence mechanisms.

  - **Correlate with Process Creation Events:** Cross-reference the modified registry keys with Windows process creation events to see if any suspicious processes were spawned as a result of the changes.

  - **Conduct a User Activity Audit:** Review user activities leading to the registry changes, including logons and file accesses, to identify any unauthorized or anomalous behavior associated with the user accounts involved.

  ### Prioritization
  The alert's severity is medium due to the potential impact of persistent malware on enterprise environments, where unauthorized modifications can lead to loss of data integrity and confidentiality. Given the likelihood of exploitation, especially in organizations with valuable information, these modifications should be taken seriously.

  ### Blind Spots and Assumptions
  One potential gap in detection coverage exists if legitimate software updates or installations make similar registry modifications, which could lead to false positives. This detection rule assumes that any modification to the specified registry keys is unwanted, which may not always hold true. For the alert to function effectively, comprehensive logging of registry changes must be enabled on Windows systems; otherwise, missed events could hinder response efforts.

