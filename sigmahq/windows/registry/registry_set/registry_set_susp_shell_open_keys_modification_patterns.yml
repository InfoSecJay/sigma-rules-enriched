title: Suspicious Shell Open Command Registry Modification
id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
status: experimental
description: |
  Detects modifications to shell open registry keys that point to suspicious locations typically used by malware for persistence.
  Generally, modifications to the `*\shell\open\command` registry key can indicate an attempt to change the default action for opening files,
  and various UAC bypass or persistence techniques involve modifying these keys to execute malicious scripts or binaries.
references:
- https://www.trendmicro.com/en_us/research/25/f/water-curse.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
tags:
- attack.defense-evasion
- attack.privilege-escalation
- attack.persistence
- attack.t1548.002
- attack.t1546.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\shell\open\command\'
    Details|contains:
    - '\$Recycle.Bin\'
    - '\AppData\Local\Temp\'
    - '\Contacts\'
    - '\Music\'
    - '\PerfLogs\'
    - '\Photos\'
    - '\Pictures\'
    - '\Users\Public\'
    - '\Videos\'
    - '\Windows\Temp\'
    - '%AppData%'
    - '%LocalAppData%'
    - '%Temp%'
    - '%tmp%'
  condition: selection
falsepositives:
- Legitimate software installations or updates that modify the shell open 
  command registry keys to these locations.
level: medium
note: |
  ### Technical Context

  This rule detects unauthorized modifications to the Windows registry, specifically targeting `*\shell\open\command` keys that redirect file opening commands to suspicious directories often exploited by malware (e.g., `$Recycle.Bin`, `AppData\Local\Temp`). The likely attacker objective is to establish persistence or to bypass User Account Control (UAC) by hijacking file associations to execute malicious payloads. This behavior falls under the MITRE ATT&CK framework, specifically T1548.002 (Abuse Elevation Control Mechanism: Bypass User Account Control) and T1546.001 (Event Triggered Execution: Authenticode Policies). The primary telemetry sources include Windows registry change logs (Event ID 4657) and processes involved in the modification, which can be captured using Sysmon (Event ID 13). If the modifications are indeed malicious, they can open pathways for persistent malware execution, system compromise, or data exfiltration. Importantly, this detection alone does not confirm that malicious activity has occurred; valid software updates or legitimate configurations can also invoke such registry changes.

  ### Investigation Steps

  - **Review registry modification details:** Check Windows Event ID 4657 for entries reflecting changes to registry keys under `*\shell\open\command`. Look for values that point to unusual paths like `%AppData%` or `$Recycle.Bin`.

  - **Analyze process execution context:** Investigate Sysmon Event ID 13 logs to identify which processes are making the registry modifications. Crucial indicators include unusual parent processes or unexpected executables attempting these changes.

  - **Identify benign software behaviors:** Document and confirm if any legitimate applications or recent updates may have legitimately modified these keys. Review the change history around the time of the modification to ascertain whether it corresponds with known application installations.

  - **Correlate with known malware signatures:** Maintain a reference of common malicious indicators (e.g., frequently misused file paths) to cross-check against the modified registry values for high-confidence malicious indicators.

  - **Assess impacted system criticality:** Determine the role and criticality of the affected host. If it’s a domain controller or critical server, prioritize immediate follow-up, as it may indicate higher-risk activity.

  - **Verify artifact creation or file execution:** Check the targeted locations for any file creations or unexpected script executions that might correspond with the new registry settings. Look for unusual file extensions or recently modified timestamps.

  ### Prioritization

  The alert severity is medium due to the potential impact of affected systems being compromised through persistence mechanisms. Modifying registry keys for file execution is a commonly abused tactic, and while not all modifications are malicious, they warrant investigation to rule out exploitation.

  ### Blind Spots and Assumptions

  This rule has limitations, as legitimate software installs can also trigger such registry changes, posing a risk of false positives. Required log sources include enabled auditing for registry changes and installation event logs. Additionally, common administrative tasks or configurations may inadvertently match the rule. A related detection that strengthens coverage would be monitoring for any unusual process creations in common persistence directories, linking to potential exploitation attempts.

