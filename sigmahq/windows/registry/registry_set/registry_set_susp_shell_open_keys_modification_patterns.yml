title: Suspicious Shell Open Command Registry Modification
id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
status: experimental
description: |
  Detects modifications to shell open registry keys that point to suspicious locations typically used by malware for persistence.
  Generally, modifications to the `*\shell\open\command` registry key can indicate an attempt to change the default action for opening files,
  and various UAC bypass or persistence techniques involve modifying these keys to execute malicious scripts or binaries.
references:
- https://www.trendmicro.com/en_us/research/25/f/water-curse.html
author: Swachchhanda Shrawan Poudel (Nextron Systems)
date: 2026-01-24
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1548.002
- attack.t1546.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\shell\open\command\'
    Details|contains:
    - '\$Recycle.Bin\'
    - '\AppData\Local\Temp\'
    - '\Contacts\'
    - '\Music\'
    - '\PerfLogs\'
    - '\Photos\'
    - '\Pictures\'
    - '\Users\Public\'
    - '\Videos\'
    - '\Windows\Temp\'
    - '%AppData%'
    - '%LocalAppData%'
    - '%Temp%'
    - '%tmp%'
  condition: selection
falsepositives:
- Legitimate software installations or updates that modify the shell open 
  command registry keys to these locations.
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to Windows registry keys under `*\shell\open\command\` that point to suspicious locations often associated with malware persistence and UAC bypass techniques. The likely attacker objective is to alter the default action for file opening, allowing malicious scripts or binaries to execute when a user interacts with certain files. This behavior aligns with the MITRE ATT&CK tactics of Persistence (TA0003) and Privilege Escalation (TA0004), specifically the techniques T1548.002 and T1546.001.

  The primary telemetry sources include Windows registry modification logs, specifically events capturing changes made to registry keys. If this behavior is confirmed malicious, it could lead to unauthorized command executions, privilege escalations, or malware persistence. Importantly, this detection does NOT confirm that an attack is occurring on its own; it signifies that a suspicious modification has taken place that requires further investigation.

  ### Investigation Steps

  - **Review recent registry changes:** Check Windows Security Event IDs 4663 that log access and modifications to keys. Look for modifications under `HKEY_CLASSES_ROOT\*\shell\open\command\` targeting locations like `\AppData\Local\Temp\` or `\$Recycle.Bin\`. These are high-confidence indicators of malicious behavior.

  - **Identify the modifying user account:** Query Event ID 4672 (Special privileges assigned) or 4624 (Logon) to determine which user account made the registry changes. Legitimate system processes or known administrative accounts could signify benign behavior.

  - **Validate the legitimacy of target paths:** Ensure that the modified registry paths are not associated with expected applications or processes. For instance, modifications that point to paths like `\Users\Public\` or `%AppData%` may indicate developer tools or legitimate software features, while unusual command paths likely indicate malicious intent.

  - **Monitor for follow-on behavior:** Check for related processes triggered by the modification using Sysmon Event ID 1 (Process Creation). Look for processes spawning from or relating to the modified registry keys that have unusual command-line parameters, as this could indicate exploitation.

  - **Correlate with threat intelligence:** Use threat intelligence services to check if the paths targeted have been reported as associated with known malware. Cross-reference with the MITRE ATT&CK framework for current tactics being utilized in the wild.

  ### Prioritization

  This alert should be classified as medium severity, given that unauthorized modifications to registry keys can lead to significant system compromise, especially in high-value assets. The likelihood of malicious abuse is considerable, particularly as such modifications are often weaponized for persistence and privilege escalation in active attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of log data; if Windows registry auditing isn't enabled, modifications won't be recorded. Legitimate software installations or updates could trigger this alert, especially those that modify default file handling settings. Additionally, companion detections linked to process execution (e.g., Sysmon Event ID 1) may strengthen context and provide a clearer picture of whether the registry modification is benign or malicious.

