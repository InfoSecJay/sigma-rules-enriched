  product: windows
detection:
  selection:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Control\LsaExtensionConfig\LsaSrv\Extensions'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context

  This rule detects modifications to the registry key `\SYSTEM\CurrentControlSet\Control\LsaExtensionConfig\LsaSrv\Extensions`, where attackers can insert custom DLLs to persist within the Local Security Authority Subsystem Service (LSASS). The likely objective is to maintain long-term access to a system while hiding their presence, facilitating ongoing data theft or other malicious activities. This behavior aligns with the MITRE ATT&CK tactic "Persistence" and the technique "Lateral Movement: LSA Extensions" (T1218.010).

  The primary telemetry sources are Windows registry modification logs, specifically events related to changes in the registry. If modified entries are malicious, they pose a significant security risk, enabling an adversary to run malicious code with system privileges whenever LSASS initializes. This detection does NOT confirm whether the inserted DLL is malicious; further investigation is needed to analyze the DLL's behavior and source.

  ### Investigation Steps

  - **Inspect registry modifications**: Review System Event Log (Event ID 4663) for access to the registry key `\SYSTEM\CurrentControlSet\Control\LsaExtensionConfig\LsaSrv\Extensions`. Pay attention to the user account making the change. Unusual accounts (non-admin) making changes may indicate malicious activity.

  - **Identify modified extensions**: Check the new values for the "Extensions" key using the Registry Editor or `reg query` command. Legitimate values should be known system DLLs; any unfamiliar DLLs should be investigated further.

  - **Analyze DLLs**: For any newly added DLLs, verify their file paths and signatures. Use a tool like Sigcheck to confirm legitimacy. Be wary of files in unusual directories (e.g., `%temp%` or custom directories).

  - **Correlate with LSA service**: Monitor Service Control Manager logs (Event ID 7045) for any suspicious service entries related to LSASS. Ensure that no unauthorized services are interacting with LSASS post-modification.

  - **Review user activities**: Examine Security Event Log (Event ID 4624) for successful logins near the time of the registry modification, identifying the caller and the timing. Normal administrative tasks may justify the change if corroborated by other legitimate activities.

  - **Check endpoint behavior**: Inspect the running processes with Sysmon (Event ID 1) for any instances of the modified DLL being loaded. If observed, analyze the process details and behavior to determine if it's part of a known malware pattern.

  ### Prioritization

  This alert is considered high severity given the critical role of LSASS in the Windows security model. The likelihood of malicious abuse is significant, as modifications to this registry key are commonly leveraged to achieve persistence. Such behavior is typically weaponized in advanced attacks, making it a priority for investigation.

  ### Blind Spots and Assumptions

  Detection may be limited by the absence of specific registry auditing configurations, which need to be enabled for reliable detection. Attackers can use evasion techniques such as modifying permissions or using known legitimate DLLs to mask activities. Legitimate applications altering LSA extensions can occur, but these should be rare and tied to administrative or support activities. Related detections for potentially increased coverage include monitoring changes to other critical registry keys associated with persistence (e.g., startup keys).

