logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Control\LsaExtensionConfig\LsaSrv\Extensions'
  condition: selection
falsepositives:
- Unlikely
level: high
note: |
  ### Technical Context
  This rule detects modifications to the Windows registry, specifically targeting the "Extensions" value under the LSA (Local Security Authority) configuration. An attacker may manipulate this value to include a custom Dynamic Link Library (DLL) that allows them to execute payloads within the context of the LSASS (Local Security Authority Subsystem Service) process. The primary threat scenario involves persistence mechanisms, where adversaries seek to maintain access to a compromised system by ensuring their malicious code is executed each time LSASS starts.

  Attackers leveraging this technique often aim to extract sensitive credentials or maintain presence on systems even after reboots or administrative actions. This behavior is associated with the MITRE ATT&CK framework's Persistence tactic, particularly with the technique for LSA Secrets (T1091). Effective data sources for detecting this behavior include Windows registry access logs, which can reveal unauthorized changes to LSA configurations.

  ### Investigation Steps
  - **Review Registry Logs:** Examine registry modification logs focusing on the "Extensions" value within the `\SYSTEM\CurrentControlSet\Control\LsaExtensionConfig\LsaSrv` path for any unusual additions or changes.
  - **Correlate Process Activity:** Analyze process creation events around the time of the registry modification to identify any suspicious processes starting or interacting with `lsass.exe`.
  - **Check for Known Malicious DLLs:** Cross-reference the DLLs found in the "Extensions" value against threat intelligence feeds or lists of known malicious extensions to identify potential threats.
  - **Assess Privilege Changes:** Investigate any recent privilege escalation attempts within the system that may correlate with an operator's attempt to establish persistence through LSA modifications.

  ### Prioritization
  Given the high severity designation, this alert indicates potential malicious activity aligned with persistence techniques. The ability to maintain access through LSASS significantly elevates the risk of credential theft and further compromise in the environment.

  ### Blind Spots and Assumptions
  The primary gap in detection may arise from the reliance on registry logging; if such logs are not being captured or are disabled, this detection would be ineffective. It assumes that the modifications are made directly and that no legitimate administrative activities cause similar registry changes. Sufficient logging capabilities must be enabled to capture all relevant registry activities to ensure accurate detection of this persistence method.

