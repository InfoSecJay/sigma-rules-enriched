note: |
  ### Technical Context

  This rule detects the addition of new root, certificate authority (CA), or AuthRoot certificates to the Windows registry. Attackers often achieve persistence and impersonation by injecting malicious certificates, enabling man-in-the-middle (MitM) attacks or facilitating the execution of malicious code that appears legitimate. The relevant MITRE ATT&CK tactic is "Impact" (TA0040) and the technique is "Trusted Relationship" (T1553.004).

  Primary telemetry sources include Windows registry change logs, specifically focusing on modifications to keys within the `HKEY_CURRENT_USER\SOFTWARE\Microsoft\SystemCertificates`, `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\SystemCertificates`, and their respective Policies or Enterprise directories. The security impact of a malicious certificate injection can be significant, potentially allowing unauthorized access or data interception. However, it is essential to note that this detection alone does not confirm malicious intent; legitimate certificate installations can also trigger this alert.

  ### Investigation Steps

  - **Validate the registry change:** Confirm whether the addition is to `HKEY_CURRENT_USER\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates` or similar paths using Windows Event ID 4657 (Registry Value Modified). Look for unexpected certificates being added or replacing existing ones.

  - **Review certificate details:** Examine the certificates added to the registry, especially the issuer and expiration dates. Check for non-reputable issuers or certificates that do not match organizational standards. Use tools like `certutil` to inspect the certificate details.

  - **Identify common legitimate activity:** Understand the usual process for adding trusted certificates in your organization, such as via Group Policy or during legitimate software installations. Review changes initiated during scheduled maintenance windows.

  - **Query User Account Control (UAC) events:** Check for any events tied to Event ID 4688 (Process Creation) where malicious applications called system utilities or commands to modify the certificate store. Look for anomalies in the command line parameters used.

  - **Correlate with known attack patterns:** Check if the alert coincides with other related alerts, such as abnormal network activity or unauthorized access attempts (Event ID 4625), which may indicate an attack attempting to leverage the newly added certificates.

  ### Prioritization

  This alert is of medium severity due to the potential impact of the system being compromised through the use of malicious certificates. While the likelihood of malicious activity varies, the technique is often weaponized by adversaries to enable further attacks. Therefore, timely investigation is essential.

  ### Blind Spots and Assumptions

  This detection may not catch all malicious certificate installations, especially if evasion techniques like using legitimate tools or scripts are employed. It relies on proper registry logging configurations being in place. Legitimate certificate updates from authorized software or policies could also trigger false positives. A related detection to consider is monitoring for unusual outbound connections post-certificate addition, which could indicate malicious use of the installed certificates.

