note: |
  ### Technical Context

  This rule detects the addition of new root, Certificate Authority (CA), or AuthRoot certificates to the Windows registry, specifically targeting areas known to manage trusted certificates. The potential objective of an attacker utilizing this behavior is to establish trust for malicious software by creating a trusted certificate, thereby enabling code signing or facilitating man-in-the-middle attacks. The relevant MITRE ATT&CK technique is T1553.004: "Add Root Certificate to Current User Certificate Store".

  The primary telemetry sources are Windows Registry events, specifically modifications in paths associated with root and CA certificates. Malicious additions of trust certificates could lead to unauthorized access or control over secure communications if exploited. However, this detection alone does not verify whether the certificate addition is maliciousness, as legitimate software installations or configurations may trigger similar alerts.

  ### Investigation Steps

  - **Review Certificate Registry Modifications:**
    Check the Windows Registry for recent changes in the following keys:
    - `HKEY_CURRENT_USER\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\`
    - `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\`
    Validate by noting the `Timestamp` of changes in Event ID 4657 or Sysmon Event ID 13.

  - **Identify Certificate Details:**
    For any newly added certificates, extract details such as the issuer, expiration date, and purpose. Check if the certificate's Common Name (CN) or Subject Alternative Name (SAN) aligns with known legitimate CAs or the organization’s trusted entities.

  - **Look for Malicious Patterns:**
    Cross-reference new certificates with known malicious indicators using threat intelligence sources. If the issuer or thumbprint matches any reported malicious certificates, raise this as a high-confidence malicious indicator.

  - **Understand Legitimate Behavior:**
    Document any legitimate sources of certificate installations in your environment (e.g., approved software deployments). Review project documentation to confirm if similar certificate additions have been performed previously in relation to enterprise applications.

  - **Review Associated Activity Logs:**
    Monitor for concurrent anomalous events during the timeframe of the certificate modification, such as process execution logs (Event ID 4688) or network connections (Event ID 5156) initiated by installers or unusual applications.

  - **Check for Related Policies and Configurations:**
    Assess Group Policy Object (GPO) settings and configurations that may allow for legitimate software to modify certificates. Ensure compliance with organizational policies regarding trusted certificates.

  ### Prioritization

  The alert severity is medium. While unauthorized certificate modifications can lead to significant exploitation risks, the likelihood of this specific behavior being utilized in the current threat landscape remains moderate. The presence of such modifications must be regarded cautiously, particularly within critical systems where secure communications are vital.

  ### Blind Spots and Assumptions

  This detection may be circumvented by legitimate administrative actions or automated deployments that modify certificates. Reliable detection also necessitates consistent monitoring of the Windows registry, so configurations allowing full logging of certificate changes are essential. Additionally, legitimate software installers may trigger this alert, suggesting prior coordination with security teams is essential. A related detection to consider is monitoring for unauthorized software installations (such as T1033: Network Share Discovery) to help identify the broader context of certificate use or abuse.

