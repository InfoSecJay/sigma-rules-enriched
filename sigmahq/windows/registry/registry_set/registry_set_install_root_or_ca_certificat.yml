logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\'
    - '\SOFTWARE\Policies\Microsoft\SystemCertificates\Root\Certificates\'
    - '\SOFTWARE\Microsoft\EnterpriseCertificates\Root\Certificates\'
    - '\SOFTWARE\Microsoft\SystemCertificates\CA\Certificates\'
    - '\SOFTWARE\Policies\Microsoft\SystemCertificates\CA\Certificates\'
    - '\SOFTWARE\Microsoft\EnterpriseCertificates\CA\Certificates\'
    - '\SOFTWARE\Microsoft\SystemCertificates\AuthRoot\Certificates\'
    - '\SOFTWARE\Policies\Microsoft\SystemCertificates\AuthRoot\Certificates\'
    - '\SOFTWARE\Microsoft\EnterpriseCertificates\AuthRoot\Certificates\'
    TargetObject|endswith: '\Blob'
    Details: 'Binary Data'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context
  This rule detects the unauthorized addition of new root, CA (Certificate Authority), or AuthRoot certificates to the Windows registry. Such modifications can indicate a potential attacker's attempt to subvert trust relationships, typically for the purpose of executing code with false authority, performing man-in-the-middle (MitM) attacks, or distributing malicious software that masquerades as legitimate applications. The addition of these certificates often occurs without proper authorization and can lead to significant security breaches within enterprise environments.

  The relevant MITRE ATT&CK tactics/techniques associated with this detection are T1490 (Infecting a Certificate Store) and related techniques that focus on compromising trusted software environments. Attackers may aim to gain elevated privileges or stealthily control environments by compromising certificate stores, thus allowing the execution of malicious payloads without raising alarms. Primary data sources for effective detection include Windows registry change logs, specifically monitoring modifications in key certificate stores.

  ### Investigation Steps
  - **Review Registry Changes:** Examine the Windows registry for any new entries under specified paths related to certificates to identify unauthorized modifications. Cross-reference timestamps and user accounts involved in these changes.
  - **Analyze Process Creation Events:** Investigate recent process creation events that may coincide with certificate changes. Look for activities involving tools that manage certificates or install software, which could serve as cover for nefarious activities.
  - **Correlate with User Activity Logs:** Check user activity logs for any unusual admin actions or access to systems around the time of registry changes. Determine if the changes were made by legitimate administrative users or unauthorized entities.
  - **Gather Other Relevant Logs:** Collect additional logs from security products, endpoint detection and response (EDR) systems, or application logs that may provide insight into suspicious software installations or updates that coincide with the certificate modifications.

  ### Prioritization
  This alert is assigned a medium severity level due to the potential for significant impacts on system integrity and trust relationship compromises. Attackers often leverage manipulated certificates to bypass security protocols, making this detection critical in avoiding potential data breaches and unauthorized access.

  ### Blind Spots and Assumptions
  Gaps in detection coverage could arise from environments that do not log registry changes comprehensively or utilize custom solutions that may not trigger expected logging behaviors. The detection logic assumes that modifications to the specific registry paths indicate malicious intent, which may not account for legitimate administrative actions. Proper logging must be ensured across systems to capture all necessary changes, and registry auditing must be configured appropriately for the alert to function effectively.

