detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\'
    - '\SOFTWARE\Policies\Microsoft\SystemCertificates\Root\Certificates\'
    - '\SOFTWARE\Microsoft\EnterpriseCertificates\Root\Certificates\'
    - '\SOFTWARE\Microsoft\SystemCertificates\CA\Certificates\'
    - '\SOFTWARE\Policies\Microsoft\SystemCertificates\CA\Certificates\'
    - '\SOFTWARE\Microsoft\EnterpriseCertificates\CA\Certificates\'
    - '\SOFTWARE\Microsoft\SystemCertificates\AuthRoot\Certificates\'
    - '\SOFTWARE\Policies\Microsoft\SystemCertificates\AuthRoot\Certificates\'
    - '\SOFTWARE\Microsoft\EnterpriseCertificates\AuthRoot\Certificates\'
    TargetObject|endswith: '\Blob'
    Details: 'Binary Data'
  condition: selection
falsepositives:
- Unknown
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of new root, Certificate Authority (CA), or AuthRoot certificates to the Windows registry. An attacker may leverage this behavior to install malicious certificates, which can facilitate man-in-the-middle attacks, allow for code signing of malware, or otherwise undermine system security by establishing trust for malicious entities. Relevant MITRE ATT&CK techniques include: **T1490 - Inhibit System Recovery** and **T1553.004 - Certificate Authority and Public Key Infrastructure Compromise**.

  The primary telemetry source is Windows registry logs capturing changes to the specified certificate store paths. If this behavior is malicious, it could result in significant security impacts, including unauthorized data access or network disruptions. It is important to note that this detection does NOT confirm that the certificate addition is malicious on its own; further investigation is required.

  ### Investigation Steps

  - **Review Registry Changes:**
    Check registry event logs for changes to `HKLM\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates`, `HKLM\SOFTWARE\Microsoft\SystemCertificates\CA\Certificates`, or related paths (Event ID 4657) to confirm the addition of new certificates.

  - **Evaluate Certificate Details:**
    Inspect the newly added certificates for issuer and expiration dates using the Certificate Manager (certmgr.msc) or through `certutil -store` commands to determine if they are trusted or known malicious entities.

  - **Identify Legitimate Activity:**
    Determine if there were prior audit trails or scheduled updates that contributed to new certificate installations, such as software deployments or Group Policies applied on legitimate enterprise systems.

  - **Correlate with Network Traffic:**
    Analyze network logs looking for traffic to or from the IP addresses associated with the newly added certificates. Use firewall or proxy logs to identify potential exploitation attempts or unusual outbound requests.

  - **Check for Other Malicious Indicators:**
    Look for common indicators of compromise such as unauthorized changes in the Event Viewer (Security and Application logs) or unusual process creation events (using Event ID 4688 or Sysmon ID 1) that coincide with the certificate addition time.

  ### Prioritization

  This alert should be considered medium severity due to the impact of a compromised root or CA certificate, especially if it affects a domain controller or critical infrastructure. The likelihood of exploitation is significant, as attackers commonly weaponize certificate manipulations to gain persistent access or facilitate further malicious activities.

  ### Blind Spots and Assumptions

  Detection limitations may arise from suppressed logging settings or if registry-level auditing is not enabled, allowing attackers to modify certificates without detection. Actions such as legitimate software installations, enterprise policies, or updates may trigger this alert. A companion detection to consider is monitoring for unusual certificates in the users’ personal certificate stores (T1553.003) to capture potential lateral movement or targeted attacks.

