title: Potential Registry Persistence Attempt Via DbgManagedDebugger
id: 9827ae57-3802-418f-994b-d5ecf5cd974b
status: test
description: Detects the addition of the "Debugger" value to the 
  "DbgManagedDebugger" key in order to achieve persistence. Which will get 
  invoked when an application crashes
references:
- https://www.hexacorn.com/blog/2013/09/19/beyond-good-ol-run-key-part-4/
- https://github.com/last-byte/PersistenceSniper
author: frack113
date: 2022-08-07
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1574
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Microsoft\.NETFramework\DbgManagedDebugger'
  filter:
    Details: '"C:\Windows\system32\vsjitdebugger.exe" PID %d APPDOM %d EXTEXT "%s"
      EVTHDL %d'
  condition: selection and not filter
falsepositives:
- Legitimate use of the key to setup a debugger. Which is often the case on 
  developers machines
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the unauthorized addition of a "Debugger" value to the "DbgManagedDebugger" registry key on Windows systems. This behavior typically indicates an attempt by an adversary to achieve persistence by ensuring that a debugger is invoked when a specific application crashes, providing the attacker with a means to execute malicious code or maintain control of the system. The primary relevant MITRE ATT&CK tactics include **Persistence (T1574)** and **Defense Evasion (T1203)**.

  The primary telemetry sources for this detection are Windows Registry logs, specifically tracking changes to the key located at `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework\DbgManagedDebugger`. If this addition is malicious, it results in potentially severe security implications, allowing an adversary continued access even after application exits. However, this detection does NOT confirm malicious intent on its own, as legitimate developers may use this registry key for debugging purposes.

  ### Investigation Steps

  - **Check for Recent Registry Changes**: Review Registry logs (Event ID 4657 or Sysmon Event ID 13) for modifications to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework\DbgManagedDebugger`. Look for any entries that indicate addition of the "Debugger" value.

  - **Validate Context of the Change**: Identify the process responsible for the registry modification by correlating Event ID 4657 with prior process creation logs (Event ID 4688 or Sysmon Event ID 1). Compare the command-line arguments for legitimacy.

  - **Examine User Account Activity**: Investigate the user account associated with the registry change. High-risk accounts or unfamiliar users making modifications can indicate compromise. Look at user sign-in logs (Event ID 4624).

  - **Review for Development Environment**: Determine if the change was made in a legitimate development context, such as by an IDE like Visual Studio. If so, cross-reference with the asset inventory to validate the machine's role.

  - **Identify High-Confidence Malicious Indicators**: Correlate the presence of the debugger setting with known malware behaviors. Search for the execution of `vsjitdebugger.exe`, along with any suspicious child processes spawned immediately afterward.

  ### Prioritization

  This alert has medium severity due to its potential indication of persistence techniques being employed on systems deemed critical for operations. The likelihood of malicious abuse is moderate, as sophisticated attackers leverage similar techniques for resilience. However, there are valid use cases in development settings that must be considered.

  ### Blind Spots and Assumptions

  The detection may be limited if logging is not enabled for the specific registry paths or if the relevant Windows auditing features are misconfigured. Malicious code may also employ obfuscation techniques to disguise registry changes, complicating detection. Legitimate developers using the debugger registry key as part of development workflows may trigger this detection, underscoring the importance of context. Related detections, such as monitoring for unusual command-line executions (e.g., `Event ID 4688` with specific arguments), enhance coverage and help differentiate between benign and malicious activities.

