title: Potential Registry Persistence Attempt Via DbgManagedDebugger
id: 9827ae57-3802-418f-994b-d5ecf5cd974b
status: test
description: Detects the addition of the "Debugger" value to the 
  "DbgManagedDebugger" key in order to achieve persistence. Which will get 
  invoked when an application crashes
references:
- https://www.hexacorn.com/blog/2013/09/19/beyond-good-ol-run-key-part-4/
- https://github.com/last-byte/PersistenceSniper
author: frack113
date: 2022-08-07
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.execution
- attack.stealth
- attack.t1574
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Microsoft\.NETFramework\DbgManagedDebugger'
  filter:
    Details: '"C:\Windows\system32\vsjitdebugger.exe" PID %d APPDOM %d EXTEXT "%s"
      EVTHDL %d'
  condition: selection and not filter
falsepositives:
- Legitimate use of the key to setup a debugger. Which is often the case on 
  developers machines
level: medium
note: |
  ### Technical Context

  This Sigma rule detects the addition of a "Debugger" value to the "DbgManagedDebugger" key in the Windows Registry, signifying potential persistence methods employed by adversaries. The likely objective behind this behavior is to maintain control over applications, allowing the adversary to execute code or capture data upon application crashes. This activity aligns with the MITRE ATT&CK tactics of Persistence (T1574) and Execution tactics.

  The primary telemetry source is Windows Registry change logs, specifically focusing on modifications that involve the `DbgManagedDebugger` key. If malicious, this behavior can lead to the execution of arbitrary code or provide adversaries with a foothold in the system. Importantly, while this detection indicates a registry modification, it does not confirm that it is being used maliciously without further context.

  ### Investigation Steps

  - **Review registry changes:** Examine Registry Event IDs (e.g., Event ID 4657) for modifications to the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\.NETFramework` key, specifically looking for any "Debugger" value added to the `DbgManagedDebugger` key.

  - **Check process execution history:** Investigate corresponding Security Event ID 4688 for process creations where the `vsjitdebugger.exe` executable was initiated. A legitimate process should show a typical pattern associated with developer environments rather than an anomalous one.

  - **Identify timestamps and user context:** Correlate the timestamps of the registry modification with user login sessions and privileges. Check for anomalous administrative actions or unauthorized accounts making modifications, especially outside standard working hours.

  - **Examine network connections:** Look for outbound network traffic from the process associated with any debugger actions. Use network logs (e.g., firewall or proxy logs) to identify unusual external connections or data exfiltration attempts that might indicate malicious intent.

  - **Analyze legitimate usage patterns:** Confirm if the debugger configuration matches typical patterns found in development environments by cross-referencing with known developer machine settings. Permissions typically favored by developers should be taken into consideration.

  ### Prioritization

  This alert holds medium severity due to the potential impact of the affected systems when adversaries utilize persistence mechanisms. While this behavior may reflect legitimate developer activity, the likelihood of abuse for malicious purposes is present, particularly as it is used in advanced attack vectors. The use of the `DbgManagedDebugger` for persistence is known among attackers, increasing the urgency of investigation.

  ### Blind Spots and Assumptions

  Detection limitations exist in distinguishing between legitimate and malicious use of the `DbgManagedDebugger` registry modification, as many development environments may trigger similar alerts. Reliable detection requires proper logging configurations for Registry changes and may rely on comprehensive endpoint monitoring solutions. Moreover, legitimate software crash handling might trigger similar behavior, necessitating a contextual understanding of the environment. Companion detections could include monitoring for execution patterns related to code injection techniques or other registry persistence methods like `Run` key modifications.

