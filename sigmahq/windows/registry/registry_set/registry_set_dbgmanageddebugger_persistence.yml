title: Potential Registry Persistence Attempt Via DbgManagedDebugger
id: 9827ae57-3802-418f-994b-d5ecf5cd974b
status: test
description: Detects the addition of the "Debugger" value to the "DbgManagedDebugger"
  key in order to achieve persistence. Which will get invoked when an application
  crashes
references:
- https://www.hexacorn.com/blog/2013/09/19/beyond-good-ol-run-key-part-4/
- https://github.com/last-byte/PersistenceSniper
author: frack113
date: 2022-08-07
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.defense-evasion
- attack.persistence
- attack.t1574
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Microsoft\.NETFramework\DbgManagedDebugger'
  filter:
    Details: '"C:\Windows\system32\vsjitdebugger.exe" PID %d APPDOM %d EXTEXT "%s"
      EVTHDL %d'
  condition: selection and not filter
falsepositives:
- Legitimate use of the key to setup a debugger. Which is often the case on developers
  machines
level: medium
note: |
  ### Technical Context
  This detection rule aims to identify attempts to add a "Debugger" value to the "DbgManagedDebugger" registry key, which is commonly used for achieving persistence in malicious software. Attackers may manipulate this registry key to ensure their debugging process is invoked whenever an application crashes, allowing them to maintain control or extract information surreptitiously. This technique is part of a broader strategy to maintain access to compromised systems and evade detection.

  The relevant MITRE ATT&CK tactics include **Persistence (T1574)**, as attackers are leveraging legitimate registry settings to ensure their payload operates even after system reboots. Additionally, it could overlap with **Privilege Escalation** and **Defense Evasion**, as manipulating debugging settings may allow attackers to circumvent security defenses and potentially escalate privileges within a system. The primary data sources for this detection are Registry Set logs on Windows systems, especially logs related to changes in critical registry paths.

  ### Investigation Steps
  - **Review Registry Changes**: Investigate any recent changes to the `DbgManagedDebugger` registry key to determine if unauthorized modifications were made. Check for the full path and value configuration.
  - **Analyze Process Creation Events**: Look for events related to `vsjitdebugger.exe` within process creation logs. Unusual invocations of this process, especially from unauthorized user accounts, could indicate suspicious activity.
  - **Correlate with Application Logs**: Check application and system logs for crash reports that might correlate with the timing of the registry changes. Look for anomalies in user activity leading up to crashes.
  - **Assess User Accounts**: Investigate the user accounts that made changes to the registry. Look for any accounts that should not have access or typical users running processes they normally do not.

  ### Prioritization
  This alert is categorized as medium severity due to the potential for malicious persistence and the possibility of privilege escalation within the enterprise environment. While some changes may result from legitimate development activities, unauthorized modifications pose a significant risk.

  ### Blind Spots and Assumptions
  The detection logic may miss legitimate use cases, such as debugging practices by developers, leading to false positives. Additionally, this rule relies on timely logging of registry changes; if log retention policies do not capture sufficient history or if auditing is not configured correctly, detection may fail. The assumption here is that the environment follows consistent logging configurations for registry activities.

