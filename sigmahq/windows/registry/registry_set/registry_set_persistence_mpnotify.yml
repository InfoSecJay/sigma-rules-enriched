  ### Technical Context
  This rule detects potential persistence mechanisms employed by attackers through the registration of a new Session Initiation Protocol (SIP) provider in Windows systems. By manipulating the registry key `mpnotify` under `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon`, an adversary can ensure their payload is executed during system startup or user logon, allowing them to maintain access to the victimized system. This technique can facilitate defense evasion, making it a common tactic used by threat actors to ensure continued presence on compromised hosts.

  The relevant MITRE ATT&CK tactics and techniques associated with this behavior include **Persistence** (TA0003) and **Registry Run Keys / Startup Folder** (T1547.001). Attackers utilizing this technique typically aim to establish a foothold within an organization's environment, enabling them to conduct subsequent malicious activities such as data exfiltration, lateral movement, or escalation of privileges.

  Primary data sources for effective detection of this activity include Windows registry change logs, specifically monitoring for modifications to the `mpnotify` key. Additionally, inspecting Windows Event Logs, particularly the security and system logs during startup and user login events, can provide context for the registration of new SIP providers.

  ### Investigation Steps
  - **Review Registry Changes:** Investigate any recent modifications to the registry key `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\mpnotify`. Look for unusual or unexpected entries that could signify malicious activity.
  - **Analyze User Login Events:** Examine Windows Event Logs for any new SIP provider registrations coinciding with user logon sessions. Pay particular attention to the sequence and timing of these events.
  - **Correlate with Known Threats:** Cross-reference the identified SIP provider changes with known threat intelligence to determine if they are associated with recognized attack patterns or threat actors.
  - **Monitor for Anomalous Behavior:** Track associated processes and activities initiated around the same timeframe as the registry modification. This includes checking for unusual process creations or network connections that may correlate with the persistence mechanism.

  ### Prioritization
  The alert is classified as high severity due to the significant risk it poses to enterprise environments. The registration of a new SIP provider for persistence indicates an unauthorized attempt to maintain access, potentially enabling further exploitation of the network infrastructure.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage for legitimate changes by system administrators or service providers to register SIP configurations, which could lead to false positives. The detection logic assumes that any changes to the `mpnotify` key are inherently malicious, disregarding legitimate administrative operations. Additionally, this alert relies on comprehensive registry monitoring capabilities within the environment; failure to log or retain registry changes may hinder effective detection and investigation.

