  ---

  ### Technical Context

  This Sigma rule detects the registration of a new Session Initiation Protocol (SIP) provider by monitoring changes to the Windows registry key related to `mpnotify`. This behavior is indicative of attackers attempting to establish persistence mechanisms, enabling them to maintain access to compromised systems while evading detection. The relevant MITRE ATT&CK tactic is Persistence (TA0003) and the technique is Registering a New SIP Provider (T1075).

  The primary telemetry source for this detection is Windows registry modification logs, specifically changes to the `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\mpnotify` path. If this behavior is malicious, it can lead to unauthorized remote access or installation of malicious software. Importantly, this detection does NOT confirm malicious activity on its own, as legitimate administrative tasks may also register new SIP providers.

  ---

  ### Investigation Steps

  - **Identify registry changes**: Review modifications to the registry path `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\mpnotify` using Security Event ID 4657 to track what values were added or changed, including the timestamp and user account responsible for the change.

  - **Check for recent SIP provider activity**: Look for other logs around the same time, such as `Application` or `System` logs for Event IDs related to SIP activity (e.g., SIP communication logs) to determine if there was any associated malicious command execution during that timeframe.

  - **Validate legitimate SIP registrations**: Analyze change frequency within the `mpnotify` registry key in your organizational context; regular SIP provider registrations are uncommon and should raise suspicion, especially if accompanied by an administrative user context.

  - **Correlate with user behavior**: Review the user account performing the operation in relation to its role: Are they an admin? Do they typically manage SIP providers? Check the `Account Name` and `Caller User Name` fields in the event logs to establish context.

  - **Investigate network connections**: Examine outbound connections to VOIP/SIP servers by utilizing logs such as `Windows Firewall` (Event ID 5145) or any local firewall logs to track if there are connections coinciding with the registry change, which may indicate malicious intent.

  - **Assess system criticality**: Determine the importance of the affected system within the environment. If the system is a gateway or critical infrastructure component, escalate accordingly to reflect the potential impact if used for lateral movement or exfiltration.

  ---

  ### Prioritization

  This alert should be treated with high priority due to its potential impact on the security posture of the organization—malicious modifications to SIP providers can enable persistent access points for attackers. The likelihood of abuse is significant, especially given that persistence techniques are commonly weaponized in advanced attacks.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by legitimate administrative activities, which could cause false positives. Organizations must ensure that auditing is enabled for registry changes and that all relevant event logs are collected. Additionally, an organization’s specific network topology may pose legitimate scenarios where SIP providers are registered, warranting a thorough investigation. Consider pairing this detection with alerts for abnormal outbound SIP traffic to enhance overall monitoring efficacy.

