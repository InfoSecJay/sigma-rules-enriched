title: Windows Event Log Access Tampering Via Registry
id: ba226dcf-d390-4642-b9af-b534872f1156
status: experimental
description: |
  Detects changes to the Windows EventLog channel permission values. It focuses on changes to the Security Descriptor Definition Language (SDDL) string, as modifications to these values can restrict access to specific users or groups, potentially aiding in defense evasion by controlling who can view or modify a event log channel. Upon execution, the user shouldn't be able to access the event log channel via the event viewer or via utilities such as "Get-EventLog" or "wevtutil".
references:
- https://www.atomicredteam.io/atomic-red-team/atomics/T1562.002#atomic-test-8---modify-event-log-channel-access-permissions-via-registry---powershell
- https://www.youtube.com/watch?v=uSYvHUVU8xY
- https://learn.microsoft.com/en-us/windows/win32/secauthz/security-descriptor-definition-language
author: X__Junior
date: 2025-01-16
modified: 2025-08-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-evasion
- attack.t1547.001
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
    # O:SYG:SYD:(D;;0x1;;;WD)
    # O:BAG:SYD:(A;;0x2;;;S-1-15-2-1)(D;;0x1;;;WD)
  selection_key_1:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Services\EventLog\'
    TargetObject|endswith: '\CustomSD'
  selection_key_2:
    TargetObject|contains:
    - '\Policies\Microsoft\Windows\EventLog\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels'
    TargetObject|endswith: '\ChannelAccess'
  selection_details:
  - Details|contains: 'D:(D;'
  - Details|contains|all:
    - 'D:('
    - ')(D;'
  filter_main_trustedinstaller:
    Image: 'C:\Windows\servicing\TrustedInstaller.exe'
  filter_main_tiworker:
    Image|startswith: 'C:\Windows\WinSxS\'
    Image|endswith: '\TiWorker.exe'
  filter_optional_empty:
    Image: ''
  filter_optional_null:
    Image:
  condition: 1 of selection_key_* and selection_details and not 1 of 
    filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative activity, still unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to Windows Event Log channel permissions, specifically targeting changes to the Security Descriptor Definition Language (SDDL) strings. Attackers may modify these permissions to cover their tracks, preventing the detection of malicious activity by restricting access to event logs. This behavior aligns with the MITRE ATT&CK techniques for Defense Evasion (T1562.002) and Privilege Escalation (T1547.001).

  The primary telemetry sources for this detection include Windows Registry event logs related to registry modifications (Event ID 4657). If this rule triggers, it can indicate a serious security concern since altering event log access can obfuscate malicious actions and limit detection capabilities. However, merely triggering this detection does NOT confirm malicious intent; legitimate administrative actions may also invoke similar changes.

  ### Investigation Steps

  - **Review Registry Modification Events**: Check Windows Event ID 4657 logs for changes to registry keys related to EventLog permissions, particularly those under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\EventLog\`. Note any changes to values containing `CustomSD` or `ChannelAccess`.

  - **Verify User Context of Changes**: Identify who made the changes by reviewing the `SubjectUserName` and `SubjectDomainName` in associated logs. Legitimate administrative changes typically come from users with known elevated privileges.

  - **Analyze the SDDL Changes**: Inspect the modified SDDL strings for any apparent removals of access rights that could indicate an attempt to hide log entries. Malicious configurations often remove rights for SYSTEM or administrator accounts.

  - **Cross-Reference with Process Creation Logs**: Check Security Event ID 4688 to correlate if changes to the registry were made in conjunction with suspicious process creation events. Look for processes launching Powershell with arguments indicating log manipulation or registry editing.

  - **Check for Anomalous Change Patterns**: Determine if changes were applied in bulk or if there are rapid successive modifications leading to a suspicious state. Multiple changes within a short timeframe can indicate an active tampering session.

  - **Identify Baseline Legitimate Activity**: Document typical administrative tasks pertaining to event log management in your environment. Recognizing these baseline behaviors will help distinguish between benign changes and potentially malicious actions.

  ### Prioritization

  This alert should be prioritized as high due to the significant impact that alterations to event log access can have on an enterprise environment. The likelihood of malicious abuse is elevated, particularly in the context of post-compromise activities aimed at evading detection. It reflects behavior that is frequently employed in the exploitation phase of an attack lifecycle.

  ### Blind Spots and Assumptions

  This detection may be evaded if an attacker uses legitimate administrative accounts to make changes, so understanding normal administrative behavior is critical. Additionally, reliable detection requires proper auditing configurations to ensure that registry changes are logged accurately. Legitimate scenarios, such as routine administrative tasks or system updates, might trigger this alert. A related detection is monitoring for unusual Powershell command execution (T1059.001), which can provide further context to understand whether the registry changes align with suspicious activity.

