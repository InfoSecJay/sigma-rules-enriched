note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the Windows Event Log channel permissions via changes to the Security Descriptor Definition Language (SDDL) string. Such behavior is indicative of an attacker attempting to suppress auditing by limiting the visibility of event logs, therefore evading detection and potentially hiding malicious activities from system administrators. The likely attacker objective is to prevent the detection of their presence or actions on the compromised system.

  This behavior relates to the MITRE ATT&CK tactic of Defense Evasion and the specific technique T1562.002, which pertains to "Modify Event Log Access Permissions." The primary telemetry source for this detection is the Windows Registry, specifically registry modifications related to EventLog permissions, which can be captured as registry set events. If malicious, altering these access permissions can critically undermine an organization's ability to monitor system behaviors and detect intrusions. Importantly, this detection does not, on its own, confirm malicious intent; legitimate administrator actions may also modify these permissions.

  ### Investigation Steps

  - **Review the Registry Modification Event:** Examine the registry set event (Event ID 4657) for changes to the following paths:
    - `\SYSTEM\CurrentControlSet\Services\EventLog\`
    - `\Policies\Microsoft\Windows\EventLog\`
    - `\Microsoft\Windows\CurrentVersion\WINEVT\Channels`
    - Verify if the modification includes SDDL strings containing `"D:(D;` or elements indicating decreased permissions.

  - **Check User Account Activity:** Investigate the associated user or process that triggered the registry change. Identify the user account via Event ID 4634 (logoff) or 4624 (logon) and correlate their actions around the time of the registry change.

  - **Identify Admin Activity:** Determine if the modification was part of known administrative maintenance by reviewing logs from approved administrative accounts or management tools. Look for Event IDs 4688 (process creation) that would indicate legitimate administrative utilities were used.

  - **Validate the Absence of Known Processes:** Ensure that the modification was not executed by `TrustedInstaller.exe` (C:\Windows\servicing\TrustedInstaller.exe) or `TiWorker.exe` (C:\Windows\WinSxS\TypedWorker.exe), as these processes are typically associated with legitimate system administration tasks.

  - **Analyze System Behavior Post-Change:** Investigate subsequent events that indicate restrictive behavior, such as failed access to event logs by normal users, utilizing `Get-EventLog` or `wevtutil` commands. Ensure to cross-reference failed actions that could indicate attempts to audit logs.

  ### Prioritization

  This alert should be prioritized as high severity due to its potential to hide malicious activities from security monitoring efforts and the criticality of logs in incident response scenarios. The likelihood of malicious actors modifying log access permissions makes this a common target in sophisticated attacks aiming at maintaining persistence within a network.

  ### Blind Spots and Assumptions

  Potential evasion techniques include legitimate administrative activities that may inadvertently trigger this alert, which necessitates careful scrutiny of context. Detection reliability relies heavily on continuous monitoring of registry modifications, and gaps may occur if auditing settings are not properly configured for Windows Registry access. An effective companion detection would involve monitoring for unusual Process Creation events (Event ID 4688) that indicate scripts or tools attempting to modify log visibility.

