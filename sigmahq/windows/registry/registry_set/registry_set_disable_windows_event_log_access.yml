title: Windows Event Log Access Tampering Via Registry
id: ba226dcf-d390-4642-b9af-b534872f1156
status: experimental
description: |
  Detects changes to the Windows EventLog channel permission values. It focuses on changes to the Security Descriptor Definition Language (SDDL) string, as modifications to these values can restrict access to specific users or groups, potentially aiding in defense evasion by controlling who can view or modify a event log channel. Upon execution, the user shouldn't be able to access the event log channel via the event viewer or via utilities such as "Get-EventLog" or "wevtutil".
references:
- https://www.atomicredteam.io/atomic-red-team/atomics/T1562.002#atomic-test-8---modify-event-log-channel-access-permissions-via-registry---powershell
- https://www.youtube.com/watch?v=uSYvHUVU8xY
- https://learn.microsoft.com/en-us/windows/win32/secauthz/security-descriptor-definition-language
author: X__Junior
date: 2025-01-16
modified: 2025-08-16
tags:
- attack.privilege-escalation
- attack.persistence
- attack.defense-impairment
- attack.t1547.001
- attack.t1112
logsource:
  category: registry_set
  product: windows
detection:
    # O:SYG:SYD:(D;;0x1;;;WD)
    # O:BAG:SYD:(A;;0x2;;;S-1-15-2-1)(D;;0x1;;;WD)
  selection_key_1:
    TargetObject|contains: '\SYSTEM\CurrentControlSet\Services\EventLog\'
    TargetObject|endswith: '\CustomSD'
  selection_key_2:
    TargetObject|contains:
    - '\Policies\Microsoft\Windows\EventLog\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels'
    TargetObject|endswith: '\ChannelAccess'
  selection_details:
  - Details|contains: 'D:(D;'
  - Details|contains|all:
    - 'D:('
    - ')(D;'
  filter_main_trustedinstaller:
    Image: 'C:\Windows\servicing\TrustedInstaller.exe'
  filter_main_tiworker:
    Image|startswith: 'C:\Windows\WinSxS\'
    Image|endswith: '\TiWorker.exe'
  filter_optional_empty:
    Image: ''
  filter_optional_null:
    Image:
  condition: 1 of selection_key_* and selection_details and not 1 of 
    filter_main_* and not 1 of filter_optional_*
falsepositives:
- Administrative activity, still unlikely
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized changes to Windows Event Log channel permissions by monitoring modifications to the Security Descriptor Definition Language (SDDL) strings in the registry. Such behavior may indicate an attacker’s objective to manipulate log accessibility, thus impairing detection and visibility of their post-exploitation activities. The relevant MITRE ATT&CK tactics include Defense Evasion (TA0005) and Privilege Escalation (TA0004), specifically focusing on technique T1547.001, which concerns modifying event log access permissions.

  Primary telemetry sources stem from the Windows registry, particularly event logs and requests monitored through registry key changes relevant to EventLog permissions. If malicious, these alterations can prevent legitimate users from viewing event logs, obstructing incident response mechanisms. Notably, this detection does NOT confirm malicious activity on its own, as legitimate administrative operations may occasionally invoke registry changes.

  ### Investigation Steps

  - **Review specific registry changes:** Investigate registry keys under `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\EventLog\` for `CustomSD` modifications and under `HKEY_LOCAL_MACHINE\Policies\Microsoft\Windows\EventLog\` and `HKEY_LOCAL_MACHINE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\` for `ChannelAccess`. Compare with baseline configurations to identify unauthorized changes.

  - **Examine the Details field:** Look for entries in the Details field containing 'D:(' and '(D;' during the registry access event. The presence of these strings indicates permission changes that could restrict event log visibility.

  - **Identify the process responsible for changes:** Check the process path associated with the registry modifications, ensuring it is not a legitimate system process like `TrustedInstaller.exe` or `TiWorker.exe`, which could indicate benign administrative activity. Any modifications from unrecognized process paths warrant further scrutiny.

  - **Check user permissions:** Review if any operation user accounts associated with the modification possess elevated access. Malicious actors often use compromised accounts with administrative privileges to alter log settings; thus review expected users against unexpected changes.

  - **Validate log accessibility:** Utilize tools like `Get-EventLog` or `wevtutil` to determine if the event log channels are accessible post-modification. No access could indicate an ongoing attempt to hide malicious activity.

  - **Log source validation:** Ensure that Windows Event logs are properly configured and collecting the expected data for future incident investigations. Gaps in logs can hinder successful evaluations of potential attacks affecting event log access.

  ### Prioritization

  This alert has high severity as it directly impacts the integrity of event logs, which are critical for detecting unauthorized activities. The likelihood of these changes being malicious is significant, as attackers frequently employ this tactic to conceal their actions. Such behavior is a known method for circumventing detection mechanisms, making timely investigation crucial.

  ### Blind Spots and Assumptions

  Limitations include the potential for legitimate administrative activities to trigger the alert, creating noise in the detection system. Detection relies on precise logging of registry changes; without proper configuration, evidence may be lost. Potential false positives must be expected, particularly in environments with rigorous administrative practices. Companion detections, such as monitoring for unusual process behaviors or abnormal user activity, can enhance coverage against this evasion tactic.

