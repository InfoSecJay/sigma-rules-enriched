title: VBScript Payload Stored in Registry
id: 46490193-1b22-4c29-bdd6-5bf63907216f
status: test
description: Detects VBScript content stored into registry keys as seen being used
  by UNC2452 group
references:
- https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
author: Florian Roth (Nextron Systems)
date: 2021-03-05
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: 'Software\Microsoft\Windows\CurrentVersion'
    Details|contains:
    - 'vbscript:'
    - 'jscript:'
    - 'mshtml,'
    - 'RunHTMLApplication'
    - 'Execute('
    - 'CreateObject'
    - 'window.close'
  filter:
    TargetObject|contains: 'Software\Microsoft\Windows\CurrentVersion\Run'
  filter_dotnet:
    Image|endswith: '\msiexec.exe'
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\'
    Details|contains:
    - '\Microsoft.NET\Primary Interop Assemblies\Microsoft.mshtml.dll'
    - '<\Microsoft.mshtml,fileVersion='
    - '_mshtml_dll_'
    - '<\Microsoft.mshtml,culture='
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context
  This detection rule identifies instances of VBScript and related scripting code being stored within specific Windows registry keys, particularly those associated with startup execution. The presence of such artifacts is often indicative of malicious payloads, particularly those utilized by threat actors like the UNC2452 group (also known as Nobelium), which is notorious for its sophisticated cyber exploits. This behavior could signify attempts at persistence or privilege escalation on compromised systems, where attackers leverage VBScript to automate actions or execute additional malicious payloads.

  Relevant MITRE ATT&CK tactics for this detection include:
  - **Persistence (T1547.001)**: Storing scripts in the Registry read during system startup to maintain access to compromised systems.
  - **Privilege Escalation (T1078)**: Abusing system features or executing scripts to gain elevated privileges.

  Primary data sources include:
  - Registry change logs, specifically monitoring the `HKEY_CURRENT_USER` and `HKEY_LOCAL_MACHINE` keys for modifications under `Software\Microsoft\Windows\CurrentVersion\Run`.
  - Process creation logs that may indicate script execution or related malicious activity tied to VBScript and similar languages.

  ### Investigation Steps
  - **Review Registry Logs**: Examine `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run` and `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run` for unfamiliar entries containing 'vbscript:', 'jscript:', or related scripting commands.
  - **Analyze Process Creation Events**: Investigate any recent process execution events that involve `msiexec.exe` or scripts initiating from the affected registry keys, looking for unusual parent-child relationships.
  - **Correlate with Network Traffic**: If applicable, analyze outbound network connections associated with processes that executed these scripts to identify potential callbacks to command and control servers or data exfiltration.
  - **Inspect for Related Artifacts**: Identify any additional malicious files or modifications found alongside the relevant registry changes, focusing on unusual file types or unexpected alterations in system configurations.

  ### Prioritization
  The severity of this alert is high due to the potential impact of the detected behavior on enterprise security. The ability of threat actors to maintain persistence and escalate privileges can lead to significant data breaches and system compromise.

  ### Blind Spots and Assumptions
  This detection rule may encounter gaps in coverage if the logs for registry changes are not enabled or if endpoint protection mechanisms are configured to prevent script execution from the registry. The detection logic assumes that no legitimate software uses the same registry keys for benign purposes, which might lead to false positives. Additionally, appropriate logging and monitoring configurations must be in place to ensure visibility of the registry keys involved.

