title: VBScript Payload Stored in Registry
id: 46490193-1b22-4c29-bdd6-5bf63907216f
status: test
description: Detects VBScript content stored into registry keys as seen being 
  used by UNC2452 group
references:
- https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
author: Florian Roth (Nextron Systems)
date: 2021-03-05
modified: 2023-08-17
tags:
- attack.privilege-escalation
- attack.persistence
- attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: 'Software\Microsoft\Windows\CurrentVersion'
    Details|contains:
    - 'vbscript:'
    - 'jscript:'
    - 'mshtml,'
    - 'RunHTMLApplication'
    - 'Execute('
    - 'CreateObject'
    - 'window.close'
  filter:
    TargetObject|contains: 'Software\Microsoft\Windows\CurrentVersion\Run'
  filter_dotnet:
    Image|endswith: '\msiexec.exe'
    TargetObject|contains: '\SOFTWARE\Microsoft\Windows\CurrentVersion\Installer\UserData\'
    Details|contains:
    - '\Microsoft.NET\Primary Interop Assemblies\Microsoft.mshtml.dll'
    - '<\Microsoft.mshtml,fileVersion='
    - '_mshtml_dll_'
    - '<\Microsoft.mshtml,culture='
  condition: selection and not 1 of filter*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the storage of potentially malicious VBScript payloads in Windows registry keys, particularly under `Software\Microsoft\Windows\CurrentVersion\Run`. Attackers may use this technique to establish persistence, allowing them to execute scripts automatically upon system startup. This behavior is often associated with advanced persistent threats (APTs) focused on privilege escalation and maintaining a foothold within the network. The relevant MITRE ATT&CK tactics and techniques include Persistence (T1547.001) and Privilege Escalation.

  The primary telemetry source for this detection is Windows Registry access logs, specifically monitoring registry key modifications. If successful, this type of activity can lead to unauthorized access, data theft, or further compromise of the network. It’s important to note that this detection does not confirm that the payload is malicious or has executed; it merely identifies attempts to store suspicious script content in the registry.

  ### Investigation Steps

  - **Identify the registry modifications**: Review Windows Event ID 4657 logs for any alterations to registry keys under `Software\Microsoft\Windows\CurrentVersion\Run`. Look for `TargetObject` containing this path and any unusual `Details` indicative of VBScript or aspects of automation.

  - **Correlate with process execution**: Check for related Command-Line events (Event ID 4688) indicating execution of processes like `msiexec.exe` or scripting engines such as `wscript.exe`, revealing whether any scripts were actually run that correspond to the payload stored.

  - **Examine execution history**: Validate execution behavior by inspecting event log timestamps alongside the registry modification entries to see if the script executes immediately after being saved to the registry, which could indicate malicious intent.

  - **Review benign usage patterns**: Determine if any legitimate applications, especially installers or enterprise management tools, use similar registry paths for persistence. Whitelist these applications where applicable against known software lists to reduce false positives.

  - **Cross-reference with threat intelligence**: Utilize threat intelligence feeds to check if the detected behavior matches known APT tactics, particularly those previously linked with UNC2452 or similar threat actors.

  ### Prioritization

  This alert has a high severity level due to its association with persistence mechanisms used by APT actors. The potential impact is significant, as it could indicate active exploitation and compromise of critical systems. Given that this behavior has been weaponized in real-world attacks, it warrants immediate investigation.

  ### Blind Spots and Assumptions

  This detection may be evaded by attackers using legitimate-looking scripts or approaches that do not interact with the Windows registry. To ensure reliable detection, all relevant registry change logs must be configured and monitored consistently. Legitimate administrative tasks or maintenance scripts may also trigger this alert, leading to false positives. A companion detection could include monitoring for unusual script execution via system event logs, enhancing the ability to correlate registry modifications to active or chronological script execution events.

