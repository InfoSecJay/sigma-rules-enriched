detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideClock'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAHealth'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCANetwork'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAPower'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAVolume'
    Details: 'DWORD (0x00000001)'
  selection_set_0:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowInfoTip'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowCompColor'
    Details: 'DWORD (0x00000000)'
  condition: 1 of selection_set_*
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry that hide system features from users, such as the clock, health notifications, and volume control indicators. The likely objective of an attacker using this technique is to obscure malicious activities or tools operating on the system, facilitating persistence and stealth. The involved MITRE ATT&CK tactics include **Persistence** (T1559) and **Defense Evasion** (T1112), specifically targeting methods that modify user interface behavior to conceal malicious actions.

  The primary telemetry sources for this detection include Windows Registry modifications, specifically monitoring changes to keys under `HKEY_CURRENT_USER` and `HKEY_LOCAL_MACHINE`. If malicious, this behavior can lead to a compromised system being leveraged for further exploitation or data exfiltration. However, it is important to note that this detection alone does not confirm malicious intent or compromise; benign administrative actions can trigger similar registry modifications.

  ### Investigation Steps

  - **Review modified registry keys**: Check recent changes to keys listed in the detection (e.g., `HideClock`, `ShowInfoTip`) using Registry Event ID 4657 or Sysmon Event ID 13. Compare timestamps with user activity logs to determine if the timing aligns with legitimate administrative work.

  - **Inspect user account details**: Cross-reference the account making the changes against known administrative roles. Look for unexpected changes made by non-privileged accounts to identify potential malicious insiders.

  - **Validate legitimate administrative actions**: Identify patterns of legitimate registry modifications by administrators. Check organizational policies and scripts that could account for registry changes to ensure they follow established protocols.

  - **Correlate with other activity logs**: Utilize Windows Event Log IDs 4624 (logon) and 4688 (process creation) to triangulate the behavior with other user actions around the same time. Investigate if any recent logins were followed by registry modifications.

  - **Identify high-confidence indicators**: Investigate whether the DWORD values set to `1` for hiding UI elements correspond to unclear user activity or known malware signatures. Cross-check installed applications for known associations with registry modification techniques.

  - **Check for installation of malicious tools**: Use Windows Event ID 4688 to detect any process creation right after registry changes, especially for known malware such as Agent Tesla or Hermetic Wiper. Look for executable names or command lines that indicate abnormal behavior related to these modifications.

  ### Prioritization

  This alert warrants medium severity in an enterprise context due to the potential for significant operational impact if a system is being weaponized for stealthy actions. The likelihood of malicious abuse is moderate, as this technique is often leveraged in targeted attacks and can be a preliminary step in establishing persistence.

  ### Blind Spots and Assumptions

  Detection limitations include false positives from legitimate administrative scripts or tools that modify registry settings for user experience purposes. To ensure reliable detection, confirm that logging for all relevant registry key changes is enabled on monitored endpoints. Typical legitimate activities that may trigger this alert include configuration adjustments by IT personnel. A related detection technique to strengthen coverage would be to monitor for any use of scripting engines (e.g., PowerShell or Batch scripts) that could lead to suspicious registry modifications, corresponding to MITRE ATT&CK technique T1059.

