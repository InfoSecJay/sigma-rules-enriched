detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideClock'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAHealth'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCANetwork'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAPower'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAVolume'
    Details: 'DWORD (0x00000001)'
  selection_set_0:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowInfoTip'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowCompColor'
    Details: 'DWORD (0x00000000)'
  condition: 1 of selection_set_*
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to specific Windows registry keys that are often used to hide system information or functions from the user interface. The likely attacker objective is to obscure their malicious activities or tools, which can aid covert operations. This behavior correlates with the MITRE ATT&CK tactics of Persistence (TA0003) and Defense Evasion (TA0005), specifically under technique T1112: Modify Registry. The primary telemetry sources include Windows Registry changes, which can be logged through event sources like Sysmon and the native Windows Event Logs. If successful, this detection may indicate that an adversary is trying to hide their presence or functionality, furthering their malicious objectives. However, this detection does NOT confirm that the system has been compromised; legitimate administrative activities could trigger similar alerts.

  ### Investigation Steps

  - **Review registry change events:** Identify relevant registry changes using Sysmon Event ID 13 for registry set operations. Focus on keys such as `SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideClock` with a value of `DWORD (0x00000001)` for signs of malicious intent.

  - **Check source of changes:** Cross-reference the user or process making the changes. Look for unexpected user accounts or processes that should not have administrative rights.

  - **Identify legitimate use cases:** Verify if documented administrative procedures involve modifications to these keys. Common IT procedures like system configuration or maintenance should not include hiding user-facing elements.

  - **Investigate process behavior:** Assess the processes that triggered the registry changes using Sysmon Event ID 1 (Process Creation). Look for unusual parent-child relationships or command line arguments that could indicate malicious activity.

  - **Correlate with other alerts:** Cross-reference this alert with indicators of compromise (IOCs) from threat intelligence feeds. Pay attention to recent activity related to known malware like Agent Tesla or Hermetic Wiper that employ similar techniques.

  ### Prioritization

  This alert should be treated with medium severity due to the potential impact on user awareness and security. The likelihood of malicious abuse is moderate, as attackers often utilize such techniques to maintain persistence and evade detection. While not every occurrence signifies an active threat, it warrants further investigation, especially in compromised environments.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques where malware may restore original registry values shortly after modifications are detected. Reliable detection requires configuration to log registry changes (e.g., enable registry audit logs if not already enabled) and Sysmon deployment in the environment. Legitimate activities, such as system tuning or user interface customizations performed by IT administrators, may inadvertently trigger this alert. A companion detection that enhances coverage would be monitoring for system service modifications or process injections that coincide with these registry changes.

