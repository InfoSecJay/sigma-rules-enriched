note: |
  ### Technical Context

  This detection rule targets modifications to specific Windows Registry keys that are commonly manipulated by malware to hide various system functionalities from the user. Attackers may modify registry values to disable visible aspects of the Windows user interface, which prevents the user from noticing potentially malicious activities or processes, thus supporting persistence and evasion strategies. The primary attack objective here is to impair system visibility and user awareness, allowing the malware to operate undetected.

  Relevant MITRE ATT&CK tactics and techniques include:
  - Tactic: Persistence
  - Technique: T1112 (Modify Registry)

  The primary telemetry sources are Windows Registry logs that capture changes to registry values associated with the Explorer policies. The security impact, if malicious, includes loss of visibility into critical system functions, thereby facilitating additional malicious operations without user detection. However, this detection does NOT confirm the presence of malicious activity on its own; it simply indicates that registry values were modified, which can also occur through benign administrative actions.

  ### Investigation Steps

  - **Examine the Registry Modifications**: Review the specific registry path affected under SYSTEM\CurrentControlSet\Control\Windows\ and document changes, focusing on keys like HideClock or ShowInfoTip. Ensure the values are set to either 1 (hidden) or 0 (visible).

  - **Identify User Context**: Check for changes associated with specific user accounts. Query the Security Event Log (Event ID 4624) to identify if the modification occurred under a legitimate user account known to have administrative permissions.

  - **Validate the Change Initiator**: Analyze event logs for process creation related to registry modifications using Sysmon Event ID 1. Look for processes corresponding to known administrative tools, such as `regedit.exe` or `powershell.exe`, indicating legitimate administration versus potential compromise.

  - **Assess Related Active Alerts**: Check if this alert correlates with other alerts related to potential malicious activity within the environment, such as unexpected software installations or unusual network activity, by reviewing recent Security Event Logs (Event IDs 4688 and 4689).

  - **Review Legitimate Use Cases**: Confirm whether any administrative scripts or group policy applications may trigger this registry change legitimately, including documented changes made during maintenance windows. Look for changes planned by IT in related change management systems.

  - **Investigate for Tactics Consistent with T1112**: Explore if there are additional indicators of compromised systems by searching for lateral movement or other persistence mechanisms being implemented in conjunction with registry modifications using the MITRE ATT&CK framework as a reference.

  ### Prioritization

  This alert should be classified with medium severity. While the registry change may indicate malicious intent, the impact of the affected system depends on its role within the organization (e.g., critical server vs. end-user device). The likelihood of abuse is moderate, given that attackers often use this technique to conceal their operations, making it a common method in active campaigns.

  ### Blind Spots and Assumptions

  Detection limitations include potential evasion techniques such as using legitimate administrative tools or scripts that trigger similar registry changes without malicious intent. Reliable detection depends on comprehensive logging of registry modifications and ensuring that administrative actions are properly logged and monitored. Legitimate administrative tasks can trigger this alert, particularly if administrators modify user interfaces for specific support cases. A related detection that strengthens coverage is monitoring for creation of new processes that attempt to modify the registry shortly after application installs, which may indicate suspicious behavior.

