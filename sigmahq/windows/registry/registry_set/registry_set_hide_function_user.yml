logsource:
  category: registry_set
  product: windows
detection:
  selection_set_1:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideClock'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAHealth'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCANetwork'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAPower'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\HideSCAVolume'
    Details: 'DWORD (0x00000001)'
  selection_set_0:
    TargetObject|endswith:
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowInfoTip'
    - 'SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowCompColor'
    Details: 'DWORD (0x00000000)'
  condition: 1 of selection_set_*
falsepositives:
- Legitimate admin script
level: medium
note: |
  ### Technical Context
  This detection rule captures suspicious modifications to the Windows Registry that may indicate an attacker’s attempt to hide tools or functions from users. Specifically, it looks for registry changes associated with hiding system information related to network configurations, power settings, and volume controls. This behavior has been seen in malicious software like Agent Tesla and Hermetic Wiper, which leverage these techniques to evade detection and maintain persistence on compromised systems.

  The primary goal of such techniques is typically to obscure the presence of the malware or its capabilities from the user and potentially system admins. By altering specific registry settings, attackers can hide essential elements of the Windows user interface, facilitating covert operation and minimizing the likelihood of detection by security personnel. This behavior aligns with MITRE ATT&CK tactics such as **Persistence** (T1547) and **Defense Evasion** (T1112), where registry modification is a common method for maintaining control over compromised environments.

  The best data sources for investigating this behavior include **Windows Registry logs** that register changes made to specific keys, which can provide clear insights into any unauthorized modifications.

  ### Investigation Steps
  - **Review Registry Logs:** Examine the logs for any modifications to the specified registry paths related to hiding system information. Focus on unusual activity that coincides with user accounts or system events.

  - **Analyze User Activity:** Investigate the context around user actions leading up to the registry modifications. Identify any legitimate administrative actions versus potential malicious activity by correlating user actions with timestamps.

  - **Correlate with Process Execution:** Check for any processes that executed around the same time as the registry changes. Look for unusual or unauthorized applications that may indicate the presence of malware.

  - **Identify Impacted Systems:** Determine whether the registry changes were made on multiple systems. If a pattern is observed, this may indicate a broader compromise within the environment.

  ### Prioritization
  The severity of this alert is medium due to the deceptive nature of hiding critical system settings, which can indicate ongoing malicious activities. While the likelihood of false positives exists (e.g., from legitimate administrative scripts), successful exploitation can lead to significant operational impact.

  ### Blind Spots and Assumptions
  The detection logic assumes that registry modifications are indicative of malicious behavior and may overlook legitimate administrative changes that utilize similar registry keys. There may be gaps in detection if logging is not configured properly, such as lack of auditing on registry access, which is required for this detection to function effectively. Additionally, an assumption exists that most legitimate alterations will not involve hiding core functionalities from users; however, scenario-based assessments may be needed to mitigate this risk.

