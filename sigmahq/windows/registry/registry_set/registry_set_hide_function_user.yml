  ---

  ### Technical Context

  This rule detects modifications to the Windows registry that hide critical system tools or user interface elements, indicating a potential attempt by malware to obscure its presence or activities. The likely attacker objective is to maintain persistence and evade detection by disabling user-interface elements that would typically allow users to notice unusual behaviors. Relevant MITRE ATT&CK tactic and technique include Persistence (T1547) and Defense Evasion (T1112). The primary telemetry source is Windows registry change logs, specifically monitoring the `registry_set` category for changes to targeted keys and values.

  If this behavior is malicious, it may lead to further exploits, allowing attackers to execute code, steal credentials, or deploy additional malware. However, this detection does NOT confirm active exploitation or malicious intent, as legitimate administrative actions may also trigger the same registry changes.

  ---

  ### Investigation Steps

  - **Examine registry modifications:** Review the Windows registry at `HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\` or `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\` for recent changes to any of the target keys. Look for last modified timestamps that correlate with the alert.

  - **Identify malicious indicators:** Check for a DWORD value of `0x00000001` for `HideClock`, `HideScanHealth`, `HideSCANetwork`, etc. These specific changes are commonly associated with malware behavior and warrant immediate investigation.

  - **Assess legitimate admin activities:** Determine if any recent administrative scripts or group policies were executed that may explain the changes. Look for entries in PowerShell or CMD logs (Event ID 4688) that may correspond to registry modification tasks.

  - **Review process execution logs:** Correlate the registry modification time with Windows Security Event ID 4688 (process creation) to identify any suspicious command line activities or known malicious executables.

  - **Confirm system roles and asset criticality:** Investigate changes on critical systems such as domain controllers or file servers where visibility into registry settings is essential. Changes on endpoints may be less critical but still warrant review depending on the user context.

  - **Check for high-confidence persistence mechanisms:** Identify if any additional persistence mechanisms, such as Scheduled Tasks or Startup items, were modified around the same timeframe as the registry changes. Look for Event IDs 4698 (Task Creation) or 4697 (Service Installation).

  ---

  ### Prioritization

  This alert is categorized as medium severity due to the potential for significant impact if the affected system is critical, such as a server hosting sensitive applications. The likelihood of malicious abuse is moderate, as attackers frequently utilize registry manipulation to conceal their actions. Additionally, the technique used is commonly weaponized in various malware families.

  ---

  ### Blind Spots and Assumptions

  Detection may be limited by user permissions; if logs aren't collected with sufficient detail, critical registry modifications might go unnoticed. Evasion techniques could include legitimate admin user activities or systems management tools modifying these settings without raising suspicion. Furthermore, legitimate administrative tools may invoke similar registry changes, necessitating context for accurate assessment. A companion detection for related scheduled tasks (T1053) would enhance overall coverage of persistence mechanisms.

