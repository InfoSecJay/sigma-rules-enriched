title: Scheduled TaskCache Change by Uncommon Program
id: 4720b7df-40c3-48fd-bbdf-fd4b3c464f0d
status: test
description: Monitor the creation of a new key under 'TaskCache' when a new 
  scheduled task is registered by a process that is not svchost.exe, which is 
  suspicious
references:
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
- https://labs.f-secure.com/blog/scheduled-task-tampering/
author: Syed Hasan (@syedhasan009)
date: 2021-06-18
modified: 2025-10-22
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053
- attack.t1053.005
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_other:
    TargetObject|contains:
    - 'Microsoft\Windows\UpdateOrchestrator'
    - 'Microsoft\Windows\SoftwareProtectionPlatform\SvcRestartTask\Index'
    - 'Microsoft\Windows\Flighting\OneSettings\RefreshCache\Index'
  filter_main_mousocoreworker:
    Image|endswith: 'C:\Windows\System32\MoUsoCoreWorker.exe'
  filter_main_services:
    Image|endswith: 'C:\Windows\System32\services.exe'
  filter_main_tiworker:
    Image|startswith: 'C:\Windows\'
    Image|endswith: '\TiWorker.exe'
  filter_main_svchost:
    Image: 'C:\WINDOWS\system32\svchost.exe'
  filter_main_ngen:
    Image|startswith: 'C:\Windows\Microsoft.NET\Framework'     # \Framework\ and \Framework64\
    Image|endswith: '\ngen.exe'
    TargetObject|contains:
    - '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks\{B66B135D-DA06-4FC4-95F8-7458E1D10129}'
    - '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\Microsoft\Windows\.NET
      Framework\.NET Framework NGEN'
  filter_main_office:
    Image:
    - 'C:\Program Files\Microsoft Office\root\Integration\Integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\Integration\Integrator.exe'
    - 'C:\Program Files\Common Files\microsoft shared\ClickToRun\OfficeC2RClient.exe'
    - 'C:\Program Files (x86)\Common Files\microsoft shared\ClickToRun\OfficeC2RClient.exe'
  filter_main_msiexec:
    Image: 'C:\Windows\System32\msiexec.exe'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
    TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\Microsoft\Windows\PLA\Server
      Manager Performance Monitor\'
  filter_main_system:
    Image: 'System'
  filter_main_runtimebroker:
    Image: 'C:\Windows\System32\RuntimeBroker.exe'
  filter_optional_dropbox_updater:
    Image:
    - 'C:\Program Files (x86)\Dropbox\Update\DropboxUpdate.exe'
    - 'C:\Program Files\Dropbox\Update\DropboxUpdate.exe'
  filter_optional_edge:
    Image|endswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeUpdate\MicrosoftEdgeUpdate.exe'
    - 'C:\Program Files\Microsoft\EdgeUpdate\MicrosoftEdgeUpdate.exe'
  filter_optional_onedrive:
    Image|endswith:
    - 'C:\Program Files (x86)\Microsoft OneDrive\OneDrive.exe'
    - 'C:\Program Files\Microsoft OneDrive\OneDrive.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ### Technical Context

  This Sigma rule detects the creation of a new registry key under 'TaskCache' when a scheduled task is registered by a process that is not a known Windows system process (e.g., `svchost.exe`, `services.exe`, or others specified). Attackers often create malicious scheduled tasks to maintain persistence or execute payloads in a covert manner, bypassing traditional security controls. The MITRE ATT&CK tactic relevant here is **Persistence** (TA0003) and technique **Scheduled Task/Job** (T1053).

  Primary telemetry sources include Windows Registry logs, specifically monitoring `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache`. If this behavior is indeed malicious, it could lead to unauthorized execution of scripts or programs on the system, compromising the environment. Importantly, this detection does NOT confirm malicious intent on its own; legitimate applications may also create scheduled tasks under certain conditions.

  ### Investigation Steps

  - **Review registry changes**: Check for the creation event in `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache` using Registry Event logs (Event ID 4657). Verify if the process generation was from an expected application or anomalous process.

  - **Identify the creating process**: Investigate the associated process name that triggered the registry change. Monitor for processes not listed in the allowed filters (e.g., `svchost.exe`, `services.exe`). This can indicate potential malicious activity.

  - **Query system event logs**: Compare against Windows Security Event logs (Event ID 4688) or Sysmon Event ID 1 to obtain event details regarding the creation of the suspicious process. Look for unusual parent-child relationships that deviate from normal patterns.

  - **Validate scheduled task details**: Use the `schtasks` command or review Task Scheduler logs to determine the executed task's details, including its name, schedule, and action path. Anomalies in these tasks (e.g., unusual execution times or unrecognized filenames) may indicate malicious intent.

  - **Examine legitimate activity**: Identify common legitimate applications or services that often create tasks in the `TaskCache`. Prioritize reviewing those processes to validate their scheduled tasks to ensure they align with standard operational practices.

  - **Cross-reference with threat intelligence**: Consult threat intelligence feeds or reports to check if the process name corresponds with known malicious activity or APT techniques (e.g., Sodinokibi ransomware as referenced).

  ### Prioritization

  The severity of this alert is high due to its potential impact on system integrity and security. Uncommon executable processes registering tasks could indicate a serious threat actor's attempt to gain persistence. This behavior is often weaponized in various attack vectors, making immediate investigation critical.

  ### Blind Spots and Assumptions

  Detection may be limited if certain registry monitoring is not enabled, or logging policies are misconfigured. Legitimate applications (such as backup solutions or update mechanisms) may also create scheduled tasks, leading to false positives. To enhance detection, consider companion rules that monitor unusual process creation patterns or anomalous system behavior, which can help in corroborating findings related to persistence mechanisms.

