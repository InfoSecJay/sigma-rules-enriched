title: Scheduled TaskCache Change by Uncommon Program
id: 4720b7df-40c3-48fd-bbdf-fd4b3c464f0d
status: test
description: Monitor the creation of a new key under 'TaskCache' when a new scheduled
  task is registered by a process that is not svchost.exe, which is suspicious
references:
- https://thedfirreport.com/2021/03/29/sodinokibi-aka-revil-ransomware/
- https://labs.f-secure.com/blog/scheduled-task-tampering/
author: Syed Hasan (@syedhasan009)
date: 2021-06-18
modified: 2025-10-22
tags:
- attack.privilege-escalation
- attack.execution
- attack.persistence
- attack.t1053
- attack.t1053.005
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: 'SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
  filter_main_empty:
    Details: '(Empty)'
  filter_main_null:
    Details:
  filter_main_other:
    TargetObject|contains:
    - 'Microsoft\Windows\UpdateOrchestrator'
    - 'Microsoft\Windows\SoftwareProtectionPlatform\SvcRestartTask\Index'
    - 'Microsoft\Windows\Flighting\OneSettings\RefreshCache\Index'
  filter_main_mousocoreworker:
    Image|endswith: 'C:\Windows\System32\MoUsoCoreWorker.exe'
  filter_main_services:
    Image|endswith: 'C:\Windows\System32\services.exe'
  filter_main_tiworker:
    Image|startswith: 'C:\Windows\'
    Image|endswith: '\TiWorker.exe'
  filter_main_svchost:
    Image: 'C:\WINDOWS\system32\svchost.exe'
  filter_main_ngen:
    Image|startswith: 'C:\Windows\Microsoft.NET\Framework'     # \Framework\ and \Framework64\
    Image|endswith: '\ngen.exe'
    TargetObject|contains:
    - '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tasks\{B66B135D-DA06-4FC4-95F8-7458E1D10129}'
    - '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\Microsoft\Windows\.NET
      Framework\.NET Framework NGEN'
  filter_main_office:
    Image:
    - 'C:\Program Files\Microsoft Office\root\Integration\Integrator.exe'
    - 'C:\Program Files (x86)\Microsoft Office\root\Integration\Integrator.exe'
    - 'C:\Program Files\Common Files\microsoft shared\ClickToRun\OfficeC2RClient.exe'
    - 'C:\Program Files (x86)\Common Files\microsoft shared\ClickToRun\OfficeC2RClient.exe'
  filter_main_msiexec:
    Image: 'C:\Windows\System32\msiexec.exe'
  filter_main_explorer:
    Image: 'C:\Windows\explorer.exe'
    TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\Microsoft\Windows\PLA\Server
      Manager Performance Monitor\'
  filter_main_system:
    Image: 'System'
  filter_main_runtimebroker:
    Image: 'C:\Windows\System32\RuntimeBroker.exe'
  filter_optional_dropbox_updater:
    Image:
    - 'C:\Program Files (x86)\Dropbox\Update\DropboxUpdate.exe'
    - 'C:\Program Files\Dropbox\Update\DropboxUpdate.exe'
  filter_optional_edge:
    Image|endswith:
    - 'C:\Program Files (x86)\Microsoft\EdgeUpdate\MicrosoftEdgeUpdate.exe'
    - 'C:\Program Files\Microsoft\EdgeUpdate\MicrosoftEdgeUpdate.exe'
  filter_optional_onedrive:
    Image|endswith:
    - 'C:\Program Files (x86)\Microsoft OneDrive\OneDrive.exe'
    - 'C:\Program Files\Microsoft OneDrive\OneDrive.exe'
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Unknown
level: high
note: |
  ---

  ### Technical Context

  This rule detects the creation of a new registry key under 'TaskCache' when a scheduled task is registered by an uncommon program, which likely indicates an attempt to persist and execute malicious payloads. The objective of an attacker triggering this behavior is typically to gain persistence on the system to execute tasks without detection. The relevant MITRE ATT&CK techniques for this detection include Persistence (T1053) and Scheduled Tasks (T1053.005). The primary telemetry source is Windows registry activity, specifically changes to the registry under `SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache`. If this behavior is malicious, it could lead to unauthorized task executions, data exfiltration, or further compromise of the network. It is important to note that this detection does NOT confirm malicious intent on its own—it merely indicates that an uncommon program has created a scheduled task.

  ---

  ### Investigation Steps

  - **Identify the process creating the scheduled task:** Check for the registry key creation in Windows Security Event ID 4657 or Sysmon Event ID 5. Look for `TargetObject` fields containing `SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\` and review the `Image` field for less common executables.

  - **Confirm legitimate scheduled tasks:** Review recent scheduled tasks using PowerShell command `Get-ScheduledTask` to verify any legitimate tasks that may appear in the TaskCache. Commonly expected programs include `msiexec.exe`, `svchost.exe`, and those from Microsoft Office.

  - **Flag uncommon executables:** Pay attention to the `Image` field in the logs for any non-standard executables (e.g., those not in the predefined benign filters) that register a task. Unknown or suspicious programs may indicate malicious activity.

  - **Check event history around the alert timestamp:** Investigate other related events surrounding the time of the alert, such as Security Event IDs 4688 (process creation) and 4689 (process termination), to get context on other processes launching and terminating around the same period.

  - **Validate recent registry changes:** Use `Reg.exe` or the Registry Editor to check for any unusual entries under the TaskCache that align with the alert, including creation or modification timestamps that may link to malicious activity.

  - **Analyze potential post-exploitation actions:** If a less common executable is confirmed, assess its behavior further by checking for unusual network connections or file creations post scheduled task setup—look for signs using Sysmon Event ID 3 for network connections.

  ---

  ### Prioritization

  This alert should be treated with high priority due to the potential for a malicious process to establish persistence on a critical system. The behavior detected is consistent with techniques commonly leveraged in malware campaigns, particularly those intending to maintain long-term access to compromised systems.

  ---

  ### Blind Spots and Assumptions

  Detection may miss events if log retention is inadequate or if the malicious program employs anti-detection techniques, such as spoofing legitimate processes. Additionally, legitimate applications may schedule tasks without being logged, potentially generating false positives. Enhancing detection may benefit from companion detections, such as monitoring for suspicious network activity from newly created scheduled tasks, which may indicate active exploitation or lateral movement.

