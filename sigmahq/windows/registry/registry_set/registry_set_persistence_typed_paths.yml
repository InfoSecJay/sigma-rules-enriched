note: |
  ### Technical Context

  This rule detects modifications to the 'TypedPaths' registry key within the Windows operating system, specifically identifying changes made by non-standard applications. The presence of these modifications can indicate an attempt at persistence by an attacker, potentially allowing them to execute malicious code upon user login or command execution in the future. This behavior maps to the MITRE ATT&CK tactic of Persistence (T1547) and specifically the technique of Registry Run Keys / Startup Folder (T1547.001).

  Primary telemetry sources include Windows Registry logs associated with registry modification events. The security impact of such modifications can be significant, as they may enable continuous access to a compromised system. It is crucial to note that while this detection indicates a potentially suspicious activity, it does NOT confirm that an intrusion has occurred, as legitimate applications could also modify this registry key.

  ### Investigation Steps

  - **Check registry modification details:** Review the Registry event logs (Security Event ID 4657) around the time of the alert to identify which non-standard application modified the 'TypedPaths' key and extract the `NewValue` and `OldValue` fields.

  - **Analyze associated processes:** Investigate the process that triggered the registry modification using Sysmon Event ID 1 (Process Creation). Cross-reference the image name with known trusted applications versus unknown files or those with suspicious signatures.

  - **Evaluate typical user behavior:** Identify the user account involved in the modification. Compare this against expected behavior, such as frequent execution of standard applications like `explorer.exe`, which should not typically trigger this alert from non-standard sources.

  - **Identify high-confidence indicators:** Search for instances in the logs (Event ID 4657) where the 'TypedPaths' key was altered significantly, such as suspicious URLs or commands that do not align with standard organizational practices.

  - **Review for legitimate alterations:** Consider whether the modification to the 'TypedPaths' key aligns with any planned administrative tasks or documented changes to user profiles or system settings that are commonly conducted within your organization.

  - **Monitor for file creation or execution attempts:** Validate logs for any file creation or execution events (Security Event ID 4688 - Process Creation) that correlate with the identified non-standard application making changes to the 'TypedPaths' key to check for potential malicious activity.

  ### Prioritization

  This alert is high priority due to the potential for persistent threats when unauthorized modifications are made to registry keys. The likelihood of malicious abuse is notable, as attackers often use similar methods to maintain footholds within compromised environments. Furthermore, persistence mechanisms, such as those reflected in the modification of the 'TypedPaths' key, are commonly weaponized in advanced attacks.

  ### Blind Spots and Assumptions

  This detection method may not capture all evasion techniques, especially if attackers utilize legitimate applications to perform registry modifications. It is critical that all necessary log sources, particularly for registry changes, are correctly configured for reliable detection. Legitimate system maintenance tasks or software installations might also trigger this alert, such as updates to enterprise applications. Companion detections could include monitoring for related registry behaviors (e.g., T1547.002 - Service Registry) to enhance overall coverage and context.

