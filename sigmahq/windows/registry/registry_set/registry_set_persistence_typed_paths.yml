note: |
  ### Technical Context
  This rule detects modifications made to the Windows Registry, specifically targeting the `TypedPaths` key under `HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\`. These changes may be performed by non-standard applications and could indicate an attempt at persistence by an attacker seeking to maintain access to a compromised system. By modifying the `TypedPaths`, an adversary can influence the behavior of system features or launch malicious payloads when a user interacts with specific applications or files.

  The primary threat scenario here involves unauthorized changes that persist across sessions, allowing attackers to execute arbitrary commands or scripts without direct user interaction. This aligns with the MITRE ATT&CK tactics of **Persistence** (TA0003) and specifically the technique **Registry Run Keys / Startup Folder** (T1060) as attackers may utilize the registry for establishing and maintaining footholds in a networked environment.

  The best telemetry sources to monitor for this type of activity include Windows Registry set logs, which track changes to registry keys. Additionally, process creation events and application activity logs may provide context regarding the applications involved in these modifications.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent modifications to the `TypedPaths` registry key in the Windows Registry. Look for any unusual entries, especially those created by non-standard applications.
  - **Analyze Process Execution:** Investigate process creation events around the time of the registry modification to identify which executables performed the actions. Pay particular attention to any instances of `explorer.exe` executing with suspicious arguments.
  - **Correlate Application Logs:** Check application logs for any related activities or errors occurring shortly before or after these registry changes to gather more context about the applications involved.
  - **Verify User Context:** Determine the user account under which the registry modifications were made. Look for any anomalous behavior associated with that user, such as failed login attempts or unusual access patterns.

  ### Prioritization
  The alert is considered high severity due to the potential impact of persistent threats in an enterprise environment. Attackers leveraging persistence mechanisms can maintain access to compromised systems, complicating remediation efforts and increasing the risk of data breaches.

  ### Blind Spots and Assumptions
  Current detection logic might not capture all persistence attempts, as attackers can use various methods to modify registry keys. It assumes that non-standard applications will always be involved in the modification, potentially missing legitimate alterations made by authorized software. For the alert to function effectively, it requires comprehensive logging of registry changes and sufficient privileges to monitor modifications to the Windows Registry.

