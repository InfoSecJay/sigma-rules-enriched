logsource:
  category: registry_set
  product: windows
detection:
  winsock_parameters_base:
    TargetObject|contains: '\System\CurrentControlSet\Services\WinSock2\Parameters'
  winsock_parameters:
    TargetObject|contains:
    - '\Protocol_Catalog9\Catalog_Entries'
    - '\NameSpace_Catalog5\Catalog_Entries'
  filter:
  - Details: '(Empty)'
  - Image: 'C:\Windows\System32\MsiExec.exe'
  - Image: 'C:\Windows\syswow64\MsiExec.exe'
  condition: winsock_parameters_base and winsock_parameters and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows registry keys associated with the WinSock2 autostart extensibility point (ASEP). The likely attacker objective is to maintain persistence on a compromised system, which can allow for arbitrary code execution upon system startup or user logon. This behavior falls under the MITRE ATT&CK tactic for Persistence, specifically the technique T1547.001 (Registry Run Keys / Startup Folder).

  The primary telemetry sources for this detection are Windows Registry logs, particularly any modifications to keys under the path `\System\CurrentControlSet\Services\WinSock2\Parameters`. If malicious, this activity can indicate unauthorized program execution and system compromise. Importantly, this detection does not confirm that the activity is malicious on its own, as legitimate software installations or administrative actions may also modify these keys.

  ### Investigation Steps

  - **Check registry modifications: ** Review registry log entries for Event ID 4657, specifically targeting the `\System\CurrentControlSet\Services\WinSock2\Parameters` path to identify recent modifications. Look for unexpected values or entries.

  - **Validate process context: ** Review Event ID 4688 (Process Creation) logs to trace parent processes associated with registry changes. Identify if the modification was initiated by `MsiExec.exe`, which could indicate legitimate or suspicious activity. Monitor for unfamiliar parent processes.

  - **Identify installed software: ** Use PowerShell or system tools to verify legitimate software installations. Compare registry changes against known software setups to distinguish between benign and malicious behavior.

  - **Document recent user activities: ** Correlate the timing of registry modifications with user actions, such as software installations or system updates, to mark legitimate versus suspicious activity.

  - **Investigate autostart behavior: ** For high-confidence indicators of compromise, assess any executables registered to load on system startup. Look for entries in `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Run` and flagged executables that do not match known software signatures.

  ### Prioritization

  This alert holds medium severity in an enterprise context as it indicates possible persistence mechanisms that could be utilized during an attack. With legitimate software often triggering similar modifications, it reinforces the need to analyze context carefully. However, the risk of malicious abuse is significant, particularly if commonly weaponized techniques are involved.

  ### Blind Spots and Assumptions

  Detection may be limited by the use of alternative techniques such as DLL side-loading or leveraging different persistence methods that do not modify these keys. Reliable detection requires comprehensive registry monitoring, and if logging is not enabled, legitimate activities could mask malicious actions. Additionally, footprints from legitimate administrative actions may inadvertently trigger alerts, necessitating contextual review. Related detections for enhanced coverage include tracking changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Run` or monitoring for execution anomalies involving `MsiExec.exe`.

