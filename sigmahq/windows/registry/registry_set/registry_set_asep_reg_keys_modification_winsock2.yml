logsource:
  category: registry_set
  product: windows
detection:
  winsock_parameters_base:
    TargetObject|contains: '\System\CurrentControlSet\Services\WinSock2\Parameters'
  winsock_parameters:
    TargetObject|contains:
    - '\Protocol_Catalog9\Catalog_Entries'
    - '\NameSpace_Catalog5\Catalog_Entries'
  filter:
  - Details: '(Empty)'
  - Image: 'C:\Windows\System32\MsiExec.exe'
  - Image: 'C:\Windows\syswow64\MsiExec.exe'
  condition: winsock_parameters_base and winsock_parameters and not filter
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This detection rule identifies modifications to Autostart Extensibility Points (ASEP) in the Windows Registry related to WinSock2. Modifications to these registry keys can indicate an attempt by threat actors to establish persistence within a compromised system, enabling malicious activities to persist even after reboots or other system changes. Attackers may aim to exploit these settings to maintain control over a system, execute payloads, or facilitate lateral movement within a network.

  The related MITRE ATT&CK tactics and techniques for this rule include **Persistence** (TA0003) via **T1547.001 - Boot or Logon Autostart Execution: Windows Service**. This technique involves creating or modifying autostart settings to launch malicious binaries, which can be tied to other activities such as privilege escalation or command-and-control (C2) communication.

  The primary data sources for effective detection include Windows Registry logs that capture changes made to keys under `\System\CurrentControlSet\Services\WinSock2\Parameters` and related subkeys. These logs provide crucial evidence of unauthorized modifications that may signify malicious intent.

  ### Investigation Steps
  - **Review Registry Logs**: Examine the Windows Registry logs for changes made to `\System\CurrentControlSet\Services\WinSock2\Parameters`, as well as `\Protocol_Catalog9\Catalog_Entries` and `\NameSpace_Catalog5\Catalog_Entries`.

  - **Analyze Process Creation Events**: Look for suspicious process creation events, particularly regarding `MsiExec.exe`, as the presence of this executable in registry modifications could indicate abuse for malicious purposes.

  - **Identify Contextual Indicators**: Check for other indicators of compromise that may accompany registry changes, such as unusual network connections or the use of uncommon administrative tools that could correlate with potential malicious activity.

  - **Cross-reference with Known Threats**: Investigate any identified modifications against known malware behaviors or threat actor tactics that leverage similar registry manipulation for persistence, such as specific strains of malware or APTs.

  ### Prioritization
  The severity of this alert is considered medium due to the potential impact of unauthorized persistence mechanisms on enterprise systems. Modifications to autostart registry keys can enable adversaries to maintain a presence within the environment, increasing the likelihood of further exploitation.

  ### Blind Spots and Assumptions
  A potential gap in detection coverage lies in the legitimacy of registry modifications by trusted software or administrator actions, which may lead to false positives. The detection logic assumes that any modification to designated WinSock2 registry keys outside of expected legitimate usage is malicious. Additionally, this alert relies on the availability of detailed Windows Registry logs; ensure that logging configurations are properly set to capture all necessary changes for effective detection.

