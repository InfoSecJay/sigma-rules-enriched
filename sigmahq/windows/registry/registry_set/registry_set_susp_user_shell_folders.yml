note: |
  ### Technical Context
  This detection rule is designed to identify modifications to the User Shell Folders registry values related to the Startup and Common Startup paths. Attackers may exploit this capability to set these paths to point towards malicious executables or scripts, which will execute automatically during system startup. The presence of these modifications can indicate persistent threats where adversaries aim to maintain control over a compromised machine.

  The suspected threat behavior aligns with persistence techniques as defined in the MITRE ATT&CK framework, specifically under the Persistence tactic, utilizing the technique listed as T1547.001. This technique encompasses the manipulation of startup configuration, allowing an attacker to ensure that their payload executes without user intervention. Other potential techniques related to privilege escalation and lateral movement may also be relevant, highlighting a need for vigilant monitoring of such changes.

  The primary data sources necessary for this detection include Windows registry logs, specifically tracking changes to the keys associated with User Shell Folders. By focusing on these logs, security teams can uncover anomalies indicative of malicious activity aimed at sustaining unauthorized access or furthering an attacker's objectives.

  ### Investigation Steps
  - **Review Registry Logs**: Examine Windows registry logs for modifications to `HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders` and `HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders`. Look specifically for changes targeting Startup paths.

  - **Analyze Process Creation Events**: Investigate associated process creation events to determine if any newly registered startup applications correlate with recent registry modifications. Focus on execution paths that lead back to modification logs.

  - **Check for Malicious Items**: Query for known malicious scripts or executables that may be launched from the modified paths. Use threat intelligence feeds to cross-reference any associated indicators of compromise.

  - **Evaluate User Behavior**: Monitor user activities and behavior on affected systems. Look for anomalous logins or unusual user patterns that may indicate an attacker is attempting to leverage the persistence mechanism.

  ### Prioritization
  Given the high likelihood of an attacker using this technique to maintain persistence on compromised systems, any alerts generated should be prioritized for immediate investigation. The impact of such persistent threats can be significant, making swift responses necessary in an enterprise environment.

  ### Blind Spots and Assumptions
  This detection may have blind spots if required registry audit logging is not enabled, or if system configurations differ from standard Windows installations. Additionally, the detection logic assumes that legitimate user actions do not frequently involve modifications to the Startup paths in the User Shell Folders registry. It is also important that permissions and access controls are configured to log appropriate registry changes; otherwise, necessary evidence may be missing.

