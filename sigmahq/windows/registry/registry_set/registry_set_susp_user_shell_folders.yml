note: |
  ### Technical Context

  This rule detects modifications to User Shell Folders registry keys specifically targeting the Startup or Common Startup values. Attackers often alter these registry settings to ensure that malicious executables or scripts are run automatically during system startup, thereby creating a persistent presence on the compromised system. This behavior aligns with the MITRE ATT&CK persistence technique T1547.001 (Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder).

  The primary telemetry source for this detection is Windows registry change events, specifically logs associated with registry modifications. A successful malicious alteration could lead to unauthorized execution of code on the system, significantly enhancing the attacker’s foothold. Importantly, this detection does not confirm malicious intent on its own; further investigation is necessary to assess the context of the modification.

  ### Investigation Steps

  - **Verify registry change source:**
    Investigate where the modification originated from by checking the Security Event ID 4663 (An attempt was made to access an object) to identify the user and process that made the change.

  - **Check registry values:**
    Inspect the modified registry values under `HKEY_CURRENT_USER\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders` and `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders` to identify any references pointing to unusual or malicious paths.

  - **Determine normal user behavior:**
    Review the logs of expected user activities to determine legitimate usage patterns of the Startup folder. Normal values typically include `%USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup`.

  - **Correlate with process execution logs:**
    Analyze Security Event ID 4688 (A new process has been created) to correlate the execution of any suspicious processes with the timeline of the registry modification to confirm if malicious payloads are being executed.

  - **Review other related log sources:**
    Examine Windows Event Logs for Application and System logs around the time of the change for any anomalies, such as failed logon attempts or unexpected application behaviors which may suggest a broader compromise.

  - **Look for additional persistence mechanisms:**
    Investigate related detections, especially those matching similar persistence mechanisms, such as other registry modifications or scheduled task creations (e.g., Event ID 4698) that could indicate a more elaborate persistence strategy.

  ### Prioritization

  The severity of this alert is high given that the affected systems are likely critical to business operations. The modification of startup registry keys is a commonly weaponized tactic used by threat actors to establish persistence and maintain control over a compromised environment.

  ### Blind Spots and Assumptions

  This detection may be evaded by legitimate software that modifies startup behavior, potentially leading to false positives. Additionally, a reliable detection setup requires properly configured Windows logging, particularly for registry access events. Legitimate administrative actions or software installations may also trigger the alert. Related detections, such as monitoring for changes to scheduled tasks or services, provide complementary coverage against additional persistence methods.

