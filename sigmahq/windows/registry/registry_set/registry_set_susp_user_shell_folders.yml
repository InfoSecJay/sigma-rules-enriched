note: |
  ---

  ### Technical Context

  This rule detects modifications to the User Shell Folders registry values specifically targeting Startup or Common Startup directories. Such alterations are typically executed by attackers seeking to establish persistence on a compromised host by redirecting startup paths to malicious payloads, meaning the malicious executables will trigger each time the user logs in. The behavior aligns with the MITRE ATT&CK technique T1547.001 (Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder). The primary telemetry sources are Windows Registry change events captured through Event IDs related to registry modifications, specifically in the context of `registry_set` operations.

  If malicious, these actions can lead to unauthorized code execution at startup, allowing the adversary to maintain control over the system or execute further malicious tasks. Importantly, this detection does NOT alone confirm compromise; legitimate applications may alter registry keys as part of their normal functionality.

  ---

  ### Investigation Steps

  - **Review registry modification logs:** Examine Windows Event ID 4657 (Registry Value Modified) for changes related to the User Shell Folders registry paths. Confirm that the modification was not initiated by known benign processes or software.

  - **Identify the process responsible:** Correlate Event ID 4688 (Process Creation) with the corresponding registry modification to ascertain the parent process that made the change. Analyze the executable name and path for legitimacy versus known malicious indicators.

  - **Validate expected behavior:** Cross-reference any legitimate applications that may modify Startup folder values—applications like secondary antivirus or backup tools. These may be documented in your organization’s change management logs.

  - **Examine process startup entries:** For changed paths, check the contents of the targeted startup folders using File Explorer or scripting (e.g., PowerShell) to list files in `%USERPROFILE%\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup` for any unauthorized or suspicious files.

  - **Monitor for additional indicators of persistence:** Look for related registry keys under the Software and Microsoft namespaces for other persistence methods, such as `Run` or `RunOnce` values. Investigate any suspicious entries further using Event ID 4657.

  - **Consult historical data for anomalies:** Search for previous modifications to the same registry paths in the last 30 days to identify patterns—whether this has happened before and if so, under what context.

  ---

  ### Prioritization

  This alert is high-severity due to the potential for malicious persistence on critical user endpoints. Given the established patterns of adversary behavior in compromising systems, the likelihood of abuse is elevated, particularly if the impacted systems hold sensitive information or are central to business operations.

  ---

  ### Blind Spots and Assumptions

  There may be false positives from legitimate activities involving third-party applications that also modify startup execution paths. The effectiveness of this detection depends significantly on having comprehensive logging in place for registry modifications; missing logs may hinder accurate detection and analysis. Additionally, it is worth noting that adversaries may employ other persistence techniques that are not captured by this rule, such as scheduled tasks or file system changes. The companion detection of suspicious process creation (Event ID 4688) is recommended to bolster coverage of potential malicious activity.

