title: Disable Windows Event Logging Via Registry
id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
status: test
description: Detects tampering with the "Enabled" registry key in order to 
  disable Windows logging of a Windows event channel
references:
- https://twitter.com/WhichbufferArda/status/1543900539280293889
- https://github.com/DebugPrivilege/CPP/blob/c39d365617dbfbcb01fffad200d52b6239b2918c/Windows%20Defender/RestoreDefenderConfig.cpp
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-04
modified: 2024-03-25
tags:
- attack.defense-impairment
- attack.t1685.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000000)'
  filter_main_wevutil:
    Image: 'C:\Windows\system32\wevtutil.exe'     # FP generated during installation of manifests via wevtutil
  filter_main_iis:
    Image|startswith: 'C:\Windows\winsxs\'
    Image|endswith: '\TiWorker.exe'      # Many different TargetObjects
  filter_main_svchost:
    Image: 'C:\Windows\System32\svchost.exe'
    TargetObject|contains:
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-FileInfoMinifilter'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-ASN1\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Kernel-AppCompat\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Runtime\Error\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-CAPI2/Operational\'
  filter_main_trusted_installer:
    Image: C:\Windows\servicing\TrustedInstaller.exe
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Compat-Appraiser'
  filter_optional_empty:   # This filter is related to aurora. Should be removed when fix is deployed. # TODO: Remove later
    Image: ''
  filter_optional_null:   # This filter is related to aurora. Should be removed when fix is deployed. # TODO: Remove later
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Rare falsepositives may occur from legitimate administrators disabling 
  specific event log for troubleshooting
level: high
note: |
  ### Technical Context

  This Sigma rule detects modifications to the Windows Registry that disable event logging for specific Windows event channels. Attackers may implement this to obscure their actions, covering their tracks by preventing the logging of abnormal activities or event data. The relevant MITRE ATT&CK tactic is "Defense Evasion," particularly technique T1685.001, which involves disabling logging to impair detection mechanisms.

  The primary telemetry sources include the Windows Registry logs with a focus on the modification of `\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Enabled` keys, specifically set to `DWORD (0x00000000)`. If malicious, this behavior severely impacts security monitoring and incident response capabilities, leading to increased dwell time for potential compromises. This alert does NOT confirm active malicious behavior on its own; it simply indicates a modification to logging settings, which can occur legitimately.

  ### Investigation Steps

  - **Identify the Registry change:** Examine the Windows Registry for modifications to the key `HKEY_LOCAL_MACHINE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\<ChannelName>\Enabled` for any unexpected `DWORD (0x00000000)` values. Collect logs showing the change (Event ID 4657 for registry modifications).

  - **Correlate with process activity:** Check for associated process activity by reviewing Security Event ID 4688 logs to identify the process creating the Registry change. Look specifically for instances of `wevtutil.exe`, `svchost.exe`, or `TrustedInstaller.exe`.

  - **Evaluate legitimate usage patterns:** Consider that administrators may turn off logging for specific channels during troubleshooting. Investigate if there were any documented maintenance activities at the same time as the event occurred, especially regarding the channels mentioned in the alerts.

  - **Check for historical modifications:** Use command-line tools or scripts to query the Event Logs for a history of modifications to the same Registry keys, focusing on timestamps and preceding events that could indicate a change made by potentially malicious entities.

  - **Identify high-confidence indicators:** Look for evidence of lateral movement or other commands related to event log tampering, such as the presence of suspicious powershell commands or batch scripts executed around the time of the Registry modification (Event ID 4104 for PowerShell).

  ### Prioritization

  This alert is of **high severity** as it indicates potential tampering with logging mechanisms, which directly undermines the organization's ability to detect and respond to security incidents. The likelihood of malicious exploitation is significant, especially given the common use of event log disabling in various attack scenarios.

  ### Blind Spots and Assumptions

  Detection may be limited by the possible use of evasive techniques, such as modifying Registry keys in rapid succession to evade logging. Reliable detection requires comprehensive logging of Registry changes. Legitimate activities that may trigger this alert include administration tasks where event logging is intentionally disabled for troubleshooting. A companion detection to strengthen coverage could include alerting on the execution of event manipulation tools like `wevtutil.exe` in unusual contexts or without system administrator involvement.

