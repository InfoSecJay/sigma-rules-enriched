title: Disable Windows Event Logging Via Registry
id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
status: test
description: Detects tampering with the "Enabled" registry key in order to disable
  Windows logging of a Windows event channel
references:
- https://twitter.com/WhichbufferArda/status/1543900539280293889
- https://github.com/DebugPrivilege/CPP/blob/c39d365617dbfbcb01fffad200d52b6239b2918c/Windows%20Defender/RestoreDefenderConfig.cpp
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-04
modified: 2024-03-25
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000000)'
  filter_main_wevutil:
    Image: 'C:\Windows\system32\wevtutil.exe'     # FP generated during installation of manifests via wevtutil
  filter_main_iis:
    Image|startswith: 'C:\Windows\winsxs\'
    Image|endswith: '\TiWorker.exe'      # Many different TargetObjects
  filter_main_svchost:
    Image: 'C:\Windows\System32\svchost.exe'
    TargetObject|contains:
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-FileInfoMinifilter'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-ASN1\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Kernel-AppCompat\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Runtime\Error\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-CAPI2/Operational\'
  filter_main_trusted_installer:
    Image: C:\Windows\servicing\TrustedInstaller.exe
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Compat-Appraiser'
  filter_optional_empty:   # This filter is related to aurora. Should be removed when fix is deployed. # TODO: Remove later
    Image: ''
  filter_optional_null:   # This filter is related to aurora. Should be removed when fix is deployed. # TODO: Remove later
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Rare falsepositives may occur from legitimate administrators disabling specific
  event log for troubleshooting
level: high
note: |
  ### Technical Context
  This detection rule monitors for unauthorized modifications to the Windows registry, specifically targeting the "'Enabled'" registry value associated with Windows Event Logging channels. An attacker may attempt to disable Windows event logging to evade detection during their malicious activities, thereby hindering the ability to track and respond to unwanted actions on the system. This behavior is often part of broader tactics employed during the later stages of an attack cycle where the threat actors strive to maintain persistence and cover their tracks.

  The relevant MITRE ATT&CK tactics for this detection include **Defense Evasion (TA0005)** and more specifically the technique **Indicator Removal on Host (T1562.002)**. By disabling event logging, attackers aim to prevent the logging of crucial forensic data, which could be instrumental in the identification and remediation of a breach.

  Primary data sources that provide valuable evidence include **Windows registry logs**, which track changes to registry keys, and potentially **Windows event logs** that may indicate if logging has been tampered with. Anomalies in these logs can help identify malicious behavior attempting to disable event logging.

  ### Investigation Steps
  - **Review Registry Changes:** Check the Windows registry for changes to the "Enabled" value within the event log channel paths. Focus on timestamps and user accounts associated with these changes to identify potential unauthorized alterations.
  - **Analyze Event Logs:** Examine Windows security and application event logs for any activity coinciding with the time of registry modifications. Look for events indicating administrative access or any processes that could have made the changes.
  - **Identify Running Processes:** Investigate if any of the processes involved in the registry alteration (e.g., `wevtutil.exe`, `TrustedInstaller.exe`, or `svchost.exe`) are running from unusual locations or executed by unauthorized accounts.
  - **Correlate with User Activity:** Cross-reference the detected activity with user access logs to determine if the changes originated from legitimate administrative actions or potentially from compromised accounts.

  ### Prioritization
  This alert is marked as high severity due to the significant implications of disabling event logging. Such actions can directly impact forensic investigations following an incident, allowing malicious actors to operate more freely within the network.

  ### Blind Spots and Assumptions
  One potential blind spot in this detection is the possibility of legitimate administrators disabling logging for specific troubleshooting activities, which may lead to rare false positives. The detection logic assumes that any modification to the "Enabled" key is malicious unless it is accompanied by recognized legitimate process execution patterns. To ensure proper functionality, it is essential to have full registry logging enabled and the collection of relevant Windows event logs consistently configured within the logging framework.

