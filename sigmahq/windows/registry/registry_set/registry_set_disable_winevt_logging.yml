title: Disable Windows Event Logging Via Registry
id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
status: test
description: Detects tampering with the "Enabled" registry key in order to 
  disable Windows logging of a Windows event channel
references:
- https://twitter.com/WhichbufferArda/status/1543900539280293889
- https://github.com/DebugPrivilege/CPP/blob/c39d365617dbfbcb01fffad200d52b6239b2918c/Windows%20Defender/RestoreDefenderConfig.cpp
author: frack113, Nasreddine Bencherchali (Nextron Systems)
date: 2022-07-04
modified: 2024-03-25
tags:
- attack.defense-evasion
- attack.t1562.002
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\'
    TargetObject|endswith: '\Enabled'
    Details: 'DWORD (0x00000000)'
  filter_main_wevutil:
    Image: 'C:\Windows\system32\wevtutil.exe'     # FP generated during installation of manifests via wevtutil
  filter_main_iis:
    Image|startswith: 'C:\Windows\winsxs\'
    Image|endswith: '\TiWorker.exe'      # Many different TargetObjects
  filter_main_svchost:
    Image: 'C:\Windows\System32\svchost.exe'
    TargetObject|contains:
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-FileInfoMinifilter'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-ASN1\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Kernel-AppCompat\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Runtime\Error\'
    - '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-CAPI2/Operational\'
  filter_main_trusted_installer:
    Image: C:\Windows\servicing\TrustedInstaller.exe
    TargetObject|contains: '\Microsoft\Windows\CurrentVersion\WINEVT\Channels\Microsoft-Windows-Compat-Appraiser'
  filter_optional_empty:   # This filter is related to aurora. Should be removed when fix is deployed. # TODO: Remove later
    Image: ''
  filter_optional_null:   # This filter is related to aurora. Should be removed when fix is deployed. # TODO: Remove later
    Image:
  condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
- Rare falsepositives may occur from legitimate administrators disabling 
  specific event log for troubleshooting
level: high
note: |
  ### Technical Context

  This Sigma rule detects unauthorized modifications to the Windows registry that disable event logging for specific Windows event channels. Such behavior is indicative of an attacker attempting to evade detection during a compromise, potentially aiming to hide their activities from security monitoring tools. This aligns with the MITRE ATT&CK tactic "Defense Evasion" (T1562) and the technique "Impair Defenses" (T1562.002).

  The primary telemetry source for this detection is the Windows Registry, specifically changes to the `Enabled` registry key located under `\Microsoft\Windows\CurrentVersion\WINEVT\Channels\`. If malicious, the impact could be severe, allowing attackers to operate undetected. It is crucial to note that this detection does not confirm active exploitation of a system; it only indicates that a registry change impacting logging capability has occurred.

  ### Investigation Steps

  - **Verify the registry change:** Use PowerShell or Registry Editor to check for changes to `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\WINEVT\Channels\<ChannelName>\Enabled`. Look for a DWORD value of `0` (indicating logging is disabled).

  - **Review recent administrative activities:** Search Security Event ID 4672 (Special privileges assigned to new logon) to identify any legitimate administrative actions taken around the same time as the registry modification. This helps differentiate between benign and potentially malicious changes.

  - **Cross-reference process execution:** Investigate Sysmon Event ID 1 (Process Creation) for `wevtutil.exe`, `trustedinstaller.exe`, and `svchost.exe` to assess if these processes executed around the event and their parent processes. Malicious activity is indicated if these processes were executed by non-legitimate accounts.

  - **Look for alert patterns:** Check for other related events in the Event Viewer, particularly in the Security and Application logs, for signs of manipulation or attempts to disable security measures (Event IDs 4616, 4740).

  - **Correlate with external threat intelligence:** Search for known indicators of compromise associated with registry tampering or evading logging measures that might indicate a broader attack context or actor.

  ### Prioritization

  This alert has a high severity due to its impact on systems crucial for monitoring and forensics. The likelihood of malicious abuse is significant as such behavior is frequently associated with initial access and lateral movement phases of an attack. This tactic is commonly weaponized to conceal actions during intrusions.

  ### Blind Spots and Assumptions

  Detection may be limited by inherent delays in registry auditing or administrative actions that occur during legitimate troubleshooting. The alert could be triggered by IT personnel modifying logging settings for maintenance, thus creating potential noise in the alerts. It is important to have configurations that ensure all relevant registry changes are logged effectively. Supplementary detections, such as tracking event log clearing (T1070.001), may further enhance coverage and context for investigation.

