detection:
  selection:
    TargetObject|contains:
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\'
    - '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\'
  filter_main_empty_string:
    Details: ''
  filter_main_empty_value:
    Details: '(Empty)'
  filter_main_null:
    Details:
  condition: selection and not 1 of filter_main_*
falsepositives:
- Legitimate custom SHIM installations will also trigger this rule
level: medium
note: |
  ### Technical Context
  This detection rule identifies potential persistence mechanisms employed by adversaries through modifications to the Shim Database in Windows. The Shim Database is part of the Microsoft Windows Application Compatibility Framework and is used to enable older applications to function correctly on newer versions of the OS. By tampering with this database, attackers can create malicious shims that may trigger arbitrary code execution when specific applications are run, thus maintaining persistent access or escalating privileges within the environment.

  The primary objectives of attackers implementing such tactics include establishing long-term persistence on compromised systems and potentially obtaining elevated privileges. This aligns with the MITRE ATT&CK framework, specifically targeting techniques such as "Application Layer Protocol" (T1546.011) under the "Persistence" and "Privilege Escalation" tactics. By modifying shim components, adversaries can exploit inherent compatibility features to execute payloads imperceptibly.

  Relevant telemetry for detecting these activities will primarily come from Windows Registry logs, as modifications to the Shim Database occur in system registry paths. Monitoring registry changes can therefore yield crucial insights into potential adversary activities.

  ### Investigation Steps
  - **Review Registry Change Logs:** Examine logs for any modifications made to the registry keys associated with Application Shim, specifically the paths `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\` and `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\`.
  - **Correlate with Process Execution Events:** Investigate process creation logs around the same timestamps as the registry modifications to identify any suspicious application launches that may be tied to the new shims.
  - **Check for Anomalous Behavior:** Look for any unexpected application behavior or crashes that coincide with the installation of new shims to determine if malicious payloads are being executed.
  - **Audit System for Known Malicious Shims:** Compare any identified shims against known malicious indicators or threat intelligence reports to assess the likelihood of compromise.

  ### Prioritization
  This alert should be considered medium severity in an enterprise environment due to the potential risk of privilege escalation and persistence that attackers could achieve through shim modifications. The likelihood of exploitation can increase if the organization operates many legacy applications that rely on the compatibility framework.

  ### Blind Spots and Assumptions
  The detection may not cover all legitimate applications that utilize custom shims for backward compatibility, potentially leading to false positives. Furthermore, the rule assumes that registry logging is adequately configured to capture relevant changes, and if these logs are not stored or monitored, actual malicious activity could go undetected. Analysts must ensure that the appropriate logging settings are in place for effective detection.

