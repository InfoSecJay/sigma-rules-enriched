note: |
  ### Technical Context

  This Sigma rule detects the creation or modification of registry keys related to the Microsoft Windows Application Compatibility Framework's shim database (SDB). Such behavior is indicative of an adversary attempting to establish persistence or escalate privileges by exploiting application shims to execute malicious payloads under the guise of legitimate applications. The relevant MITRE ATT&CK technique is **Application Layer Protocol** (T1546.011).

  The primary telemetry source for this detection is Windows Registry logs, specifically focusing on the `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\` and `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\` paths. If malicious, the creation of these keys can facilitate ongoing access to the system and potential lateral movement. It is crucial to note that this detection does NOT confirm malicious activity on its own, as legitimate custom SHIM installations can also trigger the rule.

  ### Investigation Steps

  - **Review registry activity:** Check for recent changes to `HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\` and `Custom\` using Windows Security Event ID 4657 or using Sysmon Event ID 13 to assess creation/modification details.

  - **Identify unusual executables:** Analyze the executables linked to any SDB keys, focusing on their paths and hashes. Legitimate SHIM modifications typically involve well-known applications; examine for any obscured or unusual executables that may indicate malicious intent.

  - **Correlate with process creation events:** Utilize Sysmon Event ID 1 to correlate any process creation events that coincide with registry modifications. Look for signs of processes that were executed via shims that do not align with standard application behavior.

  - **Monitor user privileges:** Review user account activity that led to the registry change, focusing on Security Event IDs 4728 (added to admin group) or 4672 (special privileges assigned) to assess if elevated privileges were achieved.

  - **Evaluate historical logs:** Look for patterns in previous SDB manipulations; legitimate entries typically maintain consistent modification patterns over time, whereas malware indicators may show erratic or unique changes.

  - **Cross-reference threat intelligence:** Assess any known indicators or techniques linked to recent threat actor activity involving shims via threat intelligence feeds or Intel platforms to identify if recent alerts correlate with known adversaries.

  ### Prioritization

  This alert should be treated as medium severity due to the potential for significant impact on the integrity of the affected system. The likelihood of malicious abuse is plausible, as tampering with shim databases can enable adversaries to maintain persistence or elevate privileges. While not universally weaponized, the technique is increasingly used by sophisticated threat actors.

  ### Blind Spots and Assumptions

  Legitimate activities such as software updates or custom application installations may trigger this alert, leading to potential false positives. Detection limitations include the inherent difficulty in differentiating between benign and malicious modifications without context. Ensure logging is adequately configured to capture all relevant registry modifications. A companion detection for application shim exploitation is monitoring for unusual child processes resulting from modified shims, reinforcing coverage against this type of persistence technique.

