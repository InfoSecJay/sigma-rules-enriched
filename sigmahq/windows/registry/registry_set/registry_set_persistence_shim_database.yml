note: |
  ### Technical Context

  This detection identifies modifications to the Windows registry that relate to Application Shim databases, which can be a method for adversaries to establish persistence or escalate privileges within a system. The attacker typically aims to execute malicious payloads whenever specific applications are launched, leveraging the Application Compatibility Framework to bypass security mechanisms.

  Relevant MITRE ATT&CK tactics include "Persistence" (TA0003) and "Privilege Escalation" (TA0004), specifically targeting the technique of "Application Layer Shimming" (T1546.011). Primary telemetry sources are Windows Registry logs focusing on modifications within the paths `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\` and `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\`. If malicious, these actions can enable ongoing access and control over the affected systems.

  It is important to note that while this detection signifies registry modifications that may indicate malicious activity, it does NOT confirm an active compromise or exploitation without further analysis.

  ### Investigation Steps

  - **Review registry modifications:** Examine Windows registry logs for Event ID 4663, focusing specifically on changes to `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\` and `\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\`. Look for abnormal or unauthorized entries that are not consistent with known safe applications.

  - **Correlate with process execution:** Cross-reference Event ID 4688 (process creation) to determine if any processes are spawned in direct relation to the SDB modifications. Pay particular attention to any non-standard applications or executable paths triggered simultaneously.

  - **Identify known benign configurations:** Document and whitelist known custom SHIM installations that are legitimate within the environment, as these may trigger the detection rule. Identify usual applications or workflows tied to these legitimacies.

  - **Assess user and asset criticality:** Determine the roles of the affected systems and users. Systems with elevated privileges or critical data access should escalate responses if modifications are detected, as they pose greater risk if compromised.

  - **Look for behavior indicative of exploitation:** Check logs for unusual access times or patterns that may suggest malicious actors are utilizing the shims to execute payloads. Files with unusual extensions or created as a result of the shim modification may indicate malicious activity.

  - **Evaluate for additional malicious indicators:** Investigate for related detections or alerts, especially those flagged under the ATT&CK framework. Companions such as process injection or anomalous network activity (via logs like Windows Security or Sysmon) can corroborate or provide additional context for the activity.

  ### Prioritization

  This alert is of medium severity due to the potential for escalated privileges and persistence on critical systems. While the likelihood of malicious abuse exists, many legitimate activities trigger this rule. Close monitoring and validation of context are essential to determine the true nature of the behavior.

  ### Blind Spots and Assumptions

  Detection may be limited by user system configurations that do not generate detailed registry logs, and legitimate third-party applications can trigger this alert. Analysts should be aware that custom SHIM installations may result in false positives. Companion alerts for "Process Injection" (T1055) or abnormal "User Account Control" behavior could enhance detection capabilities and improve contextual understanding of activity related to this rule.

