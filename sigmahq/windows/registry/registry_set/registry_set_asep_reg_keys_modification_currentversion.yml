    - 'C:\Program Files\Common Files\Microsoft Shared\ClickToRun\'
    - 'C:\Program Files (x86)\Common Files\Microsoft Shared\ClickToRun\'
    Image|endswith: '\OfficeClickToRun.exe'
  filter_optional_teams:
    Image|endswith: '\Microsoft\Teams\current\Teams.exe'
    Details|contains: '\Microsoft\Teams\Update.exe --processStart'
  filter_optional_AVG_setup:
    Image|contains:
    - 'C:\Program Files\AVG\Antivirus\Setup\'
    - 'C:\Program Files (x86)\AVG\Antivirus\Setup\'
    - '\instup.exe'
    Details:
    - '"C:\Program Files\AVG\Antivirus\AvLaunch.exe" /gui'
    - '"C:\Program Files (x86)\AVG\Antivirus\AvLaunch.exe" /gui'
    - '{472083B0-C522-11CF-8763-00608CC02F24}'
    - '{472083B1-C522-11CF-8763-00608CC02F24}'
  filter_optional_Avast:
    Image|contains:
    - 'C:\Program Files\Avast Software\Avast\Setup\'
    - 'C:\Program Files (x86)\Avast Software\Avast\Setup\'
    - '\instup.exe'
    Details:
    - '"C:\Program Files\Avast Software\Avast\AvLaunch.exe" /gui'
    - '"C:\Program Files (x86)\Avast Software\Avast\AvLaunch.exe" /gui'
  filter_optional_AVG_avgtoolsvc:
    Image:
    - 'C:\Program Files\AVG\Antivirus\avgToolsSvc.exe'
    - 'C:\Program Files (x86)\AVG\Antivirus\avgToolsSvc.exe'
    TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Explorer\StartupApproved\Run\'
    Details: 'Binary Data'
  filter_optional_aurora_dashboard:
    Image|endswith:
    - '\aurora-agent-64.exe'
    - '\aurora-agent.exe'
    TargetObject|endswith: '\Microsoft\Windows\CurrentVersion\Run\aurora-dashboard'
    Details: 'C:\Program Files\Aurora-Agent\tools\aurora-dashboard.exe'
  filter_optional_everything:
    TargetObject|endswith: '\Microsoft\Windows\CurrentVersion\Run\Everything'
    Details|endswith: '\Everything\Everything.exe" -startup'     # We remove the starting part as it could be installed in different locations
  filter_optional_discord:
    TargetObject|endswith: '\Software\Microsoft\Windows\CurrentVersion\Run\Discord'
    Details|endswith: '\Discord\Update.exe --processStart Discord.exe'
  condition: all of selection_* and not 1 of filter_main_* and not 1 of 
    filter_optional_*
falsepositives:
- Legitimate software automatically (mostly, during installation) sets up 
  autorun keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context

  This Sigma rule detects modifications to autostart extensibility points (ASEPs) in the Windows registry, specifically within the `CurrentVersion` sections related to startup items. Attackers often exploit ASEPs to establish persistence on compromised systems, ensuring their malicious payloads execute automatically upon system start. The relevant MITRE ATT&CK techniques for this behavior are Persistence (T1547.001) and Privilege Escalation (T1547). Primary telemetry sources include Windows registry modifications captured through Registry Set logs. If malicious, this behavior could enable unauthorized access or control over the affected system. However, this detection alone does NOT confirm malicious intent; legitimate modifications by software or administrators can occur.

  ### Investigation Steps

  - **Verify registry modification details:**
    Check Windows Security Event ID 4657 logs for `TargetObject` paths and `Details` fields that match identified autostart keys (e.g., `\Run\`, `\RunOnce\`). Compare these against known legitimate applications and expected configurations.

  - **Identify the process performing the modification:**
    Review associated Security Event ID 4688 logs to determine the `Image` and `CommandLine` fields that show which process initiated the registry change. Ensure it’s not a common administrative task or known software responsible for such behavior.

  - **Assess legitimacy of the modifying application:**
    Cross-reference process names and paths with known legitimate applications. Suspicious modifications can stem from unusual or unexpected executables, especially from non-standard locations.

  - **Analyze frequency and pattern of modifications:**
    Examine the timeline of registry changes to detect repetitive modifications that could indicate malware attempting to restore its entries after removal. Frequent changes associated with unknown processes may highlight malicious behavior.

  - **Identify potential unrelated legitimate behavior:**
    Consider legitimate software, like Microsoft Teams or OneDrive, that might automatically modify autostart keys. Corresponding actions during installation or updates are often benign. Investigate context to validate user actions supporting these changes.

  ### Prioritization

  This alert has medium severity due to its impact on a critical system function - the registry controlling startup processes. The likelihood of malicious abuse is medium as attackers commonly leverage persistence techniques, especially if detected behaviors align with known threat patterns or adversary tools.

  ### Blind Spots and Assumptions

  Detection may miss modifications occurring quickly and undetected due to rapid changes or evasion tactics that bypass standard logging. Required log sources must capture complete registry activities, including those performed by local administrators. Additionally, legitimate software installations may trigger this alert, necessitating a careful contextual review. Another helpful detection is observing abnormal process creation patterns (e.g., Event ID 4688) to complement this analysis and enhance coverage of anomalous persistence activities.

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
