falsepositives:
- Legitimate software automatically (mostly, during installation) sets up autorun
  keys for legitimate reason
- Legitimate administrator sets up autorun keys for legitimate reason
level: medium
note: |
  ### Technical Context
  This detection rule focuses on the modification of autostart extensibility points (ASEPs) in the Windows registry, specifically targeting keys under `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion`. Modifying these registry keys is a common tactic used by malicious actors to ensure persistence for their malware, allowing it to execute automatically on system startup without user intervention. Attackers typically aim to gain prolonged access, maintain control over compromised systems, or execute malicious code as a means of establishing a foothold within the network.

  The relevant MITRE ATT&CK tactics associated with this behavior are:
  - **Persistence** (T1547): The ability to maintain a presence on a system after initial access has been achieved.
  - **Privilege Escalation** (T1068): Modifying registry keys can sometimes escalate the privileges of the executing code, allowing attackers to gain further control over the environment.

  The primary data sources for the best evidence of such activity include Windows registry change logs and system event logs that capture registry modifications, allowing analysts to review changes made to autorun keys effectively.

  ### Investigation Steps
  - **Review Registry Logs**: Check the Windows registry logs for any modifications to keys within `HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion`, focusing on entries such as `Run`, `RunOnce`, and other specified ASEPs.

  - **Analyze Process Tree**: Analyze the process tree around the time of the modification to identify if a legitimate application initiated the change or if it was triggered by a malicious executable, including command line arguments for potential malicious activity.

  - **Correlate Event IDs**: Look for Windows Event IDs related to registry modifications (e.g., 4657 for registry key modification) to correlate timeline events and detect any suspicious patterns indicating exploitation.

  - **Identify Unusual Software**: Identify any newly modified or newly created scripts or executables in conjunction with the autorun modifications to establish a relationship between them, particularly focusing on those with unusual paths or signatures.

  ### Prioritization
  The severity of this alert is medium because while legitimate modifications can occur for valid administrative tasks, sudden or unexpected changes to autorun keys can indicate an attempt at persistence by a malicious actor. The likelihood of such modifications leading to system compromise makes monitoring essential.

  ### Blind Spots and Assumptions
  This detection rule may not capture all instances of malicious autorun modifications, particularly if attackers employ obfuscation techniques or if they modify keys that are not covered by the specified filters. There is an assumption that proper logging and auditing are enabled, as the absence of detailed registry logging could result in missed detections. Additionally, legitimate software and system administrators may create similar autorun entries, which could lead to false positives. Ensuring the logging of registry changes is crucial for the efficacy of this alert.

