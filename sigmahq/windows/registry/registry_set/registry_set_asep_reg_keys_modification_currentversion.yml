note: |
  ### Technical Context

  This Sigma rule detects modifications to autostart extensibility points (ASEPs) within the Windows registry, specifically under the key path `\SOFTWARE\Microsoft\Windows\CurrentVersion`. Attackers often manipulate these registry keys to establish persistence, enabling their malicious payloads to execute automatically upon system startup or user logon. The relevant MITRE ATT&CK tactic is **Persistence**, specifically technique **T1547.001** (Registry Run Keys / Startup Folder).

  The primary telemetry sources are Windows registry change logs, specifically focusing on registry operations that modify keys under the mentioned path. If malicious, this behavior could lead to persistent access and control of the affected system, posing significant risks to the organization. Importantly, this detection does NOT confirm malicious intent on its own, as legitimate applications and administrative tasks frequently modify these registry settings.

  ### Investigation Steps

  - **Check the registry modification details:**
    Review Windows Security Event ID 4657 or Sysmon Event ID 13 for the `TargetObject` path and the `Image` field that indicates the process responsible for the modification. Look for unexpected or suspicious entries that do not conform to known good configuration.

  - **Identify the modifying process:**
    Examine the `Image` field alongside the `Details` attribute of the registry modification to determine which executable made the changes. Legitimate applications typically originate from known Microsoft directories or common application paths.

  - **Correlate timestamps with user activity:**
    Cross-reference the modification timestamp with user logon events (Security Event ID 4624) to evaluate if the registry change aligns with any legitimate activities or scheduled tasks that have occurred.

  - **Analyze for high-confidence malicious indicators:**
    Look for registry modifications associated with known malware. For example, an update initiated by a process like `cmd.exe` that attempts to create autorun entries for untrusted software can indicate malicious activity. Investigate unusual paths or filenames within `Images` that resemble well-documented malware behavior.

  - **Document legitimate autostart behaviors:**
    Record known legitimate software that may modify these keys, such as antivirus software, backup tools, or user-installed applications. UC the registry key modifications against established baselines for normal operations.

  - **Verify for exfiltration activity:**
    If applicable, check for any command-line arguments in the `Details` field that hint at file creation and exfiltration tasks, e.g., commands for removing directories or files that could indicate a cleanup of traces post-compromise.

  ### Prioritization

  The severity of this alert is **medium**. If successful, a malicious modification could allow an adversary to maintain persistence on a critical system, facilitating further attacks. The likelihood of abuse is moderate, as persistence mechanisms such as these are frequently targeted by both opportunistic and sophisticated threat actors.

  ### Blind Spots and Assumptions

  Detection of registry changes can be bypassed by using alternative persistence mechanisms, such as Scheduled Tasks or WMI Event Subscriptions. Reliable detection depends on properly configured logging within the Windows environment; absence of necessary logs may obscure legitimate activity that triggers this alert. Common legitimate activities include standard user application installations or updates that may set up autorun keys. A related detection to strengthen coverage could focus on Scheduled Task modifications (MITRE ATT&CK T1053).

  > **Disclaimer:** This investigation guide was created using generative AI technology and has not been reviewed for its accuracy and relevance. While every effort has been made to ensure its quality, we recommend validating the content and adapting it to suit specific environments and operational needs. Please communicate any changes to the detection engineering team.
