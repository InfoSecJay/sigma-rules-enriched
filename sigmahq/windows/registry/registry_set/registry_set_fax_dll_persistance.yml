  ### Technical Context

  This Sigma rule detects changes to the Fax service registry keys that reference the `fxst30.dll`, indicating potential persistence mechanisms that an adversary may leverage. By modifying the registry entries associated with the Fax service, the attacker may seek to execute malicious code during service restarts, facilitating continual access or lateral movement within the environment.

  The behavior aligns with the MITRE ATT&CK framework under the tactics of **Persistence** (TA0003) and **Defense Evasion** (TA0005), specifically technique **Registry Run Keys / Startup Folder** (T1112). The primary telemetry sources include Windows registry change logs and associated Event IDs, particularly focusing on alterations within the `HKEY_LOCAL_MACHINE\Software\Microsoft\Fax\Device Providers\` path.

  If malicious, this detection suggests an active attempt to maintain control over a compromised system. Importantly, the detection does NOT confirm malicious intent on its own, as legitimate applications may also modify these keys under certain circumstances.

  ---

  ### Investigation Steps

  - **Examine registry changes for authorized modifications**: Review registry changes specifically at `HKEY_LOCAL_MACHINE\Software\Microsoft\Fax\Device Providers\` (Registry Set Logs) to identify if a legitimate application has modified these keys. Compare the timestamps against known software installation or updates to confirm legitimacy.

  - **Identify suspicious values in device provider entries**: Look for non-standard `ImageName` values referencing `fxst30.dll` under the Fax registry keys (Event ID 4657). Benign entries typically reference recognized providers; any unknown or suspicious DLLs could indicate malicious persistence.

  - **Verify startup behavior of the Fax service**: Check Windows Service Control Manager logs (Event ID 7036) to determine if the Fax service was recently started or stopped. Legitimate service behavior includes scheduled maintenance or user-initiated actions.

  - **Correlate changes with process execution**: Use Sysmon (Event ID 1) to cross-reference the time of registry changes with process creation events to establish if `fxst30.dll` was executed. Any process creation involving `fxst30.dll` by a non-standard or unexpected parent process is a strong malicious indicator.

  - **Review the security context of the host**: Consider the criticality of the affected host. If it serves essential business functions or handles sensitive data, escalate the findings due to potential impact.

  ---

  ### Prioritization

  This alert is highly severe in an enterprise context because it reflects a potential mechanism for persistence that could allow an adversary to maintain access to sensitive systems. The likelihood of malicious abuse is significant, given the association with known persistence techniques, making it a critical alert that warrants prompt investigation.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include the potential for legitimate applications or systems to modify registry entries for valid reasons, leading to false positives. Additional logging configurations may be necessary to capture full context around registration changes and process execution. Common legitimate interactions that may trigger this alert include software updates or administrative changes to the Fax service. A companion detection rule could focus on monitoring detailed process execution related to service startups or unusual DLL loads to strengthen overall surveillance of potential adversary actions.

