  ### Technical Context

  This Sigma rule detects modifications to the Windows registry that indicate a potential persistence mechanism using the Fax DLL (fxst30.dll). The behavior typically involves an attacker aiming to maintain access to a compromised system or execute malicious payloads upon service restarts. The relevant MITRE ATT&CK tactic is **Persistence** (T1053.005) with the technique being **Modify Registry** (T1112). The primary telemetry sources are Windows registry logs, specifically monitoring changes under the registry path `\Software\Microsoft\Fax\Device Providers\`. If malicious, this behavior can lead to unauthorized access and control over systems exploiting fax services. It is important to note that this detection does NOT confirm that the behavior alone is malicious without further context.

  ### Investigation Steps

  - **Check for registry modification:** Query registry events (Event ID 4657) for recent modifications to `\Software\Microsoft\Fax\Device Providers\`. Review `NewValue` and `PreviousValue` fields for unusual changes, particularly targeting fxst30.dll.

  - **Validate process execution:** Look for associated process creation events (Event ID 4688 or Sysmon Event ID 1) that reference fxst30.dll. Confirm the parent process and command line for suspicious execution paths.

  - **Assess service behavior:** Review Windows service logs (Event ID 7045) for any new or modified services related to fax operations. Legitimate services exhibit expected names and descriptions that align with organizational policies.

  - **Identify unauthorized DLL usage:** Check for other known malicious DLLs in conjunction with fxst30.dll in the registry modifications. Cross-reference against threat intelligence feeds or internal blocklists.

  - **Confirm typical fax server activity:** Establish a baseline of expected activity for the fax service. Legitimate users should not frequently alter registry settings or cause unexpected processes to run.

  ### Prioritization

  Given the high level of privilege often associated with registry modifications and the potential for persistence, alerts generated by this rule should be considered high priority. The likelihood of malicious abuse is significant, as attackers often exploit such mechanisms for stealthy, long-term access. This behavior is not commonly observed in standard operational procedures, rendering it a serious concern.

  ### Blind Spots and Assumptions

  Detection may be limited by the accuracy of registry logging; ensuring adequate log retention policies are in place is crucial. Attackers may utilize legitimate admin tools or scripts to manipulate DLL settings, creating possible false positives. Additionally, legitimate user activities that involve misconfigured fax settings may trigger the alert. A related detection that strengthens coverage includes monitoring for suspicious access to other critical registry keys associated with persistence techniques (such as `\Software\Microsoft\Windows\CurrentVersion\Run`).

