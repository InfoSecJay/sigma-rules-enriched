note: |
  ### Technical Context
  This rule detects potential attempts to establish persistence on Windows systems by monitoring for changes to the Fax DLL registry settings. Attackers may manipulate the Fax service to load a malicious DLL upon service restart, allowing them to maintain access or execute additional malicious activities without detection. The objective of such actions typically includes stealthy persistence, maintaining control over a compromised system, or evading defenses.

  In terms of the MITRE ATT&CK framework, this behavior relates to the **Persistence** tactic (TA0003), specifically the **DLL Search Order Hijacking** technique (T1112). By modifying the registry settings associated with the Fax service, an attacker can strategically place their malicious payload, making it likely to execute during the service lifecycle.

  The primary data sources for monitoring these activities are Windows registry change logs, which can alert on modifications made to registry keys associated with the Fax service, along with potentially relevant telemetry from process creation events that may indicate unusual execution patterns related to the fax service.

  ### Investigation Steps
  - **Review Registry Changes:** Examine recent changes to registry keys under `HKEY_LOCAL_MACHINE\Software\Microsoft\Fax\Device Providers\` for any unauthorized modifications that reference `fxst30.dll` or other unusual DLLs.
  - **Analyze Process Creation Events:** Investigate process creation logs (e.g., using EDR telemetry) to identify any instances where the Fax service launches the untrusted DLL, and correlate this with timestamps of registry changes.
  - **Conduct File Integrity Monitoring:** Check the integrity of `fxst30.dll` and other related DLL files within the system32 directory, looking for anomalies or signs of tampering that may indicate malicious replacements.
  - **Correlate with Other Events:** Look for associated lateral movement or abnormal login attempts that may have occurred in conjunction with the DLL changes to paint a clearer picture of the attack narrative and its objectives.

  ### Prioritization
  This alert carries a **high** severity due to its potential to facilitate long-term unauthorized access and control within an enterprise environment, which significantly heightens the risk of further exploitation and data breaches if left unaddressed.

  ### Blind Spots and Assumptions
  One limitation of the detection logic is that it primarily focuses on changes to specific registry keys, which may not capture all avenues of attack used to establish persistence. The detection assumed that the Fax service is present and actively used within the enterprise environment, leading to potential false negatives if the telemetry is not adequately configured. Comprehensive registry logging and associated process creation logs are critical to ensure the alert functions effectively and provides accurate visibility.

