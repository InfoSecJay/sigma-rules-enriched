  ### Technical Context

  This Sigma rule detects potential manipulation of the Fax DLL (`fxst30.dll`) in the Windows registry associated with persistence mechanisms used by attackers. The likely attacker objective is to alter the function of the Fax service to maintain persistence or execute malicious payloads upon service restart. This behavior aligns with the MITRE ATT&CK techniques of Persistence (T1112).

  The primary telemetry source for this detection is the Windows registry, specifically monitoring changes under the `HKEY_LOCAL_MACHINE\Software\Microsoft\Fax\Device Providers\` path. If the behavior is malicious, it could enable an adversary to persistently execute code, compromising the affected system and potentially providing a foothold in the network. However, this detection does not confirm that malicious activity is occurring; legitimate configurations or operational changes could trigger this alert.

  ### Investigation Steps

  - **Verify registry changes:** Check for Event ID 4657 (Registry value modified) related to `HKEY_LOCAL_MACHINE\Software\Microsoft\Fax\Device Providers\`. Focus on modifications that point to `fxst30.dll`, indicating potential malicious persistence.

  - **Identify associated processes:** Review Event ID 4688 (Process creation) for any instances where processes reference `fxst30.dll` post-registry change. Malicious activity may involve uncommon executable names or unusual command line parameters.

  - **Assess DLL signing:** Validate the digital signature of `fxst30.dll` using its file properties. Legitimate versions should be signed by Microsoft; unsigned or unusual signatures may indicate tampering.

  - **Document expected behaviors:** Compare the registry changes against baseline system configurations from known good systems. Documenting legitimate uses of fax services can aid in determining if the change was necessary for legitimate operations.

  - **Correlate with other logs:** Cross-reference any network traffic related to the Fax service (if applicable). Monitor for outbound connections or suspicious API calls that could signify an attempt to exploit manipulations of the Fax service.

  - **Monitor for lateral movement indicators:** If a device is a file or print server, note any anomalous network activity or lateral movement following the registry changes that suggest exploitation or further actions by the attacker.

  ### Prioritization

  This alert has a high severity due to the potential impact on enterprise operations and the ability for attackers to maintain a presence within the network. The manipulation of system services, especially those related to communication like fax, could be weaponized for lateral movement or data exfiltration. Given the nature of persistence mechanisms, it is critical to respond swiftly.

  ### Blind Spots and Assumptions

  Detection of this behavior may be limited by legitimate administrative changes that require similar registry modifications. It is essential to ensure that registry auditing is appropriately configured to capture detailed activity, as missed logs could result in false negatives. Legitimate software installations or updates may also trigger this alert. A related detection to enhance coverage would be monitoring for process injections or service modifications (T1543) in conjunction with any registry changes.

