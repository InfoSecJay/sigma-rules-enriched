logsource:
  category: registry_set
  product: windows
detection:
  selection_shadow:
    TargetObject|contains:
    - '\Control\Terminal Server\'
    - '\Windows NT\Terminal Services\'
    TargetObject|endswith: '\Shadow'
    Details:
    - 'DWORD (0x00000001)'         # Full Control with user’s permission
    - 'DWORD (0x00000002)'         # Full Control without user’s permission
    - 'DWORD (0x00000003)'         # View Session with user’s permission
    - 'DWORD (0x00000004)'         # View Session without user’s permission
  selection_terminal_services_key:
    TargetObject|contains:
    - '\Control\Terminal Server\'
    - '\Windows NT\Terminal Services\'
    TargetObject|endswith:
    - '\DisableRemoteDesktopAntiAlias'         # Disable anti-aliasing for remote desktop (DarkGate malware)
    - '\DisableSecuritySettings'         # Disable security settings, allowing access to programs/entire desktop (DarkGate malware)
    - '\fAllowUnsolicited'         # Allow unsolicited remote assistance offers
    - '\fAllowUnsolicitedFullControl'
    Details: 'DWORD (0x00000001)'
  selection_tamper_only:
        # Any changes to these keys should be suspicious and looked at
    TargetObject|contains:
    - '\Control\Terminal Server\InitialProgram'         # This value can be set to specify a program to run automatically when a user logs on to a remote computer.
    - '\Control\Terminal Server\WinStations\RDP-Tcp\InitialProgram'         # This value can be set to specify a program to run automatically when a user logs on to a remote computer.
    - '\services\TermService\Parameters\ServiceDll'         # RDP hijacking
    - '\Terminal Server\WinStations\RDP-Tcp\SecurityLayer'
    - '\Windows NT\Terminal Services\InitialProgram'         # This value can be set to specify a program to run automatically when a user logs on to a remote computer.
  filter_main_securitylayer_tls:
    TargetObject|endswith: '\SecurityLayer'
    Details: 'DWORD (0x00000002)'     # TLS Enabled
  condition: (selection_shadow or selection_terminal_services_key or 
    selection_tamper_only) and not 1 of filter_main_*
falsepositives:
- Some of the keys mentioned here could be modified by an administrator while 
  setting group policy (it should be investigated either way)
level: high
note: |
  ### Technical Context

  This rule detects changes to sensitive RDP (Remote Desktop Protocol) settings in the Windows Registry, specifically monitoring modifications to keys that control remote access permissions and security. The likely attacker objective is to enable unauthorized RDP access, potentially facilitating persistence and lateral movement within a network. The relevant MITRE ATT&CK tactic is **Persistence** (TA0003), specifically the technique for **RDP Hijacking** (T1112).

  The primary telemetry source is Windows Registry event logs capturing changes to keys under `\Control\Terminal Server\` and `\Windows NT\Terminal Services\`. If malicious, these changes could lead to unauthorized access or allow attackers to control user sessions. This detection does NOT confirm malicious intent on its own, as legitimate administrative actions may also trigger these alerts.

  ### Investigation Steps

  - **Review RDP Settings Modifications:** Check any recent changes to the registry keys associated with RDP, specifically `TargetObject` containing `\Control\Terminal Server\` or `\Windows NT\Terminal Services\`, focusing on keys such as `fAllowUnsolicited`, `DisableSecuritySettings`, and `ServiceDll`. Log Event IDs for monitoring are 4662 (Object Access) and monitoring registry changes through Sysmon Event ID 13.

  - **Identify the User Context of Changes:** Confirm the user account associated with the registry modifications. Cross-reference against user roles; unexpected changes by non-administrator accounts may indicate a malicious act.

  - **Examine Concurrent Session Activity:** Look for active RDP sessions around the time of the detected changes, noted by event logs showing successful RDP logins (Event ID 4624). Multiple login attempts or simultaneous sessions may indicate suspicious activity.

  - **Compare against Baseline Settings:** Validate the changes against a baseline configuration of legitimate RDP settings for affected assets. Legitimate administrative actions may include scheduled updates or policy deployments; investigate any anomalies closely.

  - **Monitor for RDP Shadowing and Invocations:** If shadowing is enabled (specifically `Shadow` keys), inspect logs for shadowing activity (Event ID 4688) indicating unauthorized use of the shadow feature. High confidence malicious indicators may include unexpected sessions initiated without user consent.

  - **Assess Related Malicious Indicators:** Check for known malware signatures or past alerts linked to the modified settings. Investigate any correlation with reported threats related to RDP hijacking or related malware families.

  ### Prioritization

  This alert is of high severity due to the critical nature of RDP settings. RDP is a common attack vector that can be exploited for unauthorized access, making it a frequently weaponized tactic by adversaries. The potential impact of unauthorized changes can lead to significant breaches if not mitigated promptly.

  ### Blind Spots and Assumptions

  Detection may be limited by misconfigurations in logging, especially if not all necessary keys are monitored consistently. There may be false positives from legitimate administrative activities such as group policy updates. Additionally, sophisticated attackers may employ evasion techniques, such as modifying keys and quickly reverting updates. A related detection is changes to Windows Firewall settings (Event ID 2004 and associated log types) that may indicate an attacker adjusting network access post-compromise.

