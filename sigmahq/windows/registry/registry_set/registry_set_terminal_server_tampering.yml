logsource:
  category: registry_set
  product: windows
detection:
  selection_shadow:
    TargetObject|contains:
    - '\Control\Terminal Server\'
    - '\Windows NT\Terminal Services\'
    TargetObject|endswith: '\Shadow'
    Details:
    - 'DWORD (0x00000001)'         # Full Control with user’s permission
    - 'DWORD (0x00000002)'         # Full Control without user’s permission
    - 'DWORD (0x00000003)'         # View Session with user’s permission
    - 'DWORD (0x00000004)'         # View Session without user’s permission
  selection_terminal_services_key:
    TargetObject|contains:
    - '\Control\Terminal Server\'
    - '\Windows NT\Terminal Services\'
    TargetObject|endswith:
    - '\DisableRemoteDesktopAntiAlias'         # Disable anti-aliasing for remote desktop (DarkGate malware)
    - '\DisableSecuritySettings'         # Disable security settings, allowing access to programs/entire desktop (DarkGate malware)
    - '\fAllowUnsolicited'         # Allow unsolicited remote assistance offers
    - '\fAllowUnsolicitedFullControl'
    Details: 'DWORD (0x00000001)'
  selection_tamper_only:
        # Any changes to these keys should be suspicious and looked at
    TargetObject|contains:
    - '\Control\Terminal Server\InitialProgram'         # This value can be set to specify a program to run automatically when a user logs on to a remote computer.
    - '\Control\Terminal Server\WinStations\RDP-Tcp\InitialProgram'         # This value can be set to specify a program to run automatically when a user logs on to a remote computer.
    - '\services\TermService\Parameters\ServiceDll'         # RDP hijacking
    - '\Terminal Server\WinStations\RDP-Tcp\SecurityLayer'
    - '\Windows NT\Terminal Services\InitialProgram'         # This value can be set to specify a program to run automatically when a user logs on to a remote computer.
  filter_main_securitylayer_tls:
    TargetObject|endswith: '\SecurityLayer'
    Details: 'DWORD (0x00000002)'     # TLS Enabled
  condition: (selection_shadow or selection_terminal_services_key or selection_tamper_only)
    and not 1 of filter_main_*
falsepositives:
- Some of the keys mentioned here could be modified by an administrator while setting
  group policy (it should be investigated either way)
level: high
note: |
  ---

  ### Technical Context

  This Sigma rule detects unauthorized changes to critical Remote Desktop Protocol (RDP) settings, such as enabling unsolicited remote assistance or altering security configurations that could expose systems to exploitation. The likely attacker objective is to gain unauthorized access or perform session hijacking on targets through modified settings. This behavior is relevant to the MITRE ATT&CK technique **T1112: Modify Registry**.

  The primary telemetry sources include Windows Registry logs that capture registry key modifications, notably `Control\Terminal Server\` and `Windows NT\Terminal Services\`. If these changes were made maliciously, the security impact is significant, potentially allowing unauthorized access and remote control of systems. However, this detection does not confirm that an attack is in progress on its own; legitimate administrative changes could trigger the alert.

  ---

  ### Investigation Steps

  - **Verify the registry modifications:** Check logs for Windows Event ID 4657 (Registry Value Modified) for keys under `\Control\Terminal Server\` or `\Windows NT\Terminal Services\`. Look for modifications to `fAllowUnsolicited`, `fDenyTSConnections`, or `SecurityLayer`. Legitimate changes should include valid admin identifiers and timestamps that align with scheduled maintenance tasks.

  - **Assess user account activity:** Investigate recent logins and account activity linked to administrators as seen in Security Event ID 4624. Look for anomalies such as unexpected admin logins outside of typical hours or from unusual IP addresses that may indicate adversarial use.

  - **Check for concurrent suspicious process execution:** Correlate any registry changes with System Process Event IDs 4688 (Process Creation) to identify if any processes associated with RDP clients or unauthorized tools were running at the same time, such as remote administration tools or known malware signatures.

  - **Correlate impacted asset criticality:** Determine the asset role for the machines that have these registry keys modified. Highly critical assets (e.g., servers), when changed, should raise the prioritization of the investigation due to potential greater impacts if compromised.

  - **Identify high-confidence malicious indicators:** Look for the presence of unusual `ServiceDll` configurations under `\services\TermService\Parameters\ServiceDll`, which may point to RDP hijacking techniques. Malicious values such as URLs or executables unrelated to the system should be flagged.

  - **Scan for anti-virus/EDR alerts:** Review alerts from EDR solutions or anti-virus tools for detections of recent unauthorized attempts to utilize altered RDP settings, especially during times when recent registry events logged activity that could be malicious.

  ---

  ### Prioritization

  The alert severity should be considered high due to the potential impact on critical systems through unauthorized remote access. The likelihood of malicious abuse is significant as attackers often exploit RDP settings to maintain persistence or gain further access. This behavior is commonly weaponized in ransomware and other targeted attacks.

  ---

  ### Blind Spots and Assumptions

  Detection limitations include possible legitimate administrative changes that could be confused with malicious intent, requiring thorough contextual investigation. Reliably detecting such changes demands proper logging configurations, especially for context around admin activities. Legitimate activities like GPO applications can trigger this alert. Companion detections such as monitoring for unusual process executions or user access patterns can help strengthen overall threat visibility.

