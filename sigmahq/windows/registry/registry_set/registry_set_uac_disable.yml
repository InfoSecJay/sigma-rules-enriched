note: |
  ### Technical Context
  This rule detects attempts to disable User Account Control (UAC) by monitoring changes to the registry key associated with UAC settings in Windows. UAC is a critical security feature that helps prevent unauthorized changes to the operating system, and disabling it can significantly lower the security posture of the system. Attackers may exploit this vulnerability to achieve privilege escalation and execute malicious software with elevated permissions, making it easier for them to compromise the system.

  The likely attacker objectives include establishing a foothold within the network and evading detection mechanisms, which can facilitate further attacks or lateral movement within the environment. This behavior is associated with the MITRE ATT&CK techniques for privilege escalation (T1548.002) and defense evasion, as disabling UAC directly hinders the security controls designed to protect the system.

  Primary data sources for this detection include Windows registry logs, specifically focusing on changes to the `EnableLUA` registry value. This can be monitored through registry event logs which register when configurations change, alerting security teams to potential malicious activities.

  ### Investigation Steps
  - **Review Registry Changes:** Examine Windows registry logs for modifications to the `\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA` key. Look for entries indicating the value was set to `0` from another value, especially during unusual hours or from non-administrative accounts.

  - **Analyze Process Creation Events:** Investigate process creation events around the time of the registry change. Look for suspicious processes that may have been spawned by an attacker attempting to disable UAC.

  - **Check User Activity Logs:** Review user account activity to identify any unauthorized changes or escalations in privileges, especially from accounts with limited access.

  - **Correlate with Other Security Logs:** Cross-reference findings with other security tools such as EDR or SIEM to identify any anomalies or patterns that coincide with the time frame of the registry change.

  ### Prioritization
  The severity of this alert is medium, as disabling UAC can indicate malicious behavior resulting in increased privileges and potential exploitation of the system. In an enterprise environment, this could lead to widespread compromise if not addressed promptly.

  ### Blind Spots and Assumptions
  There may be gaps in detection coverage if registry logging is not enabled or if the logging level does not capture the necessary events. The detection logic assumes that disabling UAC is malicious in nature, which might not always be the case—some legitimate administrative tasks may require this action. It is essential that registry auditing is properly configured to ensure the relevant logs are generated and available for monitoring.

