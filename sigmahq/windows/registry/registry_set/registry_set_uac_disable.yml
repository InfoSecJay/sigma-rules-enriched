note: |
  ### Technical Context

  This detection identifies attempts to disable User Account Control (UAC) on Windows systems by changing the registry setting `EnableLUA` to 0. The primary objective of an attacker performing this action is to gain elevated privileges and carry out malicious activities without being prompted for administrative approval. This behavior aligns with the MITRE ATT&CK tactic of Privilege Escalation (TA0004) and technique T1548.002 (Domain Policy Modification).

  The primary telemetry source for this detection is Windows Registry change logs, specifically looking for modifications to the key located at `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA`. If successful, an attacker could install malware or change critical system settings without alerting the user. It is important to note that this detection does NOT confirm that the action is indeed malicious; it requires further investigation to ascertain intent and context.

  ### Investigation Steps

  - **Check Registry Path:** Examine the registry settings at `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System\` for the `EnableLUA` key. Look for a value of 0, which indicates UAC has been disabled.

  - **Review Surrounding Events:** Investigate Windows Security Event ID 4657 for changes made to the registry, specifically filtering by object: `HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA`. Look for associated changes to other security settings that may indicate a larger attack vector.

  - **Identify User Context:** Determine the user account that made the change by analyzing Event ID 4688 (Process Creation) within a timeframe closely matched to the registry change. A non-administrative user attempting this action can indicate suspicious activity.

  - **Assess Legitimate Use Cases:** Compare the `EnableLUA` setting against known organizational policies. For example, if certain testing or development environments legitimately disable UAC, document those use cases to rule out false positives.

  - **Correlate with Other Alerts:** Look for related detection alerts, such as those detecting unusual process creations or file modifications around the same timeframe, to establish a pattern indicative of a coordinated attack.

  - **Evaluate Asset Criticality:** Consider the role of the affected system within the environment. Changes to UAC settings on critical servers (e.g., domain controllers or application servers) pose a higher risk than on non-critical endpoints.

  ### Prioritization

  This alert is considered medium severity. If the system where UAC is disabled has sensitive data or is a critical asset, the potential impact is high. The likelihood of malicious intent is elevated given that disabling UAC is commonly exploited in privilege escalation attacks, thus warranting timely response.

  ### Blind Spots and Assumptions

  Detection may be limited if registry change logs are not properly configured or if there are time gaps in logging entries. Legitimate software installation and administrative processes may occasionally disable UAC, creating potential false positives. Related alerts, such as those for unauthorized process creations (e.g., Event ID 4688) that occur shortly after changes to UAC, can strengthen detection capabilities and provide additional context to the investigation.

