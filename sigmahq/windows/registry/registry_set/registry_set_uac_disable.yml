note: |
  ### Technical Context

  This Sigma rule detects attempts by an attacker to disable User Account Control (UAC) on a Windows system by setting the "EnableLUA" registry value to 0. Disabling UAC can lower the security posture of a system, allowing for easier privilege escalation and exploitation of higher-privilege operations. The relevant MITRE ATT&CK techniques this rule highlights are T1548.002 (Abuse Elevation Control Mechanism: Disable UAC).

  The primary telemetry source required for this detection is Windows registry set logs, which can be captured through Sysmon or direct Windows event logs. If malicious, the impact can lead to undetected elevated privileges for attackers, reducing the effectiveness of system defenses. This detection does not confirm that an attack has necessarily occurred, as legitimate administrative actions to disable UAC for specific purposes can also trigger this alert.

  ### Investigation Steps

  - **Review registry changes for UAC:** Check for Registry Set events (Event ID 13 in Sysmon) pertaining to the path `\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA` and verify the value set to DWORD 0 (indicating UAC is disabled).

  - **Assess system role and context:** Determine the role of the system (e.g., workstation vs. server) to contextualize whether UAC being disabled is appropriate based on the organization's security policy. For instance, disabling UAC on a server may be much more concerning than on a development workstation.

  - **Identify legitimate administrative actions:** Refer to recent administrative activities, such as software installations or updates, which may have involved intentional UAC adjustments; these would typically be documented in activity logs or change management systems.

  - **Check for additional suspicious registry modifications:** Investigate other related registry key changes, especially under the same path or associated settings (e.g., `ConsentPromptBehaviorAdmin`), looking for similar anomalous values that could indicate a broader attack.

  - **Correlate with user behavior:** Analyze user activity around the alert time to identify potentially malicious behavior, such as unfamiliar user accounts or unusual login patterns, especially if UAC was disabled without prior notice or policy adherence.

  - **Identify known malicious indicators:** Look for known malware signatures or persistence mechanisms that exploit disabled UAC, such as registry keys or file paths commonly associated with malware activity post-UAC disablement.

  ### Prioritization

  This alert has moderate severity in an enterprise context due to the potential high impact of compromised systems if UAC is disabled. The likelihood of malicious abuse is significant, as this technique is commonly weaponized in attacks seeking to escalate privileges or evade detection.

  ### Blind Spots and Assumptions

  Detection limitations include the possibility of legitimate UAC modifications by administrators, which may trigger this alert without malicious intent. Reliable detection requires accurate logging of registry changes; ensure Sysmon is properly configured. Activities like software installations or system updates may lead to UAC being disabled legitimately. A related detection to consider is monitoring for other privilege escalation techniques, such as attempts to create scheduled tasks with elevated permissions (MITRE T1053).

