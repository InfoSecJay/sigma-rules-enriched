note: |
  ### Technical Context

  This Sigma rule detects attempts to disable User Account Control (UAC) by modifying the Windows registry key `EnableLUA` to a value of 0. Attackers typically aim to weaken system defenses to escalate privileges and bypass security controls. This behavior aligns with the MITRE ATT&CK framework, specifically Technique T1548.002: *Abuse Elevation Control Mechanism*. The primary telemetry source for this detection is registry modification logs from Windows, which capture changes made to registry keys and values. If successful, disabling UAC severely impacts endpoint security by allowing unauthorized programs to execute with elevated privileges. This detection alone does not confirm that malicious activity has occurred; legitimate administrative changes may also trigger this event.

  ### Investigation Steps

  - **Review registry modification logs:** Analyze the Windows Security Event ID 4657 logs to find changes to the `EnableLUA` key. Look for entries showing the key path `\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA` and confirm the value set to `0`.

  - **Correlate with user actions:** Check the Windows Event ID 4624 to identify the account responsible for the registry change. Look for any associated user account logins that precede the modification, especially for accounts lacking administrative permissions.

  - **Investigate system role and permissions:** If changes originated from a non-administrative user account on a critical server, consider this a strong indicator of malicious behavior, as normal user accounts should not alter UAC settings.

  - **Validate legitimate UAC changes:** Examine recent administrative tasks or policy updates documented in logs, such as Event ID 4704 (for privilege use), to determine if the UAC modification correlates with standard IT procedures.

  - **Assess for subsequent behavior:** Look for execution of scripts or binaries that commonly target UAC disablement, such as those with names including "cmd", "powershell", or third-party installer tools logged in Process Creation Event ID 4688.

  - **Identify potential persistence mechanisms:** Review both the registry and scheduled task entries (Event ID 4698) following the UAC modification. Malicious actors may attempt to establish persistent access using these mechanisms post-UAC disablement.

  ### Prioritization

  This alert is of medium severity. The impact is significant if a critical system's UAC is disabled, enabling an attacker to gain elevated privileges. The likelihood of malicious abuse is high, as disabling UAC is a common tactic for privilege escalation in modern attacks.

  ### Blind Spots and Assumptions

  This detection may be evaded if attackers use alternate methods of modifying UAC settings without logging, such as through custom scripts that modify registry settings without triggering security events. Reliable detection requires that Windows auditing is enabled to capture registry changes. Legitimate activities, including configuration changes during system updates, could trigger this alert. A related detection, such as monitoring for the execution of power management commands (e.g., PowerShell commands that influence system settings), could reinforce detection efficacy.

